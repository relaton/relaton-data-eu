  script: Latn
  content: Council Decision (EU) 2020/954 of 25 June 2020 on the position to be taken
    on behalf of the European Union within the International Civil Aviation Organization
    as regards the notification of voluntary participation in the Carbon Offsetting
    and Reduction Scheme for International Aviation (CORSIA) from 1 January 2021 and
    the option selected for calculating aeroplane operators’ offsetting requirements
    during the 2021-2023 period
  type: main
- language: fr
  script: Latn
