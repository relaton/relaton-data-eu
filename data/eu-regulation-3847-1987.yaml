title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3847/87 of 22 December 1987 establishing
    the list of vessels exceeding eight metres length overall and permitted to use
    within certain coastal areas of the Community beam trawls whose aggregate length
    exceeds eight metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3847/87 de la Commission du 22 décembre 1987 établissant
    la liste des bateaux dont la longueur hors tout dépasse huit mètres autorisés
    à pêcher dans certaines zones côtières de la Communauté à l' aide de chaluts
    à perches dont la longueur totale dépasse huit mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3847/87 der Kommission vom 22. Dezember 1987 zur Festlegung
    der Liste der Schiffe mit einer Länge über alles von mehr als 8 m, die in bestimmten
    Küstengebieten der Gemeinschaft mit Baumkurren fischen dürfen, deren Gesamtbaumlänge
    mehr als 8 m beträgt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3847/87 af 22. december 1987 om listen
    over fartøjer med en længde overalt på over 8 m, der i visse af Fællesskabets
    kystområder har tilladelse til at anvende bomtrawl, hvis samlede bomlængde overstiger
    8 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3847/87 της Επιτροπής
    της 22ας Δεκεμβρίου 1987 που καταρτίζει τον κατάλογο
    των σκαφών συνολικού μήκους άνω των οκτώ μέτρων
    τα οποία επιτρέπεται να αλιεύουν σε ορισμένες
    παράκτιες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα οκτώ μέτρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3847/87 della Commissione del 22 dicembre 1987 che
    fissa l' elenco dei pescherecci di lunghezza fuori tutto superiore a otto metri,
    autorizzati ad usare, in determinate zone costiere della Comunità, reti a strascico
    a pali, la cui lunghezza complessiva superi gli otto metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3847/87 van de Commissie van 22 december 1987 tot
    vaststelling van de lijst van vaartuigen met een lengte over alles van meer dan
    acht meter en die in bepaalde kustzones van de Gemeenschap boomkorren mogen gebruiken
    waarvan de totale boomlengte meer dan acht meter bedraagt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3847/87 da Comissão de 22 de Dezembro de 1987 que
    estabelece a lista dos navios com mais de oito metros de comprimento de fora a
    fora autorizados a utilizar em determinadas zonas costeiras da Comunidade redes
    de arrasto de vara em que o comprimento total das varas seja superior a oito metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3847/87 de la Comisión de 22 de diciembre de 1987
    por el que se establece la lista de barcos cuya eslora total excede los ocho metros
    y a los que se autoriza para faenar dentro de determinadas zonas costeras de la
    Comunidad utilizando artes de arrastre de vara cuya longitud total supere los
    ocho metros
  type: main
