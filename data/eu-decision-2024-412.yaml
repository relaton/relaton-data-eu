  script: Latn
  content: Council Decision (EU) 2024/412 of 16 January 2024 on the signing, on behalf
    of the Union, and provisional application of the Protocol to the Euro-Mediterranean
    Agreement establishing an Association between the European Communities and their
    Member States, of the one part, and the Arab Republic of Egypt, of the other part,
    on a Framework Agreement between the European Union and the Arab Republic of Egypt
    on the general principles for the participation of the Arab Republic of Egypt
    in Union programmes
  type: main
- language: fr
