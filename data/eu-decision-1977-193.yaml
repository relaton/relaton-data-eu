title:
- language: en
  script: Latn
  content: Commission Decision of 3 February 1977 authorizing the United Kingdom not
    to apply Community treatment to cotton tents falling within heading No ex 62.04
    of the Common Customs Tariff, originating in Czechoslovakia and in free circulation
    in Ireland
  type: main
- language: fr
  script: Latn
  content: '77/193/CEE: Décision de la Commission, du 3 février 1977, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tentes de coton, de
    la position Ex 62.04 du Tarif douanier commun, originaires de Tchécoslovaquie
    et mises en libre pratique en Irlande'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. Februar 1977, mit der das Vereinigte
    Königreich ermächtigt wird, aus der Tschechoslowakei stammende und in Irland
    im freien Verkehr befindliche Zelte aus Baumwolle der Tarifnummer ex 62.04 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. februar 1977 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage telte af bomuld, som henhører
    under pos. ex 62.04 i den fælles toldtarif, har oprindelse i Tjekkoslovakiet
    og frit kan omsættes i Irland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 febbraio 1977, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario le tende da campeggio di cotone
    della voce ex 62.04 della tariffa doganale comune, originarie della Cecoslovacchia
    e messe in libera pratica in Irlanda
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 februari 1977 waarbij het Verenigd Koninkrijk
    wordt gemachtigd tenten van katoen, van post ex 62.04 van het gemeenschappelijk
    douanetarief, van oorsprong uit Tsjechoslowakije en in Ierland in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
