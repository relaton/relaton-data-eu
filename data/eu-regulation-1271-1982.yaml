title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1271/82 of 26 May 1982 re-establishing the
    levying of customs duties on other bovine cattle leather, falling within subheading
    41.02 ex C and originating in India, to which the preferential tariff arrangements
    in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1271/82 de la Commission, du 26 mai 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres cuirs
    et peaux de bovins de la sous-position 41.02 ex C du tarif douanier commun, originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1271/82 der Kommission vom 26. Mai 1982 zur Wiedereinführung
    der Erhebung der Zölle für anderes Rind- und Kalbleder der Tarifstelle 41.02
    ex C, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1271/82 af 26. maj 1982 om genindførelse
    af opkrævning af told for andet læder af kvæghuder henhørende under pos. 41.02
    ex C og med oprindelse i Indien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1271/82 τής Επιτροπής
    τής 26ης Μαΐου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά έτερα σκύτη καί δέρματα τής
    διακρίσεως 41. 02 ex Γ τού Κοινού Δασμολογίου,
    καταγωγής Ινδίας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1271/82 della Commissione, del 26 maggio 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli altri cuoi e pelli
    di bovini della sottovoce 41.02 ex C della tariffa doganale comune, originari
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3601/81 del Consigliob
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1271/82 van de Commissie van 26 mei 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander leder
    en voorgelooide huiden en vellen van postonderverdeling 41.02 ex C van oorsprong
    uit India, waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleendr
  type: main
