  script: Latn
  content: Regolamento di esecuzione (UE) 2021/547 della Commissione del 29 marzo
    2021 che modifica il regolamento di esecuzione (UE) 2019/1715 per quanto riguarda
    le procedure per l’istituzione e l’uso dell’ADIS e dell’EUROPHYT, il rilascio
    di certificati sanitari, certificati ufficiali, certificati sanitari/ufficiali
    e documenti commerciali in formato elettronico, l’uso di firme elettroniche
    e il funzionamento del Traces, e che abroga la decisione 97/152/CE
  type: main
- language: lv
  script: Latn
