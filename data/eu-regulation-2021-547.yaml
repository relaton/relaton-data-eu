    veterināro sertifikātu, oficiālo sertifikātu, veterināro/oficiālo sertifikātu
    un tirdzniecības dokumentu izdošanu, elektronisko parakstu izmantošanu un TRACES
    darbību groza Īstenošanas regulu (ES) 2019/1715 un atceļ Lēmumu 97/152/EK
  type: main
- language: lt
  script: Latn
