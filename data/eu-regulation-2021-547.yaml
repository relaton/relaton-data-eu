title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/547 of 29 March 2021 amending
    Implementing Regulation (EU) 2019/1715 as regards procedures for the establishment
    and use of ADIS and EUROPHYT, the issuance of electronic animal health certificates,
    official certificates, animal health/official certificates and commercial documents,
    the use of electronic signatures, and the functioning of TRACES, and repealing
    Decision 97/152/EC
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/547 de la Commission du 29 mars 2021
    modifiant le règlement d’exécution (UE) 2019/1715 en ce qui concerne les procédures
    relatives à la mise en place et à l’utilisation d’ADIS et d’Europhyt,
    la délivrance de certificats zoosanitaires, de certificats officiels, de certificats
    zoosanitaires/officiels et de documents commerciaux électroniques, l’utilisation
    de signatures électroniques et le fonctionnement de Traces, et abrogeant la décision
    97/152/CE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/547 der Kommission vom 29. März 2021
    zur Änderung der Durchführungsverordnung (EU) 2019/1715 in Bezug auf die Verfahren
    für die Einrichtung und Nutzung von ADIS und EUROPHYT, die Ausstellung von elektronischen
    Veterinärbescheinigungen, amtlichen Bescheinigungen, Veterinär-/amtlichen Bescheinigungen
    und Handelspapieren, die Verwendung elektronischer Signaturen und die Funktionsweise
    von TRACES sowie zur Aufhebung der Entscheidung 97/152/EG
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/547 на Комисията
    от 29 март 2021 година за изменение на Регламент
    за изпълнение (ЕС) 2019/1715 по отношение на процедурите
    за създаване и използване на ADIS и EUROPHYT, издаването
    на електронни ветеринарни здравни сертификати,
    официални сертификати, ветеринарни здравни/официални
    сертификати и търговски документи, използването
    на електронни подписи и функционирането на
    TRACES и за отмяна на Решение 97/152/ЕО
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/547 ze dne 29. března 2021,
    kterým se mění prováděcí nařízení (EU) 2019/1715, pokud jde o postupy
    pro zřízení a používání systémů ADIS a EUROPHYT, vydávání elektronických
    veterinárních osvědčení, úředních osvědčení, veterinárních/úředních
    osvědčení a obchodních dokladů, používání elektronických podpisů a
    fungování systému TRACES, a kterým se zrušuje rozhodnutí 97/152/ES
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/547 af 29. marts 2021
    om ændring af gennemførelsesforordning (EU) 2019/1715 for så vidt angår procedurer
    for oprettelsen og anvendelsen af ADIS og EUROPHYT, udstedelsen af elektroniske
    dyresundhedscertifikater, officielle certifikater, dyresundhedscertifikater/officielle
    certifikater og handelsdokumenter, anvendelsen af elektroniske signaturer og driften
    af Traces og om ophævelse af beslutning 97/152/EF
  type: main
- language: el
  script: Grek
