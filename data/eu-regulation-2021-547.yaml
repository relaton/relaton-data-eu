    fir-rigward tal-proċeduri għall-istabbiliment u l-użu tal-ADIS u tal-EUROPHYT,
    il-ħruġ ta’ ċertifikati elettroniċi tas-saħħa tal-annimali, ċertifikati
    uffiċjali, ċertifikati uffiċjali/tas-saħħa tal-annimali u dokumenti kummerċjali,
