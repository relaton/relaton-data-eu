    ADIS ir EUROPHYT sukūrimo ir naudojimo tvarkos, elektroninių veterinarijos sertifikatų,
    oficialių sertifikatų, veterinarijos arba oficialių sertifikatų ir prekybos
    dokumentų išdavimo, elektroninių parašų naudojimo ir sistemos TRACES veikimo
    ir panaikinamas Sprendimas 97/152/EB
  type: main
- language: mt
  script: Latn
