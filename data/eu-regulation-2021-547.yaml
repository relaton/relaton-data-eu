    maaliskuuta 2021, täytäntöönpanoasetuksen (EU) 2019/1715 muuttamisesta siltä
    osin kuin on kyse menettelyistä ADIS-järjestelmän ja EUROPHYT-järjestelmän
    perustamiseksi ja käyttämiseksi, sähköisten eläinterveystodistusten, virallisten
    todistusten, yhdistettyjen eläinterveys- ja virallisten todistusten ja kaupallisten
    asiakirjojen myöntämisestä, sähköisten allekirjoitusten käytöstä ja TRACES-järjestelmän
    toiminnasta sekä päätöksen 97/152/EY kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/547 ón gCoimisiún an 29 Márta
    2021 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2019/1715 a mhéid a bhaineann
    le nósanna imeachta chun ADIS agus EUROPHYT a bhunú agus a úsáid, deimhnithe
    leictreonacha sláinte ainmhithe, deimhnithe oifigiúla, deimhnithe sláinte ainmhithe/oifigiúla
    agus doiciméid tráchtála a eisiúint, sínithe leictreonacha a úsáid, agus
    feidhmiú TRACES, agus lena n-aisghairtear Cinneadh 97/152/CE
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/547 оd 29. ožujka 2021. o izmjeni
    Provedbene uredbe (EU) 2019/1715 u pogledu postupaka za uspostavu i uporabu sustavâ
    ADIS i EUROPHYT, izdavanja elektroničkih certifikata o zdravlju životinja, službenih
    certifikata, certifikata o zdravlju životinja/službenih certifikata i komercijalnih
    isprava, upotrebe elektroničkih potpisa i funkcioniranja sustava TRACES te o
    stavljanju izvan snage Odluke 97/152/EZ
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/547 végrehajtási rendelete (2021. március 29.)
