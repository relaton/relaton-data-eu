    és használatára, az elektronikus állategészségügyi bizonyítványok, hatósági
    bizonyítványok, állategészségügyi/hatósági bizonyítványok és kereskedelmi
    okmányok kiállítására, az elektronikus aláírások használatára és a
    TRACES működésére vonatkozó eljárások tekintetében történő módosításáról,
    valamint a 97/152/EK határozat hatályon kívül helyezéséről
  type: main
