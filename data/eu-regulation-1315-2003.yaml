title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1315/2003 of 24 July 2003 determining the
    extent to which applications for import licences lodged in respect of subquota
    II for frozen meat of bovine animals, provided for in Regulation (EC) No 780/2003,
    can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1315/2003 de la Commission du 24 juillet 2003 déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées pour le sous-contingent II de viandes bovines congelées, prévu par
    le règlement (CE) n° 780/2003
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1315/2003 der Kommission vom 24. Juli 2003 zur Bestimmung
    des Umfangs, in welchem den Anträgen auf Einfuhrlizenzen für das gemäß der
    Verordnung (EG) Nr. 780/2003 vorgesehene Unterkontingent II für gefrorenes Rindfleisch
    stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1315/2003 af 24. juli 2003 om fastsættelse
    af, i hvilket omfang ansøgningerne om importlicenser for frosset oksekød under
    delkontingent II som fastsat i forordning (EF) nr. 780/2003 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1315/2003 της Επιτροπής,
    της 24ης Ιουλίου 2003, ο οποίος προσδιορίζει σε
    πιο βαθμό μπορούν να ικανοποιηθούν οι αιτήσεις
    για πιστοποιητικά εισαγωγής που κατετέθησαν
    για την υποποσόστωση ΙΙ κατεψυγμένου βοδινού
    κρέατος που προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 780/2003
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1315/2003, annettu 24 päivänä heinäkuuta
    2003, asetuksessa (EY) N:o 780/2003 säädetyn jäädytettyä naudanlihaa koskevan
    osakiintiön II mukaisesti jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1315/2003 della Commissione, del 24 luglio 2003, che
    stabilisce in quale misura possono essere accolte le domande di titoli d'importazione
    presentate per il sotto-contingente II di carni bovine congelate previsto dal
    regolamento (CE) n. 780/2003
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1315/2003 van de Commissie van 24 juli 2003 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen voor invoercertificaten
    voor het in Verordening (EG) nr. 780/2003 bedoelde deelcontingent II voor bevroren
    rundvlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1315/2003 da Comissão, de 24 de Julho de 2003, que
    determina em que medida pode ser dado seguimento aos pedidos de certificados de
    importação apresentados relativamente ao subcontingente II de carne de bovino
    congelada, previsto pelo Regulamento (CE) n.° 780/2003
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1315/2003 de la Comisión, de 24 de julio de 2003,
    por el que se determina en qué medida se podrá dar curso a las solicitudes de
    certificado de importación presentadas en relación con el subcontingente II
    de carne de vacuno congelada previsto en el Reglamento (CE) n° 780/2003
  type: main
- language: sv
  script: Latn
