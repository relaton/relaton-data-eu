title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2021/86 of 22 January 2021 authorising
    the Republic of Lithuania to apply a special measure derogating from Article 287
    of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/86 du Conseil du 22 janvier 2021 autorisant
    la République de Lituanie à appliquer une mesure particulière dérogatoire
    à l’article 287 de la directive 2006/112/CE relative au système commun de
    taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/86 des Rates vom 22. Januar 2021 zur
    Ermächtigung der Republik Litauen, eine von Artikel 287 der Richtlinie 2006/112/EG
    über das gemeinsame Mehrwertsteuersystem abweichende Sondermaßnahme anzuwenden
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/86 на Съвета
    от 22 януари 2021 година за предоставяне на разрешение
    на Република Литва да прилага специална мярка
    за дерогация от член 287 от Директива 2006/112/ЕО
    относно общата система на данъка върху добавената
    стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2021/86, ze dne 22. ledna 2021, kterým
    se Litevské republice povoluje uplatňovat zvláštní opatření odchylující
    se od článku 287 směrnice 2006/112/ES o společném systému daně z přidané
    hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2021/86 af 22. januar 2021 om bemyndigelse
    af Republikken Litauen til at anvende en særlig foranstaltning, der fraviger
    artikel 287 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/86 του Συμβουλίου
    της 22ας Ιανουαρίου 2021 που επιτρέπει στη Δημοκρατία
    της Λιθουανίας να εφαρμόσει ειδικό μέτρο παρέκκλισης
    από το άρθρο 287 της οδηγίας 2006/112/ΕΚ σχετικά
    με το κοινό σύστημα φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2021/86, 22. jaanuar 2021, millega lubatakse
    Leedu Vabariigil kohaldada erimeedet, millega tehakse erand direktiivi 2006/112/EÜ
    (mis käsitleb ühist käibemaksusüsteemi) artiklist 287
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2021/86, annettu 22 päivänä
    tammikuuta 2021, Liettuan tasavallalle annettavasta luvasta soveltaa yhteisestä
    arvonlisäverojärjestelmästä annetun direktiivin 2006/112/EY 287 artiklasta
    poikkeavaa erityistoimenpidettä
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2021/86 od 22. siječnja 2021. kojom se
    Republici Litvi odobrava primjena posebne mjere odstupanja od članka 287. Direktive
    2006/112/EZ o zajedničkom sustavu poreza na dodanu vrijednost
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/86 végrehajtási határozata (2021. január 22.) a
    közös hozzáadottértékadó-rendszerről szóló 2006/112/EK irányelv 287.
    cikkétől eltérő különös intézkedés alkalmazásának a Litván Köztársaság
    számára történő engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/86 del Consiglio del 22 gennaio 2021
    che autorizza la Repubblica di Lituania ad applicare una misura speciale di deroga
    all’articolo 287 della direttiva 2006/112/CE, relativa al sistema comune d’imposta
    sul valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2021/86 (2021. gada 22. janvāris),
    ar ko Lietuvas Republikai atļauj piemērot īpašu pasākumu, atkāpjoties no
    287. panta Direktīvā 2006/112/EK par kopējo pievienotās vērtības nodokļa
    sistēmu
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2021/86 2021 m. sausio 22 d. kuriuo
    Lietuvos Respublikai leidžiama taikyti specialią priemonę, kuria nukrypstama
    nuo Tarybos direktyvos 2006/112/EB dėl pridėtinės vertės mokesčio bendros
    sistemos 287 straipsnio
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2021/86 tat-22 ta’
    Jannar 2021 li tawtorizza lir-Repubblika tal-Litwanja sabiex tapplika miżura
    speċjali ta’ deroga mill-Artikolu 287 tad-Direttiva 2006/112/KE dwar is-sistema
    komuni ta’ taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/86 van de Raad van 22 januari 2021 waarbij
    de Republiek Litouwen wordt gemachtigd een bijzondere maatregel toe te passen
    die afwijkt van artikel 287 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke
    stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2021/86 z dnia 22 stycznia 2021 r. w sprawie
    upoważnienia Republiki Litewskiej do zastosowania szczególnego środka stanowiącego
    odstępstwo od art. 287 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku
    od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/86 do Conselho de 22 de janeiro de 2021
    que autoriza a República da Lituânia a aplicar uma medida especial em derrogação
    do artigo 287.o da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/86 a Consiliului din 22 ianuarie
    2021 prin care Republica Lituania este autorizată să aplice o măsură special
    de derogare de la articolul 287 din Directiva 2006/112/CE privind sistemul comun
    al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2021/86 z 22. januára 2021, ktorým
    sa Litovskej republike povoľuje uplatňovať osobitné opatrenie odchyľujúce
    sa od článku 287 smernice 2006/112/ES o spoločnom systéme dane z pridanej
    hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2021/86 z dne 22. januarja 2021 o dovoljenju
    Republiki Litvi za uporabo posebnega ukrepa, ki odstopa od člena 287 Direktive
    2006/112/ES o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/86 del Consejo de 22 de enero de 2021
    por la que se autoriza a la República de Lituania a aplicar una medida especial
    de excepción a lo dispuesto en el artículo 287 de la Directiva 2006/112/CE relativa
    al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2021/86 av den 22 januari 2021 om bemyndigande
    för Republiken Litauen att tillämpa en särskild åtgärd som avviker från
    artikel 287 i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
