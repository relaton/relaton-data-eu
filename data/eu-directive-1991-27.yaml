title:
- language: en
  script: Latn
  content: Tenth Commission Directive 91/27/EEC of 19 December 1990 amending certain
    Annexes to Council Directive 77/93/EEC on protective measures against the introduction
    into the Member States of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Dixième directive 91/27/CEE de la Commission du 19 décembre 1990 modifiant
    certaines annexes de la directive 77/93/CEE du Conseil concernant les mesures
    de protection contre l'introduction dans les États membres d'organismes nuisibles
    aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Zehnte Richtlinie 91/27/EWG der Kommission vom 19. Dezember 1990 zur Änderung
    bestimmter Anhänge der Richtlinie 77/93/EWG des Rates über Maßnahmen zum Schutz
    gegen das Verbringen von Schadorganismen der Pflanzen oder Pflanzenerzeugnisse
    in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens tiende direktiv 91/27/EØF af 19. december 1990 om ændring
    af visse bilag til Rådets direktiv 77/93/EØF om foranstaltninger mod indslæbning
    i medlemsstaterne af skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Δέκατη Οδηγία 91/27/ΕΟΚ της Επιτροπής της
    19ης Δεκεμβρίου 1990 για την τροποποίηση ορισμένων
    παραρτημάτων της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    για τα μέτρα προστασίας κατά της εισαγωγής
    στα κράτη μέλη οργανισμών επιβλαβών για τα
    φυτά ή τα φυτικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission kymmenes direktiivi 91/27/ETY, annettu 19 päivänä joulukuuta
    1990, kasvien tai kasvituotteiden haitallisten organismien jäsenvaltioihin kulkeutumisen
    estämiseen liittyvistä suojatoimenpiteistä annetun neuvoston direktiivin 77/93/ETY
    tiettyjen liitteiden muuttamisesta
  type: main
- language: it
  script: Latn
  content: Decima Direttiva 91/27/CEE della Commissione del 19 dicembre 1990 che modifica
    taluni allegati della direttiva 77/93/CEE del Consiglio concernente le misure
    di protezione contro l'introduzione negli Stati Membri di organismi nocivi ai
    vegetali o ai prodotti vegetali
  type: main
- language: nl
  script: Latn
  content: Tiende Richtlijn 91/27/EEG van de Commissie van 19 december 1990 tot wijziging
    van enige bijlagen bij Richtlijn 77/93/EEG van de Raad betreffende de beschermende
    maatregelen tegen het binnenbrengen op het grondgebied van de Lid-Staten van voor
    planten of voor plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Décima Directiva 91/27/CEE da Comissão de 19 de Dezembro de 1990 que
    altera determinados anexos da Directiva 77/93/CEE do Conselho, relativa às medidas
    de protecção contra a introdução nos Estados-Membros de organismos prejudiciais
    às plantas ou produtos vegetais
  type: main
- language: es
  script: Latn
  content: Décima Directiva 91/27/CEE de la Comisión de 19 de diciembre de 1990
    que modifica determinados Anexos de la Directiva 77/93/CEE del Consejo relativa
    a las medidas de protección contra las introducción en los Estados Miembros
    de organismos nocivos para los vegetales o productos vegetales
  type: main
- language: sv
  script: Latn
  content: Kommissionens tionde direktiv 91/27/EEG av den 19 december 1990 om ändring
    av vissa bilagor till rådets direktiv 77/93/EEG om skyddsåtgärder mot att skadegörare
    på växter eller växtprodukter förs in till medlemsstaterna
  type: main
