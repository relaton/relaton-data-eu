title:
- language: en
  script: Latn
  content: '85/16/EEC: Commission Decision of 19 December 1984 authorizing the Italian
    Republic to continue to apply certain protective measures pursuant to Article
    108 (3) of the Treaty (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/16/CEE: Décision de la Commission du 19 décembre 1984 autorisant
    la République italienne à poursuivre l''application de certaines mesures de
    sauvegarde conformément à l''article 108 paragraphe 3 du traité CEE (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/16/EWG: Entscheidung der Kommission vom 19. Dezember 1984, mit der
    die Italienische Republik ermächtigt wird, die Anwendung bestimmter Schutzmaßnahmen
    gemäß Artikel 108 Absatz 3 des Vertrages fortzusetzen (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/16/EØF: Kommissionens beslutning af 19. december 1984 om bemyndigelse
    af Den italienske Republik til fortsat at anvende visse beskyttelsesforanstaltninger
    i henhold til traktatens artikel 108, stk. 3 (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/16/ΕΟΚ: Απόφαση της Επιτροπής της 19ης Δεκεμβρίου
    1984 με την οποία εξουσιοδοτείται η Ιταλική Δημοκρατία
    να συνεχίσει την εφαρμογή ορισμένων μέτρων
    διασφάλισης, σύμφωνα με το άρθρο 108 παράγραφος
    3 της συνθήκης ΕΟΚ (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/16/CEE: Decisione della Commissione del 19 dicembre 1984 che autorizza
    la Repubblica italiana a proseguire l''applicazione di talune misure di salvaguardia
    ai sensi dell''articolo 108, paragrafo 3, del trattato CEE (Il testo in lingua
    italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/16/EEG: Beschikking van de Commissie van 19 december 1984 waarbij de
    Italiaanse Republiek overeenkomstig artikel 108, lid 3, van het Verdrag wordt
    gemachtigd de toepassing van bepaalde vrijwaringsmaatregelen voort te zetten (Slechts
    de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '85/16/CEE: Decisão da Comissão, de 19 de Dezembro de 1984, que autoriza
    a República Italiana a prosseguir a aplicação de certas medidas de protecção
    em conformidade com o nº 3 do artigo 108 do Tratado CEE (Apenas faz fé o texto
    em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '85/16/CEE: Decisión de la Comisión, de 19 de diciembre de 1984, por
    la que se autoriza a la República Italiana a continuar la aplicación de determinadas
    medidas de salvaguardia de conformidad con el apartado 3 del artículo 108 del
    Tratado CEE (El texto en lengua italiana es el único auténtico)'
