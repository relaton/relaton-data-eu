  content: Commission Regulation (EEC) No 2693/80 of 21 October 1980 amending Regulation
    (EEC) No 2255/80 laying down detailed rules implementing the system of aid for
    the use of grapes, grape must and concentrated grape must for the manufacture
    of grape juice and fixing the amounts of aid for the 1980/81 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2693/80 de la Commission, du 21 octobre 1980, modifiant
    le règlement (CEE) n° 2255/80 portant modalités d' application du régime d'
    aide à l' utilisation de raisins, de moûts de raisins et de moûts de raisins
    concentrés en vue de l' élaboration des jus de raisins et fixant les montants
    de l' aide pour la campagne viticole 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2693/80 der Kommission vom 21. Oktober 1980 zur Änderung
    der Verordnung (EWG) Nr. 2255/80 über Durchführungsbestimmungen zu der Beihilferegelung
    für die Verwendung von Trauben, Traubenmost und konzentriertem Traubenmost zur
    Herstellung von Traubensaft und zur Festsetzung des Beihilfebetrags für das Weinwirtschaftsjahr
    1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2693/80 af 21. oktober 1980 om ændring
