---
id: EURegulation20222312
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2312 of 25 November 2022 on
    eight-yearly variables in the labour force domain on ‘young people on the labour
    market’, ‘educational attainment – details, including education interrupted
    or abandoned’ and ‘reconciliation of work and family life’ pursuant to Regulation
    (EU) 2019/1700 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2312 de la Commission du 25 novembre
    2022 relatif aux variables octennales dans le domaine de la main-d’œuvre concernant
    les jeunes sur le marché du travail, le niveau d’éducation — détails, y
    compris interruption ou abandon de l’éducation, et la conciliation de la vie
    professionnelle et de la vie familiale conformément au règlement (UE) 2019/1700
    du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2312 der Kommission vom 25. November
    2022 über achtjährliche Variablen im Bereich Arbeitskräfte zu „Junge Menschen
    auf dem Arbeitsmarkt“, „Bildungsstand — Einzelangaben, einschließlich unter-
    oder abgebrochener Ausbildung“ und „Vereinbarkeit von Beruf und Familie“
    gemäß der Verordnung (EU) 2019/1700 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/2312 на Комисията
    от 25 ноември 2022 година относно променливите
    с осемгодишна периодичност в областта на работната
    сила по отношение на „Младите хора на пазара
    на труда“, „Образователна степен — подробна
    информация, включително прекъснато или незавършено
    образование“ и „Съвместяване на професионалния
    и семейния живот“ съгласно Регламент (ЕС) 2019/1700
    на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/2312 ze dne 25. listopadu 2022
    o proměnných shromažďovaných každých osm let v oblasti pracovních sil,
    které se týkají „mladých lidí na trhu práce“, „dosaženého stupně
    vzdělání – podrobných údajů, včetně přerušeného nebo předčasně
    ukončeného vzdělání“ a „sladění pracovního a rodinného života“,
    podle nařízení Evropského parlamentu a Rady (EU) 2019/1700
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/2312 af 25. november
    2022 om otteårige variabler på området arbejdsstyrke om »unge på arbejdsmarkedet«,
    »uddannelsesniveau — nærmere oplysninger, herunder uddannelse, der er afbrudt
    eller opgivet« og »forening af arbejde og familieliv« i henhold til Europa-Parlamentets
    og Rådets forordning (EU) 2019/1700
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/2312 της Επιτροπής
    της 25ης Νοεμβρίου 2022 σχετικά με τις μεταβλητές
    οκταετίας στον τομέα του εργατικού δυναμικού
    για τους «νέους στην αγορά εργασίας», το «επίπεδο
    εκπαίδευσης — λεπτομέρειες, περιλαμβανομένης
    της εκπαίδευσης που έχει διακοπεί ή εγκαταλειφθεί»
    και τον «συνδυασμό εργασίας και οικογενειακής
    ζωής» σύμφωνα με τον κανονισμό (ΕΕ) 2019/1700 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/2312, 25. november 2022, mis käsitleb
    Euroopa Parlamendi ja nõukogu määruse (EL) 2019/1700 kohaselt tööjõu valdkonna
    alamteemade „Noored tööturul“, „Haridustase – üksikasjad, sealhulgas
    katkestatud või pooleli jäetud haridustee“ ja „Töö ja pereelu ühitamine“
    kohta iga kaheksa aasta tagant kogutavaid muutujaid
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/2312, annettu 25 päivänä
    marraskuuta 2022, Euroopan parlamentin ja neuvoston asetuksen (EU) 2019/1700 mukaisista
    työvoiman aihealueen yksityiskohtaisista aiheista ”työmarkkinoilla olevat
    nuoret”, ”koulutustaso – yksityiskohtaiset tiedot, väliaikaisesti tai pysyvästi
    keskeytetyt opinnot mukaan lukien” ja ”työ- ja perhe-elämän yhteensovittaminen”
    kahdeksan vuoden välein kerättävistä muuttujista
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/2312 ón gCoimisiún an 25 Samhain
    2022 maidir le hathróga ocht mbliana i bhfearann an lucht saothair maidir le
    “daoine óga i margadh an tsaothair”, “gnóthachtáil oideachais — sonraí,
    lena n-áirítear oideachas a stopadh nó a tréigeadh” agus “saol na hoibre
    agus saol an teaghlaigh a thabhairt chun réitigh” de bhun Rialachán (AE) 2019/1700
    ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/2312 оd 25. studenoga 2022. o osmogodišnjim
    varijablama u području radne snage za teme „mladi na tržištu rada”, „obrazovno
    postignuće – pojedinosti, uključujući prekid ili napuštanje obrazovanja”
    i „usklađivanje poslovnog i obiteljskog života” u skladu s Uredbom (EU)
    2019/1700 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2312 végrehajtási rendelete (2022. november 25.)
    az (EU) 2019/1700 európai parlamenti és tanácsi rendelet értelmében a „munkaerőpiacon
    jelen lévő fiatalok”, „iskolázottság – részletek, beleértve a félbeszakított,
    illetve abbahagyott képzéseket is” és „a munka és a családi élet összeegyeztethetősége”
    tekintetében a munkaerő tárgykörben alkalmazott nyolcéves változókról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/2312 della Commissione del 25 novembre
    2022 sulle variabili a cadenza di otto anni del dominio delle forze di lavoro
    su «giovani nel mercato del lavoro», «livello di istruzione conseguito —
    dettagli, compresi l’interruzione e l’abbandono dell’istruzione» e «conciliazione
    tra vita familiare e professionale» a norma del regolamento (UE) 2019/1700 del
    Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/2312 (2022. gada 25. novembris)
    par darbaspēka jomas detalizēto tematu “jaunieši darba tirgū”, “izglītības
    līmenis – sīka informācija, tostarp pārtraukta vai izbeigta izglītība”
    un “darba un ģimenes dzīves saskaņošana” astoņu gadu mainīgajiem lielumiem
    saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) 2019/1700
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/2312 2022 m. lapkričio 25
    d. dėl darbo jėgos srities potemių „Jaunimas darbo rinkoje“, „Įgytas
    išsilavinimas (išsami informacija, įskaitant informaciją apie pertrauktą
    arba nebaigtą išsilavinimą)“ ir „Darbo ir šeimos gyvenimo derinimas“
    kas aštuonerius metus pagal Europos Parlamento ir Tarybos reglamentą (ES) 2019/1700
    renkamų kintamųjų
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2312 tal-25
    ta’ Novembru 2022 fir-rigward ta’ varjabbli fuq tmien snin fid-dominju tal-forza
    tax-xogħol dwar iż-“żgħażagħ fis-suq tax-xogħol”, il-“kisba edukattiva
    — dettalji, inkluża l-edukazzjoni interrotta jew abbandunata” u r-“rikonċiljazzjoni
    tax-xogħol mal-ħajja tal-familja” skont ir-Regolament (UE) 2019/1700 tal-Parlament
    Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/2312 van de Commissie van 25 november
    2022 inzake achtjaarlijkse variabelen in het domein “beroepsbevolking” met
    betrekking tot “jongeren op de arbeidsmarkt”, “opleidingsniveau — details,
    met inbegrip van onderbroken of stopgezette studies” en “combinatie van werk
    en gezin” krachtens Verordening (EU) 2019/1700 van het Europees Parlement en
    de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/2312 z dnia 25 listopada 2022
    r. w sprawie zmiennych przekazywanych co 8 lat w dziedzinie „zasoby pracy”
    dotyczących tematów „osoby młode na rynku pracy”, „poziom wykształcenia
    – informacje szczegółowe, z uwzględnieniem przypadków przerwania lub porzucenia
    nauki” oraz „praca a obowiązki rodzinne” zgodnie z rozporządzeniem Parlamentu
    Europejskiego i Rady (UE) 2019/1700
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/2312 da Comissão de 25 de novembro
    de 2022 relativo às variáveis com periodicidade de oito em oito anos no domínio
    população ativa referentes aos «jovens no mercado de trabalho», ao «nível
    de escolaridade completo — detalhes, incluindo interrupção ou abandono da
    educação» e à «conciliação da vida profissional com a vida familiar» nos
    termos do Regulamento (UE) 2019/1700 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/2312 al Comisiei din 25 noiembrie
    2022 privind variabilele colectate o dată la opt ani în domeniul forței de
    muncă pentru „tineri pe piața muncii”, „nivel de instruire – detalii,
    inclusiv educație întreruptă sau abandonată” și „concilierea vieții
    profesionale cu cea familială” în temeiul Regulamentului (UE) 2019/1700 al
    Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/2312 z 25. novembra 2022 o premenných
    zbieraných každých osem rokov v doméne „pracovná sila“ týkajúcich sa
    čiastkových tém „mladí ľudia na trhu práce“, „dosiahnuté vzdelanie
    – podrobnosti vrátane prerušeného alebo predčasne ukončeného vzdelávania“
    a „zosúladenie práce a rodinného života“ podľa nariadenia Európskeho
    parlamentu a Rady (EÚ) 2019/1700
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/2312 z dne 25. novembra 2022 o osemletnih
    spremenljivkah na področju delovne sile za podrobne vsebine „mladi na trgu
    dela“, „izobrazba – podrobnosti, vključno s tem, ali je bilo izobraževanje
    prekinjeno ali opuščeno“ ter „uskladitev poklicnega in družinskega življenja“
    v skladu z Uredbo (EU) 2019/1700 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2022/2312 de la Comisión de 25 de noviembre
    de 2022 sobre las variables que se deben recoger cada ocho años en el ámbito
    de la población activa sobre «los jóvenes en el mercado laboral», «estudios
    terminados: detalles, incluidos la interrupción o abandono de los estudios»
    y «conciliación de la vida laboral con la vida familiar», de conformidad con
    el Reglamento (UE) 2019/1700 del Parlamento Europeo y del Consejo'
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/2312 av den 25 november
    2022 om variabler vart åttonde år inom området arbetskraft om ”Unga på arbetsmarknaden”,
    ”Uppnådd utbildningsnivå – närmare uppgifter, bland annat om avbruten eller
    ej slutförd utbildning” och ”Möjlighet att förena arbete och familjeliv”
    enligt Europaparlamentets och rådets förordning (EU) 2019/1700
  type: main
