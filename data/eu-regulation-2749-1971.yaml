title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2749/71 de la Commission, du 22 décembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux tissus de soie ou de bourre de soie (schappe) de la position tarifaire 50.09
    originaires de l'Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n 1313/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2749/71 der Kommission vom 22. Dezember 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Gewebe aus
    Seide oder Schappeseide der Tarifnummer 50.09, mit Ursprung in Indien, dem die
    in der Verordnung (EWG) Nr. 1313/71 des Rates vom 21. Juni 1971 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2749/71 della Commissione, del 22 dicembre 1971, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    tessuti di seta o di borra di seta (schappe) della voce doganale n. 50.09, originari
    dell'India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1313/71 del Consiglio, del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2749/71 van de Commissie van 22 december 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op weefsels van zijde of van vlokzijde van post 50.09 van oorsprong
    uit India, ten behoeve waarvan de algemene tariefpreferenties gelden, als bepaald
    bij Verordening (EEG) nr. 1313/71 van de Raad van 21 juni 1971
  type: main
