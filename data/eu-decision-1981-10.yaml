title:
- language: en
  script: Latn
  content: '81/10/EEC: Commission Decision of 19 December 1980 determining the regions
    from which Greece may not consign to other Member States any bovine animal or
    swine, or any fresh meat from bovine animals, swine, sheep or goats'
  type: main
- language: fr
  script: Latn
  content: '81/10/CEE: Décision de la Commission, du 19 décembre 1980, établissant
    les régions à partir desquelles la Grèce n'' expédie vers les autres États
    membres aucun animal des espèces bovine et porcine, ni de viandes fraîches des
    espèces bovine, porcine, ovine et caprine'
  type: main
- language: de
  script: Latn
  content: '81/10/EWG: Entscheidung der Kommission vom 19. Dezember 1980 zur Festlegung
    der Gebiete, aus denen Griechenland weder Tiere der Gattungen Rind und Schwein
    noch frisches Fleisch von Rindern, Schweinen, Schafen und Ziegen in die übrigen
    Mitgliedstaaten versendet'
  type: main
- language: da
  script: Latn
  content: '81/10/EØF: Kommissionens beslutning af 19. december 1980 om fastsættelse
    af de områder, hvorfra Grækenland undlader at sende kvæg og svin samt fersk
    okse-, svine-, fåre- eller gedekød til de øvrige medlemsstater'
  type: main
- language: el
  script: Grek
  content: '81/10/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Δεκεμβρίου
    1980 περί καθορισμού τών περιφερειών από τίς
    οποίες η Ελληνική Δημοκρατία δέν αποστέλλει
    πρός τά υπόλοιπα Κράτη μέλη κανένα βοοειδές
    καί χοιροειδές, ούτε νωπά κρέατα τών βοοειδών,
    χοιροειδών, προβατοειδών καί αιγοειδών'
  type: main
- language: it
  script: Latn
  content: '81/10/CEE: Decisione della Commissione, del 19 dicembre 1980, che stabilisce
    regioni da cui la Grecia non spedisce, verso gli altri Stati membri, alcun animale
    delle specie bovina e suina, né carni fresche delle specie bovina, ovina e caprina'
  type: main
- language: nl
  script: Latn
  content: '81/10/EEG: Beschikking van de Commissie van 19 december 1980 tot vaststelling
    van de gebieden waaruit Griekenland geen runderen en varkens en geen vers vlees
    van runderen, varkens, geiten en schapen naar de andere Lid-Staten zendt'
  type: main
- language: es
  script: Latn
  content: '81/10/CEE: Decisión de la Comisión, de 19 de diciembre de 1980, por
    la que se establecen las regiones de Grecia desde las que dicho país no puede
    enviar a otros Estados miembros ningún animal de las especies bovina o porcina,
    ni carne fresca de vacuno, porcino, ovino o caprino'
  type: main
