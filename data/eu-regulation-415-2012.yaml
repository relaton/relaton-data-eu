title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 415/2012 of 15 May 2012 amending
    for the 171st time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the Al Qaida network
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 415/2012 de la Commission du 15 mai 2012
