    3. do kojeg su države članice ovlaštene produžiti valjanost odluka o jednakovrijednosti
    sjemenskog krumpira iz trećih zemalja (priopćena pod brojem dokumenta C(2014)
    3877)'
  type: main
- language: hu
  script: Latn
  content: '2014/367/EU: A Bizottság végrehajtási határozata ( 2014. június 16.
    ) a 2002/56/EK tanácsi irányelvnek a harmadik országokból származó vetőburgonya
    egyenértékűségére vonatkozó határozatok időbeli hatályának kiterjesztésére
    a tagállamok számára a 21. cikk (3) bekezdésében megállapított határidő
    tekintetében történő módosításáról (az értesítés a C(2014) 3877. számú
    dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2014/367/UE: Decisione di esecuzione della Commissione, del 16 giugno
    2014 , che modifica la direttiva 2002/56/CE del Consiglio per quanto riguarda
    la data fissata nell''articolo 21, paragrafo 3, fino alla quale gli Stati membri
    sono autorizzati a prorogare la validità delle decisioni sull''equivalenza dei
    tuberi-seme di patate provenienti da paesi terzi [notificata con il numero C(2014)
    3877]'
  type: main
- language: lv
  script: Latn
  content: '2014/367/ES: Komisijas Īstenošanas lēmums ( 2014. gada 16. jūnijs
    ), ar ko groza Padomes Direktīvu 2002/56/EK attiecībā uz 21. panta 3. punktā
    noteikto datumu, līdz kuram dalībvalstīm ir atļauts pagarināt spēkā esamības
    termiņu lēmumiem par trešo valstu izcelsmes sēklas kartupeļu līdzvērtību
    (izziņots ar dokumenta numuru C(2014) 3877)'
  type: main
- language: lt
  script: Latn
  content: '2014/367/ES: 2014 m. birželio 16 d. Komisijos įgyvendinimo sprendimas,
