id: EUDecision2014367
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2014/367/EU: Commission Implementing Decision of 16 June 2014 amending
    Council Directive 2002/56/EC as regards the date laid down in Article 21(3) until
    which Member States are authorised to extend the validity of decisions concerning
    equivalence of seed potatoes from third countries (notified under document C(2014)
    3877)'
  type: main
- language: fr
  script: Latn
  content: '2014/367/UE: Décision d''exécution de la Commission du 16 juin 2014
    modifiant la directive 2002/56/CE du Conseil en ce qui concerne la date fixée
    à l''article 21, paragraphe 3, jusqu''à laquelle les États membres sont autorisés
    à prolonger la durée de validité des décisions relatives à l''équivalence
    de plants de pommes de terre provenant de pays tiers [notifiée sous le numéro
    C(2014) 3877]'
  type: main
- language: de
  script: Latn
  content: '2014/367/EU: Durchführungsbeschluss der Kommission vom 16. Juni 2014
    zur Änderung der Richtlinie 2002/56/EG des Rates hinsichtlich des Datums gemäß
    Artikel 21 Absatz 3, bis zu dem die Mitgliedstaaten die Gültigkeitsdauer der
    Beschlüsse über die Gleichwertigkeit von Pflanzkartoffeln aus Drittländern
    verlängern dürfen (Bekanntgegeben unter Aktenzeichen C(2014) 3877)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/367/ЕС: Решение за изпълнение на Комисията
    от 16 юни 2014 година за изменение на Директива
    2002/56/ЕО на Съвета по отношение на датата, посочена
    в член 21, параграф 3, до която държавите членки
    имат правото да продължават валидността на
    решенията относно равностойността на посадъчен
    материал от картофи от трети държави (нотифицирано
    под номер С(2014) 3877)'
  type: main
- language: cs
  script: Latn
  content: '2014/367/EU: Prováděcí rozhodnutí Komise ze dne 16. června 2014 ,
    kterým se mění směrnice Rady 2002/56/ES, pokud jde o datum stanovené v čl.
    21 odst. 3, do kterého jsou členské státy zmocněny prodloužit dobu platnosti
    rozhodnutí o rovnocennosti sadby brambor ze třetích zemí (oznámeno pod číslem
    C(2014) 3877)'
  type: main
- language: da
  script: Latn
  content: '2014/367/EU: Kommissionens gennemførelsesafgørelse af 16. juni 2014
    om ændring af Rådets direktiv 2002/56/EF for så vidt angår datoen i artikel
    21, stk. 3, indtil hvilken medlemsstaterne har bemyndigelse til at forlænge gyldigheden
    af beslutninger om ligestilling af læggekartofler fra tredjelande (meddelt under
    nummer C(2014) 3877)'
  type: main
- language: el
  script: Grek
  content: '2014/367/EE: Εκτελεστική απόφαση της Επιτροπής,
    της 16ης Ιουνίου 2014 , για την τροποποίηση της
    οδηγίας 2002/56/ΕΚ του Συμβουλίου όσον αφορά την
    ημερομηνία που ορίζεται στο άρθρο 21 παράγραφος
    3 μέχρι την οποία επιτρέπεται στα κράτη μέλη
    να παρατείνουν την ισχύ των αποφάσεων οι οποίες
    αφορούν την ισοδυναμία των σπόρων γεωμήλων
    προς φύτευση από τρίτες χώρες [κοινοποιηθείσα
    υπό τον αριθμό C(2014) 3877]'
  type: main
- language: et
  script: Latn
