    stipulata fl-Artikolu 21(3) sa meta l-Istati Membri huma awtorizzati jestendu
    l-validità tad-deċiżjonijiet dwar l-ekwivalenza tal-patata taż-żrigħ minn
    pajjiżi terzi (notifikata bid-dokument C(2014) 3877)'
  type: main
- language: nl
  script: Latn
  content: '2014/367/EU: Uitvoeringsbesluit van de Commissie van 16 juni 2014 tot
    wijziging van Richtlijn 2002/56/EG van de Raad wat betreft de in artikel 21, lid
    3, vermelde datum tot wanneer de lidstaten de geldigheidsduur van besluiten betreffende
    de gelijkwaardigheid van pootaardappelen uit derde landen mogen verlengen (Kennisgeving
    geschied onder nummer C(2014) 3877)'
  type: main
- language: pl
  script: Latn
  content: '2014/367/UE: Decyzja wykonawcza Komisji z dnia 16 czerwca 2014 r. zmieniająca
    dyrektywę Rady 2002/56/WE w odniesieniu do terminu wyznaczonego w art. 21 ust.
    3, przed upływem którego państwa członkowskie są upoważnione do przedłużenia
    okresu ważności decyzji w sprawie równoważności sadzeniaków pochodzących
    z państw trzecich (notyfikowana jako dokument C(2014) 3877)'
  type: main
- language: pt
  script: Latn
  content: '2014/367/UE: Decisão de Execução da Comissão, de 16 de junho de 2014
    , que altera a Diretiva 2002/56/CE do Conselho no que respeita à data estabelecida
    no artigo 21. °, n. ° 3, até à qual os Estados-Membros são autorizados a
    prorrogar a eficácia das decisões relativas à equivalência de batatas de semente
    provenientes de países terceiros [notificada com o número C(2014) 3877]'
  type: main
- language: ro
  script: Latn
  content: '2014/367/UE: Decizia de punere în aplicare a Comisiei din 16 iunie 2014
    de modificare a Directivei 2002/56/CE a Consiliului în ceea ce privește data
    prevăzută la articolul 21 alineatul (3) până la care statele membre sunt autorizate
    să prelungească perioada de valabilitate a deciziilor referitoare la echivalența
    cartofilor de sămânță proveniți din țări terțe [notificată cu numărul
    C(2014) 3877]'
  type: main
- language: sk
  script: Latn
  content: '2014/367/EÚ: Vykonávacie rozhodnutie Komisie zo 16. júna 2014 , ktorým
