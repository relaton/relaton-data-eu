    dalyje nurodytos datos, iki kurios valstybėms narėms leidžiama pratęsti sprendimų
    dėl trečiosiose šalyse išaugintų sėklinių bulvių lygiavertiškumo galiojimą
    (pranešta dokumentu Nr. C(2014) 3877)'
  type: main
- language: mt
  script: Latn
  content: '2014/367/UE: Deċiżjoni ta'' Implimentazzjoni tal-Kummissjoni tas- 16
