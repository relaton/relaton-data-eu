    21 ods. 3, do ktorého majú členské štáty povolenie predlžovať platnosť
    rozhodnutí týkajúcich sa rovnocennosti sadiva zemiakov [oznámené pod číslom
    C(2014) 3877]'
  type: main
- language: sl
  script: Latn
  content: '2014/367/EU: Izvedbeni sklep Komisije z dne 16. junija 2014 o spremembi
    Direktive Sveta 2002/56/ES glede datuma, določenega v členu 21(3), do katerega
    se državam članicam dovoli podaljšanje veljavnosti odločitev v zvezi z enakovrednostjo
    semenskega krompirja iz tretjih držav (notificirano pod dokumentarno številko
    C(2014) 3877)'
  type: main
- language: es
  script: Latn
  content: '2014/367/UE: Decisión de Ejecución de la Comisión, de 16 de junio de
    2014 , por la que se modifica la Directiva 2002/56/CE del Consejo en lo que se
    refiere a la fecha establecida en su artículo 21, apartado 3, hasta la cual se
    autoriza a los Estados miembros a prorrogar la validez de las decisiones relativas
    a la equivalencia de las patatas de siembra procedentes de terceros países [notificada
    con el número C(2014) 3877]'
  type: main
- language: sv
  script: Latn
  content: '2014/367/EU: Kommissionens genomförandebeslut av den 16 juni 2014 om
    ändring av rådets direktiv 2002/56/EG vad gäller det datum som anges i artikel
    21.3 fram till vilket medlemsstaterna tillåts utsträcka giltigheten för beslut
