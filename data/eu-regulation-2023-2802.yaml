title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/2802 of 18 December 2023
    concerning the authorisation of a preparation of endo–1,4-beta-xylanase produced
    by Komagataella phaffii ATCC PTA-127053 as a feed additive for all poultry species
    for fattening, breeding, and reared for laying or breeding (holder of authorisation:
    Kemin Europa N.V.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/2802 de la Commission du 18 décembre
    2023 concernant l’autorisation d’une préparation d’endo–1,4-bêta-xylanase
    produite par Komagataella phaffii ATCC PTA-127053 en tant qu’additif dans l’alimentation
    de toutes les espèces de volailles d’engraissement et de reproduction et de
    toutes les espèces de volailles élevées pour la ponte ou la reproduction (titulaire
    de l’autorisation: Kemin Europa N.V.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/2802 der Kommission vom 18. Dezember
