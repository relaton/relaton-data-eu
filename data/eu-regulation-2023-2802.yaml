    aus Endo–1,4-beta-Xylanase als Zusatzstoff in Futtermitteln für alle Mast-
    und Zuchtgeflügelarten und für Jungtiere aller Geflügelarten, die für Lege-
    und Zuchtzwecke bestimmt sind (Zulassungsinhaber: Kemin Europa N.V.)'
  type: main
