    de mesa, o mosto de uvas, o mosto de uvas concentrado e o mosto de uvas concentrado
    rectificado, para a campanha de 1989/1990 #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3793/89 DE LA COMISION de 15 de diciembre de 1989 por
    el que se establece la posibilidad de celebrar contratos de almacenamiento privado
    a largo plazo para el vino de mesa, el mosto de uva concentrado y el mosto de
    uva concentrado rectificado para la campana 1989/90
