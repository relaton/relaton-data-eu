title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3793/89 of 15 December 1989 authorizing
    the conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1989/90 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3793/89 de la Commission du 15 décembre 1989 ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1989/1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3793/89 DER KOMMISSION vom 15. Dezember 1989 zur Eroeffnung
    der Moeglichkeit des Abschlusses von Vertraegen fuer die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifiziertem Traubenmost fuer das Wirtschaftsjahr 1989/1990
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3793/89 af 15. december 1989 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost,
    koncentreret druemost og rektificeret koncentreret druemost for produktionsåret
    1989/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3793/89 της Επιτροπής
    της 15ης Δεκεμβρίου 1989 για την παροχή δυνατότητας
    σύναψης συμφωνητικών μακροπρόθεσμης ιδιωτικής
    αποθεματοποίησης επιτραπέζιου οίνου, συμπυκνωμένου
    γλεύκους σταφυλών και διορθωμένου συμπυκνωμένου
    γλεύκους σταφυλών για την περίοδο 1989/90
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3793/89 DELLA COMMISSIONE del 15 dicembre 1989 che
    concede, per la campagna 1989/1990, la possibilità di concludere contratti di
    magazzinaggio privato a lungo termine per il vino da tavola, il mosto di uve concentrato
    e il mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3793/89 VAN DE COMMISSIE van 15 december 1989 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1989/1990 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3793/89 DA COMISSÃO de 15 de Dezembro de 1989 que
