title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 802/83 of 6 April 1983 re-establishing the
    levying of customs duties on certain stockings, understockings, socks etc., products
    of category 12 (code 0120), originating in Sri Lanka, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 802/83 de la Commission du 6 avril 1983 portant rétablissement
    de la perception des droits de douane applicables à certains bas, sous-bas, chaussettes,
    etc., de la catégorie de produits no 12 (code 0120), originaires de Sri Lanka,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 802/83 der Kommission vom 6. April 1983 über die
    Wiedereinführung des Zollsatzes für bestimmte Strümpfe, Unterziehstrümpfe,
    Socken, usw., der Warenkategorie Nr. 12 (Kennziffer 0120), mit Ursprung in Sri
    Lanka, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 802/83 af 6. april 1983 om genindførelse
    af opkrævning af toldafgifter for bestemte strømper, understrømper, sokker,
    osv. under kategori nr. 12 (kode 0120), som har oprindelse i Sri Lanka og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 802/83 της Επιτροπής
    της 6ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένες
    περικνημίδες, περιπόδια, περιπόδια κοντά (σοσόνια)
    κλπ., της κατηγορίας προϊόντων 12 (κωδικός αριθμός
    0120), καταγωγής Σρι Λάνκα, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 802/83 della Commissione del 6 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili a talune calze, sottocalze, calzini,
    ecc., della categoria di prodotti n. 12 (codice 0120), originari dello Sri Lanka,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 802/83 van de Commissie van 6 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    kousen, onderkousen, sokken, enz. van categorie van produkten nr. 12 (codenummer
    0120), van oorsprong uit Sri Lanka, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
