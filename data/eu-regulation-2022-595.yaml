---
id: EURegulation2022595
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/595 of 11 April 2022 amending
    certain Regulations concerning restrictive measures and setting out a single list
    for the Annexes to those Regulations containing the contact details of Member
    States’ competent authorities and the address for notifications to the European
    Commission
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/595 de la Commission du 11 avril 2022
    modifiant certains règlements relatifs à des mesures restrictives et établissant
    pour les annexes de ces règlements une liste unique contenant les coordonnées
    des autorités compétentes des États membres et l’adresse à utiliser pour
    les notifications à la Commission européenne
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/595 der Kommission vom 11. April 2022
    zur Änderung bestimmter Verordnungen über restriktive Maßnahmen und zur Festlegung
    einer einzigen Liste der Anhänge dieser Verordnungen mit den Kontaktdaten der
    zuständigen Behörden der Mitgliedstaaten und der Anschrift für Notifikationen
    an die Europäische Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/595 на Комисията
    от 11 април 2022 година за изменение на някои регламенти
    за ограничителни мерки и определяне на единен
    списък за приложенията към тези регламенти,
    съдържащи данни за връзка с компетентните
    органи на държавите членки и адреса за изпращане
    на уведомления до Европейската комисия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/595 ze dne 11. dubna 2022, kterým
    se mění některá nařízení týkající se omezujících opatření a stanoví
    jednotný seznam pro přílohy těchto nařízení obsahující kontaktní údaje
    příslušných orgánů členských států a adresu pro účely oznamování
    Evropské komisi
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/595 af 11. april 2022
    om ændring af visse forordninger om restriktive foranstaltninger og om fastlæggelse
    af en enkelt liste med henblik på bilagene til disse forordninger med kontaktoplysninger
    om medlemsstaternes kompetente myndigheder og den adresse, der benyttes til at
    underrette Europa-Kommissionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/595 της Επιτροπής
    της 11ης Απριλίου 2022 για την τροποποίηση και
    την κατάρτιση ενιαίου καταλόγου για τα παραρτήματα
    που περιέχουν τα στοιχεία επικοινωνίας των
    αρμόδιων αρχών των κρατών μελών και τη διεύθυνση
    για κοινοποιήσεις προς την Ευρωπαϊκή Επιτροπή
    ορισμένων κανονισμών σχετικά με περιοριστικά
    μέτρα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/595, 11. aprill 2022, millega muudetakse
    mõningaid piiravaid meetmeid käsitlevaid määrusi ja kehtestatakse nimetatud
    määruste lisades esitamiseks ühtne loetelu, mis sisaldab liikmesriikide pädevate
    ametiasutuste kontaktandmeid ja aadressi teadete saatmiseks Euroopa Komisjonile
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/595, annettu 11 päivänä
    huhtikuuta 2022, eräiden rajoittavista toimenpiteistä annettujen asetusten muuttamisesta
    sekä jäsenvaltioiden toimivaltaisten viranomaisten yhteystiedot ja Euroopan
    komissiolle ilmoittamista varten tarkoitetun osoitteen sisältävien kyseisten
    asetusten liitteiden korvaamisesta yhdellä ainoalla luettelolla
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/595 ón gCoimisiún an 11 Aibreán
    2022 lena leasaítear Rialacháin áirithe a bhaineann le bearta sriantacha agus
    lena leagtar amach liosta aonair le haghaidh na nIarscríbhinní a ghabhann leis
    na Rialacháin sin ina bhfuil sonraí teagmhála údaráis inniúla na mBallstát
    agus an seoladh le haghaidh fógraí chuig an gCoimisiún Eorpach
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/595 оd 11. travnja 2022. o izmjeni
    određenih uredbi o mjerama ograničavanja te utvrđivanju jedinstvenog popisa
    za priloge tim uredbama koji sadržavaju podatke za kontakt nadležnih tijela
    država članica i adresu za slanje obavijesti Europskoj komisiji
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/595 végrehajtási rendelete (2022. április 11.)
    a korlátozó intézkedésekről szóló egyes rendeletek módosításáról,
    valamint az illetékes tagállami hatóságok elérhetőségét és az Európai
    Bizottság értesítési címét tartalmazó mellékletek egységes jegyzékének
    meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/595 della Commissione dell'11 aprile
    2022 che modifica taluni regolamenti concernenti misure restrittive e stabilisce
    un elenco unico per gli allegati di tali regolamenti contenente gli estremi delle
    autorità competenti degli Stati membri e l'indirizzo per le notifiche alla Commissione
    europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/595 (2022. gada 11. aprīlis),
    ar ko groza dažas regulas par ierobežojošiem pasākumiem un izveido vienotu
    sarakstu minēto regulu pielikumiem, kuros norādīta dalībvalstu kompetento
    iestāžu kontaktinformācija un adrese paziņojumu sniegšanai Eiropas Komisijai
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/595 2022 m. balandžio 11
    d. kuriuo iš dalies keičiami tam tikri reglamentai dėl ribojamųjų priemonių
    ir kuriuo nustatomas tų reglamentų priedams bendras sąrašas, kuriame nurodomi
    valstybių narių kompetentingų institucijų kontaktiniai duomenys ir adresas,
    kuriuo Europos Komisijai siunčiami pranešimai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/595 tal-11
    ta’ April 2022 li jemenda ċerti Regolamenti dwar miżuri restrittivi u li jistabbilixxi
    lista unika għall-Annessi għal dawk ir-Regolamenti li fihom id-dettalji ta’
    kuntatt tal-awtoritajiet kompetenti tal-Istati Membri u l-indirizz għan-notifiki
    lill-Kummissjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/595 van de Commissie van 11 april 2022
    tot wijziging van bepaalde verordeningen betreffende beperkende maatregelen en
    tot vaststelling van een enkele lijst voor de bijlagen bij die verordeningen die
    de contactgegevens van de bevoegde autoriteiten van de lidstaten en de adressen
    voor de kennisgevingen aan de Europese Commissie bevatten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/595 z dnia 11 kwietnia 2022
    r. zmieniające niektóre rozporządzenia dotyczące środków ograniczających
    i ustanawiające jednolity wykaz załączników do tych rozporządzeń zawierający
    dane kontaktowe właściwych organów państw członkowskich oraz adres, na który
    należy przesyłać powiadomienia do Komisji Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/595 da Comissão de 11 de abril de
    2022 que altera determinados regulamentos que impõem medidas restritivas e estabelece
    uma lista única dos anexos desses regulamentos que contêm os dados de contacto
    das autoridades competentes dos Estados-Membros e o endereço para o envio de
    notificações à Comissão Europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/595 al Comisiei din 11 aprilie
    2022 de modificare a anumitor regulamente privind măsuri restrictive și de stabilire
    a unei liste unice a anexelor la regulamentele respective care conțin datele
    de contact ale autorităților competente ale statelor membre și adresa pentru
    notificările către Comisia Europeană
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/595 z 11. apríla 2022, ktorým
    sa menia určité nariadenia o reštriktívnych opatreniach a ktorým sa stanovuje
    jednotný zoznam na účely príloh k uvedeným nariadeniam, ktorý obsahuje kontaktné
    údaje príslušných orgánov členských štátov a adresu na zasielanie oznámení
    Európskej komisii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/595 z dne 11. aprila 2022 o spremembi
    nekaterih uredb o omejevalnih ukrepih in določitvi enotnega seznama za priloge
    k zadevnim uredbam, ki vsebujejo kontaktne podatke pristojnih organov držav članic
    in naslov za pošiljanje uradnih obvestil Evropski komisiji
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/595 de la Comisión de 11 de abril de
    2022 por el que se modifican determinados Reglamentos relativos a medidas restrictivas
    y se establece una lista única para los anexos de dichos Reglamentos con información
    de contacto de las autoridades competentes de los Estados miembros y la dirección
    para las notificaciones a la Comisión Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/595 av den 11 april 2022
    om ändring av vissa förordningar om restriktiva åtgärder och fastställande
    av en samlad förteckning för bilagorna till de förordningarna över kontaktuppgifterna
    till medlemsstaternas behöriga myndigheter och adresserna för anmälningar till
    Europeiska kommissionen
  type: main
