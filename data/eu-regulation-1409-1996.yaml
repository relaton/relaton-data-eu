title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1409/96 of 19 July 1996 amending Regulation
    (EEC) No 1442/93 laying down detailed rules for the application of the arrangements
    for importing bananas into the Community, as regards eligibility criteria for
    category C operators and certain dates relevant to the administration of Community
    tariff quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1409/96 de la Commission du 19 juillet 1996 modifiant
    le règlement (CEE) nº 1442/93 portant modalités d'application du régime d'importation
    de bananes dans la Communauté, en ce qui concerne les critères d'admissibilité
    applicables aux opérateurs de la catégorie C ainsi que certaines dates relatives
    à la gestion du régime de contingent tarifaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1409/96 der Kommission vom 19. Juli 1996 zur Änderung
    der Verordnung (EWG) Nr. 1442/93 mit Durchführungsbestimmungen zu der Einfuhrregelung
    für Bananen in die Gemeinschaft betreffend die Zulassungsbedingungen von Marktbeteiligten
    der Gruppe C sowie bestimmte Zeitpunkte bei der Verwaltung der Zollkontingentsregelung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1409/96 af 19. juli 1996 om ændring
    af forordning (EØF) nr. 1442/93 om gennemførelsesbestemmelser for EF's importordning
    for bananer, for så vidt angår adgangsbetingelser for erhvervsdrivende i kategori
    C og datoer i forbindelse med forvaltning af toldkontingentordningen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1409/96 της Επιτροπής
    της 19ης Ιουλίου 1996 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1442/93 περί λεπτομερών
    κανόνων εφαρμογής του καθεστώτος εισαγωγής
    μπανανών στην Κοινότητα, όσον αφορά τα κριτήρια
    αποδοχής που εφαρμόζονται στους επιχειρηματίες
    της κατηγορίας Γ καθώς και ορισμένες ημερομηνίες
    σχετικά με τη διαχείριση του καθεστώτος δασμολογικής
    ποσόστωσης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1409/96, annettu 19 päivänä heinäkuuta 1996,
    banaanien tuontia yhteisöön koskevan järjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä annetun asetuksen (ETY) N:o 1442/93 muuttamisesta
    C-luokan toimijoihin sovellettavien hyväksymisvaatimusten ja tiettyjen tariffikiintiöjärjestelmän
    hallinnointiin liittyvien päivämäärien osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1409/96 della Commissione del 19 luglio 1996 che modifica
    il regolamento (CEE) n. 1442/93 recante modalità d'applicazione del regime d'importazione
    delle banane nella Comunità, per quanto riguarda i criteri di ammissibilità
    applicabili agli operatori della categoria C nonché alcune date relative alla
    gestione del regime dei contingenti tariffari
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1409/96 van de Commissie van 19 juli 1996 tot wijziging
    van Verordening (EEG) nr. 1442/93 houdende bepalingen ter toepassing van de regeling
    voor de invoer van bananen in de Gemeenschap, voor wat betreft de criteria voor
    de toelating van marktdeelnemers tot categorie C en een aantal data in verband
    met het beheer van de tariefcontingenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1409/96 da Comissão de 19 de Julho de 1996 que altera
    o Regulamento (CEE) nº 1442/93 que estabelece normas de execução do regime
    de importação de bananas na Comunidade, no respeitante aos critérios de admissibilidade
    aplicáveis aos operadores de categoria C e a certas datas relativas à gestão
    do regime de contingente pautal
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1409/96 de la Comisión de 19 de julio de 1996 por el
    que se modifica el Reglamento (CEE) nº 1442/93 por el que se establecen disposiciones
    de aplicación del régimen de importación de plátanos en la Comunidad en lo
    que se refiere a los criterios de admisibilidad aplicables a los operadores de
    la categoría C así como determinadas fechas relativas a la gestión del régimen
    del contingente arancelario
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1409/96 av den 19 juli 1996 om ändring
