title:
- language: en
  script: Latn
  content: Council Directive 89/594/EEC of 30 October 1989 amending Directives 75/362/EEC,
    77/452/EEC, 78/686/EEC, 78/1026/EEC and 80/154/EEC relating to the mutual recognition
    of diplomas, certificates and other evidence of formal qualifications as doctors,
    nurses responsible for general care, dental practitioners, veterinary surgeons
    and midwives, together with Directives 75/363/EEC, 78/1027/EEC and 80/155/EEC
    concerning the coordination of provisions laid down by Law, Regulation or Administrative
    Action relating to the activities of doctors, veterinary surgeons and midwives
  type: main
- language: fr
  script: Latn
  content: Directive 89/594/CEE du Conseil du 30 octobre 1989 modifiant les directives
    75/362/CEE, 77/452/CEE, 78/686/CEE, 78/1026/CEE et 80/154/CEE concernant la reconnaissance
    mutuelle des diplômes, certificats et autres titres respectivement de médecin,
    d'infirmier responsable des soins généraux, de praticien de l'art dentaire,
    de vétérinaire et de sage-femme, ainsi que les directives 75/363/CEE, 78/1027/CEE
    et 80/155/CEE visant à la coordination des dispositions législatives, réglementaires
    et administratives concernant les activités respectivement du médecin, du vétérinaire
    et de la sage-femme
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/594/EWG des Rates vom 30. Oktober 1989 zur Änderung der
    Richtlinien 75/362/EWG, 77/452/EWG, 78/686/EWG, 78/1026/EWG und 80/154/EWG für
    die gegenseitige Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    des Arztes, der Krankenschwester und des Krankenpflegers, die für die allgemeine
    Pflege verantwortlich sind, des Zahnarztes, des Tierarztes und der Hebamme sowie
    der Richtlinien 75/363/EWG, 78/1027/EWG und 80/155/EWG zur Koordinierung der Rechts-
    und Verwaltungsvorschriften für die Tätigkeiten des Arztes, des Tierarztes und
    der Hebamme
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 30 октомври 1989 година
    относно изменението на Директиви 75/362/ЕИО, 77/452/ЕИО,
    78/686/ЕИО, 78/1026/ЕИО и 80/154/ЕИО относно взаимното
    признаване на дипломи, удостоверения и други
    официални документи за лекари, медицински
    сестри с общ профил, практикуващи стоматология,
    ветеринарни лекари и акушерки заедно с Директива
    75/363/ЕИО, 78/1027/ЕИО и 80/155/ЕИО относно координирането
    на законовите, подзаконовите и административните
    разпоредби относно дейността на лекарите,
    ветеринарните лекари и акушерките
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 30. října 1989 kterou se mění směrnice 75/362/EHS,
    77/452/EHS, 78/686/EHS, 78/1026/EHS a 80/154/EHS o vzájemném uznávání diplomů,
    osvědčení a jiných dokladů o dosažené kvalifikaci lékařů, zdravotních
    sester odpovědných za všeobecnou péči, zubních lékařů, veterinárních
    lékařů a porodních asistentek, jakož i směrnice 75/363/EHS, 78/1027/EHS
    a 80/155/EHS o koordinaci právních a správních předpisů týkajících se
    činnosti lékařů, veterinárních lékařů a porodních asistentek
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/594/EØF af 30. oktober 1989 om ændring af direktiv
    75/362/EØF, 77/452/EØF, 78/686/EØF, 78/1026/EØF og 80/154/EØF vedrørende
    gensidig anerkendelse af eksamensbeviser, certifikater og andre kvalifikationsbeviser
    for henholdsvis læger, sygeplejersker med ansvar for den almene sundheds- og
    sygepleje, tandlæger, dyrlæger og jordemødre, samt direktiv 75/363/EØF, 78/1027/EØF
    og 80/155/EØF vedrørende samordning af de ved lov eller administrativt fastsatte
    bestemmelser om virksomhed som henholdsvis læge, dyrlæge og jordemoder
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/594/ΕΟΚ του Συμβουλίου της 30ής Οκτωβρίου
    1989 για την τροποποίηση των οδηγιών 75/362/ΕΟΚ,
    77/452/ΕΟΚ, 78/686/ΕΟΚ, 78/1026/ΕΟΚ και 80/154/ΕΟΚ για την
    αμοιβαία αναγνώριση των διπλωμάτων, πιστοποιητικών
    και άλλων τίτλων ιατρού, νοσοκόμου υπεύθυνου
    για τη γενική περίθαλψη, οδοντιάτρου, κτηνιάτρου
    και μαίας, αντίστοιχα, καθώς και των οδηγιών
    75/363/ΕΟΚ, 78/1027/ΕΟΚ και 80/155/ΕΟΚ για τον συντονισμό
    των νομοθετικών και κανονιστικών και διοικητικών
    διατάξεων που αφορούν τις δραστηριότητες ιατρού,
    κτηνιάτρου και μαίας, αντίστοιχα
  type: main
- language: et
  script: Latn
  content: Nõukogu Direktiiv, 30. oktoober 1989, millega muudetakse direktiiνe 75/362/EMÜ,
    77/452/EMÜ, 78/686/EMÜ, 78/1026/EMÜ ja 80/154/EMÜ, mis on seotud arstide,
    üldõdede, hambaarstide, νeterinaaride ja ämmaemandate diplomite, tunnistuste
    ja muude kνalifikatsiooni tõendaνate dokumentide νastastikuse tunnustamisega,
    ning direktiiνe 75/363/EMÜ, 78/1027/EMÜ ja 80/155/EMÜ, mis käsitleνad arstide,
    νeterinaaride ja ämmaemandate tegeνusega seotud õigusnormide kooskõlastamist
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/594/ETY, annettu 30 päivänä lokakuuta 1989,
    lääkärin, yleissairaanhoidosta vastaavan sairaanhoitajan, hammaslääkärin,
    eläinlääkärin ja kätilön tutkintotodistusten, todistusten ja muiden muodollista
    kelpoisuutta osoittavien asiakirjojen vastavuoroisesta tunnustamisesta annettujen
    direktiivien 75/362/ETY, 77/452/ETY, 78/686/ETY, 78/1026/ETY ja 80/154/ETY sekä
    lääkärin-, eläinlääkärin- ja kätilöntointa koskevien lakien, asetusten
    ja hallinnollisten määräysten yhteensovittamisesta annettujen direktiivien
    75/363/ETY, 78/1027/ETY ja 80/155/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1989. október 30.) az orvosi, általános ápolói,
    fogorvosi, állatorvosi és szülésznői oklevelek, bizonyítványok és a képesítés
    megszerzéséről szóló egyéb tanúsítványok kölcsönös elismeréséről
    szóló 75/362/EGK, 77/452/EGK, 78/686/EGK, 78/1026/EGK és 80/154/EGK irányelvek,
    valamint a törvényi, rendeleti vagy közigazgatási intézkedésekben megállapított,
    az orvosok, állatorvosok és szülésznők tevékenységének megkezdésére
    és folytatására vonatkozó rendelkezések összehangolásáról szóló 75/363/EGK,
    78/1027/EGK és 80/155/EGK irányelvek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 89/594/CEE del Consiglio del 30 ottobre 1989 che modifica le
    direttive 75/362/CEE, 77/452/CEE, 78/686/CEE, 78/1026/CEE e 80/154/CEE concernenti
    il riconoscimento reciproco dei diplomi, certificati ed altri titoli rispettivamente
    di medico, infermiere responsabile dell'assistenza generale, dentista, veterinario
    ed ostetrica, nonché le direttive 75/363/CEE, 78/1027/CEE e 80/155/CEE concernenti
    il coordinamento delle disposizioni legislative, regolamentari e amministrative
    per le attività rispettivamente di medico, veterinario ed ostetrica
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1989. gada 30. oktobris), ar ko groza direktīvas 75/362/EEK,
    77/452/EEK, 78/686/EEK, 78/1026/EEK un 80/154/EEK attiecībā uz ārstu, vispārējās
    aprūpes māsu, zobārstu, veterinārārstu un vecmāšu diplomu, sertifikātu
    un citu kvalifikāciju apliecinošu dokumentu savstarpēju atzīšanu, kā arī
    direktīvas 75/363/EEK, 78/1027/EEK un 80/155/EEK par normatīvajos un administratīvajos
    aktos paredzēto noteikumu koordinēšanu attiecībā uz ārstu, veterinārārstu
    un vecmāšu darbību
  type: main
- language: lt
  script: Latn
  content: 1989 m. spalio 30 d. Tarybos Direktyva iš dalies keičianti Direktyvas
    75/362/EEB, 77/452/EEB, 78/686/EEB, 78/1026/EEB ir 80/154/EEB dėl gydytojo, bendrosios
    praktikos slaugytojo, dantų gydytojo, veterinarijos gydytojo ir akušerio diplomų,
    pažymėjimų ir kitų oficialias kvalifikacijas patvirtinančių dokumentų abipusio
    pripažinimo, taip pat Direktyvas 75/363/EEB, 78/1027/EEB ir 80/155/EEB dėl įstatymų
    ir kitų teisės aktų nuostatų, susijusių su gydytojų, veterinarijos gydytojų
    ir akušerių veikla, derinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tat-30 ta’ Ottubru 1989 li temenda d-Direttivi
    75/362/KEE, 77/452/KEE, 78/686/KEE, 78/1026/KEE u 80/154/KEE dwar ir-rikonoxximent
    reċiproku ta’ diplomi, ċertifikati u provi oħrajn ta’ kwalifiki formali
    bħala tobba, infermiera responsabbli għall-kura ġenerali, dentisti prattikanti,
    kirurgi veterinarji u qwiebel, flimkien mad-Direttivi 75/363/KEE, 78/1027/KEE
    u 80/155/KEE li jikkonċernaw il-koordinazzjoni tad-dispożizzjonijiet stabbiliti
    bil-liġi, b’regolament jew b’azzjoni amministrattivi li jirrelataw għall-attivitajiet
    ta’ tobba, kirurgi veterinarji u qwiebel
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/594/EEG van de Raad van 30 oktober 1989 tot wijziging van
    de Richtlijnen 75/362/EEG, 77/452/EEG, 78/686/EEG, 78/1026/EEG en 80/154/EEG inzake
    de onderlinge erkenning van de diploma's, certificaten en andere titels van respectievelijk
    de arts, de algemeen ziekenverpleger, de beoefenaar der tandheelkunde, de dierenarts
    en de verloskundige, alsmede van de Richtlijnen 75/363/EEG, 78/1027/EEG en 80/155/EEG
    inzake de coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende
    de werkzaamheden van respectievelijk de arts, de dierenarts en de verloskundige
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 30 października 1989 r zmieniająca dyrektywy 75/362/EWG,
    77/452/EWG, 78/686/EWG, 78/1026/EWG oraz 80/154/EWG odnoszące się do wzajemnego
    uznawania dyplomów, świadectw i innych dokumentów potwierdzających posiadanie
    kwalifikacji lekarzy, pielęgniarek odpowiedzialnych za opiekę ogólną, lekarzy
    dentystów, lekarzy weterynarii oraz położnych, jak również dyrektywy 75/363/EWG,
    78/1027/EWG oraz 80/155/EWG dotyczące koordynacji przepisów ustawowych, wykonawczych
    i administracyjnych odnoszących się do działalności lekarza, lekarza weterynarii
    i położnej
  type: main
- language: pt
  script: Latn
  content: Directiva 89/594/CEE do Conselho de 30 de Outubro de 1989 que altera as
    Directivas 75/362/CEE, 77/452/CEE, 78/686/CEE, 78/1026/CEE e 80/154/CEE, relativas
    ao reconhecimento mútuo dos diplomas, certificados e outros títulos de médico,
    enfermeiro responsável por cuidados gerais, dentista, veterinário e parteira,
    respectivamente, bem como as Directivas 75/363/CEE, 78/1027/CEE e 80/155/CEE,
    que têm por objectivo a coordenação das disposições legislativas, regulamentares
    e administrativas respeitantes às actividades de médico, de veterinário e de
    parteira
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 30 octombrie 1989 de modificare a Directivelor
    75/362/CEE, 77/452/CEE, 78/686/CEE, 78/1026/CEE și 80/154/CEE privind recunoașterea
    reciprocă a diplomelor, certificatelor și a altor titluri oficiale de calificare
    ca medic, asistent medical generalist, medic stomatolog, medic veterinar și moașă,
    precum și a Directivelor 75/363/CEE, 78/1027/CEE și 80/155/CEE privind coordonarea
    actelor cu putere de lege și actelor administrative privind medicii, medicii
    veterinarii și moașele
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 30. októbra 1989, ktorou sa menia a dopĺňajú smernice
    75/362/EHS, 77/452/EHS, 78/686/EHS, 78/1026/EHS a 80/154/EHS o vzájomnom uznávaní
    diplomov, osvedčení a iných dokladov o formálnych kvalifikáciách lekárov,
    sestier zodpovedných za všeobecnú starostlivosť, zubných lekárov, veterinárnych
    lekárov, pôrodných asistentiek, a zároveň smernice 75/363/ES, 78/1027/EHS
    a 80/155/EHS o koordinácii ustanovení zákonov, iných právnych predpisov a
    správnych opatrení týkajúcich sa činností lekárov, veterinárnych lekárov
    a pôrodných asistentiek
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 30. oktobra 1989 o spremembah Direktiv 75/362/EGS,
    77/452/EGS, 78/686/EGS, 78/1026/EGS in 80/154/EGS o vzajemnem priznavanju diplom,
    spričeval in drugih dokazil o formalnih kvalifikacijah za zdravnika, medicinsko
    sestro za splošno zdravstveno nego, zobozdravnika, veterinarja in babico skupaj
    z Direktivami 75/363/EGS, 78/1027/EGS in 80/155/EGS o usklajevanju določb zakonov
    in drugih predpisov v zvezi z dejavnostmi zdravnikov, veterinarjev in babic
  type: main
- language: es
  script: Latn
  content: Directiva 89/594/CEE del Consejo de 30 de octubre de 1989 por la que se
    modifican las Directivas 75/362/CEE, 77/452/CEE, 78/686/CEE, 78/1026/CEE y 80/154/CEE
    sobre reconocimiento mutuo de diplomas, certificados y otros títulos de médico,
    de enfermero responsable de cuidados generales, de odontólogo, de veterinario
    y de matrona, respectivamente, así como las Directivas 75/363/CEE, 78/1027/CEE
    y 80/155/CEE sobre la coordinación de las disposiciones legales, reglamentarias
    y administrativas relativas a las actividades de médico, de veterinario y de
    matrona o asistente obstétrico respectivamente
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 89/594/EEG av den 30 oktober 1989 om ändringar av direktiv
    75/362/EEG, 77/452/EEG, 78/686/EEG, 78/1026/EEG och 80/154/EEG om ömsesidigt
    erkännande av utbildnings-, examens- och andra behörighetsbevis för läkare,
    sjuksköterskor med ansvar för allmän hälso- och sjukvård, tandläkare, veterinärer
    och barnmorskor samt direktiv 75/363/EEG, 78/1027/EEG och 80/155/EEG om samordning
    av bestämmelserna i lagar och andra författningar om verksamhet som läkare,
    veterinär och barnmorska
