---
id: EURegulation2019662
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/662 of 25 April 2019 extending
    the derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from coast and the minimum sea depth for boat seines fishing for transparent
    goby (Aphia minuta), Ferrer's goby (Pseudaphia ferreri) and Lowbody picarel (Spicara
    smaris) in certain territorial waters of Spain (Balearic Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/662 de la Commission du 25 avril 2019
    portant prolongation de la dérogation au règlement (CE) n° 1967/2006 du Conseil
    en ce qui concerne la distance de la côte et la profondeur minimales pour les
    sennes de bateau pêchant le gobie transparent (Aphia minuta), le gobie de Ferrer
    (Pseudaphia ferreri) et le picarel commun (Spicara smaris) dans certaines eaux
    territoriales de l'Espagne (îles Baléares)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/662 der Kommission vom 25. April 2019
    zur Verlängerung der Ausnahme von der Verordnung (EG) Nr. 1967/2006 des Rates
    hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe für
    Bootswaden für den Fang von Glasgrundeln (Aphia minuta) und Ferrer-Grundeln (Pseudaphia
    ferreri) sowie Pikarels (Spicara smaris) in bestimmten Hoheitsgewässern Spaniens
    (Balearen)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/662 на Комисията
    от 25 април 2019 година за удължаване на срока
    на дерогацията от Регламент (ЕО) № 1967/2006 на
    Съвета по отношение на минималното разстояние
    от брега и минималната дълбочина за улов на
    стъкленка (Аphia minuta), на риба от вида Pseudaphia ferreri
    и на смарид (Spicara smaris) с корабни грибове в част
    от териториалните води на Испания (Балеарски
    острови)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/662 ze dne 25. dubna 2019, kterým
    se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud jde o minimální
    vzdálenost od pobřeží a minimální hloubku moře pro lodní nevody k lovu
    hlaváče průsvitného (Aphia minuta), hlaváče Ferrerova (Pseudaphia ferreri)
    a modráka ostronosého (Spicara smaris) v některých teritoriálních vodách
    Španělska (Baleárské ostrovy)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/662 af 25. april 2019
    om forlængelse af dispensationen fra Rådets forordning (EF) nr. 1967/2006 for
    så vidt angår mindsteafstanden fra kysten og mindstedybden for anvendelsen af
    vod brugt fra fartøjer, der fisker efter glaskutling (Aphia minuta), Ferrers
    kutling (Pseudaphia ferreri) og slank pikarel (Spicara smaris) i visse spanske
    territorialfarvande (Balearerne)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/662 της Επιτροπής,
    της 25ης Απριλίου 2019, για την παράταση της παρέκκλισης
    από τον κανονισμό (ΕΚ) αριθ. 1967/2006 του Συμβουλίου
    όσον αφορά την ελάχιστη απόσταση από την ακτή
    και το ελάχιστο βάθος θάλασσας που οφείλουν
    να τηρούν οι συρόμενοι από σκάφος γρίποι που
    αλιεύουν τα είδη γωβιουδάκι άφια (Aphia minuta), γωβιός
    του Φερρέρ (Pseudaphia ferreri) και μαρίδα (Spicara smaris)
    σε ορισμένα χωρικά ύδατα της Ισπανίας (Βαλεαρίδες
    Νήσοι)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2019/662, 25. aprill 2019, millega pikendatakse
    erandit nõukogu määrusest (EÜ) nr 1967/2006 seoses teatavates Hispaania (Baleaari
    saared) territoriaalvetes väikese plankmudila (Aphia minuta), ferreri helvesmudila
    (Pseudaphia ferreri) ja smariidi (Spicara smaris) püüdmiseks kasutatavate paadinootade
    miinimumkaugusega rannikust ja vee miinimumsügavusega nende kasutamisel
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/662, annettu 25 päivänä
    huhtikuuta 2019, neuvoston asetuksesta (EY) N:o 1967/2006 myönnetyn, vähimmäisetäisyyttä
    rannikolta ja veden vähimmäissyvyyttä koskevan poikkeuksen voimassaolon jatkamiseksi
    kalastettaessa kuultotokkoa (Aphia minuta), Pseudaphia ferreri -tokkoa ja pikkupikarellia
    (Spicara smaris) alukselta vedettävillä nuotilla tietyillä Espanjan aluevesillä
    (Baleaarit)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/662 оd 25. travnja 2019. o produljenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu minimalne udaljenosti
    od obale i minimalne dubine mora za potegače otvorenog mora koje love mliječ
    ružični (Aphia minuta), mliječ pučinski (Pseudaphia ferreri) i giru oblicu
    (Spicara smaris) u određenim teritorijalnim vodama Španjolske (Balearski otoci)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/662 végrehajtási rendelete (2019. április 25.)
    Spanyolország egyes felségvizein (Baleár-szigetek) az üveggébre (Aphia minuta),
    a Ferrer-gébre (Pseudaphia ferreri) és a nyurga durbincsra (Spicara smaris)
    irányuló halászatban alkalmazott, hajóról működtetett kerítőhálók telepítésének
    mélysége és parttól számított távolsága tekintetében az 1967/2006/EK
    tanácsi rendelettől való eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/662 della Commissione, del 25 aprile
    2019, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto concerne la distanza minima dalla costa e la profondità minima per le
    sciabiche da natante utilizzate per la pesca del rossetto (Aphia minuta), del
    ghiozzo di Ferrer (Pseudaphya ferreri) e dello zerro (Spicara smaris) in talune
    acque territoriali della Spagna (Isole Baleari)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/662 (2019. gada 25. aprīlis),
    ar kuru attiecībā uz minimālo attālumu no krasta un minimālo dziļumu, kas
    dažos Spānijas (Baleāru salu) teritoriālo ūdeņu apgabalos jāievēro stikla
    jūrasgrunduļa (Aphia minuta), jūrasgrunduļa Pseudaphya ferreri un smarīdas
    (Spicara smaris) zvejā ar laivas velkamajiem vadiem, pagarina atkāpi no Padomes
    Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2019 m. balandžio 25 d. Komisijos įgyvendinimo reglamentas (ES) 2019/662,
    kuriuo pratęsiamas nuostatos, leidžiančios nukrypti nuo Tarybos reglamento
    (EB) Nr. 1967/2006 nuostatų dėl minimalaus atstumo nuo kranto ir minimalaus
    jūros gylio reikalavimų, taikomų laivų traukiamaisiais tinklais žvejojant
    afijas (Aphia minuta), Ferero grundalus (Pseudaphya ferreri) ir paprastąsias
    smarides (Spicara smaris) tam tikruose Ispanijos (Balearų salų) teritoriniuose
    vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/662 tal-25 ta'
    April 2019 li jestendi d-deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    dwar id-distanza minima mill-kosta u l-fond minimu tal-baħar għas-sajd bit-tartaruni
    għall-makku (Aphia minuta), għall-makku ferreri (Pseudaphia ferreri) u għall-arżnell
    (Spicara smaris) f'ċerti ilmijiet territorjali ta' Spanja (il-Gżejjer Baleariċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/662 van de Commissie van 25 april 2019
    tot verlenging van de afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft de minimumafstand van de kust en de minimumzeediepte voor bootzegens
    voor de visserij op glasgrondel (Aphia minuta), Ferrer's grondel (Pseudaphya ferreri)
    en picarel (Spicara smaris) in bepaalde territoriale wateren van Spanje (Balearen)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/662 z dnia 25 kwietnia 2019
    r. przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w zakresie
    minimalnych odległości od brzegu i minimalnej głębokości morza dla niewodów
    pełnomorskich do połowu babki przezroczystej (Aphia minuta), ryb z gatunku Pseudaphia
    ferreri oraz pysonia smukłego (Spicara smaris) na niektórych wodach terytorialnych
    Hiszpanii (Baleary)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/662 da Comissão, de 25 de abril de
    2019, que prorroga a derrogação do Regulamento (CE) n.° 1967/2006 do Conselho
    no que respeita à distância mínima da costa e à profundidade mínima para
    as redes envolventes-arrastantes de alar para bordo utilizadas na pesca do caboz-transparente
    (Aphia minuta), do caboz-de-ferrer (Pseudaphia ferreri) e do trombeiro-boga (Spicara
    smaris) em determinadas águas territoriais de Espanha (Ilhas Baleares)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/662 al Comisiei din 25 aprilie
    2019 de prelungire a derogării de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    cu privire la distanța minimă față de coastă și adâncimea minimă a mării
    pentru năvoadele de navă utilizate pentru pescuitul de guvid alb (Alphia minuta),
    de guvid Ferrer (Pseudaphia ferreri) și de smarid comun (Spicara smaris) în
    anumite ape teritoriale ale Spaniei (Insulele Baleare)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/662 z 25. apríla 2019, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o minimálnu vzdialenosť od pobrežia a minimálnu hĺbku mora pri love afie
    priesvitnej (Aphia minuta), druhu Pseudaphia ferreri a spikáry štíhlej (Spicara
    smaris) záťahovými sieťami ovládanými z lode v určitých pobrežných vodách
    Španielska (Baleárske ostrovy)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/662 z dne 25. aprila 2019 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in najmanjše morske globine za potegalke odprtega morja, ki lovijo belega
    glavača (Aphia minuta), ferrerjevega glavača (Pseudaphia ferreri) in girice
    (Spicara smaris) v določenih teritorialnih vodah Španije (Balearski otoki)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/662 de la Comisión, de 25 de abril
    de 2019, por el que se prorroga la excepción a lo dispuesto en el Reglamento
    (CE) n.° 1967/2006 del Consejo en lo concerniente a la distancia mínima de la
    costa y la profundidad marina mínima en el caso de las redes de tiro desde embarcación
    para la pesca de chanquete (Aphia minuta), cabotí (Pseudaphya ferreri) y caramel
    (Spicara smaris) en determinadas aguas territoriales de España (Illes Balears)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/662 av den 25 april 2019
    om förlängning av undantaget från rådets förordning (EG) nr 1967/2006 vad
    gäller minsta avstånd från kusten och minsta djup för fartyg som använder
    vad-/notredskap vid fiske efter klarbult (Aphia minuta), Ferrers smörbult (Pseudaphya
    ferreri) och menolapikarell (Spicara Smaris) i vissa av Spaniens territorialvatten
    (Balearerna)
