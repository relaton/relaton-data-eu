title:
- language: en
  script: Latn
  content: '84/55/EEC: Commission Decision of 20 January 1984 repealing Decision 80/1206/EEC
    on the duty-free importation of goods intended to be distributed or made available
    free of charge to victims of the earthquake which occurred in November 1980 in
    southern Italy (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/55/CEE: Décision de la Commission du 20 janvier 1984 abrogeant la
    décision 80/1206/CEE relative à l''admission en franchise des droits à l''importation
    de marchandises destinées à être distribuées ou mises gratuitement à la disposition
    des victimes du tremblement de terre survenu en novembre 1980 dans le sud de l''Italie
    (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/55/EWG: Entscheidung der Kommission vom 20. Januar 1984 zur Aufhebung
    der Entscheidung 80/1206/EWG über die Befreiung von Eingangsabgaben für bestimmte
    Waren, die an die von dem im November 1980 in Süditalien aufgetretenen Erdbeben
    betroffenen Opfer unentgeltlich verteilt oder ihnen unentgeltlich zur Verfügung
    gestellt werden sollen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/55/EØF: Kommissionens beslutning af 20. januar 1984 om ophævelse
    af beslutning 80/1206/EØF om fritagelse for told ved indførsel af varer, der
    er bestemt til gratis udlevering til eller gratis bliver stillet til rådighed
    for ofrene for jordskælvene i november 1980 i Syditalien (Kun den italienske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/55/ΕΟΚ: Απόφαση της Επιτροπής της 20ής Ιανουαρίου
    1984 που καταργεί την απόφαση 80/1206/ΕΟΚ σχετικά
    με την εισαγωγή, με ατέλεια εισαγωγικών δασμών,
    εμπορευμάτων που προορίζονται να διανεμηθούν
    ή να διατεθούν δωρεάν στα θύματα του σεισμού
    που έπληξε τη Νότια Ιταλία το Νοέμβριο του
    1980 (Το κείμενο στην ιταλική γλώσσα είναι το
    μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/55/CEE: Decisione della Commissione del 20 gennaio 1984 che abroga
    la decisione 80/1206/CEE relativa all''ammissione in franchigia dai diritti all''importazione
    di merci destinate ad essere distribuite o ad essere messe gratuitamente a disposizione
    delle vittime del terremoto avvenuto nell''Italia del Sud nel novembre 1980 (Il
    testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/55/EEG: Beschikking van de Commissie van 20 januari 1984 tot intrekking
    van Beschikking 80/1206/EEG betreffende de invoer met vrijstelling van rechten
    bij invoer van goederen bestemd om gratis te worden verstrekt of ter beschikking
    gesteld aan de slachtoffers van de in november 1980 voorgevallen aardbeving in
    Zuid- Italië (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
