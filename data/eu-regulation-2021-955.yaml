  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/955 av den 27 maj 2021
    om fastställande av tekniska genomförandestandarder för tillämpningen av Europaparlamentets
    och rådets förordning (EU) 2019/1156 vad gäller formulär, mallar, förfaranden
    och tekniska arrangemang för offentliggörandet och överlämnandet av uppgifter
