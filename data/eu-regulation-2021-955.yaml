    in Sveta v zvezi z obrazci, predlogami, postopki in tehničnimi ureditvami za
    objave in uradna obvestila o pravilih trženja, pristojbinah in dajatvah ter za
    določitev informacij, ki jih je treba sporočiti za vzpostavitev in vodenje centralne
    zbirke podatkov o čezmejnem trženju AIS in KNPVP, ter obrazcev, predlog in postopkov
    za sporočanje takih informacij
  type: main
