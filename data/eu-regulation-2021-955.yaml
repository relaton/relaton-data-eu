title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/955 of 27 May 2021 laying
    down implementing technical standards for the application of Regulation (EU) 2019/1156
    of the European Parliament and of the Council with regard to the forms, templates,
    procedures and technical arrangements for the publications and notifications of
    marketing rules, fees and charges, and specifying the information to be communicated
    for the creation and maintenance of the central database on cross-border marketing
    of AIFs and UCITS, as well as the forms, templates and procedures for the communication
    of such information
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/955 de la Commission du 27 mai 2021
    établissant des normes techniques d’exécution pour l’application du règlement
    (UE) 2019/1156 du Parlement européen et du Conseil en ce qui concerne les formulaires,
    modèles, procédures et dispositions techniques à utiliser pour les publications
    et les notifications des règles en matière de commercialisation, des frais et
    des charges, et précisant les informations à communiquer pour la création et
    l’entretien de la base de données centrale sur la commercialisation transfrontalière
    des FIA et OPCVM, ainsi que les formulaires, modèles et procédures à utiliser
    pour la communication de ces informations
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/955 der Kommission vom 27. Mai 2021
