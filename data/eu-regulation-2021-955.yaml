    (EU) 2019/1156 des Europäischen Parlaments und des Rates im Hinblick auf die
    Formulare, Mustertexte, Verfahren und technischen Voraussetzungen für die Veröffentlichung
    und Mitteilung der Vertriebsvorschriften, Gebühren und Entgelte sowie zur Festlegung
    der für die Einrichtung und das Führen der zentralen Datenbank für den grenzüberschreitenden
    Vertrieb von alternativen Investmentfonds und Organismen für gemeinsame Anlagen
    in Wertpapieren zu übermittelnden Informationen und zur Festlegung der Formulare,
    Mustertexte und Verfahren für die Übermittlung dieser Informationen
  type: main
