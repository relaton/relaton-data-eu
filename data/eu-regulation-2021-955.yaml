  script: Latn
  content: Reglamento de Ejecución (UE) 2021/955 de la Comisión de 27 de mayo de
    2021 por el que se establecen normas técnicas de ejecución para la aplicación
    del Reglamento (UE) 2019/1156 del Parlamento Europeo y del Consejo en lo que respecta
    a los formularios, plantillas, procedimientos y disposiciones técnicas aplicables
