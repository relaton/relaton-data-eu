  content: Commission Regulation (EEC) No 3589/92 of 11 December 1992 laying down
    detailed rules for the year 1993 for the application of the import arrangements
    for fresh, chilled or frozen beef provided for in the Interim Association Agreements
    between the Community and the Republic of Poland, the Republic of Hungary and
    the Czech and Slovak Federal Republic for 1993
  type: main
- language: fr
