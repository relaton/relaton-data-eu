id: EURegulation11841980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1184/80 of 12 May 1980 re-establishing the
    levying of customs duties on babies' under garments of knitted or crocheted fabrics,
    not elastic or rubberized, products of category 68 (code 0680), originating in
    Yugoslavia, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1184/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastique ni caoutchoutée, pour bébés, de la catégorie
    de produits n° 68 (code 0680), originaires de Yougoslavie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1184/80 der Kommission vom 12. Mai 1980 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, für Säuglinge, der Warenkategorie Nr. 68 (Kennziffer 0680),
    mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1184/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastisk eller gummeret, til spædbørn, varekategori 68 (kode 0680), som har
    oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1184/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata per bambini piccoli (bébés), della categoria di prodotti
    n. 68 (codice 0680), originari della Iugoslavia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1184/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, voor baby' s, van
    de categorie van produkten nr. 68 (codenummer 0680), van oorsprong uit Joegoslavië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
