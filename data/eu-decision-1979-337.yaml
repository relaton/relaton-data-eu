title:
- language: en
  script: Latn
  content: '79/337/EEC: Commission Decision of 16 March 1979 on the granting by the
    Guidance Section of the EAGGF to the Kingdom of Belgium of a payment on account
    in respect of expenditure incurred during 1977 on aids for the less- favoured
    farming areas (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/337/CEE: Décision de la Commission, du 16 mars 1979, relative au versement
    par le Fonds européen d''orientation et de garantie agricole (FEOGA), section
    "orientation", au Royaume de Belgique d''un acompte sur les dépenses effectuées
    pendant l''année 1977 pour les aides en faveur des zones agricoles défavorisées
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/337/EWG: Entscheidung der Kommission vom 16. März 1979 über die Zahlung
    eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1977
    in benachteiligten landwirtschaftlichen Gebieten gewährten Hilfen an das Königreich
    Belgien (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/337/EØF: Kommissionens beslutning af 16. marts 1979 om udbetaling
    gennem EUGFL, udviklinssektionen, til kongeriget Belgien af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1977 til støtte til ugunstigt stillede
    landbrugsområder (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/337/CEE: Decisione della Commissione, del 16 marzo 1979, relativa al
    versamento da parte del FEAOG, sezione orientamento, al Regno del Belgio di un
    anticipo sulle spese effettuate durante il 1977 per gli aiuti in favore delle
    zone agricole svantaggiate (I testi in lingua francese e olandese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/337/EEG: Beschikking van de Commissie van 16 maart 1979 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    een voorschot in verband met de in 1977 verrichte uitgaven voor steun aan probleemgebieden
    in de landbouw (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
