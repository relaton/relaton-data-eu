  content: Council Regulation (EEC) No 1334/92 of 18 May 1992 fixing the guideline
    figure for the 1992/93 milk year for the fat content of standardised whole milk
    imported into Ireland and the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1334/92 du Conseil du 18 mai 1992 fixant, pour la
    campagne laitière 1992/1993, le taux indicatif pour la teneur en matières grasses
    du lait entier normalisé importé en Irlande et au Royaume-Uni
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1334/92 DES RATES vom 18. Mai 1992 zur Festsetzung
    des im Milchwirtschaftsjahr 1992/93 für nach Irland und dem Vereinigten Königreich
    versandte standardisierte Vollmilch geltenden Richtfettgehalts #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 1334/92 af 18. maj 1992 om fastsættelse
    for mejeriåret 1992/93 af den retningsgivende sats for fedtindholdet i standardiseret
    sødmælk, der indføres til Irland og Det Forenede Kongerige #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1334/92 του Συμβουλίου
    της 18ης Μαΐου 1992 για τον καθορισμό, για τη γαλακτοκομική
    περίοδο 1992/93, του ενδεικτικού ποσοστού για
    την περιεκτικότητα σε λιπαρές ουσίες του τυποποιημένου
    πλήρους γάλακτος που εισάγεται στην Ιρλανδία
    και στο Ηνωμένο Βασίλειο
  type: main
