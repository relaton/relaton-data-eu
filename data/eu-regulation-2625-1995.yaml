    eksporta kompensāciju sistēmas, ko piemēro attiecībā uz glikozi un glikozes
    sīrupu, kas izmantots konkrētos augļu un dārzeņu pārstrādes produktos
  type: main
- language: lt
  script: Latn
  content: 1995 m. lapkričio 10 d. Komisijos reglamentas (EB) Nr. 2625/95, iš dalies
