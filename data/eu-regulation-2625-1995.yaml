    ja vihannesjalosteissa käytetyn glukoosin ja glukoosisiirapin vientitukijärjestelmän
    valvontaa koskevia tiettyjä yksityiskohtaisia sääntöjä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2625/95/EK rendelete (1995. november 10.) a gyümölcsből
