title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2625/95 of 10 November 1995 amending Regulation
    (EC) No 1591/95 by adding to it certain rules-for monitoring the systems of export
    refunds on glucose and glucose syrup used in certain products processed from fruit
    and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2625/95 de la Commission, du 10 novembre 1995, modifiant
    le règlement (CE) n° 1591/95 en y ajoutant certaines modalités de contrôle
    du régime des restitutions à l'exportation du glucose et du sirop du glucose
    mis en oeuvre dans certains produits transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2625/95 der Kommission vom 10. November 1995 zur Änderung
    der Verordnung (EG) Nr. 1591/95 durch Einfügen bestimmter Kontrollvorschriften
    für die Regelung der Ausfuhrerstattungen für Glukose und Glukosesirup in bestimmten
    Verarbeitungserzeugnissen aus Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2625/95 на Комисията от 10 ноември
    1995 година за изменение на Регламент (ЕО) № 1591/95
    чрез добавяне в него на някои правила за контрол
    на системата на възстановявания при износ
    на глюкоза и глюкозен сироп, използвани в някои
    продукти от преработени плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2625/95 ze dne 10. listopadu 1995, kterým
    se mění nařízení (ES) č. 1591/95, v kterém se doplňují některá pravidla
    pro kontrolu režimu vývozních náhrad pro glukózu a glukózový sirup užívané
    v některých produktech zpracovaných z ovoce a zeleniny
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2625/95 af 10. november 1995 om ændring
    af forordning (EF) nr. 1591/95, idet der tilføjes nogle kontrolbestemmelser i
    ordningen vedrørende eksportrestitutioner for glucose og glucosesirup, der anvendes
    i visse forarbejdede frugter og grøntsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2625/95 της Επιτροπής
    της 10ης Νοεμβρίου 1995 που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 1591/95 προσθέτοντας ορισμένες λεπτομέρειες
    σχετικά με τον έλεγχο του καθεστώτος χορήγησης
    επιστροφών κατά την εξαγωγή γλυκόζης και σιροπιού
    γλυκόζης που χρησιμοποιούνται σε ορισμένα
    μεταποιημένα προϊόντα με βάση τα οπωροκηπευτικά
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2625/95, 10. november 1995, millega muudetakse
    määrust (EÜ) nr 1591/95, lisades sellele teatavad reeglid teatavatesse puu-
    ja köögiviljatoodetesse lisatud glükoosi ja glükoosisiirupi eksporditoetuse
    süsteemide järelevalveks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2625/95, annettu 10 päivänä marraskuuta 1995,
