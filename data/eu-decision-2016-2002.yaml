    határozat III. mellékletének és a 2010/472/EU bizottsági határozat II. mellékletének
    a juh- és kecskefélékhez tartozó állatok, valamint a juh- és kecskeféléktől
    származó sperma Unión belüli kereskedelme és az Unióba történő behozatalára
    irányadó, az egyes fertőző szivacsos agyvelőbántalmak megelőzésére, az
    ellenük való védekezésre és a felszámolásukra vonatkozó szabályok tekintetében
    történő módosításáról (az értesítés a C(2016) 7026. számú dokumentummal
    történt)
