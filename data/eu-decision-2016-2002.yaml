title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/2002 of 8 November 2016 amending
    Annex E to Council Directive 91/68/EEC, Annex III to Commission Decision 2010/470/EU
    and Annex II to Commission Decision 2010/472/EU concerning trade in and imports
    into the Union of ovine and caprine animals and semen of animals of the ovine
    and caprine species in relation to the rules for the prevention, control and eradication
    of certain transmissible spongiform encephalopathies (notified under document
    C(2016) 7026)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/2002 de la Commission du 8 novembre 2016
    modifiant l'annexe E de la directive 91/68/CEE du Conseil, l'annexe III de la
    décision 2010/470/UE de la Commission et l'annexe II de la décision 2010/472/UE
    de la Commission concernant les échanges et les importations dans l'Union d'ovins
    et de caprins et de sperme d'ovins et de caprins à la lumière des règles de
    prévention, de contrôle et d'éradication de certaines encéphalopathies spongiformes
    transmissibles [notifiée sous le numéro C(2016) 7026]
  type: main
- language: de
  script: Latn
