    der Kommission in Bezug auf den Handel mit Schafen und Ziegen sowie mit Samen
    von Schafen und Ziegen innerhalb der Union und ihrer Einfuhr in die Union hinsichtlich
    der Vorschriften zur Verhütung, Kontrolle und Tilgung bestimmter transmissibler
    spongiformer Enzephalopathien (Bekannt gegeben unter Aktenzeichen C(2016) 7026)
