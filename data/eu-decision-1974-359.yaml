id: EUDecision1974359
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 June 1974 authorizing the United Kingdom to permit,
    for a period which expires on 30 June 1975, the marketing of certain species of
    vegetable seed, harvested before 1 July 1973 and not fully satisfying the prescribed
    conditions for germination
  type: main
- language: fr
  script: Latn
  content: Décision 74/359/CEE de la Commission, du 13 juin 1974, autorisant le Royaume-Uni
    à admettre pour une période expirant le 30 juin 1975 la commercialisation des
    semences de certaines espèces de légumes, récoltées avant le 1er juillet 1973
    et ne répondant pas pleinement aux conditions prévues pour la faculté germinative
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Juni 1974 zur Ermächtigung des Vereinigten
    Königreichs, für einen Zeitraum, der am 30. Juni 1975 abläuft, Saatgut einiger
    Gemüsearten, das vor dem 1. Juli 1973 geerntet worden ist und das die Anforderungen
    an die Keimfreiheit nicht voll erfüllt, zum Verkehr zuzulassen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. juni 1974 om bemyndigelse af Det forenede
    Kongerige til i et tidsrum, der udløber den 30. juni 1975, at tillade handel
    med frø af visse grønsagsarter, som er høstet før den 1. juli 1973, og som
    ikke fuldt ud opfylder de fastsatte krav til spireevne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 giugno 1974, che autorizza il Regno
    Unito ad ammettere, per un periodo che scade il 30 giugno 1975, alla commercializzazione
    sementi di alcune specie di ortaggi raccolte prima del 1 luglio 1973 e che non
    riempiono completamente le condizioni fissate per quanto riguarda la facoltà
    germinativa
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 juni 1974 waarbij het Verenigd Koninkrijk
    wordt gemachtigd tot uiterlijk 30 juni 1975 zaaizaad van bepaalde groentegewassen,
    dat voor 1 juli 1973 is geoogst en dat niet geheel voldoet aan de ten aanzien
    van de kiemkracht gestelde eisen, tot het handelsverkeer toe te laten
  type: main
