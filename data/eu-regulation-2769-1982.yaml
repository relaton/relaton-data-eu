title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2769/82 of 15 October 1982 on the sale at
    prices fixed at a standard rate in advance of certain beef from intervention stocks
    for processing in the Community and amending Regulation (EEC) No 2182/77a
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2769/82 de la Commission, du 15 octobre 1982, relatif
    à la vente à prix fixé forfaitairement à l' avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d' intervention
    et modifiant le règlement (CEE) n° 2182/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2769/82 der Kommission vom 15. Oktober 1982 über
    den Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der
    Gemeinschaft bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur
    Änderung der Verordnung (EWG) Nr. 2182/77h
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2769/82 af 15. oktober 1982 om salg
    til forudfastsatte priser af visse former for oksekød fra interventionslagrene
    med henblik på forarbejdning i Fællesskabet og om ændring af forordning (EØF)
    nr. 2182/77d
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2769/82 τής Επιτροπής
    τής 15ης Οκτωβρίου 1982 περί πωλήσεως μέ κατ αποκοπή
    τιμή καθορζόμενη εκ τών προτέρων, εν όψει τής
    μεταποιήσεώς τους εντός τής Κοινότητος, ορισμένων
    βοείων κρεάτων πού προέρχονται από αποθέματα
    οργανισμών παρεμβάσεως, καί περί τροποποιήσεως
    τού κανονισμού (EOK) αριθ. 2182/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2769/82 della Commissione, del 15 ottobre 1982, relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte d' intervento e destinate alla trasformazione nella Comunità
    e recante modifica del regolamento (CEE) n. 2182/77a
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2769/82 van de Commissie van 15 oktober 1982 inzake
    de verkoop, tegen vooraf forfaitair vastgestelde prijzen, voor verwerking in de
    Gemeenschap, van rundvlees uit de voorraden van de interventiebureaus en houdende
    wijziging van Verordening (EEG) nr. 2182/77d
