  content: Règlement (CEE) n 616/69 de la Commission, du 31 mars 1969, augmentant
    le montant compensatoire à l'importation des huiles de tournesol originaires
    ou en provenance de Bulgarie, de Hongrie, de Yougoslavie, de Roumanie et d'U.R.S.S.
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 616/69 der Kommission vom 31. März 1969 zur Erhöhung
    der Ausgleichsabgabe bei der Einfuhr von Sonnenblumenöl mit Ursprung in oder
    Herkunft aus Bulgarien, Jugoslawien, Rumänien, Ungarn und der UdSSR
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 616/69 della Commissione, del 31 marzo 1969, che aumenta
    l'ammontare di compensazione all'importazione degli oli di semi di girasole originari
    o in provenienza dalla Bulgaria, dalla Romania, dalla Jugoslavia, dall'Ungheria
    e dall'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 616/69 van de Commissie van 31 maart 1969 tot verhoging
    van een compenserend bedrag bij de invoer van zonnebloemolie van oorsprong of
    van herkomst uit Bulgarije, Hongarije, Joegoslavië, Roemenië en de U.S.S.R.
