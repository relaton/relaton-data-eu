    Wiederverkauf auf dem Binnenmarkt auf 250 000 Tonnen Gerste aus Beständen der
    spanischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1092/93 af 4. maj 1993 om ændring
