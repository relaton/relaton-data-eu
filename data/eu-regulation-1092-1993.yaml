    pour la revente sur le marché intérieur d'orge détenue par l'organisme d'intervention
    espagnol
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1092/93 der Kommission vom 4. Mai 1993 zur Änderung
