id: EUDecision2022552
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/552 of 4 April 2022 determining
    that national securities exchanges of the United States of America that are registered
    with the Securities and Exchange Commission comply with legally binding requirements
    which are equivalent to the requirements laid down in Title III of Directive 2014/65/EU
    and are subject to effective supervision and enforcement
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/552 de la Commission du 4 avril 2022
    déterminant que les bourses de valeurs nationales des États-Unis d’Amérique
    enregistrées auprès de la Securities and Exchange Commission satisfont à des
    exigences juridiquement contraignantes qui sont équivalentes aux exigences prévues
    au titre III de la directive 2014/65/UE et font l’objet d’une surveillance
    et d’une mise en œuvre des règles les concernant qui sont efficaces
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/552 der Kommission vom 4. April 2022
    zur Feststellung, dass nationale Wertpapierbörsen der Vereinigten Staaten von
    Amerika, die bei der Securities and Exchange Commission (Wertpapier- und Börsenaufsichtsbehörde)
    eingetragen sind, rechtsverbindliche Anforderungen erfüllen, die den Anforderungen
    des Titels III der Richtlinie 2014/65/EU gleichwertig sind, und einer wirksamen
    Beaufsichtigung und Rechtsdurchsetzung unterliegen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/552 на Комисията
    от 4 април 2022 година за определяне, че националните
    борси за търговия на ценни книжа в Съединените
    американски щати, които са регистрирани в Комисията
    по ценните книжа и борсите, спазват правно
    обвързващите изисквания, които са еквивалентни
    на изискванията, определени в дял III от Директива
    2014/65/ЕС, и подлежат на ефективен надзор и правоприлагане
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/552 ze dne 4. dubna 2022, kterým
    se stanoví, že vnitrostátní burzy cenných papírů Spojených států amerických,
    které jsou registrované u Komise pro cenné papíry a burzu, splňují právně
    závazné požadavky, které jsou rovnocenné požadavkům stanoveným v hlavě
    III směrnice 2014/65/EU a podléhají účinnému dohledu a vymáhání
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/552 af 4. april 2022
    om fastsættelse af, at amerikanske nationale værdipapirbørser, der er registreret
    hos Securities and Exchange Commission, opfylder retligt bindende krav, der er
    ækvivalente med kravene i afsnit III i direktiv 2014/65/EU, og som er underlagt
    effektivt tilsyn og effektiv håndhævelse
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/552 της Επιτροπής
