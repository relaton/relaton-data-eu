    Πολιτειών της Αμερικής που είναι καταχωρισμένα
    στην Επιτροπή Κεφαλαιαγοράς συμμορφώνονται
    με νομικά δεσμευτικές απαιτήσεις οι οποίες
    είναι ισοδύναμες με τις απαιτήσεις που ορίζονται
    στον τίτλο III της οδηγίας 2014/65/ΕΕ και υπόκεινται
    σε αποτελεσματική εποπτεία και επιβολή του
    νόμου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/552, 4. aprill 2022, millega määratakse
    kindlaks, et Ameerika Ühendriikide riiklikud väärtpaberibörsid, mis on registreeritud
    väärtpaberi- ja börsikomisjoni juures, vastavad õiguslikult siduvatele nõuetele,
    mis on samaväärsed direktiivi 2014/65/EL III jaotises sätestatud nõuetega,
    ning nende suhtes kohaldatakse tõhusat järelevalvet ja riiklikku sundi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/552, annettu 4 päivänä
    huhtikuuta 2022, sen vahvistamisesta, että Securities and Exchange Commissionin
    rekisteröimät Amerikan yhdysvaltojen kansalliset arvopaperipörssit noudattavat
    oikeudellisesti sitovia vaatimuksia, jotka vastaavat direktiivin 2014/65/EU III
    osastossa säädettyjä vaatimuksia, ja ovat tehokkaan valvonnan ja täytäntöönpanotoimien
    alaisia
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/552 ón gCoimisiún an 4 Aibreán 2022
    lena gcinntear go gcomhlíonann malartáin urrús náisiúnta Stáit Aontaithe
    Mheiriceá atá cláraithe leis an Securities and Exchange Commission ceanglais
    atá ceangailteach ó thaobh dlí agus atá coibhéiseach leis na ceanglais a
    leagtar síos i dTeideal III de Threoir 2014/65/AE agus go bhfuil siad faoi réir
