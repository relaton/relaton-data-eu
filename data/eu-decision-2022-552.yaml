    Jungtinių Amerikos Valstijų nacionalinės vertybinių popierių biržos atitinka
    teisiškai privalomus reikalavimus, kurie yra lygiaverčiai Direktyvos 2014/65/ES
    III antraštinėje dalyje nustatytiems reikalavimams, ir veiksmingai užtikrinama
    jų priežiūra ir reikalavimų vykdymas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/552 tal-4
    ta’ April 2022 li tiddetermina li l-boroż tat-titoli nazzjonali tal-Istati
    Uniti tal-Amerika rreġistrati mas-Securities and Exchange Commission jikkonformaw
    ma’ rekwiżiti legalment vinkolanti li huma ekwivalenti għar-rekwiżiti stabbiliti
    fit-Titolu III tad-Direttiva 2014/65/UE u li huma soġġetti għal superviżjoni
    u infurzar effettivi
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/552 van de Commissie van 4 april 2022 waarbij
    wordt bepaald dat nationale effectenbeurzen van de Verenigde Staten van Amerika
    die geregistreerd zijn bij de Securities and Exchange Commission, voldoen aan
    wettelijk bindende vereisten die gelijkwaardig zijn aan de vereisten van titel
    III van Richtlijn 2014/65/EU en onderworpen zijn aan effectief toezicht en effectieve
    handhaving
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/552 z dnia 4 kwietnia 2022 r. stwierdzająca,
