    które są zarejestrowane w Komisji Papierów Wartościowych i Giełd, spełniają
    prawnie wiążące wymogi równoważne wymogom ustanowionym w tytule III dyrektywy
    2014/65/UE oraz podlegają skutecznemu nadzorowi i egzekwowaniu prawa
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/552 da Comissão de 4 de abril de 2022
    que determina que as bolsas de valores mobiliários nacionais dos Estados Unidos
    da América registadas junto da Securities and Exchange Commission cumprem requisitos
    juridicamente vinculativos equivalentes aos requisitos estabelecidos no título
    III da Diretiva 2014/65/UE e estão sujeitas a supervisão e execução eficazes
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/552 a Comisiei din 4 aprilie 2022
    de stabilire a faptului că bursele naționale de valori mobiliare din Statele
    Unite ale Americii care sunt înregistrate la Comisia pentru valori mobiliare
    și burse de valori respectă cerințe obligatorii din punct de vedere juridic
    care sunt echivalente cu cerințele prevăzute în titlul III din Directiva 2014/65/UE
    și fac obiectul unei supravegheri și al unei asigurări a respectării normelor
    eficace
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/552 zo 4. apríla 2022, ktorým
