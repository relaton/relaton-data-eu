    Unidos de América registrados en la Securities and Exchange Commission cumplen
    requisitos jurídicamente vinculantes que son equivalentes a los requisitos establecidos
    en el título III de la Directiva 2014/65/UE y están sujetos a una supervisión
    y una aplicación efectivas
  type: main
- language: sv
  script: Latn
