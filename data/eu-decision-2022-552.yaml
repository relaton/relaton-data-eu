    ktoré sú zaregistrované Komisiou pre cenné papiere a burzu, spĺňajú právne
    záväzné požiadavky, ktoré sú rovnocenné s požiadavkami stanovenými v
    hlave III smernice 2014/65/EÚ, a podliehajú účinnému dohľadu a presadzovaniu
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/552 z dne 4. aprila 2022 o določitvi,
