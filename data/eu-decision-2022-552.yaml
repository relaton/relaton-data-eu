  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/552 оd 4. travnja 2022. o utvrđivanju
    da nacionalne burze vrijednosnih papira Sjedinjenih Američkih Država registrirane
    pri Komisiji za vrijednosne papire ispunjavaju pravno obvezujuće zahtjeve koji
    su istovrijedni zahtjevima iz glave III. Direktive 2014/65/EU i podliježu djelotvornom
    nadzoru i izvršenju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/552 végrehajtási határozata (2022. április 4.)
    az Amerikai Egyesült Államok Értékpapír- és Tőzsdebizottságánál nyilvántartásba
    vett nemzeti értéktőzsdék a 2014/65/EU irányelv III. címében meghatározott
    követelményekkel egyenértékű jogilag kötelező érvényű követelményeknek
    való megfelelésének, valamint hatékony felügyelet és végrehajtás hatálya
    alá tartozásának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/552 della Commissione del 4 aprile 2022
    che stabilisce che le borse valori nazionali degli Stati Uniti d’America registrate
    presso la Securities and Exchange Commission soddisfano requisiti giuridicamente
    vincolanti equivalenti ai requisiti stabiliti al titolo III della direttiva 2014/65/UE
    e sono soggette a vigilanza e applicazione efficaci
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/552 (2022. gada 4. aprīlis),
    ar kuru nosaka, ka Amerikas Savienoto Valstu valsts mēroga vērtspapīru biržas,
    kas reģistrētas Vērtspapīru un biržas uzraudzības komisijā, atbilst juridiski
    saistošām prasībām, kas ir līdzvērtīgas Direktīvas 2014/65/ES III sadaļā
    noteiktajām prasībām, un tām piemēro efektīvu uzraudzību un prasību izpildi
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/552 2022 m. balandžio 4 d.
