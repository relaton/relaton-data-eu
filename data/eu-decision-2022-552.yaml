    pri komisiji za vrednostne papirje in borzo, izpolnjujejo pravno zavezujoče zahteve,
    ki so enakovredne zahtevam iz naslova III Direktive 2014/65/EU, ter so predmet
    učinkovitega nadzora in izvrševanja
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/552 de la Comisión de 4 de abril de
