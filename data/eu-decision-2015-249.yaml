    (tiedoksiannettu numerolla C(2015) 603)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/249 оd 10. veljače 2015. o produženju
    važenja Odluke 2006/502/EZ kojom se od država članica zahtijeva poduzimanje
    mjera kojima se osigurava stavljanje na tržište isključivo upaljača sigurnih
    za djecu i zabranjuje stavljanje na tržište upaljača-noviteta (priopćeno pod
    brojem dokumenta C(2015) 603)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/249 végrehajtási határozata ( 2015. február
    10. ) a kizárólag gyermekbiztos öngyújtók forgalomba hozatalát biztosító
    és az újszerű öngyújtók forgalomba hozatalát tiltó, tagállamok által
    meghozandó intézkedések előírásáról szóló 2006/502/EK határozat érvényességének
    meghosszabbításáról (az értesítés a C(2015) 603. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/249 della Commissione, del 10 febbraio
    2015 , che proroga la validità della decisione 2006/502/CE che prescrive agli
    Stati membri di adottare provvedimenti per assicurare che siano immessi sul mercato
    esclusivamente accendini a prova di bambino e di proibire la commercializzazione
    di accendini fantasia [notificata con il numero C(2015) 603]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/249 ( 2015. gada 10. februāris
    ), ar kuru pagarina spēkā esības termiņu Lēmumam 2006/502/EK, ar ko dalībvalstīm
    pieprasa veikt pasākumus, kas atļautu tirgot tikai bērniem drošas šķiltavas
    un aizliegtu tirgot jaunrades šķiltavas (izziņots ar dokumenta numuru C(2015)
    603)
  type: main
- language: lt
  script: Latn
  content: 2015 m. vasario 10 d. Komisijos įgyvendinimo sprendimas (ES) 2015/249,
    kuriuo pratęsiamas Sprendimo 2006/502/EB, reikalaujančio, kad valstybės narės
    imtųsi priemonių, siekdamos užtikrinti, jog rinkoje būtų platinami tik apsaugą
    nuo vaikų turintys žiebtuvėliai ir uždrausti pateikti į rinką suvenyrinius
    žiebtuvėlius, galiojimas (pranešta dokumentu Nr. C(2015) 603)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/249 tal- 10
    ta' Frar 2015 li testendi l-validità tad-Deċiżjoni 2006/502/KE li tirrikjedi
    li l-Istati Membri jieħdu miżuri biex jiżguraw li l-lajters li jitqiegħdu
    fis-suq ikunu dawk biss reżistenti għat-tfal u li jipprojbixxu t-tqegħid fis-suq
    tal-lajters magħrufa bħala novelty lighters (notifikata bid-dokument C(2015)
    603)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/249 van de Commissie van 10 februari 2015
    tot verlenging van de geldigheidsduur van Beschikking 2006/502/EG waarbij de lidstaten
    worden verplicht maatregelen te treffen om ervoor te zorgen dat uitsluitend kinderveilige
    aanstekers op de markt worden gebracht en dat het op de markt brengen van novelty
    lighters wordt verboden (Kennisgeving geschied onder nummer C(2015) 603)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/249 z dnia 10 lutego 2015 r. przedłużająca
    obowiązywanie decyzji 2006/502/WE zobowiązującej państwa członkowskie do
    podjęcia środków w celu zapewnienia, by na rynek wprowadzane były wyłącznie
    zapalniczki zabezpieczone przed uruchomieniem przez dzieci, oraz w celu zakazania
    wprowadzania na rynek zapalniczek-gadżetów (notyfikowana jako dokument nr C(2015)
    603)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/249 da Comissão, de 10 de fevereiro de
    2015 , que prorroga a validade da Decisão 2006/502/CE que obriga os Estados-Membros
    a tomarem as medidas necessárias para garantir que no mercado apenas se coloquem
    isqueiros seguros para as crianças e proibir a colocação no mercado de isqueiros
    novidade ( novelty lighters ) [notificada com o número C(2015) 603]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/249 a Comisiei din 10 februarie
    2015 de prelungire a valabilității Deciziei 2006/502/CE de obligare a statelor
    membre să adopte măsuri prin care să se asigure că nu se pot introduce pe
    piață decât brichete cu caracteristici de siguranță pentru copii și să
    interzică introducerea pe piață a brichetelor fantezie [notificată cu numărul
    C(2015) 603]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/249 z 10. februára 2015 o
    predĺžení platnosti rozhodnutia 2006/502/ES, ktorým sa členské štáty vyzývajú
    prijať opatrenia s cieľom zabezpečiť, aby sa na trh uvádzali iba zapaľovače,
    ktoré sú zabezpečené proti použitiu deťmi, a zakázať uvádzanie zábavných
    zapaľovačov na trh [oznámené pod číslom C(2015) 603]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/249 z dne 10. februarja 2015 o podaljšanju
    veljavnosti Odločbe 2006/502/ES o zahtevi, da države članice sprejmejo ukrepe
    za zagotovitev, da se dajo na trg samo vžigalniki, ki so varni za otroke, in
    za prepoved dajanja neobičajnih vžigalnikov na trg (notificirano pod dokumentarno
    številko C(2015) 603)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/249 de la Comisión, de 10 de febrero
    de 2015 , que prolonga la validez de la Decisión 2006/502/CE, por la que se requiere
    a los Estados miembros que adopten medidas para garantizar que solo se comercialicen
    encendedores con seguridad para niños y que prohíban la comercialización de
    encendedores de fantasía [notificada con el número C(2015) 603]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2015/249 av den 10 februari 2015
    om förlängning av giltighetstiden för beslut 2006/502/EG om en förpliktelse
    för medlemsstaterna att förbjuda att icke barnsäkra eller leksaksliknande tändare
    släpps ut på marknaden [delgivet med nr C(2015) 603]
