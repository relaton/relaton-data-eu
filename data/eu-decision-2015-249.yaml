---
id: EUDecision2015249
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/249 of 10 February 2015 extending
    the validity of Decision 2006/502/EC requiring Member States to take measures
    to ensure that only lighters which are child-resistant are placed on the market
    and to prohibit the placing on the market of novelty lighters (notified under
    document C(2015) 603)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/249 de la Commission du 10 février 2015
    prorogeant la validité de la décision 2006/502/CE exigeant des États membres
    qu'ils prennent des mesures destinées à faire en sorte que seuls les briquets
    présentant des caractéristiques de sécurité enfants soient mis sur le marché
    et à interdire la mise sur le marché de briquets fantaisie [notifiée sous le
    numéro C(2015) 603]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/249 der Kommission vom 10. Februar 2015
    zur Verlängerung der Geltungsdauer der Entscheidung 2006/502/EG zur Verpflichtung
    der Mitgliedstaaten, Maßnahmen zu treffen, damit nur kindergesicherte Feuerzeuge
    in Verkehr gebracht werden und das Inverkehrbringen von Feuerzeugen mit Unterhaltungseffekten
    untersagt wird (Bekanntgegeben unter Aktenzeichen C(2015) 603)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/249 на Комисията
    от 10 февруари 2015 година за продължаване на
    валидността на Решение 2006/502/ЕО относно изискването
    към държавите членки да приемат мерки, за да
    гарантират, че на пазара се пускат единствено
    запалки, които са обезопасени спрямо деца,
    и да забранят пускането на пазара на запалки
    с нестандартен дизайн (нотифицирано под номер
    С(2015) 603)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/249 ze dne 10. února 2015 ,
    kterým se prodlužuje platnost rozhodnutí 2006/502/ES, kterým se po členských
    státech žádá, aby přijaly opatření zajišťující, aby se na trh uváděly
    pouze zapalovače, které jsou odolné dětem, a zakázaly uvádět na trh zapalovače
    neobvyklého typu (novelty) (oznámeno pod číslem C(2015) 603)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/249 af 10. februar 2015
    om forlængelse af gyldigheden af beslutning 2006/502/EF om et krav til medlemsstaterne
    om at træffe foranstaltninger til at sikre, at der kun markedsføres børnesikrede
    lightere, og forbyde markedsføringen af lightere, der kan henføres under kategorien
    gadgets (meddelt under nummer C(2015) 603)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/249 της Επιτροπής,
    της 10ης Φεβρουαρίου 2015 , για παράταση της ισχύος
    της απόφασης 2006/502/ΕΚ, που απαιτεί από τα κράτη
    μέλη, αφενός, να λάβουν μέτρα ώστε να εξασφαλίσουν
    ότι θα διατίθενται στην αγορά μόνο αναπτήρες
    ασφαλείς για τα παιδιά και, αφετέρου, να απαγορεύσουν
    τη διάθεση φαντεζί αναπτήρων στην αγορά [κοινοποιηθείσα
    υπό τον αριθμό C(2015) 603]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2015/249, 10. veebruar 2015 , otsuse 2006/502/EÜ
    (millega nõutakse liikmesriikidelt meetmete võtmist, et tagada üksnes lastekindlate
    tulemasinate turuleviimine ning keelustada uudsete tulemasinate turuleviimine)
    kehtivuse pikendamise kohta (teatavaks tehtud numbri C(2015) 603 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2015/249, annettu 10 päivänä
    helmikuuta 2015 , jäsenvaltioiden velvoittamisesta toteuttamaan toimia markkinoille
    saatettavien savukkeensytyttimien lapsiturvallisuuden varmistamiseksi ja muiden
    kuin savukkeensytytintä muistuttavien savukkeensytyttimien markkinoille saattamisen
