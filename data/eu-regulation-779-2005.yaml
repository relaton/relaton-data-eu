  content: Council Regulation (EC) No 779/2005 of 23 May 2005 terminating the partial
    interim review of the anti-dumping measures applicable to imports of silicon carbide
    originating in Ukraine
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 779/2005 du Conseil du 23 mai 2005 clôturant le réexamen
    intermédiaire partiel des mesures antidumping applicables aux importations de
    carbure de silicium originaire d’Ukraine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 779/2005 des Rates vom 23. Mai 2005 zur Einstellung
