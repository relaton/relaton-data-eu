    ενδιάμεσης επανεξέτασης των μέτρων αντιντάμπινγκ
    που επιβάλλονται στις εισαγωγές καρβιδίου
    του πυριτίου καταγωγής Ουκρανίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 779/2005, 23. mai 2005, millega lõpetatakse
