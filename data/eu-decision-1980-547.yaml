title:
- language: en
  script: Latn
  content: '80/547/EEC: Commission Decision of 22 May 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''Packard-Auto-Gamma Spectrometer, model 5921 S, with teletype''
    are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/547/CEE: Décision de la Commission, du 22 mai 1980, constatant que
    les conditions requises pour l'' admission en franchise des droits du tarif douanier
    commun de l'' appareil scientifique dénommé "Packard-Auto-Gamma Spectrometer,
    model 5921 S, with teletype" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/547/EWG: Entscheidung der Kommission vom 22. Mai 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    für das wissenschaftliche Gerät ,,Packard-Auto-Gamma Spectrometer, model 5921
    S, with teletype'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/547/EØF: Kommissionens beslutning af 22. maj 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Packard-Auto-Gamma Spectrometer, model 5921 S,
    med teletype" ikke er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/547/ΕΟΚ: Απόφαση τής Επιτροπής τής 22ας
    Μαΐου 1980 περί διαπιστώσεως ότι οι απαιτούμενοι
    όροι γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Packard—Auto—Gamma Spectrometer, model 5921
    S, with teletype» δέν πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/547/CEE: Decisione della Commissione, del 22 maggio 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Packard-Auto-Gamma
    Spectrometer, model 5921 S, with teletype" non sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/547/EEG: Beschikking van de Commissie van 22 mei 1980 vaststellende
    dat aan de voorwaarden, gesteld voor de toelating met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat ,,Packard-Auto-Gamma
    Spectrometer, model 5921 S, with teletype'' '' niet is voldaan'
