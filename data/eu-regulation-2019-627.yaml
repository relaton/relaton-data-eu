    amtlichen Kontrollen in Bezug auf für den menschlichen Verzehr bestimmte Erzeugnisse
    tierischen Ursprungs gemäß der Verordnung (EU) 2017/625 des Europäischen Parlaments
    und des Rates und zur Änderung der Verordnung (EG) Nr. 2074/2005 der Kommission
    in Bezug auf amtliche Kontrollen
  type: main
