title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/627 of 15 March 2019 laying
    down uniform practical arrangements for the performance of official controls on
    products of animal origin intended for human consumption in accordance with Regulation
    (EU) 2017/625 of the European Parliament and of the Council and amending Commission
    Regulation (EC) No 2074/2005 as regards official controls
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/627 de la Commission du 15 mars 2019
    établissant des modalités uniformes pour la réalisation des contrôles officiels
    en ce qui concerne les produits d'origine animale destinés à la consommation
    humaine conformément au règlement (UE) 2017/625 du Parlement européen et du
    Conseil et modifiant le règlement (CE) n° 2074/2005 de la Commission en ce qui
    concerne les contrôles officiels
  type: main
- language: de
  script: Latn
