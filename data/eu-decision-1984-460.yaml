title:
- language: en
  script: Latn
  content: '84/460/EEC: Commission Decision of 13 September 1984 authorizing France
    to confirm rights acquired before 1 May 1984 to carry out plantings of vines in
    areas intended for the production of certain quality wines psr (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/460/CEE: Décision de la Commission du 13 septembre 1984 autorisant
    la France à confirmer les droits de plantation de vigne sur des superficies destinées
    à la production de certains v.q.p.r.d. acquis avant le 1er mai 1984 (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/460/EWG: Entscheidung der Kommission vom 13. September 1984 zur Ermächtigung
    Frankreichs, die vor dem 1. Mai 1984 erworbenen Pflanzungsrechte für Rebflächen
    zur Erzeugung bestimmter Qualitätsweine b.A. zu bestätigen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/460/EØF: Kommissionens beslutning af 13. september 1984 om bemyndigelse
    af Frankrig til at bekræfte rettigheder til plantning af vinstokke på arealer
    bestemt til produktion af visse k.v.b.d., der er erhvervet inden den 1. maj 1984
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/460/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Σεπτεμβρίου 1984 με την οποία εξουσιοδοτείται
    η Γαλλία να επιβεβαιώσει τα δικαιώματα αμπέλων
    φυτεύσεως σε επιφάνειες που προορίζονται για
    την παραγωγή ορισμένων v.q.p.r.d. τα οποία έχουν
    κτηθεί πριν από την 1η Μαΐου 1984 (Το κείμενο στην
    γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/460/CEE: Decisione della Commissione del 13 settembre 1984 che autorizza
    la Francia a confermare i diritti di impianto di viti su superfici destinate alla
    produzione di taluni v.q.p.r.d. acquisiti alla data del 1o maggio 1984 (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/460/EEG: Beschikking van de Commissie van 13 september 1984 tot machtiging
