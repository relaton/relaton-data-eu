title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/784 of 17 May 2022 amending
    Implementing Decision (EU) 2019/1202 as regards harmonised standards for nozzle,
    test requirements and dimensions used for the automotive LPG filling system for
    light and heavy duty vehicles, and for explosion suppression systems
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/784 de la Commission du 17 mai 2022
    modifiant la décision d’exécution (UE) 2019/1202 en ce qui concerne les normes
    harmonisées relatives aux conditions d’essais et dimensions du pistolet utilisé
    dans le dispositif de remplissage GPL pour véhicules légers et poids lourds,
    ainsi qu’aux systèmes de suppression d’explosion
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/784 der Kommission vom 17. Mai 2022 zur
    Änderung des Durchführungsbeschlusses (EU) 2019/1202 in Bezug auf harmonisierte
    Normen für Anschlussstutzen, Prüfanforderungen und Abmessungen, die bei Füllsystemen
    an Autogasanlagen für leichte und schwere Fahrzeuge verwendet werden, sowie auf
    harmonisierte Normen für Explosions-Unterdrückungssysteme
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/784 на Комисията
    от 17 май 2022 година за изменение на Решение за
    изпълнение (ЕС) 2019/1202 по отношение на хармонизираните
    стандарти за накрайници, изисквания за изпитване
    и размери на автомобилните системи за зареждане
    с LPG за леки и товарни автомобили, както и за
    системи за потискане на експлозия
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/784 ze dne 17. května 2022,
    kterým se mění prováděcí rozhodnutí (EU) 2019/1202, pokud jde o harmonizované
    normy pro plnicí koncovky, zkušební požadavky a rozměry používané v plnicích
    zařízeních LPG pro osobní a nákladní automobily a pro systémy pro potlačení
    výbuchu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/784 af 17. maj 2022 om
    ændring af gennemførelsesafgørelse (EU) 2019/1202 for så vidt angår harmoniserede
    standarder for påfyldningsstuds, prøvningskrav og dimensioner, der anvendes
    i LPG (autogas)-påfyldningssystemet til lette og tunge køretøjer og i systemer
    til eksplosionsundertrykkelse
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/784 της Επιτροπής
    της 17ης Μαΐου 2022 για την τροποποίηση της εκτελεστικής
    απόφασης (ΕΕ) 2019/1202 όσον αφορά τα εναρμονισμένα
    πρότυπα για το ακροφύσιο, τις απαιτήσεις δοκιμής
