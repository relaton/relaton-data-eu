    no dispositivo de enchimento GPL auto para veículos ligeiros e pesados e aos
    sistemas de supressão de explosão
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/784 a Comisiei din 17 mai 2022
