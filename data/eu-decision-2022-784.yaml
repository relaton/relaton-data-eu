    a úsáidtear sa chóras líonta GPL mótarfheithiclí le haghaidh feithiclí
    éadroma agus feithiclí tromshaothair, agus maidir le córais plúchta pléisce
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/784 оd 17. svibnja 2022. o izmjeni
    Provedbene odluke (EU) 2019/1202 u pogledu usklađenih normi za mlaznice, ispitne
    zahtjeve i dimenzije sustava za punjenje lakih i teških vozila UNP-om te za sustave
    sprečavanja eksplozije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/784 végrehajtási határozata (2022. május 17.)
    az (EU) 2019/1202 végrehajtási határozatnak a könnyű- és nehézgépjárművek
    LPG-töltő rendszeréhez használt töltőpisztolyokra, vizsgálati követelményekre
    és méretekre, valamint a robbanáselfojtó rendszerekre vonatkozó harmonizált
    szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/784 della Commissione del 17 maggio 2022
    che modifica la decisione di esecuzione (UE) 2019/1202 per quanto riguarda le
    norme armonizzate per i requisiti di prova e le dimensioni della pistola utilizzata
    per il sistema di rifornimento del GPL carburante per veicoli leggeri e pesanti,
    e per i sistemi di soppressione dell’esplosione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/784 (2022. gada 17. maijs) par
    Īstenošanas lēmuma (ES) 2019/1202 grozījumiem, kas attiecas uz saskaņotiem
    standartiem par vieglā un kravas autotransporta SNG uzpildes sistēmas uzpildes
    sprauslām, testa prasībām un izmēriem un par sprādziena apslāpēšanas sistēmām
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/784 2022 m. gegužės 17 d.
