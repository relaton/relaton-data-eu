    și dimensiunile utilizate pentru sistemul de umplere cu GPL pentru autovehiculele
    ușoare și grele, precum și pentru sistemele de suprimare a exploziilor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/784 zo 17. mája 2022, ktorým
