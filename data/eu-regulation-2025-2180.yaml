  content: Commission Delegated Regulation (EU) 2025/2180 of 12 September 2025 supplementing
    Regulation (EU) 2023/2631 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the conditions for the registration
    of external reviewers, the criteria for assessing the sound and prudent management
    of external reviewers, the appropriateness of the knowledge, experience and training
    of the external reviewers’ employees, and the conditions under which external
    reviewers can outsource their assessment activities
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/2180 de la Commission du 12 septembre 2025
    complétant le règlement (UE) 2023/2631 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les conditions attachées
    à l’enregistrement d’examinateurs externes, les critères à appliquer pour
    évaluer si leur gestion est saine et prudente et si leurs salariés ont les connaissances,
    l’expérience et la formation appropriées, et les conditions sous réserve
    desquelles ils peuvent externaliser leurs activités d’évaluation
  type: main
