title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 626/82 of 17 March 1982 re-establishing
    the levying of customs duties on styrene, falling within subheading 29.01 D II
    and originating in Brazil, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 626/82 de la Commission, du 17 mars 1982, portant
    rétablissement de la perception des droits de douane applicables au styrène,
    de la sous-position 29.01 D II du tarif douanier commun, originaire du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 626/82 der Kommission vom 17. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Styrol der Tarifstelle 29.01 D II, mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 626/82 af 17. marts 1982 om genindførelse
    af opkrævning af told for styren, henhørende under pos. 29.01 D II og med oprindelse
    i Brasilien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 626/82 τής Επιτροπής τής
    17ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τό στυρόλιο τής διακρίσεως 29.
    01 Δ ΙΙ τού Κοινού Δασμολογίου, καταγωγής Βραζιλίας,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 626/82 della Commissione, del 17 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili allo stirene (stirolo) della sottovoce
    29.01 D II della tariffa doganale comune, originario del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 626/82 van de Commissie van 17 maart 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op styreen van
    postonderverdeling 29.01 D II, van oorsprong uit Brazilië, waarvoor de in Verordening
    (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
