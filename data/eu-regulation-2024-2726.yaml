    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu minimalne udaljenosti
    od obale i minimalne dubine mora za potegače otvorenog mora koje love hujice
    (Gymnammodytes cicerelus i G. semisquamatus) i glavoče (Aphia minuta i Crystalogobius
    linearis) u određenim teritorijalnim vodama Španjolske (Katalonija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2726 végrehajtási rendelete (2024. október 24.)
    az 1967/2006/EK tanácsi rendelettől a Spanyolország egyes felségvizein (Katalónia)
    a homoki angolna (Gymnammodytes cicerelus és G. semisquamatus), valamint a gébfélék
    (Aphia minuta és Crystalogobius linearis) halászatában alkalmazott, hajóról
    működtetett kerítőhálók telepítésének a parttól számított legkisebb
    távolsága és legkisebb mélysége tekintetében történő eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/2726 della Commissione, del 24 ottobre
    2024, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto riguarda la distanza minima dalla costa e la profondità minima per le
    sciabiche da natante utilizzate per la pesca del cicerello (Gymnammodytes cicerelus
    e Gymnammodytes semisquamatus) e del ghiozzo (Aphia minuta e Crystalogobius linearis)
    in talune acque territoriali della Spagna (Catalogna)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/2726 (2024. gada 24. oktobris),
    ar kuru attiecībā uz minimālo attālumu no krasta un minimālo dziļumu, kas
    noteiktos Spānijas (Katalonijas) teritoriālajos ūdeņos jāievēro tūbīšu
    (Gymnammodytes cicerelus un G. semisquamatus) un jūrasgrunduļu (Aphia minuta
    un Crystalogobius linearis) zvejā ar laivas velkamajiem vadiem, pagarina atkāpi
    no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2024 m. spalio 24 d. Komisijos įgyvendinimo reglamentas (ES) 2024/2726,
    kuriuo pratęsiamas nuostatos, leidžiančios nukrypti nuo Tarybos reglamento
    (EB) Nr. 1967/2006 nuostatų dėl minimalaus atstumo nuo kranto ir minimalaus
    jūros gylio reikalavimų, taikomos laivų traukiamaisiais tinklais žvejojant
    tobines (Gymnammodytes cicerelus ir G. semisquamatus) ir afijas (Aphia minuta
    ir Crystalogobius linearis) tam tikruose Ispanijos (Katalonijos) teritoriniuose
    vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/2726 tal-24
    ta’ Ottubru 2024 li jestendi deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tad-distanza minima mill-kosta u l-fond minimu tal-baħar għat-tartaruni
    li jistadu għaċ-ċiċċirell (Gymnammodytes cicerelus u G. semisquamatus) u
    għall-gobi (Aphia minuta u Crystalogobius linearis) f’ċerti ibħra territorjali
    ta’ Spanja (il-Katalonja)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/2726 van de Commissie van 24 oktober 2024
    tot verlenging van een afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft de minimumafstand van de kust en de minimumzeediepte voor bootzegens
    voor de visserij op zandspiering (Gymnammodytes cicerelus en G. semisquamatus)
    en op glasgrondel (Aphia minuta en Crystalogobius linearis) in bepaalde territoriale
    wateren van Spanje (Catalonië)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/2726 z dnia 24 października
    2024 r. przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006
    w zakresie minimalnych odległości od brzegu i minimalnej głębokości morza
    przy połowach dobijakowatych (Gymnammodytes cicerelus i G. semisquamatus) oraz
    babkowatych (Aphia minuta i Crystalogobius linearis) niewodami pełnomorskimi
    na niektórych wodach terytorialnych Hiszpanii (Katalonia)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/2726 da Comissão, de 24 de outubro
    de 2024, que prorroga uma derrogação ao Regulamento (CE) n.o 1967/2006 do Conselho
    no respeitante à distância mínima da costa e à profundidade mínima para as
    redes envolventes-arrastantes de alar para bordo utilizadas na pesca de galeota
    (Gymnammodytes cicerelus e G. semisquamatus) e de cabozes (Aphia minuta e Crystalogobius
    linearis) em determinadas águas territoriais de Espanha (Catalunha)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2726 al Comisiei din 24 octombrie
    2024 de prelungire a unei derogări de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește distanța minimă față de coastă și adâncimea minimă
    a mării pentru năvoadele de navă utilizate pentru pescuitul uvei (Gymnammodytes
    cicerelus și G. semisquamatus) și al guvizilor (Aphia minuta și Crystalogobius
    linearis) în anumite ape teritoriale ale Spaniei (Catalonia)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/2726 z 24. októbra 2024, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o minimálnu vzdialenosť od pobrežia a minimálnu hĺbku mora v prípade
    lovu piesočnicovitých (Gymnammodytes cicerelus a G. semisquamatus) a býčkovitých
    (Aphia minuta a Crystalogobius linearis) záťahovými sieťami ovládanými z
    lode v určitých pobrežných vodách Španielska (Katalánsko)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/2726 z dne 24. oktobra 2024 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in najmanjše morske globine za potegalke odprtega morja za ribolov peščenk
    (Gymnammodytes cicerelus in G. semisquamatus) in glavačev (Aphia minuta in Crystalogobius
    linearis) v določenih teritorialnih vodah Španije (Katalonija)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/2726 de la Comisión, de 24 de octubre
    de 2024, por el que se prorroga una excepción a lo dispuesto en el Reglamento
    (CE) n.o 1967/2006 del Consejo en lo concerniente a la distancia mínima de la
    costa y la profundidad marina mínima para la pesca de lanzones (Gymnammodytes
    cicerelus y G. semisquamatus) y góbidos (Aphia minuta y Crystallogobius linearis)
    con redes de tiro desde embarcación en determinadas aguas territoriales de España
    (Cataluña)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/2726 av den 24 oktober
    2024 om förlängning av ett undantag från rådets förordning (EG) nr 1967/2006
    vad gäller minimiavstånd från kusten och minimidjup för fiske med fartygsvad/not
    efter tobisfiskar (Gymnammodytes cicerelus och G. semisquamatus) och smörbultar
    (Aphia minuta och Crystalogobius linearis) i vissa territorialvatten i Spanien
    (Katalonien)
