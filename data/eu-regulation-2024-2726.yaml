title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2726 of 24 October 2024 extending
    a derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from the coast and the minimum sea depth for boat seines fishing for
    sand eel (Gymnammodytes cicerelus and G. semisquamatus) and gobies (Aphia minuta
    and Crystalogobius linearis) in certain territorial waters of Spain (Catalonia)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2726 de la Commission du 24 octobre
    2024 portant prolongation de la dérogation au règlement (CE) no 1967/2006 du
    Conseil en ce qui concerne la distance de la côte et la profondeur minimales
    pour les sennes de bateau pêchant le lançon (Gymnammodytes cicerelus et G. semisquamatus)
    et les gobies (Aphia minuta et Crystalogobius linearis) dans certaines eaux territoriales
    de l’Espagne (Catalogne)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2726 der Kommission vom 24. Oktober
    2024 zur Verlängerung einer Abweichung von der Verordnung (EG) Nr. 1967/2006
    des Rates hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe
    für Bootswaden für den Fang von Sandaal (Gymnammodytes cicerelus und G. semisquamatus)
    und Grundeln (Aphia minuta und Crystalogobius linearis) in bestimmten Hoheitsgewässern
    Spaniens (Katalonien)
  type: main
- language: bg
  script: Cyrl
