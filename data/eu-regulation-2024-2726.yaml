    koskevan, neuvoston asetuksesta (EY) N:o 1967/2006 myönnetyn poikkeuksen jatkamisesta
    kalastettaessa tuulenkalaa (Gymnammodytes cicerelus ja G. semisquamatus) sekä
    tokkoa (Aphia minuta ja Crystalogobius linearis) alukselta vedettävillä nuotilla
    tietyillä Espanjan aluevesillä (Katalonia)
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/2726 ón gCoimisiún an 24 Deireadh
    Fómhair 2024 lena gcuirtear síneadh le maolú ar Rialachán (CE) Uimh. 1967/2006
    ón gComhairle a mhéid a bhaineann leis an bhfad íosta ón gcósta agus doimhneacht
    íosta na mara maidir le saighní báid lena ndéantar iascaireacht ar an gcorr
    gainimh (Gymnammodytes cicerelus agus G. semisquamatus) agus ar an mac siobháin
    trédhearcach (Aphia minuta agus Crystalogobius linearis) in uiscí teorann áirithe
    de chuid na Spáinne (an Chatalóin)
  type: main
- language: hr
  script: Latn
