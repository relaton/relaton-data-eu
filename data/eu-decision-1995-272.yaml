    sanottujen EPROMien (erasable programmable read only memories), tuonnissa käyttöön
    otetun lopullisen polkumyyntitullin suspendoimisesta'
  type: main
- language: it
  script: Latn
  content: '95/272/CE: Decisione della Commissione, del 14 luglio 1995, che sospende
    il dazio antidumping definitivo istituito su alcuni tipi di microcircuiti elettronici
    detti Eprom (erasable programmable read only memories) originari del Giappone'
  type: main
- language: nl
  script: Latn
  content: '95/272/EG: Besluit van de Commissie van 14 juli 1995 tot opschorting van
