title:
- language: en
  script: Latn
  content: '95/272/EC: Commission Decision of 14 July 1995 suspending the definitive
    anti-dumping duty imposed on imports of certain types of electronic microcircuits
    known as EPROMs (erasable programmable read only memories) originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '95/272/CE: Décision de la Commission, du 14 juillet 1995, portant suspension
    du droit antidumping définitif institué sur les importations de certains types
    de microcircuits électroniques, dits EPROMs, originaires du Japon'
  type: main
- language: de
  script: Latn
  content: '95/272/EG: Beschluß der Kommission vom 14. Juli 1995 über die Aussetzung
    des endgültigen Antidumpingzolls auf die Einfuhren bestimmter elektronischer
    Mikroschaltungen, sogenannter EPROMs (löschbare, programmierbare Nur-Lese-Speicher),
    mit Ursprung in Japan'
  type: main
- language: da
  script: Latn
  content: '95/272/EF: Kommissionens afgørelse af 14. juli 1995 om suspension af
    den endelige antidumpingtold på importen af visse tyrer elektroniske mikrokredsløb,
    såkaldte EPROM'' s (Erasable Programmable Read Only Memories) med oprindelse
    i Japan'
  type: main
- language: el
  script: Grek
  content: '95/272/ΕΚ: Απόφαση της Επιτροπής της 14ης Ιουλίου
