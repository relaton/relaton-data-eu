    microschakelingen, bekend als EPROM'' s (Erasable Programmable Read Only Memories),
    van oorsprong uit Japan'
  type: main
- language: pt
  script: Latn
  content: '95/272/CE: Decisão da Comissão, de 14 de Julho de 1995, que suspende
