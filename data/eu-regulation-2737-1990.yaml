title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2737/90 of 24 September 1990 imposing a definitive
    anti-dumping duty on imports of tungsten carbide and fused tungsten carbide originating
    in the People's Republic of China and definitively collecting the provisional
    duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2737/90 du Conseil, du 24 septembre 1990, instituant
    un droit antidumping définitif sur les importations de carbure de tungstène
    et de carbure de tungstène fondu originaires de la République populaire de Chine
    et portant perception définitive du droit provisoire
  type: main
- language: de
