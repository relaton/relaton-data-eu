    mit Ursprung in der Volksrepublik China und zur endgültigen Vereinnahmung des
    vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2737/90 af 24. september 1990 om indførelse
