  type: main
- language: fi
  script: Latn
  content: '94/836/ETY: Komission päätös, tehty 15 päivänä joulukuuta 1994,
    tavoitteeseen 5 a liittyviä yhteisön rakenteellisia toimenpiteitä koskevan
    yhtenäisen ohjelma-asiakirjan hyväksymisestä jaksolle 1994 - 1999 maataloustuotteiden
    jalostamisen ja kaupan pitämisen edellytysten parantamiseksi Yhdistyneessä kuningaskunnassa
