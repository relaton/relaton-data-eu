title:
- language: en
  script: Latn
  content: '94/836/EC: Commission Decision of 15 December 1994 approving the Single
    Programming Document for Community structural measures for improving the processing
    and marketing conditions for agricultural products in the United Kingdom, except
    for the Objective 1 regions of Merseyside, Highlands and Islands and Northern
    Ireland, in respect of Objective 5a, covering the period between 1994 and 1999
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/836/CE: Décision de la Commission, du 15 décembre 1994, portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits agricoles au Royaume-Uni, à l''exception des régions d''objectif
    nº 1 Merseyside, Highlands et Islands et Irlande du Nord, au titre de l''objectif
    nº 5 a), couvrant la période entre 1994 et 1999 (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/836/EG: Entscheidung der Kommission vom 15. Dezember 1994 zur Genehmigung
    des den Zeitraum 1994 bis 1999 betreffenden einzigen Programmplanungsdokuments
    zu den strukturellen Interventionen der Gemeinschaft zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen landwirtschaftlicher Erzeugnisse im Rahmen der Zielvorgabe
    5a im Vereinigten Königreich, mit Ausnahme der Ziel-1-Gebiete Merseyside, Highlands
    and Islands und Nordirland (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/836/EF: Kommissionens beslutning af 15. december 1994 om godkendelse
