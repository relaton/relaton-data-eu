    undtagelse af mål nr. 1 - områderne i Merseyside, Højlandene og Øerne samt
    Nordirland, for mål nr. 5 a for perioden 1994 til 1999 (Kun den engelske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
