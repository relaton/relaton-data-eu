schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement n 136/63/CEE de la Commission, du 17 décembre 1963, portant,
    pour la période du 1er janvier au 31 mars 1964, adaptation et fixation des prix
    d'écluse pour les oeufs de volaille en coquilles et les volailles vivantes et
    abattues et fixation des prélèvements envers les pays tiers pour les oeufs de
    volaille en coquilles, les volailles vivantes d'un poids l'excédant pas 185 grammes
    et les volailles abattues
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 136/63/EWG der Kommission vom 17. Dezember 1963 zur Anpassung
    und Festsetzung der Einschleusungspreise für Eier von Hausgeflügel, lebendes
    und geschlachtetes Hausgeflügel und zur Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für die Zeit vom 1. Januar bis zum 31. März 1964
  type: main
- language: it
  script: Latn
  content: Regolamento n. 136/63/CEE della Commissione del 17 dicembre 1963 che adatta
    e fissa i prezzi limite per le uova di volatili da cortile e per i volatili da
    cortile vivi e macellati e fissa i prelievi nei confronti dei paesi terzi per
    le uova in guscio di volatili da cortile, per i volatili da cortile vivi di peso
    non superiore a 185 grammi e per i volatili da cortile macellati per il periodo
    1 gennaio - 31 marzo 1964
  type: main
- language: nl
  script: Latn
  content: Verordening no. 136/63/EEG van de Commissie van 17 december 1963 houdende
    aanpassing en vaststelling van de sluisprijzen voor eieren van pluimvee, levend
    pluimvee en geslacht pluimvee, alsmede vaststelling van de heffingen ten opzichte
    van derde landen op eieren in de schaal van pluimvee, levend pluimvee dat niet
    meer dan 185 gram weegt en geslacht pluimvee, voor de periode van 1 januari 1964
    tot en met 31 maart 1964
  type: main
