title:
- language: en
  script: Latn
  content: Regulation (EEC) No 357/73 of the Commission of 31 January 1973 on the
    movement of goods obtained in the Community under a procedure for the suspension
    or drawback of customs duties or other import charges
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 357/73 de la Commission, du 31 janvier 1973, relatif
    à la circulation des marchandises obtenues dans la Communauté sous un régime
    comportant suspension ou ristourne de droits de douane ou d'autres impositions
    à l'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 357/73 der Kommission vom 31. Januar 1973 über den
    Verkehr mit Waren, die in der Gemeinschaft in einem Verfahren hergestellt sind,
    das die Nichterhebung oder Rückvergütung der Zölle oder anderen Eingangsabgaben
    vorsieht
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 357/73 af 31. januar 1973 vedrørende
    bevægeligheden af varer, fremstillet i Fællesskabet, under et system omfattende
    fritagelse for eller godtgørelse af told eller andre indførselsafgifter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 357/73 della Commissione, del 31 gennaio 1973, relativo
    alla circolazione delle merci ottenute nella Comunità sotto un regime recante
    sospensione o riduzione di dazi o di altre imposizioni all'importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 357/73 van de Commissie van 31 januari 1973 betreffende
    het verkeer van goederen die in de Gemeenschap zijn verkregen onder een regeling
    houdende opschorting of teruggave van douanerechten of andere belastingen bij
    invoer
