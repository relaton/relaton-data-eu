  content: Commission Regulation (EEC) No 1881/92 of 6 July 1992 re-establishing the
    levying of customs duties on products of categories 58, 59 and 66 (order Nos 40.0580,
    40.0590 and 40.0660), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
