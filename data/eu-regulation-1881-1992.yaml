    des catégories 58, 59 et 66 (numéros d' ordre 40.0580, 40.0590 et 40. 0660)
    originaires de Chine, bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 3832/90 du Conseil
  type: main
