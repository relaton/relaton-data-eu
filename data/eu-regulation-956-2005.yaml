  content: Commission Regulation (EC) No 956/2005 of 23 June 2005 amending Regulation
    (EEC) No 411/88 on the method and the rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying-in, storage and
    disposal
  type: main
- language: fr
  script: Latn
