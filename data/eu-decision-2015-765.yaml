    regiono valstybių preferencinių kilmės taisyklių regioninę konvenciją
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2015/765 tas-7 ta' Mejju 2015 dwar il-pożizzjoni
