    tal-kunċett ta' “prodotti oriġinarji” u metodi ta' kooperazzjoni amministrattiva
    bi protokoll ġdid li, f'dak li għandu x'jaqsam mar-regoli tal-oriġini, jirreferi
    għall-Konvenzjoni Reġjonali dwar ir-regoli preferenzjali tal-oriġini pan-Ewro-Mediterranji
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2015/765 van de Raad van 7 mei 2015 betreffende het namens
    de Europese Unie in te nemen standpunt in het Gemengd Comité, ingesteld bij de
    Overeenkomst tussen de Europese Gemeenschap, enerzijds, en de regering van Denemarken
    en de landsregering van de Faeröer, anderzijds, over de vervanging van Protocol
    nr. 3 bij deze overeenkomst betreffende de definitie van het begrip „producten
    van oorsprong” en regelingen voor administratieve samenwerking door een nieuw
    protocol waarin, wat de oorsprongsregels betreft, naar de Regionale Conventie
    betreffende de pan-Euro-mediterrane preferentiële oorsprongsregels wordt verwezen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2015/765 z dnia 7 maja 2015 r. w sprawie stanowiska,
    jakie ma zostać przyjęte w imieniu Unii Europejskiej w ramach Wspólnego Komitetu
    ustanowionego Umową między Wspólnotą Europejską, z jednej strony, a Rządem
    Daniii Rządem Lokalnym Wysp Owczych, z drugiej strony,w odniesieniu do zastąpienia
    Protokołu 3 do tej umowy dotyczącego definicji pojęcia „produkty pochodzące”
    oraz metod współpracy administracyjnej nowym protokołem, który w odniesieniu
    do reguł pochodzenia odwołuje się do Regionalnej konwencji w sprawie paneurośródziemnomorskich
    preferencyjnych reguł pochodzenia
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2015/765 do Conselho, de 7 de maio de 2015, relativa à posição
    a adotar, em nome da União Europeia, no âmbito do Comité Misto instituído
    pelo Acordo entre a Comunidade Europeia, por um lado, e o Governo da Dinamarca
    e o Governo Regional das ilhas Faroé, por outro, sobre a substituição do Protocolo
    n.° 3 do referido acordo, relativo à definição do conceito de «produtos originários»
    e aos métodos de cooperação administrativa, por um novo protocolo que, no que
    se refere às regras de origem, remeta para a Convenção Regional sobre Regras
    de Origem Preferenciais Pan-Euro-Mediterrânicas
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2015/765 a Consiliului din 7 mai 2015 privind poziția care
    urmează să fie adoptată în numele Uniunii Europene în cadrul Comitetului
    mixt instituit prin Acordul între Comunitatea Europeană, pe de o parte, și
    Guvernul Danemarcei și guvernul local al Insulelor Feroe, pe de altă parte,
    cu privire la înlocuirea Protocolului 3 la respectivul acord, privind definirea
    conceptului de „produse originare” și a metodelor de cooperare administrativă,
    cu un nou protocol care, în ceea ce privește regulile de origine, să facă
    trimitere la Convenția regională cu privire la regulile de origine preferențiale
    pan-euro-mediteraneene
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2015/765 zo 7. mája 2015 o pozícii, ktorá sa
    má prijať v mene Európskej únie v Spoločnom výbore zriadenom Dohodou medzi
    Európskym spoločenstvom na jednej strane a vládou Dánska a miestnou vládou
    Faerských ostrovov na strane druhej, pokiaľ ide o nahradenie Protokolu 3 k uvedenej
    dohode týkajúceho sa definície obsahu „pôvodné výrobky“ a metód spolupráce
    v oblasti správy novým protokolom, ktorý, pokiaľ ide o pravidlá pôvodu,
    odkazuje na Regionálny dohovor o paneuro-stredomorských preferenčných pravidlách
    pôvodu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2015/765 z dne 7. maja 2015 o stališču, ki se ga sprejme
    v imenu Evropske unije v okviru Skupnega odbora, ustanovljenega s Sporazumom med
    Evropsko skupnostjo na eni strani ter vlado Danske in lokalno vlado Ferskih otokov
    na drugi strani, glede nadomestitve Protokola 3 k navedenemu sporazumu o opredelitvi
    pojma „proizvodi s poreklom“ in o načinih upravnega sodelovanja z novim protokolom,
    ki se glede pravil o poreklu sklicuje na Regionalno konvencijo o pan-evro-mediteranskih
    preferencialnih pravilih o poreklu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2015/765 del Consejo, de 7 de mayo de 2015, relativa a la
    posición que deberá adoptarse en nombre de la Unión Europea en el seno del
    Comité Mixto instituido por el Acuerdo entre la Comunidad Europea, por una parte,
    y el Gobierno de Dinamarca y el Gobierno local de las Islas Feroe, por otra, por
    lo que respecta a la sustitución de su Protocolo 3 relativo a la definición
    de la noción de «productos originarios» y a los métodos de cooperación administrativa
    por un nuevo Protocolo que, por lo que respecta a las normas de origen, se refiera
    al Convenio regional sobre las normas de origen preferenciales paneuromediterráneas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2015/765 av den 7 maj 2015 om den ståndpunkt som Europeiska
    unionen ska inta i den gemensamma kommitté som inrättades genom avtalet mellan
    Europeiska gemenskapen, å ena sidan, och Danmarks regering och Färöarnas Landsstyre,
    å andra sidan, beträffande ersättande av protokoll 3 till avtalet, om definitionen
    av begreppet ursprungsprodukter och om metoder för administrativt samarbete,
    med ett nytt protokoll, som vad gäller ursprungsregler hänvisar till den regionala
    konventionen om Europa–Medelhavstäckande regler om förmånsursprung
