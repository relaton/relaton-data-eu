    Europos bendrijos ir Danijos Vyriausybės bei Farerų salų vietos valdžios susitarimu,
    dėl to Susitarimo 3 protokolo dėl sąvokos „produktų kilmė“ apibrėžimo
    ir administracinio bendradarbiavimo metodų pakeitimo nauju protokolu, kuriame
