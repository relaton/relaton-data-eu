    meghatározásáról és az igazgatási együttműködés módszereiről szóló
    3. jegyzőkönyvnek egy új, a származási szabályok tekintetében a pán-euromediterrán
    preferenciális származási szabályokról szóló regionális egyezményre hivatkozó
    jegyzőkönyvvel történő helyettesítésével összefüggésben az Európai
    Unió nevében képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2015/765 del Consiglio, del 7 maggio 2015, relativa alla
    posizione che deve essere adottata a nome dell'Unione europea in sede di comitato
    misto istituito dall'accordo tra la Comunità europea, da una parte, e il governo
    della Danimarca e il governo locale delle Isole Færøer, dall'altra, con riguardo
    alla sostituzione del protocollo n. 3 di tale accordo, relativo alla definizione
    della nozione di «prodotti originari» e ai metodi di cooperazione amministrativa,
    con un nuovo protocollo che, per quanto riguarda le norme di origine, faccia riferimento
    alla convenzione regionale sulle norme di origine preferenziali paneuromediterranee
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2015/765 (2015. gada 7. maijs) par nostāju, kas Eiropas
