  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2015/765, annettu 7 päivänä toukokuuta 2015,
    Euroopan yhteisön sekä Tanskan hallituksen ja Färsaarten maakuntahallituksen
    sopimuksella perustetussa sekakomiteassa Euroopan unionin puolesta esitettävästä
    kannasta käsitteen ”alkuperätuotteet” määrittelyä ja hallinnollisen yhteistyön
    menetelmiä koskevan mainitun sopimuksen pöytäkirjan N:o 3 korvaamiseen uudella
    pöytäkirjalla, jossa alkuperäsääntöjen osalta viitataan etuuskohteluun oikeuttavia
