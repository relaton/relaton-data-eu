  script: Grek
  content: Απόφαση (ΕΕ) 2015/765 του Συμβουλίου, της 7ης
    Μαΐου 2015, σχετικά με τη θέση που πρόκειται να
    ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης στο
    πλαίσιο της μεικτής επιτροπής που συγκροτήθηκε
