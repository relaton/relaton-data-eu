title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/765 of 7 May 2015 on the position to be adopted
    on behalf of the European Union within the Joint Committee established by the
    Agreement between the European Community, of the one part, and the Government
    of Denmark and the Home Government of the Faroe Islands, of the other part, as
    regards the replacement of Protocol 3 to that Agreement, concerning the definition
    of the concept of ‘originating products’ and methods of administrative cooperation,
    by a new protocol which, as regards the rules of origin, refers to the Regional
    Convention on pan-Euro-Mediterranean preferential rules of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/765 du Conseil du 7 mai 2015 relative à la position
    à prendre au nom de l'Union européenne au sein du comité mixte institué par
    l'accord entre la Communauté européenne, d'une part, et le gouvernement du Danemark
    et le gouvernement local des îles Féroé, d'autre part, en ce qui concerne le
    remplacement du protocole n° 3 dudit accord, relatif à la définition de la
    notion de «produits originaires» et aux méthodes de coopération administrative,
    par un nouveau protocole qui, pour ce qui est des règles d'origine, fait référence
    à la convention régionale sur les règles d'origine préférentielles paneuro-méditerranéennes
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2015/765 des Rates vom 7. Mai 2015 über den Standpunkt,
    der im Namen der Europäischen Union im mit dem Abkommen zwischen der Europäischen
    Gemeinschaft einerseits und der Regierung von Dänemark und der Landesregierung
    der Färöer andererseits eingesetzten Gemischten Ausschuss im Hinblick auf die
    Ersetzung des Protokolls Nr. 3 dieses Abkommens über die Bestimmung des Begriffs
    „Erzeugnisse mit Ursprung in“ oder „Ursprungserzeugnisse“ und über die
    Methoden der Zusammenarbeit der Verwaltungen durch ein neues Protokoll, das hinsichtlich
    der Ursprungsregeln auf das Regionale Übereinkommen über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    Bezug nimmt, zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2015/765 на Съвета от 7 май 2015 година
    относно позицията, която да бъде приета от
    името на Европейския съюз в рамките на Съвместния
    комитет, създаден със Споразумението между
    Европейската общност, от една страна, и правителството
    на Кралство Дания и местното правителство
    на Фарьорските острови, от друга страна, във
    връзка със замяната на протокол 3 относно определението
    на понятието „продукти с произход“ и методите
    на административно сътрудничество към посоченото
    споразумение с нов протокол, в който по отношение
    на правилата за произход се прави препратка
    към Регионалната конвенция за паневросредиземноморските
    преференциални правила за произход
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2015/765 ze dne 7. května 2015 o postoji, který
    má být zaujat jménem Evropské unie ve smíšeném výboru zřízeném Dohodou
    mezi Evropským společenstvím na straně jedné a vládou Dánska a autonomní
    vládou Faerských ostrovů na straně druhé, pokud jde o nahrazení protokolu
    3 k uvedené dohodě o definici pojmu „původní produkty“ a metodách správní
    spolupráce novým protokolem, který, pokud jde o pravidla původu, odkazuje
    na Regionální úmluvu o celoevropsko-středomořských preferenčních pravidlech
    původu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2015/765 af 7. maj 2015 om den holdning, der skal
    indtages på vegne af Den Europæiske Union i Den Blandede Komité, der er nedsat
    i henhold til aftalen mellem Det Europæiske Fællesskab på den ene side og Danmarks
    regering og Færøernes landsstyre på den anden side, vedrørende erstatning
    af nævnte aftales protokol nr. 3 om definition af begrebet »produkter med oprindelsesstatus«
    og ordninger for administrativt samarbejde med en ny protokol, hvori der for så
    vidt angår oprindelsesreglerne henvises til den regionale konvention om pan-Euro-Middelhavsregler
    for præferenceoprindelse
  type: main
