  script: Latn
  content: Odluka Vijeća (EU) 2015/765 od 7. svibnja 2015. o stajalištu koje treba
    donijeti u ime Europske unije u okviru Zajedničkog odbora osnovanog Sporazumom
    između Europske zajednice, s jedne strane, te vlade Danske i lokalne vlade Farskih
    otoka, s druge strane, u pogledu zamjene Protokola 3. uz taj Sporazum o definiciji
    pojma „proizvodi s podrijetlom” i načinima administrativne suradnje novim
    protokolom u kojem se u pogledu pravila o podrijetlu upućuje na Regionalnu konvenciju
    o pan-euro-mediteranskim povlaštenim pravilima podrijetla
  type: main
