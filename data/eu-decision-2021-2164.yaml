    съставени от произведен in-situ азот, за опазването
    на културното наследство (нотифицирано под
    номер C(2021) 8670) (само текстовете на нидерландски
    и френски език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/2164 ze dne 3. prosince 2021,
    kterým se Belgii v zájmu ochrany kulturního dědictví umožňuje povolit biocidní
    přípravky sestávající z dusíku připravovaného na místě (oznámeno pod
    číslem C(2021)8670) (Pouze nizozemské a francouzské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/2164 af 3. december 2021
    om tilladelse til, at Belgien godkender biocidholdige produkter, der består af
