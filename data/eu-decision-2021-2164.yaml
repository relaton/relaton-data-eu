title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/2164 of 3 December 2021 allowing
    Belgium to authorise biocidal products consisting of in-situ generated nitrogen
    for the protection of cultural heritage (notified under document C(2021) 8670)
    (Only the Dutch and French texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/2164 de la Commission du 3 décembre
    2021 permettant à la Belgique d’autoriser les produits biocides constitués
    d’azote généré in situ pour la protection du patrimoine culturel [notifiée
    sous le numéro C(2021) 8670] (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/2164 der Kommission vom 3. Dezember 2021
    über die Ermächtigung Belgiens, zum Schutz des kulturellen Erbes Biozidprodukte
    in Form von in situ hergestelltem Stickstoff zuzulassen (Bekannt gegeben unter
    Aktenzeichen C(2021) 8670) (Nur der französische und der niederländische Text
    sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/2164 на Комисията
    от 3 декември 2021 година за предоставяне на възможност
