---
id: EUDecision1978407
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 April 1978 authorizing the French Republic not
    to apply Community treatment to garments, clothing accessories and umbrellas,
    falling within heading No ex 61.01, ex 61.02, 61.03 or 66.01 of the Common Customs
    Tariff, originating in the People's Republic of China and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/407/CEE: Décision de la Commission, du 17 avril 1978, autorisant la
    République française à exclure du traitement communautaire les vêtements,
    les accessoires du vêtement et les parapluies, des positions Ex 61.01, Ex 61.02,
    61.03 et 66.01 du Tarif douanier commun, originaires de la République populaire
    de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. April 1978, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Bekleidung und Bekleidungszubehör
    und Regenschirme der Tarifnummern ex 61.01, ex 61.03 und 66.01 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. april 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande, tilbehør,
    paraplyer, som henhører under pos. ex 61.01, ex 61.02, 61.03 og 66.01 i den fælles
    toldtarif, har oprindelse i Den kinesiske Folkerepublik, og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 aprile 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti, gli accessori
    di abbigliamento e gli ombrelli delle voci ex 61.01, ex 61.02, 61.03 e 66.01 della
    tariffa doganale comune, originari della Repubblica popolare cinese e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 april 1978 waarbij de Franse Republiek
    wordt gemachtigd kleding, kledingtoebehoren en paraplu's, van de posten ex 61.01,
    ex 61.02, 61.03 en 66.01 van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
