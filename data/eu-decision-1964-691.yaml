title:
- language: fr
  script: Latn
  content: Décision 64/691/CEE de la Commission, du 6 novembre 1964, autorisant la
    perception de taxes compensatoires sur les importations en République française
    de sucreries sans cacao, ne contenant pas de liqueur alcoolique, en provenance
    de certains États membres
  type: main
- language: de
  script: Latn
  content: '64/691/EWG: Entscheidung der Kommission vom 6. November 1964 über die
    Erhebung von Ausgleichsabgaben auf Einfuhren von Zuckerwaren ohne Kakaogehalt,
    nicht alkoholhaltig, aus verschiedenen Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '64/691/CEE: Decisione della Commissione, del 6 novembre 1964, che autorizza
    la riscossione di tasse di compensazione sulle importazioni in Francia di prodotti
    a base di zuccheri senza cacao non contenenti sostanze alcoliche, in provenienza
    da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/691/EEG: Beschikking van de Commissie van 6 november 1964 houdende
    machtiging tot het leggen van een compenserende heffing op de invoer in de Franse
    Republiek van suikerwerk zonder cacao, geen likeur bevattende, uit bepaalde Lid-Staten'
  type: main
