title:
- language: en
  script: Latn
  content: Commission Directive 86/489/EEC of 24 September 1986 amending Directive
    77/794/EEC laying down detailed rules for implementing certain provisions of Directive
    76/308/EEC on mutual assistance for the recovery of claims resulting from operations
    forming part of the system of financing the European Agricultural Guidance and
    Guarantee Fund, and of agricultural levies and customs duties, and in respect
    of value added tax
  type: main
- language: fr
  script: Latn
  content: Directive 86/489/CEE de la Commission du 24 septembre 1986 modifiant la
    directive 77/794/CEE, fixant les modalités pratiques nécessaires à l'application
    de certaines dispositions de la directive 76/308/CEE concernant l'assistance mutuelle
    en matière de recouvrement des créances résultant d'opérations faisant partie
    du système de financement du Fonds européen d'orientation et de garantie agricole
    (FEOGA) ainsi que de prélèvements agricoles et de droits de douane et relative
    à la taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Richtlinie 86/489/EWG der Kommission vom 24. September 1986 zur Änderung
    der Richtlinie 77/794/EWG zur Festsetzung der erforderlichen Durchführungsbestimmungen
    zu bestimmten Artikeln der Richtlinie 76/308/EWG über die gegenseitige Unterstützung
    bei der Beitreibung von Forderungen im Zusammenhang mit Maßnahmen, die Bestandteil
    des Finanzierungssystems des Europäischen Ausrichtungs- und Garantiefonds für
    die Landwirtschaft sind, sowie von Abschöpfungen und Zöllen und bezüglich der
    Mehrwertsteuer
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 86/489/EØF af 24. september 1986 om ændring af
    direktiv 77/794/EØF om fastlæggelse af gennemførelsesbestemmelserne til visse
    artikler i direktiv 76/308/EØF om gensidig bistand ved inddrivelse af fordringer
    i forbindelse med foranstaltninger, der er finansieret af Den europæiske udviklings-
    og garantifond for Landbruget, samt af landbrugsimportafgifter og told, og i forbindelse
    med merværdiafgift
  type: main
- language: el
  script: Grek
  content: Οδηγία 86/489/ΕΟΚ της Επιτροπής της 24ης Σεπτεμβρίου
    1986 για την τροποποίηση της οδηγίας 77/794/ΕΟΚ
    με την οποία καθορίζονται οι πρακτικές λεπτομέρειες
    που είναι απαραίτητες για την εφαρμογή ορισμένων
    διατάξεων της οδηγίας 76/308/ΕΟΚ περί της αμοιβαίας
    συνδρομής για την είσπραξη απαιτήσεων που
    προκύπτουν από ενέργειες οι οποίες αποτελούν
    μέρος του συστήματος χρηματοδότησης του Ευρωπαϊκού
    Γεωργικού Ταμείου Προσανατολισμού και Εγγυήσεων,
    καθώς και από γεωργικές εισφορές και δασμούς,
    και σχετικά με το φόρο προστιθέμενης αξίας
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 86/489/ETY, annettu 24 päivänä syyskuuta 1986,
    keskinäisestä avunannosta Euroopan maatalouden ohjaus- ja tukirahaston (EMOTR)
    rahoitusjärjestelmään kuuluvista toimista aiheutuvien saatavien sekä maatalousmaksujen
    ja tullien perinnässä sekä arvonlisäverosta annetun direktiivin 76/308/ETY
    tiettyjen säännösten soveltamiseksi tarvittavista käytännön yksityiskohtaisista
    säännöistä annetun direktiivin 77/794/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 86/489/CEE della Commissione del 24 settembre 1986 recante modifica
    della direttiva 77/794/CEE, che stabilisce le modalità pratiche per l'applicazione
    di talune disposizioni della direttiva 76/308/CEE relativa all'assistenza reciproca
    in materia di ricupero dei crediti risultanti da operazioni che fanno parte del
    sistema di finanziamento del Fondo europeo agricolo di orientamento e garanzia
    nonché di prelievi agricoli e di dazi doganali, e concernente l'imposta sul valore
    aggiunto
  type: main
- language: nl
  script: Latn
  content: Richtlijn 86/489/EEG van de Commissie van 24 september 1986 houdende wijziging
    van Richtlijn 77/794/EEG tot vaststelling van de praktische maatregelen die nodig
    zijn voor de tenuitvoerlegging van sommige bepalingen van Richtlijn 76/308/EEG
    betreffende de wederzijdse bijstand inzake de invordering van schuldvorderingen
    die voortvloeien uit verrichtingen die deel uitmaken van het financieringsstelsel
    van het Europees Oriëntatie- en Garantiefonds voor de Landbouw, alsmede van landbouwheffingen
    en douanerechten, evenals van schuldvorderingen uit hoofde van de belasting over
    de toegevoegde waarde
  type: main
- language: pt
  script: Latn
  content: Directiva 86/489/CEE da Comissão de 24 de Setembro de 1986 que altera
    a Directiva 77/794/CEE, que fixa as modalidades práticas necessárias à aplicação
    de certas disposições da Directiva 76/308/CEE relativa à assistência mútua
    em matéria de cobrança de créditos resultantes de operações que fazem parte
    do sistema de financiamento do FEOGA, bem como de direitos niveladores agrícolas
    e de direitos aduaneiros, e respeitante ao imposto sobre o valor acrescentado
  type: main
- language: es
  script: Latn
  content: Directiva 86/489/CEE de la Comisión de 24 de septiembre de 1986 que modifica
    la Directiva 77/794/CEE por la que se fijan las modalidades prácticas necesarias
    para la aplicación de determinadas disposiciones de la Directiva 76/308/CEE,
    relativa a la asistencia mutua en materia de cobro de créditos que resulten de
    operaciones que formen parte del sistema de financiación del FEOGA así como
    de las exacciones reguladoras agrícolas y de los derechos de aduana, y relativa
    al impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 86/489/EEG av den 24 september 1986 om ändring
    av direktiv 77/794/EEG om fastställande av närmare föreskrifter för tillämpningen
    av vissa bestämmelser i direktiv 76/308/EEG om ömsesidigt bistånd för indrivning
    av fordringar uppkomna till följd av verksamhet som utgör en del av finansieringssystemet
    för Europeiska utvecklings- och garantifonden för jordbruket och av jordbruksavgifter
    och tullar samt med avseende på mervärdesskatt
