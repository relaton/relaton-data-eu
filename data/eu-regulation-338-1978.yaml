  content: Commission Regulation (EEC) No 338/78 of 17 February 1978 amending Regulations
    (EEC) No 2793/76, (EEC) No 560/77 and (EEC) No 2633/77 on detailed arrangements
    for the disposal on the Italian market of frozen beef made available to the Italian
    intervention agency and altering the prices of such meat
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 338/78 de la Commission, du 17 février 1978, portant
    modification des règlements (CEE) n°s 2793/76, 560/77 et 2633/77 en ce qui concerne
    certaines modalités d' application relatives à l' écoulement sur le marché
    italien des viandes bovines congelées mises à la disposition de l' organisme
    d' intervention italien ainsi que les prix de ces viandes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 338/78 der Kommission vom 17. Februar 1978 zur Änderung
    der Verordnungen (EWG) Nr. 2793/76, (EWG) Nr. 560/77 und (EWG) Nr. 2633/77 hinsichtlich
    verschiedener Durchführungsbestimmungen für den Absatz von der italienischen
    Interventionsstelle zur Verfügung gestelltem gefrorenem Rindfleisch auf dem italienischen
    Markt und hinsichtlich der Preise für dieses Fleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 338/78 af 17. februar 1978 om ændring
    af forordningerne (EØF) nr. 2793/76, (EØF) nr. 560/77 og (EØF) nr. 2633/77
    for så vidt angår visse gennemførelsesbestemmelser vedrørende afsætning på
    det italienske marked af frosset oksekød, der er stillet til rådighed for det
    italienske interventionsorgan, og om priserne på dette kød
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 338/78 della Commissione, del 17 febbraio 1978, che
    modifica i regolamenti (CEE) n. 2793/76, (CEE) n. 560/77 e (CEE) n. 2633/77 per
    quanto riguarda talune modalità d' applicazione relative allo smercio sul mercato
    italiano di carni bovine congelate messe a disposizione dell' organismo d' intervento
    italiano, nonché i prezzi di dette carni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 338/78 van de Commissie van 17 februari 1978 tot
    wijziging van de Verordeningen (EEG) nr. 2793/76, (EEG) nr. 560/77 en (EEG) nr.
    2633/77 ten aanzien van de uitvoeringsbepalingen inzake de afzet op de Italiaanse
    markt van bevroren rundvlees dat ter beschikking van het Italiaanse interventiebureau
    is gesteld en van de prijzen voor dit vlees
