title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1432/96 of 23 July 1996 amending Regulation
    (EC) No 3223/93 on statistical information relating to the payment of export refunds
    on certain agricultural products exported in the form of goods covered by Council
    Regulation (EEC) No 3035/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1432/96 de la Commission du 23 juillet 1996 modifiant
