    aux restitutions payées pour l'exportation de certains produits agricoles sous
    forme de marchandises relevant du règlement (CEE) nº 3035/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1432/96 der Kommission vom 23. Juli 1996 zur Änderung
