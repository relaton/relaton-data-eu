- language: en
  script: Latn
  content: Commission Regulation (EEC) No 255/81 of 30 January 1981 fixing the rates
    of the refunds applicable from I February 1981 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 255/81 de la Commission, du 30 janvier 1981, fixant
    les taux des restitutions applicables, à compter du 1er février 1981, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 255/81 der Kommission vom 30. Januar 1981 zur Festsetzung
    der ab 1. Februar 1981 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 255/81 af 30. januar 1981 om fastsættelse
    af de restitutionsatser, der fra 1. februar 1981 skal anvendes for visse produkter
    fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 255/81 της Επιτροπής
