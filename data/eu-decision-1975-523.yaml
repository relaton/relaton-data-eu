---
id: EUDecision1975523
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 June 1975 authorizing the French Republic not
    to apply Community treatment to clothing and clothing articles in textiles other
    than cotton, falling within heading Nos ex 61.01, ex 61.02 and ex 61.03 of the
    Common Customs Tariff, originating in Hong Kong, and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '75/523/CEE: Décision de la Commission, du 24 juin 1975, autorisant la
    République française à exclure du traitement communautaire les vêtements et
    les articles d''habillement en tissus autres que le coton, des positions Ex 61.01,
    Ex 61.02 et Ex 61.03 du Tarif douanier commun, originaires de Hong-Kong et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Juni 1975, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidungsartikel aus anderen Spinnstoffen als
    aus Baumwolle der Tarifnummern ex 61.01, ex 61.02 und ex 61.03 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 24. juni 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande af tekstilstoffer,
    undtagen bomuld, som henhører under position ex 61.01, ex 61.02 og ex 61.03 i
    den fælles toldtarif, har oprindelse i Hong Kong og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 giugno 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti esterni, le sottovesti
    e gli articoli di abbigliamento di materie tessili delle voci n. ex 61.02 e ex
    61.03 diverse dal cotone della tariffa doganale comune, originari di Hong-Kong
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 juni 1975 waarbij de Franse Republiek
    wordt gemachtigd kleren en kledingartikelen van textiel andere dan van katoen
    van posten ex 61.01, ex 61.02 en ex 61.03 van het gemeenschappelijk douanetarief,
    van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
