title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1099/1999 of 27 May 1999 amending Regulation
    (EEC) No 2282/90 laying down detailed rules for increasing the consumption and
    utilisation of apples and the consumption of citrus fruit
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1099/1999 de la Commission, du 27 mai 1999, modifiant
    le règlement (CEE) n° 2282/90 portant modalités d'application des mesures destinées
    à accroître la consommation et l'utilisation de pommes ainsi que la consommation
    d'agrumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1099/1999 der Kommission vom 27. Mai 1999 zur Änderung
    der Verordnung (EWG) Nr. 2282/90 mit Bestimmungen zur Durchführung von Maßnahmen
    zur Steigerung des Verbrauchs und der Verwendung von Äpfeln sowie des Verbrauchs
    von Zitrusfrüchten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1099/1999 af 27. maj 1999 om ændring
    af forordning (EØF) nr. 2282/90 om gennemførelsesbestemmelser for foranstaltninger
    med henblik på at øge forbruget og anvendelsen af æbler samt forbruget af citrusfrugter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1099/1999 της Επιτροπής,
    της 27ης Μαΐου 1999, για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2282/90 για τις λεπτομέρειες εφαρμογής
    των μέτρων που αποσκοπούν στην αύξηση της κατανάλωσης
    και της χρησιμοποίησης μήλων, καθώς και της
    κατανάλωσης εσπεριδοειδών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1099/1999, annettu 27 päivänä toukokuuta 1999,
    yksityiskohtaisista säännöistä omenien kulutuksen ja käytön sekä sitrushedelmien
    kulutuksen lisäämiseksi tarkoitettujen toimenpiteiden soveltamisesta annetun
    asetuksen (ETY) N:o 2282/90 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1099/1999 della Commissione, del 27 maggio 1999, che
    modifica il regolamento (CEE) n. 2282/90 recante modalità di applicazione delle
    misure intese ad aumentare il consumo e l'uso delle mele nonché il consumo degli
    agrumi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1099/1999 van de Commissie van 27 mei 1999 tot wijziging
    van Verordening (EEG) nr. 2282/90 houdende bepalingen ter uitvoering van de maatregelen
    om de consumptie en het gebruik van appelen en de citrusconsumptie te doen toenemen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1099/1999 da Comissão, de 27 de Maio de 1999, que
    altera o Regulamento (CEE) n° 2282/90 que estabelece as regras de execução
    das medidas destinadas a aumentar o consumo e a utilização de maçãs, bem como
    o consumo de citrinos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1099/1999 de la Comisión, de 27 de mayo de 1999, que
    modifica el Reglamento (CEE) n° 2282/90 por el que se establecen las disposiciones
    de aplicación de las medidas destinadas a aumentar el consumo y la utilización
    de manzanas, así como el consumo de cítricos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1099/1999 av den 27 maj 1999 om ändring
    av förordning (EEG) nr 2282/90 om närmare bestämmelser avsedda att öka konsumtionen
    och användningen av äpplen samt konsumtionen av citrusfrukt
