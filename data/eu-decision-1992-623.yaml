title:
- language: en
  script: Latn
  content: '92/623/ECSC: Commission Decision of 7 December 1992 concerning the conclusion
    on behalf of the European Coal and Steel Community of the Agreement in the form
    of exchanges of letters between the European Coal and Steel Community and the
    European Economic Community, of the one part, and the Republic of Poland, of the
    other part, to extend the duration of the Interim Agreement signed between the
    Parties in Brussels on 16 December 1991'
  type: main
- language: fr
