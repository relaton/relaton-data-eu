title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 465/2008 of 28 May 2008 imposing, pursuant
    to Council Regulation (EEC) No 793/93, testing and information requirements on
    importers and manufacturers of certain substances that may be persistent, bioaccumulating
    and toxic and are listed in the European Inventory of Existing Commercial Chemical
    Substances
  type: main
- language: fr
  script: Latn
