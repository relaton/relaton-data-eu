    des Rates über den Verkehr mit Futterpflanzensaatgut bzw. Getreidesaatgut bzw.
    Saatgut von Öl- und Faserpflanzen auf bestimmte Arten (Nur der griechische Text
    ist verbindlich)'
  type: main
