title:
- language: en
  script: Latn
  content: '86/153/EEC: Commission Decision of 25 March 1986 exempting Greece from
    applying to certain species Council Directives 66/401/EEC, 66/402/EEC and 69/208/EEC
    on the marketing of fodder plant seed, cereal seed and the seed of oil and fibre
    plants respectively (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/153/CEE: Décision de la Commission du 25 mars 1986 dispensant la Grèce
    d''appliquer, à certaines espèces, les directives 66/401/CEE, 66/402/CEE et
    69/208/CEE du Conseil, concernant la commercialisation des semences, respectivement
    de plantes fourragères, de céréales et de plantes oléagineuses et à fibres
    (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
