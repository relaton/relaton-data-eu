title:
- language: fr
  script: Latn
  content: Décision 65/321/CEE de la Commission, du 18 juin 1965, portant prorogation
    de ses décisions prises en application de la décision du Conseil du 4 avril
    1962 autorisant certains États membres à percevoir des taxes compensatoires
    sur les importations de certaines marchandises résultant de la transformation
    de produits agricoles, en provenance d'autres États membres
  type: main
- language: de
  script: Latn
  content: '65/321/EWG: Entscheidung der Kommission vom 18. Juni 1965 zur Verlängerung
    ihrer Entscheidungen, die in Anwendung des Beschlusses des Rates vom 4. April
    1962, durch den einzelne Mitgliedstaaten zur Erhebung von Ausgleichsabgaben bei
    der Einfuhr von bestimmten landwirtschaftlichen Verarbeitungserzeugnissen aus
    anderen Mitgliedstaaten ermächtigt werden, getroffen wurden'
  type: main
- language: it
  script: Latn
  content: '65/321/CEE: Decisione della Commissione, del 18 giugno 1965, che proroga
    le decisioni prese in applicazione della decisione del Consiglio del 4 aprile
    1962, che autorizzano alcuni Stati membri a riscuotere tasse di compensazione
    all''importazione di alcuni prodotti risultanti dalla trasformazione di prodotti
    agricoli, da altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/321/EEG: Beschikking van de Commissie van 18 juni 1965 houdende verlenging
    van haar beschikkingen ter toepassing van het besluit van de Raad van 4 april
    1962 waarbij aan enkele Lid-Staten machtiging werd verleend tot het leggen van
    compenserende heffingen, op de invoer van bepaalde uit de verwerking van landbouwstoffen
    verkregen produkten uit andere Lid-Staten'
  type: main
