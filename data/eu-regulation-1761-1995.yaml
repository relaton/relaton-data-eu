title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1761/95 of 29 June 1995 amending, for the second
    time, Regulation (EC) No 3366/94 laying down for 1995 certain conservation and
    management measures for fishery resources in the Regulatory Area as defined in
    the Convention on Future Multilateral Cooperation in the North-west Atlantic Fisheries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1761/95 du Conseil, du 29 juin 1995, modifiant pour
    la seconde fois le règlement (CE) n° 3366/94 fixant, pour 1995, certaines mesures
    de conservation et de gestion des ressources halieutiques dans la zone de réglementation
    définie dans la convention sur la future coopération dans les pêches de l'Atlantique
    du Nord-Ouest
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1761/95 des Rates vom 29. Juni 1995 zur zweiten Änderung
    der Verordnung (EG) Nr. 3366/94 über Maßnahmen zur Erhaltung und Bewirtschaftung
    der Fischbestände im Regelungsbereich des Übereinkommens über die künftige
    multilaterale Zusammenarbeit auf dem Gebiet der Fischerei im Nordwestatlantik
    (1995)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1761/95 af 29. juni 1995 om anden ændring
    af forordning (EF) nr. 3366/94 om fastsættelse for 1995 af foranstaltninger til
    bevarelse og forvaltning af fiskeressourcerne i det regulerede område, der er
    defineret i konventionen om det fremtidige multilaterale samarbejde vedrørende
    fiskeriet i det nordvestlige Atlanterhav
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1761/95 του Συμβουλίου
    της 29ης Ιουνίου 1995 που τροποποιεί, για δεύτερη
    φορά, τον κανονισμό (ΕΚ) αριθ. 3366/94 για τον καθορισμό
    για το 1995 ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων της ζώνης διακανονισμού,
    όπως ορίζεται στη σύμβαση για τη μελλοντική
    πολυμερή συνεργασία στην αλιεία του Βορειοδυτικού
    Ατλαντικού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1761/95, annettu 29 päivänä kesäkuuta 1995,
    Luoteis-Atlantilla harjoitettavaan kalastukseen liittyvää tulevaa monenkeskistä
    yhteistyötä koskevassa yleissopimuksessa määritetyn sääntelyalueen kalavarojen
    tietyistä vuonna 1995 sovellettavista säilyttämis- ja hoitotoimenpiteistä
    annetun neuvoston asetuksen (EY) N:o 3366/94 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1761/95 del Consiglio, del 29 giugno 1995, che modifica,
    per la seconda volta, il regolamento (CE) n. 3366/94 che stabilisce, per il 1995,
    alcune misure di conservazione e di gestione delle risorse alieutiche della zona
    di regolamentazione definita dalla Convenzione sulla futura cooperazione multilaterale
    per la pesca nell'Atlantico nordoccidentale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1761/95 van de Raad van 29 juni 1995 houdende tweede
    wijziging van Verordening (EG) nr. 3366/94 tot vaststelling, voor 1995, van bepaalde
    maatregelen voor de instandhouding en het beheer van de visbestanden in het gereglementeerde
    gebied zoals omschreven in het Verdrag inzake toekomstige multilaterale samenwerking
    op visserijgebied in het noordwestelijk deel van de Atlantische Oceaan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1761/95 do Conselho, de 29 de Junho de 1995, que altera
    pela segunda vez o Regulamento (CE) nº 3366/94 que estabelece, para 1995, determinadas
    medidas de conservação e de gestão dos recursos haliêuticos da área de regulamentação
    definida na Convenção sobre a futura cooperação multilateral nas Pescarias
    do Noroeste do Atlântico
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1761/95 del Consejo, de 29 de junio de 1995, que modifica
    el Reglamento (CE) nº 3366/94 por el que se establecen para 1995 determinadas
    medidas de conservación y de gestión de los recursos pesqueros de la zona de
    regulación definida por el Convenio sobre la futura cooperación multilateral
    en los caladeros del Atlántico noroccidental
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1761/95 av den 29 juni 1995 om en andra ändring
    av förordning (EG) nr 3366/94 om vissa åtgärder för år 1995 som syftar till
    bevarande och förvaltning av fiskeresurserna i det regleringsområde som anges
    i konventionen om framtida multilateralt samarbete om fisket i Nordatlantens västra
