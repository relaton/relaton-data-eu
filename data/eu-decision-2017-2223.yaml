  script: Latn
  content: Commission Implementing Decision (EU, Euratom) 2017/2223 of 30 November
    2017 amending Decision 90/177/Euratom, EEC authorising Belgium not to take into
    account certain categories of transactions and to use certain approximate estimates
    for the calculation of the VAT own resources base (notified under document C(2017)
    7860)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE, Euratom) 2017/2223 de la Commission du 30 novembre
    2017 modifiant la décision 90/177/Euratom, CEE autorisant la Belgique à ne pas
    tenir compte de certaines catégories d'opérations et à utiliser certaines estimations
    approximatives pour le calcul de la base des ressources propres provenant de la
    taxe sur la valeur ajoutée [notifiée sous le numéro C(2017) 7860]
  type: main
