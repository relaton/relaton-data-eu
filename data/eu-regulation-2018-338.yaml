    Aspergillus niger (DSM 25770) como aditivo en los piensos para pollos de engorde,
    pollitas criadas para puesta, cerdos de engorde, cerdas, especies porcinas menores
    destinadas a engorde o reproducción, pavos de engorde, pavos criados para reproducción,
    todas las demás especies aviares (excepto las aves de puesta) y lechones destetados
    (titular de la autorización: BASF SE)'
  type: main
