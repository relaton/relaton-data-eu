    za pripravek iz 6-fitaze, ki jo proizvaja Aspergillus niger (DSM 25770), kot krmni
    dodatek za pitovne piščance, piščance za nesenje jajc, prašiče za pitanje,
    svinje, manj pomembne vrste prašičev za pitanje ali za reprodukcijo, purane
