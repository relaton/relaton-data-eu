---
id: EURegulation2018338
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/338 of 7 March 2018 concerning
    the authorisation of a preparation of 6-phytase, produced by Aspergillus niger
    (DSM 25770) as feed additive for chickens for fattening, chickens reared for laying,
    pigs for fattening, sows, minor porcine species for fattening or for reproduction,
    turkeys for fattening, turkeys reared for breeding, all other avian species (excluding
    laying birds) and weaned piglets (holder of the authorisation BASF SE)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2018/338 de la Commission du 7 mars 2018
    concernant l''autorisation d''une préparation de 6-phytase produite par Aspergillus
    niger (DSM 25770) en tant qu''additif dans l''alimentation des poulets d''engraissement,
    des poulettes destinées à la ponte, des porcs d''engraissement, des truies,
    des espèces porcines mineures élevées pour l''engraissement ou la reproduction,
    des dindes d''engraissement, des dindons élevés pour la reproduction et de toutes
    les autres espèces aviaires (à l''exception des oiseaux pondeurs), ainsi que
    des porcelets sevrés (titulaire de l''autorisation: BASF SE)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2018/338 der Kommission vom 7. März 2018
    zur Zulassung einer Zubereitung von 6-Phytase aus Aspergillus niger (DSM 25770)
    als Futtermittelzusatzstoff für Masthühner, Junghennen, Mastschweine, Sauen,
    Mastschweinearten und Zuchtschweinearten von geringerer wirtschaftlicher Bedeutung,
    Masttruthühner, Zuchttruthühner, alle anderen Vogelarten (außer Legevögeln)
    und Absetzferkel (Zulassungsinhaber BASF SE)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2018/338 на Комисията
    от 7 март 2018 година за разрешаване на употребата
    на препарат от 6-фитаза, получена от Aspergillus niger
    (DSM 25770), като фуражна добавка за пилета за угояване,
    пилета, отглеждани за кокошки носачки, прасета
    за угояване, свине майки, видове свине с по-малко
    стопанско значение, отглеждани за угояване
    или за разплод, пуйки за угояване, пуйки, отглеждани
    за разплод, всички други видове птици (с изключение
    на птици носачки) и отбити прасенца (притежател
    на разрешението BASF SE)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2018/338 ze dne 7. března 2018 o
    povolení přípravku 6-fytázy z Aspergillus niger (DSM 25770) jako doplňkové
    látky pro výkrm kuřat, odchov kuřat a kuřice, výkrm prasat, prasnice, výkrm
    menšinových druhů prasat nebo menšinové druhy prasat k reprodukci, výkrm
    krůt, odchov krůt, všechny ostatní druhy ptactva (s výjimkou nosnic) a odstavená
    selata (držitel povolení BASF SE)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2018/338 af 7. marts 2018
    om godkendelse af et præparat af 6-fytase produceret af Aspergillus niger (DSM
    25770) som fodertilsætningsstof til slagtekyllinger, hønniker, slagtesvin, søer,
    mindre udbredte svinearter bestemt til slagtning eller til avl, slagtekalkuner,
    kalkuner opdrættet til avl, alle andre fuglearter (undtagen æglæggende fugle)
    og fravænnede smågrise (indehaver af godkendelsen er BASF SE)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2018/338 της Επιτροπής,
    της 7ης Μαρτίου 2018, σχετικά με τη χορήγηση άδειας
    για τη χρήση παρασκευάσματος 6-φυτάσης, που
    παράγεται από Aspergillus niger (DSM 25770), ως πρόσθετης
    ύλης ζωοτροφών για κοτόπουλα προς πάχυνση,
    κοτόπουλα εκτρεφόμενα για ωοπαραγωγή, χοίρους
    προς πάχυνση, χοιρομητέρες, μικρά χοιροειδή
    προς πάχυνση ή αναπαραγωγή, γαλοπούλες προς
    πάχυνση, γαλοπούλες που εκτρέφονται για αναπαραγωγή,
    όλα τα άλλα είδη πτηνών (εκτός από τα πτηνά
    που βρίσκονται σε περίοδο ωοτοκίας) καθώς και
    τα απογαλακτισμένα χοιρίδια (κάτοχος της άδειας:
    BASF SE)'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2018/338, 7. märts 2018, milles käsitletakse
    loa andmist Aspergillus niger'i (DSM 25770) abil toodetud 6-fütaasi preparaadi
    kasutamiseks broilerkanade, noorkanade, nuumsigade, emiste, vähemtähtsate sealiikide
    nuum- või sugusigade, broilerkalkunite, aretuskalkunite, kõigi muude linnuliikide
    (välja arvatud munalinnud) ja võõrutatud põrsaste söödalisandina (loa hoidja
    BASF SE)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2018/338, annettu 7 päivänä
    maaliskuuta 2018, Aspergillus niger (DSM 25770) -organismin tuottaman 6-fytaasivalmisteen
    hyväksymisestä broilerien, kananuorikoiden, lihasikojen, emakoiden, lihotukseen
    tai siitokseen tarkoitettujen toissijaisten sikaeläinten, lihakalkkunoiden, siitoseläimiksi
    kasvatettavien kalkkunoiden, kaikkien muiden lintulajien (munivia lintuja lukuun
    ottamatta) ja vieroitettujen porsaiden rehun lisäaineena (hyväksynnän haltija
    BASF SE)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2018/338 оd 7. ožujka 2018. o odobrenju
    pripravka 6-fitaze proizvedenog od Aspergillus niger (DSM 25770) kao dodatka hrani
    za piliće za tov, kokoši nesilice, svinje za tov, krmače, manje značajne vrste
    svinja za tov ili za rasplod, pure za tov, pure uzgajane za rasplod, ostale ptičje
    vrste (osim ptica nesilica) te odbijenu prasad (nositelj odobrenja BASF SE)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2018/338 végrehajtási rendelete (2018. március 7.)
    egy, az Aspergillus niger (DSM 25770) által termelt 6-fitázt tartalmazó készítmény
    brojlercsirkék, tojójércék, hízósertések, kocák, kevésbé jelentős hízó-
    vagy tenyészsertésfélék, hízópulykák, tenyészpulykák, valamennyi egyéb
    madárfaj (a tojószárnyasok kivételével) és elválasztott malacok takarmány-adalékanyagként
    való engedélyezéséről (az engedély jogosultja: BASF SE)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2018/338 della Commissione, del 7 marzo
    2018, relativo all'autorizzazione di un preparato di 6-fitasi prodotta da Aspergillus
    niger (DSM 25770) come additivo per mangimi destinati a polli da ingrasso, pollastre
    allevate per la produzione di uova, suini da ingrasso, scrofe, specie suine minori
    da ingrasso o da riproduzione, tacchini da ingrasso, tacchini allevati per la
    riproduzione, tutte le altre specie avicole (escluse le specie ovaiole) e suinetti
    svezzati (titolare dell'autorizzazione BASF SE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2018/338 (2018. gada 7. marts) par
    atļauju no Aspergillus niger (DSM 25770) iegūtas 6-fitāzes preparātu lietot
    par barības piedevu gaļas cāļiem, dējējvistām, nobarojamām cūkām, sivēnmātēm,
    mazāk izplatītu sugu nobarojamām vai vaislas cūkām, gaļas tītariem, vaislas
    tītariem, visām citām putnu sugām (izņemot dējējputniem) un atšķirtiem
    sivēniem (atļaujas turētājs – BASF SE)
  type: main
- language: lt
  script: Latn
  content: 2018 m. kovo 7 d. Komisijos įgyvendinimo reglamentas (ES) 2018/338 dėl
    leidimo naudoti 6-fitazės, gautos iš Aspergillus niger (DSM 25770), preparatą
    kaip mėsinių viščiukų, dedeklinių vištaičių, penimųjų kiaulių, paršavedžių,
    retesnių rūšių penimųjų arba reprodukcinių kiaulių, mėsinių kalakutų,
    veislei auginamų kalakutų, visų kitų rūšių paukščių (išskyrus dedekles)
    ir nujunkytų paršelių pašaro priedą (leidimo turėtojas – BASF SE)
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/338 tas-7 ta'
    Marzu 2018 dwar l-awtorizzazzjoni tal-formulazzjoni ta' 6-fitażi, prodotta mill-Aspergillus
    niger (DSM 25770) bħala addittiv fl-għalf għal tiġieġ tas-simna, tiġieġ
    imrobbija għall-bajd, ħnieżer tas-simna, ħnieżer nisa, speċijiet minuri
    ta' porċini oħra tas-simna jew għat-tgħammir, dundjani tas-simna, dundjani
    mrobbija għat-tgħammir, l-ispeċijiet l-oħra kollha ta' għasafar (ħlief għasafar
    li jbidu) u għall-ħnienes miftuma (detentur tal-awtorizzazzjoni BASF SE)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2018/338 van de Commissie van 7 maart 2018
    tot verlening van een vergunning voor een preparaat van 6-fytase, geproduceerd
    door Aspergillus niger (DSM 25770), als toevoegingsmiddel voor diervoeding voor
    mestkippen, opfokleghennen, mestvarkens, zeugen, kleine varkenssoorten gehouden
    voor mestdoeleinden of voor reproductie, mestkalkoenen, opfokkalkoenen, alle andere
    vogelsoorten (met uitzondering van legvogels) en gespeende biggen (vergunninghouder
    BASF SE)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2018/338 z dnia 7 marca 2018 r.
    dotyczące zezwolenia na stosowanie preparatu 6-fitazy wytwarzanej przez Aspergillus
    niger (DSM 25770) jako dodatku paszowego dla kurcząt rzeźnych, kurcząt odchowywanych
    na kury nioski, tuczników, loch, podrzędnych gatunków świń do tuczu lub do
    reprodukcji, indyków rzeźnych, indyków utrzymywanych w celach hodowlanych,
    wszystkich pozostałych gatunków ptaków (z wyjątkiem ptaków nieśnych) i prosiąt
    odsadzonych od maciory (posiadacz zezwolenia BASF SE)
  type: main
