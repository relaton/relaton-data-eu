title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 11 juin 1963, portant nouvelle modification
    de sa décision du 9 octobre 1962, autorisant la perception de taxes compensatoires
    sur les importations, dans la République française, de chocolat, de confiseries
    et préparations comportant du cacao ou du chocolat, sans liqueur alcoolique,
    en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '63/383/EWG: Entscheidung der Kommission vom 11. Juni 1963 zur erneuten
    Änderung ihrer Entscheidung vom 9. Oktober 1962 über die Erhebung von Ausgleichsabgaben
    bei der Einfuhr von Schokolade, Schololadewaren und kakaohaltigen Zuckerwaren,
    nicht alkoholhaltig, sowie von kakaohaltigen oder schokoladehaltigen Zubereitungen,
    aus den anderen Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '63/383/CEE: Decisione della Commissione dell''11 giugno 1963 relativa
    ad una nuova modifica della propria decisione del 9 ottobre 1962 che autorizza
    la riscossione di tasse di compensazione sulle importazioni in Francia di cioccolata,
    di dolciumi e di preparazioni contenenti cacao o cioccolata, senza alcolici, in
    provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/383/EEG: Beschikking van de Commissie van 11 juni 1963 houdende nadere
    wijziging van haar beschikking van 9 oktober 1962, houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Franse Republiek van chocolade
    en van suikerwerk en voedingsmiddelen met cacao of met chocolade zonder likeur,
    uit de andere Lid-Staten'
  type: main
