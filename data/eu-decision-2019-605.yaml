    dependente ale Coroanei Britanice în lista țărilor terțe sau a părților
    acestora autorizate să introducă în Uniune transporturi de anumite produse
    din carne și stomacuri, vezici și intestine tratate destinate consumului uman
    [notificată cu numărul C(2019) 2840]
