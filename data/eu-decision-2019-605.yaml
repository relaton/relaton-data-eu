---
id: EUDecision2019605
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/605 of 11 April 2019 amending
    Annex II to Decision 2007/777/EC as regards the inclusion of the United Kingdom
    of Great Britain and Northern Ireland and certain of its Crown Dependencies in
    the list of third countries or parts thereof authorised for the introduction into
    the Union of consignments of certain meat products and treated stomachs, bladders
    and intestines for human consumption (notified under document C(2019) 2840)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/605 de la Commission du 11 avril 2019
    modifiant l'annexe II de la décision 2007/777/CE en ce qui concerne l'inscription
    du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord et de certaines dépendances
    de la Couronne sur la liste des pays tiers ou parties de pays tiers en provenance
    desquels l'introduction dans l'Union de lots de certains produits à base de viande
    et d'estomacs, vessies et boyaux traités destinés à la consommation humaine
    est autorisée [notifiée sous le numéro C(2019) 2840]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/605 der Kommission vom 11. April 2019
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG im Hinblick auf die
    Aufnahme des Vereinigten Königreichs Großbritannien und Nordirland und mancher
    seiner unmittelbar der englischen Krone unterstehenden Gebiete in die Liste der
    Drittländer bzw. Teile von Drittländern, aus denen die Einfuhr von Sendungen
    mit bestimmten Fleischerzeugnissen und mit behandelten Mägen, Blasen und Därmen
    für den menschlichen Verzehr in die Union zugelassen ist (Bekannt gegeben unter
    Aktenzeichen C(2019) 2840)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/605 на Комисията
    от 11 април 2019 година за изменение на приложение
    II към Решение 2007/777/ЕО по отношение на включването
    на Обединеното кралство Великобритания и Северна
    Ирландия и на някои от териториите, зависими
    от Британската корона, в списъка на третите
    държави или частите от тях, от които е разрешено
    въвеждането в Съюза на пратки с определени
    месни продукти и обработени стомаси, пикочни
    мехури и черва за консумация от човека (нотифицирано
    под номер C(2019) 2840)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/605 ze dne 11. dubna 2019, kterým
    se mění příloha II rozhodnutí 2007/777/ES, pokud jde o zahrnutí Spojeného
    království Velké Británie a Severního Irska a určitých jeho závislých
    území do seznamu třetích zemí nebo jejich částí, ze kterých je povolen
    vstup zásilek některých masných výrobků a opracovaných žaludků, močových
    měchýřů a střev určených k lidské spotřebě na území Unie (oznámeno
    pod číslem C(2019) 2840)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/605 af 11. april 2019
    om ændring af bilag II til beslutning 2007/777/EF for så vidt angår opførelse
    af Det Forenede Kongerige Storbritannien og Nordirland og visse af dets kronbesiddelser
    på listen over tredjelande eller dele deraf, som er godkendt med hensyn til indførsel
