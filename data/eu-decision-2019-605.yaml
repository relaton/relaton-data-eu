    un noteiktu tās atkarīgo teritoriju iekļaušanu to trešo valstu vai to daļu
    sarakstā, no kurām Savienībā atļauts ievest lietošanai pārtikā paredzētu
    noteiktu gaļas produktu un apstrādātu kuņģu, pūšļu un zarnu sūtījumus,
