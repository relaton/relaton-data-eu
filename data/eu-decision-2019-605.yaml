    Priloga II. Odluci 2007/777/EZ u pogledu uvrštenja Ujedinjene Kraljevine Velike
    Britanije i Sjeverne Irske i nekih njezinih krunskih posjeda na popis trećih
    zemalja ili njihovih dijelova iz kojih je odobreno unošenje pošiljaka određenih
