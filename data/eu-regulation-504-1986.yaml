title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 504/86 of 25 February 1986 on transitional
    arrangements for trade between Spain and the other Member States and between Spain
    and third countries in glucose and lactose covered by Regulation (EEC) No 2730/75
    and in ovalbumin and lactalbumin covered by Regulation (EEC) No 2783/75
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 504/86 du Conseil du 25 février 1986 relatif au régime
    applicable pendant la période de transition dans les échanges de l' Espagne
    avec les autres pays de la Communauté et les pays tiers de glucose et lactose
    relevant du règlement (CEE) nº 2730/75 et d' ovalbumine et lactabumine relevant
    du règlement (CEE) nº 2783/75
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 504/86 des Rates vom 25. Februar 1986 über die während
