    Verordnung (EWG) Nr. 2730/75 sowie Eieralbumin und Milchalbumin der Verordnung
    (EWG) Nr. 2783/75 zwischen Spanien und den übrigen Mitgliedstaaten der Gemeinschaft
    und Drittländern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 504/86 af 25. februar 1986 om den ordning,
