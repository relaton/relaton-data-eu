title:
- language: fr
  script: Latn
  content: Décision 66/187/CEE de la Commission, du 2 mars 1966, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations, en République française, de sucreries sans
    cacao ne contenant pas de liqueur alcoolique, en provenance des autres États
    membres
  type: main
- language: de
  script: Latn
  content: '66/187/EWG: Entscheidung der Kommission vom 2. März 1966 zur erneuten
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Zuckerwaren ohne Kakaogehalt, nicht alkoholhaltig, aus verschiedenen
    Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '66/187/CEE: Decisione della Commissione del 2 marzo che modifica ulteriormente
    la decisione del 6 novembre 1964 che autorizza la riscossione di tasse di compensazione
    sulle importazioni, nella Repubblica francese, di prodotti a base di zuccheri
    senza cacao, non contenenti sostanze alcoliche, in provenienza dagli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: '66/187/EEG: Beschikking van de Commissie van 2 maart 1966 tot nieuwe wijziging
    van haar beschikking van 6 november 1964 houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Franse Republiek van suikerwerk zonder
    cacao, geen likeur bevattende, uit de overige Lid-Staten'
  type: main
