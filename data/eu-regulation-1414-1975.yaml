  content: Regulation (EEC) No 1414/75 of the Commission of 30 May 1975 suspending
    the issue of authorizations for imports into the Federal Republic of Germany of
    woven cotton fabrics unbleached and bleached, originating in the Federative Republic
    of Brazil
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1414/75 de la Commission, du 30 mai 1975, instituant
    un régime de suspension d'autorisations d'importations en République d'Allemagne
    pour les tissus de coton écrus et blanchis originaires de la République fédérative
    du Brésil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1414/75 der Kommission vom 30. Mai 1975 zur Regelung
