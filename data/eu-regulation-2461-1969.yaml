  content: Règlement (CEE) n° 2461/69 du Conseil, du 8 décembre 1969, portant augmentation
    du contingent tarifaire communautaire de thons, frais, réfrigérés ou congelés,
    entiers, décapités ou tronçonnés, destinés à l'industrie de la conserve,
    de la position EX 03.01 B I b) du tarif douanier commun (année 1969)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2461/69 des Rates vom 8. Dezember 1969 zur Erhöhung
    des Gemeinschaftszollkontingents für Thunfische, frisch, gekühlt oder gefroren,
    ganz, ohne Kopf oder zerteilt, für die Konservenindustrie, der Tarifnummer ex
    03.01 B I b) des Gemeinsamen Zolltarifs (1969)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2461/69 del Consiglio, dell'8 dicembre 1969, relativo
    all'aumento del contingente tariffario comunitario di tonni freschi, refrigerati
    o congelati, interi, decapitati o in pezzi, destinati all'industria conserviera,
    della voce ex 03.01 B I b) della tariffa doganale comune (anno 1969)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2461/69 van de Raad van 8 december 1969 houdende
    vergroting van het communautaire tariefcontingent voor tonijn, vers, gekoeld of
    bevroren, ook indien ontdaan van kop of in moten gesneden, bestemd voor de conservenindustrie,
    van post ex 03.01 B I b) van het gemeenschappelijk douanetarief (1969)
