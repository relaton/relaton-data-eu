title:
- language: en
  script: Latn
  content: Council Regulation (EU) 2026/1891 of 30 July 2026 amending Regulation (EU)
    2023/1529 concerning restrictive measures in view of Iran’s military support
    to Russia’s war of aggression against Ukraine and to armed groups and entities
    in the Middle East and the Red Sea region as well as Iran’s actions undermining
    freedom of navigation in the Middle East
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2026/1891 du Conseil du 30 juillet 2026 modifiant le règlement
    (UE) 2023/1529 concernant des mesures restrictives en raison du soutien militaire
    de l’Iran à la guerre d’agression menée par la Russie contre l’Ukraine
    et à des groupes armés et des entités au Moyen-Orient et dans la région de
    la mer Rouge, ainsi que des actions imputables à l’Iran qui compromettent la
    liberté de navigation au Moyen-Orient
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2026/1891 des Rates vom 30. Juli 2026 zur Änderung der
    Verordnung (EU) 2023/1529 über restriktive Maßnahmen angesichts der militärischen
    Unterstützung des Angriffskriegs Russlands gegen die Ukraine sowie bewaffneter
    Gruppen und Organisationen im Nahen Osten und in der Region des Roten Meeres durch
    Iran sowie der Handlungen Irans, die die Freiheit der Schifffahrt im Nahen Osten
    untergraben
  type: main
- language: bg
  script: Cyrl
