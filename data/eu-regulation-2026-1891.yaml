    година за изменение на Регламент (ЕС) 2023/1529
    за налагане на ограничителни мерки с оглед
    на военната подкрепа на Иран за агресивната
    война на Русия срещу Украйна и за въоръжени
    групировки и образувания в Близкия изток и
    региона на Червено море и с оглед на действията
    на Иран, подкопаващи свободата на корабоплаването
    в Близкия изток
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EU) 2026/1891 ze dne 30. července 2026, kterým se mění
    nařízení (SZBP) 2023/1529 o omezujících opatřeních vzhledem k vojenské
    podpoře útočné války Ruska proti Ukrajině a ozbrojených skupin a subjektů
    v oblasti Blízkého východu a Rudého moře ze strany Íránu, jakož i v souvislosti
    s činnostmi Íránu narušujícími svobodu plavby na Blízkém východě
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EU) 2026/1891 af 30. juli 2026 om ændring af forordning
    (EU) 2023/1529 om restriktive foranstaltninger på baggrund af Irans militære
    støtte til Ruslands angrebskrig mod Ukraine og til væbnede grupper og enheder
    i Mellemøsten og regionen omkring Det Røde Hav samt Irans handlinger, der undergraver
    den frie sejlads i Mellemøsten
  type: main
- language: el
  script: Grek
