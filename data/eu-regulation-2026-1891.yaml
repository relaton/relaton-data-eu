    ryhmille ja yhteisöille Lähi-idässä ja Punaisenmeren alueella antaman sotilaallisen
    tuen sekä Iranin Lähi-idässä merenkulun vapautta heikentävien toimien johdosta
    määrättävistä rajoittavista toimenpiteistä annetun asetuksen (EU) 2023/1529
    muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2026/1891 ón gComhairle an 30 Iúil 2026 lena leasaítear
    Rialachán (AE) 2023/1529 a bhaineann le bearta sriantacha i bhfianaise thacaíocht
    mhíleata na hIaráine do chogadh foghach na Rúise i gcoinne na hÚcráine agus
    do ghrúpaí armtha agus eintitis sa Mheánoirthear agus i réigiún na Mara Rua
    chomh maith le gníomhaíochtaí na hIaráine lena ndéantar dochar don tsaoirse
    loingseoireachta sa Mheánoirthear
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EU) 2026/1891 od 30. srpnja 2026. o izmjeni Uredbe (EU)
    2023/1529 o mjerama ograničavanja s obzirom na vojnu potporu Irana agresivnom
    ratu Rusije protiv Ukrajine i oružanim skupinama i subjektima na Bliskom istoku
    i području Crvenog mora te djelovanja Irana kojima se narušava sloboda plovidbe
    na Bliskom istoku
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2026/1891 rendelete (2026. július 30.) az Oroszország
    Ukrajna elleni agressziós háborújához, valamint a Közel-Keleten és a Vörös-tenger
    térségében működő fegyveres csoportok és szervezetek számára Irán által
    nyújtott katonai támogatásra, továbbá Iránnak a hajózás szabadságát
    a Közel-Keleten aláásó cselekményeire tekintettel hozott korlátozó intézkedésekről
    szóló (EU) 2023/1529 rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2026/1891 del Consiglio, del 30 luglio 2026, che modifica
    il regolamento (UE) 2023/1529 concernente misure restrittive in considerazione
    del sostegno militare dell’Iran alla guerra di aggressione della Russia nei
    confronti dell’Ucraina e a gruppi e entità armati nella regione del Medio Oriente
    e del Mar Rosso e in considerazione degli atti dell’Iran che compromettono la
    libertà di navigazione in Medio Oriente
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (ES) 2026/1891 (2026. gada 30. jūlijs), ar ko groza Regulu
    (ES) 2023/1529 par ierobežojošiem pasākumiem sakarā ar Irānas militāro atbalstu
    Krievijas agresijas karam pret Ukrainu un bruņotām grupām un vienībām Tuvajos
    Austrumos un Sarkanās jūras reģionā, kā arī Irānas darbībām, ar ko tiek
    grauta kuģošanas brīvība Tuvajos Austrumos
  type: main
- language: lt
  script: Latn
  content: 2026 m. liepos 30 d. Tarybos reglamentas (ES) 2026/1891, kuriuo iš dalies
    keičiamas Reglamentas (ES) 2023/1529 dėl ribojamųjų priemonių atsižvelgiant
    į Irano karinę paramą Rusijos agresijos karui prieš Ukrainą ir ginkluotoms
    grupuotėms ir subjektams Artimuosiuose Rytuose ir Raudonosios jūros regione,
    taip pat į Irano veiksmus, kuriais kenkiama laivybos laisvei Artimuosiuose Rytuose
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (UE) 2026/1891 tat-30 ta’ Lulju 2026 li jemenda
    r-Regolament (UE) 2023/1529 dwar miżuri restrittivi fid-dawl tal-appoġġ militari
    tal-Iran għall-gwerra ta’ aggressjoni tar-Russja kontra l-Ukrajna u lil gruppi
    armati u entitajiet fil-Lvant Nofsani u fir-Reġjun tal-Baħar l-Aħmar kif ukoll
    l-azzjonijiet tal-Iran li jdgħajfu l-libertà tan-navigazzjoni fil-Lvant Nofsani
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2026/1891 van de Raad van 30 juli 2026 tot wijziging van
    Verordening (EU) 2023/1529 betreffende beperkende maatregelen in het licht van
    de militaire steun van Iran aan de Russische aanvalsoorlog tegen Oekraïne en
    aan gewapende groepen en entiteiten in het Midden-Oosten en het Rode Zeegebied,
    en betreffende de acties van Iran die de vrijheid van scheepvaart in het Midden-Oosten
    ondermijnen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (UE) 2026/1891 z dnia 30 lipca 2026 r. zmieniające
    rozporządzenie (UE) 2023/1529 w sprawie środków ograniczających w związku
    ze wsparciem wojskowym Iranu dla rosyjskiej wojny napastniczej przeciwko Ukrainie
    oraz dla ugrupowań zbrojnych i uzbrojonych podmiotów na Bliskim Wschodzie i
    w rejonie Morza Czerwonego, a także w związku działaniami Iranu zagrażającymi
    wolności żeglugi na Bliskim Wschodzie
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2026/1891 do Conselho, de 30 de julho de 2026, que altera
    o Regulamento (UE) 2023/1529, que impõe medidas restritivas tendo em conta o
    apoio militar do Irão à guerra de agressão da Rússia contra a Ucrânia e a
    grupos armados e outras entidades no Médio Oriente e na região do Mar Vermelho,
    bem como as ações do Irão que comprometam a liberdade de navegação no Médio
    Oriente
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2026/1891 al Consiliului din 30 iulie 2026 de modificare
    a Regulamentului (UE) 2023/1529 privind măsuri restrictive având în vedere
    sprijinul militar acordat de Iran pentru războiul de agresiune al Rusiei împotriva
    Ucrainei și pentru grupuri și entități armate din Orientul Mijlociu și din
    regiunea Mării Roșii și având în vedere acțiunile Iranului de subminare
    a libertății de navigație în Orientul Mijlociu
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EÚ) 2026/1891 z 30. júla 2026, ktorým sa mení nariadenie
    (EÚ) 2023/1529 o reštriktívnych opatreniach vzhľadom na iránsku vojenskú
    podporu útočnej vojny Ruska proti Ukrajine a ozbrojených skupín a subjektov
    v regióne Blízkeho východu a Červeného mora, ako aj na konanie Iránu narúšajúce
    slobodu plavby na Blízkom východe
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EU) 2026/1891 z dne 30. julija 2026 o spremembi Uredbe Sveta
    (EU) 2023/1529 z dne 20. julija 2023 o omejevalnih ukrepih zaradi vojaške podpore
    Irana vojni agresiji Rusije proti Ukrajini in oboroženim skupinam ter subjektom
    na Bližnjem vzhodu in območju Rdečega morja ter ukrepov Irana, ki ogrožajo
    svobodo plovbe na Bližnjem vzhodu
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2026/1891 del Consejo, de 30 de julio de 2026, por el que
    se modifica el Reglamento (UE) 2023/1529 relativo a medidas restrictivas habida
    cuenta del apoyo militar de Irán a la guerra de agresión de Rusia contra Ucrania
    y a grupos y entidades armados en la región de Oriente Próximo y el mar Rojo,
    así como de las acciones de Irán que menoscaban la libertad de navegación en
    Oriente Próximo
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EU) 2026/1891 av den 30 juli 2026 om ändring av rådets
    förordning (EU) 2023/1529 om restriktiva åtgärder med anledning av Irans militära
    stöd till Rysslands anfallskrig mot Ukraina och till väpnade grupper och enheter
    i Mellanöstern och Rödahavsregionen samt Irans åtgärder som undergräver friheten
