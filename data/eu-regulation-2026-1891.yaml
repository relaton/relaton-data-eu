  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EL) 2026/1891, 30. juuli 2026, millega muudetakse määrust
    (EL) 2023/1529, mis käsitleb piiravaid meetmeid seoses Iraani sõjalise toetusega
    Venemaa Ukraina-vastasele agressioonisõjale ning relvastatud rühmitustele ja
    üksustele Lähis-Idas ja Punase mere piirkonnas ning Iraani tegevusega, mis kahjustab
