  script: Latn
  content: Commission Regulation (EU) No 185/2014 of 26 February 2014 correcting Bulgarian
    language version of Regulation (EU) No 142/2011 implementing Regulation (EC) No
    1069/2009 of the European Parliament and of the Council laying down health rules
    as regards animal by-products and derived products not intended for human consumption
    and implementing Council Directive 97/78/EC as regards certain samples and items
    exempt from veterinary checks at the border under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 185/2014 de la Commission du 26 février 2014 rectifiant
    la version bulgare du règlement (UE) n ° 142/2011 portant application du règlement
    (CE) n ° 1069/2009 du Parlement européen et du Conseil établissant des règles
    sanitaires applicables aux sous-produits animaux et produits dérivés non destinés
    à la consommation humaine et portant application de la directive 97/78/CE du
    Conseil en ce qui concerne certains échantillons et articles exemptés des contrôles
    vétérinaires effectués aux frontières en vertu de cette directive
  type: main
- language: de
  script: Latn
