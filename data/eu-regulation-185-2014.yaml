    av Europaparlamentets och rådets förordning (EG) nr 1069/2009 om hälsobestämmelser
    för animaliska biprodukter och därav framställda produkter som inte är avsedda
    att användas som livsmedel och om genomförande av rådets direktiv 97/78/EG
    vad gäller vissa prover och produkter som enligt det direktivet är undantagna
    från veterinärkontroller vid gränsen
