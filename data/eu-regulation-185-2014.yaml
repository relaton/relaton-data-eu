    Parlamenta un Padomes Regulu (EK) Nr. 1069/2009, ar ko nosaka veselības aizsardzības
    noteikumus attiecībā uz dzīvnieku izcelsmes blakusproduktiem un atvasinātajiem
    produktiem, kuri nav paredzēti cilvēku patēriņam, un īsteno Padomes Direktīvu
    97/78/EK attiecībā uz dažiem paraugiem un precēm, kam uz robežas neveic veterinārās
    pārbaudes atbilstīgi minētajai direktīvai
  type: main
