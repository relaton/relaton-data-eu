  type: main
- language: hu
  script: Latn
  content: A Bizottság 185/2014/EU rendelete ( 2014. február 26. ) a nem emberi
    fogyasztásra szánt állati melléktermékekre és a belőlük származó termékekre
    vonatkozó egészségügyi szabályok megállapításáról szóló 1069/2009/EK
    európai parlamenti és tanácsi rendelet végrehajtásáról, valamint a 97/78/EK
    tanácsi irányelvnek az egyes minták és tételek határon történő állat-egészségügyi
    ellenőrzése alóli, az irányelv szerinti mentesítése tekintetében történő
    végrehajtásáról szóló 142/2011/EU rendelet bolgár nyelvű változatának
    helyesbítéséről
  type: main
