    se establecen las disposiciones de aplicación del Reglamento (CE) n ° 1069/2009
    del Parlamento Europeo y del Consejo, por el que se establecen las normas sanitarias
    aplicables a los subproductos animales y los productos derivados no destinados
    al consumo humano, y la Directiva 97/78/CE del Consejo en cuanto a determinadas
    muestras y unidades exentas de los controles veterinarios en la frontera en virtud
