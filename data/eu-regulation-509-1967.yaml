title:
- language: fr
  script: Latn
  content: Règlement n 509/67/CEE de la Commission, du 30 août 1967, fixant les
    restitutions applicables pour les céréales et le riz décortiqué exportés
    ver les pays tiers sous la forme de certaines marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 509/67/EWG der Kommission vom 30. August 1967 zur Festsetzung
    der bei der Ausfuhr von Getreide oder von geschältem Reis in Form von nicht unter
    Anhang II des Vertrages fallenden Waren nach dritten Ländern anwendbaren Erstattungen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 509/67/CEE della Commissione, del 30 agosto 1967, che fissa
    le restituzioni applicabili per i cereali e il riso semigreggio esportati verso
    i paesi terzi sotto forma di talune merci non comprese nell'allegato II del Trattato
  type: main
- language: nl
  script: Latn
  content: Verordening no. 509/67/EEG van de Commissie van 30 augustus 1967 houdende
    vaststelling van de restituties die worden verleend bij uitvoer naar derde landen
    van granen en van gedopte rijst in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
  type: main
