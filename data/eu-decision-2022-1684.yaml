---
id: EUDecision20221684
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1684 of 28 September 2022 on
    the equivalence of the regulatory framework for central counterparties in Taiwan
    (This Decision should not be interpreted as reflecting any official position of
    the European Union with regard to the legal status of Taiwan.) to Regulation (EU)
    No 648/2012 of the European Parliament and of the Council as regards Futures Clearing
    Houses under the supervision of the Financial Supervisory Commission
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1684 de la Commission du 28 septembre
    2022 relative à l’équivalence entre le cadre réglementaire applicable aux
    contreparties centrales à Taïwan (La présente décision ne doit pas être interprétée
    comme l’expression d’une position officielle de l’Union européenne en ce
    qui concerne le statut juridique de Taïwan.) et le règlement (UE) no 648/2012
    du Parlement européen et du Conseil en ce qui concerne les chambres de compensation
    de contrats à terme sous la surveillance de la Commission de surveillance financière
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1684 der Kommission vom 28. September
    2022 über die Gleichwertigkeit des Regulierungsrahmens Taiwans (Dieser Beschluss
    sollte nicht so ausgelegt werden, dass er einen offiziellen Standpunkt der Europäischen
    Union im Hinblick auf den rechtlichen Status Taiwans zum Ausdruck bringt.) für
    zentrale Gegenparteien mit der Verordnung (EU) Nr. 648/2012 des Europäischen
    Parlaments und des Rates in Bezug auf von der Finanzaufsichtskommission beaufsichtigte
    Clearingstellen für Terminkontrakte
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1684 на Комисията
    от 28 септември 2022 година относно еквивалентността
    на действащата в Тайван (Настоящото решение
    не следва да се тълкува като отразяващо официалната
    позиция на Европейския съюз по отношение на
    правния статут на Тайван.) нормативна уредба
    на централните контрагенти с Регламент (ЕС)
    № 648/2012 на Европейския парламент и на Съвета
    по отношение на поднадзорните на комисията
    за финансов надзор клирингови къщи, извършващи
    клиринг на фючърси
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1684 ze dne 28. září 2022
    o rovnocennosti regulačního rámce pro ústřední protistrany na Tchaj-wanu
    (Toto rozhodnutí by nemělo být vykládáno tak, že odráží jakýkoliv oficiální
    postoj Evropské unie, pokud jde o právní postavení Tchaj-wanu.) s nařízením
    Evropského parlamentu a Rady (EU) č. 648/2012, pokud jde o clearingové instituce
    pro futures pod dohledem komise pro finanční dohled
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1684 af 28. september
    2022 om ækvivalens mellem de reguleringsmæssige rammer for centrale modparter
    i Taiwan (Denne afgørelse bør ikke fortolkes som udtryk for Den Europæiske
    Unions officielle holdning for så vidt angår Taiwans retlige status.) og Europa-Parlamentets
    og Rådets forordning (EU) nr. 648/2012 for så vidt angår futuresclearingcentraler
    under tilsyn af Financial Supervisory Commission
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1684 της Επιτροπής
    της 28ης Σεπτεμβρίου 2022 σχετικά με την ισοδυναμία
    του κανονιστικού πλαισίου για τους κεντρικούς
    αντισυμβαλλομένους στην Ταϊβάν (Η παρούσα
    απόφαση δεν θα πρέπει να εκληφθεί ως η επίσημη
    θέση της Ευρωπαϊκής Ένωσης σχετικά με το νομικό
    καθεστώς της Ταϊβάν.) με τον κανονισμό (ΕΕ) αριθ.
    648/2012 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    όσον αφορά τα γραφεία εκκαθάρισης συμβολαίων
    μελλοντικής εκπλήρωσης υπό την εποπτεία της
    Επιτροπής Χρηματοπιστωτικής Εποπτείας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1684, 28. september 2022, keskseid vastaspooli
    käsitleva Taiwani (Käesolevat otsust ei tohiks tõlgendada nii, nagu väljendaks
    see Euroopa Liidu ametlikku seisukohta Taiwani õigusliku seisundi suhtes.) õigusraamistiku
    samaväärsuse kohta Euroopa Parlamendi ja nõukogu määrusega (EL) nr 648/2012
    seoses finantsjärelevalve komisjoni järelevalve all olevate futuuride kliiringukodadega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1684, annettu 28 päivänä
    syyskuuta 2022, keskusvastapuoliin Taiwanissa (Tämän päätöksen ei tulisi
    tulkita heijastavan mitään Euroopan unionin virallista kantaa Taiwanin oikeudelliseen
    asemaan.) sovellettavan sääntelykehyksen vastaavuudesta Euroopan parlamentin
    ja neuvoston asetuksen (EU) N:o 648/2012 kanssa Taiwanin rahoitusvalvontaviranomaisen
    valvomien futuurien määritysyhteisöjen osalta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1684 ón gCoimisiún an 28 Meán Fómhair
    2022 maidir leis an gcoibhéis idir an creat rialála le haghaidh contrapháirtithe
    lárnacha sa Téaváin (Níor cheart an Cinneadh seo a léirmhíniú mar léiriú
    ar sheasamh oifigiúil an Aontais Eorpaigh i gcúinsí ar bith maidir le stádas
    dlíthiúil na Téaváine.) agus Rialachán (AE) Uimh. 648/2012 ó Pharlaimint
    na hEorpa agus ón gComhairle a mhéid a bhaineann le Tithe Imréitigh Todhchaíochtaí
    atá faoi mhaoirseacht an Choimisiúin um Maoirseacht Airgeadais
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1684 оd 28. rujna 2022. o istovrijednosti
    regulatornog okvira za središnje druge ugovorne strane u Tajvanu (Ovu Odluku
    ne bi trebalo tumačiti na način da odražava službeno stajalište Europske
    unije o pravnom statusu Tajvana.) u skladu s Uredbom (EU) br. 648/2012 Europskog
    parlamenta i Vijeća u pogledu klirinških kuća za budućnosnice koje su pod
    nadzorom Komisije za financijski nadzor
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1684 végrehajtási határozata (2022. szeptember
    28.) a Pénzügyi Felügyeleti Bizottság felügyelete alá tartozó, határidős
    ügyletekkel foglalkozó elszámolóházak tekintetében a Tajvanon működő
    központi szerződő felekre vonatkozó szabályozási keretnek a 648/2012/EU
    európai parlamenti és tanácsi rendelettel való egyenértékűségéről (Ez
    a határozat nem értelmezhető úgy, mint amely az Európai Unió hivatalos álláspontját
    tükrözi Tajvan jogállása tekintetében.)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1684 della Commissione del 28 settembre
    2022 che stabilisce l’equivalenza del quadro normativo di Taiwan (La presente
    decisione non riflette la posizione ufficiale dell’Unione europea sullo status
    giuridico di Taiwan e non va interpretata in questo senso.) in materia di controparti
    centrali al regolamento (UE) n. 648/2012 del Parlamento europeo e del Consiglio
    per quanto riguarda le stanze di compensazione di futures soggette alla vigilanza
    della Financial Supervisory Commission
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1684 (2022. gada 28. septembris)
    par Taivānas (Šo lēmumu nevajadzētu interpretēt kā tādu, kas atspoguļo
    Eiropas Savienības oficiālo nostāju attiecībā uz Taivānas juridisko statusu.)
    tiesiskā regulējuma, ko piemēro centrālajiem darījumu partneriem, līdzvērtību
    Eiropas Parlamenta un Padomes Regulai (ES) Nr. 648/2012 attiecībā uz regulētā
    tirgū tirgotu nākotnes līgumu tīrvērtes iestādēm, kas atrodas Finanšu
    uzraudzības komisijas uzraudzībā
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1684 2022 m. rugsėjo 28 d.
    dėl pagrindinėms sandorio šalims – Finansų priežiūros komisijos prižiūrimiems
    ateities sandorių tarpuskaitos namams – Taivane (Šis sprendimas neturėtų
    būti aiškinamas kaip atspindintis oficialią Europos Sąjungos poziciją dėl
    Taivano teisinio statuso.) taikomos reguliavimo sistemos lygiavertiškumo Europos
    Parlamento ir Tarybos reglamentui (ES) Nr. 648/2012
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1684 tat-28
    ta’ Settembru 2022 dwar l-ekwivalenza tal-qafas regolatorju għall-kontropartijiet
    ċentrali fit-Tajwan (Jenħtieġ li din id-Deċiżjoni ma tiġix interpretata
    bħala li tirrifletti kwalunkwe pożizzjoni uffiċjali tal-Unjoni Ewropea fir-rigward
    tal-istatus legali tat-Tajwan.) għar-Regolament (UE) Nru 648/2012 tal-Parlament
    Ewropew u tal-Kunsill fir-rigward tal-Kmamar tal-Ikklirjar tal-Futures taħt is-superviżjoni
    tal-Kummissjoni Superviżorja Finanzjarja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1684 van de Commissie van 28 september 2022
    betreffende de gelijkwaardigheid van het regelgevingskader voor centrale tegenpartijen
    in Taiwan (Dit besluit mag niet worden geïnterpreteerd als een weergave van enig
    officieel standpunt van de Europese Unie met betrekking tot de juridische status
    van Taiwan.) aan Verordening (EU) nr. 648/2012 van het Europees Parlement en de
    Raad wat betreft futuresclearinghuizen die onder toezicht staan van de Financial
    Supervisory Commission
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1684 z dnia 28 września 2022 r. w
    sprawie równoważności ram regulacyjnych Tajwanu (Niniejszej decyzji nie należy
    interpretować jako odzwierciedlającej jakiekolwiek oficjalne stanowisko Unii
    Europejskiej w odniesieniu do statusu prawnego Tajwanu.) dotyczących kontrahentów
    centralnych z rozporządzeniem Parlamentu Europejskiego i Rady (UE) nr 648/2012
    w odniesieniu do izb rozliczeniowych kontraktów terminowych typu futures objętych
    nadzorem komisji nadzoru finansowego
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1684 da Comissão de 28 de setembro de
    2022 sobre a equivalência do quadro regulamentar aplicável às contrapartes
    centrais em Taiwan (A presente decisão não deve ser interpretada como traduzindo
    qualquer posição oficial da União Europeia no que respeita ao estatuto jurídico
    de Taiwan.) com os requisitos estabelecidos no Regulamento (UE) n.o 648/2012 do
    Parlamento Europeu e do Conselho no que diz respeito às câmaras de compensação
    de futuros sujeitas à supervisão da Comissão de Supervisão Financeira
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1684 a Comisiei din 28 septembrie
    2022 privind echivalența cadrului de reglementare aplicabil contrapărților
    centrale din Taiwan (Prezenta decizie nu ar trebui să fie interpretată ca reflectând
    poziția oficială a Uniunii Europene cu privire la statutul juridic al Taiwanului.)
    cu Regulamentul (UE) nr. 648/2012 al Parlamentului European și al Consiliului
    în ceea ce privește casele de compensare pentru contracte futures aflate sub
    supravegherea Comisiei de Supraveghere Financiară
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1684 z 28. septembra 2022 o
    rovnocennosti regulačného rámca pre centrálne protistrany na Taiwane (Toto
    rozhodnutie sa nemá interpretovať ako vyjadrenie oficiálnej pozície Európskej
    únie vzhľadom na právny štatút Taiwanu.) s požiadavkami nariadenia Európskeho
    parlamentu a Rady (EÚ) č. 648/2012, pokiaľ ide o zúčtovacie ústavy pre futures,
    ktoré podliehajú dohľadu Komisie pre finančný dohľad
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1684 z dne 28. septembra 2022 o enakovrednosti
    regulativnega okvira Tajvana (Ta sklep se ne sme razlagati kot izražanje kakršnega
    koli uradnega stališča Evropske unije glede pravnega statusa Tajvana.) za centralne
    nasprotne stranke z Uredbo (EU) št. 648/2012 Evropskega parlamenta in Sveta v
    zvezi s terminskimi klirinškimi družbami pod nadzorom Komisije za finančni
    nadzor
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1684 de la Comisión de 28 de septiembre
    de 2022 sobre la equivalencia del marco regulador de las entidades de contrapartida
    central de Taiwán (La presente Decisión no refleja la posición oficial de la
    Unión Europea en relación con la situación jurídica de Taiwán.) con el Reglamento
    (UE) n.o 648/2012 del Parlamento Europeo y del Consejo en lo que respecta a las
    cámaras de compensación de futuros bajo la supervisión de la Comisión de Supervisión
    Financiera
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1684 av den 28 september 2022
    om likvärdighet mellan regelverket för centrala motparter i Taiwan (Detta beslut
    ska inte betraktas som Europeiska unionens officiella ståndpunkt när det gäller
    Taiwans rättsliga status.) och kraven i Europaparlamentets och rådets förordning
    (EU) nr 648/2012 vad gäller terminsclearing houses som står under Financial
    Supervisory Commissions tillsyn
  type: main
