  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/1997 van de Commissie van 7 november 2017
    tot wijziging van de Uitvoeringsverordeningen (EU) 2016/184 en (EU) 2016/185 tot
    uitbreiding van het definitieve compenserende recht en het definitieve antidumpingrecht
    op fotovoltaïsche modules van kristallijn silicium en de belangrijkste componenten
    daarvan (cellen), van oorsprong uit of verzonden uit de Volksrepubliek China,
    tot fotovoltaïsche modules van kristallijn silicium en de belangrijkste componenten
    daarvan (cellen) verzonden uit Maleisië en Taiwan, al dan niet aangegeven als
    van oorsprong uit Maleisië en Taiwan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2017/1997 z dnia 7 listopada 2017
    r. zmieniające rozporządzenia wykonawcze (UE) 2016/184 i (UE) 2016/185 rozszerzające
    ostateczne cło wyrównawcze i antydumpingowe nałożone na przywóz modułów
