  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2017/1997, 7. november 2017, millega muudetakse
    rakendusmäärusi (EL) 2016/184 ja (EL) 2016/185, millega laiendatakse Hiina Rahvavabariigist
    pärit või sealt lähetatud, kristalsest ränist fotoelektriliste moodulite ja
    nende põhikomponentide (elementide) impordi suhtes kehtestatud lõplikku tasakaalustavat
    tollimaksu ja dumpinguvastast tollimaksu Malaisiast ja Taiwanist lähetatud, kristalsest
    ränist fotoelektriliste moodulite ja nende põhikomponentide (elementide) impordile,
    olenemata sellest, kas need on deklareeritud Malaisiast või Taiwanist pärinevana
    või mitte
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2017/1997, annettu 7 päivänä
    marraskuuta 2017, Kiinan kansantasavallasta peräisin olevien tai sieltä lähetettyjen
    kiteisestä piistä valmistettujen aurinkosähkömoduulien ja niiden keskeisten
    komponenttien (kennot) tuonnissa käyttöön otetun lopullisen tasoitustullin
