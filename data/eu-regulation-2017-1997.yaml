    fotowoltaicznych z krzemu krystalicznego i głównych komponentów (tj. ogniw)
    wysyłanych z Malezji i Tajwanu, zgłoszonych lub niezgłoszonych jako pochodzące
    z Malezji i Tajwanu
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2017/1997 da Comissão, de 7 de novembro
    de 2017, que altera os Regulamentos de Execução (UE) 2016/184 e (UE) 2016/185
    que tornam extensivos os direitos de compensação e anti-dumping definitivos
    sobre as importações de módulos fotovoltaicos de silício cristalino e de componentes-chave
    (ou seja, células) originários ou expedidos da República Popular da China às
    importações de módulos fotovoltaicos de silício cristalino e de componentes-chave
    (ou seja, células) expedidos da Malásia e de Taiwan, independentemente de serem
    ou não declarados originários da Malásia e de Taiwan
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/1997 al Comisiei din 7 noiembrie
    2017 de modificare a Regulamentelor de punere în aplicare (UE) 2016/184 și (UE)
    2016/185 de extindere a aplicării taxei compensatorii definitive și a taxei
    antidumping definitive la importurile de module fotovoltaice pe bază de siliciu
    cristalin și componentele lor cheie (și anume celule) originare sau expediate
    din Republica Populară Chineză la importurile de module fotovoltaice pe bază
    de siliciu cristalin și componentele lor cheie (și anume celule) expediate din
    Malaysia și din Taiwan, indiferent dacă au fost sau nu declarate ca fiind originare
    din Malaysia sau din Taiwan
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/1997 zo 7. novembra 2017, ktorým
    sa menia vykonávacie nariadenia (EÚ) 2016/184 a (EÚ) 2016/185, ktorými sa
    rozširuje konečné vyrovnávacie a antidumpingové clo na dovoz fotovoltických
    modulov na báze kryštalického kremíka a hlavných komponentov (t. j. článkov)
    s pôvodom v Čínskej ľudovej republike alebo odosielaných z Čínskej ľudovej
    republiky na dovoz fotovoltických modulov na báze kryštalického kremíka a
    hlavných komponentov (t. j. článkov) odosielaných z Malajzie a Taiwanu bez
    ohľadu na to, či majú alebo nemajú deklarovaný pôvod v Malajzii a na Taiwane
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/1997 z dne 7. novembra 2017 o spremembi
    izvedbenih uredb (EU) 2016/184 in (EU) 2016/185 o razširitvi dokončne izravnalne
    in protidampinške dajatve na uvoz fotonapetostnih modulov iz kristalnega silicija
    in njihovih ključnih sestavnih delov (tj. celic) s poreklom iz Ljudske republike
    Kitajske na uvoz fotonapetostnih modulov iz kristalnega silicija in njihovih ključnih
    sestavnih delov (tj. celic), poslanih iz Malezije ali s Tajvana, ne glede na to,
    ali so deklarirani kot izdelki s poreklom iz Malezije in Tajvana ali ne
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2017/1997 de la Comisión, de 7 de noviembre
    de 2017, que modifica los Reglamentos de Ejecución (UE) 2016/184 y (UE) 2016/185
    por los que se amplía el derecho compensatorio y antidumping definitivo establecido
    a las importaciones de módulos fotovoltaicos de silicio cristalino y componentes
    clave (a saber, células) originarios o procedentes de la República Popular China,
    a las importaciones de módulos fotovoltaicos de silicio cristalino y componentes
    clave (a saber, células) procedentes de Malasia y de Taiwán, tanto si se declaran
    originarios de Malasia o de Taiwán como si no
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/1997 av den 7 november
    2017 om ändring av genomförandeförordning (EU) 2016/184 och (EU) 2016/185 om
