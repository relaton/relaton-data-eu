id: EURegulation20171997
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1997 of 7 November 2017 amending
    Implementing Regulations (EU) 2016/184 and (EU) 2016/185 extending the definitive
    countervailing and anti-dumping duty on imports of crystalline silicon photovoltaic
    modules and key components (i.e. cells) originating in or consigned from the People's
    Republic of China to imports of crystalline silicon photovoltaic modules and key
    components (i.e. cells) consigned from Malaysia and Taiwan, whether declared as
    originating in Malaysia and in Taiwan or not
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/1997 de la Commission du 7 novembre 2017
    modifiant les règlements d'exécution de la Commission (UE) 2016/184 et (UE)
    2016/185 portant extension du droit compensateur définitif et du droit antidumping
    définitif institués sur les importations de modules photovoltaïques en silicium
    cristallin et leurs composants essentiels (cellules) originaires ou en provenance
    de la République populaire de Chine aux importations de modules photovoltaïques
    en silicium cristallin et leurs composants essentiels (cellules) expédiés de
    Malaisie et de Taïwan, qu'ils aient ou non été déclarés originaires de ces
    pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/1997 der Kommission vom 7. November
    2017 zur Änderung der Durchführungsverordnungen (EU) 2016/184 bzw. (EU) 2016/185
    zur Ausweitung des endgültigen Ausgleichs- und Antidumpingzolls auf Einfuhren
    von Fotovoltaikmodulen aus kristallinem Silicium und Schlüsselkomponenten davon
    (Zellen) mit Ursprung in oder versandt aus der Volksrepublik China auf aus Malaysia
    und Taiwan versandte Einfuhren von Fotovoltaikmodulen aus kristallinem Silicium
    und Schlüsselkomponenten davon (Zellen), ob als Ursprungserzeugnisse Malaysias
    oder Taiwans angemeldet oder nicht
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/1997 на Комисията
    от 7 ноември 2017 година за изменение на регламенти
    за изпълнение (ЕС) 2016/184 и (ЕС) 2016/185 за разширяване
    на обхвата на окончателното изравнително и
    окончателното антидъмпингово мито върху вноса
    на кристални силициеви фотоволтаични модули
    и ключови компоненти (т.е. елементи) с произход
    или изпратени от Китайската народна република,
    за да включва вноса на кристални силициеви
    фотоволтаични модули и ключови компоненти
    (т.е. елементи), изпращани от Малайзия и Тайван,
    независимо дали са с деклариран произход от
    Малайзия и Тайван
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/1997 ze dne 7. listopadu 2017,
    kterým se mění prováděcí nařízení (EU) 2016/184 a (EU) 2016/185, kterými
    se konečné vyrovnávací a antidumpingové clo uložené na dovoz krystalických
    křemíkových fotovoltaických modulů a jejich klíčových komponentů (tj.
    článků) pocházejících nebo odesílaných z Čínské lidové republiky rozšiřuje
    na dovoz krystalických křemíkových fotovoltaických modulů a jejich klíčových
    komponentů (tj. článků) odesílaných z Malajsie a Tchaj-wanu, bez ohledu
    na to, zda je u nich deklarován původ z Malajsie a Tchaj-wanu, či nikoli
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/1997 af 7. november 2017
    om ændring af gennemførelsesforordning (EU) 2016/184 og (EU) 2016/185 om udvidelse
