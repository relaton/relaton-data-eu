    ja (EU) 2016/185 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/1997 оd 7. studenoga 2017. o izmjeni
    provedbenih uredbi (EU) 2016/184 i (EU) 2016/185 o proširenju konačne kompenzacijske
    i antidampinške pristojbe na uvoz kristalnih silicijskih fotonaponskih modula
    i ključnih elemenata (tj. ćelija) podrijetlom ili poslanih iz Narodne Republike
    Kine na uvoz kristalnih silicijskih fotonaponskih modula i ključnih elemenata
    (tj. ćelija) poslanih iz Malezije i Tajvana, neovisno o tome jesu li deklarirani
    kao proizvod podrijetlom iz Malezije i Tajvana
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1997 végrehajtási rendelete (2017. november 7.)
    a Kínai Népköztársaságból származó vagy ott feladott kristályos szilícium
    fotovillamos modulok és alapvető részeik (azaz elemek) behozatalára vonatkozó
    végleges kiegyenlítő és dömpingellenes vámnak a Malajziában és Tajvanon
    feladott – függetlenül attól, hogy az árut Malajziából és Tajvanról
    származóként jelentették-e be vagy sem – kristályos szilícium fotovillamos
    modulok és alapvető részeik (azaz elemek) behozatalára történő kiterjesztéséről
    szóló (EU) 2016/184 és (EU) 2016/185 végrehajtási rendeletek módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1997 della Commissione, del 7 novembre
    2017, che modifica i regolamenti di esecuzione (UE) 2016/184 e (UE) 2016/185,
    che estendono il dazio compensativo e il dazio antidumping definitivi istituiti
    sulle importazioni di moduli fotovoltaici in silicio cristallino e delle loro
    componenti essenziali (celle) originari o provenienti dalla Repubblica popolare
    cinese alle importazioni di moduli fotovoltaici in silicio cristallino e delle
    loro componenti essenziali (celle) provenienti dalla Malaysia e da Taiwan indipendentemente
    dal fatto che siano dichiarati o no originari della Malaysia e di Taiwan
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/1997 (2017. gada 7. novembris),
    ar ko groza Īstenošanas regulas (ES) 2016/184 un (ES) 2016/185, ar kurām galīgo
    kompensācijas un antidempinga maksājumu, kas noteikts tādu kristāliskā silīcija
    fotoelektrisko moduļu un to galveno sastāvdaļu (proti, elementu) importam,
    kuru izcelsme ir Ķīnas Tautas Republikā vai kuri nosūtīti no Ķīnas Tautas
    Republikas, attiecina arī uz to kristāliskā silīcija fotoelektrisko moduļu
    un to galveno sastāvdaļu (proti, elementu) importu, kuri nosūtīti no Malaizijas
    un Taivānas, neatkarīgi no tā, vai tiem deklarēta Malaizijas un Taivānas
    izcelsme
  type: main
- language: lt
  script: Latn
  content: 2017 m. lapkričio 7 d. Komisijos įgyvendinimo reglamentas (ES) 2017/1997,
    kuriuo iš dalies keičiami įgyvendinimo reglamentai (ES) 2016/184 ir (ES) 2016/185,
    kuriais galutinio kompensacinio ir antidempingo muito, nustatyto Kinijos Liaudies
    Respublikos kilmės arba iš Kinijos Liaudies Respublikos siunčiamiems importuojamiems
    fotovoltiniams moduliams iš kristalinio silicio ir jų pagrindinėms sudėtinėms
