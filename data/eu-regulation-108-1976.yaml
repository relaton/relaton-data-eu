  content: Council Regulation (EEC) No 108/76 of 19 January 1976 laying down general
    rules for determining, in the fishery sector, the landing areas situated at a
    considerable distance from the main centres of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 108/76 du Conseil, du 19 janvier 1976, établissant
