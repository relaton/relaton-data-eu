type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1205/77 of 6 June 1977 repealing Commission
    Regulation (EEC) No 1028/77 of 16 May 1977 re-establishing the levying of customs
    duties on illuminating glassware, signalling glassware and optical elements of
    glass, other, falling within subheading 70.14 B, originating in South Korea to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1205/77 de la Commission, du 6 juin 1977, abrogeant
    le règlement (CEE) n° 1028/77 de la Commission, du 16 mai 1977, portant rétablissement
    de la perception des droits de douane applicables à la verrerie d'éclairage,
    de signalisation et d'optique commune, autres, de la sous-position tarifaire 70.14
    B, originaires de la Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1205/77 der Kommission vom 6. Juni 1977 zur Aufhebung
    der Verordnung (EWG) Nr. 1028/77 der Kommission vom 16. Mai 1977 zur Wiedereinführung
    des Zollsatzes für andere Glaswaren für Beleuchtung usw. als zum Ausstatten
    von elektrischen Beleuchtungskörpern, der Tarifstelle 70.14 B, mit Ursprung in
    Südkorea, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1205/77 af 6. juni 1977 om ophævelse
    af Kommissionens forordning (EØF) nr. 1028/77 af 16. maj 1977 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas; optiske artikler
    af glas, hverken optisk bearbejdet eller af optisk glas; i andre tilfælde, under
    underposition 70.14 B, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1205/77 della Commissione, del 6 giugno 1977, che
    abroga il regolamento (CEE) n. 1028/77 della Commissione, del 16 maggio 1977,
    che ripristina la riscossione dei dazi doganali applicabili alle vetrerie per
    illuminazione, per segnalazione e per ottica comune, altri, della sottovoce doganale
    70.14 B, originarie della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1205/77 van de Commissie van 6 juni 1977 waarbij
    de Verordening (EEG) nr. 1028/77 van de Commissie van 16 mei 1977 houdende wederinstelling
    van de heffing van de douanerechten van toepassing op verlichtingsartikelen, signaal-
    en waarschuwingsartikelen, van glas; optische elementen van gewoon glas, niet
    optisch bewerkt, andere, van post 70.14 B, van oorsprong uit Zuid-Korea, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend, wordt ingetrokken
  type: main
