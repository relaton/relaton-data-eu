schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2086/80 of 4 August 1980 re-establishing
    the levying of customs duties on knitted or crocheted fabric, not elastic or rubberized,
    products of category 63 (code 0630), originating in the Philippines, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2894/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2086/80 de la Commission, du 4 août 1980, portant
    rétablissement de la perception des droits de douane applicables aux étoffes
    de bonneterie non élastique ni caoutchoutée, en pièces, de la catégorie n°
    63 (code 0630), originaires des Philippines, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2086/80 der Kommission vom 4. August 1980 über die
    Wiedereinführung des Zollsatzes für Gewirke als Meterware, weder gummielastisch
    noch kautschutiert, der Warenkategorie Nr. 63 (Kennziffer 0630), mit Ursprung
    in den Philippinen, denen die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2086/80 af 4. august 1980 om genindførelse
    af opkrævning af toldafgifter for trikotagestof, ikke elastisk eller gummeret,
    under kategori 63 (kode 0630), som har oprindelse i Filippinerne og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2086/80 della Commissione, del 4 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle stoffe a maglia non
    elastica né gommata, in pezza, della categoria di prodotti n. 63 (codice 0630),
    originarie delle Filippine, beneficiarie delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2086/80 van de Commissie van 4 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op breiwerk
    en haakwerk, niet elastisch en niet gegummeerd, aan het stuk, van de categorie
    van produkten nr. 63 (codenummer 0630), van oorsprong uit de Filippijnen waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79
    van de Raad
  type: main
