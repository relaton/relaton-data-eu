title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1622/87 of 10 June 1987 correcting Regulation
    (EEC) No 1410/87 amending Regulation (EEC) No 854/86 as regards certain detailed
    rules for applying compulsory distillation as referred to in Article 39 of Council
    Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1622/87 de la Commission du 10 juin 1987 rectifiant
    le règlement (CEE) n° 1410/87 modifiant le règlement (CEE) n° 854/86 en ce
    qui concerne certaines modalités d' application pour la distillation obligatoire
    prévue à l' article 39 du règlement (CEE) n° 822/87 du Conseil
  type: main
- language: de
  script: Latn
