    hinsichtlich einiger Durchführungsbestimmungen für die obligatorische Destillation
    gemäß Artikel 39 der Verordnung (EWG) Nr. 822/87 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1622/87 af 10 juni 1987 om berigtigelse
