title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1917/95 of 24 July 1995 establishing certain
    measures concerning imports of processed agricultural products from Iceland, Norway
    and Switzerland in order to take account of the results of the Uruguay Round negotiations
    in the agricultural sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1917/95 du Conseil, du 24 juillet 1995, établissant
    certaines mesures concernant l'importation de produits agricoles transformés
    d'Islande, de Norvège et de Suisse pour tenir compte des résultats des négociations
    de l'Uruguay Round dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1917/95 des Rates vom 24. Juli 1995 über bestimmte
    Maßnahmen betreffend die Einfuhr landwirtschaftlicher Verarbeitungserzeugnisse
    aus Island, Norwegen und der Schweiz im Hinblick auf die Ergebnisse der Verhandlungen
    der Uruguay-Runde im Agrarbereich
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1917/95 af 24. juli 1995 om visse foranstaltninger
    vedrørende import af forarbejdede landbrugsprodukter fra Island, Norge og Schweiz
    for at tage hensyn til resultaterne af Uruguay-rundens forhandlinger på landbrugsområdet
  type: main
- language: el
  script: Grek
