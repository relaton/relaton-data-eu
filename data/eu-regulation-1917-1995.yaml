    μέτρων σχετικών με την εισαγωγή μεταποιημένων
    γεωργικών προϊόντων από την Ισλανδία, τη Νορβηγία
    και την Ελβετία προκειμένου να ληφθούν υπόψη
    τα αποτελέσματα των διαπραγματεύσεων του Γύρου
    της Ουρουγουάης στο γεωργικό τομέα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1917/95, annettu 24 päivänä heinäkuuta 1995,
