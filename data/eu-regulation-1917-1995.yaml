    dell'Islanda, dalla Norvegia e dalla Svizzera per tener conto dei risultati dei
    negoziati dell'Uruguay Round nel settore agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1917/95 van de Raad van 24 juli 1995 tot vaststelling
