    uit IJsland, Noorwegen en Zwitserland om rekening te houden met de resultaten
    van de in het kader van de Uruguay-Ronde gevoerde onderhandelingen in de landbouwsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1917/95 do Conselho, de 24 de Julho de 1995, que estabelece
