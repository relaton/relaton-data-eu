  script: Latn
  content: '93/422/EEC: Commission Decision of 22 June 1993 authorizing the Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of kiln dried coniferous wood, originating in Canada, and
    establishing the details of the indicator system to be applied to the kiln dried
    wood'
  type: main
- language: fr
  script: Latn
  content: '93/422/CEE: Décision de la Commission du 22 juin 1993 autorisant les
