    Директива 77/93/ЕИО на Съвета по отношение на
    изсушен в камери дървен материал от иглолистни
    дървесни видове с произход от Канада и за определяне
    на подробностите за системата за маркиране,
    която следва да се прилага за изсушен в камери
    дървен материал
