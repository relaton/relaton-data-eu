title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1471/97 of 28 July 1997 reintroducing customs
    duties on products of CN code 6403, originating in the Republics of Bosnia- Herzegovina,
    Croatia, the Federal Republic of Yugoslavia and the Former Yugoslav Republic of
    Macedonia for which tariff ceilings were opened by Council Regulation (EC) No
    70/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1471/97 de la Commission du 28 juillet 1997 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code de la nomenclature combinée 6403 originaires des Républiques de Bosnie-Herzégovine,
    de Croatie, de la République fédérale de Yougoslavie et de l'ancienne République
    yougoslave de Macédoine, bénéficiaires de plafonds tarifaires prévus par le
    règlement (CE) n° 70/97 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1471/97 der Kommission vom 28. Juli 1997 zur Wiedererhebung
    der Zölle für Waren des KN-Codes 6403, mit Ursprung in den Republiken Bosnien-
    Herzegowina, Kroatien, der Bundesrepublik Jugoslawien und der ehemaligen Jugoslawischen
    Republik Mazedonien, denen gemäß der Verordnung (EG) Nr. 70/97 des Rates Zollplafonds
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1471/97 af 28. juli 1997 om genindførelse
