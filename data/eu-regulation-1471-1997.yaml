    tasavalloista, Jugoslavian liittotasavallasta sekä entisestä Jugoslavian tasavallasta
    Makedoniasta peräisin oleviin neuvoston asetuksessa (EY) N:o 70/97 säädettyjen
    tariffikattojen soveltamisalaan kuuluvien tuotteiden tullien uudelleen käyttöön
    ottamisesta
  type: main
