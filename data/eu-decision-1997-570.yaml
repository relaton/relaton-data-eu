    koskevista Suomessa sovellettavista siirtymätoimenpiteistä annetun päätöksen
    94/957/EY muuttamisesta toisen kerran'
  type: main
- language: it
  script: Latn
  content: '97/570/CE: Decisione della Commissione del 22 luglio 1997 recante seconda
