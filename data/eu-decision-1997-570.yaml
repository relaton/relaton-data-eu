  script: Latn
  content: '97/570/EC: Commission Decision of 22 July 1997 amending for the second
    time Decision 94/957/EC laying down the transitional measures to be applied by
    Finland with regard to veterinary checks on live animals entering Finland from
    third countries'
  type: main
- language: fr
  script: Latn
  content: '97/570/CE: Décision de la Commission du 22 juillet 1997 modifiant pour
    la seconde fois la décision 94/957/CE, définissant les mesures transitoires
    à appliquer par la Finlande en matière de contrôles vétérinaires pour les
    animaux vivants en provenance de pays tiers introduits en Finlande'
  type: main
- language: de
  script: Latn
