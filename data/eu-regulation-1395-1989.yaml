  script: Latn
  content: Règlement (CEE) n 1395/89 de la Commission, du 23 mai 1989, rectifiant
    le règlement (CEE) n 2391/87 fixant et modifiant les montants compensatoires
    monétaires pour certains produits, ainsi que les règlements (CEE) n 2678/87,
