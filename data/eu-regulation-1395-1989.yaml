  content: Commission Regulation (EEC) No 1395/89 of 23 May 1989 correcting Regulation
    (EEC) No 2391/87 setting and amending monetary compensatory amounts for certain
    products and Regulations (EEC) No 2678/87, (EEC) No 2859/87, (EEC) No 2967/87,
    (EEC) No 3155/87, (EEC) No 3249/87 and (EEC) No 3405/87 amending Regulation (EEC)
    No 1956/87 fixing the monetary compensatory amounts applicable in the agricultural
    sector and certain coefficients and rates required for their application
  type: main
