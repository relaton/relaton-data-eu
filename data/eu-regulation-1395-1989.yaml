    compensatórios monetários aplicáveis no sector agrícola, bem como certos coeficientes
    e taxas necessários à sua aplicação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1395/89 de la Comisión, de 23 de mayo de 1989, que
    rectifica el Reglamento (CEE) n 2391/87, por el que se fijan y modifican los montantes
    compensatorios monetarios para determinados productos, así como los Reglamentos
    (CEE) ns 2678/87, 2859/87, 2967/87, 3155/87, 3249/87 y 3405/87 que modifican el
