title:
- language: en
  script: Latn
  content: '79/29/EEC: Commission Decision of 11 December 1978 authorizing the French
    Republic not to apply Community treatment to receivers, whether or not combined
    with a sound recorder or reproducer, falling within subheading ex 85.15 A III
    of the Common Customs Tariff, originating in South Korea and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/29/CEE: Décision de la Commission, du 11 décembre 1978, autorisant
    la République française à exclure du traitement communautaire les appareils
    récepteurs, même combinés avec en appareil d'' enregistrement ou de reproduction
    du son, de la sous-position ex 85.15 A III du tarif douanier commun, originaires
    de la Corée du Sud et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/29/EWG: Entscheidung der Kommission vom 11. Dezember 1978, mit der
    die Französische Republik ermächtigt wird, aus Südkorea stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Empfangsgeräte, auch mit
    Tonaufnahme- oder Tonwiedergabegeräten kombiniert, der Tarifstelle ex 85.15 A
    III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/29/EØF: Kommissionens beslutning af 11. december 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage modtagere, også
    kombineret med lydoptagere eller lydgengivere, som henhører under pos. ex 85.15
    A III i den fælles toldtarif, har oprindelse i Sydkorea og frit kan omsættes
    i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/29/CEE: Decisione della Commissione, dell'' 11 dicembre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    riceventi, anche combinati con un apparecchio di registrazione o di riproduzione
    del suono, della sottovoce ex 85.15 A III della tariffa doganale comune, originari
    della Corea del Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/29/EEG: Beschikking van de Commissie van 11 december 1978 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid, van post ex 85.15 A
    III van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
