  content: "( UNOFFICIAL ENGLISH TRANSLATION ) DECISION NO. 26 OF 27 OCTOBER 1960 CONCERNING THE EFFECT ON FAMILY ALLOWANCES OWED BY THE INSTITUTIONS OF ONE MEMBER STATE UNDER ARTICLES 40 AND 42 OF REGULATION NO. 3 OF A MODIFICATION, HAVING RETROACTIVE EFFECT, ON LEGISLATION ON FAMILY ALLOWANCES IN ANOTHER MEMBER STATE"
  type: main
- language: fr
  script: Latn
  content: DECISION NO 26 DU 27 OCTOBRE 1960 CONCERNANT L' INCIDENCE SUR LES ALLOCATIONS
