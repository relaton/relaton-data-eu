title:
- language: en
  script: Latn
  content: '90/252/Euratom, ECSC, EEC: Commission Decision of 29 May 1990 adjusting
    the weightings applicable from 1 February 1990 and correcting Commission Decisions
    89/582/EEC, Euratom, ECSC and 89/619/EEC, Euratom, ECSC adjusting the weightings
    applicable from 1 September 1989 and 1 November 1989 to the remuneration of officials
    of the European Communities serving in non-member countries'
  type: main
- language: fr
  script: Latn
  content: '90/252/Euratom, CECA, CEE: Décision de la Commission du 29 mai 1990 portant
    adaptation des coefficients correcteurs applicables à partir du 1er février
    1990 et rectification des décisions 89/582/CEE, Euratom, CECA et 89/619/CEE,
    Euratom, CECA portant adaptation des coefficients correcteurs applicables à partir
    du 1er septembre 1989 et du 1er novembre 1989 aux rémunérations des fonctionnaires
    des Communautés européennes affectés dans un pays tiers'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 29. Mai 1990 ueber die Anpassung der Berichtigungskoeffizienten,
    die ab dem 1. Februar 1990 anwendbar sind, und Berichtigung der Beschluesse 89/582/EWG,
    Euratom, EGKS und 89/619/EWG, Euratom, EGKS der Kommission ueber die Anpassung
    der Berichtigungskoeffizienten, die ab dem 1. September 1989 bzw. ab dem 1. November
    1989 auf die Dienstbezuege der in einem Drittland diensttuenden Beamten der Europaeischen
    Gemeinschaften anwendbar sind (90/252/Euratom, EGKS, EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 29. maj 1990 om tilpasning af de justeringskoefficienter,
    der finder anvendelse fra 1. februar 1990 og berigtigelse af Kommissionens afgoerelser
    89/582/EOEF, Euratom, EKSF og 89/619/EOEF, Euratom, EKSF om tilpasning af de justeringskoefficienter,
    der fra 1. september 1989 og 1. november 1989 finder anvendelse (90/252/Euratom,
    EKSF, EOEF)
  type: main
- language: el
  script: Grek
  content: 90/252/Ευρατόμ, ΕΚΑΧ, ΕΟΚ; Απόφαση της Επιτροπής
    της 29ης Μαΐου 1990 για την προσαρμογή των διορθωτικών
    συντελεστών που εφαρμόζονται από την 1η Φεβρουαρίου
    1990 και τη διόρθωση των αποφάσεων 89/252/ΕΟΚ, Ευρατόμ,
    ΕΚΑΧ και 89/619/ΕΟΚ, Ευρατόμ, ΕΚΑΧ για την προσαρμογή
    των διορθωτικών συντελεστών που εφαρμόζονται
    από 1ης Σεπτεμβρίου 1989 και 1ης Νοεμβρίου 1989
    στις καταβαλλόμενες αμοιβές των υπαλλήλων
    των Ευρωπαϊκών Κοινοτήτων που είναι τοποθετημένοι
    σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 29 maggio 1990 che adegua i coefficienti
    correttori applicabili a decorrere dal 1o febbraio 1990 e rettifica le decisioni
    89/582/CEE, Euratom, CECA e 89/619/CEE, Euratom CECA che adeguano i coefficienti
    correttori applicabili a decorrere dal 1o settembre 1989 e dal 1o novembre 1989
    alle retribuzioni dei funzionari delle Comunità europee con sede di servizio
    in un paese terzo (90/252/Euratom, CECA, CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 29 mei 1990 tot wijziging van de aanpassingscoëfficiënten
    die met ingang van 1 februari 1990 van toepassing zijn op de bezoldigingen en
    tot rectificatie van de Besluiten 89/582/EEG, Euratom, EGKS en 89/619/EEG, Euratom,
    EGKS tot wijziging van de aanpassingscoëfficiënten die met ingang van 1 september
    1989 en van 1 november 1989 van toepassing zijn op de bezoldigingen van de ambtenaren
    van de Europese Gemeenschappen die zijn tewerkgesteld in een derde land (90/252/Euratom,
    EGKS, EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 29 de Maio de 1990 que adapta os coeficientes de
    correcçao aplicaveis a partir de 1 de Fevereiro de 1990 e rectifica as Decisoes
    89/582/CEE, Euratom, CECA e 89/619/CEE, Euratom, CECA, que adaptam coeficientes
    de correcçao aplicaveis a partir de 1 de Setembro de 1989 e de 1 de Novembro
    de 1989 às remuneraçoes dos funcionarios das Comunidades Europeias colocados
    num pais terceiro (90/252/Euratom, CECA, CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 29 de mayo de 1990 por la que se adaptan los
    coeficientes correctores aplicables a partir del 1 de febrero de 1990 y rectificacion
    de las Decisiones 89/582/CEE, Euratom, CECA y 89/619/CEE, Euratom, CECA por las
    que se adaptan los coeficientes correctores aplicables a partir del 1 de septiembre
    de 1989 y del 1 de noviembre de 1989 a las retribuciones de los funcionarios de
    las Comunidades Europeas destinados en un pais tercero (90/252/Euratom, CECA,
    CEE)
  type: main
