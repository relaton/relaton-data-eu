    introduites en août 1995 pour les viandes bovines fraîches, réfrigérées ou
    congelées dans le cadre des régimes d'importation prévus par les accords européens
    entre la Communauté et la république de Pologne, la république de Hongrie,
    la République tchèque, la République slovaque, la Bulgarie et la Roumanie
