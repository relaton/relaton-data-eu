  content: COMMISSION REGULATION (EC) No 2184/95 of 14 September 1995 determining
    the extent to which applications lodged in August 1995 for import licences for
    fresh, chilled or frozen beef under the import arrangements provided for in the
    Europe Agreements between the Community and the Republic of Poland, the Republic
    of Hungary, the Czech Republic, the Slovak Republic, Bulgaria and Romania can
    be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2184/95 DE LA COMMISSION du 14 septembre 1995 déterminant
