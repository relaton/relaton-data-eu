title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/250 of 21 February 2022 amending
    Implementing Regulation (EU) 2021/403 as regards the addition of a new model animal
    health/official certificate for the entry into Northern Ireland of ovine and caprine
    animals from Great Britain and amending Implementing Regulation (EU) 2021/404
    as regards the list of third countries authorised for the entry into the Union
    of ovine and caprine animals
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/250 de la Commission du 21 février
    2022 modifiant le règlement d’exécution (UE) 2021/403 en ce qui concerne l’ajout
    d’un nouveau modèle de certificat zoosanitaire/officiel pour l’entrée en
    Irlande du Nord d’ovins et de caprins en provenance de Grande-Bretagne, et modifiant
    le règlement d’exécution (UE) 2021/404 en ce qui concerne la liste des pays
    tiers en provenance desquels l’entrée d’ovins et de caprins dans l’Union
    est autorisée
  type: main
- language: de
  script: Latn
