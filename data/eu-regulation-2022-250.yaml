    durch ein neues Muster der Veterinär-/amtlichen Bescheinigung für den Eingang
    von Schafen und Ziegen aus Großbritannien nach Nordirland und zur Änderung der
    Durchführungsverordnung (EU) 2021/404 hinsichtlich der Liste der Drittländer,
    aus denen der Eingang von Schafen und Ziegen in die Union zulässig ist
