---
id: EUDecision1975471
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 May 1975 authorizing the Republic of France not
    to apply Community treatment to radio receivers, whether or not combined with
    a sound recorder or reproducer, falling within subheading 85.15 A III of the Common
    Customs Tariff, originating in South Korea and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '75/471/CEE: Décision de la Commission, du 28 mai 1975, autorisant la
    République française à exclure du traitement communautaire les appareils récepteurs
    de radio, même combinés avec un appareil d''enregistrement ou de reproduction
    du son, de la sous-position 85.15 A III du Tarif douanier commun, originaires
    de Corée du Sud et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Mai 1975, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Empfangsgeräte für Rundfunk, auch mit einem Tonaufnahme-
    oder Tonwiedergabegerät kombiniert der Tarifnummer 85.15 A m des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. maj 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage radiomodtagere også kombineret
    med lydoptagere eller lydgengivere som henhører under position 85.15 A III i
    den fælles toldtarif, hat oprindelse i Sydkorea og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 maggio 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli apparecchi radioriceventi,
    anche combinati con apparecchio di registrazione o di riproduzione del suono,
    della voce 85.15 A III della tariffa doganale comune, originari della Corea del
    Sud e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 mei 1975 waarbij de Franse Republiek
    wordt gemachtigd ontvangtoestellen voor de radio-omroep, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid van post 85.15 A III
    van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
