    ( SMS ) mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december
    1985 i sektoren for frugt og grønsager, for så vidt angår tomater, salat, bredbladet
    endivie, gulerødder, artiskokker, druer til spisebrug, meloner og jordbær
  type: main
