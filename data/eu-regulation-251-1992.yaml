    Endivie Eskariol, Karotten, Artischocken, Tafeltrauben, Melonen und Erdbeeren
    im Handel zwischen Spanien und der Gemeinschaft in ihrer Zusammensetzung am 31.
    Dezember 1985
  type: main
- language: da
  script: Latn
