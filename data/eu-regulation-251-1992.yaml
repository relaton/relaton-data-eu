  content: Commission Regulation ( EEC ) No 251/92 of 31 January 1992 laying down
    certain additional detailed rules for the application of the supplementary trade
    mechanism ( STM ) to fruit and vegetable trade between Spain and the Community
    as constituted at 31 December 1985 as regards tomatoes, lettuce, broad­leaf endives,
    carrots, artichokes, table grapes, melons and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement ( CEE ) n° 251/92 de la Commission, du 31 janvier 1992, fixant
    certaines modalités additionnelles pour l' application du mécanisme complémentaire
    aux échanges ( MCE ) dans le secteur des fruits et légumes entre l' Espagne
    et la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne
    les tomates, les laitues, les chicorées scaroles, les carottes, les artichauts,
    les raisins de table, les melons et les fraises
  type: main
- language: de
  script: Latn
