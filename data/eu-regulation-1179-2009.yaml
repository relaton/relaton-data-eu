---
id: EURegulation11792009
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1179/2009 of 26 November 2009 amending or
    repealing certain regulations on the classification of goods in the Combined Nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1179/2009 de la Commission du 26 novembre 2009 modifiant
    ou abrogeant certains règlements relatifs au classement de marchandises dans
    la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1179/2009 der Kommission vom 26. November 2009 zur
    Änderung oder Aufhebung bestimmter Verordnungen zur Einreihung von Waren in die
    Kombinierte Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1179/2009 на Комисията от 26
    ноемврﾸ 2009 година за изменение или отмяна
    на някои регламенти относно класирането на
    стоки в Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1179/2009 ze dne 26. listopadu 2009 , kterým
    se mění nebo zrušují některá nařízení o zařazení zboží do kombinované
    nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1179/2009 af 26. november 2009 om ændring
    eller ophævelse af visse forordninger om tarifering af varer i den kombinerede
    nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1179/2009 της Επιτροπής,
    της 26ης Νοεμβρίου 2009 , για την τροποποίηση ή
    την κατάργηση ορισμένων κανονισμών για την
    κατάταξη εμπορευμάτων στη Συνδυασμένη Ονοματολογία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1179/2009, 26. november 2009 , millega muudetakse
    või tunnistatakse kehtetuks teatavad määrused kaupade klassifitseerimise kohta
    kombineeritud nomenklatuuris
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1179/2009, tehty 26 päivänä marraskuuta 2009
    , tavaroiden luokittelusta yhdistettyyn nimikkeistöön annettujen tiettyjen asetusten
    muuttamisesta tai kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1179/2009 od 26. studenoga 2009. o izmjeni ili
    o stavljanju izvan snage određenih propisa o razvrstavanju robe u kombiniranu
    nomenklaturu
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1179/2009/EK rendelete ( 2009. november 26. ) az áruk Kombinált
    Nómenklatúra szerinti besorolásáról szóló egyes rendeletek módosításáról,
    illetve hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1179/2009 della Commissione, del 26 novembre 2009 ,
    che modifica o abroga alcuni regolamenti relativi alla classificazione delle merci
    nella nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1179/2009 ( 2009. gada 26. novembris ), ar ko
    groza vai atceļ dažas regulas par preču klasifikāciju kombinētajā nomenklatūrā
  type: main
- language: lt
  script: Latn
  content: 2009 m. lapkričio 26 d. Komisijos reglamentas (EB) Nr. 1179/2009, kuriuo
    iš dalies keičiami arba panaikinami tam tikri reglamentai dėl prekių klasifikavimo
    Kombinuotojoje nomenklatūroje
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1179/2009 tas- 26 ta’ Novembru 2009
    li jemenda jew iħassar ċertu regolamenti dwar il-klassifikazzjoni tal-oġġetti
    fin-Nomenklatura Magħquda
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1179/2009 van de Commissie van 26 november 2009 tot
    wijziging of intrekking van bepaalde verordeningen betreffende de indeling van
    goederen in de gecombineerde nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1179/2009 z dnia 26 listopada 2009 r. zmieniające
    lub uchylające niektóre rozporządzenia dotyczące klasyfikacji towarów według
    Nomenklatury scalonej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1179/2009 da Comissão, de 26 de Novembro de 2009
    , que altera ou revoga certos regulamentos relativos à classificação de mercadorias
    na Nomenclatura Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1179/2009 al Comisiei din 26 noiembrie 2009 de modificare
    sau de abrogare a anumitor regulamente privind clasificarea mărfurilor în Nomenclatura
    combinată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1179/2009 z 26. novembra 2009 , ktorým sa
    menia a dopĺňajú alebo zrušujú určité nariadenia o zatrieďovaní tovaru
    do kombinovanej nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1179/2009 z dne 26. novembra 2009 o spremembi
    ali razveljavitvi nekaterih uredb o razvrstitvi blaga v kombinirani nomenklaturi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1179/2009 de la Comisión, de 26 de noviembre de 2009
    , por el que se modifican o derogan determinados reglamentos relativos a la clasificación
    de las mercancías en la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1179/2009 av den 26 november 2009 om
    ändring eller upphävande av vissa förordningar om klassificeringen av varor
    i Kombinerade nomenklaturen
  type: main
