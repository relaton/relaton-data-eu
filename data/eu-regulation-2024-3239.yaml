  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/3239 оd 19. prosinca 2024. o izmjeni
    priloga V. i XIV. Provedbenoj uredbi (EU) 2021/404 u pogledu unosa za Ujedinjenu
    Kraljevinu i Sjedinjene Američke Države na popisima trećih zemalja, područja
