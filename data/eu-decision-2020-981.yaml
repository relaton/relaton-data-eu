---
id: EUDecision2020981
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/981 of 7 July 2020 amending
    Annex II to Decision 2007/777/EC as regards the entry for Kosovo (This designation
    is without prejudice to positions on status, and is in line with UNSCR 1244/1999
    and the ICJ Opinion on the Kosovo declaration of independence.) in the list of
    third countries or parts thereof from which the introduction into the Union of
    meat products and treated stomachs, bladders and intestines is authorised and
    amending Annex III to that Decision as regards the model certificate for imports
    of those products from third countries (notified under document C(2020) 4433)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/981 de la Commission du 7 juillet 2020
    modifiant l’annexe II de la décision 2007/777/CE en ce qui concerne l’entrée
    relative au Kosovo (Cette désignation est sans préjudice des positions sur le
    statut et est conforme à la résolution 1244 (1999) du Conseil de sécurité
    des Nations unies ainsi qu’à l’avis de la Cour internationale de justice
    sur la déclaration d’indépendance du Kosovo.) sur la liste des pays tiers
    ou parties de pays tiers à partir desquels l’introduction dans l’Union de
    produits à base de viande et d’estomacs, vessies et boyaux traités est autorisée,
    et modifiant l’annexe III de ladite décision en ce qui concerne le modèle
    de certificat pour l’importation de ces produits en provenance de pays tiers
    [notifiée sous le numéro C(2020) 4433]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/981 der Kommission vom 7. Juli 2020 zur
    Änderung von Anhang II der Entscheidung 2007/777/EG hinsichtlich der Aufnahme
    des Kosovos (Diese Bezeichnung berührt nicht die Standpunkte zum Status und steht
    im Einklang mit der Resolution 1244/1999 des VN-Sicherheitsrates und dem Gutachten
    des Internationalen Gerichtshofs zur Unabhängigkeitserklärung des Kosovos.)
    in die Liste von Drittländern bzw. Teilen von Drittländern, aus denen die Einfuhr
    von Fleischerzeugnissen und behandelten Mägen, Blasen und Därmen in die Union
    zugelassen ist, sowie zur Änderung von Anhang III derselben Entscheidung hinsichtlich
    der Musterbescheinigung für Einfuhren dieser Erzeugnisse aus Drittländern (Bekannt
    gegeben unter Aktenzeichen C(2020) 4433)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/981 на Комисията
    от 7 юли 2020 година за изменение на приложение
    II към Решение 2007/777/ЕО по отношение на вписването
    за Косово (Това название не засяга позициите
    по отношение на статута и е съобразено с Резолюция
    1244 (1999) на Съвета за сигурност на ООН и становището
    на Международния съд относно обявяването на
    независимост от страна на Косово.) в списъка
    на трети държави или части от тях, от които
    е разрешено въвеждането в ЕС на месни продукти
    и обработени стомаси, пикочни мехури и черва,
    и за изменение на приложение III към същото решение
    по отношение на образеца на сертификат за внос
    на посочените продукти от трети държави (нотифицирано
    под номер С(2020) 4433)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/981 ze dne 7. července 2020,
    kterým se mění příloha II rozhodnutí 2007/777/ES, pokud jde o zařazení
    položky pro Kosovo (Tímto označením nejsou dotčeny postoje k otázce statusu
    a označení je v souladu s rezolucí Rady bezpečnosti OSN 1244/1999 a se stanoviskem
    Mezinárodního soudního dvora k vyhlášení nezávislosti Kosova.) na seznam
    třetích zemí nebo jejich částí, z nichž je povolen dovoz masných výrobků
    a opracovaných žaludků, močových měchýřů a střev do Unie, a příloha
    III uvedeného rozhodnutí, pokud jde o vzor osvědčení pro dovoz těchto produktů
    ze třetích zemí (oznámeno pod číslem C(2020) 4433)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/981 af 7. juli 2020 om
    ændring af bilag II til beslutning 2007/777/EF for så vidt angår oplysningerne
    vedrørende Kosovo (Denne betegnelse indebærer ingen stillingtagen til Kosovos
    status, og den er i overensstemmelse med FN's Sikkerhedsråds resolution 1244/1999
    og Den Internationale Domstols udtalelse om Kosovos uafhængighedserklæring.)
    i listen over tredjelande eller dele af tredjelande, hvorfra det er tilladt at
    indføre maver, blærer og tarme til Unionen og om ændring af bilag III til nævnte
    forordning for så vidt angår standardcertifikatet til brug ved import af disse
    produkter fra tredjelande (meddelt under nummer C(2020) 4433)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/981 της Επιτροπής
    της 7ης Ιουλίου 2020 για την τροποποίηση του παραρτήματος
    II της απόφασης 2007/777/ΕΚ όσον αφορά την καταχώριση
    για το Κοσσυφοπέδιο (Η ονομασία αυτή χρησιμοποιείται
    με επιφύλαξη των θέσεων ως προς το καθεστώς
    και συνάδει με την απόφαση 1244/1999 του Συμβουλίου
    Ασφαλείας των Ηνωμένων Εθνών και τη γνώμη του
    Διεθνούς Δικαστηρίου σχετικά με τη διακήρυξη
    της ανεξαρτησίας του Κοσσυφοπεδίου.) στον κατάλογο
    τρίτων χωρών ή μερών τους από όπου επιτρέπεται
    η εισαγωγή στην Ένωση προϊόντων με βάση το
    κρέας, επεξεργασμένων στομαχιών, ουροδόχων
    κύστεων και εντέρων, και για την τροποποίηση
    του παραρτήματος III της εν λόγω απόφασης όσον
    αφορά το υπόδειγμα πιστοποιητικού για τις
    εισαγωγές των εν λόγω προϊόντων από τρίτες
    χώρες [κοινοποιηθείσα υπό τον αριθμό C(2020) 4433]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/981, 7. juuli 2020, millega muudetakse
    otsuse 2007/777/EÜ II lisa seoses Kosovot (Kõnealune nimetus ei piira seisukohti
    staatuse suhtes ning on kooskõlas ÜRO Julgeolekunõukogu resolutsiooniga 1244
    (1999) ja Rahvusvahelise Kohtu arvamusega Kosovo iseseisvusdeklaratsiooni kohta.)
    käsitleva kandega selliste kolmandate riikide või nende osade loetelus, millest
    on lubatud liitu tuua lihatooteid ning töödeldud magusid, põisi ja sooli, ning
    kõnealuse otsuse III lisa seoses näidissertifikaadiga kõnealuste toodete importimiseks
    kolmandatest riikidest (teatavaks tehtud numbri C(2020) 4433 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/981, annettu 7 päivänä
    heinäkuuta 2020, päätöksen 2007/777/EY liitteen II muuttamisesta siltä osin
    kuin on kyse Kosovoa (Tämä nimitys ei vaikuta asemaa koskeviin kantoihin, ja
    se on YK:n turvallisuusneuvoston päätöslauselman 1244/1999 ja Kansainvälisen
    tuomioistuimen Kosovon itsenäisyysjulistuksesta antaman lausunnon mukainen.)
    koskevista tiedoista niiden kolmansien maiden tai niiden osien luettelossa, joista
    sallitaan lihavalmisteiden sekä käsiteltyjen mahojen, rakkojen ja suolten tuonti
    unionin alueelle, sekä kyseisen päätöksen liitteen III muuttamisesta siltä
    osin kuin on kyse todistusmallista kyseisten tuotteiden kolmansista maista tapahtuvaa
    tuontia varten (tiedoksiannettu numerolla C(2020) 4433)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/981 оd 7. srpnja 2020. o izmjeni
    Priloga II. Odluci 2007/777/EZ u pogledu unosa za Kosovo (Ovim se nazivom ne dovode
    u pitanje stajališta o statusu te je on u skladu s RVSUN-om 1244(1999) i mišljenjem
    Međunarodnog suda o proglašenju neovisnosti Kosova.) na popisu trećih zemalja
    ili njihovih dijelova iz kojih je odobreno unošenje u Uniju mesnih proizvoda
    i obrađenih želudaca, mjehura i crijeva te o izmjeni Priloga III. toj odluci
    u pogledu obrasca certifikata za uvoz tih proizvoda iz trećih zemalja (priopćeno
    pod brojem dokumenta C(2020) 4433)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/981 végrehajtási határozata (2020. július 7.)
    a 2007/777/EK határozat II. mellékletének a húskészítmények, a kezelt gyomor,
    a hólyag és a belek Unióba történő behozatalára engedéllyel rendelkező
    harmadik országok vagy részeik jegyzékében a Koszovóra (Ez a megnevezés
    nem érinti a jogállással kapcsolatos álláspontokat, továbbá összhangban
    van az 1244 (1999) sz. ENSZ BT-határozattal és a Nemzetközi Bíróságnak a
    koszovói függetlenségi nyilatkozatról szóló véleményével.) vonatkozó
    bejegyzés, valamint a határozat III. mellékletének az említett termékek
    harmadik országokból történő behozatalára vonatkozó bizonyítványminta
    tekintetében történő módosításáról (az értesítés a C(2020) 4433. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/981 della Commissione del 7 luglio 2020
    che modifica l’allegato II della decisione 2007/777/CE per quanto riguarda la
    voce relativa al Kosovo (Tale designazione non pregiudica le posizioni riguardo
    allo status ed è in linea con la risoluzione 1244 (1999) dell’UNSC e con il
    parere della CIG sulla dichiarazione di indipendenza del Kosovo.) nell’elenco
    dei paesi terzi o parti dei paesi terzi da cui è autorizzata l’introduzione
    nell’Unione di prodotti a base di carne e di stomaci, vesciche e intestini trattati
    e l’allegato III di tale decisione per quanto riguarda il modello di certificato
    per le importazioni da paesi terzi di tali prodotti [notificata con il numero
    C(2020) 4433]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/981 (2020. gada 7. jūlijs) ar
    ko attiecībā uz ierakstu par Kosovu (Šis nosaukums neskar nostājas par statusu
    un atbilst ANO DP Rezolūcijai 1244 (1999) un Starptautiskās Tiesas atzinumam
    par Kosovas neatkarības deklarāciju.) to trešo valstu vai to daļu sarakstā,
    no kurām Savienībā atļauts ievest gaļas produktus un apstrādātus kuņģus,
    pūšļus un zarnas, groza Lēmuma 2007/777/EK II pielikumu un attiecībā uz
    sertifikāta paraugu minēto produktu importam no trešām valstīm groza minētā
    lēmuma III pielikumu (izziņots ar dokumenta numuru C(2020) 4433)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/981 2020 m. liepos 7 d. kuriuo
    dėl Kosovo įrašo (Šis pavadinimas nekeičia pozicijų dėl statuso ir atitinka
    JT ST rezoliuciją 1244/1999 bei Tarptautinio Teisingumo Teismo nuomonę dėl
    Kosovo nepriklausomybės deklaracijos.) trečiųjų šalių ir jų dalių, iš
    kurių leidžiama įvežti į Sąjungą mėsos gaminius ir apdorotus skrandžius,
    pūsles ir žarnas, sąraše iš dalies keičiamas Sprendimo 2007/777/EB II priedas
    ir dėl tų produktų, importuojamų iš trečiųjų šalių, sertifikato pavyzdžio
    iš dalies keičiamas to sprendimo III priedas (pranešta dokumentu Nr. C(2020)
    4433)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/981 tas-7
    ta’ Lulju 2020 li temenda l-Anness II tad-Deċiżjoni tal-Kummissjoni 2007/777/KE
    f’dak li għandu x’jaqsam mal-entrata għall-Kosovo (Dan l-isem huwa mingħajr
    preġudizzju għall-pożizzjonijiet dwar l-istatus, u huwa konformi mal-UNSCR
    1244 (1999) u l-Opinjoni tal-QIĠ dwar id-dikjarazzjoni tal-indipendenza tal-Kosovo.)
    fil-lista ta’ pajjiżi terzi u ta’ partijiet minnhom mnejn hija awtorizzata
    l-introduzzjoni tal-prodotti tal-laħam u tal-istonku, tal-bżieżaq tal-awrina
    u tal-imsaren ittrattati fl-Unjoni u li temenda l-Anness III ta’ dik id-Deċiżjoni
    f’dak li għandu x’jaqsam mal-mudell taċ-ċertifikat għall-importazzjonijiet
    ta’ dawk il-prodotti minn pajjiżi terzi (notifikata bid-dokument C(2020) 4433)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/981 van de Commissie van 7 juli 2020 tot wijziging
    van bijlage II bij Beschikking 2007/777/EG wat betreft de gegevens voor Kosovo
    (Deze benaming laat de standpunten over de status van Kosovo onverlet, en is in
    overeenstemming met Resolutie 1244 (1999) van de VN-Veiligheidsraad en het advies
    van het Internationaal Gerechtshof over de onafhankelijkheidsverklaring van Kosovo.)
    in de lijst van derde landen of delen daarvan waaruit vleesproducten en behandelde
    magen, blazen en darmen in de Unie mogen worden binnengebracht, en tot wijziging
    van bijlage III bij die beschikking wat betreft het modelcertificaat voor de invoer
    van die producten uit derde landen (Kennisgeving geschied onder nummer C(2020)
    4433)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (EU) 2020/981 z dnia 7 lipca 2020 r. zmieniająca
    załącznik II do decyzji 2007/777/WE w odniesieniu do pozycji dotyczącej Kosowa
    (Użycie tej nazwy nie wpływa na stanowiska w sprawie statusu Kosowa i jest zgodne
    z rezolucją Rady Bezpieczeństwa ONZ 1244/1999 oraz z opinią Międzynarodowego
    Trybunału Sprawiedliwości w sprawie deklaracji niepodległości Kosowa.) w wykazie
    państw trzecich lub ich części, z których dozwolone jest wprowadzanie do Unii
    produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit, oraz
    zmieniająca załącznik III do tej decyzji w odniesieniu do wzoru świadectwa
    do celów przywozu tych produktów z państw trzecich (notyfikowana jako dokument
    nr C(2020) 4433)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/981 da Comissão de 7 de julho de 2020
    que altera o anexo II da Decisão 2007/777/CE no que diz respeito à entrada relativa
    ao Kosovo (Esta designação não prejudica as posições relativas ao estatuto
    e está conforme com a Resolução 1244 (1999) do CSNU e com o parecer do TIJ
    sobre a declaração de independência do Kosovo.) na lista de países terceiros
    ou partes de países terceiros a partir dos quais é autorizada a introdução
    na União de produtos à base de carne e de estômagos, bexigas e intestinos tratados,
    e que altera o anexo III da referida decisão no que diz respeito ao modelo de
    certificado para as importações desses produtos provenientes de países terceiros
    [notificada com o número C(2020) 4433]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/981 a Comisiei din 7 iulie 2020
    de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește introducerea
    Kosovo (Această denumire nu aduce atingere pozițiilor privind statutul și este
    conformă cu RCSONU 1244/1999, precum și cu Avizul CIJ privind Declarația de
    independență a Kosovo.) în lista țărilor terțe sau a regiunilor acestora
    din care este autorizată introducerea în Uniune a produselor din carne și a
    stomacurilor, vezicilor și intestinelor tratate și de modificare a anexei III
    la decizia respectivă în ceea ce privește modelul de certificat pentru importurile
    acestor produse din țări terțe [notificată cu numărul C(2020) 4433]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/981 zo 7. júla 2020, ktorým
    sa mení príloha II k rozhodnutiu 2007/777/ES, pokiaľ ide o položku týkajúcu
    sa Kosova (Týmto označením nie sú dotknuté pozície k štatútu a označenie
    je v súlade s rezolúciou BR OSN č. 1244(1999) a so stanoviskom Medzinárodného
    súdneho dvora k vyhláseniu nezávislosti Kosova.) v zozname tretích krajín
    alebo ich častí, z ktorých je povolený vstup mäsových výrobkov a opracovaných
    žalúdkov, mechúrov a čriev do Únie, a ktorým sa mení príloha III k uvedenému
    rozhodnutiu, pokiaľ ide o vzor certifikátu na dovoz uvedených výrobkov z tretích
    krajín [oznámené pod číslom C(2020) 4433]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/981 z dne 7. julija 2020 o spremembi
    Priloge II k Odločbi 2007/777/ES glede vnosa za Kosovo (To poimenovanje ne posega
    v stališča glede statusa ter je v skladu z RVSZN 1244/1999 in mnenjem Meddržavnega
    sodišča o razglasitvi neodvisnosti Kosova.) na seznamu tretjih držav ali delov
    tretjih držav, iz katerih je dovoljen vnos mesnih izdelkov in obdelanih želodcev,
    mehurjev in črev v Unijo, ter o spremembi Priloge III k navedeni odločbi glede
    vzorca spričevala za uvoz navedenih proizvodov iz tretjih držav (notificirano
    pod dokumentarno številko C(2020) 4433)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/981 de la Comisión de 7 de julio de
    2020 por la que se modifica el anexo II de la Decisión 2007/777/CE en lo que
    respecta a la entrada correspondiente a Kosovo (Esta denominación se entiende
    sin perjuicio de las posiciones sobre su estatuto y está en consonancia con la
    Resolución 1244 (1999) del Consejo de Seguridad de las Naciones Unidas y con
    la Opinión de la Corte Internacional de Justicia sobre la declaración de independencia
    de Kosovo.) en la lista de terceros países o partes de terceros países desde
    los que está autorizada la introducción en la Unión de productos cárnicos
    y estómagos, vejigas e intestinos tratados, así como el anexo III de dicha Decisión
    en lo que respecta al modelo de certificado para las importaciones de dichos productos
    procedentes de terceros países [notificada con el número C(2020) 4433]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/981 av den 7 juli 2020 om ändring
    av bilaga II till beslut 2007/777/EG vad gäller uppgifterna om Kosovo (Denna
    beteckning påverkar inte ståndpunkter om Kosovos status och är i överensstämmelse
    med FN:s säkerhetsråds resolution 1244/1999 och med Internationella domstolens
    utlåtande om Kosovos självständighetsförklaring.) i förteckningen över tredjeländer
    eller delar av tredjeländer från vilka köttprodukter och behandlade magar,
    blåsor och tarmar får föras in till unionen och om ändring av bilaga III till
    det beslutet vad gäller förlagan till intyg för import av dessa produkter från
    tredjeländer [delgivet med nr C(2020) 4433]
  type: main
