  script: Latn
  content: Regulation (EEC) No 238/74 of the Council of 21 January 1974 extending
    to other imports the Annex to Regulation (EEC) No 109/70 establishing common rules
    for imports from state-trading countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 238/74 du Conseil, du 21 janvier 1974, étendant à
