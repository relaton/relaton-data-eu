title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 380/2009 of 8 May 2009 amending Regulation
    (EC) No 796/2004 laying down detailed rules for the implementation of cross-compliance,
    modulation and the integrated administration and control system provided for in
    Council Regulation (EC) No 1782/2003 establishing common rules for direct support
    schemes under the common agricultural policy and establishing certain support
    schemes for farmers, as well as for the implementation of cross-compliance provided
    for in Regulation (EC) No 479/2008
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 380/2009 de la Commission du 8 mai 2009 modifiant le
    règlement (CE) n o 796/2004 portant modalités d’application de la conditionnalité,
    de la modulation et du système intégré de gestion et de contrôle prévus par
    le règlement (CE) n o 1782/2003 du Conseil établissant des règles communes
    pour les régimes de soutien direct dans le cadre de la politique agricole commune
    et établissant certains régimes de soutien en faveur des agriculteurs et portant
    modalités d’application de la conditionnalité prévue par le règlement (CE)
    n o 479/2008 du Conseil
  type: main
- language: de
  script: Latn
