  type: main
- language: hu
  script: Latn
  content: A Bizottság 380/2009/EK rendelete ( 2009. május 8. ) a közös agrárpolitika
    keretébe tartozó közvetlen támogatási rendszerek közös szabályainak megállapításáról
    és a mezőgazdasági termelők részére meghatározott támogatási rendszerek
    létrehozásáról szóló 1782/2003/EK tanácsi rendelet által előírt kölcsönös
    megfeleltetés, moduláció, valamint integrált igazgatási és ellenőrzési
    rendszer végrehajtására vonatkozó részletes szabályok megállapításáról
    szóló 796/2004/EK bizottsági rendelet módosításáról, valamint a 479/2008/EK
    tanácsi rendelet által előírt kölcsönös megfeleltetés végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 380/2009 della Commissione, dell’ 8 maggio 2009 ,
    che modifica il regolamento (CE) n. 796/2004 recante modalità di applicazione
    della condizionalità, della modulazione e del sistema integrato di gestione e
    di controllo di cui al regolamento (CE) n. 1782/2003 del Consiglio che stabilisce
    norme comuni relative ai regimi di sostegno diretto nell'ambito della politica
    agricola comune e istituisce taluni regimi di sostegno a favore degli agricoltori,
    nonché modalità di applicazione della condizionalità di cui al regolamento
    (CE) n. 479/2008 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 380/2009 ( 2009. gada 8. maijs ), ar ko groza
    Regulu (EK) Nr. 796/2004, ar ko paredz sīki izstrādātus noteikumus, lai ieviestu
    savstarpēju atbilstību, modulāciju un integrēto administrēšanas un kontroles
    sistēmu, kura paredzēta Padomes Regulā (EK) Nr. 1782/2003, ar ko ievieš kopīgus
    tiešā atbalsta shēmu noteikumus saskaņā ar kopējo lauksaimniecības politiku
    un izveido dažas atbalsta shēmas lauksaimniekiem, kā arī lai ieviestu savstarpēju
    atbilstību saskaņā ar Padomes Regulu (EK) Nr. 479/2008
  type: main
- language: lt
  script: Latn
  content: 2009 m. gegužės 8 d. Komisijos reglamentas (EB) Nr. 380/2009, iš dalies
    keičiantis Reglamentą (EB) Nr. 796/2004, kuriuo nustatomos išsamios kompleksinio
    paramos susiejimo, moduliavimo ir integruotos administravimo ir kontrolės sistemos
    įgyvendinimo taisyklės, numatytos Tarybos reglamente (EB) Nr. 1782/2003, nustatančiame
    bendrąsias tiesioginės paramos schemų pagal bendrą žemės ūkio politiką
    taisykles ir nustatančiame tam tikras paramos schemas ūkininkams ir išsamios
    Reglamente (EB) Nr. 479/2008 numatyto kompleksinio paramos susiejimo įgyvendinimo
    taisyklės
  type: main
- language: mt
  script: Latn
