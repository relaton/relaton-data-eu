  script: Latn
  content: Komission asetus (EY) N:o 380/2009, annettu 8 päivänä toukokuuta 2009
    , yhteisen maatalouspolitiikan suoria tukijärjestelmiä koskevista yhteisistä
    säännöistä ja tietyistä viljelijöiden tukijärjestelmistä annetussa neuvoston
    asetuksessa (EY) N:o 1782/2003 säädettyjen täydentävien ehtojen, tuen mukauttamisen
