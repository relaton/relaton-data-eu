title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 635/87 of 2 March 1987 re-establishing the
    levying of customs duties on diodes, transistors and similar semiconductor devices;
    light-emitting diodes; electronic micro-circuits; parts, falling within subheadings
    85.21 D and E, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 635/87 de la Commission du 2 mars 1987 portant rétablissement
    de la perception des droits de douane applicables aux diodes, transistors et dispositifs
    similaires à semi-conducteur, diodes émettrices de lumière, microstructures
    électroniques, parties et pièces détachées des sous-positions 85.21 D et E
    du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 635/87 der Kommission vom 2. März 1987 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter, Leuchtdioden,
    elektronische Mikroschaltungen und Teile der Tarifstellen 85.21 D und E des Gemeinsamen
    Zolltarifs mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3924/86
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 635/87 af 2. marts 1987 om genindførelse
    af opkrævning af told for dioder, transistorer og lignende halvlederkomponenter,
    lysemitterende dioder, elektroniske mikrokredsløb og dele henhørende under pos.
    85.21 D og E i den fælles toldtarif og med oprindelse i Sydkorea, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 635/87 της Επιτροπής
    της 2ας Μαρτίου 1987 περί αποκαταστάσεως της
    εφαρμογής των δασμών για διόδους, κρυσταλλολυχνίες
    και παρόμοιες διατάξεις με ημιαγωγό, διόδους
    εκπομπής φωτός, ηλεκτρονικές μικροκατασκευές,
    μέρη και ξεχωριστά τεμάχια των διακρίσεων
    85.21 Δ και Ε του κοινού δασμολογίου, καταγωγής
    Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 635/87 della Commissione del 2 marzo 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai diodi, transistori e simili dispositivi
    semiconduttori, diodi emettitori di luce, microstrutture elettroniche, parti e
    pezzi staccati, delle sottovoci 85.21 D e E della tariffa doganale comune, originari
    della Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 635/87 van de Commissie van 2 maart 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen, luminescentiedioden, elektronische microstructuren,
    delen en onderdelen, van de postonderverdelingen 85.21 D en E van het gemeenschappelijk
    douanetarief, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr.
    3924/86 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 635/87 da Comissão de 2 de Março de 1987 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis a díodos, transístores e dispositivos
    semelhantes, com semicondutores; díodos emissores de luz; microestruturas electrónicas;
    partes e peças separadas da subposição 85.21 D, E da pauta aduaneira comum,
    originários da Coreia do Sul, beneficiária das preferências pautais previstas
    pelo Regulamento (CEE) n° 3924/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 635/87 de la Comisión de 2 de marzo de 1987 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a diodos,
    transistores y dispositivos semiconductores similares; diodos emisores de luz,
    microestructuras electrónicas; partes y piezas sueltas, de la subpartida 85.21
    D y E del arancel aduanero común, originarios de Corea del Sur, beneficiario
    de las preferencias arancelarias previstas por el Reglamento (CEE) n° 3924/86
    del Consejo
