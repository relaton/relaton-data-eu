id: EURegulation6212000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 621/2000 of 23 March 2000 initiating a 'new
    exporter' review of Council Regulation (EC) No 1950/97 imposing a definitive anti-dumping
    duty on imports of sacks and bags made of polyethylene or polypropylene originating,
    inter alia, in India, repealing the duty with regard to imports from one exporter
    in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 621/2000 de la Commission, du 23 mars 2000, portant
    ouverture d'un réexamen au titre de «nouvel exportateur» du règlement (CE)
    nº 1950/97 du Conseil instituant un droit antidumping définitif sur les importations
    de sacs et sachets de polyéthylène ou de polypropylène originaires, entre autres,
    d'Inde, abrogeant le droit en ce qui concerne les importations d'un exportateur
    de ce pays et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 621/2000 der Kommission vom 23. März 2000 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 1950/97 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Säcken und Beuteln
    aus Polyethylen oder Polypropylen mit Ursprung unter anderem in Indien (Überprüfung
    für einen neuen Ausführer), zur Außerkraftsetzung des Zolls gegenüber den
    Einfuhren der Ware eines Ausführers in diesem Land und zur zollamtlichen Erfassung
    dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 621/2000 af 23. marts 2000 om indledning
    af en fornyet undersøgelse vedrørende en ny eksportør af Rådets forordning
    (EF) nr. 1950/97 om indførelse af en endelig antidumpingtold på importen af
    sække og poser af polyethylen eller polypropylen med oprindelse i bl.a. Indien
    og om suspension af tolden for så vidt angår importen fra en eksportør i dette
    land og om registrering af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 621/2000 της Επιτροπής,
    της 23ης Μαρτίου 2000, για την έναρξη επανεξέτασης
    όσον αφορά έναν «νέο εξαγωγέα» στο πλαίσιο
    του κανονισμού (ΕΚ) αριθ. 1950/97 του Συμβουλίου
    περί επιβολής οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές σάκων και σακιδίων από πολυαιθυλένιο
    ή από πολυπροπυλένιο καταγωγής, μεταξύ άλλων,
    Ινδίας, για την κατάργηση του δασμού όσον αφορά
    τις εισαγωγές ενός εξαγωγέα της ως άνω χώρας
    και για την καταγραφή των εν λόγω εισαγωγών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 621/2000, annettu 23 päivänä maaliskuuta 2000,
    lopullisen polkumyyntitullin käyttöönotosta muun muassa Intiasta peräisin
    olevien polyeteenistä tai polypropeenista valmistettujen säkkien ja pussien
    tuonnissa annettuun neuvoston asetukseen (EY) N:o 1950/97 liittyvän "uutta viejää"
    koskevan tarkastelun vireillepanosta, yhden kyseisen maan viejän tuontiin sovellettavan
    tullin kumoamisesta ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 621/2000 della Commissione, del 23 marzo 2000, che
    avvia un riesame relativo ai «nuovi esportatori» del regolamento (CE) n. 1950/97
    del Consiglio, che impone un dazio antidumping definitivo sulle importazioni di
    sacchi e sacchetti di polietilene o di polipropilene originari, fra l'altro, dell'India,
    abroga il dazio per quanto riguarda le importazioni provenienti da un esportatore
    indiano e stabilisce che le importazioni siano soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 621/2000 van de Commissie van 23 maart 2000 tot inleiding
    van een procedure, ten behoeve van een nieuwe exporteur, voor de herziening van
    Verordening (EG) nr. 1950/97 van de Raad tot instelling van een definitief antidumpingrecht
    op zakken van polyethyleen of van polypropyleen uit, onder meer, India, tot intrekking
    van het recht ten aanzien van een exporteur in dit land en tot registratie van
    de betrokken invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 621/2000 da Comissão, de 23 de Março de 2000, que
    inicia um reexame de «novo exportador» do Regulamento (CE) n.o 1950/97 do Conselho
    que institui um direito anti-dumping definitivo sobre as importações de sacos
    de polietileno ou de polipropileno originários, nomeadamente, da Índia, revoga
    o direito aplicável às importações de um exportador deste país e sujeita
    essas importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 621/2000 de la Comisión, de 23 de marzo de 2000, por
    el que se inicia una reconsideración para «un nuevo exportador» del Reglamento
    (CE) nº 1950/97 del Consejo por el que se establece un derecho antidumping definitivo
    sobre las importaciones de sacos y bolsas de polietileno o polipropileno originarias,
    inter alia, de la India, y por el que se deroga el derecho aplicable a las importaciones
    de un exportador de este país y se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 621/2000 av den 23 mars 2000 om inledande
    av en översyn avseende en ny exportör av rådets förordning (EG) nr 1950/97
    beträffande införande av en slutgiltig antidumpningstull på import av säckar
    och påsar av polyeten eller polypropen med ursprung i bland annat Indien, om
    upphävande av tullen på import från en exportör i det landet och om registrering
    av denna import
  type: main
