    darbībām, kas pieder pie Eiropas Lauksaimniecības vadības un garantiju fonda
    finansēšanas sistēmas, kā arī lauksaimniecības maksājumu un muitas nodokļu
    piedziņā un attiecībā uz pievienotās vērtības nodokļa un dažu akcīzes
    nodokļu piedzīšanu
  type: main
