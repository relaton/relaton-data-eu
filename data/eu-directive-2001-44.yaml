    direttiva 76/308/CEE relativa all'assistenza reciproca in materia di recupero
    dei crediti risultanti da operazioni che fanno parte del sistema di finanziamento
    del Fondo europeo agricolo di orientamento e di garanzia, nonché dei prelievi
    agricoli, dei dazi doganali, dell'imposta sul valore aggiunto e di talune accise
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 2001/44/EK (2001. gada 15. jūnijs), ar ko groza Direktīvu
