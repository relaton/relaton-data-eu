title:
- language: en
  script: Latn
  content: Council Directive 80/1273/EEC of 22 December 1980 amending, consequent
    on the accession of Greece, Directive 80/154/EEC concerning the mutual recognition
    of diplomas, certificates and other evidence of formal qualifications in midwifery
    and including measures to facilitate the effective exercise of the right of establishment
    and freedom to provide services
  type: main
- language: fr
  script: Latn
  content: Directive 80/1273/CEE du Conseil, du 22 décembre 1980, modifiant, à la
    suite de l'adhésion de la Grèce, la directive 80/154/CEE visant à la reconnaissance
    mutuelle des diplômes, certificats et autres titres de sage-femme et comportant
    des mesures destinées à faciliter l'exercice effectif du droit d'établissement
    et de libre prestation de services
  type: main
- language: de
  script: Latn
  content: Richtlinie 80/1273/EWG des Rates vom 22. Dezember 1980 zur Änderung aufgrund
    des Beitritts Griechenlands der Richtlinie 80/154/EWG über die gegenseitige Anerkennung
    der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise für Hebammen
    und über Maßnahmen zur Erleichterung der tatsächlichen Ausübung des Niederlassungsrechts
    und des Rechts auf freien Dienstleistungsverkehr
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 22 декември 1980 година
    за изменение, вследствие присъединяването
    на Гърция, на Директива 80/154/ЕИО относно взаимното
    признаване на дипломи, удостоверения и други
    официални документи за акушерки, включваща
    и мерки за улесняване на действителното упражняване
    на правото на установяване и на свободното
    предоставяне на услуги
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 22. prosince 1980, kterou se v důsledku přistoupení
    Řecka mění směrnice 80/154/EHS o vzájemném uznávání diplomů, osvědčení
    a jiných dokladů o dosažené kvalifikaci porodních asistentek a o opatřeních
    pro usnadnění účinného výkonu práva usazování a volného pohybu služeb
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 80/1273/EØF af 22. december 1980 om ændring, som følge
    af Grækenlands tiltrædelse, af direktiv 80/154/EØF om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser for jordemødre
    og om foranstaltninger, der skal lette den faktiske udøvelse af etableringsretten
    og den fri udveksling af tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 80/1273/ΕΟΚ του Συμβουλίου της 22ας Δεκεμβρίου
    1980 περί τροποποίησης, λόγω της προσχώρησης
    της Ελληνικής Δημοκρατίας στις Ευρωπαϊκές
    Κοινότητες, της οδηγίας 80/154/ΕΟΚ «περί αμοιβαίας
    αναγνώρισης των διπλωμάτων, πιστοποιητικών
    και άλλων τίτλων των μαιών, και περί των μέτρων
    προς διευκόλυνση της πραγματικής άσκησης του
    δικαιώματος εγκατάστασης και του δικαιώματος
    της ελεύθερης παροχής υπηρεσιών»
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 22. detsember 1980, millega muudetakse Kreeka ühinemise
    tõttu direktiivi 80/154/EMÜ, mis käsitleb ämmaemandate diplomite, tunnistuste
    ja muude kvalifikatsiooni tõendavate dokumentide vastastikust tunnustamist ja
    mis sisaldab meetmeid asutamisõiguse ja teenuste osutamise vabaduse kasutamise
    hõlbustamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 80/1273/ETY, annettu 22 päivänä joulukuuta 1980,
    kätilön tutkintotodistusten, todistusten ja muiden muodollista kelpoisuutta
    osoittavien asiakirjojen vastavuoroisesta tunnustamisesta sekä toimenpiteistä
    sijoittautumisvapauden ja palvelujen tarjoamisen vapauden tehokkaan käyttämisen
    helpottamiseksi annetun direktiivin 80/154/ETY muuttamisesta Kreikan liittymisen
    vuoksi
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1980. december 22.) a szülésznői oklevelek, bizonyítványok
    és a képesítés megszerzéséről szóló egyéb tanúsítványok kölcsönös
    elismeréséről, valamint a letelepedés és szolgáltatásnyújtás szabadságának
    tényleges gyakorlását elősegítő intézkedésekről szóló 80/154/EGK irányelvnek
    Görögország csatlakozása következtében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 80/1273/CEE del Consiglio, del 22 dicembre 1980, che modifica,
    a seguito dell'adesione della Grecia, la direttiva 80/154/CEE, concernente il
    reciproco riconoscimento dei diplomi, certificati ed altri titoli di ostetrica
    e comportante misure destinate ad agevolare l'esercizio effettivo del diritto
    di stabilimento e di libera prestazione dei servizi
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1980. gada 22. decembris), ar ko pēc Grieķijas pievienošanās
    groza Direktīvu 80/154/EEK par vecmāšu diplomu, sertifikātu un citu kvalifikāciju
    apliecinošu dokumentu savstarpēju atzīšanu, tostarp par pasākumiem, kas palīdz
    sekmīgi īstenot tiesības veikt uzņēmējdarbību un brīvību sniegt pakalpojumus
  type: main
- language: lt
  script: Latn
  content: 1980 m. gruodžio 22 d. Tarybos Direktyva dėl Graikijos įstojimo iš
    dalies keičianti Direktyvą 80/154/EEB dėl akušerių diplomų, pažymėjimų
    ir kitų oficialią kvalifikaciją patvirtinančių dokumentų abipusio pripažinimo,
    įskaitant priemones, padedančias veiksmingai naudotis įsisteigimo teise ir
    laisve teikti paslaugas
  type: main
- language: mt
  script: Latn
  content: Id-direttiva tal-kunsill tat-22 ta’ Diċembru 1980 li temenda, b’konsegwenza
    għall-adeżjoni tal-Greċja, id-Direttiva 80/154/KEE dwar ir-rikonoxximent reċiproku
    ta’ diplomi, ċertifikati u provi oħrajn ta’ kwalifiki formali għall-professjoni
    tal-qabla u li tinkludi miżuri biex jiffaċilitaw l-eżerċizzju effettiv tad-dritt
    ta’ stabbiliment u l-libertà li jiġu pprovduti servizzi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 80/1273/EEG van de Raad van 22 december 1980 tot wijziging, in
    verband met de toetreding van Griekenland, van Richtlijn 80/154/EEG inzake de
    onderlinge erkenning van de diploma's, certificaten en andere titels van de verloskundige,
    tevens houdende maatregelen tot vergemakkelijking van de daadwerkelijke uitoefening
    van het recht van vestiging en vrij verrichten van diensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 22 grudnia 1980 r. zmieniająca, w następstwie przystąpienia
    Grecji, dyrektywę 80/154/EWG dotyczącą wzajemnego uznawania dyplomów, świadectw
    i innych dokumentów potwierdzających posiadanie kwalifikacji w zakresie położnictwa
    łącznie ze środkami mającymi na celu ułatwienie skutecznego wykonywania prawa
    przedsiębiorczości i swobody świadczenia usług
  type: main
- language: pt
  script: Latn
  content: Directiva 80/1273/CEE do Conselho, de 22 de Dezembro de 1980, que altera,
    em razão da adesão da Grécia, a Directiva 80/154/CEE que tem por objectivo
    o reconhecimento mútuo dos diplomas, certificados e outros títulos de parteira
    e que inclui medidas destinadas a facilitar o exercício efectivo do direito de
    estabelecimento e da livre prestação de serviços
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 22 decembrie 1980 de modificare a Directivei
    80/154/CEE, în urma aderării Greciei, privind recunoașterea reciprocă a diplomelor,
    certificatelor și a altor titluri oficiale de calificare în obstetrică, inclusiv
    a măsurilor destinate să faciliteze exercitarea efectivă a dreptului de stabilire
    și a libertății de a presta servicii
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 22. decembra 1980, ktorou sa mení a dopĺňa, v dôsledku
    pristúpenia Grécka, smernica č. 80/154/EHS o vzájomnom uznávaní diplomov,
    osvedčení a iných dokladov o formálnych kvalifikáciách v oblasti pôrodnej
    asistencie a o opatreniach na uľahčenie účinného uplatňovania práva usadiť
    sa a slobody poskytovať služby
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 22. decembra 1980 o spremembi Direktive 80/154/EGS
    o vzajemnem priznavanju diplom, spričeval in drugih dokazil o formalnih kvalifikacijah
    v babištvu in o ukrepih za učinkovito uresničevanje pravice ustanavljanja in
    svobode opravljanja storitev zaradi pristopa Grčije
  type: main
- language: es
  script: Latn
  content: Directiva 80/1273/CEE del Consejo, de 22 de diciembre de 1980, por la que
    se modifica, tras la adhesión de Grecia, la Directiva 80/154/CEE en la que se
    prevé el reconocimiento mutuo de los diplomas, certificados y otros títulos
    de matrona o asistente obstétrico, y se establecen medidas destinadas a facilitar
    el ejercicio efectivo del derecho de establecimiento y de libre prestación de
    servicios
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 80/1273/EEG av den 22 december 1980 om ändring som följd
    av Greklands anslutning av direktiv 80/154/EEG om ömsesidigt erkännande av utbildnings-,
    examens- och andra behörighetsbevis för barnmorskor inklusive åtgärder för
    att underlätta det faktiska utövandet av etableringsrätten och friheten att
    tillhandahålla tjänster
  type: main
