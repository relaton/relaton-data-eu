title:
- language: en
  script: Latn
  content: '79/381/EEC: Commission Decision of 26 March 1979 on the reimbursement
    by the Guidance Section of the EAGGF to Ireland of expenditure incurred during
    1977 on annuities relating to measures to encourage the cessation of farming and
    the reallocation of utilized agricultural area for the purpose of structural improvement
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/381/CEE: Décision de la Commission, du 26 mars 1979, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole (FEOGA), section
    "orientation", à l''Irlande des dépenses effectuées pendant l''année 1977
    pour les indemnités relatives à l''encouragement à la cessation de l''activité
    agricole et à l''affectation de la superficie agricole utilisée à des fins
    d''amélioration des structures (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/381/EWG: Entscheidung der Kommission vom 26. März 1979 über die Rückvergütung
    der im Jahr 1977 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an Irland (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/381/EØF: Kommissionens beslutning af 26. marts 1979 om refusion gennem
    EUGFL, udviklingssektionen, til Irland af de udgifter, som er afholdt i løbet
    af året 1977 til godtgørelser vedrørende støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål (Kun
    den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/381/CEE: Decisione della Commissione, del 26 marzo 1979, relativa al
    rimborso da parte del FEAOG, sezione orientamento, all''Irlanda delle spese effettuate
    durante il 1977 per le indennità concernenti l''incoraggiamento alla cessazione
    dell''attività agricola e alla destinazione della superficie agricola utilizzata
    a scopi di miglioramento delle strutture (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/381/EEG: Beschikking van de Commissie van 26 maart 1979 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan Ierland van de gedurende
    het jaar 1977 gedane uitgaven voor de uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van de aanwending van cultuurgrond
    tot verbetering van de structuur (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
