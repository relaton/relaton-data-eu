  script: Latn
  content: '94/227/EEG: Beschikking van de Commissie van 27 oktober 1993 inzake de
    toekenning van bijstand uit het cohesie- financieringsinstrument voor een project
    in Griekenland inzake: - vervanging van het waterleidingstelsel in Patras - bouw
    van een bijkomende toevoerleiding voor de watervoorziening van Ptolemaida - aanleg
    van waterleidingen in Chalkida - aanleg van een watervoorzieningsstelsel voor
    Veria - aanleg van een watervoorzieningsstelsel voor Giannitsa - aanleg van een
    watervoorzieningsstelsel voor Volos - aanleg van een watervoorzieningsstelsel
    voor Larissa - uitbouw van het watertoevoer- en waterverdelingssysteem van Trikala
    Nr. CF: 93/09/61/036 - 93/09/61/051 - 93/09/61/052 - 93/09/61/058 - 93/09/61/062
