  script: Latn
  content: '94/227/EEC: Commission Decision of 27 October 1993 concerning the granting
    of assistance from the cohesion financial instrument to the project in Greece
    - Replacement of the internal water-supply system in Patra - External aqueduct-extension
    of the internal water- supply system for Ptolemaida - Internal system for Chalkidas
    - Water-supply system for the town of Veria - Water-supply system of Giannitsa
    - Water-supply system of Volos - Water-supply system for the town of Larissa -
    Completion and reinforcement of the internal and external water-supply system
    of Trikala. Nos CF: 93/09/61/036 - 93/09/61/051 - 93/09/61/052 - 93/09/61/058
    - 93/09/61/062 (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/227/CEE: Décision de la Commission du 27 octobre 1993 relative à
    l''octroi d''un concours de l''instrument financier de cohésion pour les projets
    suivants en Grèce: remplacement du système interne d''adduction d''eau à Patras
    - agrandissement de l''aqueduc extérieur du système interne d''adduction d''eau
    à Ptolemaida - installation d''un système interne à Chalkida - installation
    d''un système d''adduction d''eau à Veria - installation d''un système d''adduction
    d''eau à Giannitsa - installation d''un système d''adduction d''eau à Volos
    - installation d''un système d''adduction d''eau à Larissa - achèvement et
    renforcement des systèmes interne et externe d''adduction d''eau à Trikala n°
    FC: 93/09/61/036 - 93/09/61/051 - 93/09/61/052 - 93/09/61/058 - 93/09/61/062 -
    (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/227/EWG: Entscheidung der Kommission vom 27. Oktober 1993 über die
    Gewährung einer Unterstützung aus dem Kohäsions-Finanzinstrument für ein Vorhaben
    in Griechenland betreffend: - Ersatz des inneren Wasserversorgungsnetzes für
    Patras - Äußerer Aquädukt - Erweiterung des inneren Wasserversorgungsnetzes
    für Ptolemaida - Inneres Netz für Chalkida - Wasserversorgungsnetz für die
    Stadt Veria - Wasserversorgungsnetz für Giannitsa - Wasserversorgungsnetz für
    Volos - Wasserversorgungsnetz für die Stadt Larissa - Kanalisationsanlage für
    Patras - Vervollständigung und Verstärkung des inneren und äußeren Wasserversorgungsnetzes
    für Trikala. Nr. FC: 93/09/61/036 - 93/09/61/051 - 93/09/61/052 - 93/09/61/058
    - 93/09/61/062 - (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/227/EØF: Kommissionens Beslutning af 27. oktober 1993 om støtte fra
