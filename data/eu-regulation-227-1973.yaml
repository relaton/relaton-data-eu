title:
- language: en
  script: Latn
  content: Regulation (EEC) No 227/73 of the Council of 31 January 1973 authorizing
    the new Member States to take over national subdivisions for certain agricultural
    products within the Common Customs Tariff nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 227/73 du Conseil, du 31 janvier 1973, autorisant
    les nouveaux États membres à reprendre, au sein de la nomenclature du tarif
    douanier commun, des subdivisions nationales pour certains produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 227/73 des Rates vom 31. Januar 1973, mit der die
    neuen Mitgliedstaaten ermächtigt werden, einzelstaatliche Unterteilungen für
    einige landwirtschaftliche Erzeugnisse in das Schema des Gemeinsamen Zolltarifs
    zu übernehmen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 227/73 af 31. januar 1973 om adgang for de
    nye medlemsstater til for visse landbrugsprodukter at optage nationale underpositioner
    i den fælles toldtarifs nomenklatur
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 227/73 del Consiglio, del 31 gennaio 1973, che autorizza
    i nuovi Stati membri a riprendere, per alcuni prodotti agricoli, talune suddivisioni
    nazionali all' interno della nomenclatura della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 227/73 van de Raad van 31 januari 1973 tot machtiging
    van de nieuwe Lid-Staten om in de nomenclatuur van het gemeenschappelijk douanetarief
    nationale onderverdelingen voor sommige landbouwprodukten over te nemen
  type: main
