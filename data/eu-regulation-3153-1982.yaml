title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3153/82 of 25 November 1982 re-establishing
    the levying of customs duties on nuts separately consigned, other than stainless
    steel and other than self-locking nuts, falling within subheading 73.32 B ex II
    and originating in Malaysia, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3601/81 applyh
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3153/82 de la Commission, du 25 novembre 1982, portant
    rétablissement de la perception des droits de douane applicables aux écrous,
    présentés isolément, autres qu' en acier inoxydable et autres que de sécurité,
    de la sous-position tarifaire 73.32 B ex II, originaires de Malaisie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil2
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3153/82 der Kommission vom 25. November 1982 zur Wiedereinführung
    der Erhebung der Zölle für lose Muttern, ausgenommen Muttern aus rostfreiem
    Stahl und Sicherungsmuttern, der Tarifstelle 73.32 B ex II, mit Ursprung in Malaysia,
    dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3153/82 af 25. november 1982 om genindførelse
    af opkrævning af told for løse møtrikker andre af rustfri stål, og andre af
    sikringsmøtrikker henhørende under pos. 73.32 B ex II og med oprindelse i Malaysia,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
