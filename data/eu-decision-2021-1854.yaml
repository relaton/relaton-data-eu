    de Asociación instituido por el Acuerdo Euromediterráneo por el que se crea
    una asociación entre las Comunidades Europeas y sus Estados miembros, por una
    parte, y el Reino Hachemita de Jordania, por otra, en lo que respecta a la prórroga
