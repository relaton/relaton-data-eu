    ihren Mitgliedstaaten einerseits und dem Haschemitischen Königreich Jordanien
    andererseits eingesetzten Assoziationsrat im Hinblick auf eine Verlängerung der
    Gültigkeit der Partnerschaftsprioritäten EU-Jordanien bis zur Annahme neuer
    Partnerschaftsprioritäten durch den Assoziationsrat zu vertreten ist
