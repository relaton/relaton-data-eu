  content: '84/87/EEC: Council Decision of 6 February 1984 authorizing the Italian
    Republic to derogate until 31 December 1983 from the value added tax arrangements
    in the context of aid to earthquake victims in southern Italy'
  type: main
- language: fr
  script: Latn
  content: '84/87/CEE: Décision du Conseil du 6 février 1984 autorisant la République
    italienne à déroger jusqu'' au 31 décembre 1983 au régime de la taxe sur la
    valeur ajoutée dans le cadre des aides en faveur des victimes des tremblements
    de terre dans le sud de l'' Italie'
  type: main
- language: de
  script: Latn
  content: '84/87/EWG: Entscheidung des Rates vom 6. Februar 1984 zur Ermächtigung
    der Italienischen Republik, bis zum 31. Dezember 1983 im Rahmen der Hilfe zugunsten
    der Erdbebenopfer in Süditalien von der Mehrwertsteuerregelung abzuweichen'
  type: main
- language: da
  script: Latn
  content: '84/87/EØF: Rådets beslutning af 6. februar 1984 om bemyndigelse til
