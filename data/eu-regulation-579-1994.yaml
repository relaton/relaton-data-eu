title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 579/94 of 16 March 1994 amending Regulation
    (EC) No 336/94 fixing the number of young male bovine animals which may be imported
    on special terms in the first quarter of 1994 and derogating from Regulation (EEC)
    No 2377/80 in respect of that quarter as regards the allocation of the quantities
    available
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 579/94 de la Commission du 16 mars 1994 modifiant le
    règlement (CE) n° 336/94 relatif à la fixation de la quantité de jeunes bovins
    mâles pouvant être importés à des conditions spéciales pour le premier trimestre
    de 1994 et portant dérogation, pour ce trimestre, au règlement (CEE) n° 2377/80
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 579/94 DER KOMMISSION vom 16. März 1994 zur Änderung
    der Verordnung (EG) Nr. 336/94 zur Festsetzung der Anzahl männlicher Jungrinder,
    die im ersten Vierteljahr 1994 unter Sonderbedingungen eingeführt werden können,
    und zur Abweichung von der Verordnung (EWG) Nr. 2377/80
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 579/94 af 16. marts 1994 om ændring
    af forordning (EF) nr. 336/94 om fastsættelse af den mængde ungtyre, der kan
    indføres på særlige betingelser i første kvartal af 1994, og om undtagelse
    for første kvartal fra forordning (EØF) nr. 2377/80
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 579/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 16ης Μαρτίου 1994 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 336/94 για τον καθορισμό
    των ποσοτήτων των νεαρών αρρένων βοοειδών
    που είναι δυνατόν να εισαχθούν με ειδικούς
    όρους κατά το πρώτο τρίμηνο του 1994 και για παρέκκλιση,
    κατά το τρίμηνο αυτό, από τον κανονισμό (ΕΟΚ)
    αριθ. 2377/80
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 579/94 DELLA COMMISSIONE del 16 marzo 1994 che modifica
    il regolamento (CE) n. 336/94 che fissa il numero di giovani bovini maschi che
    possono essere importati a condizioni speciali nel primo trimestre del 1994 e
    reca deroga, per tale trimestre, al regolamento (CEE) n. 2377/80
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 579/94 VAN DE COMMISSIE van 16 maart 1994 houdende
    wijziging van Verordening (EG) nr. 336/94 tot vaststelling van het aantal jonge
    mannelijke runderen dat in het eerste kwartaal van 1994 onder bijzondere voorwaarden
    mag worden ingevoerd, en houdende afwijking, voor dat kwartaal, van Verordening
    (EEG) nr. 2377/80
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 579/94 DA COMISSÃO de 16 de Março de 1994 que altera
    o Regulamento (CE) nº 336/94 que fixa a quantidade de vitelos machos que podem
    ser importados em condições especiais durante o primeiro trimestre de 1994 e
    prevê uma derrogação, no que diz respeito ao referido trimestre, ao Regulamento
    (CEE) nº 2377/80
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 579/94 DE LA COMISIÓN de 16 de marzo de 1994 por el
    que se modifica el Reglamento (CE) nº 336/94 por el que se fija la cantidad de
    machos jóvenes de la especie bovina que podrán importarse en condiciones especiales
    durante el primer trimestre de 1994 y por el que se establece una excepción,
    para este trimestre, al Reglamento (CEE) nº 2377/80
  type: main
