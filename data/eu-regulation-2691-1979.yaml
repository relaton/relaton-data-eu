title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2691/79 of 29 November 1979 re-establishing
    the levying of customs duties on woven fabrics of sheep's or lambs'wool or of
    fine animal hair, falling within heading No 53.11 and originating in Uruguay,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2691/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    laine ou de poils fins, de la position 53.11 du tarif douanier commun, originaires
    d'Uruguay, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2691/79 DER KOMMISSION VOM 29. NOVEMBER 1979 UEBER
    DIE WIEDEREINFUEHRUNG DES ZOLLSATZES FUER GEWEBE AUS WOLLE ODER FEINEN TIERHAAREN
    DER TARIFNUMMER 53.11 MIT URSPRUNG IN URUGUAY, DEM DIE IN DER VERORDNUNG ( EWG
    ) NR. 1195/79 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN GEWAEHRT WERDEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2691/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for vævet stof af uld eller fine dyrehår under
    position 53.11, som har oprindelse i Uruguay og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2691/79 DELLA COMMISSIONE, DEL 29 NOVEMBRE 1979,
    CHE RIPRISTINA LA RISCOSSIONE DEI DAZI DOGANALI APPLICABILI AI TESSUTI DI LANA
    O DI PELI FINI DELLA VOCE DOGANALE 53.11, ORIGINARI DELL' URUGUAY BENEFICIARIO
    DELLE PREFERENZE TARIFFARIE PREVISTE DAL REGOLAMENTO ( CEE ) N. 1195/79 DEL CONSIGLIO
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2691/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van wol of van fijn haar van post 53.11, van oorsprong uit Uruguay waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening ( EEG ) nr. 1195/79
    van de Raad
