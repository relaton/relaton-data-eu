  content: Commission Regulation (EEC) No 627/82 of 17 March 1982 re-establishing
    the levying of customs duties on ethyl acetate, falling within subheading 29.14
    A II c) ex 1 and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 627/82 de la Commission, du 17 mars 1982, portant
    rétablissement de la perception des droits de douane applicables à l' acétate
    d' éthyle, de la sous-position 29.14 A II c) ex 1 du tarif douanier commun, originaire
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
