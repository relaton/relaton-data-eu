title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1970, portant octroi du concours
    du FSE au bénéfice de la République française pour des dépenses relatives
    à des opérations de rééducation professionnelle et de réinstallation effectuées
    par le Ministère des anciens combattants et victimes de guerre et par le Ministère
    du travail, de l'emploi et de la population
  type: main
- language: de
  script: Latn
  content: '70/476/EWG: Entscheidung der Kommission vom 30. September 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Republik
    Frankreich zu Aufwendungen für vom "Ministère des anciens combattants et victimes
    de guerre" und vom "Ministère du travail, de l''emploi et de la population" durchgeführte
    Berufsumschulungs- und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '70/476/CEE: Decisione della Commissione, del 30 settembre 1970, relativa
    alla concessione di un contributo del Fondo sociale europeo a favore della Repubblica
    francese per spese concernenti operazioni di riqualificazione professionale e
    di nuova sistemazione effettuate dal «Ministère des anciens combattants et victimes
    de guerre» e dal «Ministère du travail, de l''emploi et de la population»'
  type: main
- language: nl
  script: Latn
  content: '70/476/EEG: Beschikking van de Commissie van 30 september 1970 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Franse Republiek
    voor door het "Ministère des anciens combattants et victimes de guerre" en het
    "Ministère du travail, de l''emploi et de la population" gemaakte herscholings-
    en verplaatsingskosten'
