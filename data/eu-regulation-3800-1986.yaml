    εισαγωγή στην Ισπανία προϊόντων του τομέα
    του χορείου κρέατος προέλευσης τρίτων χωρών,
    και ορισμένες λεπτομέρειες για την εφαρμογή
    της
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3800/86 della Commissione del 12 dicembre 1986 che
    fissa il contingente applicabile nel 1987 alle importazioni in Spagna di prodotti
    del settore delle carni suine provenienti dai paesi terzi e stabilisce le relative
    modalità di applicazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3800/86 van de Commissie van 12 december 1986 tot
    vaststelling van het contingent voor 1987 dat Spanje voor produkten van de sector
    varkensvlees uit derde landen mag toepassen, en van uitvoeringsbepalingen terzake
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3800/86 da Comissão de 12 de Dezembro de 1986 que
