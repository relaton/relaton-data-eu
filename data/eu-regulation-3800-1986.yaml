    tredjelande og visse bestemmelser for dets anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3800/86 της Επιτροπής
    της 12ης Δεκεμβρίου 1986 που καθορίζει, για το
