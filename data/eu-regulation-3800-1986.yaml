    produits du secteur de la viande de porc en provenance des pays tiers et certaines
    modalités pour son application
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3800/86 der Kommission vom 12. Dezember 1986 zur Festlegung
