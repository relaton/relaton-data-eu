title:
- language: fr
  script: Latn
  content: Décision 66/490/CEE de la Commission, du 29 juillet 1966, portant nouvelle
    modification de sa décision du 30 novembre 1964, autorisant la perception de
    taxes compensatoires à l'importation, dans la République française, de glucose
    (dextrose) en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '66/490/EWG: Entscheidung der Kommission vom 29. Juli 1966 zur erneuten
    Änderung ihrer Entscheidung vom 30. November 1964 über die Erhebung einer Ausgleichsabgabe
    bei der Einfuhr von Glukose (Dextrose) aus den anderen Mitgliedstaaten in die
    Französische Republik'
  type: main
- language: it
  script: Latn
  content: '66/490/CEE: Decisione della Commissione, del 29 luglio 1966, con cui si
    modifica nuovamente la decisione della Commissione del 30 novembre 1964, che autorizza
    la riscossione di tasse di compensazione all''importazione, nella Repubblica francese,
    di glucosio (destrosio) in provenienza da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/490/EEG: Beschikking van de Commissie van 29 juli 1966 tot nieuwe wijziging
    van haar beschikking van 30 november 1964 houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Franse Republiek van glucose (dextrose)
    uit bepaalde Lid-Staten'
  type: main
