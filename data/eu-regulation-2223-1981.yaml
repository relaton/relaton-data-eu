  content: Commission Regulation (EEC) No 2223/81 of 31 July 1981 temporarily suspending
    certain provisions of Regulation (EEC) No 2042/75 on special detailed rules for
    the application of the system of import and export licences for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2223/81 de la Commission, du 31 juillet 1981, relatif
    à la suspension temporaire de certaines dispositions du règlement (CEE) n°
    2042/75 portant modalités particulières d' application du régime des certificats
    d' importation et d' exportation dans le secteur des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2223/81 der Kommission vom 31. Juli 1981 zur vorübergehenden
    Aussetzung einiger Bestimmungen der Verordnung (EWG) Nr. 2042/75 über besondere
    Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen für Getreide und
    Reis
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2223/81 af 31. juli 1981 om suspension
