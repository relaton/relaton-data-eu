---
id: EUDecision20162359
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/2359 of 20 December 2016 determining
    that the temporary suspension of the preferential customs duty established under
    the stabilisation mechanism for bananas of the Agreement establishing an Association
    between the European Union and its Member States, on the one hand, and Central
    America on the other, is not appropriate for imports of bananas originating in
    Nicaragua for the year 2016
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/2359 de la Commission du 20 décembre
    2016 déterminant que la suspension temporaire du droit de douane préférentiel
    établi au titre du mécanisme de stabilisation pour les bananes prévu par l'accord
    établissant une association entre l'Union européenne et ses États membres,
    d'une part, et l'Amérique centrale, d'autre part, n'est pas appropriée dans
    le cas des importations de bananes originaires du Nicaragua pour l'année 2016
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/2359 der Kommission vom 20. Dezember
    2016 zur Feststellung, dass die vorübergehende Aussetzung des Präferenzzolls,
    der im Rahmen des Stabilisierungsmechanismus für Bananen des Abkommens zur Gründung
    einer Assoziation zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits
    und Zentralamerika andererseits festgesetzt wurde, für Einfuhren von Bananen
    mit Ursprung in Nicaragua für das Jahr 2016 nicht angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/2359 на Комисията
    от 20 декември 2016 година за определяне на временното
    спиране на прилагането на преференциалното
    мито, въведено по силата на механизма за стабилизиране
    по отношение на бананите от Споразумението
    за асоцииране между Европейския съюз и неговите
    държави членки, от една страна, и Централна
    Америка, от друга страна, за нецелесъобразно
    по отношение на вноса на банани с произход
    от Никарагуа за 2016 година
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/2359 ze dne 20. prosince 2016,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby podle
    mechanismu stabilizace pro banány Dohody zakládající přidružení mezi Evropskou
    unií a jejími členskými státy na jedné straně a Střední Amerikou na straně
    druhé není pro dovoz banánů pocházejících z Nikaraguy pro rok 2016 vhodné
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/2359 af 20. december
    2016 om fastsættelse af, at den midlertidige suspension af den præferencetold,
    som er fastsat under stabiliseringsmekanismen for bananer i aftalen om oprettelse
    af en associering mellem Den Europæiske Union og dens medlemsstater på den ene
    side og Mellemamerika på den anden side, ikke er hensigtsmæssig for importen
    af bananer med oprindelse i Nicaragua for 2016
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/2359 της Επιτροπής,
    της 20ής Δεκεμβρίου 2016, με την οποία ορίζεται
    ότι η προσωρινή αναστολή του προτιμησιακού
    δασμού που θεσπίστηκε βάσει του μηχανισμού
    σταθεροποίησης για τις μπανάνες στο πλαίσιο
    της συμφωνίας σύνδεσης μεταξύ της Ευρωπαϊκής
    Ένωσης και των κρατών μελών της, αφενός, και
    της Κεντρικής Αμερικής, αφετέρου, δεν κρίνεται
    σκόπιμη για τις εισαγωγές μπανανών καταγωγής
    Νικαράγουας για το έτος 2016
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/2359, 20. detsember 2016, millega määratakse
    kindlaks, et ühelt poolt Euroopa Liidu ja selle liikmesriikide ning teiselt poolt
    Kesk-Ameerika riikide vahelise assotsiatsiooni loomise lepingu banaane käsitlevas
    stabiilsusmehhanismis kehtestatud soodustollimaksu ajutine peatamine ei ole Nicaraguast
    pärit banaanide impordi suhtes aastal 2016 asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/2359, annettu 20 päivänä
    joulukuuta 2016, sen määrittämisestä, että Euroopan unionin ja sen jäsenvaltioiden
    sekä Keski-Amerikan välisestä assosiaatiosta tehdyn sopimuksen sisältämän
    banaaneja koskevan vakautusmekanismin mukaisen etuustullin väliaikainen suspendoiminen
    ei ole tarpeen Nicaraguasta peräisin olevien banaanien tuonnissa vuonna 2016
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/2359 оd 20. prosinca 2016. kojom
    se utvrđuje da privremena obustava povlaštenih carina utvrđenih na temelju
    mehanizma stabilizacije za banane iz Sporazuma o pridruživanju između Europske
    unije i njezinih država članica, s jedne strane, i Središnje Amerike, s druge
    strane, nije primjerena za uvoz banana podrijetlom iz Nikaragve za 2016.
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/2359 végrehajtási határozata (2016. december
    20.) a Nicaraguából származó banán behozatalára alkalmazott kedvezményes
    vámtételeknek az egyrészről az Európai Unió és tagállamai, másrészről
    Közép-Amerika közötti társulás létrehozásáról szóló megállapodásban
    foglalt banánkereskedelmi stabilizációs mechanizmus keretében történő,
    2016. évi ideiglenes felfüggesztése nem helyénvaló voltának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/2359 della Commissione, del 20 dicembre
    2016, che stabilisce che la sospensione temporanea del dazio doganale preferenziale
    istituito nel quadro del meccanismo di stabilizzazione per le banane previsto
    dall'accordo che istituisce un'associazione tra l'Unione europea e i suoi Stati
    membri, da una parte, e l'America centrale, dall'altra, non è appropriata per
    quanto riguarda le importazioni di banane originarie del Nicaragua per l'anno
    2016
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/2359 (2016. gada 20. decembris),
    ar ko nosaka, ka tā atvieglotā muitas nodokļa pagaidu atcelšana, kurš noteikts
    saskaņā ar stabilizācijas mehānismu banāniem Nolīgumā, ar ko izveido asociāciju
    starp Eiropas Savienību un tās dalībvalstīm, no vienas puses, un Centrālameriku,
    no otras puses, attiecībā uz Nikaragvas izcelsmes banānu importu 2016. gadā
    nav atbilstīga
  type: main
- language: lt
  script: Latn
  content: 2016 m. gruodžio 20 d. Komisijos įgyvendinimo sprendimas (ES) 2016/2359,
    kuriuo nustatoma, kad pagal Susitarimo, kuriuo steigiama Europos Sąjungos bei
    jos valstybių narių ir Centrinės Amerikos asociacija, bananų importo stabilizavimo
    priemonę nustatyto lengvatinio muito laikinas taikymo importuojamiems Nikaragvos
    kilmės bananams nutraukimas 2016 m. yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/2359 tal-20
    ta' Diċembru 2016 li tiddetermina li s-sospensjoni temporanja tad-dazju doganali
    preferenzjali stabbilita skont il-mekkaniżmu ta' stabbilizzazzjoni għall-banana
    tal-Ftehim ta' Assoċjazzjoni bejn l-Unjoni Ewropea u l-Istati Membri tagħha,
    minn naħa, u l-Amerika Ċentrali, min-naħa l-oħra, mhix xierqa għall-importazzjonijiet
    tal-banana li toriġina min-Nikaragwa għas-sena 2016
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/2359 van de Commissie van 20 december 2016
    waarbij wordt bepaald dat de tijdelijke opschorting van het preferentiële douanerecht
    dat is vastgesteld in het kader van het stabilisatiemechanisme voor bananen in
    de Overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese
    Unie en haar lidstaten, enerzijds, en Midden-Amerika, anderzijds, niet passend
    is voor de invoer van bananen van oorsprong uit Nicaragua voor het jaar 2016
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/2359 z dnia 20 grudnia 2016 r. w sprawie
    ustalenia, że tymczasowe zawieszenie preferencyjnego cła ustanowionego w ramach
    mechanizmu stabilizacyjnego dotyczącego bananów, zawartego w Umowie ustanawiającej
    stowarzyszenie między Unią Europejską i jej państwami członkowskimi, z jednej
    strony, a Ameryką Środkową, z drugiej strony, nie jest odpowiednie dla przywozu
    w 2016 r. bananów pochodzących z Nikaragui
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/2359 da Comissão, de 20 de dezembro de
    2016, que determina que a suspensão temporária do direito aduaneiro preferencial
    estabelecido ao abrigo do mecanismo de estabilização para as bananas do Acordo
    que cria uma Associação entre a União Europeia e os seus Estados-Membros, por
    um lado, e a América Central, por outro lado, não é adequada para as importações
    de bananas originárias da Nicarágua no ano de 2016
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/2359 a Comisiei din 20 decembrie
    2016 de stabilire a faptului că suspendarea temporară a taxei vamale preferențiale
    instituite în temeiul mecanismului de stabilizare pentru banane prevăzut de
    Acordul de instituire a unei asocieri între Uniunea Europeană și statele membre
    ale acesteia, pe de o parte, și America Centrală, pe de altă parte, nu este
    adecvată pentru importurile de banane originare din Nicaragua pentru anul 2016
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/2359 z 20. decembra 2016, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla stanoveného na základe
    stabilizačného mechanizmu pre banány v rámci Dohody, ktorou sa zakladá pridruženie
    medzi Európskou úniou a jej členskými štátmi na jednej strane a Strednou
    Amerikou na strane druhej, nie je vhodné pre dovoz banánov s pôvodom v Nikarague
    za rok 2016
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/2359 z dne 20. decembra 2016 o ugotovitvi,
    da začasna opustitev preferencialnih carin, vzpostavljenih v okviru stabilizacijskega
    mehanizma za banane iz Sporazuma o pridružitvi med Evropsko unijo in njenimi
    državami članicami na eni strani ter Srednjo Ameriko na drugi strani, za uvoz
    banan s poreklom iz Nikaragve za leto 2016 ni primerna
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/2359 de la Comisión, de 20 de diciembre
    de 2016, por la que se determina que la suspensión temporal del arancel aduanero
    preferencial establecido en el marco del mecanismo de estabilización para el
    banano del Acuerdo por el que se establece una asociación entre la Unión Europea
    y sus Estados miembros, por una parte, y Centroamérica, por otra, no es apropiada
    para las importaciones de plátanos originarios de Nicaragua para el año 2016
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/2359 av den 20 december 2016
    om fastställande av att det tillfälliga upphävandet av förmånstullarna enligt
    stabiliseringsmekanismen för bananer i avtalet om upprättande av en associering
    mellan Europeiska unionen och dess medlemsstater, å ena sidan, och Centralamerika,
    å andra sidan, inte är lämpligt för import av bananer med ursprung i Nicaragua
    under 2016
  type: main
