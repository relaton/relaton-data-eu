title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1983/95 of 24 July 1995 opening and providing
    for the administration of Community tariff quotas and ceilings and established
    Community surveillance for certain fish and fishery products originating in the
    Faroe Islands and establishing the detailed provisions for amending and adapting
    these quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1983/95 du Conseil, du 24 juillet 1995, portant ouverture
    et mode de gestion de contingents et de plafonds tarifaires communautaires, établissant
    une surveillance communautaire pour certains poissons et produits de la pêche
    originaires des îles Féroé et définissant certaines modalités d'amendement
    et d'adaptation desdits contingents
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1983/95 des Rates vom 24. Juli 1995 zur Eröffnung
    und Verwaltung von Gemeinschaftszollkontingenten und -plafonds und zur Einrichtung
    einer gemeinschaftlichen Überwachung für bestimmte Fische und Fischereierzeugnisse
    mit Ursprung in den Färöern sowie zur Einführung eines Verfahrens für die
    Verlängerung und Anpassung dieser Zollkontingente
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1983/95 af 24. juli 1995 om åbning og forvaltning
    af fællesskabstoldkontingenter og -lofter, om fastsættelse af et fællesskabstilsyn
    for visse fisk og fiskerivarer med oprindelse på Færøerne og om fastlæggelse
    af visse regler for ændring og tilpasning af nævnte kontingenter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1983/95 του Συμβουλίου
    της 24ης Ιουλίου 1995 για το άνοιγμα και τη διαχείριση
    κοινοτικών δασμολογικών ποσοστώσεων και οροφών,
    την εισαγωγή κοινοτικής επιτήρησης για ορισμένα
    ψάρια και αλιευτικά προϊόντα καταγωγής Φερόων
    νήσων και τον καθορισμό της μεθόδου τροποποίησης
    και προσαρμογής των εν λόγω ποσοστώσεων
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1983/95, annettu 24 päivänä heinäkuuta 1995,
    yhteisön tariffikiintiöiden ja tariffikattojen avaamisesta ja hoidosta, yhteisön
    valvonnan järjestämisestä tietyille Färsaarilta peräisin oleville kaloille
    ja kalastustuotteille sekä yksityiskohtaisten sääntöjen määrittelemisestä
    näiden kiintiöiden muuttamiseksi ja mukauttamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1983/95 del Consiglio, del 24 luglio 1995, che reca
    apertura o modalità di gestione di contingenti e massimali tariffari comunitari,
    che stabilisce una sorveglianza comunitaria per taluni pesci e prodotti della
    pesca originari delle isole Færøer e che definisce le modalità di rettifica
    e di adattamento dei suddetti contingenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1983/95 van de Raad van 24 juli 1995 betreffende de
    opening en de wijze van beheer van communautaire tariefcontingenten en -plafonds,
    de instelling van een communautair toezicht voor bepaalde vissen en visserijprodukten
    van oorsprong uit de Faeröer en de vaststelling van bepaalde modaliteiten voor
    de wijziging of aanpassing van die contingenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1983/95 do Conselho, de 24 de Julho de 1995, relativo
    à abertura e modo de gestão de contingentes e limites máximos pautais comunitários,
    ao estabelecimento de uma vigilância comunitária para certos peixes e produtos
    de pesca originários das ilhas Faroé e à definição de determinadas regras
    de correcção e de adaptação dos referidos contingentes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1983/95 del Consejo, de 24 de julio de 1995, relativo
    a la apertura y modo de gestión de contingentes y límites máximos arancelarios
    comunitarios y por el que se establece una vigilancia comunitaria para determinados
    pescados y productos de la pesca originarios de las islas Feroe, y a la definición
    de las modalidades de corrección o adaptación de los citados contingentes
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1983/95 av den 24 juli 1995 om öppnande av
    förvaltningsförfarande rörande gemenskapens tullkvoter och tulltak och upprättande
    av en gemenskapsövervakning för vissa fiskar och vissa fiskeriprodukter från
