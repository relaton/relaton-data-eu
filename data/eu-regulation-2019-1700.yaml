    лицата и домакинствата, основана на индивидуални
    данни, събрани чрез извадки, за изменение на
    регламенти (EО) № 808/2004, (EО) № 452/2008 и (EО) № 1338/2008
    на Европейския парламент и на Съвета, и за отмяна
    на Регламент (EО) № 1177/2003 на Европейския парламент
    и на Съвета и на Регламент (EО) № 577/98 на Съвета
  type: main
