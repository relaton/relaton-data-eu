    referitoare la persoane și gospodării, bazate pe datele la nivel individual
    colectate din eșantioane, de modificare a Regulamentelor (CE) nr. 808/2004, (CE)
    nr. 452/2008 și (CE) nr. 1338/2008 ale Parlamentului European și ale Consiliului
