  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2019/1700 ze dne 10. října
    2019, kterým se zavádí společný rámec pro evropské statistiky týkající
    se osob a domácnostízaložené na individuálních údajích sbíraných na
