title:
- language: en
  script: Latn
  content: Regulation (EU) 2019/1700 of the European Parliament and of the Council
    of 10 October 2019 establishing a common framework for European statistics relating
    to persons and households, based on data at individual level collected from samples,
    amending Regulations (EC) No 808/2004, (EC) No 452/2008 and (EC) No 1338/2008
    of the European Parliament and of the Council, and repealing Regulation (EC) No
    1177/2003 of the European Parliament and of the Council and Council Regulation
    (EC) No 577/98
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2019/1700 du Parlement européen et du Conseil du 10 octobre
    2019 établissant un cadre commun pour des statistiques européennes relatives
    aux personnes et aux ménages fondées sur des données au niveau individuel collectées
    à partir d’échantillons, modifiant les règlements (CE) no 808/2004, (CE)
    no 452/2008 et (CE) no 1338/2008 du Parlement européen et du Conseil, et abrogeant
    le règlement (CE) no 1177/2003 du Parlement européen et du Conseil et le règlement
    (CE) no 577/98 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2019/17001700 des Europäischen Parlaments und des Rates
    vom 10. Oktober 2019 zur Schaffung eines gemeinsamen Rahmens für europäische
    Statistiken über Personen und Haushalte auf der Grundlage von Einzeldaten aus
    Stichprobenerhebungen, zur Änderung der Verordnungen (EG) Nr. 808/2004, (EG)
    Nr. 452/2008 und (EG) Nr. 1338/2008 des Europäischen Parlaments und des Rates
    sowie zur Aufhebung der Verordnung (EG) Nr. 1177/2003 des Europäischen Parlaments
    und des Rates und der Verordnung (EG) Nr. 577/98 des Rates
  type: main
- language: bg
