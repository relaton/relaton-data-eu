  script: Latn
  content: '79/15/EEC: Commission Decision of 29 November 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven fabrics of cotton and woven fabrics of man-made
    fibres (discontinuous or waste), falling within heading No 55.09 or subheading
    56.07 A of the Common Customs Tariff (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11,
    12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53,
    54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77,
    78, 81, 82, 83, 84, 86, 87, 92, 93, 97; 56.07-01, 04, 05, 07, 08, 11, 13, 14,
    16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36), originating in Thailand and
    in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/15/CEE: Décision de la Commission, du 29 novembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les tissus de coton et les tissus de fibres
    textiles synthétiques ou artificielles discontinues de la position 55.09 et de
    la sous-position 56.07 A du tarif douanier commun (codes Nimexe: 55.09- 01, 02,
    03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41,
    49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72,
    73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97; 56.07-01, 04, 05, 07,
    08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36), originaires
    de la Thaïlande et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/15/EWG: Entscheidung der Kommission vom 29. November 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Thailand stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus Baumwolle und Gewebe aus synthetischen
    oder künstlichen Spinnfasern der Tarifnummern 55.09 und 56.07 A des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern: 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15,
    16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57,
    59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83,
    84, 86, 87, 92, 93, 97; 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21,
    23, 24, 26, 27, 28, 32, 33, 34, 36) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/15/EØF: Kommissionens beslutning af 29. november 1978 om bemyndigelse
