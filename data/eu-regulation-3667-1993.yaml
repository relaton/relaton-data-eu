    Regulamentos (CEE) nº 3831/90, (CEE) nº 3832/90, (CEE) nº 3833/90, (CEE) nº
    3834/90, (CEE) nº 3835/90 e (CEE) nº 3900/91, relativos à aplicação de preferências
    pautais generalizadas para o ano de 1991 a certos produtos originários de países
    em desenvolvimento e que completam a lista dos beneficiários destas preferências
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3667/93 DEL CONSEJO de 20 de diciembre de 1993 que
    completa el Reglamento (CEE) nº 3917/92 por el que se prorroga en 1993 la aplicación
    de los Reglamentos (CEE) nos 3831/90, 3832/90, 3833/90, 3834/90, 3835/90 y 3900/91
    relativos a la aplicación de preferencias arancelarias generalizadas para el
    año 1991 a determinados productos originarios de los países en desarrollo, y
    por el que se completa la lista de beneficiarios de esas preferencias
