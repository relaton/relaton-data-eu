  content: COUNCIL REGULATION (EC) No 3667/93 of 20 December 1993 supplementing Regulation
    (EEC) No 3917/92 extending into 1993 the application of Regulations (ECC) No 3831/90,
    (EEC) No 3832/90, (EEC) No 3833/90, (EEC) No 3834/90, (EEC) No 3835/90 and (EEC)
    No 3900/91 applying generalized tariff preferences for 1991 in respect of certain
    products originating in developing countries and adding to the list of beneficiaries
    of such preferences
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3667/93 du Conseil du 20 décembre 1993 complétant
    le règlement (CEE) n° 3917/92 prorogeant, en 1993, l'application des règlements
    (CEE) n° 3831/90, (CEE) n° 3832/90, (CEE) n 3833/90, (CEE) n 3834/90, (CEE)
    n° 3835/90 et (CEE) n 3900/91 portant application de préférences tarifaires
    généralisées pour l'année 1991 à certains produits originaires de pays en
    développement et complétant la liste des bénéficiaires de ces préférences
  type: main
