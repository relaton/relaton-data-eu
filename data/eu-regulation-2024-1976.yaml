    глутамат с произход от Китайската народна
    република, чрез внос на мононатриев глутамат,
    изпращан от Малайзия, независимо дали е деклариран
    с произход от Малайзия, и за въвеждане на регистрационен
    режим по отношение на този внос
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/1976 ze dne 19. července 2024
    o zahájení šetření možného obcházení antidumpingových opatření uložených
    prováděcím nařízením (EU) 2021/633 na dovoz glutamátu sodného pocházejícího
    z Čínské lidové republiky dovozem glutamátu sodného zasílaného z Malajsie
    bez ohledu na to, zda je u něj deklarován původ z Malajsie, a o zavedení celní
    evidence tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/1976 af 19. juli 2024
