title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1976 of 19 July 2024 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2021/633 on imports of monosodium glutamate
    originating in the People’s Republic of China by imports of monosodium glutamate
    consigned from Malaysia, whether declared as originating in Malaysia or not, and
    making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1976 de la Commission du 19 juillet
    2024 portant ouverture d’une enquête relative à un éventuel contournement
    des mesures antidumping instituées par le règlement d’exécution (UE) 2021/633
    sur les importations de glutamate monosodique originaire de la République populaire
    de Chine par des importations de glutamate monosodique expédié de Malaisie,
    qu’il ait ou non été déclaré originaire de Malaisie, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1976 der Kommission vom 19. Juli 2024
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2021/633 eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren von Mononatriumglutamat mit Ursprung in der Volksrepublik
    China durch aus Malaysia versandte Einfuhren von Mononatriumglutamat, ob als Ursprungserzeugnisse
    Malaysias angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/1976 на Комисията
