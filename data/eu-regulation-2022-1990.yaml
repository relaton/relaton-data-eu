type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1990 of 20 October 2022 cancelling
    the approval of tolylfluanid as an active substance for use in biocidal products
    of product-type 7 in accordance with Regulation (EU) No 528/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1990 de la Commission du 20 octobre
    2022 annulant l’approbation du tolylfluanide en tant que substance active destinée
    à être utilisée dans les produits biocides relevant du type de produits 7 conformément
    au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1990 der Kommission vom 20. Oktober
    2022 zur Annullierung der Genehmigung von Tolylfluanid als Wirkstoff zur Verwendung
    in Biozidprodukten der Produktart 7 gemäß der Verordnung (EU) Nr. 528/2012 des
    Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1990 на Комисията
    от 20 октомври 2022 година за отмяна на одобрението
    на толилфлуанид като активно вещество за употреба
    в биоциди от продуктов тип 7 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1990 ze dne 20. října 2022,
    kterým se v souladu s nařízením Evropského parlamentu a Radu (EU) č. 528/2012
    ruší schválení tolylfluanidu jako účinné látky pro použití v biocidních
    přípravcích typu 7
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1990 af 20. oktober 2022
    om tilbagekaldelse af godkendelsen af tolylfluanid som et aktivstof til anvendelse
    i biocidholdige produkter af produkttype 7, jf. Europa-Parlamentets og Rådets
    forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1990 της Επιτροπής
    της 20ής Οκτωβρίου 2022 για την ακύρωση της έγκρισης
    της ουσίας tolylfluanid ως δραστικής ουσίας για χρήση
    σε βιοκτόνα του τύπου προϊόντων 7 σύμφωνα με
    τον κανονισμό (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1990, 20. oktoober 2022, millega tühistatakse
    tooteliiki 7 kuuluvates biotsiidides tolüülfluaniidi toimeainena kasutamise
    heakskiitmise otsus vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL)
    nr 528/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1990, annettu 20 päivänä
    lokakuuta 2022, tolyylifluanidin Euroopan parlamentin ja neuvoston asetuksen (EU)
    N:o 528/2012 mukaista käyttöä tehoaineena valmisteryhmän 7 biosidivalmisteissa
    koskevan hyväksymisen peruuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1990 ón gCoimisiún an 20 Deireadh
    Fómhair 2022 lena gcealaítear formheas toiliolfluainíde mar shubstaint ghníomhach
    lena húsáid i dtáirgí bithicídeacha de chineál táirge 7 i gcomhréir le
    Rialachán (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1990 оd 20. listopada 2022. o ukidanju
    odobrenja tolilfluanida kao aktivne tvari za uporabu u biocidnim proizvodima vrste
    7 u skladu s Uredbom (EU) br. 528/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1990 végrehajtási rendelete (2022. október 20.)
    a tolilfluanid 7. terméktípusba tartozó biocid termékekben az 528/2012/EU
    európai parlamenti és tanácsi rendelet szerint felhasználható hatóanyagként
    történő jóváhagyásának törléséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1990 della Commissione del 20 ottobre
    2022 che revoca l’approvazione del tolilfluanide come principio attivo destinato
    a essere utilizzato nei biocidi del tipo di prodotto 7 a norma del regolamento
    (UE) n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1990 (2022. gada 20. oktobris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 528/2012 atceļ
    tolilfluanīda kā 7. produkta veida biocīdos lietojamas aktīvās vielas apstiprinājumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1990 2022 m. spalio 20 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 528/2012 panaikinamas
    tolilfluanido kaip veikliosios medžiagos, skirtos 7-o tipo biocidiniams produktams
    gaminti, patvirtinimo galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1990 tal-20
    ta’ Ottubru 2022 li jikkanċella l-approvazzjoni tat-tolilfluwanid bħala sustanza
    attiva għall-użu fil-prodotti bijoċidali għat-tip ta’ prodott 7 f’konformità
    mar-Regolament (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1990 van de Commissie van 20 oktober 2022
    tot intrekking van de goedkeuring van tolylfluanide als werkzame stof voor gebruik
    in biociden van productsoort 7 overeenkomstig Verordening (EU) nr. 528/2012 van
    het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1990 z dnia 20 października
    2022 r. unieważniające zatwierdzenie tolilfluanidu jako substancji czynnej do
    stosowania w produktach biobójczych należących do grupy produktowej 7 zgodnie
    z rozporządzeniem Parlamentu Europejskiego i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1990 da Comissão de 20 de outubro
    de 2022 que anula a aprovação da tolilfluanida como substância ativa para utilização
    em produtos biocidas do tipo 7, em conformidade com o Regulamento (UE) n.o 528/2012
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1990 al Comisiei din 20 octombrie
    2022 de anulare a aprobării substanței tolilfluanid ca substanță activă destinată
    utilizării în produsele biocide aparținând tipului de produse 7 în conformitate
    cu Regulamentul (UE) nr. 528/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1990 z 20. októbra 2022, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (EÚ) č. 528/2012 ruší
    schválenie tolylfluanidu ako účinnej látky na používanie v biocídnych výrobkoch
    typu 7
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1990 z dne 20. oktobra 2022 o preklicu
    odobritve tolilfluanida kot aktivne snovi za uporabo v biocidnih proizvodih vrste
    proizvodov 7 v skladu z Uredbo (EU) št. 528/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1990 de la Comisión de 20 de octubre
    de 2022 por el que se cancela la aprobación del uso de la tolilfluanida como
    sustancia activa en biocidas del tipo de producto 7 de conformidad con el Reglamento
    (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1990 av den 20 oktober
    2022 om upphävande av godkännandet av tolylfluanid som verksamt ämne för användning
    i biocidprodukter i produkttyp 7 i enlighet med Europaparlamentets och rådets
    förordning (EU) nr 528/2012
