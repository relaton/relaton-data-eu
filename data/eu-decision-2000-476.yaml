title:
- language: en
  script: Latn
  content: '2000/476/EC: Commission Decision of 17 July 2000 authorising Member States
    to permit temporarily the marketing of seed of certain species not satisfying
    the requirements of Council Directive 66/401/EEC (notified under document number
    C(2000) 1782)'
  type: main
- language: fr
  script: Latn
  content: '2000/476/CE: Décision de la Commission du 17 juillet 2000 autorisant
    les États membres à admettre temporairement la commercialisation de semences
    de certaines espèces ne satisfaisant pas aux exigences de la directive 66/401/CEE
    du Conseil [notifiée sous le numéro C(2000) 1782]'
  type: main
- language: de
  script: Latn
  content: '2000/476/EG: Entscheidung der Kommission vom 17. Juli 2000 zur Ermächtigung
    der Mitgliedstaaten, bestimmtes, den Anforderungen der Richtlinie 66/401/EWG des
