    hozatalának engedélyezése tekintetében a tagállamok felhatalmazásáról
    (az értesítés a C(2000) 1782. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2000/476/CE: Decisione della Commissione, del 17 luglio 2000, che autorizza
