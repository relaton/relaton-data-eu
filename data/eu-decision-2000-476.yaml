    der ikke opfylder kravene i Rådets direktiv 66/401/EØF (meddelt under nummer
    K(2000) 1782)'
  type: main
- language: el
  script: Grek
  content: '2000/476/ΕΚ: Απόφαση της Επιτροπής, της 17ης
    Ιουλίου 2000, με την οποία εξουσιοδοτούνται τα
    κράτη μέλη να επιτρέψουν προσωρινά την εμπορία
    σπόρων προς σπορά ορισμένων ειδών που δεν πληρούν
    τις απαιτήσεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό Ε(2000) 1782]'
  type: main
- language: et
