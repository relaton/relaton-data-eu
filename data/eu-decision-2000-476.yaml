    seemneid (teatavaks tehtud numbri K(2000) 1782 all)
  type: main
- language: fi
  script: Latn
  content: '2000/476/EY: Komission päätös, tehty 17 päivänä heinäkuuta 2000,
    luvan antamisesta jäsenvaltioille sallia tilapäisesti tiettyjen sellaisten lajien
    siementen pitäminen kaupan, jotka eivät täytä neuvoston direktiivin 66/401/ETY
    vaatimuksia (tiedoksiannettu numerolla K(2000) 1782)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2000. július 17.) az egyes fajok a 66/401/EK
