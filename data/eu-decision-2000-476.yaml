    unter Aktenzeichen K(2000) 1782)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 17. července 2000, kterým se členské státy
    opravňují dočasně povolit uvádění osiva některých druhů nesplňujícího
    požadavky směrnice Rady 66/401/EHS na trh (oznámeno pod číslem K(2000) 1782)
  type: main
- language: da
  script: Latn
  content: '2000/476/EF: Kommissionens beslutning af 17. juli 2000 om bemyndigelse
