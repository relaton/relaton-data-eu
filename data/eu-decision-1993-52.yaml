title:
- language: en
  script: Latn
  content: '93/52/EEC: Commission Decision of 21 December 1992 recording the compliance
    by certain Member States or regions with the requirements relating to brucellosis
    (B. melitensis) and according them the status of a Member State or region officially
    free of the disease'
  type: main
- language: fr
  script: Latn
  content: '93/52/CEE: Décision de la Commission, du 21 décembre 1992, constatant
    le respect par certains États membres ou régions des conditions relatives à
    la brucellose (Br. melitensis) et leur reconnaissant le statut d''État membre
    ou de région officiellement indemne de cette maladie'
  type: main
- language: de
  script: Latn
  content: '93/52/EWG: Entscheidung der Kommission vom 21. Dezember 1992 zur Feststellung,
    daß bestimmte Mitgliedstaaten oder Gebiete die Bedingungen betreffend die Brucellose
    (Br. melitensis) eingehalten haben, und zur Anerkennung dieser Mitgliedstaaten
    oder Gebiete als amtlich brucellosefrei'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 21 декември 1992 година
    за установяване на спазването от някои държави-членки
    или региони на изискванията относно бруцелозата
    (B. melitensis) и признаването им на статут на държава-членка
    или на регион, официално свободни от тази болест
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 21. prosince 1992, kterým se shledává, že
    některé členské státy nebo oblasti splňují podmínky týkající se brucelózy
    (B. melitensis), a přiznává se jim status členského státu nebo oblasti úředně
    prostých této choroby
  type: main
- language: da
  script: Latn
  content: '93/52/EØF: Kommissionens beslutning af 21. december 1992 om konstatering
    af at bestemte medlemsstater eller regioner overholder betingelserne for brucellose
    (B. melitensis), og om anerkendelse af deres status som medlemsstat eller region,
    der er officielt fri for denne sygdom'
  type: main
- language: el
  script: Grek
  content: '93/52/ΕΟΚ: Απόφαση της Επιτροπής της 21ης Δεκεμβρίου
    1992 που διαπιστώνει την τήρηση εκ μέρους ορισμένων
    κρατών μελών ή περιοχών των όρων σχετικά με
    τη βρουκέλλωση (Br. melitensis) και που τους αναγνωρίζει
    το καθεστώς κράτους μέλους ή περιοχής επίσημα
    απαλλαγμένης από την ασθένεια αυτή'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 21. detsember 1992, milles registreeritakse teatavate
    liikmesriikide või piirkondade vastavus nõuetele seoses brutselloosiga (B. melitensis)
    ja antakse neile ametlikult haigusvaba liikmesriigi või piirkonna staatus
  type: main
- language: fi
  script: Latn
  content: '93/52/ETY: Komission päätös, tehty 21 päivänä joulukuuta 1992, luomistautia
    (Br. melitensis) koskevien edellytysten täyttämisen toteamisesta tietyissä
    jäsenvaltioissa ja tietyillä alueilla ja näille jäsenvaltioille ja alueille
    tästä taudista virallisesti vapaan jäsenvaltion tai alueen aseman vahvistamisesta'
  type: main
- language: hr
  script: Latn
  content: '93/52/EEZ: Odluka Komisije od 21. prosinca 1992. o utvrđivanju sukladnosti
    određenih država članica ili regija zahtjevima u pogledu bruceloze (B. melitensis)
    i o statusu države članice ili regije službeno slobodne od te bolesti'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1992. december 21.) egyes tagállamok vagy régiók
    brucellózisra (B. melitensis) vonatkozó követelményeknek való megfelelősége
    rögzítéséről és hivatalosan brucellózismentes tagállammá, illetve régióvá
    nyilvánításáról
  type: main
- language: it
  script: Latn
  content: '93/52/CEE: Decisione della Commissione, del 21 dicembre 1992, che constata
    il rispetto da parte di taluni Stati membri o regioni delle condizioni relative
    alla brucellosi (B. melitensis) e riconosce loro la qualifica di Stato membro
    o regione ufficialmente indenne da tale malattia'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1992. gada 21. decembris), ar ko nosaka dažu dalībvalstu
    vai reģionu atbilstību prasībām attiecībā uz brucelozi (B. melitensis) un
    saskaņā ar šīm prasībām piešķir tām tādas dalībvalsts vai reģiona
    statusu, kas ir oficiāli brīvi no šīs slimības
  type: main
- language: lt
  script: Latn
  content: 1992 m. gruodžio 21 d. Komisijos sprendimas, nustatantis, kad tam tikros
    valstybės narės arba regionai atitinka reikalavimus dėl bruceliozės (B. melitensis)
    ir toms valstybėms narėms arba regionams suteikiantis oficialiai bruceliozės
    neapimtos valstybės narės arba regiono statusą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-21 Diċembru 1992, li tieħu nota tal-konformità
    ta’ ċerti Stati Membri jew reġjuni mal-kundizzjonijiet li jirrigwardaw il-bruċellosi
    (B.melitensis) u li tagħtihom l-istatus ta’ Stat Membru jew reġjun uffiċjalment
    ħieles mill-marda
  type: main
- language: nl
  script: Latn
  content: '93/52/EEG: Beschikking van de Commissie van 21 december 1992 houdende
    constatering dat bepaalde Lid-Staten of gebieden aan de voorwaarden voldoen om
    te worden erkend als officieel brucellosevrij (Br. melitensis)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 21 grudnia 1992 r. stwierdzająca stosowanie się
    Państw Członkowskich lub regionów do wymagań odnoszących się do brucelozy
    (B. melitensis) i przyznająca im status oficjalnie wolnych od choroby
  type: main
- language: pt
  script: Latn
  content: '93/52/CEE: Decisão da Comissão, de 21 de Dezembro de 1992, que reconhece
    que certos Estados-membros ou regiões respeitam as condições relativas à brucelose
    (B. melitensis) e que lhes reconhece o estatuto de Estado- membro ou região oficialmente
    indemne desta doença'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 21 decembrie 1992 privind constatarea, în anumite
    state membre sau regiuni, a respectării normelor referitoare la bruceloză (Brucella
    melitensis) și recunoașterea oficială, pentru aceste teritorii, a statutului
    de stat membru indemn sau de regiune indemnă
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 21. decembra 1992, ktorým sa zaznamenáva dosiahnutie
    súladu niektorých členských štátov alebo oblastí s požiadavkami vzťahujúcimi
    sa na brucelózu (B. melitensis) a priznáva sa im štatút úradne uznaného
    členského štátu alebo oblasti bez výskytu tejto choroby
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 21. decembra 1992 o ugotovitvi skladnosti nekaterih
    držav članic ali regij z zahtevami glede bruceloze (B. melitensis) in o priznanju
    statusa države članice ali regije, uradno proste te bolezni
  type: main
- language: es
  script: Latn
  content: '93/52/CEE: Decisión de la Comisión, de 21 de diciembre de 1992, por
    la que se reconoce que determinados Estados miembros o regiones cumplen las condiciones
    referentes a la brucelosis (Brucella melitensis) y se les concede la calificación
    de Estados miembros o regiones oficialmente indemnes de esta enfermedad'
  type: main
- language: sv
  script: Latn
  content: '93/52/EEG: Kommissionens beslut av den 21 december 1992 om fastställande
    av att vissa medlemsstater eller regioner iakttar kraven i fråga om brucellos
    (Br. melitensis) och erkännande av deras status som medlemsstat eller region
    som är officiellt fri från denna sjukdom'
