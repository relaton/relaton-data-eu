    2000, asetusten (ETY) N:o 3143/85 ja (EY) N:o 2571/97 nojalla myydyn voin viimeisestä
    varastoonsaapumispäivästä annetun asetuksen (ETY) N:o 1609/88 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1679/2000 della Commissione, del 28 luglio 2000, che
