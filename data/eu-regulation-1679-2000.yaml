title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1679/2000 of 28 July 2000 amending Regulation
    (EEC) No 1609/88 as regards the latest date by which butter must have been taken
    into storage in order to be sold pursuant to Regulations (EEC) No 3143/85 and
    (EC) No 2571/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1679/2000 de la Commission du 28 juillet 2000 modifiant
    le règlement (CEE) n° 1609/88 en ce qui concerne la date limite d'entrée en
    stock du beurre vendu au titre des règlements (CEE) n° 3143/85 et (CE) n° 2571/97
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1679/2000 der Kommission vom 28. Juli 2000 zur Änderung
