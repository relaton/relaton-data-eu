    der gemäß den Verordnungen (EWG) Nr. 3143/85 und (EG) Nr. 2571/97 zu verkaufenden
    Butter
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1679/2000 af 28. juli 2000 om ændring
    af forordning (EØF) nr. 1609/88 for så vidt angår fristen for indlagring af
    smør, der sælges i henhold til forordning (EØF) nr. 3143/85 og (EF) nr. 2571/97
  type: main
- language: el
  script: Grek
