title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No. 36/80 of 7 January 1980 on arrangements
    for imports into the United Kingdom and France respectively of babies' woven garments
    and of women' s, girls' and infants' (other than babies' ) woven and knitted or
    crocheted dresses, originating in Pakistan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 36/80 de la Commission, du 7 janvier 1980, relatif
    au régime applicable aux importations dans le Royaume-Uni et en France respectivement
    de vêtements tissés pour bébés et de robes tissées et de bonneterie, pour
    femmes, fillettes et jeunes enfants (autres que bébés), originaires du Pakistan
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 36/80 der Kommission vom 7. Januar 1980 zur Regelung
    der Einfuhr in das Vereinigte Königreich und nach Frankreich von Säuglingskleidung
    aus Geweben bzw. von Kleidern aus Geweben und aus Gewirken, für Frauen, Mädchen
    und Kleinkinder (ausgenommen Säuglinge), mit Ursprung in Pakistan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 36/80 af 7. januar 1980 om ordningen
    for indførsel i Det forenede Kongerige og Frankrig af henholdsvis vævede beklædningsgenstande
    til spædbørn og vævede kjoler og kjoler af trikotage til kvinder, piger og
    småbørn (bortset fra spædbørn), med oprindelse i Pakistan
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 36/80 della Commissione, del 7 gennaio 1980, relativo
    al regime da applicare alle importazioni nel Regno Unito e in Francia rispettivamente
    d' indumenti tessuti per bambini piccoli (bébés) e di abiti interi tessuti ed
    abiti interi a maglia, per donna, per ragazza e per bambini, ad eccezione dei
    bambini piccoli (bébés), originari del Pakistan
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 36/80 van de Commissie van 7 januari 1980 betreffende
    de regeling van toepassing op de invoer in het Verenigd Koninkrijk en Frankrijk
    van geweven kleding voor baby' s, respectievelijk japonnen voor dames, meisjes
    en kinderen (andere dan die voor baby' s), geweven en van brei- of haakwerk, van
    oorsprong uit Pakistan
  type: main
