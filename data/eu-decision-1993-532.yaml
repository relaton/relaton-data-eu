title:
- language: en
  script: Latn
  content: '93/532/EEC: Commission Decision of 24 September 1993 amending Decision
    91/649/EEC on the establishment of an addendum to the Community support framework
    for Community structural assistance in Spain (Andalusia, Asturias, Castile-Léon,
    Castile-La Mancha, Valencia, Extremadura, Galicia, the Canary Islands, Murcia,
    Ceuta- Melilla) on the improvement of the conditions under which agricultural
    and forest products are processed and marketed (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/532/CEE: Décision de la Commission du 24 septembre 1993 modifiant
    la décision 91/649/CEE concernant l''établissement de l''avenant au cadre communautaire
    d''appui pour les interventions structurelles communautaires en Espagne (l''Andalousie,
    les Asturies, les Canaries, la Castille et León, la Castille-La Manche, la Communauté
    valencienne, l''Estrémadure, la Galice, la Murcie, Ceuta et Melilla) en matière
    d''amélioration des conditions de transformation et de commercialisation des
    produits agricoles et sylvicoles (Le texte en langue espagnole est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '93/532/EWG: ENTSCHEIDUNG DER KOMMISSION vom 24. September 1993 zur Änderung
    der Entscheidung 91/649/EWG über eine Ergänzung eines gemeinschaftlichen Förderkonzepts
    für gemeinschaftliche Strukturinterventionen zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen für land- und forstwirtschaftliche Erzeugnisse in
    Spanien (Andalucía, Asturias, Canarias, Castilla y León, Castilla-La Mancha,
    Comunidad Valenciana, Extremadura, Galicia, Murcia, Ceuta y Melilla) (Nur der
    spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/532/EØF: KOMMISSIONENS BESLUTNING af 24. september 1993 om ændring
