    marco comunitario de apoyo para la ayuda estructural comunitaria a España (Andalucía,
    Asturias, Canarias, Castilla y León, Castilla-La Mancha, Comunidad Valenciana,
    Extremadura, Galicia, Murcia, Ceuta y Melilla) para la mejora de las condiciones
    de transformación y comercialización de los productos agrarios (El texto en
    lengua española es el único auténtico)'
