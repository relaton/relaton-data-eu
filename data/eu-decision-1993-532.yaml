    for EF'' s strukturinterventioner i Spanien (Andalucía, Asturias, Castilla y
    León, Castilla-La Mancha, Comunidad Valenciana, Extremadura, Galicia, Canarias,
    Murcia, Ceuta og Melilla) til forbedring af vilkårene for forarbejdning og afsætning
    af landbrugs- og skovbrugsprodukter (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
