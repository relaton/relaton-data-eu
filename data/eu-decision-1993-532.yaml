    di sostegno per gli interventi strutturali comunitari in Spagna (Andalucía, Asturias,
    Castilla y León, Castilla-La Mancha, Comunidad Valenciana, Extremadura, Galicia,
    Canarias, Murcia, Ceuta y Melilla) in ordine al miglioramento delle condizioni
    di trasformazione e di commercializzazione dei prodotti agricoli e silvicoli (Il
    testo in lingua spagnola è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/532/EEG: BESCHIKKING VAN DE COMMISSIE van 24 september 1993 houdende
