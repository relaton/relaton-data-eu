    Γκαλίσια, Μούρθια, Θέουτα και Μελίλλια) για
    τη βελτίωση των συνθηκών μεταποίησης και εμπορίας
    γεωργικών και δασοκομικών προϊόντων (Το κείμενο
    στην ισπανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/532/CEE: DECISIONE DELLA COMMISSIONE del 24 settembre 1993 che modifica
