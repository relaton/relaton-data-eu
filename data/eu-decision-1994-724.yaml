  script: Latn
  content: '94/724/EC: Commission Decision of 31 October 1994 derogating from the
    definition of the concept of ''originating products'' to take account of the special
    situation of Montserrat with regard to connections and contact elements for wire
    and cables falling within CN code 8536 90 10'
  type: main
- language: fr
  script: Latn
  content: '94/724/CE: Décision de la Commission, du 31 octobre 1994, portant dérogation
