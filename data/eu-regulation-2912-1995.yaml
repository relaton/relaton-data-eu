title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2912/95 of 15 December 1995 laying down certain
    detailed rules for the application of the premium schemes provided for in Council
    Regulation (EEC) No 805/68 on the common organization of the market in beef and
    veal as regards the specific measures applicable in the French overseas departments,
    the Azores and Madeira, and repealing Regulation (EEC) No 231/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2912/95 de la Commission, du 15 décembre 1995, portant
    certaines modalités d'application relatives aux régimes de primes prévus par
    le règlement (CEE) n° 805/68 du Conseil portant organisation commune des marchés
    dans le secteur de la viande bovine en ce qui concerne les mesures spécifiques
    applicables dans les départements français d'outre-mer, des Açores et de Madère,
    et abrogeant le règlement (CEE) n° 231/93
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2912/95 der Kommission vom 15. Dezember 1995 mit Durchführungsbestimmungen
    zu den Prämienregelungen der Verordnung (EWG) Nr. 805/68 des Rates über die
    gemeinsame Marktorganisation für Rindfleisch hinsichtlich der Sondermaßnahmen
    in den französischen überseeischen Departements, auf den Azoren und auf Madeira
    und zur Aufhebung der Verordnung (EWG) Nr. 231/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2912/95 af 15. december 1995 om visse
    gennemførelsesbestemmelser for præmieordningerne i henhold til Rådets forordning
    (EØF) nr. 805/68 om den fælles markedsordning for oksekød, for så vidt angår
    de særlige foranstaltninger, der gælder i de oversøiske franske departementer,
    på Azorerne og på Madeira, og om ophævelse af forordning (EØF) nr. 231/93
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2912/95 της Επιτροπής,
    της 15ης Δεκεμβρίου 1995, περί ορισμένων λεπτομερειών
    εφαρμογής των καθεστώτων πριμοδοτήσεων που
    προβλέπονται από τον κανονισμό (ΕΟΚ) αριθ. 805/68
    του Συμβουλίου περί κοινής οργάνωσης αγοράς
    στον τομέα του βοείου κρέατος σχετικά με ειδικά
    μέτρα που εφαρμόζονται στα γαλλικά υπερπόντια
    διαμερίσματα, στις Αζόρες και τη Μαδέρα και
    περί κατάργησης του κανονισμού (ΕΟΚ) αριθ. 231/93
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2912/95, annettu 15 päivänä joulukuuta 1995,
    naudanliha-alan yhteisestä markkinajärjestelystä annetussa asetuksessa (ETY)
    N:o 805/68 säädetyn palkkiojärjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä Ranskan merentakaisissa departementeissa, Azoreilla ja Madeiralla
    sovellettavien erityistoimenpiteiden osalta ja asetuksen (ETY) N:o 231/93 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2912/95 della Commissione, del 15 dicembre 1995, recante
    modalità d'applicazione relative ai regimi di premio previsti dal regolamento
    (CEE) n. 805/68 del Consiglio relativo all'organizzazione comune dei mercati nel
    settore delle carni bovine in ordine alle misure specifiche applicabili nei dipartimenti
    francesi d'oltremare, nelle Azzorre e a Madera, e recante abrogazione del regolamento
    (CEE) n. 231/93
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2912/95 van de Commissie van 15 december 1995 tot
    vaststelling van een aantal toepassingsbepalingen van de in Verordening (EEG)
    nr. 805/68 houdende een gemeenschappelijke ordening der markten in de sector rundvlees
    vastgestelde premieregelingen wat de specifieke maatregelen voor de Franse overzeese
    departementen, de Azoren en Madeira betreft, en tot intrekking van Verordening
    (EEG) nr. 231/93
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2912/95 da Comissão, de 15 de Dezembro de 1995, que
    estabelece determinadas normas de execução relativas aos regimes de prémio
    previstos pelo Regulamento (CEE) nº 805/68 do Conselho, que estabelece a organização
    comum de mercado no sector de carne de bovino no respeitante às medidas específicas
    aplicáveis nos departamentos franceses ultramarinos, nos Açores e na Madeira,
    e que revoga o Regulamento (CEE) nº 231/93
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2912/95 de la Comisión, de 15 de diciembre de 1995,
    que establece determinadas disposiciones de aplicación relativas a los regímenes
    de primas previstos en el Reglamento (CEE) nº 805/68 del Consejo, por el que
    se establece la organización común de mercados en el sector de la carne de bovino,
    en lo que atañe a las medidas específicas aplicables en los departamentos franceses
    de Ultramar, las Azores y Madeira, y que deroga el Reglamento (CEE) nº 231/93
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2912/95 av den 15 december 1995 om vissa
    tillämpningsföreskrifter för de bidragsordningar som föreskrivs i rådets
    förordning (EEG) nr 805/68 om den gemensamma organisationen av marknaden för
    nötkött vad beträffar de särskilda åtgärderna för de franska utomeuropeiska
    departementen, Azorerna och Madeira och om upphävande av förordning (EEG) nr
    231/93
