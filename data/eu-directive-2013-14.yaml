    2013 , che modifica la direttiva 2003/41/CE, relativa alle attività e alla supervisione
    degli enti pensionistici aziendali o professionali, la direttiva 2009/65/CE, concernente
    il coordinamento delle disposizioni legislative, regolamentari e amministrative
    in materia di taluni organismi d’investimento collettivo in valori mobiliari
    (OICVM), e la direttiva 2011/61/UE, sui gestori di fondi di investimento alternativi,
    per quanto riguarda l’eccessivo affidamento ai rating del credito
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2013/14/ES ( 2013. gada 21. maijs
