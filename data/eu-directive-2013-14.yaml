    en lo que atañe a la dependencia excesiva de las calificaciones crediticias
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2013/14/EU av den 21 maj 2013 om
    ändring av direktiv 2003/41/EG om verksamhet i och tillsyn över tjänstepensionsinstitut,
    direktiv 2009/65/EG om samordning av lagar och andra författningar som avser
