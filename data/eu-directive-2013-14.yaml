    instituțiilor pentru furnizarea de pensii ocupaționale, a Directivei 2009/65/CE
    de coordonare a actelor cu putere de lege și a actelor administrative privind
    organismele de plasament colectiv în valori mobiliare (OPCVM) și a Directivei
    2011/61/UE privind administratorii fondurilor de investiții alternative în ceea
    ce privește încrederea excesivă acordată ratingurilor de credit
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2013/14/EÚ z 21. mája 2013 , ktorou
