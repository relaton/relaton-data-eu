    fondu pārvaldniekiem attiecībā uz pārmērīgu paļaušanos uz kredītreitingiem
  type: main
- language: lt
  script: Latn
  content: 2013 m. gegužės 21 d. Europos Parlamento ir Tarybos direktyva 2013/14/ES,
    kuria iš dalies keičiamos Direktyva 2003/41/EB dėl įstaigų, atsakingų už
    profesinių pensijų skyrimą, veiklos ir priežiūros, Direktyva 2009/65/EB dėl
    įstatymų ir kitų teisės aktų, susijusių su kolektyvinio investavimo į perleidžiamus
    vertybinius popierius subjektais (KIPVPS), derinimo ir Direktyva 2011/61/ES dėl
    alternatyvaus investavimo fondų valdytojų, kiek tai susiję su per dideliu kliovimusi
    kredito reitingais
  type: main
- language: mt
  script: Latn
