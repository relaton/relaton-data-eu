    ta’ istituzzjonijiet għall-provvista ta’ rtirar okkupazzjonali, id-Direttiva
    2009/65/KE dwar il-koordinazzjoni ta’ liġijiet, regolamenti u dispożizzjonijiet
    amministrattivi fir-rigward tal-impriżi ta’ investiment kollettiv f’titoli
    trasferibbli (UCITS) u d-Direttiva 2011/61/UE dwar Maniġers ta’ Fondi ta’
    Investiment Alternattivi fir-rigward tad-dipendenza żejda fuq il-gradazzjonijiet
    tal-kreditu
  type: main
- language: nl
