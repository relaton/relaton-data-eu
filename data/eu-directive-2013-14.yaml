    mirovinsko osiguranje, Direktive 2009/65/EZ o usklađivanju zakona i drugih propisa
    u odnosu na subjekte za zajednička ulaganja u prenosive vrijednosne papire (UCITS)
    i Direktive 2011/61/EU o upraviteljima alternativnih investicijskih fondova u
    odnosu na preveliko oslanjanje na kreditne rejtinge
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2013/14/EU irányelve ( 2013. május
