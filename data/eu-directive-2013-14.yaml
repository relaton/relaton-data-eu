title:
- language: en
  script: Latn
  content: Directive 2013/14/EU of the European Parliament and of the Council of 21
    May 2013 amending Directive 2003/41/EC on the activities and supervision of institutions
    for occupational retirement provision, Directive 2009/65/EC on the coordination
    of laws, regulations and administrative provisions relating to undertakings for
    collective investment in transferable securities (UCITS) and Directive 2011/61/EU
    on Alternative Investment Funds Managers in respect of over-reliance on credit
    ratings
  type: main
- language: fr
  script: Latn
  content: Directive 2013/14/UE du Parlement européen et du Conseil du 21 mai 2013
    modifiant la directive 2003/41/CE concernant les activités et la surveillance
    des institutions de retraite professionnelle, la directive 2009/65/CE portant
    coordination des dispositions législatives, réglementaires et administratives
    concernant certains organismes de placement collectif en valeurs mobilières (OPCVM)
    et la directive 2011/61/UE sur les gestionnaires de fonds d’investissement alternatifs
    en ce qui concerne la dépendance excessive à l’égard des notations de crédit
  type: main
- language: de
  script: Latn
  content: Richtlinie 2013/14/EU des Europäischen Parlaments und des Rates vom 21.
