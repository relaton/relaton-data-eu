    stato di diritto in Kosovo (Tale designazione non pregiudica le posizioni riguardo
    allo status ed è in linea con la risoluzione 1244 (1999) dell'UNSC e con il parere
    della CIG sulla dichiarazione di indipendenza del Kosovo.) (EULEX KOSOVO)
