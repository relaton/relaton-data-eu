    съюз в областта на върховенството на закона
    в Косово (Това название не засяга позициите
    относно статута и е съобразено с Резолюция
    1244(1999) на Съвета за сигурност на ООН и становището
    на Международния съд относно обявяването на
    независимост от страна на Косово.) (EULEX KOSOVO)
