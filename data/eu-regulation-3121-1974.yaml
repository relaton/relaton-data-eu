title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3121/74 of the Commission of 11 December 1974 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, of cotton, falling within heading No 60.02, originating
    in developing countries to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3503/73 of 18 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3121/74 de la Commission, du 11 décembre 1974, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastique ni caoutchoutée, de coton, de la position tarifaire
    EX 60.02, originaire des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3121/74 der Kommission vom 11. Dezember 1974 über
    die Wiedereinführung des Zollsatzes für Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle, der Tarifnummer ex 60.02, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3121/74 af 11. december 1974 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, ikke
    elastisk eller gummeret, af bomuld under position ex 60.02 som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3121/74 della Commissione, dell'11 dicembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia
    non elastica né gommata, di cotone, della voce doganale n. ex 60.02, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3121/74 van de Commissie van 11 december 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of niet-gegummeerd brei- of
    haakwerk, van katoen, van tariefpost ex 60.02, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
