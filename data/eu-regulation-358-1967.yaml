  content: Règlement n° 358/67/CEE du Conseil, du 28 juillet 1967, relatif à la
    fixation des prix de seuil, au calcul des prélèvements et de la restitution
    de certains laits en poudre et fromages ainsi qu'à des mesures d'intervention
    pour ces fromages
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 358/67/EWG des Rates vom 28. Juli 1967 über die Festsetzung
    der Schwellenpreise, die Errechnung der Abschöpfungen und der Erstattung für
    bestimmte Milchpulver- und Käsesorten sowie über die Interventionsmaßnahmen
    für diese Käsesorten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 358/67/CEE del Consiglio, del 28 luglio 1967, relativo alla
    fissazione dei prezzi d'entrata, al calcolo dei prelievi e della restituzione
    per taluni tipi di latte in polvere e per alcuni formaggi, nonché alle misure
    di intervento per questi formaggi
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 358/67/EEG van de Raad van 28 juli 1967 betreffende de
    vaststelling van de drempelprijzen, de berekening van de heffingen en van de restituties
    voor bepaalde soorten melkpoeder en kaas, alsmede betreffende interventiemaatregelen
    voor deze kaassoorten
