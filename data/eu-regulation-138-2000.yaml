title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 138/2000 of 20 January 2000 determining to
    what extent applications for import rights lodged pursuant to Regulation (EC)
    No 2684/1999 can be met as regards the tariff quota for certain beef and veal
    sector products originating in the former Yugoslav Republic of Macedonia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 138/2000 de la Commission, du 20 janvier 2000, déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n° 2684/1999 concernant le contingent
    tarifaire de certains produits du secteur de la viande bovine originaires de l'ancienne
    République yougoslave de Macédoine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 138/2000 der Kommission vom 20. Januar 2000 zur Bestimmung
    des Umfangs, in dem den Einfuhrlizenzanträgen gemäß Verordnung (EG) Nr. 2684/1999
    im Rahmen des für bestimmte Rindfleischerzeugnisse mit Ursprung in der Ehemaligen
    Jugoslawischen Republik Mazedonien eröffnenden Zollkontingents stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 138/2000 af 20. januar 2000 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importrettigheder, der
    er indgivet i henhold til forordning (EF) nr. 2684/1999, og som vedrører toldkontingentet
    for visse oksekødsprodukter med oprindelse i Den Tidligere Jugoslaviske Republik
    Makedonien, kan efterkommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 138/2000 της Επιτροπής,
    της 20ής Ιανουαρίου 2000, για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιωμάτων εισαγωγής που υποβάλλονται σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 2684/1999 όσον αφορά
    τη δασμολογική ποσόστωση ορισμένων προϊόντων
    του τομέα του βοείου κρέατος που κατάγονται
    από την πρώην Γιουγκοσλαβική Δημοκρατία της
    Μακεδονίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 138/2000, annettu 20 päivänä tammikuuta 2000,
    asetuksen (EY) N:o 2684/1999 mukaisesti jätettyjen entisestä Jugoslavian tasavallasta
    Makedoniasta peräisin olevien tiettyjen naudanliha-alan tuotteiden tariffikiintiötä
    koskevien tuontioikeushakemuksien hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 138/2000 della Commissione, del 20 gennaio 2000, che
    stabilisce in che misura possono essere accolte le domande di diritti di importazione
    presentate nel quadro del regolamento (CE) n. 2684/1999 nell'ambito del contingente
    tariffario per taluni prodotti del settore delle carni bovine originari dell'ex
    Repubblica iugoslava di Macedonia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 138/2000 van de Commissie van 20 januari 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    rechten tot invoer die zijn ingediend op grond van Verordening (EG) nr. 2684/1999
    betreffende het tariefcontingent voor bepaalde producten van de sector rundvlees
    van oorsprong uit de Voormalige Joegoslavische Republiek Macedonië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 138/2000 da Comissão, de 20 de Janeiro de 2000,
    que determina em que medida pode ser dado seguimento aos pedidos de direitos de
    importação apresentados ao abrigo do Regulamento (CE) n.° 2684/1999 relativo
    ao contingente pautal de determinados produtos do sector da carne de bovino originários
    da antiga República jugoslava da Macedónia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 138/2000 de la Comisión, de 20 de enero de 2000, por
    el que se determina en qué medida se podrá dar curso a las solicitudes de derechos
    de importación presentadas con arreglo al Reglamento (CE) n° 2684/1999 relativo
    al contingente arancelario de determinados productos del sector de la carne de
    vacuno originarios de la antigua República Yugoslava de Macedonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 138/2000 av den 20 januari 2000 om fastställande
