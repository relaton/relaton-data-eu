    la mesure dans laquelle les demandes de certificats d'importation introduites
    en décembre 2004 peuvent être acceptées dans le cadre des contingents tarifaires
    d'importation pour certains produits dans le secteur de la viande de porc pour
    la période du 1er janvier au 31 mars 2005
  type: main
- language: de
  script: Latn
