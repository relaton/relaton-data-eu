title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2214/2004 of 21 December 2004 determining
    the extent to which applications lodged in December 2004 for import licences under
    the regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 January to 31 March 2005 can be accepted
  type: main
- language: fr
  script: Latn
