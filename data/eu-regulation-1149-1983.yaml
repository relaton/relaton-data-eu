title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1149/83 of 11 May 1983 amending for the
    15th time Regulation (EEC) No 2730/81 establishing a list of agencies in non-member
    importing countries entitled to issue invitations to tender in the milk and milk
    products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1149/83 de la Commission du 11 mai 1983 modifiant
    pour la quinzième fois le règlement (CEE) n 2730/81 établissant la liste des
    organismes dans les pays tiers importateurs d'où peuvent émaner des adjudications
    dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1149/83 der Kommission vom 11. Mai 1983 zur 15. Änderung
