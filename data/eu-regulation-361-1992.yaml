title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 361/92 of 13 February 1992 authorizing the
    Italian intervention agency to put up for sale by invitation to tender 100 000
    tonnes of paddy rice with a view to export in the form of milled rice to the Republics
    resulting from the dissolution of the Soviet Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 361/92 de la Commission, du 13 février 1992, autorisant
    l'organisme d'intervention italien à mettre en adjudication 100 000 tonnes de
    riz paddy en vue d'exportation sous forme de riz blanchi à destination des républiques
    issues de la dissolution de l'URSS
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 361/92 der Kommission vom 13. Februar 1992 zur Ermächtigung
    der italienischen Interventionsstelle, 100 000 Tonnen Rohreis zur Ausfuhr nach
    den durch die Auflösung der UdSSR entstandene Republiken in Form von vollständig
    geschliffenem Reis auszuschreiben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 361/92 af 13. februar 1992 om bemyndigelse
    af det italienske interventionsorgan til at udbyde 1 00 000 tons uafskallet ris
    i licitation med henblik på udførsel i form af sleben ris til republikker, der
    opstået efter opløsningen af Sovjetunionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 361/92 της Επιτροπής
    της 13ης Φεβρουαρίου 1992 που επιτρέπει στον ιταλικό
    οργανισμό παρεμβάσεως να προκηρύξει διαγωνισμό
    για 100 000 τόνους ρυζιού paddy με σκοπό την εξαγωγή
    του, υπό μορφή λευκασμένου ρυζιού, με προορισμό
    τις Δημοκρατίες που προήλθαν από τη διάλυση
    της ΕΣΣΔ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 361/92 della Commissione, del 13 febbraio 1992, che
    autorizza l'organismo di intervento italiano a vendere mediante gara 100 000 t
    di risone da esportare sotto forma di riso lavorato nelle Repubbliche sorte dallo
    scioglimento dell'Unione Sovietica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 361/92 van de Commissie van 13 februari 1992 tot
    machtiging van het Italiaanse interventiebureau om 100 000 ton padie via een openbare
    inschrijving te verkopen met het oog op uitvoer in de vorm van volwitte rijst
    naar de republieken die zijn ontstaan als gevolg van de ontbinding van de USSR
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 361/92 da Comissão, de 13 de Fevereiro de 1992,
    que autoriza o organismo de intervenção italiano a adjudicar 100 000 toneladas
    de arroz paddy tendo em vista a sua exportação sob a forma de arroz branqueado
    para as repúblicas resultantes da dissolução da URSS
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 361/92 de la Comisión, de 13 de febrero de 1992, por
    el que se autoriza al organismo de intervención italiano a sacar a licitación
    100 000 toneladas de arroz con cáscara para su exportación en forma de arroz
    blanco com destino a las Repúblicas resultantes de la disolución de la URSS
  type: main
