id: EURegulation21521998
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2152/98 of 7 October 1998 initiating a 'new
    exporter' review of Council Regulation (EC) No 1821/98 imposing a definitive anti-dumping
    duty on imports of certain magnetic disks (3,5" microdisks) originating in Indonesia,
    repealing the duty with regard to imports from this exporter and making these
    imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2152/98 de la Commission du 7 octobre 1998 portant
    ouverture d'un réexamen pour un nouvel exportateur du règlement (CE) nº 1821/98
    du Conseil instituant un droit antidumping définitif sur les importations de
    certains disques magnétiques (microdisques de 3,5 pouces) originaires d'Indonésie,
    abrogeant le droit applicable à ce nouvel exportateur et soumettant les importations
    en question à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2152/98 der Kommission vom 7. Oktober 1998 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 1821/98 zur Einführung eines endgültigen
    Antidumpingzolls auf die Einfuhren bestimmter Magnetplatten (3,5"-Mikroplatten)
    mit Ursprung in Indonesien, zur Aufhebung des Zolls auf die Einfuhren eines Ausführers
    in Indonesien und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2152/98 af 7. oktober 1998 om indledning
    af en fornyet undersøgelse (»ny eksportør«) af Rådets forordning (EF) nr.
    1821/98 om indførelse af en endelig antidumpingtold på importen af visse magnetplader
    (3,5"disketter) med oprindelse i Indonesien, om ophævelse af tolden med hensyn
    til importen fra den pågældende eksportør og om registrering af den pågældende
    import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2152/98 της Επιτροπής
    της 7ης Οκτωβρίου 1998 για την έναρξη επανεξέτασης
    «για νέο εξαγωγέα» του κανονισμού (ΕΚ) αριθ.
    1821/98 του Συμβουλίου για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    μαγνητικών δίσκων (μικροδίσκων 3,5 ιντσών), καταγωγής
    Ινδονησίας, και για την κατάργηση του δασμού
    όσον αφορά τις εισαγωγές από τον εν λόγω εξαγωγέα
    και την καταγραφή των εν λόγω εισαγωγών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2152/98, annettu 7 päivänä lokakuuta 1998,
    lopullisen polkumyyntitullin käyttöönotosta tiettyjen Indonesiasta peräisin
    olevien magneettilevyjen (3,5 tuuman mikrolevyt) tuonnissa annettuun neuvoston
    asetukseen (EY) N:o 1821/98 liittyvän "uutta viejää" koskevan tarkastelun vireillepanosta,
    tullin peruuttamisesta tämän viejän tuonnin osalta ja kyseisen tuonnin kirjaamisvelvollisuudesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2152/98 della Commissione del 7 ottobre 1998 che avvia
    un riesame relativo ai «nuovi esportatori» del regolamento (CE) n. 1821/98,
    che istituisce un dazio antidumping definitivo sulle importazioni di alcuni tipi
    di dischi magnetici (minidischi da 3,5") originari dell'Indonesia e che abroga
    il dazio per quanto riguarda le importazioni di questo esportatore e stabilisce
    che le importazioni siano soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2152/98 van de Commissie van 7 oktober 1998 tot opening
    van een nieuw onderzoek voor een "nieuwe exporteur" van Verordening (EG) nr. 1821/98
    tot instelling van een definitief antidumpingrecht op de invoer van bepaalde magneetschijven
    (3,5 mm microschijven) van oorsprong uit Indonesië, en tot intrekking van het
    recht met betrekking tot de invoer van deze exporteur waarbij deze invoer geregistreerd
    moet worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2152/98 da Comissão de 7 de Outubro de 1998 que inicia
    um reexame «novo exportador» do Regulamento (CE) nº 1821/98 do Conselho que
    cria um direito anti-dumping definitivo sobre as importações de certos discos
    magnéticos (microdiscos de 3,5 polegadas) originários da Indonésia, que revoga
    o direito no que diz respeito às importações deste exportador e torna estas
    importações objecto de registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2152/98 de la Comisión de 7 de octubre de 1998 que
    inicia un procedimiento de reconsideración para un «nuevo exportador» del Reglamento
    (CE) nº 1821/98 del Consejo, por el que se impone un derecho antidumping definitivo
    sobre las importaciones de ciertos discos magnéticos (microdiscos de 3,5") originarias
    da Indonesia, por el que se deroga el derecho aplicable a las importaciones de
    este exportador y por el que se sujetan a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2152/98 av den 7 oktober 1998 om inledande
    av en översyn, föranledd av tillkomsten av en ny exportör, av rådets förordning
    (EG) nr 1821/98 om införande av en slutgiltig antidumpningstull på import av
    vissa magnetskivor (3,5-tumsdisketter) med ursprung i Indonesien, om upphävande
    av tullen på import från denna exportör och om registrering av denna import
  type: main
