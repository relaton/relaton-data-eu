---
id: EURegulation20221646
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1646 of 23 September 2022
    on uniform practical arrangements for the performance of official controls as
    regards the use of pharmacologically active substances authorised as veterinary
    medicinal products or as feed additives and of prohibited or unauthorised pharmacologically
    active substances and residues thereof, on specific content of multi-annual national
    control plans and specific arrangements for their preparation
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1646 de la Commission du 23 septembre
    2022 relatif aux modalités uniformes de réalisation des contrôles officiels
    en ce qui concerne l’utilisation des substances pharmacologiquement actives
    autorisées en tant que médicaments vétérinaires ou en tant qu’additifs destinés
    à l’alimentation des animaux et des substances pharmacologiquement actives
    interdites ou non autorisées et de leurs résidus, ainsi qu’au contenu spécifique
    des plans de contrôle nationaux pluriannuels et aux modalités spécifiques de
    leur élaboration
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1646 der Kommission vom 23. September
    2022 über einheitliche praktische Modalitäten für die Durchführung amtlicher
    Kontrollen der Verwendung pharmakologisch wirksamer Stoffe, die als Tierarzneimittel
    oder Futtermittelzusatzstoffe zugelassen sind, und verbotener oder nicht zugelassener
    pharmakologisch wirksamer Stoffe und ihrer Rückstände, über besondere Inhalte
    mehrjähriger nationaler Kontrollpläne und besondere Modalitäten für deren
    Aufstellung
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1646 на Комисията
    от 23 септември 2022 година относно единната практическа
    уредба за извършването на официален контрол
    по отношение на употребата на фармакологичноактивни
    субстанции, разрешени като ветеринарни лекарствени
    продукти или като фуражни добавки, и на забранени
    или неразрешени фармакологичноактивни субстанции
    и остатъци от тях, относно конкретното съдържание
    на многогодишните национални планове за контрол
    и конкретната уредба за тяхното изготвяне
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1646 ze dne 23. září 2022
    o jednotných praktických opatřeních pro provádění úředních kontrol,
    pokud jde o používání farmakologicky účinných látek povolených jako veterinární
    léčivé přípravky nebo jako doplňkové látky a zakázaných nebo nepovolených
    farmakologicky účinných látek a jejich reziduí, o zvláštním obsahu víceletých
    vnitrostátních plánů kontrol a zvláštních opatřeních pro jejich přípravu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1646 af 23. september
    2022 om ensartede praktiske ordninger for gennemførelsen af offentlig kontrol
    af anvendelsen af farmakologisk virksomme stoffer, der er godkendt som veterinærlægemidler
    eller som fodertilsætningsstoffer, og af forbudte eller ikkegodkendte farmakologisk
    virksomme stoffer og restkoncentrationer heraf, om specifikt indhold af flerårige
    nationale kontrolplaner og særlige ordninger for udarbejdelse heraf
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1646 της Επιτροπής
    της 23ης Σεπτεμβρίου 2022 σχετικά με ενιαίες πρακτικές
    ρυθμίσεις για τη διενέργεια επίσημων ελέγχων
    όσον αφορά τη χρήση φαρμακολογικώς δραστικών
    ουσιών που έχουν εγκριθεί ως κτηνιατρικά φάρμακα
    ή ως πρόσθετες ύλες ζωοτροφών και απαγορευμένων
    ή μη εγκεκριμένων φαρμακολογικώς δραστικών
    ουσιών και των καταλοίπων τους, σχετικά με
    το ειδικό περιεχόμενο των πολυετών εθνικών
    σχεδίων ελέγχων και ειδικές ρυθμίσεις για
    την κατάρτισή τους
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1646, 23. september 2022, milles käsitletakse
    veterinaarravimitena või söödalisanditena lubatud farmakoloogiliste toimeainete
    ning keelatud või loata farmakoloogiliste toimeainete ja nende jääkide ametliku
    kontrolli tegemise ühtset praktilist korda, mitmeaastaste riiklike kontrollikavade
    erisisu ja nende koostamise erikorda
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1646, annettu 23 päivänä
    syyskuuta 2022, yhdenmukaisista käytännön järjestelyistä virallisen valvonnan
    suorittamista varten siltä osin kuin on kyse eläinlääkkeinä tai rehun lisäaineina
    sallittujen farmakologisesti vaikuttavien aineiden sekä kiellettyjen tai muiden
    kuin sallittujen farmakologisesti vaikuttavien aineiden käytöstä ja niiden
    jäämistä, monivuotisten kansallisten valvontasuunnitelmien tietystä sisällöstä
    ja niiden valmistelua koskevista erityisistä järjestelyistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1646 ón gCoimisiún an 23 Meán
    Fómhair 2022 maidir le socruithe praiticiúla aonfhoirmeacha maidir le feidhmiú
    rialuithe oifigiúla a mhéid a bhaineann le húsáid substaintí atá gníomhach
    ó thaobh na cógaseolaíochta de atá údaraithe mar tháirgí íocshláinte
    tréidliachta nó mar bhreiseáin bheathaithe agus le húsáid substaintí toirmiscthe
    nó neamhúdaraithe atá gníomhach ó thaobh na cógaseolaíochta de agus le
    húsáid iarmhar díobh, agus maidir le hábhar sonrach pleananna rialaithe náisiúnta
    ilbhliantúil agus socruithe sonracha chun iad a ullmhú
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1646 оd 23. rujna 2022. o ujednačenom
    praktičnom uređenju za provedbu službenih kontrola upotrebe farmakološki djelatnih
    tvari koje su odobrene kao veterinarsko-medicinski proizvodi ili kao dodaci hrani
    za životinje te upotrebe zabranjenih ili neodobrenih farmakološki djelatnih
    tvari i njihovih ostataka, o posebnom sadržaju višegodišnjih nacionalnih planova
    kontrola i o posebnom uređenju za njihovu izradu
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1646 végrehajtási rendelete (2022. szeptember
    23.) az állatgyógyászati készítményként vagy takarmány-adalékanyagként
    engedélyezett gyógyszerhatóanyagok, valamint a tiltott vagy nem engedélyezett
    gyógyszerhatóanyagok és azok maradékanyagai felhasználása tekintetében
    végzett hatósági ellenőrzésekre, a többéves nemzeti ellenőrzési tervek
    meghatározott tartalmára és az elkészítésükkel kapcsolatos különös intézkedésekre
    vonatkozó egységes gyakorlati szabályokról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1646 della Commissione del 23 settembre
    2022 relativo alle modalità pratiche uniformi di esecuzione dei controlli ufficiali
    per quanto riguarda l’uso di sostanze farmacologicamente attive autorizzate
    come medicinali veterinari o come additivi per mangimi, e dei loro residui, e
    l’uso di sostanze farmacologicamente attive vietate o non autorizzate e dei
    loro residui, al contenuto specifico dei piani di controllo nazionali pluriennali
    e alle modalità specifiche per l’elaborazione degli stessi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1646 (2022. gada 23. septembris)
    par vienotu praktisku kārtību oficiālo kontroļu veikšanai attiecībā uz
    veterināru zāļu vai barības piedevu statusā atļautu farmakoloģiski aktīvu
    vielu un aizliegtu vai neatļautu farmakoloģiski aktīvu vielu un to atlieku
    lietošanu, par valsts daudzgadu kontroles plānu konkrēto saturu un īpašu
    to sagatavošanas kārtību
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1646 2022 m. rugsėjo 23
    d. dėl farmakologiškai aktyvių medžiagų, kurias leidžiama naudoti kaip veterinarinius
    vaistus arba kaip pašarų priedus, ir draudžiamų arba neleidžiamų naudoti
    farmakologiškai aktyvių medžiagų naudojimo ir jų liekanų oficialios kontrolės
    vienodos praktinės tvarkos, konkretaus daugiamečių nacionalinių kontrolės
    planų turinio ir konkrečios jų rengimo tvarkos
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1646 tat-23
    ta’ Settembru 2022 dwar arranġamenti prattiċi uniformi għat-twettiq ta’
    kontrolli uffiċjali fir-rigward tal-użu ta’ sustanzi farmakoloġikament attivi
    awtorizzati bħala prodotti mediċinali veterinarji jew bħala addittivi tal-għalf
    u ta’ sustanzi farmakoloġikament attivi pprojbiti jew mhux awtorizzati u r-residwi
    tagħhom, dwar il-kontenut speċifiku tal-pjanijiet ta’ kontroll nazzjonali
    pluriennali u l-arranġamenti speċifiċi għat-tħejjija tagħhom
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1646 van de Commissie van 23 september
    2022 betreffende eenvormige praktische regelingen voor de uitvoering van officiële
    controles met betrekking tot het gebruik van farmacologisch werkzame stoffen die
    als diergeneesmiddel of als toevoegingsmiddel voor diervoeding zijn toegelaten
    en van verboden of niet-toegelaten farmacologisch werkzame stoffen en residuen
    daarvan, betreffende de specifieke inhoud van meerjarige nationale controleplannen
    en specifieke regelingen voor de opstelling daarvan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1646 z dnia 23 września 2022
    r. w sprawie jednolitych praktycznych rozwiązań dotyczących przeprowadzania
    kontroli urzędowych w odniesieniu do stosowania substancji farmakologicznie czynnych
    dopuszczonych jako weterynaryjne produkty lecznicze lub jako dodatki paszowe oraz
    zakazanych lub niedopuszczonych substancji farmakologicznie czynnych i ich pozostałości,
    w sprawie treści wieloletnich krajowych planów kontroli oraz w sprawie szczególnych
    ustaleń dotyczących ich opracowywania
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1646 da Comissão de 23 de setembro
    de 2022 relativo a disposições práticas uniformes para a realização dos controlos
    oficiais no que se refere à utilização de substâncias farmacologicamente ativas
    autorizadas como medicamentos veterinários ou como aditivos para a alimentação
    animal e de substâncias farmacologicamente ativas proibidas ou não autorizadas
    e respetivos resíduos, ao conteúdo específico dos planos nacionais de controlo
    plurianuais e às disposições específicas para a sua elaboração
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1646 al Comisiei din 23 septembrie
    2022 privind modalitățile practice uniforme pentru efectuarea controalelor oficiale
    în ceea ce privește utilizarea substanțelor farmacologic active autorizate
    ca medicamente de uz veterinar sau ca aditivi pentru hrana animalelor și a substanțelor
    farmacologic active interzise sau neautorizate și reziduurile acestora, conținutul
    specific al planurilor de control naționale multianuale și modalitățile specifice
    de elaborare a acestora
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1646 z 23. septembra 2022 o
    jednotných praktických opatreniach na vykonávanie úradných kontrol, pokiaľ
    ide o používanie farmakologicky účinných látok povolených ako veterinárne
    lieky alebo ako kŕmne doplnkové látky a zakázaných alebo nepovolených farmakologicky
    účinných látok a o ich rezíduá, o špecifickom obsahu viacročných národných
    plánov kontroly a špecifických opatreniach na ich prípravu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1646 z dne 23. septembra 2022 o enotnih
    praktičnih ureditvah za izvajanje uradnega nadzora uporabe farmakološko aktivnih
    snovi, ki so odobrene kot zdravila za uporabo v veterinarski medicini ali kot
    krmni dodatki, ter prepovedanih ali neodobrenih farmakološko aktivnih snovi in
    njihovih ostankov, o posebni vsebini večletnih nacionalnih načrtov nadzora in
    posebnih ureditvah za njihovo pripravo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1646 de la Comisión de 23 de septiembre
    de 2022 relativo a disposiciones prácticas uniformes para la realización de
    controles oficiales en lo que respecta al uso de sustancias farmacológicamente
    activas autorizadas como medicamentos veterinarios o como aditivos de piensos,
    y de sustancias farmacológicamente activas prohibidas o no autorizadas y sus
    residuos, sobre el contenido específico de los planes nacionales de control plurianuales
    y disposiciones específicas para su preparación
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1646 av den 23 september
    2022 om enhetliga praktiska arrangemang för utförandet av offentlig kontroll
    av användningen av farmakologiskt aktiva substanser som är godkända som veterinärmedicinska
    läkemedel eller som fodertillsatser, och resthalter av dessa, samt av förbjudna
    eller otillåtna farmakologiskt aktiva substanser, och resthalter av dessa, och
    om särskilt innehåll i fleråriga nationella kontrollplaner och särskilda arrangemang
    för deras utarbetande
  type: main
