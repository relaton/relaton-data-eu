title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 55/2004 of 17 December 2003 amending Regulation
    (EC) No 1453/2001 introducing specific measures for certain agricultural products
    for the Azores and Madeira and repealing Regulation (EEC) No 1600/92 (Poseima)
    with respect to the application of the supplementary levy in the milk and milk
    products sector in the Azores
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 55/2004 du Conseil du 17 décembre 2003 modifiant le
    règlement (CE) n° 1453/2001 portant mesures spécifiques concernant certains
    produits agricoles en faveur des Açores et de Madère et abrogeant le règlement
    (CEE) n° 1600/92 (Poseima) en ce qui concerne l'application du prélèvement
    supplémentaire dans le secteur du lait et des produits laitiers dans les Açores
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 55/2004 des Rates vom 17. Dezember 2003 zur Änderung
    der Verordnung (EG) Nr. 1453/2001 zur Einführung von Sondermaßnahmen für bestimmte
    landwirtschaftliche Erzeugnisse zugunsten der Azoren und Madeiras und zur Aufhebung
    der Verordnung (EWG) Nr. 1600/92 (Poseima) hinsichtlich der Anwendung der Zusatzabgabe
    im Sektor Milch und Milcherzeugnisse auf den Azoren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 55/2004 на Съвета от 17 декември
    2003 година за изменение на Регламент (EО) № 1453/2001
    за определяне на специфични мерки за някои
    земеделски продукти за Азорските острови и
    остров Мадейра и за отмяна на Регламент (EИО)
    № 1600/92 (Poseima) относно прилагането на допълнителен
    налог върху млякото и млечните продукти на
    Азорските острови
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 55/2004 ze dne 17. prosince 2003, kterým se
    mění nařízení (ES) č. 1453/2001, kterým se zavádějí zvláštní opatření
    pro Azory a Madeiru týkající se některých zemědělských produktů a kterým
    se zrušuje nařízení (EHS) č. 1600/92 (Poseima), pokud jde o používání
    doplňkové dávky v odvětví mléka a mléčných výrobků na Azorech
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 55/2004 af 17. december 2003 om ændring af
    forordning (EF) nr. 1453/2001 om særlige foranstaltninger for visse landbrugsprodukter
    til fordel for Azorerne og Madeira og om ophævelse af forordning (EØF) nr. 1600/92
    (Poseima) for så vidt angår anvendelsen af ordningen om tillægsafgift i mejerisektoren
    på Azorerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 55/2004 του Συμβουλίου,
    της 17ης Δεκεμβρίου 2003, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1453/2001 περί ειδικών μέτρων,
    όσον αφορά ορισμένα γεωργικά προϊόντα, υπέρ
    των Αζορών και της Μαδέρας και για την κατάργηση
    του κανονισμού (ΕΟΚ) αριθ. 1600/92 (Poseima) σχετικά
    με την εφαρμογή της συμπληρωματικής εισφοράς
    στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων των Αζορών
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 55/2004, 17. detsember 2003, millega muudetakse
    määrust (EÜ) nr 1453/2001 (millega kehtestatakse Assooride ja Madeira heaks
    teatavate põllumajandussaaduste ja -toodete suhtes erimeetmed ning tunnistatakse
    kehtetuks määrus (EMÜ) nr 1600/92 (Poseima)) piima- ja piimatootesektoris lisamaksu
    kohaldamise osas Assooridel
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 55/2004, annettu 17 päivänä joulukuuta 2003,
    tiettyjä maataloustuotteita koskevista erityistoimenpiteistä Azorien ja Madeiran
    hyväksi ja asetuksen (ETY) N:o 1600/92 kumoamisesta (Poseima) annetun asetuksen
    (EY) N:o 1453/2001 muuttamisesta siltä osin kuin se koskee maito- ja maitotuotealan
    lisämaksun soveltamista Azoreilla
  type: main
- language: hu
  script: Latn
  content: A Tanács 55/2004/EK rendelete (2003. december 17.) egyes mezőgazdasági
    termékek tekintetében az Azori-szigetek és Madeira javára egyedi intézkedések
    bevezetéséről és az 1600/92/EGK rendelet (Poseima) hatályon kívül helyezéséről
    szóló 1453/2001/EK rendeletnek az Azori-szigeteken a tej- és tejtermékágazatban
    kiegészítő illeték alkalmazása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 55/2004 del Consiglio, del 17 dicembre 2003, che modifica
    il regolamento (CE) n. 1453/2001 recante misure specifiche a favore delle Azzorre
    e di Madera per taluni prodotti agricoli e che abroga il regolamento (CEE) n.
    1600/92 (Poseima) per quanto riguarda l'applicazione del prelievo supplementare
    nel settore del latte e dei prodotti lattiero-caseari nelle Azzorre
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 55/2004 (2003. gada 17. decembris), ar ko groza
    Regulu (EK) Nr. 1453/2001, ar kuru ievieš īpašus pasākumus Azoru salām un
    Madeirai attiecībā uz konkrētiem lauksaimniecības produktiem un atceļ Regulu
    (EEK) Nr. 1600/92 (Poseima) attiecībā uz papildmaksājuma piemērošanu piena
    un piena produktu nozarē Azoru salās
  type: main
- language: lt
  script: Latn
  content: 2003 m. gruodžio 17 d. Tarybos reglamentas (EB) Nr. 55/2004, iš dalies
    pakeičiantis Reglamentą (EB) Nr. 1453/2001, įvedantį specialiąsias priemones
    tam tikriems Azorų salų ir Maderos žemės ūkio produktams ir panaikinantį
    Reglamentą (EEB) Nr. 1600/92 (Poseima), dėl papildomo mokesčio taikymo pieno
    ir pieno produktų sektoriuje Azorų salose
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 55/2004 tas-17 ta’ Diċembru 2003
    li jemenda ir-Regolament (KE) Nru 1453/2001 li daħħal miżuri speċifiċi għal
    ċerti prodotti tal-biedja għall-Azores u Madeira u ħassar ir-Regolament (KEE)
    Nru 1600/92 (Poseima) dwar l-applikazzjoni tat-taxxa supplementari fis-settur
    tal-ħalib u tal-prodotti tal-ħalib fl-Azores
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 55/2004 van de Raad van 17 december 2003 tot wĳziging
    van Verordening (EG) nr. 1453/2001 houdende specifieke maatregelen voor bepaalde
    landbouwproducten ten behoeve van de Azoren en Madeira en houdende intrekking
    van Verordening (EEG) nr. 1600/92 (Poseima) met betrekking tot de toepassing van
    de aanvullende heffing in de sector melk en zuivelproducten op de Azoren
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 55/2004 z dnia 17 grudnia 2003 r. zmieniające
    rozporządzenie (WE) nr 1453/2001 wprowadzające szczególne środki dla niektórych
    produktów rolnych z Azorów i Madery oraz uchylające rozporządzenie (EWG) nr
    1600/92 (Poseima) w odniesieniu do zastosowania opłaty wyrównawczej w sektorze
    mleka i przetworów mlecznych na Azorach
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 55/2004 do Conselho, de 17 de Dezembro de 2003, que
    altera o Regulamento (CE) n.° 1453/2001 que estabelece medidas específicas relativas
    a determinados produtos agrícolas a favor dos Açores e da Madeira e revoga o
    Regulamento (CEE) n.° 1600/92 (Poseima) no que se refere à aplicação, nos
    Açores, da imposição suplementar no sector do leite e dos produtos lácteos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 55/2004 al Consiliului din 17 decembrie 2003 de modificare
    a Regulamentului (CE) nr. 1453/2001 privind măsurile specifice referitoare la
    anumite produse agricole pentru Insulele Azore și Madeira și de abrogare a Regulamentului
    (CEE) nr. 1600/92 (Poseima) în ceea ce privește aplicarea unei prelevări suplimentare
    în sectorul laptelui și al produselor lactate în Azore
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 55/2004 zo 17. decembra 2003, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1453/2001 o zavedení osobitných opatrení pre
    určité poľnohospodárske výrobky pre Azorské ostrovy a ostrov Madeira a o
    zrušení nariadenia (EHS) č. 1600/92 (Poseima) vzhľadom na uplatňovanie dodatočného
    cla v odvetví mlieka a mliečnych výrobkov na Azorských ostrovoch
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 55/2004 z dne 17. decembra 2003 o spremembi Uredbe
    (ES) št. 1453/2001 o uvedbi posebnih ukrepov za nekatere kmetijske proizvode
    za Azore in Madeiro in o razveljavitvi Uredbe (EGS) št. 1600/92 (Poseima) glede
    uporabe dodatne dajatve na področju mleka in mlečnih proizvodov na Azorih
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 55/2004 del Consejo, de 17 de diciembre de 2003, que
    modifica el Reglamento (CE) n° 1453/2001 por el que se aprueban medidas específicas
    en favor de las Azores y Madeira en relación con determinados productos agrícolas
    y por el que se deroga el Reglamento (CEE) n° 1600/92 (Poseima) en relación
    con la aplicación de la tasa suplementaria en el sector de la leche y de los
    productos lácteos en las Azores
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 55/2004 av den 17 december 2003 om ändring
    av förordning (EG) nr 1453/2001 om specifika åtgärder för vissa jordbruksprodukter
    till förmån för Azorerna och Madeira samt om upphävande av förordning (EEG)
    nr 1600/92 (Poseima) när det gäller tillämpningen av tilläggsavgiften inom
    sektorn för mjölk och mjölkprodukter på Azorerna
  type: main
