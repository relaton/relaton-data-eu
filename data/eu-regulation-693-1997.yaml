title:
- language: en
  script: Latn
  content: Commission regulation (EC) No 693/97 of 18 April 1997 initiating an investigation
    concerning the alleged circumvention of Council Regulation (EC) No 1490/96 on
    imports of polyester staple fibre originating in Belarus by imports of synthetic
    filament tow of polyester for conversion in the European Community and making
    the latter imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 693/97 de la Commission du 18 avril 1997 ouvrant une
    enquête sur le prétendu contournement du règlement (CE) nº 1490/96 du Conseil
    sur les importations de fibres discontinues de polyesters originaires du Bélarus
    par des importations de câbles de filaments synthétiques de polyesters destinés
    à être transformés dans la Communauté européenne et rendant obligatoire l'enregistrement
    de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 693/97 der Kommission vom 18. April 1997 zur Einleitung
    einer Untersuchung betreffend die angebliche Umgehung der Verordnung (EG) Nr.
    1490/96 des Rates über die Einfuhren von Polyester-Spinnfasern mit Ursprung in
    Belarus durch die Einfuhren von Kabeln aus Polyester-Filamenten zwecks Umwandlung
    in der Europäischen Gemeinschaft und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 693/97 af 18. april 1997 om indledning
    af en undersøgelse vedrørende den påståede omgåelse af Rådets forordning
    (EF) nr. 1490/96 om indførelse af en endelig antidumpingtold på importen af
    korte syntetiske fibre af polyestere med oprindelse i Belarus, ved import af bånd
    (tow) af syntetiske filamenter af polyestere til bearbejdning i Det Europæiske
    Fællesskab, og om at gøre sidstnævnte import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 693/97 της Επιτροπής
    της 18ης Απριλίου 1997 για την έναρξη έρευνας
    σχετικά με την καταστρατήγηση του κανονισμού
    (ΕΚ) αριθ. 1490/96 του Συμβουλίου για τις εισαγωγές
    μη συνεχών ινών από πολυεστέρες, καταγωγής
    Λευκορωσίας, μέσω της εισαγωγής ινών σε δέσμες
    από πολυεστέρα για μετατροπή στην Ευρωπαϊκή
    Κοινότητα και για την υπαγωγή των εν λόγω εισαγωγών
    σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 693/97, annettu 18 päivänä huhtikuuta 1997,
    Valko-Venäjältä peräisin olevien polyesterikatkokuitujen tuonnista annetun
    neuvoston asetuksen (EY) N:o 1490/96 väitettyä kiertämistä koskevan tutkimuksen
    vireillepanosta Euroopan yhteisöön jalostusta varten tuotavan polyesteriä olevan
    synteettikuitufilamenttitouvin osalta ja kyseisen tuonnin saattamisesta kirjaamisen
    alaiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 693/97 della Commissione del 18 aprile 1997 che avvia
    un'inchiesta relativa alla presunta elusione delle misure istituite dal regolamento
    (CE) n. 1490/96 del Consiglio sulle importazioni di fibre di poliesteri in fiocco
    originarie della Bielorussia mediante importazioni di fasci di filamenti sintetici
    di poliesteri destinati alla trasformazione nella Comunità europea e che stabilisce
    la registrazione di tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 693/97 van de Commissie van 18 april 1997 houdende
    opening van een onderzoek naar de beweerde ontwijking van Verordening (EG) nr.
    1490/96 van de Raad betreffende de invoer van polyesterstapelvezels van oorsprong
    uit Wit-Rusland door de invoer van kabel van kunstmatige polyester continuvezel,
    voor verwerking in de Europese Gemeenschap en waarbij deze invoer aan registratie
    wordt onderworpen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 693/97 da Comissão de 18 de Abril de 1997 que inicia
    um inquérito sobre a alegada evasão das medidas anti-dumping instituídas pelo
    Regulamento (CE) nº 1490/96 do Conselho sobre as importações de fibras descontínuas
    de poliésteres originárias da Bielorrússia através das importações de cabos
    de filamentos sintéticos de poliésteres destinados a ser convertidos na Comunidade
    Europeia e que torna obrigatório o registo destas últimas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 693/97 de la Comisión de 18 de abril de 1997 por el
    que se inicia una investigación referente a la supuesta elusión del Reglamento
    (CE) nº 1490/96 del Consejo relativo a las importaciones de fibras discontinuas
    de poliéster originarias de Bielorrusia mediante importaciones de cables de filamentos
    sintéticos de poliéster para su transformación en la Comunidad Europea y por
    el que estas importaciones se someten a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 693/97 av den 18 april 1997 om inledande
    av en undersökning av det påstådda kringgåendet av rådets förordning (EG)
    nr 1490/96 gällande import av polyesterstapelfibrer med ursprung i Vitryssland
    genom import av fiberkabel av syntetfilament av polyestrar för omvandling i Europeiska
    gemenskapen, och om krav på registrering av sådan import
  type: main
