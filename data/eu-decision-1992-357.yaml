    Community of deep-frozen semen of domestic animals of the bovine species from
    certain third countries'
  type: main
- language: fr
  script: Latn
  content: '92/357/CEE: Décision de la Commission, du 23 juin 1992, modifiant la
    décision 92/255/CEE établissant une liste de centres de collecte de sperme agréés
    pour l'' exportation de sperme surgelé d'' animaux domestiques de l'' espèce
    bovine vers la Communauté en provenance de certains pays tiers'
