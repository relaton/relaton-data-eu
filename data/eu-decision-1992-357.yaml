    von tiefgefrorenem Rindersperma in die Gemeinschaft zugelassenen Besamungsstationen
    in einigen Drittländern'
  type: main
- language: da
  script: Latn
  content: '92/357/EØF: Kommissionens beslutning af 23. juni 1992 om ændring af
