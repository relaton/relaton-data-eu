title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2162 of 18 December 2020 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2015/2384 and Implementing Regulation
    (EU) 2017/271 on imports of certain aluminium foil originating in the People’s
    Republic of China by imports of certain aluminium foil consigned from Thailand,
    whether declared as originating in Thailand or not, and making such imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/2162 de la Commission du 18 décembre
    2020 ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) 2015/2384 et le règlement d’exécution
    (UE) 2017/271 sur les importations de certaines feuilles d’aluminium originaires
    de la République populaire de Chine par des importations de certaines feuilles
    d’aluminium expédiées de Thaïlande, qu’elles aient ou non été déclarées
    originaires de ce pays, et soumettant ces importations à enregistrement
  type: main
- language: de
