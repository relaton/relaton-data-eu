title:
- language: en
  script: Latn
  content: Commission Decision of 30 January 1979 fixing the minimum selling prices
    for frozen beef put up for sale by the intervention agencies in accordance with
    Regulation (EEC) No 2900/77 and specifying the quantities of frozen beef for processing
    which may be imported under special terms in the first quarter of 1979
  type: main
- language: fr
  script: Latn
  content: 79/187/CEE Décision de la Commission, du 30 janvier 1979, relative à
    la fixation de prix de vente minimaux pour la viande bovine congelée mise en
    vente par les organismes d'intervention en vertu du règlement (CEE) n° 2900/77
    et spécifiant en conséquence les quantités de viande bovine congelée, destinée
    à la transformation, pouvant être importées à des conditions spéciales pour
    le premier trimestre 1979
  type: main
- language: de
  script: Latn
  content: '79/187/EWG: # ENTSCHEIDUNG DER KOMMISSION VOM 30. JANUAR 1979 ZUR FESTSETZUNG
    VON MINDESTPREISEN FUER DEN VERKAUF VON ENTBEINTEM GEFRORENEM RINDFLEISCH DURCH
    DIE INTERVENTIONSSTELLEN GEMAESS VERORDNUNG ( EWG ) NR. 2900/77 SOWIE ZUR FESTSETZUNG
    DER MENGEN GEFRORENEN RINDFLEISCHES ZUR VERARBEITUNG, DIE IM ERSTEN VIERTELJAHR
    1979 ZU SONDERBEDINGUNGEN EINGEFUEHRT WERDEN DUERFEN'
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 30. januar 1979 om fastsættelse af mindstesalgspriser
    for frosset oksekød, der er udbudt til salg af interventionsorganerne i henhold
    til forordning (EØF) nr. 2900/77, og fastlæggelse af, hvilke mængder frosset
    oksekød til forarbejdning, der kan indføres på særlige betingelser i første
    kvartal af 1979
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 gennaio 1979, che fissa i prezzi minimi
    di vendita delle carni bovine congelate messe in vendita dagli organismi d'intervento
    ai sensi del regolamento (CEE) n. 2900/77 e stabilisce i quantitativi di carni
    bovine congelate destinate alla trasformazione che possono essere importati a
    condizioni speciali nel primo trimestre 1979
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 januari 1979 tot vaststelling van de
    minimumverkoopprijzen voor bevroren rundvlees dat door de interventiebureaus te
    koop is aangeboden op grond van Verordening (EEG) nr. 2900/77 en van de hoeveelheden
    bevroren rundvlees voor verwerking die in het eerste kwartaal van 1979 op bijzondere
    voorwaarden mogen worden ingevoerd
  type: main
