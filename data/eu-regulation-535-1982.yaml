title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 535/82 of 5 March 1982 re-establishing the
    levying of customs duties on coumarin, methylcoumarins and ethylcoumarins, falling
    within subheading 29.35 N and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 535/82 de la Commission, du 5 mars 1982, portant rétablissement
    de la perception des droits de douane applicables à la coumarine, aux méthylcoumarines
    et aux éthylcoumarines de la sous-position 29.35 N du tarif douanier commun,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 535/82 der Kommission vom 5. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Cumarin, Methylcumarine und Äthylcumarine der Tarifstelle
    29.35 N, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 535/82 af 5. marts 1982 om genindførelse
    af opkrævning af told for cumarin, methylcumariner og ethylcumariner, henhørende
    under pos. 29.35 N og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 535/82 τής Επιτροπής τής
    5ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τήν κουμαρίνη, τίς μεθυλοκουμαρίνες
    καί αιθυλοκουμαρίνες τής δασμολογικής διακρίσεως
    29. 35 Ν, καταγωγής Κίνας, δικαιούχων τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 535/82 della Commissione, del 5 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili alla cumarina, alle metilcumarine
    e etilcumarine della sottovoce 29.35 N della tariffa doganale comune, originarie
    della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 535/82 van de Commissie van 5 maart 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op cumarine, methylcumarinen
    en ethylcumarinen van postonderverdeling 29.35 N, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
