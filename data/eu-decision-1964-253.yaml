  content: Décision 64/253/CEE de la Commission, du 2 avril 1964, portant modification
    de sa décision du 5 novembre 1963, autorisant la perception d'une taxe compensatoire
    sur les importations, en République fédérale d'Allemagne de pain en provenance
    des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '64/253/EWG: Entscheidung der Kommission vom 2. April 1964 zur Änderung
    ihrer Entscheidung vom 5. November 1963 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Brot aus dem Königreich der Niederlande in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '64/253/CEE: Decisione della Commissione, del 2 aprile 1964, che modifica
    la decisione della Commissione del 5 novembre 1963 con cui si autorizza la riscossione
    di una tassa di compensazione sulle importazioni nella Repubblica federale di
    Germania di pane in provenienza dai Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '64/253/EEG: Beschikking van de Commissie van 2 april 1964 tot wijziging
    van haar beschikking van 5 november 1963 houdende machtiging tot het leggen van
    een compenserende heffing op de invoer in de Bondsrepubliek Duitsland van brood
    uit het Koninkrijk der Nederlanden'
