---
id: EURegulation17912006
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1791/2006 of 20 November 2006 adapting certain
    Regulations and Decisions in the fields of free movement of goods, freedom of
    movement of persons, company law, competition policy, agriculture (including veterinary
    and phytosanitary legislation), transport policy, taxation, statistics, energy,
    environment, cooperation in the fields of justice and home affairs, customs union,
    external relations, common foreign and security policy and institutions, by reason
    of the accession of Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1791/2006 du Conseil du 20 novembre 2006 portant adaptation
    de certains règlements et décisions adoptés dans les domaines de la libre circulation
    des marchandises, de la libre circulation des personnes, du droit des sociétés,
    de la politique de la concurrence, de l'agriculture (y compris la législation
    vétérinaire et phytosanitaire), de la politique des transports, de la fiscalité,
    des statistiques, de l'énergie, de l'environnement, de la coopération dans les
    domaines de la justice et des affaires intérieures, de l'union douanière, des
    relations extérieures, de la politique étrangère et de sécurité commune et
    des institutions, en raison de l'adhésion de la Bulgarie et de la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1791/2006 des Rates vom 20. November 2006 zur Anpassung
    einiger Verordnungen, Beschlüsse und Entscheidungen in den Bereichen freier Warenverkehr,
    Freizügigkeit, Gesellschaftsrecht, Wettbewerbspolitik, Landwirtschaft (einschließlich
    des Veterinär- und Pflanzenschutzrechts), Verkehrspolitik, Steuerwesen, Statistik,
    Energie, Umwelt, Zusammenarbeit in den Bereichen Justiz und Inneres, Zollunion,
    Außenbeziehungen, Gemeinsame Außen- und Sicherheitspolitik und Organe anlässlich
    des Beitritts Bulgariens und Rumäniens
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1791/2006 на Съвета от 20 ноември
    2006 година за адаптиране на някои регламенти
    и решения в областта на свободното движение
    на стоки, свободното движение на хора, дружественото
    право, политиката на конкуренция, земеделието
    (включително ветеринарно и фитосанитарно законодателство),
    транспортната политика, данъчното облагане,
    статистиката, енергетиката, околната среда,
    сътрудничеството в областта на правосъдието
    и вътрешните работи, митническия съюз, външните
    отношения, общата външна политика и политиката
    на сигурност и институциите поради присъединяването
    на България и Румъния
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1791/2006 ze dne 20. listopadu 2006 , kterým
    se z důvodu přistoupení Bulharska a Rumunska upravují některá nařízení
    a rozhodnutí v oblasti volného pohybu zboží, volného pohybu osob, práva
    obchodních společností, politiky hospodářské soutěže, zemědělství (včetně
    veterinárních a rostlinolékařských předpisů), dopravní politiky, daní,
    statistiky, energetiky, životního prostředí, spolupráce v oblastech spravedlnosti
    a vnitřních věcí, celní unie, vnějších vztahů, společné zahraniční
    a bezpečnostní politiky a orgánů
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1791/2006 af 20. november 2006 om tilpasning
    af visse forordninger, beslutninger og afgørelser vedrørende frie varebevægelser,
    frie personbevægelser, selskabsret, konkurrencepolitik, landbrug (herunder veterinær-
    og plantesundhedslovgivning), transportpolitik, fiskale bestemmelser, statistikker,
    energi, miljø, samarbejde om retlige og indre anliggender, toldunion, eksterne
    forbindelser, fælles udenrigs- og sikkerhedspolitik og institutionerne på grund
    af Republikken Bulgariens og Rumæniens tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1791/2006 του Συμβουλίου,
    της 20ής Νοεμβρίου 2006 , για την προσαρμογή ορισμένων
    κανονισμών και αποφάσεων στους τομείς της
    ελεύθερης κυκλοφορίας των εμπορευμάτων, της
    ελεύθερης κυκλοφορίας των προσώπων, του εταιρικού
    δικαίου, της πολιτικής ανταγωνισμού, της γεωργίας
    (συμπεριλαμβανομένης της κτηνιατρικής και
    φυτοϋγειονομικής νομοθεσίας), της πολιτικής
    μεταφορών, της φορολογίας, των στατιστικών,
    της ενέργειας, του περιβάλλοντος, της συνεργασίας
    στους τομείς της δικαιοσύνης και των εσωτερικών
    υποθέσεων, της τελωνειακής ένωσης, των εξωτερικών
    σχέσεων, της κοινής εξωτερικής πολιτικής και
    πολιτικής ασφαλείας και των θεσμικών οργάνων,
    λόγω της προσχώρησης της Βουλγαρίας και της
    Ρουμανίας
  type: main
- language: et
  script: Latn
  content: Nõukogu Määrus (EÜ) nr 1791/2006, 20. november 2006 , millega kohandatakse
    teatavaid määrusi ja otsuseid kaupade vaba liikumise, isikute vaba liikumise,
    äriühinguõiguse, konkurentsipoliitika, põllumajanduse (sealhulgas veterinaar-
    ja fütosanitaarõigusaktid), transpordipoliitika, maksustamise, statistika, energeetika,
    keskkonna, justiits- ja siseküsimustes tehtava koostöö, tolliliidu, välissuhete,
    ühise välis- ja julgeolekupoliitika ning institutsioonide valdkondades seoses
    Bulgaaria ja Rumeenia ühinemisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1791/2006, annettu 20 päivänä marraskuuta
    2006 , tiettyjen asetusten ja päätösten mukauttamisesta tavaroiden vapaan liikkuvuuden,
    henkilöiden vapaan liikkuvuuden, yhtiöoikeuden, kilpailupolitiikan, maatalouden
    (eläinlääkintä- ja kasvinsuojelulainsäädäntö mukaan luettuna), liikennepolitiikan,
    verotuksen, tilastojen, energian, ympäristön, oikeus- ja sisäasioiden yhteistyön,
    tulliliiton, ulkosuhteiden, yhteisen ulko- ja turvallisuuspolitiikan sekä toimielinten
    aloilla Bulgarian ja Romanian liittymisen johdosta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 1791/2006 od 20. studenoga 2006. o prilagodbi određenih
    uredbi i odluka u području slobode kretanja robe, slobode kretanja osoba, prava
    trgovačkih društava, politike tržišnog natjecanja, poljoprivrede (uključujući
    veterinarsko i fitosanitarno zakonodavstvo), prometne politike, poreza, statistike,
    energetike, okoliša, suradnje u području pravosuđa i unutarnjih poslova, carinske
    unije, vanjskih odnosa, zajedničke vanjske i sigurnosne politike i institucija,
    zbog pristupanja Bugarske i Rumunjske
  type: main
- language: hu
  script: Latn
  content: A Tanács 1791/2006/EK rendelete ( 2006. november 20. ) az áruk szabad
    mozgása, a személyek szabad mozgása, a vállalati jog, a versenypolitika, a
    mezőgazdaság (ideértve az állat- és növény-egészségügyi jogszabályokat),
    a közlekedéspolitika, az adózás, a statisztika, az energia, a környezetvédelem,
    a bel- és igazságügyi együttműködés, a vámunió, a külkapcsolatok, a
    közös kül- és biztonságpolitika, valamint az intézmények területén elfogadott
    egyes rendeleteknek és határozatoknak Bulgária és Románia csatlakozására
    tekintettel történő kiigazításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1791/2006 del Consiglio, del 20 novembre 2006 , che
    adegua taluni regolamenti e decisioni in materia di libera circolazione delle
    merci, libera circolazione delle persone, diritto delle società, politica della
    concorrenza, agricoltura (compresa la normativa veterinaria e fitosanitaria),
    politica dei trasporti, fiscalità, statistiche, energia, ambiente, cooperazione
    nei settori della giustizia e degli affari interni, unione doganale, relazioni
    esterne, politica estera e di sicurezza comune e istituzioni, a motivo dell'adesione
    della Bulgaria e della Romania
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1791/2006 ( 2006. gada 20. novembrī ), ar ko pielāgo
    atsevišķas regulas un lēmumus brīvas preču aprites, personu pārvietošanās
    brīvības, uzņēmējdarbības tiesību, konkurences politikas, lauksaimniecības
    (tostarp tiesību akti veterinārijas un fitosanitārijas jomā), transporta politikas,
    nodokļu, statistikas, enerģētikas, vides, sadarbības tieslietu un iekšlietu
    jomā, muitas savienības, ārējo attiecību, kopējās ārpolitikas un drošības
    politikas un iestāžu jomā saistībā ar Bulgārijas un Rumānijas pievienošanos
  type: main
- language: lt
  script: Latn
  content: 2006 m. lapkričio 20 d. Tarybos Reglamentas (EB) Nr. 1791/2006 dėl Bulgarijos
    ir Rumunijos stojimo adaptuojantis tam tikrus reglamentus ir sprendimus laisvo
    prekių judėjimo, laisvo asmenų judėjimo, bendrovių teisės, konkurencijos
    politikos, žemės ūkio (įskaitant veterinarijos ir fitosanitarijos teisės
    aktus), transporto politikos, mokesčių, statistikos, energetikos, aplinkos,
    bendradarbiavimo teisingumo ir vidaus reikalų srityse, muitų sąjungos, išorės
    santykių, bendros užsienio ir saugumo politikos bei institucijų srityse
  type: main
- language: mt
  script: Latn
  content: '1791/2006/KE: Regolament tal-Kunsill (KE) Nru 1791/2006 ta'' l- 20 ta’
    Novembru 2006 li jadatta ċerti Regolamenti u deċiżjonijiet fl-oqsma tal-moviment
    liberu ta'' oġġetti, il-moviment liberu ta'' persuni, il-liġi dwar il-kumpanniji,
    il-politika dwar il-kompetizzjoni, l-agrikoltura (inkluż il-leġiżlazzjoni veterinarja
    u fitosanitarja), il-politika dwar it-trasport, it-tassazzjoni, l-istatistika,
    l-enerġija, l-ambjent, il-kooperazzjoni fl-oqsma tal-ġustizzja u l-affarijiet
    interni, l-unjoni doganali, ir-relazzjonijiet esterni, il-politika estera u ta''
    sigurtà komuni u istituzzjonijiet, minħabba l-adeżjoni tal-Bulgarija u r-Rumanija'
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1791/2006 van de Raad van 20 november 2006 tot aanpassing
    van bepaalde verordeningen, besluiten en beschikkingen op het gebied van vrij
    verkeer van goederen, vrij verkeer van personen, vennootschapsrecht, mededingingsbeleid,
    landbouw (met inbegrip van veterinaire en fytosanitaire wetgeving), vervoersbeleid,
    belastingen, statistieken, energie, milieu, samenwerking op het gebied van justitie
    en binnenlandse zaken, douane-unie, externe betrekkingen, gemeenschappelijk buitenlands
    en veiligheidsbeleid en instellingen, in verband met de toetreding van Bulgarije
    en Roemenië
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie Rady WE nr 1791/2006 z dnia 20 listopada 2006 r. dostosowujące
    niektóre rozporządzenia i decyzje w takich dziedzinach, jak: swobodny przepływ
    towarów, swobodny przepływ osób, prawo spółek, polityka konkurencji, rolnictwo
    (w tym prawo weterynaryjne i fitosanitarne), polityka transportowa, opodatkowanie,
    statystyka, energia, środowisko naturalne, współpraca w zakresie wymiaru sprawiedliwości
    i spraw wewnętrznych, unia celna, stosunki zewnętrzne, wspólna polityka zagraniczna
    i bezpieczeństwa oraz instytucje w związku z przystąpieniem Bułgarii i Rumunii'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1791/2006 do Conselho, de 20 de Novembro de 2006
    , que adapta determinados regulamentos e decisões nos domínios da livre circulação
    de mercadorias, livre circulação de pessoas, direito das sociedades, política
    da concorrência, agricultura (incluindo legislação veterinária e fitossanitária),
    política de transportes, fiscalidade, estatísticas, energia, ambiente, cooperação
    nos domínios da justiça e dos assuntos internos, união aduaneira, relações
    externas, política externa e de segurança comum e instituições, em virtude
    da adesão da Bulgária e da Roménia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1791/2006 al Consiliului din 20 noiembrie 2006 de
    adaptare a anumitor regulamente și decizii adoptate în domeniile liberei circulații
    a mărfurilor, liberei circulații a persoanelor, dreptului societăților comerciale,
    politicii în domeniul concurenței, agriculturii (inclusiv legislația sanitar-veterinară
    și fitosanitară), politicii în domeniul transporturilor, fiscalității, statisticii,
    energiei, mediului, cooperării în domeniile justiției și afacerilor interne,
    uniunii vamale, relațiilor externe, politicii externe și de securitate comune
    și instituțiilor, având în vedere aderarea Bulgariei și a României
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1791/2006 z 20. novembra 2006 , ktorým sa z dôvodu
    pristúpenia Bulharska a Rumunska upravujú určité nariadenia a rozhodnutia
    v oblasti voľného pohybu tovaru, slobody pohybu osôb, práva obchodných spoločností,
    politiky hospodárskej súťaže, poľnohospodárstva (vrátane veterinárnych
    a fytosanitárnych právnych predpisov), dopravnej politiky, daní, štatistiky,
    energetiky, životného prostredia, spolupráce v oblasti spravodlivosti a vnútorných
    vecí, colnej únie, vonkajších vzťahov, spoločnej zahraničnej a bezpečnostnej
    politiky a inštitúcií
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1791/2006 z dne 20. novembra 2006 o prilagoditvi
    nekaterih uredb ter odločb in sklepov na področjih prostega pretoka blaga, prostega
    gibanja oseb, prava družb, politike konkurence, kmetijstva (vključno z veterinarsko
    in fitosanitarno zakonodajo), prometne politike, obdavčitve, statistike, energetike,
    okolja, sodelovanja na področjih pravosodja in notranjih zadev, carinske unije,
    zunanjih odnosov, skupne zunanje in varnostne politike ter institucij zaradi pristopa
    Bolgarije in Romunije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1791/2006 del Consejo, de 20 de noviembre de 2006 ,
    por el que se adaptan determinados reglamentos y decisiones en los ámbitos de
    la libre circulación de mercancías, la libre circulación de personas, el derecho
    de sociedades, la política de la competencia, la agricultura (incluida la legislación
    veterinaria y fitosanitaria), la política de transportes, la fiscalidad, las
    estadísticas, la energía, el medio ambiente, la cooperación en los ámbitos
    de la justicia y de los asuntos de interior, la unión aduanera, las relaciones
    exteriores, la política exterior y de seguridad común y las instituciones, como
    consecuencia de la adhesión de Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1791/2006 av den 20 november 2006 om anpassning
    av vissa förordningar och beslut när det gäller fri rörlighet för varor,
    fri rörlighet för personer, bolagsrätt, konkurrenspolitik, jordbruk (även
    veterinär och fytosanitär lagstiftning), transportpolitik, beskattning, statistik,
    energi, miljö, samarbete i rättsliga och inrikes frågor, tullunion, yttre förbindelser,
    den gemensamma utrikes- och säkerhetspolitiken och institutioner, med anledning
    av Bulgariens och Rumäniens anslutning
  type: main
