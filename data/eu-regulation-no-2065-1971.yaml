  content: Règlement (CEE) n° 2065/71 de la Commission, du 27 septembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à l'urée de la sous-position 29.05 A I, originaire des pays en voie de développement
    bénéficiaires de préférences tarifaires prévues par le règlement (CEE) n°
    1309/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2065/71 der Kommission vom 27. September 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Harnstoff
    der Tarifstelle 29.25 A I mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 1309/71 des Rates vom 21. Juni 1971 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2065/71 della Commissione, del 27 settembre 1971,
    relativo al ripristino della riscossione dei dazi della tariffa doganale comune
    applicabili all'urea della sottovoce doganale 29.25 A I originaria dei paesi in
    via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1309/71 del Consiglio del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2065/71 van de Commissie van 27 september 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor ureum van onderverdeling 29.25 AI van oorsprong uit door de bij Verordening
    (EEG) nr. 1309/71 van de Raad van 21 juni 1971 geopende algemene tariefpreferenties
    begunstigde ontwikkelingslanden
