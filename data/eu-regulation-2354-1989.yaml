    Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2354/89 af 31. juli 1989 om genindførelse
