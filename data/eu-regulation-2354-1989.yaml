title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2354/89 of 31 July 1989 re-establishing
    the levying of customs duties on ceramic tableware falling within CN code 6912
    00 50 originating in Brazil to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2354/89 de la Commission du 31 juillet 1989 portant
