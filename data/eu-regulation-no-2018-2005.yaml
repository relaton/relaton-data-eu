title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2018/2005 of 9 December 2005 amending for
    the 59th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2018/2005 de la Commission du 9 décembre 2005 modifiant
    pour la cinquante-neuvième fois le règlement (CE) n o 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n o 467/2001 du Conseil
  type: main
- language: de
  script: Latn
