title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2289/87 of 30 July 1987 providing for transitional
    measures to be adopted for import and export licences, advance fixing certificates,
    STM certificates and STM import licences as a result of the entry into force of
    the Combined Nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2289/87 de la Commission du 30 juillet 1987 prévoyant
    des mesures transitoires pour les certificats d' importation, d' exportation et
    de préfixation, les certificats "MCE" et les certificats d' importation "MCE"
    du fait de l' entrée en vigueur de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2289/87 der Kommission vom 30. Juli 1987 mit Übergangsmaßnahmen
    für die Ein- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen, die
    EHM-Lizenzen und EHM-Einfuhrlizenzen wegen des Inkrafttretens der kombinierten
    Nomenklatur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2289/87 af 30. juli 1987 om overgangsforanstaltninger
    for import- og eksportlicenser, forudfastsættelsesattester, SMS-licenser og SMS-importlicenser
    som følge af den kombinerede nomenklaturs ikrafttrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2289/87 της Επιτροπής
    της 30ής Ιουλίου 1987 που προβλέπει μεταβατικά
    μέτρα για τα πιστοποιητικά εισαγωγής, εξαγωγής
    και προκαθορισμού, τα πιστοποιητικά ΣΜΣ και
    τα πιστοποιητικά εισαγωγής ΣΜΣ λόγω της ενάρξεως
    ισχύος της συνδυασμένης ονοματολογίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2289/87 della Commissione del 30 luglio 1987 che dispone
    misure transitorie relative ai titoli di importazione, di esportazione e di fissazione
    anticipata ai titoli MCS e ai titoli di importazione MCS a seguito dell' entrata
    in vigore della nomenclatura combinata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2289/87 van de Commissie van 30 juli 1987 houdende
