    en ARH-invoercertificaten ingevolge de inwerkingtreding van de gecombineerde nomenclatuur
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2289/87 da Comissão de 30 de Julho de 1987 que
    estatui medidas transitórias em relação aos certificados de importação, de
    exportação e de fixação antecipada e aos certificados MCT e de importação
    MCT, devido à entrada em vigor da nomenclatura combinada
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2289/87 de la Comisión de 30 de julio de 1987 por
    el que se establecen las medidas transitorias en lo que se refiere a los certificados
    de importación, de exportación o fijación anticipada, los certificados MCI
    y los certificados de importación MCI debido a la entrada en vigor de la nomenclatura
    combinada
