id: EURegulation14341980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1434/80 of 5 June 1980 re-establishing the
    levying of customs duties on lead borosilicates, falling within subheading 32.08
    ex B and originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1434/80 de la Commission, du 5 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux borosilicates
    de plomb, de la sous-position 32.08 ex B du tarif douanier commun, originaires
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1434/80 der Kommission vom 5. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Bleiborosilicate der Tarifstelle 32.08 ex B, mit Ursprung
    in Mexiko, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1434/80 af 5. juni 1980 om genindførelse
    af opkrævning af toldafgifter for blyborosilicaten under underposition 32.08
    ex B, som har oprindelse i Mexico og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1434/80 della Commissione, del 5 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai borosilicati di piombo
    della sottovoce 32.08 ex B della tariffa doganale comune, originari del Messico,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1434/80 van de Commissie van 5 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op loodborosilicaten,
    van post 32.08 ex B, van oorsprong uit Mexico, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
