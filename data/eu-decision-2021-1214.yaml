title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1214 of 22 July 2021 authorising
    Poland to prohibit the marketing on its territory of the hemp variety Finola pursuant
    to Council Directive 2002/53/EC (notified under document C(2021) 5295) (Only the
    Polish text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1214 de la Commission du 22 juillet
    2021 autorisant la Pologne à interdire la commercialisation sur son territoire
    de la variété de chanvre Finola conformément à la directive 2002/53/CE du
    Conseil [notifiée sous le numéro C(2021) 5295] (Le texte en langue polonaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1214 der Kommission vom 22. Juli 2021
