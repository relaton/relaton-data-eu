title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 889/2009 of 25 September 2009 amending Council
    Regulation (EC) No 73/2009 and establishing budgetary ceilings for 2009 for the
    partial or optional implementation of the Single Payment Scheme, provided for
    in Council Regulation (EC) No 1782/2003, the annual financial envelopes for the
    Single Area Payment Scheme and the budgetary ceilings applicable to transitional
    payments for fruit and vegetables and for specific support, provided for in Regulation
    (EC) No 73/2009
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 889/2009 de la Commission du 25 septembre 2009 modifiant
    le règlement (CE) n o 73/2009 du Conseil et fixant, pour 2009, des plafonds budgétaires
    pour la mise en œuvre partielle ou facultative du régime de paiement unique,
    prévus par le règlement (CE) n o 1782/2003 du Conseil, les enveloppes financières
    annuelles du régime de paiement unique à la surface et les plafonds budgétaires
    applicables aux paiements transitoires aux fruits et légumes et au soutien spécifique,
    prévus par le règlement (CE) n o 73/2009
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 889/2009 der Kommission vom 25. September 2009 zur
    Änderung der Verordnung (EG) Nr. 73/2009 des Rates und zur Festsetzung der Obergrenzen
    für die partielle oder fakultative Durchführung der Betriebsprämienregelung
    gemäß der Verordnung (EG) Nr. 1782/2003 des Rates, der jährlichen Finanzrahmen
    für die Regelung für die einheitliche Flächenzahlung und der Obergrenzen für
    die Übergangszahlungen für Obst und Gemüse und für die besondere Stützung
    gemäß der Verordnung (EG) Nr. 73/2009 für 2009
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 889/2009 на Комисията от 25
    септември 2009 година за изменение на Регламент
