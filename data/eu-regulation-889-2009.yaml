    за 2009 г. на бюджетните тавани за частично прилагане
    или прилагане по избор на схемата на единно
    плащане, предвидени от Регламент (ЕО) № 1782/2003
    на Съвета, годишните финансови пакети при схемата
    на единно плащане на площ и бюджетните тавани,
    приложими за преходните плащания за плодове
    и зеленчуци и за специфичното подпомагане,
    предвидени от Регламент (ЕО) № 73/2009
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 889/2009 ze dne 25. září 2009 , kterým
    se mění nařízení Rady (ES) č. 73/2009 a kterým se na rok 2009 stanoví
    rozpočtové stropy pro částečné nebo nepovinné provádění režimu jednotné
    platby stanovené nařízením Rady (ES) č. 1782/2003 a roční finanční rámce
