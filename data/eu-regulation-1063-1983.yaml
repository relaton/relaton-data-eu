title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1063/83 of 29 April 1983 re-establishing
    the levying of customs duties on certain sacks and bags used for the packing of
    goods, products of category 93 (code 0930), originating in India, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1063/83 de la Commission du 29 avril 1983 portant rétablissement
    de la perception des droits de douane applicables à certains sacs et sachets
    d' emballage de la catégorie 93 (code 0930), originaires de l' Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1063/83 der Kommission vom 29. April 1983 über die
    Wiedereinführung des Zollsatzes für bestimmte Säcke und Beutel zu Verpackungszwecken
    der Warenkategorie Nr. 93 (Kennziffer 0930), mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1063/83 af 29. april 1983 om genindførelse
    af opkrævning af toldafgifter for bestemte sække og poser til emballage, under
    kategori 93 (kode 0930), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1063/83 της Επιτροπής
    της 29ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένους
    σάκκους και σακκίδια συσκευασίας, της κατηγορίας
    προϊόντων 93 (κωδικός αριθμός 0930), καταγωγής
    Ινδίας, δικαιούχων των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1063/83 della Commissione del 29 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili a taluni sacchi e sacchetti da imballaggio,
    della categoria di prodotti n. 93 (codice 0930), originari dell' India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1063/83 van de Commissie van 29 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    zakken voor verpakkingsdoeleinden van de categorie van produkten nr. 93 (codenummer
    0930), van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
