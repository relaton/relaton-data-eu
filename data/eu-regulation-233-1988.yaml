title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 233/88 of 25 January 1988 opening a Community
    tariff quota for high-quality fresh, chilled or frozen beef and veal falling within
    heading Nos 0201 and 0202 of the combined nomenclature (1988) and for products
    falling within subheadings 0206 10 95 and 0206 29 91 thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 233/88 du Conseil du 25 janvier 1988 portant ouverture
    d'un contingent tarifaire communautaire pour les viandes bovines de haute qualité,
    fraîches, réfrigérées ou congelées des positions 0201 et 0202 et les produits
    de sous-positions 0206 10 95 et 0206 29 91 de la nomenclature combinée (1988)
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 233/88 DES RATES vom 25. Januar 1988 zur Eröffnung
