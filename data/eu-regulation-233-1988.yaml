    Rindfleisch der Positionen 0201 und 0202 und für die Waren der Unterpositionen
    0206 10 95 und 0206 29 91 der Kombinierten Nomenklatur (1988) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 233/88 af 25. januar 1988 om åbning af et
