title:
- language: en
  script: Latn
  content: '94/751/EC: Commission Decision of 14 November 1994 authorizing Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directives 66/404/EEC and 71/161/EEC'
  type: main
- language: fr
  script: Latn
  content: '94/751/CE: Décision de la Commission, du 14 novembre 1994, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences des directives 66/404/CEE
    et 71/161/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '94/751/EG: Entscheidung der Kommission vom 14. November 1994 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinien 66/404/EWG und 71/161/EWG des Rates nicht
    entspricht'
  type: main
- language: da
  script: Latn
  content: '94/751/EF: Kommissionens beslutning af 14. november 1994 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF og 71/161/EØF'
  type: main
- language: el
  script: Grek
  content: '94/751/ΕΚ: Απόφαση της Επιτροπής της 14ης Νοεμβρίου
    1994 που επιτρέπει στα κράτη μέλη να εγκρίνουν
    προσωρινώς την εμπορία του δασικού πολλαπλασιαστικού
    υλικού που δεν πληροί τις απαιτήσεις των οδηγιών
    66/404/ΕΟΚ και 71/161/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '94/751/EY: Komission päätös, tehty 14 päivänä marraskuuta 1994,
    luvan antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivien 66/404/ETY ja 71/161/ETY
    vaatimuksia'
  type: main
- language: it
  script: Latn
  content: '94/751/CE: Decisione della Commissione, del 14 novembre 1994, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisiti prescritti dalle direttive
    66/404/CEE e 71/161/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '94/751/EG: Beschikking van de Commissie van 14 november 1994 tot machtiging
    van de Lid-Staten om tijdelijk toe te staan dat bosbouwkundig teeltmateriaal dat
    niet beantwoordt aan de vereisten van de Richtlijnen 66/404/EEG en 71/161/EEG
    van de Raad in de handel wordt gebracht'
  type: main
- language: pt
  script: Latn
  content: '94/751/CE: Decisão da Comissão, de 14 de Novembro de 1994, que autoriza
    os Estados-membros a permitir temporariamente a comercialização de materiais
    florestais de reprodução que não satisfaçam as exigências das directivas
    66/404/CEE e 71/161/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '94/751/CE: Decisión de la Comisión, de 14 de noviembre de 1994, por
    la que se autoriza a los Estados miembros a permitir temporalmente la comercialización
    de material de reproducción forestal que no cumpla los requisitos de las Directivas
    66/404/CEE y 71/161/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '94/751/EG: Kommissionens beslut av den 14 november 1994 om bemyndigande
    för medlemsstaterna att tillfälligt tillåta saluföring av skogsodlingsmaterial
    som inte uppfyller kraven enligt rådets direktiv 66/404/EEG och 71/161/EEG'
