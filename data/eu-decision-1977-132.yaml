id: EUDecision1977132
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 November 1976 authorizing the French Republic
    not to apply Community treatment to natural honey falling within heading No 04.06
    of the Common Customs Tariff, originating in the People's Republic of China and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/132/CEE: Décision de la Commission, du 16 novembre 1976, autorisant
    la République française à exclure du traitement communautaire le miel naturel,
    de la position 04.06 du Tarif douanier commun, originaire de la République populaire
    de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. November 1976, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammenden und in den anderen
    Mitgliedstaaten im freien Verkehr befindlichen natürlichen Honig der Tarifnummer
    04.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 16. november 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage naturlig honning, som henhører
    under pos. 04.06 i den fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik
    og frit kan omsættes i de andre medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 novembre 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario il miele naturale di cui alla
    voce 04.06 della tariffa doganale comune, originario della Repubblica popolare
    cinese e messo in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 november 1976 waarbij de Franse Republiek
    wordt gemachtigd natuurhonig, van post 04.06 van het gemeenschappelijk douanetarief,
    van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
