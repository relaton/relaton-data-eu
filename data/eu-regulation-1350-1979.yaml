title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1350/79 of 29 June 1979 amending for the
    third time Regulation (EEC) No 610/77 on the determination of prices of adult
    bovine animals on representative Community markets and the survey of prices of
    certain other cattle in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1350/79 de la Commission, du 29 juin 1979, portant
    troisième modification du règlement (CEE) n° 610/77 relatif à la détermination
    des prix des gros bovins constatés sur les marchés représentatifs de la Communauté
    et au relevé des prix de certains autres bovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1350/79 der Kommission vom 29. Juni 1979 zur dritten
    Änderung der Verordnung (EWG) Nr. 610/77 zur Bestimmung der auf den repräsentativen
    Märkten der Gemeinschaft festgestellten Preise für ausgewachsene Rinder und
    zur Ermittlung der Preise einiger anderer Rinder in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1350/79 af 29. juni 1979 om tredje
    ændring af forordning (EØF) nr. 610/77 om bestemmelse af de priser for voksent
    kvæg, der konstateres på Fællesskabets repræsentative markeder, og om registrering
    af priserne for visse andre kvægkategorier i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1350/79 της Επιτροπής
    της 29ης Ιουνίου 1979 περί τρίτης τροποποιήσεως
    του κανονισμού (ΕΟΚ) αριθ. 610/77 «περί καθορισμού
    των τιμών των χονδρών βοοειδών που διαπιστώνονται
    στις αντιπροσωπευτικές αγορές της Κοινότητος
    και της καταγραφής τιμών ορισμένων άλλων βοοειδών
    μέσα στην Κοινότητα»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1350/79 della Commissione, del 29 giugno 1979, che
    reca terza modifica del regolamento (CEE) n. 610/77 relativo alla determinazione
    dei prezzi dei bovini adulti constatati sui mercati rappresentativi della Comunità
    e al rilevamento dei prezzi di taluni altri bovini nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1350/79 van de Commissie van 29 juni 1979 houdende
    derde wijziging van Verordening (EEG) nr. 610/77 betreffende de vaststelling van
    de op de representatieve markten van de Gemeenschap geconstateerde prijzen voor
    volwassen runderen en betreffende de constatering van de prijzen voor sommige
    andere runderen in de Gemeenschap
  type: main
