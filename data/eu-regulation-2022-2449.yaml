title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2449 of 13 December 2022 amending
    Implementing Regulation (EU) No 612/2013 as regards the data registered in messages
    relating to the registration of economic operators involved in the movements of
    excise goods released for consumption in one Member State and moved to another
    Member State to be delivered there for commercial purposes
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2449 de la Commission du 13 décembre
    2022 modifiant le règlement d’exécution (UE) no 612/2013 en ce qui concerne
    les données enregistrées dans les messages relatifs à l’enregistrement des
    opérateurs économiques participant à des mouvements de produits soumis à accise
    mis à la consommation dans un État membre et déplacés vers un autre État
    membre pour y être livrés à des fins commerciales
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2449 der Kommission vom 13. Dezember
    2022 zur Änderung der Durchführungsverordnung (EU) Nr. 612/2013 bezüglich der
    Daten in Meldungen betreffend die Registrierung von Wirtschaftsbeteiligten, die
    verbrauchsteuerpflichtige Waren befördern, die in einem Mitgliedstaat in den
    steuerrechtlich freien Verkehr überführt worden sind und zur Lieferung zu gewerblichen
    Zwecken in einen anderen Mitgliedstaat verbracht werden
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/2449 на Комисията
    от 13 декември 2022 година за изменение на Регламент
    за изпълнение (ЕС) № 612/2013 по отношение на данните,
    съдържащи се в съобщенията, свързани с регистрацията
    на икономическите оператори, които участват
    в движенията на акцизни стоки, освободени за
    потребление в една държава членка и движени
    към друга държава членка, за да бъдат доставени
    там за търговски цели
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/2449 ze dne 13. prosince 2022,
    kterým se mění prováděcí nařízení (EU) č. 612/2013, pokud jde o údaje
    zaznamenané ve zprávách týkajících se registrace hospodářských subjektů
    zapojených do dopravy zboží podléhajícího spotřební dani, které bylo
    propuštěno ke spotřebě v jednom členském státě a dopraveno do jiného
    členského státu za účelem dodání pro obchodní účely
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/2449 af 13. december
    2022 om ændring af gennemførelsesforordning (EU) nr. 612/2013 for så vidt angår
    de data, der er registreret i meddelelser vedrørende registrering af erhvervsdrivende,
    der er involveret i bevægelser af punktafgiftspligtige varer, som er overgået
    til forbrug i en medlemsstat og flyttes til en anden medlemsstat med henblik på
    levering til erhvervsmæssige formål
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/2449 της Επιτροπής
    της 13ης Δεκεμβρίου 2022 για την τροποποίηση του
    εκτελεστικού κανονισμού (ΕΕ) αριθ. 612/2013 όσον
    αφορά τα δεδομένα που καταχωρίζονται στα μηνύματα
    σχετικά με την καταχώριση των οικονομικών
    φορέων που συμμετέχουν σε διακινήσεις προϊόντων
    υποκείμενων σε ειδικό φόρο κατανάλωσης τα
    οποία τίθενται σε ανάλωση σε ένα κράτος μέλος
    και διακινούνται σε άλλο κράτος μέλος προκειμένου
    να παραδοθούν εκεί για εμπορικούς σκοπούς
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/2449, 13. detsember 2022, millega
    muudetakse rakendusmäärust (EL) nr 612/2013 sellistes teatistes registreeritud
    andmete osas, mis on seotud ühes liikmesriigis tarbimisse lubatud ja teise liikmesriiki
    kaubanduslikel eesmärkidel tarnimiseks veetud aktsiisikauba liikumisega seotud
    ettevõtjate registreerimisega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/2449, annettu 13 päivänä
    joulukuuta 2022, täytäntöönpanoasetuksen (EU) N:o 612/2013 muuttamisesta yhden
    jäsenvaltion alueella kulutukseen luovutettujen ja toisen jäsenvaltion alueelle
    kaupallisiin tarkoituksiin luovutettaviksi siirrettyjen tavaroiden siirtoihin
    osallistuvien talouden toimijoiden rekisteröintiä koskeviin sanomiin kirjattavien
    tietojen osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/2449 ón gCoimisiún an 13 Nollaig
    2022 lena leasaítear Rialachán Cur Chun Feidhme (AE) Uimh. 612/2013 a mhéid
    a bhaineann leis na sonraí atá cláraithe i dteachtaireachtaí a bhaineann le
    clárú oibreoirí eacnamaíocha a bhfuil baint acu le gluaiseachtaí earraí
    máil a scaoiltear lena dtomhailt i mBallstát amháin agus a ghluaistear go Ballstát
    eile lena seachadadh ansin chun críoch tráchtála
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/2449 оd 13. prosinca 2022. o izmjeni
    Provedbene uredbe (EU) br. 612/2013 u pogledu podataka registriranih u porukama
    koje se odnose na registraciju gospodarskih subjekata uključenih u kretanje trošarinske
    robe puštene u potrošnju u jednoj državi članici i premještene u drugu državu
    članicu kako bi ondje bila dostavljena u komercijalne svrhe
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2449 végrehajtási rendelete (2022. december 13.)
    a 612/2013/EU végrehajtási rendeletnek a valamely tagállamban szabad forgalomba
    bocsátott és kereskedelmi forgalmazás céljából egy másik tagállamba szállított
    jövedéki termékek szállításában részt vevő gazdasági szereplők nyilvántartásba
    vételével kapcsolatos üzenetekben rögzített adatok tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/2449 della Commissione del 13 dicembre
    2022 che modifica il regolamento di esecuzione (UE) n. 612/2013 per quanto riguarda
    i dati registrati nei messaggi relativi alla registrazione degli operatori economici
    che intervengono nei movimenti di prodotti sottoposti ad accisa immessi in consumo
    in uno Stato membro e trasportati verso un altro Stato membro per esservi consegnati
    per scopi commerciali
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/2449 (2022. gada 13. decembris),
    ar ko groza Īstenošanas regulu (ES) Nr. 612/2013 attiecībā uz datiem, kas
    reģistrēti ziņojumos par tādu ekonomikas dalībnieku reģistrāciju, kuri
    iesaistīti tādu akcīzes preču pārvietošanā, kas nodotas patēriņam vienā
    dalībvalstī un pārvietotas uz citu dalībvalsti, lai tur piegādātu komerciāliem
    mērķiem
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/2449 2022 m. gruodžio 13
    d. kuriuo dėl duomenų, pateikiamų pranešimuose, susijusiuose su ūkinės veiklos
    vykdytojų, dalyvaujančių vykdant akcizais apmokestinamų prekių, išleistų
    vartoti vienos valstybės narės teritorijoje ir gabenamų į kitos valstybės
    narės teritoriją pristatyti komerciniais tikslais, gabenimo veiklą, registracija,
    iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr. 612/2013
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2449 tat-13
    ta’ Diċembru 2022 li jemenda r-Regolament ta’ Implimentazzjoni (UE) Nru 612/2013
    fir-rigward tad-data rreġistrata f’messaġġi relatati mar-reġistrazzjoni
    tal-operaturi ekonomiċi involuti fil-movimenti ta’ oġġetti soġġetti għas-sisa
    rilaxxati għall-konsum fi Stat Membru wieħed u mċaqalqa lejn Stat Membru ieħor
    biex jitwasslu hemmhekk għal finijiet kummerċjali
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/2449 van de Commissie van 13 december
    2022 tot wijziging van Uitvoeringsverordening (EU) nr. 612/2013 wat betreft de
    gegevens die worden geregistreerd in berichten die betrekking hebben op de registratie
    van marktdeelnemers die betrokken zijn bij overbrengingen van accijnsgoederen
    die tot verbruik zijn uitgeslagen in de ene lidstaat en vervolgens naar een andere
    lidstaat worden overgebracht om aldaar voor commerciële doeleinden te worden
    geleverd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/2449 z dnia 13 grudnia 2022
    r. zmieniające rozporządzenie wykonawcze (UE) nr 612/2013 w odniesieniu do danych
    zarejestrowanych w komunikatach dotyczących rejestracji podmiotów gospodarczych
    uczestniczących w przemieszczaniu wyrobów akcyzowych dopuszczonych do konsumpcji
    w jednym państwie członkowskim i przemieszczanych do innego państwa członkowskiego
    w celu dostarczenia ich tam do celów handlowych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/2449 da Comissão de 13 de dezembro
    de 2022 que altera o Regulamento de Execução (UE) n.o 612/2013 no que diz respeito
    aos dados registados em mensagens relativas ao registo de operadores económicos
    envolvidos na circulação de produtos sujeitos a impostos especiais de consumo
    introduzidos no consumo num Estado-Membro e que circulem para outro Estado-Membro
    a fim de aí ser entregues para fins comerciais
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/2449 al Comisiei din 13 decembrie
    2022 de modificare a Regulamentului de punere în aplicare (UE) nr. 612/2013 în
    ceea ce privește datele înregistrate în mesajele referitoare la înregistrarea
    operatorilor economici implicați în deplasările de produse accizabile eliberate
    pentru consum într-un stat membru și deplasate către un alt stat membru pentru
    a fi livrate acolo în scopuri comerciale
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/2449 z 13. decembra 2022, ktorým
    sa mení vykonávacie Komisie (EÚ) č. 612/2013, pokiaľ ide o údaje zaznamenané
    v správach týkajúcich sa registrácie hospodárskych subjektov zapojených
    do prepravy tovaru podliehajúceho spotrebnej dani uvedeného do daňového voľného
    obehu v jednom členskom štáte a prepravovaného do iného členského štátu,
    aby tam bol dodaný na podnikateľské účely
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/2449 z dne 13. decembra 2022 o spremembi
    Izvedbene uredbe (EU) št. 612/2013 glede podatkov, evidentiranih v sporočilih
    v zvezi z registracijo gospodarskih subjektov, vključenih v gibanje trošarinskega
    blaga, ki je bilo sproščeno v porabo v eni državi članici in se giba v drugo
    državo članico, da bi se tam dobavilo v komercialne namene
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/2449 de la Comisión de 13 de diciembre
    de 2022 por el que se modifica el Reglamento de Ejecución (UE) n.o 612/2013 en
    lo que respecta a los datos registrados en los mensajes relativos al registro
    de los operadores económicos que participan en la circulación de productos sujetos
    a impuestos especiales despachados a consumo en un Estado miembro y trasladados
    a otro Estado miembro para ser entregados con fines comerciales
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/2449 av den 13 december
    2022 om ändring av genomförandeförordning (EU) nr 612/2013 vad gäller de uppgifter
    som registrerats i meddelanden om registrering av ekonomiska aktörer som medverkar
    i flyttningar av punktskattepliktiga varor som frisläppts för konsumtion i en
    medlemsstat och flyttats till en annan medlemsstat för att levereras där i kommersiellt
    syfte
  type: main
