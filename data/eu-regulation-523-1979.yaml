title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 523/79 of 20 March 1979 re-establishing
    the levying of customs duties on gloves, protective, for all trades, falling within
    subheading 42.03 B I and originating in Thailand, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 523/79 de la Commission, du 20 mars 1979, portant
    rétablissement de la perception des droits de douane applicables aux gants de
    protection pour tous métiers, de la sous-position 42.03 B I du tarif douanier
    commun, originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 523/79 der Kommission vom 20. März 1979 zur Wiedereinführung
    des Zollsatzes für Schutzhandschuhe für alle Berufe der Tarifstelle 42.03 B
    I, mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 523/79 af 20. marts 1979 om genindførelse
    af opkrævning af toldafgifter for beskyttelseshandsker til erhvervsmæssig brug
    (arbejdshandsker), under underposition 42.03 B I, som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 523/79 della Commissione, del 20 marzo 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai guanti di protezione per qualunque
    mestiere, della sottovoce doganale 42.03 B I originari della Tailandia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 523/79 van de Commissie van 20 maart 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op werkhandschoenen
    en -wanten, van post 42.03 B I, van oorsprong uit Thailand ten behoeve waarvan
    bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
