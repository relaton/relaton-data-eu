title:
- language: en
  script: Latn
  content: '98/659/EC: Commission Decision of 12 November 1998 amending Decision 97/87/EC
    concerning the presentation of supporting and financial documents linked to a
    specific financial contribution by the Community relating to diagnostic and management
    measures for the eradication of foot-and-mouth disease in Greece (notified under
    document number C(1998) 3450) (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/659/CE: Décision de la Commission du 12 novembre 1998 modifiant la
    décision 97/87/CE en ce qui concerne la présentation de pièces techniques et
    financières justificatives liées à une contribution financière spécifique
    de la Communauté relative à des mesures de diagnostic et de gestion pour l''éradication
    de la fièvre aphteuse en Grèce [notifiée sous le numéro C(1998) 3450] (Le
    texte en langue grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
