    die Labordiagnose und die Maßnahmen zur Tilgung der Maul- und Klauenseuche in
    Griechenland (Bekanntgegeben unter Aktenzeichen K(1998) 3450) (Nur der griechische
    Text ist verbindlich)'
  type: main
