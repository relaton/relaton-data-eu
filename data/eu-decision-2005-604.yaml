---
id: EUDecision2005604
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2005/604/EC: Commission Decision of 4 August 2005 amending Decision 93/52/EEC
    as regards the declaration that certain regions of Italy are free of brucellosis
    (B. melitensis) and Decision 2003/467/EC as regards the declaration that certain
    provinces of Italy are free of bovine brucellosis and that the region of Piemonte
    is free of enzootic bovine leucosis (notified under document number C(2005) 2932)'
  type: main
- language: fr
  script: Latn
  content: '2005/604/CE: Décision de la Commission du 4 août 2005 modifiant la décision
    93/52/CEE en ce qui concerne la déclaration selon laquelle certaines régions
    d’Italie sont indemnes de brucellose (B. melitensis) et la décision 2003/467/CE
    en ce qui concerne la déclaration selon laquelle certaines provinces d’Italie
    sont indemnes de brucellose bovine et la région du Piémont est indemne de leucose
    bovine enzootique [notifiée sous le numéro C(2005) 2932]'
  type: main
- language: de
  script: Latn
  content: '2005/604/EG: Entscheidung der Kommission vom 4. August 2005 zur Änderung
    der Entscheidung 93/52/EWG hinsichtlich der Erklärung, dass bestimmte Provinzen
    Italiens frei von Brucellose (B. melitensis) sind, und der Entscheidung 2003/467/EG
    hinsichtlich der Erklärung, dass bestimmte Provinzen Italiens frei von Rinderbrucellose
    sind und dass die Region Piemonte frei von enzootischer Rinderleukose ist (Bekannt
    gegeben unter Aktenzeichen K(2005) 2932)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 4 август 2005 година
    за изменение на Решение 93/52/ЕИО по отношение
    на декларацията, според която някои региони
    в Италия са свободни от бруцелоза (B. melitensis),
    и на Решение 2003/467/ЕО по отношение на декларацията,
    според която някои провинции в Италия са свободни
    от бруцелоза по говедата, а регион Piemonte е свободен
    от ензоотична левкоза по говедата (нотифицирано
    под номер С(2005) 2932)
  type: main
- language: cs
  script: Latn
  content: '2005/604/ES: Rozhodnutí Komise ze dne 4. srpna 2005, kterým se mění
    rozhodnutí 93/52/EHS, pokud jde o prohlášení některých oblastí Itálie
    za prosté brucelózy (B. melitensis), a rozhodnutí 2003/467/ES, pokud jde o
    prohlášení některých provincií Itálie za prosté brucelózy skotu a oblasti
    Piemonte za prostou enzootické leukózy skotu (oznámeno pod číslem K(2005)
    2932)'
  type: main
- language: da
  script: Latn
  content: '2005/604/EF: Kommissionens beslutning af 4. august 2005 om ændring af
    beslutning 93/52/EØF for så vidt angår erklæringen om, at visse italienske
    regioner er fri for brucellose (B. melitensis), og beslutning 2003/467/EF for
    så vidt angår erklæringen om, at visse italienske provinser er fri for kvægbrucellose,
    og at regionen Piemonte er fri for enzootisk kvægleukose (meddelt under nummer
    K(2005) 2932)'
  type: main
- language: el
  script: Grek
  content: '2005/604/EK: Απόφαση της Επιτροπής, της 4ης Αυγούστου
    2005, για την τροποποίηση της απόφασης 93/52/ΕΟΚ
    όσον αφορά τη δήλωση ότι ορισμένες περιφέρειες
    της Ιταλίας είναι απαλλαγμένες από τη βρουκέλωση
    (B. melitensis) και της απόφασης 2003/467/ΕΚ όσον αφορά
    τη δήλωση ότι ορισμένες επαρχίες της Ιταλίας
    είναι απαλλαγμένες από τη βρουκέλωση των βοοειδών
    και ότι η περιφέρεια του Piemonte είναι απαλλαγμένη
    από την ενζωοτική λεύκωση των βοοειδών [κοινοποιηθείσα
    υπό τον αριθμό Ε(2005) 2932]'
  type: main
- language: et
  script: Latn
  content: '2005/604/EÜ: Komisjoni otsus, 4. august 2005, millega muudetakse otsust
    93/52/EMÜ teatavate Itaalia piirkondade ametlikult brutselloosivabaks (B. melitensis)
    tunnistamise suhtes ja otsust 2003/467/EÜ teatavate Itaalia provintside ametlikult
    veiste brutselloosi vabaks ja Piemonte piirkonna veiste ensootilise leukoosi vabaks
    tunnistamise suhtes (teatavaks tehtud numbri K(2005) 2932 all)'
  type: main
- language: fi
  script: Latn
  content: '2005/604/EY: Komission päätös, tehty 4 päivänä elokuuta 2005, päätöksen
    93/52/ETY muuttamisesta siltä osin kuin se koskee tiettyjen Italian alueiden
    julistamista luomistaudista (Br. melitensis) vapaiksi ja päätöksen 2003/467/EY
    muuttamisesta siltä osin kuin se koskee tiettyjen Italian maakuntien julistamista
    nautojen luomistaudista vapaiksi ja Piemonten alueen julistamista naudan tarttuvasta
    leukoosista vapaaksi (tiedoksiannettu numerolla K(2005) 2932)'
  type: main
- language: hr
  script: Latn
  content: '2005/604/EZ: Odluka Komisije od 4. kolovoza 2005. o izmjeni Odluke 93/52/EEZ
    u pogledu izjave prema kojoj su određene regije Italije slobodne od bruceloze
    (B. melitensis ) i Odluke 2003/467/EZ u pogledu izjave prema kojoj su određene
    pokrajine u Italiji slobodne od bruceloze goveda i regija Piemont slobodna od
    enzootske leukoze goveda (priopćena pod brojem C(2005) 2932)'
  type: main
- language: hu
  script: Latn
  content: '2005/604/EK: A Bizottság határozata (2005. augusztus 4.) a 93/52/EGK
    határozat Olaszország egyes régióinak brucellózismentessé (B. melitensis)
    nyilvánítása, és a 2003/467/EK határozat Olaszország egyes tartományainak
    szarvasmarha-brucellózistól mentessé és Piemonte régió a szarvasmarhák
    enzootikus leukózisától mentessé nyilvánítása tekintetében történő
    módosításáról (az értesítés a C(2005) 2932. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2005/604/CE: Decisione della Commissione, del 4 agosto 2005, che modifica
    la decisione 93/52/CEE per quanto riguarda la dichiarazione di talune regioni
    italiane indenni da brucellosi (B. melitensis) e la decisione 2003/467/CE per
    quanto riguarda la dichiarazione di talune province italiane indenni da brucellosi
    bovina e della regione Piemonte indenne da leucosi bovina enzootica [notificata
    con il numero C(2005) 2932]'
  type: main
- language: lv
  script: Latn
  content: '2005/604/EK: Komisijas Lēmums (2005. gada 4. augusts), ar kuru groza
    Lēmumu 93/52/EEK par noteiktu Itālijas reģionu pasludināšanu par brīviem
    no brucelozes (B. melitensis) un Lēmumu 2003/467/EK par noteiktu Itālijas provinču
    pasludināšanu par brīvām no govju brucelozes un par Pjemontas reģiona pasludināšanu
    par reģionu, kas ir brīvs no govju enzootiskās leikozes (izziņots ar dokumentu
    numuru K(2005) 2932)'
  type: main
- language: lt
  script: Latn
  content: '2005/604/EB: 2005 m. rugpjūčio 4 d. Komisijos sprendimas, iš dalies
    keičiantis Sprendimą 93/52/EEB paskelbiant, kad tam tikruose Italijos regionuose
    nėra nustatyta galvijų bruceliozė (B. melitensis), ir Sprendimą 2003/467/EB
    paskelbiant, kad tam tikrose Italijos provincijose nėra nustatyta galvijų bruceliozė
    ir kad Piemonte regione nėra nustatyta enzootinė galvijų leukozė (pranešta
    dokumentu Nr. C(2005) 2932)'
  type: main
- language: mt
  script: Latn
  content: '2005/604/KE: Deċiżjoni tal-Kummissjoni ta’ l- 4 ta’ Awwissu 2005
    li temenda d-Deċiżjoni 93/52/KEE fir-rigward tad-dikjarazzjoni li ċerti provinċji
    fl-Italja huma ħielsa mill-bruċellosi (B. melitensis) u d-Deċiżjoni 2003/467/KE
    fir-rigward tad-dikjarazzjoni li ċerti provinċji ta'' l-Italja huma ħielsa
    mill-bruċellosi tal-bovini u li r-reġjun tal-Piemonte huwa ħieles mill-lewkosi
    enzootika tal-bovini (notifikata taħt dokument numru C(2005) 2932)'
  type: main
- language: nl
  script: Latn
  content: '2005/604/EG: Beschikking van de Commissie van 4 augustus 2005 tot wijziging
    van Beschikking 93/52/EEG wat betreft de verklaring dat bepaalde regio’s in
    Italië brucellosevrij (B. melitensis) zijn en tot wijziging van Beschikking 2003/467/EG
    wat betreft de verklaring dat bepaalde provincies in Italië vrij zijn van runderbrucellose
    en dat de regio Piemonte vrij is van enzoötische boviene leukose (Kennisgeving
    geschied onder nummer C(2005) 2932)'
  type: main
- language: pl
  script: Latn
  content: '2005/604/WE: Decyzja Komisji z dnia 4 sierpnia 2005 r. zmieniająca decyzję
    93/52/EWG w odniesieniu do uznania niektórych włoskich regionów za wolne od
    brucelozy (B. melitensis) oraz decyzję 2003/467/WE w odniesieniu do uznania niektórych
    włoskich prowincji za wolne od brucelozy bydła i regionu Piemont za wolny od
    enzootycznej białaczki bydła (notyfikowana jako dokument nr C(2005) 2932)'
  type: main
- language: pt
  script: Latn
  content: '2005/604/CE: Decisão da Comissão, de 4 de Agosto de 2005, que altera
    a Decisão 93/52/CEE no que se refere à declaração de determinadas regiões
    de Itália como indemnes de brucelose (B. melitensis) e a Decisão 2003/467/CE
    no que se refere à declaração de determinadas províncias de Itália como indemnes
    de brucelose bovina e que a região de Piemonte está indemne de leucose bovina
    enzoótica [notificada com o número C(2005) 2932]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 4 august 2005 de modificare a Deciziei 93/52/CEE în
    ceea ce privește declarația conform căreia anumite regiuni din Italia sunt
    indemne de bruceloză (B. melitensis) și a Deciziei 2003/467/CE în ceea ce privește
    declarația conform căreia anumite provincii din Italia sunt indemne de bruceloză
    bovină, iar regiunea Piemonte este indemnă de leucoză enzootică bovină [notificată
    cu numărul C(2005) 2932]
  type: main
- language: sk
  script: Latn
  content: '2005/604/ES: Rozhodnutie Komisie zo 4. augusta 2005, ktorým sa mení
    a dopĺňa rozhodnutie 93/52/EHS, pokiaľ ide o vyhlásenie, že niektoré oblasti
    Talianska sú bez výskytu brucelózy (B. melitensis), a rozhodnutie 2003/467/ES,
    pokiaľ ide o vyhlásenie, že niektoré provincie Talianska sú bez výskytu
    bovinnej brucelózy a že oblasť Piemonte je bez výskytu enzootickej bovinnej
    leukózy [oznámené pod číslom K(2005) 2932]'
  type: main
- language: sl
  script: Latn
  content: '2005/604/ES: Odločba Komisije z dne 4. avgusta 2005 o spremembah Odločbe
    93/52/EGS v zvezi z razglasitivijo nekaterih dežel Italije kot prostih bruceloze
    (B. melitensis) in Odločbe 2003/467/ES v zvezi z razglasitvijo, da so nekatere
    pokrajine v Italiji proste bruceloze pri govedu in da je dežela Piemont prosta
    enzootske goveje levkoze (notificirano pod dokumentarno številko K(2005) 2932)'
  type: main
- language: es
  script: Latn
  content: '2005/604/CE: Decisión de la Comisión, de 4 de agosto de 2005, por la
    que se modifica la Decisión 93/52/CEE, en lo que respecta a la declaración de
    determinadas regiones de Italia indemnes de brucelosis (B. melitensis) y la Decisión
    2003/467/CE, en lo que respecta a la declaración de determinadas provincias de
    Italia indemnes de brucelosis bovina y de la región de Piemonte indemne de leucosis
    bovina enzoótica [notificada con el número C(2005) 2932]'
  type: main
- language: sv
  script: Latn
  content: '2005/604/EG: Kommissionens beslut av den 4 augusti 2005 om ändring av
    beslut 93/52/EEG när det gäller fastställandet av att vissa regioner i Italien
    är fria från brucellos (B. melitensis) och beslut 2003/467/EG när det gäller
    fastställandet av att vissa regioner i Italien är fria från bovin brucellos
    och av att regionen Piemonte är fri från enzootisk bovin leukos [delgivet med
    nr K(2005) 2932]'
