    Economische Gemeenschap en Turkije tot vaststelling, voor het tijdvak van 1 november
    1982 tot en met 31 oktober 1983, van het aanvullend bedrag dat in mindering moet
    worden gebracht op de heffing die bij invoer in de Gemeenschap van toepassing
