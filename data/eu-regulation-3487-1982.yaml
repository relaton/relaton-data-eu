  content: Council Regulation (EEC) No 3487/82 of 10 December 1982 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and Turkey fixing the additional amount to be deducted from the levy
    on imports into the Community of untreated olive oil, originating in Turkey, for
    the period 1 November 1982 to 31 October 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3487/82 du Conseil, du 10 décembre 1982, concernant
    la conclusion de l' accord sous forme d' échange de lettres entre la Communauté
    économique européenne et la Turquie fixant, pour la période du 1er novembre
    1982 au 31 octobre 1983, le montant additionnel à déduire du prélèvement applicable
    à l' importation dans la Communauté d' huile d' olive non traitée originaire
    de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3487/82 des Rates vom 10. Dezember 1982 über den
    Abschluß des Abkommens in Form eines Briefwechsels zwischen der Europäischen
    Wirtschaftsgemeinschaft und der Türkei zur Festsetzung des vom 1. November 1982
    bis 31. Oktober 1983 geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft
    von nicht behandeltem Olivenöl mit Ursprung in der Türkei von der Abschöpfung
    abzuziehen iste
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3487/82 af 10. december 1982 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Tyrkiet vedrørende fastsættelse for perioden 1. november 1982 til 31. oktober
    1983 af det tillægsbeløb, som skal fratrækkes den afgift, der anvendes ved
    indførsel til Fællesskabet af ikke behandlet olivenolie med oprindelse i Tyrkiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3487/82 τού Συμβουλίου
    τής 10ης Δεκεμβρίου 1982 περί συνάψεως συμφωνίας
    υπό μορφήν ανταλλαγής επιστολών μεταξύ τής
    Ευρωπαϊκής Οικονομικής Κοινότητος καί τής
    Τουρκίας περί καθορισμού, γιά τήν περίοδο από
    1ης Νοεμβρίου 1982 μέχρι 31ης Οκτωβρίου 1983, τού
