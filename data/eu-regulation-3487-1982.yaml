  script: Latn
  content: Regolamento (CEE) n. 3487/82 del Consiglio, del 10 dicembre 1982, relativo
    alla conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e la Turchia, che fissa, per il periodo 1° novembre 1982 -
    31 ottobre 1983, l' importo aggiuntivo da detrarre dal prelievo applicabile all'
    importazione nella Comunità di olio di oliva non trattato originario della Turchia
  type: main
- language: nl
