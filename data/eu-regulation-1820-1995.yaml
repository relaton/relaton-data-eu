  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1820/95, 26. juuli 1995, millega muudetakse
    määrust (EMÜ) nr 2257/92, millega sätestatakse teatavate taimeõlide Madeirale
    tarnimise erikorra üksikasjalikud rakenduseeskirjad ja kehtestatakse prognoositav
    tarnebilanss, ning määrust (EÜ) nr 2883/94, millega kehtestatakse Kanaari saarte
    jaoks nõukogu määruse (EMÜ) nr 1601/92 artiklites 2, 3, 4 ja 5 sätestatud
    erimeetmetega hõlmatud põllumajandussaaduste ja -toodete prognoositav tarnebilanss
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1820/95, annettu 26 päivänä heinäkuuta 1995,
    Madeiran tiettyjen kasviöljyjen erityistä hankintajärjestelmää koskevista
    yksityiskohtaisista säännöistä ja arvioidun hankintataseen vahvistamisesta
    annetun asetuksen (ETY) N:o 2257/92 muuttamisesta sekä Kanariansaarten arvioidun
    hankintataseen vahvistamisesta neuvoston asetuksen (ETY) N:o 1601/92 2-5 artiklassa
    säädettyyn erityiseen järjestelmään kuuluvien maataloustuotteiden osalta
    annetun asetuksen (EY) N:o 2883/94 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1820/95/EK rendelete (1995. július 26.) a Madeira egyes növényi
    olajokkal történő ellátására irányuló egyedi intézkedésekre vonatkozó
    részletes végrehajtási szabályok és a várható mérleg megállapításáról
    szóló 2257/92/EGK rendelet módosításáról, valamint az 1601/92/EGK tanácsi
    rendelet 2., 3., 4. és 5. cikkében előírt egyedi intézkedések hatálya alá
    tartozó mezőgazdasági termékekre vonatkozóan a Kanári-szigetek várható
    ellátási mérlegének megállapításáról szóló 2883/94/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1820/95 della Commissione, del 26 luglio 1995, che
    modifica il regolamento (CEE) n. 2257/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di taluni oli vegetali per Madera e
    al bilancio previsionale di approvvigionamento, nonché il regolamento (CE) n.
    2883/94 che stabilisce il bilancio previsionale di approvvigionamento delle isole
    Canarie per i prodotti agricoli che beneficiano del regime specifico previsto
    dagli articoli da 2 a 5 del regolamento (CEE) n. 1601/92 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1820/95 (1995. gada 26. jūlijs), ar ko groza
    Regulu (EEK) Nr. 2257/92, ar kuru nosaka sīki izstrādātus īstenošanas noteikumus
    īpašajam režīmam attiecībā uz dažu augu eļļu piegādi Madeirai, kā arī
    groza Regulu (EK) Nr. 2883/94, ar ko nosaka paredzamo bilanci to lauksaimniecības
    produktu piegādei Kanāriju salām, attiecībā uz kuriem Padomes Regulas (EEK)
    Nr. 1601/92 2., 3., 4. un 5. pantā paredzēti īpaši pasākumi
  type: main
- language: lt
  script: Latn
  content: 1995 m. liepos 26 d. Komisijos reglamentas (EB) Nr. 1820/95, iš dalies
    keičiantis Reglamentą (EEB) Nr. 2257/92, nustatantį išsamias konkrečios tvarkos
    dėl tam tikrų augalinių aliejų tiekimo į Madeiros salą įgyvendinimo taisykles
    ir sudarantis prognozuojamą tiekimo balansą, bei iš dalies keičiantis Reglamentą
    (EB) Nr. 2883/94, nustatantis prognozuojamą žemės ūkio produktų, kuriems
    taikomos konkrečios priemonės, numatytos Reglamento (EEB) Nr. 1601/92 2, 3,
    4 ir 5 straipsniuose, tiekimo balansą Kanarų saloms
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissijoni (KE) Nru 1820/95 tas-26 ta’ Lulju 1995
    li jemenda r-Regolament (KEE) Nru 2257/92 li jippreskrivi regoli dettaljati għall-implementazzjoni
    ta’ l-arranġamenti speċifiċi għall-fornitura lil Madejra b’ċerti żjut
    ta’bażi veġetali u li jistabbilixxi bilanċ previst, u li jemenda r-Regolament
    (KE) Nru. 2883/94 li jistabbilixxi bilanċ previst għall-fornitura lill-Gżejjer
    Kanarji ta’ prodotti agrikoli li jaqgħu taħt il-miżuri speċifiċi fl-Artikoli
    2, 3, 4 u 5 tar-Regolament tal-Kunsill (KEE) Nru 1601/92
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1820/95 van de Commissie van 26 juli 1995 houdende
    wijziging van enerzijds Verordening (EEG) nr. 2257/92 houdende bepalingen ter
    uitvoering van de specifieke regeling voor de voorziening van Madeira met bepaalde
    plantaardige oliën, en tot vaststelling van de voorzieningsbalans, en anderzijds
    Verordening (EG) nr. 2883/94 tot vaststelling van een geraamde balans voor de
    voorziening van de Canarische eilanden met landbouwprodukten waarvoor de in de
    artikelen 2 tot en met 5 van Verordening (EEG) nr. 1601/92 van de Raad bedoelde
    specifieke regeling geldt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1820/95 z dnia 26 lipca 1995 r. zmieniające
    rozporządzenie (EWG) nr 2257/92 ustanawiające szczegółowe zasady w celu wykonania
    szczególnych ustaleń odnośnie do dostarczania na Maderę niektórych olejów
    roślinnych i ustanawiające prognozę bilansu dostaw oraz zmieniające rozporządzenie
    (WE) nr 2883/94 ustanawiające prognozę bilansu dostaw na Wyspy Kanaryjskie produktów
    rolnych objętych szczególnymi środkami przewidzianymi w art. 2–5 rozporządzenia
    Rady (EWG) nr 1601/92
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1820/95 da Comissão, de 26 de Julho de 1995, que
    altera, por um lado, o Regulamento (CEE) nº 2257/92 que estabelece normas de
    execução do regime específico para o abastecimento em determinados óleos vegetais
    da Madeira e que estabelece a estimativa das necessidades de abastecimento, e,
    por outro, o Regulamento (CE) nº 2883/94, que estabelece a estimativa das necessidades
    de abastecimento das Ilhas Canárias em produtos agrícolas que beneficiam do
    regime específico previsto nos artigos 2º a 5º do Regulamento (CEE) nº 1601/92
    do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 1820/95 al Comisiei din 26 iulie 1995 de modificare
    a Regulamentului (CEE) nr. 2257/92 de stabilire a normelor de aplicare a acordurilor
    specifice de aprovizionare a Madeirei cu anumite uleiuri vegetale și de stabilire
    a unui necesar de aprovizionare, precum și de modificare a Regulamentului (CE)
    nr. 2883/94 de stabilire a necesarului de aprovizionare a Insulelor Canare cu
    produse agricole aflate sub incidența măsurilor specifice prevăzute în articolele
    2, 3, 4 și 5 din Regulamentul (CEE) nr. 1601/92 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1820/95 z 26. júla 1995, ktorým sa mení
    a dopĺňa nariadenie (EHS) č. 2257/92, ktoré stanovuje podrobné pravidlá
    pre uplatňovanie osobitných opatrení pre zásobovanie Madeiry určitými rastlinnými
    olejmi a ktoré ustanovuje predpokladanú rovnováhu pre dodávky poľnohospodárskych
    výrobkov na Kanárske ostrovy obsiahnutú osobitnými opatreniami ustanovenými
    v článkoch 2, 3, 4 a 5 nariadenia Rady (EHS) č. 1601/92
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1820/95 z dne 26. julija 1995 o spremembi Uredbe
    (EGS) št. 2257/92 o določitvi podrobnih pravil za izvajanje posebnih režimov
    oskrbe Madeire z nekaterimi rastlinskimi olji in o določitvi načrtovane bilance
    ter spremembi Uredbe (ES) št. 2883/94 o določitvi načrtovane bilance oskrbe
    Kanarskih otokov s kmetijskimi proizvodi, ki so zajeti v posebnih ukrepih iz členov
    2, 3, 4 in 5 Uredbe Sveta (EGS) št. 1601/92
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1820/95 de la Comisión, de 26 de julio de 1995, por
    el que se modifica, por una parte, el Reglamento (CEE) nº 2257/92, por el que
    se establecen las disposiciones de aplicación del régimen específico para el
    abastecimiento de determinados aceites vegetales a Madeira y el plan de previsiones
    de abastecimiento, y, por otra, el Reglamento (CE) nº 2883/94, por el que se
    establece el plan de previsiones de abastecimiento a las islas Canarias de productos
    agrícolas acogidos al régimen específico establecido en los artículos 2, 3,
    4, y 5 del Reglamento (CEE) nº 1601/92 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1820/95 av den 26 juli 1995 om ändring
    dels av förordning (EEG) nr 2257/92 om fastställande av närmare bestämmelser
    för tillämpning av den särskilda ordningen för tillförsel av vissa vegetabiliska
    oljor till Madeira och om upprättande av den prognostiserade försörjningsbalansen
    för dessa produkter och dels av förordning (EG) nr 2883/94 om upprättande av
    en prognostiserad försörjningsbalans för försörjningen av Kanarieöarna med
    de jordbruksprodukter som omfattas av den särskilda ordningen som föreskrivs
    i artiklarna 2, 3, 4 och 5 i rådets förordning (EEG) nr 1601/92
