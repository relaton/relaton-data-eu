title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1820/95 of 26 July 1995 amending Regulation
    (EEC) No 2257/92 laying down detailed rules for implementation of the specific
    arrangements for supplying Madeira with certain vegetable oils and establishing
    a forecast balance, and amending Regulation (EC) No 2883/94 establishing a forecast
    balance for the supply to the Canary Islands of agricultural products covered
    by the specific measures provided for in Articles 2, 3, 4 and 5 of Council Regulation
    (EEC) No 1601/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1820/95 de la Commission, du 26 juillet 1995, modifiant,
    d'une part, le règlement (CEE) n 2257/92 portant modalités d'application du
    régime spécifique pour l'approvisionnement en certaines huiles végétales pour
    Madère et établissant le bilan prévisionnel d'approvisionnement et, d'autre
    part, le règlement (CE) n° 2883/94 établissant le bilan prévisionnel d'approvisionnement
    des îles Canaries pour les produits agricoles qui bénéficient du régime spécifique
    prévu aux articles 2 à 5 du règlement (CEE) n 1601/92 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1820/95 der Kommission vom 26. Juli 1995 zur Änderung
    der Verordnung (EWG) Nr. 2257/92 mit besonderen Durchführungsbestimmungen zur
    Versorgung Madeiras mit bestimmten pflanzlichen Ölen und zur Erstellung der vorläufigen
    Versorgungsbilanz sowie zur Änderung der Verordnung (EG) Nr. 2883/94 mit der
    Bedarfsvorausschätzung für die Kanarischen Inseln für die landwirtschaftlichen
    Erzeugnisse, die unter die Sonderregelung gemäß den Artikeln 2 bis 5 der Verordnung
    (EWG) Nr. 1601/92 des Rates fallen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1820/95 на Комисията от 26 юли
    1995 година за изменение на Регламент (ЕИО) №
    2257/92 относно определяне на подробни правила
    за прилагане на специфичния режим за снабдяване
    на Мадейра с някои растителни масла и установяващ
    прогнозния баланс за снабдяване и за изменение
    на Регламент (ЕО) № 2883/94 относно установяване
    на прогнозния баланс за снабдяване на Канарските
    острови със селскостопанските продукти, които
    се ползват от предвидения специфичен режим
    в членове 2, 3, 4 и 5 от Регламент (ЕИО) № 1601/92 на
    Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1820/95 ze dne 26. července 1995, kterým
    se mění nařízení (EHS) č. 2257/92 o stanovení prováděcích pravidel pro
    zavedení zvláštních opatření pro dodávku některých rostlinných olejů
    na Madeiru a předběžného odhadu dodávek a nařízení (ES) č. 2883/94 o
    stanovení předběžného odhadu dodávek na Kanárské ostrovy pro zemědělské
    produkty, na které se vztahují zvláštní opatření upravená v článcích
    2, 3, 4 a 5 nařízení Rady (EHS) č. 1601/92
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1820/95 af 26. juli 1995 om ændring
    af forordning (EØF) nr. 2257/92 om gennemførelsesbestemmelser for den særlige
    ordning for forsyning af Madeira med visse vegetabilske olier og om udarbejdelse
    af opgørelsen over forsyningsbehovene og af forordning (EF) nr. 2883/94 om den
    foreløbige forsyningsopgørelse for De Kanariske Øer for de landbrugsprodukter,
    der er omfattet af den ordning, som er fastsat i artikel 2-5 i Rådets forordning
    (EØF) nr. 1601/92
  type: main
- language: el
  script: Grek
