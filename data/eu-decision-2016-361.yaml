title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/361 of 10 March 2016 amending
    Annex I to Decision 2004/211/EC as regards the entry for China in the list of
    third countries and parts thereof from which imports into the Union of live equidae
    and semen, ova and embryos of the equine species are authorised (notified under
    document C(2016) 1450)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/361 de la Commission du 10 mars 2016 modifiant
    l'annexe I de la décision 2004/211/CE en ce qui concerne la mention relative
    à la Chine sur la liste des pays tiers et parties de territoires de ces pays
    en provenance desquels les importations dans l'Union d'équidés vivants et de
    sperme, d'ovules et d'embryons de l'espèce équine sont autorisées [notifiée
    sous le numéro de document C(2016) 1450]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/361 der Kommission vom 10. März 2016
    zur Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich des Eintrags
    für China in der Liste von Drittländern und Teilen von Drittländern, aus denen
    Einfuhren von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen
    in die Europäische Union zugelassen sind (Bekanntgegeben unter Aktenzeichen C(2016)
    1450)
  type: main
- language: bg
  script: Cyrl
