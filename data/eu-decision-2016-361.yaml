    tekintetében engedélyezett harmadik országok és országrészek jegyzékében
    szereplő, Kínára vonatkozó bejegyzés tekintetében történő módosításáról
    (az értesítés a C(2016) 1450. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/361 della Commissione, del 10 marzo 2016,
