    от 10 март 2016 година за изменение на приложение
    I към Решение 2004/211/ЕО по отношение на вписването
    за Китай в списъка на трети страни и части от
    тях, от които е разрешен вносът в Съюза на живи
    еднокопитни и на сперма, яйцеклетки и ембриони
    от еднокопитни (нотифицирано под номер С(2016)
    1450)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/361 ze dne 10. března 2016,
    kterým se mění příloha I rozhodnutí 2004/211/ES, pokud jde o položku týkající
    se Číny v seznamu třetích zemí a jejich částí, ze kterých je povolen
    dovoz živých koňovitých a spermatu, vajíček a embryí druhů koňovitých
    do Unie (oznámeno pod číslem C(2016) 1450)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/361 af 10. marts 2016
    om ændring af bilag I til beslutning 2004/211/EF for så vidt angår oplysningerne
    om Kina i listen over tredjelande og dele af tredjelande, hvorfra import til Unionen
    af levende dyr af hestefamilien samt sæd, æg og embryoner fra dyr af hestefamilien
    er tilladt (meddelt under nummer C(2016) 1450)
  type: main
- language: el
  script: Grek
