title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 808/2006 of 31 May 2006 amending Regulation
    (EC) No 1555/96 as regards the trigger levels for additional duties on tomatoes,
    apricots, lemons, plums, peaches, including nectarines, pears and table grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 808/2006 de la Commission du 31 mai 2006 modifiant
    le règlement (CE) n o 1555/96 en ce qui concerne le volume de déclenchement
    des droits additionnels pour les tomates, les abricots, les citrons, les prunes,
    les pêches, y compris les brugnons et nectarines, les poires et les raisins de
    table
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 808/2006 der Kommission vom 31. Mai 2006 zur Änderung
    der Verordnung (EG) Nr. 1555/96 in Bezug auf die Auslösungsschwellen für die
    Zusatzzölle für Tomaten/Paradeiser, Aprikosen/Marillen, Zitronen, Pflaumen,
    Pfirsiche, einschließlich Brugnolen und Nektarinen, Birnen und Tafeltrauben
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 808/2006 ze dne 31. května 2006 , kterým
    se mění nařízení (ES) č. 1555/96, pokud jde o spouštěcí objemy pro dodatečná
    cla pro rajčata, meruňky, citrony, švestky, broskve, včetně nektarinek, hrušky
    a stolní hrozny
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 808/2006 af 31. maj 2006 om ændring
    af forordning (EF) nr. 1555/96 for så vidt angår den mængde, der udløser tillægstold
    for tomater, abrikoser, citroner, blommer, ferskner (herunder blodferskner og
    nektariner), pærer og spisedruer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 808/2006 της Επιτροπής,
    της 31ης Μαΐου 2006 , για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1555/96 όσον αφορά την ποσότητα ενεργοποίησης
    πρόσθετων δασμών για τις ντομάτες, τα βερίκοκα,
    τα λεμόνια, τα δαμάσκηνα, τα ροδάκινα, συμπεριλαμβανομένων
    των μπρουνιόν και των νεκταρινιών, τα αχλάδια
    και τα επιτραπέζια σταφύλια
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 808/2006, 31. mai 2006 , millega muudetakse
    määrust (EÜ) nr 1555/96 tomatite, aprikooside, sidrunite, ploomide, virsikute
    (sealhulgas nektariinide), pirnide ja lauaviinamarjade suhtes kohaldatavate täiendavate
    tollimaksude käivitusläve osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 808/2006, annettu 31 päivänä toukokuuta 2006
    , asetuksen (EY) N:o 1555/96 muuttamisesta sen määrän osalta, josta alkaen
    tomaateista, aprikooseista, sitruunoista, luumuista, persikoista, nektariineista,
    päärynöistä ja syötäväksi tarkoitetuista viinirypäleistä kannetaan lisätullia
  type: main
- language: hu
  script: Latn
  content: A Bizottság 808/2006/EK rendelete ( 2006. május 31. ) az 1555/96/EK rendeletnek
    a paradicsomra, a kajszibarackra, a citromra, a szilvára, az őszibarackra –
    beleértve a kopaszbarackot és a nektarint –, a körtére és a csemegeszőlőre
    vonatkozó kiegészítő importvámok küszöbszintjei tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 808/2006 della Commissione, del 31 maggio 2006 , recante
    modifica del regolamento (CE) n. 1555/96 per quanto riguarda i livelli limite
    per l’applicazione dei dazi addizionali per i pomodori, le albicocche, i limoni,
    le prugne, le pesche, comprese le pesche noci, le pere e le uve da tavola
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 808/2006 ( 2006. gada 31. maijs ), ar ko groza
    Regulu (EK) Nr. 1555/96 attiecībā uz kontrollīmeni papildnodokļa uzlikšanai
    par tomātiem, aprikozēm, citroniem, plūmēm, persikiem, tostarp gludajiem persikiem
    un nektarīniem, bumbieriem un galda vīnogām
  type: main
- language: lt
  script: Latn
  content: 2006 m. gegužės 31 d. Komisijos reglamentas (EB) Nr. 808/2006, iš dalies
    keičiantis Reglamentą (EB) Nr. 1555/96 dėl intervencinių lygių papildomiems
    pomidorų, abrikosų, citrinų, slyvų, persikų, įskaitant brunonus ir nektarinus,
    kriaušių ir valgomųjų vynuogių muitams
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 808/2006 van de Commissie van 31 mei 2006 tot wijziging
    van Verordening (EG) nr. 1555/96 met betrekking tot de drempelvolumes voor de
    toepassing van de aanvullende rechten voor tomaten, abrikozen, citroenen, pruimen,
    perziken (nectarines daaronder begrepen), peren en tafeldruiven
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 808/2006 z dnia 31 maja 2006 r. zmieniające
    rozporządzenie (WE) nr 1555/96 w zakresie wartości progowych dla dodatkowych
    opłat celnych za pomidory, morele, cytryny, śliwki, brzoskwinie włącznie z
    nektarynami, gruszki i winogrona stołowe
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 808/2006 da Comissão, de 31 de Maio de 2006 , que
    altera o Regulamento (CE) n. o 1555/96 no que se refere ao volume de desencadeamento
    dos direitos adicionais aplicáveis aos tomates, aos damascos, aos limões, às
    ameixas, aos pêssegos, incluindo as nectarinas, às peras e às uvas de mesa
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 808/2006 z 31. mája 2006 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1555/96, pokiaľ ide o aktivačnú úroveň dodatočných
    ciel na rajčiny, marhule, citróny, slivky, broskyne vrátane nektáriniek a
    iných odrôd, hrušky a stolové hrozno
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 808/2006 z dne 31. maja 2006 o spremembi Uredbe
    (ES) št. 1555/96 glede sprožitvene ravni za dodatne dajatve za paradižnike,
    marelice, limone, slive, breskve, vključno z nektarinami, hruške in namizno
    grozdje
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 808/2006 de la Comisión, de 31 de mayo de 2006 , por
    el que se modifica el Reglamento (CE) n o 1555/96 en lo que se refiere al volumen
    de activación de los derechos adicionales aplicables a los tomates, los albaricoques,
    los limones, las ciruelas, los melocotones, incluidos los griñones y las nectarinas,
    las peras y las uvas de mesa
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 808/2006 av den 31 maj 2006 om ändring
    av förordning (EG) nr 1555/96 vad beträffar tröskelvolymen för tilläggstull
    för tomater, aprikoser, citroner, plommon, persikor (inbegripet nektariner),
    päron och bordsdruvor
