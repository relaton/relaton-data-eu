    v imenu Evropske unije zastopa v Stabilizacijsko-pridružitvenem svetu, ustanovljenem
    s Stabilizacijsko-pridružitvenim sporazumom med Evropskima skupnostma in njunimi
    državami članicami na eni strani ter Republiko Albanijo na drugi strani, v zvezi
    s sklepom o določitvi splošnih zahtev za elektronsko izdana dokazila o poreklu
    iz člena 17(4) Dodatka A k Protokolu 4 k navedenemu sporazumu
  type: main
