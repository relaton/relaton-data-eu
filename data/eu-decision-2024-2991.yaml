  content: Decisión (UE) 2024/2991 del Consejo, de 21 de noviembre de 2024, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Estabilización y Asociación creado por el Acuerdo de Estabilización y Asociación
    entre las Comunidades Europeas y sus Estados miembros, por una parte, y la República
    de Albania, por otra, por lo que respecta a una decisión por la que se establecen
    las condiciones generales de las pruebas de origen expedidas por medios electrónicos
    en virtud del artículo 17, apartado 4, del apéndice A del Protocolo n.° 4 de
    dicho Acuerdo
