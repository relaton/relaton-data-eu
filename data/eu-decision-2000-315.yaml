title:
- language: en
  script: Latn
  content: '2000/315/EC: Commission Decision of 28 April 2000 terminating the review
    investigation, pursuant to Article 12 of Council Regulation (EC) No 384/96, of
    the anti-dumping measures applicable to imports of stainless steel fasteners and
    parts thereof originating in Malaysia and Thailand (notified under document number
    C(2000) 1132)'
  type: main
- language: fr
  script: Latn
  content: '2000/315/CE: Décision de la Commission, du 28 avril 2000, clôturant
