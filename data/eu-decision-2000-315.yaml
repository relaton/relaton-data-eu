    nº 384/96 du Conseil, des mesures antidumping applicables aux importations d''éléments
    de fixation en acier inoxydable et de leurs parties originaires de Malaisie et
    de Thaïlande [notifiée sous le numéro C(2000) 1132]'
  type: main
