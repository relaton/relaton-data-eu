  content: Commission Regulation (EEC) No 3634/87 of 11 November 1987 amending Regulation
    (EEC) No 526/86 on transitional measures applicable to trade within the Community
    in goods obtained in Spain, in Portugal or in another Member State under a procedure
    for the relief from, or drawback of, customs duties or other import charges -
    compensatory levy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3634/87 de la Commission du 11 novembre 1987 modifiant
