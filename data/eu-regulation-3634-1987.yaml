    échanges à l' intérieur de la Communauté de marchandises obtenues en Espagne,
    au Portugal ou dans un autre État membre sous un régime comportant suspension
    ou ristourne de droits de douane ou d' autres impositions à l' importation -
    prélèvement compensateur
  type: main
