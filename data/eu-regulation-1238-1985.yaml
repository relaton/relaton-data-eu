    δασμού αντιντάμπινγκ επί των εισαγωγών ορισμένων
    ενσφαίρων τριβέων (ρουλεμάν) καταγωγής Ιαπωνίας
    και εξαγομένων από τη Nippon Seiko KK και άλλες επιχειρήσεις
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1238/85 del Consiglio del 13 maggio 1985 che modifica
    il dazio antidumping definitivo sulle importazioni di alcuni tipi di cuscinetti
    a sfera originari del Giappone ed esportati dalla Nippon Seiko KK ed "altri"
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1238/85 van de Raad van 13 mei 1985 tot wijziging
    van het definitieve anti-dumpingrecht op de invoer van bepaalde kogellagers van
    oorsprong uit Japan, uitgevoerd door Nippon Seiko KK en andere ondernemingen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1238/85 do Conselho, de 13 de Maio de 1985, que
    institui um direito "anti-dumping" definitivo sobre as importações de certos
    rolamentos de esferas originários do Japão e exportados pela Nippon Seiko KK
    e por outras empresas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1238/85 del Consejo, de 13 de mayo de 1985, por el
