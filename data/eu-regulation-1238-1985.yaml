    in Japan, die von Nippon Seiko KK und anderen Unternehmen ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1238/85 af 13. maj 1985 om ændring af den
    endelige antidumpingtold på importen af visse kuglelejer med oprindelse i Japan,
    eksporteret af Nippon Seiko KK og andre
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1238/85 του Συμβουλίου
