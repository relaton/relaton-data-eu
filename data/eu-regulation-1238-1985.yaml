  script: Latn
  content: Council Regulation (EEC) No 1238/85 of 13 May 1985 amending the definitive
    anti-dumping duty on imports of certain ball bearings originating in Japan and
    exported by Nippon Seiko KK and others
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1238/85 du Conseil du 13 mai 1985 modifiant le droit
    antidumping définitif sur les importations de certains roulements à billes originaires
    du Japon et exportés par Nippon Seiko KK et d' autres entreprises
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1238/85 des Rates vom 13. Mai 1985 zur Änderung des
