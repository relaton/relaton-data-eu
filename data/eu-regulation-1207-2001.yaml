---
id: EURegulation12072001
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1207/2001 of 11 June 2001 on procedures to facilitate
    the issue of movement certificates EUR.1, the making-out of invoice declarations
    and forms EUR.2 and the issue of certain approved exporter authorisations under
    the provisions governing preferential trade between the European Community and
    certain countries and repealing Regulation (EEC) No 3351/83
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1207/2001 du Conseil du 11 juin 2001 relatif aux procédures
    prévues par les dispositions régissant les échanges préférentiels entre la
    Communauté européenne et certains pays et destinées à faciliter la délivrance
    des certificats de circulation des marchandises EUR.1, l'établissement des déclarations
    sur facture et des formulaires EUR.2 et la délivrance de certaines autorisations
    d'exportateurs agréés et portant abrogation du règlement (CEE) n° 3351/83
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1207/2001 des Rates vom 11. Juni 2001 über Verfahren
    zur Erleichterung der Ausstellung von Warenverkehrsbescheinigungen EUR.1, der
    Ausfertigung von Erklärungen auf der Rechnung und Formblättern EUR.2 sowie der
    Erteilung bestimmter Zulassungen als anerkannter Ausführer gemäß den Vorschriften
    über Präferenzregelungen im Handel zwischen der Europäischen Gemeinschaft und
    bestimmten Ländern und zur Aufhebung der Verordnung (EG) Nr. 3351/83
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EО) № 1207/2001 на Съвета от 11 юни
    2001 година относно процедурите, улесняващи
    издаването на сертификати за движение на стоките
    EUR.1, съставяне на декларации върху фактури
    и формуляри EUR.2 и издаване на разрешения на
    одобрени износители по реда на разпоредбите
    за преференциална търговия между Европейската
    общност и определени страни и отменящ Регламент
    (ЕИО) № 3351/83
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1207/2001 ze dne 11. června 2001 o postupech
    usnadňujících vydávání průvodních osvědčení EUR.1, vystavování prohlášení
    na fakturách a tiskopisů EUR.2 a vydávání některých oprávnění schváleného
    vývozce podle předpisů upravujících preferenční obchod mezi Evropským
    společenstvím a některými zeměmi a o zrušení nařízení (EHS) č. 3351/83
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1207/2001 af 11. juni 2001 om fremgangsmåder
    til forenkling af udstedelse af EUR.1-varecertifikatet, udfærdigelse af fakturaerklæringer
    og EUR.2-dokumenter samt udstedelsen af visse godkendte eksporttilladelser i henhold
    til bestemmelserne om præferencehandelsordningerne mellem Det Europæiske Fællesskab
    og visse lande og om ophævelse af forordning (EØF) nr. 3351/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1207/2001 του Συμβουλίου,
    της 11ης Ιουνίου 2001, σχετικά με τις διαδικασίες
    διευκόλυνσης της έκδοσης των πιστοποιητικών
    κυκλοφορίας EUR.1, της σύνταξης των δηλώσεων
    τιμολογίου και των εντύπων EUR.2 και της έκδοσης
    ορισμένων αδειών εγκεκριμένου εξαγωγέα, σύμφωνα
    με τις διατάξεις που διέπουν τις προτιμησιακές
    συναλλαγές μεταξύ της Ευρωπαϊκής Κοινότητας
    και ορισμένων χωρών και σχετικά με την κατάργηση
    του κανονισμού (ΕΚ) αριθ. 3351/83
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1207/2001, 11. juuni 2001, millega nähakse
    ette Euroopa Ühenduse ja teatavate riikide vahelist kaubavahetuse enamsoodustusrežiimi
    reguleerivate sätete kohaste liikumissertifikaatide EUR.1 väljastamise, kaubaarve
    deklaratsioonide ja vormide EUR.2 koostamise ning teatavate heakskiidetud eksportija
    tunnistuste väljastamise lihtsustamise kord ning tunnistatakse kehtetuks määrus
    (EMÜ) nr 3351/83
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1207/2001, annettu 11 päivänä kesäkuuta 2001,
    Euroopan yhteisön ja tiettyjen maiden välistä etuuskohteluun oikeutettua kauppaa
    koskevissa säännöksissä vahvistetusta menettelystä EUR.1-tavaratodistusten
    antamisen, kauppalaskuilmoitusten ja EUR.2-lomakkeiden laatimisen ja tiettyjen
    valtuutetun viejän lupien antamisen helpottamiseksi sekä asetuksen (ETY) N:o
    3351/83 kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1207/2001/EK rendelete (2001. június 11.) az Európai Közösség
    és egyes országok közötti preferenciális kereskedelemre irányadó rendelkezések
    alapján az EUR.1 szállítási bizonyítványok kiadásának, a számlanyilatkozatok
    és az EUR.2 nyomtatványok kiállításának, valamint egyes elfogadott exportőri
    engedélyek kiadásának megkönnyítésére irányuló eljárásokról és a
    3351/83/EGK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1207/2001 del Consiglio, dell'11 giugno 2001, sulle
    procedure destinate a facilitare il rilascio dei certificati di circolazione EUR
    1, la compilazione delle dichiarazioni su fattura e dei formulari EUR 2 e la concessione
    della qualifica di esportatore autorizzato previsti dalle disposizioni sugli scambi
    preferenziali tra la Comunità europea e alcuni paesi e che abroga il regolamento
    (CE) n. 3351/83
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1207/2001 (2001. gada 11. jūnijs) par procedūru,
    kas vienkāršo preču pārvadājuma sertifikātu EUR 1 izdošanu, deklarāciju
    faktūrā un EUR 2 veidlapu aizpildīšanu un atļauju izdošanu atzītiem eksportētājiem
    saskaņā ar noteikumiem, kuri regulē Eiropas Kopienas un atsevišķu valstu
    tirdzniecības atvieglojumus, un Regulas (EEK) Nr. 3351/83 atcelšanu
  type: main
- language: lt
  script: Latn
  content: 2001 m. birželio 11 d. Tarybos reglamentas (EB) Nr. 1207/2001 dėl tvarkos,
    skirtos palengvinti judėjimo sertifikatų EUR.1 išdavimą, deklaracijų sąskaitose
    bei formų EUR.2 parengimą ir kai kurių patvirtintų eksportuotojų leidimų
    išdavimą, numatytos nuostatose, reguliuojančiose lengvatinę prekybą tarp
    Europos bendrijos ir kai kurių šalių ir Reglamento (EEB) Nr. 3351/83 panaikinimo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1207/2001 tal-11 ta' Ġunju 2001 dwar
    proċeduri biex jiffaċilitaw il-ħruġ taċ-ċertifikati tal-moviment EUR.1,
    il-ħruġ ta' dikjarazzjonijiet u forom tal-fattura EUR.2 u l-ħruġ ta' ċerti
    awtoriżżazzjonijiet approvati ta' l-esportatur taħt id-dispożizzjonijiet li
    jirregolaw il-kummerċ preferenzjali bejn il-Komunità Ewropea u ċerti pajjiżi
    u li jħassar ir-Regolament (KEE) Nru 3351/83
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1207/2001 van de Raad van 11 juni 2001 betreffende
    procedures ter vergemakkelĳking van de afgifte van certificaten inzake goederenverkeer
    EUR.1, de opstelling van factuurverklaringen en formulieren EUR.2 en de afgifte
    van bepaalde vergunningen "toegelaten exporteur" in het kader van de bepalingen
    die voor het preferentiële handelsverkeer tussen de Europese Gemeenschap en sommige
    landen gelden en tot intrekking van Verordening (EEG) nr. 3351/83
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) NR 1207/2001 z dnia 11 czerwca 2001 r. w sprawie
    procedur ułatwiających wystawianie świadectw przewozowych EUR.1, sporządzanie
    deklaracji na fakturze i formularzy EUR.2 i wydawanie zezwoleń niektórym upoważnionym
    eksporterom w ramach przepisów regulujących handel na warunkach preferencyjnych
    między Wspólnotą Europejską i niektórymi krajami oraz uchylające rozporządzenie
    (EWG) nr 3351/83
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1207/2001 do Conselho, de 11 de Junho de 2001, relativo
    aos procedimentos destinados a facilitar a emissão de certificados de circulação
    EUR.1, a efectuação de declarações na factura e o preenchimento de formulários
    EUR.2, bem como a emissão de determinadas autorizações de exportador autorizado,
    previstos nas disposições que regem o comércio preferencial entre a Comunidade
    Europeia e certos países e que revoga o Regulamento (CEE) n.° 3351/83
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1207/2001 al Consiliului din 11 iunie 2001 privind
    procedurile prevăzute de dispozițiile ce reglementează schimburile preferențiale
    între Comunitatea Europeană și anumite țări, destinate să faciliteze eliberarea
    certificatelor de circulație a mărfurilor EUR.1, întocmirea declarațiilor
    pe factură și a formularelor EUR.2 și eliberarea unor autorizații de exportatori
    desemnați, precum și de abrogare a Regulamentului (CEE) nr. 3351/83
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1207/2001 z 11. júna 2001 o postupoch pre umožnenie
    vydávania sprievodných osvedčení EUR.1, na prípravu fakturačných vyhlásení
    a formulárov EUR.2 a na vydávanie niektorých schválených vývozných povolení
    podľa doložiek spravujúcich preferenčné obchodovanie medzi Európskym spoločenstvom
    a niektorými krajinami a o zrušení nariadenia (EHS) č. 3351/83
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1207/2001 z dne 11. junija 2001 o postopkih za olajšanje
    izdajanja potrdil o gibanju blaga EUR.1, izdelave izjav na računih in obrazcev
    EUR.2 ter izdaje nekaterih dovoljenj za pooblaščenega izvoznika v skladu z določbami,
    ki urejajo preferencialno trgovino med Evropsko skupnostjo in nekaterimi državami
    ter o razveljavitvi Uredbe (EGS) št. 3351/83
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1207/2001 del Consejo, de 11 de junio de 2001, relativo
    al procedimiento destinado a facilitar la expedición de los certificados de circulación
    de mercancías EUR.1, la extensión de las declaraciones en factura y de los formularios
    EUR.2 y la expedición de determinadas autorizaciones de exportador autorizado
    en aplicación de las disposiciones que regulan los intercambios preferenciales
    entre la Comunidad Europea y determinados países, y por el que se deroga el Reglamento
    (CEE) n° 3351/83
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1207/2001 av den 11 juni 2001 om förfaranden
    för att i enlighet med bestämmelserna om förmånshandel mellan Europeiska gemenskapen
    och vissa länder underlätta utfärdande av varucertifikat EUR.1, upprättande
    av fakturadeklarationer och EUR.2-formulär och utfärdande av vissa tillstånd
    för ekonomiska aktörer att fungera som godkända exportörer och om upphävande
    av förordning (EEG) nr 3351/83
  type: main
