title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1176/76 of 19 May 1976 re-establishing the
    levying of the customs duties on electric accumulators, lead-acid accumulators,
    falling within subheading 85.04 A, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1176/76 de la Commission, du 19 mai 1976, portant
    rétablissement de la perception des droits de douane applicables aux accumulateurs
    électriques, au plomb, de la sous-position tarifaire 85.04 A, originaires de
    la Yougoslavie bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1176/76 der Kommission vom 19. Mai 1976 zur Wiedereinführung
    des Zollsatzes für elektrische Akkumulatoren, aus Blei, der Tarifstelle 85.04
    A, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3010/75 des
    Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1176/76 af 19. maj 1976 om genindførelse
    af opkrævning af toldafgifter for elektriske akkumulatorer, blyakkumulatorer,
    under underposition 85.04 A, som har oprindelse i Jugoslavien og omfattes af de
    toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17.
    november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1176/76 della Commissione, del 19 maggio 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli accumulatori elettrici,
    al piombo, della sottovoce doganale 85.04 A, originari della Iugoslavia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1176/76 van de Commissie van 19 mei 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op elektrische
    accumulatoren met loden platen, van onderverdeling 85.04 A, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad
    van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
