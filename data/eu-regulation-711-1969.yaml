    modifica la versione tedesca del regolamento n. 1052/67/CEE relativo alla restituzione
    alla produzione per gli oli d'oliva impiegati nella fabbricazione di determinate
    conserve
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 711/69 van de Commissie van 17 april 1969 houdende
    wijziging van de Duitse versie van Verordening nr. 1052/67/EEG betreffende de
    restitutie bij de produktie voor olijfolie die voor de vervaardiging van bepaalde
    conserven wordt gebruikt
