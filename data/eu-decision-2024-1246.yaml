    die Änderung des Übereinkommens zur Errichtung der EBWE im Hinblick auf die
    Ausdehnung des geografischen Tätigkeitsbereichs der EBWE auf afrikanische Länder
    südlich der Sahara und Irak und die Aufhebung der vorgeschriebenen Kapitalbeschränkung
    für ihre ordentliche Geschäftstätigkeit
