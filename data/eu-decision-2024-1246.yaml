    dans le capital de la Banque européenne pour la reconstruction et le développement
    (BERD) et modifiant l’accord portant création de la BERD en ce qui concerne
    l’extension du périmètre géographique des opérations de la BERD à l’Afrique
    subsaharienne et à l’Iraq, et à la suppression de la limite statutaire imposée
    à l’utilisation du capital au titre des opérations ordinaires
  type: main
