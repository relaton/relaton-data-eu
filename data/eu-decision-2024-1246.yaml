  content: Decision (EU) 2024/1246 of the European Parliament and of the Council of
    24 April 2024 on the subscription by the European Union to additional shares in
    the capital of the European Bank for Reconstruction and Development (EBRD) and
    amending the Agreement establishing the EBRD as regards the extension of the geographic
    scope of EBRD operations to sub-Saharan Africa and Iraq, and the removal of the
    statutory capital limitation on ordinary operations
  type: main
