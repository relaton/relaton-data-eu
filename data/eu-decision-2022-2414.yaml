    της 6ης Δεκεμβρίου 2022 για την τροποποίηση της
    εκτελεστικής απόφασης (ΕΕ) 2020/668 όσον αφορά
    τα εναρμονισμένα πρότυπα σχετικά με τις απαιτήσεις,
    τις δοκιμές και τη σήμανση φίλτρων σωματιδίων
    για μέσα προστασίας της αναπνοής, τις γενικές
    απαιτήσεις για προστατευτική ενδυμασία, τις
