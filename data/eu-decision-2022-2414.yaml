    από κινδύνους σε χυτήρια και κατά τη διάρκεια
    συγκολλήσεων και συναφών διεργασιών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/2414, 6. detsember 2022, millega muudetakse
    rakendusotsust (EL) 2020/668 seoses harmoneeritud standarditega, mis käsitlevad
    hingamisteede kaitsevahendite tahkete osakeste filtrite nõudeid, katsetamist
    ja märgistust, kaitseriietuse üldnõudeid, nõudeid squashis kasutatavatele
    silmakaitsevahenditele ning racquetballis ja squash 57s kasutatavatele silmakaitsevahenditele
    ning valutöö ja keevitus- ja seonduvate protsesside riskide eest kaitsvate jalatsite
    nõudeid ja katsemeetodeid
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/2414, annettu 6 päivänä
    joulukuuta 2022, täytäntöönpanopäätöksen (EU) 2020/668 muuttamisesta siltä
    osin kuin on kyse yhdenmukaistetuista standardeista, joiden aiheina ovat hengityksensuojaimien
    hiukkassuodattimia koskevat vaatimukset, testaus ja merkintä, suojavaatetusta
    koskevat yleiset vaatimukset, squashiin ja squashin kaltaisiin lajeihin tarkoitettuja
    silmiensuojaimia koskevat vaatimukset sekä valimoissa ja hitsauksen ja vastaavien
    prosessien aikana esiintyviltä riskeiltä suojaavia jalkineita koskevat vaatimukset
    ja testausmenetelmät
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2414 ón gCoimisiún an 6 Nollaig 2022
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2020/668 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe maidir le ceanglais, tástáil agus marcáil scagairí
    cáithníní le haghaidh feistí cosanta riospráide, le ceanglais ghinearálta
    maidir le héadaí cosanta, le ceanglais maidir le cosantóirí súl do scuais
    agus cosantóirí súl do liathróid raicéid agus scuais 57 agus le ceanglais
    agus modhanna tástála maidir le coisbheart a thugann cosaint i gcoinne rioscaí
    i dteilgcheártaí agus le linn táthaithe agus próisis ghaolmhara
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/2414 оd 6. prosinca 2022. o izmjeni
    Provedbene odluke (EU) 2020/668 u pogledu usklađenih normi za zahtjeve, ispitivanje
    i označivanje filtara za čestice za zaštitne naprave za disanje, opće zahtjeve
    za zaštitnu odjeću, zahtjeve za štitnike za oči za squash i štitnike za oči
    za racquetball i squash 57 te zahtjeve i metode ispitivanja za obuću za zaštitu
    od rizika u ljevaonicama te pri zavarivanju i srodnim postupcima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2414 végrehajtási határozata (2022. december
    6.) az (EU) 2020/668 végrehajtási határozatnak a légzésvédő eszközök
    részecskeszűrőinek követelményeire, vizsgálatára és jelölésére, a védőruházat
    általános követelményeire, a fallabda (squash), valamint a raketball és a
    squash 57 védőszemüvegekre vonatkozó követelményekre, valamint az öntödékben
    és a hegesztés során jelentkező kockázatok ellen védő lábbelikre vonatkozó
    követelményekre és vizsgálati módszerekre vonatkozó harmonizált szabványok
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2414 della Commissione del 6 dicembre
    2022 che modifica la decisione di esecuzione (UE) 2020/668 per quanto riguarda
    le norme armonizzate sui requisiti, le prove e la marcatura dei filtri antiparticolato
    per i dispositivi di protezione delle vie respiratorie, sui requisiti generali
    per gli indumenti di protezione, sui requisiti per le protezioni per gli occhi
    per lo squash e le protezioni per gli occhi per il racquetball e lo squash 57
    e sui requisiti e i metodi di prova per le calzature di protezione contro i rischi
    presenti nelle fonderie e durante le operazioni di saldatura e i procedimenti
    connessi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/2414 (2022. gada 6. decembris),
    ar ko Īstenošanas lēmumu (ES) 2020/668 groza attiecībā uz saskaņotajiem
    standartiem par prasībām, testēšanu un marķēšanu daļiņu filtriem elpceļu
    aizsargierīcēs, par vispārīgām prasībām aizsargapģērbam, prasībām acu
    aizsargiem skvošam, raketbolam un skvošam 57 un prasībām un testēšanas metodēm
    apaviem aizsardzībai pret risku lietuvēs un metināšanas darbos un tiem radniecīgos
    procesos
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2414 2022 m. gruodžio 6 d.
    kuriuo dėl kvėpavimo organų apsaugos priemonių dalelių filtrų reikalavimų,
    bandymo ir ženklinimo, apsauginės aprangos bendrųjų reikalavimų, skvošui
    skirtiems akių apsaugams ir raketbolui bei skvošui 57 skirtiems akių apsaugams
    keliamų reikalavimų, taip pat avalynės, apsaugančios nuo pavojų liejyklose
    bei suvirinimo ir panašiuose procesuose, reikalavimų ir bandymo metodų darniųjų
    standartų iš dalies keičiamas Įgyvendinimo sprendimas (ES) 2020/668
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2414 tas-6
    ta’ Diċembru 2022 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2020/668
    fir-rigward tal-istandards armonizzati dwar ir-rekwiżiti, l-ittestjar u l-immarkar
    tal-filtri tal-partiċelli għal apparati respiratorji protettivi, ir-rekwiżiti
    ġenerali għall-ilbies protettiv, ir-rekwiżiti għall-protezzjoni tal-għajnejn
    għall-isquash u għall-protezzjoni tal-għajnejn għar-racquetball u l-isquash
    57 u r-rekwiżiti u l-metodi tal-ittestjar għax-xedd tas-saqajn li jipproteġi
    mir-riskji fil-funderiji u waqt l-iwweldjar u proċessi konnessi
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2414 van de Commissie van 6 december 2022
    tot wijziging van Uitvoeringsbesluit (EU) 2020/668 wat betreft geharmoniseerde
    normen inzake eisen, beproeving en merken van deeltjesfilters voor ademhalingsbeschermingsmiddelen,
    algemene eisen voor beschermende kleding, eisen voor oogbescherming voor squash
    en oogbeschermers voor racketball en squash 57 en eisen en beproevingsmethoden
    voor schoeisel ter bescherming tegen risico’s in gieterijen en bij lassen en
    verwante processen
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2414 z dnia 6 grudnia 2022 r. zmieniająca
    decyzję wykonawczą (UE) 2020/668 w odniesieniu do norm zharmonizowanych dotyczących
    wymagań, badania i znakowania filtrów cząsteczkowych stosowanych w sprzęcie
    ochrony układu oddechowego, wymagań ogólnych dotyczących odzieży ochronnej,
    wymagań dotyczących okularów ochronnych stosowanych podczas gry w squasha,
    racquetballa oraz squasha 57 oraz wymagań i metod badań w odniesieniu do obuwia
    chroniącego przed zagrożeniami występującymi w hutnictwie, podczas spawania
    i procesów pokrewnych
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2414 da Comissão de 6 de dezembro de
    2022 que altera a Decisão de Execução (UE) 2020/668 no que diz respeito às
    normas harmonizadas relativas aos requisitos, ensaios e marcação dos filtros
    de partículas para dispositivos de proteção respiratória, aos requisitos gerais
    aplicáveis ao vestuário de proteção, aos requisitos dos protetores oculares
    para squash e dos protetores oculares para racquetball e squash 57, aos requisitos
    e métodos de ensaio do calçado de proteção contra riscos em fundições e
    durante os processos de soldadura e processos associados
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2414 a Comisiei din 6 decembrie
    2022 de modificare a Deciziei de punere în aplicare (UE) 2020/668 în ceea ce
    privește standardele armonizate privind cerințele, încercarea și marcarea
    filtrelor de particule pentru dispozitivele de protecție respiratorie, cerințele
    generale privind îmbrăcămintea de protecție, cerințele pentru protectori
    ai ochilor pentru squash și protectori ai ochilor pentru racquetball și squash
    57 și cerințele și metodele de încercare pentru încălțămintea care protejează
    împotriva riscurilor din turnătorii și din timpul operațiilor de sudare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/2414 zo 6. decembra 2022, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2020/668, pokiaľ ide o harmonizované
    normy o požiadavkách, skúšaní a označovaní filtrov proti časticiam pre
    ochranné prostriedky dýchacích orgánov, všeobecných požiadavkách na ochranné
    odevy, požiadavkách na chrániče očí na squash a chrániče očí na raketbal
    a squash 57 a požiadavkách a skúšobných metódach obuvi chrániacej pred
    rizikami v zlievarňach a pri zváraní a podobných činnostiach
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/2414 z dne 6. decembra 2022 o spremembi
    Izvedbenega sklepa (EU) 2020/668 v zvezi s harmoniziranimi standardi za zahteve
    za filtre za zaščito pred delci za naprave za zaščito dihal, njihovo preizkušanje
    in označevanje, za splošne zahteve za varovalno obleko, za zahteve za ščitnike
    za oči za skvoš ter ščitnike za oči za racquetball in skvoš 57 ter za zahteve
    in preskusne metode za obutev za zaščito pred tveganji v livarnah ter pri varjenju
    in sorodnih postopkih
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/2414 de la Comisión de 6 de diciembre
    de 2022 por la que se modifica la Decisión de Ejecución (UE) 2020/668 en lo
    que respecta a las normas armonizadas sobre los requisitos, los ensayos y el marcado
    de los filtros de partículas para equipos de protección respiratoria, los requisitos
    generales para la ropa de protección, los requisitos para los protectores oculares
    de squash y los protectores oculares de racquetball y squash 57, y los requisitos
    y métodos de ensayo para el calzado protector contra los riesgos en fundiciones
    y en procesos de soldadura
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/2414 av den 6 december 2022
    om ändring av genomförandebeslut (EU) 2020/668 vad gäller harmoniserade standarder
    om krav, provning och märkning för partikelfilter för andningsskydd, allmänna
    fordringar för skyddskläder, krav för ögonskydd för racketsporter samt krav
    och provningsmetoder för skyddsskor mot risker vid gjutning samt vid svetsning
    och liknande processer
