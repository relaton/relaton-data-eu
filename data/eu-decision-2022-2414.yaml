title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2414 of 6 December 2022 amending
    Implementing Decision (EU) 2020/668 as regards harmonised standards on requirements,
    testing and marking of particle filters for respiratory protective devices, general
    requirements for protective clothing, requirements for eye protectors for squash
    and eye protectors for racquetball and squash 57 and requirements and test methods
    for footwear protecting against risks in foundries and during welding and allied
    processes
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2414 de la Commission du 6 décembre
    2022 modifiant la décision d’exécution (UE) 2020/668 en ce qui concerne les
    normes harmonisées relatives aux exigences, aux essais et au marquage des filtres
    à particules pour les appareils de protection respiratoire, aux exigences générales
    relatives aux vêtements de protection, aux exigences relatives aux protecteurs
    de l’œil pour le squash et aux protecteurs de l’œil pour le racquetball
    et le squash 57 et aux exigences et méthodes d’essai applicables aux chaussures
    de protection contre les risques dans les fonderies et lors d’opérations de
    soudage et techniques connexes
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2414 der Kommission vom 6. Dezember 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2020/668 in Bezug auf harmonisierte
    Normen für Anforderungen, Prüfungen und Kennzeichnung von Partikelfiltern für
    Atemschutzgeräte, allgemeine Anforderungen an Schutzkleidung, Anforderungen für
    Augenschutzgeräte für Squash und Augenschutzgeräte für Racquetball und Squash
    57 sowie Anforderungen und Prüfverfahren für Schuhe zum Schutz gegen Risiken
    beim Schweißen und verwandten Verfahren
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/2414 на Комисията
    от 6 декември 2022 година за изменение на Решение
    за изпълнение (ЕС) 2020/668 по отношение на хармонизираните
    стандарти за изискванията, изпитванeто и маркировката
    на филтрите за частици за средствата за защита
    на дихателните органи, общите изисквания за
    защитното облекло, изискванията за защитните
    средства за очите при скуош, ракетбол и скуош
    57 и изискванията и методите за изпитване за
    защитните обувки срещу рискове в леярни и при
    заваряване и сродните процеси
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/2414 ze dne 6. prosince 2022,
    kterým se mění prováděcí rozhodnutí (EU) 2020/668, pokud jde o harmonizované
    normy týkající se požadavků, zkoušení a značení u filtrů proti částicím
    pro ochranné prostředky dýchacích orgánů, obecných požadavků na ochranné
    oděvy, požadavků na ochranné prostředky očí pro squash a na ochranné prostředky
    očí pro raketbal a squash 57 a požadavků a zkušebních metod u ochranné
    obuvi proti rizikům ve slévárnách a při svařování a podobných postupech
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2414 af 6. december 2022
    om ændring af gennemførelsesafgørelse (EU) 2020/668 for så vidt angår harmoniserede
    standarder for krav, prøvning og mærkning af partikelfiltre til åndedrætsværn,
    generelle krav til beskyttelsesbeklædning, krav til øjenbeskyttere til squash
    samt til racquetball og squash 57 og krav og prøvningsmetoder for fodtøj til
    beskyttelse mod risici i støberier og ved svejsning og lignende processer
  type: main
- language: el
  script: Grek
