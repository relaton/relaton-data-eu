title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/895 of 14 May 2025 amending
    Implementing Decision (EU) 2023/941 as regards the harmonised standards for hearing
    protectors, personal fall protection equipment, mountaineering equipment, knee
    protectors, protective clothing against tick bites and electrically insulating
    helmets, drafted in support of Regulation (EU) 2016/425 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/895 de la Commission du 14 mai 2025
    modifiant la décision d’exécution (UE) 2023/941 en ce qui concerne les normes
    harmonisées relatives aux protecteurs individuels contre le bruit, aux équipements
    de protection individuelle contre les chutes de hauteur, aux équipements d’alpinisme
    et d’escalade, aux protecteurs de genoux, aux vêtements de protection contre
    les piqûres de tiques et aux casques électriquement isolants, élaborées à
    l’appui du règlement (UE) 2016/425 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/895 der Kommission vom 14. Mai 2025 zur
