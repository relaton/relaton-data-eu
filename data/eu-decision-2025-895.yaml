    der Verordnung (EU) 2016/425 des Europäischen Parlaments und des Rates erstellten
    harmonisierten Normen für Gehörschützer, persönliche Absturzschutzausrüstung,
    Bergsteigerausrüstung, Knieschutz, Schutzkleidung zum Schutz gegen Zeckenbisse
    und für elektrisch isolierende Helme
  type: main
