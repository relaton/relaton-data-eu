title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 389/98 of 18 February 1998 laying down to
    what extent applications for issue of export licences submitted during February
    1998 for beef and veal products which may benefit from special import treatment
    in Canada may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 389/98 DE LA COMMISSION du 18 février 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de février 1998 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation au
    Canada
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 389/98 DER KOMMISSION vom 18. Februar 1998 über das
    Ausmaß, in dem den im Februar 1998 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr nach Kanada eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 389/98 af 18. februar 1998 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    februar 1998 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    Canada, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 389/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 18ης Φεβρουαρίου 1998 για καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν το Φεβρουάριο 1998 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή στον Καναδά
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 389/98, annettu 18 päivänä helmikuuta 1998,
    Kanadassa erityistuontikohtelun saavien naudanliha-alan tuotteiden helmikuussa
    1998 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 389/98 DELLA COMMISSIONE del 18 febbraio 1998 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di febbraio 1998 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in Canada
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 389/98 VAN DE COMMISSIE van 18 februari 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in februari 1998 ingediende
    aanvragen om uitvoercertificaten voor producten van de sector rundvlees waarvoor
    een bijzondere behandeling geldt bij invoer in Canada
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 389/98 DA COMISSÃO de 18 de Fevereiro de 1998 que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Fevereiro de 1998 em relação a produtos
    do sector da carne de bovino que beneficiam de um tratamento especial na importação
    no Canadá
  type: main
