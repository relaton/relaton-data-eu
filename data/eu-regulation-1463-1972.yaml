title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1463/72 of the Council of 10 July 1972 extending the
    period of validity of Regulation (EEC) No 1267/69 laying down special provisions
    applicable to the importation into the Community from Greece of goods which are
    covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1463/72 du Conseil, du 10 juillet 1972, prorogeant
    la durée de validité du règlement (CEE) n 1267/69 fixant les dispositions particulières
    applicables lors de l'importation dans la Communauté, en provenance de Grèce,
    des marchandises relevant du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1463/72 des Rates vom 10. Juli 1972 zur Verlängerung
    der Geltungsdauer der Verordnung (EWG) Nr. 1267/69 zur Festlegung der Sonderbestimmungen,
    die bei der Einfuhr von unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren
    aus Griechenland in die Gemeinschaft anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF3 nr. 1463/72 af 10. juli 1972 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 1267/69 om fastsættelse af særlige
    bestemmelser der finder anvendelse ved indførsel i Fællesskabet fra Grækenland
    af varer, som omfattes af forordning (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1463/72 del Consiglio, del 10 luglio 1972, che proroga
    la durata di validità del regolamento (CEE) n. 1267/69 che fissa le disposizioni
    particolari applicabili all'importazione nella Comunità di merci soggette al
    regolamento (CEE) n. 1059/69 e provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1463/72 van de Raad van 10 juli 1972 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 1267/69 houdende vaststelling
    van de speciale voorschriften die van toepassing zijn bij de invoer in de Gemeenschap
    van onder Verordening (EEG) nr. 1059/69 vallende goederen van oorsprong uit Griekenland
  type: main
