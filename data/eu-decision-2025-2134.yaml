    Великобритания и Северна Ирландия и с Канада
    относно споразумения за определяне на условията
    за участие на субекти, установени в тези трети
    държави, и на продукти с произход от техните
    територии в процедури за възлагане на поръчки,
    ползващи се с подкрепа по линия на инструмента
    SAFE, създаден с Регламент (ЕС) 2025/1106
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2025/2134 ze dne 18. září 2025 o zmocnění k
    zahájení jednání se Spojeným královstvím Velké Británie a Severního
    Irska a s Kanadou o dohodách, kterými se stanoví podmínky pro účast subjektů
