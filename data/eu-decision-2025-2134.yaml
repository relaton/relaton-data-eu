    pregovora s Ujedinjenom Kraljevinom Velike Britanije i Sjeverne Irske odnosno
    s Kanadom o sporazumima kojima se utvrđuju uvjeti za sudjelovanje subjekata s
    poslovnim nastanom u tim trećim zemljama i proizvoda podrijetlom s njihovih državnih
    područja u nabavama uz potporu iz instrumenta SAFE uspostavljenog Uredbom (EU)
    2025/1106
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2025/2134 határozata (2025. szeptember 18.) a Nagy-Britannia
    és Észak-Írország Egyesült Királyságával, illetve Kanadával kötendő,
    az említett harmadik országokban letelepedett szervezeteknek és a területükről
    származó termékeknek az (EU) 2025/1106 rendelettel létrehozott SAFE eszköz
    által támogatott beszerzésekben való részvételére vonatkozó feltételek
    megállapításáról szóló megállapodásra irányuló tárgyalások megkezdésére
    való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2025/2134 del Consiglio, del 18 settembre 2025, che autorizza
    l’avvio di negoziati, rispettivamente, con il Regno Unito di Gran Bretagna e
    Irlanda del Nord e il Canada, al fine di concludere accordi che definiscano le
    condizioni per la partecipazione di soggetti stabiliti in tali paesi terzi e di
    prodotti originari dei loro territori ad appalti sostenuti dallo strumento SAFE
    istituito dal regolamento (UE) 2025/1106 del Consiglio
  type: main
