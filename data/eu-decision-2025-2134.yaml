    Éireann agus le Ceanada, faoi seach, maidir le comhaontuithe lena leagtar síos
    na coinníollacha maidir le rannpháirtíocht eintiteas atá bunaithe sna tríú
    tíortha sin agus táirgí de thionscnamh a gcríoch sna soláthairtí a fhaigheann
    tacaíocht ó ionstraim SAFE a bunaíodh le Rialachán (AE) 2025/1106
  type: main
