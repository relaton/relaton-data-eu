    un Kanādu par nolīgumiem, ar ko paredz nosacījumus šajās trešās valstīs
    iedibinātu subjektu un to teritoriju izcelsmes ražojumu dalībai iepirkumos,
    kurus atbalsta SAFE instruments, kas izveidots ar Regulu (ES) 2025/1106
  type: main
- language: lt
  script: Latn
