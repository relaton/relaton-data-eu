    luvan antamisesta aloittaa neuvottelut Ison-Britannian ja Pohjois-Irlannin yhdistyneen
    kuningaskunnan ja Kanadan kanssa sopimuksista, joissa vahvistetaan edellytykset
    tällaisiin kolmansiin maihin sijoittautuneiden yhteisöjen ja niiden alueilta
    peräisin olevien tuotteiden osallistumiselle asetuksella (EU) 2025/1106 perustetusta
    SAFE-välineestä tuettuihin hankintoihin
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2025/2134 ón gComhairle an 18 Meán Fómhair 2025 lena n-údaraítear
