title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/2134 of 18 September 2025 authorising the opening
    of negotiations with the United Kingdom of Great Britain and Northern Ireland
    and with Canada, respectively, for agreements laying down the conditions for the
    participation of entities established in such third countries and products originating
    in their territories in the procurements supported by the SAFE Instrument established
    by Regulation (EU) 2025/1106
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/2134 du Conseil du 18 septembre 2025 autorisant l’ouverture
    de négociations avec, respectivement, le Royaume-Uni de Grande-Bretagne et d’Irlande
    du Nord et le Canada, en vue d’accords fixant les conditions de participation
    d’entités établies dans ces pays tiers et de produits originaires de leur
    territoire aux acquisitions bénéficiant d’un soutien au titre de l’instrument
    SAFE établi par le règlement (UE) 2025/1106
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/2134 des Rates vom 18. September 2025 über die Ermächtigung
    zur Aufnahme von Verhandlungen mit dem Vereinigten Königreich Großbritannien
    und Nordirland bzw. mit Kanada über Abkommen zur Festlegung der Bedingungen für
    die Beteiligung von Rechtsträgern mit Sitz in diesen Drittländern und Gütern
    mit Ursprung in deren Hoheitsgebieten an den Beschaffungen, die durch das mit
    der Verordnung (EU) 2025/1106 geschaffene SAFE-Instrument unterstützt werden
  type: main
- language: bg
  script: Cyrl
