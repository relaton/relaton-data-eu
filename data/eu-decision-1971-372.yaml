title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 3 novembre 1971, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les tissus de fibres textiles synthétiques mélangés
    (45 % de laine), de la position 56.07 Ex A du Tarif douanier commun, originaires
    de Roumanie et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/372/EWG: Entscheidung der Kommission vom 3. November 1971, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, die aus Rumänien stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Gewebe aus synthetischen gemischten
    Fasern (45 % Wolle) der Tarifnummer 56.07 ex A des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/372/CEE: Decisione della Commissione, del 3 novembre 1971, che autorizza
    il Regno del Belgio, il Granducato di Lussemburgo e il Regno dei Paesi Bassi ad
    escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche misti
    (45 % di lana), della voce 56.07 ex A della tariffa doganale comune, originari
    della Romania e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/372/EEG: Beschikking van de Commissie van 3 november 1971 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd geverfde weefsels van synthetische stapelvezels gemengd met
    45 % wol, van de post 56.07 ex A van het gemeenschappelijk douanetarief, van oorsprong
    uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten'
  type: main
