title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1385/1999 of 28 June 1999 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira and to determine
    the forecast supply balance for the period 1 July 1999 to 30 June 2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1385/1999, de la Commission, du 28 juin 1999, modifiant
    le règlement (CEE) n° 2999/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement de Madère en produits du secteur des fruits et légumes
    transformés et déterminant le bilan d'approvisionnement pour la période du
    1er juillet 1999 au 30 juin 2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1385/1999 der Kommission vom 28. Juni 1999 zur Änderung
    der Verordnung (EWG) Nr. 2999/92 mit Durchführungsbestimmungen zur Sonderregelung
    für die Versorgung von Madeira mit Verarbeitungserzeugnissen aus Obst und Gemüse
    und zur Errichtung der Versorgungsbilanz für den Zeitraum vom 1. Juli 1999 bis
    30. Juni 2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1385/1999 af 28. juni 1999 om ændring
    af forordning (EØF) nr. 2999/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for Madeira vedrørende forarbejdede frugt- og grøntsagsprodukter,
    og fastsættelse af den foreløbige forsyningsopgørelse, for så vidt angår
    perioden 1. juli 1999 til 30. juni 2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1385/1999 της Επιτροπής,
    της 28ης Ιουνίου 1999, για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2999/92 όσον αφορά τις λεπτομέρειες
    εφαρμογής του ειδικού καθεστώτος για τον εφοδιασμό
    της Μαδέρας με προϊόντα του τομέα των μεταποιημένων
    οπωροκηπευτικών και για τον καθορισμό του
    ισοζυγίου εφοδιασμού για την περίοδο από 1ης
    Ιουλίου 1999 έως 30 Ιουνίου 2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1385/1999, annettu 28 päivänä kesäkuuta 1999,
    Madeiran hedelmä- ja vihannesjalosteiden tuotteiden hankintaa koskevien erityisjärjestelyjen
    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 2999/92 muuttamisesta ja hankintaa koskevan ennakkoarvion määrittämisestä
    ajanjaksolle 1 päivästä heinäkuuta 1999 30 päivään kesäkuuta 2000
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1385/1999 della Commissione del 28 giugno 1999 recante
    modifica del regolamento (CEE) n. 2999/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per Madera e che stabilisce il bilancio di approvvigionamento per il periodo dal
    1o luglio 1999 al 30 giugno 2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1385/1999 van de Commissie van 28 juni 1999 tot aanpassing
    van Verordening (EEG) nr. 2999/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van Madeira met producten van de sector van op basis
    van groenten en fruit verwerkte producten en ter vaststelling van de voorzieningsbalans
    voor de periode van 1 juli 1999 tot en met 30 juni 2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1385/1999 da Comissão de 28 de Junho de 1999 que
    altera o Regulamento (CEE) n° 2999/92, que estabelece normas de execução do
    regime específico de abastecimento da Madeira em produtos do sector dos produtos
    transformados à base de frutas e produtos hortícolas, e determina a estimativa
    das necessidades de abastecimento para o período compreendido entre 1 de Julho
    de 1999 e 30 de Junho de 2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1385/1999 de la Comisión de 28 de junio de 1999 por
    el que se modifica el Reglamento (CEE) n° 2999/92 por el que se establecen disposiciones
    de aplicación del régimen específico de abastecimiento a Madeira de productos
    del sector de las frutas y hortalizas transformadas y establece el plan de abastecimiento
    para el período del 1 de julio de 1999 al 30 de junio de 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1385/1999 av den 28 juni 1999 om ändring
