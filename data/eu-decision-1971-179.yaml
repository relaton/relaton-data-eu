title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 7 avril 1971, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure du traitement
    communautaire les tissus de fibres textiles artificielles discontinues, imprimés,
    de la position Ex 56.07 du Tarif douanier commun, originaires de la Hongrie et
    mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/179/EWG: Entscheidung der Kommission vom 7. April 1971, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die aus Ungarn stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen bedruckten Gewebe aus künstlichen Spinnfasern
    der Tarifnummer ex 56.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/179/CEE: Decisione della Commissione, del 7 aprile 1971, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i tessuti di fibre tessili artificiali
    stampati, della voce ex 56.07 della tariffa doganale comune, originari dell''Ungheria
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/179/EEG: Beschikking van de Commissie van 7 april 1971 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd bedrukte weefsels van kunstmatige stapelvezels van de post ex
    56.07 van het gemeenschappelijk douanetarief, van oorsprong uit Hongarije en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
