  content: '2014/472/EU: Commission Implementing Decision of 16 July 2014 amending
    Annex II to Decision 2006/766/EC as regards the inclusion of the Republic of Moldova
    in the list of third countries and territories from which imports of certain fishery
    products for human consumption are permitted (notified under document C(2014)
    4953)'
  type: main
- language: fr
  script: Latn
