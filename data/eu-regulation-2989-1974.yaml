title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2989/74 of the Council of 26 November 1974 supplementing
    Regulation (EEC) No 232/73 on the implementation of Article 47 of the Act concerning
    the conditions of accession and the adjustments to the Treaties concerning the
    system of trade applicable to the goods covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2989/74 du Conseil, du 26 novembre 1974, complétant
    le règlement (CEE) n° 232/73 fixant les modalités d' application de l' article
    47 de l' acte relatif aux conditions d' adhésion et aux adaptations des traités
    concernant le régime d' échanges applicable aux marchandises relevant du règlement
    (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2989/74 des Rates vom 26. November 1974 zur Ergänzung
    der Verordnung (EWG) Nr. 232/73 über die Durchführungsbestimmungen zu Artikel
    47 der Akte über die Beitrittsbedingungen und die Anpassungen der Verträge betreffend
    die Handelsregelung für Waren, die unter die Verordnung (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2989/74 af 26. november 1974 om tillæg til
    forordning (EØF) nr. 232/73 om gennemførelsesbestemmelserne til artikel 47 i
    Akten vedrørende tiltrædelsesvilkårene og tilpasningerne af traktaterne for
    så vidt angår ordningen, for handel med varer, der omfattes af forordning (EØF)
    nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2989/74 del Consiglio, del 26 novembre 1974, che completa
    il regolamento (CEE) n. 232/73 che stabilisce le modalità di applicazione dell'
    articolo 47 dell' atto relativo alle condizioni di adesione e agli adattamenti
    dei trattati in materia di regime di scambi applicabile alle merci di cui al regolamento
    (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2989/74 van de Raad van 26 november 1974 houdende
    aanvulling van Verordening (EEG) nr. 232/73 tot vaststelling van de bepalingen
    ter uitvoering van artikel 47 van de Akte betreffende de toetredingsvoorwaarden
    en de aanpassing der Verdragen met betrekking tot de handelsregeling die van toepassing
    is op goederen die onder Verordening (EEG) nr. 1059/69 vallen
  type: main
