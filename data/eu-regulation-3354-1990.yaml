    αριθ. 1442/88 του Συμβουλίου για τη χορήγηση, για
    τις αμπελουργικές περιόδους 1989/90 έως 1995/96, πριμοδοτήσεων
    για οριστική εγκατάλειψη αμπελουργικών εκτάσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3354/90 DELLA COMMISSIONE del 22 novembre 1990 che
    modifica il regolamento (CEE) n. 1327/89 che autorizza la Spagna a non applicare
    in alcune zone le misure di cui al regolamento (CEE) n. 1442/88 del Consiglio,
    relativo alla concessione, per le campagne viticole 1989/1990 - 1995/1996, di
    premi di abbandono definitivo di superfici viticole #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3354/90 VAN DE COMMISSIE van 22 november 1990 tot
