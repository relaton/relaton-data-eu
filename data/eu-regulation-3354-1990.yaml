title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3354/90 of 22 November 1990 amending Regulation
    (EEC) No 1327/89 authorizing Spain not to apply in certain areas the measures
    provided for in Council Regulation (EEC) No 1442/88 on the granting, for the 1989/90
    to 1995/96 wine years, of permanent abandonment premiums in respect of wine- growing
    areas
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3354/90 de la Commission du 22 novembre 1990 modifiant
    le règlement (CEE) n° 1327/89 autorisant l'Espagne à ne pas appliquer dans
    certaines zones les mesures prévues au règlement (CEE) n° 1442/88 du Conseil,
    relatif à l'octroi de primes d'abandon définitif de superficies viticoles, pour
    les campagnes viticoles 1989/1990 à 1995/1996
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3354/90 DER KOMMISSION vom 22. November 1990 zur
    Änderung der Verordnung (EWG) Nr. 1327/89 zur Ermächtigung Spaniens, in bestimmten
    Gebieten die mit der Verordnung (EWG) Nr. 1442/88 des Rates über die Gewährung
    von Prämien zur endgültigen Aufgabe von Rebflächen vorgesehenen Maßnahmen
    in den Weinwirtschaftsjahren 1989/90 bis 1995/96 nicht anzuwenden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3354/90 af 22. november 1990 om ændring
    af forordning (EØF) nr. 1327/89 om bemyndigelse af Spanien til i visse zoner
    ikke at anvende foranstaltningerne i forordning (EØF) nr. 1442/88 om ydelse for
    produktionsårene 1989/90 til 1995/96 af præmier for endelig nedlæggelse af
    vinarealer
  type: main
- language: el
  script: Grek
