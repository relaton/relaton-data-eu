title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3935/90 of 20 December 1990 laying down for
    1991 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non- Member countries in the
    200-nautical-mile zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3935/90 du Conseil, du 20 décembre 1990, fixant,
    pour 1991, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de certains pays tiers dans la zone de
    200 milles située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3935/90 DES RATES VOM 20. DEZEMBER 1990 UEBER MASSNAHMEN
    ZUR ERHALTUNG UND BEWIRTSCHAFTUNG DER FISCHBESTAENDE IN DER 200-MEILEN-ZONE VOR
    DER KUESTE DES FRANZOESISCHEN DEPARTEMENTS GUYANA GEGENUEBER SCHIFFEN UNTER DER
    FLAGGE BESTIMMTER DRITTLAENDER ( 1991 )
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3935/90 af 20. december 1990 om fastsættelse
    af en række foranstaltninger for 1991 til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyana kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3935/90 του Συμβουλίου
    της 20ής Δεκεμβρίου 1990 για τον καθορισμό, για
    το 1991, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων, τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    ενός της ζώνης 200 μιλίων η οποία ευρίσκεται
    στα ανοικτά των ακτών του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: it
  script: Latn
