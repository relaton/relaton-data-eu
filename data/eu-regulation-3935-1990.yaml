    STABILISCE, PER IL 1991, TALUNE MISURE DI CONSERVAZIONE E DI GESTIONE DELLE RISORSE
    ITTICHE DA APPLICARE ALLE NAVI BATTENTI BANDIERA DI TALUNI PAESI TERZI NELLA ZONA
    DI 200 MIGLIA SITUATA AL LARGO DELLE COSTE DEL DIPARTIMENTO FRANCESE DELLA GUIANA
  type: main
- language: nl
  script: Latn
  content: VERORDENING ( EEG ) NR. 3935/90 VAN DE RAAD VAN 20 DECEMBER 1990 HOUDENDE
