  content: Décision de la Commission, du 19 décembre 1967, portant octroi à la
    République italienne d'un contingent tarifaire de 5000 taureaux, vaches et génisses,
    des races de Schwyz, du Zimmental et de Fribourg, autres que ceux destinés à
    la boucherie
  type: main
- language: de
  script: Latn
  content: '68/33/EWG: Entscheidung der Kommission vom 19. Dezember 1967 über die
    Gewährung eines Zollkontingents für 5 000 Stück Stiere, Kühe und Färsen der
    Schwyzer, Simmentaler und Freiburger Rasse, nicht zum Schlachten, an die Italienische
    Republik'
  type: main
- language: it
  script: Latn
  content: '68/33/CEE: Decisione della Commissione, del 19 dicembre 1967, relativa
    alla concessione di un contingente tariffario alla Repubblica italiana per 5.000
    capi di tori, vacche e giovenche delle razze Schwyz, di Simmental e di Friburgo,
    esclusi quelli da macello'
  type: main
- language: nl
  script: Latn
  content: '68/33/EEG: Beschikking van de Commissie van 19 december 1967 houdende
    toekenning van een tariefcontingent aan de Italiaanse Republiek voor 5.000 stuks
    stieren, koeien en vaarzen van het Schwyzer ras, van het Simmentaler ras en van
    het Freiburger ras, niet bestemd voor de slacht'
