    produit au moyen d’une souche dérivée d’Escherichia coli W (ATCC 9637) en
    tant que nouvel aliment et modifiant le règlement d’exécution (UE) 2017/2470
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/2215 der Kommission vom 23. Oktober
