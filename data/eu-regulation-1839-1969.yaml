title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1839/69 of the Council of 16 September 1969 supplementing
    Regulation (EEC) No 441/69 laying down additional general rules for granting export
    refunds on products subject to a single price system exported unprocessed or in
    the form of certain goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1839/69 du Conseil, du 16 septembre 1969, complétant
    le règlement (CEE) n° 441/69 établissant des règles générales complémentaires
    concernant l' octroi des restitutions à l' exportation pour les produits soumis
    à un régime de prix uniques, exportés en l' état ou sous forme de certaines
    marchandises ne relevant pas de l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1839/69 des Rates vom 16. September 1969 zur Ergänzung
    der Verordnung (EWG) Nr. 441/69 zur Festlegung ergänzender Grundregeln für die
    Gewährung von Ausfuhrerstattungen für die einer einheitlichen Preisregelung
    unterliegenden Erzeugnisse, die unbearbeitet oder in Form bestimmter, nicht unter
    Anhang II des Vertrages fallender Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1839/69 af 16. september 1969 om tillæg
    til forordning (EØF) nr. 441/69 til fastsættelse af generelle supplerende bestemmelser
    for ydelse af eksportrestitutioner for de produkter, for hvilke der gælder en
    ordning med enhedspriser, og som er udført i uændret stand eller i form af visse
    varer, der ikke omtales i bilag II til traktaten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1839/69 τού Συμβουλίου
    τής 16ης Σεπτεμβρίου 1969 περί συμπληρώσεως τού
    κανονισμού (ΕΟΚ) αριθ. 441/69 «περί θεσπίσεως γενικών
    συμπληρωματικών κανόνων ως πρός τή χορήγηση
    επιστροφών κατά τήν εξαγωγή γιά τά προϊόντα
    τά υποκείμενα σέ καθεστώς ενιαίων τιμών, πού
    εξάγονται στήν κατάσταση πού ευρίσκονται ή
    υπό μορφή ορισμένων εμπορευμάτων πού δέν υπάγονται
    στό παράρτημα ΙΙ τής συνθήκης»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1839/69 del Consiglio, del 16 settembre 1969, che
    completa il regolamento (CEE) n. 441/69 che stabilisce le norme generali complementari
    concernenti la concessione delle restituzioni all' esportazione per i prodotti
    soggetti ad un regime di prezzi unici, esportati allo stato naturale e sotto forma
    di talune merci non comprese nell' allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1839/69 van de Raad van 16 september 1969 tot aanvulling
    van Verordening (EEG) nr. 441/69 houdende aanvullende algemene voorschriften betreffende
    de toekenning van restituties bij uitvoer van produkten die aan een stelsel van
    gemeenschappelijke prijzen zijn onderworpen en die als zodanig of in de vorm van
    bepaalde niet in bijlage II van het Verdrag vermelde goederen worden uitgevoerd
  type: main
