id: EURegulation29151985
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2915/85 of 18 October 1985 laying down to
    what extent applications for issue of export licences submitted during October
    1985 for beef and veal products which may benefit from special import treatment
    in a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2915/85 de la Commission, du 18 octobre 1985, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'octobre 1985 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2915/85 der Kommission vom 18. Oktober 1985 über
    das Ausmaß, in dem den im Oktober 1985 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2915/85 af 18. oktober 1985 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i oktober
    1985 for oksekødprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2915/85 της Επιτροπής
    της 18ης Οκτωβρίου 1985 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Οκτώβριο 1985 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2915/85 della Commissione, del 18 ottobre 1985, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di ottobre 1985 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2915/85 van de Commissie van 18 oktober 1985 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in oktober 1985
    ingediende aanvragen om uitvoercertificaten voor produkten van de sector rundvlees
    waarvoor een bijzondere behandeling geldt bij invoer in een derde land
  type: main
