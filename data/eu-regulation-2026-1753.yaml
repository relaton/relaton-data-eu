    sorozatban gyártott járművek és a különleges rendeltetésű járművek fedélzeti
    akkumulátorának tartósságára, fékrészecske-kibocsátására, elektromos
    járműrendszerének teljesítményére és az alacsony hőmérséklet melletti
    elektromos hatótávolságára vonatkozó környezeti teljesítményi és kibocsátási
    követelmények tekintetében történő módosításáról, valamint az (EU)
