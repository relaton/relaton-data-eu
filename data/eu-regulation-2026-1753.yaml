    (EÚ) 2018/858
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2026/1753 z dne 13. julija 2026 o spremembi
    Uredbe (EU) 2018/858 Evropskega parlamenta in Sveta glede zahtev za okoljsko učinkovitost
    in emisije za trajnost baterije v vozilu, emisije delcev zaradi uporabe zavor,
    moči sistema električnih vozil, dosega električnih vozil pri nizki temperaturi
    za vozila, izdelana v neomejenih serijah, in vozila za posebne namene ter o posodobitvi
    seznama pravilnikov ZN, ki so v delu II Priloge II k Uredbi (EU) 2018/858 priznani
    kot alternativa
  type: main
