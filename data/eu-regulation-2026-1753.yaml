    učinka na okoliš i emisija za trajnost ugrađenih baterija, emisije čestica
    iz kočnica, snagu sustava električnog vozila, autonomiju električnog vozila
    na niskoj temperaturi za vozila proizvedena u neograničenim serijama i vozila
    za posebne namjene te o ažuriranju popisa pravilnika UN-a koji su priznati kao
    alternativni u dijelu II. Priloga II. Uredbi (EU) 2018/858
  type: main
