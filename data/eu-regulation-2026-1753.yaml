    pokud jde o požadavky na environmentální výkonnost a emise týkající se
    životnosti baterie ve vozidle, emisí částic z brzd, systémového výkonu
    elektrických vozidel, dojezdové vzdálenosti elektrických vozidel při nízké
    teplotě u vozidel vyráběných v neomezených sériích a vozidel zvláštního
    určení, a kterým se aktualizuje seznam předpisů OSN uznaných jako alternativa
    v části II přílohy II nařízení (EU) 2018/858
  type: main
