    mocy systemu pojazdu elektrycznego, zasięgu pojazdu elektrycznego w niskiej temperaturze
    dla pojazdów produkowanych w nieograniczonych seriach i pojazdów specjalnego
    przeznaczenia oraz aktualizujące wykaz uznawanych za alternatywne regulaminów
    ONZ w części II załącznika II do rozporządzenia (UE) 2018/858
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2026/1753 da Comissão, de 13 de julho de 2026,
    que altera o Regulamento (UE) 2018/858 do Parlamento Europeu e do Conselho no
    que respeita aos requisitos em matéria de desempenho ambiental e emissões relativos
    à durabilidade da bateria a bordo, às emissões de partículas dos travões,
    à potência do sistema dos veículos elétricos, à autonomia a baixas temperaturas
    dos veículos elétricos produzidos em séries ilimitadas e dos veículos elétricos
    para fins especiais e que atualiza a lista de regulamentos da ONU reconhecidos
    como alternativa no anexo II, parte II, do Regulamento (UE) 2018/858
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2026/1753 al Comisiei din 13 iulie 2026 de modificare
    a Regulamentului (UE) 2018/858 al Parlamentului European și al Consiliului în
    ceea ce privește cerințele privind performanța de mediu și emisiile pentru
    durabilitatea bateriilor instalate la bordul vehiculelor, emisiile de particule
    la frânare, puterea sistemului vehiculului electric, autonomia vehiculelor electrice
    la temperatură scăzută pentru vehiculele produse în serii nelimitate și vehiculele
    cu destinație specială și de actualizare a listei regulamentelor ONU recunoscute
    ca alternative în partea II a anexei II la Regulamentul (UE) 2018/858
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2026/1753 z 13. júla 2026, ktorým
    sa mení nariadenie Európskeho parlamentu a Rady (EÚ) 2018/858, pokiaľ ide
    o environmentálne vlastnosti a požiadavky na emisie týkajúce sa životnosti
    batérií vo vozidle, emisií častíc z bŕzd, systémového výkonu elektrických
    vozidiel, dojazdu elektrických vozidiel pri nízkej teplote vozidiel vyrábaných
    v neobmedzených sériách a vozidiel na špeciálne účely, a ktorým sa aktualizuje
