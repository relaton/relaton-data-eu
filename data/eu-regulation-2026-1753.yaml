    lämpötilassa koskevia ympäristöominaisuuksia ja päästöjä koskevista vaatimuksista
    rajoittamattomina sarjoina valmistettavien ajoneuvojen ja erikoiskäyttöön tarkoitettujen
    ajoneuvojen osalta sekä asetuksen (EU) 2018/858 liitteessä II olevassa II osassa
