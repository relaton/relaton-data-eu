  script: Latn
  content: Regolamento delegato (UE) 2026/1753 della Commissione, del 13 luglio 2026,
    che modifica il regolamento (UE) 2018/858 del Parlamento europeo e del Consiglio
    per quanto riguarda le prescrizioni in materia di prestazioni ambientali e di
    emissioni per la durabilità delle batterie di bordo, le emissioni di particolato
    dai freni, la potenza di sistema dei veicoli elettrici, l’autonomia dei veicoli
    elettrici a bassa temperatura per i veicoli prodotti in serie illimitata e i veicoli
    per uso speciale, e che aggiorna l’elenco dei regolamenti ONU riconosciuti come
    alternativi nell’allegato II, parte II, del regolamento (UE) 2018/858
  type: main
- language: lv
  script: Latn
