title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/1753 of 13 July 2026 amending
    Regulation (EU) 2018/858 of the European Parliament and of the Council as regards
    the environmental performance and emission requirements for in-vehicle battery
    durability, brake particle emissions, electric vehicle system power, electric
    vehicle range at low temperature of vehicles produced in unlimited series and
    special purpose vehicles, and updating the list of UN Regulations recognised as
    alternative in Part II of Annex II to Regulation (EU) 2018/858
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/1753 de la Commission du 13 juillet 2026
    modifiant le règlement (UE) 2018/858 du Parlement européen et du Conseil en
    ce qui concerne les prescriptions en matière de performances environnementales
    et d’émissions pour la durabilité des batteries embarquées, les émissions
    de particules de frein, la puissance du système des véhicules électriques,
    l’autonomie des véhicules électriques à basse température pour les véhicules
    produits en séries illimitées et les véhicules à usage spécial, et mettant
    à jour la liste, figurant dans la partie II de l’annexe II du règlement (UE)
    2018/858, des règlements de l’ONU reconnus comme des mesures alternatives
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/1753 der Kommission vom 13. Juli 2026 zur
    Änderung der Verordnung (EU) 2018/858 des Europäischen Parlaments und des Rates
    hinsichtlich der Anforderungen an die Umweltverträglichkeit und der Emissionsanforderungen
    für die Dauerhaltbarkeit von bordeigenen Batterien, die Bremspartikelemissionen,
    die Leistung des Elektrofahrzeugsystems, die Reichweite von Elektrofahrzeugen
    bei niedrigen Temperaturen von in unbegrenzter Serie hergestellten Fahrzeugen
    und Fahrzeugen mit besonderer Zweckbestimmung und zur Aktualisierung der Liste
    der in Anhang II Teil II der Verordnung (EU) 2018/858 als Alternative anerkannten
    UN-Regelungen
  type: main
