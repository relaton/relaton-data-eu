  script: Latn
  content: Reglamento Delegado (UE) 2026/1753 de la Comisión, de 13 de julio de 2026,
    por el que se modifica el Reglamento (UE) 2018/858 del Parlamento Europeo y del
    Consejo en lo que respecta a los requisitos de eficacia medioambiental y de emisiones
    relativos a la durabilidad de las baterías integradas en los vehículos, las
    emisiones de partículas de los frenos, la potencia del sistema de los vehículos
    eléctricos, la autonomía de los vehículos eléctricos a bajas temperaturas
    para los vehículos fabricados en series ilimitadas y los vehículos especiales,
    y por el que se actualiza la lista de Reglamentos de NU reconocidos como alternativa
    en la parte II del anexo II del Reglamento (UE) 2018/858
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2026/1753 av den 13 juli 2026
    om ändring av Europaparlamentets och rådets förordning (EU) 2018/858 vad gäller
    miljöprestanda- och utsläppskrav för fordonsbatteriers hållbarhet, bromspartikelutsläpp,
