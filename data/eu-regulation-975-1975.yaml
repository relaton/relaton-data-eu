title:
- language: en
  script: Latn
  content: Regulation (EEC) No 975/75 of the Commission of 15 April 1975 re-establishing
    the levying of customs duties on sodium hydrogen glutamate falling within subheading
    ex 29.23 D III, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 975/75 de la Commission, du 15 avril 1975, portant
    rétablissement de la perception des droits de douane applicables à l'hydrogénoglutamate
    de sodium, de la sous-position tarifaire EX 29.23 D III, originaire des pays en
    voie de développement bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 975/75 der Kommission vom 15. April 1975 zur Wiedereinführung
    des Zollsatzes für Natriumwasserstoffglutamat, der Tarifstelle ex 29.23 D III,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3054/74
    des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 975/75 af 15. april 1975 om genindførelse
    af opkrævning af toldafgifter for natriumhydrogenglutamat, under underposition
    ex 29.23 D III, som har oprindelse i udviklinslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 975/75 della Commissione, del 15 aprile 1975, che
    ripristina la riscossione dei dazi doganali applicabili all'idrogenoglutammato
    di sodio, della sottovoce doganale n. ex 29.23 D III, originario dei paesi in
    via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 975/75 van de Commissie van 15 april 1975 houdende
    wederinstelling van de heffing van de douanerechten voor natriumwaterstofglutamaat,
    van onderverdeling ex 29.23 D III, van oorsprong uit de ontwikkelingslanden ten
    behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974
    tariefpreferenties werden geopend
  type: main
