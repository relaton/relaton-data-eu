title:
- language: fr
  script: Latn
  content: Décision 64/501/CEE de la Commission, du 31 juillet 1964, autorisant la
    perception de taxes compensatoires à l'importation, en République italienne,
    de dextrines et d'amidons et fécules solubles ou torréfiés, ainsi que de parements
    et apprêts préparés, à base de matières amylacées, en provenance de certains
    États membres
  type: main
- language: de
  script: Latn
  content: '64/501/EWG: Entscheidung der Kommission vom 31. Juli 1964 über die Erhebung
    von Ausgleichsabgaben auf Einfuhren von Dextrin, löslicher oder gerösteter Stärke
    sowie von zubereiteten Zurichtemitteln und zubereiteten Appreturen auf der Grundlage
    von Stärke aus einigen Mitgliedstaaten in die Italienische Republik'
  type: main
- language: it
  script: Latn
  content: '64/501/CEE: Decisione della Commissione, del 31 luglio 1964, che autorizza
    la riscossione di tasse di compensazione all''importazione nella Repubblica italiana
    di destrine, amidi e fecole solubili o torrefatte, e di bozzime e appretti preparati
    a base di sostanze amidacee, provenienti da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/501/EEG: Beschikking van de Commissie van 31 juli 1964 houdende machtiging
    tot het leggen van compenserende heffingen op de invoer in de Italiaanse Republiek
    van dextrine, oplosbaar of geroost zetmeel en preparaten voor het appreteren op
    basis van zetmeel of van zetmeelderivaten, uit bepaalde Lid-Staten'
  type: main
