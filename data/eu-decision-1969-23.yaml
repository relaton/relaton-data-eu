title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 décembre 1968, portant octroi du concours
    du FSE au bénéfice de la République fédérale d'Allemagne pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    des "Ausfuhrungsbehorden für Unfallversicherung" et d'autres organismes allemands
  type: main
- language: de
  script: Latn
  content: '69/23/EWG: Entscheidung der Kommission vom 19. Dezember 1968 über die
    Gewährung eines Zuschusses aus dem ESF an die Bundesrepublik Deutschland zu Aufwendungen
    für von einigen Ausführungsbehörden für Unfallversicherung und anderen deutschen
    Körperschaften durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '69/23/CEE: Decisione della Commissione, del 19 dicembre 1968, relativa
    alla concessione di un contributo del FSE a favore della Repubblica federale di
    Germania per spese concernenti operazioni di rieducazione professionale effettuate
    da «Ausführungsbehörden für Unfallversicherung» e da altri enti tedeschi'
  type: main
- language: nl
  script: Latn
  content: '69/23/EEG: Beschikking van de Commissie van 19 december 1968 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Bondsrepubliek Duitsland
    voor door de "Ausführungsbehörden für Unfallversicherung" en andere Duitse
    instellingen gemaakte herscholingskosten'
