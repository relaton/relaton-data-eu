  script: Latn
  content: Regolamento (CEE) n. 3416/85 della Commissione del 4 dicembre 1985 che
    modifica il regolamento (CEE) n. 1562/85, che stabilisce le modalità di applicazione
    delle misure intese a promuovere la trasformazione delle arance e la commercializzazione
    dei prodotti trasformati a base di limoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3416/85 van de Commissie van 4 december 1985 tot
