    zur Förderung der Apfelsinenverarbeitung und der Vermarktung von Verarbeitungserzeugnissen
    aus Zitronen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3416/85 af 4. december 1985 om ændring
