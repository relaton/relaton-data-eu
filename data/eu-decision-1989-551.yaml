title:
- language: en
  script: Latn
  content: '89/551/EEC: Council Decision of 29 September 1989 on the conclusion of
    an Agreement in the form of an exchange of letters concerning the provisional
    application of the Protocol establishing, for the period from 27 June 1989 to
    26 June 1992, the fishing rights and financial compensation provided for in the
    Agreement between the European Economic Community and the Government of the Republic
    of Equatorial Guinea on fishing off the coast of Equatorial Guinea'
  type: main
- language: fr
  script: Latn
  content: '89/551/CEE: Décision du Conseil du 29 septembre 1989 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée équatoriale concernant la pêche au large de la
    côte de Guinée équatoriale pour la période du 27 juin 1989 au 26 juin 1992'
  type: main
