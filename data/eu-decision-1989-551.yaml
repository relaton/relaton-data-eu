    zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung der Republik
    Äquatorialguinea über die Fischerei vor der Küste Äquatorialguineas für die
    Zeit vom 27. Juni 1989 bis zum 26. Juni 1992 (89/551/EWG) #'
  type: main
