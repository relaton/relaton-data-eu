title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 900/2000 of 28 April 2000 determining the
    extent to which applications lodged in April 2000 for licences for certain eggs
    and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic, Slovakia, Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 900/2000 de la Commission, du 28 avril 2000, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 2000 pour certains produits des secteurs de la viande de volaille et
    des oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la République de Pologne, la République de Hongrie, la République tchèque,
    la Slovaquie, la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 900/2000 der Kommission vom 28. April 2000 über die
    Festsetzung des Umfangs, in dem die im April 2000 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik, der Slowakei, Rumänien und Bulgarien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 900/2000 af 28. april 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    2000 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske
    Republik, Rumænien og Republikken Bulgarien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 900/2000 της Επιτροπής,
    της 28ης Απριλίου 2000, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Απρίλιο του 2000 για πιστοποιητικά
    εισαγωγής αυγών και κρέατος πουλερικών βάσει
    του καθεστώτος που προβλέπεται από τις συμφωνίες,
    τις οποίες συνήψε η Κοινότητα με τη Δημοκρατία
    της Πολωνίας, τη Δημοκρατία της Ουγγαρίας,
    την Τσεχική Δημοκρατία, τη Σλοβακία τη Ρουμανία
    και τη Βουλγαρία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 900/2000, annettu 28 päivänä huhtikuuta 2000,
    yhteisön sekä Puolan, Unkarin, Tsekin tasavallan, Slovakian, Romanian ja Bulgarian
    välisissä väliaikaisissa sopimuksissa määrättyyn järjestelmään liittyvien
    huhtikuussa 2000 jätettyjen tiettyjä siipikarjanliha- ja muna-alan tuotteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 900/2000 della Commissione, del 28 aprile 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 2000 per taluni prodotti del settore delle uova
    e del pollame nel quadro del regime previsto dagli accordi conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la
    Slovacchia, la Romania e la Bulgaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 900/2000 van de Commissie van 28 april 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sectoren slachtpluimvee en eieren, die in april
    2000 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomsten met de Republiek Polen, de Republiek Hongarije,
    de Tsjechische Republiek, Slowakije, Roemenië en Bulgarije
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 900/2000 da Comissão, de 28 de Abril de 2000, que
