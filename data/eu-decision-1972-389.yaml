title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 octobre 1972, portant octroi du concours
    du FSE, prévu à l'article 125 du Traité, au bénéfice de la République italienne
    pour des dépenses relatives à des opérations de rééducation professionnelle
    effectuées par le Ministère du travail et de la prévoyance sociale et plusieurs
    organismes italiens
  type: main
- language: de
  script: Latn
  content: '72/389/EWG: Entscheidung der Kommission vom 17. Oktober 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an die
    Italienische Republik zu Aufwendungen für vom "Ministero del Lavoro e della Previdenza
    sociale" und mehreren italienischen Köperschaften durchgeführte Berufsumschulungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/389/CEE: Decisione della Commissione, del 17 ottobre 1972, recante
    concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore della Repubblica italiana per spese concernenti operazioni
    di riqualificazione professionale effettuate dal «Ministero del lavoro e della
    previdenza sociale» e da vari altri enti italiani'
  type: main
- language: nl
  script: Latn
  content: '72/389/EEG: Beschikking van de Commissie van 17 oktober 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van de Italiaanse Republiek voor door het "Ministero
    del lavoro e della previdenza sociale" en verschillende Italiaanse instellingen
    gemaakte herscholingskosten'
  type: main
