title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2130/88 of 18 July 1988 re-establishing
    the levying of customs duties on other footwear, falling within CN codes 6404
    and 6405 90 10, originating in the Philippines, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2130/88 de la Commission du 18 juillet 1988 portant
    rétablissement de la perception des droits de douane applicables aux autres chaussures
    des codes 6404 et 6405 90 10 de la nomenclature combinée, originaires des Philippines,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2130/88 der Kommission vom 18. Juli 1988 zur Wiedereinführung
