    6405 90 10 der Kombinierten Nomenklatur mit Ursprung auf den Philippinen, denen
    die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2130/88 af 18. juli 1988 om genindførelse
