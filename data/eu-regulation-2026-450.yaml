  script: Latn
  content: Commission Delegated Regulation (EU) 2026/450 of 27 February 2026 amending
    Regulation (EU) 2019/1241 as regards the establishment of measures to ensure compliance
    with existing mitigation measures to reduce incidental catches of the resident
    population of the Baltic Proper harbour porpoise (Phocoena phocoena) in the Baltic
    Sea
  type: main
- language: fr
  script: Latn
