title:
- language: en
  script: Latn
  content: '2012/43/EU: Commission Implementing Decision of 25 January 2012 authorising
    the Kingdom of Denmark to conclude agreements with Greenland and the Faroe Islands
    for transfers of funds between Denmark and each of these territories to be treated
    as transfers of funds within Denmark, pursuant to Regulation (EC) No 1781/2006
    of the European Parliament and of the Council (notified under document C(2012)
    141)'
  type: main
- language: fr
  script: Latn
  content: '2012/43/UE: Décision d’exécution de la Commission du 25 janvier 2012
    autorisant le Royaume de Danemark à conclure des accords avec le Groenland et
    les îles Féroé pour que les virements de fonds entre le Danemark et chacun
    de ces territoires soient traités comme des virements de fonds à l’intérieur
    du Danemark, conformément au règlement (CE) n ° 1781/2006 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2012) 141]'
  type: main
- language: de
  script: Latn
  content: '2012/43/EU: Durchführungsbeschluss der Kommission vom 25. Januar 2012
    zur Ermächtigung des Königreichs Dänemark gemäß der Verordnung (EG) Nr. 1781/2006
    des Europäischen Parlaments und des Rates, eine Vereinbarung mit Grönland und
    den Faröern zu schließen, damit Geldtransfers zwischen Dänemark und jedem dieser
    Gebiete wie innerdänische Geldtransfers behandelt werden können (Bekanntgegeben
    unter Aktenzeichen K(2012) 141)'
  type: main
- language: bg
