title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 décembre 1963, autorisant la perception
    de taxes compensatoires à l'importation, en République italienne, de dextrines,
    d'amidons et fécules solubles ou torréfiés, ainsi que de parements et apprêts,
    préparés à base de matières amylacées, en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '63/676/EWG: Entscheidung der Kommission vom 4. Dezember 1963 über die
    Erhebung von Ausgleichsabgaben auf Einfuhren von Dextrin, löslicher und gerösteter
    Stärke sowie von zubereiteten Zurichtemitteln und zubereiteten Appreturen auf
    der Grundlage von Stärke aus den verschiedenen Mitgliedstaaten in die Französische
    Republik'
  type: main
- language: it
  script: Latn
  content: '63/676/CEE: Decisione della Commissione del 4 dicembre 1963 che autorizza
    la riscossione di tasse di compensazione all''importazione, nella Repubblica francese
    di destrine, amidi, fecole solubili o torrefatte, bozzime e appretti preparati
    a base di materie amidacee in provenienza di altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/676/EEG: Beschikking van de Commissie van 4 december 1963 houdende
    machtiging tot het leggen van compenserende heffingen op de invoer in de Franse
    Republiek van dextrine, oplosbaar of geroost zetmeel, en preparaten voor het appreteren
    op basis van zetmeel of van zetmeelderivaten, uit bepaalde Lid-Staten'
  type: main
