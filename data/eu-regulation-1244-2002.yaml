    des Getreidesektors zu den Verordnungen (EG) Nr. 2290/2000, (EG) Nr. 2433/2000,
    (EG) Nr. 2434/2000, (EG) Nr. 2435/2000 und (EG) Nr. 2851/2000 hinsichtlich der
    Zugeständnisse in Form von gemeinschaftlichen Zollkontingenten für bestimmte
    landwirtschaftliche Erzeugnisse mit Ursprung in der Republik Bulgarien, der Tschechischen
    Republik, der Slowakischen Republik, Rumänien und der Republik Polen sowie zur
    Aufhebung der Verordnung (EG) Nr. 1218/96
  type: main
- language: da
  script: Latn
