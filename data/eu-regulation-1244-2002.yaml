  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1244/2002 della Commissione, del 10 luglio 2002, in
    ordine al regolamento (CE) n. 2809/2000 che stabilisce le modalità di applicazione,
    per i prodotti del settore cerealicolo, dei regolamenti (CE) n. 2290/2000, (CE)
    n. 2433/2000, (CE) n. 2434/2000, (CE) n. 2435/2000 e (CE) n. 2851/2000, che stabiliscono
    talune concessioni sotto forma di contingenti tariffari comunitari per taluni
    prodotti agricoli provenienti, rispettivamente, dalla Repubblica di Bulgaria,
    dalla Repubblica ceca, dalla Repubblica slovacca, dalla Romania e dalla Repubblica
    di Polonia che abroga il regolamento (CE) n. 1218/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1244/2002 van de Commissie van 10 juli 2002 betreffende
    Verordening (EG) nr. 2809/2000 houdende toepassingsbepalingen wat de producten
    van de graansector betreft, van de Verordeningen (EG) nr. 2290/2000, (EG) nr.
    2433/2000, (EG) nr. 2434/2000, (EG) nr. 2435/2000 en (EG) nr. 2851/2000 waarbĳ
    bepaalde concessies in de vorm van communautaire tariefcontingenten voor bepaalde
    landbouwproducten van oorsprong uit respectievelĳk Bulgarĳe, de Tsjechische
    Republiek, de Slowaakse Republiek, Roemenië en de Republiek Polen zĳn vastgesteld,
    en houdende intrekking van Verordening (EG) nr. 1218/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1244/2002 da Comissão, de 10 de Julho de 2002, respeitante
    ao Regulamento (CE) n.° 2809/2000 que estabelece as normas de execução, para
    os produtos do sector dos cereais, dos Regulamentos (CE) n.° 2290/2000, (CE)
    n.° 2433/2000, (CE) n.° 2434/2000, (CE) n.° 2435/2000 e (CE) n.° 2851/2000
    que estabelecem determinadas concessões sob a forma de contingentes pautais comunitários
    para certos produtos agrícolas provenientes, respectivamente, da República da
    Bulgária, da República Checa, da República Eslovaca, da Roménia e da República
    da Polónia e que revoga o Regulamento (CE) n.° 1218/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1244/2002 de la Comisión, de 10 de julio de 2002,
    sobre el Reglamento (CE) n° 2809/2000 por el que se establecen disposiciones
    de aplicación, en relación con los productos del sector de los cereales, de
    los Reglamentos (CE) n° 2290/2000, (CE) n° 2433/2000, (CE) n° 2434/2000, (CE)
    n° 2435/2000 y (CE) n° 2851/2000 por los que se establecen determinadas concesiones
    en forma de contingentes arancelarios comunitarios para determinados productos
    agrícolas procedentes, respectivamente, de la República de Bulgaria, de la República
    Checa, de la República Eslovaca, de Rumania y de la República de Polonia y por
    el que se deroga el Reglamento (CE) n° 1218/96
  type: main
- language: sv
