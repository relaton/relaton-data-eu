title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1244/2002 of 10 July 2002 concerning Regulation
    (EC) No 2809/2000 laying down detailed rules for the application, for cereals
    sector products, of Regulations (EC) No 2290/2000, (EC) No 2433/2000, (EC) No
    2434/2000, (EC) No 2435/2000 and (EC) No 2851/2000 establishing certain concessions
    in the form of Community tariff quotas for certain agricultural products originating
    in the Republic of Bulgaria, the Czech Republic, the Slovak Republic, Romania
    and the Republic of Poland respectively and repealing Regulation (EC) No 1218/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1244/2002 de la Commission du 10 juillet 2002 concernant
    le règlement (CE) n° 2809/2000 portant modalités d'application, pour les produits
    du secteur des céréales, des règlements (CE) n° 2290/2000, (CE) n° 2433/2000,
    (CE) n° 2434/2000, (CE) n° 2435/2000 et (CE) n° 2851/2000 établissant certaines
    concessions sous forme de contingents tarifaires communautaires pour certains
    produits agricoles en provenance respectivement de la République de Bulgarie,
    la République tchèque, la République slovaque, la Roumanie et la République
    de Pologne et abrogeant le règlement (CE) n° 1218/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1244/2002 der Kommission vom 10. Juli 2002 betreffend
