title:
- language: en
  script: Latn
  content: '83/441/EEC: Commission Decision of 10 August 1983 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of certain outer garments,
    originating in Turkey, which have been put into free circulation in the Community
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/441/CEE: Décision de la Commission du 10 août 1983 autorisant le
    Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de certains vêtements de dessus, originaires de Turquie, et mis en libre pratique
    dans la Communauté (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/441/EWG: Entscheidung der Kommission vom 10. August 1983 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von bestimmter aus der Türkei stammender und in der Gemeinschaft
    im freien Verkehr befindlicher Oberkleidung (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/441/EØF: Kommissionens beslutning af 10. august 1983 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse yderbeklædningsgenstande med oprindelse i Tyrkiet og overgået til fri
    omsætning i en anden medlemstal (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/441/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Αυγούστου 1983 περί χορηγήσεως αδείας στο Ηνωμένο
    Βασίλειο για την καθιέρωση ενδοκοινοτικής
    επίβλεψης των εισαγωγών ορισμένων εξωτερικών
    ενδυμάτων καταγωγής Τουρκίας που έχουν τεθεί
    σε ελεύθερη κυκλοφορία στην Κοινότητα (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/441/CEE: Decisione della Commissione del 10 agosto 1983 che autorizza
    il Regno Unito a istituire una sorveglianza intracomunitaria sulle importazioni
    di taluni indumenti esterni originari della Turchia e immessi in libera pratica
    nella Comunità (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/441/EEG: Beschikking van de Commissie van 10 augustus 1983 houdende
    machtiging van het Verenigd Koninkrijk tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van bepaalde bovenkleding, van oorsprong uit
    Turkije, die in de Gemeenschap in het vrije verkeer is gebracht (Slechts de tekst
    in de Engelse taal is authentiek)'
