    destinés aux voitures particulières et aux véhicules utilitaires légers, y
    compris certains véhicules électriques hybrides et certains véhicules acceptant
    des carburants de substitution, conformément au règlement (UE) 2019/631 du Parlement
    européen et du Conseil
  type: main
