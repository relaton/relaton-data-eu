  script: Latn
  content: Commission Implementing Decision (EU) 2020/1232 of 27 August 2020 on the
    approval of the efficient generator function used in 12 Volt motor-generators
    for use in passenger cars and light commercial vehicles, including certain hybrid
    electric vehicles and vehicles capable of running on alternative fuels, as an
    innovative technology pursuant to Regulation (EU) 2019/631 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
