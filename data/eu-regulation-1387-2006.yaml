  script: Latn
  content: Commission Regulation (EC) No 1387/2006 of 21 September 2006 determining
    the extent to which applications lodged in September 2006 for import licences
    for certain pigmeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
