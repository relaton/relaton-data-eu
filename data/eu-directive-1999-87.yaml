title:
- language: en
  script: Latn
  content: Directive 1999/87/EC of the European Parliament and of the Council of 23
    November 1999 amending Council Directive 76/625/EEC concerning the statistical
    surveys to be carried out by the Member States in order to determine the production
    potential of plantations of certain species of fruit trees
  type: main
- language: fr
  script: Latn
  content: Directive 1999/87/CE du Parlement européen et du Conseil, du 23 novembre
    1999, modifiant la directive 76/625/CEE du Conseil concernant les enquêtes statistiques
    à effectuer par les États membres en vue de déterminer le potentiel de production
    des plantations de certaines espèces d'arbres fruitiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/87/EG des Europäischen Parlaments und des Rates vom 23.
    November 1999 zur Änderung der Richtlinie 76/625/EWG des Rates über die von
    den Mitgliedstaaten durchzuführenden statistischen Erhebungen zur Ermittlung
    des Produktionspotentials bestimmter Baumobstanlagen
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 1999/87/EF af 23. november 1999
    om ændring af Rådets direktiv 76/625/EØF om statistiske undersøgelser, der
    skal foretages af medlemsstaterne for at bestemme produktionskapaciteten for plantager
    med visse arter af frugttræer
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/87/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 23ης Νοεμβρίου 1999, για
    την τροποποίηση της οδηγίας 76/625/ΕΟΚ του Συμβουλίου
    περί των στατιστικών ερευνών που θα διενεργηθούν
    από τα κράτη μέλη για τον προσδιορισμό του
    δυναμικού παραγωγής των δενδρώνων ορισμένων
    ειδών οπωροφόρων δένδρων
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 1999/87/EY, annettu 23 päivänä
    marraskuuta 1999, tilastotietojen keruusta jäsenvaltioissa tiettyjen hedelmälajien
    viljelmien tuotantomahdollisuuksien määrittämiseksi annetun neuvoston direktiivin
    76/625/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/87/CE del Parlamento europeo e del Consiglio, del 23 novembre
    1999, recante modifica della direttiva 76/625/CEE relativa alle indagini statistiche
    da effettuarsi dagli Stati membri per determinare il potenziale di produzione
    delle piantagioni di talune specie di alberi da frutto
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/87/EG van het Europees Parlement en de Raad van 23 november
    1999 tot wijziging van Richtlijn 76/625/EEG van de Raad betreffende de door de
    lidstaten te houden statistische enquêtes, teneinde het productiepotentieel van
    bepaalde soorten fruitbomen vast te stellen
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/87/CE do Parlamento Europeu e do Conselho, de 23 de Novembro
    de 1999, que altera a Directiva 76/625/CEE do Conselho respeitante aos inquéritos
    estatísticos a efectuar pelos Estados-Membros tendo em vista determinar o potencial
    de produção das plantações de certas espécies de árvores de fruto
  type: main
- language: es
  script: Latn
  content: Directiva 1999/87/CE del Parlamento Europeo y del Consejo, de 23 de noviembre
    de 1999, por la que se modifica la Directiva 76/625/CEE del Consejo referente
    a las encuestas estadísticas que han de efectuar los Estados miembros para determinar
    el potencial de producción de las plantaciones de determinadas especies de árboles
    frutales
  type: main
- language: sv
