---
id: EUDecision20181110
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1110 of 3 August 2018 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified maize 1507 × 59122 × MON 810 × NK603, and genetically
    modified maize combining two or three of the single events 1507, 59122, MON 810
    and NK603, and repealing Decisions 2009/815/EC, 2010/428/EU and 2010/432/EU (notified
    under document C(2018) 4937)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1110 de la Commission du 3 août 2018
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié 1507 × 59122 × MON 810 × NK603 ou du maïs génétiquement modifié
    combinant deux ou trois des événements simples 1507, 59122, MON 810 et NK603,
    consistant en ces maïs ou produits à partir de ceux-ci, et abrogeant les décisions
    2009/815/CE, 2010/428/UE et 2010/432/UE [notifiée sous le numéro C(2018) 4937]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1110 der Kommission vom 3. August 2018
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die die genetisch
    veränderte Maissorte 1507 × 59122 × MON 810 × NK603 enthalten, aus dieser
    bestehen oder aus dieser gewonnen werden, und von genetisch veränderten Maissorten,
    die zwei oder drei der Einzelereignisse 1507, 59122, MON 810 und NK603 kombinieren,
    sowie zur Aufhebung der Entscheidung 2009/815/EG und der Beschlüsse 2010/428/EU
    und 2010/432/EU (Bekannt gegeben unter Aktenzeichen C(2018) 4937)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/1110 на Комисията
    от 3 август 2018 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица 1507 × 59122 × MON 810 × NK603 и генетично модифицирана
    царевица, съвместяваща две или три от единичните
    събития 1507, 59122, MON 810 и NK603, и за отмяна на решения
    2009/815/ЕО, 2010/428/ЕС и 2010/432/ЕС (нотифицирано под
    номер С(2018) 4937)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/1110 ze dne 3. srpna 2018 o povolení
    uvádění produktů, které obsahují geneticky modifikovanou kukuřici 1507
    × 59122 × MON 810 × NK603 a geneticky modifikovanou kukuřici kombinující
    dvě nebo tři z jednoduchých událostí 1507, 59122, MON 810 a NK603, sestávají
    z nich nebo jsou z nich vyrobeny, na trh a o zrušení rozhodnutí 2009/815/ES,
    2010/428/EU a 2010/432/EU (oznámeno pod číslem C(2018) 4937)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/1110 af 3. august 2018
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret 1507 × 59122 × MON 810 × NK603-majs
    og genetisk modificeret majs, der kombinerer to eller tre af begivenhederne 1507,
    59122, MON 810 og NK603, og om ophævelse af afgørelse 2009/815/EF, 2010/428/EU
    og 2010/432/EU (meddelt under nummer C(2018) 4937)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/1110 της Επιτροπής,
    της 3ης Αυγούστου 2018, για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    1507 × 59122 × MON 810 × NK603 και γενετικώς τροποποιημένους
    αραβοσίτους που συνδυάζουν δύο ή τρία από τα
    μονά συμβάντα 1507, 59122, MON 810 και NK603, και για την
    κατάργηση των αποφάσεων 2009/815/ΕΚ, 2010/428/ΕΕ και
    2010/432/ΕΕ [κοινοποιηθείσα υπό τον αριθμό C(2018)
    4937]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/1110, 3. august 2018, millega lubatakse
    lasta turule geneetiliselt muundatud maisi 1507 × 59122 × MON 810 × NK603 sisaldavaid,
    sellest koosnevaid või sellest toodetud tooteid ja geneetiliselt muundatud maisi,
    milles on kombineeritud kaks või kolm 1507, 59122, MON 810 ja NK603 transformatsioonidest,
    ning millega tunnistatakse kehtetuks otsused 2009/815/EÜ, 2010/428/EL ja 2010/432/EL
    (teatavaks tehtud numbri C(2018) 4937 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/1110, annettu 3 päivänä
    elokuuta 2018, muuntogeenistä maissia 1507 × 59122 × MON 810 × NK603 sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden sekä kahdesta tai kolmesta
    yksittäisestä muunnostapahtumasta 1507, 59122, MON 810 ja NK603 muodostettujen
    geenimuunnosyhdistelmien markkinoille saattamisen sallimisesta ja päätösten
    2009/815/EY, 2010/428/EU ja 2010/432/EU kumoamisesta (tiedoksiannettu numerolla
    C(2018) 4937)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/1110 оd 3. kolovoza 2018. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    1507 × 59122 × MON 810 × NK603, ili se sastoje ili su proizvedeni od njega,
    i genetski modificirani kukuruz u kojem se kombiniraju dvije ili tri od pojedinačnih
    promjena 1507, 59122, MON 810 i NK603, i o stavljanju izvan snage odluka 2009/815/EZ,
    2010/428/EU i 2010/432/EU (priopćeno pod brojem dokumenta C(2018) 4937)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/1110 végrehajtási határozata (2018. augusztus
    3.) a géntechnológiával módosított 1507 × 59122 × MON 810 × NK603 kukoricát
    és a géntechnológiával módosított, az 1507, 59122, MON 810 és NK603 egyszeres
    genetikai események közül kettőt vagy hármat ötvöző kukoricát tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának engedélyezéséről,
    valamint a 2009/815/EK, a 2010/428/EU és a 2010/432/EU határozat hatályon kívül
    helyezéséről (az értesítés a C(2018) 4937. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/1110 della Commissione, del 3 agosto
    2018, che autorizza l'immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato 1507 × 59122 × MON 810 × NK603
    e da granturco geneticamente modificato che combina due o tre dei singoli eventi
    1507, 59122, MON 810 e NK603, e che abroga le decisioni 2009/815/CE, 2010/428/UE
    e 2010/432/UE [notificata con il numero C(2018) 4937]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/1110 (2018. gada 3. augusts),
    ar ko atļauj laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu
    1507 × 59122 × MON 810 × NK603, no tās sastāv vai ir no tās ražoti, un
    ģenētiski modificētu kukurūzu, kurā kombinēti divi vai trīs no vienkāršiem
    notikumiem 1507, 59122, MON 810 un NK603, un atceļ Lēmumu 2009/815/EK, Lēmumu
    2010/428/ES un Lēmumu 2010/432/ES (izziņots ar dokumenta numuru C(2018) 4937)
  type: main
- language: lt
  script: Latn
  content: 2018 m. rugpjūčio 3 d. Komisijos įgyvendinimo sprendimas (ES) 2018/1110,
    kuriuo leidžiama pateikti rinkai produktus, kurių sudėtyje yra genetiškai
    modifikuotų kukurūzų 1507 × 59122 × MON 810 × NK603 ir genetiškai modifikuotų
    kukurūzų su dviem arba trimis atskiromis modifikacijomis iš 1507, 59122, MON
    810 ir NK603, kurie iš jų sudaryti arba kurie iš jų pagaminti, ir kuriuo panaikinami
    sprendimai 2009/815/EB, 2010/428/ES ir 2010/432/ES (pranešta dokumentu Nr. C(2018)
    4937)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/1110 tat-3 ta'
    Awwissu 2018 li tawtorizza t-tqegħid fis-suq ta' prodotti li fihom il-qamħirrum
    immodifikat ġenetikament 1507 × 59122 × MON 810 × NK603, jew li jikkonsistu
    minnu jew huma magħmulin minnu, u l-qamħirrum immodifikat ġenetikament magħmul
    minn taħlitiet ta' tnejn jew tlieta mill-eventi uniċi 1507, 59122, MON 810 u
    NK603, u li tħassar id-Deċiżjonijiet 2009/815/KE, 2010/428/UE u 2010/432/UE
    (notifikata bid-dokument C(2018) 4937)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/1110 van de Commissie van 3 augustus 2018
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais 1507 × 59122 × MON 810 × NK603 en genetisch gemodificeerde mais die twee
    of drie van de afzonderlijke transformatiestappen 1507, 59122, MON 810 en NK603
    combineert, en tot intrekking van Beschikking 2009/815/EG en de Besluiten 2010/428/EU
    en 2010/432/EU (Kennisgeving geschied onder nummer C(2018) 4937)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/1110 z dnia 3 sierpnia 2018 r. zezwalająca
    na wprowadzenie do obrotu produktów zawierających zmodyfikowaną genetycznie
    kukurydzę 1507 × 59122 × MON 810 × NK603 oraz zmodyfikowane genetycznie rodzaje
    kukurydzy łączące dwie lub trzy pojedyncze modyfikacje 1507, 59122, MON 810
    i NK603, produktów składających się z wymienionych rodzajów zmodyfikowanej
    genetycznie kukurydzy lub z niej wyprodukowanych oraz uchylająca decyzje 2009/815/WE,
    2010/428/UE i 2010/432/UE (notyfikowana jako dokument nr C(2018) 4937)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/1110 da Comissão, de 3 de agosto de 2018,
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por, ou produzidos a partir de milho geneticamente modificado 1507 × 59122 ×
    MON 810 × NK603 e de milho geneticamente modificado combinando dois ou três
    dos eventos únicos 1507, 59122, MON 810 e NK603, e que revoga as Decisões 2009/815/CE,
    2010/428/UE e 2010/432/UE [notificada com o número C(2018) 4937]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/1110 a Comisiei din 3 august 2018
    de autorizare a introducerii pe piață a produselor care conțin, constau în
    sau sunt fabricate din porumbul modificat genetic 1507 × 59122 × MON 810 ×
    NK603 și din porumbul modificat genetic obținut din combinarea a două sau trei
    dintre evenimentele singulare 1507, 59122, MON 810 și NK603 și de abrogare a
    Deciziilor 2009/815/CE, 2010/428/UE și 2010/432/UE [notificată cu numărul C(2018)
    4937]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/1110 z 3. augusta 2018, ktorým
    sa povoľuje umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu 1507 × 59122 × MON 810 × NK603 a geneticky modifikovanú kukuricu
    kombinujúcu dve alebo tri z transformačných zmien 1507, 59122, MON 810 a NK603,
    sú z nich zložené alebo vyrobené, a ktorým sa zrušujú rozhodnutia 2009/815/ES,
    2010/428/EÚ a 2010/432/EÚ [oznámené pod číslom C(2018) 4937]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/1110 z dne 3. avgusta 2018 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo 1507 × 59122
    × MON 810 × NK603 in gensko spremenjeno koruzo, v kateri sta združena dva ali
    trije od transformacijskih dogodkov 1507, 59122, MON 810 in NK603, so iz njiju
    sestavljeni ali proizvedeni, ter razveljavitvi Odločbe 2009/815/ES in sklepov
    2010/428/EU in 2010/432/EU (notificirano pod dokumentarno številko C(2018) 4937)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/1110 de la Comisión, de 3 de agosto
    de 2018, por la que se autoriza la comercialización de productos que contengan
    maíz modificado genéticamente 1507 × 59122 × MON 810 × NK603 o maíz modificado
    genéticamente que combine dos o tres de los eventos únicos 1507, 59122, MON
    810 y NK603, que estén compuestos de estos maíces o que hayan sido producidos
    a partir de ellos, y por la que se derogan las Decisiones 2009/815/CE, 2010/428/UE
    y 2010/432/UE [notificada con el número C(2018) 4937]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/1110 av den 3 augusti 2018
    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av den genetiskt modifierade majsen 1507 ×
    59122 × MON 810 × NK603 och av genetiskt modifierad majs som kombinerar två
    eller tre av transformationshändelserna 1507, 59122, MON 810 och NK603, och om
    upphävande av besluten 2009/815/EG, 2010/428/EU och 2010/432/EU [delgivet med
    nr C(2018) 4937]
