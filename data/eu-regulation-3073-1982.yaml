  content: Council Regulation (EEC) No 3073/82 of 16 November 1982 amending Regulation
    (EEC) No 355/77 on common measures to improve the conditions under which agricultural
    products are processed and marketed and Regulation (EEC) No 1820/80 for the stimulation
    of agricultural development in the less-favoured areas of the west of Irelandc
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3073/82 du Conseil, du 16 novembre 1982, modifiant
    le règlement (CEE) n° 355/77 concernant une action commune pour l' amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    et le règlement (CEE) n° 1820/80 concernant l' accélération du développement
    agricole dans les régions défavorisées de l' ouest de l' Irlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3073/82 des Rates vom 16. November 1982 zur Änderung
    der Verordnung (EWG) Nr. 355/77 über eine gemeinsame Maßnahme zur Verbesserung
    der Verarbeitungs- und Vermarktungsbedingungen für landwirtschaftliche Erzeugnisse
    und der Verordnung (EWG) Nr. 1820/80 zur Förderung der landwirtschaftlichen Entwicklung
    in den benachteiligten Gebieten von Westirland
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3073/82 af 16. november 1982 om ændring
    af forordning (EØF) nr. 355/77 om en fælles foranstaltning til forbedring af
    vilkårene for forarbejdning og afsætning af landbrugsvarer og forordning (EØF)
    nr. 1820/80 om fremme af landbrugets udvikling i de ugunstigt stillede områder
    i det vestlige Irland
  type: main
- language: el
  script: Grek
