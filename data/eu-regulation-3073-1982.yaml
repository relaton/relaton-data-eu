  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3073/82 del Consiglio, del 16 novembre 1982, che modifica
    il regolamento (CEE) n. 355/77 relativo a un' azione comune per il miglioramento
    delle condizioni di trasformazione e di commercializzazione dei prodotti agricoli
    ed il regolamento (CEE) n. 1820/80 relativo all' incentivazione dello sviluppo
    agricolo nelle zone svantaggiate dell' Irlanda occidentale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3073/82 van de Raad van 16 november 1982 tot wijziging
    van Verordening (EEG) nr. 355/77 inzake een gemeenschappelijke actie ter verbetering
    van de voorwaarden inzake verwerking en afzet van landbouwprodukten en Verordening
    (EEG) nr. 1820/80 ter bevordering van de ontwikkling van de landbouw in de probleemgebieden
    van West-Ierlande
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3073/82 do Conselho, de 16 de Novembro de 1982,
    que altera o Regulamento (CEE) n.° 355/77 relativo à acção comum para a melhoria
    das condições de transformação e comercialização dos produtos agrícolas
    e o Regulamento (CEE) n.° 1820/80 relativo à aceleração do desenvolvimento
    agrícola nas regiões desfavorecidas do Oeste da Irlanda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3073/82 del Consejo, de 16 de noviembre de 1982, por
    el que se modifican el Reglamento (CEE) n° 355/77 referente a una acción común
    para la mejora de las condiciones de transformación y de comercialización de
    los productos agrícolas, y el Reglamento (CEE) n° 1820/80 referente a la aceleración
    del desarrollo agrícola en las regiones desfavorecidas del Oeste de Irlanda
