title:
- language: fr
  script: Latn
  content: Décision 67/721/CEE de la Commission, du 8 novembre 1967, portant octroi
    à la République italienne d'un contingent tarifaire pour les morues, y compris
    les stockfisch et les klippfisch, simplement salées ou en saumure ou séchées
  type: main
- language: de
  script: Latn
  content: '67/721/EWG: Entscheidung der Kommission vom 8. November 1967 über die
    Gewährung eines Zollkontingents für Kabeljau, einschließlich Stockfisch und
    Klippfisch, nur gesalzen, in Salzlake oder getrocknet, an die Italienische Republik'
  type: main
- language: it
  script: Latn
  content: '67/721/CEE: Decisione della Commissione, dell''8 novembre 1967, relativa
    alla concessione di un contingente tariffario alla Repubblica italiana per i merluzzi,
    compresi lo stoccafisso ed il baccalà, semplicemente salati, in salamoia o secchi'
  type: main
- language: nl
  script: Latn
  content: '67/721/EEG: Beschikking van de Commissie van 8 november 1967 houdende
    toekenning van een tariefcontingent aan de Italiaanse Republiek voor kabeljauw,
    stokvis en klipvis daaronder begrepen, enkel gezouten, gepekeld of gedroogd'
  type: main
