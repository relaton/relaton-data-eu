    behandelt wurde, gemäß der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments
    und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln sowie zur Änderung
    des Anhangs der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
