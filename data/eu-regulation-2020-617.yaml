  script: Latn
  content: Commission Implementing Regulation (EU) 2020/617 of 5 May 2020 renewing
    the approval of the active substance metalaxyl-M, and restricting the use of seeds
    treated with plant protection products containing it, in accordance with Regulation
    (EC) No 1107/2009 of the European Parliament and of the Council concerning the
    placing of plant protection products on the market, and amending the Annex to
    Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/617 de la Commission du 5 mai 2020
    renouvelant l’approbation de la substance active «métalaxyl-M» et restreignant
    l’utilisation de semences traitées avec des produits phytopharmaceutiques contenant
    cette substance, conformément au règlement (CE) no 1107/2009 du Parlement européen
    et du Conseil concernant la mise sur le marché des produits phytopharmaceutiques,
    et modifiant l’annexe du règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
