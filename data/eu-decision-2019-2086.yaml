    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu MON 89034
    × 1507 × MON 88017 × 59122 × DAS-40278-9 un ģenētiski modificētu kukurūzu,
    kurā kombinēti divi, trīs vai četri vienkārši notikumi MON 89034, 1507,
    MON 88017, 59122 un DAS-40278-9, no tās sastāv vai ir no tās ražoti (izziņots
    ar dokumenta numuru C(2019) 8425) (Autentisks ir tikai teksts franču valodā)
  type: main
