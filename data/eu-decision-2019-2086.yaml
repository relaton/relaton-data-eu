  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2019/2086 tat-28
    ta’ Novembru 2019 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom,
    jikkonsistu minn, jew li huma prodotti mill-qamħirrum ġenetikament modifikat
    MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9, u qamħirrum ġenetikament
    modifikat li jikkombina tnejn, tlieta jew erbgħa mill-eventi uniċi MON 89034,
    1507, MON 88017, 59122 u DAS-40278-9 skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill dwar ikel u għalf modifikat ġenetikament (notifikata bid-dokument
    C(2019) 8425) (It-test bil-Franċiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (Eu) 2019/2086 Van De Commissie van 28 november 2019
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9 en genetisch gemodificeerde
    maisrassen die twee, drie of vier van de afzonderlijke transformatiestappen MON
    89034, 1507, MON 88017, 59122 en DAS-40278-9 combineren, overeenkomstig Verordening
