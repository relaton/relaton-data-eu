    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9 a geneticky modifikovanú
    kukuricu obsahujúcu kombináciu dvoch, troch alebo štyroch genetických modifikácií
    MON 89034, 1507, MON 88017, 59122 a DAS-40278-9, sú z nich zložené alebo vyrobené
    [oznámené pod číslom C(2019) 8425] (Iba francúzske znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/2086 z dne 28. novembra 2019 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON 89034 ×
    1507 × MON 88017 × 59122 × DAS-40278-9, so iz nje sestavljeni ali proizvedeni,
    in gensko spremenjeno koruzo, v kateri so združeni dva, trije ali štirje od
