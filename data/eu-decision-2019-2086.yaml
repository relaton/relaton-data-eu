    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9 oraz rodzaje genetycznie
    zmodyfikowanej kukurydzy łączące dwie, trzy lub cztery modyfikacje MON 89034,
    1507, MON 88017, 59122 i DAS-40278-9 i produktów składających się z wymienionych
    rodzajów genetycznie zmodyfikowanej kukurydzy lub z niej wyprodukowanych (notyfikowana
    jako dokument nr C(2019) 8425) (Jedynie tekst w języku francuskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/2086 da Comissão de 28 de novembro de
    2019 que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado MON 89034 ×
    1507 × MON 88017 × 59122 × DAS-40278-9 e milho geneticamente modificado combinando
    dois, três ou quatro dos eventos únicos MON 89034, 1507, MON 88017, 59122 e
    DAS-40278-9, nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu
    e do Conselho [notificada com o número C(2019) 8425] (Apenas faz fé o texto
    em língua francesa)
  type: main
