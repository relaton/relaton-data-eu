  script: Latn
  content: Decisione di Esecuzione (UE) 2019/2086 della Commissione del 28 novembre
    2019 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato MON 89034 × 1507 × MON 88017
    × 59122 × DAS-40278-9 e da granturco geneticamente modificato che combina due,
    tre o quattro dei singoli eventi MON 89034, 1507, MON 88017, 59122 e DAS-40278-9
    a norma del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2019) 8425] (Il testo in lingua francese è il solo
    facente fede)
  type: main
- language: lv
  script: Latn
