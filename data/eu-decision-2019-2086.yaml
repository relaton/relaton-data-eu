id: EUDecision20192086
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/2086 of 28 November 2019 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9
    and genetically modified maize combining two, three or four of the single events
    MON 89034, 1507, MON 88017, 59122 and DAS-40278-9 pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2019) 8425) (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2019/2086 De La Commission du 28 novembre
    2019 autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9 et du maïs génétiquement
    modifié combinant deux, trois ou quatre des événements de transformation simples
    MON 89034, 1507, MON 88017, 59122 et DAS-40278-9, consistant en ces maïs ou produits
    à partir de ceux-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2019) 8425] (Le texte en
    langue française est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/2086 der Kommission vom 28. November
    2019 über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderten Mais der Sorte MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9
    enthalten, aus ihm bestehen oder aus ihm hergestellt werden, und von genetisch
    veränderten Maissorten, in denen zwei, drei oder vier der Einzelereignisse MON
    89034, 1507, MON 88017, 59122 und DAS-40278-9 kombiniert werden, gemäß der Verordnung
    (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben
    unter Aktenzeichen C(2019) 8425) (Nur der französische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за Изпълнение (ЕС) 2019/2086 на Комисията
    от 28 ноември 2019 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9 и генетично
    модифицирана царевица, съвместяваща две, три
    или четири от единичните събития MON 89034, 1507,
    MON 88017, 59122 и DAS-40278-9 в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2019) 8425) (само текстът
    на френски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/2086 ze dne 28. listopadu 2019
    o povolení uvádění produktů, které obsahují geneticky modifikovanou kukuřici
    MON 89034 × 1507 × MON 88017 × 59122 × DAS-40278-9 a geneticky modifikovanou
    kukuřici kombinující dvě, tři nebo čtyři z jednoduchých událostí MON
    89034, 1507, MON 88017, 59122 a DAS-40278-9, sestávají z nich nebo jsou z nich
    vyrobeny, na trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003
    (oznámeno pod číslem C(2019) 8425) (Pouze francouzské znění je závazné)
