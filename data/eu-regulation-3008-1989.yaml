  content: Commission Regulation (EEC) No 3008/89 of 5 October 1989 amending Regulation
    (EEC) No 1901/89 derogating from Regulation (EEC) No 920/89 laying down quality
    standards for carrots, citrus fruit and dessert apples and pears as regards the
    sizing of apples for the 1989/90 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3008/89 de la Commission du 5 octobre 1989 modifiant
