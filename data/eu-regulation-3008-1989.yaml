    zur Festsetzung der Qualitätsnormen für Möhren, Zitrusfrüchte sowie Tafeläpfel
    und -birnen im Wirtschaftsjahr 1989/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3008/89 af 5. oktober 1989 om ændring
