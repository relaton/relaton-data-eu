  content: Council Regulation (EC) No 2011/2002 of 11 November 2002 amending Regulation
    (EC) No 603/1999 imposing a definitive anti-dumping duty on imports of polypropylene
    binder or baler twine originating in Poland, the Czech Republic and Hungary and
    collecting definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2011/2002 du Conseil du 11 novembre 2002 modifiant
