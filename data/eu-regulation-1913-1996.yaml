    applicables pendant la période du 1er juillet au 31 décembre 1996 inclus à
    l'importation dans la Communauté des marchandises relevant du règlement (CE)
    n° 3448/93 du Conseil dans le cadre des accords avec l'Estonie, la Lettonie et
    la Lituanie
  type: main
