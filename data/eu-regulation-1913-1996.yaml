  script: Latn
  content: COMMISSION REGULATION (EC) No 1913/96 of 2 October 1996 laying down the
    reduced agricultural components and additional duties applicable from 1 July to
    31 December 1996 to the importation into the Community of goods covered by Council
    Regulation (EC) No 3448/93 under Agreements with Estonia, Latvia and Lithuania
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1913/96 DE LA COMMISSION du 2 octobre 1996 déterminant
