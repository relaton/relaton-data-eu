    bis 31. Dezember 1996 bei der Einfuhr der unter die Verordnung (EG) Nr. 3448/93
    des Rates fallenden Waren in die Gemeinschaft im Rahmen der Abkommen mit der Republik
    Estland, der Republik Lettland und Litauen anzuwenden sind
  type: main
