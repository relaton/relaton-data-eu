title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 639/91 of 14 March 1991 ending the charges
    against the tariff ceilings opened, in the framework of generalized tariff preferences,
    by Council Regulation (EEC) No 3897/89 in respect of certain textile products
    originating in Thailand, Pakistan and China, and repealing Regulations (EEC) No
    3891/90 and (EEC) No 3892/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 639/91 de la Commission, du 14 mars 1991, portant
    cessation des imputations au bénéfice des plafonds tarifaires ouverts dans le
    cadre des préférences généralisées, par le règlement (CEE) n° 3897/89 du
    Conseil pour certains produits textiles originaires de la Thaïlande, du Pakistan
    et de la Chine, et abrogeant les règlements (CEE) n° 3891/90 et (CEE) n° 3892/90
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 639/91 der Kommission vom 14. März 1991 zur Einstellung
