  script: Latn
  content: '83/330/EEC: Council Decision of 21 June 1983 on the signing and the deposit
    of the declaration of provisional application of the 1983 Protocols for the further
    extension of the Wheat Trade Convention, 1971, and the Food Aid Convention, 1980,
    constituting the International Wheat Agreement, 1971'
  type: main
- language: fr
  script: Latn
  content: '83/330/CEE: Décision du Conseil du 21 juin 1983 concernant la signature
    et le dépôt de la déclaration d'' application provisoire des protocoles de
    1983 portant nouvelle prorogation de la convention sur le commerce du blé de
    1971 et de la convention relative à l'' aide alimentaire de 1980, constituant
    l'' accord international sur le blé de 1971'
  type: main
- language: de
  script: Latn
