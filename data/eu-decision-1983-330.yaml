    von 1983 zur weiteren Verlängerung des Weizenhandels-Übereinkommens von 1971
    und des Nahrungsmittelhilfe-Übereinkommens von 1980, welche die Internationale
    Weizen-Übereinkunft von 1971 bilden'
  type: main
- language: da
  script: Latn
  content: '83/330/EØF: Rådets afgørelse af 21. juni 1983 om undertegnelse og om
