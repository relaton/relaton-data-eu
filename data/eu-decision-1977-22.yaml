  type: main
- language: fr
  script: Latn
  content: '77/22/CEE: Décision de la Commission, du 20 décembre 1976, relative
    à l''admission en franchise des droits de douane d''éléments préfabriqués
    nécessaires à la construction d''une école offerte gratuitement par la confédération
    helvétique à la commune sinistrée de Seveso (Italie)'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Dezember 1976 über die Zollbefreiung
    der erforderlichen Fertigteile zum Bau einer Schule, die die Schweizerische Eidgenossenschaft
    der von einer Umweltkatastrophe heimgesuchten Gemeinde Seveso (Italien) geschenkt
    hat
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. december 1976 om toldfritagelse for præfabrikerede
