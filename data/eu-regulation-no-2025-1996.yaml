    1996 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik og Den Slovakiske Republik
  type: main
