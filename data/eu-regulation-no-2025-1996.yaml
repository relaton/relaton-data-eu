  script: Latn
  content: COMMISSION REGULATION (EC) No 2025/96 of 23 October 1996 determining the
    extent to which applications lodged in October 1996 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2025/96 DE LA COMMISSION du 23 octobre 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1996 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords conclus par la Communauté avec la république
    de Pologne, la république de Hongrie, la République tchèque et la République
    slovaque peuvent être acceptées
  type: main
