title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2274/92 of 3 August 1992 re-establishing
    the levying of customs duties on products of category 35 (order No 40.0350), originating
    in Pakistan and China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2274/92 de la Commission du 3 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    35 (numéro d'ordre 40.0350) originaires du Pakistan et de Chine, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2274/92 DER KOMMISSION vom 3. August 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie Nr. 35 (laufende Nummer 40.0350) mit
    Ursprung in Pakistan und China, denen die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2274/92 af 3. august 1992 om genindførelse
