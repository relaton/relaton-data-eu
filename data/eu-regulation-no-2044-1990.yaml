title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2044/90 of 18 July 1990 amending Regulation
    (EEC) No 1303/90 and increasing to 700 000 tonnes the amount of maize held by
    the French intervention agency for which a standing invitation to tender for resale
    has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2044/90 de la Commission, du 18 juillet 1990, modifiant
    le règlement (CEE) n 1303/90 et portant à 700 000 tonnes l'adjudication permanente
    pour la revente de maïs détenu par l'organisme d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2044/90 der Kommission vom 18. Juli 1990 zur Änderung
    der Verordnung (EWG) Nr. 1303/90 zur Erweiterung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt auf 700 000 Tonnen Mais aus Beständen der französischen
    Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2044/90 af 18. juli 1990 om ændring
    af forordning (EØF) nr. 1303/90 og om forhøjelse til 700 000 tons af den løbende
    licitation med henblik på videresalg af majs, som det franske interventionsorgan
    ligger inde med
  type: main
