    (ΕΟΚ) αριθ. 1303/90 και ορίζει σε 700 000 τόνους τη
    διαρκή δημοπρασία για τη μεταπώληση καλαμποκιού
    που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2044/90 della Commissione, del 18 luglio 1990, che
    modifica il regolamento (CEE) n. 1303/90 e che porta a 700 000 t il quantitativo
    globale oggetto della gara permanente per la vendita di granturco detenuto dall'organismo
    d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2044/90 van de Commissie van 18 juli 1990 tot wijziging
