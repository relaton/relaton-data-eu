title:
- language: en
  script: Latn
  content: '82/548/EEC: Commission Decision of 27 July 1982 establishing that the
    apparatus described as ''ATL - Duplex System, model Mark V'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/548/CEE: Décision de la Commission, du 27 juillet 1982, constatant
    que l''importation de l''appareil dénommé "A.T.L. Duplex System, model Mark
    V" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/548/EWG: Entscheidung der Kommission vom 27. Juli 1982, mit der festgestellt
    wird, daß das Gerät ,,A.T.L. - Duplex System, model Mark V" nicht unter Befreiung
    von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/548/EØF: Kommissionens beslutning af 27. juli 1982 om fastslåelse
    af, at indførsel af apparatet "A.T.L. - Duplex System, model Mark V" ikke kan
    ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/548/EOK: Απόφαση τής Επιτροπής τής 27ης Ιουλίου
