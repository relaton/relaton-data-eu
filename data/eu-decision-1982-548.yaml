    μέ τήν ονομασία «A. T. L. — Duplex System, model Mark V» δέν
    δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/548/CEE: Decisione della Commissione, del 27 luglio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "ATL - Duplex System, model Mark
    V" non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/548/EEG: Beschikking van de Commissie van 27 juli 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,ATL-Duplex System, model Mark V" niet met
    vrijstelling van de rechten van het gemeenschappelijk douanetarief mag worden
    ingevoerd'
