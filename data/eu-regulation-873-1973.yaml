title:
- language: en
  script: Latn
  content: Regulation (EEC) No 873/73 of the Commission of 30 March 1973 extending
    again the period of validity of the provisions of Regulation (EEC) No 2816/72
    as regards the amount of security to be given upon importation of young bovine
    animals and calves for fattening
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 873/73 de la Commission, du 30 mars 1973, portant
    nouvelle prorogation des dispositions du règlement (CEE) n° 2816/72 en ce qui
    concerne le montant de la caution constituée lors de l'importation des jeunes
    bovins ou des veaux destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 873/73 der Kommission vom 30. März 1973 zur erneuten
    Verlängerung der Bestimmungen der Verordnung (EWG) Nr. 2816/72 betreffend den
    Kautionsbetrag bei der Einfuhr von zur Mast bestimmten jungen Rindern und Kälbern
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 873/73 af 30. marts 1973 om en yderligere
    forlængelse af gyldigheden af forordning (EØF) nr. 2816/72 for så vidt angår
    den sikkerhed, der skal stilles ved indførsel af ungkvæg og kalve, bestemt til
    opfedning
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 873/73 della Commissione, del 30 marzo 1973, relativo
    alla nuova proroga delle disposizioni del regolamento (CEE) n. 2816/72 per quanto
    riguarda l'importo della cauzione costituita all'atto dell'importazione dei giovani
    bovini e dei vitelli destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 873/73 van de Commissie van 30 maart 1973 tot nieuwe
    verlenging van de geldigheidsduur van Verordening (EEG) nr. 2816/72 met betrekking
    tot de waarborg die wordt gesteld bij de invoer van voor de mesterij bestemde
    jonge runderen en kalveren
