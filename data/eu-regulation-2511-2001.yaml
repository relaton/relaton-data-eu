title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2511/2001 of 20 December 2001 amending Council
    Regulation (EC) No 32/2000 in order to extend the Community tariff quotas for
    jute and coconut-fibre products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2511/2001 de la Commission du 20 décembre 2001 modifiant
    le règlement (CE) n° 32/2000 du Conseil afin de prolonger des contingents tarifaires
    communautaires pour les produits manufacturés de jute et coco
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2511/2001 der Kommission vom 20. Dezember 2001 zur
    Änderung der Verordnung (EG) Nr. 32/2000 des Rates zur Verlängerung von Gemeinschaftszollkontingenten
    für Jute- und Kokoserzeugnisse
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2511/2001 на Комисията от 20
    декември 2001 година за изменение на Регламент
    (ЕО) № 32/2000 на Съвета относно продължаване на
    тарифни квоти за Общността за фабрични продукти
    от юта и от кокосови влакна
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2511/2001 ze dne 20. prosince 2001, kterým
    se mění nařízení Rady (ES) č. 32/2000 za účelem prodloužení platnosti
    celních kvót Společenství pro výrobky z juty a kokosových vláken
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2511/2001 af 19. december 2001 om ændring
    af Rådets forordning (EF) nr. 32/2000 med henblik på forlængelse af fællesskabstoldkontingenterne
    for forarbejdede varer af jute og kokos
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2511/2001 της Επιτροπής,
    της 20ής Δεκεμβρίου 2001, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 32/2000 του Συμβουλίου
    με σκοπό την παράταση των κοινοτικών δασμολογικών
    ποσοστώσεων για τα προϊόντα από γιούτα και
    από κοκοφοίνικα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2511/2001, 20. detsember 2001, millega muudetakse
    nõukogu määrust (EÜ) nr 32/2000, et pikendada ühenduse tariifikvootide kohaldamisaega
    džuudist ja kookoskiust toodete suhtes
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2511/2001, annettu 20 päivänä joulukuuta 2001,
    neuvoston asetuksen (EY) N:o 32/2000 muuttamisesta juutista ja kookoskuiduista
    valmistettuja tuotteita koskevien yhteisön tariffikiintiöiden voimassaoloajan
    pidentämiseksi
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 2511/2001 od 20. prosinca 2001. o izmjeni Uredbe
    Vijeća (EZ) br. 32/2000 radi produženja carinskih kvota Zajednice za proizvode
    od jute i kokosovih vlakana
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2511/2001/EK rendelete (2001. december 20.) a jutából és
    kókuszrostból készült termékekre vonatkozó közösségi vámkontingensek
    meghosszabbítása érdekében a 32/2000/EK tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2511/2001 della Commissione, del 20 dicembre 2001,
    che modifica il regolamento (CE) n. 32/2000 del Consiglio al fine di prorogare
    alcuni contingenti tariffari comunitari per i prodotti manufatti di iuta e di
    cocco
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2511/2001 (2001. gada 20. decembris), ar ko groza
    Padomes Regulu (EK) Nr. 32/2000, lai pagarinātu attiecībā uz džutas un kokosšķiedru
    izstrādājumiem noteikto Kopienas tarifu kvotu periodus
  type: main
- language: lt
  script: Latn
  content: 2001 m. gruodžio 20 d. Komisijos reglamentas (EB) Nr. 2511/2001, iš dalies
    keičiantis Tarybos reglamentą (EB) Nr. 32/2000, siekiant išplėsti Bendrijos
    tarifines kvotas džiuto ir kokoso pluošto produktams
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2511/2001 ta' l-20 ta' Diċembru
    2001 li jemeda r-Regolament tal-Kunsill (KE) Nru 32/2000 sabiex jestendi t-tariffa
    ta' kwoti tal-Komunità għall-prodotti tal-ġuta u tal-fibra tal-ġewż ta' l-Indi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2511/2001 van de Commissie van 20 december 2001 tot
    wĳziging van Verordening (EG) nr. 32/2000 van de Raad houdende verlenging van
    de communautaire tariefcontingenten voor jute- en kokosproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) NR 2511/2001 z dnia 20 grudnia 2001 r. zmieniające
    rozporządzenie Rady (WE) nr 32/2000 w celu rozszerzenia wspólnotowych kontyngentów
    taryfowych na jutę i wyroby z włókna kokosowego
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2511/2001 da Comissão, de 20 de Dezembro de 2001,
    que altera o Regulamento (CE) n.° 32/2000 do Conselho a fim de prorrogar os contingentes
    pautais comunitários para os produtos manufacturados de juta e de fibras de coco
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2511/2001 al Comisiei din 20 decembrie 2001 de modificare
    a Regulamentului (CE) nr. 32/2000 al Consiliului în vederea prelungirii contingentelor
    tarifare comunitare pentru produsele prelucrate din iută și nucă de cocos
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2511/2001 z 20. decembra 2001, ktorým sa mení
    a dopĺňa nariadenie Rady (ES) č. 32/2000, aby sa rozšírili colné kvóty
    spoločenstva na výrobky z juty a kokosových vlákien
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2511/2001 z dne 20. decembra 2001 o spremembi
    Uredbe Sveta (ES) št. 32/2000 zaradi razširitve tarifnih kvot Skupnosti za izdelke
    iz jute in kokosovih vlaken
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2511/2001 de la Comisión, de 20 de diciembre de 2001,
    por el que se modifica el Reglamento (CE) n° 32/2000 del Consejo, al objeto de
    prorrogar los contingentes arancelarios comunitarios para los productos manufacturados
    de yute y de coco
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2511/2001 av den 20 december 2001 om
    ändring av rådets förordning (EG) nr 32/2000 i syfte att förlänga giltighetstiden
    för gemenskapens tullkvoter för produkter tillverkade av jute och kokosfibrer
  type: main
