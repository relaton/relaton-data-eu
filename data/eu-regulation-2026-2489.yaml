title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/2489 of 10 November 2026 on
    granting a time-limited derogation, pursuant to Article 9(4) of Regulation (EU)
    2024/590 of the European Parliament and of the Council on substances that deplete
    the ozone layer, from the end date for the critical use of portable fire extinguishers
    containing halon-1211 or halon-2402 for the protection of cabins and crew compartments
    in non-EU aircraft
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/2489 de la Commission du 10 novembre
    2026 accordant une dérogation limitée dans le temps, conformément à l’article
    9, paragraphe 4, du règlement (UE) 2024/590 du Parlement européen et du Conseil
    relatif à des substances qui appauvrissent la couche d’ozone, à compter de
    la date limite pour l’utilisation critique d’extincteurs portatifs contenant
    du halon-1211 ou du halon-2402 pour la protection des cabines et des postes d’équipage
    dans les aéronefs de pays tiers
  type: main
- language: de
  script: Latn
