    4 der Verordnung (EU) 2024/590 des Europäischen Parlaments und des Rates über
    Stoffe, die zum Abbau der Ozonschicht führen, ab dem Endtermin für den kritischen
    Verwendungszweck von Halon-1211 und Halon-2402 in tragbaren Feuerlöschern zum
    Schutz von Kabinen und Mannschaftsräumen in Nicht-EU-Luftfahrzeugen
  type: main
- language: bg
  script: Cyrl
