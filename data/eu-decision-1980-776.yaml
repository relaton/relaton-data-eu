title:
- language: en
  script: Latn
  content: '80/776/EEC: Commission Decision of 29 July 1980 authorizing the United
    Kingdom to take intra-Community surveillance measures in respect of imports of
    bananas originating in certain non-member countries and put into free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/776/CEE: Décision de la Commission, du 29 juillet 1980, autorisant
    le Royaume-Uni à prendre des mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/776/EWG: Entscheidung der Kommission vom 29. Juli 1980, mit der das
    Vereinigte Königreich zu innergemeinschaftlichen Überwachungsmaßnahmen hinsichtlich
    der Einfuhr von Bananen ermächtigt wird, die in bestimmten Drittländern ihren
    Ursprung haben und sich in den übrigen Mitgliedstaaten im freien Verkehr befinden
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/776/EØF: Kommissionens beslutning af 29. juli 1980 om bemyndigelse
    til Det forenede Kongerige til at træffe foranstaltninger med henblik på tilsyn
    inden for Fællesskabet med indførsel af bananer, der har oprindelse i visse
    tredjelande, og som er overgået til fri omsætning i de øvrige medlemssstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/776/ΕΟΚ : Απόφαση της Επιτροπής, της 29ης
    Ιουλίου 1980, με την οποία επιτρέπεται στο Ηνωμένο
    Βασίλειο να λάβει μέτρα ενδοκοινοτικής επιτήρησης
    όσον αφορά τις εισαγωγές μπανανών προέλευσης
    ορισμένων τρίτων χωρών και οι οποίες τίθενται
    σε ελεύθερη κυκλοφορία σε άλλα κράτη μέλη (Το
    κείμενο στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/776/CEE: Decisione della Commissione, del 29 luglio 1980, che autorizza
    il Regno Unito a istituire una sorveglianza intracomunitaria sulle importazioni
    di banane originarie di taluni paesi terzi e immesse in libera pratica in altri
    Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/776/EEG: Beschikking van de Commissie van 29 juli 1980 waarbij het
    Verenigd Koninkrijk wordt gemachtigd maatregelen inzake intracommunautair toezicht
    te treffen ten aanzien van de invoer van bananen van oorsprong uit bepaalde derde
    landen en in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst
    in de Engelse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '80/776/CEE: Decisión de la Comisión de 29 de julio de 1980 por la que
    se autoriza al Reino Unido a adoptar las medidas de vigilancia intracomunitaria
    respecto de los plátanos originarios de determinados terceros países y despachados
    a libre práctica en los demás Estados miembros (El texto en lengua inglesa es
    el único auténtico)'
  type: main
