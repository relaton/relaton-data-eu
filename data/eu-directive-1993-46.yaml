title:
- language: en
  script: Latn
  content: Commission Directive 93/46/EEC of 22 June 1993 replacing and modifying
    the Annexes to Council Directive 92/109/EEC on the manufacture and placing on
    the market of certain substances used in the illicit manufacture of narcotic drugs
    and psychotropic substances
  type: main
- language: fr
  script: Latn
  content: Directive 93/46/CEE de la Commission du 22 juin 1993 remplaçant et modifiant
    les annexes de la directive 92/109/CEE du Conseil relative à la fabrication et
    à la mise sur le marché de certaines substances utilisées pour la fabrication
    illicite de stupéfiants et de substances psychotropes
  type: main
- language: de
  script: Latn
  content: Richtlinie 93/46/EWG der Kommission vom 22. Juni 1993 die die Anhänge
    der Richtinie 92/109/EWG des Rates über die Herstellung und das Inverkehrbringen
    bestimmter Stoffe, die zur unerlaubten Herstellung von Suchtstoffen und psychotropen
    Substanzen verwendet werden, ersetzt und ändert
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 93/46/EHS ze dne 22. června 1993, kterou se nahrazují
    a mění přílohy směrnice Rady 92/109/EHS o výrobě určitých látek používaných
    k nedovolené výrobě omamných a psychotropních látek a o jejich uvádění
    na trh
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 93/46/EØF af 22. juni 1993 om erstatning og ændring
    af bilagene til Rådets direktiv 92/109/EØF om fremstilling og markedsføring
    af visse stoffer, der benyttes ved ulovlig fremstilling af narkotika og psykotrope
    stoffer
  type: main
- language: el
  script: Grek
  content: Οδηγία 93/46/ΕΟΚ της Επιτροπής της 22ας Ιουνίου
    1993 για την αντικατάσταση και τροποποίηση των
    παραρτημάτων της οδηγίας 92/109/ΕΟΚ του Συμβουλίου
    σχετικά με την παρασκευή και την εμπορία ορισμένων
    ουσιών που χρησιμοποιούνται για την παράνομη
    παρασκευή ναρκωτικών και ψυχοτρόπων ουσιών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 93/46/EMÜ, 22 juuni 1993, millega vahetatakse välja
    nõukogu narkootiliste ja psühhotroopsete ainete ebaseaduslikuks valmistamiseks
    kasutatavate ainete valmistamist ja turuleviimist käsitleva direktiivi 92/109/EMÜ
    lisad ja muudetakse neid
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 93/46/ETY, annettu 22 päivänä kesäkuuta 1993,
    tiettyjen huumaus- ja psykotrooppisten aineiden laittomaan valmistukseen käytettävien
    aineiden valmistamisesta ja markkinoille saattamisesta annetun neuvoston direktiivin
    92/109/ETY liitteiden korvaamisesta ja muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 93/46/EGK irányelve (1993. június 22.) a kábítószerek
    és pszichotróp anyagok tiltott előállítása során felhasznált egyes anyagok
    gyártásáról és forgalomba hozataláról szóló 92/109/EGK tanácsi irányelv
    mellékleteinek felváltásáról és módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 93/46/CEE della Commissione del 22 giugno 1993 che sostituisce
    e modifica gli allegati alla direttiva 92/109/CEE del Consiglio relativa alla
    fabbricazione e alla commercializzazione di talune sostanze usate nella fabbricazione
    illecita di stupefacenti e di sostanze psicotrope
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 93/46/EEK (1993. gada 22. jūnijs), ar ko aizstāj
    un groza pielikumus Padomes Direktīvai 92/109/EEK par dažu tādu vielu izgatavošanu
    un laišanu tirgū, kuras izmanto narkotisko un psihotropo vielu nelikumīgai
    izgatavošanai
  type: main
- language: lt
  script: Latn
  content: 1993 m. birželio 22 d. Komisijos Direktyva 93/46/EEB pakeičianti ir iš
    dalies keičianti Tarybos direktyvos 92/109/EEB dėl tam tikrų medžiagų, naudojamų
    neteisėtai narkotinių ir psichotropinių medžiagų gamybai, gamybos ir pateikimo
    į rinką priedus
  type: main
- language: mt
  script: Latn
  content: Id-direttiva tal-kummissjoni 93/46/KEE tat-22 ta’ Ġunju 1993 li tibdel
    u timmodifika l-Annessi lid-Direttiva tal-Kunisll 92/109/KEE dwar il-manifattura
    u t-tpoġġija fis-suq ta’ ċertu sustanzi użati fil-manifattura illegali ta’
    drogi narkotiċi u sustanzi psikotropiċi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 93/46/EEG van de Commissie van 22 juni 1993 ter vervanging en
    wijziging van de bijlagen bij Richtlijn 92/109/EEG van de Raad inzake de vervaardiging
    en het in de handel brengen van bepaalde stoffen die worden gebruikt voor de illegale
    vervaardiging van verdovende middelen en psychotrope stoffen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 93/46/EWG z dnia 22 czerwca 1993 r. zastępująca i zmieniająca
    załączniki do dyrektywy Rady nr 92/109/EWG w sprawie wytwarzania i wprowadzania
    do obrotu niektórych substancji wykorzystywanych do nielegalnego wytwarzania
    środków odurzających i substancji psychotropowych
  type: main
- language: pt
  script: Latn
  content: Directiva 93/46/CEE da Comissão de 22 de Junho de 1993 que complementa
    e altera os anexos da Directiva 92/109/CEE do Conselho relativa ao fabrico e à
    colocação no mercado de determinadas substâncias utilizadas no fabrico ilegal
    de estupefacientes e de substâncias psicotrópicas
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 93/46/EHS z 22. júna 1993, ktorou sa nahrádzajú a pozmeňujú
    prílohy smernice Rady 92/109/EHS o výrobe a uvádzaní na trh určitých látok
    na nedovolenú výrobu omamných látok a psychotropných látok
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 93/46/EGS z dne 22. junija 1993 o nadomestitvi in spremembah
    prilog Direktive Sveta 92/109/EGS o izdelavi in dajanju na trg nekaterih snovi,
    ki se uporabljajo za nezakonito proizvodnjo mamil in drugih psihotropnih snovi
  type: main
- language: es
  script: Latn
  content: Directiva 93/46/CEE de la Comisión de 22 de junio de 1993 por la que se
    sustituyen y modifican los Anexos de la Directiva 92/109/CEE del Consejo relativa
    a la elaboración y comercialización de determinadas sustancias utilizadas para
    la fabricación ilícita de estupefacientes y sustancias psicótropas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 93/46/EEG av den 22 juni 1993 om ersättning och
    ändring av bilagorna till rådets direktiv 92/109/EEG om tillverkning och utsläppande
    på marknaden av vissa ämnen som används vid illegal tillverkning av narkotiska
    preparat och psykotropa substanser
  type: main
