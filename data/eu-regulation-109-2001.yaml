title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 109/2001 of 19 January 2001 amending Regulation
    (EC) No 2869/2000 and increasing to 500000 tonnes the amount of common wheat from
    the 1999 harvest held by the French intervention agency for which a standing invitation
    to tender for resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 109/2001 de la Commission du 19 janvier 2001 modifiant
    le règlement (CE) n° 2869/2000 et portant à 500000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de blé tendre de la récolte 1999 détenues
    par l'organisme d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 109/2001 der Kommission vom 19. Januar 2001 zur Änderung
    der Verordnung (EG) Nr. 2869/2000 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Weichweizen der Ernte 1999 aus Beständen
    der französischen Interventionsstelle auf 500000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 109/2001 af 19. januar 2001 om ændring
    af forordning (EF) nr. 2869/2000 og om forhøjelse til 500000 tons af den løbende
    licitation med henblik på videresalg på det indre marked af blød hvede fra
    høsten i 1999, som det franske interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 109/2001 της Επιτροπής,
    της 19ης Ιανουαρίου 2001, που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 2869/2000 και ορίζει σε 500000 τόνους τη διαρκή
    δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά μαλακού σίτου συγκομιδής 1999 που έχει
    στη διάθεσή του ο γαλλικός οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 109/2001, annettu 19 päivänä tammikuuta 2001,
    asetuksen (EY) N:o 2869/2000 muuttamisesta ja pysyvän tarjouskilpailun nostamisesta
    500000 tonniin Ranskan interventioelimen hallussaan pitämän sadonkorjuuvuoden
    1999 vehnämäärän uudelleen myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 109/2001 della Commissione, del 19 gennaio 2001, che
    modifica il regolamento (CE) n. 2869/2000 e che porta a 500000 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    frumento tenero della raccolta 1999 detenuto dall'organismo d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 109/2001 van de Commissie van 19 januari 2001 tot
    wĳziging van Verordening (EG) nr. 2869/2000 teneinde de hoeveelheid waarop de
    permanente openbare inschrĳving voor de verkoop op de interne markt van zachte
    tarwe van de oogst 1999 uit de voorraden van het Franse interventiebureau betrekking
    heeft, tot 500000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 109/2001 da Comissão, de 19 de Janeiro de 2001,
    que altera o Regulamento (CE) n.° 2869/2000 e que eleva para 500000 toneladas
    o concurso permanente para a revenda no mercado interno de trigo mole da colheita
    de 1999 detido pelo organismo de intervenção francês
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 109/2001 de la Comisión, de 19 de enero de 2001, por
