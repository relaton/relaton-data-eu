title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 novembre 1971, portant octroi du concours
    du FSE au bénéfice de la République italienne pour des dépenses relatives
    à des opérations de réinstallations effectuées par le "Ministero del lavoro
    e della previdenza sociale" le "Ministero dell'interno" et l'"Opera nazionale
    per gli invalidi di guerra (ONIG)"
  type: main
- language: de
  script: Latn
  content: '72/51/EWG: Entscheidung der Kommission vom 22. November 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Republik
    Italien zu Aufwendungen für vom "Ministero del Lavoro e della Previdenza sociale",
    vom "Ministero dell''Interne" und von der "Opera nazionale per gli invalidi di
    guerra (ONIG)" durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/51/CEE: Decisione della Commissione, del 22 novembre 1971, che concede
    un contributo del FSE alla Repubblica italiana per spese concernenti operazioni
    di nuova sistemazione effettuate dal ministero del lavoro e della previdenza sociale,
    dal ministero dell''interno e dall''Opera nazionale per gli invalidi di guerra
    (ONIG)'
  type: main
- language: nl
  script: Latn
  content: '72/51/EEG: Beschikking van de Commissie van 22 november 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Italiaanse
    Republiek voor door het "Ministero del Lavoro e della Previdenza sociale", "Ministero
    dell''Interno" en de "Opera nazionale per gli invalidi di guerra (O.N.I.G.)" gemaakte
    verplaatsingskosten'
  type: main
