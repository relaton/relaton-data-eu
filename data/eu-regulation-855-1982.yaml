  content: Commission Regulation (EEC) No 855/82 of 6 April 1982 amending Annexes
    1, 4, 5 and 6 to Council Regulation (EEC) No 574/72 laying down the procedure
    for implementing Regulation (EEC) No 1408/71 on the application of social security
    schemes to employed and self-employed persons and members of their families moving
    within the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 855/82 de la Commission, du 6 avril 1982, modifiant
    les annexes 1, 4, 5 et 6 du règlement (CEE) n° 574/72 du Conseil fixant les
    modalités d' application du règlement (CEE) n° 1408/71 relatif à l' application
    des régimes de sécurité sociale aux travailleurs salariés, aux travailleurs
    non salariés et aux membres de leurs familles qui se déplacent à l' intérieur
    de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 855/82 der Kommission vom 6. April 1982 zur Änderung
    der Anhänge 1, 4, 5 und 6 der Verordnung (EWG) Nr. 574/72 des Rates über die
    Durchführung der Verordnung (EWG) Nr. 1408/71 zur Anwendung der Systeme der sozialen
    Sicherheit auf Arbeitnehmer und Selbständige sowie deren Familien, die innerhalb
    der Gemeinschaft zu- und abwandern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 855/82 af 6. april 1982 om ændring
