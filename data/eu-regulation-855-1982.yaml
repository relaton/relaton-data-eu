    af forordning (EØF) nr. 1408/71 om anvendelse af de sociale sikringsordninger
    på arbejdstagere, selvstændige erhvervsdrivende og deres familiemedlemmer, der
    flytter inden for Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 855/82 τής Επιτροπής τής
