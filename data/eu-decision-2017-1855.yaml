  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2017/1855, annettu 10 päivänä
    lokakuuta 2017, luvan antamisesta Romanialle soveltaa yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 287 artiklasta poikkeavaa erityistoimenpidettä
  type: main
- language: hr
  script: Latn
