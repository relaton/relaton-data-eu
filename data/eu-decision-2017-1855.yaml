    van artikel 287 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel
    van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2017/1855 z dnia 10 października 2017 r.
    upoważniająca Rumunię do stosowania szczególnego środka stanowiącego odstępstwo
    od art. 287 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości
    dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/1855 do Conselho, de 10 de outubro de
    2017, que autoriza a Roménia a aplicar uma medida especial em derrogação ao
    artigo 287.° da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/1855 a Consiliului din 10 octombrie
    2017 de autorizare a României să aplice o măsură specială de derogare de
    la articolul 287 din Directiva 2006/112/CE privind sistemul comun al taxei pe
    valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2017/1855 z 10. októbra 2017, ktorým
    sa Rumunsku povoľuje uplatňovať osobitné opatrenie odchyľujúce sa od článku
    287 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2017/1855 z dne 10. oktobra 2017 o dovoljenju
