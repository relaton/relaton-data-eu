    287 směrnice 2006/112/ES o společném systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2017/1855 af 10. oktober 2017 om
    bemyndigelse af Rumænien til at anvende en særlig foranstaltning, der fraviger
    artikel 287 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/1855 του Συμβουλίου,
    της 10ης Οκτωβρίου 2017, με την οποία επιτρέπεται
