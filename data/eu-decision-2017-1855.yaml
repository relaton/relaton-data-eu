  script: Latn
  content: Council Implementing Decision (EU) 2017/1855 of 10 October 2017 authorising
    Romania to apply a special measure derogating from Article 287 of Directive 2006/112/EC
    on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1855 du Conseil du 10 octobre 2017 autorisant
