    από το άρθρο 287 της οδηγίας 2006/112/ΕΚ σχετικά
    με το κοινό σύστημα φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2017/1855, 10. oktoober 2017, mille kohaselt
