  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 589/1999, annettu 18 päivänä maaliskuuta 1999,
    mahdollisuudesta tehdä yksityistä varastointia koskevia pitkän aikavälin sopimuksia
    viinivuodelle 1998/1999 pöytäviinin, rypälemehun, tiivistetyn rypälemehun
    ja puhdistetun tiivistetyn rypälemehun osalta annetun asetuksen (EY) N:o 2693/98
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 589/1999 della Commissione del 18 marzo 1999 che modifica
    il regolamento (CE) n. 2693/98 che concede, per la campagna 1998/99, la possibilità
    di concludere contratti di magazzinaggio privato a lungo termine per il vino da
    tavola, il mosto di uve concentrato e il mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 589/1999 van de Commissie van 18 maart 1999 tot wijziging
