title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 589/1999 of 18 March 1999 amending Regulation
    (EC) No 2693/98 authorising the conclusion of long-term private storage contracts
    for table wine, grape must, concentrated grape must and rectified concentrated
    grape must in respect of the 1998/1999 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 589/1999 de la Commission du 18 mars 1999 modifiant
    le règlement (CE) nº 2693/98 ouvrant la possibilité de conclure des contrats
    de stockage privé à long terme pour le vin de table, le moût de raisins, le
    moût de raisins concentré et le moût de raisins concentré rectifié pour la
    campagne 1998/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 589/1999 der Kommission vom 18. März 1999 zur Änderung
    der Verordnung (EG) Nr. 2693/98 zur Eröffnung der Möglichkeit des Abschlusses
    von Verträgen für die langfristige private Lagerhaltung von Tafelwein, Traubenmost,
    konzentriertem Traubenmost und konzentriertem rektifizierten Traubenmost für
    das Wirtschaftsjahr 1998/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 589/1999 af 18. marts 1999 om ændring
    af forordning (EF) nr. 2693/98 om adgang til indgåelse af langfristede kontrakter
    om privat oplagring af bordvin, druemost og rektificeret koncentreret druemost
    for produktionsåret 1998/99
  type: main
- language: el
  script: Grek
