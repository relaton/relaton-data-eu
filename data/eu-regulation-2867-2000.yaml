title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2867/2000 of 27 December 2000 amending Regulation
    (EC) No 2305/95 establishing detailed rules for application in the pigmeat sector
    of the arrangements provided for in the free trade agreements between the Community,
    of the one part, and Estonia, Latvia and Lithuania, of the other part and amending
    Regulation (EC) No 2333/2000 establishing the quantity of certain pigmeat products
    available for the first quarter of 2001 under the arrangements provided for by
    the free trade agreements between the Community, of the one part, and Latvia,
    Lithuania and Estonia, of the other part
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2867/2000 de la Commission du 27 décembre 2000 modifiant
    le règlement (CE) nº 2305/95 établissant les modalités d'application dans
    le secteur de la viande de porc du régime prévu dans les accords sur la libéralisation
    des échanges entre la Communauté, d'une part, et l'Estonie, la Lettonie et la
    Lituanie, d'autre part, et modifiant le règlement (CE) nº 2333/2000 déterminant
    la quantité disponible pour le premier trimestre de 2001 pour certains produits
    à base de viande de porc dans le cadre du régime prévu par les accords sur
    la libéralisation des échanges entre la Communauté, d'une part, et la Lettonie,
    la Lituanie et l'Estonie, d'autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2867/2000 der Kommission vom 27. Dezember 2000 zur
    Änderung der Verordnung (EG) Nr. 2305/95 mit Durchführungsbestimmungen zu der
    Einfuhrregelung für Schweinefleisch im Rahmen der Abkommen über Freihandel und
    Handelsfragen zwischen der Gemeinschaft einerseits und Estland, Lettland und Litauen
    andererseits und zur Änderung der Verordnung (EG) Nr. 2333/2000 zur Festsetzung
    der im ersten Vierteljahr 2001 gemäß dem Abkommen über Freihandel und Handelsfragen
    zwischen der Gemeinschaft einerseits und Lettland, Litauen und Estland andererseits
    einführbaren Mengen an bestimmten Schweinefleischerzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2867/2000 af 27. december 2000 om ændring
    af forordning (EF) nr. 2305/95 om gennemførelsesbestemmelser til den ordning,
    der er fastsat i frihandelsaftalerne mellem Det Europæiske Fællesskab på den
    ene side og Estland, Letland og Litauen på den anden side for så vidt angår
    svinekød, og om ændring af forordning (EF) nr. 2333/2000 om fastsættelse af
    den mængde, der er til rådighed for første kvartal af 2001 for bestemte svinekødsprodukter
    under den ordning, der er fastsat i frihandelsaftalerne mellem Det Europæiske
    Fællesskab på den ene side og Estland, Letland og Litauen på den anden side
    for så vidt angår svinekød
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2867/2000 της Επιτροπής,
    της 27ης Δεκεμβρίου 2000, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 2305/95 για τη θέσπιση
    των λεπτομερειών εφαρμογής στον τομέα του
    χοιρείου κρέατος του καθεστώτος που προβλέπεται
    στις συμφωνίες απελευθέρωσης των συναλλαγών
