  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2867/2000, annettu 27 päivänä joulukuuta 2000,
    yhteisön sekä Viron, Latvian ja Liettuan välisissä vapaakauppaa koskevissa
    sopimuksissa määrätyn järjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä sianliha-alalla annetun asetuksen (EY) N:o 2305/95 muuttamisesta
    ja yhteisön Latvian, Liettuan ja Viron kanssa tekemissä vapaakauppaa koskevissa
    sopimuksissa määrätyn järjestelmän mukaisesti vuoden 2001 ensimmäisen vuosineljänneksen
    aikana käytettävissä olevan sianlihatuotteiden määrän määrittämisestä
    annetun asetuksen (EY) N:o 2333/2000 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2867/2000 della Commissione, del 27 dicembre 2000,
    che modifica il regolamento (CE) n. 2305/95 che stabilisce le modalità di applicazione,
    nel settore delle carni suine, del regime previsto dagli accordi sul libero scambio
    tra la Comunità, da una parte, e l'Estonia, la Lettonia e la Lituania, dall'altra,
    nonché il regolamento (CE) n. 2333/2000 che stabilisce la quantità di taluni
    prodotti del settore delle carni suine disponibile nel corso del primo trimestre
    2001 nel quadro del regime previsto dagli accordi sul libero scambio conclusi
    tra la Comunità, da una parte, e la Lettonia, la Lituania e l'Estonia, dall'altra
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2867/2000 van de Commissie van 27 december 2000 houdende
    wijziging van Verordening (EG) nr. 2305/95 tot vaststelling van de uitvoeringsbepalingen,
    in de sector varkensvlees, van de regeling waarin is voorzien bij de Overeenkomsten
    betreffende vrijhandel tussen de Gemeenschap, enerzijds, en Estland, Letland en
    Litouwen, anderzijds, en tot wijziging van Verordening (EG) nr. 2333/2000 tot
    vaststelling van de hoeveelheid van bepaalde producten van de sector varkensvlees
    die, in het kader van de regeling die is vastgesteld in de tussen de Gemeenschap,
    enerzijds, en Estland, Letland en Litouwen, anderzijds, gesloten overeenkomsten
    betreffende vrijhandel, beschikbaar is voor het eerste kwartaal van 2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2867/2000 da Comissão, de 27 de Dezembro de 2000,
    que altera o Regulamento (CE) n.o 2305/95 que estabelece as normas de execução,
    no sector da carne de suíno, do regime previsto nos acordos sobre comércio livre
    entre a Comunidade, por um lado, e a Letónia, a Lituânia e a Estónia, por outro,
    e altera o Regulamento (CE) n.o 2333/2000, que determina a quantidade disponível
    de determinados produtos do sector da carne de suíno, para o primeiro trimestre
    de 2001, no âmbito do regime previsto nos acordos de comércio livre entre a
    Comunidade, por um lado, e a Letónia, a Lituânia e a Estónia, por outro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2867/2000 de la Comisión, de 27 de diciembre de 2000,
    por el que se modifican el Reglamento (CE) nº 2305/95 por el que se establecen
    las disposiciones de aplicación en el sector de la carne de porcino del régimen
    previsto en los acuerdos de libre comercio entre la Comunidad, por un parte, y
    Estonia, Letonia y Lituania, por otra, y el Reglamento (CE) nº 2333/2000 por
    el que se fijan, en aplicación del régimen previsto en los Acuerdos de libre
    comercio entre la Comunidad, por un parte, y Letonia, Lituania y Estonia, por
    otra, las cantidades disponibles durante el primer trimestre de 2001 en lo que
    se refiere a determinados productos del sector de la carne de porcino
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2867/2000 av den 27 december 2000 om
    ändring av förordning (EG) nr 2305/95 om föreskrifter för tillämpningen inom
    grisköttssektorn av den ordning som föreskrivs i avtalen om frihandel mellan
    gemenskapen, å ena sidan, och Estland, Lettland och Litauen, å andra sidan,
    och om ändring av förordning (EG) nr 2333/2000 om fastställande av den disponibla
    kvantiteten för det första kvartalet 2001 för vissa grisköttsprodukter inom
    ramen för den ordning som fastställs i avtalen mellan gemenskapen samt Lettland,
    Litauen och Estland
