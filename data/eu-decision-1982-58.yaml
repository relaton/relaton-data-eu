    μέ τήν ονομασία «UNIGON-Waterfall Sonogram Frequency Analysis System,
    model BC-1» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/58/CEE: Decisione della Commissione, del 21 dicembre 1981, che stabilisce
