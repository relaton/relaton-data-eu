title:
- language: en
  script: Latn
  content: '82/58/EEC: Commission Decision of 21 December 1981 establishing that the
    apparatus described as ''Unigon waterfall sonogram frequency analysis system,
    model BC- 1'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/58/CEE: Décision de la Commission, du 21 décembre 1981, constatant
    que l''importation de l''appareil dénommé "Unigon-Waterfall Sonogram Frequency
    Analysis System, model BC 1" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/58/EWG: Entscheidung der Kommission vom 21. Dezember 1981, mit der
    festgestellt wird, daß das Gerät ,,UNIGON- Waterfall Sonogram Frequency Analysis
    System, model BC- 1" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/58/EØF: Kommissionens beslutning af 21. december 1981 om fastslåelse
    af, at indførsel af apparatet "Unigon- waterfall sonogram frequency analysis
    system, model BC- 1" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/58/EOK: Απόφαση τής Επιτροπής τής 21ης Δεκεμβρίου
