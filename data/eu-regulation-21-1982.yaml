  content: Commission Regulation (EEC) No 21/82 of 6 January 1982 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Egypt must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 21/82 de la Commission, du 6 janvier 1982, fixant le
    montant dont doit être diminué l'élément mobile du prélèvement applicable
    aux sons et remoulages originaires d'Égypte
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 21/82 der Kommission vom 6. Januar 1982 zur Festsetzung
    des Betrages, um den der bewegliche Teilbetrag der Abschöpfung auf Kleie mit
    Ursprung in Ägypten vermindert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 21/82 af 6. januar 1982 om fastsættelse
