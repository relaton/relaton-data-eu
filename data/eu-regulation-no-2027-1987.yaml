title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2027/87 of 8 July 1987 re-establishing the
    levying of customs duties on table linen, toilet linen and kitchen linen, products
    of category 39 (code 40.0390), woven curtains (including drapes) interior blinds,
    products of category 40 (code 40.0400), other made up textile articles, products
    of category 112 (code 40.1120) and floor cloths, dish cloths, etc., products of
    category 113 (code 40.1130) originating in Pakistan to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2027/87 de la Commission du 8 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables au linge de
    table, de toilette ou de cuisine de la catégorie 39 (code 40.0390), aux rideaux,
    stores d' intérieur, etc., de la catégorie 40 (code 40.0400), aux autres articles
    confectionnés en tissus de la catégorie 112 (code 40.1120) et aux torchons,
    serpillières, etc., de la catégorie 113 (code 40.1130), originaires du Pakistan,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2027/87 der Kommission vom 8. Juli 1987 zur Wiedereinführung
    des Zollsatzes für Tischwäsche, Wäsche zur Körperpflege oder Haushaltswäsche
    der Warenkategorie Nr. 39 (Kennziffer 40.0390), Vorhänge, Gardinen und Innenrollos
    usw. der Warenkategorie Nr. 40 (Kennziffer 40.0400), andere konfektionierte Waren
    aus Geweben der Warenkategorie Nr. 112 (Kennziffer 40.1120) und Scheuertücher,
    Wischtücher usw. der Warenkategorie Nr. 113 (Kennziffer 40.1130) mit Ursprung
    in Pakistan, dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2027/87 af 8. juli 1987 om genindførelse
    af opkrævning af toldafgifter for dækketøj, håndklæder og viskestykker under
    varekategori nr. 39 (kode 40.0390), gardiner, rullegardiner, under varekategori
    nr. 40 (kode 40.0400), andre konfektionerede tekstilvarer under varekategori nr.
    112 (kode 40.1120) og gulvklude, karklude, under varekategori nr. 113 (kode 40.1130),
    som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
