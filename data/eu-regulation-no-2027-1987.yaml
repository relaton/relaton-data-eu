  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2027/87 della Commissione dell' 8 luglio 1987 che
    ripristina la riscossione dei dazi doganali applicabili alla biancheria da tavola,
    da toletta o da cucina della categoria di prodotti n. 39 (codice 40.0390), tende,
    tende avvolgibili, ecc. della categoria di prodotti n. 40 (codice 40.0400), altri
    manufatti confezionati di tessuti della categoria di prodotti n. 112 (codice 40.1120),
    torcioni, strofinacci, ecc. della categoria di prodotti n. 113 (codice 40.1130)
    originari del Pakistan, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2027/87 van de Commissie van 8 juli 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tafel-,
    bedde- en huishoudlinnen van de categorie van produkten nr. 39 (codenummer 40.0390),
    gordijnen en jaloezieën, enz. van de categorie van produkten nr. 40 (codenummer
    40.0400), andere geconfectioneerde artikelen van weefsels van de categorie van
    produkten nr. 112 (codenummer 40.1120) en dweilen, vaatdoeken, enz. van de categorie
    van produkten nr. 113 (codenummer 40.1130), van oorsprong uit Pakistan, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3925/86
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2027/87 da Comissão de 8 de Julho de 1987 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis a roupa de mesa, de toucador,
    de cozinha, da categoria de produtos n.° 39 (código 40.0390), cortinados, estores
    de interior, etc., da categoria de produtos n.° 40 (código 40.0400), outros
    artefactos confeccionados em tecido da categoria de produtos n.° 112 (código
    40.1120), rodilhas, serapilheiras, etc., da categoria de produtos n.° 113 (código
    40.1130), originários do Paquistão, beneficiário das preferências pautais
    previstas no Regulamento (CEE) n.° 3925/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2027/87 de la Comisión de 8 de julio de 1987 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a ropa
    de mesa, de tocador o de cocina, de la categoría de productos n° 39 (código
    40.0390), cortinas, visillos, etc., de la categoría de productos n° 40 (código
    40.0400), otros artículos confeccionados con tejidos de la categoría de productos
    n° 112 (código 40.1120), bayetas, arpilleras para fregar, etc., de la categoría
    de productos n° 113 (código 40.1130), originarios de Pakistán, beneficiario
    de las preferencias arancelarias previstas por el Reglamento (CEE) n° 3925/86
    del Consejo
