  content: Règlement (CEE) n° 2055/72 du Conseil, du 26 septembre 1972, portant
    ouverture, répartition et mode de gestion d'un contingent tarifaire communautaire
    pour les noisettes fraîches ou sèches, même sans leurs coques ou décortiquées,
    de la sous-position EX 08.05 G du tarif douanier commun, originaires de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2055/72 des Rates vom 26. September 1972 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Haselnüsse,
    frisch oder getrocknet, auch ohne äußere Schalen oder enthäutet der Tarifstelle
    ex 08.05 G des Gemeinsamen Zolltarifs, mit Ursprung in der Türkei
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2055/72 del Consiglio, del 26 settembre 1972, relativo
    all'apertura, alla ripartizione e alle modalità di gestione di un contingente
    tariffario comunitario per le nocciole fresche o secche, anche sgusciate o decorticate,
    della sottovoce ex 08.05 G della tariffa doganale comune, originarie della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2055/72 van de Raad van 26 september 1972 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor hazelnoten, vers of gedroogd, ook zonder dop of schaal, al dan niet gepeld,
    van onderverdeling ex 08.05 G van het gemeenschappelijk douanetarief, van oorsprong
    uit Turkije
