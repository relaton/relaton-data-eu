title:
- language: en
  script: Latn
  content: '80/916/EEC: Commission Decision of 4 September 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to women''s, girls''and infants''woven overcoats,
    raincoats and other coats, cloaks and capes ; jackets and blazers, falling within
    heading No ex 61.02 B of the Common Customs Tariff (category 15 B), originating
    in Hungary and in free circulation in the other Member States (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/916/CEE: Décision de la Commission, du 4 septembre 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les manteaux, imperméables et vestes,
    tissés, pour femmes, fillettes et jeunes enfants, de la sous-position ex 61.02
    B du tarif douanier commun (catégorie 15 B), originaires de Hongrie et mis en
    libre pratique dans les autres États membres (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/916/EWG: Entscheidung der Kommission vom 4. September 1980, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Ungarn stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Mäntel, Umhänge und Jacken, aus Geweben, für
    Frauen, Mädchen und Kleinkinder, der Tarifstelle ex 61.02 B des Gemeinsamen Zolltarifs
    (Kategorie 15 B) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/916/EØF: Kommissionens beslutning af 4. september 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage frakker, kapper og slag, jakker og blazere,
    vævede, til kvinder, piger og småbørn, som henhører under pos. ex 61.02 B
    i den fælles toldtarif (kategori 15 B), har oprindelse i Ungarn og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/916/CEE: Decisione della Commissione, del 4 settembre 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i cappotti, soprabiti, mantelli e simili,
    e giacche, tessuti, per donna, per ragazza e per bambini, della sottovoce ex 61.02
    B della tariffa doganale comune, categoria 15 B, originari dell''Ungheria e messi
    in libera pratica negli altri Stati membri (Il testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/916/EEG: Beschikking van de Commissie van 4 september 1980 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd mantels, regenjassen en capes daaronder begrepen, blazers en
    jasjes, geweven, voor dames, meisjes en kinderen, van post ex 61.02 B van het
    gemeenschappelijk douanetarief (categorie 15 B), van oorsprong uit Hongarije en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
