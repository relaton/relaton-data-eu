title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 365/92 of 14 February 1992 fixing the number
    of young male bovine animals which may be imported on special terms in the first
    quarter of 1992 derogating from Regulation (EEC) No 2377/80 in respect of that
    quarter and repealing Regulation (EEC) No 3702/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 365/92 de la Commission du 14 février 1992 relatif
    à la fixation de la quantité de jeunes bovins mâles pouvant être importés
    à des conditions spéciales pour le premier trimestre de 1992, portant dérogation,
    pour ce trimestre, au règlement (CEE) n° 2377/80 et abrogeant le règlement
    (CEE) n° 3702/91
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 365/92 DER KOMMISSION vom 14. Februar 1992 zur Festsetzung
    der Anzahl männlicher Jungrinder, die im ersten Vierteljahr 1992 unter Sonderbedingungen
    eingeführt werden können, zur Abweichung von der Verordnung (EWG) Nr. 2377/80
    in diesem Vierteljahr und zur Aufhebung der Verordnung (EWG) Nr. 3702/91 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 365/92 af 14. februar 1992 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i første kvartal
    af 1992, om undtagelse for dette kvartal fra forordning (EØF) nr. 2377/80 og
    om ophævelse af forordning (EØF) nr. 3702/91 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 365/92 της Επιτροπής
    της 14ης Φεβρουαρίου 1992 για τον καθορισμό των
    ποσοτήτων των νεαρών βοοειδών που είναι δυνατό
    να εισαχθούν με ειδικούς όρους κατά το πρώτο
    τρίμηνο του 1992, για παρέκκλιση, κατά το τρίμηνο
    αυτό, από τον κανονισμό (ΕΟΚ) αριθ. 2377/80 και για
    κατάργηση του κανονισμού (ΕΟΚ) αριθ. 3702/91
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 365/92 DELLA COMMISSIONE del 14 febbraio 1992 che
    fissa il numero di giovani bovini maschi che possono essere importati a condizioni
    speciali nel primo trimestre del 1992, recante deroga, per questo trimestre, al
    regolamento (CEE) n. 2377/80, nonché abrogazione del regolamento (CEE) n. 3702/91
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 365/92 VAN DE COMMISSIE van 14 februari 1992 tot
    vaststelling van het aantal jonge mannelijke runderen dat in het eerste kwartaal
    van 1992 onder bijzondere voorwaarden mag worden ingevoerd en houdende afwijking,
    voor dat kwartaal, van Verordening (EEG) nr. 2377/80 en tot intrekking van Verordening
    (EEG) nr. 3702/91 #'
  type: main
- language: pt
  script: Latn
  content: Regulamento ( CEE ) n° 365/92 da Comissão, de 14 de Fevereiro de 1992,
    relativo à fixação da quantidade de vitelos machos que podem ser importados
    em condições especiais durante o primeiro trimestre de 1992, que derroga, no
    que diz respeito ao referido trimestre, o Regulamento ( CEE ) n° 2377/80 e revoga
    o Regulamento ( CEE ) n° 3702/91
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 365/92 DE LA COMISIÓN de 14 de febrero de 1992 por
    el que se fija la cantidad de machos jóvenes de la especie bovina que podrán
    importarse en condiciones especiales durante el primer trimestre de 1992, por
    el que se establece una excepción, para ese trimestre, al Reglamento (CEE) no
    2377/80 y por el que se deroga el Reglamento (CEE) no 3702/91 #'
