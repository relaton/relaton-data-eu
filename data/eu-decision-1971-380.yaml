title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 novembre 1971, autorisant le Royaume
    des Pays-Bas à admettre, jusqu'au 31 décembre 1971 inclus, la commercialisation
    de semences de trois variétés d'orges d'hiver, soumises à des exigences réduites
  type: main
- language: de
  script: Latn
  content: '71/380/EWG: Entscheidung der Kommission vom 12. November 1971 über die
    Ermächtigung des Königreichs der Niederlande bis zum 31. Dezember 1971 einschließlich
    Saatgut von drei Sorten von Wintergerste mit minderen Anforderungen zum Verkehr
    zuzulassen'
  type: main
- language: it
  script: Latn
  content: '71/380/CEE: Decisione della Commissione, del 12 novembre 1971, che autorizza
    il Regno dei Paesi Bassi ad ammettere, fino al 31 dicembre 1971 incluso, la commercializzazione
    di sementi di tre varietà di orzo invernale, soggette a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '71/380/EEG: Beschikking van de Commissie van 12 november 1971 tot machtiging
    van het Koninkrijk der Nederlanden om tot en met 31 december 1971 zaad van drie
    rassen wintergerst, waaraan minder strenge eisen zijn gesteld, tot de handel toe
    te laten.'
