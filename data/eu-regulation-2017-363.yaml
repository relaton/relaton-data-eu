    ponoči ali v instrumentalnih meteoroloških razmerah in zahtev za odobritev usposabljanja
    za ravnanje z nevarnim blagom v zvezi s komercialnimi specializiranimi operacijami,
    nekomercialnimi operacijami s kompleksnimi zrakoplovi na motorni pogon in nekomercialnimi
    specializiranimi operacijami s kompleksnimi zrakoplovi na motorni pogon
  type: main
