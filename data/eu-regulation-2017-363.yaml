    med enmotorede turbineflyvemaskiner om natten eller under instrumentvejrforhold
    og godkendelseskravene for træning i håndtering af farligt gods for erhvervsmæssige
    specialoperationer, ikke-erhvervsmæssige operationer med komplekse motordrevne
    luftfartøjer og ikke-erhvervsmæssige specialoperationer med komplekse motordrevne
    luftfartøjer
  type: main
