    mitteärilise transpordi lendudeks kasutatavate keerukate mootorõhusõidukite
    ja mitteärilise transpordi erilendudeks kasutatavate keerukate mootorõhusõidukite
    käitamisega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2017/363, annettu 1 päivänä maaliskuuta 2017,
    asetuksen (EU) N:o 965/2012 muuttamisesta yksimoottorisilla turbiinilentokoneilla
    yöllä tai mittarisääolosuhteissa harjoitettavan lentotoiminnan erityishyväksynnän
    ja kaupalliseen erityislentotoimintaan, vaativilla moottorikäyttöisillä ilma-aluksilla
    harjoitettavaan muuhun kuin kaupalliseen lentotoimintaan ja vaativilla moottorikäyttöisillä
    ilma-aluksilla harjoitettavaan muuhun kuin kaupalliseen erityislentotoimintaan
    liittyvän vaarallisia aineita koskevan koulutuksen hyväksyntävaatimusten osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2017/363 оd 1. ožujka 2017. o izmjenama Uredbe (EU)
    br. 965/2012 u pogledu operacija jednomotornih aviona s turbinskim motorom noću
    ili u instrumentalnim meteorološkim uvjetima te zahtjeva za odobravanje osposobljavanja
    o opasnoj robi za komercijalne specijalizirane operacije i nekomercijalne operacije
    kompleksnim zrakoplovima na motorni pogon, uključujući nekomercijalne specijalizirane
    operacije kompleksnim zrakoplovima na motorni pogon
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/363 rendelete (2017. március 1.) a 965/2012/EU
    rendeletnek az egyhajtóműves gázturbinás repülőgéppel éjszaka vagy műszeres
    időjárási körülmények között végrehajtott műveletek egyedi jóváhagyása,
    valamint a kereskedelmi célú egyedi légi szállítási műveletekhez, a hajtóművel
    rendelkező komplex légi járművekkel végzett nem kereskedelmi célú légi
    szállítási műveletekhez és a hajtóművel rendelkező komplex légi járművekkel
    végzett nem kereskedelmi célú egyedi légi szállítási műveletekhez kapcsolódó,
    veszélyes árukkal kapcsolatos képzésre vonatkozó jóváhagyási követelmények
    jóváhagyása tekintetében való módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2017/363 della Commissione, del 1° marzo 2017, che modifica
    il regolamento (UE) n. 965/2012 per quanto riguarda l'approvazione specifica delle
    operazioni con velivoli monomotore a turbina effettuate di notte o in condizioni
    meteorologiche di volo strumentale e i requisiti di approvazione per l'addestramento
    per merci pericolose relativo a operazioni commerciali specializzate, operazioni
    non commerciali effettuate con aeromobili a motore complessi e operazioni non
    commerciali specializzate effettuate con aeromobili a motore complessi
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2017/363 (2017. gada 1. marts), ar ko Regulu (ES)
    Nr. 965/2012 groza attiecībā uz īpašo apstiprinājumu lidmašīnu ar vienu
    turbodzinēju ekspluatācijai naktī vai instrumentālajos meteoroloģiskajos
    apstākļos un apstiprinājuma prasībām apmācībai darbībām ar bīstamiem
    izstrādājumiem, kas attiecas uz komerciālo specializēto ekspluatāciju, kompleksu
    gaisa kuģu ar dzinēju nekomerciālo ekspluatāciju un kompleksu gaisa kuģu
    ar dzinēju nekomerciālo specializēto ekspluatāciju
  type: main
- language: lt
  script: Latn
  content: 2017 m. kovo 1 d. Komisijos reglamentas (ES) 2017/363, kuriuo iš dalies
