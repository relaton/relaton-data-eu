title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2017/363 of 1 March 2017 amending Regulation
    (EU) No 965/2012 as regards the specific approval of single-engined turbine aeroplane
    operations at night or in instrument meteorological conditions and the approval
    requirements for the dangerous goods training relating to commercial specialised
    operations, non-commercial operations of complex motor-powered aircraft and non-commercial
    specialised operations of complex motor-powered aircraft
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/363 de la Commission du 1er mars 2017 modifiant le
    règlement (UE) n° 965/2012 en ce qui concerne l'agrément spécifique de l'exploitation
    d'avions monomoteurs à turbine de nuit ou en conditions météorologiques de
    vol aux instruments, et les conditions d'agrément pour la formation sur les marchandises
    dangereuses aux fins d'exploitation spécialisée commerciale, d'exploitation
    non commerciale d'aéronefs motorisés complexes et d'exploitation spécialisée
    non commerciale d'aéronefs motorisés complexes
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2017/363 der Kommission vom 1. März 2017 zur Änderung
    der Verordnung (EU) Nr. 965/2012 im Hinblick auf eine Sondergenehmigung für den
    Betrieb einmotoriger Turbinenflugzeuge bei Nacht oder unter Instrumentenwetterbedingungen
    und im Hinblick auf die Anforderungen an die Genehmigung von Gefahrgut-Schulungsprogrammen
    für den gewerblichen spezialisierten Flugbetrieb, den nichtgewerblichen Flugbetrieb
    mit technisch komplizierten motorgetriebenen Luftfahrzeugen und den nichtgewerblichen
    spezialisierten Flugbetrieb mit technisch komplizierten motorgetriebenen Luftfahrzeugen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2017/363 на Комисията от 1 март
    2017 година за изменение на Регламент (ЕС) № 965/2012
    по отношение на специалното одобрение за операции
    с едномоторни самолети с турбинен двигател
    през нощта или при метеорологични условия,
    налагащи летене по уреди, и на изискванията
    за одобрение за обучението по опасни товари,
    свързано с търговски специализирани операции,
    нетърговски операции на сложни въздухоплавателни
    средства с моторна тяга и нетърговски специализирани
    операции на сложни въздухоплавателни средства
    с моторна тяга
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2017/363 ze dne 1. března 2017, kterým se mění
    nařízení (EU) č. 965/2012, pokud jde o zvláštní schválení provozu jednomotorových
    turbínových letounů v noci nebo za meteorologických podmínek pro let podle
    přístrojů a požadavky na schválení výcviku v oblasti nebezpečného zboží
    v souvislosti se zvláštním obchodním provozem, neobchodním provozem složitých
    motorových letadel a se zvláštním neobchodním provozem složitých motorových
    letadel
  type: main
