    letúnov s turbínovým motorom v noci alebo za meteorologických podmienok na
    let podľa prístrojov a schvaľovacie požiadavky na výcvik týkajúci sa nebezpečného
    nákladu, ktorý súvisí s obchodnou špeciálnou prevádzkou, neobchodnou prevádzkou
