    pe timp de noapte sau în condiții meteorologice de zbor instrumental ale avioanelor
    monomotor cu turbină și la cerințele de aprobare a cursurilor de formare pe
    tema bunurilor periculoase legate de activități comerciale specializate, de
    activități necomerciale efectuate cu aeronave motorizate complexe și de activități
