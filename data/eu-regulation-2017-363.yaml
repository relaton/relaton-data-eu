    variklio lėktuvais naktį arba meteorologinėmis sąlygomis pagal prietaisus
    specialiųjų patvirtinimų ir dėl mokymo, susijusio su pavojingų krovinių
    vežimu vykdant komercinius specialiuosius skrydžius, nekomercinius skrydžius
    sudėtingais varikliu varomais orlaiviais ir nekomercinius specialiuosius skrydžius
    sudėtingais varikliu varomais orlaiviais, patvirtinimo reikalavimų
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2017/363 tal-1 ta' Marzu 2017 li jemenda
    r-Regolament (UE) Nru 965/2012 rigward l-approvazzjoni speċifika ta' operazzjonijiet
    b'ajruplani b'magna waħda bit-turbini billejl jew f'kundizzjonijiet meteoroloġiċi
    tal-istrument u r-rekwiżiti ta' approvazzjoni għat-taħriġ dwar oġġetti perikolużi
