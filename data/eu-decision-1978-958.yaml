title:
- language: en
  script: Latn
  content: '78/958/EEC: Commission Decision of 9 November 1978 authorizing the French
    Republic not to apply Community treatment to men'' s and boys'' shirts, woven,
    of wool, of cotton or of man-made textile fibres, falling within heading No ex
    61.03 of the Common Customs Tariff (NIMEXE codes 61.03-11, 15, 19), originating
    in Sri Lanka and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/958/CEE: Décision de la Commission, du 9 novembre 1978, autorisant
    la République française à exclure du traitement communautaire les chemises
    et chemisettes tissées, pour hommes et garçonnets, de laine, de coton ou de
    fibres textiles synthétiques ou artificielles de la position ex 61.03 du tarif
    douanier commun (codes Nimexe: 61.03-11; 15; 19), originaires de Sri Lanka et
    mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/958/EWG: Entscheidung der Kommission vom 9. November 1978, mit der
    die Französische Republik ermáchtigt wird, aus Sri Lanka stammende und in den
    úbrigen Mitgliedstaaten im freien Verkehr befindliche Oberhemden, auch Sport-
    und Arbeitshemden aus Geweben, fúr Mánner und Knaben, aus Wolle, Baumwolle oder
    synthetischen oder kúnstlichen Spinnstoffen, der Tarifnummer ex 61.03 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 61.03-11; 15; 19) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/958/EØF: Kommissionens beslutning af 9. november 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter), til mænd og drenge, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 61.03 i den fælles
    toldtarif (NIMEXE-kode 61.03-11, 15, 19), har oprindelse i Sri Lanka og frit kan
    omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/958/CEE: Decisione della Commissione, del 9 novembre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie e le
    camicette, tessute, per uomo e per ragazzo, di lana, di cotone o di fibre tessili
    sintetiche o artificiali, della voce ex 61.03 della tariffa doganale comune (codice
    Nimexe: 61.03-11, 15, 19), originarie dello Sri Lanka e messe in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/958/EEG: Beschikking van de Commissie van 9 november 1978 waarbij de
    Franse Republiek wordt gemachtigd overhemden en sporthemden voor heren en jongens,
    geweven van wol of katoen of van synthetische of van kunstmatige textielvezels,
    van post ex 61.03 van het gemeenschappelijk douanetarief (NIMEXE-code 61.03-11,
    15, 19), van oorsprong uit Sri Lanka en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
