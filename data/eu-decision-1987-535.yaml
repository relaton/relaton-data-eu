title:
- language: en
  script: Latn
  content: '87/535/EEC: Commission Decision of 23 October 1987 amending Decision 87/233/EEC
    recognizing that the production of certain quality wines produced in specified
    regions, because of their qualitative features, is far below demand (Only the
    Spanish, French and Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/535/CEE: Décision de la Commission du 23 octobre 1987 rectifiant la
    décision 87/233/CEE, reconnaissant que la production de certains vins de qualité
    produits dans des régions déterminées est, du fait des caractéristiques qualitatives
    de ces vins, largement inférieure à la demande (Les textes en langues espagnole,
    française et italienne sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/535/EWG: Entscheidung der Kommission vom 23. Oktober 1987 zur Berichtigung
    der Entscheidung 87/233/EWG zur Anerkennung, daß die Nachfrage die Erzeugung
    an bestimmten Qualitätsweinen b. A. wegen der qualitativen Merkmale dieser Weine
    weit überschreitet (Nur der spanische, französische und italienische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/535/EØF: Kommissionens beslutning af 23. oktober 1987 om berigtigelse
    af beslutning 87/233/EØF om anerkendelse af, at produktionen af visse kvalitetsvine
    fra bestemte dyrkningsområder på grund af disse vines kvalitative egenskaber
    langt fra er tilstrækkelig til at dække efterspørgslen (Kun den spanske, franske
    og italienske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '87/535/ΕΟΚ: Απόφαση της Επιτροπής της 23ης
    Οκτωβρίου 1987 που επιφέρει διορθώσεις στην
    απόφαση 87/233/ΕΟΚ που αναγνωρίζει ότι η παραγωγή
    ορισμένων οίνων ποιότητας που παράγονται σε
    καθορισμένες περιοχές, λόγω των ποιοτικών
    χαρακτηριστικών των οίνων αυτών, είναι πολύ
    μικρότερη από τη ζήτηση (Τα κείμενα στην ισπανική,
    γαλλική και ιταλική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '87/535/CEE: Decisione della Commissione del 23 ottobre 1987 recante rettifica
    della decisione 87/233/CEE che riconosce che la produzione di taluni vini di qualità
    prodotti in regioni determinate, in considerazione delle loro caratteristiche
    qualitative, è ampiamente inferiore alla domanda (Il testi in lingua spagnola,
    francese e italiana sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '87/535/EEG: Beschikking van de Commissie van 23 oktober 1987 houdende
    rectificatie van Beschikking 87/233/EEG houdende erkenning van het feit dat de
    produktie van bepaalde v.q.p.r.d., gezien haar kwaliteitskenmerken, ver bij de
    vraag achterblijft (Slechts de teksten in de Spaanse, Franse en de Italiaanse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/535/CEE: Decisão da Comissão de 23 de Outubro de 1987 que rectifica
    a Decisão 87/233/CEE que reconhece que a produção de determinados vinhos de
    qualidade produzidos em regiões determinadas é devido às características qualitativas
    destes vinhos, largamente inferior à procura (Apenas fazem fé os textos nas
    línguas espanhola, francesa e italiana)'
  type: main
- language: es
  script: Latn
  content: '87/535/CEE: Decisión de la Comisión de 23 de octubre de 1987 que rectifica
    la Decisión 87/233/CEE, por la que se reconoce que la producción de determinados
    vinos de calidad, producidos en regiones determinadas, debido a las características
    cualitativas de dichos vinos, es ampliamente inferior a la demanda (Los textos
    en lenguas española, francesa y italiana son los únicos auténticos)'
  type: main
