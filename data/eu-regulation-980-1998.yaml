    el Reglamento (CE) nº 19/98 por el que se suspende la venta de mantequilla de
    existencias públicas en virtud del Reglamento (CEE) nº 3143/85 relativo a la
    comercialización a precio reducido de mantequilla de intervención destinada
    al consumo inmediato en forma de mantequilla concentrada y la concesión de ayuda
    en virtud del Reglamento (CEE) nº 429/90 relativo a la concesión mediante licitación
    de una ayuda para la mantequilla concentrada destinada al consumo inmediato en
    la Comunidad
