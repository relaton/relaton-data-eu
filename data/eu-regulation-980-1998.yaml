  script: Latn
  content: Regulamento (CE) nº 980/98 da Comissão de 8 de Maio de 1998 que revoga
    o Regulamento (CE) nº 19/98 que suspende a venda de manteiga de existências
    públicas ao abrigo do Regulamento (CEE) nº 3143/85 relativo ao escoamento a
    preço reduzido da manteiga de intervenção destinada ao consumo directo sob
    a forma de manteiga concentrada e à concessão de ajuda nos termos do Regulamento
    (CEE) nº 429/90 relativo à concessão por concurso de uma ajuda à manteiga
    concentrada destinada ao consumo directo na Comunidade
  type: main
- language: es
  script: Latn
