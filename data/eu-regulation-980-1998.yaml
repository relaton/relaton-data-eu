title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 980/98 of 8 May 1998 repealing Regulation
    (EC) No 19/98 suspending the sale of butter from public stocks pursuant to Regulation
    (EEC) No 3143/85 on the sale at reduced prices of intervention butter intended
    for direct consumption in the form of concentrated butter and the granting of
    aid pursuant to Regulation (EEC) No 429/90 on the granting by invitation to tender
    of an aid for concentrated butter intended for direct consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 980/98 de la Commission du 8 mai 1998 abrogeant le
    règlement (CE) nº 19/98 portant suspension de la vente de beurre de stock public
    en vertu du règlement (CEE) nº 3143/85 relatif à l'écoulement à prix réduit
    de beurre d'intervention destiné à la consommation directe sous forme de beurre
    concentré et de l'octroi d'aide en vertu du règlement (CEE) nº 429/90 relatif
    à l'octroi par adjudication d'une aide au beurre concentré destiné à la consommation
    directe dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 980/98 der Kommission vom 8. Mai 1998 zur Aufhebung
    der Verordnung (EG) Nr. 19/98 zur Aussetzung des Verkaufs von Butter aus öffentlichen
    Beständen gemäß der Verordnung (EWG) Nr. 3143/85 über den Absatz von Butter
    zu herabgesetzten Preisen aus Beständen der Interventionsstellen für den unmittelbaren
    Verbrauch in Form von Butterfett und der Gewährung der Beihilfe gemäß Verordnung
    (EWG) Nr. 429/90 über die Gewährung einer Beihilfe im Ausschreibungsverfahren
    für Butterfett zum unmittelbaren Verbrauch in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 980/98 af 8. maj 1998 om ophævelse af
    forordning (EF) nr. 19/98 om suspension af salg af smør fra offentlige lagre
    i henhold til forordning (EØF) nr. 3143/85 om afsætning til nedsat pris af interventionssmør
    bestemt til direkte forbrug i form af koncentreret smør og af ydelse af støtte
    i henhold til forordning (EØF) nr. 429/90 om støtte ved licitation til koncentreret
    smør bestemt til direkte forbrug i Fællesskabet
  type: main
- language: el
  script: Grek
