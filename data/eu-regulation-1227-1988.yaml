    des innergemeinschaftlichen Verkehrs mit Waren, die zum vorübergehenden Gebrauch
    aus einem Mitgliedstaat in einen oder mehrere andere Mitgliedstaaten versandt
    werden
  type: main
- language: da
  script: Latn
