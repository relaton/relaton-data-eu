  content: Règlement n° 64 de la Commission, relatif à la fixation de normes communes
    de qualité pour certains produits de l'annexe I B du règlement n° 23 portant
    établissement graduel d'une organisation commune des marchés dans le secteur
    des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 64 der Kommission betreffend die Festsetzung von gemeinsamen
    Qualitätsnormen für einige Erzeugnisse im Anhang I B der Verordnung Nr. 23 über
    die schrittweise Errichtung einer gemeinsamen Marktorganisation für Obst und
    Gemüse
  type: main
- language: it
  script: Latn
  content: Regolamento n. 64 della Commissione relativo alla determinazione di norme
    comuni di qualità per alcuni prodotti dell'allegato I B del regolamento n. 23
    del Consiglio relativo alla graduale attuazione di un'organizzazione comune dei
    mercati nel settore degli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 64 van de Commissie met betrekking tot de vaststelling
    van gemeenschappelijke kwaliteitsnormen voor de produkten van Bijlage I B van
    Verordening Nr. 23, houdende de geleidelijke totstandbrenging van een gemeenschappelijke
    ordening der markten in de sector groenten en fruit
