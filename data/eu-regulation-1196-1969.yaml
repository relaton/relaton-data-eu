  content: Règlement (CEE) n° 1196/69 du Conseil, du 26 juin 1969, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire supplémentaire
    de 20 000 tonnes de thons, frais, réfrigérés ou congelés, entiers, décapités
    ou tronçonnés, destinés à l'industrie de la conserve, de la position EX 03.01
    B I b) du tarif douanier commun (année 1969)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1196/69 des Rates vom 26. Juni 1969 über die Eröffnung,
    Aufteilung und Verwaltung des zusätzlichen Gemeinschaftszollkontingents von 20
    000 Tonnen für Thunfische, frisch, gekühlt oder gefroren, ganz, ohne Kopf oder
    zerteilt, für die Konservenindustrie, der Tarifnummer ex 03.01 B I b) des Gemeinsamen
    Zolltarifs (1969)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1196/69 del Consiglio, del 26 giugno 1969, relativo
    all'apertura, alla suddivisione e alle modalità di gestione del contingente tariffario
    comunitario supplementare di 20.000 tonnellate di tonni freschi, refrigerati o
    congelati, interi, decapitati o in pezzi, destinati all'industria conserviera,
    della voce ex 03.01 B I b) della tariffa doganale comune (anno 1969)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1196/69 van de Raad van 26 juni 1969 betreffende
    de opening, de verdeling en de wijze van beheer van het aanvullende communautaire
    tariefcontingent van 20.000 ton tonijn, vers, gekoeld of bevroren, ook indien
    ontdaan van kop of in moten gesneden, bestemd voor de conservenindustrie, van
    post ex 03.01 B I b) van het gemeenschappelijk douanetarief (1969)
