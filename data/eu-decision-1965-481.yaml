title:
- language: fr
  script: Latn
  content: Décision 65/481/CEE de la Commission, du 12 octobre 1965, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations en République française de chocolat et de
    confiseries et préparations comportant du cacao ou du chocolat, sans liqueur
    alcoolique, en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '65/481/EWG: Entscheidung der Kommission vom 12. Oktober 1965 zur erneuten
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Schokolade, Schokoladewaren und kakaohaltigen oder schokoladehaltigen
    Zuckerwaren, nicht alkoholhaltig, aus verschiedenen Mitgliedstaaten in die Französische
    Republik'
  type: main
- language: it
  script: Latn
  content: '65/481/CEE: Decisione della Commissione, del 12 ottobre 1965, che modifica
    nuovamente la decisione del 6 novembre 1964 che autorizza la riscossione di tasse
    di compensazione sulle importazioni, nella Repubblica francese, di cioccolata,
    di dolciumi e di preparazioni contenenti cacao o cioccolata, senza alcolici, in
    provenienza da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/481/EEG: Beschikking van de Commissie van 12 oktober 1965 tot nieuwe
    wijziging van haar beschikking van 6 november 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Franse Republiek van chocolade
    en van suikerwerk en voedingsmiddelen met cacao of met chocolade, zonder likeur,
    uit bepaalde Lid-Staten'
  type: main
