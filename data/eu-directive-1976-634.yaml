title:
- language: en
  script: Latn
  content: Council Directive 76/634/EEC of 22 July 1976 amending Directives 69/74/EEC,
    69/75/EEC and 71/235/EEC on the harmonization of provisions laid down by law,
    regulation or administrative action relating respectively to customs warehousing
    procedure, free zones and to the usual forms of handling which may be carried
    out in customs warehouses and in free zones
  type: main
- language: fr
  script: Latn
  content: Directive 76/634/CEE du Conseil, du 22 juillet 1976, modifiant les directives
    69/74/CEE, 69/75/CEE et 71/235/CEE qui concernent l'harmonisation des dispositions
    législatives, réglementaires et administratives relatives respectivement au
    régime des entrepôts douaniers, au régime des zones franches et aux manipulations
    usuelles pouvant être effectuées dans les entrepôts douaniers et dans les zones
    franches
  type: main
- language: de
  script: Latn
  content: Richtlinie 76/634/EWG des Rates vom 22. Juli 1976 zur Änderung der Richtlinien
    69/74/EWG, 69/75/EWG und 71/235/EWG zur Harmonisierung der Rechts- und Verwaltungsvorschriften
    über Zollager, Freizonen bzw. die üblichen Behandlungen, die in Zollagern und
    Freizonen vorgenommen werden können
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 76/634/EØF af 22. juli 1976 om ændring af direktiverne
    69/74/EØF, 69/75/EØF og 71/235/EØF, som vedrører harmonisering af lovgivning
    henholdsvis om toldoplag, om frizoner og om de sædvanlige behandlinger, der kan
    foretages på toldoplag og i frizoner
  type: main
- language: el
  script: Grek
  content: Οδηγία 76/634/ΕΟΚ του Συμβουλίου της 22ας Ιουλίου
    1976 περί τροποποιήσεως των οδηγιών 69/74/ΕΟΚ, 69/75/ΕΟΚ
    και 71/235/ΕΟΚ «περί εναρμονίσεως των νομοθετικών,
    κανονιστικών και διοικητικών διατάξεων που
    αφορούν αντιστοίχως το καθεστώς της τελωνειακής
    αποταμιεύσεως και το καθεστώς των ελευθέρων
    ζωνών και τις συνήθεις εργασίες που δύνανται
    να πραγματοποιούνται στις τελωνειακές αποθήκες
    και στις ελεύθερες ζώνες»
  type: main
- language: it
  script: Latn
  content: Direttiva 76/634/CEE del Consiglio, del 22 luglio 1976, che modifica le
    direttive 69/74/CEE, 69/75/CEE e 71/235/CEE sull'armonizzazione delle disposizioni
    legislative, regolamentari ed amministrative relative rispettivamente al regime
    dei depositi doganali, al regime delle zone franche e alle manipolazioni usuali
    che possono essere effettuate nei depositi doganali e nelle zone franche
  type: main
- language: nl
  script: Latn
  content: Richtlijn 76/634/EEG van de Raad van 22 juli 1976 tot wijziging van de
    Richtlijnen 69/74/EEG, 69/75/EEG en 71/235/EEG, inzake de harmonisatie van de
    wettelijke en bestuursrechtelijke bepalingen respectievelijk met betrekking tot
    het stelsel van douane-entrepots, het stelsel van vrije zones en de gebruikelijke
    behandelingen die in douane-entrepots en in vrije zones mogen worden verricht
  type: main
- language: pt
  script: Latn
  content: Directiva 76/634/CEE do Conselho, de 22 de Julho de 1976, que altera as
    Directivas 69/74/CEE e 71/235/CEE relativas à harmonização das disposições
    legislativas, regulamentares e administrativas relativas, respectivamente ao regime
    dos entrepostos aduaneiros, ao regime das zonas francas e às manipulações usuais
    que podem ser efectuadas em entrepostos aduaneiros e em zonas francas
  type: main
- language: es
  script: Latn
  content: Directiva 76/634/CEE del Consejo, de 22 de julio de 1976, por la que se
    modifican las Directivas 69/74/CEE y 71/235/CEE, en lo que se refiere a la armonización
    de las disposiciones legales, reglamentarias y administrativas relativas respectivamente
    al régimen de depósitos aduaneros, al régimen de zonas francas y a las manipulaciones
    usuales que pueden efectuarse en los depósitos aduaneros y en las zonas francas
  type: main
