    fajaihoz tartozó, természetes úton vagy mesterségesen törpésített, a Koreai
    Köztársaságból származó, ültetésre szánt növényeknek az Unió területére
    történő behozatala tekintetében az (EU) 2019/2072 végrehajtási rendelettől
    való eltérés bevezetéséről
  type: main
- language: it
  script: Latn
