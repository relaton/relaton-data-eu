- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1310 of 27 June 2023 establishing
    a derogation from Implementing Regulation (EU) 2019/2072 concerning the introduction
    into the Union territory of naturally or artificially dwarfed plants for planting
    of Chamaecyparis Spach, Juniperus L. and certain species of Pinus L., originating
    in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1310 de la Commission du 27 juin 2023
    établissant une dérogation au règlement d’exécution (UE) 2019/2072 en ce
    qui concerne l’introduction sur le territoire de l’Union de végétaux dont
    la croissance est inhibée naturellement ou artificiellement, destinés à la
    plantation, de Chamaecyparis Spach, de Juniperus L. et de certaines espèces de
    Pinus L., originaires de la République de Corée
  type: main
