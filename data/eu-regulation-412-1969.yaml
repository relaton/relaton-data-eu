  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 412/69, annettu 4 päivänä maaliskuuta 1969,
    asetusten (ETY) N:o 1098/68 ja 1100/68 muuttamisesta tiettyjen maitotuotteiden
    viennissä mahdollisesti ilmenevien tiettyjen erityistapausten huomioon ottamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 412/69 della Commissione, del 4 marzo 1969, che modifica
    i regolamenti (CEE) nn. 1096/68, 1098/68 e 1100/68 per tener conto di alcuni casi
    particolari che possono presentarsi all' esportazione di certi prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 412/69 van de Commissie van 4 maart 1969 houdende
    wijziging van de Verordeningen (EEG) nr. 1096/68, nr. 1098/68 en nr. 1100/68 ten
    einde rekening te houden met bepaalde bijzondere gevallen die zich bij de uitvoer
    van bepaalde zuivelprodukten kunnen voordoen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 412/69 da Comissão, de 4 de Março de 1969, que
    altera os Regulamentos (CEE) n.° 1096/68, (CEE) n.° 1098/68 e (CEE) n.° 1100/68
    a fim de tomar em conta certos casos especiais que podem apresentar-se aquando
    da exportação de certos produtos lácteos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 412/69 de la Comisión, de 4 de marzo de 1969, por
    el que se modifica los Reglamentos (CEE) n° 1096/68 y 1100/68 para tener en cuenta
    determinados casos especiales que se puedan presentar en el momento de la exportación
    de determinados productos lácteos
  type: main
- language: sv
