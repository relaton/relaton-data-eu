title:
- language: en
  script: Latn
  content: Regulation (EEC) No 412/69 of the Commission of 4 March 1969 amending Regulations
    (EEC) Nos 1096/68, 1098/68 and 1100/68 to take account of special circumstances
    which may arise when certain milk products are exported
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 412/69 de la Commission, du 4 mars 1969, modifiant
    les règlements (CEE) n°s 1096/68, 1098/68 et 1100/68 afin de tenir compte de
    certains cas particuliers pouvant se présenter lors de l' exportation de certains
    produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 412/69 der Kommission vom 4. März 1969 zur Änderung
    der Verordnungen (EWG) Nrn. 1096/68, 1098/68 und 1100/68, um bestimmten Sonderfällen
    gerecht zu werden, die bei der Ausfuhr bestimmter Milcherzeugnisse eintreten können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 412/69 af 4. marts 1969 om ændring
    af forordningerne (EØF) nr. 1096/68, 1098/68 og 1100/68 med henblik på hensyntagen
    til særlige tilfælde, som kan indtræde ved udførsel af visse mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 412/69 της Επιτροπής
    της 4ης Μαρτίου 1969 περί τροποποιήσεως των κανονισμών
    (ΕΟΚ) αριθ. 1096/68, (ΕΟΚ) αριθ. 1098/68 και (ΕΟΚ) αριθ.
    1100/68 προκειμένου να ληφθούν υπόψη ορισμένες
