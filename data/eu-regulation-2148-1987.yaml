    42.1271) mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3925/86 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2148/87 af 20. juli 1987 om genindførelse
