  content: Commission Regulation (EEC) No 2148/87 of 20 July 1987 re-establishing
    the levying of customs duties on yarn of regenerated textile fibres, products
    of category 127A (code 42.1271), originating in India to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2148/87 de la Commission du 20 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles artificielles, de la catégorie 127 A (code 42.1271), originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2148/87 der Kommission vom 20. Juli 1987 zur Wiedereinführung
