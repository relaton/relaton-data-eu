id: EURegulation5661975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 566/75 of the Commission of 5 March 1975 amending Regulation
    (EEC) No 1143/74 as regards the amount of subsidies for wine products similar
    to the wine product exported under the label of 'Cyprus Sherry' produced in the
    Community as originally constituted and consigned to Ireland or to the United
    Kingdom during the period 1 January to 31 December 1975
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 566/75 de la Commission, du 5 mars 1975, modifiant
    le règlement (CEE) n° 1143/74 en ce qui concerne le montant des aides pour des
    produits vinicoles similaires au produit vinicole exporté sous la mention "cyprus
    sherry" produits dans la Communauté dans sa composition originaire et expédiés
    au cours de la période allant du 1er janvier au 31 décembre 1975 vers l'Irlande
    et le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 566/75 der Kommission vom 5. März 1975 zur Änderung
    der Verordnung (EWG) Nr. 1143/74 bezüglich der Höhe der Beihilfen für Weinbauerzeugnisse,
    die dem unter der Bezeichnung "Cyprus sherry" ausgeführten Weinbauerzeugnis gleichartig
    sind, in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung erzeugt und
    in der Zeit vom 1. Januar bis 31. Dezember 1975 nach Irland und dem Vereinigten
    Königreich ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 566/75 af 5. marts 1975 ændring af
    forordning (EØF) nr. 1143/74 for så vidt angår størrelsen af støtte til vinprodukter,
    som svarer til vinprodukter, der udføres under betegnelsen »Cyprus sherry«,
    og som er fremstillet inden for Fællesskabet i dets oprindelige udstrækning
    og afsendt til Irland og Det forenede Kongerige i perioden fra den 1. januar til
    den 31. december 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 566/75 della Commissione, del 5 marzo 1975, che modifica
    il regolamento (CEE) n. 1143/74 per quanto riguarda l'importo degli aiuti per
    i prodotti vinicoli simili al prodotto vinicolo esportato con la menzione «Cyprus
    Sherry», prodotti nella Comunità nella sua composizione originaria e spediti
    verso l'Irlanda e il Regno Unito nel periodo dal 1 gennaio al 31 dicembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 566/75 van de Commissie van 5 maart 1975 houdende
    wijziging van Verordening (EEG) nr. 1143/74 met betrekking tot het bedrag van
    de steun voor in de Gemeenschap in haar oorspronkelijke samenstelling geproduceerde
    en in de periode van 1 januari tot en met 31 december 1975 naar Ierland en het
    Verenigd Koninkrijk verzonden wijnbouwprodukten van dezelfde aard als het wijnbouwprodukt
    dat onder de naam "Cyprus sherry" wordt uitgevoerd
  type: main
