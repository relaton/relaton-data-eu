title:
- language: en
  script: Latn
  content: '93/415/EEC: Commission Decision of 15 June 1993 authorizing Belgium, Denmark,
    the Federal Republic of Germany, Ireland and the United Kingdom, to permit temporarily
    the marketing of seed of field bean not satisfying the requirements of Council
    Directive 66/401/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/415/CEE: Décision de la Commission du 15 juin 1993 autorisant la Belgique,
    le Danemark, la République fédérale d''Allemagne, l''Irlande et le Royaume-Uni
    à permettre temporairement la commercialisation de semences de féveroles ne
    satisfaisant pas aux conditions de la directive 66/401/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '93/415/EWG: ENTSCHEIDUNG DER KOMMISSION vom 15. Juni 1993 zur Ermächtigung
    Belgiens, Dänemarks, Deutschlands, Irlands und des Vereinigten Königreichs,
    vorübergehend Saatgut von Ackerbohnen zum Verkehr zuzulassen, das den Anforderungen
    der Richtlinie 66/401/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '93/415/EØF: KOMMISSIONENS BESLUTNING af 15. juni 1993 om bemyndigelse
    af Belgien, Danmark, Tyskland, Irland og Det Forenede Kongerige til midlertidigt
    at tillade handel med frø af hestebønner, der ikke opfylder kravene i Rådets
    direktiv 66/401/EØF'
  type: main
- language: el
  script: Grek
  content: '93/415/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 15ης
    Ιουνίου 1993 με την οποία παρέχεται η δυνατότητα
    στο Βέλγιο, τη Δανία, την Ομοσπονδιακή Δημοκρατία
    της Γερμανίας, την Ιρλανδία και το Ηνωμένο
    Βασίλειο, να επιτρέπουν προσωρινά την εμπορία
    σπόρων προς σπορά φουλίων οι οποίοι δεν ανταποκρίνονται
    στις απαιτήσεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '93/415/CEE: DECISIONE DELLA COMMISSIONE del 15 giugno 1993 che autorizza
