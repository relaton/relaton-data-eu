    temporaneamente la commercializzazione di sementi di favino non conformi ai requisiti
    della direttiva 66/401/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '93/415/EEG: BESCHIKKING VAN DE COMMISSIE van 15 juni 1993 houdende machtiging
