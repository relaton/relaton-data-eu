title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 53/82 of 11 January 1982 fixing the prices
    to be used for calculating the value of agricultural products in intervention
    storage on 31 December 1981 to be carried forward to the 1982 financial year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 53/82 de la Commission, du 11 janvier 1982, fixant
    les prix à retenir pour le calcul de la valeur des produits agricoles, en stock
    d' intervention au 31 décembre 1981, à reporter à l' exercice 1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 53/82 der Kommission vom 11. Januar 1982 zur Festsetzung
    der Preise, die für die Berechnung des Wertes der am 31. Dezember 1981 bei der
    Intervention eingelagerten und auf das Haushaltsjahr 1982 zu übertragenden Agrarerzeugnisse
    zu berücksichtigen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 53/82 af 11. januar 1982 om fastsættelse
    af de priser, der skal anvendes ved beregning af værdien af landbrugsprodukter,
    som interventionsorganerne ligger inde med pr. 31. december 1981, og som skal
    overføres til regnskabsåret 1982
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 53/82 τής Επιτροπής τής
    11ης Ιανουαρίου 1982 περί καθορισμού τών τιμών
    πού πρέπει νά ληφθούν υπόψη γιά τόν υπολογισμό
    τής αξίας τών υφισταμένων αποθεμάτων παρεμβάσεως
    γεωργικών προϊόντων τήν 31η Δεκεμβρίου 1981 πού
    πρέπει νά μεταφερθούν στή χρήση 1982
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 53/82 della Commissione, dell' 11 gennaio 1982, che
    fissa i prezzi da prendere in considerazione per calcolare il valore dei prodotti
    agricoli giacenti all' intervento al 31 dicembre 1981 da riportare all' esercizio
    1982
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 53/82 van de Commissie van 11 januari 1982 tot vaststelling
    van de prijzen die in aanmerking moeten worden genomen voor de berekening van
    de waarde van de landbouwprodukten op 31 december 1981 in voorraad bij de interventiebureaus,
    die moeten worden overgeboekt naar het begrotingsjaar 1982
  type: main
