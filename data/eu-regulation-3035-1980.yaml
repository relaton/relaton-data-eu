title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3035/80 of 11 November 1980 laying down general
    rules for granting export refunds on certain agricultural products exported in
    the form of goods not covered by Annex II to the Treaty, and the criteria for
    fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3035/80 du Conseil, du 11 novembre 1980, établissant,
    pour certains produits agricoles exportés sous forme de marchandises ne relevant
    pas de l' annexe II du traité, les règles générales relatives à l' octroi
    des restitutions à l' exportation et les critères de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3035/80 des Rates vom 11. November 1980 zur Festlegung
    der allgemeinen Regeln für die Gewährung von Ausfuhrerstattungen und der Kriterien
    zur Festsetzung des Erstattungsbetrags für bestimmte landwirtschaftliche Erzeugnisse,
    die in Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt
    werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3035/80 af 11. november 1980 om fastsættelse
    af almindelige regler for ydelse af eksportrestitutioner og om fastlæggelse af
    kriterierne for fastsættelse af restitutionsbeløbet for visse landbrugsprodukter,
    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3035/80 τού Συμβουλίου
    τής 11ης Νοεμβρίου 1980 περί καθορισμού τών γενικών
    κανόνων πού αφορούν τή χορήγηση επιστροφών
    κατά τήν εξαγωγή καί τών κριτηρίων καθορισμού
    τού ύψους αυτών, γιά ορισμένα γεωργικά προϊόντα
    εξαγόμενα υπό μορφή εμπορευμάτων μή υπαγομένων
    στό παράρτημα ΙΙ τής συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3035/80 del Consiglio, dell' 11 novembre 1980, che
    stabilisce, per taluni prodotti agricoli esportati sotto forma di merci non comprese
    nell' allegato II del trattato, le regole generali relative alla concessione delle
    restituzioni all' esportazione e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3035/80 van de Raad van 11 november 1980 tot vaststelling
    van de algemene regels aangaande de toekenning van restituties bij uitvoer en
    de criteria voor de vaststelling van het restitutiebedrag betreffende bepaalde
    landbouwprodukten, uitgevoerd in de vorm van goederen die niet onder bijlage II
    van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3035/80 do Conselho, de 11 de Novembro de 1980,
    que estabelece, para certos produtos agrícolas exportados sob a forma de mercadorias
    não abrangidas pelo Anexo II do Tratado, as regras gerais relativas à concessão
    das restituições à exportação e os critérios de fixação do seu montante
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3035/80 del Consejo, de 11 de noviembre de 1980, por
    el que se establecen, para determinados productos agrícolas en forma de mercancías
    no incluidas en el Anexo II del Tratado, las normas generales relativas a la concesión
    de las restituciones a la exportación y los criterios para la fijación de su
    importe
  type: main
