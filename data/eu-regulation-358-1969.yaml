id: EURegulation3581969
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 358/69 of the Commission of 26 February 1969 laying
    down detailed rules for the publication of transport rates and conditions which
    depart from published tariffs, in implementation of Article 9 of Council Regulation
    (EEC) No 1174/68 of 30 July 1968 on the introduction of a system of bracket tariffs
    for the carriage of goods by road between Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 358/69 de la Commission, du 26 février 1969, fixant
    les conditions et modalités de la publicité des prix et conditions de transport,
    qui s' écartent des tarifs publiés, en application de l' article 9 du règlement
    (CEE) n° 1174/68 du Conseil, du 30 juillet 1968 relatif à l' instauration d'
    un système de tarifs à fourchettes applicables aux transports de marchandises
    par route entre les États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 358/69 der Kommission vom 26. Februar 1969 zur Festsetzung
    der Durchführungsbestimmungen für die Veröffentlichung der Beförderungsentgelte
    und -bedingungen, die von den veröffentlichten Tarifen abweichen, gemäß Artikel
    9 der Verordnung (EWG) Nr. 1174/68 des Rates vom 30. Juli 1968 über die Einführung
    eines Margentarifsystems im Güterkraftverkehr zwischen den Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 358/69 af 26. februar 1969 om fastsættelse
    af gennemførelsesbestemmelser for offentliggørelse af transportpriser og -vilkår,
    som afviger fra de offentliggjorte tariffer, i henhold til artikel 9 i Rådets
    forordning (EØF) nr. 1174/68 af 30. juli 1968 om indførelse af et margintarifsystem
    for varetransport ad landevej mellem medlemsstaterne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 358/69 della Commissione, del 26 febbraio 1969, che
    fissa le condizioni e le modalità della divulgazione dei prezzi e delle condizioni
    di trasporto che si scostano dalle tariffe pubblicate in applicazione dell' articolo
    9 del regolamento (CEE) n. 1174/68 del Consiglio, del 30 luglio 1968, relativo
    all' istituzione di un sistema di tariffe a forcella applicabili ai trasporti
    di merci su strada fra gli Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 358/69 van de Commissie van 26 februari 1969 houdende
    uitvoeringsbepalingen inzake de publikatie van de vervoerprijzen en -voorwaarden
    die afwijken van de gepubliceerde tarieven, vastgesteld ingevolge artikel 9 van
    Verordening (EEG) nr. 1174/68 van de Raad van 30 juli 1968 betreffende de invoering
    van een stelsel van margetarieven voor het goederenvervoer over de weg tussen
    Lid-Staten
  type: main
