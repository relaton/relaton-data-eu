    της 28ης Σεπτεμβρίου 1992 περί τροποποιήσεως
    του οριστικού δασμού αντιντάμπινγκ κατά τις
    εισαγωγές ενσφαίρων τριβέων (ρουλεμάν με σφαιρίδια),
    με μέγιστη εξωτερική διάμετρο υπερβαίνουσα
    τα 30 χιλιοστά, καταγωγής Ιαπωνίας, που έχει
    επιβληθεί με τον κανονισμό (ΕΟΚ) αριθ. 1739/85
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2849/92, annettu 28 päivänä syyskuuta 1992,
