title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2849/92 of 28 September 1992 modifying the
    definitive anti-dumping duty on imports of ball bearings with a greatest external
    diameter exceeding 30 mm originating in Japan imposed by Regulation (EEC) No 1739/85
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2849/92 du Conseil, du 28 septembre 1992, modifiant
    le droit antidumping définitif institué par le règlement (CEE) n° 1739/85
    sur les importations de roulements à billes originaires du Japon dont le plus
    grand diamètre extérieur excède 30 millimètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2849/92 des Rates vom 28. September 1992 zur Änderung
    des durch die Verordnung (EWG) Nr. 1739/85 eingeführten endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter Kugellager mit einem größten äußeren Durchmesser
    von mehr als 30 mm mit Ursprung in Japan
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2849/92 af 28. september 1992 om ændring
    af den ved forordning (EØF) nr. 1739/85 indførte endelige antidumpingtold på
    importen af kuglelejer med største udvendige diameter på over 30 mm med oprindelse
    i Japan
  type: main
- language: el
  script: Grek
