    op de invoer in de Europese Gemeenschap van kogellagers met een grootste uitwendige
    diameter van meer dan 30 mm, van oorsprong uit Japan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2849/92 do Conselho, de 28 de Setembro de 1992, que
