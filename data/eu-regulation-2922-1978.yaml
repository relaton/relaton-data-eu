title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2922/78 of 12 December 1978 opening, allocating
    and providing for the administration of a Community tariff quota for yarn, entirely
    of silk, other than yarn of noil or other waste silk, not put up for retail sale,
    falling within heading No ex 50.04 of the Common Customs Tariff (1979)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2922/78 du Conseil, du 12 décembre 1978, portant
    ouverture, répartition et mode de gestion d' un contingent tarifaire communautaire
    pour les fils de soie, non conditionnés pour la vente au détail, de la position
    ex 50.04 du tarif douanier commun (1979)
  type: main
- language: de
  script: Latn
