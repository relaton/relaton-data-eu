    Seide, nicht in Aufmachungen für den Einzelverkauf, der Tarifnummer ex 50.04
    des Gemeinsamen Zolltarifs (1979)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2922/78 af 12. december 1978 om åbning,
