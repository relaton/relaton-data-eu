    Geräte der Tarifnummer 92.11 oder für ähnliche Aufnahmeverfahren, der Tarifnummer
    92.12 des Gemeinsamen Zolltarifs mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1186/86 af 23. april 1986 om genindførelse
    af opkrævning af told for grammofonplader og andre lydoptagelser eller lignende
    optagelser, henhørende under pos. 92.11 eller 92.12 i den fælles toldtarif og
    med oprindelse i Hongkong, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
