title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1186/86 of 23 April 1986 re-establishing
    the levying of customs duties on gramophone records and other sound or similar
    recordings, falling within heading No 92.12, originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3599/85
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1186/86 de la Commission du 23 avril 1986 portant
    rétablissement de la perception des droits de douane applicables aux supports
    de son pour les appareils du n° 92.11 ou pour enregistrements analogues de la
    position 92.12 du tarif douanier commun, originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1186/86 der Kommission vom 23. April 1986 zur Wiedereinführung
