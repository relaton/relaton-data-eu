  script: Latn
  content: Regolamento (CEE) n. 1186/86 della Commissione del 23 aprile 1986 che ripristina
    la riscossione dei dazi doganali applicabili ai supporti di suono per apparecchi
    della voce 92.11 o per registrazioni analoghe della voce 92.12 della tariffa doganale
    comune originari di Hong Kong beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1186/86 van de Commissie van 23 april 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op toestellen,
    geprepareerd voor het opnemen van geluid of waarop geluid is opgenomen, bedoeld
    bij post 92.11 of voor dergelijke doeleinden, van tariefpost 92.12 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong Kong, waarvoor de in Verordening (EEG) nr.
    3599/85 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1186/86 da Comissão de 23 de Abril de 1986 que
