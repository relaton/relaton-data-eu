title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2877/2000 of 28 December 2000 amending Regulation
    (EEC) No 1481/86 on the determination of prices of fresh or chilled lamb carcases
    on representative Community markets and the survey of prices of certain other
    qualities of sheep carcases in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2877/2000 de la Commission du 28 décembre 2000 modifiant
    le règlement (CEE) nº 1481/86 relatif à la détermination des prix des carcasses
    d'agneaux fraîches ou réfrigérées constatés sur les marchés représentatifs
    de la Communauté et au relevé des prix de certaines autres qualités de carcasses
    d'ovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2877/2000 der Kommission vom 28. Dezember 2000 zur
    Änderung der Verordnung (EWG) Nr. 1481/86 zur Bestimmung der auf den repräsentativen
    Märkten der Gemeinschaft festgestellten Preise für frische oder gekühlte Tierkörper
    von Lämmern und zur Ermittlung der Preise einiger anderer Qualitäten von Tierkörpern
    von Schafen in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2877/2000 af 28. december 2000 om ændring
    af forordning (EØF) nr. 1481/86 om bestemmelse af priserne for ferske eller kølede
    lammekroppe, der konstateres på Fællesskabets repræsentative markeder, og om
    registrering af priserne for visse andre fårekroppekvaliteter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2877/2000 της Επιτροπής,
    της 28ης Δεκεμβρίου 2000, για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1481/86 περί καθορισμού
    των τιμών των νωπών ή διατηρημένων με απλή
    ψύξη ολόκληρων σφαγίων αμνών, που διαπιστώνονται
    στις αντιπροσωπευτικές αγορές της Κοινότητας
    και περί του πίνακα των τιμών ορισμένων άλλων
    ποιοτήτων ολοκλήρων σφαγείων προβάτων εντός
    της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2877/2000, annettu 28 päivänä joulukuuta 2000,
    tuoreiden tai jäähdytettyjen karitsanruhojen yhteisön edustavilla markkinoilla
    todettujen hintojen määrittämisestä ja tiettyjen muiden yhteisön lampaanruhojen
    laatujen hintojen yhteenvedosta annetun asetuksen (ETY) N:o 1481/86 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2877/2000 della Commissione, del 28 dicembre 2000,
    che modifica il regolamento (CEE) n. 1481/86 relativo alla determinazione dei
    prezzi delle carcasse di agnelli, fresche o refrigerate, constatati sui mercati
    rappresentativi della Comunità e al rilevamento dei prezzi di talune altre qualità
    di carcasse ovine nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2877/2000 van de Commissie van 28 december 2000 tot
    wijziging van Verordening (EEG) nr. 1481/86 betreffende de vaststelling van de
    op de representatieve markten van de Gemeenschap geconstateerde prijzen voor geslachte
    lammeren, vers of gekoeld, en betreffende de constatering van de prijzen voor
    sommige andere kwaliteiten geslachte schapen in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2877/2000 da Comissão, de 28 de Dezembro de 2000,
    que altera o Regulamento (CEE) n.o 1481/86 relativo à determinação dos preços
    de carcaças de borrego frescas ou refrigeradas em mercados representativos da
    Comunidade e ao registo de preços de outras qualidades determinadas de carcaças
    de ovinos na Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2877/2000 de la Comisión, de 28 de diciembre de 2000,
    que modifica el Reglamento (CEE) nº 1481/86 relativo a la determinación de los
    precios de las canales de cordero frescas o refrigeradas, comprobados en los mercados
    representativos de la Comunidad y a la relación de los precios de algunas otras
    calidades de canales de ovinos en la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2877/2000 av den 28 december 2000 om
