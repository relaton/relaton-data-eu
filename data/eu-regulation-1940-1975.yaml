title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1940/75 of the Commission of 28 July 1975 re-establishing
    the levying of the customs duties on wood (including blocks, strips and friezes
    for parquet or wood block flooring, not assembled), planed, tongued, grooved,
    rebated, chamfered, V-jointed, centre V-jointed, beaded, centre-beaded or the
    like, but not further manufactured, falling within heading No 44.13, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1940/75 de la Commission, du 28 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux bois (y
    compris les lames ou frises pour parquets, non assemblées) rabotés, rainés,
    bouvetés, languetés, feuillures, chanfreines ou similaires, de la position tarifaire
    44.13, originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1940/75 der Kommission vom 28. Juli 1975 zur Wiedereinführung
    des Zollsatzes für Holz (einschließlich Stäbe oder Friese für Parkett, nicht
    zusammengesetzt), gehobelt, genutet, gefedert, gekehlt, gefalzt, abgeschrägt
    oder in ähnlicher Weise bearbeitet, der Tarifnummer 44.13, mit Ursprung in Brasilien,
    dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1940/75 af 28. juli 1975 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, affaset eller
    på lignende måde bearbejdet (herunder ikke-sammensatte parketstave) under position
    44.13, som har oprindelse i Brasilien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1940/75 della Commissione, del 28 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, con incastri semplici, con limbelli, con smussature
    o similmente lavorato, comprese le liste e le tavolette (parchetti) per pavimenti,
    non riunite, della voce doganale n. 44.13, originario del Brasile, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1940/75 van de Commissie van 28 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op hout (niet
    ingezette plankjes voor parketvloeren daaronder begrepen), geschaafd, geploegd
    of van sponningen voorzien, afgeschuind of op dergelijke wijze bewerkt, van post
    44.13 van oorsprong uit Brazilië ten behoeve waarvan bij Verordening (EEG) nr.
    3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
