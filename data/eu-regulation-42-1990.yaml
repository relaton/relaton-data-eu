title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 42/90 of 9 January 1990 suspending the preferential
    customs duties and re-introducing the Common Customs Tariff duty on imports of
    small-flowered roses originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 42/90 de la Commission, du 9 janvier 1990, suspendant
