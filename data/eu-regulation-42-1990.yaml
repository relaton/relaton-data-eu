    δασμού και επαναφορά του δασμού του κοινού
    δασμολογίου κατά την εισαγωγή τριαντάφυλλων
    με μικρό άνθος καταγωγής Μαρόκου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 42/90 della Commissione, del 9 gennaio 1990, che sospende
