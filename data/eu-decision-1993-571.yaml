  script: Latn
  content: '93/571/EEC: Commission Decision of 11 October 1993 amending Decision 92/81/EEC
    on the establishment of the Community support framework for Community structural
    assistance on the improvement of the conditions under which agricultural products
    are processed and marketed in the Netherlands (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/571/CEE: Décision de la Commission du 11 octobre 1993 modifiant la
    décision 92/81/CEE concernant l''établissement du cadre communautaire d''appui
    pour les interventions structurelles communautaires relatives à l''amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    aux Pays-Bas (Le texte en langue néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/571/EWG: ENTSCHEIDUNG DER KOMMISSION vom 11. Oktober 1993 zur Änderung
