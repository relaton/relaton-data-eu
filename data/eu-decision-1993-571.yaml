    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/571/CEE: DECISIONE DELLA COMMISSIONE dell'' 11 ottobre 1993 che modifica
    la decisione 92/81/CEE riguardante la definizione del quadro comunitario di sostegno
    per gli interventi strutturali della Comunità inerenti al miglioramento delle
    condizioni di trasformazione e di commercializzazione dei prodotti agricoli nei
    Paesi Bassi (Il testo in lingua olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/571/EEG: BESCHIKKING VAN DE COMMISSIE van 11 oktober 1993 inzake de
    wijziging van Beschikking 92/81/EEG tot vaststelling van het communautair bestek
    voor structurele bijstandsverlening van de Gemeenschap voor de verwerking en de
    afzet van landbouwprodukten in Nederland (Slechts de tekst in de Nederlandse taal
    is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/571/CEE: DECISÃO DA COMISSÃO de 11 de Outubro de 1993 que altera
