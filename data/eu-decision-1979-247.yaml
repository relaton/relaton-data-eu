title:
- language: en
  script: Latn
  content: '79/247/EEC: Commission Decision of 19 February 1979 authorizing Ireland
    to apply protective measures to trade, within the Community, in twine, cordage,
    ropes and cables, plaited or not, falling within heading No 59.04 of the Common
    Customs Tariff, originating in Portugal and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/247/CEE: Décision de la Commission, du 19 février 1979, autorisant
    l''Irlande à appliquer des mesures de protection concernant les échanges intracommunautaires
    de ficelles, cordes et cordages, tressés ou non, de la position 59.04 du tarif
    douanier commun, originaires du Portugal et mis en libre pratique dans les autres
    Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/247/EWG: Entscheidung der Kommission vom 19. Februar 1979 zur Ermächtigung
    Irlands, Schutzmaßnahmen zu ergreifen im innergemeinschaftlichen Handel mit Bindfäden,
    Seilen und Tauen, auch geflochten, der Tarifnummer 59.04 des Gemeinsamen Zolltarifs
    mit Ursprung in Portugal, die in anderen Mitgliedstaaten zum freien Verkehr abgefertigt
    wurden (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/247/EØF: Kommissionens beslutning af 19. februar 1979 om bemyndigelse
    til Irland til at anvende beskyttelsesforanstaltninger vedrørende handelen inden
    for Fællesskabet med sejlgarn, reb og tovværk, også flettet, som henhører
    under pos. 59.04 i den fælles toldtarif, har oprindelse i Portugal og frit kan
    omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/247/CEE: Decisione della Commissione, del 19 febbraio 1979, che autorizza
    l''Irlanda ad applicare delle misure di protezione negli scambi intracomunitari
    di spago, corde e funi anche intrecciate della voce 59.04 della tariffa doganale
    comune, originari del Portogallo e messi in libera pratica negli altri Stati membri
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/247/EEG: Beschikking van de Commissie van 19 februari 1979 waarbij
    Ierland wordt gemachtigd beschermende maatregelen te nemen voor wat betreft het
    intracommunautaire verkeer van bindgaren, touw en kabel, al dan niet gevlochten,
    van post 59.04 van het gemeenschappelijk douanetarief, van oorsprong uit Portugal
    en in de overige Lid-Staten in het vrije verkeer gebracht (Slechts de tekst in
    de Engelse taal is authentiek)'
  type: main
