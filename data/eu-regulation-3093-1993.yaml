- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3093/93 of 9 November 1993 re-establishing
    the levying of customs duties on products of category 65 (order No 40.0650), originating
    in Argentina, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3093/93 de la Commission du 9 novembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 65 (numéro d'ordre 40.0650) originaires d'Argentine, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3093/93 DER KOMMISSION vom 9. November 1993 zur Wiedereinführung
