title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3272/83 of 18 November 1983 re-establishing
    the levying of customs duties on picks, hoes and rakes, falling within heading
    No ex 82.01 and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3272/83 de la Commission du 18 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux pioches,
    pics, houes, binettes, râteaux et racloirs, de la position ex 82.01 du tarif
    douanier commun, originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3272/83 der Kommission vom 18. November 1983 zur Wiedereinführung
    der Erhebung der Zölle für Hacken aller Art und Rechen der Tarifnummer ex 82.01,
    mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3272/83 af 18. november 1983 om genindførelse
    af opkrævning af told for river, hyppe-, skuffe- og lugejern henhørende under
    pos. ex 82.01 og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3272/83 της Επιτροπής
    της 18ης Νοεμβρίου 1983 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για σκαπάνες, πικούνια,
    αξίνες, τσάπες, δίκρανα και τσουγκράνες της
    κλάσεως ex 82.01 του Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3272/83 della Commissione del 18 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai picconi, piccozze,
    zappe, zappette, rastrelli e raschiatoi, della voce ex 82.01 della tariffa doganale
    comune, originari della Cina beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3272/83 van de Commissie van 18 november 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op houwelen, hakken,
    harken en schoffels van tariefpost ex 82.01, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
