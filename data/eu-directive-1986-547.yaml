  content: Third Commission Directive 86/547/EEC of 29 October 1986 amending Annex
    III B to Council Directive 77/93/EEC on protective measures against the introduction
    into the Member States of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Troisième directive 86/547/CEE de la Commission du 29 octobre 1986 modifiant
    l'annexe III lettre B de la directive 77/93/CEE du Conseil concernant les mesures
    de protection contre l'introduction dans les États membres d'organismes nuisibles
    aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Dritte Richtlinie 86/547/EWG der Kommission vom 29. Oktober 1986 zur Änderung
    des Anhangs III B der Richtlinie 77/93/EWG des Rates über Maßnahmen zum Schutz
    gegen das Verbringen von Schadorganismen der Pflanzen oder Pflanzenerzeugnisse
    in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens Tredje direktiv 86/547/EØF af 29. oktober 1986 om ændring
    af bilag III B til Rådets direktiv 77/93/EØF om foranstaltninger mod indslæbning
    i medlemsstaterne af skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Τρίτη οδηγία 86/547/ΕΟΚ της Επιτροπής της
