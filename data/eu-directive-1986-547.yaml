    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου περί των
    μέτρων προστασίας κατά της εισαγωγής στα κράτη
    μέλη οργανισμών επιβλαβών για τα φυτά ή τα
    φυτικά προϊόντα
  type: main
- language: it
  script: Latn
  content: Terza direttiva 86/547/CEE della Commissione del 29 ottobre 1986 che modifica
    l'allegato III parte B della direttiva 77/93/CEE del Consiglio concernente le
    misure di protezione contro l'introduzione negli Stati Membri di organismi nocivi
    ai vegetali o ai prodotti vegetali
  type: main
- language: nl
  script: Latn
  content: Derde Richtlijn 86/547/EEG van de Commissie van 29 oktober 1986 tot wijziging
    van bijlage III, deel B, bij Richtlijn 77/93/EEG van de Raad betreffende de beschermende
    maatregelen tegen het binnenbrengen op het grondgebied van de Lid-Staten van voor
    planten of voor plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Terceira Directiva 86/547/CEE da Comissão de 29 de Outubro de 1986 que
    altera a Parte B do Anexo III da Directiva 77/93/CEE do Conselho relativa às
    medidas de protecção contra a introdução nos Estados-Membros de organismos
    prejudiciais às plantas e produtos vegetais
  type: main
- language: es
  script: Latn
  content: Tercera Directiva 86/547/CEE de la Comisión de 29 de octubre de 1986 por
    la que se modifica el Anexo III B de la Directiva 77/93/CEE del Consejo relativa
    a las medidas de protección contra la introducción en los Estados Miembros de
    organismos nocivos para los vegetales o productos vegetales
  type: main
