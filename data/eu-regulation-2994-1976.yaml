    für bestimmtes Sperrholz aus Nadelholz der Tarifnummer ex 44.15 des Gemeinsamen
    Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2994/76 af 9. december 1976 om forhøjelse
