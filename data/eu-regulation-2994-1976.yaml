  content: Council Regulation (EEC) No 2994/76 of 9 December 1976 increasing the Community
    tariff quota opened for 1976 by Regulation (EEC) No 2876/75 for certain plywoods
    of coniferous species falling within heading No ex 44.15 of the Common Customs
    Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2994/76 du Conseil, du 9 décembre 1976, portant augmentation
    du volume du contingent tarifaire communautaire ouvert, pour l'année 1976, par
    le règlement (CEE) n° 2876/75 pour certains bois contre- plaqués de conifères
    de la position EX 44.15 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2994/76 des Rates vom 9. Dezember 1976 zur Aufstockung
