  content: 'Commission Regulation (EU) 2020/1565 of 27 October 2020 amending Annexes
    II, III and IV to Regulation (EC) No 396/2005 of the European Parliament and of
    the Council as regards maximum residue levels for 1,4‐diaminobutane, 1-methylcyclopropene,
    ammonium acetate, bifenazate, chlorantraniliprole, chlormequat, cyprodinil, limestone,
