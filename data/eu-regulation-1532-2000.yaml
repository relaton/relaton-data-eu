    le règlement (CE) nº 805/1999 fixant certaines mesures d'application du règlement
    (CE) nº 718/1999 du Conseil relatif à une politique de capacité des flottes
    communautaires dans la navigation intérieure en vue de promouvoir le transport
    par voie navigable
  type: main
- language: de
  script: Latn
