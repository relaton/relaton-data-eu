    rozporządzenia Rady (WE) nr 718/1999 w sprawie polityki w zakresie zdolności
    przewozowej floty wspólnotowej w celu wspierania żeglugi śródlądowej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1532/2000 da Comissão, de 13 de Julho de 2000, que
