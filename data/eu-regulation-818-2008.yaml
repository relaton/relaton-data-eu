  content: Council Regulation (EC) No 818/2008 of 13 August 2008 amending Regulation
    (EC) No 2074/2004 imposing a definitive anti-dumping duty on imports of certain
    ring binder mechanisms originating in the People’s Republic of China and terminating
    the investigation concerning the possible circumvention of anti-dumping measures
    imposed by that Regulation by imports of certain ring binder mechanisms consigned
    from Thailand, whether declared as originating in Thailand or not
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 818/2008 du Conseil du 13 août 2008 modifiant le règlement
