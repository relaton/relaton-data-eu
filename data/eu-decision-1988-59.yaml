title:
- language: en
  script: Latn
  content: '88/59/EEC: Commission Decision of 22 October 1987 approving the intervention
    programme for Italy implementing the Community programme for the development of
    certain less-favoured regions of the Community by improving access to advanced
    telecommunications services (STAR programme) (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/59/CEE: Décision de la Commission du 22 octobre 1987 portant application
    en Italie du programme communautaire relatif au développement de certaines régions
    défavorisées de la Communauté par un meilleur accès aux services avancés
    de télécommunications (programme Star) (Le texte en langue italienne est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/59/EWG: Entscheidung der Kommission vom 22. Oktober 1987 zur Genehmigung
    des Interventionsprogramms für Italien zur Durchführung des Gemeinschaftsprogramms
    zur Entwicklung bestimmter benachteiligter Regionen der Gemeinschaft durch einen
    besseren Zugang zu den fortgeschrittenen Telekommunikationsdiensten (STAR- Programm)
    (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/59/EØF: Kommissionens beslutning af 22. oktober 1987 om godkendelse
    af interventionsprogrammet for Italien til gennemførelse af fællesskabsprogrammet
    til udvikling af visse ugunstigt stillede regioner i Fællesskabet gennem bedre
    adgang til avancerede telekommunikationstjenester (STAR-programmet) (Kun den italienske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/59/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Οκτωβρίου
    1987 για την εφαρμογή στην Ιταλία του κοινοτικού
    προγράμματος σχετικά με την ανάπτυξη ορισμένων
    μειονεκτικών περιοχών της Κοινότητας μέσω
    καλύτερης πρόσβασης στις προηγμένες υπηρεσίες
    τηλεπικοινωνιών (πρόγραμμα STAR) (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/59/CEE: Decisione della Commissione del 22 ottobre 1987 relativa all''approvazione
    del programma d''intervento che attua in Italia un programma comunitario relativo
    allo sviluppo di talune regioni svantaggiate della Comunità mediante un migliore
    accesso ai servizi di telecomunicazione progrediti (programma Star) (Il testo
    in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/59/EEG: Beschikking van de Commissie van 22 oktober 1987 ter goedkeuring
    van het steunprogramma voor Italië tot uitvoering van het communautaire programma
    voor de ontwikkeling van bepaalde, minder ontwikkelde regio''s van de Gemeenschap
    door een betere toegang tot geavanceerde telecommunicatiediensten (STAR-programma)
    (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/59/CEE: Decisão da Comissão de 22 de Outubro de 1987 pela qual se
