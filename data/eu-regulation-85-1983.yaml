    κανονισμών (ΕΟΚ) αριθ. 368/77 και (ΕΟΚ) αριθ. 443/77
    όσον αφορά τον προορισμό του αποκορυφωμένου
    γάλακτος σε σκόνη που χρησιμοποιείται στη
    διατροφή ζώων εκτός των νεαρών μόσχων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 85/83, annettu 14 päivänä tammikuuta 1983,
    asetusten (ETY) N:o 368/77 ja (ETY) N:o 443/77 muuttamisesta muiden eläinten
    kuin vasikoiden rehuksi tarkoitetun rasvattoman maitojauheen käyttötarkoituksen
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 85/83 della Commissione del 14 gennaio 1983 che modifica
    i regolamenti (CEE) n. 368/77 e (CEE) n. 443/77, per quanto riguarda la destinazione
    del latte scremato in polvere da utilizzare per l'alimentazione degli animali
    diversi dai vitelli giovani
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 85/83 van de Commissie van 14 januari 1983 tot wijziging
    van de Verordeningen (EEG) nr. 368/77 en (EEG) nr. 443/77 ten aanzien van de bestemming
    van magere-melkpoeder voor vervoedering aan andere dieren dan jonge kalveren
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 85/83 da Comissão, de 14 de Janeiro de 1983, que
    altera os Regulamentos (CEE) nº 368/77 e (CEE) nº 443/77 no que diz respeito
    ao destino do leite em pó desnatado a utilizar na alimentação dos animais que
    não sejam os vitelos jovens
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 85/83 de la Comisión, de 14 de enero de 1983, por
