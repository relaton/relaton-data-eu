  script: Latn
  content: Commission Regulation (EEC) No 85/83 of 14 January 1983 amending Regulations
    (EEC) No 368/77 and (EEC) No 443/77 with regard to the use made of skimmed-milk
    powder intended for use in feed for animals other than young calves
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 85/83 de la Commission du 14 janvier 1983 modifiant
    les règlements (CEE) n° 368/77 et (CEE) n 443/77 en ce qui concerne la destination
    du lait écrémé en poudre à utiliser pour l'alimentation des animaux autres
    que les jeunes veaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 85/83 der Kommission vom 14. Januar 1983 zur Änderung
    der Verordnungen (EWG) Nr. 368/77 und (EWG) Nr. 443/77 hinsichtlich des Bestimmungszwecks
    von Magermilchpulver für Tiere außer jungen Kälbern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 85/83 af 14. januar 1983 om ændring
    af forordning (EØF) nr. 368/77 og (EØF) nr. 443/77 for så vidt angår bestemmelsen
    for skummetmælkspulver, der skal anvendes til foder, bortset fra foder til unge
    kalve
  type: main
- language: el
  script: Grek
