  content: Règlement n° 758/68/Euratom du Conseil, du 18 juin 1968, modifiant les
    conditions applicables en matière de rémunération et de sécurité sociale
    aux agents d'établissement du Centre Commun de Recherches Nucléaires affectés
    en République Fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom) Nr. 758/68 des Rates vom 18. Juni 1968 zur Änderung
    der Regelung der Bezüge und der sozialen Sicherheit der Atomanlagenbediensteten
    der Gemeinsamen Kernforschungsstelle, die in der Bundesrepublik Deutschland dienstlich
    verwendet werden
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom) n. 758/68 del Consiglio, del 18 giugno 1968, che
    modifica le condizioni applicabili in materia di retribuzione e di sicurezza sociale
    agli agenti degli stabilimenti del Centro comune di ricerche nucleari che prestano
    servizio nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom) nr. 758/68 van de Raad van 18 juni 1968 tot wijziging
    van de regeling inzake de bezoldiging en de sociale zekerheid van de functionarissen,
    verbonden aan een inrichting van het Gemeenschappelijk Centrum voor Onderzoek
    op het gebied van de Kernenergie, en tewerkgesteld in de Bondsrepubliek Duitsland
