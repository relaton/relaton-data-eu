---
id: EUDecision197392
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 April 1973 authorizing the Italian Republic not
    to apply Community treatment to films in rolls, sensitized, unexposed, perforated
    or not falling within heading No 37.02 of the Common Customs Tariff, originating
    in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/92/CEE de la Commission, du 18 avril 1973, autorisant la République
    italienne à exclure du traitement communautaire les pellicules sensibilisées,
    non impressionnées, perforées ou non, en rouleaux ou en bandes, de la position
    37.02 du Tarif douanier commun, originaires du Japon et mises en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. April 1973, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche lichtempfindliche Filme in Rollen oder Streifen,
    auch gelocht, nicht belichtet, der Tarifnummer 37.02 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. april 1973 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage lysfølsomme films i ruller,
    ikke eksponerede, som henhører under position 37.02 i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 aprile 1973, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le pellicole sensibilizzate,
    non impressionate, anche perforate, in rotoli o in strisce, della voce n. 37.02
    della tariffa doganale comune, originarie del Giappone e messe in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 april 1973 waarbij de Italiaanse Republiek
    wordt gemachtigd lichtgevoelige, onbelichte films, ook indien geperforeerd, op
    rollen of in stroken van post 37.02 van het gemeenschappelijk douanetarief, van
    oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
