title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 186/2005 of 3 February 2005 determining to
    what extent import right applications submitted during the month of January 2005
    for calves weighing not more than 80 kg as part of a tariff quota provided for
    in Regulation (EC) No 1201/2004 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 186/2005 de la Commission du 3 février 2005 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites au mois de janvier 2005 pour les veaux n'excédant pas 80 kilogrammes
    dans le cadre d'un contingent tarifaire prévu par le règlement (CE) n° 1201/2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 186/2005 der Kommission vom 3. Februar 2005 zur Festsetzung
    des Umfangs, in dem die im Januar 2005 eingereichten Anträge auf Einfuhrlizenzen
    für Kälber mit einem Stückgewicht bis 80 kg im Rahmen eines Zollkontingents
    gemäß der Verordnung (EG) Nr. 1201/2004 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 186/2005 ze dne 3. února 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o udělení dovozních licencí
    na měsíc leden 2005 telat o hmotnosti nejvýše 80 kg, podaným v rámci celní
    kvóty dle nařízení (ES) č. 1201/2004
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 186/2005 af 3. februar 2005 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicencer, som er
    indsendt januar 2005, for kalve på højst 80 kg i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 1201/2004
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 186/2005 της Επιτροπής,
    της 3ης Φεβρουαρίου 2005, για καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Ιανουάριο του 2005 για μόσχους
    βάρους το πολύ 80 χιλιογράμμων, στο πλαίσιο
    μιας δασμολογικής ποσόστωσης η οποία προβλέπεται
    από τον κανονισμό (ΕΚ) αριθ. 1201/2004
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 186/2005, 3. veebruar 2005, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordilitsentside taotlusi jaanuaris
    2005, mis on esitatud kuni 80 kilogrammiste vasikate kohta määrusega (EÜ) 1201/2005
    ette nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 186/2005, annettu 3 päivänä helmikuuta 2005,
    enintään 80 kg painavia vasikoita koskevien tammikuussa 2005 jätettyjen tuontitodistushakemusten
    hyväksyttävyydestä asetuksessa (EY) N:o 1201/2004 määriteltyjen tariffikiintiöiden
    rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 186/2005/EK rendelete (2005. február 3.) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni az 1201/2004/EK rendeletben szabályozott
    vámkontingens keretében, a 80 kilogrammnál nem nagyobb tömegű borjakra vonatkozóan
    2005 januárjában benyújtott importtanúsítvány iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 186/2005 della Commissione, del 3 febbraio 2005, che
    stabilisce in che misura possono essere accolte le domande di certificati di importazione
    presentate nel mese di gennaio 2005 per i vitelli di peso pari o inferiore a 80
    chilogrammi nel quadro del contingente tariffario previsto dal regolamento (CE)
    n. 1201/2004
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 186/2005 (2005. gada 3. februāris), ar ko nosaka,
    cik lielā mērā var pieņemt importa tiesību ievešanas atļauju saņemšanai,
    kuras iesniegtas 2005. gada janvārī attiecībā uz teļiem, kā svars ir līdz
    80 kg, tarifa kvotas ietvaros, kura paredzēta Regulā (EK) Nr. 1201/2004
  type: main
- language: lt
  script: Latn
  content: 2005 m. vasario 3 d. Komisijos reglamentas (EB) Nr. 186/2005, nustatantis,
    kokia dalimi galima patenkinti veršelių, kurių svoris yra ne daugiau kaip 80
    kilogramų, importo liceneijoms gauti 2005 m. sausio mėn., pateiktas remiantis
    tarifine kvota, nustatyta Reglamente (EB) Nr. 1201/2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 186/2005 van de Commissie van 3 februari 2005 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen voor
    invoercertificaten voor kalveren met een gewicht van niet meer dan 80 kg, die
    in januari 2005 zijn ingediend op grond van een bij Verordening (EG) nr. 1201/2004
    vastgesteld tariefcontingent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 186/2005 z dnia 3 lutego 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie pozwoleń na przywóz
    w miesiącu styczniu 2005 r. cielaków o wadze nieprzekraczającej 80 kg w ramach
    kontyngentu taryfowego przewidzianego w rozporządzeniu (WE) nr 1201/2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 186/2005 da Comissão, de 3 de Fevereiro de 2005,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina, de peso não superior a 80 quilogramas, apresentados
    no mês de Janeiro de 2005 ao abrigo de um contingente pautal previsto pelo Regulamento
    (CE) n.° 1201/2004
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 186/2005 z 3. februára 2005, ktorým sa určuje,
    do akej miery možno vyhovieť žiadostiam o udelenie dovozných licencií na
    mesiac január 2005 na teľatá s maximálnou hmotnosťou 80 kg v rámci colnej
    kvóty ustanovenej v nariadení (ES) č. 1201/2004
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 186/2005 z dne 3. februarja 2005 o določitvi,
    v kakšnem obsegu se lahko sprejmejo zahtevki za uvozna dovoljenja, vloženi v
    mesecu januarju 2005 za teleta s težo do 80 kg, v okviru tarifne kvote, predvidene
    z Uredbo (ES) št. 1201/2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 186/2005 de la Comisión, de 3 de febrero de 2005,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación en el mes de enero de 2005 de terneros de peso no
    superior a 80 kilogramos, presentadas dentro de un contingente arancelario establecido
    en el Reglamento (CE) n° 1201/2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 186/2005 av den 3 februari 2005 om i
    vilken utsträckning ansökningar om importlicenser inlämnade under januari 2005
    för kalvar med en vikt på högst 80 kg inom ramen för den avgiftskvot som fastställts
    i förordning (EG) nr 1201/2004 kan beviljas
  type: main
