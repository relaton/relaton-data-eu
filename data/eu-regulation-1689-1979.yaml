id: EURegulation16891979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1689/79 of 31 July 1979 re-establishing
    the levying of customs duties on chamois-dressed leather, falling within heading
    No 41.06 and originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1689/79 de la Commission, du 31 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux cuirs et
    peaux chamoisés, de la position 41.06 du tarif douanier commun, originaires de
    l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1689/79 der Kommission vom 31. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Sämischleder (Chamoisleder) der Tarifnummer 41.06, mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1689/79 af 31. juli 1979 om genindførelse
    af opkrævning af toldafgifter for semsgarvet læder (vaskeskind) under position
    41.06, som har oprindelse i Indien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1689/79 della Commissione, del 31 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili a cuoio e pelli, scamosciati,
    della voce 41.06 della tariffa doganale comune, originari dell' India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1689/79 van de Commissie van 31 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zeemleder,
    van post 41.06, van oorsprong uit India ten behoeve waarvan bij Verordening (EEG)
    nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
