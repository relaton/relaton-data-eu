title:
- language: en
  script: Latn
  content: '79/930/EEC: Commission Decision of 19 October 1979 authorizing the Federal
    Republic of Germany not to apply Community treatment to woven fabrics of regenerated
    textile fibres (discontinuous or waste), other than narrow woven fabrics, pile
    fabrics (including terry fabrics) and chenille fabrics, falling within subheading
    56.07 B of the Common Customs Tariff (NIMEXE codes 56.07-37, 42, 44, 48, 52, 53,
    54, 57, 58, 62, 63, 64, 66, 72, 73, 74, 77, 78, 82, 83, 84, 87) (category 37),
    originating in South Korea and in free circulation in the other Member States
    (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/930/CEE: Décision de la Commission, du 19 octobre 1979, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    les tissus de fibres textiles artificielles discontinues, autres que rubanerie,
    velours, peluches, tissus bouclés (y compris les tissus bouclés du genre éponge)
    et tissus de chenille de la sous-position 56.07 B du tarif douanier commun (codes
    Nimexe: 56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73, 74,
    77, 78, 82, 83, 84, 87) (catégorie 37), originaires de la Corée du Sud et mis
    en libre pratique dans les autres États membres (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/930/EWG: Entscheidung der Kommission vom 19. Oktober 1979, mit der
    die Bundesrepublik Deutschland ermächtigt wird, aus Südkorea stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus künstlichen
    Spinnfasern, andere als Bänder, Samt, Plüsch, Schlingengewebe (einschließlich
    Frottiergewebe) und Chenillegewebe der Tarifstelle 56.07 B des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66,
    72, 73, 74, 77, 78, 82, 83, 84, 87) (Kategorie 37) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/930/EØF: Kommissionens beslutning af 19. oktober 1979 om bemyndigelse
    af Forbundsrepublikken Tyskland til fra fællesskabsbehandling at undtage vævet
    stof af endeløse regenererede fibre eller af affald af kemofibre, bortset fra
    vævede bånd, vævede fløjls-, plys og chenillestoffer (herunder håndklædefrotterstof
    og lignende frotterstof), som henhører under pos. 56.07 B i den fælles toldtarif
    (NIMEXE-nummer 56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73,
    74, 77, 78, 82, 83, 84, 87 ; kategori 37), har oprindelse i Sydkorea og frit kan
    omsættes i de øvrige medlemsstater(Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/930/CEE: Decisione della Commissione, del 19 ottobre 1979, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario i
    tessuti di fibre tessili artificiali in fiocco, diversi dai nastri, galloni e
    simili, velluti, felpe, tessuti ricci (compresi i tessuti ricci del tipo spugna)
    e tessuti di ciniglia, della sottovoce 56.07 B della tariffa doganale comune (codici
    Nimexe: 56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73, 74,
    77, 78, 82, 83, 84, 87), categoria 37, originari della Corea del Sud e messi in
    libera pratica negli altri Stati membri (Il testo in lingua tedesca è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/930/EEG: Beschikking van de Commissie van 19 oktober 1979 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd weefsels van kunstmatige stapelvezels,
    uitgezonderd lint, fluweel, pluche, lussenweefsels (bad- of frotteerstof inbegrepen)
    en chenilleweefsels, van post 56.07 B van het gemeenschappelijk douanetarief (NIMEXE-code
    56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73, 74, 77, 78,
