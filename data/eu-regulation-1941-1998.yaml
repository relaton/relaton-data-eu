    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1941/98 da Comissão de 11 de Setembro de 1998 que
    rejeita as propostas apresentadas na sequência do ducentésimo oitavo concurso
    parcial efectuado no âmbito das medidas gerais de intervenção, em conformidade
    com o Regulamento (CEE) nº 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1941/98 de la Comisión de 11 de septiembre de 1998
