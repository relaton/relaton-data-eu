title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1941/98 of 11 September 1998 deciding not
    to accept tenders submitted in response to the 208th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1941/98 de la Commission du 11 septembre 1998 disposant
    de ne pas donner suite aux offres déposées à la suite de la deux cent huitième
    adjudication partielle effectuée dans le cadre des mesures générales d'intervention
    conformément au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1941/98 der Kommission vom 11. September 1998 über
    den Beschluß, den zur 208. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1941/98 af 11. september 1998 om ikke
    at tage den 208. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1941/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 11ης Σεπτεμβρίου 1998 για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για το 208ο μερικό
    διαγωνισμό που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1941/98, annettu 11 päivänä syyskuuta 1998,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun kahdennensadannenkahdeksannen osittaisen tarjouskilpailun
    ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1941/98 della Commissione dell'11 settembre 1998 che
    decide di non dar seguito alle offerte presentate per la duecentottesima gara
    parziale effettuata nel quadro delle misure generali d'intervento conformemente
    al regolamento (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1941/98 van de Commissie van 11 september 1998 houdende
