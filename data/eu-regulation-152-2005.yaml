title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 152/2005 of 28 January 2005 specifying the
    extent to which applications lodged in January 2005 for import certificates in
    respect of young male bovine animals for fattening as part of a tariff quota provided
    for in Regulation (EC) No 1202/2004 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 152/2005 de la Commission du 28 janvier 2005 déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées au mois de janvier 2005 pour les jeunes bovins mâles destinés à
    l'engraissement dans le cadre d'un contingent tarifaire prévu par le règlement
    (CE) n° 1202/2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 152/2005 der Kommission vom 28. Januar 2005 über das
    Ausmaß, in dem den im Januar 2005 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder im Rahmen eines Zollkontingents
    gemäß der Verordnung (EG) Nr. 1202/2004 stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 152/2005 ze dne 28. ledna 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o dovozní licence pro dovoz
    mladého skotu samčího pohlaví určeného na výkrm, podaným v lednu 2005
    v rámci celní kvóty dle nařízení (ES) č. 1202/2004
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 152/2005 af 28. januar 2005 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indsendt i januar
    2005 for ungtyre bestemt til opfedning, i forbindelse med et toldkontingent, der
    er fastsat i forordning (EF) nr. 1202/2004, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 152/2005 της Επιτροπής,
    της 28ης Ιανουαρίου 2005, για καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για πιστοποιητικά εισαγωγής που υποβλήθηκαν
