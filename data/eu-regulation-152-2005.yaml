    byków opasowych, składane w styczniu 2005 r. w ramach kontyngentu taryfowego
    przewidzianego w rozporządzeniu (WE) nr 1202/2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 152/2005 da Comissão, de 28 de Janeiro de 2005,
    que determina em que medida pode ser dado seguimento aos pedidos de certificados
    de importação apresentados no mês de Janeiro de 2005 para os bovinos machos
    jovens destinados à engorda ao abrigo de um contingente pautal previsto pelo
    Regulamento (CE) n.° 1202/2004
  type: main
- language: sk
  script: Latn
