title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2247/1999 of 22 October 1999 determining
    the extent to which the applications for import licences submitted in October
    1999 for certain dairy products under certain tariff quotas opened by Regulation
    (EC) No 1374/98 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2247/1999 de la Commission, du 22 octobre 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 1999 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 1374/98 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2247/1999 der Kommission vom 22. Oktober 1999 zur Festlegung
