    l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-ftalat tal-bis(2-etileżil) (DEHP) f’ċerti komponenti
    tal-gomma użati f’sistemi tal-magni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2019/1845 van de Commissie van 8 augustus 2019
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad betreffende een vrijstelling voor bis(2-ethylhexyl)ftalaat (DEHP) in
    bepaalde rubber onderdelen voor gebruik in motorsystemen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2019/1845 z dnia 8 sierpnia 2019 r. zmieniająca,
    w celu dostosowania do postępu naukowo–technicznego, załącznik III do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    ftalanu di-2-etyloheksylu (DEHP) w niektórych gumowych elementach stosowanych
    w układach silnika
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2019/1845 da Comissão de 8 de agosto de 2019 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção relativa à utilização de ftalato de bis(2-etil-hexilo) (DEHP)
    em determinados componentes de borracha utilizados em sistemas de motores
  type: main
- language: ro
  script: Latn
  content: Directiva Delegată (UE) 2019/1845 a Comisiei din 8 august 2019 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru ftalatul de bis(2-etilhexil) (DEHP) din anumite componente din
    cauciuc utilizate la sistemele motoare
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2019/1845 z 8. augusta 2019, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    pre bis(2-etylhexyl)-ftalát (DEHP) v niektorých gumených súčiastkach motorov
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2019/1845 z dne 8. avgusta 2019 o spremembi
