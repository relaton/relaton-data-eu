    a tudományos és műszaki fejlődéshez történő hozzáigazítása céljából,
    a motorrendszerekben alkalmazott egyes gumi alkatrészekben lévő bisz(2-etil-hexil)-ftalátra
    (DEHP) vonatkozó mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva Delegata (UE) 2019/1845 della Commissione dell’8 agosto 2019
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato III
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso di bis(2-etilesil) ftalato in alcuni componenti
    di gomma utilizzati nei sistemi motore
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2019/1845 (2019. gada 8. augusts),
    ar ko, pielāgojot zinātnes un tehnikas attīstībai, Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu groza attiecībā uz atbrīvojumu bis(2-etilheksil)ftalāta
    (DEHP) izmantošanai noteiktās gumijas sastāvdaļās, ko izmanto motoru sistēmās
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2019/1845 2019 m. rugpjūčio 8 d.
