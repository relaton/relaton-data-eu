    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for di(2-ethylhexyl)phthalat
    (DEHP) i visse gummikomponenter, der anvendes i motorsystemer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (EE) 2019/1845 της
