    Parlamento ir Tarybos direktyvos 2011/65/ES III priedo nuostatos dėl išimties,
    kuria bis(2-etilheksil)ftalatą leidžiama naudoti tam tikrose guminėse sudedamosiose
    dalyse, naudojamose variklio sistemose
  type: main
- language: mt
  script: Latn
  content: DIRETTIVA DELEGATA TAL-KUMMISSJONI (UE) 2019/1845 tat-8 ta’ Awwissu 2019
