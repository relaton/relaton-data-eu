- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2019/1845 of 8 August 2019 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for bis(2-ethylhexyl) phthalate (DEHP) in certain rubber components
    used in engine systems
  type: main
- language: fr
  script: Latn
  content: Directive Déléguée (UE) 2019/1845 de la Commission du 8 août 2019 modifiant,
    aux fins de son adaptation au progrès scientifique et technique, l’annexe III
    de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative au phtalate de bis(2-éthylhexyle) (DEHP) dans certains
    composants en caoutchouc utilisés dans les systèmes moteurs
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2019/1845 der Kommission vom 8. August 2019
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für Di(2-ethylhexyl)phthalat (DEHP) in
    bestimmten in Motorsystemen verwendeten Gummibauteilen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2019/1845 на Комисията
