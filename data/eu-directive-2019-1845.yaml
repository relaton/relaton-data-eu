    käytettyjen tiettyjen kumiosien sisältämää bis(2-etyyliheksyyli)ftalaattia
    (DEHP) koskevan poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2019/1845 оd 8. kolovoza 2019. o izmjeni,
