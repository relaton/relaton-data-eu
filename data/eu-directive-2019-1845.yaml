    pri uporabi bis(2-etilheksil)ftalata (DEHP) v nekaterih gumijastih sestavnih delih,
    ki se uporabljajo v sistemih motorja, zaradi prilagoditve znanstvenemu in tehničnemu
    napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2019/1845 de la Comisión de 8 de agosto de 2019
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo en cuanto
    a una exención relativa al ftalato de bis(2-etilhexilo) (DEHP) en determinados
    componentes de caucho utilizados en los sistemas de motores
  type: main
- language: sv
  script: Latn
  content: Kommissionens Delegerade Direktiv (EU) 2019/1845 av den 8 augusti 2019
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för bis(2-etylhexyl)ftalat (DEHP) i vissa gummikomponenter som används
