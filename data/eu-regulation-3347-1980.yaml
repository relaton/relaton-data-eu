    ο Κανονισμός ( ΕΟΚ ) αριθ. 2325/80 περί καθορισμού
    των τρόπων εφαρμογής των συμπληρωματικών μέτρων
    που καθιερώθηκαν για τους κατόχους των βάσεων
    μακροπρόθεσμης αποθήκευσης επιτραπέζιων οίνων
    για την περίοδο εμπορίας 1979/1980
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3347/80 della Commissione, del 23 dicembre 1980, che
    modifica il regolamento (CEE) n. 2325/80, che stabilisce le modalità di applicazione
    delle misure complementari riservate ai titolari di contratti di magazzinaggio
    a lungo termine dei vini da tavola per la campagna 1979/1980
  type: main
- language: nl
