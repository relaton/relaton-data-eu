    für die Inhabern langfristiger Lagerverträge für Tafelweine vorbehaltenen ergänzenden
    Maßnahmen für das Wirtschaftsjahr 1979/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3347/80 af 23. december 1980 om ændring
    af forordning (EØF) nr. 2325/80 om fastsættelse af gennemførelsesbestemmelser
    for de supplerende foranstaltninger, der er forbeholdt indehaverne af langfristede
    oplagringskontrakter for bordvin for produktionsåret 1979/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3347/80 της Επιτροπής,
