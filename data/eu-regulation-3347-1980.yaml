title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3347/80 of 23 December 1980 amending Regulation
    (EEC) No 2325/80 laying down detailed rules for the application of the additional
    measures applicable to holders of long-term storage contracts for table wine for
    the 1979/80 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3347/80 de la Commission, du 23 décembre 1980, modifiant
    le règlement (CEE) n° 2325/80 établissant les modalités d' application des
    mesures complémentaires réservées aux détenteurs de contrats de stockage à
    long terme des vins de table pour la campagne 1979/1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3347/80 der Kommission vom 23. Dezember 1980 zur Änderung
