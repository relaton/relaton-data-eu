id: EUDecision1977766
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 2 August 1977 authorizing the French Republic not
    to apply Community treatment to blouses falling within heading No ex 61.02 of
    the Common Customs Tariff, originating in Hong Kong and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/766/CEE: Décision de la Commission, du 2 août 1977, autorisant la
    République française à exclure du traitement communautaire les importations
    des chemisiers et blouses pour femmes, fillettes et jeunes enfants, de la position
    Ex 61.02 du Tarif douanier commun, originaires de Hong-Kong et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. August 1977, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Hemdblusen und Blusen der Tarifnummer ex 61.02 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 2. august 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage skjortebluser, bluser, som
    henhører under pos. ex 61.02 i den fælles toldtarif, har oprindelse i Hongkong
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 agosto 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le camicette e bluse della voce
    ex 61.02 della tariffa doganale comune, originarie di Hong Kong e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 augustus 1977 waarbij de Franse Republiek
    wordt gemachtigd hemden en blouses, van post ex 61.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
