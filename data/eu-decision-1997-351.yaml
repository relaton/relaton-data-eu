title:
- language: en
  script: Latn
  content: '97/351/EC: Council Decision of 2 June 1997 authorizing the automatic renewal
    or continuation in force of provisions governing matters covered by the common
    commercial policy contained in the friendship, trade and navigation treaties and
    trade agreements concluded between Member States and third countries'
  type: main
- language: fr
  script: Latn
  content: '97/351/CE: Décision du Conseil du 2 juin 1997 autorisant la tacite reconduction
    ou le maintien en vigueur des dispositions dont les matières relèvent de la
    politique commerciale commune, contenues dans les traités d''amitié, de commerce
    et de navigation et dans les accords commerciaux, conclus par les États membres
    avec des pays tiers'
  type: main
- language: de
  script: Latn
  content: '97/351/EG: Entscheidung des Rates vom 2. Juni 1997 zur Genehmigung der
    stillschweigenden Verlängerung oder der Aufrechterhaltung der Bestimmungen von
    Freundschafts-, Handels- und Schiffahrtsverträgen sowie Handelsabkommen zwischen
    den Mitgliedstaaten und dritten Ländern, deren Gegenstand unter die gemeinsame
    Handelspolitik fällt'
  type: main
- language: da
  script: Latn
  content: '97/351/EF: Rådets Beslutning af 2. juni 1997 om bemyndigelse til stiltiende
    videreførelse eller opretholdelse af bestemmelser, hvis indhold er omfattet af
    den fælles handelspolitik, og som er indeholdt i de venskabs-, handels- og skibsfartstraktater
    og handelsaftaler, som medlemsstaterne har indgået med tredjelande'
  type: main
- language: el
  script: Grek
  content: '97/351/ΕΚ: Απόφαση του συμβουλίου της 2ας Ιουνίου
    1997 για την έγκριση της σιωπηρής ανανέωσης ή
    της διατήρησης σε ισχύ ορισμένων διατάξεων
    κοινής εμπορικής πολιτικής, οι οποίες περιλαμβάνονται
    στις συνθήκες φιλίας, εμπορίου και ναυτιλίας
    και στις εμπορικές συμφωνίες που έχουν συνάψει
    τα κράτη μέλη με τρίτες χώρες'
  type: main
- language: fi
  script: Latn
  content: '97/351/EY: Neuvoston päätös, tehty 2 päivänä kesäkuuta 1997, luvan
    antamisesta jäsenvaltioiden kolmansien maiden kanssa tekemiin ystävyys-, kauppa-
    ja merenkulkusopimuksiin sekä kauppasopimuksiin sisältyvien yhteisen kauppapolitiikan
    alaan kuuluvien määräysten voimassaoloajan jatkamiseen ilman eri toimenpiteitä
    tai niiden voimassa pitämiseen'
  type: main
- language: it
  script: Latn
  content: '97/351/CE: Decisione del Consiglio del 2 giugno 1997 che autorizza il
    tacito rinnovo o il mantenimento in vigore delle disposizioni relative a materie
    che rientrano nella politica commerciale comune contenute nei trattati d''amicizia,
    di commercio e di navigazione e negli accordi commerciali conclusi dagli Stati
    membri con i paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '97/351/EG: Beschikking van de Raad van 2 juni 1997 houdende machtiging
    tot stilzwijgende verlenging of handhaving van de bepalingen betreffende aangelegenheden
    die vallen onder de gemeenschappelijke handelspolitiek en die vervat zijn in tussen
    de lidstaten en derde landen gesloten vriendschaps-, handels- en scheepvaartverdragen
    en handelsovereenkomsten'
  type: main
- language: pt
  script: Latn
  content: '97/351/CE: Decisão do Conselho de 2 de Junho de 1997 que autoriza a recondução
    tácita ou a manutenção em vigor das disposições cujas matérias sejam abrangidas
    pela política comercial comum e figurem em tratados de amizade, de comércio
    e de navegação e em acordos comerciais concluídos pelos Estados-membros com
    países terceiros'
  type: main
- language: es
  script: Latn
  content: '97/351/CE: Decisión del Consejo de 2 de junio de 1997 por la que se autoriza
    la tácita reconducción o el mantenimiento en vigor de las disposiciones cuyas
    materias estén sujetas a la política comercial común contenidas en los tratados
    de amistad, comercio y navegación y en los acuerdos comerciales celebrados por
    los Estados miembros con terceros países'
  type: main
- language: sv
  script: Latn
  content: '97/351/EG: Rådets beslut av den 2 juni 1997 om bemyndigande av förnyelse
    genom tyst samförstånd eller genom att behålla bestämmelser i kraft, vilkas
    innehåll omfattas av den gemensamma handelspolitiken och som ingår i vänskaps-,
    handels- och sjöfartsfördrag samt i handelsavtal som medlemsstaterna slutit
    med tredje land'
