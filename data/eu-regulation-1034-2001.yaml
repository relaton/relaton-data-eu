  content: Commission Regulation (EC) No 1034/2001 of 29 May 2001 amending Regulation
    (EC) No 6/2001 laying down detailed rules for the application of Council Regulation
    (EC) No 1804/98 as regards the opening of a tariff quota for imports of residues
    from the manufacture of starch from maize falling within CN codes 23031019 and
    23099020 and originating in the United States of America
  type: main
- language: fr
  script: Latn
