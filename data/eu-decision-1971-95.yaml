  content: Décision de la Commission, du 3 février 1971, autorisant le Royaume de
    Belgique à admettre, jusqu'au 31 juillet 1971, la commercialisation de semences
    de fétuque soumises à des exigences réduites
  type: main
- language: de
  script: Latn
  content: '71/95/EWG: Entscheidung der Kommission vom 3. Februar 1971 zur Ermächtigung
    des Königreichs Belgien, bis zum 31. Juli 1971 Saatgut von Schwingel mit minderen
    Anforderungen zum Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '71/95/CEE: Decisione della Commissione, del 3 febbraio 1971, che autorizza
    il Regno del Belgio ad ammettere fino al 31 luglio 1971 la commercializzazione
    delle sementi di festuca soggette a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '71/95/EEG: Beschikking van de Commissie van 3 februari 1971 waarbij het
    Koninkrijk België wordt gemachtigd om tot en met 31 juli 1971 zaden van Festuca,
    waaraan minder strenge eisen zijn gesteld, tot de handel toe te laten'
