  script: Latn
  content: Règlement (CEE) n° 1457/80 du Conseil, du 9 juin 1980, confirmant les
    mesures de sauvegarde applicables aux fils texturés de fibres textiles de polyamides
    pour tapis, originaires de certains pays tiers et importés au Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1457/80 des Rates vom 9. Juni 1980 zur Bestätigung
