id: EUDecision1974196
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 April 1974 authorizing the Italian Republic not
    to apply Community treatment to aerials and deflection yokes falling within heading
    Nos 85.15 C ex III and 85.21 ex E of the Common Customs Tariff, originating in
    Japan and in free circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: Décision 74/196/CEE de la Commission, du 9 avril 1974, autorisant la République
    italienne à exclure du traitement communautaire les antennes et les jeux de déflexion
    des positions 85.15 C Ex III et 85.21 Ex E du Tarif douanier commun, originaires
    du Japon et mis en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. April 1974, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in der Bundesrepublik Deutschland
    im freien Verkehr befindliche Antennen und Ablenkeinheiten der Tarifnummern 85.15
    C ex III und 85.21 ex E des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. april 1974 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage antenner og afbøjningsmål,
    som henhører under position 85.15 C ex III og 85.21 ex E i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 aprile 1974, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le antenne e i gioghi di deflessione
    delle voci nn. 85.15 C ex III e 85.21 ex E della tariffa doganale comune, originari
    del Giappone e messi in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 april 1974 waarbij de Italiaanse Republiek
    wordt gemachtigd antennes en afbuigelementen van posten 85.15 C ex III en 85.21
    ex E van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de
    Bondsrepubliek Duitsland in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
