    των πλοίων με ισπανική σημαία, στα οποία επιτρέπεται
    η αλιεία του μακρύπτερου τόνου στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1419/86, annettu 6 päivänä toukokuuta 1986,
