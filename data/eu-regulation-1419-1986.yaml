    germon dans les eaux relevant de la souveraineté ou de la juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1419/86 des Rates vom 6. Mai 1986 über die Anzahl
    der Fischereifahrzeuge unter spanischer Flagge, die Weißen Thun in den Gewässern
    unter der Hoheitsgewalt oder Gerichtsbarkeit Portugals fangen dürfen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1419/86 af 6. maj 1986 om fastsættelse af
