    on lupa pyytää valkotonnikalaa Portugalin suvereniteettiin tai lainkäyttövaltaan
    kuuluvilla vesillä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1419/86 del Consiglio del 6 maggio 1986 che fissa
    il numero delle navi battenti bandiera spagnola, autorizzate ad esercitare la
    pesca del tonno bianco nelle acque soggette alla sovranità o alla giurisdizione
    del Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1419/86 van de Raad van 6 mei 1986 tot vaststelling
