    mogen vissen in de wateren welke onder de soevereiniteit of de jurisdictie van
    Portugal vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1419/86 do Conselho de 6 de Maio de 1986 que fixa
