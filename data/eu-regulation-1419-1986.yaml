  content: Council Regulation (EEC) No 1419/86 of 6 May 1986 fixing the number of
    vessels flying the flag of Spain authorized to fish for albacore tuna in waters
    under the sovereignty or jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1419/86 du Conseil du 6 mai 1986 fixant le nombre
