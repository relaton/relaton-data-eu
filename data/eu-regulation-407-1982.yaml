  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 407/82 del Consiglio, del 22 febbraio 1982, che modifica
    il regolamento (CEE) n. 3306/80 per quanto concerne il dazio definitivo antidumping
