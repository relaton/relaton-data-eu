  content: Council Regulation (EEC) No 407/82 of 22 February 1982 amending Regulation
    (EEC) No 3306/80 as regards the definitive anti-dumping duty on mechanical alarm
    clocks (other than travel alarms) originating in the German Democratic Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 407/82 du Conseil, du 22 février 1982, portant modification
