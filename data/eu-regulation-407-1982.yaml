    auf mechanische Wecker (ausgenommen Reisewecker) und Uhren mit Weckerwerk mit
    Ursprung in der Deutschen Demokratischen Republik
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 407/82 af 22. februar 1982 om ændring af
    forordning (EØF) nr. 3306/80 for så vidt angår indførelse af en endelig antidumpingtold
    på mekaniske vækkeure (bortset fra rejseure) med oprindelse i Den tyske demokratiske
    Republik
  type: main
- language: el
  script: Grek
