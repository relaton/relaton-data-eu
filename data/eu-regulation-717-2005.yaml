title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 717/2005 of 11 May 2005 amending for the
    45th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 717/2005 de la Commission du 11 mai 2005 modifiant
    pour la quarante-cinquième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 717/2005 der Kommission vom 11. Mai 2005 zur fünfundvierzigsten
    Änderung der Verordnung (EG) Nr. 881/2002 des Rates über die Anwendung bestimmter
    spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit Osama bin Laden, dem Al-Qaida-Netzwerk und den Taliban in Verbindung stehen,
    und zur Aufhebung der Verordnung (EG) Nr. 467/2001 des Rates
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 717/2005 ze dne 11. května 2005, kterým se
    po čtyřicáté páté mění nařízení Rady (ES) č. 881/2002 o zavedení
    některých zvláštních omezujících opatření namířených proti některým
    osobám a subjektům spojeným s Usámou bin Ládinem, sítí Al-Kajdá a Talibanem
    a o zrušení nařízení Rady (ES) č. 467/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 717/2005 af 11. maj 2005 om 45. ændring
    af Kommissionens forordning (EF) nr. 881/2002 om indførelse af visse specifikke
    restriktive foranstaltninger mod visse personer og enheder, der har tilknytning
    til Usama bin Laden, Al-Qaida-organisationen og Taliban, og om ophævelse af Rådets
    forordning (EF) nr. 467/2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 717/2005 της Επιτροπής,
    της 11ης Μαΐου 2005, που τροποποιεί για τεσσαρακοστή
    πέμπτη φορά τον κανονισμό (ΕΚ) αριθ. 881/2002 του
    Συμβουλίου για την επιβολή συγκεκριμένων περιοριστικών
    μέτρων κατά ορισμένων προσώπων και οντοτήτων
    που συνδέονται με τον Οσάμα Μπιν Λάντεν, το
    δίκτυο της Αλ Κάιντα και τους Ταλιμπάν και
    για την κατάργηση του κανονισμού (ΕΚ) αριθ.
    467/2001 του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 717/2005, 11. mai 2005, millega 45. korda muudetakse
    nõukogu määrust (EÜ) nr 881/2002, millega kehtestatakse teatavate Osama bin
    Ladeni, Al-Qaida võrgu ja Talibaniga seotud isikute ja üksuste vastu suunatud
    eripiirangud ja tunnistatakse kehtetuks nõukogu määrus (EÜ) nr 467/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 717/2005, annettu 11 päivänä toukokuuta 2005,
    tiettyihin Osama bin Ladenia, al-Qaida-verkostoa ja Talebania lähellä oleviin
    henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista toimenpiteistä
    sekä neuvoston asetuksen (EY) N:o 467/2001 kumoamisesta annetun neuvoston asetuksen
    (EY) N:o 881/2002 muuttamisesta 45. kerran
  type: main
- language: hu
  script: Latn
  content: A Tanács 717/2005/EK rendelete (2005. május 11.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a tálibokkal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedések bevezetéséről
    és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről szóló
    881/2002/EK tanácsi rendelet 45. alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 717/2005 della Commissione, dell’11 maggio 2005,
    recante quarantacinquesima modifica del regolamento (CE) n. 881/2002 del Consiglio
    che impone specifiche misure restrittive nei confronti di determinate persone
    ed entità associate a Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga
    il regolamento (CE) n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 717/2005 (2005. gada 11. maijs), ar ko 45. reizi
    groza Padomes Regulu (EK) Nr. 881/2002, ar kuru paredz īpašus ierobežojošus
    pasākumus, kas vērsti pret konkrētām personām un organizācijām, kas saistītas
    ar Osamu Bin Ladenu, Al-Qaida tīklu un Taliban, un ar kuru atceļ Padomes Regulu
    (EK) Nr. 467/2001
  type: main
- language: lt
  script: Latn
  content: 2005 m. gegužės 11 d. Komisijos reglamentas (EB) Nr. 717/2005, 45-ąjį
    kartą iš dalies keičiantis Tarybos reglamentą (EB) Nr. 881/2002, nustatantį
    tam tikras specialias ribojančias priemones, taikomas tam tikriems asmenims ir
    organizacijoms, susijusiems su Osama bin Ladenu, Al-Quaida tinklu ir Talibanu,
    ir panaikinantis Tarybos reglamentą (EB) Nr. 467/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 717/2005 van de Commissie van 11 mei 2005 tot 45e
    wijziging van Verordening (EG) nr. 881/2002 van de Raad tot vaststelling van bepaalde
    specifieke beperkende maatregelen tegen sommige personen en entiteiten die banden
    hebben met Osama bin Laden, het Al Qa' ida-netwerk en de Taliban, en tot intrekking
    van Verordening (EG) nr. 467/2001 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 717/2005 z dnia 11 maja 2005 r. zmieniające
    po raz czterdziesty piąty rozporządzenie Rady (WE) nr 881/2002 wprowadzające
    niektóre szczególne środki ograniczające skierowane przeciwko niektórym osobom
    i podmiotom związanym z Osamą bin Ladenem, siecią Al-Kaida i talibami i uchylające
    rozporządzenie Rady (WE) nr 467/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 717/2005 da Comissão, de 11 de Maio de 2005, que
    altera pela quadragésima quinta vez o Regulamento (CE) n.° 881/2002 do Conselho
    que institui certas medidas restritivas específicas contra determinadas pessoas
    e entidades associadas a Osama Bin Laden, à rede Al Qaida e aos Talibã, e que
    revoga o Regulamento (CE) n.° 467/2001 do Conselho
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 717/2005 z 11. mája 2005, ktorým sa štyridsiaty
    piatykrát mení a dopĺňa nariadenie Rady (ES) č. 881/2002, ktoré ukladá
    niektoré špecifické obmedzujúce opatrenia namierené proti niektorým osobám
    a subjektom spojeným s Usámom bin Ládinom, sieťou Al-Qaida a Talibanom a zrušuje
    nariadenie Rady (ES) č. 467/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 717/2005 z dne 11. maja 2005 o petinštirideseti
    spremembi Uredbe Sveta (ES) št. 881/2002 o posebnih omejevalnih ukrepih za nekatere
    osebe in subjekte, povezane z Osamo bin Ladnom, mrežo Al-Kaida in Talibani, in
    razveljavitvi Uredbe Sveta (ES) št. 467/2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 717/2005 de la Comisión, de 11 de mayo de 2005, que
    modifica por cuadragésimo quinta vez el Reglamento (CE) n° 881/2002 del Consejo
    por el que se imponen determinadas medidas restrictivas específicas dirigidas
    contra determinadas personas y entidades asociadas con Usamah bin Ladin, la red
    Al-Qaida y los talibanes y por el que se deroga el Reglamento (CE) n° 467/2001
    del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 717/2005 av den 11 maj 2005 om ändring
    för fyrtiofemte gången av rådets förordning (EG) nr 881/2002 beträffande
    införande av vissa särskilda restriktiva åtgärder mot vissa med Usama bin
    Ladin, nätverket al-Qaida och talibanerna associerade personer och enheter och
    om upphävande av rådets förordning (EG) nr 467/2001
