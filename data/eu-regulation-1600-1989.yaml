  content: Commission Regulation (EEC) No 1600/89 of 8 June 1989 re-establishing the
    levying of customs duties on dresses, shawls, ties of silk products of category
    No 159 (order No 42.1590) originating in China to which the preferential tariff
    arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1600/89 de la Commission du 8 juin 1989 portant rétablissement
