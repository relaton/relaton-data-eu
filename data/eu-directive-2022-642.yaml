    Kipre, Airijoje bei Maltoje, leidžiančiomis nuostatomis
  type: main
- language: mt
  script: Latn
  content: Direttiva (UE) 2022/642 tal-Parlament Ewropew u tal-Kunsill tat-12 ta’
