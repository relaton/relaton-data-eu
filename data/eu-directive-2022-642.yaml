title:
- language: en
  script: Latn
  content: Directive (EU) 2022/642 of the European Parliament and of the Council of
    12 April 2022 amending Directives 2001/20/EC and 2001/83/EC as regards derogations
    from certain obligations concerning certain medicinal products for human use made
    available in the United Kingdom in respect of Northern Ireland and in Cyprus,
    Ireland and Malta
  type: main
- language: fr
  script: Latn
  content: Directive (UE) 2022/642 du Parlement européen et du Conseil du 12 avril
    2022 modifiant les directives 2001/20/CE et 2001/83/CE en ce qui concerne les
    dérogations à certaines obligations relatives à certains médicaments à usage
    humain mis à disposition au Royaume-Uni en ce qui concerne l’Irlande du Nord
    ainsi qu’à Chypre, en Irlande et à Malte
  type: main
- language: de
  script: Latn
  content: Richtlinie (EU) 2022/642 des Europäischen Parlaments und des Rates vom
    12. April 2022 zur Änderung der Richtlinien 2001/20/EG und 2001/83/EG in Bezug
    auf Ausnahmen von bestimmten Verpflichtungen für bestimmte im Vereinigten Königreich
    bereitgestellte Humanarzneimittel in Bezug auf Nordirland und in Bezug auf Zypern,
    Irland und Malta
  type: main
- language: bg
  script: Cyrl
  content: Директива (ЕС) 2022/642 на Европейския парламент
    и на Съвета от 12 април 2022 година за изменение
    на директиви 2001/20/ЕО и 2001/83/ЕО по отношение на
    дерогации от някои задължения, свързани с определени
    лекарствени продукти за хуманна употреба,
    които се предлагат в Обединеното кралство
    по отношение на Северна Ирландия, както и в
    Кипър, Ирландия и Малта
  type: main
- language: cs
  script: Latn
