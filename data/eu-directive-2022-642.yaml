    bhaineann le maoluithe ar oibleagáidí áirithe i dtaca le táirgí íocshláinte
    áirithe lena n-úsáid ag an duine a chuirtear ar fáil sa Ríocht Aontaithe
    i ndáil le Tuaisceart Éireann agus sa Chipir, in Éirinn agus i Málta
  type: main
- language: hr
  script: Latn
  content: Direktiva (EU) 2022/642 Europskog parlamenta i Vijeća od 12. travnja 2022.
    o izmjeni direktiva 2001/20/EZ i 2001/83/EZ u pogledu odstupanja od određenih
    obveza u vezi s određenim lijekovima za humanu primjenu koji se stavljaju na
    raspolaganje u Ujedinjenoj Kraljevini u vezi sa Sjevernom Irskom te u Cipru, Irskoj
    i Malti
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2022/642 irányelve (2022. április
    12.) a 2001/20/EK és a 2001/83/EK irányelvnek az Észak-Írország tekintetében
    az Egyesült Királyságban, valamint Cipruson, Írországban és Máltán elérhetővé
    tett, emberi felhasználásra szánt gyógyszerekre vonatkozó bizonyos kötelezettségektől
    való eltérések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva (UE) 2022/642 del Parlamento europeo e del Consiglio del 12 aprile
    2022 che modifica le direttive 2001/20/CE e 2001/83/CE per quanto riguarda le
    deroghe a determinati obblighi concernenti determinati medicinali per uso umano
    resi disponibili nel Regno Unito in relazione all’Irlanda del Nord e a Cipro,
    in Irlanda e a Malta
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva (ES) 2022/642 (2022. gada 12.
    aprīlis), ar ko Direktīvu 2001/20/EK un Direktīvu 2001/83/EK Groza attiecībā
    uz atkāpēm no noteiktiem pienākumiem saistībā ar noteiktām cilvēkiem paredzētām
    zālēm, ko dara pieejamas Apvienotajā Karalistē attiecībā uz Ziemeļīriju,
    un Kiprā, Īrijā un Maltā
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos direktyva (ES) 2022/642, kuria iš dalies
