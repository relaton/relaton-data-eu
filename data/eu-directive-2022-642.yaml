    päivänä huhtikuuta 2022, direktiivien 2001/20/EY ja 2001/83/EY muuttamisesta
    siltä osin kuin on kyse poikkeuksista tiettyihin velvoitteisiin, jotka koskevat
    tiettyjä Yhdistyneessä kuningaskunnassa Pohjois-Irlannin osalta sekä Kyproksessa,
