    minn ċerti obbligi li jikkonċernaw id-disponibbiltà ta’ ċerti prodotti mediċinali
    għall-użu mill-bniedem fir-Renju Unit fir-rigward tal-Irlanda ta’ Fuq, u f’Ċipru,
    fl-Irlanda u f’Malta
  type: main
- language: nl
  script: Latn
  content: Richtlijn (EU) 2022/642 van het Europees Parlement en de Raad van 12 april
