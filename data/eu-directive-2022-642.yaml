    Cyprus, Ierland en Malta verkrijgbaar worden gesteld
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady (UE) 2022/642 z dnia 12 kwietnia
    2022 r. zmieniająca dyrektywy 2001/20/WE i 2001/83/WE w odniesieniu do odstępstw
    od niektórych obowiązków dotyczących niektórych produktów leczniczych stosowanych
    u ludzi udostępnianych w Zjednoczonym Królestwie w odniesieniu do Irlandii Północnej
    oraz na Cyprze, w Irlandii i na Malcie
  type: main
- language: pt
  script: Latn
  content: Diretiva (UE) 2022/642 do Parlamento Europeu e do Conselho de 12 de abril
    de 2022 que altera as Diretivas 2001/20/CE e 2001/83/CE no que se refere a derrogações
    de determinadas obrigações relativas a certos medicamentos para uso humano disponibilizados
    no Reino Unido no que diz respeito à Irlanda do Norte e em Chipre, na Irlanda
    e em Malta
  type: main
- language: ro
  script: Latn
  content: Directiva (UE) 2022/642 a Parlamentului European și a Consiliului din
    12 aprilie 2022 de modificare a Directivelor 2001/20/CE și 2001/83/CE în ceea
    ce privește derogările de la anumite obligații referitoare la anumite medicamente
    de uz uman puse la dispoziție în Regatul Unit în ceea ce privește Irlanda
    de Nord și în Cipru, Irlanda și Malta
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady (EÚ) 2022/642 z 12. apríla 2022,
    ktorou sa menia smernice 2001/20/ES a 2001/83/ES, pokiaľ ide o výnimky z určitých
    povinností týkajúcich sa určitých liekov na humánne použitie sprístupnených
    v Spojenom kráľovstve vo vzťahu k Severnému Írsku, a na Cypre, v Írsku a
    na Malte
  type: main
