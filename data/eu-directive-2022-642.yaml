    od některých povinností týkajících se určitých humánních léčivých
    přípravků dodávaných na trh ve Spojeném království s ohledem na Severní
    Irsko a na Kypru, v Irsku a na Maltě
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv (EU) 2022/642 af 12. april 2022
    om ændring af direktiv 2001/20/EF og 2001/83/EF for så vidt angår undtagelser
    fra visse forpligtelser vedrørende visse humanmedicinske lægemidler, der gøres
    tilgængelige i Det Forenede Kongerige for så vidt angår Nordirland samt i Cypern,
    Irland og Malta
  type: main
- language: el
  script: Grek
