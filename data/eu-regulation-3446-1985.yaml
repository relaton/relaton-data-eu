title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3446/85 of 6 December 1985 amending Regulation
    (EEC) No 467/77 on the method and the rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying in, storage and
    disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3446/85 de la Commission du 6 décembre 1985 modifiant
    le règlement (CEE) no 467/77 relatif à la méthode et aux taux d' intérêt
    à appliquer pour le calcul des frais de financement des interventions consistant
    en achat, stockage et écoulement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3446/85 der Kommission vom 6. Dezember 1985 zur Änderung
    der Verordnung (EWG) Nr. 467/77 über die Methode und den Zinssatz, die bei der
    Berechnung der Finanzierungskosten für Interventionen in Form von Ankauf, Lagerung
    und Absatz anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3446/85 af 6. december 1985 om ændring
    af forordning (EØF) nr. 467/77 om den metode og den rentesats, der skal anvendes
    ved beregningen af finansieringsudgifter i forbindelse med interventioner i form
    af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3446/85 της Επιτροπής
    της 6ης Δεκεμβρίου 1985 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 467/77 σχετικά με τη μέθοδο
    και το επιτόκιο που πρέπει να εφαρμοσθούν για
    τον υπολογισμό των εξόδων τοκισμού των παρεμβάσεων
    που συνίστανται σε αγορές, αποθεματοποίηση
    και διάθεση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3446/85 della Commissione del 6 dicembre 1985 che
    modifica il regolamento (CEE) n. 467/77, che stabilisce il metodo ed il tasso
    d' interesse da utilizzare per il calcolo delle spese di finanziamento degli interventi
    costituiti da acquisti, magazzinaggio e vendita
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3446/85 van de Commissie van 6 december 1985 tot
    wijziging van Verordening (EEG) nr. 467/77 met betrekking tot de methode en de
    rentevoet die dienen te worden toegepast bij de berekening van de financieringskosten
    van de interventies in de vorm van aankoop, opslag en afzet
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3446/85 da Comissão, de 6 de Dezembro de 1985,
    que altera o Regulamento (CEE) n.° 467/77 relativo ao método e às taxas de
    juro a aplicar para o cálculo dos custos de financiamento das intervenções
    que consistem na compra, armazenagem e escoamento
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3446/85 de la Comisión, de 6 de diciembre de 1985,
    por el que se modifica el Reglamento (CEE) n° 467/77 relativo al método y a
    los tipos de interés que deben aplicarse para el cálculo de los gastos de financiación
    de las intervenciones consistentes en comprar, almacenar y comercializar
  type: main
