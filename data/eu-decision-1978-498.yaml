id: EUDecision1978498
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 30 May 1978 authorizing the French Republic not
    to apply Community treatment to men's, boys', women's, girls' and infants' coats
    and raincoats, falling within heading No ex 61.01 or ex 61.02 of the Common Customs
    Tariff, originating in Poland and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/498/CEE: Décision de la Commission, du 30 mai 1978, autorisant la
    République française à exclure du traitement communautaire les manteaux et
    manteaux imperméabilisés pour hommes et garçonnets, femmes, fillettes et jeunes
    enfants, des positions Ex 61.01 et Ex 61.02 du Tarif douanier commun, originaires
    de Pologne et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. Mai 1978, mit der die Französische
    Republik ermächtigt wird, aus Polen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Mäntel und Regenmäntel für Männer und Knaben,
    Frauen, Mädchen und Kleinkinder, der Tarifnummern ex 61.01 und ex 61.02 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 30. maj 1978 om bemyndigelse af Den franske
    Republik fra fællesskabsbehandling at undtage frakker og regnfrakker til mænd,
    drenge, kvinder, piger og småbørn, som henhører under pos. ex 61.01 og ex 61.02
    i den fælles toldtarif, har oprindelse i Polen og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 maggio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i mantelli e i mantelli impermeabili
    per uomo, ragazzo, donna, ragazza e bambini delle voci ex 61.01 e ex 61.02 della
    tariffa doganale comune, originari della Polonia e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 mei 1978 waarbij de Franse Republiek
    wordt gemachtigd overjassen en regenjassen voor heren en jongens, dames, meisjes
    en kinderen, van de posten ex 61.01 en ex 61.02 van het gemeenschappelijk douanetarief,
    van oorsprong uit Polen en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
