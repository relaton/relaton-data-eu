    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu kadmijam rentgena
    attēlu pastiprinātāju fosfora pārklājumos līdz 2019. gada 31. decembrim
    un rentgena sistēmu rezerves daļās, kas laistas ES tirgū pirms 2020. gada
    1. janvāra
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/2/ES, kuria,
