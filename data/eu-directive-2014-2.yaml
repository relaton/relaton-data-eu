    sen mukauttamiseksi tekniikan kehitykseen kadmiumia röntgenkuvien kuvanvahvistimien
    loisteainepinnoitteissa 31 päivään joulukuuta 2019 saakka sekä ennen 1 päivää
    tammikuuta 2020 EU:n markkinoille saatetuissa röntgenjärjestelmien varaosissa
