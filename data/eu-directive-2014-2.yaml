    Europskog parlamenta i Vijeća u pogledu izuzeća za kadmij u fosfornim premazima
    u pojačivačima slike za rendgenske slike do 31. prosinca 2019. te u rezervnim
    dijelovima za rendgenske sustave stavljene na tržište EU-a prije 1. siječnja
    2020 .
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/2/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a röntgen-képerősítők foszforbevonatában és az uniós piacon 2020. január
    1-je előtt forgalomba hozott röntgenrendszerek cserealkatrészeinek foszforbevonatában
    lévő kadmium 2019. december 31-ig szóló mentesítése tekintetében, a műszaki
    fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/2/UE della Commissione, del 18 ottobre 2013 , che
    modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione relativa
    al cadmio nei rivestimenti dei fosfori degli amplificatori di immagini radiografiche
    fino al 31 dicembre 2019 e nei pezzi di ricambio per sistemi radiografici immessi
    sul mercato unionale prima del 1 °gennaio 2020
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/2/ES ( 2013. gada 18. oktobris ),
