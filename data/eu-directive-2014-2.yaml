    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria iki 2019
    m. gruodžio 31 d. leidžiama naudoti kadmį rentgeno vaizdo stiprintuvų fosforo
    dangose ir rentgeno sistemų, pateiktų ES rinkai iki 2020 m. sausio 1 d. , atsarginėse
    dalyse
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/2/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal kadmju fil-kisjiet tal-fosfru f’intensifikaturi tal-immaġni
    għal ritratti bir-raġġi X sal- 31 ta’ Diċembru 2019 u fil-parts ta’ sostituzzjoni
    għas-sistemi tar-raġġi X imqiegħda fis-suq tal-UE qabel l- 1 ta’ Jannar
    2020
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/2/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor cadmium in fosforcoatings in röntgenbeeldversterkers tot
    en met 31 december 2019 en in reserveonderdelen voor röntgensystemen die vóór
    1 januari 2020 in de EU in de handel zijn gebracht
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/2/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    kadmu w powłokach fosforowych w sprzęcie wzmacniającym obrazy na zdjęciach
    rentgenowskich do dnia 31 grudnia 2019 r. i w częściach zamiennych do systemów
    prześwietlania promieniami Rentgena wprowadzonych do obrotu na rynku UE przed
    dniem 1 stycznia 2020 r.
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/2/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para a utilização de cádmio em revestimentos fosforescentes de intensificadores
    de imagens de raios X, até 31 de dezembro de 2019 , e em peças sobresselentes
    de aparelhos de raios X colocados no mercado da União anteriormente a 1 de janeiro
    de 2020
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/2/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    cadmiul din acoperirile cu fosfor ale amplificatoarelor de imagine utilizate în
    imagistica sistemelor cu raze X până la 31 decembrie 2019 și din piesele de
    schimb pentru sistemele cu raze X introduse pe piața UE înainte de 1 ianuarie
    2020
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/2/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre kadmium vo fosforových
    poťahoch v zosilňovačoch obrazu pri röntgenovom snímaní do 31. decembra
    2019 a v náhradných dieloch pre röntgenové systémy uvedené na trh EÚ pred
    1. januárom 2020
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/2/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    pri uporabi kadmija v fosfornih prevlekah v ojačevalcih rentgenskih slik do 31.
    decembra 2019 in rezervnih delih za rentgenske sisteme, ki so bili dani na trg
    EU pred 1. januarjem 2020 , zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/2/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el cadmio en los revestimientos de fósforo de los intensificadores de imagen
    de rayos X hasta el 31 de diciembre de 2019 y en las piezas de repuesto para sistemas
    de rayos X comercializadas en la UE antes del 1 de enero de 2020
  type: main
