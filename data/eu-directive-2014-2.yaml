    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на кадмий
    във фосфорните покрития в усилвателите на
    рентгенови изображения до 31 декември 2019 г.
    и в резервни части за рентгенови системи, пуснати
    на пазара в ЕС преди 1 януари 2020 г.
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/2/EU ze dne 18. října 2013
    , kterou se pro účely přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    kadmium v luminoforových povlacích zesilovačů obrazu pro rentgenové snímkování
    do 31. prosince 2019 a náhradní díly pro rentgenové systémy uvedené na trh
    EU před 1. lednem 2020
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/2/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår en undtaget anvendelse af cadmium i lysstofbelægninger
    i billedforstærkere til røntgenbilleder indtil den 31. december 2019 og i reservedele
    til røntgensystemer, der bringes i omsætning i EU før den 1. januar 2020
  type: main
