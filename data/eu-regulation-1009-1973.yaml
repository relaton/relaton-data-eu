title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1009/73 of the Commission of 12 April 1973 adopting
    in respect of Denmark special measures for maize groats and meal used in the manufacture
    of glucose
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1009/73 de la Commission, du 12 avril 1973, arrêtant,
    pour le Danemark, des mesures spéciales en ce qui concerne les gruaux et semoules
    de maïs utilisés dans la glucoserie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1009/73 der Kommission vom 12. April 1973 zum Erlaß
    besonderer Maßnahmen für Grob- und Feingrieß von Mais, der in Dänemark in
    der Glukoseindustrie verwendet wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1009/73 af 12. april 1973 om fastsættelse
    for så vidt angår Danmark af særlige foranstaltninger vedrørende grove og
    fine gryn af majs til anvendelse i glukoseindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1009/73 della Commissione, del 12 aprile 1973, che
    adotta, per la Danimarca, dei provvedimenti speciali per quanto riguarda le semole
    e i semolini di granturco utilizzati nella fabbricazione del glucosio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1009/73 van de Commissie van 12 april 1973 houdende
    bijzondere maatregelen voor Denemarken voor wat betreft gries en griesmeel van
    maïs die in de glucose-industrie worden gebruikt
  type: main
