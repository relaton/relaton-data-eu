id: EURegulation12342007
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1234/2007 of 22 October 2007 establishing a
    common organisation of agricultural markets and on specific provisions for certain
    agricultural products (Single CMO Regulation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1234/2007 du Conseil du 22 octobre 2007 portant organisation
    commune des marchés dans le secteur agricole et dispositions spécifiques en
    ce qui concerne certains produits de ce secteur (règlement OCM unique )
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1234/2007 des Rates vom 22. Oktober 2007 über eine
    gemeinsame Organisation der Agrarmärkte und mit Sondervorschriften für bestimmte
    landwirtschaftliche Erzeugnisse (Verordnung über die einheitliche GMO)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1234/2007 на Съвета от 22 октомври
    2007 година за установяване на обща организация
    на селскостопанските пазари и относно специфични
    разпоредби за някои земеделски продукти ( Общ
    регламент за ООП )
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1234/2007 ze dne 22. října 2007 , kterým se
    stanoví společná organizace zemědělských trhů a zvláštní ustanovení
    pro některé zemědělské produkty ( jednotné nařízení o společné organizaci
    trhů )
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1234/2007 af 22. oktober 2007 om en fælles
    markedsordning for landbrugsprodukter og om særlige bestemmelser for visse landbrugsprodukter
    (fusionsmarkedsordningen)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1234/2007 του Συμβουλίου,
    της 22ας Οκτωβρίου 2007 , για τη θέσπιση κοινής
    οργάνωσης των γεωργικών αγορών και ειδικών
    διατάξεων για ορισμένα γεωργικά προϊόντα (
    Ενιαίος κανονισμός ΚΟΑ )
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1234/2007, 22. oktoober 2007 , millega kehtestatakse
    põllumajandusturgude ühine korraldus ning mis käsitleb teatavate põllumajandustoodete
    erisätteid (ühise turukorralduse ühtne määrus)
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1234/2007, annettu 22 päivänä lokakuuta 2007
    , maatalouden yhteisestä markkinajärjestelystä ja tiettyjä maataloustuotteita
    koskevista erityissäännöksistä (yhteisiä markkinajärjestelyjä koskeva asetus)
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 1234/2007 od 22. listopada 2007. o uspostavljanju
    zajedničke organizacije poljoprivrednih tržišta i o posebnim odredbama za određene
    poljoprivredne proizvode (Uredba o jedinstvenom ZOT-u)
  type: main
- language: hu
  script: Latn
  content: A Tanács 1234/2007/EK rendelete ( 2007. október 22. ) a mezőgazdasági
    piacok közös szervezésének létrehozásáról, valamint egyes mezőgazdasági
    termékekre vonatkozó egyedi rendelkezésekről ( az egységes közös piacszervezésről
    szóló rendelet )
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1234/2007 del Consiglio, del 22 ottobre 2007 , recante
    organizzazione comune dei mercati agricoli e disposizioni specifiche per taluni
    prodotti agricoli (regolamento unico OCM)
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1234/2007 ( 2007. gada 22. oktobris ), ar ko izveido
    lauksaimniecības tirgu kopīgu organizāciju un paredz īpašus noteikumus dažiem
    lauksaimniecības produktiem ( Vienotā TKO regula )
  type: main
- language: lt
  script: Latn
  content: 2007 m. spalio 22 d. Tarybos reglamentas (EB) Nr. 1234/2007, nustatantis
    bendrą žemės ūkio rinkų organizavimą ir konkrečias tam tikriems žemės
    ūkio produktams taikomas nuostatas ( Bendras bendro žemės ūkio rinkų organizavimo
    reglamentas )
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1234/2007 tat- 22 ta' Ottubru 2007 li jistabbilixxi
    organizzazzjoni komuni ta' swieq agrikoli u dwar dispożizzjonijiet speċifiċi
    għal ċerti prodotti agrikoli (Ir-Regolament Waħdieni dwar l-OKS)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1234/2007 van de Raad van 22 oktober 2007 houdende
    een gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen
    voor een aantal landbouwproducten ( Integrale-GMO-verordening )
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1234/2007 z dnia 22 października 2007 r.
    ustanawiające wspólną organizację rynków rolnych oraz przepisy szczegółowe
    dotyczące niektórych produktów rolnych ( rozporządzenie o jednolitej wspólnej
    organizacji rynku )
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1234/2007 do Conselho, de 22 de Outubro de 2007 ,
    que estabelece uma organização comum dos mercados agrícolas e disposições
    específicas para certos produtos agrícolas (Regulamento OCM única )
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1234/2007 al Consiliului din 22 octombrie 2007 de
    instituire a unei organizări comune a piețelor agricole și privind dispoziții
    specifice referitoare la anumite produse agricole ( Regulamentul unic OCP )
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1234/2007 z 22. októbra 2007 o vytvorení spoločnej
    organizácie poľnohospodárskych trhov a o osobitných ustanoveniach pre určité
    poľnohospodárske výrobky (nariadenie o jednotnej spoločnej organizácii trhov)
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1234/2007 z dne 22. oktobra 2007 o vzpostavitvi
    skupne ureditve kmetijskih trgov in o posebnih določbah za nekatere kmetijske
    proizvode ( Uredba o enotni SUT )
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1234/2007 del Consejo, de 22 de octubre de 2007 , por
    el que se crea una organización común de mercados agrícolas y se establecen
    disposiciones específicas para determinados productos agrícolas (Reglamento
    único para las OCM)
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1234/2007 av den 22 oktober 2007 om upprättande
    av en gemensam organisation av jordbruksmarknaderna och om särskilda bestämmelser
    för vissa jordbruksprodukter ( enda förordningen om de gemensamma organisationerna
    av marknaden )
  type: main
