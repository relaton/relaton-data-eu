    ja muna-alan tuotteiden määrän määrittämisestä asetuksen (EY) N:o 1866/95
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2044/2000 della Commissione, del 28 settembre 2000,
