id: EUDecision1992372
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '92/372/EEC: Commission Decision of 30 June 1992 authorizing certain Member
    States to apply intra- Community surveillance to imports originating in third
    countries which have been put into free circulation in the Community and which
    may be the subject of protective measures pursuant to Article 115 of the EEC Treaty
    (Only the Spanish and Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/372/CEE: Décision de la Commission du 30 juin 1992 autorisant certains
    États membres à instaurer une surveillance intracommunautaire des importations
    de produits originaires de pays tiers, mis en libre pratique dans la Communauté,
    susceptibles de faire l''objet de mesures de protection au titre de l''article
    115 du traité CEE (Les textes en langues espagnole et italienne sont les seuls
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 30. Juni 1992 zur Ermächtigung bestimmter
    Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung der
    Einfuhren von aus Drittländern stammenden, in der Gemeinschaft im freien Verkehr
    befindlichen Waren, die Schutzmaßnahmen gemäß Artikel 115 des Vertrages unterworfen
    werden können (Nur der spanische und der italienische Text sind verbindlich)
    (92/372/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 30. juni 1992 om bemyndigelse af visse medlemsstater
    til at indføre tilsyn inden for Fællesskabet med indførsel af produkter, der
    har oprindelse i tredjelande og er overgået til fri omsætning i Fællesskabet,
    og som ville kunne gøres til genstand for beskyttelsesforanstaltninger i henhold
    til Traktatens artikel 115 (Kun de italienske og spanske udgaver er autentiske)
    (92/372/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/372/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
    Ιουνίου 1992 που εξουσιοδοτεί ορισμένα κράτη
    μέλη να θεσπίσουν ενδοκοινοτική επιτήρηση
    των εισαγωγών προϊόντων καταγωγής τρίτων χωρών,
    τα οποία τίθενται σε ελεύθερη κυκλοφορία στην
    Κοινότητα και τα οποία μπορούν να αποτελέσουν
    αντικείμενο μέτρων προστασίας δυνάμει του
    άρθρου 115 της συνθήκης ΕΟΚ'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 30 giugno 1992 che autorizza taluni Stati
    membri ad istituire una sorveglianza intracomunitaria sulle importazioni di prodotti
    originari dei paesi terzi, messi in libera pratica nella Comunità, che possono
    essere oggetto di misure di protezione ai sensi dell'' articolo 115 del trattato
    (I testi in lingua spagnola e italiana sono i soli facenti fede) (92/372/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 30 juni 1992 houdende machtiging van
    bepaalde Lid-Staten om over te gaan tot een intracommunautair toezicht in te stellen
    ten aanzien van de invoer van produkten van oorsprong uit derde landen die in
    de Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn
    van beschermende maatregelen krachtens artikel 115 van het Verdrag (Slechts de
    teksten in de Spaanse en de Italiaanse taal zijn authentiek) (92/372/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 30 de Junho de 1992 que autoriza certos Estados-membros
    a procederem a uma vigilância intracomunitária das importações de produtos
    originários de países terceiros introduzidos em livre prática na Comunidade
    susceptíveis de serem objecto de medidas de protecção ao abrigo do artigo 115o
    do Tratado (Apenas fazem fé os textos nas línguas espanhola e italiana) (92/372/CEE)
    #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 30 de junio de 1992 por la que se autoriza
    a ciertos Estados miembros a establecer medidas de vigilancia intracomunitaria
    en relación con las importaciones de productos originarios de terceros países
    despachados a libre práctica en la Comunidad que pueden ser objeto de medidas
    de protección en virtud de lo dispuesto en el artículo 115 del Tratado (Los
    textos en lengua española e italiana son los únicos auténticos) (92/372/CEE)
    #'
