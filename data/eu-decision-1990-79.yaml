title:
- language: en
  script: Latn
  content: '90/79/EEC: Commission Decision of 16 February 1990 approving the draft
    measures for implementation in Luxembourg of Article 3b of Regulation (EEC) No
    857/84 adopting general rules for the application of the levy referred to in Article
    5c of Regulation (EEC) No 804/68 in the milk and milk products sector (Only the
    French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/79/CEE: Décision de la Commission du 16 février 1990 portant approbation
    du projet de mise en oeuvre au Luxembourg de l''article 3 ter du règlement (CEE)
    n° 857/84 portant règles générales pour l''application du prélèvement visé
    à l''article 5 quater du règlement (CEE) n 804/68 dans le secteur du lait et
    des produit laitiers (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/79/EWG: Entscheidung der Kommission vom 16. Februar 1990 zur Genehmigung
    des Entwurfs für die Anwendung von Artikel 3b der Verordnung (EWG) Nr. 857/84
    ueber Grundregeln für die Anwendung der Abgabe gemäß Artikel 5c der Verordnung
    (EWG) Nr. 804/68 im Sektor Milch und Milcherzeugnisse in Luxemburg (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/79/EØF: Kommissionens beslutning af 16. februar 1990 om godkendelse
    af et udkast til ivaerksaettelse i Luxembourg af artikel 3b i forordning (EØF)
    nr. 857/84 om almindelige regler for anvendelsen af den i artikel 5c i forordning
    (EØF) nr. 804/68 omhandlede afgift paa maelk og mejeriprodukter (Kun den franske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
