  type: main
- language: it
  script: Latn
  content: '90/79/CEE: Decisione della Commissione del 16 febbraio 1990 che approva
    il progetto presentato dal Lussemburgo relativamente all''applicazione dell''articolo
    3 del regolamento (CEE) n. 857/84 che fissa le norme generali per l''applicazione
    del prelievo di cui all''articolo 5 quater del regolamento (CEE) n. 804/68 nel
    settore del latte e dei prodotti lattiero-caseari (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/79/EEG: Beschikking van de Commissie van 16 februari 1990 tot goedkeuring
