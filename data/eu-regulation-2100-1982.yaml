    d' ananas ainsi que le prix minimal à payer aux producteurs d' ananas
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2100/82 des Rates vom 28. Juli 1982 zur Festsetzung
    der Beihilfe für die Erzeugung von Ananaskonserven und des den Ananaserzeugern
    zu zahlenden Mindestpreises für das Wirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2100/82 af 28. juli 1982 om fastsættelse
    for produktionsåret 1982/83 af producentstøtten til ananaskonserves samt den
    minimumspris, der skal betales til ananasproducenterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2100/82 τού Συμβουλίου
