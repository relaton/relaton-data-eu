  content: Council Regulation (EEC) No 2100/82 of 28 July 1982 fixing, for the 1982/83
    marketing year, the production aid for tinned pineapple and the minimum price
    to be paid to pineapple producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2100/82 du Conseil, du 28 juillet 1982, fixant, pour
