title:
- language: en
  script: Latn
  content: '95/115/EC: Council Decision of 30 March 1995 authorizing the Federal Republic
    of Germany to conclude with the Republic of Poland an agreement containing measures
    derogating from Articles 2 and 3 of the Sixth Directive 77/388/EEC on the harmonization
    of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '95/115/CE: Décision du Conseil du 30 mars 1995 autorisant la République
    fédérale d''Allemagne à conclure un accord avec la République de Pologne contenant
    des dispositions dérogatoires aux articles 2 et 3 de la sixième directive (77/388/CEE)
    en matière d''harmonisation des législations des États membres relatives aux
    taxes sur le chiffre d''affaires.'
  type: main
- language: de
  script: Latn
