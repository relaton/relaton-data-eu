title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1201/77 of 3 June 1977 regarding the application
    of Decision 2/77 of the ACP-EEC Council of Ministers derogating from the concept
    of 'originating products' to take into account the special situation of Kenya
    with regard to certain items of fishing tackle (fishing flies)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1201/77 du Conseil, du 3 juin 1977, concernant l'application
    de la décision n° 2/77 du Conseil des ministres ACP-CEE portant dérogation
    à la notion de produits originaires, pour tenir compte de la situation particulière
    du Kenya, en ce qui concerne certains articles de pêche (mouches pour la pêche)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1201/77 des Rates vom 3. Juni 1977 betreffend die
    Durchführung des Beschlusses Nr. 2/77 des AKP - EWG-Ministerrats über die Abweichung
    vom Begriff "Ursprungswaren", um der besonderen Lage der Republik Kenia in bezug
    auf bestimmte Angelgeräte (künstliche Fliegen zum Flugangeln) Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1201/77 af 3. juni 1977 vedrørende anvendelsen
    af afgørelse nr. 2/77 truffet af AVS-EØF-Ministerrådet om undtagelse fra begrebet
    »varer med oprindelsesstatus« for at tage hensyn til den særlige situation
    i republikken Kenya for så vidt angår visse typer fiskegrej (fluer til fiskeri)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1201/77 del Consiglio, del 3 giugno 1977, concernente
    l'applicazione della decisione n. 2/77 del Consiglio dei ministri ACP-CEE, che
    deroga alla nozione di prodotti originari per tener conto della situazione particolare
    del Kenia per quanto riguarda taluni articoli da pesca (mosche per la pesca)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1201/77 van de Raad van 3 juni 1977 betreffende de
    toepassing van Besluit nr. 2/77 van de ACS-EEG-Raad van Ministers, houdende afwijking
    van de definitie van het begrip "produkten van oorsprong" in verband met de bijzondere
    situatie van Kenya voor wat betreft bepaalde visserijartikelen (vliegen voor de
    visserij)
  type: main
