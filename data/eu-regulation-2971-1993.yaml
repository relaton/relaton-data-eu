    in China, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2971/93 af 28. oktober 1993 om genindførelse
    af opkrævning af told for varer under kategori 35 (løbenummer 40.0350), som
    har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
