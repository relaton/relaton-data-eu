  script: Latn
  content: COMMISSION REGULATION (EEC) No 2971/93 of 28 October 1993 re-establishing
    the levying of customs duties on products of category 35 (order No 40.0350), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2971/93 de la Commission du 28 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 35 (numéro d'ordre 40.0350) originaires de Chine, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
