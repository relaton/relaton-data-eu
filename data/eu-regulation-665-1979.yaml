title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 665/79 of 4 April 1979 re-establishing the
    levying of customs duties on woven fabrics of regenerated textile fibres, falling
    within subheading 56.07 B and originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 665/79 de la Commission, du 4 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles artificielles, de la sous-position 56.07 B du tarif douanier commun,
    originaires de la Thaïlande, bénéficiaire des préférences prévues par le
    règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 665/79 der Kommission vom 4. April 1979 über die
    Wiedereinführung des Zollsatzes für Gewebe aus künstlichen Spinnfasern der
    Tarifstelle 56.07 B, mit Ursprung in Thailand, dem die in der Verordnung (EWG)
    Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 665/79 af 4. april 1979 om genindførelse
    af opkrævning af toldafgifter for vævet stof af regenererede fibre, under underposition
    56.07 B, som har oprindelse i Thailand og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 665/79 della Commissione, del 4 aprile 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili artificiali
    della sottovoce doganale 56.07 B, originari della Tailandia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 665/79 van de Commissie van 4 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van kunstmatige vezels, van post 56.07 B, van oorsprong uit Thailand, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3157/78
    van de Raad
  type: main
