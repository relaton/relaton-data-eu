title:
- language: en
  script: Latn
  content: Regulation (EEC) No 526/72 of the Commission of 14 March 1972 on a derogation
    from Regulation (EEC) No 1411/71 as regards the fat content of semi-skimmed and
    skimmed milk and the payment varying according to quality for milk used for making
    drinking milk
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 526/72 de la Commission, du 14 mars 1972, dérogeant
    aux dispositions du règlement (CEE) n° 1411/71, notamment en ce qui concerne
    la teneur en matière grasse des laits demi-écrémé et écrémé ainsi que le
    paiement différencié du lait utilisé pour la fabrication du lait de consommation
    selon la qualité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 526/72 der Kommission vom 14. März 1972 zur Abweichung
    von der Verordnung (EWG) Nr. 1411/71, insbesondere hinsichtlich des Fettgehalts
    von teilentrahmter und entrahmter Milch sowie der Bezahlung der für die Herstellung
    von Konsummilch verwendeten Milch nach der Qualität
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 526/72 af 14. marts 1972 om undtagelser
    fra bestemmelserne i forordning (EØF) nr. 1411/71, særlig for så vidt angår
    fedtindholdet i delvis skummetmælk og skummetmælk samt betaling efter kvalitet
    af den mælk, der anvendes til fremstilling af konsummælk
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 526/72 della Commissione, del 14 marzo 1972, che deroga
    alle disposizioni del regolamento (CEE) n. 1411/71, in particolare per quanto
    riguarda il tenore di materia grassa del latte parzialmente scremato e scremato
    nonché il pagamento differenziato secondo la qualità del latte utilizzato per
    la fabbricazione di latte alimentare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 526/72 van de Commissie van 14 maart 1972 houdende
    afwijking van het bepaalde in Verordening (EEG) nr. 1411/71, met name met betrekking
    tot het vetgehalte van halfvolle en magere melk en de naar kwaliteit gedifferentieerde
    betaling van de voor de bereiding van consumptiemelk gebruikte melk
  type: main
