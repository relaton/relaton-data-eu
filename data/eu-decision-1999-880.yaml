---
id: EUDecision1999880
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/880/EC: Council Decision of 17 December 1999 authorising Member States
    to apply and to continue to apply to certain mineral oils, when used for specific
    purposes, existing reduced rates of excise duty or exemptions from excise duty,
    in accordance with the procedure provided for in Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '1999/880/CE: Décision du Conseil, du 17 décembre 1999, autorisant les
    États membres à appliquer ou à continuer à appliquer à certaines huiles minérales
    utilisées à des fins spécifiques les réductions de taux d''accise ou les exonérations
    d''accises existantes, conformément à la procédure prévue à la directive
    92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '1999/880/EG: Entscheidung des Rates vom 17. Dezember 1999 zur Ermächtigung
    bestimmter Mitgliedstaaten, gemäß dem Verfahren der Richtlinie 92/81/EWG ermäßigte
    Verbrauchsteuersätze oder Verbrauchsteuerbefreiungen für Mineralöle mit bestimmten
    Verwendungszwecken anzuwenden und beizubehalten'
  type: main
- language: da
  script: Latn
  content: '1999/880/EF: Rådets beslutning af 17. december 1999 om bemyndigelse af
    medlemsstaterne til at anvende eller fortsat anvende de gældende punktafgiftsnedsættelser
    eller -fritagelser for visse typer mineralolie, når disse benyttes til særlige
    formål, i overensstemmelse med proceduren i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '1999/880/ΕΚ: Απόφαση του Συμβουλίου, της 17ης
    Δεκεμβρίου 1999, για την εξουσιοδότηση κρατών
    μελών να εφαρμόσουν και να εξακολουθήσουν
    να εφαρμόζουν σε ορισμένα πετρελαιοειδή, όταν
    χρησιμοποιούνται για συγκεκριμένους σκοπούς,
    τους ισχύοντες μειωμένους συντελεστές του
    ειδικού φόρου κατανάλωσης ή τις απαλλαγές
    από τον ειδικό φόρο κατανάλωσης, σύμφωνα με
    τη διαδικασία που προβλέπεται στην οδηγία
    92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '1999/880/EY: Neuvoston päätös, tehty 17 päivänä joulukuuta 1999,
    luvan antamisesta jäsenvaltioille soveltaa tai edelleen soveltaa tiettyihin erityistarkoituksiin
    käytettyihin kivennäisöljyihin valmisteveron alennuksia tai vapautuksia valmisteverosta
    direktiivissä 92/81/ETY säädetyn menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: '1999/880/CE: Decisione del Consiglio, del 17 dicembre 1999, che autorizza
    gli Stati membri a continuare ad applicare a determinati oli minerali utilizzati
    per fini specifici le già esistenti riduzioni delle aliquote d''accisa o esenzioni
    dall''accisa, secondo la procedura di cui alla direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '1999/880/EG: Beschikking van de Raad van 17 december 1999 waarbij de lidstaten
    toestemming wordt verleend de voor bepaalde, voor specifieke doeleinden gebruikte
    minerale oliën bestaande verlagingen of vrijstellingen van het accijnsrecht toe
    te passen of te blijven toepassen overeenkomstig de procedure van Richtlijn 92/81/EEG'
  type: main
- language: pt
  script: Latn
  content: '1999/880/CE: Decisão do Conselho, de 17 de Dezembro de 1999, que autoriza
    os Estados-Membros a aplicar, ou a continuar a aplicar, a certos óleos minerais,
    quando utilizados para fins específicos, as actuais taxas reduzidas ou isenções
    do imposto especial de consumo, nos termos da Directiva 92/81/CE'
  type: main
- language: es
  script: Latn
  content: '1999/880/CE: Decisión del Consejo, de 17 de diciembre de 1999, por la
    que se autoriza a los Estados miembros a aplicar y a continuar aplicando a determinados
    hidrocarburos, cuando se utilicen para fines específicos, las exenciones o reducciones
    de tipos del impuesto especial vigentes, de conformidad con el procedimiento previsto
    en la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '1999/880/EG: Rådets beslut av den 17 december 1999 om tillåtelse för
    medlemsstaterna att i enlighet med det förfarande som föreskrivs i direktiv
    92/81/EEG för vissa mineraloljor, när dessa används för särskilda ändamål,
    tillämpa eller fortsätta tillämpa gällande nedsättning av eller befrielse
    från punktskatt'
  type: main
