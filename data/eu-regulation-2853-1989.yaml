title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2853/89 of 22 September 1989 re-establishing
    the levying of customs duties on other made-up textile articles, woven, products
    of category 112 (order No 40.1120), originating in Hong Kong to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2853/89 de la Commission du 22 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, de la catégorie de produits 112 (numéro d'ordre 40.1120)
    originaires de Hong-kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2853/89 DER KOMMISSION vom 22. September 1989 zur
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben
    der Warenkategorie Nr. 112 (lfd. Nr. 40.1120) mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2853/89 af 22. september 1989 om genindførelse
    af opkrævning af toldafgifter for andre varer fremstillet af tekstilstoffer,
    under varekategori nr. 112 (løbenummer 40.1120), som har oprindelse i Hongkong
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2853/89 της Επιτροπής
    της 22ας Σεπτεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για άλλα
    είδη έτοιμα από υφάσματα, της κατηγορίας προϊόντων
    αριθ. 112 ( αύξων αριθμός 40.1120 ), καταγωγής Χονγκ
    Κονγκ, δικαιούχου των προβλεπόμενων από τον
    κανονισμό (ΕΟΚ) αριθ. 4259/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2853/89 DELLA COMMISSIONE del 22 settembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili ad altri manufatti confezionati
    di tessuti, della categoria di prodotti n. 112 (numero d'' ordine 40.1120), originari
    di Hong Kong beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 4259/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2853/89 VAN DE COMMISSIE van 22 september 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen, van weefsels, van de categorie van produkten nr. 112 (volgnummer 40.1120),
    van oorsprong uit Hong-Kong, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 4259/88 van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2853/89 DA COMISSÃO de 22 de Setembro de 1989 que
