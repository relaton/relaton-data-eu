title:
- language: en
  script: Latn
  content: '91/428/EEC: Commission Decision of 26 July 1991 approving measures to
    set up pilot projects for the control of rabies with a view to its eradication
    or prevention presented by the Kingdom of Belgium (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/428/CEE: Décision de la Commission, du 26 juillet 1991, approuvant
    des actions visant à l''établissement de projets pilotes destinés à lutter
    contre la rage en vue de son éradication ou de sa prévention présentés par
    la Belgique (Les textes en langues française et néerlandaise sont les seuls
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '91/428/EWG: Entscheidung der Kommission vom 26. Juli 1991 zur Genehmigung
    von Maßnahmen zur Aufstellung der von Belgien vorgelegten Pilotprogramme zur
    Tilgung oder Verhütung der Tollwut (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/428/EØF: Kommissionens beslutning af 26. juli 1991 om godkendelse
    af foranstaltninger til iværksættelse af pilotprojekter til bekæmpelse af rabies
    med henblik på udryddelse eller forebyggelse heraf, forelagt af Belgien (Kun
    den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '91/428/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Ιουλίου 1991 για την έγκριση δράσεων εκπόνησης
    πρότυπων σχεδίων καταπολέμησης της λύσσας
    με σκοπό την εξάλειψη ή την πρόληψή της, που
    υποβλήθηκε από το Βέλγιο (Τα κείμενα στην γαλλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '91/428/CEE: Decisione della Commissione, del 26 luglio 1991, recante approvazione
    di progetti pilota di lotta contro la rabbia, presentati dal Belgio ai fini dell''eradicazione
    e della prevenzione di tale malattia (I testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '91/428/EEG: Beschikking van de Commissie van 26 juli 1991 houdende goedkeuring
