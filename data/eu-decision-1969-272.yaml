title:
- language: en
  script: Latn
  content: "/* 69/272/EEC: Commission Decision of 28 July 1969 exempting the Grand-Duchy of Luxembourg from applying to certain species the Council Directives of 14 June 1966 on the marketing of fodder plant seed and cereal seed */ (Only the French text is authentic)"
  type: main
- language: fr
  script: Latn
  content: '69/272/CEE: Décision de la Commission, du 28 juillet 1969, dispensant
    le grand-duché de Luxembourg d''appliquer, à certaines espèces, les directives
    du Conseil, du 14 juin 1966, concernant la commercialisation des semences de plantes
    fourragères et de céréales (Le texte en langue française est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '69/272/EWG: Entscheidung der Kommission vom 28. Juli 1969 über die Entbindung
    des Großherzogtums Luxemburg von der Verpflichtung, die Richtlinien des Rates
    vom 14. Juni 1966 über den Verkehr mit Futterpflanzensaatgut und Getreidesaatgut
    hinsichtlich einiger Arten anzuwenden (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: "/* 69/272/EØF: Kommissionens beslutning af 28. juli 1969 om fritagelse af storhertugdømmet Luxembourg for, for visse arter, at anvende Rådets direktiver af 14. juni 1966 om handel med frø af foderplanter og sædekorn */ (Kun den franske udgave er autentisk)"
  type: main
- language: el
  script: Grek
  content: '69/272/ΕΟΚ: Απόφαση της Επιτροπής, της 28ης
    Ιουλίου 1969, περί απαλλαγής του Μεγάλου Δουκάτου
    του Λουξεμβούργου από την εφαρμογή για ορισμένα
    είδη, των οδηγιών του Συμβουλίου της 14ης Ιουνίου
    1966, περί εμπορίας σπόρων φυτών παραγωγής ζωοτροφών
    και δημητριακών (Το κείμενο στη γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '69/272/CEE: Decisione della Commissione, del 28 luglio 1969, che dispensa
    il Granducato del Lussemburgo dall''applicazione per certe specie, delle direttive
    del Consiglio del 14 giugno 1966 relative alla commercializzazione delle sementi
    di piante foraggere e di cereali (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '69/272/EEG: Beschikking van de Commissie van 28 juli 1969 tot ontheffing
    van het Groothertogdom Luxemburg van de toepassing ten aanzien van bepaalde gewassen
    van de richtlijnen van de Raad d.d. 14 juni 1966 betreffende het in de handel
    brengen van zaaizaad van groenvoedergewassen en van zaaigranen (Slechts de tekst
    in de Franse taal is authentiek)'
