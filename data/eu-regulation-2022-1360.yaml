    по-пропорционални изисквания за въздухоплавателните
    средства, използвани за спортно и развлекателно
    въздухоплаване
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1360 ze dne 28. července 2022,
