  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1360 of 28 July 2022 amending
    Regulation (EU) No 1321/2014 as regards the implementation of more proportionate
    requirements for aircraft used for sport and recreational aviation
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1360 de la Commission du 28 juillet
    2022 modifiant le règlement (UE) no 1321/2014 en ce qui concerne la mise en œuvre
    d’exigences plus proportionnées pour les aéronefs utilisés pour l’aviation
    sportive et de loisir
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1360 der Kommission vom 28. Juli 2022
    zur Änderung der Verordnung (EU) Nr. 1321/2014 im Hinblick auf die Umsetzung
    angemessenerer Anforderungen an Luftfahrzeuge, die im Flugsport und in der Freizeitluftfahrt
    eingesetzt werden
  type: main
