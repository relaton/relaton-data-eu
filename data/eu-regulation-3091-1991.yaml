title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3091/91 of 21 October 1991 imposing a definitive
    anti-dumping duty on imports of video tapes in cassettes originating in the People's
    Republic of China and definitively collecting the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3091/91 du Conseil, du 21 octobre 1991, instituant
    un droit antidumping définitif sur les importations de bandes vidéo en cassettes
    originaires de la République populaire de Chine et portant perception définitive
    du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3091/91 des Rates vom 21. Oktober 1991 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Videokassetten mit Ursprung
    in der Volksrepublik China und zur endgültigen Vereinnahmung des vorläufigen
    Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3091/91 af 21. oktober 1991 om indførelse
    af en endelig antidumpingtold på importen af videobånd i kassetter med oprindelse
    i Den Kinesiske Folkerepublik og om endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3091/91 του Συμβουλίου
    της 21ης Οκτωβρίου 1991 περί επιβολής οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές βιντεοταινιών
    σε κασέτες, καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας, και περί της οριστικής είσπραξης του
    προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3091/91, annettu 21 päivänä lokakuuta 1991,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta
    peräisin olevien videonauhakasettien tuonnissa ja väliaikaisen tullin lopullisesta
    kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3091/91 del Consiglio, del 21 ottobre 1991, che istituisce
    un dazio antidumping definitivo sulle importazioni di nastri in cassette per videoregistrazioni
    originari della Repubblica popolare cinese e stabilisce la riscossione definitiva
    del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3091/91 van de Raad van 21 oktober 1991 tot instelling
    van een definitief anti-dumpingrecht op de invoer van videobanden in cassettes
    van oorsprong uit de Volksrepubliek China en tot definitieve inning van het voorlopige
    recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3091/91 do Conselho, de 21 de Outubro de 1991, que
    cria um direito anti-dumping definitivo sobre as importações de fitas vídeo
    em cassetes vídeo originárias da República Popular da China e que institui
    a cobrança definitiva do direito provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3091/91 del Consejo, de 21 de octubre de 1991, por
    el que se establece un derecho antidumping definitivo sobre las importaciones
    de cintas de vídeo en casetes originarias de la República Popular China y por
    el que se recauda de manera definitiva el derecho provisional
  type: main
- language: sv
