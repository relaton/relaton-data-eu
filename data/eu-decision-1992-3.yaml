    existentes en el mercado de la antigua República Democrática Alemana con anterioridad
    al 18 de septiembre de 1981 y que no figuran en el inventario previsto en el artículo
    13 de la Directiva 67/548/CEE (El texto en lengua alemana es el único auténtico)'
