title:
- language: en
  script: Latn
  content: '92/3/EEC: Commission Decision of 9 December 1991 establishing the conditions
    governing the notification of chemical substances existing on the market of the
    former German Democratic Republic prior to 18 September 1981 which do not appear
    on the inventory provided for in Article 13 of Directive 67/548/EEC (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/3/CEE: Décision de la Commission, du 9 décembre 1991, établissant
    les conditions régissant la notification des substances chimiques qui existaient
    sur le marché de l''ancienne République démocratique allemande avant le 18
    septembre 1981 et qui n''apparaissent pas dans l''inventaire prévu à l''article
    13 de la directive 67/548/CEE (Le texte en langue allemande est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '92/3/EWG: Entscheidung der Kommission vom 9. Dezember 1991 zur Festlegung
    der Bedingungen für die Notifikation der zum 18. September 1981 in der früheren
    deutschen demokratischen Republik im Verkehr befindlichen Chemikalien, die nicht
    im Verzeichnis nach Artikel 13 der Richtlinie 67/548/EWG stehen (Nur der deutsche
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/3/EØF: Kommissionens beslutning af 9. december 1991 om betingelserne
    for anmeldelse af kemiske stoffer, der fandtes på markedet i den tidligere Tyske
    Demokratiske Republik før den 18. september 1981, og som ikke er opført i den
    fortegnelse, der er omhandlet i artikel 13 i direktiv 67/548/EØF (Kun den tyske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/3/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Δεκεμβρίου
    1991 που καθορίζει τις συνθήκες που διέπουν την
    κοινοποίηση χημικών ουσιών που διατίθενται
    στην αγορά της πρώην Λαοκρατικής Δημοκρατίας
    της Γερμανίας πριν από την 18η Σεπτεμβρίου 1981,
    οι οποίες δεν αναγράφονται στο ευρετήριο που
    προβλέπει το άρθρο 13 της οδηγίας 67/548/ΕΟΚ (Το
    κείμενο στη γερμανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '92/3/CEE: Decisione della Commissione, del 9 dicembre 1991, che stabilisce
    le condizioni per la notifica delle sostanze chimiche esistenti sul mercato dell''ex
    Repubblica democratica tedesca anteriormente al 18 settembre 1981 che non sono
    contemplate nell''elenco previsto all''articolo 13 della direttiva 67/548/CEE
    (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '92/3/EEG: Beschikking van de Commissie van 9 december 1991 tot vaststelling
    van de voorwaarden voor de kennisgeving van chemische stoffen die vóór 18 september
    1981 in de voormalige Duitse Democratische Republiek in de handel waren en niet
    voorkomen in de in artikel 13 van Richtlijn 67/548/EEG bedoelde inventaris (Slechts
    de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/3/CEE: Decisão da Comissão, de 9 de Dezembro de 1991, que estabelece
    as condições que regulam a notificação das substâncias químicas existentes
    no mercado da antiga República Democrática Alemã anteriormente a 18 de Setembro
    de 1981 e que não constam do inventário previsto no artigo 13º da Directiva
    67/548/CEE (Apenas faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '92/3/CEE: Decisión de la Comisión, de 9 de diciembre de 1991, por la
