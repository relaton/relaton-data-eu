    relativi ad animali vivi e prodotti di origine animale provenienti da paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '95/157/EG: BESCHIKKING VAN DE COMMISSIE van 21 april 1995 tot vaststelling
