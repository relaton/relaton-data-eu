  script: Latn
  content: '95/157/EC: Commission Decision of 21 April 1995 laying down the transitional
    measures to be applied by Sweden with regard to veterinary checks on live animals
    entering Sweden from third countries'
  type: main
- language: fr
  script: Latn
  content: '95/157/CE: Décision de la Commission du 21 avril 1995 établissant les
    mesures transitoires à mettre en oeuvre par la Suède pour les contrôles vétérinaires
    des animaux vivants et des produits animaux en provenance des pays tiers'
  type: main
- language: de
  script: Latn
  content: '95/157/EG: ENTSCHEIDUNG DER KOMMISSION vom 21. April 1995 über die von
    Schweden anzuwendenden Übergangsmaßnahmen betreffend die Veterinärkontrollen
    bei der Einfuhr lebender Tiere und tierischer Erzeugnisse aus Drittländern'
  type: main
- language: da
  script: Latn
  content: '95/157/EF: KOMMISSIONENS BESLUTNING af 21. april 1995 om de overgangsforanstaltninger,
