    που πρέπει να εφαρμόζονται από τη Σουηδία σε
    θέματα κτηνιατρικών ελέγχων για τα ζώντα ζώα
    προέλευσης τρίτων χωρών'
  type: main
- language: fi
  script: Latn
  content: '95/157/EY: Komission päätös, tehty 21 päivänä huhtikuuta 1995, Ruotsissa
