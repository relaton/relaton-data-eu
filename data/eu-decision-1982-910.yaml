    of the supplementary measures established in favour of the United Kingdom (Wales,
    north-west of England, north of England, Scotland, south-west of England, Yorkshire
    and Humberside, Northern Ireland and the special programme for road investment)
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/910/CEE: Décision de la Commission, du 14 décembre 1982, modifiant
    les décisions de la Commission du 24 mars 1982 octroyant une assistance financière
    dans le cadre des mesures supplémentaires instituées en faveur du Royaume-Uni
    (pays de Galles, nord-ouest de l''Angleterre, nord de l''Angleterre, Écosse,
    sud-ouest de l''Angleterre, Yorkshire et Humberside, Irlande du Nord et le programme
