    της μη εμπορίας γάλακτος και γαλακτοκομικών
    προϊόντων και μετατροπής των αγελών βοοειδών
    γαλακτοκομικής κατευθύνσεως (Το κείμενο στην
    ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '77/433/CEE: Decisione della Commissione, del 15 giugno 1977, che autorizza
