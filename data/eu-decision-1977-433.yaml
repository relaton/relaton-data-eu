title:
- language: en
  script: Latn
  content: '77/433/EEC: Commission Decision of 15 June 1977 authorizing the Italian
    Republic not to apply the premium system for the non-marketing of milk and milk
    products and the conversion of dairy herds (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '77/433/CEE: Décision de la Commission, du 15 juin 1977, autorisant la
    République italienne à ne pas mettre en application le régime des primes de
    non-commercialisation du lait et des produits laitiers et de reconversion de troupeaux
    bovins à orientation laitière (Le texte en langue italienne est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '77/433/EWG: Entscheidung der Kommission vom 15. Juni 1977 zur Ermächtigung
    der Italienischen Republik, die Prämienregelung für die Nichtvermarktung von
    Milch und Milcherzeugnissen und die Umstellung der Milchkuhbestände nicht anzuwenden
    (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '77/433/EØF: Kommissionens Beslutning af 15. juni 1977 om bemyndigelse
    af Den Italienske Republik til ikke at anvende præmieordningen for ikke markedsføring
    af mælk og mejeriprodukter og for omstilling af malkekvægsbesætninger (Kun
    den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '77/433/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Ιουνίου 1977 που επιτρέπει στην Ιταλική Δημοκρατία
