    der Verordnungen (EG) Nr. 809/2003 und (EG) Nr. 810/2003 hinsichtlich der Verlängerung
    der Gültigkeit der Übergangsmaßnahmen für Kompostier- und Biogasanlagen gemäß
    der Verordnung (EG) Nr. 1774/2002 des Europäischen Parlaments und des Rates
  type: main
