title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 12/2005 of 6 January 2005 amending Regulations
    (EC) No 809/2003 and (EC) No 810/2003 as regards the extension of the validity
    of the transitional measures for composting and biogas plants under Regulation
    (EC) No 1774/2002 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
