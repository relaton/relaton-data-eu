    rekening te houden met de voorschriften in Richtlĳn 92/46/EEG van de Raad tot
    vaststelling van de gezondheidsvoorschriften voor de productie en het in de handel
    brengen van rauwe melk, warmtebehandelde melk en producten op basis van melk
  type: main
