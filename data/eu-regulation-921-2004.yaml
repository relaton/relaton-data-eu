    jingħata kont tad-Direttiva tal-Kunsill 92/46/KEE li tippreskrivi r-regoli ta'
    saħħa għall-produzzjoni u t-tqegħid fis-suq ta' ħalib mhux maħdum, ħalib
    ittrattat bis-sħana u prodotti bażati fuq il-ħalib
  type: main
