title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 921/2004 of 29 April 2004 amending Regulations
    (EEC) No 2191/81, (EEC) No 429/90 and (EC) No 2571/97 to take account of the requirements
    of Council Directive 92/46/EEC laying down the health rules for the production
    and placing on the market of raw milk, heat-treated milk and milk-based products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 921/2004 de la Commission du 29 avril 2004 modifiant
    les règlements (CEE) n° 2191/81, (CEE) n° 429/90 et (CE) n° 2571/97 afin de
    tenir compte des exigences de la directive 92/46/CEE du Conseil arrêtant les
    règles sanitaires pour la production et la mise sur le marché de lait cru, de
    lait traité thermiquement et de produits à base de lait
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 921/2004 der Kommission vom 29. April 2004 zur Änderung
    der Verordnungen (EWG) Nr. 2191/81, (EWG) Nr. 429/90 und (EG) Nr. 2571/97 zur
    Berücksichtigung der Anforderungen der Richtlinie 92/46/EWG des Rates mit Hygienevorschriften
    für die Herstellung und Vermarktung von Rohmilch, wärmebehandelter Milch und
    Erzeugnissen auf Milchbasis
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 921/2004 на Комисията от 29
