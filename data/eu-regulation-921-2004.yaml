    (ЕИО) № 2191/81, (ЕИО) № 429/90 и (ЕО) № 2571/97, за да се
    вземат предвид изискванията на Директива 92/46/ЕИО
    на Съвета за определяне на санитарните правила
    при производството и пускането на пазара на
    сурово мляко, топлинно обработено мляко и продукти
    на млечна основа
  type: main
- language: cs
