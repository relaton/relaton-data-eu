    zahtjevi iz Direktive Vijeća 92/46/EEZ o utvrđivanju zdravstvenih pravila za
    proizvodnju i stavljanje na tržište sirovog mlijeka, toplinski obrađenog mlijeka
    i proizvoda na bazi mlijeka
  type: main
- language: hu
  script: Latn
  content: A Bizottság 921/2004/EK rendelete (2004. április 29.) a nyerstej, a hőkezelt
    tej és a tejalapú termékek előállítására és forgalomba hozatalára vonatkozó
    egészségügyi előírások megállapításáról szóló 92/46/EGK tanácsi
    irányelv követelményeinek figyelembevétele érdekében a 2191/81/EGK, a 429/90/EGK
    és a 2571/97/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 921/2004 della Commissione, del 29 aprile 2004, recante
    modifica dei regolamenti (CEE) n. 2191/81, (CEE) n. 429/90 e (CE) n. 2571/97 per
    tenere conto delle disposizioni della direttiva 92/46/CEE del Consiglio, che stabilisce
    le norme sanitarie per la produzione e la commercializzazione di latte crudo,
    di latte trattato termicamente e di prodotti a base di latte
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 921/2004 (2004. gada 29. aprīlis), ar ko groza
    Regulas (EEK) Nr. 2191/81, (EEK) Nr. 429/90 un (EK) Nr. 2571/97, ņemot vērā
    prasības Padomes Direktīvā 92/46/EEK, ar ko paredz veselības noteikumus attiecībā
    uz svaigpiena, termiski apstrādāta piena un piena produktu ražošanu un laišanu
    tirgū
  type: main
- language: lt
  script: Latn
  content: 2004 m. balandžio 29 d. Komisijos reglamentas (EB) Nr. 921/2004, iš dalies
