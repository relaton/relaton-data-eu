    (EB) Nr. 2571/97 atsižvelgiant į Tarybos direktyvos 92/46/EEB, nustatančios
    sveikatos taisykles žalio pieno, termiškai apdoroto pieno ir pieno pagrindo
    produktų gamybai ir tiekimui į rinką, reikalavimus
  type: main
