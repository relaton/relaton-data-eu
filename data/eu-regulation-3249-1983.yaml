title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3249/83 of 16 November 1983 fixing for the
    1983/84 marketing year the minimum price payable to producers, the production
    aid and the storage aid, together with the coefficients applicable to the minimum
    price and the storage aid and to the production aid for dried grapes and dried
    figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3249/83 de la Commission du 16 novembre 1983 fixant,
    pour la campagne 1983/1984 pour les raisins secs et les figues sèches, le prix
    minimal à payer aux producteurs, les montants de l' aide à la production et
    de l' aide au stockage ainsi que les coefficients à appliquer au prix minimal
    et à l' aide au stockage ainsi qu' à l' aide à la production
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3249/83 der Kommission vom 16. November 1983 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises, der Beträge der Produktionsbeihilfe
    und der Lagerhaltungsbeihilfe sowie der auf den Mindestpreis, die Lagerhaltungsbeihilfe
    und die Produktionsbeihilfe anzuwendenden Koeffizienten für getrocknete Weintrauben
    und getrocknete Feigen für das Wirtschaftsjahr 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3249/83 af 16. november 1983 om fastsættelse
    for produktionsåret 1983/84 af minimumsprisen, til producenterne, af producentstøtten
    og oplagringsstøtten samt af de koefficienter, der skal anvendes på minimumsprisen
    og oplagringsstøtten samt på producentstøtten for tørrede druer og tørrede
    figner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3249/83 της Επιτροπής
    της 16ης Νοεμβρίου 1983 για καθορισμό, για την
    περίοδο εμπορίας 1983/84, της ελάχιστης τιμής
    που καταβάλλεται στους παραγωγούς, των ποσών
    της ενίσχυσης στην παραγωγή, του ποσού της
    ενίσχυσης στην αποθεματοποίηση καθώς και των
    συντελεστών που πρέπει να εφαρμόζονται στην
    ελάχιστη τιμή, στην ενίσχυση στην αποθεματοποίηση
    και στην ενίσχυση στην παραγωγή, για τις σταφίδες
    και τα ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3249/83 della Commissione del 16 novembre 1983 che
    fissa, per la campagna 1983/1984, il prezzo minimo da pagare ai produttori, l'
    importo dell' aiuto alla produzione e dell' aiuto all' ammasso, nonché i coefficienti
    da applicare al prezzo minimo, all' aiuto all' ammasso ed all' aiuto alla produzione,
    per l' uva secca ed i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3249/83 van de Commissie van 16 november 1983 tot
    vaststelling voor het verkoopseizoen 1983/1984 voor rozijnen en krenten en gedroogde
    vijgen van de aan de producenten te betalen minimumprijs, de bedragen van de produktiesteun
    en de steun bij opslag alsmede van de coëfficiënten die op de minimumprijs en
    op de bedragen van de produktiesteun en de steun bij opslag moeten worden toegepast
