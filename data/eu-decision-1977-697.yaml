title:
- language: en
  script: Latn
  content: Commission Decision of 3 November 1977 on the granting by the Guidance
    Section of the EAGGF to the Kingdom of Denmark of a payment on account in respect
    of expenditure incurred during 1976 on aids and premiums relating to the modernization
    of farms
  type: main
- language: fr
  script: Latn
  content: '77/697/CEE: Décision de la Commission, du 3 novembre 1977, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume du Danemark, d''un acompte sur les dépenses
    effectuées, pendant l''année 1976, pour les aides et primes relatives à la
    modernisation des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. November 1977 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1976 zur Modernisierung
    landwirtschaftlicher Betriebe an Beihilfen und Prämien getätigten Ausgaben an
    das Königreich Dänemark
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. november 1977 om udbetaling gennem EUGFL,
    udviklingssektionen til kongeriget Danmark af et acontobeløb for de udgifter,
    som er afholdt i løbet af året 1976 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 novembre 1977, relativa al versamento
    da parte del FEAOG, sezione orientamento, al Regno di Danimarca di un anticipo
    sulle spese effettuate durante il 1976 per gli aiuti ed i premi relativi all'ammodernamento
    delle aziende agricole
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 november 1977 inzake de betaling door
    het EOGFL, afdeling Oriëntatie, aan het Koninkrijk Denemarken van een voorschot
    in verband met de gedurende het jaar 1976 gedane uitgaven voor de steun en premies
    met betrekking tot de modernisering van landbouwbedrijven
  type: main
