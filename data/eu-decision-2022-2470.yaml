title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2470 of 14 December 2022 laying
    down measures necessary for the technical development and implementation of the
    centralised system for the identification of Member States holding conviction
    information on third-country nationals and stateless persons (ECRIS-TCN)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2470 de la Commission du 14 décembre
    2022 établissant les mesures nécessaires au développement technique et à la
    mise en œuvre du système centralisé permettant d’identifier les États membres
    détenant des informations relatives aux condamnations concernant des ressortissants
    de pays tiers et des apatrides (ECRIS-TCN)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2470 der Kommission vom 14. Dezember
    2022 zur Festlegung von Maßnahmen, die für die technische Entwicklung und Implementierung
    des zentralisierten Systems für die Ermittlung der Mitgliedstaaten, in denen
    Informationen zu Verurteilungen von Drittstaatsangehörigen und Staatenlosen vorliegen
    (ECRIS-TCN), erforderlich sind
  type: main
- language: bg
  script: Cyrl
