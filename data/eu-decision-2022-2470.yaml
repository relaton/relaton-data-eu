    hozott ítéletekre vonatkozó információval rendelkező tagállamok azonosítására
    szolgáló központosított rendszer (ECRIS-TCN) technikai fejlesztéséhez és
    végrehajtásához szükséges intézkedések megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2470 della Commissione del 14 dicembre
    2022 che definisce le misure necessarie per lo sviluppo tecnico e l’attuazione
    del sistema centralizzato per individuare gli Stati membri in possesso di informazioni
    sulle condanne pronunciate a carico di cittadini di paesi terzi e apolidi [(ECRIS-TCN)
  type: main
- language: lv
  script: Latn
