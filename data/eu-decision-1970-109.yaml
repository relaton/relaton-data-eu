    la protection frappant les produits sidérurgiques à la périphérie de la Communauté
  type: main
- language: de
  script: Latn
  content: '70/109/EGKS: Entscheidung der Kommission vom 29. Januar 1970 betreffend
    Ausnahmen von der Empfehlung Nr. 1/64 der Hohen Behörde über eine Erhöhung
    des Außenschutzes gegenüber Einfuhren von Stahlerzeugnissen in die Gemeinschaft
    (Neununddreißigste Ausnahmeentscheidung)'
  type: main
- language: it
  script: Latn
  content: '70/109/CECA: Decisione della Commissione, del 29 gennaio 1970, recante
    deroga alla raccomandazione n. 1-64 dell''Alta Autorità relativa al rafforzamento
    della protezione che colpisce i prodotti siderurgici all''entrata nella Comunità
    (39a deroga)'
  type: main
- language: nl
  script: Latn
  content: '70/109/EGKS: Beschikking van de Commissie van 29 januari 1970 houdende
