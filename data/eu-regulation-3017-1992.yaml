title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3017/92 of 19 October 1992 modifying the anti-dumping
    duties following the review of the anti-dumping measures applicable to imports
    of synthetic polyester fibres originating in Romania, Taiwan, Turkey and the Republics
    of Serbia and of Montenegro and the former Yugoslav Republic of Macedonia and
    terminating the said review in respect of imports of synthetic polyester fibres
    originating in Mexico and the United States of America
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3017/92 du Conseil, du 19 octobre 1992, modifiant
    les droits antidumping dans le cadre de la procédure de réexamen des mesures
    antidumping applicables aux importations de fibres textiles synthétiques de polyester
    originaires de T'ai-wan, de Turquie, de Roumanie, des Républiques de Serbie et
    du Monténégro, ainsi que de l'ancienne République yougoslave de Macédoine,
    et portant clôture de ladite procédure de réexamen à l'encontre des importations
    de fibres textiles synthétiques de polyester originaires du Mexique et des États-Unis
    d'Amérique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3017/92 des Rates vom 19. Oktober 1992 zur Änderung
    der Antidumpingzölle im Rahmen der Überprüfung der Antidumpingmaßnahmen betreffend
    die Einfuhren von Polyesterspinnfasern mit Ursprung in Taiwan, der Türkei, Rumänien,
    den Republiken Serbien und Montenegro und der ehemaligen jugoslawischen Republik
    Mazedonien und zur Einstellung der Überprüfung gegenüber den Einfuhren von
    Polyesterspinnfasern mit Ursprung in Mexiko und den Vereinigten Staaten von Amerika
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3017/92 af 19. oktober 1992 om ændring af
    antidumpingtolden som led i den fornyede undersøgelse af antidumpingforanstaltningerne
    vedrørende importen af syntetiske fibre af polyester med oprindelse i Rumænien,
    Taiwan, Tyrkiet og republikkerne Serbien og Montenegro samt den tidligere jugoslaviske
    republik Makedonien og om afslutning af den fornyede undersøgelse vedrørende
    importen af syntetiske fibre af polyester med oprindelse i Amerikas Forenede Stater
    og Mexico
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3017/92 του Συμβουλίου
    της 19ης Οκτωβρίου 1992 περί τροποποιήσεως των
    δασμών αντιντάμπινγκ στα πλαίσια της διαδικασίας
    επανεξέτασης των μέτρων αντιντάμπινγκ που
    εφαρμόζονται στις εισαγωγές συνθετικών υφαντικών
    ινών από πολυεστέρες, καταγωγής Ταϊβάν, Τουρκίας,
    Ρουμανίας, των Δημοκρατιών της Σερβίας και
    του Μαυροβουνίου καθώς και της πρώην Γιουγκοσλαβικής
    Δημοκρατίας της Μακεδονίας, και περί περατώσεως
    της εν λόγω διαδικασίας επανεξέτασης ως προς
    τις εισαγωγές συνθετικών υφαντικών ινών από
    πολυεστέρες, καταγωγής Μεξικού και Ηνωμένων
    Πολιτειών της Αμερικής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3017/92 del Consiglio, del 19 ottobre 1992, che modifica
    i dazi antidumping nell'ambito del procedimento di riesame delle misure antidumping
    applicabili alle importazioni di fibre tessili sintetiche di poliesteri originarie
    di Taiwan, della Turchia, della Romania e delle Repubbliche di Serbia e del Montenegro
    nonché dell'ex Repubblica iugoslava di Macedonia e chiude il procedimento di
    riesame nei confronti delle importazioni di fibre tessili sintetiche di poliesteri
    originarie del Messico e degli Stati Uniti d'America
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3017/92 van de Raad van 19 oktober 1992 tot wijziging
    van de anti-dumpingrechten in het kader van de procedure van nieuw onderzoek van
    de anti-dumpingmaatregelen die van toepassing zijn op de invoer van synthetische
    textielvezels van polyester, van oorsprong uit de Republieken Servië en Montenegro,
    de voormalige Joegoslavische Republiek Macedonië, alsmede uit Roemenië, Taiwan
    en Turkije en tot afsluiting van genoemde procedure van nieuw onderzoek naar de
    invoer van synthetische textielvezels van polyester van oorsprong uit Mexico en
    de Verenigde Staten van Amerika
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3017/92 do Conselho, de 19 de Outubro de 1992, que
    modifica os direitos anti-dumping no âmbito do processo de reexame de medidas
    anti-dumping aplicáveis às importações de fibras têxteis sintéticas de poliéster
    originárias de Taiwan, da Turquia, da Roménia, das Repúblicas da Sérvia e
    do Montenegro, bem como da antiga República Jugoslava da Macedónia e que encerra
    o referido processo de reexame relativamente às importações de fibras sintéticas
    de poliéster originárias do México e dos Estados Unidos da América
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3017/92 del Consejo, de 19 de octubre de 1992, por
    el que se modifican los derechos antidumping en el marco del procedimiento de
    reconsideración de las medidas antidumping aplicables a las importaciones de
    fibras textiles sintéticas de poliéster originarias de Taiwán, Turquía, Rumanía
    y de las Repúblicas Yugoslavas de Serbia y Montenegro así como de la antigua
    República Yugoslava de Macedonia, y por el que se concluye el procedimiento de
    reconsideración con respecto a las importaciones de fibras textiles sintéticas
    de poliéster originarias de México y de Estados Unidos de América
  type: main
