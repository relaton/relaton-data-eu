title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 842/78 of 26 April 1978 re-establishing
    the levying of customs duties on other sheepskin and lambskin leather, other,
    falling within subheading 41.03 B II and originating in developing countries,
    to which the preferential tariff arrangements set out in Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 842/78 de la Commission, du 26 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d'ovins, non dénommées, de la sous-position tarifaire 41.03 B II, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 842/78 der Kommission vom 26. April 1978 zur Wiedereinführung
    des Zollsatzes für bestimmtes Schaf- und Lammleder der Tarifstelle 41.03 B II,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 842/78 af 26. april 1978 om genindførelse
    af opkrævning af toldafgifter for andet læder af fåre- og lammeskind, der henhører
    under underposition 41.03 B II, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 842/78 della Commissione, del 26 aprile 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine
    non nominate, della sottovoce doganale 41.03 B II, originarie dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 842/78 van de Commissie van 26 april 1978 houdende
    wederinstelling van de heffing van de douanerechten voor ander schapeleder, overige,
    van post 41.03 B II, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties werden geopend
  type: main
