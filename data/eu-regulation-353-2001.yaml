  content: Commission Regulation (EC) No 353/2001 of 22 February 2001 amending Regulation
    (EC) No 2428/2000 granting Portugal a derogation for the 2000/01 marketing year
    from Articles 1(1) and 20(1) of Regulation (EC) No 2366/98 laying down detailed
    rules for the application of the system of production aid for olive oil
