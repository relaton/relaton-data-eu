    καταγωγής συγκεκριμένων χωρών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 851/80 della Commissione, dell' 8 aprile 1980, recante
    seconda modifica del regolamento (CEE) n. 3353/75 relativo ad un controllo comunitario
    sulle importazioni di talune piante vive e di taluni prodotti della floricoltura,
    originari di diversi paesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 851/80 van de Commissie van 8 april 1980 houdende
