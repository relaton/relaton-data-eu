  content: Commission Regulation (EEC) No 851/80 of 8 April 1980 amending for the
    second time Regulation (EEC) No 3353/75 establishing Community surveillance on
    the importation of certain live plants and floricultural products originating
    in various countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 851/80 de la Commission, du 8 avril 1980, portant
    deuxième modification du règlement (CEE) n° 3353/75 portant instauration d'
    une surveillance communautaire des importations de certaines plantes vivantes
    et de certains produits de la floriculture, originaires de divers pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 851/80 der Kommission vom 8. April 1980 zur zweiten
    Änderung der Verordnung (EWG) Nr. 3353/75 zur Einführung einer gemeinschaftlichen
    Überwachung der Einfuhren von bestimmten lebenden Pflanzen und bestimmten Waren
    des Blumenhandels mit Ursprung in bestimmten Ländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 851/80 af 8. april 1980 om anden ændring
    af forordning (EØF) nr. 3353/75 om indførelse af et fællesskabstilsyn med indførsel
    af visse levende planter m.m. og visse afskårne blomster og blade med oprindelse
    i bestemte tredjelande
  type: main
- language: el
  script: Grek
