    toezicht op de invoer van sommige levende planten en van sommige produkten van
    de bloementeelt, van oorsprong uit verschillende landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 851/80 da Comissão, de 8 de Abril de 1980, relativo
