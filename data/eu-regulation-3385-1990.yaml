title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3385/90 of 26 November 1990 re-establishing
    the levying of customs duties on products of category 18 (order No 40.0180), originating
    in Pakistan to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3385/90 de la Commission du 26 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 18 (numéro d'ordre 40.0180) originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3385/90 DER KOMMISSION vom 26. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 18
    (laufende Nummer 40.0180) mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3385/90 af 26. november 1990 om genindførelse
    af opkrævning af toldafgifter for varer under varekategori nr. 18 (løbenummer
    40.0180), som har oprindelse i Pakistan og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3385/90 της Επιτροπής
    της 26ης Νοεμβρίου 1990 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών στα προϊόντα
    της κατηγορίας 18 ( αύξων αριθμός 40.0180 ), καταγωγής
    Πακιστάν, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3385/90 DELLA COMMISSIONE del 26 novembre 1990 che
    ripristina la ricossione dei dazi doganali applicabili ai prodotti della categoria
    n. 18 (numero d'ordine 40.0180) originari del Pakistan, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3385/90 VAN DE COMMISSIE van 26 november 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van de categorie van produkten nr. 18 (volgnummer 40.0180), van oorsprong uit
    Pakistan, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3385/90 DA COMISSAO de 26 de Novembro de 1990 que
    restabelece a cobrança dos direitos aduaneiros aplicaveis aos produtos da categoria
    de produtos n* 18 (numero de ordem 40.0180), originarios do Paquistao, beneficiario
    das preferências pautais previstas no Regulamento (CEE) n* 3897/89 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3385/90 DE LA COMISION de 26 de noviembre de 1990 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a los productos de la categoria no 18 (numero de orden 40.0180) originarios de
    Pakistan, beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3897/89 del Consejo
