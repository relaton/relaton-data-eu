title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2617/75 of the Commission of 15 October 1975 re-establishing
    the levying of customs duties on woven fabrics of silk or of waste silk other
    than noil falling within heading No 50.09, originating in India, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3048/74
    of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2617/75 de la Commission, du 15 octobre 1975, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie ou de bourre de soie (schappe), de la position tarifaire 50.09, originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3048/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2617/75 der Kommission vom 15. Oktober 1975 über
    die Wiedereinführung des Zollsatzes für Gewebe aus Seide oder Schappeseide der
    Tarifnummer 50.09 mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr.
    3048/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2617/75 af 15. oktober 1975 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke (undtagen af bourettesilke)
    under position 50.09, som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3048/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2617/75 della Commissione, del 15 ottobre 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta o di
    borra di seta (schappe) della voce doganale n. 50.09, originari dell'India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3048/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2617/75 van de Commissie van 15 oktober 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op weefsels
    van zijde of van vlokzijde, van post 50.09, van oorsprong uit India, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3048/74
    van de Raad van 2 december 1974
  type: main
