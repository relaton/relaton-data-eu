type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1139/76 of 14 May 1976 re-establishing the
    levying of customs duties on other parts and accessories of vehicles, etc., falling
    within subheading 87.12 B, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1139/76 de la Commission, du 14 mai 1976 , portant
    rétablissement de la perception des droits de douane applicables aux autres parties,
    pièces détachées et accessoires des véhicules etc. de la sous- position tarifaire
    87.12 B originaires de la Yougoslavie bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1139/76 der Kommission vom 14. Mai 1976 zur Wiedereinführung
    des Zollsatzes für andere Teile und Zubehör für Fahrzeuge usw., der Tarifstelle
    87.12 B, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1139/76 af 14. maj 1976 om genindførelse
    af opkrævning af toldafgifter for andre tilfælde, dele og tilbehør til køretøjer
    henhørende, etc., under underposition 87.12 B, som har oprindelse i Jugoslavien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1139/76 della Commissione, del 14 maggio 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle altre parti, pezzi
    staccati ed accessori dei veicoli, ecc., della sottovoce doganale 87.12 B, originari
    della Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1139/76 van de Commissie van 14 mei 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere delen,
    onderdelen en toebehoren van de voertuigen enz., van onderverdeling 87.12 B, van
    oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75
    van de Raad van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
