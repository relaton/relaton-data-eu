  content: '94/745/EC: Council Decision of 10 November 1994 on the conclusion of the
    Agreement in the form of an Exchange of Letters concerning the provisional application
    of the Protocol establishing for the period 20 July 1994 to 19 July 1997 the fishing
    opportunities and financial consideration provided for in the Agreement between
    the European Economic Community and the Islamic Federal Republic of the Comoros
    on fishing off the Comoros'
  type: main
- language: fr
  script: Latn
  content: '94/745/CE: Décision du Conseil du 10 novembre 1994 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant, pour la période allant du 20 juillet 1994 au 19 juillet
    1997, les possibilités de pêche et la contrepartie financière prévues dans
    l''accord entre la Communauté économique européenne et la République fédérale
    islamique des Comores concernant la pêche au large des Comores'
