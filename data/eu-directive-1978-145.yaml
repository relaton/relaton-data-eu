title:
- language: en
  script: Latn
  content: Council Directive 78/145/EEC of 30 January 1978 amending for the 13th time
    Directive 64/54/EEC on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 78/145/CEE du Conseil, du 30 janvier 1978, portant treizième
    modification de la directive 64/54/CEE relative au rapprochement des législations
    des États membres concernant les agents conservateurs pouvant être employés
    dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 78/145/EWG des Rates vom 30. Januar 1978 zur dreizehnten Änderung
    der Richtlinie 64/54/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 78/145/EØF af 30. januar 1978 om trettende ændring af
    direktiv 64/54/EØF om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 78/145/ΕΟΚ του Συμβουλίου της 30ής Ιανουαρίου
    1978 περί δεκάτης τρίτης τροποποιήσεως της οδηγίας
    64/54/ΕΟΚ περί προσεγγίσεως των νομοθεσιών των
    κρατών μελών σχετικά με τα συντηρητικά που
    επιτρέπεται να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 78/145/ETY, annettu 30 päivänä tammikuuta 1978,
    elintarvikkeissa sallittuja säilöntäaineita koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun direktiivin 64/54/ETY muuttamisesta kolmannentoista
    kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 78/145/CEE del Consiglio, del 30 gennaio 1978, recante tredicesima
    modifica della direttiva 64/54/CEE relativa al ravvicinamento delle legislazioni
    degli Stati Membri sui conservativi che possono essere impiegati nelle derrate
    destinate all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 78/145/EEG van de Raad van 30 januari 1978 houdende dertiende
    wijziging van Richtlijn 64/54/EEG betreffende de aanpassing van de wetgevingen
    van de Lid- Staten inzake conserveermiddelen die mogen worden gebruikt in voor
    menselijke voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 78/145/CEE do Conselho, de 30 de Janeiro de 1978, que altera
    pela décima terceira vez a Directiva 64/54/CEE relativa à aproximação das
    legislações dos Estados-Membros respeitantes aos conservantes que podem ser
    utilizados nos géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 78/145/CEE del Consejo, de 30 de enero de 1978, que modifica
    por decimotercera vez la Directiva 64/54/CEE relativa a la aproximación de las
    legislaciones de los Estados Miembros sobre los agentes conservadores que pueden
    utilizarse en los productos destinados al consumo humano
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 78/145/EEG av den 30 januari 1978 om ändring för trettonde
    gången av direktiv 64/54/EEG om tillnärmning av medlemsstaternas lagstiftning
    om konserveringsmedel som är godkända för användning i livsmedel
