  script: Latn
  content: Commission Implementing Regulation (EU) 2026/798 of 7 April 2026 laying
    down rules for the application of Regulation (EU) No 910/2014 of the European
    Parliament and of the Council as regards reference standards and specifications
    for the remote onboarding of users to the European Digital Identity Wallets by
    electronic identification means conforming to assurance level substantial in conjunction
    with additional remote onboarding procedures where the combination meets the requirements
    of assurance level high
  type: main
- language: fr
  script: Latn
