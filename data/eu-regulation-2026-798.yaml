    portant modalités d’application du règlement (UE) no 910/2014 du Parlement
    européen et du Conseil en ce qui concerne les normes de référence et les spécifications
    applicables à l’enrôlement à distance des utilisateurs pour les portefeuilles
    européens d’identité numérique par des moyens d’identification électronique
    conformes au niveau de garantie substantiel combinés avec des procédures d’enrôlement
    à distance supplémentaires lorsque la combinaison répond aux exigences du niveau
    de garantie élevé
  type: main
