  script: Latn
  content: Commission Implementing Regulation (EU) 2015/776 of 18 May 2015 extending
    the definitive anti-dumping duty imposed by Council Regulation (EU) No 502/2013
    on imports of bicycles originating in the People's Republic of China to imports
    of bicycles consigned from Cambodia, Pakistan and the Philippines, whether declared
    as originating in Cambodia, Pakistan and the Philippines or not
  type: main
- language: fr
  script: Latn
