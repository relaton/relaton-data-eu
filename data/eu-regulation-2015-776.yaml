    502/2013 du Conseil sur les importations de bicyclettes originaires de la République
    populaire de Chine aux importations de bicyclettes expédiées du Cambodge, du
    Pakistan et des Philippines, qu'elles aient ou non été déclarées originaires
    de ces pays
