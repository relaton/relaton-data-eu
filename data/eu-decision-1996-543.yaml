    και τα δεδομένα σχετικά με την ενίσχυση για
    την αναδιάρθρωση των οδικών μεταφορών, καθώς
    επίσης να αναστείλει αμέσως την καταβολή οποιασδήποτε
    νέας ενίσχυσης (Το κείμενο στην ιταλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
