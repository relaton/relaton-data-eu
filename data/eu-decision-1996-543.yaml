title:
- language: en
  script: Latn
  content: '96/543/EC: Commission Decision of 30 April 1996 ordering the Italian Government
    to supply all the documentation, information and data on aid for restructuring
    the road haulage sector and to suspend forthwith the payment of any further aid
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/543/CE: Décision de la Commission du 30 avril 1996 enjoignant au gouvernement
    italien de fournir tous les documents, informations et données sur l''aide à
    la restructuration du secteur des transports par route et de suspendre immédiatement
    le versement de toute nouvelle aide (Le texte en langue italienne est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/543/EG: Entscheidung der Kommission vom 30. April 1996 zur Anordnung
    der Vorlage sämtlicher Unterlagen, Informationen und Daten über die Umstrukturierungsbeihilfe
    zugunsten des Güterkraftverkehrs sowie zur unverzüglichen Einstellung der Zahlung
    neuer Beihilfen durch die italienische Regierung (Nur der italienische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/543/EF: Kommissionens beslutning af 30. april 1996 om at pålægge
    den italienske regering at fremlægge alle dokumenter, alle informationer og oplysninger
    om støtte til omstrukturering af vejtransportsektoren, samt øjeblikkeligt at
    standse udbetaling af enhver ny støtte (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/543/ΕΚ: Απόφαση της Επιτροπής της 30ής Απριλίου
