  script: Latn
  content: Regolamento (CEE) n. 3551/84 della Commissione del 17 dicembre 1984 che
    modifica e proroga il regolamento (CEE) n. 2819/79 che sottopone ad un regime
    di sorveglianza comunitaria le importazioni di taluni prodotti tessili originari
    di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
