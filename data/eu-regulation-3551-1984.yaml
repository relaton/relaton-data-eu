  content: Commission Regulation (EEC) No 3551/84 of 17 December 1984 amending and
    extending Regulation (EEC) No 2819/79 making imports of certain textile products
    from certain third countries subject to Community surveillance
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3551/84 de la Commission du 17 décembre 1984 modifiant
