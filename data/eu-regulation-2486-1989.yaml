title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2486/89 of 14 August 1989 derogating for
    the 1988/89 wine year from Regulation (EEC) No 2640/88 as regards the final date
    for the payment of aid for use in winemaking of concentrated grape must and rectified
    concentrated grape must
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2486/89 de la Commission du 14 août 1989 portant
    dérogation pour la campagne 1988/1989 au règlement (CEE) n° 2640/88 en ce qui
    concerne la date finale de versement de l'aide à l'utilisation en vinification
    de moûts de raisins concentrés et de moûts de raisins concentrés rectifiés
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2486/89 DER KOMMISSION vom 14. August 1989 zur Abweichung
    von der Verordnung (EWG) Nr. 2640/88 hinsichtlich der Frist für die Zahlung der
    Beihilfe für die Verwendung von konzentriertem Traubenmost und rektifiziertem
    konzentriertem Traubenmost zur Weinbereitung im Wirtschaftsjahr 1988/89 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2486/89 af 14. august 1989 om fravigelse
    for produktionsåret 1988/89 af forordning (EØF) nr. 2640/88 for så vidt angår
    fristen for udbetaling af støtten for anvendelse af koncentreret druemost og
    rektificeret koncentreret druemost til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2486/89 της Επιτροπής
    της 14ης Αυγούστου 1989 για την παρέκκλιση για
    την περίοδο 1988/89 από τον κανονισμό (ΕΟΚ) αριθ.
    2640/88 όσον αφορά την ημερομηνία λήξεως για την
    πληρωμή της ενίσχυσης της χρησιμοποιήσεως
    από την οινοποίηση συμπυκνωμένων γλευκών σταφυλής
    και συμπυκνωμένων ανακαθαρισθέντων γλευκών
    σταφυλής
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2486/89 DELLA COMMISSIONE del 14 agosto 1989 recante
    deroga, per la campagna 1988/1989, al regolamento (CEE) n. 2640/88 in ordine al
    termine ultimo per il versamento dell'' aiuto all'' utilizzazione nella vinificazione
    di mosti di uva concentrati e di mosti di uva concentrati rettificati #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2486/89 VAN DE COMMISSIE van 14 augustus 1989 houdende
    afwijking, voor het wijnoogstjaar 1988/1989, van Verordening (EEG) nr. 2640/88
    ten aanzien van de uiterste datum voor de uitkering van de steun voor het gebruik
    van geconcentreerde druivemost en gerectificeerde geconcentreerde druivemost bij
    de wijnbereiding #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2486/89 DA COMISSÃO de 14 de Agosto de 1989 que
    estabelece uma derrogação do Regulamento (CEE) nº 2640/88, para a campanha
    de 1988/1989, no que diz respeito à data final de pagamento da ajuda à utilização
    na vinificação de mostos de uva concentrados e de mostos de uva concentrados
    rectificados #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2486/89 DE LA COMISION de 14 de agosto de 1989 por
    el que se establece para la campana de 1988/89 una excepcion al Reglamento (CEE)
    no 2640/88 en lo referente a la fecha final de pago de la ayuda para la utilizacion
    en la vinificacion de mostos de uva concentrados y de mostos de uva concentrados
    rectificados
