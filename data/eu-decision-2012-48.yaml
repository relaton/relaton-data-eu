    markkinoilla, tehdyn päätöksen 2009/251/EY voimassaolon jatkamisesta (tiedoksiannettu
    numerolla K(2012) 321)'
  type: main
- language: hu
  script: Latn
  content: '2012/48/EU: A Bizottság végrehajtási határozata ( 2012. január 26.
