title:
- language: en
  script: Latn
  content: '2012/48/EU: Commission Implementing Decision of 26 January 2012 extending
    the validity of Decision 2009/251/EC requiring Member States to ensure that products
    containing the biocide dimethylfumarate are not placed or made available on the
    market (notified under document C(2012) 321)'
  type: main
- language: fr
  script: Latn
  content: '2012/48/UE: Décision d’exécution de la Commission du 26 janvier 2012
    prorogeant la validité de la décision 2009/251/CE exigeant des États membres
    qu’ils veillent à ce que les produits contenant du fumarate de diméthyle (produit
    biocide) ne soient pas commercialisés ou mis à disposition sur le marché [notifiée
    sous le numéro C(2012) 321]'
  type: main
- language: de
  script: Latn
  content: '2012/48/EU: Durchführungsbeschluss der Kommission vom 26. Januar 2012
    zur Verlängerung des Anwendungszeitraums der Entscheidung 2009/251/EG zur Verpflichtung
    der Mitgliedstaaten, dafür zu sorgen, dass Produkte, die das Biozid Dimethylfumarat
    enthalten, nicht in Verkehr gebracht oder auf dem Markt bereitgestellt werden
    (Bekanntgegeben unter Aktenzeichen K(2012) 321)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/48/ЕС: Решение за изпълнение на Комисията
    от 26 януари 2012 година за удължаване на валидността
    на Решение 2009/251/ЕО за изискване към държавите-членки
    да гарантират, че на пазара не се пускат или
    предлагат продукти, които съдържат биоцида
    диметилфумарат (нотифицирано под номер C(2012)
    321)'
  type: main
- language: cs
  script: Latn
  content: '2012/48/EU: Prováděcí rozhodnutí Komise ze dne 26. ledna 2012 o prodloužení
    platnosti rozhodnutí 2009/251/ES, kterým se členským státům ukládá povinnost
    zajistit, aby výrobky obsahující biocid dimethyl-fumarát nebyly uváděny
    nebo dodávány na trh (oznámeno pod číslem K(2012) 321)'
  type: main
- language: da
  script: Latn
  content: '2012/48/EU: Kommissionens gennemførelsesafgørelse af 26. januar 2012
    om forlængelse af gyldigheden af beslutning 2009/251/EF om et krav til medlemsstaterne
    om at sørge for, at produkter indeholdende biocidet dimethylfumarat ikke bringes
    i omsætning eller gøres tilgængelige på markedet (meddelt under nummer K(2012)
    321)'
  type: main
- language: el
  script: Grek
  content: '2012/48/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 26ης Ιανουαρίου 2012 , για την παράταση της
    ισχύος της απόφασης 2009/251/ΕΚ η οποία απαιτεί
    από τα κράτη μέλη να διασφαλίσουν ότι δεν διατίθενται
    ούτε είναι διαθέσιμα στην αγορά προϊόντα που
    περιέχουν το βιοκτόνο φουμαρικό διμεθύλιο
    [κοινοποιηθείσα υπό τον αριθμό Ε(2012) 321]'
  type: main
