    sisaldavaid tooteid ei lasta turule ega tehta turul kättesaadavaks) kehtivust
    (teatavaks tehtud numbri K(2012) 321 all)'
  type: main
- language: fi
  script: Latn
  content: '2012/48/EU: Komission täytäntöönpanopäätös, annettu 26 päivänä
