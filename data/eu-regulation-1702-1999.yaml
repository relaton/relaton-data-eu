    järjestelmän soveltamista koskevista erityisistä yksityiskohtaisista säännöistä
    annetun asetuksen (EY) N:o 1223/94 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1702/1999 della Commissione del 23 luglio 1999 che
    modifica il regolamento (CE) n. 1222/94 che stabilisce, per taluni prodotti agricoli
    esportati sotto forma di merci non comprese nell'allegato II del trattato, le
    modalità comuni di applicazione relative alla concessione delle restituzioni
    all'esportazione e i criteri per stabilire il loro importo e che abroga il regolamento
    (CE) n. 1223/94, che stabilisce le modalità particolari di applicazione del regime
    dei titoli di fissazione anticipata per determinati prodotti agricoli esportati
    sotto forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1702/1999 van de Commissie van 23 juli 1999 tot wijziging
    van Verordening (EG) nr. 1222/94 tot vaststelling van de gemeenschappelijke uitvoeringsbepalingen
    voor de regeling aangaande de toekenning van restituties bij uitvoer en de criteria
    voor de vaststelling van het restitutiebedrag betreffende bepaalde landbouwproducten,
    uitgevoerd in de vorm van goederen die niet onder bijlage II van het Verdrag vallen
    en tot intrekking van Verordening (EG) nr. 1223/94 houdende bijzondere uitvoeringsbepalingen
    inzake het stelsel van voorfixatiecertificaten voor bepaalde landbouwproducten
    die worden uitgevoerd in de vorm van goederen die niet onder bijlage II van het
    Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1702/1999 da Comissão de 23 de Julho de 1999 que
    altera o Regulamento (CE) n° 1222/94, que estabelece, para certos produtos agrícolas
    exportados sob a forma de mercadorias não abrangidas pelo anexo II do Tratado,
    as normas comuns de aplicação do regime de concessão de restituições à exportação
    e os critérios de fixação do seu montante e que revoga o Regulamento (CE) n°
    1223/94, que estabelece normas especiais de execução do regime dos certificados
    de pré-fixação para certos produtos agrícolas exportados sob a forma de mercadorias
    não abrangidas pelo anexo II do Tratado
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1702/1999 de la Comisión de 23 de julio de 1999 que
    modifica el Reglamento (CE) n° 1222/94 por el que se establecen, para determinados
    productos agrícolas exportados en forma de mercancías no incluidas en el anexo
    II del Tratado, las disposiciones comunes de aplicación del régimen de concesión
    de las restituciones a la exportación y los criterios para la fijación de su
    importe y por el que se deroga el Reglamento (CE) n° 1223/94 por el que se establecen
    modalidades especiales de aplicación del régimen de los certificados de fijación
    anticipada para determinados productos agrícolas exportados en forma de mercancías
    no incluidas en el anexo II del Tratado
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1702/1999 av den 23 juli 1999 om ändring
    av förordning (EG) nr 1222/94 om gemensamma tillämpningsföreskrifter för ordningen
    för beviljande av exportbidrag för vissa jordbruksprodukter som exporteras i
    form av varor som inte omfattas av bilaga II till fördraget samt om kriterierna
    för fastställande av bidragsbeloppen och om upphävande av förordning (EG)
    nr 1223/94 om särskilda tillämpningsföreskrifter för systemet med förutfastställelselicenser
    för vissa jordbruksprodukter som exporteras i form av varor som inte omfattas
    av bilaga II till fördraget
