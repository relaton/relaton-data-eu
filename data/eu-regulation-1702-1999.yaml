    μη υπαγομένων στο παράρτημα ΙΙ της συνθήκης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1702/1999, annettu 23 päivänä heinäkuuta
    1999, tiettyjen perustamissopimuksen liitteeseen II kuulumattomina tavaroina vietävien
    maataloustuotteiden vientituen myöntämisjärjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä ja tuen määrän vahvistamisperusteista annetun
    asetuksen (EY) N:o 1222/94 muuttamisesta ja tiettyjen perustamissopimuksen liitteeseen
