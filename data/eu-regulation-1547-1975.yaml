title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1547/75 of the Commission of 18 June 1975 re-establishing
    the levying of customs duties on tubes and pipes and blanks therefor, of copper;
    hollow bars of copper, falling within heading No 74.07, originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1547/75 de la Commission, du 18 juin 1975, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris leurs ébauches) et barres creuses, en cuivre, de la position
    tarifaire 74.07, originaires de la Yougoslavie bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1547/75 der Kommission vom 18. Juni 1975 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1547/75 af 18. juni 1975 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger af kobber
    under position 74.07 som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1547/75 della Commissione, del 18 giugno 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai tubi (compresi i loro
    sbozzi) e barre forate, di rame, della voce doganale n. 74.07, originari della
    Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1547/75 van de Commissie van 18 juni 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op buizen en
    pijpen (ook indien niet afgewerkt) en holle staven, van koper, van post 74.07,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
