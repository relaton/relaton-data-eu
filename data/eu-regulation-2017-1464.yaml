---
id: EURegulation20171464
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2017/1464 of 2 June 2017 amending
    Council Regulation (EC) No 1215/2009 as regards trade concessions granted to Kosovo
    (This designation is without prejudice to positions on status, and is in line
    with UNSCR 1244/1999 and the ICJ Opinion on the Kosovo declaration of independence.
    ) following the entry into force of the Stabilisation and Association Agreement
    between the European Union and the European Atomic Energy Community, of the one
    part, and Kosovo, of the other part
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/1464 de la Commission du 2 juin 2017 modifiant
    le règlement (CE) n° 1215/2009 du Conseil en ce qui concerne les concessions
    commerciales accordées au Kosovo (Cette désignation est sans préjudice des
    positions sur le statut et est conforme à la résolution 1244 (1999) du Conseil
    de sécurité des Nations unies ainsi qu'à l'avis de la Cour internationale de
    justice sur la déclaration d'indépendance du Kosovo. ) à la suite de l'entrée
    en vigueur de l'accord de stabilisation et d'association entre l'Union européenne
    et la Communauté européenne de l'énergie atomique, d'une part, et le Kosovo,
    d'autre part
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2017/1464 der Kommission vom 2. Juni 2017 zur
    Änderung der Verordnung (EG) Nr. 1215/2009 des Rates bezüglich der Handelszugeständnisse
    für das Kosovo (Diese Bezeichnung berührt nicht die Standpunkte zum Status und
    steht im Einklang mit der Resolution 1244/1999 des VN-Sicherheitsrates und dem
    Gutachten des Internationalen Gerichtshofs zur Unabhängigkeitserklärung des
    Kosovos. ) nach dem Inkrafttreten des Stabilisierungs- und Assoziierungsabkommens
    zwischen der Europäischen Union und der Europäischen Atomgemeinschaft einerseits
    und dem Kosovo andererseits
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2017/1464 на Комисията
    от 2 юни 2017 година за изменение на Регламент
    (ЕО) № 1215/2009 на Съвета по отношение на търговските
    отстъпки, предоставени на Косово (Това название
    не засяга позициите по отношение на статута
    и е съобразено с Резолюция 1244/1999 на Съвета за
    сигурност на ООН и становището на Международния
    съд относно обявяването на независимост от
    страна на Косово. ), вследствие на влизането
    в сила на Споразумението за стабилизиране
    и асоцииране между Европейския съюз и Европейската
    общност за атомна енергия, от една страна, и
    Косово, от друга страна
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2017/1464 ze dne 2. června
    2017, kterým se v souvislosti se vstupem v platnost Dohody o stabilizaci a přidružení
    mezi Evropskou unií a Evropským společenstvím pro atomovou energii na jedné
    straně a Kosovem (Tímto označením nejsou dotčeny postoje k otázce statusu
    a označení je v souladu s rezolucí Rady bezpečnosti OSN 1244/1999 a se stanoviskem
    Mezinárodního soudního dvora k vyhlášení nezávislosti Kosova. ) na straně
    druhé mění nařízení Rady (ES) č. 1215/2009, pokud jde o obchodní koncese
    udělené Kosovu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2017/1464 af 2. juni 2017 om ændring
    af Rådets forordning (EF) nr. 1215/2009 for så vidt angår handelsindrømmelser
    til Kosovo (Denne betegnelse indebærer ingen stillingtagen til Kosovos status,
    og den er i overensstemmelse med FN's Sikkerhedsråds resolution 1244/1999 og
    Den Internationale Domstols udtalelse om Kosovos uafhængighedserklæring. ) efter
    ikrafttrædelsen af stabiliserings- og associeringsaftalen mellem Den Europæiske
    Union og Det Europæiske Atomenergifællesskab på den ene side og Kosovo på
    den anden side
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) 2017/1464
    της Επιτροπής, της 2ας Ιουνίου 2017, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1215/2009 του Συμβουλίου
    όσον αφορά τις εμπορικές παραχωρήσεις στο
    Κοσσυφοπέδιο (Η ονομασία αυτή χρησιμοποιείται
    με την επιφύλαξη των θέσεων ως προς το καθεστώς
    και είναι σύμφωνη με την απόφαση 1244/1999 του Συμβουλίου
    Ασφαλείας των Ηνωμένων Εθνών και τη γνωμοδότηση
    του Διεθνούς Δικαστηρίου σχετικά με τη διακήρυξη
    της ανεξαρτησίας του Κοσσυφοπεδίου. ) λόγω
    της έναρξης ισχύος της συμφωνίας σταθεροποίησης
    και σύνδεσης μεταξύ της Ευρωπαϊκής Ένωσης
    και της Ευρωπαϊκής Κοινότητας Ατομικής Ενεργείας,
    αφενός, και του Κοσσυφοπεδίου, αφετέρου
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2017/1464, 2. juuni 2017, millega
    muudetakse nõukogu määrust (EÜ) nr 1215/2009 Kosovo (See nimetus ei piira
    Kosovo staatust käsitlevaid seisukohti ning on kooskõlas ÜRO Julgeolekunõukogu
    resolutsiooniga 1244/1999 ja Rahvusvahelise Kohtu arvamusega Kosovo iseseisvusdeklaratsiooni
    kohta. ) suhtes kohaldatavate selliste kaubandussoodustuste osas, mis tulenevad
    ühelt poolt Euroopa Liidu ja Euroopa Aatomienergiaühenduse ning teiselt poolt
    Kosovo vahelise stabiliseerimis- ja assotsieerimislepingu jõustumisest
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2017/1464, annettu 2 päivänä kesäkuuta
    2017, neuvoston asetuksen (EY) N:o 1215/2009 muuttamisesta siltä osin kuin on
    kyse Kosovolle (Tämä nimitys ei vaikuta asemaa koskeviin kantoihin, ja se on
    YK:n turvallisuusneuvoston päätöslauselman 1244/1999 ja Kansainvälisen tuomioistuimen
    Kosovon itsenäisyysjulistuksesta antaman lausunnon mukainen. ) Euroopan unionin
    ja Euroopan atomienergiayhteisön sekä Kosovon välisen vakautus- ja assosiaatiosopimuksen
    voimaan tulon seurauksena myönnetyistä kauppamyönnytyksistä
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/1464 оd 2. lipnja 2017. o izmjeni
    Uredbe Vijeća (EZ) br. 1215/2009 u pogledu trgovinskih povlastica odobrenih Kosovu
    (Ovim se nazivom ne dovode u pitanje stajališta o statusu te je on u skladu s
    rezolucijom Vijeća sigurnosti Ujedinjenih naroda 1244/1999 i mišljenjem Međunarodnog
    suda o proglašenju neovisnosti Kosova. ) nakon stupanja na snagu Sporazuma o
    stabilizaciji i pridruživanju između Europske unije i Europske zajednice za
    atomsku energiju, s jedne strane, i Kosova, s druge strane
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1464 felhatalmazáson alapuló rendelete (2017.
    június 2.) az egyrészről az Európai Unió és az Európai Atomenergia-közösség,
    és másrészről Koszovó (Ez a megnevezés nem érinti a jogállással kapcsolatos
    álláspontokat, továbbá összhangban van az 1244 (1999) sz. ENSZ BT-határozattal
    és a Nemzetközi Bíróságnak a koszovói függetlenségi nyilatkozatról szóló
    véleményével. ) közötti stabilizációs és társulási megállapodás hatálybalépése
    miatt az 1215/2009/EK tanácsi rendelet Koszovónak nyújtott kereskedelmi engedmények
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2017/1464 della Commissione, del 2 giugno 2017,
    che modifica il regolamento (CE) n. 1215/2009 del Consiglio per quanto riguarda
    le concessioni commerciali accordate al Kosovo (Tale designazione non pregiudica
    le posizioni riguardo allo status ed è in linea con la risoluzione 1244 (1999)
    dell'UNSC e con il parere della CIG sulla dichiarazione di indipendenza del Kosovo.
    ) in seguito all'entrata in vigore dell'accordo di stabilizzazione e di associazione
    tra l'Unione europea e la Comunità europea dell'energia atomica, da un lato,
    e il Kosovo, dall'altro
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2017/1464 (2017. gada 2. jūnijs), ar
    ko groza Padomes Regulu (EK) Nr. 1215/2009 attiecībā uz tirdzniecības koncesijām,
    kas piešķirtas Kosovai (Šis nosaukums neskar nostājas par statusu un atbilst
    ANO DP Rezolūcijai 1244 (1999) un Starptautiskās Tiesas atzinumam par Kosovas
    neatkarības deklarāciju. ), stājoties spēkā Stabilizācijas un asociācijas
    nolīgumam starp Eiropas Savienību un Eiropas Atomenerģijas kopienu, no vienas
    puses, un Kosovu, no otras puses
  type: main
- language: lt
  script: Latn
  content: 2017 m. birželio 2 d. Komisijos deleguotasis reglamentas (ES) 2017/1464,
    kuriuo dėl prekybos lengvatų, suteiktų Kosovui (Šis pavadinimas nekeičia
    pozicijų dėl statuso ir atitinka JT ST rezoliuciją 1244/1999 bei Tarptautinio
    Teisingumo Teismo nuomonę dėl Kosovo nepriklausomybės deklaracijos. ) įsigaliojus
    Europos Sąjungos bei Europos atominės energijos bendrijos ir Kosovo stabilizacijos
    ir asociacijos susitarimui, iš dalies keičiamas Tarybos reglamentas (EB) Nr.
    1215/2009
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2017/1464 tat-2 ta' Ġunju 2017
    li jemenda r-Regolament tal-Kunsill (KE) Nru 1215/2009 fir-rigward tal-konċessjonijiet
    kummerċjali mogħtija lill-Kosovo (Din id-deżinjazzjoni hija mingħajr preġudizzju
    għall-pożizzjonijiet dwar l-istatus, u hija konformi mal-UNSCR 1244/1999 u mal-Opinjoni
    tal-QIĠ dwar id-dikjarazzjoni tal-indipendenza tal-Kosovo. ) wara d-dħul fis-seħħ
    tal-Ftehim ta' Stabbilizzazzjoni u Assoċjazzjoni bejn l-Unjoni Ewropea u l-Komunità
    Ewropea tal-Enerġija Atomika, minn naħa waħda, u l-Kosovo, min-naħa l-oħra
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2017/1464 van de Commissie van 2 juni 2017
    tot wijziging van Verordening (EG) nr. 1215/2009 van de Raad wat betreft de handelsconcessies
    die zijn verleend aan Kosovo (Deze benaming laat de standpunten over de status
    van Kosovo onverlet en is in overeenstemming met Resolutie 1244/1999 van de VN-Veiligheidsraad
    en het advies van het Internationaal Gerechtshof over de onafhankelijkheidsverklaring
    van Kosovo. ) na de inwerkingtreding van de stabilisatie- en associatieovereenkomst
    tussen de Europese Unie en de Europese Gemeenschap voor Atoomenergie, enerzijds,
    en Kosovo, anderzijds
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2017/1464 z dnia 2 czerwca 2017
    r. zmieniające rozporządzenie Rady (WE) nr 1215/2009 w odniesieniu do koncesji
    handlowych przyznanych Kosowu (Użycie tej nazwy nie wpływa na stanowiska w sprawie
    statusu Kosowa i jest zgodne z rezolucją Rady Bezpieczeństwa ONZ 1244/1999 oraz
    z opinią Międzynarodowego Trybunału Sprawiedliwości w sprawie Deklaracji niepodległości
    Kosowa. ) po wejściu w życie Układu o stabilizacji i stowarzyszeniu między
    Unią Europejską i Europejską Wspólnotą Energii Atomowej, z jednej strony,
    a Kosowem, z drugiej strony
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2017/1464 da Comissão, de 2 de junho de 2017,
    que altera o Regulamento (CE) n.° 1215/2009 do Conselho no que diz respeito às
    concessões comerciais concedidas ao Kosovo (Esta designação não prejudica
    as posições relativas ao estatuto, e está conforme com a RCSNU 1244/1999 e
    o parecer do TIJ sobre a declaração de independência do Kosovo. ), na sequência
    da entrada em vigor do Acordo de Estabilização e de Associação entre a União
    Europeia e a Comunidade Europeia da Energia Atómica, por um lado, e o Kosovo,
    por outro
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2017/1464 al Comisiei din 2 iunie 2017 de modificare
    a Regulamentului (CE) nr. 1215/2009 al Consiliului în ceea ce privește concesiile
    comerciale acordate Kosovo-ului (Această denumire nu aduce atingere pozițiilor
    privind statutul și este conformă cu RCSONU 1244/1999, precum și cu Avizul
    CIJ privind Declarația de independență a Kosovo. ) ca urmare a intrării în
    vigoare a Acordului de stabilizare și de asociere dintre Uniunea Europeană și
    Comunitatea Europeană a Energiei Atomice, pe de o parte, și Kosovo, pe de altă
    parte
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2017/1464 z 2. júna 2017, ktorým
    sa mení nariadenie Rady (ES) č. 1215/2009, pokiaľ ide o obchodné koncesie
    udelené Kosovu (Týmto označením nie sú dotknuté pozície k štatútu a označenie
    je v súlade s rezolúciou BR OSN č. 1244/1999 a so stanoviskom Medzinárodného
    súdneho dvora k vyhláseniu nezávislosti Kosova. ) po nadobudnutí platnosti
    Dohody o stabilizácii a pridružení medzi Európskou úniou a Európskym spoločenstvom
    pre atómovú energiu na jednej strane a Kosovom na strane druhej
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/1464 z dne 2. junija 2017 o spremembi
    Uredbe Sveta (ES) št. 1215/2009 v zvezi s trgovinskimi koncesijami, odobrenimi
    Kosovu (To poimenovanje ne posega v stališča glede statusa ter je v skladu z
    RVSZN 1244/1999 in mnenjem Meddržavnega sodišča o razglasitvi neodvisnosti
    Kosova. ) zaradi začetka veljavnosti Stabilizacijsko-pridružitvenega sporazuma
    med Evropsko unijo in Evropsko skupnostjo za atomsko energijo na eni strani ter
    Kosovom na drugi strani
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2017/1464 de la Comisión, de 2 de junio de 2017,
    por el que se modifica el Reglamento (CE) n.° 1215/2009 en lo que respecta a
    las concesiones comerciales concedidas a Kosovo (Esta denominación se entiende
    sin perjuicio de las posiciones sobre su estatuto y está en consonancia con la
    Resolución 1244 (1999) del Consejo de Seguridad de las Naciones Unidas y con
    el Dictamen de la Corte Internacional de Justicia sobre la declaración de independencia
    de Kosovo. ) a raíz de la entrada en vigor del Acuerdo de Estabilización y Asociación
    entre la Unión Europea y la Comunidad Europea de la Energía Atómica, por una
    parte, y Kosovo, por otra
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2017/1464 av den 2 juni 2017
    om ändring av rådets förordning (EG) nr 1215/2009 vad gäller de handelsmedgivanden
    för Kosovo (Denna beteckning påverkar inte ståndpunkter om Kosovos status och
    är i överensstämmelse med FN:s säkerhetsråds resolution 1244/1999 och med
    Internationella domstolens utlåtande om Kosovos självständighetsförklaring.
    ) som följer på ikraftträdandet av stabiliserings- och associeringsavtalet
    mellan Europeiska unionen, å ena sidan, och Kosovo, å andra sidan
  type: main
