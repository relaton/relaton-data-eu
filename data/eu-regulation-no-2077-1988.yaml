title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2077/88 of 13 July 1988 re-establishing
    the levying of customs duties on nails, tacks and drawing pins, falling within
    combined nomenclature code 7317, originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2077/88 de la Commission du 13 juillet 1988 portant
    rétablissement de la perception des droits de douane applicables aux pointes,
    clous et punaises du code NC 7317, originaires de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2077/88 der Kommission vom 13. Juli 1988 zur Wiedereinführung
    der Erhebung der Zölle für Stifte, Nägel und Reißnägel der Position 7317
    der Kombinierten Nomenklatur mit Ursprung in China, dem die in der Verordnung
    (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2077/88 af 13. juli 1988 om genindførelse
    af opkrævning af told for spiger, søm, tegnestifter og bølgesøm henhørende
    under KN-kode 7317 og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3635/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2077/88 της Επιτροπής
    της 13ης Ιουλίου 1988 περί αποκαταστάσεως της
    εφαρμογής των δασμών για καρφιά κάθε είδους,
    πινέζες και συνδετήρες, του κωδικού της συνδυασμένης
    ονοματολογίας 7317, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων από τον κανονισμό (ΕΟΚ) αριθ.
    3635/87 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2077/88 della Commissione del 13 luglio 1988 che ripristina
    la riscossione dei dazi doganali applicabili alle punte, chiodi e puntine del
    codice 7317 della nomenclatura combinata, originari della Cina beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3635/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2077/88 van de Commissie van 13 juli 1988 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op draadnagels,
    spijkers en punaises van GN-code 7317, van oorsprong uit China, waarvoor de in
    Verordening (EEG) nr. 3635/87 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2077/88 da Comissão de 13 de Julho de 1988 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos pontas, pregos
    e percevejos do código NC 7317, originários da China, beneficiária das preferências
    pautais previstas pelo Regulamento (CEE) n.° 3635/87 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2077/88 de la Comisión de 13 de julio de 1988 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a las
    puntas, clavos y chinchetas del código NC 7317, originarios de China, beneficiaria
    de las preferencias arancelarias previstas por el Reglamento (CEE) n° 3635/87
    del Consejo
