title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 979/77 of 5 May 1977 amending Commission
    Regulation (EEC) No 808/77 of 21 April 1977 making the importation into Italy
    of certain woven fabrics of cotton and certain woven fabrics of synthetic textile
    fibres originating in the Kingdom of Thailand subject to authorization
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 979/77 de la Commission, du 5 mai 1977, portant modification
    du règlement (CEE) n° 808/77 de la Commission, du 21 avril 1977, soumettant
    à autorisation les importations en Italie de certains tissus de coton et de fibres
    textiles synthétiques originaires du Royaume de Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 979/77 der Kommission vom 5. Mai 1977 zur Änderung
    der Verordnung (EWG) Nr. 808/77 der Kommission vom 21. April 1977, mit der die
    Einfuhr von Geweben aus Baumwolle und Geweben aus synthetischen Spinnfasern mit
    Ursprung im Königreich Thailand nach Italien von der Erteilung einer Genehmigung
    abhängig gemacht wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 979/77 af 5. maj 1977 om ændring af
    Kommissionens Forordning (EØF) nr. 808/77 af 21. april 1977 om indførelse af
    en bevillingsordning for indførsel til Italien af vævede stoffer af bomuld og
    af syntetiske fibre med oprindelse i Thailand
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 979/77 della Commissione, del 5 maggio 1977, che modifica
    il regolamento (CEE) n. 808/77 della Commissione, del 21 aprile 1977, che subordina
    a licenze le importazioni in Italia di tessuti di cotone e di tessuti di fibre
    tessili sintetiche originari del Regno di Tailandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 979/77 van de Commissie van 5 mei 1977 betreffende
    wijziging van Verordening (EEG) nr. 808/77 van de Commissie van 21 april 1977
    houdende instelling van een vergunningstelsel voor de invoer in Italië van weefsels
    van katoen en synthetische textielweefsels van oorsprong uit het Koninkrijk Thailand
  type: main
