title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 977/2002 of 4 June 2002 imposing a definitive
    countervailing duty on imports of certain ring-binder mechanisms (RBMs) originating
    in Indonesia and terminating the anti-subsidy proceeding in respect of imports
    of certain RBMs originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 977/2002 du Conseil du 4 juin 2002 instituant un droit
    compensateur définitif sur les importations de certains mécanismes pour reliure
    à anneaux originaires d'Indonésie et clôturant la procédure antisubventions
    concernant les importations de certains mécanismes pour reliure à anneaux originaires
    de l'Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 977/2002 des Rates vom 4. Juni 2002 zur Einführung
    eines endgültigen Ausgleichszolls auf die Einfuhren bestimmter Ringbuchmechaniken
    (RBM) mit Ursprung in Indonesien und zur Einstellung des Antisubventionsverfahrens
    betreffend die Einfuhren bestimmter RBM mit Ursprung in Indien
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EO) № 977/2002 на Съвета от 4 юни 2002
    година относно налагане на окончателно изравнително
    мито върху вноса на някои механизми за подвързване
    с халки, с произход от Индонезия и за закриване
    на процедурата по анти-субсидии, по отношение
    на някои механизми за подвързване с халки с
    произход от Индия
  type: main
- language: cs
  script: Latn
