- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/449 of 18 March 2019 amending
    Commission Implementing Decision (EU) 2016/715 setting out measures in respect
    of certain fruits originating in certain third countries to prevent the introduction
    into and the spread within the Union of the harmful organism Phyllosticta citricarpa
    (McAlpine) Van der Aa (notified under document C(2019) 2024)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/449 de la Commission du 18 mars 2019 modifiant
