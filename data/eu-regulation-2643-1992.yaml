title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2643/92 of 10 September 1992 fixing the
    representative market rates to be applied for certain amounts in the context of
    the common agricultural policy and, in particular, for the calculation of the
    monetary compensatory amounts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2643/92 de la Commission, du 10 septembre 1992, fixant
    les taux représentatifs du marché à appliquer pour certains montants dans le
    cadre de la politique agricole commune, et notamment pour le calcul des montants
    compensatoires monétaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2643/92 der Kommission vom 10. September 1992 zur
    Festsetzung der repräsentativen Marktkurse, die für bestimmte Beträge im Rahmen
    der gemeinsamen Agrarpolitik, insbesondere für die Berechnung der Währungsausgleichsbeträge,
    angewendet werden müssen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2643/92 af 10. september 1992 om fastsættelse
    af de repræsentative markedskurser, der skal anvendes for visse beløb i forbindelse
    med den fælles landbrugspolitik, navnlig ved beregning af de monetære udligningsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2643/92 της Επιτροπής
    της 10ης Σεπτεμβρίου 1992 για τον καθορισμό των
    αντιπροσωπευτικών ισοτιμιών της αγοράς που
    θα εφαρμοσθούν σε ορισμένα ποσά στο πλαίσιο
    της κοινής γεωργικής πολιτικής και κυρίως
    για τον υπολογισμό των νομισματικών εξισωτικών
    ποσών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2643/92 della Commissione, del 10 settembre 1992,
    che fissa i tassi rappresentativi del mercato da applicare a taluni importi nel
    quadro della politica agricola comune, in particolare per il calcolo degli importi
    compensativi monetari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2643/92 van de Commissie van 10 september 1992 tot
    vaststelling van de representatieve marktkoersen die moeten worden toegepast voor
    bepaalde bedragen in het kader van het gemeenschappelijk landbouwbeleid, en met
    name voor de berekening van de monetaire compenserende bedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2643/92 da Comissão, de 10 de Setembro de 1992,
    que fixa as taxas representativas do mercado a aplicar em relação a determinados
    montantes no âmbito da política agrícola comum e, nomeadamente, para o cálculo
    dos montantes compensatórios monetários
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2643/92 de la Comisión, de 10 de septiembre de 1992,
    por el que se fijan los tipos representativos del mercado aplicables a determinados
    importes en el marco de la política agraria común y en particular al cálculo
    de los montantes compensatorios monetarios
  type: main
