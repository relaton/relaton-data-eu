title:
- language: fr
  script: Latn
  content: Règlement n° 159 de la Commission portant adaptation et fixation des
    prix d'écluse pour les oeufs en coquille de volaille et volailles vivantes et
    abattues et fixation du montant des prélèvements envers les pays tiers pour
    les oeufs en coquille de volaille, les volailles vivantes d'un poids n'excédant
    pas 185 grammes et les volailles abattues
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 159 der Kommission über die Anpassung und Festsetzung der
    Einschleusungspreise für Eier in der Schale von Hausgeflügel, lebendes und geschlachtetes
    Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge gegenüber
    dritten Ländern für Eier in der Schale, von Hausgeflügel; lebendes Hausgeflügel
    mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
  type: main
- language: it
  script: Latn
  content: Regolamento n. 159 della Commissione relativo all'adattamento e alla fissazione
    dei prezzi limite per le uova in guscio di volatili da cortile, per i volatili
    da cortile vivi e per i volatili da cortile macellati, e alla fissazione dell'ammontare
    del prelievo nei confronti dei paesi terzi per le uova in guscio di volatili da
    cortile, per i volatili da cortile vivi di peso non superiore a 185 grammi e per
    i volatili da cortile macellati
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 159 van de Commissie betreffende de aanpassing en vaststelling
    van de sluisprijzen voor eieren in de schaal van pluimvee, levend pluimvee en
    geslacht pluimvee alsmede betreffende de vaststelling van de heffingen ten opzichte
    van derde landen voor eieren in de schaal van pluimvee, levend pluimvee dat niet
    meer dan 185 gram weegt en geslacht pluimvee
  type: main
