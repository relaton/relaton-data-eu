    li jissupplimenta r-Regolament (UE) 2017/1129 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji dwar l-informazzjoni finanzjarja
    ewlenija fis-sommarju ta’ prospett, il-pubblikazzjoni u l-klassifikazzjoni tal-prospetti,
    ir-reklami għal titoli, is-supplimenti għal prospett, u l-portal ta’ notifika,
    u li jħassar ir-Regolament ta’ Delega tal-Kummissjoni (UE) Nru 382/2014 u r-Regolament
    Delegat tal-Kummissjoni (UE) 2016/301
  type: main
