    2019, Euroopan parlamentin ja neuvoston asetuksen (EU) 2017/1129 täydentämisestä
    esitteen tiivistelmään sisältyviä keskeisiä taloudellisia tietoja, esitteiden
    julkaisemista ja luokittelua, arvopapereita koskevaa mainontaa, esitteen täydennyksiä
    ja notifiointiportaalia koskevilla teknisillä sääntelystandardeilla sekä komission
    delegoidun asetuksen (EU) N:o 382/2014 ja komission delegoidun asetuksen (EU)
    2016/301 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/979 оd 14. ožujka 2019. o dopuni
    Uredbe (EU) 2017/1129 Europskog parlamenta i Vijeća o regulatornim tehničkim
    standardima o ključnim financijskim informacijama iz sažetka prospekta, objavi
    i razvrstavanju prospekata, oglašavanju vrijednosnih papira, dopunama prospekta
    i portalu za obavješćivanje te o stavljanju izvan snage Delegirane uredbe Komisije
    (EU) br. 382/2014 i Delegirane uredbe Komisije (EU) 2016/301
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/979 felhatalmazáson alapuló rendelete (2019. március
    14.) az (EU) 2017/1129 európai parlamenti és tanácsi rendeletnek a tájékoztató
    összefoglalójában szereplő kiemelt pénzügyi információkra, a tájékoztatók
    közzétételére és besorolására, az értékpapírreklámokra, a tájékoztató
    kiegészítéseire és az iratküldési portálra vonatkozó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről, valamint a 382/2014/EU
    és az (EU) 2016/301 felhatalmazáson alapuló bizottsági rendeletnek a hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2019/979 della Commissione, del 14 marzo 2019,
    che integra il regolamento (UE) 2017/1129 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione relative alle informazioni
    finanziarie chiave nella nota di sintesi del prospetto, alla pubblicazione e alla
    classificazione dei prospetti, alla pubblicità relativa ai titoli, ai supplementi
    al prospetto e al portale di notifica, e che abroga i regolamenti delegati (UE)
    n. 382/2014 e (UE) 2016/301 della Commissione
  type: main
- language: lv
  script: Latn
