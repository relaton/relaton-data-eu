    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/1129
    w odniesieniu do regulacyjnych standardów technicznych dotyczących kluczowych
    informacji finansowych w podsumowaniu prospektu, publikacji i klasyfikacji prospektów,
    reklam papierów wartościowych, suplementów do prospektu i portalu zgłoszeniowego
