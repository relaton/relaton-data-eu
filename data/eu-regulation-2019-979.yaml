    Europos Parlamento ir Tarybos reglamentas (ES) 2017/1129 papildomas prospekto
    santraukoje pateikiamos pagrindinės finansinės informacijos, prospektų skelbimo
    ir klasifikavimo, vertybinių popierių reklamos, prospekto priedų ir pranešimų
    portalo techniniais reguliavimo standartais ir kuriuo panaikinamas Komisijos deleguotasis
    reglamentas (ES) Nr. 382/2014 ir Komisijos deleguotasis reglamentas (ES) 2016/301
  type: main
- language: mt
  script: Latn
