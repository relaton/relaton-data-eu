    tehniskajiem standartiem par finanšu pamatinformāciju prospekta kopsavilkumā,
    prospektu publicēšanu un klasificēšanu, vērtspapīru reklāmām, prospekta
    papildinājumiem un paziņojumu portālu un ar ko atceļ Komisijas Deleģēto
    regulu (ES) Nr. 382/2014 un Komisijas Deleģēto regulu (ES) 2016/301
  type: main
- language: lt
  script: Latn
