title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/979 of 14 March 2019 supplementing
    Regulation (EU) 2017/1129 of the European Parliament and of the Council with regard
    to regulatory technical standards on key financial information in the summary
    of a prospectus, the publication and classification of prospectuses, advertisements
    for securities, supplements to a prospectus, and the notification portal, and
    repealing Commission Delegated Regulation (EU) No 382/2014 and Commission Delegated
    Regulation (EU) 2016/301
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/979 de la Commission du 14 mars 2019 complétant
    le règlement (UE) 2017/1129 du Parlement européen et du Conseil par des normes
    techniques de réglementation concernant les informations financières clés dans
    le résumé d’un prospectus, la publication et le classement des prospectus,
    les communications à caractère promotionnel sur les valeurs mobilières, les
    suppléments au prospectus et le portail de notification, et abrogeant le règlement
    délégué (UE) no 382/2014 de la Commission et le règlement délégué (UE)
    2016/301 de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/979 der Kommission vom 14. März 2019 zur
    Ergänzung der Verordnung (EU) 2017/1129 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards für wesentliche Finanzinformationen
    in der Zusammenfassung des Prospekts, die Veröffentlichung und Klassifizierung
    von Prospekten, die Werbung für Wertpapiere, Nachträge zum Prospekt und das
    Notifizierungsportal und zur Aufhebung der Delegierten Verordnung (EU) Nr. 382/2014
    der Kommission und der Delegierten Verordnung (EU) 2016/301 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2019/979 на Комисията
