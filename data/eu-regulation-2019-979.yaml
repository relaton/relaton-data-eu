    (ЕС) 2017/1129 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    относно основната финансова информация, съдържаща
    се в резюмето на проспекта, публикуването и
    класифицирането на проспектите, рекламните
    съобщения за ценни книжа, допълненията към
    проспектите, както и портала за уведомления
    и за отмяна на Делегиран регламент (ЕС) № 382/2014
    на Комисията и Делегиран регламент (ЕС) 2016/301
    на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2019/979 ze dne 14. března
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/1129,
    pokud jde o regulační technické normy pro klíčové finanční informace ve
    shrnutí prospektu, zveřejňování a klasifikaci prospektů, propagační sdělení
    týkající se cenných papírů, dodatky prospektu a oznamovací portál, a zrušuje
    nařízení Komise v přenesené pravomoci (EU) č. 382/2014 a nařízení Komise
    v přenesené pravomoci (EU) 2016/301
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2019/979 af 14. marts 2019 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2017/1129
    for så vidt angår reguleringsmæssige tekniske standarder for nøgleregnskabsoplysninger
    i prospektresuméet, offentliggørelse og klassificering af prospekter, annoncering
    vedrørende værdipapirer, tillæg til et prospekt og meddelelsesportalen, og
    om ophævelse af Kommissionens delegerede forordning (EU) nr. 382/2014 og Kommissionens
    delegerede forordning (EU) 2016/301
