    delegowane Komisji (UE) 2016/301
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2019/979 da Comissão, de 14 de março de 2019,
    que complementa o Regulamento (UE) 2017/1129 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação sobre a informação
    financeira fundamental constante do sumário dos prospetos, a publicação e a
    classificação de prospetos, os anúncios relativos a valores mobiliários, as
    adendas a prospetos e o portal de notificação, e que revoga o Regulamento Delegado
    (UE) n.o 382/2014 da Comissão e o Regulamento Delegado (UE) 2016/301 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2019/979 al Comisiei din 14 martie 2019 de completare
    a Regulamentului (UE) 2017/1129 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare referitoare la informațiile
    financiare esențiale din rezumatul prospectului, publicarea și clasificarea
    prospectelor, comunicările cu caracter publicitar privind valorile mobiliare,
    suplimentele la prospect și portalul pentru notificări și de abrogare a Regulamentului
    delegat (UE) nr. 382/2014 al Comisiei și a Regulamentului delegat (UE) 2016/301
    al Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2019/979 zo 14. marca 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2017/1129, pokiaľ
    ide o regulačné technické predpisy týkajúce sa kľúčových finančných
    informácií v súhrne prospektu, uverejnenia a klasifikácie prospektov, inzerátov
    na cenné papiere, dodatkov k prospektu a notifikačného portálu, a ktorým
    sa zrušuje delegované nariadenie Komisie (EÚ) č. 382/2014 a delegované nariadenie
    Komisie (EÚ) 2016/301
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/979 z dne 14. marca 2019 o dopolnitvi
    Uredbe (EU) 2017/1129 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi o ključnih finančnih informacijah v povzetku prospekta, objavi in
    razvrstitvi prospektov, oglasih za vrednostne papirje, dodatkih k prospektu in
    portalu za uradno obveščanje ter o razveljavitvi Delegirane uredbe Komisije
    (EU) št. 382/2014 in Delegirane uredbe Komisije (EU) 2016/301
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2019/979 de la Comisión, de 14 de marzo de 2019,
    por el que se completa el Reglamento (UE) 2017/1129 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación sobre la información
    financiera fundamental en la nota de síntesis de un folleto, la publicación
    y clasificación de los folletos, la publicidad de los valores, los suplementos
    de un folleto y el portal de notificación, y se derogan el Reglamento Delegado
    (UE) n.o 382/2014 de la Comisión y el Reglamento Delegado (UE) 2016/301 de la
    Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2019/979 av den 14 mars 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/1129
    vad gäller tekniska standarder för tillsyn i fråga om finansiell nyckelinformation
    i sammanfattningen av ett prospekt, offentliggörande och klassificering av prospekt,
    annonsering om värdepapper, tillägg till ett prospekt och anmälningsportalen
    samt om upphävande av kommissionens delegerade förordning (EU) nr 382/2014 och
    kommissionens delegerade förordning (EU) 2016/301
