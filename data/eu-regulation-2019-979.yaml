  script: Latn
  content: Gedelegeerde Verordening (EU) 2019/979 van de Commissie van 14 maart 2019
    houdende aanvulling van Verordening (EU) 2017/1129 van het Europees Parlement
    en de Raad met technische reguleringsnormen betreffende essentiële financiële
    informatie in de samenvatting van een prospectus, de publicatie en classificatie
    van prospectussen, reclame voor effecten, aanvullingen van een prospectus, en
    het kennisgevingsportaal, en tot intrekking van Gedelegeerde Verordening (EU)
    nr. 382/2014 van de Commissie en Gedelegeerde Verordening (EU) 2016/301 van de
    Commissie
  type: main
- language: pl
  script: Latn
