title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 769/76 of 2 April 1976 re-establishing the
    levying of customs duties on handkerchiefs of cotton fabric, falling within heading
    No ex 61.05, originating in India to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3002/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 769/76 de la Commission, du 2 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, en tissus de coton, de la position tarifaire EX 61.05, originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3002/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 769/76 der Kommission vom 2. April 1976 über die
    Wiedereinführung des Zollsatzes für Taschentücher und Ziertaschentücher, aus
    Baumwolle, der Tarifnummer ex 61.05, mit Ursprung in Indien, dem die in der Verordnung
    (EWG) Nr. 3002/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 769/76 af 2. april 1976 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, af bomuld, under position
    ex 61.05, som har oprindelse i Indien om omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 769/76 della Commissione, del 2 aprile 1976, che ripristina
    la riscossione dei dazi doganali applicabili ai fazzoletti da naso e da taschino,
    di tessuti di cotone, della voce doganale ex 61.05, originari dell'India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3002/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 769/76 van de Commissie van 2 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zakdoeken,
    van weefsels van katoen, van post ex 61.05, van oorsprong uit India, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3002/75
    van de Raad van 17 november 1975
  type: main
