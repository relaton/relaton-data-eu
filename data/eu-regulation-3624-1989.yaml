  content: Commission Regulation (EEC) No 3624/89 of 1 December 1989 amending Regulation
    (EEC) No 3105/87 as regards the admissibility of applications for and the term
    of validity of licences issued under the special arrangements for imports of maize
    and grain sorghum into Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3624/89 de la Commission du 1er décembre 1989 modifiant
