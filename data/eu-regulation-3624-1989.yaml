    der Gültigkeitsdauer der im Rahmen der Sonderregelung für die Einfuhr von Mais
    und Sorghum nach Spanien erteilten Lizenzen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3624/89 af 1. december 1989 om ændring
