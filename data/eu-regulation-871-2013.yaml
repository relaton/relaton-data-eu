title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 871/2013 of 2 September 2013 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) No 511/2010
    on imports of molybdenum wire, containing by weight at least 99,95 % of molybdenum,
    of which the maximum cross-sectional dimension exceeds 1,35 mm but does not exceed
    4,0 mm, originating in the People’s Republic of China to imports of molybdenum
    wire, containing by weight at least 97 % of molybdenum, of which the maximum cross-sectional
    dimension exceeds 1,35 mm but does not exceed 4,0 mm, originating in the People’s
    Republic of China
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 871/2013 du conseil du 2 septembre
    2013 portant extension du droit antidumping définitif institué par le règlement
    d’exécution (UE) n ° 511/2010 sur les importations de fils en molybdène contenant,
    en poids, au moins 99,95 % de molybdène, dont la plus grande dimension de la
    section transversale est supérieure à 1,35 mm, mais n’excède pas 4,0 mm,
    originaires de la République populaire de Chine, aux importations de fils en
    molybdène contenant, en poids, au moins 97 % de molybdène, dont la plus grande
    dimension de la section transversale est supérieure à 1,35 mm, mais n’excède
    pas 4,0 mm, originaires de la République populaire de Chine
  type: main
- language: de
