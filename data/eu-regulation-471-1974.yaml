title:
- language: en
  script: Latn
  content: Regulation (EEC) No 471/74 of the Commission of 26 February 1974 re-establishing
    the levying of customs duties on glazed setts, flags and paving, hearth and wall
    tiles falling within heading No 69.08, originating in South Korea, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3501/73
    of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 471/74 de la Commission, du 26 février 1974 portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position tarifaire 69.08,
    originaires de la Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 471/74 der Kommission vom 26. Februar 1974 zur Wiedereinführung
    des Zollsatzes für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, der Tarifnummer 69.08, mit Ursprung in Süd-Korea, dem die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 471/74 af 26. februar 1974 om genindførsel
    af opkrævning af toldafgifter for glaserede sten og fliser til brolægning, gulvbeklædning
    eller beklædning af vægge, kaminer o. lign. underposition 69.08 som har oprindelse
    i Syd-Korea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 471/74 della Commissione, del 26 febbraio 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle altre piastrelle,
    blocchetti e lastre di pavimentazione o da rivestimento, della voce doganale n.
    69.08, originari della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 5501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 471/74 van de Commissie van 26 februari 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere plavuizen
    en andere vloer- en wandtegels van post 69.08, van oorsprong uit Zuid-Korea, ten
    behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
