    εφαρμογής τελωνειακών δασμών για τα νήματα
    εκ μη συνεχών συνθετικών υφαντικών ινών, προϊόντα
    της κατηγορίας 22 (κωδικός 40.0220), καταγωγής Πακιστάν,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3925/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2039/87 della Commissione del 10 luglio 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai filati di fibre tessili sintetiche
    in fiocco della categoria di prodotti n. 22 (codice 40.0220), originari del Pakistan
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3925/86
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2039/87 van de Commissie van 10 juli 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische stapelvezels van de categorie van produkten nr. 22 (codenummer 40.0220),
    van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2039/87 da Comissão de 10 de Julho de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a fios de fibras têxteis
    descontínuas da categoria de produtos n.° 22 (código 40.0220), originários
    do Paquistão, beneficiário das preferências pautais previstas no Regulamento
