title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2039/87 of 10 July 1987 re-establishing
    the levying of customs duties on yarn of man-made fibres (discontinuous or waste),
    products of category 22 (code 40.0220), originating in Pakistan to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2039/87 de la Commission du 10 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques discontinues, de la catégorie 22 (code 40.0220),
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2039/87 der Kommission vom 10. Juli 1987 zur Wiedereinführung
    des Zollsatzes für Garne aus synthetischen Spinnfasern der Warenkategorie Nr.
    22 (Kennziffer 40.0220) mit Ursprung in Pakistan, dem die in der Verordnung (EWG)
    Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2039/87 af 10. juli 1987 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre eller af affald
    af kemofibre under varekategori nr. 22 (kode 40.0220), som har oprindelse i Pakistan
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2039/87 της Επιτροπής
