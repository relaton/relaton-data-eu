    eläviä nautaeläimiä koskevan tariffikiintiön soveltamista koskevista tietyistä
    yksityiskohtaisista säännöistä vuodeksi 1997
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2511/96 della Commissione del 23 dicembre 1996 che
