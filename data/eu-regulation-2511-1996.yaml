    bovine animals weighing from 160 to 300 kilograms and originating in certain third
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2511/96 de la Commission du 23 décembre 1996 établissant
    pour l'année 1997 certaines modalités d'application pour un contingent tarifaire
    d'animaux vivants de l'espèce bovine d'un poids de 160 à 300 kilogrammes, originaires
    de certains pays tiers
  type: main
