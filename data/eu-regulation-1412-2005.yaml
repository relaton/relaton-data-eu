title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1412/2005 of 26 August 2005 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in August 2005 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for Bulgaria and Romania
  type: main
- language: fr
  script: Latn
