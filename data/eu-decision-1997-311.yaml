title:
- language: en
  script: Latn
  content: '97/311/EC: Commission Decision of 6 May 1997 amending Decision 96/742/EC
    drawing up a list of border inspection posts agreed for veterinary checks on products
    and animals from third countries and laying down detailed rules concerning the
    checks to be carried out by the veterinary experts of the Commission'
  type: main
- language: fr
  script: Latn
  content: '97/311/CE: Décision de la Commission du 6 mai 1997 modifiant la décision
    96/742/CE établissant une liste des postes d''inspection frontaliers agréés
    pour les contrôles vétérinaires sur les produits et animaux en provenance des
    pays tiers et définissant les modalités des contrôles à effectuer par les
    experts vétérinaires de la Commission'
  type: main
- language: de
  script: Latn
  content: '97/311/EG: Entscheidung der Kommission vom 6. Mai 1997 zur Änderung der
    Entscheidung 96/742/EG zur Festlegung eines Verzeichnisses der für die Veterinärkontrollen
    von Erzeugnissen und Tieren aus Drittländern zugelassenen Grenzkontrollstellen
    und zur Festlegung genauer Bestimmungen über die von den tierärztlichen Sachverständigen
    der Kommission durchzuführenden Kontrollen'
  type: main
- language: da
  script: Latn
  content: '97/311/EF: Kommissionens Beslutning af 6. maj 1997 om ændring af beslutning
    96/742/EF om en liste over grænsekontrolsteder, der er godkendt til at føre
    veterinærkontrol med produkter og dyr fra tredjelande, og om nærmere regler
    for den kontrol, som Kommissionens veterinærsagkyndige skal føre'
  type: main
- language: el
  script: Grek
  content: '97/311/ΕΚ: Απόφαση της Επιτροπής της 6ης Μαΐου
    1997 σχετικά με την τροποποίηση της απόφασης
    96/742/ΕΚ για την κατάρτιση καταλόγου μεθοριακών
    σταθμών επιθεώρησης που είναι εγκεκριμένοι
    για τη διενέργεια κτηνιατρικών ελέγχων σε
    προϊόντα και ζώα από τρίτες χώρες και για τον
    καθορισμό λεπτομερών κανόνων όσον αφορά τους
    ελέγχους που πρέπει να διενεργούνται από τους
    εμπειρογνώμονες κτηνιάτρους της Επιτροπής'
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 6 päivänä toukokuuta 1997, kolmansista maista
    tuotavien tuotteiden ja eläinten eläinlääkärintarkastuksia varten hyväksyttyjen
    rajatarkastusasemien luettelosta ja komission eläinlääkintäasiantuntijoiden
    suorittamia tarkastuksia koskevista yksityiskohtaisista säännöistä tehdyn
    päätöksen 96/742/EY muuttamisesta
  type: main
- language: it
  script: Latn
  content: '97/311/CE: Decisione della Commissione del 6 maggio 1997 recante modifica
    della decisione 96/742/CE che stabilisce l''elenco dei posti d''ispezione frontalieri
    riconosciuti ai fini dei controlli veterinari sui prodotti e sugli animali provenienti
    dai paesi terzi e che definisce norme dettagliate sui controlli che debbono essere
    effettuati dagli esperti veterinari della Commissione'
  type: main
- language: nl
  script: Latn
  content: '97/311/EG: Beschikking van de Commissie van 6 mei 1997 houdende wijziging
    van Beschikking 96/742/EG tot vaststelling van de lijst van inspectieposten aan
    de grens die zijn erkend voor de veterinaire controles van producten en dieren
    uit derde landen en tot vaststelling van uitvoeringsbepalingen inzake de door
    de veterinaire deskundigen van de Commissie te verrichten controles'
  type: main
- language: pt
  script: Latn
  content: '97/311/CE: Decisão da Comissão de 6 de Maio de 1997 que altera a Decisão
    96/742/CE que estabelece uma lista de postos de inspecção fronteiriços aprovados
    para a realização dos controlos veterinários de produtos e animais provenientes
    de países terceiros e as regras de execução dos controlos a efectuar pelos
    peritos veterinários da Comissão'
  type: main
- language: es
  script: Latn
  content: '97/311/CE: Decisión de la Comisión de 6 de mayo de 1997 que modifica
    la Decisión 96/742/CE por la que se establece una lista de puestos de inspección
    fronterizos autorizados para efectuar los controles veterinarios de los productos
    y animales procedentes de terceros países, así como disposiciones específicas
    referentes a los controles que deben llevar a cabo los expertos veterinarios de
    la Comisión'
  type: main
- language: sv
  script: Latn
  content: '97/311/EG: Kommissionens beslut av den 6 maj 1997 om ändring av beslut
    96/742/EG om upprättande av en förteckning över gränskontrollstationer som
    godkänts för veterinärkontroller av produkter och djur från tredje land och
    om fastställande av närmare bestämmelser om de kontroller som skall utföras
    av kommissionens veterinärexperter'
  type: main
