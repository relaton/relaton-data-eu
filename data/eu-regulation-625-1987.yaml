    χωρών και εδαφών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 625/87 del Consiglio del 27 febbraio 1987 che proroga
    il regolamento (CEE) n. 486/85 relativo al regime applicabile a taluni prodotti
    agricoli ed a talune merci risultanti dalla trasformazione di prodotti agricoli,
    originari degli Stati dell' Africa, dei Caraibi e del Pacifico (Stati ACP) o dei
    paesi e territori d' oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 625/87 van de Raad van 27 februari 1987 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 486/85 inzake de regeling voor
    landbouwprodukten en bepaalde door verwerking van landbouwprodukten verkregen
    goederen, van oorsprong uit de Staten in Afrika, het Caribische gebied en de Stille
    Oceaan (ACS-Staten) of uit de landen en gebieden overzee
  type: main
- language: pt
  script: Latn
