title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 625/87 of 27 February 1987 extending Regulation
    (EEC) No 486/85 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific States or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 625/87 du Conseil du 27 février 1987 prorogeant le
    règlement (CEE) n° 486/85 relatif au régime applicable à des produits agricoles
    et à certaines marchandises résultant de la transformation de produits agricoles
    originaires des États d' Afrique, des Caraïbes et du Pacifique (États ACP)
    ou des pays et territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 625/87 des Rates vom 27. Februar 1987 zur Verlängerung
    der Verordnung (EWG) Nr. 486/85 über die Regelung für landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP-Staaten)
    oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 625/87 af 27. februar 1987 om forlængelse
    af gyldigheden af forordning (EØF) nr. 486/85 om den ordning, der skal gælde
    for landbrugsprodukter og visse varer fremstillet af landbrugsprodukter med oprindelse
    i staterne i Afrika, Vestindien og Stillehavet (AVS-staterne) eller i de oversøiske
    lande og territorier
  type: main
- language: el
  script: Grek
