schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1160/80 of 7 May 1980 re-establishing the
    levying of customs duties on other rubber tyres (including tyre cases with sewn-in
    inner tubes, for racing bicycles, and tyre flaps), falling within heading No ex
    40.11 and originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1160/80 de la Commission, du 7 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux autres bandages (y compris
    les "flaps" et les boyaux), de la position ex 40.11 du tarif douanier commun,
    originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1160/80 der Kommission vom 7. Mai 1980 zur Wiedereinführung
    des Zollsatzes für andere Reifen (einschließlich Felgenbänder und Schlauchreifen)
    der Tarifnummer ex 40.11 mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1160/80 af 7. maj 1980 om genindførelse
    af opkrævning af toldafgifter for andre dæk (herunder dæk med isat slange,
    til racercykler, og fælgbånd) under position ex 40.11, som har oprindelse i
    Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1160/80 della Commissione, del 7 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili a altre gomme piene o
    semipiene [compresi i proiettori (flaps) e i tubolari], della voce ex 40.11 della
    tariffa doganale comune, originari della Iugoslavia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1160/80 van de Commissie van 7 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere banden
    (velglinten en tuben daaronder begrepen), van post ex 40.11, van oorsprong uit
    Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
