id: EURegulation6841980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 684/80 of 20 March 1980 re-establishing
    the levying of customs duties on carpets, carpeting and rugs, knotted (made up
    or not), products of category 58 a) (code 0582), originating in India, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2894/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 684/80 de la Commission, du 20 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux tapis à
    points noués ou enroulés, même confectionnés, de la catégorie 58 a (code
    0582), originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 684/80 der Kommission vom 20. März 1980 über die
    Wiedereinführung des Zollsatzes für geknüpfte Teppiche, auch konfektioniert,
    der Warenkategorie Nr. 58a (Kennziffer 0582), mit Ursprung in Indien, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 684/80 af 20. marts 1980 om genindførelse
    af opkrævning af toldafgifter for gulvtæpper (herunder gulvløbere og måtter)
    knyttede, også konfektionerede, under varekategori 58a (kode 0582), som har oprindelse
    i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 684/80 della Commissione, del 20 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili ai tappeti a punti annodati od arrotondati,
    anche confezionati, della categoria di prodotti n. 58 a (codice 0582) originari
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 684/80 van de Commissie van 20 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapijten,
    geknoopt of met opgerolde polen, ook indien geconfectioneerd, van de categorie
    van produkten nr. 58a (codenummer 0582), van oorsprong uit India, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79
    van de Raad
  type: main
