    τα κουκιά, τα φούλια και τα γλυκά λούπινα, τις
    αποξηραμένες ζωοτροφές καθώς και της επιστροφής
    για τους κραμβόσπορους και τους γογγυλόσπορους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 31/90 della Commissione, del 6 gennaio 1990, recante
    sospensione della fissazione anticipata degli importi compensativi monetari, degli
    aiuti per i semi di colza, ravizzone e girasole e di soia, per i piselli, le fave,
    le favette e i lupini dolci, nonché per i foraggi essiccati e della restituzione
    per i semi di colza e di ravizzone
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 31/90 van de Commissie van 6 januari 1990 tot schorsing
    van de vaststelling vooraf van de monetaire compenserende bedragen, van de steun
    voor koolzaad, raapzaad en zonnebloemzaad, sojabonen, erwten, tuin- en veldbonen
    en niet-bittere lupinen en gedroogde voedergewassen, alsmede van de restitutie
    voor kool- en raapzaad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 31/90 da Comissão, de 6 de Janeiro de 1990, que
    suspende a fixação prévia dos montantes compensatórios monetários, das ajudas
    para as sementes de colza, de nabita e de girassol, de soja, de ervilha, de fava,
    fava forrageira e tremoço doce, de forragem seca, e da restituição para as
    sementes de colza e de nabita
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 31/90 de la Comisión, de 6 de enero de 1990, por
    el que se suspende la fijación anticipada de los montantes compensatorios monetarios,
    de las ayudas para las semillas de colza, nabina y girasol, de soja, guisantes,
    habas, haboncillos y altramuces dulces, de los forrajes desecados, así como la
    suspensión de la restitución para las semillas de colza y de nabina
  type: main
