title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 31/90 of 6 January 1990 suspending advance
    fixing of monetary compensatory amounts, of aid for rape and sunflower seed, peas,
    field beans and sweet lupins, and dried fodder, and of the refund on rape seed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 31/90 de la Commission, du 6 janvier 1990, portant
    suspension de la fixation à l'avance des montants compensatoires monétaires,
    des aides pour les graines de colza, de navette et de tournesol, de soja, les
    pois, fèves, féveroles et lupins doux, les fourrages séchés ainsi que de la
    restitution pour les graines de colza et de navette
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 31/90 der Kommission vom 6. Januar 1990 zur Aussetzung
    der Vorausfestsetzung der Währungsausgleichsbeträge und der Erstattung für
    Raps- und Rübsensamen sowie der Beihilfen für Raps- und Rübsensamen, Sonnenblumenkerne,
    Sojabohnen, Erbsen, Puff- und Ackerbohnen, Süßlupinen und Trockenfutter
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 31/90 af 6. januar 1990 om suspension
    af forudfastsættelsen af de monetære udligningsbeløb, støtten for raps-, rybs-
    og solsikkefrø, støtten for sojabønner, støtten for ærter, bønner, hestebønner
    og sødlupiner, og støtten for tørret foder samt restitutionen for raps- og
    rybsfrø
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 31/90 της Επιτροπής
