title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2126/1999 of 6 October 1999 re-introducing
    normal customs duties on certain tubes, pipes and hollow profiles of iron or steel
    originating in the Republics of Bosnia and Herzegovina and Croatia, for which
    a tariff ceiling was opened by Council Regulation (EC) No 70/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2126/1999 de la Commission, du 6 octobre 1999, portant
    rétablissement de la perception des droits de douane normaux applicables à certains
    tubes, tuyaux et profilés creux, en fer ou en acier originaires des Républiques
    de Bosnie-et-Herzégovine et de Croatie, pour lesquels un plafond tarifaire a
    été ouvert par le règlement (CE) nº 70/97 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2126/1999 der Kommission vom 6. Oktober 1999 zur Wiedererhebung
    der Regelzölle für bestimmte Rohre und Hohlprofile aus Eisen oder Stahl mit
    Ursprung in den Republiken Bosnien-Herzegowina und Kroatien, denen gemäß der
    Verordnung (EG) Nr. 70/97 des Rates ein Zollplafond gewährt wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2126/1999 af 6. oktober 1999 om genindførelse
    af opkrævning af normal told for visse rør og hule profiler af jern og stål
    med oprindelse i Republikken Bosnien-Hercegovina og Republikken Kroatien, for
    hvilke der er indført et toldloft ved Rådets forordning (EF) nr. 70/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2126/1999 της Επιτροπής,
    της 6ης Οκτωβρίου 1999, σχετικά με την επαναφορά
    της είσπραξης των κανονικών τελωνειακών δασμών
    που εφαρμόζονται σε ορισμένους σωλήνες κάθε
    είδους και είδη με καθορισμένη μορφή κοίλα,
    από σίδηρο ή χάλυβα, καταγωγής των Δημοκρατιών
    της Βοσνίας-Ερζεγοβίνης και της Κροατίας, για
    τους οποίους ανοίχθηκε δασμολογική οροφή από
    τον κανονισμό (ΕΚ) αριθ. 70/97 του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2126/1999, annettu 6 päivänä lokakuuta 1999,
    tiettyjen Bosnian ja Hertsegovinan sekä Kroatian tasavalloista peräisin olevien
    neuvoston asetuksessa (EY) N:o 70/97 säädettyjen tariffikattojen soveltamisalaan
    kuuluvien raudasta ja teräksestä valmistettujen putkien tai profiiliputkien
    tavanomaisten tullien uudelleen käyttöön ottamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2126/1999 della Commissione, del 6 ottobre 1999, che
    ripristina la riscossione dei dazi doganali normali applicabili a taluni tubi
    e profilati cavi, di ferro o di acciaio, originari delle repubbliche di Bosnia-Erzegovina
    e di Croazia, che beneficiano di un massimale tariffario previsto dal regolamento
    (CE) n. 70/97 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2126/1999 van de Commissie van 6 oktober 1999 tot
    wederinstelling van de heffing van de normale douanerechten voor bepaalde buizen,
