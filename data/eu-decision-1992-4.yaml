title:
- language: en
  script: Latn
  content: '92/4/EEC: Commission Decision of 22 November 1991 authorizing the United
    Kingdom to extend intra-Community surveillance in respect of bananas originating
    in certain third countries and put into free circulation in the other Member States
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/4/CEE: Décision de la Commission, du 22 novembre 1991, autorisant
    le Royaume-Uni à proroger les mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/4/EWG: Entscheidung der Kommission vom 22. November 1991 zur Ermächtigung
    des Vereinigten Königreichs zur Verlängerung einer innergemeinschaftlichen Überwachung
    von aus bestimmten Drittländern stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Bananen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/4/EØF: Kommissionens beslutning af 22. november 1991 om bemyndigelse
    af Det Forenede Kongerige til at forlænge foranstaltninger med henblik på tilsyn
    inden for Fællesskabet med indførsel af bananer, der har oprindelse i visse
    tredjelande, og som er overgået til fri omsætning i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/4/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Νοεμβρίου
    1991 περί χορηγήσεως αδείας στο Ηνωμένο Βασίλειο
    να παρατείνει την ενδοκοινοτική επιτήρηση
    όσον αφορά τις μπανάνες καταγωγής ορισμένων
    τρίτων χωρών οι οποίες τίθενται σε ελεύθερη
    κυκλοφορία στα άλλα κράτη μέλη (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '92/4/CEE: Decisione della Commissione, del 22 novembre 1991, che autorizza
    il Regno Unito a prorogare le misure di sorveglianza intracomunitaria nei confronti
    delle banane originarie di taluni paesi terzi e messe in libera pratica negli
    altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '92/4/EEG: Beschikking van de Commissie van 22 november 1991 waarbij het
    Verenigd Koninkrijk wordt gemachtigd maatregelen inzake intracommunautair toezicht
    te verlengen ten aanzien van bananen van oorsprong uit bepaalde derde landen en
    in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst in de
    Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/4/CEE: Decisão da Comissão, de 22 de Novembro de 1991, que autoriza
    o Reino Unido a prorrogar as medidas de vigilância intracomunitária em relação
    às bananas originárias de certos países terceiros e introduzidas em livre prática
    nos outros Estados-membros (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '92/4/CEE: Decisión de la Comisión, de 22 de noviembre de 1991, por la
    que se autoriza al Reino Unido a prorrogar las medidas de vigilancia intracomunitaria
    respecto de los plátanos originarios de determinados terceros países y despachados
    a libre práctica en los demás Estados miembros (El texto en lengua inglesa es
    el único auténtico)'
