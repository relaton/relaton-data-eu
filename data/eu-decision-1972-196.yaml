type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 avril 1972, autorisant la République
    française à exclure du traitement communautaire les lampes électriques portatives
    destinées à fonctionner au moyen de leur propre source d'énergie (à piles,
    à accumulateurs, électromagnétiques, etc.), de la position 85.10 B du Tarif
    douanier commun, originaires de Hong-Kong et mises en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '72/196/EWG: Entscheidung der Kommission vom 21. April 1972, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche tragbare elektrische Leuchten zum
    Betrieb mit eigener Stromquelle (z.B. Primärbatterien, Akkumulatoren oder Dynamo)
    der Tarifnummer 85.10 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/196/CEE: Decisione della Commissione, del 21 aprile 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le lampade elettriche
    portatili destinate a funzionare a mezzo di una propria sorgente di energia (a
    pile, ad accumulatori, elettromagnetiche, ecc.) della voce n. 85.10 B della tariffa
    doganale comune, originari di Hong Kong e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/196/EEG: Beschikking van de Commissie van 21 april 1972 waarbij de
    Franse Republiek wordt gemachtigd draagbare elektrische lampen, bestemd om met
    eigen energiebron te werken (met elementen of batterijen, met accumulatoren, met
    ingebouwde dynamo, enz). van post 85.10 B van het gemeenschappelijk douanetarief,
    van oorsprong van Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
