title:
- language: en
  script: Latn
  content: Council Directive 97/42/EC of 27 June 1997 amending for the first time
    Directive 90/394/EEC on the protection of workers from the risks related to exposure
    to carcinogens at work (Sixth individual Directive within the meaning of Article
    16 (1) of Directive 89/391/EEC)
  type: main
- language: fr
  script: Latn
  content: Directive 97/42/CE du Conseil du 27 juin 1997 portant première modification
    de la directive 90/394/CEE concernant la protection des travailleurs contre les
    risques liés à l'exposition à des agents cancérigènes au travail (sixième
    directive particulière au sens de l'article 16 paragraphe 1 de la directive 89/391/CEE)
  type: main
- language: de
  script: Latn
  content: Richtlinie 97/42/EG des Rates vom 27. Juni 1997 zur ersten Änderung der
    Richtlinie 90/394/EWG über den Schutz der Arbeitnehmer gegen Gefährdung durch
    Karzinogene bei der Arbeit (Sechste Einzelrichtlinie im Sinne von Artikel 16 Absatz
    1 der Richtlinie 89/391/EWG)
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 97/42/ES ze dne 27. června 1997, kterou se poprvé mění
    směrnice 90/394/EHS o ochraně zaměstnanců před riziky spojenými s expozicí
    karcinogenům při práci (šestá samostatná směrnice ve smyslu čl. 16 odst.
    1 směrnice 89/391/EHS)
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 97/42/EF af 27. juni 1997 om første ændring af direktiv
    90/394/EØF om beskyttelse af arbejdstagerne mod risici for under arbejdet at
    være udsat for kræftfremkaldende stoffer (sjette særdirektiv i henhold til
    artikel 16, stk. 1, i direktiv 89/391/EØF)
  type: main
- language: el
  script: Grek
  content: Οδηγία 97/42/ΕΚ του Συμβουλίου της 27ης Ιουνίου
    1997 για την πρώτη τροποποίηση της οδηγίας 90/394/ΕΟΚ
    σχετικά με την προστασία των εργαζομένων από
    τους κινδύνους που συνδέονται με την έκθεση
    σε καρκινογόνους παράγοντες κατά την εργασία
    (έκτη ειδική οδηγία κατά την έννοια του άρθρου
    16 παράγραφος 1 της οδηγίας 89/391/ΕΟΚ)
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 97/42/EÜ, 27. juuni 1997, millega esimest korda muudetakse
    direktiivi 90/394/EMÜ töötajate kaitsmise kohta tööl kantserogeenidega kokkupuutest
    tulenevate ohtude eest (kuues üksikdirektiiv direktiivi 89/391/EMÜ artikli 16
    lõike 1 tähenduses)
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 97/42/EY, annettu 27 päivänä kesäkuuta 1997, työntekijöiden
    suojelemisesta syöpäsairauden vaaraa aiheuttaville tekijöille altistumiseen
    työssä liittyviltä vaaroilta annetun direktiivin 90/394/ETY muuttamisesta ensimmäistä
    kertaa (kuudes direktiivin 89/391/ETY 16 artiklan 1 kohdassa tarkoitettu erityisdirektiivi)
  type: main
- language: hu
  script: Latn
  content: A Tanács 97/42/EK irányelve (1997. június 27.) a munkájuk során rákkeltő
    anyagokkal kapcsolatos kockázatoknak kitett munkavállalók védelméről szóló
    90/394/EGK irányelv (a 89/391/EGK irányelv 16. cikke (1) bekezdésének értelmében
    a hatodik egyedi irányelv) első módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 97/42/CE del Consiglio del 27 giugno 1997 che modifica per la
    prima volta la direttiva 90/394/CEE sulla protezione dei lavoratori contro i rischi
    derivanti da un'esposizione ad agenti cancerogeni durante il lavoro (sesta direttiva
    particolare ai sensi dell'articolo 16, paragrafo 1 della direttiva 89/391/CEE)
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 97/42/EK (1997. gada 27. jūnijs), ar ko pirmoreiz groza
    Direktīvu 90/394/EEK par darba ņēmēju aizsardzību pret riska faktoriem, kas
    saistīti ar pakļaušanu kancerogēnu iedarbībai darbā (Sestā atsevišķā
    direktīva Direktīvas 89/391/EEK 16. panta 1. punkta nozīmē)
  type: main
- language: lt
  script: Latn
  content: 1997 m. birželio 27 d. Tarybos Direktyva 97/42/EB pirmą kartą iš dalies
    keičianti direktyvą 90/394/EEB dėl darbuotojų apsaugos nuo rizikos, susijusios
    su kancerogenų poveikiu darbe (šeštoji atskira Direktyva, kaip numatyta Direktyvos
    89/391/EEB 16 straipsnio 1 dalyje)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 97/42/KE tas-27 ta' Ġunju 1997 li temenda għall-ewwel
    darba d-Direttiva 90/394/KEE dwar il-protezzjoni tal-ħaddiema mir-riskji relatati
    ma' l-espożizzjoni għall-karċinoġeni fuq il-post tax-xogħol (Is-Sitt Direttiva
    individwali fis-sens ta' l-Aritikolu 16(1) tad-Direttiva 89/391/KEE)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 97/42/EG van de Raad van 27 juni 1997 tot eerste wijziging van
    Richtlijn 90/394/EEG betreffende de bescherming van de werknemers tegen de risico's
    van blootstelling aan carcinogene agentia op het werk (zesde individuele richtlijn
    in de zin van artikel 16 bis, lid 1, van Richtlijn 89/391/EEG)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 97/42/WE z dnia 27 czerwca 1997 r. po raz pierwszy zmieniająca
    dyrektywę 90/394/EWG w sprawie ochrony pracowników przed zagrożeniem dotyczącym
    narażenia na działanie czynników rakotwórczych podczas pracy (szósta dyrektywa
    szczegółowa w rozumieniu art. 16 ust. 1 dyrektywy 89/391/EWG)
  type: main
- language: pt
  script: Latn
  content: Directiva 97/42/CE do Conselho de 27 de Junho de 1997 que altera pela primeira
    vez a Directiva 90/394/CEE relativa à protecção dos trabalhadores contra riscos
    ligados à exposição a agentes cancerígenos durante o trabalho (sexta directiva
    especial na acepção do nº 1 do artigo 16º da Directiva 89/391/CEE)
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 97/42/ES z 27. júna 1997, ktorou sa prvýkrát mení a dopĺňa
    smernica 90/394/EHS o ochrane pracovníkov pred rizikami z vystavenia účinkom
    karcinogénov pri práci (šiesta samostatná smernica v zmysle článku 16 ods.
    1 smernice 89/391/EHS)
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 97/42/ES z dne 27. junija 1997 o prvi spremembi Direktive
    90/394/EGS o varstvu delavcev pred tveganji zaradi izpostavljenosti rakotvornim
    snovem pri delu (šesta posebna direktiva v skladu s členom 16(1) Direktive 89/391/EGS)
  type: main
- language: es
  script: Latn
  content: Directiva 97/42/CE del Consejo de 27 de junio de 1997 por la que se modifica
    por primera vez la Directiva 90/394/CEE relativa a la protección de los trabajadores
    contra los riesgos relacionados con la exposición a agentes carcinógenos durante
    el trabajo (Sexta Directiva específica con arreglo al apartado 1 del artículo
    16 de la Directiva 89/391/CEE)
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 97/42/EG av den 27 juni 1997 om en första ändring av
    direktiv 90/394/EEG om skydd för arbetstagare mot risker vid exponering för
    carcinogener i arbetet (sjätte särdirektivet enligt artikel 16.1 i direktiv
    89/391/EEG)
