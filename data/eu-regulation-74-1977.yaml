title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 74/77 of 14 January 1977 re-establishing
    the levying of the customs duties on glazed setts, flags and paving, hearth and
    wall tiles falling within heading No 69.08, originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3021/76
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 74/77 de la Commission, du 14 janvier 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position tarifaire 69.08,
    originaires de la Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 74/77 der Kommission vom 14. Januar 1977 zur Wiedereinführung
    des Zollsatzes für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, der Tarifnummer 69.08, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 74/77 af 14. januar 1977 om genindførelse
    af opkrævning af toldafgifter for glaserede sten og fliser til brolægning, gulvbelægning
    eller beklædning af vægge, kaminer o. lign. under position 69.08, som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 74/77 della Commissione, del 14 gennaio 1977, che
    ripristina la riscossione dei dazi doganali alle altre piastrelle, blocchetti
    e lastre da pavimentazione o da rivestimento, della voce doganale 69.08, originari
    della Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 74/77 van de Commissie van 14 januari 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere plavuizen
    en andere vloer- en wandtegels, van post 69.08, van oorsprong uit Zuid-Korea,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
