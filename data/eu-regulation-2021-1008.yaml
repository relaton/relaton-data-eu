---
id: EURegulation20211008
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1008 of 21 June 2021 amending
    Annex I to Implementing Regulation (EU) 2021/620 as regards the disease-free status
    of Croatia and a region of Portugal from infection with Brucella abortus, B. melitensis
    and B. suis in bovine animal populations, amending Annex VIII thereto as regards
    the disease-free status of Lithuania and certain regions of Germany, Italy and
    Portugal from infection with bluetongue virus (serotypes 1-24) and amending Annex
    XIII thereto as regards the disease-free status of Denmark and Finland from infectious
    haematopoietic necrosis
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1008 de la Commission du 21 juin 2021
    modifiant l’annexe I du règlement d’exécution (UE) 2021/620 en ce qui concerne
    le statut «indemne de maladie» de la Croatie et d’une région du Portugal
    au regard de l’infection à Brucella abortus, B. melitensis et B. suis chez
    les populations d’animaux de l’espèce bovine, modifiant l’annexe VIII dudit
    règlement en ce qui concerne le statut «indemne de maladie» de la Lituanie
    et de certaines régions d’Allemagne, d’Italie et du Portugal au regard de
    l’infection par le virus de la fièvre catarrhale ovine (sérotypes 1 à 24)
    et modifiant l’annexe XIII dudit règlement en ce qui concerne le statut «indemne
    de maladie» du Danemark et de la Finlande au regard de la nécrose hématopoïétique
    infectieuse
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/1008 der Kommission vom 21. Juni 2021
    zur Änderung des Anhangs I der Durchführungsverordnung (EU) 2021/620 hinsichtlich
    des Status „seuchenfrei“ Kroatiens und einer portugiesischen Region in Bezug
    auf Infektionen mit Brucella abortus, B. melitensis und B. suis in Rinderpopulationen,
    zur Änderung des Anhangs VIII der genannten Verordnung hinsichtlich des Status
    „seuchenfrei“ Litauens und bestimmter Regionen Deutschlands, Italiens und
    Portugals in Bezug auf Infektionen mit dem Virus der Blauzungenkrankheit (Serotypen
    1-24) und zur Änderung des Anhangs XIII der genannten Verordnung hinsichtlich
    des Status „seuchenfrei“ Dänemarks und Finnlands in Bezug auf die Infektiöse
    Hämatopoetische Nekrose
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/1008 на Комисията
    от 21 юни 2021 година за изменение на приложение
    I към Регламент за изпълнение (ЕС) 2021/620 във връзка
    със статута „свободен от болест“ на Хърватия
    и на един регион в Португалия по отношение
    на инфекция с Brucella abortus, B. melitensis и B. suis при популации
    на говеда, и за изменение на приложение VIII към
    него във връзка със статута „свободен от болест“
    на Литва и на някои райони на Германия, Италия
    и Португалия по отношение на инфекция с вируса
    на болестта син език (серотипове 1—24), и за изменение
    на приложение ХIII към него във връзка със статута
    „свободен от болест“ на Дания и на Финландия
    по отношение на инфекциозна хематопоетична
    некроза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/1008 ze dne 21. června 2021,
    kterým se mění příloha I prováděcího nařízení (EU) 2021/620, pokud
    jde o status Chorvatska a jedné oblasti Portugalska jako území prostého infekce
    způsobené Brucella abortus, B. melitensis a B. suis u populací skotu, mění
    příloha VIII uvedeného nařízení, pokud jde o status Litvy a určitých oblastí
    Německa, Itálie a Portugalska jako území prostého infekce virem katarální
    horečky ovcí (sérotypy 1–24), a kterým se mění příloha XIII uvedeného
    nařízení, pokud jde o status Dánska a Finska jako území prostého infekční
    nekrózy krvetvorné tkáně
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/1008 af 21. juni 2021
    om ændring af bilag I til gennemførelsesforordning (EU) 2021/620 for så vidt
    angår status som sygdomsfri for Kroatien og en region i Portugal med hensyn til
    infektion med Brucella abortus, B. melitensis og B. suis hos kvægbestande, om
    ændring af bilag VIII til nævnte forordning for så vidt angår status som sygdomsfri
    for Litauen og visse regioner i Tyskland, Italien og Portugal med hensyn til infektion
    med bluetonguevirus (serotype 1-24) og om ændring af bilag XIII til nævnte forordning
    for så vidt angår Danmarks og Finlands status som sygdomsfri med hensyn til
    infektiøs hæmatopoietisk nekrose
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/1008 της Επιτροπής
    της 21ης Ιουνίου 2021 για την τροποποίηση του
    παραρτήματος I του εκτελεστικού κανονισμού
    (ΕΕ) 2021/620 όσον αφορά το καθεστώς απαλλαγμένου
    από νόσο της Κροατίας και μιας περιφέρειας
    της Πορτογαλίας για τη λοίμωξη από Brucella abortus,
    B. melitensis και B. suis σε πληθυσμούς βοοειδών, για
    την τροποποίηση του παραρτήματος VIII του ίδιου
    κανονισμού όσον αφορά το καθεστώς απαλλαγμένου
    από νόσο της Λιθουανίας και ορισμένων περιφερειών
    της Γερμανίας, της Ιταλίας και της Πορτογαλίας
    για τη λοίμωξη από τον ιό του καταρροϊκού πυρετού
    του προβάτου (ορότυποι 1-24) και για την τροποποίηση
    του παραρτήματος XIII του ίδιου κανονισμού όσον
    αφορά το καθεστώς απαλλαγμένου από νόσο της
    Δανίας και της Φινλανδίας για τη λοιμώδη αιματοποιητική
    νέκρωση
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/1008, 21. juuni 2021, millega muudetakse
    rakendusmääruse (EL) 2021/620 I lisa seoses Horvaatia ja ühe Portugali piirkonna
    taudivaba staatusega Brucella abortus’e, B. melitensis’e ja B. suis’i nakkuse
    suhtes veisepopulatsioonides, muudetakse kõnealuse määruse VIII lisa seoses
    Leedu ning teatavate Saksamaa, Itaalia ja Portugali piirkondade taudivaba staatusega
    lammaste katarraalse palaviku viiruse serotüüpide 1–24 põhjustatud nakkuse
    suhtes ning muudetakse XIII lisa seoses Taani ja Soome taudivaba staatusega nakkusliku
    vereloomeelundite nekroosi suhtes
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/1008, annettu 21 päivänä
    kesäkuuta 2021, täytäntöönpanoasetuksen (EU) 2021/620 liitteen I muuttamisesta
    siltä osin kuin on kyse Kroatian sekä yhden Portugalin alueen taudista vapaasta
    asemasta Brucella abortus-, B. melitensis- ja B. suis -tartuntojen osalta nautaeläinpopulaatioissa,
    sen liitteen VIII muuttamisesta siltä osin kuin on kyse Liettuan ja tiettyjen
    Saksan, Italian ja Portugalin alueiden taudista vapaasta asemasta sinikieliviruksen
    (serotyypit 1–24) aiheuttamien tartuntojen osalta sekä sen liitteen XIII muuttamisesta
    siltä osin kuin on kyse Tanskan ja Suomen taudista vapaasta asemasta tarttuvan
    vertamuodostavan kudoksen kuolion osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/1008 ón gCoimisiún an 21 Meitheamh
    2021 lena leasaítear Iarscríbhinn I a ghabhann le stádas saor ó ghalar na
    Cróite agus réigiúin den Phortaingéil maidir le hionfhabhtú Brucella abortus,
    B. melitensis agus B. suis i bpobail bó-, lena leasaítear Iarscríbhinn VII
    a ghabhann leis a mhéid a bhaineann le stádas saor ó ghalar na Liotuáine agus
    réigiún áirithe den Ghearmáin, den Iodáil agus den Phortaingéil maidir le
    hionfhabhtú an víris gormtheanga (séiritíopaí 1-24) agus lena leasaítear
    Iarscríbhinn XIII a ghabhann leis, a mhéid a bhaineann le stádas saor ó ghalar
    na Danmhairge agus na Fionlainne maidir le hionfhabhtuithe neacróise fuilghinte
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/1008 оd 21. lipnja 2021. o izmjeni
    Priloga I. Provedbenoj uredbi (EU) 2021/620 u pogledu statusa „slobodno od bolesti”
    Hrvatske i jedne regije Portugala za infekcije bakterijama Brucella abortus, B.
    melitensis i B. suis u populaciji govedâ, izmjeni Priloga VIII. toj uredbi u
    pogledu statusa „slobodno od bolesti” Litve i određenih regija Njemačke,
    Italije i Portugala za infekciju virusom bolesti plavog jezika (serotipovi 1–24)
    te o izmjeni Priloga XIII. toj uredbi u pogledu statusa „slobodno od bolesti”
    Danske i Finske za zaraznu hematopoetsku nekrozu (ZHN)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1008 végrehajtási rendelete (2021. június 21.)
    az (EU) 2021/620 végrehajtási rendelet I. mellékletének Horvátországnak
    és Portugália egy régiójának szarvasmarha-állományai vonatkozásában Brucella
    abortus, B. melitensis és B. suis általi fertőzöttségtől mentes státusza
    tekintetében történő módosításáról, VIII. mellékletének Litvánia,
    valamint Németország, Olaszország és Portugália egyes régiói kéknyelv-betegséggel
    (1–24-es szerotípus) való fertőzöttségtől mentes státusza tekintetében
    történő módosításáról, valamint XIII. mellékletének Dánia és Finnország
    fertőző vérképzőszervi elhalástól mentes státusza tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/1008 della Commissione del 21 giugno
    2021 che modifica l’allegato I del regolamento di esecuzione (UE) 2021/620 per
    quanto riguarda lo status di indenne da malattia della Croazia e di una regione
    del Portogallo per l’infezione da Brucella abortus, B. melitensis e B. suis
    nelle popolazioni di bovini, modifica il suo allegato VIII per quanto riguarda
    lo status di indenne da malattia della Lituania e di alcune regioni della Germania,
    dell’Italia e del Portogallo per l’infezione da virus della febbre catarrale
    degli ovini (sierotipi 1-24) e modifica il suo allegato XIII per quanto riguarda
    lo status di indenne da malattia della Danimarca e della Finlandia per la necrosi
    ematopoietica infettiva
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/1008 (2021. gada 21. jūnijs),
    ar ko attiecībā uz Horvātijas un viena Portugāles reģiona statusu “brīvs
    no Brucella abortus, B. melitensis un B. suis infekcijas liellopu populācijās”
    groza Īstenošanas regulas (ES) 2021/620 I pielikumu, attiecībā uz Lietuvas
    un dažu Vācijas, Itālijas un Portugāles reģionu statusu “brīvs no infekciozā
    katarālā drudža vīrusa (1.–24. serotipa) infekcijas” groza minētās regulas
    VIII pielikumu un attiecībā uz Dānijas un Somijas statusu “brīva no infekciozās
    hematopoētiskās nekrozes” groza minētās regulas XIII pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/1008 2021 m. birželio 21
    d. kuriuo dėl brucelioze (Brucella abortus, B. melitensis ir B. suis infekcija)
    neužkrėstos teritorijos statuso (galvijų populiacijoje) suteikimo Kroatijai
    ir vienam Portugalijos regionui iš dalies keičiamas Įgyvendinimo reglamento
    (ES) 2021/620 I priedas, dėl mėlynojo liežuvio viruso (1–24 serologinių
    tipų) infekcija neužkrėstos teritorijos statuso suteikimo Lietuvai ir tam tikriems
    Vokietijos, Italijos ir Portugalijos regionams iš dalies keičiamas jo VIII priedas
    ir dėl infekcine hematopoetine nekroze neužkrėstos teritorijos statuso suteikimo
    Danijai ir Suomijai iš dalies keičiamas jo XIII priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1008 tal-21
    ta’ Ġunju 2021 li jemenda l-Anness I tar-Regolament ta’ Implimentazzjoni
    (UE) 2021/620 rigward l-istatus tal-Kroazja u ta’ reġjun tal-Portugall ta’
    ħelsien mill-mard tal-infezzjoni bil-Brucella abortus, bil-B. melitensis, u bil-B.
    suis fil-popolazzjonijiet tal-annimali bovini, li jemenda l-Anness VIII tiegħu
    rigward l-istatus tal-Litwanja u ta’ ċerti reġjuni tal-Ġermanja tal-Italja
    u tal-Portugall ta’ ħelsien mill-mard tal-infezzjoni bil-virus tal-ilsien blu
    (is-serotipi 1 sa 24) u li jemenda l-Anness XIII tiegħu rigward l-istatus tad-Danimarka
    u tal-Finlandja ta’ ħelsien mill-marda tan-nekrożi ematopojetika infettiva
    (IHN)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/1008 van de Commissie van 21 juni 2021
    tot wijziging van bijlage I bij Uitvoeringsverordening (EU) 2021/620 wat betreft
    de ziektevrije status van Kroatië en een regio van Portugal ten aanzien van infectie
    met Brucella abortus, B. melitensis en B. suis bij runderpopulaties, tot wijziging
    van bijlage VIII bij die verordening wat betreft de ziektevrije status van Litouwen
    en bepaalde regio’s van Duitsland, Italië en Portugal ten aanzien van infectie
    met het bluetonguevirus (serotypen 1-24) en tot wijziging van bijlage XIII bij
    die verordening wat betreft de ziektevrije status van Denemarken en Finland ten
    aanzien van infectieuze hematopoëtische necrose
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/1008 z dnia 21 czerwca 2021
    r. zmieniające załącznik I do rozporządzenia wykonawczego (UE) 2021/620 w
    odniesieniu do statusu obszaru wolnego od choroby dla Chorwacji i regionu Portugalii
    pod względem zakażenia wywoływanego przez Brucella abortus, B. melitensis i
    B. suis w populacjach bydła, zmieniające załącznik VIII do tego rozporządzenia
    w odniesieniu do statusu obszaru wolnego od choroby dla Litwy i niektórych regionów
    Niemiec, Włoch i Portugalii pod względem zakażenia wirusem choroby niebieskiego
    języka (serotypy 1–24) oraz zmieniające załącznik XIII do tego rozporządzenia
    w odniesieniu do statusu obszaru wolnego od choroby dla Danii i Finlandii pod
    względem zakaźnej martwicy układu krwiotwórczego ryb łososiowatych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/1008 da Comissão de 21 de junho de
    2021 que altera o anexo I do Regulamento de Execução (UE) 2021/620 no que se
    refere ao estatuto de indemnidade de infeção por Brucella abortus, B. melitensis
    e B. suis em populações de bovinos da Croácia e de uma região de Portugal,
    que altera o seu anexo VIII no que se refere ao estatuto de indemnidade de infeção
    pelo vírus da febre catarral ovina (serótipos 1-24) da Lituânia e de certas
    regiões da Alemanha, da Itália e Portugal e que altera o seu anexo XIII no que
    se refere ao estatuto de indemnidade de necrose hematopoiética infecciosa da
    Dinamarca e da Finlândia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/1008 al Comisiei din 21 iunie
    2021 de modificare a anexei I la Regulamentul de punere în aplicare (UE) 2021/620
    în ceea ce privește statutul de indemn de boală al Croației și al unei regiuni
    din Portugalia pentru infecția cu Brucella abortus, B. melitensis și B. suis
    la populațiile de bovine, de modificare a anexei VIII la acesta în ceea ce privește
    statutul de indemn de boală al Lituaniei și al anumitor regiuni din Germania,
    Italia și Portugalia pentru infecția cu virusul bolii limbii albastre (serotipurile
    1-24) și de modificare a anexei XIII la acesta în ceea ce privește statutul
    de indemn de boală al Danemarcei și Finlandei pentru necroza hematopoietică
    infecțioasă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1008 z 21. júna 2021, ktorým
    sa mení príloha I k vykonávaciemu nariadeniu (EÚ) 2021/620, pokiaľ ide o
    štatút Chorvátska a regiónu Portugalska bez výskytu infekcie baktériami
    Brucella abortus, B. melitensis a B. suis v populáciách hovädzieho dobytka,
    ktorým sa mení príloha VIII k uvedenému nariadeniu, pokiaľ ide o štatút
    Litvy a určitých regiónov Nemecka, Talianska a Portugalska bez výskytu infekcie
    vírusom katarálnej horúčky oviec (sérotypy 1 – 24), a ktorým sa mení
    príloha XIII k uvedenému nariadeniu, pokiaľ ide o štatút Dánska a Fínska
    bez výskytu infekčnej hematopoetickej nekrózy
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/1008 z dne 21. junija 2021 o spremembi
    Priloge I k Izvedbeni uredbi (EU) 2021/620 glede statusa Hrvaške in regije Portugalske,
    da sta prosti okužbe z Brucella abortus, B. melitensis in B. suis pri populacijah
    goveda, o spremembi Priloge VIII k navedeni uredbi glede statusa Litve ter nekaterih
    regij Nemčije, Italije in Portugalske, da so proste okužbe z virusom modrikastega
    jezika (serotipi 1–24), ter o spremembi Priloge XIII k navedeni uredbi glede
    statusa Danske in Finske, da sta prosti okužbe z infekciozno hematopoetsko nekrozo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1008 de la Comisión de 21 de junio
    de 2021 por el que se modifica el anexo I del Reglamento de Ejecución (UE) 2021/620
    en lo que respecta al estatus de libre de infección por Brucella abortus, B.
    melitensis y B. suis en las poblaciones de bovinos de Croacia y una región de
    Portugal, el anexo VIII de dicho Reglamento en lo que respecta al estatus de libre
    de infección por el virus de la lengua azul (serotipos 1-24) de Lituania y determinadas
    regiones de Alemania, Italia y Portugal y el anexo XIII del mismo Reglamento en
    lo que respecta al estatus de libre de necrosis hematopoyética infecciosa de
    Dinamarca y Finlandia
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1008 av den 21 juni 2021
    om ändring av bilaga I till genomförandeförordning (EU) 2021/620 vad gäller
    sjukdomsfri status för Kroatien och en region i Portugal avseende infektion med
    Brucella abortus, B. melitensis och B. suis i nötkreaturspopulationer, om ändring
    av bilaga VIII till den genomförandeförordningen vad gäller sjukdomsfri status
    för Litauen och vissa regioner i Tyskland, Italien och Portugal avseende infektion
    med blåtungevirus (serotyperna 1–24) och om ändring av bilaga XIII till den
    genomförandeförordningen vad gäller sjukdomsfri status för Danmark och Finland
    avseende infektiös hematopoietisk nekros
  type: main
