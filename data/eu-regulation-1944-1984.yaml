title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1944/84 of 6 July 1984 re-establishing the
    levying of customs duties on umbrellas and sunshades (including walking-stick
    umbrellas), falling within heading No 66.01 and originating in Singapore, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3569/83
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1944/84 de la Commission du 6 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, de la position 66.01 du tarif douanier commun, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1944/84 der Kommission vom 6. Juli 1984 zur Wiedereinführung
    der Erhebung der Zölle für Regenschirme und Sonnenschirme der Tarifnummer 66.01
    mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1944/84 af 6. juli 1984 om genindførelse
    af opkrævning af told for paraplyer og parasoller, henhørende under pos. 66.01
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1944/84 της Επιτροπής
    της 6ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για αλεξιβρόχια και αλεξήλια,
    της κλάσεως 66.01 του Κοινού Δασμολογίου, καταγωγής
    Σιγκαπούρης, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1944/84 della Commissione del 6 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia e da sole),
    compresi gli ombrelli-bastone, della voce 66.01 della tariffa doganale comune,
    originari di Singapore, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1944/84 van de Commissie van 6 juli 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op paraplu' s
    en parasols, van post 66.01, van oorsprong uit Singapore, waarvoor de in Verordening
    (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
