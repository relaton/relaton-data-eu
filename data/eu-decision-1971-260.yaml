  content: Décision de la Commission, du 23 juin 1971, relative à l'autorisation
    d'une convention tarifaire entre la société nationale des chemins de fer français
    (SNCF) et la société des aciéries réunies de Burbach, Eich, Dudelange (ARBED)
    pour le transport de minerai de fer de Boulange et Algrange à Audun-le-Tiche-Mont
    (GARAGE) ainsi qu'à l'autorisation du tarif franco-luxembourgeois n 3530-04 applicable
    aux transports de minerai de fer de Boulange à Esch/Belval
  type: main
