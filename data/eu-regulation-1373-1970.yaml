title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1373/70 of the Commission of 10 July 1970 on common
    detailed rules for the application of the system for import and export licences
    and advance fixing certificates for agricultural products subject to a single
    price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1373/70 de la Commission, du 10 juillet 1970, portant
    modalités communes d' application du régime de certificats d' importation, d'
    exportation et de préfixation, pour les produits agricoles soumis à un régime
    de prix unique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1373/70 der Kommission vom 10. Juli 1970 über gemeinsame
    Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen
    für landwirtschaftliche Erzeugnisse, die einem System gemeinsamer Preise unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1373/70 af 10. juli 1970 om fælles
    gennemførelsesbestemmelser for import- og eksportlicenser samt forudfastsættelsesattester
    for landbrugsvarer, for hvilke der gælder en ordning med fællespriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1373/70 della Commissione, del 10 luglio 1970, che
    stabilisce modalità comuni di applicazione per il regime dei titoli di imprtazione
    e di esportazione e dei certificati di fissazione anticipata relativi a prodotti
    agricoli soggetti ad un regime di prezzo unico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1373/70 van de Commissie van 10 juli 1970 houdende
    gemeenschappelijke uitvoeringsbepalingen inzake het stelsel van invoer-, uitvoer-
    en voorfixatiecertificaten voor landbouwprodukten waarvoor een stelsel van gemeenschappelijke
    prijzen geldt
  type: main
