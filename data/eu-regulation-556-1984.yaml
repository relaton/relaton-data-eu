title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 556/84 of 29 February 1984 re-establishing
    the levying of customs duties on other sheep and lamb skin, falling within subheading
    41.03 B II and originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 556/84 de la Commission du 29 février 1984 portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d' ovins, non dénommées, de la sous-position 41.03 B II du tarif douanier commun,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 556/84 der Kommission vom 29. Februar 1984 zur Wiedereinführung
    der Erhebung der Zölle für anderes Schaf- und Lammleder, anderes, der Tarifstelle
    41.03 B II mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3569/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 556/84 af 29. februar 1984 om genindførelse
    af opkrævning af told for andet læder af fåre- og lammeskind, andre varer,
    henhørende under pos. 41.03 B II og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 556/84 της Επιτροπής
