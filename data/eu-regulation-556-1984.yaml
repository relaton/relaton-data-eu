  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 556/84 della Commissione del 29 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili ad altre pelli ovine,
    non nominate, della sottovoce 41.03 B II della tariffa doganale comune, originarie
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 556/84 van de Commissie van 29 februari 1984 houdende
