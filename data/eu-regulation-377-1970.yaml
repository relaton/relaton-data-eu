title:
- language: en
  script: Latn
  content: Regulation (EEC) No 377/70 of the Commission of 27 February 1970 implementing,
    as regards fruit and vegetables, Regulation No 1014/67/EEC on detailed rules for
    the application of export refunds on products subject to a single price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 377/70 de la Commission, du 27 février 1970, rendant
    applicable, dans le secteur des fruits et légumes, le règlement n° 1041/67/CEE
    portant modalités d' application des restitutions à l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 377/70 der Kommission vom 27. Februar 1970 zur Anwendung
    der Verordnung Nr. 1041/67/EWG über die Durchführungsvorschriften für die Ausfuhrerstattungen
    im Sektor Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 377/70 af 27. februar 1970 der inden
    for frugt- og grønsagssektoren sætter forordning nr. 1041/67/EØF om de nærmere
    regler for anvendelsen af eksportrestitutionerne i kraft
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 377/70 della Commissione, del 27 febbraio 1970, recante
    applicazione nel settore degli ortofrutticoli del regolamento n. 1041/67/CEE che
    fissa le modalità d' applicazione delle restituzioni all' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 377/70 van de Commissie van 27 februari 1970 waarbij
    Verordening nr. 1041/67/EEG houdende uitvoeringsbepalingen inzake de verlening
    van restituties bij de uitvoer van toepassing wordt verklaard voor de sector groenten
    en fruit
