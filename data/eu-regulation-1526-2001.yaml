title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1526/2001 of 26 July 2001 amending Regulation
    (EEC) No 388/92 laying down detailed rules for implementation of the specific
    arrangements for the supply of cereal products to the French overseas departments
    (FOD) and establishing the forecast supply balance
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1526/2001 de la Commission du 26 juillet 2001 modifiant
    le règlement (CEE) n° 388/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement en produits céréaliers des départements français
    d'outre-mer (DOM) et établissant le bilan prévisionnel d'approvisionnement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1526/2001 der Kommission vom 26. Juli 2001 zur Änderung
    der Verordnung (EWG) Nr. 388/92 mit besonderen Durchführungsbestimmungen zur
    Versorgung der französischen überseeischen Departements mit Getreideerzeugnissen
    und zur Erstellung der vorläufigen Versorgungsbilanz
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1526/2001 ze dne 26. července 2001, kterým
    se mění nařízení (EHS) č. 388/92, kterým se stanoví prováděcí pravidla
    ke zvláštnímu režimu dodávek produktů z obilovin do francouzských zámořských
    departementů a předběžný odhad dodávek
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1526/2001 af 26. juli 2001 om ændring
    af forordning (EØF) nr. 388/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for de oversøiske franske departementer (OD) vedrørende kornprodukter
    og om udarbejdelse af opgørelsen over forsyningsbehovene
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1526/2001 της Επιτροπής,
    της 26ης Ιουλίου 2001, για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 388/92 για λεπτομέρειες εφαρμογής του
    ειδικού καθεστώτος για τον εφοδιασμό σε προϊόντα
    σιτηρών των γαλλικών υπερποντίων διαμερισμάτων
    (ΓΥΔ) και για καθορισμό του προβλεπόμενου ισοζυγίου
    εφοδιασμού
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1526/2001, 26. juuli 2001, millega muudetakse
    määrust (EMÜ) nr 388/92, millega sätestatakse teraviljatoodete Prantsusmaa
    ülemeredepartemangudesse tarnimise erikorra üksikasjalikud rakenduseeskirjad
    ja kehtestatakse prognoositav tarnebilanss
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1526/2001, annettu 26 päivänä heinäkuuta
    2001, Ranskan merentakaisten departementtien erityisen viljatuotteiden hankintajärjestelmän
    soveltamista koskevista yksityiskohtaisista säännöistä ja arvioidun hankintataseen
    vahvistamisesta annetun asetuksen (ETY) N:o 388/92 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1526/2001/EK rendelete (2001. július 26.) a Franciaország
    tengerentúli megyéinek (FTM) gabonatermékekkel való ellátására irányuló
    különleges rendelkezések végrehajtására vonatkozó részletes szabályok
    megállapításáról és a várható ellátási mérleg meghatározásáról
    szóló 388/92/EGK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1526/2001 della Commissione, del 26 luglio 2001, che
    modifica il regolamento (CEE) n. 388/92 relativo alle modalità di applicazione
    del regime specifico per l'approvvigionamento cerealicolo dei dipartimenti francesi
    d'oltremare (DOM) e al bilancio previsionale di approvvigionamento
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1526/2001 (2001. gada 26. jūlijs), ar ko groza
    Regulu (EEK) Nr. 388/92, ar kuru paredz sīki izstrādātus noteikumus īpašā
    režīma piemērošanai Francijas Aizjūras departamentu (FAD) apgādei ar labības
    produktiem un izveido piegādes bilances prognozi
  type: main
- language: lt
  script: Latn
  content: 2001 m. liepos 26 d. Komisijos reglamentas (EB) Nr. 1526/2001, iš dalies
    keičiantis Reglamentą (EEB) Nr. 388/92, nustatantį konkrečios tvarkos, taikytinos
    grūdų produktų tiekimui į Prancūzijos užjūrio departamentus (PUD), išsamias
    įgyvendinimo taisykles ir prognozuojamą tiekimo balansą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1526/2001 tas-26 ta’ Lulju 2001
    li jemenda r-Regolament (KEE) Nru 388/92 li jistabbilixxi r-regoli dettaljati
    għall-implimentazzjoni ta’ l-arranġamenti speċifiċi għall-provvista tal-prodotti
    taċ-ċerejali għad-dipartimenti Franċiżi ta’ barra (FOD) u li jistabbilixxi
    bilanċ pjanat ta’ provvista
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1526/2001 van de Commissie van 26 juli 2001 tot wĳziging
    van Verordening (EEG) nr. 388/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van de Franse overzeese departementen (DOM) met graanproducten
    en tot vaststelling van de voorzieningsbalans
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1526/2001 z dnia 26 lipca 2001 r. zmieniające
    rozporządzenie (EWG) nr 388/92 określające szczegółowe zasady wykonania szczególnych
    ustaleń w odniesieniu do dostawy produktów zbożowych do francuskich departamentów
    zamorskich (FDZ) i ustanawiające przewidywany bilans dostaw
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1526/2001 da Comissão, de 26 de Julho de 2001, que
    altera o Regulamento (CEE) n.° 388/92 que estabelece normas de execução do
    regime específico para o abastecimento em produtos cerealíferos dos departamentos
    ultramarinos franceses e que estabelece a estimativa das necessidades de abastecimento
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1526/2001 z 26. júla 2001, ktorým sa mení
    a dopĺňa nariadenie (EHS) č. 388/92 o podrobných pravidlách na uplatňovanie
    zvláštnych dojednaní na zásobovanie francúzskych zámorských departementov
    výrobkami z obilnín a o zriadení predbežného odhadu dodávok
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1526/2001 z dne 26. julija 2001 o spremembi Uredbe
    (EGS) št. 388/92 o podrobnih pravilih za uporabo posebnih režimov za dobavo
    žitnih proizvodov francoskim čezmorskim departmajem (FPD) in sestavo predvidene
    bilance dobave
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1526/2001 de la Comisión, de 26 de julio de 2001,
    que modifica el Reglamento (CEE) n° 388/92 por el que se establecen disposiciones
    de aplicación del régimen específico para el abastecimiento de productos del
    sector de los cereales a los departamentos franceses de ultramar y el plan de
    previsiones de abastecimiento
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1526/2001 av den 26 juli 2001 om ändring
    av förordning (EEG) nr 388/92 om fastställande av tillämpningsföreskrifter
    angående det särskilda försörjningssystemet för de franska utomeuropeiska
    departementen avseende spannmålsprodukter och om fastställande av en prognostiserad
    försörjningsbalans
