title:
- language: en
  script: Latn
  content: '80/615/EEC: Commission Decision of 10 June 1980 authorizing Ireland not
    to apply Community treatment to men''s and boys''shirts, woven, falling within
    heading No ex 61.03 of the Common Customs Tariff (category 8), originating in
    Sri Lanka and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/615/CEE: Décision de la Commission, du 10 juin 1980, autorisant l''Irlande
    à exclure du traitement communautaire les chemises et chemisettes tissées, de
    la position ex 61.03 du tarif douanier commun (catégorie 8), originaires de Sri
    Lanka et mises en libre pratique dans les autres Etats membres (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/615/EWG: Entscheidung der Kommission vom 10. Juni 1980, mit der Irland
    ermächtigt wird, aus Sri Lanka stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus Geweben,
    der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (Kategorie 8) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/615/EØF: Kommissionens beslutning af 10. juni 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage vævede skjorter (herunder
    sports- og arbejdsskjorter), som henhø1722rer under pos. ex 61.03 i den fælles
    toldtarif (katagori 8), har oprindelse i Sri Lanka og frit kan omsættes i de
    øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/615/CEE: Decisione della Commissione, del 10 giugno 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie e le camicette,
    tessute, della voce ex 61.03 della tariffa doganale comune, categoria 8, originarie
    dello Sri Lanka e messe in libera pratica negli altri Stati membri (Il testo in
    lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/615/EEG: Beschikking van de Commissie van 10 juni 1980 waarbij Ierland
    wordt gemachtigd overhemden en sporthemden, geweven, van post ex 61.03 van het
    gemeenschappelijk douanetarief, categorie 8, van oorsprong uit Sri Lanka en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
