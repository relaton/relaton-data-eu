  content: Commission Regulation (EEC) No 3192/85 of 14 November 1985 amending Regulation
    (EEC) No 2677/84 as regards the exchange rate to be used for the conversion into
    German marks of production levies fixed in the sugar sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3192/85 de la Commission du 14 novembre 1985 modifiant
    le règlement (CEE) no 2677/84 en ce qui concerne le taux de change à utiliser
    pour la conversion en marks allemands des cotisations à la production fixées
    dans le secteur du sucre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3192/85 der Kommission vom 14. November 1985 zur Änderung
    der Verordnung (EWG) Nr. 2677/84 hinsichtlich des für die Umrechnung in Deutsche
    Mark der im Zuckersektor festgesetzten Produktionsabgaben anzuwendenden Kurses
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3192/85 af 14. november 1985 om ændring
    af forordning (EØF) nr. 2677/84 for så vidt angår den vekselkurs, der skal
    anvendes ved omregning til tyske mark af de for sukker fastsatte produktionsafgifter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3192/85 της Επιτροπής
    της 14ης Νοεμβρίου 1985 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 2677/84 όσον αφορά την τιμή συναλλάγματος
    που θα χρησιμοποιηθεί για τη μετατροπή σε γερμανικά
    μάρκα των εισφορών στην παραγωγή που καθορίστηκαν
    στον τομέα της ζάχαρης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3192/85 della Commissione del 14 novembre 1985 che
    modifica il regolamento (CEE) n. 2677/84 per quanto concerne il tasso di cambio
    da utilizzare per la conversione in marchi tedeschi dei contributi alla produzione
    fissati nel settore dello zucchero
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3192/85 van de Commissie van 14 november 1985 tot
    wijziging van Verordening (EEG) nr. 2677/84 ten aanzien van de wisselkoers die
    moet worden gebruikt voor de omrekening in Duitse mark van de in de sector suiker
    vastgestelde produktieheffingen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3192/85 da Comissão, de 14 de Novembro de 1985,
    que altera o Regulamento (CEE) nº 2677/84 no que diz respeito à taxa de câmbio
    a utilizar para a conversão em marcos alemães das quotizações à produção
    fixadas no sector do açúcar
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3192/85 de la Comisión, de 14 de noviembre de 1985,
    por el que se modifica el Reglamento (CEE) n° 2677/84 en lo que se refiere al
    tipo de cambio que deberá utilizarse para la conversión en marcos alemanes de
    las cotizaciones a la producción fijadas en el sector del azúcar
