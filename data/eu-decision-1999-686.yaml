title:
- language: en
  script: Latn
  content: '1999/686/EC: Commission Decision of 25 February 1998 concerning aid which
    Germany intends to grant under the 26th framework plan of the joint scheme for
    improving regional economic structures with a view to promoting teleworking (26.
    Rahmenplan der Gemeinschaftsaufgabe ''Verbesserung der regionalen Wirtschaftsstruktur'')
    (notified under document number C(1998) 585) (Text with EEA relevance) (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/686/CE: Décision de la Commission, du 25 février 1998, relative
    aux aides que l''Allemagne envisage d''accorder en faveur de postes de télétravail
    conformément au 26e plan-cadre de la tâche d''intérêt commun pour l''amélioration
    des structures économiques régionales (26. Rahmenplan der Gemeinschaftsaufgabe
    «Verbesserung der regionalen Wirtschaftsstruktur») [notifiée sous le numéro
    C(1998) 585] (Texte présentant de l''intérêt pour l''EEE) (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '1999/686/EG: Entscheidung der Kommission vom 25. Februar 1998 über Beihilfen,
    die Deutschland nach dem 26. Rahmenplan der Gemeinschaftsaufgabe "Verbesserung
    der regionalen Wirtschaftsstruktur" zur Förderung von Telearbeitsplätzen zu
    gewähren beabsichtigt (Bekanntgegeben unter Aktenzeichen K(1998) 585) (Text von
    Bedeutung für den EWR) (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
