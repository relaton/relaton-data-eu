    for Gemeinschaftsaufgabe "Verbesserung der regionalen Wirtschaftsstruktur" (meddelt
    under nummer K(1998) 585) (EØS-relevant tekst) (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
