title:
- language: en
  script: Latn
  content: '81/69/EEC: Commission Decision of 28 January 1981 extending the period
    of application of the system of authorization for trade in crude oil and/or petroleum
    products between Italy and other Member States provided for by Decision 80/1008/EEC
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/69/CEE: Décision de la Commission, du 28 janvier 1981, prorogeant
    le système d''autorisation pour les échanges de pétrole brut et/ou de produits
    pétroliers entre l''Italie et les autres Etats membres prévu par la décision
    80/1008/CEE (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/69/EWG: Entscheidung der Kommission vom 28. Januar 1981 zur Verlängerung
    der Geltungsdauer des in der Entscheidung 80/1008/EWG vorgesehenen Systems automatisch
    erteilter Genehmigungen von Ausfuhren von Rohöl und/oder Erdölerzeugnissen zwischen
    Italien und den anderen Mitgliedstaaten (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/69/EØF: Kommissionens beslutning af 28. januar 1981 om forlængelse
    af ordningen med linser for samhandelen med mineralolie og/eller mineralolieprodukter
    mellem Italien og de øvrige medlemsstater som fastsat i beslutning 80/1008/EØF
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/69/ΕΟΚ: Απόφαση τής Επιτροπής τής 28ης Ιανουαρίου
    1981 περί παρατάσεως τού συστήματος αδείας πού
    προβλέπεται από τήν απόφαση 80/1008/ΕΟΚ σχετικά
    μέ τίς ανταλλαγές αργού πετρελαίου ή/καί προϊόντων
    πετρελαίου μεταξύ τής Ιταλίας καί τών λοιπών
    Κρατών μελών (Το κείμενο στην ιταλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/69/CEE: Decisione della Commissione, del 28 gennaio 1981, che proroga
    il sistema di autorizzazione per gli scambi di petrolio greggio e/o di prodotti
    petroliferi tra l''Italia e gli altri Stati membri previsto dalla decisione 80/1008/CEE
    (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/69/EEG: Beschikking van de Commissie van 28 januari 1981 tot verlenging
    van de geldigheidsduur van het vergunningstelsel voor het handelsverkeer van ruwe
    aardolie en/of aardolieprodukten tussen Italië en de andere Lid-Staten, neergelegd
    in Beschikking 80/1008/EEG (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
