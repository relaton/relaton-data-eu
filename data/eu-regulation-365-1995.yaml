  script: Latn
  content: COMMISSION REGULATION (EC) No 365/95 of 22 February 1995 determining the
    total quantities available for which licence applications can be lodged in March
    1995 for certain poultrymeat products under the regime provided for in Council
    Regulation (EC) No 774/94
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 365/95 DE LA COMMISSION du 22 février 1995 déterminant
