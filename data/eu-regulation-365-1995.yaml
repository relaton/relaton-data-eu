    peuvent être déposées en mars 1995 pour certains produits à base de viande
    de volaille dans le cadre du régime prévu par le réglement (CE) n° 774/94
    du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 365/95 DER KOMMISSION vom 22. Februar 1995 über die
    insgesamt verfügbare Menge, für die im März 1995 für bestimmte Geflügelfleischerzeugnisse
    Anträge auf Einfuhrlizenzen gemäß Verordnung (EG) Nr. 774/94 des Rates gestellt
    werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 365/95 af 22. februar 1995 om fastsættelse
    af, i hvilket omfang der i marts 1995 kan indgives ansøgninger om importlicens
    for visse fjerkræprodukter i forbindelse med den ordning, der er fastsat i Rådets
    forordning (EF) nr. 774/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 365/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
