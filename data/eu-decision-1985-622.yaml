title:
- language: en
  script: Latn
  content: '85/622/EEC: Commission Decision of 16 December 1985 amending Decision
    83/461/EEC laying down, for the purposes of a structure survey for 1983 as part
    of the programme of surveys on the structure of agricultural holdings, the definitions
    relating to the list of characteristics and the list of agricultural products'
  type: main
- language: fr
  script: Latn
  content: '85/622/CEE: Décision de la Commission du 16 décembre 1985 modifiant
    la décision 83/461/CEE portant fixation des définitions se rapportant à la
    liste des caractéristiques et de la liste des produits agricoles en vue d''une
    enquête "Structures 1983" dans le cadre d''un programme d''enquêtes sur la structure
    des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: '85/622/EWG: Entscheidung der Kommission vom 16. Dezember 1985 zur Änderung
    der Entscheidung 83/461/EWG über die Festlegung der Definitionen für den Merkmalskatalog
    und die Liste der landwirtschaftlichen Erzeugnisse für eine Strukturerhebung
    1983 im Rahmen eines Erhebungsprogramms über die Struktur der landwirtschaftlichen
    Betriebe'
  type: main
- language: da
  script: Latn
  content: '85/622/EØF: Kommissionens beslutning af 16. december 1985 om ændring
    af beslutning 83/461/EØF om fastlæggelse af definitionerne i forbindelse med
    listen over kendetegn og af listen over landbrugsprodukter med henblik på en
    strukturundersøgelse i 1983 som led i et program til undersøgelse af landbrugsbedrifternes
    struktur'
  type: main
- language: el
  script: Grek
  content: '85/622/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
