    για τον καθορισμό των ορισμών που αναφέρονται
    στον κατάλογο των χαρακτηριστικών και του
    καταλόγου των γεωργικών προϊόντων ενόψει έρευνας
    διαρθρώσεων για το 1983 μέσα στα πλαίσια προγράμματος
    ερευνών για τη διάρθρωση των γεωργικών εκμεταλλεύσεων'
  type: main
- language: it
  script: Latn
  content: '85/622/CEE: Decisione della Commissione del 16 dicembre 1985 che modifica
    la decisione 83/461/CEE che stabilisce le definizioni relative all''elenco delle
    caratteristiche e l''elenco dei prodotti agricoli per l''esecuzione dell''indagine
    "strutture 1983" nel quadro di un programma di indagini sulla struttura delle
    aziende agricole'
  type: main
- language: nl
  script: Latn
  content: '85/622/EEG: Beschikking van de Commissie van 16 december 1985 tot wijziging
