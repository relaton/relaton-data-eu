title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2390/91 of 5 August 1991 re-establishing
    the levying of customs duties on products of categories 9, 20, 41 and 72 (order
    Nos 40.0090, 40.0200, 40.0410 and 40.0720), originating in Indonesia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3832/90
    apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2390/91 DE LA COMMISSION du 5 août 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    9 (numéro d'' ordre 40.0090) de la catégorie 20 (numéro d'' ordre 40.0200)
    de la catégorie 41 (numéro d'' ordre 40.0410) de la catégorie 72 (numéro d''
    ordre 40.0720) originaires de l'' Indonésie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2390/91 DER KOMMISSION vom 5. August 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie 9 (laufende Nummer
    40.0090), der Kategorie 20 (laufende Nummer 40.0200), der Kategorie 41 (laufende
    Nummer 40.0410) und der Kategorie 72 (laufende Nummer 40.0720) mit Ursprung in
    Indonesien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2390/91 af 5. august 1991 om genindførelse
    af opkrævning af told for varer under kategori 9 (løbenummer 40.0090), kategori
    20 (løbenummer 40.0200), kategori 41 (løbenummer 40.0410) og kategori 72 (løbenummer
    40.0720), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2390/91 της Επιτροπής
    της 5ης Αυγούστου 1991 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    9 ( αύξων αριθμ. 40.0090 ), τα προϊόντα της κατηγορίας
    20 ( αύξων αριθμός 40.0200 ), τα προϊόντα της κατηγορίας
    41 ( αύξων αριθμός 40.0410 ) και τα προϊόντα της κατηγορίας
    72 ( αύξων αριθμός 40.0720 ), καταγωγής Ινδονησίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2390/91 DELLA COMMISSIONE del 5 agosto 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria n. 9
    (numero d'' ordine 40.0090), della categoria n. 20 (numero d'' ordine 40.0200),
    della categoria n. 41 (numero d'' ordine 40.0410) e della categoria n. 72 (numero
    d'' ordine 40.0720), originari dell'' Indonesia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2390/91 VAN DE COMMISSIE van 5 augustus 1991 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van de categorie nr. 9 (volgnummer 40.0090) van de categorie nr. 20 (volgnummer
    40.0200) van de categorie nr. 41 (volgnummer 40.0410) van de categorie nr. 72,
    (volgnummer 40.0720) van oorsprong uit Indonesië waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2390/91 DA COMISSÃO de 5 de Agosto de 1991 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 9 (número
    de ordem 40.0090), da categoria 20 (número de ordem 40.0200), da categoria 41
    (número de ordem 40.0410) e da categoria 72 (número de ordem 40.0720), originários
    da Indonésia, beneficiários das preferências pautais previstas no Regulamento
