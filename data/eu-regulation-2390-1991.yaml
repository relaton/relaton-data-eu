    a los productos de la categoría no 9 (número de orden 40.0090), de la categoría
    no 20 (número de orden 40.0200), de la categoría no 41 (número de orden 40.0410)
    y de la categoría no 72 (número de orden 40.0720) originarios de Indonesia,
    beneficiarios de las preferencias arancelarias previstas por el Reglamento (CEE)
    no 3832/90 del Consejo #'
