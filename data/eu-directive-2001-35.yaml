title:
- language: en
  script: Latn
  content: Commission Directive 2001/35/EC of 11 May 2001 amending the Annexes to
    Council Directive 90/642/EEC on the fixing of maximum levels for pesticide residues
    in and on certain products of plant origin, including fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2001/35/CE de la Commission du 11 mai 2001 modifiant les annexes
    de la directive 90/642/CEE du Conseil concernant la fixation de teneurs maximales
    pour les résidus de pesticides sur et dans certains produits d'origine végétale,
    y compris les fruits et les légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/35/EG der Kommission vom 11. Mai 2001 zur Änderung der
    Anhänge der Richtlinie 90/642/EWG des Rates über die Festsetzung von Höchstgehalten
    an Rückständen von Schädlingsbekämpfungsmitteln auf und in bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2001/35/ЕО на Комисията от 11 май
    2001 година за изменение на приложенията към
    Директива 90/642/ЕИО на Съвета относно определянето
    на максимални количества на остатъци от пестициди
    във и върху някои продукти от растителен произход,
    включително плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2001/35/ES ze dne 11. května 2001, kterou se mění přílohy
    směrnice Rady 90/642/EHS o stanovení maximálních limitů reziduí pesticidů
    v některých produktech rostlinného původu, včetně ovoce a zeleniny, a na
    jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2001/35/EF af 11. maj 2001 om ændring af bilagene
    til Rådets direktiv 90/642/EØF om fastsættelse af maksimalgrænseværdier for
    pesticidrester på og i visse produkter af vegetabilsk oprindelse, herunder frugt
    og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2001/35/ΕΚ της Επιτροπής, της 11ης Μαΐου
    2001, για την τροποποίηση των παραρτημάτων της
    οδηγίας 90/642/ΕΟΚ του Συμβουλίου που αφορά τον
    καθορισμό των ανωτάτων ορίων για τα υπολείμματα
    φυτοφαρμάκων πάνω και μέσα σε ορισμένα προϊόντα
    φυτικής προέλευσης, συμπεριλαμβανομένων των
    οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2001/35/EÜ, 11. mai 2001, millega muudetakse nõukogu
    direktiivi 90/642/EMÜ lisasid teatavates taimset päritolu saadustes, sealhulgas
    puu- ja köögiviljas sisalduvate ja nende pinnal esinevate pestitsiidide jääkide
    piirnormide kehtestamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2001/35/EY, annettu 11 päivänä toukokuuta 2001,
    torjunta-ainejäämien enimmäismäärien vahvistamisesta tietyille kasvikunnasta
    peräisin oleville tuotteille, mukaan lukien hedelmät ja vihannekset, annetun
    neuvoston direktiivin 90/642/ETY liitteiden muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2001/35/EK irányelve (2001. május 11.) az egyes növényi
    eredetű termékekben – többek között a gyümölcsökben és zöldségekben
    –, illetve azok felületén található peszticid-szermaradványok megengedett
    legmagasabb mértékének meghatározásáról szóló 90/642/EGK irányelv mellékleteinek
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2001/35/CE della Commissione, dell'11 maggio 2001, recante modifica
    degli allegati della direttiva 90/642/CEE del Consiglio, che fissa le quantità
    massime di residui di antiparassitari su e in alcuni prodotti di origine vegetale,
    compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2001/35/EK (2001. gada 11. maijs), ar ko groza pielikumus
    Padomes Direktīvai90/642/EEK par pesticīdu atlieku maksimāli pieļaujamā daudzuma
    noteikšanu dažos augu izcelsmes produktos, tostarp augļos un dārzeņos, un
    uz tiem
  type: main
- language: lt
  script: Latn
  content: 2001 m. gegužės 11 d. Komisijos direktyva 2001/35/EB, iš dalies keičianti
    Tarybos direktyvos 90/642/EEB dėl didžiausių pesticidų likučių koncentracijų
    tam tikruose augalinės kilmės produktuose ir ant jų, įskaitant vaisius ir
    daržoves, nustatymo, priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummisjoni 2001/35/KE tal-11 ta’ Mejju 2001 li temenda
    l-Annessi mad-Direttiva tal-Kunsill dwar il-fissar tal-livelli massimi tar-residwi
    tal-pestiċidi ġewwa u fuq ċerti prodotti li joriġinaw mill-pjanti inklużi
    il-frott u l-ħaxix ta’ l-ikel
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2001/35/EG van de Commissie van 11 mei 2001 houdende wĳziging
    van de bĳlagen bĳ Richtlĳn 90/642/EEG van de Raad tot vaststelling van maximumgehalten
    aan residuen van bestrĳdingsmiddelen in en op bepaalde producten van plantaardige
    oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2001/35/WE z dnia 11 maja 2001 r. zmieniająca załączniki
    do dyrektywy Rady 90/642/EWG w sprawie ustalania najwyższych dopuszczalnych poziomów
    pozostałości pestycydów w niektórych produktach pochodzenia roślinnego, w
    tymwowocach i warzywach oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/35/CE da Comissão, de 11 de Maio de 2001, que altera os
    anexos da Directiva 90/642/CEE do Conselho relativa à fixação de teores máximos
    de resíduos de pesticidas nos e sobre determinados produtos de origem vegetal,
    incluindo frutas e produtos hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2001/35/CE a Comisiei din 11 mai 2001 de modificare a anexelor
    la Directiva 90/642/CEE a Consiliului de stabilire a conținuturilor maxime de
    reziduuri de pesticide din și de pe anumite produse de origine vegetală, inclusiv
    fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2001/35/ES z 11. mája 2001, ktorou sa menia a dopĺňajú
    prílohy k smernici Rady 90/642/EHS o stanovovaní maximálnych limitov rezíduí
    pesticídov v a na určitých produktoch rastlinného pôvodu, vrátane ovocia
    a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2001/35/ES z dne 11. maja 2001 o spremembi prilog k
    Direktivi Sveta 90/642/EGS o določitvi mejnih vrednosti ostankov pesticidov v
    in na nekaterih proizvodih rastlinskega izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2001/35/CE de la Comisión, de 11 de mayo de 2001, por la que
    se modifican los anexos de la Directiva 90/642/CEE del Consejo relativa a la fijación
    de los contenidos máximos de residuos de plaguicidas en determinados productos
    de origen vegetal, incluidas las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2001/35/EG av den 11 maj 2001 om ändring av bilagorna
    till rådets direktiv 90/642/EEG om fastställande av gränsvärden för bekämpningsmedelsrester
    i och på vissa produkter av vegetabiliskt ursprung, inklusive frukt och grönsaker
  type: main
