  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2023/1637, annettu 16 päivänä
    elokuuta 2023, Indonesiasta peräisin olevan biodieselin tuonnissa täytäntöönpanoasetuksella
    (EU) 2019/2092 käyttöön otettujen tasoitustoimenpiteiden mahdollista kiertämistä
    Kiinan kansantasavallasta tai Yhdistyneestä kuningaskunnasta lähetetyn biodieselin
    tuonnilla riippumatta siitä, onko sen alkuperämaaksi ilmoitettu Kiinan kansantasavalta
    tai Yhdistynyt kuningaskunta, koskevan tutkimuksen vireillepanosta ja kyseisen
    tuonnin kirjaamisvelvoitteesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2023/1637 ón gCoimisiún an 16 Lúnasa
    2023 lena dtionscnaítear imscrúdú a bhaineann le himchéimniú féideartha
    na mbeart frithchúitimh arna bhforchur le Rialachán Cur Chun Feidhme (AE) 2019/2092
    ar allmhairí bithdhíosail de thionscnamh na hIndinéise trí allmhairí bithdhíosail
    ó Dhaon-Phoblacht na Síne agus ón Ríocht Aontaithe, bíodh sé dearbhaithe
    gur de thionscnamh Dhaon-Phoblacht na Síne agus de thionscnamh na Ríochta Aontaithe
    iad nó ná bíodh, agus lena gcuirtear na hallmhairí sin faoi réir a gcláraithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2023/1637 оd 16. kolovoza 2023. o pokretanju
    ispitnog postupka o mogućem izbjegavanju kompenzacijskih mjera uvedenih Provedbenom
    uredbom (EU) 2019/2092 na uvoz biodizela podrijetlom iz Indonezije uvozom biodizela
    poslanog iz Narodne Republike Kine i Ujedinjene Kraljevine, bez obzira na to ima
    li deklarirano podrijetlo iz Narodne Republike Kine i Ujedinjene Kraljevine, te
    o uvjetovanju takvog uvoza evidentiranjem
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1637 végrehajtási rendelete (2023. augusztus 16.)
    az Indonéziából származó biodízel behozatalára vonatkozóan az (EU) 2019/2092
    végrehajtási rendelettel bevezetett kiegyenlítő intézkedéseknek a Kínai
    Népköztársaságban és az Egyesült Királyságban feladott, akár a Kínai
    Népköztársaságból és az Egyesült Királyságból származóként, akár
    nem ilyenként bejelentett biodízel behozatalával megvalósított esetleges
    kijátszására vonatkozó vizsgálat megindításáról, valamint az érintett
    behozatalokra vonatkozó nyilvántartásbavételi kötelezettség bevezetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/1637 della Commissione del 16 agosto
    2023 che apre un’inchiesta relativa alla possibile elusione delle misure compensative
    istituite dal regolamento di esecuzione (UE) 2019/2092 sulle importazioni di biodiesel
    originario dell’Indonesia mediante importazioni di biodiesel spedito dalla Repubblica
    popolare cinese e dal Regno Unito, a prescindere che sia dichiarato o no originario
    della Repubblica popolare cinese o del Regno Unito, e che dispone la registrazione
    di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2023/1637 (2023. gada 16. augusts),
    ar ko sāk izmeklēšanu par kompensācijas pasākumu, kuri ar Īstenošanas regulu
    (ES) 2019/2092 noteikti Indonēzijas izcelsmes biodīzeļdegvielas importam, iespējamu
    apiešanu, importējot biodīzeļdegvielu, kas nosūtīta no Ķīnas Tautas Republikas
    un Apvienotās Karalistes, neatkarīgi no tā, vai tai deklarēta Ķīnas Tautas
    Republikas un Apvienotās Karalistes izcelsme, un ar ko uz šādu importu attiecina
    reģistrāciju
  type: main
