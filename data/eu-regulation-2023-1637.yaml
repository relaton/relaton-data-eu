  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2023/1637 z dne 16. avgusta 2023 o začetku
    preiskave glede morebitnega izogibanja izravnalnim ukrepom, uvedenim z Izvedbeno
    uredbo (EU) 2019/2092 na uvoz biodizla s poreklom iz Indonezije, z uvozom biodizla,
    poslanega iz Ljudske republike Kitajske in Združenega kraljestva, ne glede na
    to, ali je deklariran kot izdelek s poreklom iz Ljudske republike Kitajske in
    Združenega kraljestva ali ne, ter o registraciji takega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2023/1637 de la Comisión de 16 de agosto
    de 2023 por el que se abre una investigación sobre la posible elusión de las
    medidas compensatorias impuestas por el Reglamento de Ejecución (UE) 2019/2092
    a las importaciones de biodiésel originario de Indonesia por parte de las importaciones
