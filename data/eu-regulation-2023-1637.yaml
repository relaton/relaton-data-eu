  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2023/1637 av den 16 augusti
    2023 om inledande av en undersökning beträffande eventuellt kringgående av
    de utjämningsåtgärder som införts genom genomförandeförordning (EU) 2019/2092
    på import av biodiesel med ursprung i Indonesien genom import av biodiesel som
    avsänts från Folkrepubliken Kina och Förenade kungariket, oavsett om produktens
    deklarerade ursprung är Folkrepubliken Kina och Förenade kungariket eller inte,
    och om registrering av sådan import
