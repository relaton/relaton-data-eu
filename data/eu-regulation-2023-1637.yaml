    opatrení uložených vykonávacím nariadením (EÚ) 2019/2092 na dovoz bionafty
    s pôvodom v Indonézii dovozom bionafty odosielanej z Čínskej ľudovej republiky
    a zo Spojeného kráľovstva bez ohľadu na to, či má alebo nemá deklarovaný
    pôvod v Čínskej ľudovej republike a Spojenom kráľovstve, a ktorým sa zavádza
