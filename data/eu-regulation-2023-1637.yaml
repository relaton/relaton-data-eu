title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1637 of 16 August 2023 initiating
    an investigation concerning possible circumvention of the countervailing measures
    imposed by Implementing Regulation (EU) 2019/2092 on imports of biodiesel originating
    in Indonesia by imports of biodiesel consigned from the People’s Republic of
    China and the United Kingdom, whether declared as originating in the People’s
    Republic of China and the United Kingdom or not, and making such imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1637 de la Commission du 16 août 2023
    ouvrant une enquête concernant un éventuel contournement des mesures compensatoires
    instituées par le règlement d’exécution (UE) 2019/2092 sur les importations
    de biodiesel originaire d’Indonésie par des importations de biodiesel expédié
    de la République populaire de Chine et du Royaume-Uni, qu’il ait ou non été
    déclaré originaire de ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/1637 der Kommission vom 16. August 2023
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2019/2092 eingeführten Ausgleichsmaßnahmen
    gegenüber den Einfuhren von Biodiesel mit Ursprung in Indonesien durch aus der
    Volksrepublik China und aus dem Vereinigten Königreich versandte Einfuhren von
    Biodiesel, ob als Ursprungserzeugnisse der Volksrepublik China oder des Vereinigten
    Königreichs angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2023/1637 на Комисията
    от 16 август 2023 година за започване на разследване
    във връзка с възможно заобикаляне на изравнителните
    мерки, наложени с Регламент за изпълнение (ЕС)
    2019/2092 върху вноса на биодизел с произход от
    Индонезия, чрез внос на биодизел, изпращан
    от Китайската народна република и Обединеното
    кралство, независимо дали е деклариран с произход
    от Китайската народна република и Обединеното
    кралство, или не, и за въвеждане на регистрационен
    режим за този внос
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2023/1637 ze dne 16. srpna 2023 o
    zahájení šetření možného obcházení vyrovnávacích opatření uložených
    prováděcím nařízením (EU) 2019/2092 na dovoz bionafty pocházející z Indonésie
    dovozem bionafty zasílané z Čínské lidové republiky a Spojeného království,
    bez ohledu na to, zda je u ní deklarován původ z Čínské lidové republiky
    a Spojeného království, a o zavedení celní evidence tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2023/1637 af 16. august 2023
