    Įgyvendinimo reglamentu (ES) 2019/2092 importuojamam Indonezijos kilmės biodyzelinui,
    vengimo importuojant iš Kinijos Liaudies Respublikos ir Jungtinės Karalystės
    siunčiamą biodyzeliną, deklaruojamą arba nedeklaruojamą kaip Kinijos Liaudies
