    produktus registruoti
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/1637 tas-16
    ta’ Awwissu 2023 li jniedi investigazzjoni rigward il-possibbiltà ta’ ċirkomvenzjoni
    tal-miżuri kumpensatorji imposti mir-Regolament ta’ Implimentazzjoni (UE) 2019/2092
    fuq l-importazzjonijiet tal-bijodiżil li joriġinaw mill-Indoneżja permezz ta’
    importazzjonijiet ta’ bijodiżil ikkonsenjati mir-Repubblika tal-Poplu taċ-Ċina
    u mir-Renju Unit, kemm jekk iddikjarati li joriġinaw mir-Repubblika tal-Poplu
    taċ-Ċina u mir-Renju Unit kif ukoll jekk le, u li jagħmel tali importazzjonijiet
    soġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
