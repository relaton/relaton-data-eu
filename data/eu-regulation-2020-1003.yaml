title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1003 of 9 July 2020 renewing
    the approval of the active substances Phlebiopsis gigantea strains VRA 1835, VRA
    1984 and FOC PG 410.3 as low-risk substances in accordance with Regulation (EC)
    No 1107/2009 of the European Parliament and of the Council concerning the placing
    of plant protection products on the market, and amending the Annex to Commission
    Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1003 de la Commission du 9 juillet
    2020 renouvelant l’approbation des substances actives «Phlebiopsis gigantea
    — souches VRA 1835, VRA 1984 et FOC PG 410.3» en tant que substances à faible
    risque conformément au règlement (CE) no 1107/2009 du Parlement européen et
    du Conseil concernant la mise sur le marché des produits phytopharmaceutiques,
    et modifiant l’annexe du règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/1003 der Kommission vom 9. Juli 2020
    zur Erneuerung der Genehmigung für die Wirkstoffe Phlebiopsis gigantea Stämme
    VRA 1835, VRA 1984 und FOC PG 410.3 als Wirkstoffe mit geringem Risiko gemäß
    der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments und des Rates über
    das Inverkehrbringen von Pflanzenschutzmitteln sowie zur Änderung des Anhangs
    der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
  type: main
- language: bg
  script: Cyrl
