    augalų apsaugos produktų pateikimo į rinką pratęsiamas Phlebiopsis gigantea
    padermių VRA 1835, VRA 1984 ir FOC PG 410.3 patvirtinimo kaip nedidelės rizikos
    veikliųjų medžiagų galiojimas ir iš dalies keičiamas Komisijos įgyvendinimo
    reglamento (ES) Nr. 540/2011 priedas
  type: main
