    augu aizsardzības līdzekļu laišanu tirgū atjauno apstiprinājumu darbīgajām
    vielām Phlebiopsis gigantea celmiem VRA 1835, VRA 1984 un FOC PG 410.3 kā darbīgajām
    vielām ar zemu kaitīguma pakāpi un groza Komisijas Īstenošanas regulas (ES)
    Nr. 540/2011 pielikumu
  type: main
- language: lt
  script: Latn
