    kockázatú hatóanyagoknak a növényvédő szerek forgalomba hozataláról szóló
    1107/2009/EK európai parlamenti és tanácsi rendelet szerinti jóváhagyása
    meghosszabbításáról, valamint az 540/2011/EU bizottsági végrehajtási rendelet
    mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/1003 della Commissione del 9 luglio
    2020 che rinnova l’approvazione delle sostanze attive Phlebiopsis gigantea ceppi
    VRA 1835, VRA 1984 e FOC PG 410.3, come sostanze attive a basso rischio, in conformità
    al regolamento (CE) n. 1107/2009 del Parlamento europeo e del Consiglio relativo
    all’immissione sul mercato dei prodotti fitosanitari, e che modifica l’allegato
    del regolamento di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
