    määräytymisperusteista annetun komission asetuksen (ETY) N:o 3516/93 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 963/1999 della Commissione, del 6 maggio 1999, recante
    modifica del regolamento (CE) n. 3516/93 della Commissione, che stabilisce i fatti
    generatori per i tassi di conversione da applicare nel calcolo di determinati
    importi risultanti dai meccanismi dell'organizzazione comune dei mercati dei prodotti
    della pesca e dell'acquacoltura
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 963/1999 van de Commissie van 6 mei 1999 tot wijziging
    van Verordening (EG) nr. 3516/93 tot vaststelling van de ontstaansfeiten van de
    omrekeningskoersen die moeten worden toegepast voor de berekening van bepaalde
    bedragen die voortvloeien uit de mechanismen van de gemeenschappelijke marktordening
    voor visserijproducten en producten van de aquacultuur
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 963/1999 da Comissão, de 6 de Maio de 1999, que altera
