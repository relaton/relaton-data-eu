    der maßgeblichen Tatbestände der Umrechnungskurse für die Berechnung bestimmter
    Beträge im Rahmen der Mechanismen der gemeinsamen Marktorganisation für Fischereierzeugnisse
    und Erzeugnisse der Aquakultur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 963/1999 af 6. maj 1999 om ændring af
