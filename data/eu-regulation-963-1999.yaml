    conversion à appliquer pour le calcul de certains montants résultant des mécanismes
    de l'organisation commune des marchés dans le secteur des produits de la pêche
    et de l'aquaculture
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 963/1999 der Kommission vom 6. Mai 1999 zur Änderung
