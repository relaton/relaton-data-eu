title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 963/1999 of 6 May 1999 amending Regulation
    (EC) No 3516/93 establishing the operative events for the conversion rates to
    be applied when calculating certain amounts provided for by the mechanisms of
    the common organisation of the market in fishery and aquaculture products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 963/1999 de la Commission, du 6 mai 1999, modifiant
