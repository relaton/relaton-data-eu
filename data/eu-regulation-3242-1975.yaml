title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3242/75 of the Council of 9 December 1975 on the application
    of the provisions adopted within the framework of the Association established
    between the European Economic Community and Greece relating to the movement of
    goods in the manufacture of which are used products which come from third countries
    and are not in free circulation in either the Community or Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3242/75 du Conseil, du 9 décembre 1975, relatif à
    l' application des dispositions adoptées dans le cadre de l' association entre
    la Communauté économique européenne et la Grèce concernant la circulation
    des marchandises dans la fabrication desquelles sont entrés des produits en provenance
    de pays tiers ne se trouvant en libre pratique ni dans la Communauté ni en Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3242/75 des Rates vom 9. Dezember 1975 über die Anwendung
    von im Rahmen der Assoziation zwischen der Europäischen Wirtschaftsgemeinschaft
    und Griechenland erlassenen Vorschriften betreffend den Verkehr von Waren, die
    unter Verwendung von Waren aus dritten Ländern hergestellt sind, welche sich
    weder in der Gemeinschaft noch in Griechenland im freien Verkehr befanden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3242/75 af 9. december 1975 om anvendelse
    af de bestemmelser, der er vedtaget inden for rammerne af associeringen mellem
    Det europæiske økonomiske Fællesskab og Grækenland vedrørende bevægelsen
    af varer, til hvis fremstilling der er medgået produkter fra tredjelande, som
    ikke frit kan omsættes hverken i Fællesskabet eller i Grækenland
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3242/75 del Consiglio, del 9 dicembre 1975, relativo
    all' applicazione delle disposizioni adottate nel quadro dell' associazione fra
    la Comunità economica europea e la Grecia riguardo alla circolazione delle merci
    nella cui fabbricazione sono entrati prodotti provenienti da paesi terzi e non
    immessi in libera pratica né nella Comunità né in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3242/75 van de Raad van 9 december 1975 betreffende
    de toepassing van de in het kader van de Associatie tussen de Europese Economische
    Gemeenschap en Griekenland vastgestelde bepalingen betreffende het verkeer van
    goederen waarin produkten uit derde landen zijn verwerkt, die zich noch in de
    Gemeenschap noch in Griekenland in het vrije verkeer bevinden
  type: main
