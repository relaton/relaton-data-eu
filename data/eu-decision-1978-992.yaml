  content: '78/992/EEC: Commission Decision of 21 November 1978 allowing admission
    free of Common Customs Tariff duties of scientific apparatus described as ''Hitachi
    scanning electron microscope, model S-550'' with a transmitted electron image
    device (model S-5040) and a specimen cooling device (model HX-CS 2)'
  type: main
- language: fr
  script: Latn
  content: '78/992/CEE: Décision de la Commission, du 21 novembre 1978, admettant
    au bénéfice de la franchise des droits du tarif douanier commun l'' appareil
    scientifique dénommé "Hitachi scanning electron microscope, model S-550" avec
    dispositif de présentation des électrons transmis (modèle S-5040) et unité
    de refroidissement (modèle HX-CS2)'
  type: main
- language: de
  script: Latn
