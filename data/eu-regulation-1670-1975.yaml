title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1670/75 of the Commission of 30 June 1975 amending
    for the seventh time Regulation (EEC) No 1770/72 on detailed rules of application
    relating to the additional conditions with which imported wines for direct human
    consumption have to comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1670/75 de la Commission, du 30 juin 1975, modifiant
    pour la septième fois le règlement (CEE) n° 1770/72 portant modalités d' application
    relatives aux conditions supplémentaires auxquelles doivent répondre les vins
    importés destinés à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1670/75 der Kommission vom 30. Juni 1975 zur siebenten
    Änderung der Verordnung (EWG) Nr. 1770/72 über Durchführungsbestimmungen zu
    den zusätzlichen Bedingungen, denen eingeführter Wein für den unmittelbaren
    menschlichen Verbrauch entsprechen muß
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1670/75 af 30. juni 1975 om syvende
    ændring af forordning (EØF) nr. 1770/72 om gennemførelsesbestemmelser til de
    yderligere betingelser, som skal opfyldes af vin, der fra tredjelande er indført
    til direkte menneskeligt forbrug
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1670/75 della Commissione, del 30 giugno 1975, che
    modifica per la settima volta il regolamento (CEE) n. 1770/72, recante modalità
    d' applicazione relative alle condizioni supplementari cui devono rispondere i
    vini importati dai paesi terzi destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1670/75 van de Commissie van 30 juni 1975 houdende
    zevende wijziging van Verordening (EEG) nr. 1770/72 betreffende de nadere voorwaarden
    waaraan uit derde landen ingevoerde wijn voor rechtstreekse menselijke consumptie
    moet voldoen
  type: main
