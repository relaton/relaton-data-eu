id: EURegulation3481977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 348/77 of 18 February 1977 re-establishing
    the levying of the customs duties on gloves, including mittens and mitts, protective,
    for all trades falling within subheading 42.03 B I, originating in Hong Kong to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 348/77 de la Commission, du 18 février 1977, portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles, de protection pour tous les métiers, de la sous-position
    tarifaire 42.03 B I, originaires de Hong- Kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 348/77 der Kommission vom 18. Februar 1977 zur Wiedereinführung
    des Zollsatzes für Handschuhe, einschließlich Schutzhandschuhe für alle Berufe,
    der Tarifstelle 42.03 B I, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 348/77 af 18. februar 1977 om genindførelse
    af opkrævning af toldafgifter for handsker (herunder vanter), såvel syede som
    kun tilskårne, og beskyttelseshandsker til erhvervsmæssig brug (arbejdshandsker),
    under underposition 42.03 B I, som har oprindelse i Hongkong og omfattes af de
    toldpræferencer som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 348/77 della Commissione, del 18 febbraio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, comprese le
    muffole, di protezione per qualunque mestiere, della sottovoce doganale 42.03
    B I, originari di Hong Kong, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 348/77 van de Commissie van 18 februari 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen
    en wanten, werkhandschoenen en -wanten, van post 42.03 B I, van oorsprong uit
    Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
