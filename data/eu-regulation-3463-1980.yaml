    (EWG) Nr. 2641/80 hinsichtlich der Einfuhren von Erzeugnissen des Schaf- und Ziegenfleischsektors
    mit Ursprung in bestimmten Drittländern infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
