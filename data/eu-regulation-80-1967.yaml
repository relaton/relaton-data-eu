title:
- language: fr
  script: Latn
  content: Règlement n° 80/67/CEE du Conseil du 18 avril 1967, modifiant la liste
    des marchandises auxquelles s'applique le règlement n° 160/66/CEE du Conseil
    portant instauration d'un régime d'échanges pour certaines marchandises résultant
    de la transformation de produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 80/67/EWG des Rates vom 18. April 1967 zur Änderung der
    Liste der Waren, auf die die Verordnung Nr. 160/66/EWG des Rates über die Einführung
    einer Handelsregelung für bestimmte landwirtschaftliche Verarbeitungserzeugnisse
    Anwendung findet
  type: main
- language: it
  script: Latn
  content: Regolamento n. 80/67/CEE del Consiglio, del 18 aprile 1967, che modifica
    l'elenco delle merci cui si applica il regolamento n. 160/66/CEE del Consiglio
    relativo all'instaurazione di un regime di scambi per talune merci risultanti
    dalla trasformazione di prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 80/67/EEG van de Raad van 18 april 1967 houdende wijziging
    van de lijst van goederen waarop Verordening Nr. 160/66/EEG van de Raad tot invoering
    van een handelsregeling voor bepaalde goederen, verkregen door verwerking van
    landbouwprodukten, van toepassing is
