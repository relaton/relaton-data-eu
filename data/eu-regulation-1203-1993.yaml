title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1203/93 of 17 May 1993 amending Regulation
    (EEC) No 1562/85 laying down detailed rules for the application of measures to
    encourage the processing of oranges and for the marketing of products processed
    from lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1203/93 de la Commission du 17 mai 1993 modifiant
    le règlement (CEE) n° 1562/85 portant modalités d'application des mesures visant
    à promouvoir la transformation des oranges et la commercialisation des produits
    transformés à base de citrons
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1203/93 DER KOMMISSION vom 17. Mai 1993 zur Änderung
    der Verordnung (EWG) Nr. 1562/85 mit Durchführungsbestimmungen zu den Maßnahmen
    zur Förderung der Apfelsinenverarbeitung und der Vermarktung von Verarbeitungserzeugnissen
    aus Zitronen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1203/93 af 17. maj 1993 om ændring
    af forordning (EØF) nr. 1562/85 om gennemførelsesbestemmelser til foranstaltningerne
    til fremme af forarbejdning af appelsiner og afsætning af produkter forarbejdet
    på basis af citroner
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1203/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 17ης Μαΐου 1993 για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1562/85 περί των λεπτομερειών εφαρμογής
    των μέτρων για την προώθηση της μεταποίησης
    πορτοκαλιών και της εμπορίας των μεταποιημένων
    προϊόντων με βάση τα λεμόνια
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1203/93 DELLA COMMISSIONE del 17 maggio 1993 che modifica
    il regolamento (CEE) n. 1562/85 che stabilisce le modalità di applicazione delle
    misure intese a promuovere la trasformazione delle arance e la commercializzazione
    dei prodotti trasformati a base di limoni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1203/93 VAN DE COMMISSIE van 17 mei 1993 tot wijziging
    van Verordening (EEG) nr. 1562/85 houdende uitvoeringsbepalingen ten aanzien van
    de maatregelen ter bevordering van de verwerking van bepaalde sinaasappelen en
    de afzet van produkten op basis van citroenen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1203/93 DA COMISSÃO de 17 de Maio de 1993 que altera
    o Regulamento (CEE) no 1562/85, que estabelece normas de execução das medidas
    destinadas a promover a transformação de determinados citrinos e a comercialização
    dos produtos transformados à base de limões
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1203/93 DE LA COMISIÓN de 17 de mayo de 1993 por el
    que se modifica el Reglamento (CEE) no 1562/85 por el que se establecen las modalidades
    de aplicación de las medidas destinadas a promover la transformación de naranjas
    y la comercialización de los productos transformados a base de limones
  type: main
