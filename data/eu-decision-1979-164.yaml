title:
- language: en
  script: Latn
  content: '79/164/EEC: Commission Decision of 22 December 1978 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of the Netherlands of a payment
    on account in respect of expenditure incurred during 1977 on aids and premiums
    relating to the modernization of farms (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/164/CEE: Décision de la Commission, du 22 décembre 1978, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume des Pays-Bas d''un acompte sur les dépenses
    effectuées pendant l''année 1977 pour les aides et primes relatives à la modernisation
    des exploitations agricoles (Le texte en langue néerlandaise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '79/164/EWG: Entscheidung der Kommission vom 22. Dezember 1978 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1977 zur Modernisierung landwirtschaftlicher Betriebe an Beihilfen und Prämien
    getätigten Ausgaben an das Königreich der Niederlande (Nur der niederländische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/164/EØF: Kommissionens beslutning af 22. december 1978 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Nederlandene af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1977 til støtte og præmier
    vedrørende modernisering af landbrugsbedrifter (Kun den nederlandske udgave er
    autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/164/CEE: Decisione della Commissione, del 22 dicembre 1978, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno dei Paesi Bassi
    di un anticipo sulle spese effettuate durante il 1977 per gli aiuti ed i premi
    relativi all''ammodernamento delle aziende agricole (Il testo in lingua olandese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/164/EEG: Beschikking van de Commissie van 22 december 1978 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk der Nederlanden
    van een voorschot in verband met de gedurende het jaar 1977 gedane uitgaven voor
    de steun en premies met betrekking tot de modernisering van landbouwbedrijven
    (Slechts de tekst in de Nederlandse taal is authentiek)'
