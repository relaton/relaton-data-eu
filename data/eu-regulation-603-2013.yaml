  content: Reglamento (UE) n ° 603/2013 del Parlamento Europeo y del Consejo, de
    26 de junio de 2013 , relativo a la creación del sistema «Eurodac» para la
    comparación de las impresiones dactilares para la aplicación efectiva del Reglamento
    (UE) n ° 604/2013, por el que se establecen los criterios y mecanismos de determinación
    del Estado miembro responsable del examen de una solicitud de protección internacional
    presentada en uno de los Estados miembros por un nacional de un tercer país o
    un apátrida, y a las solicitudes de comparación con los datos de Eurodac presentadas
    por los servicios de seguridad de los Estados miembros y Europol a efectos de
    aplicación de la ley, y por el que se modifica el Reglamento (UE) n ° 1077/2011,
    por el que se crea una Agencia europea para la gestión operativa de sistemas
    informáticos de gran magnitud en el espacio de libertad, seguridad y justicia
    (versión refundida)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) nr 603/2013 av den 26 juni
    2013 om inrättande av Eurodac för jämförelse av fingeravtryck för en effektiv
    tillämpning av förordning (EU) nr 604/2013 om kriterier och mekanismer för
    att avgöra vilken medlemsstat som är ansvarig för att pröva en ansökan om
    internationellt skydd som en tredjelandsmedborgare eller en statslös person har
    lämnat in i någon medlemsstat och för när medlemsstaternas brottsbekämpande
    myndigheter begär jämförelser med Eurodacuppgifter för brottsbekämpande ändamål,
    samt om ändring av förordning (EU) nr 1077/2011 om inrättande av en Europeisk
    byrå för den operativa förvaltningen av stora it-system inom området frihet,
    säkerhet och rättvisa (omarbetning)
  type: main
