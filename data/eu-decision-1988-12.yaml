title:
- language: en
  script: Latn
  content: '88/12/EEC: Commission Decision of 16 December 1987 renewing and amending
    Decision 85/15/EEC authorizing Ireland to continue to apply certain protective
    measures pursuant to Article 108 (3) of the EEC Treaty (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/12/CEE: Décision de la Commission du 16 décembre 1987 prorogeant
    et modifiant la décision 85/15/CEE autorisant l''Irlande à poursuivre l''application
    de certaines mesures de sauvegarde conformément à l''article 108 paragraphe
    3 du traité CEE (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/12/EWG: Entscheidung der Kommission vom 16. Dezember 1987 zur Verlängerung
    und Änderung der Entscheidung 85/15/EWG, mit der Irland ermächtigt wird, bestimmte
    Schutzmaßnahmen gemäß Artikel 108 Absatz 3 des EWG- Vertrags weiterhin anzuwenden
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/12/EØF: Kommissionens beslutning af 16. december 1987 om forlængelse
    og ændring af beslutning 85/15/EØF om bemyndigelse af Irland til fortsat at
    anvende visse beskyttelsesforanstaltninger i henhold til EØF- Traktatens artikel
    108, stk. 3 (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/12/ΕΟΚ: Απόφαση της Επιτροπής της 16ης Δεκεμβρίου
    1987 για παράταση και τροποποίηση της απόφασης
    85/15/ΕΟΚ με την οποία εξουσιοδοτείται η Ιρλανδία
    να συνεχίσει την εφαρμογή ορισμένων μέτρων
    διασφάλισης, σύμφωνα με το άρθρο 108 παράγραφος
    3 της συνθήκης ΕΟΚ (Το κείμενο στην αγγλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/12/CEE: Decisione della Commissione del 16 dicembre 1987 che proroga
    e modifica la decisione 85/15/CEE che autorizza l''Irlanda a continuare ad applicare
    talune misure di salvaguardia ai sensi dell''articolo 108, paragrafo 3 del trattato
    CEE (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/12/EEG: Beschikking van de Commissie van 16 december 1987 houdende
