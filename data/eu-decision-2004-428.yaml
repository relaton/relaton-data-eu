title:
- language: en
  script: Latn
  content: Decision 2004/428/EC of 29 April 2004 amending Decision 2003/493/EC as
    regards the points of entry through which Brazil nuts in shell originating in
    or consigned from Brazil may only be imported into the Community
  type: main
- language: fr
  script: Latn
  content: Décision 2004/428/CE de la Commission du 29 avril 2004 modifiant la décision
    2003/493/CE en ce qui concerne les points d’entrée obligés pour l’importation
    des noix du Brésil en coque originaires ou en provenance du Brésil dans la Communauté
    européenne
  type: main
- language: de
  script: Latn
  content: Entscheidung 2004/428/EG der Kommission vom 29. April 2004 zur Änderung
    der Entscheidung 2003/493/EG hinsichtlich der Eingangszollstellen, über die Paranüsse
    in Schale, deren Ursprung oder Herkunft Brasilien ist, in die Europäische Gemeinschaft
    eingeführt werden dürfen
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. dubna 2004, kterým se mění rozhodnutí
    2003/493/ES, pokud jde o místa vstupu, přes která mohou být do Společenství
    dováženy para ořechy ve skořápce pocházející nebo odeslané z Brazílie
    (oznámeno pod číslem K(2004) 1591)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning 2004/428/EF af 29. april 2004 om ændring af beslutning
    2003/493/EF for så vidt angår de indgangssteder, hvorigennem paranødder med
    skal, der har oprindelse i eller er afsendt fra Brasilien, kan importeres til
    Fællesskabet
  type: main
- language: el
  script: Grek
  content: Aπόφαση 2004/428/ΕΚ της Επιτροπής, της 29ης Απριλίου
    2004, για την τροποποίηση της απόφασης 2003/493/EΚ
    όσον αφορά τα σημεία εισόδου από τα οποία επιτρέπεται
    να εισάγονται στην Ευρωπαϊκή Κοινότητα κελυφωτά
    βραζιλιανά κάρυα καταγωγής ή προέλευσης Βραζιλίας
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. aprill 2004, millega muudetakse otsust 2003/493/EÜ
    piiriületuspunktide kohta, mille kaudu võib ühendusse importida Brasiiliast
    pärit või sealt lähetatud koorimata brasiilia pähkleid (teatavaks tehtud numbri
    K(2004) 1591 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös 2004/428/EY, tehty 29 päivänä huhtikuuta 2004, päätöksen
    2003/493/EY muuttamisesta niiden maahantulopaikkojen osalta, joiden kautta Brasiliasta
    peräisin olevia tai sieltä lähetettyjä kuorellisia parapähkinöitä saa tuoda
    Euroopan yhteisöön
  type: main
- language: hu
  script: Latn
  content: A Bizottság 428/2004/EK határozata (2004. április 29.) a beléptetési
    helyek tekintetében, amelyeken keresztül a Brazíliából származó vagy ott
    feladott héjas brazil dió az Európai Közösségbe behozható, a 2003/493/EK
    határozat módosításáról (az értesítés a C (2004) 1591. számú dokumentummal
    történt)(EGK vonatkozású szöveg)
  type: main
- language: it
  script: Latn
  content: Decisione 2004/428/CE della Commissione, del 29 aprile 2004, che modifica
    la decisione 2003/493/CE per quanto riguarda i punti di entrata per i quali le
    noci del Brasile in guscio originarie del Brasile o da esso spedite possono essere
    importate nella Comunità europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2004. gada 29. aprīlis), ar ko groza Lēmumu 2003/493/EK
    attiecībā uz ievešanas vietām, caur kurām Brazīlijas riekstus, kuri ir čaumalās
    un kuru izcelsmes valsts ir Brazīlija vai kuri ir sūtīti no tās, drīkst tikai
    ievest Kopienā (izziņots ar dokumenta numuru C(2004) 1591)
  type: main
- language: lt
  script: Latn
  content: 2004 balandžio 29 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    2003/493/EB dėl įvežimo punktų, per kuriuos Brazilijoje išauginti arba iš
    jos siunčiami riešutai su kevalais gali būti importuojami į Bendriją (pranešta
    dokumentu C(2004) 1591)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta' April 2004 li temenda d-Deċiżjoni
