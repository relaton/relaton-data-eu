    li joriġina fi jew li huwa konsenjat mill-Brażil jista' jiġi biss importat
    fil-Komunità (notifikat taħt id-dokument numru C(2004) 1591)
  type: main
- language: nl
  script: Latn
  content: Beschikking 2004/428/EG van de Commissie van 29 april 2004 tot wijziging
    van Beschikking 2003/493/EG ten aanzien van de punten van binnenkomst waarlangs
    paranoten in de dop van oorsprong uit of verzonden uit Brazilië in de Gemeenschap
    mogen worden ingevoerd
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 kwietnia 2004 r. zmieniająca decyzję 2003/493/WE
    w odniesieniu do miejsc wprowadzenia, przez które orzechy brazylijskie w łupinach,
    pochodzące lub przesyłane z Brazylii, mogą być przywożone do Wspólnoty (notyfikowana
    jako dokument nr C(2004) 1591)
  type: main
- language: pt
  script: Latn
  content: Decisão 2004/425/CE da Comissão, de 29 de Abril de 2004, que altera a
    Decisão 2003/493/CE no que respeita aos pontos de entrada através dos quais
    podem ser importadas para a Comunidade Europeia castanhasdoBrasil com casca, originárias
    ou provenientes do Brasil
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. apríla 2004, ktorým sa mení a dopĺňa rozhodnutie
    2003/493/ES o vstupných miestach do Spoločenstva, výhradne cez ktoré sa môžu
    dovážať nevylúpané para orechy pochádzajúce alebo odoslané z Brazílie
    (oznámené pod číslom dokumentu C(2004) 1591)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. aprila 2004 o spremembi Odločbe 2003/493/ES
    o postavljanju posebnih pogojev za uvoz neoluščenih brazilskih orehov s poreklom
    ali poslanih iz Brazilije (notificirano pod dokumentarno številko C(2004) 1591)
  type: main
- language: es
  script: Latn
  content: Decisión 2004/428/CE de la Comisión, de 29 de abril de 2004, por la que
