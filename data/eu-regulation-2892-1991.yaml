title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2892/91 of 1 October 1991 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for export to the Soviet Union, amending Regulation
    (EEC) No 569/88 and repealing Regulation (EEC) No 1933/91
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2892/91 DE LA COMMISSION du 1er octobre 1991 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) no 2539/84,
    de viandes bovines détenues par certains organismes d'' intervention et destinées
    à être exportées vers l'' Union soviétique, modifiant le règlement (CEE)
    no 569/88 et abrogeant le règlement (CEE) no 1933/91 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2892/91 DER KOMMISSION vom 1. Oktober 1991 über
    den Verkauf von zur Ausfuhr in die Sowjetunion bestimmtem Rindfleisch aus Interventionsbeständen
    nach der Verordnung (EWG) Nr. 2539/84 zur Änderung der Verordnung (EWG) Nr. 569/88
    und zur Aufhebung der Verordnung (EWG) Nr. 1933/91 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2892/91 af 1. oktober 1991 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på eksport til Sovjetunionen og om ændring af forordning (EØF)
    nr. 569/88 og om ophævelse af forordning (EØF) nr. 1933/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 2892/91 της Επιτροπής
    της 1ης Οκτωβρίου 1991 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό ( ΕΟΚ ) αριθ. 2539/84, βοείου κρέατος που
    κατέχεται από ορισμένους οργανισμούς παρεμβάσεως
    και προορίζεται να εξαχθεί προς τη Σοβιετική
    Ένωση για τροποποίηση του κανονισμού ( ΕΟΚ
    ) αριθ. 569/88 και για την κατάργηση του κανονισμού
    ( ΕΟΚ ) αριθ. 1933/91
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2892/91 DELLA COMMISSIONE del 1o ottobre 1991 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'' intervento e destinate all''
    esportazione in Unione Sovietica, che modifica il regolamento (CEE) n. 569/88
    e recante abrogazione del regolamento (CEE) n. 1933/91 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2892/91 VAN DE COMMISSIE van 1 oktober 1991 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer naar de Sowjetunie
    bestemd rundvlees, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende
    intrekking van Verordening (EEG) nr. 1933/91 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2892/91 DA COMISSÃO de 1 de Outubro de 1991 relativo
    à venda, no âmbito do procedimento definido no Regulamento (CEE) no 2539/84,
    de carne de bovino detida por certos organismos de intervenção e destinada a
    ser exportada para a União Soviética, que altera o Regulamento (CEE) no 569/88
    e que revoga o Regulamento (CEE) no 1933/91 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2892/91 DE LA COMISIÓN de 1 de octubre de 1991 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno en poder de determinados organismos de intervención y destinadas
    a ser exportadas en la Unión Soviética y por el que se modifica el Reglamento
    (CEE) no 569/88 y que deroga el Reglamento (CEE) no 1933/91 #'
