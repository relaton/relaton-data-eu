  script: Latn
  content: Commission Decision of 23 November 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the French Republic
    for expenditure on resettlement operations carried out by the Ministry of Agriculture
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 novembre 1973, portant octroi du concours
    du Fonds social européen, prévu à l'article 125 du Traité, au bénéfice de
    la République française pour des dépenses relatives à des opérations de réinstallation
    effectuées par le Ministère de l'agriculture
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. November 1973 über die Gewährung
    des in Artikel 125 des Vertrages vorgesehenen Zuschusses aus dem Europäischen
    Sozialfonds an die Französische Republik zu Aufwendungen für vom "Ministère
    de l'Agriculture" durchgeführte Umsiedlungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. november 1973 om ydelse af det i artikel
    125 i traktaten fastsatte tilskud fra Den europæiske Socialfond til Den franske
    Republik i forbindelse med omkostninger vedrørende foranstaltninger i forbindelse
    med flytning, som er gennemført af Ministère de l'Agriculture (landbrugsministeriet)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 novembre 1973, recante concessione
    del contributo del Fondo sociale europeo, previsto dall'articolo 125 del trattato,
    a favore della Repubblica francese per spese concernenti operazioni di nuova sistemazione
    effettuate dal ministro dell'agricoltura
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 november 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van de Franse Republiek voor door het ministerie van Landbouw
    gemaakte verplaatsingskosten
