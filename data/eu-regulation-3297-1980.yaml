    τού κανονισμού (EOK) αριθ. 1608/76 «περί τών λεπτομερειών
    εφαρμογής γιά τήν περιγραφή καί τήν παρουσίαση
    οίνων καί γλευκών σταφυλής»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3297/80 della Commissione, del 17 dicembre 1980, recante
