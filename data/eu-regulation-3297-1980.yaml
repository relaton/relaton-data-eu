title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3297/80 of 17 December 1980 amending for
    the ninth time, as a result of the accession of Greece, Regulation (EEC) No 1608/76
    laying down detailed rules for the description and presentation of wines and grape
    musts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3297/80 de la Commission, du 17 décembre 1980, portant
    neuvième modification du règlement (CEE) n° 1608/76 portant modalités d' application
    pour la désignation et la présentation des vins et des moûts de raisins à
    la suite de l' adhésion de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3297/80 der Kommission vom 17. Dezember 1980 zur neunten
    Änderung der Verordnung (EWG) Nr. 1608/76 über Durchführungsbestimmungen für
    die Bezeichnung und Aufmachung der Weine und der Traubenmoste im Zuge des Beitritts
    Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3297/80 af 18. december 1980 om niende
    ændring af forordning (EØF) nr. 1608/76 om gennemførelsesbestemmelser vedrørende
    betegnelse og præsentation af vin og druemost som følge af Grækenlands tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3297/80 τής Επιτροπής
