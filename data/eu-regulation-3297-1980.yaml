    per la designazione e la presentazione dei vini e dei mosti di uva in seguito
    all' adesione della Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3297/80 van de Commissie van 17 december 1980 houdende
