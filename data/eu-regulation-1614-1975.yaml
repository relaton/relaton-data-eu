title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1614/75 of the Commission of 26 June 1975 re-establishing
    the levying of customs duties on cycles (including delivery tricycles), not motorized,
    falling within heading No 87.10, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1614/75 de la Commission, du 26 juin 1975, portant
    rétablissement de la perception des droits de douane applicables aux vélocipèdes
    (y compris les triporteurs et similaires), sans moteur, de la position tarifaire
    87.10, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1614/75 der Kommission vom 26. Juni 1975 zur Wiedereinführung
    des Zollsatzes für Fahrräder, ohne Motor, der Tarifnummer 87.10, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember
    1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1614/75 af 26. juni 1975 om genindførelse
    af opkrævning af toldafgifter for cykler uden motor, under position 87.10, som
    har oprindelse i Jugoslavien, og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1614/75 della Commissione, del 26 giugno 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai velocipedi senza motore
    della voce doganale n. 87.10 originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre
    1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1614/75 van de Commissie van 26 juni 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op rijwielen
    zonder motor van post 87.10, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
