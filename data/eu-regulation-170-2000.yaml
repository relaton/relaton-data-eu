title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 170/2000 of 25 January 2000 determining the
    extent to which applications submitted in January 2000 for import licences for
    the tariff quota for beef and veal provided for in the European Agreement between
    the Community and the Republic of Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 170/2000 de la Commission, du 25 janvier 2000, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 2000 pour le contingent tarifaire de viandes bovines prévu
    par l'accord européen entre la Communauté et la république de Slovénie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 170/2000 der Kommission vom 25. Januar 2000 zur Bestimmung
    des Prozentsatzes, zu dem den im Januar 2000 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch im Rahmen des Zollkontingents gemäß
    dem zwischen der Gemeinschaft und der Republik Slowenien geschlossenen Europa-Abkommen
    stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 170/2000 af 25. januar 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i januar 2000 om
    importlicenser for kød i forbindelse med det toldkontingent for oksekød, der
    er fastsat ved Europaaftalen mellem EF og Republikken Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 170/2000 της Επιτροπής,
    της 25ης Ιανουαρίου 2000, για τον καθορισμό του
    βαθμού στον οποίο μπορούν να γίνουν αποδεκτές
    οι αιτήσεις χορηγήσεως πιστοποιητικών εισαγωγής
    που υποβλήθηκαν τον Ιανουάριο 2000 για τη δασμολογική
    ποσόστωση βοείου κρέατος που προβλέπεται από
    την ευρωπαϊκή συμφωνία μεταξύ της Κοινότητας
    και της Δημοκρατίας της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 170/2000, annettu 25 päivänä tammikuuta 2000,
    tammikuussa 2000 esitettyjen tuontitodistushakemusten hyväksyttävyydestä yhteisön
    sekä Slovenian tasavallan välisessä Eurooppa-sopimuksessa määrätyn naudanlihaa
    koskevan tariffikiintiön osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 170/2000 della Commissione, del 25 gennaio 2000, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel gennaio 2000 per i contingenti tariffari supplementari di carni
    bovine previsti dall'accordo europeo tra la Comunità e la Repubblica di Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 170/2000 van de Commissie van 25 januari 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in januari 2000
    ingediende aanvragen om invoercertificaten voor het tariefcontingent voor rundvlees
    dat bij de Europaovereenkomst tussen de Gemeenschap en de Republiek Slovenië
    is vastgesteld
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 170/2000 da Comissão, de 25 de Janeiro de 2000,
