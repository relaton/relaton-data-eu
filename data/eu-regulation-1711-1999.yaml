title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1711/1999 of 30 July 1999 determining the
    extent to which applications lodged in July 1999 for import licences for certain
    poultrymeat products under the regime provided for in Council Regulation (EC)
    No 774/94 opening and providing for the administration of certain Community tariff
    quotas for poultrymeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1711/1999 de la Commission, du 30 juillet 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1999 pour certains produits à base de viande de volaille peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande de volaille et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1711/1999 der Kommission vom 30. Juli 1999 über die
    Festsetzung des Umfangs, in dem die im Juli 1999 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Geflügelfleischerzeugnisse entsprechend der Regelung der Verordnung
    (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher Zollkontingente
    für Geflügelfleisch und andere landwirtschaftliche Erzeugnisse genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1711/1999 af 30. juli 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1999 om importlicenser for visse fjerkræprodukter, som kun accepteres i forbindelse
    med den ordning, der er fastsat i Rådets forordning (EF) nr. 774/94 om åbning
    og forvaltning af en række EF& hyphen;toldkontingenter for fjerkrækød og andre
    landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1711/1999 της Επιτροπής,
    της 30ής Ιουλίου 1999, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές αιτήσεις
    που υποβλήθηκαν τον Ιουλίου του 1999 για πιστοποιητικά
    εισαγωγής ορισμένων προϊόντων με βάση το κρέας
    πουλερικών βάσει του καθεστώτος που προβλέπεται
