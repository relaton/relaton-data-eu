  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2023/1703 z dne 7. septembra 2023 o podaljšanju
    dovoljenja za pripravek iz endo-1,4-beta-ksilanaze, ki jo proizvaja Trichoderma
    reesei CBS 143953, in endo-1,3(4)-beta-glukanaze, ki jo proizvaja Trichoderma
    reesei CBS 143945, kot krmni dodatek za vrste perutnine, odstavljene pujske, prašiče
    za pitanje, doječe svinje in manj pomembne vrste prašičev (odstavljene pujske,
    prašiče za pitanje in doječe svinje), dovoljenju za navedeni pripravek za sesne
    pujske in manj pomembne vrste prašičev (sesne pujske) (imetnik dovoljenja: Danisco
    (UK) Ltd, ki trguje pod imenom Danisco Animal Nutrition in ga zastopa družba
    Genencor International B.V.) ter razveljavitvi Uredbe (EU) št. 337/2011 in Izvedbene
    uredbe (EU) 2016/997'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2023/1703 de la Comisión de 7 de septiembre
    de 2023 relativo a la renovación de la autorización de un preparado de endo-1,4-beta-xilanasa
    producida por Trichoderma reesei CBS 143953 y endo-1,3(4)-beta-glucanasa producida
    por Trichoderma reesei CBS 143945 como aditivo en piensos para especies de aves
    de corral, lechones destetados, cerdos de engorde, cerdas lactantes y especies
    porcinas menores (lechones destetados, cerdos de engorde y cerdas lactantes),
    a la autorización de dicho preparado para lechones lactantes y especies porcinas
    menores (lechones lactantes) [titular de la autorización: Danisco (UK) Ltd, que
    actúa bajo el nombre de Danisco Animal Nutrition y está representado por Genencor
    International B.V.] y por el que se derogan el Reglamento (UE) n.o 337/2011 y
    el Reglamento de Ejecución (UE) 2016/997'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2023/1703 av den 7 september
    2023 om förlängning av godkännandet av ett preparat av endo-1,4-beta-xylanas
    framställt av Trichoderma reesei CBS 143953 och endo-1,3(4)-beta-glukanas framställt
    av Trichoderma reesei CBS 143945 som fodertillsats för fjäderfäarter, avvanda
    smågrisar, slaktsvin, digivande suggor och mindre vanligt förekommande svinarter
    (avvanda smågrisar, slaktsvin och digivande suggor), om godkännandet av det
    preparatet för diande smågrisar och mindre vanligt förekommande svinarter (diande
    smågrisar) (innehavare av godkännandet: Danisco (UK) Ltd, som bedriver verksamhet
    under namnet Danisco Animal Nutrition och företräds av Genencor International
    B.V.) och om upphävande av förordning (EU) nr 337/2011 och genomförandeförordning
    (EU) 2016/997'
  type: main
