title:
- language: en
  script: Latn
  content: '80/536/EEC: Commission Decision of 14 May 1980 on the reimbursement by
    the Guidance Section of the EAGGF to Ireland of expenditure incurred during 1978
    on aids relating to the provision of socio-economic guidance for and the acquisition
    of occupational skills by persons engaged in agriculture (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/536/CEE: Décision de la Commission, du 14 mai 1980, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    à l''Irlande, des dépenses effectuées pendant l''année 1978 pour les aides
    relatives à l''information socio-économique et à la qualification professionnelle
    des personnes travaillant dans l''agriculture (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/536/EWG: Entscheidung der Kommission vom 14. Mai 1980 über die Rückvergütung
    der im Jahr 1978 für die sozio- ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben durch den EAGFL,
    Abteilung Ausrichtung, an Irland (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/536/EØF: Kommissionens beslutning af 14. maj 1980 om refusion gennem
    EUGFL, udviklingssektionen, til Irland af de udgifter, som er afholdt i løbet
    af året 1978 til støtte vedrørende social og erhvervsmæssig vejledning og
    faglige kvalifikationer hos de personer, som arbejder i landbruget (Kun den engelske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/536/CEE: Decisione della Commissione, del 14 maggio 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, all''Irlanda delle spese
    effettuate durante il 1978 per gli aiuti concernenti l''informazione socio- economica
    e la qualificazione professionale delle persone che lavorano nell''agricoltura
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/536/EEG: Beschikking van de Commissie van 14 mei 1980 betreffende vergoeding
