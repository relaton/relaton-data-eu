id: EUDecision1980527
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/527/EEC: Commission Decision of 12 May 1980 authorizing Ireland not
    to apply Community treatment to shirts, T-shirts, lightweight fine knit roll,
    polo or turtle necked jumpers and pullovers, undervests and the like, falling
    within subheading ex 60.04 B I of the Common Customs Tariff (category 4), originating
    in Thailand and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/527/CEE: Décision de la Commission, du 12 mai 1980, autorisant l''Irlande
    à exclure du traitement communautaire les chemises, chemisettes, "T-shirts",
    sous-"pulls", maillots de corps et articles similaires, de la sous-position ex
    60.04 B I du tarif douanier commun (catégorie 4), originaires de Thaïlande et
    mis en libre pratique dans les autres Etats membres (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/527/EWG: Entscheidung der Kommission vom 12. Mai 1980, mit der Irland
    ermächtigt wird, aus Thailand stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Oberhemden, T-Shirts, Unterziehpullis, Unterhemden
    und dergleichen der Tarifstelle ex 60.04 B I des Gemeinsamen Zolltarifs (Kategorie
    4) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/527/EØF: Kommissionens beslutning af 12. maj 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, herunder sports-
    og arbejdsskjorter, T-shirts, T-shirts med rullekrave, undertrøjer og lignende,
    som henhører under pos. ex 60.04 B I i den fælles toldtarif (kategori 4), har
    oprindelse i Thailand og frit kan omsættes i de øvrige medlemsstater (Kun den
    engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/527/CEE: Decisione della Commissione, del 12 maggio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette, T-shirts,
    magliette a collo alto, camiciole e articoli simili, della sottovoce ex 60.04
    B I della tariffa doganale comune, categoria 4, originari della Tailandia e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/527/EEG: Beschikking van de Commissie van 12 mei 1980 waarbij Ierland
    wordt gemachtigd overhemden en sporthemden, T-shirts, hemdtruien (sous-pulls),
    tricotpakken, maillots de corps en dergelijke artikelen, van post ex 60.04 B I
    van het gemeenschappelijk douanetarief (categorie 4), van oorsprong uit Thailand
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
