title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1283/98 of 16 June 1998 amending Regulation
    (EC) No 65/98 fixing, for certain stocks of highly migratory fish, the total allowable
    catches for 1998, their distribution in quotas to Member States and certain conditions
    under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1283/98 du Conseil du 16 juin 1998 modifiant le règlement
    (CE) nº 65/98 fixant, pour certains stocks d'espèces hautement migratoires,
    les totaux admissibles des captures pour 1998, leur répartition en quotas entre
    les États membres et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
