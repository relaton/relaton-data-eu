    altamente migratorie, il totale ammissibile di catture per il 1998, la relativa
    distribuzione sotto forma di contingenti tra gli Stati membri e talune condizioni
    per la pesca di questi stock
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1283/98 van de Raad van 16 juni 1998 houdende wijziging
    van Verordening (EG) nr. 65/98 tot vaststelling, voor bepaalde bestanden van over
    grote afstanden trekkende vissoorten, van de totaal toegestane vangsten voor 1998,
