title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/418 of 10 March 2022 on the
    applicability of Article 34 of Directive 2014/25/EU of the European Parliament
    and of the Council to non-commercial bus transport services in the Austrian regions
    under the competence of the regional transport authorities Verkehrsverbund OstRegion
    (VOR) and Oberösterreich Verkehrsverbund (OÖVV) (notified under document C(2022)
    1352) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/418 de la Commission du 10 mars 2022
    relative à l’applicabilité de l’article 34 de la directive 2014/25/UE du
    Parlement européen et du Conseil aux services non commerciaux de transport par
    autobus dans les régions autrichiennes relevant de la compétence des autorités
    régionales de transport «Verkehrsverbund Ost-Region» (VOR) et «Oberösterreich
    Verkehrsverbund» (OÖVV) [notifiée sous le numéro C(2022) 1352] (Le texte en
    langue allemande est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/418 der Kommission vom 10. März 2022
    über die Anwendbarkeit des Artikels 34 der Richtlinie 2014/25/EU des Europäischen
    Parlaments und des Rates auf nicht-kommerzielle Busverkehrsdienste in österreichischen
    Regionen im Zuständigkeitsbereich der regionalen Verkehrsverbünde Verkehrsverbund
    Ost-Region (VOR) und Oberösterreichischer Verkehrsverbund (OÖVV) (Bekannt gegeben
    unter Aktenzeichen C(2022) 1352) (Nur der deutsche Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
