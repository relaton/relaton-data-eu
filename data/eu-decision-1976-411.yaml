type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 March 1976 concerning the application made by
    the United Kingdom under Article 115 of the Treaty for authorization to apply
    protective measures in respect of certain yarn of man-made fibres (discontinuous),
    falling within subheading 56.05 ex A of the Common Customs Tariff, originating
    in South Korea and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/411/CEE: Décision de la Commission, du 3 mars 1976, relative au recours
    à l''article 115 du Traité de Rome introduit par le Royaume-Uni visant à l''application
    de mesures de protection pour certains fils de fibres textiles synthétiques discontinues,
    de la position 56.05 Ex A du Tarif douanier commun, originaires de la Corée du
    Sud et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. März 1976 über den vom Vereinigten
    Königreich eingereichten Antrag nach Artikel 115 des Vertrages von Rom auf Anwendung
    von Schutzmaßnahmen für bestimmte aus Südkorea stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Garne aus synthetischen Spinnfasern
    der Tarifstelle 56.05 ex A des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. marts 1976 om den begæring om anvendelse
    af Romtraktatens artikel 115, som Det forenede Kongerige har indgivet vedrørende
    anvendelse af beskyttelsesforanstaltninger for visse former for garn af korte
    syntetiske fibre, som henhører under pos. 56.05 ex A i den fælles toldtarif,
    har oprindelse i Syd-Korea, og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 marzo 1976, relativa al ricorso all'articolo
    115 del trattato di Roma presentato dal Regno Unito, e tendente all'applicazione
    di misure di protezione per taluni filati di fibre tessili sintetiche in fiocco
    della voce 56.05 ex A della tariffa doganale comune, originarie della Corea del
    Sud ed immessi in libera pratica in altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 maart 1976 met betrekking tot het door
    het Verenigd Koninkrijk ingediende beroep op artikel 115 van het Verdrag van Rome
    om voor bepaalde garens van synthetische stapelvezels van post 56.05 ex A van
    het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea en in de overige
    Lid-Staten in het vrije verkeer gebracht, beschermende maatregelen toe te passen
  type: main
