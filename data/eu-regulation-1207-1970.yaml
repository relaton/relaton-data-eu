title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1207/70 of the Council of 29 June 1970 supplementing
    Regulation (EEC) No 1898/68 introducing measures to deal with basic quotas for
    sugar in the event of undertakings being merged or transferred or of factories
    being transferred or leased
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1207/70 du Conseil, du 29 juin 1970, complétant le
    règlement (CEE) n° 1898/68 établissant les mesures affectant les quotas de
    base pour le sucre en cas de fusion ou d' aliénation d' entreprise et en cas
    d' aliénation ou de location d' usines
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1207/70 des Rates vom 29. Juni 1970 zur Ergänzung
    der Verordnung (EWG) Nr. 1898/68 zur Festlegung der Maßnahmen betreffend die
    Grundquoten für Zucker im Falle der Zusammenlegung oder Veräußerung von Unternehmen
    und im Falle der Veräußerung oder Verpachtung von Fabriken
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1207/70 af 29. juni 1970 om tillæg til forordning
    (EØF) nr. 1898/68 om fastlæggelse af foranstaltninger om basiskvoterne for sukker
    i tilfælde af sammenslutning eller afhændelse af virksomheder og i tilfælde
    af afhændelse eller bortforpagtning af fabrikker
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1207/70 del Consiglio, del 29 giugno 1970, che completa
    il regolamento (CEE) n. 1898/68 che stabilisce le misure di adattamento delle
    quote di base per lo zucchero in caso di fusione o di alienazione di imprese e
    in caso di alienazione o di affitto di zuccherifici
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1207/70 van de Raad van 29 juni 1970 houdende aanvulling
    van Verordening (EEG) nr. 1898/68 tot vaststelling van de maatregelen betreffende
    de aanpassing van de basisquota voor suiker bij fusie of vervreemding van ondernemingen
    en bij vervreemding of verhuren van fabrieken
  type: main
