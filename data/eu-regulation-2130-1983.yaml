title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2130/83 of 28 July 1983 specifying the extent
    to which applications lodged during the month of July 1983 for import licences
    in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2130/83 de la Commission, du 28 juillet 1983, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1983 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2130/83 der Kommission vom 28. Juli 1983 über das
    Ausmaß, in dem den im Juli 1983 eingereichten Anträgen auf Einfuhrlizenzen für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2130/83 af 28. juli 1983 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i juli
    1983, for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2130/83 της Επιτροπής
    της 28ης Ιουλίου 1983 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Ιούλιο του 1983 για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2130/83 della Commissione, del 28 luglio 1983, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1983 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2130/83 van de Commissie van 28 juli 1983 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in juli 1983 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
