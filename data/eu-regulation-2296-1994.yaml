    N:o 1651/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2296/94 della Commissione del 23 settembre 1994 che
    modifica il regolamento (CE) n. 1222/94 che stabilisce, per taluni prodotti agricoli
