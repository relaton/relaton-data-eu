title:
- language: en
  script: Latn
  content: Commission Decision of 18 May 1976 authorizing the French Republic to permit
    temporarily the marketing of certified seed of red clover of a variety not admitted
    in the Community
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Mai 1976 zur Ermächtigung der Französischen
    Republik, vorübergehend Zertifiziertes Saatgut von Rotklee einer Sorte zum Verkehr
    zuzulassen, die nicht in der Gemeinschaft zugelassen ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. maj 1976 om bemyndigelse til Den franske
    Republik til midlertidigt at tillade handel med certificeret rødkløverfrø,
    der tilhører en sort, der ikke er tilladt i Fællesskabet
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 maggio 1976, che autorizza la Repubblica
    francese ad ammettere temporaneamente la commercializzazione di sementi certificate
    di trifoglio violetto appartenente ad una varietà non ammessa nella Comunità
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 mei 1976 waarbij de Franse Republiek
    wordt gemachtigd tijdelijk toe te staan dat gecertificeerd zaad van rode klaver
    van een niet in de Gemeenschap toegelaten ras, in de handel wordt gebracht
  type: main
