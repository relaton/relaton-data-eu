title:
- language: en
  script: Latn
  content: Commission Decision of 31 October 1989 on the establishment of Community
    support framework for Community structural assistance for the Portuguese regions
    concerned by Objective 1, namely the whole country
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 31 octobre 1989 concernant l'établissement
    du cadre communautaire d'appui pour les interventions structurelles communautaires
    dans les régions portugaises concernées par l'objectif n° 1, à savoir la totalité
    du territoire portugais (Le texte en langue portugaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 31. Oktober 1989 zur Erstellung des gemeinschaftlichen
    Foerderkonzepts fuer die Strukturinterventionen der Gemeinschaft in den portugiesischen
    Regionen die unter das Ziel Nr. 1 fallen, d. h.: das gesamte portugiesische Staatsgebiet'
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 31. oktober 1989 om fastlaeggelse af en faellesskabsstoetteramme
    for EF's strukturinterventioner i de portugisiske regioner, der er omfattet af
    maal nr. 1, dvs. hele det portugisiske territorium
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 31ης Οκτωβρίου
    1989 σχετικά με την καθιέρωση του κοινοτικού
    πλαισίου στήριξης για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις στις περιφέρειες της Πορτογαλίας
    τις οποίες αφορά ο στόχος αριθ. 1, δηλαδή το
    σύνολο της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 31 ottobre 1989 concernente il quadro comunitario
    di sostegno per gli interventi strutturali comunitari nelle regioni portoghesi
    interessate dall'obiettivo n. 1 e cioè la totalità del paese
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 31 oktober 1989 betreffende de vaststelling
    van het communautaire bestek voor de structurele bijstandsverlening van de Gemeenschap
    in de onder doelstelling 1 vallende Portugese regio'' s, te weten het gehele grondgebied
    van Portugal (Slechts de tekst in de Portugese taal is authentiek) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 31 de Outubro de 1989 relativa ao estabelecimento
    do quadro comunitário de apoio para as intervenções estruturais comunitárias
