    território português (Apenas faz fé o texto em língua portuguesa) #'
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 31 de octubre de 1989 relativa al establecimiento
    del marco comunitario de apoyo para las intervenciones estructurales comunitarias
    en las regiones portuguesas incluidas en el objetivo no 1, a saber, la totalidad
    del territorio portugués
