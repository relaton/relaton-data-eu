title:
- language: fr
  script: Latn
  content: Décision du Conseil du 15 septembre 1969, portant dérogation à la décision,
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux
    avec les pays tiers, en ce qui concerne des accords conclus par des États membres
    avec l'Inde et la Pakistan sur les textiles de coton
  type: main
- language: de
  script: Latn
  content: '69/300/EWG: Entscheidung des Rates vom 15. September 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen mit dritten Ländern in bezug auf von Mitgliedstaaten mit Indien
    und Pakistan geschlossene Abkommen über Baumwollspinnstoffe'
  type: main
- language: it
  script: Latn
  content: '69/300/CEE: Decisione del Consiglio, del 15 settembre 1969, che deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali con i paesi terzi, per quanto concerne determinati accordi
    conclusi da alcuni Stati membri con l''India e il Pakistan per i tessili di cotone'
  type: main
- language: nl
  script: Latn
  content: '69/300/EEG: Beschikking van de Raad van 15 september 1969 waarbij wordt
    afgeweken van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden met derde landen, voor wat betreft akkoorden inzake katoenprodukten
    tussen Lid-Staten en India en Pakistan'
  type: main
