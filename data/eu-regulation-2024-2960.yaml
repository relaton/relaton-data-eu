    voor de visserij op glasgrondel (Aphia minuta) in bepaalde territoriale wateren
    van Italië (Toscane en Ligurië)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/2960 z dnia 29 listopada 2024
