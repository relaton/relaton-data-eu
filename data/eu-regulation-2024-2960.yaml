    jde o minimální vzdálenost od pobřeží a minimální hloubku moře pro lov
    hlaváče průsvitného (Aphia minuta) lodními nevody v některých teritoriálních
    vodách Itálie (Toskánska a Ligurie)
  type: main
- language: da
  script: Latn
