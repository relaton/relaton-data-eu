    af vod brugt fra fartøjer, der fisker efter glaskutling (Aphia minuta) i visse
    italienske territorialfarvande (Toscana og Ligurien)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/2960 της Επιτροπής,
