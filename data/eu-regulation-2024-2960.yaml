    1967/2006 на Съвета по отношение на минималното
    разстояние от брега и минималната дълбочина
    за улов на стъкленка (Аphia minuta) с корабни грибове
    в част от териториалните води на Италия (Тоскана
    и Лигурия)
  type: main
- language: cs
  script: Latn
