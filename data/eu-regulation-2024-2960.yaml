    od obale i minimalne dubine mora za potegače otvorenog mora koje love mliječa
    ružičnog (Aphia minuta) u određenim teritorijalnim vodama Italije (Toskana
    i Ligurija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2960 végrehajtási rendelete (2024. november 29.)
    az 1967/2006/EK tanácsi rendelettől az üveggéb (Aphia minuta) Olaszország
    (Toszkána és Liguria) egyes felségvizein folytatott halászatában alkalmazott,
    hajóról működtetett kerítőhálók telepítésének parttól számított
    legkisebb távolsága és legkisebb mélysége tekintetében biztosított eltérés
    meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/2960 della Commissione, del 29 novembre
    2024, che proroga una deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto concerne la distanza minima dalla costa e la profondità minima per le
    sciabiche da natante utilizzate per la pesca del rossetto (Aphia minuta) in talune
    acque territoriali dell’Italia (Toscana e Liguria)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/2960 (2024. gada 29. novembris),
    ar kuru attiecībā uz minimālo attālumu no krasta un minimālo jūras dziļumu,
    kas jāievēro, noteiktos Itālijas (Toskānas un Ligūrijas) teritoriālajos
    ūdeņos ar laivas velkamajiem vadiem zvejojot stikla jūrasgrunduli (Aphia minuta),
    pagarina atkāpi no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2024 m. lapkričio 29 d. Komisijos įgyvendinimo reglamentas (ES) 2024/2960,
    kuriuo pratęsiamas nuo Tarybos reglamento (EB) Nr. 1967/2006 nuostatų dėl minimalaus
    atstumo nuo kranto ir minimalaus jūros gylio reikalavimų nukrypti leidžiančios
    nuostatos, taikomos afijų (Aphia minuta) žvejybai laivų traukiamaisiais tinklais
    tam tikruose Italijos (Toskanos ir Ligūrijos) teritoriniuose vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/2960 tad-29
