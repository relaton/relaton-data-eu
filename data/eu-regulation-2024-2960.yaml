  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2960 al Comisiei din 29 noiembrie
    2024 de prelungire a unei derogări de la Regulamentul (CE) nr. 1967/2006 al Consiliului
