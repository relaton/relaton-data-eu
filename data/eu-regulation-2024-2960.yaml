title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2960 of 29 November 2024 extending
    a derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from coast and the minimum sea depth for boat seines fishing for transparent
    goby (Aphia minuta) in certain territorial waters of Italy (Tuscany and Liguria)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2960 de la Commission du 29 novembre
    2024 portant prolongation de la dérogation au règlement (CE) no 1967/2006 du
    Conseil en ce qui concerne la distance de la côte et la profondeur minimales
    pour les sennes de bateau pêchant le gobie transparent (Aphia minuta) dans certaines
    eaux territoriales d’Italie (Toscane et Ligurie)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2960 der Kommission vom 29. November
    2024 zur Verlängerung einer Ausnahmegenehmigung von der Verordnung (EG) Nr. 1967/2006
    des Rates hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe
    für Bootswaden für den Fang von Glasgrundeln (Aphia minuta) in bestimmten Hoheitsgewässern
    Italiens (Toskana und Ligurien)
  type: main
- language: bg
  script: Cyrl
