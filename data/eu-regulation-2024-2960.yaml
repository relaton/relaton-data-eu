    fir-rigward tad-distanza minima mill-kosta u l-fond minimu tal-baħar għas-sajd
    bit-tartaruni għall-makku (Aphia minuta) f’ċerti ibħra territorjali tal-Italja
    (it-Toskana u l-Liguria)
  type: main
- language: nl
  script: Latn
