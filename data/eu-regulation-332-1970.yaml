title:
- language: en
  script: Latn
  content: Regulation (EEC) No 332/70 of the Commission of 23 February 1970 amending
    several Regulations on milk and milk products as regards the use of Community
    transit documents
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 332/70 de la Commission, du 23 février 1970, modifiant
    différents règlements relatifs au secteur du lait et des produits laitiers en
    ce qui concerne l' utilisation des documents de transit communautaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 332/70 der Kommission vom 23. Februar 1970 zur Änderung
    verschiedener Verordnungen auf dem Sektor Milch und Milcherzeugnisse hinsichtlich
    der Verwendung der Dokumente für das gemeinschaftliche Versandverfahren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 332/70 af 23. februar 1970 om ændring
    af forskellige forordninger indenfor sektoren mælk og mejeriprodukter med henblik
    på anvendelsen af fællesskabsforsendelsesdokumenterne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 332/70 della Commissione, del 23 febbraio 1970, che
    modifica diversi regolamenti del settore del latte e dei prodotti lattiero-caseari
    per quanto riguarda l' utilizzazione dei documenti di transito comunitario
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 332/70 van de Commissie van 23 februari 1970 houdende
    wijziging van verschillende verordeningen betreffende de sector melk en zuivelprodukten,
    ten aanzien van het gebruik van de documenten voor communautair douanevervoer
  type: main
