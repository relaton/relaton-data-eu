  script: Latn
  content: '89/198/EEC: Commission Decision of 3 March 1989 withholding approval of
    a second addendum to the addendum to the Danish programme relating to the manufacture
    of processed fruit and vegetable products, in accordance with Council Regulation
    (EEC) No 355/77 (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
