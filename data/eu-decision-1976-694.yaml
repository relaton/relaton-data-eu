id: EUDecision1976694
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 July 1976 authorizing the French Republic not
    to apply Community treatment to sound recorders or reproducers, falling within
    subheading 85.15 A III of the Common Customs Tariff, originating in Japan and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/694/CEE: Décision de la Commission, du 20 juillet 1976, autorisant
    la République française à exclure du traitement communautaire les appareils
    d''enregistrement ou de reproduction du son de la sous-position 85.15 A III du
    Tarif douanier commun, originaires du Japon, et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Juli 1976, mit der die Französische
    Republik ermächtigt wird, aus Japan stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Tonaufnahme- oder Tonwiedergabegeräte der Tarifstelle
    85.15 A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. juli 1976 om bemyndigelse af den franske
    Republik til fra fællesskabsbehandling at undtage lydoptagere eller lydgengivere,
    som henhører under position 85.15 A III i den fælles toldtarif, har oprindelse
    i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 luglio 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli apparecchi di registrazione
    o di riproduzione del suono di cui alla sottovoce 85.15 A III della tariffa doganale
    comune, originari del Giappone e immessi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 juli 1976 waarbij de Franse Republiek
    wordt gemachtigd de toestellen voor het opnemen of voor het weergeven van geluid
    van post 85.15 A III van het gemeenschappelijk douanetarief, van oorsprong uit
    Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
