  script: Latn
  content: Commission Regulation (EC) No 493/1999 of 5 March 1999 amending Regulation
    (EC) No 1484/95 laying down detailed rules for implementing the system of additional
    import duties and fixing additional import duties in the poultrymeat and egg sectors
    and for egg albumin, and repealing Regulation No 163/67/EEC
  type: main
- language: fr
  script: Latn
