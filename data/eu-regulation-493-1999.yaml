    relativo à aplicação dos direitos adicionais de importação, que fixa os direitos
    adicionais de importação nos sectores da carne de aves de capoeira e dos ovos,
    bem como para a ovalbumina, e que revoga o Regulamento n.o 163/67/CEE
  type: main
- language: ro
  script: Latn
