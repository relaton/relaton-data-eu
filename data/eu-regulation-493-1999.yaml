    végrehajtására és a kiegészítő importvám megállapítására vonatkozó
    részletes szabályok megállapításáról, valamint a 163/67/EGK rendeletet
    hatályon kívül helyezéséről szóló 1484/95/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 493/1999 della Commissione del 5 marzo 1999 recante
    modifica del regolamento (CE) n. 1484/95 che stabilisce le modalità d'applicazione
    del regime relativo all'applicazione dei dazi addizionali all'importazione e fissa
    dazi addizionali all'importazione nei settori delle uova e del pollame nonché
    per l'ovoalbumina e che abroga il regolamento n. 163/67/CEE
  type: main
- language: lv
  script: Latn
