    de drepturi de import suplimentare și de stabilire a drepturilor de import suplimentare
    în sectoarele cărnii de pasăre și ouălor și pentru albumina din ouă, și
    de abrogare a Regulamentului nr. 163/67/CEE
  type: main
- language: sk
  script: Latn
