    systemu dodatkowych należności celnych przywozowych oraz ustalające dodatkowe
    należności celne przywozowe w sektorach mięsa drobiowego i jaj oraz w odniesieniu
    do albumin jaj i uchylające rozporządzenie nr 163/67/EWG
  type: main
