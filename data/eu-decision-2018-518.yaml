type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/518 of 26 March 2018 laying
    down the animal health and veterinary certification conditions for the re-entry
    of registered horses for competition after temporary export to Indonesia, amending
    Annex I to Decision 93/195/EEC as regards the entry for Indonesia and amending
    Annex I to Decision 2004/211/EC as regards the entry for Indonesia in the list
    of third countries and parts thereof from which imports into the Union of live
    equidae and semen, ova and embryos of the equine species are authorised (notified
    under document C(2018) 1725)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/518 de la Commission du 26 mars 2018 établissant
    les conditions sanitaires et la certification sanitaire requises pour la réadmission
    de chevaux enregistrés en vue de la compétition après leur exportation temporaire
    en Indonésie, modifiant l'annexe I de la décision 93/195/CEE pour y inscrire
    l'Indonésie et modifiant l'annexe I de la décision 2004/211/CE pour insérer
    une mention relative à l'Indonésie dans la liste des pays tiers et des parties
    de ces pays en provenance desquels les importations dans l'Union d'équidés vivants
    et de sperme, d'ovules et d'embryons de l'espèce équine sont autorisées [notifiée
    sous le numéro C(2018) 1725]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/518 der Kommission vom 26. März 2018
    zur Festlegung der Tiergesundheitsbedingungen und der Veterinärbescheinigungen
    für die Wiedereinfuhr von registrierten Turnierpferden nach vorübergehender
    Ausfuhr nach Indonesien, zur Änderung von Anhang I der Entscheidung 93/195/EWG
    in Bezug auf den Eintrag für Indonesien und zur Änderung von Anhang I der Entscheidung
    2004/211/EG in Bezug auf den Eintrag für Indonesien in der Liste der Drittländer
    und der Teile von Drittländern, aus denen die Einfuhr von lebenden Equiden sowie
    von Equidensperma, -eizellen und -embryonen in die Union zugelassen ist (Bekannt
    gegeben unter Aktenzeichen C(2018) 1725)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/518 на Комисията
    от 26 март 2018 година за определяне на ветеринарно-санитарните
    условия и условията за ветеринарно сертифициране
    при повторното въвеждане на регистрирани коне
    за спортни състезания след временен износ
    в Индонезия, за изменение на приложение I към
    Решение 93/195/ЕИО по отношение на вписването
    за Индонезия и за изменение на приложение I
    към Решение 2004/211/ЕО по отношение на вписването
    за Индонезия в списъка на трети страни и части
    от тях, от които е разрешен вносът в Съюза на
    живи еднокопитни и сперма, яйцеклетки и ембриони
    от еднокопитни животни (нотифицирано под номер
    С(2018) 1725)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/518 ze dne 26. března 2018,
    kterým se stanoví veterinární podmínky a veterinární osvědčení pro zpětný
    dovoz evidovaných koní určených pro soutěže po jejich dočasném vývozu
    do Indonésie, kterým se mění příloha I rozhodnutí 93/195/EHS, pokud jde
    o položku pro Indonésii, a kterým se mění příloha I rozhodnutí 2004/211/ES,
    pokud jde o položku pro Indonésii na seznamu třetích zemí a jejich částí,
    ze kterých je povolen dovoz živých koňovitých a spermatu, vajíček a embryí
    druhů koňovitých do Unie (oznámeno pod číslem C(2018) 1725)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/518 af 26. marts 2018
    om dyresundhedsmæssige betingelser og betingelser for udstedelse af veterinærcertifikat
    ved genindførsel af heste, der er registreret med henblik på konkurrencer, efter
    midlertidig udførsel til Indonesien, om ændring af bilag I til beslutning 93/195/EØF
    for så vidt angår oplysninger vedrørende Indonesien og om ændring af bilag
    I til beslutning 2004/211/EF for så vidt angår oplysninger vedrørende Indonesien
    i listen over tredjelande og dele af tredjelande, hvorfra det er tilladt at importere
    levende dyr af hestefamilien samt sæd, æg og embryoner fra dyr af hestefamilien
    til Unionen (meddelt under nummer C(2018) 1725)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/518 της Επιτροπής,
    της 26ης Μαρτίου 2018, για τους υγειονομικούς
    όρους και την υγειονομική πιστοποίηση που
    απαιτούνται για την επανείσοδο εγγεγραμμένων
    ίππων προοριζόμενων για διαγωνισμούς ύστερα
    από προσωρινή εξαγωγή στην Ινδονησία, για την
    τροποποίηση του παραρτήματος I της απόφασης
    93/195/ΕΟΚ ως προς την καταχώριση της Ινδονησίας
    και για την τροποποίηση του παραρτήματος I
    της απόφασης 2004/211/ΕΚ ως προς την καταχώριση
    της Ινδονησίας στον κατάλογο των τρίτων χωρών
    και των περιοχών τους από τις οποίες εγκρίνονται
    εισαγωγές ζώντων ιπποειδών και σπέρματος,
    ωαρίων και εμβρύων ιπποειδών στην Ένωση [κοινοποιηθείσα
    υπό τον αριθμό C(2018) 1725]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/518, 26. märts 2018, millega kehtestatakse
    nõuded loomatervishoiu ja veterinaarsertifikaatide kohta registreeritud võistlushobuste
    taassisenemiseks pärast võistlustest tulenevat ajutist eksporti Indoneesiasse,
    millega muudetakse otsuse 93/195/EMÜ I lisa seoses Indoneesiat käsitleva kandega
    ning otsuse 2004/211/EÜ I lisa seoses Indoneesiat käsitleva kandega selliste
    kolmandate riikide ja nende osade loetelus, millest on lubatud importida liitu
    elushobuslasi ning hobuslaste spermat, munarakke ja embrüoid (teatavaks tehtud
    numbri C(2018) 1725 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/518, annettu 26 päivänä
    maaliskuuta 2018, eläinten terveyttä ja eläinlääkärintodistuksia koskevista
    vaatimuksista rekisteröityjen kilpahevosten takaisin tuomista varten niiden tilapäisen
    Indonesiaan viennin jälkeen, päätöksen 93/195/ETY liitteen I muuttamisesta
    Indonesian lisäämiseksi siihen ja päätöksen 2004/211/EY liitteen I muuttamisesta
    Indonesian mainitsemiseksi niiden kolmansien maiden ja kolmansien maiden osien
    luettelossa, joista saa tuoda unioniin eläviä hevoseläimiä sekä hevoseläinten
    siemennestettä, munasoluja ja alkioita (tiedoksiannettu numerolla C(2018) 1725)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/518 оd 26. ožujka 2018. o utvrđivanju
    uvjeta u pogledu zdravlja životinja i veterinarskog certificiranja za ponovni
    ulazak registriranih konja za natjecanja nakon privremenog izvoza u Indoneziju,
    o izmjeni Priloga I. Odluci 93/195/EEZ u pogledu unosa za Indoneziju i o izmjeni
    Priloga I. Odluci 2004/211/EZ u pogledu unosa za Indoneziju na popisu trećih
    zemalja i njihovih dijelova iz kojih je dopušten uvoz u Uniju živih kopitara
    i sjemena, jajnih stanica i zametaka kopitara (priopćeno pod brojem dokumenta
    C(2018) 1725)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/518 végrehajtási határozata (2018. március 26.)
    a lóversenyre szánt törzskönyvezett lovak Indonéziába történő ideiglenes
    kivitele utáni újrabehozatalára vonatkozó állategészségügyi és állategészségügyi
    bizonyítványozási feltételek megállapításáról, a 93/195/EGK határozat
    I. melléklete Indonéziára vonatkozó bejegyzésének módosításáról, valamint
    a 2004/211/EK határozat I. mellékletének az élő lófélék, valamint a lófélék
    spermájának, petesejtjeinek és embrióinak az Unióba történő behozatala
    tekintetében engedélyezett harmadik országok és azok részei jegyzékében
    az Indonéziára vonatkozó bejegyzés tekintetében történő módosításáról
    (az értesítés a C(2018) 1725. számú dokumentummal tötént)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/518 della Commissione, del 26 marzo 2018,
    che stabilisce le condizioni di polizia sanitaria e di certificazione veterinaria
    cui è subordinata la reintroduzione di cavalli registrati per competizioni dopo
    un'esportazione temporanea in Indonesia, che modifica l'allegato I della decisione
    93/195/CEE per quanto concerne la voce relativa all'Indonesia e l'allegato I della
    decisione 2004/211/CE per quanto concerne la voce relativa all'Indonesia nell'elenco
    dei paesi terzi e delle parti di paesi terzi da cui sono autorizzate le importazioni
    nell'Unione di equidi vivi nonché di sperma, ovuli ed embrioni della specie equina
    [notificata con il numero C(2018) 1725]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/518 (2018. gada 26. marts), ar
    ko nosaka dzīvnieku veselības un veterinārās sertifikācijas nosacījumus
    sacensībām paredzētu reģistrētu zirgu atpakaļievešanai pēc pagaidu izvešanas
    uz Indonēziju, groza Lēmuma 93/195/EEK I pielikumu attiecībā uz ierakstu par
    Indonēziju un Lēmuma 2004/211/EK I pielikumu attiecībā uz ierakstu par Indonēziju
    to trešo valstu un to daļu sarakstā, no kurām Savienībā atļauts importēt
    dzīvus zirgu dzimtas dzīvniekus un to spermu, olšūnas un embrijus (izziņots
    ar dokumenta numuru C(2018) 1725)
  type: main
- language: lt
  script: Latn
  content: 2018 m. kovo 26 d. Komisijos įgyvendinimo sprendimas (ES) 2018/518, kuriuo
    nustatomi gyvūnų sveikatos reikalavimai ir veterinarinio sertifikavimo sąlygos,
    taikytini pakartotinai įvežant registruotus arklius varžyboms po jų laikino
    eksporto į Indoneziją, dėl Indonezijos įrašo iš dalies keičiamas Sprendimo
    93/195/EEB I priedas ir dėl Indonezijos įrašo trečiųjų šalių ir jų teritorijų,
    iš kurių į Sąjungą leidžiama importuoti gyvus arklinių šeimos gyvūnus
    ir arklių rūšių spermą, kiaušialąstes ir embrionus, sąraše iš dalies
    keičiamas Sprendimo 2004/211/EB I priedas (pranešta dokumentu Nr. C(2018) 1725)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/518 tas-26 ta'
    Marzu 2018 li tistabbilixxi l-kundizzjonijiet tas-saħħa tal-annimali u taċ-ċertifikazzjoni
    veterinarja biex jiddaħħlu mill-ġdid iż-żwiemel reġistrati għall-kompetizzjoni
    wara esportazzjoni temporanja lejn l-Indoneżja, li temenda l-Anness I tad-Deċiżjoni
    93/195/KEE fir-rigward tal-entrata tal-Indoneżja u li temenda l-Anness I tad-Deċiżjoni
    2004/211/KE fir-rigward tal-entrata tal-Indoneżja fil-lista ta' pajjiżi terzi
    u partijiet minnhom minn fejn huma awtorizzati l-importazzjonijiet fl-Unjoni ta'
    ekwidi ħajjin u ta' semen, ova u embrijuni tal-ispeċi ekwina (notifikata bid-dokument
    C(2018) 1725)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/518 van de Commissie van 26 maart 2018 tot
    vaststelling van de veterinairrechtelijke voorschriften en veterinaire certificeringsvoorwaarden
    voor het opnieuw binnenbrengen van geregistreerde paarden voor wedstrijden na
    tijdelijke uitvoer naar Indonesië, tot wijziging van bijlage I bij Beschikking
    93/195/EEG wat betreft de vermelding voor Indonesië, en tot wijziging van bijlage
    I bij Beschikking 2004/211/EG wat betreft de vermelding voor Indonesië in de
    lijst van derde landen en delen daarvan waaruit levende paardachtigen en sperma,
    eicellen en embryo's van paarden in de Unie mogen worden ingevoerd (Kennisgeving
    geschied onder nummer C(2018) 1725)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/518 z dnia 26 marca 2018 r. ustanawiająca
    warunki dotyczące zdrowia zwierząt i świadectw weterynaryjnych przy powrotnym
    wwozie zarejestrowanych koni biorących udział w zawodach po wywozie czasowym
    do Indonezji, zmieniająca załącznik I do decyzji 93/195/EWG w odniesieniu do
    pozycji dotyczącej Indonezji i zmieniająca załącznik I do decyzji 2004/211/WE
    w odniesieniu do pozycji dotyczącej Indonezji w wykazie państw trzecich oraz
    części ich terytoriów, z których dozwolony jest przywóz do Unii żywych koniowatych
    oraz nasienia, komórek jajowych i zarodków koniowatych (notyfikowana jako dokument
    nr C(2018) 1725)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/518 da Comissão, de 26 março de 2018,
    que estabelece as condições sanitárias e de certificação veterinária para
    a reentrada de cavalos registados para concursos após exportação temporária
    para a Indonésia, que altera o anexo I da Decisão 93/195/CEE no que diz respeito
    à entrada relativa à Indonésia e que altera o anexo I da Decisão 2004/211/CE
    no que diz respeito à entrada relativa à Indonésia na lista de países terceiros
    e partes de países terceiros a partir dos quais são autorizadas as importações
    para a União de equídeos vivos e de sémen, óvulos e embriões de equídeos
    [notificada com o número C(2018) 1725]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/518 a Comisiei din 26 martie 2018
    de stabilire a condițiilor de sănătate animală și de certificare veterinară
    pentru reintroducerea cailor înregistrați pentru competiții după exportul
    temporar în Indonezia, de modificare a anexei I la Decizia 93/195/CEE în ceea
    ce privește rubrica referitoare la Indonezia și de modificare a anexei I la
    Decizia 2004/211/CE în ceea ce privește rubrica referitoare la Indonezia din
    lista țărilor terțe și a regiunilor acestora din care sunt autorizate importurile
    în Uniune de ecvidee vii și de material seminal, de ovule și de embrioni din
    specia ecvină [notificată cu numărul C(2018) 1725]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/518 z 26. marca 2018, ktorým
    sa stanovujú požiadavky na zdravie zvierat a podmienky veterinárnej certifikácie
    pri opätovnom vstupe registrovaných koní určených na súťaže po dočasnom
    vývoze do Indonézie a ktorým sa mení príloha I k rozhodnutiu 93/195/EHS,
    pokiaľ ide o zápis týkajúci sa Indonézie, a príloha I k rozhodnutiu 2004/211/ES,
    pokiaľ ide o zápis týkajúci sa Indonézie v zozname tretích krajín a častí
    ich územia, z ktorých je povolený dovoz živých zvierat koňovitých a ich
    spermy, oocytov a embryí do Únie [oznámené pod číslom C(2018) 1725]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/518 z dne 26. marca 2018 o določitvi
    pogojev v zvezi z zdravjem živali in izdajanjem veterinarskih spričeval za ponovni
    vstop registriranih konjev za tekmovanja po začasnem izvozu v Indonezijo, o spremembi
    Priloge I k Odločbi 93/195/EGS glede vnosa za Indonezijo ter spremembi Priloge
    I k Odločbi 2004/211/ES glede vnosa za Indonezijo na seznamu tretjih držav in
    njihovih delov, s katerih je dovoljen uvoz živih enoprstih kopitarjev ter njihovega
    semena, jajčnih celic in zarodkov v Unijo (notificirano pod dokumentarno številko
    C(2018) 1725)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/518 de la Comisión, de 26 de marzo de
    2018, por la que se establecen las condiciones zoosanitarias y la certificación
    veterinaria necesarias para la reintroducción de caballos registrados para concursos
    hípicos después de su exportación temporal a Indonesia, se modifica el anexo
    I de la Decisión 93/195/CEE en lo que se refiere a la entrada correspondiente
    a Indonesia y se modifica el anexo I de la Decisión 2004/211/CE en lo que se
    refiere a la entrada correspondiente a Indonesia en la lista de terceros países
    y partes de terceros países desde los que se autorizan las importaciones a la
    Unión de équidos vivos y esperma, óvulos y embriones de la especie equina [notificada
    con el número C(2018) 1725]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/518 av den 26 mars 2018 om
    djurhälsovillkor och villkor för utfärdande av veterinärintyg för återinförsel
    av hästar som registrerats för tävlingar efter tillfällig export till Indonesien,
    om ändring av bilaga I till beslut 93/195/EEG vad gäller uppgifterna om Indonesien
    och om ändring av bilaga I till beslut 2004/211/EG vad gäller uppgifterna om
    Indonesien i förteckningen över tredjeländer och delar av tredjeländer från
    vilka import till unionen av levande hästdjur och sperma, ägg och embryon från
    hästdjur är tillåten [delgivet med nr C(2018) 1725]
  type: main
