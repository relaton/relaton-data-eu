    einerseits und der Republik Österreich, der Republik Finnland, der Republik Island,
    dem Königreich Norwegen, dem Königreich Schweden bzw. der Schweizerischen Eidgenossenschaft
    andererseits über die vom 1. Januar 1986 bis 28. Februar 1986 zwischen Spanien
    und Portugal einerseits und Österreich, Finnland, Island, Norwegen, Schweden
    und der Schweiz andererseits anwendbare Handelsregelung
  type: main
- language: da
  script: Latn
