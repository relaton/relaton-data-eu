    på den ene side og republikken Østrig, republikken Finland, republikken Island,
    kongeriget Norge, kongeriget Sverige og Schweiz på den anden side om den ordning,
    der skal gælde fra 1. januar til 28. februar 1986 for samhandelen mellem Spanien
    og Portugal på den ene side og Østrig, Finland, Island, Norge, Sverige og Schweiz
    på den anden side
