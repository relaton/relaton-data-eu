title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3825/85 of 20 December 1985 concerning the
    conclusion of Agreements in the form of an exchange of letters between the European
    Economic Community on the one hand and the Republic of Austria, the Republic of
    Finland, the Republic of Iceland, the Kingdom of Norway, the Kingdom of Sweden
    and the Swiss Confederation respectively, on the other, on the arrangements applicable
    to trade between Spain and Portugal on the one hand, and Austria, Finland, Iceland,
    Norway, Sweden and Switzerland respectively on the other, from 1 January to 28
    February 1986
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3825/85 du Conseil du 20 décembre 1985 concernant
    la conclusion des accords sous forme d'échange de lettres entre la Communauté
    économique européenne, d'une part, et la République d'Autriche, la République
    de Finlande, la République d'Islande, le Royaume de Norvège, le Royaume de Suède
    et la Confédération suisse respectivement, d'autre part, relatifs au régime
    applicable du 1er janvier au 28 février 1986 aux échanges entre l'Espagne et
    le Portugal, d'une part, et respectivement l'Autriche, la Finlande, la Norvège,
    l'Islande, la Suède et la Suisse, d'autre part
  type: main
- language: de
  script: Latn
