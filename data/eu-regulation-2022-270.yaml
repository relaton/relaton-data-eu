title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/270 of 23 February 2022 correcting
    Implementing Regulation (EU) 2021/1410 concerning the authorisation of a preparation
    of Bacillus licheniformis DSM 28710 as a feed additive for laying hens, minor
    poultry species for laying, poultry species for breeding and ornamental birds
    (holder of authorisation Huvepharma NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2022/270 de la Commission du 23 février
    2022 rectifiant le règlement d’exécution (UE) 2021/1410 concernant l’autorisation
    d’une préparation de Bacillus licheniformis DSM 28710 en tant qu’additif
    pour l’alimentation des poules pondeuses, des espèces aviaires mineures destinées
    à la ponte, des espèces de volailles de reproduction et des oiseaux d’ornement
    (titulaire de l’autorisation: Huvepharma NV)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2022/270 der Kommission vom 23. Februar
    2022 zur Berichtigung der Durchführungsverordnung (EU) 2021/1410 zur Zulassung
    einer Zubereitung aus Bacillus licheniformis DSM 28710 als Zusatzstoff in Futtermitteln
    für Legehennen, Legegeflügelarten von geringerer wirtschaftlicher Bedeutung,
    Zuchtgeflügel und Ziervögel (Zulassungsinhaber: Huvepharma NV)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/270 на Комисията
    от 23 февруари 2022 година за поправка на Регламент
    за изпълнение (ЕС) 2021/1410 за разрешаване на употребата
    на препарат от Bacillus licheniformis DSM 28710 като фуражна
    добавка за кокошки носачки, домашни птици с
    по-малко стопанско значение, отглеждани за
    носачки, видове домашни птици за разплод и
    декоративни птици (притежател на разрешението
    Huvepharma NV)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/270 ze dne 23. února 2022, kterým
