    DSM 28710 kao dodatka hrani za kokoši nesilice, manje značajne vrste peradi
    za nesenje, vrste peradi za rasplod i ukrasne ptice (nositelj odobrenja Huvepharma
    NV)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2022/270 végrehajtási rendelete (2022. február 23.)
    a Bacillus licheniformis DSM 28710 készítmény tojótyúkok, kevésbé jelentős
    tojóbaromfifajok, tenyészbaromfifajok és díszmadarak takarmány-adalékanyagaként
    történő engedélyezéséről (az engedély jogosultja: Huvepharma NV) szóló
    (EU) 2021/1410 végrehajtási rendelet helyesbítéséről'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/270 della Commissione del 23 febbraio
    2022 che rettifica il regolamento di esecuzione (UE) 2021/1410 relativo all’autorizzazione
    di un preparato di Bacillus licheniformis DSM 28710 come additivo per mangimi
    destinati a galline ovaiole, specie avicole minori destinate alla produzione di
    uova, specie avicole da riproduzione e uccelli ornamentali (titolare dell’autorizzazione
    Huvepharma NV)
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2022/270 (2022. gada 23. februāris),
    ar kuru labo Īstenošanas regulu (ES) 2021/1410 par atļauju Bacillus licheniformis
    DSM 28710 preparātu lietot par barības piedevu dējējvistām, mazāk izplatītu
    sugu dējējputniem, vaislas mājputniem un dekoratīvajiem putniem (atļaujas
    turētājs: uzņēmums Huvepharma NV)'
  type: main
