    licheniformis DSM 28710 jako doplňkové látky pro nosnice, menšinové druhy
    drůbeže určené ke snášce, chovné druhy drůbeže a okrasné ptactvo (držitel
    povolení Huvepharma NV)
  type: main
- language: da
  script: Latn
