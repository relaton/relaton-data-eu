    Bacillus licheniformis DSM 28710 preparatą kaip vištų dedeklių, retesnių
    rūšių dedeklinių naminių paukščių, veislinių naminių paukščių ir
    dekoratyvinių paukščių lesalų priedą (leidimo turėtoja – bendrovė „Huvepharma
