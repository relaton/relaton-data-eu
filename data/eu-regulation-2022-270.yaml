    Bacillus licheniformis DSM 28710 a údarú mar bhreiseán beathaithe le haghaidh
    béaróg, mionspeicis éanlaithe clóis le haghaidh breithe, speicis éanlaithe
    clóis le haghaidh pórúcháin agus éin ornáideacha (sealbhóir an údaraithe
