title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3484/80 of 29 December 1980 determining
    the amounts of the variable components, accession compensatory amounts and additional
    duties applicable during the month of January 1981 on the importation into the
    Community of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3484/80 de la Commission, du 29 décembre 1980, déterminant
    les montants des éléments mobiles et les montants compensatoires «adhésion»,
    ainsi que les droits additionnels applicables pendant le mois de janvier 1981
    à l'importation dans la Communauté des marchandises relevant du règlement (CEE)
    n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3484/80 der Kommission vom 29. Dezember 1980 zur Festsetzung
    der Höhe der im Januar 1981 bei der Einfuhr der unter die Verordnung (EWG) Nr.
    3033/80 fallenden Waren in die Gemeinschaft geltenden beweglichen Teilbeträge,
    Beitrittsausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3484/80 af 29. december 1980 om fastsættelse
    af størrelsen af de variable elementer, tiltrædelsesudligningsbeløb og tillægstold
    for indførsel i Fællesskabet af varer henhørende under forordning (EØF) nr.
    3033/80 for januar 1981
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3484/80 della Commissione, del 29 dicembre 1980, che
    determina gli importi degli elementi mobili e gli importi compensativi adesione,
    nonché i dazi addizionali applicabili all'importazione nella Comunità, per il
    mese di gennaio 1981, delle merci cui si applica il regolamento (CEE) n. 3033/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3484/80 van de Commissie van 29 december 1980 tot
    vaststelling van het beloop der gedurende de maand januari 1981 bij invoer in
    de Gemeenschap van onder Verordening (EEG) nr. 3033/80 vallende goederen toe te
    passen variabele elementen, compenserende bedragen "toetreding" en aanvullende
    invoerrechten
