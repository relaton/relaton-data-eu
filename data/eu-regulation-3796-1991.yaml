title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3796/91 of 19 December 1991 setting for the
    1991/92 marketing year the percentage mentioned in the second subparagraph of
    Article 3 (1a) of Regulation (EEC) No 426/86 in connection with the premium granted
    for products processed from tomatoes
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CEE) No 3796/91 DU CONSEIL du 19 décembre 1991 fixant, pour
    la campagne 1991/1992, le pourcentage visé à l'article 3 paragraphe 1 bis deuxième
    alinéa du règlement (CEE) no 426/86 en ce qui concerne la prime octroyée pour
    les produits transformés à base de tomates
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3796/91 DES RATES vom 19. Dezember 1991 zur Festsetzung
    des Prozentsatzes nach Artikel 3 Absatz 1a Unterabsatz 2 der Verordnung (EWG)
    Nr. 426/86 hinsichtlich der Prämie für Verarbeitungserzeugnisse aus Tomaten
    im Wirtschaftsjahr 1991/92
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3796/91 af 19. december 1991 om fastsættelse
    for produktionsåret 1991/92 af den procentdel, der er omhandlet i artikel 3,
    stk. 1a, andet afsnit, i forordning (EØF) nr. 426/86, for så vidt angår den
    præmie, der ydes for produkter forarbejdet på basis af tomater
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3796/91 του Συμβουλίου
    της 19ης Δεκεμβρίου 1991 για τον καθορισμό, για
    την περίοδο εμπορίας 1991/92, του ποσοστού που
    αναφέρεται στο άρθρο 3 παράγραφος 1α δεύτερο
    εδάφιο του κανονισμού ( ΕΟΚ ) αριθ. 426/86 όσον
    αφορά την πριμοδότηση που χορηγείται στα μεταποιημένα
    προϊόντα με βάση την τομάτα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3796/91 DEL CONSIGLIO del 19 dicembre 1991 che fissa,
    per la campagna 1991/1992, la percentuale di cui all'articolo 3, paragrafo 1 bis,
    secondo comma del regolamento (CEE) n. 426/86 per quanto riguarda l'aiuto accordato
    ai prodotti trasformati a base di pomodori
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3796/91 VAN DE RAAD van 19 december 1991 houdende
    vaststelling, voor het verkoopseizoen 1991/1992, van het in artikel 3, lid 1 bis,
    tweede alinea, van Verordening (EEG) nr. 426/86 bedoelde percentage voor wat betreft
    de premie voor verwerkte produkten op basis van tomaten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 3796/91 DO CONSELHO de 19 de Dezembro de 1991 que
    fixa, para a campanha de 1991/1992, a percentagem referida no no 1A, segundo parágrafo,
    do artigo 3o do Regulamento (CEE) no 426/86, no que se refere ao prémio concedido
    para os produtos transformados à base de tomates
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3796/91 DEL CONSEJO de 19 de diciembre de 1991 por
    el que se fija, para la campaña de 1991/92, el porcentaje contemplado en el párrafo
    segundo del apartado 1 bis del artículo 3 del Reglamento (CEE) no 426/86 por
    lo que se refiere a la prima concedida a los productos transformados a base de
    tomates #'
