  content: '94/835/EC: Commission Decision of 15 December 1994 approving the Single
    Programming Document for Community structural measures for improving the processing
    and marketing conditions for agricultural products in the Netherlands in respect
    of Objective 5a, covering the period between 1994 and 1999 (Only the Dutch text
    is authentic)'
  type: main
- language: fr
  script: Latn
