id: EURegulation2051978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 205/78 of 31 January 1978 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of certain non-member countries in the 200 nautical
    mile zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 205/78 du Conseil, du 31 janvier 1978, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    à l' égard des navires battant pavillon de certains pays tiers dans la zone
    de 200 milles située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 205/78 des Rates vom 31. Januar 1978 zur Festlegung
    von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    in der 200-Meilen-Zone vor der Küste des französischen Departements Guyana gegenüber
    Schiffen, welche die Flagge von Drittländern führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 205/78 af 31. januar 1978 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse af fiskeressourcerne,
    gældende for fartøjer, der sejler under tredjelandes flag, i zonen på 200 sømil
    ud for det franske departement Guyanas kyster
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 205/78 del Consiglio, del 31 gennaio 1978, che fissa
    alcune misure temporanee di conservazione e di gestione delle risorse ittiche
    da applicare nei riguardi delle navi da pesca che battono bandiera di taluni paesi
    terzi nella zona di 200 miglia situata al largo delle coste del dipartimento francese
    della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 205/78 van de Raad van 31 januari 1978 tot vaststelling
    van bepaalde overgangsmaatregelen voor de instandhouding en het beheer van de
    visbestanden, die van toepassing zijn ten aanzien van schepen die de vlag voeren
    van bepaalde derde landen in de 200-mijlzone gelegen langs de kusten van het Franse
    departement Guyana
  type: main
