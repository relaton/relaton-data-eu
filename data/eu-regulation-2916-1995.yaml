title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2916/95 of 18 December 1995 amending certain
    Regulations concerning the common organization of the markets in poultrymeat and
    eggs and the common system of trade for ovalbumin and lactalbumin
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2916/95 de la Commission, du 18 décembre 1995, modifiant
    certains règlements relatifs à l'organisation commune des marchés dans les
    secteurs de la viande de volaille et des oeufs et au régime commun d'échanges
    pour l'ovalbumine et la lactalbumine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2916/95 der Kommission vom 18. Dezember 1995 zur Änderung
    bestimmter Verordnungen betreffend die gemeinsame Marktorganisation für Geflügelfleisch
    und für Eier sowie die gemeinsame Handelsregelung für Eieralbumin und Milchalbumin
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2916/95 на Комисията от 18 декември
    1995 година за изменение на някои регламенти,
    свързани с общата организация на пазарите
    на птиче месо и яйца и общата система за търговия
    с яйчен и млечен албумин
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2916/95 ze dne 18. prosince 1995, kterým se
    mění některá nařízení o společné organizaci trhů v odvětví drůbežího
    masa a vajec a o společném obchodním režimu pro vaječný albumin a mléčný
    albumin
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2916/95 af 18. december 1995 om ændring
    af visse forordninger vedrørende den fælles markedsordning for fjerkrækød
    og æg og af den fælles handelsordning for ægalbumin og mælkealbumin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2916/95 της Επιτροπής,
    της 18ης Δεκεμβρίου 1995, για τροποποίηση ορισμένων
    κανονισμών περί κοινής οργανώσεως αγοράς στους
    τομείς του κρέατος πουλερικών και των αυγών
    και περί κοινού συστήματος εμπορίας για την
    ωοαλβουμίνη και την γαλακτοαλβουμίνη
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2916/95, 18. detsember 1995, millega muudetakse
    kodulinnuliha- ja munaturu ühist korraldust ning ovoalbumiini ja laktalbumiini
    ühist kaubandussüsteemi käsitlevaid määrusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2916/95, annettu 18 päivänä joulukuuta 1995,
    tiettyjen siipikarjanliha-alan ja muna-alan yhteisistä markkinajärjestelyistä
    sekä muna-albumiinin ja maitoalbumiinin yhteisestä kauppajärjestelmästä annettujen
    asetusten muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 2916/95 od 18. prosinca 1995. o izmjeni određenih
    uredbi o zajedničkom uređenju tržišta mesa peradi i jaja i zajedničkom sustavu
    trgovine ovalbuminom i laktalbuminom
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2916/95/EK rendelete (1995. december 18.) a baromfihús és
    a tojás piacainak közös szervezésére, valamint az ovalbumin és a laktalbumin
    közös kereskedelmi rendszerére vonatkozó egyes rendeletek módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2916/95 della Commissione, del 18 dicembre 1995, che
    modifica alcuni regolamenti relativi all'organizzazione comune dei mercati nei
    settori del pollame e delle uova e al regime comune degli scambi per l'ovoalbumina
    e la lattoalbumina
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2916/95 (1995. gada 18. decembris), kas groza
    dažas regulas par putnu gaļas un olu tirgus kopēju organizāciju un par vienotu
    sistēmu tirdzniecībai ar ovalbumīnu un laktabumīnu
  type: main
- language: lt
  script: Latn
  content: 1995 m. gruodžio 18 d. Komisijos reglamentas (EB) Nr. 2916/95, iš dalies
    keičiantis tam tikrus reglamentus dėl bendro paukštienos ir kiaušinių rinkos
    organizavimo bei dėl bendros prekybos ovalbuminu ir laktalbuminu sistemos
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissijoni (KE) Nru 2916/95 tat-18 ta’ Diċembru
    1995 li jemenda ċerti Regolamenti li għandhom x’jaqsmu ma’ l-organizzazzjoni
    komuni tas-swieq tal-laħam tat-tjur u l-bajd u s-sistema komuni ta’ kummerċ
    għal ovalbumin u lactalbumin
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2916/95 van de Commissie van 18 december 1995 tot
    wijziging van sommige verordeningen betreffende de gemeenschappelijke ordening
    der markten in de sectoren slachtpluimvee en eieren en de gemeenschappelijke regeling
    van het handelsverkeer voor ovoalbumine en lactoalbumine
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2916/95 z dnia 18 grudnia 1995 r. zmieniające
    niektóre rozporządzenia dotyczące wspólnej organizacji rynków drobiu i jaj
    oraz wspólnego systemu obrotu albuminą jaja kurzego i albuminą mleka
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2916/95 da Comissão, de 18 de Dezembro de 1995, que
    altera determinados regulamentos relativos à organização comum dos mercados
    nos sectores da carne de aves de capoeira e dos ovos e ao regime comum de trocas
    comerciais para a ovalbumina e para a lactalbumina
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2916/95 al Comisiei din 18 decembrie 1995 de modificare
    a unor regulamente privind organizarea comună a piețelor în sectorul cărnii
    de pasăre și ouălor și regimul comun de comercializare a ovalbuminei și lactalbuminei
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2916/95 z 18. decembra 1995, ktorým sa menia
    a dopĺňajú niektoré nariadenia, týkajúce sa spoločnej organizácie trhov
    s mäsom z hydiny a vajcami a spoločného systému obchodovanie pre ovalbumín
    a laktalbumín
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2916/95 z dne 18. decembra 1995 o spremembi nekaterih
    uredb o skupni ureditvi trgov za perutninsko meso in jajca in skupnem sistemu
    trgovanja z ovalbuminom in laktalbuminom
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2916/95 de la Comisión, de 18 de diciembre de 1995,
    por el que se modifican determinados Reglamentos relativos a la organización
    común de mercados en los sectores de la carne de aves de corral y de los huevos
    y al régimen común de intercambios comerciales de ovoalbúmina y lactoalbúmina
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2916/95 av den 18 december 1995 om ändring
    av vissa förordningar om den gemensamma organisationen av marknaderna för fjäderfäkött
    och ägg och om det gemensamma handelssystemet för äggalbumin och mjölkalbumin
  type: main
