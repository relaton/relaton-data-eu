title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/503 of 18 March 2025 laying
    down rules for the application of Regulation (EU) 2024/1351 of the European Parliament
    and of the Council, as regards the template to be used by Member States to ensure
    that their national asylum and migration management strategies are comparable
    on specific core elements
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/503 de la Commission du 18 mars 2025
    portant modalités d’application du règlement (UE) 2024/1351 du Parlement européen
    et du Conseil, en ce qui concerne le modèle que doivent utiliser les États membres
    pour veiller à ce que leurs stratégies nationales de gestion de l’asile et
    de la migration soient comparables quant à des éléments essentiels spécifiques
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/503 der Kommission vom 18. März 2025
    mit Durchführungsbestimmungen zur Verordnung (EU) 2024/1351 des Europäischen
    Parlaments und des Rates hinsichtlich des Musters, das von den Mitgliedstaaten
    zu verwenden ist, damit ihre nationalen Strategien für das Asyl- und Migrationsmanagement
    bei spezifischen Kernelementen vergleichbar sind
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/503 на Комисията
    от 18 март 2025 година за определяне на правила
    за прилагането на Регламент (ЕС) 2024/1351 на Европейския
    парламент и на Съвета по отношение на модела,
    който да се използва от държавите членки, за
    да се гарантира, че техните национални стратегии
    за управление на убежището и миграцията са
    съпоставими по отношение на специфични ключови
    елементи
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/503 ze dne 18. března 2025,
    kterým se stanoví prováděcí pravidla k nařízení Evropského parlamentu
    a Rady (EU) 2024/1351, jež se týkají vzoru, který mají členské státy použít,
    aby se zajistilo, že jejich vnitrostátní strategie v oblasti řízení azylu
    a migrace jsou srovnatelné, pokud jde o konkrétní základní prvky
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/503 af 18. marts 2025
    om regler for anvendelsen af Europa-Parlamentets og Rådets forordning (EU) 2024/1351
    for så vidt angår det skema, der skal anvendes af medlemsstaterne for at sikre,
    at deres nationale strategier for asylforvaltning og migrationsstyring er sammenlignelige
    med hensyn til specifikke centrale elementer
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2025/503 της Επιτροπής,
    της 18ης Μαρτίου 2025, για τη θέσπιση κανόνων εφαρμογής
    του κανονισμού (ΕΕ) 2024/1351 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, όσον αφορά το υπόδειγμα
    προς χρήση από τα κράτη μέλη προκειμένου να
    εξασφαλιστεί ότι οι εθνικές στρατηγικές τους
    είναι συγκρίσιμες για τη διαχείριση του ασύλου
    και της μετανάστευσης όσον αφορά συγκεκριμένα
    βασικά στοιχεία
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2025/503, 18. märts 2025, millega kehtestatakse
