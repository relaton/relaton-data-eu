    predloška koji države članice trebaju koristiti kako bi osigurale da su njihove
    nacionalne strategije upravljanja azilom i migracijama usporedive u određenim
    važnim elementima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/503 végrehajtási határozata (2025. március 18.)
    az (EU) 2024/1351 európai parlamenti és tanácsi rendeletnek a tagállamok által
    a nemzeti menekültügyi és migrációkezelési stratégiáik meghatározott
    központi elemek szerinti összehasonlíthatóságának biztosítása érdekében
    használandó sablon tekintetében történő alkalmazására vonatkozó szabályok
    megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/503 della Commissione, del 18 marzo 2025,
    recante modalità di applicazione del regolamento (UE) 2024/1351 del Parlamento
    europeo e del Consiglio per quanto riguarda il modello che gli Stati membri sono
    tenuti a utilizzare per garantire che le loro strategie nazionali di gestione
    dell’asilo e della migrazione siano comparabili riguardo a specifici elementi
    centrali
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/503 (2025. gada 18. marts), ar
    ko paredz noteikumus Eiropas Parlamenta un Padomes Regulas (ES) 2024/1351 piemērošanai
    attiecībā uz veidni, kura dalībvalstīm jāizmanto, lai nodrošinātu, ka to
    valsts patvēruma un migrācijas pārvaldības stratēģijas ir salīdzināmas
    attiecībā uz konkrētiem pamatelementiem
  type: main
- language: lt
  script: Latn
  content: 2025 m. kovo 18 d. Komisijos įgyvendinimo sprendimas (ES) 2025/503, kuriuo
    nustatomos Europos Parlamento ir Tarybos reglamento (ES) 2024/1351 taikymo taisyklės
    dėl šablono, valstybių narių naudotino siekiant užtikrinti, kad jų nacionalines
    prieglobsčio ir migracijos valdymo strategijas būtų galima palyginti pagal
    konkrečius pagrindinius elementus
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/503 tat-18
