    (UE) 2024/1351 tal-Parlament Ewropew u tal-Kunsill, fir-rigward tal-mudell li
    għandu jintuża mill-Istati Membri biex jiżguraw li l-istrateġiji nazzjonali
    tagħhom għall-ġestjoni tal-ażil u l-migrazzjoni jkunu komparabbli dwar elementi
    ewlenin speċifiċi
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2025/503 van de Commissie van 18 maart 2025 tot
