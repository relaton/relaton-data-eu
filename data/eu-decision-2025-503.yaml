    varmistamiseksi, että niiden kansalliset turvapaikka-asioiden ja muuttoliikkeen
    hallintastrategiat ovat tiettyjen keskeisten osatekijöiden osalta vertailukelpoisia
  type: main
- language: ga
  script: Latn
