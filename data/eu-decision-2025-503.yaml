    Europees Parlement en de Raad, wat betreft het model dat de lidstaten moeten gebruiken
    om ervoor te zorgen dat hun nationale strategieën voor asiel- en migratiebeheer
    op specifieke kernelementen vergelijkbaar zijn
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2025/503 z dnia 18 marca 2025 r. ustanawiająca
    zasady stosowania rozporządzenia Parlamentu Europejskiego i Rady (UE) 2024/1351
    w odniesieniu do szablonu, który mają wykorzystywać państwa członkowskie
    w celu zapewnienia porównywalności poszczególnych podstawowych elementów ich
    strategii krajowych
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/503 da Comissão, de 18 de março de 2025,
    que estabelece as normas de execução do Regulamento (UE) 2024/1351 do Parlamento
    Europeu e do Conselho relativas ao modelo a utilizar pelos Estados-Membros para
    assegurar que as suas estratégias nacionais de gestão do asilo e da migração
    são comparáveis no que toca a elementos essenciais específicos
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/503 a Comisiei din 18 martie 2025
    de stabilire a normelor de aplicare a Regulamentului (UE) 2024/1351 al Parlamentului
    European și al Consiliului în ceea ce privește modelul care trebuie utilizat
    de statele membre pentru a se asigura că strategiile lor naționale de gestionare
    a azilului și migrației sunt comparabile în ceea ce privește anumite elemente
    de bază specifice
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/503 z 18. marca 2025, ktorým
    sa stanovujú pravidlá uplatňovania nariadenia Európskeho parlamentu a Rady
    (EÚ) 2024/1351 v súvislosti so vzorovým formulárom, ktorý majú členské
    štáty používať na zabezpečenie porovnateľnosti svojich národných stratégií
    riadenia azylu a migrácie, pokiaľ ide o konkrétne základné prvky
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/503 z dne 18. marca 2025 o določitvi
    pravil za uporabo Uredbe (EU) 2024/1351 Evropskega parlamenta in Sveta v zvezi
    s predlogo, ki jo države članice uporabljajo, da zagotovijo, da so njihove nacionalne
    strategije za upravljanje azila in migracij primerljive glede na posebne ključne
    elemente
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2025/503 de la Comisión, de 18 de marzo de
    2025, por la que se establecen normas para la aplicación del Reglamento (UE)
    2024/1351 del Parlamento Europeo y del Consejo, en lo relativo al modelo que deben
    usar los Estados miembros para asegurar que sus estrategias nacionales de gestión
    del asilo y la migración sean comparables en elementos esenciales específicos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2025/503 av den 18 mars 2025 om
    tillämpningsföreskrifter för Europaparlamentets och rådets förordning (EU)
    2024/1351 vad gäller den mall som medlemsstaterna ska använda för att säkerställa
    att deras nationella asyl- och migrationshanteringsstrategier är jämförbara
    i fråga om specifika centrala delar
