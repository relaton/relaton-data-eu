title:
- language: fr
  script: Latn
  content: Décision du Conseil du 15 juin 1965, relative au régime applicable, dans
    les domaines des garanties et des financements à l'exportation, à certaines
    sous-traitances en provenance d'autre pays membres ou de pays non membres de la
    CEE
  type: main
- language: de
  script: Latn
  content: '65/312/EWG: Beschluß des Rates vom 15. Juni 1965 über die Regelung,
    die auf dem Gebiet der Ausfuhrbürgschaften und der Ausfuhrfinanzierungen auf
    bestimmte Zulieferungen aus anderen Mitgliedsländern oder aus Nichtmitgliedsländern
    der Europäischen Wirtschaftsgemeinschaft Anwendung findet'
  type: main
- language: it
  script: Latn
  content: '65/312/CEE: Decisione del Consiglio, del 15 giugno 1965, relativa al regime
    applicabile, nei settori delle garanzie e dei finanziamenti all''esportazione,
    a talune subforniture in provenienza da altri paesi membri o da paesi non membri
    della CEE'
  type: main
- language: nl
  script: Latn
  content: '65/312/EEG: Besluit van de Raad van 15 juni 1965 betreffende de regeling
    welke bij exportgaranties en export-financieringen geldt voor bepaalde onderleveranties
    afkomstig uit staten, al dan niet lid van de Europese Economische Gemeenschap'
  type: main
