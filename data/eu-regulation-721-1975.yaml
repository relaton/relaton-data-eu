title:
- language: en
  script: Latn
  content: Regulation (EEC) No 721/75 of the Commission of 19 March 1975 fixing, for
    the partial invitation to tender of 26 March 1975, the maximum tonnages and the
    adjustment amounts of the subsidy respectively referred to in Articles 1 (2) and
    13 (2) of Regulation (EEC) No 557/75 as well as the adjustment amounts referred
    to in Article 14 (2) of Regulation (EEC) No 558/75
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 721/75 de la Commission, du 19 mars 1975, fixant, pour
    l'adjudication partielle du 26 mars 1975, les quantités maximales et les montants
    d'adaptation de la subvention visés respectivement à l'article 1er paragraphe
    2 et à l'article 13 paragraphe 2 du règlement (CEE) n 557/75 ainsi que les montants
    d'adaptation de la subvention visés à l'article 14 paragraphe 2 du règlement
    (CEE) n 558/75
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 721/75 der Kommission vom 19. März 1975 zur Festsetzung
    für die Teilausschreibung vom 26. März 1975 der in Artikel 1 Absatz 2 genannten
    Höchstmengen und der in Artikel 13 Absatz 2 der Verordnung (EWG) Nr. 557/75 genannten
    sowie der in Artikel 14 Absatz 2 der Verordnung (EWG) Nr. 558/75 genannten Beträge
    für die Anpassung der Subvention
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 721/75 af 19. marts 1975 om fastsættelse,
    for så vidt angår del-licitationen af 26. marts 1975, af de maksimale mængder
    og det tilpasningsbeløb for tilskuddet, som er anført henholdsvis i artikel
    1, stk. 2, og i artikel 13, stk. 2, i forordning (EØF) nr. 557/75, samt det tilpasningsbeløb
    for tilskuddet, som er anført i artikel 14, stk. 2, i forordning (EØF) nr. 558/75
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 721/75 della Commissione, del 19 marzo 1975, che fissa
    per la gara parziale del 26 marzo 1975, i quantitativi massimi e gli importi di
    adattamento della sovvenzione indicati rispettivamente all'articolo 1, paragrafo
    2, e all'articolo 13, paragrafo 2, del regolamento (CEE) n. 557/75, nonché gli
    importi di adattamento della sovvenzione di cui all'articolo 14, paragrafo 2,
    del regolamento (CEE) n. 558/75
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 721/75 van de Commissie van 19 maart 1975 houdende
    vaststelling voor de deelinschrijving van 26 maart 1975 van de maximumhoeveelheden
    en de aanpassingsbedragen bedoeld in artikel 1, lid 2, respectievelijk in artikel
    13, lid 2, van Verordening (EEG) nr. 557/75, alsmede van de aanpassingsbedragen
    bedoeld in artikel 14, lid 2, van Verordening (EEG) nr. 558/75
  type: main
