title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1578/1999 of 19 July 1999 determining the
    extent to which applications lodged in July 1999 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 July to 30 September 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1578/1999 de la Commission, du 19 juillet 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1999 peuvent être acceptées dans le cadre des contingents tarifaires
    d'importation pour certains produits dans le secteur de la viande de porc pour
    la période du 1er juillet au 30 septembre 1999
  type: main
- language: de
  script: Latn
