    für bestimmte Erzeugnisse im Sektor Schweinefleisch für den Zeitraum vom 1.
    Juli 1999 bis zum 30. September 1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1578/1999 af 19. juli 1999 om fastsættelse
