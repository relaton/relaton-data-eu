title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3804/85 of 20 December 1985 drawing up the
    list of areas under vines in certain Spanish regions where table wines may have
    an actual alcoholic strength which is lower than Community requirements
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3804/85 du Conseil du 20 décembre 1985 établissant
    la liste des superficies plantées en vigne dans certaines régions espagnoles
    pour lesquelles les vins de table peuvent avoir un titre alcoométrique acquis
    inférieur aux exigences communautaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3804/85 des Rates vom 20. Dezember 1985 zur Festlegung
    des Verzeichnisses der Rebflächen in bestimmten spanischen Regionen, für die
    der vorhandene Alkoholgehalt bei Tafelwein unter den Gemeinschaftsanforderungen
    liegen darf
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3804/85 af 20. december 1985 om opstilling
    af listen over arealer tilplantet med vinstokke i visse spanske områder, fra
    hvilke bordvine kan have et virkeligt alkoholindhold, der er mindre end fællesskabskravene
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3804/85 του Συμβουλίου
    της 20ής Δεκεμβρίου 1985 για την κατάρτιση του
    καταλόγου των φυτευμένων με αμπέλια επιφανειών
    σε ορισμένες περιοχές της Ισπανίας για τις
    οποίες οι επιτραπέζιοι οίνοι μπορούν να έχουν
    αποκτημένο αλκοολικό τίτλο κατώτερο των κοινοτικών
    απαιτήσεων
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3804/85, annettu 20 päivänä joulukuuta 1985,
    luettelosta tietyillä Espanjan alueilla sijaitsevista viiniviljelyalueista, joilla
    tuotettujen pöytäviinien todellinen alkoholipitoisuus voi olla yhteisön vaatimuksia
    alhaisempi
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3804/85 del Consiglio del 20 dicembre 1985 che stabilisce
    l' elenco delle superfici coltivate a vigneto in talune regioni spagnole in cui
    i vini da tavola possono avere un titolo alcolometrico effettivo inferiore ai
    requisiti comunitari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3804/85 van de Raad van 20 december 1985 tot vaststelling
    van de lijst van de met wijnstokken beplante arealen in bepaalde Spaanse gebieden
    waar tafelwijn een lager dan het door de Gemeenschap voorgeschreven effectief
    alcoholgehalte mag hebben
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3804/85 do Conselho, de 20 de Dezembro de 1985, que
    estabelece a lista das superfícies plantadas com videiras em determinadas regiões
    espanholas em que os vinhos de mesa podem ter um teor alcoólico adquirido inferior
    às exigências comunitárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº3804/85 del Consejo, de 20 de diciembre de 1985, por
    el que se establece la lista de las superficies plantadas en viña en determinadas
    regiones españolas para las que los vinos de mesa pueden tener un grado alcohólico
    adquirido inferior a las exigencias comunitarias
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3804/85 av den 20 december 1985 om fastställande
    av listan över vinarealer inom vissa spanska områden där bordsvin får ha en
    verklig alkoholhalt som är lägre än gemenskapskraven
  type: main
