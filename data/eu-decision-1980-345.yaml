title:
- language: en
  script: Latn
  content: '80/345/EEC: Commission Decision of 20 February 1980 authorizing the Italian
    Republic not to apply Community treatment to woven fabrics of flax or of ramie,
    falling within heading No 54.05 of the Common Customs Tariff (category 117), originating
    in Romania and in free circulation in the other Member States (Only the Italian
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/345/CEE: Décision de la Commission, du 20 février 1980, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    lin ou de ramie de la position 54.05 du tarif douanier commun (catégorie 117),
    originaires de Roumanie et mis en libre pratique dans les autres Etats membres
    (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/345/EWG: Entscheidung der Kommission vom 20. Februar 1980, mit der
    die Italienische Republik ermächtigt wird, aus Rumänien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Flachs oder
    Ramie der Tarifnummer 54.05 des Gemeinsamen Zolltarifs, Kategorie 117, von der
    Gemeinschaftsbehandlung auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/345/EØF: Kommissionens beslutning af 20. februar 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage vævet stof
    af hør eller ramie, som henhører under pos. 54.05 i den fælles toldtarif (kategori
    117), har oprindelse i Rumænien og frit kan omsættes i de øvrige medlemsstater
    (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/345/CEE: Decisione della Commissione, del 20 febbraio 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i tessuti di lino
    o di ramiè della voce 54.05 della tariffa doganale comune, categoria 117, originari
    della Romania e messi in libera pratica negli altri Stati membri (Il testo in
    lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/345/EEG: Beschikking van de Commissie van 20 februari 1980 waarbij
    de Italiaanse Republiek wordt gemachtigd weefsels van vlas of van ramee, van post
    54.05 van het gemeenschappelijk douanetarief (categorie 117), van oorsprong uit
    Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
