    intervento e destinato all' alimentazione degli animali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 681/77 van de Commissie van 31 maart 1977 houdende
    wijziging van Verordening (EEG) nr. 2054/76 inzake de verkoop van magere-melkpoeder
    uit de voorraad van de interventiebureaus met het oog op uitvoer naar derde landen
    en bestemd voor diervoeding
