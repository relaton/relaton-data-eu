    les pays tiers de lait écrémé en poudre par les organismes d' intervention
    et destiné à l' alimentation des animaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 681/77 der Kommission vom 31. März 1977 zur Änderung
    der Verordnung (EWG) Nr. 2054/76 über den Verkauf von Magermilchpulver zu Futterzwecken
    aus Beständen der Interventionsstellen für die Ausfuhr nach Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 681/77 af 31. marts 1977 om ændring
