  content: Commission Regulation (EEC) No 681/77 of 31 March 1977 amending Regulation
    (EEC) No 2054/76 on the sale for export to third countries of skimmed-milk powder
    held by intervention agencies and intended for use as feed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 681/77 de la Commission, du 31 mars 1977, modifiant
