title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2973/95 of 20 December 1995 authorizing the
    conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1995/96 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2973/95 de la Commission, du 20 décembre 1995, ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1995/1996
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2973/95 der Kommission vom 20. Dezember 1995 zur Eröffnung
    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifizierten Traubenmost für das Wirtschaftsjahr 1995/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2973/95 af 20. december 1995 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost
    og rektificeret koncentreret druemost for produktionsåret 1995/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2973/95 της Επιτροπής,
    της 20ής Δεκεμβρίου 1995, για την παροχή δυνατότητας
    σύναψης συμφωνητικών μακροπρόθεσμης ιδιωτικής
    αποθεματοποίησης επιτραπέζιου οίνου, γλεύκους
    σταφυλών, συμπυκνωμένου γλεύκους σταφυλών
    και διορθωμένου συμπυκνωμένου γλεύκους σταφυλών
    για την περίοδο 1995/96
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2973/95, annettu 20 päivänä joulukuuta 1995,
    mahdollisuudesta tehdä yksityistä varastointia koskevia pitkän aikavälin sopimuksia
    viinivuodelle 1995/96 pöytäviinin, rypälemehun, tiivistetyn rypälemehun ja
    puhdistetun tiivistetyn rypälemehun osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2973/95 della Commissione, del 20 dicembre 1995, che
    concede, per la campagna 1995/96, la possibilità di concludere contratti di magazzinaggio
    privato a lungo termine per il vino da tavola, il mosto di uve concentrato e il
    mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2973/95 van de Commissie van 20 december 1995 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1995/1996
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2973/95 da Comissão, de 20 de Dezembro de 1995, que
    permite concluir contratos de armazenamento privado a longo prazo para o vinho
    de mesa, o mosto de uvas, o mosto de uvas concentrado e o mosto de uvas concentrado
    rectificado, para a campanha de 1995/1996
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2973/95 de la Comisión, de 20 de diciembre de 1995,
