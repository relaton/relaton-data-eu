  content: Council Regulation (EEC) No 1185/90 of 7 may 1990 amending regulation (EEC)
    No 777/87 modifying the intervention arrangements for butter and skimmed-milk
    powder and regulation (EEC) No 985/68 laying down general rules for intervention
    on the market in butter and cream
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1185/90 du Conseil, du 7 mai 1990, portant modification
