title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 81/96 of 19 January 1996 amending Regulation
    (EEC) No 2455/93 imposing definitive anti-dumping duties on imports of monosodium
    glutamate originating in Indonesia, the Republic of Korea and Taiwan and collecting
    definitively the provisional duties imposed and terminating the proceeding with
    regard to Thailand
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 81/96 du Conseil, du 19 janvier 1996, modifiant le
    règlement (CEE) n° 2455/93 instituant un droit antidumping définitif sur les
    importations de glutamate monosodique originaire d'Indonésie, de République
    de Corée et de Taiwan et portant perception définitive du droit antidumping
    provisoire et clôturant la procédure en ce qui concerne la Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 81/96 des Rates vom 19. Januar 1996 zur Änderung der
    Verordnung (EWG) Nr. 2455/93 zur Einführung endgültiger Antidumpingzölle auf
    die Einfuhren von Mononatriumglutamat mit Ursprung in Indonesien, der Republik
    Korea und Taiwan sowie zur endgültigen Vereinnahmung der vorläufigen Zölle
    und zur Einstellung des Verfahrens gegenüber Thailand
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 81/96 af 19. januar 1996 om ændring af forordning
    (EØF) nr. 2455/93 om indførelse af endelig antidumpingtold på importen af mononatriumglutamat
    med oprindelse i Indonesien, Republikken Korea og Taiwan og endelig opkrævning
    af den midlertidige antidumpingtold og afslutning af proceduren for så vidt angår
    Thailand
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 81/96 του Συμβουλίου,
    της 19ης Ιανουαρίου 1996, για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 2455/93 για την επιβολή
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    γλουταμινικού νατρίου καταγωγής Ινδονησίας,
    Δημοκρατίας της Κορέας και Ταϊβάν και για την
    οριστική είσπραξη του προσωρινού δασμού, και
    για την περάτωση της διαδικασίας όσον αφορά
    την Ταϊλάνδη
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 81/96, annettu 19 päivänä tammikuuta 1996,
    lopullisen polkumyyntitullin käyttöönotosta Indonesiasta, Korean tasavallasta
    ja Taiwanista peräisin olevan mononatriumglutamaatin tuonnissa ja näiden tuotteiden
    tuonnissa käyttöön otetun väliaikaisen polkumyyntitullin lopullisesta kantamisesta
    annetun asetuksen (ETY) N:o 2455/93 muuttamisesta sekä menettelyn lopettamisesta
    Thaimaan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 81/96 del Consiglio, del 19 gennaio 1996, che modifica
    il regolamento (CEE) n. 2455/93 che istituisce un dazio antidumping definitivo
    sulle importazioni di glutammato monosodico originario dell'Indonesia, della Repubblica
    di Corea e di Taiwan e che stabilisce la riscossione definitiva dei dazi antidumping
    provvisori istituiti e chiude il procedimento relativo alla Thailandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 81/96 van de Raad van 19 januari 1996 tot wijziging
    van Verordening (EEG) nr. 2455/93 met betrekking tot het definitieve anti-dumpingrecht
    op mononatriumglutamaat van oorsprong uit Indonesië, de Republiek Korea en Taiwan
    en tot definitieve inning van het voorlopige recht en beëindiging van de procedure
    ten aanzien van Thailand
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 81/96 do Conselho, de 19 de Janeiro de 1996, que altera
    o Regulamento (CEE) nº 2455/93 e que institui direitos anti-dumping definitivos
    sobre as importações de glutamato de monossódio originário da Indonésia,
    da República da Coreia e de Taiwan, e estabelece a cobrança definitiva dos direitos
    provisórios instituídos e encerra o processo relativamente à Tailândia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 81/96 del Consejo, de 19 de enero de 1996, que modifica
    el Reglamento (CEE) nº 2455/93 por el que se establece un derecho antidumping
    definitivo sobre las importaciones de glutamato monosódico originarias de Indonesia,
    la República de Corea y Taiwán y por el que se perciben definitivamente los
    derechos provisionales impuestos y se da por concluido el procedimiento relativo
    a Tailandia
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 81/96 av den 19 januari 1996 om ändring av
    förordning (EEG) nr 2455/93 om införande av slutgiltig antidumpningstull på
    import av mononatriumglutamat med ursprung i Indonesien, Sydkorea och Taiwan,
    om slutgiltigt uttag av de preliminära tullar som införts och om avslutande
    av förfarandet avseende Thailand
  type: main
