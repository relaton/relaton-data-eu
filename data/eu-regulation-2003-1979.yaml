title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2003/79 of 11 September 1979 re-establishing
    the levying of customs duties on thread of asbestos, falling within subheading
    68.13 B I and originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2003/79 de la Commission, du 11 septembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux fils d'
    amiante, de la sous-position 68.13 B I du tarif douanier commun, originaires de
    la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2003/79 der Kommission vom 11. September 1979 zur
    Wiedereinführung des Zollsatzes für Fäden aus Asbest, der Tarifstelle 68.13
    B I, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2003/79 af 11. september 1979 om genindførelse
    af opkrævning af toldafgifter for garn af asbest, under underposition 68.13 B
    I som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2003/79 della Commissione, dell' 11 settembre 1979,
    che ripristina la riscossione dei dazi doganali applicabili ai fili di amianto,
    della sottovoce 68.13 B I della tariffa doganale comune, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2003/79 van de Commissie van 11 september 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    asbest, van post 68.13 B I, van oorsprong uit Joegoslavië ten behoeve waarvan
    bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties werden geopend
  type: main
