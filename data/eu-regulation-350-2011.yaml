title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 350/2011 of 11 April 2011 amending Regulation
    (EC) No 1251/2008 as regards the placing on the market requirements for consignments
    of Pacific oysters intended for Member States or parts thereof with national measures
    regarding ostreid herpes virus 1 μνar (OsHV-1 μνar) approved by Decision 2010/221/EU
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 350/2011 de la Commission du 11 avril 2011 modifiant
    le règlement (CE) n ° 1251/2008 en ce qui concerne les exigences applicables
    à la mise sur le marché de lots d’huîtres creuses du Pacifique (Crassostrea
    gigas) destinés à des États membres ou parties d’États membres faisant l’objet
    de mesures nationales concernant l’herpès virus de l’huître 1 μνar (OsHV-1
    μνar) approuvées par la décision 2010/221/UE
  type: main
- language: de
  script: Latn
