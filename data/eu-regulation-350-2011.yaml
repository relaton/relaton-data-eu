    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 350/2011 della Commissione, dell' 11 aprile 2011 ,
    che modifica il regolamento (CE) n. 1251/2008 per quanto riguarda le prescrizioni
    relative all’immissione sul mercato di partite di ostriche giapponesi destinate
    agli Stati membri, o parti degli stessi, che applicano misure nazionali in relazione
    all’Ostreid herpesvirus 1 μνar (OsHV-1 μνar) approvate a norma della decisione
    2010/221/UE
  type: main
- language: lv
  script: Latn
