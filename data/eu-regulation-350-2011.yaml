    Mitgliedstaaten bestimmt sind, in denen mit dem Beschluss 2010/221/EU genehmigte
    nationale Maßnahmen in Bezug auf das Ostreide Herpesvirus 1 μνar (OsHV-1 μνar)
    gelten
  type: main
