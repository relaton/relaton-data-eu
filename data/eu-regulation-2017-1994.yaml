    cla na dovoz od tohto vyvážajúceho výrobcu a zavedenia registrácie dovozu
    od tohto vyvážajúceho výrobcu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/1994 z dne 6. novembra 2017 o začetku
    pregleda izvedbenih uredb (EU) 2016/184 in (EU) 2016/185 o razširitvi dokončne
    izravnalne in dokončne protidampinške dajatve na uvoz fotonapetostnih modulov
    iz kristalnega silicija in njihovih ključnih sestavnih delov (tj. celic) s poreklom
    iz Ljudske republike Kitajske ali ki so od tam poslani, na uvoz fotonapetostnih
    modulov iz kristalnega silicija in njihovih ključnih sestavnih delov (tj. celic),
    poslanih iz Malezije in s Tajvana, ne glede na to, ali so deklarirani kot izdelki
    s poreklom iz Malezije in s Tajvana ali ne, da se ugotovi, ali se za določenega
    malezijskega proizvajalca izvoznika lahko odobri izvzetje iz navedenih ukrepov,
    odpravijo protidampinške dajatve pri njegovem uvozu in uvede registracija tega
    uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2017/1994 de la Comisión, de 6 de noviembre
    de 2017, por el que se inicia una reconsideración de los Reglamentos de Ejecución
    (UE) 2016/184 y (UE) 2016/185, por los que se amplían los derechos compensatorio
    y antidumping definitivos de las importaciones de módulos fotovoltaicos de silicio
    cristalino y componentes clave (a saber, células) originarios o procedentes de
    la República Popular China a las importaciones de módulos fotovoltaicos de silicio
    cristalino y componentes clave (a saber, células) procedentes de Malasia y de
    Taiwán, tanto si se declaran originarios de Malasia o de Taiwán como si no,
    a fin de decidir sobre la posibilidad de conceder una exención de dichas medidas
    a un productor exportador de Malasia, de derogar el derecho antidumping respecto
    a las importaciones procedentes de dicho productor exportador y de someter a registro
    las importaciones procedentes de dicho productor exportador
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/1994 av den 6 november
    2017 om inledande av en översyn av genomförandeförordningar (EU) 2016/184 och
    (EU) 2016/185 rörande utvidgning av den slutgiltiga utjämningstullen och antidumpningstullen
    på import av solcellsmoduler av kristallint kisel samt väsentliga komponenter
    (dvs. celler) med ursprung i eller avsända från Folkrepubliken Kina till att
    även omfatta import av solcellsmoduler av kristallint kisel samt väsentliga
    komponenter (dvs. celler) avsända från Malaysia och Taiwan, oavsett om produktens
    deklarerade ursprung är Malaysia och Taiwan eller inte, i syfte att fastställa
    om det är möjligt att bevilja en malaysisk exporterande tillverkare befrielse
    från dessa åtgärder, upphäva antidumpningstullen avseende import från den
    exporterande tillverkaren och göra import från den exporterande tillverkaren
    till föremål för registrering
  type: main
