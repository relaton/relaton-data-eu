  content: Commission Implementing Regulation (EU) 2017/1994 of 6 November 2017 initiating
    a review of Implementing Regulations (EU) 2016/184 and (EU) 2016/185 extending
    the definitive countervailing and anti-dumping duty on imports of crystalline
    silicon photovoltaic modules and key components (i.e. cells) originating in or
    consigned from the People's Republic of China to imports of crystalline silicon
    photovoltaic modules and key components (i.e. cells) consigned from Malaysia and
    Taiwan, whether declared as originating in Malaysia and in Taiwan or not) for
    the purposes of determining the possibility of granting an exemption from those
    measures to one Malaysian exporting producer, repealing the anti-dumping duty
    with regard to imports from that exporting producer and making imports from that
    exporting producer subject to registration
