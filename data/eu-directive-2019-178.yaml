  content: Commission Delegated Directive (EU) 2019/178 of 16 November 2018 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for lead in bearings and bushes applied in certain non-road professional
    use equipment
  type: main
- language: fr
  script: Latn
