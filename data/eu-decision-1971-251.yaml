title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 15 juin 1971, autorisant la République
    française à exclure du traitement communautaire les jouets, de la position 97.03
    Ex B du Tarif douanier commun, originaires de Hong-Kong et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/251/EWG: Entscheidung der Kommission vom 15. Juni 1971, mit der die
    Französische Republik ermächtigt wird, die aus Hongkong stammenden und in den
    übrigen Mitgliedstaaten im freien Verkehr befindlichen Spielzeuge der Tarifnummer
    97.03 ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/251/CEE: Decisione della Commissione, del 15 giugno 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli della
    voce 97.03 ex B della tariffa doganale comune, originari di Hong Kong e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/251/EEG: Beschikking van de Commissie van 15 juni 1971 waarbij de Republiek
    Frankrijk wordt gemachtigd het speelgoed van de post 97.03 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong- Kong en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
