    aplicáveis à importação de figos secos e avelãs da Turquia e amendoins da
    Índia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/2106 al Comisiei din 1 decembrie
    2016 de modificare a Regulamentului de punere în aplicare (UE) nr. 884/2014 de
