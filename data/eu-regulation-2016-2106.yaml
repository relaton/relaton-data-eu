    nustatomi specialūs reikalavimai iš Etiopijos importuojamiems prieskoniams,
    iš Argentinos importuojamiems žemės riešutams ir iš Azerbaidžano importuojamiems
    lazdyno riešutams ir iš dalies keičiami specialūs reikalavimai iš Turkijos
    importuojamoms džiovintoms figoms ir lazdynų riešutams ir iš Indijos importuojamiems
    žemės riešutams
  type: main
