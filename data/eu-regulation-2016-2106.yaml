    sušených fíg a lieskových orechov z Turecka a arašidových orieškov z Indie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/2106 z dne 1. decembra 2016 o spremembi
    Izvedbene uredbe Komisije (EU) št. 884/2014 o uvedbi posebnih pogojev, ki urejajo
    uvoz začimb iz Etiopije, arašidov iz Argentine in lešnikov iz Azerbajdžana,
