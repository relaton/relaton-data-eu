    kas reglamentē garšvielu importu no Etiopijas, zemesriekstu importu no Argentīnas
    un lazdu riekstu importu no Azerbaidžānas, un ar kuru groza īpašos nosacījumus,
    kas reglamentē žāvētu vīģu un zemesriekstu importu no Turcijas un zemesriekstu
    importu no Indijas
  type: main
- language: lt
  script: Latn
  content: 2016 m. gruodžio 1 d. Komisijos įgyvendinimo reglamentas (ES) 2016/2106,
