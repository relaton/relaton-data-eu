    és az Azerbajdzsánból származó mogyoró behozatalára irányadó egyedi feltételeket
    elrendelő, valamint a Törökországból származó szárított füge és mogyoró
    és az Indiából származó földimogyoró behozatala vonatkozásában az egyedi
    feltételeket módosító 884/2014/EU bizottsági végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/2106 della Commissione, del 1° dicembre
    2016, che modifica il regolamento di esecuzione (UE) n. 884/2014 stabilendo condizioni
    particolari per l'importazione di spezie dall'Etiopia, di arachidi dall'Argentina
    e di nocciole dall'Azerbaigian e che modifica le condizioni particolari per l'importazione
    di fichi secchi e di nocciole dalla Turchia e di arachidi dall'India
  type: main
- language: lv
  script: Latn
