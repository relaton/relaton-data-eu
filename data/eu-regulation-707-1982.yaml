    prodotti agricoli esportati sotto forma di merci non comprese nell' allegato II
    del trattato, le regole generali relative alla concessione delle restituzioni
    all' esportazione e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 707/82 van de Commissie van 26 maart 1982 tot wijziging
    van Verordening (EEG) nr. 3035/80 van de Raad tot vaststelling van de algemene
    regels aangaande de toekenning van restituties bij uitvoer en de criteria voor
    de vaststelling van het restitutiebedrag betreffende bepaalde landbouwprodukten,
    uitgevoerd in de vorm van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 707/82 da Comissão, de 26 de Março de 1982, que
