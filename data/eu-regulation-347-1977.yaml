  content: Commission Regulation (EEC) No 347/77 of 18 February 1977 correcting the
    Annex to Regulation (EEC) No 142/77 fixing an additional rate for determining
    the quantities of alcohol to be delivered as part of the wine deliveries for the
    1976/77 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 347/77 de la Commission, du 18 février 1977, rectifiant
    l'annexe du règlement (CEE) n° 142/77 fixant un taux supplémentaire pour la
    détermination des quantités d'alcool à livrer dans le cadre des prestations
    viniques pour la campagne 1976/1977
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 347/77 der Kommission vom 18. Februar 1977 zur Berichtigung
    des Anhangs der Verordnung (EWG) Nr. 142/77 zur Festsetzung eines zusätzlichen
    Satzes für die Bestimmung der im Rahmen der obligatorischen Destillation zu liefernden
    Alkoholmenge im Wirtschaftsjahr 1976/1977
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 347/77 af 18. februar 1977 om berigtigelse
    af bilaget til forordning (EØF) nr. 142/77 om fastsættelse af en tillægssats
    for fastlæggelsen af de mængder alkohol, der skal indleveres inden for rammerne
    af de pligtige vinydelser for produktionsåret 1976/1977
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 347/77 della Commissione, del 18 febbraio 1977, recante
    rettifica dell'allegato del regolamento (CEE) n. 142/77 che fissa un tasso supplementare
    per la determinazione dei quantitativi di alcole da consegnare nel quadro delle
    prestazioni viniche per la campagna 1976/1977
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 347/77 van de Commissie van 18 februari 1977 houdende
    rectificatie van de bijlage van Verordening (EEG) nr. 142/77 tot vaststelling
    van een extra percentage voor de bepaling van de in het kader van de verplichte
    distillatie voor het wijnoogstjaar 1976/1977 te leveren hoeveelheden alcohol
