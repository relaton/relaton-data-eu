title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 375/94 of 18 February 1994 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira in particular
    to determine the forecast supply balance for the period 1 July 1993 to 30 June
    1994
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 375/94 de la Commission du 18 février 1994 modifiant
    le règlement (CEE) n° 2999/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement de Madère en produits du secteur des fruits et légumes
    transformés, et déterminant notamment le bilan d'approvisionnement pour la période
    du 1er juillet 1993 au 30 juin 1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 375/94 DER KOMMISSION vom 18. Februar 1994 zur Änderung
    der Verordnung (EWG) Nr. 2999/92 mit Durchführungsbestimmungen zur Sonderregelung
    für die Versorgung von Madeira mit Verarbeitungserzeugnissen aus Obst und Gemüse,
    insbesondere zur Errichtung der Versorgungsbilanz, für den Zeitraum vom 1. Juli
    1993 bis 30. Juni 1994
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 375/94 af 18. februar 1994 om ændring
    af forordning (EØF) nr. 2999/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for Madeira vedrørende forarbejdede frugt- og grøntsagsprodukter,
    og fastsættelse af den foreløbige forsyningsopgørelse for så vidt angår perioden
    1. juli 1993 til 30. juni 1994
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 375/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 18ης Φεβρουαρίου 1994 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 2999/92 όσον αφορά τις
    λεπτομέρειες εφαρμογής του ειδικού καθεστώτος
