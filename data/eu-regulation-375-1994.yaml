  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 375/94 DELLA COMMISSIONE del 18 febbraio 1994 recante
    modifica del regolamento (CEE) n. 2999/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per Madera, e che stabilisce in particolare il bilancio di approvvigionamento
    per il periodo dal 1o luglio 1993 al 30 giugno 1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 375/94 VAN DE COMMISSIE van 18 februari 1994 tot aanpassing
    van Verordening (EEG) nr. 2999/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van Madeira met produkten van de sector verwerkte
    groenten en fruit, en ter vaststelling van de voorzieningsbalans voor de periode
    van 1 juli 1993 tot en met 30 juni 1994 in het bijzonder
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 375/94 DA COMISSÃO de 18 de Fevereiro de 1994 que
    altera, em relação ao período compreendido entre 1 de Julho de 1993 e 30 de
    Junho de 1994, o Regulamento (CEE) nº 2999/92, que estabelece normas de execução
    do regime específico de abastecimento da ilha da Madeira em produtos do sector
    dos produtos transformados à base de frutas e produtos hortícolas e determinando,
    nomeadamente, a estimativa de abastecimento
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 375/94 DE LA COMISIÓN de 18 de febrero de 1994 por
    el que se modifica el Reglamento (CEE) nº 2999/92 por el que se establecen disposiciones
    de aplicación del régimen especial de abastecimiento a la isla de Madeira de
    productos del sector de las frutas y hortalizas transformadas y determinando especialmente
    los planes de abastecimiento para el período del 1 de julio de 1993 al 30 de
    junio de 1994
