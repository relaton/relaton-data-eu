    domeniul agriculturii în favoarea regiunilor ultraperiferice ale Uniunii și
    în favoarea insulelor mici din Marea Egee
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/238 zo 16. februára 2021, ktorým
