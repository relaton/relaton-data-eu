title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3138/80 of 4 December 1980 re-establishing
    the levying of customs duties on raw or unmanufactured tobaccos other than Virginia
    type, falling within subheadings 24.01 ex A and ex B and originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2791/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3138/80 de la Commission, du 4 décembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux tabacs bruts
    ou non fabriqués autres que du type Virginia, des sous-positions 24.01 ex A et
    ex B du tarif douanier commun, originaires des pays en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2791/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3138/80 der Kommission vom 4. Dezember 1980 zur Wiedereinführung
    des Zollsatzes für unverarbeiteten Tabak, anderen als der Sorte ,,Virginia' '
    , der Tarifstellen 24.01 ex A und ex B mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 2791/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3138/80 af 4. december 1980 om genindførelse
    af toldafgifter for rå eller ufabrikeret tobak af andre sorter end Virginia under
    position 24.01 ex A og ex B, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2791/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3138/80 della Commissione, del 4 dicembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tabacchi grezzi o non
    lavorati diversi dal tipo "Virginia", delle sottovoci 24.01 ex A e ex B della
    tariffa doganale comune, originari dei paesi in via di sviluppo beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2791/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3138/80 van de Commissie van 4 december 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor ruwe tabak en niet tot
    verbruik bereide tabak van andere soorten dan van de soort Virginia, van post
    24.01 ex A en ex B, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 2791/79 van de Raad tariefpreferenties werden geopend
  type: main
