    av de värden som uttrycks i ecu i förordning (EEG) nr 1135/88 om definitionen
    av begreppet ursprungsvaror och metoder för administrativt samarbete inom handeln
    mellan gemenskapens tullområde och Ceuta, Melilla och Kanarieöarna
  type: main
