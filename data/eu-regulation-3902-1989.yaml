title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3902/89 of 15 December 1989 modifying with
    regard to the values expressed in ecus in Regulation (EEC) No 1135/88 concerning
    the definition of the concept of 'originating products' and methods of administrative
    cooperation in trade between the customs territory of the Community, Ceuta, Melilla
    and the Canary Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3902/89 du Conseil du 15 décembre 1989 modifiant,
    en ce qui concerne les valeurs exprimées en écus, le règlement (CEE) n° 1135/88
    relatif à la définition de la notion de «produits originaires» et aux méthodes
    de coopération administrative dans le commerce entre le territoire douanier de
    la Communauté, Ceuta et Melilla et les îles Canaries
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3902/89 des Rates vom 15. Dezember 1989 zur Änderung
    der Verordnung (EWG) Nr. 1135/88 über die Bestimmung des Begriffs "Waren mit
    Ursprung in" oder "Ursprungswaren" und über die Maßnahmen der Zusammenarbeit
    der Verwaltungen, die im Warenverkehr zwischen dem Zollgebiet der Gemeinschaft,
    Ceuta und Melilla und den Kanarischen Inseln anzuwenden sind, hinsichtlich der
    in Ecu ausgedrückten Werte
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3902/89 af 15. december 1989 om ændring,
    for så vidt angår værdier udtrykt i ecu, af forordning (EØF) nr. 1135/88 om
    definition af begrebet "varer med oprindelsesstatus" og metoder for administrativt
    samarbejde i samhandelen mellem Fællesskabets toldområde og Ceuta og Melilla
    samt De Kanariske Øer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3902/89 του Συμβουλίου
    της 15ης Δεκεμβρίου 1989 για την τροποποίηση των
    εκπεφρασμένων σε Ecu ισοτιμιών του κανονισμού
    (ΕΟΚ) αριθ. 1135/88 σχετικά με τον ορισμό της έννοιας
    «καταγόμενα προϊόντα» ή «προϊόντα καταγωγής»
    και με τις μεθόδους διοικητικής συνεργασίας
    κατά τις εμπορικές συναλλαγές μεταξύ του τελωνειακού
    εδάφους της Κοινότητας, των Καναρίων Νήσων
    και της Θέουτα και Μελίλια
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3902/89, annettu 15 päivänä joulukuuta 1989,
    "alkuperätuotteiden" käsitteen määritelmästä ja hallinnollisen yhteistyön
    menetelmistä yhteisön tullialueen sekä Ceutan ja Melillan ja Kanariansaarten
    välisessä kaupassa annetun asetuksen (ETY) N:o 1135/88 muuttamisesta ecuina
    ilmaistujen arvojen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3902/89 del Consiglio del 15 dicembre 1989 che modifica,
    per quanto riguarda i valori espressi in ecu, il regolamento (CEE) n. 1135/88
    relativo alla definizione della nozione di "prodotti originari" e ai metodi di
    cooperazione amministrativa applicabili negli scambi tra il territorio doganale
    della Comunità, Ceuta e Melilla e le isole Canarie
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3902/89 van de Raad van 15 december 1989 tot wijziging,
    wat de in ecu uitgedrukte bedragen betreft, van Verordening (EEG) nr. 1135/88
    betreffende de definitie van het begrip "produkten van oorsprong" en de methoden
    van administratieve samenwerking in het handelsverkeer tussen het douanegebied
    van de Gemeenschap en Ceuta en Melilla en de Canarische eilanden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3902/89 do Conselho de 15 de Dezembro de 1989 que
    altera, no que respeita aos valores expressos em ecus, o Regulamento (CEE) nº
    1135/88 relativo à definição da noção de "produtos originários" e aos métodos
    de cooperação administrativa aplicáveis às trocas comerciais entre o território
    aduaneiro da Comunidade, Ceuta e Melilha e as ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3902/89 del Consejo de 15 de diciembre de 1989 por
