title:
- language: en
  script: Latn
  content: Council Directive 68/420/EEC of 20 December 1968 making a fourth amendment
    to the Council Directive on the approximation of the laws of the Member States
    concerning the preservatives authorized for use in foodstuffs intended for human
    consumption
  type: main
- language: fr
  script: Latn
  content: Directive 68/420/CEE du Conseil, du 20 décembre 1968, portant quatrième
    modification de la directive du Conseil, relative au rapprochement des législations
    des États membres concernant les agents conservateurs pouvant être employés
    dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 68/420/EWG des Rates vom 20. Dezember 1968 zur vierten Änderung
    der Richtlinie des Rates zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 68/420/EØF af 20. december 1968 om fjerde ændring af
    Rådets direktiv om tilnærmelse af medlemsstaternes lovgivninger om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 68/420/ΕΟΚ του Συμβουλίου της 20ής Δεκεμβρίου
    1968 περί τετάρτης τροποποιήσεως της οδηγίας
    του Συμβουλίου περί προσεγγίσεως των νομοθεσιών
    των κρατών μελών σχετικά με τα συντηρητικά
    που επιτρέπεται να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 68/420/ETY, annettu 20 päivänä joulukuuta 1968,
    elintarvikkeissa sallittuja säilöntäaineita koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun neuvoston direktiivin muuttamisesta neljännen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 68/420/CEE del Consiglio, del 20 dicembre 1968, che modifica
    per la quarta volta la direttiva del Consiglio relativa al ravvicinamento delle
    legislazioni degli Stati Membri sui conservativi che possono essere impiegati
    nelle derrate destinate all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 68/420/EEG van de Raad van 20 december 1968 houdende vierde wijziging
    van de Richtlijn van de Raad betreffende de aanpassing van de wetgevingen van
    de Lid- Staten inzake conserveermiddelen die mogen worden gebruikt in voor menselijke
    voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 68/420/CEE do Conselho, de 20 de Dezembro de 1968, que altera
    pela quarta vez a Directiva do Conselho relativa à aproximação das legislações
    dos Estados- Membros respeitantes aos conservantes que podem ser utilizados nos
    géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 68/420/CEE del Consejo, de 20 de diciembre de 1968, que modifica
    por cuarta vez la Directiva del Consejo relativa a la aproximación de las legislaciones
    de los Estados Miembros sobre los agentes conservadores que pueden utilizarse
    en los productos destinados al consumo humano
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 68/420/EEG av den 20 december 1968 om ändring för fjärde
    gången av rådets direktiv om tillnärmning av medlemsstaternas lagstiftning
    om konserveringsmedel som är godkända för användning i livsmedel
