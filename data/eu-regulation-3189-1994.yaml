title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3189/94 of 19 December 1994 laying down for
    1995 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non- member countries in the
    200-nautical-mile zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3189/94 du Conseil, du 19 décembre 1994, fixant, pour
    l' année 1995, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon de certains pays tiers dans
    la zone de 200 milles située au large du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3189/94 des Rates vom 19. Dezember 1994 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1995)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3189/94 af 19. december 1994 om fastsættelse
    af en række foranstaltninger for 1995 til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømile-zonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3189/94 του Συμβουλίου
    της 19ης Δεκεμβρίου 1994 για τον καθορισμό, για
    το 1995, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων, τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    εντός της ζώνης 200 μιλίων η οποία ευρίσκεται
    στα ανοικτά των ακτών του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3189/94, annettu 19 päivänä joulukuuta 1994,
    Ranskan Guyanan departementin edustalta 200 meripeninkulman päähän ulottuvalla
    vyöhykkeellä tiettyjen kolmansien maiden lipun alla purjehtiviin aluksiin vuonna
    1995 sovellettavista tietyistä kalavarojen säilyttämis- ja hallintotoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3189/94 del Consiglio, del 19 dicembre 1994, che stabilisce,
    per il 1995, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3189/94 van de Raad van 19 december 1994 houdende
    maatregelen voor 1995 voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3189/94 do Conselho, de 19 de Dezembro de 1994, que
    fixa, para 1995, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de certos países terceiros
    na zona de 200 milhas situada ao largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3189/94 del Consejo, de 19 de diciembre de 1994, por
    el que se establecen, para 1995, determinadas medidas de conservación y de gestión
    de los recursos pesqueros aplicables a los buques que enarbolen pabellón de determinados
    terceros países en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3189/94 av den 19 december 1994 om fastställande
    för 1995 av vissa åtgärder som syftar till bevarande och förvaltning av fiskeresurserna
    och är tillämpliga för fartyg som för vissa tredje länders flagg i 200-sjömilszonen
    utanför franska departementet Guyanas kust
