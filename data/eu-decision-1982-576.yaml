title:
- language: en
  script: Latn
  content: '82/576/EEC: Decision No 114 of 7 July 1982 adapting model form E 111 for
    use in the Community enlarged by the accession of Greece and taking into account
    the extension of the social security Regulations to self-employed persons and
    their families'
  type: main
- language: fr
  script: Latn
  content: '82/576/CEE: Décision no 114, du 7 juillet 1982, adaptant le modèle de
    formulaire E 111 en vue de son utilisation dans la Communauté élargie à la
    Grèce et compte tenu de l'' extension de règlements de sécurité sociale aux
    travailleurs non salariés et aux membres de leur famille'
  type: main
- language: de
  script: Latn
  content: '82/576/EWG: Beschluß Nr. 114 vom 7. Juli 1982 zur Anpassung des Vordrucks
    E 111 für dessen Verwendung in der um Griechenland erweiterten Gemeinschaft unter
    Berücksichtigung der Ausweitung der Verordnungen über soziale Sicherheit auf
    Selbständige und deren Familienangehörige'
  type: main
- language: da
  script: Latn
  content: '82/576/EØF: Afgørelse nr. 114 af 7. juli 1982 om tilpasning af blanket
    E 111 med henblik på dennes anvendelse i det med Grækenland udvidede fællesskab
    og under hensyntagen til udvidelsen af de sociale sikringsordninger til at omfatte
    selvstændige erhvervsdrivende og deres familiemedlemmer'
  type: main
- language: el
  script: Grek
  content: '82/576/EOK: Απόφαση αριθ. 114 της 7ης Ιουλίου 1982
    για τη θέσπιση του υποδείγματος εντύπου Ε 111
    προκειμένου να χρησιμοποιείται στην Κοινότητα
    μετά από την προσχώρηση της Ελλάδας και λαμβανομένης
    υπόψη της επεκτάσεως των κανονισμών κοινωνικής
    ασφάλισης στους μη μισθωτούς εργαζομένους
    και στα μέλη των οικογενειών τους'
  type: main
- language: it
  script: Latn
  content: '82/576/CEE: Decisione n. 114, del 7 luglio 1982, che fissa il modello
    di formulario E 111 da utilizzare nella Comunità estesa alla Grecia, tenuto conto
    dell'' estensione dei regolamenti di sicurezza sociale ai lavoratori autonomi
    ed ai loro familiari'
  type: main
- language: nl
  script: Latn
  content: '82/576/EEG: Besluit nr. 114 van 7 juli 1982 tot aanpassing van formulier
    E 111 met het oog op het gebruik daarvan in de met Griekenland uitgebreide Gemeenschap
    en de uitbreiding van de sociale zekerheidsregelingen tot zelfstandigen en hun
    gezinsleden'
  type: main
