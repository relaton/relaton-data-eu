title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3782/85 of 31 December 1985 amending for the
    sixth time Regulation (EEC) No 171/83 in particular by the addition of technical
    conservation measures applicable to maritime waters falling within the sovereignty
    or jurisdiction of Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3782/85 du Conseil du 31 décembre 1985 portant sixième
    modification du règlement (CEE) no 171/83 notamment par l' adjonction de mesures
    techniques de conservation applicables aux eaux maritimes relevant de la souveraineté
    ou de la juridiction de l' Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3782/85 des Rates vom 31. Dezember 1985 zur sechsten
    Änderung der Verordnung (EWG) Nr. 171/83 insbesondere durch Hinzufügung weiterer
    technischer Erhaltungsmaßnahmen in den Meeresgewässern, die der Hoheitsgewalt
    oder Gerichtsbarkeit Spaniens und Portugals unterstehen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3782/85 af 31. december 1985 om ændring
    af forordning (EØF) nr. 171/83 gennem udvidelse af tekniske bevaringsforanstaltninger,
    gældende for maritime farvande henhørende under Spaniens og Portugals højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3782/85 του Συμβουλίου
    της 31ης Δεκεμβρίου 1985 για έκτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 171/83, ιδίως με την
    προσθήκη τεχνικών μέτρων διατήρησης που εφαρμόζονται
    στα θαλάσσια ύδατα τα οποία υπάγονται στην
    κυριαρχία ή τη δικαιοδοσία της Ισπανίας και
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3782/85 del Consiglio del 31 dicembre 1985 che modifica
    il regolamento (CEE) n. 171/83 con l' aggiunta di misure tecniche di conservazione
    applicabili alle acque marittime su cui si esercita la sovranità o la giurisdizione
    della Spagna e del Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3782/85 van de Raad van 31 december 1985 houdende
    zesde wijziging van Verordening (EEG) nr. 171/83 met name door toevoeging van
    technische instandhoudingsmaatregelen voor de maritieme wateren onder de soevereiniteit
    of de jurisdictie van Spanje en van Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3782/85 do Conselho, de 31 de Dezembro de 1985,
    que introduz a sexta alteração do Regulamento (CEE) n.° 171/83, nomeadamente
    pela junção de medidas técnicas de conservação aplicáveis às águas marítimas
    sob soberania ou jurisdição de Espanha e de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3782/85 del Consejo, de 31 de diciembre de 1985, por
    el que se establece la sexta modificación del Reglamento (CEE) n° 171/83, en
    particular por la inserción de medidas técnicas de conservación aplicables
    a las aguas marítimas sometidas a la soberanía o a la jurisdición de España
    y de Portugal
  type: main
