    originari degli stati dell' Africa, dei Caraibi e del Pacifico (stati ACP) o dei
    paesi e territori d' oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 692/86 van de Raad van 3 maart 1986 tot verlenging
