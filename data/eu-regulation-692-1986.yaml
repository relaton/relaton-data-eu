title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 692/86 of 3 March 1986 extending Regulation
    (EEC) No 486/85 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific States or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 692/86 du Conseil du 3 mars 1986 prorogeant le règlement
    (CEE) n° 486/85 relatif au régime applicable à des produits agricoles et à
    certaines marchandises résultant de la transformation de produits agricoles originaires
    des États d' Afrique, des Caraïbes et du Pacifique (États ACP) ou des pays
    et territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 692/86 des Rates vom 3. März 1986 zur Verlängerung
    der Verordnung (EWG) Nr. 486/85 über die Regelung für landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP-Staaten)
    oder in den überseeischen Ländern und Gebieten (ÜLG)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 692/86 af 3. marts 1986 om forlængelse af
    gyldigheden af forordning (EØF) nr. 486/85 om den ordning, der skal gælde for
    landbrugsprodukter og visse varer fremstillet af landbrugsprodukter med oprindelse
    i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske lande og
    territorier
  type: main
- language: el
  script: Grek
