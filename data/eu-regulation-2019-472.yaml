title:
- language: en
  script: Latn
  content: Regulation (EU) 2019/472 of the European Parliament and of the Council
    of 19 March 2019 establishing a multiannual plan for stocks fished in the Western
    Waters and adjacent waters, and for fisheries exploiting those stocks, amending
    Regulations (EU) 2016/1139 and (EU) 2018/973, and repealing Council Regulations
    (EC) No 811/2004, (EC) No 2166/2005, (EC) No 388/2006, (EC) No 509/2007 and (EC)
    No 1300/2008
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2019/472 du Parlement européen et du Conseil du 19 mars
    2019 établissant un plan pluriannuel pour les stocks pêchés dans les eaux occidentales
    et les eaux adjacentes ainsi que pour les pêcheries exploitant ces stocks, modifiant
    les règlements (UE) 2016/1139 et (UE) 2018/973 et abrogeant les règlements (CE)
    n° 811/2004, (CE) n° 2166/2005, (CE) n° 388/2006, (CE) n° 509/2007 et (CE)
    n° 1300/2008 du Conseil
  type: main
