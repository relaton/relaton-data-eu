    în apele occidentale și apele adiacente și pentru activitățile de pescuit
    care exploatează stocurile respective, de modificare a Regulamentelor (UE) 2016/1139
    și (UE) 2018/973 și de abrogare a Regulamentelor (CE) nr. 811/2004, (CE) nr.
