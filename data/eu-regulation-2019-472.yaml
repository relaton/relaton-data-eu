    die diese Bestände befischen, zur Änderung der Verordnungen (EU) 2016/1139 und
    (EU) 2018/973 und zur Aufhebung der Verordnungen (EG) Nr. 811/2004, (EG) Nr. 2166/2005,
    (EG) Nr. 388/2006, (EG) Nr. 509/2007 und (EG) Nr. 1300/2008 des Rates
