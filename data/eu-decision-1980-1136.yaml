  script: Latn
  content: '80/1136/EEC: Commission Decision of 24 November 1980 establishing that
    the apparatus described as ''Teledyne portacorder, model RV-320'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '80/1136/CEE: Décision de la Commission, du 24 novembre 1980, constatant
    que l''importation de l''appareil dénommé "Teledyne portacorder, model RV-320"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '80/1136/EWG: Entscheidung der Kommission vom 24. November 1980, mit der
    festgestellt wird, daß das Gerät ,,TELEDYNE-Portacorder, model RV-320" nicht
    unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '80/1136/EØF: Kommissionens beslutning af 24. november 1980 om fastslåelse
