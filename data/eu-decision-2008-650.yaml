  script: Latn
  content: '2008/650/EC: Commission Decision of 30 July 2008 amending Council Directive
    82/894/EEC on the notification of animal diseases within the Community to include
    certain diseases in the list of notifiable diseases and to delete porcine enterovirus
    encephalomyelitis from that list (notified under document number C(2008) 3943)'
  type: main
- language: fr
  script: Latn
