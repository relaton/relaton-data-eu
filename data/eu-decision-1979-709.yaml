title:
- language: en
  script: Latn
  content: '79/709/EEC: Commission Decision of 27 July 1979 authorizing the Netherlands
    Government to apply certain measures exempting national road transport operations
    from the provisions of Community Regulations concerning social matters in road
    haulage (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/709/CEE: Décision de la Commission, du 27 juillet 1979, autorisant
    le gouvernement néerlandais à appliquer, en ce qui concerne les transports nationaux
    par route, des mesures dérogeant aux dispositions des règlements communautaires
    en matière sociale dans le domaine des transports par route (Le texte en langue
    néerlandaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/709/EWG: Entscheidung der Kommission vom 27. Juli 1979, mit der die
    niederländische Regierung ermächtigt wird, im innerstaatlichen Straßenverkehr
    Ausnahmen von den Sozialvorschriften der Gemeinschaftsverordnungen im Bereich
    des Straßenverkehrs anzuwenden (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/709/EØF: Kommissionens beslutning af 27. juli 1979 om bemyndigelse
    af den nederlandske regering til for så vidt angår indenlandsk landevejstransport
    at anvende foranstaltninger som undtagelse fra bestemmelserne i fællesskabsforordningerne
    på det sociale område inden for landevejstransport (Kun den nederlandske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '79/709/ΕΟΚ: Απόφαση τής Επιτροπής τής 27ης
    Ιουλίου 1979 περί εξουσιοδοτήσεως τής ολλανδικής
    κυβερνήσεως νά εφαρμόζει, όσον αφορά τίς εσωτερικές
    οδικές μεταφορές, μέτρα παρεκκλίσεως από τίς
    διατάξεις τού κοινοτικού κανονισμού πού αναφέρεται
    σέ κοινοτικά θέματα στόν τομέα τών οδικών μεταφορών
    (Το κείμενο στην ολλανδική γλώσσα είναι το
    μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '79/709/CEE: Decisione della Commissione, del 27 luglio 1979, che autorizza
    il governo olandese ad applicare ai trasporti nazionali su strada misure che derogano
    alle disposizioni dei regolamenti comunitari in materia sociale nel settore dei
    trasporti su strada (Il testo in lingua olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/709/EEG: Beschikking van de Commissie van 27 juli 1979 waarbij de Nederlandse
    Regering wordt gemachtigd om voor het binnenlandse wervervoer maatregelen toe
    te passen die afwijken van de communautaire voorschriften van sociale aard voor
    het wegvervoer (Slechts de tekst in de Nederlandse taal is authentiek)'
  type: main
