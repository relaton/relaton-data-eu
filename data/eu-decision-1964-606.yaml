title:
- language: fr
  script: Latn
  content: Décision 64/606/CEE de la Commission, du 12 octobre 1964, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/606/EWG: Entscheidung der Kommission vom 12. Oktober 1964 betreffend
    die Anwendung von Artikel 115 Absatz (1) des Vertrages durch die Französische
    Republik, um bestimmte Erzeugnisse aus Drittländern, die sich in den übrigen
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '64/606/CEE: Decisione della Commissione, del 12 ottobre 1964, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato
    al fine di escludere dal trattamento comunitario taluni prodotti originari dei
    paesi terzi ed immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/606/EEG: Beschikking van de Commissie van 12 oktober 1964 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
