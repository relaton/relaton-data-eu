title:
- language: fr
  script: Latn
  content: Décision du Conseil du 28 octobre 1969, portant dérogation à la décision,
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux
    avec les pays tiers, en ce qui concerne les accords à conclure par les États
    membres avec le Japon sur les textiles de coton
  type: main
- language: de
  script: Latn
  content: '69/394/EWG: Entscheidung des Rates vom 28. Oktober 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen mit dritten Ländern in bezug auf von Mitgliedstaaten mit Japan
    zu schließende Abkommen über Baumwollspinnstoffe'
  type: main
- language: it
  script: Latn
  content: '69/394/CEE: Decisione del Consiglio, del 28 ottobre 1969, recante deroga
    alla decisione del 9 ottobre 1961 relativa all''uniformazione della durata degli
    accordi commerciali con i paesi terzi per quanto riguarda gli accordi da concludere
    tra gli Stati membri ed il Giappone per i tessili di cotone'
  type: main
- language: nl
  script: Latn
  content: '69/394/EEG: Beschikking van de Raad van 28 oktober 1969 waarbij wordt
    afgeweken van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden met derde landen, voor wat betreft door de Lid-Staten met
    Japan te sluiten akkoorden inzake katoenprodukten'
  type: main
