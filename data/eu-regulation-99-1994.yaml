title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 99/94 of 19 January 1994 ending the charges
    against the tariff ceilings opened for 1993 in the framework of generalized tariff
    preferences, by Council Regulation (EEC) No 3832/90 in respect of certain textile
    products originating in Sri Lanka, Brazil, Iran, India and Philippines
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 99/94 de la Commission du 19 janvier 1994 portant cessation
    des imputations au bénéfice des plafonds tarifaires ouverts pour 1993 dans le
    cadre des préférences généralisées par le règlement (CEE) n° 3832/90 du
    Conseil pour certains produits textiles originaires du Sri Lanka, du Brésil,
    d'Iran, d'Inde et des Philippines
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 99/94 DER KOMMISSION vom 19. Januar 1994 zur Einstellung
    von Anrechnungen auf die für 1993 eröffneten Zolltarifplafonds im Rahmen der
    allgemeinen Präferenzen durch die Verordnung (EWG) Nr. 3832/90 des Rates für
    bestimmte Textilwaren mit Ursprung in Sri Lanka, Brasilien, Iran, Indien und den
    Philippinen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 99/94 af 19. januar 1994 om indstilling
    af afskrivningerne for 1993 på det toldloft, der som led i de generelle toldpræferencer
    er åbnet ved Rådets forordning (EØF) nr. 3832/90 for visse tekstilvarer, som
    har oprindelse i Sri Lanka, Brasilien, Iran, Indien og Filippinerne
  type: main
- language: el
  script: Grek
