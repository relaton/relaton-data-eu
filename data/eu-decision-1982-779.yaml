  content: '82/779/EEC: Commission Decision of 4 November 1982 establishing that the
    apparatus described as ''Spex - Ramalog Double Spectrometer, model 1403'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/779/CEE: Décision de la Commission, du 4 novembre 1982, constatant
    que l''importation de l''appareil dénommé "Spex - Ramalog Double Spectrometer,
    model 1403" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/779/EWG: Entscheidung der Kommission vom 4. November 1982, mit der
    festgestellt wird, daß das Gerät ,,Spex - Ramalog Double Spectrometer, model
    1403" , nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/779/EØF: Kommissionens beslutning af 4. november 1982 om fastslåelse
    af, at indførsel af apparatet "Spex - Ramalog Double Spectrometer, model 1403"
    ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
