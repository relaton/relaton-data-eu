    fliehende Personen und an Bedürftige in der Ukraine verteilt oder diesen zur
    Verfügung gestellt werden sollen, von Eingangsabgaben und der Mehrwertsteuer
    (Bekannt gegeben unter Aktenzeichen C(2023) 2490) (Nur der deutsche, der estnische,
    der französische, der lettische, der litauische, der niederländische, der polnische,
    der rumänische und der slowakische Text sind verbindlich)
  type: main
