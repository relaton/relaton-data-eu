title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2023/829 of 17 April 2023 on relief from import
    duties and VAT exemption on importation granted for goods to be distributed or
    made available free of charge to persons fleeing the military aggression in Ukraine
    and to persons in need in Ukraine (notified under document C(2023) 2490) (Only
    the Dutch, Estonian, French, German, Latvian, Lithuanian, Polish, Romanian and
    Slovak texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/829 de la Commission du 17 avril 2023 relative à l’octroi
    d’une franchise des droits à l’importation et d’une exonération de la
    TVA à l’importation pour les marchandises destinées à être distribuées
    aux personnes fuyant l’agression militaire en Ukraine et aux personnes dans
    le besoin dans ce pays ou à être mises à leur disposition gratuitement [notifiée
    sous le numéro C(2023) 2490] (Les textes en langues allemande, estonienne, française,
    lettonne, lituanienne, néerlandaise, polonaise, roumaine et slovaque sont les
    seuls faisant foi.)
  type: main
- language: de
