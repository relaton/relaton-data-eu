  content: Commission Regulation (EEC) No 3359/83 of 29 November 1983 amending Regulations
    (EEC) No 2226/78 and (EEC) No 3042/83 as regards the products of the beef and
    veal sector which may be bought into intervention in the Federal Republic of Germany
    and their coefficients
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3359/83 de la Commission du 29 novembre 1983 modifiant
