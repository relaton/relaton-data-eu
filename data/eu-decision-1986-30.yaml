  content: '86/30/ECSC: Commission Decision of 5 February 1986 authorizing the formation
    by Röchling Eisenhandel KG, Ludwigshafen, and Possehl Eisen- und Stahl GmbH,
    Mannheim, of ''Stahlcenter Röchling-Possehl GmbH & Co KG'', Mannheim, and the
    agreement in restraint of competition concluded in connection therewith (Only
    the German text is authentic)'
  type: main
