id: EURegulation19411975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1941/75 of the Commission of 28 July 1975 re-establishing
    the levying of the customs duties on certain appliances, apparatus, accessories
    and requisites for gymnastics or athletics, or for sports and outdoor games, falling
    within subheadings 97.06 B and C, originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1941/75 de la Commission, du 28 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables à certaines
    articles et engins pour les jeux de plein air, la gymnastique, l'athlétisme et
    autres sports, des sous-positions tarifaires 97.06 B et C, originaires du Pakistan,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1941/75 der Kommission vom 28. Juli 1975 zur Wiedereinführung
    des Zollsatzes für bestimmte Geräte für Freiluftspiele, Leichtathletik, Gymnastik
    und anderen Sportarten, der Tarifstellen 97.06 B und C, mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1941/75 af 28. juli 1975 om genindførelse
    af opkrævning af toldafgifter for forskellige redskaber og rekvisitter til udendørsspil
    samt til gymnastik, atletik og andre sportsgrene under underposition 97.06 B og
    C, som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1941/75 della Commissione, del 28 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili ad alcuni oggetti ed attrezzi
    per giuochi all'aperto, da ginnastica, da atletica ed altri sport, diversi da
    quelli della voce n. 97.04, delle sottovoci doganali n. 97.06 B e C, originari
    del Pakistan, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1941/75 van de Commissie van 28 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bepaalde
    artikelen en toestellen voor openluchtspelen, voor gymnastiek, voor atletiek en
    voor andere sporten, van post 97.06 B en C van oorsprong uit Pakistan ten behoeve
    waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene
    tariefpreferenties werden geopend
  type: main
