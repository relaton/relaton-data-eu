id: EUDecision1981869
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '81/869/EEC: Commission Decision of 12 August 1981 authorizing the French
    Republic to apply intra-Community surveillance to imports of products originating
    in a non-member country which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/869/CEE: Décision de la Commission, du 12 août 1981, autorisant la
    République française à instaurer une surveillance intracommunautaire des importations
    de certains produits originaires d''un pays tiers et mis en libre pratique dans
    la Communauté, susceptibles de faire l''objet de mesures de protection au titre
    de l''article 115 du traité (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '81/869/EWG: Entscheidung der Kommission vom 12. August 1981 zur Ermächtigung
    der Französischen Republik, zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus einem Drittland stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Waren, für die Schutzmaßnahmen gemäß Artikel 115 des
    Vertrages ergriffen werden können (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/869/EØF: Kommissionens beslutning af 12. august 1981 om bemyndigelse
    til Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af produkter, der har oprindelse i et tredjeland og er overgået til fri omsætning
    i Fællesskabet, og som kan gøres til genstand for beskyttelsesforanstaltninger
    i henhold til traktatens artikel 115 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/869/EOK: Απόφαση τής Επιτροπής τής 12ης Αυγούστου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά καθιερώσει καθεστώς ενδοκοινοτικής επιτηρήσεως
    τών εισαγωγών ορισμένων προϊόντων καταγωγής
    τρίτης χώρας, τά οποία τίθενται σέ ελεύθερη
    κυκλοφορία στήν Κοινότητα, καί οι οποίες εισαγωγές
    είναι δυνατόν νά αποτελέσουν αντικείμενο προστατευτικών
    μέτρων δύναμει τού άρθρου 115 τής συνθήκης (Το
    κείμενο στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/869/CEE: Decisione della Commissione, del 12 agosto 1981, che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di prodotti originari di un paese terzo e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/869/EEG: Beschikking van de Commissie van 12 augustus 1981 houdende
    machtiging van de Franse Republiek tot instelling van een intracommunautair toezicht
    ten aanzien van de invoer van produkten van oorsprong uit derde landen die in
    de Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn
    van beschermende maatregelen krachtens artikel 115 van het Verdrag (Slechts de
    tekst in de Franse taal is authentiek)'
