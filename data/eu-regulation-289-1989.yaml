title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 289/89 of 3 February 1989 fixing, for the
    period 1 January to 31 December 1989, the maximum quantity of certain products
    of the oils and fats sector to be released for consumption and imported into Spain
    and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 289/89 de la Commission du 3 février 1989 fixant,
    pour la période allant du 1er janvier au 31 décembre 1989, la quantité maximale
    de certains produits du secteur des matières grasses à mettre à la consommation
    et à importer en Espagne et au Portugal
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 289/89 DER KOMMISSION vom 3. Februar 1989 zur Festsetzung
    der Höchstmengen bestimmter Erzeugnisse des Fettsektors, die in Spanien und Portugal
    zum freien Verkehr abzufertigen und in diese Länder einzuführen sind, für den
    Zeitraum vom 1. Januar bis zum 31. Dezember 1989 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 289/89 af 3. februar 1989 om fastsættelse
    for perioden fra 1. januar til 31. december 1989 af den største mængde af visse
    produkter inden for fedtstofsektoren, der kan overgå til frit forbrug i og importeres
    til Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 289/89 της Επιτροπής
    της 3ης Φεβρουαρίου 1989 που καθορίζει για την
    περίοδο από 1ης Ιανουαρίου έως 31 Δεκεμβρίου
    1989 τη μέγιστη ποσότητα ορισμένων προϊόντων
    του τομέα των λιπαρών ουσιών που διατίθενται
    στην κατανάλωση και εισάγονται στην Ισπανία
    και την Πορτογαλία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 289/89 DELLA COMMISSIONE del 3 febbraio 1989 che
    fissa, per il periodo dal 1o gennaio al 31 dicembre 1989, la quantità massima
    di taluni prodotti del settore dei grassi da mettere in consumo e da importare
    in Spagna e Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 289/89 VAN DE COMMISSIE van 3 februari 1989 tot
    vaststelling, voor het tijdvak van 1 januari tot en met 31 december 1989, van
    de maximumhoeveelheid van bepaalde in Spanje en Portugal in consumptie te brengen
    of in te voeren produkten van de sector oliën en vetten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 289/89 DA COMISSÃO de 3 de Fevereiro de 1989 que
    fixa, para o período que vai de 1 de Janeiro a 31 de Dezembro de 1989, a quantidade
    máxima de determinados produtos do sector das matérias gordas a introduzir no
    consumo e a importar para Espanha e para Portugal #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 289/89 DE LA COMISION de 3 de febrero de 1989 por el
