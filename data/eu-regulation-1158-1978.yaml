title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1158/78 of 30 May 1978 extending certain interim
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of Spain, to 24 June 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1158/78 du Conseil, du 30 mai 1978, prorogeant jusqu'au
    24 juin 1978 certaines mesures intérimaires de conservation et de gestion des
    ressources de pêche applicables aux navires battant pavillon de l'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1158/78 des Rates vom 30. Mai 1978 zur Verlängerung
    der Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    gegenüber Schiffen, die die Flagge Spaniens führen, bis zum 24. Juni 1978
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1158/78 af 30. maj 1978 om forlængelse indtil
    den 24. juni 1978 af en række midlertidige foranstaltninger til bevarelse og
    forvaltning af fiskeressourcerne, som skal finde anvendelse på fartøjer, der
    fører Spaniens flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1158/78 del Consiglio, del 30 maggio 1978, che proroga
    fino al 24 giugno 1978 talune misure provvisorie per la conservazione e la gestione
    delle risorse ittiche da applicare alle navi battenti bandiera della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1158/78 van de Raad van 30 mei 1978 houdende verlenging
    tot en met 24 juni 1978 van bepaalde overgangsmaatregelen voor de instandhouding
    en het beheer van de visbestanden, die van toepassing zijn op vaartuigen die de
    vlag van Spanje voeren
