title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1596/82 of 21 June 1982 re-establishing
    the levying of customs duties on glutamic acid and its salts, falling within subheading
    29.23 D III and originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1596/82 de la Commission, du 21 juin 1982, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    glutamique et ses sels, de la sous-position 29.23 D III du tarif douanier commun,
    originaires de Taïlande, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1596/82 der Kommission vom 21. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für Glutaminsäure und ihre Salze der Tarifstelle 29.23
    D III, mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werdenä
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1596/82 af 21. juni 1982 om genindførelse
    af opkrævning af told for glutaminsyre samt salte deraf, henhørende under pos.
    29.23 D III og med oprindelse i Thailand, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1596/82 τής Επιτροπής
    τής 21ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τό γλουταμινικό οξύ
    καί τά άλατα αυτού τής διακρίσεως 29. 23 Δ ΙΙΙ
    τού Κοινού Δασμολογίου, καταγωγής Ταϋλάνδης,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1596/82 della Commissione, del 21 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili all' acido glutammico
    e suoi sali della sottovoce 29.23 D III della tariffa doganale comune, originari
    della Tailandia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1596/82 van de Commissie van 21 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op glutaminezuur
    en zouten daarvan van postonderverdeling 29.23 D III, van oorsprong uit Thailand,
    waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
