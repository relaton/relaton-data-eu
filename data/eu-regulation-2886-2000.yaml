title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2886/2000 of 27 December 2000 derogating
    from Article 31(10) of Council Regulation (EC) No 1255/1999 on the common organisation
    of the market in milk and milk products as regards proof of arrival at destination
    in the case of differentiated refunds and laying down detailed rules for the application
    of the lowest export refund rate for certain milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2886/2000 de la Commission du 27 décembre 2000 dérogeant
    à l'article 31, paragraphe 10, du règlement (CE) nº 1255/1999 du Conseil portant
    organisation commune des marchés dans le secteur du lait et des produits laitiers
    en ce qui concerne la preuve d'arrivée à destination en cas de restitutions
    différenciées et portant modalités d'application du taux le plus bas de la
    restitution à l'exportation de certains produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2886/2000 der Kommission vom 27. Dezember 2000 zur
    Abweichung von Artikel 31 Absatz 10 der Verordnung (EG) Nr. 1255/1999 des Rates
    über die gemeinsame Marktorganisation für Milch und Milcherzeugnisse hinsichtlich
    des Ankunftsnachweises bei differenzierten Erstattungen und der Anwendung des
    niedrigsten Erstattungssatzes bei der Ausfuhr bestimmter Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2886/2000 af 27. december 2000 om fravigelse
    af artikel 31, stk. 10, i Rådets forordning (EF) nr. 1255/1999 om den fælles
    markedsordning for mælk og mejeriprodukter, for så vidt angår ankomstbeviser
    i forbindelse med differentierede restitutionssatser, og om gennemførelsesbestemmelser
    for den laveste eksportrestitutionssats for visse mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2886/2000 της Επιτροπής,
    της 27ης Δεκεμβρίου 2000, για παρέκκλιση από το
    άρθρο 31 παράγραφος 10 του κανονισμού (ΕΚ) αριθ.
    1255/1999 του Συμβουλίου περί κοινής οργανώσεως
    αγοράς στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων όσον αφορά την απόδειξη άφιξης στον
    προορισμό σε περίπτωση διαφοροποιημένων επιστροφών
    και περί λεπτομερειών εφαρμογής του χαμηλότερου
    ύψους της επιστροφής κατά την εξαγωγή ορισμένων
    γαλακτοκομικών προϊόντων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2886/2000, annettu 27 päivänä joulukuuta 2000,
    maito- ja maitotuotealan yhteisestä markkinajärjestelystä annetun neuvoston
    asetuksen (EY) N:o 1255/1999 31 artiklan 10 kohdasta poikkeamisesta määräpaikkaan
    saapumista osoittavan todistuksen osalta eriytetyn tuen ollessa kyseessä ja tiettyjen
    maitotuotteiden vientituen vähimmäismäärän soveltamista koskevista yksityiskohtaisista
    säännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2886/2000 della Commissione, del 27 dicembre 2000,
    recante deroga all'articolo 31, paragrafo 10, del regolamento (CE) n. 1255/1999
    del Consiglio relativo all'organizzazione comune dei mercati nel settore del latte
    e dei prodotti lattiero-caseari, in ordine alla prova di arrivo a destinazione
    in caso di concessione di restituzioni differenziate e recante modalità di applicazione
    del tasso più basso della restituzione all'esportazione di taluni prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2886/2000 van de Commissie van 27 december 2000 tot
    afwijking van artikel 31, lid 10, van Verordening (EG) nr. 1255/1999 van de Raad
    houdende een gemeenschappelijke ordening der markten in de sector melk en zuivelproducten,
    wat betreft het bewijs van aankomst ter bestemming in geval van gedifferentieerde
    restituties en tot vaststelling van bepalingen betreffende de toepassing van het
    laagste eenheidsbedrag van de restitutie bij uitvoer van bepaalde zuivelproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2886/2000 da Comissão, de 27 de Dezembro de 2000,
    que derroga o n.o 10 do artigo 31.o do Regulamento (CE) n.o 1255/1999 do Conselho
    que estabelece a organização comum de mercado no sector do leite e dos produtos
    lácteos, no que respeita à prova de chegada ao destino em caso de restituições
    diferenciadas, e estabelece as normas de execução da taxa mais reduzida da restituição
    à exportação de determinados produtos lácteos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2886/2000 de la Comisión, de 27 de diciembre de 2000,
    que establece una excepción al apartado 10 del artículo 31 del Reglamento (CE)
    nº 1255/1999 del Consejo por el que se establece la organización común de mercados
    en el sector de la leche y los productos lácteos, en lo que respecta al justificante
    de llegada a destino en los casos de restituciones diferenciadas, y por el que
    se establecen disposiciones de aplicación del tipo más bajo de la restitución
    por exportación de determinados productos lácteos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2886/2000 av den 27 december 2000 om
    undantag från artikel 31.10 i rådets förordning (EG) nr 1255/1999 om den gemensamma
    organisationen av marknaden för mjölk och mjölkprodukter beträffande bevis
    på ankomst till bestämmelseorten då det gäller differentierade bidrag och
    om tillämpningsföreskrifter för den lägsta bidragssatsen vid export av vissa
    mjölkprodukter
  type: main
