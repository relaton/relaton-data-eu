title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1980 establishing that the apparatus
    described as 'PAR-OMA system', consisting of 'intensifier detector head, model
    1205 d', 'polychromator UV-VIS-NIR, model 1208', 'display, model 604', 'optical
    multichannel analyzer console, model 1205 A', 'scintillator for intensifier detector
    head, model 1205 D/019', may be imported free of Common Customs Tariff duties
  type: main
- language: fr
  script: Latn
  content: 'Décision de la Commission, du 22 décembre 1980, constatant que l''importation
    de l''appareil dénommé "PAR-OMA system, consisting of: intensifier detector
    head, model 1205 D, polychromator UV-VIS-NIR, model 1208, display, model 604,
    optical multichannel analyzer console, model 1205 A, scintillator for intensifier
    detector head, model 1205 D/019" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 22. Dezember 1980, mit der festgestellt
    wird, daß das Gerät ,,PAR-OMA System, consisting of: - Intensifier Detector
    Head, model 1205 D, - Polychromator UV-VIS-NIR, model 1208, - Display, model 604,
    - Optical Multichannel Analyzer Console, model 1205 A, - Scintillator for Intensifier
    Detector Head, model 1205 D/019" unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 22. december 1980 om fastslåelse af, at indførsel
    af apparatet "P.A.R.-OMA System, consisting of: - Intensifier Detector Head, model
    1205 D, - Polychromator UV-VIS-NIR, model 1208, - Display, model 604, - Optical
    Multichannel Analyzer Console, model 1205 A, - Scientillator for Intensifier Detector
    Head, model 1205 D/019" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1980, che stabilisce che l'importazione
    dell'apparecchio denominato "PAR - OMA system, consisting of intensifier detector
    head, model 1205 D; polychromator UV-VIS-NIR, model 1208; display, model 604;
    optical multichannel analyzer console, model 1205 A; scintillator for intensifier
    detector head, model 1205 D/019" può avvenire in franchigia dai dazi della tariffa
    doganale comune
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 22 december 1980 waarbij wordt vastgesteld
    dat het apparaat genaamd ,,PAR-OMA System, consisting of: - Intensifier Detector
    Head, model 1205 D, - Polychromator UV-VIS-NIR, model 1208, - Display, model 604,
    - Optical Multichannel Analyzer Console, model 1205 A, - Scintillator for Intensifier
    Detector Head, model 1205 D/019" met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
