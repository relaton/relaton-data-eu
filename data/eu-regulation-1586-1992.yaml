    Ausfuhr von im Besitz der französischen Interventionsstelle befindlichem Brotweizen
    auf 1 000 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1586/92 af 22. juni 1992 om ændring
