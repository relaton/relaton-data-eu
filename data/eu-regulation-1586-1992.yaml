    permanente pour l'exportation de blé tendre panifiable détenu par l'organisme
    d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1586/92 der Kommission vom 22. Juni 1992 zur Änderung
