    animale della sottovoce 32.04 B della tariffa doganale comune, originarie del
    Perù beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2550/87 van de Commissie van 24 augustus 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleurstoffen
