    douanetarief, van oorsprong uit Peru, waarvoor de in Verordening (EEG) nr. 3924/86
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2550/87 da Comissão de 24 de Agosto de 1987 que
