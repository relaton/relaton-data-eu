title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2550/87 of 24 August 1987 re-establishing
    the levying of customs duties on colouring matter of animal origin falling within
    subheading 32.04 B of the Common Customs Tariff originating in Peru to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3924/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2550/87 de la Commission du 24 août 1987 portant
    rétablissement de la perception des droits de douane applicables aux matières
    colorantes d' origine animale, de la sous-position 32.04 B du tarif douanier commun,
    originaires du Pérou, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2550/87 der Kommission vom 24. August 1987 zur Wiedereinführung
    der Erhebung der Zölle für tierische Farbstoffe der Tarifstelle 32.04 B des
    Gemeinsamen Zolltarifs, mit Ursprung in Peru, dem die in der Verordnung (EWG)
    Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2550/87 af 24. august 1987 om genindførelse
    af opkrævning af told for animalske farvestoffer, henhørende under pos. 32.04
    B i den fælles toldtarif og med oprindelse i Peru, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
