    is kiterjesztett végleges dömpingellenes vámnak az (EU) 2016/1036 európai
    parlamenti és tanácsi rendelet 11. cikkének (2) bekezdése szerinti hatályvesztési
    felülvizsgálatot követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1013 della Commissione del 27 giugno
    2022 che istituisce un dazio antidumping definitivo sulle importazioni di alcuni
    tipi di meccanismi per la legatura di fogli originari della Repubblica popolare
    cinese ed esteso al Vietnam e alla Repubblica democratica popolare del Laos in
    seguito a un riesame in previsione della scadenza a norma dell’articolo 11,
    paragrafo 2, del regolamento (UE) 2016/1036 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1013 (2022. gada 27. jūnijs),
