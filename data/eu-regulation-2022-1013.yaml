  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1013 оd 27. lipnja 2022. o uvođenju
    konačne antidampinške pristojbe na uvoz određenih prstenastih mehanizama za
    uvezivanje listova papira podrijetlom iz Narodne Republike Kine kako je proširena
    na Vijetnam i Laosku Narodnu Demokratsku Republiku nakon revizije zbog predstojećeg
    isteka mjera u skladu s člankom 11. stavkom 2. Uredbe (EU) 2016/1036 Europskog
    parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1013 végrehajtási rendelete (2022. június 27.)
    a Kínai Népköztársaságból származó bizonyos gyűrűs iratgyűjtő szerkezetek
