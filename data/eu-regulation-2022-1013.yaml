    Popular da China, tornado extensivo ao Vietname e à República Democrática Popular
    do Laos, na sequência de um reexame da caducidade nos termos do artigo 11.o,
    n.o 2, do Regulamento (UE) 2016/1036 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1013 al Comisiei din 27 iunie
