    República Popular China, ampliado a las procedentes de Vietnam y de la República
    Democrática Popular de Laos, tras una reconsideración por expiración con arreglo
    al artículo 11, apartado 2, del Reglamento (UE) 2016/1036 del Parlamento Europeo
    y del Consejo
  type: main
