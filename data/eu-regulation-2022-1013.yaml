  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1013 van de Commissie van 27 juni 2022
    tot instelling van een definitief antidumpingrecht op bepaalde ringbandmechanismen
    van oorsprong uit de Volksrepubliek China, zoals uitgebreid tot Vietnam en de
    Democratische Volksrepubliek Laos, naar aanleiding van een nieuw onderzoek in
