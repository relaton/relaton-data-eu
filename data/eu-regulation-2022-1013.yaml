    антидъмпингово мито върху вноса на определени
    механизми за подвързване с халки с произход
    от Китайската народна република, чийто обхват
    е разширен до Виетнам и Лаоската народнодемократична
    република, след преглед с оглед изтичане на
    срока на действие в съответствие с член 11, параграф
    2 от Регламент (ЕС) 2016/1036 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1013 ze dne 27. června 2022
