    s poreklom iz Ljudske republike Kitajske, kot je razširjena na Vietnam in Laoško
    ljudsko demokratično republiko, po pregledu zaradi izteka ukrepa v skladu s členom
    11(2) Uredbe (EU) 2016/1036 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
