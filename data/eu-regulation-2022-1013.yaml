title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1013 of 27 June 2022 imposing
    a definitive anti-dumping duty on imports of certain ring binder mechanisms originating
    in the People’s Republic of China and as extended to Vietnam and Lao People’s
    Democratic Republic following an expiry review pursuant to Article 11(2) of Regulation
    (EU) 2016/1036 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1013 de la Commission du 27 juin 2022
    instituant un droit antidumping définitif sur les importations de certains mécanismes
    pour reliure à anneaux originaires de la République populaire de Chine, étendu
    au Viêt Nam et à la République démocratique populaire lao, à l’issue d’un
    réexamen au titre de l’expiration des mesures conformément à l’article
    11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1013 der Kommission vom 27. Juni 2022
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    Ringbuchmechaniken mit Ursprung in der Volksrepublik China, ausgedehnt auf Vietnam
    und die Demokratische Volksrepublik Laos, infolge einer Überprüfung wegen des
    bevorstehenden Außerkrafttretens der Maßnahmen nach Artikel 11 Absatz 2 der
    Verordnung (EU) 2016/1036 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1013 на Комисията
