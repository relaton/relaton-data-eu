id: EURegulation15041972
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1504/72 de la Commission, du 13 juillet 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessous (linge de corps) pour hommes et garçonnets, y compris
    les cols, faux cols, plastrons et manchettes en tissus de coton, de la position
    tarifaire EX 61.03, originaires de l'Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2797/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1504/72 der Kommission vom 13. Juli 1972 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Unterkleidung
    (Leibwäsche) für Männer und Knaben, auch Kragen, Vorhemden und Manschetten,
    aus Baumwolle, der Tarifnummer ex 61.03, mit Ursprung in Indien, dem die in der
    Verordnung (EWG) Nr. 2797/71 des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1504/72 della Commissione, del 13 luglio 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    sottovesti (biancheria da dosso) per uomo e per ragazzo, compresi i colli, colletti,
    sparati e polsini, in tessuti di cotone, della voce doganale ex 61.03 originari
    dell'India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2797/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1504/72 van de Commissie van 13 juli 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op herenonderkleding en jongensonderkleding, kragen, boorden, fronten
    en manchetten daaronder begrepen, van katoenen weefsels, van post ex 61.03, van
    oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2797/71 van de Raad van 20 december 1971
  type: main
