title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1994/2001 of 11 October 2001 fixing, for
    the 2000/01 marketing year, the amount to be paid by sugar manufacturers to beet
    sellers in respect of the difference between the maximum amount of the B levy
    and the amount of that levy to be charged
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1994/2001 de la Commission du 11 octobre 2001 fixant,
    pour la campagne de commercialisation 2000/2001, le montant à payer par les fabricants
    de sucre aux vendeurs de betteraves en raison de la différence entre le montant
    maximal de la cotisation B et le montant de cette cotisation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1994/2001 der Kommission vom 11. Oktober 2001 zur Festsetzung
    für das Wirtschaftsjahr 2000/01 des Betrags, den die Zuckerhersteller den Rübenverkäufern
    als Unterschied zwischen dem Höchstbetrag der B-Abgabe und dem Betrag der zu
    erhebenden Abgabe zu zahlen haben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1994/2001 af 11. oktober 2001 om fastsættelse
    for produktionsåret 2000/01 af det beløb, som sukkerfabrikanterne skal betale
    sælgere af sukkerroer som følge af forskellen mellem det maksimale B-afgiftsbeløb
    og det faktiske afgiftsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1994/2001 της Επιτροπής,
    της 11ης Οκτωβρίου 2001, για τον καθορισμό, για
    την περίοδο εμπορίας 2000/01, του ποσού που θα
    πληρωθεί από τους βιομηχάνους ζάχαρης στους
    πωλητές ζαχαροτεύτλων λόγω της διαφοράς μεταξύ
    του μέγιστου ποσού της εισφοράς Β και του ποσού
    της εισφοράς αυτής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1994/2001, annettu 11 päivänä lokakuuta 2001,
    sokerivalmistajien sokerijuurikkaan myyjille B-maksun enimmäismäärän ja B-maksun
    välisen erotuksen vuoksi maksaman määrän vahvistamisesta markkinointivuodeksi
    2000/2001
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1994/2001 della Commissione, dell'11 ottobre 2001,
    che fissa, per la campagna di commercializzazione 2000/01, l'ammontare che i fabbricanti
    di zucchero devono versare ai venditori di barbabietole in ragione della differenza
    tra l'importo massimo del contributo B e l'importo del contributo stesso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1994/2001 van de Commissie van 11 oktober 2001 tot
    vaststelling, voor het verkoopseizoen 2000/2001, van het door de suikerfabrikanten
    aan de suikerbietenverkopers uit te keren bedrag wegens het verschil tussen het
    maximumbedrag van de B-heffing en het bedrag van die heffing
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1994/2001 da Comissão, de 11 de Outubro de 2001,
    que fixa, para a campanha de comercialização de 2000/2001, o montante a pagar
    pelos fabricantes de açúcar aos vendedores de beterrabas devido à diferença
    entre o montante máximo da quotização B e o montante dessa quotização
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1994/2001 de la Comisión, de 11 de octubre de 2001,
