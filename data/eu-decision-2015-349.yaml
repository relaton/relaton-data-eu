    προϊόντων με βάση το κρέας και επεξεργασμένων
    στομαχιών, ουροδόχων κύστεων και εντέρων, όσον
    αφορά την υψηλής παθογονικότητας γρίπη των
    πτηνών μετά την εκδήλωση εστιών της νόσου στις
    πολιτείες Idaho και California [κοινοποιηθείσα υπό
    τον αριθμό C(2015) 1315]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2015/349, 2. märts 2015 , millega muudetakse
    seoses kõrge patogeensusega linnugripi puhangutega Idaho ja California osariigis
    otsuse 2007/777/EÜ II lisas Ameerika Ühendriike käsitlevat kannet loetelus,
