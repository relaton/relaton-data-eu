    a la entrada correspondiente a los Estados Unidos de la lista de terceros países
    o partes de los mismos desde los que está autorizada la introducción en la Unión
    de estómagos, vejigas e intestinos tratados, en relación con la gripe aviar
    de alta patogenicidad, a raíz de la aparición de brotes en los Estados de Idaho
    y California [notificada con el número C(2015) 1315]
  type: main
