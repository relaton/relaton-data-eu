    tuua lihatooteid ning töödeldud magusid, põisi ja sooli (teatavaks tehtud numbri
    C(2015) 1315 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2015/349, annettu 2 päivänä
    maaliskuuta 2015 , päätöksen 2007/777/EY liitteen II muuttamisesta Yhdysvaltoja
    koskevan kohdan osalta niiden kolmansien maiden ja kolmansien maiden osien luettelossa,
    joista lihavalmisteiden sekä käsiteltyjen mahojen, rakkojen ja suolten tuonti
    unioniin on sallittua korkeapatogeenisen lintuinfluenssan yhteydessä Idahon ja
    Kalifornian osavaltioissa sattuneiden taudinpurkausten seurauksena (tiedoksiannettu
    numerolla C(2015) 1315)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/349 оd 2. ožujka 2015. o izmjeni
    Priloga II. Odluci 2007/777/EZ u pogledu unosa za Sjedinjene Američke Države
    na popisu trećih zemalja ili dijelova trećih zemalja iz kojih je odobreno unošenje
    mesnih proizvoda i obrađenih želudaca, mjehura i crijeva u Uniju u vezi s visokopatogenom
    influencom ptica nakon izbijanja bolesti u državama Idaho i Kalifornija (priopćeno
    pod brojem dokumenta C(2015) 1315)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/349 végrehajtási határozata ( 2015. március
    2. ) a 2007/777/EK határozat II. mellékletének a húskészítmények, a kezelt
    gyomor, a hólyag és a belek Unióba történő behozatala céljából engedélyezett
    harmadik országok és országrészek jegyzékében az Egyesült Államokra vonatkozó
    bejegyzés tekintetében a magas patogenitású vírustörzsek okozta madárinfluenza
    Idaho és Kalifornia államban való megjelenése nyomán szükségessé vált
    módosításáról (az értesítés a C(2015) 1315. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/349 della Commissione, del 2 marzo 2015
    , che modifica l'allegato II della decisione 2007/777/CE per quanto riguarda la
    voce relativa agli Stati Uniti nell'elenco di paesi terzi o parti di paesi terzi
    da cui è autorizzata l'introduzione nell'Unione di prodotti a base di carne e
    di stomaci, vesciche e intestini trattati, in relazione all'influenza aviaria
    ad alta patogenicità a seguito della comparsa di focolai negli Stati dell'Idaho
    e della California [notificata con il numero C(2015) 1315]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/349 ( 2015. gada 2. marts ),
    ar ko Lēmuma 2007/777/EK II pielikumu groza attiecībā uz ierakstu par Amerikas
    Savienotajām Valstīm to trešo valstu vai to daļu sarakstā, no kurām Savienībā
    atļauts ievest gaļas produktus un apstrādātus kuņģus, pūšļus un zarnas,
    saistībā ar augsti patogēno putnu gripu pēc uzliesmojumiem Aidaho štatā
    un Kalifornijas štatā (izziņots ar dokumenta numuru C(2015) 1315)
  type: main
- language: lt
  script: Latn
  content: 2015 m. kovo 2 d. Komisijos įgyvendinimo sprendimas (ES) 2015/349, kuriuo
