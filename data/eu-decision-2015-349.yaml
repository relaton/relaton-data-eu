    għall-Istati Uniti fil-lista ta' pajjiżi terzi jew partijiet minnhom minn fejn
    hija awtorizzata l-introduzzjoni fl-Unjoni ta' prodotti tal-laħam u ta' stonkijiet,
    bżieżaq tal-awrina u msaren ittrattati fir-rigward tal-influwenza tat-tjur b'patoġeniċità
