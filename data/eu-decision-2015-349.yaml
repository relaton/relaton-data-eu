    av bilaga II till beslut 2007/777/EG vad gäller uppgifterna om Förenta staterna
    i förteckningen över tredjeländer och delar av tredjeländer från vilka köttprodukter
    och behandlade magar, blåsor och tarmar får föras in till unionen i samband
    med högpatogen aviär influensa efter utbrott i delstaterna Idaho och Kalifornien
    [delgivet med nr C(2015) 1315]
