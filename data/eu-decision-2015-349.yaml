    Aidaho ir Kalifornijos valstijose ir Jungtinių Amerikos Valstijų įrašo trečiųjų
    šalių ar jų dalių, iš kurių leidžiama įvežti į Sąjungą mėsos gaminius
    ir apdorotus skrandžius, pūsles ir žarnas, sąraše iš dalies keičiamas Sprendimo
    2007/777/EB II priedas (pranešta dokumentu Nr. C(2015) 1315)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/349 tat- 2 ta'
