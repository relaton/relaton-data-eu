---
id: EUDecision2015349
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/349 of 2 March 2015 amending
    Annex II to Decision 2007/777/EC as regards the entry for the United States in
    the list of third countries or parts thereof from which the introduction of meat
    products and treated stomachs, bladders and intestines into the Union is authorised
    in relation to highly pathogenic avian influenza following outbreaks in the States
    of Idaho and California (notified under document C(2015) 1315)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/349 de la Commission du 2 mars 2015 modifiant
    l'annexe II de la décision 2007/777/CE en ce qui concerne la ligne relative aux
    États-Unis sur la liste des pays tiers ou parties de pays tiers à partir desquels
    l'introduction dans l'Union de produits à base de viande et d'estomacs, de vessies
    et de boyaux traités est autorisée, dans le cadre des mesures prises à la suite
    de l'apparition de foyers d'influenza aviaire hautement pathogène dans les États
    de l'Idaho et de Californie [notifiée sous le numéro C(2015) 1315]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/349 der Kommission vom 2. März 2015
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich des Eintrags
    für die Vereinigten Staaten in der Liste von Drittländern bzw. Teilen von Drittländern,
    aus denen die Einfuhr von Fleischerzeugnissen und behandelten Mägen, Blasen und
    Därmen in die Europäische Union in Bezug auf die hochpathogene Aviäre Influenza
    gestattet ist, infolge von Ausbrüchen in den Bundesstaaten Idaho und Kalifornien
    (Bekanntgegeben unter Aktenzeichen C(2015) 1315)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/349 на Комисията
    от 2 март 2015 година за изменение, във връзка
    с появата на огнища на високопатогенна инфлуенца
    по птиците в щати Айдахо и Калифорния, на приложение
    II към Решение 2007/777/ЕО по отношение на вписването
    за Съединените щати в списъка на трети държави
    или части от тях, от които е разрешено въвеждането
    в ЕС на месни продукти и обработени стомаси,
    пикочни мехури и черва (нотифицирано под номер
    С(2015) 1315)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/349 ze dne 2. března 2015 ,
    kterým se mění příloha II rozhodnutí 2007/777/ES, pokud jde o položku týkající
    se Spojených států amerických na seznamu třetích zemí nebo jejich částí,
    z nichž je do Unie povolen dovoz masných výrobků a opracovaných žaludků,
    močových měchýřů a střev, v souvislosti s ohnisky vysoce patogenní influenzy
    ptáků ve státě Idaho a Kalifornie (oznámeno pod číslem C(2015) 1315)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/349 af 2. marts 2015
    om ændring af bilag II til beslutning 2007/777/EF for så vidt angår oplysningerne
    om USA i listen over tredjelande og dele af tredjelande, hvorfra det er tilladt
    at importere kødprodukter og behandlede maver, blærer og tarme til Unionen i
    forbindelse med højpatogen aviær influenza som følge af udbrud i staterne Idaho
    og Californien (meddelt under nummer C(2015) 1315)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/349 της Επιτροπής,
    της 2ας Μαρτίου 2015 , για την τροποποίηση του
    παραρτήματος II της απόφασης 2007/777/ΕΚ όσον αφορά
    την καταχώριση για τις Ηνωμένες Πολιτείες
