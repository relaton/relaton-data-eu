    C(2015) 1315)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/349 van de Commissie van 2 maart 2015 tot
    wijziging van bijlage II bij Beschikking 2007/777/EG wat betreft de gegevens voor
    de Verenigde Staten in de lijst van derde landen of delen daarvan waaruit vleesproducten
    en behandelde magen, blazen en darmen in de Unie mogen worden binnengebracht in
    verband met hoogpathogene aviaire influenza naar aanleiding van uitbraken in de
    staten Idaho en Californië (Kennisgeving geschied onder nummer C(2015) 1315)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/349 z dnia 2 marca 2015 r. zmieniająca
    załącznik II do decyzji 2007/777/WE w zakresie wpisu dotyczącego Stanów Zjednoczonych
    w wykazie państw trzecich lub ich części, z których dozwolone jest wprowadzanie
    do Unii produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit
    w odniesieniu do wysoce zjadliwej grypy ptaków w następstwie wystąpienia ognisk
    tej choroby w stanach Idaho i Kalifornia (notyfikowana jako dokument nr C(2015)
    1315)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/349 da Comissão, de 2 de março de 2015
    , que altera o anexo II da Decisão 2007/777/CE no que se refere à entrada relativa
    aos Estados Unidos na lista de países terceiros ou de partes de países terceiros
    a partir dos quais é autorizada a introdução na União de produtos à base
    de carne e de estômagos, bexigas e intestinos tratados, no seguimento da ocorrência
    de surtos de gripe aviária de alta patogenicidade nos Estados de Idaho e Califórnia
    [notificada com o número C(2015) 1315]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/349 a Comisiei din 2 martie 2015
    de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește rubrica
    referitoare la Statele Unite ale Americii din lista de țări terțe sau părți
    ale țărilor terțe din care se autorizează introducerea în Uniune de produse
    din carne și stomacuri, vezici și intestine tratate, în contextul riscului
    de gripă aviară înalt patogenă, în urma apariției unor focare în statele
    Idaho și California [notificată cu numărul C(2015) 1315]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/349 z 2. marca 2015 , ktorým
    sa mení príloha II k rozhodnutiu 2007/777/ES, pokiaľ ide o položku týkajúcu
    sa Spojených štátov amerických v zozname tretích krajín alebo ich častí,
    z ktorých je povolený vstup mäsových výrobkov a opracovaných žalúdkov,
    mechúrov a čriev do Únie v súvislosti s ohniskami vysokopatogénnej aviárnej
    influenzy v štátoch Idaho a Kalifornia [oznámené pod číslom C(2015) 1315]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/349 z dne 2. marca 2015 o spremembi
    Priloge II k Odločbi 2007/777/ES glede vnosa za Združene države Amerike na
    seznamu tretjih držav ali njihovih delov, iz katerih je dovoljen vnos mesnih
    izdelkov in obdelanih želodcev, mehurjev in črev v Unijo, v zvezi z visokopatogeno
    aviarno influenco po izbruhih v zveznih državah Idaho in Kalifornija (notificirano
    pod dokumentarno številko C(2015) 1315)
  type: main
