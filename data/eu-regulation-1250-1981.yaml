  content: Commission Regulation (EEC) No 1250/81 of 11 May 1981 amending Regulation
    (EEC) No 1468/79 on the granting of aid for butter from private storage for use
    in the manufacture of pastry products, ice-cream and other foodstuffs, as a result
    of Greek accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1250/81 de la Commission, du 11 mai 1981, modifiant
    le règlement (CEE) n° 1468/79 relatif à l' octroi d' une aide pour le beurre
    de stockage privé destiné à la fabrication de produits de pâtisserie, de glaces
    alimentaires et autres produits alimentaires, à la suite de l' adhésion de la
    Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1250/81 der Kommission vom 11. Mai 1981 zur Änderung
