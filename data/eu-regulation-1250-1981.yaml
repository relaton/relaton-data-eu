    aus privaten Lagerbeständen für die Herstellung von Backwaren, Speiseeis und
    anderen Lebensmitteln infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1250/81 af 11. maj 1981 om ændring
