  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2479/69 della Commissione, dell'11 dicembre 1969,
    che fissa un coefficiente di adattamento da applicare ai corsi delle arance dolci
    di categoria II, per il calcolo del prezzo d'entrata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2479/69 van de Commissie van 11 december 1969 houdende
    vaststelling van een aanpassingscoëfficiënt die op de prijzen van zoete sinaasappelen
