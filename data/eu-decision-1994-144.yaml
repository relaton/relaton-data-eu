    ποικιλιακής αναδιαρθρώσεως για το λυκίσκο
    που υποβλήθηκε από το Βασίλειο του Βελγίου
    βάσει του κανονισμού (ΕΟΚ) αριθ. 2997/87 του Συμβουλίου
