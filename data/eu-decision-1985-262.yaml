title:
- language: en
  script: Latn
  content: '85/262/EEC: Commission Decision of 26 April 1985 authorizing Member States
    to permit temporarily the marketing of forest reproductive material not satisfying
    the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '85/262/CEE: Décision de la Commission du 26 avril 1985 autorisant les
    États membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction ne répondant pas aux exigences de la directive 66/404/CEE du
    Conseil'
  type: main
- language: de
  script: Latn
  content: '85/262/EWG: Entscheidung der Kommission vom 26. April 1985 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '85/262/EØF: Kommissionens beslutning af 26. april 1985 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '85/262/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Απριλίου 1985 περί παροχής αδείας στα κράτη μέλη
    να εγκρίνουν προσωρινά την εμπορία δασικού
    πολλαπλασιαστικού υλικού το οποίο δεν ανταποκρίνεται
    στις απαιτήσεις της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '85/262/CEE: Decisione della Commissione del 26 aprile 1985 che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    di moltiplicazione di alcune specie forestali che non corrispondono alle esigenze
    della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '85/262/EEG: Beschikking van de Commissie van 26 april 1985 houdende machtiging
    van de Lid-Staten om bosbouwkundig teeltmateriaal dat niet aan de eisen van Richtlijn
    66/404/EEG van de Raad voldoet, tijdelijk tot de handel toe te laten'
  type: main
- language: pt
  script: Latn
  content: '85/262/CEE: Decisão da Comissão, de 26 de Abril de 1985, que autoriza
    os Estados-membros a admitir temporariamente a comercialização de materiais
    florestais de reprodução que não correspondam às exigências da Directiva
    66/404/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '85/262/CEE: Decisión de la Comisión, de 26 de abril de 1985, por la
