    gruppi ta’ bastimenti mir-reġim tal-isforz tas-sajd stabbilit fir-Regolament
    (KE) Nru 1342/2008 u li jemenda r-Regolamenti (UE) Nru 43/2012 u (UE) Nru 44/2012
    fir-rigward ta’ ċerti opportunitajiet tas-sajd
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 1040/2012 van de Raad van 7 november 2012 tot wijziging
    van Verordening (EG) nr. 754/2009 tot uitsluiting van bepaalde groepen vaartuigen
    uit de visserijinspanningsregeling die is vastgesteld in Verordening (EG) nr.
    1342/2008 en tot wijziging van de Verordeningen (EU) nr. 43/2012 en (EU) nr. 44/2012
    met betrekking tot bepaalde vangstmogelijkheden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (UE) nr 1040/2012 z dnia 7 listopada 2012 r. zmieniające
    rozporządzenie (WE) nr 754/2009 w odniesieniu do wyłączenia pewnych grup statków
    z systemu nakładu połowowego ustanowionego w rozporządzeniu (WE) nr 1342/2008
    oraz zmieniające rozporządzenia (UE) nr 43/2012 i (UE) nr 44/2012 w odniesieniu
    do niektórych uprawnień do połowów
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 1040/2012 do Conselho, de 7 de novembro de 2012
    , que altera o Regulamento (CE) n. ° 754/2009 no que se refere à exclusão de
    determinados grupos de navios do regime de gestão do esforço de pesca estabelecido
    no Regulamento (CE) n. ° 1342/2008 e que altera os Regulamentos (UE) n. ° 43/2012
    e (UE) n. ° 44/2012 no respeitante a determinadas possibilidades de pesca
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1040/2012 al Consiliului din 7 noiembrie 2012 de
    modificare a Regulamentului (CE) nr. 754/2009 în ceea ce privește excluderea
    anumitor grupuri de nave din regimul efortului de pescuit prevăzut de Regulamentul
    (CE) nr. 1342/2008 și de modificare a Regulamentelor (UE) nr. 43/2012 și (UE)
    nr. 44/2012 în ceea ce privește anumite posibilități de pescuit
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EÚ) č. 1040/2012 zo 7. novembra 2012 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 754/2009, pokiaľ ide o vyňatie určitých skupín
    plavidiel z režimu rybolovného úsilia ustanoveného v nariadení (ES) č. 1342/2008,
    a ktorým sa menia a dopĺňajú nariadenia (EÚ) č. 43/2012 a (EÚ) č. 44/2012,
    pokiaľ ide o určité rybolovné možnosti
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EU) št. 1040/2012 z dne 7. novembra 2012 o spremembi Uredbe
    (ES) št. 754/2009 glede izključitve določenih skupin plovil iz ureditve ribolovnega
    napora, določenega v Uredbi (ES) št. 1342/2008, ter o spremembi uredb (EU) št.
    43/2012 in (EU) št. 44/2012 glede določenih ribolovnih možnosti
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 1040/2012 del Consejo, de 7 de noviembre de 2012 ,
    por el que se modifica el Reglamento (CE) n ° 754/2009, en lo que respecta a
    la exclusión de determinados grupos de buques del régimen de gestión del esfuerzo
    pesquero previsto en el capítulo III del Reglamento (CE) n ° 1342/2008, así
    como el Reglamento (UE) n ° 43/2012 y el Reglamento (UE) n ° 44/2012 en lo que
    respecta a determinadas posibilidades de pesca
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EU) nr 1040/2012 av den 7 november 2012 om ändring
    av förordning (EG) nr 754/2009 om uteslutning av vissa fartygsgrupper från den
    fiskeansträngningsordning som fastställs i förordning (EG) nr 1342/2008 och
    om ändring av förordningarna (EU) nr 43/2012 och (EU) nr 44/2012 vad gäller
