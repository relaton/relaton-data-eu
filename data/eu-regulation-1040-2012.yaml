    erőkifejtési rendszerből való kizárása tekintetében történő módosításáról,
    valamint a 43/2012/EU és a 44/2012/EU rendeletnek egyes halászati lehetőségek
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 1040/2012 del Consiglio, del 7 novembre 2012 , recante
    modifica del regolamento (CE) n. 754/2009 per quanto riguarda l’esclusione di
    alcuni gruppi di navi dal regime di gestione dello sforzo di pesca previsto dal
    regolamento (CE) n. 1342/2008 e recante modifica dei regolamenti (UE) n. 43/2012
    e (UE) n. 44/2012 per quanto riguarda determinate possibilità di pesca
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (ES) Nr. 1040/2012 ( 2012. gada 7. novembris ), ar ko groza
    Regulu (EK) Nr. 754/2009 attiecībā uz konkrētu kuģu grupu izslēgšanu no
    Regulā (EK) Nr. 1342/2008 noteiktā zvejas piepūles režīma un groza Regulas
    (ES) Nr. 43/2012 un (ES) Nr. 44/2012 attiecībā uz dažām zvejas iespējām
  type: main
- language: lt
  script: Latn
  content: 2012 m. lapkričio 7 d. Tarybos reglamentas (ES) Nr. 1040/2012, kuriuo
    iš dalies keičiamos Reglamento (EB) Nr. 754/2009 nuostatos dėl leidimo tam
    tikrų grupių laivams netaikyti Reglamente (EB) Nr. 1342/2008 nustatytos žvejybos
