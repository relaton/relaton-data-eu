    ir (ES) Nr. 44/2012 nuostatos dėl tam tikrų žvejybos galimybių
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (UE) Nru 1040/2012 tas- 7 ta’ Novembru 2012 li
