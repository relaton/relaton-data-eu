title:
- language: en
  script: Latn
  content: Council Regulation (EU) No 1040/2012 of 7 November 2012 amending Regulation
    (EC) No 754/2009 as regards exclusion of certain groups of vessels from the fishing
    effort regime laid down in Regulation (EC) No 1342/2008 and amending Regulations
    (EU) No 43/2012 and (EU) No 44/2012 as regards certain fishing opportunities
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1040/2012 du Conseil du 7 novembre 2012 modifiant
    le règlement (CE) n ° 754/2009 en ce qui concerne l’exclusion de certains
    groupes de navires du régime de gestion de l’effort de pêche établi dans
    le règlement (CE) n ° 1342/2008 et modifiant les règlements (UE) n ° 43/2012
    et (UE) n ° 44/2012 en ce qui concerne certaines possibilités de pêche
  type: main
