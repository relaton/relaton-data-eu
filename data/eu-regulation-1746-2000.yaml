    l'interdiction des vols entre les territoires de la Communauté et de la République
    fédérale de Yougoslavie, à l'exception de la République du Monténégro et
    de la province du Kosovo, et modifiant le règlement (CE) nº 607/2000
  type: main
- language: de
  script: Latn
