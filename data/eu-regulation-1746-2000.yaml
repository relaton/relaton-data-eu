title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1746/2000 of 3 August 2000 suspending, for an
    additional limited period of time, Regulation (EC) No 2151/1999 imposing a ban
    on flights between the territories of the Community and the Federal Republic of
    Yugoslavia other than the Republic of Montenegro or the Province of Kosovo, and
    amending Regulation (EC) No 607/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1746/2000 du Conseil du 3 août 2000 suspendant, pour
