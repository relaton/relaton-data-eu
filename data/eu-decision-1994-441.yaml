title:
- language: en
  script: Latn
  content: '94/441/EC: Commission Decision of 28 June 1994 amending the supplement
    to the addendum to the Community support framework for Community structural assistance
    in Portugal on the improvement of the conditions under which agricultural and
    forestry products are processed and marketed (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/441/CE: Décision de la Commission du 28 juin 1994 établissant une
    modification au supplément à l''avenant au cadre communautaire d''appui pour
    les interventions structurelles communautaires au Portugal relatif à l''amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    et sylvicoles (Le texte en langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '94/441/EG: ENTSCHEIDUNG DER KOMMISSION vom 28. Juni 1994 zur Änderung
