  content: Regulation (EEC) No 2660/74 of the Council of 15 October 1974 opening,
    allocating and providing for the administration of a Community tariff quota for
    newsprint falling within subheading 48.01 A of the Common Customs Tariff and extending
    this quota to include certain types of paper falling within subheading 48.01 E
    thereof (1975)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2660/74 du Conseil, du 15 octobre 1974, portant ouverture,
