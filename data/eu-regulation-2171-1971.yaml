title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2171/71 de la Commission, du 11 octobre 1971, prorogeant
    le délai prévu à l'article 31 du règlement (CEE) n° 1371/71 de la Commission,
    du 30 juin 1971, relatif à la définition de la notion de produits originaires
    pour l'application des préférences tarifaires octroyées par la Communauté
    économique européenne à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2171/71 der Kommission vom 11. Oktober 1971 zur Verlängerung
    des Artikels 31 der Verordnung (EWG) Nr. 1371/71 der Kommission vom 30. Juni 1971
    über die Begriffsbestimmung des Warenursprungs bei der Anwendung der von der
    Europäischen Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern
    gewährten Zollpräferenzen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2171/71 della Commissione, dell'11 ottobre 1971, che
    proroga il periodo di cui all'articolo 31 del regolamento (CEE) n. 1371/71 della
    Commissione, del 30 giugno 1971, relativo alla definizione della nozione di prodotti
    originari per l'applicazione delle preferenze tariffarie accordate dalla Comunità
    economica europea a taluni prodotti di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2171/71 van de Commissie van 11 oktober 1971 betreffende
    de verlenging van de termijn bedoeld in artikel 31 van Verordening (EEG) nr. 1371/71
    van de Commissie van 30 juni 1971 betreffende de definitie van het begrip "produkten
    van oorsprong" voor de toepassing van tariefpreferenties die door de Europese
    Economische Gemeenschap voor bepaalde produkten uit ontwikkelingslanden worden
    verleend
  type: main
