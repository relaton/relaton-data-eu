  script: Latn
  content: Commission Implementing Regulation (EU) No 403/2012 of 10 May 2012 amending
    for the 170th time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the Al Qaida network
  type: main
- language: fr
  script: Latn
