title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 14 novembre 1967, relative à la détermination
    du taux du prélèvement compensateur institué en vertu de l'article 10 du Traité
    en cas d'utilisation de certains produits agricoles à la fabrication d'amidon
    et de quellmehl
  type: main
- language: de
  script: Latn
  content: '67/725/EWG: Entscheidung der Kommission vom 14. November 1967 über die
    Festsetzung des gemäß Artikel 10 des Vertrages bei der Verwendung bestimmter
    landwirtschaftlicher Erzeugnisse zur Herstellung von Getreidestärke und Quellmehl
    eingeführten anteiligen Zolls'
  type: main
- language: it
  script: Latn
  content: '67/725/CEE: Decisione della Commissione, del 14 novembre 1967, relativa
    alla determinazione dall''aliquota del prelievo compensativo istituito in virtù
    dell''articolo 10 del Trattato per l''utilizzazione di taluni prodotti agricoli
    nella fabbricazione di amidi e di quellmehl'
  type: main
- language: nl
  script: Latn
  content: '67/725/EEG: Beschikking van de Commissie van 14 november 1967 betreffende
    de vaststelling van de op grond van artikel 10 van het Verdrag ingestelde compenserende
    heffing bij het gebruik van bepaalde landbouwprodukten voor de vervaardiging van
    zetmeel en Quellmehl'
