title:
- language: en
  script: Latn
  content: Decision No 1215/2000/EC of the European Parliament and of the Council
    of 16 May 2000 extending Decision No 710/97/EC on a coordinated authorisation
    approach in the field of satellite personal communications services in the Community
  type: main
- language: fr
  script: Latn
  content: Décision nº 1215/2000/CE du Parlement européen et du Conseil du 16 mai
    2000 relative à la prorogation de la décision nº 710/97/CE concernant une approche
    coordonnée des autorisations dans le domaine des services de communications personnelles
    par satellite dans la Communauté
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 1215/2000/EG des Europäischen Parlaments und des Rates
    vom 16. Mai 2000 zur Verlängerung der Entscheidung Nr. 710/97/EG über ein koordiniertes
    Genehmigungskonzept für satellitengestützte persönliche Kommunikationsdienste
    in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets beslutning nr. 1215/2000/EF af 16. maj 2000
    om forlængelse af beslutning nr. 710/97/EF om en koordineret fremgangsmåde for
    godkendelse inden for satellitbaserede personkommunikationstjenester i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 1215/2000/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 16ης Μαΐου 2000, για την
    παράταση της απόφασης αριθ. 710/97/ΕΚ για συντονισμένη
    μέθοδο χορήγησης αδειών στον τομέα των δορυφορικών
    προσωπικών επικοινωνιακών υπηρεσιών στην
    Κοινότητα
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 1215/2000/EY, tehty 16
    päivänä toukokuuta 2000, yhteensovitetusta valtuutusmenettelystä satelliittivälitteisten
    henkilökohtaisten viestintäpalvelujen alalla yhteisössä tehdyn päätöksen
    N:o 710/97/EY voimassaoloajan pidentämisestä
  type: main
- language: it
  script: Latn
  content: Decisione n. 1215/2000/CE del Parlamento europeo e del Consiglio, del 16
    maggio 2000, che proroga la validità della decisione n. 710/97/CE su un approccio
    coordinato di autorizzazione nel settore dei servizi di comunicazioni personali
    via satellite nella Comunità
  type: main
- language: nl
  script: Latn
  content: Beschikking nr. 1215/2000/EG van het Europees Parlement en de Raad van
    16 mei 2000 tot verlenging van Beschikking nr. 710/97/EG betreffende een gecoördineerde
    aanpak op het gebied van persoonlijke satellietcommunicatiediensten in de Europese
    Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Decisão n.o 1215/2000/CE do Parlamento Europeu e do Conselho, de 16 de
    Maio de 2000, que prorroga a Decisão n.o 710/97/CE relativa a uma abordagem coordenada
    em matéria de autorizações no domínio dos serviços de comunicações pessoais
    via satélite na Comunidade
  type: main
- language: es
  script: Latn
  content: Decisión nº 1215/2000/CE del Parlamento Europeo y del Consejo, de 16
    de mayo de 2000, por la que se prolonga la vigencia de la Decisión nº 710/97/CE
    relativa a un planteamiento coordinado de autorización en el ámbito de los servicios
    de comunicaciones personales por satélite en la Comunidad
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 1215/2000/EG av den 16 maj 2000
    om förlängning av beslut nr 710/97/EG om ett samordnat tillvägagångssätt
    vid auktorisation inom området för satellittjänster för personkommunikation
    inom gemenskapen
  type: main
