title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2895/88 of 20 September 1988 re-establishing
    the levying of customs duties on garments, other than knitted or crocheted, products
    of category 78 (order No 40.0780), originating in Indonesia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2895/88 de la Commission du 20 septembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    autres qu'en bonneterie, de la catégorie de produits n° 78 (numéro d'ordre
    40.0780), originaires de l'Indonésie et bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2895/88 DER KOMMISSION vom 20. September 1988 zur
    Wiedereinführung des Zollsatzes für Bekleidung, andere als aus Gewirken, der
    Warenkategorie Nr. 78 (lfd. Nr. 40.0780) mit Ursprung in Indonesien, dem die in
    der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2895/88 af 20. september 1988 om genindførelse
    af opkrævning af toldafgifter for beklædningsgenstande, ikke af trikotage (kategori
    78, løbenummer 40.0780), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2895/88 της Επιτροπής
    της 20ής Σεπτεμβρίου 1988 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ενδύματα
    εκτός από πλεκτά, προϊόντα της κατηγορίας 78
    (αύξων αριθμός 40.0780) καταγωγής Ινδονησίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3783/87 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2895/88 DELLA COMMISSIONE del 20 settembre 1988 che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti diversi
    da quelli a maglia della categoria di prodotti n. 78 (numero d'' ordine 40.0780),
    originari dell'' Indonesia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3783/87 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2895/88 VAN DE COMMISSIE van 20 september 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kleding,
    andere dan van brei- of haakwerk, van de categorie van produkten nr. 78 (volgnummer
    40.0780), van oorsprong uit Indonesië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3783/87 van de Raad #'
  type: main
