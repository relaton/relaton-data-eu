title:
- language: en
  script: Latn
  content: '92/375/EEC: Commission Decision of 25 June 1992 amending Decision 81/546/EEC
    concerning the animal health conditions and veterinary certificates for the import
    of fresh meat from Austria and amending Decision 91/190/EEC concerning the animal
    health conditions and veterinary certificates for the import of domestic animals
    of the bovine and porcine species from Austria'
  type: main
- language: fr
  script: Latn
  content: '92/375/CEE: Décision de la Commission, du 25 juin 1992, modifiant la
    décision 81/546/CEE concernant les conditions sanitaires et la certification
    sanitaire requises à l'' importation de viandes fraîches en provenance d'' Autriche
    et modifiant la décision 91/190/CEE concernant les conditions de police sanitaire
    et les certificats sanitaires requis à importation d'' animaux domestiques des
    espèces bovine et procine en provenance d'' Autriche'
  type: main
- language: de
  script: Latn
  content: '92/375/EWG: Entscheidung der Kommission vom 25. Juni 1992 zur Änderung
    der Entscheidung 81/546/EWG über die viehseuchenrechtlichen Bedingungen und die
    tierärztliche Beurkundung bei der Einfuhr von frischem Fleisch aus Österreich
    und der Entscheidung 91/190/EWG über die Tiergesundheitsanforderungen und -bescheinigungen
    bei der Einfuhr von Rindern und schweinen aus Österreich'
  type: main
- language: da
  script: Latn
  content: '92/375/EØF: Kommissionens beslutning af 25. juni 1992 om ændring af
    beslutning 81/546/EØF om veterinærpolitimæssige bestemmelser og udstedelse
    af sundhedscertifikat ved indførsel af fersk kød fra Østrig og om ændring
    af beslutning 91/190/EØf om dyresundhedsmæssige bestemmelser og udstedelse af
    sundhedscertifikat for indførsel af kvæg og svin fra Østrig'
  type: main
- language: el
  script: Grek
  content: '92/375/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Ιουνίου 1992 για τροποποίηση της απόφασης 81/546/ΕΟΚ
    περί υγειονομικών προϋποθέσεων και κτηνιατρικού
    πιστοποιητικού κατά τις εισαγωγές νωπού κρέατος
    από την Αυστρία καθώς και της απόφασης 91/190/ΕΟΚ
    περί των όρων υγείας των ζώων και της κτηνιατρικής
    πιστοποίησης για την εισαγωγή κατοικιδίων
    ζώων του βοείου και χοιρείου είδους από την
    Αυστρία'
  type: main
- language: it
  script: Latn
  content: '92/375/CEE: Decisione della Commissione, del 25 giugno 1992, che modifica
    la decisione 81/546/CEE relativa alle condizioni di polizia sanitaria e alla certificazione
    veterinaria cui è subordinata l'' importazione di carni fresche provenienti dall''
    Austria, nonché la decisione 91/190/CEE relativa alle norme di polizia sanitaria
    e ai certificati veterinari cui è subordinata l'' importazione di animali domestici
    delle specie bovina e suina dall'' Austria'
  type: main
- language: nl
  script: Latn
  content: '92/375/EEG: Beschikking van de Commissie van 25 juni 1992 tot wijziging
    van Beschikking 81/546/EEG betreffende gezondheidsvoorschriften en gezondheidscertificering
    voor de invoer van vers vlees uit Oostenrijk en van Beschikking 91/190/EEG betreffende
    gezondheidsvoorschriften en gezondheidscertificering voor de invoer van runderen
    en varkens (huisdieren) uit Oostenrijk'
  type: main
- language: pt
  script: Latn
  content: '92/375/CEE: Decisão da Comissão, de 25 de Junho de 1992, que altera
    a Decisão 81/546/CEE respeitante às condições sanitárias e à certificação
    sanitária requeridas para importação de carne fresca proveniente da Áustria
    e que altera a Decisão 91/190/CEE, relativa às condições de polícia sanitária
    e ao certificado exigido para a importação de animais domésticos das espécies
    bovina e suína provenientes da Áustria'
  type: main
- language: es
  script: Latn
  content: '92/375/CEE: Decisión de la Comisión, de 25 de junio de 1992, por la
    que se modifica la Decisión 81/546/CEE referente a las condiciones sanitarias
    y a la certificación sanitaria exigidas para la importación de carne fresca
    procedente de Austria y por la que se modifica la Decisión 91/190/CEE relativa
    a las condiciones y certificados zoosanitarios para la importación de animales
    domésticos de las especies bovina y porcina procedentes de Austria'
