  content: Council Regulation (EEC) No 2878/77 of 20 December 1977 fixing for the
    first four months of 1978 Community quantitative export quotas for certain types
    of copper ash and residues and for certain types of copper, aluminium and lead
    waste and scrap
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2878/77 du Conseil, du 20 décembre 1977, portant
