    und Rückstände von Kupfer sowie für bestimmte Bearbeitungsabfälle und bestimmten
    Schrott aus Kupfer, Aluminium und Blei für die ersten vier Monate des Jahres
    1978
  type: main
- language: da
  script: Latn
