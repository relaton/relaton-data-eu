  content: Décision 64/201/CEE du Conseil du 25 mars 1964, portant suspension temporaire
    des droits du Tarif douanier commun applicables à l'essence de térébenthine
    et aux autres produits de la position 38.07 ainsi qu'aux colophanes de la position
    38.08 A
  type: main
- language: de
  script: Latn
  content: '64/201/EWG: Entscheidung des Rats vom 25. März 1964 über die zeitweilige
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs bei Balsamterpentinöl und
    den übrigen Erzeugnissen der Tarifnummer 38.07 sowie bei Kolophonium der Tarifnummer
    38.08 A'
  type: main
- language: it
  script: Latn
  content: '64/201/CEE: Decisione del Consiglio, del 25 marzo 1964, relativa alla
    temporanea sospensione dei dazi della tariffa doganale comune applicabili all''essenza
    di trementina ed agli altri prodotti della voce 38.07 nonché alle colofonie della
    voce 38.08 A'
  type: main
- language: nl
  script: Latn
  content: '64/201/EEG: Beschikking van de Raad van 25 maart 1964 houdende tijdelijke
    schorsing van de rechten van het gemeenschappelijk douanetarief voor terpentijnolie
    en de overige produkten van tariefpost 38.07 enerzijds en voor vioolhars van tariefpost
    38.08 A anderzijds'
