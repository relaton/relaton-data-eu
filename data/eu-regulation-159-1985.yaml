title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 159/85 of 22 January 1985 re-establishing
    the levying of customs duties on methanol (methyl alcohol), falling within subheading
    29.04 A I and originating in Saudi Arabia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 159/85 de la Commission du 22 janvier 1985 portant
    rétablissement de la perception des droits de douane applicables au méthanol
    (alcool méthylique), relevant de la sous-position 29.04 A I du tarif douanier
    commun, originaire de l' Arabie saoudite, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 159/85 der Kommission vom 22. Januar 1985 zur Wiedereinführung
    der Erhebung der Zölle für Methanol (Methylalkohol) der Tarifstelle 29.04 A
    I mit Ursprung in Saudi-Arabien, dem die in der Verordnung (EWG) Nr. 3562/84 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 159/85 af 22. januar 1985 om genindførelse
    af opkrævning af told for methanol (methylalkohol), henhørende under pos. 29.04
    A I og med oprindelse i Saudi-Arabien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
