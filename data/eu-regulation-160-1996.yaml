title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 160/96 of 29 January 1996 establishing, for
    1996, the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 160/96 de la Commission, du 29 janvier 1996, établissant
    pour 1996 la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 160/96 der Kommission vom 29. Januar 1996 zur Festlegung
    der Liste für 1996 der Schiffe mit einer Länge über alles von mehr als 8 m,
    die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge
    mehr als 9 m beträgt, auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 160/96 af 29. januar 1996 om listen for
    1996 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 160/96 της Επιτροπής,
    της 29ης Ιανουαρίου 1996, που καταρτίζει για το
    1996, τον κατάλογο των σκαφών μήκους άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσες
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 160/96, annettu 29 päivänä tammikuuta 1996,
    luettelon laatimisesta vuodeksi 1996 kokonaispituudeltaan kahdeksan metriä ylittävistä
    aluksista, joilla on lupa kalastaa kielikampelaa tietyillä yhteisön vyöhykkeillä
    kokonaispituudeltaan yhdeksän metriä ylittävien puomitroolien avulla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 160/96 della Commissione, del 29 gennaio 1996, che
    fissa l'elenco per il 1996 dei pescherecci di lunghezza fuori tutto superiore
    a otto metri, autorizzati a pescare la sogliola in determinate zone della Comunità,
    utilizzando reti a strascico a pali, la cui lunghezza complessiva superi i 9 metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 160/96 van de Commissie van 29 januari 1996 tot vaststelling
    voor 1996 van de lijst van vaartuigen met een lengte over alles van meer dan 8
    meter en die in bepaalde zones van de Gemeenschap met boomkorren waarvan de totale
    boomlengte meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 160/96 da Comissão, de 29 de Janeiro de 1996, que
    estabelece para 1996 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 160/96 de la Comisión, de 29 de enero de 1996, por
    el que se establece para 1996 la lista de barcos cuya eslora total excede los
    ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizado artes de arrastre de vara cuya longitud total
    supere los nueve metros
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 160/96 av den 29 januari 1996 om fastställande
    av förteckningen för 1996 över fartyg med en största längd som överstiger
    åtta meter vilka vid fiske efter tunga inom vissa av gemenskapens områden har
    tillstånd att använda bomtrålar vars sammanlagda bomlängd överstiger nio
    meter
  type: main
