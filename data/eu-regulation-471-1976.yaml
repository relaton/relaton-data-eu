type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 471/76 of 24 February 1976 suspending application
    of the condition on prices governing the importation into the Community of fresh
    lemons, originating in Cyprus, Spain, Israel, Morocco, the Arab Republic of Egypt,
    Tunisia and Turkey in accordance with Agreements between the European Economic
    Community and each of these countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE)n 471/76 du Conseil, du 24 février 1976, portant suspension
    de l'application de la condition en matière de prix à laquelle est soumise l'importation
    dans la Communauté de citrons frais originaires de Chypre, d'Espagne, d'Israël,
    du Maroc, de la République Arabe d'Égypte, de Tunisie et de Turquie, en vertu
    des accords entre la Communauté économique européenne et chacun de ces pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 471/76 des Rates vom 24. Februar 1976 über die Aussetzung
    der Anwendung der Preisbedingung, der die Einfuhr frischer Zitronen mit Ursprung
    in Zypern, Spanien, Israel, Marokko, der Arabischen Republik Ägypten, Tunesien
    und der Türkei in die Gemeinschaft auf Grund der Abkommen zwischen der Europäischen
    Wirtschaftsgemeinschaft und jedem dieser Länder unterliegt
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 471/76 af 24. februar 1976 om suspension
    af den vedrørende priserne gældende betingelse for indførsel til Fællesskabet
    af friske citroner med oprindelse i Cypern, Spanien, Israel, Marokko, Den arabiske
    republik Ægypten, Tunesien og Tyrkiet, i henhold til aftalerne mellem Det europæiske
    økonomiske Fællesskab og hvert af disse lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 471/76 του Συμβουλίου
    της 24ης Φεβρουαρίου 1976 περί αναστολής του όρου
    όσον αφορά τις τιμές στον οποίο υπόκειται η
    εισαγωγή νωπών λεμονιών στην Κοινότητα, καταγωγής
    Κύπρου, Ισπανίας, Ισραήλ, Μαρόκου, Αραβικής
    Δημοκρατίας της Αιγύπτου, Τυνησίας και Τουρκίας
    δυνάμει των συμφωνιών μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητος και καθεμίας των χωρών
    αυτών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 471/76 del Consiglio, del 24 febbraio 1976, che sospende
    l' applicazione della condizione in materia di prezzi cui è soggetta l' importazione
    nella Comunità di limoni freschi originari di Cipro, della Spagna, di Israele,
    del Marocco, della Repubblica araba d' Egitto, della Tunisia e della Turchia,
    in virtù degli accordi tra la Comunità economica europea ed ognuno di tali paesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 471/76 van de Raad van 24 februari 1976 houdende
    schorsing van de toepassing van de voorwaarde ten aanzien van de prijs waaraan
    de invoer in de Gemeenschap van verse citroenen van oorsprong uit Cyprus, Spanje,
    Israël, Marokko, de Arabische Republiek Egypte, Tunesië en Turkije is onderworpen
    krachtens de overeenkomsten tussen de Europese Economische Gemeenschap en elk
    dezer landen
  type: main
