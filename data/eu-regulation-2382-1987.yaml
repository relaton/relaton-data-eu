  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2382/87 del Consiglio del 5 agosto 1987 che istituisce
    un dazio antidumping definitivo sulle importazioni di motori elettrici polifase
    normalizzati di potenza superiore a 0,75 kW e inferiore o pari a 75 kW, originari
    della Iugoslavia
  type: main
- language: nl
