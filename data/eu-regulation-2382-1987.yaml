title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2382/87 of 5 August 1987 imposing a definitive
    anti-dumping duty on imports of standardized multi-phase electric motors having
    an output of more than 0,75 kW but not more than 75 kW, originating in Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2382/87 du Conseil du 5 août 1987 instituant un droit
    antidumping définitif à l' égard des importations de moteurs électriques polyphasés
    normalisés d' une puissance de plus de 0,75 à 75 kilowatts inclus originaires
    de Yougoslavie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2382/87 des Rates vom 5. August 1987 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von standardisierten Mehrphasen-Wechselstrommotoren
    mit einer Leistung von mehr als 0,75 bis 75 kW mit Ursprung in Jugoslawien
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2382/87 af 5. august 1987 om indførelse
    af en endelig antidumpingtold på importen af standardiserede elektriske motorer,
    flerfasede, med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Jugoslavien
  type: main
