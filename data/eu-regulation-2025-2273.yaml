title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/2273 of 30 June 2025 supplementing
    Directive (EU) 2024/1275 of the European Parliament and of the Council as regards
    the establishment of a comparative methodology framework for calculating cost-optimal
    levels of minimum energy performance requirements for buildings and building elements
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/2273 de la Commission du 30 juin 2025 complétant
    la directive (UE) 2024/1275 du Parlement européen et du Conseil en ce qui concerne
    l’établissement d’un cadre méthodologique comparatif de calcul des niveaux
    optimaux en fonction des coûts des exigences minimales de performance énergétique
    des bâtiments et éléments de bâtiment
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/2273 der Kommission vom 30. Juni 2025 zur
    Ergänzung der Richtlinie (EU) 2024/1275 des Europäischen Parlaments und des
    Rates in Bezug auf die Schaffung eines Rahmens für eine Vergleichsmethode zur
    Berechnung kostenoptimaler Niveaus von Mindestanforderungen an die Gesamtenergieeffizienz
    von Gebäuden und Gebäudekomponenten
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/2273 на Комисията
    от 30 юни 2025 година за допълване на Директива
    (ЕС) 2024/1275 на Европейския парламент и на Съвета
    по отношение на установяването на сравнителна
    методологична рамка за изчисляване на равнищата
    на оптимални разходи във връзка с минималните
    изисквания за енергийните характеристики
    на сградите и сградните компоненти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2025/2273 ze dne 30. června
    2025, kterým se doplňuje směrnice Evropského parlamentu a Rady (EU) 2024/1275,
    pokud jde o vytvoření srovnávacího metodického rámce pro výpočet nákladově
    optimálních úrovní minimálních požadavků na energetickou náročnost budov
    a prvků budov
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/2273 af 30. juni 2025 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv (EU) 2024/1275
    for så vidt angår fastsættelse af en ramme for en sammenligningsmetode til
    beregning af omkostningsoptimale niveauer for mindstekrav til bygningers og bygningsdeles
    energimæssige ydeevne
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2025/2273
    της Επιτροπής, της 30ής Ιουνίου 2025, για τη συμπλήρωση
    της οδηγίας (ΕΕ) 2024/1275 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά τον καθορισμό
    συγκριτικού μεθοδολογικού πλαισίου για τον
    υπολογισμό των βέλτιστων από πλευράς κόστους
    επιπέδων για τις ελάχιστες απαιτήσεις ενεργειακής
    απόδοσης των κτιρίων και των δομικών στοιχείων
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2025/2273, 30. juuni 2025, millega
    täiendatakse Euroopa Parlamendi ja nõukogu direktiivi (EL) 2024/1275 seoses
    hoonete ja hoone komponentide energiatõhususe miinimumnõuete kuluoptimaalse
    taseme arvutamise võrdleva metoodika raamistiku kehtestamisega
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2025/2273, annettu 30 päivänä kesäkuuta
    2025, Euroopan parlamentin ja neuvoston direktiivin (EU) 2024/1275 täydentämisestä
    siltä osin kuin on kyse vertailumenetelmäkehyksen vahvistamisesta rakennusten
    ja rakennusosien energiatehokkuutta koskevien vähimmäisvaatimusten kustannusoptimaalisten
    tasojen laskentaa varten
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2025/2273 ón gCoimisiún an 30 Meitheamh 2025
    lena bhforlíontar Treoir (AE) 2024/1275 ó Pharlaimint na hEorpa agus ón gComhairle
    a mhéid a bhaineann le creat modheolaíochta comparáideach a bhunú chun na
    leibhéil is fearr costas maidir le híoscheanglais feidhmíochta fuinnimh le
    haghaidh foirgneamh agus eilimintí foirgnimh a ríomh
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/2273 оd 30. lipnja 2025. o dopuni
    Direktive (EU) 2024/1275 Europskog parlamenta i Vijeća u vezi s utvrđivanjem
    usporednog metodološkog okvira za izračunavanje troškovno optimalnih razina
    za minimalne zahtjeve energetskih svojstava zgrada i dijelova zgrada
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/2273 felhatalmazáson alapuló rendelete (2025.
    június 30.) az (EU) 2024/1275 európai parlamenti és tanácsi irányelvnek az
    épületekre és épületelemekre vonatkozó energiahatékonysági minimumkövetelmények
    költségoptimalizált szintjeinek kiszámítására szolgáló összehasonlító
    módszertani keret létrehozása tekintetében való kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/2273 della Commissione, del 30 giugno 2025,
    che integra la direttiva (UE) 2024/1275 del Parlamento europeo e del Consiglio
    per quanto riguarda l’istituzione di un quadro metodologico comparativo per
    il calcolo dei livelli ottimali in funzione dei costi per i requisiti minimi di
    prestazione energetica degli edifici e degli elementi edilizi
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/2273 (2025. gada 30. jūnijs), ar
    kuru Eiropas Parlamenta un Padomes Direktīvu (ES) 2024/1275 papildina, izveidojot
    salīdzinošās metodoloģijas sistēmu, kā aprēķināt minimālo energosnieguma
    prasību izmaksoptimālus līmeņus ēkām un būves elementiem
  type: main
- language: lt
  script: Latn
  content: 2025 m. birželio 30 d. Komisijos deleguotasis reglamentas (ES) 2025/2273,
    kuriuo Europos Parlamento ir Tarybos direktyva (ES) 2024/1275 papildoma nuostatomis
    dėl kaštų atžvilgiu optimalaus pastatų ir pastato dalių minimaliųjų energinio
    naudingumo reikalavimų lygio apskaičiavimo lyginamosios metodikos principų
    nustatymo
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/2273 tat-30 ta’ Ġunju 2025
    li jissupplimenta d-Direttiva (UE) 2024/1275 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istabbiliment ta’ qafas ta’ metodoloġija komparattiva għall-kalkolu
    tal-livelli kostottimali tar-rekwiżiti minimi tar-rendiment tal-bini u tal-elementi
    tal-bini fl-użu tal-enerġija
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2025/2273 van de Commissie van 30 juni 2025
    tot aanvulling van Richtlijn (EU) 2024/1275 van het Europees Parlement en de Raad
    betreffende de vaststelling van een vergelijkend methodologisch kader voor het
    berekenen van de kostenoptimale niveaus van de minimumeisen inzake energieprestaties
    voor gebouwen en onderdelen van gebouwen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/2273 z dnia 30 czerwca 2025
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady (UE) 2024/1275 w
    odniesieniu do ustanowienia ram metodologii porównawczej do celów obliczania
    optymalnego pod względem kosztów poziomu minimalnych wymagań dotyczących charakterystyki
    energetycznej budynków i elementów budynków
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/2273 da Comissão, de 30 de junho de 2025,
    que completa a Diretiva (UE) 2024/1275 do Parlamento Europeu e do Conselho no
    que respeita à criação de um quadro para a metodologia comparativa para o cálculo
    dos níveis ótimos de rentabilidade dos requisitos mínimos de desempenho energético
    dos edifícios e componentes de edifícios
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/2273 al Comisiei din 30 iunie 2025 de completare
    a Directivei (UE) 2024/1275 a Parlamentului European și a Consiliului în ceea
    ce privește stabilirea unui cadru metodologic comparativ de calcul al nivelurilor
    optime, din punctul de vedere al costurilor, ale cerințelor minime de performanță
    energetică a clădirilor și a elementelor acestora
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/2273 z 30. júna 2025, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady (EÚ) 2024/1275, pokiaľ ide
    o vytvorenie rámca porovnávacej metodiky na výpočet nákladovo optimálnych
    úrovní minimálnych požiadaviek na energetickú hospodárnosť budov a prvkov
    budov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/2273 z dne 30. junija 2025 o dopolnitvi
    Direktive (EU) 2024/1275 Evropskega parlamenta in Sveta z določitvijo primerjalnega
    metodološkega okvira za izračunavanje stroškovno optimalnih ravni minimalnih
    zahtev glede energetske učinkovitosti stavb in elementov stavb
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/2273 de la Comisión, de 30 de junio de 2025,
    por el que se completa la Directiva (UE) 2024/1275 del Parlamento Europeo y del
    Consejo en lo que respecta al establecimiento de un marco metodológico comparativo
    para calcular los niveles óptimos de rentabilidad de los requisitos mínimos
    de eficiencia energética aplicables a los edificios y elementos de edificios
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/2273 av den 30 juni 2025
    om komplettering av Europaparlamentets och rådets direktiv (EU) 2024/1275 vad
    gäller fastställande av en ram för jämförbara metoder för fastställande
    av kostnadsoptimala nivåer för minimikrav avseende energiprestanda för byggnader
    och byggnadselement
