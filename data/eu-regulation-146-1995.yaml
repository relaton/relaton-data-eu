title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 146/95 of 27 January 1995 specifying the
    extent to which applications lodged in January 1995 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 146/95 DE LA COMMISSION du 27 janvier 1995 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de janvier 1995 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 146/95 DER KOMMISSION vom 27. Januar 1995 über das
    Ausmaß, in dem den im Januar 1995 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 146/95 af 27. januar 1995 om fastsættelse
    af, i hvilket omfang ansøgninger om udstedelse af importlicenser, som er indsendt
    i januar 1995 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 146/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιανουαρίου 1995 για καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιανουάριο 1995 για τα νεαρά άρρενα
    βοοειδή που προορίζονται για πάχυνση
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 146/95, annettu 27 päivänä tammikuuta 1995,
    nuorten urospuolisten lihotukseen tarkoitettujen nautojen tammikuussa 1995 esitettyjen
    tuontilupahakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 146/95 DELLA COMMISSIONE del 27 gennaio 1995 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di gennaio 1995 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 146/95 VAN DE COMMISSIE van 27 januari 1995 tot bepaling
    van de mate waarin de in januari 1995 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 146/95 DA COMISSÃO de 27 de Janeiro de 1995 que determina
    em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Janeiro de 1995 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 146/95 DE LA COMISIÓN de 27 de enero de 1995 que determina
    en qué medida podrá darse curso a las solicitudes de expedición de certificados
    de importación presentadas en el mes de enero de 1995 para los machos jóvenes
    de la especie bovina destinados al engorde
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 146/95 av den 27 januari 1995 om i vilken
