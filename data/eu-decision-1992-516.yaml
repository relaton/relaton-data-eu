  script: Latn
  content: '92/516/EEC: Commission Decision of 28 October 1992 on the establishment
    of a supplement to the addendum to the Community support framework for Community
    structural assistance in Greece on the improvement of the conditions under which
    agricultural and forestry products are processed and marketed (Only the Greek
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/516/CEE: Décision de la Commission, du 28 octobre 1992, concernant
