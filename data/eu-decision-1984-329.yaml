    και εξόδων για το οκονομικό έτος 1982'
  type: main
- language: it
  script: Latn
  content: '84/329/CEE: Decisione del Parlamento europeo del 10 aprile 1984 sul discarico
    al consiglio d''amministrazione della Fondazione europea per il miglioramento
    delle condizioni di vita e di lavoro in merito all''esecuzione dei suoi stanziamenti
    per l''esercizio 1982 . Risoluzione contenente le osservazioni relative alla decisione
    con cui viene concesso il discarico al consiglio d''amministrazione della Fondazione
