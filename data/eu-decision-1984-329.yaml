title:
- language: en
  script: Latn
  content: '84/329/EEC: Decision of the European Parliament of 10 April 1984 on the
    discharge granted to the Administrative Board of the European Foundation for the
    Improvement of Living and Working Conditions in respect of the implementation
    of its appropriations for the 1982 financial year . Resolution embodying the comments
    accompanying the decision granting a discharge to the Administrative Board of
    the European Foundation for the Improvement of Living and Working Conditions in
    respect of its revenue and expenditure accounts for the 1982 financial year'
  type: main
- language: fr
  script: Latn
  content: '84/329/CEE: Décision du Parlement européen du 10 avril 1984 donnant
    décharge au conseil d''administration de la Fondation européenne pour l''amélioration
    des conditions de vie et de travail sur l''exécution de son budget pour l''exercice
    1982 . Résolution contenant les observations relatives à la décision donnant
    décharge au conseil d''administration de la Fondation européenne pour l''amélioration
    des conditions de vie et de travail sur ses comptes de gestion pour l''exercice
    1982'
  type: main
- language: de
  script: Latn
  content: '84/329/EWG: Beschluß des Europäischen Parlaments vom 10. April 1984
    über die dem Verwaltungsrat der Europäischen Stiftung zur Verbesserung der Lebens-
    und Arbeitsbedingungen erteilte Entlastung zur Ausführung seines Einnahmen- und
    Ausgabenplans für das Haushaltsjahr 1982 . Entschließung mit den Bemerkungen
    zu dem Beschluß, dem Verwaltungsrat der Europäischen Stiftung zur Verbesserung
    der Lebens- und Arbeitsbedingungen Entlastung zur Ausführung des Einnahmen- und
    Ausgabenplans für das Haushaltsjahr 1982 zu erteilen'
  type: main
- language: da
  script: Latn
  content: '84/329/EØF: Europa-Parlamentets afgørelse af 10. april 1984 om decharge
    til bestyrelsen for Det europæiske institut til forbedring af Leve- og Arbejdsvilkårene
    for gennemførelsen af bevillingerne for regnskabsåret 1982 . Beslutning med
    bemærkninger til afgørelsen om decharge til bestyrelsen for Det europæiske
    institut til forbedring af Leve- og Arbejdsvilkårene for forvaltningsregnskabet
    for regnskabsåret 1982'
  type: main
- language: el
  script: Grek
