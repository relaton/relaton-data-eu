id: EUDecision1977637
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 August 1977 authorizing the Federal Republic
    of Germany not to apply Community treatment to men's and boys' outer garments,
    trousers, breeches and the like, falling within heading No ex 61.01 of the Common
    Customs Tariff, originating in the People's Republic of China and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/637/CEE: Décision de la Commission, du 11 août 1977, autorisant la
    République fédérale d''Allemagne à exclure du traitement communautaire les
    vêtements de dessus pour hommes et garçonnets, pantalons et culottes, de la
    position Ex 61.01 du Tarif douanier commun, originaires de la République populaire
    de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 11. August 1977, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Volksrepublik China stammende und in den
    anderen Mitgliedstaaten im freien Verkehr befindliche Oberbekleidung für Männer
    und Knaben: kurze und lange Hosen aus Baumwolle, der Tarifnummer ex 61.01 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 11. august 1977 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage yderbeklædningsgenstande til
    mænd og drenge, lange og korte benklæder, som henhører under pos. ex 61.01
    i den fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 agosto 1977, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario gli indumenti esterni
    per uomo e per ragazzo, calzoni e calzoncini, della voce ex 61.01 della tariffa
    doganale comune, originari della Repubblica popolare cinese e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 augustus 1977 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd heren- en jongensbovenkleding, van post ex 61.01 van
    het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
