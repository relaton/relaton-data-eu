id: EURegulation31191975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3119/75 of the Commission of 28 November 1975 re-establishing
    the levying of customs duties on worked monumental or building stone, and articles
    thereof (including mosaic cubes), other than goods falling within heading No 68.01
    or within Chapter 69, falling within heading No 68.02, originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3119/75 de la Commission, du 28 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    en pierres de taille ou de construction, à l'exclusion de ceux du n 68.01 et
    de ceux du chapitre 69, cubes et des pour mosaïques, de la position tarifaire
    68.02, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3119/75 der Kommission vom 28. November 1975 zur Wiedereinführung
    des Zollsatzes für bearbeitete Werksteine und Waren daraus (einschließlich Würfel
    und Steinchen für Mosaike), ausgenommen Waren der Tarifnummer 68.01 und des Kapitels
    69, der Tarifnummer 68.02, mit Ursprung in Entwicklungsländern, denen die in
    der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3119/75 af 28. november 1975 om genindførelse
    af opkrævning af toldafgifter for bearbejdede monument- og bygningssten samt
    af varer af monument- og bygningssten (herunder terninger til mosaikarbejder),
    under position 68.02, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3119/75 della Commissione, del 28 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di pietre da
    taglio o da costruzione, eccettuati quelli della voce 68.01 e quelli del capitolo
    69, cubi e tessere per mosaici, della voce doganale 68.02, originari dei paesi
    in via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3119/75 van de Commissie van 28 november 1975 houdende
    wederinstelling van de heffing van de douanerechten voor werken van steen, bewerkte
    steen daaronder begrepen, met uitzondering van de goederen bedoeld bij post 68.01
    en bij een der posten van Hoofdstuk 69; blokjes voor mozaïeken, van post 68.02,
    van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3054/74 van de Raad van 2 december 1974 tariefpreferenties werden geopend
  type: main
