  content: Commission Implementing Regulation (EU) 2024/1835 of 27 June 2024 amending
    Implementing Regulations (EU) 2020/761, (EU) 2020/1988 and (EU) 2023/2834 as regards
    tariff measures for certain agricultural products originating in or exported directly
    or indirectly from Belarus and Russia, and as regards the conversion rates for
    rice
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1835 de la Commission du 27 juin 2024
    modifiant les règlements d’exécution (UE) 2020/761, (UE) 2020/1988 et (UE)
    2023/2834 en ce qui concerne les mesures tarifaires applicables à certains produits
    agricoles originaires de Biélorussie ou de Russie ou exportés directement ou
    indirectement de ces pays, ainsi que les taux de conversion pour le riz
  type: main
