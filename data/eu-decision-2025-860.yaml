    de la convention de Rotterdam sur la procédure de consentement préalable en
    connaissance de cause applicable à certains produits chimiques et pesticides
    dangereux qui font l’objet d’un commerce international en ce qui concerne
    certaines modifications de ladite convention et de son annexe III, et au règlement
    intérieur de la conférence des parties à la convention
  type: main
