title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3430/90 of 27 November 1990 re-establishing
    the levying of the customs duties applicable to products of category No 22 (order
    No 40.0220) and the products of category No 127 a (order No 42.1271) originating
    in India, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3430/90 de la Commission du 27 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 22 (numéro d'ordre 40.0220) et aux produits de la catégorie
    n° 127 à (numéro d'ordre 42.1271) originaires de l'Inde, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3430/90 DER KOMMISSION vom 27. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 22
    (lfd. Nummer 40.0220) und die Waren der Warenkategorie Nr. 127 A (lfd. Nummer
    42.1271) mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3897/89 des
    Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3430/90 af 27. november 1990 om genindførelse
    af opkrævning af told for varer under varekategori 22 (løbenummer 40.0220) og
    varer under varekategori 127 A (løbenummer 42.1271), som har oprindelse i Indien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3897/89
  type: main
- language: el
  script: Grek
