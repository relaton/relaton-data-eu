  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3430/90 DELLA COMMISSIONE del 27 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    di prodotti n. 22 (numero d'ordine 40.0220) e ai prodotti della categoria di prodotti
    n. 127 A (numero d'ordine 42.1271) originari dell'India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3430/90 VAN DE COMMISSIE van 27 november 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie nr. 22 (volgnummer 40.0220) en de produkten van categorie nr. 127
    A (volgnummer 42.1271), van oorsprong uit India, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3430/90 DA COMISSAO de 27 de Novembro de 1990 que
