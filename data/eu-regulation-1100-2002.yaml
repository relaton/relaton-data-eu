title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1100/2002 of 24 June 2002 determining the
    extent to which applications lodged in June 2002 for import licences for certain
    poultrymeat products under the regime provided for in Council Regulation (EC)
    No 774/94 opening and providing for the administration of certain Community tariff
    quotas for poultrymeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1100/2002 de la Commission du 24 juin 2002 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juin 2002 pour certains produits à base de viande de volaille peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande de volaille et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1100/2002 der Kommission vom 24. Juni 2002 über die
    Festsetzung des Umfangs, in dem die im Juni 2002 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Geflügelfleischerzeugnisse entsprechend der Regelung der Verordnung
    (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher Zollkontingente
    für Geflügelfleisch und andere landwirtschaftliche Erzeugnisse genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1100/2002 af 24. juni 2002 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juni
    2002 om importlicenser for visse fjerkræprodukter, som kun accepteres i forbindelse
    med den ordning, der er fastsat i Rådets forordning (EF) nr. 774/94 om åbning
    og forvaltning af en række EF-toldkontingenter for fjerkrækød og andre landbrugsprodukter
  type: main
- language: el
  script: Grek
