    ορισμένων τμημάτων του εδάφους της Ομοσπονδιακής
    Δημοκρατίας της Γερμανίας ως επίσημα απαλλαγμένων
    από την πανώλη των χοίρων'
  type: main
- language: it
  script: Latn
  content: '88/185/CEE: Decisione della Commissione del 17 febbraio 1988 recante terza
