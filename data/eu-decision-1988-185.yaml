title:
- language: en
  script: Latn
  content: '88/185/EEC: Commission Decision of 17 February 1988 amending for the third
    time Decision 82/351/EEC recognizing certain parts of the territory of the Federal
    Republic of Germany as being officially swine- fever free (Only the German text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/185/CEE: Décision de la Commission du 17 février 1988 portant troisième
    modification de la décision 82/351/CEE reconnaissant certaines parties du territoire
    de la République fédérale d''Allemagne comme officiellement indemnes de peste
    porcine (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/185/EWG: Entscheidung der Kommission vom 17. Februar 1988 zur dritten
    Änderung der Entscheidung 82/351/EWG, durch die bestimmte Teile des Hoheitsgebiets
    der Bundesrepublik Deutschland als amtlich schweinepestfrei anerkannt werden (Nur
    der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/185/EØF: Kommissionens beslutning af 17. februar 1988 om tredje ændring
    af beslutning 82/351/EØF om godkendelse af visse dele af Forbundsrepublikken
    Tysklands område som værende officielt fri for svinepest (Kun den tyske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
