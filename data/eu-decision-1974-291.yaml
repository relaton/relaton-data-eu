---
id: EUDecision1974291
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 June 1974 concerning, 'inter alia' the setting
    of a time limit for the Commission Decision of 8 May 1974 authorizing the Italian
    Republic to take certain protective measures under Article 108 (3) of the EEC
    Treaty in respect of imports of calves and young bovine animals for fattening
  type: main
- language: fr
  script: Latn
  content: Décision 74/291/CEE de la Commission, du 5 juin 1974, fixant notamment
    une date limite de la décision de la Commission, du 8 mai 1974, autorisant la
    République italienne à prendre certaines mesures de sauvegarde au titre de l'article
    108 paragraphe 3 du Traité CEE en ce qui concerne l'importation de certains veaux
    et jeunes bovins destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Juni 1974 zur Festsetzung eines Endtermins
    für die Entscheidung der Kommission vom 8. Mai 1974, mit der die Italienische
    Republik ermächtigt wird, bestimmte Schutzmaßnahmen im Sinne von Artikel 108
    Absatz 3 des EWG-Vertrags zu treffen hinsichtlich der Einfuhr bestimmter zur Mast
    bestimmter Kälber und Jungrinder
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. juni 1974 om fastsættelse af en tidsgrænse
    for Kommissionens beslutning af 8. maj 1974 om bemyndigelse af Den italienske
    Republik til at træffe visse beskyttelsesforanstaltninger i henhold til artikel
    108, stk. 3, EØF-traktaten, for så vidt angår indførsel af visse former for
    kalve og ungkvæg bestemt til opfodring
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 giugno 1974, che fissa una data limite
    per l'applicabilità della decisione della Commissione dell'8 maggio 1974, con
    la quale si autorizza la Repubblica italiana a prendere talune misure di salvaguardia,
    ai sensi dell'articolo 108, paragrafo 3, del trattato CEE, per quanto concerne
    l'importazione di vitelli e giovani bovini destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 juni 1974 tot vaststelling van de datum
    waarop de geldigheidsduur afloopt van de beschikking van de Commissie van 8 mei
    1974, waarbij de Italiaanse Republiek wordt gemachtigd overeenkomstig artikel
    108, lid 3, van het E.E.G.-Verdrag bepaalde vrijwaringsmaatregelen te treffen
    ten aanzien van de invoer van bepaalde soorten mestkalveren en jonge mestrunderen
  type: main
