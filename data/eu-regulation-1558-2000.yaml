    aan de telers te betalen minimumprijs en van het bedrag van de productiesteun
    voor gedroogde vijgen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1558/2000 da Comissão, de 17 de Julho de 2000, que
    fixa, para a campanha de comercialização de 2000/2001, o preço mínimo a pagar
    aos produtores de figos secos não transformados, bem como o montante da ajuda
    à produção para os figos secos
  type: main
- language: es
  script: Latn
