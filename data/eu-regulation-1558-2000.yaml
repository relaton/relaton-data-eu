title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1558/2000 of 17 July 2000 fixing for the
    2000/01 marketing year the minimum price to be paid to producers for unprocessed
    dried figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1558/2000 de la Commission du 17 juillet 2000 fixant,
    pour la campagne 2000/2001, le prix minimal à payer aux producteurs pour les
    figues sèches non transformées ainsi que le montant de l'aide à la production
    pour les figues sèches
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1558/2000 der Kommission vom 17. Juli 2000 zur Festsetzung
    des den Erzeugern für unverarbeitete getrocknete Feigen zu zahlenden Mindestpreises
    und der Produktionsbeihilfe für getrocknete Feigen für das Wirtschaftsjahr 2000/01
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1558/2000 af 17. juli 2000 om fastsættelse
    for produktionsåret 2000/2001 af den minimumspris, der skal betales producenterne
    for tørrede uforarbejdede figner, samt produktionsstøtten for tørrede figner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1558/2000 της Επιτροπής,
    της 17ης Ιουλίου 2000, για τον καθορισμό, για την
    περίοδο 2000/01, της ελάχιστης τιμής που καταβάλλεται
    στους παραγωγούς και της τιμης αγοράς εκ μέρους
    των οργανισμών αποθεματοποίησης για τα μη
    μεταποιημένα ξηρά σύκα, και για το ποσό της
    ενίσχυσης στην παραγωγή ξηρών σύκων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1558/2000, annettu 17 päivänä heinäkuuta
    2000, jalostamattomien kuivattujen viikunoiden tuottajille maksettavan vähimmäishinnan
    sekä kuivattujen viikunoiden tuotantotuen määrän vahvistamisesta markkinointivuodeksi
    2000/2001
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1558/2000 della Commissione, del 17 luglio 2000, che
    fissa, per la campagna di commercializzazione 2000/2001, il prezzo minimo da pagare
    ai produttori per i fichi secchi non trasformati e l'importo dell'aiuto alla produzione
    per i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1558/2000 van de Commissie van 17 juli 2000 tot vaststelling,
