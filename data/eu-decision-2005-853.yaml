title:
- language: en
  script: Latn
  content: '2005/853/EC: Commission Decision of 30 November 2005 authorising France
    to prohibit the marketing to the end user, with a view to seeding or planting
    in certain regions of France, of reproductive material of Pinus pinaster Ait.
    of Iberian Peninsula origin, which is unsuitable for use in such territories under
    Council Directive 1999/105/EC (notified under document number C(2005) 4534)'
  type: main
- language: fr
  script: Latn
  content: '2005/853/CE: Décision de la Commission du 30 novembre 2005 autorisant
    la France à interdire la commercialisation à l''utilisateur final, à des fins
    d''ensemencement ou de plantation dans certaines régions françaises, des matériels
    de reproduction du Pinus pinaster Ait. originaires de la péninsule Ibérique,
    dont l''utilisation n''est pas adaptée à ces territoires, en application de
    la directive 1999/105/CE du Conseil [notifiée sous le numéro C(2005) 4534]'
  type: main
- language: de
  script: Latn
  content: '2005/853/EG: Entscheidung der Kommission vom 30. November 2005 zur Ermächtigung
    Frankreichs, die Abgabe von Vermehrungsgut von Pinus pinaster Ait. mit Ursprung
    auf der Iberischen Halbinsel an den Endverbraucher zwecks Aussaat oder Anpflanzung
    in bestimmten französischen Gebieten, für die es nicht geeignet ist, gemäß
    der Richtlinie 1999/105/EG des Rates zu untersagen (Bekannt gegeben unter Aktenzeichen
    K(2005) 4534)'
  type: main
- language: cs
  script: Latn
  content: '2005/853/ES: Rozhodnutí Komise ze dne 30. listopadu 2005 , kterým se
    Francie opravňuje zakázat prodej reprodukčního materiálu borovice přímořské
    ( Pinus pinaster Ait.) původem z Iberského poloostrova konečnému spotřebiteli
    pro účely výsevu nebo výsadby v určitých oblastech Francie, v nichž jeho
    použití není podle směrnice Rady 1999/105/ES vhodné (oznámeno pod číslem
    K(2005) 4534)'
  type: main
- language: da
  script: Latn
