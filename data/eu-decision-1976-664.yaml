---
id: EUDecision1976664
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 31 May 1976 authorizing the Italian Republic not
    to apply Community treatment to certain under garments, knitted or crocheted,
    not elastic or rubberized, of synthetic textile fibres, falling within subheading
    60.04 ex B of the Common Customs Tariff, originating in the Republic of Korea
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/664/CEE: Décision de la Commission, du 31 mai 1976, autorisant la
    République italienne à exclure du traitement communautaire certains sous-vêtements
    de bonneterie non élastique ni caoutchoutée, de fibres textiles synthétiques,
    de la position 60.04 Ex B du Tarif douanier commun, originaires de la République
    de Corée et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 31. Mai 1976, mit der die Italienische
    Republik ermächtigt wird, bestimmte aus der Republik Korea stammende und in den
    anderen Mitgliedstaaten im freien Verkehr befindliche Unterkleidung aus Gewirken,
    weder gummielastisch noch kautschutiert, der Tarifstelle 60.04 ex B des Gemeinsamen
    Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 31. maj 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage visse underbeklædningsgenstande
    af trikotage, ikke elastisk eller gummeret, af kemofibre, som henhører under
    pos. 60.04 ex B i den fælles toldtarif, har oprindelse i republikken Korea og
    frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 31 maggio 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario talune sottovesti a maglia non
    elastica né gommata di fibre tessili sintetiche della sottovoce 60.04 ex B della
    tariffa doganale comune, originarie della Repubblica di Corea e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 31 mei 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd bepaalde onderkleding van niet-elastisch of niet-gegummeerd brei-
    of haakwerk, van synthetische textielvezels, van post 60.04 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit de Republiek Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
