    von Rindfleisch, ausgenommen gefrorenes Rindfleisch
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 89/72 della Commissione, del 13 gennaio 1972, che
    fissa i prelievi all'importazione di vitelli e di bovini adulti nonché di carni
    bovine diverse da quelle congelate
  type: main
- language: nl
