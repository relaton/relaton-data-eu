---
id: EURegulation12412002
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1241/2002 of 10 July 2002 supplementing the
    Annex to Regulation (EC) No 2400/96 on the entry of certain names in the "Register
    of protected designations of origin and protected geographical indications" provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs (Gailtaler
    Speck, Morbier, Queso Palmero or Queso de la Palma, Thrapsano extra virgin olive
    oil, Turrón de Agramunt or Torró d'Agramunt)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1241/2002 de la Commission du 10 juillet 2002 complétant
    l'annexe du règlement (CE) n° 2400/96 relatif à l'inscription de certaines
    dénominations dans le registre des appellations d'origine protégées et des
    indications géographiques protégées prévu au règlement (CEE) n° 2081/92
    du Conseil relatif à la protection des indications géographiques et des appellations
    d'origine des produits agricoles et des denrées alimentaires (Gailtaler Speck,
    Morbier, Queso Palmero ou Queso de la Palma, huile d'olive extra vierge Thrapsano,
    Turrón de Agramunt ou Torró d'Agramunt)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1241/2002 der Kommission vom 10. Juli 2002 zur Ergänzung
    des Anhangs der Verordnung (EG) Nr. 2400/96 zur Eintragung bestimmter Bezeichnungen
    in das Verzeichnis der geschützten Ursprungsbezeichnungen und der geschützten
    geografischen Angaben für Agrarerzeugnisse und Lebensmittel gemäß Verordnung
    (EWG) Nr. 2081/92 des Rates zum Schutz von geografischen Angaben und Ursprungsbezeichnungen
    für Agrarerzeugnisse und Lebensmittel (Gailtaler Speck, Morbier, Queso Palmero
    oder Queso de la Palma, Natives Olivenöl extra Thrapsano, Turrón de Agramunt
    oder Torró d'Agramunt)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1241/2002 на Комисията от 10
    юли 2002 година за допълване на приложението
    към Регламент (ЕО) № 2400/96 относно вписването
    на някои означения в Регистъра на защитените
    наименования за произход и защитените географски
    указания, предвиден в Регламент (ЕИО) № 2081/92
    на Съвета за защита на географските указания
    и наименованията за произход на селскостопанските
    и хранителни продукти (Gailtaler Speck, Morbier, Queso Palmero
    или Queso de la Palma, маслиново масло екстра върджин
    Thrapsano, Turrón de Agramunt или Torró d'Agramunt)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1241/2002 ze dne 10. července 2002, kterým
    se doplňuje příloha nařízení (ES) č. 2400/96 o zápisu určitých názvů
    do „Rejstříku chráněných označení původu a chráněných zeměpisných
    označení“ podle nařízení Rady (EHS) č. 2081/92 o ochraně zeměpisných
    označení a označení původu zemědělských produktů a potravin (Gailtaler
    Speck, Morbier, Queso Palmero nebo Queso de la Palma, extra panenský olivový
    olej Thrapsano, Turrón de Agramunt nebo Torró d'Agramunt)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1241/2002 af 10. juli 2002 om tilføjelse
    til bilaget til forordning (EF) nr. 2400/96 om optagelse af visse betegnelser
    i det register over beskyttede oprindelsesbetegnelser og beskyttede geografiske
    betegnelser, der er fastsat i Rådets forordning (EØF) nr. 2081/92 om beskyttelse
    af geografiske betegnelser og oprindelsesbetegnelser for landbrugsprodukter og
    levnedsmidler (Gailtaler Speck, Morbier, Queso Palmero eller Queso de la Palma,
    Jomfruolie Thrapsano, Turrón de Agramunt eller Torró d'Agramunt)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1241/2002 της Επιτροπής,
    της 10ης Ιουλίου 2002, για τη συμπλήρωση του παραρτήματος
    του κανονισμού (ΕΚ) αριθ. 2400/96 σχετικά με την
    εγγραφή ορισμένων ονομασιών στο "Μητρώο προστατευόμενων
    ονομασιών προέλευσης και προστατευόμενων
    γεωγραφικών ενδείξεων" που προβλέπεται στον
    κανονισμό (ΕΟΚ) αριθ. 2081/92 του Συμβουλίου περί
    προστασίας των γεωγραφικών ενδείξεων και των
    ονομασιών προέλευσης των γεωργικών προϊόντων
    και των τροφίμων (Gailtaler Speck, Morbier, Queso Palmero ή Queso
    de la Palma, Εξαιρετικό παρθένο ελαιόλαδο Θραπσανό,
    Turrón de Agramunt ή Torró d'Agramunt)
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1241/2002, 10. juuli 2002, millega täiendatakse
    määruse (EÜ) nr 2400/96 (teatavate nimede kandmise kohta kaitstud päritolunimetuste
    ja geograafiliste tähiste registrisse, mis on ette nähtud nõukogu määrusega
    (EMÜ) nr 2081/92 põllumajandustoodete ja toiduainete geograafiliste tähiste
    ning päritolunimetuste kaitse kohta) lisa (Gailtaler Speck, Morbier, Queso Palmero
    või Queso de la Palma, Thrapsano ekstra neitsioliiviõli, Turrón de Agramunt
    või Torró d’Agramunt)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1241/2002, annettu 10 päivänä heinäkuuta
    2002, tiettyjen nimitysten kirjaamisesta maataloustuotteiden ja elintarvikkeiden
    maantieteellisten merkintöjen ja alkuperänimitysten suojasta annetussa neuvoston
    asetuksessa (ETY) N:o 2081/92 säädettyyn "Suojattujen alkuperänimitysten ja
    suojattujen maantieteellisten merkintöjen rekisteriin" annetun asetuksen (EY)
    N:o 2400/96 liitteen täydentämisestä (Gailtaler Speck, Morbier, Queso Palmero
    tai Queso de la Palma, Thrapsanon ekstra-neitsytoliiviöljy, Turrón de Agramunt
    tai Torró d'Agramunt)
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1241/2002 od 10. srpnja 2002. o dopuni Priloga
    Uredbi (EZ) br. 2400/96 o upisu određenih naziva u Registar zaštićenih oznaka
    izvornosti i zaštićenih oznaka zemljopisnog podrijetla kako je predviđeno u
    Uredbi Vijeća (EEZ) br. 2081/92 o zaštiti oznaka zemljopisnog podrijetla i oznaka
    izvornosti za poljoprivredne i prehrambene proizvode (Gailtaler Speck, Morbier,
    Queso Palmero ili Queso de la Palma, ekstra djevičansko maslinovo ulje Thrapsano,
    Turrón de Agramunt ili Torró d’Agramunt)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1241/2002/EK rendelete (2002. július 10.) az egyes elnevezéseknek
    a mezőgazdasági termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben előírt „Oltalom alatt
    álló eredetmegjelölések és földrajzi jelzések nyilvántartása” elnevezésű
    nyilvántartásba való bejegyzéséről szóló 2400/96/EK rendelet mellékletének
    kiegészítéséről (Gailtaler Speck, Morbier, Queso Palmero vagy Queso de la
    Palma, Thrapsano extra szűz olívaolaj, Turrón de Agramunt vagy Torró d’Agramunt)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1241/2002 della Commissione, del 10 luglio 2002, che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel "Registro delle denominazioni di origine protette e delle
    indicazioni geografiche protette" di cui al regolamento (CEE) n. 2081/92 del Consiglio
    relativo alla protezione delle indicazioni geografiche e delle denominazioni di
    origine dei prodotti agricoli e alimentari (Gailtaler Speck, Morbier, Queso Palmero
    o Queso de la Palma, Olio d'oliva extra vergine Thrapsano, Turrón de Agramunt
    o Torró d'Agramunt)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1241/2002 (2002. gada 10. jūlijs), ar kuru papildina
    pielikumu Regulai (EK) Nr. 2400/96 par konkrētu nosaukumu iekļaušanu “Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā”,
    kas paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu aizsardzību
    (Gailtaler Speck, Morbier, Queso Palmero vai Queso de la Palma, neapstrādāta
    augstākā labuma olīveļļa Thrapsano, Turrón de Agramunt vai Torró d’Agramunt)
  type: main
- language: lt
  script: Latn
  content: 2002 m. liepos 10 d. Komisijos reglamentas (EB) Nr. 1241/2002, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įtraukimo į Tarybos
    reglamente (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų
    geografinių nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų
    kilmės vietos nuorodų ir saugomų geografinių nuorodų registrą“ priedą
    (Gailtaler Speck, Morbier, Queso Palmero arba Queso de la Palma, Thrapsano extra
    virgin olive oil, Turrón de Agramunt arba Torró d’Agramunt)
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kumissjoni (KE) Nru 1241/2002 ta’ l-10 ta’ Lulju
    2002 li jissupplimenta l-Anness mar-Regolament (KE) Nru 2400/96 dwar id-dħul
    ta’ ċerti ismijiet fir-“Reġistru tad-denominazzjonijiet protetti ta’ l-oriġini
    u l-indikazzjonijiet ġeografiċi protetti” pprovdut fir-Regolament tal-Kunsill
    (KEE) Nru 2081/92 dwar il-protezzjoni ta’ l-indikazzjonijiet ġeografiċi u
    d-denominazzjonijiet ta’ l-oriġini għall-prodotti agrikoli u l-ikel (il-Gailtaler
    Speck, il-Morbier, il-Queso Palmero jew Queso de la Palma, iż-żejt taż-żebbuġa
    extra-verġini Thrapsano, it-Turrón de Agramunt jew Torró d'Agramunt)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1241/2002 van de Commissie van 10 juli 2002 tot aanvulling
    van de bĳlage bĳ Verordening (EG) nr. 2400/96 betreffende de inschrĳving van
    bepaalde benamingen in het "Register van beschermde oorsprongsbenamingen en beschermde
    geografische aanduidingen" bedoeld in Verordening (EEG) nr. 2081/92 van de Raad
    inzake de bescherming van geografische aanduidingen en oorsprongsbenamingen van
    landbouwproducten en levensmiddelen (Gailtaler Speck, Morbier, Queso Palmero of
    Queso de la Palma, Exeretiko partheno eleolado Thrapsano, Turrón de Agramunt
    of Torró d'Agramunt)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1241/2002 z dnia 10 lipca 2002 r. uzupełniające
    Załącznik do rozporządzenia (WE) nr 2400/96 w sprawie wprowadzenia niektórych
    nazw do „rejestru chronionych nazw pochodzenia oraz chronionych oznaczeń geograficznych”
    określonych w rozporządzeniu Rady (EWG) nr 2081/92 w sprawie ochrony oznaczeń
    geograficznych i nazw pochodzenia produktów rolnych i środków spożywczych
    (Gailtaler Speck, Morbier, Queso Palmero lub Queso de la Palma, oliwa z oliwek
    pierwszego tłoczenia Thrapsano extra, Turrón de Agramunt lub Torró d’Agramunt)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1241/2002 da Comissão, de 10 de Julho de 2002, que
    completa o anexo do Regulamento (CE) n.° 2400/96 relativo à inscrição de determinadas
    denominações no registo das denominações de origem protegidas e das indicações
    geográficas protegidas previsto no Regulamento (CEE) n.° 2081/92 do Conselho
    relativo à protecção das indicações geográficas e denominações de origem
    dos produtos agrícolas e dos géneros alimentícios (Gailtaler Speck, Morbier,
    Queso Palmero ou Queso de la Palma, Azeite virgem extra Thrapsano, Turrón de
    Agramunt ou Torró d'Agramunt)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1241/2002 al Comisiei din 10 iulie 2002 de completare
    a anexei la Regulamentul (CE) nr. 2400/96 privind înscrierea anumitor denumiri
    în „Registrul denumirilor de origine protejate și al indicațiilor geografice
    protejate” prevăzut în Regulamentul (CEE) nr. 2081/92 al Consiliului privind
    protejarea indicațiilor geografice și a denumirilor de origine protejate ale
    produselor agricole și alimentare (Gailtaler Speck, Morbier, Queso Palmero sau
    Queso de la Palma, ulei de măsline extra virgin Thrapsano, Turrón de Agramunt
    sau Torró d'Agramunt)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1241/2002 z 10. júla 2002, ktorým sa dopĺňa
    príloha k nariadeniu (ES) č. 2400/96 o zápise určitých názvov do „Registra
    chránených označení pôvodu a chránených zemepisných označení“ ustanovených
    v nariadení Rady (EHS) č. 2081/92 o ochrane zemepisných označení a označení
    pôvodu pre poľnohospodárske výrobky a potraviny (Gailtaler Speck, Morbier,
    Queso Palmero alebo Queso de la Palma, extra panenský olivový olej Thrapsano,
    Turrón de Agramunt alebo Torró d’Agramunt)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1241/2002 z dne 10. julija 2002 o dopolnitvi
    Priloge k Uredbi (ES) št. 2400/96 o vnosu določenih imen v „Register zaščitenih
    označb porekla in zaščitenih geografskih oznak“, določen v Uredbi Sveta
    (EGS) št. 2081/92 o zaščiti geografskih oznak in označb porekla za kmetijske
    pridelke in živila (Gailtaler Speck, Morbier, Queso Palmero ali Queso de la Palma,
    ekstra deviško oljčno olje Thrapsano, Turrón de Agramunt ali Torró d’Agramunt)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1241/2002 de la Comisión, de 10 de julio de 2002,
    que completa el anexo del Reglamento (CE) n° 2400/96 relativo a la inscripción
    de determinadas denominaciones en el Registro de Denominaciones de Origen Protegidas
    y de Indicaciones Geográficas Protegidas establecido en el Reglamento (CEE) n°
    2081/92 del Consejo, relativo a la protección de las indicaciones geográficas
    y de las denominaciones de origen de los productos agrícolas y alimenticios (Gailtaler
    Speck, Morbier, Queso Palmero o Queso de la Palma, Aceite de oliva virgen extra
    Thrapsano, Turrón de Agramunt o Torró d'Agramunt)
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1241/2002 av den 10 juli 2002 om komplettering
    av bilagan till förordning (EG) nr 2400/96 om upptagandet av vissa namn i "Register
    över skyddade ursprungsbeteckningar och skyddade geografiska beteckningar" som
    föreskrivs i rådets förordning (EEG) nr 2081/92 om skydd för geografiska och
    ursprungsbeteckningar för jordbruksprodukter och livsmedel (Gailtaler Speck,
    Morbier, Queso Palmero eller Queso de la Palma, Exeretiko partheno eleolado Thrapsano,
    Turrón de Agramunt eller Torró d'Agramunt)
