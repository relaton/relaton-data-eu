    indførsel af varer henhørende under forordning (EØF) nr. 1059/69 for perioden
    1. november 1977 til og med 31. januar 1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2389/77 della Commissione, del 20 ottobre 1977, che
