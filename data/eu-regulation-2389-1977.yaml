    i dazi addizionali applicabili all'importazione, per il periodo dal 1 novembre
    1977 al 31 gennaio 1978 incluso, delle merci cui si applica il regolamento (CEE)
    n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2389/77 van de Commissie van 20 oktober 1977 tot
