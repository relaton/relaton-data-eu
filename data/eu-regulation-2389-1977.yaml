  content: Commission Regulation (EEC) No 2389/77 of 20 October 1977 determining the
    amounts of the variable components, compensatory amounts and additional duties
    applicable from 1 November 1977 to 31 January 1978 inclusive, on the importation
    of goods covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2389/77 de la Commission, du 20 octobre 1977, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant la période du 1er novembre 1977
    au 31 janvier 1978 inclus, à l'importation des marchandises relevant du règlement
    (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2389/77 der Kommission vom 20. Oktober 1977 zur Festsetzung
    der Höhe der vom 1. November 1977 bis einschließlich 31. Januar 1978 unter die
    Verordnung (EWG) Nr. 1059/69 fallenden Waren anzuwendenden beweglichen Teilbeträge,
    Ausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2389/77 af 20. oktober 1977 om fastsættelse
