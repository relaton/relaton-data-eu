title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1721/96 of 30 August 1996 determining to
    what extent applications for import rights for calves not exceeding 80 kilograms
    lodged pursuant to Regulation (EC) No 1462/96 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1721/96 DE LA COMMISSION du 30 août 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits à l'importation
    déposées au titre du règlement (CE) n° 1462/96 relatif à l'importation de
    veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1721/96 DER KOMMISSION vom 30. August 1996 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte von höchstens 80 kg wiegenden
    Rindern gemäß der Verordnung (EG) Nr. 1462/96 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1721/96 af 30. august 1996 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importrettigheder for
    kalve på ikke over 80 kg i henhold til forordning (EF) nr. 1462/96 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1721/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 30ής Αυγούστου 1996 για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως δικαιωμάτων εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΚ) αριθ. 1462/96 για την
    εισαγωγή μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1721/96, annettu 30 päivänä elokuuta 1996,
    asetuksen (EY) N:o 1462/96 mukaisesti jätettyjen enintään 80 kilogramman painoisia
    vasikoita koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1721/96 DELLA COMMISSIONE del 30 agosto 1996 che stabilisce
    in che misura possono essere accolte le domande di diritti di importazione presentate
    nel quadro del regolamento (CE) n. 1462/96 per l'importazione di vitelli di peso
    non superiore a 80 chilogrammi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1721/96 VAN DE COMMISSIE van 30 augustus 1996 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    rechten tot invoer die zijn ingediend op grond van Verordening (EG) nr. 1462/96
    betreffende de invoer van kalveren van maximaal 80 kg
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1721/96 DA COMISSÃO de 30 de Agosto de 1996 que determina
    em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) nº 1462/96 relativo à importação
    de vitelos de peso não superior a 80 quilogramas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 1721/96 DE LA COMISIÓN de 30 de agosto de 1996 por
    el que se determina en qué medida se podrá dar curso a las solicitudes de derechos
    de importación presentadas con arreglo al Reglamento (CE) n° 1462/96 relativo
    a las importaciones de terneros cuyo peso no exceda de 80 kilogramos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1721/96 av den 30 augusti 1996 om fastställande
    av i vilken utsträckning ansökningar om importrättigheter som lämnats in i
    enlighet med förordning (EG) nr 1462/96 angående import av kalvar som väger
    högst 80 kg kan godkännas
  type: main
