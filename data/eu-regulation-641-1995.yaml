- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 641/95 of 24 March 1995 determining the extent
    to which applications lodged in March 1995 for import licences for certain poultrymeat
    products under the regime provided for in Council Regulation (EC) No 774/94 opening
    and providing for the administration of certain Community tariff quotas for poultrymeat
    and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 641/95 DE LA COMMISSION du 24 mars 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    mars 1995 pour certains produits à base de viande de volaille peuvent être acceptées
    dans le cadre du régime prévu par le règlement (CE) n° 774/94 du Conseil portant
    ouverture et mode de gestion de certains contingents tarifaires communautaires
    pour la viande de volaille et certains autres produits agricoles
  type: main
