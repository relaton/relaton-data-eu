  script: Latn
  content: Commission Regulation (EC) No 1403/2002 of 31 July 2002 determining the
    extent to which applications for import licences lodged in respect of subquota
    II for frozen meat of bovine animals, provided for in Regulation (EC) No 954/2002,
    can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1403/2002 de la Commission du 31 juillet 2002 déterminant
