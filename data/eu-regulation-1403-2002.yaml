    Verordnung (EG) Nr. 954/2002 vorgesehene Unterkontingent II für gefrorenes Rindfleisch
    stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1403/2002 af 31. juli 2002 om fastsættelse
    af, i hvilket omfang ansøgningerne om importlicenser for frosset oksekød under
    delkontingent II som fastsat i forordning (EF) nr. 954/2002 kan imødekommes
  type: main
- language: el
  script: Grek
