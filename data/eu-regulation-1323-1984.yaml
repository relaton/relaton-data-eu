title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1323/84 of 11 May 1984 re-establishing the
    levying of customs duties on chromium oxides and hydroxides, falling within heading
    No 28.21 and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1323/84 de la Commission du 11 mai 1984 portant rétablissement
    de la perception des droits de douane applicables aux oxydes et hydroxydes de
    chrome, de la position 28.21 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1323/84 der Kommission vom 11. Mai 1984 zur Wiedereinführung
    der Erhebung der Zölle für Chromoxide und -hydroxide der Tarifnummer 28.21 mit
    Ursprung in China, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1323/84 af 11. maj 1984 om genindførelse
    af opkrævning af told for oxider og hydroxider af chrom, henhørende under pos.
    28.21 og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1323/84 της Επιτροπής
    της 11ης Μαΐου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για οξείδια και υδροξείδια
    χρωμίου της κλάσεως 28.21 του Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1323/84 della Commissione dell' 11 maggio 1984 che
    ripristina la riscossione dei dazi doganali applicabili agli ossidi e idrossidi
    di cromo della voce 28.21 della tariffa doganale comune, originari della Cina
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1323/84 van de Commissie van 11 mei 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op chroomoxyden
    en chroomhydroxyden van tariefpost 28.21, van oorsprong uit China, waarvoor de
    in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn
    verleend
