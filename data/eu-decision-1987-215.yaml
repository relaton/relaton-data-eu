type: standard
title:
- language: en
  script: Latn
  content: '87/215/EEC: Commission Decision, of 23 March 1987, accepting a price undertaking
    in connection with the anti-dumping proceeding concerning imports of standardized
    multi-phase electric motors having an output of more than 0,75 kW but not more
    than 75 kW, originating in Romania'
  type: main
- language: fr
  script: Latn
  content: '87/215/CEE: Décision de la Commission, du 23 mars 1987, portant acceptation
    d''un engagement de prix offert dans le cadre de la procédure antidumping concernant
    les importations de moteurs électriques polyphasés normalisés d''une puissance
    de plus de 0,75 à 75 kilowatts inclus, originaires de Roumanie'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 23. Maerz 1987 ueber die Annahme einer Preisverpflichtung
    im Rahmen des Antidumping-Verfahrens betreffend die Einfuhren von standardisierten
    Mehrphasen-Wechselstrommotoren mit einer Leistung von 0,7 bis 75 kW mit Ursprung
    in Rumaenien (87/215/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE, af 23. marts 1987, om godtagelse af et pristilsagn
    afgivet i forbindelse med antidumpingproceduren vedroerende importen af standardiserede
    elektriske motorer, flerfasede, med effekt paa over 0,75 kW, men hoejst 75 kW,
    med oprindelse i Rumaenien, (87/215/EOEF)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 23ης Μαρτίου 1987
    για την αποδοχή ανάληψης υποχρέωσης όσον αφορά
    τις τιμές, που προτάθηκε στα πλαίσια της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές τυποποιημένων
    πολυφασικών ηλεκτρικών κινητήρων, ισχύος περισσότερο
    από 0,75 έως και 75 kilowatts, καταγωγής Ρουμανίας
    ( 87/215/ΕΟΚ )
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE, del 23 marzo 1987, che accetta gli impegni
    assunti nell'ambito della procedura antidumping relativa alle importazioni di
    motori elettrici polifase normalizzati di potenza superiore a 0,75 Kw e inferiore
    o pari a 75 Kw, originari della Romania, (87/215/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE, van 23 maart 1987, houdende aanvaarding van een
    prijsverbintenis in het kader van de anti-dumpingprocedure betreffende de invoer
    van gestandaardiseerde meerfasige elektromotoren met een vermogen van meer dan
    0,75 kW tot en met 75 kW, van oorsprong uit Roemenië, (87/215/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO, de 23 de Março de 1987, que aceita um compromisso
    de preços oferecido no âmbito do processo anti-dumping relativo às importaçoes
    de motores eléctricos polifasicos normalizados com uma potência de mais de 0,75
    até 75 kW inclusive, originarios da Roménia, (87/215/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION, de 23 de marzo de 1987, por la que se acepta un
    compromiso de precios ofrecido en el marco del procedimiento antidumping relativo
    a las importaciones de motores eléctricos polifasicos normalizados con una potencia
    superior a 0,75 hasta 75 kilovatios inclusive, originarios de Rumania, (87/215/CEE)
  type: main
