title:
- language: en
  script: Latn
  content: Commission Directive 2002/76/EC of 6 September 2002 amending the Annexes
    to Council Directives 86/362/EEC and 90/642/EEC as regards the fixing of maximum
    levels for pesticide residues (metsulfuron methyl) in and on cereals and certain
    products of plant origin, including fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2002/76/CE de la Commission du 6 septembre 2002 modifiant les
    annexes des directives 86/362/CEE et 90/642/CEE du Conseil concernant la fixation
    de teneurs maximales pour les résidus de pesticides (metsulfuron méthyle) respectivement
    sur et dans les céréales et certains produits d'origine végétale, y compris
    les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/76/EG der Kommission vom 6. September 2002 zur Änderung
    der Anhänge der Richtlinien 86/362/EWG und 90/642/EWG des Rates hinsichtlich
    der Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    (Metsulfuron-methyl) auf und in Getreide und bestimmten Erzeugnissen pflanzlichen
    Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/76/ЕО на Комисията от 6 септември
    2002 година за изменение на приложенията към
    Директиви 86/362/ЕИО и 90/642/ЕИО на Съвета относно
    определянето на максималните количества на
    остатъците от пестициди (метсулфурон метил)
    във и върху зърнени култури и определени продукти
    от растителен произход, включително плодове
    и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/76/ES ze dne 6. září 2002, kterou se mění přílohy
    směrnic Rady 86/362/EHS a 90/642/EHS, pokud jde o stanovení maximálních limitů
    reziduí pesticidů (metsulfuron-methylu) v obilovinách a v některých produktech
    rostlinného původu, včetně ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2002/76/EF af 6. september 2002 om ændring af bilagene
    til Rådets direktiv 86/362/EØF og 90/642/EØF om fastsættelse af maksimalgrænseværdier
    for indholdet af pesticidrester (metsulfuron-methyl) i og på korn og visse produkter
    af vegetabilsk oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2002/76/ΕΚ της Επιτροπής, της 6ης Σεπτεμβρίου
    2002, περί τροποποίησης των παραρτημάτων των
    οδηγιών 86/362/ΕΟΚ και 90/642/ΕΟΚ του Συμβουλίου
    όσον αφορά τον καθορισμό των ανωτάτων ορίων
    για τα υπολείμματα φυτοφαρμάκων (metsulfuron methyl)
    πάνω και μέσα στα σιτηρά και σε ορισμένα προϊόντα
    φυτικής προέλευσης, συμπεριλαμβανομένων των
    οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2002/76/EÜ, 6. september 2002, millega muudetakse
    direktiivide 86/362/EMÜ ja 90/642/EMÜ lisasid teraviljas ja teatavates taimsetes
    saadustes, kaasa arvatud puu- ja köögiviljas sisalduvate ja nende pinnal esinevate
    pestitsiidide jääkide (metüülmetsulfuroon) piirnormide kehtestamise osas
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2002/76/EY, annettu 6 päivänä syyskuuta 2002, neuvoston
    direktiivien 86/362/ETY ja 90/642/ETY liitteiden muuttamisesta viljoissa ja niiden
    pinnassa sekä tietyissä kasvikunnasta peräisin olevissa tuotteissa, mukaan
    luettuina hedelmät ja vihannekset, ja niiden pinnassa olevien torjunta-ainejäämien
    (metsulfuroni-metyylin) enimmäismäärien vahvistamisen osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2002/76/EK irányelve (2002. szeptember 6.) a gabonafélékben,
    illetőleg az egyes növényi eredetű termékekben – többek között a gyümölcsökben
    és zöldségekben –, illetve azok felületén található (metszulfuron-metil)
    peszticid-szermaradványok megengedett legmagasabb mértékének meghatározására
    tekintettel a 86/362/EGK, illetőleg 90/642/EGK irányelv mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2002/76/CE della Commissione, del 6 settembre 2002, recante modifica
    degli allegati delle direttive 86/362/CEE e 90/642/CEE del Consiglio, che fissano
    le quantità massime di residui di antiparassitari (metsulfuron metile) rispettivamente
    sui e nei cereali e su e in alcuni prodotti di origine vegetale, compresi gli
    ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2002/76/EK (2002. gada 6. septembris), ar ko groza
    pielikumus Padomes Direktīvām 86/362/EEK un 90/642/EEK par pesticīdu atliekvielu
    (metsulfuronmetila) maksimāli pieļaujamo daudzumu noteikšanu labībā un uz
    tās, kā arī dažos augu izcelsmes produktos, tajā skaitā augļos un dārzeņos,
    un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. rugsėjo 6 d. Komisijos direktyva 2002/76/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB ir 90/642/EEB dėl didžiausių pesticidų likučių
    (metilmetsulfurono) koncentracijų grūduose ir tam tikruose augalinės kilmės
    produktuose, įskaitant vaisius ir daržoves, bei ant jų nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/76/KE tas-6 ta’ Settembru 2002 li temenda
    l-Annessi għad-Direttivi tal-Kunsill 86/362/KEE u 90/642/KEE rigward it-tfassil
    ta’ livelli massimi ta' fdalijiet ta’ pestiċidi (metsulfuron metil) fi u
    fuq ċereali u ċerti prodotti ta’ oriġini veġetali, inklużi frott u ħxejjexTest
    b’relevanza taż-ŻEE
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/76/EG van de Commissie van 6 september 2002 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 86/362/EEG en 90/642/EEG van de Raad tot vaststelling
    van maximumgehalten aan residuen van bestrĳdingsmiddelen (metsulfuron-methyl)
    in en op granen en bepaalde producten van plantaardige oorsprong, met inbegrip
    van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2002/76/WE z dnia 6 września 2002 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG i 90/642/EWG w zakresie ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów (metsulfuronu metylowego) w zbożach oraz
    niektórych produktach pochodzenia roślinnego, w tym owocach i warzywach, oraz
    na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/76/CE da Comissão, de 6 de Setembro de 2002, que altera
    os anexos das Directivas 86/362/CEE e 90/642/CEE do Conselho no respeitante à
    fixação de teores máximos de resíduos do pesticida metsulfurão-metilo à
    superfície e no interior dos cereais e de determinados produtos de origem vegetal,
    incluindo frutas e produtos hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/76/CE a Comisiei din 6 septembrie 2002 de modificare a anexelor
    la Directivele 86/362/CEE și 90/642/CEE ale Consiliului privind stabilirea conținuturilor
    maxime pentru reziduurile de pesticide (metil metsulfuron) de pe și din cereale
    și anumite produse de origine vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2002/76/ES zo 6. septembra 2002, ktorá mení a dopĺňa
    prílohy smernice Rady 86/362/EHS a 90/642/EHS, pokiaľ ide o stanovenie maximálnych
    úrovní rezíduí pesticídov (metylsulfuron metylu) v a na obilí a určitých
    produktoch rastlinného pôvodu, vrátane ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/76/ES z dne 6. septembra 2002 o spremembi prilog
    k direktivama Sveta 86/362/EGS in 90/642/EGS o določitvi najvišjih dovoljenih
    vrednosti ostankov pesticidov (metsulfuron metil) v in na žitih ter določenih
    proizvodih rastlinskega izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/76/CE de la Comisión, de 6 de septiembre de 2002, por la
    que se modifican los anexos de las Directivas 86/362/CEE y 90/642/CEE del Consejo,
    relativas a la fijación de los contenidos máximos de residuos de plaguicidas
    (metsulfurón metilo) sobre y en los cereales, y en determinados productos de
    origen vegetal, incluidas las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/76/EG av den 6 september 2002 om ändring av
    bilagorna till rådets direktiv 86/362/EEG och 90/642/EEG beträffande fastställande
    av gränsvärden för bekämpningsmedelsrester (metsulfuron-metyl) i och på spannmål
    och vissa produkter av vegetabiliskt ursprung, inklusive frukt och grönsaker
  type: main
