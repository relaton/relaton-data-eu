- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/535 of 31 March 2021 laying
    down rules for the application of Regulation (EU) 2019/2144 of the European Parliament
    and of the Council as regards uniform procedures and technical specifications
    for the type-approval of vehicles, and of systems, components and separate technical
    units intended for such vehicles, as regards their general construction characteristics
    and safety
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/535 de la Commission du 31 mars 2021
    établissant des règles relatives à l’application du règlement (UE) 2019/2144
    du Parlement européen et du Conseil eu égard aux procédures uniformes et aux
    spécifications techniques pour la réception par type des véhicules, ainsi que
    des systèmes, composants et entités techniques distinctes destinés à ces véhicules,
    en ce qui concerne leurs caractéristiques générales de construction et leur
    sécurité
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/535 der Kommission vom 31. März 2021
    mit Durchführungsbestimmungen zur Verordnung (EU) 2019/2144 des Europäischen
    Parlaments und des Rates hinsichtlich einheitlicher Verfahren und technischer
    Spezifikationen für die Typgenehmigung von Fahrzeugen sowie von Systemen, Bauteilen
    und selbstständigen technischen Einheiten für diese Fahrzeuge im Hinblick auf
    ihre allgemeinen Baumerkmale und ihre Sicherheit
  type: main
