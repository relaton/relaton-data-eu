    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή τα εμπορεύματα στην ίδια κατάσταση
    κατά τη διάρκεια του πρώτου εξαμήνου 1992
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3339/91 DELLA COMMISSIONE del 14 novembre 1991 che
