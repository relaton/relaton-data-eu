title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3339/91 of 14 November 1991 laying down
    rates of compensatory interest applicable during the first half of 1992 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements)
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3339/91 DE LA COMMISSION du 14 novembre 1991 fixant
    les taux d'' intérêts compensatoires applicables en cas de naissance d'' une
    dette douanière relative aux produits compensateurs ou aux marchandises en l''
    état (régime du perfectionnement actif) pendant le premier semestre 1992 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3339/91 DER KOMMISSION vom 14. November 1991 mit
    Sätzen von Ausgleichszinsen, die im ersten Halbjahr 1992 bei Entstehung einer
    Zollschuld für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr)
    anzuwenden sind #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3339/91 af 14. november 1991 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukterne eller uforædlede varer (aktiv forædling) i første
    halvår af 1992
  type: main
- language: el
  script: Grek
