    mit verminderter Abschöpfung das Drittländern einzuführen (Nur der portugiesische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/116/EØF: Kommissionens beslutning af 22. februar 1993 om bemyndigelse
