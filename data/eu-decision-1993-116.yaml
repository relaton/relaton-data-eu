  content: '93/116/EEC: Commission Decision of 22 February 1993 authorizing Portugal
    to import from third countries at a reduced levy certain quantities of raw sugar
    during the period 1 January to 30 June 1993 (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/116/CEE: Décision de la Commission, du 22 février 1993, autorisant
    le Portugal à importer des pays tiers à prélèvement réduit certaines quantités
    de sucre brut au titre de la période du 1er janvier au 30 juin 1993 (Le texte
    en langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/116/EWG: Entscheidung der Kommission vom 22. Februar 1993 zur Ermächtigung
