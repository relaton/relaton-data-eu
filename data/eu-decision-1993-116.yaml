    να εισάγει από τρίτες χώρες, με μειωμένη εισφορά,
    ορισμένες ποσότητες ακατέργαστης ζάχαρης
    για την περίοδο από την 1η Ιανουαρίου έως τις
    30 Ιουνίου 1993 (Το κείμενο στην πορτογαλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/116/CEE: Decisione della Commissione, del 22 febbraio 1993, che autorizza
    il Portogallo ad importare dai paesi terzi taluni quantitativi di zucchero greggio
    a prelievo ridotto in conto del periodo dal 1 gennaio al 30 giugno 1993 (Il testo
    in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/116/EEG: Beschikking van de Commissie van 22 februari 1993 houdende
