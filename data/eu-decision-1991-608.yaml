    of importing meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '91/608/CEE: Décision de la Commission du 12 novembre 1991 modifiant la
    décision 86/473/CEE en ce qui concerne la liste des établissements d''Uruguay
    agréés pour l''importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 12. November 1991 zur Änderung der Entscheidung
