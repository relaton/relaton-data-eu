    von Fleischerzeugnissen in die Gemeinschaft zugelassen ist (91/608/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 12. november 1991 om ændring af beslutning
