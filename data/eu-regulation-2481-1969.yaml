title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2481/69 de la Commission, du 11 décembre 1969, fixant
    le coefficient d'adaptation à appliquer au cours des mandarines, satsumas, clémentines,
    tangerines et autres hybrides similaires d'agrumes de catégorie II en vue du
    calcul du prix d'entrée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2481/69 der Kommission vom 11. Dezember 1969 über
    die Festsetzung eines Berichtigungskoeffizienten, der bei der Berechnung des Einfuhrpreises
    auf die Notierungen von Mandarinen, Satsumas, Clementinen, Tangerinen und sonstige
    ähnliche hybride Zitrusfrüchte der Güteklasse II anzuwenden ist
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2481/69 della Commissione, dell'11 dicembre 1969,
    che fissa un coefficiente di adattamento da applicare ai corsi dei mandarini,
    e mandarini satsuma, clementine, tangerine e altri ibridi similari di agrumi di
    categoria II, per il calcolo del prezzo d'entrata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2481/69 van de Commissie van 11 december 1969 houdende
    vaststelling van een aanpassingscoëfficiënt die op de prijzen van mandarijnen,
    satsumas, clementines, tangerines en andere dergelijke kruisingen van citrusvruchten
    van kwaliteitsklasse II moet worden toegepast met het oog op de berekening van
    de invoerprijs
  type: main
