title:
- language: en
  script: Latn
  content: '80/722/EEC: Commission Decision of 13 June 1980 supplementing Decision
    79/833/EEC laying down, for the purposes of the survey on the structure of agricultural
    holdings for 1979/80, the Community outline of a schedule of tables together with
    the standard code and rules for the transcription on to magnetic tape of the data
    contained in these tables'
  type: main
- language: fr
  script: Latn
  content: '80/722/CEE: Décision de la Commission, du 13 juin 1980, complétant la
    décision 79/833/CEE fixant, en vue de l'' enquête sur la structure des exploitations
    agricoles en 1979/1980, le schéma communautaire d'' un programme de tableaux,
    le code uniforme et les modalités d'' application pour la transcription sur bande
    magnétique des données de ces tableaux'
  type: main
- language: de
  script: Latn
  content: '80/722/EWG: Entscheidung der Kommission vom 13. Juni 1980 zur Ergänzung
    der Entscheidung 79/833/EWG zur Festlegung eines nach dem Gemeinschaftsschema
    erstellten Tabellenprogramms, eines einheitlichen Kodes sowie der Durchführungsbestimmungen
    für die Übertragung der Daten aus den genannten Tabellen auf Magnetbänder zum
    Zweck der Durchführung einer Erhebung über die Struktur der landwirtschaftlichen
    Betriebe 1979/1980'
  type: main
- language: da
  script: Latn
  content: '80/722/EØF: Kommissionens beslutning af 13. juni 1980 om supplement til
    beslutning 79/833/EØF om fastsættelse, med henblik på undersøgelsen af landbrugsbedrifternes
    struktur i 1979/80, af fællesskabsmodellen for et tabelprogram, standardkoden
    samt gennemførelsesbestemmelserne for overførsel til magnetbånd af oplysningerne
    i disse tabeller'
  type: main
- language: el
  script: Grek
  content: '80/722/ΕΟΚ: Απόφαση τής Επιτροπής τής 13ης
    Ιουνίου 1980 περί συμπληρώσεως τής αποφάσεως
    79/833/ΕΟΚ γιά τούς σκοπούς τής έρευνας επί τής
    διαρθρώσεως τών γεωργικών εκμεταλλεύσεων
    τού 1979/80, τού κοινοτικού σχεδίου προγράμματος
    πινάκων, τού ενιαίου κώδικος καί τών λεπτομερειών
    εφαρμογής γιά τή μεταγραφή σέ μαγνητική ταινία
    τών στοιχείων πού περιέχονται σ αυτούς τούς
    πίνακες'
  type: main
- language: it
  script: Latn
  content: '80/722/CEE: Decisione della Commissione, del 13 giugno 1980, che completa
    la decisione 79/833/CEE che stabilisce, ai fini dell'' indagine sulla struttura
    delle aziende agricole 1979/1980, lo schema comunitario di un programma di tabelle,
    il codice uniforme e le modalità di applicazione per la trascrizione dei dati
    su nastro magnetico'
  type: main
- language: nl
  script: Latn
  content: '80/722/EEG: Beschikking van de Commissie van 13 juni 1980 tot aanvulling
    van Beschikking 79/833/EEG houdende vaststelling, voor de enquête inzake de structuur
    van de landbouwbedrijven 1979/1980, van het communautaire schema voor een tabellenprogramma
    en de uniforme code en de wijze van toepassing voor het opnemen van de gegevens
    van deze tabellen op magneetbanden'
  type: main
- language: pt
  script: Latn
  content: '80/722/CEE: Decisão da Comissão, de 13 de Junho de 1980, que completa
    a Decisão 79/833/CEE que fixa, tendo em conta o inquérito sobre a estrutura
    das explorações agrícolas de 1979/1980, o esquema comunitário de um programa
    de quadros, o código uniforme e as modalidades de aplicação para a transcrição
    em fita magnética dos dados destes quadros'
  type: main
- language: es
  script: Latn
  content: '80/722/CEE: Decisión de la Comisión, de 13 de junio de 1980, por la
    que se completa la Decisión 79/833/CEE por la que se establecen, con vistas a
    la encuesta sobre la estructura de las explotaciones agrícolas en 1979/1980,
    el esquema comunitario de un programa de cuadros, el código uniforme y las modalidades
    de aplicación para la transcripción en cinta magnética de los datos de dichos
    cuadros'
  type: main
