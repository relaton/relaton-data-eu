    establecido por el Reglamento (CEE) nº 3433/91 sobre las importaciones de encendedores
    de bolsillo no recargables, de gas y piedra, originarios de la República Popular
    de China mediante importaciones de determinados encendedores enviados desde Hong
    Kong, Macao y Taiwán y mediante importaciones de encendedores de bolsillo originarios
    de la República Popular de China y por el que dichas importaciones se someten
    a registro
  type: main
