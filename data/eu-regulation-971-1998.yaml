title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 971/98 of 7 May 1998 initiating an investigation
    concerning the alleged circumvention of the anti-dumping duty imposed by Regulation
    (EEC) No 3433/91 on imports of gas-fuelled, non-refillable pocket flint lighters
    originating in the People's Republic of China by imports of the same lighters
    consigned from Hong Kong, Macao and Taiwan and by imports of certain disposable
    refillable pocket flint lighters originating in the People's Republic of China
    and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 971/98 de la Commission du 7 mai 1998 ouvrant une enquête
    sur le prétendu contournement du droit antidumping institué par le règlement
    (CEE) nº 3433/91 du Conseil sur les importations de briquets de poche avec pierre,
    à gaz, non rechargeables originaires de la République populaire de Chine par
    des importations de briquets identiques en provenance de Hong-kong, de Macao et
    de T'ai-wan ainsi que par des importations de certains briquets de poche avec
    pierre rechargeables jetables originaires de la République populaire de Chine
    et rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 971/98 der Kommission vom 7. Mai 1998 zur Einleitung
    einer Untersuchung betreffend die angebliche Umgehung des mit der Verordnung (EWG)
    Nr. 3433/91 eingeführten Antidumpingzolls auf die Einfuhren von nicht nachfüllbaren
    Taschenfeuerzeugen mit Feuerstein für Gas mit Ursprung in der Volksrepublik China
    durch die Einfuhren solcher Feuerzeuge, die über Hongkong, Macao und Taiwan versandt
    werden, sowie durch die Einfuhren von bestimmten nachfüllbaren Taschenfeuerzeugen
    mit Feuerstein mit Ursprung in der Volksrepublik China und zur zollamtlichen Erfassung
    dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 971/98 af 7. maj 1998 om indledning af
    en undersøgelse af påstanden om, at den antidumpingtold, der indførtes ved
    forordning (EØF) nr. 3433/91 på importen af lommetændere med fyrsten, med gas
    som brændstof, ikke til genopfyldning, med oprindelse i Folkerepublikken Kina,
    omgås ved import af samme type lommetændere afsendt fra Hongkong, Macao og Taiwan
    og ved import af visse engangslommetændere med fyrsten, til genopfyldning, med
    oprindelse i Folkerepublikken Kina, og om registrering af denne import
  type: main
- language: el
  script: Grek
