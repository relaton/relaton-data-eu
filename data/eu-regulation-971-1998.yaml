    regolamento (CEE) n. 3433/91 sulle importazioni di accendini tascabili a pietra
    focaia e a gas, non ricaricabili, originari della Repubblica popolare cinese,
    realizzata mediante importazioni degli stessi accendini provenienti da Hong Kong,
    Macao e Taiwan nonché mediante importazioni di taluni accendini tascabili a pietra
    focaia, teoricamente ricaricabili, originari della Repubblica popolare cinese,
    e che impone la registrazione delle suddette importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 971/98 van de Commissie van 7 mei 1998 tot opening
    van een onderzoek naar een mogelijke ontwijking van het bij Verordening (EEG)
    nr. 3433/91 ingestelde antidumpingrecht op niet-navulbare zakgasaanstekers met
    vuursteentje uit de Volksrepubliek China, door verzending via Hongkong, Macau
    en Taiwan en door de invoer van bepaalde navulbare wegwerpzakgasaanstekers uit
    de Volksrepubliek China en tot instelling van de registratie van deze invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 971/98 da Comissão de 7 de Maio de 1998 que inicia
    um inquérito relativo à alegação de evasão ao direito anti-dumping criado
    pelo Regulamento (CEE) nº 3433/91 sobre as importações de isqueiros de pedra,
    de bolso, a gás, não recarregáveis, originários da República Popular da China
    através das importações dos mesmos isqueiros enviados de Hong Kong, de Macau
    e de Taiwan e das importações de certos isqueiros de pedra, de bolso, teoricamente
    recarregáveis, originários da República Popular da China, e estabelece que
    essas importações sejam objecto de registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 971/98 de la Comisión de 7 de mayo de 1998 por el
