  script: Latn
  content: Commission Regulation (EU) No 1067/2013 of 30 October 2013 amending Regulation
    (EC) No 1881/2006 as regards maximum levels of the contaminants dioxins, dioxin-like
    PCBs and non-dioxin-like PCBs in liver of terrestrial animals
  type: main
- language: fr
  script: Latn
