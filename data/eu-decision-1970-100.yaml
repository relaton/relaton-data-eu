title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 janvier 1970, autorisant la République
    française à exclure du traitement communautaire la viande de l'espèce chevaline,
    position Ex 02.01 A I du Tarif douanier commun, originaire des pays tiers et mise
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/100/EWG: Entscheidung der Kommission vom 19. Januar 1970 zur Ermächtigung
    der Französischen Republik, Pferdefleisch (Tarifnummer ex 02.01 A I des Gemeinsamen
    Zolltarifs) mit Ursprung in dritten Ländern, das sich in den übrigen Mitgliedstaaten
    im freien Verkehr befindet, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/100/CEE: Decisione della Commissione, del 19 gennaio 1970, che autorizza
    la Repubblica francese a escludere dal trattamento comunitario le «carni della
    specie equina», voce della tariffa doganale comune ex 02.01 A I, originarie dei
    paesi terzi e immesse in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/100/EEG: Beschikking van de Commissie van 19 januari 1970 waarbij de
    Franse Republiek wordt gemachtigd om "vlees van paarden", van post ex 02.01 A
    I van het gemeenschappelijk douanetarief, van oorsprong uit derde landen en in
    de andere Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
