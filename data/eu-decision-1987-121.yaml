title:
- language: en
  script: Latn
  content: '87/121/EEC: Commission Decision of 16 January 1987 authorizing the Portuguese
    Republic to introduce intra- Community surveillance of imports of motorcycles
    originating in Japan which have been put into free circulation in one of the Member
    States (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/121/CEE: Décision de la Commission du 16 janvier 1987 autorisant la
    République portugaise à instaurer une surveillance intracommunautaire des importations
    de motocycles, originaires du Japon, mis en libre pratique dans un des États
    membres (Le texte en langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/121/EWG: Entscheidung der Kommission vom 16. Januar 1987 zur Ermächtigung
    der Portugiesischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren der aus Japan stammenden Krafträder, die sich in einem der Mitgliedstaaten
    im zollrechtlich freien Verkehr befinden (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/121/EØF: Kommissionens beslutning af 16. januar 1987 om bemyndigelse
    af Den portugisiske Republik til at indføre tilsyn inden for Fællesskabet med
    indførslen af motorcykler, der har oprindelse i Japan og er overgået til fri
    omsætning i en anden af medlemsstaterne (Kun den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/121/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Ιανουαρίου 1987 περί χορηγήσεως αδείας στην
    Πορτογαλική Δημοκρατία να προβεί σε ενδοκοινοτική
    επιτήρηση των εισαγωγών μοτοσικλετών καταγωγής
    Ιαπωνίας, τα οποία τίθενται σε ελεύθερη κυκλοφορία
    σε ένα κράτος μέλος (Το κείμενο στην πορτογαλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/121/CEE: Decisione della Commissione del 16 gennaio 1987 che autorizza
    la Repubblica portoghese ad istituire una sorveglianza intracomunitaria sulle
    importazioni dei motocicli originari del Giappone immessi in libera pratica in
    uno degli Stati membri (Il testo in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/121/EEG: Beschikking van de Commissie van 16 januari 1987 waarbij de
    Portugese Republiek wordt gemachtigd de invoer van motorrijwielen van oorsprong
    uit Japan die in een Lid-Staat in het vrije verkeer zijn gebracht, onder intracommunautair
    toezicht te plaatsen (Slechts de tekst in de Portugese taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/121/CEE: Decisão da Comissão de 16 de Janeiro de 1987 que autoriza
    a República Portuguesa a instaurar uma vigilância intracomunitária das importações
    de motociclos originários do Japão introduzidos em livre prática num dos Estados-membros
    (Apenas faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '87/121/CEE: Decisión de la Comisión de 16 de enero de 1987 por la que
