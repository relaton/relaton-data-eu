title:
- language: en
  script: Latn
  content: Commission Decision of 11 June 1974 on the application by Ireland to take
    protective measures in respect of sisal baler twine (CCT heading No 59.04) under
    Article 135 of the Act concerning the conditions of accession and the adjustments
    to the Treaties
  type: main
- language: fr
  script: Latn
  content: Décision 74/357/CEE de la Commission, du 11 juin 1974, autorisant l'Irlande
    à adopter des mesures de sauvegarde pour les ficelles de sisal (position 59.04
    du Tarif douanier commun), au titre de l'article 135 de l'Acte relatif aux conditions
    d'adhésion et d'adaptation des Traités
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. Juni 1974 über die Ermächtigung Irlands
    zur Anwendung von Schutzmaßnahmen für Bindfäden aus Sisal (Nr. 59.04 des Gemeinsamen
    Zolltarifs) gemäß Artikel 135 der Akte über die Beitrittsbedingungen und die
    Anpassungen der Verträge
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 11. juni 1974 om bemyndigelse af Irland til
    at indføre beskyttelsesforanstaltninger for sisalgarn (pos. 59.04 i FTT) i henhold
    til artikel 135 i akten vedrørende tiltrædelsesvilkårene og tilpasningerne
    af traktaterne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 giugno 1974, che autorizza l'Irlanda
    a adottare misure di salvaguardia per lo spago di sisal (voce 59.04 della TDC)
    in applicazione dell'articolo 135 dell'atto relativo alle condizioni di adesione
    e agli adattamenti dei trattati
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 juni 1974 waarbij Ierland wordt gemachtigd
    om, op grond van artikel 135 van de Akte betreffende de toetredingsvoorwaarden
    en de aanpassing der Verdragen, vrijwaringsmaatregelen te nemen met betrekking
    tot bindgaren van sisal (post 59.04 van het gemeenschappelijk douanetarief)
  type: main
