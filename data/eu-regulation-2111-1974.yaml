  content: Regulation (EEC) No 2111/74 of the Commission of 26 July 1974 amending
    Regulation (EEC) No 1373/70 on common detailed rules for the application of the
    system of import and export licences and advance fixing certificates for agricultural
    products subject to a single price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2111/74 de la Commission, du 26 juillet 1974, modifiant
    le règlement (CEE) n° 1373/70 portant modalités communes d'application du régime
    de certificats d'importation, d'exportation et de préfixation pour les produits
    agricoles soumis à un régime de prix unique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2111/74 der Kommission vom 26. Juli 1974 zur Änderung
    der Verordnung (EWG) Nr. 1373/70 über gemeinsame Durchführungsvorschriften für
    Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für landwirtschaftliche
    Erzeugnisse, die einem System gemeinsamer Preise unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2111/74 af 26. juli 1974 om ændring
