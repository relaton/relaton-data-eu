    og eksportlicenser samt forudfastsættelsesattester for landbrugsvarer, for hvilke
    der gælder en ordning med fælles priser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2111/74 della Commissione, del 26 luglio 1974, recante
    modifica del regolamento (CEE) n. 1373/70 che stabilisce modalità di applicazione
    per il regime dei titoli d'importazione o di esportazione e dei certificati di
    fissazione anticipata relativi a prodotti agricoli soggetti ad un regime di prezzo
    unico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2111/74 van de Commissie van 26 juli 1974 tot wijziging
    van Verordening (EEG) nr. 1373/70 houdende gemeenschappelijke uitvoeringsbepalingen
    inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten
    waarvoor een stelsel van gemeenschappelijke prijzen geldt
