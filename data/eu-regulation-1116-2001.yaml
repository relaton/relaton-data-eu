title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1116/2001 of 5 June 2001 amending Regulation
    (EEC) No 3677/90 laying down measures to be taken to discourage the diversion
    of certain substances to the illicit manufacture of narcotic drugs and psychotropic
    substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1116/2001 du Conseil du 5 juin 2001 modifiant le règlement
    (CEE) n° 3677/90 relatif aux mesures à prendre afin d'empêcher le détournement
    de certaines substances pour la fabrication illicite de stupéfiants ou de substances
    psychotropes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1116/2001 des Rates vom 5. Juni 2001 zur Änderung
    der Verordnung (EWG) Nr. 3677/90 über Maßnahmen gegen die Abzweigung bestimmter
    Stoffe zur unerlaubten Herstellung von Suchtstoffen und psychotropen Substanzen
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1116/2001 ze dne 5. června 2001, kterým se
    mění nařízení (EHS) č. 3677/90 o opatřeních, která mají být přijata
    za účelem zamezení zneužívání určitých látek k nedovolené výrobě
    omamných a psychotropních látek
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1116/2001 af 5. juni 2001 om ændring af forordning
    (EØF) nr. 3677/90 om foranstaltninger til modvirkning af ulovlig anvendelse af
    visse stoffer til fremstilling af narkotika og psykotrope stoffer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1116/2001 του Συμβουλίου,
    της 5ης Ιουνίου 2001, για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3677/90 για τη θέσπιση μέτρων για την
    πρόληψη της διοχέτευσης ορισμένων ουσιών στην
    παράνομη παρασκευή ναρκωτικών και ψυχοτρόπων
    ουσιών
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1116/2001, 5. juuni 2001, millega muudetakse
    määrust (EMÜ) nr 3677/90, millega kehtestatakse meetmed, et tõkestada narkootiliste
    ja psühhotroopsete ainete ebaseaduslikuks valmistamiseks kasutatavate ainete
    levikut
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1116/2001, annettu 5 päivänä kesäkuuta 2001,
    toimenpiteistä tiettyjen aineiden kulkeutumisen estämiseksi huumausaineiden
    tai psykotrooppisten aineiden laittomaan valmistukseen annetun asetuksen (ETY)
    N:o 3677/90 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1116/2001/EK rendelete (2001. június 5.) az egyes anyagok kábítószerek
    és pszichotróp anyagok tiltott előállítására való eltérítésének megakadályozására
    irányuló intézkedések megállapításáról szóló 3677/90/EGK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1116/2001 del Consiglio, del 5 giugno 2001, che modifica
    il regolamento (CEE) n. 3677/90 recante misure intese a scoraggiare la diversione
    di talune sostanze verso la fabbricazione illecita di stupefacenti o di sostanze
    psicotrope
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1116/2001 (2001. gada 5. jūnijs), ar ko groza
    Regulu (EEK) Nr. 3677/90, ar kuru paredz pasākumus, kas jāveic, lai novērstu
    dažu vielu novirzīšanu narkotisko un psihotropo vielu nelikumīgai izgatavošanai
  type: main
- language: lt
  script: Latn
  content: 2001 m. birželio 5 d. Tarybos reglamentas (EB) Nr. 1116/2001 iš dalies
    keičiantis Reglamentą (EEB) Nr. 3677/90, nustatantį priemones, kurių reikia
    imtis siekiant užkirsti kelią panaudoti tam tikras medžiagas neteisėtai narkotinių
    ir psichotropinių medžiagų gamybai
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1116/2001 tal-5 ta' Ġunju 2001 li jemenda
    r-Regolament (KEE) Nru 3677/90 li jistabilixxi miżuri li għandhom jittieħdu
    sabiex jiskoraġġixxu d-diverżjoni ta' ċerti sustanzi lejn il-manifattura illegali
    ta' drogi narkotiċi u sustanzi psikotropiċi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1116/2001 van de Raad van 5 juni 2001 tot wĳziging
    van Verordening (EEG) nr. 3677/90 houdende maatregelen om te voorkomen dat bepaalde
    stoffen worden misbruikt voor de illegale vervaardiging van verdovende middelen
    en psychotrope stoffen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1116/2001 z dnia 5 czerwca 2001 r. zmieniające
    rozporządzenie (EWG) nr 3677/90 ustanawiające środki, które powinny być podjęte
    w celu uniemożliwiania wykorzystywania niektórych substancji do nielegalnego
    wytwarzania środków odurzających i substancji psychotropowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1116/2001 do Conselho, de 5 de Junho de 2001, que
    altera o Regulamento (CEE) n.° 3677/90 que estabelece as medidas a adoptar para
    evitar o desvio de determinadas substâncias para o fabrico ilegal de estupefacientes
    e de substâncias psicotrópicas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1116/2001 z 5. júna 2001, ktorým sa mení a
    dopĺňa nariadenie (EHS) č. 3677/90, ktorým sa stanovujú opatrenia, ktoré
    treba prijať, aby sa zabránilo zneužívaniu určitých látok na nedovolenú
    výrobu omamných látok a psychotropných látok
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1116/2001 z dne 5. junija 2001 o spremembi Uredbe
    (EGS) št. 3677/90 o določitvi ukrepov za preprečevanje zlorabe nekaterih snovi
    za nezakonito proizvodnjo mamil in drugih psihotropnih snovi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1116/2001 del Consejo, de 5 de junio de 2001, por el
    que se modifica el Reglamento (CEE) n° 3677/90 relativo a las medidas que deben
    adoptarse para impedir el desvío de determinadas sustancias para la fabricación
    ilícita de estupefacientes y de sustancias psicotrópicas
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1116/2001 av den 5 juni 2001 om ändring av
    förordning (EEG) nr 3677/90 om åtgärder för att försvåra avledningen av
    vissa ämnen för olaglig framställning av narkotika och psykotropa ämnen
  type: main
