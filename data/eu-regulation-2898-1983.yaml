title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2898/83 of 18 October 1983 re-establishing
    the levying of customs duties on methanol, falling within subheading 29.04 A I
    and originating in Saudi Arabia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2898/83 de la Commission du 18 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables au méthanol,
    de la sous-position 29.04 A I du tarif douanier commun, originaire de l' Arabie
    saoudite, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2898/83 der Kommission vom 18. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für Methanol der Tarifstelle 29.04 A I, mit Ursprung
    in Saudi-Arabien, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2898/83 af 18. oktober 1983 om genindførelse
    af opkrævning af told for methanol henhørende under pos. 29.04 A I og med oprindelse
    i Saudi-Arabien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
