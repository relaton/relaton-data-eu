title:
- language: en
  script: Latn
  content: '90/138/EEC: Commission Decision of 16 March 1990 accepting an undertaking
    given in connection with the anti-dumping proceeding concerning imports of certain
    diesel engines originating in Finland and Sweden, and terminating the investigation'
  type: main
- language: fr
  script: Latn
  content: '90/138/CEE: Décision de la Commission du 16 mars 1990 portant acceptation
    d''un engagement offert dans le cadre de la procédure antidumping concernant
    les importations de certains moteurs diesel originaires de Finlande et de Suède
    et portant clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 16. Maerz 1990 zur Annahme einer Verpflichtung
    im Rahmen des Antidumpingverfahrens betreffend die Einfuhren bestimmter Dieselmotoren
    mit Ursprung in Finnland und Schweden zur Einstellung des Verfahrens (90/138/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 16. marts 1990 om godtagelse af tilsagn i forbindelse
    med antidumpingundersoegelsen vedroerende importen af visse dieselmotorer med
    oprindelse i Finland og Sverige og om afslutning af denne undersoegelse (90/138/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/138/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
