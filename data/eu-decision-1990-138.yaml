    tipi di motori diesel originari della Finlandia e della Svezia e che chiude il
    procedimento stesso (90/138/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 16 maart 1990 tot aanvaarding van een verbintenis
