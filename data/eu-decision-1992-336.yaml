    mit verminderter Abschöpfung aus Drittländern einzuführen (Nur der portugiesische
    Text ist verbindlich) (92/336/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 30. juni 1992 om bemyndigelse af Portugal
    til at indføre visse mængder råsukker under anvendelse af nedsat afgift fra
    tredjelande for perioden 1. juli til 31. december 1992 (Kun den portugisiske udgave
    er autentisk) (92/336/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/336/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
