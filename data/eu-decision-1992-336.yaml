  content: '92/336/EEC: Commission Decision of 30 June 1992 authorizing Portugal to
    import from third countries at a reduced levy certain quantities of raw sugar
    during the period 1 July to 31 December 1992 (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/336/CEE: Décision de la Commission du 30 juin 1992 autorisant le Portugal
    à importer des pays tiers à prélèvement réduit certaines quantités de sucre
    brut au titre de la période du 1er juillet 1992 au 31 décembre 1992 (Le texte
    en langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 30. Juni 1992 zur Ermächtigung Portugals,
