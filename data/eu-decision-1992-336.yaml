    ορισμένες ποσότητες ακατέργαστης ζάχαρης
    για την περίοδο από την 1η Ιουλίου 1992 έως τις
    31 Δεκεμβρίου 1992'
  type: main
- language: it
  script: Latn
  content: "#DECISIONE DELLA COMMISSIONE del 30 giugno 1992 che autorizza il Portogallo ad importare dai paesi terzi taluni quantitativi di zucchero greggio a prelievo ridotto in conto del periodo dal 1o luglio 1992 al 31 dicembre 1992 (Il testo in lingua portoghese è il solo facente fede) (92/336/CEE) #"
  type: main
