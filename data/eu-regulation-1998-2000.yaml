    produktų importo tvarkos taikymo ir tarifinių kvotų atidarymo taisykles, ir
    Reglamentą (EB) Nr. 174/1999, nustatantį išsamias specialiąsias Tarybos reglamento
    (EEB) Nr. 804/68 taikymo taisykles dėl pieno ir pieno produktų eksporto licencijų
