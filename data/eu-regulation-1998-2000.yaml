    to, kā piemērot importa režīmu, un atver piena un piena produktu tarifu kvotas,
    un Regulu (EK) Nr. 174/1999, ar ko nosaka īpašus sīki izstrādātus noteikumus
    par to, kā piemērot Padomes Regulu (EEK) Nr. 804/68 attiecībā uz piena un
    piena produktu eksporta licencēm un eksporta kompensācijām
  type: main
