    Handelsmechanismus für frisches Obst und Gemüse zwischen Portugal und den übrigen
    Mitgliedstaaten #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 172/91 af 24. januar 1991 om ændring
