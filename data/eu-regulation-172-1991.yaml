  content: Commission Regulation (EEC) No 172/91 of 24 January 1991 amending Regulation
    (EEC) No 3819/90 laying down detailed rules for the application of the supplementary
    trade mechanism to trade in fresh fruit and vegetables between Portugal and the
    other Member States
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 172/91 DE LA COMMISSION du 24 janvier 1991 modifiant
