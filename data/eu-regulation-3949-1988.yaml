title:
- language: en
  script: Latn
  content: Council Regulation (EEC) 3949/88 of 11 December 1988 fixing, for 1989,
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of a Member State, apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3949/88 du Conseil du 11 décembre 1988 fixant, pour
    1989, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon du Portugal dans les eaux relevant de
    la souveraineté ou de la juridiction d'un État membre à l'exception de l'Espagne
    et du Portugal
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3949/88 DES RATES vom 11. Dezember 1988 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter portugiesischer Flagge in den Gewässern unter der Hoheitsgewalt
    oder Gerichtsbarkeit eines Mitgliedstaats mit Ausnahme Spaniens und Portugals
    (1989) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3949/88 af 11. december 1988 om fastsættelse
    for 1989 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der henhører under medlemsstaternes højhedsområde eller jurisdiktion, med undtagelse
    af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3949/88 του Συμβουλίου
    της 11ης Δεκεμβρίου 1988 για τον καθορισμό, για
    το 1989, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται για
    τα σκάφη με πορτογαλική σημαία στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    κράτους μέλους, εκτός της Ισπανίας και της
    Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3949/88 DEL CONSIGLIO dell'' 11 dicembre 1988 che
    fissa, per il 1989, alcune misure di conservazione e di gestione delle risorse
    ittiche applicabili alle navi battenti bandiera del Portogallo nelle acque soggette
    alla sovranità o alla giurisdizione di uno Stato membro, esclusi la Spagna e
    il Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3949/88 VAN DE RAAD van 11 december 1988 tot vaststelling,
    voor 1989, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op de vlag van Portugal voerende vaartuigen,
    in de wateren die onder de soevereiniteit of de jurisdictie van de Lid-Staten
    vallen, met uitzondering van Spanje en Portugal #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3949/88 do Conselho de 11 de Dezembro de 1988 que
    fixa, para 1989, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de Portugal nas águas sob
    soberania ou jurisdição de um Estado-membro, com excepção de Espanha e de
    Portugal
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3949/88 DEL CONSEJO de 11 de diciembre de 1988 por
    el que se fijan, para 1989, determinadas medidas de conservación y de gestión
    de los recursos de pesca aplicables a los buques bajo pabellón de Portugal en
    las aguas sometidas a la soberanía o a la jurisdicción de cualquier Estado miembro,
    excepto España y Portugal #'
