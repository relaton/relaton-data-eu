title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3157/80 of 5 December 1980 re-establishing
    the levying of customs duties on cycles (including delivery tricycles), not motorized,
    falling within heading No 87.10 and originating in developing countries to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3157/80 de la Commission, du 5 décembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux vélocipèdes
    (y compris les triporteurs et similaires), sans moteur, de la position 87.10 du
    tarif douanier commun, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3157/80 der Kommission vom 5. Dezember 1980 zur Wiedereinführung
    des Zollsatzes für Fahrräder, enschließlich Lastendreiräder und dergleichen,
    ohne Motor, der Tarifnummer 87.10 mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3157/80 af 5. december 1980 om genindførelse
    af opkrævning af toldafgifter på cykler uden motor, herunder trehjulede transportcykler,
    under pos. 87.10, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3157/80 della Commissione, del 5 dicembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai velocipedi (compresi
    i furgoncini a triciclo e simili), senza motore, della voce 87.10 della tariffa
    doganale comune, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3157/80 van de Commissie van 5 december 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor rijwielen (bakfietsen
    en dergelijke daaronder begrepen) zonder motor, van post 87.10, van oorsprong
    uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad tariefpreferenties werden geopend
  type: main
