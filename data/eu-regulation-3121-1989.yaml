title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3121/89 of 16 October 1989 modifying the anti-dumping
    measures applicable to imports of certain acrylic fibres originating in Mexico
    by introducing an anti-dumping duty on such imports, other than those from exporters
    to the Community whose undertakings are accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3121/89 du Conseil du 16 octobre 1989 portant modification
    des mesures antidumping applicables aux importations de certaines fibres acryliques
    originaires du Mexique par l'institution d'un droit antidumping sur ces importations,
    à l'exception de celles réalisées à partir de ventes à l'exportation à destination
    de la Communauté effectuées par des sociétés dont les engagements sont acceptés
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3121/89 DES RATES vom 16. Oktober 1989 zur Änderung
    der Antidumpingmaßnahmen gegenüber den Einfuhren bestimmter Polyacryl-Spinnfasern
    mit Ursprung in Mexiko durch die Einführung eines Antidumpingzolls auf diese
    Einfuhren - mit Ausnahme der Exportverkäufe in die Gemeinschaft von Unternehmen,
    deren Verpflichtungen angenommen werden #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3121/89 af 16. oktober 1989 om ændring af
    antidumpingforanstaltningerne vedrørende importen af visse acrylfibre med oprindelse
    i Mexico ved indførelse af en antidumpingtold på importen af disse varer, bortset
    fra varer, der sælges til eksport til Fællesskabet af selskaber, hvis tilsagn
    er blevet godtaget
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3121/89 του Συμβουλίου
    της 16ης Οκτωβρίου 1989 για την τροποποίηση των
    μέτρων αντιντάμπινγκ που εφαρμόζονται στις
    εισαγωγές ορισμένων ακρυλικών ινών καταγωγής
    Μεξικού με τη θέσπιση δασμού αντιντάμπινγκ
    επί των εισαγωγών αυτών, εκτός από τις εισαγωγές
    με προορισμό την Κοινότητα που πραγματοποιούνται
    από εξαγωγικές εταιρείες των οποίων έχουν
    γίνει αποδεκτές οι αναλήψεις υποχρεώσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3121/89 DEL CONSIGLIO del 16 ottobre 1989 che modifica
    le misure antidumping applicabili alle importazioni di alcuni tipi di fibre acriliche
    originarie del Messico con l'' istituzione di un dazio antidumping su tali importazioni,
    fatta eccezione di quelle realizzate a partire da vendite per l'' esportazione
    nella Comunità effettuate dalle società i cui impegni sono stati accettati #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3121/89 VAN DE RAAD van 16 oktober 1989 houdende
    wijziging van de anti-dumpingmaatregelen welke van toepassing zijn op de invoer
    van bepaalde acrylvezels van oorsprong uit Mexico door het instellen van een anti-dumpingrecht
    op deze invoer, met uitzondering van die welke berust op uitvoer naar de Gemeenschap
    door vennootschappen waarvan de verbintenissen worden aanvaard #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3121/89 DO CONSELHO de 16 de Outubro de 1989 que altera
    as medidas anti-dumping aplicaveis às importaçoes de certas fibras acrilicas
    originarias do México pela criaçao de um direito anti-dumping sobre essas importaçoes,
    com excepçao das realizadas a partir de vendas para exportaçao com destino à
    Comunidade efectuadas pelas empresas cujos compromissos sao aceites
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3121/89 DEL CONSEJO de 16 de octubre de 1989 por el
    que se modifican las medidas antidumping aplicables a las importaciones de determinadas
    fibras acrílicas originarias de México mediante el establecimiento de un derecho
    antidumping sobre dichas importaciones, con excepción de las realizadas a partir
    de ventas a la exportación con destino a la Comunidad efectuadas por sociedades
    cuyos compromisos se aceptan #'
  type: main
