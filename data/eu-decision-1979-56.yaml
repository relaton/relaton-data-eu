title:
- language: en
  script: Latn
  content: '79/56/EEC: Commission Decision of 13 December 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to women'' s, girls'' and infants'' (other than babies''
    ) knitted or crocheted pyjamas and night dresses, of cotton or synthetic fibres,
    falling within heading No ex 60.04 of the Common Customs Tariff (NIMEXE codes
    60.04-21, 25, 51, 53), originating in Czechoslovakia and in free circulation in
    the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/56/CEE: Décision de la Commission, du 13 décembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les pyjamas et les chemises de nuit, de
    bonneterie, de coton ou de fibres textiles synthétiques pour femmes, fillettes
    et jeunes enfants (autres que bébés) de la position ex 60.04 du tarif douanier
    commun (codes Nimexe 60.04-21, 25, 51, 53) originaires de Tchécoslovaquie et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/56/EWG: Entscheidung der Kommission vom 13. Dezember 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus der Tschechoslowakei stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Schlafanzüge und Nachthemden
    aus Gewirken, aus Baumwolle oder aus synthetischen Spinnstoffen, für Frauen,
    Mädchen und Kleinkinder (ausgenommen Säuglinge), der Tarifnummer ex 60.04 des
    Gemeinsamen Zolltarifs (NIMEXE-Kennziffern: 60.04-21; 25; 51; 53) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/56/EØF: Kommissionens beslutning af 13. december 1978 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage pyjamas og natskjorter af trikotage,
    bomuld eller kemofibre, til kvinder, piger og småbørn (undtagen spædbørn),
    som henhører under pos. 60.04 i den fælles toldtarif (NIMEXE-nummer 60.04-21,
    25, 51, 53), har oprindelse i Tjekkoslovakiet og frit kan omsættes i de øvrige
    medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/56/CEE: Decisione della Commissione, del 13 dicembre 1978, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i pigiami e le camicie da notte, a maglia,
    di cotone o di fibre tessili sintetiche, per donna, per ragazza e per bambini,
    diversi dai bambini piccoli (bébés), della voce ex 60.04 della tariffa doganale
    comune (codici Nimexe: 60.04-21, 25, 51, 53), originari della Cecoslovacchia e
    messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/56/EEG: Beschikking van de Commissie van 13 december 1978 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd pyjama'' s en nachthemden voor dames, meisjes en kinderen (andere
    dan die voor baby'' s), van brei- of haakwerk, van katoen of van synthetische
    vezels, van post ex 60.04 van het gemeenschappelijk douanetarief (NIMEXE-code
    60.04-21, 25, 51, 53), van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
