title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3504/83 of 12 December 1983 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3504/83 de la Commission du 12 décembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes à incandescence pour l' éclairage, de la sous-position 85.20 A II du tarif
    douanier commun, originaires de Roumanie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3504/83 der Kommission vom 12. Dezember 1983 zur Wiedereinführung
    der Erhebung der Zölle für Glühlampen für elektrische Beleuchtung der Tarifstelle
    85.20 A II mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3377/82
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3504/83 af 12. december 1983 om genindførelse
    af opkrævning af told for glødelamper til belysning, henhørende under pos.
    85.20 A II og med oprindelse i Rumænien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
