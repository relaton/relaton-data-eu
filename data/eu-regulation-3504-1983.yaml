    της εφαρμογής των δασμών για λαμπτήρες και
    σωλήνες διά πυρακτώσεως για φωτισμό της διακρίσεως
    85.20 Α ΙΙ του Κοινού Δασμολογίου, καταγωγής Ρουμανίας,
    δικαιούχου των προβλεπομένων από τον κανονισμό
