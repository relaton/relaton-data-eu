    doganale comune, originari della Romania, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3504/83 van de Commissie van 12 december 1983 houdende
