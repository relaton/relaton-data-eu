title:
- language: en
  script: Latn
  content: '88/176/EEC: Commission Decision of 9 February 1988 approving derogations
    provided for by Greece, Italy and Portugal from certain provisions of Council
    Directive 77/93/EEC in respect of seed potatoes originating in Canada (Only the
    Greek, Italian and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/176/CEE: Décision de la Commission du 9 février 1988 approuvant des
    dérogations prévues par la Grèce, l''Italie et le Portugal à certaines dispositions
    de la directive 77/93/CEE du Conseil en ce qui concerne les plants de pommes de
    terre originaires du Canada (Les textes en langues grecque, italienne et portugaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/176/EWG: Entscheidung der Kommission vom 9. Februar 1988 zur Genehmigung
    der von Griechenland, Italien und Portugal für Pflanzkartoffeln mit Ursprung
    in Kanada vorgesehenen Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG
    des Rates (Nur der griechische, italienische und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/176/EØF: Kommissionens beslutning af 9. februar 1988 om godkendelse
    af undtagelser for Grækenland, Italien og Portugal fra visse bestemmelser i Rådets
    direktiv 77/93/EØF for så vidt angår læggekartofler med oprindelse i Canada
    (Kun den graeske, italienske og portugisiske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '88/176/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Φεβρουαρίου
    1988 για την έγκριση παρεκκλίσεων που προβλέπονται
    από την Ελλάδα, την Ιταλία και την Πορτογαλία
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά τους σπόρους γεωμήλων
    προς φύτευση καταγωγής Καναδά (Τα κείμενα στην
    ελληνική, ιταλική και πορτογαλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '88/176/CEE: Decisione della Commissione del 9 febbraio 1988 che approva
    le deroghe, previste dalla Grecia, dall''Italia e dal Portogallo, a talune disposizioni
    della direttiva 77/93/CEE del Consiglio per quanto riguarda i tuberi-seme di patate
    originari del Canada (I testi in lingua greca, italiana e portoghese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '88/176/EEG: Beschikking van de Commissie van 9 februari 1988 tot goedkeuring
    van de door Griekenland, Italië en Portugal vastgestelde afwijkingen van sommige
    bepalingen van Richtlijn 77/93/EEG van de Raad ten aanzien van pootaardappelen
    van oorsprong uit Canada (Slechts de teksten in de Griekse, Italiaanse en de Portugese
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/176/CEE: Decisão da Comissão de 9 de Fevereiro de 1988 que aprova
