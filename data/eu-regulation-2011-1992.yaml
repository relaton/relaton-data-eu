    einer Tonne Kartoffelstärke nötigen Kartoffelmenge und des für diese Menge
    zu zahlenden Mindestpreises
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2011/92 af 20. juli 1992 om ændring
