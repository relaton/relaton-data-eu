  content: Commission Regulation (EEC) No 3758/92 of 21 December 1992 determining
    the amounts of the variable components and additional duties applicable from 1
    to 31 January 1993 on the importation into the Community of goods covered by Council
    Regulation (EEC) No 3033/80 from the Republic of Poland, from the Czech and Slovak
    Federal Republic and from the Republic of Hungary, and modifying Regulation (EEC)
    No 3104/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3758/92 de la Commission, du 21 décembre 1992, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables,
    pendant la période allant du 1er au 31 janvier 1993 inclus, à l'importation
    dans la Communauté des marchandises relevant du règlement (CEE) n 3033/80 du
    Conseil en provenance de la république de Pologne, de la République fédérative
    tchèque et slovaque et de la république de Hongrie, et modifiant le règlement
    (CEE) n 3104/92
  type: main
