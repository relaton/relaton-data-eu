title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1095/85 of 29 April 1985 amending Regulation
    (EEC) No 203/85 establishing the list of products processed from fruit and vegetables
    the granting of import licences for which is covered by special rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1095/85 de la Commission du 29 avril 1985 modifiant
    le règlement (CEE) no 203/85 établissant la liste des produits transformés
    à base de fruits et légumes pour lesquels l' octroi des certificats d' importation
    est soumis à des conditions particulières
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1095/85 der Kommission vom 29. April 1985 zur Änderung
    der Verordnung (EWG) Nr. 203/85 zur Aufstellung des Verzeichnisses der Verarbeitungserzeugnisse
    aus Obst und Gemüse, bei denen die Erteilung der Einfuhrlizenzen besonderen Bedingungen
    unterliegt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1095/85 af 29. april 1985 om ændring
    af forordning (EØF) nr. 203/85 om listen over produkter, der er forarbejdet på
    basis af frugt og grønsager, og for hvilke udstedelse af importlicenser sker
    på særlige betingelser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1095/85 της Επιτροπής
    της 29ης Απριλίου 1985 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 203/85 για την κατάρτιση
    του πίνακα μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά για τα οποία η χορήγηση πιστοποιητικών
    εισαγωγής υπόκειται σε ειδικούς όρους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1095/85 della Commissione del 29 aprile 1985 che modifica
    il regolamento (CEE) n. 203/85 che stabilisce l' elenco dei prodotti trasformati
    a base di ortofrutticoli per i quali la concessione dei titoli d' importazione
    è subordinata a condizioni particolari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1095/85 van de Commissie van 29 april 1985 houdende
    wijziging van Verordening (EEG) nr. 203/85 tot vaststelling van de lijst van op
    basis van groenten en fruit verwerkte produkten ten aanzien waarvan bijzondere
    voorwaarden gelden voor de toekenning van invoercertificaten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1095/85 da Comissão, de 29 de Abril de 1985, que
    altera o Regulamento (CEE) n.° 203/85 que estabelece a lista dos produtos transformados
    à base de frutas e produtos hortícolas para os quais a concessão dos certificados
    de importação está sujeita a condições especiais
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1095/85 de la Comisión, de 29 de abril de 1985, por
    el que se modifica el Reglamento (CEE) n° 203/85 por el que se establece una
    lista de productos transformados a base de frutas y hortalizas para los que se
    somete a condiciones especiales la concesión de certificados de importación
  type: main
