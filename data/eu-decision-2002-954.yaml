title:
- language: en
  script: Latn
  content: '2002/954/EC: Council Decision of 3 December 2002 extending the period
    of application of Decision 2000/185/EC authorising Member States to apply a reduced
    rate of VAT to certain labour-intensive services in accordance with the procedure
    provided for in Article 28(6) of Directive 77/388/EEC'
  type: main
- language: fr
  script: Latn
  content: '2002/954/CE: Décision du Conseil du 3 décembre 2002 qui proroge la durée
    d''application de la décision 2000/185/CE autorisant les États membres à appliquer
    un taux réduit de TVA sur certains services à forte intensité de main-d''œuvre
    conformément à la procédure prévue à l''article 28, paragraphe 6, de la directive
    77/388/CEE'
  type: main
- language: de
  script: Latn
  content: '2002/954/EG: Entscheidung des Rates vom 3. Dezember 2002 zur Verlängerung
    der Geltungsdauer der Entscheidung 2000/185/EG zur Ermächtigung der Mitgliedstaaten,
    auf bestimmte arbeitsintensive Dienstleistungen einen ermäßigten Mehrwertsteuersatz
    anzuwenden (Verfahren gemäß Artikel 28 Absatz 6 der Richtlinie 77/388/EWG)'
  type: main
- language: da
  script: Latn
  content: '2002/954/EF: Rådets beslutning af 3. december 2002 om forlængelse af
    gyldigheden af beslutning 2000/185/EF om bemyndigelse af medlemsstaterne til at
    anvende en nedsat momssats på visse arbejdskraftintensive tjenesteydelser i overensstemmelse
    med proceduren i artikel 28, stk. 6, i direktiv 77/388/EØF'
  type: main
- language: el
  script: Grek
  content: '2002/954/ΕΚ: Απόφαση του Συμβουλίου, της 3ης
    Δεκεμβρίου 2002, για την παράταση της διάρκειας
    εφαρμογής της απόφασης 2000/185/ΕΚ, με την οποία
    επιτρέπεται στα κράτη μέλη να εφαρμόσουν μειωμένο
    συντελεστή ΦΠΑ σε ορισμένες υπηρεσίες υψηλής
    έντασης εργατικού δυναμικού, σύμφωνα με τη
    διαδικασία που προβλέπεται στο άρθρο 28 παράγραφος
    6 της οδηγίας 77/388/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '2002/954/EY: Neuvoston päätös, tehty 3 päivänä joulukuuta 2002,
    luvan antamisesta jäsenvaltioille soveltaa alennettua arvonlisäverokantaa tiettyihin
    erityisen työvaltaisiin palveluihin direktiivin 77/388/ETY 28 artiklan 6 kohdassa
    säädetyn menettelyn mukaisesti tehdyn päätöksen 2000/185/EY voimassaoloajan
    jatkamisesta'
  type: main
- language: it
  script: Latn
  content: '2002/954/CE: Decisione del Consiglio, del 3 dicembre 2002, che proroga
    la durata di applicazione della decisione 2000/185/CE che autorizza gli Stati
    membri ad applicare un''aliquota IVA ridotta su taluni servizi ad alta intensità
    di lavoro secondo la procedura di cui all''articolo 28, paragrafo 6, della direttiva
    77/388/CEE'
  type: main
- language: nl
  script: Latn
  content: '2002/954/EG: Beschikking van de Raad van 3 december 2002 tot verlenging
    van de geldigheidsduur van Beschikking 2000/185/EG waarbĳ de lidstaten worden
    gemachtigd om overeenkomstig de procedure vastgesteld in artikel 28, lid 6, van
    Richtlĳn 77/388/EEG een verlaagd BTW-tarief op bepaalde arbeidsintensieve diensten
    toe te passen'
  type: main
- language: pt
  script: Latn
  content: '2002/954/CE: Decisão do Conselho, de 3 de Dezembro de 2002, que prorroga
    o prazo de aplicação da Decisão 2000/185/CE que autoriza os Estados-Membros
    a aplicarem uma taxa reduzida de IVA a certos serviços de grande intensidade
    do factor trabalho nos termos do n.° 6 do artigo 28.° da Directiva 77/388/CEE'
  type: main
- language: es
  script: Latn
  content: '2002/954/CE: Decisión del Consejo, de 3 de diciembre de 2002, por la
    que se prorroga el período de aplicación de la Decisión 2000/185/CE por la
    que se autoriza a los Estados miembros a aplicar un tipo reducido de IVA a algunos
    servicios de gran intensidad de mano de obra de acuerdo con el procedimiento previsto
    en el apartado 6 del artículo 28 de la Directiva 77/388/CEE'
  type: main
- language: sv
  script: Latn
  content: '2002/954/EG: Rådets beslut av den 3 december 2002 om förlängning av
    tillämpningsperioden för beslut 2000/185/EG om att tillåta medlemsstaterna
    att tillämpa en reducerad mervärdesskattesats på vissa arbetsintensiva tjänster
    i enlighet med det förfarande som föreskrivs i artikel 28.6 i direktiv 77/388/EEG'
  type: main
