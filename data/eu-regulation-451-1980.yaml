    flerfasede, med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Sovjetunionen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 451/80 della Commissione, del 22 febbraio 1980, recante
