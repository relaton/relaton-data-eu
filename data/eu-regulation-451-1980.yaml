    di motori elettrici polifase normalizzati, di potenza superiore a 0,75 kW e inferiore
    o pari a 75 kW, originari dell' Unione Sovietica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 451/80 van de Commissie van 22 februari 1980 houdende
