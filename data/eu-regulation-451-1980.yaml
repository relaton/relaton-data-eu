title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 451/80 of 22 February 1980 imposing a provisional
    anti-dumping duty on imports of standardized electric multi-phase motors having
    an output of more than 0*75 kW but not more than 75 kW, originating in the USSR
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 451/80 de la Commission, du 22 février 1980, portant
    institution d' un droit anti-"dumping" provisoire à l' égard des importations
    de moteurs électriques polyphasés normalisés d' une puissance de plus de 0,75
    à 75 kilowatts inclus, originaires d' Union soviétique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 451/80 der Kommission vom 22. Februar 1980 über die
    Einführung eines vorläufigen Antidumpingzolls auf die Einfuhren von Mehrphasen-Wechselstrommotoren
    mit einer Leistung von mehr als 0,75 kW bis 75 kW mit Ursprung in der Sowjetunion
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 451/80 af 22. februar 1980 om indførelse
