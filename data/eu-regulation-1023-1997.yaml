    koskevan väliaikaisen polkumyyntitullin käyttöönotosta ja tiettyjen viejien
    kyseisen tuonnin yhteydessä esittämien sitoumusten hyväksymisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1023/97 della Commissione del 6 giugno 1997 che impone
    un dazio antidumping provvisorio sulle importazioni di palette semplici di legno
    originarie della Polonia e che accetta gli impegni offerti da alcuni esportatori
    per quanto riguarda tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1023/97 van de Commissie van 6 juni 1997 tot instelling
