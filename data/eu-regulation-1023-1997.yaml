title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1023/97 of 6 June 1997 imposing a provisional
    anti-dumping duty on certain imports of flat pallets of wood originating in Poland
    and accepting undertakings offered from certain exporters in connection with those
    imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1023/97 de la Commission du 6 juin 1997 instituant
    un droit antidumping provisoire sur les importations de palettes simples, en bois,
    originaires de Pologne et portant acceptation des engagements offerts par certains
    exportateurs en ce qui concerne ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1023/97 der Kommission vom 6. Juni 1997 zur Einführung
    eines vorläufigen Antidumpingzolls auf bestimmte Einfuhren von Flachpaletten
    aus Holz mit Ursprung in Polen und zur Annahme der Verpflichtungsangebote bestimmter
    Ausführer im Zusammenhang mit diesen Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 1023/97 af 6. juni 1997 om indførelse
    af en midlertidig antidumpingtold på import af flade paller af træ med oprindelse
    i Polen og om godtagelse af tilsagn afgivet af visse eksportører i forbindelse
    med den pågældende import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1023/97 της Επιτροπής
    της 6ης Ιουνίου 1997 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ σε ορισμένες εισαγωγές
    απλών παλετών από ξύλο καταγωγής Πολωνίας
    και την αποδοχή αναλήψεων υποχρεώσεων από
    μέρους ορισμένων εξαγωγέων σχετικά με τις
    εν λόγω εισαγωγές
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1023/97, annettu 6 päivänä kesäkuuta 1997,
