    oorsprong uit Polen en tot aanvaarding van in verband met deze invoer door bepaalde
    exporteurs aangeboden verbintenissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1023/97 da Comissão de 6 de Junho de 1997 que cria
    um direito anti-dumping provisório sobre certas importações de paletes simples
    de madeira originárias da Polónia e que aceita compromissos oferecidos por determinados
    exportadores no que diz respeito a estas importações
  type: main
