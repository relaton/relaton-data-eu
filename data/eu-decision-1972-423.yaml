  type: main
- language: de
  script: Latn
  content: '72/423/EWG: Entscheidung der Kommission vom 5. Dezember 1972 zur Ermächtigung
    der Bundesrepublik Deutschland, Brotroggen im Besitz der deutschen Interventionsstelle
    für einen Handelsplatz anzubieten, an dem er nicht gelagert ist'
  type: main
- language: it
  script: Latn
  content: '72/423/CEE: Decisione della Commissione, del 5 dicembre 1972, che autorizza
    la Repubblica federale di Germania ad offrire segala da panificazione, detenuta
    dall''organismo d''intervento tedesco, per un centro di commercializzazione in
    cui non è immagazzinata'
  type: main
- language: nl
  script: Latn
  content: '72/423/EEG: Beschikking van de Commissie van 5 december 1972 waarbij de
    Bondsrepubliek Duitsland gemachtigd wordt voor de broodbakkerij geschikte rogge,
    in het bezit van het Duitse interventiebureau, aan te bieden voor een handelscentrum
    waar deze niet is opgeslagen'
