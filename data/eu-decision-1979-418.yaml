title:
- language: en
  script: Latn
  content: '79/418/EEC: Commission Decision of 9 April 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to unglazed setts, flags and paving, hearth and wall
    tiles, falling within heading Nos ex 69.07 and ex 69.08 of the Common Customs
    Tariff, originating in Japan and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/418/CEE: Décision de la Commission, du 9 avril 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les carreaux, pavés et dalles de pavement
    ou de revêtement, des positions ex 69.07 et ex 69.08 du tarif douanier commun,
    originaires du Japon et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/418/EWG: Entscheidung der Kommission vom 9. April 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Japan stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Fliesen, gebrannte Pflastersteine sowie Boden- und
    Wandplatten, der Tarifnummern ex 69.07 und ex 69.08 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/418/EØF: Kommissionens beslutning af 9. april 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage uglaserede sten og fliser til brolægning,
    gulvbelægning eller beklædning af vægge, som henhører under pos. ex 69.07
    og ex 69.08 i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes
    i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/418/CEE: Decisione della Commissione, del 9 aprile 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le piastrelle, i blocchetti e le lastre
    da pavimentazione o da rivestimento, delle voci ex 69.07 e ex 69.08 della tariffa
    doganale comune, originari del Giappone e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/418/EEG: Beschikking van de Commissie van 9 april 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd plavuizen, vloer- en wandtegels, van de posten ex 69.07 en ex
    69.08 van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
