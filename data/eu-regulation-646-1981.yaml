title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 646/81 of 12 March 1981 re-establishing
    the levying of customs duties on twine, cordage, ropes and cables, of synthetic
    textile fibres, plaited or not, products of category 90 (code 0900), originating
    in South Korea, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 646/81 de la Commission, du 12 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux ficelles,
    cordes et cordages, en fibres textiles synthétiques, tressés ou non, de la catégorie
    de produits n° 90 (code 0900), originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues au règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 646/81 der Kommission vom 12. März 1981 über die
    Wiedereinführung des Zollsatzes für Bindfäden, Seile und Taue aus synthetischen
    Spinnstoffen, auch geflochten, der Warenkategorie Nr. 90 (Kennziffer 0900), mit
    Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 646/81 af 12. marts 1981 om genindførelse
    af opkrævning af toldafgifter for sejlgarn, reb og tovværk, af syntetiske fibre,
    også flettet, under kategori 90, som har oprindelse i Sydkorea og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 646/81 τής Επιτροπής
    τής 12ης Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών διά σπάγγους,
    σχοινία καί χονδρά σχοινία εκ συνθετικών υφαντικών
    ινών πλεκτά ή μή, τών προϊόντων τής κατηγορίας
    90 (κώδικας 0900), καταγωγής Νοτίου Κορέας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 646/81 della Commissione, del 12 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili allo spago, corde e funi, di fibre
    tessili sintetiche, anche intrecciate, della categoria di prodotti n. 90 (codice
    0900), originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 646/81 van de Commissie van 12 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bindgaren,
    touw en kabel van synthetische vezels, al dan niet gevlochten, van de categorie
    van produkten nr. 90 (codenummer 0900), van oorsprong uit Zuid-Korea waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3320/80
    van de Raad
  type: main
