    las importaciones de ese producto originario de Arabia Saudí'
  type: main
- language: sv
  script: Latn
  content: '2002/890/EG: Kommissionens beslut av den 21 oktober 2002 om ändring av
    beslut 1999/215/EG om godtagande av åtaganden som gjorts i samband med antidumpningsförfarandena
    rörande import av skördegarn av polypropen med ursprung i Polen, Tjeckiska republiken
    och Ungern och om avslutande av det förfarande som avser import av skördegarn
    av polypropen med ursprung i Saudiarabien'
