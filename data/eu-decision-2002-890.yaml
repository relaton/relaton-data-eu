title:
- language: en
  script: Latn
  content: '2002/890/EC: Commission Decision of 21 October 2002 amending Decision
    1999/215/EC accepting undertakings offered in connection with the anti-dumping
    proceeding concerning imports of polypropylene binder or baler twine originating
    in Poland, the Czech Republic and Hungary and terminating the proceeding in respect
    of such imports originating in Saudi Arabia'
  type: main
- language: fr
  script: Latn
  content: '2002/890/CE: Décision de la Commission du 21 octobre 2002 modifiant la
    décision 1999/215/CE portant acceptation des engagements offerts dans le cadre
    de la procédure antidumping concernant les importations de ficelle lieuse ou
    botteleuse en polypropylène originaire de Pologne, de la République tchèque
    et de Hongrie et clôturant la procédure concernant les importations originaires
    d''Arabie saoudite'
  type: main
- language: de
  script: Latn
  content: '2002/890/EG: Beschluss der Kommission vom 21. Oktober 2002 zur Änderung
    des Beschlusses 1999/215/EG zur Annahme von Verpflichtungsangeboten im Zusammenhang
    mit dem Antidumpingverfahren betreffend die Einfuhren von Binde- oder Pressengarnen
    aus Polypropylen mit Ursprung in Polen, der Tschechischen Republik und Ungarn
    und zur Einstellung des Verfahrens gegenüber solchen Einfuhren mit Ursprung in
    Saudi-Arabien'
  type: main
- language: da
  script: Latn
  content: '2002/890/EF: Kommissionens afgørelse af 21. oktober 2002 om ændring
    af afgørelse 1999/215/EF om godtagelse af tilsagn afgivet i forbindelse med antidumpingproceduren
    vedrørende importen af binde- og pressegarn af polypropylen med oprindelse i
    Polen, Tjekkiet og Ungarn og om afslutning af proceduren med hensyn til importen
    af sådanne varer med oprindelse i Saudi-Arabien'
  type: main
- language: el
  script: Grek
  content: '2002/890/ΕΚ: Απόφαση της Επιτροπής, της 21ης
    Οκτωβρίου 2002, για την τροποποίηση της απόφασης
    1999/215/ΕΚ για την αποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν σε σχέση με τη διαδικασία αντιντάμπινγκ
    όσον αφορά τις εισαγωγές σπάγκων για δεσίματα
    ή δεματιάσματα από πολυπροπυλένιο, καταγωγής
    Πολωνίας, Τσεχικής Δημοκρατίας και Ουγγαρίας
    και για την περάτωση της διαδικασίας όσον αφορά
    τις εισαγωγές καταγωγής Σαουδικής Αραβίας'
  type: main
- language: fi
  script: Latn
  content: '2002/890/EY: Komission päätös, tehty 21 päivänä lokakuuta 2002,
    Puolasta, Tšekin tasavallasta ja Unkarista peräisin olevan polypropeenista valmistetun
    lyhdelangan ja paalinarun tuontia koskevan polkumyynnin vastaisen menettelyn yhteydessä
    esitettyjen sitoumusten hyväksymisestä ja menettelyn päättämisestä Saudi-Arabiasta
    peräisin olevan tuonnin osalta tehdyn päätöksen 1999/215/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '2002/890/CE: Decisione della Commissione, del 21 ottobre 2002, che modifica
    la decisione 1999/215/CE che accetta gli impegni offerti in relazione al procedimento
    antidumping riguardante le importazioni di spago di polipropilene originario della
    Polonia, della Repubblica ceca e dell''Ungheria e che chiude il procedimento nei
    riguardi di tali importazioni originarie dell''Arabia Saudita'
  type: main
- language: nl
  script: Latn
  content: '2002/890/EG: Besluit van de Commissie van 21 oktober 2002 houdende wĳziging
    van Besluit 1999/215/EG tot aanvaarding van verbintenissen die zĳn aangeboden
    in verband met de antidumpingprocedures met betrekking tot de invoer van bindtouw
    van polypropyleen van oorsprong uit Polen, de Tsjechische Republiek en Hongarĳe
    en tot beëindiging van de procedure ten aanzien van dergelĳke invoer van oorsprong
    uit Saoedi-Arabië'
  type: main
- language: pt
  script: Latn
  content: '2002/890/CE: Decisão da Comissão, de 21 de Outubro de 2002, que altera
    a Decisão 1999/215/CE, que aceita compromissos oferecidos no âmbito do processo
    anti-dumping relativo às importações de cordéis para atadeiras ou enfardadeiras
    de polipropileno originários da Polónia, da República Checa e da Hungria e
    que encerra o processo relativo a essas importações originárias da Arábia
    Saudita'
  type: main
- language: es
  script: Latn
  content: '2002/890/CE: Decisión de la Comisión, de 21 de octubre de 2002, que
    modifica la Decisión 1999/215/CE por la que se aceptan los compromisos ofrecidos
    con respecto al procedimiento antidumping relativo a las importaciones de cuerdas
    para atadoras o gavilladoras de polipropileno originarias de Polonia, la República
