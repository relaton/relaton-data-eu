    loomatervise sertifikaatide näidiste ja loomatervise/ametlike sertifikaatide
    näidistega, selliste sertifikaatidega seotud ametliku sertifitseerimisega ning
    tunnistatakse kehtetuks otsus 2010/470/EL
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/403, annettu 24 päivänä
