    malleista sekä yhdistettyjen eläinterveys- ja virallisten todistusten malleista
    tiettyjen maaeläinluokkien ja niiden sukusolujen ja alkioiden lähetysten unioniin
    tuloa ja jäsenvaltioiden välillä tapahtuvia siirtoja varten, tällaisia todistuksia
    koskevasta virallisesta sertifioinnista sekä päätöksen 2010/470/EU kumoamisesta
