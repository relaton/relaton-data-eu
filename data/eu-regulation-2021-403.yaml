title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/403 of 24 March 2021 laying
    down rules for the application of Regulations (EU) 2016/429 and (EU) 2017/625
    of the European Parliament and of the Council as regards model animal health certificates
    and model animal health/official certificates, for the entry into the Union and
    movements between Member States of consignments of certain categories of terrestrial
    animals and germinal products thereof, official certification regarding such certificates
    and repealing Decision 2010/470/EU
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/403 de la Commission du 24 mars 2021
    portant modalités d’application des règlements (UE) 2016/429 et (UE) 2017/625
    du Parlement européen et du Conseil en ce qui concerne les modèles de certificat
    zoosanitaire et les modèles de certificat zoosanitaire/officiel pour l’entrée
    dans l’Union et les mouvements entre les États membres d’envois de certaines
    catégories d’animaux terrestres et de leurs produits germinaux, ainsi qu’en
    ce qui concerne la certification officielle relative à ces certificats, et abrogeant
    la décision 2010/470/UE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/403 der Kommission vom 24 März 2021
    mit Durchführungsbestimmungen zu den Verordnungen (EU) 2016/429 und (EU) 2017/625
    des Europäischen Parlaments und des Rates hinsichtlich der Muster für Veterinärbescheinigungen,
    der Muster für amtliche Bescheinigungen und der Muster für Veterinär-/amtliche
    Bescheinigungen für den Eingang in die Union von Sendungen bestimmter Kategorien
    von Landtieren und ihres Zuchtmaterials und für deren Verbringungen zwischen
    Mitgliedstaaten, hinsichtlich der amtlichen Bescheinigungstätigkeit im Zusammenhang
    mit derartigen Bescheinigungen sowie zur Aufhebung des Beschlusses 2010/470/EU
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/403 на Комисията
    от 24 март 2021 година за определяне на правила
    за прилагането на регламенти (ЕС) 2016/429 и (ЕС)
    2017/625 на Европейския парламент и на Съвета по
    отношение на образците на ветеринарни здравни
    сертификати и на ветеринарни здравни/официални
    сертификати за въвеждане в Съюза и за движение
    между държави членки на пратки с определени
    категории сухоземни животни и със зародишни
    продукти от тях и по отношение на официалното
    сертифициране във връзка с тези сертификати
    и за отмяна на Решение 2010/470/ЕС
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/403 ze dne 24 března 2021, kterým
    se stanoví prováděcí pravidla k nařízením Evropského parlamentu a Rady
    (EU) 2016/429 a (EU) 2017/625, pokud jde o vzorová veterinární osvědčení
    a vzorová veterinární/úřední osvědčení pro vstup zásilek určitých
    kategorií suchozemských zvířat a jejich zárodečných produktů do Unie a
    jejich přemísťování mezi členskými státy a o úřední certifikaci týkající
    se těchto osvědčení, a kterým se zrušuje rozhodnutí 2010/470/EU
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/403 af 24. marts 2021
    om regler for anvendelsen af Europa-Parlamentets og Rådets forordning (EU) 2016/429
    og (EU) 2017/625 for så vidt angår standarddyresundhedscertifikater og kombinerede
    standarddyresundhedscertifikater/officielle standardcertifikater til brug ved
