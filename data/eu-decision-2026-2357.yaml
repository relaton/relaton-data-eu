  content: Council Decision (EU) 2026/2357 of 13 October 2026 on the position to be
    taken on behalf of the European Union within the European Committee for drawing
    up standards in the field of inland navigation and within the Central Commission
    for the Navigation of the Rhine concerning the adoption of the European Standard
    laying down Technical Requirements for Inland Navigation vessels, the European
    Standard for River Information Services and a draft amendment to the Rhine Vessel
    Inspection Regulations
  type: main
- language: fr
  script: Latn
