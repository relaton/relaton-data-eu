    um Dhrugaí Támhshuanacha maidir le sceidealú substaintí faoin gCoinbhinsiún
    Aonair um Dhrugaí Támhshuanacha 1961 arna leasú ag Prótacal 1972, agus faoin
    gCoinbhinsiún maidir le Substaintí Síceatrópacha 1971
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/391 od 3. ožujka 2022. o stajalištu koje treba
    zauzeti u ime Europske unije na 65. sjednici Komisije za opojne droge u pogledu
    uvrštavanja tvari na popise u Jedinstvenoj konvenciji o opojnim drogama iz 1961.,
    kako je izmijenjena Protokolom iz 1972., i Konvenciji o psihotropnim tvarima iz
    1971.
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/391 határozata (2022. március 3.) az 1972. évi jegyzőkönyvvel
    módosított, 1961. évi Egységes Kábítószer Egyezmény és a pszichotrop
    anyagokról szóló, 1971. évi egyezmény szerinti anyagjegyzékekbe való felvétel
    tekintetében a Kábítószer-bizottság 65. ülésszakán az Európai Unió által
    képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/391 del Consiglio del 3 marzo 2022 relativa alla posizione
    da adottare, a nome dell’Unione europea, alla sessantacinquesima sessione della
    commissione Stupefacenti sull’inclusione di sostanze nelle tabelle della Convenzione
    unica sugli stupefacenti del 1961, modificata dal Protocollo del 1972, e della
    Convenzione sulle sostanze psicotrope del 1971
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/391 (2022. gada 3. marts) par nostāju, kas Eiropas
    Savienības vārdā jāieņem Narkotisko vielu komisijas 65. sesijā par vielu
    pievienošanu sarakstos, kuri pievienoti 1961. gada Vienotajai konvencijai par
    narkotiskajām vielām, kas grozīta ar 1972. gada protokolu, un 1971. gada Konvencijai
    par psihotropajām vielām
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/391 2022 m. kovo 3 d. dėl pozicijos, kurios
    Europos Sąjungos vardu turi būti laikomasi 65-oje Narkotinių medžiagų komisijos
    sesijoje, dėl medžiagų įtraukimo į sąrašą pagal 1961 m. Bendrąją narkotinių
    medžiagų konvenciją su pakeitimais, padarytais 1972 m. protokolu, ir 1971 m.
    Psichotropinių medžiagų konvenciją
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/391 tat-3 ta’ Marzu 2022 dwar il-pożizzjoni
    li trid tittieħed f’isem l-Unjoni Ewropea fil-65 sessjoni tal-Kummissjoni dwar
    id-Drogi Narkotiċi dwar l-iskedar ta’ sustanzi taħt il-Konvenzjoni Unika dwar
    id-Drogi Narkotiċi tal-1961, kif emendata mill-Protokoll tal-1972, u l-Konvenzjoni
    dwar is-Sustanzi Psikotropiċi tal-1971
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/391 van de Raad van 3 maart 2022 betreffende het namens
    de Europese Unie op de 65e zitting van de Commissie verdovende middelen in te
    nemen standpunt over het toevoegen van stoffen aan de lijsten die gehecht zijn
    aan het Enkelvoudig Verdrag inzake verdovende middelen van 1961, zoals gewijzigd
    bij het Protocol van 1972, en aan het Verdrag inzake psychotrope stoffen van 1971
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/391 z dnia 3 marca 2022 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej podczas 65. posiedzenia Komisji
    ds. Środków Odurzających odnośnie do umieszczenia substancji w wykazach zgodnie
    z Jednolitą konwencją o środkach odurzających z 1961 r., zmienioną protokołem
    z 1972 r., oraz Konwencją o substancjach psychotropowych z 1971 r.
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/391 do Conselho de 3 de março de 2022 relativa à posição
    a tomar, em nome da União Europeia, na 65.a sessão da Comissão dos Estupefacientes,
    sobre as substâncias a incluir nas listas da Convenção Única sobre os Estupefacientes
    de 1961, alterada pelo Protocolo de 1972, e da Convenção sobre as Substâncias
    Psicotrópicas de 1971
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/391 a Consiliului din 3 martie 2022 privind poziția
    care urmează să fie adoptată, în numele Uniunii Europene, în cadrul celei
    de a 65-a sesiuni a Comisiei pentru stupefiante, cu privire la modificarea tabelelor
    de substanțe anexate la Convenția unică asupra stupefiantelor din 1961, astfel
    cum a fost modificată prin Protocolul din 1972, și la Convenția asupra substanțelor
    psihotrope din 1971
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/391 z 3. marca 2022 o pozícii, ktorá sa má
    v mene Európskej únie zaujať na 65. zasadnutí Komisie pre omamné látky v
    súvislosti so zaradením látok do zoznamov k Jednotnému dohovoru o omamných
    látkach z roku 1961 zmenenému protokolom z roku 1972 a k Dohovoru o psychotropných
    látkach z roku 1971
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/391 z dne 3. marca 2022 o stališču, ki se zastopa
    v imenu Evropske unije na 65. zasedanju Komisije ZN za droge o vključitvi snovi
    v tabele v okviru Enotne konvencije o mamilih iz leta 1961, kakor je bila spremenjena
    s Protokolom iz leta 1972, in Konvencije o psihotropnih substancah iz leta 1971
  type: main
