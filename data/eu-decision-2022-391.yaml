title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/391 of 3 March 2022 on the position to be taken
    on behalf of the European Union in the 65th session of the Commission on Narcotic
    Drugs on the scheduling of substances under the Single Convention on Narcotic
    Drugs of 1961, as amended by the 1972 Protocol, and the Convention on Psychotropic
    Substances of 1971
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/391 du Conseil du 3 mars 2022 relative à la position
    à prendre, au nom de l’Union européenne, lors de la soixante-cinquième session
    de la Commission des stupéfiants, en ce qui concerne l’inscription de substances
    aux tableaux annexés à la Convention unique sur les stupéfiants de 1961, telle
    que modifiée par le protocole de 1972, et à la Convention sur les substances
    psychotropes de 1971
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/391 des Rates vom 3. März 2022 über den im Namen
    der Europäischen Union auf der 65. Tagung der Suchtstoffkommission zur Aufnahme
    von Stoffen in die Anhänge des Einheits-Übereinkommens von 1961 über Suchtstoffe
    in der durch das Protokoll von 1972 geänderten Fassung und des Übereinkommens
    von 1971 über psychotrope Stoffe zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/391 на Съвета от 3 март 2022 година
    относно позицията, която трябва да се заеме
    от името на Европейския съюз на 65-ата сесия
    на Комисията за упойващите вещества по отношение
    на включването на вещества в списъците на Единната
    конвенция по упойващите вещества от 1961 г., изменена
    с Протокола от 1972 г., и на Конвенцията за психотропните
    вещества от 1971 г.
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/391 ze dne 3. března 2022 o postoji, který
    má být zaujat jménem Evropské unie na 65. zasedání Komise pro narkotika,
    pokud jde o zařazení látek na seznamy k Jednotné úmluvě o omamných látkách
    z roku 1961 ve znění protokolu z roku 1972 a k Úmluvě o psychotropních látkách
    z roku 1971
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/391 af 3. marts 2022 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det 65. møde i Kommissionen
    for Narkotiske Midler for så vidt angår optagelsen af stoffer i bilagene til
    enkeltkonventionen af 1961 angående narkotiske midler, som ændret ved protokollen
    af 1972, og konventionen af 1971 om psykotrope stoffer
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/391 του Συμβουλίου της 3ης
    Μαρτίου 2022 για τη θέση που πρέπει να ληφθεί,
    εξ ονόματος της Ευρωπαϊκής Ένωσης, κατά την
    65η σύνοδο της επιτροπής για τα ναρκωτικά όσον
    αφορά την καταχώριση ουσιών βάσει της ενιαίας
    σύμβασης του 1961 επί των ναρκωτικών, όπως τροποποιήθηκε
    από το πρωτόκολλο του 1972, και της σύμβασης για
    τις ψυχοτρόπους ουσίες του 1971
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/391, 3. märts 2022, Euroopa Liidu nimel võetava
    seisukoha kohta narkootiliste ainete komisjoni 65. istungjärgul seoses ainete
    kandmisega 1961. aasta narkootiliste ainete ühtse konventsiooni, mida on muudetud
    1972. aasta protokolliga, ja 1971. aasta psühhotroopsete ainete konventsiooni
    nimekirjadesse
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/391, annettu 3 päivänä maaliskuuta 2022,
    huumausainetoimikunnan 65. istunnossa Euroopan unionin puolesta otettavasta kannasta,
    joka koskee aineiden listaamista vuoden 1961 huumausaineyleissopimuksen, sellaisena
    kuin se on muutettuna vuoden 1972 pöytäkirjalla, ja psykotrooppisia aineita
    koskevan vuoden 1971 yleissopimuksen mukaisesti
  type: main
- language: ga
  script: Latn
