title:
- language: en
  script: Latn
  content: Commission Directive 65/400/EEC of 29 July 1965 setting the timetable for
    the phasing-out of the tax levied by the Federal Republic of Germany on imports
    from the other Member States of all agricultural and food products requiring import
    licences
  type: main
- language: fr
  script: Latn
  content: Directive 65/400/CEE de la Commission, du 29/07/65, portant fixation du
    rythme de suppression de l'imposition appliquée par la République fédérale
    allemande à l'importation de tous les produits agricoles et alimentaires soumis
    à licence d'importation en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: Richtlinie 65/400/EWG der Kommission vom 28. Juli 1965 zur Festlegung der
    Zeitfolge für die Aufhebung der von der Bundesrepublik Deutschland erhobenen
    Abgabe bei der Einfuhr aller Einfuhrgenehmigungspflichtigen Agrarerzeugnisse und
    Nahrungsmittel aus den Übrigen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS DIREKTIV AF 29. JULI 1965 VEDROERENDE FASTSAETTELSE AF DET
    TEMPO, I HVILKET DEN VED IMPORT TIL FORBUNDSREPUBLIKKEN TYSKLAND FRA DE OEVRIGE
    MEDLEMSSTATER PAALAGTE BESKATNING AF LANDBRUGSPRODUKTER OG LEVNEDSMIDLER, HVORTIL
    DER KRAEVES IMPORTTILLADELSE, SKAL AFVIKLES
  type: main
- language: it
  script: Latn
  content: Direttiva 65/400/CEE della Commissione, del 28 luglio 1965, che fissa il
    ritmo di soppressione dell'imposta applicata dalla Repubblica Federale di Germania
    all'importazione di tutti i prodotti agricoli e alimentari soggetti a licenze
    di importazione, in provenienza dagli altri Stati Membri
  type: main
- language: nl
  script: Latn
  content: RICHTLIJN VAN DE COMMISSIE VAN 28 JULI 1965 INZAKE DE VASTSTELLING VAN
    HET RITME VAN OPHEFFING VAN DE BELASTING, WELKE DE DUITSE BONDSREPUBLIEK BIJ DE
    INVOER UIT DE ANDERE LID-STATEN TOEPAST TEN AANZIEN VAN ALLE LANDBOUW- EN VOEDINGSPRODUKTEN
    WAARVOOR EEN INVOERVERGUNNING IS VEREIST ( 65/400/EEG )
  type: main
