title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2144/85 of 30 July 1985 specifying the extent
    to which applications lodged in July 1985 for import licences in respect of young
    male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2144/85 de la Commission, du 30 juillet 1985, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1985 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2144/85 der Kommission vom 30. Juli 1985 über das
    Ausmaß, in dem den im Juli 1985 eingereichten Anträgen auf Einfuhrlizenzen für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2144/85 af 30. juli 1985 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i juli
    1985, for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2144/85 της Επιτροπής
    της 30ής Ιουλίου 1985 περί καθορισμού με ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για έκδοση πιστοποιητικών εισαγωγής, που υποβλήθηκαν
    τον Ιούλιο του 1985, για τα νεαρά άρρενα βοοειδή
    που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2144/85 della Commissione, del 30 luglio 1985, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1985 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2144/85 van de Commissie van 30 juli 1985 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in juli 1985 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
