title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2022/82 of 23 July 1982 re-establishing
    the levying of customs duties on handkerchiefs, products of category 89 (code
    0890), originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2022/82 de la Commission, du 23 juillet 1982, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, de la catégorie 89 (code 0890), originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3602/81 du Conseils
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2022/82 der Kommission vom 23. Juli 1982 über die
    Wiedereinführung des Zollsatzes für Taschentücher der Warenkategorie Nr. 89
    (Kennziffer 0890), mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr.
    3602/81 des Rates vorgesehenen Zollpräferenzen gewährt werdenu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2022/82 af 23. juli 1982 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, under kategori 89 (kode 0890),
    som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3602/81o
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2022/82 τής Επιτροπής
    τής 23ης Ιουλίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά τά ρινόμακτρα
    καί μανδηλάκια θυλακίου, προϊόντων τής κατηγορίας
    89 (κώδικας 0890), καταγωγής Χόνγκ Κόνγκ, δικαιούχου
    τών προβλεπομένων στόν κανονισμό (EOK) αριθ.
    3602/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2022/82 della Commissione, del 23 luglio 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino, della categoria di prodotti n. 89 (codice 0890), originari di Hong
    Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n.
    3602/81 del Consiglioa
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2022/82 van de Commissie van 23 juli 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakdoeken
    van categorie van produkten 89 (codenummer 0890) van oorsprong uit Hong-Kong,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3602/81 van de Raade
  type: main
