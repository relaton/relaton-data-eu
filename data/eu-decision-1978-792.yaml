id: EUDecision1978792
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 September 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to unbleached fabrics of synthetic rayon staple fibres, falling
    within subheading ex 56.07 B of the Customs Tariff (NIMEXE code 56.07-42), originating
    in South Korea and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/792/CEE: Décision de la Commission, du 13 septembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les tissus écrus de fibres synthétiques
    de fibranne, de la sous-position Ex 56.07 B du Tarif douanier commun (code Nimexe
    56.07-42) originaires de la Corée du Sud et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. September 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Südkorea stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Gewebe aus synthetischer Zellwolle, roh, der Tarifstelle ex
    56.07 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffer 56.07-42) von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. september 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage ublegede stoffer af syntetiske rayon-stabelfibre, som henhører under
    pos. ex 56.07 B i den fælles toldtarif (NIMEXE-kode 56.07-42), har oprindelse
    i Sydkorea og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 13 settembre 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i tessuti greggi di fibre sintetiche di rayon fiocco
    della sottovoce ex 56.07 B della tariffa doganale comune (codice Nimexe: 56.07-42),
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 september 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd ongebleekte vezels van kunstmatige rayon-stapelvezels van post ex 56.07
    B van het gemeenschappelijk douanetarief (NIMEXE-code 56.07-42) van oorsprong
    uit Zuid-Korea en in de overige Lid-Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten
  type: main
