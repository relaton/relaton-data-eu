title:
- language: en
  script: Latn
  content: '91/603/EEC: Commission Decision of 14 November 1991 amending Decision
    89/279/EEC authorizing certain Member States provisionally to provide for derogations
    from certain provisions of Council Directive 77/93/EEC, in respect of plants of
    Juniperus L. originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '91/603/CEE: Décision de la Commission du 14 novembre 1991 modifiant la
    décision 89/279/CEE autorisant certains États membres à prévoir provisoirement
    des dérogations à certaines dispositions de la directive 77/93/CEE du Conseil
    pour les végétaux de Juniperus L. originaires du Japon'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 14. November 1991 zur Änderung der Entscheidung
    89/279/EWG zur einstweiligen Ermächtigung bestimmter Mitgliedstaaten, für Pflanzen
    von Juniperus L., mit Ursprung in Japan, Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen (91/603/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 14. november 1991 om ændring af beslutning
    89/279/EØF om midlertidig bemyndigelse af visse medlemsstater til at undtage
    planter af Juniperus L. med oprindelse i Japan fra visse bestemmelser i Rådets
    direktiv 77/93/EØF (91/603/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/603/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
    Νοεμβρίου 1991 για την τροποποίηση της οδηγίας
    89/279/ΕΟΚ που επιτρέπει σε ορισμένα κράτη μέλη
    να προβλέπουν προσωρινά παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ όσον αφορά τα
    φυτά του είδους Juniperus L., καταγωγής Ιαπωνίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 14 novembre 1991 che modifica la decisione
    89/279/CEE, che autorizza provvisoriamente alcuni Stati membri a stabilire deroghe
    a determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto
    riguarda i vegetali di Juniperus L. originari del Giappone (91/603/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 14 november 1991 tot wijziging van Beschikking
    89/279/EEG houdende machtiging van bepaalde Lid-Staten om, voor planten van Juniperus
    L., van oorsprong uit Japan, voorlopig afwijkingen toe te staan van sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad (91/603/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 14 de Novembro de 1991 que altera a Decisão
    89/279/CEE, que autoriza certos Estados-membros a prever provisoriamente derrogações
    a determinadas disposições da Directiva 77/93/CEE do Conselho, para plantas
    de Juniperus L. originárias do Japão (91/603/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 14 de noviembre de 1991 que modifica la Decisión
    89/279/CEE por la que se autoriza provisionalmente a determinados Estados miembros
    para establecer excepciones a algunas disposiciones de la Directiva 77/93/CEE
    del Consejo en relación con los vegetales de Juniperus L. originarios de Japón
    (91/603/CEE) #'
