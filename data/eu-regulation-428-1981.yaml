title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 428/81 of 19 February 1981 amending Regulation
    (EEC) No 3244/80 fixing an additional rate for determining the quantities of alcohol
    to be delivered for compulsory distillation for the 1980/81 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 428/81 de la Commission, du 19 février 1981, modifiant
    le règlement (CEE) n° 3244/80 fixant un taux supplémentaire pour la détermination
    des quantités d' alcool à livrer dans le cadre des prestations viniques pour
    la campagne 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 428/81 der Kommission vom 19. Februar 1981 zur Änderung
    der Verordnung (EWG) Nr. 3244/80 zur Festsetzung eines zusätzlichen Satzes für
    die Bestimmung der im Rahmen der obligatorischen Destillation zu liefernden Alkoholmenge
    für das Wirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 428/81 af 19. februar 1981 om ændring
    af forordning (EØF) nr. 3244/80 om fastsættelse af en tillægssats for fastlæggelse
    af de mængder alkohol, der skal indleveres inden for rammerne af de pligtige
    vinydelser for produktionsåret 1980/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 428/81 τής Επιτροπής
    τής 19ης Φεβρουαρίου 1981 περί τροποποιήσεως
