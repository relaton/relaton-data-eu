    συμπληρωματικού ποσοστού γιά τόν προσδιορισμό
    τών ποσοτήτων αλκοόλης οι οποίες πρέπει νά
    παραδοθούν στό πλαίσιο τών οινικών παρακρατημάτων
    γιά τήν περίοδο εμπορίας 1980/81»
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 428/81 della Commissione, del 19 febbraio 1981, che
