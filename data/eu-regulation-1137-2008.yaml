id: EURegulation11372008
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EC) No 1137/2008 of the European Parliament and of the Council
    of 22 October 2008 adapting a number of instruments subject to the procedure laid
    down in Article 251 of the Treaty to Council Decision 1999/468/EC, with regard
    to the regulatory procedure with scrutiny — Adaptation to the regulatory procedure
    with scrutiny — Part One
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1137/2008 du Parlement européen et du Conseil du 22
    octobre 2008 portant adaptation à la décision 1999/468/CE du Conseil de certains
    actes soumis à la procédure visée à l'article 251 du traité, en ce qui concerne
    la procédure de réglementation avec contrôle — Adaptation à la procédure
    de réglementation avec contrôle — première partie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1137/2008 des Europäischen Parlaments und des Rates
    vom 22. Oktober 2008 zur Anpassung einiger Rechtsakte, für die das Verfahren
    des Artikels 251 des Vertrags gilt, an den Beschluss 1999/468/EG des Rates in
    Bezug auf das Regelungsverfahren mit Kontrolle — Anpassung an das Regelungsverfahren
    mit Kontrolle — Erster Teil
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1137/2008 на Европейския парламент
    и на Съвета от 22 октомври 2008 година за адаптиране
    към Решение 1999/468/ЕО на Съвета на някои актове,
    за които се прилага процедурата, предвидена
    в член 251 от Договора, във връзка с процедурата
    по регулиране с контрол — Адаптиране към процедурата
    по регулиране с контрол — част първа
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 1137/2008 ze dne 22.
    října 2008 o přizpůsobení některých aktů přijatých postupem podle článku
    251 Smlouvy regulativnímu postupu s kontrolou podle rozhodnutí Rady 1999/468/ES
    – Přizpůsobení regulativnímu postupu s kontrolou – Část první
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EF) nr. 1137/2008 af 22. oktober
    2008 om tilpasning til Rådets afgørelse 1999/468/EF af visse retsakter, der
    er omfattet af proceduren i traktatens artikel 251, for så vidt angår forskriftsproceduren
    med kontrol — Tilpasning til forskriftsproceduren med kontrol — Del 1
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1137/2008 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, της 22ας Οκτωβρίου
    2008 , για την προσαρμογή στην απόφαση 1999/468/ΕΚ
    του Συμβουλίου ορισμένων πράξεων που υπόκεινται
    στη διαδικασία του άρθρου 251 της συνθήκης, όσον
    αφορά την κανονιστική διαδικασία με έλεγχο
    — Προσαρμογή στην κανονιστική διαδικασία
    με έλεγχο — Μέρος Ι
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EÜ) nr 1137/2008, 22. oktoober
    2008 , millega kohandatakse teatavaid asutamislepingu artiklis 251 sätestatud
    menetluse kohaseid õigusakte vastavalt nõukogu otsusele 1999/468/EÜ seoses
    kontrolliga regulatiivmenetlusega – Kohandamine kontrolliga regulatiivmenetlusega
    – Esimene osa
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EY) N:o 1137/2008, annettu 22
    päivänä lokakuuta 2008 , eräiden perustamissopimuksen 251 artiklassa määrätyn
    menettelyn soveltamisalaan kuuluvien säädösten mukauttamisesta neuvoston päätökseen
    1999/468/EY valvonnan käsittävän sääntelymenettelyn osalta — Mukauttaminen
    valvonnan käsittävään sääntelymenettelyyn — Ensimmäinen osa
  type: main
- language: ga
  script: Latn
  content: Rialachán (CE) Uimh. 1137/2008 ó Pharlaimint na hEorpa agus ón gComhairle
    an 22 Deireadh Fómhair 2008 lena n-oiriúnaítear líon ionstraimí atá faoi
    réir an nós imeachta a leagtar síos in Airteagal 251 den Chonradh do Chinneadh
    1999/468/CE ón gComhairle, maidir leis an nós imeachta rialúcháin lena ngabhann
    grinnscrúdú – Oiriúnú don nós imeachta rialúcháin lena ngabhann grinnscrúdú
    – Cuid a hAon
  type: main
- language: hr
  script: Latn
  content: Uredba (EZ) br. 1137/2008 Europskog parlamenta i Vijeća od 22. listopada
    2008. o prilagodbi nekih instrumenata podložnih postupku utvrđenom u članku
    251. Ugovora, Odluci Vijeća 1999/468/EZ u vezi s regulatornim postupkom s kontrolom
    Prilagodba regulatornom postupku s kontrolom — prvi dio
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 1137/2008/EK rendelete ( 2008. október
    22. ) a Szerződés 251. cikkében meghatározott eljárás alá tartozó egyes
    jogi aktusoknak az ellenőrzéssel történő szabályozási bizottsági eljárás
    tekintetében történő, az 1999/468/EK tanácsi határozat szerinti kiigazításáról
    – Az ellenőrzéssel történő szabályozási bizottsági eljáráshoz történő
    hozzáigazítás – Első rész
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1137/2008 del Parlamento europeo e del Consiglio, del
    22 ottobre 2008 , che adegua alla decisione 1999/468/CE del Consiglio determinati
    atti soggetti alla procedura di cui all’articolo 251 del trattato, per quanto
    riguarda la procedura di regolamentazione con controllo — Adeguamento alla procedura
    di regolamentazione con controllo — Prima parte
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (EK) Nr. 1137/2008 ( 2008. gada 22.
    oktobris ), ar ko vairākus instrumentus, kuriem piemēro Līguma 251. pantā
    noteikto procedūru, pielāgo Padomes Lēmumam 1999/468/EK attiecībā uz regulatīvo
    kontroles procedūru – Pielāgošana regulatīvajai kontroles procedūrai –
    pirmā daļa
  type: main
- language: lt
  script: Latn
  content: 2008 m. spalio 22 d. Europos Parlamento ir Tarybos reglamentas (EB) Nr.
    1137/2008 dėl kai kurių teisės aktų, kuriems taikoma Sutarties 251 straipsnyje
    nustatyta tvarka, nuostatų, susijusių su reguliavimo procedūra su tikrinimu,
    suderinimo su Tarybos sprendimu 1999/468/EB. Suderinimas su reguliavimo procedūra
    su tikrinimu. Pirmoji dalis
  type: main
- language: mt
  script: Latn
  content: Regolament (KE) Nru 1137/2008 tal-Parlament Ewropew u tal-Kunsill tat-
    22 ta' Ottubru 2008 li jadatta numru ta' strumenti suġġetti għall-proċedura
    stabbilita fl-Artikolu 251 tat-Trattat għad-Deċiżjoni tal-Kunsill 1999/468/KE,
    tal-proċedura regolatorja bi skrutinju – Adattament għall-proċedura regolatorja
    bi skrutinju – L-Ewwel Parti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1137/2008 Van het Europees Parlement en de Raad van
    22 oktober 2008 tot aanpassing aan Besluit 1999/468/EG van de Raad van een aantal
    besluiten waarop de procedure van artikel 251 van het Verdrag van toepassing is,
    wat de regelgevingsprocedure met toetsing betreft — Aanpassing aan de regelgevingsprocedure
    met toetsing — Deel een
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (WE) nr 1137/2008 z dnia
    22 października 2008 r. dostosowujące do decyzji Rady 1999/468/WE niektóre
    akty podlegające procedurze ustanowionej w art. 251 Traktatu, w zakresie procedury
    regulacyjnej połączonej z kontrolą – Dostosowanie do procedury regulacyjnej
    połączonej z kontrolą – Część pierwsza
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1137/2008 do Parlamento Europeu e do Conselho, de
    22 de Outubro de 2008 , que adapta à Decisão 1999/468/CE do Conselho certos
    actos sujeitos ao procedimento previsto no artigo 251. o do Tratado, no que se
    refere ao procedimento de regulamentação com controlo — Adaptação ao procedimento
    de regulamentação com controlo — Primeira Parte
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1137/2008 al Parlamentului European și al Consiliului
    din 22 octombrie 2008 de adaptare la Decizia 1999/468/CE a Consiliului a anumitor
    acte care fac obiectul procedurii prevăzute la articolul 251 din tratat, în
    ceea ce privește procedura de reglementare cu control – Adaptare la procedura
    de reglementare cu control – Partea întâi
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (ES) č. 1137/2008 z 22. októbra
    2008 o prispôsobení určitých nástrojov, na ktoré sa vzťahuje postup ustanovený
    v článku 251 zmluvy, rozhodnutiu Rady 1999/468/ES, pokiaľ ide o regulačný
    postup s kontrolou – Prispôsobenie právnych aktov regulačnému postupu s
    kontrolou – Prvá časť
  type: main
- language: sl
  script: Latn
  content: Uredba (ES) št. 1137/2008 Evropskega parlamenta in Sveta z dne 22. oktobra
    2008 o prilagoditvi nekaterih aktov, za katere se uporablja postopek, določen
    v členu 251 Pogodbe, Sklepu Sveta 1999/468/ES, glede regulativnega postopka s
    pregledom – Prilagoditev regulativnemu postopku s pregledom – Prvi del
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1137/2008 del Parlamento Europeo y del Consejo, de
    22 de octubre de 2008 , por el que se adaptan a la Decisión 1999/468/CE del Consejo
    determinados actos sujetos al procedimiento establecido en el artículo 251 del
    Tratado, en lo que se refiere al procedimiento de reglamentación con control
    — Adaptación al procedimiento de reglamentación con control — Primera parte
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EG) nr 1137/2008 av den 22
    oktober 2008 om anpassning till rådets beslut 1999/468/EG av vissa rättsakter
    som omfattas av det förfarande som anges i artikel 251 i fördraget, med avseende
    på det föreskrivande förfarandet med kontroll – Anpassning till det föreskrivande
    förfarandet med kontroll – Del I
  type: main
