    määristä raakatupakka-alalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 640/2003 della Commissione, del 9 aprile 2003, che
    stabilisce i quantitativi che possono essere trasferiti ad un altro gruppo di
    varietà nel quadro del limite di garanzia per il raccolto 2003 nel settore del
    tabacco greggio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 640/2003 van de Commissie van 9 april 2003 tot vaststelling,
