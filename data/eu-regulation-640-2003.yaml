    που μπορούν να μεταφερθούν προς άλλη ομάδα
    ποικιλιών στο πλαίσιο του κατωφλίου εγγύησης
    για τη συγκομιδή του 2003 στον τομέα του ακατέργαστου
    καπνού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 640/2003, annettu 9 päivänä huhtikuuta 2003,
