    által nyújtható egyedi vagy általános eltérésekkel érintett tejalapú
    termékek jegyzékének létrehozásáról, valamint az ilyen termékek előállítására
    vonatkozó eltérések jellegének megállapításáról szóló, 1996. július
    29-i 96/536/EK bizottsági határozat felváltásáról
  type: main
- language: it
  script: Latn
  content: '97/284/CE: Decisione della Commissione del 25 aprile 1997 che sostituisce
    la decisione 96/536/CE che stabilisce l''elenco dei prodotti a base di latte per
    i quali gli Stati membri sono autorizzati a concedere deroghe individuali o generali
    ai sensi dell''articolo 8, paragrafo 2 della direttiva 92/46/CEE, nonché la natura
    delle deroghe applicabili alla fabbricazione di tali prodotti'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1997. gada 25. aprīlis), ar ko aizstāj Komisijas Lēmumu
    96/536/EK par tādu piena produktu saraksta izveidošanu, kuriem dalībvalstis
    drīkst piešķirt individuāla vai vispārēja rakstura atkāpes saskaņā ar
    Direktīvas 92/46/EEK 8. panta 2. punktu, un par to atkāpju raksturu, kas attiecas
    uz šo produktu ražošanu
  type: main
- language: lt
  script: Latn
  content: 1997 m. balandžio 25 d. Komisijos sprendimas, keičiantis 1996 m. liepos
    29 d. Komisijos sprendimą 96/536/EB, nustatantį pieno pagrindo produktų, kuriems
    valstybėms narėms leidžiama taikyti atskiras arba bendras leidžiančias nukrypti
    nuostatas, pagal Direktyvos 92/46/EEB 8 straipsnio 2 dalį, ir leidžiančių
    nukrypti nuostatų, taikomų tokių produktų gamybai pobūdį, sąrašą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-25 ta’April 1997 li tieħu l-post
    tad-Deċżjoni tal-Kummissjoni 96/536/KE tad-29 ta’ Lulju 1996 li tistabbilixxi
    l-lista tal-prodotti msejsa fuq il-ħalib li rigward tagħhom l-Istati Membri
    huma awtorizzati li jikkonċedu derogi individwali u ġenerali skond l-Artikolu
    8(2) tad-Direttiva 92/46/KEE u n-natura tad-derogi li japplikaw għall-fabbrikazzjoni
    ta’ dawn il-prodotti
  type: main
- language: nl
  script: Latn
  content: '97/284/EG: Beschikking van de Commissie van 25 april 1997 houdende vervanging
    van Beschikking 96/536/EG tot vaststelling van de lijst van producten op basis
    van melk waarvoor de lidstaten toestemming krijgen om afzonderlijke of algemene
    afwijkingen toe te staan op grond van artikel 8, lid 2, van Richtlijn 92/46/EEG
    van de Raad, en van de aard van de met betrekking tot de bereiding van die producten
    geldende afwijkingen'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 25 kwietnia 1997 r. zastępująca decyzję Komisji
    96/536/WE z dnia 29 lipca 1996 r. ustanawiającą wykaz produktów na bazie mleka,
    odnośnie do których Państwa Członkowskie są upoważnione do udzielania indywidualnych
    lub ogólnych odstępstw na podstawie art. 8 ust. 2 dyrektywy 92/46/EWG oraz charakter
    tych odstępstw stosowanych przy wytwarzaniu takich produktów
  type: main
- language: pt
  script: Latn
  content: '97/284/CE: Decisão da Comissão de 25 de Abril de 1997 que substitui
    a Decisão 96/536/CE da Comissão, que estabelece a lista de produtos à base
    de leite relativamente aos quais os Estados-membros são autorizados a conceder
    derrogações individuais ou gerais ao abrigo do nº 2 do artigo 8º da Directiva
    92/46/CEE, bem como a natureza das derrogações aplicáveis ao fabrico desses
    produtos'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 25 aprilie 1997 de înlocuire a Deciziei 96/536/CE
    a Comisiei de stabilire a listei produselor pe bază de lapte pentru care statele
    membre sunt autorizate să acorde derogări individuale sau generale în temeiul
    articolului 8 alineatul (2) din Directiva 92/46/CEE, precum și natura derogărilor
    care se aplică fabricării acestor produse
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 25. apríla 1997, ktorým sa nahrádza rozhodnutie
    Komisie 96/536/ES z 29. júla 1996 zostavujúce zoznam výrobkov na báze mlieka,
    vzhľadom ku ktorým sú členské štáty autorizované udeliť individuálne
    alebo všeobecné výnimky podľa článku 8 (2) smernice 92/46/EHS stanovujúce
    charakter výnimiek uplatniteľných na výrobu takýchto výrobkov
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 25. aprila 1997 o nadomestitvi Odločbe Komisije
    96/536/ES z dne 29. julija 1996 o določitvi seznama izdelkov na osnovi mleka,
    glede katerih so države članice pooblaščene, da odobrijo posamezna ali splošna
    odstopanja v skladu s členom 8(2) Direktive 92/46/EGS in vrsto odstopanj, ki
    se uporabljajo za izdelavo takih izdelkov
  type: main
- language: es
  script: Latn
  content: '97/284/CE: Decisión de la Comisión de 25 de abril de 1997 que sustituye
    la Decisión 96/536/CE por la que se establece la lista de productos lácteos
    para los que los Estados miembros se hallan autorizados a conceder excepciones
    individuales o generales con arreglo al apartado 2 del artículo 8 de la Directiva
    92/46/CEE, así como el tipo de excepciones aplicables a la fabricación de dichos
    productos'
  type: main
- language: sv
  script: Latn
  content: '97/284/EG: Kommissionens beslut av den 25 april 1997 om att ersätta kommissionens
    beslut 96/536/EG om upprättande av en förteckning över mjölkbaserade produkter
    för vilka medlemsstaterna tillåts bevilja individuella eller allmänna undantag
    enligt artikel 8.2 i direktiv 92/46/EEG samt karaktären av undantag som är tillämpliga
    för tillverkningen av dessa produkter'
