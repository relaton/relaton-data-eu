title:
- language: en
  script: Latn
  content: '97/284/EC: Commission Decision of 25 April 1997 replacing Commission Decision
    96/536/EC of 29 July 1996 establishing the list of milk-based products in respect
    of which Member States are authorized to grant individual or general derogations
    pursuant to Article 8 (2) of Directive 92/46/EEC and the nature of the derogations
    applicable to the manufacture of such products'
  type: main
- language: fr
  script: Latn
  content: '97/284/CE: Décision de la Commission du 25 avril 1997 remplaçant la
    décision de la Commission 96/536/CE établissant la liste des produits à base
    de lait pour lesquels les États membres sont autorisés à accorder des dérogations
    individuelles ou générales au titre de l''article 8 paragraphe 2 de la directive
    92/46/CEE, ainsi que la nature des dérogations applicables à la fabrication
    de ces produits'
  type: main
- language: de
  script: Latn
  content: '97/284/EG: Entscheidung der Kommission vom 25. April 1997 zum Ersatz der
    Entscheidung 96/536/EG der Kommission zur Festlegung des Verzeichnisses der Milcherzeugnisse,
    für die die Mitgliedstaaten gemäß Artikel 8 Absatz 2 der Richtlinie 92/46/EWG
    Einzelausnahmen oder allgemeine Ausnahmen gewähren können, sowie der Art der
    Ausnahmeregelung für die Herstellung dieser Erzeugnisse'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 25 април 1997 година
    за замяна на Решение 96/536/ЕО от 29 юли 1996 година
    относно установяване на списък на продуктите
    на млечна основа, по отношение на които държавите-членки
    имат право да предоставят индивидуални или
    общи дерогации съгласно член 8, параграф 2 от
    Директива 92/46/ЕИО и за определяне на вида на
    дерогациите, прилагани за производството на
    тези продукти
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 25. dubna 1997, kterým se nahrazuje rozhodnutí
    Komise 96/536/ES ze dne 29. července 1996, kterým se stanoví seznam mléčných
    výrobků, pro které mohou členské státy přiznat individuální nebo obecné
    odchylky podle čl. 8 odst. 2 směrnice 92/46/EHS, a druh odchylek použitých
    při výrobě těchto výrobků
  type: main
- language: da
  script: Latn
  content: '97/284/EF: Kommissionens Beslutning af 25. april 1997 om nyaffattelse
    af beslutning 96/536/EF om fastsættelse af listen over de mælkebaserede produkter,
    for hvilke medlemsstaterne kan indrømme individuelle eller generelle undtagelser
    efter artikel 8, stk. 2, i direktiv 92/46/EØF, og om arten af de undtagelser,
    der gælder for fremstillingen af disse produkter'
  type: main
- language: el
  script: Grek
  content: '97/284/ΕΚ: Απόφαση της Επιτροπής της 25ης Απριλίου
    1997 για την αντικατάσταση της απόφασης 96/536/ΕΚ
    για την κατάρτιση του πίνακα των προϊόντων
    με βάση το γάλα για τα οποία δόθηκε άδεια στα
    κράτη μέλη να παραχωρήσουν μεμονωμένες ή γενικές
    παρεκκλίσεις δυνάμει του άρθρου 8 παράγραφος
    2 της οδηγίας 92/46/ΕΟΚ, καθώς και το χαρακτήρα
    των παρεκκλίσεων που εφαρμόζονται κατά την
    παρασκευή των προϊόντων αυτών'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 25. aprill 1997, millega asendatakse komisjoni 29. juuli
    1996. aasta otsus 96/536/EÜ, millega kehtestatakse selliste piimapõhiste toodete
    loetelu, mille puhul on liikmesriikidel lubatud kehtestada konkreetseid või üldisi
    erandeid vastavalt direktiivi 92/46/EMÜ artikli 8 lõikele 2, ja kõnealuste
    toodete valmistamisel kohaldatavate erandite laad
  type: main
- language: fi
  script: Latn
  content: '97/284/EY: Komission päätös, tehty 25 päivänä huhtikuuta 1997, sellaisia
    maitopohjaisia tuotteita, joiden osalta jäsenvaltiot voivat myöntää yksittäisiä
    tai yleisiä poikkeuksia direktiivin 92/46/ETY 8 artiklan 2 kohdan mukaisesti,
    koskevan luettelon laatimisesta ja näiden tuotteiden valmistukseen sovellettavien
    poikkeusten luonteesta tehdyn komission päätöksen 96/536/EY korvaamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1997. április 25.) a 92/46/EGK irányelv 8.
