  content: Commission Delegated Regulation (EU) 2022/891 of 1 April 2022 amending
    Delegated Regulation (EU) No 664/2014 supplementing Regulation (EU) No 1151/2012
    of the European Parliament and of the Council with regard to the establishment
    of the Union symbols for protected designations of origin, protected geographical
    indications and traditional specialities guaranteed and with regard to certain
    rules on sourcing, certain procedural rules and certain additional transitional
    rules
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/891 de la Commission du 1er avril 2022
    modifiant le règlement délégué (UE) no 664/2014 complétant le règlement
    (UE) no 1151/2012 du Parlement européen et du Conseil en ce qui concerne l’établissement
    des symboles de l’Union pour les appellations d’origine protégées, les indications
    géographiques protégées et les spécialités traditionnelles garanties et en
    ce qui concerne certaines règles relatives à la provenance, certaines règles
    procédurales et certaines règles transitoires supplémentaires
  type: main
- language: de
