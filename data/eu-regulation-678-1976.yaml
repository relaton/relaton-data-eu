title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 678/76 of 26 March 1976 re-establishing
    the levying of customs duties on terry towelling and similar terry fabrics of
    cotton falling within heading No 55.08, originating in developing countries to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3002/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 678/76 de la Commission, du 26 mars 1976, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    coton bouclés du genre éponge, de la position tarifaire 55.08, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3002/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 678/76 der Kommission vom 26. März 1976 über die
    Wiedereinführung des Zollsatzes für Schlingengewebe (Frottiergewebe) aus Baumwolle,
    der Tarifnummer 55.08, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3002/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 678/76 af 26. marts 1976 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld under position 55.08, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3002/75
    af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 678/76 della Commissione, del 26 marzo 1976, che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di cotone ricci del tipo
    spugna, della voce doganale n. 55.08, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3002/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 678/76 van de Commissie van 26 maart 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bad- of frotteerstof
    (lussendoek) van katoen, van tariefpost 55.08, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 3002/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
