title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2216/83 of 2 August 1983 re-establishing
    the levying of customs duties on shirts and T-shirts, products of category 4 (code
    0040) and originating in Indonesia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2216/83 de la Commission du 2 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux chemises, chemisettes, "T-shirts",
    de la catégorie de produits 4 (code 0040), originaires de l' Indonésie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2216/83 der Kommission vom 2. August 1983 über die
    Wiedereinführung des Zollsatzes für Oberhemden, Unterhemden und T-Shirts der
    Warenkategorie Nr. 4 (Kennziffer 0040), mit Ursprung in Indonesien, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2216/83 af 2. august 1983 om genindførelse
    af opkrævning af toldafgifter for skjorter og T-shirts, under kategori nr. 4
    (kode 0040), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2216/83 της Επιτροπής
    της 2ας Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα υποκάμισα
    και υποκαμισάκια, T-shirts, προϊόντα της κατηγορίας
    4 (κωδικός 0040), καταγωγής Ινδονησίας, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2216/83 della Commissione del 2 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle camicie, camicette, T-shirts,
    della categoria di prodotti n. 4 (codice 0040), originari dell' Indonesia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2216/83 van de Commissie van 2 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op overhemden,
    sporthemden, T-shirts, van de categorie van produkten nr. 4 (codenummer 0040),
    van oorsprong uit Indonesië, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
