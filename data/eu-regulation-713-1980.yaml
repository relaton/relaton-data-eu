  content: Commission Regulation (EEC) No 713/80 of 26 March 1980 implementing Regulation
    (EEC) No 649/80 laying down rules for the registration of petroleum product imports
    in the Community in accordance with Regulation (EEC) No 1893/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 713/80 de la Commission, du 26 mars 1980, portant
