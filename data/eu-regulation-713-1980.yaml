    est effectué l' enregistrement dans la Communauté des importations de produits
    pétroliers instauré par le règlement (CEE) n° 1893/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 713/80 der Kommission vom 26. März 1980 zur Durchführung
