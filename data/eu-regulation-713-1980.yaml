    (EWG) Nr. 1893/79 vorgesehene Registrierung der Einfuhren von Mineralölerzeugnissen
    in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 713/80 af 26. marts 1980 om gennemførelse
