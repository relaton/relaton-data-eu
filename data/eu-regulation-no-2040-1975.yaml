title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2040/75 of the Commission of 1 August 1975 adjusting
    the compensatory amounts and variable components, applicable during the third
    quarter of 1975 on the importation of goods covered by Regulation (EEC) No 1059/69
    and containing maize or rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2040/75 de la Commission, du 1er août 1975, modifiant
    les montants compensatoires et les éléments mobiles applicables, pendant le
    troisième trimestre de l'année 1975, à l'importation de marchandises, relevant
    du règlement (CEE) n 1059/69, contenant du maïs ou du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2040/75 der Kommission vom 1. August 1975 zur Änderung
    der Ausgleichsbeträge und beweglichen Teilbeträge für das dritte Vierteljahr
    1975 bei der Einfuhr von Waren, die Mais oder Reis enthalten und unter die Verordnung
    (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2040/75 af 1. august 1975 om berigtigelse
    af de udligningsbeløb og variable elementer, som i tredje kvartal af 1975 skal
    anvendes ved indførsel af varer, henhørende under forordning (EØF) nr. 1059/69
    og indeholdende majs eller ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2040/75 della Commissione, del 1 agosto 1975, che
    modifica gli importi compensativi e gli elementi mobili applicabili durante il
    terzo trimestre dell'anno 1975, all'importazione delle merci cui si applica il
    regolamento (CEE) n. 1059/69, contenenti granturco e riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2040/75 van de Commissie van 1 augustus 1975 houdende
    wijziging van de variabele elementen en compenserende bedragen, toepasselijk gedurende
    het derde kwartaal van 1975 bij invoer van onder Verordening (EEG) nr. 1059/69
    vallende goederen welke maïs of rijst bevatten
  type: main
