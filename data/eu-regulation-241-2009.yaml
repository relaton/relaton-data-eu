title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 241/2009 of 20 March 2009 initiating a new
    exporter review of Council Regulation (EC) No 1911/2006 imposing a definitive
    anti-dumping duty on imports of solutions of urea and ammonium nitrate originating,
    inter alia , in Russia, repealing the duty with regard to imports from one exporter
    in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 241/2009 de la Commission du 20 mars 2009 portant ouverture
    d’un réexamen au titre de nouvel exportateur du règlement (CE) n o 1911/2006
    du Conseil instituant un droit antidumping définitif sur les importations de
    solutions d’urée et de nitrate d’ammonium originaires, entre autres, de Russie,
    abrogeant le droit applicable aux importations d’un exportateur de ce pays et
    soumettant les importations en question à enregistrement
  type: main
