    vonatkozó végleges dömpingellenes vám kivetéséről szóló 1911/2006/EK
    tanácsi rendelet új exportőr tekintetében történő felülvizsgálatának
    megindításáról és az ezen ország egyik exportőrétől származó behozatalra
