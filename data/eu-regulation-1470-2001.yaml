    un droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les importations de lampes fluorescentes compactes à ballast électronique
    intégré (CFL-i) originaires de la République populaire de Chine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1470/2001 des Rates vom 16. Juli 2001 zur Einführung
