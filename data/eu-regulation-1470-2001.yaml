title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1470/2001 of 16 July 2001 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duty imposed on
    imports of integrated electronic compact fluorescent lamps (CFL-i) originating
    in the People's Republic of China
  type: main
- language: fr
  script: Latn
