title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1403/82 of 4 June 1982 re-establishing the
    levying of customs duties on methylamine, dimethylamine and trimethylamine and
    their salts, falling within subheading 29.22 A I and originating in Romania, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1403/82 de la Commission, du 4 juin 1982, portant
    rétablissement de la perception des droits de douane applicables à la méthylamine,
    diméthylamine, triméthylamine et leurs sels, de la sous-position 29.22 A I du
    tarif douanier commun, originaires de Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1403/82 der Kommission vom 4. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für Methylamin, Dimethylamin und Trimethylamin und ihre
    Salze der Tarifstelle 29.22 A I, mit Ursprung in Rumänien, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werdenZ
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1403/82 af 4. juni 1982 om genindførelse
    af opkrævning af told for methylamin, dimethylamin og trimethylamin samt salte
    deraf, henhørende under pos. 29.22 A I og med oprindelse i Rumænien, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3601/81n
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1403/82 τής Επιτροπής
    τής 4ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά μεθυλαμίνη, διμεθυλαμίνη
    καί τριμεθυλαμίνη καί τά άλατα αυτών τής διακρίσεως
    29. 22 Α Ι τού Κοινού Δασμολογίου, καταγωγής Ρουμανίας,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1403/82 della Commissione, del 4 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili alla metilammina, alla
    dimetilammina e trimetilammina, e loro sali, della sottovoce 29.22 A I della tariffa
    doganale comune, originarie della Romania, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1403/82 van de Commissie van 4 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op methylamine,
    dimethylamine en trimethylamine, alsmede zouten daarvan, van postonderverdeling
    29.22 A I, van oorsprong uit Roemenië, waarvoor de in Verordening (EEG) nr. 3601/81
    van de Raad vermelde tariefpreferenties zijn verleend
