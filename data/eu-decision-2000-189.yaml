title:
- language: en
  script: Latn
  content: '2000/189/EC: Commission Decision of 24 February 2000 authorising the Member
    States temporarily to provide for derogations from certain provisions of Council
    Directive 77/93/EEC in respect of plants of Vitis L., other than fruits, originating
    in Switzerland (notified under document number C(2000) 397)'
  type: main
- language: fr
  script: Latn
  content: '2000/189/CE: Décision de la Commission, du 24 février 2000, autorisant
    les États membres à prévoir à titre temporaire des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil pour les végétaux de Vitis
    L., à l''exception des fruits, originaires de Suisse [notifiée sous le numéro
    C(2000) 397]'
  type: main
- language: de
  script: Latn
  content: '2000/189/EG: Entscheidung der Kommission vom 24. Februar 2000 zur Ermächtigung
    der Mitgliedstaaten, für Pflanzen von Vitis L., außer Früchten, mit Ursprung
    in der Schweiz vorübergehend Ausnahmen von bestimmten Vorschriften der Richtlinie
    77/93/EWG des Rates zuzulassen (Bekanntgegeben unter Aktenzeichen K(2000) 397)'
  type: main
- language: da
  script: Latn
  content: '2000/189/EF: Kommissionens beslutning af 24. februar 2000 om bemyndigelse
    af medlemsstaterne til midlertidigt at indrømme undtagelser fra visse bestemmelser
    i Rådets direktiv 77/93/EØF for planter af Vitis L., dog ikke frugter, med oprindelse
    i Schweiz (meddelt under nummer K(2000) 397)'
  type: main
- language: el
  script: Grek
  content: '2000/189/ΕΚ: Απόφαση της Επιτροπής, της 24ης
    Φεβρουαρίου 2000, που επιτρέπει στα κράτη μέλη
    να παρέχουν προσωρινά παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    σχετικά με τα φυτά Vitis L., με εξαίρεση τους καρπούς,
    καταγωγής Ελβετίας [κοινοποιηθείσα υπό τον
    αριθμό Ε(2000) 397]'
  type: main
- language: fi
  script: Latn
  content: '2000/189/EY: Komission päätös, tehty 24 päivänä helmikuuta 2000,
    luvan antamisesta jäsenvaltioille säätää tilapäisistä poikkeuksista Sveitsistä
    peräisin olevia muita Vitis L. -suvun kasveja kuin hedelmiä koskeviin neuvoston
    direktiivin 77/93/ETY säännöksiin (tiedoksiannettu numerolla K(2000) 397)'
  type: main
- language: it
  script: Latn
  content: '2000/189/CE: Decisione della Commissione, del 24 febbraio 2000, che autorizza
    temporaneamente gli Stati membri a prevedere deroghe a determinate disposizioni
    della direttiva 77/93/CEE del Consiglio riguardo alle piante di Vitis L., ad eccezione
    dei frutti, originarie della Svizzera [notificata con il numero C(2000) 397]'
  type: main
- language: nl
  script: Latn
  content: '2000/189/EG: Beschikking van de Commissie van 24 februari 2000 tot machtiging
    van de lidstaten om voor planten van Vitis L., met uitzondering van vruchten,
    van oorsprong uit Zwitserland, tijdelijk toe te staan dat van sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad wordt afgeweken (kennisgeving geschied onder
    nummer C(2000) 397)'
  type: main
- language: pt
  script: Latn
  content: '2000/189/CE: Decisão da Comissão, de 24 de Fevereiro de 2000, que autoriza
    os Estados-Membros a prever temporariamente derrogações de certas disposições
    da Directiva 77/93/CEE do Conselho relativamente às plantas de Vitis L., com
    excepção dos frutos, originárias da Suíça [notificada com o número C(2000)
    397]'
  type: main
- language: es
  script: Latn
  content: '2000/189/CE: Decisión de la Comisión, de 24 de febrero de 2000, por
    la que se autoriza temporalmente a los Estados miembros para establecer excepciones
    a determinadas disposiciones de la Directiva 77/93/CEE del Consejo en relación
    con las plantas Vitis L., excepto los frutos, originarias de Suiza [notificada
    con el número C(2000) 397]'
  type: main
- language: sv
  script: Latn
  content: '2000/189/EG: Kommissionens beslut av den 24 februari 2000 om bemyndigande
