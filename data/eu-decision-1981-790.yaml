title:
- language: en
  script: Latn
  content: '81/790/EEC: Commission Decision of 15 September 1981 authorizing the Italian
    Republic to exempt from application of Regulation (EEC) No 1463/70 on the introduction
    of recording equipment in road transport the vehicles referred to in Article 14a
    (3) (a) of Regulation (EEC) No 543/69 (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/790/CEE: Décision de la Commission, du 15 septembre 1981, autorisant
    la République italienne à exempter de l''application du règlement (CEE) n°
    1463/70, concernant l''introduction d''un appareil de contrôle dans le domaine
    des transports par route, les véhicules mentionnés à l''article 14 bis paragraphe
    3 sous a) du règlement (CEE) n 543/69 (Le texte en langue italienne est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/790/EWG: Entscheidung der Kommission vom 15. September 1981 mit der
    die Italienische Republik ermächtigt wird, die in Artikel 14a Absatz 3 Buchstabe
    a) der Verordnung (EWG) Nr. 543/69 genannten Fahrzeuge von der Anwendung der Verordnung
    (EWG) Nr. 1463/70 über die Einführung eines Kontrollgeräts im Straßenverkehr
    freizustellen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/790/EØF: Kommissionens beslutning af 15. september 1981 om bemyndigelse
    til Den Italienske Republik til at undtage de i artikel 14a, stk. 3, litra a)
    i forordning (EØF) nr. 543/69 omhandlede køretøjer fra anvendelsen af forordning
    (EØF) nr. 1463/70, om indførelse af et kontrolapparat inden for landevejstransport
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/790/EOK: Απόφαση της Επιτροπής της 15ης Σεπτεμβρίου
    1981 για τη χορήγηση αδείας στην Ιταλική Δημοκρατία
    να εξαιρέσει από την εφαρμογή του κανονισμού
    (EOK) αριθ. 1463/70 περί της καθιέρωσης συσκευής
    ελέγχου στον τομέα των οδικών μεταφορών, τα
    οχήματα που αναφέρονται στο άρθρο 14α παράγραφος
    3 υπό α του κανονισμού (EOK) αριθ. 543/69 (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/790/CEE: Decisione della Commissione, del 15 settembre 1981, che autorizza
    la Repubblica italiana ad accordare una deroga all''applicazione del regolamento
    (CEE) n. 1463/70, relativo all''istituzione di un apparecchio di controllo nel
    settore dei trasporti su strada, per i veicoli di cui all''articolo 14 bis, paragrafo
    3, lettera a), regolamento (CEE) n. 543/69 (Il testo in lingua italiana è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/790/EEG: Beschikking van de Commissie van 15 september 1981 waarbij
    de Italiaanse Republiek gemachtigd wordt de in artikel 14 bis, lid 3, sub a),
    van Verordening (EEG) nr. 543/69 bedoelde voertuigen van de toepassing van Verordening
