  content: Council Regulation (EEC) No 2000/83 of 2 June 1983 amending Regulation
    (EEC) No 1408/71 on the application of social security schemes to employed persons,
    to self-employed persons and to members of their families moving within the Community
    and Regulation (EEC) No 574/72 laying down the procedure for implementing Regulation
    (EEC) No 1408/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2000/83 du Conseil du 2 juin 1983 modifiant le règlement
    (CEE) no 1408/71 relatif à l' application des régimes de sécurité sociale
    aux travailleurs salariés, aux travailleurs non salariés et aux membres de leur
    famille qui se déplacent à l' intérieur de la Communauté, et le règlement
    (CEE) no 574/72 fixant les modalités d' application du règlement (CEE) no 1408/71
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2000/83 des Rates vom 2. Juni 1983 zur Änderung der
    Verordnung (EWG) Nr. 1408/71 zur Anwendung der Systeme der sozialen Sicherheit
    auf Arbeitnehmer und Selbständige sowie deren Familienangehörige, die innerhalb
    der Gemeinschaft zu- und abwandern, und zur Änderung der Verordnung (EWG) Nr.
    574/72 über die Durchführung der Verordnung (EWG) Nr. 1408/71
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2000/83 af 2. juni 1983 om ændring af forordning
