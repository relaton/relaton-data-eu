title:
- language: en
  script: Latn
  content: '79/49/EEC: Commission Decision of 11 December 1978 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of a payment on account
    in respect of expenditure incurred during 1977 on aids relating to the provision
    of socio-economic guidance for and the acquisition of occupational skills by persons
    engaged in agriculture'
  type: main
- language: fr
  script: Latn
  content: '79/49/CEE: Décision de la Commission, du 11 décembre 1978, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique d''un acompte sur les dépenses
    effectuées pendant l''année 1977 pour les aides relatives à l''information
    socio-économique et à la qualification professionnelle des personnes travaillant
    dans l''agriculture'
  type: main
- language: de
  script: Latn
  content: '79/49/EWG: Entscheidung der Kommission vom 11. Dezember 1978 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1977 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben an das Königreich
    Belgien'
  type: main
- language: da
  script: Latn
  content: '79/49/EØF: Kommissionens beslutning af 11. december 1978 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af et acontobeløb for
    de udgifter, som er afholdt i løbet af 1977 til støtte vedrørende social og
    erhvervsmæssig vejledning og faglige kvalifikationer hos de personer, som arbejder
    i landbruget'
  type: main
- language: it
  script: Latn
  content: '79/49/CEE: Decisione della Commissione, dell'' 11 dicembre 1978, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno del Belgio di
    un anticipo sulle spese effettuate durante il 1977 per gli aiuti concernenti l''
    informazione socio-economica e la qualificazione professionale delle persone che
    lavorano nell'' agricoltura'
  type: main
- language: nl
  script: Latn
  content: '79/49/EEG: Beschikking van de Commissie van 11 december 1978 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    een voorschot in verband met de gedurende het jaar 1977 gedane uitgaven voor de
    steun met betrekking tot de sociaal-economische voorlichting en de scholing van
    de personen die in de landbouw werkzaam zijn'
  type: main
