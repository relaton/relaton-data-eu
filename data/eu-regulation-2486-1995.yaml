  content: COMMISSION REGULATION (EC) No 2486/95 of 25 October 1995 determining the
    extent to which the applications for import licences submitted in October 1995
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 1600/95 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2486/95 DE LA COMMISSION du 25 octobre 1995 déterminant
