  script: Latn
  content: '2009/855/EC: Council Decision of 20 October 2009 on the signing and conclusion
    of an Agreement in the form of an Exchange of Letters between the European Community
    and the State of Israel concerning reciprocal liberalisation measures on agricultural
    products, processed agricultural products and fish and fishery products, the replacement
    of Protocols 1 and 2 and their Annexes and amendments to the Euro-Mediterranean
    Agreement establishing an association between the European Communities and their
    Member States, of the one part, and the State of Israel, of the other part'
  type: main
- language: fr
  script: Latn
  content: '2009/855/CE: Décision du Conseil du 20 octobre 2009 concernant la signature
    et la conclusion de l’accord sous forme d’échange de lettres entre la Communauté
    européenne et l’État d’Israël relatif aux mesures de libéralisation réciproques
    en matière de produits agricoles, de produits agricoles transformés, de poissons
    et de produits de la pêche, au remplacement des protocoles n os 1 et 2 et de
    leurs annexes, et aux modifications de l’accord euro-méditerranéen établissant
    une association entre les Communautés européennes et leurs États membres, d’une
    part, et l’État d’Israël, d’autre part'
  type: main
