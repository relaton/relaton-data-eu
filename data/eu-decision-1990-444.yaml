    από την κοινοτική μεταχείριση το λιθάνθρακα,
    καταγωγής τρίτης χώρας, που εισάγεται αφού
    τεθεί σε ελεύθερη κυκλοφορία σε ένα άλλο κράτος
    μέλος (Το κείμενο στην ισπανική γλώσσα είναι
