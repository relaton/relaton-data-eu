title:
- language: en
  script: Latn
  content: '90/444/ECSC: Commission Decision of 18 July 1990 authorizing Spain to
    exclude from Community treatment, for a limited period, coal of third country
    origin imported after having been put into free circulation in another Member
    State (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/444/CECA: Décision de la Commission du 18 juillet 1990 autorisant
    pour une période limitée l''Espagne à exclure du traitement communautaire la
    houille, originaire d''un pays tiers, importée après avoir été mise en libre
    pratique dans un autre Etat membre (Le texte en langue espagnole est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '90/444/EGKS: Entscheidung der Kommission vom 18. Juli 1990 zur Ermächtigung
