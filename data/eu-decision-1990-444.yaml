    in einem anderen Mitgliedstaat in den freien Verkehr übergeführt worden ist,
    vorübergehend von der Gemeinschaftsbehandlung auszuschließen (Nur der spanische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/444/EKSF: Kommissionens Beslutning af 18. juli 1990 om bemyndigelse
    i en begraenset periode af Spanien til at udelukke indfoert stenkul med oprindelse
    i et tredjeland, som er overgaaet til fri omsaetning i en anden medlemsstat, fra
    faellesskabsbehandling (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/444/ΕΚΑΧ: Απόφαση της Επιτροπής της 18ης
