title:
- language: en
  script: Latn
  content: Regulation (EEC) No 955/74 of the Commission of 19 April 1974 re-establishing
    the levying of customs duties on handkerchiefs, of cotton fabric, falling within
    heading No ex 61.05, originating in South Korea to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3503/73 of 18 December 1973
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 955/74 de la Commission, du 19 avril 1974, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, en tissus de coton, de la position EX 61.05, originaires de la Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 955/74 der Kommission vom 19. April 1974 über die
    Wiedereinführung des Zollsatzes für Taschentücher und Ziertaschentücher, aus
    Baumwolle, der Tarifstelle ex 61.05, mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 955/74 af 19. april 1974 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, varer af bomuld, under position
    ex 61.05, som har oprindelse i Syd Korea, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 955/74 della Commissione, del 19 aprile 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino, in tessuti di cotone, della sottovoce doganale n. ex 61.05 originari
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 955/74 van de Commissie van 19 april 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zakdoeken,
    van weefsels van katoen, van onderverdeling van ex 61.05, van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3503/73 van de Raad van 18 december 1973
  type: main
