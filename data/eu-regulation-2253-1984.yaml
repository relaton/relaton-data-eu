title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2253/84 of 31 July 1984 imposing a provisional
    anti-dumping duty on certain imports of certain sodium carbonate originating in
    the United States of America and accepting undertakings in respect of other imports
    of the same product
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2253/84 de la Commission du 31 juillet 1984 instituant
    un droit antidumping provisoire sur certaines importations d' un certain type
    de carbonate de sodium originaire des États-Unis d' Amérique et portant acceptation
    d' engagements concernant d' autres importations du même produit
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2253/84 der Kommission vom 31. Juli 1984 zur Einführung
    eines vorläufigen Antidumpingzolls auf bestimmte Formen von Natriumkarbonat mit
    Ursprung in den Vereinigten Staaten von Amerika sowie zur Annahme von Verpflichtungen
    betreffend andere Einfuhren desselben Produkts
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2253/84 af 31. juli 1984 om indførelse
    af en midlertidig antidumpingtold på en del af importen af visse typer natriumcarbonat
    med oprindelse i Amerikas Forenede Stater og om godtagelse af tilsagn vedrørende
    den resterende import af de samme produkter
  type: main
- language: el
  script: Grek
