    είδους ανθρακικού νατρίου καταγωγής Ηνωμένων
    Πολιτειών Αμερικής και περί αποδοχής της ανάληψης
    υποχρεώσεων σχετικά με άλλες εισαγωγές του
    ιδίου προϊόντος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2253/84 della Commissione del 31 luglio 1984 che istituisce
    un dazio antidumping provvisorio su certe importazioni di alcuni tipi di carbonato
    di sodio originario degli Stati Uniti d' America e che accetta gli impegni relativi
    ad altre importazioni dello stesso prodotto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2253/84 van de Commissie van 31 juli 1984 tot instelling
