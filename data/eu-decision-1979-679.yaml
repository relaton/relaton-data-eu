title:
- language: en
  script: Latn
  content: '79/679/EEC: Commission Decision of 18 July 1979 authorizing the French
    Republic not to apply Community treatment to woven cotton terry fabrics ; toilet
    and kitchen linen of woven cotton terry fabrics, falling within heading Nos ex
    55.08 and ex 62.02 of the Common Customs Tariff (NIMEXE codes 55.08-10, 30, 50,
    80 ; 62.02-71, 11, 19) (categories 9 and 20), originating in the People''s Republic
    of China and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/679/CEE: Décision de la Commission, du 18 juillet 1979, autorisant
    la République française à exclure du traitement communautaire les tissus de
    coton bouclés du genre éponge, le linge de toilette, d''office ou de cuisine,
    bouclé du genre éponge, de coton, le linge des positions ex 55.08 et ex 62.02
    du tarif douanier commun (codes Nimexe : 55.08-10, 30, 50, 80 ; 62.02-71, 11,
    19) (catégories 9 et 20), originaires de la République populaire de Chine et
    mis en libre pratique dans les autres États membres (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/679/EWG: Entscheidung der Kommission vom 18. Juli 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Schlingengewebe
    (Frottiergewebe) aus Baumwolle; Wäsche zur Körperpflege und andere Haushaltswäsche
    aus Schlingengeweben (Frottiergeweben), aus Baumwolle, der Tarifnummern ex 55.08
    und ex 62.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 55.08-10, 30, 50,
    80 und 62.02-71, 11, 19) (Kategorien 9 und 20) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/679/EØF: Kommissionens beslutning af 18. juli 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage håndklædefrotterstof
    og lignende frotterstof af bomuld ; håndklæder, vaskeklude, viskestykker og
    lignende frotterstof af bomuld, som henhører under pos. ex 55.08 og ex 62.02
    i den fælles toldtarif (NIMEXE-nummer 55.08-10, 30, 50, 80 og 62.02- 71, 11,
    19 ; kategori 9 og 20), har oprindelse i Den kinesiske Folkerepublik og frit kan
    omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/679/CEE: Decisione della Commissione, del 18 luglio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di cotone,
    ricci del tipo spugna, la biancheria da toletta, da servizio o da cucina, riccia
    del tipo spugna, di cotone, delle voci ex 55.08 e ex 62.02 della tariffa doganale
    comune (codici Nimexe: 55.08-10, 30, 50, 80 ; 62.02-71, 11, 19) categorie 9 e
    20, originari della Repubblica popolare cinese e messi in libera pratica negli
    altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/679/EEG: Beschikking van de Commissie van 18 juli 1979 waarbij de Franse
    Republiek wordt gemachtigd bad- of frotteerstof (lussendoek van katoen), huishoudlinnen,
    van bad- of frotteerstof (lussendoek) van katoen, van de posten ex 55.08 en ex
    62.02 van het gemeenschappelijk douanetarief (NIMEXE-code 55.08-10, 30, 50, 80;
    62.02- 71, 11, 19) (categorie 9 en 20), van oorsprong uit de Volksrepubliek China
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
