  content: "/* 71/269/EEC: Commission Decision of 5 July 1971 authorizing the Member States to approve for marketing material of Pseudotsuga menziesii (Mirb.) Franco., Picea sitchensis Trautv. and Mey., and Pinus strobus L., satisfying less stringent requirements */"
  type: main
