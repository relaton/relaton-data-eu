id: EUDecision1979175
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/175/EEC: Commission Decision of 23 January 1979 authorizing the French
    Republic not to apply Community treatment to woven fabrics of jute of a width
    of not more than 150 cm and sacks and bags of jute, falling within subheading
    57.10 A or 62.03 A of the Common Customs Tariff, originating in Bangladesh and
    in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/175/CEE: Décision de la Commission, du 23 janvier 1979, autorisant
    la République française à exclure du traitement communautaire les tissus de
    jute d''une largeur égale ou inférieure à 150 centimètres et les sacs de jute,
    des sous-positions 57.10 A et 62.03 A du tarif douanier commun, originaires du
    Bangladesh et mis en libre pratique dans les autres Etats membres (Le texte en
    langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/175/EWG: Entscheidung der Kommission vom 23. Januar 1979, mit der die
    Französische Republik ermächtigt wird, aus Bangladesch stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Jute mit einer
    Breite von 150 cm oder weniger und Säcke aus Jute der Tarifstellen 57.10 A und
    62.03 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/175/EØF: Kommissionens beslutning af 23. januar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af jute af bredde 150 cm og derunder og sække af jute, som henhører under pos.
    57.10 A og 62.03 A i den fælles toldtarif, har oprindelse i Bangladesh og frit
    kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/175/CEE: Decisione della Commissione, del 23 gennaio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di iuta
    di larghezza inferiore o uguale a 150 cm e sacchi e sacchetti di iuta, delle sottovoci
    57.10 A e 62.03 A della tariffa doganale comune, originari del Bangladesh e messi
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/175/EEG: Beschikking van de Commissie van 23 januari 1979 waarbij de
    Franse Republiek wordt gemachtigd weefsels van jute met een breedte gelijk aan
    of minder dan 150 cm en jutezakken, van de posten 57.10 A en 62.03 A van het gemeenschappelijk
    douanetarief, van oorsprong uit Bangladesh en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
