    Ausfuhr von im Besitz der italienischen Interventionsstelle befindlichem Hartweizen
    auf 200 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1784/91 af 24. juni 1991 om ændring
