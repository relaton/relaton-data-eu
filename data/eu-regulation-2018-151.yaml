    парламент и на Съвета по отношение на допълнителното
    уточняване на елементите, които трябва да се
    вземат предвид от доставчиците на цифрови
    услуги при управлението на рисковете за сигурността
    на мрежите и информационните системи, както
    и на показателите за определяне на това дали
    даден инцидент има съществено въздействие
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2018/151 ze dne 30. ledna 2018, kterým
