title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/151 of 30 January 2018 laying
    down rules for application of Directive (EU) 2016/1148 of the European Parliament
    and of the Council as regards further specification of the elements to be taken
    into account by digital service providers for managing the risks posed to the
    security of network and information systems and of the parameters for determining
    whether an incident has a substantial impact
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2018/151 de la Commission du 30 janvier 2018
    portant modalités d'application de la directive (UE) 2016/1148 du Parlement européen
    et du Conseil précisant les éléments à prendre en considération par les fournisseurs
    de service numérique pour gérer les risques qui menacent la sécurité des réseaux
    et des systèmes d'information ainsi que les paramètres permettant de déterminer
    si un incident a un impact significatif
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2018/151 der Kommission vom 30. Januar 2018
    über Vorschriften für die Anwendung der Richtlinie (EU) 2016/1148 des Europäischen
    Parlaments und des Rates hinsichtlich der weiteren Festlegung der von Anbietern
    digitaler Dienste beim Risikomanagement in Bezug auf die Sicherheit von Netz-
    und Informationssystemen zu berücksichtigenden Elemente und der Parameter für
    die Feststellung erheblicher Auswirkungen eines Sicherheitsvorfalls
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2018/151 на Комисията
    от 30 януари 2018 година за определяне на правила
