  script: Latn
  content: Regolamento di esecuzione (UE) 2018/151 della Commissione, del 30 gennaio
    2018, recante modalità di applicazione della direttiva (UE) 2016/1148 del Parlamento
    europeo e del Consiglio per quanto riguarda l'ulteriore specificazione degli elementi
