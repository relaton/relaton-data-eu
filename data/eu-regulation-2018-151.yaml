    piemērošanai attiecībā uz tādu elementu precizēšanu, kuri jāņem vērā
    digitālo pakalpojumu sniedzējiem, lai pārvaldītu riskus, kas tiek radīti
    tīklu un informācijas sistēmu drošībai, un tādu rādītāju precizēšanu,
