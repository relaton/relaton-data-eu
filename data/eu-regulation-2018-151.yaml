  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2018/151 z dnia 30 stycznia 2018
    r. ustanawiające zasady stosowania dyrektywy Parlamentu Europejskiego i Rady
    (UE) 2016/1148 w odniesieniu do dalszego doprecyzowania elementów, jakie mają
    być uwzględnione przez dostawców usług cyfrowych w zakresie zarządzania istniejącymi
