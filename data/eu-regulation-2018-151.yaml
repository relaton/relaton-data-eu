    Europeu e do Conselho no respeitante à especificação pormenorizada dos elementos
    a ter em conta pelos prestadores de serviços digitais na gestão dos riscos que
    se colocam à segurança das redes e dos sistemas de informação, bem como à
    especificação pormenorizada dos parâmetros para determinar se o impacto de
    um incidente é substancial
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2018/151 al Comisiei din 30 ianuarie
    2018 de stabilire a normelor de aplicare a Directivei (UE) 2016/1148 a Parlamentului
    European și a Consiliului în ceea ce privește aducerea unor precizări suplimentare
    cu privire la elementele care trebuie să fie luate în considerare de către
    furnizorii de servicii digitale pentru gestionarea riscurilor la adresa securității
    rețelelor și a sistemelor informatice, precum și cu privire la parametrii necesari
    pentru a se determina dacă un incident are un impact substanțial
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2018/151 z 30. januára 2018, ktorým
    sa stanovujú pravidlá uplatňovania smernice Európskeho parlamentu a Rady (EÚ)
    2016/1148, pokiaľ ide o bližšiu špecifikáciu prvkov, ktoré musia poskytovatelia
    digitálnych služieb zohľadňovať pri riadení rizík v oblasti bezpečnosti
    sietí a informačných systémov, a parametrov na posudzovanie toho, či má
    incident závažný vplyv
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2018/151 z dne 30. januarja 2018 o določitvi
    pravil za uporabo Direktive (EU) 2016/1148 Evropskega parlamenta in Sveta v zvezi
    z dodatno specifikacijo elementov, ki jih morajo upoštevati ponudniki digitalnih
    storitev pri obvladovanju tveganj za varnost omrežij in informacijskih sistemov,
    in parametrov za določanje, ali ima incident pomemben vpliv
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2018/151 de la Comisión, de 30 de enero
    de 2018, por el que se establecen normas para la aplicación de la Directiva (UE)
    2016/1148 del Parlamento Europeo y del Consejo en lo que respecta a la especificación
    de los elementos que han de tener en cuenta los proveedores de servicios digitales
    para gestionar los riesgos existentes para la seguridad de las redes y sistemas
    de información, así como de los parámetros para determinar si un incidente
    tiene un impacto significativo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2018/151 av den 30 januari
    2018 om tillämpningsföreskrifter för Europaparlamentets och rådets direktiv
    (EU) 2016/1148 om åtgärder för en hög gemensam nivå på säkerhet i nätverks-
    och informationssystem i hela unionen vad gäller närmare specificering av de
    aspekter som ska beaktas av leverantörer av digitala tjänster när de hanterar
    risker som hotar säkerheten i deras nät- och informationssystem samt parametrarna
    för fastställande av om en incident har avsevärd inverkan
