    radiata og plantemateriale bestemt til udplantning fremstillet af sådanne frø,
    der er importeret fra New Zealand, og som ikke opfylder identifikations- og mærkningskravene
    i Rådets direktiv 1999/105/EF (meddelt under nummer K(2006) 4320)'
  type: main
- language: el
