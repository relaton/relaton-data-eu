title:
- language: en
  script: Latn
  content: '2006/665/EC: Commission Decision of 3 October 2006 temporarily authorising
    Spain to approve for marketing seed of the species Pinus radiata and planting
    stock produced from this seed imported from New Zealand which does not satisfy
    the requirements of Council Directive 1999/105/EC in respect of identification
    and labelling (notified under document number C(2006) 4320)'
  type: main
- language: fr
  script: Latn
  content: '2006/665/CE: Décision de la Commission du 3 octobre 2006 autorisant temporairement
    l’Espagne à permettre la commercialisation de semences de l’espèce Pinus
    radiata et de matériel de reproduction issu de ces semences importés de Nouvelle-Zélande,
    ne satisfaisant pas aux exigences de la directive 1999/105/CE du Conseil en matière
    d’identification et d’étiquetage [notifiée sous le numéro C(2006) 4320]'
  type: main
- language: de
  script: Latn
  content: '2006/665/EG: Entscheidung der Kommission vom 3. Oktober 2006 zur vorübergehenden
    Ermächtigung Spaniens, bestimmtes, den Anforderungen der Richtlinie 1999/105/EG
    in Bezug auf die Identifizierung und Etikettierung nicht entsprechendes, aus Neuseeland
    eingeführtes Saatgut der Art Pinus radiata und daraus erzeugtes Pflanzgut zum
    Verkehr zuzulassen (Bekannt gegeben unter Aktenzeichen K(2006) 4320)'
  type: main
- language: cs
  script: Latn
  content: '2006/665/ES: Rozhodnutí Komise ze dne 3. října 2006 , kterým se Španělsko
