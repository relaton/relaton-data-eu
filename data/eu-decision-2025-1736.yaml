title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/1736 of 25 July 2025 on the position to be adopted
    on behalf of the European Union within the Association Council established by
    the Association Agreement between the European Union and the European Atomic Energy
    Community and their Member States, of the one part, and the Republic of Moldova,
    of the other part, as regards the further market opening with respect to the sector
    of roaming on public mobile communications networks and amending Annex XXVIII-B
    (Rules applicable to telecommunication services) to that Association Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1736 du Conseil du 25 juillet 2025 relative à la position
    à prendre, au nom de l’Union européenne, au sein du conseil d’association
    institué par l’accord d’association entre l’Union européenne et la Communauté
    européenne de l’énergie atomique et leurs États membres, d’une part, et
    la République de Moldavie, d’autre part, en ce qui concerne la poursuite de
    l’ouverture du marché relatif au secteur de l’itinérance sur les réseaux
    publics de communications mobiles et la modification de l’annexe XXVIII-B (Règles
    applicables aux services de télécommunications) dudit accord d’association
  type: main
- language: de
  script: Latn
