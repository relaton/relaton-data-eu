  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2025/1736 z dnia 25 lipca 2025 r. w sprawie stanowiska,
    które ma zostać zajęte w imieniu Unii Europejskiej w ramach Rady Stowarzyszenia
    ustanowionej na mocy Układu o stowarzyszeniu między Unią Europejską i Europejską
    Wspólnotą Energii Atomowej oraz ich państwami członkowskimi, z jednej strony,
    a Republiką Mołdawii, z drugiej strony, w sprawie dalszego otwarcia rynku w
    odniesieniu do sektora roamingu w publicznych sieciach łączności ruchomej oraz
    zmiany załącznika XXVIII-B (Zasady mające zastosowanie do usług telekomunikacyjnych)
    do tego Układu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2025/1736 do Conselho, de 25 de julho de 2025, relativa à
    posição a tomar em nome da União Europeia no âmbito do Conselho de Associação
    instituído pelo Acordo de Associação entre a União Europeia e a Comunidade
    Europeia da Energia Atómica, e os seus Estados-Membros, por um lado, e a República
    da Moldávia, por outro, quanto a uma maior abertura do mercado no que respeita
    ao setor da itinerância nas redes de comunicações móveis públicas e à alteração
    do anexo XXVIII-B (Regras aplicáveis aos serviços de telecomunicações) desse
    Acordo de Associação
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2025/1736 a Consiliului din 25 iulie 2025 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Consiliului
    de asociere instituit prin Acordul de asociere dintre Uniunea Europeană și Comunitatea
    Europeană a Energiei Atomice și statele membre ale acestora, pe de o parte,
    și Republica Moldova, pe de altă parte, privind trecerea la o nouă etapă a
    deschiderii piețelor în ceea ce privește sectorul roamingului în rețelele
    publice de comunicații mobile și modificarea anexei XXVIII-B (Norme aplicabile
    serviciilor de telecomunicații) la acordul de asociere respectiv
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2025/1736 z 25. júla 2025 o pozícii, ktorá sa
    má v mene Európskej únie prijať v Rade pre pridruženie zriadenej Dohodou
    o pridružení medzi Európskou úniou a Európskym spoločenstvom pre atómovú
    energiu a ich členskými štátmi na jednej strane a Moldavskou republikou na
    strane druhej, pokiaľ ide o ďalšie otvorenie trhov v súvislosti s odvetvím
    roamingu vo verejných mobilných komunikačných sieťach, a k zmene prílohy
    XXVIII-B (Pravidlá uplatniteľné na telekomunikačné služby) k uvedenej dohode
    o pridružení
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/1736 z dne 25. julija 2025 o stališču, ki se v
    imenu Evropske unije zastopa v Pridružitvenem svetu, ustanovljenem s Pridružitvenim
    sporazumom med Evropsko unijo in Evropsko skupnostjo za atomsko energijo in njunimi
    državami članicami na eni strani ter Republiko Moldavijo na drugi strani, glede
    nadaljnjega odpiranja trga v zvezi s sektorjem gostovanja v javnih mobilnih komunikacijskih
    omrežjih in spremembe Priloge XXVIII-B (Pravila za telekomunikacijske storitve)
    k navedenemu pridružitvenemu sporazumu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2025/1736 del Consejo, de 25 de julio de 2025, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Asociación establecido por el Acuerdo de Asociación entre la Unión Europea
    y la Comunidad Europea de la Energía Atómica y sus Estados miembros, por una
    parte, y la República de Moldavia, por otra, en lo que concierne a la apertura
    adicional del mercado respecto al sector de la itinerancia en las redes públicas
    de comunicaciones móviles y a la modificación del anexo XXVIII-B (Normas aplicables
    a los servicios de telecomunicaciones) de dicho Acuerdo de Asociación
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2025/1736 av den 25 juli 2025 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i det associeringsråd som inrättats
    genom associeringsavtalet mellan Europeiska unionen och Europeiska atomenergigemenskapen
    och deras medlemsstater, å ena sidan, och Republiken Moldavien, å andra sidan,
    vad gäller ytterligare öppning av marknaderna med avseende på sektorn för
    roaming i allmänna mobilnät och ändring av bilaga XXVIII-B (Tillämpliga regler
    för teletjänster) till associeringsavtalet
