    und der Republik Moldau andererseits eingesetzten Assoziationsrat in Bezug auf
    die weitere Marktöffnung für das Roaming in öffentlichen Mobilfunknetzen und
    zur Änderung von Anhang XXVIII-B (Regelungen für Telekommunikationsdienstleistungen)
    dieses Abkommens zu vertretenden Standpunkt
  type: main
