  script: Latn
  content: Besluit (EU) 2025/1736 van de Raad van 25 juli 2025 betreffende het namens
    de Europese Unie in te nemen standpunt in de Associatieraad, opgericht bij de
    Associatieovereenkomst tussen de Europese Unie en de Europese Gemeenschap voor
    Atoomenergie en hun lidstaten, enerzijds, en de Republiek Moldavië, anderzijds,
    over de verdere marktopenstelling wat betreft de sector roaming op openbare mobielecommunicatienetwerken
