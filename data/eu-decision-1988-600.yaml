    wird, bestimmte Schutzmaßnahmen gemäß Artikel 108 Absatz 3 des EWG-Vertrags
    zu treffen (Nur der griechische Text ist verbindlich) (88/600/EWG) (88/600/EWG)
    #'
  type: main
- language: da
