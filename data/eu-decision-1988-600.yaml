  content: '88/600/EEC: Commission Decision of 22 November 1988 renewing and amending
    Decision 85/594/EEC authorizing the Hellenic Republic to take certain protective
    measures under Article 108 (3) of the EEC Treaty (only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/600/CEE: Décision de la Commission du 22 novembre 1988 prorogeant
