    modulo A rilasciato dai paesi beneficiari delle preferenze tariffarie generalizzate
    per il tabacco greggio del tipo "Virginia flue-cured"
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 509/74 van de Commissie van 28 februari 1974 betreffende
