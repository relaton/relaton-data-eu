- language: en
  script: Latn
  content: Regulation (EEC) No 509/74 of the Commission of 28 February 1974 on the
    certification of authenticity which has to appear on the certificate of origin
    form A issued for unmanufactured tobacco of the type 'flue-cured Virginia' by
    countries to which generalized preferences have been granted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 509/74 de la Commission, du 28 février 1974, relatif
    à l' attestation d' authenticité devant figurer sur le certificat d' origine
    formule A délivré par les pays bénéficiaires des préférences tarifaires
    généralisées pour le tabac brut du type "Virginia flue-cured"
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 509/74 der Kommission vom 28. Februar 1974 über die
    Echtheitsbescheinigung, die auf dem Ursprungszeugnis nach Muster A erscheinen
    muß, das von Ländern, die in den Genuß von allgemeinen Zollpräferenzen gelangen,
    für Rohtabak der Sorte ,,Virginia flue-cured' ' ausgestellt wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 509/74 af 28. februar 1974 om den ægthedserklæring,
