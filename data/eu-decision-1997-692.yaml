title:
- language: en
  script: Latn
  content: '97/692/EC: Commission Decision of 24 April 1997 on the approval of the
    single programming document for Community structural assistance in the regions
    of the west coast (Varsinais-Suomi and Satakunta), Päijät-Häme, the eastern
    gulf of Finland (Kymenlaakso and east Uusimaa), south Karelia, central Finland
    and Kokkola concerned by Objective 2 in Finland (Only the Finnish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/692/CE: Décision de la Commission du 24 avril 1997 portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
