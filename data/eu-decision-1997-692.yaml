    de l''est du golfe de Finlande (Kymenlaakso et Uusimaa, partie est), du sud de
    Karelia, de la Finlande centrale et de Kokkola concernées par l''objectif nº
    2 en Finlande (Le texte en langue finnoise est le seul faisant foi.)'
  type: main
