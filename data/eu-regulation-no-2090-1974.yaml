title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2090/74 of the Council of 2 August 1974 on the opening,
    allocation and administration of an autonomous Community tariff quota for 1974
    for ferro-chromium containing not more than 0.10 % by weight of carbon and more
    than 30 % but not exceeding 90 % by weight of chromium (super-refined ferro-chromium)
    falling within subheading ex 73.02 E I of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2090/74 du Conseil, du 2 août 1974, portant ouverture,
    répartition et mode de gestion d'un contingent tarifaire communautaire autonome,
    pour l'année 1974, de ferrochrome contenant en poids 0,10 % ou moins de carbone
    et plus de 30 % jusqu'à 90 % inclus de chrome (ferrochrome surraffiné) de la
    sous-position EX 73.02 E I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2090/74 des Rates vom 2. August 1974 über die Eröffnung,
    Aufteilung und Verwaltung eines autonomen Gemeinschaftszollkontingents für Ferrochrom
    mit einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und
    an Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs für das Jahr 1974
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2090/74 af 2. august 1974 om åbning, fordeling
    og forvaltning af et autonomt fællesskabstoldkontingent for 1974 for ferrochrom,
    indeholdende højst 0,10 vægtprocent kulstof og over 30, men højst 90 vægtprocent
    chrom (overraffineret ferrochrom), henhørende under pos. ex 73.02 E I i den fælles
    toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2090/74 del Consiglio, del 2 agosto 1974, relativo
    all'apertura, alla ripartizione e alle modalità di gestione di un contingente
    tariffario comunitario autonomo, per il 1974, di ferro-cromo contenente, in peso,
    lo 0,10 % o meno di carbonio e oltre il 30 % sino al 90 % incluso, di cromo (ferro-cromo
    superraffinato) della sottovoce ex 73.02 E I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2090/74 van de Raad van 2 augustus 1974 betreffende
    de opening, de verdeling en de wijze van beheer van een autonoom communautair
    tariefcontingent voor ferrochroom, bevattende 0,1 of minder gewichtspercent koolstof
    en meer dan 30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd
    ferrochroom), van onderverdeling ex 73.02 E I van het gemeenschappelijk douanetarief,
    voor het jaar 1974
  type: main
