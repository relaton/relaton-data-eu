    vom 25. März 1969 über die Harmonisierung bestimmter Sozialvorschriften im Straßenverkehr
    zu gewähren (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/272/EØF: Kommissionens beslutning af 31. marts 1982 om bemyndigelse
