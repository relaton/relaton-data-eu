title:
- language: en
  script: Latn
  content: '82/272/EEC: Commission Decision of 31 March 1982 authorizing the Government
    of Ireland to grant an exemption from Council Regulation (EEC) No 543/69 of 25
    March 1969 on the harmonization of certain social legislation relating to road
    transport (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/272/CEE: Décision de la Commission, du 31 mars 1982, autorisant le
    gouvernement irlandais à déroger au règlement (CEE) n° 543/69 du Conseil,
    du 25 mars 1969, relatif à l''harmonisation de certaines dispositions en matière
    sociale dans le domaine des transports par route (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/272/EWG: Entscheidung der Kommission vom 31. März 1982 zur Ermächtigung
