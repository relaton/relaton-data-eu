    (EG) Nr. 1898/97 und (EG) Nr. 1899/97 zur Festlegung der den Schweinefleischsektor
    bzw. die Sektoren Geflügelfleisch und Eier betreffenden Durchführungsbestimmungen
    zu der Verordnung (EG) Nr. 3066/95 des Rates eröffneten Konzessionen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1413/98 af 2. juli 1998 om ophævelse
