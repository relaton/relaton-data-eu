title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1413/98 of 2 July 1998 repealing Regulation
    (EC) No 727/98 suspending certain concessions provided for in Regulations (EC)
    No 1898/97 and (EC) No 1899/97 laying down rules of application in the pigmeat
    sector and in the poultrymeat and egg sectors respectively for the arrangements
    covered by Council Regulation (EC) No 3066/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1413/98 de la Commission du 2 juillet 1998 abrogeant
    le règlement (CE) n° 727/98 suspendant certaines concessions prévues par les
    règlements (CE) n° 1898/97 et (CE) n° 1899/97, établissant les modalités
    d'application dans le secteur de la viande de porc, d'une part, et dans les secteurs
    de la viande de volaille et des oeufs, d'autre part, du régime prévu par le
    règlement (CE) n° 3066/95 du Conseil
  type: main
- language: de
  script: Latn
