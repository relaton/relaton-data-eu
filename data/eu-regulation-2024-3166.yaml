    für Zuchtzwecke, entwöhnte Ferkel, entwöhnte Suidae außer Sus scrofa domesticus
    und Sauen, zu ihrer Zulassung für Mastschweine aller Suidae-Arten, Saugferkel
    aller Suidae-Arten und Sauen von Suidae-Arten von geringerer wirtschaftlicher
    Bedeutung (Zulassungsinhaber: Kemin Europa N.V.), zur Änderung der Durchführungsverordnung
    (EU) 2023/366 und zur Aufhebung der Durchführungsverordnungen (EU) Nr. 306/2013,
    (EU) Nr. 787/2013 und (EU) 2017/2276'
