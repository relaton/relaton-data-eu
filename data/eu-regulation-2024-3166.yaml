title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/3166 of 18 December 2024
    concerning the renewal of the authorisation of a preparation of Bacillus velezensis
    ATCC PTA-6737 as a feed additive for turkeys for fattening, turkeys reared for
    breeding, weaned piglets, weaned Suidae other than Sus scrofa domesticus, and
    sows, its authorisation for pigs for fattening of all Suidae species, suckling
    piglets of all Suidae species and sows of minor Suidae species (holder of authorisation:
    Kemin Europa N.V.), amending Implementing Regulation (EU) 2023/366 and repealing
    Implementing Regulations (EU) No 306/2013, (EU) No 787/2013 and (EU) 2017/2276'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/3166 de la Commission du 18 décembre
    2024 concernant le renouvellement de l’autorisation d’une préparation de
    Bacillus velezensis ATCC PTA-6737 en tant qu’additif pour l’alimentation des
    dindes à l’engrais, des dindons élevés pour la reproduction, des porcelets
    sevrés, des suidés sevrés autres que Sus scrofa domesticus et des truies, ainsi
    que son autorisation pour les porcs à l’engrais de toutes les espèces de suidés,
    les porcelets non sevrés de toutes les espèces de suidés et les truies des
    espèces mineures de suidés (titulaire de l’autorisation: Kemin Europa NV),
    modifiant le règlement d’exécution (UE) 2023/366 et abrogeant les règlements
    d’exécution (UE) no 306/2013, (UE) no 787/2013, et (UE) 2017/2276'
  type: main
- language: de
  script: Latn
