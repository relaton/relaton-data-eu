title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 760/2000 of 12 April 2000 determining the
    extent to which applications lodged in April 2000 for import rights in respect
    of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 760/2000 de la Commission, du 12 avril 2000, déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2000 pour les viandes bovines congelées destinées
    à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 760/2000 der Kommission vom 12. April 2000 über den
    Umfang, in dem den im Monat April 2000 eingereichten Anträgen auf Einfuhrrechte
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 760/2000 af 12. april 2000 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder, indgivet i april
    2000 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 760/2000 της Επιτροπής,
    της 12ης Απριλίου 2000, ο οποίος καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιωμάτων εισαγωγής που κατατέθηκαν τον
    Απρίλιο 2000 για τα κατεψυγμένα βόεια κρέατα
    που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 760/2000, annettu 12 päivänä huhtikuuta 2000,
    huhtikuussa 2000 jätettyjen, jalostettavaksi tarkoitettua jäädytettyä naudanlihaa
    koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 760/2000 della Commissione, del 12 aprile 2000, che
    stabilisce in quale misura può essere dato seguito alle domande di diritti di
    importazione presentate nel mese di aprile 2000 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 760/2000 van de Commissie van 12 april 2000 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in april 2000 ingediende
    aanvragen om rechten tot invoer voor bevroren rundvlees bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 760/2000 da Comissão, de 12 de Abril de 2000, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Abril de 2000 para carne de bovino congelada destinada à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 760/2000 de la Comisión, de 12 de abril de 2000, por
    el que se determina en qué medida podrá darse curso a las solicitudes de derechos
    de importación presentadas hasta el mes de abril de 2000 para las carnes de vacuno
    congeladas destinadas a la transformación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 760/2000 av den 12 april 2000 om i vilken
    utsträckning ansökningar om importrättigheter som lämnats in under april 2000
    för fruset nötkött för bearbetning kan godkännas
  type: main
