title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 282/72 du Conseil, du 31 janvier 1972, concernant
    l'application de la décision n° 42/71 du Conseil d'association prévu par la
    convention d'association entre la Communauté économique européenne et les États
    africains et malgache associés à cette Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 282/72 des Rates vom 31. Januar 1972 betreffend die
    Durchführung des Beschlusses Nr. 42/71 des Assoziationsrats, der im Abkommen
    über die Assoziation zwischen der Europäischen Wirtschaftsgemeinschaft und den
    mit dieser Gemeinschaft assoziierten afrikanischen Staaten und Madagaskar vorgesehen
    ist
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 282/72 del Consiglio, del 31 gennaio 1972, concernente
    l'applicazione della decisione n. 42/71 del Consiglio di associazione previsto
    dalla Convenzione di associazione tra la Comunità economica europea e gli Stati
    africani e malgascio associati a tale Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 282/72 van de Raad van 31 januari 1972 betreffende
    de toepassing van besluit nr. 42/71 van de Associatieraad, ingesteld door de Associatieovereenkomst
    tussen de Europese Economische Gemeenschap en de met deze Gemeenschap geassocieerde
    Afrikaanse Staten en Madagaskar
