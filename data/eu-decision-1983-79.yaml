title:
- language: en
  script: Latn
  content: '83/79/EEC: Commission Decision of 10 February 1983 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of sacks and bags of
    jute, originating in the People''s Republic of China, which have been put into
    free circulation in the Community (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/79/CEE: Décision de la Commission du 10 février 1983 autorisant le
    Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de sacs et sachets d''emballage en tissus de jute, originaires de la République
    populaire de Chine et mis en libre pratique dans la Communauté (Le texte en langue
    anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '83/79/EWG: Entscheidung der Kommission vom 10. Februar 1983 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Volksrepublik China stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Säcke und Beutel zu Verpackungszwecken aus Jutegeweben
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/79/EØF: Kommissionens beslutning af 10. februar 1983 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførsel
    af sække og poser til emballage af jutestof med oprindelse i Den kinesiske Folkerepublik
    til fri omsætning i Fællesskabet (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/79/ΕΟΚ: Απόφαση της Επιτροπής της 10ης Φεβρουαρίου
    1983 περί χορηγήσεως αδείας στο Ηνωμένο Βασίλειο
    για την καθιέρωση ενδοκοινοτικής επιβλέψεως
    των εισαγωγών σάκκων και σακκιδίων συσκευασίας,
    εξ υφασμάτων εξ ιούτης, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, τα οποία ευρίσκονται σε ελεύθερη
    κυκλοφορία στην Κοινότητα (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/79/CEE: Decisione della Commissione del 10 febbraio 1983 che autorizza
    il Regno Unito ad istituire una sorveglianza intracomunitaria delle importazioni
    di sacchi e sacchetti da imballaggio, di tessuti di iuta, originari della Repubblica
    popolare cinese e messi in libera pratica nella Comunità (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/79/EEG: Beschikking van de Commissie van 10 februari 1983 houdende
    machtiging van het Verenigd Koninkrijk tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van zakken voor verpakkingsdoeleinden van weefsel
    van jute, van oorsprong uit de Volksrepubliek China, die in de Gemeenschap in
    het vrije verkeer zijn gebracht (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
