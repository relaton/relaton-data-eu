  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2705/87 della Commissione dell' 8 settembre 1987 che
    ripristina la riscossione dei dazi doganali applicabili ai supporti di suono per
    apparecchi della voce 92.11 della tariffa doganale comune, o per registrazioni
    analoghe; dischi, cilindri, cere, nastri, film, fili, ecc., preparati per la registrazione
    o registrati; matrici e forme galvaniche per la fabbricazione dei dischi della
    voce 92.12 originari di Hong Kong beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2705/87 van de Commissie van 8 september 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op grammofoonplaten;
    platen, cilinders, rollen, banden, films, draad, enz., geprepareerd voor het opnemen
    van geluid of waarop geluid is opgenomen, voor de toestellen bedoeld bij post
    92.11 of voor dergelijke doeleinden; galvanische vormen en matrijzen, voor het
    maken van platen, van post 92.12 van het gemeenschappelijk douanetarief, van oorsprong
    uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3924/86 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: 'Regulamento (CEE) n.° 2705/87 da Comissão de 8 de Setembro de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a suportes de som
    para os aparelhos do n.° 92.11 ou para registos análogos: discos, cilindros,
    ceras, bandas, fitas, fios, etc., preparados para registo ou já registados; matrizes
    e moldes galvânicos para o fabrico de discos da posição 92.12 da pauta aduaneira
    comum originários de Hong Kong, beneficiário das preferências pautais previstas
    pelo Regulamento (CEE) n.° 3924/86 do Conselho'
  type: main
- language: es
  script: Latn
  content: 'Reglamento (CEE) n° 2705/87 de la Comisión de 8 de septiembre de 1987
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a los soportes de sonido para los aparatos de la partida n° 92.11 del arancel
    aduanero común, o para grabaciones análogas: discos, cilindros, ceras, bandas,
    películas, hilos etc., preparados para la grabación o grabados; matrices y moldes
    galvánicos para la fabricación de discos de la partida n° 92.12 del arancel
    aduanero común, originarios de Hong Kong, beneficiario de las preferencias arancelarias
    previstas por el Reglamento (CEE) n° 3924/86 del Consejo'
