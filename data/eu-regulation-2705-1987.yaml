title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2705/87 of 8 September 1987 re-establishing
    the levying of customs duties on gramophone records and other sound or similar
    recordings; matrices for the production of records, prepared record blanks, film
    for mechanical sound recording, prepared tapes, wires, strips and like articles
    of a kind commonly used for sound or similar recording, falling within heading
    No 92.12, originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CEE) n° 2705/87 de la Commission du 8 septembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux supports
    de son pour les appareils du n° 92.11 ou pour enregistrements analogues: disques,
    cylindres, cires, bandes, films, etc., préparés pour l'' enregistrement ou enregistrés;
    matrices et moules galvaniques pour la fabrication des disques, de la position
    92.12 du tarif douanier commun, originaires de Hong-Kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil'
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2705/87 der Kommission vom 8. September 1987 zur Wiedereinführung
    der Erhebung der Zölle für Tonträger und andere Aufzeichnungsträger (z.B.
    Platten, Zylinder, Wachsformen, Bänder, Filme, Drähte), für Geräte der Tarifnummer
    92.11 oder für ähnliche Aufnahmeverfahren, zur Aufnahme vorgerichtet oder mit
    Aufzeichnung; Matrizen und galvanoplastische Formen zum Herstellen von Schallplatten
    der Tarifnummer 92.12 des Gemeinsamen Zolltarifs mit Ursprung in Hongkong, dem
    die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2705/87 af 8. september 1987 om genindførelse
    af opkrævning af told for grammofonplader og andre lydoptagelser eller lignende
    optagelser; plader, valser, film, bånd, tråd og andre medier, færdige til optagelse
    af lyd o. lign.; matricer til fremstilling af grammofonplader henhørende under
    pos. 92.12 i den fælles toldtarif og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2705/87 της Επιτροπής
    της 8ης Σεπτεμβρίου 1987 περί αποκαταστάσεως
    της εφαρμογής των δασμών για υποθέματα εγγραφής
    του ήχου διά συσκευάς της κλάσεως 92.11 ή δι αναλόγους
