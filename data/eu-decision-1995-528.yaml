  script: Latn
  content: '95/524/EC: Council Decision of 5 December 1995 amending Regulation (EEC)
    No 2847/93 and Decision 89/631/EEC as regards the time limit for implementing
    certain pilot projects on continous position monitoring of Community fishing vessels
    and the Community contribution to the expenditure incurred in their implementation'
  type: main
- language: fr
  script: Latn
