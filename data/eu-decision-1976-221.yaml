title:
- language: en
  script: Latn
  content: '76/221/EEC: Commission Decision of 30 December 1975 authorizing the Grand
    Duchy of Luxembourg to restrict the marketing of seed or propagating material
    of certain varieties of agricultural plant species (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/221/CEE: Décision de la Commission, du 30 décembre 1975, autorisant
    le grand-duché de Luxembourg à restreindre la commercialisation des semences
    de certaines variétés des espèces de plantes agricoles (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '76/221/EWG: Entscheidung der Kommission vom 30. Dezember 1975 zur Ermächtigung
    des Großherzogtums Luxemburg, den Verkehr mit Saat- oder Pflanzgut einiger Sorten
    landwirtschaftlicher Pflanzenarten zu beschränken (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '76/221/EØF: Kommissionens Beslutning af 30. december 1975 om bemyndigelse
    af storhertugdømmet Luxembourg til at begrænse handelen med frø af visse sorter
    af landbrugsplantearter (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '76/221/ΕΟΚ: Απόφαση της Επιτροπής, της 30ής
    Δεκεμβρίου 1975, με την οποία επιτρέπεται στο
    Μεγάλο Δουκάτο του Λουξεμβούργου να περιορίσει
    την εμπορία των σπόρων ορισμένων ποικιλιών
    γεωργικών φυτών (Το κείμενο στη γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '76/221/CEE: Decisione della Commissione, del 30 dicembre 1975, che autorizza
    il Granducato del Lussemburgo a limitare la commercializzazione delle sementi
    e materiali di moltiplicazione di alcune varietà di specie di piante agricole
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '76/221/EEG: Beschikking van de Commissie van 30 december 1975 tot machtiging
    voor het Groothertogdom Luxemburg om de handel in zaaizaad van bepaalde rassen
    van landbouwgewassen te beperken (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '76/221/CEE: Decisión de la Comisión, de 30 de diciembre de 1975, por
    la que se autoriza al Gran Ducado de Luxemburgo a restringir la comercialización
    de las semillas de determinadas variedades de las especies de plantas agrícolas
    (El texto en lengua francesa es el único auténtico)'
