    aus Interventionsbeständen an bezeichnete Organisationen zur Verteilung an stark
    benachteiligte Personen in der Gemeinschaft zu verbuchen sind, für Spanien'
  type: main
- language: da
  script: Latn
  content: '88/144/EØF: Kommissionens beslutning af 1. marts 1988 om tildeling til
