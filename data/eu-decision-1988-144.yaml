  script: Latn
  content: '88/144/EEC: Commission Decision of 1 March 1988 allocating to Spain resources
    to be charged to the 1988 budget year for the supply of food from intervention
    stocks to designated organizations for distribution to the most deprived persons
    in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/144/CEE: Décision de la Commission du 1er mars 1988 allouant à l''
    Espagne les crédits imputables à l'' exercice 1988 pour la fourniture de denrées
    alimentaires provenant des stocks d'' intervention à des organisations désignées
    pour les distribuer aux personnes les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/144/EWG: Entscheidung der Kommission vom 1. März 1988 über die Bewilligung
