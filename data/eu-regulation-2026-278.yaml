  script: Latn
  content: Commission Implementing Regulation (EU) 2026/278 of 6 February 2026 amending
    Annexes XIV and XV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Argentina and Moldova in the lists of third countries, territories, or zones
    thereof authorised for the entry into the Union of consignments of fresh meat
    of poultry and game birds and meat products from poultry
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/278 de la Commission du 6 février
    2026 modifiant les annexes XIV et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives à l’Argentine et à la Moldavie dans
    les listes des pays tiers et territoires ou des zones de pays tiers ou territoire
    en provenance desquels l’entrée dans l’Union d’envois de viandes fraîches
    de volailles et de gibier à plumes et de produits à base de viande de volaille
    est autorisée
  type: main
