type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 952/2014 of 4 September 2014
    amending Annex I to Regulation (EC) No 798/2008 as regards the entry for Malaysia
    in the list of third countries, territories, zones or compartments with respect
    to highly pathogenic avian influenza and as regards the model veterinary certificates
    for the import of poultry, day-old chicks, hatching eggs, meat of poultry and
    farmed ratites and eggs
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 952/2014 de la Commission du 4 septembre
    2014 modifiant l’annexe I du règlement (CE) n ° 798/2008 en ce qui concerne
    l’entrée relative à la Malaisie se rapportant à l’influenza aviaire hautement
    pathogène figurant sur la liste des pays tiers, territoires, zones ou compartiments
    et en ce qui concerne les modèles de certificats vétérinaires pour l’importation
    de volailles, de poussins d’un jour, d’œufs à couver, de viandes de volailles
    et de ratites d’élevage et d’œufs
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 952/2014 der Kommission vom 4. September
    2014 zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich
    des Eintrags für Malaysia in der Liste von Drittländern, Gebieten, Zonen und
    Kompartimenten in Bezug auf die hochpathogene aviäre Influenza und hinsichtlich
    der Muster-Veterinärbescheinigungen für die Einfuhr von Geflügel, Eintagsküken,
    Bruteiern, Fleisch von Geflügel und Nutzlaufvögeln sowie Eiern
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 952/2014 на Комисията
    от 4 септември 2014 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Малайзия в списъка на трети страни, територии,
    зони или компартменти за високопатогенна инфлуенца
    по птиците и по отношение на образците на ветеринарни
    сертификати за внос на домашни птици, еднодневни
    пилета, яйца за люпене, месо от домашни птици,
    месо от щраусови птици и яйца
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 952/2014 ze dne 4. září 2014
    , kterým se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku
    na seznamu třetích zemí, území, oblastí nebo jednotek týkající se Malajsie
    s ohledem na vysoce patogenní influenzu ptáků a pokud jde o vzorová veterinární
    osvědčení pro dovoz drůbeže, jednodenních kuřat, násadových vajec, masa
    drůbeže a ptáků nadřádu běžci a vajec
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 952/2014 af 4. september
    2014 om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår
    oplysningerne om Malaysia i listen over tredjelande, områder, zoner og segmenter
    med hensyn til højpatogen aviær influenza og for så vidt angår standardveterinærcertifikaterne
    til brug ved import af fjerkræ, daggamle kyllinger, rugeæg, kød af fjerkræ
    og opdrættede strudsefugle og æg
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 952/2014
    της Επιτροπής, της 4ης Σεπτεμβρίου 2014 , για την
