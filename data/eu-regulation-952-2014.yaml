    (ΕΚ) αριθ. 798/2008, όσον αφορά την εγγραφή για τη
    Μαλαισία στον κατάλογο τρίτων χωρών, εδαφών,
    ζωνών ή διαμερισμάτων, σε σχέση με την υψηλής
    παθογονικότητας γρίπη των πτηνών, και όσον
    αφορά τα υποδείγματα κτηνιατρικών πιστοποιητικών
    για την εισαγωγή πουλερικών, νεοσσών μιας ημέρας,
    αυγών επώασης, κρέατος πουλερικών και εκτρεφόμενων
    στρουθιονιδών και αυγών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 952/2014, 4. september 2014 , millega
    muudetakse määruse (EÜ) nr 798/2008 I lisa seoses kolmandate riikide, territooriumide,
    tsoonide ja piirkondade loetelus Malaisiat käsitleva kandega ja suure patogeensusega
    linnugripiga ning seoses veterinaarsertifikaatide näidistega kodulindude, ühepäevaste
    tibude, haudemunade, kodulinnuliha, tehistingimustes peetavate silerinnaliste
    lindude liha ja munade importimise jaoks
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 952/2014, annettu 4 päivänä
    syyskuuta 2014 , asetuksen (EY) N:o 798/2008 liitteen I muuttamisesta siltä osin
    kuin on kyse Malesiaa koskevasta kohdasta kolmansien maiden ja niiden alueiden,
    vyöhykkeiden tai erillisalueiden luettelossa korkeapatogeenisen lintuinfluenssan
    osalta ja siltä osin kuin on kyse siipikarjan, untuvikkojen, siitosmunien, siipikarjan
    ja tarhattujen sileälastaisten lintujen lihan ja munien tuonnissa käytettävistä
    eläinlääkärintodistusten malleista
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 952/2014 оd 4. rujna 2014. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Maleziju na popisu trećih
    zemalja, državnih područja, zona ili kompartmenta u vezi s visokopatogenom influencom
    ptica i u pogledu obrazaca veterinarskih certifikata za uvoz peradi, jednodnevnih
    pilića, jaja za valenje, mesa peradi te uzgojenih bezgrebenki i jaja
  type: main
- language: hu
  script: Latn
  content: A Bizottság 952/2014/EU végrehajtási rendelete ( 2014. szeptember 4.
    ) a magas patogenitású madárinfluenzával összefüggésben a 798/2008/EK rendelet
    I. mellékletének a harmadik országok, területek, övezetek és területi egységek
    jegyzéke Malajziára vonatkozó bejegyzése, valamint a baromfi, a naposcsibe,
    a keltetőtojás, a baromfihús, a tenyésztett laposmellű futómadár húsa
    és a tojás behozatalára előírt állat-egészségügyi bizonyítványminták
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 952/2014 della Commissione, del 4 settembre
    2014 , che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto
    riguarda la voce relativa alla Malaysia nell’elenco di paesi terzi, loro territori,
    zone o compartimenti in riferimento all’influenza aviaria ad alta patogenicità
    e per quanto riguarda i modelli di certificati veterinari per l’importazione
    di pollame, pulcini di un giorno, uova da cova, carne di pollame, ratiti d’allevamento
    e uova
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 952/2014 ( 2014. gada 4. septembris
    ), ar kuru groza Regulas (EK) Nr. 798/2008 I pielikumu attiecībā uz ierakstu
    par Malaiziju trešo valstu, teritoriju, zonu vai nodalījumu sarakstā saistībā
    ar augstas patogenitātes putnu gripu un veterināro sertifikātu paraugus, kas
    paredzēti mājputnu, dienu vecu cāļu, inkubējamo olu, mājputnu un saimniecībā
    audzētu skrējējputnu gaļas, kā arī olu importam
  type: main
- language: lt
  script: Latn
  content: 2014 m. rugsėjo 4 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 952/2014,
    kuriuo iš dalies keičiamas Reglamento (EB) Nr. 798/2008 I priede pateiktame
    trečiųjų šalių, teritorijų, zonų ar skyrių sąraše esantis Malaizijos
    įrašas dėl labai patogeniško paukščių gripo ir kuriuo iš dalies keičiami
    importuojamų naminių paukščių, vienadienių paukščių jauniklių, perinių
    kiaušinių, paukštienos ir ūkiuose auginamų Ratitae genties paukščių ir
    kiaušinių veterinarijos sertifikatų pavyzdžiai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 952/2014 tal-
    4 ta' Settembru 2014 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 rigward
    l-entrata għall-Malasja fil-lista ta’ pajjiżi terzi, territorji, żoni jew
    kompartimenti fir-rigward tal-influwenza tat-tjur b’patoġeniċità għolja
    u rigward il-mudelli taċ-ċertifikati veterinarji għall-importazzjoni ta’
    tjur, ta’ flieles ta’ ġurnata, ta’ bajd għat-tifqis, ta’ laħam tat-tjur,
    ta’ laħam ta’ għasafar li ma jtirux imrobbija fl-irziezet u ta’ bajd tat-tiġieġ
    imrobbija fil-ġaġeġ
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 952/2014 van de Commissie van 4 september
    2014 tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft
    de vermelding voor Maleisië in de lijst van derde landen, gebieden, zones of
    compartimenten met betrekking tot hoogpathogene aviaire influenza en wat betreft
    de modellen van veterinaire certificaten voor de invoer van pluimvee, eendagskuikens,
    broedeieren, vlees van pluimvee en gekweekte loopvogels en eieren
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 952/2014 z dnia 4 września
    2014 r. zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w odniesieniu
    do dotyczącego Malezji wpisu, znajdującego się w wykazie państw trzecich,
    terytoriów, stref lub grup, w sprawie wysoko zjadliwej grypy ptaków oraz w odniesieniu
    do wzorów świadectw weterynaryjnych dotyczących przywozu drobiu, jednodniowych
    piskląt, jaj wylęgowych, mięsa drobiu i ptaków bezgrzebieniowych utrzymywanych
    w warunkach fermowych oraz jaj
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 952/2014 da Comissão, de 4 de setembro
    de 2014 , que altera o anexo I do Regulamento (CE) n. ° 798/2008 no que se refere
    à entrada relativa à Malásia na lista de países terceiros, territórios, zonas
    ou compartimentos relativamente à gripe aviária de alta patogenicidade, bem
    como no que se refere aos modelos de certificados veterinários para a importação
    de aves de capoeira, pintos do dia, ovos para incubação, carne de aves de capoeira
    e de ratites de criação e ovos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 952/2014 al Comisiei din 4
    septembrie 2014 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în
    ceea ce privește rubrica referitoare la Malaysia din cadrul listei țărilor
    terțe, teritoriilor, zonelor sau compartimentelor cu privire la gripa aviară
    înalt patogenă și la modelele de certificate sanitar-veterinare pentru importul
    de păsări de curte, pui de o zi, ouă pentru incubație, carne de pasăre și
    ratite de crescătorie și ouă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 952/2014 zo 4. septembra 2014
    , ktorým sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o záznam
    týkajúci sa Malajzie v zozname tretích krajín, území, oblastí alebo jednotiek
    v súvislosti s vysokopatogénnou vtáčou chrípkou, ako aj o vzor veterinárneho
    certifikátu na dovoz hydiny, jednodňových kurčiat, násadových vajec, mäsa
    z hydiny a vtákov nadradu bežce a vajec z farmových chovov
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 952/2014 z dne 4. septembra 2014 o
    spremembi Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Malezijo na seznamu
    tretjih držav, ozemelj, območij ali kompartmentov v zvezi z visoko patogeno
    aviarno influenco in glede vzorcev veterinarskih spričeval za uvoz perutnine,
    enodnevnih piščancev, valilnih jajc, perutninskega mesa, mesa gojenih ratitov
    in jajc
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 952/2014 de la Comisión, de 4 de septiembre
    de 2014 , por el que se modifica el anexo I del Reglamento (CE) n ° 798/2008
    en lo relativo, por una parte, a la entrada correspondiente a Malasia que figura
    en la lista de los terceros países, territorios, zonas o compartimentos en relación
    con la influenza aviar de alta patogenicidad y, por otra, a los modelos de certificados
    veterinarios para la importación de aves de corral, pollitos de un día, huevos
    para incubar, carne de aves de corral y de ratites de granja y huevos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 952/2014 av den 4 september
    2014 om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Malaysia i förteckningen över tredjeländer, områden, zoner eller delområden
    med avseende på högpatogen aviär influensa och vad gäller förlagorna till
    veterinärintyg för import av fjäderfä, dagsgamla kycklingar, kläckägg, kött
    av fjäderfä och hägnade ratiter samt ägg
  type: main
