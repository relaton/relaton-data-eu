  content: Commission Decision of 21 December 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the Kingdom of Belgium
    for expenditure on vocational retraining operations carried out by the 'Office
    National de l'Emploi (ONEM)'
  type: main
- language: fr
  script: Latn
  content: Décision 74/175/CEE de la Commission, du 21 décembre 1973, portant octroi
    du concours du Fonds social européen, prévu à l'article 125 du Traité, au
    bénéfice du Royaume de Belgique pour des dépenses relatives à des opérations
    de rééducation professionnelle effectuées par l'Office national de l'emploi
    (ONEM)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973 zur Gewährung eines
    Zuschusses nach Artikel 125 EWGV aus dem Europäischen Sozialfonds an das Königreich
    Belgien zu Aufwendungen für vom "Office national de l'emploi (ONEM)" durchgeführte
    Berufsumschulungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om ydelse af tilskud i henhold
    til traktatens artikel 125 fra Den europæiske Socialfond til kongeriget Belgien
    til udgifter ved foranstaltninger til faglig omskoling, gennemført af "Office
    National de l'Emploi" (ONEM)
  type: main
- language: it
  script: Latn
  content: '74/175/CEE: Decisione della Commissione, del 21 dicembre 1973, recante
    concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore del Regno del Belgio per spese relative ad operazioni
    di riqualificazione professionale effettuate dall''Office national de l''emploi
    (ONEM)'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 houdende toekenning van
