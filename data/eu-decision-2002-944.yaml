title:
- language: en
  script: Latn
  content: '2002/944/EC: Commission Decision of 28 November 2002 amending Decision
    2001/729/EC on the list of programmes for the eradication and monitoring of animal
    diseases and on the list of programmes of checks aimed at the prevention of zoonoses
    qualifying for a financial contribution from the Community in 2002 and Decision
    2001/853/EC approving the programmes for the eradication and monitoring of animal
    diseases and for the prevention of zoonoses presented by the Member States for
    the year 2002 (notified under document number C(2002) 4590)'
  type: main
- language: fr
  script: Latn
  content: '2002/944/CE: Décision de la Commission du 28 novembre 2002 modifiant
    la décision 2001/729/CE relative à la liste des programmes d''éradication et
    de surveillance des maladies animales et à la liste des programmes de contrôles
    visant à la prévention des zoonoses pouvant bénéficier d''une participation
    financière de la Communauté en 2002, ainsi que la décision 2001/853/CE portant
    approbation des programmes d''éradication et de surveillance des maladies animales
    et des programmes de prévention des zoonoses présentés par les États membres
    pour l''année 2002 [notifiée sous le numéro C(2002) 4590]'
  type: main
- language: de
  script: Latn
  content: '2002/944/EG: Entscheidung der Kommission vom 28. November 2002 zur Änderung
    der Entscheidung 2001/729/EG über das Verzeichnis der Programme zur Tilgung und
    Überwachung von Tierseuchen bzw. der Überwachungsprogramme zur Verhütung von
    Zoonosen, die für eine finanzielle Beteiligung der Gemeinschaft im Jahr 2002
    in Betracht kommen, und der Entscheidung 2001/853/EG zur Genehmigung der von den
    Mitgliedstaaten für das Jahr 2002 vorgelegten Programme zur Tilgung und Überwachung
    von Tierseuchen und zur Verhütung von Zoonosen (Bekannt gegeben unter Aktenzeichen
    K(2002) 4590)'
  type: main
- language: da
  script: Latn
  content: '2002/944/EF: Kommissionens beslutning af 28. november 2002 om ændring
    af beslutning 2001/729/EF om listen over programmer for udryddelse og overvågning
    af dyresygdomme og listen over kontrolprogrammer med henblik på forebyggelse
    af zoonoser, hvortil der kan ydes EF-tilskud i 2002, og af beslutning 2001/853/EF
    om godkendelse af de programmer for udryddelse og overvågning af dyresygdomme
    og for forebyggelse af zoonoser, som medlemsstaterne har indsendt for 2002 (meddelt
    under nummer K(2002) 4590)'
  type: main
- language: el
