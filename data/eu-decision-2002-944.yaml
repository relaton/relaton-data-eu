    de doenças dos animais e à lista de programas de controlos para a prevenção
    de zoonoses elegíveis para uma participação financeira da Comunidade em 2002
    e a Decisão 2001/853/CE que aprova os programas de erradicação e vigilância
    de doenças dos animais e de prevenção de zoonoses apresentados pelos Estados-Membros
    para 2002 [notificada com o número C(2002) 4590]'
  type: main
- language: es
  script: Latn
  content: '2002/944/CE: Decisión de la Comisión, de 28 de noviembre de 2002, que
    modifica la Decisión 2001/729/CE, sobre la lista de los programas de erradicación
    y vigilancia de enfermedades animales y la lista de los programas de pruebas encaminados
    a la prevención de zoonosis que pueden optar a una contribución financiera de
    la Comunidad en 2002, y la Decisión 2001/853/CE, por la que se aprueban los programas
    de erradicación y vigilancia de enfermedades animales, así como de prevención
    de zoonosis, presentados para el año 2002 por los Estados miembros [notificada
    con el número C(2002) 4590]'
  type: main
