  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 369/85 van de Commissie van 13 februari 1985 tot
    wijziging van Verordening (EEG) nr. 2729/81 ten aanzien van de overdraagbaarheid
    van de uit het uitvoercertificaat voortvloeiende rechten in de sector melk en
    zuivelprodukten en houdende intrekking van Verordening (EEG) nr. 664/83
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 369/85 da Comissão, de 13 de Fevereiro de 1985,
