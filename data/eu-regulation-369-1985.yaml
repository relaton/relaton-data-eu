    και για την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    664/83
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 369/85, annettu 13 päivänä helmikuuta 1985,
