    johtuvien oikeuksien siirtämisen osalta ja asetuksen (ETY) N:o 664/83 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 369/85 della Commissione del 13 febbraio 1985 che
