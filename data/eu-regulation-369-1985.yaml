    aus der Ausfuhrlizenz im Sektor Milch und Milcherzeugnisse und zur Aufhebung der
    Verordnung (EWG) Nr. 664/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 369/85 af 13. februar 1985 om ændring
