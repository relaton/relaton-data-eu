    découlant du certificat d' exportation dans le secteur du lait et des produits
    laitiers et abrogeant le règlement (CEE) no 664/83
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 369/85 der Kommission vom 13. Februar 1985 zur Änderung
