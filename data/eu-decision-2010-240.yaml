  content: Council Decision of 9 October 2009 on the signing and conclusion of the
    Agreement in the form of an Exchange of Letters between the European Community
    and the Arab Republic of Egypt concerning reciprocal liberalisation measures on
    agricultural products, processed agricultural products and fish and fishery products,
    the replacement of Protocols 1 and 2 and their annexes and amendments to the Euro-Mediterranean
    Agreement establishing an association between the European Communities and their
    Member States, of the one part, and the Arab Republic of Egypt, of the other part
  type: main
- language: fr
