    Fisch und Fischereierzeugnissen, zur Ersetzung der Protokolle 1 und 2 und deren
    Anhängen sowie zur Änderung des Europa-Mittelmeer-Abkommens zur Gründung einer
    Assoziation zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten
    einerseits und der Arabischen Republik Ägypten andererseits
