title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 217/2000 of 28 January 2000 amending Regulation
    (EC) No 3/2000 and increasing to 350 000 tonnes the amount of barley held by the
    Spanish intervention agency for which a standing invitation to tender for resale
    on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 217/2000 de la Commission, du 28 janvier 2000, modifiant
    le règlement (CE) n° 3/2000 et portant à 350 000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur d'orge par l'organisme d'intervention
    espagnol
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 217/2000 der Kommission vom 28. Januar 2000 zur Änderung
    der Verordnung (EG) Nr. 3/2000 und zur Erhöhung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt von Gerste aus Beständen der spanischen Interventionsstelle
    auf 350 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 217/2000 af 28. januar 2000 om ændring
    af forordning (EF) nr. 3/2000 og om forhøjelse til 350 000 tons af den løbende
    licitation med henblik på videresalg på det indre marked af byg, som det spanske
    interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 217/2000 της Επιτροπής,
    της 28ης Ιανουαρίου 2000, που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 3/2000 και ορίζει σε 350 000 τόνους τη διαρκή
    δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά κριθής που έχει στη διάθεσή του ο ισπανικός
    οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 217/2000, annettu 28 päivänä tammikuuta 2000,
    asetuksen (EY) N:o 3/2000 muuttamisesta ja pysyvän tarjouskilpailun nostamisesta
    350 000 tonniin Espanjan interventioelimen hallussapitämän ohramäärän uudelleen
    myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 217/2000 della Commissione, del 28 gennaio 2000, che
    modifica il regolamento (CE) n. 3/2000 e che porta a 350 000 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    orzo detenuto dall'organismo d'intervento spagnolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 217/2000 van de Commissie van 28 januari 2000 tot
    wijziging van Verordening (EG) nr. 3/2000 teneinde de hoeveelheid waarop de permanente
    openbare inschrijving voor de verkoop op de interne markt van gerst uit de voorraden
    van het Spaanse interventiebureau betrekking heeft, tot 350 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 217/2000 da Comissão, de 28 de Janeiro de 2000,
    que altera o Regulamento (CE) n.° 3/2000 e que eleva para 350 000 toneladas o
    concurso permanente para a revenda no mercado interno de cevada detido pelo organismo
    de intervenção espanhol
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 217/2000 de la Comisión, de 28 de enero de 2000, por
    el que se modifica el Reglamento (CE) n° 3/2000 y se eleva a 350 000 toneladas
    la licitación permanente para la reventa en el mercado interior de cebada en
    poder del organismo de intervención español
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 217/2000 av den 28 januari 2000 om ändring
