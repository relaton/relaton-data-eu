title:
- language: en
  script: Latn
  content: '91/44/EEC: Commission Decision of 16 January 1991 amending Commission
    Decision 90/525/EEC of 11 October 1990 authorizing Member States to permit temporarily
    the marketing of forest reproductive material not satisfying the requirements
    of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '91/44/CEE: Décision de la Commission du 16 janvier 1991 modifiant la
    décision 90/525/CEE de la Commission du 11 octobre 1990 autorisant les États
    membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction ne répondant pas aux exigences de la directive 66/404/CEE du
    Conseil'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 16. Januar 1991 zur Änderung der Entscheidung
    90/525/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut
    zum Verkehr zuzulassen, das den Anforderungen der Richtlinie 66/404/EWG des Rates
    nicht entspricht (91/44/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 16. januar 1991 om ændringen af beslutning
    90/525/EØF om bemyndigelse af medlemsstaterne til midlertidigt at tillade handel
    med forstligt formeringsmateriale, der ikke opfylder kravene i Rådets direktiv
    66/404/EØF (91/44/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/44/ΕΟΚ: Απόφαση της Επιτροπής της 16ης Ιανουαρίου
    1991 που τροποποιεί την απόφαση 90/525/ΕΟΚ με την
    οποία παρέχεται η άδεια στα κράτη μέλη να επιτρέπουν
    προσωρινά την εμπορία δασικού πολλαπλασιαστικού
    υλικού το οποίο δεν ανταποκρίνεται στις απαιτήσεις
    της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 16 gennaio 1991 recante modifica della
    decisione 90/525/CEE della Commissione, dell'' 11 ottobre 1990, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisti prescritti dalla direttiva
    66/404/CEE del Consiglio (91/44/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 16 januari 1991 tot wijziging van Beschikking
    90/525/EEG houdende machtiging van de Lid-Staten om bosbouwkundig teeltmateriaal
    dat niet aan de eisen van Richtlijn 66/404/EEG van de Raad voldoet, tijdelijk
    tot de handel toe te laten (91/44/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 16 de Janeiro de 1991 que altera a Decisão 90/525/CEE
    da Comissão, de 11 de Outubro de 1990, que autoriza os Estados-membros a admitir
    temporariamente a comercialização de materiais florestais de reprodução que
    não satisfazem as exigências da Directiva 66/404/CEE do Conselho (91/44/CEE)
    #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 16 de enero de 1991 por la que se modifica
    la Decisión 90/525/CEE de la Comisión, de 11 de octubre de 1990, por la que
    se autoriza a los Estados miembros a admitir temporalmente la comercialización
    de materiales forestales de reproducción que no se ajusten a las exigencias de
    la Directiva 66/404/CEE del Consejo (91/44/CEE) #'
