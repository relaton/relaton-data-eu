title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 209/83 of 27 January 1983 determining the
    extent to which applications lodged in the month of January 1983 for the issue
    of import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 209/83 de la Commission, du 27 janvier 1983, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de janvier 1983 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 209/83 der Kommission vom 27. Januar 1983 über den
    Umfang, in dem den im Monat Januar 1983 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 209/83 af 27. januar 1983 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i januar måned 1983, for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 209/83 της Επιτροπής
    της 27ης Ιανουαρίου 1983 περί καθορισμού σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    έχουν υποβληθεί κατά το μήνα Ιανουάριο του
    1983 για κατεψυγμένα βόεια κρέατα που προορίζονται
    για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 209/83 della Commissione, del 27 gennaio 1983, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di gennaio 1983 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 209/83 van de Commissie van 27 januari 1983 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand januari
    1983 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
