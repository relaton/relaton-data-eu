    líneacha fluaraiseacha a bhfuil caidhpeáil dhúbailte orthu chun críoch soilsithe
    ghinearálta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/284 оd 16. prosinca 2021. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga III. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu žive u linearnim
    fluorescentnim žaruljama s dva podnoška za opće primjene osvjetljenja
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/284 felhatalmazáson alapuló irányelve (2021.
    december 16.) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a higany általános világítási célra szolgáló, két végén fejelt lineáris
    fénycsövekben való felhasználására vonatkozó mentesség tekintetében a
    tudományos és műszaki fejlődéshez történő hozzáigazítás céljából
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2022/284 della Commissione del 16 dicembre 2021
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato III
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso del mercurio in lampade fluorescenti lineari
    ad attacco doppio per usi generali di illuminazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2022/284 (2021. gada 16. decembris),
    ar ko, pielāgojot zinātnes un tehnikas attīstībai, Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu groza attiecībā uz atbrīvojumu dzīvsudraba
    izmantošanai lineārajās divcokolu luminiscences spuldzēs vispārējai apgaismei
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2022/284 2021 m. gruodžio 16 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties naudoti gyvsidabrį
    dvicokolėse tiesiosiose liuminescencinėse bendrojo apšvietimo lempose iš dalies
    keičiamas Europos Parlamento ir Tarybos direktyvos 2011/65/ES III priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/284 tas-16 ta’ Diċembru
    2021 li temenda, għall-finijiet ta’ adattament għall-progress xjentifiku u
    tekniku, l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ eżenzjoni għall-użu tal-merkurju fil-lampi fluworexxenti
    lineari b’żewġ kapep għal finijiet ta’ tidwil ġenerali
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/284 van de Commissie van 16 december 2021
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad betreffende een vrijstelling voor het gebruik van kwik in lineaire
    fluorescentielampen met dubbele lampvoet voor algemene verlichtingsdoeleinden
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/284 z dnia 16 grudnia 2021 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik III do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    stosowania rtęci w dwutrzonkowych liniowych lampach fluorescencyjnych na potrzeby
    oświetlenia ogólnego
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/284 da Comissão de 16 de dezembro de 2021
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção relativa à utilização de mercúrio em lâmpadas fluorescentes
    lineares de casquilho duplo para iluminação geral
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/284 a Comisiei din 16 decembrie 2021 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea mercurului în lămpi fluorescente liniare cu soclu
    dublu destinate iluminatului general
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/284 zo 16. decembra 2021, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    pre používanie ortuti v dvojpäticových lineárnych žiarivkách na všeobecné
    účely osvetlenia
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/284 z dne 16. decembra 2021 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo živega srebra v linearnih fluorescentnih sijalkah za splošno razsvetljavo
    z dvojnim podnožjem zaradi prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/284 de la Comisión de 16 de diciembre de
    2021 por la que se modifica, para adaptarlo al progreso científico y técnico,
    el anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo por
    lo que respecta a una exención relativa al uso de mercurio en lámparas fluorescentes
    lineales de casquillo doble para usos generales de alumbrado
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2022/284 av den 16 december 2021
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av kvicksilver i dubbelsocklade linjära lysrör för
    allmänna belysningsändamål
