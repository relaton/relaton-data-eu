title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/284 of 16 December 2021 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of mercury in double-capped linear fluorescent lamps
    for general lighting purposes
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/284 de la Commission du 16 décembre 2021
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    III de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption pour l’utilisation de mercure dans des lampes fluorescentes
    linéaires à double culot à usage général d’éclairage
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/284 der Kommission vom 16. Dezember 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Quecksilber in beidseitig
    gesockelten linearen Leuchtstofflampen für allgemeine Beleuchtungszwecke
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/284 на Комисията
    от 16 декември 2021 година за изменение, с цел
    привеждане в съответствие с научно-техническия
    напредък, на приложение III към Директива 2011/65/ЕС
    на Европейския парламент и на Съвета по отношение
    на освобождаване от ограничението за употребата
    на живак в двуцокълни линейни луминесцентни
    лампи за целите на общото осветление
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2022/284 ze dne 16. prosince
    2021, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití rtuti v dvoupaticových lineárních zářivkách
    pro všeobecné osvětlování
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2022/284 af 16. december 2021 om
    tilpasning til den videnskabelige og tekniske udvikling af bilag III til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for anvendelsen
    af kviksølv i lineære lysstofrør med to sokler til almenbelysning
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2022/284 της
    Επιτροπής της 16ης Δεκεμβρίου 2021 για την τροποποίηση,
    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος III της
