    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    elohopean käyttöä yleiskäyttöön tarkoitetuissa kaksikantaisissa lineaarisissa
    loistelampuissa koskevasta poikkeuksesta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/284 ón gCoimisiún an 16 Nollaig 2021 lena
