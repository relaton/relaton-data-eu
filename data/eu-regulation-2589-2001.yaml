    de países terceiros previsto no Regulamento (CEE) n.° 2092/91 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2589/2001 al Comisiei din 27 decembrie 2001 de modificare
