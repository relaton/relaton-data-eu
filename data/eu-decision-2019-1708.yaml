    mondiale du commerce (OMC), en ce qui concerne l’adoption d’une décision
    visant à proroger une dérogation de l’OMC permettant aux États-Unis d’accorder
    un traitement tarifaire préférentiel dans le cadre de la loi américaine sur
    la relance économique dans le bassin des Caraïbes (CBERA)
