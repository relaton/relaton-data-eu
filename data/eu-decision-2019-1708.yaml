title:
- language: en
  script: Latn
  content: Council Decision (EU) 2019/1708 of 7 October 2019 establishing the position
    to be taken on behalf of the European Union within the General Council of the
    World Trade Organization on the adoption of a decision to extend a WTO waiver
    permitting the United States to provide preferential tariff treatment under the
    US Caribbean Basin Economic Recovery Act (CBERA)
  type: main
- language: fr
