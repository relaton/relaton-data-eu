  content: COMMISSION REGULATION (EC) No 2083/97 of 23 October 1997 determining the
    extent to which the applications for import licences submitted in October 1997
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 1600/95 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2083/97 DE LA COMMISSION du 23 octobre 1997 déterminant
