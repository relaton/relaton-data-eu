    Lizenzen für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung
    (EG) Nr. 1600/95 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2083/97 af 23. oktober 1997 om, i hvilket
