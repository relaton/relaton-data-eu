title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1774/89 of 21 June 1989 re-establishing
    the levying of customs duties on urea falling within CN code 3102 10 10 originating
    in Brazil to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1774/89 de la Commission du 21 juin 1989 portant rétablissement
    de la perception des droits de douane applicables à l'urée du code NC 3102 10
    10 originaire du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1774/89 DER KOMMISSION vom 21. Juni 1989 zur Wiedereinführung
