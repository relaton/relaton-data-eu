title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1113/90 of 30 April 1990 amending Regulation
    (EEC) No 643/86 laying down detailed rules for the application of the supplementary
    trade mechanism to the live plants and floriculture products imported into Portugal
    concerning the target ceilings for ornamental plants for 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1113/90 de la Commission du 30 avril 1990 modifiant
    le règlement (CEE) n° 643/86 de la Commission déterminant les modalités d'application
    du mécanisme complémentaire aux échanges pour les produits du secteur des plantes
    vivantes et de la floriculture importés au Portugal, en ce qui concerne les plafonds
    indicatifs fixés pour les plantes ornementales, pour l'année 1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1113/90 DER KOMMISSION vom 30. April 1990 zur Aenderung
    der Verordnung (EWG) Nr. 643/86 mit Durchfuehrngsbestimmungen zum ergaenzenden
    Handelsmechanismus fuer die nach Portugal eingefuehrten Erzeugnisse des Sektors
    lebende Pflanzen und Waren des Blumenhandels betreffend die Richtplafonds fuer
    Zierpflanzen fuer das Jahr 1990
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1113/90 af 30. april 1990 om ændring
    af forordning (EØF) nr. 643/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen med levende planter og blomsterdyrkningens produkter
    importeret i Portugal vedrørende de vejledende lofter for 1990 for prydplanter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1113/90 της Επιτροπής
    της 30ής Απριλίου 1990 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 643/86 που καθορίζει τις λεπτομέρειες
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές για τα προϊόντα του τομέα των
    ζωντανών φυτών και της ανθοκομίας που εισάγονται
    στην Πορτογαλία σε ό,τι αφορά τα ενδεικτικά
    όρια για το έτος 1990
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1113/90 DELLA COMMISSIONE del 30 aprile 1990 che modifica
    il regolamento (CEE) n. 643/86 che fissa le modalità d'applicazione del meccanismo
    complementare applicabile agli scambi per i prodotti appartenenti al settore della
    piante vive e della floricultura importati in Portogallo per quanto riguarda i
    massimali indicativi per le piante ornamentali per l'anno 1990
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1113/90 VAN DE COMMISSIE van 30 april 1990 houdende
    wijziging van Verordening (EEG) nr. 643/86 tot vaststelling van de uitvoeringsbepalingen
    inzake de aanvullende regeling voor het handelsverkeer voor produkten van de sector
    levende planten en produkten van de bloementeelt ingevoerd in Portugal wat betreft
    de indicatieve plafonds voor sierplanten voor 1990
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1113/90 DA COMISSAO de 30 de Abril de 1990 que altera
    o Regulamento (CEE) n* 643/86 da Comissao que determina as regras de execuçao
    do mecanismo complementar às trocas comerciais para os produtos do sector das
    plantas vivas e produtos da floricultura, importados em Portugal, no que se refere
    aos limites indicativos previstos para o ano de 1990 para as plantas ornamentais
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1113/90 DE LA COMISION de 30 de abril de 1990 que modifica
    el Reglamento (CEE) no 643/86, por el que se establecen normas para la aplicacion
    del mecanismo complementario aplicable a los intercambios para los productos del
    sector de las plantas vivas y de la floricultura importados en Portugal en lo
    que concierne a los limites maximos indicativos para el ano 1990
  type: main
