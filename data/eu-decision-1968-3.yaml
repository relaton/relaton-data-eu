title:
- language: fr
  script: Latn
  content: Décision du Conseil du 21 décembre 1967, portant ouverture et répartition
    du contingent tarifaire communautaire de tabacs bruts ou non fabriqués et de
    déchets de tabac de la position 24.01 du TDC originaires et en provenance de
    Turquie
  type: main
- language: de
  script: Latn
  content: '68/3/EWG: Entscheidung des Rates vom 21. Dezember 1967 über die Eröffnung
    und Aufteilung des Gemeinschaftszollkontingents für unverarbeiteten Tabak und
    Tabakabfälle (Tarifnr. 24.01 des Gemeinsamen Zolltarifs) mit Ursprung in und
    Herkunft aus der Türkei'
  type: main
- language: it
  script: Latn
  content: '68/3/CEE: Decisione del Consiglio, del 21 dicembre 1967, relativa all''apertura
    e alla ripartizione del contingente tariffario comunitario per i tabacchi greggi
    o non lavorati e i cascami di tabacco della voce 24.01 della tariffa doganale
    comune, originari e in provenienza dalla Turchia'
  type: main
- language: nl
  script: Latn
  content: '68/3/EEG: Beschikking van de Raad van 21 december 1967 houdende opening
    en verdeling van het communautaire tariefcontingent voor ruwe en niet tot verbruik
    bereide tabak en afvallen van tabak (post 24.01 van het gemeenschappelijk douanetarief),
    van oorsprong en van herkomst uit Turkije'
