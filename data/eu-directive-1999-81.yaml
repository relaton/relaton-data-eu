title:
- language: en
  script: Latn
  content: Council Directive 1999/81/EC of 29 July 1999 amending Directive 92/79/EEC
    on the approximation of taxes on cigarettes, Directive 92/80/EEC on the approximation
    of taxes on manufactured tobacco other than cigarettes and Directive 95/59/EC
    on taxes other than turnover taxes which affect the consumption of manufactured
    tobacco
  type: main
- language: fr
  script: Latn
  content: Directive 1999/81/CE du Conseil, du 29 juillet 1999, modifiant la directive
    92/79/CEE concernant le rapprochement des taxes frappant les cigarettes, la directive
    92/80/CEE concernant le rapprochement des taxes frappant les tabacs manufacturés
    autres que les cigarettes, et la directive 95/59/CE concernant les impôts autres
    que les taxes sur le chiffre d'affaires frappant la consommation des tabacs manufacturés
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/81/EG des Rates vom 29. Juli 1999 zur Änderung der Richtlinie
    92/79/EWG zur Annäherung der Verbrauchsteuern auf Zigaretten, der Richtlinie
    92/80/EWG zur Annäherung der Verbrauchsteuern auf andere Tabakwaren als Zigaretten
    und der Richtlinie 95/59/EG über die anderen Verbrauchsteuern auf Tabakwaren
    als die Umsatzsteuer
  type: main
- language: bg
  script: Cyrl
  content: Директива 1999/81/EО на Съвета от 29 юли 1999 година
    за изменение на Директива 92/79/EИО относно сближаването
    на данъците върху цигари, Директива 92/80/EИО
    относно сближаването на данъците върху тютюневите
    изделия, различни от цигари, и Директива 95/59/ЕО
    относно данъците, различни от данъка върху
    оборота, които оказват влияние върху потреблението
    на тютюневи изделия
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 1999/81/ES ze dne 29. července 1999, kterou se mění směrnice
    92/79/EHS o sbližování daní z cigaret, směrnice 92/80/EHS o sbližování
    daní z jiných tabákových výrobků než cigaret a směrnice 95/59/ES o daních
    jiných než daních z obratu, které ovlivňují spotřebu tabákových výrobků
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 1999/81/EF af 29. juli 1999 om ændring af direktiv 92/79/EØF
    om indbyrdes tilnærmelse af cigaretafgifterne, direktiv 92/80/EØF om indbyrdes
    tilnærmelse af afgifterne på andre former for forarbejdet tobak end cigaretter
    og direktiv 95/59/EF om forbrugsbeskatning af forarbejdet tobak bortset fra omsætningsafgift
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/81/ΕΚ του Συμβουλίου, της 29ης Ιουλίου
