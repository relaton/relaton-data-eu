    tupakan kuin savukkeiden verojen lähentämisestä annetun direktiivin 92/80/ETY
    ja muista valmistetun tupakan kulutukseen kohdistuvista veroista kuin liikevaihtoveroista
    annetun direktiivin 95/59/ÅY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1999/81/EK irányelve (1999. július 29.) a cigaretták adójának
