    muudelt tubakatoodetelt peale sigarettide makstavate maksude ühtlustamise kohta
    ja direktiivi 95/59/EÜ tubakatoodete tarbimist mõjutavate muude maksude kohta
    peale käibemaksu
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 1999/81/EY, annettu 29 päivänä heinäkuuta 1999,
