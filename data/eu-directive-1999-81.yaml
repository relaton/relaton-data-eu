    adójának közelítéséről szóló 92/80/EGK irányelv és a dohánygyártmányok
    fogyasztását érintő, a forgalmi adón kívüli egyéb adókról szóló 95/59/EK
    irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/81/CE del Consiglio, del 29 luglio 1999, che modifica la
    direttiva 92/79/CEE relativa al ravvicinamento delle imposte sulle sigarette,
    la direttiva 92/80/CEE relativa al ravvicinamento delle imposte sui tabacchi lavorati
    diversi dalle sigarette e la direttiva 95/59/CE relativa alle imposte diverse
    dall'imposta sul volume d'affari che gravano sul consumo dei tabacchi lavorati
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 1999/81/EK (1999. gada 29. jūlijs), ar ko groza Direktīvu
    92/79/EEK par nodokļu saskaņošanu cigaretēm, Direktīvu 92/80/EEK par nodokļu
    saskaņošanu tabakas izstrādājumiem, kas nav cigaretes, un Direktīvu 95/59/EK
    par nodokļiem, kas nav apgrozījuma nodokļi un kas ietekmē tabakas izstrādājumu
    patēriņu
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 29 d. Tarybos direktyva 1999/81/EB iš dalies keičianti
    Direktyvą 92/79/EEB dėl mokesčių už cigaretes, suderinimo, Direktyvą 92/80/EEB
    dėl mokesčių už apdorotą tabaką, išskyrus cigaretes suderinimo ir Direktyvą
    95/59/EB dėl kitų nei apyvartos mokesčių, kurie turi įtakos apdoroto tabako
    suvartojimui
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 1999/81/KE tad-29 ta' Lulju 1999 li temenda d-direttiva
