    την προσέγγιση των φόρων στα τσιγάρα, της οδηγίας
    92/80/ΕΟΚ για την προσέγγιση των φόρων στα βιομηχανοποιημένα
    καπνά εκτός των τσιγάρων και της οδηγίας 95/59/ΕΚ
