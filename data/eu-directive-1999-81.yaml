    it-tqarrib tat-taxxi fuq it-tabakk maħdum li mhuwiex sigaretti u d-Direttiva
    95/59/KE dwar taxxi għajr taxxi fuq id-dħul mill-bejgħ li jaffettwaw il-konsum
    tat-tabakk maħdum
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/81/EG van de Raad van 29 juli 1999 tot wijziging van Richtlijn
    92/79/EEG betreffende de onderlinge aanpassing van de belastingen op sigaretten,
    Richtlijn 92/80/EEG betreffende de onderlinge aanpassing van de belastingen op
    andere tabaksfabrikaten dan sigaretten en Richtlijn 95/59/EG betreffende de belasting,
    andere dan omzetbelasting, op het verbruik van tabaksfabrikaten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 1999/81/WE z dnia 29 lipca 1999 r. zmieniająca dyrektywę
    97/79/EWG w sprawie ujednolicenia podatków od papierosów, dyrektywę 92/80/EWG
    w sprawie ujednolicenia podatków od wyrobów tytoniowych innych niż papierosy
    i dyrektywę 95/59/WE w sprawie podatków innych niż podatki obrotowe wpływających
    na spożycie wyrobów tytoniowych
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/81/CE do Conselho, de 29 de Julho de 1999, que altera a
    Directiva 92/79/CEE relativa à aproximação dos impostos sobre os cigarros,
    a Directiva 92/80/CEE relativa à aproximação dos impostos sobre os tabacos
    manufacturados que não sejam cigarros e a Directiva 95/59/CE relativa aos impostos
    que incidem sobre o consumo de tabacos manufacturados, com excepção dos impostos
    sobre o volume de negócios
  type: main
- language: ro
  script: Latn
  content: Directiva 1999/81/CE a Consiliului din 29 iulie 1999 de modificare a Directivei
    92/79/CEE privind apropierea taxelor pe țigări, a Directivei 92/80/CEE privind
    apropierea taxelor pe tutunul prelucrat, cu excepția țigărilor, și a Directivei
    95/59/CE privind taxele, altele decât impozitul pe cifra de afaceri, care afectează
    consumul de tutun prelucrat
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 1999/81/ES z 29. júla 1999, ktorou sa mení a dopĺňa smernica
    92/79/EHS o zbližovaní daní na cigarety, smernica 92/80/EHS o zbližovaní
    daní na iné výrobky z tabaku ako cigarety a smernica 95/59/ES o iných daniach
    ako daň z obratu, ktoré ovplyvňujú spotrebu výrobkov z tabaku
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 1999/81/ES z dne 29. julija 1999 o spremembi Direktive
    92/79/EGS o približevanju davkov na cigarete, Direktive 92/80/EGS o približevanju
    davkov na tobačne izdelke, razen cigarete, in Direktive 95/59/ES o davkih, razen
    prometnih davkih, ki vplivajo na porabo tobačnih izdelkov
  type: main
- language: es
  script: Latn
  content: Directiva 1999/81/CE del Consejo, de 29 de julio de 1999, por la que se
    modifica la Directiva 92/79/CEE relativa a la aproximación de los impuestos sobre
    los cigarrillos, la Directiva 92/80/CEE relativa a la aproximación de los impuestos
    sobre el tabaco elaborado, excluidos los cigarrillos, y la Directiva 95/59/CE
    relativa a los impuestos sobre el volumen de negocios que gravan el consumo de
    labores del tabaco
  type: main
