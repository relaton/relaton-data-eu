title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1024/1999 of 18 May 1999 amending Regulation
    (EC) No 1595/98 amending Regulation (EC) No 2603/97 laying down the detailed implementing
    rules for imports of rice originating in the ACP countries or the overseas countries
    and territories (OCT) and laying down specific detailed rules on the partial reimbursement
    of import duties levied on rice originating in the ACP countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1024/1999 de la Commission, du 18 mai 1999, modifiant
    le règlement (CE) n° 1595/98 modifiant le règlement (CE) n° 2603/97 fixant
    les modalités d'application pour l'importation de riz originaire des États ACP
    ainsi que pour l'importation de riz originaire des pays et territoires d'outre-mer
    (PTOM) et arrêtant certaines modalités spécifiques pour le remboursement partiel
    des droits à l'importation perçus pour le riz originaire des États ACP
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1024/1999 der Kommission vom 18. Mai 1999 zur Änderung
    der Verordnung (EG) Nr. 1595/98 zur Änderung der Verordnung (EG) Nr. 2603/97
    mit Durchführungsbestimmungen zu den Einfuhren von Reis mit Ursprung in den AKP-Staaten
    sowie den überseeischen Ländern und Gebieten (ÜLG) und zur Festlegung besonderer
    Modalitäten für die teilweise Erstattung des bei der Einfuhr von Reis mit Ursprung
    in den AKP-Staaten erhobenen Zolls
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1024/1999 на комисията от 18
    май 1999 година за изменение на Регламент (ЕО)
    № 1595/98 за изменение на Регламент (ЕО) № 2603/97
    относно установяване на подробни правила за
    внос на ориз с произход държавите от Африка,
    Карибския и Тихоокеанския басейн (АКТБ) или
    отвъдморските страни и територии (ОСТ) и за
    установяването на специфични подробни правила
    за частично възстановяване на вносните мита,
    наложени за ориз с произход държавите от AКТБ
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1024/1999 ze dne 18. května 1999, kterým
