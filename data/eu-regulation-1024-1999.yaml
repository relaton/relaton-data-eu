    č. 2603/97, kterým se stanoví prováděcí pravidla pro dovoz rýže původem
    ze států AKT, jakož i pro dovoz rýže původem ze zámořských zemí a území,
    a kterým se stanoví zvláštní pravidla pro částečnou úhradu dovozních
    cel vybraných za rýži původem ze států AKT
  type: main
- language: da
  script: Latn
