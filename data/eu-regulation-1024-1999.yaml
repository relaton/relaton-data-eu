  script: Latn
  content: Komission asetus (EY) N:o 1024/1999, annettu 18 päivänä toukokuuta 1999,
    AKT-maista sekä merentakaisista maista ja alueilta (MMA) peräisin olevan riisin
    tuonnin soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen
    (EY) N:o 2603/97 muuttamisesta ja AKT-maista peräisin olevasta riisistä perittävien
    tullien osittaista palauttamista koskevista eräistä yksityiskohtaisista säännöistä
    annetun komission asetuksen (EY) N:o 1595/98 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1024/1999 od 18. svibnja 1999. o izmjeni Uredbe
    (EZ) br. 1595/98 o izmjeni Uredbe (EZ) br. 2603/97 o utvrđivanju detaljnih provedbenih
    pravila za uvoz riže podrijetlom iz afričkih, karipskih i pacifičkih zemalja
    (zemalja AKP-a) ili prekomorskih zemalja i područja (PZP-a) i o utvrđivanju
    posebnih detaljnih pravila za djelomičnu nadoknadu uvoznih carina naplaćenih
    za rižu podrijetlom iz zemalja AKP-a
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1024/1999/EK rendelete (1999. május 18.) az AKCS országokból,
    illetve a tengerentúli országokból és területekről (TOT) származó rizs
    behozatalára vonatkozó részletes végrehajtási szabályok megállapításáról
    szóló 2603/97/EK rendelet módosításáról, valamint az AKCS országokból
    származó rizsre kivetett importvámok részleges visszatérítésére vonatkozó
    különös részletes szabályok megállapításáról szóló 1595/98/EK rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1024/1999 della Commissione, del 18 maggio 1999, recante
    modifica del regolamento (CE) n. 1595/98 che modifica il regolamento (CE) n. 2603/97
    recante modalità d'applicazione per l'importazione di riso originario degli Stati
    ACP e dei paesi e territori d'oltremare (PTOM) e che stabilisce talune modalità
    specifiche per il rimborso parziale dei dazi all'importazione riscossi per il
    riso originario degli Stati ACP
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1024/1999 (1999. gada 18. maijs), ar ko groza
    Regulu (EK) Nr. 1595/98, ar kuru groza Regulu (EK) Nr. 2603/97, ar ko paredz sīki
    izstrādātus īstenošanas noteikumus, lai importētu rīsus, kuru izcelsme ir
    ĀKK valstīs vai aizjūras zemēs un teritorijās (AZT), kā arī nosaka īpašus
    sīki izstrādātus noteikumus daļējai to ievedmuitas nodokļu atmaksāšanai,
    ko iekasē par rīsiem, kuru izcelsme ir ĀKK valstīs
  type: main
- language: lt
  script: Latn
  content: 1999 m. gegužės 18 d. Komisijos reglamentas (EB) Nr. 1024/1999, iš dalies
    keičiantis Reglamentą (EB) Nr. 1595/98, iš dalies keičiantį Reglamentą (EB)
    Nr. 2603/97, nustatantį išsamias ryžių importo iš AKR arba užjūrio šalių
    ir teritorijų (UŠT) taisykles, ir nustatantis specialias išsamias ryžių iš
    AKR šalių importo mokesčių dalies kompensavimo taisykles
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1024/1999 tat-18 ta’ Mejju 1999
    li jemenda r-Regolament (KE) Nru 1595/98 li jemenda r-Regolament (KE) Nru 2603/97
    li jistabbilixxi r-regoli dettaljati għall-implimentazzjoni ta’ l-importazzjoni
    ta’ ross li joriġina mill-pajjizi AKP jew il-pajjizi u t-territorji imbiegħda
    (OCT) u li jistabbilixxi r-regoli speċifiċi u dettaljati dwar ir-rimborż parzjali
    tad-dazju ta’ l-importazzjoni impost fuq ir-ross li joriġina mill-pajjizi ta’
    AKP
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1024/1999 van de Commissie van 18 mei 1999 houdende
    wijziging van Verordening (EG) nr. 1595/98 tot wijziging van Verordening (EG)
    nr. 2603/97 houdende uitvoeringsbepalingen voor de invoer van rijst van oorsprong
    uit de ACS-staten en uit de landen en gebieden overzee (LGO) en tot vaststelling
    van bepaalde specifieke bepalingen voor de gedeeltelijke terugbetaling van de
    voor rijst van oorsprong uit de ACS-staten geïnde invoerrechten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1024/99 z dnia 18 maja 1999 r. zmieniające
    rozporządzenie (WE) nr 1595/98 zmieniające rozporządzenie (WE) nr 2603/97 ustanawiające
    szczegółowe zasady dotyczące przywozu ryżu pochodzącego z krajów AKP lub
    z krajów i terytoriów zamorskich (KTZ) oraz ustanawiające określone warunki
    dotyczące częściowego zwrotu należności przywozowych nałożonych na ryż
    pochodzący z krajów AKP
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1024/1999 da Comissão, de 18 de Maio de 1999, que
    altera o Regulamento (CE) n° 1595/98 que altera o Regulamento (CE) n° 2603/97
    que estabelece as normas de execução para a importação de arroz originário
    dos Estados de África, das Caraíbas e do Pacífico (ACP) e dos países e territórios
    ultramarinos (PTU) e que adopta certas modalidades específicas para o reembolso
    parcial dos direitos de importação cobrados pelo arroz originário dos Estados
    ACP
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1024/1999 al Comisiei din 18 mai 1999 de modificare
    a Regulamentului (CE) nr. 1595/98 de modificare a Regulamentului (CE) nr. 2603/97
    de stabilire a normelor de aplicare privind importurile de orez provenind din
    țările ACP și din țările și teritoriile de peste mări, precum și de stabilire
    a normelor speciale privind rambursarea parțială a drepturilor de import percepute
    pentru orezul provenind din țările ACP
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1024/1999 z 18. mája 1999, ktorým sa mení
    a dopĺňa nariadenie Komisie (ES) č. 1595/98, ktorým sa mení a dopĺňa nariadenie
    (ES) č. 2603/97, ktorým sa stanovujú podrobné vykonávacie predpisy na dovozy
    ryže s pôvodom v krajinách AKT alebo v zámorských krajinách a teritóriách
    (ZKT) a ustanovujúce osobitné podrobné pravidlá o čiastočnej náhrade dovozných
    ciel uvalených na ryžu s pôvodom v krajinách AKT
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1024/1999 z dne 18. maja 1999 o spremembi Uredbe
    (ES) št. 1595/98 o spremembi Uredbe (ES) št. 2603/97 o določitvi podrobnih
    izvedbenih pravil za uvoz riža s poreklom iz držav AKP ali čezmorskih držav
    in ozemelj (ČDO) in določitvi posebnih podrobnih pravil o delnem povračilu
    uvoznih dajatev za riž s poreklom iz držav AKP
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1024/1999 de la Comisión, de 18 de mayo de 1999, por
    el que se modifica el Reglamento (CE) n° 1595/98 que modifica el Reglamento (CE)
    n° 2603/97 por el que se establecen las disposiciones de aplicación para la
    importación de arroz originario de los Estados ACP y de los países y territorios
    de Ultramar (PTU) y por el que se establecen determinadas disposiciones especiales
    para el reembolso parcial de los derechos de importación percibidos por el arroz
    originario de los Estados ACP
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1024/1999 av den 18 maj 1999 om ändring
    av förordning (EG) nr 1595/98 om ändring av förordning (EG) nr 2603/97 om fastställande
    av tillämpningsföreskrifter för import av ris med ursprung i AVS-staterna och
    de utomeuropeiska länderna och territorierna (ULT) och om fastställande av vissa
    särskilda föreskrifter för den delvisa återbetalningen av importtullar för
    ris från AVS-staterna
