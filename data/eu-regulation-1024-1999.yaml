    for ordningen for import af ris med oprindelse i AVS-staterne samt i de oversøiske
    lande og territorier (OLT) og om fastsættelse af visse bestemmelser for delvis
    godtgørelse af importtolden for ris med oprindelse i AVS-staterne
  type: main
