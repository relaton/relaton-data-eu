  script: Latn
  content: '85/140/EEC: Commission Decision of 30 January 1985 repealing Commission
    Decision 82/314/EEC and establishing that the apparatus described as ''PAR - Vibrating
    Sample Magnetometer, model 155'' may be imported free of import duties'
  type: main
- language: fr
  script: Latn
  content: '85/140/CEE: Décision de la Commission du 30 janvier 1985 abrogeant la
    décision 82/314/CEE de la Commission et constatant que l'' appareil dénommé
    "PAR - Vibrating Sample Magnetometer, model 155" peut être importé en franchise
    des droits à l'' importation'
  type: main
- language: de
  script: Latn
  content: '85/140/EWG: Entscheidung der Kommission vom 30. Januar 1985 mit der die
    Entscheidung 82/314/EWG der Kommission aufgehoben und mit der festgestellt wird,
    daß das Gerät ,,PAR - Vibrating Sample Magnetometer, model 155'' '' unter Befreiung
    von den Eingangsabgaben eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '85/140/EØF: Kommissionens beslutning af 30. januar 1985 om ophævelse
