title:
- language: en
  script: Latn
  content: '80/125/EEC: Commission Decision of 27 December 1979 authorizing Ireland
    to store outside its territory during the first quarter of 1980 beef products
    held by its intervention agency (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/125/CEE: Décision de la Commission, du 27 décembre 1979, autorisant
    l''Irlande à stocker hors de son territoire, pendant le premier trimestre 1980,
    des produits du secteur de la viande bovine détenus par son organisme d''intervention
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/125/EWG: Entscheidung der Kommission vom 27. Dezember 1979 zur Ermächtigung
    Irlands, während des ersten Vierteljahres 1980 Erzeugnisse des Rindfleischsektors
    im Besitz seiner Interventionsstelle außerhalb seines Hoheitsgebiets zu lagern
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/125/EØF: Kommissionens beslutning af 27. december 1979 om bemyndigelse
    af Irland til i første kvartal 1980 uden for sit område at oplagre produkter
    fra oksekødsektoren, som dets interventionsorgan ligger inde med (Kun den engelske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/125/CEE: Decisione della Commissione, del 27 dicembre 1979, che autorizza
    l''Irlanda ad immagazzinare nel primo trimestre 1980 fuori del proprio territorio
    prodotti del settore delle carni bovine detenuti dall''organismo d''intervento
    irlandese (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/125/EEG: Beschikking van de Commissie van 27 december 1979 waarbij
    Ierland wordt gemachtigd om produkten van de sector rundvlees die in het bezit
    zijn van het Ierse interventiebureau, gedurende het eerste kwartaal 1980 buiten
    zijn grondgebied op te slaan (Slechts de tekst in de Engelse taal is authentiek)'
