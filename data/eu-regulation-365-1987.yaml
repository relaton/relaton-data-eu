    στον τομέα του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 365/87 della Commissione del 5 febbraio 1987 che deroga,
    per il primo trimestre del 1987, al regolamento (CEE) n. 2377/80 per quanto concerne
    il rilascio dei titoli d' importazione nell' ambito di regimi speciali nel settore
    delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 365/87 van de Commissie van 5 februari 1987 tot afwijking
