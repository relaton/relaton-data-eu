    de certains régimes spéciaux dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 365/87 der Kommission vom 5. Februar 1987 zur Abweichung
    von der Verordnung (EWG) Nr. 2377/80 hinsichtlich der Erteilung von Einfuhrlizenzen
    im Rahmen von Sonderregelungen im ersten Vierteljahr 1987 auf dem Sektor Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 365/87 af 5. februar 1987 om undtagelse
