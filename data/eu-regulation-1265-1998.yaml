  script: Latn
  content: Commission Regulation (EC) No 1265/98 of 18 June 1998 supplementing the
    Annex to Regulation (EC) No 2400/96 on the entry of certain names in the Register
    of protected designations of origin and protected geographical indications provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs
  type: main
- language: fr
  script: Latn
