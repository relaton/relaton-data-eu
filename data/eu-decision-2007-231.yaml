title:
- language: en
  script: Latn
  content: '2007/231/EC: Commission Decision of 12 April 2007 amending Decision 2006/502/EC
    requiring Member States to take measures to ensure that only lighters which are
    child-resistant are placed on the market and to prohibit the placing on the market
    of novelty lighters (notified under document number C(2007) 1567)'
  type: main
- language: fr
  script: Latn
  content: '2007/231/CE: Décision de la Commission du 12 avril 2007 modifiant la
    décision 2006/502/CE exigeant des États membres qu’ils prennent des mesures
    destinées à faire en sorte que seuls les briquets présentant des caractéristiques
    de sécurité enfants soient mis sur le marché et à interdire la mise sur le
    marché de briquets fantaisie [notifiée sous le numéro C(2007) 1567]'
  type: main
- language: de
  script: Latn
  content: '2007/231/EG: Entscheidung der Kommission vom 12. April 2007 zur Änderung
