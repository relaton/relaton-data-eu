    Zelândia no que diz respeito às Ilhas Cook, a Niuê e a Toquelau aos certificados
    emitidos em conformidade com o Regulamento (UE) 2021/953 do Parlamento Europeu
    e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1949 a Comisiei din 13 octombrie
    2022 de stabilire, cu scopul de a facilita exercitarea dreptului la liberă circulație
    pe teritoriul Uniunii, a echivalenței certificatelor privind COVID-19 eliberate
    de Noua Zeelandă în ceea ce privește Insulele Cook, Niue și Tokelau cu certificatele
    eliberate în conformitate cu Regulamentul (UE) 2021/953 al Parlamentului European
    și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1949 z 13. októbra 2022, ktorým
    sa na účely uľahčenia práva na voľný pohyb v rámci Únie stanovuje rovnocennosť
    potvrdení súvisiacich s ochorením COVID-19 vydávaných Novým Zélandom vo
    vzťahu ku Cookovým ostrovom, Niue a Tokelau s potvrdeniami vydávanými v súlade
    s nariadením Európskeho parlamentu a Rady (EÚ) 2021/953
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1949 z dne 13. oktobra 2022 o določitvi
