    tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1949 van de Commissie van 13 oktober 2022
    houdende vaststelling van de gelijkwaardigheid, teneinde het recht van vrij verkeer
    binnen de Unie te faciliteren, van door Nieuw-Zeeland voor de Cookeilanden, Niue
    en Tokelau afgegeven COVID-19-certificaten met de overeenkomstig Verordening (EU)
    2021/953 van het Europees Parlement en de Raad afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1949 z dnia 13 października 2022
