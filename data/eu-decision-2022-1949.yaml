    Fómhair 2022 lena leagtar síos gur coibhéiseach, chun an ceart chun saorghluaiseachta
    laistigh den Aontas a éascú, iad na deimhnithe COVID-19 a eisíonn an Nua-Shéalainn
    i leith Oileáin Cook, Niue agus Thócalá leis na deimhnithe a eisítear i gcomhréir
    le Rialachán (AE) 2021/953 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1949 оd 13. listopada 2022. o utvrđivanju
    jednakovrijednosti, u svrhu olakšavanja ostvarivanja prava na slobodno kretanje
    unutar Unije, COVID-19 potvrda koje Novi Zeland izdaje za Cookove Otoke, Niue
    i Tokelau s potvrdama izdanima u skladu s Uredbom (EU) 2021/953 Europskog parlamenta
    i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1949 végrehajtási határozata (2022. október
    13.) az Új-Zéland által a Cook-szigetek, Niue és a Tokelau-szigetek tekintetében
    kiállított Covid19-igazolványoknak az (EU) 2021/953 európai parlamenti és
    tanácsi rendelettel összhangban kiállított igazolványokkal való egyenértékűségének
    az Unión belüli szabad mozgáshoz való jog előmozdítása céljából történő
    megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1949 della Commissione del 13 ottobre
    2022 che stabilisce l’equivalenza, al fine di agevolare il diritto di libera
    circolazione nell’ambito dell’Unione, dei certificati COVID-19 rilasciati
    dalla Nuova Zelanda per le Isole Cook, Niue e Tokelau ai certificati rilasciati
    in conformità del regolamento (UE) 2021/953 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1949 (2022. gada 13. oktobris),
    ar ko nolūkā atvieglot tiesības brīvi pārvietoties Savienībā nosaka Jaunzēlandes
    attiecībā uz Kuka Salām, Niue un Tokelau izdoto Covid-19 sertifikātu līdzvērtīgumu
    sertifikātiem, kuri izdoti saskaņā ar Eiropas Parlamenta un Padomes Regulu
    (ES) 2021/953
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1949 2022 m. spalio 13 d.
    kuriuo, siekiant sudaryti palankesnes sąlygas naudotis laisvo judėjimo teise
    Sąjungoje, nustatomas Naujosios Zelandijos Kuko Saloms, Niujei ir Tokelau išduotų
    COVID-19 pažymėjimų lygiavertiškumas pagal Europos Parlamento ir Tarybos reglamentą
    (ES) 2021/953 išduotiems pažymėjimams
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1949 tat-13
