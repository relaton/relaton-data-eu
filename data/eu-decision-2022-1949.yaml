    swobodnego przemieszczania się w Unii, zaświadczeń COVID-19 wydawanych przez
    Nową Zelandię w odniesieniu do Wysp Cooka, Niue i Tokelau, z zaświadczeniami
    wydawanymi zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1949 da Comissão de 13 de outubro de
