    otoki, Niuejem in Tokelavom, ter potrdil, izdanih v skladu z Uredbo (EU) 2021/953
    Evropskega parlamenta in Sveta, da se olajša uveljavljanje pravice do prostega
    gibanja v Uniji
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1949 de la Comisión de 13 de octubre
