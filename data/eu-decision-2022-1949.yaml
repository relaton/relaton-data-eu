    tad-dritt tal-moviment ħieles fl-Unjoni, taċ-ċertifikati tal-COVID-19 maħruġa
    minn New Zealand fir-rigward tal-Gżejjer Cook, ta’ Niue u t-Tokelau maċ-ċertifikati
