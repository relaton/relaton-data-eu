    a la libre circulación dentro de la Unión, entre los certificados COVID-19 expedidos
    por Nueva Zelanda respecto de las Islas Cook, Niue y Tokelau y los expedidos de
    conformidad con el Reglamento (UE) 2021/953 del Parlamento Europeo y del Consejo
  type: main
