id: EUDecision1978207
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 January 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's woven shirts of mixed synthetic textile fibres, falling
    within heading No ex 61.03 of the Common Customs Tariff, originating in Taiwan
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/207/CEE: Décision de la Commission, du 16 janvier 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises tissées de fibres textiles
    synthétiques mélangées, pour hommes, de la position Ex 61.03 du Tarif douanier
    commun, originaires de Taiwan et mises en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. Januar 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche gewebte Oberhemden aus gemischten synthetischen Spinnstoffen der Tarifstelle
    ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 16. januar 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage skjorter til mænd af blandede syntetiske fibre, som henhører under
    pos. ex 61.03 i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 gennaio 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie tessute con fibre tessili sintetiche miste,
    per uomo, della voce ex 61.03 della tariffa doganale comune, originarie di Taiwan
    e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 januari 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden
    gemachtigd herenoverhemden van gemengde synthetische vezels van post ex 61.03
    van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
