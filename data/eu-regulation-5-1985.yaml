    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη που είναι νηολογημένα στις νήσους Φερόε
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 5/85 del Consiglio del 19 dicembre 1984 che stabilisce,
