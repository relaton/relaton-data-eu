    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 5/85 van de Raad van 19 december 1984 tot vaststelling
    voor 1985 van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden, van toepassing op vaartuigen die op de Faeröer geregistreerd zijn
  type: main
