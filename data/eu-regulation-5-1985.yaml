  content: Council Regulation (EEC) No 5/85 of 19 December 1984 laying down for 1985
    certain measures for the conservation and management of fishery resources applicable
    to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 5/85 du Conseil du 19 décembre 1984 fixant, pour l'
    année 1985, certaines mesures de conservation et de gestion des ressources de
    pêche applicables aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 5/85 des Rates vom 19. Dezember 1984 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    auf den Färöern registrierten Schiffen für 1985
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 5/85 af 19. december 1984 om fastsættelse
    for 1985 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 5/85 του Συμβουλίου
