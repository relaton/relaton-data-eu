id: EUDirective1968151
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: First Council Directive 68/151/EEC of 9 March 1968 on co-ordination of
    safeguards which, for the protection of the interests of members and others, are
    required by Member States of companies within the meaning of the second paragraph
    of Article 58 of the Treaty, with a view to making such safeguards equivalent
    throughout the Community
  type: main
- language: fr
  script: Latn
  content: Première directive 68/151/CEE du Conseil, du 9 mars 1968, tendant à coordonner,
    pour les rendre équivalentes, les garanties qui sont exigées, dans les États
    membres, des sociétés au sens de l'article 58 deuxième alinéa du traité,
    pour protéger les intérêts tant des associés que des tiers
  type: main
- language: de
  script: Latn
  content: Erste Richtlinie 68/151/EWG des Rates vom 9. März 1968 zur Koordinierung
    der Schutzbestimmungen, die in den Mitgliedstaaten den Gesellschaften im Sinne
    des Artikels 58 Absatz 2 des Vertrages im Interesse der Gesellschafter sowie Dritter
    vorgeschrieben sind, um diese Bestimmungen gleichwertig zu gestalten
  type: main
- language: bg
  script: Cyrl
  content: Първа Директива на Съвета от 9 март 1968 година
    за съгласуване на гаранциите, които държавите-членки
    изискват от дружествата по смисъла на член
    58, втора алинея от Договора, за защита на интересите
    на съдружниците и на трети лица, с цел тези
    гаранции да станат равностойни на цялата територия
    на Общността
  type: main
- language: cs
  script: Latn
  content: První směrnice Rady ze dne 9. března 1968 o koordinaci ochranných opatření,
    která jsou na ochranu zájmů společníků a třetích osob vyžadována v členských
    státech od společností ve smyslu čl. 58 druhého pododstavce Smlouvy, za účelem
    dosažení rovnocennosti těchto opatření
  type: main
- language: da
  script: Latn
  content: Rådets første direktiv 68/151/EØF af 9. marts 1968 om samordning af
    de garantier, som kræves i medlemsstaterne af de i traktatens artikel 58, stk.
    2, nævnte selskaber til beskyttelse af såvel selskabsdeltagernes som tredjemands
    interesser, med det formål at gøre disse garantier lige byrdefulde
  type: main
- language: el
  script: Grek
  content: Πρώτη οδηγία 68/151/ΕΟΚ του Συμβουλίου της
    9ης Μαρτίου 1968 περί συντονισμού των εγγυήσεων
    που απαιτούνται στα κράτη μέλη εκ μέρους των
    εταιρειών, κατά την έννοια του άρθρου 58 δεύτερη
    παράγραφος της συνθήκης, για την προστασία
    των συμφερόντων των εταίρων και των τρίτων
    με σκοπό να καταστούν οι εγγυήσεις αυτές ισοδύναμες
  type: main
- language: et
  script: Latn
  content: Esimene nõukogu direktiiv, 9. märts 1968, tagatiste kooskõlastamise
    kohta, mida liikmesriigid äriühingu liikmete ja kolmandate isikute huvide kaitseks
    EMÜ asutamislepingu artikli 58 teises lõigus tähendatud äriühingutelt nõuavad,
    et muuta sellised tagatised ühenduse kõigis osades võrdväärseteks
  type: main
- language: fi
  script: Latn
  content: Ensimmäinen neuvoston direktiivi 68/151/ETY, annettu 9 päivänä maaliskuuta
    1968, niiden takeiden yhteensovittamisesta samanveroisiksi, joita jäsenvaltioissa
    vaaditaan perustamissopimuksen 58 artiklan 2 kohdassa tarkoitetuilta yhtiöiltä
    niiden jäsenten sekä ulkopuolisten etujen suojaamiseksi
  type: main
- language: hu
  script: Latn
  content: A Tanács első irányelve (1968. március 9.) az egész Közösségre
    kiterjedő egységes biztosítékok kialakítása érdekében a tagállamok által
    a társasági tagok és harmadik személyek érdekei védelmében a Szerződés
    58. cikkének (2) bekezdése szerinti társaságoknak előírt biztosítékok
    összehangolásáról
  type: main
- language: it
  script: Latn
  content: Prima direttiva 68/151/CEE del Consiglio, del 9 marzo 1968, intesa a coordinare,
    per renderle equivalenti, le garanzie che sono richieste, negli Stati Membri,
    alle società a mente dell'articolo 58, secondo comma, del Trattato per proteggere
    gli interessi dei soci e dei terzi
  type: main
- language: lv
  script: Latn
  content: Padomes pirmā direktīva (1968. gada 9. marts) par to, kā vienādošanas
    nolūkā koordinēt nodrošinājumus, ko dalībvalstis prasa no sabiedrībām
    Līguma 58. panta otrās daļas nozīmē, lai aizsargātu sabiedrību dalībnieku
    un trešo personu intereses
  type: main
- language: lt
  script: Latn
  content: 1968 m. kovo 9 d. Pirmoji tarybos Direktyva dėl apsaugos priemonių, kurių
    valstybės narės, siekdamos suvienodinti tokias apsaugos priemones visoje Bendrijoje,
    reikalauja iš Sutarties 58 straipsnio antroje pastraipoje apibrėžtų bendrovių,
    jų narių ir kitų interesų apsaugai, koordinavimo
  type: main
- language: mt
  script: Latn
  content: L-ewwel Direttiva tal-Kunsill tad-9 ta' Marzu ta' l-1968 dwar il-kordinazzjoni
    ta' salvagwardji li, għall-protezzjoni ta' l-interessi ta' membri u oħrajn,
    huma meħtieġa mill-Istati Membri minn kumpanniji fis-sens tat-tieni paragrafu
    ta' l-Artikolu 58 tat-Trattat, bil-għan li tagħmel dawn is-salvagwardji ekwivalenti
    f'kull parti tal-Komunità
  type: main
- language: nl
  script: Latn
  content: Eerste Richtlijn 68/151/EEG van de Raad van 9 maart 1968 strekkende tot
    het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van
    de vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag,
    om de belangen te beschermen zowel van de deelnemers in deze vennootschappen als
    van derden, zulks ten einde die waarborgen gelijkwaardig te maken
  type: main
- language: pl
  script: Latn
  content: Pierwsza dyrektywa Rady z dnia 9 marca 1968 r. w sprawie koordynacji gwarancji,
    jakie są wymagane w Państwach Członkowskich od spółek w rozumieniu art. 58
    akapit drugi Traktatu, w celu uzyskania ich równoważności w całej Wspólnocie,
    dla zapewnienia ochrony interesów zarówno wspólników jak i osób trzecich
  type: main
- language: pt
  script: Latn
  content: Primeira Directiva 68/151/CEE do Conselho, de 9 de Março de 1968, tendente
    a coordenar as garantias que, para protecção dos interesses dos sócios e de
    terceiros, são exigidas nos Estados-Membros às sociedades, na acepção do segundo
    parágrafo do artigo 58º do Tratado, a fim de tornar equivalentes essas garantias
    em toda a Comunidade
  type: main
- language: ro
  script: Latn
  content: Prima Directivă a Consiliului din 9 martie 1968 de coordonare, în vederea
    echivalării, a garanțiilor impuse societăților în statele membre, în înțelesul
    articolului 58 al doilea paragraf din tratat, pentru protejarea intereselor asociaților
    sau terților
  type: main
- language: sk
  script: Latn
  content: Prvá smernica Rady z 9. marca 1968 o koordinácii ochranných opatrení,
    ktoré členské štáty vyžadujú od obchodných spoločností na ochranu záujmov
    spoločníkov a tretích osôb v zmysle druhého odseku článku 58 zmluvy s cieľom
    zabezpečiť rovnocennosť týchto ochranných opatrení v rámci celého spoločenstva
  type: main
- language: sl
  script: Latn
  content: Prva direktiva Sveta z dne 9. marca 1968 o uskladitvi zaščitnih ukrepov
    za varovanje interesov družbenikov in tretjih oseb, ki jih države članice zahtevajo
    od gospodarskih družb v skladu z drugim odstavkom člena 58 Pogodbe, zato da
    se oblikujejo zaščitni ukrepi z enakim učinkom v vsej Skupnosti
  type: main
- language: es
  script: Latn
  content: Primera Directiva 68/151/CEE del Consejo, de 9 de marzo de 1968, tendente
    a coordinar, para hacerlas equivalentes, las garantías exigidas en los Estados
    Miembros a las sociedades definidas en el segundo párrafo del artículo 58 del
    Tratado, para proteger los intereses de socios y terceros
  type: main
- language: sv
  script: Latn
  content: Rådets första direktiv 68/151/EEG av den 9 mars 1968 om samordning av
    de skyddsåtgärder som krävs i medlemsstaterna av de i artikel 58 andra stycket
    i fördraget avsedda bolagen i bolagsmännens och tredje mans intressen, i syfte
    att göra skyddsåtgärderna likvärdiga inom gemenskapen
  type: main
