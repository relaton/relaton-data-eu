title:
- language: fr
  script: Latn
  content: '71/178/CEE: Décision de la Commission, du 7 avril 1971, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vêtements de dessous (linge de corps)
    pour hommes et garçonnets, y compris les cols, faux cols, plastrons et manchettes,
    de la position 61.03 du Tarif douanier commun, originaires de la Roumanie et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '71/178/EWG: Entscheidung der Kommission vom 7. April 1971, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterkleidung (Leibwäsche) für Männer und Knaben,
    auch Kragen, Vorhemden und Manschetten, der Tarifnummer 61.03 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/178/CEE: Decisione della Commissione, del 7 aprile 1971, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le sottovesti (biancheria da dosso) per
    uomo e per ragazzo, compresi i colli, colletti, sparati e polsini, della voce
    61.03 della tariffa doganale comune, originari della Romania e messi in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/178/EEG: Beschikking van de Commissie van 7 april 1971 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd herenonderkleding en jongensonderkleding, kragen, boorden, fronten
    en manchetten daaronder begrepen, van post 61.03 van het gemeenschappelijk douanetarief,
    van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
