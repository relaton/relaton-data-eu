  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1564 of 24 July 2025 on commercial
    rebalancing measures concerning certain products originating in the United States
    of America and certain products exported from the Union to the United States of
    America, and repealing Implementing Regulations (EU) 2018/724, (EU) 2018/886,
    (EU) 2020/502 and (EU) 2025/778
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1564 de la Commission du 24 juillet
    2025 concernant des mesures de rééquilibrage commercial visant certains produits
    originaires des États-Unis d’Amérique ainsi que certains produits exportés
    de l’Union vers les États-Unis d’Amérique, et abrogeant les règlements
    d’exécution (UE) 2018/724, (UE) 2018/886, (UE) 2020/502 et (UE) 2025/778
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1564 der Kommission vom 24. Juli 2025
    über handelspolitische Maßnahmen zur Wiederherstellung des Gleichgewichts in
    Bezug auf bestimmte Waren mit Ursprung in den Vereinigten Staaten von Amerika
    und bestimmte aus der Union in die Vereinigten Staaten von Amerika ausgeführte
    Waren sowie zur Aufhebung der Durchführungsverordnungen (EU) 2018/724, (EU) 2018/886,
    (EU) 2020/502 und (EU) 2025/778
