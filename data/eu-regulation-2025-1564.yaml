  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/1564 od 24. srpnja 2025. o trgovinskim
    mjerama za ponovnu uspostavu ravnoteže u pogledu određenih proizvoda podrijetlom
    iz Sjedinjenih Američkih Država i određenih proizvoda koji se izvoze iz Unije
    u Sjedinjene Američke Države te o stavljanju izvan snage provedbenih uredaba
    (EU) 2018/724, (EU) 2018/886, (EU) 2020/502 i (EU) 2025/778
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1564 végrehajtási rendelete (2025. július 24.)
    az Amerikai Egyesült Államokból származó egyes termékeket és az Unióból
    az Amerikai Egyesült Államokba exportált egyes termékeket érintő, a kereskedelmi
    egyensúly helyreállítását célzó intézkedésekről, valamint az (EU) 2018/724,
    az (EU) 2018/886, az (EU) 2020/502 és az (EU) 2025/778 végrehajtási rendelet
    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1564 della Commissione, del 24 luglio
    2025, relativo a misure di riequilibrio degli scambi riguardanti determinati prodotti
    originari degli Stati Uniti d'America e determinati prodotti esportati dall'Unione
    negli Stati Uniti d'America e che abroga i regolamenti di esecuzione (UE) 2018/724,
    (UE) 2018/886, (UE) 2020/502 e (UE) 2025/778
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1564 (2025. gada 24. jūlijs)
    par tirdzniecības līdzsvara atjaunošanas pasākumiem, kas attiecas uz konkrētiem
    Amerikas Savienoto Valstu izcelsmes ražojumiem un konkrētiem ražojumiem, kurus
    eksportē no Savienības uz Amerikas Savienotajām Valstīm, un ar ko atceļ Īstenošanas
    regulas (ES) 2018/724, (ES) 2018/886, (ES) 2020/502 un (ES) 2025/778
  type: main
- language: lt
  script: Latn
  content: 2025 m. liepos 24 d. Komisijos įgyvendinimo reglamentas (ES) 2025/1564
    dėl prekybos perbalansavimo priemonių, susijusių su tam tikrais Jungtinių
    Amerikos Valstijų kilmės produktais ir tam tikrais iš Sąjungos į Jungtines
    Amerikos Valstijas eksportuojamais produktais, kuriuo panaikinami įgyvendinimo
    reglamentai (ES) 2018/724, (ES) 2018/886, (ES) 2020/502 ir (ES) 2025/778
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/1564 tal-24
    ta' Lulju 2025 dwar miżuri ta’ riekwilibriju kummerċjali li jikkonċernaw
    ċerti prodotti li joriġinaw mill-Istati Uniti tal-Amerka u ċerti prodotti esportati
    mill-Unjoni lejn l-Istati Uniti tal-Amerka, u li jħassar ir-Regolamenti ta’
    Implimentazzjoni (UE) 2018/724, (UE) 2018/886, (UE) 2020/502 u (UE) 2025/778
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/1564 van de Commissie van 24 juli 2025
    betreffende evenwichtsherstellende handelsmaatregelen ten aanzien van bepaalde
    producten van oorsprong uit de Verenigde Staten van Amerika en bepaalde producten
    die uit de Unie naar de Verenigde Staten van Amerika worden uitgevoerd, en tot
    intrekking van de Uitvoeringsverordeningen (EU) 2018/724, (EU) 2018/886, (EU)
    2020/502 en (EU) 2025/778
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/1564 z dnia 24 lipca 2025
    r. w sprawie handlowych środków równoważących dotyczących niektórych produktów
    pochodzących ze Stanów Zjednoczonych Ameryki i niektórych produktów wywożonych
    z Unii do Stanów Zjednoczonych Ameryki oraz uchylające rozporządzenia wykonawcze
    (UE) 2018/724, (UE) 2018/886, (UE) 2020/502 i (UE) 2025/778
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1564 da Comissão, de 24 de julho de
    2025, relativo a medidas de reequilíbrio comercial respeitantes a determinados
    produtos originários dos Estados Unidos da América e a determinados produtos
    exportados da União para os Estados Unidos da América e que revoga os Regulamentos
    de Execução (UE) 2018/724, (UE) 2018/886, (UE) 2020/502 e (UE) 2025/778
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1564 al Comisiei din 24 iulie
    2025 privind măsurile de reechilibrare comercială referitoare la anumite produse
    originare din Statele Unite ale Americii și la anumite produse exportate din
    Uniune către Statele Unite ale Americii și de abrogare a Regulamentelor de punere
    în aplicare (UE) 2018/724, (UE) 2018/886, (UE) 2020/502 și (UE) 2025/778
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1564 z 24 júla 2025 o obchodných
    vyrovnávacích opatreniach týkajúcich sa určitých výrobkov s pôvodom v
    Spojených štátoch amerických a určitých výrobkov vyvážaných z Únie
    do Spojených štátov amerických a o zrušení vykonávacích nariadení (EÚ)
    2018/724, (EÚ), 2018/886, (EÚ) 2020/502 a (EÚ) 2025/778
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1564 z dne 24. julija 2025 o trgovinskih
    izravnalnih ukrepih v zvezi z nekaterimi izdelki s poreklom iz Združenih držav
    Amerike in nekaterimi izdelki, ki se iz Unije izvažajo v Združene države Amerike,
    ter razveljavitvi izvedbenih uredb (EU) 2018/724, (EU) 2018/886, (EU) 2020/502
    in (EU) 2025/778
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1564 de la Comisión, de 24 julio 2025,
    sobre medidas de reequilibrio comercial relativas a determinados productos originarios
    de los Estados Unidos de América y determinados productos exportados de la Unión
    a los Estados Unidos de América, y por el que se derogan los Reglamentos de Ejecución
    (UE) 2018/724, (UE) 2018/886, (UE) 2020/502 y (UE) 2025/778
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1564 av den 24 juli 2025
