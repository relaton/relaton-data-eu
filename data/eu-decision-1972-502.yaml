title:
- language: fr
  script: Latn
  content: Décision de la Commission du 22 décembre 1972 portant octroi du concours
    du Fonds social européen, prévu à l'article 125 du Traité, au bénéfice du
    Grand-Duché de Luxembourg, pour des dépenses relatives à une opération de
    rééducation professionnelle effectuée par l'Office de placement et de rééducation
    professionnelle des travailleurs handicapés
  type: main
- language: de
  script: Latn
  content: '72/502/EWG: Entscheidung der Kommission vom 22. Dezember 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an das
    Großherzogtum Luxemburg zu Aufwendungen für eine vom "Office de placement et
    de rééducation professionnelle des travailleurs handicapés" durchgeführte
    Berufsumschulungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/502/CEE: Decisione della Commissione, del 22 dicembre 1972, recante
    la concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore del Granducato del Lussemburgo per spese concernenti
    una operazione di riqualificazione professionale effettuata dall''Office de placement
    et de rééducation professionnelle des travailleurs handicapés'
  type: main
- language: nl
  script: Latn
  content: '72/502/EEG: Beschikking van de Commissie van 22 december 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van het Groothertogdom Luxemburg voor door het
    "Office de placement et de rééducation professionnelle des travailleurs handicapés"
    gemaakte herscholings- en verplaatsingskosten'
  type: main
