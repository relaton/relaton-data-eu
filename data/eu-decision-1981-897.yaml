title:
- language: en
  script: Latn
  content: '81/897/EEC: Commission Decision of 26 October 1981 amending for the second
    time Decision 76/653/EEC authorizing the Kingdom of Denmark and the French Republic
    to certify seed of certain species of cereals, under special conditions (Only
    the French and Danish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/897/CEE: Décision de la Commission, du 26 octobre 1981, portant deuxième
    modification de la décision 76/653/CEE autorisant le Royaume du Danemark et la
    République française à certifier les semences de certaines espèces de céréales
    dans des conditions particulières (Les textes en langues française et danoise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/897/EWG: Entscheidung der Kommission vom 26. Oktober 1981 zur zweiten
    Änderung der Entscheidung 76/653/EWG zur Ermächtigung des Königreichs Dänemark
    und der Französischen Republik, Saatgut einiger Getreidearten unter besonderen
    Bedingungen anzuerkennen (Nur der französische und dänische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/897/EØF: Kommissionens beslutning af 26. oktober 1981 om anden ændring
    af beslutning 76/653/EØF om bemyndigelse til kongeriget Danmark og Den franske
    Republik til at certificere sædekorn af visse kornarter på særlige betingelser
    (Kun den franske og danske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/897/EOK: Απόφαση τής Επιτροπής τής 26ης Οκτωβρίου
    1981 περί δευτέρας τροποποιήσεως τής αποφάσεως
    76/653/EOK περί παροχής αδείας στό Βασίλειο τής
    Δανίας καί στή Γαλλική Δημοκρατία νά πιστοποιούν
    τούς σπόρους πρός σπορά ορισμένων ειδών σιτηρών
    μέ ειδικές προϋποθέσεις (Τα κείμενα στην γαλλική
    και δανική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/897/CEE: Decisione della Commissione, del 26 ottobre 1981, recante
    seconda modifica della decisione 76/653/CEE che autorizza il Regno di Danimarca
    e la Repubblica francese a certificare le sementi di alcune specie di cereali
    in particolari condizioni (I testi in lingua francese e danese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/897/EEG: Beschikking van de Commissie van 26 oktober 1981 houdende
    tweede wijziging van Beschikking 76/653/EEG tot machtiging van het Koninkrijk
    Denemarken en de Franse Republiek om zaad van sommige graansoorten op bepaalde
    voorwaarden te certificeren (Slechts de teksten in de Franse en de Deense taal
    zijn authentiek)'
