  content: Commission Regulation (EEC) No 700/76 of 29 March 1976 authorizing the
    Kingdom of Denmark to suspend the component for protection of the processing industry
    for certain cereal-based compound animal feedingstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 700/76 de la Commission, du 29 mars 1976, autorisant
