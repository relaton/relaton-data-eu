  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 700/76 der Kommission vom 29. März 1976 zur Ermächtigung
    Dänemarks, den Bestandteil zum Schutz der Verarbeitungsindustrie für bestimmte
    Getreidefuttermittel aufzuheben
  type: main
- language: da
  script: Latn
