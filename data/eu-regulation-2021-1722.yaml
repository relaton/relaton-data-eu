    (ЕС) 2015/2366 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти,
    с които се определя рамката за сътрудничество
    и за обмен на информация между компетентните
    органи на държавата членка по произход и на
    приемащата държава членка с оглед на надзора
    над платежните институции и институциите за
    електронни пари, които трансгранично предоставят
    платежни услуги
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1722 ze dne 18. června
    2021, kterým se doplňuje směrnice Evropského parlamentu a Rady (EU) 2015/2366,
    pokud jde o regulační technické normy definující rámec pro spolupráci a
    výměnu informací mezi příslušnými orgány domovského a hostitelského
    členského státu v souvislosti s dohledem nad platebními institucemi a institucemi
    elektronických peněz poskytujícími přeshraniční platební služby
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1722 af 18. juni 2021 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv (EU) 2015/2366
    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer rammerne
    for samarbejde og for udvekslingen af oplysninger mellem de kompetente myndigheder
    i hjemlandet og i værtslandet i forbindelse med tilsyn med betalingsinstitutter
    og e-pengeinstitutter, der udbyder betalingstjenester på tværs af grænserne
  type: main
