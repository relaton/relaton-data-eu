    per quanto riguarda le norme tecniche di regolamentazione che specificano il quadro
    per la cooperazione e per lo scambio di informazioni tra le autorità competenti
    dello Stato membro di origine e quelle dello Stato membro ospitante nel contesto
    della vigilanza sugli istituti di pagamento e sugli istituti di moneta elettronica
    che prestano servizi di pagamento su base transfrontaliera
  type: main
