    o regulačné technické predpisy, ktorými sa stanovuje rámec pre spoluprácu
    a výmenu informácií medzi príslušnými orgánmi domovského a hostiteľského
    členského štátu v kontexte dohľadu nad platobnými inštitúciami a inštitúciami
