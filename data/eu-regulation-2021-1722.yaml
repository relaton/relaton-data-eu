title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1722 of 18 June 2021 supplementing
    Directive (EU) 2015/2366 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the framework for cooperation and
    the exchange of information between competent authorities of the home and the
    host Member States in the context of supervision of payment institutions and electronic
    money institutions exercising cross-border provision of payment services
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1722 de la Commission du 18 juin 2021 complétant
    la directive (UE) 2015/2366 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant le cadre de la coopération et de l’échange
    d’informations entre les autorités compétentes des États membres d’origine
    et d’accueil dans le contexte de la surveillance des établissements de paiement
    et des établissements de monnaie électronique qui fournissent des services de
    paiement sur une base transfrontalière
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1722 der Kommission vom 18. Juni 2021 zur
    Ergänzung der Richtlinie (EU) 2015/2366 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Rahmenbedingungen
    für die Zusammenarbeit und den Informationsaustausch zwischen den zuständigen
    Behörden des Herkunfts- und des Aufnahmemitgliedstaats im Zusammenhang mit der
    Beaufsichtigung von Zahlungsinstituten und E-Geld-Instituten, die grenzüberschreitend
    Zahlungsdienste erbringen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1722 на Комисията
