title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 743/78 of 12 April 1978 re-establishing
    the levying of the customs duties on melamine, falling within subheading No 29.35
    ex Q, originating in Mexico, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 743/78 de la Commission, du 12 avril 1978, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position tarifaire 29.35 EX Q, originaire du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 743/78 der Kommission vom 12. April 1978 zur Wiedereinführung
    des Zollsatzes für Melamin der Tarifstelle 29.35 ex Q mit Ursprung in Mexiko,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 743/78 af 12. april 1978 om genindførelse
    af opkrævning af toldafgifter for melamin, under position 29.35 ex Q, som har
    oprindelse i Mexico og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 743/78 della Commissione, del 12 aprile 1978, che
    ripristina la riscossione dei dazi doganali applicabili alla melamina della sottovoce
    29.35 ex Q della tariffa doganale comune, originaria del Messico, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 743/78 van de Commissie van 12 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op melamine,
    van post 29.35 ex Q, van oorsprong uit Mexico, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
