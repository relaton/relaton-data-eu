    de lait écrémé en poudre vitaminé acheté sur le marché de la Communauté
    et destiné à la République arabe d'Égypte
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3015/76 der Kommission vom 13. Dezember 1976 über
