  content: Council Regulation (EEC) No 396/79 of 28 February 1979 laying down for
    the period 1 January to 31 March 1979 certain interim measures for the conservation
    and management of fishery resources applicable to vessels flying the flag of Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 396/79 du Conseil, du 28 février 1979, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de la Suède pour la période allant du 1er janvier
    au 31 mars 1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 396/79 des Rates vom 28. Februar 1979 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für
    Schiffe unter schwedischer Flagge für die Zeit vom 1. Januar bis 31. März 1979
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 396/79 af 28. februar 1979 om fastsættelse
