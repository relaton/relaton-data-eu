  content: Commission Regulation (EC) No 1710/95 of 13 July 1995 on temporary adjustment
    of the special arrangements on importation of bran, sharps and other residues
    of the sifting, milling or other working of certain cereals, originating in Tunisia,
    Algeria, Morocco or Egypt, in preparation for implementation of the Agreement
    on Agriculture concluded in the Uruguay Round of multilateral trade negotiations,
    and derogating from Council Regulations (EEC) No 1513/76, (EEC) No 1519/76, (EEC)
    No 1526/76 and (EEC) No 1251/77
  type: main
- language: fr
  script: Latn
