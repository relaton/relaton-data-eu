    remoulages et autres résidus du criblage, de la mouture ou autres traitements
    des grains de certaines céréales, originaires de Tunisie, d'Algérie, du Maroc
    et d'Égypte en vue de la mise en oeuvre de l'accord sur l'agriculture conclu
    dans le cadre des négociations commerciales multilatérales du cycle d'Uruguay
