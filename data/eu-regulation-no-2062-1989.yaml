title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2062/89 of 10 July 1989 re-establishing
    the levying of customs duties on men's shirts, other than knitted or crocheted,
    products of category No 8 (order No 40.0080), originating in India, and women's
    knitted or crocheted suits and ensembles, products of category No 74 (order No
    40.0740), originating in the Philippines to which the preferential tariff arrangements
    of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2062/89 de la Commission du 10 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux chemises
    autres qu'en bonneterie, pour hommes, de la catégorie 8 (numéro d'ordre 40.0080)
    originaires de l'Inde, et aux costumes- tailleurs en bonneterie, pour femmes,
    de la catégorie 74 (numéro d'ordre 40.0740), originaires des Philippines, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2062/89 DER KOMMISSION vom 10. Juli 1989 zur Wiedereinführung
    des Zollsatzes für Oberhemden, andere als aus Gewirken, für Männer, der Warenkategorie
    Nr. 8 (lfd. Nr. 40.0080) mit Ursprung in Indien und Kostüme und Kombinationen,
    aus Gewirken, für Frauen, der Warenkategorie Nr. 74 (lfd. Nr. 40.0740) mit Ursprung
    auf den Philippinen, denen die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2062/89 af 10. juli 1989 om genindførelse
    af opkrævning af toldafgifter for skjorter, ikke af trikotage, til mænd, under
    varekategori 8 (løbenummer 40.0080), som har oprindelse i Indien, samt dragter,
    kostumer og sæt, af trikotage, til kvinder, under varekategori 74 (løbenummer
    40.0740), som har oprindelse i Filippinerne og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
