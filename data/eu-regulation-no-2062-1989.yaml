    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2062/89 DELLA COMMISSIONE del 10 luglio 1989 che
    ripristina la riscossione dei dazi doganali applicabili alle camicie, escluse
    quelle a maglia, per uomo, della categoria di prodotti n. 8 (numero d'' ordine
    40.0080), originarie dell'' India, e agli abiti a giacca e completi a maglia,
    per donna, della categoria di prodotti n. 74 (numero d'' ordine 40.0740), originari
    delle Filippine beneficiarie delle preferenze tariffarie previste dal regolamento
    (CEE) n. 4259/88 del Consiglio #'
  type: main
