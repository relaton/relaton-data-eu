title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2772/80 of 29 October 1980 specifying the
    extent to which applications lodged during the month of October 1980 for import
    licences in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2772/80 de la Commission, du 29 octobre 1980, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d' importation déposées au mois d' octobre 1980, pour les jeunes bovins mâles
    destinés à l' engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2772/80 der Kommission vom 29. Oktober 1980 über
    das Ausmaß, in dem den im Oktober 1980 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2772/80 af 29. oktober 1980 om det
    omfang, i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet
    i oktober 1980 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2772/80 della Commissione, del 29 ottobre 1980, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'
    importazione presentate nel mese di ottobre 1980 per i giovani bovini maschi destinati
    all' ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2772/80 van de Commissie van 29 oktober 1980 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in oktober 1980 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
