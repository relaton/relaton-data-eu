title:
- language: en
  script: Latn
  content: Commission Directive 98/42/EC of 19 June 1998 amending Council Directive
    95/21/EC concerning the enforcement, in respect of shipping using Community ports
    and sailing in the waters under the jurisdiction of the Member States, of international
    standards for ship safety, pollution prevention and shipboard living and working
    conditions (port State control)
  type: main
- language: fr
  script: Latn
  content: Directive 98/42/CE de la Commission du 19 juin 1998 modifiant la directive
    95/21/CE du Conseil concernant l'application aux navires faisant escale dans les
    ports de la Communauté ou dans les eaux relevant de la juridiction des États
    membres, des normes internationales relatives à la sécurité maritime, à la
    prévention de la pollution et aux conditions de vie et de travail à bord des
    navires (contrôle par l'État du port)
  type: main
- language: de
  script: Latn
  content: Richtlinie 98/42/EG der Kommission vom 19. Juni 1998 zur Änderung der
    Richtlinie 95/21/EG des Rates zur Durchsetzung internationaler Normen für die
    Schiffssicherheit, die Verhütung von Verschmutzung und die Lebens- und Arbeitsbedingungen
    an Bord von Schiffen, die Gemeinschaftshäfen anlaufen und in Hoheitsgewässern
    der Mitgliedstaaten fahren (Hafenstaatkontrolle)
  type: main
- language: bg
  script: Cyrl
  content: Директива 98/42/ЕО на Комисията от 19 юни 1998
    година за изменение на Директива 95/21/ЕО на Съвета
    относно прилагането по отношение на кораби,
    които използват пристанища на Общността или
    плават във водите под юрисдикцията на държавите-членки,
    на международните стандарти за безопасност
    на корабоплаването, предотвратяване на замърсяване
    и за условията на живот и работа на борда на
    корабите (държавен пристанищен контрол)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 98/42/ES ze dne 19. června 1998, kterou se mění směrnice
    Rady 95/21/ES o uplatňování mezinárodních norem pro bezpečnost lodí, zabránění
    znečištění a životní a pracovní podmínky na lodích, které využívají
    přístavy Společenství a plují ve výsostných vodách členských států
    (státní přístavní inspekce)
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 98/42/EF af 19. juni 1998 om ændring af Rådets
    direktiv 95/21/EF om håndhævelse over for skibe, der anløber Fællesskabets
    havne og sejler i farvande under medlemsstaternes jurisdiktion, af internationale
    standarder for skibes sikkerhed, for forureningsforebyggelse samt for leve- og
    arbejdsvilkår om bord (havnestatskontrol)
  type: main
- language: el
  script: Grek
  content: Οδηγία 98/42/ΕΚ της Επιτροπής της 19ης Ιουνίου
    1998 για την τροποποίηση της οδηγίας 95/21/ΕΚ του
    Συμβουλίου για την επιβολή, σχετικά με την
    ναυσιπλοΐα που συνεπάγεται χρήση κοινοτικών
    λιμένων ή διέλευση από ύδατα υπό τη δικαιοδοσία
    κράτους μέλους, των διεθνών προτύπων για την
    ασφάλεια των πλοίων, την πρόληψη της ρύπανσης
