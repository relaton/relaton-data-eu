    kansainvälisten standardien soveltamisesta yhteisön satamia käyttäviin ja
    jäsenmaiden lainkäyttövaltaan kuuluvilla vesillä purjehtiviin aluksiin (satamavaltioiden
    suorittama valvonta) annetun neuvoston direktiivin 95/21/EY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 98/42/EK irányelve (1998. június 19.) a Közösség kikötőiben
    és a tagállamok felségvizein történő hajózás tekintetében a hajózás
    biztonságára, a környezetszennyezés megelőzésére és a fedélzeti élet-
    és munkakörülményekre vonatkozó nemzetközi előírások végrehajtásáról
    (kikötő szerinti illetékes állam hatósága által végzett ellenőrzés)
    szóló 95/21/EK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 98/42/CE della Commissione del 19 giugno 1998 che modifica la
    direttiva 95/21/CE del Consiglio relativa all'attuazione di norme internazionali
    per la sicurezza delle navi, la prevenzione dell'inquinamento e le condizioni
    di vita e di lavoro a bordo per le navi che approdano nei porti comunitari e che
    navigano nelle acque sotto la giurisdizione degli Stati membri (controllo dello
    Stato di approdo)
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 98/42/EK (1998. gada 19. jūnijs), ar kuru groza Padomes
    Direktīvu 95/21/EK, kas nosaka, kā kuģošanai Kopienas ostās un dalībvalstu
    jurisdikcijai pakļautos ūdeņos piemērot starptautiskos standartus attiecībā
    uz kuģu drošību, piesārņojuma novēršanu un dzīves un darba apstākļiem
    uz kuģiem (ostas valsts kontrole)
  type: main
- language: lt
  script: Latn
  content: 1998 m. birželio 19 d. Komisijos direktyva 98/42/EB iš dalies pakeičianti
    Direktyvą 95/21/EB dėl laivo saugumo, taršos prevencijos ir darbo bei gyvenimo
    sąlygų laivuose tarptautinių standartų taikymo laivams, atplaukiantiems į
    Bendrijos uostus ir plaukiojantiems valstybių narių jurisdikcijai priklausančiuose
    vandenyse (uosto valstybės kontrolė)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 98/42/KE tad-19 ta' Ġunju 1998 li temenda
    d-Direttiva tal-Kunsill 95/21/KE li tikkonċerna l-infurzar, fir-rigward ta' vapuri
    li jużaw il-portijiet tal-Komunità u li jbaħħru fl-ibħra taħt il-ġurisdizzjoni
    ta' l-Istati Membri, ta' standards internazzjonali għas-sigurtà tal-vapuri,
    għall-prevenzjoni ta' tniġġis u għall-kondizzjonijiet ta' l-għajxien u tax-xogħol
    abbord (kontroll portwali ta' l-Istat)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 98/42/EG van de Commissie van 19 juni 1998 houdende wijziging
    van Richtlijn 95/21/EG van de Raad betreffende de naleving, met betrekking tot
    de schepen die gebruik maken van havens in de Gemeenschap en varen in de onder
    de jurisdictie van de lidstaten vallende wateren, van internationale normen op
    het gebied van de veiligheid van schepen, voorkoming van verontreiniging en leef-
    en werkomstandigheden aan boord (havenstaatcontrole)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 98/42/WE z dnia 19 czerwca 1998 r. zmieniająca dyrektywę
    Rady 95/21/WE dotyczącą przestrzegania, w odniesieniu do żeglugi morskiej korzystającej
    ze wspólnotowych portów oraz żeglugi morskiej po wodach znajdujących się
    pod jurysdykcją Państw Członkowskich, międzynarodowych norm bezpieczeństwa
    statków i zapobiegania zanieczyszczeniom oraz pokładowych warunków życia i
    pracy (kontrola państwa portu)
  type: main
- language: pt
  script: Latn
  content: Directiva 98/42/CE da Comissão de 19 de Junho de 1998 que altera a Directiva
    95/21/CE do Conselho relativa à aplicação, aos navios que escalem os portos
    da Comunidade ou naveguem em águas sob jurisdição dos Estados-membros, das
    normas internacionais respeitantes à segurança da navegação, à prevenção
    da poluição e às condições de vida e de trabalho a bordo dos navios (inspecção
    pelo Estado do porto)
  type: main
- language: ro
  script: Latn
  content: Directiva 98/42/CE a Comisiei din 19 iunie 1998 de modificare a Directivei
    95/21/CE a Consiliului privind aplicarea, în cazul navelor care fac escală în
    porturile Comunității sau care navighează pe apele aflate sub jurisdicția
    statelor membre, a standardelor internaționale referitoare la siguranța pe mare,
    prevenirea poluării și la condițiile de viață și de muncă la bordul navelor
    (controlul statului de port)
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 98/42/ES z 19. júna 1998, ktorou sa mení a dopĺňa
    smernica 95/21/ES týkajúca sa presadzovania medzinárodných štandardov pre
    bezpečnosť lodí, ochranu proti znečisteniu a životné a pracovné podmienky
    na lodiach (prístavná štátna kontrola) vzhľadom k lodnej preprave, ktorá
    využíva prístavy spoločenstva a plaví sa vo vodách pod jurisdikciou členských
    štátov
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 98/42/ES z dne 19. junija 1998 o spremembi Direktive Sveta
    95/21/ES o uveljavitvi mednarodnih standardov za varnost ladij, preprečevanje
    onesnaževanja ter pogoje za življenje in delo na ladjah, ki uporabljajo pristanišča
    Skupnosti in plujejo v vodah v pristojnosti držav članic (pomorska inšpekcija)
  type: main
- language: es
  script: Latn
  content: Directiva 98/42/CE de la Comisión de 19 de junio de 1998 por la que se
    modifica la Directiva 95/21/CE del Consejo sobre el cumplimiento de las normas
    internacionales de seguridad marítima, prevención de la contaminación y condiciones
    de vida y de trabajo a bordo, por parte de los buques que utilicen los puertos
    comunitarios o las instalaciones situadas en aguas bajo jurisdicción de los Estados
    miembros (control del Estado del puerto)
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 98/42/EG av den 19 juni 1998 om ändring av rådets
    direktiv 95/21/EG om tillämpning av internationella normer för säkerhet på
    fartyg, förhindrande av förorening samt boende- och arbetsförhållande ombord
    på fartyg som anlöper gemenskapens hamnar och framförs i medlemsstaternas territorialvatten
