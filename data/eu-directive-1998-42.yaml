    των πλοίων (έλεγχος από το κράτος ελλιμενισμού)
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 98/42/EÜ, 19. juuni 1998, millega muudetakse nõukogu
    direktiivi 95/21/EÜ laevaohutust, reostuse vältimist ning elu- ja töötingimusi
    laevadel käsitlevate rahvusvaheliste standardite rakendamise kohta ühenduse
    sadamaid kasutavate ja liikmesriikide jurisdiktsiooni all olevates vetes sõitvate
    laevade suhtes (sadamariigi kontroll)
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 98/42/EY, annettu 19 päivänä kesäkuuta 1998, alusturvallisuutta,
