title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2985/89 of 2 October 1989 introducing retrospective
    Community surveillance of imports of certain textile products originating in Tunisia
    or Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2985/89 de la Commission du 2 octobre 1989 instaurant
    une surveillance communautaire a posteriori des importations de certains produits
    textiles originaires de Tunisie et du Maroc
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2985/89 DER KOMMISSION vom 2. Oktober 1989 zur Einführung
    einer nachträglichen gemeinschaftlichen Überwachung der Einfuhren bestimmter
    Textilwaren mit Ursprung in Tunesien und Marokko #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2985/89 af 2. oktober 1989 om indførelse
    af et efterfølgende fællesskabstilsyn med indførslen af visse tekstilvarer
    med oprindelse i Tunesien og Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2985/89 της Επιτροπής
    της 2ας Οκτωβρίου 1989 περί θεσπίσεως κοινοτικής
    επιβλέψεως εκ των υστέρων των εισαγωγών ορισμένων
    κλωστοϋφαντουργικών προϊόντων καταγωγής Τυνησίας
    και Μαρόκου
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2985/89 DELLA COMMISSIONE del 2 ottobre 1989 che
    istituisce una sorveglianza comunitaria a posteriori sulle importazioni di taluni
    prodotti tessili originari della Tunisia e del Marocco #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2985/89 VAN DE COMMISSIE van 2 oktober 1989 houdende
    instelling van communautair toezicht a posteriori op de invoer van bepaalde textielprodukten
    van oorsprong uit Tunesië en Marokko #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2985/89 DA COMISSAO de 2 de Outubro de 1989 que instaura
    uma vigilância comunitaria a posteriori das importaçoes de certos produtos têxteis
    originarios da Tunisia e de Marrocos
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2985/89 DE LA COMISIÓN de 2 de octubre de 1989 una
    vigilancia comunitaria a posteriori de las importaciones de determinados productos
    textiles originarios de Túnez y Marruecos #'
