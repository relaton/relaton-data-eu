title:
- language: fr
  script: Latn
  content: Décision 67/463/CEE de la Commission, du 29 juin 1967, autorisant la République
    fédérale d'Allemagne, en vertu de l'article 115 alinéa I du Traité, à exclure
    du traitement communautaire les "fils de fibres textiles synthétiques et artificielles",
    de la position n° 51.01 du Tarif douanier commun, originaires de Tchécoslovaquie
    et mis en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '67/463/EWG: Entscheidung der Kommission vom 29. Juni 1967 zur Ermächtigung
    der Bundesrepublik Deutschland nach Artikel 115 Absatz (1) des Vertrages, Kunstseidengarne
    der Tarifnummer 51.01 des Gemeinsamen Zolltarifs mit Ursprung in der Tschechoslowakei,
    die sich in den anderen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/463/CEE: Decisione della Commissione, del 29 giugno 1967, che autorizza
    la Repubblica federale di Germania ai sensi dell''articolo 115, primo comma, del
    Trattato, ad escludere dal trattamento comunitario i filati di fibre tessili sintetiche
    ed artificiali della voce n. 51.01 della tariffa doganale comune, originari della
    Cecoslovacchia ed immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/463/EEG: Beschikking van de Commissie van 29 juni 1967 houdende machtiging
    van de Bondsrepubliek Duitsland om, op grond van artikel 115, eerste alinea, van
    het Verdrag, garens van synthetische of van kunstmatige vezels, van post 51.01
    van het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije en
    in andere Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
