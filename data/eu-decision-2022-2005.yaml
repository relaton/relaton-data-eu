---
id: EUDecision20222005
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2005 of 21 October 2022 not
    approving methylene dithiocyanate as an existing active substance for use in biocidal
    products of product-type 12 in accordance with Regulation (EU) No 528/2012 of
    the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2005 de la Commission du 21 octobre
    2022 refusant l’approbation du dithiocyanate de méthylène en tant que substance
    active destinée à être utilisée dans des produits biocides relevant du type
    de produits 12 conformément au règlement (UE) no 528/2012 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2005 der Kommission vom 21. Oktober 2022
    zur Nichtgenehmigung von Methylendithiocyanat als alten Wirkstoff zur Verwendung
    in Biozidprodukten der Produktart 12 gemäß der Verordnung (EU) Nr. 528/2012
    des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2022/2005 на Комисията
    от 21 октомври 2022 година за нeодобряване на метиленов
    дитиоцианат като съществуващо активно вещество
    за употреба в биоциди от продуктов тип 12 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/2005 ze dne 21. října 2022,
    kterým se neschvaluje methylen-dithiokyanát jako stávající účinná látka
    pro použití v biocidních přípravcích typu 12 v souladu s nařízením Evropského
    parlamentu a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2005 af 21. oktober 2022
    om ikke at godkende methylendithiocyanat som et eksisterende aktivstof til anvendelse
    i biocidholdige produkter af produkttype 12, jf. Europa-Parlamentets og Rådets
    forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/2005 της Επιτροπής
    της 21ης Οκτωβρίου 2022 σχετικά με τη μη έγκριση
    του διθειοκυανικού μεθυλενίου ως υπάρχουσας
    δραστικής ουσίας για χρήση σε βιοκτόνα του
    τύπου προϊόντων 12 σύμφωνα με τον κανονισμό
    (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/2005, 21. oktoober 2022, millega jäetakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) nr 528/2012 heaks kiitmata
    toimeaine metüleenditiotsüanaadi kasutamine tooteliiki 12 kuuluvates biotsiidides
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/2005, annettu 21 päivänä
    lokakuuta 2022, metyleeniditiosyanaatin hyväksymättä jättämisestä valmisteryhmään
    12 kuuluvissa biosidivalmisteissa käytettävänä vanhana tehoaineena Euroopan
    parlamentin ja neuvoston asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2005 ón gCoimisiún an 21 Deireadh
    Fómhair 2022 gan déthiaicianáit mheitiléine a fhormheas mar shubstaint ghníomhach
    atá ann cheana lena húsáid i dtáirgí bithicídeacha de chineál táirge 12
    i gcomhréir le Rialachán (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón
    gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/2005 оd 21. listopada 2022. o neodobravanju
    aktivne tvari metilen ditiocijanata kao postojeće aktivne tvari za uporabu u
    biocidnim proizvodima vrste 12 u skladu s Uredbom (EU) br. 528/2012 Europskog
    parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2005 végrehajtási határozata (2022. október
    21.) a metilén-ditiocianát 12. terméktípusba tartozó biocid termékekben
    az 528/2012/EU európai parlamenti és tanácsi rendelet szerint felhasználható
    létező hatóanyagként történő jóváhagyásának megtagadásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2005 della Commissione del 21 ottobre
    2022 che non approva il ditiocianato di metilene come principio attivo esistente
    ai fini del suo uso nei biocidi del tipo di prodotto 12 a norma del regolamento
    (UE) n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/2005 (2022. gada 21. oktobris),
    ar ko metilēna ditiocianātu neapstiprina par 12. produkta veida biocīdos lietojamu
    esošu aktīvo vielu saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr.
    528/2012
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2005 2022 m. spalio 21 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 528/2012 metileno
    ditiocianatas nepatvirtinamas kaip esama veiklioji medžiaga, skirta 12-o tipo
    biocidiniams produktams gaminti
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2005 tal-21
    ta’ Ottubru 2022 li ma tapprovax id-ditijoċjanat tal-metilen bħala sustanza
    attiva eżistenti għall-użu fil-prodotti bijoċidali għall-prodotti tat-tip
    12 f’konformità mar-Regolament (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2005 van de Commissie van 21 oktober 2022
    tot niet-goedkeuring van methyleendithiocyanaat als een bestaande werkzame stof
    voor gebruik in biociden van productsoort 12 overeenkomstig Verordening (EU) nr.
    528/2012 van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2005 z dnia 21 października 2022
    r. niezatwierdzająca ditiocyjanianu metylenu jako istniejącej substancji czynnej
    do stosowania w produktach biobójczych należących do grupy produktowej 12 zgodnie
    z rozporządzeniem Parlamentu Europejskiego i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2005 da Comissão de 21 de outubro de
    2022 relativa à não aprovação do ditiocianato de metileno como substância
    ativa existente para utilização em produtos biocidas do tipo 12, em conformidade
    com o Regulamento (UE) n.o 528/2012 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2005 a Comisiei din 21 octombrie
    2022 de neaprobare a ditiocianatului de metilen ca substanță activă existentă
    destinată utilizării în produsele biocide din tipul de produs 12 în conformitate
    cu Regulamentul (UE) nr. 528/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/2005 z 21. októbra 2022, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (EÚ) č. 528/2012 neschvaľuje
    metylénditiokyanát ako existujúca účinná látka na používanie v biocídnych
    výrobkoch typu 12
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/2005 z dne 21. oktobra 2022 o neodobritvi
    metilen ditiocianata kot obstoječe aktivne snovi za uporabo v biocidnih proizvodih
    vrste proizvodov 12 v skladu z Uredbo (EU) št. 528/2012 Evropskega parlamenta
    in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/2005 de la Comisión de 21 de octubre
    de 2022 por la que no se aprueba el uso del ditiocianato de metileno como sustancia
    activa existente en biocidas del tipo de producto 12 de conformidad con el Reglamento
    (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/2005 av den 21 oktober 2022
    om att inte godkänna metylenditiocyanat som existerande verksamt ämne för användning
    i biocidprodukter i produkttyperna 12 i enlighet med Europaparlamentets och rådets
    förordning (EU) nr 528/2012
  type: main
