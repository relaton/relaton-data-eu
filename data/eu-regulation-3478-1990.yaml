    τελωνειακών δασμών για προϊόντα του κωδικού
    ΣΟ 2817 00 00, καταγωγής Κίνας, δικαιούχου των προβλεπομένων
    στην κανονισμό (ΕΟΚ) αριθ. 3896/89 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3478/90 DELLA COMMISSIONE del 30 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 2817 00 00 originari della Cina, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3478/90 VAN DE COMMISSIE van 30 november 1990 houdende
