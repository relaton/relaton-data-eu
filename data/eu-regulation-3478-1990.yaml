title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3478/90 of 30 November 1990 re-establishing
    the levying of the customs duties applicable to the products of CN code 2817 00
    00 originating in China, to which the preferential tariff arrangements of Council
    Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3478/90 de la Commission du 30 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2817 00 00, originaires de la Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3478/90 DER KOMMISSION vom 30. November 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer die Waren des KN-Codes 2817 00 00 mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3478/90 af 30. november 1990 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2817 00 00 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3478/90 της Επιτροπής
