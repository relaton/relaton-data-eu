title:
- language: en
  script: Latn
  content: '96/723/EC: Council Decision of 12 December 1996 granting a Community guarantee
    to the European Investment Bank against losses under loans for projects of mutual
    interest in Latin American and Asian countries with which the Community has concluded
    cooperation agreements (Argentina, Bolivia, Brazil, Chile, Colombia, Costa Rica,
    Ecuador, Guatemala, Honduras, Mexico, Nicaragua, Panama, Paraguay, Peru, El Salvador,
    Uruguay and Venezuela; Bangladesh, Brunei, China, India, Indonesia, Macao, Malaysia,
    Pakistan, Philippines, Singapore, Sri Lanka, Thailand and Vietnam)'
  type: main
- language: fr
  script: Latn
  content: '96/723/CE: Décision du Conseil du 12 décembre 1996 accordant une garantie
    de la Communauté à la Banque européenne d''investissement en cas de pertes
    résultant de prêts en faveur de projets d''intérêt commun dans les pays d''Amérique
    latine et d''Asie avec lesquels la Communauté a conclu des accords de coopération
    (Argentine, Bolivie, Brésil, Chili, Colombie, Costa Rica, Équateur, Guatemala,
    Honduras, Mexique, Nicaragua, Panamá, Paraguay, Pérou, El Salvador, Uruguay
    et Venezuela; Bangladesh, Brunei, Chine, Inde, Indonésie, Macao, Malaysia, Pakistan,
    Philippines, Singapour, Sri Lanka, Thaïlande et Viêt-nam)'
