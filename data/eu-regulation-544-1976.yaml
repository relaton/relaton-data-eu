title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 544/76 of 11 March 1976 re-establishing
    the levying of customs duties on glass inners for vacuum flasks or for other vacuum
    vessels falling within heading No 70.12, originating in Yugoslavia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3010/75
    of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 544/76 de la Commission, du 11 mars 1976, portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants, de la position tarifaire 70.12, originaires
    de la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 544/76 der Kommission vom 11. März 1976 zur Wiedereinführung
    des Zollsatzes für Glaskolben für Isolierbehälter der Tarifnummer 70.12, mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 544/76 af 11. marts 1976 om genindførelse
    af opkrævning af toldafgifter for glaskolber til termoflasker og lignende isotermiske
    beholdere under position 70.12 som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3010/75 af
    17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 544/76 della Commissione, dell'11 marzo 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle ampolle di vetro
    per recipienti isolanti della voce doganale 70.12 originarie della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75
    del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 544/76 van de Commissie van 11 maart 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op binnenflessen
    voor thermisch isolerende flessen, van post 70.12, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 december
    1975 algemene tariefpreferenties werden geopend
  type: main
