    määrätyn järjestelmän mukaisesti tammikuussa 1997 jätettyjen tiettyjä juustoja
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 77/97 DELLA COMMISSIONE del 17 gennaio 1997 che stabilisce
