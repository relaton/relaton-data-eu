    presentate nel mese di gennaio 1997 per taluni formaggi nel quadro del regime
    previsto dagli accordi europei conclusi tra la Comunità e la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 77/97 VAN DE COMMISSIE van 17 januari 1997 tot vaststelling
