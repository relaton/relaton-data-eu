- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 77/97 of 17 January 1997 determining the
    extent to which applications lodged in January 1997 for import certificates for
    certain cheeses covered by the arrangements provided for in the Europe Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 77/97 DE LA COMMISSION du 17 janvier 1997 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 1997 pour certains fromages dans le cadre du régime prévu par les
    accords européens conclus par la Communauté avec la Bulgarie et la Roumanie
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 77/97 DER KOMMISSION vom 17. Januar 1997 zur Festsetzung
    des Umfangs, in dem die Lizenzanträge genehmigt werden können, die im Januar
    1997 für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Europa-Abkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 77/97 af 17. januar 1997 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i januar 1997 for
    visse oste kan imødekommes under den ordning, der er fastsat i Europaaftalerne
    mellem Fællesskabet og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 77/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ της
    17ης Ιανουαρίου 1997 για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υποβάλλονται
    τον Ιανουάριο 1997 για ορισμένα τυριά στα πλαίσια
    του καθεστώτος που προβλέπεται από τις ευρωπαϊκές
    συμφωνίες που έχουν συναφθεί από την Κοινότητα
    με τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 77/97, annettu 17 päivänä tammikuuta 1997,
