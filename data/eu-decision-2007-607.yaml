  script: Latn
  content: '2007/607/EC: Commission Decision of 10 September 2007 authorising Slovenia
    to extend by two wine years the possibility of derogating from the minimum natural
    alcoholic strength by volume set for zone C II for wines from the Primorska wine
    area including Teran PTP Kras quality wines psr (notified under document number
    C(2007) 4085)'
  type: main
- language: fr
  script: Latn
  content: '2007/607/CE: Décision de la Commission du 10 septembre 2007 autorisant
    la Slovénie à prolonger de deux campagnes viticoles la possibilité de déroger
    au titre alcoométrique volumique naturel minimal fixé pour la zone C II, pour
    les vins de la région de Primorska incluant les vins de qualité produits dans
    des régions déterminées Teran PTP Kras [notifiée sous le numéro C(2007) 4085]'
  type: main
- language: de
  script: Latn
