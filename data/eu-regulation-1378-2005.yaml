title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1378/2005 of 22 August 2005 amending for
    the 52nd time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1378/2005 de la Commission du 22 août 2005 modifiant
    pour la cinquante-deuxième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l’encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
