title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 995/2003 of 11 June 2003 derogating from
    Regulation (EC) No 43/2003 and amending it as regards the period for the submission
    of applications for aid for the ageing of Madeira liqueur wine and Azores wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 995/2003 de la Commission du 11 juin 2003 portant dérogation
    au règlement (CE) n° 43/2003 et modifiant ledit règlement en ce qui concerne
    la période de présentation des demandes d'aide au vieillissement du vin de liqueur
    à Madère et du vin aux Açores
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 995/2003 der Kommission vom 11. Juni 2003 zur Abweichung
    von der Verordnung (EG) Nr. 43/2003 und Änderung derselben hinsichtlich der Einreichungsfrist
    für die Anträge auf Beihilfe zur Reifung von Likörwein aus Madeira und Wein
    von den Azoren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 995/2003 ze dne 11. června 2003, kterým se
    stanoví odchylka od nařízení (ES) č. 43/2003 a kterým se mění uvedené
    nařízení, pokud jde o dobu pro předložení žádostí o podporu pro zrání
    madeirského likérového vína a azorského vína
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 995/2003 af 11. juni 2003 om fravigelse
    af forordning (EF) nr. 43/2003 og om ændring af nævnte forordning for så vidt
    angår perioden for indgivelse af ansøgninger om støtte til lagring af hedvin
    på Madeira og af vin på Azorerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 995/2003 της Επιτροπής,
    της 11ης Ιουνίου 2003, περί παρεκκλίσεως από τον
    κανονισμό (ΕΚ) αριθ. 43/2003 και περί τροποποιήσεως
    του εν λόγω κανονισμού όσον αφορά την περίοδο
    κατάθεσης των αιτήσεων ενίσχυσης για την παλαίωση
    οίνων λικέρ στη Μαδέρα και οίνου στις Αζόρες
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 995/2003, 11. juuni 2003, milles sätestatakse
    erand määrusest (EÜ) nr 43/2003 ja muudetakse seda seoses abitaotluste esitamise
    tähtajaga Madeira liköörveinide ja Assooride veinide laagerdamiseks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 995/2003, annettu 11 päivänä kesäkuuta 2003,
    asetuksesta (EY) N:o 43/2003 poikkeamisesta ja sen muuttamisesta Madeiran väkevien
    viinien ja Azorien viinien vanhentamistukihakemusten jättämistä koskevan määräajan
    osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 995/2003/EK rendelete (2003. június 11.) a 43/2003/EK rendelettől
    való eltérésről és annak a madeirai likőrbor és az azori-szigeteki bor
    érleléséhez nyújtott támogatás iránti kérelmek beadási határideje tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 995/2003 della Commissione, dell'11 giugno 2003, recante
    deroga al regolamento (CE) n. 43/2003 e che modifica tale regolamento per quanto
    riguarda il periodo di presentazione delle domande di aiuto per l'invecchiamento
    del vino liquoroso a Madera e del vino nelle Azzorre
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 995/2003 (2003. gada 11. jūnijs), ar ko izdara
    atkāpi no Regulas (EK) Nr. 43/2003 un to groza attiecībā uz termiņu atbalsta
    pieteikumu iesniegšanai par Madeiras deserta vīna un Azoru salu vīna nogatavināšanu
  type: main
- language: lt
  script: Latn
  content: 2003 m. birželio 11 d. Komisijos reglamentas (EB) Nr. 995/2003, nukrypstantis
