    taż-żmien għas-sottomissjoni ta’ l-applikazzjonijiet għall-għajnuna għaż-żieda
    fil-għomor ta’ l-inbid likur tal-Madeira u l-inbid ta’ l-Azores
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 995/2003 van de Commissie van 11 juni 2003 houdende
    afwĳking van en tot wĳziging van Verordening (EG) nr. 43/2003 ten aanzien van
    de termĳn voor de indiening van steunaanvragen voor de rĳping van de likeurwĳn
    van Madeira en wĳn van de Azoren
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 995/2003 z dnia 11 czerwca 2003 r. wprowadzające
    odstępstwo od rozporządzenia (WE) nr 43/2003 i zmieniające je w zakresie terminu
    na składanie wniosków o pomoc w odniesieniu do leżakowania wina likierowego
    madera oraz wina azorskiego
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 995/2003 da Comissão, de 11 de Junho de 2003, que
    estabelece derrogações do Regulamento (CE) n.° 43/2003 e altera o mesmo regulamento
    no respeitante ao período de apresentação dos pedidos de ajudas ao envelhecimento
    de vinho licoroso da Madeira e de vinho dos Açores
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 995/2003 z 11. júna 2003, ktorým sa udeľuje
    výnimka z nariadenia (ES) č. 43/2003 a ktorým sa mení a dopĺňa toto nariadenie
    pokiaľ ide o lehotu predloženia žiadostí pre pomoc na dozrievanie likérových
    vín z ostrova Madeira a vín z Azorských ostrovov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 995/2003 z dne 11. junija 2003 o odstopanju od
    Uredbe (ES) št. 43/2003 in njeni spremembi v zvezi z rokom za vložitev zahtevkov
    za pomoč za staranje likerskega vina Madeira in Azorskih vin
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 995/2003 de la Comisión, de 11 de junio de 2003, por
    el que se establecen excepciones al Reglamento (CE) n° 43/2003 y se modifica
    el mismo en lo relativo al período de presentación de las solicitudes de ayuda
    para el envejecimiento de vino de licor en Madeira y de vino en las Azores
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 995/2003 av den 11 juni 2003 om undantag
