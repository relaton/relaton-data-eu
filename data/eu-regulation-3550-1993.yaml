    execução do regime aplicável no sector do leite e dos produtos lácteos previsto
    nos acordos provisórios de associação concluídos pela Comunidade com a República
    da Polónia, a República da Hungria e a República Federativa Checa e Eslovaca,
    e o Regulamento (CE) nº 3055/93, que determina a quantidade disponível, para
    o primeiro trimestre de 1994, relativamente a certos produtos do sector do leite
    e dos produtos lácteos no âmbito do regime previsto pelos mesmos acordos
  type: main
