  content: Commission Regulation (EEC) No 894/90 of 6 April 1990 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    to fruit and vegetables as regards strawberries and amending Regulation (EEC)
    No 776/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 894/90 de la Commission du 6 avril 1990 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges dans le secteur des fruits et légumes en ce qui concerne les fraises
    et modifiant le règlement (CEE) n° 776/90
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 894/90 DER KOMMISSION vom 6. April 1990 ueber zusaetzliche,
