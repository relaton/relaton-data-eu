    Gemuese anwendbaren ergaenzenden Mechanismus und zur Aenderung der Verordnung
    (EWG) Nr. 776/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 894/90 af 6. april 1990 om visse supplerende
    bestemmelser for anvendelsen af den supplerende mekanisme for samhandelen med
    frugt og grønsager, for så vidt angår jordbær, og om ændring af forordning
    (EØF) nr. 776/90
  type: main
- language: el
  script: Grek
