title:
- language: en
  script: Latn
  content: Council Decision of 27 July 1976 on the Community financing of certain
    costs in respect of the emergency food aid in the form of cereals supplied under
    the 1974/75 and 1975/76 programmes to the Office of the United Nations High Commissioner
    for Refugees (UNHCR) for the sections of the population affected by the events
    in Cyprus
  type: main
- language: fr
  script: Latn
  content: '76/645/CEE: Décision du Conseil du 27 juillet 1976, relative au financement
    communautaire de certaines dépenses concernant l''aide alimentaire d''urgence
    en céréales, fournie dans le cadre des programmes 1974/1975 et 1975/1976, au
    Haut Commissariat des Nations Unies pour les réfugiés (UNHCR) en faveur des
    populations affectées par les événements de Chypre'
  type: main
- language: de
  script: Latn
  content: Beschluß des Rates vom 27. Juli 1976 über die gemeinschaftliche Finanzierung
    bestimmter Ausgaben betreffend die Nahrungsmittelsoforthilfe in Form von Getreide
    im Rahmen der Programme 1974/1975 und 1975/1976 an den Hohen Flüchtlingskommissar
    der Vereinten Nationen (UNHCR) für die von den Ereignissen in Zypern betroffenen
    Bevölkerungsteile
  type: main
- language: da
  script: Latn
  content: Rådets Afgørelse af 27. juli 1976 vedrørende Fællesskabets finansiering
    af visse omkostninger i forbindelse med hastende fødevarehjælp i form af korn
    til De forenede Nationers Højkommissariat for Flygtninge (UNHCR) som led i programmet
    for 1974/1975 og 1975/1976 til fordel for de befolkningsgrupper, som er berørt
    af begivenhederne på Cypern
  type: main
