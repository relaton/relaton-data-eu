    di cereali, fornito nel quadro dei programmi 1974/1975 e 1975/1976 all'Alto Commissariato
    delle Nazioni Unite per i profughi (UNHCR) a favore delle popolazioni colpite
    dagli eventi di Cipro
  type: main
- language: nl
  script: Latn
  content: Besluit van de Raad van 27 juli 1976 inzake de communautaire financiering
    van bepaalde uitgaven voor de verstrekking van dringende voedselhulp in de vorm
    van graan in het kader van de programma's 1974/1975 en 1975/1976 aan het Hoge
    Commissariaat van de Verenigde Naties voor Vluchtelingen (UNHRC) ten behoeve van
    de door de gebeurtenissen op Cyprus getroffen bevolkingsgroepen
