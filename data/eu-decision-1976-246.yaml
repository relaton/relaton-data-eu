---
id: EUDecision1976246
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 December 1975 authorizing the Italian Republic
    not to apply Community treatment to woven fabrics of cotton other than gauze or
    terry towelling and similar terry fabrics, unbleached, falling within heading
    No ex 55.09 of the Common Customs Tariff, originating in the Republic of Korea
    and Taiwan and in free circulation in the Benelux countries and the Federal Republic
    of Germany
  type: main
- language: fr
  script: Latn
  content: '76/246/CEE: Décision de la Commission, du 8 décembre 1975, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    coton autres qu''à point de gaze ou boucles du genre éponge, écrus, de la position
    Ex 55.09 du Tarif douanier commun, originaires de la République de Corée et
    de Taiwan et mis en libre pratique au Benelux et en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. Dezember 1975, mit der die Italienische
    Republik ermächtigt wird, aus der Republik Korea und aus Taiwan stammende und
    in den Beneluxländern und der Bundesrepublik Deutschland im freien Verkehr befindliche
    Gewebe aus Baumwolle, andere als Drehergewebe oder Schlingengewebe (Frottiergewebe),
    roh, der Tarifnummer ex 55.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 8. december 1975 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage ublegede, vævede stoffer af
    bomuld, med undtagelse af drejervævet stof og håndklædefrotterstof og lignende
    frotterstof, og som henhører under pos. ex 55.09 i den fælles toldtarif, har
    oprindelse i republikken Korea og i Taiwan og frit kan omsættes i Benelux og
    i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 dicembre 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone diversi
    da quelli a punto di garza o ricci del tipo spugna, greggi, della voce ex 55.09
    della tariffa doganale comune, originari della Repubblica di Corea e di Taiwan,
    messi in libera pratica nel Benelux e nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 december 1975 waarbij de Italiaanse
    Republiek wordt gemachtigd weefsels van katoen, andere dan die met gaasbinding
    of van bad- of frotteerstof (lussendoek), gebleekt, van tariefpost ex 55.09 van
    het gemeenschappelijk douanetarief, van oorsprong uit de Republiek Korea en Taiwan
    en in de Benelux en de Bondsrepubliek Duitsland in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
