title:
- language: fr
  script: Latn
  content: Décision 66/265/CEE de la Commission, du 5 avril 1966, relative au recours
    de la République italienne à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire le café, non torréfié, non décaféiné, de la
    position 09.01 A I A du Tarif douanier commun originaire des pays autres que les
    EAMA et que les PTOM associés à la CEE et mis en libre pratique dans les pays
    du Benelux
  type: main
- language: de
  script: Latn
  content: '66/265/EWG: Entscheidung der Kommission vom 5. April 1966 über den Antrag
    der Italienischen Republik gemäß Artikel 115 Absatz (1) des Vertrages, nicht
    entkoffeinierten, nicht gerösteten Kaffee der Tarifnummer 09.01 A I a des Gemeinsamen
    Zolltarifs aus anderen Ländern als den assoziierten afrikanischen Staaten und
    Madagaskar und den mit der Gemeinschaft assoziierten überseeischen Ländern und
    Hoheitsgebieten, der in den Benelux-Ländern in den freien Verkehr gebracht worden
    ist, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/265/CEE: Decisione della Commissione, del 5 aprile 1966, relativa al
    ricorso della Repubblica italiana all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario il caffè, non torrefatto, non decaffeinizzato,
    della voce 09.01 A I a della tariffa doganale comune, originario di paesi diversi
    dagli Stati africani e malgascio e dei paesi e territori d''oltremare associati
    alla CEE e immesso in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '66/265/EEG: Beschikking van de Commissie van 5 april 1966, betreffende
    het verzoek van de Italiaanse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag koffie, ongebrand, waaruit geen cafeïne is verwijderd, van post
    09.01 A I a van het gemeenschappelijk douanetarief, die van oorsprong is uit andere
    landen dan de geassocieerde Afrikaanse staten en Madagaskar en de met de Europese
    Economische Gemeenschap geassocieerde landen en gebieden overzee en die in de
    Benelux-landen in het vrije verkeer is gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
