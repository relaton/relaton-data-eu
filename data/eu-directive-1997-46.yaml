id: EUDirective199746
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 97/46/EC of 25 July 1997 amending Directive 95/44/EC
    establishing the conditions under which certain harmful organisms, plants, plant
    products and other objects listed in Annexes I to V to Council Directive 77/93/EEC
    may be introduced into or moved within the Community or certain protected zones
    thereof, for trial or scientific purposes and for work on varietal selections
  type: main
- language: fr
  script: Latn
  content: Directive 97/46/CE de la Commission du 25 juillet 1997 modifiant la directive
    95/44/CE fixant les conditions dans lesquelles certains organismes nuisibles,
    végétaux, produits végétaux et autres objets énumérés aux annexes I à
    V de la directive 77/93/CEE du Conseil peuvent être introduits ou circuler dans
    la Communauté ou dans certaines zones protégées de la Communauté pour des
    travaux à des fins d'essai ou à des fins scientifiques ou pour des travaux sur
    les sélections variétales
  type: main
- language: de
  script: Latn
  content: Richtlinie 97/46/EG der Kommission vom 25. Juli 1997 zur Änderung der
    Richtlinie 95/44/EG mit den Bedingungen, unter denen bestimmte Schadorganismen,
    Pflanzen, Pflanzenerzeugnisse und andere Gegenstände gemäß den Anhängen I
    bis V der Richtlinie 77/93/EWG des Rates zu Versuchs-, Forschungs- und Züchtungszwecken
    in die Gemeinschaft oder bestimmte Schutzgebiete derselben eingeführt oder darin
    verbracht werden dürfen
  type: main
- language: bg
  script: Cyrl
  content: Директива 97/46/EО на Комисията от 25 юли 1997
    година за изменение на Директива 95/44/ЕО относно
    условията, при които някои вредители, растения,
    продукти с растителен произход и друга техника
    и инструменти, включени в приложения I до V към
    Директива 77/93/ЕИО на Съвета, могат да бъдат
    въвеждани или да се движат в Общността или
    някои нейни защитени зони за опитни или научни
    цели, както и за селекция
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 97/46/ES ze dne 25. července 1997, kterou se mění směrnice
    95/44/ES, kterou se stanoví podmínky, na základě kterých lze pro pokusné
    nebo vědecké účely a pro práci ve šlechtění odrůd dovážet některé
    škodlivé organismy, rostliny, rostlinné produkty a jiné předměty uvedené
    v přílohách I až V směrnice Rady 77/93/EHS do Společenství nebo některých
    chráněných zón Společenství nebo je na těchto územích přemísťovat
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 97/46/EF af 25. juli 1997 om ændring af direktiv
    95/44/EF om de betingelser, hvorunder visse skadegørende planter, planteprodukter
    og andre objekter, der er anført i bilag I-V til Rådets direktiv 77/93/EØF,
    må føres ind i eller flyttes inden for Fællesskabet eller visse beskyttede
    zoner inden for dette med henblik på forsøg, forskning eller planteforædling
  type: main
- language: el
  script: Grek
  content: Οδηγία 97/46/ΕΚ της Επιτροπής της 25ης Ιουλίου
    1997 για τροποποίηση της οδηγίας 95/44/ΕΚ για τη
    θέσπιση όρων βάσει των οποίων ορισμένοι επιβλαβείς
    οργανισμοί, φυτά, φυτικά προϊόντα και λοιπά
    αντικείμενα που αναφέρονται στα παραρτήματα
    Ι έως V της οδηγίας 77/93/ΕΟΚ του Συμβουλίου, είναι
    δυνατόν να εισαχθούν ή να διακινηθούν στην
    Κοινότητα ή σε ορισμένες προστατευόμενες ζώνες
    της, για δοκιμές ή για επιστημονικούς σκοπούς,
    καθώς και για εργασίες επιλογής ποικιλιών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 97/46/EÜ, 25. juuli 1997, millega muudetakse direktiivi
    95/44/EÜ nõukogu direktiivi 77/93/EMÜ I–V lisas loetletud kahjulike organismide,
    taimede, taimsete saaduste ja muude esemete teaduslikel eesmärkidel või katseteks
    ning sordivalikuks ühendusse sissetoomise ning selle piires transportimise tingimuste
    määramise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 97/46/EY, annettu 25 päivänä heinäkuuta 1997,
    edellytyksistä, joilla neuvoston direktiivin 77/93/ETY liitteissä I-V lueteltuja
    tiettyjä haitallisia organismeja, kasveja, kasvituotteita ja muita tavaroita
    saa tuoda yhteisöön tai sen tietyille suojelluille alueille taikka siirtää
    yhteisössä tai sen tietyillä suojelluilla alueilla kokeellisia tai tieteellisiä
    tarkoituksia tai lajikevalintatyötä varten annetun direktiivin 95/44/EY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 97/46/EK irányelve (1997. július 25.) a 77/93/EGK tanácsi
    irányelv I–V. mellékletében szereplő károsítók, növények, növényi
    termékek és egyéb termékek tudományos, vizsgálati vagy fajtaszelekciós
    célokból a Közösségbe, illetve annak egyes védett övezeteibe történő
    behozatalára vagy ezeken belüli szállítására vonatkozó feltételek megállapításáról
    szóló 95/44/EK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 97/46/CE della Commissione del 25 luglio 1997 recante modifica
    della direttiva 95/44/CE che stabilisce le condizioni alle quali taluni organismi
    nocivi, vegetali, prodotti vegetali e altri prodotti elencati negli allegati I,
    II, III, IV e V della direttiva 77/93/CEE del Consiglio possono essere introdotti
    o trasferiti da un luogo all'altro nella Comunità o in talune sue zone protette
    per prove o scopi scientifici e per lavori di selezione varietale
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 97/46/EK (1997. gada 25. jūlijs), ar kuru groza Direktīvu
    95/44/EK, ar ko ievieš nosacījumus, kurus ievērojot, dažus kaitīgus organismus,
    augus, augu produktus un citus Padomes Direktīvas Nr. 77/93/EEK I līdz V pielikumā
    uzskaitītos objektus drīkst ievest vai pārvietot Kopienā vai dažās tās
    aizsargājamās zonās izmēģinājumu vai zinātniskiem mērķiem un šķirņu
    selekcijas vajadzībām
  type: main
- language: lt
  script: Latn
  content: 1997 m. liepos 25 d. Komisijos direktyva 97/46/EB, iš dalies keičianti
    Direktyvą 95/44/EB, nustatančią sąlygas, kuriomis galima įvežti į Bendriją
    ar pervežti jos viduje arba tam tikrose apsaugotose jos zonose tam tikrus kenksmingus
    organizmus, augalus, augalinius produktus ir kitus Tarybos direktyvos 77/93/EEB
    I–V prieduose išvardintus objektus tiriamiesiems ar mokslo tikslams ir rūšių
    selekcijos darbams
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 97/46/KE tal-25 ta’ Lulju 1997 li temenda
    d- Direttiva 95/44/KE li tistabilixxi l-kundizzjonijiet li japplikaw għall-introduzzjoni
    jew għall-moviment ta’ ċerti organismi li jagħmlu l-ħsara, pjanti, prodotti
    magħmula mill-pjanti u oġġetti oħrajn elenkati fl-Annessi I sa V tad-Direttiva
    tal-Kunsill 77/93/KEE ġewwa l-Komunità jew ċerti żoni protetti tagħha, għal
    provi jew għal skopijiet xjentifiċi u għal xogħol fuq selezzjonijiet varjetali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 97/46/EG van de Commissie van 25 juli 1997 houdende wijziging
    van Richtlijn 95/44/EG tot vaststelling van de voorwaarden waaronder bepaalde
    in de bijlage I tot en met V bij Richtlijn 77/93/EEG van de Raad vermelde schadelijke
    organismen, planten, plantaardige producten en andere materialen voor proefnemingen
    of wetenschappelijke doeleinden en voor selectiewerkzaamheden in de Gemeenschap
    of in bepaalde beschermde gebieden daarvan mogen worden binnengebracht of naar
    een andere plaats overgebracht
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 97/46/WE z dnia 25 lipca 1997 r. zmieniająca dyrektywę
    95/44/WE ustanawiającą warunki, zgodnie z którymi niektóre organizmy szkodliwe,
    rośliny, produkty roślinne i inne wymienione w załącznikach I–V do dyrektywy
    Rady 77/93/EWG mogą być wprowadzane do Wspólnoty lub niektórych jej stref
    ochronnych lub przemieszczane we Wspólnocie lub w takich strefach celem przeprowadzenia
    prób lub do celów naukowo-badawczych i do prowadzenia prac nad tworzeniem odmian
    roślin
  type: main
- language: pt
  script: Latn
  content: Directiva 97/46/CE da Comissão de 25 de Julho de 1997 que altera a Directiva
    95/44/CE que estabelece as condições segundo as quais determinados organismos
    prejudiciais, plantas, produtos vegetais e outros materiais, constantes dos anexos
    I a V da Directiva 77/93/CEE, podem ser introduzidos ou circular na Comunidade,
    ou em certas zonas protegidas desta, para fins experimentais ou científicos e
    trabalhos de selecção de variedades
  type: main
- language: ro
  script: Latn
  content: Directiva 97/46/CE a Comisiei din 25 iulie 1997 de modificare a Directivei
    95/44/CE de stabilire a condițiilor în care anumite organisme dăunătoare,
    plante, produse din plante și alte elemente enumerate în anexele I-V la Directiva
    77/93/CEE a Consiliului pot fi introduse sau puse în circulație în Comunitate
    sau în anumite zone protejate ale acesteia, pentru testări sau în scopuri științifice
    sau pentru lucrări pe selecții de soiuri de plante
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 97/46/ES z 25. júla 1997, ktorou sa mení a dopĺňa
    smernica 95/44/ES ustanovujúca podmienky, na základe ktorých sa určité škodlivé
    organizmy, rastliny, rastlinné produkty a iné predmety uvedené v prílohách
    I až V k smernici Rady 77/93/EHS môžu dovážať do spoločenstva alebo jeho
    určitých chránených zón alebo premiestňovať v rámci nich, na pokusné,
    vedecké alebo šľachtiteľské účely
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 97/46/ES z dne 25. julija 1997 o spremembi Direktive
    95/44/ES o določitvi pogojev, pod katerimi je mogoče nekatere škodljive organizme,
    rastline, rastlinske proizvode in druge predmete iz Prilog I do V Direktive Sveta
    77/93/EGS vnesti ali jih premeščati znotraj Skupnosti oziroma na nekaterih njenih
    varovanih območjih v preskusne ali znanstvene namene in za delo pri žlahtnjenju
  type: main
- language: es
  script: Latn
  content: Directiva 97/46/CE de la Comisión de 25 de julio de 1997 por la que se
    modifica la Directiva 95/44/CE por la que se establecen las condiciones en las
    que determinados organismos nocivos, vegetales, productos vegetales y otros objetos
    enumerados en los Anexos I a V de la Directiva 77/93/CEE del Consejo pueden ser
    introducidos o transportados dentro de la Comunidad o de determinadas zonas protegidas
    de la misma con fines de ensayo o científicos y para actividades de selección
    de variedades
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 97/46/EG av den 25 juli 1997 om ändring av direktiv
    95/44/EG om införande av villkor enligt vilka vissa skadegörare, växter, växtprodukter
    och andra föremål som anges i bilaga I-V till rådets direktiv 77/93/EEG kan
    införas eller förflyttas inom gemenskapen eller vissa skyddade zoner för försök
    eller vetenskapliga ändamål och för arbete med sorturval
  type: main
