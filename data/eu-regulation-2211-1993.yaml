  content: COMMISSION REGULATION (EEC) No 2211/93 of 4 August 1993 re-establishing
    the levying of customs duties on products falling within CN codes 3903, ex 3915
    and ex 3920, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
