    de la perception des droits de douane applicables aux produits des codes NC 3903,
    ex 3915 et ex 3920, originaires de Corée du Sud, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
