    mit Ursprung in Südkorea, für die die in der Verordnung (EWG) Nr. 3831/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2211/93 af 4. august 1993 om genindførelse
