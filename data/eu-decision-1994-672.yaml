  script: Latn
  content: '94/672/CFSP: Council Decision of 10 October 1994 on the Common Position
    defined on the basis of Article J.2 of the Treaty on European Union and concerning
    the reduction of economic and financial relations with those parts of the territory
    of the Republic of Bosnia- Herzegovina under the control of the Bosnian Serb forces'
  type: main
- language: fr
  script: Latn
  content: '94/672/PESC: Décision du Conseil, du 10 octobre 1994, relative à la
