id: EUDecision1973319
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 September 1973 authorizing the Kingdom of the
    Netherlands not to apply Community treatment to radio receivers (including car
    radios and radio recorders), colour television sets and portable black and white
    television sets falling within subheading No 85.15 A ex III of the Common Customs
    Tariff, originating in Japan and put into free circulation in the Federal Republic
    of Germany
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 18 septembre 1973 autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les appareils récepteurs de radio (y compris les
    appareils de radio pour automobiles et les radio-enregistreurs), les appareils
    de télévision en couleurs et les appareils de télévision en noir et blanc
    portatifs, de la position 85.15 A Ex III du Tarif douanier commun, originaires
    du Japon et mis en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. September 1973, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Japan stammende und in der Bundesrepublik Deutschland im freien Verkehr
    befindliche Empfangsgeräte für Rundfunk (einschließlich Autoradios und Kassettenradios),
    Farbfernsehgeräte und tragbare Schwarz-Weiß- Fernsehgeräte der Tarifnummer
    85.15 A ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. september 1973 om bemyndigelse for kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage radiomodtagere (herunder radiomodtagere til automobiler og radiomodtagere
    kombineret med lydoptagere), farvefjernsynsmodtagere og transportable sort/hvid
    fjernsynsmodtagere, som henhører under position 85.15 A ex III i den fælles
    toldtarif, har oprindelse i Japan og frit kan omsættes i Den tyske Forbundsrepublik
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 settembre 1973, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno del Paesi Bassi ad escludere
    dal trattamento comunitario gli apparecchi radioriceventi (inclusi gli apparecchi
    per automobili ed i radio-registratori), i televisori a colori ed i televisori
    monocromi portatili, della voce n. 85.15 ex III della tariffa doganale comune,
    originari del Giappone e messi in libera pratica nella Repubblica federale di
    Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 september 1973 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd radio-ontvangtoestellen (auto-radio's en radio-recorders daaronder
    begrepen), kleuren-televisietoestellen en draagbare zwart-wit televisietoestellen
    van post 85.15 A ex III, van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de Bondsrepubliek Duitsland in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten
  type: main
