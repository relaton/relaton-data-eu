title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 771/80 of 28 March 1980 re-establishing
    the levying of customs duties on tubes and pipes and blanks therefor, of copper;
    hollow bars of copper, falling within subheading 74.07 and originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 771/80 de la Commission, du 28 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris leurs ébauches) et barres creuses, en cuivre, de la position
    74.07 du tarif douanier commun, originaires de Yougoslavie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 771/80 der Kommission vom 28. März 1980 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 771/80 af 28. marts 1980 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger, af kobber,
    under pos. 74.07, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 771/80 della Commissione, del 28 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili a tubi (compresi i loro sbozzi) e
    barre forate, di rame, della voce 74.07 della tariffa doganale comune, originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 771/80 van de Commissie van 28 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op buizen en
    pijpen (ook indien niet afgewerkt) en holle staven, van koper, van post 74.07,
    van oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
