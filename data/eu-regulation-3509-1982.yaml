title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3509/82 of 23 December 1982 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the period
    1 January to 31 December 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3509/82 de la Commission, du 23 décembre 1982, fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    période allant du 1er janvier au 31 décembre 1983, intervenant dans le calcul
    de la compensation financière et de l' avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3509/82 der Kommission vom 23. Dezember 1982 zur Festsetzung
    des Pauschalwerts der in der Zeit vom 1. Januar bis 31. Dezember 1983 aus dem
    Handel genommenen Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs
    und des entsprechenden Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3509/82 af 23. december 1982 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i perioden fra den 1. januar til den 31. december 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3509/82 τής Επιτροπής
    τής 23ης Δεκεμβρίου 1982 περί καθορισμού τής κατ
    αποκοπή αξίας τών προϊόντων αλιείας πού αποσύρονται
    από τήν αγορά κατά τήν περίοδο από 1ης Ιανουρίου
    έως 31 Δεκεμβρίου 1983, η οποία παρεμβαίνει στόν
    υπολογισμό τής χρηματικής αντισταθμίσεως,
    καί τής σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3509/82 della Commissione, del 23 dicembre 1982, che
    fissa, ai fini del calcolo della compensazione finanziaria e dell' anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nel periodo
    1° gennaio - 31 dicembre 1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3509/82 van de Commissie van 23 december 1982 betreffende
    de vaststelling van de forfaitaire waarde van de in de periode van 1 januari tot
    en met 31 december 1983 uit de markt genomen visserijprodukten voor de berekening
    van de financiële vergoeding en het hierop betrekking hebbende voorschot
  type: main
