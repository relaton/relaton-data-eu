title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 677/83 of 24 March 1983 re-establishing
    the levying of customs duties on overcoats, raincoats and cloaks and capes; jackets
    and blazers, products of category 15 B (code 0155), originating in Malaysia, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 677/83 de la Commission du 24 mars 1983 portant rétablissement
    de la perception des droits de douane applicables aux manteaux, imperméables
    et vestes de la catégorie 15 B (code 0155), originaires de Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 677/83 der Kommission vom 24. März 1983 über die
    Wiedereinführung des Zollsatzes für Mäntel, Umhänge und Jacken der Warenkategorie
    Nr. 15 B (Kennziffer 0155), mit Ursprung in Malaysia, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 677/83 af 24. marts 1983 om genindførelse
    af opkrævning af toldafgifter for frakker, kapper og slag, jakker og blazere
    under kategori nr. 15 B (kode 0155), som har oprindelse i Malaysia og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 677/83 της Επιτροπής
    της 24ης Μαρτίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για επανωφόρια,
    αδιάβροχα και σακκάκια της κατηγορίας 15 Β (κώδικας
    0155), καταγωγής Μαλαισίας, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 677/83 della Commissione del 24 marzo 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai cappotti, ai soprabiti e alle
    giacche, della categoria di prodotti n. 15 B (codice 0155), originari della Malaysia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 677/83 van de Commissie van 24 maart 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mantels,
    regenjassen en capes daaronder begrepen, blazers en jasjes van de categorie van
    produkten nr. 15 B (codenummer 0155), van oorsprong uit Maleisië, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3378/82
    van de Raad
