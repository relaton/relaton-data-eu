    koskevista tuontioikeushakemuksista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1376/1999 della Commissione, del 25 giugno 1999, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto di
    importazione presentate nel mese di giugno 1999 per le carni bovine congelate
    destinate alla trasformazione
  type: main
