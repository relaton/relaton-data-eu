  script: Latn
  content: Commission Regulation (EC) No 1376/1999 of 25 June 1999 determining the
    extent to which applications lodged in June 1999 for import rights in respect
    of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1376/1999 de la Commission, du 25 juin 1999, déterminant
