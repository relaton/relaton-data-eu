title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1383/70 de la Commission, du 14 juillet 1970, relatif
    à la détermination des centres d'intervention pour les graines oléagineuses,
    autres que les centres principaux, et des prix d'intervention dérivés qui y
    sont applicables
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1383/70 der Kommission vom 14. Juli 1970 zur Festlegung
    der Interventionsorte für Ölsaaten, ausgenommen die Hauptinterventionsorte,
    und der dort geltenden abgeleiteten Interventionspreise
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1383/70 della Commissione, del 14 luglio 1970, che
    determina i centri d'intervento per i semi oleosi, diversi dai centri principali,
    ed i prezzi d'intervento derivati in essi applicabili
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1383/70 van de Commissie van 14 juli 1970 betreffende
    het bepalen van de andere dan de voornaamste interventiecentra voor oliehoudende
    zaden, en van de daar geldende afgeleide interventieprijzen
  type: main
