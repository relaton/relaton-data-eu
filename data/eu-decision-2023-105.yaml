  content: Decizia (UE) 2023/105 a Comisiei din 26 iulie 2022 privind măsurile SA.33960
    2012/C (ex 2012/NN) puse în aplicare de Republica Franceză în favoarea administratorilor
    succesivi ai aeroportului Beauvais-Tillé și a companiilor aeriene care operează
    în cadrul acestui aeroport [notificată cu numărul C(2022) 5076] (Numai textul
