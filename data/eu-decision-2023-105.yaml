    rzecz kolejnych organów zarządzających portem lotniczym Beauvais Tillé i przedsiębiorstw
    lotniczych prowadzących działalność w tym porcie lotniczym (notyfikowana jako
    dokument nr C(2022) 5076) (Jedynie tekst w języku francuskim jest autentyczny)
  type: main
