  content: Rozhodnutie Komisie (EÚ) 2023/105 z 26. júla 2022 o opatreniach SA.33960
    2012/C (ex 2012/NN), ktoré vykonala Francúzska republika v prospech postupných
    správcov letiska v Beauvais-Tillé a leteckých spoločností pôsobiacich na
    uvedenom letisku [oznámené pod číslom C(2022) 5076] (Iba francúzske znenie
    je autentické)
  type: main
