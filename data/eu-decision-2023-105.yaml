title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2023/105 of 26 July 2022 on the measures SA.33960
    2012/C (ex 2012/NN) implemented by the French Republic in favour of the successive
    managers of Beauvais-Tillé airport and the airlines operating there (notified
    under document C(2022) 5076) (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/105 de la Commission du 26 juillet 2022 concernant
    les mesures SA.33960 2012/C (ex 2012/NN) mises à exécution par la République
    française en faveur des gestionnaires successifs de l’aéroport de Beauvais-Tillé
    et des compagnies aériennes opérant audit aéroport [notifiée sous le numéro
    C(2022) 5076] (Le texte en langue française est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/105 der Kommission vom 26. Juli 2022 über die von
    der französischen Republik durchgeführten Maßnahmen SA.33960 2012/C (ex 2012/NN)
    zugunsten der aufeinanderfolgenden Betreiber des Flughafens Beauvais-Tillé und
    der besagten Flughafen nutzenden Fluggesellschaften (Bekannt gegeben unter Aktenzeichen
    C(2022) 5076) (Nur der französische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/105 на Комисията от 26 юли 2022
    година относно мерки SA.33960 2012/C (ex 2012/NN), приведени
    в действие от Френската република в полза на
    последователните управляващи органи на летище
    Beauvais-Tillé и авиокомпаниите, опериращи на посоченото
    летище (нотифицирано под номер С(2022) 5076) (само
    текстът на френски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise (EU) 2023/105 ze dne 26. července 2022 o opatřeních
    SA.33960 2012/C (ex 2012/NN) provedených Francouzskou republikou ve prospěch
    postupných správců letiště Beauvais-Tillé a leteckých společností působících
    na tomto letišti (oznámeno pod číslem C(2022) 5076) (Pouze francouzské znění
    je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse (EU) 2023/105 af 26. juli 2022 vedrørende foranstaltningerne
    SA.33960 2012/C (ex 2012/NN) truffet af Den Franske Republik til fordel for skiftende
    operatører af Beauvais-Tillé lufthavn og luftfartsselskaber med aktiviteter
    i denne lufthavn (meddelt under nummer C(2022) 5076) (Kun den franske udgave er
    autentisk)
  type: main
- language: el
  script: Grek
  content: Απόφαση (EE) 2023/105 της Επιτροπής της 26ης Ιουλίου
    2022 σχετικά με τα μέτρα SA.33960 2012/C (πρώην 2012/NN)
    που έθεσε σε εφαρμογή η Γαλλική Δημοκρατία
    υπέρ των διαδοχικών φορέων διαχείρισης του
    αερολιμένα Beauvais-Tillé και των αεροπορικών εταιρειών
    που δραστηριοποιούνται στον εν λόγω αερολιμένα
    [κοινοποιηθείσα υπό τον αριθμό C(2022) 5076] (Το κείμενο
    στη γαλλική γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus (EL) 2023/105, 26. juuli 2022, meetmete SA.33960 2012/C
    (ex 2012/NN) kohta, mida Prantsuse Vabariik on rakendanud Beauvais-Tillé lennujaama
    üksteisele järgnenud käitajate ja seda lennujaama kasutavate lennuettevõtjate
    suhtes (teatavaks tehtud numbri C(2022) 5076 all) (Ainult prantsuskeelne tekst
    on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission päätös (EU) 2023/105, annettu 26 päivänä heinäkuuta 2022,
    valtiontuista SA.33960 (2012/C) (ex 2012/NN), jotka Ranska on myöntänyt Beauvais–Tillén
    lentoaseman pitäjille ja lentoasemaa käyttäville lentoyhtiöille (tiedoksiannettu
    numerolla C(2022) 5076) (Ainoastaan ranskankielinen teksti on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2023/105 ón gCoimisiún an 26 Iúil 2022 maidir leis na
    bearta SA.33960 2012/C (ex 2012/NN) atá curtha i bhfeidhm ag Poblacht na Fraince
    i bhfabhar riarthóirí comhleantacha aerfort Beauvais-Tillé agus na haerlínte
    a oibríonn as an aerfort céanna (a bhfuil fógra tugtha ina leith faoi dhoiciméad
    C(2022) 5076) (Is ag an téacs sa Fhraincis a bheidh an t–údarás agus aige
    sin amháin) (Téacs atá ábhartha don LEE)
  type: main
- language: hr
  script: Latn
  content: Odluka Komisije (EU) 2023/105 оd 26. srpnja 2022. o mjerama SA.33960 2012/C
    (ex 2012/NN) koje je Francuska Republika provela za uzastopne upravitelje zračne
    luke Beauvais-Tillé i zračne prijevoznike koji posluju u toj zračnoj luci (priopćeno
    pod brojem dokumenta C(2022) 5076) (Vjerodostojan je samo tekst na francuskom
    jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/105 határozata (2022. július 26.) a Beauvais-Tillé
    repülőtér egymást követő üzembentartói és az ezen a repülőtéren működő
    légitársaságok javára a Francia Köztársaság által végrehajtott SA.33960
    2012/C (ex 2012/NN) számú intézkedésekről (az értesítés a c(2022) 5076.
    számú dokumentummal történt) (Csak a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/105 della Commissione del 26 luglio 2022 relativa alle
    misure SA.33960 2012/C (ex 2012/NN) cui la Repubblica francese ha dato esecuzione
    a favore dei soggetti responsabili della gestione dell’aeroporto di Beauvais-Tillé
    e delle compagnie aeree operanti in tale aeroporto [notificata con il numero C(2022)
    5076] (Il testo in lingua francese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2023/105 (2022. gada 26. jūlijs) par pasākumiem
    SA.33960 2012/C (ex 2012/NN), ko Francijas Republika īstenojusi secīgiem Bovē
    Tijē lidostas pārvaldītājiem un aviosabiedrībām, kas darbojas šajā lidostā
    (izziņots ar dokumenta numuru C(2022) 5076) (Autentisks ir tikai teksts franču
    valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos sprendimas (ES) 2023/105 2022 m. liepos 26 d. dėl priemonių
    SA.33960 2012/C (ex 2012/NN), kurias Prancūzijos Respublika taikė viena po kitos
    Bovė Tijė oro uostą valdžiusioms įstaigoms ir tame oro uoste veiklą vykdžiusioms
    oro transporto bendrovėms (pranešta dokumentu C(2022) 5076) (Tekstas autentiškas
    tik prancūzų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni (UE) 2023/105 tas-26 ta’ Lulju 2022 dwar
    il-miżuri SA.33960 2012/C (ex 2012/NN) implimentati mir-Repubblika Franċiża
    favur l-operaturi suċċessivi tal-ajruport ta’ Beauvais-Tillé u tal-linji
    tal-ajru li joperaw fit-tali ajruport (notifikata bid-dokument C(2022) 5076) (It-test
    bil-Franċiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/105 van de Commissie van 26 juli 2022 betreffende de
    steunmaatregelen SA.33960 2012/C (ex 2012/NN) die de Franse Republiek ten uitvoer
    heeft gelegd ten behoeve van de opeenvolgende beheerders van de luchthaven Beauvais-Tillé
    en de luchtvaartmaatschappijen die op die luchthaven actief zijn (Kennisgeving
    geschied onder nummer C(2022) 5076) (Slechts de tekst in de Franse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji (UE) 2023/105 z dnia 26 lipca 2022 r. w sprawie pomocy
