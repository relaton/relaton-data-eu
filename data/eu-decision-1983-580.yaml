title:
- language: en
  script: Latn
  content: '83/580/EEC: Commission Decision of 16 November 1983 establishing that
    the apparatus described as ''MTS - Power Test System, consisting of: Load Unit,
    model 810.12, Hydraulic Service Manifolds, Servo Valve, model 252.24 and Control
    System, consisting of: Control Unit, model 436.11, Servo Controller, model 440.13,
    Valve Driver, model 440.14, DC Transducer Conditioner, model 440.21, model 440.22
    and Controller, model 442.11'' may not be imported free of Common Customs Tariff
    duties'
  type: main
- language: fr
  script: Latn
  content: '83/580/CEE: Décision de la Commission du 16 novembre 1983 constatant
    que l''importation de l''appareil dénommé "M.T.S - Power Test System, consisting
    of: Load Unit, model 810.12, Hydraulic Servic Manifolds, Servo Valve, model 252.24
    and Control System, consisting of: Control Unit, model 436.11, Servo Controller,
    model 440.13, Valve Driver, model 440.14, DC Transducer Conditioner, model 440.21,
    model 440.22 and Controller, model 442.11" ne peut être faite en franchise des
    droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/580/EWG: Entscheidung der Kommission vom 16. November 1983, mit der
    festgestellt wird, daß das Gerät ,,M.T.S. - Power Test System, consisting of:
    Load Unit, model 810.12, Hydraulic Service Manifolds, Servo Valve, model 252.24
    and Control System, consisting of: Control Unit, model 436.11, Servo Controller,
    model 440.13, Valve Driver, model 440.14, DC Transducer Conditioner, model 440.21,
    model 440.22 and Controller, model 442.11" nicht unter Befreiung von den Zöllen
    des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/580/EØF: Kommissionens beslutning af 16. november 1983 om fastslåelse
    af, at indførsel af apparatet "M.T.S. - Power Test System, consisting of: Load
    Unit, model 810.12, Hydraulic Service Manifolds, Servo Valve, model 252.24 and
    Control System, consisting of: Control Unit, model 436.11, Servo Controller, model
    440.13, Valve Driver, model 440.14, DC Transducer Conditioner, model 440.21, model
    440.22 and Controller, model 442.11" ikke kan ske med fritagelse for told efter
    den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/580/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Νοεμβρίου 1983 περί διαπιστώσεως ότι η εισαγωγή
    της συσκευής με την ονομασία «MTS — Power Test System,
    consisting of: Load Unit, model 810.12, Hydraulic Service Manifolds, Servo Valve,
    model 252.24 and Control System, consisting of: Control Unit, model 436.11, Servo
    Controller, model 440.13, Valve Driver, model 440.14, DC Transducer Conditioner,
    model 440.21, model 440.22 and Controller, model 442.11» δεν δύναται
    να πραγματοποιηθεί ατελώς ως προς τους δασμούς
    του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/580/CEE: Decisione della Commissione del 16 novembre 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "MTS - Power Test System, consisting
    of: Load Unit, model 810.12, Hydraulic Service Manifolds, Servo Valve, model 252.24
    and Control System, consisting of: Control Unit, model 436.11, Servo Controller,
    model 440.13, Valve Driver, model 440.14, DC Transducer Conditioner, model 440.21,
    model 440.22 and Controller, model 442.11" non può avvenire in franchigia dai
    dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/580/EEG: Beschikking van de Commissie van 16 november 1983 waarbij
