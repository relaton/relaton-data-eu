title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1005/81 of 10 April 1981 re-establishing
    the levying of customs duties on flax or ramie yarn, not put up for retail sale,
    products of category 115 (code 1150), originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1005/81 de la Commission, du 10 avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    lin ou de ramie, non conditionnés pour la vente au détail, de la catégorie
    115 (code 1150), originaires du Brésil, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1005/81 der Kommission vom 10. April 1981 über die
    Wiedereinführung des Zollsatzes für Leinengarne und Ramiegarne, nicht in Aufmachungen
    für den Einzelverkauf, der Warenkategorie Nr. 115 (Kennziffer 1150), mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1005/81 af 10. april 1981 om genindførelse
    af opkrævning af toldafgifter for garn af hør eller ramie, ikke i detailsalgsoplægninger,
    under kategori 115 (kode 1150), som har oprindelse i Brasilien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1005/81 τής Επιτροπής
    τής 10ης Απριλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά νήματα εκ
    λίνου ή ραμί, μή συνεσκευασμένα διά τήν λιανικήν
    πώλησιν, τών προϊόντων τής κατηγορίας 115 (κώδικας
    1150) καταγωγής Βραζιλίας, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1005/81 della Commissione, del 10 aprile 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lino o di
    ramié, non preparati per la vendita al minuto, della categoria di prodotti n.
    115 (codice 1150), originari del Brasile, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1005/81 van de Commissie van 10 april 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    vlas of van ramee, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 115 (codenummer 1150), van oorsprong uit Brazilië waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3320/80
    van de Raad
