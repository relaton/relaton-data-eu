  type: main
- language: it
  script: Latn
  content: '74/381/CEE: Decisione della Commissione, del 1° luglio 1974, che autorizza
    la Repubblica italiana a derogare all'' articolo 4 bis del regolamento (CEE) n.
    974/71 per quanto riguarda la detrazione degli importi compensativi monetari dagli
    oneri all'' importazione in provenienza dai paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '74/381/EEG: Beschikking van de Commissie van 1 juli 1974 houdende machtiging
