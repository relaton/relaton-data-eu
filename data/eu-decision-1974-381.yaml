title:
- language: en
  script: Latn
  content: '74/381/EEC: Commission Decision of 1 July 1974 authorizing the Italian
    Republic to suspend application of Article 4a of Regulation (EEC) No 974/71 as
    regards the deduction of monetary compensatory amounts from charges on imports
    from third countries'
  type: main
- language: fr
  script: Latn
  content: '74/381/CEE: Décision de la Commission, du 1er juillet 1974, autorisant
    la République italienne à déroger à l'' article 4bis du règlement (CEE) n°
    974/71 en ce qui concerne la déduction des montants compensatoires monétaires
    des charges à l'' importation en provenance des pays tiers'
  type: main
- language: de
  script: Latn
  content: '74/381/EWG: Entscheidung der Kommission vom 1. Juli 1974 zur Ermächtigung
    der Italienischen Republik, von Artikel 4a der Verordnung (EWG) Nr. 974/71 in
    bezug auf den Abzug der Währungsausgleichsbeträge von der Belastung bei der
    Einfuhr aus Drittländern abzuweichen'
  type: main
- language: da
  script: Latn
  content: '74/381/EØF: Kommissionens Beslutning af 1. juli 1974 om bemyndigelse
