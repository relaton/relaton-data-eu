  content: Décision 68/274/CEE de la Commission, du 5 juillet 1968, abrogeant la
    décision de la Commission, du 31 mai 1968, autorisant la République française
    à percevoir une taxe à l'importation des produits relevant du secteur de la
    viande de porc
  type: main
- language: de
  script: Latn
  content: '68/274/EWG: Entscheidung der Kommission vom 5. Juli 1968 zur Aufhebung
    der Entscheidung der Kommission vom 31. Mai 1968 über die Ermächtigung der Französischen
    Republik zur Erhebung einer Abgabe bei der Einfuhr von Schweinefleischerzeugnissen'
  type: main
- language: it
  script: Latn
  content: '68/274/CEE: Decisione della Commissione, del 5 luglio 1968, che abroga
    la decisione della Commissione del 31 maggio 1968, che autorizza la Repubblica
    francese a riscuotere una tassa all''importazione dei prodotti rilevanti dal settore
    delle carni suine'
  type: main
- language: nl
  script: Latn
  content: '68/274/EEG: Beschikking van de Commissie van 5 juli 1968 houdende intrekking
    van de beschikking van de Commissie van 31 mei 1968 waarbij de Franse Republiek
    gemachtigd wordt tot het heffen van een invoerbelasting op produkten welke tot
    de sector varkensvlees behoren'
  type: main
