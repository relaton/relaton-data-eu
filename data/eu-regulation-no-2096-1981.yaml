    zu der Beihilferegelung für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2096/81 af 23. juli 1981 om ændring
