  content: Commission Regulation (EEC) No 199/85 of 25 January 1985 fixing the quantities
    of frozen beef intended for processing which may be imported on special conditions
    for the first quarter of 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 199/85 de la Commission, du 25 janvier 1985, fixant
    les quantités de viandes bovines congelées destinées à la transformation pouvant
    être importées à des conditions spéciales pour le premier trimestre de 1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 199/85 der Kommission vom 25. Januar 1985 zur Festsetzung
    der zur Verarbeitung bestimmten Mengen gefrorenen Rindfleisches, die für das
    erste Vierteljahr 1985 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 199/85 af 25. januar 1985 om fastsættelse
    af de mængder frosset oksekød til forarbejdning, der kan indføres på særlige
    vilkår i første kvartal af 1985
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 199/85 της Επιτροπής
    της 25ης Ιανουαρίου 1985 περί καθορισμού των ποσοτήτων
    βοείου κατεψυγμένου κρέατος, οι οποίες προορίζονται
    για μεταποίηση και είναι δυνατόν να εισαχθούν
    υπό ειδικούς όρους για το πρώτο τρίμηνο του
    1985
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 199/85 della Commissione, del 25 gennaio 1985, che
    fissa le quantità di carni bovine congelate, destinate alla trasformazione, che
    possono essere importate a condizioni speciali per il primo trimestre 1985
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 199/85 van de Commissie van 25 januari 1985 tot vaststelling
    van de hoeveelheden bevroren rundvlees voor verwerking die in het eerste kwartaal
    van 1985 op bijzondere voorwaarden kunnen worden ingevoerd
  type: main
