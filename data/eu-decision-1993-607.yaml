    joista lihavalmisteiden tuonti yhteisöön sallitaan'
  type: main
- language: it
  script: Latn
  content: '93/607/CE: DECISIONE DELLA COMMISSIONE del 15 novembre 1993 che modifica
    la decisione 86/414/CEE per quanto riguarda l'' elenco degli stabilimenti dell''
    Argentina, in provenienza dai quali è autorizzata l'' importazione di prodotti
    a base di carne nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '93/607/EG: BESCHIKKING VAN DE COMMISSIE van 15 november 1993 tot wijziging
