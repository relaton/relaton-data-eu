  script: Latn
  content: '93/607/EC: Commission Decision of 15 November 1993 amending Decision 86/414/EEC
    as regards the list of establishments in Argentina approved for the purpose of
    importing meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '93/607/CE: Décision de la Commission du 15 novembre 1993 modifiant la
    décision 86/414/CEE en ce qui concerne la liste des établissements d''Argentine
    agréés pour l''importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: '93/607/EG: ENTSCHEIDUNG DER KOMMISSION vom 15. November 1993 zur Änderung
    der Entscheidung 86/414/EWG in bezug auf die Liste der Betriebe in Argentinien,
    aus denen die Einfuhr von Fleischerzeugnissen in die Gemeinschaft zugelassen ist'
  type: main
- language: da
  script: Latn
  content: '93/607/EF: KOMMISSIONENS BESLUTNING af 15. november 1993 om ændring af
    beslutning 86/414/EØF for så vidt angår listen over de virksomheder i Argentina,
    der er godkendt til indførsel af kødprodukter til Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '93/607/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 15ης Νοεμβρίου
    1993 που τροποποιεί την απόφαση 86/414/ΕΟΚ όσον
    αφορά τον πίνακα των εγκαταστάσεων της Αργεντινής
    που έχουν εγκριθεί για την εισαγωγή προϊόντων
    με βάση το κρέας στην Κοινότητα'
  type: main
- language: fi
  script: Latn
  content: '93/607/ETY: Komission päätös, tehty 15 päivänä marraskuuta 1993,
