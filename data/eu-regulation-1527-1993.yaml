  content: COMMISSION REGULATION (EEC) No 1527/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of categories 22, 23 and 75 (order Nos
    40.0220, 40.0230 and 40.0750), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1527/93 de la Commission du 18 juin 1993 portant rétablissement
