    de determinados tubos sem costura, de ferro ou de aço, originários da Rússia
    e da Ucrânia, na sequência de um reexame da caducidade nos termos do artigo
    11. °, n. ° 2, do Regulamento (CE) n. ° 1225/2009, e encerra o processo de
    reexame da caducidade relativo às importações de determinados tubos de aço
    sem costura, de ferro ou de aço, originários da Croácia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 585/2012 al Consiliului din
    26 iunie 2012 de instituire a unei taxe antidumping la importurile anumitor tuburi
    și țevi obținute fără sudură, din fier sau din oțel, originare din Rusia
    și Ucraina, în urma unei reexaminări în perspectiva expirării măsurilor
    în temeiul articolului 11 alineatul (2) din Regulamentul (CE) nr. 1225/2009,
    și de încheiere a procedurii de reexaminare în perspectiva expirării măsurilor
    privind importurile anumitor tuburi și țevi obținute fără sudură, din fier
    sau din oțel, originare din Croația
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 585/2012 z 26. júna 2012 , ktorým
    sa ukladá konečné antidumpingové clo na dovoz určitých bezšvových rúr
    a rúrok zo železa alebo z ocele s pôvodom v Rusku a na Ukrajine na základe
    preskúmania pred uplynutím platnosti podľa článku 11 ods. 2 nariadenia (ES)
    č. 1225/2009 a ktorým sa ukončuje konanie o preskúmaní pred uplynutím platnosti
    týkajúce sa dovozu určitých bezšvových rúr a rúrok zo železa alebo z
    ocele s pôvodom v Chorvátsku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 585/2012 z dne 26. junija 2012 o uvedbi
    dokončne protidampinške dajatve na uvoz nekaterih brezšivnih cevi iz železa
    ali jekla s poreklom iz Rusije in Ukrajine po pregledu zaradi izteka ukrepa v
    skladu s členom 11(2) Uredbe (ES) št. 1225/2009 ter o ustavitvi postopka pregleda
    zaradi izteka ukrepa glede uvoza nekaterih brezšivnih cevi iz železa ali jekla
    s poreklom iz Hrvaške
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 585/2012 del Consejo, de 26 de junio
    de 2012 , por el que se establece un derecho antidumping definitivo sobre las
    importaciones de determinados tubos sin soldadura, de hierro o acero, originarios
    de Rusia y Ucrania, a raíz de una reconsideración por expiración de conformidad
    con el artículo 11, apartado 2, del Reglamento (CE) n ° 1225/2009, y se da por
    concluido el procedimiento de reconsideración por expiración relativo a las
    importaciones de determinados tubos sin soldadura, de hierro o acero, originarios
    de Croacia
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 585/2012 av den 26 juni 2012 om
    införande av en slutgiltig antidumpningstull på import av vissa sömlösa rör
    av järn eller stål med ursprung i Ryssland och Ukraina, efter en översyn vid
    giltighetstidens utgång enligt artikel 11.2 i förordning (EG) nr 1225/2009 och
    om avslutande av översynen vid giltighetens utgång av import av vissa sömlösa
    rör av järn eller stål med ursprung i Kroatien
