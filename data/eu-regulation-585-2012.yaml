  script: Latn
  content: Provedbena uredba Vijeća (EU) br. 585/2012 od 26. lipnja 2012. o uvođenju
    konačne antidampinške pristojbe na uvoz određenih bešavnih cijevi od željeza
    ili čelika, podrijetlom iz Rusije i Ukrajine, nakon revizije nakon isteka mjere
    prema članku 11. stavku 2. Uredbe (EZ) br. 1225/2009, i prekidu revizije nakon
    isteka mjere vezane uz uvoz određenih bešavnih cijevi od željeza ili čelika
    podrijetlom iz Hrvatske
  type: main
