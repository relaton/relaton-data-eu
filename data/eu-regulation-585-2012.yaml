title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 585/2012 of 26 June 2012 imposing
    a definitive anti-dumping duty on imports of certain seamless pipes and tubes,
    of iron or steel, originating in Russia and Ukraine, following an expiry review
    pursuant to Article 11(2) of Regulation (EC) No 1225/2009, and terminating the
    expiry review proceeding concerning imports of certain seamless pipes and tubes,
    of iron or steel, originating in Croatia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 585/2012 du Conseil du 26 juin 2012
    instituant un droit antidumping définitif sur les importations de certains tubes
    et tuyaux sans soudure, en fer ou en acier, originaires de Russie et d’Ukraine,
    à la suite d’un réexamen au titre de l’expiration des mesures conformément
    à l’article 11, paragraphe 2, du règlement (CE) n ° 1225/2009 et clôturant
    la procédure de réexamen au titre de l’expiration des mesures concernant les
    importations de certains tubes et tuyaux sans soudure, en fer ou en acier, originaires
    de Croatie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 585/2012 des Rates vom 26. Juni 2012
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    nahtloser Rohre aus Eisen oder Stahl mit Ursprung in Russland und der Ukraine
    im Anschluss an eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der Verordnung
    (EG) Nr. 1225/2009 und zur Einstellung des Verfahrens der Auslaufüberprüfung
    betreffend die Einfuhren bestimmter nahtloser Rohre aus Eisen oder Stahl mit Ursprung
    in Kroatien
  type: main
- language: bg
  script: Cyrl
