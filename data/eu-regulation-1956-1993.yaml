title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1956/93 of 19 July 1993 re-establishing
    the levying of customs duties on products falling within CN code ex 8528, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1956/93 de la Commission du 19 juillet 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC ex 8528, originaires de Thaïlande, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1956/93 DER KOMMISSION vom 19. Juli 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes ex 8528 mit Ursprung in Thailand,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1956/93 af 19. juli 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode ex 8528 og med oprindelse
    i Thailand, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1956/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Ιουλίου 1993 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ ex 8528, καταγωγής Ταϊλάνδης, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1956/93 DELLA COMMISSIONE del 19 luglio 1993 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC ex 8528
    originari della Tailandia, beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1956/93 VAN DE COMMISSIE van 19 juli 1993 houdende
