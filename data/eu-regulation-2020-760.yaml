---
id: EURegulation2020760
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2020/760 of 17 December 2019 supplementing
    Regulation (EU) No 1308/2013 of the European Parliament and of the Council as
    regards the rules for the administration of import and export tariff quotas subject
    to licences and supplementing Regulation (EU) No 1306/2013 of the European Parliament
    and of the Council as regards the lodging of securities in the administration
    of tariff quotas
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2020/760 de la Commission du 17 décembre 2019
    complétant le règlement (UE) no 1308/2013 du Parlement européen et du Conseil
    en ce qui concerne les règles pour la gestion des contingents tarifaires d’importation
    et d’exportation soumis à des certificats et complétant le règlement (UE)
    no 1306/2013 du Parlement européen et du Conseil en ce qui concerne la constitution
    de garanties dans le cadre de la gestion des contingents tarifaires
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2020/760 der Kommission vom 17. Dezember 2019
    zur Ergänzung der Verordnung (EU) Nr. 1308/2013 des Europäischen Parlaments
    und des Rates hinsichtlich der Vorschriften für die Verwaltung von Einfuhr- und
    Ausfuhrzollkontingenten, für die eine Lizenzregelung gilt, sowie zur Ergänzung
    der Verordnung (EU) Nr. 1306/2013 des Europäischen Parlaments und des Rates hinsichtlich
    der Leistung von Sicherheiten im Rahmen der Verwaltung von Zollkontingenten
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2020/760 на Комисията
    от 17 декември 2019 година за допълнение на Регламент
    (ЕС) № 1308/2013 на Европейския парламент и на Съвета
    по отношение на правилата за управление на
    обвързаните с лицензии тарифни квоти за внос
    и за износ и за допълнение на Регламент (ЕС)
    № 1306/2013 на Европейския парламент и на Съвета
    по отношение на внасянето на обезпечения при
    управлението на тарифните квоти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2020/760 ze dne 17. prosince
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    1308/2013, pokud jde o pravidla pro správu dovozních a vývozních celních
    kvót podléhajících licencím, a nařízení Evropského parlamentu a Rady
    (EU) č. 1306/2013, pokud jde o složení jistoty v rámci správy celních kvót
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2020/760 af 17. december 2019
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 1308/2013
    for så vidt angår forvaltning af import- og eksporttoldkontingenter, for hvilke
    der gælder en licensordning, og supplerende regler til Europa-Parlamentets og
    Rådets forordning (EU) nr. 1306/2013 for så vidt angår sikkerhedsstillelse
    i forbindelse med forvaltning af toldkontingenter
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2020/760
    της Επιτροπής της 17ης Δεκεμβρίου 2019 για τη
    συμπλήρωση του κανονισμού (ΕΕ) αριθ. 1308/2013 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    όσον αφορά τους κανόνες διαχείρισης των δασμολογικών
    ποσοστώσεων εισαγωγής και εξαγωγής που υπόκεινται
    σε πιστοποιητικά και για τη συμπλήρωση του
    κανονισμού (ΕΕ) αριθ. 1306/2013 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά την κατάθεση
    εγγυήσεων κατά τη διαχείριση των δασμολογικών
    ποσοστώσεων
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2020/760, 17. detsember 2019, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 1308/2013 seoses
    impordi- ja eksporditariifikvootide litsentside alusel haldamise eeskirjadega
    ning täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 1306/2013
    seoses tariifikvootide haldamisel tagatiste esitamisega
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2020/760, annettu 17 päivänä joulukuuta
    2019, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 1308/2013 täydentämisestä
    todistusten alaisten tuonti- ja vientitariffikiintiöiden hallinnointia koskevien
    sääntöjen osalta ja Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 1306/2013
    täydentämisestä tariffikiintiöiden hallinnoinnin edellyttämien vakuuksien
    osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/760 оd 17. prosinca 2019. o dopuni
    Uredbe (EU) br. 1308/2013 Europskog parlamenta i Vijeća u pogledu pravila upravljanja
    uvoznim i izvoznim carinskim kvotama na temelju dozvola i o dopuni Uredbe (EU)
    br. 1306/2013 Europskog parlamenta i Vijeća u pogledu polaganja sredstava osiguranja
    u upravljanju carinskim kvotama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/760 felhatalmazáson alapuló rendelete (2019. december
    17.) az 1308/2013/EU európai parlamenti és tanácsi rendeletnek az engedélyhez
    kötött behozatali és kiviteli vámkontingensek kezelésére vonatkozó szabályok
    tekintetében történő kiegészítéséről, valamint az 1306/2013/EU európai
    parlamenti és tanácsi rendeletnek a vámkontingensek kezelésével összefüggésben
    letétbe helyezett biztosítékok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2020/760 della Commissione del 17 dicembre 2019
    che integra il regolamento (UE) n. 1308/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme di gestione dei contingenti tariffari di importazione
    e di esportazione soggetti a titoli e che integra il regolamento (UE) n. 1306/2013
    del Parlamento europeo e del Consiglio per quanto riguarda la costituzione di
    cauzioni nella gestione dei contingenti tariffari
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2020/760 (2019. gada 17. decembris),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 1308/2013 papildina attiecībā
    uz noteikumiem par to, kā pārvalda importa un eksporta tarifa kvotas, uz kurām
    attiecas licences, un Eiropas Parlamenta un Padomes Regulu (ES) Nr. 1306/2013
    papildina attiecībā uz nodrošinājumu iemaksāšanu tarifa kvotu pārvaldības
    kontekstā
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2020/760 2019 m. gruodžio 17 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 1308/2013 papildomas
    licencinių importo ir eksporto tarifinių kvotų administravimo taisyklėmis,
    o Europos Parlamento ir Tarybos reglamentas (ES) Nr. 1306/2013 papildomas nuostatomis
    dėl užstato teikimo administruojant tarifines kvotas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2020/760 tas-17 ta’ Diċembru
    2019 li jissupplimenta r-Regolament (UE) Nru 1308/2013 tal-Parlament Ewropew u
    tal-Kunsill fir-rigward tar-regoli għall-amministrazzjoni tal-kwoti tariffarji
    tal-importazzjoni u l-esportazzjoni soġġetti għal liċenzji u li jissupplimenta
    r-Regolament (UE) Nru 1306/2013 tal-Parlament Ewropew u tal-Kunsill fir-rigward
    tad-depożitu ta’ garanziji fl-amministrazzjoni tal-kwoti tariffarji
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2020/760 van de Commissie van 17 december
    2019 tot aanvulling van Verordening (EU) nr. 1308/2013 van het Europees Parlement
    en de Raad wat betreft de voorschriften voor het beheer van tariefcontingenten
    voor invoer en uitvoer waarvoor een certificaat verplicht is, en tot aanvulling
    van Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft
    het stellen van zekerheden bij het beheer van tariefcontingenten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2020/760 z dnia 17 grudnia 2019
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1308/2013
    w odniesieniu do zasad administrowania kontyngentami taryfowymi na przywóz i
    wywóz podlegającymi systemowi pozwoleń oraz uzupełniające rozporządzenie
    Parlamentu Europejskiego i Rady (UE) nr 1306/2013 w odniesieniu do wnoszenia zabezpieczeń
    w ramach administrowania kontyngentami taryfowymi
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2020/760 da Comissão de 17 de dezembro de 2019
    que complementa o Regulamento (UE) n.o 1308/2013 do Parlamento Europeu e do Conselho
    no respeitante às normas de gestão dos contingentes pautais de importação
    e de exportação sujeitos a certificados e que complementa o Regulamento (UE)
    n.o 1306/2013 do Parlamento Europeu e do Conselho no respeitante à constituição
    de garantias no âmbito da gestão de contingentes pautais
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2020/760 al Comisiei din 17 decembrie 2019 de
    completare a Regulamentului (UE) nr. 1308/2013 al Parlamentului European și al
    Consiliului în ceea ce privește normele referitoare la gestionarea contingentelor
    tarifare de import și de export care fac obiectul licențelor și de completare
    a Regulamentului (UE) nr. 1306/2013 al Parlamentului European și al Consiliului
    în ceea ce privește constituirea garanțiilor în cadrul gestionării contingentelor
    tarifare
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2020/760 zo 17. decembra 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 1308/2013, pokiaľ
    ide o pravidlá správy dovozných a vývozných colných kvót, ktoré podliehajú
    licenciám, a ktorým sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ)
    č. 1306/2013, pokiaľ ide o zloženie zábezpeky pri správe colných kvót
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/760 z dne 17. decembra 2019 o dopolnitvi
    Uredbe (EU) št. 1308/2013 Evropskega parlamenta in Sveta glede pravil za upravljanje
    uvoznih in izvoznih tarifnih kvot, za katere so potrebna dovoljenja, ter dopolnitvi
    Uredbe (EU) št. 1306/2013 Evropskega parlamenta in Sveta glede položitve varščin
    pri upravljanju tarifnih kvot
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2020/760 de la Comisión de 17 de diciembre de
    2019 por el que se completa el Reglamento (UE) n.o 1308/2013 del Parlamento Europeo
    y del Consejo en cuanto a las normas de administración de los contingentes arancelarios
    de importación y de exportación sujetos a certificados y se completa el Reglamento
    (UE) n.o 1306/2013 del Parlamento Europeo y del Consejo en cuanto a la constitución
    de garantías para la administración de los contingentes arancelarios
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2020/760 av den 17 december 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 1308/2013
    vad gäller reglerna för förvaltningen av import- och exporttullkvoter som omfattas
    av licenser och om komplettering av Europaparlamentets och rådets förordning
    (EU) nr 1306/2013 vad gäller ställande av säkerheter vid förvaltningen av
    tullkvoter
  type: main
