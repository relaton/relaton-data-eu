    sowie der Produktionsbeihilfe für getrocknete Feigen im Wirtschaftsjahr 1989/90
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1959/89 af 30. juni 1989 om fastsættelse
    af den minimumspris, der skal betales producenten for uforarbejdede tørrede figner,
    samt af producentstøtten for tørrede figner i produktionsåret 1988/89
  type: main
- language: el
  script: Grek
