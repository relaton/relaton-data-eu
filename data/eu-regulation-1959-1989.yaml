  content: Commission Regulation (EEC) No 1959/89 of 30 June 1989 fixing for the 1989/90
    marketing year the minimum price to be paid to producers for unprocessed dried
    figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1959/89 de la Commission du 30 juin 1989 fixant, pour
    la campagne 1989/1990, le prix minimal à payer aux producteurs pour les figues
    sèches non transformées ainsi que le montant de l'aide à la production pour
    les figues sèches
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1959/89 DER KOMMISSION vom 30. Juni 1989 zur Festsetzung
