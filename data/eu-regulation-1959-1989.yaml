    για την περίοδο εμπορίας 1989/90, της ελάχιστης
    τιμής που καταβάλλεται στους παραγωγούς για
    τα μη μεταποιημένα ξηρά σύκα και του ποσού
    ενίσχυσης στην παραγωγή για τα ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1959/89 DELLA COMMISSIONE del 30 giugno 1989 che
