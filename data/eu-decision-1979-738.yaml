title:
- language: en
  script: Latn
  content: '79/738/EEC: Commission Decision of 2 August 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1977 on aids relating to the provision of socio-economic guidance for and
    the acquisition of occupational skills by persons engaged in agriculture (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/738/CEE: Décision de la Commission, du 2 août 1979, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    au Royaume-Uni, des dépenses effectuées pendant l''année 1977 pour les aides
    relatives à l''information socio-économique et à la qualification professionnelle
    des personnes travaillant dans l''agriculture (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/738/EWG: Entscheidung der Kommission vom 2. August 1979 über die Rückvergütung
    der im Jahr 1977 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben durch den EAGFL,
    Abteilung Ausrichtung, an das Vereinigte Königreich (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/738/EØF: Kommissionens beslutning af 2. august 1979 om refusion gennem
    EUGFL, udviklingssektionen, til Det forenede Kongerige af de udgifter, som er
    afholdt i løbet af året 1977 til støtte vedrørende social og erhvervsmæssig
    vejledning og kvalifikationer hos de personer, som arbejder i landbruget (Kun
    den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/738/CEE: Decisione della Commissione, del 2 agosto 1979, relativa al
