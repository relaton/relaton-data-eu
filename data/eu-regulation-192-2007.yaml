    с произход от Индия, Индонезия, Малайзия, Република
    Корея, Тайланд и Тайван, изготвено след провеждането
    на преразглеждане с оглед изтичане срока на
    действие на съществуващите мерки и частично
    междинно преразглеждане съгласно член 11, параграф
    2 и член 11, параграф 3 от Регламент (EО) № 384/96
  type: main
