    i članku 11. stavku 3. Uredbe (EZ) br. 384/96
  type: main
- language: hu
  script: Latn
  content: A Tanács 192/2007/EK rendelete ( 2007. február 22. ) az Indiából, Indonéziából,
    Malajziából, a Koreai Köztársaságból, Thaiföldről és Tajvanból származó
    egyes polietilén-tereftalátok behozatalára vonatkozó, a 384/96/EK rendelet
    11. cikkének (2) bekezdése, illetve 11. cikkének (3) bekezdése szerinti hatályvesztési
    felülvizsgálatot, illetve részleges időközi felülvizsgálatot követő végleges
    dömpingellenes vám kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 192/2007 del Consiglio, del 22 febbraio 2007 , che
    impone un dazio antidumping definitivo alle importazioni di alcuni tipi di polietilentereftalato
    originario dell’India, dell’Indonesia, della Malaysia, della Repubblica di
    Corea, della Thailandia e di Taiwan a seguito di un riesame in previsione della
    scadenza e di un riesame intermedio parziale ai sensi dell’articolo 11, paragrafi
    2 e 3, del regolamento (CE) n. 384/96
  type: main
- language: lv
