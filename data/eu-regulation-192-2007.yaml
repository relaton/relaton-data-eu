title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 192/2007 of 22 February 2007 imposing a definitive
    anti-dumping duty on imports of certain polyethylene terephthalate originating
    in India, Indonesia, Malaysia, the Republic of Korea, Thailand and Taiwan following
    an expiry review and a partial interim review pursuant to Article 11(2) and Article
    11(3) of Regulation (EC) No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 192/2007 du Conseil du 22 février 2007 instituant
    un droit antidumping définitif sur les importations de certains types de polyéthylène
    téréphtalate originaires de l’Inde, d’Indonésie, de Malaisie, de la République
    de Corée, de Thaïlande et de Taïwan à la suite d’un réexamen au titre de
    l’expiration des mesures et d’un réexamen intermédiaire partiel conformément
    à l’article 11, paragraphes 2 et 3, du règlement (CE) n o 384/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 192/2007 des Rates vom 22. Februar 2007 zur Einführung
    eines endgültigen Antidumpingzolls auf Einfuhren bestimmter Polyethylenterephthalate
    mit Ursprung in Indien, Indonesien, Malaysia, der Republik Korea, Thailand und
    Taiwan nach Durchführung einer Überprüfung wegen bevorstehenden Außerkrafttretens
    und einer teilweisen Interimsüberprüfung gemäß Artikel 11 Absätze 2 und 3
    der Verordnung (EG) Nr. 384/96
  type: main
- language: bg
  script: Cyrl
