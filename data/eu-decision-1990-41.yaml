  script: Latn
  content: '90/41/EEC: Council Decision of 22 January 1990 on the conclusion of an
    Agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol establishing, for the period from 1 January 1990 to 31 December
    1991, the fishing opportunities and the financial contribution provided for in
    the Agreement between the European Economic Community and the Government of the
    People''s Republic of Mozambique on fisheries relations'
  type: main
- language: fr
  script: Latn
  content: '90/41/CEE: Décision du Conseil du 22 janvier 1990 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant, pour la période du 1er janvier 1990 au 31 décembre 1991,
    les possibilités de pêche et la compensation financière prévues dans l''accord
    entre la Communauté économique européenne et le gouvernement de la République
    populaire du Mozambique concernant les relations de pêche'
  type: main
- language: de
  script: Latn
