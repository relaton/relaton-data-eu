  script: Latn
  content: '2002/372/EC: Commission Decision of 17 May 2002 amending Decision 1999/815/EC
    concerning measures prohibiting the placing on the market of toys and childcare
    articles intended to be placed in the mouth by children under three years of age
    made of soft PVC containing certain phthalates (Text with EEA relevance) (notified
    under document number C(2002) 1869)'
  type: main
- language: fr
  script: Latn
  content: '2002/372/CE: Décision de la Commission du 17 mai 2002 modifiant la décision
    1999/815/CE concernant des mesures qui interdisent la mise sur le marché de jouets
    et d''articles de puériculture destinés à être mis en bouche par des enfants
    de moins de trois ans, fabriqués en PVC souple contenant certains phtalates (Texte
    présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2002) 1869]'
  type: main
