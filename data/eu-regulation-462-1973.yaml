  content: Regulation (EEC) No 462/73 of the Commission of 31 January 1973 amending
    Annex III to Regulation (EEC) No 979/72 as regards the compensatory amounts to
    be applied, as a result of events in the monetary field, in respect of certain
    beef and veal products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 462/73 de la Commission, du 31 janvier 1973, modifiant
    l'annexe III du règlement n 979/72 en ce qui concerne les montants compensatoires
    applicables, à la suite des événements monétaires, pour certains produits
    du secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 462/72 der Kommission vom 31. Januar 1973 zur Änderung
