    die im Anschluß an die Währungsereignisse für bestimmte Erzeugnisse des Rindfleischsektors
    anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 462/73 af 31. januar 1973 om ændring
