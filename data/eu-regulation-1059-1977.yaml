title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1059/77 of 18 May 1977 re-establishing the
    levying of the customs duties on other kinds of leather, other, falling within
    subheading 41.05 B II, originating in Yugoslavia to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1059/77 de la Commission, du 18 mai 1977 , portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    préparées d'autres animaux, non dénommées, de la sous-position tarifaire 41.05
    B II, originaires de la Yougoslavie bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1059/77 der Kommission vom 18. Mai 1977 zur Wiedereinführung
    des Zollsatzes für anderes Leder aus Häuten oder Fellen von anderen Tieren,
    der Tarifstelle 41.05 B II, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1059/77 af 18. maj 1977 om genindførelse
    af opkrævning af toldafgifter for læder af andre dyrehuder og dyreskind, andre
    varer, under underposition 41.05 B II, som har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1059/77 della Commissione, del 18 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli preparate
    di altri animali, non nominate, della sottovoce doganale 41.05 B II, originarie
    della Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1059/77 van de Commissie van 18 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op ander leder
    en voorgelooide huiden en vellen, overige, van post 41.05 B II, van oorsprong
    uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
