title:
- language: fr
  script: Latn
  content: '66/695/CEE: Décision de la Commission, du 4 novembre 1966, autorisant
    la République française, en vertu de l''article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire certains produits originaires de l''URSS et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '66/695/EWG: Entscheidung der Kommission vom 4. November 1966, mit der
    die Französische Republik auf Grund von Artikel 115 Absatz (1) des Vertrages
    ermächtigt wird, bestimmte aus der UdSSR stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Erzeugnisse von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/695/CEE: Decisione della Commissione, del 4 novembre 1966, che autorizza
    la Repubblica francese, a norma dell''articolo 115, primo comma, del Trattato,
    ad escludere dal trattamento comunitario taluni prodotti originari dell''Unione
    Sovietica ed immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/695/EEG: Beschikking van de Commissie van 4 november 1966 houdende
    machtiging van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit de USSR en in de
    andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
