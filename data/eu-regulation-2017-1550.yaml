title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2017/1550 of 14 July 2017 adding an
    Annex to Regulation (EU) 2016/1076 of the European Parliament and of the Council
    applying the arrangements for products originating in certain states which are
    part of the African, Caribbean and Pacific (ACP) Group of States provided for
    in agreements establishing, or leading to the establishment of, Economic Partnership
    Agreements
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/1550 de la Commission du 14 juillet 2017
    ajoutant une annexe au règlement (UE) 2016/1076 appliquant aux produits originaires
    de certains États appartenant au groupe des États d'Afrique, des Caraïbes et
    du Pacifique (ACP) les régimes prévus dans les accords établissant ou conduisant
    à établir des accords de partenariats économiques
  type: main
- language: de
  script: Latn
