    e del Consiglio recante applicazione dei regimi per prodotti originari di alcuni
    Stati appartenenti al gruppo degli Stati dell'Africa, dei Caraibi e del Pacifico
    (ACP) previsti in accordi che istituiscono, o portano a istituire, accordi di
    partenariato economico
  type: main
- language: lv
  script: Latn
