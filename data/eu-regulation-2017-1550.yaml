    Grupo de Estados de África, das Caraíbas e do Pacífico (ACP) os regimes previstos
    em acordos que estabelecem ou conduzem ao estabelecimento de acordos de parceria
    económica
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2017/1550 al Comisiei din 14 iulie 2017 de adăugare
    a unei anexe la Regulamentul (UE) 2016/1076 al Parlamentului European și al Consiliului
    privind aplicarea la produsele originare din anumite state care fac parte din
    grupul statelor din Africa, zona Caraibilor și Pacific (ACP) a regimurilor prevăzute
    în acordurile privind stabilirea sau care conduc la stabilirea acordurilor de
    parteneriat economic
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2017/1550 zo 14. júla 2017, ktorým
    sa dopĺňa príloha v nariadení Európskeho parlamentu a Rady (EÚ) 2016/1076,
    ktorým sa uplatňujú opatrenia na výrobky s pôvodom v určitých štátoch,
    ktoré sú súčasťou skupiny afrických, karibských a tichomorských (AKT)
    štátov, stanovené v dohodách, ktorými sa uzatvárajú alebo ktoré vedú
    k uzatvoreniu dohôd o hospodárskom partnerstve
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/1550 z dne 14. julija 2017 o vključitvi
