  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2017/1550 av den 14 juli 2017
    om tillägg av en bilaga till Europaparlamentets och rådets förordning (EU)
    2016/1076 om tillämpning av de ordningar som ska tillämpas på produkter med
    ursprung i vissa stater som ingår i gruppen av stater i Afrika, Västindien och
