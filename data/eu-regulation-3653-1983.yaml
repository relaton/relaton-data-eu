  script: Latn
  content: Commission Regulation (EEC) No 3653/83 of 15 December 1983 amending the
    Annex to Regulation (EEC) No 1687/76 laying down common detailed rules for verifying
    the use and/or destination of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3653/83 de la Commission du 15 décembre 1983 portant
    modification de l' annexe du règlement (CEE) no 1687/76 établissant les modalités
    communes de contrôle de l' utilisation et/ou de la destination des produits provenant
    de l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3653/83 der Kommission vom 15. Dezember 1983 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 1687/76 zur Festlegung der gemeinsamen Durchführungsbestimmungen
    für die Überwachung der Verwendung und/oder Bestimmung von Erzeugnissen aus
    den Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3653/83 af 15. december 1983 om ændring
    af bilaget til forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser
    for kontrol med anvendelse af og/eller bestemmelse for produkter fra intervention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3653/83 της Επιτροπής
    της 15ης Δεκεμβρίου 1983 περί τροποποιήσεως του
    παραρτήματος του κανονισμού (ΕΟΚ) αριθ. 1687/76
    περί καθορισμού κοινών λεπτομερειών ελέγχου
    της χρησιμοποιήσεως ή/και του προορισμού των
    προϊόντων που προέρχονται από την παρέμβαση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3653/83 della Commissione del 15 dicembre 1983 che
    modifica l' allegato del regolamento (CEE) n. 1687/76 che stabilisce modalità
    comuni di controllo dell' utilizzazione e/o della destinazione dei prodotti provenienti
    dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3653/83 van de Commissie van 15 december 1983 houdende
    wijziging van de bijlage bij Verordening (EEG) nr. 1687/76 tot vaststelling van
    gemeenschappelijke bepalingen inzake de controle op het gebruik en/of de bestemming
    van produkten uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3653/83 da Comissão, de 15 de Dezembro de 1983,
    que modifica o anexo do Regulamento (CEE) n.° 1687/76 relativo às modalidades
    comuns de controlo da utilização e/ou do destino dos produtos provenientes da
    intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3653/83 de la Comisión, de 15 de diciembre de 1983,
    por el que se modifica el Anexo del Reglamento (CEE) n° 1687/76 por el que se
    establecen las modalidades comunes de control de la utilización y/o el destino
    de los productos procedentes de la intervención
  type: main
