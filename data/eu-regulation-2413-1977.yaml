title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2413/77 of 31 October 1977 amending Regulation
    (EEC) No 3188/76 on rules for the implementation of the special measures for the
    determination of offers of olive oil on the world market and on the Greek market
    and Regulation (EEC) No 205/73 on communications between Member States and the
    Commission concerning oils and fats
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2413/77 de la Commission, du 31 octobre 1977, modifiant
    le règlement (CEE) n° 3188/76 relatif aux modalités d' application des mesures
    particulières, notamment pour la détermination des offres d' huile d' olive
    sur le marché mondial et le marché hellénique, et le règlement (CEE) n° 205/73
    relatif aux communications entre les États membres et la Commission dans le secteur
    des matières grasses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2413/77 der Kommission vom 31. Oktober 1977 zur Änderung
    der Verordnung (EWG) Nr. 3188/76 über Durchführungsbestimmungen für die Sondermaßnahmen
    zur Ermittlung der Angebote von Olivenöl auf dem Weltmarkt und auf dem griechischen
    Markt und der Verordnung (EWG) Nr. 205/73 über die Mitteilungen der Mitgliedstaaten
    an die Kommission im Fettsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2413/77 af 31. oktober 1977 om ændring
    af forordning (EØF) nr. 3188/76 om gennemførelsesbestemmelser for visse særlige
    foranstaltninger, især vedrørende bestemmelse af udbudet af olivenolie på verdensmarkedet
    og på det græske marked, og forordning (EØF) nr. 205/73 om meddelelser mellem
    medlemsstaterne og Kommissionen inden for fedtstofsektoren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2413/77 della Commissione, del 31 ottobre 1977, che
    modifica il regolamento (CEE) n. 3188/76 relativo alle modalità di applicazione
    delle misure particolari segnatamente per la determinazione delle offerte di olio
    d' oliva sul mercato mondiale e sul mercato ellenico, nonché il regolamento (CEE)
    n. 205/73 relativo alle comunicazioni tra gli Stati membri e la Commissione nel
    settore dei grassi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2413/77 van de Commissie van 31 oktober 1977 tot
    wijziging van Verordening (EEG) nr. 3188/76 houdende uitvoeringsbepalingen betreffende
    de bijzondere maatregelen met name voor het bepalen van aanbiedingen van olijfolie
    op de wereldmarkt en op de Griekse markt en van Verordening (EEG) nr. 205/73 betreffende
    de mededelingen tussen de Lid-Staten en de Commissie in de sector oliën en vetten
  type: main
