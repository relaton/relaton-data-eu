title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2046/75 of the Commission of 25 July 1975 on special
    detailed rules for the application of the system of advance fixing certificates
    for products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2046/75 de la Commission, du 25 juillet 1975, portant
    modalités particulières d'application du régime des certificats de préfixation
    dans le secteur des produits transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2046/75 der Kommission vom 25. Juli 1975 über besondere
    Durchführungsvorschriften für Vorausfestsetzungsbescheinigungen für Verarbeitungserzeugnisse
    aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2046/75 af 25. juli 1975 om de særlige
    gennemførelsesbestemmelser for ordningen med forudfastsættelsesattester for
    produkter forarbejdet på basis af frugt og grønsager
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2046/75 della Commissione, del 25 luglio 1975, che
    stabilisce le modalità particolari di applicazione del regime dei titoli di fissazione
    anticipata nel settore dei prodotti trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2046/75 van de Commissie van 25 juli 1975 houdende
    bijzondere uitvoeringsbepalingen inzake het stelsel van voorfixatiecertificaten
    in de sector van op basis van groenten en fruit verwerkte produkten
  type: main
