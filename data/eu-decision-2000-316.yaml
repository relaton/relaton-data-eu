    da República Popular da China e de Taiwan, de garfos de bicicletas, originários
    da República Popular da China e de Taiwan, e de rodas completas de bicicletas,
    originárias da República Popular da China, bem como o reexame intercalar do
    alargamento das medidas anti-dumping às importações de, nomeadamente, quadros
    de bicicleta, garfos de bicicleta e rodas completas de bicicleta originários
    da República Popular da China [notificada com o número C(2000) 1010]'
  type: main
