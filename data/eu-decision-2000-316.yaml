    China und Taiwan und von vollständigen Fahrradrädern mit Ursprung in der Volksrepublik
    China sowie der Interimsüberprüfung der unter anderem auf die Einfuhren von
    Fahrradrahmen, Fahrradgabeln und vollständigen Fahrradrädern mit Ursprung in
    der Volksrepublik China ausgeweiteten Antidumpingmaßnahmen (Bekanntgegeben unter
    Aktenzeichen K(2000) 1010)'
