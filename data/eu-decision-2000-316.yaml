title:
- language: en
  script: Latn
  content: '2000/316/EC: Commission Decision of 2 May 2000 terminating the anti-dumping
    proceedings concerning imports of bicycle frames originating in the People''s
    Republic of China and Taiwan, bicycle forks originating in the People''s Republic
    of China and Taiwan and complete wheels of bicycles originating in the People''s
    Republic of China, as well as the interim review of the anti-dumping measures
    extended to imports of, inter alia, bicycle frames, bicycle forks and complete
    wheels of bicycles originating in the People''s Republic of China (notified under
    document number C(2000) 1010)'
  type: main
- language: fr
  script: Latn
  content: '2000/316/CE: Décision de la Commission, du 2 mai 2000, clôturant les
    procédures antidumping concernant les importations de cadres de bicyclettes originaires
    de la République populaire de Chine et de Taïwan, de fourches de bicyclettes
    originaires de la République populaire de Chine et de Taïwan et de roues complètes
    de bicyclettes originaires de la République populaire de Chine, ainsi que le
    réexamen intermédiaire des mesures antidumping étendues aux importations, entre
    autres, de cadres, de fourches et de roues complètes de bicyclettes originaires
    de la République populaire de Chine [notifiée sous le numéro C(2000) 1010]'
  type: main
- language: de
