title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 679/80 of 18 March 1980 laying down certain
    interim measures for the conservation and management of fishery resources off
    the West Greenland coast applicable to vessels flying the flag of Canada or under
    charter to companies registered in Canada
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 679/80 du Conseil, du 18 mars 1980, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche au
    large de la côte occidentale du Groenland applicables aux navires battant pavillon
    du Canada ou affrétés par des sociétés enregistrées au Canada
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 679/80 des Rates vom 18. März 1980 zur Festlegung
    bestimmter Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    vor der Westküste Grönlands gegenüber Schiffen unter kanadischer Flagge oder
    unter Chartervertrag mit in Kanada registrierten Gesellschaften
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 679/80 af 18. marts 1980 om fastsættelse
    af visse midlertidige foranstaltninger til bevaring og forvaltning af fiskeressourcerne
    ud for Grønlands vestkyst, som skal finde anvendelse på fartøjer, der fører
    canadisk flag, eller som er chartret af selskaber registreret i Canada
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 679/80 del Consiglio, del 18 marzo 1980, che stabilisce
    talune misure provvisorie di conservazione e di gestione delle risorse di pesca
    al largo delle coste occidentali della Groenlandia, applicabili alle navi battenti
    bandiera del Canada o noleggiate da società registrate in Canada
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 679/80 van de Raad van 18 maart 1980 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden voor de kust van West-Groenland, die van toepassing zijn op vaartuigen
    die de vlag van Canada voeren of die zijn gecharterd door in Canada geregistreerde
    rederijen
  type: main
