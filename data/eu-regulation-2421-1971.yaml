title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2421/71 de la Commission, du 10 novembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à certains textiles des positions tarifaires 61.01 et ex 61.03, originaires des
    pays en voie de développement, bénéficiaires de préférences tarifaires prévues
    par le règlement (CEE) n 1311/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2421/71 der Kommission vom 10. November 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für bestimmte
    Textilerzeugnisse der Tarifnummern 61.01 und ex 61.03 mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 1311/71 des Rates vom 21. Juni 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2421/71 della Commissione, del 10 novembre 1971, relativo
    al ripristino della riscossione dei dazi della tariffa doganale comune applicabili
    a taluni prodotti tessili delle voci doganali nn. 61.01 e ex 61.03 originari dei
    paesi in via sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1311/71 del Consiglio del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2421/71 van de Commissie van 10 november 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op bepaalde textielprodukten van tariefposten 61.01 en ex 61.03,
    van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG)
    nr. 1311/71 van de Raad van 21 juni 1971 algemene tariefpreferenties werden geopend
  type: main
