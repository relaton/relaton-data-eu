    part, et la Colombie, le Pérou et l’Équateur, d’autre part, en ce qui concerne
    les modifications des décisions no 1/2014, no 2/2014, no 3/2014, no 4/2014 et
    no 5/2014 du comité «Commerce» afin de tenir compte de l’adhésion de l’Équateur
    à l’accord commercial et de mettre à jour les listes d’arbitres et d’experts
