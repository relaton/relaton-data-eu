title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1099/2002 of 24 June 2002 determining the
    extent to which applications lodged in June 2002 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1099/2002 de la Commission du 24 juin 2002 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juin 2002 pour certains produits du secteur des œufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1099/2002 der Kommission vom 24. Juni 2002 über die
    Festsetzung des Umfangs, in dem die im Juni 2002 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1099/2002 af 24. juni 2002 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juni
    2002 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1099/2002 της Επιτροπής,
    της 24ης Ιουνίου 2002, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Ιούνιο του 2002 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 1474/95 και (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1099/2002, annettu 24 päivänä kesäkuuta 2002,
    määrättyyn järjestelmään liittyvien kesäkuussa 2002 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1099/2002 della Commissione, del 24 giugno 2002, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di giugno 2002 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1099/2002 van de Commissie van 24 juni 2002 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sectoren eieren en slachtpluimvee, die in juni 2002
    worden ingediend op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr. 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1099/2002 da Comissão, de 24 de Junho de 2002, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Junho de 2002 ao abrigo dos Regulamentos (CE) n.° 1474/95 e (CE) n.° 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1099/2002 de la Comisión, de 24 de junio de 2002,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de los huevos y de
    la carne de aves de corral presentadas en el mes de junio de 2002 al amparo de
    los Reglamentos (CE) n° 1474/95 y (CE) n° 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1099/2002 av den 24 juni 2002 om fastställande
    av i vilken utsträckning de ansökningar om importlicens för vissa äggprodukter
    samt fjäderfäkött som ges in under juni 2002 inom ramen för förordningarna
    (EG) nr 1474/95 och (EG) nr 1251/96 kan godtas
  type: main
