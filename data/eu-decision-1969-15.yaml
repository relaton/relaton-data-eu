title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 décembre 1968, autorisant la République
    française, en vertu de l'article 115 alinéa 1 du Traité CEE, à exclure du
    traitement communautaire les "canifs" de la position Ex 82.09 du TDC, originaires
    du Japon et mis en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '69/15/EWG: Entscheidung der Kommission vom 18. Dezember 1968, mit der
    die Französische Republik nach Artikel 115 Absatz 1 des EWG-Vertrags ermächtigt
    wird, aus Japan stammende "Federmesser" der Tarifnummer ex 82.09 des Gemeinsamen
    Zolltarifs, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/15/CEE: Decisione della Commissione, del 18 dicembre 1968, che autorizza
    la Repubblica francese a norma dell''articolo 115, comma 1, del trattato CEE ad
    escludere dal trattamento comunitario i «temperini» della voce ex 82.09 della
    tariffa doganale comune, provenienti dal Giappone e messi in libera pratica in
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/15/EEG: Beschikking van de Commissie van 18 december 1968 houdende
    machtiging van de Franse Republiek om, op grond van artikel 115, eerste alinea,
    van het Verdrag, "pennemessen" van post ex 82.09 van het G.D.T., die van oorsprong
    zijn uit Japan en in andere Lid-Staten in het vrije verkeer zijn gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
