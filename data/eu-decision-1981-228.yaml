title:
- language: en
  script: Latn
  content: '81/228/EEC: Commission Decision of 20 March 1981 authorizing the French
    Republic not to apply Community treatment to women''s, girls''and infants''(other
    than babies'') woven and knitted or crocheted dresses originating in Hong Kong
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/228/CEE: Décision de la Commission, du 20 mars 1981,autorisant la
    République française à exclure du traitement communautaire les robes tissées
    et robes de bonneterie pour femmes, fillettes et jeunes enfants (autres que bébés),
    originaires de Hong-kong (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/228/EWG: Entscheidung der Kommission vom 20. März 1981 zur Ermächtigung
    der Französischen Republik, aus Hongkong stammende Kleider aus Geweben und aus
    Gewirken, für Frauem, Mädchen und Kleinkinder (ausgenommen Säuglinge) von der
    Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/228/EØF: Kommissionens beslutning af 20. marts 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede kjoler
    og kjoler af trikotage til kvinder, piger og småbørn (bortset fra spædbørn)
    med oprindelse i Hongkong (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/228/ΕΟΚ: Απόφαση τής Επιτροπής τής 20ής
    Μαρτίου 1981 περί εξουσιοδοτήσεως τής Γαλλικής
    Δημοκρατίας νά αποκλείσει από τήν κοινοτική
    μεταχείριση τά υφασμένα φορέματα καί τά πλεκτά
    φορέματα γυναικών, κορασίδων καί μικρών παιδίων
    (έτερα εκείνων τών βρεφών) καταγόμενα από τό
    Χόνγκ Κόνγκ (Το κείμενο στην γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/228/CEE: Decisione della Commissione, del 20 marzo 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli abiti interi
    tessuti ed a maglia originari di Hong Kong (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/228/EEG: Beschikking van de Commissie van 20 maart 1981 houdende machtiging
