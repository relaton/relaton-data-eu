title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1556/98 of 17 July 1998 imposing a provisional
    countervailing duty on imports of stainless steel bars originating in India and
    amending Regulation (EC) No 1084/98 imposing a provisional anti-dumping duty on
    imports of stainless steel bars originating in India
  type: main
- language: fr
  script: Latn
