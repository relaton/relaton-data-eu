    modifica dell'articolo 3 del regolamento (CEE) n. 207/93 che definisce il contenuto
    dell'allegato VI del regolamento (CEE) n. 2092/91 del Consiglio relativo al metodo
    di produzione biologico di prodotti agricoli e all'indicazione di tale metodo
