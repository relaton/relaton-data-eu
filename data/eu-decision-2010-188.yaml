  script: Latn
  content: '2010/188/: Commission Decision of 29 March 2010 amending Annex III to
    Decision 2003/467/EC as regards the declaration that certain administrative regions
    of Poland and Portugal are officially free of enzootic bovine leukosis (notified
    under document C(2010) 1912)'
  type: main
- language: fr
  script: Latn
