title:
- language: en
  script: Latn
  content: '93/395/EEC: Commission Decision of 8 July 1993 calling upon the Italian
    Republic to postpone the adoption of its draft regulations in respect of the labelling
    of foodstuffs and infant formulae packaged under a modified atmosphere (Only the
    Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/395/CEE: Décision de la Commission du 8 juillet 1993 invitant la République
    italienne à surseoir à l''adoption de ses projets de règlements concernant
    l''étiquetage des denrées alimentaires et des préparations pour nourrissons
    conditionnées sous atmosphère modifiée (Le texte en italien est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '93/395/EWG: ENTSCHEIDUNG DER KOMMISSION vom 8. Juli 1993 mit der Aufforderung
    an die Italienische Republik, die Verabschiedung ihrer Entwürfe von Verordnungen
    über die Kennzeichnung schutzgasverpackter Lebensmittel und Zubereitungen für
    Säuglinge zurückzustellen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/395/EØF: KOMMISSIONENS BESLUTNING af 8. juli 1993 om at opfordre Den
    Italienske Republik til at udsætte vedtagelse af sine udkast til bestemmelser
    om mærkning af levnedsmidler og modermælkserstatninger, der er færdigpakket
    i modificeret atmosfære (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/395/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 8ης Ιουλίου
    1993 με την οποία καλείται η Ιταλική Δημοκρατία
    να αναβάλει την έγκριση των σχεδίων κανονισμών
    σχετικά με την επισήμανση των τροφίμων και
    των παρασκευασμάτων για βρέφη που είναι συσκευασμένα
    υπό τροποποιημένη ατμόσφαιρα (Το κείμενο στην
