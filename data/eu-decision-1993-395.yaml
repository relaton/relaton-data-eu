    concernenti l'' etichettatura dei prodotti alimentari e dei preparati per lattanti
    condizionati in atmosfera modificata (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '93/395/EEG: BESCHIKKING VAN DE COMMISSIE van 8 juli 1993 houdende verzoek
