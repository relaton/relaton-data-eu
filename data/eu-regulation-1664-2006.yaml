---
id: EURegulation16642006
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1664/2006 of 6 November 2006 amending Regulation
    (EC) No 2074/2005 as regards implementing measures for certain products of animal
    origin intended for human consumption and repealing certain implementing measures
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1664/2006 de la Commission du 6 novembre 2006 modifiant
    le règlement (CE) n o 2074/2005 en ce qui concerne les mesures d'application
    relatives à certains produits d'origine animale destinés à la consommation
    humaine et abrogeant certaines mesures d'application
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1664/2006 der Kommission vom 6. November 2006 zur Änderung
    der Verordnung (EG) Nr. 2074/2005 hinsichtlich der Durchführungsmaßnahmen für
    gewisse zum Verzehr bestimmte Erzeugnisse tierischen Ursprungs und zur Aufhebung
    bestimmter Durchführungsmaßnahmen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EО) № 1664/2006 на Комисията от 6 ноември
    2006 година за изменение на Регламент (EО) № 2074/2005
    по отношение на мерки за прилагане за някои
    продукти от животински произход, предназначени
    за консумация от човека, и за отмяна на някои
    мерки за прилагане
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1664/2006 ze dne 6. listopadu 2006 , kterým
    se mění nařízení (ES) č. 2074/2005, pokud jde o prováděcí opatření
    pro některé produkty živočišného původu určené k lidské spotřebě,
    a zrušují některá prováděcí opatření
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1664/2006 af 6. november 2006 om ændring
    af forordning (EF) nr. 2074/2005 for så vidt angår gennemførelsesbestemmelser
    vedrørende visse animalske produkter bestemt til konsum og om ophævelse af visse
    gennemførelsesbestemmelser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1664/2006 της Επιτροπής,
    της 6ης Νοεμβρίου 2006 , για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2074/2005 σχετικά με μέτρα
    εφαρμογής για ορισμένα προϊόντα ζωικής προέλευσης
    που προορίζονται για κατανάλωση από τον άνθρωπο
    και για την κατάργηση ορισμένων μέτρων εφαρμογής
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1664/2006, 6. november 2006 , millega muudetakse
    määrust (EÜ) nr 2074/2005 seoses rakendusmeetmetega teatavate inimtoiduks ettenähtud
    loomsete toodete suhtes ning tunnistatakse kehtetuks teatavad rakendusmeetmed
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1664/2006, annettu 6 päivänä marraskuuta 2006
    , asetuksen (EY) N:o 2074/2005 muuttamisesta ihmisravinnoksi tarkoitettuja tiettyjä
    eläinperäisiä tuotteita koskevien täytäntöönpanotoimenpiteiden osalta ja
    tiettyjen täytäntöönpanotoimenpiteiden kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1664/2006 od 6. studenoga 2006. o izmjeni Uredbe
    (EZ) br. 2074/2005 o provedbenim mjerama za određene proizvode životinjskog
    podrijetla namijenjene prehrani ljudi i o stavljanju izvan snage određenih provedbenih
    mjera
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1664/2006/EK rendelete ( 2006. november 6. ) a 2074/2005/EK
    rendeletnek az emberi fogyasztásra szánt egyes állati eredetű termékekre
    vonatkozó intézkedések végrehajtása és bizonyos végrehajtási intézkedések
    hatályon kívül helyezése tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1664/2006 della Commissione, del 6 novembre 2006 ,
    che modifica il regolamento (CE) n. 2074/2005 per quanto riguarda le misure di
    attuazione per taluni prodotti di origine animale destinati al consumo umano e
    che abroga talune misure di attuazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1664/2006 ( 2006. gada 6. novembris ), ar kuru
    groza Regulu (EK) Nr. 2074/2005 attiecībā uz īstenošanas pasākumiem saistībā
    ar noteiktiem dzīvnieku izcelsmes produktiem, kas paredzēti lietošanai pārtikā,
    un atceļ dažus īstenošanas pasākumus
  type: main
- language: lt
  script: Latn
  content: 2006 m. lapkričio 6 d. Komisijos reglamentas (EB) Nr. 1664/2006, iš dalies
    keičiantis Reglamentą (EB) Nr. 2074/2005 dėl įgyvendinimo priemonių tam tikriems
    žmonėms skirtiems gyvūninės kilmės produktams ir panaikinantis tam tikras
    įgyvendinimo priemones
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1664/2006 tas- 6 ta' Novembru 2006
    li jemenda r-Regolament (KE) Nru 2074/2005 fir-rigward ta' miżuri ta' implimentazzjoni
    għal ċerti prodotti li joriġinaw mill-annimali li huma maħsuba għall-konsum
    uman u li jirrevoka ċerti miżuri ta' implimentazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1664/2006 van de Commissie van 6 november 2006 tot
    wijziging van Verordening (EG) nr. 2074/2005 wat betreft uitvoeringsmaatregelen
    voor bepaalde voor menselijke consumptie bestemde producten van dierlijke oorsprong
    en tot intrekking van bepaalde uitvoeringsmaatregelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1664/2006 z dnia 6 listopada 2006 r. zmieniające
    rozporządzenie (WE) nr 2074/2005 w odniesieniu do środków wykonawczych, dotyczące
    niektórych produktów pochodzenia zwierzęcego przeznaczonych do spożycia przez
    ludzi i uchylające niektóre środki wykonawcze
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1664/2006 da Comissão, de 6 de Novembro de 2006
    , que altera o Regulamento (CE) n. o 2074/2005 no que diz respeito a medidas de
    execução aplicáveis a determinados produtos de origem animal destinados ao
    consumo humano e que revoga determinadas medidas de execução
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1664/2006 al Comisiei din 6 noiembrie 2006 de modificare
    a Regulamentului (CE) nr. 2074/2005 în ceea ce privește dispozițiile de aplicare
    privind anumite produse de origine animală destinate consumului uman și de abrogare
    a anumitor dispoziții de aplicare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1664/2006 zo 6. novembra 2006 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 2074/2005, pokiaľ ide o vykonávacie opatrenia
    pre určité produkty živočíšneho pôvodu určené na ľudskú spotrebu, a
    zrušujú určité vykonávacie opatrenia
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1664/2006 z dne 6. novembra 2006 o spremembi
    Uredbe (ES) št. 2074/2005 v zvezi z izvedbenimi ukrepi za nekatere proizvode
    živalskega izvora, namenjene za prehrano ljudi, in o razveljavitvi nekaterih
    izvedbenih ukrepov
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1664/2006 de la Comisión, de 6 de noviembre de 2006
    , por el que se modifica el Reglamento (CE) n o 2074/2005 en cuanto a las medidas
    de aplicación de determinados productos de origen animal destinados al consumo
    humano y se derogan algunas medidas de aplicación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1664/2006 av den 6 november 2006 om ändring
    av förordning (EG) nr 2074/2005 vad gäller tillämpningsåtgärder för vissa
    produkter av animaliskt ursprung avsedda att användas som livsmedel och om upphävande
    av vissa tillämpningsåtgärder
  type: main
