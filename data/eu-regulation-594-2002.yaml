    koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 594/2002 della Commissione, del 5 aprile 2002, che
    stabilisce in quale misura può essere dato seguito alle domande di diritti di
    importazione presentate nel mese di aprile 2002 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 594/2002 van de Commissie van 5 april 2002 waarbĳ
