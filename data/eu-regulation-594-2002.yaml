title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 594/2002 of 5 April 2002 determining the
    extent to which applications lodged in April 2002 for import rights in respect
    of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 594/2002 de la Commission du 5 avril 2002 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2002 pour les viandes bovines congelées destinées
    à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 594/2002 der Kommission vom 5. April 2002 über den
    Umfang, in dem den im Monat April 2002 eingereichten Anträgen auf Einfuhrrechte
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 594/2002 af 5. april 2002 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder, indgivet i april
    2002 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 594/2002 της Επιτροπής,
    της 5ης Απριλίου 2002, ο οποίος καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιωμάτων εισαγωγής που κατατέθηκαν τον
    Απρίλιο 2002 για τα κατεψυγμένα βόεια κρέατα
    που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 594/2002, annettu 5 päivänä huhtikuuta 2002,
