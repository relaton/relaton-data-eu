title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2021/753 of 6 May 2021 authorising Malta
    to apply a special measure derogating from Article 287 of Directive 2006/112/EC
    on the common system of value added tax, and repealing Implementing Decision (EU)
    2018/279
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/753 du Conseil du 6 mai 2021 autorisant
    Malte à appliquer une mesure particulière dérogatoire à l’article 287 de
    la directive 2006/112/CE relative au système commun de taxe sur la valeur ajoutée,
    et abrogeant la décision d’exécution (UE) 2018/279
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/753 des Rates vom 6. Mai 2021 zur Ermächtigung
    Maltas, eine von Artikel 287 der Richtlinie 2006/112/EG über das gemeinsame Mehrwertsteuersystem
    abweichende Sonderregelung anzuwenden, und zur Aufhebung des Durchführungsbeschlusses
    (EU) 2018/279
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/753 на Съвета
    от 6 май 2021 година за предоставяне на разрешение
    на Малта да прилага специална мярка за дерогация
    от член 287 от Директива 2006/112/ЕО относно общата
    система на данъка върху добавената стойност
    и за отмяна на Решение за изпълнение (ЕС) 2018/279
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2021/753 ze dne 6. května 2021, kterým
    se Maltě povoluje uplatňovat zvláštní opatření odchylující se od článku
    287 směrnice 2006/112/ES o společném systému daně z přidané hodnoty, a
    zrušuje prováděcí rozhodnutí (EU) 2018/279
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2021/753 af 6. maj 2021 om tilladelse
    til Malta til at anvende en særlig foranstaltning, der fraviger artikel 287 i
    direktiv 2006/112/EF om det fælles merværdiafgiftssystem, og om ophævelse af
    gennemførelsesafgørelse (EU) 2018/279
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/753 του Συμβουλίου
    της 6ης Μαΐου 2021 που επιτρέπει στη Μάλτα να
    εφαρμόσει ειδικό μέτρο παρέκκλισης από το
    άρθρο 287 της οδηγίας 2006/112/ΕΚ σχετικά με το κοινό
    σύστημα φόρου προστιθέμενης αξίας, και καταργεί
    την εκτελεστική απόφαση (ΕΕ) 2018/279
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2021/753, 6. mai 2021, millega lubatakse Maltal
    kohaldada erimeedet, millega tehakse erand direktiivi 2006/112/EÜ (mis käsitleb
    ühist käibemaksusüsteemi) artiklist 287 ja tunnistatakse kehtetuks rakendusotsus
    (EL) 2018/279
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2021/753, annettu 6 päivänä
    toukokuuta 2021, luvan antamisesta Maltalle soveltaa yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 287 artiklasta poikkeavaa erityistoimenpidettä
    ja täytäntöönpanopäätöksen (EU) 2018/279 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2021/753 od 6. svibnja 2021. kojom se Malti
    odobrava primjena posebne mjere odstupanja od članka 287. Direktive 2006/112/EZ
    o zajedničkom sustavu poreza na dodanu vrijednost i o stavljanju izvan snage
    Provedbene odluke (EU) 2018/279
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/753 végrehajtási határozata (2021. május 6.) Máltának
    a közös hozzáadottértékadó-rendszerről szóló 2006/112/EK irányelv 287.
    cikkétől eltérő különös intézkedés alkalmazására történő felhatalmazásáról
    és az (EU) 2018/279 végrehajtási határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/753 del Consiglio del 6 maggio 2021 che
    autorizza Malta ad applicare una misura speciale di deroga all’articolo 287
    della direttiva 2006/112/CE relativa al sistema comune d’imposta sul valore
    aggiunto e che abroga la decisione di esecuzione (UE) 2018/279
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2021/753 (2021. gada 6. maijs), ar ko
    Maltai atļauj piemērot īpašu pasākumu, atkāpjoties no 287. panta Direktīvā
    2006/112/EK par kopējo pievienotās vērtības nodokļa sistēmu, un atceļ Īstenošanas
    lēmumu (ES) 2018/279
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2021/753 2021 m. gegužės 6 d. kuriuo
    Maltai leidžiama taikyti specialią priemonę, kuria nukrypstama nuo Direktyvos
    2006/112/EB dėl pridėtinės vertės mokesčio bendros sistemos 287 straipsnio,
    ir kuriuo panaikinamas Sprendimas (ES) 2018/279
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2021/753 tas-6 ta’
    Mejju 2021 li tawtorizza lil Malta biex tapplika miżura speċjali ta’ deroga
    mill-Artikolu 287 tad-Direttiva 2006/112/KE dwar is-sistema komuni ta’ taxxa
    fuq il-valur miżjud, u li tħassar id-Deċiżjoni ta’ Implimentazzjoni (UE)
    2018/279
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/753 van de Raad van 6 mei 2021 waarbij Malta
    wordt gemachtigd een bijzondere maatregel toe te passen die afwijkt van artikel
    287 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel van belasting
    over de toegevoegde waarde, en tot intrekking van Uitvoeringsbesluit (EU) 2018/279
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2021/753 z dnia 6 maja 2021 r. upoważniająca
    Maltę do stosowania szczególnego środka stanowiącego odstępstwo od art. 287
    dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości dodanej
    i uchylająca decyzję wykonawczą (UE) 2018/279
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/753 do Conselho de 6 de maio de 2021 que
    autoriza Malta a aplicar uma medida especial em derrogação do artigo 287.o da
    Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre o valor acrescentado
    e que revoga a Decisão de Execução (UE) 2018/279
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/753 a Consiliului din 6 mai 2021
    de autorizare a Maltei să aplice o măsură specială de derogare de la articolul
    287 din Directiva 2006/112/CE privind sistemul comun al taxei pe valoarea adăugată
    și de abrogare a Deciziei de punere în aplicare (UE) 2018/279
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2021/753 zo 6. mája 2021, ktorým
    sa Malte povoľuje uplatňovať osobitné opatrenie odchyľujúce sa od článku
    287 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty a zrušuje
    vykonávacie rozhodnutie (EÚ) 2018/279
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2021/753 z dne 6. maja 2021 o dovoljenju Republiki
    Malti, da uporabi posebni ukrep odstopanja od člena 287 Direktive 2006/112/ES
    o skupnem sistemu davka na dodano vrednost in razveljavitvi Izvedbene uredbe (EU)
    2018/279
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/753 del Consejo de 6 de mayo de 2021
    por la que se autoriza a Malta a aplicar una medida especial de excepción al
    artículo 287 de la Directiva 2006/112/CE relativa al sistema común del impuesto
    sobre el valor añadido y se deroga la Decisión de Ejecución (UE) 2018/279
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2021/753 av den 6 maj 2021 om bemyndigande
    för Malta att tillämpa en särskild åtgärd som avviker från artikel 287 i
    direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt och om upphävande
    av genomförandebeslut (EU) 2018/279
