    para 1999, los totales admisibles de capturas de determinadas poblaciones y grupos
    de poblaciones de peces y determinadas condiciones en que pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2598/1999 av den 7 december 1999 om ändring
