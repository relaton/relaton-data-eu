title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2598/1999 of 7 December 1999 amending for the
    second time Regulation (EC) No 48/1999 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1999 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2598/1999 du Conseil, du 7 décembre 1999, modifiant
    pour la deuxième fois le règlement (CE) nº 48/1999 fixant, pour certains stocks
    et groupes de stocks de poissons, les totaux admissibles des captures pour 1999
    et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2598/1999 des Rates vom 7. Dezember 1999 zur zweiten
    Änderung der Verordnung (EG) Nr. 48/1999 zur Festlegung der zulässigen Gesamtfangmengen
    und entsprechender Fangbedingungen für bestimmte Fischbestände oder -bestandsgruppen
    (1999)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2598/1999 af 7. december 1999 om anden ændring
    af forordning (EF) nr. 48/1999 om fastsættelse for 1999 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2598/1999 του Συμβουλίου,
    της 7ης Δεκεμβρίου 1999, σχετικά με την τροποποίηση
    για δεύτερη φορά του κανονισμού (ΕΚ) αριθ. 48/1999
    περί καθορισμού, για ορισμένα αποθέματα ιχθύων
    και ομάδες αποθεμάτων ιχθύων, των συνολικών
    επιτρεπόμενων αλιευμάτων (TAC) για το 1999 καθώς
    και ορισμένων όρων υπό τους οποίους είναι δυνατόν
    να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2598/1999, annettu 7 päivänä joulukuuta 1999,
    tiettyjen kalakantojen ja kalakantaryhmien osalta vuodeksi 1999 vahvistettavista
    suurimmista sallituista saaliista ja niiden pyyntiä koskevista tietyistä edellytyksistä
    annetun asetuksen (EY) N:o 48/1999 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2598/1999 del Consiglio, del 7 dicembre 1999, recante
    seconda modifica del regolamento (CE) n. 48/1999 che stabilisce, per alcuni stock
    o gruppi di stock ittici, il totale ammissibile di catture (TAC) per il 1999 e
    talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2598/1999 van de Raad van 7 december 1999 houdende
    tweede wijziging van Verordening (EG) nr. 48/1999 inzake de vaststelling van de
    voor 1999 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden, alsmede bepaalde bij de visserij in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2598/1999 do Conselho, de 7 de Dezembro de 1999, que
    altera pela segunda vez o Regulamento (CE) n.o 48/1999 que fixa os totais admissíveis
    de capturas para 1999 e certas condições em que podem ser pescadas determinadas
    unidades populacionais ou grupos de unidades populacionais de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2598/1999 del Consejo, de 7 de diciembre de 1999, que
