title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/2093 of 15 November 2017 terminating
    the investigation concerning possible circumvention of the anti-dumping measures
    imposed by Council Implementing Regulation (EU) No 1331/2011 on imports of certain
    seamless pipes and tubes of stainless steel originating in the People's Republic
    of China by imports consigned from India, whether declared as originating in India
    or not, and terminating the registration of such imports imposed by Commission
    Implementing Regulation (EU) 2017/272
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/2093 de la Commission du 15 novembre
    2017 clôturant l'enquête sur le contournement possible des mesures antidumping
    instituées par le règlement d'exécution (UE) n° 1331/2011 du Conseil sur les
    importations de certains tubes et tuyaux sans soudure en acier inoxydable originaires
    de la République populaire de Chine par des importations expédiées depuis l'Inde,
    qu'ils aient ou non été déclarés originaires de ce pays, et mettant fin à
    l'enregistrement de ces importations imposé par le règlement d'exécution (UE)
    2017/272 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/2093 der Kommission vom 15. November
    2017 zur Einstellung der Untersuchung betreffend die mutmaßliche Umgehung der
    mit der Durchführungsverordnung (EU) Nr. 1331/2011 des Rates eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren bestimmter nahtloser Rohre aus rostfreiem Stahl mit Ursprung
    in der Volksrepublik China durch aus Indien versandte Einfuhren, ob als Ursprungserzeugnisse
    Indiens angemeldet oder nicht, und zur Einstellung der mit der Durchführungsverordnung
    (EU) 2017/272 der Kommission eingeführten zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
