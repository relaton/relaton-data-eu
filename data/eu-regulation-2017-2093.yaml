  content: Reglamento de Ejecución (UE) 2017/2093 de la Comisión, de 15 de noviembre
    de 2017, por el que se da por concluida la investigación relativa a la posible
    elusión de las medidas antidumping establecidas por el Reglamento de Ejecución
    (UE) n.° 1331/2011 del Consejo sobre las importaciones de determinados tubos
