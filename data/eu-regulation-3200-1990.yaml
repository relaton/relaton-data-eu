title:
- language: en
  script: Latn
  content: Council Regulation (EEC) n 3200/90 of 5 November 1990 imposing a definitive
    anti-dumping duty on imports of pure silk typewriter ribbon fabrics originating
    in the people's republic of china and definitively collecting the provisional
    anti-dumping duty imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3200/90 du conseil, du 5 novembre 1990, instituant
    un droit antidumping définitif sur les importations de tissus en soie pure pour
    rubans de machines à écrire originaires de la République populaire de Chine
    et portant perception définitive du droit antidumping provisoire institué sur
    ces importations
  type: main
- language: de
  script: Latn
