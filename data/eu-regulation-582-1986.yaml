    prezzi e dei quantitativi immessi in consumo in Spagna e in Portogallo di taluni
    prodotti del settore dei grassi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 582/86 van de Commissie van 28 februari 1986 houdende
