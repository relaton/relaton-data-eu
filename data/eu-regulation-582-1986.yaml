    prix et des quantités mises à la consommation en Espagne et au Portugal de certains
    produits du secteur des matières grasses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 582/86 der Kommission vom 28. Februar 1986 mit Übergangsbestimmungen
