  content: Commission Regulation (EEC) No 582/86 of 28 February 1986 on transitional
    measures regarding the control system for prices and the quantities of certain
    products in the oils and fats sector which are released for consumption in Spain
    and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 582/86 de la Commission du 28 février 1986 portant
