title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3251/84 of 21 November 1984 re-establishing
    the levying of customs duties on activated carbon, falling within subheading 38.03
    A, originating in the Philippines, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3251/84 de la Commission du 21 novembre 1984 portant
    rétablissement de la perception des droits de douane applicables aux charbons
    activés de la sous-position 38.03 A du tarif douanier commun, originaires des
    Philippines, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3251/84 der Kommission vom 21. November 1984 zur Wiedereinführung
    der Erhebung der Zölle für Aktivkohle der Tarifstelle 38.03 A mit Ursprung in
    den Philippinen, denen die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3251/84 af 21. november 1984 om genindførelse
    af opkrævning af told for aktiveret kul henhørende henhørendse under pos. 38.03
    A og med oprindelse i Filippinerne som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
