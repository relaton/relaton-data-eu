title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 175/81 of 22 January 1981 amending Regulation
    (EEC) No 467/77 on the method and the rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying in, storage and
    disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 175/81 de la Commission, du 22 janvier 1981, modifiant
    le règlement (CEE) n° 467/77 relatif à la méthode et au taux d' intérêt
    à appliquer pour le calcul des frais de financement des interventions consistant
    en achats, stockage et écoulement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 175/81 der Kommission vom 22. Januar 1981 zur Änderung
    der Verordnung (EWG) Nr. 467/77 über die Methode und den Zinssatz, die bei der
    Berechnung der Finanzierungskosten für Interventionen in Form von Ankauf, Lagerung
    und Absatz anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 175/81 af 22. januar 1981 om ændring
    af forordning (EØF) nr. 467/77 om den metode og den rentesats, der skal anvendes
    ved beregningen af finansieringsudgifter i forbindelse med interventioner i form
    af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 175/81 τής Επιτροπής
    τής 22ας Ιανουαρίου 1981 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 467/77 «περί τής μεθόδου
    καί τού επιτοκίου πού πρέπει νά εφαρμοσθούν
    γιά τόν υπολογισμό τών εξόδων χρηματοδοτήσεως
    τών παρεμβάσεων, πού συνίστανται σέ αγορές,
    αποθεματοποίηση καί διάθεση»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 175/81 della Commissione, del 22 gennaio 1981, che
    modifica il regolamento (CEE) n. 467/77 che stabilisce il metodo ed il tasso d'
    interesse da utilizzare per il calcolo delle spese di finanziamento degli interventi
    costituiti da acquisti, magazzinaggio e vendita
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 175/81 van de Commissie van 22 januari 1981 houdende
    wijziging van Verordening (EEG) nr. 467/77 met betrekking tot de methode en de
    rentevoet die dienen te worden toegepast bij de berekening van de financieringskosten
    van de interventies in de vorm van aankoop, opslag en afzet
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 175/81 da Comissão, de 22 de Janeiro de 1981, que
    altera o Regulamento (CEE) n.° 467/77 relativo ao método e à taxa de juro a
    aplicar para o cálculo das despesas de financiamento das intervenções que consistem
    em compras, armazenamentos e escoamentos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 175/81 de la Comisión, de 22 de enero de 1981, por
    el que se modifica el Reglamento (CEE) n° 467/77 relativo al método y al tipo
    de interés que deben aplicarse para el cálculo de los gastos de financiación
    de las intervenciones consistentes en la compra, almacenamiento y comercialización
  type: main
