  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/1209 оd 4. srpnja 2017. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    Bt11 × 59122 × MIR604 × 1507 × GA21 te genetski modificirani kukuruz u kojemu
    se kombiniraju dvije, tri ili četiri od promjena Bt11, 59122, MIR604, 1507 i
    GA21, sastoje se ili su proizvedeni od njih, u skladu s Uredbom (EZ) br. 1829/2003
    Europskog parlamenta i Vijeća o genetski modificiranoj hrani i hrani za životinje
    (priopćeno pod brojem dokumenta C(2017) 4460)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1209 végrehajtási határozata (2017. július 4.)
    a géntechnológiával módosított Bt11 × 59122 × MIR604 × 1507 × GA21 kukoricát
    és a géntechnológiával módosított, a Bt11, az 59122, a MIR604, az 1507 és
    a GA21 génmódosítási események közül kettőt, hármat vagy négyet ötvöző
    kukoricát tartalmazó, abból álló vagy abból előállított termékek forgalomba
    hozatalának a géntechnológiával módosított élelmiszerekről és takarmányokról
    szóló 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2017) 4460. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/1209 della Commissione, del 4 luglio
