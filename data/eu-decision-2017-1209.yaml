    MIR604, 1507 ir GA21 sudarytų genetiškai modifikuotų kukurūzų, arba kurie
    iš jų sudaryti arba pagaminti (pranešta dokumentu Nr. C(2017) 4460)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1209 tal-4 ta'
