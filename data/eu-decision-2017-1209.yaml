    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo Bt11 × 59122
    × MIR604 × 1507 × GA21, so iz nje sestavljeni ali proizvedeni, in gensko spremenjenih
    koruz, v katerih so združeni dva, trije ali štirje od dogodkov Bt11, 59122,
