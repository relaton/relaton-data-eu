    2017, por la que se autoriza la introducción en el mercado de los productos que
    contengan, se compongan o se hayan producido a partir de maíz modificado genéticamente
    Bt11 × 59122 × MIR604 × 1507 × GA21, y de maíz modificado genéticamente
