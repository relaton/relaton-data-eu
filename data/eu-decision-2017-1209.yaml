    valmistatud tooteid (teatavaks tehtud numbri C(2017) 4460 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/1209, annettu 4 päivänä
    heinäkuuta 2017, muuntogeenistä maissia Bt11 × 59122 × MIR604 × 1507 × GA21
    sisältävien, siitä koostuvien tai siitä valmistettujen tuotteiden sekä kahdesta,
    kolmesta tai neljästä geenimuunnostapahtumasta Bt11, 59122, MIR604, 1507 ja
