    składających się z wymienionych rodzajów zmodyfikowanej genetycznie kukurydzy
    lub z niej wyprodukowanych (notyfikowana jako dokument nr C(2017) 4460)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/1209 da Comissão, de 4 de julho de 2017,
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por, ou produzidos a partir de milho geneticamente modificado Bt11 × 59122 ×
    MIR604 × 1507 × GA21 e milho geneticamente modificado combinando dois, três
    ou quatro dos eventos Bt11, 59122, MIR604, 1507 e GA21, em conformidade com o
    Regulamento (CE) n.° 1829/2003 do Parlamento Europeu e do Conselho relativo a
    géneros alimentícios e alimentos para animais geneticamente modificados [notificada
    com o número C(2017) 4460]
  type: main
