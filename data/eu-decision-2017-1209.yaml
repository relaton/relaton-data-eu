title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1209 of 4 July 2017 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified maize Bt11 × 59122 × MIR604 × 1507 × GA21, and genetically
    modified maize combining two, three or four of the events Bt11, 59122, MIR604,
    1507 and GA21 pursuant to Regulation (EC) No 1829/2003 of the European parliament
    and of the Council on genetically modified food and feed (notified under document
    C(2017) 4460)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1209 de la Commission du 4 juillet 2017
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié Bt11 × 59122 × MIR604 × 1507 × GA21 et du maïs génétiquement modifié
    combinant deux, trois ou quatre des événements Bt11, 59122, MIR604, 1507 et
    GA21, de produits consistant en ces maïs ou produits à partir de ceux-ci, en
    application du règlement (CE) n° 1829/2003 du Parlement européen et du Conseil
    concernant les denrées alimentaires et les aliments pour animaux génétiquement
    modifiés [notifiée sous le numéro C(2017) 4460]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1209 der Kommission vom 4. Juli 2017
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte Bt11 × 59122 × MIR604 × 1507 × GA21 enthalten, aus ihm bestehen
    oder aus ihm hergestellt werden, und von genetisch verändertem Mais, bei dem
    zwei, drei oder vier der Sorten Bt11, 59122, MIR604, 1507 und GA21 kombiniert
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates über genetisch veränderte Lebensmittel und Futtermittel (Bekannt
    gegeben unter Aktenzeichen C(2017) 4460)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/1209 на Комисията
    от 4 юли 2017 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица Bt11 × 59122 × MIR604 × 1507 × GA21 и генетично
    модифицирана царевица, съвместяваща две, три
