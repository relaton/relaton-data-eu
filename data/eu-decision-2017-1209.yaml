    minn, jew li huma prodotti mill-qamħirrum ġenetikament modifikat Bt11 × 59122
    × MIR604 × 1507 × GA21, u qamħirrum ġenetikament modifikat li jikkombina
    żewġ, tlieta jew erba' mill-eventi Bt11, 59122, MIR604, 1507 u GA21 skont ir-Regolament
