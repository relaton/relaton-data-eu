    ġenetikament (notifikata bid-dokument C(2017) 4460)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/1209 van de Commissie van 4 juli 2017 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais Bt11 × 59122 × MIR604 × 1507 × GA21 en genetisch gemodificeerde maisrassen
    die twee, drie of vier van de transformatiestappen Bt11, 59122, MIR604, 1507 en
    GA21 combineren, overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees
    Parlement en de Raad inzake genetisch gemodificeerde levensmiddelen en diervoeders
    (Kennisgeving geschied onder nummer C(2017) 4460)
  type: main
