    парламент и на Съвета относно генетично модифицираните
    храни и фуражи (нотифицирано под номер С(2017)
    4460)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/1209 ze dne 4. července 2017
    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    Bt11 × 59122 × MIR604 × 1507 × GA21 a geneticky modifikovanou kukuřici kombinující
    dvě, tři nebo čtyři události Bt11, 59122, MIR604, 1507 a GA21, sestávají
