    × GA21 și din porumb modificat genetic obținut din combinarea a două, trei
    sau patru dintre evenimentele Bt11, 59122, MIR604, 1507 și GA21, în temeiul
    Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    privind produsele alimentare și furajele modificate genetic [notificată cu numărul
    C(2017) 4460]
