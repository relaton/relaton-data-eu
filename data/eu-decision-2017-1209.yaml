  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/1209 z dnia 4 lipca 2017 r. zezwalająca
    na wprowadzenie do obrotu, na mocy rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady w sprawie genetycznie zmodyfikowanej żywności i paszy,
    produktów zawierających zmodyfikowaną genetycznie kukurydzę Bt11 × 59122
    × MIR604 × 1507 × GA21 oraz rodzaje zmodyfikowanej genetycznie kukurydzy łączące
