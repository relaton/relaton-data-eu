    × GA21 e da granturco geneticamente modificato che combina due, tre o quattro
    degli eventi Bt11, 59122, MIR604, 1507 e GA21 ai sensi del regolamento (CE) n.
    1829/2003 del Parlamento europeo e del Consiglio relativo agli alimenti e ai mangimi
    geneticamente modificati [notificata con il numero C(2017) 4460]
  type: main
- language: lv
  script: Latn
