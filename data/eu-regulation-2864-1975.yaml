title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2864/75 of the Commission of 3 November 1975 altering
    retrospectively the amounts as fixed by Regulation (EEC) No 1726/75 by which the
    import charges on beef and veal originating in the African, Caribbean and Pacific
    States or in the overseas countries and territories are to be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2864/75 de la Commission, du 3 novembre 1975, modifiant
    avec effet rétroactif les montants, fixés par le règlement (CEE) n° 1726/75,
    de diminution des charges à l'importation de viandes bovines originaires des
    États d'Afrique, des Caraïbes et du Pacifique ou des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2864/75 der Kommission vom 3. November 1975 zur rückwirkenden
    Änderung der in der Verordnung (EWG) Nr. 1726/75 festgesetzten Beträge zur Senkung
    der Einfuhrabgaben bei Rindfleisch mit Ursprung in den Staaten in Afrika, im Karibischen
    Raum und im Pazifischen Ozean oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2864/75 af 3. november 1975 om ændring
    med tilbagevirkende kraft af de ved forordning (EØF) nr. 1726/75 fastsatte beløb,
    med hvilke importbelastningerne for oksekød med oprindelse i staterne i Afrika,
    Vestindien og Stillehavet eller i de oversøiske lande og territorier nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2864/75 della Commissione, del 3 novembre 1975, che
    modifica con effetto retroattivo gli importi fissati dal regolamento (CEE) n.
    1726/75, di cui sono ridotti gli oneri applicabili all'importazione di carni bovine
    originarie degli Stati africani, dei Caraibi e del Pacifico o dei paesi e territori
    d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2864/75 van de Commissie van 3 november 1975 houdende
    wijziging met terugwerkende kracht van de bij Verordening (EEG) nr. 1726/75 vastgestelde
    bedragen welke in mindering worden gebracht op de belastingen bij invoer van rundvlees
    van oorsprong uit de landen in Afrika, het Caribische gebied en de Stille Oceaan
    of uit de landen en gebieden overzee
  type: main
