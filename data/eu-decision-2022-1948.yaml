  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1948 оd 13. listopada 2022. o utvrđivanju
    jednakovrijednosti, u svrhu olakšavanja ostvarivanja prava na slobodno kretanje
    unutar Unije, COVID-19 potvrda koje izdaje Savezna Republika Brazil s potvrdama
    izdanima u skladu s Uredbom (EU) 2021/953 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1948 végrehajtási határozata (2022. október
    13.) a Brazil Szövetségi Köztársaság által kiállított Covid19-igazolványoknak
    az (EU) 2021/953 európai parlamenti és tanácsi rendelettel összhangban kiállított
    igazolványokkal való egyenértékűségének az Unión belüli szabad mozgáshoz
    való jog előmozdítása céljából történő megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1948 della Commissione del 13 ottobre
    2022 che stabilisce l’equivalenza, al fine di agevolare il diritto di libera
    circolazione nell’ambito dell’Unione, dei certificati COVID-19 rilasciati
    dalla Repubblica federativa del Brasile ai certificati rilasciati in conformità
    del regolamento (UE) 2021/953 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1948 (2022. gada 13. oktobris),
    ar ko nolūkā atvieglot tiesības brīvi pārvietoties Savienībā nosaka Brazīlijas
    Federatīvās Republikas izdoto Covid-19 sertifikātu līdzvērtīgumu sertifikātiem,
    kuri izdoti saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) 2021/953
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1948 2022 m. spalio 13 d.
    kuriuo, siekiant sudaryti palankesnes sąlygas naudotis laisvo judėjimo teise
    Sąjungoje, nustatomas Brazilijos Federacinės Respublikos išduotų COVID-19
    pažymėjimų lygiavertiškumas pagal Europos Parlamento ir Tarybos reglamentą
    (ES) 2021/953 išduotiems pažymėjimams
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1948 tat-13
    ta’ Ottubru 2022 li tistabbilixxi l-ekwivalenza, għall-fini tal-faċilitazzjoni
    tad-dritt tal-moviment liberu fl-Unjoni, taċ-ċertifikati COVID-19 maħruġa
    mir-Repubblika Federattiva tal-Brażil maċ-ċertifikati maħruġa f’konformità
    mar-Regolament (UE) 2021/953 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1948 van de Commissie van 13 oktober 2022
    houdende vaststelling van de gelijkwaardigheid, teneinde het recht van vrij verkeer
    binnen de Unie te faciliteren, van door de Federale Republiek Brazilië afgegeven
    COVID-19-certificaten met de overeenkomstig Verordening (EU) 2021/953 van het
    Europees Parlement en de Raad afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1948 z dnia 13 października 2022
    r. ustanawiająca równoważność, w celu ułatwienia korzystania z prawa do
    swobodnego przemieszczania się w Unii, zaświadczeń COVID-19 wydawanych przez
    Federacyjną Republikę Brazylii z zaświadczeniami wydawanymi zgodnie z rozporządzeniem
    Parlamentu Europejskiego i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1948 da Comissão de 13 de outubro de
    2022 que estabelece a equivalência, a fim de facilitar o exercício do direito
    de livre circulação na União, dos certificados COVID-19 emitidos pela República
    Federativa do Brasil aos certificados emitidos em conformidade com o Regulamento
    (UE) 2021/953 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1948 a Comisiei din 13 octombrie
    2022 de stabilire, cu scopul de a facilita exercitarea dreptului la liberă circulație
    pe teritoriul Uniunii, a echivalenței certificatelor privind COVID-19 eliberate
    de Republica Federativă a Braziliei cu certificatele eliberate în conformitate
    cu Regulamentul (UE) 2021/953 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1948 z 13. októbra 2022, ktorým
    sa na účely uľahčenia práva na voľný pohyb v rámci Únie stanovuje rovnocennosť
    potvrdení súvisiacich s ochorením COVID-19 vydávaných Brazílskou federatívnou
    republikou s potvrdeniami vydávanými v súlade s nariadením Európskeho parlamentu
    a Rady (EÚ) 2021/953
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1948 z dne 13. oktobra 2022 o določitvi
    enakovrednosti COVID-19 potrdil, ki jih izdaja Federativna republika Brazilija,
    in potrdil, izdanih v skladu z Uredbo (EU) 2021/953 Evropskega parlamenta in Sveta,
    da se olajša uveljavljanje pravice do prostega gibanja v Uniji
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1948 de la Comisión de 13 de octubre
    de 2022 por la que se establece la equivalencia, a fin de facilitar el derecho
    a la libre circulación dentro de la Unión, entre los certificados COVID-19 expedidos
    por la República Federativa de Brasil y los expedidos de conformidad con el Reglamento
    (UE) 2021/953 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1948 av den 13 oktober 2022
    om fastställande, i syfte att underlätta den fria rörligheten inom unionen,
    av att covid-19-intyg som utfärdas av Förbundsrepubliken Brasilien är likvärdiga
    med de intyg som utfärdas i enlighet med Europaparlamentets och rådets förordning
    (EU) 2021/953
