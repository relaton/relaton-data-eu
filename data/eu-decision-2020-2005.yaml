    risku mazināšanai ārkārtas situācijā pēc Covid-19 uzliesmojuma
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2020/2005 2020 m. gruodžio 4 d.
    kuriuo Airijai pagal Reglamentą (ES) 2020/672 suteikiama laikina parama nedarbo
    rizikai dėl ekstremaliosios situacijos, susijusios su COVID-19 protrūkiu, mažinti
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2020/2005 tal-4
    ta’ Diċembru 2020 li tagħti appoġġ temporanju skont ir-Regolament (UE) 2020/672
    lill-Irlanda biex ittaffi r-riskji ta’ qgħad fl-emerġenza wara t-tifqigħa
    tal-COVID-19
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/2005 van de Raad van 4 december 2020 tot toekenning
    van tijdelijke steun uit hoofde van Verordening (EU) 2020/672 aan Ierland om het
    risico op werkloosheid in de noodtoestand als gevolg van de COVID-19-uitbraak
    te beperken
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2020/2005 z dnia 4 grudnia 2020 r. w sprawie
    udzielenia Irlandii tymczasowego wsparcia na podstawie rozporządzenia (UE) 2020/672
    w celu zmniejszenia zagrożeń związanych z bezrobociem w sytuacji nadzwyczajnej,
    jaka wystąpiła w związku z pandemią COVID-19
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/2005 do Conselho de 4 de dezembro de 2020
    que concede um apoio temporário à Irlanda ao abrigo do Regulamento (UE) 2020/672
    para atenuar os riscos de desemprego numa situação de emergência na sequência
    do surto de COVID-19
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/2005 a Consiliului din 4 decembrie
    2020 privind acordarea unui sprijin temporar Irlandei în temeiul Regulamentului
    (UE) 2020/672 pentru atenuarea riscurilor de șomaj în situația de urgență
    generată de epidemia de COVID-19
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2020/2005 zo 4. decembra 2020, ktorým
    sa Írsku poskytuje dočasná podpora podľa nariadenia Rady (EÚ) 2020/672 na
    zmiernenie rizík nezamestnanosti v núdzovej situácii v dôsledku výskytu ochorenia
    COVID-19
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2020/2005 z dne 4. decembra 2020 o odobritvi
    začasne podpore Irski na podlagi Uredbe (EU) 2020/672 za ublažitev tveganj za
    brezposelnost v izrednih razmerah po izbruhu COVID-19
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/2005 del Consejo de 4 de diciembre de
    2020 por la que se concede apoyo temporal a Irlanda, con arreglo al Reglamento
    (UE) 2020/672, para atenuar los riesgos de desempleo en la emergencia a raíz
    de la pandemia de COVID-19
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2020/2005 av den 4 december 2020 om beviljande
    av tillfälligt stöd enligt förordning (EU) 2020/672 till Irland för att minska
    risken för arbetslöshet i krissituationen till följd av covid-19-utbrottet
  type: main
