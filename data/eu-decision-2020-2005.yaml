title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2020/2005 of 4 December 2020 granting
    temporary support under Regulation (EU) 2020/672 to Ireland to mitigate unemployment
    risks in the emergency following the COVID-19 outbreak
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/2005 du Conseil du 4 décembre 2020
    octroyant à l’Irlande un soutien temporaire au titre du règlement (UE) 2020/672
    pour l’atténuation des risques de chômage en situation d’urgence engendrée
    par la propagation de la COVID-19
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/2005 des Rates vom 4. Dezember 2020 zur
    Gewährung einer vorübergehenden Unterstützung gemäß der Verordnung (EU) 2020/672
    für Irland mit dem Ziel, Arbeitslosigkeitsrisiken in der Notlage infolge des
    COVID-19-Ausbruchs zu mindern
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2020/2005 на Съвета от 4 декември
    2020 година за предоставяне, по силата на Регламент
    (ЕС) 2020/672, на временна подкрепа на Ирландия
    с цел ограничаване на риска от безработица
    при извънредните обстоятелства вследствие
    на избухването на COVID-19
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2020/2005 ze dne 4. prosince 2020, kterým
    se Irsku poskytuje dočasná podpora podle nařízení (EU) 2020/672 na zmírnění
    rizik nezaměstnanosti v mimořádné situaci v důsledku rozšíření onemocnění
    COVID-19
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2020/2005 af 4. december 2020 om
    midlertidig støtte til Irland i henhold til forordning (EU) 2020/672 til mindskelse
    af risiciene for arbejdsløshed i nødsituationen som følge af covid-19-udbruddet
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/2005 του Συμβουλίου
    της 4ης Δεκεμβρίου 2020 σχετικά με τη χορήγηση
    προσωρινής στήριξης στην Ιρλανδία, στο πλαίσιο
    του κανονισμού (ΕΕ) 2020/672, για τον μετριασμό
    των κινδύνων ανεργίας στην κατάσταση έκτακτης
    ανάγκης λόγω της επιδημικής έκρηξης της COVID-19
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2020/2005 4. detsember 2020, millega antakse
    Iirimaale määruse (EL) 2020/672 alusel ajutist toetust töötuseriski leevendamiseks
    COVID-19 puhanguga kaasnenud eriolukorras
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2020/2005 annettu 4 päivänä
    joulukuuta 2020, tilapäisen tuen myöntämisestä Irlannille asetuksen (EU) 2020/672
    nojalla työttömyysriskien lieventämiseksi hätätilassa covid-19:n leviämisen
    seurauksena
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2020/2005 od 4. prosinca 2020. o odobravanju
    na temelju Uredbe (EU) 2020/672 privremene potpore Irskoj radi smanjenja rizika
    od nezaposlenosti u izvanrednoj situaciji nakon izbijanja bolesti COVID-19
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2020/2005 végrehajtási határozata (2020. december 4.)
    a Covid19-járvány miatt felmerülő szükséghelyzeti munkanélküliségi kockázatok
    mérséklése érdekében az (EU) 2020/672 rendelet alapján Írországnak nyújtandó
    ideiglenes támogatásról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/2005 del Consiglio del 4 dicembre 2020
    che concede all’Irlanda sostegno temporaneo a norma del regolamento (UE) 2020/672
    per attenuare i rischi di disoccupazione nello stato di emergenza a seguito dell’epidemia
    di COVID-19
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2020/2005 (2020. gada 4. decembris),
