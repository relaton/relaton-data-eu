  content: '97/605/EC: Commission Decision of 11 August 1997 authorizing Member States
    to permit temporarily the marketing of forest reproductive material not satisfying
    the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '97/605/CE: Décision de la Commission du 11 août 1997 autorisant les
