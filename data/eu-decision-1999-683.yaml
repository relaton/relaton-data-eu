title:
- language: en
  script: Latn
  content: '1999/683/EC: Commission Decision of 7 October 1999 amending for the second
    time Decision 1999/293/EC concerning certain protective measures against bluetongue
    in parts of Greece (notified under document number C(1999) 3106) (Text with EEA
    relevance) (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/683/CE: Décision de la Commission, du 7 octobre 1999, modifiant
    pour la deuxième fois la décision 1999/293/CE concernant certaines mesures de
    protection contre la fièvre catarrhale du mouton ( bluetongue ) dans certaines
    parties du territoire grec [notifiée sous le numéro C(1999) 3106] (Texte présentant
    de l''intérêt pour l''EEE) (Le texte en langue grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '1999/683/EG: Entscheidung der Kommission vom 7. Oktober 1999 zur zweiten
