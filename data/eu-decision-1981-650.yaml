title:
- language: en
  script: Latn
  content: '81/650/EEC: Commission Decision of 10 July 1981 authorizing Ireland not
    to apply Community treatment to parkas, anoraks, windcheaters, waisted jackets
    and the like, woven, originating in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/650/CEE: Décision de la Commission, du 10 juillet 1981, autorisant
    l''Irlande à exclure du traitement communautaire les "parkas", anoraks, blousons
    et similaires, tissés, originaires de Hong-kong (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/650/EWG: Entscheidung der Kommission vom 10. Juli 1981 zur Ermächtigung
    Irlands, aus Hongkong stammende Parkas, Anoraks, Windjacken und dergleichen, aus
    Geweben, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/650/EØF: Kommissionens beslutning af 10. juli 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage parcacoats, anorakker, vindjakker,
    blousonjakker og lignende, vævede, med oprindelse i Hongkong (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/650/ΕΟΚ: Απόφαση τής Επιτροπής τής 10ης
    Ιουλίου 1981 περί εξουσιοδοτήσεως τής Ιρλανδίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    τά parkas, anoraks, blousons καί παρόμοια, υφασμένα, καταγόμενα
    από τό Χόνγκ Κόνγκ (Το κείμενο στην αγγλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/650/CEE: Decisione della Commissione, del 10 luglio 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli eskimo, le giacche a vento
    e i giubbotti con o senza cappuccio e simili, tessuti, originari di Hong Kong
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/650/EEG: Beschikking van de Commissie van 10 juli 1981 houdende machtiging
