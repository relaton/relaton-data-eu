title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 943/2012 of 15 October 2012 implementing
    Article 12(1) and Article 13 of Regulation (EU) No 356/2010 imposing certain specific
    restrictive measures directed against certain natural or legal persons, entities
    or bodies, in view of the situation in Somalia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 943/2012 du Conseil du 15 octobre 2012
    mettant en œuvre l’article 12, paragraphe 1, et l’article 13 du règlement
    (UE) n ° 356/2010 instituant certaines mesures restrictives spécifiques à l’encontre
    de certaines personnes physiques ou morales, entités ou organismes, en raison
    de la situation en Somalie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 943/2012 des Rates vom 15. Oktober 2012
    zur Durchführung des Artikels 12 Absatz 1 und des Artikels 13 der Verordnung
    (EU) Nr. 356/2010 über die Anwendung bestimmter spezifischer restriktiver Maßnahmen
    gegen bestimmte natürliche oder juristische Personen, Organisationen oder Einrichtungen
    aufgrund der Lage in Somalia
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 943/2012 на Съвета
    от 15 октомври 2012 година за прилагане на член
