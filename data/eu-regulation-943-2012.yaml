    на Съвета за налагане на някои специфични ограничителни
    мерки, насочени към определени физически или
    юридически лица, образувания или органи предвид
    ситуацията в Сомалия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 943/2012 ze dne 15. října 2012
    , kterým se provádí čl. 12 odst. 1 a článek 13 nařízení (EU) č. 356/2010
    o zavedení některých zvláštních omezujících opatření namířených proti
    některým fyzickým a právnickým osobám, subjektům a orgánům vzhledem k
    situaci v Somálsku
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 943/2012 af 15. oktober 2012
    om gennemførelse af artikel 12, stk. 1, og artikel 13 i forordning (EU) nr. 356/2010
    om indførelse af visse specifikke restriktive foranstaltninger mod visse fysiske
    eller juridiske personer, enheder eller organer på grund af situationen i Somalia
  type: main
- language: el
  script: Grek
