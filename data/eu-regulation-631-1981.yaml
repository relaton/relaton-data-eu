title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 631/81 of 11 March 1981 re-establishing
    the levying of customs duties on babies' under garments, knitted or crocheted,
    not elastic or rubberized, products of category 68 (code 0680), originating in
    South Korea, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 631/81 de la Commission, du 11 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastique ni caoutchoutée, pour bébés, de la catégorie
    de produits n° 68 (code 0680), originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 631/81 der Kommission vom 11. März 1981 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, für Säuglinge, der Warenkategorie Nr. 68 (Kennziffer 0680),
    mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3320/80 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 631/81 af 11. marts 1981 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastisk eller gummeret, til spædbørn, under varekategori 68 (kode 0680), som
    har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
