  content: Regolamento (CEE) n. 631/81 della Commissione, dell' 11 marzo 1981, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata per bambini piccoli (bébés), della categoria di prodotti
    n. 68 (codice 0680), originari della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 631/81 van de Commissie van 11 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk voor baby' s, van
    de categorie van produkten nr. 68 (codenummer 0680), van oorsprong uit Zuid-Korea
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3320/80 van de Raad
