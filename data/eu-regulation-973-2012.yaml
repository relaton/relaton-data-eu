- language: en
  script: Latn
  content: Commission Regulation (EU) No 973/2012 of 22 October 2012 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 925/2009 on imports of certain aluminium foil originating
    in the People’s Republic of China by imports of certain aluminium foil in rolls
    which are not annealed and of a width exceeding 650 mm originating in the People’s
    Republic of China, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 973/2012 de la Commission du 22 octobre 2012 portant
    ouverture d’une enquête sur le contournement possible des mesures antidumping
    instituées par le règlement (CE) n ° 925/2009 du Conseil sur les importations
    de certaines feuilles d’aluminium originaires de la République populaire de
    Chine par des importations de certaines feuilles d’aluminium présentées en
    rouleaux, non recuites et d’une largeur dépassant 650 mm, originaires de la
    République populaire de Chine, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 973/2012 der Kommission vom 22. Oktober 2012 zur Einleitung
