title:
- language: en
  script: Latn
  content: '91/610/EEC: Commission Decision of 13 November 1991 amending Decision
    91/28/EEC authorizing certain Member States to provide for exceptions from certain
    provisions of Directive 77/93/EEC in respect of potatoes for human consumption
    originating in Turkey (Only the Dutch, French and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/610/CEE: Décision de la Commission du 13 novembre 1991 modifiant la
    décision 91/28/CEE autorisant certains États membres à prévoir des dérogations
    à certains dispositions de la directive 77/93/CEE pour les pommes de terre de
    consommation originaires de Turquie (Les textes en langues néerlandaise, française
    et allemande sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 13. November 1991 zur Änderung der Entscheidung
    91/28/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für Speisekartoffeln
    mit Ursprung in der Türkei Ausnahmen von einigen Vorschriften der Richtlinie
    77/93/EWG zuzulassen (Nur der niederländische, französische und deutsche Text
    sind verbindlich) (91/610/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 13. november 1991 om ændring af beslutning
    91/28/EØF om bemyndigelse af visse medlemsstater til at fastsætte undtagelser
    fra visse bestemmelser i direktiv 77/93/EØF for spisekartofler med oprindelse
    i Tyrkiet (Kun de franske, nederlandske og tyske udgaver er autentiske) (91/610/EØF)
    #'
  type: main
- language: el
  script: Grek
  content: '91/610/ΕΟΚ : Απόφαση της Επιτροπής της 13ης
    Νοεμβρίου 1991 για την τροποποίηση της απόφασης
    91/28/ΕΟΚ που επιτρέπει σε ορισμένα κράτη μέλη
    να προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ όσον αφορά τις πατάτες για
    ανθρώπινη κατανάλωση καταγωγής Τουρκίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 13 novembre 1991 recante modifica della
    decisione 91/28/CEE che autorizza taluni Stati membri a stabilire deroghe, per
    le patate da consumo originarie della Turchia, a talune disposizioni della direttiva
    77/93/CEE (I testi in lingua tedesca, francese e olandese sono i soli facenti
    fede) (91/610/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 13 november 1991 tot wijziging van Beschikking
    91/28/EEG houdende machtiging van bepaalde Lid-Staten om, voor consumptieaardappelen
    van oorsprong uit Turkije, afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG
    toe te staan (Slechts de teksten in de Duitse, de Franse en de Nederlandse taal
    zijn authentiek) (91/610/EEG) #'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 13 de Novembro de 1991 que altera a Decisão 91/28/CEE,
    que autoriza determinados Estados- membros a estabelecer derrogações de determinadas
    normas da Directiva 77/93/CEE em relação à batata de consumo originária da
    Turquia (Apenas fazem fé os textos nas línguas neerlandesa, francesa e alemã)
    (91/610/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 13 de noviembre de 1991 que modifica la Decisión
    91/28/CEE por la que se autoriza a algunos Estados miembros para establecer excepciones
    a determinadas disposiciones de la Directiva 77/93/CEE con respecto a las patatas
    destinadas al consumo humano originarias de Turquía (Los textos en lengua alemana,
    francesa y neerlandesa son los únicos auténticos) (91/610/CEE) #'
