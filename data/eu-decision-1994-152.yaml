id: EUDecision1994152
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 15 February 1994 deferring, as regards the importation
    of vegetable propagating and planting material, other than seed, from third countries,
    the date referred to in Article 16 (2) of Council Directive 92/33/EEC
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 15 février 1994 prorogeant, en ce qui concerne
    les importations de plants et légumes et de matériels de multiplication de légumes
    autres que les semences, en provenance de pays tiers, le délai fixé à l'article
    16 paragraphe 2 de la directive 92/33/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 15. Februar 1994 zur Verlängerung des
    in Artikel 16 Absatz 2 der Richtlinie 92/33/EWG des Rates genannten Zeitraums
    für die Einfuhr von Gemüsevermehrungsmaterial und Gemüsepflanzgut mit Ausnahme
    von Saatgut aus Drittländern
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 15. februar 1994 om udsættelse af det i artikel
    16, stk. 2, i Rådets direktiv 92/33/EØF omhandlede tidspunkt for så vidt angår
    indførsel fra tredjelande af plantemateriale og formeringsmateriale af grøntsagsplanter,
    bortset fra frø
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 15ης Φεβρουαρίου
    1994 περί παρατάσεως, όσον αφορά την εισαγωγή
    από τρίτες χώρες φυταρίων και πολλαπλασιαστικού
    υλικού κηπευτικών, εκτός των σπόρων προς σπορά,
    της προθεσμίας που αναφέρεται στο άρθρο 16 παράγραφος
    2 της οδηγίας 92/33/ΕΟΚ του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: '94/152/EY: Komission päätös, tehty 15 päivänä helmikuuta 1994, kolmansista
    maista tulevan vihannesten lisäys- ja taimiaineiston, lukuun ottamatta siemeniä,
    tuontia koskevan, neuvoston direktiivin 92/33/ETY 16 artiklan 2 kohdassa vahvistetun
    määräajan pidentämisestä'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 15 febbraio 1994 che proroga il termine
    di cui all' articolo 16, paragrafo 2 della direttiva 92/33/CEE del Consiglio per
    quanto concerne l' importazione da paesi terzi di piantine di ortaggi e di materiale
    di moltiplicazione di ortaggi, ad eccezione delle sementi
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 15 februari 1994 tot verlenging van de
    in artikel 16, lid 2, van Richtlijn 92/33/EEG van de Raad bedoelde termijn met
    betrekking tot de invoer van teeltmateriaal en van plantgoed van groentegewassen,
    met uitzondering van zaad, uit derde landen
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 15 de Fevereiro de 1994 que prorroga, no que diz
    respeito à importação de materiais de propagação e plantação de produtos
    hortícolas, com excepção das sementes, a partir de países terceiros, o prazo
    referido no nº 2 do artigo 16º da Directiva 92/33/CEE do Conselho
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 15 de febrero de 1994 por la que se prorroga
    la fecha establecida en el apartado 2 del artículo 16 de la Directiva 92/33/CEE
    del Consejo en lo que respecta a la importación de plantones de hortalizas y
    de materiales de multiplicación de hortalizas, distintos de las semillas, originarios
    de terceros países
  type: main
- language: sv
  script: Latn
  content: '94/152/EG: Kommissionens beslut av den 15 februari 1994 om framflyttning
    av den dag som avses i artikel 16.2 i rådets direktiv 92/33/EEG i fråga om import
    från tredje land av annat föröknings- och plantmaterial av grönsaker än utsäde'
  type: main
