  script: Latn
  content: Commission Regulation (EC) No 756/94 of 5 April 1994 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for processing within the Community and repealing Regulation
    (EC) No 219/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 756/94 de la Commission du 5 avril 1994 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d'intervention en vue de
    leur transformation dans la Communauté et abrogeant le règlement (CE) n° 219/94
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 756/94 DER KOMMISSION vom 5. April 1994 über den Verkauf
    von Rindfleisch, das zur Verarbeitung in der Gemeinschaft bestimmt ist, aus Beständen
    einiger Interventionsstellen nach dem Verfahren der Verordnung (EWG) Nr. 2539/84
    und zur Aufhebung der Verordnung (EG) Nr. 219/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 756/94 af 5. april 1994 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EF)
    nr. 219/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 756/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 5ης Απριλίου 1994 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που βρίσκεται
    στην κατοχή ορισμένων οργανισμών παρέμβασης
    και προορίζεται για μεταποίηση στην Κοινότητα
    και για την κατάργηση του κανονισμού (ΕΚ) αριθ.
    219/94
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 756/94 DELLA COMMISSIONE del 5 aprile 1994 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d' intervento e destinate alla trasformazione
    nella Comunità e recante abrogazione del regolamento (CE) n. 219/94
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 756/94 VAN DE COMMISSIE van 5 april 1994 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor verwerking in de Gemeenschap
    bestemd rundvlees en houdende intrekking van Verordening (EG) nr. 219/94
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 756/94 DA COMISSÃO de 5 de Abril de 1994 relativo
    à venda, no âmbito do procedimento definido no Regulamento (CEE) nº 2539/84,
    de carne de bovino detida por certos organismos de intervenção com vista à
    sua transformação na Comunidade e que revoga o Regulamento (CE) nº 219/94
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 756/94 DE LA COMISIÓN de 5 de abril de 1994 relativo
