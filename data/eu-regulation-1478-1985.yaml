title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1478/85 of 3 June 1985 re-establishing the
    levying of customs duties on raw or unmanufactured tobaccos other than Virginia
    type, falling within subheading 24.01 B, originating in developing countries benefiting
    from the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3564/84
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1478/85 de la Commission du 3 juin 1985 portant rétablissement
    de la perception des droits de douane applicables aux tabacs bruts ou non fabriqués
    autres que du type Virginia, de la sous-position 24.01 B du tarif douanier commun,
    originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3564/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1478/85 der Kommission vom 3. Juni 1985 zur Wiedereinführung
    des Zollsatzes für unverarbeiteten Tabak, anderen als der Sorte ,,Virginia' '
    , der Tarifstelle 24.01 B mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3564/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1478/85 af 3. juni 1985 om genindførelse
    af opkrævning af toldafgifter for rå eller ufabrikeret tobak af andre sorter
    end Virginia under position 24.01 B, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3564/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1478/85 της Επιτροπής
    της 3ης Ιουνίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών που εφαρμόζονται στα
    ακατέργαστα ή μη βιομηχανοποιημένα καπνά,
    εκτός των καπνών του τύπου Virginia, που υπάγονται
    στη διάκριση 24.01 Β του Κοινού Δασμολογίου, καταγωγής
    αναπτυσσόμενων χωρών, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3564/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1478/85 della Commissione del 3 giugno 1985 che ripristina
    la riscossione dei dazi doganali applicabili ai tabacchi grezzi o non lavorati
    diversi dal tipo "Virginia" della sottovoce 24.01 B della tariffa doganale comune,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3564/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1478/85 van de Commissie van 3 juni 1985 houdende
    wederinstelling van de heffing van de invoerrechten voor ruwe tabak en niet tot
    verbruik bereide tabak van andere soorten dan van de soort ,,Virginia' ' , van
    post 24.01 B, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij
    Verordening (EEG) nr. 3564/84 van de Raad tariefpreferenties werden geopend
  type: main
