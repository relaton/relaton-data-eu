    ITTICHE APPLICABILI ALLE NAVI BATTENTI BANDIERA DEL PORTOGALLO NELLE ACQUE SOGGETTE
    ALLA SOVRANITA O ALLA GIURISDIZIONE DI UNO STATO MEMBRO, ESCLUSI LA SPAGNA E IL
    PORTOGALLO
  type: main
- language: nl
  script: Latn
  content: VERORDENING ( EEG ) NR. 3938/90 VAN DE RAAD VAN 20 DECEMBER 1990 TOT VASTSTELLING,
