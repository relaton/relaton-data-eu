    της 20ής Δεκεμβρίου 1990 για τον καθορισμό, για
    το 1991, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με πορτογαλική σημαία στα ύδατα που υπάγονται
    στην κυριαρχία ή τη δικαιοδοσία άλλου κράτους
    μέλους, εκτός της Ισπανίας και της Πορτογαλίας
  type: main
