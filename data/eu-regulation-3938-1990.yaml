title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3938/90 of 20 December 1990 fixing, for 1991,
    certain measures for the conservation and management of fishery resources , applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of a Member State, Apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3938/90 du Conseil, du 20 décembre 1990, fixant,
    pour 1991, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon du Portugal dans les eaux relevant de
    la souveraineté ou de la juridiction d'un État membre, à l'exception de l'Espagne
    et du Portugal
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3938/90 DES RATES VOM 20. DEZEMBER 1990 ZUR FESTLEGUNG
    BESTIMMTER MASSNAHMEN ZUR ERHALTUNG UND BEWIRTSCHAFTUNG DER FISCHEREIRESSOURCEN
    FUER SCHIFFE UNTER PORTUGIESISCHER FLAGGE IN DEN GEWAESSERN UNTER DER HOHEITSGEWALT
    ODER GERICHTSBARKEIT EINES MITGLIEDSTAATS MIT AUSNAHME SPANIENS UND PORTUGALS
    ( 1991 )
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3938/90 af 20. december 1990 om fastsættelse
    for 1991 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der henhører under en medlemsstats højhedsområde eller jurisdiktion, med undtagelse
    af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
