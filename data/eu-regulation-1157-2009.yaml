    o 1918/2006, (CE) n o 1964/2006, (CE) n o 1002/2007, (CE) n o 27/2008, (CE) n
    o 1067/2008 y (CE) n o 828/2009 en lo que atañe a las fechas para la presentación
    de solicitudes y la expedición de certificados de importación en 2010 en el
    marco de contingentes arancelarios de batatas, fécula de mandioca, mandioca,
    cereales, arroz y aceite de oliva, y se establecen excepciones a los Reglamentos
    (CE) n o 382/2008, (CE) n o 1518/2003, (CE) n o 596/2004 y (CE) n o 633/2004 en
    lo que atañe a las fechas de expedición de certificados de exportación en 2010
    en los sectores de la carne de vacuno, la carne de porcino, los huevos y la carne
    de aves de corral
