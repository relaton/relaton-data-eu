title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 636/82 of 16 March 1982 establishing economic
    outward processing arrangements applicable to certain textile and clothing products
    reimported into the Community after working or processing in certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 636/82 du Conseil, du 16 mars 1982, instituant un
    régime de perfectionnement passif économique applicable à certains produits
    textiles et d' habillement réimportés dans la Communauté après ouvraison ou
    transformation dans certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 636/82 des Rates vom 16. März 1982 zur Schaffung
    eines wirtschaftlichen passiven Veredelungsverkehrs für bestimmte Textil- und
    Bekleidungserzeugnisse, die nach Be- oder Verarbeitung in gewissen Drittländern
    wieder in die Gemeinschaft eingeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 636/82 af 16. marts 1982 om indførelse af
    en procedure for økonomisk passiv forædling for visse tekstilvarer og beklædningsgenstande,
    der genindføres til Fællesskabet efter bearbejdning i visse tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 636/82 τού Συμβουλίου
    τής 16ης Μαρτίου 1982 περί συστάσεως οικονομικού
    καθεστώτος τελειοποιήσεως πρός επανεισαγωγή
    πού εφαρμόζεται σέ ορισμένα κλωστοϋφαντουργικά
    καί ενδύματα πού επανεισάγονται στήν Κοινότητα
    μετά από κατεργασία ή μεταποίηση σέ ορισμένες
    τρίτες χώρες
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 636/82, annettu 16 päivänä maaliskuuta 1982,
    tiettyihin tietyissä kolmansissa maissa suoritetun valmistuksen tai käsittelyn
    jälkeen yhteisöön jälleentuotuihin tekstiili- ja vaatetustuotteisiin sovellettavan
    taloudellisesti vaikuttavan ulkoisen jalostusmenettelyn käyttöönotosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 636/82 del Consiglio, del 16 marzo 1982, che istituisce
    un regime economico di perfezionamento passivo applicabile a taluni prodotti tessili
    e d' abbigliamento reimportati nella Comunità dopo aver subito lavorazioni o
    trasformazioni in taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 636/82 van de Raad van 16 maart 1982 houdende instelling
    van een regeling voor economische passieve veredeling die van toepassing is op
    bepaalde textielprodukten en kledingartikelen die worden wederingevoerd in de
    Gemeenschap na bewerking of verwerking in bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 636/82 do Conselho, de 16 de Março de 1982, que
    institui um regime de aperfeiçoamento passivo economicamente aplicável a certos
    produtos têxteis e de vestuário reimportados na Comunidade após complemento
    de fabrico ou transformação em certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 636/82 del Consejo, de 16 de marzo de 1982, por el
    que se establece un régimen de perfeccionamiento pasivo económico aplicable
    a determinados productos textiles y de confección reimportados en la Comunidad
    tras su elaboración o transformación en determinados terceros países
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 636/82 av den 16 mars 1982 om ett förfarande
