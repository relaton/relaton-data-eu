  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2241/91 DELLA COMMISSIONE del 26 luglio 1991 recante
    deroga al regolamento (CEE) n. 3105/88 che stabilisce le modalità di applicazione
    delle distillazioni obbligatorie di cui agli articoli 35 e 36 del regolamento
    (CEE) n. 822/87 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2241/91 VAN DE COMMISSIE van 26 juli 1991 houdende
