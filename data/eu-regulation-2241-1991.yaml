    compulsory distillation as provided for in Articles 35 and 36 of Regulation (EEC)
    No 822/87
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2241/91 DE LA COMMISSION du 26 juillet 1991 portant
