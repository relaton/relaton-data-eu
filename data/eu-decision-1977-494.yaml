---
id: EUDecision1977494
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 May 1977 authorizing the United Kingdom not to
    apply Community treatment to women's woven man-made fibre jackets, suits and costumes,
    falling within heading No ex 61.02 of the Common Customs Tariff, originating in
    Czechoslovakia and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/494/CEE: Décision de la Commission, du 24 mai 1977, autorisant le
    Royaume-Uni à exclure du traitement communautaire les vestes et les costumes
    tailleurs pour femmes, de la position Ex 61.02 du Tarif douanier commun, originaires
    de Tchécoslovaquie et mis en libre pratique dans les États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Mai 1977, mit der das Vereinigte Königreich
    ermächtigt wird, aus der Tschechoslowakei stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Jacken und Schneiderkostüme für Frauen der Tarifnummer
    ex 61.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 24. maj 1977 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage jakker, dragter og kostumer
    til kvinder, som henhører under pos. ex 61.02 i den fælles toldtarif, har oprindelse
    i Tjekkoslovakiet, og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 maggio 1977, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario le giacche e gli abiti-tailleurs
    per donna di cui alla voce ex 61.02 della tariffa doganale comune, originari della
    Cecoslovacchia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 mei 1977 waarbij het Verenigd Koninkrijk
    wordt gemachtigd blazers en jasjes, alsmede mantelpakken en broekpakken, voor
    dames, van post ex 61.02 van het gemeenschappelijk douanetarief, van oorsprong
    uit Tsjechoslowakije en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
