title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1540/2003 of 29 August 2003 amending Regulation
    (EEC) No 1609/88 as regards the latest date by which butter must have been taken
    into storage in order to be sold pursuant to Regulations (EEC) No 3143/85 and
    (EC) No 2571/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1540/2003 de la Commission du 29 août 2003 modifiant
