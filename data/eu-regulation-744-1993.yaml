    toimittamista koskevan täydentävän järjestelmän soveltamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 744/93 del Consiglio, del 17 marzo 1993, che stabilisce
    le norme generali di applicazione del meccanismo complementare applicabile alle
    consegne, in Portogallo, di prodotti diversi dagli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 744/93 van de Raad van 17 maart 1993 tot vaststelling
    van de algemene regels voor de toepassing van de aanvullende regeling voor de
    levering in Portugal van andere produkten dan groenten en fruit
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 744/93 do Conselho, de 17 de Março de 1993, que
    estabelece as regras gerais de aplicação do mecanismo complementar aplicável
    às entregas a Portugal de produtos que não sejam frutas e produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 744/93 del Consejo, de 17 de marzo de 1993, por el
