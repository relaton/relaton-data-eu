  content: Council Regulation (EEC) No 744/93 of 17 March 1993 laying down general
    rules for applying the supplementary trade mechanism to deliveries in Portugal
    of products other than fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 744/93 du Conseil, du 17 mars 1993, déterminant les
    règles générales d'application du mécanisme complémentaire applicable aux
    livraisons, au Portugal, de produits autres que les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 744/93 des Rates vom 17. März 1993 zur Festlegung
    der Grundregeln für die Anwendung des ergänzenden Handelsmechanismus bei der
    Lieferung anderer Erzeugnisse als Obst und Gemüse nach Portugal
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 744/93 af 17. marts 1993 om de almindelige
    gennemførelsesbestemmelser for den supplerende mekanisme for produktleverancer
    til Portugal undtagen leverancer af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 744/93 του Συμβουλίου
    της 17ης Μαρτίου 1993 για τον καθορισμό των γενικών
    κανόνων εφαρμογής του συμπληρωματικού μηχανισμού
    που εφαρμόζεται στις παραδόσεις προϊόντων
    στην Πορτογαλία, πλην των οπωροκηπευτικών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 744/93, annettu 17 päivänä maaliskuuta 1993,
