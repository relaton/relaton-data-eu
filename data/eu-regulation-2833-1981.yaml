    ποσοστών των επιστροφών πού εφαρμόζονται από
    την 1η Οκτωβρίου 1981 σε ορισμένα προϊόντα των
    τομέων των σιτηρών και της όρυζας πού εξάγονται
    υπό μορφή εμπορευμάτων τα οποία δεν αναφέρονται
    στο παράρτημα II της συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2833/81 della Commissione, del 30 settembre 1981,
    che fissa i tassi delle restituzioni applicabili, a decorrere dal 1 ottobre 1981,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2833/81 van de Commissie van 30 september 1981 houdende
