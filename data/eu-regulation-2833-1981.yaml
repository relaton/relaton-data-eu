title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2833/81 of 30 September 1981 fixing the
    rates of the refunds applicable from 1 October 1981 to certain cereal and rice
    products exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2833/81 de la Commission, du 30 septembre 1981, fixant
    les taux des restitutions applicables, à compter du 1er octobre 1981, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2833/81 der Kommission vom 30. September 1981 zur
    Festsetzung der ab 1. Oktober 1981 geltenden Erstattungssätze bei der Ausfuhr
    bestimmter Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des
    Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2833/81 af 30. september 1981 om fastsættelse
    af de restitutionssatser, der fra 1. oktober 1981 skal anvendes for visse produkter
    fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2833/81 της Επιτροπής
