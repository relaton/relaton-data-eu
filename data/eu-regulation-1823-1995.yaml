    Schweinefleisch für den Zeitraum vom 1. Juli 1995 bis zum 30. Juni 1996
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1823/95 af 26. juli 1995 om fastsættelse
