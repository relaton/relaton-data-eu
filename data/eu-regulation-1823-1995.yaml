    juillet 1995 peuvent être acceptées dans le cadre du contingent tarifaire d'importation
    pour certains produits relevant des codes NC ex 0203 19 55 et ex 0203 29 55 dans
    le secteur de la viande de porc pour la période du 1er juillet 1995 au 30 juin
    1996
  type: main
- language: de
  script: Latn
