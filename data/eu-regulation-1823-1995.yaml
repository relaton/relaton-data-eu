  script: Latn
  content: COMMISSION REGULATION (EC) No 1823/95 of 26 July 1995 determining the extent
    to which applications lodged in July 1995 for import licences under the regime
    provided for by a tariff quota for certain products falling within CN codes ex
    0203 19 55 and ex 0203 29 55 in the pigmeat sector for the period from 1 July
    1995 to 30 June 1996
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1823/95 DE LA COMMISSION du 26 juillet 1995 déterminant
