    betreft de minimumafstand van de kust en de minimumdiepte voor bootzegens voor
    de visserij op glasgrondel (Aphia minuta) in de Spaanse territoriale wateren van
    de autonome gemeenschap Murcia
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2026/1002 z dnia 5 maja 2026 r.
    przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w zakresie
    minimalnych odległości od brzegu i minimalnej głębokości morza dla niewodów
