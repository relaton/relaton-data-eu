title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1002 of 5 May 2026 extending
    the derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from the coast and depth granted to boat seines fishing for transparent
    goby (Aphia minuta) within the Spanish territorial waters of the Autonomous Community
    of the Region of Murcia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1002 de la Commission du 5 mai 2026
    prolongeant la dérogation au règlement (CE) no 1967/2006 du Conseil en ce qui
    concerne la distance de la côte et la profondeur minimales pour les sennes de
    bateau pêchant le gobie transparent (Aphia minuta) dans les eaux territoriales
    espagnoles de la Communauté autonome de la région de Murcie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/1002 der Kommission vom 5. Mai 2026
    zur Verlängerung der Ausnahme von der Verordnung (EG) Nr. 1967/2006 des Rates
    hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe für
    Glasgrundeln (Aphia minuta) befischende Bootswaden in den spanischen Hoheitsgewässern
    der Autonomen Gemeinschaft Murcia
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2026/1002 на Комисията
    от 5 май 2026 година за удължаване на срока на
    дерогацията от Регламент (ЕО) № 1967/2006 на Съвета
    по отношение на минималното разстояние от
    брега и минималната дълбочина за улов на стъкленка
    (Аphia minuta) с корабни грибове в териториалните
    води на Испания край автономна област Мурсия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/1002 ze dne 5. května 2026,
    kterým se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud
    jde o minimální vzdálenost od pobřeží a minimální hloubku moře pro lodní
    nevody k lovu hlaváče průsvitného (Aphia minuta) ve španělských teritoriálních
    vodách Autonomního společenství Regionu Murcie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/1002 af 5. maj 2026 om
    forlængelse af den dispensation fra Rådets forordning (EF) nr. 1967/2006 for
    så vidt angår mindsteafstanden fra kysten og mindstedybden, der er givet med
    henblik på fiskeri med vod brugt fra fartøjer, der fisker efter glaskutling
    (Aphia minuta) i de spanske territorialfarvande ud for den selvstyrende region
    Murcia
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2026/1002 της Επιτροπής,
