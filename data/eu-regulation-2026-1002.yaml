    no respeitante à distância mínima da costa e à profundidade mínima concedidas
    para as redes envolventes-arrastantes de alar para bordo utilizadas na pesca do
    caboz-transparente (Aphia minuta) nas águas territoriais espanholas da Comunidade
    Autónoma da Região de Múrcia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2026/1002 al Comisiei din 5 mai
    2026 de prelungire a derogării de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește distanța minimă față de coastă și adâncimea minimă
    pentru năvoadele de navă utilizate pentru pescuitul de guvid alb (Aphia minuta)
    în apele teritoriale spaniole ale Comunității Autonome a Regiunii Murcia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2026/1002 z 5. mája 2026, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o minimálnu vzdialenosť od pobrežia a minimálnu hĺbku pridelenú na lov
    afie priesvitnej (Aphia minuta) záťahovými sieťami ovládanými z lode v španielskych
    pobrežných vodách autonómneho spoločenstva Murcia
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2026/1002 z dne 5. maja 2026 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in najmanjše morske globine za potegalke odprtega morja, ki lovijo belega
    glavača (Aphia minuta) v španskih teritorialnih vodah avtonomne skupnosti regije
    Murcia
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2026/1002 de la Comisión, de 5 de mayo de
