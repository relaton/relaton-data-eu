    od obale i minimalne dubine odobrenog za potegače otvorenog mora koje love mlječastog
    glavočića (Aphia minuta) u španjolskim teritorijalnim vodama Autonomne zajednice
    Murcije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/1002 végrehajtási rendelete (2026. május 5.)
    az 1967/2006/EK tanácsi rendelettől a Murcia régió autonóm közössége spanyol
    felségvizein az üveggéb (Aphia minuta) halászatában alkalmazott, hajóról
    működtetett kerítőhálók parttól számított minimális távolsága és
    telepítésének mélysége tekintetében engedélyezett eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2026/1002 della Commissione, del 5 maggio
    2026, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto concerne la distanza minima dalla costa e la profondità minima, concessa
    alle sciabiche da natante utilizzate per la pesca del rossetto (Aphia minuta)
    nelle acque territoriali spagnole della Comunità autonoma della regione di Murcia
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2026/1002 (2026. gada 5. maijs), ar
    kuru attiecībā uz minimālo attālumu no krasta un minimālo dziļumu, kas Spānijas
    teritoriālajos ūdeņos Mursijas autonomajā apgabalā jāievēro stikla jūrasgrunduļa
    (Aphia minuta) zvejā ar laivas velkamajiem vadiem, pagarina atkāpi no Padomes
    Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2026 m. gegužės 5 d. Komisijos įgyvendinimo reglamentas (ES) 2026/1002,
    kuriuo pratęsiamas nuo Tarybos reglamento (EB) Nr. 1967/2006 nuostatų dėl minimalaus
    atstumo nuo kranto ir gylio nukrypti leidžiančios nuostatos, suteiktos afijų
    (Aphia minuta) žvejybai laivų traukiamaisiais tinklais Ispanijos Mursijos autonominės
    srities teritoriniuose vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/1002 tal-5
    ta’ Mejju 2026 li jestendi d-deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tad-distanza minima mill-kosta kif ukoll il-fond minimu li jingħataw
    lit-tartaruni li jistadu għall-makku (Aphia minuta) fl-ilmijiet territorjali
    Spanjoli tal-Komunità Awtonoma tar-Reġjun ta’ Murcia
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2026/1002 van de Commissie van 5 mei 2026 tot
