title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2953/80 of 14 November 1980 amending for
    the seventh time Regulation (EEC) No 2793/77 on detailed rules of application
    for granting special aid for skimmed milk for use as feed for animals other than
    young calves
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2953/80 de la Commission, du 14 novembre 1980, portant
    septième modification du règlement (CEE) n° 2793/77 relatif aux modalités
    d' application d' une aide spéciale pour le lait écrémé destiné à l' alimentation
    des animaux à l' exclusion des jeunes veaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2953/80 der Kommission vom 14. November 1980 zur siebten
    Änderung der Verordnung (EWG) Nr. 2793/77 über die Durchführungsbestimmungen
    für eine Sonderbeihilfe für Magermilch zur Fütterung von Tieren mit Ausnahme
    von jungen Kälbern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2953/80 af 14. november 1980 om syvende
    ændring af forordning (EØF) nr. 2793/77 om gennemførelsesbestemmelser for en
    særstøtte til skummetmælk, der skal anvendes som foder til husdyr, undtagen
    unge kalve
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2953/80 της Επιτροπής,
