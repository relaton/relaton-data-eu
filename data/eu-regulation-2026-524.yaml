title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/524 of 11 March 2026 amending
    Implementing Regulation (EU) 2023/2834 as regards fixing representative prices
    in the poultrymeat and egg sectors and for egg albumin and Implementing Regulation
    (EU) 2020/1988 as regards the administration of import tariff quotas in accordance
    with the first come, first served principle, and repealing Regulation (EC) No
    1484/95
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/524 de la Commission du 11 mars 2026
    modifiant le règlement d’exécution (UE) 2023/2834 en ce qui concerne la fixation
    des prix représentatifs dans les secteurs de la viande de volaille et des œufs
    ainsi que pour l’ovalbumine et le règlement d’exécution (UE) 2020/1988 en
    ce qui concerne la gestion des contingents tarifaires d’importation conformément
    au principe du premier arrivé, premier servi, et abrogeant le règlement (CE)
    no 1484/95
  type: main
- language: de
  script: Latn
