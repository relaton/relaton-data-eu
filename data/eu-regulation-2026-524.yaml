    der repräsentativen Preise in den Sektoren Geflügelfleisch und Eier sowie für
    Eieralbumin und der Durchführungsverordnung (EU) 2020/1988 hinsichtlich der Verwaltung
    von Einfuhrzollkontingenten nach dem Windhundverfahren sowie zur Aufhebung der
    Verordnung (EG) Nr. 1484/95
