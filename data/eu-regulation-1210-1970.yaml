  content: Règlement (CEE) n° 1210/70 du Conseil, du 29 juin 1970, fixant, pour
    la campagne 1970/1971, les principaux centres de commercialisations des céréales
    et les prix d'intervention dérivés s'y rapportant, ainsi que le prix d'intervention
    pour le maïs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1210/70 des Rates vom 29. Juni 1970 zur Festlegung
    der wesentlichsten Handelsplätze für Getreide und der für diese Handelsplätze
    geltenden abgeleiteten Interventionspreise sowie des Interventionspreises für
    Mais für das Wirtschaftsjahr 1970/1971
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1210/70 del Consiglio, del 29 giugno 1970, che fissa,
    per la campagna 1970/1971, i principali centri di commercializzazione dei cereali
    e i relativi prezzi d'intervento derivati, nonché il prezzo d'intervento per
    il granturco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1210/70 van de Raad van 29 juni 1970 houdende vaststelling
    van de voornaamste commercialisatiecentra voor granen, de voor deze centra geldende
    afgeleide interventieprijzen, alsmede de interventieprijs voor maïs voor het
    verkoopseizoen 1970/1971
