title:
- language: fr
  script: Latn
  content: Décision 67/35/CEE de la Commission, du 22 décembre 1966, portant nouvelle
    prorogation de sa décision du 5 mai 1965 relative à l'autorisation accordée
    à la République italienne d'adopter des mesures de sauvegarde pour certains
    produits du chapitre 50 du tarif douanier italien (soie de déchets de soie)
  type: main
- language: de
  script: Latn
  content: '67/35/EWG: Entscheidung der Kommission vom 22. Dezember 1966 über die
    erneute Verlängerung ihrer Entscheidung vom 5. Mai 1965 betreffend die Ermächtigung
    der Italienischen Republik, für einige Waren des Kapitels 50 des italienischen
    Zolltarifs (Seide und Schappeseide) Schutzmaßnahmen zu erlassen'
  type: main
- language: it
  script: Latn
  content: '67/35/CEE: Decisione della Commissione, del 22 dicembre 1966, che proroga
    nuovamente la propria decisione del 5 maggio 1965 relativa all''autorizzazione
    accordata alla Repubblica italiana di adottare misure di salvaguardia per alcuni
    prodotti del capitolo 50 della tariffa doganale italiana (seta e cascami di seta)'
  type: main
- language: nl
  script: Latn
  content: '67/35/EEG: Beschikking van de Commissie van 22 december 1966 houdende
    nieuwe verlenging van haar beschikking van 5 mei 1965 betreffende de aan de Italiaanse
    Republiek verleende machtiging om vrijwaringsmaatregelen te treffen voor enige
    produkten vallende onder hoofdstuk 50 van het Italiaanse douanetarief (zijde en
    afval van zijde)'
  type: main
