title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1129/79 of 7 June 1979 amending Regulation
    (EEC) No 2822/78 as regards the list of authorized vine varieties which may be
    used for new plantings and replantings until 30 November 1979
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1129/79 de la Commission, du 7 juin 1979, modifiant
    le règlement (CEE) n° 2822/78 en ce qui concerne la liste des variétés de
    vigne autorisées pouvant être utilisées pour les plantations nouvelles et les
    replantations jusqu' au 30 novembre 1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1129/79 der Kommission vom 7. Juni 1979 zur Änderung
    der Verordnung (EWG) Nr. 2822/78 hinsichtlich des Verzeichnisses der zugelassenen
    Sorten, die bis 30. November 1979 für Neuanpflanzungen und Wiederbepflanzungen
    verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1129/79 af 7. juni 1979 om ændring
    af forordning (EØF) nr. 2822/78 for så vidt angår listen over godkendte vinstoksorter,
    der må anvendes til nyplanting og genplanting indtil den 30. november 1979
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1129/79 della Commissione, del 7 giugno 1979, che
    modifica il regolamento (CEE) n. 2822/78 per quanto riguarda l' elenco delle varietà
    di viti autorizzate utilizzabili per i nuovi impianti e i reimpianti fino al 30
    novembre 1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1129/79 van de Commissie van 7 juni 1979 tot wijziging
    van Verordening (EEG) nr. 2822/78 ten aanzien van de lijst van de toegestane wijnstokrassen
    die tot en met 30 november 1979 mogen worden gebruikt bij aanplant en herbeplanting
