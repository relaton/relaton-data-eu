  script: Latn
  content: '2000/463/EC: Commission Decision of 17 July 2000 recognising in principle
    the completeness of the dossier submitted for detailed examination with a view
    to the possible inclusion of MKH 65 61 (propoxycarbazone-sodium) in Annex I to
    Council Directive 91/414/EEC concerning the placing of plant-protection products
    on the market (notified under document number C(2000) 2006)'
  type: main
- language: fr
