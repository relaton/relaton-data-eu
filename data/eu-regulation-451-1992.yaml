title:
- language: en
  script: Latn
  content: Commission Regulation ( EEC ) No 451/92 of 26 February 1992 determining
    the extent to which applications in the beef and veal sector for the issue of
    import licences lodged pursuant to Regulation ( EEC ) No 3701/91 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement ( CEE ) n° 451/92 de la Commission, du 26 février 1992, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d' importation déposées, au titre du règlement ( CEE ) n° 3701/91, dans le
    secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung ( EWG ) Nr. 451/92 der Kommission vom 26. Februar 1992 über
    den Umfang, in dem den Anträgen auf Erteilung von Einfuhrlizenzen für Rindfleisch
    im Rahmen der Verordnung ( EWG ) Nr. 3701/91 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning ( EØF ) nr. 451/92 af 26. februar 1992 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importlicenser for oksekød
    i henhold til forordning ( EØF ) nr. 3701/91 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 451/92 της Επιτροπής,
    της 26ης Φεβρουαρίου 1992 περί προσδιορισμού
    των όρων για την αποδοχή των αιτήσεων εκδόσεως
    πιστοποιητικών εισαγωγής που έχουν υποβληθεί
    βάσει του κανονισμού (ΕΟΚ) αριθ. 3701/91 στον τομέα
    του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento ( CEE ) n. 451/92 della Commissione, del 26 febbraio 1992,
    che stabilisce la misura in cui possono essere accolte le domande di titoli di
    importazione presentate a norma del regolamento ( CEE ) n. 3701/91 nel settore
    delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 451/92 van de Commissie van 26 februari 1992 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de op grond van
    Verordening ( EEG ) nr. 3701/91 ingediende aanvragen om afgifte van invoercertificaten
    in de rundvleessector
  type: main
- language: pt
  script: Latn
  content: Regulamento ( CEE ) n° 451/92 da Comissão, de 26 de Fevereiro de 1992,
    que determina em que medida pode ser dado seguimento aos pedidos de emissão de
    certificados de importação apresentados ao abrigo do Regulamento ( CEE ) n°
    3701/91 no sector da carne de bovino
  type: main
- language: es
  script: Latn
  content: Reglamento ( CEE ) n° 451/92 de la Comisión, de 26 de febrero de 1992,
    por el que se determina en qué medida se podrá dar curso a las solicitudes de
    expedición de certificados de importación presentadas con arreglo al Reglamento
    ( CEE ) n° 3701/91 en en sector de la carne de vacuno
