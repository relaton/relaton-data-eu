title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1999/80 of 28 July 1980 specifying the extent
    to which applications lodged during the month of July 1980 for import licences
    in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1999/80 de la Commission, du 28 juillet 1980, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d' importation déposées au mois de juillet 1980 pour les jeunes bovins mâles
    destinés à l' engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1999/80 der Kommission vom 28. Juli 1980 über das
    Ausmaß, in dem den im Juli 1980 eingereichten Anträgen auf Einfuhrlizenzen für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1999/80 af 28. juli 1980 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i juli
    1980 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1999/80 della Commissione, del 28 luglio 1980, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'
    importazione presentate nel mese di luglio 1980 per i giovani bovini maschi destinati
    all' ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1999/80 van de Commissie van 28 juli 1980 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in juli 1980 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
