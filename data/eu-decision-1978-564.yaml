type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 15 June 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's and boys' industrial and occupational clothing; women's,
    girls' and infants' woven aprons, smock-overalls and other industrial clothing
    (whether or not also suitable for domestic use), of wool, of cotton or of man-made
    textile fibres, falling within heading No ex 61.01 or subheading ex 61.02 B (NIMEXE
    codes 61.01-13; 15; 17; 19 - 61.02-12; 14) of the Common Customs Tariff, originating
    in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/564/CEE: Décision de la Commission, du 15 juin 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vêtements de travail tissés, pour
    hommes et garçonnets, tabliers, blouses et autres vêtements de travail tissés,
    pour femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    ou artificielles, de la position Ex 61.01 et de la sous-position Ex 61.02 B du
    Tarif douanier commun (codes Nimexe : 61.01-13, 15, 17, 19; 61.02-12, 14), originaires
    de Hong-Kong et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 15. Juni 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Arbeits- und Berufskleidung aus Geweben, für Männer und Knaben,
    Schürzen, Kittel und andere Arbeits- und Berufskleidung aus Geweben für Frauen,
    Mädchen und Kleinkinder, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 61.01-13; 15; 17; 19 - 61.02-12; 14) von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 15. juni 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage arbejds- og beskyttelsesbeklædning, vævet, til mænd og drenge, kitler
    og forklæder samt anden arbejds- og beskyttelsesbeklædning, vævet, til kvinder,
    piger og småbørn, af uld, bomuld eller syntetiske eller regenererede fibre,
    som henhører under pos. ex 61.01 og ex 61.02 B (NIMEXE-kode 61.01-13, 15, 17,
    19 - 61.02-12, 14) i den fælles toldtarif, har oprindelse i Hongkong og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 15 giugno 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario indumenti da lavoro, tessuti, per uomo e per ragazzo,
    grembiuli, camiciotti e altri indumenti da lavoro, tessuti, per donna, per ragazza
    e per bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali
    della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale comune
    (codice Nimexe: 61.01-13; 15; 17; 19 - 61.02-12; 14), originari di Hong Kong e
    messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 15 juni 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    werk- en bedrijfskleding, geweven voor heren en jongens, schorten, jasschorten
    en andere werkkleding geweven voor dames, meisjes en kinderen, van wol, van katoen
    of van synthetische of kunstmatige textielvezels van de posten ex 61.01 en ex
    61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-13, 15, 17,
    19 - 61.02-12, 14), van oorsprong uit Hong-Kong en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
