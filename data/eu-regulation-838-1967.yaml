title:
- language: fr
  script: Latn
  content: Règlement n 838/67/CEE de la Commission, du 13 novembre 1967, autorisant
    les États membres à suspendre la perception du prélèvement applicable aux
    betteraves à sucre importées des États membres aux fins de sélection de semences
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 838/67/EWG der Kommission vom 13. November 1967, durch die
    die Mitgliedstaaten ermächtigt werden, die Erhebung der Abschöpfung auf Zuckerrüben,
    die zu Saatzuchtzwecken aus Mitgliedstaaten eingeführt werden, auszusetzen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 838/67/CEE della Commissione, del 13 novembre 1967, che
    autorizza gli Stati membri a importare in esenzione da prelievo le barbabietole
    da zucchero in provenienza dagli Stati membri per scopi di selezione di sementi
  type: main
- language: nl
  script: Latn
  content: Verordening no. 838/67/EEG van de Commissie van 13 november 1967 waarbij
    de Lid-Staten worden gemachtigd tot schorsing van de heffing voor suikerbieten,
    die voor de zaadteelt uit Lid-Staten worden ingevoerd
  type: main
