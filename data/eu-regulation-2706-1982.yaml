title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2706/82 of 7 October 1982 re-establishing
    the levying of customs duties on gelatin and gelatin derivatives, falling within
    subheading 35.03 ex B and originating in Colombia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3601/81 applym
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2706/82 de la Commission, du 7 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés, de la sous-position 35.03 ex B du tarif douanier commun, originaires
    de Colombie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2706/82 der Kommission vom 7. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für Gelatine und ihre Derivate der Tarifstelle 35.03
    ex B, mit Ursprung in Kolumbien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werdend
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2706/82 af 7. oktober 1982 om genindførelse
    af opkrævning af told for gelatine og gelatinederivater, henhørende under pos.
    35.03 ex B og med oprindelse i Colombia, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2706/82 τής Επιτροπής
    τής 7ης Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τίς ζελατίνες καί
    τά παράγωγα αυτών, τής διακρίσεως 35. 03 ex B τού
    Κοινού Δασμολογίου, καταγωγής Κολομβίας, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2706/82 della Commissione, del 7 ottobre 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e loro derivati,
    della sottovoce 35.03 ex B della tariffa doganale comune, originari della Colombia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2706/82 van de Commissie van 7 oktober 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan van postonderverdeling 35.03 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit Colombia, waarvoor de in Verordening (EEG) nr.
    3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
