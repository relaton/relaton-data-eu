title:
- language: en
  script: Latn
  content: '91/203/EEC: Commission Decision of 11 March 1991 on the establishment
    of the Community support framework for Community structural assistance on the
    improvement of the conditions under which fishery and aquaculture products are
    processed and marketed in Italy (with the exception of the following regions:
    Abruzzi, Basilicata, Calabria, Campania, Molise, Puglia, Sardinia, Sicily) (Only
    the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/203/CEE: Décision de la Commission du 11 mars 1991 concernant l''établissement
    du cadre communautaire d''appui pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits de la pêche et de l''aquaculture en Italie (à l''exception des
    régions suivantes: Abruzzi, Basilicata, Calabria, Campania, Molise, Puglia, Sardegna,
    Sicilia) (Le texte en langue italienne est le seul faisant foi.)'
  type: main
