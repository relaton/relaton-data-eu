title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2213/75 of the Commission of 26 August 1975 correcting
    Regulation (EEC) No 2104/75 amending Regulation (EEC) No 193/75 and laying down
    special detailed rules for the application of the system of import licences and
    advance fixing certificates for products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2213/75 de la Commission, du 26 août 1975, rectifiant
    le règlement (CEE) n° 2104/75 modifiant le règlement (CEE) n° 193/75 et portant
    modalités particulières d' application du régime des certificats d' importation
    et de préfixation dans le secteur des produits transformés à base de fruits
    et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2213/75 der Kommission vom 26. August 1975 zur Berichtigung
    der Verordnung (EWG) Nr. 2104/75 zur Änderung der Verordnung (EWG) Nr. 193/75
    und über besondere Durchführungsbestimmungen für Einfuhrlizenzen und Vorausfestsetzungsbescheinigungen
    für Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2213/75 af 26. august 1975 om berigtigelse
    af forordning (EØF) nr. 2104/75 om ændring af forordning (EØF) nr. 193/75 og
    om de særlige gennemførelsesbestemmelser for ordningen med importlicenser og
    forudfastsættelsesattester for produkter forarbejdet på basis af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2213/75 της Επιτροπής
    της 26ης Αυγούστου 1975 περί διορθώσεως του κανονισμού
    (ΕΟΚ) αριθ. 2104/75 περί τροποποιήσεως του κανονισμού
    (ΕΟΚ) αριθ. 193/75 και περί ειδικών λεπτομερειών
    εφαρμογής του καθεστώτος των πιστοποιητικών
    εισαγωγής και προκαθορισμού στον τομέα των
    μεταποιημένων προϊόντων με βάση τα οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2213/75 della Commissione, del 26 agosto 1975, rettificativo
    del regolamento (CEE) n. 2104/75 che modifica il regolamento (CEE) n. 193/75 e
    stabilisce modalità particolari d' applicazione del regime dei titoli d' importazione
    e di fissazione anticipata nel settore dei prodotti trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2213/75 van de Commissie van 26 augustus 1975 houdende
    rectificatie van Verordening (EEG) nr. 2104/75 tot wijziging van Verordening (EEG)
    nr. 193/75 en houdende bijzondere uitvoeringsbepalingen inzake het stelsel van
    invoer- en voorfixatiecertificaten in de sector van op basis van groenten en fruit
    verwerkte produkten
  type: main
