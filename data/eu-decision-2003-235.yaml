    membres autorisent l''importation de certains produits visés par la directive
    92/118/CEE du Conseil en ce qui concerne les importations de cuisses de grenouilles
    en provenance d''Égypte (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2003) 1093]'
  type: main
