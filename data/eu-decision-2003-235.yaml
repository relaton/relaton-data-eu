  content: '2003/235/EC: Commission Decision of 3 April 2003 amending Decision 94/278/EC
    drawing up a list of third countries from which Member States authorise imports
    of certain products subject to Council Directive 92/118/EEC, with respect to imports
    of frogs'' legs from Egypt (Text with EEA relevance) (notified under document
    number C(2003) 1093)'
  type: main
- language: fr
  script: Latn
  content: '2003/235/CE: Décision de la Commission du 3 avril 2003 modifiant la décision
