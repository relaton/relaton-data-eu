title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1900/80 of 15 July 1980 amending for the second
    time Regulation (EEC) No 564/80 laying down general rules on distillation operations
    for table wines for which the delivery contract must be approved before 15 April
    1980
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1900/80 du Conseil, du 15 juillet 1980, modifiant
    pour la deuxième fois le règlement (CEE) n° 564/80 établissant les règles
    générales relatives à des opérations de distillation des vins de table dont
    le contrat de livraison doit être agréé avant le 15 avril 1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1900/80 des Rates vom 15. Juli 1980 zur zweiten Änderung
    der Verordnung (EWG) Nr. 564/80 über die Grundregeln für die Destillation von
    Tafelweinen, für welche der Liefervertrag vor dem 15. April 1980 genehmigt sein
    muß
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1900/80 af 15. juli 1980 om anden ændring
    af forordning (EØF) nr. 564/80 om fastsættelse af generelle regler for destillation
    af bordvin, i forbindelse med hvilken leveringskontrakten skal være godkendt
    inden den 15. april 1980
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1900/80 del Consiglio, del 15 luglio 1980, che modifica
    per la seconda volta il regolamento (CEE) n. 564/80 che stabilisce le norme generali
    per operazioni di distillazione dei vini da tavola il cui contratto di consegna
    deve essere approvato prima del 15 aprile 1980
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1900/80 van de Raad van 15 juli 1980 houdende tweede
    wijziging van Verordening (EEG) nr. 564/80 tot vaststelling van de algemene voorschriften
    voor de distillatie van tafelwijn waarvoor het leveringscontract vóór 15 april
    1980 moet zijn goedgekeurd
  type: main
