title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2520/77 of 15 November 1977 re-establishing
    the levying of customs duties on wrought plates, sheets and strip, of copper falling
    within heading No 74.04, originating in Yugoslavia to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2520/77 de la Commission, du 15 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en cuivre, de la position tarifaire 74.04, originaires
    de la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2520/77 der Kommission vom 15. November 1977 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Kupfer, der Tarifnummer
    74.04, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2520/77 af 15. november 1977 om genindførelse
    af opkrævning af toldafgifter for plader og bånd, af kobber, under position
    74.04, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2520/77 della Commissione, del 15 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri di rame, della voce doganale 74.04, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2520/77 van de Commissie van 15 november 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op platen,
    bladen en strippen, van koper, van post 74.04, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
