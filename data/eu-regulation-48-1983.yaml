title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 48/83 of 10 January 1983 re-establishing
    the levying of customs duties on chloramphenicol (INN), falling within subheading
    29.44 B and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 48/83 de la Commission du 10 janvier 1983 portant rétablissement
    de la perception des droits de douane applicables au chloramphénicol (DCI) de
    la sous-position 29.44 B du tarif douanier commun, originaire de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 48/83 der Kommission vom 10. Januar 1983 zur Wiedereinführung
    der Erhebung der Zölle für Chloramphenicol (INN) der Tarifstelle 29.44 B, mit
    Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 48/83 af 10. januar 1983 om genindførelse
    af opkrævning af told for chloramphenicol (INN) henhørende under pos. 29.44
    B og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
