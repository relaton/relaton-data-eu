title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1315 of 6 August 2021 concerning
    the extension of the action taken by the Polish Office for Registration of Medicinal
    Products, Medical Devices and Biocidal Products permitting the making available
    on the market and use of the biocidal product Biobor JF in accordance with Article
    55(1) of Regulation (EU) No 528/2012 of the European Parliament and of the Council
    (notified under document C(2021) 5821) (Only the Polish text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1315 de la Commission du 6 août 2021
    concernant la prorogation de la mesure prise par l’office polonais d’enregistrement
    des médicaments, des dispositifs médicaux et des produits biocides autorisant
    la mise à disposition sur le marché et l’utilisation du produit biocide Biobor
    JF conformément à l’article 55, paragraphe 1, du règlement (UE) no 528/2012
    du Parlement européen et du Conseil [notifiée sous le numéro C(2021) 5821]
    (Le texte en langue polonaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1315 der Kommission vom 6. August 2021
