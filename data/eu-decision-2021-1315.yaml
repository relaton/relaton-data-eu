    Medizinprodukten und Biozidprodukten ergriffenen Maßnahme zur Gestattung der
    Bereitstellung auf dem Markt und der Verwendung des Biozidprodukts Biobor JF gemäß
    Artikel 55 Absatz 1 der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments
    und des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 5821) (Nur der polnische
    Text ist verbindlich)
  type: main
