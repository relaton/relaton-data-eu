title:
- language: fr
  script: Latn
  content: Décision 66/257/CEE de la Commission, du 18 avril 1966, relative au recours
    de la République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité,
    pour exclure du traitement communautaire "les fils de fibres textiles synthétiques
    et artificielles" de la position 51.01, originaires de Tchécoslovaquie et mis
    en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '66/257/EWG: Entscheidung der Kommission vom 18. April 1966 über den Antrag
    der Bundesrepublik Deutschland gemäß Artikel 115 Absatz (1) des Vertrages, um
    aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche "Kunstseidengarne, nicht in Aufmachungen für den Einzelverkauf",
    der Tarifnummer 51.01, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/257/CEE: Decisione della Commissione, del 18 aprile 1966, relativa
    al ricorso della Repubblica federale di Germania all''articolo 115, primo comma,
    del Trattato, per escludere dal trattamento comunitario i « filati di fibre tessili
    sintetiche ed artificiali» di cui alla voce doganale 51.01, originari della Cecoslovacchia
    ed immessi in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/257/EEG: Beschikking van de Commissie van 18 april 1966 betreffende
    het verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea, van het Verdrag "garens van synthetische of van kunstmatige vezels", van
    tariefpost 51.01, die van oorsprong zijn uit Tsjechoslowakije en in de andere
    Lid- Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
