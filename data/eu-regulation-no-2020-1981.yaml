title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2020/81 of 17 July 1981 laying down detailed
    rules implementing the system of aid for the use of grapes, grape must and concentrated
    grape must for the manufacture of grape juice and fixing the amounts of aid for
    the 1981/82 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2020/81 de la Commission, du 17 juillet 1981, portant
    modalités d' application du régime d' aide à l' utilisation de raisins, de
    moûts de raisins et de moûts de raisins concentrés en vue de l' élaboration
    du jus de raisins et fixant les montants de l' aide pour la campagne viticole
    1981/1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2020/81 der Kommission vom 17. Juli 1981 über Durchführungsbestimmungen
    zu der Beihilferegelung für die Verwendung von Trauben, Traubenmost und konzentriertem
    Traubenmost zur Herstellung von Traubensaft und zur Festsetzung des Beihilfebetrags
    für das Weinwirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2020/81 af 17. juli 1981 om gennemførelsesbestemmelserne
    for støtteordningen vedrørende anvendelse af druer, druemost og koncentreret
    druemost med henblik på forarbejdning samt om fastsættelse af støttebeløbene
    for vinproduktionsåret 1981/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2020/81 τής Επιτροπής
