title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/781 of 15 May 2019 concerning
    the authorisation of a preparation of 3-phytase produced by Komagataella phaffii
    (CECT 13094) as a feed additive for chickens for fattening or reared for laying,
    laying hens and minor poultry species for fattening, for breeding and reared for
    laying (holder of authorisation Fertinagro Nutrientes S.L.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2019/781 de la Commission du 15 mai 2019
    concernant l''autorisation d''une préparation de 3-phytase produite par Komagataella
    phaffii (CECT 13094) en tant qu''additif pour l''alimentation des poulets d''engraissement
    ou des poulettes destinées à la ponte, des poules pondeuses et des espèces
    aviaires mineures destinées à l''engraissement, à la reproduction et à la
    ponte (titulaire de l''autorisation: Fertinagro Nutrientes S.L.)'
  type: main
