    par barības piedevu gaļas cāļiem vai dējējvistu cāļiem, dējējvistām
    un mazāk izplatītu sugu gaļas mājputniem, vaislas mājputniem un dējējmājputniem
    (atļaujas turētājs Fertinagro Nutrientes S.L.)
  type: main
