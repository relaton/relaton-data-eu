title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1195/80 of 12 May 1980 re-establishing the
    levying of customs duties on benzoic acid and its salts and esters, falling within
    subheading 29.14 D I and originating in China, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1195/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    benzoïque, ses sels et esters, de la sous-position 29.14 D I du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1195/80 der Kommission vom 12. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Benzoesäure, ihre Salze und Ester, der Tarifstelle 29.14
    D I, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1195/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for benzoesyre samt salte og estere deraf, under
    underpos. 29.14 D I, som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1195/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' acido benzoico, suoi
    sali e suoi esteri, della sottovoce 29.14 D I della tariffa doganale comune, originari
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1195/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op benzoëzuur,
    alsmede zouten en esters daarvan, van post 29.14 D I, van oorsprong uit China,
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
