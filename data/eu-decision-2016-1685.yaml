---
id: EUDecision20161685
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/1685 of 16 September 2016 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified maize Bt11 × MIR162 × MIR604 × GA21, and genetically modified
    maizes combining two or three of the events Bt11, MIR162, MIR604 and GA21, and
    repealing Decisions 2010/426/EU, 2011/892/EU, 2011/893/EU and 2011/894/EU (notified
    under document C(2016) 5746)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/1685 de la Commission du 16 septembre
    2016 autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié Bt11 × MIR162 × MIR604 × GA21, consistant en ce maïs ou produits
    à partir de celui-ci et les maïs génétiquement modifiés combinant deux ou
    trois des événements Bt11, MIR162, MIR604 et GA21, et abrogeant les décisions
    2010/426/UE, 2011/892/UE, 2011/893/UE et 2011/894/UE [notifiée sous le numéro
    C(2016) 5746]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/1685 der Kommission vom 16. September
    2016 über die Zulassung des Inverkehrbringens von Erzeugnissen, die aus der genetisch
    veränderten Maissorte Bt11 × MIR162 × MIR604 × GA21 bestehen, diese enthalten
    oder aus dieser gewonnen werden, und von genetisch veränderten Maissorten, die
    zwei oder drei der GV-Ereignisse Bt11, MIR162, MIR604 und GA21 kombinieren, sowie
    zur Aufhebung der Beschlüsse 2010/426/EU, 2011/892/EU, 2011/893/EU und 2011/894/EU
    (Bekannt gegeben unter Aktenzeichen C(2016) 5746)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/1685 на Комисията
    от 16 септември 2016 година за разрешаване на
    пускането на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    царевица Bt11 × MIR162 × MIR604 × GA21 и генетично модифицираните
    видове царевица, съвместяващи две или три от
    събитията Bt11, MIR162, MIR604 и GA21, и за отмяна на решения
    2010/426/ЕС, 2011/892/ЕС, 2011/893/ЕС и 2011/894/ЕС (нотифицирано
    под номер С(2016) 5746)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/1685 ze dne 16. září 2016
    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    Bt11 × MIR162 × MIR604 × GA21 a geneticky modifikované kukuřice kombinující
    dvě nebo tři události Bt11, MIR162, MIR604 a GA21, sestávají z nich nebo
    jsou z nich vyrobeny, na trh a o zrušení rozhodnutí 2010/426/EU, 2011/892/EU,
    2011/893/EU a 2011/894/EU (oznámeno pod číslem C(2016) 5746)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/1685 af 16. september
    2016 om tilladelse til markedsføring af produkter, der indeholder, består af
    eller er fremstillet af genetisk modificeret Bt11 × MIR162 × MIR604 × GA21-majs
    og genetisk modificeret majs, der kombinerer to eller tre af begivenhederne Bt11,
    MIR162, MIR604 og GA21, og om ophævelse af afgørelse 2010/426/EU, 2011/892/EU,
    2011/893/EU og 2011/894/EU (meddelt under nummer C(2016) 5746)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/1685 της Επιτροπής,
    της 16ης Σεπτεμβρίου 2016, για την έγκριση της
    διάθεσης στην αγορά προϊόντων που περιέχουν,
    αποτελούνται ή παράγονται από γενετικώς τροποποιημένο
    αραβόσιτο Bt11 × MIR162 × MIR604 × GA21 και γενετικώς
    τροποποιημένους αραβοσίτους που συνδυάζουν
    δύο ή τρία από τα συμβάντα Bt11, MIR162, MIR604 και GA21
    και για την κατάργηση των αποφάσεων 2010/426/ΕΕ,
    2011/892/ΕΕ, 2011/893/ΕΕ και 2011/894/ΕΕ [κοινοποιηθείσα
    υπό τον αριθμό C(2016) 5746]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/1685, 16. september 2016, millega lubatakse
    lasta turule tooteid, mis sisaldavad geneetiliselt muundatud maisi Bt11 × MIR162
    × MIR604 × GA21, samuti geneetiliselt muundatud maisi, milles on kombineeritud
    kaks või kolm Bt11, MIR162, MIR604 või GA21 transformatsioonidest, ja neist
    GMOdest koosnevaid või valmistatud tooteid ning tunnistatakse kehtetuks otsused
    2010/426/EL, 2011/892/EL, 2011/893/EL ja 2011/894/EL (teatavaks tehtud numbri
    C(2016) 5746 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/1685, annettu 16 päivänä
    syyskuuta 2016, muuntogeenistä maissia Bt11 × MIR162 × MIR604 × GA21 sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden sekä kahdesta tai kolmesta
    geeenimuunnostapahtumasta Bt11, MIR162, MIR604 ja GA21 muodostettujen geenimuunnosyhdistelmien
    markkinoille saattamisen sallimisesta ja päätösten 2010/426/EU, 2011/892/EU,
    2011/893/EU ja 2011/894/EU kumoamisesta (tiedoksiannettu numerolla C(2016) 5746)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/1685 оd 16. rujna 2016. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    Bt11 × MIR162 × MIR604 × GA21, sastoje se ili su proizvedeni od njega i stavljanja
    na tržište genetski modificiranog kukuruza kombinacijom dvaju ili triju promjena
    Bt11, MIR162, MIR604 i GA21 te stavljanju zvan snage odluka 2010/426/EU, 2011/892/EU,
    2011/893/EU i 2011/894/EU (priopćeno pod brojem dokumenta C(2016) 5746)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1685 végrehajtási határozata (2016. szeptember
    16.) a géntechnológiával módosított Bt11 × MIR162 × MIR604 × GA21 kukoricát
    tartalmazó, abból álló vagy abból előállított termékek, valamint a Bt11,
    MIR162, MIR604 és GA21 génmódosítási események közül kettőt vagy hármat
    ötvöző, géntechnológiával módosított kukoricák forgalomba hozataláról,
    továbbá a 2010/426/EU, a 2011/892/EU, a 2011/893/EU és a 2011/894/EU határozat
    hatályon kívül helyezéséről (az értesítés a C(2016) 5746. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/1685 della Commissione, del 16 settembre
    2016, che autorizza l'immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato Bt11 × MIR162 × MIR604 × GA21,
    e da varietà di granturco geneticamente modificato che combinano due o tre degli
    eventi Bt11, MIR162, MIR604 e GA21, e che abroga le decisioni 2010/426/UE, 2011/892/UE,
    2011/893/UE e 2011/894/UE [notificata con il numero C(2016) 5746]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/1685 (2016. gada 16. septembris),
    ar ko atļauj laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu
    Bt11 × MIR162 × MIR604 × GA21 un ģenētiski modificētās kukurūzas, kurās
    kombinēti divi vai trīs no notikumiem Bt11, MIR162, MIR604 un GA21, no tām
    sastāv vai no tām ražoti, un atceļ Lēmumus 2010/426/ES, 2011/892/ES, 2011/893/ES
    un 2011/894/ES (izziņots ar dokumenta numuru C(2016) 5746)
  type: main
- language: lt
  script: Latn
  content: 2016 m. rugsėjo 16 d. Komisijos įgyvendinimo sprendimas (ES) 2016/1685,
    kuriuo leidžiama pateikti rinkai produktus, kurių sudėtyje yra genetiškai
    modifikuotų kukurūzų Bt11 × MIR162 × MIR604 × GA21 ir genetiškai modifikuotų
    kukurūzų su dviem arba trimis modifikacijomis iš Bt11, MIR162, MIR604 ir GA21,
    kurie iš jų sudaryti arba kurie iš jų pagaminti, ir kuriuo panaikinami sprendimai
    2010/426/ES, 2011/892/ES, 2011/893/ES ir 2011/894/ES (pranešta dokumentu Nr.
    C(2016) 5746)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/1685 tas-16
    ta' Settembru 2016 li tawtorizza t-tqegħid fis-suq ta' prodotti li fihom, jew
    li huma magħmula jew prodotti mill-qamħirrum ġenetikament modifikat Bt11 ×
    MIR162 × MIR604 × GA21, u mill-qamħirrum ġenetikament modifikat bit-tgħaqqid
    ta' tnejn jew tlieta mill-eventi Bt11, MIR162, MIR604 u GA21, u li tħassar id-Deċiżjonijiet
    2010/426/UE, 2011/892/UE, 2011/893/UE u 2011/894/UE (notifikata bid-dokument C(2016)
    5746)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/1685 van de Commissie van 16 september 2016
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais Bt11 × MIR162 × MIR604 × GA21, en genetisch gemodificeerde maissoorten
    die twee of drie van de transformatiestappen Bt11, MIR162, MIR604 en GA21 combineren,
    en tot intrekking van de Besluiten 2010/426/EU, 2011/892/EU, 2011/893/EU en 2011/894/EU
    (Kennisgeving geschied onder nummer C(2016) 5746)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/1685 z dnia 16 września 2016 r. w
    sprawie zezwolenia na wprowadzenie do obrotu produktów zawierających zmodyfikowaną
    genetycznie kukurydzę Bt11 × MIR162 × MIR604 × GA21 oraz zmodyfikowane genetycznie
    rodzaje kukurydzy łączące dwie lub trzy modyfikacje Bt11, MIR162, MIR604 i
    GA21 i produktów składających się z wymienionych rodzajów zmodyfikowanej
    genetycznie kukurydzy lub z niej wyprodukowanych oraz w sprawie uchylenia decyzji
    2010/426/UE, 2011/892/UE, 2011/893/UE i 2011/894/UE (notyfikowana jako dokument
    nr C(2016) 5746)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/1685 da Comissão, de 16 de setembro de
    2016, que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por, ou produzidos a partir de milho geneticamente modificado Bt11 × MIR162 ×
    MIR604 × GA21, e de milhos geneticamente modificados que combinam dois ou três
    dos eventos Bt11, MIR162, MIR604 e GA21, e que revoga as Decisões 2010/426/UE,
    2011/892/UE, 2011/893/UE e 2011/894/UE [notificada com o número C(2016) 5746]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/1685 a Comisiei din 16 septembrie
    2016 de autorizare a introducerii pe piață a produselor care conțin, sunt compuse
    sau fabricate din porumb modificat genetic Bt11 × MIR162 × MIR604 × GA21 și
    din soiuri de porumb modificat genetic obținut din combinarea a două sau trei
    dintre evenimentele Bt11, MIR162, MIR604 și GA21 și de abrogare a Deciziilor
    2010/426/UE, 2011/892/UE, 2011/893/UE și 2011/894/UE [notificată cu numărul
    C(2016) 5746]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/1685 zo 16. septembra 2016,
    ktorým sa povoľuje uvádzať na trh produkty, ktoré obsahujú, sú zložené
    alebo vyrobené z geneticky modifikovanej kukurice Bt11 × MIR162 × MIR604 ×
    GA21 a geneticky modifikovaných kukuríc kombinujúcich dve alebo tri z transformácií
    Bt11, MIR162, MIR604 a GA21, a ktorým sa zrušujú rozhodnutia 2010/426/EÚ,
    2011/892/EÚ, 2011/893/EÚ a 2011/894/EÚ [oznámené pod číslom C(2016) 5746]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/1685 z dne 16. septembra 2016 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo Bt11 × MIR162
    × MIR604 × GA21, so iz nje sestavljeni ali proizvedeni, in gensko spremenjenih
    koruz, v katerih so združeni dva ali trije od dogodkov Bt11, MIR162, MIR604 in
    GA21, ter o razveljavitvi sklepov 2010/426/EU, 2011/892/EU, 2011/893/EU in 2011/894/EU
    (notificirano pod dokumentarno številko C(2016) 5746)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/1685 de la Comisión, de 16 de septiembre
    de 2016, por la que se autoriza la comercialización de productos que contengan,
    se compongan o se hayan producido a partir de maíz modificado genéticamente
    Bt11 × MIR162 × MIR604 × GA21 y de maíces modificados genéticamente que combinen
    dos o tres de los eventos Bt11, MIR162, MIR604 y GA21, y por la que se derogan
    las Decisiones 2010/426/UE, 2011/892/UE, 2011/893/UE y 2011/894/UE [notificada
    con el número C(2016) 5746]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/1685 av den 16 september 2016
    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av genetiskt modifierad Bt11 × MIR162 × MIR604
    × GA21-majs och av genetiskt modifierad majs som kombinerar två eller tre av
    händelserna Bt11, MIR162, MIR604 och GA21 samt om upphävande av besluten 2010/426/EU,
    2011/892/EU, 2011/893/EU och 2011/894/EU [delgivet med nr C(2016) 5746]
