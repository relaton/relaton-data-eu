title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3145/91 of 29 October 1991 postponing the
    date for the take-over of beef and veal offered for sale by the intervention agencies
    pursuant to Regulation (EEC) No 2848/89
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3145/91 DE LA COMMISSION du 29 octobre 1991 reportant
    la date de prise en charge de la viande bovine mise en vente par les organismes
    d'' intervention au titre du règlement (CEE) no 2848/89 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3145/91 DER KOMMISSION vom 29. Oktober 1991 zur Verschiebung
    des Übernahmetermins für von den Interventionsstellen nach der Verordnung (EWG)
    Nr. 2848/89 zum Verkauf angebotenes Rindfleisch #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3145/91 af 29. oktober 1991 om anvendelse
    af senere overtagelsesdato på kød udbudt til salg af interventionsorganerne
    i henhold til forordning (EØF) nr. 2848/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3145/91 της Επιτροπής,
    της 29ης Οκτωβρίου 1991, περί μεταφοράς της ημερομηνίας
    του βοείου κρέατος που τέθηκε προς πώληση από
    τους οργανισμούς παρέμβασης δυνάμει του κανονισμού
    ( ΕΟΚ ) αριθ. 2848/89
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3145/91 DELLA COMMISSIONE del 29 ottobre 1991 che
    rinvia la data di presa in consegna delle carni bovine messe in vendita dagli
    organismi d'' intervento a titolo del regolamento (CEE) n. 2848/89 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3145/91 VAN DE COMMISSIE van 29 oktober 1991 houdende
    verschuiving van de overnamedatum voor door de interventiebureaus krachtens Verordening
    (EEG) nr. 2848/89 te koop aangeboden rundvlees #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3145/91 DA COMISSÃO de 29 de Outubro de 1991 que
    adia a data da tomada a cargo da carne de bovino posta à venda pelos organismos
    de intervenção ao abrigo do Regulamento (CEE) no 2848/89 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3145/91 DE LA COMISIÓN de 29 de octubre de 1991 por
    el que se retrasa la fecha en que los organismos de intervención se han hecho
    cargo de la carne de vacuno puesta a la venta por los organismos de intervención
    en virtud del Reglamento (CEE) no 2848/89 #'
