title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 761/83 of 29 March 1983 re-establishing
    the levying of customs duties on methanol, falling within subheading 29.04 A I
    and originating in Mexico, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 761/83 de la Commission du 29 mars 1983 portant rétablissement
    de la perception des droits de douane applicables au méthanol, de la sous-position
    29.04 A I du tarif douanier commun, originaire du Mexique, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 761/83 der Kommission vom 29. März 1983 zur Wiedereinführung
