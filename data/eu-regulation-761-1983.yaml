    in Mexiko, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 761/83 af 29. marts 1983 om genindførelse
    af opkrævning af told for methanol, henhørende under pos. 29.04 A I og med oprindelse
    i Mexico, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3377/82
  type: main
