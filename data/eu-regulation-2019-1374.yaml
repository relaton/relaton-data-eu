- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1374 of 26 August 2019 reopening
    of the investigation following the judgment of 3 July 2019, in case C-644/17 Eurobolt,
    with regard to Council Implementing Regulation (EU) No 723/2011 of 18 July 2011
    extending the definitive anti-dumping duty imposed by Regulation (EC) No 91/2009
    on imports of certain iron or steel fasteners originating in the People's Republic
    of China to imports of certain iron or steel fasteners consigned from Malaysia,
    whether declared as originating in Malaysia or not
  type: main
