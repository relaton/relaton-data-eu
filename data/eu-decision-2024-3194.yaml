---
id: EUDecision20243194
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/3194 of 19 December 2024 on
    the recognition of the REDcert-EU voluntary scheme for demonstrating compliance
    with the requirements for biofuels, bioliquids, biomass fuels, renewable fuels
    of non-biological origin and recycled carbon fuels set out in Directive (EU) 2018/2001
    of the European Parliament and of the Council, and repealing Commission Implementing
    Decision (EU) 2022/605
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/3194 de la Commission du 19 décembre
    2024 portant reconnaissance du système volontaire REDcert-EU pour l’établissement
    de la conformité avec les exigences applicables aux biocarburants, aux bioliquides,
    aux combustibles issus de la biomasse, aux carburants renouvelables d’origine
    non biologique et aux carburants à base de carbone recyclé énoncées dans la
    directive (UE) 2018/2001 du Parlement européen et du Conseil, et abrogeant la
    décision d’exécution (UE) 2022/605 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/3194 der Kommission vom 19. Dezember
    2024 über die Anerkennung des freiwilligen Systems REDcert-EU zum Nachweis der
    Einhaltung der in der Richtlinie (EU) 2018/2001 des Europäischen Parlaments und
    des Rates festgelegten Anforderungen für Biokraftstoffe, flüssige Biobrennstoffe,
    Biomasse-Brennstoffe, erneuerbare Brenn- und Kraftstoffe nicht biogenen Ursprungs
    und wiederverwertete kohlenstoffhaltige Kraftstoffe und zur Aufhebung des Durchführungsbeschlusses
    (EU) 2022/605 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2024/3194 на Комисията
    от 19 декември 2024 година за признаване на доброволната
    схема REDcert-EU за доказване на спазването на изискванията
    за биогорива, течни горива от биомаса, газообразни
    и твърди горива от биомаса, възобновяеми горива
    от небиологичен произход и рециклирани въглеродни
    горива, които са определени в Директива (ЕС)
    2018/2001 на Европейския парламент и на Съвета,
    и за отмяна на Решение за изпълнение (ЕС) 2022/605
    на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/3194 ze dne 19. prosince 2024
    o uznání nepovinného režimu REDcert-EU pro prokázání souladu s požadavky
    na biopaliva, biokapaliny, paliva z biomasy, paliva z obnovitelných zdrojů nebiologického
    původu a recyklovaná paliva s obsahem uhlíku stanovenými ve směrnici Evropského
    parlamentu a Rady (EU) 2018/2001 a o zrušení prováděcího rozhodnutí Komise
    (EU) 2022/605
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/3194 af 19. december
    2024 om anerkendelse af den frivillige ordning REDcert-EU til påvisning af overholdelsen
    af kravene i Europa-Parlamentets og Rådets direktiv (EU) 2018/2001 vedrørende
    biobrændstoffer, flydende biobrændsler og biomassebrændsler, vedvarende brændstoffer,
    der ikke er af biologisk oprindelse, og genanvendte kulstofbrændstofbrændsler
    og om ophævelse af Kommissionens gennemførelsesafgørelse (EU) 2022/605
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/3194 της Επιτροπής,
    της 19ης Δεκεμβρίου 2024, σχετικά με την αναγνώριση
    του εθελοντικού καθεστώτος REDcert-EU για την απόδειξη
    της συμμόρφωσης με τις απαιτήσεις για τα βιοκαύσιμα,
    βιορευστά, καύσιμα βιομάζας, ανανεώσιμα καύσιμα
    μη βιολογικής προέλευσης και καύσιμα ανακυκλωμένου
    άνθρακα που ορίζονται στην οδηγία (ΕΕ) 2018/2001
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου,
    και για την κατάργηση της εκτελεστικής απόφασης
    (ΕΕ) 2022/605 της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2024/3194, 19. detsember 2024, milles käsitletakse
    vabatahtliku kava REDcert-EU tunnustamist Euroopa Parlamendi ja nõukogu direktiivis
    (EL) 2018/2001 biokütuste, vedelate biokütuste, biomasskütuste, muust kui bioloogilise
    päritoluga taastuvtoorainest valmistatud kütuste ja ringlussevõetud süsinikupõhiste
    kütuste jaoks kehtestatud nõuete täitmise tõendamisel ning millega tunnistatakse
    kehtetuks komisjoni rakendusotsus (EL) 2022/605
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2024/3194, annettu 19 päivänä
    joulukuuta 2024, vapaaehtoisen järjestelmän REDcert-EU hyväksymisestä Euroopan
    parlamentin ja neuvoston direktiivissä (EU) 2018/2001 vahvistettujen vaatimusten
    noudattamisen osoittamista varten biopolttoaineiden, bionesteiden, biomassapolttoaineiden,
    muuta kuin biologista alkuperää olevien uusiutuvien polttoaineiden ja kierrätettyjen
    hiilipitoisten polttoaineiden osalta sekä komission täytäntöönpanopäätöksen
    (EU) 2022/605 kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2024/3194 ón gCoimisiún an 19 Nollaig
    2024 maidir le haitheantas a thabhairt don scéim deonach REDcert-EU as comhlíontacht
    a léiriú leis na ceanglais le haghaidh bithbhreoslaí, bithleachtanna, breoslaí
    bithmhaise, breoslaí in-athnuaite de thionscnamh neamh-bhitheolaíoch agus breoslaí
    carbóin athchúrsáilte a leagtar amach i dTreoir (AE) 2018/2001 ó Pharlaimint
    na hEorpa agus ón gComhairle, agus lena n-aisghairtear Cinneadh Cur Chun Feidhme
    (AE) 2022/605 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2024/3194 оd 19. prosinca 2024. o priznavanju
    dobrovoljnog programa REDcert-EU za dokazivanje usklađenosti sa zahtjevima za
    biogoriva, tekuća biogoriva, goriva iz biomase, obnovljiva goriva nebiološkog
    podrijetla i goriva iz recikliranog ugljika utvrđenima u Direktivi (EU) 2018/2001
    Europskog parlamenta i Vijeća i o stavljanju izvan snage Provedbene odluke Komisije
    (EU) 2022/605
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/3194 végrehajtási határozata (2024. december
    19.) az (EU) 2018/2001 európai parlamenti és tanácsi irányelvben a bioüzemanyagokra,
    a folyékony bio-energiahordozókra, a biomasszából előállított üzemanyagokra,
    a nem biológiai eredetű megújuló üzemanyagokra és a széntartalom újrahasznosításával
    nyert üzemanyagokra vonatkozó követelményeknek való megfelelést igazoló
    REDcert-EU önkéntes rendszer elismeréséről, valamint az (EU) 2022/605 bizottsági
    végrehajtási határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/3194 della Commissione, del 19 dicembre
    2024, relativa al riconoscimento del sistema volontario REDcert-EU per dimostrare
    il rispetto dei requisiti della direttiva (UE) 2018/2001 del Parlamento europeo
    e del Consiglio per i biocarburanti, i bioliquidi, i combustibili da biomassa,
    i combustibili rinnovabili di origine non biologica e i carburanti derivanti da
    carbonio riciclato, e che abroga la decisione di esecuzione (UE) 2022/605 della
    Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/3194 (2024. gada 19. decembris),
    ar kuru brīvprātīgo shēmu REDcert-EU atzīst par tādu, kas attiecībā uz
    biodegvielām, bioloģiskajiem šķidrajiem kurināmajiem, biomasas kurināmajiem/degvielām,
    nebioloģiskas izcelsmes atjaunīgajām degvielām un reciklēta oglekļa degvielām
    spēj pierādīt atbilstību Eiropas Parlamenta un Padomes Direktīvas (ES) 2018/2001
    prasībām, un ar kuru atceļ Komisijas Īstenošanas lēmumu (ES) 2022/605
  type: main
- language: lt
  script: Latn
  content: 2024 m. gruodžio 19 d. Komisijos įgyvendinimo sprendimas (ES) 2024/3194
    dėl pripažinimo, kad savanoriška schema REDcert-ES tinka atitikčiai Europos
    Parlamento ir Tarybos direktyvoje (ES) 2018/2001 nustatytiems biodegalų, skystųjų
    bioproduktų, biomasės kuro, nebiologinės kilmės kuro iš atsinaujinančiųjų
    išteklių ir perdirbtosios anglies kuro reikalavimams įrodyti, kuriuo panaikinamas
    Komisijos įgyvendinimo sprendimas (ES) 2022/605
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/3194 tad-19
    ta’ Diċembru 2024 dwar ir-rikonoxximent tal-iskema volontarja REDcert-EU biex
    tintwera l-konformità mar-rekwiżiti għall-bijokarburanti, il-bijolikwidi, il-karburanti
    mill-bijomassa, il-fjuwils rinnovabbli ta’ oriġini mhux bijoloġika u l-karburanti
    tal-karbonju riċiklat stabbiliti fid-Direttiva (UE) 2018/2001 tal-Parlament Ewropew
    u tal-Kunsill, u li tħassar id-Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni
    (UE) 2022/605
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2024/3194 van de Commissie van 19 december 2024
    inzake de erkenning van het vrijwillige systeem REDcert-EU om de naleving van
    de in Richtlijn (EU) 2018/2001 van het Europees Parlement en de Raad opgenomen
    vereisten voor biobrandstoffen, vloeibare biomassa, biomassabrandstoffen, hernieuwbare
    brandstoffen van niet-biologische oorsprong en brandstoffen op basis van hergebruikte
    koolstof aan te tonen en tot intrekking van Uitvoeringsbesluit (EU) 2022/605 van
    de Commissie
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2024/3194 z dnia 19 grudnia 2024 r. w sprawie
    uznania dobrowolnego systemu REDcert-EU na potrzeby wykazywania zgodności z wymogami
    dotyczącymi biopaliw, biopłynów, paliw z biomasy, paliw odnawialnych pochodzenia
    niebiologicznego i pochodzących z recyklingu paliw węglowych określonymi w
    dyrektywie Parlamentu Europejskiego i Rady (UE) 2018/2001 oraz w sprawie uchylenia
    decyzji wykonawczej Komisji (UE) 2022/605
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2024/3194 da Comissão, de 19 de dezembro de
    2024, relativa ao reconhecimento do regime voluntário REDcert-EU para fins de
    demonstração do cumprimento dos requisitos previstos na Diretiva (UE) 2018/2001
    do Parlamento Europeu e do Conselho aplicáveis aos biocombustíveis, aos biolíquidos,
    aos combustíveis biomássicos, aos combustíveis renováveis de origem não biológica
    e aos combustíveis de carbono reciclado e que revoga a Decisão de Execução
    (UE) 2022/605 da Comissão
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/3194 a Comisiei din 19 decembrie
    2024 privind recunoașterea sistemului voluntar REDcert-EU în vederea demonstrării
    conformității cu cerințele privind biocombustibilii, biolichidele, combustibilii
    din biomasă combustibilii din surse regenerabile de origine nebiologică și
    combustibilii pe bază de carbon reciclat, prevăzute în Directiva (UE) 2018/2001
    a Parlamentului European și a Consiliului, precum și de abrogare a Deciziei
    de punere în aplicare (UE) 2022/605 a Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2024/3194 z 19. decembra 2024 o
    uznaní dobrovoľnej schémy REDcert-EU na účely preukázania súladu s požiadavkami
    na biopalivá, biokvapaliny, palivá z biomasy, palivá z obnoviteľných zdrojov
    nebiologického pôvodu a fosílne palivá vyrobené z odpadu stanovenými v smernici
    Európskeho parlamentu a Rady (EÚ) 2018/2001, ktorým sa zrušuje vykonávacie
    rozhodnutie Komisie (EÚ) 2022/605
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2024/3194 z dne 19. decembra 2024 o priznavanju
    prostovoljnega sistema REDcert-EU za dokazovanje skladnosti z zahtevami za pogonska
    biogoriva, druga tekoča biogoriva, biomasna goriva, goriva iz obnovljivih virov
    nebiološkega izvora in reciklirana ogljična goriva iz Direktive (EU) 2018/2001
    Evropskega parlamenta in Sveta ter o razveljavitvi Izvedbenega sklepa Komisije
    (EU) 2022/605
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2024/3194 de la Comisión, de 19 de diciembre
    de 2024, relativa al reconocimiento del régimen voluntario REDcert-EU para demostrar
    el cumplimiento de los requisitos aplicables a los biocarburantes, biolíquidos,
    combustibles de biomasa, combustibles renovables de origen no biológico y combustibles
    de carbono reciclado establecidos en la Directiva (UE) 2018/2001 del Parlamento
    Europeo y del Consejo, y por la que se deroga la Decisión de Ejecución (UE)
    2022/605 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2024/3194 av den 19 december 2024
    om erkännande av det frivilliga systemet REDcert-EU för att visa efterlevnad
    av kraven för biodrivmedel, flytande biobränslen, biomassabränslen, förnybara
    drivmedel av icke-biologiskt ursprung och återvunna kolbaserade bränslen i Europaparlamentets
    och rådets direktiv (EU) 2018/2001 och om upphävande av kommissionens genomförandebeslut
    (EU) 2022/605
