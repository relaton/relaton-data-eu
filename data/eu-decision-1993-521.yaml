title:
- language: en
  script: Latn
  content: '93/521/EEC: Commission Decision of 3 September 1993 accepting undertakings
    given in connection with the anti-dumping review in respect of imports of binder
    and baler twine originating in Brazil, terminating the anti- subsidy review proceeding
    with regard to these imports and terminating the anti-dumping and anti-subsidy
    review in respect of imports of binder and baler twine originating in Mexico'
  type: main
- language: fr
  script: Latn
  content: '93/521/CEE: Décision de la Commission, du 3 septembre 1993, portant acceptation
    des engagements offerts dans le cadre du réexamen des mesures antidumping concernant
    les importations de ficelles lieuses et botteleuses originaires du Brésil, portant
    clôture de la procédure de réexamen des mesures antisubventions relatives à
    ces importations, et portant clôture de la procédure de réexamen des mesures
    antidumping et antisubventions concernant les importations de ficelles lieuses
    et botteleuses originaires du Mexique'
  type: main
- language: de
  script: Latn
  content: '93/521/EWG: Beschluß der Kommission vom 3. September 1993 über die Annahme
    von Verpflichtungen im Rahmen der Antidumpingüberprüfung betreffend die Einfuhren
    von Bindegarnen und Pressengarnen mit Ursprung in Brasilien, über die Einstellung
    der Ausgleichszollüberprüfung gegenüber diesen Einfuhren und über die Einstellung
    der Antidumping- und Ausgleichszollüberprüfung betreffend die Einfuhren von
    Bindegarnen und Pressengarnen mit Ursprung in Mexiko'
  type: main
- language: da
  script: Latn
  content: '93/521/EØF: Kommissionens afgørelse af 3. september 1993 om godtagelse
    af tilsagn i forbindelse med den fornyede undersøgelse af importen af binde-
    og pressegarn med oprindelse i Brasilien og om afslutning af den fornyede antisubsidieundersøgelse
    vedrørende denne import og om afslutning af den fornyede antidumping- og antisubsidieundersøgelse
    af importen af binde- og pressegarn med oprindelse i Mexico'
  type: main
- language: el
  script: Grek
  content: '93/521/ΕΟΚ: Απόφαση της Επιτροπής της 3ης Σεπτεμβρίου
    1993 περί αποδοχής αναλήψεων υποχρεώσεων που
    έχουν προταθεί στο πλαίσιο της επανεξέτασης
    των μέτρων αντιντάμπινγκ όσον αφορά εισαγωγές
    σπάγγων για δεσίματα και δεματιάσματα καταγωγής
    Βραζιλίας, για την περάτωση της διαδικασίας
    επανεξέτασης των αντεπιδοτήσεων όσον αφορά
    τις εισαγωγές αυτές και για την περάτωση της
    διαδικασίας επανεξέτασης των μέτρων αντιντάμπινγκ
    και των αντεπιδοτήσεων όσον αφορά εισαγωγές
    σπάγγων για δεσίματα και δεματιάσματα καταγωγής
    Μεξικού'
  type: main
- language: it
  script: Latn
  content: '93/521/CEE: Decisione della Commissione, del 3 settembre 1993, che accetta
    gli impegni assunti nell''ambito del riesame delle misure antidumping riguardo
    alle importazioni di spago per legare originario del Brasile e chiude il procedimento
    di riesame delle misure relative a dette importazioni e quello delle misure antidumping
    e antisovvenzioni riguardo alle importazioni di spago per legare originario del
    Messico'
  type: main
- language: nl
  script: Latn
  content: '93/521/EEG: Besluit van de Commissie van 3 september 1993 tot aanvaarding
    van verbintenissen, aangeboden in verband met het nieuwe onderzoek van dumping
    met betrekking tot de invoer van bindtouw van oorsprong uit Brazilië, tot beëindiging
    van het nieuwe onderzoek inzake subsidie met betrekking tot deze invoer en tot
    beëindiging van het nieuwe onderzoek inzake dumping en subsidie met betrekking
    tot de invoer van bindtouw van oorsprong uit Mexico'
  type: main
- language: pt
  script: Latn
  content: '93/521/CEE: Decisão da Comissão, de 3 de Setembro de 1993, que aceita
    os compromissos oferecidos no âmbito do reexame das medidas anti-dumping aplicáveis
    às importações de cordéis para atadeiras ou enfardadeiras originários do
    Brasil, que encerra o processo de reexame das medidas anti-subvenção relativamente
    às mesmas importações e que encerra o reexame das medidas anti- dumping e anti-
    subvenção aplicáveis às importações de cordéis para atadeiras ou enfardadeiras
    originários do México'
  type: main
- language: es
  script: Latn
  content: '93/521/CEE: Decisión de la Comisión, de 3 de septiembre de 1993, por
    la que se aceptan los compromisos ofrecidos en relación con la reconsideración
    de las medidas antidumping referentes a las importaciones de cordeles para agavilladoras
    y atadoras originarias de Brasil, se da por concluido el procedimiento de reconsideración
    antisubvención respecto a dichas importaciones, y se concluye la reconsideración
    antidumping/antisubvención relativa a las importaciones de cordeles para agavilladoras
    y atadoras originarias de México'
  type: main
