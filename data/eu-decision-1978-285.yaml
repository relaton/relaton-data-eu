    des Großherzogtums Luxemburg, den Verkehr mit Staatgut einiger Sorten landwirtschaftlicher
    Pflanzenarten zu beschränken (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/285/EØF: Kommissionens beslutning af 22. februar 1978 om ændring
