title:
- language: en
  script: Latn
  content: '78/285/EEC: Commission Decision of 22 February 1978 amending Decision
    75/578/EEC authorizing the Grand Duchy of Luxembourg to restrict the marketing
    of seed of certain varieties of agricultural plant species (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/285/CEE: Décision de la Commission, du 22 février 1978, modifiant
    la décision 75/578/CEE autorisant le grand-duché de Luxembourg à restreindre
    la commercialisation des semences de certaines variétés des espèces de plantes
    agricoles (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
