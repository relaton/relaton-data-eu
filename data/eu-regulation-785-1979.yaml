title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 785/79 of 19 April 1979 re-establishing
    the levying of customs duties on knives with cutting blades, serrated or not,
    falling within heading No ex 82.09 and originating in Singapore, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3156/78
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 785/79 de la Commission, du 19 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    à lame tranchante ou dentelée, de la position ex 82.09, originaires de Singapour
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 785/79 der Kommission vom 19. April 1979 zur Wiedereinführung
    des Zollsatzes für Messer mit schneidender oder gezahnter Klinge der Tarifnummer
    ex 82.09, mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 785/79 af 19. april 1979 om genindførelse
    af opkrævning af toldafgifter for knive, der ikke henhører under nogen anden
    position i dette kapitel, under pos. ex 82.09, som har oprindelse i Singapore
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 785/79 della Commissione, del 19 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante
    o dentata della voce doganale ex 82.09, originari di Singapore beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 785/79 van de Commissie van 19 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op messen met
    snijdend lemmet, ook indien getand, van post ex 82.09, van oorsprong uit Singapore
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
