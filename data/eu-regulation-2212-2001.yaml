    von Tafelwein und zur Aussetzung der Mitteilung neuer Verträge zur fakultativen
    Destillation von Tafelwein
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2212/2001 af 15. november 2001 om fastsættelse
