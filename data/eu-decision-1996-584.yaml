title:
- language: en
  script: Latn
  content: '96/584/EC: Commission Decision of 25 September 1996 amending Commission
    Decision 95/340/EC drawing up a provisional list of third countries from which
    Member States authorize imports of milk and milk-based products and revoking Decision
    94/70/EC'
  type: main
- language: fr
  script: Latn
  content: '96/584/CE: Décision de la Commission du 25 septembre 1996 modifiant la
    décision 95/340/CE de la Commission établissant la liste provisoire des pays
    tiers en provenance desquels les États membres autorisent les importations de
    lait et de produits à base de lait et abrogeant la décision 94/70/CE'
  type: main
- language: de
  script: Latn
  content: '96/584/EG: Entscheidung der Kommission vom 25. September 1996 zur Änderung
    der Entscheidung 95/340/EG zur Erstellung eines vorläufigen Verzeichnisses der
    Drittländer, aus denen die Mitgliedstaaten die Einfuhr von Milch und Erzeugnissen
    auf Milchbasis zulassen, und zur Aufhebung der Entscheidung 94/70/EG'
  type: main
- language: da
  script: Latn
  content: '96/584/EF: Kommissionens Beslutning af 25. september 1996 om ændring
