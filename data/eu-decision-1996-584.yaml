    og om ophævelse af beslutning 94/70/EF'
  type: main
- language: el
  script: Grek
  content: '96/584/ΕΚ: Απόφαση της Επιτροπής της 25ης Σεπτεμβρίου
    1996 για την τροποποίηση της απόφασης 95/340/ΕΚ
    σχετικά με την κατάρτιση προσωρινού καταλόγου
    τρίτων χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    τις εισαγωγές γάλακτος και προϊόντων με βάση
    το γάλα και για την κατάργηση της απόφασης
    94/70/ΕΚ'
  type: main
- language: fi
  script: Latn
  content: '96/584/EY: Komission päätös, tehty 25 päivänä syyskuuta 1996, väliaikaisesta
