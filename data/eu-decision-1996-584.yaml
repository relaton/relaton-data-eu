    van derde landen waaruit de Lid-Staten de invoer van melk en produkten op basis
    van melk toestaan en tot intrekking van Beschikking 94/70/EG'
  type: main
- language: pt
  script: Latn
  content: '96/584/CE: Decisão da Comissão de 25 de Setembro de 1996 que altera
