title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant le Royaume de Belgique, le Grand-Duché
    de Luxembourg et le Royaume des Pays-Bas à différer le rapprochement des droits
    prévus dans leur tarif douanier vers ceux du Tarif douanier commun en ce qui
    concerne les tabacs fabriqués (n 24.02)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, mit der das Königreich Belgien, das Großherzogtum
    Luxemburg und das Königreich der Niederlande ermächtigt werden, die Angleichung
    der in ihrem Zolltarif vorgesehenen Zollsätze an diejenigen des Gemeinsamen Zolltarifs
    für verarbeiteten Tabak (Tarifnummer 24.02) aufzuschieben
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione che autorizza il regno del Belgio, il Granducato
    del Lussemburgo e il Regno dei Paesi Bassi a differire il ravvicinamento dei dazi
    previsti dalla loro tariffa doganale a quelli della tariffa doganale comune per
    quanto riguarda i tabacchi lavorati (n. 24.02)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie waarbij het Koninkrijk België, het Groothertogdom
    Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd de aanpassing van
    de in hun douanetarief voorziene invoerrechten aan het gemeenschappelijk douanetarief
    voor wat betreft tabaksfabrikaten (Nr. 24.02) uit te stellen
  type: main
