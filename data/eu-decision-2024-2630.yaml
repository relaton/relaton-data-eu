    que o relatório contém dados precisos para efeitos da medição das emissões
    de gases com efeito de estufa associadas ao cultivo de colza na Dinamarca
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/2630 a Comisiei din 8 octombrie
    2024 de recunoaștere, în temeiul articolului 31 alineatele (2) și (4) din Directiva
    (UE) 2018/2001, a faptului că raportul conține date exacte în scopul măsurării
    emisiilor de gaze cu efect de seră asociate cultivării rapiței în Danemarca
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2024/2630 z 8. októbra 2024, ktorým
