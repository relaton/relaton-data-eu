    (UE) 2018/2001, che la relazione contiene dati accurati ai fini della misurazione
    delle emissioni di gas a effetto serra associate alla coltivazione di colza in
    Danimarca
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/2630 (2024. gada 8. oktobris),
