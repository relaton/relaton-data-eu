title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/2630 of 8 October 2024 recognising
    under Article 31(2) and (4) of Directive (EU) 2018/2001 that the report contains
    accurate data for the purposes of measuring the greenhouse gas emissions associated
    with the cultivation of rapeseed in Denmark
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/2630 de la Commission du 8 octobre 2024
    reconnaissant, conformément à l’article 31, paragraphes 2 et 4, de la directive
    (UE) 2018/2001, que le rapport contient des données précises aux fins de la
    mesure des émissions de gaz à effet de serre associées à la culture du colza
    au Danemark
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/2630 der Kommission vom 8. Oktober 2024
    zur Anerkennung gemäß Artikel 31 Absätze 2 und 4 der Richtlinie (EU) 2018/2001,
    dass der Bericht genaue Daten für die Messung der auf den Anbau von Raps in Dänemark
    zurückgehenden Treibhausgasemissionen enthält
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2024/2630 на Комисията
    от 8 октомври 2024 година за признаване по член
    31, параграфи 2 и 4 от Директива (ЕС) 2018/2001, че докладът
    съдържа точни данни за целите на измерването
    на емисиите на парникови газове, свързани с
    отглеждането на рапица в Дания
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/2630 ze dne 8. října 2024,
    kterým se podle čl. 31 odst. 2 a 4 směrnice (EU) 2018/2001 uznává, že zpráva
    obsahuje přesné údaje pro účely měření emisí skleníkových plynů spojených
    s pěstováním řepky olejky v Dánsku
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/2630 af 8. oktober 2024
    om anerkendelse i henhold til artikel 31, stk. 2 og 4, i direktiv (EU) 2018/2001
    af, at rapporten indeholder nøjagtige data med henblik på måling af drivhusgasemissioner
    i forbindelse med dyrkning af raps i Danmark
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/2630 της Επιτροπής,
