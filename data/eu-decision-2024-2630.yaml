    sprawozdanie zawiera dokładne dane do celów pomiaru emisji gazów cieplarnianych
    związanych z uprawą rzepaku w Danii
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2024/2630 da Comissão, de 8 de outubro de
