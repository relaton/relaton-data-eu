    obsahuje presné údaje na účely merania emisií skleníkových plynov spojených
    s pestovaním repky olejnej v Dánsku
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2024/2630 z dne 8. oktobra 2024 o potrditvi
