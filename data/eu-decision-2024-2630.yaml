    dat het verslag nauwkeurige gegevens bevat ten behoeve van de meting van de broeikasgasemissies
    gerelateerd aan de teelt van koolzaad in Denemarken
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2024/2630 z dnia 8 października 2024 r.
