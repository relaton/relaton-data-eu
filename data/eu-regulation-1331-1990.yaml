  script: Latn
  content: Règlement (CEE) n° 1331/90 du Conseil, du 14 mai 1990, fixant, pour la
    récolte de 1990, les prix d'objectif, les prix d'intervention et les primes accordées
    aux acheteurs de tabac en feuilles, les prix d'intervention dérivés du tabac
    emballé, les qualités de référence, les zones de production ainsi que les
    quantités maximales garanties pour la récolte de 1991, et modifiant le règlement
    (CEE) n° 1252/89
