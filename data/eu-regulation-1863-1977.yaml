title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1863/77 of 12 August 1977 re-establishing
    the levying of customs duties on locks, etc., of base metal, falling within heading
    No 83.01, originating in Hong Kong to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1863/77 de la Commission, du 12 août 1977, portant
    rétablissement de la perception des droits de douane applicables aux serrures,
    etc., en métaux communs, de la position tarifaire 83.01, originaires de Hong-Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1863/77 der Kommission vom 12. August 1977 zur Wiedereinführung
    des Zollsatzes für Schlösser usw., aus unedlen Metallen, der Tarifnummer 83.01,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1863/77 af 12. august 1977 om genindførelse
    af opkrævning af toldafgifter for nøglelåse etc., af uædle metaller, under
    position 83.01, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1863/77 della Commissione, del 12 agosto 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle serrature, ecc.,
    di metalli comuni della voce doganale 83.01, originarie di Hong Kong beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1863/77 van de Commissie van 12 augustus 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op sloten,
    enz., van onedel metaal, van post 83.01, van oorsprong uit Hong-Kong, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
