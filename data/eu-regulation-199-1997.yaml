  script: Latn
  content: VERORDNUNG (EG) Nr. 199/97 DER KOMMISSION vom 31. Januar 1997 über die
    Festsetzung des Umfangs, in dem die im Januar 1997 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik, der Slowakischen Republik, Rumänien und Bulgarien genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 199/97 af 31. januar 1997 om fastsættelse
