  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 738/2008 van de Commissie van 28 juli 2008 houdende
    twaalfde wijziging van Verordening (EG) nr. 1763/2004 tot vaststelling van bepaalde
