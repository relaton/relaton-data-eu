    determinadas medidas restritivas de apoio ao exercício efectivo do mandato do
    Tribunal Penal Internacional para a antiga Jugoslávia (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 738/2008 al Comisiei din 28 iulie 2008 de modificare,
    pentru a douăsprezecea oară, a Regulamentului (CE) nr. 1763/2004 de instituire
    a anumitor măsuri restrictive în sprijinul punerii efective în aplicare a mandatului
    Tribunalului Penal Internațional pentru fosta Iugoslavie (TPII)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 738/2008 z 28. júla 2008 , ktorým sa po dvanástykrát
