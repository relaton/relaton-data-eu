    het mandaat van het Internationaal Straftribunaal voor het voormalige Joegoslavië
    (ICTY)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 738/2008 z dnia 28 lipca 2008 r. zmieniające
