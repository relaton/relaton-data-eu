title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/161 of 3 February 2022 terminating
    the examination procedure concerning obstacles to trade within the meaning of
    Regulation (EU) 2015/1843 applied by the United Mexican States consisting of measures
    affecting the import of Tequila
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/161 de la Commission du 3 février 2022
    portant clôture de la procédure d’examen concernant des obstacles au commerce,
    au sens du règlement (UE) 2015/1843, mis en place par les États-Unis mexicains
    et consistant dans des mesures ayant une incidence sur l’importation de «Tequila»
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/161 der Kommission vom 3. Februar 2022
    zur Einstellung des Untersuchungsverfahrens über Handelshemmnisse im Sinne der
    Verordnung (EU) 2015/1843, die von den Vereinigten Mexikanischen Staaten in Form
    von Maßnahmen angewandt werden, welche die Einfuhr von Tequila beeinträchtigen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/161 на Комисията
    от 3 февруари 2022 година за приключване на процедурата
    за разглеждане относно пречките пред търговията
    по смисъла на Регламент (ЕС) 2015/1843, въведени
    от Мексиканските съединени щати и изразяващи
    се в мерки, които засягат вноса на „Tequila“
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/161 ze dne 3. února 2022, kterým
    se zastavuje přezkumné řízení týkající se překážek obchodu ve smyslu
    nařízení (EU) 2015/1843 uplatňovaných Spojenými státy mexickými, které
    spočívají v opatřeních, jež mají dopad na dovoz Tequily
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/161 af 3. februar 2022
    om afslutning af undersøgelsesproceduren efter en klage vedrørende handelshindringer,
    som defineret i forordning (EU) 2015/1843, som anvendes af De Forenede Mexicanske
    Stater, og som består af foranstaltninger, der påvirker importen af Tequila
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/161 της Επιτροπής
    της 3ης Φεβρουαρίου 2022 για την περάτωση της
    εξεταστικής διαδικασίας σχετικά με τα εμπόδια
    στο εμπόριο κατά την έννοια του κανονισμού
    (ΕΕ) 2015/1843 τα οποία εφαρμόζουν οι Ηνωμένες Πολιτείες
    του Μεξικού και συνίστανται σε μέτρα που αφορούν
    την εισαγωγή του αλκοολούχου ποτού Tequila
  type: main
- language: et
  script: Latn
