    2015/1843 tähenduses kaubandustakistustena käsitatavate meetmete uurimine
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/161, annettu 3 päivänä
    helmikuuta 2022, Meksikon yhdysvaltojen soveltamien, tequilan tuontiin vaikuttavien
    toimenpiteiden muodostamaa, asetuksessa (EU) 2015/1843 tarkoitettua kaupan estettä
    koskevan unionin tutkimusmenettelyn päättämisestä
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/161 ón gCoimisiún an 3 Feabhra 2022
