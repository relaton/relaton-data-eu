    zijn ingesteld in de vorm van maatregelen die gevolgen hebben voor de invoer van
    “Tequila”
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/161 z dnia 3 lutego 2022 r. w sprawie
