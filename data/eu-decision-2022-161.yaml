    în sensul Regulamentului (UE) 2015/1843 aplicate de Statele Unite Mexicane care
    constau în măsuri ce afectează importul de Tequila
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/161 z 3. februára 2022, ktorým
