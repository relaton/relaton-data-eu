    tekintetében alkalmazott intézkedésekre vonatkozó vizsgálati eljárás megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/161 della Commissione del 3 febbraio
    2022 che conclude la procedura d’esame concernente gli ostacoli agli scambi
    ai sensi del regolamento (UE) 2015/1843 posti dagli Stati Uniti messicani e costituiti
    da misure che incidono sull’importazione di Tequila
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/161 (2022. gada 3. februāris),
    ar kuru izbeidz pārbaudes procedūru attiecībā uz tirdzniecības šķēršļiem
    Regulas (ES) 2015/1843 izpratnē, proti, pasākumiem, ko piemēro Meksikas Savienotās
    Valstis un kas ietekmē Tequila importu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/161 2022 m. vasario 3 d. kuriuo
