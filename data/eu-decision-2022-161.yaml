    ar thrádáil de réir bhrí Rialachán (AE) 2015/1843 arna gcur i bhfeidhm ag
    Stáit Aontaithe Mheicsiceo, constaicí arb é atá i gceist leo bearta a dhéanann
    difear d’allmhairiú Tequila
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/161 оd 3. veljače 2022. o završetku
