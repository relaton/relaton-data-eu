    (EÚ) 2015/1843 uplatňovaných Spojenými štátmi mexickými, ktoré spočívajú
    v opatreniach ovplyvňujúcich dovoz tequily
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/161 z dne 3. februarja 2022 o zaključku
