    primjenjuju Sjedinjene Meksičke Države u obliku mjera koje utječu na uvoz proizvoda
    „Tequila”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/161 végrehajtási határozata (2022. február 3.)
