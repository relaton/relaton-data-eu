  content: Regulation (EEC) No 2582/75 of the Commission of 10 October 1975 fixing
    the amounts to be levied by way of accession compensatory amounts to prevent deflections
    of trade in the beef and veal sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2582/75 de la Commission, du 10 octobre 1975, fixant
