    exportados sob a forma de mercadorias não abrangidas pelo anexo II do Tratado,
    as normas comuns de aplicação do regime de concessão de restituições à exportação
    e os critérios de fixação do seu montante
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2699/95 de la Comisión, de 22 de noviembre de 1995,
    por el que se modifica el Reglamento (CE) nº 1222/94 por el que se establecen,
    respecto a determinados productos agrícolas exportados en forma de mercancías
    no incluidas en el Anexo II del Tratado, las disposiciones comunes de aplicación
