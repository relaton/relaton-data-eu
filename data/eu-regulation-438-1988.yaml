    intrecciati o no, di fibre tessili sintetiche della categoria di prodotti 90 (numero
    d' ordine 40.0900) originari della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 438/88 van de Commissie van 17 februari 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bindgaren,
    touw en kabel, al dan niet gevlochten, van synthetische vezels, van de categorie
    van produkten nr. 90 (volgnummer 40.0900), van oorsprong uit Zuid-Korea, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3783/87
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 438/88 da Comissão de 17 de Fevereiro de 1988 que
