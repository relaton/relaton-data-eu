title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 438/88 of 17 February 1988 re-establishing
    the levying of customs duties on twines, cordage, ropes and cables of synthetic
    fibres, products of category 90 (order number 40.0900) originating in South Korea
    to which the preferential tariff arrangements of Council Regulation (EEC) No 3783/87
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 438/88 de la Commission du 17 février 1988 portant
    rétablissement de la perception des droits de douane applicables aux ficelles,
    cordes et cordages synthétiques de la catégorie de produits n° 90 (numéro
    d' ordre 40.0900), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 438/88 der Kommission vom 17. Februar 1988 über die
    Wiedereinführung des Zollsatzes für Bindfäden, Seile und Taue, auch geflochten,
    aus synthetischen Spinnstoffen der Warenkategorie 90 (Laufende Nummer 40.0900)
    mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 438/88 af 17. februar 1988 om genindførelse
    af opkrævning af toldafgifter for sejlgarn, reb og tovværk, af syntetiske fibre
    (kategori 90, løbenummer 40.0900), som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
