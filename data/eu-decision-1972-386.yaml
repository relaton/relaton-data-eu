title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 novembre 1972, autorisant la République
    italienne à exclure du traitement communautaire les appareils de radio et de
    télévision, ainsi que leurs pièces détachées, des positions 85.15 A et C
    du Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '72/386/EWG: Entscheidung der Kommission vom 13. November 1972, mit der
    die Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Radio- und Fernsehapparate sowie
    deren Ersatzteile der Tarifnummern 85.15 A und C des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/386/CEE: Decisione della Commissione, del 13 novembre 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario gli apparecchi
    radio e televisori, e parti staccate, delle voci n. 85.15 A e C della tariffa
    doganale comune, originari del Giappone e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/386/EEG: Beschikking van de Commissie van 13 november 1972 waarbij
    de Italiaanse Republiek wordt gemachtigd radio- en televisietoestellen en hun
    onderdelen, van de posten 85.15 A en C van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
