    faz fé o texto em língua húngara)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/715 a Comisiei din 5 mai 2022
    de acordare a unei derogări pentru a permite Ungariei să utilizeze alte mijloace
    decât tehnicile de prelucrare electronică a datelor pentru schimbul și stocarea
    de informații pentru sistemul de control al importurilor 2 în legătură cu
    mărfurile din trimiterile poștale [notificată cu numărul C(2022) 2765] (Numai
    textul în limba maghiară este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/715 z 5. mája 2022, ktorým
