id: EUDecision2022715
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/715 of 5 May 2022 granting a
    derogation allowing Hungary to use means for the exchange and storage of information
    for the Import Control System 2 other than electronic data-processing techniques
    in relation to goods in postal consignments (notified under document C(2022) 2765)
    (Only the Hungarian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/715 de la Commission du 5 mai 2022 relative
    à l’octroi d’une dérogation autorisant la Hongrie à utiliser des moyens
    d’échange et de stockage d’informations aux fins du système de contrôle
    des importations 2 autres que des procédés informatiques de traitement des données
    en ce qui concerne les marchandises contenues dans des envois postaux [notifiée
    sous le numéro C(2022) 2765] (Le texte en langue hongroise est le seul faisant
    foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/715 der Kommission vom 5. Mai 2022 zur
    Gewährung einer abweichenden Regelung, die es Ungarn gestattet, andere Mittel
    als die elektronische Datenverarbeitung für den Austausch und die Speicherung
    von Informationen für das Einfuhrkontrollsystem 2 in Bezug auf Waren in Postsendungen
    zu verwenden (Bekannt gegeben unter Aktenzeichen C(2022) 2765) (Nur der ungarische
    Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/715 на Комисията
    от 5 май 2022 година за предоставяне на дерогация,
    с която се разрешава на Унгария да използва
    средства, различни от средствата за електронна
    обработка на данни, за обмена и съхранението
    на информация за системата за контрол на вноса
    2 във връзка със стоките в пощенски пратки (нотифицирано
    под номер С(2022) 2765) (само текстът на унгарски
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/715 ze dne 5. května 2022, kterým
    se povoluje odchylka umožňující Maďarsku v souvislosti se zbožím v poštovních
    zásilkách používat jiný způsob výměny a uchovávání informací určených
    pro systém kontroly dovozu 2 než metody elektronického zpracování dat (oznámeno
    pod číslem C(2022) 2765) (Pouze maďarské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/715 af 5. maj 2022 om
    indrømmelse af en undtagelse, der giver Ungarn mulighed for at anvende andre
    midler til udveksling og lagring af oplysninger i kodekssystemet til importkontrol
    end elektroniske databehandlingsteknikker i forbindelse med varer i postforsendelser
    (meddelt under nummer C(2022) 2765) (Kun den ungarske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/715 της Επιτροπής
    της 5ης Μαΐου 2022 για τη χορήγηση παρέκκλισης
    που επιτρέπει στην Ουγγαρία να χρησιμοποιεί
    μέσα ανταλλαγής και αποθήκευσης πληροφοριών
    για το Σύστημα ελέγχου εισαγωγών 2 εκτός από
    τις ηλεκτρονικές τεχνικές επεξεργασίας δεδομένων
    σε σχέση με εμπορεύματα σε ταχυδρομικές αποστολές
    [κοινοποιηθείσα υπό τον αριθμό C(2022) 2765] (Το κείμενο
    στην ουγγρική γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/715, 5. mai 2022, millega lubatakse Ungaril
    postisaadetistes sisalduva kauba puhul kasutada impordikontrollisüsteemi 2 jaoks
    ette nähtud teabe vahetamiseks ja säilitamiseks muid vahendeid kui elektroonilised
    andmetöötlusvahendid (teatavaks tehtud numbri C(2022) 2765 all) (Ainult ungarikeelne
    tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/715, annettu 5 päivänä
    toukokuuta 2022, Unkarille myönnettävästä poikkeuksesta käyttää tuontivalvontajärjestelmää
    2 varten tehtävään postilähetyksiin sisältyviä tavaroita koskevien tietojen
    vaihtamiseen ja tallentamiseen muita menetelmiä kuin sähköisiä tietojenkäsittelymenetelmiä
    (tiedoksiannettu numerolla C(2022) 2765) (Ainoastaan unkarinkielinen teksti on
    todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/715 ón gCoimisiún an 5 Bealtaine
    2022 lena ndeontaítear maolú lena gceadaítear don Ungáir modhanna a úsáid
    chun faisnéis a mhalartú agus a stóráil le haghaidh Chóras Rialaithe Allmhairí
    2 seachas teicnící próiseála sonraí leictreonacha i ndáil le hearraí i
    gcoinsíneachtaí poist (a bhfuil fógra tugtha ina leith faoi dhoiciméad C(2022)
    2765) (Is é an téacs Ungáirise amháin atá barántúil)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/715 оd 5. svibnja 2022. o odobravanju
    odstupanja kojim se Mađarskoj omogućuje upotreba sredstava za razmjenu i pohranu
    informacija za sustav kontrole uvoza druge generacije koja nisu tehnike elektroničke
    obrade podataka u vezi s robom u poštanskim pošiljkama (priopćeno pod brojem
    dokumenta C(2022) 2765) (Vjerodostojan je samo tekst na mađarskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/715 végrehajtási határozata (2022. május 5.)
    Magyarország számára a postai küldeményekben lévő áruk tekintetében az
    importellenőrzési rendszer 2 keretében történő információcserére és
    adattárolásra az elektronikus adatfeldolgozási eljárásoktól eltérő eszközök
    használatát lehetővé tevő eltérés engedélyezéséről (az értesítés
    a C(2022) 2765. számú dokumentummal történt) (Csak a magyar nyelvű szöveg
    hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/715 della Commissione del 5 maggio 2022
    relativa alla concessione di una deroga che consente all’Ungheria di utilizzare
    mezzi di scambio e archiviazione di informazioni per il sistema di controllo delle
    importazioni 2 diversi dai procedimenti informatici in relazione alle merci contenute
    in spedizioni postali [notificata con il numero C(2022) 2765] (Il testo in lingua
    ungherese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/715 (2022. gada 5. maijs), ar
    kuru Ungārijai piešķir atkāpi un atļauj informācijas apmaiņai un glabāšanai
    Importa kontroles sistēmā 2 attiecībā uz precēm pasta sūtījumos izmantot
    citus līdzekļus, kas nav elektroniskās datu apstrādes metodes (izziņots ar
    dokumenta numuru C(2022) 2765) (Autentisks ir tikai teksts ungāru valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/715 2022 m. gegužės 5 d.
    kuriuo Vengrijai leidžiama taikyti nukrypti leidžiančią nuostatą, pagal kurią
    „Importo kontrolės sistemai 2“ skirtos informacijos apie pašto siuntomis
    atsiunčiamas prekes mainams vykdyti ir tai informacijai saugoti leidžiama naudoti
    neelektronines duomenų apdorojimo priemones (pranešta dokumentu Nr. C(2022)
    2765) (Tekstas autentiškas tik vengrų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/715 tal-5
    ta’ Mejju 2022 li tagħti deroga li tippermetti lill-Ungerija tuża mezzi għall-iskambju
    u l-ħażna ta’ informazzjoni għas-Sistema ta’ Kontroll tal-Importazzjoni
    2 għajr tekniki elettroniċi għall-ipproċessar tad-data fir-rigward ta’ merkanzija
