    biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/715 van de Commissie van 5 mei 2022 tot verlening
    van een afwijking waarbij Hongarije wordt toegestaan andere middelen dan elektronische
    gegevensverwerkingstechnieken te gebruiken voor de uitwisseling en opslag van
    informatie voor het Invoercontrolesysteem 2 met betrekking tot goederen in postzendingen
    (Kennisgeving geschied onder nummer C(2022) 2765) (Slechts de tekst in de Hongaarse
    taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/715 z dnia 5 maja 2022 r. przyznająca
    odstępstwo zezwalające Węgrom na korzystanie ze środków wymiany i przechowywania
    informacji na potrzeby systemu kontroli importu 2 innych niż techniki elektronicznego
    przetwarzania danych w odniesieniu do towarów w przesyłkach pocztowych (notyfikowana
    jako dokument nr C(2022) 2765) (Jedynie tekst w języku węgierskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/715 da Comissão de 5 de maio de 2022
    que concede uma derrogação que autoriza a Hungria a utilizar outros meios que
    não técnicas de processamento eletrónico de dados para o intercâmbio e armazenamento
    de informações para o Sistema de Controlo das Importações 2 em relação a
