    [oznámené pod číslom C(2022) 2765] (Iba maďarské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/715 z dne 5. maja 2022 o odobritvi odstopanja,
