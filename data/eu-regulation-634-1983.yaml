  content: Commission Regulation (EEC) No 634/83 of 17 March 1983 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community and repealing Regulation (EEC) No 146/83
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 634/83 de la Commission, du 17 mars 1983, relatif à
