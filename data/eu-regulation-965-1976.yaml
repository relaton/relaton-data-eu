title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 965/76 of 27 April 1976 re-establishing
    the levying of customs duties on cotton yarn, not put up for retail sale, multiple
    or cabled, etc., falling within subheading 55.05 A, originating in India to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3002/75
    of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 965/76 de la Commission, du 27 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton non conditionnés pour la vente au détail, retors ou câblés, apprêtés,
    etc., de la sous-position tarifaire 55.05 A, originaires de l'Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3002/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 965/76 der Kommission vom 27. April 1976 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen für
    den Einzelverkauf, gezwirnt und appretiert usw., der Tarifstelle 55.05 A, mit
    Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3002/75 des Rates vom
    17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 965/76 af 27. april 1976 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, ikke i detailsalgsoplægninger,
    garn, flertrådet eller kabelslået etc., under underposition 55.05 A, som har
    oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 965/76 della Commissione, del 27 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone non
    preparati per la vendita al minuto, ritorti o ritorti su ritorto, ecc., della
    sottovoce doganale n. 55.05 A originari dell'India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3002/75 del Consiglio, del 17 novembre
    1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 965/76 van de Commissie van 27 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    katoen, niet gereed voor de verkoop in het klein, getwijnd of gekabeld, enz.,
    van onderverdeling 55.05 A, van oorsprong uit India, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3002/75 van de Raad van 17 november
    1975
  type: main
