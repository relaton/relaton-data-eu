type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1455/74 of the Commission of 11 June 1974 re-establishing
    the levying of the customs duties on spoons, forks, fish-eaters, butter-knives,
    etc., of stainless steel, falling within subheading 82.14 A, originating in South-Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1455/74 de la Commission, du 11 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, etc., en acier inoxydable, de la sous-position tarifaire 82.14 A, originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1455/74 der Kommission vom 11. Juni 1974 zu Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln usw., aus rostfreiem Stahl,
    der Tarifstelle 82.14 A, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1455/74 af 11. juni 1974 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskeknive, etc., af rustfrit
    stål under position 82.14 A, som har oprindelse i Syd-Korea og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18.
    december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1455/74 della Commissione, dell'11 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni,
    forchette, ecc., di acciaio inossidabile della sottovoce doganale n. 82.14 A originari
    della Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1455/74 van de Commissie van 11 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op lepels, pollepels,
    vorken, taartscheppen enz., van roestvrij staal, van onderverdeling 82.14 A, van
    oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening (EEG) nr. 3501/73
    van de Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
