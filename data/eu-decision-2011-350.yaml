title:
- language: en
  script: Latn
  content: Council Decision of 7 March 2011 on the conclusion, on behalf of the European
    Union, of the Protocol between the European Union, the European Community, the
    Swiss Confederation and the Principality of Liechtenstein on the accession of
    the Principality of Liechtenstein to the Agreement between the European Union,
    the European Community and the Swiss Confederation on the Swiss Confederation’s
    association with the implementation, application and development of the Schengen
    acquis, relating to the abolition of checks at internal borders and movement of
    persons
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 7 mars 2011 relative à la conclusion, au nom de
    l’Union européenne, du protocole entre l’Union européenne, la Communauté
    européenne, la Confédération suisse et la Principauté de Liechtenstein sur
    l’adhésion de la Principauté de Liechtenstein à l’accord entre l’Union
    européenne, la Communauté européenne et la Confédération suisse sur l’association
    de la Confédération suisse à la mise en œuvre, à l’application et au développement
    de l’acquis de Schengen en ce qui concerne la suppression des contrôles aux
    frontières intérieures et la circulation des personnes
  type: main
