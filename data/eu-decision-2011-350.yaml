    valaliiton väliseen sopimukseen, joka koskee Sveitsin valaliiton osallistumista
    Schengenin säännöstön täytäntöönpanoon, soveltamiseen ja kehittämiseen,
    Euroopan unionin, Euroopan yhteisön, Sveitsin valaliiton ja Liechtensteinin ruhtinaskunnan
    välillä tehtävän pöytäkirjan tekemisestä Euroopan unionin puolesta, siltä
    osin kuin kyse on tarkastusten poistamisesta sisärajoilta ja henkilöiden liikkumisesta
    rajojen yli
