  content: Council Regulation (EEC) No 2895/79 of 10 December 1979 opening tariff
    preferences in the form of a suspension of customs duties for jute manufactures
    originating in India, Thailand and Bangladesh and for coir manufactures originating
    in India and Sri Lanka
  type: main
