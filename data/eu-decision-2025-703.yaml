  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2025/703, annettu 27 päivänä maaliskuuta 2025,
    Kanadan sekä Euroopan unionin ja sen jäsenvaltioiden välisellä laaja-alaisella
    talous- ja kauppasopimuksella (CETA) perustetussa CETA-sekakomiteassa Euroopan
    unionin puolesta otettavasta kannasta päätöksen hyväksymiseen täydentävistä
    säännöistä, jotka koskevat nopeutettuja menettelyjä sijoittajien ja valtioiden
    välisten sijoitusriitojen ratkaisemiseksi, erityisesti luonnollisten henkilöiden
    tai pienten ja keskisuurten yritysten osalta
  type: main
