  script: Latn
  content: Besluit (EU) 2025/703 van de Raad van 27 maart 2025 betreffende het standpunt
    dat namens de Europese Unie moet worden ingenomen in het Gemengd Comité voor
    de CETA dat is ingesteld in het kader van de Brede Economische en Handelsovereenkomst
    (CETA) tussen Canada, enerzijds, en de Europese Unie en haar lidstaten, anderzijds,
    met betrekking tot de vaststelling van een besluit houdende aanvullende voorschriften
    voor versnelde procedures voor de beslechting van investeringsgeschillen tussen
    investeerders en staten, met name voor natuurlijke personen of kleine en middelgrote
    ondernemingen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2025/703 z dnia 27 marca 2025 r. w sprawie stanowiska,
