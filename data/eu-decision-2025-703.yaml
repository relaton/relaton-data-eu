  script: Latn
  content: Decisión (UE) 2025/703 del Consejo, de 27 de marzo de 2025, relativa a
    la posición que debe adoptarse, en nombre de la Unión, en el Comité Mixto del
    CETA creado en virtud del Acuerdo Económico y Comercial Global (CETA) entre Canadá,
    por una parte, y la Unión Europea y sus Estados miembros, por otra, con respecto
    a la adopción de una decisión por la que se establecen normas adicionales sobre
    procedimientos acelerados de solución de diferencias en materia de inversiones
    entre inversores y Estados, en particular para las personas físicas o las pequeñas
    y medianas empresas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2025/703 av den 27 mars 2025 om fastställande av den
    ståndpunkt som ska intas på Europeiska unionens vägnar i Gemensamma Ceta-kommittén,
    som inrättats genom det övergripande avtalet om ekonomi och handel (Ceta) mellan
    Kanada, å ena sidan, och Europeiska unionen och dess medlemsstater, å andra
    sidan, vad gäller antagandet av ett beslut om kompletterande regler för ett
    påskyndat förfarande för lösning av investeringstvister mellan investerare
    och stater, särskilt för fysiska personer eller små och medelstora företag
