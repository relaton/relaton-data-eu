title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/703 of 27 March 2025 on the position to be taken
    on behalf of the European Union within the CETA Joint Committee established under
    the Comprehensive Economic and Trade Agreement (CETA) between Canada, of the one
    part, and the European Union and its Member States, of the other part, as regards
    the adoption of a decision setting out supplemental rules on expedited procedures
    for the resolution of investment disputes between investors and states, in particular
    for natural persons or small and medium-sized enterprises
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/703 du Conseil du 27 mars 2025 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité mixte de l’AECG
    institué en application de l’accord économique et commercial global (AECG)
    entre le Canada, d’une part, et l’Union européenne et ses États membres,
    d’autre part, quant à l’adoption d’une décision établissant des règles
    complémentaires sur les procédures accélérées de règlement des différends
    relatifs aux investissements entre investisseurs et États, en particulier pour
    les personnes physiques ou les petites et moyennes entreprises
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/703 des Rates vom 27. März 2025 über den im Namen
    der Europäischen Union in dem mit dem umfassenden Wirtschafts- und Handelsabkommen
    (CETA) zwischen Kanada einerseits und der Europäischen Union und ihren Mitgliedstaaten
    andererseits eingesetzten Gemischten CETA-Ausschuss hinsichtlich der Annahme eines
    Beschlusses, mit dem ergänzende Vorschriften über beschleunigte Verfahren —
    insbesondere für natürliche Personen oder kleine und mittlere Unternehmen —
    zur Beilegung von Investitionsstreitigkeiten zwischen Investoren und Staaten festgelegt
    werden, zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2025/703 на Съвета от 27 март 2025
