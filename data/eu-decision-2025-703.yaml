    CETA utworzonego na mocy kompleksowej umowy gospodarczo-handlowej (CETA) między
    Kanadą, z jednej strony, a Unią Europejską i jej państwami członkowskimi,
    z drugiej strony, w odniesieniu do przyjęcia decyzji określającej dodatkowe
    zasady w zakresie trybów przyspieszonych rozstrzygania sporów inwestycyjnych
    między inwestorami a państwami, w szczególności w odniesieniu do osób fizycznych
    lub małych i średnich przedsiębiorstw
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2025/703 do Conselho, de 27 de março de 2025, sobre a posição
    a tomar, em nome da União Europeia, no âmbito do Comité Misto CETA criado ao
    abrigo do Acordo Económico e Comercial Global (CETA) entre o Canadá, por um
    lado, e a União Europeia e os seus Estados-Membros, por outro, relativamente
    à adoção de uma decisão que estabelece regras suplementares sobre a tramitação
    acelerada para a resolução de litígios em matéria de investimento entre investidores
    e Estados, em especial para as pessoas singulares ou as pequenas e médias empresas
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2025/703 a Consiliului din 27 martie 2025 privind poziția
