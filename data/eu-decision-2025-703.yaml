    mixt CETA instituit în temeiul Acordului economic și comercial cuprinzător
    (CETA) dintre Canada, pe de o parte, și Uniunea Europeană și statele sale membre,
    pe de altă parte, în ceea ce privește adoptarea unei decizii prin care se stabilesc
    normele suplimentare privind procedurile accelerate de soluționare a litigiilor
    legate de investiții dintre investitori și state, în special pentru persoane
    fizice sau întreprinderi mici și mijlocii
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2025/703 z 27. marca 2025 o pozícii, ktorá sa
    má v mene Európskej únie zaujať v Spoločnom výbore CETA zriadenom na základe
    Komplexnej hospodárskej a obchodnej dohody (CETA) medzi Kanadou na jednej strane
    a Európskou úniou a jej členskými štátmi na strane druhej, pokiaľ ide o
    prijatie rozhodnutia, ktorým sa stanovujú dodatočné pravidlá upravujúce
    skrátené konania pri urovnávaní investičných sporov medzi investormi a štátmi,
    najmä pokiaľ ide o fyzické osoby alebo malé a stredné podniky
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/703 z dne 27. marca 2025 o stališču, ki se v imenu
    Evropske unije zastopa v Skupnem odboru CETA, ustanovljenem na podlagi Celovitega
    gospodarskega in trgovinskega sporazuma (CETA) med Kanado na eni strani ter Evropsko
    unijo in njenimi državami članicami na drugi strani, v zvezi s sprejetjem sklepa
    o določitvi dopolnilnih pravil o hitrih postopkih za reševanje naložbenih sporov
    med vlagatelji in državami, zlasti za fizične osebe ali mala in srednja podjetja
  type: main
