    заеме от името на Европейския съюз в рамките
    на Съвместния комитет по ВИТС, създаден по
    силата на Всеобхватното икономическо и търговско
    споразумение (ВИТС) между Канада, от една страна,
    и Европейския съюз и неговите държави членки,
    от друга страна, във връзка с приемането на
    решение за установяване на допълнителни правила
    относно ускорени процедури за разрешаване
    на инвестиционни спорове между инвеститори
    и държави, по-специално за физически лица или
    малки или средни предприятия
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2025/703 ze dne 27. března 2025 o postoji, který
    má být zaujat jménem Evropské unie ve Smíšeném výboru CETA zřízeném
    podle Komplexní hospodářské a obchodní dohody (CETA) mezi Kanadou na jedné
    straně a Evropskou unií a jejími členskými státy na straně druhé k přijetí
    rozhodnutí o stanovení doplňkových pravidel pro zrychlené řízení pro řešení
