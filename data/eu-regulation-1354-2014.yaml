    z nariadenia (EÚ) č. 1272/2009, pokiaľ ide o lehotu na preskúmanie ponúk
    na nákup pšenice obyčajnej, masla a sušeného odstredeného mlieka za pevne
    stanovenú cenu v rámci verejnej intervencie v rokoch 2014 a 2015
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1354/2014 z dne 16. decembra 2014 o
    odstopanju od uredb (ES) št. 2305/2003, (ES) št. 969/2006, (ES) št. 1067/2008
    in (ES) št. 1964/2006, od Izvedbene uredbe (EU) št. 480/2012 ter od uredb (ES)
    št. 828/2009 in (ES) št. 1918/2006 glede datumov za vložitev zahtevkov in izdajo
    uvoznih dovoljenj za leto 2015 v okviru tarifnih kvot za žita, riž, sladkor
    in oljčno olje, o odstopanju od Uredbe (ES) št. 951/2006 glede datumov za izdajo
    izvoznih dovoljenj za leto 2015 v sektorjih izvenkvotnega sladkorja in izvenkvotne
    izoglukoze ter o odstopanju od Uredbe (EU) št. 1272/2009 glede roka za proučitev
    ponudb za odkup navadne pšenice, masla in posnetega mleka v prahu po fiksni ceni
    v okviru javne intervencije leta 2014 in leta 2015
  type: main
- language: es
  script: Latn
  content: Reglamento de ejecución (UE) n °1354/2014 de la comisión, de 16 de diciembre
    de 2014 , por el que se establecen excepciones a los Reglamentos (CE) n °2305/2003,
    (CE) n ° 969/2006, (CE) n °1067/2008 y (CE) n °1964/2006, al Reglamento de
    Ejecución (UE) n °480/2012, y a los Reglamentos (CE) n °828/2009 y (CE) n °1918/2006,
    en lo que respecta a las fechas de presentación de solicitudes y expedición
    de certificados de importación en 2015 en el marco de los contingentes arancelarios
    de cereales, arroz, azúcar y aceite de oliva, por el que se establecen excepciones
    al Reglamento (CE) n ° 951/2006 en lo relativo a la expedición de certificados
    de exportación en 2015 en los sectores del azúcar y la isoglucosa producidos
    al margen de cuota, y por el que se establecen establecen excepciones al Reglamento
    (UE) n °1272/2009 en lo relativo al plazo de examen de las ofertas para la compra
    a precio fijo de trigo blando, de mantequilla y de leche desnatada en polvo en
    el marco del régimen de intervención pública en 2014 y 2015
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1354/2014 av den 16 december
    2014 om undantag från förordningarna (EG) nr 2305/2003, (EG) nr 969/2006, (EG)
    nr 1067/2008 och (EG) nr 1964/2006, genomförandeförordning (EU) nr 480/2012
    och förordningarna (EG) nr 828/2009 och (EG) nr 1918/2006 vad gäller datum för
    inlämning av ansökningar om importlicenser och för utfärdande av importlicenser
    under 2015 inom ramen för tullkvoterna för spannmål, ris, socker och olivolja,
    om undantag från förordning (EG) nr 951/2006 vad gäller datum för utfärdande
    av exportlicenser under 2015 inom sektorerna för utomkvotssocker och utomkvotsisoglukos
    och om undantag från förordning (EU) nr 1272/2009 vad gäller tidsfristen för
    bedömning av erbjudna kvantiteter för uppköp av vanligt vete, smör och skummjölkspulver
    till fast pris inom ramen för offentlig intervention under 2014 och 2015
  type: main
