title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1897/77 of 19 August 1977 re-establishing
    the levying of customs duties on woodscrews falling within heading No ex 73.32,
    originating in Hong Kong to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1897/77 de la Commission, du 19 août 1977, portant
    rétablissement de la perception des droits de douane applicables aux vis à bois,
    de la position tarifaire EX 73.32, originaires de Hong-Kong, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1897/77 der Kommission vom 19. August 1977 zur Wiedereinführung
    des Zollsatzes für Schrauben mit Holzgewinde der Tarifnummer ex 73.32 mit Ursprung
    in Hongkong, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1897/77 af 19. august 1977 om gennemførelse
    af opkrævning af toldafgifter for træskruer under pos. ex 73.32, som har oprindelse
    i Hongkong og som omfattes af de toldpræferencer, som er fastsat i Rådets Forordning
    (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1897/77 della Commissione, del 19 agosto 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle viti per legno della
    voce doganale ex 73.32, originarie di Hong Kong beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1897/77 van de Commissie van 19 augustus 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op houtschroeven
    van post ex 73.32, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening
    (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden geopend
  type: main
