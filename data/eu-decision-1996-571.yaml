    authorize imports of milk and milk-based products and revoking Decision 94/70/EC'
  type: main
- language: fr
  script: Latn
  content: '96/571/CE: Décision de la Commission du 24 septembre 1996 modifiant la
    décision 95/340/CE établissant la liste provisoire des pays tiers en provenance
    desquels les États membres autorisent les importations de lait et de produits
    à base de lait et abrogeant la décision 94/70/CE'
  type: main
- language: de
  script: Latn
