title:
- language: en
  script: Latn
  content: '88/500/EEC: Commission Decision of 22 September 1988 making a definitive
    allocation to various Member States of resources to be charged to the 1988 budget
    year for the supply of food from intervention stocks to designated organizations
    for distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/500/CEE: Décision de la Commission du 22 septembre 1988 portant attribution
    définitive à différents États membres de ressources imputables à l'' exercice
    1988 pour la fourniture de denrées alimentaires provenant des stocks d'' intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/500/EWG: Entscheidung der Kommission vom 22. September 1988 über die
    endgültige Bewilligung von Mitteln, die im Haushaltsjahr 1988 für die Lieferung
    von Nahrungsmitteln aus Interventionsbeständen an bestimmte Einrichtungen zur
    Verteilung an Bedürftige in der Gemeinschaft zu verbuchen sind, für verschiedene
    Mitgliedstaaten'
  type: main
- language: da
  script: Latn
  content: '88/500/EØF: Kommissionens beslutning af 22. september 1988 om endelig
    tildeling til forskellige medlemsstater af midler, der skal konteres i regnskabsåret
    1988, til levering af levnedsmidler fra interventionslagre til visse organisationer
    med henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/500/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Σεπτεμβρίου 1988 για την οριστική κατανομή σε
    διάφορα κράτη μέλη των πόρων που θα καταλογιστούν
    στο έτος προϋπολογισμού 1988 για τη χορήγηση
    τροφίμων που προέρχονται από τα αποθέματα
    παρέμβασης σε οργανισμούς που έχουν ορισθεί
    για τη διανομή τους στους απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '88/500/CEE: Decisione della Commissione del 22 settembre 1988 che assegna
    definitivamente a vari Stati membri le risorse da imputare all'' esercizio finanziario
    1988 per la fornitura a determinati organismi di derrate alimentari provenienti
    dalle scorte d'' intervento e destinate ad essere distribuite agli indigenti nella
    Comunità'
  type: main
- language: nl
  script: Latn
  content: '88/500/EEG: Beschikking van de Commissie van 22 september 1988 houdende
    definitieve toewijzing, aan een aantal Lid-Staten, van ten laste van de begroting
    van 1988 te boeken financiële middelen voor de levering van voedsel uit interventievoorraden
    aan organisaties die zijn aangewezen voor de verstrekking ervan aan de meest behoeftigen
    in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '88/500/CEE: Decisão da Comissão de 22 de Setembro de 1988 que atribui
    definitivamente a vários Estados-membos recursos a incluir no orçamento de 1988
    para o fornecimento de géneros alimentícios provenientes das existências de
    intervenção a organizações designadas para distribuição às pessoas mais
    necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '88/500/CEE: Decisión de la Comisión de 22 de septiembre de 1988 por
    la que se establece la asignación definitiva, a varios Estados miembros, de recursos
    imputables al ejercicio presupuestario de 1988 para el suministro a determinadas
    organizaciones de alimentos procedentes de existencias de intervención para su
    distribución entre las personas más necesitadas de la Comunidad'
  type: main
