  content: Règlement n 630/67/CEE de la Commission, du 26 septembre 1967, déterminant
    les montants des éléments mobiles applicables pendant le quatrième trimestre
    de l'année 1967 à l'importation dans les États membres des marchandises auxquelles
    s'applique le règlement n 160/66/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 630/67/EWG der Kommission vom 26. September 1967 zur Festsetzung
    der Höhe der im vierten Vierteljahr des Jahres 1967 bei der Einfuhr der unter
    die Verordnung Nr. 160/66/EWG des Rates fallenden Waren in die Mitgliedstaaten
    anwendbaren beweglichen Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento n. 630/67/CEE della Commissione, del 26 settembre 1967, che
