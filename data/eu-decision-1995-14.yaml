    a prever excepciones a la Directiva 77/93/CEE del Consejo con relación a las
    patatas de siembra originarias de Canadá (Los textos en lenguas española, griega,
    italiana y portuguesa son los únicos auténticos)'
  type: main
- language: sv
  script: Latn
