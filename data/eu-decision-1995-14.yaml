    93/680/EG om bemyndigande av Grekland, Spanien, Italien och Portugal att besluta
    om undantag från rådets direktiv 77/93/EEG avseende utsädespotatis med ursprung
    i Canada (Endast de spanska, grekiska, italienska och portugisiska texterna är
