title:
- language: en
  script: Latn
  content: '95/14/EC: Commission Decision of 27 January 1995 amending Decision 93/680/EC
    authorizing Greece, Spain, Italy and Portugal to provide for derogations from
    Council Directive 77/93/EEC in respect of seed potatoes originating in Canada
    (Only the Spanish, Greek, Italian and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/14/CE: Décision de la Commission du 27 janvier 1995 modifiant la décision
    93/680/CE autorisant la Grèce, l''Espagne, l''Italie et le Portugal à prévoir
    des dérogations à la directive 77/93/CEE du Conseil en ce qui concerne les plants
    de pommes de terre originaires du Canada (Les textes en langues espagnole, grecque,
    italienne et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '95/14/EG: Entscheidung der Kommission vom 27. Januar 1995 zur Änderung
    der Entscheidung 93/680/EG zur Ermächtigung Griechenlands, Spaniens, Italiens
    und Portugals, für Pflanzkartoffeln mit Ursprung in Kanada Ausnahmen von einigen
    Vorschriften der Richtlinie 77/93/EWG zuzulassen (Nur der spanische, griechische,
    italienische und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/14/EF: Kommissionens beslutning af 27. januar 1995 om ændring af beslutning
    93/680/EF om bemyndigelse af Grækenland, Spanien, Italien og Portugal til at
    fastsætte undtagelser fra Rådets direktiv 77/93/EØF, for så vidt angår læggekartofler
    med oprindelse i Canada (Kun de spanske, græske, italienske og portugisiske udgaver
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '95/14/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 27ης Ιανουαρίου
    1995 για την τροποποίηση της απόφασης 93/680/ΕΚ
    με την οποία εξουσιοδοτούνται η Ελλάδα, η Ισπανία,
    η Ιταλία και η Πορτογαλία να προβλέπουν παρεκκλίσεις
    από την οδηγία 77/93/ΕΟΚ του Συμβουλίου όσον αφορά
    τα γεώμηλα προς σπορά καταγωγής Καναδά (Τα
    κείμενα στην ισπανική, ελληνική, ιταλική και
    πορτογαλική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '95/14/EY: Komission päätös, tehty 27 päivänä tammikuuta 1995, Espanjan,
    Italian, Kreikan ja Portugalin oikeuttamisesta säätämään poikkeuksia neuvoston
    direktiiviin 77/93/ETY Kanadasta peräisin olevien siemenperunoiden osalta annetun
    direktiivin 93/680/EY muuttamisesta (Ainoastaan espanjan, kreikan, italian ja
    portugalin kieliset tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '95/14/CE: Decisione della Commissione del 27 gennaio 1995 recante modifica
    della decisione 93/680/CE che autorizza la Grecia, la Spagna, l''Italia e il Portogallo
    a stabilire deroghe alla direttiva 77/93/CEE del Consiglio per quanto riguarda
    i tuberi-seme di patata originari del Canada (I testi in lingua spagnola, greca,
    italiana e portoghese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '95/14/EG: Beschikking van de Commissie van 27 januari 1995 houdende wijziging
    van Beschikking 93/680/EG tot machtiging van Griekenland, Italië, Portugal en
    Spanje voor pootaardappelen van oorsprong uit Canada afwijkingen van Richtlijn
    77/93/EEG van de Raad toe te staan (Slechts de teksten in de Spaanse, de Griekse,
    de Italiaanse en de Portugese taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '95/14/CE: Decisão da Comissão de 27 de Janeiro de 1995 que altera a
    Decisão 93/680/CE que autoriza a Espanha, Grécia, Itália e Portugal a prever
    derrogações à Directiva 77/93/CEE do Conselho em relação às batatas de semente
    originárias do Canadá (Apenas fazem fé os textos nas línguas espanhola, grega,
    italiana e portuguesa)'
  type: main
