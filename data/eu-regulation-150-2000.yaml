title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 150/2000 of 21 January 2000 determining the
    extent to which applications lodged in January 2000 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 150/2000 de la Commission, du 21 janvier 2000, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2000 pour certains produits du secteur des oeufs et de la viande de
    volaille dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 150/2000 der Kommission vom 21. Januar 2000 über die
    Festsetzung des Umfangs, in dem die im Januar 2000 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 150/2000 af 21. januar 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    2000 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 150/2000 της Επιτροπής,
    της 21ης Ιανουαρίου 2000, για καθορισμό ορίων
    εντός των οποίων δύναται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Ιανουάριο
    του 2000 για πιστοποιητικά εισαγωγής για ορισμένα
    προϊόντα του τομέα των αυγών και του κρέατος
    πουλερικών στα πλαίσια των κανονισμών (ΕΚ)
    αριθ. 1474/95 και (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 150/2000, annettu 21 päivänä tammikuuta 2000,
    määrättyyn järjestelmään liittyvien tammikuussa 2000 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 150/2000 della Commissione, del 21 gennaio 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 2000 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 150/2000 van de Commissie van 21 januari 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sectoren eieren en slachtpluimvee,
    die in januari 2000 worden ingediend op grond van de Verordeningen (EG) nr. 1474/95
    en (EG) nr. 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 150/2000 da Comissão, de 21 de Janeiro de 2000,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Janeiro de 2000 ao abrigo dos Regulamentos (CE) n.° 1474/95 e (CE) n.° 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 150/2000 de la Comisión, de 21 de enero de 2000, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de los huevos y de la carne de
    aves de corral presentadas en el mes de enero de 2000 al amparo de los Reglamentos
    (CE) nos 1474/95 y 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 150/2000 av den 21 januari 2000 om fastställande
    av i vilken utsträckning de ansökningar om importlicens för vissa äggprodukter
    samt fjäderfäkött som ges in under januari 2000 inom ramen för förordningarna
    (EG) nr 1474/95 och (EG) nr 1251/96 kan godtas
  type: main
