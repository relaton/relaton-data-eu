  script: Latn
  content: '78/615/EEC: Commission Decision of 23 June 1978 amending Commission Decision
    76/687/EEC of 30 June 1976 authorizing the Federal Republic of Germany to restrict
    the marketing of seed of certain varieties of agricultural plant species (Only
    the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/615/CEE: Décision de la Commission, du 23 juin 1978, modifiant la
    décision 76/687/CEE de la Commission, du 30 juin 1976, autorisant la République
    fédérale d''Allemagne à restreindre la commercialisation des semences de certaines
    variétés des espèces de plantes agricoles (Le texte en langue allemande est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
