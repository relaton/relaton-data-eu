    der Bundesrepublik Deutschland, den Verkehr mit Saatgut einiger Sorten landwirtschaftlicher
    Pflanzenarten zu beschränken (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/615/EØF: Kommissionens beslutning af 23. juni 1978 om ændring af
