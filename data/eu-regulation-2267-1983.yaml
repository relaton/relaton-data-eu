  script: Latn
  content: Commission Regulation (EEC) No 2267/83 of 8 August 1983 re-establishing
    the levying of customs duties on diethylene glycol, falling within subheading
    29.08 B ex I and originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2267/83 de la Commission du 8 août 1983 portant rétablissement
    de la perception des droits de douane applicables au diéthylèneglycol, de la
    sous-position 29.08 B ex I du tarif douanier commun, originaire du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
