title:
- language: en
  script: Latn
  content: '83/176/EEC: Commission Decision of 7 April 1983 establishing that the
    apparatus described as ''PHI - Auger Electron Spectrometer, model 5000, consisting
    of: Cylindrical Auger Electron Optics, model 10-155, Auger System Control, model
    11-500 A, SKV Electron Gun Control, model 11-010, Electron Multiplier Supply,
    model 20-075, Monitor Oscilloscope, model TEK 604, Single Scope Mount, model 473-020,
    Lock-in Amplifier, model 32- 010'' may not be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/176/CEE: Décision de la Commission du 7 avril 1983 constatant que
    l''importation de l''appareil dénommé "PHI - Auger Electron Spectrometer, model
    5000, consisting of: Cylindrical Auger Electron Optics, model 10-155, Auger System
    Control, model 11-500A, SKV Electron Gun Control, model 11-010, Electron Multiplier
    Supply, model 20-075, Monitor Oscilloscope, model TEK 604, Single Scope Mount,
    model 473-020, Lock-in Amplifier, model 32- 010" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/176/EWG: Entscheidung der Kommission vom 7. April 1983, mit der festgestellt
    wird, daß das Gerät ,,PHI - Auger Electron Spectrometer, model 5 000, bestehend
    aus: Cylindrical Auger Electron Optics, model 10-155, Auger System Control, model
    11-500A, SKV Electron Gun Control, model 11-010, Electron Multiplier Supply, model
    20-075, Monitor Oscilloscope, model TEK 604, Single Scope Mount, model 473-020,
    Lock-in Amplifier, model 32-010" nicht unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/176/EØF: Kommissionens beslutning af 7. april 1983 om fastslåelse
    af, at indførsel af apparatet "PHI - Auger Electron spectrometer, model 5000,
    consisting of: Cylindrical Auger Electron Optics, model 10-155, Auger System Control,
    model 11-500A, SKV Electron Gun Control, model 11-010, Electron Multiplier Supply,
    model 20-075, Monitor Oscilloscope, model TEK 604, Single Scope Mount model 473-020,
    Lock-in Amplifier, model 32-010" ikke kan ske med fritagelse for told efter den
    fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/176/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Απριλίου
    1983 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «PHI — Auger Electron Spectrometer, model 5000,
    consisting of: Cylindrical Auger Electron Optics, model 10-155, Auger System Control,
    model 11—500 A, SKV Electron Gun Control, model 11-010, Electron Multiplier
    Supply, model 20-075, Monitor Oscilloscope, model TEK 604, Single Scope Mount,
    model 473-020, Lock-in Amplifier, model 32-010» δεν δύναται να πραγματοποιηθεί
    ατελώς, ως προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/176/CEE: Decisione della Commissione del 7 aprile 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "PHI - Auger Electron Spectrometer,
    model 5000, consisting of: Cylindrical Auger Electron Optics, model 10-155, Auger
    System Control, model 11-500 A, SKV Electron Gun Control, model 11-010, Electron
    Multiplier Supply, model 20-075, Monitor Oscilloscope, model TEK 604, Single Scope
