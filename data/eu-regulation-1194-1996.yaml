id: EURegulation11941996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1194/96 of 27 June 1996 extending Regulation
    (EC) No 3066/95 establishing certain concessions in the form of Community tariff
    quotas for certain agricultural products and providing for the adjustment, as
    an autonomous and transitional measure, of certain agricultural concessions provided
    for in the Europe Agreements to take account of the Agreement on agriculture concluded
    during the Uruguay Round of multilateral trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1194/96 du Conseil du 27 juin 1996 prolongeant le règlement
    (CE) nº 3066/95 établissant certaines concessions sous forme de contingents
    tarifaires communautaires pour certains produits agricoles et prévoyant une adaptation
    autonome et transitoire de certaines concessions agricoles prévues par les accords
    européens afin de tenir compte de l'accord sur l'agriculture conclu dans le cadre
    des négociations commerciales multilatérales du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1194/96 des Rates vom 27. Juni 1996 zur Verlängerung
    der Gültigkeitsdauer der Verordnung (EG) Nr. 3066/95 über Zugeständnisse in
    Form von gemeinschaftlichen Zollkontingenten für bestimmte landwirtschaftliche
    Erzeugnisse und zur autonomen und befristeten Anpassung bestimmter in den Europa-Abkommen
    vorgesehener Zugeständnisse für landwirtschaftliche Erzeugnisse, um dem im Rahmen
    der multilateralen Handelsverhandlungen der Uruguay-Runde geschlossenen Übereinkommen
    über die Landwirtschaft Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1194/96 af 27. juni 1996 om forlængelse af
    gyldigheden af forordning (EF) nr. 3066/95 om visse indrømmelser i form af EF-
    toldkontingenter for en række landbrugsprodukter og om autonom og midlertidig
    tilpasning af visse landbrugsindrømmelser i Europaaftalerne for at tage hensyn
    til den landbrugsaftale, som er indgået under de multilaterale handelsforhandlinger
    i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1194/96 του Συμβουλίου
    της 27ης Ιουνίου 1996 για την παράταση του κανονισμού
    (ΕΚ) αριθ. 3066/95 για τη θέσπιση ορισμένων παραχωρήσεων
    υπό μορφή κοινοτικών δασμολογικών ποσοστώσεων
    όσον αφορά ορισμένα γεωργικά προϊόντα και
    για αυτόνομη και μεταβατική προσαρμογή ορισμένων
    γεωργικών παραχωρήσεων που προβλέπονται στις
    ευρωπαϊκές συμφωνίες, προκειμένου να ληφθεί
    υπόψη η συμφωνία για τη γεωργία που έχει συναφθεί
    στο πλαίσιο των πολυμερών εμπορικών διαπραγματεύσεων
    του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1194/96, annettu 27 päivänä kesäkuuta 1996,
    tietyille maataloustuotteille yhteisön tariffikiintiöinä tehdyistä tietyistä
    myönnytyksistä ja tiettyjen Eurooppa-sopimuksissa määrättyjen maataloutta
    koskevien myönnytysten riippumattomasta mukauttamisesta siirtymäkauden aikana
    Uruguayn kierroksen monenvälisten kauppaneuvottelujen osana tehdyn maataloussopimuksen
    huomioon ottamiseksi annetun asetuksen (EY) N:o 3066/95 voimassaoloajan jatkamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1194/96 del Consiglio del 27 giugno 1996 che proroga
    il regolamento (CE) n. 3066/95 che stabilisce talune concessioni sotto forma di
    contingenti tariffari comunitari per taluni prodotti agricoli e prevede l'adeguamento
    autonomo e transitorio di talune concessioni agricole previste dagli accordi europei
    al fine di tener conto dell'accordo sull'agricoltura concluso nel quadro dei negoziati
    commerciali multilaterali dell'Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1194/96 van de Raad van 27 juni 1996 tot verlenging
    van de geldigheidsduur van Verordening (EG) nr. 3066/95 houdende vaststelling,
    in verband met de in het kader van de multilaterale handelsbesprekingen van de
    Uruguay-Ronde gesloten Overeenkomsten inzake de landbouw, van bepaalde concessies
    in de vorm van communautaire tariefcontingenten voor bepaalde landbouwprodukten
    en van een autonome overgangsregeling tot aanpassing van bepaalde in de Europa-Overeenkomsten
    opgenomen landbouwconcessies
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1194/96 do Conselho de 27 de Junho de 1996 que prorroga
    o Regulamento (CE) nº 3066/95 que estabelece determinadas concessões sob a forma
    de contingentes pautais comunitários para certos produtos agrícolas e que prevê
    a adaptação autónoma e transitória de certas concessões agrícolas previstas
    nos acordos europeus para ter em conta o acordo sobre a agricultura concluído
    no âmbito das negociações comerciais multilaterais do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1194/96 del Consejo de 27 de junio de 1996 que prorroga
    el Reglamento (CE) nº 3066/95 por el que se establecen determinadas concesiones
    en forma de contingentes arancelarios comunitarios para determinados productos
    agrícolas y se adaptan, con carácter autónomo y transitorio, determinadas concesiones
    agrícolas previstas en los Acuerdos Europeos con el fin de tener en cuenta el
    Acuerdo sobre agricultura celebrado en el marco de las negociaciones comerciales
    multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1194/96 av den 27 juni 1996 om förlängning
    av förordning (EG) nr 3066/95 om införande av vissa koncessioner i form av gemenskapstullkvoter
    för vissa jordbruksprodukter och om autonom anpassning under en övergångsperiod
    av vissa jordbrukskoncessioner som föreskrivs i Europaavtalen i syfte att beakta
    det jordbruksavtal som slöts inom ramen för de multilaterala handelsförhandlingarna
    i Uruguayrundan
  type: main
