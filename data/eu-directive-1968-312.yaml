    και διοικητικών διατάξεων των σχετικών με:
    1. την προσκόμιση στο τελωνείο εμπορευμάτων
    αφικνουμένων στο τελωνειακό έδαφος της Κοινότητος,
    2. την προσωρινή εναπόθεση των εμπορευμάτων
    αυτών'
  type: main
- language: it
  script: Latn
