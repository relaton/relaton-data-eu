title:
- language: en
  script: Latn
  content: 'Council Directive 68/312/EEC of 30 July 1968 on harmonisation of the provisions
    laid down by law, regulation or administrative action relating to: 1. customs
    treatment of goods entering the customs territory of the Community; 2. temporary
    storage of such goods'
  type: main
- language: fr
  script: Latn
  content: 'Directive 68/312/CEE du Conseil, du 30 juillet 1968, concernant l''harmonisation
    des dispositions législatives, réglementaires et administratives relatives:
    1. A la conduite en douane des marchandises arrivant sur le territoire douanier
    de la Communauté, 2. au dépôt provisoire de ces marchandises'
  type: main
- language: de
  script: Latn
  content: Richtlinie 68/312/EWG des Rates vom 30. Juli 1968 zur Harmonisierung der
    Rechts- und Verwaltungsvorschriften über 1. die zollamtliche Erfassung der Waren,
    die in das Zollgebiet der Gemeinschaft verbracht werden, 2. die vorübergehende
    Verwahrung dieser Waren
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 68/312/EØF af 30. juli 1968 om harmonisering af lovgivning
