    la presentazione in dogana delle merci che arrivano nel territorio doganale della
    Comunità, 2. la custodia temporanea di tali merci
  type: main
- language: nl
  script: Latn
  content: 'Richtlijn 68/312/EEG van de Raad van 30 juli 1968 inzake de harmonisatie
