title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 février 1972, autorisant la République
    italienne à exclure du traitement communautaire les lampes, tubes et valves électroniques,
    de la position 85.01 A du Tarif douanier commun, originaires du Japon et mis en
    libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/127/EWG: Entscheidung der Kommission vom 17. Februar 1972, mit der
    die Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Elektronenröhren der Tarifnummer
    85.21 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/127/CEE: Decisione della Commissione, del 17 febbraio 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le lampade, tubi
    e valvole elettronici della voce n. 85.21 A della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/127/EEG: Beschikking van de Commissie van 17 februari 1972 waarbij
    de Italiaanse Republiek wordt gemachtigd elektronenbuizen van post 85.21 A van
    het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
