title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 462/71 du Conseil, du 1er mars 1971, portant conclusion
    de deux accords sous forme d'échange de lettres, l'un relatif à la modification
    de l'article 5 de l'annexe 1 de l'accord créant une association entre la Communauté
    économique européenne et le Royaume du Maroc et l'autre relatif à certaines
    rectifications matérielles à apporter aux listes 1 et 6 jointes à l'annexe
    3 de cet accord
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 462/71 des Rates vom 1. März 1971 über den Abschluß
    zweier Abkommen in Form eines Briefwechsels, eines Abkommens zur Änderung von
    Artikel 5 des Anhangs 1 des Abkommens zur Gründung einer Assoziation zwischen
    der Europäischen Wirtschaftsgemeinschaft und dem Königreich Marokko und eines
    anderen Abkommens über materielle Berichtigungen in den Listen 1 und 6 des Anhangs
    3 des genannten Assoziationsabkommens
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 462/71 del Consiglio, del 1 marzo 1971, recante conclusione
    di due accordi, sotto forma di scambi di lettere, uno relativo alla modifica dell'articolo
    5 dell'allegato 1 dell'Accordo che crea un'associazione tra la Comunità economica
    europea ed il Regno del Marocco e l'altro relativo a talune rettifiche materiali
    da apportare agli elenchi 1 e 6 acclusi all'allegato 3 di detto Accordo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 462/71 van de Raad van 1 maart 1971 houdende sluiting
    van twee overeenkomsten, in de vorm van briefwisselingen, de ene inzake de wijziging
    van artikel 5 van bijlage 1 van de Overeenkomst waarbij een Associatie tot stand
    wordt gebracht tussen de Europese Economische Gemeenschap en het Koninkrijk Marokko
    en de andere inzake bepaalde rectificaties, aan te brengen in de lijsten 1 en
    6 van bijlage 3 van deze Overeenkomst
  type: main
