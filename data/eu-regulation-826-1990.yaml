title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 826/90 of 28 March 1990 on the arrangement
    applicable to agricultural products subject to reference quantities and originating
    in the African, Caribbean and Pacific states or in the overseas countries and
    territories (1990)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 826/90 de la Commission du 28 mars 1990 concernant
    la procédure à appliquer à certains produits agricoles, soumis à des quantités
    de référence, originaires des États d'Afrique, des Caraïbes et du Pacifique
    (ACP) ou des pays et territoires d'outre-mer (PTOM) (1990)
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 826/90 DER KOMMISSION vom 28. Maerz 1990 ueber das
    Verfahren, das auf bestimmte landwirtschaftliche Waren mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP-Staaten) oder in
    den ueberseeischen Laendern und Gebieten (UeLG), die Referenzmengen unterworfen
    sind, anzuwenden ist (1990)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 826/90 af 28. marts 1990 om den ordning,
    der skal gælde for visse landbrugsprodukter, som er undergivet en referencemængde,
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske
    lande og territorier (1990)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 826/90 της Επιτροπής
    της 28ης Μαρτίου 1990 σχετικά με τη διαδικασία
    που θα εφαρμόζεται σε ορισμένα αγροτικά προϊόντα
    που υπόκεινται σε ποσότητες αναφοράς, καταγωγής
    των κρατών της Αφρικής, της Καραϊβικής και
    του Ειρηνικού ( ΑΚΕ ) ή των υπερποντίων χωρών
    και εδαφών ( ΥΧΕ ) ( 1990 )
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 826/90 DELLA COMMISSIONE del 28 marzo 1990 relativo
    alla procedura applicabile a determinati prodotti agricoli, sottoposti a quantità
    di riferimento, originari dei paesi d'Africa, dei Caraibi e del Pacifico (ACP)
    o dei paesi e territori d'oltremare (PTOM) (1990)
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 826/90 VAN DE COMMISSIE van 28 maart 1990 betreffende
    de toe te passen procedure voor bepaalde landbouwprodukten, waarvoor een referentiehoeveelheid
    is vastgesteld, van oorsprong uit de Staten in Afrika, het Caribische gebied en
    de Stille Oceaan (ACS-Staten) of uit de landen en gebieden overzee (LGO) (1990)
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 826/90 DA COMISSAO de 28 de Março de 1990 relativo
    ao procedimento aplicavel a certos produtos agricolas sujeitos a quantidades de
    referência e originarios dos Estados de Africa, Caraibas e Pacifico (ACP) ou
    dos paises e territorios ultramarinos (PTU) (1990)
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 826/90 DE LA COMISION de 28 de marzo de 1990 relativo
    al procedimiento a aplicar para determinados productos agricolas, sometidos a
    cantidades de referencia y originarios de los Estados de Africa, del Caribe y
    del Pacifico (ACP) o de los paises y territorios de Ultramar (PTU) (1990)
  type: main
