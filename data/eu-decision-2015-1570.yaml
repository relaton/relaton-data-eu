title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/1570 of 18 September 2015 establishing the position
    to be taken on behalf of the European Union within the Council for Trade in Services
    of the World Trade Organization on the approval of preferential treatment notified
    by WTO Members, other than the Union and its Member States, as regards services
    and service suppliers of least-developed country Members, on the application of
    measures other than those described in Article XVI of the GATS
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/1570 du Conseil du 18 septembre 2015 établissant la
    position à prendre au nom de l'Union européenne au sein du Conseil du commerce
    des services de l'Organisation mondiale du commerce au sujet de l'approbation
    d'un traitement préférentiel notifié par les membres de l'OMC, autres que l'Union
    et ses États membres, en ce qui concerne les services et fournisseurs de services
    des pays les moins avancés membres, sur l'application de mesures autres que celles
    définies à l'article XVI de l'AGCS
  type: main
- language: de
