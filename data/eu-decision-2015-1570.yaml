    der Welthandelsorganisation (WTO) zu vertretenden Standpunkts hinsichtlich der
    Genehmigung von anderen als in Artikel XVI GATS beschriebenen, in Bezug auf Dienstleistungen
    und Dienstleistungserbringer der am wenigsten entwickelten Länder gewährten
    Präferenzbehandlungen, die von WTO-Mitgliedern — abgesehen von der Union und
    ihren Mitgliedstaaten — notifiziert wurden
