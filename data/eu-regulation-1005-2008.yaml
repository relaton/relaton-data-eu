title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1005/2008 of 29 September 2008 establishing
    a Community system to prevent, deter and eliminate illegal, unreported and unregulated
    fishing, amending Regulations (EEC) No 2847/93, (EC) No 1936/2001 and (EC) No
    601/2004 and repealing Regulations (EC) No 1093/94 and (EC) No 1447/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1005/2008 du Conseil du 29 septembre 2008 établissant
    un système communautaire destiné à prévenir, à décourager et à éradiquer
    la pêche illicite, non déclarée et non réglementée, modifiant les règlements
    (CEE) n o 2847/93, (CE) n o 1936/2001 et (CE) n o 601/2004 et abrogeant les règlements
    (CE) n o 1093/94 et (CE) n o 1447/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1005/2008 des Rates vom 29. September 2008 über ein
    Gemeinschaftssystem zur Verhinderung, Bekämpfung und Unterbindung der illegalen,
    nicht gemeldeten und unregulierten Fischerei, zur Änderung der Verordnungen (EWG)
    Nr. 2847/93, (EG) Nr. 1936/2001 und (EG) Nr. 601/2004 und zur Aufhebung der Verordnungen
    (EG) Nr. 1093/94 und (EG) Nr. 1447/1999
  type: main
