    на незаконния, недеклариран и нерегулиран
    риболов, за изменение на регламенти (ЕИО) №
    2847/93, (ЕО) № 1936/2001 и (ЕО) № 601/2004 и за отмяна на
    регламенти (ЕО) № 1093/94 и (ЕО) № 1447/1999
  type: main
- language: cs
  script: Latn
