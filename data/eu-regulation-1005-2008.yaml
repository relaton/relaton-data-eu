    pescuitului ilegal, nedeclarat și nereglementat, de modificare a Regulamentelor
    (CEE) nr. 2847/93, (CE) nr. 1936/2001 și (CE) nr. 601/2004 și de abrogare a
    Regulamentelor (CE) nr. 1093/94 și (CE) nr. 1447/1999
  type: main
