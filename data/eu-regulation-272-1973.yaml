title:
- language: en
  script: Latn
  content: Regulation (EEC) No 272/73 of the Commission of 31 January 1973 on provisional
    measures to ensure in particular the application of the system of compensatory
    amounts provided for in the Treaty concerning the Accession of new Member States
    to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 272/73 de la Commission, du 31 janvier 1973, prévoyant
    des mesures provisoires en vue d' assurer notamment l' application du régime
    des montants compensatoires prévus par le traité relatif à l' adhésion des
    nouveaux États membres à la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 272/73 der Kommission vom 31. Januar 1973 über provisorische
    Maßnahmen zur Durchführung der im Vertrag über den Beitritt neuer Mitgliedstaaten
    zur Gemeinschaft vorgesehenen Ausgleichsbetragsregelung
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 272/73 af 31. januar 1973 om fastsættelse
    af foreløbige foranstaltninger særligt med henblik på anvendelsen af den ordning
    med udligningsbeløb, der er fastsat i traktaten vedrørende nye medlemsstaters
    tiltrædelse af Fællesskabet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 272/73 della Commissione, del 31 gennaio 1973, relativo
    a misure provvisorie intese ad assicurare in particolare l' applicazione del regime
    degli importi di compensazione previsti dal trattato relativo all' adesione dei
    nuovi Stati membri alla Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 272/73 van de Commissie van 31 januari 1973 houdende
    voorlopige maatregelen tot waarborging met name van de toepassing van het stelsel
    van compenserende bedragen vastgesteld in het Verdrag betreffende de toetreding
    van nieuwe Lid-Staten tot de Gemeenschap
