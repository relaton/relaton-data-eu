title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1089/87 of 15 April 1987 re-establishing
    the levying of customs duties on woven fabrics of man-made fibres (discontinuous
    or waste), products of category No ex 3 (code 40.0033), originating in Pakistan,
    to which the preferential tariff arrangements of Council Regulation (EEC) No 3925/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1089/87 de la Commission du 15 avril 1987 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles synthétiques et artificielles discontinues, de la catégorie
    ex 3 (code 40.0033), originaires du Pakistan, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1089/87 der Kommission vom 15. April 1987 über die
    Wiedereinführung des Zollsatzes für Gewebe aus synthetischen oder künstlichen
    Spinnfasern der Warenkategorie Nr. ex 3 (Kennziffer 40.0033) mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1089/87 af 15. april 1987 om genindførelse
    af opkrævning af toldafgifter for vævet stof af korte kemofibre eller af affald
    af kemofibre, under varekategori nr. ex 3 i den fælles toldtarif (kode 40.0033),
    som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1089/87 της Επιτροπής
    της 15ης Απριλίου 1987 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για υφάσματα
    από συνθετικές και τεχνητές υφαντικές ίνες
    μη συνεχείς, της κατηγορίας προϊόντων αριθ.
    ex 3 (κωδικός 40.0033), καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3925/86 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1089/87 della Commissione del 15 aprile 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili sintetiche
    ed artificiali in fiocco, della categoria di prodotti ex 3 (codice 40.0033), originari
    del Pakistan beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1089/87 van de Commissie van 15 april 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische of van kunstmatige stapelvezels, van de categorie van produkten
    nr. ex 3 (codenummer 40.0033), van oorsprong uit Pakistan, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3925/86 van de
    Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1089/87 da Comissão de 15 de Abril de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a tecidos de fibras
    têxteis sintéticas ou artificiais descontínuas da categoria de produtos n.°
    ex 3 (código 40.0033), originários do Paquistão, beneficiário das preferências
    pautais previstas no Regulamento (CEE) n.° 3925/86 do Conselho
  type: main
- language: es
