    af blød hvede samt rug egnet til brødproduktion, for så vidt angår de farvestoffer,
    som skal benyttes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1886/74 della Commissione, del 19 luglio 1974, che
    modifica il regolamento (CEE) n. 1403/69 relativo alle modalità d' applicazione
    delle disposizioni concernenti la denaturazione del frumento tenero e della segala
    da panificazione, per quanto riguarda i coloranti da utilizzare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1886/74 van de Commissie van 19 juli 1974 tot wijziging
    van Verordening (EEG) nr. 1403/69 houdende vaststelling van de wijze van toepassing
    van de bepalingen betreffende de denaturering van zachte tarwe en rogge voor broodbereiding,
    wat de te gebruiken kleurstoffen betreft
