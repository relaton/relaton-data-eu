title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1886/74 of the Commission of 19 July 1974 amending
    Regulation (EEC) No 1403/69 laying down detailed rules for the application of
    the provisions concerning denaturing of common wheat and rye of bread-making quality
    as regards the colouring materials to be used
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1886/74 de la Commission, du 19 juillet 1974, modifiant
    le règlement (CEE) n° 1403/69 portant modalités d' application des dispositions
    relatives à la dénaturation du froment tendre et du seigle panifiable, en ce
    qui concerne les colorants à utiliser
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1886/74 der Kommission vom 19. Juli 1974 zur Änderung
    der Verordnung (EWG) Nr. 1403/69 zur Durchführung der Vorschriften über die
    Denaturierung von Weichweizen und zur Brotherstellung geeignetem Roggen hinsichtlich
    der zu verwendenden Farbstoffe
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1886/74 af 19. juli 1974 om ændring
