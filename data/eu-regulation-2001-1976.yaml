title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2001/76 of 10 August 1976 on the invitation
    to tender for the supply to UNICEF, for the benefit of certain third countries
    for use as food aid, of vitaminized skimmed-milk powder to be purchased on the
    Community market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2001/76 de la Commission, du 10 août 1976, relatif
    à l'adjudication de la fourniture, au titre de l'aide alimentaire, de lait écrémé
    en poudre vitaminé acheté sur le marché de la Communauté à l'UNICEF et destiné
    à certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2001/76 der Kommission vom 10. August 1976 über die
    Ausschreibung einer Lieferung von auf dem Markt der Gemeinschaft gekauftem Magermilchpulver
    mit zugesetzten Vitaminen an die UNICEF im Rahmen der Nahrungsmittelhilfe für
    verschiedene Drittländer
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2001/76 af 10. august 1976 om licitation
    med henblik på levering af vitaminiseret skummetmælkspulver, der er opkøbt
    på Fællesskabets marked og bestemt for UNICEF som fødevarehjælp til forskellige
    tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2001/76 della Commissione, del 10 agosto 1976, che
    indice una gara per la fornitura all' UNICEF, a titolo di aiuto alimentare, di
    latte scremato in polvere vitaminizzato acquistato sul mercato della Comunità
    e destinato a taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2001/76 van de Commissie van 10 augustus 1976 met
    betrekking tot de openbare inschrijving voor de levering van gevitamineerd magere-melkpoeder,
    gekocht op de markt van de Gemeenschap, aan de UNICEF als voedselhulp voor bepaalde
    derde landen
