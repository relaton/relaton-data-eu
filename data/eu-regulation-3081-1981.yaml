title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3081/81 of 28 October 1981 specifying the
    extent to which applications lodged during the month of October 1981 for import
    licences in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3081/81 de la Commission, du 28 octobre 1981, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'octobre 1981 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3081/81 der Kommission vom 28. Oktober 1981 über
    das Ausmaß, in dem den im Oktober 1981 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3081/81 af 28. oktober 1981 om det
    omfang, i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet
    i oktober 1981 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3081/81 της Επιτροπής
    της 28ης Οκτωβρίου 1981 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, πού
    υποβλήθηκαν τον Οκτώβριο 1981, για τα νεαρά άρρενα
    βοοειδή πού προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3081/81 della Commissione, del 28 ottobre 1981, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 1981 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3081/81 van de Commissie van 28 oktober 1981 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in oktober 1981 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
