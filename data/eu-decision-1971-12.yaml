title:
- language: en
  script: Latn
  content: '71/12/EEC: Commission Decision of 7 December 1970 amending the decision
    of 3 June 1970 authorizing the kingdom of Belgium to approve, for marketing purposes,
    seed of pseutotsuga menziesii ( mirb. ) franco and of picea sitchensis trautv.
    and mey., satisfying less stringent requirements (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '71/12/CEE: Décision de la Commission, du 7 décembre 1970, modifiant
    la décision du 3 juin 1970, autorisant le Royaume de Belgique à admettre, à
    la commercialisation, des semences de pseudotsuga menziesii (mirb.) franco et
    de picea sitchensis trautv. et mey., soumises à des exigences réduites (Les
    textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '71/12/EWG: Entscheidung der Kommission vom 7. Dezember 1970 zur Änderung
    der Entscheidung vom 3. Juni 1970, mit der das Königreich Belgien ermächtigt
    wird, Saatgut von pseudotsuga menziesii ( mirb. ) franco und von picea sitchensis
    trautv. und mey. mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: it
  script: Latn
  content: '71/12/CEE: Decisione della Commissione, del 7 dicembre 1970, che modifica
    la decisione del 3 giugno 1970 che autorizza il regno del Belgio ad ammettere
    alla commercializzazione le sementi di pseudotsuga menziesii ( mirb. ) franco
    e di picea sitchensis trautv. e mey., sottoposte a requisiti ridotti (I testi
    in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '71/12/EEG: Beschikking van de Commissie van 7 december 1970 houdende wijziging
    van de beschikking van 3 juni 1970 waarbij het koninkrijk België gemachtigd wordt
    om zaden, waaraan minder strenge eisen zijn gesteld, van pseudotsuga menziesii
    ( mirb. ) franco en picea sitchensis trautv. en mey in de handel toe te laten
    (slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
