    mancher seiner unmittelbar der englischen Krone unterstehenden Gebiete in die
    Liste der Drittländer und Teile des Hoheitsgebiets von Drittländern, aus denen
    der Eingang lebender Equiden sowie von Sperma, Eizellen und Embryonen von Equiden
    in die Union zugelassen ist
