title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/590 of 11 April 2019 amending
    Annex I to Implementing Regulation (EU) 2018/659 as regards the inclusion of the
    United Kingdom of Great Britain and Northern Ireland and certain of its Crown
    Dependencies in the list of third countries and parts of the territory of third
    countries from which the entry into the Union of live equidae and semen, ova and
    embryos of equidae is authorised
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/590 de la Commission du 11 avril 2019
    modifiant l'annexe I du règlement d'exécution (UE) 2018/659 en ce qui concerne
    l'inscription du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord et certaines
    dépendances de la Couronne sur la liste des pays tiers ou parties de pays tiers
    en provenance desquels l'entrée dans l'Union d'équidés vivants et de sperme,
    d'ovules et d'embryons d'équidés est autorisée
  type: main
- language: de
  script: Latn
