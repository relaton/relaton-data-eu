  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3467/80 della Commissione, del 30 dicembre 1980, che
    modifica, in seguito all' adesione della Grecia, il regolamento (CEE) n. 298/80
    relativo alla vendita, a prezzi fissati forfettariamente in anticipo, di carni
    bovine non disossate detenute dagli organismi di intervento e destinate ad essere
    esportate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3467/80 van de Commissie van 30 december 1980 tot
    wijziging van Verordening (EEG) nr. 298/80 betreffende de verkoop, tegen vooraf
