title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3467/80 of 30 December 1980 amending Regulation
    (EEC) No 298/80 on the sale at a price fixed in advance of bone-in beef and veal
    held by the intervention agencies and intended for export, as a result of Greek
    accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3467/80 de la Commission, du 30 décembre 1980, modifiant
    le règlement (CEE) n° 298/80 relatif à la vente à prix fixé forfaitairement
    à l' avance de viandes bovines avec os détenues par les organismes d' intervention
    et destinées à être exportées, à la suite de l' adhésion de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3467/80 der Kommission vom 30. Dezember 1980 zur Änderung
    der Verordnung (EWG) Nr. 298/80 über den Verkauf von zur Ausfuhr bestimmtem Rindfleisch
    mit Knochen zu pauschal im voraus festgesetzten Preisen aus Beständen der Interventionsstellen
    infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3467/80 af 30. december 1980 om ændring
    af forordning (EØF) nr. 298/80 om salg til forudfastsat pris med henblik på
    udførsel af ikke-udbenet oksekød fra interventionsorganerne, som følge af Grækenlands
    tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3467/80 τής Επιτροπής
