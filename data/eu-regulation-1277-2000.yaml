  content: Commission Regulation (EC) No 1277/2000 of 16 June 2000 amending Regulation
    (EC) No 2799/1999 laying down detailed rules for applying Regulation (EC) No 1255/1999
    as regards the grant of aid for skimmed milk and skimmed-milk powder intended
    for animal feed and the sale of such skimmed-milk powder
  type: main
- language: fr
  script: Latn
