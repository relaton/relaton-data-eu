title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2195/78 of 20 September 1978 re-establishing
    the levying of customs duties on locks and padlocks, falling within heading No
    83.01, originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2195/78 de la Commission, du 20 septembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux serrures,
    verrous et cadenas, de la position tarifaire 83.01, originaires de Hong-Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2195/78 der Kommission vom 20. September 1978 zur
    Wiedereinführung des Zollsatzes für Schlösser (einschließlich Verschlüsse
    und Verschlußbügel mit Schloß) der Tarifnummer 83.01, mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2195/78 af 20. september 1978 om genindførelse
    af opkrævning af toldafgifter for nøglelåse, kombinationslåse etc., under
    position 83.01, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2195/78 della Commissione, del 20 settembre 1978,
    che ripristina la riscossione dei dazi doganali applicabili alle serrature, catenacci
    e lucchetti, della voce 83.01 della tariffa doganale comune, originari di Hong
    Kong, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2195/78 van de Commissie van 20 september 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op sloten,
    grendelsloten en hangsloten, van post 83.01, van oorsprong uit Hong-Kong, ten
    behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
