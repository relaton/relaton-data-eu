title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3026/75 of the Commission of 19 November 1975 re-establishing
    the levying of the customs duties on vinyl acetate (monomer), falling within subheading
    29.14 A II c) ex 1, originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3026/75 de la Commission, du 19 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables à l'acétate
    de vinyle (monomère) de la sous-position tarifaire 29.14 A II c) EX 1, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3026/75 der Kommission vom 19. November 1975 zur Wiedereinführung
    des Zollsatzes Vinylacetat (Monomer) der Tarifstelle 29.14 A II c) ex 1 mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember
    1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3026/75 af 19. november 1975 om genindførelse
    af opkrævning af toldafgifter for vinylacetat (monomer) under underposition 29.14
    A II c) ex 1, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3026/75 della Commissione, del 19 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili all'acetato di vinile
    (monomero), della sottovoce doganale 29.14 A II c) ex 1, originario della Romania,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3026/75 van de Commissie van 19 november 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op vinylacetaat
    (monomeer), van onderverdeling 29.14 A II c) ex 1, van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
