title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 885/81 of 1 April 1981 reintroducing the
    levying of customs duties applicable to other sheep and lamb skin leather falling
    under subheading 41.03 B II, originating in India and benefiting from the tariff
    preferences provided for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 885/81 de la Commission, du 1er avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d' ovins, non dénommées, de la sous-position 41.03 B II du tarif douanier commun,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 885/81 der Kommission vom 1. April 1981 zur Wiedereinführung
    der Erhebung der Zölle für anderes Schaf- und Lammleder, unbestimmt, der Tarifstelle
    41.03 B II, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3322/80
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 885/81 af 1. april 1981 om genindførelse
    af opkrævning af told for andet læder af fåre- og lammeskind, henhørende under
    pos. 41.03 B II og med oprindelse i Indien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 885/81 τής Επιτροπής
