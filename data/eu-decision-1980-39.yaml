title:
- language: en
  script: Latn
  content: '80/39/EEC: Commission Decision of 30 November 1979 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of a payment on account
    in respect of expenditure incurred during 1978 on aids relating to the provision
    of socio-economic guidance for and the acquisition of occupational skills by persons
    engaged in agriculture (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/39/CEE: Décision de la Commission, du 30 novembre 1979, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les aides relatives à l''information
    socio-économique et à la qualification professionnelle des personnes travaillant
    dans l''agriculture (Les textes en langues française et néerlandaise sont les
    seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/39/EWG: Entscheidung der Kommission vom 30. November 1979 über die
    Zahl eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben an das Königreich
    Belgien (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/39/EØF: Kommissionens beslutning af 30. november 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1978 til støtte vedrørende social
    og erhvervsmæssig vejledning og faglige kvalifikationer hos de personer, som
    arbejder i landbruget (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/39/CEE: Decisione della Commissione, del 30 novembre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno del Belgio di
    un acconto sulle spese effettuate durante il 1978 per gli aiuti concernenti l''informazione
    socio-economica e la qualificazione professionale delle persone che lavorano nell''agricoltura
    (Il testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/39/EEG: Beschikking van de Commissie van 30 november 1979 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    een voorschot in verband met de gedurende het jaar 1978 gedane uitgaven voor de
    steun met betrekking tot de sociaal- economische voorlichting en de scholing van
    de personen die in de landbouw werkzaam zijn (Slechts de teksten in de Franse
    en de Nederlandse taal zijn authentiek)'
  type: main
