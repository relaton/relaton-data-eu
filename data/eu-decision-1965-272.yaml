title:
- language: fr
  script: Latn
  content: Décision 65/272/CEE de la Commission, du 5 mai 1965, relative à un recours
    de la République française à l'article 115 alinéa 1 du Traité pour exclure
    du traitement communautaire les "truites, fraîches, réfrigérées ou congelées",
    originaires du Japon et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/272/EWG: Entscheidung der Kommission vom 5. Mai 1965 betreffend den
    Antrag der Französischen Republik gemäß Artikel 115 Absatz (1) des Vertrages,
    um aus Japan stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    "Forellen, frisch, gekühlt oder gefroren" von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/272/CEE: Decisione della Commissione, del 5 maggio 1965, relativa a
    un ricorso presentato dalla Repubblica francese ai sensi dell''articolo 115, primo
    capoverso, del Trattato, per escludere dal trattamento comunitario le «trote,
    fresche, refrigerate o congelate» originarie del Giappone e messe in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/272/EEG: Beschikking van de Commissie van 5 mei 1965 betreffende een
    verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea, van
    het Verdrag forellen, vers, gekoeld of bevroren, die van oorsprong zijn uit Japan
    en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
