title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2028/87 of 8 July 1987 re-establishing the
    levying of customs duties on woven fabrics of synthetic textile fibres, products
    of category 35 (code 40.0350), originating in Indonesia to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2028/87 de la Commission du 8 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles synthétiques de la catégorie 35 (code 40.0350), originaires
    de l' Indonésie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2028/87 der Kommission vom 8. Juli 1987 zur Wiedereinführung
    des Zollsatzes für Gewebe aus synthetischen Spinnfäden der Warenkategorie Nr.
    35 (Kennziffer 40.0350) mit Ursprung in Indonesien, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2028/87 af 8. juli 1987 om genindførelse
