title:
- language: en
  script: Latn
  content: '83/302/EEC: Commission Decision of 9 June 1983 establishing that the apparatus
    described as ''Delmar - Electrocardioscanner, model 660A with DCG Data Terminal,
    model 680, Ambulatory Pressurometer II System and Arrhythmia Analyzer, model 662B''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/302/CEE: Décision de la Commission du 9 juin 1983 constatant que l''importation
    de l''appareil dénommé "Delmar - Electrocardioscanner, model 660A with DCG Data
    Terminal, model 680, Ambulatory Pressurometer II System and Arrhythmia Analyzer,
    model 662B" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/302/EWG: Entscheidung der Kommission vom 9. Juni 1983, mit der festgestellt
    wird, daß das Gerät ,,Delmar - Electrocardioscanner, model 660A with DCG Data
    Terminal, model 680, Ambulatory Pressurometer II System and Arrhythmia Analyzer,
    model 662B" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '83/302/EØF: Kommissionens beslutning af 9. juni 1983 om fastslåelse
    af, at indførsel af apparatet "Delmar - Electrocardioscanner, model 660A with
    DCG Data Terminal, model 680, Ambulatory Pressurometer II System and Arrhythmia
    Analyzer, model 662B" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/302/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Ιουνίου
    1983 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «Delmar — Electrocardioscanner, model 660A with
    DCG Data Terminal, model 680, Ambulatory Pressurometer II System and Arrhythmia
    Analyzer, model 662B» δεν δύναται να πραγματοποιηθεί
    ατελώς ως προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/302/CEE: Decisione della Commissione del 9 giugno 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "Delmar - Electrocardioscanner,
    model 660A with DCG Data Terminal, model 680, Ambulatory Pressurometer II System
    and Arrhythmia Analyzer, model 662B", non può avvenire in franchigia dai dazi
    della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/302/EEG: Beschikking van de Commissie van 9 juni 1983 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Delmar - Electrocardioscanner, model 660A
    with DCG Data Terminal, model 680, Ambulatory Pressurometer II System and Arrhythmia
    Analyzer, model 662B" niet met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
