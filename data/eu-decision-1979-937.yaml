title:
- language: en
  script: Latn
  content: '79/937/EEC: Commission Decision of 22 October 1979 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of a payment on account
    in respect of expenditure incurred during 1978 on aids for the less- favoured
    farming areas (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/937/CEE: Décision de la Commission, du 22 octobre 1979, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les aides en faveur des zones agricoles
    défavorisées (Les textes en langues française et néerlandaise sont les seuls
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/937/EWG: Entscheidung der Kommission vom 22. Oktober 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 in benachteiligten landwirtschaftlichen Gebieten gewährten Hilfen an das
    Königreich Belgien (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/937/EØF: Kommissionens beslutning af 22. oktober 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1978 til støtte til ugunstigt stillede
    landbrugsområder (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/937/CEE: Decisione della Commissione, del 22 ottobre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno del Belgio di
    un anticipo sulle spese effettuate durante il 1978 per gli aiuti in favore delle
    zone agricole svantaggiate (I testi in lingua francese e olandese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/937/EEG: Beschikking van de Commissie van 22 oktober 1979 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    een voorschot in verband met de in 1978 verrichte uitgaven voor steun aan probleemgebieden
    in de landbouw (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
