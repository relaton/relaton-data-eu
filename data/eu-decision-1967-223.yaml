title:
- language: fr
  script: Latn
  content: Décision 67/223/CEE de la Commission, du 23 mars 1967, autorisant la République
    française à exclure du traitement communautaire, à partir du 1er mai 1967,
    les aulx originaires des pays tiers et mis en libre pratique dans les autres États
    membres
  type: main
- language: de
  script: Latn
  content: '67/223/EWG: Entscheidung der Kommission vom 23. März 1967, mit der die
    Französische Republik ermächtigt wird, ab 1. Mai 1967 Knoblauch mit Ursprung
    in dritten Ländern, der sich in den anderen Mitgliedstaaten im freien Verkehr
    befindet, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/223/CEE: Decisione della Commissione, del 23 marzo 1967, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario, a decorrere dal
    1 maggio 1967, gli agli originari dei paesi terzi e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/223/EEG: Beschikking van de Commissie van 23 maart 1967 waarbij de
    Franse Republiek wordt gemachtigd om met ingang van 1 mei 1967 knoflook, van oorsprong
    uit derde landen en in de andere Lid-Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
