title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2842/76 of 23 November 1976 amending Annex
    IV to Regulation (EEC) No 816/70 laying down additional provisions for the common
    organization of the market in wine, and the Common Customs Tariff, as regards
    the exchange rate applicable to customs duties on certain wines
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2842/76 du Conseil, du 23 novembre 1976, modifiant
    l' annexe IV du règlement (CEE) n° 816/70 portant dispositions complémentaires
    en matière d' organisation commune du marché viti-vinicole et le tarif douanier
    commun en ce qui concerne le taux de change applicable aux droits de douane sur
    certains vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2842/76 des Rates vom 23. November 1976 zur Änderung
    des Anhangs IV der Verordnung (EWG) Nr. 816/70 zur Festlegung ergänzender Vorschriften
    für die gemeinsame Marktorganisation für Wein und zur Änderung des Gemeinsamen
    Zolltarifs hinsichtlich des auf bestimmte Weine anzuwendenden Wechselkurses
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2842/76 af 23. november 1976 om ændring
    af bilag IV i forordning (EØF) nr. 816/70 om supplerende regler for den fælles
    markedsordning for vin og af den fælles toldafgift for så vidt angår de vekselkurser,
    der skal anvendes for toldsatser for visse vine
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2842/76 del Consiglio, del 23 novembre 1976, che modifica
    l' allegato IV del regolamento (CEE) n. 816/70, relativo a disposizioni complementari
    in materia di organizzazione comune del mercato vitivinicolo, e la tariffa doganale
    comune per quanto concerne il tasso di cambio applicabile ai dazi doganali su
    taluni vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2842/76 van de Raad van 23 november 1976 tot wijziging
    van bijlage IV van Verordening (EEG) nr. 816/70 houdende aanvullende bepalingen
    inzake de gemeenschappelijke ordening van de wijnmarkt, en van het gemeenschappelijk
    douanetarief, ten aanzien van de voor de douanerechten op bepaalde wijnen toe
    te passen wisselkoers
