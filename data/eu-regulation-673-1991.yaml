title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 673/91 of 20 March 1991 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export to the Soviet Union, amending Regulation (EEC)
    No 569/88 and repealing Regulation (EEC) No 3712/90
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 673/91 DE LA COMMISSION du 20 mars 1991 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) no 2539/84,
    de viandes bovines détenues par certains organismes d'' intervention et destinées
    à être exportées vers l'' Union soviétique, modifiant le règlement (CEE)
    no 569/88 et abrogeant le règlement (CEE) no 3712/90 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 673/91 DER KOMMISSION vom 20. März 1991 über den
    Verkauf von zur Ausfuhr in die Sowjetunion bestimmtem Rindfleisch aus Interventionsbeständen
    nach der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung (EWG) Nr.
    569/88 und zur Aufhebung der Verordnung (EWG) Nr. 3712/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 673/91 af 20. marts 1991 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på eksport til Sovjetunionen og om ændring af forordning (EØF)
    nr. 569/88 og om ophævelse af forordning (EØF) nr. 3712/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 673/91 της Επιτροπής
    της 20ής Μαρτίου 1991 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που κατέχεται
    από ορισμένους οργανισμούς παρεμβάσεως και
    προορίζεται να εξαχθεί προς τη Σοβιετική Ένωση,
    για τροποποίηση του κανονισμού (ΕΟΚ) αριθ. 569/88
    και για την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    3712/90
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 673/91 DELLA COMMISSIONE del 20 marzo 1991 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'' intervento e destinate all''
    esportazione in Unione Sovietica, che modifica il regolamento (CEE) n. 569/88
    e che abroga il regolamento (CEE) n. 3712/90 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 673/91 VAN DE COMMISSIE van 20 maart 1991 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer naar de Sowjetunie
    bestemd rundvlees, houdende wijziging van Verordening (EEG) nr. 569/88 en tot
    intrekking van Verordening (EEG) nr. 3712/90 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 673/91 DA COMISSÃO de 20 de Março de 1991 relativo
    à venda, no âmbito do procedimento definido no Regulamento (CEE) no 2539/84,
    de carne de bovino detida por certos organismos de intervenção e destinada a
    ser exportada, que altera o Regulamento (CEE) no 569/88 para a União Soviética
    e que revoga o Regulamento (CEE) no 3712/90 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 673/91 DE LA COMISIÓN de 20 de marzo de 1991 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno en poder de determinados organismos de intervención y destinadas
    a ser exportadas en la Unión Soviética y, por el que se modifica el Reglamento
    (CEE) no 569/88 y por el que se deroga el Reglamento (CEE) no 3712/90 #'
