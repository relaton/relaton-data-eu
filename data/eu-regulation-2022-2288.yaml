    de l’exemption, liée à la capacité de survie élevée, à l’obligation
    de débarquement pour les praires (Venus spp.), les coquilles Saint-Jacques (Pecten
    jacobaeus) et les palourdes (Venerupis spp.) en Méditerranée occidentale
