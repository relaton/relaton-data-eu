id: EUDecision1962236
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République italienne, en application
    de l'article 226 du Traité, à maintenir pour les oxydes de plomb (position 28.27
    du tarif douanier italien) la protection douanière telle qu'elle résulte de
    l'exécution intégrale des dispositions du Traité
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission betreffend die Ermächtigung der Italienischen
    Republik gemäß Artikel 226 des Vertrages, für Bleioxyde (Nummer des italienischen
    Zolltarifs 28.27) den sich aus der vollständigen Durchführung des Vertrages
    ergebenden Zollschutz beizubehalten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione accordata alla
    Repubblica Italiana, a norma dell'articolo 226 del Trattato, a mantenere la protezione
    doganale come risulta dall'esecuzione integrale delle disposizioni del Trattato,
    per gli ossidi di piombo (voce della tariffa doganale italiana 28.27)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de op grond van artikel 226 van
    het Verdrag aan de Italiaanse Republiek verleende machtiging om de uit de volledige
    tenuitvoerlegging van de bepalingen van het Verdrag voortvloeiende beschermende
    invoerrechten te handhaven voor loodoxyden (post 28.27 van het Italiaanse douanetarief)
  type: main
