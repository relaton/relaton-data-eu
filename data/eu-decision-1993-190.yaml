title:
- language: en
  script: Latn
  content: '93/190/EEC: Commission Decision of 5 March 1993 on the establishment of
    a supplement to the Community support framework for Community structural assistance
    on the improvement of the conditions under which forestry products are processed
    and marketed in Italy (with the exception of the following regions: Abruzzo, Basilicata,
    Calabria, Campania, Molise, Puglia, Sardinia and Sicily) (Only the Italian text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/190/CEE: Décision de la Commission, du 5 mars 1993, concernant l''établissement
    d''un supplément au cadre communautaire d''appui pour les interventions structurelles
    communautaires relatives à l''amélioration des conditions de transformation
    et de commercialisation des produits sylvicoles en Italie (à l''exception des
    régions suivantes: Abruzzes, Basilicate, Calabre, Campanie, Molise, Pouilles,
    Sardaigne, Sicile) (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/190/EWG: Entscheidung der Kommission vom 5. März 1993 über die Ergänzung
