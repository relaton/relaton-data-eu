    πλαίσιο στήριξης για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις όσον αφορά τη βελτίωση των συνθηκών
    μεταποίησης και εμπορίας των δασοκομικών προϊόντων
    στην Ιταλία [εκτός από τις ακόλουθες περιφέρειες:
