    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen forstwirtschaftlicher
    Erzeugnisse in Italien (mit Ausnahme folgender Regionen: Abruzzi, Basilicata,
    Calabria, Campania, Molise, Puglia, Sardegna, Sicilia) (Nur der italienische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/190/EØF: Kommissionens beslutning af 5. marts 1993 om fastlæggelse
