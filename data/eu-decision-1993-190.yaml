    κείμενο στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/190/CEE: Decisione della Commissione, del 5 marzo 1993, concernente
    la definizione di un supplemento al quadro comunitario di sostegno n. 92/85 del
