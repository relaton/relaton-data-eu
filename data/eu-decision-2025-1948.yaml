title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/1948 of 18 September 2025 on the position to
    be taken on behalf of the European Union within the EU-CTC Joint Committee established
    by the Convention on the simplification of formalities in trade in goods and within
    the EU-CTC Joint Committee established by the Convention on a Common transit procedure
    as regards the adoption of decisions inviting the Republic of Moldova and Montenegro
    to accede to those Conventions and as regards the adoption of decisions amending
    the Convention on a common transit procedure following the Republic of Moldova’s
    and Montenegro’s accession to that Convention
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1948 du Conseil du 18 septembre 2025 relative à la
    position à prendre au nom de l’Union européenne au sein de la commission mixte
    UE-PTC établie par la convention relative à la simplification des formalités
    dans les échanges de marchandises et au sein de la commission mixte UE-PTC établie
    par la convention relative à un régime de transit commun, en ce qui concerne
    l’adoption de décisions invitant la République de Moldavie et le Monténégro
    à adhérer à ces conventions et en ce qui concerne l’adoption de décisions
    modifiant la convention relative à un régime de transit commun à la suite de
    l’adhésion de la République de Moldavie et du Monténégro à cette convention
  type: main
