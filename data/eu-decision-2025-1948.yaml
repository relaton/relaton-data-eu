    in dem mit dem Übereinkommen über ein gemeinsames Versandverfahren eingesetzten
    Gemischten Ausschuss EU-CTC in Bezug auf die Annahme von Beschlüssen über die
    Einladung an die Republik Moldau und Montenegro, diesen Übereinkommen beizutreten,
    und in Bezug auf den Erlass von Beschlüssen zur Änderung des Übereinkommens
    über ein gemeinsames Versandverfahren infolge des Beitritts der Republik Moldau
    und Montenegros zu diesem Übereinkommen zu vertretenden Standpunkt
