---
id: EUDecision2020552
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/552 of 20 April 2020 amending
    Annexes I and II to Decision 2003/467/EC as regards the officially tuberculosis-free
    status of the region of Valle d’Aosta in Italy and of the Autonomous Region
    of the Azores in Portugal, and as regards the officially brucellosis-free status
    of several regions of Portugal (notified under document C(2020) 2260)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/552 de la Commission du 20 avril 2020
    modifiant les annexes I et II de la décision 2003/467/CE en ce qui concerne le
    statut d’officiellement indemne de tuberculose de la région du Val d’Aoste,
    en Italie, et de la région autonome des Açores, au Portugal, et en ce qui concerne
    le statut d’officiellement indemne de brucellose de plusieurs régions du Portugal
    [notifiée sous le numéro C(2020) 2260]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/552 der Kommission vom 20. April 2020
    zur Änderung der Anhänge I und II der Entscheidung 2003/467/EG in Bezug auf
    den Status der Region Aostatal (Italien) und der Autonomen Region Azoren (Portugal)
    als amtlich anerkannt tuberkulosefrei sowie in Bezug auf den Status mehrerer Regionen
    Portugals als amtlich anerkannt brucellosefrei (Bekannt gegeben unter Aktenzeichen
    C(2020) 2260)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/552 на Комисията
    от 20 април 2020 година за изменение на приложения
    I и II към Решение 2003/467/ЕО по отношение на статута
    на регион Valle d'Aosta в Италия и на автономния регион
    на Азорските острови в Португалия на официално
    свободни от туберкулоза и по отношение на статута
    на някои региони в Португалия на официално
    свободни от бруцелоза (нотифицирано под номер
    С(2020) 2260)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/552 ze dne 20. dubna 2020, kterým
    se mění přílohy I a II rozhodnutí 2003/467/ES, pokud jde o status oblasti
    Valle d’Aosta v Itálii a autonomní oblasti Azory v Portugalsku jako území
    úředně prostého tuberkulózy a pokud jde o status několika oblastí Portugalska
    jako území úředně prostého brucelózy (oznámeno pod číslem C(2020) 2260)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/552 af 20. april 2020
    om ændring af bilag I og II til beslutning 2003/467/EF for så vidt angår status
    som officielt tuberkulosefri for regionen Valle d'Aosta i Italien og den selvstyrende
    region Azorerne i Portugal og status som officielt brucellosefri for flere regioner
    i Portugal (meddelt under nummer C(2020) 2260)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/552 της Επιτροπής
    της 20ής Απριλίου 2020 για την τροποποίηση των
    παραρτημάτων I και II της απόφασης 2003/467/ΕΚ όσον
    αφορά το καθεστώς επισήμως απαλλαγμένων από
    τη φυματίωση για την περιφέρεια Valle d’Aosta στην
    Ιταλία και την αυτόνομη περιφέρεια των Αζορών
    στην Πορτογαλία, και όσον αφορά το καθεστώς
    επισήμως απαλλαγμένων από τη βρουκέλωση για
    διάφορες περιφέρειες της Πορτογαλίας [κοινοποιηθείσα
    υπό τον αριθμό C(2020) 2260]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/552, 20. aprill 2020, millega muudetakse
    otsuse 2003/467/EÜ I ja II lisa seoses Itaalia Valle d’Aosta maakonna ja Portugali
    Assooride autonoomse piirkonna ametlikult tuberkuloosivaba staatusega ning Portugali
    mitme piirkonna ametlikult brutselloosivaba staatusega (teatavaks tehtud numbri
    C(2020) 2260 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/552, annettu 20 päivänä
    huhtikuuta 2020, päätöksen 2003/467/EY liitteiden I ja II muuttamisesta Italian
    Aostanlaakson alueen ja Portugalin Azorien itsehallintoalueen tuberkuloosista
    virallisesti vapaan aseman sekä useiden Portugalin alueiden luomistaudista virallisesti
    vapaan aseman osalta (tiedoksiannettu numerolla C(2020) 2260)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/552 оd 20. travnja 2020. o izmjeni
    priloga I. i II. Odluci 2003/467/EZ u pogledu statusa područja službeno slobodnog
    od tuberkuloze za regiju Valle d’Aosta u Italiji i Autonomnu regiju Azore u
    Portugalu te u pogledu statusa područja službeno slobodnog od bruceloze za nekoliko
    regija u Portugalu (priopćeno pod brojem dokumenta C(2020) 2260)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/552 végrehajtási határozata (2020. április 20.)
    a 2003/467/EK határozat I. és II. mellékletének Olaszország Valle d’Aosta
    régiójának és Portugália Azori-szigetek autonóm régiójának hivatalosan
    tuberkulózismentes státusza, valamint Portugália több régiójának hivatalosan
    brucellózismentes státusza tekintetében történő módosításáról (az értesítés
    a C(2020) 2260. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/552 della Commissione del 20 aprile 2020
    che modifica gli allegati I e II della decisione 2003/467/CE per quanto riguarda
    la qualifica di ufficialmente indenni da tubercolosi della regione Valle d’Aosta
    in Italia e della regione autonoma delle Azzorre in Portogallo, e per quanto riguarda
    la qualifica di ufficialmente indenni da brucellosi di diverse regioni del Portogallo
    [notificata con il numero C(2020) 2260]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/552 (2020. gada 20. aprīlis),
    ar ko attiecībā uz statusu “oficiāli brīvs no tuberkulozes” Itālijas
    Valle d’Aosta reģionam un Portugāles Azoru salu autonomajam reģionam un attiecībā
    uz statusu “oficiāli brīvs no brucelozes” vairākiem Portugāles reģioniem
    groza Lēmuma 2003/467/EK I un II pielikumu (izziņots ar dokumenta numuru C(2020)
    2260)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/552 2020 m. balandžio 20
    d. kuriuo dėl oficialaus patvirtinimo, kad Italijos Aostos Slėnio regione ir
    Portugalijos Azorų salų autonominiame regione tuberkuliozės nenustatyta ir
    kad keliuose Portugalijos regionuose bruceliozės nenustatyta, iš dalies keičiami
    Sprendimo 2003/467/EB I ir II priedai (pranešta dokumentu Nr. C(2020) 2260)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/552 tal-20
    ta’ April 2020 li temenda l-Annessi I u II tad-Deċiżjoni 2003/467/KE fir-rigward
    tal-istatus tal-Valle d’Aosta fl-Italja u tar-Reġjun Awtonomu tal-Azores fil-Portugall
    bħala uffiċjalment ħielsa mit-tuberkulożi, u fir-rigward tal-istatus ta’
    bosta reġjuni tal-Portugall bħala uffiċjalment ħielsa mill-bruċellożi (notifikata
    bid-dokument C(2020) 2260)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/552 van de Commissie van 20 april 2020 tot
    wijziging van de bijlagen I en II bij Beschikking 2003/467/EG wat betreft de erkenning
    van de regio Valle d’Aosta in Italië en de autonome regio Azoren in Portugal
    als officieel tuberculosevrij, en wat betreft de erkenning van verschillende delen
    van Portugal als officieel brucellosevrij (Kennisgeving geschied onder nummer
    C(2020) 2260)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/552 z dnia 20 kwietnia 2020 r. zmieniająca
    załączniki I i II do decyzji 2003/467/WE w odniesieniu do statusu regionu Dolina
    Aosty we Włoszech i Regionu Autonomicznego Azorów w Portugalii jako oficjalnie
    wolnych od gruźlicy oraz w odniesieniu do statusu kilku regionów Portugalii
    jako oficjalnie wolnych od brucelozy (notyfikowana jako dokument nr C(2020) 2260)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/552 da Comissão de 20 de abril de 2020
    que altera os anexos I e II da Decisão 2003/467/CE no que diz respeito ao estatuto
    de oficialmente indemnes de tuberculose da região do Vale de Aosta em Itália
    e da Região Autónoma dos Açores em Portugal e no que diz respeito ao estatuto
    de oficialmente indemne de brucelose de várias regiões de Portugal [notificada
    com o número C(2020) 2260]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/552 a Comisiei din 20 aprilie
    2020 de modificare a anexelor I și II la Decizia 2003/467/CE în ceea ce privește
    statutul oficial de indemne de tuberculoză al regiunii Valle d’Aosta din Italia
    și al Regiunii Autonome a Insulelor Azore din Portugalia, precum și în ceea
    ce privește statutul oficial de indemne de bruceloză al mai multor regiuni din
    Portugalia [notificată cu numărul C(2020) 2260]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/552 z 20. apríla 2020, ktorým
    sa menia prílohy I a II k rozhodnutiu 2003/467/ES, pokiaľ ide o status regiónu
    Valle d’Aosta v Taliansku a autonómneho regiónu Azory v Portugalsku ako regiónov
    úradne bez výskytu tuberkulózy, ako aj o status niekoľkých regiónov Portugalska
    úradne bez výskytu brucelózy [oznámené pod číslom C(2020) 2260]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/552 z dne 20. aprila 2020 o spremembi
    prilog I in II k Odločbi 2003/467/ES glede statusa dežele dolina Aoste v Italiji
    in regije Azori na Portugalskem kot uradno prostih tuberkuloze ter glede statusa
    več regij Portugalske kot uradno prostih bruceloze (notificirano pod dokumentarno
    številko C(2020) 2260)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/552 de la Comisión de 20 de abril de
    2020 que modifica los anexos I y II de la Decisión 2003/467/CE por lo que respecta
    al estatuto de región oficialmente indemne de tuberculosis de la región de Valle
    de Aosta, en Italia, y de la Región Autónoma de las Azores, en Portugal, y por
    lo que respecta al estatuto de oficialmente indemne de brucelosis de varias regiones
    de Portugal [notificada con el número C(2020) 2260]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/552 av den 20 april 2020 om
    ändring av bilagorna I och II till beslut 2003/467/EG vad gäller status för
    Aostadalen i Italien och Azorerna i Portugal som officiellt fria från tuberkulos
    och status för flera regioner i Portugal som officiellt fria från brucellos
    [delgivet med nr C(2020) 2260]
