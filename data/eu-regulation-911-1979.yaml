title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 911/79 of 7 May 1979 re-establishing the
    levying of customs duties on angles, shapes and sections, of iron or steel, etc.,
    falling within subheadings 73.11 A II, III, IV a) 2 and b) and originating in
    Romania, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 911/79 de la Commission, du 7 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux profilés en fer ou en acier,
    etc., des sous-positions 73.11 A II, III, IV a) 2 et b) du tarif douanier commun,
    originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 911/79 der Kommission vom 7. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Profile aus Stahl, usw., der Tarifstellen 73.11 A II, III,
    IV a) 2 und b), mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr.
    3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 911/79 af 7. maj 1979 om genindførelse
    af opkrævning af toldafgifter for profiler af jern og stål, etc., under underpositionerne
    73.11 A II, III IV a) 2 og b) som har oprindelse i Rumænien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 911/79 della Commissione, del 7 maggio 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai profilati di ferro o di acciaio,
    ecc., delle sottovoci doganali 73.11 A II, III, IV a) 2 e b), originari della
    Romania, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 911/79 van de Commissie van 7 mei 1979 houdende wederinstelling
    van de heffing van de invoerrechten van toepassing op profielijzer en profielstaal,
    enz., van de posten 73.11 A II, III, IV a) 2 en b), van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
