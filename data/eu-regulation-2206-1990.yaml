  content: Council Regulation (EEC) No 2206/90 of 24 July 1990 amending Regulation
    (EEC) No 1569/72 laying down special measures for colza and rape seed and Regulation
    (EEC) No 2036/82 adopting general rules concerning special measures for peas,
    field beans and sweet lupins
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2206/90 du Conseil du 24 juillet 1990 modifiant le
    règlement (CEE) n° 1569/72 prévoyant des mesures spéciales pour les graines
    de colza, de navette et de tournesol, ainsi que le règlement (CEE) n° 2036/82
