---
id: EUDecision2017888
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/888 of 22 May 2017 amending
    Decision 2003/467/EC as regards the official tuberculosis-free status of the region
    of Umbria of Italy and of the enzootic-bovine-leukosis-free status of Poland,
    amending Decision 2004/558/EC as regards the infectious bovine rhinotracheitis-free
    status of Germany, and amending Decision 2008/185/EC as regards the Aujeszky's
    disease-free status of certain regions of Poland and the approval of the eradication
    programme for Aujeszky's disease for the region of Veneto of Italy (notified under
    document C(2017) 3239)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/888 de la Commission du 22 mai 2017 modifiant
    la décision 2003/467/CE en ce qui concerne le statut d'officiellement indemne
    de tuberculose de la région italienne de l'Ombrie et le statut d'indemne de leucose
    bovine enzootique de la Pologne, modifiant la décision 2004/558/CE en ce qui
    concerne le statut d'indemne de rhinotrachéite infectieuse bovine de l'Allemagne,
    et modifiant la décision 2008/185/CE en ce qui concerne le statut d'indemnes
    de la maladie d'Aujeszky de certaines régions de la Pologne et l'approbation
    du programme d'éradication de la maladie d'Aujeszky pour la région italienne
    de la Vénétie [notifiée sous le numéro C(2017) 3239]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/888 der Kommission vom 22. Mai 2017 zur
    Änderung der Entscheidung 2003/467/EG in Bezug auf den Status der Region Umbrien
    (Italien) als amtlich anerkannt tuberkulosefrei sowie auf den Status Polens als
    amtlich anerkannt rinderleukosefrei, zur Änderung der Entscheidung 2004/558/EG
    in Bezug auf den Status Deutschlands als frei von der infektiösen bovinen Rhinotracheitis
    sowie zur Änderung der Entscheidung 2008/185/EG in Bezug auf den Status bestimmter
    Regionen Polens als frei von der Aujeszky-Krankheit und zur Genehmigung des Programms
    zur Tilgung der Aujeszky-Krankheit in der Region Venetien (Italien) (Bekannt gegeben
    unter Aktenzeichen C(2017) 3239)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/888 на Комисията
    от 22 май 2017 година за изменение на Решение 2003/467/ЕО
    по отношение на статута на официално свободен
    от туберкулоза за регион Умбрия в Италия и
    на статута на официално свободна от ензоотична
    левкоза по говедата за Полша, за изменение
    на Решение 2004/558/ЕО по отношение на статута
    на свободна от инфекциозен ринотрахеит по
    говедата за Германия и за изменение на Решение
    2008/185/ЕО по отношение на статута на свободни
    от болестта на Ауески за някои региони в Полша
    и одобряването на програма за ликвидиране
    на болестта на Ауески за регион Венето в Италия
    (нотифицирано под номер С(2017) 3239)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/888 ze dne 22. května 2017,
    kterým se mění rozhodnutí 2003/467/ES, pokud jde o status stád skotu úředně
    prostých tuberkulózy v případě italské oblasti Umbrie a status stád skotu
    úředně prostých enzootické leukózy v případě Polska, rozhodnutí 2004/558/ES,
    pokud jde o status Německa jako území prostého infekční bovinní rinotracheitidy,
    a rozhodnutí 2008/185/ES, pokud jde o status některých oblastí Polska jako
    území prostého Aujeszkyho choroby a schválení eradikačního programu pro
    Aujeszkyho chorobu pro italskou oblast Veneto (oznámeno pod číslem C(2017)
    3239)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/888 af 22. maj 2017 om
    ændring af beslutning 2003/467/EF for så vidt angår status som officielt fri
    for tuberkulose for regionen Umbria i Italien og status som officielt fri for
    brucellose for Polen, ændring af afgørelse 2004/558/EF for så vidt angår status
    som fri for infektiøs bovin rhinotracheitis for Tyskland og ændring af beslutning
    2008/185/EF for så vidt angår status som fri for Aujeszkys sygdom for visse
    regioner i Polen og godkendelse af udryddelsesprogrammet for Aujeszkys sygdom
    for regionen Veneto i Italien (meddelt under nummer C(2017) 3239)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/888 της Επιτροπής,
    της 22ας Μαΐου 2017, για την τροποποίηση της απόφασης
    2003/467/ΕΚ όσον αφορά το καθεστώς της επίσημα
    απαλλαγμένης από τη φυματίωση περιφέρειας
    για την Umbria της Ιταλίας και το καθεστώς της
    επίσημα απαλλαγμένης από την ενζωοτική λεύκωση
    των βοοειδών για την Πολωνία, για την τροποποίηση
    της απόφασης 2004/558/ΕΚ όσον αφορά την αναγνώριση
    της Γερμανίας ως απαλλαγμένης από τη λοιμώδη
    ρινοτραχειίτιδα των βοοειδών, και για την τροποποίηση
    της απόφασης 2008/185/ΕΚ όσον αφορά την αναγνώριση
    ορισμένων περιφερειών της Πολωνίας ως απαλλαγμένων
    από τη νόσο του Aujeszky και την έγκριση του προγράμματος
    εκρίζωσης της νόσου του Aujeszky για την περιφέρεια
    Veneto της Ιταλίας [κοινοποιηθείσα υπό τον αριθμό
    C(2017) 3239]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/888, 22. mai 2017, millega muudetakse
    otsust 2003/467/EÜ seoses tuberkuloosivaba staatuse andmisega Itaalia Umbria
    maakonnale ja veiste ensootilise leukoosi vaba staatuse andmisega Poolale, otsust
    2004/558/EÜ seoses veiste infektsioossest rinotrahheiidist vaba staatuse andmisega
    Saksamaale ning otsust 2008/185/EÜ seoses Aujeszky haigusest vaba staatuse andmisega
    Poola teatavatele piirkondadele ja Aujeszky haiguse tõrje programmide heakskiitmisega
    Itaalia Veneto maakonna puhul (teatavaks tehtud numbri C(2017) 3239 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/888, annettu 22 päivänä
    toukokuuta 2017, päätöksen 2003/467/EY muuttamisesta Italian Umbrian alueen
    tuberkuloosista virallisesti vapaaksi tunnustetun aseman ja Puolan naudan tarttuvasta
    leukoosista vapaan aseman osalta, päätöksen 2004/558/EY muuttamisesta Saksan
    naudan tarttuvasta rinotrakeiitista vapaan aseman osalta sekä päätöksen 2008/185/EY
    muuttamisesta Puolan tiettyjen alueiden Aujeszkyn taudista vapaan aseman ja Italian
    Veneton alueen Aujeszkyn taudin hävittämisohjelman hyväksymisen osalta (tiedoksiannettu
    numerolla C(2017) 3239)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/888 оd 22. svibnja 2017. o izmjeni
    Odluke 2003/467/EZ u pogledu statusa talijanske regije Umbria kao područja službeno
    slobodnog od tuberkuloze i statusa Poljske kao područja službeno slobodnog od
    enzootske leukoze goveda, o izmjeni Odluke 2004/558/EZ u pogledu statusa Njemačke
    kao područja službeno slobodnog od zaraznog goveđeg rinotraheitisa te o izmjeni
    Odluke 2008/185/EZ u pogledu statusa određenih regija Poljske kao područja službeno
    slobodnih od bolesti Aujeszkoga i odobrenju programa iskorjenjivanja bolesti Aujeszkoga
    za talijansku regiju Veneto (priopćeno pod brojem dokumenta C(2017) 3239)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/888 végrehajtási határozata (2017. május 22.)
    a 2003/467/EK határozatnak Umbria régió (Olaszország) hivatalosan tuberkulózismentes,
    valamint Lengyelország szarvasmarhák enzootikus leukózisától mentes státusza,
    a 2004/558/EK határozatnak Németország szarvasmarhák fertőző rhinotracheitisétől
    mentes státusza, valamint a 2008/185/EK határozatnak Lengyelország bizonyos
    régiói Aujeszky-féle betegségtől mentes státusza és Veneto tartomány (Olaszország)
    Aujeszky-féle betegséggel kapcsolatos mentesítési programjának elfogadása
    tekintetében történő módosításáról (az értesítés a C(2017) 3239. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/888 della Commissione, del 22 maggio
    2017, che modifica la decisione 2003/467/CE per quanto riguarda la qualifica di
    ufficialmente indenne da tubercolosi della Regione italiana Umbria e la qualifica
    di ufficialmente indenne da leucosi bovina enzootica della Polonia, la decisione
    2004/558/CE per quanto riguarda la qualifica di ufficialmente indenne da rinotracheite
    bovina infettiva della Germania e la decisione 2008/185/CE per quanto riguarda
    la qualifica di ufficialmente indenne dalla malattia di Aujeszky di alcune regioni
    della Polonia e l'approvazione del programma di eradicazione della malattia di
    Aujeszky per la Regione italiana Veneto [notificata con in numero C(2017) 3239]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/888 (2017. gada 22. maijs), ar
    ko attiecībā uz Itālijas reģiona Umbrijas kā oficiāli no tuberkulozes brīva
    reģiona statusu un Polijas kā no govju enzootiskās leikozes brīva reģiona
    statusu groza Lēmumu 2003/467/EK, attiecībā uz Vācijas kā no govju infekciozā
    rinotraheīta brīva reģiona statusu groza Lēmumu 2004/558/EK, attiecībā uz
    atsevišķu Polijas reģionu kā no Aujeski slimības brīvu reģionu statusu
    un attiecībā uz Aujeski slimības izskaušanas programmas apstiprināšanu Itālijas
    reģionam Veneto groza Lēmumu 2008/185/EK (izziņots ar dokumenta numuru C(2017)
    3239)
  type: main
- language: lt
  script: Latn
  content: 2017 m. gegužės 22 d. Komisijos įgyvendinimo sprendimas (ES) 2017/888,
    kuriuo dėl oficialaus pripažinimo, kad Italijos Umbrijos regionas neužkrėstas
    tuberkulioze ir Lenkijos teritorija neužkrėsta enzootine galvijų leukoze, iš
    dalies keičiamas Sprendimas 2003/467/EB, dėl pripažinimo, kad Vokietijos teritorija
    neužkrėsta infekciniu galvijų rinotracheitu, iš dalies keičiamas Sprendimas
    2004/558/EB ir dėl pripažinimo, kad tam tikri Lenkijos regionai neužkrėsti
    Aujeskio liga, bei dėl Italijos Veneto regionui skirtos Aujeskio ligos likvidavimo
    programos patvirtinimo iš dalies keičiamas Sprendimas 2008/185/EB (pranešta
    dokumentu Nr. C(2017) 3239)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/888 tat-22 ta'
    Mejju 2017 li temenda d-Deċiżjoni 2003/467/KE fir-rigward tal-istatus ħieles
    mit-tuberkolożi tar-reġjun tal-Umbria fl-Italja u tal-istatus ħieles mil-lewkożi
    enzootika bovina tal-Polonja, li temenda d-Deċiżjoni 2004/558/KE fir-rigward
    tal-istatus ħieles mir-riinotrakeite bovina infettiva tal-Ġermanja, u li temenda
    d-Deċiżjoni 2008/185/KE fir-rigward tal-istatus ħieles mill-marda ta' Aujeszky
    ta' ċerti reġjuni tal-Polonja u l-approvazzjoni tal-programm ta' eradikazzjoni
    għall-marda ta' Aujeszky għar-reġjun tal-Veneto fl-Italja (notifikata bid-dokument
    C(2017) 3239)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/888 van de Commissie van 22 mei 2017 tot wijziging
    van Beschikking 2003/467/EG wat betreft de erkenning als officieel tuberculosevrij
    van de regio Umbria in Italië en de erkenning als vrij van enzoötische boviene
    leukose van Polen, tot wijziging van Beschikking 2004/558/EG wat betreft de erkenning
    als vrij van infectieuze boviene rhinotracheïtis van Duitsland, en tot wijziging
    van Beschikking 2008/185/EG wat betreft de erkenning als vrij van de ziekte van
    Aujeszky van bepaalde regio's in Polen en de goedkeuring van het programma voor
    de uitroeiing van de ziekte van Aujeszky voor de regio Veneto in Italië (Kennisgeving
    geschied onder nummer C(2017) 3239)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/888 z dnia 22 maja 2017 r. zmieniająca
    decyzję 2003/467/WE w odniesieniu do statusu włoskiego regionu Umbria jako obszaru
    oficjalnie uznanego za wolny od gruźlicy oraz statusu Polski jako obszaru wolnego
    od enzootycznej białaczki bydła, zmieniająca decyzję 2004/558/WE w odniesieniu
    do statusu Niemiec jako obszaru wolnego od zakaźnego zapalenia nosa i tchawicy
    bydła oraz zmieniająca decyzję 2008/185/WE w odniesieniu do statusu określonych
    regionów Polski jako obszarów wolnych od choroby Aujeszkyego oraz zatwierdzenia
    programu zwalczania choroby Aujeszkyego dla włoskiego regionu Wenecja Euganejska
    (notyfikowana jako dokument nr C(2017) 3239)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/888 da Comissão, de 22 de maio de 2017,
    que altera a Decisão 2003/467/CE no que diz respeito ao estatuto de oficialmente
    indemne de tuberculose da região da Úmbria em Itália e ao estatuto de indemne
    de leucose bovina enzoótica da Polónia, que altera a Decisão 2004/558/CE no
    que diz respeito ao estatuto de indemnidade de rinotraqueíte infecciosa dos bovinos
    da Alemanha e que altera a Decisão 2008/185/CE no que diz respeito ao estatuto
    de indemnidade da doença de Aujeszky de determinadas regiões da Polónia e à
    aprovação do programa de erradicação da doença de Aujeszky para a região
    de Veneto em Itália [notificada com o número C(2017) 3239]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/888 a Comisiei din 22 mai 2017
    de modificare a Deciziei 2003/467/CE în ceea ce privește statutul oficial de
    indemnă de tuberculoză al regiunii Umbria din Italia și statutul oficial de
    indemnă de leucoză enzootică bovină al Poloniei, de modificare a Deciziei
    2004/558/CE în ceea ce privește statutul de indemnă de rinotraheită infecțioasă
    bovină al Germaniei și de modificare a Deciziei 2008/185/CE în ceea ce privește
    statutul de indemne de boala Aujeszky al anumitor regiuni din Polonia și aprobarea
    programului de eradicare a bolii Aujeszky pentru regiunea Veneto din Italia [notificată
    cu numărul C(2017) 3239]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/888 z 22. mája 2017, ktorým
    sa mení rozhodnutie 2003/467/ES, pokiaľ ide o úradný status talianskeho regiónu
    Umbria bez výskytu tuberkulózy a úradný status Poľska bez výskytu enzootickej
    bovinnej leukózy, ktorým sa mení rozhodnutie 2004/558/ES, pokiaľ ide o status
    Nemecka bez výskytu infekčnej bovinnej rinotracheitídy a ktorým sa mení rozhodnutie
    2008/185/ES, pokiaľ ide o štatút určitých regiónov Poľska bez výskytu
    Aujeszkého choroby a schválenie programov na eradikáciu Aujeszkého choroby
    v prípade talianskeho regiónu Benátsko [oznámené pod číslom C(2017) 3239]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/888 z dne 22. maja 2017 o spremembi
    Odločbe 2003/467/ES glede statusa dežele Umbrija v Italiji kot uradno proste
    tuberkuloze in statusa Poljske kot proste enzootske goveje levkoze, o spremembi
    Odločbe 2004/558/ES glede statusa Nemčije kot proste infekcioznega bovinega
    rinotraheitisa ter o spremembi Odločbe 2008/185/ES glede statusa nekaterih regij
    Poljske kot prostih bolezni Aujeszkega in o potrditvi programov za izkoreninjenje
    bolezni Aujeszkega za deželo Benečijo v Italiji (notificirano pod dokumentarno
    številko C(2017) 3239)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/888 de la Comisión, de 22 de mayo de
    2017, por la que se modifica la Decisión 2003/467/CE en lo que se refiere al
    estatuto oficialmente indemne de tuberculosis de la región de Umbría en Italia
    y al estatuto indemne de leucosis bovina enzoótica de Polonia, la Decisión 2004/558/CE
    en lo que se refiere al estatuto indemne de rinotraqueítis infecciosa bovina
    de Alemania, y la Decisión 2008/185/CE en lo que se refiere al estatuto indemne
    de la enfermedad de Aujeszky de determinadas regiones de Polonia y a la aprobación
    del programa de erradicación de la enfermedad de Aujeszky para la región de
    Véneto en Italia [notificada con el número C(2017) 3239]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/888 av den 22 maj 2017 om ändring
    av beslut 2003/467/EG vad gäller den italienska regionen Umbriens status som
    officiellt fri från tuberkulos och Polens status som fritt från enzootisk bovin
    leukos, om ändring av beslut 2004/558/EG vad gäller Tysklands status som fritt
    från infektiös bovin rhinotrakeit och om ändring av beslut 2008/185/EG vad
    gäller vissa polska regioner som fria från Aujeszkys sjukdom samt om godkännande
    av ett utrotningsprogram för Aujeszkys sjukdom i den italienska regionen Venetien
    [delgivet med dokument nr C(2017) 3239]
  type: main
