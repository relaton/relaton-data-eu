    Съвета за сближаване на законовите, подзаконовите
    и административните разпоредби на държавите-членки
    относно ограниченията върху пускането на пазара
    и употребата на някои опасни вещества и препарати
    (вещества, класифицирани като канцерогенни,
    мутагенни или токсични за репродукцията –
    к/м/в)
  type: main
