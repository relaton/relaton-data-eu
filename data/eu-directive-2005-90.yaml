title:
- language: en
  script: Latn
  content: Directive 2005/90/EC of the European Parliament and of the Council of 18
    January 2006 amending, for the 29th time, Council Directive 76/769/EEC on the
    approximation of the laws, regulations and administrative provisions of the Member
    States relating to restrictions on the marketing and use of certain dangerous
    substances and preparations (substances classified as carcinogenic, mutagenic
    or toxic to reproduction — c/m/r)
  type: main
- language: fr
  script: Latn
  content: Directive 2005/90/CE du Parlement européen et du Conseil du 18 janvier
    2006 portant vingt-neuvième modification de la directive 76/769/CEE du Conseil
    concernant le rapprochement des dispositions législatives, réglementaires et
    administratives des États membres relatives à la limitation de la mise sur le
    marché et de l'emploi de certaines substances et préparations dangereuses (substances
    classées cancérogènes, mutagènes ou toxiques pour la reproduction — CMR)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/90/EG des Europäischen Parlaments und des Rates vom 18.
    Januar 2006 zur 29. Änderung der Richtlinie 76/769/EWG des Rates zur Angleichung
    der Rechts- und Verwaltungsvorschriften der Mitgliedstaaten für Beschränkungen
    des Inverkehrbringens und der Verwendung gewisser gefährlicher Stoffe und Zubereitungen
    (als krebserzeugend, erbgutverändernd oder fortpflanzungsgefährdend — k/e/f
    — eingestufte Stoffe)
  type: main
- language: bg
  script: Cyrl
