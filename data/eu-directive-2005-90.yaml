    és felhasználásának korlátozásaira vonatkozó tagállami törvényi, rendeleti
    és közigazgatási rendelkezések közelítéséről szóló 76/769/EGK tanácsi
    irányelv huszonkilencedik alkalommal történő módosításáról (karcinogén,
    mutagén és teratogén – c/m/r besorolású anyagok)
  type: main
- language: it
  script: Latn
  content: Direttiva 2005/90/CE del Parlamento europeo e del Consiglio, del 18 gennaio
    2006 , che modifica, per la ventinovesima volta, la direttiva 76/769/CEE del Consiglio
    concernente il ravvicinamento delle disposizioni legislative, regolamentari e
    amministrative degli Stati Membri relative alle restrizioni in materia di immissione
    sul mercato e di uso di talune sostanze e preparati pericolosi (sostanze classificate
    come cancerogene, mutagene o tossiche per la riproduzione — c/m/r)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2005/90/EK ( 2006. gada 18. janvāris
    ), ar kuru divdesmit devīto reizi groza Direktīvu 76/769/EEK par dalībvalstu
    normatīvo un administratīvo aktu tuvināšanu attiecībā uz dažu bīstamu
    vielu un preparātu tirgū laišanas un lietošanas ierobežojumiem (vielas, kas
    klasificētas kā kancerogēnas, mutagēnas vai reproduktīvajai funkcijai toksiskas
    — c/m/r)
  type: main
- language: lt
  script: Latn
  content: 2006 m. sausio 18 d. Europos Parlamento ir Tarybos direktyva 2005/90/EB
    dvidešimt devintąjį kartą iš dalies keičianti Tarybos direktyvą 76/769/EEB
    dėl valstybių narių įstatymų ir kitų teisės aktų, susijusių su tam tikrų
    pavojingų medžiagų ir preparatų pardavimo ir naudojimo apribojimais, suderinimo
    (medžiagos, klasifikuojamos kaip kancerogeninės, mutageninės arba toksiškos
    reprodukcijai — c/m/r)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2005/90/KE tal-Parlament Ewropew u tal-Kunsill tat- 18 ta'
    Jannar 2006 li temenda, għad-disgħa u għoxrin darba, id-Direttiva tal-Kunsill
    76/769/KEE dwar l-approssimazzjoni tal-liġijiet, regolamenti u disposizzjonijiet
    amministrattivi ta’ l-Istati Membri dwar ir-restrizzjonijiet fuq il- marketing
    u l-użu ta’ ċerti sustanzi u preparazzjonijiet perikolużi (sustanzi klassifikati
    bħala karċinoġeniċi, mutaġeniċi jew tossiċi għar-riproduzzjoni — k/m/r)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2005/90/EG van het Europees Parlement en de Raad van 18 januari
    2006 tot negenentwintigste wijziging van Richtlijn 76/769/EEG van de Raad betreffende
    de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der
    lidstaten inzake de beperking van het op de markt brengen en van het gebruik van
    bepaalde gevaarlijke stoffen en preparaten (stoffen die als kankerverwekkend,
    mutageen of vergiftig voor de voortplanting zijn ingedeeld — c/m/r)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2005/90/WE Parlamentu Europejskiego i Rady z dnia 18 stycznia
    2006 r. zmieniająca po raz dwudziesty dziewiąty dyrektywę Rady 76/769/EWG w
    sprawie zbliżenia przepisów ustawowych, wykonawczych i administracyjnych Państw
    Członkowskich odnoszących się do ograniczeń we wprowadzaniu do obrotu i stosowaniu
    niektórych substancji i preparatów niebezpiecznych (substancje zaklasyfikowane
    jako rakotwórcze, mutagenne lub działające szkodliwie na rozrodczość —
    c/m/r)
  type: main
- language: pt
  script: Latn
  content: Directiva 2005/90/CE do Parlamento Europeu e do Conselho, de 18 de Janeiro
    de 2006 , que altera, pela vigésima nona vez, a Directiva 76/769/CEE do Conselho
    relativa à aproximação das disposições legislativas, regulamentares e administrativas
    dos Estados-Membros respeitantes à limitação da colocação no mercado e da
    utilização de algumas substâncias e preparações perigosas (substâncias classificadas
    como cancerígenas, mutagénicas ou tóxicas para a reprodução)
  type: main
- language: ro
  script: Latn
  content: Directiva 2005/90/CE a Parlamentului European și a Consiliului din 18
    ianuarie 2006 de efectuare a celei de-a douăzeci și noua modificări a Directivei
    76/769/CEE a Consiliului privind apropierea actelor cu putere de lege și a actelor
    administrative ale statelor membre referitoare la restricțiile privind introducerea
    pe piață și utilizarea anumitor substanțe și preparate periculoase (substanțe
    clasificate drept cancerigene, mutagene sau toxice pentru reproducere – c/m/r)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2005/90/ES z 18. januára 2006 ,
    ktorou sa dvadsiatydeviatykrát mení a dopĺňa smernica Rady 76/769/EHS o aproximácii
    zákonov, iných právnych predpisov a správnych opatrení členských štátov
    vzťahujúcich sa na obmedzenia uvádzania na trh a používania niektorých nebezpečných
    látok a prípravkov (látky klasifikované ako karcinogénne, mutagénne alebo
    látky škodlivé pre reprodukciu – c/m/r)
  type: main
- language: sl
  script: Latn
  content: Direktiva Evropskega parlamenta in Sveta 2005/90/ES z dne 18. januarja
    2006 o devetindvajseti spremembi Direktive Sveta 76/769/EGS o približevanju zakonov
    in drugih predpisov držav članic v zvezi z omejitvami pri trženju in uporabi
    nekaterih nevarnih snovi in pripravkov (snovi, razvrščene kot rakotvorne, mutagene
    ali strupene za razmnoževanje — r/m/r)
  type: main
- language: es
  script: Latn
  content: Directiva 2005/90/CE del Parlamento Europeo y del Consejo, de 18 de enero
    de 2006 , por la que se modifica por vigesimonovena vez la Directiva 76/769/CEE
    del Consejo relativa a la aproximación de las disposiciones legales, reglamentarias
    y administrativas de los Estados miembros que limitan la comercialización y el
    uso de determinadas sustancias y preparados peligrosos (sustancias clasificadas
    como carcinógenas, mutágenas o tóxicas para la reproducción — c/m/r)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2005/90/EG av den 18 januari 2006
    om ändring, för tjugonionde gången, av rådets direktiv 76/769/EEG om tillnärmning
    av medlemsstaternas lagar och andra författningar om begränsning av användning
    och utsläppande på marknaden av vissa farliga ämnen och preparat (beredningar)
    (ämnen som klassificeras som cancerframkallande, mutagena eller reproduktionstoxiska
    – c/m/r)
