    à semelles extérieures en caoutchouc, matière plastique, cuir naturel ou reconstitué
    et dessus en cuir naturel, du code 6403 de la nomenclature combinée, originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3635/87 du Conseil
  type: main
