  content: Commission Regulation (EEC) No 2058/88 of 8 July 1988 re-establishing the
    levying of customs duties on footwear with outer soles of rubber, plastics, leather
    or composition leather and uppers of leather, falling within CN code 6403, originating
    in India to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2058/88 de la Commission du 8 juillet 1988 portant
