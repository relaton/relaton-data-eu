  content: Regulation (EEC) No 2470/75 of the Commission of 25 September 1975 determining
    the amounts applicable as accession compensatory amounts during the month of October
    1975 to certain cereal and rice products exported in the form of goods not covered
    by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2470/75 de la Commission, du 25 septembre 1975, déterminant
    les montants applicables à titre de montants compensatoires adhésion pendant
    le mois d'octobre 1975 à certains produits des secteurs des céréales et du
    riz exportés sous forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2470/75 der Kommission vom 25. September 1975 zur
    Festsetzung der im Oktober 1975 als Beitrittsausgleichsbeträge geltenden Beträge
    für bestimmte Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2470/75 af 25. september 1975 om fastsættelse
    af de beløb, der fra 1. oktober 1975 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2470/75 della Commissione, del 25 settembre 1975,
    che determina gli importi compensativi «adesione» applicabili, durante il mese
    di ottobre 1975, a taluni prodotti dei settori dei cereali e del riso esportati
    sotto forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2470/75 van de Commissie van 25 september 1975 houdende
    vaststelling van de bedragen die gedurende de maand oktober 1975 als compenserende
    bedragen "toetreding" moeten worden toegepast voor bepaalde produkten van de sector
    granen en de sector rijst, uitgevoerd in de vorm van niet onder bijlage II van
    het Verdrag vallende goederen
