  script: Latn
  content: Commission Delegated Regulation (EU) 2017/1230 of 31 May 2017 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards further specifying the additional objective
    criteria for the application of a preferential liquidity outflow or inflow rate
    for cross-border undrawn credit or liquidity facilities within a group or an institutional
    protection scheme
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/1230 de la Commission du 31 mai 2017 complétant
    le règlement (UE) n° 575/2013 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant davantage les critères objectifs supplémentaires
    pour l'application d'un taux de sortie ou d'entrée de trésorerie préférentiel
    pour les facilités de crédit et de liquidité transfrontières non utilisées
    au sein d'un groupe ou d'un système de protection institutionnel
  type: main
