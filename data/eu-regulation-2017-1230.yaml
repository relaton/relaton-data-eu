    în ceea ce privește standardele tehnice de reglementare care detaliază criteriile
    obiective suplimentare pentru aplicarea ratei preferențiale pentru ieșirile
    sau intrările de lichidități aferente facilităților transfrontaliere de credit
    sau de lichiditate neutilizate din cadrul unui grup sau al unui sistem instituțional
    de protecție
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2017/1230 z 31. mája 2017, ktorým
