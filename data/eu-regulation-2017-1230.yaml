    ide o regulačné technické predpisy, ktorými sa bližšie určujú dodatočné
    objektívne kritériá pre uplatňovanie preferenčnej miery záporného toku
    likvidity alebo kladného toku likvidity pre cezhraničné nevyčerpané kreditné
    facility alebo facility likvidity v rámci skupiny alebo schémy inštitucionálneho
    zabezpečenia
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/1230 z dne 31. maja 2017 o dopolnitvi
    Uredbe (EU) št. 575/2013 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi o podrobnejši opredelitvi dodatnih objektivnih meril za
    uporabo ugodnejše stopnje likvidnostnih odlivov ali prilivov za čezmejne nečrpane
    okvirne kredite ali okvirne likvidnostne kredite znotraj skupine ali institucionalne
    sheme za zaščito vlog
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2017/1230 de la Comisión, de 31 de mayo de 2017,
    por el que se completa el Reglamento (UE) n.° 575/2013 del Parlamento Europeo
    y del Consejo en lo relativo a las normas técnicas de regulación que especifican
    con mayor detalle los criterios objetivos adicionales para la aplicación de un
    índice preferencial de entrada o salida de liquidez a las líneas de crédito
    y de liquidez transfronterizas no utilizadas en el marco de un grupo o un sistema
    institucional de protección
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2017/1230 av den 31 maj 2017
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 575/2013
    vad gäller tekniska tillsynsstandarder som specificerar de ytterligare objektiva
    kriterierna för att en förmånlig likviditetsutflödes- eller inflödessats
    ska få tillämpas på gränsöverskridande outnyttjade kredit- eller likviditetsfaciliteter
    inom en grupp eller ett institutionellt skyddssystem
