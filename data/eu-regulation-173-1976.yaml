title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 173/76 of 27 January 1976 re-establishing
    the levying of the customs duties on glazed setts, flags and paving, hearth and
    wall tiles, falling within heading No 69.08, originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3010/75
    of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 173/76 de la Commission, du 27 janvier 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position tarifaire 69.08,
    originaires de la Corée du Sud bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 173/76 der Kommission vom 27. Januar 1976 zur Wiedereinführung
    des Zollsatzes für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, der Tarifnummer 69.08, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 173/76 af 27. januar 1976 om genindførelse
    af opkrævning af toldafgifter for glaserede sten og fliser til brolægning, gulvbeklædning
    eller beklædning af vægge, kaminer o. lign. under position 69.08, som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 173/76 della Commissione, del 27 gennaio 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle altre piastrelle,
    blocchetti e lastre da pavimentazione o da rivestimento della voce doganale n.
    69.08 originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 173/76 van de Commissie van 27 januari 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere plavuizen
    en andere vloer- en wandtegels, van post 69.08, van oorsprong uit Zuid-Korea,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
