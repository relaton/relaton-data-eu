  script: Latn
  content: Commission Implementing Regulation (EU) No 1114/2011 of 4 November 2011
    repealing Regulation (EC) No 601/2008 on protective measures applying to certain
    fishery products imported from Gabon and intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n o 1114/2011 de la Commission du 4 novembre
