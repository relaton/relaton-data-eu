title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1901/89 of 29 June 1989 derogating from
    Regulation (EEC) No 920/89 laying down quality standards for carrots, citrus fruit
    and dessert apples and pears as regards the sizing of apples for the 1989/90 marketing
    year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1901/89 de la Commission du 29 juin 1989 dérogeant
    pour la campagne 1989/1990 au règlement (CEE) n° 920/89 portant fixation des
    normes de qualité pour les carottes, les agrumes et les pommes et poires de table,
    en ce qui concerne le calibre des pommes
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1901/89 DER KOMMISSION vom 29. Juni 1989 zur Abweichung
    von der Verordnung (EWG) Nr. 920/89 zur Festsetzung der Qualitätsnormen für
    Möhren, Zitrusfrüchte sowie Tafeläpfel und -birnen im Wirtschaftsjahr 1989/90
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1901/89 af 29. juni 1989 om fravigelse
    for produktionsåret 1989/90 af forordning (EØF) nr. 920/89 om fastsættelse
    af kvalitetsnormer for gulerødder, citrusfrugter og spiseæbler og -pærer, for
    så vidt angår æblers størrelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1901/89 της Επιτροπής
    της 29ης Ιουνίου 1989 για την παρέκκλιση, για την
    περίοδο 1989/90, από τον κανονισμό (ΕΟΚ) αριθ. 920/89
    για τον καθορισμό των κανόνων ποιότητας για
    τα καρότα, τα εσπεριδοειδή και τα επιτραπέζια
    μήλα και αχλάδια όσον αφορά το μέγεθος των
    μήλων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1901/89 DELLA COMMISSIONE del 29 giugno 1989 recante
    deroga per la campagna 1989/1990 al regolamento (CEE) n. 920/89 che stabilisce
    le norme di qualità per le carote, gli agrumi e le mele e pere da tavola per
    quanto riguarda il calibro delle mele #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1901/89 VAN DE COMMISSIE van 29 juni 1989 houdende
    afwijking in het verkoopseizoen 1989/1990 van Verordening (EEG) nr. 920/89 tot
    vaststelling van kwaliteitsnormen voor wortelen, citrusvruchten en tafelappelen
    en -peren, ten aanzien van de grootte van appelen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1901/89 DA COMISSÃO de 29 de Junho de 1989 que
    derroga, para a campanha de 1989/1990, no que diz respeito ao calibre das maças,
    o Regulamento (CEE) nº 920/89 que fixa as normas de qualidade para as cenouras,
    os citrinos, as maças e peras de mesa #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1901/89 DE LA COMISIÓN de 29 de junio de 1989 que
    suspende, durante la campaña de 1989/90, la aplicación del Reglamento (CEE)
    no 920/89, por el que se establecen normas de calidad para las zanahorias, los
    cítricos y las manzanas y peras de mesa, en lo que respecta al calibre de las
    manzanas #'
