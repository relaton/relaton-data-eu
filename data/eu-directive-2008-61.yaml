---
id: EUDirective200861
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 2008/61/EC of 17 June 2008 establishing the conditions
    under which certain harmful organisms, plants, plant products and other objects
    listed in Annexes I to V to Council Directive 2000/29/EC may be introduced into
    or moved within the Community or certain protected zones thereof, for trial or
    scientific purposes and for work on varietal selections (Codified version)
  type: main
- language: fr
  script: Latn
  content: Directive 2008/61/CE de la Commission du 17 juin 2008 fixant les conditions
    dans lesquelles certains organismes nuisibles, végétaux, produits végétaux
    et autres objets énumérés aux annexes I à V de la directive 2000/29/CE du
    Conseil peuvent être introduits ou circuler dans la Communauté ou dans certaines
    zones protégées de la Communauté pour des travaux à des fins d'essai ou à
    des fins scientifiques ou pour des travaux sur les sélections variétales (version
    codifiée)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2008/61/EG der Kommission vom 17. Juni 2008 mit den Bedingungen,
    unter denen bestimmte Pflanzen, Pflanzenerzeugnisse und andere Gegenstände gemäß
    den Anhängen I bis V der Richtlinie 2000/29/EG des Rates zu Versuchs-, Forschungs-
    und Züchtungszwecken in die Gemeinschaft oder bestimmte Schutzgebiete derselben
    eingeführt oder darin verbracht werden dürfen (kodifizierte Fassung)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2008/61/ЕО на Комисията от 17 юни
    2008 година за определяне на условията, при които
    някои вредители, растения, растителни продукти
    и други предмети, посочени в приложения I—V
    към Директива 2000/29/ЕО на Съвета, могат да бъдат
    въвеждани или придвижвани в рамките на Общността
    или в някои нейни защитени зони за опити или
    научни цели, както и за работа по сортови селекции
    (кодифицирана версия)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2008/61/ES ze dne 17. června 2008 , kterou se stanoví
    podmínky, na základě kterých lze pro pokusné nebo vědecké účely a pro
    práci ve šlechtění odrůd dovážet některé škodlivé organismy, rostliny,
    rostlinné produkty a jiné předměty uvedené v přílohách I až V směrnice
    Rady 2000/29/ES do Společenství nebo některých chráněných zón Společenství
    nebo je na těchto územích přemísťovat (kodifikované znění)
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2008/61/EF af 17. juni 2008 om de betingelser, hvorunder
    visse skadegørende planter, planteprodukter og andre objekter, der er anført
    i bilag I-V til Rådets direktiv 2000/29/EF, må føres ind i eller flyttes inden
    for Fællesskabet eller visse beskyttede zoner inden for dette med henblik på
    forsøg, forskning eller planteforædling (kodificeret udgave)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2008/61/ΕΚ της Επιτροπής, της 17ης Ιουνίου
    2008 , για τη θέσπιση των όρων βάσει των οποίων
    ορισμένοι επιβλαβείς οργανισμοί, φυτά, φυτικά
    προϊόντα και λοιπά που αναφέρονται στα παραρτήματα
    I έως V της οδηγίας 2000/29/ΕΚ του Συμβουλίου, είναι
    δυνατόν να εισαχθούν ή να διακινηθούν στην
    Κοινότητα ή σε ορισμένες προστατευόμενες ζώνες
    της, για δοκιμές ή για επιστημονικούς σκοπούς,
    καθώς και για εργασίες επιλογής ποικιλιών
    (Κωδικοποιημένη έκδοση)
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2008/61/EÜ, 17. juuni 2008 , millega kehtestatakse
    tingimused, mille alusel võib teatavaid nõukogu direktiivi 2000/29/EÜ I–V
    lisas loetletud kahjulikke organisme, taimi, taimseid saadusi ja muid tooteid
    tuua ühendusse või teatavatele ühenduse kaitstavatele aladele või nende piires
    vedada katsete tegemiseks, teaduslikel eesmärkidel ja sordivalikuks (kodifitseeritud
    versioon)
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2008/61/EY, annettu 17 päivänä kesäkuuta 2008
    , edellytyksistä, joilla neuvoston direktiivin 2000/29/EY liitteissä I–V lueteltuja
    tiettyjä haitallisia organismeja, kasveja, kasvituotteita ja muita tavaroita
    saa tuoda yhteisöön tai sen tietyille suojelluille alueille taikka siirtää
    yhteisössä tai sen tietyillä suojelluilla alueilla kokeellisia tai tieteellisiä
    tarkoituksia tai lajikevalintatyötä varten (Kodifioitu toisinto)
  type: main
- language: hr
  script: Latn
  content: Direktiva Komisije 2008/61/EZ od 17. lipnja 2008. o utvrđivanju uvjeta
    pod kojima se određeni štetni organizmi, bilje, biljni proizvodi i drugi predmeti
    iz priloga I. do V. Direktivi Vijeća 2000/29/EZ smiju unositi u Zajednicu ili
    premještati unutar Zajednice ili određenih njezinih zaštićenih područja,
    namijenjeni za pokuse ili u znanstvene svrhe i za potrebe sortne selekcije (kodificirana
    verzija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2008/61/EK irányelve ( 2008. június 17. ) a 2000/29/EK tanácsi
    irányelv I–V. mellékletében szereplő károsító szervezetek, növények,
    növényi eredetű termékek és egyéb áruk kísérlet vagy tudományos célú
    tevékenység, valamint fajtaszelekciós munka céljából a Közösség területére,
    vagy annak egyes védett övezeteibe történő beléptetésére vagy ezeken belüli
    mozgatására vonatkozó feltételek megállapításáról (kodifikált változat)
  type: main
- language: it
  script: Latn
  content: Direttiva 2008/61/CE della Commissione, del 17 giugno 2008 , che stabilisce
    le condizioni alle quali taluni organismi nocivi, vegetali, prodotti vegetali
    e altri prodotti elencati negli allegati I, II, III, IV e V della direttiva 2000/29/CE
    del Consiglio possono essere introdotti o trasferiti da un luogo all'altro nella
    Comunità o in talune sue zone protette per prove o scopi scientifici e per lavori
    di selezione varietale (Versione codificata)
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2008/61/EK ( 2008. gada 17. jūnijs ), ar ko ievieš
    nosacījumus, kurus ievērojot dažus kaitīgus organismus, augus, augu produktus
    un citus Padomes Direktīvas 2000/29/EK I līdz V pielikumā uzskaitītos objektus
    drīkst ievest vai pārvietot Kopienā vai dažās tās aizsargātās zonās izmēģinājumu
    vai zinātniskiem mērķiem un šķirņu selekcijas vajadzībām (Kodificēta
    versija)
  type: main
- language: lt
  script: Latn
  content: 2008 m. birželio 17 d. Komisijos direktyva 2008/61/EB, nustatanti sąlygas,
    kuriomis tam tikri kenksmingi organizmai, augalai, augaliniai produktai ir kiti
    objektai, išvardyti Tarybos direktyvos 2000/29/EB I–V prieduose, gali būti
    įvežti į Bendriją arba tam tikras jos saugomas zonas ir judėti joje arba
    jose bandymų ar moksliniais ir veislių selekcijos tikslais (kodifikuota redakcija)
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2008/61/KE tas- 17 ta’ Ġunju 2008 li tistabbilixxi
    l-kondizzjonijiet li bihom ċerti organiżmi ta’ ħsara, pjanti, prodotti mill-pjanti
    u oġġetti oħra elenkati fl-Annessi I sa V tad-Direttiva tal-Kunsill 2000/29/KE
    jistgħu jiddaħħlu jew jiġu mċaqalqa fil-Komunità jew f’ċerti żoni protetti
    tagħha, għal prova jew għal skopijiet xjentifiċi u għal xogħol fuq selezzjonijiet
    varjetali (Verżjoni kodifikata)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2008/61/EG van de Commissie van 17 juni 2008 tot vaststelling
    van de voorwaarden waaronder bepaalde in de bijlagen I tot en met V bij Richtlijn
    2000/29/EG van de Raad vermelde schadelijke organismen, planten, plantaardige
    producten en andere materialen voor proefnemingen of wetenschappelijke doeleinden
    en voor selectiewerkzaamheden in de Gemeenschap of in bepaalde beschermde gebieden
    daarvan mogen worden binnengebracht of naar een andere plaats overgebracht (Gecodificeerde
    versie)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2008/61/WE z dnia 17 czerwca 2008 r. ustanawiająca warunki,
    zgodnie z którymi niektóre organizmy szkodliwe, rośliny, produkty roślinne
    i inne wymienione w załącznikach I–V do dyrektywy Rady 2000/29/WE mogą być
    wprowadzane do Wspólnoty lub niektórych jej stref ochronnych lub przemieszczane
    we Wspólnocie lub w takich strefach celem przeprowadzenia prób lub do celów
    naukowo-badawczych i do prowadzenia prac nad tworzeniem odmian roślin (Wersja
    skodyfikowana)
  type: main
- language: pt
  script: Latn
  content: Directiva 2008/61/CE da Comissão, de 17 de Junho de 2008 , que estabelece
    as condições segundo as quais determinados organismos prejudiciais, plantas,
    produtos vegetais e outros materiais, constantes dos anexos I a V da Directiva
    2000/29/CE, podem ser introduzidos ou circular na Comunidade, ou em certas zonas
    protegidas desta, para fins experimentais ou científicos e trabalhos de selecção
    de variedades (Versão codificada)
  type: main
- language: ro
  script: Latn
  content: Directiva 2008/61/CE a Comisiei din 17 iunie 2008 de stabilire a condițiilor
    în care anumite organisme dăunătoare, plante, produse din plante și alte elemente
    enumerate în anexele I-V la Directiva 2000/29/CE a Consiliului pot fi introduse
    și puse în circulație în Comunitate sau în anumite zone protejate ale acesteia,
    pentru testări sau în scopuri științifice și pentru lucrări pe selecții
    de soiuri de plante (versiune codificată)
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2008/61/ES zo 17. júna 2008 ustanovujúca podmienky,
    na základe ktorých môžu byť určité škodlivé organizmy, rastliny, rastlinné
    produkty a iné predmety uvedené v prílohách I až V k smernici Rady 2000/29/ES
    dovezené do Spoločenstva alebo premiestňované v Spoločenstve alebo v určitých
    chránených zónach Spoločenstva na pokusné alebo vedecké účely a na prácu
    na selekcii odrôd (kodifikované znenie)
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2008/61/ES z dne 17. junija 2008 o določitvi pogojev,
    pod katerimi je mogoče nekatere škodljive organizme, rastline, rastlinske proizvode
    in druge predmete, iz Prilog I do V Direktive Sveta 2000/29/ES, vnesti ali jih
    premeščati znotraj Skupnosti oziroma na nekaterih njenih varovanih območjih
    v preskusne ali znanstvene namene in za delo pri žlahtnjenju (Kodificirana različica)
  type: main
- language: es
  script: Latn
  content: Directiva 2008/61/CE de la Comisión, de 17 de junio de 2008 , por la que
    se establecen las condiciones en las que determinados organismos nocivos, vegetales,
    productos vegetales y otros objetos enumerados en los anexos I a V de la Directiva
    2000/29/CE del Consejo, pueden ser introducidos o transportados dentro de la Comunidad
    o de determinadas zonas protegidas de la misma con fines de ensayo o científicos
    y para actividades de selección de variedades (Versión codificada)
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2008/61/EG av den 17 juni 2008 om införande av
    villkor enligt vilka vissa skadegörare, växter, växtprodukter och andra föremål
    som anges i bilaga I–V till rådets direktiv 2000/29/EG kan införas eller förflyttas
    inom gemenskapen eller vissa skyddade zoner för försök eller vetenskapliga
    ändamål och för arbete med sorturval (kodifierad version)
