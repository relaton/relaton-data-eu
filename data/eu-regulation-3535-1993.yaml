  content: Commission Regulation (EC) No 3535/93 of 22 December 1993 suspending advance
    fixing of export refunds on certain cereal and rice products exported in the form
    of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3535/93 de la Commission, du 22 décembre 1993, portant
