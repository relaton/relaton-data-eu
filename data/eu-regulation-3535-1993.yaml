    prodotti del settore dei cereali e del riso esportati sotto forma di merci non
    comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3535/93 van de Commissie van 22 december 1993 houdende
    schorsing van de vaststelling vooraf van de uitvoerrestituties voor bepaalde graan-
    en rijstprodukten, uitgevoerd in de vorm van goederen die niet onder bijlage II
    van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3535/93 da Comissão, de 22 de Dezembro de 1993, que
