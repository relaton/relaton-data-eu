    προκαθορισμού επιστροφών κατά την εξαγωγή
    για ορισμένα προϊόντα σιτηρών και ρυζιού εξαγόμενα
    υπό μορφή εμπορευμάτων μη υπαγομένων στο παράρτημα
    II της συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3535/93 della Commissione, del 22 dicembre 1993, che
