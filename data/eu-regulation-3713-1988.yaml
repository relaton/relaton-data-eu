    περίοδο 1988/89, τον κανονισμό (ΕΟΚ) αριθ. 989/86 για
    λεπτομέρειες εφαρμογής του περιορισμού της
    ενίσχυσης μεταποίησης σε ορισμένες ποσότητες
    πορτοκαλιών και λεμονιών στην Ισπανία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3713/88 DELLA COMMISSIONE del 28 novembre 1988 che
    modifica, per la campagna 1988/1989, il regolamento (CEE) n. 989/86 recante modalità
    d'' applicazione della limitazione dell'' aiuto alla trasformazione ad alcuni
    quantitativi di arance e di limoni in Spagna #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3713/88 VAN DE COMMISSIE van 28 november 1988 tot
