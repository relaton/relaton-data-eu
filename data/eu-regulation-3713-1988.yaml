    af forarbejdningsstøtten til visse mængder appelsiner og citroner i Spanien,
    for produktionsåret 1988/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3713/88 της Επιτροπής
