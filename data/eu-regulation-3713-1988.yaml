  content: Commission Regulation (EEC) No 3713/88 of 28 November 1988 laying down
    detailed rules for applying the limitation of processing aid to certain quantities
    of oranges and lemons in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3713/88 de la Commission du 28 novembre 1988 modifiant,
    pour la campagne 1988/1989, le règlement (CEE) n° 989/86 portant modalités
    d'application de la limitation de l'aide à la transformation à certaines quantités
    d'oranges et de citrons en Espagne
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3713/88 DER KOMMISSION vom 28. November 1988 zur
