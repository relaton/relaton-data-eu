title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1642/84 of 8 June 1984 re-establishing the
    levying of customs duties on gloves, protective, for all trades, falling within
    subheading 42.03 B I and originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1642/84 de la Commission du 8 juin 1984 portant rétablissement
    de la perception des droits de douane applicables aux gants de protection pour
    tous métiers, de la sous-position 42.03 B I du tarif douanier commun, originaires
    du Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1642/84 der Kommission vom 8. Juni 1984 zur Wiedereinführung
    der Erhebung der Zölle für Schutzhandschuhe für alle Berufe der Tarifstelle
    42.03 B I mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3569/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: 'Kommissionens forordning (EØF) nr. 1642/84 af 8. juni 1984 om genindførelse
    af opkrævning af told for handsker: beskyttelseshandsker til erhvervsmæssig
    brug (arbejdshandsker), henhørende under pos. 42.03 B I og med oprindelse i Pakistan,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1642/84 της Επιτροπής
    της 8ης Ιουνίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για χειρόκτια προστατευτικά
    διά παν επάγγελμα, της διακρίσεως 42.03 Β Ι του
    Κοινού Δασμολογίου, καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1642/84 della Commissione dell' 8 giugno 1984 che
    ripristina la riscossione dei dazi doganali applicabili ai guanti di protezione
    per qualunque mestiere della sottovoce 42.03 B I della tariffa doganale comune,
    originari del Pakistan, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1642/84 van de Commissie van 8 juni 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op handschoenen,
    werkhandschoenen en -wanten, van postonderverdeling 42.03 B I, van oorsprong uit
    Pakistan, waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
