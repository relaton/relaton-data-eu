title:
- language: en
  script: Latn
  content: '80/743/EEC: Commission Decision of 11 July 1980 authorizing the French
    Republic not to apply Community treatment to handkerchiefs, falling within heading
    No ex 61.05 of the Common Customs Tariff (categories 19 and 89), originating in
    Czechoslovakia and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/743/CEE: Décision de la Commission, du 11 juillet 1980, autorisant
    la République française à exclure du traitement communautaire les mouchoirs
    en tissus, de la position ex 61.05 du tarif douanier commun (catégories 19 et
    89), originaires de Tchécoslovaquie et mis en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/743/EWG: Entscheidung der Kommission vom 11. Juli 1980, mit der die
    Französische Republik ermächtigt wird, aus der Tschechoslowakei stammende und
    in den übrigen Mitgliedstaaten im freien Verkehr befindliche Taschentücher der
    Tarifnummer ex 61.05 des Gemeinsamen Zolltarifs (Kategorien 19 und 89) von der
    Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/743/EØF: Kommissionens beslutning af 11. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage lommetørklæder,
    som henhører under pos. ex 61.05 i den fælles toldtarif (kategori 19 og 89),
    har oprindelse i Tjekkoslovakiet og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/743/CEE: Decisione della Commissione, dell''11 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i fazzoletti da
    naso e da taschino, di tessuti, della voce ex 61.05 della tariffa doganale comune,
    categorie 19 e 89, originari della Cecoslovacchia e messi in libera pratica negli
    altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/743/EEG: Beschikking van de Commissie van 11 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd zakdoeken van post ex 61.05 van het gemeenschappelijk
    douanetarief (categorieën 19 en 89), van oorsprong uit Tsjechoslowakije en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
