title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1316/91 of 21 May 1991 amending Regulation
    (EEC) No 643/86 laying down detailed rules for the application of the supplementary
    trade mechanism to the live plants and floriculture products imported into Portugal
    concerning the target ceilings for ornamental plants for 1991
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1316/91 DE LA COMMISSION du 21 mai 1991 modifiant
    le règlement (CEE) no 643/86 de la Commission déterminant les modalités d''
    application du mécanisme complémentaire aux échanges pour les produits du secteur
    des plantes vivantes et de la floriculture importés au Portugal, en ce qui concerne
    les plafonds indicatifs fixés pour les plantes ornementales, pour l'' année
    1991 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1316/91 DER KOMMISSION vom 21. Mai 1991 zur Änderung
    der Verordnung (EWG) Nr. 643/86 mit Durchführungsbestimmungen zum ergänzenden
    Handelsmechanismus für die nach Portugal eingeführten Erzeugnisse des Sektors
    lebende Pflanzen und Waren des Blumenhandels betreffend die Richtplafonds für
    Zierpflanzen für das Jahr 1991 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1316/91 af 21. maj 1991 om ændring
    af forordning (EØF) nr. 643/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen med levende planter og blomsterdyrkningens produkter
    importeret i Portugal vedrørende de vejledende lofter for 1991 for prydplanter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1316/91 της Επιτροπής
    της 21ης Μαΐου 1991 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 643/86 που καθορίζει τις λεπτομέρειες
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές για τα προϊόντα του τομέα των
    ζωντανών φυτών και της ανθοκομίας που εισάγονται
    στην Πορτογαλία σε ότι αφορά τα ενδεικτικά
    όρια για το έτος 1991
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1316/91 DELLA COMMISSIONE del 21 maggio 1991 che
    modifica il regolamento (CEE) n. 643/86 che fissa la modalità d'' applicazione
    del meccanismo complementare applicabile agli scambi per i prodotti appartenenti
    al settore delle piante vive e della floricultura importati in Portogallo per
    quanto riguarda i massimali indicativi per le piante ornamentali per l'' anno
    1991 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1316/91 VAN DE COMMISSIE van 21 mei 1991 houdende
    wijziging van Verordening (EEG) nr. 643/86 tot vaststelling van de uitvoeringsbepalingen
    inzake de aanvullende regeling voor het handelsverkeer voor produkten van de sector
    levende planten en produkten van de bloementeelt ingevoerd in Portugal wat betreft
    de indicatieve plafonds voor sierplanten voor 1991 #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1316/91 DA COMISSAO, DE 21 DE MAIO DE 1991, QUE
    ALTERA O REGULAMENTO ( CEE ) NO 643/86 DA COMISSAO, QUE DETERMINA AS REGRAS DE
    EXECUCAO DO MECANISMO COMPLEMENTAR AS TROCAS COMERCIAIS PARA OS PRODUTOS DO SECTOR
    DAS PLANTAS VIVAS E PRODUTOS DA FLORICULTURA, IMPORTADOS EM PORTUGAL, NO QUE SE
    REFERE AOS LIMITES INDICATIVOS PREVISTOS PARA O ANO DE 1991 PARA AS PLANTAS ORNAMENTAIS
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1316/91 DE LA COMISIÓN de 21 de mayo de 1991 que
    modifica el Reglamento (CEE) no 643/86, por el que se establecen normas para la
    aplicación del mecanismo complementario aplicable a los intercambios para los
    productos del sector de las plantas vivas y de la floricultura importados en Portugal
    en lo que concierne a los límites máximos indicativos para el año 1991 #'
  type: main
