title:
- language: en
  script: Latn
  content: '92/544/EEC: Council Decision of 23 November 1992 authorizing the French
    Republic to apply measures derogating from Article 17 and Article 22 (3), (4)
    and (5) of the Sixth Directive 77/388/EEC on the harmonization of the laws of
    the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '92/544/CEE: Décision du Conseil, du 23 novembre 1992, autorisant la République
    française à appliquer diverses mesures dérogeant à l''article 17 et à l''article
    22 paragraphes 3, 4 et 5 de la sixième directive 77/388/CEE en matière d''harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '92/544/EWG: Entscheidung des Rates vom 23. November 1992 zur Ermächtigung
    der Französischen Republik, mehrere von Artikel 17 und Artikel 22 Absätze 3,
    4 und 5 der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften
    der Mitgliedstaaten über die Umsatzsteuern abweichende Maßnahmen anzuwenden'
  type: main
- language: da
  script: Latn
  content: '92/544/EØF: Rådets beslutning af 23. november 1992 om bemyndigelse af
    Den Franske Republik til at anvende diverse foranstaltninger, der fraviger artikel
    17 og artikel 22, stk. 3, 4 og 5, i sjette direktiv 77/388/EØF om harmonisering
    af medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '92/544/ΕΟΚ: Απόφαση του Συμβουλίου της 23ης
    Νοεμβρίου 1992 με την οποία επιτρέπεται στη Γαλλική
    Δημοκρατία να εφαρμόσει διάφορα μέτρα κατά
    παρέκκλιση του άρθρου 17 και του άρθρου 22 παράγραφοι
    3, 4 και 5 της έκτης οδηγίας 77/388/ΕΟΚ περί εναρμονίσεως
    των νομοθεσιών των κρατών μελών των σχετικών
    με τους φόρους κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '92/544/CEE: Decisione del Consiglio, del 23 novembre 1992, che autorizza
    la Repubblica francese ad applicare una serie di misure di deroga all'' articolo
    17 e all'' articolo 22, paragrafi 3, 4 e 5 della sesta direttiva 77/388/CEE in
    materia di armonizzazione delle legislazioni degli Stati membri relative alle
    imposte sulla cifra d'' affari'
  type: main
- language: nl
  script: Latn
  content: '92/544/EEG: Beschikking van de Raad van 23 november 1992 waarbij de Franse
    Republiek wordt gemachtigd verschillende maatregelen toe te passen die afwijken
    van artikel 17 en artikel 22, leden 3, 4 en 5, van Zesde Richtlijn 77/388/EEG
    betreffende de harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '92/544/CEE: Decisão do Conselho, de 23 de Novembro de 1992, que autoriza
    a República Francesa a aplicar diversas medidas derrogatórias do artigo 17°
    e dos n°s 3, 4 e 5 do artigo 22° da Sexta Directiva 77/388/CEE do Conselho,
    relativa à harmonização das legislações dos Estados-membros respeitantes
    aos impostos sobre o volume de negócios'
  type: main
- language: es
  script: Latn
  content: '92/544/CEE: Decisión del Consejo, de 23 de noviembre de 1992, por la
    que se autoriza a la República Francesa a establecer excepciones a lo dispuesto
    en el artículo 17 y en los apartados 3, 4 y 5 del artículo 22 de la sexta Directiva
    (77/388/CEE) en materia de armonización de las legislaciones de los Estados miembros
    relativas a los impuestos sobre el volumen de negocios'
