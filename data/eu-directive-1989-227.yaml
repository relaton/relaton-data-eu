title:
- language: en
  script: Latn
  content: Council Directive 89/227/EEC of 21 March 1989 amending Directives 72/462/EEC
    and 77/99/EEC to take account of the introduction of public health and animal
    health rules which are to govern imports of meat products from third countries
  type: main
- language: fr
  script: Latn
  content: Directive 89/227/CEE du Conseil du 21 mars 1989 modifiant les directives
    72/462/CEE et 77/99/CEE pour tenir compte de l'instauration de règles sanitaires
    et de police sanitaire devant régir les importations de produits à base de viande
    en provenance de pays tiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/227/EWG des Rates vom 21. März 1989 zur Änderung der Richtlinien
    72/462/EWG und 77/99/EWG zur Berücksichtigung der Einführung tierseuchenrechtlicher
    und gesundheitlicher Regeln für die Einfuhr von Fleischerzeugnissen aus Drittländern
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 21. března 1989, kterou se mění směrnice 72/462/EHS
    a 77/99/EHS tak, aby se zohlednilo zavedení hygienických a veterinárních předpisů
    pro dovoz masných výrobků ze třetích zemí
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/227/EØF af 21. marts 1989 om ændring af direktiv
    72/462/EØF og 77/99/EØF med henblik på at tage hensyn til de sundhedsmæssige
    og veterinærpolitimæssige regler, der skal gælde for indførsel af kødprodukter
    fra tredjelande
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/227/ΕΟΚ του Συμβουλίου της 21ης Μαρτίου
    1989 για την τροποποίηση των οδηγιών 72/462/ΕΟΚ
    και 77/99/ΕΟΚ προκειμένου να ληφθεί υπόψη η θέσπιση
    υγειονομικών κανόνων και κανόνων υγειονομικού
    ελέγχου που πρέπει να διέπουν τις εισαγωγές
    προϊόντων με βάση το κρέας προέλευσης τρίτων
    χωρών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 21. märts 1989, millega muudetakse kolmandatest riikidest
    lihatoodete importimist reguleerivate inimeste ja loomade terviseohutuseeskirjade
    arvessevõtmiseks direktiive 72/462/EMÜ ja 77/99/EMÜ
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/227/ETY, annettu 21 päivänä maaliskuuta 1989,
    direktiivien 72/462/ETY ja 77/99/ETY muuttamisesta lihavalmisteiden tuontiin kolmansista
    maista sovellettavien terveyttä ja eläinten terveyttä koskevien uusien sääntöjen
    huomioon ottamiseksi
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1989. március 21.) a 72/462/EGK és a 77/99/EGK
    irányelvnek a harmadik országból származó húsipari termékek behozatalára
    vonatkozó közegészségügyi és állat-egészségügyi szabályok bevezetésének
    figyelembe vétele céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 89/227/CEE del Consiglio del 21 marzo 1989 che modifica le direttive
    72/462/CEE e 77/99/CEE per tener conto dell'instaurazione di norme sanitarie e
    di polizia sanitaria che devono disciplinare l'importazione di prodotti a base
    di carne provenienti dai paesi terzi
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1989. gada 21. marts), ar ko groza Direktīvu 72/462/EEK
    un Direktīvu 77/99/EEK, lai ņemtu vērā to veselības aizsardzības un dzīvnieku
    veselības noteikumu ieviešanu, kuri attiecas uz gaļas produktu importu no trešām
    valstīm
  type: main
- language: lt
  script: Latn
  content: 1989 m. kovo 21 d. Tarybos direktyva, iš dalies keičianti Direktyvas
    72/462/EEB ir 77/99/EEB, siekiant atsižvelgti į visuomenės sveikatos ir gyvūnų
    sveikatos taisyklių, kurios turi reglamentuoti mėsos produktų importą iš
    trečiųjų šalių, nustatymą
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill tal-21 Marzu 1989 li temenda d-Direttivi 72/462/KEE
    u 77/99/KEE biex tieħu konsiderazzjoni ta’ l-introduzzjoni ta’ regoli dwar
    is-saħħa pubblika u dwar is-saħħa ta’ l-annimali li għandhom jirregolaw
    l-importazzjoni ta’ prodotti tal-laħam minn pajjiżi terzi.
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/227/EEG van de Raad van 21 maart 1989 tot wijziging van Richtlijn
    72/462/EEG en Richtlijn 77/99/EEG in verband met de invoering van gezondheids-
    en veterinairrechtelijke voorschriften die moeten gelden bij invoer van vleesprodukten
    uit derde landen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 21 marca 1989 r. zmieniająca dyrektywy 72/462/EWG
    i 77/99/EWG w celu uwzględnienia wprowadzenia zasad zdrowia publicznego i zdrowia
    zwierząt, które mają regulować przywóz produktów mięsnych z państw trzecich
  type: main
- language: pt
  script: Latn
  content: Directiva 89/227/CEE do Conselho de 21 de Março de 1989 que altera as
    Directivas 72/462/CEE e 77/99/CEE, a fim de tomar em consideração a instauração
    de regras sanitárias e de política sanitária que devem reger as importações
    de produtos à base de carne provenientes de países terceiros
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 21. marca 1989, ktorou sa menia a dopĺňajú smernice
    72/462/EHS a 77/99/EHS so zreteľom na zavedenie pravidiel pre zdravie ľudí
    a zdravie zvierat, ktorými sa riadia dovozy mäsových výrobkov z tretích krajín
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 21. marca 1989 o spremembi direktiv 72/462/EGS in
    77/99/EGS, s čimer se upošteva uvedba pravil o javnem zdravju in zdravstvenem
    varstvu živali, ki urejajo uvoz mesnih proizvodov iz tretjih držav
  type: main
- language: es
  script: Latn
  content: Directiva 89/227/CEE del Consejo de 21 de marzo de 1989 por la que se modifican
    las Directivas 72/462/CEE y 77/99/CEE para tener en cuenta el establecimiento
    de las normas sanitarias y de policía sanitaria que deberán regular las importaciones
    de productos a base de carne procedentes de países terceros
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 89/227/EEG av den 21 mars 1989 om ändring av direktiven
    72/462/EEG och 77/99/EEG för att beakta införandet av regler om hygien och djurhälsa
    som skall gälla vid import av köttprodukter från tredje land
  type: main
