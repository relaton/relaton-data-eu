    V и XIV към Регламент за изпълнение (ЕС) 2021/404 по
    отношение на вписванията за Канада и Съединените
    щати в списъците на трети държави, територии
    или зони от тях, от които е разрешено въвеждането
    в Съюза на пратки с домашни птици, зародишни
    продукти от домашни птици и прясно месо от
    домашни птици и пернат дивеч
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/1845 ze dne 27. června 2024,
    kterým se mění přílohy V a XIV prováděcího nařízení (EU) 2021/404,
    pokud jde o položky pro Kanadu a Spojené státy americké v seznamech třetích
    zemí, území nebo jejich oblastí, z nichž je povolen vstup zásilek drůbeže
    a zárodečných produktů drůbeže a čerstvého masa drůbeže a pernaté zvěře
    do Unie
  type: main
