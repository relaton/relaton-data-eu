    Sjedinjene Američke Države na popisima trećih zemalja, područja ili njihovih
    zona iz kojih je odobren ulazak u Uniju pošiljaka peradi, zametnih proizvoda
    peradi te svježeg mesa peradi i pernate divljači
  type: main
