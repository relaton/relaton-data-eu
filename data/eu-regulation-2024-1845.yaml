- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1845 of 27 June 2024 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada and the United States in the lists of third countries, territories
    or zones thereof authorised for the entry into the Union of consignments of poultry
    and germinal products of poultry, and of fresh meat of poultry and game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1845 de la Commission du 27 juin 2024
    modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404 en ce
    qui concerne les mentions relatives au Canada et aux États-Unis dans les listes
    de pays tiers, de territoires ou de zones de pays tiers en provenance desquels
    l’entrée dans l’Union d’envois de volailles et de produits germinaux de
    volailles ainsi que de viandes fraîches de volailles et de gibier à plumes est
    autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1845 der Kommission vom 27. Juni 2024
    zur Änderung der Anhänge V und XIV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Einträge für Kanada und die Vereinigten Staaten in den Listen
    der Drittländer, Gebiete oder Zonen derselben, aus denen der Eingang von Sendungen
    von Geflügel und Zuchtmaterial von Geflügel sowie frischem Fleisch von Geflügel
    und Federwild in die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
