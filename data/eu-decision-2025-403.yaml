  script: Latn
  content: Commission Implementing Decision (EU) 2025/403 of 28 February 2025 amending
    the Annexes to Implementing Decision (EU) 2021/260 as regards the approval of
    certain national measures designed to limit the impact of certain diseases of
    aquatic animals and as regards the list of species which are susceptible to those
    diseases
  type: main
- language: fr
  script: Latn
