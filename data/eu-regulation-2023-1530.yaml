title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1530 of 6 July 2023 approving
    Chrysanthemum cinerariaefolium extract from open and mature flowers of Tanacetum
    cinerariifolium obtained with hydrocarbon solvents as an active substance for
    use in biocidal products of product-type 18 in accordance with Regulation (EU)
    No 528/2012 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1530 de la Commission du 6 juillet
    2023 approuvant l’extrait de Chrysanthemum cinerariaefolium produit avec des
    solvants hydrocarbonés à partir de fleurs de Tanacetum cinerariifolium ouvertes
    et matures en tant que substance active destinée à être utilisée dans les
    produits biocides du type de produits 18, conformément au règlement (UE) no
    528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/1530 der Kommission vom 6. Juli 2023
    zur Genehmigung von Chrysanthemum-cinerariaefolium-Extrakt aus offenen und reifen
    Tanacetum-cinerariifolium-Blüten, mit Kohlenwasserstoff-Lösungsmittel gewonnen,
    als Wirkstoff zur Verwendung in Biozidprodukten der Produktart 18 gemäß der
    Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
