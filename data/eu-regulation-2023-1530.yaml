    kinyert Chrysanthemum cinerariaefolium-kivonat 18. terméktípusba tartozó biocid
    termékek hatóanyagaként történő felhasználásának az 528/2012/EU európai
    parlamenti és tanácsi rendelet szerinti jóváhagyásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/1530 della Commissione del 6 luglio
