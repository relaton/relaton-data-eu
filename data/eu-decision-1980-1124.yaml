    berufliche Qualifikation der in der Landwirtschaft tätigen Personen geleisteten
    Ausgaben durch den EAGFL, Abteilung Ausrichtung, an die Französische Republik
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
