id: EUDecision1984447
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '84/447/EEC: Commission Decision of 16 August 1984 authorizing the French
    Republic to apply intra-Community surveillance to imports into the Community of
    certain textile products which originate in the People''s Republic of China and
    to which safeguard measures could be applied under Article 115 of the Treaty (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/447/CEE: Décision de la Commission du 16 août 1984 autorisant la
    République française à instaurer une surveillance intracommunautaire des importations
    de certains produits textiles originaires de la République populaire de Chine
    dans la Communauté, susceptibles de faire l''objet de mesures de protection au
    titre de l''article 115 du traité (Le texte en langue française est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '84/447/EWG: Entscheidung der Kommission vom 16. August 1984 mit der die
    Französische Republik ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren bestimmter aus der Volksrepublik China stammender Textilwaren in
    die Gemeinschaft, denen gegenüber Schutzmaßnahmen nach Artikel 115 des Vertrages
    getroffen werden können, einzuführen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/447/EØF: Kommissionens beslutning af 16. august 1984 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    i Fællesskabet af visse tekstilvarer med oprindelse i Den kinesiske Folkerepublik,
    som kan undergives beskyttelsesforanstaltninger med hjemmel i traktatens artikel
    115 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/447/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Αυγούστου 1984 για τη χορήγηση άδειας στη Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επίβλεψη
    των εισαγωγών στην Κοινότητα ορισμένων κλωστοϋφαντουργικών
    προϊόντων, καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας, που ενδέχεται να αποτελέσουν αντικείμενο
    μέτρων προστασίας βάσει του άρθρου 115 της συνθήκης
    ΕΟΚ (Το κείμενο στην γαλλική γλώσσα είναι το
    μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/447/CEE: Decisione della Commissione del 16 agosto 1984 che autorizza
    la Repubblica francese a istituire una sorveglianza intracomunitaria sulle importazioni
    nella Comunità di alcuni prodotti tessili originari della Repubblica popolare
    cinese, che potrebbero formare oggetto di misure di protezione ai sensi dell''articolo
    115 del trattato (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/447/EEG: Beschikking van de Commissie van 16 augustus 1984 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    op de invoer in de Gemeenschap van bepaalde textielprodukten, van oorsprong uit
    de Volksrepubliek China, ten aanzien waarvan krachtens artikel 115 van het Verdrag
    beschermingsmaatregelen mogen worden getroffen (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
