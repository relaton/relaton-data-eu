    der Verordnung (EWG) Nr. 1061/69 hinsichtlich der Analysemethoden zur Bestimmung
    des Stärkegehalts in Sojaproteinkonzentraten sowie in Waren, die solche Erzeugnisse
    enthalten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1822/86 af 30. maj 1986 om ændring
