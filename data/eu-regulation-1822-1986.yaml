    που περιέχουν αυτά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1822/86 della Commissione del 30 maggio 1986 che modifica
    il regolamento (CEE) n. 1061/69 per quanto concerne i metodi di analisi per la
    determinazione dell' amido nei concentrati di proteine di soia, nonché nelle
    merci che ne contengono
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1822/86 van de Commissie van 30 mei 1986 tot wijziging
