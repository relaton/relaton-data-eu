  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/1936, annettu 9 päivänä
    marraskuuta 2021, täytäntöönpanoasetuksen (EU) 2018/2019 muuttamisesta tiettyjen
    Israelista peräisin olevien istutettaviksi tarkoitettujen Ficus carica L.- ja
    Persea americana Mill. -kasvien osalta, täytäntöönpanoasetuksen (EU) 2020/1213
    muuttamisesta siltä osin kuin on kyse kyseisten kasvien tuomista unionin alueelle
    koskevista kasvinsuojelutoimenpiteistä ja viimeksi mainitun täytäntöönpanoasetuksen
    oikaisemisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/1936 ón gCoimisiún an 9 Samhain
    2021 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid a bhaineann
    le plandaí áirithe atá le cur de Ficus carica L. agus de Persea americana Mill.
    de thionscnamh Iosrael, lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1213
    a mhéid a bhaineann leis na bearta fíteashláintíochta chun na plandaí sin
    atá le cur a thabhairt isteach i gcríoch an Aontais agus lena gceartaítear
    an Rialachán Cur Chun Feidhme (AE) 2020/1213
  type: main
- language: hr
  script: Latn
