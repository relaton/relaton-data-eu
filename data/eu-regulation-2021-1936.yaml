    do niektórych przeznaczonych do sadzenia roślin gatunków Ficus carica L. i
    Persea americana Mill. pochodzących z Izraela, zmiany rozporządzenia wykonawczego
    (UE) 2020/1213 w odniesieniu do środków fitosanitarnych do celów wprowadzania
    na terytorium Unii tych przeznaczonych do sadzenia roślin oraz w sprawie sprostowania
    tego drugiego rozporządzenia wykonawczego
  type: main
