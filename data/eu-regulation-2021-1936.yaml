    a determinados vegetais para plantação de Ficus carica L. e Persea americana
    Mill. originários de Israel, que altera o Regulamento de Execução (UE) 2020/1213
    no que se refere às medidas fitossanitárias para a introdução desses vegetais
    para plantação no território da União e que retifica este último regulamento
    de execução
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/1936 al Comisiei din 9 noiembrie
    2021 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării – Ficus carica L. și
    Persea americana Mill. – originare din Israel, de modificare a Regulamentului
    de punere în aplicare (UE) 2020/1213 în ceea ce privește măsurile fitosanitare
    pentru introducerea acestor plante destinate plantării pe teritoriul Uniunii
    și de rectificare a acestui din urmă regulament de punere în aplicare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1936 z 9. novembra 2021, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    na výsadbu druhu Ficus carica L. a rodu Persea americana Mill. s pôvodom v Izraeli,
    mení vykonávacie nariadenie (EÚ) 2020/1213, pokiaľ ide o rastlinolekárske
    opatrenia v súvislosti so vstupom uvedených rastlín na výsadbu na územie
    Únie, a ktorým sa opravuje druhé uvedené vykonávacie nariadenie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/1936 z dne 9. novembra 2021 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Ficus carica
    L. in Persea americana Mill. s poreklom iz Izraela ter o spremembi Izvedbene uredbe
    (EU) 2020/1213 glede fitosanitarnih ukrepov za vnos navedenih rastlin za saditev
    na ozemlje Unije in njenem popravku
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1936 de la Comisión de 9 de noviembre
    de 2021 por el que se modifica el Reglamento de Ejecución (UE) 2018/2019 en lo
    que respecta a determinados vegetales para plantación de Ficus carica L. y Persea
    americana Mill. originarios de Israel, se modifica el Reglamento de Ejecución
    (UE) 2020/1213 en lo que respecta a las medidas fitosanitarias para la introducción
    de esos vegetales para plantación en el territorio de la Unión y se corrige
    este último Reglamento de Ejecución
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1936 av den 9 november
    2021 om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa
    växter för plantering av Ficus carica L. och Persea americana Mill. med ursprung
    i Israel, om ändring av genomförandeförordning (EU) 2020/1213 vad gäller växtskyddsåtgärder
    för införsel av dessa växter för plantering till unionens territorium samt
    om rättelse av den senare genomförandeförordningen
