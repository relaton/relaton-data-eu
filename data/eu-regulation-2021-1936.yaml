title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1936 of 9 November 2021 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Ficus carica L. and Persea americana Mill. originating in Israel, amending
    Implementing Regulation (EU) 2020/1213 as regards the phytosanitary measures for
    the introduction of those plants for planting into the Union territory and correcting
    the latter Implementing Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1936 de la Commission du 9 novembre
    2021 modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne
    certains végétaux destinés à la plantation de l’espèce Ficus carica L.
    et du genre Persea americana Mill. originaires d’Israël, modifiant le règlement
    d’exécution (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires applicables
    à l’introduction de ces végétaux destinés à la plantation sur le territoire
    de l’Union et rectifiant ce dernier règlement d’exécution
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/1936 der Kommission vom 9. November
    2021 zur Änderung der Durchführungsverordnung (EU) 2018/2019 hinsichtlich einiger
    zum Anpflanzen bestimmter Pflanzen von Ficus carica L. und Persea americana Mill.
    mit Ursprung in Israel sowie zur Änderung der Durchführungsverordnung (EU) 2020/1213
    hinsichtlich der Pflanzenschutzmaßnahmen für das Einführen dieser zum Anpflanzen
    bestimmten Pflanzen in das Gebiet der Union und zur Berichtigung letzterer Durchführungsverordnung
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/1936 на Комисията
    от 9 ноември 2021 година за изменение на Регламент
    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от вида Ficus carica L. и вида
    Persea americana Mill. с произход от Израел, за изменение
    на Регламент за изпълнение (ЕС) 2020/1213 по отношение
    на фитосанитарните мерки за въвеждането на
    тези растения за засаждане на територията
    на Съюза и за поправка на последния регламент
    за изпълнение
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/1936 ze dne 9. listopadu 2021,
    kterým se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé
    rostliny k pěstování druhů Ficus carica L. a Persea americana Mill. pocházející
    z Izraele, mění prováděcí nařízení (EU) 2020/1213, pokud jde o fytosanitární
    opatření pro dovoz uvedených rostlin k pěstování na území Unie, a kterým
    se opravuje uvedené prováděcí nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/1936 af 9. november 2021
    om ændring af gennemførelsesforordning (EU) 2018/2019 for så vidt angår visse
    planter til plantning af Ficus carica L. og Persea americana Mill. med oprindelse
    i Israel, om ændring af gennemførelsesforordning (EU) 2020/1213 for så vidt
    angår plantesundhedsmæssige foranstaltninger for indførsel af de pågældende
    planter til plantning til Unionens område og om berigtigelse af sidstnævnte
    gennemførelsesforordning
  type: main
