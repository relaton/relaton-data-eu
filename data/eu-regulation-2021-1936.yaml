    izcelsmes Ficus carica L. un Persea americana Mill. stādāmiem augiem, Īstenošanas
    regulu (ES) 2020/1213 groza attiecībā uz fitosanitārajiem pasākumiem minēto
    stādāmo augu ievešanai Savienības teritorijā un labo pēdējo minēto īstenošanas
    regulu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/1936 2021 m. lapkričio 9
    d. kuriuo dėl tam tikrų Izraelio kilmės sodinti skirtų Ficus carica L. ir
    Persea americana Mill. augalų iš dalies keičiamas Įgyvendinimo reglamentas
    (ES) 2018/2019, iš dalies keičiamos Įgyvendinimo reglamento (ES) 2020/1213
    nuostatos dėl fitosanitarinių priemonių, susijusių su tų sodinti skirtų
    augalų įvežimu į Sąjungos teritoriją, ir pastarasis įgyvendinimo reglamentas
    ištaisomas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1936 tad-9
