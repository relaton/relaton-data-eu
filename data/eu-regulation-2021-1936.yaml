    fir-rigward ta’ ċerti pjanti għat-tħawwil tal-Ficus carica L. u tal-Persea
    americana Mill. li joriġinaw f’Iżrael, li jemenda r-Regolament ta’ Implimentazzjoni
    (UE) 2020/1213 fir-rigward tal-miżuri fitosanitarji għall-introduzzjoni ta’
    dawk il-pjanti għat-tħawwil fit-territorju tal-Unjoni u li jikkoreġi dan ir-Regolament
    ta’ Implimentazzjoni tal-aħħar
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/1936 van de Commissie van 9 november 2021
    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde uit
    Israël afkomstige voor opplant bestemde planten van de soorten Ficus carica L.
    en Persea americana Mill., tot wijziging van Uitvoeringsverordening (EU) 2020/1213
    wat betreft de fytosanitaire maatregelen voor het binnenbrengen van die voor opplant
    bestemde planten op het grondgebied van de Unie, en tot rectificatie van laatstgenoemde
    uitvoeringsverordening
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/1936 z dnia 9 listopada 2021
