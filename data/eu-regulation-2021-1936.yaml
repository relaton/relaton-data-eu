    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrsta Ficus
    carica L. i Persea americana Mill., podrijetlom iz Izraela, izmjeni Provedbene
    uredbe (EU) 2020/1213 u pogledu fitosanitarnih mjera za unos tog bilja za sadnju
    na područje Unije te o ispravku potonje provedbene uredbe
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1936 végrehajtási rendelete (2021. november 9.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Ficus carica L. és a Persea americana
    Mill. bizonyos Izraelből származó, ültetésre szánt növényei tekintetében
    történő módosításáról, az (EU) 2020/1213 végrehajtási rendeletnek az
    említett, ültetésre szánt növények Unió területére történő behozatalára
    vonatkozó növényegészségügyi intézkedések tekintetében történő módosításáról
    és az utóbbi végrehajtási rendelet helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/1936 della Commissione del 9 novembre
    2021 che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Ficus carica L. e Persea americana Mill., originarie
    di Israele, e il regolamento di esecuzione (UE) 2020/1213 per quanto riguarda
    le misure fitosanitarie per l'introduzione di tali piante da impianto nel territorio
    dell'Unione e che rettifica quest'ultimo regolamento di esecuzione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/1936 (2021. gada 9. novembris),
