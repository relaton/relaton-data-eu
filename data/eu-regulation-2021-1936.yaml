    Mill. teatavate Iisraelist pärit istutamiseks ettenähtud taimedega, muudetakse
    rakendusmäärust (EL) 2020/1213 seoses fütosanitaarmeetmetega kõnealuste istutamiseks
    ettenähtud taimede sissetoomiseks liidu territooriumile ning parandatakse viimati
