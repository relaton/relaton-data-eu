title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2428/83 of 26 August 1983 re-establishing
    the levying of customs duties on sodium dichromate, falling within subheading
    28.47 B ex II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2428/83 de la Commission du 26 août 1983 portant rétablissement
    de la perception des droits de douane applicables au dichromate de sodium, de
    la sous-position 28.47 B ex II du tarif douanier commun, originaire de Roumanie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2428/83 der Kommission vom 26. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Natriumdichromat der Tarifstelle 28.47 B ex II, mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2428/83 af 26. august 1983 om genindførelse
    af opkrævning af told for natriumdichromat, henhørende under pos. 28.47 B ex
    II og med oprindelse i Rumænien, som præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
