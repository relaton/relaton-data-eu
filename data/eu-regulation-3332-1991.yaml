type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3332/91 of 11 November 1991 amending Regulation
    (EEC) No 1873/84 authorizing the offer or disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3332/91 DU CONSEIL du 11 novembre 1991 modifiant le
    règlement (CEE) no 1873/84 autorisant l'' offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d'' avoir fait l'' objet
    de pratiques oenologiques non prévues par le règlement (CEE) no 822/87 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3332/91 DES RATES vom 11. November 1991 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 822/87 nicht vorgesehenen önologischen Verfahren waren #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3332/91 af 11. november 1991 om ændring
    af forordning (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til
    direkte konsum af visse indførte vine, som eventuelt har været underkastet andre
    ønologiske fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3332/91 του Συμβουλίου,
    της 11ης Νοεμβρίου 1991, για την τροποποίηση του
    κανονισμού ( ΕΟΚ ) αριθ. 1873/84 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων δυναμένων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    ( ΕΟΚ ) αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3332/91 DEL CONSIGLIO dell'' 11 novembre 1991 recante
    modifica del regolamento (CEE) n. 1873/84 che autorizza l'' offerta e la consegna
    per il consumo umano diretto di taluni vini importati che possono essere stati
    sottoposti a pratiche enologiche non previste dal regolamento (CEE) n. 822/87
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3332/91 VAN DE RAAD van 11 november 1991 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 822/87 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3332/91 DO CONSELHO de 11 de Novembro de 1991 que
    altera o Regulamento (CEE) no 1873/84, que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptíveis de terem
    sido objecto de práticas enológicas não previstas no Regulamento (CEE) no 822/87
    #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3332/91 DEL CONSEJO de 11 de noviembre de 1991 que
    modifica el Reglamento (CEE) no 1873/84 por el que se autoriza la oferta y la
    entrega al consumo humano directo de determinados vinos importados que pueden
    haber sido sometidos a prácticas enológicas no previstas en el Reglamento (CEE)
    no 822/87 #'
  type: main
