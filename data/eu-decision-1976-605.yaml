  content: Commission Decision of 15 July 1976 prolonging the duty-free importation
    of goods for free distribution to the earthquake victims in the Friuli region
  type: main
- language: fr
  script: Latn
  content: '76/605/CEE: Décision de la Commission, du 15 juillet 1976, prorogeant
    la franchise des droits à l''importation en faveur des marchandises destinées
    à être distribuées gratuitement aux victimes du tremblement de terre de la
    région du Frioul'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 15. Juli 1976 zur Verlängerung der Befreiung
    von den Eingangsabgaben für Waren, die zur unentgeltlichen Verteilung an die
    Opfer des Erdbebens der Region Friaul bestimmt sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 15. juli 1976 om forlængelse af fritagelsen
    for told ved indførsel af varer bestemt til gratis udlevering til ofrene for
    jordskælvene i Friuli-området
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 15 luglio 1976, che proroga la franchigia
    dai dazi all'importazione di merci destinate a essere distribuite gratuitamente
    alle vittime del terremoto della regione Friuli
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 15 juli 1976 tot verlenging van de vrijstelling
    van de rechten bij invoer voor goederen bestemd om gratis te worden verstrekt
    aan de slachtoffers van de aardbeving in de streek Friuli
