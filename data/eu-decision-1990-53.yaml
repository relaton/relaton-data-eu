schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '90/53/EEC: Commission Decision of 17 January 1990 authorizing Member States
    temporarily to take additional measures against the dissemination of Corynebacterium
    sepedonicum as regards the Federal Republic of Germany and repealing Decision
    88/127/EEC'
  type: main
- language: fr
  script: Latn
  content: '90/53/CEE: Décision de la Commission du 17 janvier 1990 autorisant les
    États membres à prendre provisoirement des mesures supplémentaires en vue de
    se protéger contre la propagation du Corynebacterium sepedonicum en provenance
    de la République fédérale d''Allemagne et abrogeant la décision 88/127/CEE'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 17. Januar 1990 zur Ermaechtigung bestimmter
    Mitgliedstaaten, voruebergehend zusaetzliche Massnahmen gegen die Verbreitung
    von Corynebacterium sepedonicum gegenueber der Bundesrepublik Deutschland zu treffen,
    und zur Aufhebung der Entscheidung 88/127/EWG (90/53/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 17. januar 1990 om bemyndigelse af medlemsstaterne
    til midlertidigt at traeffe supplerende foranstaltninger til beskyttelse mod spredning
    af Corynebacterium sepedonicum for saa vidt angaar Forbundsrepublikken Tyskland
    samt om ophaevelse af Kommissionens beslutning 88/127/EOEF (90/53/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/53/ΕΟΚ: Απόφαση της Επιτροπής της 17ης Ιανουαρίου
    1990 που επιτρέπει προσωρινά στα κράτη μέλη να
    λάβουν συμπληρωματικά μέτρα έναντι της Ομοσπονδιακής
    Δημοκρατίας της Γερμανίας κατά της εξάπλωσης
    του corynebacterium sepedonicum και που καταργεί την απόφαση
    88/127/ΕΟΚ'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 17 gennaio 1990 che autorizza gli Stati
    membri a prendere provvisoriamente misure supplementari per cautelarsi contro
    la propagazione del Corynebacterium sepedonicum relativamente alla Repubblica
    federale di Germania e che abroga la decisione 88/127/CEE (90/53/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 17 januari 1990 houdende machtiging van
    de Lid-Staten om ten aanzien van de Bondsrepubliek Duitsland tijdelijk aanvullende
    maatregelen te nemen ten einde zich te beschermen tegen de verspreiding van Corynebacterium
    sepedonicum en tot intrekking van Beschikking 88/127/EEG (90/53/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 17 de Janeiro de 1990 que autoriza determinados
    Estados-membros a adoptar, temporariamente, medidas adicionais em relaçao à
    Republica Federal da Alemanha para se protegerem contra a introduçao do Corynebacterium
    sepedonicum e que revoga a Decisao 88/127/CEE (90/53/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 17 de enero de 1990 po la que se autoriza a
    los Estados miembros para que adopten provisionalmente las medidas complementarias
    necesarias para protegerse contra la introduccion del Corynebacterium sepedonicum
    procedente de la Republica Federal de Alemania y por la que se deroga la Decision
    88/127/CEE (90/53/CEE)
  type: main
