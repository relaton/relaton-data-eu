title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 547/90 of 2 March 1990 imposing a provisional
    anti-dumping duty on imports of certain glutamic acid and its salts originating
    in Indonesia, the Republic of Korea, Taiwan and Thailand, and accepting undertakings
    in connection with imports of certain glutamic acid and its salts originating
    in these countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 547/90 de la Commission du 2 mars 1990 instituant
    un droit antidumping provisoire sur les importations d'acide glutamique et de
    ses sels, originaires d'Indonésie, de la République de Corée, de T'ai-wan et
    de Thaïlande, et portant acceptation d'engagements dans le cadre des importations
    d'acide glutamique et de ses sels originaires de ces pays
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 547/90 DER KOMMISSION vom 2. Maerz 1990 zur Einfuehrung
    eines vorlaeufigen Antidumpingzolls auf die Einfuhren bestimmter Glutaminsaeuren
    und ihrer Salze mit Ursprung in Indonesien, der Republik Korea, Taiwan und Thailand
    und zur Annahme der Verpflichtungen im Zusammenhang mit den Einfuhren bestimmter
    Glutaminsaeuren und ihrer Salze mit Ursprung in diesen Laendern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 547/90 af 2. marts 1990 om indførelse
    af en midlertidig antidumpingtold på importen af visse typer glutaminsyre og
    salte deraf med oprindelse i Indonesien, Republikken Korea, Taiwan og Thailand
    og om godtagelse af tilsagn i forbindelse med importen af visse typer glutaminsyre
    og salte deraf med oprindelse i disse lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 547/90 της Επιτροπής
    της 2ας Μαρτίου 1990 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές γλουταμινικού
    οξέος και των αλάτων του, καταγωγής Ινδονησίας,
    Δημοκρατίας της Κορέας, Ταϊβάν και Ταϊλάνδης,
    και για την υποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν όσον αφορά τις εισαγωγές γλουταμινικού
    οξέος και των αλάτων του καταγωγής αυτών των
    χωρών
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 547/90 DELLA COMMISSIONE del 2 marzo 1990 con cui
    è istituito un dazio antidumping provvisorio sulle importazioni di determinati
    prodotti rientranti nella categoria dell'acido glutammico e dei suoi sali originari
    dell'Indonesia, della Repubblica di Corea, di Taiwan e della Tailandia e sono
    accettati gli impegni offerti in merito alle importazioni degli stessi prodotti
    originari di detti paesi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 547/90 VAN DE COMMISSIE van 2 maart 1990 tot instelling
    van een voorlopig anti-dumpingrecht op de invoer van een bepaalde soort glutaminezuur
    en zouten daarvan, van oorsprong uit Indonesië, de Republiek Korea, Taiwan en
    Thailand, en houdende aanvaarding van verbintenissen in verband met de invoer
    van een bepaalde soort glutaminezuur en zouten daarvan, van oorsprong uit deze
    landen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 547/90 DA COMISSAO de 2 de Março de 1990 que institui
    um direito anti-dumping sobre as importaçoes de determinado acido glutâmico
    e seus sais originarios da Indonésia, da Republica da Coreia, de Taiwan e da
    Tailândia e que aceita compromissos relativos a importaçoes de determinado acido
    glutâmico e seus sais originarios destes paises
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 547/90 DE LA COMISION de 2 de marzo de 1990 por el
    que se establece un derecho antidumping provisional sobre las importaciones de
    determinados acidos glutamicos y sus sales, originarios de Indonesia, la Republica
    de Corea, Taiwan y Tailandia, y por el que se aceptan los compromisos correspondientes
    a las importaciones de determinados acidos glutamicos y sus sales originarios
    de dichos paises
