  content: Regulamento de Execução (UE) 2017/2232 da Comissão, de 4 de dezembro
    de 2017, que reinstitui um direito anti-dumping definitivo e estabelece a cobrança
    definitiva do direito provisório instituído sobre as importações de determinado
    tipo de calçado com a parte superior de couro natural originário e produzido
    por certos produtores-exportadores da República Popular da China e do Vietname,
    e que dá cumprimento ao acórdão do Tribunal de Justiça nos processos apensos
    C-659/13 e C-34/14
  type: main
