    и Виетнам, и за изпълнение на решението на Съда
    на Европейския съюз по съединени дела C-659/13
    и C-34/14
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/2232 ze dne 4. prosince 2017,
