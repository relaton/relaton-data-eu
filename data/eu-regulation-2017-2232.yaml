  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/2232 al Comisiei din 4 decembrie
    2017 de reinstituire a unei taxe antidumping definitive și de percepere definitivă
    a taxei provizorii instituite asupra importurilor de anumite tipuri de încălțăminte
    cu fețe din piele originare din Republica Populară Chineză și Vietnam și
    produse de anumiți producători-exportatori din Republica Populară Chineză
    și Vietnam și de punere în aplicare a hotărârii Curții de Justiție în
    cauzele conexate C-659/13 și C-34/14
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/2232 zo 4. decembra 2017, ktorým
    sa opätovne ukladá konečné antidumpingové clo a s konečnou platnosťou sa
    vyberá predbežné clo uložené na dovoz určitej obuvi so zvrškom z usne s
    pôvodom v Čínskej ľudovej republike a vo Vietname a vyrobenej určitými vyvážajúcimi
    výrobcami v Čínskej ľudovej republike a vo Vietname a ktorým sa vykonáva
    rozsudok Súdneho dvora v spojených veciach C-659/13 a C-34/14
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/2232 z dne 4. decembra 2017 o ponovni
    uvedbi dokončne protidampinške dajatve in dokončnem pobiranju začasne dajatve
    na uvoz določene obutve z zgornjim delom iz usnja s poreklom iz Ljudske republike
    Kitajske in Vietnama, ki jo proizvajajo nekateri proizvajalci v Ljudski republiki
    Kitajski in Vietnamu, ter o izvršitvi sodbe Sodišča v združenih zadevah C-659/13
    in C-34/14
  type: main
