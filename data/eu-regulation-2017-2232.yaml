  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/2232 оd 4. prosinca 2017. o ponovnom
    uvođenju konačne antidampinške pristojbe i konačnoj naplati privremene pristojbe
    uvedene na uvoz određene obuće s gornjim dijelom od kože podrijetlom iz Narodne
    Republike Kine i Vijetnama koju proizvode određeni proizvođači izvoznici u
