    definitivamente el derecho provisional establecido sobre las importaciones de
    determinado calzado con parte superior de cuero originario de la República Popular
    China y de Vietnam y fabricado por determinados productores exportadores de estos
    dos países, y se ejecuta la sentencia del Tribunal de Justicia en los asuntos
    acumulados C-659/13 y C-34/14
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/2232 av den 4 december
    2017 om återinförande av en slutgiltig antidumpningstull och slutgiltigt uttag
    av den preliminära tull som införts på import av vissa skodon med överdelar
    av läder med ursprung i Folkrepubliken Kina och Vietnam och som tillverkas av
    vissa exporterande tillverkare i Folkrepubliken Kina och Vietnam och om genomförande
    av domstolens dom i de förenade målen C-659/13 och C-34/14
