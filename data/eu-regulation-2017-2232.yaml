  script: Latn
  content: Regolamento di esecuzione (UE) 2017/2232 della Commissione, del 4 dicembre
    2017, che reistituisce un dazio antidumping definitivo e dispone la riscossione
    definitiva del dazio provvisorio istituito sulle importazioni di alcuni tipi di
    calzature con tomaie di cuoio originarie della Repubblica popolare cinese e del
    Vietnam e prodotte da alcuni produttori esportatori della Repubblica popolare
    cinese e del Vietnam, in esecuzione della sentenza della Corte di giustizia nelle
    cause riunite C-659/13 e C-34/14
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/2232 (2017. gada 4. decembris),
