id: EUDirective1963340
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 63/340/EEC of 31 May 1963 on the abolition of all prohibitions
    on or obstacles to payments for services where the only restrictions on exchange
    of services are those governing such payments
  type: main
- language: fr
  script: Latn
  content: Directive 63/340/CEE du Conseil, du 31 mai 1963, tendant à supprimer toute
    prohibition ou toute gêne au paiement de la prestation lorsque les échanges
    de services ne sont limités que par des restrictions aux paiements y afférents
  type: main
- language: de
  script: Latn
  content: Richtlinie 63/340/EWG des Rates vom 31. Mai 1963 zur Aufhebung aller Verbote
    oder Behinderungen von Zahlungen für Leistungen, wenn der Dienstleistungsverkehr
    nur durch Beschränkungen der damit verbundenen Zahlungen begrenzt ist
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 63/340/EØF af 31. maj 1963 om ophævelse af alle forbud
    mod eller hindringer for betalinger for tjenesteydelser, når udvekslingen af
    tjenesteydelser alene er begrænset gennem indskrænkninger i adgangen til at
    foretage de dermed forbundne betalinger
  type: main
- language: it
  script: Latn
  content: Direttiva 63/340/CEE del Consiglio del 31 maggio 1963 volta a sopprimere
    ogni divieto od impedimento al pagamento della prestazione qualora gli scambi
    di servizi siano limitati soltanto da restrizioni ai pagamenti relativi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 63/340/EEG van de Raad van 31 mei 1963 tot opheffing van ieder
    verbod of iedere belemmering van de betaling van de dienstverrichting, wanneer
    de beperkingen van het dienstenverkeer slechts gelegen zijn in de daarmee verband
    houdende betalingen
  type: main
- language: pt
  script: Latn
  content: Directiva 63/340/CEE do Conselho, de 31 de Maio de 1963, que tem por objectivo
    suprimir qualquer probição e qualquer obstáculo ao pagamento de prestações
    de serviços nos casos em que as trocas de serviços apenas estejam limitadas
    por restrições aos pagamentos daí decorrentes
  type: main
- language: es
  script: Latn
  content: Directiva 63/340/CEE del Consejo, de 31 de mayo de 1963, destinada a suprimir
    toda prohibición u obstaculización del pago de las prestaciones cuando los intercambios
    de servicios estén limitados únicamente por restricciones de los pagos correspondientes
  type: main
