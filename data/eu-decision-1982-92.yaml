title:
- language: en
  script: Latn
  content: '82/92/EEC: Commission Decision of 15 January 1982 amending Decision 80/566/EEC
    authorizing certain Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC in respect of oak wood originating in Canada (Only
    the French, Danish, German, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/92/CEE: Décision de la Commission, du 15 janvier 1982, modifiant la
    décision 80/566/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil, pour le bois de
    chêne originaire du Canada (Les textes en langues française, danoise, allemande,
    italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/92/EWG: Entscheidung der Kommission vom 15. Januar 1982 zur Änderung
    der Entscheidung 80/566/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Eichenholz mit Ursprung in Kanada, Ausnahmen von bestimmten Vorschriften der Richtlinie
    77/93/EWG des Rates vorzusehen (Nur der französische, dänische, deutsche, italienische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/92/EØF: Kommissionens beslutning af 15. januar 1982 om ændring af
    beslutning 80/566/EØF om bemyndigelse af visse medlemsstater til at undtage egetræ
    med oprindelse i Canada fra visse bestemmelser i Rådets direktiv 77/93/EØF (Kun
    den franske, danske, tyske, italienske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/92/EOK: Απόφαση τής Επιτροπής τής 15ης Ιανουαρίου
    1982 περί τροποποιήσεως τής αποφάσεως 80/566/EOK
    περί παροχής αδείας σέ ορισμένα Κράτη μέλη
    νά προβλέψουν παρεκκλίσεις από ορισμένες διατάξεις
    τής οδηγίας 77/93/EOK τού Συμβουλίου γιά τό ξύλο
    δρυός καταγωγής Καναδά (Τα κείμενα στην γαλλική,
    δανική, γερμανική, ιταλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/92/CEE: Decisione della Commissione, del 15 gennaio 1982, che modifica
    la decisione 80/566/CEE della Commissione che autorizza taluni Stati membri a
    prevedere deroghe a determinate disposizioni della direttiva 77/93/CEE del Consiglio
    per il legname di quercia originari del Canada (I testi in lingua francese, danese,
    tedesca, italiana e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '82/92/EEG: Beschikking van de Commissie van 15 januari 1982 tot wijziging
    van Beschikking 80/566/EEG houdende machtiging van bepaalde Lid-Staten om afwijkingen
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan voor eikehout
    van oorsprong uit Canada (Slechts de teksten in de Franse, Deense, Duitse, Italiaanse
    en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '82/92/CEE: Decisão da Comissão, de 15 de Janeiro de 1982, que altera
    a Decisão 80/566/CEE que autoriza alguns Estados-membros a prever derrogações
    a determinadas disposições da Directiva 77/93/CEE do Conselho relativa à madeira
    de carvalho originária do Canadá (Apenas fazem fé os textos nas línguas francesa,
    dinamarquesa, alemã, italiana e neerlandesa)'
  type: main
- language: es
