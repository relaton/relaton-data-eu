    miembros a prever excepciones a determinadas disposiciones de la Directiva 77/93/CEE
    del Consejo, para la madera de roble originaria de Canadá (Los textos en lenguas
    francesa, danesa, alemana, italiana y neerlandesa son los únicos auténticos)'
