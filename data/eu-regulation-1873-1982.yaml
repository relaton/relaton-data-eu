  content: Commission Regulation (EEC) No 1873/82 of 13 July 1982 amending Regulation
    (EEC) No 413/76 on the reduction of the time limit during which certain cereal
    products may remain under customs control while awaiting advance payment of refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1873/82 de la Commission, du 13 juillet 1982, modifiant
    le règlement (CEE) n° 413/76 relatif à la réduction des délais durant lesquels
    certains produits céréaliers peuvent demeurer sous les régimes douaniers de
    paiement à l'avance des restitutions
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1873/82 der Kommission vom 13. Juli 1982 zur Änderung
    der Verordnung (EWG) Nr. 413/76 zur Verkürzung der Fristen, in denen bestimmte
    Getreideerzeugnisse unter die Regelung für die Vorauszahlung der Erstattungen
    fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1873/82 af 13. juli 1982 om ændring
    af forordning (EØF) nr. 413/76 om nedsættelse af de frister, inden for hvilke
    visse kornprodukter kan forblive under toldprocedurerne vedrørende forudbetaling
    af restitutioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1873/82 της Επιτροπής
    της 13ης Ιουλίου 1982 περί τροποποίησης του κανονισμού
    (EOK) αριθ. 413/76 όσον αφορά τη μείωση των προθεσμιών
    κατά τη διάρκεια των οποίων ορισμένα προϊόντα
    σιτηρών είναι δυνατόν να παραμείνουν υπό τα
    τελωνειακά καθεστώτα της εκ των προτέρων πληρωμής
    των επιστροφών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1873/82, annettu 13 päivänä heinäkuuta 1982,
