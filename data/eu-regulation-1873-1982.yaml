    voidaan pitää tukien ennakolta maksamista koskevien tullimenettelyjen alaisina,
    annetun asetuksen (ETY) N:o 413/76 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1873/82 della Commissione, del 13 luglio 1982, che
    modifica il regolamento (CEE) n. 413/76 che riduce i periodi durante i quali alcuni
    prodotti cerealicoli possono essere sottoposti ai regimi doganali di pagamento
    anticipato delle restituzioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1873/82 van de Commissie van 13 juli 1982 houdende
    wijziging van Verordening (EEG) nr. 413/76 betreffende de verkorting van de termijnen
    gedurende welke bepaalde graanprodukten onder het stelsel van voorafgaande betaling
    van restituties vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1873/82 da Comissão, de 13 de Julho de 1982, que
    altera o Regulamento (CEE) nº 413/76 relativo à redução dos prazos durante
