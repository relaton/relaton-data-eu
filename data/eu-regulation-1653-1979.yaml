  content: Commission Regulation (EEC) No 1653/79 of 25 July 1979 amending for the
    second time Regulation (EEC) No 2826/77 introducing a Community transit declaration
    form for use in an automatic or electronic data-processing system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1653/79 de la Commission, du 25 juillet 1979, portant
    deuxième modification du règlement (CEE) n° 2826/77 instituant un formulaire
    de déclaration de transit communautaire pouvant être utilisé dans un système
    de traitement automatique ou électronique des informations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1653/79 der Kommission vom 25. Juli 1979 zur zweiten
