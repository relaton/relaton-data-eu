    de declaração de trânsito comunitário susceptível de utilização num sistema
    de tratamento automático ou electrónico das informações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1653/79 de la Comisión, de 25 de julio de 1979, por
    el que se modifica por segunda vez el Reglamento (CEE) n° 2826/77 que establece
    un formulario de declaración de tránsito comunitario que puede utilizarse en
    un sistema de tratamiento automático o electrónico de la información
