    επεξεργασίας πληροφοριών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1653/79 della Commissione, del 25 luglio 1979, recante
    seconda modifica del regolamento (CEE) n. 2826/77, che istituisce un modulo di
    dichiarazione di transito comunitario utilizzabile in un sistema di trattamento
    automatico o elettronico delle informazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1653/79 van de Commissie van 25 juli 1979 houdende
