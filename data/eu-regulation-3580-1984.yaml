title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3580/84 of 19 December 1984 laying down
    rules for calculating withdrawal prices and fixing the withdrawal prices, for
    the 1985 fishing year, for the fishery products listed in Annex I (A) and (D)
    to Regulation (EEC) No 3796/81 and for certain products landed in areas very distant
    from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3580/84 de la Commission du 19 décembre 1984 portant
    modalités de calcul des prix de retrait et fixant les prix de retrait de la campagne
    de pêche 1985 pour les produits de la pêche énumérés à l' annexe I sous
    A et D du règlement (CEE) no 3796/81, ainsi que pour certains produits débarqués
    dans des zones très éloignées des principaux centres de consommation de la
    Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3580/84 der Kommission vom 19. Dezember 1984 zur Berechnung
    der Rücknahmepreise und zur Festsetzung der im Fischwirtschaftsjahr 1985 geltenden
    Rücknahmepreise für die in Anhang I Abschnitte A und D der Verordnung (EWG)
    Nr. 3796/81 aufgeführten Fischereierzeugnisse sowie für bestimmte Erzeugnisse
    aus Anlandegebieten, die von den wichtigsten Verbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3580/84 af 19. december 1984 om beregning
    af tilbagetagelsespriser og fastsættelse af tilbagetagelsespriserne for fangstsæsonen
    1985 for de fiskerivarer, der er anført i afsnit A og D i bilag I til forordning
    (EØF) nr. 3796/81, samt for visse varer, der landes i områder, som ligger meget
    fjernt fra Fællesskabets vigtigste forbrugscentre
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3580/84 της Επιτροπής
    της 19ης Δεκεμβρίου 1984 για τις λεπτομέρειες
    υπολογισμού των τιμών απόσυρσης και για τον
    καθορισμό των τιμών απόσυρσης της αλιευτικής
    περιόδου 1985 για τα προϊόντα αλιείας που απαριθμούνται
