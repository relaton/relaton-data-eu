  script: Latn
  content: Regolamento (CEE) n. 3580/84 della Commissione del 19 dicembre 1984 che
    stabilisce le modalità per il calcolo dei prezzi di ritiro e fissa, per la campagna
    di pesca 1985, i prezzi di ritiro per i prodotti della pesca di cui all' allegato
    I, parti A e D, del regolamento (CEE) n. 3796/81, nonché per taluni prodotti
    sbarcati in zone molto distanti dai principali centri di consumo della Comunità
  type: main
