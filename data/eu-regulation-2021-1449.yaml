  content: Izvedbena uredba Komisije (EU) 2021/1449 z dne 3. septembra 2021 o spremembi
    Izvedbene uredbe (EU) št. 540/2011 glede podaljšanja obdobij odobritve aktivnih
    snovi 2-fenilfenol (vključno s solmi, kot je natrijeva sol), 8-hidroksikinolin,
    amidosulfuron, bifenoks, klormekvat, klorotoluron, klofentezin, klomazon, cipermetrin,
    daminozid, deltametrin, dikamba, difenokonazol, diflufenikan, dimetaklor, etofenproks,
    fenoksaprop-P, fenpropidin, fludioksonil, flufenacet, fostiazat, indoksakarb,
    lenacil, MCPA, MCPB, nikosulfuron, parafinska olja, parafinsko olje, penkonazol,
    propakvizafop, pikloram, prosulfokarb, kvizalofop-P-etil, kvizalofop-P-tefuril,
    žveplo, tetrakonazol, trialat, triflusulfuron in tritosulfuron
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1449 de la Comisión de 3 de septiembre
    de 2021 por el que se modifica el Reglamento de Ejecución (UE) n.o 540/2011 en
    lo que respecta a la prórroga de los períodos de aprobación de las sustancias
    activas 2-fenilfenol (incluidas sus sales, como la sal sódica), 8-hidroxiquinoleína,
    aceite de parafina, aceites de parafina, amidosulfurón, azufre, bifenox, cipermetrina,
    clofentecina, clomazona, clormecuat, clorotolurón, daminozida, deltametrina,
    dicamba, difenoconazol, diflufenicán, dimetaclor, etofenprox, fenoxaprop-P, fenpropidina,
    fludioxonil, flufenacet, fostiazato, indoxacarbo, lenacilo, MCPA, MCPB, nicosulfurón,
    penconazol, picloram, propaquizafop, prosulfocarb, quizalofop-P-etilo, quizalofop-P-tefuril,
    tetraconazol, trialato, triflusulfurón y tritosulfurón
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1449 av den 3 september
    2021 om ändring av genomförandeförordning (EU) nr 540/2011 vad gäller förlängning
    av godkännandeperioderna för de verksamma ämnena 2-fenylfenol (inkl. dess salter,
    t.ex. natriumsalt), 8-hydroxikinolin, amidosulfuron, bifenox, klormekvat, klorotoluron,
    klofentezin, klomazon, cypermetrin, daminozid, deltametrin, dikamba, difenokonazol,
    diflufenikan, dimetaklor, etofenprox, fenoxaprop-P, fenpropidin, fludioxonil,
    flufenacet, fostiazat, indoxakarb, lenacil, MCPA, MCPB, nikosulfuron, paraffinoljor,
    paraffinolja, penkonazol, pikloram, propakizafop, prosulfokarb, kizalofop-P-etyl,
    kizalofop-P-tefuryl, svavel, tetrakonazol, triallat, triflusulfuron och tritosulfuron
  type: main
