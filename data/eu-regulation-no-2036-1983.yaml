title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2036/83 of 22 July 1983 laying down detailed
    rules implementing the system of aid for the use of concentrated grape must for
    the manufacture in the United Kingdom and Ireland of certain products and fixing
    the amounts of aid for the 1983/84 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2036/83 de la Commission du 22 juillet 1983 portant
    modalités d' application du régime d' aide à l' utilisation de moûts de raisins
    concentrés en vue de la fabrication de certains produits au Royaume-Uni et en
    Irlande et fixant les montants de l' aide pour la campagne viticole 1983/1984
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2036/83 der Kommission vom 22. Juli 1983 mit Durchführungsbestimmungen
    zu der Beihilferegelung für die Verwendung von konzentriertem Traubenmost zur
    Herstellung bestimmter Erzeugnisse im Vereinigten Königreich und in Irland sowie
    zur Festsetzung eines Beihilfebetrags für das Weinwirtschaftsjahr 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2036/83 af 22. juli 1983 om gennemførelsesbestemmelser
    for støtteordningen vedrørende anvendelse af koncentreret druemost til fremstilling
    af visse produkter i Det forenede Kongerige og i Irland, samt om fastsættelse
    af støttebeløbene for vinproduktionsåret 1983/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2036/83 της Επιτροπής
    της 22ας Ιουλίου 1983 περί των λεπτομερειών εφαρμογής
    του καθεστώτος ενισχύσεων στη χρησιμοποίηση
    συμπυκνωμένου γλεύκους σταφυλής για την παρασκευή
    ορισμένων προϊόντων στο Ηνωμένο Βασίλειο και
    στην Ιρλανδία, καθώς και περί καθορισμού του
    ποσού ενίσχυσης για την αμπελουργική περίοδο
    1983/84
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2036/83 della Commissione del 22 luglio 1983 che fissa,
    per la campagna viticola 1983/1984, le modalità di applicazione del regime di
    aiuti per l' utilizzazione di mosti di uve concentrati a fini di fabbricazione
    di taluni prodotti nel Regno Unito e in Irlanda, nonché l' importo dell' aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2036/83 van de Commissie van 22 juli 1983 houdende
    vaststelling, voor het wijnoogstjaar 1983/1984, van de uitvoeringsbepalingen van
    de steunregeling voor het gebruik van geconcentreerde druivemost met het oog op
    de vervaardiging van bepaalde produkten in het Verenigd Koninkrijk en Ierland,
    alsmede van de steunbedragen
  type: main
