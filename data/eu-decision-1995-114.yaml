title:
- language: en
  script: Latn
  content: '95/114/EC: Council Decision of 30 March 1995 authorizing the Federal Republic
    of Germany and the Grand Duchy of Luxembourg to apply a measure derogating from
    Article 3 of the Sixth Directive 77/388/EEC on the harmonization of the laws of
    the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '95/114/CE: Décision du Conseil du 30 mars 1995 autorisant la République
    fédérale d''Allemagne et le Grand-Duché de Luxembourg à appliquer une mesure
    dérogatoire à l''article 3 de la sixième directive (77/388/CEE) en matière
    d''harmonisation des législations des États membres relatives aux taxes sur
    le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '95/114/EG: Entscheidung des Rates vom 30. März 1995 zur Ermächtigung
    der Bundesrepublik Deutschland und des Großherzogtums Luxemburg, eine von Artikel
    3 der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften
    der Mitgliedstaaten über die Umsatzsteuern abweichende Sondermaßnahme einzuführen'
  type: main
- language: da
  script: Latn
  content: '95/114/EF: Rådets Beslutning af 30. marts 1995 om tilladelse til Forbundsrepublikken
    Tyskland og Storhertugdømmet Luxembourg til at anvende en undtagelse fra artikel
    3 i Rådets sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes lovgivning
    om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '95/114/ΕΚ: Απόφαση του Συμβουλίου της 30ής
    Μαρτίου 1995 με την οποία επιτρέπεται στην Ομοσπονδιακή
    Δημοκρατία της Γερμανίας και στο Μεγάλο Δουκάτο
    του Λουξεμβούργου να εφαρμόσουν μέτρο κατά
    παρέκκλιση του άρθρου 3 της έκτης οδηγίας (77/388/ΕΟΚ)
    για την εναρμόνιση των νομοθεσιών των κρατών
    μελών των σχετικών με τους φόρους κύκλου εργασιών'
  type: main
- language: fi
  script: Latn
  content: '95/114/EY: Neuvoston päätös, tehty 30 päivänä maaliskuuta 1995,
    luvan antamisesta Saksan liittotasavallalle ja Luxemburgin suurherttuakunnalle
    soveltaa jäsenvaltioiden liikevaihtoverolainsäädännön yhdenmukaistamisesta
    annetun kuudennen neuvoston direktiivin 77/388/ETY 3 artiklasta poikkeavaa toimenpidettä'
  type: main
- language: it
  script: Latn
  content: '95/114/CE: Decisione del Consiglio del 30 marzo 1995 che autorizza la
    Repubblica federale di Germania ed il Granducato di Lussemburgo ad applicare una
    misura di deroga all''articolo 3 della sesta direttiva (77/388/CEE) in materia
    di armonizzazione delle legislazioni degli Stati membri relative alle imposte
    sulla cifra d''affari'
  type: main
- language: nl
  script: Latn
  content: '95/114/EG: Beschikking van de Raad van 30 maart 1995 waarbij de Bondsrepubliek
    Duitsland en het Groothertogdom Luxemburg gemachtigd worden een maatregel toe
    te passen die afwijkt van artikel 3 van Zesde Richtlijn 77/388/EEG betreffende
    de harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '95/114/CE: Decisão do Conselho de 30 de Março de 1995 que autoriza a
    República Federal da Alemanha e o Grão- Ducado do Luxemburgo a aplicarem uma
    medida derrogatória do artigo 3º da Sexta Directiva 77/388/CEE relativa à harmonização
    das legislações dos Estados-membros respeitantes aos impostos sobre o volume
    de negócios'
  type: main
