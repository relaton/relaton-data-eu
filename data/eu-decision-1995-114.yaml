    de armonización de las legislaciones de los Estados miembros relativas a los
    impuestos sobre el volumen de negocios'
  type: main
- language: sv
  script: Latn
  content: '95/114/EG: Rådets beslut av den 30 mars 1995 om att tillåta förbundsrepubliken
