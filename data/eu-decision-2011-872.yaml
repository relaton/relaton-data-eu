    2001/931/WPZiB w sprawie zastosowania szczególnych środków w celu zwalczania
    terroryzmu i uchylenia decyzji 2011/430/WPZiB
  type: main
- language: pt
  script: Latn
  content: Decisão 2011/872/PESC do Conselho, de 22 de Dezembro de 2011 , que actualiza
    a lista de pessoas, grupos e entidades a que se aplicam os artigos 2. °, 3. °e
    4. °da Posição Comum 2001/931/PESC relativa à aplicação de medidas específicas
    de combate ao terrorismo e revoga a Decisão 2011/430/PESC
  type: main
- language: ro
  script: Latn
  content: Decizia 2011/872/PESC a Consiliului din 22 decembrie 2011 de actualizare
    a listei persoanelor, grupurilor și entităților care fac obiectul articolelor
    2, 3 și 4 din Poziția comună 2001/931/PESC privind aplicarea de măsuri specifice
    pentru combaterea terorismului și de abrogare a Deciziei 2011/430/PESC
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2011/872/SZBP z 22. decembra 2011 , ktorým sa aktualizuje
    zoznam osôb, skupín a subjektov, na ktoré sa vzťahujú články 2, 3 a 4 spoločnej
    pozície 2001/931/SZBP o uplatňovaní špecifických opatrení na boj s terorizmom,
    a ktorým sa zrušuje rozhodnutie 2011/430/SZBP
  type: main
