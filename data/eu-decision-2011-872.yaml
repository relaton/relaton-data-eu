title:
- language: en
  script: Latn
  content: Council Decision 2011/872/CFSP of 22 December 2011 updating the list of
    persons, groups and entities subject to Articles 2, 3 and 4 of Common Position
    2001/931/CFSP on the application of specific measures to combat terrorism and
    repealing Decision 2011/430/CFSP
  type: main
- language: fr
  script: Latn
  content: Décision 2011/872/PESC du Conseil du 22 décembre 2011 portant mise à
    jour de la liste des personnes, groupes et entités auxquels s’appliquent les
    articles 2, 3 et 4 de la position commune 2001/931/PESC relative à l’application
    de mesures spécifiques en vue de lutter contre le terrorisme, et abrogeant la
    décision 2011/430/PESC
  type: main
- language: de
  script: Latn
  content: Beschluss 2011/872/GASP des Rates vom 22. Dezember 2011 zur Aktualisierung
    der Liste der Personen, Vereinigungen und Körperschaften, auf die die Artikel
    2, 3 und 4 des Gemeinsamen Standpunkts 2001/931/GASP über die Anwendung besonderer
    Maßnahmen zur Bekämpfung des Terrorismus Anwendung finden, und zur Aufhebung
    des Beschlusses 2011/430/GASP
  type: main
- language: bg
  script: Cyrl
  content: Решение 2011/872/ОВППС на Съвета от 22 декември
    2011 година за актуализиране на списъка на лицата,
    групите и образуванията, по отношение на които
    се прилагат членове 2, 3 и 4 от Обща позиция 2001/931/ОВППС
    за прилагането на специални мерки за борба
    с тероризма и за отмяна на Решение 2011/430/ОВППС
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2011/872/SZBP ze dne 22. prosince 2011 , kterým se aktualizuje
    seznam osob, skupin a subjektů, na něž se vztahují články 2, 3 a 4 společného
    postoje 2001/931/SZBP o uplatnění zvláštních opatření k boji proti terorismu,
    a kterým se zrušuje rozhodnutí 2011/430/SZBP
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2011/872/FUSP af 22. december 2011 om ajourføring af
    listen over personer, grupper og enheder, som er omfattet af artikel 2, 3 og 4
    i fælles holdning 2001/931/FUSP om anvendelse af specifikke foranstaltninger
    til bekæmpelse af terrorisme og om ophævelse af afgørelse 2011/430/FUSP
  type: main
- language: el
  script: Grek
  content: Απόφαση 2011/872/ΚΕΠΠΑ του Συμβουλίου, της
    22ας Δεκεμβρίου 2011 , σχετικά με την ενημέρωση
    του καταλόγου προσώπων, ομάδων και οντοτήτων
    που υπάγονται στα άρθρα 2, 3 και 4 της κοινής
    θέσης 2001/931/ΚΕΠΠΑ, για την εφαρμογή ειδικών
    μέτρων για την καταπολέμηση της τρομοκρατίας,
    και για την κατάργηση της απόφασης 2011/430/ΚΕΠΠΑ
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2011/872/ÜVJP, 22. detsember 2011 , millega ajakohastatakse
    loetelu isikutest, rühmitustest ja üksustest, kelle suhtes kohaldatakse ühise
    seisukoha 2001/931/ÜVJP (terrorismivastaste erimeetmete rakendamise kohta) artikleid
    2, 3 ja 4 ja millega tunnistatakse kehtetuks otsus 2011/430/ÜVJP
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2011/872/YUTP, annettu 22 päivänä joulukuuta 2011
    , niitä henkilöitä, ryhmiä ja yhteisöjä koskevan luettelon saattamisesta
    ajan tasalle, joihin sovelletaan erityistoimenpiteiden toteuttamisesta terrorismin
    torjumiseksi hyväksytyn yhteisen kannan 2001/931/YUTP 2, 3 ja 4 artiklaa sekä
    päätöksen 2011/430/YUTP kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2011/872/KKBP határozata ( 2011. december 22. ) a terrorizmus
    leküzdésére vonatkozó különös intézkedések alkalmazásáról szóló
    2001/931/KKBP közös álláspont 2., 3. és 4. cikkének hatálya alá tartozó
    személyek, csoportok és szervezetek listájának naprakésszé tételéről
    és a 2011/430/KKBP határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2011/872/PESC del Consiglio, del 22 dicembre 2011 , che aggiorna
