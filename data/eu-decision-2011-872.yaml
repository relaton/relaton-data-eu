    2, 3 e 4 della posizione comune 2001/931/PESC relativa all’applicazione di misure
    specifiche per la lotta al terrorismo e che abroga la decisione 2011/430/PESC
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2011/872/KĀDP ( 2011. gada 22. decembris ), ar ko atjaunina
