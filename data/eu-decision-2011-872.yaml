    nostājā 2001/931/KĀDP par konkrētu pasākumu īstenošanu cīņā pret terorismu,
    un atceļ Lēmumu 2011/430/KĀDP
  type: main
- language: lt
  script: Latn
  content: 2011 m. gruodžio 22 d. Tarybos sprendimas 2011/872/BUSP, kuriuo atnaujinamas
    asmenų, grupių ir subjektų, kuriems taikomi Bendrosios pozicijos 2001/931/BUSP
    dėl konkrečių priemonių taikymo kovojant su terorizmu 2, 3 ir 4 straipsniai,
    sąrašas ir panaikinamas Sprendimas 2011/430/BUSP
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2011/872/PESK tat- 22 ta’ Diċembru 2011 li taġġorna
    l-lista ta’ persuni, gruppi u entitajiet soġġetti għall-Artikoli 2, 3 u 4
    tal-Pożizzjoni Komuni 2001/931/PESK dwar l-applikazzjoni ta’ miżuri speċifiċi
    fil-ġlieda kontra t-terroriżmu u li tħassar id-Deċiżjoni 2011/430/PESK
  type: main
- language: nl
  script: Latn
  content: Besluit 2011/872/GBVB van de Raad van 22 december 2011 inzake de actualisering
