  script: Latn
  content: Directive (EU) 2017/1564 of the European Parliament and of the Council
    of 13 September 2017 on certain permitted uses of certain works and other subject
    matter protected by copyright and related rights for the benefit of persons who
    are blind, visually impaired or otherwise print-disabled and amending Directive
    2001/29/EC on the harmonisation of certain aspects of copyright and related rights
    in the information society
  type: main
- language: fr
  script: Latn
  content: Directive (UE) 2017/1564 du Parlement européen et du Conseil du 13 septembre
    2017 sur certaines utilisations autorisées de certaines œuvres et d'autres objets
    protégés par le droit d'auteur et les droits voisins en faveur des aveugles,
    des déficients visuels et des personnes ayant d'autres difficultés de lecture
    des textes imprimés et modifiant la directive 2001/29/CE sur l'harmonisation
    de certains aspects du droit d'auteur et des droits voisins dans la société
    de l'information
  type: main
- language: de
  script: Latn
  content: Richtlinie (EU) 2017/1564 des Europäischen Parlaments und des Rates vom
