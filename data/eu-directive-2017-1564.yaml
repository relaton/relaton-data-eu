    oder durch verwandte Schutzrechte geschützter Werke und sonstiger Schutzgegenstände
    zugunsten blinder, sehbehinderter oder anderweitig lesebehinderter Personen und
    zur Änderung der Richtlinie 2001/29/EG zur Harmonisierung bestimmter Aspekte
    des Urheberrechts und der verwandten Schutzrechte in der Informationsgesellschaft
  type: main
- language: bg
  script: Cyrl
  content: Директива (ЕС) 2017/1564 на Европейския парламент
    и на Съвета от 13 септември 2017 година относно
    определени позволени видове използване на
    определени произведения и други обекти, закриляни
    от авторското право и сродните му права, в полза
