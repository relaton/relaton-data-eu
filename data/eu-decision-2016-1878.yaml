---
id: EUDecision20161878
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/1878 of 21 October 2016 determining
    that the temporary suspension of the preferential customs duty established under
    the stabilisation mechanism for bananas of the Agreement establishing an Association
    between the European Union and its Member States, on the one hand, and Central
    America on the other, is not appropriate for imports of bananas originating in
    Guatemala for the year 2016
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/1878 de la Commission du 21 octobre 2016
    déterminant que la suspension temporaire du droit de douane préférentiel établi
    au titre du mécanisme de stabilisation pour les bananes prévu par l'accord établissant
    une association entre l'Union européenne et ses États membres, d'une part, et
    l'Amérique centrale, d'autre part, n'est pas appropriée dans le cas des importations
    de bananes originaires du Guatemala pour l'année 2016
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/1878 der Kommission vom 21. Oktober 2016
    zur Feststellung, dass die vorübergehende Aussetzung des Präferenzzolls, der
    im Rahmen des Stabilisierungsmechanismus für Bananen des Abkommens zur Gründung
    einer Assoziation zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits
    und Zentralamerika andererseits festgesetzt wurde, für Einfuhren von Bananen
    mit Ursprung in Guatemala für das Jahr 2016 nicht angebracht ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/1878 на Комисията
    от 21 октомври 2016 година за определяне на временното
    спиране на прилагането на преференциалното
    мито, въведено по силата на механизма за стабилизиране
    по отношение на бананите от Споразумението
    за асоцииране между Европейския съюз и неговите
    държави членки, от една страна, и Централна
    Америка, от друга страна, за нецелесъобразно
    по отношение на вноса на банани с произход
    от Гватемала за 2016 година
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/1878 ze dne 21. října 2016,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby podle
    mechanismu stabilizace pro banány Dohody zakládající přidružení mezi Evropskou
    unií a jejími členskými státy na jedné straně a Střední Amerikou na straně
    druhé není pro dovoz banánů pocházejících z Guatemaly pro rok 2016 vhodné
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/1878 af 21. oktober 2016
    om fastsættelse af, at den midlertidige suspension af den præferencetold, som
    er fastsat under stabiliseringsmekanismen for bananer i aftalen om oprettelse
    af en associering mellem Den Europæiske Union og dens medlemsstater på den ene
    side og Mellemamerika på den anden side, ikke er hensigtsmæssig for import af
    bananer med oprindelse i Guatemala for 2016
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/1878 της Επιτροπής,
    της 21ης Οκτωβρίου 2016, με την οποία ορίζεται
    ότι η προσωρινή αναστολή του προτιμησιακού
    δασμού που θεσπίστηκε βάσει του μηχανισμού
    σταθεροποίησης για τις μπανάνες στο πλαίσιο
    της συμφωνίας σύνδεσης μεταξύ της Ευρωπαϊκής
    Ένωσης και των κρατών μελών της, αφενός, και
    της Κεντρικής Αμερικής, αφετέρου, δεν κρίνεται
    σκόπιμη για τις εισαγωγές μπανανών καταγωγής
    Γουατεμάλας για το έτος 2016
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/1878, 21. oktoober 2016, millega määratakse
    kindlaks, et ühelt poolt Euroopa Liidu ja selle liikmesriikide ning teiselt poolt
    Kesk-Ameerika riikide vahelise assotsiatsiooni loomise lepingu banaane käsitlevas
    stabiilsusmehhanismis kehtestatud soodustollimaksu ajutine peatamine ei ole Guatemalast
    pärit banaanide impordi suhtes aastal 2016 asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/1878, annettu 21 päivänä
    lokakuuta 2016, sen määrittämisestä, että Euroopan unionin ja sen jäsenvaltioiden
    sekä Keski-Amerikan välisestä assosiaatiosta tehdyn sopimuksen sisältämän
    banaaneja koskevan vakautusmekanismin mukaisen etuustullin väliaikainen suspendoiminen
    ei ole tarpeen Guatemalasta peräisin olevien banaanien tuonnissa vuonna 2016
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/1878 оd 21. listopada 2016. kojom
    se utvrđuje da privremena obustava povlaštenih carina utvrđenih na temelju
    mehanizma stabilizacije za banane iz Sporazuma o pridruživanju između Europske
    unije i njezinih država članica, s jedne strane, i Središnje Amerike, s druge
    strane, nije primjerena za uvoz banana podrijetlom iz Gvatemale za 2016.
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1878 végrehajtási határozata (2016. október
    21.) a Guatemalából származó banán behozatalára alkalmazott kedvezményes
    vámtételeknek az egyrészről az Európai Unió és tagállamai, másrészről
    Közép-Amerika közötti társulás létrehozásáról szóló megállapodásban
    foglalt banánkereskedelmi stabilizációs mechanizmus keretében történő,
    2016. évi ideiglenes felfüggesztése nem helyénvaló voltának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/1878 della Commissione, del 21 ottobre
    2016, che stabilisce che la sospensione temporanea del dazio doganale preferenziale
    istituito in virtù del meccanismo di stabilizzazione per le banane previsto dall'accordo
    che istituisce un'associazione tra l'Unione europea e i suoi Stati membri, da
    una parte, e l'America centrale, dall'altra, non è appropriata per quanto riguarda
    le importazioni di banane originarie del Guatemala per l'anno 2016
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums 2016/1878 (2016. gada 21. oktobris), ar
    ko nosaka, ka tā atvieglotā muitas nodokļa pagaidu atcelšana, kurš noteikts
    saskaņā ar stabilizācijas mehānismu banāniem Nolīgumā, ar ko izveido asociāciju
    starp Eiropas Savienību un tās dalībvalstīm, no vienas puses, un Centrālameriku,
    no otras puses, attiecībā uz Gvatemalas izcelsmes banānu importu 2016. gadā
    nav atbilstīga
  type: main
- language: lt
  script: Latn
  content: 2016 m. spalio 21 d. Komisijos įgyvendinimo sprendimas (ES) 2016/1878,
    kuriuo nustatoma, kad pagal Susitarimo, kuriuo steigiama Europos Sąjungos bei
    jos valstybių narių ir Centrinės Amerikos asociacija, bananų importo stabilizavimo
    priemonę nustatyto lengvatinio muito laikinas taikymo nutraukimas Gvatemalos
    kilmės importuojamiems bananams 2016 m. yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/1878 tal-21
    ta' Ottubru 2016 li tiddetermina li s-sospensjoni temporanja tad-dazju doganali
    preferenzjali stabbilita taħt il-mekkaniżmu ta' stabbilizzazzjoni għall-banana
    tal-Ftehim ta' Assoċjazzjoni bejn l-Unjoni Ewropea u l-Istati Membri tagħha,
    minn naħa waħda, u l-Amerika Ċentrali, min-naħa l-oħra, mhix xierqa għall-importazzjonijiet
    tal-banana li toriġina mill-Gwatemala għas-sena 2016
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/1878 van de Commissie van 21 oktober 2016
    waarbij wordt bepaald dat de tijdelijke opschorting van het preferentiële douanerecht
    dat is vastgesteld in het kader van het stabilisatiemechanisme voor bananen in
    de Overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese
    Unie en haar lidstaten, enerzijds, en Midden-Amerika, anderzijds, niet passend
    is voor de invoer van bananen van oorsprong uit Guatemala voor het jaar 2016
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/1878 z dnia 21 października 2016
    r. w sprawie ustalenia, że tymczasowe zawieszenie preferencyjnego cła ustanowionego
    w ramach mechanizmu stabilizacyjnego dotyczącego bananów, zawartego w Umowie
    ustanawiającej stowarzyszenie między Unią Europejską i jej państwami członkowskimi,
    z jednej strony, a Ameryką Środkową, z drugiej strony, nie jest odpowiednie
    dla przywozu w 2016 r. bananów pochodzących z Gwatemali
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/1878 da Comissão, de 21 de outubro de
    2016, que determina que a suspensão temporária do direito aduaneiro preferencial
    estabelecido ao abrigo do mecanismo de estabilização para as bananas do Acordo
    que cria uma Associação entre a União Europeia e os seus Estados-Membros, por
    um lado, e a América Central, por outro lado, não é adequada para as importações
    de bananas originárias da Guatemala no ano de 2016
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/1878 a Comisiei din 21 octombrie
    2016 de stabilire a faptului că suspendarea temporară a taxei vamale preferențiale
    instituite în temeiul mecanismului de stabilizare pentru banane prevăzut de
    Acordul de instituire a unei asocieri între Uniunea Europeană și statele membre
    ale acesteia, pe de o parte, și America Centrală, pe de altă parte, nu este
    adecvată pentru importurile de banane originare din Guatemala pentru anul 2016
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/1878 z 21. októbra 2016, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla stanoveného na základe
    stabilizačného mechanizmu pre banány v rámci Dohody, ktorou sa zakladá pridruženie
    medzi Európskou úniou a jej členskými štátmi na jednej strane a Strednou
    Amerikou na strane druhej, nie je vhodné pre dovoz banánov s pôvodom v Guatemale
    za rok 2016
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/1878 z dne 21. oktobra 2016 o ugotovitvi,
    da začasna opustitev preferencialnih carin, vzpostavljenih v okviru stabilizacijskega
    mehanizma za banane iz Sporazuma o pridružitvi med Evropsko unijo in njenimi
    državami članicami na eni strani ter Srednjo Ameriko na drugi strani, za uvoz
    banan s poreklom iz Gvatemale za leto 2016 ni primerna
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/1878 de la Comisión, de 21 de octubre
    de 2016, por la que se determina que la suspensión temporal del arancel aduanero
    preferencial establecido en el marco del mecanismo de estabilización para el
    banano del Acuerdo por el que se establece una asociación entre la Unión Europea
    y sus Estados miembros, por una parte, y Centroamérica, por otra, no es apropiada
    para las importaciones de plátanos (bananas) originarios de Guatemala para el
    año 2016
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/1878 av den 21 oktober 2016
    om fastställande av att det tillfälliga upphävandet av förmånstullarna enligt
    stabiliseringsmekanismen för bananer i avtalet om upprättande av en associering
    mellan Europeiska unionen och dess medlemsstater, å ena sidan, och Centralamerika,
    å andra sidan, inte är lämpligt för import av bananer med ursprung i Guatemala
    under 2016
  type: main
