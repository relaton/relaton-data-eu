title:
- language: en
  script: Latn
  content: '96/169/EC: Commission Decision of 14 February 1996 concerning the dates
    to be fixed by Member States for the submission of ''area aid applications'' under
    the integrated administration and control system for certain Community aid schemes
    (the ''integrated system'') (Only the Danish, German, Greek, English, French,
    Italian, Dutch, Finnish and Swedish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/169/CE: Décision de la Commission, du 14 février 1996, relative aux
    dates à fixer par les États membres pour la présentation des demandes d''aides
    «surfaces» dans le cadre du système intégré de gestion et de contrôle relatif
    à certains régimes d''aides communautaires («système intégré») (Les textes
    en langues danoise, allemande, grecque, anglaise, française, italienne, néerlandaise,
    finnoise et suédoise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '96/169/EG: Entscheidung der Kommission vom 14. Februar 1996 über die
    von den Mitgliedstaaten zu bestimmenden Zeitpunkte für die Stellung der Beihilfeanträge
    "Flächen" im Rahmen des integrierten Verwaltungs- und Kontrollsystems für bestimmte
    gemeinschaftliche Beihilferegelungen ("integriertes System") (Nur der dänische,
    deutsche, griechische, englische, französische, italienische, niederländische,
    finnische und schwedische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/169/EF: Kommissionens beslutning af 14. februar 1996 om de frister,
    som medlemsstaterne skal fastsætte for indgivelse af ansøgninger om arealstøtte
    i forbindelse med det integrerede system for forvaltning og kontrol af visse EF-støtteordninger
    (»det integrerede system«) (Kun de danske, tyske, graeske, engelske, franske,
    italienske, nederlandske, finske og svenske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '96/169/ΕΚ: Απόφαση της Επιτροπής, της 14ης Φεβρουαρίου
    1996, σχετικά με τις ημερομηνίες που πρέπει να
    καθορισθούν από τα κράτη μέλη για την υποβολή
    των αιτήσεων για ενίσχυση «εκτάσεις» στο πλαίσιο
    του ολοκληρωμένου συστήματος διαχείρισης
    και ελέγχου σχετικά με ορισμένα καθεστώτα
    κοινοτικών ενισχύσεων («ολοκληρωμένο σύστημα»)
    (Τα κείμενα στη δανική, γερμανική, ελληνική,
    αγγλική, γαλλική, ιταλική, ολλανδική, φινλανδική
    και σουηδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '96/169/EY: Komission päätös, tehty 14 päivänä helmikuuta 1996, jäsenvaltioiden
    asettamista tiettyjen yhteisön tukiohjelmien integroidun hallinto- ja valvontajärjestelmän
    ("integroidun järjestelmän") nojalla tehtyjen "alue"-tukea koskevien hakemusten
    esittämispäivämääristä (Ainoastaan tanskan-, saksan-, kreikan-, englannin-,
    ranskan-, italian-, hollannin-, suomen- ja ruotsinkieliset tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '96/169/CE: Decisione della Commissione, del 14 febbraio 1996, relativa
    alle date che gli Stati membri devono stabilire per la presentazione delle domande
    di aiuto «superfici» nel quadro del sistema integrato di gestione e di controllo
    di taluni regimi di aiuti comunitari («sistema integrato») (I testi in lingua
