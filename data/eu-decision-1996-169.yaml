  content: '96/169/EG: Beschikking van de Commissie van 14 februari 1996 inzake de
    door de Lid-Staten vast te stellen data voor de indiening van de steunaanvragen
    "oppervlakten" in het kader van het geïntegreerd beheers- en controlesysteem
    voor bepaalde communautaire steunregelingen (geïntegreerd systeem) (Slechts de
