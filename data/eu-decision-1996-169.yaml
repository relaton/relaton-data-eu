  script: Latn
  content: '96/169/EG: Kommissionens beslut av den 14 februari 1996 om de datum som
    skall bestämmas av medlemsstaterna för inlämnandet av ansökningar för arealstöd
    under det integrerade systemet för administration och kontroll av vissa stödsystem
