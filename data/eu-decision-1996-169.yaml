  script: Latn
  content: '96/169/CE: Decisión de la Comisión, de 14 de febrero de 1996, relativa
    a las fechas de presentación de las solicitudes de ayuda «superficies» que
    los Estados miembros deben fijar dentro del sistema integrado de gestión y control
    de determinados regímenes de ayuda comunitarios («sistema integrado») (Los
