title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 91/2013 of 31 January 2013 laying
    down specific conditions applicable to the import of groundnuts from Ghana and
    India, okra and curry leaves from India and watermelon seeds from Nigeria and
    amending Regulations (EC) No 669/2009 and (EC) No 1152/2009
  type: main
- language: fr
  script: Latn
