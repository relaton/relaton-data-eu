id: EURegulation24421972
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2442/72 of the Council of 21 November 1972 postponing,
    for the new Member States, the application of Regulation (EEC) No 516/72 on the
    introduction of common rules for shuttle services by coach and bus between Member
    States and of Regulation (EEC) No 517/72 on the introduction of common rules for
    regular and special regular services by coach and bus between Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2442/72 du Conseil, du 21 novembre 1972, différant,
    pour les nouveaux États membres, l' application du règlement (CEE) n° 516/72
    relatif à l' établissement de règles communes pour les services de navette
    effectués par autocars et par autobus entre les États membres et du règlement
    (CEE) n° 517/72 relatif à l' établissement de règles communes pour les services
    réguliers et les services réguliers spécialisés effectués par autocars et
    par autobus entre les États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2442/72 des Rates vom 21. November 1972 zur Hinausschiebung
    des Zeitpunkts, in dem die Verordnung (EWG) Nr. 516/72 über die Einführung gemeinsamer
    Regeln für den Pendelverkehr mit Kraftomnibussen zwischen den Mitgliedstaaten
    und die Verordnung (EWG) Nr. 517/72 über die Einführung gemeinsamer Regeln für
    den Linienverkehr und Sonderformen des Linienverkehrs mit Kraftomnibussen zwischen
    den Mitgliedstaaten in den neuen Mitgliedstaaten angewendet werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2442/72 af 21. november 1972 om udsættelse
    for de nye medlemsstater af anvendelsen af forordningerne (EØF) nr. 516/72 om
    indførelse af fælles regler for pendulkørsel med omnibusser mellem medlemsstaterne
    og (EØF) nr. 517/72 om indførelse af fælles regler for rutekørsel og særlige
    former for rutekørsel med omnibusser mellem medlemsstaterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2442/72 τού Συμβουλίου
    τής 21ης Νοεμβρίου 1972 περί αναστολής, γιά τά
    νέα Κράτη μέλη, τής εφαρμογής τού κανονισμού
    (ΕΟΚ) αριθ. 516/72 «περί θεσπίσεως κοινών κανόνων
    γιά τίς γραμμές τύπου σαΐτας μέ πούλμαν καί
    λεωφορεία μεταξύ τών Κρατών μελών» καί τού
    κανονισμού (ΕΟΚ) αριθ. 517/72 «περί θεσπίσεως κοινών
    κανόνων γιά τίς τακτικές καί τίς ειδικές τακτικές
    γραμμές μέ πούλμαν καί λεωφορεία μεταξύ τών
    Κρατών μελών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2442/72 del Consiglio, del 21 novembre 1972, che differisce,
    per i nuovi Stati membri, l' applicazione dei regolamenti (CEE) n. 516/72, relativo
    alla fissazione di norme comuni per i servizi a navetta effettuati con autobus
    tra gli Stati membri, e (CEE) n. 517/72, relativo alla fissazione di norme comuni
    per i servizi regolari specializzati effettuati con autobus tra gli Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2442/72 van de Raad van 21 november 1972 waarbij
    de toepassing van Verordening (EEG) nr. 516/72 betreffende de vaststelling van
    gemeenschappelijke regels voor pendelvervoer met autobussen (autocars) tussen
    de Lid-Staten en Verordening (EEG) nr. 517/72 betreffende de vaststelling van
    gemeenschappelijke regels voor het geregeld vervoer en bijzondere vormen van geregeld
    vervoer met autobussen tussen de Lid-Staten voor de nieuwe Lid-Staten wordt uitgesteld
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2442/72 do Conselho, de 21 de Novembro de 1972,
    que adia, para os novos Estados-membros, a aplicação do Regulamento (CEE) n.°
    516/72, relativo à introdução de regras comuns para os serviços de vaivém
    efectuados em autocarro entre os Estados-membros, e do Regulamento (CEE) n.°
    517/72, relativo à introdução de regras comuns para os serviços regulares
    e serviços regulares especializados efectuados em autocarro entre os Estados-membros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2442/72 del Consejo, de 21 de noviembre de 1972, por
    el que se aplaza, para los nuevos Estados miembros, la aplicación del Reglamento
    (CEE) n° 516/72 relativo al establecimiento de normas comunes para los servicios
    de lanzadera efectuados con autocares y autobuses entre los Estados miembros,
    y del Reglamento (CEE) n° 517/72 relativo al establecimiento de normas comunes
    para los servicios regulares y servicios regulares especializados efectuados con
    autocares y autobuses entre los Estados miembros
  type: main
