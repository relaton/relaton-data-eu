title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1975/87 of 2 July 1987 fixing, for the 1987
    harvest, the norm and intervention prices and the premiums granted to purchasers
    of leaf tobacco, the reference qualities and the production areas and amending
    Regulation (EEC) No 1577/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1975/87 du Conseil du 2 juillet 1987 fixant, pour
