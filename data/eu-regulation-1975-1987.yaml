    Prämien sowie der abgeleiteten Interventionspreise für Tabakballen, der Bezugsqualitäten
    und der Anbaugebiete für die Ernte 1987 und zur Änderung der Verordnung (EWG)
    Nr. 1577/86 #'
  type: main
