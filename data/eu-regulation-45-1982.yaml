title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 45/82 of 8 January 1982 amending Regulation
    (EEC) No 2729/81 in respect of the period to be observed in cases of advance fixing
    of the refund under an invitation to tender in a non-member country in the milk
    and milk products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 45/82 de la Commission, du 8 janvier 1982, modifiant
    le règlement (CEE) n° 2729/81 en ce qui concerne le délai à respecter en cas
    de fixation à l' avance de la restitution dans le cadre d' une adjudication dans
    un pays tiers, dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 45/82 der Kommission vom 8. Januar 1982 zur Änderung
    der Verordnung (EWG) Nr. 2729/81 hinsichtlich der vorgeschriebenen Frist bei Vorausfestsetzung
    der Erstattung im Rahmen einer Ausschreibung für Milch und Milcherzeugnisse in
    einem Drittland
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 45/82 af 8. januar 1982 om ændring
    af forordning (EØF) nr. 2729/81 for så vidt angår den frist, der skal overholdes
    ved forudfastsættelse af restitution i forbindelse med en licitation i et tredjeland
    vedrørende mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 45/82 τής Επιτροπής τής
    8ης Ιανουαρίου 1982 περί τροποποιήσεως τού κανονισμού
    (EOK) αριθ. 2729/81 περί τής τηρήσεως τής προθεσμίας
    σέ περίπτωση καθορισμού εκ τών προτέρων τής
    επιστροφής, στό πλαίσιο διαγωνισμού σέ τρίτη
    χώρα, στόν τομέα τού γάλακτος καί τών γαλακτοκομικών
    προϊόντων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 45/82 della Commissione, dell' 8 gennaio 1982, che
    modifica il regolamento (CEE) n. 2729/81 per quanto riguarda il termine da rispettare
    in caso di fissazione anticipata della restituzione nell' ambito di una gara in
    un paese terzo nel settore del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 45/82 van de Commissie van 8 januari 1982 tot wijziging
    van Verordening (EEG) nr. 2729/81 voor wat de termijn betreft die in acht moet
    worden genomen in geval van vaststelling vooraf van de restitutie in het kader
    van een inschrijving in een derde land in de sector melk en zuivelprodukten
