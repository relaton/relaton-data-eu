    παραγωγής του μη εκκοκκισμένου βάμβακος της
    περιόδου 1984/85 καθώς και του ποσοστού της ενισχύσεως
    που καταβάλλουν τα κράτη μέλη για την περίοδο
    1985/86
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2429/85 della Commissione del 28 agosto 1985 che fissa
    la produzione effettiva di cotone non sgranato della campagna 1984/1985 nonché
    la percentuale dell' aiuto che gli stati membri versano a titolo della campagna
    1985/1986
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2429/85 van de Commissie van 28 augustus 1985 tot
    bepaling van de feitelijke produktie van niet-geëgreneerde katoen voor het verkoopseizoen
    1984/1985 alsmede van het steunpercentage dat de Lid-Staten voor het verkoopseizoen
    1985/1986 uitkeren
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2429/85 da Comissão, de 28 de Agosto de 1985, que
    estabelece a produção efectiva do algodão não descaroçado da campanha de
    1984/1985 bem como a percentagem da ajuda a pagar pelos Estados-membros para a
    campanha de 1985/1986
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2429/85 de la Comisión, de 28 de agosto de 1985,
