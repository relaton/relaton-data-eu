title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2429/85 of 28 August 1985 determining the
    actual production of unginned cotton for the 1984/85 marketing year and fixing
    the percentage of the aid to be paid by Member States for the 1985/86 marketing
    year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2429/85 de la Commission du 28 août 1985 établissant
    la production effective de coton non égrené de la campagne 1984/1985 ainsi que
    le pourcentage de l' aide que les États membres versent au titre de la campagne
    1985/1986
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2429/85 der Kommission vom 28. August 1985 zur Festlegung
    der tatsächlichen Erzeugung von nicht entkörnter Baumwolle im Wirtschaftsjahr
    1984/85 sowie des Prozentsatzes der von den Mitgliedstaaten für das Wirtschaftsjahr
    1985/86 zu zahlenden Beihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2429/85 af 28. august 1985 om fastsættelse
    af den faktiske produktion af ikke-egreneret bomuld i produktionsåret 1984/85
    samt den procentdel af støtten, som medlemsstaterne skal udbetale for produktionsåret
    1985/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2429/85 της Επιτροπής
