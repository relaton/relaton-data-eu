id: EUDecision1980145
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/145/EEC: Commission Decision of 18 January 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to drawn or blown glass, falling within heading No
    ex 70.05 of the Common Customs Tariff, originating in the USSR and in free circulation
    in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/145/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le verre étiré ou soufflé dit "verre
    à vitres" de la position ex 70.05 du tarif douanier commun, originaire de l''Union
    soviétique et mis en libre pratique dans les autres États membres (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/145/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus der UdSSR stammendes und in den anderen Mitgliedstaaten
    im freien Verkehr befindliches gezogenes oder geblasenes Flachglas, sogenanntes
    ,,Tafelglas'''', der Tarifstelle ex 70.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/145/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage planglas, trukket eller blæst, som
    henhører under pos. ex 70.05 i den fælles toldtarif, har oprindelse i USSR og
    frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/145/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario il vetro tirato o soffiato, detto "vetro
    per vetrate", della voce ex 70.05 della tariffa doganale comune, originario dell''URSS
    e messo in libera pratica negli altri Stati membri (Il testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/145/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd getrokken of geblazen glas (z.g. vensterglas) van post ex 70.05
    van het gemeenschappelijk douanetarief, van oorsprong uit de Sowjetunie en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
