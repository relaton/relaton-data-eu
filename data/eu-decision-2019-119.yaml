    de gelijkwaardigheid van pootaardappelen uit derde landen mogen verlengen (Kennisgeving
    geschied onder nummer C(2019) 247)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/119 z dnia 24 stycznia 2019 r. zmieniająca
    dyrektywę Rady 2002/56/WE w odniesieniu do terminu wyznaczonego w art. 21 ust.
    3, przed upływem którego państwa członkowskie są upoważnione do przedłużenia
    okresu ważności decyzji w sprawie równoważności sadzeniaków pochodzących
    z państw trzecich (notyfikowana jako dokument nr C(2019) 247)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/119 da Comissão, de 24 de janeiro de
    2019, que altera a Diretiva 2002/56/CE do Conselho no que respeita à data estabelecida
    no artigo 21.°, n.° 3, até à qual os Estados-Membros são autorizados a prorrogar
    a eficácia das decisões relativas à equivalência de batatas de semente provenientes
    de países terceiros [notificada com o número C(2019) 247]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/119 a Comisiei din 24 ianuarie
    2019 de modificare a Directivei 2002/56/CE a Consiliului în ceea ce privește
    data prevăzută la articolul 21 alineatul (3) până la care statele membre sunt
    autorizate să prelungească perioada de valabilitate a deciziilor referitoare
    la echivalența cartofilor de sămânță proveniți din țări terțe [notificată
    cu numărul C(2019) 247]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/119 z 24. januára 2019, ktorým
    sa mení smernica Rady 2002/56/ES, pokiaľ ide o dátum stanovený v článku
    21 ods. 3, do ktorého majú členské štáty povolenie predlžovať platnosť
    rozhodnutí týkajúcich sa rovnocennosti sadiva zemiakov [oznámené pod číslom
    C(2019) 247]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/119 z dne 24. januarja 2019 o spremembi
    Direktive Sveta 2002/56/ES glede datuma, določenega v členu 21(3), do katerega
    se državam članicam dovoli podaljšanje veljavnosti odločitev v zvezi z enakovrednostjo
    semenskega krompirja iz tretjih držav (notificirano pod dokumentarno številko
    C(2019) 247)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/119 de la Comisión, de 24 de enero de
    2019, por la que se modifica la Directiva 2002/56/CE del Consejo en lo que concierne
    a la fecha establecida en su artículo 21, apartado 3, hasta la cual se autoriza
    a los Estados miembros a prorrogar la validez de las decisiones relativas a la
    equivalencia de las patatas de siembra procedentes de terceros países [notificada
    con el número C(2019) 247]
  type: main
