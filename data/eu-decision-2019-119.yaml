    3, do kterého jsou členské státy zmocněny prodloužit dobu platnosti rozhodnutí
    o rovnocennosti sadby brambor ze třetích zemí (oznámeno pod číslem C(2019)
    247)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/119 af 24. januar 2019
    om ændring af Rådets direktiv 2002/56/EF for så vidt angår datoen i artikel
    21, stk. 3, indtil hvilken medlemsstaterne har bemyndigelse til at forlænge gyldigheden
    af beslutninger om ligestilling af læggekartofler fra tredjelande (meddelt under
    nummer C(2019) 247)
  type: main
- language: el
