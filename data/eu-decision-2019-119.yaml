    tekintetében történő módosításáról (az értesítés a C(2019) 247. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/119 della Commissione, del 24 gennaio
    2019, che modifica la direttiva 2002/56/CE del Consiglio per quanto riguarda la
    data fissata nell'articolo 21, paragrafo 3, fino alla quale gli Stati membri sono
    autorizzati a prorogare la validità delle decisioni sull'equivalenza dei tuberi-seme
    di patate provenienti da paesi terzi [notificata con il numero C(2019) 247]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/119 (2019. gada 24. janvāris),
    ar ko Padomes Direktīvu 2002/56/EK groza attiecībā uz 21. panta 3. punktā
    noteikto datumu, līdz kuram dalībvalstis ir pilnvarotas pagarināt spēkā esības
    termiņu lēmumiem par trešo valstu izcelsmes sēklas kartupeļu līdzvērtību
    (izziņots ar dokumenta numuru C(2019) 247)
  type: main
- language: lt
  script: Latn
  content: 2019 m. sausio 24 d. Komisijos įgyvendinimo sprendimas (ES) 2019/119,
