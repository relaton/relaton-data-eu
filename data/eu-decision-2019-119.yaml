title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/119 of 24 January 2019 amending
    Council Directive 2002/56/EC as regards the date laid down in Article 21(3) until
    which Member States are authorised to extend the validity of decisions concerning
    equivalence of seed potatoes from third countries (notified under document C(2019)
    247)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/119 de la Commission du 24 janvier 2019
    modifiant la directive 2002/56/CE du Conseil en ce qui concerne la date fixée
    à l'article 21, paragraphe 3, jusqu'à laquelle les États membres sont autorisés
    à prolonger la durée de validité des décisions relatives à l'équivalence
    de plants de pommes de terre provenant de pays tiers [notifiée sous le numéro
    C(2019) 247]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/119 der Kommission vom 24. Januar 2019
    zur Änderung der Richtlinie 2002/56/EG des Rates hinsichtlich des Datums gemäß
    Artikel 21 Absatz 3, bis zu dem die Mitgliedstaaten die Gültigkeitsdauer der
    Beschlüsse über die Gleichwertigkeit von Pflanzkartoffeln aus Drittländern
    verlängern dürfen (Bekannt gegeben unter Aktenzeichen C(2019) 247)
  type: main
- language: bg
  script: Cyrl
