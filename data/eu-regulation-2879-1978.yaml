  content: Commission Regulation (EEC) No 2879/78 of 6 December 1978 fixing the prices
    to be used for calculating the value of agricultural products in intervention
    storage on 31 December 1978 to be carried forward to the 1979 financial year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2879/78 de la Commission, du 6 décembre 1978, fixant
    les prix à retenir pour le calcul de la valeur des produits agricoles en stock
    d' intervention au 31 décembre 1978 et à reporter à l' exercice 1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2879/78 der Kommission vom 6. Dezember 1978 zur Festsetzung
    der Preise, die für die Berechnung des Wertes der am 31. Dezember 1978 bei der
    Intervention eingelagerten und auf das Haushaltsjahr 1979 zu übertragenden Agrarerzeugnisse
    zu berücksichtigen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2879/78 af 6. december 1978 om fastsættelse
    af de priser, der skal anvendes ved beregning af værdien af de landbrugsprodukter,
    som interventionsorganerne ligger inde med pr. 31. december 1978, og som skal
    overføres til regnskabsåret 1979
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2879/78 della Commissione, del 6 dicembre 1978, che
    fissa i prezzi da prendere in considerazione per calcolare il valore dei prodotti
    agricoli giacenti all' intervento al 31 dicembre 1978 e da riportare all' esercizio
    1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2879/78 van de Commissie van 6 december 1978 tot
    vaststelling van de prijzen die in aanmerking moeten worden genomen voor de berekening
    van de waarde van de landbouwprodukten die op 31 december 1978 bij de interventiebureaus
    in voorraad zijn en moeten worden overgeboekt naar het begrotingsjaar 1979
