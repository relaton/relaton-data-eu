  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/678, 1. aprill 2025, millega muudetakse
    rakendusmääruse (EL) 2021/404 V ja XIV lisa seoses Kanadat, Ühendkuningriiki
    ja Ameerika Ühendriike käsitlevate kannetega selliste kolmandate riikide, territooriumide
    või nende tsoonide loeteludes, millest on lubatud liitu tuua kodulindude ja kodulindude
    paljundusmaterjali ning kodulindude ja uluklindude värske liha saadetisi, ning
    millega parandatakse kõnealuseid lisasid seoses teatavate Ühendkuningriiki käsitlevate
    kannetega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/678, annettu 1 päivänä
    huhtikuuta 2025, täytäntöönpanoasetuksen (EU) 2021/404 liitteiden V ja XIV
    muuttamisesta siltä osin kuin on kyse Kanadaa, Yhdistynyttä kuningaskuntaa ja
    Yhdysvaltoja koskevista kohdista sellaisten kolmansien maiden, alueiden tai niiden
    vyöhykkeiden luetteloissa, joista siipikarjan, siipikarjan sukusolujen ja alkioiden
    sekä siipikarjasta ja riistalinnuista saatavan tuoreen lihan lähetysten saapuminen
    unioniin on sallittua, sekä mainittujen liitteiden oikaisemisesta Yhdistynyttä
    kuningaskuntaa koskevien tiettyjen kohtien osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/678 ón gCoimisiún an 1 Aibreán
    2025 lena leasaítear Iarscríbhinní V agus XIV a ghabhann le Rialachán Cur
    Chun Feidhme (AE) 2021/404 a mhéid a bhaineann leis na hiontrálacha a bhaineann
    le Ceanada, leis an Ríocht Aontaithe agus leis na Stáit Aontaithe ar na liostaí
    de thríú tíortha, de chríocha nó de chriosanna de thríú tír nó de chríoch
    atá údaraithe maidir le coinsíneachtaí d’éanlaith chlóis agus de tháirgí
    geirmeacha ó éanlaith chlóis, agus d’fheoil úr ó éanlaith chlóis agus
    ó éin ghéim a theacht isteach san Aontas agus lena gceartaítear na hIarscríbhinní
    sin a mhéid a bhaineann leis na hiontrálacha a bhaineann leis an Ríocht Aontaithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/678 оd 1. travnja 2025. o izmjeni
    priloga V. i XIV. Provedbenoj uredbi (EU) 2021/404 u pogledu unosa za Kanadu,
    Ujedinjenu Kraljevinu i Sjedinjene Američke Države na popisima trećih zemalja,
    područja ili njihovih zona iz kojih je odobren ulazak u Uniju pošiljaka peradi,
    zametnih proizvoda peradi te svježeg mesa peradi i pernate divljači i ispravku
    tih priloga u pogledu određenih unosa za Ujedinjenu Kraljevinu
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/678 végrehajtási rendelete (2025. április 1.)
    az (EU) 2021/404 végrehajtási rendelet V. és XIV. mellékletének a baromfit,
    baromfi-szaporítóanyagokat, valamint baromfi és szárnyas vadak friss húsát
    tartalmazó szállítmányok Unióba történő beléptetésére engedéllyel
    rendelkező harmadik országok, területek vagy azok körzetei jegyzékében a
    Kanadára, az Egyesült Királyságra és az Egyesült Államokra vonatkozóan
    szereplő bejegyzések tekintetében történő módosításáról, valamint az
    említett mellékleteknek egyes, az Egyesült Királyságra vonatkozóan szereplő
    bejegyzések tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/678 della Commissione, del 1o aprile
    2025, che modifica gli allegati V e XIV del regolamento di esecuzione (UE) 2021/404
    per quanto riguarda le voci relative al Canada, al Regno Unito e agli Stati Uniti
    negli elenchi di paesi terzi, territori o loro zone da cui è autorizzato l’ingresso
    nell’Unione di partite di pollame e materiale germinale di pollame e di carni
    fresche di pollame e selvaggina da penna e che rettifica tali allegati per quanto
    riguarda alcune voci relative al Regno Unito
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/678 (2025. gada 1. aprīlis),
    ar ko attiecībā uz ierakstiem par Kanādu, Apvienoto Karalisti un Amerikas Savienotajām
    Valstīm tādu trešo valstu, teritoriju vai to zonu sarakstos, no kurām Savienībā
    atļauts ievest mājputnu un mājputnu reproduktīvo produktu un svaigas mājputnu
    un medījamo putnu gaļas sūtījumus, groza un attiecībā uz dažiem ierakstiem
    par Apvienoto Karalisti labo Īstenošanas regulas (ES) 2021/404 V un XIV pielikumu
  type: main
- language: lt
  script: Latn
  content: 2025 m. balandžio 1 d. Komisijos įgyvendinimo reglamentas (ES) 2025/678,
