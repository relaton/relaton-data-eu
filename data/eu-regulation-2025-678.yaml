    птици и прясно месо от домашни птици и пернат
    дивеч, и за поправка на посочените приложения
    по отношение на някои вписвания за Обединеното
    кралство
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/678 ze dne 1. dubna 2025, kterým
    se mění přílohy V a XIV prováděcího nařízení (EU) 2021/404, pokud jde
    o položky pro Kanadu, Spojené království a Spojené státy americké v seznamech
    třetích zemí, území nebo jejich oblastí, z nichž je povolen vstup zásilek
    drůbeže a zárodečných produktů drůbeže a čerstvého masa drůbeže a
    pernaté zvěře do Unie, a kterým se uvedené přílohy opravují, pokud jde
    o některé položky pro Spojené království
  type: main
