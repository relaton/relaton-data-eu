title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/678 of 1 April 2025 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada, the United Kingdom, and the United States in the lists of third countries,
    territories or zones thereof authorised for the entry into the Union of consignments
    of poultry and germinal products of poultry, and of fresh meat of poultry and
    game birds and correcting those Annexes as regards certain entries for the United
    Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/678 de la Commission du 1er avril 2025
    modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404 en ce
    qui concerne les mentions relatives au Canada, au Royaume-Uni et aux États-Unis
    dans les listes de pays tiers, de territoires ou de parties de territoires en
    provenance desquels l’entrée dans l’Union d’envois de volailles et de produits
    germinaux de volailles, ainsi que de viandes fraîches de volailles et de gibier
    à plumes est autorisée et rectifiant ces annexes en ce qui concerne certaines
    mentions pour le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/678 der Kommission vom 1. April 2025
    zur Änderung der Anhänge V und XIV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Einträge für Kanada, das Vereinigte Königreich und die Vereinigten
    Staaten in den Listen der Drittländer, Gebiete oder Zonen derselben, aus denen
    der Eingang in die Union von Sendungen von Geflügel und Zuchtmaterial von Geflügel
    sowie von frischem Fleisch von Geflügel und Federwild zulässig ist, und zur
    Berichtigung der genannten Anhänge hinsichtlich bestimmter Einträge für das
    Vereinigte Königreich
  type: main
- language: bg
  script: Cyrl
