    įrašų trečiųjų šalių, jų teritorijų arba zonų, iš kurių į Sąjungą
    leidžiama įvežti naminių paukščių, naminių paukščių genetinės medžiagos
    produktų ir naminių paukščių bei medžiojamųjų paukščių šviežios mėsos
    siuntas, sąrašuose iš dalies keičiami Įgyvendinimo reglamento (ES) 2021/404
    V ir XIV priedai ir dėl Jungtinei Karalystei skirtų tam tikrų įrašų ištaisomi
    tie priedai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/678 tal-1 ta’
    April 2025 li jemenda l-Annessi V u XIV tar-Regolament ta’ Implimentazzjoni
    (UE) 2021/404 fir-rigward tal-entrati għall-Kanada, għar-Renju Unit u għall-Istati
    Uniti fil-listi ta’ pajjiżi terzi, territorji jew żoni tagħhom awtorizzati
    għad-dħul fl-Unjoni ta’ konsenji tal-pollam u tal-prodotti ġerminali tal-pollam,
    u tal-laħam frisk tal-pollam u tal-għasafar tal-kaċċa, u li jikkoreġi dawn
    l-Annessi fir-rigward ta’ ċerti entrati għar-Renju Unit
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/678 van de Commissie van 1 april 2025
    tot wijziging van de bijlagen V en XIV bij Uitvoeringsverordening (EU) 2021/404
    wat betreft de vermeldingen voor Canada, het Verenigd Koninkrijk en de Verenigde
    Staten in de lijsten van derde landen, gebieden of zones daarvan waaruit de binnenkomst
    in de Unie van zendingen pluimvee en levende producten van pluimvee en van zendingen
    vers vlees van pluimvee en vederwild is toegestaan en tot rectificatie van die
    bijlagen wat bepaalde vermeldingen voor het Verenigd Koninkrijk betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/678 z dnia 1 kwietnia 2025
    r. w sprawie zmiany załączników V i XIV do rozporządzenia wykonawczego (UE)
    2021/404 w odniesieniu do pozycji dotyczących Kanady, Zjednoczonego Królestwa
    i Stanów Zjednoczonych w wykazach państw trzecich, terytoriów lub ich stref,
    z których dozwolone jest wprowadzanie do Unii przesyłek drobiu, materiału biologicznego
    drobiu oraz świeżego mięsa drobiu i ptaków łownych, oraz w sprawie sprostowania
    tychże załączników w odniesieniu do niektórych pozycji dotyczących Zjednoczonego
    Królestwa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/678 da Comissão, de 1 de abril de
    2025, que altera os anexos V e XIV do Regulamento de Execução (UE) 2021/404
    no que diz respeito às entradas relativas ao Canadá, aos Estados Unidos e ao
    Reino Unido nas listas de países terceiros, territórios ou respetivas zonas
    autorizados para a entrada na União de remessas de aves de capoeira e produtos
    germinais de aves de capoeira e carne fresca de aves de capoeira e aves de caça,
    e que retifica esses anexos no que diz respeito a determinadas entradas relativas
    ao Reino Unido
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/678 al Comisiei din 1 aprilie
    2025 de modificare a anexelor V și XIV la Regulamentul de punere în aplicare
    (UE) 2021/404 în ceea ce privește rubricile referitoare la Canada, Regatul Unit
    și Statele Unite din listele conținând țările terțe, teritoriile terțe
    sau zonele din acestea autorizate pentru introducerea în Uniune a transporturilor
    de păsări de curte, de materiale germinative provenite de la păsări de curte
    și de carne proaspătă provenită de la păsări de curte și de la vânat cu
    pene și de rectificare anexelor respective în ceea ce privește anumite rubrici
    referitoare la Regatul Unit
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/678 z 1. apríla 2025, ktorým
    sa menia prílohy V a XIV k vykonávaciemu nariadeniu (EÚ) 2021/404, pokiaľ
    ide o zápisy týkajúce sa Kanady, Spojeného kráľovstva a Spojených štátov
    amerických v zoznamoch tretích krajín, území alebo ich pásiem, z ktorých
    je povolený vstup zásielok hydiny, zárodočných produktov hydiny a čerstvého
    mäsa z hydiny a pernatej zveri do Únie, a ktorým sa opravujú uvedené prílohy,
    pokiaľ ide o určité zápisy týkajúce sa Spojeného kráľovstva
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/678 z dne 1. aprila 2025 o spremembi
    prilog V in XIV k Izvedbeni uredbi (EU) 2021/404 glede vnosov za Kanado, Združeno
    kraljestvo in Združene države Amerike na seznamih tretjih držav, njihovih ozemelj
    ali območij, iz katerih je dovoljen vstop pošiljk perutnine, zarodnega materiala
    perutnine ter svežega mesa perutnine in pernate divjadi v Unijo ter o popravku
    navedenih prilog glede nekaterih vnosov za Združeno kraljestvo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/678 de la Comisión, de 1 de abril de
    2025, por el que se modifican los anexos V y XIV del Reglamento de Ejecución
    (UE) 2021/404 en lo que concierne a las entradas correspondientes a Canadá, al
    Reino Unido y a los Estados Unidos en las listas de terceros países, territorios
    o zonas de estos desde los que se autoriza la entrada en la Unión de partidas
    de aves de corral, productos reproductivos de aves de corral y carne fresca de
    aves de corral y de aves de caza y por el que se corrigen dichos anexos en lo
    que concierne a ciertas entradas correspondientes al Reino Unido
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/678 av den 1 april 2025
    om ändring av bilagorna V och XIV till genomförandeförordning (EU) 2021/404
    vad gäller posterna för Förenade kungariket, Förenta staterna och Kanada i
    förteckningarna över tredjeländer, territorier eller zoner däri från vilka
    sändningar av fjäderfä, avelsmaterial från fjäderfä samt färskt kött från
    fjäderfä och fjädervilt får föras in till unionen och om rättelse av de
    bilagorna vad gäller vissa poster för Förenade kungariket
