id: EUDecision1980380
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/380/EEC: Commission Decision of 14 March 1980 authorizing Ireland not
    to apply Community treatment to jerseys, pullovers, slipovers, waistcoats, twinsets,
    cardigans, bedjackets and jumpers, falling within subheading ex 60.05 A I of the
    Common Customs Tariff (category 5), originating in Peru and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/380/CEE: Décision de la Commission, du 14 mars 1980, autorisant l''Irlande
    à exclure du traitement communautaire les chandails, "pullovers", "twinsets",
    gilets et vestes de la sous-position ex 60.05 A I du tarif douanier commun (catégorie
    5), originaires du Pérou et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/380/EWG: Entscheidung der Kommission vom 14. März 1980, mit der Irland
    ermächtigt wird, aus Peru stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Pullover, Slipover, Twinsets, Westen und Strickjacken der
    Tarifstelle ex 60.05 A I des Gemeinsamen Zolltarifs (Kategorie 5) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/380/EØF: Kommissionens beslutning af 14. marts 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere,
    cardigans, cardigansæt, jumpere, trøjer og veste, som henhører under pos. ex
    60.05 A I i den fælles toldtarif (kategori 5), har oprindelse i Peru og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/380/CEE: Decisione della Commissione, del 14 marzo 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le maglie, pullover, con e
    senza maniche, slip-over, twinset, giubbetti e giacche, della sottovoce ex 60.05
    A I della tariffa doganale comune (categoria 5), originari del Perù e messi in
    libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/380/EEG: Beschikking van de Commissie van 14 maart 1980 waarbij Ierland
    wordt gemachtigd truien, jumpers, pullovers, slipovers, twinsets, vesten en jasjes
    van post ex 60.05 A I van het gemeenschappelijk douanetarief (categorie 5), van
    oorsprong uit Peru en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
