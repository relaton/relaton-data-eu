  script: Latn
  content: Règlement n 126/66/CEE de la Commission, du 12 septembre 1966, fixant
    la qualité minimale à laquelle le blé tendre et le seigle doivent répondre
    pour être considérés comme propres à la consommation humaine
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 126/66/EWG der Kommission vom 12. September 1966 zur Festsetzung
    der Mindestqualität, der Weichweizen und Roggen entsprechen müssen, um als für
    Ernährungszwecke geeignet zu gelten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 126/66/CEE della Commissione, del 12 settembre 1966, che
    fissa la qualità minima cui devono corrispondere il grano tenero e la segala
    per essere considerati come adatti al consumo umano
  type: main
- language: nl
  script: Latn
  content: Verordening no. 126/66/EEG van de Commissie van 12 september 1966 houdende
    vaststelling van de minimumkwaliteit waaraan zachte tarwe en rogge moeten voldoen
    om geschikt te worden geacht voor menselijke consumptie
