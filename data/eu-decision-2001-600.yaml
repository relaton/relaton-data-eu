---
id: EUDecision2001600
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2001/600/EC: Commission Decision of 17 July 2001 concerning protective
    measures with regard to imports of certain animals from Bulgaria due to an outbreak
    of bluetongue, repealing Decision 1999/542/EC, amending Decision 98/372/EC concerning
    the animal health conditions and veterinary certifications for import of live
    animals of bovine and swine species from certain European countries to take into
    account some aspects in relation with Bulgaria and amending Decision 97/232/EC
    drawing up lists of third countries from which Member States authorise imports
    of sheep and goats (Text with EEA relevance) (notified under document number C(2001)
    1930)'
  type: main
- language: fr
  script: Latn
  content: '2001/600/CE: Décision de la Commission du 17 juillet 2001 relative à
    des mesures de protection concernant les importations de certains animaux en provenance
    de Bulgarie en raison de foyers de fièvre catarrhale du mouton, abrogeant la
    décision 1999/542/CE, modifiant la décision 98/372/CE concernant les conditions
    de police sanitaire et les certificats sanitaires requis à l''importation d''animaux
    vivants des espèces bovine et porcine en provenance de certains pays européens,
    afin de prendre en compte certains aspects liés à la Bulgarie et modifiant la
    décision 97/232/CE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent les importations d''ovins et de caprins (Texte présentant
    de l''intérêt pour l''EEE) [notifiée sous le numéro C(2001) 1930]'
  type: main
- language: de
  script: Latn
  content: '2001/600/EG: Entscheidung der Kommission vom 17. Juli 2001 zur Aufhebung
    der Entscheidung 1999/542/EG über Schutzmaßnahmen in Bezug auf die Einfuhr bestimmter
    Tiere aus Bulgarien angesichts von Ausbrüchen der Blauzungenkrankheit, zur Änderung
    der Entscheidung 98/372/EG zur Festlegung der Veterinärbedingungen und Veterinärbescheinigungen
    für die Einfuhr von lebenden Rindern und Schweinen aus bestimmten europäischen
    Ländern in Bezug auf Bulgarien und zur Änderung der Entscheidung 97/232/EG zur
    Änderung der Liste der Drittländer, aus denen die Mitgliedstaaten die Einfuhr
    von Schafen und Ziegen zulassen (Text von Bedeutung für den EWR) (Bekannt gegeben
    unter Aktenzeichen K(2001) 1930)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 17. července 2001 o ochranných opatřeních,
    která se v důsledku vzplanutí katarální horečky ovcí týkají dovozu některých
    zvířat z Bulharska, o zrušení rozhodnutí 1999/542/ES, změně rozhodnutí
    98/372/ES o veterinárních podmínkách a veterinárních osvědčeních pro
    dovoz živého skotu a prasat z některých evropských zemí za účelem zohlednění
    některých hledisek týkajících se Bulharska a o změně rozhodnutí 97/232/ES,
    kterým se stanoví seznam třetích zemí, z nichž členské státy povolují
    dovoz ovcí a koz (oznámeno pod číslem K(2001) 1930)
  type: main
- language: da
  script: Latn
  content: '2001/600/EF: Kommissionens beslutning af 17. juli 2001 om beskyttelsesforanstaltninger
    over for indførsel af visse dyr fra Bulgarien på grund af udbrud af bluetongue
    og om ophævelse af beslutning 1999/542/EF, om ændring af beslutning 98/372/EF
    om dyresundhedsbetingelser og udstedelse af sundhedscertifikat ved indførsel
    af kvæg og svin fra visse europæiske lande for at tage hensyn til visse aspekter
    hvad angår Bulgarien og om ændring af beslutning 97/232/EF om ændring af listen
    over tredjelande, hvorfra medlemsstaterne tillader indførsel af får og geder
    (EØS-relevant tekst) (meddelt under nummer K(2001) 1930)'
  type: main
- language: el
  script: Grek
  content: '2001/600/ΕΚ: Απόφαση της Επιτροπής, της 17ης
    Ιουλίου 2001, σχετικά με προστατευτικά μέτρα
    όσον αφορά τις εισαγωγές ορισμένων ζώων από
    τη Βουλγαρία λόγω κρουσμάτων καταρροϊκού-πυρετού
    του προβάτου, για την ﾺατάργηση της απόφασης
    99/542/ΕΚ, την τροποποίηση της απόφασης 98/372/ΕΚ
    σχετικά με τους υγειονομικούς όρους και την
    κτηνιατρική πιστοποίηση για τις εισαγωγές
    ζώντων βοοειδών και χοιροειδών από ορισμένες
    ευρωπαϊκές χώρες, προκειμένου να ληφθούν υπόψη
    ορισμένα θέματα που αφορούν τη Βουλγαρία και
    την τροποποίηση της απόφασης 97/232/ΕΚ για την
    κατάρτιση του καταλόγου τρίτων χωρών από τις
    οποίες τα κράτη μέλη επιτρέπουν να εισάγονται
    αιγοπρόβατα (Κείμενο που παρουσιάζει ενδιαφέρον
    για τον ΕΟΧ) [κοινοποιηθείσα υπό τον αριθμό
    Ε(2001) 1930]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 17. juuli 2001, mis käsitleb lammaste katarraalsest palavikust
    tingitud kaitsemeetmeid teatavate loomade importimisel Bulgaariast, millega tunnistatakse
    kehtetuks otsus 1999/542/EÜ ja muudetakse selleks et võtta seoses Bulgaariaga
    arvesse teatavaid aspekte, otsust 98/372/EÜ, mis käsitleb loomatervishoiunõuded
    ja veterinaarsertifikaate elusveiste ja elussigade impordil teatavatest Euroopa
    riikidest, ning muudetakse otsust 97/232/EÜ, millega koostatakse nende kolmandate
    riikide loetelud, millest liikmesriigid lubavad lammaste ja kitsede importi (teatavaks
    tehtud numbri K(2001) 1930 all)
  type: main
- language: fi
  script: Latn
  content: '2001/600/EY: Komission päätös, tehty 17 päivänä heinäkuuta 2001,
    Bulgariasta peräisin olevien tiettyjen eläinten tuontia koskevista suojatoimenpiteistä
    bluetongue-tautitapausten vuoksi tehdyn päätöksen 1999/542/EY kumoamisesta,
    eläinten terveyttä koskevista vaatimuksista ja eläinlääkärintodistuksista
    elävien naudan- ja siansukuisten eläinten tuonnissa eräistä Euroopan maista
    tehdyn päätöksen 98/372/EY muuttamisesta eräiden Bulgariaa koskevien seikkojen
    huomioon ottamiseksi ja kolmansia maita, joista jäsenvaltiot sallivat lampaiden
    ja vuohien tuonnin, koskevan luettelon muuttamisesta tehdyn päätöksen 97/232/EY
    muuttamisesta (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla
    K(2001) 1930)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2001. július 17.) az egyes állatok Bulgáriából
    történő behozatalára vonatkozó, a kéknyelv betegség megjelenésére tekintettel
    megállapított védőintézkedésekről, az 1999/542/EK határozat hatályon
    kívül helyezéséről, továbbá az élő szarvasmarha- és sertésfélék egyes
    európai országokból történő behozatalára vonatkozó állat-egészségügyi
    feltételekről és a szükséges állatorvosi bizonyítványokról szóló 98/372/EK
    határozatnak néhány, Bulgáriával kapcsolatos szempont figyelembevétele céljából
    történő módosításáról, valamint a tagállamok által juh- és kecskefélék
    behozatalára feljogosított harmadik országok jegyzékeinek megállapításáról
    szóló 97/232/EK határozat módosításáról (az értesítés a C(2001) 1930.
    számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2001/600/CE: Decisione della Commissione, del 17 luglio 2001, recante
    misure di protezione applicabili alle importazioni di taluni animali provenienti
    dalla Bulgaria in seguito a un focolaio di febbre catarrale degli ovini, recante
    abrogazione della decisione 1999/542/CE, recante modifica della decisione 98/372/CE
    relativa alle condizioni di polizia sanitaria e alla certificazione veterinaria
    cui è subordinata l''importazione di animali vivi delle specie bovina e suina
    provenienti da alcuni paesi europei, in considerazione di alcuni aspetti riguardanti
    la Bulgaria e recante modifica della decisione 97/232/CE che modifica l''elenco
    dei paesi terzi dai quali gli Stati membri autorizzano le importazioni di ovini
    e caprini (Testo rilevante ai fini del SEE) [notificata con il numero C(2001)
    1930]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 17. jūlijs) par aizsardzības pasākumiem
    attiecībā uz noteiktu dzīvnieku ievedumiem no Bulgārijas infekciozā katarālā
    drudža uzliesmojuma dēļ, par Lēmuma 1999/542/EK atcelšanu, par grozījumiem
    Lēmumā 98/372/EK par dzīvnieku veselības nosacījumiem un veterināro sertifikāciju
    attiecībā uz dzīvu liellopu un cūku sugu dzīvnieku ievedumu no konkrētām
    Eiropas valstīm, ņemot vērā dažus aspektus saistībā ar Bulgāriju, un par
    grozījumiem Lēmumā 97/232/EK, ar ko izveido to trešo valstu sarakstu, no kurām
    dalībvalstis atļauj ievest aitas un kazas (izziņots ar dokumenta Nr. C (2001)
    1930)
  type: main
- language: lt
  script: Latn
  content: 2001 m. liepos 17 d. Komisijos sprendimas dėl apsaugos priemonių importuojant
    tam tikrus gyvūnus iš Bulgarijos, taikytinų dėl mėlynojo liežuvio ligos
    protrūkio, panaikinantis Sprendimą 1999/542/EB, iš dalies pakeičiantis Sprendimą
    98/372/EB dėl gyvūnų sveikatos reikalavimų ir iš tam tikrų Europos valstybių
    importuojamų gyvų galvijų ir kiaulių veterinarinio sertifikavimo, siekiant
    atsižvelgti į tam tikrus su Bulgarija susijusius aspektus, ir iš dalies pakeičiantis
    Sprendimą 97/232/EB, pateikiantį trečiųjų šalių, iš kurių valstybės
    narės leidžia importuoti avis ir ožkas, sąrašus (pranešta dokumentu Nr.
    C(2001) 1930)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-17 ta’ Lulju 2001 li tikkonċerna
    miżuri protettivi fir-rigward ta’ importazzjonijiet ta’ ċerti annimali mill-Bulgarija
    minħabba tfaqqiegħa ta’ bluetongue, li tħassar id-Deċiżjoni 1999/542/KE,
    li temenda d-Deċiżjoni 98/372/KE dwar il-kondizzjonijiet tas-saħħa ta’ l-annimali
    u ċ-ċertifikazzjonijiet veterinarji għall-importazzjoni ta’ annimali ħajjin
    ta’ l-ispeċi bovini u tal-majjali minn ċerti pajjiżi Ewropej biex jingħata
    kont ta’ xi aspetti dwar il-Bulgarija u li temenda d-Deċiżjoni 97/232/KE li
    tħejji listi ta’ pajjiżi terzi li minnhom l-Istati Membri jawtorizzaw importazzjonijiet
    ta’ ngħaġ u mogħoż (notifikat taħt in-numru tad-dokument C(2001) 1930)
  type: main
- language: nl
  script: Latn
  content: '2001/600/EG: Beschikking van de Commissie van 17 juli 2001 houdende vaststelling
    van beschermende maatregelen ten aanzien van de invoer van bepaalde dieren uit
    Bulgarĳe in verband met een uitbraak van bluetongue, houdende intrekking van
    Beschikking 1999/542/EG, houdende wĳziging van Beschikking 98/372/EG betreffende
    veterinairrechtelĳke voorschriften en de voorschriften inzake veterinaire certificering
    voor de invoer van levende runderen en varkens uit bepaalde Europese landen teneinde
    rekening te houden met sommige aspecten betreffende Bulgarĳe, en houdende wĳziging
    van Beschikking 97/232/EG tot vaststelling van de lĳst van derde landen waaruit
    de lidstaten de invoer van schapen en geiten toestaan (Voor de EER relevante tekst)
    (kennisgeving geschied onder nummer C(2001) 1930)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 17 lipca 2001 r. dotycząca środków ochronnych
    w odniesieniu do przywozu niektórych zwierząt z Bułgarii z uwagi na ogniska
    choroby niebieskiego języka, uchylająca decyzję 1999/542/WE, zmieniająca decyzję
    98/372/WE dotyczącą warunków zdrowotnych zwierząt i świadectw weterynaryjnych
    na przywóz żywych zwierząt z gatunków bydła i trzody chlewnej z niektórych
    państw Europy, w odniesieniu do Bułgarii, oraz zmieniająca decyzję 97/232/WE
    ustalającą wykaz państw trzecich, z których Państwa Członkowskie dopuszczają
    przywóz owiec i kóz (notyfikowana jako dokument nr C(2001) 1930)
  type: main
- language: pt
  script: Latn
  content: '2001/600/CE: Decisão da Comissão, de 17 de Julho de 2001, relativa a
    medidas de protecção aplicáveis às importações de determinados animais da
    Bulgária em virtude de um surto de febre catarral ovina e que revoga a Decisão
    1999/542/CE e altera a Decisão 98/372/CE relativa às condições sanitárias
    e à certificação veterinária exigidas para a importação de bovinos e suínos
    domésticos provenientes de determinados países europeus, de modo a atender a
    determinados aspectos respeitantes à Bulgária, e a Decisão 97/232/CE que altera
    a lista de países terceiros dos quais os Estados-Membros autorizam a importação
    de ovinos e de caprinos (Texto relevante para efeitos do EEE) [notificada com
    o número C(2001) 1930]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 17. júla 2001 o ochranných opatreniach, ktoré
    sa v dôsledku ohniska zhubnej katarálnej horúčky oviec týkajú dovozu určitých
    zvierat z Bulharska, ktorým sa ruší rozhodnutie 1999/542/ES, mení a dopĺňa
    rozhodnutie 98/372/ES o veterinárnych podmienkach a veterinárnych osvedčeniach
    pre dovoz živého hovädzieho dobytka a ošípaných z určitých európskych
    štátov s cieľom zohľadniť určité hľadiská týkajúce sa Bulharska a ktorým
    sa mení a dopĺňa rozhodnutie 97/232/ES o stanovení zoznamu tretích štátov,
    z ktorých členské štáty povoľujú dovoz oviec a kôz (oznámené pod číslom
    dokumentu C(2001) 1930)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 17. julija 2001 o zaščitnih ukrepih glede uvoza
    nekaterih živali iz Bolgarije zaradi izbruha bolezni modrikastega jezika, ki
    razveljavlja Odločbo 1999/542/ES, ki spreminja Odločbo 98/372/ES o zdravstvenem
    stanju živali in veterinarskem certificiranju za uvoz živega goveda in prašičev
    iz nekaterih evropskih držav, da bi upoštevali nekatere vidike v zvezi z Bolgarijo,
    ter spreminja Odločbo 97/232/ES o izdelavi seznamov tretjih držav, iz katerih
    države članice dovolijo uvoz ovc in koz (notificirano pod dokumentarno številko
    K(2001) 1930)
  type: main
- language: es
  script: Latn
  content: '2001/600/CE: Decisión de la Comisión, de 17 de julio de 2001, por la
    que se establecen medidas de protección con respecto a las importaciones de determinados
    animales procedentes de Bulgaria debido a un brote de fiebre catarral ovina y
    se deroga la Decisión 1999/542/CE, por la que se modifica la Decisión 98/372/CE
    referente a las condiciones y los certificados zoosanitarios para la importación
    de animales vivos de las especies bovina y porcina procedentes de determinados
    países europeos, atendiendo a determinados aspectos relacionados con Bulgaria
    y por la que se modifica la Decisión 97/232/CE por la que se modifica la lista
    de los terceros países de los que los Estados miembros autorizan la importación
    de ovinos y caprinos (Texto pertinente a efectos del EEE) [notificada con el número
    C(2001) 1930]'
  type: main
- language: sv
  script: Latn
  content: '2001/600/EG: Kommissionens beslut av den 17 juli 2001 om skyddsåtgärder
    vad avser import av vissa djur från Bulgarien med anledning av att bluetongue
    brutit ut och om upphävande av beslut 1999/542/EG om ändring av beslut 98/372/EG
    om djurhälsovillkor och utfärdande av veterinärintyg för import av levande
    nötkreatur och svin från vissa europeiska länder, för att beakta vissa aspekter
    i förhållande till Bulgarien och om ändring av beslut 97/232/EG om att upprätta
    en förteckning över de tredje länder från vilka medlemsstaterna får importera
    får och getter (Text av betydelse för EES) [delgivet med nr K(2001) 1930]'
  type: main
