title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 juillet 1969, relative à l'autorisation
    d'une mesure tarifaire intérieure spéciale de la SNCF applicable à des transports
    de combustibles minéraux solides en provenance des mines de charbon des Cévennes
    à destination de Sète
  type: main
- language: de
  script: Latn
  content: '69/274/EGKS: Entscheidung der Kommission vom 28. Juli 1969 über die Genehmigung
    eines Ausnahmetarifs der Société Nationale des Chemins de fer français (SNCF)
    im Binnenverkehr für Transporte von festen Brennstoffen aus Kohlengruben in den
    Cevennen nach Sète'
  type: main
- language: it
  script: Latn
  content: '69/274/CECA: Decisione della Commissione, del 28 luglio 1969, che autorizza
    una tariffa interna speciale della Société nationale des chemins de fer français
    applicabile a trasporti di combustibili minerali solidi provenienti dalle miniere
    di carbone delle Cevenne a destinazione di Sète'
  type: main
- language: nl
  script: Latn
  content: '69/274/EGKS: Beschikking van de Commissie van 28 juli 1969 houdende goedkeuring
    van een bijzonder binnenlands tarief van de Société nationale des chemins de
    fer français (S.N.C.F.) voor het vervoer van vaste minerale brandstoffen vanaf
    de steenkolenmijnen van het bekken Cévennes naar Sète'
