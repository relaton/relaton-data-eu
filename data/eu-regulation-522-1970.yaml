title:
- language: en
  script: Latn
  content: Regulation (EEC) No 522/70 of the Council of 17 March 1970 on the treatment
    to be accorded to products processed from cereals and rice originating in the
    Associated African States and Madagascar or in the Overseas Countries and Territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 522/70 du Conseil, du 17 mars 1970, relatif au régime
    applicable aux produits transformés à base de céréales et de riz, originaires
    des États africains et malgache associés ou des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 522/70 des Rates vom 17. März 1970 über die Regelung
    für Getreide- und Reisverarbeitungserzeugnisse mit Ursprung in den assoziierten
    afrikanischen Staaten und Madagaskar oder den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 522/70 af 17. marts 1970 om den ordning,
    der finder anvendelse på varer forarbejdet på basis af korn og ris med oprindelse
    i de associerede afrikanske stater og Madagascar eller i de oversøiske lande
    og territorier
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 522/70 del Consiglio, del 17 marzo 1970, relativo
    al regime applicabile ai prodotti trasformati a base di cereali e di riso originari
    degli Stati africani e malgascio associati o dei paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 522/70 van de Raad van 17 maart 1970 betreffende
    de regeling voor verwerkte produkten op basis van granen en rijst van oorsprong
    uit de geassocieerde Afrikaanse Staten en Madagaskar of uit de landen en gebieden
    overzee
