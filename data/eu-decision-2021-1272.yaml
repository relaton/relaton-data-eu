  script: Latn
  content: Commission Implementing Decision (EU) 2021/1272 of 30 July 2021 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by the Vatican City State to the certificates
    issued in accordance with Regulation (EU) 2021/953 of the European Parliament
    and of the Council
