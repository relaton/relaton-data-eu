title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1404/90 of 23 May 1990 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    to fruit and vegetables as regards tomatoes, lettuce, broad-leaf endives, carrots,
    artichokes, melons, apricots, peaches and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1404/90 de la Commission du 23 mai 1990 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges dans le secteur des fruits et légumes en ce qui concerne les tomates,
    les laitues, les chicorées scaroles, les carottes, les artichauts, les melons,
    les abricots, les pêches et les fraises
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1404/90 DER KOMMISSION vom 23. Mai 1990 zur Festsetzung
    zusaetzlicher Bestimmungen zur Anwendung des ergaenzenden Handelsmechanismus im
    Sektor Obst und Gemuese hinsichtlich Tomaten, Salat, Endivie Eskariol, Karotten,
    Artischocken, Melonen, Aprikosen, Pfirsichen und Erdbeeren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1404/90 af 23. maj 1990 om visse supplerende
    bestemmelser for anvendelsen af den supplerende mekanisme for samhandelen i sektoren
    for frugt og grønsager, for så vidt angår tomater, salat, bredbladet endivie,
    gulerødder, artiskokker, meloner, abrikoser, ferskner og jordbær
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1404/90 της Επιτροπής
    της 23ης Μαΐου 1990 περί καθορισμού ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών όσον αφορά
    τις τομάτες, τα μαρούλια, τις σκαρόλες, τα καρότα,
    τις αγκινάρες, τα πεπόνια, τα βερύκοκα, τα ροδάκινα
    και τις φράουλες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1404/90 DELLA COMMISSIONE del 23 maggio 1990 recante
    fissazione di modalità complementari di applicazione del meccanismo complementare
    applicabile agli scambi nel settore degli ortofrutticoli per quanto riguarda i
    pomodori, le lattughe, le cicorie scarole, le carote, i carciofi, i meloni, le
    albicocche, le pesche e le fragole
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1404/90 VAN DE COMMISSIE van 23 mei 1990 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer in de sector groenten en fruit, ten aanzien van tomaten, sla,
    andijvie, wortelen, artisjokken, meloenen, abrikozen, perziken en aardbeien
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1404/90 DA COMISSAO de 23 de Maio de 1990 que fixa
    determinadas regras complementares para a execuçao do mecanismo complementar
    aplicavel às trocas comerciais no sector das frutas e produtos horticolas, no
    que se refere aos tomates, alfaces, chicorias escarolas, cenouras, alcachofras,
    meloes, damascos, pêssegos e morangos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1404/90 DE LA COMISION de 23 de mayo de 1990 por el
    que se establecen determinadas disposiciones adicionales de aplicacion del mecanismo
    complementario aplicable a los intercambios en el sector de las frutas y hortalizas
    en lo que se refiere a los tomates, las lechugas, las escarolas de hoja lisa,
    las zanahorias, las alcachofas, los melones, los albaricoques, los melocotones
