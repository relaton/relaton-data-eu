title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1948/76 of 5 August 1976 on the supply of
    a first lot of skimmed-milk powder to the Italian intervention agency for use
    in accordance with Regulation (EEC) No 563/76, and amending Regulation (EEC) No
    789/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1948/76 de la Commission, du 5 août 1976, relatif
    à la mise à disposition de l' organisme d' intervention italien d' une première
    tranche de lait écrémé en poudre destiné à être utilisé conformément au
    règlement (CEE) n° 563/76 et modifiant le règlement (CEE) n° 789/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1948/76 der Kommission vom 5. August 1976 über die
    Versorgung der italienischen Interventionsstelle mit einer ersten Tranche Magermilchpulver,
    das zur Verwendung gemäß der Verordnung (EWG) Nr. 563/76 bestimmt ist, und zur
    Änderung der Verordnung (EWG) Nr. 789/76
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1948/76 af 5. august 1976 om det italienske
    interventionsorgans forsyning med skummetmælkspulver, som skal anvendes i overensstemmelse
    med forordning (EØF) nr. 563/76, og om ændring af forordning (EØF) nr. 789/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1948/76 della Commissione, del 5 agosto 1976, che
    pone a disposizione dell' organismo d' intervento italiano un primo quantitativo
    di latte scremato in polvere destinato ad essere utilizzato conformemente al regolamento
    (CEE) n. 563/76 e modifica il regolamento (CEE) n. 789/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1948/76 van de Commissie van 5 augustus 1976 inzake
    de terbeschikkingstelling aan het Italiaanse interventiebureau van een eerste
    gedeelte van het magere-melkpoeder bestemd om te worden gebruikt overeenkomstig
    Verordening (EEG) nr. 563/76, tevens houdende wijziging van Verordening (EEG)
    nr. 789/76
