  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1394 of 13 August 2015 amending
    Regulation (EU) No 470/2014, as amended by Regulation (EU) 2015/588, imposing
    a definitive anti-dumping duty and collecting definitively the provisional duty
    imposed on imports of solar glass originating in the People's Republic of China
    following an absorption reinvestigation pursuant to Article 12 of Council Regulation
    (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
