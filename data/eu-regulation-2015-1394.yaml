    modifiant le règlement (UE) n° 470/2014, tel que modifié par le règlement
    d'exécution (UE) 2015/588, instituant un droit antidumping définitif et portant
    perception définitive du droit provisoire institué sur les importations de vitrage
    solaire originaire de la République populaire de Chine à la suite d'une nouvelle
    enquête au titre de la prise en charge des mesures menée conformément à l'article
    12 du règlement (CE) n° 1225/2009 du Conseil
  type: main
