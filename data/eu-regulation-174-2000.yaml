  content: Council Regulation (EC) No 174/2000 of 24 January 2000 repealing Council
    Regulation (EEC) No 3433/91 insofar as it imposes a definitive anti-dumping duty
    on imports of gas-fuelled, non-refillable pocket flint lighters originating in
    Japan
  type: main
- language: fr
  script: Latn
