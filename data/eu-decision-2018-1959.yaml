title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1959 of 10 December 2018 derogating
    from Council Directive 2000/29/EC as regards measures to prevent the introduction
    into and the spread within the Union of the harmful organism Agrilus planipennis
    (Fairmaire) through wood originating in Canada and in the United States of America
    (notified under document C(2018) 8235)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1959 de la Commission du 10 décembre
    2018 dérogeant à la directive 2000/29/CE du Conseil en ce qui concerne les mesures
    destinées à prévenir l'introduction et la propagation dans l'Union de l'organisme
    nuisible Agrilus planipennis (Fairmaire) par l'intermédiaire de bois originaire
    du Canada et des États-Unis d'Amérique [notifiée sous le numéro C(2018) 8235]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1959 der Kommission vom 10. Dezember
    2018 betreffend eine Abweichung von der Richtlinie 2000/29/EG des Rates hinsichtlich
    Maßnahmen zum Schutz der Union gegen die Einschleppung und Ausbreitung des Schadorganismus
    Agrilus planipennis (Fairmaire) durch Holz mit Ursprung in Kanada und den Vereinigten
    Staaten von Amerika (Bekannt gegeben unter Aktenzeichen C(2018) 8235)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/1959 на Комисията
    от 10 декември 2018 година за предвиждане на дерогации
    от разпоредбите на Директива 2000/29/ЕО на Съвета
    по отношение на мерките за предотвратяване
    на въвеждането и разпространението в Съюза
    на вредителя Agrilus planipennis (Fairmaire) с дървен материал
    с произход от Канада и Съединените американски
    щати (нотифицирано под номер C(2018) 8235)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/1959 ze dne 10. prosince 2018,
    kterým se stanoví odchylka od směrnice Rady 2000/29/ES, pokud jde o opatření
    proti zavlékání škodlivého organismu Agrilus planipennis (Fairmaire) do Unie
    a jeho rozšiřování na území Unie prostřednictvím dřeva pocházejícího
    z Kanady a ze Spojených států amerických (oznámeno pod číslem C(2018) 8235)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/1959 af 10. december
    2018 om en undtagelse fra Rådets direktiv 2000/29/EF for så vidt angår foranstaltninger
    for at forhindre indslæbning og spredning i Unionen af skadegøreren Agrilus
    planipennis Fairmaire gennem træ med oprindelse i Canada og USA (meddelt under
    nummer C(2018) 8235)
  type: main
- language: el
  script: Grek
  content: Eκτελεστική απόφαση (ΕΕ) 2018/1959 της Επιτροπής,
    της 10ης Δεκεμβρίου 2018, για τη θέσπιση παρέκκλισης
    από την οδηγία 2000/29/ΕΚ του Συμβουλίου όσον αφορά
    τα μέτρα για την πρόληψη της εισαγωγής και
    της εξάπλωσης του επιβλαβούς οργανισμού Agrilus
    planipennis (Fairmaire) στην Ένωση μέσω της ξυλείας καταγωγής
    Καναδά και Ηνωμένων Πολιτειών της Αμερικής
    [κοινοποιηθείσα υπό τον αριθμό C(2018) 8235]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/1959, 10. detsember 2018, millega tehakse
    erand nõukogu direktiivist 2000/29/EÜ seoses meetmetega, mis võimaldavad hoida
    ära Kanadast ja USAst pärit puiduga kahjuliku organismi Agrilus planipennis
    Fairmaire liitu sissetoomise ja seal levimise (teatavaks tehtud numbri C(2018)
    8235 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/1959, annettu 10 päivänä
    joulukuuta 2018, neuvoston direktiivistä 2000/29/EY poikkeamisesta siltä osin
    kuin on kyse toimenpiteistä, joilla estetään haitallisen organismin Agrilus
    planipennis (Fairmaire) kulkeutuminen unioniin Kanadasta ja Amerikan yhdysvalloista
    peräisin olevan puutavaran välityksellä ja leviäminen unionissa (tiedoksiannettu
    numerolla C(2018) 8235)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/1959 оd 10. prosinca 2018. o odstupanju
    od Direktive Vijeća 2000/29/EZ u pogledu mjera za sprečavanje unošenja u Uniju
    štetnog organizma Agrilus planipennis (Fairmaire) i njegova širenja unutar Unije
    putem drva podrijetlom iz Kanade i Sjedinjenih Američkih Država (priopćeno
    pod brojem dokumenta C(2018) 8235)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/1959 végrehajtási határozata (2018. december
    10.) az Agrilus planipennis (Fairmaire) károsító Kanadából vagy Amerikai
    Egyesült Államokból származó faanyagon keresztül az Unióba történő behurcolásának
    és az Unión belüli elterjedésének megakadályozása érdekében hozott intézkedések
    tekintetében a 2000/29/EK tanácsi irányelvtől való eltérésről (az értesítés
    a C(2018) 8235. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/1959 della Commissione, del 10 dicembre
    2018, recante deroga alla direttiva 2000/29/CE del Consiglio relativa alle misure
    per impedire l'introduzione e la diffusione nell'Unione dell'organismo nocivo
    Agrilus planipennis (Fairmaire) tramite legname originario del Canada e degli
    Stati Uniti d'America [notificata con il numero C(2018) 8235]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/1959 (2018. gada 10. decembris),
    ar ko attiecībā uz pasākumiem, kas veicami, lai novērstu kaitīgā organisma
    Agrilus planipennis (Fairmaire) ievešanu un izplatīšanos Savienībā caur koksni,
    kuras izcelsme ir Kanādā un Amerikas Savienotajās Valstīs, atkāpjas no Padomes
    Direktīvas 2000/29/EK (izziņots ar dokumenta numuru C(2018) 8235)
  type: main
- language: lt
  script: Latn
  content: 2018 m. gruodžio 10 d. Komisijos įgyvendinimo sprendimas (ES) 2018/1959,
