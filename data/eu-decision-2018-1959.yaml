    kuriomis siekiama neleisti per Kanados ir Jungtinių Amerikos Valstijų kilmės
    medieną į Sąjungą patekti ir joje išplisti kenksmingiesiems organizmams Agrilus
    planipennis (Fairmaire) (pranešta dokumentu Nr. C(2018) 8235)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/1959 tal-10
