    tal-miżuri għall-prevenzjoni tal-introduzzjoni fl-Unjoni u t-tixrid fiha tal-organiżmu
    ta' ħsara Agrilus planipennis (Fairmaire) permezz tal-injam li joriġina mill-Kanada
    u mill-Istati Uniti tal-Amerka (notifikata bid-dokument C(2018) 8235)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/1959 van de Commissie van 10 december 2018
    tot afwijking van Richtlijn 2000/29/EG van de Raad wat betreft maatregelen om
    het binnenbrengen en de verspreiding in de Unie van het schadelijk organisme Agrilus
    planipennis (Fairmaire) via uit Canada of de Verenigde Staten van Amerika afkomstig
    hout te voorkomen (Kennisgeving geschied onder nummer C(2018) 8235)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/1959 z dnia 10 grudnia 2018 r. ustanawiająca
    odstępstwo od dyrektywy Rady 2000/29/WE w odniesieniu do środków zapobiegających
    wprowadzaniu do Unii i rozprzestrzenianiu się na jej terytorium organizmu szkodliwego
    Agrilus planipennis (Fairmaire) poprzez drewno pochodzące z Kanady i Stanów
    Zjednoczonych Ameryki (notyfikowana jako dokument nr C(2018) 8235)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/1959 da Comissão, de 10 de dezembro de
    2018, relativa a uma derrogação da Diretiva 2000/29/CE do Conselho no que diz
    respeito às medidas destinadas a impedir a introdução e a propagação na União
    do organismo prejudicial Agrilus planipennis (Fairmaire) através da madeira originária
    do Canadá e dos Estados Unidos da América [notificada com o número C(2018)
    8235]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/1959 a Comisiei din 10 decembrie
    2018 de derogare de la Directiva 2000/29/CE a Consiliului în ceea ce privește
    măsurile de prevenire a introducerii și a răspândirii în Uniune a organismului
    dăunător Agrilus planipennis (Fairmaire) prin intermediul lemnului originar
    din Canada și din Statele Unite ale Americii [notificată cu numărul C(2018)
    8235]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/1959 z 10. decembra 2018 o
    výnimke zo smernice Rady 2000/29/ES, pokiaľ ide o opatrenia na zabránenie zavlečeniu
    škodlivého organizmu Agrilus planipennis (Fairmaire) prostredníctvom dreva
    s pôvodom v Kanade a Spojených štátoch amerických do Únie a jeho rozšíreniu
    v nej [oznámené pod číslom C(2018) 8235]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/1959 z dne 10. decembra 2018 o odstopanju
    od Direktive Sveta 2000/29/ES glede ukrepov za preprečevanje vnosa škodljivega
    organizma Agrilus planipennis (Fairmaire) v Unijo in njegovega širjenja v Uniji
    z lesom, ki izvira iz Kanade in Združenih držav Amerike (notificirano pod dokumentarno
    številko C(2018) 8235)
  type: main
