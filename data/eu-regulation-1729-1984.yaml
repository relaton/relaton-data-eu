title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1729/84 of 20 June 1984 re-establishing
    the levying of customs duties on upright pianos, new, falling within subheading
    92.01 A ex I and originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1729/84 de la Commission du 20 juin 1984 portant rétablissement
    de la perception des droits de douane applicables aux pianos droits, neufs, de
    la sous-position 92.01 A ex I du tarif douanier commun, originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1729/84 der Kommission vom 20. Juni 1984 zur Wiedereinführung
    der Erhebung der Zölle für Klaviere mit aufrecht stehendem Rahmen, neue, der
    Tarifstelle 92.01 A ex I mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1729/84 af 20. juni 1984 om genindførelse
    af opkrævning af told for opretstående klaverer, nye, henhørende under pos.
    92.01 A ex I og med oprindelse i Sydkorea, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1729/84 της Επιτροπής
    της 20ής Ιουνίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για κλειδοκύμβαλα ορθά,
    καινουργή, της διακρίσεως 92.01 Α ex Ι του Κοινού
    Δασμολογίου, καταγωγής Νότιας Κορέας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1729/84 della Commissione del 20 giugno 1984 che ripristina
    la riscossione dei dazi doganali applicabili ai pianoforti verticali, nuovi, della
    sottovoce 92.01 A ex I della tariffa doganale comune, originari della Corea del
    Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1729/84 van de Commissie van 20 juni 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op staande piano'
    s, nieuwe, van postonderverdeling 92.01 A ex I, van oorsprong uit Zuid-Korea,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
