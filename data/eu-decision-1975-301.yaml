title:
- language: en
  script: Latn
  content: '75/301/EEC: Commission Decision of 18 April 1975 authorizing the Member
    States to approve for marketing reproductive material of certain forest species
    not complying with the requirements of the Council Directive on the marketing
    of forest reproductive material'
  type: main
- language: fr
  script: Latn
  content: '75/301/CEE: Décision de la Commission, du 18 avril 1975, autorisant les
    États membres à admettre la commercialisation des matériels de reproduction
    de certaines espèces forestières ne répondant pas aux exigences de la directive
    du Conseil concernant la commercialisation des matériels forestiers de reproduction'
  type: main
- language: de
  script: Latn
  content: '75/301/EWG: Entscheidung der Kommission vom 18. April 1975 zur Ermächtigung
    der Mitgliedstaaten, Vermehrungsgut bestimmter forstlicher Arten zum gewerbsmäßigen
    Verkehr zuzulassen, das den Anforderungen der Richtlinie des Rates über den Verkehr
    mit forstlichem Vermehrungsgut nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '75/301/EØF: Kommissionens Beslutning af 18. april 1975 om bemyndigelse
    af medlemsstaterne til at tillade handel med formeringsmateriale af bestemte forstlige
    arter, der ikke opfylder kravene i Rådets direktiv om handel med forstligt formeringsmateriale'
  type: main
- language: it
  script: Latn
  content: '75/301/CEE: Decisione della Commissione, del 18 aprile 1975, che autorizza
    gli Stati membri ad ammettere alla commercializzazione materiali di riproduzione
    di alcune specie forestali che non soddisfano alle condizioni della direttiva
    del Consiglio relativa alla commercializzazione dei materiali forestali di riproduzione'
  type: main
- language: nl
  script: Latn
  content: '75/301/EEG: Beschikking van de Commissie van 18 april 1975 houdende machtiging
    van de Lid-Staten om teeltmateriaal van bepaalde boomsoorten voor de bosbouw,
    dat niet beantwoordt aan de eisen van de richtlijn van de Raad betreffende het
    in de handel brengen van bosbouwkundig teeltmateriaal, tot de handel toe te laten'
  type: main
