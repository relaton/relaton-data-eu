title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 275/2004 of 17 February 2004 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 1796/1999 on imports of steel ropes and cables originating
    in the People's Republic of China, by imports of steel ropes and cables consigned
    from Morocco, whether declared as originating in Morocco or not and making such
    imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 275/2004 de la Commission du 17 février 2004 ouvrant
    une enquête sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) n° 1796/1999 du Conseil sur les importations de câbles
    en acier originaires de la République populaire de Chine par des importations
    de câbles en acier expédiés du Maroc, qu'ils aient ou non été déclarés
    originaires de ce pays, et rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 275/2004 der Kommission vom 17. Februar 2004 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 1796/1999 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren von Kabeln und Seilen aus Stahl mit Ursprung in der Volksrepublik China
    durch Einfuhren von aus Marokko versandten Kabeln und Seilen aus Stahl, als Ursprungserzeugnis
    Marokkos angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 275/2004 ze dne 17. února 2004 o zahájení
    šetření možného obcházení antidumpingových opatření uložených nařízením
    Rady (ES) č. 1796/1999 na dovoz ocelových lan a kabelů pocházejících z Čínské
    lidové republiky dovozem ocelových lan a kabelů zasílaných z Maroka, ať
    již jsou prohlášeny za pocházející z Maroka či nikoliv, a o zavedení evidence
    těchto dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 275/2004 af 17. februar 2004 om indledning
    af en undersøgelse vedrørende den påståede omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 1796/1999 på importen af tovværk
    og kabler af stål med oprindelse i Folkerepublikken Kina, ved import af tovværk
    og kabler af stål afsendt fra Marokko, uanset om de er angivet med oprindelse
    i Marokko eller ej, og om at gøre denne import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 275/2004 της Επιτροπής,
    της 17ης Φεβρουαρίου 2004, για την έναρξη έρευνας
    όσον αφορά την πιθανή καταστρατήγηση των μέτρων
    αντιντάμπινγκ που επιβλήθηκαν με τον κανονισμό
    (ΕΚ) αριθ. 1796/1999 του Συμβουλίου στις εισαγωγές
    συρματόσχοινων και καλωδίων από χάλυβα καταγωγής
    Λαϊκής Δημοκρατίας της Κίνας, από τις εισαγωγές
    συρματόσχοινων και καλωδίων από χάλυβα που
    αποστέλλονται από το Μαρόκο, είτε δηλώνονται
    ως καταγωγής Μαρόκου είτε όχι, και για την υποβολή
    των εν λόγω εισαγωγών σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 275/2004, 17. veebruar 2004, Hiina Rahvavabariigist
    pärinevate terastrosside ja -vaierite impordi kohta (imporditakse Marokost saadetud
    terastrosse ja -vaiereid, sõltumata sellest, kas päritolumaana on deklareeritud
    Maroko või mitte) nõukogu määruse (EÜ) nr 1796/1999 alusel kasutusele võetud
    dumpinguvastastest meetmetest võimalikku kõrvalehoidmist käsitleva uurimise
    algatamise kohta ja kõnealuse impordi registreerimise kohustuslikuks muutmise
    kohta
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 275/2004, annettu 17 päivänä helmikuuta 2004,
    Kiinan kansantasavallasta peräisin olevien teräsköysien ja -kaapeleiden tuonnissa
    neuvoston asetuksella (EY) N:o 1796/1999 käyttöön otettujen polkumyyntitoimenpiteiden
    mahdollista kiertämistä tuomalla teräsköysiä ja -kaapeleita Marokosta siitä
    riippumatta, onko niiden alkuperämaaksi ilmoitettu Marokko, koskevan tutkimuksen
    vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 275/2004/EK rendelete (2004. február 17.) az 1796/1999/EK
    tanácsi rendelettel a Kínai Népköztársaságból származó acél drótkötelek
    és kábelek behozatalára vonatkozóan bevezetett dömpingellenes intézkedéseknek
    a Marokkóban feladott acél drótkötelek és kábelek – függetlenül attól,
    hogy azokat Marokkóból származónak jelentik-e be vagy sem – behozatala általi
    lehetséges megkerülésével kapcsolatos vizsgálat kezdeményezéséről, valamint
    e behozatalok nyilvántartásba vételi kötelezettségének előírásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 275/2004 della Commissione, del 17 febbraio 2004, che
    avvia un'inchiesta relativa all'eventualità dell'elusione delle misure antidumping
    istituite dal regolamento (CE) n. 1796/1999 del Consiglio sulle importazioni di
    cavi di acciaio originarie della Repubblica popolare cinese, mediante importazioni
    di cavi di acciaio spediti dal Marocco, a prescindere dal fatto che siano dichiarate
    originarie del Marocco o meno, e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 275/2004 (2004. gada 17. februāris), ar ko uzsāk
    izmeklēšanu attiecībā uz Padomes Regulā (EK) Nr. 1796/1999 par Ķīnas Tautas
    Republikas izcelsmes tērauda trošu un tauvu importu noteikto antidempinga pasākumu
    iespējamo apiešanu, ievedot tērauda troses un tauvas no Marokas un deklarējot
    vai nedeklarējot tās kā Marokas izcelsmes ražojumus, un nosaka reģistrācijas
    piemērošanu šādiem ievedumiem
  type: main
- language: lt
  script: Latn
  content: 2004 m. vasario 17 d. Komisijos reglamentas (EB) Nr. 275/2004, inicijuojantis
    tyrimą dėl galimo Tarybos reglamentu (EB) Nr. 1796/1999 įvestų Kinijos Liaudies
    Respublikos kilmės plieninių lynų ir kabelių importui taikomų antidempingo
    priemonių apėjimo importuojamus plieninius lynus ir kabelius siunčiant iš
    Maroko, deklaruojamus arba nedeklaruojamus kaip esančius Maroko kilmės, ir įvedantis
    tokio importo registraciją
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 275/2004 tas-17 ta' Frar 2004 li
    jibda investigazzjoni dwar l-evitar possibbli tal-miżuri anti-dumping imposti
    mir-Regolament tal-Kunsill (KE) Nru 1796/1999 dwar l-importazzjonijiet ta' ħbula
    u kejbils ta' l-azzar li joriġinaw mir-Repubblika tal-Poplu taċ-Ċina, minn
    importazzjonijiet ta' ħbula u kejbils li jiġu mill-Marokk, kemm jekk iddikjarati
    bħala li joriġinaw mill-Marokk u kemm jekk le u li jagħmel importazzjonijiet
    bħal dawn soġġetti għal reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 275/2004 van de Commissie van 17 februari 2004 tot
    opening van een onderzoek naar de mogelĳke ontduiking van de antidumpingmaatregelen
    die werden ingesteld bĳ Verordening (EG) nr. 1796/1999 van de Raad ten aanzien
    van stalen kabels uit de Volksrepubliek China door verzending van deze kabels
    vanuit Marokko, al dan niet aangegeven als van oorsprong uit Marokko, en tot registratie
    van deze invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 275/2004 z dnia 17 lutego 2004 r. wszczynające
    postępowanie dotyczące możliwego obchodzenia środków antydumpingowych nałożonych
    na mocy rozporządzenia Rady (WE) nr 1796/1999 na przywóz lin stalowych i kabli
    pochodzących z Chińskiej Republiki Ludowej, poprzez przywóz lin stalowych i
    kabli wysyłanych z Maroka, zgłoszonych lub niezgłoszonych jako pochodzące
    z Maroka, i poddające ten przywóz rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 275/2004 da Comissão, de 17 de Fevereiro de 2004,
    que inicia um inquérito sobre a eventual evasão das medidas anti-dumping instituídas
    pelo Regulamento (CE) n.° 1796/1999 do Conselho sobre as importações de cabos
    de aço originários da República Popular da China, através de importações
    de cabos de aço expedidos via Marrocos, independentemente de serem ou não declarados
    originários deste país, e que torna obrigatório o registo dessas importações
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 275/2004 zo 17. februára 2004, ktorým sa
    začína šetrenie týkajúce sa možného obchádzania antidumpingových opatrení
    uložených nariadením Rady (ES) č. 1796/1999 na dovoz oceľových lán a káblov
    s pôvodom v Čínskej ľudovej republike, dovoz oceľových lán a káblov odoslaných
    z Maroka bez ohľadu na to, či deklarujú pôvod v Maroku a ktorým sa na takýto
    dovoz uplatňuje registrácia
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 275/2004 z dne 17. februarja 2004 o začetku
    preiskave glede morebitnega izogibanja protidampinškim ukrepom, ki so bili uvedeni
    z Uredbo Sveta (ES) št. 1796/1999 pri uvozu jeklenih vrvi in kablov s poreklom
    iz Ljudske republike Kitajske, z uvozom jeklenih vrvi in kablov, poslanih iz Maroka,
    ne glede na to, ali je prijavljena država porekla Maroko ali ne, in uvedba registracije
    takšnega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 275/2004 de la Comisión, de 17 de febrero de 2004,
    por el que se abre una investigación referente a la supuesta elusión de las
    medidas antidumping impuestas por el Reglamento (CE) n° 1796/1999 del Consejo
    sobre las importaciones de cables de acero originarias de la República Popular
    China mediante importaciones de cables de acero procedentes de Marruecos, hayan
    sido o no declaradas originarias de Marruecos, y por el que se someten dichas
    importaciones a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 275/2004 av den 17 februari 2004 om inledande
    av en undersökning rörande eventuellt kringgående av de antidumpningsåtgärder
    som genom rådets förordning (EG) nr 1796/1999 infördes beträffande import
    av linor och kablar av stål med ursprung i Folkrepubliken Kina genom import av
    linor och kablar av stål som avsänts från Konungariket Marocko, oavsett om
    de deklarerats ha sitt ursprung i Marocko eller ej, och om registrering av sådan
    import
