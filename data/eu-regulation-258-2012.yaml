title:
- language: en
  script: Latn
  content: Regulation (EU) No 258/2012 of the European Parliament and of the Council
    of 14 March 2012 implementing Article 10 of the United Nations’ Protocol against
    the illicit manufacturing of and trafficking in firearms, their parts and components
    and ammunition, supplementing the United Nations Convention against Transnational
    Organised Crime (UN Firearms Protocol), and establishing export authorisation,
    and import and transit measures for firearms, their parts and components and ammunition
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 258/2012 du Parlement européen et du Conseil du 14
    mars 2012 portant application de l’article 10 du protocole des Nations unies
    contre la fabrication et le trafic illicites d’armes à feu, de leurs pièces,
    éléments et munitions, additionnel à la convention des Nations unies contre
    la criminalité transnationale organisée (protocole relatif aux armes à feu)
    et instaurant des autorisations d’exportation, ainsi que des mesures concernant
    l’importation et le transit d’armes à feu, de leurs pièces, éléments et
    munitions
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 258/2012 des Europäischen Parlaments und des Rates
    vom 14. März 2012 zur Umsetzung des Artikels 10 des Protokolls der Vereinten
    Nationen gegen die unerlaubte Herstellung von Schusswaffen, dazugehörigen Teilen
    und Komponenten und Munition und gegen den unerlaubten Handel damit, in Ergänzung
    des Übereinkommens der Vereinten Nationen gegen die grenzüberschreitende organisierte
    Kriminalität (VN-Feuerwaffenprotokoll) und zur Einführung von Ausfuhrgenehmigungen
    für Feuerwaffen, deren Teile, Komponenten und Munition sowie von Maßnahmen betreffend
    deren Einfuhr und Durchfuhr
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 258/2012 на Европейския парламент
    и на Съвета от 14 март 2012 година за изпълнение
    на член 10 от Протокола на Организацията на
    обединените нации срещу незаконното производство
    и трафика с огнестрелни оръжия, техните части
    и компоненти и боеприпаси, допълващ Конвенцията
    на Организацията на обединените нации срещу
    транснационалната организирана престъпност
    ( „Протокол за огнестрелните оръжия“ ), и за
    установяване на разрешения за износа и мерки
    за вноса и транзита на огнестрелни оръжия,
    техни части и компоненти и боеприпаси
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) č. 258/2012 ze dne 14.
    března 2012 , kterým se provádí článek 10 protokolu Organizace spojených
    národů proti nedovolené výrobě střelných zbraní a jejich součástí,
    dílů a střeliva a obchodování s nimi, který doplňuje Úmluvu Organizace
    spojených národů proti nadnárodnímu organizovanému zločinu (protokol OSN
    o střelných zbraních), a stanoví vývozní povolení, opatření pro dovoz
    a tranzit střelných zbraní, jejich součástí, dílů a střeliva
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) nr. 258/2012 af 14. marts
    2012 om gennemførelse af artikel 10 i De Forenede Nationers protokol om bekæmpelse
    af ulovlig fremstilling af og handel med skydevåben og dele, komponenter samt
    ammunition hertil, der supplerer De Forenede Nationers konvention om bekæmpelse
    af grænseoverskridende organiseret kriminalitet ( »FN's våbenprotokol« ),
    og om fastsættelse af udførselstilladelse og indførsels- og transitforanstaltninger
    for skydevåben og dele, komponenter samt ammunition hertil
  type: main
