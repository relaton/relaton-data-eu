  script: Latn
  content: Regolamento (UE) n. 258/2012 del Parlamento europeo e del Consiglio, del
    14 marzo 2012 , che attua l’articolo 10 del protocollo delle Nazioni Unite contro
    la fabbricazione e il traffico illeciti di armi da fuoco, loro parti e componenti
    e munizioni, addizionale alla convenzione delle Nazioni Unite contro la criminalità
