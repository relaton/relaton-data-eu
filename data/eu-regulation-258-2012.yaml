  script: Latn
  content: Rialachán (AE) Uimh. 258/2012 Ó Pharlaimint na hEorpa agus ón gComhairle
    an 14 Márta 2012 lena gcuirtear Airteagal 10 de Phrótacal na Náisiún Aontaithe
    i gcoinne monarú agus gáinneáil aindleathach arm tine, a bpáirteanna agus
    a gcomhpháirteanna agus armlóin, lena bhforlíontar Coinbhinsiún na Náisiún
    Aontaithe in aghaidh coireachta eagraithe trasnáisiúnta (Prótacal Arm Tine
    na Náisiún Aontaithe) chun feidhme, agus lena mbunaítear bearta i ndáil le
    húdarú onnmhairithe, le hallmhairithe agus le hidirthurais le haghaidh arm tine,
    a bpáirteanna agus a gcomhpháirteanna agus armlóin
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) br. 258/2012 Europskog parlamenta i Vijeća od 14. ožujka
    2012. o provedbi članka 10. Protokola Ujedinjenih naroda protiv nezakonite proizvodnje
    i trgovanja vatrenim oružjem, njegovim dijelovima i komponentama te streljivom,
    kojim se dopunjuje Konvencija Ujedinjenih naroda protiv transnacionalnog organiziranog
    kriminaliteta (Protokol UN-a o vatrenom oružju), utvrđivanju odobrenja za izvoz
    vatrenog oružja, mjera za uvoz i provoz vatrenog oružja, njegovih dijelova i
    komponenata i streljiva
  type: main
