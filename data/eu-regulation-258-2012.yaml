  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) N:o 258/2012, annettu 14
    päivänä maaliskuuta 2012 , kansainvälisen järjestäytyneen rikollisuuden
    vastaista Yhdistyneiden kansakuntien yleissopimusta täydentävän, ampuma-aseiden,
    niiden osien ja komponenttien sekä ampumatarvikkeiden laittoman valmistuksen
    ja laittoman kaupan torjuntaa koskevan lisäpöytäkirjan (YK:n ampuma-asepöytäkirja)
    10 artiklan täytäntöönpanosta ja ampuma-aseiden, niiden osien ja komponenttien
