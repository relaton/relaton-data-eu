  script: Latn
  content: Az Európai Parlament és a Tanács 258/2012/EU rendelete ( 2012. március
    14. ) az Egyesült Nemzeteknek a nemzetközi szervezett bűnözés elleni egyezményét
    kiegészítő, a tűzfegyverek, részeik, alkotóelemeik és a lőszerek tiltott
    gyártásáról és kereskedelméről szóló jegyzőkönyve (az ENSZ tűzfegyverekről
