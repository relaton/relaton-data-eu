  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 258/2012 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, της 14ης Μαρτίου
    2012 , για την εφαρμογή του άρθρου 10 του πρωτοκόλλου
    των Ηνωμένων Εθνών σχετικά με την καταπολέμηση
    της παράνομης κατασκευής και διακίνησης πυροβόλων
