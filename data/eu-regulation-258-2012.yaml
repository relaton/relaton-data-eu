  content: Reglamento (UE) n ° 258/2012 del Parlamento Europeo y del Consejo, de
    14 de marzo de 2012 , por el que se aplica el artículo 10 del Protocolo de las
    Naciones Unidas contra la falsificación y el tráfico ilícitos de armas de fuego,
    sus piezas y componentes y municiones, que complementa la Convención de las Naciones
