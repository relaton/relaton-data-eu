id: EUDecision1980420
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/420/EEC: Commission Decision of 26 March 1980 authorizing Ireland not
    to apply Community treatment to woven breeches, shorts and trousers, falling within
    subheadings ex 61.01 B V and ex 61.02 B II of the Common Customs Tariff (category
    6), originating in Hong Kong and in free circulation in the other Member States
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/420/CEE: Décision de la Commission, du 26 mars 1980, autorisant l''Irlande
    à exclure du traitement communautaire les culottes, "shorts" et pantalons tissés,
    des sous-positions ex 61.01 B V et ex 61.02 B II du tarif douanier commun (catégorie
    6), originaires de Hong-kong et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/420/EWG: Entscheidung der Kommission vom 26. März 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Shorts und andere kurze Hosen und lange Hosen, aus
    Geweben, der Tarifstellen ex 61.01 B V und ex 61.02 B II des Gemeinsamen Zolltarifs
    (Kategorie 6) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/420/EØF: Kommissionens beslutning af 26. marts 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage shorts og andre korte benklæder
    vævede, som henhører under pos. ex 61.01 B V og ex 61.02 B II i den fælles
    toldtarif (kategori 6), har oprindelse i Hongkong og frit kan omsættes i de øvrige
    medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/420/CEE: Decisione della Commissione, del 26 marzo 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i calzoncini, shorts e pantaloni
    tessuti, delle sottovoci ex 61.01 B V e ex 61.02 B II della tariffa doganale comune
    (categoria 6), originari di Hong Kong e messi in libera pratica negli altri Stati
    membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/420/EEG: Beschikking van de Commissie van 26 maart 1980 waarbij Ierland
    wordt gemachtigd shorts en andere korte broeken, lange broeken, geweven, van de
    posten ex 61.01 B V en ex 61.02 B II van het gemeenschappelijk douanetarief (categorie
    6), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)'
  type: main
