  content: Commission Regulation (EC) No 1299/98 of 23 June 1998 amending Regulation
    (EC) No 936/97 opening and providing for the administration of tariff quotas for
    high-quality fresh, chilled and frozen beef and for frozen buffalo meat and Regulation
    (EEC) No 139/81 defining the conditions for the admission of certain kinds of
    frozen beef and veal to subheading 0202 30 50 of the Combined Nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1299/98 de la Commission du 23 juin 1998 modifiant
    les règlements (CE) nº 936/97 portant ouverture et mode de gestion des contingents
    tarifaires pour les viandes bovines de haute qualité, fraîches, réfrigérées
    ou congelées et pour la viande de buffle congelée, et (CEE) nº 139/81 définissant
    les conditions auxquelles est subordonnée l'admission de certaines viandes bovines
    congelées dans la sous-position 0202 30 50 de la nomenclature combinée
