title:
- language: en
  script: Latn
  content: '88/60/EEC: Commission Decision of 22 October 1987 approving the intervention
    programme for Portugal implementing the Community programme for the development
    of certain less-favoured regions of the Community by improving access to advanced
    telecommunications services (STAR programme) (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/60/CEE: Décision de la Commission du 22 octobre 1987 portant application
    au Portugal du programme communautaire relatif au développement de certaines
    régions défavorisées de la Communauté par un meilleur accès aux services
    avancés de télécommunications (programme Star) (Le texte en langue portugaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/60/EWG: Entscheidung der Kommission vom 22. Oktober 1987 zur Genehmigung
    des Interventionsprogramms für Portugal zur Durchführung des Gemeinschaftsprogramms
    zur Entwicklung bestimmter benachteiligter Regionen der Gemeinschaft durch einen
    besseren Zugang zu den fortgeschrittenen Telekommunikationsdiensten (STAR- Programm)
    (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/60/EØF: Kommissionens beslutning af 22. oktober 1987 om godkendelse
    af interventionsprogrammet for Portugal til gennemførelse af fællesskabsprogrammet
    til udvikling af visse ugunstigt stillede regioner i Fællesskabet gennem bedre
    adgang til avancerede telekommunikationstjenester (STAR-programmet) (Kun den portugisiske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/60/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Οκτωβρίου
    1987 για την εφαρμογή στην Πορτογαλία του κοινοτικού
    προγράμματος σχετικά με την ανάπτυξη ορισμένων
    μειονεκτικών περιοχών της Κοινότητας μέσω
    καλύτερης πρόσβασης στις προηγμένες υπηρεσίες
    τηλεπικοινωνιών (πρόγραμμα STAR) (Το κείμενο
    στην πορτογαλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/60/CEE: Decisione della Commissione del 22 ottobre 1987 relativa all''approvazione
    del programma d''intervento che attua in Portogallo un programma comunitario relativo
    allo sviluppo di talune regioni svantaggiate della Comunità mediante un migliore
    accesso ai servizi di telecomunicazione progrediti (programma Star) (Il testo
    in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/60/EEG: Beschikking van de Commissie van 22 oktober 1987 ter goedkeuring
    van het steunprogramma voor Portugal tot uitvoering van het communautaire programma
    voor de ontwikkeling van bepaalde, minder ontwikkelde regio''s van de Gemeenschap
    door een betere toegang tot geavanceerde telecommunicatiediensten (STAR-programma)
    (Slechts de tekst in de Portugese taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/60/CEE: Decisão da Comissão de 22 de Outubro de 1987 pela qual se
    aprova o programa de intervenção para a execução em Portugal do programa comunitário
    relativo ao desenvolvimento de certas regiões desfavorecidas da Comunidade pelo
    melhor acesso aos serviços avançados de telecomunicações (programa STAR) (Apenas
    faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '88/60/CEE: Decisión de la Comisión de 22 de octubre de 1987 por la que
    se aprueba el programa de intervención para la ejecución en Portugal del Programa
    comunitario relativo al desarrollo de determinadas regiones desfavorecidas de
    la Comunidad mediante un mejor acceso a los servicios avanzados de telecomunicaciones
    (programa STAR) (El texto en lengua portuguesa es el único auténtico)'
