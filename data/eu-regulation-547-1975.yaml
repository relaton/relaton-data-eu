title:
- language: en
  script: Latn
  content: Regulation (EEC) No 547/75 of the Commission of 3 March 1975 re-establishing
    the levying of the customs duties on locks and padlocks (key, etc.); keys for
    any of the foregoing articles of base metal, falling within heading No 83.01,
    originating in Hongkong, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 547/75 de la Commission, du 3 mars 1975, portant rétablissement
    de la perception des droits de douane applicables aux serrures (y compris les
    fermoirs et montures-fermoirs comportant une serrure), verrous et cadenas, à
    clef, à secret ou électriques, et leurs parties, en métaux communs, clefs pour
    ces articles, en métaux communs, de la position tarifaire 83.01, originaires
    de Hong-Kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 547/75 der Kommission vom 3. März 1975 zur Wiedereinführung
    des Zollsatzes für Schlösser (einschließlich Verschlüsse und Verschlußbügel
    mit Schloß), aus unedlen Metallen, der Tarifnummer 83.01, mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 547/75 af 3. marts 1975 om genindførelse
    af opkrævning af toldafgifter for nøglelåse kombinationslåse (herunder spænder
    og taskebøjler); nøgler til nævnte låse, af uædle metaller, under position
    83.01, som har oprindelse i Hong Kong og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 547/75 della Commissione, del 3 marzo 1975, che ripristina
    la riscossione dei dazi doganali applicabili alle serrature (compresi i fermagli
    e le montature a fermaglio comportanti una serratura), catenacci e lucchetti,
    a chiave, a segreto o elettrici, e loro parti, di metalli comuni; chiavi per detti
    oggetti, di metalli comuni, della voce doganale n. 83.01, originari di Hong Kong,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 547/75 van de Commissie van 3 maart 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op sloten (van
    een slot voorziene sluitingen, ...); sleutels voor bedoelde sloten, van onedel
    metaal, van post 83.01, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening
    (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
