    (ΕΟΚ) αριθ. 3782/88 που εξουσιοδοτεί τη Γερμανία
    και τη Γαλλία να μην εφαρμόσουν σε ορισμένες
    ζώνες τα μέτρα που προβλέπονται στον κανονισμό
