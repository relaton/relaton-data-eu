    viinivuosiksi 1988/1989-1995/1996 annetussa neuvoston asetuksessa (ETY) N:o 1442/88
    säädettyjä toimenpiteitä annetun asetuksen (ETY) N:o 3782/89 muuttamisesta
  type: main
- language: it
  script: Latn
