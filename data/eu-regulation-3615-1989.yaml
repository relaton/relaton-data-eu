title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3615/89 of 1 December 1989 amending Regulation
    (EEC) No 3782/88 authorizing Germany and France not to apply in certain areas
    the measures provided for in Regulation (EEC) No 1442/88 on the granting, for
    the 1989/90 to 1995/96 wine years, of permanent abandonment premiums in respect
    of wine- growing areas
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3615/89 de la Commission du 1er décembre 1989 modifiant
    le règlement (CEE) n° 3782/88 autorisant l'Allemagne et la France à ne pas
    appliquer dans certaines zones les mesures prévues au règlement (CEE) n° 1442/88
    du Conseil, relatif à l'octroi de primes d'abandon définitif de superficies
    viticoles, pour les campagnes viticoles 1989/1990 à 1995/1996
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3615/89 DER KOMMISSION vom 1. Dezember 1989 zur Änderung
    der Verordnung (EWG) Nr. 3782/88 zur Ermächtigung der Bundesrepublik Deutschland
    und Frankreichs, in bestimmten Gebieten die mit der Verordnung (EWG) Nr. 1442/88
    des Rates über die Gewährung von Prämien zur endgültigen Aufgabe von Rebflächen
    vorgesehenen Maßnahmen in den Weinwirtschaftsjahren 1989/90 bis 1995/96 nicht
    anzuwenden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3615/89 af 1. december 1989 om ændring
