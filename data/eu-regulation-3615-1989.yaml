    visse zoner ikke at anvende foranstaltningerne i Rådets forordning (EØF) nr.
    1442/88 om ydelse for produktionsårene 1989/90 til 1995/96 af præmier for endelig
    nedlæggelse af vinarealer
  type: main
- language: el
  script: Grek
