  content: Regulation (EEC) No 1495/74 of the Commission of 14 June 1974 complementing
    the Regulation (EEC) No 834/74 laying down requisite provisions to prevent the
    sugar market being disturbed as a result of the price increase in this sector
    for the 1974/75 sugar marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1495/74 de la Commission, du 14 juin 1974, complétant
    le règlement (CEE) n° 834/74 établissant des mesures nécessaires pour éviter
    des perturbations sur le marché du sucre provoquées par l'augmentation des prix
    dans ce secteur pour la campagne sucrière 1974/1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1495/74 der Kommission vom 14. Juni 1974 zur Ergänzung
    der Verordnung (EWG) Nr. 834/74 über notwendige Maßnahmen zur Verhinderung von
    Störungen auf dem Zuckermarkt, hervorgerufen durch Preiserhöhungen in diesem
    Sektor für das Zuckerwirtschaftsjahr 1974/1975
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1495/74 af 14. juni 1974 om tillæg
    til forordning (EØF) nr. 834/74 om fastsættelse af nødvendige foranstaltninger
    til undgåelse af forstyrrelser på sukkermarkedet på grund af prisforhøjelser
    i denne sektor for sukkerproduktionsåret 1974/1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1495/74 della Commissione, del 14 giugno 1974, che
    completa il regolamento (CEE) n. 834/74 che stabilisce le misure necessarie per
    evitare perturbazioni sul mercato dello zucchero provocate dall'aumento dei prezzi
    in tale settore per la campagna saccarifera 1974/1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1495/74 van de Commissie van 14 juni 1974 tot aanvulling
