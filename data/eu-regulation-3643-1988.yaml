id: EURegulation36431988
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3643/88 of 23 November 1988 derogating for
    the 1988/89 marketing year from Regulation (EEC) No 1562/85 laying down detailed
    rules for the application of measures to encourage the processing of oranges and
    the marketing of products processed from lemons as regards the conversion rate
    to be applied to the minimum price to be paid to the producer and the financial
    compensation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3643/88 de la Commission du 23 novembre 1988 dérogeant,
    pour la campagne 1988/1989, au règlement (CEE) n° 1562/85 portant modalités
    d' application des mesures visant à promouvoir la transformation des oranges
    et la commercialisation des produits transformés à base de citrons, en ce qui
    concerne le taux de conversion à appliquer au prix minimal à payer au producteur
    ainsi qu' à la compensation financière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3643/88 der Kommission vom 23. November 1988 zur Abweichung
    von der Verordnung (EWG) Nr. 1562/85 mit Durchführungsbestimmungen zu den Maßnahmen
    zur Förderung der Apfelsinenverarbeitung und der Vermarktung von Verarbeitungserzeugnissen
    aus Zitronen hinsichtlich des Umrechnungskurses, der auf den Erzeugermindestpreis
    und finanziellen Ausgleich anzuwenden ist, im Wirtschaftsjahr 1988/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3643/88 af 23. november 1988 om undtagelse
    for produktionsåret 1988/89 fra forordning (EØF) nr. 1562/85 om gennemførelsesbestemmelser
    til foranstaltningerne til fremme af forarbejdning af appelsiner og afsætning
    af produkter forarbejdet på basis af citroner, for så vidt angår den omregningskurs,
    der skal anvendes på den minimumspris, der skal betales til producenten, samt
    på udligningstilskud
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3643/88 της Επιτροπής
    της 23ης Νοεμβρίου 1988 για παρέκκλιση, για την
    περίοδο 1988/89, από τον κανονισμό (ΕΟΚ) αριθ. 1562/85
    περί λεπτομερειών εφαρμογής των μέτρων που
    αποσκοπούν στην προώθηση της μεταποίησης των
    πορτοκαλιών και την εμπορία των μεταποιημένων
    προϊόντων με βάση τα λεμόνια, όσον αφορά την
    ισοτιμία που εφαρμόζεται στην ελάχιστη τιμή
    που πληρώνεται στον παραγωγό καθώς και στη
    χρηματική αντιστάθμιση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3643/88 della Commissione del 23 novembre 1988 recante
    deroga, per la campagna 1988/1989, al regolamento (CEE) n. 1562/85 che stabilisce
    le modalità di applicazione delle misure intese a promuovere la trasformazione
    delle arance e la commercializzazione dei prodotti trasformati a base di limoni,
    per quanto riguarda il tasso di conversione da applicare al prezzo minimo da pagare
    al produttore e alla compensazione finanziaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3643/88 van de Commissie van 23 november 1988 houdende
    afwijking voor het verkoopseizoen 1988/1989 van Verordening (EEG) nr. 1562/85
    houdende uitvoeringsbepalingen ten aanzien van de maatregelen ter bevordering
    van de verwerking van sinaasappelen en de afzet van op basis van citroenen verwerkte
    produkten, met betrekking tot de omrekeningskoers die op de aan de producent te
    betalen minimumprijs alsmede op de financiële vergoeding dient te worden toegepast
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3643/88 da Comissão de 23 de Novembro de 1988 que
    estabelece uma derrogação, para a campanha de 1988/1989, ao Regulamento (CEE)
    n.° 1562/85, que estabelece as modalidades de aplicação das medidas destinadas
    a promover a transformação das laranjas e a comercialização dos produtos transformados
    à base de limões, no que diz respeito à taxa de conversão a aplicar ao preço
    mínimo a pagar ao produtor, bem como à compensação financeira
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3643/88 de la Comisión de 23 de noviembre de 1988
    por el que se establecen, para la campaña 1988/89, excepciones al Reglamento
    (CEE) n° 1562/85 por el que se establecen las modalidades de aplicación de las
    medidas destinadas a promover la transformación de naranjas y la comercialización
    de los productos transformados a base de limones, en lo que se refiere al tipo
    de conversión aplicable al precio mínimo que debe pagarse al productor, así
    como a la compensación financiera
  type: main
