title:
- language: en
  script: Latn
  content: '80/534/EEC: Commission Decision of 14 May 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the Kingdom of Denmark of expenditure incurred
    during 1979 in connection with Community measures for the eradication of brucellosis,
    tuberculosis and leucosis in cattle (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/534/CEE: Décision de la Commission, du 14 mai 1980, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    au Royaume du Danemark, des dépenses effectuées pendant l''année 1979 dans
    le cadre d''une action de la Communauté en vue de l''éradication de la brucellose,
    de la tuberculose et de la leucose des bovins (Le texte en langue danoise est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/534/EWG: Entscheidung der Kommission vom 14. Mai 1980 über die Erstattung
    der Ausgaben des Jahres 1979 für die Einführung von Maßnahmen der Gemeinschaft
    zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder an das
    Königreich Dänemark (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/534/EØF: Kommissionens beslutning af 14. maj 1980 om refusion gennem
    EUGFL, udviklingssektionen, til kongeriget Danmark af udgifter afholdt i 1979
    i forbindelse med en fællesskabsaktion med henblik på udryddelse af brucellose,
    tuberkulose og leukose hos kvæg (Kun den danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/534/CEE: Decisione della Commissione, del 14 maggio 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno di Danimarca delle
    spese effettuate nell''anno 1979 nel quadro di un''azione della Comunità per
    l''eradicazione della brucellosi, della tubercolosi e della leucosi dei bovini
    (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/534/EEG: Beschikking van de Commissie van 14 mei 1980 betreffende de
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk Denemarken
    van de in 1979 gedane uitgaven in het kader van een gemeenschappelijke actie voor
    de uitroeiing van brucellose, tuberculose en leukose bij runderen (Slechts de
    tekst in de Deense taal is authentiek)'
