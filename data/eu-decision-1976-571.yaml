id: EUDecision1976571
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 June 1976 authorizing Ireland to maintain protective
    measures in respect of footwear with uppers of leather, falling within Common
    Customs Tariff subheading 64.02 A, under Article 135 of the Act of Accession
  type: main
- language: fr
  script: Latn
  content: '76/571/CEE: Décision de la Commission, du 25 juin 1976, autorisant l''Irlande
    à maintenir des mesures de sauvegarde pour les chaussures à dessus en cuir naturel
    relevant de la position 64.02 à du Tarif douanier commun, au titre de l''article
    135 de l''Acte relatif aux conditions d''adhésion et aux adaptations des Traités'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. Juni 1976, durch die Irland ermächtigt
    wird, Schutzmaßnahmen für Schuhe aus natürlichem Oberleder, die unter die Nummer
    64.02 A des Gemeinsamen Zolltarifs fallen, nach Artikel 135 der Akte über die
    Beitrittsbedingungen und die Anpassung der Verträge beizubehalten
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 25. juni 1976 om bemyndigelse af Irland til
    fortsat at anvende beskyttelsesforanstaltninger over for fodtøj med overdel af
    læder, under pos. 64.02 A i den fælles toldtarif, i henhold til artikel 135
    i akten vedrørende tiltrædelsesvilkårene og tilpasningerne af traktaterne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 giugno 1976, che autorizza l'Irlanda
    a mantenere le misure di salvaguardia per le calzature con tomaia di cuoio naturale
    (voce 64.02 A della tariffa doganale comune) ai sensi dell'articolo 135 dell'atto
    relativo alle condizioni di adesione ed agli adattamenti dei trattati
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 juni 1976 waarbij Ierland wordt gemachtigd
    vrijwaringsmaatregelen te handhaven voor schoeisel met bovendeel van leder (post
    64.02 A van het gemeenschappelijk douanetarief), uit hoofde van artikel 135 van
    de Akte betreffende de toetredingsvoorwaarden en de aanpassing der Verdragen
  type: main
