title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République fédérale d'Allemagne
    à différer le rapprochement des droits prévus dans son tarif douanier vers
    ceux du Tarif douanier commun en ce qui concerne les pommes de terre, autres,
    non dénommées et les légumes à cosse secs
  type: main
- language: de
  script: Latn
  content: '63/226/EWG: Entscheidung der Kommission, mit der die Bundesrepublik Deutschland
    ermächtigt wird, die Angleichung der in ihrem Zolltarif vorgesehenen Zollsätze
    an die Zollsätze des Gemeinsamen Zolltarifs für andere Kartoffeln und trockene
    Hülsenfrüchte aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '63/226/CEE: Decisione della Commissione che autorizza la Repubblica federale
    di Germania a differire il ravvicinamento dei dazi previsti nella sua tariffa
    doganale a quelli della tariffa doganale comune per quanto riguarda le patate,
    altre, non nominate e i legumi da granella, secchi, sgranati, anche decorticati
    o spezzati'
  type: main
- language: nl
  script: Latn
  content: '63/226/EEG: Beschikking van de Commissie waarbij de Bondsrepubliek Duitsland
    wordt gemachtigd de aanpassing van de rechten van haar douanetarief aan die van
    het gemeenschappelijk douanetarief voor aardappelen, andere, overige, en voor
    gedroogde peulvruchten uit te stellen'
  type: main
