title:
- language: en
  script: Latn
  content: '79/567/EEC: Commission Decision of 23 May 1979 authorizing the French
    Republic not to apply Community treatment to synthetic textile fibres ; woven
    fabrics of synthetic fibres (discontinuous or waste) other than narrow woven fabrics,
    pile fabrics (including terry fabrics) and chenille fabrics, falling within subheading
    ex 56.07 A of the Common Customs Tariff (NIMEXE codes 56.07-01, 04, 05, 07, 08,
    11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) (category 3),
    originating in Taiwan and in free circulation in the other Member States (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/567/CEE: Décision de la Commission, du 23 mai 1979, autorisant la
    République française à exclure du traitement communautaire les tissus de fibres
    textiles synthétiques discontinues, autres que rubanerie, velours, peluches,
    tissus bouclés (y compris les tissus bouclés du genre éponge) et tissus de
    chenille, de la sous-position ex 56.07 A du tarif douanier commun (codes Nimexe:
    56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32,
    33, 34, 36) (catégorie 3), originaires de T''ai-wan et mis en libre pratique
    dans les autres Etats membres (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/567/EWG: Entscheidung der Kommission vom 23. Mai 1979, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche synthetische Spinnfasern: Gewebe
    aus synthetischen Spinnfasern, andere als Bänder, Samt, Plüsch, Schlingengewebe
    (einschließlich Frottiergewebe) und Chenillegewebe, der Tarifnummer ex 56.07
    A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 56.07-01; 04; 05; 07; 08; 11;
    13; 14; 16; 17; 18; 21; 23; 24; 26; 27; 28; 32; 33; 34; 36) (Kategorie 3) von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/567/EØF: Kommissionens beslutning af 23. maj 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage syntetiske fibre:
    Vævet stof af korte kemofibre, syntetiske eller regenererede, bortset fra vævede
    bånd, fløjls- og plysstoffer (inklusive håndklæde-frotterstof af bomuld) og
    chenillestoffer, som henhører under pos. ex 56.07 A i den fælles toldtarif (NIMEXE-nummer
    56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32,
    33, 34, 36 ; kategori 3), har oprindelse i Taiwan og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/567/CEE: Decisione della Commissione, del 23 maggio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di fibre
    tessili sintetiche in fiocco, diversi da nastri, velluti, felpe, tessuti ricci
    (compresi i tessuti ricci del tipo spugna) e tessuti di ciniglia, della sottovoce
    ex 56.07 A della tariffa doganale comune (codici Nimexe: 56.07-01, 04, 05, 07,
    08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) (categoria
    3), originari di Taiwan e messi in libera pratica negli altri Stati membri (Il
    testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/567/EEG: Beschikking van de Commissie van 23 mei 1979 waarbij de Franse
    Republiek wordt gemachtigd weefsels van synthetische stapelvezels, andere dan
    lint, fluweel, pluche, lussenweefsels (bad- en frotteerstof hieronder begrepen)
    en chenilleweefsel, van post ex 56.07 A van het gemeenschappelijk douanetarief
    (NIMEXE-code 56.07- 01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26,
    27, 28, 32, 33, 34, 36) (categorie 3), van oorsprong uit Taiwan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Franse taal is authentiek)'
