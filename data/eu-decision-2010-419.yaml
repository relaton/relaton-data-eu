---
id: EUDecision2010419
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2010/419/: Commission Decision of 28 July 2010 renewing the authorisation
    for continued marketing of products containing, consisting of, or produced from
    genetically modified maize Bt11 (SYN-BTØ11-1), authorising foods and food ingredients
    containing or consisting of field maize Bt11 (SYN-BTØ11-1) pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council and repealing
    Decision 2004/657/EC (notified under document C(2010) 5129)'
  type: main
- language: fr
  script: Latn
  content: '2010/419/: Décision de la Commission du 28 juillet 2010 renouvelant l’autorisation
    de mise sur le marché de produits contenant le maïs génétiquement modifié
    Bt11 (SYN-BTØ11-1), consistant en ce maïs ou produits à partir de celui-ci,
    autorisant les denrées et ingrédients alimentaires contenant le maïs Bt11 (SYN-BTØ11-1)
    ou consistant en ce maïs, en application du règlement (CE) n ° 1829/2003 du
    Parlement européen et du Conseil et abrogeant la décision 2004/657/CE [notifiée
    sous le numéro C(2010) 5129]'
  type: main
- language: de
  script: Latn
  content: '2010/419/: Beschluss der Kommission vom 28. Juli 2010 zur Erneuerung der
    Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten Mais
    der Sorte Bt11 (SYN-BTØ11-1) enthalten, aus ihm bestehen oder aus ihm gewonnen
    werden, zur Zulassung von Lebensmitteln und Lebensmittelzutaten, die Körnermais
    der Sorte Bt11 (SYN-BTØ11-1) enthalten oder aus ihm bestehen, gemäß der Verordnung
    (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates und zur Aufhebung
    der Entscheidung 2004/657/EG der Kommission (Bekannt gegeben unter Aktenzeichen
    K(2010) 5129)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/419/ЕС: Решение на Комисията от 28 юли 2010
    година за подновяване на разрешението за продължаване
    на търговията с продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица Bt11 (SYN-BTØ11-1), за разрешаване в съответствие
    с Регламент (ЕО) № 1829/2003 на Европейския парламент
    и на Съвета на храни и хранителни съставки,
    съдържащи или състоящи се от царевица Bt11 (SYN-BTØ11-1),
    и за отмяна на Решение 2004/657/ЕО (нотифицирано
    под номер C(2010) 5129)'
  type: main
- language: cs
  script: Latn
  content: '2010/419/: Rozhodnutí Komise ze dne 28. července 2010 , kterým se obnovuje
    povolení pro další uvádění produktů, které obsahují geneticky modifikovanou
    kukuřici Bt11 (SYN-BTØ11-1), sestávají z ní nebo jsou z ní vyrobeny, na
    trh, povolují potraviny a složky potravin, které obsahují kukuřici Bt11 (SYN-BTØ11-1)
    nebo z ní sestávají podle nařízení Evropského parlamentu a Rady (ES) č.
    1829/2003, a zrušuje rozhodnutí 2004/657/ES (oznámeno pod číslem K(2010)
    5129)'
  type: main
- language: da
  script: Latn
  content: '2010/419/: Kommissionens afgørelse af 28. juli 2010 om forlængelse af
    tilladelsen til fortsat markedsføring af produkter, der indeholder, består af
    eller er fremstillet af genetisk modificeret Bt11-majs (SYN-BTØ11-1), om godkendelse
    af fødevarer og fødevareingredienser, der indeholder eller består af Bt11-majs
    (SYN-BTØ11-1), jf. Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003,
    og om ophævelse af Kommissionens beslutning 2004/657/EF (meddelt under nummer
    K(2010) 5129)'
  type: main
- language: el
  script: Grek
  content: '2010/419/: Απόφαση της Επιτροπής, της 28ης Ιουλίου
    2010 , για την ανανέωση της έγκρισης για συνέχιση
    της εμπορίας προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    Bt11 (SYN-BTØ11-1), για την έγκριση τροφίμων και συστατικών
    τροφίμων που περιέχουν ή αποτελούνται από
    κτηνοτροφικό αραβόσιτο Bt11 (SYN-BTØ11-1) σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1829/2003 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου και για την
    κατάργηση της απόφασης 2004/657/ΕΚ [κοινοποιηθείσα
    υπό τον αριθμό Ε(2010) 5129]'
  type: main
- language: et
  script: Latn
  content: '2010/419/: Komisjoni otsus, 28. juuli 2010 , geneetiliselt muundatud maisi
    Bt11 (SYN-BTØ11-1) sisaldavate, sellest koosnevate või sellest valmistatud toodete
    edasise turustamise loa uuendamise kohta, Bt11 (SYN-BTØ11-1) põllumaisi sisaldava
    või sellest koosneva toidu ja toidu koostisosade lubamise kohta vastavalt Euroopa
    Parlamendi ja nõukogu määrusele (EÜ) nr 1829/2003 ning otsuse 2004/657/EÜ
    kehtetuks tunnistamise kohta (teatavaks tehtud numbri K(2010) 5129 all)'
  type: main
- language: fi
  script: Latn
  content: '2010/419/: Komission päätös, annettu 28 päivänä heinäkuuta 2010
    , muuntogeenistä maissia Bt11 (SYN-BTØ11-1) sisältävien, siitä koostuvien
    tai siitä valmistettujen tuotteiden kaupan pitämisen jatkumista koskevan luvan
    uusimisesta, luvan myöntämisestä rehumaissia Bt11 (SYN-BTØ11-1) sisältäville
    tai siitä koostuville elintarvikkeille ja elintarvikkeiden ainesosille Euroopan
    parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti sekä päätöksen
    2004/657/EY kumoamisesta (tiedoksiannettu numerolla K(2010) 5129)'
  type: main
- language: hu
  script: Latn
  content: '2010/419/: A Bizottság határozata ( 2010. július 28. ) a géntechnológiával
    módosított Bt11 (SYN-BTØ11-1) kukoricát tartalmazó, abból álló vagy abból
    előállított termékek folytatólagos forgalmazására adott engedély megújításáról,
    a Bt11 (SYN-BTØ11-1) szemes kukoricát tartalmazó vagy abból álló élelmiszereknek
    és élelmiszer-összetevőknek az 1829/2003/EK európai parlamenti és tanácsi
    rendelet szerinti engedélyezéséről, valamint a 2004/657/EK határozat hatályon
    kívül helyezéséről (az értesítés a C(2010) 5129. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2010/419/: Decisione della Commissione, del 28 luglio 2010 , che rinnova
    l’autorizzazione a continuare l’immissione in commercio di prodotti contenenti,
    costituiti o ottenuti a partire da granturco geneticamente modificato Bt11 (SYN-BTØ11-1),
    che autorizza alimenti e ingredienti alimentari contenenti o costituiti a partire
    da granoturco Bt11 (SYN-BTØ11-1), a norma del regolamento (CE) n. 1829/2003 del
    Parlamento europeo e del Consiglio, e che abroga la decisione 2004/657/CE [notificata
    con il numero C(2010) 5129]'
  type: main
- language: lv
  script: Latn
  content: '2010/419/: Komisijas Lēmums ( 2010. gada 28. jūlijs ), ar ko atjauno
    turpmāku tirdzniecības atļauju produktiem, kas satur ģenētiski modificētu
    kukurūzu Bt11 (SYN-BTØ11-1), sastāv vai ir ražoti no tās, ar ko atļauj pārtikas
    produktus un pārtikas produktu sastāvdaļas, kas satur ģenētiski modificētu
    lopbarības kukurūzu Bt11 (SYN-BTØ11-1) vai no tās sastāv, atbilstoši Eiropas
    Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 un ar ko atceļ Lēmumu 2004/657/EK
    (izziņots ar dokumenta numuru C(2010) 5129)'
  type: main
- language: lt
  script: Latn
  content: '2010/419/: 2010 m. liepos 28 d. Komisijos sprendimas, kuriuo atnaujinamas
    leidimas toliau prekiauti produktais, kurių sudėtyje yra genetiškai modifikuotų
    Bt11 (SYN-BTØ11–1) kukurūzų, kurie susideda arba yra pagaminti iš jų, kuriuo
    leidžiama naudoti maisto produktus ir maisto produktų ingredientus, kurių sudėtyje
    yra Bt11 (SYN-BTØ11–1) pašarinių kukurūzų, pagal Europos Parlamento ir
    Tarybos reglamentą (EB) Nr. 1829/2003, ir kuriuo panaikinamas Sprendimas 2004/657/EB
    (pranešta dokumentu Nr. C(2010) 5129)'
  type: main
- language: mt
  script: Latn
  content: '2010/419/: Deċiżjoni tal-Kummissjoni tat- 28 ta’ Lulju 2010 li ġġedded
    l-awtorizzazzjoni għall-issoktar tat-tqegħid fis-suq ta’ prodotti li fihom,
    jikkonsistu fi, jew huma prodotti minn qamħirrum li huwa ġenetikament modifikat
    Bt11 (SYN-BTØ11-1), li tawtorizza ikel u ingredjenti tal-ikel li fihom jew jikkonsistu
    f’qamħirrum imnixxef fuq il-post Bt11 (SYN-BTØ11-1) skont ir-Regolament (KE)
    Nru 1829/2003 tal-Parlament Ewropew u tal-Kusill u li tirrevoka d-Deċiżjoni
    2004/657/KE (notifikata bid-dokument numru C(2010) 5129)'
  type: main
- language: nl
  script: Latn
  content: '2010/419/: Besluit van de Commissie van 28 juli 2010 tot verlenging van
    de vergunning voor het verder in de handel brengen van producten die geheel of
    gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais Bt11 (SYN-BTØ11-1), tot verlening van een vergunning voor levensmiddelen
    en levensmiddeleningrediënten die geheel of gedeeltelijk bestaan uit veldmais
    Bt11 (SYN-BTØ11-1) overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees
    Parlement en de Raad, en tot intrekking van Beschikking 2004/657/EG (Kennisgeving
    geschied onder nummer C(2010) 5129)'
  type: main
- language: pl
  script: Latn
  content: '2010/419/: Decyzja Komisji z dnia 28 lipca 2010 r. odnawiająca zezwolenie
    na kontynuowanie obrotu produktami zawierającymi zmodyfikowaną genetycznie kukurydzę
    Bt11 (SYN-BTØ11-1), składającymi się z niej lub z niej wyprodukowanymi, dopuszczająca
    do obrotu na mocy rozporządzenia (WE) nr 1829/2003 Parlamentu Europejskiego i
    Rady żywność i składniki żywności zawierające kukurydzę pastewną Bt11
    (SYN-BTØ11-1) lub z niej się składające oraz uchylająca decyzję 2004/657/WE
    (notyfikowana jako dokument nr C(2010) 5129)'
  type: main
- language: pt
  script: Latn
  content: '2010/419/: Decisão da Comissão, de 28 de Julho de 2010 , que renova
    a autorização para o prosseguimento da comercialização de produtos que contenham,
    sejam constituídos por, ou produzidos a partir de milho geneticamente modificado
    Bt11 (SYN-BTØ11-1), autoriza os géneros alimentícios e ingredientes alimentares
    que contenham ou sejam constituídos por milho duro Bt11 (SYN-BTØ11-1) nos termos
    do Regulamento (CE) n. ° 1829/2003 do Parlamento Europeu e do Conselho e revoga
    a Decisão 2004/657/CE [notificada com o número C(2010) 5129]'
  type: main
- language: ro
  script: Latn
  content: '2010/419/: Decizia Comisiei din 28 iulie 2010 de prelungire a autorizației
    de continuare a comercializării produselor care conțin, constau în sau sunt
    produse din porumb modificat genetic Bt11 (SYN-BTØ11-1), de autorizare a alimentelor
    și a ingredientelor alimentare care conțin sau constau în porumb dinte-de-cal
    Bt11 (SYN-BTØ11-1) în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului
    European și al Consiliului și de abrogare a Deciziei 2004/657/CE [notificată
    cu numărul C(2010) 5129]'
  type: main
- language: sk
  script: Latn
  content: '2010/419/: Rozhodnutie Komisie z 28. júla 2010 , ktorým sa obnovuje
    povolenie na uvádzanie na trh výrobkov, ktoré obsahujú geneticky modifikovanú
    kukuricu Bt11 (SYN-BTØ11-1), sú z nej zložené alebo vyrobené, ktorým sa
    povoľujú potraviny a zložky potravín, ktoré obsahujú poľnú kukuricu Bt11
    (SYN-BTØ11-1) alebo sú z nej zložené, v súlade s nariadením Európskeho
    parlamentu a Rady (ES) č. 1829/2003 a ktorým sa zrušuje rozhodnutie Komisie
    2004/657/ES [oznámené pod číslom K(2010) 5129]'
  type: main
- language: sl
  script: Latn
  content: '2010/419/: Sklep Komisije z dne 28. julija 2010 o podaljšanju odobritve
    za nadaljnje trženje proizvodov, ki vsebujejo gensko spremenjeno koruzo Bt11
    (SYN-BTØ11-1), so iz nje sestavljeni ali proizvedeni, o odobritvi živil in živilskih
    sestavin, ki vsebujejo poljsko koruzo Bt11 (SYN-BTØ11-1) ali so iz nje sestavljeni,
    v skladu z Uredbo (ES) št. 1829/2003 Evropskega parlamenta in Sveta in razveljavitvi
    Odločbe 2004/657/ES (notificirano pod dokumentarno številko C(2010) 5129)'
  type: main
- language: es
  script: Latn
  content: '2010/419/: Decisión de la Comisión, de 28 de julio de 2010 , por la
    que se renueva la autorización para que sigan comercializándose los productos
    que contengan, se compongan o se hayan producido a partir de maíz modificado
    genéticamente Bt11 (SYN-BTØ11-1), por la que se autorizan los alimentos e ingredientes
    alimentarios que contengan o se compongan de maíz forrajero Bt11 (SYN-BTØ11-1)
    con arreglo al Reglamento (CE) n ° 1829/2003 del Parlamento Europeo y del Consejo
    y por la que se deroga la Decisión 2004/657/CE [notificada con el número C(2010)
    5129]'
  type: main
- language: sv
  script: Latn
  content: '2010/419/: Kommissionens beslut av den 28 juli 2010 om förlängning av
    godkännandet för fortsatt saluföring av produkter som innehåller, består
    av eller har framställts av genetiskt modifierad majs Bt11 (SYN-BTØ11-1), om
    godkännande av livsmedel och livsmedelsingredienser som innehåller eller består
    av fodermajs Bt11 (SYN-BTØ11-1) enligt Europaparlamentets och rådets förordning
    (EG) nr 1829/2003 och om upphävande av beslut 2004/657/EG [delgivet med nr K(2010)
    5129]'
