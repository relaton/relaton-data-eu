title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2153/89 of 18 July 1989 re-establishing
    the levying of customs duties on lysine and its esters and salts thereof falling
    within CN code 2922 41 00 originating in Mexico to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2153/89 de la Commission du 18 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables à la lysine
    et ses esters et aux sels de ces produits du code de la nomenclature combinée
    2922 41 00 originaires du Mexique bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2153/89 DER KOMMISSION vom 18. Juli 1989 zur Wiedereinführung
    der Erhebung der Zölle für Lysin und seine Ester und für Salze dieser Erzeugnisse
    des KN-Code 2922 41 00 mit Ursprung in Mexiko, dem die in der Verordnung (EWG)
    Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2153/89 af 18. juli 1989 om genindførelse
    af opkrævning af told for lysin og estere deraf og salte af disse produkter henhørende
    under KN-kode 2922 41 00 og med oprindelse i Mexico, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2153/89 της Επιτροπής
    της 18ης Ιουλίου 1989 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τη λυσίνη και τους
    εστέρες της, καθώς και άλατα των προϊόντων
    αυτών του κωδικού ΣΟ 2922 41 00, καταγωγής Μεξικού,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 4257/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2153/89 DELLA COMMISSIONE del 18 luglio 1989 che
    ripristina la riscossione dei dazi doganali applicabili alla lisina e suoi esteri
    e sali di tali prodotti, del codice NC 2922 41 00, originari del Messico, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 4257/88 del Consiglio
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2153/89 VAN DE COMMISSIE van 18 juli 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op lysine en esters
    daarvan en zouten van deze produkten van GN-code 2922 41 00, van oorsprong uit
    Mexico, waarvoor de in Verordening (EEG) nr. 4257/88 van de Raad vermelde tariefpreferenties
    zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2153/89 DA COMISSÃO de 18 de Julho de 1989 que
