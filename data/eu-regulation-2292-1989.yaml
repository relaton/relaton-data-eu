title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2292/89 of 27 July 1989 amending Regulation
    (EEC) No 1958/89 fixing for the 1989/90 marketing year the minimum price to be
    paid to producers for unprocessed sultanas, currants and "Moscatel" and the amount
    of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2292/89 de la Commission du 27 juillet 1989 modifiant
    le règlement (CEE) n° 1958/89 fixant, pour la campagne de commercialisation
    1989/1990, le prix minimal à payer aux producteurs pour les sultanines, les raisins
    secs de Corinthe et les variétés Moscatel non transformés, ainsi que le montant
    de l'aide à la production pour ces raisins secs
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2292/89 DER KOMMISSION vom 27. Juli 1989 zur Änderung
    der Verordnung (EWG) Nr. 1958/89 zur Festsetzung des den Erzeugern unverarbeiteter
    Sultaninen, Korinthen und Moscatel zu zahlenden Mindestpreises sowie der Produktionsbeihilfe
    für diese getrockneten Korinthen im Wirtschaftsjahr 1989/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2292/89 af 27. juli 1989 om ændring
    af forordning (EØF) nr. 1958/89 om fastsættelse af den minimumspris, der skal
    betales producenten for uforarbejdede sultanas, korender og muskateller, samt
    af producentstøtten for disse tørrede druer for produktionsåret 1989/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2292/89 της Επιτροπής
    της 27ης Ιουλίου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 1958/89 που καθορίζει, για την περίοδο
    εμπορίας 1989/90, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για μη μεταποιημένες σουλτανίνες,
    κορινθιακές σταφίδες και σταφίδες moscatel, καθώς
    και το ποσό της ενίσχυσης στην παραγωγή γι'
    αυτές τις σταφίδες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2292/89 DELLA COMMISSIONE del 27 luglio 1989 che
    modifica il regolamento (CEE) n. 1958/89 che fissa, per la campagna di commercializzazione
    1989/1990, il prezzo minimo da pagare al produttori di uva sultanina, di uva secca
    di Corinto e di Moscatel non trasformate e l'' importo dell'' aiuto alla produzione
    per le dette uve #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2292/89 VAN DE COMMISSIE van 27 juli 1989 tot wijziging
    van Verordening (EEG) nr. 1958/89 tot vaststelling, voor het verkoopseizoen 1989/1990,
    van de aan de telers voor sultanarozijnen, krenten (basisprodukt) en Moscatel
    te betalen minimumprijs, alsmede van het bedrag van de steun bij de produktie
    van deze rozijnen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2292/89 DA COMISSÃO de 27 de Julho de 1989 que
