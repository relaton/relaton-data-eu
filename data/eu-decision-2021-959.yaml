  content: Political and Security Committee Decision (CFSP) 2021/959 of 10 June 2021
    extending the mandate of the Head of Mission of the European Union Rule of Law
    Mission in Kosovo (This designation is without prejudice to positions on status,
    and is in line with UNSCR 1244 (1999) and the ICJ Opinion on the Kosovo declaration
    of independence.) (EULEX KOSOVO) (EULEX KOSOVO/1/2021)
  type: main
