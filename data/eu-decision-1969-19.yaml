title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 20 décembre 1968, portant augmentation
    du volume du contingent tarifaire octroyé à la République italienne pour les
    thons frais, réfrigérés ou congelés, destinés à l'industrie de la conserve
    de poisson (position Ex 03.01 B I B))
  type: main
- language: de
  script: Latn
  content: '69/19/EWG: Entscheidung der Kommission vom 20. Dezember 1968 über die
    Erhöhung des der Italienischen Republik gewährten Zollkontingents für Thunfisch,
    frisch, gekühlt oder gefroren, für die Konservenindustrie (Tarifnummer ex 03.01
    B I b))'
  type: main
- language: it
  script: Latn
  content: '69/19/CEE: Decisione della Commissione, del 20 dicembre 1968, relativa
    all''aumento del contingente tariffario concesso alla Repubblica italiana per
    i tonni freschi, refrigerati o congelati, destinati all''industria conserviera
    (voce ex 03.01 B I b))'
  type: main
- language: nl
  script: Latn
  content: '69/19/EEG: Beschikking van de Commissie van 20 december 1968 houdende
    vergroting van het aan de Italiaanse Republiek toegekende tariefcontingent voor
    tonijn, vers, gekoeld of bevroren, bestemd voor de visconservenindustrie (tariefpost
    ex 03.01 B I b))'
