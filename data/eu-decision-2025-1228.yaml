  script: Latn
  content: Decisione (UE) 2025/1228 del Parlamento europeo e del Consiglio, del 17
    giugno 2025, che modifica la decisione 2003/17/CE del Consiglio per quanto riguarda
    l’equivalenza delle ispezioni in campo delle colture di piante foraggere destinate
    alla produzione di sementi effettuate nella Repubblica di Moldova e l’equivalenza
    delle sementi di piante foraggere prodotte nella Repubblica di Moldova, nonché
    l’equivalenza delle ispezioni in campo delle colture di barbabietole destinate
    alla produzione di sementi e delle colture di piante oleaginose destinate alla
    produzione di sementi effettuate in Ucraina e l’equivalenza delle sementi di
    barbabietole e delle sementi di piante oleaginose prodotte in Ucraina
  type: main
