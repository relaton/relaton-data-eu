    von Feldbesichtigungen der Vermehrungsbestände von Futterpflanzensaatgut in der
    Republik Moldau und der Gleichstellung des in der Republik Moldau erzeugtem Futterpflanzensaatguts
    sowie zur Gleichstellung von Feldbesichtigungen der Vermehrungsbestände von Betarübensaatgut
    und der Vermehrungsbestände von Ölpflanzensaatgut in der Ukraine und der Gleichstellung
    des in der Ukraine erzeugten Betarüben- und Ölpflanzensaatguts
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2025/1228 на Европейския парламент
    и на Съвета от 17 юни 2025 година за изменение
    на Решение 2003/17/ЕО на Съвета по отношение на
    еквивалентността на полските инспекции на
    посеви за производство на семена от фуражни
    култури, извършвани в Република Молдова, и
    по отношение на еквивалентността на семената
    от фуражни култури, произведени в Република
    Молдова, както и по отношение на еквивалентността
    на полските инспекции на посеви за производство
    на семена от цвекло и маслодайни семена, извършвани
    в Украйна, и по отношение на еквивалентността
    на семената от цвекло и маслодайни семена,
    произведени в Украйна
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady (EU) 2025/1228 ze dne 17. června
    2025, kterým se mění rozhodnutí Rady 2003/17/ES, pokud jde o rovnocennost
    přehlídek porostu prováděných v Moldavské republice u množitelského porostu
    pro produkci osiva pícnin a rovnocennost osiva pícnin vyprodukovaného v Moldavské
    republice a pokud jde o rovnocennost přehlídek porostu prováděných na Ukrajině
    u množitelského porostu pro produkci osiva řepy a množitelského porostu pro
    produkci osiva olejnin a rovnocennost osiva řepy a osiva olejnin vyprodukovaných
    na Ukrajině
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets afgørelse (EU) 2025/1228 af 17. juni 2025
    om ændring af Rådets beslutning 2003/17/EF for så vidt angår ligestilling
    af markinspektioner i Republikken Moldova af afgrøder til formering af frø af
    foderplanter og ligestilling af frø af foderplanter, der er produceret i Republikken
    Moldova, og for så vidt angår ligestilling af markinspektioner af afgrøder
    til formering af frø af roer og olieplanter i Ukraine og ligestilling af frø
    af roer og olieplanter produceret i Ukraine
  type: main
