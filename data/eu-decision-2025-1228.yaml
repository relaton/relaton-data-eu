  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös (EU) 2025/1228, annettu 17
    päivänä kesäkuuta 2025, neuvoston päätöksen 2003/17/EY muuttamisesta siltä
    osin kuin on kyse Moldovan tasavallassa rehukasvien siemenviljelmillä tehtyjen
    viljelystarkastusten vastaavuudesta ja Moldovan tasavallassa tuotettujen rehukasvien
    siementen vastaavuudesta, ja siltä osin kuin on kyse Ukrainassa juurikkaiden
    ja öljykasvien siemenviljelmillä tehtyjen viljelystarkastusten vastaavuudesta
    ja Ukrainassa tuotettujen juurikkaiden ja öljykasvien siementen vastaavuudesta
  type: main
