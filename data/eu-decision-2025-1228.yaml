    kasvatatavate seemnekultuuride põldtunnustamise samaväärsuse ja Moldova Vabariigis
    kasvatatud söödakultuuride seemne samaväärsuse ning Ukrainas peedi ja õlitaimede
    seemnekultuuride põldtunnustamise samaväärsuse ja Ukrainas kasvatatud peedi-
