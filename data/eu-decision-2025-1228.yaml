title:
- language: en
  script: Latn
  content: Decision (EU) 2025/1228 of the European Parliament and of the Council of
    17 June 2025 amending Council Decision 2003/17/EC as regards the equivalence of
    field inspections carried out in the Republic of Moldova on seed-producing fodder
    plant crops and on the equivalence of fodder plant seed produced in the Republic
    of Moldova, and as regards the equivalence of field inspections carried out in
    Ukraine on seed-producing beet crops and seed-producing oil plant crops and on
    the equivalence of beet seed and oil plant seed produced in Ukraine
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1228 du Parlement européen et du Conseil du 17 juin
    2025 modifiant la décision 2003/17/CE du Conseil en ce qui concerne l’équivalence
    des inspections sur pied des cultures productrices de semences de plantes fourragères
    effectuées en République de Moldavie et l’équivalence des semences de plantes
    fourragères produites en République de Moldavie, et en ce qui concerne l’équivalence
    des inspections sur pied des cultures productrices de semences de betteraves et
    des cultures productrices de semences de plantes oléagineuses, effectuées en
    Ukraine, et l’équivalence des semences de betteraves et des semences de plantes
    oléagineuses produites en Ukraine
  type: main
- language: de
  script: Latn
