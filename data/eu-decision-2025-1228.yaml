    das inspeções de campo de culturas de plantas forrageiras para produção de
    sementes efetuadas na República da Moldávia e à equivalência das sementes
    de plantas forrageiras produzidas na República da Moldávia, e relativa à equivalência
    das inspeções de campo de culturas de beterraba para produção de sementes
    e de culturas de plantas oleaginosas para produção de sementes efetuadas na
    Ucrânia e à equivalência das sementes de beterraba e de plantas oleaginosas
    produzidas na Ucrânia
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2025/1228 a Parlamentului European și a Consiliului din 17
    iunie 2025 de modificare a Deciziei 2003/17/CE a Consiliului în ceea ce privește
    echivalența inspecțiilor în câmp efectuate în Republica Moldova la culturile
    de plante furajere producătoare de semințe și echivalența semințelor de plante
    furajere produse în Republica Moldova, precum și în ceea ce privește echivalența
    inspecțiilor în câmp efectuate în Ucraina la culturile de sfeclă producătoare
    de semințe și la culturile de plante oleaginoase producătoare de semințe și
    în ceea ce privește echivalența semințelor de sfeclă și a semințelor de
    plante oleaginoase produse în Ucraina
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady (EÚ) 2025/1228 zo 17. júna
    2025, ktorým sa mení rozhodnutie Rady 2003/17/ES, pokiaľ ide o rovnocennosť
    terénnych inšpekcií uskutočňovaných v Moldavskej republike na množiteľskom
    poraste pre produkciu osiva krmovín a o rovnocennosť osiva krmovín vyprodukovaného
    v Moldavskej republike a o rovnocennosť terénnych inšpekcií uskutočňovaných
    na Ukrajine na množiteľskom poraste pre produkciu osiva repy a množiteľskom
    poraste pre produkciu osiva olejnín a o rovnocennosť osiva repy a osiva olejnín
    vyprodukovaného na Ukrajine
  type: main
- language: sl
  script: Latn
  content: Sklep (EU) 2025/1228 Evropskega parlamenta in Sveta z dne 17. junija 2025
    o spremembi Odločbe Sveta 2003/17/ES o enakovrednosti poljskih pregledov semenskih
    posevkov krmnih rastlin v Republiki Moldaviji in o enakovrednosti semena krmnih
    rastlin, pridelanega v Republiki Moldaviji, ter o enakovrednosti poljskih pregledov
    semenskih posevkov pese in semenskih posevkov oljnic v Ukrajini, in o enakovrednosti
    semena pese in semena oljnic, pridelana v Ukrajini
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2025/1228 del Parlamento Europeo y del Consejo, de 17 de
    junio de 2025, por la que se modifica la Decisión 2003/17/CE del Consejo en lo
    que respecta a la equivalencia de las inspecciones sobre el terreno realizadas
    en la República de Moldavia en cultivos de plantas forrajeras productoras de
    semillas y a la equivalencia de las semillas de plantas forrajeras producidas
    en la República de Moldavia, así como en lo que respecta a la equivalencia de
    las inspecciones sobre el terreno realizadas en Ucrania en cultivos de remolacha
    productora de semillas y en cultivos de plantas oleaginosas productoras de semillas
    y a la equivalencia de las semillas de remolacha y de las semillas de plantas
    oleaginosas producidas en Ucrania
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut (EU) 2025/1228 av den 17 juni 2025
    om ändring av rådets beslut 2003/17/EG vad gäller likvärdighet av fältbesiktningar
    i Republiken Moldavien av utsädesodlingar av foderväxter och likvärdighet avseende
    utsäde av foderväxter producerat i Republiken Moldavien, och vad gäller likvärdighet
    av fältbesiktningar i Ukraina av utsädesodlingar av beta och utsädesodlingar
    av oljeväxter och likvärdighet av utsäde av beta och oljeväxter producerat
    i Ukraina
