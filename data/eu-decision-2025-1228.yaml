    2025 tot wijziging van Beschikking 2003/17/EG van de Raad wat betreft de gelijkwaardigheid
    van in de Republiek Moldavië verrichte veldkeuringen van groenvoedergewassen
    voor de teelt van zaaizaad en de gelijkwaardigheid van in de Republiek Moldavië
    voortgebracht zaaizaad van groenvoedergewassen, en wat betreft de gelijkwaardigheid
