  script: Latn
  content: Odluka (EU) 2025/1228 Europskog parlamenta i Vijeća od 17. lipnja 2025.
    o izmjeni Odluke Vijeća 2003/17/EZ u pogledu jednakovrijednosti pregleda usjeva
    na terenu koji se provode u Republici Moldovi na sjemenskim usjevima krmnog bilja
    i o jednakovrijednosti sjemena krmnog bilja proizvedenog u Republici Moldovi te
    u pogledu jednakovrijednosti pregleda usjeva na terenu koji se provode u Ukrajini
    na sjemenskim usjevima repe i sjemenskim usjevima uljarica i o jednakovrijednosti
    sjemena repe i sjemena uljarica proizvedenog u Ukrajini
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2025/1228 határozata (2025. június
    17.) a 2003/17/EK tanácsi határozatnak a Moldovai Köztársaságban a takarmánynövények
    vetőmagtermesztése tekintetében végzett szántóföldi ellenőrzések egyenértékűsége
    és a Moldovai Köztársaságban termesztett takarmánynövény-vetőmagok egyenértékűsége,
    valamint az Ukrajnában a takarmányrépa vetőmagtermesztése és az olajnövények
    vetőmagtermesztése tekintetében végzett szántóföldi ellenőrzések egyenértékűsége
    és az Ukrajnában termesztett takarmányrépa- és olajnövényvetőmagok egyenértékűsége
    tekintetében történő módosításáról
  type: main
