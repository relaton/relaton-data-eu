  script: Latn
  content: Cinneadh (AE) 2025/1228 ó Pharlaimint na hEorpa agus ón gComhairle an
    17 Meitheamh 2025 lena leasaítear Cinneadh 2003/17/CE ón gComhairle a mhéid
    a bhaineann le coibhéis cigireachtaí allamuigh a dhéantar i bPoblacht na Moldóive
    ar bharra táirgthe síl plandaí farae agus ar choibhéis síl plandaí farae
    a tháirgtear i bPoblacht na Moldóive, agus a mhéid a bhaineann le coibhéis
    cigireachtaí allamuigh a dhéantar san Úcráin ar bharra táirgthe síl biatais
    agus barra táirgthe síl plandaí ola agus ar choibhéis síl biatais agus síl
    plandaí ola a tháirgtear san Úcráin
  type: main
