  content: Decyzja Parlamentu Europejskiego i Rady (UE) 2025/1228 z dnia 17 czerwca
    2025 r. w sprawie zmiany decyzji Rady 2003/17/WE w odniesieniu do równoważności
    inspekcji polowych przeprowadzanych w Republice Mołdawii w odniesieniu do upraw
