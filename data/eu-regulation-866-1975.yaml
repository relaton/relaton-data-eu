title:
- language: en
  script: Latn
  content: Regulation (EEC) No 866/75 of the Council of 18 March 1975 on the implementation,
    until the entry into force of the trade provisions of the convention which is
    to succeed the convention of 29 July 1969 and at the latest until 31 December
    1975, of Decision No 47/74 of the EEC- AASM Association Council derogating from
    the definition of the concept of "originating products" in order to take account
    of the special situation of Mauritius with regard to certain textile products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 866/75 du Conseil du 18 mars 1975 portant application,
    jusqu'à la mise en vigueur des dispositions commerciales de la convention qui
    succédera à la convention du 29 juillet 1969, et au plus tard jusqu'au 31 décembre
    1975, de la décision n° 47/74 du Conseil d'association CEE-EAMA portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière de l'île Maurice en ce qui concerne certains produits
    de l'industrie textile
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 866/75 DES RATES vom 18. März 1975 zur Durchführung
    - bis zum Inkrafttreten der Handelsbestimmungen des Abkommens, das Abkommen vom
    29. Juli 1969 erstzen soll, und längstens bis zum 31. Dezember 1975 - des Beschlusses
    Nr. 47/74 des Assoziationsrats EWG - AASM über eine Ausnahme von der Begriffsbestimmung
    für Ursprungserzeugnisse mit Rücksicht auf die besondere Lage von Mauritius
    bei bestimmten Erzeugnissen der Textilindustrie
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 866/75 af 18. marts 1975 om anvendelse indtil
    ikrafttrædelsen af handelsbestemmelserne i den konvention, der skal erstatte
    konventionen af 29. juli 1969, og senest indtil den 31. december 1975, af afgørelse
    nr. 47/74 truffet af Associeringsrådet EØF-AASM om afvigelse fra definitionen
    af begrebet »varer med oprindelsesstatus« for at tage hensyn til Mauritius'
    særlige stilling for så vidt angår visse af tekstilindustriens varer
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 866/75 DEL CONSIGLIO del 18 marzo 1975 riguardante
    l' applicazione, fino all' entrata in vigore delle disposizioni commerciali della
    convenzione che succederà alla convenzione del 29 luglio 1969, e comunque non
    oltre il 31 dicembre 1975, della decisione n. 47/74 del Consiglio di associazione
    CEE-SAMA che prevede una deroga alla definizione della nozione di «prodotti originari»
    per tener conto della situazione particolare di Maurizio per quanto riguarda taluni
    prodotti dell' industria tessile
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr 866/75 VAN DE RAAD van 18 maart 1975 houdende toepassing,
    tot de inwerkingtreding van de handelsbepalingen van de overeenkomst die de Overeenkomst
    van 29 juli 1969 opvolgt en uiterlijk tot en met 31 december 1975, van Besluit
    nr. 47/74 van de Associatieraad E.E.G.-G.A.S.M. houdende afwijking van de definitie
    van het begrip "produkten van oorsprong" ten einde rekening te houden met de bijzondere
    situatie van Mauritius ten aanzien van bepaalde produkten van de textielindustrie
  type: main
