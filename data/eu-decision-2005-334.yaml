    Řecká republika přijala v reakci na doporučení Rady vydané podle čl. 104
    odst. 7 uvedené smlouvy účinná opatření'
  type: main
- language: da
  script: Latn
  content: '2005/334/EF: Rådets beslutning af 18. januar 2005 om konstatering af,
