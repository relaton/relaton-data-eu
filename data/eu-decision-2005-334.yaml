    traktaten om oprettelse af Det Europæiske Fællesskab, har truffet virkningsfulde
    foranstaltninger til opfølgning af Rådets henstillinger i overensstemmelse med
    artikel 104, stk. 7'
  type: main
- language: el
  script: Grek
  content: '2005/334/EK: Απόφαση του Συμβουλίου, της 18ης
    Ιανουαρίου 2005, με την οποία διαπιστώνεται,
