title:
- language: en
  script: Latn
  content: '2005/334/EC: Council Decision of 18 January 2005 establishing, in accordance
    with Article 104(8) of the Treaty establishing the European Community, whether
    effective action has been taken by the Hellenic Republic in response to recommendations
    of the Council in accordance with Article 104(7) of that Treaty'
  type: main
- language: fr
  script: Latn
  content: '2005/334/CE: Décision du Conseil du 18 janvier 2005 établissant, conformément
    à l’article 104, paragraphe 8, du traité instituant la Communauté européenne,
    si une action suivie d’effets a été menée par la République hellénique
    en réponse aux recommandations émises par le Conseil conformément à l’article
    104, paragraphe 7, dudit traité'
  type: main
- language: de
  script: Latn
  content: '2005/334/EG: Entscheidung des Rates vom 18. Januar 2005 zur Feststellung
    gemäß Artikel 104 Absatz 8 des Vertrags zur Gründung der Europäischen Gemeinschaft,
