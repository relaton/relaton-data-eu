    για την ίδρυση της Ευρωπαϊκής Κοινότητας, κατά
    πόσον ανελήφθη αποτελεσματική δράση από την
    Ελληνική Δημοκρατία σε εφαρμογή των συστάσεων
    που της απηύθυνε το Συμβούλιο σύμφωνα με το
