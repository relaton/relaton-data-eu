  content: Council Decision of 27 October 1970 on the conclusion of a tariff Agreement
    in respect of certain cheeses negotiated with Spain during consultations with
    that country under Article XIX of GATT
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 27 octobre 1970, portant conclusion d'un accord
    tarifaire négocié avec l'Espagne au sujet de certains fromages dans le cadre
    des consultations engagées avec ce pays au titre de l'article XIX du GATT
  type: main
- language: de
  script: Latn
  content: '70/498/EWG: Beschluß des Rates vom 27. Oktober 1970 über den Abschluß
    eines mit Spanien im Rahmen der Konsultationen gemäß Artikel XIX des GATT ausgehandelten
    Zollabkommens für bestimmte Käsesorten'
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse af 27. oktober 1970 om indgåelse af en med Spanien
    forhandlet toldaftale om visse oste inden for rammerne af de i henhold til GATT's
    artikel XIX førte forhandlinger med dette land
  type: main
- language: it
  script: Latn
  content: '70/498/CEE: Decisione del Consiglio, del 27 ottobre 1970, relativa alla
    conclusione di un accordo tariffario su taluni formaggi negoziato con la Spagna
    nel quadro delle consultazioni avviate con questo paese a norma dell''articolo
    XIX del GATT'
  type: main
- language: nl
  script: Latn
  content: '70/498/EEG: Besluit van de Raad van 27 oktober 1970 houdende sluiting
    van een tariefakkoord waarover met Spanje betreffende bepaalde kaassoorten is
    onderhandeld in het kader van het met dit land uit hoofde van artikel XIX van
    het GATT gepleegde overleg'
