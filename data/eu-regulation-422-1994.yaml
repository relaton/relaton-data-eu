title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 422/94 of 25 February 1994 determining the
    extent to which applications lodged in February 1994 for import licences for certain
    pigmeat products under the regime provided for by the Intermediate Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 422/94 de la Commission du 25 février 1994 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    février 1994 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords intérimaires conclus par la Communauté avec la
    Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 422/94 DER KOMMISSION vom 25. Februar 1994 über die
    Festsetzung des Umfangs, in dem die im Februar 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Interimsabkommen
    zwischen der Gemeinschaft und Bulgarien sowie Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 422/94 af 25. februar 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i februar
    1994 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de interimsaftaler, som Fællesskabet har indgået med Bulgarien
    og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 422/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Φεβρουαρίου 1994 περί καθορισμού ορίων
    εντός των οποίων δύναται να γίνει αποδεκτή
    η αίτηση που υποβλήθηκε το Φεβρουάριο του 1994
    για άδειες εισαγωγής χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τις ενδιάμεσες
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: it
  script: Latn
