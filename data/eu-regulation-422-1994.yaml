    entro quali limiti possono essere accettate le domande di titoli d' importazione
    presentate nel mese di febbraio 1994 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi intermedi conclusi tra la Comunità
    e la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 422/94 VAN DE COMMISSIE van 25 februari 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die in februari 1994 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Interimovereenkomsten met Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 422/94 DA COMISSÃO de 25 de Fevereiro de 1994 que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Fevereiro
    de 1994 ao abrigo do regime previsto nos acordos provisórios concluídos pela
