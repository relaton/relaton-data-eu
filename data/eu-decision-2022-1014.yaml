  content: Decisión (UE) 2022/1014 del Consejo de 17 de junio de 2022 relativa a
    la posición que debe adoptarse en nombre de la Unión con respecto al Reino Unido
    de Gran Bretaña e Irlanda del Norte en relación con la fijación, de conformidad
    con el artículo 540, apartado 2, del Acuerdo de Comercio y Cooperación entre
    la Unión Europea y la Comunidad Europea de la Energía Atómica, por una parte,
    y el Reino Unido de Gran Bretaña e Irlanda del Norte, por otra, de la fecha a
