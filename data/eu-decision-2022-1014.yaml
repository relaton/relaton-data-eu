    от държавите членки на Обединеното кралство
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/1014 ze dne 17. června 2022 o postoji, který
    má být zaujat jménem Unie vůči Spojenému království Velké Británie a
    Severního Irska, pokud jde o určení data podle čl. 540 odst. 2 Dohody o obchodu
    a spolupráci mezi Evropskou unií a Evropským společenstvím pro atomovou energii
    na jedné straně a Spojeným královstvím Velké Británie a Severního Irska
    na straně druhé, od něhož mohou členské státy zahájit předávání osobních
    údajů týkajících se profilů DNA a daktyloskopických údajů Spojenému
    království podle článků 530, 531, 534 a 536 uvedené dohody
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/1014 af 17. juni 2022 om den holdning, der
    skal indtages på Unionens vegne over for Det Forenede Kongerige Storbritannien
    og Nordirland med hensyn til fastsættelsen i henhold til artikel 540, stk. 2,
    i handels- og samarbejdsaftalen mellem Den Europæiske Union og Det Europæiske
    Atomenergifællesskab på den ene side og Det Forenede Kongerige Storbritannien
    og Nordirland på den anden side, af den dato, hvorfra medlemsstaterne kan videregive
    personoplysninger vedrørende DNA-profiler og fingeraftryksoplysninger til Det
    Forenede Kongerige, jf. nævnte aftales artikel 530, 531, 534 og 536
  type: main
