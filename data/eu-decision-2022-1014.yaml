  content: Rådets beslut (EU) 2022/1014 av den 17 juni 2022 om den ståndpunkt som
    ska intas på unionens vägnar gentemot Förenade konungariket Storbritannien
    och Nordirland vad gäller fastställande enligt artikel 540.2 i avtalet om handel
    och samarbete mellan Europeiska unionen och Europeiska atomenergigemenskapen,
    å ena sidan, och Förenade konungariket Storbritannien och Nordirland, å andra
