  content: Neuvoston päätös (EU) 2022/1014, annettu 17 päivänä kesäkuuta 2022,
    unionin puolesta otettavasta kannasta Ison-Britannian ja Pohjois-Irlannin yhdistyneeseen
    kuningaskuntaan nähden siltä osin kuin on kyse sen päivämäärän määrittämisestä
