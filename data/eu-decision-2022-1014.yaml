    προσωπικού χαρακτήρα όσον αφορά προφίλ DNA και
    δακτυλικά αποτυπώματα, όπως αναφέρεται στα
    άρθρα 530, 531, 534 και 536 της εν λόγω συμφωνίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/1014, 17. juuni 2022, liidu nimel võetava seisukoha
    kohta Suurbritannia ja Põhja-Iiri Ühendkuningriigi suhtes seoses sellise kuupäeva
    kindlaksmääramisega ühelt poolt Euroopa Liidu ja Euroopa Aatomienergiaühenduse
    ning teiselt poolt Suurbritannia ja Põhja-Iiri Ühendkuningriigi vahelise kaubandus-
    ja koostöölepingu artikli 540 lõike 2 alusel, millest alates võivad liikmesriigid
    edastada Ühendkuningriigile kõnealuse lepingu artiklites 530, 531, 534 ja 536
    osutatud DNA-profiilide ja daktüloskoopiliste andmetega seotud isikuandmeid
  type: main
