  script: Latn
  content: A Tanács (EU) 2022/1014 határozata (2022. június 17.) Nagy-Britannia
    és Észak-Írország Egyesült Királysága tekintetében az egyrészről az
    Európai Unió és az Európai Atomenergia-közösség, és másrészről Nagy-Britannia
    és Észak-Írország Egyesült Királysága közötti kereskedelmi és együttműködési
    megállapodás 540. cikkének (2) bekezdése alapján az említett megállapodás
    530., 531., 534. és 536. cikkében említettek szerinti, DNS-profilokra és daktiloszkópiai
    adatokra vonatkozó személyes adatok tagállamok általi, az Egyesült Királyság
    részére történő lehetséges szolgáltatása időpontjának meghatározásával
    kapcsolatban az Unió által képviselendő álláspontról
  type: main
