id: EUDecision20221014
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/1014 of 17 June 2022 on the position to be taken
    on behalf of the Union vis-à-vis the United Kingdom of Great Britain and Northern
    Ireland regarding the determination under Article 540(2) of the Trade and Cooperation
    Agreement between the European Union and the European Atomic Energy Community,
    of the one part, and the United Kingdom of Great Britain and Northern Ireland,
    of the other part, of the date from which personal data relating to DNA profiles
    and dactyloscopic data as referred to in Articles 530, 531, 534 and 536 of that
    Agreement may be supplied by Member States to the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/1014 du Conseil du 17 juin 2022 relative à la position
    à prendre, au nom de l’Union, à l’égard du Royaume-Uni de Grande-Bretagne
    et d’Irlande du Nord en ce qui concerne la détermination, en vertu de l’article
    540, paragraphe 2, de l’accord de commerce et de coopération entre l’Union
    européenne et la Communauté européenne de l’énergie atomique, d’une part,
    et le Royaume-Uni de Grande-Bretagne et d’Irlande du Nord, d’autre part, de
    la date à partir de laquelle les États membres peuvent communiquer au Royaume-Uni
    les données à caractère personnel relatives aux profils ADN et aux données
    dactyloscopiques visées aux articles 530, 531, 534 et 536 dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/1014 des Rates vom 17. Juni 2022 über den im Namen
    der Europäischen Union gegenüber dem Vereinigten Königreich Großbritannien
    und Nordirland in Bezug auf den nach Artikel 540 Absatz 2 des Abkommens über
    Handel und Zusammenarbeit zwischen der Europäischen Union und der Europäischen
    Atomgemeinschaft einerseits und dem Vereinigten Königreich Großbritannien und
    Nordirland andererseits festzulegenden Zeitpunkt, ab dem personenbezogene Daten
    betreffend DNA-Profile und daktyloskopische Daten gemäß den Artikeln 530, 531,
    534 und 536 jenes Abkommens von den Mitgliedstaaten an das Vereinigte Königreich
    übermittelt werden dürfen, zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
