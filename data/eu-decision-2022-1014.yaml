    yhdistyneen kuningaskunnan välisen kauppa- ja yhteistyösopimuksen 540 artiklan
    2 kohdan nojalla, josta alkaen jäsenvaltiot voivat toimittaa kyseisen sopimuksen
    530, 531, 534 ja 536 artiklassa tarkoitettuihin DNA-tunnisteisiin ja sormenjälkitietoihin
    liittyviä henkilötietoja Yhdistyneelle kuningaskunnalle
  type: main
