  script: Latn
  content: Odluka Vijeća (EU) 2022/1014 od 17. lipnja 2022. o stajalištu koje treba
    zauzeti u ime Unije prema Ujedinjenoj Kraljevini Velike Britanije i Sjeverne Irske
    u pogledu utvrđivanja u skladu s člankom 540. stavkom 2. Sporazuma o trgovini
    i suradnji između Europske unije i Europske zajednice za atomsku energiju, s
    jedne strane, i Ujedinjene Kraljevine Velike Britanije i Sjeverne Irske, s druge
    strane, datuma od kojeg države članice mogu Ujedinjenoj Kraljevini dostavljati
    osobne podatke povezane s profilima DNK-a i daktiloskopske podatke kako je navedeno
    u člancima 530., 531., 534. i 536. tog sporazuma
  type: main
