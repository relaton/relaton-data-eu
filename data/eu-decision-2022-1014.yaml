    Βασιλείου της Μεγάλης Βρετανίας και της Βόρειας
    Ιρλανδίας όσον αφορά τον καθορισμό βάσει του
    άρθρου 540 παράγραφος 2 της συμφωνίας εμπορίου
    και συνεργασίας μεταξύ της Ευρωπαϊκής Ένωσης
