title:
- language: en
  script: Latn
  content: '81/96/EEC: Commission Decision of 2 February 1981 authorizing Ireland
    not to apply Community treatment to shirts, T-shirts, lightweight fine knit roll,
    polo or turtle necked jumpers and pullovers, undervests and the like, originating
    in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/96/CEE: Décision de la Commission, du 2 février 1981, autorisant
    l''Irlande à exclure du traitement communautaire les chemises, chemisettes, "T-shirts",
    sous-"pulls", maillots de corps et articles similaires, originaires de Hong-kong
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/96/EWG: Entscheidung der Kommission vom 2. Februar 1981 zur Ermächtigung
    Irlands, aus Hongkong stammende Oberhemden, T-Shirts, Unterziehpullis, Unterhemden
    und dergleichen von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/96/EØF: Kommissionens beslutning af 2. februar 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, herunder sports-
    og arbejdsskjorter, T-shirts, T-shirts med rullekrave, undertrøjer o. l., med
    oprindelse i Hongkong (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/96/ΕΟΚ: Απόφαση τής Επιτροπής τής 2ας Φεβρουαρίου
    1981 περί εξουσιοδοτήσεως τής Ιρλανδίας νά αποκλείσει
    από τήν κοινοτική μεταχείριση υποκάμισα, υποκαμισάκια,
    T-shirts, sous-pulls, φανέλες καί παρόμοια είδη καταγόμενα
    από τό Χόνγκ Κόνγκ (Το κείμενο στην αγγλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/96/CEE: Decisione della Commissione, del 2 febbraio 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette, T-shirts,
    pullovers, magliette a collo alto, camiciole e articoli affini, originari di Hong
    Kong (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/96/EEG: Beschikking van de Commissie van 2 februari 1981 houdende machtiging
    van Ierland om overhemden en sporthemden, T-shirts, hemdtruien (sous-pulls), tricotpakken,
    maillots de corps en dergelijke artikelen, van oorsprong uit Hong-Kong van de
    communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse taal
    is authentiek)'
  type: main
