title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3159/83 of 9 November 1983 authorizing the
    Federal Republic of Germany to permit under certain conditions an additional increase
    in the alcoholic strength of certain wines and certain products intended for wine
    making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3159/83 de la Commission du 9 novembre 1983 autorisant
    la République fédérale d'Allemagne et le Royaume-Uni à permettre, sous certaines
    conditions, une augmentation supplémentaire du titre alcoométrique de certains
    vins et de certains produits destinés à l'élaboration des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3159/83 der Kommission vom 9. November 1983 zur Ermächtigung
    der Bundesrepublik Deutschland und des Vereinigten Königreichs, unter bestimmten
    Voraussetzungen eine zusätzliche Erhöhung des Alkoholgehalts bestimmter Weine
    und bestimmter zur Weinherstellung vorgesehener Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3159/83 af 9. november 1983 om bemyndigelse
    til Forbundsrepublikken Tyskland og Det forenede Kongerige til under visse omstændigheder
    at tillade en yderligere forhøjelse af alkoholindholdet i visse vine og visse
    produkter, der er bestemt til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3159/83 της Επιτροπής
    της 9ης Νοεμβρίου 1983 περί εξουσιοδοτήσεως της
    Ομοσπονδιακής Δημοκρατίας της Γερμανίας και
    του Ηνωμένου Βασιλείου να επιτρέψουν, υπό ορισμένες
    προϋποθέσεις, τη συμπληρωματική αύξηση του
    αλκοολικού τίτλου ορισμένων προϊόντων προοριζομένων
    για την παραγωγή οίνου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3159/83 della Commissione del 9 novembre 1983 che
    autorizza la Repubblica federale di Germania e il Regno Unito a permettere in
    determinate condizioni un aumento supplementare della gradazione alcolometrica
    di taluni vini e di taluni prodotti destinati all' elaborazione dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3159/83 van de Commissie van 9 november 1983 waarbij
    de Bondsrepubliek Duitsland en het Verenigd Koninkrijk gemachtigd worden om op
    bepaalde voorwaarden een extra verhoging van het alcoholgehalte van bepaalde wijnen
    en van bepaalde voor de bereiding van wijn bestemde produkten toe te staan
  type: main
