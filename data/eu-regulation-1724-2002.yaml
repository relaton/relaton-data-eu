  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1724/2002 della Commissione, del 27 settembre 2002,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di settembre 2002 nel quadro dei contingenti
    tariffari d'importazione per taluni prodotti del settore delle carni suine per
    il periodo dal 1° ottobre al 31 dicembre 2002
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1724/2002 van de Commissie van 27 september 2002 tot
