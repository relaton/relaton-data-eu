  script: Latn
  content: Commission Regulation (EC) No 1724/2002 of 27 September 2002 determining
    the extent to which applications lodged in September 2002 for import licences
    under the regime provided for by tariff quotas for certain products in the pigmeat
    sector for the period 1 October to 31 December 2002 can be accepted
  type: main
- language: fr
  script: Latn
