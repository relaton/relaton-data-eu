  content: Commission Delegated Regulation (EU) 2022/26 of 24 September 2021 supplementing
    Regulation (EU) 2019/2033 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the notion of segregated accounts
    to ensure client money’s protection in the event of an investment firm’s failure
  type: main
- language: fr
  script: Latn
