    par des normes techniques de réglementation précisant la notion de «comptes
    ségrégués» afin de garantir la protection des fonds des clients en cas de
    défaillance d’une entreprise d’investissement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/26 der Kommission vom 24. September 2021
