  content: '90/551/EEC: Commission Decision of 30 October 1990 authorizing the Kingdom
    of Spain to permit temporarily the marketing of durum wheat seed not satisfying
    the requirements of Council Directive 66/402/EEC'
  type: main
- language: fr
  script: Latn
  content: '90/551/CEE: Décision de la Commission du 30 octobre 1990 autorisant le
    Royaume d''Espagne à admettre temporairement la commercialisation de semences
    de blé dur ne répondant pas aux exigences de la directive 66/402/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 30. Oktober 1990 zur Ermaechtigung des
    Koenigreichs Spanien, voruebergehend Saatgut von Hartweizen zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/402/EWG des Rates nicht entspricht (90/551/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 30. oktober 1990 om bemyndigelse af Kongeriget
    Spanien til midlertidigt at tillade handel med saedekorn af haard hvede, der ikke
    opfylder kravene i Raadets direktiv 66/402/EOEF (90/551/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/551/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
