title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2246/83 of 4 August 1983 adjusting, from
    5 August 1983, the rate of refunds applicable for certain products of the cereals
    and rice sectors, exported in the form of goods not covered by Annex II to the
    Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2246/83 de la Commission, du 4 août 1983, modifiant,
