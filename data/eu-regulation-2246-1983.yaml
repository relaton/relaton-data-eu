    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2246/83 der Kommission vom 4. August 1983 zur Änderung
    der ab 5. August 1983 bei der Ausfuhr bestimmter Getreide- und Reiserzeugnisse
    in Form von nicht unter Anhang II des Vertrages fallenden Waren geltenden Erstattungssätze
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2246/83 af 4. august 1983 om ændring
    fra den 5. august 1983 af de restitutionssatser, der skal anvendes for visse produkter
    fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
