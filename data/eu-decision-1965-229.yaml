title:
- language: fr
  script: Latn
  content: Décision 65/229/CEE de la Commission, du 31 mars 1965, portant prorogation
    et nouvelle modification de sa décision du 30 novembre 1964, autorisant la perception
    de taxes compensatoires à l'importation dans la République française, de glucose
    (dextrose) en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '65/229/EWG: Entscheidung der Kommission vom 31. März 1965 zur Verlängerung
    und erneuten Änderung ihrer Entscheidung vom 30. November 1964 über die Erhebung
    einer Ausgleichsabgabe bei der Einfuhr von Glukose (Dextrose) aus verschiedenen
    Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '65/229/CEE: Decisione della Commissione, del 31 marzo 1965, che proroga
    e modifica nuovamente la propria decisione del 30 novembre 1964, con cui si autorizza
    la riscossione di tasse di compensazione all''importazione nella Repubblica francese
    di glucosio (destrosio) in provenienza da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/229/EEG: Beschikking van de Commissie van 31 maart 1965 tot verlenging
    en nieuwe wijziging van haar beschikking van 30 november 1964 houdende machtiging
    tot het leggen van compenserende heffingen op de invoer in de Franse Republiek
    van glucose (dextrose), uit bepaalde Lid-Staten'
  type: main
