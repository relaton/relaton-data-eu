  script: Latn
  content: Verordnung (EWG) Nr. 645/77 der Kommission vom 29. März 1977 zur Abweichung
    von der Verordnung (EWG) Nr. 3376/75 betreffend die Berechnung der Beträge zur
    Senkung der Belastung bei der Einfuhr aus den Staaten in Afrika, im karibischen
    Raum und im Pazifischen Ozean für die Zeit ab 1. April 1977
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 645/77 af 29. marts 1977 om undtagelse
