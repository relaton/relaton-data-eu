    beginning 1 April 1977
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 645/77 de la Commission, du 29 mars 1977, portant
    dérogation au règlement (CEE) n° 3376/75 en ce qui concerne le calcul des montants
    de diminution des charges à l'importation des pays d'Afrique, des Caraïbes et
    du Pacifique pour la période débutant le 1er avril 1977
  type: main
