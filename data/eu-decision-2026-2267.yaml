    über Industrieanlagen gemäß der Verordnung (EU) 2024/1244 des Europäischen
    Parlaments und des Rates zu übermitteln haben, und zur Aufhebung des Durchführungsbeschlusses
    (EU) 2019/1741 der Kommission (Bekannt gegeben unter Aktenzeichen C(2026) 7610)
