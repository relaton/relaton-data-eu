    aux fins de la notification des données environnementales des installations industrielles
    au titre du règlement (UE) 2024/1244 du Parlement européen et du Conseil et
    abrogeant la décision d’exécution (UE) 2019/1741 de la Commission [notifiée
    sous le numéro C(2026) 7610]
  type: main
