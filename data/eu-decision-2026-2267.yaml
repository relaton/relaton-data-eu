title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/2267 of 13 October 2026 establishing
    the format and frequency of data and the list of relevant raw materials to be
    reported by the Member States for the purposes of reporting on environmental data
    on industrial installations under Regulation (EU) 2024/1244 of the European Parliament
    and of the Council and repealing Commission Implementing Decision (EU) 2019/1741
    (notified under document C(2026) 7610)
  type: main
- language: fr
  script: Latn
