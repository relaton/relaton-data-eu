title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 798/77 of 19 April 1977 re-establishing
    the levying of the customs duties on broom and brush bodies and handles of wood,
    falling within subheading 44.25 ex B, originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 798/77 de la Commission, du 19 avril 1977, portant
    rétablissement de la perception des droits de douane applicables aux manches
    de balais et de brosses, en bois, de la sous-position tarifaire 44.25 EX B, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 798/77 der Kommission vom 19. April 1977 zur Wiedereinführung
    des Zollsatzes für Griffe für Besen und Bürsten, aus Holz, der Tarifstelle
    44.25 ex B, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3021/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 798/77 af 19. april 1977 om genindførelse
    af opkrævning af toldafgifter for skafter og håndtag af træ, til koste og børster,
    under underposition 44.25 ex B, som har oprindelse i Brasilien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 798/77 della Commissione, del 19 aprile 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai manichi di spazzole
    e di scope, di legno, della sottovoce doganale 44.25 ex B, originari del Brasile
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 798/77 van de Commissie van 19 april 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op borstelen
    bezemstelen, van hout, enz., van post 44.25 ex B, van oorsprong uit Brazilië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
