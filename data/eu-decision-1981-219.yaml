title:
- language: en
  script: Latn
  content: '81/219/EEC: Commission Decision of 10 March 1981 authorizing the French
    Republic not to apply Community treatment to umbrellas and sunshades, including
    walking- stick umbrellas, originating in Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/219/CEE: Décision de la Commission, du 10 mars 1981, autorisant la
    République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles originaires de T''ai-wan (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/219/EWG: Entscheidung der Kommission vom 10. März 1981 zur Ermächtigung
    der Französischen Republik, aus Taiwan stammende Regenschirme und Sonnenschirme,
    einschließlich Stockschirme, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/219/EØF: Kommissionens beslutning af 10. marts 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage paraplyer og
    parasoller (herunder stokkeparaplyer) med oprindelse i Taiwan (Kun den franske
    udgave er autentisk)'
  type: main
