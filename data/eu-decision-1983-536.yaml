  content: '83/536/EEC: Commission Decision of 25 October 1983 establishing that the
    apparatus described as ''LSI - Vascular Diagnostic Computer'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/536/CEE: Décision de la Commission du 25 octobre 1983 constatant que
    l''importation de l''appareil dénommé "LSI - Vascular Diagnostic Computer" ne
    peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
