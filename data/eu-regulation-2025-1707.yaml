    M1- ja N1-kategooria mootorsõidukite kütuse- ja elektrikulu pardamõõteseadmete
    ja pardaseiresüsteemide konkreetsete meetodite, nõuete ja katsetega, sealhulgas
    vastavuskünniste, juhi hoiatamise süsteemide ja meeldetuletusmeetodite omaduste,
