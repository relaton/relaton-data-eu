id: EURegulation20251707
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1707 of 25 July 2025 laying
    down rules for the application of Regulation (EU) 2024/1257 of the European Parliament
    and of the Council as regards specific methods, requirements and tests, including
    compliance thresholds, for OBFCM devices and OBM systems, characteristics and
    performance of driver warning systems and inducement methods and methods to assess
    their operation, EVP format and data and methods of communication of EVP data
    of motor vehicles of categories M1 and N1
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1707 de la Commission du 25 juillet
    2025 établissant des règles relatives à l’application du règlement (UE)
    2024/1257 du Parlement européen et du Conseil en ce qui concerne les méthodes,
    prescriptions et essais spécifiques, y compris les seuils de conformité, applicables
    aux dispositifs OBFCM et aux systèmes OBM, les caractéristiques et la performance
    des systèmes d’avertissement du conducteur et les méthodes d’incitation,
    ainsi que les méthodes d’évaluation de leur fonctionnement, le format et les
    données du PEV ainsi que les méthodes de communication des données du PEV des
    véhicules à moteur des catégories M1 et N1
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1707 der Kommission vom 25. Juli 2025
    mit Durchführungsbestimmungen zur Verordnung (EU) 2024/1257 des Europäischen
    Parlaments und des Rates hinsichtlich spezifischer Methoden, Anforderungen und
    Prüfungen, einschließlich Einhaltungsgrenzen, für OBFCM-Einrichtungen und OBM-Systeme,
    Merkmalen und Leistungsfähigkeit von Fahrerwarn- und -aufforderungssystemen und
    Methoden zur Bewertung ihres Betriebs, des Formats und der Daten des Umweltpasses
    für Fahrzeuge (EVP) sowie Methoden der Übertragung von EVP-Daten für Kraftfahrzeuge
    der Klassen M1 und N1
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1707 на Комисията
    от 25 юли 2025 година за определяне на правила
    за прилагането на Регламент (ЕС) 2024/1257 на Европейския
    парламент и на Съвета по отношение на специфичните
    методи, изисквания и изпитвания, включително
    на праговете на съответствие, за устройствата
    за бордово следене на разхода на гориво и консумацията
    на електрическа енергия (устройства OBFCM) и системите
    за бордово следене (системи OBM), характеристиките
    и работата на системите за предупреждение
    на водача и методите за стимулирането на действия
    от негова страна, както и методите за оценка
    на функционирането на тези системи и методи,
    формàта на екологичния паспорт на превозното
    средство (EVP), данните и методите за предаване
    на данните от EVP на моторни превозни средства
    от категории M1 и N1
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1707 ze dne 25. července 2025,
    kterým se stanoví prováděcí pravidla k nařízení Evropského parlamentu
    a Rady (EU) 2024/1257, pokud jde o konkrétní metody, požadavky a zkoušky,
    včetně prahových hodnot pro shodu, pro zařízení OBFCM a systémy OBM, charakteristiky
    a výkonnost systémů varování řidiče a metody upozornění řidiče a metody
    posouzení jejich fungování a formát, údaje a způsoby sdělování údajů
    v rámci ekologického pasu vozidel v případě motorových vozidel kategorií
    M1 a N1
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/1707 af 25. juli 2025
    om regler for anvendelsen af Europa-Parlamentets og Rådets forordning (EU) 2024/1257
    for så vidt angår specifikke metoder, krav og prøvninger, herunder overholdelsestærskler,
    for OBFCM-anordninger og OBM-systemer, egenskaber og ydeevne for føreradvarselssystemer
    og ansporingsmetoder og metoder til vurdering af deres drift, EVP-format og -data
    og metoder til kommunikation af EVP-data for motorkøretøjer i klasse M1og N1
  type: main
