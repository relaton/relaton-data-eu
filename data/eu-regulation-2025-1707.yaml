    tiedoista ja ympäristöpassin tietojen toimittamismenetelmistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/1707 ón gCoimisiún an 25 Iúil
    2025 lena leagtar síos rialacha maidir le cur i bhfeidhm Rialachán (AE) 2024/1257
    ó Pharlaimint na hEorpa agus ón gComhairle a mhéid a bhaineann le modhanna,
    ceanglais agus tástálacha sonracha, lena n-áirítear tairseacha comhlíontachta,
    le haghaidh feistí OBFCM agus córais OBM, saintréithe agus feidhmíocht córas
    rabhaidh don tiománaí agus modhanna aslaigh agus modhanna chun measúnú a dhéanamh
