    és az OBM-rendszerekre vonatkozó különös módszerek, követelmények, vizsgálatok
    és megfelelőségi küszöbértékek, a járművezetőt figyelmeztető rendszerek
    és a használatkorlátozó módszerek jellemzői, teljesítménye és a működésük
    értékelésére szolgáló módszerek, valamint az M1 és N1 kategóriájú gépjárművek
    környezetvédelmi járműútlevelének formátuma, adatai és az ezen adatok
    kommunikációjára szolgáló módszerek tekintetében történő alkalmazására
    vonatkozó szabályok megállapításáról
  type: main
- language: it
  script: Latn
