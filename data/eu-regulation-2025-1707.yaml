  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/1707, annettu 25 päivänä
    heinäkuuta 2025, Euroopan parlamentin ja neuvoston asetuksen (EU) 2024/1257 soveltamissäännöistä
    siltä osin kuin on kyse OBFCM-laitteita ja OBM-järjestelmiä koskevista erityisistä
    menetelmistä, vaatimuksista ja testeistä, mukaan lukien vaatimustenmukaisuuskynnykset,
    kuljettajaa varoittavien järjestelmien ja kuljettajan toimenpiteitä vaativien
