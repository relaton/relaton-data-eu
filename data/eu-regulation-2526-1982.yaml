title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2526/82 of 15 September 1982 on the sale
    at prices fixed at a standard rate in advance of certain beef from intervention
    stocks for processing in the Community and repealing Regulation (EEC) No 1910/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2526/82 de la Commission, du 15 septembre 1982, relatif
    à la vente à prix fixé forfaitairement à l'avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant le règlement (CEE) n 1910/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2526/82 der Kommission vom 15. September 1982 über
    den Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der
    Gemeinschaft bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur
    Aufhebung der Verordnung (EWG) Nr. 1910/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2526/82 af 15. september 1982 om salg
    til forudfastsatte priser af visse former for oksekød fra interventionslagrene
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 1910/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2526/82 της Επιτροπής
