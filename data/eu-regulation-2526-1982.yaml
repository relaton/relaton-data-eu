    αποκοπή τιμή καθοριζόμενη εκ των προτέρων,
    εν όψει της μεταποιήσεώς τους εντός της Κοινότητος,
    ορισμένων βοείων κρεάτων πού προέρχονται από
    αποθέματα οργανισμών παρεμβάσεως και περί
