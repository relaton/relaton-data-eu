  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2526/82 della Commissione, del 15 settembre 1982,
    relativo alla vendita, a prezzi fissati forfettariamente in anticipo, di talune
    carni bovine provenienti dalle scorte d'intervento e destinate alla trasformazione
    nella Comunità e recante abrogazione del regolamento (CEE) n. 1910/82
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2526/82 van de Commissie van 15 september 1982 inzake
