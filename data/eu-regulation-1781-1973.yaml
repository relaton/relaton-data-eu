  content: Regulation (EEC) No 1781/73 of the Commission of 29 June 1973 fixing the
    rates of the refunds applicable from 1 July 1973 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1781/73 de la Commission, du 29 juin 1973, fixant les
    taux des restitutions applicables, à compter du 1er juillet 1973, à certains
    produits des secteurs de céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1781/73 der Kommission vom 29. Juni 1973 zur Festsetzung
