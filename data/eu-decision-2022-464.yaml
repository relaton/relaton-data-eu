  script: Latn
  content: Council Implementing Decision (EU) 2022/464 of 21 March 2022 amending Implementing
    Decision 2013/54/EU as regards the authorisation granted to the Republic of Slovenia
    to continue to apply the special measure derogating from Article 287 of Directive
    2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/464 du Conseil du 21 mars 2022 modifiant
    la décision d’exécution 2013/54/UE en ce qui concerne l’autorisation accordée
    à la République de Slovénie de continuer à appliquer la mesure particulière
    dérogatoire à l’article 287 de la directive 2006/112/CE relative au système
    commun de taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/464 des Rates vom 21. März 2022 zur
