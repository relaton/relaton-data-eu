    uporablja posebni ukrep, ki odstopa od člena 287 Direktive 2006/112/ES o skupnem
    sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/464 del Consejo de 21 de marzo de 2022
