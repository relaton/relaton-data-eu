    concedida à República da Eslovénia para continuar a aplicar a medida especial
    em derrogação do artigo 287.o da Diretiva 2006/112/CE relativa ao sistema comum
    do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/464 a Consiliului din 21 martie
    2022 de modificare a Deciziei de punere în aplicare 2013/54/UE în ceea ce privește
    autorizarea acordată Republicii Slovenia de a continua să aplice măsura specială
    de derogare de la articolul 287 din Directiva 2006/112/CE privind sistemul comun
    al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2022/464 z 21. marca 2022, ktorým
    sa mení vykonávacie rozhodnutie 2013/54/EÚ, pokiaľ ide o povolenie udelené
    Slovinskej republike, aby naďalej uplatňovala osobitné opatrenie odchyľujúce
    sa od článku 287 smernice 2006/112/ES o spoločnom systéme dane z pridanej
    hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2022/464 z dne 21. marca 2022 o spremembi Izvedbenega
