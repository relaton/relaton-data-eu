    concessa alla Repubblica di Slovenia di continuare ad applicare la misura speciale
    di deroga all’articolo 287 della direttiva 2006/112/CE relativa al sistema comune
    d’imposta sul valore aggiunto
  type: main
- language: lv
  script: Latn
