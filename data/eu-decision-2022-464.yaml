    om de bijzondere maatregel te blijven toepassen die afwijkt van artikel 287 van
    Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel van belasting
    over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2022/464 z dnia 21 marca 2022 r. zmieniająca
