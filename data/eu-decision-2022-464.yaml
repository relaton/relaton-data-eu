    Republice Slovinsko nadále uplatňovat zvláštní opatření odchylující se
    od článku 287 směrnice 2006/112/ES o společném systému daně z přidané
    hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2022/464 af 21. marts 2022 om ændring
