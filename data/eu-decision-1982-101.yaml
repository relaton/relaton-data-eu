  content: '82/101/EEC: Commission Decision of 27 January 1982 authorizing the extension
    of the period for informing the competent agency of the results of an invitation
    to tender in Algeria in the milk and milk products sector'
  type: main
- language: fr
  script: Latn
  content: '82/101/CEE: Décision de la Commission, du 27 janvier 1982, autorisant
    la prorogation du délai pour informer l'' organisme compétent des résultats
    d'' une adjudication en Algérie, dans le secteur du lait et des produits laitiers'
  type: main
- language: de
  script: Latn
  content: '82/101/EWG: Entscheidung der Kommission vom 27. Januar 1982 zur Verlängerung
    der Frist für die Unterrichtung der zuständigen Stelle über die Ergebnisse
    einer in Algerien durchgeführten Ausschreibung auf dem Sektor Milch und Milcherzeugnisse'
  type: main
- language: da
  script: Latn
  content: '82/101/EØF: Kommissionens beslutning af 27. januar 1982 om tilladelse
