title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2022/2254 of 14 November 2022 authorising
    Bulgaria to introduce a special measure derogating from Article 287 of Directive
    2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2254 du Conseil du 14 novembre 2022
    autorisant la Bulgarie à introduire une mesure particulière dérogatoire à
    l’article 287 de la directive 2006/112/CE relative au système commun de taxe
    sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2254 des Rates vom 14. November 2022
    zur Ermächtigung Bulgariens, eine von Artikel 287 der Richtlinie 2006/112/EG
    über das gemeinsame Mehrwertsteuersystem abweichende Sondermaßnahme einzuführen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/2254 на Съвета
    от 14 ноември 2022 година за предоставяне на разрешение
    на България да въведе специална мярка за дерогация
    от член 287 от Директива 2006/112/ЕО относно общата
    система на данъка върху добавената стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2022/2254 ze dne 14. listopadu 2022,
    kterým se Bulharsku povoluje zavést zvláštní opatření odchylující se
    od článku 287 směrnice 2006/112/ES o společném systému daně z přidané
    hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2022/2254 af 14. november 2022 om
    at give Bulgarien tilladelse til at indføre en særlig foranstaltning, der fraviger
    artikel 287 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/2254 του Συμβουλίου
    της 14ης Νοεμβρίου 2022 με την οποία επιτρέπεται
    στη Βουλγαρία να εισαγάγει ειδικό μέτρο παρέκκλισης
    από το άρθρο 287 της οδηγίας 2006/112/ΕΚ σχετικά
    με το κοινό σύστημα φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2022/2254, 14. november 2022, millega antakse
    Bulgaariale luba kehtestada erimeede, millega tehakse erand direktiivi 2006/112/EÜ
    (mis käsitleb ühist käibemaksusüsteemi) artiklist 287
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2022/2254, annettu 14 päivänä
    marraskuuta 2022, luvan antamisesta Bulgarialle ottaa käyttöön yhteisestä
    arvonlisäverojärjestelmästä annetun direktiivin 2006/112/EY 287 artiklasta
    poikkeava erityistoimenpide
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2254 ón gComhairle an 14 Samhain 2022
    lena n-údaraítear don Bhulgáir beart speisialta a thabhairt isteach de mhaolú
    ar Airteagal 287 de Threoir 2006/112/CE maidir leis an gcomhchóras cánach breisluacha
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2022/2254 od 14. studenoga 2022. kojom se
    Bugarskoj odobrava uvođenje posebne mjere odstupanja od članka 287. Direktive
    2006/112/EZ o zajedničkom sustavu poreza na dodanu vrijednost
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/2254 végrehajtási határozata (2022. november 14.)
    Bulgáriának a közös hozzáadottértékadó-rendszerről szóló 2006/112/EK
    irányelv 287. cikkétől eltérő különös intézkedés bevezetésére történő
    felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2254 del Consiglio del 14 novembre 2022
    che autorizza la Bulgaria a introdurre una misura speciale di deroga all’articolo
    287 della direttiva 2006/112/CE relativa al sistema comune d’imposta sul valore
    aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2022/2254 (2022. gada 14. novembris),
    ar ko Bulgārijai atļauj ieviest īpašu pasākumu, atkāpjoties no 287. panta
    Direktīvā 2006/112/EK par kopējo pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2022/2254 2022 m. lapkričio 14 d.
    kuriuo Bulgarijai leidžiama nustatyti specialią priemonę, kuria nukrypstama
    nuo Direktyvos 2006/112/EB dėl pridėtinės vertės mokesčio bendros sistemos
    287 straipsnio
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2022/2254 tal-14 ta’
    Novembru 2022 li tawtorizza lill-Bulgarija tintroduċi miżura speċjali li tidderoga
    mill-Artikolu 287 tad-Direttiva 2006/112/KE dwar is-sistema komuni ta’ taxxa
    fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2254 van de Raad van 14 november 2022 waarbij
    Bulgarije wordt gemachtigd een bijzondere maatregel in te voeren die afwijkt van
    artikel 287 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel
    van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2022/2254 z dnia 14 listopada 2022 r. upoważniająca
    Bułgarię do wprowadzenia szczególnego środka stanowiącego odstępstwo od
    art. 287 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości
    dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2254 do Conselho de 14 de novembro de
    2022 que autoriza a Bulgária a aplicar uma medida especial em derrogação do
    artigo 287.o da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2254 a Consiliului din 14 noiembrie
    2022 prin care Bulgaria este autorizată să aplice o măsură specială de derogare
    de la articolul 287 din Directiva 2006/112/CE privind sistemul comun al taxei
    pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2022/2254 zo 14. novembra 2022, ktorým
    sa Bulharsku povoľuje zaviesť osobitné opatrenie odchyľujúce sa od článku
    287 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2022/2254 z dne 14. Novembra 2022 o dovoljenju
    Bolgariji, da uvede posebni ukrep, ki odstopa od člena 287 Direktive 2006/112/ES
    o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/2254 del Consejo de 14 de noviembre de
    2022 por la que se autoriza a Bulgaria a introducir una medida especial de excepción
    a lo dispuesto en el artículo 287 de la Directiva 2006/112/CE, relativa al sistema
    común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2022/2254 av den 14 november 2022 om bemyndigande
    för Bulgarien att införa en särskild åtgärd som avviker från artikel 287
    i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
  type: main
