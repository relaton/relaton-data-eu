- language: en
  script: Latn
  content: Council Directive (EU) 2020/2020 of 7 December 2020 amending Directive
    2006/112/EC as regards temporary measures in relation to value added tax applicable
    to COVID-19 vaccines and in vitro diagnostic medical devices in response to the
    COVID-19 pandemic
  type: main
- language: fr
  script: Latn
  content: Directive (UE) 2020/2020 du Conseil du 7 décembre 2020 modifiant la directive
    2006/112/CE en ce qui concerne des mesures temporaires relatives à la taxe sur
    la valeur ajoutée applicable aux vaccins contre la COVID-19 et aux dispositifs
    médicaux de diagnostic in vitro de cette maladie en réaction à la pandémie
    de COVID-19
  type: main
- language: de
  script: Latn
