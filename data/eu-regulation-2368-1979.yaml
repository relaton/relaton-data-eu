  content: Commission Regulation (EEC) No 2368/79 of 22 October 1979 determining the
    amounts of the variable components and additional duties applicable from 1 November
    1979 to 31 January 1980 inclusive, on the importation into the Community of goods
    covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2368/79 de la Commission, du 22 octobre 1979, déterminant
    les montants des éléments mobiles et les droits additionnels applicables, pendant
    la période du 1er novembre 1979 au 31 janvier 1980 inclus, à l'importation dans
    la Communauté des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2368/79 der Kommission vom 22. Oktober 1979 zur Festsetzung
    der Höhe der vom 1. November 1979 bis einschließlich 31. Januar 1980 bei der
    Einfuhr der unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2368/79 af 22. oktober 1979 om fastsættelse
