title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/894 of 5 May 2025 on the position to be taken
    on behalf of the European Union within the EPA Council and within the Committee
    of Senior Officials established by the Economic Partnership Agreement between
    the European Union, of the one part, and the Republic of Kenya, Member of the
    East African Community, of the other part as regards the adoption of the Rules
    of Procedure for the EPA Council, of the Rules of Procedure for Dispute Settlement
    and the Code of Conduct for Arbitrators and Mediators, and of the Rules of Procedure
    for the Committee of Senior Officials
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/894 du Conseil du 5 mai 2025 relative à la position
    à prendre, au nom de l’Union européenne, au sein du conseil APE et au sein
    du comité des hauts fonctionnaires institués par l’accord de partenariat économique
    entre l’Union européenne, d’une part, et la République du Kenya, membre
    de la Communauté de l’Afrique de l’Est, d’autre part, en ce qui concerne
    l’adoption du règlement intérieur du conseil APE, du règlement intérieur
    régissant le règlement des différends et du code de conduite des arbitres et
    des médiateurs, et du règlement intérieur du comité des hauts fonctionnaires
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/894 des Rates vom 5. Mai 2025 über den im Namen der
    Europäischen Union im WPA-Rat und im Ausschuss hoher Beamter, die beide durch
    das Wirtschaftspartnerschaftsabkommen zwischen der Europäischen Union einerseits
    und der Republik Kenia, Mitglied der Ostafrikanischen Gemeinschaft, andererseits
    eingesetzt wurden, im Hinblick auf die Annahme der Geschäftsordnung des WPA-Rates,
    der Geschäftsordnung für die Streitbeilegung und des Verhaltenskodex für Schiedsrichter
    und Mediatoren sowie der Geschäftsordnung des Ausschusses hoher Beamter zu vertretenden
    Standpunkt
  type: main
