    a Comunității Africii de Est, pe de altă parte, în ceea ce privește adoptarea
    Regulamentului de procedură al Consiliului APE, a Regulamentului de procedură
    pentru soluționarea litigiilor și a Codului de conduită aplicabil arbitrilor
    și mediatorilor, precum și a Regulamentului de procedură al Comitetului înalților
    funcționari
  type: main
