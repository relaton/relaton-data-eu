  content: Rådets beslut (EU) 2025/894 av den 5 maj 2025 om den ståndpunkt som ska
    intas på Europeiska unionens vägnar i EPA-rådet och i kommittén för högre
    tjänstemän, vilka inrättats genom avtalet om ekonomiskt partnerskap mellan
    Europeiska unionen, å ena sidan, och Republiken Kenya, medlem i Östafrikanska
