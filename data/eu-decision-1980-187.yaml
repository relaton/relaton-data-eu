type: standard
title:
- language: en
  script: Latn
  content: '80/187/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to blouses and shirt-blouses, knitted
    or crocheted, or woven, for women, girls and infants, falling within subheadings
    ex 60.05 A II and ex 61.02 B II of the Common Customs Tariff (category 7), originating
    in Pakistan and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/187/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    la République française à exclure du traitement communautaire les chemisiers,
    blouses- chemisiers et blouses de bonneterie ou tissés, pour femmes, fillettes
    et jeunes enfants, des sous-positions ex 60.05 A II et ex 61.02 B II du tarif
    douanier commun (catégorie 7), originaires du Pakistan et mis en libre pratique
    dans les autres Etats membres (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/187/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Pakistan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken
    oder Geweben, für Frauen, Mädchen und Kleinkinder, der Tarifstellen ex 60.05
    A II und ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie 7, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/187/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage bluser, herunder
    skjortebluser af trikotage eller vævede stoffer, til kvinder, piger og småbørn,
    som henhører under pos. ex 60.05 A II og ex 61.02 B II i den fælles toldtarif
    (kategori 7), har oprindelse i Pakistan og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/187/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie, camicette
    e bluse a maglia (non elastica né gommata) o tessute, per donna, per ragazza
    e per bambini, delle sottovoci ex 60.05 A II ed ex 61.02 B II della tariffa doganale
    comune, categoria 7, originarie del Pakistan e messe in libera pratica negli altri
    Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/187/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd blouses en hemdblouses, van brei- of haakwerk
    of geweven, voor dames, meisjes en kinderen, van de posten ex 60.05 A II en ex
    61.02 B II van het gemeenschappelijk douanetarief (categorie 7), van oorsprong
    uit Pakistan en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten (Slechts de tekst in de Franse taal is
    authentiek)'
  type: main
