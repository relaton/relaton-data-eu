  content: Commission Regulation (EC) No 737/2008 of 28 July 2008 designating the
    Community reference laboratories for crustacean diseases, rabies and bovine tuberculosis,
    laying down additional responsibilities and tasks for the Community reference
    laboratories for rabies and bovine tuberculosis and amending Annex VII to Regulation
    (EC) No 882/2004 of the European Parliament and of the Council
  type: main
- language: fr
