title:
- language: en
  script: Latn
  content: '85/61/EEC: Commission Decision of 19 December 1984 amending Decision 84/108/EEC
    authorizing Member States to permit temporarily the marketing of forestry reproductive
    material not satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '85/61/CEE: Décision de la Commission du 19 décembre 1984 modifiant la
    décision 84/108/CEE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '85/61/EWG: Entscheidung der Kommission vom 19. Dezember 1984 zur Änderung
    der Entscheidung 84/108/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '85/61/EØF: Kommissionens beslutning af 19. december 1984 om ændring
    af beslutning 84/108/EØF om bemyndigelse af medlemsstaterne til midlertidigt
    at tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene
    i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '85/61/ΕΟΚ: Απόφαση της Επιτροπής της 19ης Δεκεμβρίου
    1984 για τροποποίηση της απόφασης 84/108/ΕΟΚ που
    επιτρέπει στα κράτη μέλη να εγκρίνουν προσωρινά
    την εμπορία δασικού πολλαπλασιαστικού υλικού
    που δεν ανταποκρίνεται στις απαιτήσεις της
    οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '85/61/CEE: Decisione della Commissione del 19 dicembre 1984 recante modifica
    della decisione 84/108/CEE che autorizza gli Stati membri ad ammettere temporaneamente
    la commercializzazione di materiali di moltiplicazione di alcune specie forestali
    che non corrispondono alle esigenze della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '85/61/EEG: Beschikking van de Commissie van 19 december 1984 tot wijziging
    van Beschikking 84/108/EEG houdende machtiging van de Lid-Staten om bosbouwkundig
    teeltmateriaal dat niet aan de eisen van Richtlijn 66/404/EEG van de Raad voldoet,
    tijdelijk tot de handel toe te laten'
  type: main
- language: pt
  script: Latn
  content: '85/61/CEE: Decisão da Comissão, de 19 de Dezembro de 1984, que altera
    a Decisão 84/108/CEE que autoriza os Estados-membros a admitir temporariamente
    a comercialização de materiais florestais de reprodução que não correspondam
    às exigências da Directiva 66/404/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '85/61/CEE: Decisión de la Comisión, de 19 de diciembre de 1984, por
    la que se modifica la Decisión 84/108/CEE por la que se autoriza a los Estados
    miembros a admitir temporalmente la comercialización de materiales forestales
    de reproducción que no cumplan los requisitos de la Directiva 66/404/CEE del
    Consejo'
  type: main
