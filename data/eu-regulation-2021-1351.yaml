    dos sistemas e controlos para identificar e denunciar qualquer conduta que possa
    envolver manipulação ou tentativa de manipulação de um índice de referência
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1351 al Comisiei din 6 mai 2021 de completare
    a Regulamentului (UE) 2016/1011 al Parlamentului European și al Consiliului în
