    pokud jde o regulační technické normy, kterými se stanoví vlastnosti systémů
    a kontrol pro zjišťování a oznamování jednání, které by mohlo představovat
    manipulaci či pokus o manipulaci s referenční hodnotou
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1351 af 6. maj 2021 om supplerende
