    sistemelor și ale controalelor pentru identificarea și raportarea oricărui
    comportament care poate implica manipularea sau o tentativă de manipulare a unui
    indice de referință
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1351 zo 6. mája 2021, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2016/1011, pokiaľ
    ide o regulačné technické predpisy, ktorými sa stanovujú vlastnosti systémov
    a kontrol na identifikáciu a oznamovanie akéhokoľvek konania, ktoré môže
    zahŕňať manipuláciu alebo pokus o manipuláciu s referenčnou hodnotou
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1351 z dne 6. maja 2021 o dopolnitvi
