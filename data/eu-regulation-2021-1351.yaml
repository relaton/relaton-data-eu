    angår reguleringsmæssige tekniske standarder, der præciserer systemernes og
    kontrolforanstaltningernes karakteristika med henblik på at identificere og indberette
    enhver adfærd, der kan omfatte manipulation eller forsøg på manipulation af
    et benchmark
  type: main
