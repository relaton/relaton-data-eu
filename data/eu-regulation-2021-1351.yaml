    w odniesieniu do regulacyjnych standardów technicznych określających charakterystykę
    systemów i kontroli służących identyfikacji i zgłaszaniu wszelkich zachowań,
    które mogą wiązać się z manipulacją lub próbą manipulacji wskaźnikiem
    referencyjnym
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/1351 da Comissão de 6 de maio de 2021 que
