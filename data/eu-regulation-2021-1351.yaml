title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1351 of 6 May 2021 supplementing
    Regulation (EU) 2016/1011 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the characteristics of the systems
    and controls for the identification and reporting of any conduct that may involve
    manipulation or attempted manipulation of a benchmark
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1351 de la Commission du 6 mai 2021 complétant
    le règlement (UE) 2016/1011 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les caractéristiques des systèmes et
    des contrôles pour l’identification et le signalement de tout comportement
    susceptible d’impliquer une manipulation ou une tentative de manipulation d’un
    indice de référence
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1351 der Kommission vom 6. Mai 2021 zur
    Ergänzung der Verordnung (EU) 2016/1011 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Präzisierung der Merkmale der
    Systeme und Kontrollen für die Identifizierung und Meldung von Verhaltensweisen,
    die mit Manipulation oder versuchter Manipulation eines Referenzwerts verbunden
    sein könnten
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1351 на Комисията
