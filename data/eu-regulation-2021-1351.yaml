    las características de los sistemas y controles para la identificación y la
    comunicación de cualquier conducta que pueda entrañar manipulación o intento
    de manipulación de un índice de referencia
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/1351 av den 6 maj 2021 om
    komplettering av Europaparlamentets och rådets förordning (EU) 2016/1011 vad
    gäller tekniska tillsynsstandarder som specificerar egenskaperna hos systemen
    och kontrollerna för identifiering och rapportering av allt agerande som kan
