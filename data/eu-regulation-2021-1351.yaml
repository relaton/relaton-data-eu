    jellemzőit meghatározó szabályozástechnikai standardok tekintetében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/1351 della Commissione del 6 maggio 2021
    che integra il regolamento (UE) 2016/1011 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano le caratteristiche
    dei sistemi e dei controlli per l’individuazione e la segnalazione di qualsiasi
    condotta che possa comportare la manipolazione o il tentativo di manipolazione
    di un indice di riferimento
  type: main
