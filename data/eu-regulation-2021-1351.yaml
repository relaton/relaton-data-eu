    (ЕС) 2016/1011 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на характеристиките на системите
    и механизмите за контрол за установяване и
    докладване на всяко поведение, което може да
    включва манипулиране или опит за манипулиране
    на бенчмарк
  type: main
- language: cs
  script: Latn
