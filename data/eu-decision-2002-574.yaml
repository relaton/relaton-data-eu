    onder nummer C(2002) 2555)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 10 lipca 2002 r. zmieniająca decyzję 94/278/WE
    ustalającą wykaz państw trzecich, z których Państwa Członkowskie dopuszczają
    przywóz niektórych produktów objętych dyrektywą Rady 92/118/EWG, w odniesieniu
    do przywozu produktów jajecznych, ślimaków, żabich udek, miodu i mleczka pszczelego
    (notyfikowana jako dokument nr C(2002) 2555)
  type: main
- language: pt
  script: Latn
  content: '2002/574/CE: Decisão da Comissão, de 10 de Julho de 2002, que altera
    a Decisão 94/278/CE, que estabelece uma lista de países terceiros dos quais
    os Estados-Membros autorizam a importação de determinados produtos abrangidos
    pela Directiva 92/118/CEE do Conselho, no que respeita à importação de ovoprodutos,
    caracóis, coxas de rã, mel e geleia real (Texto relevante para efeitos do EEE)
    [notificada com o número C(2002) 2555]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 10. júla 2002, ktorým sa mení a dopĺňa rozhodnutie
    94/278/ES zostavujúce zoznam tretích krajín, z ktorých členské štáty povoľujú
    dovoz niektorých výrobkov, na ktoré sa vzťahuje smernica Rady 92/118/EHS,
    pokiaľ ide o dovoz vaječných výrobkov, slimákov, žabacích stehienok, medu
    a materskej kašičky (oznámené pod dokumentom číslo C(2002) 2555)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 10. julija 2002 o spremembi Odločbe 94/278/ES
    o določitvi seznama tretjih držav, iz katerih države članice dovolijo uvoz
    nekaterih izdelkov v okviru Direktive Sveta 92/118/EGS, ob upoštevanju uvoza
    jajčnih proizvodov, polžev, žabjih krakov, medu in matičnega mlečka (notificirano
    pod dokumentarno številko K(2002) 2555)
  type: main
- language: es
  script: Latn
  content: '2002/574/CE: Decisión de la Comisión, de 10 de julio de 2002, que modifica
