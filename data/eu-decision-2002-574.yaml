title:
- language: en
  script: Latn
  content: '2002/574/EC: Commission Decision of 10 July 2002 amending Decision 94/278/EC
    drawing up a list of third countries from which Member States authorise imports
    of certain products subject to Council Directive 92/118/EEC, with respect to imports
    of egg products, snails, frogs'' legs, honey and royal jelly (Text with EEA relevance)
    (notified under document number C(2002) 2555)'
  type: main
- language: fr
  script: Latn
  content: '2002/574/CE: Décision de la Commission du 10 juillet 2002 modifiant la
    décision 94/278/CE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent l''importation de certains produits visés par la
    directive 92/118/CEE du Conseil, pour ce qui concerne l''importation d''ovoproduits,
    d''escargots, de cuisses de grenouilles, de miel et de gelée royale (Texte présentant
    de l''intérêt pour l''EEE) [notifiée sous le numéro C(2002) 2555]'
  type: main
- language: de
  script: Latn
  content: '2002/574/EG: Entscheidung der Kommission vom 10. Juli 2002 zur Änderung
    der Entscheidung 94/278/EG zur Festlegung der Listen von Drittländern, aus denen
    die Mitgliedstaaten die Einfuhr von bestimmten Erzeugnissen der Richtlinie 92/118/EWG
    des Rates zulassen, hinsichtlich der Einfuhren von Eiprodukten, Weinbergschnecken,
    Froschschenkeln, Honig und Gelee royale (Text von Bedeutung für den EWR) (Bekannt
    gegeben unter Aktenzeichen K(2002) 2555)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 10. července 2002, kterým se mění rozhodnutí
    94/278/ES, kterým se stanoví seznam třetích zemí, ze kterých členské státy
    povolují dovoz některých produktů, na které se vztahuje směrnice Rady 92/118/EHS,
    pokud jde o dovoz vaječných výrobků, hlemýžďů, žabích stehýnek, medu
    a mateří kašičky (oznámeno pod číslem K(2002) 2555)
  type: main
- language: da
  script: Latn
  content: '2002/574/EF: Kommissionens beslutning af 10. juli 2002 om ændring af
    beslutning 94/278/EF om listen over tredjelande, hvorfra medlemsstaterne tillader
    indførsel af en række produkter omhandlet i Rådets direktiv 92/118/EØF, for
    så vidt angår indførsel af ægprodukter, snegle, frølår, honning og gelée
    royale (EØS-relevant tekst) (meddelt under nummer K(2002) 2555)'
  type: main
- language: el
  script: Grek
