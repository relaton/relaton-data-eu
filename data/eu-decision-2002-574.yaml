    behozatalára feljogosított harmadik országok jegyzékének megállapításáról
    szóló 94/278/EK határozat módosításáról (az értesítés a C(2002) 2555.
    számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2002/574/CE: Decisione della Commissione, del 10 luglio 2002, che modifica
    la decisione 94/278/CE che stabilisce l''elenco dei paesi terzi da cui gli Stati
    membri autorizzano l''importazione di taluni prodotti disciplinati dalla direttiva
    92/118/CEE del Consiglio per quanto concerne le importazioni di ovoprodotti, lumache,
    cosce di rana, miele e pappa reale (Testo rilevante ai fini del SEE) [notificata
    con il numero C(2002) 2555]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2002. gada 10. jūlijs), ar kuru groza Lēmumu 94/278/EK,
    ar ko izveido to trešo valstu sarakstu, no kurām dalībvalstis atļauj ievest
    noteiktus produktus, uz ko attiecas Padomes Direktīva 92/118/EEK, attiecībā
    uz olu produktu, gliemežu, varžu kājiņu, medus un peru pieniņa ievešanu
    (izziņots ar dokumenta Nr. C(2002) 2555)
  type: main
- language: lt
  script: Latn
  content: 2002 m. liepos 10 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    94/278/EB, pateikiantį trečiųjų šalių, iš kurių valstybės narės leidžia
    importuoti tam tikrus Tarybos direktyvos 92/118/EEB reglamentuojamus produktus,
    sąrašą dėl kiaušinių produktų, sraigių, varlių kojelių, medaus ir bičių
    pienelio importo (pranešta dokumentu Nr. C(2002) 2555)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni ta’ l-10 ta’ Lulju 2002 li temenda d-Deċiżjoni
    94/278/KE li tistabbilixxi lista ta’ pajjiżi terzi li minnhom l-Istati Membri
    jawtorizzaw l-importazzjoni ta’ ċerti prodotti soġġetti għad-Direttiva tal-Kunsill
    92/118/KEE, rigward l-importazzjoni tal-prodotti tal-bajd, il-bebbux, ir-riġlejn
    taż-żrinġ, l-għasel u r-royal jelly (notifikat taħt dokument numru C(2002)
    2555)
  type: main
- language: nl
  script: Latn
  content: '2002/574/EG: Beschikking van de Commissie van 10 juli 2002 tot wĳziging
    van Beschikking 94/278/EG tot vaststelling van de lĳst van derde landen waaruit
    de lidstaten de invoer van bepaalde producten als bedoeld bĳ Richtlĳn 92/118/EEG
    van de Raad toestaan, met betrekking tot de invoer van eiproducten, slakken, kikkerbillen,
