    2930 90 10 der Kombinierten Nomenklatur mit Ursprung in China, dem die in der
    Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2274/88 af 25. juli 1988 om genindførelse
