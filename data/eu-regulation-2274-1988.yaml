title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2274/88 of 25 July 1988 re-establishing
    the levying of customs duties on cysteine, cystine and their derivatives falling
    within CN code 2930 90 10 originating in China to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2274/88 de la Commission du 25 juillet 1988 portant
    rétablissement de la perception des droits de douane applicables à la cystéine,
    la cystine et leurs dérivés, du code 2930 90 10 de la nomenclature combinée,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
