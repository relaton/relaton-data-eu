title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/699 of 18 April 2017 establishing
    a common methodology for the calculation of the weight of electrical and electronic
    equipment (EEE) placed on the market of each Member State and a common methodology
    for the calculation of the quantity of waste electrical and electronic equipment
    (WEEE) generated by weight in each Member State
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/699 de la Commission du 18 avril 2017
    établissant une méthode commune pour le calcul du poids des équipements électriques
    et électroniques (EEE) mis sur le marché de chaque État membre, ainsi qu'une
    méthode commune pour le calcul de la quantité de déchets d'équipements électriques
    et électroniques (DEEE) produits, en poids, dans chaque État membre
  type: main
- language: de
  script: Latn
