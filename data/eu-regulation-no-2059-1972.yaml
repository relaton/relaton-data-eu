  content: Regulation (EEC) No 2059/72 of the Council of 26 September 1972 supplementing
    Article 26 and correcting the German text of Article 50 of Regulation (EEC) No
    574/72 laying down the procedure for implementing Regulation (EEC) No 1408/71
    on the application of social security schemes to employed persons and their families
    moving within the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2059/72 du Conseil, du 26 septembre 1972, complétant
    l' article 26 et rectifiant le texte allemand de l' article 50 du règlement (CEE)
    n° 574/72 fixant les modalités d' application du règlement (CEE) n° 1408/71
    relatif à l' application des régimes de sécurité sociale aux travailleurs
    salariés et à leur famille qui se déplacent à l' intérieur de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2059/72 des Rates vom 26. September 1972 zur Ergänzung
    des Artikels 26 und zur Berichtigung des deutschen Textes des Artikels 50 der
    Verordnung (EWG) Nr. 574/72 über die Durchführung der Verordnung (EWG) Nr. 1408/71
    zur Anwendung der Systeme der sozialen Sicherheit auf Arbeitnehmer und deren Familien,
    die innerhalb der Gemeinschaft zu- und abwandern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2059/72 af 26. september 1972 om tillæg
    til artikel 26 og om berigtigelse af artikel 50 i den tyske tekst til forordning
    (EØF) nr. 574/72 om regler til gennemførelse af forordning (EØF) nr. 1408/71
    om anvendelse af de sociale sikringsordninger på arbejdstagere og deres familiemedlemmer,
    som flytter inden for Fællesskabet
  type: main
