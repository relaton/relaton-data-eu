---
id: EUDecision2017486
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/486 of 17 March 2017 amending
    Annexes I and II to Decision 2004/558/EC as regards the infectious bovine rhinotracheitis-free
    status of Luxembourg, of the Federal States Hamburg and Schleswig-Holstein of
    Germany and of Jersey, and amending Annex II to Decision 2008/185/EC as regards
    the Aujeszky's disease-free status of the Friuli Venezia Giulia region of Italy
    (notified under document C(2017) 1689)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/486 de la Commission du 17 mars 2017 modifiant
    les annexes I et II de la décision 2004/558/CE en ce qui concerne le statut de
    «zone exempte de la rhinotrachéite infectieuse bovine» du Luxembourg, des Länder
    allemands de Hambourg et de Schleswig-Holstein et de l'île de Jersey et modifiant
    l'annexe II de la décision 2008/185/CE en ce qui concerne le statut de «zone
    exempte de la maladie d'Aujeszky» de la région de Friuli Venezia Giulia en Italie
    [notifiée sous le numéro C(2017) 1689]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/486 der Kommission vom 17. März 2017
    zur Änderung der Anhänge I und II der Entscheidung 2004/558/EG in Bezug auf
    den Status Luxemburgs, der deutschen Bundesländer Hamburg und Schleswig-Holstein
    sowie Jerseys als frei von der infektiösen bovinen Rhinotracheitis und zur Änderung
    von Anhang II der Entscheidung 2008/185/EG in Bezug auf den Status der Region
    Friaul-Julisch Venetien in Italien als frei von der Aujeszky-Krankheit (Bekannt
    gegeben unter Aktenzeichen C(2017) 1689)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/486 на Комисията
    от 17 март 2017 година за изменение на приложения
    I и II към Решение 2004/558/ЕО по отношение на статута
    на свободни от инфекциозен ринотрахеит по
    говедата, приложим за Люксембург, федералните
    провинции Хамбург и Шлезвиг-Холщайн в Германия
    и Джърси, и за изменение на приложение II към
    Решение 2008/185/ЕО по отношение на статута на
    свободен от болестта на Ауески на италианския
    регион Фриули-Венеция Джулия (нотифицирано
    под номер С(2017) 1689)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/486 ze dne 17. března 2017,
    kterým se mění přílohy I a II rozhodnutí 2004/558/ES, pokud jde o status
    Lucemburska, spolkových zemí Hamburk a Šlesvicko-Holštýnsko v Německu a
    ostrova Jersey jako území prostých infekční bovinní rinotracheitidy, a příloha
    II rozhodnutí 2008/185/ES, pokud jde o status regionu Furlansko-Julské Benátsko
    v Itálii jako území prostého Aujeszkyho choroby (oznámeno pod číslem C(2017)
    1689)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/486 af 17. marts 2017
    om ændring af bilag I og II til beslutning 2004/558/EF for så vidt angår status
    som værende fri for infektiøs bovin rhinotracheitis for Luxembourg, for delstaterne
    Hamburg og Schleswig-Holstein i Tyskland og for Jersey og om ændring af bilag
    II til beslutning 2008/185/EF for så vidt angår status som værende fri for
    Aujeszkys sygdom for regionen Friuli Venezia Giulia i Italien (meddelt under nummer
    C(2017) 1689)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/486 της Επιτροπής,
    της 17ης Μαρτίου 2017, για την τροποποίηση των
    παραρτημάτων I και ΙΙ της απόφασης 2004/558/ΕΚ όσον
    αφορά την αναγνώριση του Λουξεμβούργου, των
    ομόσπονδων κρατών του Αμβούργου και του Σλέσβιχ-Χολστάιν
    της Γερμανίας καθώς και του Τζέρζι ως απαλλαγμένων
    από τη λοιμώδη ρινοτραχειίτιδα των βοοειδών,
    και για την τροποποίηση του παραρτήματος II
    της απόφασης 2008/185/ΕΚ όσον αφορά την αναγνώριση
    της περιφέρειας Φρίουλι-Ιουλιανής Βενετίας
    της Ιταλίας ως απαλλαγμένης από τη νόσο του
    Aujeszky [κοινοποιηθείσα υπό τον αριθμό C(2017) 1989]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/486, 17. märts 2017, millega muudetakse
    otsuse 2004/558/EÜ I ja II lisa seoses veiste infektsioossest rinotrahheiidist
    vaba staatuse andmisega Luksemburgile, Saksamaa Hamburgi ja Schleswig-Holsteini
    liidumaadele ning Jersey'le, ning millega muudetakse otsuse 2008/185/EÜ II lisa
    seoses Aujeszky haigusest vaba staatuse andmisega Itaalia Friuli-Venezia Giulia
    maakonnale (teatavaks tehtud numbri C(2017) 1689 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/486, annettu 17 päivänä
    maaliskuuta 2017, päätöksen 2004/558/EY liitteiden I ja II muuttamisesta Luxemburgin,
    Saksan Hampurin ja Schleswig-Holsteinin osavaltioiden sekä Jerseyn naudan tarttuvasta
    rinotrakeiitista vapaan aseman osalta ja päätöksen 2008/185/EY liitteen II
    muuttamisesta Friuli-Venezia Giulian alueen Aujeszkyn taudista vapaan aseman osalta
    (tiedoksiannettu numerolla C(2017) 1689)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/486 оd 17. ožujka 2017. o izmjeni
    priloga I. i II. Odluci 2004/558/EZ u pogledu statusa područja slobodnoga od
    zaraznoga goveđeg rinotraheitisa za Luksemburg, za njemačke savezne države
    Hamburg i Schleswig-Holstein te za Jersey i o izmjeni Priloga II. Odluci 2008/185/EZ
    u pogledu statusa područja slobodnoga od bolesti Aujeszkoga za talijansku regiju
    Furlanija-Julijska krajina (priopćeno pod brojem dokumenta C(2017) 1689)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/486 végrehajtási határozata (2017. március 17.)
    a 2004/558/EK határozat I. és II. mellékletének a Luxemburgnak, a németországi
    Hamburg és Schleswig-Holstein szövetségi tartományoknak és Jersey-nek a szarvasmarhák
    fertőző rhinotracheitisétől mentes státusa tekintetében, valamint a 2008/185/EK
    határozat II. mellékletének az olaszországi Friuli Venezia Giulia régió
    Aujeszky-féle betegségtől mentes státusa tekintetében történő módosításáról
    (az értesítés a C(2017) 1689. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/486 della Commissione, del 17 marzo 2017,
    che modifica gli allegati I e II della decisione 2004/558/CE per quanto riguarda
    la qualifica di indenne dalla rinotracheite bovina infettiva del Lussemburgo,
    dei Länder tedeschi Amburgo e Schleswig-Holstein e di Jersey, e che modifica
    l'allegato II della decisione 2008/158/CE per quanto riguarda la qualifica di
    indenne dalla malattia di Aujeszky della regione italiana Friuli Venezia Giulia
    [notificata con il numero C(2017) 1689]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/486 (2017. gada 17. marts), ar
    ko attiecībā uz Luksemburgas, Vācijas federālo zemju Hamburgas un Šlēsvigas-Holšteinas
    un Džērsijas kā no govju infekciozā rinotraheīta brīvu reģionu statusu
    groza Lēmuma 2004/558/EK I un II pielikumu un attiecībā uz Itālijas Friuli-Venēcijas
    Džūlijas reģionu kā no Aujeski slimības brīva reģiona statusu groza Lēmuma
    2008/185/EK II pielikumu (izziņots ar dokumenta numuru C(2017) 1689)
  type: main
- language: lt
  script: Latn
  content: 2017 m. kovo 17 d. Komisijos įgyvendinimo sprendimas (ES) 2017/486, kuriuo
    dėl Liuksemburgo, Vokietijos Hamburgo ir Šlėzvigo-Holšteino federalinių žemių
    ir Džersio statuso kaip neužkrėstų infekciniu galvijų rinotracheitu iš dalies
    keičiami Sprendimo 2004/558/EB I ir II priedai ir dėl Italijos Friulio-Venecijos
    Džulijos regiono statuso kaip neužkrėsto Aujeskio liga iš dalies keičiamas
    Sprendimo 2008/185/EB II priedas (pranešta dokumentu Nr. C(2017) 1689)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/486 tas-17 ta'
    Marzu 2017 li temenda l-Annessi I u II tad-Deċiżjoni 2004/558/KE fir-rigward
    tal-istat ħieles mir-rinotrakeite bovina infettiva tal-Lussemburgu, tal-Istati
    Federali ta' Hamburg u ta' Schleswig-Holstein fil-Ġermanja u ta' Jersey, u li
    temenda l-Anness II tad-Deċiżjoni 2008/185/KE fir-rigward tal-istat ħieles
    mill-marda ta' Aujeszky tar-reġjun ta' Friuli Venezia Giulia fl-Italja (notifikata
    bid-dokument C(2017) 1689)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/486 van de Commissie van 17 maart 2017 tot
    wijziging van de bijlagen I en II bij Beschikking 2004/558/EG wat betreft de status
    van Luxemburg, de deelstaten Hamburg en Sleeswijk-Holstein van Duitsland en Jersey
    als vrij van infectieuze boviene rhinotracheïtis, en tot wijziging van bijlage
    II bij Beschikking 2008/185/EG wat betreft de status van de regio Friuli-Venezia
    Giulia van Italië als vrij van de ziekte van Aujeszky (Kennisgeving geschied
    onder nummer C(2017) 1689)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/486 z dnia 17 marca 2017 r. zmieniająca
    załączniki I i II do decyzji 2004/558/WE w odniesieniu do statusu Luksemburga,
    Jersey oraz niemieckich krajów związkowych Hamburg i Szlezwik-Holsztyn jako
    obszarów wolnych od zakaźnego zapalenia nosa i tchawicy bydła oraz zmieniająca
    załącznik II do decyzji 2008/185/WE w odniesieniu do statusu włoskiego regionu
    Friuli-Wenecja Julijska jako obszaru wolnego od choroby Aujeszkyego (notyfikowana
    jako dokument nr C(2017) 1689)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/486 da Comissão, de 17 de março de 2017,
    que altera os anexos I e II da Decisão 2004/558/CE no que diz respeito ao estatuto
    de indemnidade de rinotraqueíte infecciosa dos bovinos do Luxemburgo, dos Estados
    federados de Hamburgo e Schleswig-Holstein, na Alemanha, e de Jersey, e que altera
    o anexo II da Decisão 2008/185/CE no que diz respeito ao estatuto de indemnidade
    da doença de Aujeszky da região de Friul-Venécia Juliana, em Itália [notificada
    com o número C(2017) 1689]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/486 a Comisiei din 17 martie 2017
    de modificare a anexelor I și II la Decizia 2004/558/CE în ceea ce privește
    statutul de regiune indemnă de rinotraheită infecțioasă bovină al Luxemburgului,
    al landurilor Hamburg și Schleswig-Holstein din Germania și al Jersey și de
    modificare a anexei II la Decizia 2008/185/CE în ceea ce privește statutul de
    regiune indemnă de boala Aujeszky al regiunii Friuli Venezia Giulia din Italia
    [notificată cu numărul C(2017) 1689]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/486 zo 17. marca 2017, ktorým
    sa menia prílohy I a II k rozhodnutiu 2004/558/ES, pokiaľ ide o status Luxemburska,
    spolkových krajín Hamburg a Šlezvicko-Holštajnsko v Nemecku a ostrova Jersey
    ako oblastí bez výskytu infekčnej bovinnej rinotracheitídy, a ktorým sa mení
    príloha II k rozhodnutiu 2008/185/ES, pokiaľ ide o status talianskeho regiónu
    Friuli Venezia Giulia ako oblasti bez výskytu Aujeszkého choroby [oznámené
    pod číslom C(2017) 1689]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/486 z dne 17. marca 2017 o spremembi
    prilog I in II k Odločbi 2004/558/ES glede statusa Luksemburga, nemških zveznih
    dežel Hamburg in Schleswig-Holstein ter Jerseyja kot prostih infekcioznega bovinega
    rinotraheitisa ter o spremembi Priloge II k Odločbi 2008/185/ES glede statusa
    italijanske dežele Furlanija – Julijska krajina kot proste bolezni Aujeszkega
    (notificirano pod dokumentarno številko C(2017) 1689)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/486 de la Comisión, de 17 de marzo de
    2017, por la que se modifican los anexos I y II de la Decisión 2004/558/CE en
    lo que respecta al reconocimiento como indemnes de rinotraqueítis infecciosa
    bovina de Luxemburgo, de los Estados federados alemanes de Hamburgo y Schleswig-Holstein
    y de Jersey, y se modifica el anexo II de la Decisión 2008/185/CE en lo que respecta
    al reconocimiento como indemne de la enfermedad de Aujeszky de la región italiana
    de Friul-Venecia Julia [notificada con el número C(2017) 1689]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/486 av den 17 mars 2017 om
    ändring av bilagorna I och II till beslut 2004/558/EG vad gäller Luxemburgs,
    de tyska delstaterna Hamburgs och Schleswig-Holsteins samt Jerseys status som
    fria från infektiös bovin rhinotrakeit, och om ändring av bilaga II till beslut
    2008/185/EG vad gäller den italienska regionen Friuli-Venezia Giulias status
    som fri från Aujeszkys sjukdom [delgivet med nr C(2017) 1689]
