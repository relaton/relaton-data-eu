  content: Council Regulation (EEC) No 1674/77 of 19 July 1977 determining, for the
    1977/78 wine-growing year, the prices to be paid under the compulsory distillation
    of the by-products of wine-making and the maximum amount of the contribution from
    the Guarantee Section of the European Agricultural Guidance and Guarantee Fund
  type: main
