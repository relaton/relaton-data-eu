    en bosbouwprodukten in Portugal (Slechts de tekst in de Portugese taal is authentiek)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 13 de Dezembro de 1991, que estabelece um aditamento
    ao quadro comunitário de apoio para as intervenções estruturais comunitárias
    destinadas à melhoria das condições de transformação e comercialização
    dos produtos agrícolas e silvícolas em Portugal (Apenas faz fé o texto em língua
    portuguesa)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 13 de diciembre de 1991, por la que se añade
    un apéndice al marco comunitario de apoyo para la ayuda estructural comunitaria
    a Portugal en la mejora de las condiciones de transformación y comercialización
    de los productos agrícolas y silvícolas (El texto en lengua portuguesa es el
    único auténtico)
