  content: Commission Decision of 13 December 1991 on the establishment of an addendum
    to the Community support framework for Community structural assistance in Portugal
    on the improvement of the conditions under which agricultural and forestry products
    are processed and marketed (Only the Portuguese text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 décembre 1991, concernant l'établissement
    d'un avenant au cadre communautaire d'appui pour les interventions structurelles
    communautaires au Portugal relatif à l'amélioration des conditions de transformation
    et de commercialisation des produits agricoles et sylvicoles (Le texte en langue
    portugaise est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Dezember 1991 über eine Ergänzung
    eines gemeinschaftlichen Förderkonzepts für gemeinschaftliche Strukturinterventionen
    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen land- und forstwirtschaftlicher
    Erzeugnisse in Portugal (Nur der portugiesische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. december 1991 om et tillæg til fællesskabsstøtterammen
    for EF's strukturinterventioner i Portugal til forbedring af vilkårene for forarbejdning
    og afsætning af landbrugsprodukter og skovbrugsprodukter (Kun den portugisiske
    udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 13ης Δεκεμβρίου
    1991 σχετικά με την κατάρτιση μιας προσθήκης
    στο κοινοτικό πλαίσιο στήριξης για παροχή
    κοινοτικής διαρθρωτικής βοήθειας στην Πορτογαλία
    για τη βελτίωση των συνθηκών μεταποίησης και
    εμπορίας των γεωργικών και δασοκομικών προϊόντων
    (Το κείμενο στην πορτογαλική γλώσσα είναι το
    μόνο αυθεντικό)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 dicembre 1991, riguardante la definizione
    di un addendum del Quadro comunitario di sostegno per gli interventi strutturali
    comunitari in Portogallo in ordine al miglioramento delle condizioni di trasformazione
    e di commercializzazione dei prodotti agricoli e della silvicoltura (Il testo
    in lingua portoghese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 december 1991 tot vaststelling van
