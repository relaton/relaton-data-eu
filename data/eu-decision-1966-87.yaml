title:
- language: fr
  script: Latn
  content: Décision 66/87/CEE de la Commission, du 23 décembre 1965, portant prorogation
    de la validité de sa décision du 31 août 1962 à la suite de recours de la
    République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire les feuilles de tabac non écotées et les
    déchets de tabac originaires des pays tiers et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '66/87/EWG: Entscheidung der Kommission vom 23. Dezember 1965 betreffend
    Verlängerung der Gültigkeitsdauer ihrer Entscheidung vom 31. Oktober 1962 über
    die Inanspruchnahme von Artikel 115 Absatz (1) des EWG- Vertrages durch die Bundesrepublik
    Deutschland, um aus dritten Ländern stammende nicht entrippte Tabakblätter und
    Tabakabfälle, die in den anderen Mitgliedstaaten in den freien Verkehr gebracht
    worden sind, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/87/CEE: Decisione della Commissione, del 23 dicembre 1965, che proroga
    la validità della decisione adottata il 31 ottobre 1962 a seguito del ricorso
    della Repubblica federale di Germania all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario i tabacchi greggi o non lavorati ed
    i cascami di tabacchi provenienti dai paesi terzi ed introdotti in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/87/EEG: Beschikking van de Commissie van 23 december 1965 houdende
    verlenging van de geldigheidsduur van haar beschikking van 31 oktober 1962 betreffende
    het beroep van de Bondsrepubliek Duitsland op artikel 115, alinea 1, van het Verdrag
    om niet gestripte tabaksbladeren en afvallen van tabak, die van oorsprong zijn
    uit derde landen en in de andere Lid-Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
