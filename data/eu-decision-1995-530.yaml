id: EUDecision1995530
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '95/530/EC, Euratom: Commission Decision of 29 November 1995 amending Decision
    92/164/EEC, Euratom authorizing Portugal to use statistics for years earlier than
    the last year but one and not to take into account certain categories of transactions
    or to use certain approximate estimates for the calculation of the VAT own resources
    base (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/530/CE, Euratom: Décision de la Commission, du 29 novembre 1995, modifiant
    la décision 92/164/CEE, Euratom, autorisant le Portugal à utiliser des données
    statistiques antérieures à la pénultième année et à ne pas tenir compte
    de certaines catégories d''opérations ou à utiliser certaines estimations approximatives
    pour le calcul de la base des ressources propres provenant de la taxe sur la valeur
    ajoutée (Le texte en langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '95/530/EG, Euratom: Entscheidung der Kommission vom 29. November 1995
    zur Änderung der Entscheidung 92/164/EWG, Euratom, mit der Portugal ermächtigt
    wird, statistische Angaben aus Jahren vor dem vorletzten Jahr vor dem betreffenden
    Haushaltsjahr zu verwenden, bei der Berechnung der Grundlage für die Mehrwertsteuereigenmittel
    bestimmte Gruppen von Umsätzen nicht zu berücksichtigen und die Grundlage bei
    bestimmten anderen Gruppen von Umsätzen anhand annähernder Schätzungen zu ermitteln
    (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/530/EF, Euratom: Kommissionens beslutning af 29. november 1995 om ændring
    af beslutning 92/164/EØF, Euratom om bemyndigelse af Portugal til at beregne
    grundlaget for Fællesskabernes momsindtægter på basis af statistiske oplysninger
    hidrørende fra det år, der ligger længere tilbage end det næstsidste år,
    at undlade at tage hensyn til visse transaktioner og, for andre transaktioners
    vedkommende, at foretage en tilnærmelsesvis vurdering (Kun den portugisiske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '95/530/ΕΚ, Ευρατόμ: Απόφαση της Επιτροπής,
    της 29ης Νοεμβρίου 1995, για την τροποποίηση της
    απόφασης 92/164/ΕΟΚ, Ευρατόμ, με την οποία επιτρέπεται
    στην Πορτογαλία να χρησιμοποιεί στατιστικά
    δεδομένα προγενέστερα εκείνων του προτελευταίου
    έτους και να μην λαμβάνει υπόψη ορισμένες κατηγορίες
    δραστηριοτήτων ή να χρησιμοποιεί κατά προσέγγιση
    εκτιμήσεις κατά τον υπολογισμό της βάσης των
    ιδίων πόρων που προέρχονται από το φόρο επί
    της προστιθέμενης αξίας (Το κείμενο στην πορτογαλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/530/EY, Euratom: Komission päätös, tehty 29 päivänä marraskuuta
    1995, Portugalille annetusta luvasta käyttää edellistä vuotta edeltäviä
    tilastotietoja ja olla ottamatta huomioon tiettyjä liiketoimien luokkia tai käyttää
    tiettyjä summittaisia arvioita arvonlisäverosta kertyvien omien varojen laskentaperusteena
    tehdyn päätöksen 92/164/ETY, Euratom muuttamisesta (Ainoastaan portugalinkielinen
    teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/530/CE, Euratom: Decisione della Commissione, del 29 novembre 1995,
    che modifica la decisione 92/164/CEE, Euratom, che autorizza la Repubblica portoghese
    a utilizzare dati statistici anteriori al penultimo anno e a non tener conto di
    determinate categorie di operazioni o a ricorrere a talune valutazioni approssimative
    per il calcolo della base delle risorse proprie provenienti dell''imposta sul
    valore aggiunto (Il testo in portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '95/530/EG, Euratom: Beschikking van de Commissie van 29 november 1995
    tot wijziging van Beschikking 92/164/EEG, Euratom waarbij Portugal wordt gemachtigd
    statistische gegevens van vóór het voorlaatste jaar te gebruiken en geen rekening
    te houden met bepaalde categorieën handelingen of gebruik te maken van ramingen
    voor de berekening van de grondslag van de eigen middelen uit de belasting over
    de toegevoegde waarde (Slechts de tekst in de Portugese taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '95/530/CE, Euratom: Decisão da Comissão, de 29 de Novembro de 1995,
    que altera a Decisão 92/164/CEE, Euratom, que autoriza Portugal a utilizar dados
    estatísticos anteriores ao penúltimo ano e a não ter em conta determinadas
    categorias de operações ou a utilizar determinadas estimativas aproximadas para
    o cálculo da matéria colectável dos recursos próprios provenientes do imposto
    sobre o valor acrescentado (Apenas faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '95/530/CE, Euratom: Decisión de la Comisión, de 29 de noviembre de 1995,
    por la que se modifica la Decisión 92/164/CEE, Euratom, por la que se autoriza
    a Portugal a utilizar datos estadísticos anteriores al penúltimo año y a no
    tener en cuenta determinadas categorías de operaciones o a utilizar determinadas
    estimaciones aproximadas para el cálculo de la base de los recursos propios procedentes
    del impuesto sobre el valor añadido (El texto en lengua portuguesa es el único
    auténtico)'
  type: main
- language: sv
  script: Latn
  content: '95/530/EG, Euratom: Kommissionens beslut av den 29 november 1995 om ändring
    av beslut 92/164/EEG, Euratom, som bemyndigar Portugal att använda statistiska
    uppgifter som upprättats före det näst sista året och att inte beakta vissa
    kategorier av transaktioner eller att använda vissa ungefärliga uppskattningar
    vid beräkning av den bas av egna medel som härrör från mervärdeskatten (Endast
    den portugisiska texten är giltig)'
  type: main
