    kohdan osalta niiden kolmansien maiden ja kolmansien maiden osien luettelossa,
    joista lihavalmisteiden sekä käsiteltyjen mahojen, rakkojen ja suolten tuonti
    unioniin on sallittua korkeapatogeenisen lintuinfluenssan yhteydessä (tiedoksiannettu
    numerolla C(2015) 554)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/204 оd 6. veljače 2015. o izmjeni
    Priloga II. Odluci 2007/777/EZ u pogledu unosa za Kanadu na popisu trećih zemalja
    ili dijelova njihova državnog područja iz kojih je odobreno unošenje mesnih
    proizvoda i obrađenih želudaca, mjehura i crijeva u Uniju, u vezi s visokopatogenom
    influencom ptica (priopćeno pod brojem dokumenta C(2015) 554)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/204 végrehajtási határozata ( 2015. február
    6. ) a 2007/777/EK határozat II. mellékletének a húskészítmények, kezelt
    gyomor, hólyag és belek Unióba történő behozatalára engedélyezett harmadik
    országok vagy azok részei jegyzékében a Kanadára vonatkozó bejegyzésnek
    a magas patogenitású madárinfluenzával kapcsolatban történő módosításáról
    (az értesítés a C(2015) 554. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/204 della Commissione, del 6 febbraio
    2015 , che modifica l'allegato II della decisione 2007/777/CE per quanto riguarda
    la voce relativa al Canada nell'elenco di paesi terzi o di parti di paesi terzi
    dai quali l'introduzione nell'Unione di prodotti a base di carne e stomaci, vesciche
    e intestini trattati è autorizzata, in relazione all'influenza aviaria ad alta
    patogenicità [notificata con il numero C(2015) 554]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/204 ( 2015. gada 6. februāris
    ), ar ko groza Lēmuma 2007/777/EK II pielikumu attiecībā uz ierakstu par Kanādu
    to trešo valstu vai to daļu sarakstā, no kurām Savienībā atļauts ievest
    gaļas produktus un apstrādātus kuņģus, pūšļus un zarnas, saistībā ar
    augsti patogēno putnu gripu (izziņots ar dokumenta numuru C(2015) 554)
  type: main
- language: lt
  script: Latn
  content: '2015 m. vasario 6 d. Komisijos įgyvendinimo sprendimas (ES) 2015/204,
