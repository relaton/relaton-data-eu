    tat-tjur b'patoġeniċità għolja (notifikata bid-dokument C(2015) 554)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/204 van de Commissie van 6 februari 2015 tot
    wijziging van bijlage II bij Beschikking 2007/777/EG wat betreft de vermelding
    voor Canada in de lijst van derde landen of delen daarvan waaruit vleesproducten
    en behandelde magen, blazen en darmen in de Unie mogen worden binnengebracht in
    verband met hoogpathogene aviaire influenza (Kennisgeving geschied onder nummer
    C(2015) 554)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/204 z dnia 6 lutego 2015 r. zmieniająca
    załącznik II do decyzji 2007/777/WE w zakresie wpisu dotyczącego Kanady w wykazie
    państw trzecich lub ich części, z których dozwolone jest wprowadzanie do Unii
    produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit w odniesieniu
    do wysoce zjadliwej grypy ptaków (notyfikowana jako dokument nr C(2015) 554)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/204 da Comissão, de 6 de fevereiro de
    2015 , que altera o anexo II da Decisão 2007/777/CE no que se refere à entrada
    relativa ao Canadá na lista de países terceiros ou de partes de países terceiros
    a partir dos quais é autorizada a introdução na União de produtos à base
    de carne e de estômagos, bexigas e intestinos tratados, relativamente à gripe
    aviária de alta patogenicidade [notificada com o número C(2015) 554]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/204 a Comisiei din 6 februarie
    2015 de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește rubrica
    referitoare la Canada din lista țărilor terțe sau a părților acestora din
    care se autorizează introducerea în Uniune de produse din carne și stomacuri,
    vezici și intestine tratate, cu privire la gripa aviară înalt patogenă [notificată
    cu numărul C(2015) 554]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/204 zo 6. februára 2015 ,
    ktorým sa mení príloha II k rozhodnutiu 2007/777/ES, pokiaľ ide o zápis týkajúci
    sa Kanady v zozname tretích krajín alebo ich častí, z ktorých je povolený
    vstup mäsových výrobkov a opracovaných žalúdkov, mechúrov a čriev do Únie
    v súvislosti s vysokopatogénnou aviárnou influenzou [oznámené pod číslom
    C(2015) 554]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/204 z dne 6. februarja 2015 o spremembi
    Priloge II k Odločbi 2007/777/ES glede vnosa za Kanado na seznamu tretjih držav
    ali njihovih delov, iz katerih je dovoljen vnos mesnih izdelkov ter obdelanih
    želodcev, mehurjev in črev v Unijo v zvezi z visokopatogeno aviarno influenco
    (notificirano pod dokumentarno številko C(2015) 554)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/204 de la Comisión, de 6 de febrero
    de 2015 , que modifica el anexo II de la Decisión 2007/777/CE en lo que respecta
    a la entrada correspondiente a Canadá de la lista de terceros países y partes
    de los mismos desde los que está autorizada la introducción en la Unión de
    estómagos, vejigas e intestinos tratados, en relación con la gripe aviar altamente
    patógena [notificada con el número C(2015) 554]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2015/204 av den 6 februari 2015
    om ändring av bilaga II till beslut 2007/777/EG vad gäller uppgifterna om Kanada
    i förteckningen över tredjeländer och delar av tredjeländer från vilka köttprodukter
    och behandlade magar, blåsor och tarmar får föras in till unionen i samband
    med högpatogen aviär influensa [delgivet med nr C(2015) 554]
