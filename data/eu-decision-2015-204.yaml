    αφορά την καταχώριση για τον Καναδά στον κατάλογο
    τρίτων χωρών ή τμημάτων τους εκ των οποίων
    επιτρέπεται η εισαγωγή στην Ένωση προϊόντων
    με βάση το κρέας και επεξεργασμένων στομαχιών,
    ουροδόχων κύστεων και εντέρων, όσον αφορά την
    υψηλής παθογονικότητας γρίπη των πτηνών [κοινοποιηθείσα
    υπό τον αριθμό C(2015) 554]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2015/204, 6. veebruar 2015 , millega muudetakse
    kõrge patogeensusega linnugripiga seonduvalt otsuse 2007/777/EÜ II lisas esitatud
    Kanadat käsitlevat kannet loetelus, kus on esitatud need kolmandad riigid või
