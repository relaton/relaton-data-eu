id: EUDecision2015204
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/204 of 6 February 2015 amending
    Annex II to Decision 2007/777/EC as regards the entry for Canada in the list of
    third countries or parts thereof from which the introduction of meat products
    and treated stomachs, bladders and intestines into the Union is authorised in
    relation to highly pathogenic avian influenza (notified under document C(2015)
    554)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/204 de la Commission du 6 février 2015
    modifiant l'annexe II de la décision 2007/777/CE en ce qui concerne l'entrée
    relative au Canada sur la liste des pays tiers ou parties de pays tiers à partir
    desquels l'introduction dans l'Union de produits à base de viande et d'estomacs,
    vessies et boyaux traités est autorisée dans le cadre des mesures de protection
    contre l'influenza aviaire hautement pathogène [notifiée sous le numéro C(2015)
    554]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/204 der Kommission vom 6. Februar 2015
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich des Eintrags
    für Kanada in der Liste von Drittländern bzw. Teilen von Drittländern, aus
    denen die Einfuhr von Fleischerzeugnissen und behandelten Mägen, Blasen und Därmen
    in die Europäische Union gestattet ist, in Bezug auf die hochpathogene aviäre
    Influenza (Bekanntgegeben unter Aktenzeichen C(2015) 554)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/204 на Комисията
    от 6 февруари 2015 година за изменение, във връзка
    с високопатогенна инфлуенца по птиците, на
    приложение II към Решение 2007/777/ЕО по отношение
    на вписването за Канада в списъка с трети държави
    или части от тях, от които е разрешено въвеждането
    в ЕС на месни продукти и обработени стомаси,
    пикочни мехури и черва (нотифицирано под номер
    С(2015) 554)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/204 ze dne 6. února 2015 , kterým
    se mění příloha II rozhodnutí 2007/777/ES, pokud jde položku týkající
    se Kanady na seznamu třetích zemí nebo jejich částí, z nichž je do Unie
    povolen dovoz masných výrobků a opracovaných žaludků, močových měchýřů
    a střev v souvislosti s vysoce patogenní influenzou ptáků (oznámeno pod číslem
    C(2015) 554)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/204 af 6. februar 2015
    om ændring af bilag II til beslutning 2007/777/EF for så vidt angår oplysningerne
    om Canada i listen over tredjelande og dele af tredjelande, hvorfra det er tilladt
    at importere kødprodukter og behandlede maver, blærer og tarme til Unionen i
    forbindelse med højpatogen aviær influenza (meddelt under nummer C(2015) 554)
  type: main
- language: el
  script: Grek
