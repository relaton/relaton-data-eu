  content: Commission Implementing Regulation (EU) 2023/2743 of 8 December 2023 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Quercus petraea and Quercus robur originating in the United Kingdom and Implementing
    Regulation (EU) 2020/1213 as regards the phytosanitary measures for the introduction
    of those plants for planting into the Union territory
  type: main
- language: fr
  script: Latn
