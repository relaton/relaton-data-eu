    certains végétaux destinés à la plantation appartenant aux espèces Quercus
    petraea et Quercus robur et originaires du Royaume-Uni et le règlement d’exécution
    (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires préalables à l’introduction
