  script: Latn
  content: '63/638/EWG: Entscheidung der Kommission vom 14. Oktober 1963 betreffend
    die Berechnung der Sätze des durch die Entscheidung vom 14. Oktober 1963 über
    den Verkehr mit Waren, die unter den Voraussetzungen des Artikels 10 Absatz (2)
    2. Unterabsatz des Vertrages gewonnen worden sind, eingeführten anteiligen Zolls'
  type: main
