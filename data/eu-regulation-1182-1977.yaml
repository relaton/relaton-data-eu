  content: Council Regulation (EEC) No 1182/77 of 17 May 1977 opening, allocating
    and providing for the administration of a Community tariff quota for fresh or
    dried hazelnuts, shelled or otherwise, falling within subheading ex 08.05 G of
    the Common Customs Tariff, originating in Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1182/77 du Conseil, du 17 mai 1977, portant ouverture,
    répartition et mode de gestion d'un contingent tarifaire communautaire pour les
    noisettes fraîches ou sèches, même sans leurs coques ou décortiquées, de
    la sous-position EX 08.05 G du tarif douanier commun, originaires de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1182/77 des Rates vom 17. Mai 1977 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für Haselnüsse,
    frisch oder getrocknet, auch ohne äußere Schalen oder enthäutet, der Tarifstelle
    ex 08.05 G des Gemeinsamen Zolltarifs mit Ursprung in der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1182/77 af 17. maj 1977 om åbning, fordeling
