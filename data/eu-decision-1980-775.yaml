title:
- language: en
  script: Latn
  content: '80/775/EEC: Commission Decision of 25 July 1980 laying down methods of
    control for maintaining the officially brucellosis-free status of bovine herds
    in certain regions of the Federal Republic of Germany (Only the German text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/775/CEE: Décision de la Commission, du 25 juillet 1980, établissant
    les méthodes de contrôle visant à maintenir le statut de cheptels bovins officiellement
    indemnes de brucellose dans certaines régions de la République fédérale d''Allemagne
    (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/775/EWG: Entscheidung der Kommission vom 25. Juli 1980 zur Festlegung
    der Kontrollmethoden für die Beibehaltung des amtlich anerkannt brucellosefreien
    Status der Rinderbestände in bestimmten Gebieten der Bundesrepublik Deutschland
    (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/775/EØF: Kommissionens beslutning af 25. juli 1980 om fastsættelse
    af kontrolbestemmelser med henblik på i visse regioner i Forbundsrepublikken
    Tyskland at bevare kvægbesætningernes status som værende officielt fri for
    brucellose (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/775/ΕΟΚ: Απόφαση της Επιτροπής, της 25ης
