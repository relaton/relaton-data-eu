    представен от Полша съгласно член 31, параграф
    2 от Директива (ЕС) 2018/2001 на Европейския парламент
    и на Съвета, съдържа точни данни за целите на
    измерването на емисиите на парникови газове,
    свързани с отглеждането на рапица и царевица
    в тази държава членка
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/2292 ze dne 7. listopadu 2025,
    kterým se uznává, že zpráva předložená Polskem podle čl. 31 odst. 2 směrnice
    Evropského parlamentu a Rady (EU) 2018/2001 obsahuje přesné údaje pro účely
    měření emisí skleníkových plynů spojených s pěstováním řepky olejky
    a kukuřice seté v uvedeném členském státě
  type: main
- language: da
  script: Latn
