    31 ust. 2 dyrektywy Parlamentu Europejskiego i Rady (UE) 2018/2001 zawiera dokładne
    dane służące do pomiaru emisji gazów cieplarnianych związanych z uprawą
    rzepaku i kukurydzy w tym państwie członkowskim
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/2292 da Comissão, de 7 de novembro de
