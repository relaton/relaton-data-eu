    parlamentu a Rady (EÚ) 2018/2001 predložilo Poľsko, obsahuje presné údaje
    na účely merania emisií skleníkových plynov spojených s pestovaním repky
    olejnej a kukurice v predmetnom členskom štáte
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/2292 z dne 7. novembra 2025 o potrditvi,
    da poročilo, ki ga je Poljska predložila v skladu s členom 31(2) Direktive
    (EU) 2018/2001 Evropskega parlamenta in Sveta, vsebuje točne podatke za namene
