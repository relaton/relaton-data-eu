    direktiv (EU) 2018/2001 af, at den af Polen fremlagte rapport indeholder nøjagtige
    data med henblik på måling af drivhusgasemissioner i forbindelse med dyrkning
    af raps og majs i Polen
  type: main
- language: el
  script: Grek
