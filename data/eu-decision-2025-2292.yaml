title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/2292 of 7 November 2025 recognising
    that the report submitted by Poland under Article 31(2) of Directive (EU) 2018/2001
    of the European Parliament and of the Council contains accurate data for the purposes
    of measuring the greenhouse gas emissions associated with the cultivation of rapeseed
    and maize in that Member State
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/2292 de la Commission du 7 novembre
    2025 reconnaissant que le rapport soumis par la Pologne au titre de l’article
    31, paragraphe 2, de la directive (UE) 2018/2001 du Parlement européen et du
    Conseil contient des données précises aux fins de la mesure des émissions de
    gaz à effet de serre associées à la culture du colza et du maïs dans ledit
    État membre
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/2292 der Kommission vom 7. November 2025
    zur Anerkennung, dass der von Polen gemäß Artikel 31 Absatz 2 der Richtlinie
    (EU) 2018/2001 des Europäischen Parlaments und des Rates vorgelegte Bericht genaue
    Daten für die Messung der auf den Anbau von Raps und Mais in diesem Mitgliedstaat
    zurückgehenden Treibhausgasemissionen enthält
  type: main
- language: bg
  script: Cyrl
