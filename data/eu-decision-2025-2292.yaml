  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2025/2292 van de Commissie van 7 november 2025
    tot erkenning dat het door Polen overeenkomstig artikel 31, lid 2, van Richtlijn
    (EU) 2018/2001 van het Europees Parlement en de Raad ingediende verslag nauwkeurige
    gegevens bevat ten behoeve van de meting van de broeikasgasemissies gerelateerd
    aan de teelt van koolzaad en mais in die lidstaat
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2025/2292 z dnia 7 listopada 2025 r. w
