    31.o, n.o 2, da Diretiva (UE) 2018/2001 do Parlamento Europeu e do Conselho contém
    dados precisos para efeitos de medição das emissões de gases com efeito de
    estufa associadas ao cultivo de colza e milho nesse Estado-Membro
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/2292 a Comisiei din 7 noiembrie
    2025 de recunoaștere a faptului că raportul prezentat de Polonia în temeiul
    articolului 31 alineatul (2) din Directiva (UE) 2018/2001 a Parlamentului European
    și a Consiliului conține date exacte în scopul măsurării emisiilor de gaze
    cu efect de seră asociate cultivării rapiței și porumbului în statul membru
    respectiv
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/2292 zo 7. novembra 2025, ktorým
