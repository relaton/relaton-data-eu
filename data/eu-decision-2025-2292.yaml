    con el artículo 31, apartado 2, de la Directiva (UE) 2018/2001 del Parlamento
    Europeo y del Consejo contiene datos exactos a efectos de la medición de las
    emisiones de gases de efecto invernadero asociadas al cultivo de colza y maíz
    en ese Estado miembro
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2025/2292 av den 7 november 2025
    om erkännande av att den rapport som Polen överlämnat i enlighet med artikel
    31.2 i Europaparlamentets och rådets direktiv (EU) 2018/2001 innehåller de tillförlitliga
