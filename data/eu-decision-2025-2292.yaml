    31, paragrafo 2, della direttiva (UE) 2018/2001 del Parlamento europeo e del Consiglio
    contiene dati accurati ai fini della misurazione delle emissioni di gas a effetto
    serra associate alla coltivazione di colza e granturco in tale Stato membro
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/2292 (2025. gada 7. novembris),
