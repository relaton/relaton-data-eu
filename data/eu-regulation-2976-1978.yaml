title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2976/78 of 15 December 1978 re-establishing
    the levying of customs duties on fabric of asbestos, other, falling within subheadings
    68.13 B II and III and originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2976/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres tissus
    en amiante, des sous-positions tarifaires 68.13 B II et III, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2976/78 der Kommission vom 15. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für andere Gewebe aus Asbest, der Tarifstellen 68.13 B II und
    III, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2976/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af asbest, under underposition
    68.13 B II og III, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2976/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di amianto,
    delle sottovoci doganali 68.13 B II e III, originari della Iugoslavia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2976/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere weefsels
    van asbest, van de onderverdelingen 68.13 B II en III, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
