---
id: EUDecision1978322
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 February 1978 authorizing the French Republic
    not to apply Community treatment to woven fabrics of jute or of other textile
    bast fibres falling within heading No 57.03 of the Common Customs Tariff and sacks
    and bags of a kind used for the packing of goods, of jute or of other textile
    bast fibres falling within heading No 57.03, falling within heading No or subheading
    ex 57.10 or 62.03 ex A, originating in Bangladesh and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '78/322/CEE: Décision de la Commission, du 22 février 1978, autorisant
    la République française à exclure du traitement communautaire les tissus de
    jute ou d''autres fibres textiles libériennes du n° 57.03 de la position 57.10
    du Tarif douanier commun et les sacs et sachets d''emballage neufs en tissus de
    jute ou d''autres fibres textiles libériennes du n° 57.03 de la sous-position
    62.03 Ex A du Tarif douanier commun, originaires de la République populaire du
    Bangladesh et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Februar 1978, mit der die Französische
    Republik ermächtigt wird, aus Bangladesch stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus Jute oder anderen textilen Bastfasern
    der Nummer 57.03 der Tarifnummer 57.10 und Säcke und Beutel zu Verpackungszwecken
    aus Jutegeweben oder aus Geweben aus anderen textilen Bastfasern der Nummer 57.03
    der Tarifnummer 62.03 ex A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 22. februar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof af jute eller andre
    bastfibre henhørende under pos. 57.03 og sække og poser til emballage af jute
    eller andre bastfibre henhørende under pos. ex 57.10 og 62.03 ex A i den fælles
    toldtarif, har oprindelse i Bangladesh og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 febbraio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti di iuta o di altre
    fibre tessili liberiane della voce 57.03 e sacchi e sacchetti da imballaggio di
    tessuti di iuta o di altre fibre tessili liberiane della voce 57.03, della voce
    57.10 e della sottovoce 62.03 ex A della tariffa doganale comune, originari del
    Bangladesh e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 februari 1978 waarbij de Franse Republiek
    wordt gemachtigd weefsels van jute of van andere bastvezels bedoeld bij post 57.03
    en zakken voor verpakkingsdoeleinden van weefsels van jute of van andere bastvezels
    bedoeld bij post 57.03 van de posten ex 57.10 en 62.03 ex A van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek Bangla Desh en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
