  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2006/22/EK irányelve ( 2006. március
    15. ) a közúti szállításra vonatkozó egyes szociális jogszabályokkal kapcsolatos
    3820/85/EGK és a 3821/85/EGK tanácsi rendelet végrehajtásának minimumfeltételeiről
    és a 88/599/EGK tanácsi irányelv hatályon kívül helyezéséről (EGT vonatkozású
    szöveg) - Nyilatkozatok
  type: main
- language: it
  script: Latn
