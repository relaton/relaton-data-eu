  script: Latn
  content: Directive 2006/22/EC of the European Parliament and of the Council of 15
    March 2006 on minimum conditions for the implementation of Council Regulations
    (EEC) No 3820/85 and (EEC) No 3821/85 concerning social legislation relating to
    road transport activities and repealing Council Directive 88/599/EEC (Text with
    EEA relevance) - Declarations
  type: main
- language: fr
  script: Latn
