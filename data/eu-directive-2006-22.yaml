    2006 , sulle norme minime per l'applicazione dei regolamenti (CEE) n. 3820/85
    e (CEE) n. 3821/85 del Consiglio relativi a disposizioni in materia sociale nel
    settore dei trasporti su strada e che abroga la direttiva 88/599/CEE del Consiglio
    (Testo rilevante ai fini del SEE) - Dichiarazioni
  type: main
- language: lv
  script: Latn
