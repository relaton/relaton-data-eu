    établissant les conditions minimales à respecter pour la mise en œuvre des
    règlements du Conseil (CEE) n o 3820/85 et (CEE) n o 3821/85 concernant la législation
    sociale relative aux activités de transport routier et abrogeant la directive
    88/599/CEE du Conseil (Texte présentant de l'intérêt pour l'EEE) - Déclarations
  type: main
- language: de
  script: Latn
