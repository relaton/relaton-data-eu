title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2878/2000 of 28 December 2000 amending Annex
    IV to Council Regulation (EC) No 517/94 on common rules for imports of textile
    products from certain third countries not covered by bilateral agreements, protocols
    or other arrangements, or by other specific Community import rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2878/2000 de la Commission du 28 décembre 2000 modifiant
    l'annexe IV du règlement (CE) nº 517/94 du Conseil relatif au régime commun
    applicable aux importations de produits textiles en provenance de certains pays
    tiers non couverts par des accords, protocoles ou autres arrangements bilatéraux,
    ou par d'autres régimes communautaires spécifiques d'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2878/2000 der Kommission vom 28. Dezember 2000 zur
    Änderung des Anhangs IV zu der Verordnung (EG) Nr. 517/94 des Rates über die
    gemeinsame Regelung der Einfuhren von Textilwaren aus bestimmten Drittländern,
    die nicht unter bilaterale Abkommen, Protokolle, andere Vereinbarungen oder eine
    spezifische gemeinschaftliche Einfuhrregelung fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2878/2000 af 28. december 2000 om ændring
    af bilag IV til Rådets forordning (EF) nr. 517/94 om den fælles ordning for
    indførsel af tekstilvarer fra en række tredjelande, som ikke er omfattet af
    bilaterale aftaler, protokoller eller andre arrangementer eller af andre specifikke
    fællesskabsregler for indførsel
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2878/2000 της Επιτροπής,
    της 28ης Δεκεμβρίου 2000, για την τροποποίηση
    του παραρτήματος IV του κανονισμού (ΕΚ) αριθ.
    517/94 του Συμβουλίου, περί της θεσπίσεως κοινών
    κανόνων για τις εισαγωγές κλωστοϋφαντουργικών
    προϊόντων από ορισμένες τρίτες χώρες τα οποία
    δεν καλύπτονται από διμερείς συμφωνίες, πρωτόκολλα
    ή άλλους διακανονισμούς ή άλλους κοινοτικούς
    κανόνες εισαγωγής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2878/2000, annettu 28 päivänä joulukuuta 2000,
    muiden kuin kahdenvälisten sopimusten, pöytäkirjojen tai muiden järjestelyjen
    taikka muiden yhteisön erityisten tuontimenettelyjen soveltamisalaan kuuluvien
    tiettyjen kolmansien maiden tekstiilituotteiden tuontiin sovellettavasta yhteisestä
    menettelystä annetun neuvoston asetuksen (EY) N:o 517/94 liitteen IV muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2878/2000 della Commissione, del 28 dicembre 2000,
    che modifica l'allegato IV del regolamento (CE) n. 517/94 del Consiglio che concerne
    il regime comune applicabile alle importazioni di prodotti tessili da taluni paesi
    terzi, non contemplato da accordi bilaterali, da protocolli o da altre disposizioni
    né da altro regime comunitario specifico in materia di importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2878/2000 van de Commissie van 28 december 2000 tot
    wijziging van bijlage IV bij Verordening (EG) nr. 517/94 van de Raad betreffende
    een gemeenschappelijke regeling voor de invoer van textielproducten uit bepaalde
    derde landen, die niet vallen onder bilaterale overeenkomsten, protocollen of
    andere regelingen, noch onder een andere, bijzondere, communautaire regeling
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2878/2000 da Comissão, de 28 de Dezembro de 2000,
    que altera o anexo IV do Regulamento (CE) n.o 517/94 do Conselho relativo ao regime
    comum aplicável às importações de produtos têxteis de determinados países
    terceiros não abrangidas por acordos, protocolos ou outros convénios bilaterais
    ou por outras regras comunitárias específicas de importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2878/2000 de la Comisión, de 28 de diciembre de 2000,
    por el que se modifica el anexo IV del Reglamento (CE) nº 517/94 del Consejo
    relativo al régimen común aplicable a las importaciones de productos textiles
    de determinados países terceros que no estén cubiertos por Acuerdos bilaterales,
    Protocolos, otros Acuerdos o por otros regímenes específicos comunitarios de
    importación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2878/2000 av den 28 december 2000 om
    ändring av bilaga IV till rådets förordning (EG) nr 517/94 om gemensamma bestämmelser
    för import av textilprodukter från vissa tredje länder som inte omfattas av
    bilaterala avtal, protokoll eller andra överenskommelser eller av andra särskilda
    gemenskapsbestämmelser för import
  type: main
