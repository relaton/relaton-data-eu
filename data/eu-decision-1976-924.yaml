title:
- language: en
  script: Latn
  content: '76/924/EEC: Commission Decision of 29 October 1976 authorizing the Italian
    Republic not to apply Community treatment to woven fabrics of man-made fibres
    (discontinuous or waste) falling within No 56.07 of the Common Customs Tariff,
    originating in Romania and in free circulation in the other Member States (Only
    the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/924/CEE: Décision de la Commission du 29 octobre 1976 autorisant la
    République italienne à exclure du traitement communautaire les tissus de fibres
    artificielles discontinues, de la position 56.07 du tarif douanier commun, originaires
    de Roumanie et mis en libre pratique dans les autres États membres (Le texte
    en langue italienne est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '76/924/EWG: Entscheidung der Kommission vom 29. Oktober 1976, mit der
    die Italienische Republik ermächtigt wird, aus Rumänien stammende und in den
    anderen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus künstlichen
    Spinnfasern der Tarifnummer 56.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '76/924/EØF: Kommissionens beslutning af 4. november 1976 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage vævet stof
    af korte regenererede fibre eller af affald ad regenererede fibre, som henhører
    under pos. 56.07 i den fælles toldtarif, har oprindelse i Rumænien og frit kan
    omsættes i de andre medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '76/924/CEE: Decisione della Commissione, del 4 novembre 1976, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i tessuti di fibre
    tessili artificiali in fiocco, della voce 56.07 della tariffa doganale comune,
    originari della Romania e messi in libera pratica negli altri Stati membri (Il
    testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '76/924/EEG: Beschikking van de Commissie van 29 oktober 1976 waarbij de
    Italiaanse Republiek wordt gemachtigd weefsels van kunstmatige stapelvezels, van
    post 56.07 van het gemeenschappelijk douanetarief, van oorsprong uit Roemenië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
