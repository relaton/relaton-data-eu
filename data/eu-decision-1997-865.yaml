type: standard
title:
- language: en
  script: Latn
  content: '97/865/EC: Commission Decision of 5 December 1997 recognising in principle
    the completeness of the dossier submitted for detailed examination in view of
    the possible inclusion of CGA 245 704, flazasulfuron, Spodoptera exigua nuclear
    polyhedrosis virus, imazosulfuron, pymetrozine and sulfosulfuron in Annex I of
    Council Directive 91/414/EEC concerning the placing of plant protection products
    on the market'
  type: main
- language: fr
  script: Latn
  content: '97/865/CE: Décision de la Commission du 5 décembre 1997 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription du CGA 245 704, du flazasulfuron, du virus de la polyédrose
    nucléaire de la Spodoptera exigua, de l''imazosulfuron, de la pymétrozine et
    du sulfosulfuron dans l''annexe I de la directive 91/414/CEE du Conseil concernant
    la mise sur le marché des produits phytopharmaceutiques'
  type: main
- language: de
  script: Latn
  content: '97/865/EG: Entscheidung der Kommission vom 5. Dezember 1997 über die
    grundsätzliche Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden
    Prüfung im Hinblick auf eine etwaige Aufnahme von CGA 245 704, Flazasulfuron,
    des Kernpolyedervirus der Zuckerrüben-Eule (Spodoptera exigua), Imazosulfuron,
    Pymetrozin und Sulfosulfuron in Anhang I der Richtlinie 91/414/EWG des Rates über
    das Inverkehrbringen von Pflanzenschutzmitteln eingereicht wurden'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 5 декември 1997 година
    относно признаване по принцип съответствието
    на досиетата, представени за подробен преглед
    с оглед евентуалното включване на CGA 245704, флазасулфурон,
    вируса Spodoptera exigua nuclear polyhedrosis, имазосулфурон,
    пиметрозин и сулфосулфурон в приложение I към
    Директива 91/414/ЕИО на Съвета относно пускането
    на пазара на продукти за растителна защита
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 5. prosince 1997, kterým se v zásadě uznává
    úplnost dokumentací předložených k podrobnému zkoumání s ohledem na možné
    zařazení CGA 245704, flazasulfuronu, jaderného polyedrického viru můry Spodoptera
    exigua, imazosulfuronu, pymetrozinu a sulfosulfuronu do přílohy I směrnice
    Rady 91/414/EHS o uvádění přípravků na ochranu rostlin na trh
  type: main
- language: da
  script: Latn
  content: '97/865/EF: Kommissionens beslutning af 5. december 1997 om principiel
    anerkendelse af, at de dossierer, som er forelagt til grundig behandling med henblik
    på eventuel optagelse af CGA 245 704, flazasulfuron, Spodoptera exigua nuclear
    polyhedrosis virus, imazosulfuron, pymetrozin og sulfosulfuron i bilag I til Rådets
    direktiv 91/414/EØF om markedsføring af plantebeskyttelsesmidler, er fuldstændige'
  type: main
- language: el
  script: Grek
  content: '97/865/ΕΚ: Απόφαση της Επιτροπής της 5ης Δεκεμβρίου
    1997 με την οποία αναγνωρίζεται, καταρχήν, ότι
    είναι πλήρεις οι φάκελοι οι οποίοι έχουν υποβληθεί
    για λεπτομερή εξέταση ενόψει της ενδεχόμενης
    καταχώρησης των ουσιών CGA 245 704, flazasulfuron, πολυεδρικός
    ιός (NPV) των Spodoptera exigua, imazosulfuron, pymetrozine και sulfosufluron
    στο παράρτημα Ι της οδηγίας 91/414/ΕΟΚ του Συμβουλίου
    σχετικά με τη διάθεση στην αγορά φυτοπροστατευτικών
    προϊόντων'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 5. detsember 1997, millega tunnistatakse põhimõtteliselt
    täielikuks üksikasjaliku läbivaatuse jaoks esitatud toimikud, pidades silmas
    toimeainete CGA 245704, flasasulfuroon, Spodoptera exigua nukleaarse polühedroosi
    viirus, imasosulfuroon, pümetrosiin ja sulfosulfuroon kandmist taimekaitsevahendite
    turuleviimist käsitleva nõukogu direktiivi 91/414/EMÜ I lisasse
  type: main
- language: fi
  script: Latn
  content: '97/865/EY: Komission päätös, tehty 5 päivänä joulukuuta 1997, yksityiskohtaista
    tutkimusta varten annettujen asiakirjojen täydellisyyden periaatteellisesta hyväksymisestä
    CGA 245 704:n flatsasulfuronin, Spodoptera exigua -monisärmiöviruksen, imatsosulfuronin,
    pymetrotsiinin ja sulfosulfuronin mahdolliseksi sisällyttämiseksi kasvinsuojeluaineiden
    markkinoille saattamisesta annetun neuvoston direktiivin 91/414/ETY liitteeseen
    I'
  type: main
- language: hr
  script: Latn
  content: '97/865/EZ: Odluka Komisije od 5. prosinca 1997. o načelnom priznavanju
    cjelovitosti dokumentacije dostavljene na detaljno razmatranje s ciljem mogućeg
    uvrštenja CGA 245704 , flazasulfurona, virusa Spodoptera exigua nuclear polyhedrosis
    , imazosulfurona, pimetrozina i sulfosulfurona u Prilog I. Direktivi Vijeća 91/414/EEZ
    o stavljanju sredstava za zaštitu bilja na tržište'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1997. december 5.) a CGA 245 704-nek, a flazaszulfuronnak,
    a Spodoptera exigua nuclear polyhedrosis vírusnak, az imazoszulfuronnak, a pimetrozinnak
    és a szulfoszulfuronnak a növényvédő szerek forgalomba hozataláról szóló
    91/414/EGK tanácsi irányelv I. mellékletébe történő lehetséges felvétele
    céljából részletes vizsgálatra benyújtott dokumentációk teljességének
    elvi elismeréséről
  type: main
- language: it
  script: Latn
  content: '97/865/CE: Decisione della Commissione del 5 dicembre 1997 che riconosce
    in linea di massima la conformità dei fascicoli trasmessi per un esame dettagliato
    in vista di un eventuale inserimento del CGA 245 704, del flazasulfuron, del virus
    della poliedrosi nucleare di Spodoptera exigua, dell''imazosulfuron, della pimetrozina
    e del sulfosulfuron nell''allegato I della direttiva 91/414/CEE del Consiglio,
    relativa all''immissione in commercio dei prodotti fitosanitari'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1997. gada 5. decembris), ar ko atzīst par pilnīgu
    dokumentāciju, kas iesniegta sīkākai pārbaudei saistībā ar CGA 245704, flazasulfurona,
    kodolu poliedrozes vīrusa Spodoptera exigua, imazosulfurona, pimetrozīna un
    sulfosulfurona iespējamu iekļaušanu Padomes Direktīvas 91/414/EEK par augu
    aizsardzības līdzekļu laišanu tirgū I pielikumā
  type: main
- language: lt
  script: Latn
  content: 1997 m. gruodžio 5 d. Komisijos sprendimas, iš esmės pripažįstantis
    dokumentų, pateiktų nuodugniai patikrinti dėl CGA 245704, flazasulfurono, Spodoptera
    exigua branduolių poliedrozės viruso, imazosulfurono, pimetrozino ir sulfosulfurono
    galimo įrašymo į Tarybos direktyvos 91/414/EEB dėl augalų apsaugos produktų
    pateikimo į rinką I priedą, išsamumą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-5 ta’ Diċembru 1997 li tagħraf fil-prinċipju
    l-kompletezza ta’ l-inkartamenti sottomessi għal eżami ddetaljat minħabba
    l-inklużjoni possibbli ta’ CGA 245704, flazasulfuron, Spodoptera exigua nuclear
    polyhedrosis virus, imazosulfuron, pymetrozine u sulfosulfuron fl-Anness I tad-Direttiva
    tal-Kunsill 91/414/KEE dwar it-tqegħid fuq is-suq prodotti għal protezzjoni
    tal-pjantiTest b’ rilevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: '97/865/EG: Beschikking van de Commissie van 5 december 1997 waarbij in
    beginsel wordt erkend dat de dossiers die zijn ingediend voor een grondig onderzoek
    met het oog op de eventuele opneming van CGA 245 704, flazasulfuron, Spodoptera
    exigua nuclear polyhedrosis virus, imazosulfuron, pymetrozine en sulfosulfuron
    in bijlage I van Richtlijn 91/414/EEG van de Raad betreffende het op de markt
    brengen van gewasbeschermingsmiddelen, volledig zijn'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 5 grudnia 1997 r. uznająca zasadniczo kompletność
    dokumentacji przedłożonej do szczegółowego badania w celu możliwego włączenia
    CGA 245704, flazasulfuronu, Spodoptera exigua wirusa polihedrozy jądrowej, imazosulfuronu,
    pimetrozyny i sulfosulfuronu do załącznika I do dyrektywy Rady 91/414/EWG dotyczącej
    wprowadzania do obrotu środków ochrony roślin
  type: main
- language: pt
  script: Latn
  content: '97/865/CE: Decisão da Commissão de 5 de Dezembro de 1997 que reconhece,
    em princípio, a conformidade dos processos apresentados para exame pormenorizado
    com vista à possível inclusão do CGA 245 704, do flazassulfurão, do vírus
    da poliedrose nuclear da Spodoptera exigua, do imazossulfurão, da pimetrozina
    e do sulfossulfurão no anexo I da Directiva 91/414/CEE do Conselho relativa à
    colocação dos produtos fitofarmacêuticos no mercado'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 5 decembrie 1997 de recunoaștere în principiu a
    conformității dosarelor prezentate pentru examinare detaliată în vederea includerii
    CGA 245704, flazasulfuronului, virusului poliedrozei nucleare a Spodopterei exigua,
    imazosulfuronului, pimetrozinei și sulfosulfuronului în anexa I la Directiva
    91/414/CEE a Consiliului privind introducerea pe piață a produselor fitosanitare
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 5. decembra 1997, ktorým sa v zásade uznáva úplnosť
    dokumentácie predloženej na podrobné preskúmanie možného zaradenia účinných
    látok CGA 245704, flazasulfuronu, jadrového vírusu polyédra Spodoptera exigua,
    imazosulfuronu, pymetrozinua sulfosulfuronu do prílohy I k smernici Rady 91/414/EHS
    týkajúcej sa uvádzania prípravkov na ochranu rastlín na trh
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 5. decembra 1997 o načelnem priznavanju popolnosti
    dokumentacije, predložene v podroben pregled zaradi možne vključitve CGA 245704,
    flazasulfurona, Spodoptera exigua nuclear polyhedrosis virusa, imazosulfurona,
    pimetrozina in sulfosulfurona v Prilogo I k Direktivi Sveta 91/414/EGS o dajanju
    fitofarmacevtskih sredstev v promet
  type: main
- language: es
  script: Latn
  content: '97/865/CE: Decisión de la Comisión de 5 de diciembre de 1997 por la
    que se reconoce, en principio, la conformidad de los expedientes presentados para
    su examen detallado con vistas a la posible inclusión del CGA 245 704, el flazasulfurón,
    el virus de la poliedrosis nuclear de Spodoptera exigua, el imazosulfurón, la
    pimetrozina y el sulfosulfurón en el anexo I de la Directiva 91/414/CEE del Consejo
    relativa a la comercialización de productos fitosanitarios'
  type: main
- language: sv
  script: Latn
  content: '97/865/EG: Kommissionens beslut av den 5 december 1997 om ett principiellt
