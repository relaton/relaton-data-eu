title:
- language: en
  script: Latn
  content: Commission Decision of 5 October 1976 specifying the extent to which applications
    for import licences lodged between 20 and 24 September 1976 for young bovine animals
    of highland breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '76/809/CEE: Décision de la Commission, du 5 octobre 1976, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées du 20 au 24 septembre 1976 pour les jeunes bovins de
    races alpines destinés à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Oktober 1976 darüber, inwieweit den
    vom 20. bis 24. September 1976 gestellten Anträgen auf Einfuhrlizenzen für Mastjungrinder
    der Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. oktober 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicenser, som er indgivet i perioden fra den 20. til den
    24. september 1976 for ungkvæg af alpine racer, bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 ottobre 1976, che determina in quale
    misura può essere dato seguito alle domande d'importazione, presentate dal 20
    al 24 settembre 1976, per giovani bovini di razze alpine destinate all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 oktober 1976 tot vaststelling van de
    mate waarin de van 20 tot en met 24 september 1976 ingediende aanvragen om afgifte
    van invoercertificaten voor jonge mestrunderen van Alpenrassen kunnen worden ingewilligd
  type: main
