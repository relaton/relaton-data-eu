title:
- language: en
  script: Latn
  content: '81/422/EEC: Commission Decision of 16 February 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg, and the Kingdom of the Netherlands
    not to apply Community treatment to women''s, girls''and infants''(other than
    babies'') woven and knitted or crocheted dresses originating in Taiwan (Only the
    French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/422/CEE: Décision de la Commission, du 16 février 1981, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les robes tissées et robes de bonneterie
    pour femmes, fillettes et jeunes enfants originaires de T''ai-wan (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/422/EWG: Entscheidung der Kommission vom 16. Februar 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus Taiwan stammende Kleider aus Geweben uns aus Gewirken, für Frauen,
    Mädchen und Kleinkinder von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/422/EØF: Kommissionens beslutning af 16. februar 1981 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævede kjoler og kjoler af trikotage
    til kvinder, piger og småbørn, med oprindelse i Taiwan (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/422/ΕΟΚ: Απόφαση τής Επιτροπής τής 16ης
    Φεβρουαρίου 1981 βάσει τής οποίας εξουσιοδοτείται
    τό Βασίλειο τού Βελγίου, τό Μέγα Δουκάτο τού
    Λουξεμβούργου καί τό Βασίλειο τών Κάτω Χωρών
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά υφασμένα ενδύματα καί τά πλεκτά ενδύματα
    διά γυναίκας, κορασίδας καί μικρούς παίδας,
    καταγωγής Ταϊβάν (Τα κείμενα στην γαλλική και
    ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/422/CEE: Decisione della Commissione, del 16 febbraio 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario abiti interi tessuti ed a maglia, per
    donna, per ragazza e per bambini, originari di Taiwan (Il testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/422/EEG: Beschikking van de Commissie van 16 februari 1981 houdende
    machtiging van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk
    der Nederlanden om japonnen voor dames, meisjes en kinderen, geweven en van brei-
    of haakwerk, van oorsprong uit Taiwan van de communautaire behandeling uit te
    sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
