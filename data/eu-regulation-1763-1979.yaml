    taken into intervention in certain Member States, and their coefficients
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1763/79 de la Commission, du 9 août 1979, modifiant
    les règlements (CEE) n° 2226/78 et (CEE) n° 1352/79 en ce qui concerne les
    produits du secteur de la viande bovine pouvant faire l' objet d' achats à l'
    intervention dans certains États membres ainsi que leurs coefficients
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1763/79 der Kommission vom 9. August 1979 zur Änderung
    der Verordnungen (EWG) Nr. 2226/78 und (EWG) Nr. 1352/79 hinsichtlich der Erzeugnisse
    des Rindfleischsektors, die Gegenstand von Interventionskäufen in einigen Mitgliedstaaten
    sein können, sowie ihrer Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1763/79 af 9. august 1979 om ændring
