    και για την κατάργηση του κανονισμού (ΕΚ) αριθ.
    1067/94
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1491/94, annettu 28 päivänä kesäkuuta 1994,
    tiettyjen interventioelinten hallussaan pitämän yhteisössä jalostettavaksi
    tarkoitetun naudanlihan myynnistä asetuksessa (ETY) N:o 2539/84 määriteltyä
    menettelyä noudattaen ja asetuksen (EY) N:o 1067/94 kumoamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1491/94 DELLA COMMISSIONE del 28 giugno 1994 relativo
