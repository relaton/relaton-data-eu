    de viandes bovines détenues par certains organismes d'intervention en vue de
    leur transformation dans la Communauté et abrogeant le règlement (CE) n° 1067/94
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1491/94 DER KOMMISSION vom 28. Juni 1994 über den
    Verkauf von Rindfleisch, das zur Verarbeitung in der Gemeinschaft bestimmt ist,
    aus Beständen einiger Interventionsstellen nach dem Verfahren der Verordnung
    (EWG) Nr. 2539/84 und zur Aufhebung der Verordnung (EG) Nr. 1067/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1491/94 af 28. juni 1994 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EF)
    nr. 1067/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1491/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 28ης Ιουνίου 1994 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που βρίσκεται
    στην κατοχή ορισμένων οργανισμών παρέμβασης
