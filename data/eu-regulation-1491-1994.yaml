    van door bepaalde interventiebureaus opgeslagen en voor verwerking in de Gemeenschap
    bestemd rundvlees en houdende intrekking van Verordening (EG) nr. 1067/94
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1491/94 DA COMISSÃO de 28 de Junho de 1994 relativo
