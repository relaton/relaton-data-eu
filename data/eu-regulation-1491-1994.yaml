  script: Latn
  content: Commission Regulation (EC) No 1491/94 of 28 June 1994 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for processing within the Community and repealing Regulation
    (EC) No 1067/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1491/94 de la Commission du 28 juin 1994 relatif à
