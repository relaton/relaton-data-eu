title:
- language: en
  script: Latn
  content: Commission Decision of 10 October 1975 authorizing the United Kingdom during
    the period expiring on 31 December 1975 to permit the marketing of basic seed
    of rye not meeting the requirements of Council Directive No 66/402/EEC on the
    marketing of cereal seed
  type: main
- language: fr
  script: Latn
  content: '75/629/CEE: Décision de la Commission, du 10 octobre 1975, autorisant
    le Royaume-Uni à admettre, pour une période expirant le 31 décembre 1975, la
    commercialisation de semences de base de seigle qui ne répondent pas aux exigences
    de la directive du Conseil concernant la commercialisation des semences de céréales'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. Oktober 1975 zur Ermächtigung des
    Vereinigten Königreichs, für einen Zeitraum, der am 31. Dezember 1975 ausläuft,
    Basissaatgut von Roggen zum gewerbsmäßigen Verkehr zuzulassen, das den Anforderungen
    der Richtlinie des Rates über den Verkehr mit Getreidesaatgut nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 10. oktober 1975 om bemyndigelse til Det forenede
    Kongerige til i et tidsrum, der udløber den 31. december 1975, at tillade handel
    med basissæd af rug, der ikke opfylder kravene i Rådets direktiv om handel med
    sædekorn
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 ottobre 1975, che autorizza il Regno
    Unito ad ammettere, per un periodo che scade il 31 dicembre 1975, alla commercializzazione
    sementi di base di segale che non soddisfanno alle norme della direttiva del Consiglio
    relativa alla commercializzazione delle sementi di cereali
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 oktober 1975 houdende machtiging voor
    het Verenigd Koninkrijk om voor een periode eindigend op 31 december 1975 basiszaad
    van rogge, dat niet beantwoordt aan de eisen van de richtlijn van de Raad betreffende
    het in de handel brengen van zaaigranen, tot de handel toe te laten
  type: main
