title:
- language: en
  script: Latn
  content: '70/48/EEC: Commission Decision of 22 December 1969 dispensing the Federal
    Republic of Germany from applying Council directive of 30 June 1969 concerning
    the marketing of seed of oil and fibre plants to certain types of these seeds
    (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/48/CEE: Décision de la Commission, du 22 décembre 1969, dispensant
    la République Fédérale d''Allemagne d''appliquer, à certaines espèces, la
    directive du Conseil, du 30 juin 1969, concernant la commercialisation des semences
    de plantes oléagineuses et à fibres (Le texte en langue allemande est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '70/48/EWG: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Entbindung der Bundesrepublik Deutschland von der Verpflichtung, die Richtlinie
    des Rates vom 30. Juni 1969 über den Verkehr mit Saatgut von Öl- und Faserpflanzen
    hinsichtlich einiger Arten anzuwenden (Nur der deutsche Text ist verbindlich)'
  type: main
- language: el
  script: Grek
  content: '70/48/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1969, με την οποία απαλλάσσεται η Ομοσπονδιακή
    Δημοκρατία της Γερμανίας από την εφαρμογή,
    για ορισμένα είδη, της οδηγίας του Συμβουλίου
    της 30ης Ιουνίου 1969, περί της εμπορίας σπόρων
    ελαιούχων και ινωδών φυτών (Το κείμενο στη
    γερμανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '70/48/CEE: Decisione della Commissione, del 22 dicembre 1969, che dispensa
    la Repubblica federale di Germania dell''applicazione, per certe specie, della
    direttiva del Consiglio, del 30 giugno 1969, relativa alla commercializzazione
    delle sementi di piante oleaginose e da fibra (Il testo in lingua tedesca è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '70/48/EEG: Besluit van de Commissie van 22 december 1969 tot ontheffing
    van de Duitse bondsrepubliek van de toepassing ten aanzien van bepaalde gewassen
