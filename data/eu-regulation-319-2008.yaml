---
id: EURegulation3192008
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 319/2008 of 7 April 2008 amending Regulation
    (EC) No 795/2004 laying down detailed rules for the implementation of the single
    payment scheme provided for in Council Regulation (EC) No 1782/2003 establishing
    common rules for direct support schemes under the common agricultural policy and
    establishing certain support schemes for farmers, and Regulation (EC) No 796/2004
    laying down detailed rules for the implementation of cross-compliance, modulation
    and the integrated administration and control system provided for in Council Regulation
    (EC) No 1782/2003
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 319/2008 de la Commission du 7 avril 2008 modifiant,
    d’une part, le règlement (CE) n° 795/2004 portant modalités d’application
    du régime de paiement unique prévu par le règlement (CE) n° 1782/2003 du Conseil
    établissant des règles communes pour les régimes de soutien direct dans le
    cadre de la politique agricole commune et établissant certains régimes de soutien
    en faveur des agriculteurs et, d’autre part, le règlement (CE) n° 796/2004
    portant modalités d’application de la conditionnalité, de la modulation et
    du système intégré de gestion et de contrôle prévus par le règlement (CE)
    n° 1782/2003 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 319/2008 der Kommission vom 7. April 2008 zur Änderung
    der Verordnung (EG) Nr. 795/2004 mit Durchführungsbestimmungen zur Betriebsprämienregelung
    gemäß der Verordnung (EG) Nr. 1782/2003 des Rates mit gemeinsamen Regeln für
    Direktzahlungen im Rahmen der gemeinsamen Agrarpolitik und mit bestimmten Stützungsregelungen
    für Inhaber landwirtschaftlicher Betriebe sowie der Verordnung (EG) Nr. 796/2004
    mit Durchführungsbestimmungen zur Einhaltung anderweitiger Verpflichtungen, zur
    Modulation und zum Integrierten Verwaltungs- und Kontrollsystem nach der Verordnung
    (EG) Nr. 1782/2003 des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 319/2008 на Комисията от 7 април
    2008 година за изменение на Регламент (ЕО) № 795/2004
    за определяне на подробни правила за въвеждане
    на схемата за единно плащане, предвидени в
    Регламент (ЕО) № 1782/2003 на Съвета относно установяване
    на общи правила за схеми за директно подпомагане
    в рамките на Общата селскостопанска политика
    и за установяване на някои схеми за подпомагане
    на земеделски производители, и Регламент (ЕО)
    № 796/2004 за определяне на подробни правила за
    прилагане на интегрираната система за администриране
    и контрол, кръстосано спазване и модулация,
    предвидени в Регламент (ЕО) № 1782/2003 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 319/2008 ze dne 7. dubna 2008 , kterým se
    mění nařízení (ES) č. 795/2004, kterým se stanoví prováděcí pravidla
    k režimu jednotné platby podle nařízení Rady (ES) č. 1782/2003, kterým
    se stanoví společná pravidla pro režimy přímých podpor v rámci společné
    zemědělské politiky a kterým se zavádějí některé režimy podpor pro zemědělce,
    a nařízení (ES) č. 796/2004, kterým se stanoví prováděcí pravidla pro
    podmíněnost, odlišení a integrovaný administrativní a kontrolní systém
    podle nařízení Rady (ES) č. 1782/2003
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 319/2008 af 7. april 2008 om ændring
    af forordning (EF) nr. 795/2004 om gennemførelsesbestemmelser til enkeltbetalingsordningen
    i Rådets forordning (EF) nr. 1782/2003 om fastlæggelse af fælles regler for
    den fælles landbrugspolitiks ordninger for direkte støtte og om fastlæggelse
    af visse støtteordninger for landbrugere og om ændring af forordning (EF) nr.
    796/2004 om gennemførelsesbestemmelser vedrørende krydsoverensstemmelse, graduering
    og det integrerede forvaltnings- og kontrolsystem som omhandlet i Rådets forordning
    (EF) nr. 1782/2003
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 319/2008 της Επιτροπής,
    της 7ης Απριλίου 2008 , για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 795/2004 σχετικά με τη θέσπιση
    λεπτομερών κανόνων εφαρμογής του καθεστώτος
    ενιαίας ενίσχυσης που προβλέπεται στον κανονισμό
    (ΕΚ) αριθ. 1782/2003 του Συμβουλίου για τη θέσπιση
    κοινών κανόνων για τα καθεστώτα άμεσης στήριξης
    στα πλαίσια της κοινής γεωργικής πολιτικής
    και για τη θέσπιση ορισμένων καθεστώτων στήριξης
    για τους γεωργούς και του κανονισμού (ΕΚ) αριθ.
    796/2004 σχετικά με τη θέσπιση λεπτομερών κανόνων
    για την εφαρμογή της πολλαπλής συμμόρφωσης,
    της διαφοροποίησης και του ολοκληρωμένου συστήματος
    διαχείρισης και ελέγχου που προβλέπονται στον
    κανονισμό (ΕΚ) αριθ. 1782/2003 του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 319/2008, 7. aprill 2008 , millega muudetakse
    määrust (EÜ) nr 795/2004, millega kehtestatakse nõukogu määruses (EÜ) nr
    1782/2003 (millega kehtestatakse ühise põllumajanduspoliitika raames kohaldatavate
    otsetoetuskavade ühiseeskirjad ja teatavad toetuskavad talupidajate jaoks) sätestatud
    ühtse otsemaksete kava üksikasjalikud rakenduseeskirjad, ning määrust (EÜ)
    nr 796/2004, millega kehtestatakse nõukogu määruses (EÜ) nr 1782/2003 ette
    nähtud nõuetele vastavuse, toetuse ümbersuunamise ning ühtse haldus- ja kontrollisüsteemi
    rakendamise üksikasjalikud reeglid
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 319/2008, annettu 7 päivänä huhtikuuta 2008
    , yhteisen maatalouspolitiikan suoria tukijärjestelmiä koskevista yhteisistä
    säännöistä ja tietyistä viljelijöiden tukijärjestelmistä annetussa neuvoston
    asetuksessa (EY) N:o 1782/2003 säädetyn tilatukijärjestelmän täytäntöönpanoa
    koskevista yksityiskohtaisista säännöistä annetun asetuksen (EY) N:o 795/2004
    ja neuvoston asetuksessa (EY) N:o 1782/2003 säädettyjen täydentävien ehtojen,
    tuen mukauttamisen ja yhdennetyn hallinto- ja valvontajärjestelmän soveltamista
    koskevista yksityiskohtaisista säännöistä annetun asetuksen (EY) N:o 796/2004
    muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 319/2008/EK rendelete ( 2008. április 7. ) a közös agrárpolitika
    keretébe tartozó közvetlen támogatási rendszerek közös szabályainak megállapításáról
    és a mezőgazdasági termelők részére meghatározott támogatási rendszerek
    létrehozásáról szóló 1782/2003/EK tanácsi rendeletben meghatározott egységes
    támogatási rendszer végrehajtására vonatkozó részletes szabályok megállapításáról
    szóló 795/2004/EK rendelet, valamint az 1782/2003/EK tanácsi rendelet által
    előírt kölcsönös megfeleltetés, moduláció, valamint integrált igazgatási
    és ellenőrzési rendszer végrehajtására vonatkozó részletes szabályok
    megállapításáról szóló 796/2004/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 319/2008 della Commissione, del 7 aprile 2008 , che
    modifica il regolamento (CE) n. 795/2004 recante modalità di applicazione del
    regime di pagamento unico di cui al regolamento (CE) n. 1782/2003 del Consiglio
    che stabilisce norme comuni relative ai regimi di sostegno diretto nell’ambito
    della politica agricola comune e istituisce taluni regimi di sostegno a favore
    degli agricoltori e il regolamento (CE) n. 796/2004 recante modalità di applicazione
    della condizionalità, della modulazione e del sistema integrato di gestione e
    di controllo di cui al regolamento (CE) n. 1782/2003 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 319/2008 ( 2008. gada 7. aprīlis ), ar kuru
    groza Regulu (EK) Nr. 795/2004, ar ko nosaka sīki izstrādātus noteikumus par
    to, kā īstenot vienreizējo maksājumu shēmu, kura paredzēta Padomes Regulā
    (EK) Nr. 1782/2003, ar ko izveido kopīgus tiešā atbalsta shēmu noteikumus
    saskaņā ar kopējo lauksaimniecības politiku un izveido dažas atbalsta shēmas
    lauksaimniekiem, un Regulu (EK) Nr. 796/2004, ar ko paredz sīki izstrādātus
    noteikumus, lai ieviestu savstarpēju atbilstību, modulāciju un integrēto administrēšanas
    un kontroles sistēmu, kura paredzēta Padomes Regulā (EK) Nr. 1782/2003, ar
    ko ievieš kopīgus tiešā atbalsta shēmu noteikumus saskaņā ar kopējo lauksaimniecības
    politiku un izveido dažas atbalsta shēmas lauksaimniekiem
  type: main
- language: lt
  script: Latn
  content: 2008 m. balandžio 7 d. Komisijos reglamentas (EB) Nr. 319/2008, iš dalies
    keičiantis Reglamentą (EB) Nr. 795/2004, nustatantį išsamias bendrosios išmokos
    schemos, pateiktos Tarybos reglamente (EB) Nr. 1782/2003, nustatančiame bendrąsias
    tiesioginės paramos schemų pagal bendrą žemės ūkio politiką taisykles ir
    nustatančiame tam tikras paramos schemas ūkininkams, įgyvendinimo taisykles,
    ir Reglamentą (EB) Nr. 796/2004, nustatantį išsamias kompleksinio paramos susiejimo,
    moduliavimo ir integruotos administravimo ir kontrolės sistemos, numatytų Tarybos
    reglamente (EB) Nr. 1782/2003, įgyvendinimo taisykles
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 319/2008 tas- 7 ta’ April 2008 li
    jemenda r-Regolament tal-Kummissjoni (KE) Nru 795/2004 li jippreskrivi regoli
    dettaljati għall-implimentazzjoni ta' l-iskema ta' ħlas waħdieni li hemm provvediment
    dwaru fir-Regolament tal-Kunsill (KE) Nru 1782/2003 li jistabbilixxi regoli komuni
    għal sistemi ta' sostenn dirett taħt il-politika agrikola komuni u li jistabbilixxi
    ċerti skemi ta' sostenn għall-bdiewa u r-Regolament tal-Kummissjoni (KE) Nru
    796/2004 li jippreskrivi regoli ddettaljati għall-implimentazzjoni ta’ konformità,
    modulazzjoni u amministrazzjoni integrata u sistema ta’ kontroll kif hemm provvediment
    dwarhom fir-Regolament tal-Kunsill (KE) Nru 1782/2003
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 319/2008 van de Commissie van 7 april 2008 tot wijziging
    van Verordening (EG) nr. 795/2004 houdende bepalingen voor de uitvoering van de
    bedrijfstoeslagregeling waarin is voorzien bij Verordening (EG) nr. 1782/2003
    van de Raad tot vaststelling van gemeenschappelijke voorschriften voor regelingen
    inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk landbouwbeleid
    en tot vaststelling van bepaalde steunregelingen voor landbouwers, en van Verordening
    (EG) nr. 796/2004 houdende uitvoeringsbepalingen inzake de randvoorwaarden, de
    modulatie en het geïntegreerd beheers- en controlesysteem waarin is voorzien
    bij Verordening (EG) nr. 1782/2003 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 319/2008 z dnia 7 kwietnia 2008 r. zmieniające
    rozporządzenie (WE) nr 795/2004 ustanawiające szczegółowe zasady w celu wdrożenia
    systemu jednolitych płatności określonego w rozporządzeniu Rady (WE) nr 1782/2003
    ustanawiającym wspólne zasady dla systemów wsparcia bezpośredniego w ramach
    wspólnej polityki rolnej i ustanawiającym określone systemy wsparcia dla rolników
    oraz rozporządzenie (WE) nr 796/2004 ustanawiające szczegółowe zasady wdrażania
    wzajemnej zgodności, modulacji oraz zintegrowanego systemu administracji i kontroli
    przewidzianych w rozporządzeniu Rady (WE) nr 1782/2003
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 319/2008 da Comissão, de 7 de Abril de 2008 , que
    altera o Regulamento (CE) n.° 795/2004 que estabelece as normas de execução
    do regime de pagamento único previsto no Regulamento (CE) n.° 1782/2003 do Conselho
    que estabelece regras comuns para os regimes de apoio directo no âmbito da política
    agrícola comum e institui determinados regimes de apoio aos agricultores e o
    Regulamento (CE) n.° 796/2004 que estabelece regras de execução relativas à
    condicionalidade, à modulação e ao sistema integrado de gestão e de controlo
    previstos no Regulamento (CE) n.° 1782/2003
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 319/2008 al Comisiei din 7 aprilie 2008 de modificare
    a Regulamentului (CE) nr. 795/2004 de stabilire a normelor de aplicare a schemei
    de plată unică prevăzute în Regulamentul (CE) nr. 1782/2003 de stabilire a
    normelor comune pentru schemele de ajutor direct în cadrul politicii agricole
    comune și de stabilire a anumitor scheme de ajutor pentru agricultori, precum
    și a Regulamentului (CE) nr. 796/2004 de stabilire a normelor de aplicare a ecocondiționării,
    a modulării și a sistemului integrat de gestionare și control, prevăzute de
    Regulamentul (CE) nr. 1782/2003
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 319/2008 zo 7. apríla 2008 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 795/2004, ktorým sa ustanovujú predpisy na vykonávanie
    schémy jednotných platieb ustanovenej v nariadení Rady (ES) č. 1782/2003,
    ktorým sa ustanovujú spoločné predpisy pre schémy priamej podpory v rámci
    spoločnej poľnohospodárskej politiky a určité podporné schémy pre poľnohospodárov,
    a nariadenie (ES) č. 796/2004, ktoré ustanovuje podrobné pravidlá na uplatňovanie
    krížového plnenia, modulácie a integrovaného správneho a kontrolného systému
    uvedeného v nariadení Rady (ES) č. 1782/2003
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 319/2008 z dne 7. aprila 2008 o spremembi Uredbe
    (ES) št. 795/2004 o podrobnih pravilih za izvajanje sheme enotnega plačila,
    predvidenega v Uredbi Sveta (ES) št. 1782/2003 o skupnih pravilih za sheme neposrednih
    podpor v okviru skupne kmetijske politike in o uvedbi nekaterih shem podpor za
    kmete, ter Uredbe (ES) št. 796/2004 o podrobnih pravilih za izvajanje navzkrižne
    skladnosti, modulacije in integriranega administrativnega in kontrolnega sistema,
    predvidenih z Uredbo Sveta (ES) št. 1782/2003
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 319/2008 de la Comisión, de 7 de abril de 2008 , que
    modifica el Reglamento (CE) n° 795/2004, que establece disposiciones de aplicación
    del régimen de pago único previsto en el Reglamento (CE) n° 1782/2003 del Consejo
    por el que se establecen disposiciones comunes aplicables a los regímenes de
    ayuda directa en el marco de la política agrícola común y se instauran determinados
    regímenes de ayuda a los agricultores, y el Reglamento (CE) n° 796/2004, por
    el que se establecen disposiciones para la aplicación de la condicionalidad,
    la modulación y el sistema integrado de gestión y control previstos en el Reglamento
    (CE) n° 1782/2003 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 319/2008 av den 7 april 2008 om ändring
    av förordning (EG) nr 795/2004 om tillämpningsföreskrifter för det system
    med samlat gårdsstöd som föreskrivs i rådets förordning (EG) nr 1782/2003
    om upprättande av gemensamma bestämmelser för system för direktstöd inom
    den gemensamma jordbrukspolitiken och om upprättande av vissa stödsystem för
    jordbrukare och om ändring av förordning (EG) nr 796/2004 om närmare föreskrifter
    för tillämpningen av de tvärvillkor, den modulering och det integrerade administrations-
    och kontrollsystem som föreskrivs i rådets förordning (EG) nr 1782/2003
