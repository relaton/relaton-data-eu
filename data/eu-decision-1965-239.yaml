title:
- language: fr
  script: Latn
  content: Décision 65/239/CEE de la Commission, du 13 avril 1965, relative au concours
    de la République italienne à l'article 115 alinéa 1 du Traité pour exclure
    du traitement communautaire certains produits originaires de pays tiers et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/239/EWG: Entscheidung der Kommission vom 13. April 1965 betreffend
    den Antrag der Italienischen Republik gemäß Artikel 115 Absatz (1) des Vertrages
    zur Ausschließung von aus dritten Ländern stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen Erzeugnissen von der Gemeinschaftsbehandlung'
  type: main
- language: it
  script: Latn
  content: '65/239/CEE: Decisione della Commissione, del 13 aprile 1965, relativa
    al ricorso della Repubblica italiana all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario alcuni prodotti originari dei paesi
    terzi e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/239/EEG: Beschikking van de Commissie van 13 april 1965 betreffende
    het verzoek van de Italiaanse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
