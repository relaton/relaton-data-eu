title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/2626 of 24 November 2023 amending
    Annexes I and II to Implementing Decision (EU) 2021/260 as regards the national
    measures which apply in Denmark concerning bacterial kidney disease (BKD) and
    infectious pancreatic necrosis (IPN)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/2626 de la Commission du 24 novembre
    2023 modifiant les annexes I et II de la décision d’exécution (UE) 2021/260
    en ce qui concerne les mesures nationales applicables au Danemark concernant la
    rénibactériose (BKD) et la nécrose pancréatique infectieuse (NPI)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/2626 der Kommission vom 24. November
    2023 zur Änderung der Anhänge I und II des Durchführungsbeschlusses (EU) 2021/260
    hinsichtlich der in Dänemark geltenden nationalen Maßnahmen in Bezug auf die
    bakterielle Nierenerkrankung (BKD) und die infektiöse Pankreasnekrose (IPN)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/2626 на Комисията
    от 24 ноември 2023 година за изменение на приложения
    I и II към Решение за изпълнение (ЕС) 2021/260 по отношение
    на националните мерки, които се прилагат в
    Дания във връзка с ренибактериозата (BKD) и инфекциозната
    панкреатична некроза (IPN)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/2626 ze dne 24. listopadu 2023,
    kterým se mění přílohy I a II prováděcího rozhodnutí (EU) 2021/260, pokud
    jde o vnitrostátní opatření týkající se bakteriálního onemocnění ledvin
    (BKD) a infekční nekrózy pankreatu (IPN) platná v Dánsku
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/2626 af 24. november
    2023 om ændring af bilag I og II til gennemførelsesafgørelse (EU) 2021/260
    for så vidt angår de nationale foranstaltninger, der gælder i Danmark, vedrørende
    bakteriel nyresygdom (BKD) og infektiøs pankreasnekrose (IPN)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/2626 της Επιτροπής,
    της 24ης Νοεμβρίου 2023, για την τροποποίηση των
    παραρτημάτων I και II της εκτελεστικής απόφασης
    (ΕΕ) 2021/260 όσον αφορά τα εθνικά μέτρα που εφαρμόζονται
    στη Δανία σχετικά με τη βακτηριακή νεφρίτιδα
    (BKD) και τη λοιμώδη παγκρεατική νέκρωση (IPN)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2023/2626, 24. november 2023, millega muudetakse
    rakendusotsuse (EL) 2021/260 I ja II lisa Taanis bakteriaalse neeruhaiguse (BKD)
    ja nakkusliku pankrease nekroosi (IPN) suhtes kohaldatavate riiklike meetmete
    osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/2626, annettu 24 päivänä
    marraskuuta 2023, täytäntöönpanopäätöksen (EU) 2021/260 liitteiden I ja
    II muuttamisesta siltä osin kuin on kyse Tanskassa bakteeriperäisen munuaistaudin
    (BKD) ja tarttuvan haimakuoliotaudin (IPN) osalta sovellettavista kansallisista
    toimenpiteistä
  type: main
- language: ga
  script: Latn
