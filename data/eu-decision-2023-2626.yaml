    bakteriālo nieru slimību (BKD) un infekciozo aizkuņģa dziedzera nekrozi (IPN)
    groza Īstenošanas lēmuma (ES) 2021/260 I un II pielikumu
  type: main
- language: lt
  script: Latn
  content: 2023 m. lapkričio 24 d. Komisijos įgyvendinimo sprendimas (ES) 2023/2626,
    kuriuo dėl Danijoje taikomų nacionalinių priemonių, susijusių su bakterine
    inkstų liga (BIL) ir infekcine kasos nekroze (IKN), iš dalies keičiami Įgyvendinimo
    sprendimo (ES) 2021/260 I ir II priedai
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/2626 tal-24
    ta’ Novembru 2023 li temenda l-Annessi I u II tad-Deċiżjoni ta’ Implimentazzjoni
    (UE) 2021/260 fir-rigward tal-miżuri nazzjonali li japplikaw fid-Danimarka dwar
    il-marda batterika tal-kliewi (BKD) u n-nekrożi pankreatika infettiva (IPN)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2023/2626 van de Commissie van 24 november 2023
    tot wijziging van de bijlagen I en II bij Uitvoeringsbesluit (EU) 2021/260 wat
    betreft de nationale maatregelen die in Denemarken van toepassing zijn op bacteriële
    nierziekte (BKD) en infectieuze pancreasnecrose (IPN)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2023/2626 z dnia 24 listopada 2023 r. zmieniająca
    załączniki I i II do decyzji wykonawczej (UE) 2021/260 w odniesieniu do środków
    krajowych mających zastosowanie w Danii dotyczących bakteryjnej choroby nerek
    (BKD) i zakaźnej martwicy trzustki (IPN)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2023/2626 da Comissão, de 24 de novembro de
    2023, que altera os anexos I e II da Decisão de Execução (UE) 2021/260 no que
    diz respeito às medidas nacionais aplicáveis na Dinamarca relativas à renibacteriose
    (BKD) e à necrose pancreática infecciosa (NPI)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2023/2626 a Comisiei din 24 noiembrie
    2023 de modificare a anexelor I și II la Decizia de punere în aplicare (UE)
    2021/260 privind măsurile naționale care se aplică în Danemarca în ceea ce
    privește boala bacteriană a rinichiului (BKD) și necroza pancreatică infecțioasă
    (IPN)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2023/2626 z 24. novembra 2023, ktorým
    sa menia prílohy I a II k vykonávaciemu rozhodnutiu (EÚ) 2021/260, pokiaľ
    ide o vnútroštátne opatrenia, ktoré sa uplatňujú v Dánsku v súvislosti
    s bakteriálnou chorobou obličiek (BKD) a infekčnou pankreatickou nekrózou
    (IPN)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2023/2626 z dne 24. novembra 2023 o spremembi
    prilog I in II k Izvedbenemu sklepu (EU) 2021/260 glede nacionalnih ukrepov, ki
    se uporabljajo na Danskem v zvezi z bakterijskim nefritisom (BKD) in nalezljivo
    nekrozo trebušne slinavke (IPN)
  type: main
- language: es
  script: Latn
