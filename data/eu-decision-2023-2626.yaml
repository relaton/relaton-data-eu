    za bakterijsku bolest bubrega (BKD) i zaraznu nekrozu gušterače (IPN) koje se
    primjenjuju u Danskoj
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/2626 végrehajtási határozata (2023. november
    24.) az (EU) 2021/260 végrehajtási határozat I. és II. mellékletének a bakteriális
    vesebetegséggel (BKD) és a fertőző hasnyálmirigy-elhalással (IPN) kapcsolatban
    Dániában alkalmazandó nemzeti intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/2626 della Commissione, del 24 novembre
    2023, che modifica gli allegati I e II della decisione di esecuzione (UE) 2021/260
    per quanto riguarda le misure nazionali applicabili in Danimarca in relazione
    alla nefrobatteriosi (BKD) e alla necrosi pancreatica infettiva (IPN)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/2626 (2023. gada 24. novembris),
