    de 2023, por la que se modifican los anexos I y II de la Decisión de Ejecución
    (UE) 2021/260 en lo que respecta a las medidas nacionales aplicables en Dinamarca
    en relación con la renibacteriosis y la necrosis pancreática infecciosa (NPI)
  type: main
