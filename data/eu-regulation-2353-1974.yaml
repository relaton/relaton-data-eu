id: EURegulation23531974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2353/74 of the Commission of 13 September 1974 re-establishing
    the levying of customs duties on jerseys and pullovers falling within subheading
    60.05 A I originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3505/73 of 18 December 1973
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2353/74 de la Commission, du 13 septembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux chandails
    et pull- overs, de la sous-position tarifaire 60.05 A I, originaires des pays
    en voie de développement, bénéficiaires de préférences tarifaires prévues
    par le règlement (CEE) n° 3505/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2353/74 der Kommission vom 13. September 1974 zur
    Wiedereinführung des Zollsatzes für Oberkleidung, Bekleidungszubehör und andere
    Wirkwaren, der Tarifstelle 60.05 A I, mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 3505/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2353/74 af 13. september 1974 om genindførelse
    af opkrævning af toldafgifter for sweaters, pull-overe og jumpere under position
    60.05 A I, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3505/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2353/74 della Commissione, del 13 settembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili ai maglioni e pullovers
    della sottovoce doganale n. 60.05 A I originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3505/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2353/74 van de Commissie van 13 september 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op truien, jumpers,
    pullovers en slipovers van onderverdeling 60.05 A I, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 3505/73 van de Raad van 18 december
    1973 tariefpreferenties werden geopend
  type: main
