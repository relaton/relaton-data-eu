title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 855/91 of 5 April 1991 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to trade in fruit and vegetables between Spain and the Community as constituted
    on 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives, carrots,
    artichokes, melons and strawberries
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CEE) No 855/91 DE LA COMMISSION du 5 avril 1991 fixant certaines
    modalités additionnelles pour l' application du mécanisme complémentaire aux
    échanges (MCE) dans le secteur des fruits et légumes entre l' Espagne et la
    Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les tomates,
    les laitues, les chicorées scaroles, les carottes, les artichauts, les melons
    et les fraises
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 855/91 DER KOMMISSION vom 5. April 1991 mit zusätzlichen
    Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM) im Handel
    mit Tomaten, Salat, Endivie Eskariol, Karotten, Artischocken, Melonen und Erdbeeren
    zwischen Spanien und der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember
    1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 855/91 af 5. april 1991 om visse yderligere
    gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen (SMS)
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985 inden
    for frugt- og grønsagssektoren for så vidt angår tomater, salat, bredbladet
    endivie, gulerødder, artiskokker, meloner og jordbær
  type: main
- language: el
  script: Grek
