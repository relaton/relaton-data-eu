    της 5ης Απριλίου 1991 για τον καθορισμό ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών ( ΣΜΣ ) μεταξύ
    της Ισπανίας και της Κοινότητας με τη σύνθεσή
    της στις 31 Δεκεμβρίου 1985 όσον αφορά τις τομάτες,
    τα μαρούλια, τις σκαρόλες, τα καρότα, τις αγκινάρες,
    τα πεπόνια και τις φράουλες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 855/91 DELLA COMMISSIONE del 5 aprile 1991 recante
    fissazione di modalità complementari di applicazione del meccanismo complementare
    agli scambi (MCS) nel settore degli ortofrutticoli fra la Spagna e la Comunità
    nella sua composizione al 31 dicembre 1985 per quanto riguarda i pomodori, le
    lattughe, le cicorie scarole, le carote, i carciofi, i meloni e le fragole #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 855/91 VAN DE COMMISSIE van 5 april 1991 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer (ARH) in de sector groenten en fruit tussen Spanje en de Gemeenschap
    in haar samenstelling op 31 december 1985, ten aanzien van tomaten, sla, andijvie,
    wortelen, artisjokken, meloenen en aardbeien #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 855/91 DA COMISSÃO de 5 de Abril de 1991 que fixa
