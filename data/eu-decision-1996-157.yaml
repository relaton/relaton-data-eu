    77/93/ΕΟΚ του Συμβουλίου όσον αφορά τα γεώμηλα
    που προορίζονται για ανθρώπινη κατανάλωση
    καταγωγής Κούβας'
  type: main
- language: fi
  script: Latn
  content: '96/157/EY: Komission päätös, tehty 31 päivänä tammikuuta 1996, jäsenvaltioiden
