  script: Latn
  content: '96/157/EC: Commission Decision of 31 January 1996 authorizing the Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of potatoes for human consumption originating in Cuba'
  type: main
- language: fr
  script: Latn
  content: '96/157/CE: Décision de la Commission, du 31 janvier 1996, autorisant
    les États membres à prévoir des dérogations à certaines dispositions de la
    directive 77/93/CEE du Conseil pour ce qui concerne les pommes de terre de consommation
    originaires de Cuba'
  type: main
- language: de
  script: Latn
  content: '96/157/EG: Entscheidung der Kommission vom 31. Januar 1996 zur Ermächtigung
    der Mitgliedstaaten, für Speisekartoffeln/-erdäpfel mit Ursprung in Kuba Ausnahmen
    von einigen Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '96/157/EF: Kommissionens beslutning af 31. januar 1996 om bemyndigelse
    af medlemsstaterne til at fastsætte undtagelser fra visse bestemmelser i Rådets
    direktiv 77/93/EØF for spisekartofler med oprindelse i Cuba'
  type: main
- language: el
  script: Grek
