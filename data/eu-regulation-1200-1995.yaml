title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1200/95 of 29 May 1995 laying down certain
    transitional arrangements to determine the agricultural component for imports
    of the goods listed in Table 1 of Annex B to Council Regulation (EC) No 3448/93
    in order to implement the obligations deriving from the Agriculture Agreement
    concluded during the Uruguay Round of multilateral trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1200/95 de la Commission, du 29 mai 1995, prévoyant
    certaines mesures transitoires pour déterminer l'élément agricole à l'importation
    des marchandises énumérées au tableau 1 de l'annexe B du règlement (CE) n°
    3448/93 du Conseil afin de mettre en oeuvre les obligations découlant de l'accord
    sur l'agriculture conclu dans le cadre des négociations commerciales multilatérales
    du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1200/95 der Kommission vom 29. Mai 1995 über bestimmte
    Übergangsmaßnahmen zur Feststellung des "Agrarteilbetrags" bei der Einfuhr der
    in Tabelle 1 von Anhang B der Verordnung (EG) Nr. 3448/93 des Rates aufgeführten
    Waren zur Anwendung der im Rahmen der multilateralen Handelsverhandlungen der
    Uruguay-Runde abgeschlossenen Agrarübereinkünfte
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1200/95 af 29. maj 1995 om visse overgangsforanstaltninger
    for at bestemme landbrugselementet ved indførsel af varer som opregnet i tabel
    1 i bilag B til Rådets forordning (EF) nr. 3448/93 for at opfylde forpligtelserne
    i den aftale om landbrug, der blev indgået under de multilaterale handelsforhandlinger
    i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1200/95 της Επιτροπής
    της 29ης Μαΐου 1995 για τη λήψη ειδικών μεταβατικών
    μέτρων προς προσδιορισμό της γεωργικής παραμέτρου
    κατά την εισαγωγή των εμπορευμάτων που εμφαίνονται
    στον πίνακα 1 του παραρτήματος Β του κανονισμού
    (ΕΚ) αριθ. 3448/93 του Συμβουλίου ώστε να ενεργοποιηθούν
    οι υποχρεώσεις που απορρέουν από τη συμφωνία
    η οποία αφορά το γεωργικό τομέα και η οποία
    συνήφθη στο πλαίσιο των πολυμερών εμπορικών
    διαπραγματεύσεων του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1200/95, annettu 29 päivänä toukokuuta 1995,
    tietyistä siirtymätoimenpiteistä maatalousosan määrittämiseksi neuvoston
    asetuksen (EY) N:o 3448/93 liitteessä B olevassa taulukossa 1 lueteltujen tavaroiden
    tuonnissa Uruguayn kierroksen monenvälisten kauppaneuvottelujen osana tehdystä
    maataloutta koskevasta sopimuksesta johtuvien velvoitteiden täytäntöönpanemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1200/95 della Commissione, del 29 maggio 1995, che
    prevede alcune misure transitorie intese a determinare l'elenco agricolo per l'importazione
    delle merci di cui alla tabella 1 dell'allegato B del regolamento (CE) n. 3448/93
    per l'attuazione degli obblighi che discendono dell'Accordo sull'agricoltura concluso
    nel quadro dei negoziati commerciali multilaterali che discendono dell'Accordo
    sull'agricoltura concluso nel quadro dei negoziati commerciali multilaterali dell'Uruguay
    Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1200/95 van de Commissie van 29 mei 1995 houdende
    bepaalde overgangsmaatregelen voor het bepalen van het agrarisch element bij invoer
    van de in tabel 1 van bijlage B bij Verordening (EG) nr. 3448/93 van de Raad vermelde
    goederen, ter nakoming van de verplichtingen die voortvloeien uit de Landbouwovereenkomst
    in het kader van de multilaterale handelsbesprekingen van de Uruguay-Ronde
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1200/95 da Comissão, de 29 de Maio de 1995, que prevê
    algumas medidas transitórias para determinar o elemento agrícola aplicado à
    importação das mercadorias enumeradas no quadra 1 do anexo B do Regulamento
    (CE) nº 3448/93 do Conselho, a fim de pôr em execução as obrigações decorrentes
    do Acordo sobre a agricultura concluído no âmbito das negociações comerciais
    multilaterais do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1200/95 de la Comisión, de 29 de mayo de 1995, por
    el que se contemplan diversas medidas transitorias para determinar el elemento
    agrícola en la importación de las mercancías contempladas en el cuadro 1 del
    Anexo B del Reglamento (CE) n° 3448/93 del Consejo, en aplicación de las obligaciones
    que se desprenden del Acuerdo de agricultura celebrado en el marco de las negociaciones
    comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1200/95 av den 29 maj 1995 om vissa övergångsbestämmelser
    för att bestämma den jordbruksrelaterade delen av import av de varor som förtecknas
    i tabell 1 i bilaga B till rådets förordning (EG) nr 3448/93 för att uppfylla
    åtagandena enligt det jordbruksavtal som har slutits inom ramen för de multilaterala
    handelsförhandlingarna i Uruguayrundan.
