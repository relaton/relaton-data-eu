title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1709/77 of 26 July 1977 extending, as regards
    Spain, Regulation (EEC) No 373/77 laying down certain interim measures for the
    conservation and management of fishery resources applicable to vessels flying
    the flag of certain non-member countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1709/77 du Conseil, du 26 juillet 1977, prorogeant,
    en ce qui concerne l'Espagne, le règlement (CEE) n° 373/77 fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1709/77 des Rates vom 26. Juli 1977 zur Verlängerung
    - in bezug auf Spanien - der Geltungsdauer der Verordnung (EWG) Nr. 373/77 zur
    Festlegung von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    gegenüber Schiffen, die die Flagge bestimmter Drittländer führen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1709/77 af 26. juli 1977 om forlængelse
    for så vidt angår Spanien af forordning (EØF) nr. 373/77 om midlertidige foranstaltninger
    til bevarelse af regulering af fiskeressourcerne, som skal finde anvendelse på
    fartøjer, der fører visse tredjelandes flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1709/77 del Consiglio, del 26 luglio 1977, che proroga,
    per quanto riguarda la Spagna, il regolamento (CEE) n. 373/77, che fissa talune
    misure interinali di conservazione e di gestione delle risorse ittiche, applicabili
    alle navi battenti bandiera di taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1709/77 van de Raad van 26 juli 1977 houdende verlenging,
    voor wat Spanje betreft, van Verordening (EEG) nr. 373/77 tot vaststelling van
    bepaalde overgangsmaatregelen voor de instandhouding en het beheer van de visbestanden,
    die van toepassing zijn op vaartuigen die de vlag van sommige derde landen voeren
  type: main
