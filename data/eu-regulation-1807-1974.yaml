title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1807/74 of the Commission of 9 July 1974 re-establishing
    the levying of the customs duties on image projectors (other than cinematographic
    projectors); photographic (except cinematographic) enlargers and reducers, falling
    within subheading 90.09 of the Common Customs Tariff, originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1807/74 de la Commission, du 9 juillet 1974, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixé, appareils d'agrandissement ou de réduction photographiques,
    de la position tarifaire 90.09, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1807/74 der Kommission vom 9. Juli 1974 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer; photographische Vergrößerungs- oder Verkleinerungsapparate,
    der Tarifnummer 90.09 mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1807/74 af 9. juli 1974 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater, forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske), under position 90.09, som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1807/74 della Commissione, del 9 luglio 1974, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi da proiezione
    fissa; apprecchi fotografici d'ingrandimento o di riduzione della voce doganale
    n. 90.09 originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1807/74 van de Commissie van 9 juli 1974 houdende
    wederinstelling van de heffing van de douanerechten voor projectietoestellen voor
    niet bewegende beelden; vergrotings- en verkleiningstoestellen voor de fotografie,
    van post 90.09, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 tariefpreferenties
    werden geopend
  type: main
