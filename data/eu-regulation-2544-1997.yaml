id: EURegulation25441997
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2544/97 of 16 December 1997 initiating a
    'new exporter' review of Council Regulation (EC) No 2160/96 imposing a definitive
    anti- dumping duty on imports of polyester textured filament yarn originating,
    inter alia, in Indonesia, repealing the duty with regard to imports from an exporter
    in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2544/97 de la Commission du 16 décembre 1997 portant
    ouverture d'une procédure de réexamen «nouvel exportateur» du règlement (CE)
    n° 2160/96 du Conseil instituant un droit antidumping définitif sur les importations
    de fils texturés de polyesters originaires, entre autres, d'Indonésie, abrogation
    du droit en ce qui concerne les importations réalisées par un exportateur de
    ce pays et assujettissement de ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2544/97 der Kommission vom 16. Dezember 1997 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 2160/96 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren texturierter Polyester-Filamentgarne
    mit Ursprung unter anderem in Indonesien (Überprüfung für einen neuen Ausführer),
    zur Außerkraftsetzung des Zolls gegenüber den Einfuhren der Ware eines Ausführers
    in diesem Land und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2544/97 af 16. december 1997 om indledning
    af en fornyet undersøgelse i forbindelse med en »ny eksportør« af Rådets
    forordning (EF) nr. 2160/96 om indførelse af en endelig antidumpingtold på importen
    af tekstureret garn af endeløse polyesterfibre med oprindelse i blandt andet
    Indonesien, om ophævelse af tolden på import fra en eksportør i dette land
    og om registrering af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2544/97 της Επιτροπής
    της 16ης Δεκεμβρίου 1997 για την έναρξη διαδικασίας
    επανεξέτασης, λόγω «νεοεμφανιζόμενου εξαγωγέα»,
    του κανονισμού (ΕΚ) αριθ. 2160/96 του Συμβουλίου
    για την επιβολή οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές ελαστικοποιημένων νημάτων
    από πολυεστέρα καταγωγής, μεταξύ άλλων, Ινδονησίας,
    για την αναστολή του δασμού όσον αφορά τις
    εισαγωγές από έναν εξαγωγέα σ'αυτή τη χώρα
    και για την καταχώριση αυτών των εισαγωγών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2544/97, annettu 16 päivänä joulukuuta 1997,
    muun muassa Indonesiasta peräisin olevien teksturoitujen polyesterifilamenttilankojen
    tuontia koskevan lopullisen polkumyyntitullin käyttöönottamisesta annettuun
    neuvoston asetukseen (EY) N:o 2160/96 liittyvän 'uutta viejää' koskevan tarkastelun
    vireillepanosta, erään kyseisen maan viejän tuontiin sovellettavan tullin kumoamisesta
    ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2544/97 della Commissione del 16 dicembre 1997 che
    avvia un riesame relativo ai «nuovi esportatori» del regolamento (CE) n. 2160/96
    del Consiglio, che istituisce un dazio antidumping definitivo sulle importazioni
    di filati testurizzati di poliesteri originari, tra l'altro, dell'Indonesia, che
    abroga il dazio per quanto riguarda le importazioni di un esportatore in questo
    paese e stabilisce che le importazioni siano soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 2544/97 van de Commissie van 16 december 1997 betreffende
    de opening van een nieuw onderzoek in het kader van Verordening (EG) nr. 2160/96
    van de Raad tot instelling van een definitief antidumpingrecht op getextureerd
    filamentgaren van polyester uit, onder meer, Indonesië, ten behoeve van een nieuwe
    exporteur, de intrekking van het recht op de van die exporteur afkomstige producten
    en de registratie van die producten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2544/97 da Comissão de 16 de Dezembro de 1997 relativo
    ao início de um reexame, respeitante a um «novo exportador», do Regulamento
    (CE) nº 2160/96 do Conselho que institui direitos anti- dumping definitivos sobre
    as importações de fios de filamentos texturizados de poliéster originários,
    nomeadamente da Indonésia, que revoga o direito em vigor no que respeita às
    importações de um exportador neste país e que sujeita estas importações a
    registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2544/97 de la Comisión de 16 de diciembre de 1997
    por el que se inicia un procedimiento de reconsideración para un «nuevo exportador»
    del Reglamento (CE) n° 2160/96 del Consejo por el que se establece un derecho
    antidumping definitivo sobre las importaciones de hilados texturados de filamentos
    de poliéster originarias, entre otros países, de Indonesia, derogando el derecho
    por el que se refiere a las importaciones procedentes de un exportador de este
    país y que establece el registro de estas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2544/97 av den 16 december 1997 om inledande
    av en översyn avseende en ny exportör av rådets förordning (EG) nr 2160/96
    om införande av en slutgiltig antidumpningstull på import av texturerat filamentgarn
    av polyester med ursprung i bland annat Indonesien, om upphävande av tullen såvitt
    gäller import från en exportör i det landet och om att göra denna import till
    föremål för registrering
  type: main
