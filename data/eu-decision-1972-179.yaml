title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 mars 1972, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure du traitement
    communautaire les couteaux et les couverts en acier inoxydable, des positions
    Ex 82.09 et 82.14 A du Tarif douanier commun, originaires du Japon et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/179/EWG: Entscheidung der Kommission vom 23. März 1972, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Japan stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Messer und Bestecke aus rostfreiem Stahl der Tarifnummer
    ex 82.09 und 82.14 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/179/CEE: Decisione della Commissione, del 23 marzo 1972, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i coltelli e le posate, di acciaio inossidabile
    delle voci nn. ex 82.09 e 82.14 A della tariffa doganale comune, originari del
    Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/179/EEG: Beschikking van de Commissie van 23 maart 1972 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd messen en bestek van roestvrij staal van posten ex 82.09 en
    82.14 A van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
