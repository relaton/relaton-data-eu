title:
- language: en
  script: Latn
  content: '86/250/EEC: Commission Decision of 5 May 1986 establishing the amendments
    to be made in respect of potatoes for consumption to the measures taken by Denmark
    to protect itself against the introduction of Corynebacterium sepedonicum (Only
    the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/250/CEE: Décision de la Commission du 5 mai 1986 prévoyant les modifications
    à apporter, en ce qui concerne les pommes de terre de consommation, aux mesures
    prises par le Danemark pour se préserver contre l''introduction du Corynebacterium
    sepedonicum (Le texte en langue danoise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/250/EWG: Entscheidung der Kommission vom 5. Mai 1986 über Änderungen
    zu den Schutzmaßnahmen Dänemarks gegen die Einschleppung von bakterieller Ringfäule
    bei Konsumkartoffeln (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/250/EØF: Kommissionens beslutning af 5. maj 1986 om ændring af de
    foranstaltninger hvad angår konsumkartofler, som Danmark har truffet for at beskytte
    sig mod indslæbning af Corynebacterium sepedonicum (Kun den danske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/250/ΕΟΚ: Απόφαση της Επιτροπής της 5ης Μαΐου
    1986 για τις τροποποιήσεις, όσον αφορά τα γεώμηλα
    προς κατανάλωση, των μέτρων που έχει λάβει
    η Δανία για να προστατευθεί από την εισαγωγή
    corynebacterium sepedonicum (Το κείμενο στη δανική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/250/CEE: Decisione della Commissione del 5 maggio 1986 relativa alle
    modifiche, per quanto concerne le patate destinate al consumo, delle misure prese
    dalla Danimarca per la protezione del paese contro l''introduzione del Corynebacterium
    sepedonicum (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '86/250/EEG: Beschikking van de Commissie van 5 mei 1986 tot vaststelling
    van de wijzigingen die ten aanzien van consumptie-aardappelen moeten worden aangebracht
    in de maatregelen die door Denemarken zijn genomen om zich te beschermen tegen
    besmetting met Corynebacterium sepedonicum (Slechts de tekst in de Deense taal
    is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/250/CEE: Decisão da Comissão de 5 de Maio de 1986 que estabelece
    as alterações a efectuar, em relação às batatas para consumo, às medidas
    de protecção tomadas pela Dinamarca contra a introdução de Corynebacterium
    sepedonicum (Apenas faz fé o texto em língua dinamarquesa)'
  type: main
- language: es
  script: Latn
  content: '86/250/CEE: Decisión de la Comisión de 5 de mayo de 1986 que establece
    las modificaciones que habrán de hacerse, respecto a las patatas destinadas al
    consumo, de las medidas tomadas por Dinamarca para protegerse de la introducción
    de Corynebacterium sepedonicum (El texto en lengua danesa es el único auténtico)'
