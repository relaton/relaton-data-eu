title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2232/2004 of 23 December 2004 amending Annexes
    I, II and III to Council Regulation (EEC) No 2377/90 laying down a Community procedure
    for the establishment of maximum residue limits of veterinary medicinal products
    in foodstuffs of animal origin, as regards altrenogest, beclomethasone dipropionate,
    cloprostenol, r-cloprostenol, sorbitan sesquioleate and toltrazuril
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2232/2004 de la Commission du 23 décembre 2004 modifiant
    les annexes I, II et III du règlement (CEE) n° 2377/90 du Conseil établissant
    une procédure communautaire pour la fixation des limites maximales de résidus
    de médicaments vétérinaires dans les aliments d'origine animale, en ce qui
    concerne les substances Altrenogest, Beclomethasone dipropionate, Cloprostenol,
    R-Cloprostenol, Sorbitan sesquioleate et Toltrazuril
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2232/2004 der Kommission vom 23. Dezember 2004 zur
    Änderung der Anhänge I, II und III der Verordnung (EWG) Nr. 2377/90 des Rates
    zur Schaffung eines Gemeinschaftsverfahrens für die Festsetzung von Höchstmengen
    für Tierarzneimittelrückstände in Nahrungsmitteln tierischen Ursprungs in Bezug
    auf Altrenogest, Beclometason-Dipropionat, Cloprostenol, R-Cloprostenol, Sorbitansesquioleat
    und Toltrazuril
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EO) № 2232/2004 на Комисията от 23 декември
    2004 година за изменение на приложения I, II и III
    към Регламент (ЕИО) № 2377/90 на Съвета за установяване
    на процедура на Общността за определяне на
    максимално допустимите граници на остатъчни
    вещества от ветеринарномедицински продукти
    в храните от животински произход, по отношение
    на веществата алтреногест, беклометазон дипропионат,
    клопростенол, R-клопростенол, сорбитан секвиолеат
    и толтразурил
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2232/2004 ze dne 23. prosince 2004, kterým
    se mění přílohy I, II a III nařízení Rady (EHS) č. 2377/90, kterým se
    stanoví postup Společenství pro stanovení maximálních limitů reziduí veterinárních
    léčivých přípravků v potravinách živočišného původu, pokud jde o altrenogest,
    beclomethasone dipropionate, kloprostenol, r-kloprostenol, sorbitan sesquioleát
    a toltrazuril
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2232/2004 af 23. december 2004 om ændring
    af bilag I, II og III til Rådets forordning (EØF) nr. 2377/90 om en fælles
    fremgangsmåde for fastsættelse af maksimalgrænseværdier for restkoncentrationer
    af veterinærlægemidler i animalske levnedsmidler for så vidt angår altrenogest,
    beclomethason-dipropionat, cloprostenol, r-cloprostenol, sorbitansesquioleat og
    toltrazuril
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2232/2004 της Επιτροπής,
    της 23ης Δεκεμβρίου 2004, για την τροποποίηση
    των παραρτημάτων I, II και III του κανονισμού (ΕΟΚ)
    αριθ. 2377/90 του Συμβουλίου για τη θέσπιση κοινοτικής
    διαδικασίας για τον καθορισμό ανώτατων ορίων
    καταλοίπων κτηνιατρικών φαρμάκων στα τρόφιμα
    ζωικής προέλευσης όσον αφορά την αλτρενογέστη,
    τη διπροπιονική βεκλομεθαζόνη, την κλοπροστενόλη,
    την R-κλοπροστενόλη, τη σεσκιελαϊκή σορβιτάνη
    και την τολτραζουρίλη
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2232/2004, 23. detsember 2004, millega muudetakse
    nõukogu määruse (EMÜ) nr 2377/90 (milles sätestatakse ühenduse menetlus
    veterinaarravimijääkide piirnormide kehtestamiseks loomsetes toiduainetes) I,
    II ja III lisa seoses altrenogesti, beklometasoon-diproprionaadi, kloprostenooli,
    r-kloprostenooli, sorbitanseskvioleaadi ja toltrasuriiliga
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2232/2004, annettu 23 päivänä joulukuuta 2004,
    yhteisön menettelystä eläinlääkejäämien enimmäismäärien vahvistamiseksi
    eläinperäisissä elintarvikkeissa annetun neuvoston asetuksen (ETY) N:o 2377/90
    liitteiden I, II ja III muuttamisesta altrenogestin, beklometasoni-dipropionaatin,
    kloprostenolin, r-kloprostenolin, sorbitaaniseskvioleaatin ja toltratsuriilin
    osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2232/2004/EK rendelete (2004. december 23.) az állati eredetű
    élelmiszerekben található állatgyógyászati készítmények maximális szermaradék-határértékeinek
    megállapítására szolgáló közösségi eljárás kialakításáról szóló
    2377/90/EGK tanácsi rendelet I., II. és III. mellékletének az altrenogestre,
    beclomethasone-dipropionátra, cloprostenolra, r-cloprostenolra, sorbitan-szeszkviolátra
    és toltrazurilra vonatkozó módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2232/2004 della Commissione, del 23 dicembre 2004,
    che modifica gli allegati I, II e III del regolamento (CEE) n. 2377/90 del Consiglio
    che definisce una procedura comunitaria per la determinazione dei limiti massimi
    di residui di medicinali veterinari negli alimenti di origine animale per quanto
    riguarda le sostanze altrenogest, beclometasone dipropionato, cloprostenolo, R-cloprostenolo,
    sorbitan sesquioleato e toltrazuril
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2232/2004 (2004. gada 23. decembris), ar ko groza
    I, II un III pielikumu Padomes Regulā (EEK) Nr. 2377/90, ar ko nosaka Kopienas
    procedūru veterināro zāļu maksimāli pieļaujamo atlieku daudzumu noteikšanai
    dzīvnieku izcelsmes produktos, attiecībā uz altrenogestu, beklometazona dipropionātu,
    kloprostenolu, R-kloprostenolu, sorbitānseshioleātu un toltrazurilu
  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 23 d. Komisijos reglamentas (EB) Nr. 2232/2004, iš dalies
    keičiantis Tarybos reglamento (EEB) Nr. 2377/90, nustatančio veterinarinių
    vaistų likučių gyvūninės kilmės maisto produktuose didžiausių kiekių
    nustatymo tvarką Bendrijoje, I, II ir III priedų nuostatas dėl altrenogesto,
    beklometazono dipropionato, kloprostenolio, R-kloprostenolio, sorbitano seskvioleato
    ir toltrazurilio
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 2232/2004 tat- 23 ta' Diċembru 2004
    li jemenda l-Annessi I, II u III tar-Regolament tal-Kunsill (KEE) Nru 2377/90
    li jistabbilixxi kull proċedura tal-Komunità għal iffissar ta' limiti massimi
    ta' residwi ta' prodotti mediċinali veterinarji fi prodotti tal-ikel ta' oriġini
    mill-annimali, fir-rigward tal-altrenogest, il-beclomethasone dipropionate, il-cloprostenol,
    l-r-cloprostenol, is-sorbitan sesquioleate u t-toltrazuril
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2232/2004 van de Commissie van 23 december 2004 tot
    wijziging van de bijlagen I, II en III bij Verordening (EEG) nr. 2377/90 van de
    Raad houdende een communautaire procedure tot vaststelling van maximumwaarden
    voor residuen van geneesmiddelen voor diergeneeskundig gebruik in levensmiddelen
    van dierlijke oorsprong wat altrenogest, beclometasondipropionaat, cloprostenol,
    r-cloprostenol, sorbitansesquioleaat en toltrazuril betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2232/2004 z dnia 23 grudnia 2004 r. zmieniające
    załączniki I, II i III do rozporządzenia Rady (EWG) nr 2377/90 ustanawiającego
    wspólnotową procedurę określania maksymalnych limitów pozostałości weterynaryjnych
    produktów leczniczych w środkach spożywczych pochodzenia zwierzęcego w odniesieniu
    do altrenogestu, dipropionianu beklometazonu, kloprostenolu, R-kloprostenolu,
    półtoraoleinianu sorbitanu oraz toltrazurilu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2232/2004 da Comissão, de 23 de Dezembro de 2004,
    que altera os anexos I, II e III do Regulamento (CEE) n.° 2377/90 do Conselho
    que prevê um processo comunitário para o estabelecimento de limites máximos
    de resíduos de medicamentos veterinários nos alimentos de origem animal, no
    que diz respeito ao altrenogest, dipropionato de beclometasona, cloprostenol,
    R-cloprostenol, sesquioleato de sorbitano e toltrazuril
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2232/2004 al Comisiei din 23 decembrie 2004 de modificare
    a anexelor I, II și III la Regulamentul (CEE) nr. 2377/90 al Consiliului de instituire
    a unei proceduri comunitare pentru stabilirea limitelor maxime ale reziduurilor
    de medicamente de uz veterinar în alimentele de origine animală, în ceea ce
    privește substanțele Altrenogest, Beclometazon dipropionat, Cloprostenol, R-Cloprostenol,
    Sorbitan sesquioleate și Toltrazuril
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2232/2004 z 23. decembra 2004, ktorým sa menia
    a dopĺňajú prílohy I, II a III k nariadeniu Rady (EHS) č. 2377/90 určujúcemu
    postup Spoločenstva pri stanovení maximálnych limitov rezíduí liekov veterinárnej
    medicíny v potravinách živočíšneho pôvodu, pokiaľ ide o altrenogest, beclomethasone
    dipropionate, cloprostenol, R-cloprostenol, seskvioleját sorbitolu a toltrazuril
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2232/2004 z dne 23. decembra 2004 o spremembi
    prilog I, II in III k Uredbi Sveta (EGS) št. 2377/90 o določitvi postopka Skupnosti
    za določanje najvišjih mejnih vrednosti ostankov veterinarskih zdravil v živilih
    živalskega izvora glede altrenogesta, beklometazon dipropionata, kloprostenola,
    R-kloprostenola, sorbitan seskvioleata in toltrazurila
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2232/2004 de la Comisión, de 23 de diciembre de 2004,
    por el que se modifican, en lo referente a las sustancias altrenogest, beclometasona
    dipropionato, cloprostenol, R-cloprostenol, sesquioleato de sorbitán y toltrazuril,
    los anexos I, II y III del Reglamento (CEE) n° 2377/90 del Consejo por el que
    se establece un procedimiento comunitario de fijación de los límites máximos
    de residuos de medicamentos veterinarios en los alimentos de origen animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2232/2004 av den 23 december 2004 om
    ändring av bilagorna I, II och III till rådets förordning (EEG) nr 2377/90
    om inrättandet av ett gemenskapsförfarande för att fastställa gränsvärden
    för högsta tillåtna restmängder av veterinärmedicinska läkemedel i livsmedel
    med animaliskt ursprung avseende altrenogest, beklometason-diproprionat, kloprostenol,
    r-kloprostenol, sorbitanseskvioleat och toltrazuril
