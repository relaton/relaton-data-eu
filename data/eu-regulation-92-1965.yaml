id: EURegulation921965
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement n 92/65/CEE de la Commission, du 29 juin 1965, fixant, pour
    les importations effectuées à partir du 1er juillet 1965, montant des prélèvements
    intracommunautaires pour les oeufs de volailles en coquille, les volailles vivantes
    d'un poids n'excédant pas 185 grammes et les volailles abattues ainsi que pour
    les produits du secteur de la viande de volaille dont les droits de douane ont
    fait l'objet d'une consolidation dans le cadre du G.A.T.T.
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 92/65/EWG der Kommission vom 29. Juni 1965 zur Festsetzung
    der innergemeinschaftlichen Abschöpfungsbeträge für Eier in der Schale von
    Hausgeflügel, lebendes Hausgeflügel mit einem Gewicht von höchstens 185 Gramm
    und geschlachtetes Hausgeflügel und die Erzeugnisse der Geflügelwirtschaft,
    deren Zollsätze im GATT konsolidiert worden sind, für die ab 1. Juli 1965 getätigten
    Einfuhren
  type: main
- language: it
  script: Latn
  content: Regolamento n. 92/65/CEE della Commissione, del 29 giugno 1965, che fissa,
    per le importazioni effettuate dal 1 luglio 1965, i prelievi intracomunitari per
    le uova in guscio di volatili, i volatili da cortile vivi di peso non superiore
    a 185 grammi ed i volatili da cortile macellati, e per i prodotti del settore
    dei pollame i cui dazi doganali sono stati consolidati in seno al G.A.T.T.
  type: main
- language: nl
  script: Latn
  content: Verordening no. 92/65/EEG van de Commissie van 29 juni 1965 houdende vaststelling
    van de intracommunautaire heffingen voor eieren in de schaal van pluimvee, levend
    pluimvee dat niet meer dan 185 gram weegt en geslacht pluimvee, alsmede voor de
    produkten van de sector pluimveehouderij waarvoor de douanerechten zijn geconsolideerd
    in het kader van de G.A.T.T., bij invoer die van 1 juli 1965 af plaatsvindt
  type: main
