id: EUDecision1977652
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 1 February 1977 authorizing the United Kingdom not
    to apply Community treatment to cotton jeans falling within heading No ex 61.01
    of the Common Customs Tariff, originating in the People's Republic of China and
    in free circulation in the Netherlands
  type: main
- language: fr
  script: Latn
  content: '77/652/CEE: Décision de la Commission, du 1er février 1977, autorisant
    le Royaume-Uni à exclure du traitement communautaire les jeans de coton de la
    position 61.01 du Tarif douanier commun, originaires de la République populaire
    de Chine et mis en libre pratique aux Pays-Bas'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. Februar 1977, mit der das Vereinigte
    Königreich ermächtigt wird, aus der Volksrepublik China stammende und in den
    Niederlanden im freien Verkehr befindliche Jeans aus Baumwolle der Tarifnummer
    ex 61.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 1. februar 1977 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage jeans af bomuld, som henhører
    under pos. ex 61.01 i den fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik
    og frit kan omsættes i Nederlandene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1 febbraio 1977, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario i jeans di cotone della voce ex
    61.01 della tariffa doganale comune, originari della Repubblica popolare cinese
    e messi in libera pratica nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 februari 1977 waarbij het Verenigd Koninkrijk
    wordt gemachtigd jeans van katoen van post ex 61.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in Nederland in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
