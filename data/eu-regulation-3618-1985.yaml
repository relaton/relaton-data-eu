title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3618/85 of 20 December 1985 re-establishing
    the levying of customs duties applicable to hexachlorocyclohexanes falling within
    subheading 29.02 ex B originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3618/85 de la Commission du 20 décembre 1985 portant
    rétablissement de la perception des droits de douane applicables à l' hexachlorocyclohexane
    de la sous-position 29.02 ex B du tarif douanier commun, originaire de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3618/85 der Kommission vom 20. Dezember 1985 zur Wiedereinführung
    der Erhebung der Zölle für Hexachlorcyclohexane der Tarifstelle 29.02 ex B des
    Gemeinsamen Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3618/85 af 20. december 1985 om genindførelse
    af opkrævning af told for hexachlorcyclohexaner, henhørende under pos. 29.02
    ex B i den fælles toldtarif og med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
