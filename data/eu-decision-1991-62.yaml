    1991 zur Gewährleistung der Einhaltung der gemeinschaftlichen Regelung für die
    Erhaltung und Bewirtschaftung der Fischereiressourcen (Nur der deutsche, der griechische
    und der englische Text sind verbindlich) (91/62/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 28. januar 1991 om refusionsberettigelsen
