title:
- language: en
  script: Latn
  content: '91/62/EEC: Commission Decision of 28 January 1991 on the eligibility of
    expenditure to be incurred in 1991 by Germany, Greece and the United Kingdom for
    the purpose of ensuring compliance with the Community system for the conservation
    and management of fishery resources (only the German, Greek and Portuguese texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/62/CEE: Décision de la Commission du 28 janvier 1991 relative à l''éligibilité
    des dépenses à effectuer par l''Allemagne, la Grèce et le Royaume-Uni au cours
    de l''année 1991 pour assurer le respect du régime communautaire de conservation
    et de gestion des ressources de pêche (Les textes en langues allemande, grecque
    et anglaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 28. Januar 1991 über die Erstattungsfähigkeit
