    for at sikre overholdelse af fællesskabsordningen for bevarelse og forvaltning
    af fiskeressourcerne (Kun de tyske, græske og engelske udgaver er autentiske)
    (91/62/EØF) #'
  type: main
- language: el
  script: Grek
