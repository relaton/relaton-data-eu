    που θα πραγματοποιηθούν εντός του 1991 από τη
    Γερμανία, την Ελλάδα και το Ηνωμένο Βασίλειο
    για την εφαρμογή του κοινού καθεστώτος διατήρησης
    και διαχείρισης των αλιευτικών πόρων'
  type: main
- language: it
