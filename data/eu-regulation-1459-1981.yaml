title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1459/81 of 27 May 1981 laying down the provisions
    necessary to avoid disturbance on the sugar market following the increase in prices
    in the sector for the 1981/82 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1459/81 de la Commission, du 27 mai 1981, établissant
    les dispositions nécessaires pour éviter des perturbations sur le marché du
    sucre par suite de l' augmentation des prix dans ce secteur pour la campagne de
    commercialisation 1981/1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1459/81 der Kommission vom 27. Mai 1981 mit den erforderlichen
    Bestimmungen zur Vermeidung von Störungen auf dem Zuckermarkt im Anschluß an
    die Anhebung der Zuckerpreise für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1459/81 af 27. maj 1981 om nødvendige
    foranstaltninger til undgåelse af forstyrrelser på sukkermarkedet som følge
    af prisstigningen for sukker i produktionsåret 1981/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1459/81 τής Επιτροπής
    τής 27ης Μαΐου 1981 περί θεσπίσεως τών απαραίτητων
    διατάξεων γιά τήν αποφυγή διαταραχών στήν
    αγορά ζάχαρης λόγω τής αυξήσεως τών τιμών στόν
    τομέα αυτό γιά τήν περίοδο εμπορίας 1981/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1459/81 della Commissione, del 27 maggio 1981, che
    stabilisce le disposizioni necessarie per evitare perturbazioni sul mercato dello
    zucchero a seguito dell' aumento dei prezzi in tale settore per la campagna di
    commercializzazione 1981/1982
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1459/81 van de Commissie van 27 mei 1981 tot vaststelling
    van de noodzakelijke bepalingen om verstoringen van de markt voor suiker te vermijden
    door de verhoging van de prijzen in deze sector voor het verkoopseizoen 1981/1982
  type: main
