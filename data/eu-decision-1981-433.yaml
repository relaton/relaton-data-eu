title:
- language: en
  script: Latn
  content: '81/433/EEC: Commission Decision of 7 May 1981 amending Decision 77/144/EEC
    laying down the standard code and rules governing the transcription into a machine-readable
    form of the data of the surveys of plantations of certain species of fruit trees,
    and laying down the boundaries of the production areas for these surveys'
  type: main
- language: fr
  script: Latn
  content: '81/433/CEE: Décision de la Commission, du 7 mai 1981, modifiant la décision
    77/144/CEE établissant le code et les règles types relatifs à la transcription
    sous une forme lisible par machine des données des enquêtes sur les plantations
    de certaines espèces d'' arbres fruitiers et fixant les limites des zones de
    production pour ces enquêtes'
  type: main
- language: de
  script: Latn
  content: '81/433/EWG: Entscheidung der Kommission vom 7. Mai 1981 zur Änderung
    der Entscheidung 77/144/EWG bezüglich der Festlegung eines Standardkodes und
    einer Regelung zur Übertragung der Erhebungsdaten über Anlagen gewisser Obstarten
    in maschinenlesbare Form und zur Festsetzung der Abgrenzungen der Produktionszonen'
  type: main
- language: da
  script: Latn
  content: '81/433/EØF: Kommissionens beslutning af 7. maj 1981 om ændring af beslutning
    77/144/EØF om fastsættelse af den standardkode og de regler, der gælder for
    omskrivning til maskinløsbar form af resultaterne af undersøgelserne af plantager
    med visse arter af frugttræer og om fastsættelse af grænserne for produktionszonerne
    med henblik på disse undersøgelser'
  type: main
- language: el
  script: Grek
  content: '81/433/ΕΟΚ: Απόφαση τής Επιτροπής τής 7ης Μαΐου
    1981 περί τροποποιήσεως τής αποφάσεως 77/144/ΕΟΚ
    «περί καθορισμού τού κώδικα καί τών κανόνων—τύπων
    πού διέπουν τή μεταγραφή τών δεδομένων τών
    ερευνών σχετικά μέ φυτείες ορισμένων ειδών
    οπωροφόρων δένδρων υπό μορφή μηχανικώς αναγνώσιμη
    ως καί περί τού καθορισμού τών ορίων τών περιοχών
    παραγωγής γιά τίς έρευνες αυτές»'
  type: main
- language: fi
  script: Latn
  content: '81/433/ETY: Komission päätös, tehty 7 päivänä toukokuuta 1981, standardikoodista
    ja -säännöistä, jotka koskevat tiettyjen hedelmälajien viljelmiä koskevien
    tietojen keruiden tulosten siirtoa koneellisesti luettavaan muotoon, sekä tuotantoalueiden
    rajoista näitä tietojen keruita varten tehdyn päätöksen 77/144/ETY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '81/433/CEE: Decisione della Commissione, del 7 maggio 1981, che modifica
    la decisione 77/144/CEE che stabilisce il codice standard e le norme per la trascrizione
    in una forma che si presti alla lettura meccanografica dei risultati delle indagini
    sulle piantagioni di certe specie di alberi da frutto, nonché le delimitazioni
    delle zone di produzione per queste indagini'
  type: main
- language: nl
  script: Latn
  content: '81/433/EEG: Beschikking van de Commissie van 7 mei 1981 tot wijziging
    van Beschikking 77/144/EEG houdende de standaardcode en de voorschriften voor
    de transcriptie in voor de machine leesbare vorm van de gegevens uit de statistische
    enquêtes, ten einde het produktiepotentieel van bepaalde soorten fruitbomen vast
    te stellen, en om de grenzen van de produktiegebieden voor deze enquêtes vast
    te stellen'
  type: main
- language: pt
  script: Latn
  content: '81/433/CEE: Decisão da Comissão, de 7 de Maio de 1981, que altera a
    Decisão 77/144/CEE que estabelece o código e as regras-tipo relativas à transcrição
    sob forma legível por máquina, dos dados dos inquéritos sobre as plantações
    de certas espécies de árvores de futo e fixa os limites das zonas de produção
    para estes inquéritos'
  type: main
- language: es
  script: Latn
  content: '81/433/CEE: Decisión de la Comisión, de 7 de mayo de 1981, por la que
    se modifica la Decisión 77/144/CEE por la que se establecen el código y las
    normas tipo relativas a la transcripción en forma legible por máquina de los
    datos de las encuestas sobre las plantaciones de determinadas especies de frutales
    y por la que se determinan los límites de las zonas de producción para dichas
    encuestas'
  type: main
- language: sv
  script: Latn
  content: '81/433/EEG: Kommissionens beslut av den 7 maj 1981 om ändring av beslut
    77/144/EEG om fastställande av en standardkod och bestämmelser för överföring
    till maskinläsbar form av data från de statistiska undersökningarna av odlingar
    med vissa slag av fruktträd samt om fastställande av gränserna för produktionsområdena
    för dessa undersökningar'
  type: main
