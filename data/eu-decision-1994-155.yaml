title:
- language: en
  script: Latn
  content: Commission Decision of 8 March 1994 authorizing the Kingdom of the Netherlands
    to permit temporarily the marketing of rye seed not satisfying the requirements
    of Council Directive 66/402/EEC
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 8 mars 1994 autorisant le Royaume des Pays-Bas
    à admettre temporairement la commercialisation de semences de seigle ne répondant
    pas aux exigences de la directive 66/402/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 8. März 1994 zur Ermächtigung des Königreichs
    der Niederlande, vorübergehend Saatgut von Roggen zum Verkehr zuzulassen, das
    den Anforderungen der Richtlinie 66/402/EWG des Rates nicht entspricht
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 8. marts 1994 om bemyndigelse af Kongeriget
    Nederlandene til midlertidigt at tillade handel med sædekorn af rug, der ikke
    opfylder kravene i Rådets direktiv 66/402/EØF
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 8ης Μαρτίου 1994
    που εξουσιοδοτεί το Βασίλειο των Κάτω Χωρών
    να επιτρέψει προσωρινά την εμπορία σπόρων
    σίκαλης που δεν πληρούν τις απαιτήσεις της
    οδηγίας 66/402/ΕΟΚ του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE dell' 8 marzo 1994 che autorizza il Regno dei
    Paesi Bassi ad ammettere temporaneamente la commercializzazione di sementi di
    segale che non soddisfano ai requisiti della direttiva 66/402/CEE del Consiglio
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 8 maart 1994 houdende machtiging van het
    Koninkrijk der Nederlanden om zaaizaad van rogge dat niet aan de eisen van Richtlijn
    66/402/EEG van de Raad voldoet tijdelijk tot de handel toe te laten
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 8 de Março de 1994 que autoriza o Reino dos Países
    Baixos a admitir temporariamente a comercialização de sementes de centeio que
    não satisfazem as exigências da Directiva 66/402/CEE do Conselho
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 8 de marzo de 1994 por la que se autoriza
    al Reino de los Países Bajos a admitir temporalmente la comercialización de
    semillas de centeno que no cumplan los requisitos de la Directiva 66/402/CEE del
    Consejo
  type: main
