title:
- language: en
  script: Latn
  content: '89/573/EEC: Commission Decision of 30 October 1989 terminating the investigation
    concerning imports of dicumyl peroxide originating in Taiwan and accepting an
    undertaking offered in the context of the review concerning imports of dicumyl
    peroxide originating in Japan and terminating the proceeding'
  type: main
- language: fr
  script: Latn
  content: '89/573/CEE: Décision de la Commission du 30 octobre 1989 portant clôture
    de l''enquête relative aux importations de peroxyde de dicumyle originaire de
    T''aï-wan et portant acceptation d''engagement offert dans le cadre de la procédure
    de réexamen relative aux importations de peroxyde de dicumyle originaire du Japon
    et portant clôture de l''enquête y afférente'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 30. Oktober 1989 über die Einstellung der
    Untersuchung betreffend die Einfuhren von Dicumylperoxid mit Ursprung in Taiwan
    über die Annahme des Verpflichtungsangebotes im Rahmen der Überprüfung der
    Einfuhren von Dicumylperoxid mit Ursprung in Japan und über die Einstellung des
    entsprechenden Verfahrens (89/573/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 30. oktober 1989 om afslutning af undersøgelsen
    vedrørende importen af dicumylperoxid med oprindelse i Taiwan og om godtagelse
    af tilsagn i forbindelse med den fornyede undersøgelse vedrørende importen af
    dicumylperoxid med oprindelse i Japan og om afslutning af denne undersøgelse
    (89/573/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/573/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
    Οκτωβρίου 1989 για την περάτωση της διαδικασίας
    σχετικά με τις εισαγωγές δικουμελικού υπεροξειδίου
    καταγωγής Ταϊβάν και για την αποδοχή των δεσμεύσεων
    που προσφέρθηκαν στο πλαίσιο της διαδικασίας
    επανεξέτασης σχετικά με τις εισαγωγές δικουμελικού
    υπεροξειδίου καταγωγής Ιαπωνίας και για την
    περάτωση της σχετικής έρευνας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 30 ottobre 1989 che chiude l'' inchiesta
    relativa alle importazioni di perossido di dicumile originarie di Taiwan, accetta
    impegni offerti nell'' ambito della procedura di riesame relativa alle importazioni
    di perossido di dicumile originarie del Giappone e chiude detta procedura (89/573/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 30 oktober 1989 tot beëindiging van het
    onderzoek betreffende de invoer van dicumylperoxide van oorsprong uit Taiwan alsmede
    tot aanvaarding van de verbintenissen die zijn aangeboden in het kader van het
    nieuwe onderzoek betreffende de invoer van dicumylperoxide van oorsprong uit Japan
    en tot beëindiging van het desbetreffende onderzoek (89/573/EEG) #'
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 30 de Outubro de 1989 que encerra o inquérito relativo
    às importaçoes de peroxido de dicumilo originario de Taiwan, que aceita o compromisso
    oferecido no âmbito do processo de reexame relativo às importaçoes de peroxido
    de dicumilo originarias do Japao e que encerra o respectivo inquérito (89/573/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 30 de octubre de 1989 por la que se concluye
    la investigación relativa a las importaciones de peróxido de dicumilo originario
    de Taiwán, por la que se acepta el compromiso presentado en el marco del procedimiento
    de revisión relativo a las importaciones de peróxido de dicumilo originario
    de Japón y por la que se concluye la investigación correspondiente (89/573/CEE)
    #'
