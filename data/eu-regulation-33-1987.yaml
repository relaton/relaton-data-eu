title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 33/87 of 7 January 1987 fixing the quotas
    for 1987 which may be applied to trade in certain products in the wine sector
    between Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 33/87 de la Commission du 7 janvier 1987 fixant pour
    l' année 1987 les contingents pouvant être appliqués, pour certains produits
    du secteur viti-vinicole, dans les échanges entre l' Espagne et le Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 33/87 der Kommission vom 7. Januar 1987 zur Festsetzung
    der Kontingente für das Jahr 1987 für bestimmte Erzeugnisse des Weinsektors
    im Handel zwischen Spanien und Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 33/87 af 7. januar 1987 om fastsættelse
    af de kontingenter for 1987, som kan anvendes for visse vinprodukter i samhandelen
    mellem Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 33/87 της Επιτροπής
    της 7ης Ιανουαρίου 1987 που καθορίζει τις ποσοστώσεις
    για το έτος 1987 που μπορούν να εφαρμοσθούν, για
    ορισμένα προϊόντα του αμπελοοινικού τομέα,
    στις συναλλαγές μεταξύ της Ισπανίας και της
    Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 33/87 della Commissione del 7 gennaio 1987 che fissa,
    per il 1987, i contingenti che possono essere applicati, per taluni prodotti del
    settore vitivinicolo, negli scambi tra la Spagna e il Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 33/87 van de Commissie van 7 januari 1987 tot vaststelling
    van de contingenten voor 1987 die in het handelsverkeer tussen Spanje en Portugal
    op bepaalde produkten van de wijnbouwsector kunnen worden toegepast
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 33/87 da Comissão de 7 de Janeiro de 1987 que fixa
    os contingentes para o ano de 1987 que podem ser aplicados para determinados produtos
    do sector vitivinícola nas trocas comerciais entre Espanha e Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 33/87 de la Comisión de 7 de enero de 1987 por el
    que se fijan los contingentes de determinados productos del sector vitivinícola
    para el año 1987, que podrán aplicarse en los intercambios entre España y Portugal
