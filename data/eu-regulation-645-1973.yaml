title:
- language: en
  script: Latn
  content: Regulation (EEC) No 645/73 of the Commission of 2 March 1973 determining
    landing areas for fishery products which are very distant from the main centres
    of consumption in the Community and fixing the withdrawal prices, referred to
    in Article 10 (4) of Regulation (EEC) No 2142/70, which are to be applied in those
    areas
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 645/73 de la Commission, du 2 mars 1973, déterminant,
    dans le secteur des produits de la pêche, les zones de débarquement très éloignées
    des principaux centres de consommation de la Communauté et fixant les prix de
    retrait visés à l'article 10 paragraphe 4 du règlement (CEE) n° 2142/70 applicables
    dans ces zones pour l'année 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 645/73 der Kommission vom 2. März 1973 zur Bestimmung
    der Anlandegebiete der Fischwirtschaft, die von den wichtigsten Verbrauchszentren
    der Gemeinschaft sehr weit entfernt liegen, und zur Festsetzung der in diesen
    Gebieten anwendbaren Rücknahmepreise gemäß Artikel 10 Absatz 4 der Verordnung
    (EWG) Nr. 2142/70 für das Jahr 1973
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 645/73 af 2. marts 1973 om bestemmelse
    af sådanne landingsområder inden for fiskerisektoren, som ligger meget fjernt
    fra Fællesskabets vigtigste forbrugscentre, og om fastsættelse for året 1973
    af de tilbagetagelsespriser, som skal anvendes i disse områder, i henhold til
    artikel 10, stk. 4, i forordning (EØF) nr. 2142/70
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 645/73 della Commissione, del 2 marzo 1973, che determina,
    nel settore dei prodotti della pesca, le zone di sbarco più lontane dai principali
    centri di consumo della Comunità e fissa i prezzi di ritiro di cui all'articolo
    10, paragrafo 4, del regolamento (CEE) n. 2142/70 applicabili in tali zone per
    l'anno 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 645/73 van de Commissie van 2 maart 1973 houdende
    bepaling, in de sector visserijprodukten, van de lossingsgebieden die verafgelegen
    zijn van de voornaamste verbruikscentra van de Gemeenschap en houdende vaststelling
    van de in die gebieden geldende ophoudprijzen als bedoeld in artikel 10, lid 4,
    van Verordening (EEG) nr. 2142/70 voor het jaar 1973
  type: main
