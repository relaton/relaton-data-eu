id: EUDecision2013718
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2013/718/EU: Commission Implementing Decision of 4 December 2013 amending
    Annex I to Decision 2004/211/EC as regards the entry for Brazil in the list of
    third countries and parts thereof from which the imports into the Union of live
    equidae and semen, ova and embryos of the equine species are authorised, amending
    Annex II(D) to Decision 92/260/EEC as regards test requirements for glanders,
    and amending Decisions 92/260/EEC, 93/196/EEC and 93/197/EEC as regards certain
    geographical denominations (notified under document C(2013) 8553)'
  type: main
- language: fr
  script: Latn
  content: '2013/718/UE: Décision d’exécution de la Commission du 4 décembre
    2013 modifiant l’annexe I de la décision 2004/211/CE en ce qui concerne l’entrée
    relative au Brésil sur la liste des pays tiers et des parties de ces pays en
    provenance desquels les importations dans l’Union européenne d’équidés
    vivants et de sperme, d’ovules et d’embryons de l’espèce équine sont autorisées,
    modifiant l’annexe II, point D), de la décision 92/260/CEE en ce qui concerne
    les exigences en matière d’essais pour la morve et modifiant les décisions
    92/260/CEE, 93/196/CEE et 93/197/CEE en ce qui concerne certaines dénominations
    géographiques [notifiée sous le numéro C(2013) 8553]'
  type: main
- language: de
  script: Latn
  content: '2013/718/EU: Durchführungsbeschluss der Kommission vom 4. Dezember 2013
    zur Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich des Eintrags
    für Brasilien in der Liste von Drittländern und Teilen von Drittländern, aus
    denen die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen und
    -embryonen in die Europäische Union zugelassen ist, zur Änderung des Anhangs
    II.D der Entscheidung 92/260/EWG hinsichtlich der Bedingungen für die Untersuchung
    auf Rotz sowie zur Änderung der Entscheidungen 92/260/EWG, 93/196/EWG und 93/197/EWG
    hinsichtlich bestimmter geografischer Bezeichnungen (Bekanntgegeben unter Aktenzeichen
    C(2013) 8553)'
  type: main
- language: bg
  script: Cyrl
  content: '2013/718/ЕС: Решение за изпълнение на Комисията
    от 4 декември 2013 година за изменение на приложение
    I към Решение 2004/211/ЕО по отношение на вписването
    за Бразилия в списъка на трети страни и части
    от тях, от които е разрешен вносът в Съюза на
    живи еднокопитни и на сперма, яйцеклетки и
    ембриони от еднокопитни, за изменение на приложение
    II, буква Г от Решение 92/260/ЕИО по отношение на
    изискванията за изследване за сап и за изменение
    на решения 92/260/ЕИО, 93/196/ЕИО и 93/197/ЕИО по отношение
    на някои географски наименования (нотифицирано
    под номер C(2013) 8553)'
  type: main
- language: cs
  script: Latn
  content: '2013/718/EU: Prováděcí rozhodnutí Komise ze dne 4. prosince 2013 ,
    kterým se mění příloha I rozhodnutí 2004/211/ES, pokud jde o položku týkající
    se Brazílie v seznamu třetích zemí a jejich částí, ze kterých je povolen
    dovoz živých koňovitých a spermatu, vajíček a embryí druhů koňovitých
    do Unie, a kterým se mění příloha II bod D rozhodnutí 92/260/EHS, pokud
    jde o požadavky testování na vozhřivku, a kterým se mění rozhodnutí 92/260/EHS,
    93/196/EHS a 93/197/EHS, pokud jde o některá zeměpisná označení (oznámeno
    pod číslem C(2013) 8553)'
  type: main
- language: da
  script: Latn
  content: '2013/718/EU: Kommissionens gennemførelsesafgørelse af 4. december 2013
    om ændring af bilag I til beslutning 2004/211/EF for så vidt angår oplysningerne
    om Brasilien i listen over tredjelande og dele af tredjelande, hvorfra import
    til Unionen af levende dyr af hestefamilien samt sæd, æg og embryoner fra dyr
    af hestefamilien er tilladt, om ændring af bilag II D til beslutning 92/260/EØF
    for så vidt angår krav om prøve for snive og om ændring af beslutning 92/260/EØF,
    93/196/EØF og 93/197/EØF for så vidt angår visse geografiske betegnelser (meddelt
    under nummer C(2013) 8553)'
  type: main
- language: el
  script: Grek
  content: '2013/718/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 4ης Δεκεμβρίου 2013 , για την τροποποίηση
    του παραρτήματος I της απόφασης 2004/211/ΕΚ όσον
    αφορά την καταχώριση για τη Βραζιλία στον κατάλογο
    των τρίτων χωρών και των περιοχών τους από
    τις οποίες επιτρέπονται οι εισαγωγές ζώντων
    ιπποειδών και σπέρματος, ωαρίων και εμβρύων
