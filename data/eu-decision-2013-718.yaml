    του παραρτήματος II (Δ) της απόφασης 92/260/ΕΟΚ
    όσον αφορά τις απαιτήσεις δοκιμών για τη μάλι
    των ίππων και για την τροποποίηση των αποφάσεων
    92/260/ΕΟΚ, 93/196/ΕΟΚ και 93/197/ΕΟΚ όσον αφορά ορισμένες
    γεωγραφικές ονομασίες [κοινοποιηθείσα υπό
    τον αριθμό C(2013) 8553]'
  type: main
- language: et
  script: Latn
  content: '2013/718/EL: Komisjoni rakendusotsus, 4. detsember 2013 , millega muudetakse
    otsuse 2004/211/EÜ I lisa seoses Brasiilia kohta tehtud kandega loetelus, kuhu
    on kantud sellised kolmandad riigid ja nende osad, millest on lubatud tuua liitu
    elushobuslasi ning hobuslaste spermat, munarakke ja embrüoid, ning muudetakse
    otsuse 92/260/EMÜ II lisa punkti D seoses malleuse proovide nõuetega ning muudetakse
    otsuseid 92/260/EMÜ, 93/196/EMÜ ja 93/197/EMÜ seoses teatavate geograafiliste
    nimetustega (teatavaks tehtud numbri C(2013) 8553 all)'
  type: main
- language: fi
  script: Latn
  content: '2013/718/EU: Komission täytäntöönpanopäätös, annettu 4 päivänä
    joulukuuta 2013 , päätöksen 2004/211/EY liitteen I muuttamisesta siltä osin
    kuin on kyse Brasiliaa koskevasta kohdasta niiden kolmansien maiden ja kolmansien
    maiden osien luettelossa, joista elävien hevoseläinten ja hevoseläinten siemennesteen,
    munasolujen ja alkioiden tuonti unioniin on sallittua, päätöksen 92/260/ETY
    liitteessä II olevan D kohdan muuttamisesta räkätaudin testausvaatimusten osalta
    sekä päätösten 92/260/ETY, 93/196/ETY ja 93/197/ETY muuttamisesta tiettyjen
    maantieteellisten nimien osalta (tiedoksiannettu numerolla C(2013) 8553)'
  type: main
- language: hr
  script: Latn
  content: '2013/718/EU: Provedbena odluka Komisije оd 4. prosinca 2013. o izmjeni
    Priloga I. Odluci 2004/211/EZ u pogledu unosa za Brazil na popisu trećih zemalja
    i njihovih dijelova iz kojih je u Uniju dopušteno uvoziti žive kopitare i sjeme,
    jajne stanice i zametke kopitara, o izmjeni Priloga II.D Odluci 92/260/EEZ u pogledu
    zahtjeva za testiranje na maleus te o izmjeni odluka 92/260/EEZ, 93/196/EEZ i
    93/197/EEZ u pogledu određenih zemljopisnih naziva (priopćeno pod brojem dokumenta
    C(2013) 8553)'
  type: main
- language: hu
  script: Latn
  content: '2013/718/EU: A Bizottság végrehajtási határozata ( 2013. december
    4. ) a 2004/211/EK határozat I. mellékletének az élő lófélék és ezek
    spermájának, petesejtjének és embriójának az Európai Unióba történő
    behozatala tekintetében engedélyezett harmadik országok és országrészek
    jegyzékében a Brazíliára vonatkozó bejegyzés tekintetében történő módosításáról,
    a takonykórra vonatkozó vizsgálati követelmények tekintetében a 92/260/EGK
    határozat II. melléklet D. pontjának módosításáról, valamint a 92/260/EGK,
    a 93/196/EGK és a 93/197/EGK határozatnak bizonyos földrajzi elnevezések tekintetében
    történő módosításáról (az értesítés a C(2013) 8553. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2013/718/UE: Decisione di esecuzione della Commissione, del 4 dicembre
    2013 , che modifica l’allegato I della decisione 2004/211/CE per quanto riguarda
    la voce relativa al Brasile figurante nell’elenco dei paesi terzi e delle loro
    parti da cui sono autorizzate le importazioni nell’Unione di equidi vivi nonché
    di sperma, ovuli ed embrioni della specie equina, l’allegato II.D della decisione
    92/260/CEE per quanto riguarda le prescrizioni relative ai test della morva e
    le decisioni 92/260/CEE, 93/196/CEE e 93/197/CEE per quanto riguarda alcune denominazioni
    geografiche [notificata con il numero C(2013) 8553]'
  type: main
- language: lv
  script: Latn
  content: '2013/718/ES: Komisijas Īstenošanas lēmums ( 2013. gada 4. decembris
    ), ar ko groza Lēmuma 2004/211/EK I pielikumu attiecībā uz ierakstu par Brazīliju
    to trešo valstu un valstu daļu sarakstā, no kurām atļauj Savienībā ievest
    dzīvus zirgu dzimtas dzīvniekus, to spermu, olšūnas un embrijus, groza Lēmuma
    92/260/EEK II(D) pielikumu attiecībā uz testēšanas prasībām zirgu ļauno
    ienāšu noteikšanai un groza Lēmumu 92/260/EEK, 93/196/EEK un 93/197/EEK attiecībā
    uz konkrētiem ģeogrāfiskajiem nosaukumiem (izziņots ar dokumenta numuru C(2013)
    8553)'
  type: main
- language: lt
  script: Latn
  content: '2013/718/ES: 2013 m. gruodžio 4 d. Komisijos įgyvendinimo sprendimas,
    kuriuo dėl Brazilijos įrašo trečiųjų šalių ar jų dalių, iš kurių į
    Sąjungą leidžiama importuoti gyvus arklinių šeimos gyvūnus ir arklinių
    šeimos gyvūnų spermą, kiaušialąstes ir embrionus, sąraše iš dalies keičiamas
    Sprendimo 2004/211/EB I priedas, dėl įnosių ligos tyrimo reikalavimų iš dalies
    keičiama Sprendimo 92/260/EEB II priedo D dalis ir dėl tam tikrų geografinių
    nuorodų iš dalies keičiami sprendimai 92/260/EEB, 93/196/EEB ir 93/197/EEB
    (pranešta dokumentu Nr. C(2013) 8553)'
  type: main
- language: mt
  script: Latn
  content: '2013/718/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tal- 4
    ta’ Diċembru 2013 li temenda l-Anness I tad-Deċiżjoni 2004/211/KE fir-rigward
    tal-entrata għall-Brażil fil-lista ta’ pajjiżi terzi u ta’ partijiet mit-territorju
    tagħhom li minnhom hija awtorizzata l-introduzzjoni fl-Unjoni ta’ ekwidi ħajjin
    u ta’ semen, ova u embrijuni tal-ispeċi ekwina, u li temenda l-Anness II(D)
    tad-Deċiżjoni 92/260/KEE fir-rigward tar-rekwiżiti tat-test għall-glanders,
    u li temenda d-Deċiżjonijiet 92/260/KEE, 93/196/KEE u 93/197/KEE fir-rigward
    ta’ ċerti denominazzjonijiet ġeografiċi (notifikata bid-dokument C(2013)
    8553)'
  type: main
- language: nl
  script: Latn
  content: '2013/718/EU: Uitvoeringsbesluit van de Commissie van 4 december 2013 tot
    wijziging van bijlage I bij Beschikking 2004/211/EG wat betreft de gegevens voor
    Brazilië in de lijst van derde landen en delen daarvan waaruit de invoer in de
    Unie van levende paardachtigen en sperma, eicellen en embryo’s van paarden is
    toegestaan, tot wijziging van bijlage II, onder D, bij Beschikking 92/260/EEG
    wat betreft testvoorschriften voor kwade droes, en tot wijziging van de Beschikkingen
    92/260/EEG, 93/196/EEG en 93/197/EEG wat betreft bepaalde geografische aanduidingen
    (Kennisgeving geschied onder nummer C(2013) 8553)'
  type: main
- language: pl
  script: Latn
  content: '2013/718/UE: Decyzja wykonawcza Komisji z dnia 4 grudnia 2013 r. zmieniająca
    załącznik I do decyzji 2004/211/WE w odniesieniu do wpisu dotyczącego Brazylii
    w wykazie państw trzecich oraz części ich terytorium, z których dopuszczony
    jest przywóz do Unii żywych zwierząt z rodziny koniowatych oraz nasienia, komórek
    jajowych i zarodków koni, zmieniająca część D załącznika II do decyzji
    92/260/EWG w odniesieniu do wymagań w zakresie badań dotyczących nosacizny
    oraz zmieniająca decyzje 92/260/EWG, 93/196/EWG i 93/197/EWG w odniesieniu do
    niektórych nazw geograficznych (notyfikowana jako dokument nr C(2013) 8553)'
  type: main
- language: pt
  script: Latn
  content: '2013/718/UE: Decisão de Execução da Comissão, de 4 de dezembro de
    2013 , que altera o anexo I da Decisão 2004/211/CE no que se refere à entrada
    relativa ao Brasil na lista de países terceiros e partes dos seus territórios
    a partir dos quais são autorizadas as importações para a União de equídeos
    vivos e sémen, óvulos e embriões de equídeos, que altera o anexo II, parte
    D, da Decisão 92/260/CEE no que se refere aos requisitos de teste para a deteção
    do mormo e que altera as Decisões 92/260/CEE, 93/196/CEE e 93/197/CEE no que
    se refere a determinadas denominações geográficas [notificada com o número
    C(2013) 8553]'
  type: main
- language: ro
  script: Latn
  content: '2013/718/UE: Decizia de punere în aplicare a Comisiei din 4 decembrie
    2013 de modificare a anexei I la Decizia 2004/211/CE în ceea ce privește rubrica
    referitoare la Brazilia din lista țărilor terțe și a părților acestora din
    care sunt autorizate importuri în Uniune de ecvidee vii și de material seminal,
    de ovule și de embrioni din specia ecvină, de modificare a punctului (D) din
    anexa II la Decizia 92/260/CEE în ceea ce privește testele pentru depistarea
    morvei și de modificare a Deciziilor 92/260/CEE, 93/196/CEE și 93/197/CEE în
    ceea ce privește anumite denumiri geografice [notificată cu numărul C(2013)
    8553]'
  type: main
- language: sk
  script: Latn
  content: '2013/718/EÚ: Vykonávacie rozhodnutie Komisie zo 4. decembra 2013 , ktorým
    sa mení príloha I k rozhodnutiu 2004/211/ES, pokiaľ ide o položku pre Brazíliu
    v zozname tretích krajín a ich častí, z ktorých je povolený dovoz živých
    zvierat koňovitých a spermy, vajíčok a embryí druhov koňovitých do Únie,
    ktorým sa mení časť D prílohy II k rozhodnutiu 92/260/EHS, pokiaľ ide o
    požiadavky testovania na sopľavku, a ktorým sa menia rozhodnutia 92/260/EHS,
    93/196/EHS a 93/197/EHS, pokiaľ ide o určité zemepisné názvy [oznámené
    pod číslom C(2013) 8553]'
  type: main
- language: sl
  script: Latn
  content: '2013/718/EU: Izvedbeni sklep Komisije z dne 4. decembra 2013 o spremembi
    Priloge I k Odločbi 2004/211/ES glede vnosa za Brazilijo na seznam tretjih držav
    in njihovih delov, iz katerih je dovoljen uvoz živih enoprstih kopitarjev ter
    njihovega semena, jajčnih celic in zarodkov v Unijo, o spremembi Priloge II(D)
    k Odločbi 92/260/EGS glede zahtev za testiranje smrkavosti ter o spremembi odločb
    92/260/EGS, 93/196/EGS in 93/197/EGS glede nekaterih geografskih označb (notificirano
    pod dokumentarno številko C(2013) 8553)'
  type: main
- language: es
  script: Latn
  content: '2013/718/UE: Decisión de Ejecución de la Comisión, de 4 de diciembre
    de 2013 , por la que se modifica el anexo I de la Decisión 2004/211/CE en lo
    que respecta a la entrada correspondiente a Brasil en la lista de terceros países
    y partes de su territorio a partir de los cuales los Estados miembros autorizan
    la importación de équidos vivos y esperma, óvulos y embriones de la especie
    equina, se modifica el anexo II, letra D, de la Decisión 92/260/CEE en cuanto
    a los requisitos de ensayo para la detección del muermo, y se modifican las Decisiones
    92/260/CEE, 93/196/CEE y 93/197/CEE en lo relativo a determinadas denominaciones
    geográficas [notificada con el número C(2013) 8553]'
  type: main
- language: sv
  script: Latn
  content: '2013/718/EU: Kommissionens genomförandebeslut av den 4 december 2013
    om ändring av bilaga I till beslut 2004/211/EG vad gäller posten för Brasilien
    i förteckningen över tredjeländer eller delar av tredjeländer från vilka
    det är tillåtet att till unionen föra in levande hästdjur och sperma, ägg
    och embryon från hästdjur, om ändring av bilaga II D till beslut 92/260/EEG
    vad gäller testkrav för rots, och om ändring av besluten 92/260/EEG, 93/196/EEG
    och 93/197/EEG vad gäller vissa geografiska beteckningar [delgivet med nr C(2013)
    8553]'
