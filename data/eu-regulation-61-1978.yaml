id: EURegulation611978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 61/78 of 12 January 1978 re-establishing
    the levying of the customs duties on knives with cutting blades, serrated or not
    (including pruning knives), other than knives falling within heading No 82.06,
    falling within heading No ex 82.09, originating in South Korea to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 61/78 de la Commission, du 12 janvier 1978, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    à lame dentelée (y compris les serpettes fermantes), autres que les couteaux
    du n° 82.06, de la position tarifaire EX 82.09, originaires de Corée du Sud,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 61/78 der Kommission vom 12. Januar 1978 zur Wiedereinführung
    des Zollsatzes für Messer, andere als Messer der Tarifnummer 82.06, mit schneidender
    oder gezahnter Klinge (einschließlich Klappmesser für den Gartenbau), der Tarifnummer
    ex 82.09, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 61/78 af 12. januar 1978 om genindførelse
    af opkrævning af toldafgifter for knive, der ikke henhører under nogen anden
    position i dette kapitel, med skærende eller savtakket æg (herunder beskæreknive),
    under position ex 82.09, som har oprindelse i Svdkorea og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 61/78 della Commissione, del 12 gennaio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante
    o dentata (compresi i roncoli chiudibili), diversi da quelli della voce 82.06,
    della voce doganale ex 82.09, originari della Corea del Sud, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 61/78 van de Commissie van 12 januari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op messen met
    snijdend lemmet, ook indien getand (andere dan die bedoeld bij post 82.06, doch
    zaksnoeimessen daaronder begrepen), van post ex 82.09, van oorsprong uit Zuid-Korea,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
