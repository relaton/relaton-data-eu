    su 48 V/12 V DC/DC keitikliu, skirto naudoti įprastu degimo varikliu varomuose
    ir tam tikruose hibridiniuose lengvuosiuose automobiliuose, technologijos patvirtinimo
    kaip naujoviškos lengvųjų automobilių išmetamo CO2 kiekio mažinimo technologijos
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 443/2009
  type: main
