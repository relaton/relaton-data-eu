    (BRM) плюс преобразувател на постоянен в постоянен
    ток (48V/12V) на SEG Automotive Germany GmbH за леки пътнически
    автомобили с конвенционален двигател с вътрешно
    горене и определени леки пътнически автомобили
    с хибридно захранване, като иновативна технология
    за намаляване на емисиите на CO2 от леки пътнически
    автомобили съгласно Регламент (ЕО) № 443/2009 на
    Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/314 ze dne 21. února 2019 o
    schválení technologie použité ve vysoce účinném 48-voltovém motorgenerátoru
    (BRM) společnosti SEG Automotive Germany GmbH ve spojení se 48 V/12 V DC/DC
    měničem pro použití v konvenčních spalovacích motorech a některých hybridních
    osobních automobilech jako inovativní technologie pro snižování emisí CO2
    z osobních automobilů podle nařízení Evropského parlamentu a Rady (ES) č.
    443/2009
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/314 af 21. februar 2019
