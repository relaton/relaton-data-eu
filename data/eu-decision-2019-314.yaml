title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/314 of 21 February 2019 on the
    approval of the technology used in SEG Automotive Germany GmbH High efficient
    48V motor generator (BRM) plus 48V/12V DC/DC converter for use in conventional
    combustion engine and certain hybrid powered passenger cars as an innovative technology
    for reducing CO2 emissions from passenger cars pursuant to Regulation (EC) No
    443/2009 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/314 de la Commission du 21 février 2019
    relative à l'approbation de la technologie utilisée dans l'alternodémarreur
    48 V à haut rendement (BRM) plus convertisseur 48V/12V CC/CC de SEG Automotive
    Germany GmbH, destiné à être utilisé dans les voitures particulières à moteur
    à combustion classique et dans certaines voitures particulières à motorisation
    hybride, en tant que technologie innovante permettant de réduire les émissions
    de CO2 des voitures particulières conformément au règlement (CE) n° 443/2009
    du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/314 der Kommission vom 21. Februar 2019
    zur Genehmigung der im hocheffizienten 48-Volt-Motorgenerator (BRM) mit 48V/12V-Gleichspannungswandler
    der SEG Automotive Germany GmbH für Personenkraftwagen mit konventionellem Verbrennungsmotorantrieb
    und bestimmte Personenkraftwagen mit Hybridantrieb verwendeten Technologie als
    innovative Technologie zur Verringerung der CO2-Emissionen von Personenkraftwagen
    gemäß der Verordnung (EG) Nr. 443/2009 des Europäischen Parlaments und des
    Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/314 на Комисията
    от 21 февруари 2019 година за одобряване на технологията,
