    hyväksymisestä innovatiiviseksi teknologiaksi henkilöautojen hiilidioksidipäästöjen
    vähentämiseksi Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 443/2009
    mukaisesti
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/314 оd 21. veljače 2019. o odobrenju
