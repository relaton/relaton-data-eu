    való használatra szánt, az SEG Automotive Germany GmbH által kifejlesztett,
    nagy hatékonyságú 48 V-os motorgenerátorból (BRM) és 48 V/12 V-os DC/DC-átalakítóból
    álló berendezéscsomagban alkalmazott technológiának a 443/2009/EK európai
    parlamenti és tanácsi rendelet alapján a személygépkocsik CO2-kibocsátásának
    csökkentésére szolgáló innovatív technológiaként történő jóváhagyásáról
  type: main
- language: it
  script: Latn
