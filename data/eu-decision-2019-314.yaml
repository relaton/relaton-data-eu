    s istosmjernim pretvaračem 48 V/12 V dobavljača SEG Automotive Germany GmbH
    za upotrebu u osobnim automobilima s konvencionalnim motorima s unutarnjim izgaranjem
    i određenim osobnim automobilima na hibridni pogon kao inovativne tehnologije
    za smanjenje emisija CO2 iz osobnih automobila u skladu s Uredbom (EZ) br. 443/2009
    Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/314 végrehajtási határozata (2019. február 21.)
