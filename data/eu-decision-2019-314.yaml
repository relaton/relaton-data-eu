    højeffektive 48 V-motorgenerator (BRM) med 48 V/12 V-jævnstrømsomformer til
    brug i personbiler med konventionel forbrændingsmotor og visse personbiler med
    hybridmotor, som en innovativ teknologi til reduktion af CO2-emissioner fra personbiler
    i henhold til Europa-Parlamentets og Rådets forordning (EF) nr. 443/2009
  type: main
- language: el
  script: Grek
