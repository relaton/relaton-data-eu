- language: en
  script: Latn
  content: Regulation (EU) 2017/2395 of the European Parliament and of the Council
    of 12 December 2017 amending Regulation (EU) No 575/2013 as regards transitional
    arrangements for mitigating the impact of the introduction of IFRS 9 on own funds
    and for the large exposures treatment of certain public sector exposures denominated
    in the domestic currency of any Member State
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/2395 du Parlement européen et du Conseil du 12 décembre
    2017 modifiant le règlement (UE) no 575/2013 en ce qui concerne les dispositions
    transitoires prévues pour atténuer les incidences de l'introduction de la norme
    IFRS 9 sur les fonds propres et pour le traitement des grands risques de certaines
    expositions du secteur public libellées dans la monnaie nationale de tout État
    membre
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2017/2395 des Europäischen Parlaments und des Rates vom
    12. Dezember 2017 zur Änderung der Verordnung (EU) Nr. 575/2013 in Bezug auf
    Übergangsbestimmungen zur Verringerung der Auswirkungen der Einführung des IFRS
    9 auf die Eigenmittel und zur Behandlung von bestimmten auf die Landeswährung
    eines Mitgliedstaats lautenden Risikopositionen gegenüber dem öffentlichen Sektor
    als Großkredite
  type: main
- language: bg
  script: Cyrl
