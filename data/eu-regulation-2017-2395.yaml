  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2017/2395, 12. detsember 2017,
    millega muudetakse määrust (EL) nr 575/2013 seoses üleminekukorraga, et leevendada
    rahvusvahelise finantsaruandlusstandardi (IFRS) 9 kasutuselevõtu mõju omavahenditele
    ja seoses üleminekukorraga, mis käsitleb riskide kontsentreerumise sätete kohaldamist
    ükskõik millise liikmesriigi omavääringus nomineeritud teatavatele avaliku
    sektori suhtes võetavatele riskipositsioonidele
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2017/2395, annettu 12 päivänä
    joulukuuta 2017, asetuksen (EU) N:o 575/2013 muuttamisesta siirtymäjärjestelyillä,
    jotka koskevat IFRS 9 -standardin käyttöönotolla omiin varoihin olevan vaikutuksen
    lieventämistä ja suuria asiakasriskejä koskevien säännösten soveltamista
    tiettyihin jonkin jäsenvaltion valuutan määräisiin julkisen sektorin vastuisiin
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2017/2395 ó Pharlaimint na hEorpa agus ón gComhairle
    an 12 Nollaig 2017 lena leasaítear Rialachán (AE) Uimh. 575/2013 maidir leis
    na socruithe idirthréimhseacha leis an tionchar a bheidh ag tabhairt isteach
    IFRS 9 ar chistí dílse a mhaolú agus le haghaidh láimhseáil neamhchosaintí
    móra i gcás neamhchosaintí áirithe san earnáil phoiblí atá ainmnithe in
    airgeadra intíre Ballstáit ar bith
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2017/2395 Europskog parlamenta i Vijeća od 12. prosinca 2017.
    o izmjeni Uredbe (EU) br. 575/2013 u pogledu prijelaznih uređenja za ublažavanje
    učinka uvođenja MSFI-ja 9 na regulatorni kapital te za tretman velikih izloženosti
    u slučaju određenih izloženosti javnog sektora koje su nominirane u domaćoj
    valuti bilo koje države članice
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2017/2395 rendelete (2017. december
    12.) az 575/2013/EU rendeletnek az IFRS 9 nemzetközi pénzügyi beszámolási
    standard bevezetése által a szavatolótőkére gyakorolt hatás enyhítésére,
    valamint egyes, a közszektorral szembeni, bármely tagállam pénznemében denominált
    kitettségek nagykockázat-vállalásként való kezelésére szolgáló átmeneti
    intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2017/2395 del Parlamento europeo e del Consiglio, del
    12 dicembre 2017, che modifica il regolamento (UE) n. 575/2013 per quanto riguarda
    le disposizioni transitorie volte ad attenuare l'impatto dell'introduzione dell'IFRS
    9 sui fondi propri e per il trattamento delle grandi esposizioni di talune esposizioni
    del settore pubblico denominate nella valuta nazionale di uno Stato membro
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2017/2395 (2017. gada 12. decembris),
    ar ko Regulu (ES) Nr. 575/2013 groza attiecībā uz pārejas kārtību tam, lai
    mazinātu 9. SFPS ieviešanas ietekmi uz pašu kapitālu, un lielo riska darījumu
    regulējumam noteiktiem publiskā sektora riska darījumiem, kuri denominēti
    jebkuras dalībvalsts vietējā valūtā
  type: main
- language: lt
  script: Latn
  content: 2017 m. gruodžio 12 d. Europos Parlamento ir Tarybos reglamentas (ES)
    2017/2395, kuriuo iš dalies keičiamos Reglamento (ES) Nr. 575/2013 nuostatos,
    susijusios su pereinamojo laikotarpio nuostatomis, skirtomis poveikiui nuosavoms
    lėšoms dėl 9-ojo TFAS įvedimo mažinti ir didelių pozicijų tvarkos, taikomos
    tam tikroms viešojo sektoriaus pozicijoms, išreikštoms bet kurios valstybės
    narės nacionaline valiuta, taikymo poveikiui mažinti
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2017/2395 tal-Parlament Ewropew u tal-Kunsill tat-12 ta’
    Diċembru 2017 li jemenda r-Regolament (UE) Nru 575/2013 fir-rigward ta' arranġamenti
    transizzjonali biex jittaffa l-impatt tal-introduzzjoni tal-IFRS 9 fuq il-fondi
    proprji u għat-trattament tal-iskoperturi l-kbar ta' ċerti skoperturi fis-settur
    pubbliku denominati fil-munita domestika ta' kwalunkwe Stat Membru
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2017/2395 van het Europees Parlement en de Raad van 12
    december 2017 tot wijziging van Verordening (EU) nr. 575/2013 wat betreft de overgangsregelingen
    ter beperking van de gevolgen van de invoering van IFRS 9 voor het eigen vermogen
    en ter behandeling als grote risicoblootstellingen van blootstellingen met betrekking
    tot bepaalde overheidsinstanties welke in de nationale valuta van een lidstaat
    luiden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/2395 z dnia 12
    grudnia 2017 r. zmieniające rozporządzenie (UE) nr 575/2013 w odniesieniu do
    rozwiązań przejściowych dotyczących złagodzenia wpływu wprowadzenia MSSF
    9 na fundusze własne oraz dotyczących traktowania jako duże ekspozycje niektórych
    ekspozycji wobec podmiotów sektora publicznego denominowanych w walucie krajowej
    dowolnego państwa członkowskiego
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2017/2395 do Parlamento Europeu e do Conselho, de 12 de
    dezembro de 2017, que altera o Regulamento (UE) n.o 575/2013 no que diz respeito
    um regime transitório para reduzir o impacto da introdução da IFRS 9 sobre
    os fundos próprios e para o tratamento dos grandes riscos de determinadas posições
    em risco do setor público expressas na moeda nacional de qualquer Estado-Membro
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2017/2395 al Parlamentului European și al Consiliului
    din 12 decembrie 2017 de modificare a Regulamentului (UE) nr. 575/2013 în ceea
    ce privește măsurile tranzitorii pentru diminuarea impactului asupra fondurilor
    proprii al introducerii IFRS 9 și pentru tratamentul expunerilor mari al anumitor
    expuneri din sectorul public denominate în moneda națională a oricărui stat
    membru
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2017/2395 z 12. decembra
    2017, ktorým sa mení nariadenie (EÚ) č. 575/2013, pokiaľ ide o prechodné
    dojednania na zmiernenie vplyvu zavedenia IFRS 9 na vlastné zdroje a vplyvu zaobchádzania
    s veľkou majetkovou angažovanosťou v prípade expozícií voči niektorým
    subjektom verejného sektora denominovaných v domácej mene ktoréhokoľvek členského
    štátu
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2017/2395 Evropskega parlamenta in Sveta z dne 12. decembra
    2017 o spremembi Uredbe (EU) št. 575/2013 glede prehodne ureditve za zmanjšanje
    učinka uvedbe MSRP 9 na kapital in za obravnavo določenih izpostavljenosti do
    javnega sektorja, denominiranih v domači valuti katere koli države članice,
    za namen velikih izpostavljenosti
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2017/2395 del Parlamento Europeo y del Consejo, de 12 de
    diciembre de 2017, por el que se modifica el Reglamento (UE) n.o 575/2013 en lo
    referente a las disposiciones transitorias para mitigar el impacto de la introducción
    de la NIIF 9 en los fondos propios y para el tratamiento de las grandes exposiciones
    correspondiente a determinadas exposiciones del sector público denominadas en
    la moneda nacional de cualquier Estado miembro
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2017/2395 av den 12 december
    2017 om ändring av förordning (EU) nr 575/2013 vad gäller övergångsarrangemang
    för att mildra inverkan på kapitalbasen av införandet av IFRS 9 och för hanteringen
    av vissa av den offentliga sektorns exponeringar uttryckta i en medlemsstats nationella
    valuta som stora exponeringar
