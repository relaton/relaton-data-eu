    и на Съвета от 12 декември 2017 година за изменение
    на Регламент (ЕС) № 575/2013 по отношение на преходните
    мерки за смекчаване на въздействието от въвеждането
    на МСФО 9 спрямо собствения капитал и за третирането
    като големи експозиции на някои експозиции
    в публичния сектор, деноминирани в местната
    валута на която и да е държава членка
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2017/2395 ze dne 12. prosince
    2017, kterým se mění nařízení (EU) č. 575/2013, pokud jde o přechodná
    opatření pro zmírnění dopadu zavedení IFRS 9 na kapitál a pro zacházení
    s některými expozicemi vůči subjektům veřejného sektoru denominovanými
    v národní měně kteréhokoli členského státu jako s velkými expozicemi
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2017/2395 af 12. december
    2017 om ændring af forordning (EU) nr. 575/2013 for så vidt angår overgangsordninger
    for afbødning af virkningen af indførelsen af IFRS 9 på kapitalgrundlaget og
    for behandlingen af eksponeringer mod visse offentlige enheder, der er denomineret
    i en hvilken som helst medlemsstats valuta, som store eksponeringer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2017/2395 του Ευρωπαϊκού Κοινοβουλίου
