title:
- language: en
  script: Latn
  content: Commission Directive 1999/97/EC of 13 December 1999 amending Council Directive
    95/21/EC concerning the enforcement, in respect of shipping using Community ports
    and sailing in the waters under the jurisdiction of the Member States, of international
    standards for ship safety, pollution prevention and shipboard living and working
    conditions (port State control)
  type: main
- language: fr
  script: Latn
  content: Directive 1999/97/CE de la Commission, du 13 décembre 1999, portant modification
    de la directive 95/21/CE concernant l'application aux navires faisant escale dans
    les ports de la Communauté ou dans les eaux relevant de la juridiction des États
    membres des normes internationales relatives à la sécurité maritime, à la
    prévention de la pollution et aux conditions de vie et de travail à bord des
    navires (contrôle par l'État du port)
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/97/EG der Kommission vom 13. Dezember 1999 zur Änderung
    der Richtlinie 95/21/EG des Rates zur Durchsetzung internationaler Normen für
    die Schiffssicherheit, die Verhütung von Verschmutzung und die Lebens- und Arbeitsbedingungen
    an Bord von Schiffen, die Gemeinschaftshäfen anlaufen und in Hoheitsgewässern
    der Mitgliedstaaten fahren (Hafenstaatkontrolle)
  type: main
- language: bg
  script: Cyrl
  content: Директива 1999/97/ЕО на Комисията от 13 декември
    1999 година за изменение на Директива 95/21/ЕО на
    Съвета относно прилагането по отношение на
    кораби, които използват пристанищата на Общността
    и плават във водите под юрисдикцията на държавите-членки,
    на международните стандарти за безопасност
    на корабоплаването, предотвратяване на замърсяването
    и условията на живот и работа на борда на корабите
    (Държавен пристанищен контрол)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 1999/97/ES ze dne 13. prosince 1999, kterou se mění
    směrnice Rady 95/21/ES o uplatňování mezinárodních norem pro bezpečnost
    lodí, zabránění znečištění a životní a pracovní podmínky na lodích,
    které využívají přístavy Společenství a plují ve výsostných vodách
    členských států (státní přístavní inspekce)
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 1999/97/EF af 13. december 1999 om ændring af Rådets
    direktiv 95/21/EF om håndhævelse over for skibe, der anløber Fællesskabets
    havne og sejler i farvande under medlemsstaternes jurisdiktion, af internationale
    standarder for skibes sikkerhed, for forureningsforebyggelse samt for leve- og
    arbejdsvilkår om bord (havnestatskontrol)
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/97/ΕΚ της Επιτροπής, της 13ης Δεκεμβρίου
    1999, που αφορά την τροποποίηση της οδηγίας 95/21/ΕΚ
    του Συμβουλίου για την επιβολή, σχετικά με
    τη ναυσιπλοΐα που συνεπάγεται χρήση κοινοτικών
    λιμένων ή διέλευση από ύδατα υπό τη δικαιοδοσία
    κράτους μέλους, των διεθνών προτύπων για την
    ασφάλεια των πλοίων, την πρόληψη της ρύπανσης
    και τις συνθήκες διαβίωσης και εργασίας επί
    των πλοίων (έλεγχος του κράτους του λιμένα)
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 1999/97/EÜ, 13. detsember 1999, millega muudetakse
    nõukogu direktiivi 95/21/EÜ laevaohutust, reostuse vältimist ning elu- ja töötingimusi
    laevadel käsitlevate rahvusvaheliste standardite rakendamise kohta ühenduse
    sadamaid kasutavate ja liikmesriikide jurisdiktsiooni all olevates vetes sõitvate
    laevade suhtes (sadamariigi kontroll)
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 1999/97/EY, annettu 13 päivänä joulukuuta 1999,
    alusturvallisuutta, saastumisen ehkäisemistä ja alusten asumis- ja työskentelyolosuhteita
    koskevien kansainvälisten standardien soveltamisesta yhteisön satamia käyttäviin
    ja jäsenmaiden lainkäyttövaltaan kuuluvilla vesillä purjehtiviin aluksiin
    (satamavaltioiden suorittama valvonta) annetun neuvoston direktiivin 95/21/EY
    muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1999/97/EK irányelve (1999. december 13.) a Közösség kikötőiben
    és a tagállamok felségvizein történő hajózás tekintetében a hajózás
    biztonságára, a környezetszennyezés megelőzésére és a fedélzeti élet-
    és munkakörülményekre vonatkozó nemzetközi előírások végrehajtásáról
    (kikötő szerinti illetékes állam hatósága által végzett ellenőrzés)
    szóló 95/21/EK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/97/CE della Commissione, del 13 dicembre 1999, che modifica
    la direttiva 95/21/CE del Consiglio relativa all'attuazione di norme internazionali
    per la sicurezza delle navi, la prevenzione dell'inquinamento e le condizioni
    di vita e di lavoro a bordo per le navi che approdano nei porti comunitari e che
    navigano nelle acque sotto la giurisdizione degli Stati membri (controllo dello
    Stato di approdo)
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 1999/97/EK (1999. gada 13. decembris), ar kuru groza
    Padomes Direktīvu 95/21/EK, kas nosaka, kā kuģošanai Kopienas ostās un dalībvalstu
    jurisdikcijai pakļautos ūdeņos piemērot starptautiskos standartus attiecībā
    uz kuģu drošību, piesārņojuma novēršanu un dzīves un darba apstākļiem
    uz kuģiem (ostas valsts kontrole)
  type: main
- language: lt
  script: Latn
  content: 1999 m. gruodžio 13 d. Komisijos direktyva 1999/97/EB iš dalies pakeičianti
    Direktyvą 95/21/EB dėl laivo saugumo, taršos prevencijos ir darbo bei gyvenimo
    sąlygų laivuose tarptautinių standartų taikymo laivams, atplaukiantiems į
    Bendrijos uostus ir plaukiojantiems valstybių narių jurisdikcijai priklausančiuose
    vandenyse (uosto valstybės kontrolė)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 1999/97/KE tat-13 ta' Diċembru 1999 li temenda
    d-Direttiva tal-Kunsill 95/21/KE li tikkonċerna l-infurzar, fir-rigward ta' bastimenti
    li jużaw l-portijiet tal-Komunità u li jbaħħru fl-ibħra taħt il-ġurisdizzjoni
    ta' l-Istati Membri, ta' standards internazzjonali għas-sigurtà tal-bastimenti,
    għall-prevenzjoni ta' tniġġis u għall-kondizzjonijiet ta' l-għajxien u tax-xogħol
    abbord (kontroll portwali ta' l-Istat)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/97/EG van de Commissie van 13 december 1999 houdende wijziging
    van Richtlijn 95/21/EG van de Raad betreffende de naleving, met betrekking tot
    de schepen die gebruik maken van havens in de Gemeenschap en varen in de onder
    de jurisdictie van de lidstaten vallende wateren, van internationale normen op
    het gebied van de veiligheid van schepen, voorkoming van verontreiniging en leef-
    en werkomstandigheden aan boord (havenstaatcontrole)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 1999/97/WE z dnia 13 grudnia 1999 r. zmieniająca dyrektywę
    Rady 95/21/WE dotyczącą przestrzegania, w odniesieniu do żeglugi morskiej korzystającej
    ze wspólnotowych portów oraz żeglugi morskiej po wodach znajdujących się
    pod jurysdykcją Państw Członkowskich, międzynarodowych norm bezpieczeństwa
    statków i zapobiegania zanieczyszczeniom oraz pokładowych warunków życia i
    pracy (kontrola państwa portu)
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/97/CE da Comissão, de 13 de Dezembro de 1999, que altera
    a Directiva 95/21/CE do Conselho relativa à aplicação, aos navios que escalem
    os portos da Comunidade ou naveguem em águas sob jurisdição dos Estados-Membros,
    das normas internacionais respeitantes à segurança da navegação, à prevenção
    da poluição e às condições de vida e de trabalho a bordo dos navios (inspecção
    pelo Estado do porto)
  type: main
- language: ro
  script: Latn
  content: Directiva 1999/97/CE a Comisiei din 13 decembrie 1999 de modificare a Directivei
    95/12/CE a Consiliului privind aplicarea la navele care fac escală în porturile
    Comunității sau în apele aflate sub jurisdicția statelor membre a normelor
    internaționale referitoare la securitatea maritimă, la prevenirea poluării
    și la condițiile de viață și de muncă la bordul navelor (controlul statului
    de port)
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 1999/97/ES z 13. decembra 1999, ktorou sa mení a dopĺňa
    smernica Rady 95/21/ES týkajúca sa presadzovania medzinárodných štandardov
    pre bezpečnosť lodí, ochranu proti znečisteniu a životné a pracovné podmienky
    na lodiach (prístavná štátna kontrola) vzhľadom na lodnú prepravu, ktorá
    využíva prístavy spoločenstva a plaví sa vo vodách pod jurisdikciou členských
    štátov
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 1999/97/ES z dne 13. decembra 1999 o spremembi Direktive
    Sveta 95/21/ES o uveljavitvi mednarodnih standardov za varnost ladij, preprečevanje
    onesnaževanja ter pogoje za življenje in delo na ladjah, ki uporabljajo pristanišča
    Skupnosti in plujejo v vodah v pristojnosti držav članic (pomorska inšpekcija)
  type: main
- language: es
  script: Latn
  content: Directiva 1999/97/CE de la Comisión, de 13 de diciembre de 1999, por la
    que se modifica la Directiva 95/21/CE del Consejo sobre el cumplimiento de las
    normas internacionales de seguridad marítima, prevención de la contaminación
    y condiciones de vida y de trabajo a bordo, por parte de los buques que utilicen
    los puertos comunitarios o las instalaciones situadas en aguas bajo jurisdicción
    de los Estados miembros (control del Estado del puerto)
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 1999/97/EG av den 13 december 1999 om ändring av
    rådets direktiv 95/21/EG om tillämpning av internationella normer för säkerhet
    på fartyg, förhindrande av förorening samt boende- och arbetsförhållanden
    ombord på fartyg som anlöper gemenskapens hamnar och framförs i medlemsstaternas
    territorialvatten (hamnstatskontroll)
