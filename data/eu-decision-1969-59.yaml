  content: Décision du Conseil du 28 janvier 1969, autorisant la tacite reconduction
    au-delà de la période transitoire de certains accords commerciaux conclus par
    les États membres avec les pays tiers
  type: main
- language: de
  script: Latn
  content: '69/59/EWG: Entscheidung des Rates vom 28. Januar 1969 zur Genehmigung
    der stillschweigenden Verlängerung bestimmter, zwischen den Mitgliedstaaten und
    dritten Ländern geschlossener Handelsabkommen über die Übergangszeit hinaus'
  type: main
- language: it
  script: Latn
  content: '69/59/CEE: Decisione del Consiglio, del 28 gennaio 1969, che autorizza
    la proroga tacita oltre la fine del periodo transitorio di taluni accordi commerciali
    stipulati dagli Stati membri coi paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '69/59/EEG: Beschikking van de Raad van 28 januari 1969 houdende machtiging
    tot stilzwijgende verlenging tot na de overgangsperiode van bepaalde handelsakkoorden
    welke door de Lid-Staten met derde landen zijn gesloten'
