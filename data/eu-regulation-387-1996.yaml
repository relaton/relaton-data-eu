title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 387/96 of 1 March 1996 amending Regulations
    (EEC) No 2698/93 and (EC) No 1590/94 and fixing the quantities available in the
    pigmeat sector for the period 1 April to 30 June 1996 under the Community tariff
    quotas provided for in the Europe Agreements pursuant to Council Regulation (EC)
    No 3066/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 387/96 de la Commission, du 1er mars 1996, modifiant
    les règlements (CEE) n 2698/93 et (CE) n 1590/94, et fixant les quantités disponibles
    dans le secteur de la viande de porc, pour la période du 1er avril au 30 juin
    1996, dans le cadre des contingents tarifaires communautaires prévus par les
    accords européens, conformément au règlement (CE) n 3066/95 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 387/96 der Kommission vom 1. März 1996 zur Änderung
    der Verordnungen (EWG) Nr. 2698/93 und (EG) Nr. 1590/94 und zur Festsetzung der
    im Sektor Schweinefleisch für den Zeitraum 1. April bis 30. Juni 1996 im Rahmen
    der in den Europa-Abkommen vorgesehenen gemeinschaftlichen Zollkontingente gemäß
    der Verordnung (EG) Nr. 3066/95 des Rates verfügbaren Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 387/96 af 1. marts 1996 om ændring af
    forordning (EØF) nr. 2698/93 og (EF) nr. 1590/94 og om fastsættelse af de mængder,
    der er til rådighed i svinekødssektoren for perioden fra den 1. april til den
    30. juni 1996 i forbindelse med de EF- toldkontingenter, der er fastsat i Europaaftalerne,
    jf. Rådets forordning (EF) nr. 3066/95
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 387/96 της Επιτροπής,
    της 1ης Μαρτίου 1996, για τροποποίηση των κανονισμών
    (ΕΟΚ) αριθ. 2698/93 και (ΕΚ) αριθ. 1590/94 καθώς και τον
    καθορισμό των διαθέσιμων ποσοτήτων στον τομέα
    του χοιρείου κρέατος, για την περίοδο από 1ης
    Απριλίου έως 30 Ιουνίου 1996, στο πλαίσιο των κοινοτικών
    δασμολογικών ποσοστώσεων που προβλέπονται
    από τις ευρωπαϊκές συμφωνίες σύμφωνα με τον
    κανονισμό (ΕΚ) αριθ. 3066/95 του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 387/96, annettu 1 päivänä maaliskuuta 1996,
    asetusten (ETY) N:o 2698/93 ja (EY) N:o 1590/94 muuttamisesta ja neuvoston asetuksen
    (EY) N:o 3066/95 mukaisesti Eurooppa-sopimuksissa määrättyjen yhteisön tariffikiintiöiden
    mukaisesti sianliha-alalla käytettävissä olevien määrien vahvistamisesta
    1 päivästä huhtikuuta 30 päivään kesäkuuta 1996
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 387/96 della Commissione, del 1ºmarzo 1996, che modifica
    i regolamenti (CEE) n. 2698/93 e (CE) n. 1590/94 e stabilisce i quantitativi disponibili,
    nel settore delle carni suine, per il periodo compreso tra il 1ºaprile e il 30
    giugno 1996, nel quadro dei contingenti tariffari comunitari previsti dagli accordi
    europei, conformemente al regolamento (CE) n. 3066/95 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 387/96 van de Commissie van 1 maart 1996 waarbij overeenkomstig
    Verordening (EG) nr. 3066/95 van de Raad de Verordeningen (EEG) nr. 2698/93 en
    (EG) nr. 1590/94 worden gewijzigd en de hoeveelheden worden bepaald die in de
    sector varkensvlees voor de periode van 1 april tot en met 30 juni 1996 beschikbaar
    zijn in het kader van bij de Europa-Overeenkomsten vastgestelde communautaire
    tariefcontingenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 387/96 da Comissão, de 1 de Março de 1996, que altera
    o Regulamento (CEE) nº 2698/93 e (CE) nº 1590/94 e fixa as quantidades disponíveis,
    no sector da carne de suíno, para o período compreendido entre 1 de Abril e
    30 de Junho de 1996, no âmbito dos contingentes pautais comunitários previstos
    pelos acordos europeus, em conformidade com o Regulamento (CE) nº 3066/95 do
    Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 387/96 de la Comisión, de 1 de marzo de 1996, por
    el que se modifican los Reglamentos (CEE) nº 2698/93 y (CE) nº 1590/94 y se
    fijan las cantidades disponibles en el sector de la carne de porcino para el período
    comprendido entre el 1 de abril y 30 de junio de 1996, correspondientes a los
    contingentes arancelarios comunitarios establecidos en los Acuerdos Europeos,
    de conformidad con el Reglamento (CE) nº 3066/95 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 387/96 av den 1 mars 1996 om ändring
    av förordningarna (EEG) nr 2698/93 och (EG) nr 1590/94 och om fastställande
    av de disponibla kvantiteterna inom sektorn för griskött för perioden 1 april-30
    juni inom ramen för de gemenskapstullkvoter som fastställs i Europaavtalen i
    enlighet med rådets förordning (EG) nr 3066/95
