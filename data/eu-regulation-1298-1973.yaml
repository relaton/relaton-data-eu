id: EURegulation12981973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1298/73 of the Commission of 15 May 1973 re-establishing
    Common Customs Tariff duties on illuminating glassware, signalling glassware and
    optical elements of glass, not optically worked nor of optical glass, falling
    within subheading No 70.14 B, originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1298/73 de la Commission, du 15 mai 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à la verrerie d' éclairage, de signalisation et d' optique commune, de la sous-position
    tarifaire 70.14 B originaires de Hongkong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1298/73 der Kommission vom 15. Mai 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Glaswaren für Beleuchtung, für
    Signalvorrichtungen oder zu optischen Zwecken, nicht aus optischem Glas, nicht
    optisch bearbeitet, der Tarifstelle 70.14 B, mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1298/73 af 15. maj 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for belysningsartikler af glas ; refleksglas;
    optiske artikler af glas, hverken optisk bearbejdet eller af optisk glas under
    underposition 70.14 B, som har oprindelse i Hong Kong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1298/73 della Commissione, del 15 maggio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    vetrerie per illuminazione, per segnalazione e per ottica comune della sottovoce
    doganale n. 70.14 B, originarie di Hong Kong, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1298/73 van de Commissie van 15 mei 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op verlichtingsartikelen, signaal- en waarschuwingsartikelen van
    glas; optische elementen van gewoon glas, niet optisch bewerkt, van onderverdeling
    70.14 B, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG)
    nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties werden
    geopend
  type: main
