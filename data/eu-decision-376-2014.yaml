title:
- language: en
  script: Latn
  content: Council Decision No 376/2014/EU of 12 June 2014 authorising Portugal to
    apply a reduced rate of excise duty in the autonomous region of Madeira on locally
    produced and consumed rum and liqueurs and in the autonomous region of the Azores
    on locally produced and consumed liqueurs and eaux-de-vie
  type: main
- language: fr
  script: Latn
  content: Décision n ° 376/2014/UE du Conseil du 12 juin 2014 autorisant le Portugal
    à appliquer un taux d'accise réduit, dans la région autonome de Madère, au
    rhum et aux liqueurs qui y sont produits et consommés et, dans la région autonome
    des Açores, aux liqueurs et eaux-de-vie qui y sont produites et consommées
  type: main
- language: de
  script: Latn
  content: Beschluss Nr. 376/2014/EU des Rates vom 12. Juni 2014 zur Ermächtigung
    Portugals, in der autonomen Region Madeira auf die dort hergestellten und verbrauchten
    Rum- und Likörerzeugnisse sowie in der autonomen Region Azoren auf die dort hergestellten
    und verbrauchten Likör- und Branntweinerzeugnisse einen ermäßigten Verbrauchsteuersatz
    anzuwenden
  type: main
- language: bg
  script: Cyrl
  content: Решение № 376/2014/ЕС на Съвета от 12 юни 2014
    година за разрешаване на Португалия да прилага
    намалени акцизни ставки за местно произвеждани
    и консумирани ром и ликьори в автономния регион
    Мадейра и за местно произвеждани и консумирани
    ликьори и спиртни напитки (eaux-de-vie) в автономния
    регион Азорски острови
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady č. 376/2014/EU ze dne 12. června 2014 , kterým se Portugalsku
    povoluje uplatňovat snížené sazby spotřební daně na rum a likéry vyráběné
    a spotřebovávané místně v autonomní oblasti Madeira a na likéry a pálenky
    vyráběné a spotřebovávané místně v autonomní oblasti Azory
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse nr. 376/2014/EU af 12. juni 2014 om bemyndigelse af
    Portugal til at anvende en reduceret punktafgiftssats i den selvstyrende region
    Madeira på rom og likører, som fremstilles og forbruges lokalt, samt i den selvstyrende
    region Azorerne på likører og brændevin, som fremstilles og forbruges lokalt
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 376/2014/ΕΕ του Συμβουλίου, της
    12ης Ιουνίου 2014 , με την οποία επιτρέπεται στην
    Πορτογαλία η εφαρμογή μειωμένου συντελεστή
    ειδικού φόρου κατανάλωσης για το ρούμι και
    τα λικέρ που παράγονται και καταναλώνονται
    στην αυτόνομη περιφέρεια της Μαδέρας, καθώς
    και για τα λικέρ και τα αποστάγματα που παράγονται
    και καταναλώνονται στην αυτόνομη περιφέρεια
    των Αζορών
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus nr 376/2014/EL, 12. juuni 2014 , millega lubatakse Portugalil
    kohaldada Madeira autonoomses piirkonnas toodetud ja kohapeal tarbitavale rummile
    ja liköörile ning Assooride autonoomses piirkonnas toodetud ja kohapeal tarbitavale
    liköörile ja kangetele alkohoolsetele jookidele madalamat aktsiisimäära
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös N:o 376/2014/EU, annettu 12 päivänä kesäkuuta 2014
    , luvan antamisesta Portugalille soveltaa alennettuja valmisteverokantoja Madeiran
    itsehallintoalueella siellä tuotettaviin ja kulutettaviin rommiin ja likööreihin
    sekä Azorien itsehallintoalueella siellä tuotettaviin ja kulutettaviin likööreihin
    ja tislattuihin alkoholijuomiin
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća br. 376/2014/EU od 12. lipnja 2014. o odobravanju Portugalu
    primjene snižene stope trošarine u autonomnoj regiji Madeira na lokalno proizveden
    i potrošen rum i likere te u autonomnoj regiji Azori na lokalno proizvedene i
    potrošene likere i rakije
  type: main
- language: hu
  script: Latn
  content: A Tanács 376/2014/EU határozata ( 2014. június 12. ) Portugália számára
    a Madeira autonóm régióban előállított és fogyasztott rum és likőr, valamint
    az Azori-szigetek autonóm régiójában előállított és fogyasztott likőr
    és párlat tekintetében kedvezményes jövedékiadó-mérték alkalmazásának
    engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione n. 376/2014/UE del Consiglio, del 12 giugno 2014 , che autorizza
    il Portogallo ad applicare una riduzione delle aliquote d'accisa al rum e ai liquori
    prodotti e consumati nella regione autonoma di Madera, nonché ai liquori e alle
    acquaviti prodotti e consumati nella regione autonoma delle Azzorre
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums Nr. 376/2014/ES ( 2014. gada 12. jūnijs ), ar ko Portugālei
    atļauj piemērot samazinātu akcīzes nodokļa likmi vietējā ražojuma un patēriņa
    rumam un liķieriem Madeiras autonomajā apgabalā un vietējā ražojuma un patēriņa
    liķieriem un degvīniem Azoru salu autonomajā apgabalā
  type: main
- language: lt
  script: Latn
  content: 2014 m. birželio 12 d. Tarybos sprendimas Nr. 376/2014/ES, kuriuo Portugalijai
    leidžiama taikyti lengvatinį akcizo tarifą autonominiame Madeiros regione pagamintam
    ir vietoje suvartojamam romui ir likeriams ir autonominiame Azorų salų regione
    pagamintiems ir vietoje suvartojamiems likeriams ir spiritams
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill Nru 376/2014/UE tat- 12 ta' Ġunju 2014 li tawtorizza
    lill-Portugall japplika rata mnaqqsa tad-dazju tas-sisa fir-reġjun awtonomu tal-Madejra
    fir-rigward ta' rum u likuri prodotti u kkonsmati lokalment u fir-reġjun awtonomu
    tal-Ażores fir-rigward ta' likuri u eaux-de-vie prodotti u kkonsmati lokalment
  type: main
- language: nl
  script: Latn
  content: Besluit nr. 376/2014/EU van de Raad van 12 juni 2014 waarbij Portugal wordt
    gemachtigd een verlaagd accijnstarief toe te passen in de autonome regio Madeira
    op lokaal geproduceerde en verbruikte rum en likeuren en in de autonome regio
    de Azoren op lokaal geproduceerde en verbruikte likeuren en eaux de vie
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady nr 376/2014/UE z dnia 12 czerwca 2014 r. zezwalająca Portugalii
    na stosowanie obniżonej stawki akcyzy w autonomicznym regionie Madery na lokalnie
    produkowane i spożywane likiery i rum oraz w autonomicznym regionie Azorów na
    lokalnie produkowane i spożywane likiery i okowitę
  type: main
- language: pt
  script: Latn
  content: Decisão n. °376/2014/UE do Conselho, de 12 de junho de 2014 , que autoriza
    Portugal a aplicar uma taxa reduzida do imposto especial sobre o consumo do rum
    e dos licores produzidos e consumidos na Região Autónoma da Madeira e dos licores
    e aguardentes produzidos e consumidos na Região Autónoma dos Açores
  type: main
- language: ro
  script: Latn
  content: Decizia nr. 376/2014/UE a Consiliului din 12 iunie 2014 de autorizare a
    Portugaliei în vederea aplicării unei rate reduse a accizei pentru romul și
    lichiorurile produse și consumate pe plan local în regiunea autonomă Madeira
    și pentru lichiorurile și rachiul produse și consumate pe plan local în regiunea
    autonomă Azore
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady č. 376/2014/EÚ z 12. júna 2014 , ktorým sa Portugalsku
    povoľuje uplatňovať zníženú sadzbu spotrebnej dane v autonómnej oblasti
    Madeira na tam vyrábaný a spotrebúvaný rum a likéry a v autonómnej oblasti
    Azory na tam vyrábané a spotrebúvané likéry a vínne destiláty
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta št 376/2014/EU z dne 12. junija 2014 o dovoljenju Portugalski,
    da uporabi nižjo trošarinsko stopnjo v avtonomni pokrajini Madeira za lokalno
    proizveden in porabljen rum in likerje ter v avtonomni pokrajini Azori za lokalno
    proizvedene in porabljene likerje in žganja
  type: main
- language: es
  script: Latn
  content: Decisión n °376/2014/UE del Consejo, de 12 de junio de 2014 , por la
    que se autoriza a Portugal a aplicar una reducción del tipo de los impuestos
    especiales en la región autónoma de Madeira en relación con el ron y los licores
    allí producidos y consumidos, así como en la región autónoma de las Azores
    en relación con los licores y aguardientes allí producidos y consumidos
  type: main
- language: sv
  script: Latn
  content: Rådets beslut nr 376/2014/EU av den 12 juni 2014 om tillstånd för Portugal
    att tillämpa en nedsatt punktskattesats i den autonoma regionen Madeira för
    rom och likör som framställs och konsumeras där och i den autonoma regionen
    Azorerna för likör och eau-de-vie som framställs och konsumeras där
  type: main
