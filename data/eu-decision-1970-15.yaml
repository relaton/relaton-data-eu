id: EUDecision197015
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 9 décembre 1969, autorisant la République
    française, en vertu de l'article 115 alinéa 1 du Traité, à exclure du traitement
    communautaire les "vêtements" des positions 61.01, 61.02, 61.03 et 61.04 du Tarif
    douanier commun originaires de Hong-Kong et mis en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '70/15/EWG: Entscheidung der Kommission vom 9. Dezember 1969, mit der die
    Französische Republik gemäß Artikel 115 Absatz 1 des Vertrages ermächtigt
    wird, aus Hongkong stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche "Bekleidung" der Tarifnummern 61.01, 61.02, 61.03 und 61.04 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/15/CEE: Decisione della Commissione, del 9 dicembre 1969, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo comma, del trattato,
    ad escludere dal trattamento comunitario gli «indumenti» delle voci 61.01, 61.02,
    61.03 e 61.04 della TDC originari di Hong-Kong e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/15/EEG: Beschikking van de Commissie van 9 december 1969 waarbij de
    Franse Republiek wordt gemachtigd om op grond van artikel 115, eerste alinea,
    van het Verdrag kleding van de posten 61.01, 61.02, 61.03 en 61.04 van het gemeenschappelijk
    douanetarief die van oorsprong is uit Hong-Kong en in de andere Lid-Staten in
    het vrije verkeer is gebracht, van de communautaire behandeling uit te sluiten'
  type: main
