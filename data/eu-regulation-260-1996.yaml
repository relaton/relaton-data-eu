title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 260/96 of 12 February 1996 amending the Regulations
    in the sugar sector fixing, before 1 February 1995, certain amounts whose value
    in ecus was adapted as a consequence of abolishing the corrective factor for agricultural
    conversion rates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 260/96 de la Commission, du 12 février 1996, modifiant
    les règlements du secteur du sucre qui ont fixé, avant le 1er février 1995,
    certains montants dont les valeurs en écus ont été adaptées en raison de la
    suppression du facteur de correction des taux de conversion agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 260/96 der Kommission vom 12. Februar 1996 zur Änderung
    der Verordnungen, mit denen im Zuckersektor vor dem 1. Februar 1995 bestimmte,
    infolge der Abschaffung des auf die landwirtschaftlichen Umrechnungskurse anwendbaren
    Berichtigungsfaktors angepaßte Ecu-Beträge festgesetzt wurden
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 260/96 ze dne 12. února 1996, kterým se mění
    nařízení v odvětví cukru, která před 1. únorem 1995 stanovila některé
    částky, jejichž hodnota v ECU byla upravena v důsledku zrušení opravného
    faktoru pro zemědělské přepočítací koeficienty
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 260/96 af 12. februar 1996 om ændring
    af de forordninger for sukker, ved hvilke der før den 1. februar 1995 blev fastsat
    visse priser og beløb, hvis værdi i ecu er blevet tilpasset som følge af afskaffelsen
    af justeringsfaktoren for landbrugsomregningskurserne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 260/96 της Επιτροπής,
    της 12ης Φεβρουαρίου 1996, για τροποποίηση των
    κανονισμών, στον τομέα της ζάχαρης, δυνάμει
    των οποίων ορίσθηκαν, πριν από την 1η Φεβρουαρίου
    1995, ορισμένα ποσά οι αξίες των οποίων σε Ecu αναπροσαρμόσθηκαν
    λόγω της κατάργησης του διορθωτικού συντελεστή
    των γεωργικών ισοτιμιών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 260/96, 12. veebruar 1996, millega muudetakse
    määrusi, millega suhkrusektoris määrati enne 1. veebruari 1995 kindlaks teatavad
    summad, mille väärtust eküüdes on põllumajanduslike ümberarvestuskursside
    paranduskoefitsiendi tühistamise tõttu korrigeeritud
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 260/96, annettu 12 päivänä helmikuuta 1996,
    tiettyjen sellaisten hintojen ja määrien vahvistamisesta, joiden arvoa ecuina
    on maatalouden muuntokurssien korjaustekijän poistamisen vuoksi mukautettu, ennen
    1 päivää helmikuuta 1995 annettujen asetusten muuttamisesta sokerialalla
  type: main
- language: hu
  script: Latn
  content: A Bizottság 260/96/EK rendelete (1996. február 12.) a mezőgazdasági
    átváltási árfolyamok korrigáló szorzótényezőjének eltörlése következtében
    kiigazított, ECU-ben megadott egyes összegeknek a cukorágazatban 1995. február
    1-je előtti rögzítéséről szóló rendeletek módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 260/96 della Commissione, del 12 febbraio 1996, che
    modifica i regolamenti del settore dello zucchero che hanno fissato anteriormente
    al 1ºfebbraio 1995 alcuni importi i cui valori in ecu sono stati adattati a causa
    della soppressione del coefficiente correttore dei tassi di conversione agricoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 260/96 (1996. gada 12. februāris), ar kuru
    groza cukura sektora Regulas, kas līdz 1995. gada 1. februārim nosaka konkrētus
    apjomus, kuru vērtība ECU tikusi pielāgota lauksaimniecības maiņas kursa
    korekcijas faktora atcelšanas rezultātā
  type: main
- language: lt
  script: Latn
  content: 1996 m. vasario 12 d. Komisijos reglamentas (EB) Nr. 260/96, iš dalies
    keičiantis cukraus sektoriaus reglamentus, iki 1995 m. vasario 1 d. nustačiusius
    tam tikras sumas, kurių ekiu išreikšta vertė buvo pakoreguota panaikinus žemės
    ūkio perskaičiavimo kurso korekcijos koeficientą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissijoni (KE) Nru 260/96 tat-12 ta’ Frar 1996 li
    jemenda r-Regolamenti fis-settur taz-zokkor li jiffissaw, qabel l-1 ta’ Frar
    1995, ċerti ammonti li l-valur tagħhom f’ecus kien ġie adattat b’konsegwenza
    tat-tneħħija tal-fattur ta’ korrezzjoni għal rati ta’ konverżjoni agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 260/96 van de Commissie van 12 februari 1996 tot wijziging
    van de verordeningen in de suikersector waarbij vóór 1 februari 1995 bepaalde
    prijzen en bedragen zijn vastgesteld waarvan de waarden in ecu zijn aangepast
    als gevolg van de afschaffing van de correctiefactor voor de landbouwomrekeningskoersen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 260/96 z dnia 12 lutego 1996 r. zmieniające
    rozporządzenia w sektorze cukru, ustalające przed dniem 1 lutego 1995 r. niektóre
    kwoty, których wartość w ecu została dostosowana w konsekwencji zniesienia
    wskaźnika korygującego dla rolniczych kursów przeliczeniowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 260/96 da Comissão, de 12 de Fevereiro de 1996, que
    altera os regulamentos, no sector do açúcar, que fixaram, antes de 1 de Fevereiro
    de 1995, determinados montantes cujos valores em ecus foram adaptados devido à
    supressão do factor de correcção das taxas de conversão agrícolas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 260/96 z 12. februára 1996, ktorým sa menia
    a dopĺňajú nariadenia v sektore cukru stanovujúce pred 1. februárom 1995
    určité čiastky, ktorých hodnota v ECU bola upravená v dôsledku zrušenia
    korekčného koeficienta pre poľnohospodárske prevodné kurzy
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 260/96 z dne 12. februarja 1996 o spremembi uredb
    v sektorju sladkorja, ki so pred 1. februarjem 1995 določale nekatere zneske,
    katerih vrednost v ekujih je bila prilagojena zaradi odprave korekcijskega faktorja
    za kmetijski menjalni tečaj
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 260/96 de la Comisión, de 12 de febrero de 1996, por
    el que se modifican los Reglamentos del sector del azúcar que fijaron, antes
    del 1 de febrero de 1995, determinados precios e importes cuyos valores en ecus
    han sido adaptados debido a la supresión del factor de corrección de los tipos
    de conversión agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 260/96 av den 12 februari 1996 om ändring
    av de förordningar inom sektorn för socker som före den 1 februari 1995 fastställde
    vissa belopp vars värde i ecu har anpassats till följd av avskaffandet av korrigeringsfaktorn
    för jordbruksomräkningskurserna
  type: main
