title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1957/89 of 30 June 1989 fixing for the 1989/90
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for processed tomato products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1957/89 de la Commission du 30 juin 1989 fixant, pour
    la campagne 1989/1990, le prix minimal à payer aux producteurs pour les tomates
    ainsi que le montant de l'aide à la production pour les produits transformés
    à base de tomates
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1957/89 DER KOMMISSION vom 30. Juni 1989 zur Festsetzung
    des den Tomatenerzeugern zu zahlenden Mindestpreises sowie der Produktionsbeihilfe
    für Verarbeitungserzeugnisse aus Tomaten im Wirtschaftsjahr 1989/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1957/89 af 30. juni 1989 om fastsættelse
    af den minimumspris, der skal betales producenten for tomater, samt producentstøtten
    for forarbejdede tomater i produktionsåret 1989/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1957/89 της Επιτροπής
    της 30ής Ιουνίου 1989 για τον καθορισμό, για την
    περίοδο εμπορίας 1989/90, της ελάχιστης τιμής
    που πληρώνεται στους παραγωγούς για τις τομάτες
    και του ποσού της ενίσχυσης στην παραγωγή για
    τα προϊόντα με βάση τις τομάτες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1957/89 DELLA COMMISSIONE del 30 giugno 1989 che
    fissa, per la campagna di commercializzazione 1989/1990 il prezzo minimo da pagare
    ai produttori di pomodori e l'' importo dell'' aiuto alla produzione per i prodotti
    trasformati a base di pomodoro #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1957/89 VAN DE COMMISSIE van 30 juni 1989 tot vaststelling,
    voor het verkoopseizoen 1989/1990, van de aan de telers voor tomaten te betalen
    minimumprijs, alsmede van het bedrag van de steun bij de produktie van op basis
    van tomaten verwerkte produkten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1957/89 DA COMISSÃO de 30 de Junho de 1989 que
    fixa para a campanha de comercialização de 1989/1990, o preço mínimo a pagar
    aos produtores para os tomates e o montante da ajuda à produção para os produtos
    transformados à base de tomate #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1957/89 DE LA COMISIÓN de 30 de junio de 1989 por
    el que se establece, para la campaña 1989/90, el precio mínimo que debe pagarse
    a los productores de tomates y el importe de la ayuda a la producción de productos
    transformados a base de tomates #'
  type: main
