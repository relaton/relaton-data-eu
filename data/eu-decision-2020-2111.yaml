    pagal Tarybos direktyvos 2006/88/EB 43 straipsnį tvirtinant nacionalines tam
    tikrų ligų poveikio akvakultūros gyvūnams ir laukiniams vandens gyvūnams
    ribojimo priemones iš dalies keičiamas Sprendimo 2010/221/ES I priedas (pranešta
    dokumentu Nr. C(2020) 9302)
  type: main
