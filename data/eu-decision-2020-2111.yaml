    a la referencia al Reino Unido en lo relativo a Irlanda del Norte para la aprobación
    de medidas nacionales destinadas a limitar el impacto de determinadas enfermedades
    de los animales de la acuicultura y los animales acuáticos silvestres de conformidad
    con el artículo 43 de la Directiva 2006/88/CE del Consejo [notificada con el
    número C(2020) 9302]
