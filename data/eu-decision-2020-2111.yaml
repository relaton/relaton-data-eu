    ao Reino Unido relativamente à Irlanda do Norte para a aprovação de medidas
    nacionais destinadas a limitar o impacto de certas doenças dos animais de aquicultura
    e dos animais aquáticos selvagens em conformidade com o artigo 43.o da Diretiva
    2006/88/CE do Conselho [notificada com o número C(2020) 9302]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/2111 a Comisiei din 16 decembrie
    2020 de modificare a anexei I la Decizia 2010/221/UE în ceea ce privește trimiterea
    la Regatul Unit referitoare la Irlanda de Nord pentru aprobarea măsurilor naționale
    de limitare a impactului anumitor boli ale animalelor acvatice și a animalelor
    acvatice sălbatice în conformitate cu articolul 43 din Directiva 2006/88/CE
    a Consiliului [notificată cu numărul C(2020) 9302]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/2111 zo 16. decembra 2020,
    ktorým sa mení príloha I k rozhodnutiu 2010/221/EÚ, pokiaľ ide o odkaz na
    Spojené kráľovstvo vzhľadom na Severné Írsko, o schválení vnútroštátnych
    opatrení na obmedzenie vplyvu určitých chorôb živočíchov akvakultúry a
    voľne žijúcich vodných živočíchov v súlade s článkom 43 smernice Rady
    2006/88/ES [oznámené pod číslom C(2020)9302]
  type: main
- language: sl
  script: Latn
