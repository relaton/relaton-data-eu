    на Обединеното кралство по отношение на Северна
    Ирландия за одобряване на национални мерки
    за ограничаване на въздействието на някои
    болести по аквакултурите и дивите водни животни
    в съответствие с член 43 от Директива 2006/88/ЕО
    на Съвета (нотифицирано под номер C(2020) 9302)
  type: main
