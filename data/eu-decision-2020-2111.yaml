    ar ko sakarā ar atsauci uz Apvienoto Karalisti attiecībā uz Ziemeļīriju groza
    Lēmuma 2010/221/ES I pielikumu, lai apstiprinātu valsts pasākumus noteiktu
    akvakultūras dzīvnieku un savvaļas ūdensdzīvnieku slimību ietekmes ierobežošanai
    saskaņā ar Padomes Direktīvas 2006/88/EK 43. pantu (izziņots ar dokumenta
