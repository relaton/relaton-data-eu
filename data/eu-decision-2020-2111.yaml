    tar-referenza għar-Renju Unit fir-rigward tal-Irlanda ta’ Fuq għall-approvazzjoni
    ta’ miżuri nazzjonali biex jiġi limitat l-impatt ta’ ċertu mard fl-annimali
    tal-akkwakultura u annimali akkwatiċi selvaġġi f’konformità mal-Artikolu
