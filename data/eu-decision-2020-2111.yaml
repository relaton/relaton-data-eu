    2020 che modifica l’allegato I della decisione 2010/221/UE per quanto riguarda
    il riferimento al Regno Unito nei confronti dell’Irlanda del Nord, in relazione
    all’approvazione delle misure nazionali volte a limitare l’impatto di alcune
    malattie degli animali di acquacoltura e degli animali acquatici selvatici, in
    conformità all’articolo 43 della direttiva 2006/88/CE del Consiglio [notificata
    con il numero C(2020) 9302]
  type: main
- language: lv
