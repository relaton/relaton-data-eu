title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/2111 of 16 December 2020 amending
    Annex I to Decision 2010/221/EU as regards the reference to the United Kingdom
    in respect of Northern Ireland for the approval of national measures for limiting
    the impact of certain diseases in aquaculture animals and wild aquatic animals
    in accordance with Article 43 of Council Directive 2006/88/EC (notified under
    document C(2020) 9302)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/2111 de la Commission du 16 décembre
    2020 modifiant l’annexe I de la décision 2010/221/UE pour ce qui est de la
    référence au Royaume-Uni en ce qui concerne l’Irlande du Nord aux fins de
    l’approbation de mesures nationales visant à limiter les effets de certaines
    maladies des animaux d’aquaculture et des animaux aquatiques sauvages conformément
    à l’article 43 de la directive 2006/88/CE du Conseil [notifiée sous le numéro
    C(2020) 9302]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/2111 der Kommission vom 16. Dezember
    2020 zur Änderung des Anhangs I des Beschlusses 2010/221/EU über die Genehmigung
    nationaler Maßnahmen zur Begrenzung der Auswirkungen bestimmter Krankheiten bei
    Tieren in Aquakultur und wild lebenden Wassertieren im Einklang mit Artikel 43
    der Richtlinie 2006/88/EG des Rates im Hinblick auf den Verweis auf das Vereinigte
    Königreich in Bezug auf Nordirland (Bekannt gegeben unter Aktenzeichen C(2020)
    9302)
  type: main
- language: bg
