    Priloge I k Sklepu 2010/221/EU glede sklica na Združeno kraljestvo v zvezi s
    Severno Irsko za odobritev nacionalnih ukrepov za omejevanje vpliva nekaterih
    bolezni pri živalih iz ribogojstva in prosto živečih vodnih živalih v skladu
    s členom 43 Direktive Sveta 2006/88/ES (notificirano pod dokumentarno številko
