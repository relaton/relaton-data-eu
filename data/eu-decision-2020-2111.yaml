    és a vadon élő víziállatokban előforduló egyes betegségek hatásának
    enyhítésére hozott nemzeti intézkedéseknek a 2006/88/EK tanácsi irányelv
    43. cikkével összhangban történő jóváhagyása céljából az Egyesült
    Királyságra Észak-Írország tekintetében történő hivatkozás tekintetében
