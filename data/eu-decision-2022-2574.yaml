title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/2574 of 19 December 2022 on the position to
    be taken on behalf of the Union within the Partnership Council established by
    the Trade and Cooperation Agreement between the European Union and the European
    Atomic Energy Community, of the one part, and the United Kingdom of Great Britain
    and Northern Ireland, of the other part, as regards the extension of the interim
    period referred to in Article 552(11) of that Agreement during which the United
    Kingdom may derogate from the obligation to delete Passenger Name Record data
    of passengers after their departure from the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2574 du Conseil du 19 décembre 2022 relative à la
    position à prendre, au nom de l’Union, au sein du conseil de partenariat institué
    par l’accord de commerce et de coopération entre l’Union européenne et la
    Communauté européenne de l’énergie atomique, d’une part, et le Royaume-Uni
    de Grande-Bretagne et d’Irlande du Nord, d’autre part, en ce qui concerne
    la prolongation de la période intérimaire visée à l’article 552, paragraphe
    11, dudit accord, pendant laquelle le Royaume-Uni peut déroger à l’obligation
    de supprimer les données des dossiers passagers après le départ des passagers
    du Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/2574 des Rates vom 19. Dezember 2022 über den im Namen
    der Union in dem mit dem Abkommen über Handel und Zusammenarbeit zwischen der
    Europäischen Union und der Europäischen Atomgemeinschaft einerseits und dem
    Vereinigten Königreich Großbritannien und Nordirland andererseits eingesetzten
    Partnerschaftsrat hinsichtlich der Verlängerung des Übergangszeitraums nach
    Artikel 552 Absatz 11 des genannten Abkommens, in dem das Vereinigte Königreich
    von der Pflicht zur Löschung der Fluggastdatensätze von Fluggästen nach deren
    Abflug aus dem Vereinigten Königreich abweichen kann, zu vertretenden Standpunkt
  type: main
