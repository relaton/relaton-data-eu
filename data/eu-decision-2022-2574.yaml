    del periodo transitorio di cui all’articolo 552, paragrafo 11, di tale accordo
    durante il quale il Regno Unito può derogare all’obbligo di cancellare i dati
    del codice di prenotazione dei passeggeri dopo la partenza dal Regno Unito
  type: main
