  content: Решение (ЕС) 2022/2574 на Съвета от 19 декември
    2022 година относно позицията, която трябва да
    се заеме от името на Съюза в рамките на Съвета
    за партньорство, създаден със Споразумението
    за търговия и сътрудничество между Европейския
    съюз и Европейската общност за атомна енергия,
    от една страна, и Обединеното кралство Великобритания
    и Северна Ирландия, от друга страна, във връзка
    с удължаването на междинния период, посочен
    в член 552, параграф 11 от същото споразумение,
    по време на който Обединеното кралство може
    да предвиди дерогации от задължението за заличаване
    на резервационните данни на пътниците след
    отпътуването им от Обединеното кралство
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/2574 ze dne 19. prosince 2022 o postoji, který
    má být zaujat jménem Evropské unie v Radě partnerství zřízené Dohodou
    o obchodu a spolupráci mezi Evropskou unií a Evropským společenstvím pro
    atomovou energii na jedné straně a Spojeným královstvím Velké Británie
    a Severního Irska na straně druhé, pokud jde o prodloužení přechodného
    období uvedeného v čl. 552 odst. 11 uvedené dohody, během něhož se Spojené
    království může odchýlit od povinnosti vymazat údaje jmenné evidence cestujících
    po jejich odjezdu ze Spojeného království
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/2574 af 19. december 2022 om den holdning,
    der skal indtages på Unionens vegne i Partnerskabsrådet, der blev nedsat ved
    handels- og samarbejdsaftalen mellem Den Europæiske Union og Det Europæiske
    Atomenergifællesskab på den ene side og Det Forenede Kongerige Storbritannien
    og Nordirland på den anden side, til forlængelsen af den overgangsperiode, der
    er omhandlet i nævnte aftales artikel 552, stk. 11, i løbet af hvilken Det Forenede
