  script: Latn
  content: Odluka Vijeća (EU) 2022/2574 od 19. prosinca 2022. o stajalištu koje
    treba zauzeti u ime Unije u okviru Vijeća za partnerstvo osnovanog Sporazumom
    o trgovini i suradnji između Europske unije i Europske zajednice za atomsku energiju,
    s jedne strane, i Ujedinjene Kraljevine Velike Britanije i Sjeverne Irske, s druge
    strane, u pogledu produljenja prijelaznog razdoblja iz članka 552. stavka 11.
