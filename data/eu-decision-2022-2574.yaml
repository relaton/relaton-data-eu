  script: Latn
  content: Besluit (EU) 2022/2574 van de Raad van 19 december 2022 betreffende het
    standpunt dat namens de Unie moet worden ingenomen in de Partnerschapsraad die
    is ingesteld bij de Handels- en samenwerkingsovereenkomst tussen de Europese Unie
    en de Europese Gemeenschap voor Atoomenergie, enerzijds, en het Verenigd Koninkrijk
    van Groot-Brittannië en Noord-Ierland, anderzijds, met betrekking tot de verlenging
    van de in artikel 552, lid 11, van die overeenkomst bedoelde overgangsperiode
    waarin het Verenigd Koninkrijk mag afwijken van de verplichting om persoonsgegevens
    van passagiers na hun vertrek uit het Verenigd Koninkrijk te wissen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/2574 z dnia 19 grudnia 2022 r. w sprawie stanowiska,
    jakie ma zostać zajęte w imieniu Unii w ramach Rady Partnerstwa ustanowionej
    Umową o handlu i współpracy między Unią Europejską i Europejską Wspólnotą
    Energii Atomowej, z jednej strony, a Zjednoczonym Królestwem Wielkiej Brytanii
    i Irlandii Północnej, z drugiej strony, w sprawie przedłużenia okresu przejściowego,
    o którym mowa w art. 552 ust. 11 tej umowy, w trakcie którego Zjednoczone Królestwo
    może odstąpić od obowiązku usuwania danych dotyczących przelotu pasażerów
    po ich wyjeździe ze Zjednoczonego Królestwa
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/2574 do Conselho de 19 de dezembro de 2022 relativa
    à posição a adotar, em nome da União, no âmbito do Conselho de Parceria criado
    pelo Acordo de Comércio e Cooperação entre a União Europeia e a Comunidade
    Europeia da Energia Atómica, por um lado, e o Reino Unido da Grã-Bretanha e
    da Irlanda do Norte, por outro, no que diz respeito à prorrogação do período
    provisório referido no artigo 552.o, n.o 11, desse acordo, durante o qual o Reino
    Unido pode aplicar derrogações à obrigação de suprimir os dados dos registos
    de identificação dos passageiros após a sua partida do país
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/2574 a Consiliului din 19 decembrie 2022 privind poziția
    care urmează să fie adoptată în numele Uniunii în cadrul Consiliului de parteneriat
    instituit prin Acordul comercial și de cooperare dintre Uniunea Europeană și
    Comunitatea Europeană a Energiei Atomice, pe de o parte, și Regatul Unit al
    Marii Britanii și Irlandei de Nord, pe de altă parte, în ceea ce privește
    prelungirea perioadei de tranziție menționate la articolul 552 alineatul (11)
    din acordul respectiv în cursul căreia Regatul Unit poate deroga de la obligația
    de a șterge datele din registrul cu numele pasagerilor după plecarea acestora
    din Regatul Unit
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/2574 z 19. decembra 2022 o pozícii, ktorá
    sa má v mene Únie zaujať v Rade pre partnerstvo zriadenej Dohodou o obchode
    a spolupráci medzi Európskou úniou a Európskym spoločenstvom pre atómovú
    energiu na jednej strane a Spojeným kráľovstvom Veľkej Británie a Severného
    Írska na strane druhej, pokiaľ ide o predĺženie prechodného obdobia uvedeného
    v článku 552 ods. 11 uvedenej dohody, počas ktorého sa Spojené kráľovstvo
    môže odchýliť od povinnosti vymazať údaje zo záznamov o cestujúcich po
    ich odlete zo Spojeného kráľovstva
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/2574 z dne 19. decembra 2022 o stališču, ki se
    v imenu Unije zastopa v Partnerskem svetu, ustanovljenem s Sporazumom o trgovini
    in sodelovanju med Evropsko unijo in Evropsko skupnostjo za atomsko energijo na
    eni strani ter Združenim kraljestvom Velika Britanija in Severna Irska na drugi
    strani, glede podaljšanja vmesnega obdobja iz člena 552(11) navedenega sporazuma,
    v katerem lahko Združeno kraljestvo odstopa od obveznosti izbrisa podatkov iz
    evidence podatkov o potnikih po njihovem odhodu iz Združenega kraljestva
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/2574 del Consejo de 19 de diciembre de 2022 relativa
    a la posición que debe adoptarse, en nombre de la Unión, en el Consejo de Asociación
    establecido por el Acuerdo de Comercio y Cooperación entre la Unión Europea
    y la Comunidad Europea de la Energía Atómica, por una parte, y el Reino Unido
    de Gran Bretaña e Irlanda del Norte, por otra, en lo que respecta a la prórroga
    del período transitorio a que se refiere el artículo 552, apartado 11, de dicho
    Acuerdo, durante el cual el Reino Unido podrá establecer excepciones a la obligación
    de suprimir los datos del registro de nombres de los pasajeros después de su
    salida del Reino Unido
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/2574 av den 19 december 2022 om den ståndpunkt
    som ska intas på unionens vägnar i det partnerskapsråd som inrättats genom
    avtalet om handel och samarbete mellan Europeiska unionen och Europeiska atomenergigemenskapen,
    å ena sidan, och Förenade konungariket Storbritannien och Nordirland, å andra
    sidan, vad gäller förlängning av den övergångsperiod som avses i artikel
    552.11 i det avtalet under vilken Förenade kungariket får avvika från skyldigheten
    att radera PNR-uppgifter om passagerare efter deras avresa från Förenade kungariket
