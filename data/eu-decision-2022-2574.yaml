  script: Latn
  content: Nõukogu otsus (EL) 2022/2574, 19. detsember 2022, liidu nimel võetava
    seisukoha kohta partnerlusnõukogus, mis on loodud ühelt poolt Euroopa Liidu
    ja Euroopa Aatomienergiaühenduse ning teiselt poolt Suurbritannia ja Põhja-Iiri
    Ühendkuningriigi vahelise kaubandus- ja koostöölepinguga, seoses nimetatud
