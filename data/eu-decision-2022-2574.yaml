    másrészről Nagy-Britannia és Észak-Írország Egyesült Királysága közötti
    kereskedelmi és együttműködési megállapodással létrehozott partnerségi
    tanácsban az utas-nyilvántartási adatállomány adatainak az utasok Egyesült
    Királyságból való távozását követő törlésére vonatkozó kötelezettségtől
    az Egyesült Királyság számára eltérést lehetővé tevő, az említett megállapodás
    552. cikkének (11) bekezdésében említett átmeneti időszak meghosszabbítása
    tekintetében képviselendő álláspontról
  type: main
