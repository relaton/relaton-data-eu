title:
- language: en
  script: Latn
  content: '80/971/EEC: Commission Decision of 30 September 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the Kingdom of Belgium of expenditure incurred
    during 1979 on annuities relating to measures to encourage the cessation of farming
    and the reallocation of utilized agricultural area for the purpose of structural
    improvement (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/971/CEE: Décision de la Commission, du 30 septembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume de Belgique des dépenses effectuées
    pendant l''année 1979 pour les indemnités relatives à l''encouragement à la
    cessation de l''activité agricole et à l''affectation de la superficie agricole
    utilisée à des fins d''amélioration des structures (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/971/EWG: Entscheidung der Kommission vom 30. September 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben zur Förderung
    der Einstellung der landwirtschaftlichen Erwerbstätigkeit und der Verwendung
    der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    durch den EAGFL, Abteilung Ausrichtung, an das Königreich Belgien (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/971/EØF: Kommissionens beslutning af 30. september 1980 om refusion
    gennem EUGFL, udviklingssektionen til kongeriget Belgien af de udgifter, som er
    afholdt i løbet af året 1979 til godtgørelser vedrørende støtte til ophør
    af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/971/CEE: Decisione della Commissione, del 30 settembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle
    spese effettuate nel 1979 per le indennità concernenti l''incoraggiamento alla
    cessazione dell''attivita agricola e alla destinazione della superficie agricola
    utilizzata a scopi di miglioramento delle strutture (Il testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/971/EEG: Beschikking van de Commissie van 30 september 1980 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, van de in het jaar 1979 door
    het Koninkrijk België gedane uitgaven voor uitkeringen ter bevordering van de
    bedrijfsbeëindiging in de landbouw en van de aanwending van cultuurgrond tot
    verbetering van de structuur (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
