title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 557/84 of 29 February 1984 re-establishing
    the levying of customs duties on glass inners for vacuum flasks or for other vacuum
    vessels, falling within heading No 70.12 and originating in India, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3569/83
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 557/84 de la Commission du 29 février 1984 portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants, de la position 70.12 du tarif douanier commun,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 557/84 der Kommission vom 29. Februar 1984 zur Wiedereinführung
    der Erhebung der Zölle für Glaskolben für Isolierbehälter der Tarifnummer
    70.12 mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3569/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 557/84 af 29. februar 1984 om genindførelse
    af opkrævning af told for glaskolber til termoflasker, henhørende under pos.
    70.12 og med oprindelse i Indien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 557/84 της Επιτροπής
    της 29ης Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής των δασμών για υάλινες φύσιγγες
    για μονωτικά δοχεία, της κλάσεως 70.12 του Κοινού
    Δασμολογίου, καταγωγής Ινδίας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 557/84 della Commissione del 29 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili alle ampolle di vetro
    per recipienti isolanti, della voce 70.12 della tariffa doganale comune, originarie
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 557/84 van de Commissie van 29 februari 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op binnenflessen
    voor thermisch isolerende flessen, van tariefpost 70.12, van oorsprong uit India,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
