title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 954/92 of 15 April 1992 amending Commission
    Regulation (EEC) No 3866/91 fixing the standard values to be used in calculating
    the financial compensation and the advance pertaining thereto in respect of fishery
    products withdrawn from the market during the 1992 fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 954/92 de la Commission du 15 avril 1992 modifiant
    le règlement (CEE) n° 3866/91 de la Commission fixant la valeur forfaitaire
    des produits de la pêche retirés du marché pendant la campagne de pêche 1992
    intervenant dans le calcul de la compensation financière et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 954/92 DER KOMMISSION vom 15. April 1992 zur Änderung
    der Verordnung (EWG) Nr. 3866/91 zur Festsetzung des Pauschalwerts für das Fischwirtschaftsjahr
    1992 für die aus dem Handel genommenen Fischereierzeugnisse, der zur Berechnung
    des finanziellen Ausgleichs und des entsprechenden Vorschusses dient #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 954/92 af 15. april 1992 om ændring
    af forordning (EØF) nr. 3866/91 om fastsættelse af den ved beregningen af den
    finansielle udligning og det tilsvarende forskud anvendte forudfastsatte værdi
    af fiskerivarer, der tages tilbage fra markedet i fangstsæsonen 1992 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 954/92 της Επιτροπής
    της 15ης Απριλίου 1992 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3866/91 για τον καθορισμό της κατ' αποκοπήν
    αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1992
    και λαμβάνεται υπόψη κατά τον υπολογισμό της
    χρηματοδοτικής αντιστάθμισης και της σχετικής
    προκαταβολής
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 954/92 DELLA COMMISSIONE del 15 aprile 1992 recante
    modifica del regolamento (CEE) n. 3866/91 che fissa, ai fini del calcolo della
    compensazione finanziaria e dell'' anticipo corrispondente, il valore forfettario
    dei prodotti della pesca ritirati dal mercato nella campagna di pesca 1992 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 954/92 VAN DE COMMISSIE van 15 april 1992 tot wijziging
    van Verordening (EEG) nr. 3866/91 betreffende de vaststelling van de forfaitaire
    waarde voor het visseizoen 1992 voor de uit de markt genomen visserijprodukten
    voor de berekening van de financiële vergoeding en het hierop betrekking hebbende
    voorschot #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 954/92 DA COMISSÃO de 15 de Abril de 1992 que altera
    o Regulamento (CEE) no 3866/91 da Comissão, que fixa, para efeitos do cálculo
    da compensação financeira e do adiantamento que lhe diz respeito, o valor forfetário
    dos produtos retirados do mercado durante a campanha de pesca de 1992 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 954/92 DE LA COMISIÓN de 15 de abril de 1992 por
    el que se modifica el Reglamento (CEE) nº 3866/91 por el que se fija el valor
    a tanto alzado de los productos de la pesca retirados del mercado durante la compaña
    pesquera de 1992 que ha de utilizarse en el cálculo de la compensación financiera
    y del anticipo relacionado con ésta #'
  type: main
