id: EURegulation3241975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 324/75 of the Commission of 10 February 1975 re-introducing
    Common Customs Tariff duties on cotton yarn, put up for retail sale, falling within
    heading No 55.06, originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3050/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 324/75 de la Commission, du 10 février 1975, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de coton conditionnés pour la vente au détail, de la position tarifaire
    55.06, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3050/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 324/75 der Kommission vom 10. Februar 1975 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Baumwollgarne in Aufmachungen für
    den Einzelverkauf der Tarifnummer 55.06, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 3050/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 324/75 af 10. februar 1975 om genindførelse
    af tolden ifølge den fælles toldtarif for garn af bomuld, detailsalgsoplægninger,
    henhørende under pos. 55.06, der har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3050/74 af
    2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 324/75 della Commissione, del 10 febbraio 1975, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di cotone preparati per la vendita al minuto della voce doganale n. 55.06,
    originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3050/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 324/75 van de Commissie van 10 februari 1975 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op garens van katoen, gereed voor de verkoop in het klein van tariefpost
    55.06, van oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening (EEG)
    nr. 3050/74 van de Raad van 2 december 1974 tariefpreferenties werden geopend
  type: main
