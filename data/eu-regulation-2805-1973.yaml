title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2805/73 of the Commission of 12 October 1973 determining
    a list of white quality wines, produced in specified regions and of imported white
    quality wines containing a certain percentage of sulphur dioxide and laying down
    certain transitional provisions relating to the percentage of sulphur dioxide
    in wines produced before 1 October 1973
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2805/73 de la Commission, du 12 octobre 1973, établissant
    la liste des vins blancs de qualité produits dans des régions déterminées
    et des vins blancs de qualité importés ayant une teneur en anhydride sulfureux
    particulière et portant certaines dispositions transitoires concernant la teneur
    en anhydride sulfureux des vins produits avant le 1er octobre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2805/73 der Kommission vom 12. Oktober 1973 zur Aufstellung
    des Verzeichnisses der in bestimmten Anbaugebieten erzeugten weißen Qualitätsweine
    und der eingeführten weißen Qualitätsweine mit einem außergewöhnlichen Schwefeldioxidgehalt
    sowie zur Festlegung bestimmter Übergangsmaßnahmen für den Schwefeldioxidgehalt
    bei vor dem 1. Oktober 1973 erzeugten Weinen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2805/73 af 12. oktober 1973 om opstilling
    af en liste over hvide kvalitetsvine fra bestemte dyrkningsområder og indførte
    hvide kvalitetsvine, som har et særligt svovldioxydindhold, og om visse overgangsbestemmelser
    vedrørende svovldioxydindholdet i vin, som er produceret inden 1. oktober 1973
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2805/73 της Επιτροπής
    της 12ης Οκτωβρίου 1973 περί καταρτίσεως του πίνακα
    λευκών οίνων ποιότητος παραγομένων εντός καθορισμένων
    περιοχών και εισαγομένων λευκών οίνων ποιότητος
    που έχουν διακριτική περιεκτικότητα σε θειώδη
    ανυδρίτη και περί ορισμένων ματαβατικών διατάξεων
    ως προς την περιεκτικότητα σε θειώδη ανυδρίτη
    οίνων που έχουν παραχθεί πριν από την 1η Οκτωβρίου
    1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2805/73 della Commissione, del 12 ottobre 1973, che
    stabilisce l' elenco dei vini bianchi di qualità prodotti in regioni determinate
    e dei vini bianchi di qualità importati aventi un tenore particolare di anidride
    solforosa, nonché alcune disposizioni transitorie relative al tenore di anidride
    solforosa dei vini prodotti anteriormente al 1° ottobre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2805/73 van de Commissie van 12 oktober 1973 houdende
    vaststelling van de lijst van de bepaalde gebieden voortgebrachte witte kwaliteitswijnen
    en ingevoerde witte kwaliteitswijnen met een bijzonder gehalte aan zwaveldioxyde,
    en houdende overgangsbepalingen betreffende het gehalte aan zwaveldioxyde in vóór
    1 oktober 1973 voortgebrachte wijnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2805/73 da Comissão, de 12 de Outubro de 1973,
    que estabelece a lista de vinhos brancos de qualidade produzidos em regiões determinadas
    e dos vinhos brancos de qualidade importados com um teor em anidrido sulfuroso
    especial e que contêm certas disposições transitórias que dizem respeito ao
    teor em anidrido sulfuroso dos vinhos produzidos antes de 1 de Outubro de 1973
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2805/73 de la Comisión, de 12 de octubre de 1973,
    por el que se establece la lista de los vinos blancos de calidad producidos en
    regiones determinadas y de los vinos blancos de calidad importados, con un contenido
    particular en anhídrido sulfuroso, y sobre determinadas disposiciones transitorias
    relativas al contenido en anhídrido sulfuroso de los vinos producidos antes del
    1 de octubre de 1973
  type: main
