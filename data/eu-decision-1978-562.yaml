type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 June 1978 authorizing Ireland not to apply Community
    treatment to women's, girls' and infants' parkas, anoraks, windcheaters and the
    like, woven, of wool, of cotton or of man-made textile fibres, falling within
    heading No ex 61.01 or subheading ex 61.02 B (NIMEXE codes 61.01-29; 31; 32 -
    61.02-25; 26; 28) of the Common Customs Tariff, originating in South Korea and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/562/CEE: Décision de la Commission, du 6 juin 1978, autorisant l''Irlande
    à exclure du traitement communautaire les parkas, anoraks, blousons et similaires,
    tissés, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    pour hommes, garçonnets, femmes, fillettes et jeunes enfants, de la position
    Ex 61.01 et de la sous-position Ex 61.02 B du Tarif douanier commun (codes Nimexe
    : 61.01-29, 31, 32; 61.02-25, 26, 28), originaires de Corée du Sud et mis en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. Juni 1978, mit der Irland ermächtigt
    wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Parkas, Anoraks, Windjacken und dergleichen, aus Geweben aus Wolle,
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen, für Männer, Knaben,
    Frauen, Mädchen und Kleinkinder, der Tarifnummern ex 61.01 und ex 61.02 B des
    Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-29; 31; 32 - 61.02-25; 26; 28)
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 6. juni 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage parkaer, anorakker, vindjakker og lignende,
    af uld, bomuld eller korte kemofibre til mænd, drenge, kvinder, piger og småbørn,
    som henhører under pos. ex 61.01 og ex 61.02 B (NIMEXE-kode 61.01-29, 31, 32
    - 61.02-25, 26, 28) i den fælles toldtarif, har oprindelse i Sydkorea og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 6 giugno 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario giacche e giacconi a vento, giubbotti
    e simili, tessuti, di lana, di cotone o di fibre tessili sintetiche o artificiali
    per uomo, per ragazzo, per donna, per ragazza e per bambini della voce ex 61.01
    e della sottovoce ex 61.02 B della tariffa doganale comune (codice Nimexe: 61.01-29;
    31; 32 - 61.02-25; 26; 28), originari della Corea del Sud e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 juni 1978 waarbij Ierland wordt gemachtigd
    parka's, anoraks, windjakken en dergelijke geweven, van wol, van katoen of van
    synthetische of van kunstmatige vezels voor heren, jongens, dames, meisjes en
    kinderen van de posten ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.01-29, 31, 32 - 61.02-25, 26, 28), van oorsprong uit Zuid-Korea
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
