    hinsichtlich einer Sondermaßnahme zur Gewährung einer befristeten Sonderunterstützung
    im Rahmen des Europäischen Landwirtschaftsfonds für die Entwicklung des ländlichen
    Raums (ELER) als Reaktion auf die russische Invasion der Ukraine
  type: main
