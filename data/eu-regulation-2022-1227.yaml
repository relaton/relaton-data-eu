    sprijin temporar excepțional din Fondul european agricol pentru dezvoltare rurală
    (FEADR) ca răspuns la impactul invadării Ucrainei de către Rusia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1227 z 15. júla 2022, ktorým
