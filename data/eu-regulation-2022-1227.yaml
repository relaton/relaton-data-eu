    Alap (EMVA) keretében rendkívüli ideiglenes támogatás nyújtását célzó
    egyedi intézkedés tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1227 della Commissione del 15 luglio
    2022 che modifica i regolamenti di esecuzione (UE) n. 808/2014 e (UE) n. 809/2014
    per quanto riguarda una misura specifica volta a fornire un sostegno temporaneo
    eccezionale nell’ambito del Fondo europeo agricolo per lo sviluppo rurale (FEASR)
    in risposta all’impatto dell’invasione russa dell’Ucraina
  type: main
- language: lv
  script: Latn
