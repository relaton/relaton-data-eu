  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1227 of 15 July 2022 amending
    Implementing Regulations (EU) No 808/2014 and (EU) No 809/2014 as regards a specific
    measure to provide exceptional temporary support under the European Agricultural
    Fund for Rural Development (EAFRD) in response to the impact of Russia’s invasion
    of Ukraine
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1227 de la Commission du 15 juillet
    2022 modifiant les règlements d’exécution (UE) no 808/2014 et (UE) no 809/2014
    en ce qui concerne une mesure spécifique destinée à fournir un soutien temporaire
    exceptionnel au titre du Fonds européen agricole pour le développement rural
    (Feader) en réaction aux conséquences de l’invasion de l’Ukraine par la
    Russie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1227 der Kommission vom 15. Juli 2022
