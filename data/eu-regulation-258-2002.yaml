  script: Latn
  content: Commission Regulation (EC) No 258/2002 of 12 February 2002 determining
    the loss of income and the premiums applicable per ewe and per female goat in
    the Member States and the payment of the specific aid for sheep and goat farming
    in certain less-favoured areas of the Community for the 2001 marketing year
  type: main
- language: fr
  script: Latn
