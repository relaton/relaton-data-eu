id: EUDecision1999255
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/255/EC: Council Decision of 30 March 1999 authorising, in accordance
    with Directive 92/81/EEC, certain Member States to apply and to continue to apply
    to certain mineral oils, reduced rates of excise duty or exemptions from excise
    duty, and amending Decision 97/425/EC'
  type: main
- language: fr
  script: Latn
  content: '1999/255/CE: Décision du Conseil du 30 mars 1999 autorisant certains
    États membres, conformément à la directive 92/81/CEE, à appliquer ou à continuer
    à appliquer à certaines huiles minérales des réductions de taux d''accise
    ou des exonérations d''accises, et portant modification de la décision 97/425/CE'
  type: main
- language: de
  script: Latn
  content: '1999/255/EG: Entscheidung des Rates vom 30. März 1999 zur Ermächtigung
    bestimmter Mitgliedstaaten, gemäß der Richtlinie 92/81/EWG für Mineralöle
    mit bestimmten Verwendungszwecken Verbrauchsteuerermäßigungen oder - befreiungen
    anzuwenden und beizubehalten, und zur Änderung der Entscheidung 97/425/EG'
  type: main
- language: da
  script: Latn
  content: '1999/255/EF: Rådets beslutning af 30. Marts 1999 om bemyndigelse, i henhold
    til direktiv 92/81/EØF, af visse medlemsstater til at indføre eller fortsat
    anvende punktafgiftsfritagelser eller -lempelser for visse typer mineralolier,
    samt om ændring af Rådets beslutning 97/425/EF'
  type: main
- language: el
  script: Grek
  content: '1999/255/ΕΚ: Απόφαση του Συμβουλίου, της 30ής
    Μαρτίου 1999, για την εξουσιοδότηση, σύμφωνα
    με την οδηγία 92/81/ΕΟΚ, ορισμένων κρατών μελών
    να εφαρμόσουν και να συνεχίσουν να εφαρμόζουν
    μειωμένους συντελεστές του ειδικού φόρου κατανάλωσης
    ή απαλλαγές από τον ειδικό φόρο κατανάλωσης,
    σε ορισμένα πετρελαιοειδή, και για την τροποποίηση
    της απόφασης 97/425/ΕΚ'
  type: main
- language: fi
  script: Latn
  content: '1999/255/EY: Neuvoston päätös, tehty 30 päivänä maaliskuuta 1999,
    luvan antamisesta jäsenvaltioille soveltaa tai soveltaa edelleen tiettyihin erityistarkoituksiin
    käytettyihin kivennäisöljyihin alennettuja valmisteverokantoja tai vapautuksia
    valmisteverosta direktiivissä 92/81/ETY säädetyn menettelyn mukaisesti, sekä
    päätöksen 97/425/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '1999/255/CE: Decisione del Consiglio, del 30 marzo 1999, che autorizza,
    ai sensi della direttiva 92/81/CEE, alcuni Stati membri ad applicare o a continuare
    ad applicare a determinati oli minerali riduzioni delle aliquote d''accisa o esenzioni
    dall''accisa, e che modifica la decisione 97/425/CE'
  type: main
- language: nl
  script: Latn
  content: '1999/255/EG: Beschikking van de Raad van 30 maart 1999 waarbij sommige
    lidstaten toestemming wordt verleend op bepaalde minerale oliën bestaande verlagingen
    of vrijstellingen van het accijnsrecht toe te passen en te blijven toepassen overeenkomstig
    de procedure van Richtlijn 92/81/EEG en waarbij Beschikking 97/425/EG wordt gewijzigd'
  type: main
- language: pt
  script: Latn
  content: '1999/255/CE: Decisão do Conselho, de 30 de Março de 1999, que autoriza,
    de acordo com a Directiva 92/81/CEE, alguns Estados-membros a aplicar e a continuar
    a aplicar a certos óleos minerais, as actuais taxas reduzidas ou isenções do
    imposto especial sobre o consumo, e altera a Decisão 97/425/CE'
  type: main
- language: es
  script: Latn
  content: '1999/255/CE: Decisión del Consejo, de 30 de marzo de 1999, por la que
    se autoriza a determinados Estados miembros, de conformidad con la Directiva 92/81/CEE,
    a aplicar o seguir aplicando a ciertos hidrocarburos tipos impositivos reducidos
    o exenciones del impuesto especial, y por la que se modifica la Decisión 97/425/CE'
  type: main
- language: sv
  script: Latn
  content: '1999/255/EG: Rådets beslut av den 30 mars 1999 om tillåtelse för vissa
    medlemsstater att på vissa mineraloljor, i enlighet med direktiv 92/81/EEG, tillämpa
    eller fortsätta tillämpa nedsatta punktskattesatser eller befrielse från punktskattesatser
    samt om ändring av beslut 97/425/EG'
  type: main
