title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 574/81 of 4 March 1981 correcting Regulation
    (EEC) No 3466/80 in respect of the prices for sale of certain beef and veal products
    held by intervention agencies to certain welfare institutions and bodies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 574/81 de la Commission, du 4 mars 1981, rectifiant
    le règlement (CEE) n° 3466/80 en ce qui concerne les prix de vente de certains
    produits du secteur de la viande bovine détenus par les organismes d' intervention
    à certaines institutions et collectivités à caractère social
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 574/81 der Kommission vom 4. März 1981 zur Berichtigung
    der Verordnung (EWG) Nr. 3466/80 hinsichtlich der Preise beim Verkauf von bestimmten
    durch die Interventionsstellen gelagerten Erzeugnissen des Rindfleischsektors
    zu herabgesetzten Preisen an bestimmte soziale Einrichtungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 574/81 af 4. marts 1981 om berigtigelse
    af forordning (EØF) nr. 3466/80 for så vidt angår prisen ved salg af visse
    oksekødsprodukter, som interventionsorganerne ligger inde med, til visse institutioner
    og organer med socialt formål
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 574/81 τής Επιτροπής
    τής 4ης Μαρτίου 1981 περί διορθώσεως τού κανονισμού
    (ΕΟΚ) αριθ. 3466/80 όσον αφορά τίς τιμές πωλήσεως
    ορισμένων προϊόντων τού τομέα τού βοείου κρέατος,
    τά οποία ευρίσκονται στήν κατοχή τών οργανισμών
    παρεμβάσεως, σέ ορισμένα ιδρύματα καί οργανισμούς
    κοινωνικού χαρακτήρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 574/81 della Commissione, del 4 marzo 1981, che rettifica
    il regolamento (CEE) n. 3466/80 per quanto concerne i prezzi di vendita di taluni
    prodotti del settore delle carni bovine detenuti dagli organismi d' intervento
    a determinate istituzioni ed enti di carattere sociale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 574/81 van de Commissie van 4 maart 1981 houdende
    rectificatie van Verordening (EEG) nr. 3466/80 ten aanzien van de prijzen voor
    de verkoop van bepaalde produkten van de rundvleessector die door de interventiebureaus
    zijn opgeslagen, aan bepaalde sociale instellingen en gemeenschappen
