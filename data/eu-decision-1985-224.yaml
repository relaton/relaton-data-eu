  script: Latn
  content: '85/224/EEC: Commission Decision of 28 March 1985 amending Decision 83/73/EEC
    on the establishment of a buffer zone in the region of Evros (Greece) and a financial
    contribution by the Community to measures to combat foot-and-mouth disease in
    that region (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
