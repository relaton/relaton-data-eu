title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2893/91 of 1 October 1991 fixing for the
    1991/92 marketing year the Community offer price for mandarins, including tangerines
    and satsumas, wilkings and other similar citrus hybrids, with the exception of
    clementines applicable with regard to Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2893/91 DE LA COMMISSION du 1er octobre 1991 fixant,
    pour la campagne 1991/1992, le prix d'' offre communautaire des mandarines, y
    compris tangerines et satsumas, wilkings et autres hybrides similaires d'' agrumes,
    à l'' exclusion des clémentines, applicable vis-à-vis de l'' Espagne et du
    Portugal #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2893/91 DER KOMMISSION vom 1. Oktober 1991 zur Festsetzung
    des für das Wirtschaftsjahr 1991/92 auf Spanien und Portugal anwendbaren gemeinschaftlichen
    Angebotspreises für Mandarinen, einschließlich Tangerinen und Satsumas, Wilkings
    und andere ähnliche Kreuzungen von Zitrusfrüchten, ausgenommen Clementinen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2893/91 af 1. oktober 1991 om fastsættelse
