    yougoslave de Macédoine, d''autre part, pour tenir compte des résultats des
    négociations entre les parties concernant l''établissement de concessions préférentielles
    réciproques pour certains vins, la reconnaissance, la protection et le contrôle
    réciproques des dénominations de vins, ainsi que la reconnaissance, la protection
    et le contrôle réciproques des appellations de spiritueux et de boissons aromatisées'
