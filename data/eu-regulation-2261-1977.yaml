- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2261/77 of 13 October 1977 terminating the
    conclusion of short-term private storage contracts in respect of table wine of
    type R I and table wines in close economic relationship to that type of wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2261/77 de la Commission, du 13 octobre 1977, relatif
    à la suppression de la conclusion des contrats de stockage privé à court terme
    pour le vin de table du type R I et pour les vins de table se trouvant dans une
    relation économique étroite avec celui-ci
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2261/77 der Kommission vom 13. Oktober 1977 über
    die Einstellung des Abschlusses von Verträgen für die kurzfristige private Lagerhaltung
    für Tafelwein der Art R I und für Tafelweine, die in engem wirtschaftlichem
    Zusammenhang mit dieser Weinart stehen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2261/77 af 13. oktober 1977 om ophør
    af adgangen til at indgå kortfristede kontrakter om privat oplagring af bordvin
    af typen R 1 og af bordvine, der står i nær økonomisk forbindelse med denne
    type
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2261/77 della Commissione, del 13 ottobre 1977, relativo
    alla soppressione della conclusione di contratti di magazzinaggio privato a breve
    termine per il vino da tavola del tipo R I e per i vini da tavola che sono in
    una stretta relazione economica con quest'ultimo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2261/77 van de Commissie van 13 oktober 1977 houdende
    beëindiging van de mogelijkheid tot het sluiten van kortlopende contracten voor
    de particuliere opslag van tafelwijn voor soort R I en van tafelwijn die daarmee
    in nauw economisch verband staat
