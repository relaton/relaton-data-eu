title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2224/90 of 30 July 1990 derogating for the
    1989/90 wine year from Regulation (EEC) No 3105/88 laying down detailed rules
    for the application of compulsory distillation as provided for in articles 35
    and 36 of Council Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2224/90 de la Commission du 30 juillet 1990 dérogeant
    pour la campagne viticole 1989/1990 au règlement (CEE) n° 3105/88 établissant
    les modalités d'application des distillations obligatoires visées aux articles
    35 et 36 du règlement (CEE) n° 822/87 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2224/90 DER KOMMISSION vom 30. Juli 1990 zur Abweichung
    von der Verordnung (EWG) Nr. 3105/88 mit Durchfuehrungsbestimmungen fuer die obligatorischen
    Destillationen gemaess den Artikeln 35 und 36 der Verordnung (EWG) Nr. 822/87
    des Rates im Weinwirtschaftsjahr 1989/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2224/90 af 30. juli 1990 om fravigelse
    for produktionsåret 1989/90 af forordning (EØF) nr. 3105/88 om gennemførelsesbestemmelser
    for obligatorisk destillation som omhandlet i artikel 35 og 36 i Kommissionens
    forordning (EØF) nr. 822/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2224/90 της Επιτροπής
    της 30ής Ιουλίου 1990 σχετικά με την παρέκκλιση,
    για την αμπελουργική περίοδο 1989/90, από τον κανονισμό
    (ΕΟΚ) αριθ. 3105/88 όσον αφορά τον καθορισμό των
    λεπτομερειών εφαρμογής των υποχρεωτικών αποστάξεων
    που αναφέρονται στα άρθρα 35 και 36 του κανονισμού
    (ΕΟΚ) αριθ. 822/87 του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2224/90 DELLA COMMISSIONE del 30 luglio 1990 recante
    deroghe, per la campagna viticola 1989-1990, al regolamento (CEE) n. 3105/88 che
    stabilisce le modalità d'applicazione delle distillazioni obbligatorie di cui
    agli articoli 35 e 36 del regolamento (CEE) n. 822/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2224/90 VAN DE COMMISSIE van 30 juli 1990 houdende
    afwijking, voor het wijnoogstjaar 1989/1990, van Verordening (EEG) nr. 3105/88
    tot vaststelling van de uitvoeringsbepalingen betreffende de verplichte distillatie
    als bedoeld in de artikelen 35 en 36 van Verordening (EEG) nr. 822/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2224/90 DA COMISSAO de 30 de Julho de 1990 que derroga
    para a campanha viticola de 1989/1990 o Regulamento (CEE) n* 3105/88, que estabelece
    as regras de execuçao das destilaçoes obrigatorias referidas nos artigos 35*
    e 36* do Regulamento (CEE) n* 822/87 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2224/90 DE LA COMISION de 30 de julio de 1990 por el
    que se establece, para la campana viticola de 1989/90, una excepcion a la aplicacion
    del Reglamento (CEE) no 3105/88 por el que se establecen las modalidades de aplicacion
    de las destilaciones obligatorias a que se refieren los articulos 35 y 36 del
    Reglamento (CEE) no 822/87 del Consejo
  type: main
