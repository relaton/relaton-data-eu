title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1648/81 of 19 June 1981 fixing for the third
    quarter of 1981 the quantities of high-quality, fresh, chilled or frozen beef
    and veal which may be imported under special conditions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1648/81 de la Commission, du 19 juin 1981, fixant les
    quantités de viandes bovines de haute qualité, fraîches, réfrigérées ou
    congelées pouvant être importées à des conditions spéciales pour le troisième
    trimestre de 1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1648/81 der Kommission vom 19. Juni 1981 zur Festsetzung
    der Mengen frischen, gekühlten oder gefrorenen Qualitätsrindfleisches, die für
    das dritte Vierteljahr 1981 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1648/81 af 19. juni 1981 om fastsættelse
    af de mængder fersk, kølet eller frosset oksekød af høj kvalitet, der kan
    indføres på særbetingelser i tredje kvartal af 1981
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1648/81 της Επιτροπής
    της 19ης Ιουνίου 1981 περί των ποσοτήτων βοείου
    κρέατος ανωτέρας ποιότητος, νωπού, διατηρημένου
    δι' απλής ψύξεως η κατεψυγμένου, πού δύνανται
    να εισαχθούν υπό ειδικούς όρους για το τρίτο
    τρίμηνο του 1981
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1648/81 della Commissione, del 19 giugno 1981, che
    fissa le quantità di carni bovine di qualità pregiata, fresche, refrigerate
    o congelate, che possono essere importate a condizioni speciali per il terzo trimestre
    1981
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1648/81 van de Commissie van 19 juni 1981 tot vaststelling
    van de hoeveelheid vers, gekoeld of bevroren kwaliteitsrundvlees dat in het derde
    kwartaal van 1981 op bijzondere voorwaarden kan worden ingevoerd
  type: main
