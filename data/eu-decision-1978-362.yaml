type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 February 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to trousers for men, boys, women, girls and infants, of wool,
    cotton or man-made textile fibres, falling within heading No ex 61.01 or subheading
    ex 61.02 B of the Common Customs Tariff, originating in Hong Kong and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/362/CEE: Décision de la Commission du 28 février 1978 autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les pantalons tissés pour hommes, garçonnets,
    femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, de la position Ex 61.01 et de la sous- position
    Ex 61.02 B du Tarif douanier commun, originaires de Hong-Kong et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Februar 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche lange Hosen für Männer, Knaben, Frauen, Mädchen und Kleinkinder,
    aus Wolle, aus Baumwolle oder aus synthetischen oder künstlichen Spinnstoffen
    der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 28. februar 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage vævede benklæder til mænd, drenge, kvinder, piger og småbørn,
    af uld, bomuld eller kemofibre, som henhører under pos. ex 61.01 og ex 61.02
    B i den fælles toldtarif, har oprindelse i Hongkong og frit kan omsættes i de
    andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 febbraio 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i pantaloni per uomo e per ragazzo, per donna, per
    ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale comune,
    originari di Hong Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 februari 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd geweven lange broeken, voor heren, jongens, meisjes en kinderen van
    wol, van katoen of van synthetische of kunstmatige textielvezels van de posten
    ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief, van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht van de communautaire
    behandeling uit te sluiten
  type: main
