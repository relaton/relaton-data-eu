title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2103/87 of 16 July 1987 amending Regulation
    (EEC) No 55/87 establishing the list of vessels exceeding 8 metres length overall
    permitted to use beam trawls within certain coastal areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2103/87 de la Commission du 16 juillet 1987 modifiant
    le règlement (CEE) n° 55/87 établissant la liste des bateaux dont la longueur
    hors tout dépasse huit mètres, autorisés à pêcher à l' aide de chaluts à
    perche dans certaines zones côtières de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2103/87 der Kommission vom 16. Juli 1987 zur Änderung
    der Verordnung (EWG) Nr. 55/87 zur Festlegung der Liste der Schiffe mit einer
    Länge über alles von mehr als 8 m, die in bestimmten Küstengebieten der Gemeinschaft
    mit Baumkurren fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2103/87 af 16. juli 1987 om ændring
    af forordning (EØF) nr. 55/87 om listen over fartøjer med en længde overalt
    på over 8 m, der i visse af Fællesskabets kystområder har tilladelse til at
    anvende bomtrawl
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2103/87 της Επιτροπής
    της 16ης Ιουλίου 1987 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 55/87 για την κατάρτιση του καταλόγου
    των σκαφών συνολικού μήκους άνω των οκτώ μέτρων
    τα οποία επιτρέπεται να χρησιμοποιούν δοκότρατες
    σε ορισμένες παράκτιες περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2103/87 della Commissione del 16 luglio 1987 recante
    modifica del regolamento (CEE) n. 55/87 della Commissione che fissa l' elenco
    dei pescherecci di lunghezza fuori tutto superiore a otto metri, autorizzati ad
    usare reti a strascico a pali in determinate zone costiere della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2103/87 van de Commissie van 16 juli 1987 tot wijziging
    van Verordening (EEG) nr. 55/87 tot vaststelling van de lijst van vaartuigen met
    een lengte over alles van meer dan 8 meter die in bepaalde kustzones van de Gemeenschap
    mogen vissen met de boomkor
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2103/87 da Comissão de 16 de Julho de 1987 que
    altera o Regulamento (CEE) n.° 55/87 da Comissão que estabelece a lista dos
    navios com mais de oito metros de comprimento de fora a fora autorizados a utilizar
    redes de arrasto de vara em determinadas zonas costeiras da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2103/87 de la Comisión de 16 de julio de 1987 que
    modifica al Reglamento (CEE) n° 55/87 por el que se establece la lista de barcos
    cuya eslora total exceda los ocho metros y a los que se permite utilizar artes
    de arrastre de vara dentro de determinadas zonas costeras de la Comunidad
  type: main
