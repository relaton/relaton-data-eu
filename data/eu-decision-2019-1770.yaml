    molluskeid, okasnahkseid, mantelloomi, meritigusid ja kalatooteid (teatavaks tehtud
    numbri C(2019) 7639 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/1770, annettu 23 päivänä
    lokakuuta 2019, päätöksen 2006/766/EY liitteiden muuttamisesta Ison-Britannian
    ja Pohjois-Irlannin yhdistyneen kuningaskunnan ja sen kruunun alaisuuteen kuuluvien
    alueiden sisällyttämiseksi sellaisten kolmansien maiden ja niiden alueiden luetteloon,
    joista ihmisravinnoksi tarkoitettujen simpukoiden, piikkinahkaisten, vaippaeläinten,
    merikotiloiden ja kalastustuotteiden tuonti unioniin on sallittu (tiedoksiannettu
    numerolla C(2019)7639)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/1770 оd 23. listopada 2019. o izmjeni
    prilogâ Odluci 2006/766/EZ u pogledu uvrštenja Ujedinjene Kraljevine Velike
    Britanije i Sjeverne Irske i njezinih krunskih posjeda na popise trećih zemalja
    i državnih područja iz kojih je odobreno unošenje školjkaša, bodljikaša,
    plaštenjaka, morskih puževa i proizvoda ribarstva za prehranu ljudi u Uniju
    (priopćeno pod brojem dokumenta C(2019) 7639)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1770 végrehajtási határozata (2019. október
    23.) a 2006/766/EK határozat mellékleteinek Nagy-Britannia és Észak-Írország
    Egyesült Királyságának és koronafüggőségeinek a kéthéjú kagylók, tüskésbőrűek,
    zsákállatok, tengeri haslábúak és halászati termékek Unióba történő
    behozatalára engedéllyel rendelkező harmadik országok és területek jegyzékébe
    való felvétele tekintetében történő módosításáról (az értesítés
    a C(2019) 7639. számú dokumentummal történt)
  type: main
