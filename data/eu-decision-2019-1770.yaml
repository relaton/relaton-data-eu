    ir jos Karūnos priklausinių įtraukimo į trečiųjų šalių ir teritorijų,
    iš kurių leidžiama į Sąjungą įvežti žmonėms vartoti skirtus dvigeldžius
    moliuskus, dygiaodžius, gaubtagyvius, jūrų pilvakojus ir žuvininkystės produktus,
    sąrašus iš dalies keičiami Sprendimo 2006/766/EB priedai (pranešta dokumentu
    Nr. C(2019) 7639)
  type: main
- language: mt
