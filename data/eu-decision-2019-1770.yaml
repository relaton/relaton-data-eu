    Regatului Unit al Marii Britanii și Irlandei de Nord și a teritoriilor dependente
    ale Coroanei Britanice în listele țărilor terțe și ale teritoriilor autorizate
    pentru introducerea în Uniune de moluște bivalve, echinoderme, tunicate, gasteropode
    marine și produse pescărești pentru consumul uman [notificată cu numărul
    C(2019) 7639]
  type: main
