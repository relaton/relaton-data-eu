    do Reino Unido da Grã-Bretanha e da Irlanda do Norte e das dependências da Coroa
    nas listas de países terceiros e territórios autorizados a introduzir na União
    moluscos bivalves, equinodermes, tunicados, gastrópodes marinhos e produtos da
    pesca para consumo humano [notificada com o número C(2019) 7639]
  type: main
