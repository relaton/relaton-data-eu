  script: Latn
  content: Decisione di esecuzione (UE) 2019/1770 della Commissione del 23 ottobre
    2019 che modifica gli allegati della decisione 2006/766/CE per quanto riguarda
    l’inclusione del Regno Unito di Gran Bretagna e Irlanda del Nord e delle dipendenze
    della Corona negli elenchi dei paesi terzi e dei territori autorizzati a introdurre
    nell’Unione molluschi bivalvi, echinodermi, tunicati, gasteropodi marini e prodotti
    della pesca destinati al consumo umano [notificata con il numero C(2019) 7639]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/1770 (2019. gada 23. oktobris),
    ar ko attiecībā uz Lielbritānijas un Ziemeļīrijas Apvienotās Karalistes
    un tās atkarīgo teritoriju iekļaušanu to trešo valstu un teritoriju sarakstos,
    no kurām Savienībā atļauts ievest lietošanai pārtikā paredzētas gliemenes,
    adatādaiņus, tunikātus, jūras gliemežus un zvejniecības produktus, groza
    Lēmuma 2006/766/EK pielikumus (izziņots ar dokumenta numuru C(2019) 7639)
  type: main
- language: lt
  script: Latn
