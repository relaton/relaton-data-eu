    tal-inklużjoni tar-Renju Unit tal-Gran Brittanja u l-Irlanda ta’ Fuq u tad-Dipendenzi
    tal-Kuruna tiegħu fil-listi ta’ pajjiżi terzi u territorji awtorizzati li
    jintroduċu fl-Unjoni molluski bivalvi, ekinodermi, tunikati, gastropodi tal-ibħra
    u prodotti tas-sajd għall-konsum mill-bniedem (notifikata bid-dokument C(2019)7639)
  type: main
