    om ändring av bilagorna till beslut 2006/766/EG vad gäller upptagandet av Förenade
    konungariket Storbritannien och Nordirland och dess kronbesittningar i förteckningarna
    över tredjeländer och områden från vilka musslor, tagghudingar, manteldjur,
    marina snäckor och fiskeriprodukter för användning som livsmedel får föras
    in till unionen [delgivet med nr C(2019) 7639]
