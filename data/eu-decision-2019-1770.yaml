    kráľovstva Veľkej Británie a Severného Írska a jeho korunných dependencií
    do zoznamov tretích krajín a území, z ktorých sa povoľuje vstup lastúrnikov,
    ostnatokožcov, plášťovcov, morských ulitníkov a produktov rybolovu na ľudskú
    spotrebu do Únie [oznámené pod číslom C(2019) 7639]
