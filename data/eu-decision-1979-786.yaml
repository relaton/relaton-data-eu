type: standard
title:
- language: en
  script: Latn
  content: '79/786/EEC: Commission Decision of 30 August 1979 authorizing the Kingdom
    of Denmark not to apply Community treatment to track suits of knitted or crocheted
    fabric, not elastic or rubberized, of wool, of cotton or of man-made textile fibres,
    falling within heading No ex 60.05 of the Common Customs Tariff (NIMEXE codes
    60.05-16, 17, 19) (category 73), originating in Taiwan and in free circulation
    in the other Member States (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/786/CEE: Décision de la Commission, du 30 août 1979, autorisant le
    Royaume de Danemark à exclure du traitement communautaire les survêtements de
    sport (trainings) de bonneterie non élastique ni caoutchoutée, de laine, de
    coton ou de fibres textiles synthétiques ou artificielles, de la position ex
    60.05 du tarif douanier commun (codes Nimexe : 60.05-16, 17, 19) (catégorie 73),
    originaires de T''ai-wan et mis en libre pratique dans les autres États membres
    (Le texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/786/EWG: Entscheidung der Kommission vom 30. August 1979, mit der das
    Königreich Dänemark ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Trainingsanzüge aus Gewirken, weder
    gummielastisch noch kautschutiert, aus Wolle, Baumwolle oder synthetischen oder
    künstlichen Spinnstoffen, der Tarifnummer ex 60.05 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 60.05-16 ; 17 ; 19) (Kategorie 73) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/786/EØF: Kommissionens beslutning af 30. august 1979 om bemyndigelse
    af kongeriget Danmark til fra fællesskabsbehandling at undtage træningsdragter
    af trikotage, ikke-elastisk eller gummeret, som henhører under pos. ex 60.05
    i den fælles toldtarif (NIMEXE- nummer 60.05-16, 17, 19 ; kategori 73) har oprindelse
    i Taiwan og frit kan omsættes i de øvrige medlemsstater (Kun den danske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/786/CEE: Decisione della Commissione, del 30 agosto 1979, che autorizza
    il Regno di Danimarca ad escludere dal trattamento comunitario le tute sportive
    a maglia non elastica né gommata, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della voce ex 60.05 della tariffa doganale comune (codici Nimexe:
    60.05-16, 17, 19), categoria 73, originarie di Taiwan e messe in libera pratica
    negli altri Stati membri (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/786/EEG: Beschikking van de Commissie van 30 augustus 1979 waarbij
    het Koninkrijk Denemarken wordt gemachtigd trainingspakken van niet-elastisch
    of van niet- gegummeerd brei- of haakwerk, van wol, van katoen of van synthetische
    of kunstmatige textielvezels, van post ex 60.05 van het gemeenschappelijk douanetarief
    (NIMEXE- code 60.05-16, 17, 19) (categorie 73), van oorsprong uit Taiwan en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Deense taal is authentiek)'
  type: main
