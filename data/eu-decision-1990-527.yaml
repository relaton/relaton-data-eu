title:
- language: en
  script: Latn
  content: '90/527/EEC: Commission Decision of 15 October 1990 authorizing Belgium
    to specify a minimum number of animals in the case of applications for premiums
    for maintaining suckler cows (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/527/CEE: Décision de la Commission, du 15 octobre 1990, autorisant
    la Belgique a prévoir un nombre minimal d''animaux pour les demandes de prime
    au maintien du troupeau de vaches allaitantes (Les textes en langues française
    et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/527/EWG: Entscheidung der Kommission vom 15. Oktober 1990 zur Ermächtigung
    Belgiens, für die Anträge auf Prämie für die Erhaltung des mutterkuhbestandes
    eine Minderzahl Tiere vorzusehen (Nur der französische und niederländische Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/527/EØF: Kommissionens beslutning af 15. oktober 1990 om tilladelse
    til Belgien til at fastsætte et minimumsantal af dyr for ansøgninger om præmie
    for opretholdelse af besætninger af ammekoeer (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '90/527/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Οκτωβρίου 1990 με την οποία επιτρέπεται στο Βέλγιο
    να προβλέπει έναν ελάχιστο αριθμό ζώων στις
    ετήσιες πριμοδοτήσεις για τη διατήρηση του
    πληθυσμού των θηλαζουσών αγελάδων (Τα κείμενα
    στην γαλλική και ολλανδική γλώσσα είναι τα
    μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '90/527/CEE: Decisione della Commissione, del 15 ottobre 1990, che autorizza
    il Belgio a prevedere un numero minimo di animali per le domande di premio per
    il mantenimento delle vacche nutrici (I testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '90/527/EEG: Beschikking van de Commissie van 15 oktober 1990 waarbij België
    wordt gemachtigd voor te schrijven dat de aanvragen van de premie voor het aanhouden
    van het zoogkoeienbestand op een minimum aantal dieren betrekking moeten hebben
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/527/CEE: Decisão da Comissão, de 15 de outubro de 1990, que autoriza
    a Bélgica a prever um numero mínimo de animais para os pedidos de prémio para
    a manutenção de vacas em aleitamento (Apenas fazem fé os textos nas línguas
    francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '90/527/CEE: Decisión de la Comisión, de 15 de octubre de 1990, por la
    que se autoriza a Bélgica a fijar un numero mínimo de animales para las solicitudes
    de prima especial para el mantenimiento del censo de vacas nodrizas (Los textos
    en lenguas francesa y neerlandesa son los únicos auténticos)'
  type: main
