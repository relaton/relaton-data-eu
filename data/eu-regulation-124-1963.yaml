title:
- language: fr
  script: Latn
  content: Règlement n° 124/63/CEE du Conseil, du 26 novembre 1963, modifiant le
    règlement n° 123/63/CEE du Conseil, du 14 novembre 1963, relatif à la diminution
    du montant des prélèvements envers les pays tiers applicables au porc et à
    certaines découpes de porc en ce qui concerne les importations effectuées durant
    la période du 1er au 31 décembre 1963
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 124/63/EWG des Rats vom 26. November 1963 über die Änderung
    der Verordnung Nr. 123/63/EWG des Rats vom 14. November 1963 über die Verringerung
    der Abschöpfungsbeträge gegenüber dritten Ländern für Schweine und einige
    Teilstücke von Schweinen für Einfuhren in der Zeit vom 1. bis zum 31. Dezember
    1963
  type: main
- language: it
  script: Latn
  content: Regolamento n. 124/63/CEE del Consiglio del 26 novembre 1963 che modifica
    il regolamento n. 123/63/CEE del Consiglio del 14 novembre 1963 relativo alla
    diminuzione dell'ammontare dei prelievi nei confronti dei paesi terzi applicabili
    ai suini e a taluni tagli di carne suina per le importazioni effettuate dal 1
    dicembre al 31 dicembre 1963
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 124/63/EEG van de Raad van 26 november 1963 tot wijziging
    van Verordening Nr. 123/63/EEG van de Raad van 14 november 1963 betreffende de
    verlaging van het bedrag van de heffingen ten opzichte van derde landen voor varkens
    en sommige delen van varkens voor de invoer die plaatsvindt in het tijdvak van
    1 december t/m 31 december 1963
  type: main
