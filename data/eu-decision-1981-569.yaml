  content: '81/569/EEC: Commission Decision of 6 July 1981 establishing that the apparatus
    described as ''Medical systems - neurophore BH-2; - mini frame PPS-2'' may be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/569/CEE: Décision de la Commission, du 6 juillet 1981, constatant
    que l''importation des appareils dénommés "Medical Systems - Neuro Phore BH-2;
    - Mini Frame PPS-2" peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '81/569/EWG: Entscheidung der Kommission vom 6. Juli 1981, mit der festgestellt
    wird, daß die Geräte ,,Medical Systems-Neuro Phore BH-2; -Mini Frame PPS-2"
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    können'
  type: main
- language: da
  script: Latn
  content: '81/569/EØF: Kommissionens beslutning af 6. juli 1981 om fastslåelse
    af, at indførsel af apparaterne "Medical systems, - Neuro Phore BH-2 og Mini
    Frame PPS-2", kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
