    при проверките, както и информацията и формата
    и съдържанието на заявленията за признаване
    на външни проверители от трети държави
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2026/544 ze dne 12. března
