    arvioijien järjestelmien, resurssien ja menettelyjen, niiden säännösten noudattamista
    valvovan toiminnon, sisäisten toimintatapojen ja menettelyjen sekä arvioinneissa
    käytettävien arviointimenetelmien ja tietojen asianmukaisuuden, riittävyyden
    ja vaikuttavuuden arvioimiseksi sekä kolmannen maan ulkopuolisten arvioijien
