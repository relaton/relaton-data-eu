    pokud jde o regulační technické normy upřesňující kritéria pro posuzování
    vhodnosti, přiměřenosti a účinnosti systémů, zdrojů a postupů externích
    posuzovatelů, jejich útvaru compliance, vnitřních zásad a postupů, metodik
    posuzování a informací používaných pro posouzení, jakož i informace a
    formu a obsah žádostí o uznání externích posuzovatelů ze třetích zemí
  type: main
