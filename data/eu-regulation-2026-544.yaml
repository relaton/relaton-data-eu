  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2026/544 de la Comisión, de 12 de marzo de 2026,
    por el que se completa el Reglamento (UE) 2023/2631 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación que especifican
    los criterios para evaluar la idoneidad, la adecuación y la eficacia de los sistemas,
    los recursos y los procedimientos de los verificadores externos, su función de
    verificación del cumplimiento, sus políticas y procedimientos internos, las
    metodologías de evaluación y la información utilizadas para las verificaciones,
