  script: Latn
  content: Kommissionens delegerade förordning (EU) 2026/544 av den 12 mars 2026
    om komplettering av Europaparlamentets och rådets förordning (EU) 2023/2631
    vad gäller tekniska tillsynsstandarder som specificerar kriterierna för bedömning
    av huruvida de externa granskarnas system, resurser och förfaranden är lämpliga,
    tillräckliga och effektiva, av deras funktion för regelefterlevnad, interna
    riktlinjer och förfaranden, bedömningsmetoder och information som används vid
    granskningar, samt informationen om, formuläret för och innehållet i ansökningar
    om erkännande av externa granskare i tredjeländer
