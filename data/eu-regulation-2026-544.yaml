    ceea ce privește standardele tehnice de reglementare care precizează criteriile
    de evaluare a pertinenței, adecvării și eficacității sistemelor, resurselor
    și procedurilor examinatorilor externi, a funcției de verificare a conformității
    acestora, a politicilor și procedurilor interne, a metodologiilor de evaluare
    și a informațiilor utilizate pentru examinări, precum și informațiile, forma
    și conținutul cererilor de recunoaștere a examinatorilor externi din țări
