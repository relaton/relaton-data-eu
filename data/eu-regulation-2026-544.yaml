title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/544 of 12 March 2026 supplementing
    Regulation (EU) 2023/2631 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the criteria for assessing the appropriateness,
    adequacy and effectiveness of the systems, resources and procedures of external
    reviewers, their compliance function, internal policies and procedures, assessment
    methodologies and information used for reviews, as well as the information and
    the form and content of applications for recognition of third-country external
    reviewers
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/544 de la Commission du 12 mars 2026 complétant
    le règlement (UE) 2023/2631 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les critères permettant d’évaluer
    la pertinence, l’adéquation et l’efficacité des systèmes, ressources et
    procédures des examinateurs externes, leur fonction de vérification de la conformité,
    leurs politiques et procédures internes, et les méthodes d’évaluation et
    informations qu’ils utilisent pour les examens, ainsi que les informations à
    fournir aux fins d’une demande de reconnaissance en tant qu’examinateur externe
    de pays tiers, et la forme et le contenu d’une telle demande
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/544 der Kommission vom 12. März 2026 zur
    Ergänzung der Verordnung (EU) 2023/2631 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Kriterien für
    die Beurteilung der Angemessenheit, Eignung und Wirksamkeit der Systeme, Ressourcen
    und Verfahren externer Prüfer, ihrer Compliance-Stelle, ihrer internen Strategien
    und Verfahren, der Beurteilungsmethoden und Informationen für die Prüfungen
    sowie der Informationen, der Form und des Inhalts von Anträgen auf Anerkennung
    externer Prüfer aus Drittländern
  type: main
- language: bg
  script: Cyrl
