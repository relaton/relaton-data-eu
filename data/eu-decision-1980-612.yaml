title:
- language: en
  script: Latn
  content: '80/612/EEC: Commission Decision of 5 June 1980 authorizing the French
    Republic not to apply Community treatment to cotton yarn, falling within heading
    No 55.05 of the Common Customs Tariff (category 1), originating in Mexico and
    in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/612/CEE: Décision de la Commission, du 5 juin 1980, autorisant la
    République française à exclure du traitement communautaire les fils de coton,
    de la position 55.05 du tarif douanier commun (catégorie 1), originaires du Mexique
    et mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/612/EWG: Entscheidung der Kommission vom 5. Juni 1980, mit der die
    Französische Republik ermächtigt wird, aus Mexiko stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Baumwollgarne der Tarifnummer 55.05
    des Gemeinsamen Zolltarifs (Kategorie 1) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/612/EØF: Kommissionens beslutning af 5. juni 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbe1560handling at undtage garn af
    bomuld, som henhører under pos. 55.05 i den fælles toldtarif (kategori 1), har
    oprindelse i Mexico og frit kan omsættes i de øvrige medlemsstater (Kun den
    franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/612/CEE: Decisione della Commissione, del 5 giugno 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i filati di cotone,
    della voce 55.05 della tariffa doganale comune, categoria 1, originari del Messico
    e messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/612/EEG: Beschikking van de Commissie van 5 juni 1980 waarbij de Franse
    Republiek wordt gemachtigd garens van katoen, van post 55.05 van het gemeenschappelijk
    douanetarief, categorie 1, van oorsprong uit Mexico en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
