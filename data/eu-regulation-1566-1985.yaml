    von im Besitz der italienischen Interventionsstelle befindlichem Hartweizen auf
    280 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1566/85 af 10. juni 1985 om ændring
