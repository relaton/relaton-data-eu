title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1786/1999 of 12 August 1999 determining the
    extent to which applications for import licences submitted in July 1999 for certain
    products in the milk and milk products sector under the schemes provided for in
    the Europe Agreements between the Community and Slovenia may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1786/1999 de la Commission, du 12 août 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1999 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre des régimes prévus par les accords européens entre la
    Communauté et la Slovénie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1786/1999 der Kommission vom 12. August 1999 über
    den Umfang, in dem den Anträgen auf Einfuhrlizenzen für bestimmte Milch- und
    Milcherzeugnisse stattgegeben werden kann, die im Juli 1999 im Rahmen der Regelungen
    gemäß den Europa-Abkommen zwischen der Gemeinschaft und Slowenien eingereicht
    wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1786/1999 af 12. august 1999 om fastsættelse
    af, i hvilket omfang de ansøgninger, der i juli 1999 er indgivet om importlicens
    for visse produkter i sektoren for mælk og mejeriprodukter i henhold til ordningerne
    i Europaaftalerne mellem Fællesskabet og Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1786/1999 της Επιτροπής,
    της 12ης Αυγούστου 1999, για τον προσδιορισμό
    του μέτρου κατά το οποίο μπορούν να γίνονται
    δεκτές οι αιτήσεις πιστοποιητικών εισαγωγής
    που υπεβλήθησαν τον Ιούλιο του 1999 για ορισμένα
    προϊόντα στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων στο πλαίσιο των καθεστώτων που προβλέπονται
    από τις ευρωπαϊκές συμφωνίες μεταξύ της Κοινότητας
    και της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1786/1999, annettu 12 päivänä elokuuta 1999,
    yhteisön sekä Slovenian määrätyn järjestelmän mukaisesti tietyistä maito-
    ja maitotuotealan tuotteista vuoden 1999 heinäkuussa jätettyjen tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1786/1999 della Commissione, del 12 agosto 1999, che
    stabilisce la misura in cui possono essere accettate le domande di titoli d'importazione
    presentate nel luglio 1999 per taluni prodotti del settore del latte e del settore
    lattiero-caseario nel quadro dei regimi previsti dagli accordi europei tra la
    Comunità e la Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1786/1999 van de Commissie van 12 augustus 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector melk en zuivelproducten,
    die in juli 1999 worden ingediend op grond van de regelingen waarin is voorzien
    bij de Europaovereenkomsten tussen, enerzijds, de Gemeenschap en, anderzijds,
    Slovenië
  type: main
