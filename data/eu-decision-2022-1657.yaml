    pierādīt atbilstību Eiropas Parlamenta un Padomes Direktīvas (ES) 2018/2001
    prasībām attiecībā uz biodegvielām, bioloģiskajiem šķidrajiem kurināmajiem,
    biomasas kurināmajiem/degvielām, nebioloģiskas izcelsmes atjaunīgajām šķidrajām
    un gāzveida degvielām un reciklēta oglekļa degvielām
  type: main
