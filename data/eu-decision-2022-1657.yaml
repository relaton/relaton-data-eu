    a folyékony bio-energiahordozókra, a biomasszából előállított üzemanyagokra,
    a nem biológiai eredetű, folyékony vagy gáznemű, megújuló energiaforrásból
    származó üzemanyagokra és a széntartalom újrahasznosításával nyert üzemanyagokra
    vonatkozó követelményeknek való megfelelést igazoló „Sustainable Biomass
    Program” önkéntes rendszer elismeréséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1657 della Commissione del 26 settembre
    2022 relativa al riconoscimento del sistema volontario «Sustainable Biomass Program»
    per dimostrare il rispetto dei requisiti della direttiva (UE) 2018/2001 per i
    biocarburanti, i bioliquidi, i combustibili da biomassa, i carburanti rinnovabili
    liquidi e gassosi di origine non biologica e i carburanti derivanti da carbonio
    riciclato
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1657 (2022. gada 26. septembris)
