    dobrovoljnog programa „Održiva biomasa” za dokazivanje sukladnosti sa zahtjevima
    iz Direktive (EU) 2018/2001 Europskog parlamenta i Vijeća za biogoriva, tekuća
    biogoriva, goriva iz biomase, obnovljiva tekuća i plinovita goriva nebiološkog
    podrijetla te goriva iz recikliranog ugljika
  type: main
- language: hu
