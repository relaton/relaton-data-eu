title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1657 of 26 September 2022 on
    the recognition of the Sustainable Biomass Program voluntary scheme for demonstrating
    compliance with the requirements of Directive (EU) 2018/2001 of the European Parliament
    and of the Council for biofuels, bioliquids, biomass fuels, renewable liquid and
    gaseous fuels of non-biological origin and recycled carbon fuels
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1657 de la Commission du 26 septembre
    2022 portant reconnaissance du système volontaire «Sustainable biomass program»
    pour l’établissement de la conformité avec les exigences de la directive (UE)
    2018/2001 du Parlement européen et du Conseil en ce qui concerne les biocarburants,
    les bioliquides, les combustibles issus de la biomasse, les carburants liquides
    et gazeux renouvelables d’origine non biologique et les combustibles ou carburants
    à base de carbone recyclé
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1657 der Kommission vom 26. September
    2022 über die Anerkennung des freiwilligen Systems „Sustainable Biomass Program“
    zum Nachweis der Einhaltung der in der Richtlinie (EU) 2018/2001 des Europäischen
    Parlaments und des Rates festgelegten Anforderungen für Biokraftstoffe, flüssige
    Biobrennstoffe, Biomasse-Brennstoffe, flüssige oder gasförmige erneuerbare Kraftstoffe
    nicht biogenen Ursprungs und wiederverwertete kohlenstoffhaltige Kraftstoffe
  type: main
