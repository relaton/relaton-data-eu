    Inbhuanaithe chun a léiriú go bhfuil ceanglais Threoir (AE) 2018/2001 ó Pharlaimint
    na hEorpa agus ón gComhairle maidir le bithbhreoslaí, bithleachtanna, breoslaí
    bithmhaise, breoslaí in-athnuaite leachtacha agus gásacha de thionscnamh neamh-bhitheolaíoch
