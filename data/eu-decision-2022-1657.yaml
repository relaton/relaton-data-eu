    atitikčiai Europos Parlamento ir Tarybos direktyvoje (ES) 2018/2001 nustatytiems
    biodegalų, skystųjų bioproduktų, biomasės kuro, iš atsinaujinančiųjų
    išteklių pagaminto nebiologinės kilmės skystojo ir dujinio kuro bei perdirbtos
