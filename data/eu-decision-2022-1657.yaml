    vahvistettujen vaatimusten noudattamisen osoittamista varten biopolttoaineiden,
    bionesteiden, biomassapolttoaineiden, muuta kuin biologista alkuperää olevien
    uusiutuvien nestemäisten ja kaasumaisten polttoaineiden ja kierrätettyjen hiilipitoisten
    polttoaineiden osalta
  type: main
