  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1047/70 der Kommission vom 4. Juni 1970 zur Ergänzung
    der Verordnung (EWG) Nr. 772/70 über eine Dauerausschreibung zum Verkauf von
    Weißzucker, der zur Ausfuhr bestimmt ist und sich im Besitz der französischen
    Interventionsstelle befindet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1047/70 della Commissione, del 4 giugno 1970, che
