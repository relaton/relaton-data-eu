    vendita di zucchero bianco destinato all'esportazione e detenuto dall'organismo
    d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1047/70 van de Commissie van 4 juni 1970 tot aanvulling
    van Verordening (EEG) nr. 772/70 betreffende een permanente openbare inschrijving
    voor de verkoop van witte suiker bestemd voor de uitvoer en in het bezit van het
    Franse interventiebureau
