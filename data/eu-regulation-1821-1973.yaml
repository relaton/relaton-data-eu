title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1821/73 of the Commission of 5 July 1973 laying down
    detailed rules for the application of the premium system for the conversion of
    dairy herds to meat production and of development premium for the specialized
    raising of cattle for meat production
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1821/73 de la Commission, du 5 juillet 1973, établissant
    des modalités d' application relatives au régime de prime à la reconversion,
    vers la production de viande, de troupeaux bovins à orientation laitière et
    de prime de l' élevage bovin spécialisé vers la production de viande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1821/73 der Kommission vom 5. Juli 1973 betreffend
    Durchführungsbestimmungen zu der Prämienregelung für die Umstellung von Milchkuhbeständen
    auf Bestände zur Fleischerzeugung und zu der Prämienregelung zur Förderung
    der speziell auf die Fleischerzeugung ausgerichteten Rinderaufzucht
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1821/73 af 5. juli 1973 om gennemførelsesbestemmelserne
    til præmieordningen for omlægning af besætninger af mælkekvæg til kødproduktion
    og for opdræt af kvæg specielt til kødproduktion
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1821/73 della Commissione, del 5 luglio 1973, che
    stabilisce le modalità di applicazione relative al regime di premio per la riconversione
    di mandrie bovine ad orientamento lattiero verso la produzione di carni e di premio
    allo sviluppo dell' allevamento bovino specializzato nella produzione di carne
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1821/73 van de Commissie van 5 juli 1973 tot vaststelling
    van de uitvoeringsbepalingen met betrekking tot het stelsel van premies voor de
    omschakeling van de melkveestapel op de rundvleesproduktie en van premies voor
    de ontwikkeling van de teelt van rundvee bestemd voor de vleesproduktie
  type: main
