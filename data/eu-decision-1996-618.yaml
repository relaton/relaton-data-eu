  script: Latn
  content: '96/618/EC: Commission Decision of 16 October 1996 authorizing the Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of potatoes, other than potatoes intended for planting originating
    in the Republic of Senegal'
  type: main
- language: fr
  script: Latn
  content: '96/618/CE: Décision de la Commission du 16 octobre 1996 autorisant les
    États membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil pour ce qui concerne les pommes de terre, autres que les
    pommes de terre destinées à la plantation, originaires de la République du
    Sénégal'
