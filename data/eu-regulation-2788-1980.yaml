title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2788/80 of 30 October 1980 re-establishing
    the levying of customs duties on glazed setts, flags and paving, hearth and wall
    tiles, falling within heading No 69.08 and originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2788/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2788/80 de la Commission, du 30 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position 69.08 du tarif
    douanier commun, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2788/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2788/80 der Kommission vom 30. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, der Tarifnummer 69.08 mit Ursprung in Entwicklungsländern, denen die
    in der Verordnung (EWG) Nr. 2788/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2788/80 af 30. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for glaserede sten og fliser til brobelægning,
    gulvbelægning eller beklædning af vægge, kaminer o.lign., under pos 69.08,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 2788/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2788/80 della Commissione, del 30 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle altre piastrelle,
    ai blocchetti e alle lastre da pavimentazione o da rivestimento, della voce 69.08
    della tariffa doganale comune, originari dei paesi in via di sviluppo, beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2788/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2788/80 van de Commissie van 30 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor andere plavuizen en andere
    vloer- en wandtegels van post 69.08, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2788/79 van de Raad tariefpreferenties
    werden geopend
  type: main
