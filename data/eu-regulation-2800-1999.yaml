    säädetyn tuen maksamista toisen jäsenvaltion alueella denaturoidulle tai rehuseoksiksi
    jalostetulle rasvattomalle maitojauheelle, ja asetuksen (ETY) N:o 1624/76 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2800/1999 della Commissione, del 17 dicembre 1999,
