title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2800/1999 of 17 December 1999 establishing
    transitional arrangements for the aid payment provided for in Council Regulation
    (EC) No 1255/1999 in respect of skimmed-milk powder denatured or processed into
    compound feedingstuffs in another Member State and repealing Regulation (EEC)
    No 1624/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2800/1999 de la Commission, du 17 décembre 1999, établissant
    un régime transitoire en ce qui concerne le paiement de l'aide prévue par le
    règlement (CE) nº 1255/1999 du Conseil pour le lait écrémé en poudre dénaturé
    ou transformé en aliments composés pour animaux sur le territoire d'un autre
    État membre et abrogeant le règlement (CEE) nº 1624/76
  type: main
- language: de
  script: Latn
