title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 septembre 1963, relative au recours de
    la République fédérale d'Allemagne à l'article 115 alinéa I du Traité, pour
    exclure du traitement communautaire les carpes originaires de la Yougoslavie et
    mises en libre circulation dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '63/541/EWG: Entscheidung der Kommission vom 18. September 1963 betreffend
    die Inanspruchnahme von Artikel 115 Absatz (1) des Vertrages durch die Bundesrepublik
    Deutschland, um aus Jugoslawien stammende Karpfen, die in den anderen Mitgliedstaaten
    in den freien Verkehr gebracht wurden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '63/541/CEE: Decisione della Commissione del 18 settembre 1963 relativa
    al ricorso presentato dalla Repubblica federale di Germania ai sensi dell''articolo
    115, primo comma, del Trattato, al fine di escludere dal trattamento comunitario
    le carpe provenienti dalla Iugoslavia immesse in libera pratica negli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: '63/541/EEG: Beschikking van de Commissie van 18 september 1963 betreffende
    het beroep van de Bondsrepubliek Duitsland op artikel 115, eerste alinea, van
    het Verdrag om karpers van oorsprong uit Joegoslavië en in de andere Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
