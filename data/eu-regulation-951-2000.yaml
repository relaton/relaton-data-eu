title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 951/2000 of 5 May 2000 laying down rates
    of compensatory interest applicable during the second half of 2000 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 951/2000 de la Commission du 5 mai 2000 fixant les
    taux d'intérêts compensatoires applicables en cas de naissance d'une dette douanière
    relative aux produits compensateurs ou aux marchandises en l'état (régime du
    perfectionnement actif, système de la suspension et régime de l'admission temporaire)
    pendant le deuxième semestre de 2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 951/2000 der Kommission vom 5. Mai 2000 mit Sätzen
    von Ausgleichszinsen, die im zweiten Halbjahr 2000 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveränderte Waren (aktiver Veredelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 951/2000 af 5. maj 2000 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukter eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i andet halvår af 2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 951/2000 της Επιτροπής,
    της 5ης Μαΐου 2000, για τον καθορισμό εξισωτικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή αρχικά εμπορεύματα (καθεστώς τελειοποίησης
    προς επανεξαγωγή και προσωρινής εισαγωγής)
    κατά τη διάρκεια του δεύτερου εξάμηνου 2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 951/2000, annettu 5 päivänä toukokuuta 2000,
    vuoden 2000 toisella kalenterivuosipuoliskolla sovellettavista jalostetuista tuotteista
    tai samassa tilassa olevista tavaroista syntyvän tullivelan hyvityskorkokannoista
    (sisäisen jalostuksen vapautusjärjestelmä, suspensiojärjestelmä ja väliaikainen
    maahantuonti)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 951/2000 della Commissione, del 5 maggio 2000, che
    determina i tassi di interesse compensatori applicabili ove sorga un'obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo e ammissione temporanea) nel secondo semestre 2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 951/2000 van de Commissie van 5 mei 2000 tot vaststelling
    van de jaarlijkse intrestpercentages van toepassing in geval van het ontstaan
    van een douaneschuld voor veredelingsproducten of onveredelde goederen (regeling
    actieve veredeling en tijdelijke invoer) tijdens het tweede semester 2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 951/2000 da Comissão, de 5 de Maio de 2000, que fixa
    as taxas de juro de compensação aplicáveis aos casos de constituição de uma
    dívida aduaneira relativa a produtos compensadores ou a mercadorias no seu estado
    inalterado (regime do aperfeiçoamento activo e importação temporária) durante
    o segundo semestre de 2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 951/2000 de la Comisión, de 5 de mayo de 2000, por
    el que se fijan los tipos de interés compensatorio aplicables en caso de nacimiento
    de una deuda aduanera relativa a los productos compensadores o a las mercancías
    sin transformar (régimen de perfeccionamiento activo e importación temporal)
    durante el segundo semestre de 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 951/2000 av den 5 maj 2000 om fastställande
    av kompensationsräntor som skall tillämpas under andra hälften av 2000 på
    tullskulder som uppkommit för förädlingsprodukter eller varor i obearbetat
    skick (vid aktiv förädling, suspension och temporär import)
  type: main
