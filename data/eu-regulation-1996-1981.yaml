title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1996/81 of 15 July 1981 re-establishing
    the levying of customs duties on other made up textile articles, products of category
    112 (code 1120), originating in Malaysia, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1996/81 de la Commission, du 15 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus de la catégorie 112 (code 1120), originaires de Malaysia,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1996/81 der Kommission vom 15. Juli 1981 über die
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben
    der Warenkategorie Nr. 112 (Kennziffer 1120), mit Ursprung in Malaysia, dem die
    in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1996/81 af 15. juli 1981 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer under kategori
    112 (kode 1120), som har oprindelse i Malaysia og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1996/81 τής Επιτροπής
    τής 15ης Ιουλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά έτερα είδη
    έτοιμα, εξ υφασμάτων, τών προϊόντων τής κατηγορίας
    αριθ. 112 (κώδικας 1120), καταγωγής Μαλαισίας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου, δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1996/81 della Commissione, del 15 luglio 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, della categoria di prodotti n. 112 (codice 1120), originari della
    Malaysia, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1996/81 van de Commissie van 15 juli 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels van de categorie van produkten nr. 112 (codenummer 1120),
    van oorsprong uit Maleisië, waarvoor de algemene tariepreferenties gelden als
    bepaald bij Verordening (EEG) nr. 320/80 van de Raad
  type: main
