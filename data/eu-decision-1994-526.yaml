title:
- language: en
  script: Latn
  content: '94/526/EC: Commission Decision of 27 July 1994 approving the programme
    for the eradication and surveillance of bovine brucellosis presented by Portugal
    and fixing the level of the Community'' s financial contribution (Only the Portuguese
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/526/CE: Décision de la Commission, du 27 juillet 1994, portant approbation
    du programme d''éradication de la brucellose bovine présenté par le Portugal
    et fixant le niveau de la participation financière de la Communauté et abrogeant
    la décision 92/301/CEE (Le texte en langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/526/EG: Entscheidung der Kommission vom 27. Juli 1994 zur Genehmigung
    des von Portugal vorgelegten Programms zur Tilgung der Rinderbrucellose sowie
    zur Festlegung der finanziellen Beteiligung der Gemeinschaft und zur Aufhebung
    der Entscheidung 92/301/EWG (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/526/EF: Kommissionens beslutning af 27. juli 1994 om godkendelse af
    det af Portugal forelagte program for udryddelse af kvægbrucellose og om fastsættelse
    af EF- tilskuddet og ophævelse af Kommissions beslutning 92/301/EØF (Kun den
    portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '94/526/ΕΚ: Απόφαση της Επιτροπής της 27ης Ιουλίου
    1994 για την έγκριση προγράμματος εξάλειψης
    της βρουκέλλωσης των βοοειδών που υπέβαλε
    η Πορτογαλία και για τον καθορισμό του ύψους
    της χρηματοδοτικής συμμετοχής της Κοινότητας
    και για την κατάργηση της απόφασης 92/301/ΕΟΚ
    της Επιτροπής (Το κείμενο στην πορτογαλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '94/526/CE: Decisione della Commissione, del 27 luglio 1994, che approva
    il programma per l''eradicazione e la sorveglianza della brucellosi bovina presentato
    dal Portogallo e che fissa il livello di partecipazione finanziaria della Comunità
    e recante abrogazione della decisione 92/301/CEE (Il testo in lingua Portoghese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '94/526/EG: Beschikking van de Commissie van 27 juli 1994 tot goedkeuring
    van het door Portugal ingediende programma voor de uitroeiing van runderbrucellose
    en tot vaststelling van de hoogte van de financiële bijdrage van de Gemeenschap
    en tot intrekking van Beschikking 92/301/EEG (Slechts de tekst in de Portugese
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '94/526/CE: Decisão da Comissão, de 27 de Julho de 1994, que aprova o
    programa de erradicação de brucelose bovina apresentado por Portugal, fixa o
    nível da participação financeira da Comunidade e revoga a Decisão 92/301/CEE
    (Apenas faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '94/526/CE: Decisión de la Comisión, de 27 de julio de 1994, por la que
    se aprueba el programa presentado por Portugal para la erradicación y vigilancia
    de la brucelosis bovina y por la que se fija el nivel de participación financiera
    de la Comunidad y se deroga la Decisión 92/301/CEE de la Comisión (El texto
    en lengua portuguesa es el único auténtico)'
