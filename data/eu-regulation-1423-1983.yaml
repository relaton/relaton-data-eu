title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1423/83 of 2 June 1983 re-establishing the
    levying of customs duties on woven suits and costumes, products of category 29
    (code 0290), originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1423/83 de la Commission du 2 juin 1983 portant rétablissement
    de la perception des droits de douane applicables aux costumes-tailleurs, tissés,
    de la catégorie 29 (code 0290), originaires de Thaïlande, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1423/83 der Kommission vom 2. Juni 1983 über die
    Wiedereinführung des Zollsatzes für Kostüme und Hosenanzüge, aus Geweben,
    der Warenkategorie Nr. 29 (Kennziffer 0290), mit Ursprung in Thailand, dem die
    in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1423/83 af 2. juni 1983 om genindførelse
    af opkrævning af toldafgifter for dragter og kostumer, vævede, under kategori
    nr. 29 (kode 0290), som har oprindelse i Thailand og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1423/83 της Επιτροπής
    της 2ας Ιουνίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για κοστούμια—ταγιέρ
    υφασμένα, της κατηγορίας 29 (κωδικός αριθμός
    0290), καταγωγής Ταϋλάνδης, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1423/83 della Commissione del 2 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli abiti a giacca e completi della
    categoria di prodotti n. 29 (codice 0290), originari della Tailandia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1423/83 van de Commissie van 2 juni 1983 houdende
    wederinstelling van de heffing van de invoerrrechten van toepassing op geweven
    mantelpakken en broekpakken van de categorie van produkten nr. 29 (codenummer
    0290), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
