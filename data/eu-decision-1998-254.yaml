title:
- language: en
  script: Latn
  content: '98/254/EC: Commission Decision of 25 March 1998 authorising the Member
    States to permit temporarily the marketing of seed of field pea (Pisum sativum
    L.) not satisfying the requirements of Council Directive 66/401/EEC'
  type: main
- language: fr
  script: Latn
  content: '98/254/CE: Décision de la Commission du 25 mars 1998 autorisant les États
    membres à admettre temporairement la commercialisation de semences de pois fourragers
    (Pisum sativum L.) ne répondant pas aux exigences de la directive 66/401/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '98/254/EG: Entscheidung der Kommission vom 25. März 1998 zur Ermächtigung
