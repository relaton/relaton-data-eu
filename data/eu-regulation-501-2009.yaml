title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 501/2009 of 15 June 2009 implementing Article
    2(3) of Regulation (EC) No 2580/2001 on specific restrictive measures directed
    against certain persons and entities with a view to combating terrorism and repealing
    Decision 2009/62/EC
  type: main
- language: fr
  script: Latn
