    l’article 2, paragraphe 3, du règlement (CE) n o 2580/2001 concernant l’adoption
    de mesures restrictives spécifiques à l’encontre de certaines personnes et
    entités dans le cadre de la lutte contre le terrorisme, et abrogeant la décision
    2009/62/CE
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 501/2009 des Rates vom 15. Juni 2009 zur Durchführung
