title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 466/78 of 6 March 1978 re-establishing the
    levying of customs duties on nets and netting made of twine, cordage or rope,
    etc., falling within heading No 59.05 originating in the Philippines, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2706/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 466/78 de la Commission, du 6 mars 1978, portant rétablissement
    de la perception des droits de douane applicables aux filets, fabriqués à l'aide
    des matières reprises au n° 59.04, en nappes, etc., de la position tarifaire
    59.05, originaires des Philippines, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 466/78 der Kommission vom 6. März 1978 über die
    Wiedereinführung des Zollsatzes für Netze aus Waren der Tarifnummer 59.04, in
    Stücken usw., der Tarifnummer 59.05, mit Ursprung in den Philippinen, denen die
    in der Verordnung (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 466/78 af 6. marts 1978 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn, reb og tovværk,
    etc., under position 59.05, som har oprindelse i Filippinerne og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 466/78 della Commissione, del 6 marzo 1978, che ripristina
    la riscossione dei dazi doganali applicabili alle reti, ottenute con l'impiego
    di manufatti previsti dalla voce 59.04, in strisce, ecc. della voce doganale 59.05,
    originarie delle Filippine beneficiarie delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 466/78 van de Commissie van 6 maart 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op netten,
    vervaardigd van produkten bedoeld bij post 59.04, in banen, enz., van post 59.05,
    van oorsprong uit de Filippijnen, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2706/77 van de Raad
  type: main
