    ( ΕΟΚ ) αριθ. 2826/77 με τον οποίο θεσπίζεται έντυπο
    δήλωσης κοινοτικής διαμετακόμισης το οποίο
    μπορεί να χρησιμοποιηθεί σε σύστημα αυτόματης
    ή ηλεκτρονικής επεξεργασίας των πληροφοριών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 607/78 della Commissione, del 29 marzo 1978, che modifica
    il regolamento (CEE) n. 2826/77 che istituisce un formulario di dichiarazione
    di transito comunitario utilizzabile in un sistema di trattamento automatico o
    elettronico delle informazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 607/78 van de Commissie van 29 maart 1978 houdende
    wijziging van Verordening (EEG) nr. 2826/77 tot instelling van een formulier van
    aangifte voor communautair douanevervoer dat kan worden gebruikt in een systeem
    van automatische of elektronische informatieverwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 607/78 da Comissão, de 29 de Março de 1978, que
    altera o Regulamento (CEE) n.° 2826/77 que institui um formulário de declaração
    de trânsito comunitário susceptível de utilização num sistema de tratamento
    automático ou electrónico das informações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 607/78 de la Comisión, de 29 de marzo de 1978, por
    el que se modifica el Reglamento (CEE) n° 2826/77 que establece un formulario
    de declaración de tránsito comunitario que puede utilizarse en un sistema de
    tratamiento automático o electrónico de la información
  type: main
