  content: Commission Regulation (EEC) No 607/78 of 29 March 1978 amending Regulation
    (EEC) No 2826/77 introducing a Community transit declaration form for use in an
    automatic or electronic data-processing system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 607/78 de la Commission, du 29 mars 1978, modifiant
    le règlement (CEE) n° 2826/77 instituant un formulaire de déclaration de transit
    communautaire pouvant être utilisé dans un système de traitement automatique
    ou électronique des informations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 607/78 der Kommission vom 29. März 1978 zur Änderung
    der Verordnung (EWG) Nr. 2826/77 zur Einführung eines datenverarbeitungsgerechten
    Vordrucks für die Anmeldung zum gemeinschaftlichen Versandverfahren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 607/78 af 29. marts 1978 om ændring
    af forordning (EØF) nr. 2826/77 om indførelse af en angivelsesblanket for fællesskabsforsendelse,
    som kan anvendes i et automatisk eller elektronisk databehandlingssystem
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 607/78 της Επιτροπής,
