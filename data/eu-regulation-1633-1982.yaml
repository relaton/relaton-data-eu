title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1633/82 of 23 June 1982 imposing a provisional
    anti-dumping duty on imports of fibre building board (hardboard) originating in
    Romania, repealing Commission Decision No 80/564/EEC of 4 June 1980 and accepting
    undertakings in connection with the proceeding in respect of imports of fibre
    building board from Czechoslovakia, Finland, Hungary, Norway, Poland, Spain, Sweden
    and the Soviet Union and terminating the proceeding with regard to those countries
    and Bulgariae
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1633/82 de la Commission, du 23 juin 1982, portant
    institution d' un droit anti-"dumping" provisoire à l' égard des importations
    de panneaux de fibres (panneaux durs) originaires de Roumanie, abrogeant la décision
    80/564/CEE de la Commission du 4 juin 1980 et portant, d' une part, acceptation
    des engagements souscrits dans le cadre de procédures concernant les importations
    de panneaux de fibres originaires d' Espagne, de Finlande, de Hongrie, de Norvège,
    de Pologne, de Suède, de Tchécoslovaquie et d' Union soviétique et, d' autre
    part, clôture de la procédure à l' égard de ces pays et de la Bulgarieo
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1633/82 der Kommission vom 23. Juni 1982 über die
    Einführung eines vorläufigen Antidumpingzolls auf Platten aus Fasern (Hartplatten)
    mit Ursprung in Rumänien in Aufhebung des Kommissionsbeschlusses 80/564/EWG vom
    4. Juni 1980 und die Annahme von Verpflichtungen im Zusammenhang mit den Antidumpingverfahren
    betreffend Einfuhren von Platten aus Fasern mit Ursprung in Finnland, Norwegen,
    Polen, Ungarn, Schweden, der Sowjetunion, Spanien und der Tschechoslowakei und
    die Einstellung des Antidumpingverfahrens gegen diese Länder und Bulgarienc
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1633/82 af 23. juni 1982 om indførelse
    af en midlertidig antidumpingtold på import af fiberplader (hårde plader) med
    oprindelse i Rumænien, om ophævelse af Kommissionens afgørelse 80/564/EØF
    af 4. juni 1980, om godtagelse af tilsagn i forbindelse med proceduren vedrørende
    indførsel af fiberplader fra Finland, Norge, Polen, Sovjetunionen, Spanien, Sverige,
    Tjekkoslovakiet og Ungarn og om afslutning af proceduren med hensyn til disse
    lande og Bulgarienm
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1633/82 τής Επιτροπής
    τής 23ης Ιουνίου 1982 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στίς εισαγωγές οικοδομικών
    πλακών—διαφραγμάτων εξ ινών (ινοπλακών) καταγωγής
    Ρουμανίας, περί ανακλήσεως τής αποφάσεως 80/564/EOK
    τής Επιτροπής τής 4ης Ιουνίου 1980 καί περί αποδοχής
    αναλήψεων υποχρεώσεων όσον αφορά τήν έρευνα
    γιά τίς εισαγωγές οικοδομικών πλακών—διαφραγμάτων
    εξ ινών από τήν Τσεχοσλοβακία, τή Φινλανδία,
    τήν Ουγγαρία, τή Νορβηγία, τήν Πολωνία, τήν
    Ισπανία, τή Σουηδία καί τή Σοβιετική Ένωση
    καθώς καί περί περατώσεως τής έρευνας όσον
    αφορά τίς χώρες αυτές καί τή Βουλγαρία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1633/82 della Commissione, del 23 giugno 1982, che
    istituisce un dazio antidumping provvisorio sulle importazioni di pannelli di
    fibre (pannelli duri originari della Romania), annulla la decisione 80/564/CEE
    della Commissione, del 4 giugno 1980, reca accettazione degli impegni assunti
    dagli esportatori nell' ambito della procedura relativa alle importazioni di pannelli
    di fibre originari della Cecoslovacchia, della Finlandia, dell' Ungheria, della
    Norvegia, della Polonia, della Spagna, della Svezia e dell' Unione Sovietica e
    chiude la procedura relativa a tali paesi ed alla Bulgaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1633/82 van de Commissie van 23 juni 1982 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van vezelplaat (zogenaamde
    hardboardplaten) van oorsprong uit Roemenië, houdende intrekking van Besluit
    80/564/EEG van de Commissie van 4 juni 1980 houdende aanvaarding van verbintenissen
    in verband met de procedure ten aanzien van de invoer van vezelplaat uit Tsjechoslowakije,
    Finland, Hongarije, Noorwegen, Polen, Spanje, Zweden en de Sowjetunie en houdende
    beëindiging van de procedure ten aanzien van deze landen en Bulgarije
  type: main
