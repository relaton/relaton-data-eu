title:
- language: en
  script: Latn
  content: '84/58/EEC: Commission Decision of 27 January 1984 authorizing the United
    Kingdom temporarily to take additional measures to protect itself against the
    introduction of ''Puccinia horiana'' (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/58/CEE: Décision de la Commission du 27 janvier 1984 autorisant provisoirement
    le Royaume-Uni à prendre des dispositions complémentaires en vue de se préserver
    contre l''introduction du Puccinia horiana (Le texte en langue anglaise est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/58/EWG: Entscheidung der Kommission vom 27. Januar 1984 zur Ermächtigung
    des Vereinigten Königreichs, zum Schutz gegen die Einschleppung von Puccinia
    horiana vorübergehend ergänzende Maßnahmen zu treffen (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/58/EØF: Kommissionens beslutning af 27. januar 1984 om bemyndigelse
    af Det forenede Kongerige til midlertidigt at træffe supplerende foranstaltninger
    for at beskytte sig mod indslæbning af Puccinia horiana (Kun den engelske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/58/ΕΟΚ: Απόφαση της Επιτροπής της 27ης Ιανουαρίου
    1984 περί παροχής προσωρινής άδειας στο Ηνωμένο
    Βασίλειο να λάβει πρόσθετα μέτρα για να προστατευθεί
    από την εισαγωγή της Puccinia horiana (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/58/CEE: Decisione della Commissione del 27 gennaio 1984 che autorizza
    il Regno Unito ad adottare a titolo provvisorio disposizioni complementari per
    premunirsi contro l''introduzione di "Puccinia horiana" (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/58/EEG: Beschikking van de Commissie van 27 januari 1984 tot machtiging
    van het Verenigd Koninkrijk om voorlopig aanvullende beschermende maatregelen
    te nemen tegen het binnenbrengen van Puccinia horiana op zijn grondgebied (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '84/58/CEE: Decisión de la Comisión de 27 de enero de 1984, por la que
    se autoriza provisionalmente al Reino Unido a adoptar disposiciones complementarias
    para protegerse contra la introducción de puccinia horiana (El texto en lengua
    inglesa es el único auténtico)'
  type: main
