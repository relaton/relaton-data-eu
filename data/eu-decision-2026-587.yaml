title:
- language: en
  script: Latn
  content: Council Decision (EU) 2026/587 of 9 March 2026 authorising the opening
    of negotiations for an agreement between the European Union and Ukraine laying
    down the rules for the participation of Ukraine in the GOVSATCOM component of
    the Union Space Programme and in the Union Secure Connectivity Programme, and
    for access to GOVSATCOM services and to the governmental services of the Union
    Secure Connectivity Programme
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/587 du Conseil du 9 mars 2026 autorisant l’ouverture
    de négociations en vue d’un accord entre l’Union européenne et l’Ukraine
    établissant les règles régissant la participation de l’Ukraine à la composante
    GOVSATCOM du programme spatial de l’Union et au programme de l’Union pour
    une connectivité sécurisée, ainsi que l’accès aux services GOVSATCOM et
    aux services gouvernementaux du programme de l’Union pour une connectivité
    sécurisée
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/587 des Rates vom 9. März 2026 über die Ermächtigung
    zur Aufnahme von Verhandlungen über ein Abkommen zwischen der Europäischen Union
    und der Ukraine, in dem die Regeln für die Teilnahme der Ukraine an der GOVSATCOM-Komponente
    des Weltraumprogramms der Union und am Programm der Union für sichere Konnektivität
    sowie für den Zugang zu den GOVSATCOM-Diensten und den im Rahmen des Programms
    der Union für sichere Konnektivität bereitgestellten staatlichen Diensten festgelegt
    werden
  type: main
- language: bg
  script: Cyrl
