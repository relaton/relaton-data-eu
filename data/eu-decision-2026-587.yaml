    sopimuksesta, jossa vahvistetaan Ukrainan osallistumista unionin avaruusohjelman
    GOVSATCOM-komponenttiin ja unionin turvallisten yhteyksien ohjelmaan sekä pääsyä
    GOVSATCOM-palveluihin ja unionin turvallisten yhteyksien ohjelman valtiollisiin
    palveluihin koskevat säännöt
  type: main
