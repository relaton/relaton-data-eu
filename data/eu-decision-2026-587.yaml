    za sudjelovanje Ukrajine u komponenti GOVSATCOM Svemirskog programa Unije i u
    Programu Unije za sigurnu povezivost, te za pristup uslugama GOVSATCOM-a i uslugama
    za državne potrebe koje se pružaju u okviru Programa Unije za sigurnu povezivost
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2026/587 határozata (2026. március 9.) az Ukrajnának
    az uniós űrprogram GOVSATCOM-komponensében és az uniós biztonságos konnektivitási
    programban való részvételére, valamint a GOVSATCOM-szolgáltatásokhoz és
    az uniós biztonságos konnektivitási program kormányzati szolgáltatásaihoz
    való hozzáférésre vonatkozó szabályok megállapításáról szóló, az
    Európai Unió és Ukrajna közötti megállapodásra irányuló tárgyalások
    megkezdésére való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2026/587 del Consiglio, del 9 marzo 2026, che autorizza
    l’avvio di negoziati per un accordo tra l’Unione europea e l’Ucraina che
    fissi le regole per la partecipazione dell’Ucraina alla componente GOVSATCOM
    del programma spaziale dell’Unione e al programma dell’Unione per una connettività
    sicura, nonché per l’accesso ai servizi GOVSATCOM e ai servizi governativi
    del programma dell’Unione per una connettività sicura
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2026/587 (2026. gada 9. marts), ar kuru pilnvaro sākt
