  script: Latn
  content: Commission Regulation (EEC) No 1662/84 of 13 June 1984 fixing for the 1984/85
    marketing year the minimum price to be paid to producers for cherries and the
    amount of production aid for cherries preserved in syrup
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1662/84 de la Commission du 13 juin 1984 fixant, pour
    la campagne 1984/1985, le prix minimal à payer aux producteurs pour les cerises
    ainsi que le montant de l' aide à la production pour les cerises conservées
    au sirop
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1662/84 der Kommission vom 13. Juni 1984 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises für Kirschen sowie der Produktionsbeihilfe
    für Kirschen in Sirup für das Wirtschaftsjahr 1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1662/84 af 13. juni 1984 om fastsættelse
    for produktionsåret 1984/85 af den minimumpris, der skal betales til producenterne
    for kirsebær og af producentstøtten for kirsebær i sukkerlage
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1662/84 της Επιτροπής
