    περίοδο εμπορίας 1984/85, της ελάχιστης τιμής
    που καταβάλλεται στους παραγωγούς για τα κεράσια
    και του ποσού της ενίσχυσης στην παραγωγή για
    κεράσια διατηρημένα σε σιρόπι
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1662/84 della Commissione del 13 giugno 1984 che fissa,
    per la campagna di commercializzazione 1984/1985, il prezzo minimo da pagare ai
    produttori per le ciliegie e l' importo dell' aiuto alla produzione per le ciliegie
    allo sciroppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1662/84 van de Commissie van 13 juni 1984 tot vaststelling,
    voor het verkoopseizoen 1984/1985, van de aan de telers voor de kersen te betalen
    minimumprijs alsmede van het bedrag van de steun bij de produktie voor kersen
    op siroop
