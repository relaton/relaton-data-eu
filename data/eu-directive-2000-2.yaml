---
id: EUDirective20002
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 2000/2/EC of 14 January 2000 adapting to technical
    progress Council Directive 75/322/EEC relating to the suppression of radio interference
    produced by spark-ignition engines fitted to wheeled agricultural or forestry
    tractors and Council Directive 74/150/EEC relating to the type-approval of wheeled
    agricultural or forestry tractors
  type: main
- language: fr
  script: Latn
  content: Directive 2000/2/CE de la Commission, du 14 janvier 2000, portant adaptation
    au progrès technique de la directive 75/322/CEE du Conseil relative à la suppression
    des parasites radioélectriques produits par les moteurs à allumage commandé
    équipant les tracteurs agricoles ou forestiers à roues et de la directive 74/150/CEE
    du Conseil relative à la réception des tracteurs agricoles ou forestiers à
    roues
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/2/EG der Kommission vom 14. Januar 2000 zur Anpassung der
    Richtlinie 75/322/EWG des Rates über die Funkentstörung der Fremdzündungsmotoren
    von land- oder forstwirtschaftlichen Zugmaschinen auf Rädern an den technischen
    Fortschritt und der Richtlinie 74/150/EWG des Rates über die Betriebserlaubnis
    für land- oder forstwirtschaftliche Zugmaschinen auf Rädern
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/2/ЕО на Комисията от 14 януари
    2000 година за привеждане в съответствие с техническия
    прогрес на Директива 75/322/ЕИО на Съвета относно
    заглушаването на радиосмущенията, произвеждани
    от двигателите с искрово запалване, с които
    са оборудвани колесните селскостопански и
    горски трактори и на Директива 74/150/ЕИО на Съвета
    относно типовото одобрение на колесни селскостопански
    и горски
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/2/ES ze dne 14. ledna 2000, kterou se přizpůsobuje
    technickému pokroku směrnice Rady 75/322/EHS týkající se potlačení vysokofrekvenčního
    rušení způsobovaného zážehovými motory namontovanými do kolových zemědělských
    a lesnických traktorů a směrnice Rady 74/150/EHS týkající se schvalování
    typu kolových zemědělských a lesnických traktorů
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/2/EF af 14. januar 2000 om tilpasning til den
    tekniske udvikling af Rådets direktiv 75/322/EØF vedrørende anordninger til
    radiostøjdæmpning af landbrugs- eller skovbrugshjultraktorer og Rådets direktiv
    74/150/EØF vedrørende godkendelse af landbrugs- og skovbrugshjultraktorer
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/2/ΕΚ της Επιτροπής, της 14ης Ιανουαρίου
    2000, για την προσαρμογή στην τεχνική πρόοδο
    της οδηγίας 75/322/ΕΟΚ του Συμβουλίου σχετικά
    με την εξουδετέρωση των ραδιοηλεκτρικών παρασίτων
    των παραγομένων από τους κινητήρες με επιβαλλόμενη
    ανάφλεξη με τους οποίους είναι εφοδιασμένοι
    οι γεωργικοί ή δασικοί ελκυστήρες και της οδηγίας
    74/150/ΕΟΚ του Συμβουλίου σχετικά με την έγκριση
    των γεωργικών ή δασικών ελκυστήρων
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2000/2/EÜ, 14. jaanuar 2000, millega kohandatakse
    tehnika arenguga nõukogu direktiivi 75/322/EMÜ, milles käsitletakse põllu-
    või metsamajanduslikele ratastraktoritele paigaldatud sädesüütemootorite tekitatud
    raadiohäirete summutamist, ja nõukogu direktiivi 74/150/EMÜ, mis käsitleb
    põllu- või metsamajanduslike ratastraktorite tüübikinnitust
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2000/2/EY, annettu 14 päivänä tammikuuta 2000,
    pyörillä varustettuihin maatalous- ja metsätraktoreihin asennettujen kipinäsytytysmoottoreiden
    aiheuttamien radiohäiriöiden poistamista koskevan neuvoston direktiivin 75/322/ETY
    mukauttamisesta tekniikan kehitykseen ja pyörillä varustettujen maatalous- ja
    metsätraktoreiden tyyppihyväksyntää koskevan neuvoston direktiivin 74/150/ETY
    mukauttamisesta tekniikan kehitykseen
  type: main
- language: hr
  script: Latn
  content: Direktiva Komisije 2000/2/EZ od 14. siječnja 2000. o prilagodbi tehničkom
    napretku Direktive Vijeća 75/322/EEZ o sprečavanju radijskih smetnji koje proizvode
    motori s vanjskim izvorom paljenja, ugrađeni na traktore na kotačima za poljoprivredu
    i šumarstvo i Direktive Vijeća 74/150/EEZ o homologaciji tipa traktora na kotačima
    za poljoprivredu i šumarstvo
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/2/EK irányelve (2000. január 14.) a kerekes mezőgazdasági
    vagy erdészeti traktorokba szerelt külső gyújtású motorok által előidézett
    rádiózavarok szűréséről szóló 75/322/EGK tanácsi irányelvnek, valamint
    a kerekes mezőgazdasági vagy erdészeti traktorok típusjóváhagyásáról
    szóló 74/150/EGK tanácsi irányelvnek a műszaki fejlődéshez történő hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/2/CE della Commissione, del 14 gennaio 2000, che adegua
    al progresso tecnico la direttiva 75/322/CEE del Consiglio relativa alla soppressione
    dei disturbi radioelettrici provocati dai motori ad accensione comandata dei trattori
    agricoli o forestali a ruote e la direttiva 74/150/CEE del Consiglio relativa
    all'omologazione dei veicoli agricoli o forestali a ruote
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/2/EK (2000. gada 14. janvāris), ar ko tehnikas
    attīstībai pielāgo padomes Direktīvu 75/322/EEK par to, kā novērst radiotraucējumus,
    ko rada lauksaimniecības un mežsaimniecības riteņtraktoru dzirksteļaizdedzes
    motori, un Padomes Direktīvu 74/150/EEK attiecībā uz lauksaimniecības un mežsaimniecības
    riteņtraktoru tipa apstiprināšanu
  type: main
- language: lt
  script: Latn
  content: 2000 m. sausio 14 d. Komisijos direktyva 2000/2/EB derinanti su technikos
    pažanga Tarybos direktyvą 75/322/EEB dėl radijo trukdžių, kuriuos kelia ratinių
    žemės ūkio ar miškų ūkio traktorių kibirkštinio uždegimo varikliai, slopinimo
    ir Tarybos direktyvą 74/150/EEB dėl ratinių žemės ūkio ar miškų ūkio
    traktorių tipo patvirtinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2000/2//KE ta'l-14 ta' Jannar 2000 li taddatta
    għall-progress tekniku d-Direttiva tal-Kunsill 75/322/KEE rigward is-soppressjoni
    ta' l-interferenza fir-radju prodotta minn magni spark ignition immuntati ma tratturi
    bir-roti għall-agrikoltura jew għall-foresterija u d-Direttiva tal-Kunsill 74/150/KEE
    dwar l-approvazzjoni tat-tip ta' tratturi bir-roti għall-agrikoli jew għall-foresterija
    (Test b'relevanza għaz-ŻEE)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/2/EG van de Commissie van 14 januari 2000 tot aanpassing
    aan de technische vooruitgang van Richtlijn 75/322/EEG van de Raad wat de onderdrukking
    van door motoren met elektrische ontsteking van landbouw- of bosbouwtrekkers op
    wielen veroorzaakte radiostoringen betreft en van Richtlijn 74/150/EEG van de
    Raad inzake de goedkeuring van landbouw- of bosbouwtrekkers op wielen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/2/WE z dnia 14 stycznia 2000 r. dostosowująca do
    postępu technicznego dyrektywę Rady 75/322/EWG odnoszącą się do tłumienia
    zakłóceń radioelektrycznych wywoływanych przez silniki z zapłonem iskrowym
    stosowane w kołowych ciągnikach rolniczych lub leśnych oraz dyrektywę Rady
    74/150/EWG odnoszącą się do homologacji typu kołowych ciągników rolniczych
    lub leśnych
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/2/CE da Comissão, de 14 de Janeiro de 2000, que adapta
    ao progresso técnico a Directiva 75/322/CEE do Conselho relativa à supressão
    das interferências radioeléctricas produzidas por motores de ignição comandada
    que equipam os tractores agrícolas ou florestais de rodas e a Directiva 74/150/CEE
    do Conselho relativa à recepção dos tractores agrícolas ou florestais de rodas
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/2/CE a Comisiei din 14 ianuarie 2000 de adaptare la progresul
    tehnic a Directivei 75/322/CEE a Consiliului privind suprimarea paraziților radioelectrici
    produși de motoarele cu aprindere prin scânteie cu care sunt echipate tractoarele
    agricole sau forestiere pe roți și a Directivei 74/150/CEE a Consiliului privind
    omologarea tractoarelor agricole sau forestiere pe roți
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2000/2/ES zo 14. januára 2000 ktorou sa smernica Rady
    75/322/EHS týkajúca sa rádiového odrušenia zážihových motorov kolesových
    poľnohospodárskych alebo lesných traktorov a smernica Rady 74/150/EHS týkajúca
    sa typového schválenia poľnohospodárskych alebo lesných kolesových traktorov
    prispôsobujú technickému pokrokuText s významom pre Európsky hospodársky
    priestor.
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2000/2/ES z dne 14. januarja 2000 o prilagoditvi Direktive
    Sveta 75/322/EGS o preprečevanju radijskih motenj, ki jih povzročajo motorji
    na prisilni vžig, vgrajeni v kmetijske ali gozdarske traktorje na kolesih, in
    Direktive Sveta 74/150/EGS o homologaciji kmetijskih ali gozdarskih traktorjev
    na kolesih tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva 2000/2/CE de la Comisión, de 14 de enero de 2000, por la que
    se adaptan al progreso técnico la Directiva 75/322/CEE del Consejo relativa a
    la supresión de parásitos radioeléctricos producidos por los motores de encendido
    por chispa con los que están equipados los tractores agrícolas o forestales
    de ruedas y la Directiva 74/150/CEE del Consejo, relativa a la homologación de
    los tractores agrícolas o forestales de ruedas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2000/2/EG av den 14 januari 2000 om anpassning till
    den tekniska utvecklingen av rådets direktiv 75/322/EEG om dämpning av radiostörningar
    som orsakas av gnisttändningsmotorer i jordbruks- eller skogsbrukstraktorer med
    hjul och av rådets direktiv 74/150/EEG om typgodkännande av jordbruks- eller
    skogsbrukstraktorer med hjul
