    és tanácsi irányelv 31. cikkének (2) bekezdése alapján benyújtott jelentés
    pontos adatokat tartalmaz a szóban forgó tagállamban történő repce- és
    szemeskukorica-termesztésből származó üvegházhatásúgáz-kibocsátás mértékének
    meghatározására
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/478 della Commissione, del 12 marzo 2025,
