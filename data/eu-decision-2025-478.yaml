    estufa associadas ao cultivo de colza e milho (grão) nesse Estado-Membro
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/478 a Comisiei din 12 martie 2025
    de recunoaștere a faptului că raportul prezentat de Slovacia în temeiul articolului
    31 alineatul (2) din Directiva (UE) 2018/2001 a Parlamentului European și a Consiliului
    conține date exacte în scopul măsurării emisiilor de gaze cu efect de seră
    asociate cultivării rapiței și a porumbului pentru boabe în statul membru
    respectiv
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/478 z 12. marca 2025, ktorým
