    parlamentu a Rady (EÚ) 2018/2001 predložilo Slovensko, obsahuje presné údaje
    na účely merania emisií skleníkových plynov spojených s pestovaním repky
    olejnej a kukurice v predmetnom členskom štáte
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/478 z dne 12. marca 2025 o potrditvi,
