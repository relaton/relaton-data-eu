    Европейския парламент и на Съвета доклад, за
    точни за целите на измерването на емисиите
    на парникови газове, свързани с отглеждането
    на рапица и царевица (зърно) в тази държава
    членка
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/478 ze dne 12. března 2025,
