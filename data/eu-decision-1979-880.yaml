title:
- language: en
  script: Latn
  content: '79/880/EEC: Council Decision of 23 October 1979 authorizing the tacit
    renewal or continued operation of certain Treaties of Friendship, Trade and Navigation
    Treaties and similar Agreements concluded between Member States and third countries'
  type: main
- language: fr
  script: Latn
  content: '79/880/CEE: Décision du Conseil, du 23 octobre 1979, autorisant la tacite
    reconduction ou le maintien en vigueur de certains traités d'' amitié, de commerce
    et de navigation et accords similaires conclus par les États membres avec les
    pays tiers'
  type: main
- language: de
  script: Latn
  content: '79/880/EWG: Entscheidung des Rates vom 23. Oktober 1979 zur Genehmigung
    der stillschweigenden Verlängerung oder der Beibehaltung bestimmter Freundschafts-,
    Handels- und Schiffahrtsverträge sowie ähnlicher Abkommen zwischen den Mitgliedstaaten
    und dritten Ländern'
  type: main
- language: da
  script: Latn
  content: '79/880/EØF: Rådets beslutning af 23. oktober 1979 om bemyndigelse til
    stiltiende videreførelse eller opretholdelse af visse venskabs-, handels- og
    skibsfartstraktater og lignende aftaler, som medlemsstaterne har indgået med
    tredjelande'
  type: main
- language: el
  script: Grek
  content: '79/880/ΕΟΚ : Απόφαση του Συμβουλίου, της 23ης
