title:
- language: en
  script: Latn
  content: '93/579/EC: Commission Decision of 8 November 1993 amending Decision 91/648/EEC
    on the establishment of an addendum to the Community support framework for Community
    structural assistance in the United Kingdom (Northern Ireland) on the improvement
    of the conditions under which agricultural products are processed and marketed
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/579/CE: Décision de la Commission du 8 novembre 1993 modifiant la
    décision 91/648/CEE concernant l''établissement d''un avenant au cadre communautaire
    d''appui pour les interventions structurelles communautaires au Royaume-Uni (Irlande
    du Nord) en matière d''amélioration des conditions de transformation et de commercialisation
    des produits agricoles (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/579/EG: ENTSCHEIDUNG DER KOMMISSION vom 8. November 1993 zur Änderung
    der Entscheidung 91/648/EWG über eine Ergänzung eines gemeinschaftlichen Förderkonzepts
    für gemeinschaftliche Strukturinterventionen zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen landwirtschaftlicher Erzeugnisse im Vereinigten Königreich
    (Nordirland) (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/579/EF: KOMMISSIONENS BESLUTNING af 8. november 1993 om ændring af
    beslutning 91/648/EØF om et tillæg til fællesskabsstøtterammen for EF'' s
    strukturinterventioner i Det Forenede Kongerige (Nordirland) til forbedring af
    vilkårene for forarbejdning og afsætning af landbrugsprodukter (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/579/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 8ης Νοεμβρίου
    1993 για την τροποποίηση της απόφασης 91/648/ΕΟΚ
    σχετικά με την κατάρτιση μιας προσθήκης στο
    κοινοτικό πλαίσιο στήριξης παροχής κοινοτικής
    βοήθειας στο Ηνωμένο Βασίλειο (Βόρεια Ιρλανδία)
    για τη βελτίωση των συνθηκών μεταποίησης και
    εμπορίας των γεωργικών προϊόντων (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/579/CE: DECISIONE DELLA COMMISSIONE dell'' 8 novembre 1993 che modifica
    la decisione 91/648/CEE, riguardante la definizione di un addendum nel quadro
    comunitario di sostegno per gli interventi strutturali comunitari nel Regno Unito
    (Irlanda del Nord) in ordine al miglioramento delle condizioni di trasformazione
    e di commercializzazione dei prodotti agricoli (Il testo in lingua inglese è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/579/EG: BESCHIKKING VAN DE COMMISSIE van 8 november 1993 houdende wijziging
    van Beschikking 91/648/EEG van 10 december 1991 tot vaststelling van een aanvulling
    op het communautaire bestek voor de structurele bijstandsverlening van de Gemeenschap
    in het Verenigd Koninkrijk (Noord-Ierland) voor de verbetering van de verwerking
    en de afzet van landbouwprodukten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/579/CE: Decisão da Comissão de 8 de Novembro de 1993 que altera a
    Decisão 91/648/CEE, que estabelece um aditamento ao quadro comunitário de apoio
    para as intervenções estruturais comunitárias no Reino Unido (Irlanda do Norte)
    destinadas à melhoria das condições de transformação e comercialização
    dos produtos agrícolas (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '93/579/CE: DECISIÓN DE LA COMISIÓN de 8 de noviembre de 1993 que modifica
    la Decisión 91/648/CEE por la que se añade un apéndice al marco comunitario
    de apoyo para la ayuda estructural comunitaria al Reino Unido (Irlanda del Norte)
    en la mejora de las condiciones de transformación y comercialización de los
    productos agrícolas (El texto en lengua inglesa es el único auténtico)'
