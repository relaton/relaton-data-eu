id: EURegulation8731983
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 873/83 of 12 April 1983 revoking the protective
    measures in respect of imports into France and the United Kingdom of tableware
    and other articles of a kind commonly used for domestic or toilet purposes, of
    stoneware, and introducing a system of automatic authorization for imports of
    the products in question originating in or coming from South Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 873/83 de la Commission du 12 avril 1983 abrogeant
    les mesures de protection applicables à la vaisselle et aux articles de ménage
    ou de toilette en grès importés en France et au Royaume-Uni et instituant un
    régime d' autorisations d' importation automatiques pour les produits en question
    originaires ou en provenance de Corée du Sud
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 873/83 der Kommission vom 12. April 1983 zur Aufhebung
    der Schutzmaßnahmen betreffend die Einfuhren von Geschirr sowie Haushalts- oder
    Toilettengegenständen aus Steinzeug nach Frankreich und in das Vereinigte Königreich
    und zur Einführung eines Systems automatischer Einfuhrgenehmigungen für diese
    Waren mit Ursprung in oder Herkunft aus Südkorea
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 873/83 af 12. april 1983 om ophævelse
    af beskyttelsesforanstaltningerne vedrørende bordservice og husholdnings- eller
    toiletartikler af stentøj, der importeres i Frankrig og Det forenede Kongerige,
    og om indførelse af en ordning for automatisk udstedelse af tilladelser til import
    af de pågældende varer med oprindelse i eller afsendt fra Sydkorea
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 873/83 της Επιτροπής
    της 12ης Απριλίου 1983 για την κατάργηση των προστατευτικών
    μέτρων που εφαρμόζονται για τα επιτραπέζια
    σκεύη και τα είδη οικιακής χρήσης ή ευπρεπισμού
    από ψευδοπορσελάνη, που εισάγονται στη Γαλλία
    και το Ηνωμένο Βασίλειο και τη θέσπιση καθεστώτος
    αυτόματων αδειών εισαγωγής για τα προϊόντα
    αυτά που κατάγονται και προέρχονται από τη
    Νότια Κορέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 873/83 della Commissione del 12 aprile 1983 che abroga
    le misure di salvaguardia applicabili al vasellame ed agli oggetti di uso domestico
    o da toletta in gres, importati in Francia e nel Regno Unito, e che istituisce
    un regime di autorizzazioni automatiche all' importazione per i prodotti in oggetto
    originari o provenienti dalla Corea del Sud
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 873/83 van de Commissie van 12 april 1983 tot intrekking
    van de beschermende maatregelen ten aanzien van vaatwerk, huishoudelijke artikelen
    en toiletartikelen van gres die in Frankrijk en in het Verenigd Koninkrijk worden
    ingevoerd, en tot instelling van een regeling van automatische invoervergunningen
    voor de bedoelde produkten van oorsprong of afkomstig uit Zuid-Korea
  type: main
