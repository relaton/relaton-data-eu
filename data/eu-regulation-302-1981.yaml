- language: en
  script: Latn
  content: Commission Regulation (EEC) No 302/81 of 4 February 1981 allocating the
    Community quantitative export quotas for certain types of copper ash and residues
    and for certain types of copper and lead waste and scrap
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 302/81 de la Commission, du 4 février 1981, portant
    répartition des contingents quantitatifs communautaires à l' exportation pour
    certaines cendres et certains résidus de cuivre ainsi que pour certains déchets
    et débris de cuivre et de plomb
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 302/81 der Kommission vom 4. Februar 1981 zur Aufteilung
    der mengenmäßigen Ausfuhrkontingente der Gemeinschaft für bestimmte Aschen
    und Rückstände von Kupfer sowie für bestimmte Bearbeitungsabfälle und bestimmten
    Schrott aus Kupfer und Blei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 302/81 af 4. februar 1981 om fordeling
    af kvantitative fællesskabskontingenter for udførsel af visse typer aske og
    visse restprodukter af kobber samt visse former for affald og skrot af kobber
    og bly
  type: main
- language: el
  script: Grek
