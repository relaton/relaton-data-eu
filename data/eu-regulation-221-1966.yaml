    für Einfuhren im ersten Vierteljahr 1967
  type: main
- language: it
  script: Latn
  content: Regolamento n. 221/66/CEE della Commissione, del 14 dicembre 1966, che
    adatta e fissa i prezzi limite applicabili ai suini, alle carni suine e ai prodotti
    a base di carni suine per le importazioni effettuate durante il primo trimestre
    1967
  type: main
