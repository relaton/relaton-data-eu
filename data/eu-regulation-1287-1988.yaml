title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1287/88 of 10 May 1988 re-establishing the
    levying of customs duties on women' s or girls' suits and ensembles other than
    knitted or crocheted, products of category 29 (order No 40.0290); babies' garments
    and clothing accessories, other than knitted or crocheted, products of category
    68 (order No 40.0680), originating in Thailand, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1287/88 de la Commission du 10 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux costumes-tailleurs et ensembles
    autres qu' en bonneterie, pour femmes ou fillettes, de la catégorie de produits
    n° 29 (n° d' ordre 40.0290), et aux vêtements et accessoires du vêtement pour
    bébés, autres qu' en bonneterie, de la catégorie de produits n° 68 (n° d'
    ordre 40.0680), originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1287/88 der Kommission vom 10. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Kostüme und Kombinationen, andere als aus Gewirken, für
    Frauen und Mädchen, der Warenkategorie Nr. 29 (lfd. Nr. 40.0290) sowie Säuglingskleidung
    und Bekleidungszubehör für Säuglinge, andere als aus Gewirken, der Warenkategorie
    Nr. 68 (lfd. Nr. 40.0680) mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1287/88 af 10. maj 1988 om genindførelse
    af opkrævning af toldafgifter for dragter og kostumer og sæt, ikke af trikotage,
    til kvinder og piger under varekategori nr. 29 (løbenummer 40.0290) og beklædningsgenstande
    og tilbehør til spædbørn, ikke af trikotage, under varekategori nr. 68 (løbenummer
    40.0680), som har oprindelse i Thailand og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1287/88 της Επιτροπής
