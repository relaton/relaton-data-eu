  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1287/88 della Commissione del 10 maggio 1988 che ripristina
    la riscossione dei dazi doganali applicabili agli abiti a giacca, completi e insiemi,
    esclusi quelli a maglia, per donna o per ragazza, della categoria di prodotti
    n. 29 (numero d' ordine 40.0290), agli indumenti ed accessori di abbigliamento
    per bambini piccoli (bébés), tessuti, della categoria di prodotti n. 68 (numero
    d' ordine 40.0680), originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1287/88 van de Commissie van 10 mei 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mantelpakken,
    broekpakken en combinaties, andere dan van brei- of haakwerk, voor dames en meisjes,
    van de categorie van produkten nr. 29 (volgnummer 40.0290) en babykleding en -kledingtoebehoren,
    andere dan van brei- of haakwerk, van de categorie van produkten nr. 68 (volgnummer
    40.0680), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3783/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1287/88 da Comissão de 10 de Maio de 1988 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis às saias-casacos de tecido e
    conjuntos, excluindo os de malha, para senhoras ou raparigas, da categoria de
    produtos n.° 29 (n.° de ordem 40.0290), vestuário para bebés, peúgas e artefactos
    semelhantes, de tecido, da categoria de produtos n.° 68 (n.° de ordem 40.0680),
    originários da Tailândia, beneficiária das preferências pautais previstas
    no Regulamento (CEE) n.° 3783/87 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1287/88 de la Comisión de 10 de mayo de 1988 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los trajes sastre y conjuntos, que no sean de punto, para mujeres o niñas,
    de la categoría n° 29 (número de orden 40.0290) y a las prendas y accesorios
    de vestir para bebés, que no sean de punto, de la categoría n° 68 (número
    de orden 40.0680), originarios de Tailandia, beneficiaria de las preferencias
    arancelarias previstas por el Reglamento (CEE) n° 3783/87 del Consejo
