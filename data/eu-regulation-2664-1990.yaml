    categoria di prodotti n. 73 (numero d'ordine 40.0730) originari dell'Indonesia,
    delle Filippine e del Pakistan, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2664/90 VAN DE COMMISSIE van 17 september 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op trainingspakken,
    van de categorie van produkten nr. 73 (volgnummer 40.0730), van oorsprong uit
    Indonesië, de Filippijnen en Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2664/90 DA COMISSAO de 17 de Setembro de 1990 que
