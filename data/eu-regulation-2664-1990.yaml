title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2664/90 of 17 September 1990 reintroducing
    the levying of the customs duties applicable to track suits, products of category
    73 (order No 40.0730) originating in Indonesia, the Philippines and Pakistan to
    which the preferential tariff arrangements of Council Regulation (EEC) No 3897/89
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2664/90 de la Commission du 17 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux trainings
    de la catégorie de produits n° 73 (numéro d'ordre 40.0730), originaires de
    l'Indonésie, des Philippines et du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2664/90 DER KOMMISSION vom 17. September 1990 zur
    Wiedereinfuehrung des Zollsatzes fuer Kostueme und Kombinationen der Warenkategorie
    Nr. 73 (laufende Nummer 40.0730) mit Ursprung in Indonesien, den Philippinen und
    Pakistan, denen die in der Verordnung (EWG) Nr. 3897/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2664/90 af 17. september 1990 om genindførelse
    af toldafgifter for træningsdragter under varekategori 73 (løbenummer 40.0730),
    som har oprindelse i Indonesien, Filippinerne og Pakistan og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
