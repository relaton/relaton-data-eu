title:
- language: en
  script: Latn
  content: '74/351/EEC: Commission Decision of 2 July 1974 authorizing the Italian
    Republic not to apply Community treatment to sewing-machine heads, falling within
    heading Nos 84.41 A ex I and ex II of the Common Customs Tariff, originating in
    Poland, and in free circulation in Germany'
  type: main
- language: fr
  script: Latn
  content: '74/351/CEE: Décision de la Commission, du 2 juillet 1974, autorisant
    la République italienne à exclure du traitement communautaire les têtes de
    machines à coudre, des sous-positions 84.41 A ex I et ex II du tarif douanier
    commun, originaires de Pologne et mises en libre pratique en Allemagne'
  type: main
- language: de
  script: Latn
  content: '74/351/EWG: Entscheidung der Kommission vom 2. Juli 1974, mit der die
    Italienische Republik ermächtigt wird, aus Polen stammende und in Deutschland
    im freien Verkehr befindliche Nähmaschinenköpfe der Tarifnummern 84,41 A ex
    I und ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '74/351/EØF: Kommissionens Beslutning af 2. juli 1974 om bemyndigelse
    for Den italienske Republik til fra fællesskabsbehandling at undtage symaskinehoveder,
    som henhører under position 84.41 A ex I og ex II i den fælles toldtarif, med
    oprindelse i Polen og som frit kan omsættes i Tyskland'
  type: main
- language: it
  script: Latn
  content: '74/351/CEE: Decisione della Commissione, del 2 luglio 1974, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le teste di macchine
    da cucire delle voci 84.41 A ex I ed ex II della tariffa doganale comune, originarie
    della Polonia e messe in libera pratica in Germania'
  type: main
- language: nl
  script: Latn
  content: '74/351/EEG: Beschikking van de Commissie van 2 juli 1974 waarbij de Italiaanse
    Republiek wordt gemachtigd koppen van naaimachines van posten 84.41 A ex I en
    ex II van het gemeenschappelijk douanetarief, van oorsprong uit Polen en in Duitsland
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
