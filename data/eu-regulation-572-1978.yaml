title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 572/78 of 21 March 1978 laying down detailed
    rules for the application of special import arrangements for certain types of
    frozen beef intended for processing and repealing Regulation (EEC) No 597/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 572/78 de la Commission, du 21 mars 1978, établissant
    les modalités d' application relatives au régime spécial à l' importation
    de certaines viandes bovines congelées destinées à la transformation, et abrogeant
    le règlement (CEE) n° 597/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 572/78 der Kommission vom 21. März 1978 mit Durchführungsbestimmungen
    zur Sonderregelung für die Einfuhr von zur Verarbeitung bestimmtem gefrorenem
    Rindfleisch sowie zur Aufhebung der Verordnung (EWG) Nr. 597/77
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 572/78 af 21. marts 1978 om fastsættelse
    af gennemførelsbestemmelser for den særlige importordning for visse former for
    frosset oksekød bestemt til forarbejdning, og om ophævelse af forordning (EØF)
    nr. 597/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 572/78 della Commissione, del 21 marzo 1978, che stabilisce
    le modalità di applicazione del regime speciale d' importazione di determinate
    carni bovine congelate destinate alla trasformazione e abroga il regolamento (CEE)
    n. 597/77
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 572/78 van de Commissie van 21 maart 1978 houdende
    uitvoeringsbepalingen inzake de bijzondere invoerregeling voor bepaalde soorten
    voor verwerking bestemd bevroren rundvlees en houdende intrekking van Verordening
    (EEG) nr. 597/77
  type: main
