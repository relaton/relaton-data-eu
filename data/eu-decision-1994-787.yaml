    Höchstgehalten an Mykotoxinen in landwirtschaftlichen Erzeugnissen auszusetzen
    (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/787/EF: Kommissionens beslutning af 7. december 1994 om at anmode Danmark
