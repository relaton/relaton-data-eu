title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1920/2001 of 28 September 2001 laying down
    detailed rules for the implementation of Council Regulation (EC) No 2494/95 as
    regards minimum standards for the treatment of service charges proportional to
    transaction values in the harmonised index of consumer prices and amending Regulation
    (EC) No 2214/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1920/2001 de la Commission du 28 septembre 2001 portant
    modalités d'application du règlement (CE) n° 2494/95 du Conseil en ce qui concerne
    les normes minimales de traitement des commissions de service proportionnelles
    aux valeurs de transaction dans l'indice des prix à la consommation harmonisé
    et modifiant le règlement (CE) n° 2214/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1920/2001 der Kommission vom 28. September 2001 mit
