title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3091/92 of 27 October 1992 re- establishing
    the levying of customs duties on products of categories No 22 and 78 (order No
    40.0220 and 40.0780), originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3091/92 de la Commission, du 27 octobre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 22 et 78 (numéros d' ordre 40.0220 et 40.0780) originaires du
    Pakistan, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3091/92 der Kommission vom 27. Oktober 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorien 22 und 78 (laufende Nummern 40.0220
    und 40.0780) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3091/92 af 27. oktober 1992 om genindførelse
    af opkrævning af told for varer under kategori 22 og 78 (løbenummer 40.0220
    og 40.0780), som har oprindelse i Pakistan og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
