title:
- language: en
  script: Latn
  content: '79/617/EEC: Commission Decision of 31 May 1979 authorizing the United
    Kingdom not to apply Community treatment to women''s, girls''and infants''woven
    overcoats, raincoats and other coats, cloaks and capes, jackets and blazers, other
    than garments of category 15 A, of wool, cotton or man-made textile fibres, falling
    within subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes 61.02-31,
    32, 33, 35, 36, 37, 39, 40) (category 15 B), originating in Yugoslavia and in
    free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/617/CEE: Décision de la Commission, du 31 mai 1979, autorisant le
    Royaume-Uni à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes) et vestes tissés, pour femmes, fillettes et jeunes enfants,
    autres que les vêtements de la catégorie 15 A, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles, de la sous-position ex 61.02 B du tarif
    douanier commun (codes Nimexe: 61.02- 31, 32, 33, 35, 36, 37, 39, 40) (catégorie
    15 B), originaires de Yougoslavie et mis en libre pratique dans les autres Etats
    membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/617/EWG: Entscheidung der Kommission vom 31. Mai 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus Jugoslawien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Mäntel, Umhänge und Jacken
    aus Geweben, für Frauen, Mädchen und Kleinkinder, andere als Kleidung der Kategorie
    15 A, der Tarifstelle ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.02-31; 32; 33; 35; 36; 37; 39; 40), Kategorie 15 B, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/617/EØF: Kommissionens beslutning af 31. maj 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, jakker og blazere, vævede, til kvinder, piger og småbørn, andre end
    de under kategori 15 A hørende varer af uld, bomuld eller kemofibre, som henhører
    under pos. ex 61.02 B i den fælles toldtarif (NIMEXE-nummer 61.02- 31, 32, 33,
    35, 36, 37, 39, 40; kategori 15 B), har oprindelse i Jugoslavien og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/617/CEE: Decisione della Commissione, del 31 maggio 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli
    e simili, e giacche, tessuti per donna, per ragazza e per bambini, diversi dagli
    indumenti della categoria 15 A, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della sottovoce ex 61.02 B della tariffa doganale comune (codici
    Nimexe: 61.02-31, 32, 33, 35, 36, 37, 39, 40) categoria 15 B, originari della
    Iugoslavia e messi in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/617/EEG: Beschikking van de Commissie van 31 mei 1979 waarbij het Verenigd
    Koninkrijk wordt gemachtigd mantels, regenjassen en andere jassen, capes, blazers
    en jasjes, geweven, andere dan de kledingstukken van categorie 15 A, van wol,
    van katoen of van synthetische of van kunstmatige textielvezels, van post ex 61.02
    B van het gemeenschappelijk douanetarief (NIMEXE-code 61.02-31, 32, 33, 35, 36,
    37, 39, 40) (categorie 15 B), van oorsprong uit Joegoslavië en in de overige
    Lid- Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
