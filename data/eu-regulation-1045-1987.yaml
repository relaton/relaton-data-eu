title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1045/87 of 13 April 1987 altering the monetary
    compensatory amounts in respect of skimmed-milk powder entering Spain under the
    arrangements laid down in Regulation (EEC) No 1624/76 and where denatured skimmed-milk
    powder is classified under subheading 04.02 A II b) 1 of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1045/87 de la Commission, du 13 avril 1987, modifiant
    les montants compensatoires monétaires en ce qui concerne le lait écrémé en
    poudre entrant en Espagne sous le régime du règlement (CEE) n 1624/76 et lorsque
    le lait écrémé en poudre dénaturé est classé dans la sous-position 04.02
    A II b) 1 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1045/87 der Kommission vom 13. April 1987 zur Änderung
    der Währungsausgleichsbeträge für Magermilchpulver, das gemäß der Regelung
    der Verordnung (EWG) Nr. 1624/76 nach Spanien eingeführt wird, wenn die denaturierte
    Magermilch in die Tarifstelle 04.02 A II b) 1 des Gemeinsamen Zolltarifs eingeteilt
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1045/87 af 13. april 1987 om ændring
    af de monetære udligningsbeløb for skummetmælkspulver, der sendes til Spanien
    under ordningen i forordning (EØF) nr. 1624/76, og når det denaturerede skummetmælkspulver
    tariferes i pos. 04.02 A II b) 1
  type: main
- language: el
  script: Grek
