  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1045/87 della Commissione, del 13 aprile 1987, che
    modifica gli importi compensativi monetari relativi al latte scremato in polvere
    importato in Spagna nell'ambito del regime previsto dal regolamento (CEE) n. 1624/76
    e in caso di classificazione del latte scremato in polvere denaturato nella sottovoce
    04.02 A II b) 1 della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1045/87 van de Commissie van 13 april 1987 tot wijziging
    van de monetaire compenserende bedragen ten aanzien van magere-melkpoeder dat
    Spanje binnenkomt in het kader van de regeling van Verordening (EEG) nr. 1624/76
    en wanneer gedenatureerd magere-melkpoeder onder post 04.02 A II b) 1 van het
    gemeenschappelijk douanetarief wordt ingedeeld
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1045/87 da Comissão, de 13 de Abril de 1987, que
