id: EUDirective201413
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/13/EU of 18 October 2013 amending,
    for the purposes of adapting to technical progress, the Annex IV to Directive
    2011/65/EU of the European Parliament and of the Council as regards an exemption
    for lead in solders on populated printed circuit boards used in Directive 93/42/EEC
    class IIa and IIb mobile medical devices other than portable emergency defibrillators
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/13/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb dans les soudures sur les cartes de circuits imprimés garnies utilisées
    dans les dispositifs médicaux mobiles des classes IIa et IIb de la directive
    93/42/CEE autres que les défibrillateurs portables d’urgence
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/13/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in Loten auf bestückten Leiterplatten zur Verwendung
    in mobilen Medizinprodukten der Klassen IIa und IIb der Richtlinie 93/42/EWG mit
    Ausnahme von tragbaren Notfalldefibrillatoren
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/13/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    в припои за наситени печатни платки, използвани
    в мобилни медицински апарати от класове IIa
    и IIб съгласно Директива 93/42/ЕИО, различни от
    преносимите дефибрилатори за спешна помощ
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/13/EU ze dne 18. října
    2013 , kterou se z důvodu přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    olovo v pájkách na osazených deskách plošných spojů používaných do jiných
    mobilních zdravotnických prostředků třídy IIa a IIb podle směrnice 93/42/EHS
    než přenosných pohotovostních defibrilátorů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/13/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår en undtagelse for bly i loddematerialer på bestykkede
    printkort, der anvendes i andet mobilt medicinsk udstyr i klasse IIa og IIb i
    direktiv 93/42/EØF end bærbare førstehjælpsdefibrillatorer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/13/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση του
    παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για «μόλυβδο σε συγκολλητικά κράματα
    για πλακέτες τυπωμένων κυκλωμάτων που χρησιμοποιούνται
    σε φορητές ιατρικές συσκευές κατηγορίας ΙΙα
    και ΙΙβ της οδηγίας 93/42/ΕΟΚ εκτός φορητών απινιδωτών
    έκτακτης ανάγκης» , με σκοπό την προσαρμογή
    στην τεχνική πρόοδο
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/13/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist direktiivi
    93/42/EMÜ IIa ja IIb klassi kuuluvate teisaldatavate meditsiiniseadmete (v.a
    kantavad kiirabidefibrillatsiooniseadmed) komponentidega trükkplaatide joodistes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/13/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä sellaisten komponentteja sisältävien piirilevyjen juotoksissa, joita
    käytetään direktiivin 93/42/ETY II a ja II b luokan muissa siirrettävissä
    lääkinnällisissä laitteissa kuin kannettavissa ensiapudefibrillaattoreissa
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/13/EU оd 18. listopada 2013. o izmjeni,
    u svrhe prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća s obzirom na izuzeće za olovo u lemovima na tiskanim pločicama
    s montiranim dijelovima koje se koriste u klasama II.a i II.b mobilnih medicinskih
    proizvoda iz Direktive 93/42/EEZ, osim prijenosnih defibrilatora za prvu pomoć
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/13/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a 93/42/EGK irányelv szerinti IIa. és IIb. osztályba tartozó, a hordozható
    sürgősségi defibrillátoroktól eltérő hordozható orvostechnikai eszközökben
    használt beültetett nyomtatott áramköri lapokon alkalmazott forraszanyagokban
    lévő ólom mentesítése tekintetében, a műszaki fejlődéshez történő
    hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/13/UE della Commissione, del 18 ottobre 2013 ,
    che modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione
    relativa al piombo nelle saldature usate per l’assemblaggio di circuiti stampati
    popolati utilizzati nei dispositivi medici mobili appartenenti alle classi IIa
    e IIb della direttiva 93/42/CEE diversi dai defibrillatori di emergenza portatili
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/13/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam lodmetālos
    drukātās shēmas platēs ar uzmontētiem komponentiem, kuras izmanto Direktīvas
    93/42/EEK IIa un IIb klases mobilās medicīniskās ierīcēs, izņemot portatīvus
    ārkārtas gadījumiem paredzētus defibrillatorus
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/13/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną sumontuotųjų spausdintinių plokščių, naudojamų IIa ir IIb
    klasės (pagal Direktyvą 93/42/EEB) mobiliuosiuose medicinos prietaisuose, išskyrus
    nešiojamuosius skubiosios pagalbos defibriliatorius, lydmetaliuose
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/13/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb fi stann fuq bordijiet taċ-ċirkwiti stampati popolati
    użati f’tagħmir mediku mobbli tal-klassi IIa u IIb tad-Direttiva 93/42/KEE
    minbarra d-difibrillaturi tal-emerġenza li jinġarru fl-idejn
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/13/EU van de Commissie van 18 oktober 2013
    tot wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in soldeer op afgemonteerde printplaten voor gebruik
    in andere mobiele medische hulpmiddelen van de klassen IIa en IIb van Richtlijn
    93/42/EEG dan draagbare defibrillatoren voor noodgevallen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/13/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu w stopach lutowniczych na płytkach zbiorczych obwodów drukowanych stosowanych
    w mobilnych wyrobach medycznych należących zgodnie z dyrektywą 93/42/EWG do
    klasy IIa i IIb, innych niż przenośne defibrylatory
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/13/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para chumbo em soldas sobre placas de circuito impresso de alta densidade utilizadas
    em dispositivos médicos móveis, que não sejam desfibrilhadores portáteis de
    emergência, das classes IIa e IIb da Diretiva 93/42/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/13/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul din aliajele de lipit de pe plăcile cu circuite imprimate populate cu
    componente electronice, utilizate în dispozitivele medicale mobile din clasele
    IIa și IIb definite în Directiva 93/42/CEE, altele decât defibrilatoarele portabile
    de urgență
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/13/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo v spájkach na
    osadených doskách plošných spojov používaných do iných mobilných zdravotníckych
    pomôcok triedy IIa a IIb podľa smernice 93/42/EHS, než sú prenosné pohotovostné
    defibrilátory
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/13/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za svinec v spajkah na opremljenih ploščah tiskanega vezja, ki se uporabljajo
    v prenosnih medicinskih pripomočkih razredov IIa in IIb iz Direktive 93/42/EGS,
    razen v prenosnih defibrilatorjih za prvo pomoč, zaradi prilagoditve tehničnemu
    napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/13/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en soldaduras sobre circuitos impresos, con componentes electrónicos
    montados, utilizados en productos sanitarios móviles de las clases IIa y IIb
    de la Directiva 93/42/CEE distintos de los desfibriladores portátiles de emergencia
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/13/EU av den 18 oktober 2013 om
    ändring, för anpassning till den tekniska utvecklingen, av bilaga IV till direktiv
    2011/65/EU vad gäller undantag för bly i lödfogar på monterade kretskort som
    används i andra mobila medicintekniska produkter i klasserna IIa och IIb enligt
    direktiv 93/42/EEG än bärbara hjärtstartare
  type: main
