title:
- language: en
  script: Latn
  content: Regulation (EEC) No 224/73 of the Council of 31 January 1973 laying down
    general rules concerning the components designed to ensure, within the cereals
    and rice sectors, the protection of the processing industry, and fixing those
    components in respect of the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 224/73 du Conseil, du 31 janvier 1973, déterminant
    les règles générales relatives aux éléments destinés à assurer, dans le
    secteur des céréales et du riz, la protection de l'industrie de transformation
    et fixant ceux pour les nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 224/73 des Rates vom 31. Januar 1973 zur Festlegung
    der Grundregeln für den Bestandteil zum Schutz der Verarbeitungsindustrie auf
    dem Getreide- und Reissektor und zur Festsetzung dieses Bestandteils für die
    neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 224/73 af 31. januar 1973 om fastlæggelse
    af de almindelige regler vedrørende de elementer, der for korn og ris har til
    formål at sikre beskyttelsen af forarbejdningsindustrien, og om fastsættelse
    af disse elementer for de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 224/73 del Consiglio, del 31 gennaio 1973, che determina
    le norme generali relative agli elementi destinati ad assicurare, nel settore
    dei cereali e del riso, la protezione dell'industria di trasformazione e che fissa
    i suddetti elementi per i nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 224/73 van de Raad van 31 januari 1973 houdende bepaling
    van de algemene regels betreffende de elementen die dienen om in de sector granen
    en rijst de bescherming van de verwerkende industrie te verzekeren, en vaststelling
    van genoemde elementen voor de nieuwe Lid-Staten
  type: main
