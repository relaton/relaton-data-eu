  content: Commission Regulation (EEC) No 1339/80 of 30 May 1980 fixing the rates
    of the refunds applicable from 1 June 1980 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1339/80 de la Commission, du 30 mai 1980, fixant les
