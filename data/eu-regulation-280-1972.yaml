  content: Regulation (EEC) No 280/72 of the Commission of 8 February 1972 amending
    Commission Regulation (EEC) No 2196/71 of 13 October 1971 on a derogation from
    Regulation (EEC) No 2637/70 as regards the period of validity of import licences
    for rice originating in and coming from certain distant countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 280/72 de la Commission, du 8 février 1972, mofifiant
    le règlement (CEE) n° 2196/71 de la Commission, du 13 octobre 1971, portant
    dérogation au règlement (CEE)" n° 2637/70 en ce qui concerne la durée de validité
    des certificats d' importation pour le riz originaire et en provenance de certains
    pays éloignés
  type: main
