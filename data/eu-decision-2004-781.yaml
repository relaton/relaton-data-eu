  script: Latn
  content: '2004/781/EC: Commission Decision of 18 November 2004 amending Decision
    1999/815/EC concerning measures prohibiting the placing on the market of toys
    and childcare articles intended to be placed in the mouth by children under three
    years of age made of soft PVC containing certain phthalates (notified under document
    number C(2004) 4403)'
  type: main
- language: fr
  script: Latn
