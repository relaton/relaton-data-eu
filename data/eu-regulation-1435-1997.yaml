    consommation de jus de raisins peuvent être réalisées au titre de la campagne
    1996/1997
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1435/97 der Kommission vom 23. Juli 1997 zur Bestimmung
