title:
- language: en
  script: Latn
  content: '2008/322/EC: Commission Decision of 18 April 2008 prolonging the validity
    of Decision 2006/502/EC requiring Member States to take measures to ensure that
    only lighters which are child-resistant are placed on the market and to prohibit
    the placing on the market of novelty lighters (notified under document number
    C(2008) 1442)'
  type: main
- language: fr
  script: Latn
  content: '2008/322/CE: Décision de la Commission du 18 avril 2008 prorogeant la
    validité de la décision 2006/502/CE exigeant des États membres qu’ils prennent
    des mesures destinées à faire en sorte que seuls les briquets présentant des
    caractéristiques de sécurité enfants soient mis sur le marché et à interdire
    la mise sur le marché de briquets fantaisie [notifiée sous le numéro C(2008)
    1442]'
  type: main
