title:
- language: en
  script: Latn
  content: '83/548/EEC: Commission Decision of 7 November 1983 on the clearance of
    the accounts presented by the Kingdom of Belgium in respect of expenditure incurred
    in the 1975 financial year on cereals and milk products supplied as food aid (Only
    the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/548/CEE: Décision de la Commission du 7 novembre 1983 relative à
    l''apurement des comptes présentés par le Royaume de Belgique au titre des dépenses
    d''aide alimentaire en céréales et en produits laitiers de l''exercice 1975
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '83/548/EWG: Entscheidung der Kommission vom 7. November 1983 über den
    Abschluß der vom Königreich Belgien eingereichten Rechnungen für Nahrungsmittelhilfeausgaben
    des Rechnungsjahres 1975 in Form von Getreide und Milcherzeugnissen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/548/EØF: Kommissionens beslutning af 7. november 1983 om afslutning
    af det af kongeriget Belgien fremlagte regnskab over udgifter i regnskabsåret
    1975 til fødevarehjælp i form af korn og mejeriprodukter (Kun den franske og
    nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '83/548/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Νοεμβρίου
