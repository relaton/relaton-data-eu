    που υποβλήθηκαν από το Βασίλειο του Βελγίου
    στα πλαίσια των δαπανών επισιτιστικής βοήθειας
    σε σιτηρά και γαλακτοκομικά προϊόντα του οικονομικού
    έτους 1975 (Τα κείμενα στην γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
