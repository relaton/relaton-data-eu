title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 853/84 of 30 March 1984 extending the validity
    of fishing licences granted under Regulation (EEC) No 708/83 laying down certain
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of certain non-member countries in the 200-nautical-mile
    zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 853/84 du Conseil du 30 mars 1984 prorogeant la validité
    des licences délivrées dans le cadre du règlement (CEE) no 708/83 fixant certaines
    mesures de conservation et de gestion des ressources de pêche applicables aux
    navires battant pavillon de certains pays tiers dans la zone de 200 milles située
    au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 853/84 des Rates vom 30. März 1984 zur Verlängerung
    der Geltungsdauer der im Rahmen der Verordnung (EWG) Nr. 708/83 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer ausgestellten Fischereilizenzen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 853/84 af 30. marts 1984 om forlængelse
    af gyldighedsperioden for licenser udstedt i henhold til forordning (EØF) nr.
    708/83 om fastsættelse af en række foranstaltninger til bevarelse og forvaltning
    af fiskeressourcerne gældende for fartøjer, der fører visse tredjelandes flag,
    i 200-sømilezonen ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 853/84 του Συμβουλίου
    της 30ής Μαρτίου 1984 για την παράταση των αδειών
    που εκδίδονται στα πλαίσια του κανονισμού
    (ΕΟΚ) αριθ. 708/83 περί καθορισμού ορισμένων μέτρων
    διατηρήσεως και διαχειρίσεως αλιευτικών πόρων,
    τα οποία εφαρμόζονται στα σκάφη υπό σημαία
    ορισμένων τρίτων χωρών εντός της ζώνης 200 μιλίων,
    η οποία ευρίσκεται στα ανοικτά των ακτών του
    γαλλικού διαμερίσματος της Γουιάνας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 853/84 del Consiglio del 30 marzo 1984 che proroga
    la validità delle licenze rilasciate nel quadro del regolamento (CEE) n. 708/83
    che stabilisce talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 853/84 van de Raad van 30 maart 1984 tot verlenging
    van de geldigheidsduur van de visserijvergunningen afgegeven krachtens Verordening
    (EEG) nr. 708/83 tot vaststelling van bepaalde maatregelen voor de instandhouding
    en het beheer van de visbestanden welke, ten aanzien van vaartuigen die de vlag
    van bepaalde derde landen voeren, van toepassing zijn in de 200-mijlszone voor
    de kust van het Franse departement Guyana
  type: main
