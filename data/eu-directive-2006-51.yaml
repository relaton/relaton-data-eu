title:
- language: en
  script: Latn
  content: Commission Directive 2006/51/EC of 6 June 2006 amending for the purposes
    of adapting to technical progress Annex I to Directive 2005/55/EC of the European
    Parliament and of the Council and Annexes IV and V to Directive 2005/78/EC as
    regards requirements for the emission control monitoring system for use in vehicles
    and exemptions for gas engines
  type: main
- language: fr
  script: Latn
  content: Directive 2006/51/CE de la Commission du 6 juin 2006 modifiant, pour les
