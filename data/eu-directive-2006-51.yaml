    européen et du Conseil et les annexes IV et V de la directive 2005/78/CE en ce
    qui concerne les prescriptions applicables au système embarqué de surveillance
    de la réduction des émissions des véhicules et les exemptions pour les moteurs
    à gaz
  type: main
- language: de
  script: Latn
