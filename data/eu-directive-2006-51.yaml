    IV. és V. mellékletének a járművekben használt kibocsátáscsökkentést
    ellenőrző rendszerekre és a gázüzemű motorokra vonatkozó mentességekre
    vonatkozó követelményeinek a műszaki fejlődéshez történő hozzáigazítása
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2006/51/CE della Commissione, del 6 giugno 2006 , recante modifica,
    ai fini dell’adeguamento al progresso tecnico, dell’allegato I della direttiva
    2005/55/CE del Parlamento europeo e del Consiglio e dell’allegato IV e V della
    direttiva 2005/78/CE concernente i requisiti del sistema di controllo delle emissioni
    nei veicoli e le deroghe per i motori a gas
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2006/51/EK ( 2006. gada 6. jūnijs ), ar ko nolūkā
