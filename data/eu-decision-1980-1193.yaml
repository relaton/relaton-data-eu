---
id: EUDecision19801193
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 1 August 1980 authorizing the Italian Republic to
    apply intra- Community surveillance to imports of products originating in a non-member
    country which have been put into free circulation in the Community and which may
    be the subject of protective measures under Article 115 of the Treaty (Only the
    Italian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er août 1980, autorisant la République
    italienne à instaurer une surveillance intracommunautaire des importations de
    certains produits originaires d'un pays tiers et mis en libre pratique dans la
    Communauté, susceptibles de faire l'objet de mesures de protection au titre de
    l'article 115 du traité (Le texte en langue italienne est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. August 1980 zur Ermächtigung der Italienischen
    Republik zur Einführung einer innergemeinschaftlichen Überwachung der Einfuhren
    von aus einem Drittland stammenden und in der Gemeinschaft im freien Verkehr befindlichen
    Waren, für die Schutzmaßnahmen gemäß Artikel 115 des Vertrages ergriffen werden
    können (Nur der italienische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 1. august 1980 om bemyndigelse af Den italienske
    Republik til at indføre tilsyn inden for Fællesskabet med indførsel af produkter,
    der har oprindelse i et tredjeland og er overgået til fri omsætning i Fællesskabet
    i henhold til traktatens artikel 115 (Kun den italienske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1 agosto 1980, che autorizza la Repubblica
    italiana ad istituire una sorveglianza intracomunitaria delle importazioni di
    prodotti originari di un paese terzo e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell'articolo 115
    del trattato (Il testo in lingua italiana è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 augustus 1980 houdende machtiging van
    de Italiaanse Republiek tot instelling van een intracommunautair toezicht ten
    aanzien van de invoer van produkten van oorsprong uit derde landen die in de Gemeenschap
    in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn van beschermende
    maatregelen krachtens artikel 115 van het Verdrag (Slechts de tekst in de Italiaanse
    taal is authentiek)
  type: main
