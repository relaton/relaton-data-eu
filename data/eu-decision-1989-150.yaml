id: EUDecision1989150
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '89/150/EEC: Council Decision of 27 February 1989 authorizing the automatic
    renewal or maintenance in force of provisions governing matters covered by the
    common commercial policy contained in the friendship, trade and navigation treaties
    and similar agreements concluded between Member States and third countries'
  type: main
- language: fr
  script: Latn
  content: '89/150/CEE: Décision du Conseil du 27 février 1989 autorisant la tacite
    reconduction ou le maintien en vigueur des dispositions dont les matières relèvent
    de la politique commerciale commune, contenues dans les traités d''amitié, de
    commerce et de navigation et accords similaires conclus par les États membres
    avec les pays tiers'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DES RATES vom 27. Februar 1989 zur Genehmigung der stillschweigenden
    Verlaengerung oder der Beibehaltung der Bestimmungen von Freundschafts-, Handels-
    und Schiffahrtsvertraegen sowie aehnlichen Abkommen zwischen den Mitgliedstaaten
    und dritten Laendern, deren Gegenstand unter die gemeinsame Handelspolitik faellt
    (89/150/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS BESLUTNING af 27. februar 1989 om bemyndigelse til stiltiende viderefoerelse
    eller opretholdelse af bestemmelser, hvis indhold er omfattet af den faelles handelspolitik,
    og som er indeholdt i de venskabs-, handels- og skibsfartstraktater og lignende
    aftaler, som medlemsstaterne har indgaaet med tredjelande (89/150/EOEF)
  type: main
- language: el
  script: Grek
  content: '89/150/ΕΟΚ: Απόφαση του Συμβουλίου της 27ης
    Φεβρουαρίου 1989 για την έγκριση της σιωπηρής
    ανανέωσης ή της διατήρησης σε ισχύ ορισμένων
    διατάξεων το αντικείμενο των οποίων υπάγεται
    στην κοινή εμπορική πολιτική και οι οποίες
    περιλαμβάνονται στις συνθήκες φιλίας, εμπορίου
    και ναυτιλίας και στις ομοειδείς συμφωνίες
    που έχουν συνάψει τα κράτη μέλη με τις τρίτες
    χώρες'
  type: main
- language: it
  script: Latn
  content: DECISIONE DEL CONSIGLIO del 27 febbraio 1989 che autorizza il tacito rinnovo
    o il mantenimento in vigore delle disposizioni relative a materie che rientrano
    nella politica commerciale comune contenute nei trattati d'amicizia, di commercio
    e di navigazione ed accordi analoghi conclusi dagli Stati membri con i paesi terzi
    (89/150/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE RAAD van 27 februari 1989 houdende machtiging tot stilzwijgende
    verlenging of handhaving van de bepalingen betreffende aangelegenheden die vallen
    onder de gemeenschappelijke handelspolitiek en die vervat zijn in de tussen de
    Lid-Staten en derde landen gesloten vriendschaps-, handels- en scheepvaartverdragen
    en soortgelijke akkoorden (89/150/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 27 de Fevereiro de 1989 que autoriza a reconduçao
    tacita ou a manutençao em vigor das disposiçoes cujas matérias sejam abrangidas
    pela politica comercial comum e figurem nos tratados de amizade, de comércio
    e de navegaçao e em acordos similares celebrados pelos Estados-membros com paises
    terceiros (89/150/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DEL CONSEJO de 27 de febrero de 1989 por la que se autoriza la
    tacita reconduccion o el mantenimiento en vigor de las disposiciones cuyas materias
    estén sujetas a la politica comercial comun contenidas en los tratados de amistad,
    comercio y navegacion, y acuerdos similares celebrados por los Estados miembros
    con terceros paises (89/150/CEE)
  type: main
