title:
- language: en
  script: Latn
  content: '79/224/EEC: Commission Decision of 7 February 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to drawn or blown glass, falling within heading No
    ex 70.05 of the Common Customs Tariff, originating in the USSR and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/224/CEE: Décision de la Commission, du 7 février 1979, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le verre étiré ou soufflé dit "verre
    à vitres", de la position ex 70.05 du tarif douanier commun, originaire d''Union
    soviétique et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/224/EWG: Entscheidung der Kommission vom 7. Februar 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus der UdSSR stammendes und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliches gezogenes oder geblasenes Flachglas, sogenanntes
    ,,Tafelglas'' '' , der Tarifnummer ex 70.05 des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/224/EØF: Kommissionens beslutning af 7. februar 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage planglas, trukket eller blæst, som
    henhører under pos. ex 70.05 i den fælles toldtarif har oprindelse i USSR og
    frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/224/CEE: Decisione della Commissione, del 7 febbraio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario il vetro tirato o soffiato detto "vetro
    per vetrate" della voce ex 70.05 della tariffa doganale comune, originario dell''
    URSS e messo in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/224/EEG: Beschikking van de Commissie van 7 februari 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd getrokken of geblazen glas (zogenaamd vensterglas), van post
    ex 70.05 van het gemeenschappelijk douanetarief, van oorsprong uit de Sowjet-Unie
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
