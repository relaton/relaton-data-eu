    ΣΟ 2922 41 00, καταγωγής Μεξικού, δικαιούχου των
    προβλεπόμενων από τον κανονισμό (ΕΟΚ) αριθ.
    3896/89 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3279/90 DELLA COMMISSIONE del 13 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 2922 41 00 originari del Messico beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3279/90 VAN DE COMMISSIE van 13 november 1990 houdende
