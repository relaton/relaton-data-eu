title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3279/90 of 13 November 1990 re-establishing
    the levying of customs duties applicable to the products falling within CN code
    2922 41 00 originating in Mexico, to which the preferential arrangements of Council
    Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3279/90 de la Commission du 13 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2922 41 00, originaires du Mexique, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3279/90 DER KOMMISSION vom 13. November 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer die Waren des KN-Codes 2922 41 00 mit Ursprung in
    Mexiko, dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3279/90 af 13. november 1990 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2922 41 00 og med oprindelse
    i Mexico, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3279/90 της Επιτροπής
