title:
- language: en
  script: Latn
  content: '89/203/EEC: Commission Decision of 13 March 1989 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of certain textile products
    originating in third countries and put into free circulation in the Community
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/203/CEE: Décision de la Commission du 13 mars 1989 autorisant le Royaume-Uni
    à procéder à une surveillance intracommunautaire des importations de certains
    produits textiles originaires des pays tiers et mis en libre pratique dans la
    Communauté (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '89/203/EWG: Entscheidung der Kommission vom 13. März 1989 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Textilwaren (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '89/203/EØF: Kommissionens beslutning af 13. marts 1989 om bemyndigelse
    af Det Forende Kongerige til at indfoere tilsyn inden for Faellesskabet med indfoerslen
    af visse tekstilvarer, der har oprindelse i visse tredjelande og er overgaaet
    til fri omsaetning i Faellesskabet (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '89/203/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Μαρτίου 1989 που εξουσιοδοτεί το Ηνωμένο Βασίλειο
    να θεσπίσει ενδοκοινοτική επιτήρηση των εισαγωγών
    ορισμένων κλωστοϋφαντουργικών προϊόντων,
    καταγωγής τρίτων χωρών, που βρίσκονται σε ελεύθερη
    κυκλοφορία στην Κοινότητα (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '89/203/CEE: Decisione della Commissione del 13 marzo 1989 che autorizza
    il Regno Unito ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti tessili originari di paesi terzi messi in libera pratica nella
    Comunità (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '89/203/EEG: Beschikking van de Commissie van 13 maart 1989 houdende machtiging
    van het Verenigd Koninkrijk tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van bepaalde textielprodukten van oorsprong uit derde
    landen, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst
    in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '89/203/CEE: Decisão da Comissão de 13 de Março de 1989 que autoriza
    o Reino Unido a proceder a uma vigilância intracomunitára das importaçoes de
    certos produtos têxteis originarios de paises terceiros e introduzidos em livre
    pratica na Comunidade (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '89/203/CEE: Decisión de la Comisión de 13 de marzo de 1989 por la que
    se autoriza al Reino Unido a establecer medidas de vigilancia intracomunitaria
    en relacion con las importaciones de determinados productos textiles originarios
    de terceros paises y despachados a libre practica en la Comunidad (El texto en
    lengua inglesa es el único auténtico)'
