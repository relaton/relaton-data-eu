    Eiropas Parlamenta un Padomes Direktīvu 2006/22/EK par minimālajiem nosacījumiem
    Padomes Regulu (EEK) Nr. 3820/85 un (EEK) Nr. 3821/85 īstenošanai saistībā
    ar sociālās jomas tiesību aktiem attiecībā uz darbībām autotransporta jomā
    un par Padomes Direktīvas 88/599/EEK atcelšanu
  type: main
