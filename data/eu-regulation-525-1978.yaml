  content: Commission Regulation (EEC) No 525/78 of 13 March 1978 amending and consolidating
    the Annex to Regulation (EEC) No 1687/76 laying down common detailed rules for
    verifying the use and/or destination of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 525/78 de la Commission, du 13 mars 1978, portant
