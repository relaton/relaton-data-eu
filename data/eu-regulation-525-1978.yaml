    der gemeinsamen Durchführungsbestimmungen für die Überwachung der Verwendung
    und/oder Bestimmung von Erzeugnissen aus den Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 525/78 af 13. marts 1978 om ændring
