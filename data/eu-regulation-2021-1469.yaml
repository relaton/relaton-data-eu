  content: Commission Implementing Regulation (EU) 2021/1469 of 10 September 2021
    amending Implementing Regulation (EU) 2020/2235 as regards the addition of a new
    model certificate for products of animal origin that originate in the Union, are
    moved to a third country or territory and moved back to the Union after unloading,
    storage and reloading in that third country or territory, amending Implementing
    Regulation (EU) 2021/404 as regards the list of third countries authorised for
    entry into the Union of products of animal origin originated in and returning
    to the Union from a third country or territory, and amending Implementing Regulation
    (EU) 2021/405 as regards the list of third countries or regions thereof authorised
    for entry into the Union of products of animal origin and certain goods originated
    in and returning to the Union from a third country or region thereof
