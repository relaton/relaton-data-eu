    de 2021 que altera o Regulamento de Execução (UE) 2020/2235 no que diz respeito
    ao aditamento de um novo modelo de certificado para produtos de origem animal
    originários da União, transportados para um país terceiro ou território e
    que regressam à União após descarregamento, armazenamento e recarregamento
    nesse país terceiro ou território, que altera o Regulamento de Execução (UE)
    2021/404 no que diz respeito à lista de países terceiros autorizados para a
    entrada na União de produtos de origem animal originários da União e que regressam
    à União a partir de um país terceiro ou território, e que altera o Regulamento
    de Execução (UE) 2021/405 no que diz respeito à lista de países terceiros
    ou regiões de países terceiros autorizados para a entrada na União de produtos
    de origem animal e determinadas mercadorias originários da União e que regressam
    à União a partir de um país terceiro ou respetiva região
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/1469 al Comisiei din 10 septembrie
    2021 de modificare a Regulamentului de punere în aplicare (UE) 2020/2235 în
    ceea ce privește adăugarea unui nou model de certificat pentru produsele de
    origine animală care provin din Uniune, sunt circulate într-o țară terță
    sau un teritoriu terț și circulate înapoi în Uniune după descărcare, depozitare
    și reîncărcare în acea țară terță sau teritoriu terț, de modificare a
    Regulamentului de punere în aplicare (UE) 2021/404 în ceea ce privește lista
    țărilor terțe autorizate pentru introducerea în Uniune a produselor de origine
    animală originare din și care se întorc în Uniune dintr-o țară terță sau
    teritoriu terț și de modificare a Regulamentului de punere în aplicare (UE)
    2021/405 în ceea ce privește lista țărilor terțe sau a regiunilor acestora
    autorizate pentru introducerea în Uniune a produselor de origine animală și
    a anumitor mărfuri originare din și returnate în Uniune dintr-o țară terță
    sau dintr-o regiune a acesteia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1469 z 10. septembra 2021, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2020/2235, pokiaľ ide o pridanie nového
    vzoru certifikátu pre produkty živočíšneho pôvodu, ktoré pochádzajú z
    Únie, premiestňujú sa do tretej krajiny alebo na územie a po vyložení, skladovaní
    a opätovnom naložení v tejto tretej krajine alebo na tomto území sa premiestňujú
    späť do Únie, ktorým sa mení vykonávacie nariadenie (EÚ) 2021/404, pokiaľ
    ide o zoznam tretích krajín, z ktorých sa do Únie povoľuje vstup produktov
    živočíšneho pôvodu, ktoré pochádzajú z tretej krajiny alebo územia a
    vracajú sa do Únie z tretej krajiny alebo územia, a ktorým sa mení vykonávacie
    nariadenie (EÚ) 2021/405, pokiaľ ide o zoznam tretích krajín alebo ich regiónov,
    z ktorých sa do Únie povoľuje vstup produktov živočíšneho pôvodu a určitého
    tovaru, ktoré pochádzajú z tretej krajiny alebo jej regiónu alebo sa vracajú
    do Únie z tretej krajiny alebo jej regiónu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/1469 z dne 10. septembra 2021 o spremembi
    Izvedbene uredbe (EU) 2020/2235 glede dodajanja novega vzorca spričevala za proizvode
    živalskega izvora, ki izvirajo iz Unije, se premikajo v tretjo državo ali na
    ozemlje in se premikajo nazaj v Unijo po raztovarjanju, skladiščenju in ponovnem
    natovarjanju v navedeni tretji državi ali na navedenem ozemlju, o spremembi Izvedbene
    uredbe (EU) 2021/404 glede seznama tretjih držav, iz katerih je dovoljen vstop
    proizvodov živalskega izvora v Unijo, ki izvirajo iz Unije in se vanjo vračajo
    iz tretje države ali z ozemlja, ter o spremembi Izvedbene uredbe (EU) 2021/405
    glede seznama tretjih držav ali njihovih regij, iz katerih je dovoljen vstop
    proizvodov živalskega izvora in nekaterega blaga v Unijo, ki izvirajo iz Unije
    in se vanjo vračajo iz tretje države ali njene regije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1469 de la Comisión de 10 de septiembre
    de 2021 por el que se modifica el Reglamento de Ejecución (UE) 2020/2235 en lo
    que respecta a la adición de un nuevo modelo de certificado para los productos
    de origen animal que sean originarios de la Unión, se desplacen a un tercer país
    o territorio y vuelvan a desplazarse a la Unión tras su descarga, almacenamiento
    y nueva carga en ese tercer país o territorio, por el que se modifica el Reglamento
    de Ejecución (UE) 2021/404 en lo que respecta a la lista de terceros países
    autorizados a introducir en la Unión productos de origen animal originarios de
    la Unión y que retornan a ella procedentes de un tercer país o territorio y
    por el que se modifica el Reglamento de Ejecución (UE) 2021/405 en lo que respecta
    a la lista de terceros países o regiones de los mismos autorizados a introducir
    en la Unión productos de origen animal y determinadas mercancías originarias
    de la Unión y que retornan a ella procedentes de un tercer país o región
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1469 av den 10 september
    2021 om ändring av genomförandeförordning (EU) 2020/2235 vad gäller tillägg
    av en ny förlaga till intyg för produkter av animaliskt ursprung med ursprung
    i unionen som flyttas till ett tredjeland eller territorium och sedan tillbaka
    till unionen efter lossning, lagring och omlastning i det tredjelandet eller territoriet,
    om ändring av genomförandeförordning (EU) 2021/404 vad gäller förteckningen
    över tredjeländer från vilka produkter av animaliskt ursprung med ursprung
    i unionen får föras in till unionen vid återsändning från ett tredjeland
    eller territorium, och om ändring av genomförandeförordning (EU) 2021/405 vad
    gäller förteckningen över tredjeländer eller regioner i tredjeländer från
    vilka produkter av animaliskt ursprung och vissa varor med ursprung i unionen
    får föras in till unionen vid återsändning från ett tredjeland eller en region
    i ett tredjeland
  type: main
