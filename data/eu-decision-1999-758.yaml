    para utilizar a certificação veterinária para a importação de carne de caça,
    de carne de caça de criação e de carne de coelho provenientes de países terceiros
    [notificada com o número C(1999) 3584]'
  type: main
- language: es
  script: Latn
  content: '1999/758/CE: Decisión de la Comisión, de 5 de noviembre de 1999, que
