title:
- language: en
  script: Latn
  content: '1999/758/EC: Commission Decision of 5 November 1999 amending Decision
    97/217/EC establishing groups of third countries which are able to use the veterinary
    certification for imports of wild game meat, farmed game meat and rabbit meat
    from third countries (notified under document number C(1999) 3584)'
  type: main
- language: fr
  script: Latn
  content: '1999/758/CE: Décision de la Commission, du 5 novembre 1999, modifiant
    la décision 97/217/CE établissant des groupes de pays tiers pouvant utiliser
    les certificats vétérinaires pour les importations de viandes de gibier, de
    viandes de gibier d''élevage et de viandes de lapin en provenance de pays tiers
    [notifiée sous le numéro C(1999) 3584]'
  type: main
- language: de
  script: Latn
  content: '1999/758/EG: Entscheidung der Kommission vom 5. November 1999 zur Änderung
    der Entscheidung 97/217/EG zur Bildung von Gruppen von Drittländern, die die
    Veterinärbescheinigung für die Einfuhr von Fleisch von freilebendem Wild, Zuchtwild
    und Kaninchen aus Drittländern verwenden dürfen (Bekanntgegeben unter Aktenzeichen
    K(1999) 3584)'
  type: main
- language: da
  script: Latn
  content: '1999/758/EF: Kommissionens beslutning af 5. november 1999 om ændring
    af beslutning 97/217/EF om grupper af tredjelande, der kan benytte sundheds- og
    hygiejnecertifikaterne i forbindelse med indførsel af kød af vildtlevende vildt,
    kød af opdrættet vildt og kaninkød fra tredjelande (meddelt under nummer K(1999)
    3584)'
  type: main
- language: el
  script: Grek
  content: '1999/758/ΕΚ: Απόφαση της Επιτροπής, της 5ης
    Νοεμβρίου 1999, για τροποποίηση της απόφασης
    97/217/ΕΚ για τον καθορισμό ομάδων τρίτων χωρών
    οι οποίες δύνανται να χρησιμοποιούν την κτηνιατρική
    πιστοποίηση για εισαγωγές κρέατος αγρίων θηραμάτων,
    κρέατος εκτρεφομένων θηραμάτων και κρέατος
    κουνελιών από τρίτες χώρες [κοινοποιηθείσα
    υπό τον αριθμό Ε(1999) 3584]'
  type: main
- language: fi
  script: Latn
  content: '1999/758/EY: Komission päätös, tehty 5 päivänä marraskuuta 1999,
    niiden kolmansien maiden ryhmistä, jotka voivat käyttää eläinlääkärintodistuksia
    luonnonvaraisen riistan lihan ja tarhatun riistan sekä kaninlihan tuonnissa kolmansista
    maista, tehdyn päätöksen 97/217/EY muuttamisesta (tiedoksiannettu numerolla
    K(1999) 3584)'
  type: main
- language: it
  script: Latn
  content: '1999/758/CE: Decisione della Commissione, del 5 novembre 1999, recante
    modifica della decisione 97/217/CE che definisce i gruppi di paesi terzi cui è
    consentito utilizzare i certificati veterinari previsti per l''importazione di
    carni di selvaggina, carni di selvaggina d''allevamento e carni di coniglio provenienti
    da paesi terzi [notificata con il numero C(1999) 3584]'
  type: main
- language: nl
  script: Latn
  content: '1999/758/EG: Beschikking van de Commissie van 5 november 1999 houdende
    wijziging van Beschikking 97/217/EG tot vaststelling van groepen van derde landen
    die kunnen voldoen aan de eisen inzake veterinaire certificering voor de invoer
    van vlees van vrij wild, vlees van gekweekt wild en konijnenvlees uit derde landen
    (kennisgeving geschied onder nummer C(1999) 3584)'
  type: main
- language: pt
  script: Latn
  content: '1999/758/CE: Decisão da Comissão, de 5 de Novembro de 1999, que altera
