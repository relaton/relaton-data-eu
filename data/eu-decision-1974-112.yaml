    per la riconversione di mandrie bovine ad orientamento lattiero verso la produzione
    di carne derivanti, per la Repubblica francese, dalla concessione del premio a
    produttori che detengano in talune regioni da 5 a 10 vacche da latte'
  type: main
- language: nl
  script: Latn
  content: '74/112/EEG: Beschikking van de Commissie van 30 januari 1974 betreffende
    de financiële deelneming van de Gemeenschap in de kosten van het stelsel van
    premies voor de omschakeling van de melkveestapel op de rundvleesproduktie, die
    in de Franse Republiek worden gemaakt door de toekenning van de premie aan de
    producenten die in bepaalde gebieden 5 tot 10 melkkoeien houden'
