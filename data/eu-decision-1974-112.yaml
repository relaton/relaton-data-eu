title:
- language: en
  script: Latn
  content: '74/112/EEC: Commission Decision of 30 January 1974 on financial contribution
    by the Community towards expenditure arising from the grant to producers in certain
    regions of the French Republic who keep not less than five but not more than ten
    dairy cows of premiums for the conversion of dairy herds to meat production'
  type: main
- language: fr
  script: Latn
  content: '74/112/CEE: Décision de la Commission, du 30 janvier 1974, pour la participation
    financière de la Communauté aux coûts du régime de prime à la reconversion
    vers la production de viande de troupeaux bovins à orientation laitière qui,
    par l'' octroi de la prime aux producteurs détenant, dans certaines régions,
    de 5 à 10 vaches laitières, en résultent pour la République française'
  type: main
- language: de
  script: Latn
  content: '74/112/EWG: Entscheidung der Kommission vom 30. Januar 1974 über die
    finanzielle Beteiligung der Gemeinschaft an den Kosten der Prämienregelung zur
    Umstellung von Milchkuhbeständen auf Bestände zur Fleischerzeugung, die in Frankreich
    durch die Gewährung der Prämie an Erzeuger, die in bestimmten Gebieten 5 bis
    10 Milchkühe halten, entstehen'
  type: main
- language: da
  script: Latn
  content: '74/112/EØF: Kommissionens Beslutning af 30. januar 1974 om Fællesskabets
