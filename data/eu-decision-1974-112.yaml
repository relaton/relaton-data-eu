    ved ydelse af en præmie til producenter, som holder mellem 5 og 10 malkekøer
    i bestemte områder'
  type: main
- language: it
  script: Latn
  content: '74/112/CEE: Decisione della Commissione, del 30 gennaio 1974, relativa
