    saavatesse sõiduautodesse paigaldatud 12-voldiste suure kasuteguriga vahelduvvoolugeneraatorite
    kasutamine
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/759, annettu 8 päivänä
    kesäkuuta 2020, täytäntöönpanopäätöksen (EU) 2016/588 muuttamisesta sen
    soveltamisalan laajentamiseksi koskemaan tehokkaiden 12V:n vaihtovirtageneraattoreiden
    käyttöä tietyillä vaihtoehtoisilla polttoaineilla toimivissa henkilöautoissa
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/759 оd 8. lipnja 2020. o izmjeni
