title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/759 of 8 June 2020 amending
    Implementing Decision (EU) 2016/588 in order to include the use of 12 Volt efficient
    alternators in passenger cars capable of running on certain alternative fuels
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/759 de la Commission du 8 juin 2020
    modifiant la décision d’exécution (UE) 2016/588 afin d’inclure l’utilisation
    d’alternateurs 12 volts à haut rendement dans les voitures particulières pouvant
    fonctionner avec certains carburants de substitution
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/759 der Kommission vom 8. Juni 2020 zur
    Änderung des Durchführungsbeschlusses (EU) 2016/588 im Hinblick auf die Verwendung
    effizienter 12-Volt-Generatoren in Pkw, die mit bestimmten alternativen Kraftstoffen
    betrieben werden können
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/759 на Комисията
    от 8 юни 2020 година за изменение на Решение за
    изпълнение (ЕС) 2016/588 с цел включване на използването
    на ефективни алтернатори за напрежение 12 V
    в пътнически леки автомобили, които могат да
    работят с определени алтернативни горива
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/759 ze dne 8. června 2020, kterým
    se mění prováděcí rozhodnutí (EU) 2016/588 tak, aby zahrnulo používání
    12voltových účinných alternátorů v osobních automobilech, které mohou
    používat některá alternativní paliva
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/759 af 8. juni 2020 om
    ændring af gennemførelsesafgørelse (EU) 2016/588, således at den omfatter
    anvendelse af 12 volts effektive generatorer i personbiler, der kan køre på
    visse alternative brændstoffer
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/759 της Επιτροπής
