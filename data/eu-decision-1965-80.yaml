title:
- language: fr
  script: Latn
  content: Décision 65/80/CEE de la Commission, du 27 janvier 1965, relative au recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire les "filets de poissons de mer, frais, réfrigérés
    ou congelés" de la position 03.01 B du Tarif douanier commun, originaires du
    Danemark et du Royaume-Uni et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/80/EWG: Entscheidung der Kommission vom 27. Januar 1965 betreffend
    den Antrag der Französischen Republik, gemäß Artikel 115 Absatz (1) EWG, "Filets
    von Seefischen, frisch, gekühlt oder gefroren", der Tarifnummer 03.01 B des Gemeinsamen
    Zolltarifs, mit Ursprung in Dänemark und Großbritannien und in anderen Mitgliedstaaten
    zum freien Verkehr abgefertigt, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/80/CEE: Decisione della Commissione, del 27 gennaio 1965, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario i «filetti di pesci di mare, freschi,
    refrigerati o congelati», della voce 03.01 B della tariffa doganale comune, originari
    della Danimarca, del Regno Unito e immessi in libera pratica negli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: '65/80/EEG: Beschikking van de Commissie van 27 januari 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea
    van het Verdrag filets van zeevis, vers, gekoeld of bevroren, van post Nr. 03.01
    B van het gemeenschappelijk douanetarief, die van oorsprong zijn uit Denemarken
    en het Verenigd Koninkrijk en in de andere Lid-Staten in het vrije verkeer zijn
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
