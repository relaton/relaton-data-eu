  content: Commission Regulation (EC) No 1103/94 of 11 May 1994 re- establishing the
    levying of customs duties on certain textile products originating in Malaysia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1103/94 de la Commission du 11 mai 1994 portant rétablissement
