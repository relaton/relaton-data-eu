title:
- language: en
  script: Latn
  content: '93/185/EEC: Commission Decision of 15 March 1993 laying down certain transitional
    measures concerning the certification of fishery products from third countries
    in order to facilitate the switchover to the arrangements laid down in Council
    Directive 91/493/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/185/CEE: Décision de la Commission, du 15 mars 1993, fixant certaines
    mesures transitoires en ce qui concerne la certification des produits de la pêche
    en provenance des pays tiers, afin de faciliter le passage au régime prévu par
    la directive 91/493/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '93/185/EWG: Entscheidung der Kommission vom 15. März 1993 mit Übergangsmaßnahmen
    hinsichtlich der Erteilung von Bescheinigungen für Fischereierzeugnisse aus Drittländern
    zur Erleichterung der Umstellung auf die Regelung der Richtlinie 91/493/EWG des
    Rates'
  type: main
- language: da
  script: Latn
  content: '93/185/EØF: Kommissionens beslutning af 15. marts 1993 om overgangsforanstaltninger
    for sundhedscertifikater for fiskerivarer fra tredjelande for at lette overgangen
    til ordningen i direktiv 91/493/EØF'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 15ης Μαρτίου 1993
    για τον καθορισμό ορισμένων μεταβατικών μέτρων
    όσον αφορά την πιστοποίηση των προϊόντων αλιείας
    προέλευσης τρίτων χωρών, με σκοπό να διευκολυνθεί
    η μετάβαση στο καθεστώς το οποίο προβλέπεται
    στην οδηγία 91/493/ΕΟΚ του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: '93/185/CEE: Decisione della Commissione, del 15 marzo 1993, che stabilisce
    determinate misure transitorie per quanto concerne la certificazione dei prodotti
    della pesca provenienti da paesi terzi, per facilitare il passaggio al regime
    previsto dalla direttiva 91/493/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '93/185/EEG: Beschikking van de Commissie van 15 maart 1993 tot vaststelling
    van overgangsmaatregelen inzake de certificering van visserijprodukten uit derde
    landen, om de overgang naar de bij Richtlijn 91/493/EEG ingestelde regeling te
    vergemakkelijken'
  type: main
- language: pt
  script: Latn
  content: '93/185/CEE: Decisão da Comissão, de 15 de Março de 1993, que fixa determinadas
