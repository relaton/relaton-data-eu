    provenientes dos países terceiros, a fim de facilitar a passagem para o regime
    previsto na Directiva 91/493/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '93/185/CEE: Decisión de la Comisión, de 15 de marzo de 1993, por el
    que se establecen medidas transitorias sobre la certificación de los productos
    de la pesca procedentes de terceros países, para facilitar el paso al régimen
    previsto por la Directiva 91/493/CEE del Consejo'
