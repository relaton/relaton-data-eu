title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1043/87 of 10 April 1987 imposing a provisional
    anti-dumping duty on imports of standardized multi-phase electric motors having
    an output of more than 0,75 kW but not more than 75 kW, originating in Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1043/87 de la Commission du 10 avril 1987 instituant
    un droit antidumping provisoire à l' égard des importations de moteurs électriques
    polyphasés normalisés d' une puissance de plus de 0,75 à 75 kilowatts inclus
    originaires de Yougoslavie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1043/87 der Kommission vom 10. April 1987 zur Einführung
    eines vorläufigen Antidumpingzolls auf die Einfuhren von standardisierten Mehrphasen-Wechselstrommotoren
    mit einer Leistung von mehr als 0,75 bis 75 kW mit Ursprung in Jugoslawien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1043/87 af 10. april 1987 om indførelse
    af en midlertidig antidumpingtold på importen af standardiserede elektriske motorer,
    flerfasede, med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Jugoslavien
  type: main
- language: el
  script: Grek
