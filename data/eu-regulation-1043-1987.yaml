    πολυφασικών ηλεκτρικών κινητήρων ισχύος μεγαλύτερης
    από 0,75 αλλά όχι μεγαλύτερης από 75 kilowatts, καταγωγής
    Γιουγκοσλαβίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1043/87 della Commissione del 10 aprile 1987 che istituisce
    un dazio antidumping provvisorio sulle importazioni di motori elettrici polifase
    normalizzati di potenza superiore a 0,75 kW ed inferiore o pari a 75 kW originari
    della Iugoslavia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1043/87 van de Commissie van 10 april 1987 tot instelling
    van een voorlopig anti-dumpingrecht op de invoer van gestandaardiseerde meerfasige
    elektromotoren met een vermogen van meer dan 0,75 kW tot en met 75 kW, van oorsprong
    uit Joegoslavië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1043/87 da Comissão de 10 de Abril de 1987 que
