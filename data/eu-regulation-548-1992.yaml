title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 548/92 of 3 February 1992 complementing Regulation
    (EEC) No 3587/91 extending into 1992 the application of Regulation (EEC) No 3833/90
    applying generalized tariff preferences for 1991 in respect of certain agricultural
    products originating in developing countries with the view of re-establishing
    the benefit of these preferences in respect of the Republics of Croatia and Slovenia
    and the Yugoslavia Republics of Bosnia-Herzegovina, Macedonia and Montenegro
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 548/92 du Conseil du 3 février 1992 complétant le
    règlement (CEE) n° 3587/91 prorogeant en 1992 l'application du règlement (CEE)
    n° 3833/90, portant application de préférences tarifaires généralisées pour
    l'année 1991 à certains produits agricoles originaires de pays en développement
    en vue de rétablir le bénéfice de ces préférences à l'égard des Républiques
    de Croatie et de Slovénie et des Républiques yougoslaves de Bosnie-Herzégovine,
    de Macédoine et de Monténégro
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 548/92 DES RATES vom 3. Februar 1992 zur Ergänzung
    der Verordnung (EWG) Nr. 3587/91 zur Verlängerung für 1992 der Anwendung der
    Verordnung (EWG) Nr. 3833/90 zur Anwendung allgemeiner Zollpräferenzen für bestimmte
    Agrarerzeugnisse mit Ursprung in Entwicklungsländern im Jahr 1991 im Hinblick
    auf die Wiedereinsetzung der Gewährung dieser Präferenzen gegenüber den Republiken
    Kroatien und Slowenien und den Jugoslawischen Republiken Bosnien-Herzegowina,
    Mazedonien und Montenegro #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 548/92 af 3. februar 1992 om supplering
    af forordning (EØF) nr. 3587/91 om forlængelse i 1992 af gyldighedsperioden
    for forordning (EØF) nr. 3833/90 om anvendelse af generelle toldpræferencer
    i 1991 for visse landbrugsprodukter med oprindelse i udviklingslande med henblik
    på genindførelse af adgangen til disse præferencer for republikkerne Kroatien
    og Slovenien og de jugoslaviske republikker Bosnien-Hercegovina, Makedonien og
    Montenegro #'
  type: main
- language: el
  script: Grek
