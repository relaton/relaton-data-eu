    Κροατίας και της Σλοβενίας και των Γιουγκοσλαβικών
    Δημοκρατιών της Βοσνίας - Ερζεγοβίνης, της
    Μακεδονίας και του Μαυροβουνίου
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 548/92 DEL CONSIGLIO del 3 febbraio 1992 che completa
    il regolamento (CEE) n. 3587/91 che proroga nel 1992 l'' applicazione del regolamento
    (CEE) n. 3833/90, recante l'' applicazione di preferenze tariffarie generalizzate,
    per l'' anno 1991, a taluni prodotti agricoli originari di paesi in via di sviluppo
    per ripristinare il beneficio di tali preferenze a favore delle Repubbliche di
    Croazia e Slovenia e delle Repubbliche iugoslave di Bosnia-Erzegovina, Macedonia
    e Montenegro #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 548/92 VAN DE RAAD van 3 februari 1992 tot aanvulling
    van Verordening (EEG) nr. 3587/91, waarbij in 1992 de toepassing wordt verlengd
    van Verordening (EEG) nr. 3833/90 houdende toepassing van algemene tariefpreferenties
    voor het jaar 1991 voor bepaalde landbouwprodukten van oorsprong uit ontwikkelingslanden,
    ten einde deze preferenties met betrekking tot de Republieken Kroatië en Slovenië
    en de Joegoslavische Republieken Bosnië-Herzegowina, Macedonië en Montenegro
    opnieuw te laten gelden #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No. 548/92 DO CONSELHO de 3 de Fevereiro de 1992 que
    completa o Regulamento (CEE) no. 3587/91, prorrogando em 1992 a aplicação do
    Regulamento (CEE) no. 3833/90, que aplica preferências pautais generalizadas
    para o ano de 1991 a certos produtos agrícolas originários de países em vias
    de desenvolvimento, com vista a restabelecer o benefício destas preferências
    no que respeita às repúblicas da Croácia e da Eslovénia e às Repúblicas
    jugoslavas da Bósnia-Herzegovina, da Macedónia e do Montenegro #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 548/92 DEL CONSEJO de 3 de febrero de 1992 que completa
    el Reglamento (CEE) no 3587/91 por el que se prorroga para 1992 la aplicación
    del Reglamento (CEE) no 3833/90 por el que se aplican las preferencias arancelarias
    generalizadas para el año 1991 a determinados productos agrarios originarios
    de países en vías de desarrollo a fin de restablecer el beneficio de estas preferencias
    en las Repúblicas de Croacia y de Eslovenia y en las Repúblicas yugoslavas de
    Bosnia-Herzegovina, de Macedonia y de Montenegro #'
