    της συνδυασμένης ονοματολογίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3296/88 della Commissione del 24 ottobre 1988 che
    modifica taluni regolamenti relativi all' applicazione dell' organizzazione comune
    dei mercati in seguito all' adesione della Spagna e del Portogallo a causa dell'
    introduzione della nomenclatura combinata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3296/88 van de Commissie van 24 oktober 1988 tot
