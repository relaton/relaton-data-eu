    marchés, suite à l' adhésion de l' Espagne et du Portugal, en raison de l'
    introduction de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3296/88 der Kommission vom 24. Oktober 1988 zur Änderung
    bestimmter Verordnungen zur Anwendung der gemeinsamen Marktorganisation wegen
    des Beitritts Spaniens und Portugals, infolge der Einführung der Kombinierten
    Nomenklatur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3296/88 af 24. oktober 1988 om ændring
    af visse forordninger vedrørende anvendelsen af den fælles markedsordning som
    følge af Spaniens og Portugals tiltrædelse, som følge af indførelsen af Den
    Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
