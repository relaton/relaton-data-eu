title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1969, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les divers produits
    agricoles transformés à base de fruits et légumes des positions Ex 20.01, Ex
    20.02, Ex 20.06, Ex 20.07 du Tarif douanier commun, originaires de différents
    pays tiers et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/62/EWG: Entscheidung der Kommission vom 23. Dezember 1969 zur Ermächtigung
    der Bundesrepublik Deutschland, verschiedene aus verschiedenen dritten Ländern
    stammende und in den anderen Mitgliedstaaten in den freien Verkehr gebrachte Landwirtschafts-
    Verarbeitungserzeugnisse des Obst- und Gemüsesektors der Positionen ex 20.01,
    ex 20.02 ex 20.06 und ex 20.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/62/CEE: Decisione della Commissione, del 23 dicembre 1969, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario certi
    prodotti agricoli trasformati a base di ortofrutticoli delle voci ex 20.01, ex
    20.02, ex 20.06 e ex 20.07 della tariffa doganale comune, originari di diversi
    paesi terzi e immessi in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/62/EEG: Beschikking van de Commissie van 23 december 1969 houdende
    machtiging van de Bondsrepubliek Duitsland om verscheidene op basis van groenten
    en fruit verwerkte landbouwprodukten van de posten ex 20.01, ex 20.02, ex 20.06
    en 20.07 van het gemeenschappelijk douanetarief die van oorsprong zijn uit verschillende
    derde landen en in andere Lid-Staten in het vrije verkeer zijn gebracht, van de
    communautaire behandeling uit te sluiten'
  type: main
