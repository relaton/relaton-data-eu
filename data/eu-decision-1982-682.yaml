  content: '82/682/EEC: Commission Decision of 27 September 1982 establishing that
    the apparatus described as ''JEOL - Scanning Microscope, model JSM-T200'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/682/CEE: Décision de la Commission, du 27 septembre 1982, constatant
    que l''importation de l''appareil dénommé "JEOL - Scanning Microscope, model
    JSM-T200" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/682/EWG: Entscheidung der Kommission vom 27. September 1982, mit der
    festgestellt wird, daß das Gerät ,,Jeol-Scanning Microscope, model JSM-T200"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/682/EØF: Kommissionens beslutning af 27. september 1982 om fastslåelse
    af, at indførsel af apparatet "Jeol- Scanning Microscope, model JSM-T200" ikke
    kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
