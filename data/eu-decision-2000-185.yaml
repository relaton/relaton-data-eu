title:
- language: en
  script: Latn
  content: '2000/185/EC: Council Decision of 28 February 2000 authorising Member States
    to apply a reduced rate of VAT to certain labour-intensive services in accordance
    with the procedure provided for in Article 28(6) of Directive 77/388/EEC'
  type: main
- language: fr
  script: Latn
  content: '2000/185/CE: Décision du Conseil, du 28 février 2000, autorisant les
    États membres à appliquer un taux réduit de TVA sur certains services à forte
    intensité de main-d''oeuvre conformément à la procédure prévue à l''article
    28, paragraphe 6, de la directive 77/388/CEE'
  type: main
- language: de
  script: Latn
  content: '2000/185/EG: Entscheidung des Rates vom 28. Februar 2000 zur Ermächtigung
    der Mitgliedstaaten, auf bestimmte arbeitsintensive Dienstleistungen einen ermäßigten
    Mehrwertsteuersatz anzuwenden (Verfahren gemäß Artikel 28 Absatz 6 der Richtlinie
    77/388/EWG)'
  type: main
- language: da
  script: Latn
  content: '2000/185/EF: Rådets beslutning af 28. februar 2000 om bemyndigelse af
    medlemsstaterne til at anvende en nedsat momssats for visse arbejdskraftintensive
    tjenesteydelser i overensstemmelse med proceduren i artikel 28, stk. 6, i direktiv
    77/388/EØF'
  type: main
- language: el
  script: Grek
  content: '2000/185/ΕΚ: Απόφαση του Συμβουλίου, της 28ης
    Φεβρουαρίου 2000, με την οποία επιτρέπεται στα
    κράτη μέλη να εφαρμόσουν μειωμένο συντελεστή
    ΦΠΑ σε ορισμένες υπηρεσίες υψηλής έντασης
    εργατικού δυναμικού, σύμφωνα με τη διαδικασία
    που προβλέπεται στο άρθρο 28 παράγραφος 6 της
    οδηγίας 77/388/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '2000/185/EY: Neuvoston päätös, tehty 28 päivänä helmikuuta 2000,
    luvan antamisesta jäsenvaltioille soveltaa alennettua arvonlisäverokantaa tiettyihin
    erityisen työvaltaisiin palveluihin direktiivin 77/388/ETY 28 artiklan 6 kohdassa
    säädetyn menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: '2000/185/CE: Decisione del Consiglio, del 28 febbraio 2000, che autorizza
    gli Stati membri ad applicare un''aliquota IVA ridotta su taluni servizi ad alta
    intensità di lavoro secondo la procedura di cui all''articolo 28, paragrafo 6,
    della direttiva 77/388/CEE'
  type: main
- language: nl
  script: Latn
  content: '2000/185/EG: Beschikking van de Raad van 28 februari 2000 waarbij de lidstaten
    worden gemachtigd om overeenkomstig de procedure vastgesteld in artikel 28, lid
    6, van Richtlijn 77/388/EEG een verlaagd BTW-tarief op bepaalde arbeidsintensieve
    diensten toe te passen'
  type: main
- language: pt
  script: Latn
  content: '2000/185/CE: Decisão do Conselho, de 28 de Fevereiro de 2000, que autoriza
    os Estados-Membros a aplicar uma taxa reduzida de IVA a certos serviços com grande
    intensidade do factor trabalho, nos termos do n.o 6 do artigo 28.o da Directiva
    77/388/CEE'
  type: main
- language: es
  script: Latn
  content: '2000/185/CE: Decisión del Consejo, de 28 de febrero de 2000, por la que
