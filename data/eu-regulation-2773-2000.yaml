    περί θεσπίσεως συμπληρωματικών όρων για την
    ετήσια διαχείριση των TAC και ποσοστώσεων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2773/2000, annettu 18 päivänä joulukuuta 2000,
