    introduce condizioni complementari per la gestione annuale dei TAC e dei contingenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2773/2000 van de Commissie van 18 december 2000 houdende
    wijziging van Verordening (EG) nr. 1902/2000 en aanpassing van sommige vangstquota
