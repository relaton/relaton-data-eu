  script: Latn
  content: Commission Regulation (EC) No 2773/2000 of 18 December 2000 amending Regulation
    (EC) No 1902/2000 adapting certain fish quotas for 2000 pursuant to Council Regulation
    (EC) No 847/96 introducing additional conditions for year-to-year management of
    TACs and quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2773/2000 de la Commission du 18 décembre 2000 portant
