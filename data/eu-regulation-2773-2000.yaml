    für 2000 gemäß der Verordnung (EG) Nr. 847/96 des Rates zur Festlegung zusätzlicher
    Bestimmungen für die jahresübergreifende Verwaltung der TAC und Quoten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2773/2000 af 18. december 2000 om ændring
