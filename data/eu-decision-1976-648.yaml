---
id: EUDecision1976648
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 31 March 1976 authorizing the United Kingdom not
    to apply Community treatment to certain men's and boys' outer garments suits and
    jackets), falling within heading No ex 61.01 of the Common Customs Tariff, originating
    in Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/648/CEE: Décision de la Commission, du 31 mars 1976, autorisant le
    Royaume-Uni à exclure du traitement communautaire certains vêtements de dessus
    pour hommes et garçonnets (costumes et vestes), de la position Ex 61.01 du Tarif
    douanier commun, originaires de Taiwan et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 31. März 1976, mit der das Vereinigte
    Königreich ermächtigt wird, bestimmte aus Taiwan stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Oberkleidung für Männer und Knaben
    (Anzüge und Jacken) der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 31. marts 1976 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage visse yderbeklædningsgenstande
    til mænd og drenge (jækkesæt og jakker), som henhører under pos. ex 61.01
    i den fælles toldtarif, har oprindelse i Taïwan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 31 marzo 1976, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario taluni indumenti esterni per uomo
    e per ragazzo (vestiti completi e giacche) di cui alla voce ex 61.01 della tariffa
    doganale comune, originari di Taiwan e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 31 maart 1976 waarbij het Verenigd Koninkrijk
    wordt gemachtigd bepaalde herenbovenkleding en jongensbovenkleding (kostuums en
    jassen) van post ex 61.01 van het gemeenschappelijk douanetarief, van oorsprong
    uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
