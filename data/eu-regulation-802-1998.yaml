id: EURegulation8021998
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 802/98 of 16 April 1998 initiating a 'new
    exporter' review of Council Regulation (EC) No 1950/97 imposing a definitive anti-dumping
    duty on imports of sacks and bags made of polyethylene or polypropylene originating,
    inter alia, in India, repealing the duty with regard to imports from four exporters
    in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 802/98 de la Commission du 16 avril 1998 portant ouverture
    d'un réexamen pour un «nouvel exportateur» du règlement (CE) nº 1950/97 du
    Conseil instituant un droit antidumping définitif sur les importations de sacs
    et sachets de polyéthylène ou de polypropylène originaires, entre autres, d'Inde,
    abrogeant le droit en ce qui concerne les importations de quatre exportateurs
    de ce pays et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 802/98 der Kommission vom 16. April 1998 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 1950/97 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Säcken und Beuteln
    aus Polyethylen oder Polypropylen mit Ursprung unter anderem in Indien (Überprüfung
    für neue Ausführer), zur Außerkraftsetzung des Zolls gegenüber den Einfuhren
    der Ware von vier Ausführern in diesem Land und zur zollamtlichen Erfassung dieser
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 802/98 af 16. april 1998 om indledning
    af en fornyet undersøgelse i forbindelse med »nye eksportører« af Rådets
    forordning (EF) nr. 1950/97 om indførelse af en endelig antidumpingtold på importen
    af sække og poser af polyethylen eller polypropylen med oprindelse i bl.a. Indien,
    om ophævelse af tolden på importen fra fire eksportører i dette land og om
    at gøre den pågældende import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 802/98 της Επιτροπής
    της 16ης Απριλίου 1998 για να αρχίσει επανεξέταση
    όσον αφορά «νέο εξαγωγέα» στο πλαίσιο του κανονισμού
    (ΕΚ) αριθ. 1950/97 του Συμβουλίου περί επιβολής
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    σάκων και σακιδίων από πολυαιθυλένιο ή από
    πολυπροπυλένιο καταγωγής, μεταξύ άλλων, Ινδίας,
    για την κατάργηση του δασμού σχετικά με τις
    εισαγωγές τεσσάρων εξαγωγέων της χώρας αυτής
    και την καταγραφή των εν λόγω εισαγωγών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 802/98, annettu 16 päivänä huhtikuuta 1998,
    lopullisen polkumyyntitullin käyttöönotosta muun muassa Intiasta peräisin
    olevien polyeteenistä tai polypropeenista valmistettujen säkkien ja pussien
    tuonnissa annettuun neuvoston asetukseen (EY) N:o 1950/97 liittyvän "uutta viejää"
    koskevan tarkastelun vireillepanosta, neljän kyseisen maan viejän tuontiin sovellettavan
    tullin kumoamisesta ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 802/98 della Commissione del 16 aprile 1998 che avvia
    un riesame relativo ai «nuovi esportatori» del regolamento (CE) n. 1950/97 del
    Consiglio, che impone un dazio antidumping definitivo sulle importazioni di sacchi
    e sacchetti di polietilene o di polipropilene originari, fra l'altro, dell'India,
    che abroga il dazio in vigore nei confronti delle importazioni di quattro esportatori
    di tale paese e stabilisce che tali importazioni sono soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 802/98 van de Commissie van 16 april 1998 tot opening
    van een nieuw onderzoek voor "een nieuwe exporteur" van Verordening (EG) nr. 1950/97
    tot instelling van een definitief antidumpingrecht op de invoer van zakken van
    polyethyleen of van polypropyleen, van oorsprong uit onder andere India, en tot
    intrekking van het recht met betrekking tot de invoer van vier exporteurs uit
    dit land waarbij deze invoer geregistreerd moet worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 802/98 da Comissão de 16 de Abril de 1998 que inicia
    um reexame de «novo exportador» do Regulamento (CE) nº 1950/97 do Conselho
    que institui um direito anti-dumping definitivo sobre as importações de sacos
    de polietileno ou de polipropileno originários, nomeadamente, da Índia, revoga
    o direito aplicável às importações de quatro exportadores deste país e sujeita
    essas importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 802/98 de la Comisión de 16 de abril de 1998 por el
    que se inicia un procedimiento de reconsideración para «un nuevo exportador»
    del Reglamento (CE) nº 1950/97 del Consejo, por el que se establece un derecho
    antidumping definitivo sobre las importaciones de sacos y bolsas de polietileno
    o polipropileno originarias, inter alia, de la India, y por el que se deroga el
    derecho aplicable a las importaciones de cuatro exportadores de este país y se
    someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 802/98 av den 16 april 1998 om inledande
    av en översyn avseende nya exportörer av rådets förordning (EG) nr 1950/97
    beträffande införande av en slutgiltig antidumpningstull på import av säckar
    och påsar av polyeten eller polypropen med ursprung i bland annat Indien, om
    upphävande av tullen på import från fyra exportörer i det landet och om registrering
    av denna import
  type: main
