title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 408/2000 of 23 February 2000 determining
    the loss of income and the premiums applicable per ewe and per female goat in
    the Member States and the payment of the specific aid for sheep and goat farming
    in certain less-favoured areas of the Community for the 1999 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 408/2000 de la Commission, du 23 février 2000, déterminant,
    pour les États membres et pour la campagne 1999, la perte de revenu et le montant
    de la prime payable par brebis et par chèvre ainsi que le versement de l'aide
    spécifique à l'élevage ovin et caprin dans certaines zones défavorisées de
    la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 408/2000 der Kommission vom 23. Februar 2000 über
    den je Mitgliedstaat für das Wirtschaftsjahr 1999 zu bestimmenden Einkommensausfall,
    die je Mutterschaf und Ziege zu zahlende Prämie und die in benachteiligten Gebieten
    der Gemeinschaft für die Schaf- und Ziegenfleischerzeugung zu gewährende Sonderbeihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 408/2000 af 23. februar 2000 om fastsættelse
    for medlemsstaterne for produktionsåret 1999 af indtægtstabet og det præmiebeløb,
    der skal betales pr. moderfår og pr. ged, og af udbetalingen af den særlige
    støtte til fåre- og gedeopdræt i visse ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 408/2000 της Επιτροπής,
    της 23ης Φεβρουαρίου 2000, που καθορίζει για τα
    κράτη μέλη και για την περίοδο εμπορίας 1999
    την απώλεια εισοδήματος καθώς και το ποσό της
    πριμοδότησης που καταβάλλεται ανά προβατίνα
    και ανά αίγα και την πληρωμή της ειδικής ενίσχυσης
    στην εκτροφή προβάτων και αιγών σε ορισμένες
    μειονεκτικές ζώνες της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 408/2000, annettu 23 päivänä helmikuuta 2000,
    jäsenvaltioita ja markkinointivuotta 1999 koskevan tulonmenetyksen määrittämisestä
    ja uuhta ja naaraspuolista vuohta kohden maksettavan palkkion suuruudesta sekä
    lampaiden ja vuohien kasvatukselle tietyillä yhteisön epäsuotuisilla alueilla
    maksettavasta erityisestä tuesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 408/2000 della Commissione, del 23 febbraio 2000, che
    stabilisce, per gli Stati membri e per la campagna 1999, la perdita di reddito
    e il premio pagabile per pecora e per capra e il versamento dell'aiuto specifico
    a favore dell'allevamento ovino e caprino in talune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 408/2000 van de Commissie van 23 februari 2000 tot
    vaststelling, voor de lidstaten en voor het verkoopseizoen 1999 van het inkomensverlies,
    het premiebedrag per ooi en per geit en de betaling van de bijzondere steun voor
    de schapen- en geitenhouderij in bepaalde probleemgebieden in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 408/2000 da Comissão, de 23 de Fevereiro de 2000,
    que determina, para os Estados-Membros e em relação à campanha de 1999, a perda
    de rendimento, o montante do prémio pagável por ovelha e por cabra e o pagamento
    da ajuda específica à criação de ovinos e caprinos em determinadas regiões
    desfavorecidas da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 408/2000 de la Comisión, de 23 de febrero de 2000,
    por el que se determinan, para los Estados miembros, la pérdida de renta y los
    importes de la prima pagadera por oveja y por cabra durante la campaña de 1999
    y el pago de la ayuda específica para la cría de ovinos y caprinos en determinadas
    zonas desfavorecidas de la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 408/2000 av den 23 februari 2000 om fastställande
    för medlemsstaterna och för regleringsåret 1999 av inkomstbortfall och bidragsbelopp
    per tacka och honget och det särskilda stödet till får- och getuppfödningen
    i vissa mindre gynnande områden i gemenskapen
