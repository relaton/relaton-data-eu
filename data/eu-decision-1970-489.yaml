title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 octobre 1970, autorisant la République
    française à exclure du traitement communautaire la vaisselle et les articles
    de ménage ou de toilette en porcelaine et en matières céramiques, autres que
    la terre commune et le grès, des positions 69.11 et 69.12 C et D du Tarif douanier
    commun, originaires de la République populaire de Chine et mis en libre pratique
    dans les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '70/489/EWG: Entscheidung der Kommission vom 19. Oktober 1970 zur Ermächtigung
    der Französischen Republik, die aus der Volksrepublik China stammenden und in
    den Beneluxländern im freien Verkehr befindlichen Geschirr-, Haushalts- und Toilettengegenstände
    aus Porzellan und aus anderen keramischen Stoffen als gewöhnlichem Ton und Steinzeug
    der Tarifnummern 69.11 und 69.12 C und D des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/489/CEE: Decisione della Commissione, del 19 ottobre 1970, con cui
    si autorizza la Repubblica francese a escludere dal trattamento comunitario il
    vasellame e gli oggetti di uso domestico o da toletta, di porcellana e di materie
    ceramiche diverse dalla terracotta e dal grès delle voci 69.11 e 69.12 C e D
    della tariffa doganale comune, originari della Repubblica popolare cinese ed immessi
    in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/489/EEG: Beschikking van de Commissie van 19 oktober 1970 waarbij de
    Franse Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van porselein en van andere keramische stoffen dan gewoon aardewerk en gres van
    de posten 69.11 en 69.12 C en D van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de Benelux- landen in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
