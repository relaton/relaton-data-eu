  script: Latn
  content: Council Decision (EU) 2019/136 of 28 January 2019 on the position to be
    taken on behalf of the European Union within the Working Group on Wine established
    by the Agreement between the European Union and Japan for an Economic Partnership
    as regards the forms to be used for certificates for the import of wine products
    originating in Japan into the European Union and the modalities concerning self-certification
  type: main
- language: fr
  script: Latn
