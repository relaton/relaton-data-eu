title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2650/81 of 11 September 1981 re-establishing
    the levying of customs duties on umbrellas and sunshades, falling within heading
    No 66.01 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2650/81 de la Commission, du 11 septembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles de la position 66.01 du tarif douanier commun, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2650/81 der Kommission vom 11. September 1981 zur
    Wiedereinführung der Erhebung der Zölle für Regenschirme und Sonnenschirme,
    einschließlich Stockschirme, der Tarifnummer 66.01, mit Ursprung in Singapur,
    dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2650/81 af 11. september 1981 om genindførelse
    af opkrævning af told for paraplyer og parasoller, henhørende under pos. 66.01
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2650/81 τής Επιτροπής
    τής 11ης Σεπτεμβρίου 1981 περί αποκαταστάσεως
    τής εφαρμογής τών δασμών γιά αλεξιβρόχια, αλεξήλια,
    συμπεριλαμβανομένων καί τών υπό μορφήν ράβδων
    παρουσιαζομένων αλεξιβροχίων, τών μονίμων
    αλεξηλίων εξοχής καί τών παρομοίων τής κλάσεως
    66. 01 τού Κοινού Δασμολογίου καταγωγής Σιγκαπούρης,
    δικαιούχων τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3322/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2650/81 della Commissione, dell' 11 settembre 1981,
    che ripristina la riscossione dei dazi doganali applicabili agli ombrelli (da
    pioggia e da sole), della voce 66.01 della tariffa doganale comune, originari
    di Singapore beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2650/81 van de Commissie van 11 september 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op paraplu' s
    en parasols, alsmede wandelstokparaplu' s van tariefpost 66.01, van oorsprong
    uit Singapore waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad vermelde
    tariefpreferenties zijn verleend
