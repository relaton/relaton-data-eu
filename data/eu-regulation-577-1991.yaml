    microstructuren, zogenaamde EPROM's (Erasable Programmable Read Only Memories),
    van oorsprong uit Japan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 577/91 do Conselho, de 4 de Março de 1991, que institui
