title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 577/91 of 4 March 1991 imposing a definitive
    anti-dumping duty on imports of certain types of electronic microcircuits known
    as EPROMs (erasable programmable read only memories) originating in Japan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 577/91 du Conseil, du 4 mars 1991, instituant un droit
    antidumping définitif sur les importations de certains types de microcircuits
    électroniques dits «EPROMs» (mémoires fixes effaçables et reprogrammables)
    originaires du Japon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 577/91 des Rates vom 4. März 1991 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter elektronischer
    Mikroschaltungen, sogenannter EPROMs (löschbare, programmierbare Nur-Lese-Speicher),
    mit Ursprung in Japan
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 577/91 af 4. marts 1991 om indførelse af
    en endelig antidumpingtold på importen af visse typer elektroniske mikrokredsløb,
    såkaldte EPROMs (Erasable Programmable Read Only Memories) med oprindelse i Japan
  type: main
- language: el
  script: Grek
