  content: COMMISSION REGULATION (EEC) No 1786/93 of 30 June 1993 determining for
    the period 1 July 1993 to 28 February 1994 the quantities of raw sugar produced
    in the French overseas departments for which the refining aid specified in Council
    Regulation (EEC) No 2225/86 may be granted and amending Regulation (EEC) No 388/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1786/93 de la Commission du 30 juin 1993 déterminant,
