    greggio prodotti nei dipartimenti francesi d' oltremare che beneficiano dell'
    aiuto alla raffinazione di cui al regolamento (CEE) n. 2225/86 del Consiglio e
    che modifica il regolamento (CEE) n. 388/93
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1786/93 VAN DE COMMISSIE van 30 juni 1993 tot vaststelling,
