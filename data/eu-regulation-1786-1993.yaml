    gemäß der Verordnung (EWG) Nr. 2225/86 des Rates erzeugten Rohzuckermengen für
    die Zeit vom 1. Juli 1993 bis 28. Februar 1994 und zur Änderung der Verordnung
    (EWG) Nr. 388/93
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1786/93 af 30. juni 1993 om fastsættelse
