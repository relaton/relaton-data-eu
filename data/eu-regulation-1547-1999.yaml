title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1547/1999 of 12 July 1999 determining the
    control procedures under Council Regulation (EEC) No 259/93 to apply to shipments
    of certain types of waste to certain countries to which OECD Decision C(92)39
    final does not apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1547/1999 de la Commission du 12 juillet 1999 déterminant
    les procédures de contrôle à appliquer, conformément au règlement (CEE) n°
    259/93 du Conseil, aux transferts de certains types de déchets vers certains
    pays non soumis à la décision C(92)39 final de l'OCDE
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1547/1999 der Kommission vom 12. Juli 1999 zur Festlegung
    der bei der Verbringung bestimmter Arten von Abfällen in bestimmte Länder, für
    die der OECD-Beschluß C(92)39 endg. nicht gilt, anzuwendenden Kontrollverfahren
    gemäß der Verordnung (EWG) Nr. 259/93 des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1547/1999 на Комисията от 12
    юли 1999 година за определяне на процедури за
    контрол съгласно Регламент (ЕИО) № 259/93 на Съвета,
    които да се прилагат за превоза на определени
    видове отпадъци до определени страни, за които
    не се прилага Решение С(92)39 окончателен на ОИСР
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1547/1999 ze dne 12. července 1999, kterým
    se stanoví kontrolní postupy podle nařízení Rady (EHS) č. 259/93 pro přepravu
    některých druhů odpadů do některých zemí, na něž se nevztahuje rozhodnutí
    OECD C(92) 39 v konečném znění
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1547/1999 af 12. juli 1999 om fastlæggelse
    af de i Rådets forordning (EØF) nr. 259/93 omhandlede kontrolprocedurer for
    så vidt angår overførsel af visse typer affald til visse lande, for hvilke
    OECD-Rådets beslutning K(92) 39 endelig udg. ikke finder anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1547/1999 της Επιτροπής
    της 12ης Ιουλίου 1999 για τον καθορισμό των διαδικασιών
    ελέγχου στο πλαίσιο του κανονισμού (ΕΟΚ) αριθ.
    259/93 του Συμβουλίου που εφαρμόζονται στις αποστολές
    ορισμένων αποβλήτων προς ορισμένες χώρες για
    τις οποίες δεν ισχύει η απόφαση C(92)39 τελικό,
    του ΟΟΣΑ
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1547/1999, 12. juuli 1999, millega nähakse
    ette nõukogu määruse (EMÜ) nr 259/93 kohane kontrollimenetlus teatavat liiki
    jäätmesaadetiste puhul, mis on mõeldud saatmiseks nendesse riikidesse, mille
    suhtes ei kohaldata OECD otsuse C(92)39 lõppredaktsiooni
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1547/1999, annettu 12 päivänä heinäkuuta
    1999, neuvoston asetuksen (ETY) N:o 259/93 mukaisista tiettyihin OECD:n päätöksen
    C(92) 39 (lopullinen) soveltumisalaan kuulumattomiin maihin suuntautuvien tiettyjen
    jätelajien siirtojen valvontamenettelyistä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1547/1999/EK rendelete (1999. július 12.) egyes hulladékfajtáknak
    a C(92)39 végleges OECD-határozat hatálya alá nem tartozó meghatározott
    országokba történő szállítására alkalmazandó, a 259/93/EGK tanácsi rendelet
    szerinti ellenőrzési eljárások meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) N. 1547/1999 della Commissione del 12 luglio 1999 che
    stabilisce la procedura di controllo prevista dal regolamento (CEE) n. 259/93
    del Consiglio in relazione alle spedizioni di determinati tipi di rifiuti verso
    taluni paesi ai quali non si applica la decisione dell'OCSE n. C(92) 39/def.
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1547/1999 (1999. gada 12. jūlijs), ar kuru atbilstīgi
    Padomes Regulai (EEK) Nr. 259/93 nosaka kontroles procedūras, kas piemērojamas
    konkrētu atkritumu veidu sūtīšanai uz valstīm, uz kurām neattiecas ESAO
    Lēmums C(92)39 final
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 12 d. Komisijos reglamentas (EB) Nr. 1547/1999, pagal Tarybos
    reglamentą (EEB) Nr. 259/93 nustatantis kontrolės tvarką, reglamentuojančią
    tam tikrų rūšių atliekų vežimą į tam tikras šalis, kurioms netaikomas
    EBPO Sprendimas C(92) 39 (galutinis)
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1547/1999 tat-12 ta' Lulju 1999
    li jistabilixxi l-proċeduri ta' kontroll skond ir-Regolament tal-Kunsill (KEE)
    Nru 259/93 li għandhom japplikaw għat-trasport ta' ċertu tipi ta' skart lejn
    ċerti pajjiżi li għalihom ma tapplikax id-Deċiżjoni finali tal-OECD C(92)39
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1547/1999 van de Commissie van 12 juli 1999 tot vaststelling
    van de controleprocedures, overeenkomstig Verordening (EEG) nr. 259/93 van de
    Raad, die moeten worden toegepast voor de overbrenging van bepaalde soorten afvalstoffen
    naar bepaalde landen waarvoor besluit C(92)39 definitief van de OESO niet geldt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1547/1999 z dnia 12 lipca 1999 r. określające
    procedury kontrolne na mocy rozporządzenia Rady (EWG) nr 259/93, mające zastosowanie
    do wysyłek niektórych rodzajów odpadów do niektórych krajów, do których
    nie ma zastosowania decyzja OECD C(92)39 final
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1547/1999 da Comissão de 12 de Julho de 1999 que
    determina, em conformidade com o Regulamento (CEE) n° 259/93 do Conselho, os
    processos de controlo a aplicar às transferências de certos tipos de resíduos
    para certos países onde não é aplicável a Decisão C(92)39 final da OCDE
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1547/1999 al Comisiei din 12 iulie 1999 de stabilire
    a procedurilor de control care trebuie aplicate, în conformitate cu Regulamentul
    (CEE) nr. 259/93 al Consiliului, transporturilor de anumite tipuri de deșeuri
    către anumite țări care nu intră sub incidența Deciziei OCDE C(92) 39 final
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1547/1999 z 12. júla 1999 určujúce kontrolné
    postupy podľa nariadenia Rady (EHS) č. 259/93, ktoré sa majú uplatňovať
    pri zásielkach určitých druhov odpadov do určitých štátov, na ktoré sa
    nevzťahuje rozhodnutie OECD C(92)39 v konečnom znení
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1547/1999 z dne 12. julija 1999 o postopkih nadzora
    iz Uredbe Sveta (EGS) št. 259/93 za pošiljke nekaterih vrst odpadkov v nekatere
    države za katere se Sklep OECD C(92)39 final ne uporablja
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1547/1999 de la Comisión de 12 de julio de 1999 por
    el que se determinan, con arreglo al Reglamento (CEE) n° 259/93 del Consejo,
    los procedimientos de control que deberán aplicarse a los traslados de algunos
    residuos a determinados países a los que no es aplicable la Decisión C(92)39
    final de la OCDE
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1547/1999 av den 12 juli 1999 om kontrollförfaranden
    i enlighet med rådets förordning (EEG) nr 259/93 för transporter av vissa typer
    av avfall till vissa länder som inte omfattas av OECD-beslut C(92)39 slutlig
  type: main
