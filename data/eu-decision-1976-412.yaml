title:
- language: en
  script: Latn
  content: Commission Decision of 4 March 1976 authorizing the United Kingdom not
    to apply Community treatment to bananas, falling within subheading 08.01 B of
    the Common Customs Tariff, originating in the dollar zone, and in free circulation
    in the Netherlands and in Ireland
  type: main
- language: fr
  script: Latn
  content: '76/412/CEE: Décision de la Commission, du 4 mars 1976, autorisant le
    Royaume-Uni à exclure du traitement communautaire les bananes, de la position
    08.01 B du Tarif douanier commun, originaires de pays de la zone dollar et mises
    en libre pratique en Irlande et aux Pays-Bas'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. März 1976, mit der das Vereinigte Königreich
    ermächtigt wird, aus Ländern der ,,Dollar-Zone" (1) stammende und in Irland
    und den Niederlanden im freien Verkehr befindliche Bananen der Tarifstelle 08.01
    B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. marts 1976 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage bananer, som henhører under
    pos. 08.01 B i den fælles toldtarif har oprindelse i landene i dollarområdet,
    og frit kan omsættes i Irland og Nederlandene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 marzo 1976, che autorizza il Regno Unito
    ad escludere dal trattamento comunitario le banane della voce 08.01 B della tariffa
    doganale comune, originarie dei paesi della zona del dollaro ed immesse in libera
    pratica in Irlanda e nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 maart 1976 waarbij het Verenigd Koninkrijk
    wordt gemachtigd bananen van post 08.01 B van het gemeenschappelijk douanetarief,
    van oorsprong uit de landen van de dollarzone en in Ierland en Nederland in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
