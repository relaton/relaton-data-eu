    ta’ modems bla wajer ta’ netwerk ta’ żona wiesgħa (WWAN) li joriġinaw
    mir-Repubblika Popolari taċ-Ċina u li jtemm ir-reġistrazzjoni ta’ tali importazzjonijiet
    imposta mir-Regolamenti (UE) Nru 570/2010 u (UE) Nru 811/2010
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 209/2011 van de Commissie van 2 maart 2011 tot beëindiging
    van de antidumping- en antisubsidieprocedures betreffende de invoer van wireless
    wide area networking (WWAN)-modems van oorsprong uit de Volksrepubliek China en
    tot beëindiging van de bij de Verordeningen (EU) nr. 570/2010 en (EU) nr. 811/2010
    van de ingestelde registratie van deze invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 209/2011 z dnia 2 marca 2011 r. w sprawie
    zakończenia postępowania antydumpingowego i postępowania antysubsydyjnego dotyczących
    przywozu modemów bezprzewodowej rozległej sieci internetowej (WWAN) pochodzących
    z Chińskiej Republiki Ludowej oraz zakończenia rejestracji takiego przywozu
    wprowadzonej rozporządzeniami (UE) nr 570/2010 i (UE) nr 811/2010
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 209/2011 da Comissão, de 2 de Março de 2011 ,
    que encerra os processos anti-dumping e anti-subvenções relativos às importações
    de modems de rede de área alargada sem fios (WWAN — Wireless Wide Area Networking
    ) originários da República Popular da China e encerra o registo dessas importações
    tornado obrigatório pelos Regulamentos (UE) n. ° 570/2010 e (UE) n. ° 811/2010
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 209/2011 al Comisiei din 2 martie 2011 de încheiere
    a procedurilor antidumping și antisubvenție privind importurile de modemuri
    pentru rețele extinse fără fir (WWAN) originare din Republica Populară Chineză
    și de încheiere a înregistrării importurilor menționate instituite prin Regulamentele
    (UE) nr. 570/2010 și (UE) nr. 811/2010
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 209/2011 z 2. marca 2011 o ukončení antidumpingového
    a antisubvenčného konania týkajúceho sa dovozu modemov pre bezdrôtové rozsiahle
    siete (Wireless Wide Area Networking – WWAN) s pôvodom v Čínskej ľudovej
    republike a o ukončení registrácie tohto dovozu uloženej nariadeniami (EÚ)
    č. 570/2010 a (EÚ) č. 811/2010
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 209/2011 z dne 2. marca 2011 o zaključku protidampinškega
    in protisubvencijskega postopka glede uvoza modemov za brezžično prostrano omrežje
    (WWAN) s poreklom iz Ljudske republike Kitajske in o zaključku registracije takega
    uvoza, uvedene z uredbama (EU) št. 570/2010 in (EU) št. 811/2010
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 209/2011 de la Comisión, de 2 de marzo de 2011 ,
    por el que se dan por concluidos los procedimientos antidumping y antisubvenciones
    referentes a las importaciones de módems para redes inalámbricas de área extensa
    (wireless wide area networking — WWAN) originarios de la República Popular
    China y por el que se da por concluido el registro de esas importaciones impuesto
    por los Reglamentos (UE) n ° 570/2010 y (UE) n ° 811/2010
  type: main
- language: sv
  script: Latn
