    područja (WWAN) podrijetlom iz Narodne Republike Kine te o prekidu evidentiranja
    tog uvoza uvedenog uredbama (EU) br. 570/2010 i (EU) br. 811/2010
  type: main
- language: hu
  script: Latn
  content: A Bizottság 209/2011/EU rendelete ( 2011. március 2. ) a Kínai Népköztársaságból
    származó vezeték nélküli nagy kiterjedésű hálózati (WWAN) modemek behozatalára
    vonatkozó dömpingellenes és szubvencióellenes eljárás megszüntetéséről
    és az 570/2010/EU és a 811/2010/EU rendeletek által az említett behozatalra
    előírt nyilvántartásbavételi kötelezettség megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 209/2011 della Commissione, del 2 marzo 2011 , che
    chiude i procedimenti antidumping e antisovvenzioni relativi alle importazioni
    di modem per rete geografica senza fili (WWAN) originari della Repubblica popolare
    cinese e dispone la cessazione della registrazione di tali importazioni imposta
    dai regolamenti (UE) n. 570/2010 e (UE) n. 811/2010
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 209/2011 ( 2011. gada 2. marts ), ar ko izbeidz
    antidempinga un antisubsidēšanas procedūras attiecībā uz Ķīnas Tautas Republikas
    izcelsmes bezvadu teritoriālā tīkla ( WWAN ) modemu importu un izbeidz šā
    importa reģistrāciju, kas bija noteikta ar Regulu (ES) Nr. 570/2010 un (ES)
    Nr. 811/2010
  type: main
- language: lt
  script: Latn
  content: 2011 m. kovo 2 d. Komisijos reglamentas (ES) Nr. 209/2011, kuriuo nutraukiami
    antidempingo ir antisubsidijų tyrimai dėl importuojamų Kinijos Liaudies Respublikos
    kilmės belaidžio plačiojo tinklo (WWAN) modemų ir tokio importo registracija,
    nustatyta Reglamentais (ES) Nr. 570/2010 ir (ES) Nr. 811/2010
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 209/2011 tat- 2 ta’ Marzu 2011 li
