title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 209/2011 of 2 March 2011 terminating the
    anti-dumping and anti-subsidy proceedings concerning imports of wireless wide
    area networking (WWAN) modems originating in the People’s Republic of China
    and terminating the registration of such imports imposed by Regulations (EU) No
    570/2010 and (EU) No 811/2010
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 209/2011 de la Commission du 2 mars 2011 clôturant
    les procédures antidumping et antisubventions concernant les importations de
    modems pour réseau étendu sans fil (WWAN) originaires de la République populaire
    de Chine et mettant fin à l’enregistrement de ces importations imposé par
    les règlements (UE) n ° 570/2010 et (UE) n ° 811/2010
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 209/2011 der Kommission vom 2. März 2011 zur Einstellung
    des Antidumping- und des Antisubventionsverfahrens betreffend die Einfuhren von
    Weitverkehrsnetz-Funkmodems (WWAN-Modems) mit Ursprung in der Volksrepublik China
    und zur Einstellung der mit den Verordnungen (EU) Nr. 570/2010 und (EU) Nr. 811/2010
    eingeführten zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
