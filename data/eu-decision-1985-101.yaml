title:
- language: en
  script: Latn
  content: '85/101/EEC: Commission Decision of 21 December 1984 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain textile products
    originating in third countries which have been put into free circulation in the
    Community (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/101/CEE: Décision de la Commission du 21 décembre 1984 autorisant
    la République française à procéder à une surveillance intracommunautaire
    des importations de certains produits textiles originaires de pays tiers et mis
    en libre pratique dans la Communauté (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/101/EWG: Entscheidung der Kommission vom 21. Dezember 1984 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Drittländern stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Textilwaren (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/101/EØF: Kommissionens beslutning af 21. december 1984 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse produkter med oprindelse i tredjelande til fri omsætning i Fællesskabet
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/101/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Δεκεμβρίου 1984 περί χορηγήσεως αδείας στη Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής τρίτων χωρών, τα οποία
    τίθενται σε ελεύθερη κυκλοφορία στην Κοινότητα
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/101/CEE: Decisione della Commissione del 21 dicembre 1984 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti tessili originari di paesi terzi e messi in libera pratica
    nella Comunità (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/101/EEG: Beschikking van de Commissie van 21 december 1984 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van bepaalde textielprodukten van oorsprong uit derde
    landen, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst
    in de Franse taal is authentiek)'
  type: main
