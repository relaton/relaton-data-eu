type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 July 1978 authorizing Ireland not to apply Community
    treatment to shirts, T-shirts, lightweight fine knit roll, polo or turtle necked
    jumpers and pullovers, undervests and the like, knitted or crocheted, not elastic
    or rubberized, other than babies' garments, of cotton or synthetic textile fibres;
    T-shirts and lightweight fine knit roll, polo or turtle necked jumpers and pullovers
    of regenerated textile fibres, falling within heading No ex 60.04 (NIMEXE code
    60.04-01, 05, 13, 18, 28, 29, 30, 41, 50, 58) of the Common Customs Tariff, originating
    in Thailand and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/580/CEE: Décision de la Commission, du 3 juillet 1978, autorisant
    l''Irlande à exclure du traitement communautaire les chemises, chemisettes, T-shirts,
    sous- pulls, maillots de corps et articles similaires de bonneterie non élastique
    ni caoutchoutée, autres que vêtements pour bébés, de coton ou de fibres textiles
    synthétiques ; T-shirts et sous-pulls de fibres artificielles, de la position
    Ex 60.04 du Tarif douanier commun (codes Nimexe : 60.04-01, 05, 13, 18, 28, 29,
    30, 41, 50, 58), originaires de Thaïlande et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. Juli 1978, mit der Irland ermächtigt
    wird, aus Thailand stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Oberhemden, T-Shirts, Unterziehpullis, Unterhemden und dergleichen
    aus Gewirken, weder gummielastisch noch kautschutiert, andere als Säuglingskleidung
    aus Baumwolle oder synthetischen Spinnstoffen; T-Shirts und Unterziehpullis aus
    künstlichen Spinnstoffen der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 60.04-01; 05; 13; 18; 28; 29; 30; 41; 50; 58) von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 3. juli 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage skjorter, herunder sports- og arbejdsskjorter,
    T-shirts, T-shirts med rullekrave, undertrøjer og lign., af trikotage, ikke elastisk
    eller gummeret, bortset fra beklædningsgenstande til spædbørn, af bomuld eller
    syntetiske fibre, T-shirts og T-shirts med rullekrave, af regenererede fibre,
    som henhører under pos. ex 60.04 (NIMEXE-kode 60.04-01, 05, 13, 18, 28, 29, 30,
    41, 50, 58) i den fælles toldtarif, har oprindelse i Thailand og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 3 luglio 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario camicie, camicette, T-shirts, magliette
    a collo alto, camiciole e articoli affini a maglia non elastica né gommata, diversi
    dagli indumenti per bambini piccoli (bébés), di cotone o di fibre tessili sintetiche,
    T-shirts e magliette a collo alto di fibre artificiali, della voce ex 60.04 della
    tariffa doganale comune (codice Nimexe: 60.04-01; 05; 13; 18; 28; 29; 30; 41;
    50; 58), originari della Tailandia e messi in libera pratica negli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 juli 1978 waarbij Ierland wordt gemachtigd
    overhemden en sporthemden, T-shirts, onderjumpers, hemdtruien, sous-pulls, tricotpakken,
    maillots de corps en dergelijke artikelen van niet-elastisch of van niet-gegummeerd
    brei- of haakwerk, andere dan kledingstukken voor baby's van katoen of van synthetische
    textielvezels, T-shirts en sous-pulls van kunstmatige vezels, van post ex 60.04
    van het gemeenschappelijk douanetarief (NIMEXE-code 60.04-01, 05, 13, 18, 28,
    29, 30, 41, 50, 58), van oorsprong uit Thailand en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
