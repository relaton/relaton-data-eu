  content: Commission Regulation (EEC) No 2126/83 of 28 July 1983 amending Regulations
    (EEC) No 2226/78 and (EEC) No 1765/83 as regards the beef products which may be
    taken into intervention in certain Member States, and their coefficients
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2126/83 de la Commission du 28 juillet 1983 modifiant
    les règlements (CEE) no 2226/78 et (CEE) no 1765/83 en ce qui concerne les produits
    du secteur de la viande bovine pouvant faire l' objet d' achats à l' intervention
    dans certains États membres ainsi que leurs coefficients
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2126/83 der Kommission vom 28. Juli 1983 zur Änderung
    der Verordnungen (EWG) Nr. 2226/78 und (EWG) Nr. 1765/83 hinsichtlich der Erzeugnisse
    des Rindfleischsektors, die Gegenstand von Interventionskäufen in einigen Mitgliedstaaten
    sein können, sowie ihrer Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2126/83 af 28. juli 1983 om ændring
    af forordning (EØF) nr. 2226/78 og (EØF) nr. 1765/83 for så vidt angår oksekødprodukter,
    der kan opkøbes ved intervention i visse medlemsstater samt koefficienterne for
    disse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2126/83 της Επιτροπής
