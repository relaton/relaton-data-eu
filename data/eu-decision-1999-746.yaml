  content: '1999/746/EC: Commission Decision of 8 November 1999 amending for the third
    time Decision 1999/293/EC concerning certain protective measures against bluetongue
    in parts of Greece (notified under document number C(1999) 3604) (Text with EEA
    relevance) (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/746/CE: Décision de la Commission, du 8 novembre 1999, modifiant
