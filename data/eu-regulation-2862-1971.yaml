    Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern gewährten
    Zollpräferenzen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n.2862/71 della Commissione, del 22 dicembre 1971, relativo
