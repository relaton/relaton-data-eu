  content: '90/480/EEC: Commission Decision of 24 September 1990 accepting undertakings
    given by certain exporters in connection with the anti-dumping proceeding concerning
    imports of tungsten carbide and fused tungsten carbide originating in the People''s
    Republic of China and terminating the investigation with regard to the exporters
    in question'
  type: main
- language: fr
  script: Latn
  content: '90/480/CEE: Décision de la Commission, du 24 septembre 1990, portant
    acceptation d''engagements offerts par certains exportateurs dans le cadre de
    la procédure antidumping concernant les importations de carbure de tungstène
    et de carbure de tungstène fondu originaires de la République populaire de Chine
    et portant clôture de l''enquête en ce qui concerne les exportateurs en cause'
  type: main
- language: de
