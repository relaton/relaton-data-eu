  content: Commission Regulation (EEC) No 62/80 of 14 January 1980 fixing the rates
    of the refunds applicable from 15 January 1980 to eggs and egg yolks exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 62/80 de la Commission, du 14 janvier 1980, fixant les
