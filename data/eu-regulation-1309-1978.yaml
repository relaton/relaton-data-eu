title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1309/78 of 15 June 1978 re-establishing
    the levying of the customs duties on heavy petroleum oils falling within subheadings
    27.10 C I c), II c), III c) and d), originating in Kuwait to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1309/78 de la Commission, du 15 juin 1978, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole lourdes, des sous-positions tarifaires 27.10 C I c), II c), III c) et
    d), originaires du Koweït, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1309/78 der Kommission vom 15. Juni 1978 zur Wiedereinführung
    des Zollsatzes für Schweröle der Tarifstellen 27.10 C I c), II c), III c) und
    d), mit Ursprung in Kuweit, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1309/78 af 15. juni 1978 om genindførelse
    af opkrævning af toldafgifter for tunge olier, under pos. 27.10 C I c), II c),
    III c) og d), som har oprindelse i Kuwait og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1309/78 della Commissione, del 15 giugno 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio pesanti,
    delle sottovoci doganali 27.10 C I c), II c), III c) e d), originari del Kuweit
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1309/78 van de Commissie van 15 juni 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zware oliën,
    van post 27.10 C I c), II c), III c) en d), van oorsprong uit Koeweit ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
