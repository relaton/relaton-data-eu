title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1277/2003 of 17 July 2003 laying down to
    what extent applications for issue of export licences submitted during July 2003
    for beef products which may benefit from special import treatment in a third country
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1277/2003 de la Commission du 17 juillet 2003 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de juillet 2003 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1277/2003 der Kommission vom 17. Juli 2003 über das
    Ausmaß, in dem den im Juli 2003 eingereichten Anträgen auf Ausfuhrlizenzen für
    Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1277/2003 af 17. juli 2003 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    juli 2003 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1277/2003 της Επιτροπής,
    της 17ης Ιουλίου 2003, που καθορίζει σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Ιούλιο 2003 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1277/2003, annettu 17 päivänä heinäkuuta
    2003, kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden
    heinäkuussa 2003 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1277/2003 della Commissione, del 17 luglio 2003, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di luglio 2003 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1277/2003 van de Commissie van 17 juli 2003 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 2003 ingediende aanvragen
    om uitvoercertificaten voor producten van de sector rundvlees waarvoor een bĳzondere
    behandeling geldt bĳ invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1277/2003 da Comissão, de 17 de Julho de 2003, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Julho de 2003 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1277/2003 de la Comisión, de 17 de julio de 2003,
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    certificados de exportación, presentadas en el mes de julio de 2003, para los
    productos del sector de la carne de bovino que se beneficien de un trato especial
    para su importación en un tercer país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1277/2003 av den 17 juli 2003 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under juli månad 2003
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till tredje land får godkännas
  type: main
