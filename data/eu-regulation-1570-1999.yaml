  content: Council Regulation (EC) No 1570/1999 of 12 July 1999 on the allocation
    of fishing possibilities for certain fish stocks and amending Regulation (EC)
    No 48/1999 fixing, for certain fish stocks and groups of fish stocks, the total
    allowable catches for 1999 and certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1570/1999 du Conseil, du 12 juillet 1999, concernant
