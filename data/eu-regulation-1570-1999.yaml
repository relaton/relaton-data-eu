    modifiant le règlement (CE) n° 48/1999 fixant, pour certains stocks et groupes
    de stocks de poissons, les totaux admissibles des captures pour 1999 et certaines
    conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
