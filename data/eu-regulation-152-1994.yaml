  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 152/94 della Commissione, del 27 gennaio 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 1994 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi intermedi conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca e la
    Repubblica slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 152/94 van de Commissie van 27 januari 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die in januari 1994 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Interimovereenkomsten met de Republiek Polen, de Republiek Hongarije,
    de Tsjechische Republiek en de Slowaakse Republiek
  type: main
