    της 27ης Ιανουαρίου 1994 περί καθορισμού ορίων
    εντός των οποίων δύναται να γίνει αποδεκτή
    η αίτηση που υποβλήθηκε τον Ιανουάριο του 1994
    για άδειες εισαγωγής χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τις ενδιάμεσες
