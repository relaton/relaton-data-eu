title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 152/94 of 27 January 1994 determining the
    extent to which application lodged in January 1994 for import licences for certain
    pigmeat products under the regime provided for by the Intermediate Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 152/94 de la Commission, du 27 janvier 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1994 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords intérimaires conclus par la Communauté avec la
    république de Pologne, la république de Hongrie, la République tchèque et
    la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 152/94 der Kommission vom 27. Januar 1994 über die
    Festsetzung des Umfangs, in dem die im Januar 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Interimsabkommen
    zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen Republik und der
    Slowakischen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 152/94 af 27. januar 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    1994 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de interimsaftaler, som Fællesskabet har indgået med Republikken
    Polen, Republikken Ungarn, Den Tjekkiske Republik og Slovakiske Republik
  type: main
- language: el
  script: Grek
