id: EURegulation17441975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1744/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on handkerchiefs, of fabrics other than cotton,
    falling within heading No ex 61.05, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3046/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1744/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes en tissus autres que de coton, de la position tarifaire EX 61.05,
    originaires de l'Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1744/75 der Kommission vom 7. Juli 1975 über die
    Wiedereinführung des Zollsatzes für Taschentücher und Ziertaschentücher, aus
    anderen Geweben als Baumwolle, der Tarifstelle ex 61.05, mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1744/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, andre varer end bomuldsvarer,
    under position ex 61.05, som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1744/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino, in tessuti non di cotone, della voce doganale ex 61.05, originari
    dell'India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1744/75 van de Commissie van 7 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zakdoeken,
    van andere weefsels dan van katoen, van post ex 61.05, van oorsprong uit India,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3046/74 van de Raad van 2 december 1974
  type: main
