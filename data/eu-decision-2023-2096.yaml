  content: Decisión (UE) 2023/2096 del Consejo de 28 de septiembre de 2023 relativa
    a la posición que debe adoptarse en nombre de la Unión Europea en el Comité
    de Asociación, en su configuración de comercio, establecido por el Acuerdo de
    Asociación entre la Unión Europea y la Comunidad Europea de la Energía Atómica
    y sus Estados miembros, por una parte, y la República de Moldavia, por otra,
    en lo que respecta a la modificación del anexo XXVIII-B (Normas aplicables a
    los servicios de telecomunicaciones) y del anexo XXVIII-C (Normas aplicables a
    los servicios postales y de correos) de dicho Acuerdo
  type: main
