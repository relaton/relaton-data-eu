  script: Latn
  content: Rådets beslut (EU) 2023/2096 av den 28 september 2023 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i associeringskommittén i dess
    konstellation för handelsfrågor, vilken inrättades genom associeringsavtalet
    mellan Europeiska unionen och Europeiska atomenergigemenskapen och deras medlemsstater,
    å ena sidan, och Republiken Moldavien, å andra sidan, vad gäller ändring av
    bilaga XXVIII-B (Tillämpliga regler för teletjänster) och av bilaga XXVIII-C
    (Tillämpliga regler för post- och budtjänster) till det avtalet
