id: EUDecision20232096
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/2096 of 28 September 2023 on the position to
    be taken on behalf of the European Union within the Association Committee in Trade
    configuration established by the Association Agreement between the European Union
    and the European Atomic Energy Community and their Member States, of the one part,
    and the Republic of Moldova, of the other part as regards the modification of
    Annex XXVIII-B (Rules applicable to telecommunication services) and Annex XXVIII-C
    (Rules applicable to postal and courier services) to that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2096 du Conseil du 28 septembre 2023 relative à la
    position à prendre, au nom de l’Union européenne, au sein du comité d’association
    dans sa configuration «Commerce» institué par l’accord d’association entre
    l’Union européenne et la Communauté européenne de l’énergie atomique et
    leurs États membres, d’une part, et la République de Moldavie, d’autre part,
    en ce qui concerne la modification de l’annexe XXVIII-B (Règles applicables
    aux services de télécommunication) et de l’annexe XXVIII-C (Règles applicables
    aux services postaux et de courrier) dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/2096 des Rates vom 28. September 2023 über den im
    Namen der Europäischen Union in dem durch das Assoziierungsabkommen zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und der Republik Moldau andererseits eingesetzten Assoziationsausschuss
    in der Zusammensetzung „Handel“ in Bezug auf die Änderung von Anhang XXVIII-B
    (Regelungen für Telekommunikationsdienstleistungen) und Anhang XXVIII-C (Regelungen
    für Post- und Kurierdienste) dieses Abkommens zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/2096 на Съвета от 28 септември
    2023 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Комитета за асоцииране в състав „Търговия“,
    създаден със Споразумението за асоцииране
    между Европейския съюз и Европейската общност
    за атомна енергия и техните държави членки,
    от една страна, и Република Молдова, от друга
    страна, във връзка с изменението на приложение
    XXVIII-Б (Приложими правила по отношение на телекомуникационните
    услуги) и приложение XXVIII-В (Приложими правила
    по отношение на пощенските и куриерските услуги)
    към посоченото споразумение
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/2096 ze dne 28. září 2023 o postoji, který
    má být zaujat jménem Evropské unie ve Výboru pro přidružení ve složení
    pro obchod zřízeném Dohodou o přidružení mezi Evropskou unií a Evropským
    společenstvím pro atomovou energii a jejich členskými státy na jedné straně
    a Moldavskou republikou na straně druhé, pokud jde o změnu přílohy XXVIII-B
    (Pravidla vztahující se na telekomunikační služby) a přílohy XXVIII-C (Pravidla
    vztahující se na poštovní a kurýrní služby) uvedené dohody
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2023/2096 af 28. september 2023 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i Associeringsudvalget i dettes
    handelssammensætning, som er nedsat ved associeringsaftalen mellem Den Europæiske
    Union og Det Europæiske Atomenergifællesskab og deres medlemsstater på den
    ene side og Republikken Moldova på den anden side, til ændring af bilag XXVIII-B
    (Regler for telekommunikationstjenester) og bilag XXVIII-C (Regler for post- og
    kurertjenester) til nævnte aftale
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2023/2096 του Συμβουλίου της 28ης
    Σεπτεμβρίου 2023 σχετικά με τη θέση που πρέπει
    να ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης
    στο πλαίσιο της Επιτροπής Σύνδεσης στη σύνθεσή
    της για τα εμπορικά θέματα, η οποία συγκροτήθηκε
    με τη συμφωνία σύνδεσης μεταξύ της Ευρωπαϊκής
    Ένωσης και της Ευρωπαϊκής Κοινότητας Ατομικής
    Ενέργειας και των κρατών μελών τους, αφενός,
    και της Δημοκρατίας της Μολδαβίας, αφετέρου,
    όσον αφορά την τροποποίηση του παραρτήματος
    XXVIII-B (Κανόνες που εφαρμόζονται στις τηλεπικοινωνιακές
    υπηρεσίες) και του παραρτήματος XXVIII-Γ (Κανόνες
    που εφαρμόζονται στις ταχυδρομικές υπηρεσίες
    και στις υπηρεσίες ταχυμεταφοράς) της εν λόγω
    συμφωνίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2023/2096, 28. september 2023, millega määratakse
    kindlaks Euroopa Liidu nimel ühelt poolt Euroopa Liidu, Euroopa Aatomienergiaühenduse
    ja nende liikmesriikide ning teiselt poolt Moldova Vabariigi vahelise assotsieerimislepinguga
    moodustatud, kaubanduskoosseisus kokkutulnud assotsieerimiskomitees võetav seisukoht
    seoses nimetatud lepingu XXVIII-B lisa „Telekommunikatsiooniteenuste suhtes
    kehtivad eeskirjad“ ja XXVIII-C lisa „Posti- ja kulleriteenuste suhtes kehtivad
    eeskirjad“ muutmisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2023/2096, annettu 28 päivänä syyskuuta 2023,
    Euroopan unionin, Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden sekä
    Moldovan tasavallan välisellä assosiaatiosopimuksella perustetussa kauppaan
    liittyviä kysymyksiä käsittelevässä assosiaatiokomiteassa Euroopan unionin
    puolesta otettavasta kannasta kyseisen sopimuksen liitteen XXVIII-B (Televiestintäpalveluihin
    sovellettavat säännöt) ja liitteen XXVIII-C (Posti- ja kuriiripalveluihin sovellettavat
    säännöt) muuttamiseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2023/2096 ón gComhairle an 28 Meán Fómhair 2023 maidir
    leis an seasamh atá le glacadh thar ceann an Aontais Eorpaigh sa Choiste Comhlachais
    i gcumraíocht Trádála arna bhunú leis an gComhaontú Comhlachais idir an tAontas
    Eorpach agus an Comhphobal Eorpach do Fhuinneamh Adamhach agus a mBallstáit,
    de pháirt, agus Poblacht na Moldóive, den pháirt eile, a mhéid a bhaineann
    le hIarscríbhinn XXVIII-B (Rialacha is infheidhme maidir le seirbhísí teileachumarsáide)
    agus le hIarscríbhinn XXVIII-C (Rialacha is infheidhme maidir le seirbhísí
    poist agus cúiréireachta) a ghabhann leis an gComhaontú sin a mhodhnú
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2023/2096 od 28. rujna 2023. o stajalištu koje treba
    zauzeti u ime Europske unije u okviru Odbora za pridruživanje u sastavu zaduženom
    za trgovinu, koji je osnovan Sporazumom o pridruživanju između Europske unije
    i Europske zajednice za atomsku energiju i njihovih država članica, s jedne
    strane, i Republike Moldove, s druge strane, u pogledu izmjene Priloga XXVIII.B
    (Pravila koja se primjenjuju na telekomunikacijske usluge) i Priloga XXVIII.C
    (Pravila koja se primjenjuju na poštanske i kurirske usluge) tom sporazumu
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2023/2096 határozata (2023. szeptember 28.) az egyrészről
    az Európai Unió, az Európai Atomenergia-közösség és tagállamaik, másrészről
    a Moldovai Köztársaság közötti társulási megállapodás által létrehozott,
    kereskedelmi formációban ülésező Társulási Bizottságban az említett megállapodás
    XXVIII-B. mellékletének (A távközlési szolgáltatásokra alkalmazandó szabályok)
    és XXVIII-C. mellékletének (A postai és futárpostai szolgáltatásokra alkalmazandó
    szabályok) módosítása tekintetében az Európai Unió által képviselendő
    álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/2096 del Consiglio del 28 settembre 2023 relativa alla
    posizione da adottare a nome dell’Unione europea in sede di Comitato di associazione
    riunito nella formazione «Commercio» istituito dall’accordo di associazione
    tra l’Unione europea e la Comunità europea dell’energia atomica e i loro
    Stati membri, da una parte, e la Repubblica di Moldova, dall’altra, per quanto
    riguarda la modifica dell’allegato XXVIII-B (Norme applicabili ai servizi di
    telecomunicazione) e dell’allegato XXVIII-C (Norme applicabili ai servizi postali
    e di corriere) di tale accordo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2023/2096 (2023. gada 28. septembris) par nostāju,
    kas Eiropas Savienības vārdā jāieņem Asociācijas komitejā īpašā sastāvā
    tirdzniecības jautājumu risināšanai, kura izveidota ar Asociācijas nolīgumu
    starp Eiropas Savienību un Eiropas Atomenerģijas kopienu un to dalībvalstīm,
    no vienas puses, un Moldovas Republiku, no otras puses, attiecībā uz izmaiņām
    minētā nolīguma XXVIII-B pielikumā (Telesakaru pakalpojumiem piemērojamie
    noteikumi) un XXVIII-C pielikumā (Pasta un kurjera pakalpojumiem piemērojamie
    noteikumi)
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2023/2096 2023 m. rugsėjo 28 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi Europos Sąjungos, Europos
    atominės energijos bendrijos bei jų valstybių narių ir Moldovos Respublikos
    asociacijos susitarimu įsteigtame Asociacijos komitete prekybos klausimais, dėl
    to susitarimo XXVIII-B priedo (Telekomunikacijų paslaugoms taikytinos taisyklės)
    ir XXVIII-C priedo (Pašto ir pasiuntinių paslaugoms taikytinos taisyklės) pakeitimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2023/2096 tat-28 ta’ Settembru 2023 dwar
    il-pożizzjoni li għandha tittieħed f’isem l-Unjoni Ewropea fi ħdan il-Kumitat
    ta’ Assoċjazzjoni fil-konfigurazzjoni tal-Kummerċ stabbilit mill-Ftehim ta’
    Assoċjazzjoni bejn l-Unjoni Ewropea u l-Komunità Ewropea tal-Enerġija Atomika
    u l-Istati Membri tagħhom, minn naħa waħda, u r-Repubblika tal-Moldova, min-naħa
    l-oħra fir-rigward tal-modifika tal-Anness XXVIII-B (Regoli applikabbli għas-servizzi
    tat-telekomunikazzjoni) u tal-Anness XXVIII-C (Regoli applikabbli għas-servizzi
    postali u tal-kurrier) għal dan il-Ftehim
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/2096 van de Raad van 28 september 2023 betreffende het
    standpunt dat namens de Europese Unie moet worden ingenomen in het Associatiecomité
    in zijn samenstelling voor handelsvraagstukken, opgericht bij de Associatieovereenkomst
    tussen de Europese Unie en de Europese Gemeenschap voor Atoomenergie en hun lidstaten,
    enerzijds, en de Republiek Moldavië, anderzijds, met betrekking tot de wijziging
    van bijlage XXVIII-B (Regels ten aanzien van telecommunicatiediensten) en bijlage
    XXVIII-C (Regels ten aanzien van post- en koeriersdiensten) bij die overeenkomst
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/2096 z dnia 28 września 2023 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Komitetu Stowarzyszenia
    w składzie rozstrzygającym kwestie dotyczące handlu ustanowionego na mocy Układu
    o stowarzyszeniu między Unią Europejską i Europejską Wspólnotą Energii Atomowej
    oraz ich państwami członkowskimi, z jednej strony, a Republiką Mołdawii, z
    drugiej strony, w odniesieniu do zmiany załącznika XXVIII-B (Zasady mające
    zastosowanie do usług telekomunikacyjnych) i załącznika XXVIII-C (Zasady mające
    zastosowanie do usług pocztowych i kurierskich) do tego Układu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2023/2096 do Conselho de 28 de setembro de 2023 relativa
    à posição a tomar em nome da União Europeia no âmbito do Comité de Associação
    na sua configuração Comércio instituído pelo Acordo de Associação entre
    a União Europeia e a Comunidade Europeia da Energia Atómica e os seus Estados-Membros,
    por um lado, e a República da Moldávia, por outro, no que diz respeito à alteração
    do anexo XXVIII-B (Regras aplicáveis aos serviços de telecomunicações) e do
    anexo XXVIII-C (Regras aplicáveis aos serviços postais e de correio rápido)
    do Acordo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/2096 a Consiliului din 28 septembrie 2023 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Comitetului
    de asociere reunit în configurația comerț instituit prin Acordul de asociere
    dintre Uniunea Europeană și Comunitatea Europeană a Energiei Atomice și statele
    membre ale acestora, pe de o parte, și Republica Moldova, pe de altă parte,
    în ceea ce privește modificarea anexei XXVIII-B (Norme aplicabile serviciilor
    de telecomunicații) și a anexei XXVIII-C (Norme aplicabile serviciilor poștale
    și de curierat) la acordul respectiv
  type: main
