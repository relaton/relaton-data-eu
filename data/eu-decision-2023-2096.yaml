  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/2096 z 28. septembra 2023 o pozícii, ktorá
    sa má v mene Európskej únie zaujať vo Výbore pre pridruženie v zložení
    pre otázky obchodu zriadenom Dohodou o pridružení medzi Európskou úniou a
    Európskym spoločenstvom pre atómovú energiu a ich členskými štátmi na
    jednej strane a Moldavskou republikou na strane druhej, pokiaľ ide o zmenu prílohy
    XXVIII-B (Pravidlá uplatniteľné na telekomunikačné služby) a prílohy XXVIII-C
    (Pravidlá uplatniteľné na poštové a doručovateľské služby) k uvedenej
    dohode
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/2096 z dne 28. septembra 2023 o stališču, ki se
    v imenu Evropske unije zastopa v Pridružitvenem odboru v trgovinski sestavi,
    ustanovljenem s Pridružitvenim sporazumom med Evropsko unijo in Evropsko skupnostjo
    za atomsko energijo in njunimi državami članicami na eni strani ter Republiko
    Moldavijo na drugi strani, glede spremembe Priloge XXVIII-B (Pravila za telekomunikacijske
    storitve) in Priloge XXVIII-C (Pravila za poštne in kurirske storitve) k navedenemu
    sporazumu
  type: main
- language: es
