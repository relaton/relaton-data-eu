  content: Council Regulation (EC) No 1931/97 of 22 September 1997 imposing a definitive
    anti-dumping duty on imports of unwrought, unalloyed zinc originating in Poland
    and Russia and definitively collecting the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1931/97 du Conseil du 22 septembre 1997 instituant
