    bei der Ausfuhr bestimmter Getreide- und Reiseerzeugnisse in Form von nicht unter
    Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2423/89 af 4. august 1989 om berigtigelse
