title:
- language: en
  script: Latn
  content: Council Implementing Decision of 7 December 2009 authorising the Kingdom
    of Sweden and the United Kingdom of Great Britain and Northern Ireland to apply
    a measure derogating from Article 167 of Directive 2006/112/EC on the common system
    of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution du Conseil du 7 décembre 2009 autorisant le Royaume
    de Suède et le Royaume-Uni de Grande-Bretagne et d'Irlande du Nord à appliquer
    une mesure dérogatoire à l'article 167 de la directive 2006/112/CE relative
    au système commun de taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss des Rates vom 7. Dezember 2009 zur Ermächtigung
    des Königreichs Schweden und des Vereinigten Königreichs von Großbritannien
    und Nordirland, eine von Artikel 167 der Richtlinie 2006/112/EG über das gemeinsame
    Mehrwertsteuersystem abweichende Regelung anzuwenden
  type: main
- language: bg
  script: Cyrl
  content: '2009/938/ЕС: Решение за изпълнение на Съвета
    от 7 декември 2009 година за даване на разрешение
    на Кралство Швеция и на Обединеното кралство
    Великобритания и Северна Ирландия да прилагат
    мярка за дерогация от член 167 от Директива 2006/112/ЕО
    относно общата система на данъка върху добавената
    стойност'
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady ze dne 7. prosince 2009 , kterým se Švédskému
    království a Spojenému království Velké Británie a Severního Irska povoluje
    použít opatření odchylující se od článku 167 směrnice 2006/112/ES o společném
    systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse af 7. december 2009 om bemyndigelse af
    Kongeriget Sverige og Det Forenede Kongerige Storbritannien og Nordirland til
    at anvende en foranstaltning, der fraviger artikel 167 i direktiv 2006/112/EF
    om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση του Συμβουλίου, της
    7ης Δεκεμβρίου 2009 , που επιτρέπει στο Βασίλειο
    της Σουηδίας και στο Ηνωμένο Βασίλειο της Μεγάλης
    Βρετανίας και Βορείου Ιρλανδίας να εφαρμόσουν
    ειδικό μέτρο παρέκκλισης από το άρθρο 167 της
    οδηγίας 2006/112/ΕΚ σχετικά με το κοινό σύστημα
    φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus, 7. detsember 2009 , millega lubatakse Rootsi Kuningriigil
    ning Suurbritannia ja Põhja-Iiri Ühendkuningriigil kohaldada meedet, millega
    tehakse erand direktiivi 2006/112/EÜ (mis käsitleb ühist käibemaksusüsteemi)
    artiklist 167
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös, annettu 7 päivänä joulukuuta
    2009 , luvan antamisesta Ruotsin kuningaskunnalle ja Ison-Britannian ja Pohjois-Irlannin
    yhdistyneelle kuningaskunnalle soveltaa yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 167 artiklasta poikkeavaa toimenpidettä
  type: main
- language: hu
  script: Latn
  content: A Tanács végrehajtási határozata ( 2009. december 7. ) a Svéd Királyságnak,
    valamint Nagy-Britannia és Észak-Írország Egyesült Királyságának a közös
    hozzáadottértékadó-rendszerről szóló 2006/112/EK irányelv 167. cikkétől
    eltérő intézkedés alkalmazására való felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione del Consiglio, del 7 dicembre 2009 , che autorizza
    il Regno di Svezia e il Regno Unito di Gran Bretagna e Irlanda del Nord ad applicare
    una misura di deroga all’articolo 167 della direttiva 2006/112/CE relativa al
    sistema comune d’imposta sul valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums ( 2009. gada 7. decembris ), ar ko Zviedrijas
    Karalistei un Lielbritānijas un Ziemeļīrijas Apvienotajai Karalistei atļauj
    piemērot pasākumu, atkāpjoties no 167. panta Direktīvā 2006/112/EK par kopējo
    pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: 2009 m. gruodžio 7 d. Tarybos įgyvendinimo sprendimas, leisti Švedijos
    Karalystei ir Jungtinei Didžiosios Britanijos ir Šiaurės Airijos Karalystei
    taikyti priemonę, kuria nukrypstama nuo Direktyvos 2006/112/EB dėl pridėtinės
    vertės mokesčio bendros sistemos 167 straipsnio
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kunsill tas- 7 ta' Diċembru 2009
    li tawtorizza lir-Renju tal-Isvezja u r-Renju Unit tal-Gran Brittanja u tal-Irlanda
    ta’ Fuq biex japplikaw miżura ta' deroga mill-Artikolu 167 tad-Direttiva 2006/112/KE
    dwar is-sistema komuni ta' taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit van de Raad van 7 december 2009 waarbij het Koninkrijk
    Zweden en het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland worden
    gemachtigd een maatregel toe te passen die afwijkt van artikel 167 van Richtlijn
    2006/112/EG van de Raad betreffende het gemeenschappelijke stelsel van belasting
    over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady z dnia 7 grudnia 2009 r. upoważniająca Królestwo
    Szwecji i Zjednoczone Królestwo Wielkiej Brytanii i Irlandii Północnej do stosowania
    środka stanowiącego odstępstwo od art. 167 dyrektywy 2006/112/WE w sprawie
    wspólnego systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução do Conselho, de 7 de Dezembro de 2009 , que autoriza
    o Reino da Suécia e o Reino Unido da Grã-Bretanha e da Irlanda do Norte a aplicarem
    uma medida derrogatória do artigo 167. o da Directiva 2006/112/CE relativa ao
    sistema comum do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Consiliului din 7 decembrie 2009 de autorizare
    a Regatului Suediei și a Regatului Unit al Marii Britanii și Irlandei de Nord
    în vederea aplicării unei măsuri de derogare de la articolul 167 din Directiva
    2006/112/CE privind sistemul comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady zo 7. decembra 2009 , ktorým sa Švédskemu
    kráľovstvu a Spojenému kráľovstvu Veľkej Británie a Severného Írska povoľuje
    uplatniť opatrenie odchyľujúce sa od článku 167 smernice 2006/112/ES o spoločnom
    systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Odločba Sveta z dne 7. decembra 2009 o dovoljenju Kraljevini Švedski
    in Združenemu kraljestvu Velika Britanija in Severna Irska, da uporabita ukrep
    odstopanja od člena 167 Direktive Sveta 2006/112/ES o skupnem sistemu davka na
    dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de ejecución del Consejo, de 7 de diciembre de 2009 , por la
    que se autoriza al Reino de Suecia y al Reino Unido de Gran Bretaña e Irlanda
    del Norte a aplicar una medida de excepción a lo dispuesto en el artículo 167
    de la Directiva 2006/112/CE relativa al sistema común del impuesto sobre el valor
    añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut av den 7 december 2009 om bemyndigande för
    Konungariket Sverige och Förenade konungariket Storbritannien och Nordirland
    att tillämpa en åtgärd som avviker från artikel 167 i direktiv 2006/112/EG
    om ett gemensamt system för mervärdesskatt
  type: main
