title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1683/1999 of 28 July 1999 initiating an investigation
    concerning the alleged circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 584/96 on imports of certain tube and pipe fittings of iron
    or steel originating in the People's Republic of China by imports of the same
    tube and pipe fittings of iron or steel transhipped through Taiwan, and making
    such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1683/1999 de la Commission, du 28 juillet 1999, ouvrant
    une enquête sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) nº 584/96 du Conseil sur les importations de certains
    accessoires de tuyauterie, en fer ou en acier, originaires de la République populaire
    de Chine par des importations d'accessoires de tuyauterie identiques, en fer ou
    en acier, transitant par Taïwan et rendant obligatoire l'enregistrement de ces
    importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1683/1999 der Kommission vom 28. Juli 1999 zur Einleitung
    einer Untersuchung betreffend die angebliche Umgehung des mit der Verordnung (EG)
    Nr. 584/96 des Rates eingeführten Antidumpingzolls auf die Einfuhren bestimmter
    Rohrformstücke, Rohrverschlußstücke und Rohrverbindungsstücke aus Eisen oder
    Stahl mit Ursprung in der Volksrepublik China durch die Einfuhren solcher in Taiwan
    umgeladener Rohrformstücke, Rohrverschlußstücke und Rohrverbindungsstücke
    aus Eisen oder Stahl und zur zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1683/1999 af 28. juli 1999 om indledning
    af en undersøgelse vedrørende den påståede omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 584/96 om import af visse rørfittings
    af jern og stål med oprindelse i Folkerepublikken Kina ved import af samme rørfittings
    af jern og stål omladet via Taiwan og om at gøre sidstnævnte import til genstand
    for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1683/1999 της Επιτροπής,
    της 28ης Ιουλίου 1999, για την έναρξη έρευνας σχετικά
    με την υποτιθέμενη καταστρατήγηση των μέτρων
    αντιντάμπινγκ, που επιβλήθηκαν με τον κανονισμό
    (ΕΚ) αριθ. 584/96 του Συμβουλίου στις εισαγωγές
    ορισμένων εξαρτημάτων σωληνώσεων από σίδηρο
    ή χάλυβα καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας, από εισαγωγές των ίδιων εξαρτημάτων
    σωληνώσεων από σίδηρο ή χάλυβα που μεταφορτώνονται
    μέσω Ταϊβάν και για την υπαγωγή αυτών των εισαγωγών
    σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1683/1999, annettu 28 päivänä heinäkuuta
    1999, Kiinan kansantasavallasta peräisin olevien tiettyjen raudasta tai teräksestä
    valmistettujen putkien liitososien tuonnissa neuvoston asetuksella (EY) N:o 584/96
    käyttöön otettujen polkumyyntitoimenpiteiden väitettyä kyseisten raudasta
    tai teräksestä valmistettujen putkien liitososien Taiwanin kautta kuljettamalla
    tapahtuvalla tuonnilla kiertämistä koskevan tutkimuksen aloittamisesta ja kyseisen
    tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1683/1999 della Commissione, del 28 luglio 1999, che
    apre un'inchiesta relativa alla presunta elusione delle misure antidumping imposte
    dal regolamento (CE) n. 584/96 del Consiglio sulle importazioni di alcuni accessori
    per tubi, di ferro o di acciaio, originari della Repubblica popolare cinese mediante
    importazioni degli stessi accessori per tubi, di ferro o di acciaio, trasbordati
    attraverso Taiwan e che dispone la registrazione di tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1683/1999 van de Commissie van 28 juli 1999 houdende
    de opening van een onderzoek naar de mogelijke ontwijking van de bij Verordening
    (EG) nr. 584/96 van de Raad vastgestelde antidumpingmaatregelen ten aanzien van
    bepaalde hulpstukken voor buisleidingen, van ijzer of staal, van oorsprong uit
    de Volksrepubliek China, verzonden via Taiwan en het besluit tot registratie van
    de invoer van deze hulpstukken uit Taiwan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1683/1999 da Comissão, de 28 de Julho de 1999, que
    inicia um inquérito sobre a alegada evasão das medidas anti-dumping instituídas
    pelo Regulamento (CE) n° 584/96 do Conselho sobre as importações de certos
    acessórios para tubos, de ferro ou aço, originários da República Popular da
    China por importações dos mesmos acessórios para tubos, de ferro ou aço, expedidos
    via Taiwan, e que torna obrigatório o registo destas últimas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1683/1999 de la Comisión, de 28 de julio de 1999,
    relativo a la apertura de una investigación sobre la presunta elusión de medidas
    antidumping establecidas por el Reglamento (CE) nº 584/96 del Consejo sobre las
    importaciones de determinados accesorios de tubería, de hierro o de acero, originarios
    de la República Popular de China mediante importaciones de los mismos accesorios
    de tubería, de hierro o de acero que transitan a través de Taiwán, y por el
    que dichas importaciones se someten a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1683/1999 av den 28 juli 1999 om inledande
    av en undersökning rörande påstått kringgående av de antidumpningsåtgärder
    som genom rådets förordning (EG) nr 584/96 införts på import av vissa rördelar
    av järn eller stål med ursprung i Folkrepubliken Kina genom import av sådana
    rördelar av järn eller stål som omlastas i Taiwan, och om registrering av sådan
    import
  type: main
