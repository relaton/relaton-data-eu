- language: en
  script: Latn
  content: Commission Implementing Directive 2012/44/EU of 26 November 2012 amending
    Directives 2003/90/EC and 2003/91/EC setting out implementing measures for the
    purposes of Article 7 of Council Directives 2002/53/EC and 2002/55/EC respectively,
    as regards the characteristics to be covered as a minimum by the examination and
    the minimum conditions for examining certain varieties of agricultural plant species
    and vegetable species
  type: main
- language: fr
  script: Latn
  content: Directive d’exécution 2012/44/UE de la Commission du 26 novembre 2012
    modifiant les directives 2003/90/CE et 2003/91/CE établissant des modalités
    d’application des articles 7 des directives 2002/53/CE et 2002/55/CE du Conseil
    en ce qui concerne les caractères minimaux à prendre en compte et les conditions
    minimales à remplir lors de l’examen de certaines variétés d’espèces de
    plantes agricoles et de légumes
  type: main
- language: de
  script: Latn
