    de plantas agrícolas e de espécies hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva de punere în aplicare 2012/44/UE a Comisiei din 26 noiembrie
    2012 de modificare a Directivelor 2003/90/CE și 2003/91/CE de stabilire a măsurilor
    de punere în aplicare a articolului 7 din Directivele 2002/53/CE și, respectiv,
    2002/55/CE ale Consiliului în ceea ce privește caracteristicile minime de analizat
    și condițiile minime de verificare a anumitor soiuri de specii de plante agricole
    și specii de legume
  type: main
- language: sk
  script: Latn
  content: Vykonávacia smernica Komisie 2012/44/EÚ z 26. novembra 2012 , ktorou
