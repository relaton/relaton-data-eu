    sort poljščin in zelenjadnic
  type: main
- language: es
  script: Latn
  content: Directiva de Ejecución 2012/44/UE de la Comisión, de 26 de noviembre
    de 2012 , que modifica las Directivas 2003/90/CE y 2003/91/CE, por las que se
    establecen disposiciones de aplicación a los fines del artículo 7 de la Directiva
