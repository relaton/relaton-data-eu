    és zöldségfajok fajtáinak vizsgálata keretében minimálisan vizsgálandó
    jellemzők és a vizsgálat minimumfeltételei tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva di esecuzione 2012/44/UE della Commissione, del 26 novembre 2012
    , che modifica le direttive 2003/90/CE e 2003/91/CE della Commissione che stabiliscono
    modalità di applicazione dell’articolo 7 delle direttive 2002/53/CE e 2002/55/CE
    del Consiglio per quanto riguarda i caratteri minimi sui quali deve vertere l’esame
    e le condizioni minime per l’esame di alcune varietà delle specie di piante
    agricole e di ortaggi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas direktīva 2012/44/ES ( 2012. gada 26. novembris
    ), ar ko groza Direktīvu 2003/90/EK, ar ko nosaka īstenošanas pasākumus Padomes
    Direktīvas 2002/53/EK 7. pantā attiecībā uz obligāti pārbaudāmajām pazīmēm
    un obligātajiem konkrētu lauksaimniecības augu sugu pārbaudes nosacījumiem,
    un Direktīvu 2003/91/EK, kurā izklāstīti īstenošanas noteikumi, ar ko piemēro
    7. pantu Padomes Direktīvā 2002/55/EK attiecībā uz raksturīgajām pazīmēm,
    kas obligāti jāaptver pārbaudē, un obligātajiem nosacījumiem dažādu dārzeņu
    sugu šķirņu pārbaudei
  type: main
- language: lt
  script: Latn
