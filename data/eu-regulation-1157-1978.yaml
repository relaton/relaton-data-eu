id: EURegulation11571978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1157/78 of 30 May 1978 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of certain non-member countries in the 200 nautical
    mile zone off the coast of the French department of Guyana, for the period 1 June
    to 31 December 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1157/78 du Conseil, du 30 mai 1978, fixant, pour la
    période du 1er juin au 31 décembre 1978, certaines mesures intérimaires de
    conservation et de gestion des ressources de pêche applicables à l'égard des
    navires battant pavillon de certains pays tiers dans la zone de 200 milles située
    au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1157/78 des Rates vom 30. Mai 1978 zur Festlegung
    von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    in der 200-Meilen-Zone vor der Küste des französischen Departements Guyana gegenüber
    Schiffen, die die Flagge von Drittländern führen, für den Zeitraum vom 1. Juni
    bis 31. Dezember 1978
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1157/78 af 30. maj 1978 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse af fiskeressourcerne,
    gældende for fartøjer, der sejler under tredjelandes flag, i zonen på 200 sømil
    ud for det franske department Guyanas kyster for perioden 1. juni til 31. december
    1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1157/78 del Consiglio, del 30 maggio 1978, che fissa,
    per il periodo 1 giugno - 31 dicembre 1978, alcune misure temporanee di conservazione
    e di gestione delle risorse ittiche da applicare nei riguardi delle navi da pesca
    che battono bandiera di taluni paesi terzi nella zona di 200 miglia situata al
    largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1157/78 van de Raad van 30 mei 1978 tot vaststelling,
    voor het tijdvak van 1 juni tot en met 31 december 1978, van bepaalde overgangsmaatregelen
    voor de instandhouding en het beheer van visbestanden, die van toepassing zijn
    ten aanzien van schepen die de vlag voeren van bepaalde derde landen in de 200-mijlzone
    gelegen langs de kusten van het Franse departement Guyana
  type: main
