title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3988/86 of 23 December 1986 suspending for
    the 1987 fishing year the duties applicable to fresh fishery products originating
    in Morocco and coming from joint fishery ventures set up between natural or legal
    persons from Portugal and Morocco, on the direct landing of such products in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3988/86 de la Commission du 23 décembre 1986 portant
    pour la campagne 1987 suspension des droits applicables aux produits de la pêche
    fraîche originaires du Maroc et provenant des entreprises communes de pêche
    constituées entre personnes physiques ou morales du Portugal et du Maroc, à
    l' occasion de leur débarquement direct au Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3988/86 der Kommission vom 23. Dezember 1986 zur Aussetzung
    der bei der Direktanlandung in Portugal anzuwendenden Zölle auf frische Fischereierzeugnisse
    mit Ursprung in Marokko von gemeinsamen Fischereiunternehmen zwischen natürlichen
    oder juristischen Personen Portugals und Marokkos für das Wirtschaftsjahr 1987
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3988/86 af 23. december 1986 om suspension
    for fangstsæsonen 1987 af tolden på ferske fiskerivarer med oprindelse i Marokko
    og hidrørende fra fællesforetagender, der er oprettet mellem fysiske eller juridiske
    personer i Portugal og i Marokko, i anledning af sådanne varers direkte landing
    i Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3988/86 της Επιτροπής
    της 23ης Δεκεμβρίου 1986 για την αναστολή, για
    την περίοδο εμπορίας 1987, των δασμών που εφαρμόζονται
    σε νωπά προϊόντα αλιείας καταγωγής Μαρόκου
    τα οποία προέρχονται από κοινές αλιευτικές
    επιχειρήσεις που έχουν συσταθεί μεταξύ φυσικών
    ή νομικών προσώπων της Πορτογαλίας και του
    Μαρόκου, κατά την απευθείας εκφόρτωση αυτών
    των προϊόντων στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3988/86 della Commissione del 23 dicembre 1986 che
    sospende per la campagna 1987 i dazi applicabili ai prodotti freschi della pesca
    originari del Marocco e provenienti da imprese comuni di pesca costituite tra
    persone fisiche o giuridiche del Portogallo e del Marocco, all' atto del loro
    sbarco diretto in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3988/86 van de Commissie van 23 december 1986 tot
    schorsing voor het visseizoen 1987 van de rechten voor verse visserijprodukten
    van oorsprong uit Marokko en afkomstig van gemeenschappelijke visserijondernemingen
    van natuurlijke of rechtspersonen uit Portugal en uit Marokko, bij rechtstreekse
    aanvoer in Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3988/86 da Comissão de 23 de Dezembro de 1986 que
    suspende para a campanha de 1987 os direitos aplicáveis aos produtos da pesca
    fresca originários de Marrocos e provenientes das empresas comuns de pesca constituídas
    entre pessoas singulares ou colectivas de Portugal e de Marrocos, aquando do seu
    desembarque directo em Portugal
  type: main
- language: es
