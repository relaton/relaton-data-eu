title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1051/78 of 19 May 1978 derogating from Regulation
    (EEC) No 3376/75 as regards the calculation of the amount of the reduction of
    import charges for beef and veal products from the African, Caribbean and Pacific
    States for the period beginning 22 May 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1051/78 de la Commission, du 19 mai 1978, portant
    dérogation au règlement (CEE) n° 3376/75 en ce qui concerne le calcul des montants
    de diminution des charges à l' importation de produits du secteur de la viande
    bovine originaires des États d' Afrique, des Caraïbes et du Pacifique pour la
    période débutant le 22 mai 1978
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1051/78 der Kommission vom 19. Mai 1978 zur Abweichung
    von der Verordnung (EWG) Nr. 3376/75 betreffend die Berechnung der Beträge zur
    Senkung der Einfuhrbelastung für Rindfleischerzeugnisse mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean für den am 22. Mai 1978
    beginnenden Zeitraum
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1051/78 af 19. maj 1978 om undtagelse
    fra forordning (EØF) nr. 3376/75 med hensyn til beregning af de beløb, hvormed
    importbelastningerne nedsættes ved indførsel af oksekød fra lande i Afrika,
    Vestindien og Stillehavet i den periode, der begynder den 22. maj 1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1051/78 della Commissione, del 19 maggio 1978, recante
    deroga al regolamento (CEE) n. 3376/75 per quanto concerne il calcolo degli importi
    di cui vengono diminuiti gli oneri all' importazione di prodotti del settore delle
    carni bovine, originari degli Stati africani, dei Caraibi e del Pacifico, per
    il periodo che inizia il 22 maggio 1978
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1051/78 van de Commissie van 19 mei 1978 houdende
    afwijking van Verordening (EEG) nr. 3376/75 ten aanzien van de berekening van
    de met ingang van 22 mei 1978 tot te passen vermindering van de belastingen op
    de invoer van produkten in de sector rundvlees uit de Staten in Afrika, het Caribische
    gebied en de Stille Oceaan
  type: main
