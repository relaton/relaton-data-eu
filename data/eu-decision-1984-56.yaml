    comune'
  type: main
- language: nl
  script: Latn
  content: '84/56/EEG: Beschikking van de Commissie van 23 januari 1984 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Tracor - Multichannel analysis system,
    model TN 1710" met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
