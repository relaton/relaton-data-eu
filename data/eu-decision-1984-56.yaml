title:
- language: en
  script: Latn
  content: '84/56/EEC: Commission Decision of 23 January 1984 establishing that the
    apparatus described as ''Tracor - Multichannel Analysis System, model TN 1710''
    may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/56/CEE: Décision de la Commission du 23 janvier 1984 constatant que
    l''importation de l''appareil dénommé "Tracor - Multichannel Analysis System,
    model TN 1710" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '84/56/EWG: Entscheidung der Kommission vom 23. Januar 1984, mit der festgestellt
    wird, daß das Gerät ,,TRACOR - Multichannel Analysis System, model TN 1710"
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '84/56/EØF: Kommissionens beslutning af 23. januar 1984 om fastslåelse
    af, at indførsel af apparatet "Tracor - Multichannel Analysis System, model TN
    1710" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '84/56/ΕΟΚ: Απόφαση της Επιτροπής της 23ης Ιανουαρίου
