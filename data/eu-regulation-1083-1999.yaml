title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1083/1999 of 26 May 1999 amending Regulation
    (EEC) No 1617/93 on the application of Article 85(3) of the Treaty to certain
    categories of agreements and concerted practices concerning joint planning and
    coordination of schedules, joint operations, consultations on passenger and cargo
    tariffs on scheduled air services and slot allocation at airports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1083/1999 de la Commission, du 26 mai 1999, modifiant
    le règlement (CEE) n° 1617/93 concernant l'application de l'article 85, paragraphe
    3, du traité à certaines catégories d'accords, de décisions ou de pratiques
    concertées ayant pour objet la planification conjointe et la coordination des
    horaires, l'exploitation de services en commun, les consultations tarifaires pour
    le transport de passagers et de fret sur les services aériens réguliers et la
    réparation des créneaux horaires dans les aéroports
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1083/1999 der Kommission vom 26. Mai 1999 zur Änderung
    der Verordnung (EWG) Nr. 1617/93 zur Anwendung von Artikel 85 Absatz 3 EWG-Vertrag
    auf Gruppen von Vereinbarungen, Beschlüssen und aufeinander abgestimmten Verhaltensweisen
    betreffend die gemeinsame Planung und Koordinierung von Flugplänen, den gemeinsamen
    Betrieb von Flugdiensten, Tarifkonsultationen im Personen- und Frachtlinienverkehr
    sowie die Zuweisung von Zeitnischen auf Flughäfen
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1083/1999 ze dne 26. května 1999, kterým
    se mění nařízení (EHS) č. 1617/93 o použití čl. 85 odst. 3 Smlouvy na
    určité kategorie dohod, rozhodnutí a jednání ve vzájemné shodě týkajících
    se společného plánování a koordinace letových řádů, společného poskytování
    služeb, konzultací o tarifech pravidelné osobní a nákladní dopravy a přidělování
    volných letištních časů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1083/1999 af 26. maj 1999 om ændring
    af forordning (EØF) nr. 1617/93 om anvendelse af traktatens artikel 85, stk.
    3, på visse kategorier af aftaler, vedtagelser og samordnet praksis vedrørende
    konsultationer om takster for ruteflyvning med passagerer med bagage og vedrørende
    tildeling af slots i lufthavne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1083/1999 της Επιτροπής,
    της 26ης Μαΐου 1999, για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1617/93 σχετικά με την εφαρμογή του
    άρθρου 85 παράγραφος 3 της συνθήκης σε ορισμένες
    κατηγορίες συμφωνιών, αποφάσεων και εναρμονισμένων
    πρακτικών που αφορούν τον από κοινού προγραμματισμό
    και συντονισμό των δρομολογίων, την από κοινού
    εκμετάλλευση διαδρομών, τις διαβουλεύσεις
    για τους ναύλους μεταφοράς επιβατών και εμπορευμάτων
    στις τακτικές αεροπορικές γραμμές για την
    κατανομή του διαθέσιμου χρόνου χρήσης στους
    αερολιμένες
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1083/1999, 26. mai 1999, millega muudetakse
    määrust (EMÜ) nr 1617/93 asutamislepingu artikli 85 lõike 3 kohaldamise kohta
    teatavat liiki kokkulepete, otsuste ja kooskõlastatud tegevuse suhtes, mis käsitlevad
    sõiduplaanide ühist planeerimist ja kooskõlastamist, ühist tegutsemist, regulaarlennuliinide
    reisijate- ja lastiveotariifidega seotud konsultatsioone ning teenindusaegade
    jaotamist lennujaamades
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1083/1999, tehty 26 päivänä toukokuuta 1999,
    perustamissopimuksen 85 artiklan 3 kohdan soveltamisesta aikataulujen yhteistä
    suunnittelua ja yhteensovittamista, yhteisen lentoliikenteen harjoittamista, neuvotteluja
    säännöllisen lentoliikenteen matkustaja- ja rahtimaksuista sekä lähtö- ja
    saapumisaikojen jakamista lentoasemilla koskevien sopimusten, päätösten ja
    yhdenmukaistettujen menettelytapojen ryhmiin annetun asetuksen (ETY) N:o 1617/93
    muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1083/1999/EK rendelete (1999. május 26.) a Szerződés 85.
    cikke (3) bekezdésének a menetrendek közös tervezésére és összehangolására,
    a közös üzemeltetésre, a menetrend szerinti légi járatok személyszállítási
    és árufuvarozási díjtételeiről szóló konzultációkra és a repülőtéri
    résidőkiosztásra vonatkozó megállapodások és összehangolt magatartások
    egyes csoportjaira történő alkalmazásáról szóló 1617/93/EGK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1083/1999 della Commissione, del 26 maggio 1999, che
    modifica il regolamento (CEE) n. 1617/93 relativo all'applicazione dell'articolo
    85, paragrafo 3, del trattato ad alcune categorie di accordi, decisioni e pratiche
    concordate aventi per oggetto, sui servizi aerei di linea, la programmazione congiunta
    e il coordinamento degli orari, gli esercizi congiunti, le consultazioni sulle
    tariffe per i passeggeri e le merci e l'assegnazione di bande orarie negli aeroporti
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1083/1999 (1999. gada 26. maijs), ar kuru groza
    Regulu (EEK) Nr. 1617/93 par Līguma 85. panta 3. punkta piemērošanu dažām
    tādu vienošanos, lēmumu un saskaņotu darbību kategorijām, kas attiecas uz
    lidojumu sarakstu kopīgu plānošanu un saskaņošanu, lidojumu kopīgu apkalpošanu
    un apspriešanos par pasažieru un kravas pārvadājumu tarifiem regulārās gaisa
    satiksmes līnijās, kā arī uz laika nišu sadali lidostās
  type: main
- language: lt
  script: Latn
  content: 1999 m. gegužės 26 d. Komisijos reglamentas (EB) Nr. 1083/1999 iš dalies
    pakeičiantis Reglamentą (EEB) Nr. 1617/93 dėl Sutarties 85 straipsnio 3 dalies
    taikymo tam tikrų grupių susitarimams ir suderintiems veiksmams, susijusiems
    su bendru tvarkaraščių planavimu ir derinimu, bendromis operacijomis, konsultacijomis
    dėl keleivių ir krovinių reguliariojo oro susisiekimo tarifų ir laiko tarpsnių
    paskirstymo oro uostuose
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 1083/1999 tas-26 ta' Mejju 1999
    li jemenda r-Regolament (KEE) Nru 1617/93 dwar l-applikazzjoni ta' l-Artikolu
    85(3) tat-Trattat għal ċerti kategoriji ta' akkordji u prattiki miftiehma li
    jirrigwardaw l-ippjanar konġunt u l-koordinazzjoni ta' l-iskedi, l-operazzjonijiet
    konġunti, il-konsultazzjonijiet fuq it-tariffi tal-passiġġieri u t-tagħbija
    fuq is-servizzi ta' l-ajru skedati u l-allokazzjonijiet ta' slots fl-ajruporti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1083/1999 van de Commissie van 26 mei 1999 tot wijziging
    van Verordening (EEG) nr. 1617/93 betreffende de toepassing van artikel 85, lid
    3, van het EEG-Verdrag op bepaalde groepen overeenkomsten, besluiten en onderling
    afgestemde feitelijke gedragingen die betrekking hebben op de gezamenlijke planning
    en coördinatie over passagiers- en vrachtvervoertarieven bij geregelde luchtdiensten
    en op de toekenning van landings- en starttijden op luchthavens
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1083/1999 z dnia 26 maja 1999 r. zmieniające
    rozporządzenie (EWG) nr 1617/93 w sprawie stosowania art. 85 ust. 3 Traktatu
    do niektórych kategorii porozumień i uzgodnionych praktyk dotyczących wspólnego
    planowania i koordynacji rozkładów, wspólnych przedsięwzięć i konsultacji
    w sprawie taryf pasażerskich i towarowych w regularnych usługach lotniczych
    oraz przydziału czasu na start lub lądowanie w portach lotniczych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1083/1999 da Comissão, de 26 de Maio de 1999, que
    altera o Regulamento (CEE) n° 1617/93 relativo à aplicação do n° 3 do artigo
    85° do Tratado a certas categorias de acordos, decisões e práticas concertadas
    que têm por objecto o planeamento e coordenação conjuntos dos horários, as
    operações conjuntas as consultas sobre as tarifas de passageiros e suas bagagens
    dos serviços aéreos regulares e a atribuição das faixas horárias nos aeroportos
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1083/1999 z 26. mája 1999 o zmene a doplnení
    nariadenia (EHS) č. 1617/93 o uplatňovaní článku 85 ods. 3 zmluvy na niektoré
    kategórie dohôd a zosúladených postupov týkajúcich sa spoločného plánovania
    a koordinácie letových poriadkov, spoločnej prevádzky, konzultácií o osobných
    a nákladných tarifách pre pravidelnú leteckú dopravu a prideľovania prevádzkových
    intervalov na letiskách
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1083/1999 z dne 26. maja 1999 o spremembi Uredbe
    (EGS) št. 1617/93 o uporabi člena 85(3) Pogodbe za določene skupine sporazumov
    in usklajenih ravnanj glede skupnega načrtovanja in usklajevanja voznih redov,
    skupnega obratovanja, posvetovanj o cenah prevoza potnikov in blaga v rednem zračnem
    prevozu in dodelitve časovnih blokov na letališčih
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1083/1999 de la Comisión, de 26 de mayo de 1999, por
    el que se modifica el Reglamento (CEE) n 1617/93 relativo a la aplicación del
    apartado 3 del artículo 85 del Tratado a determinadas categorías de acuerdos,
    decisiones y prácticas concertadas que tengan por objeto la planificación conjunta
    y la coordinación de horarios, la utilización conjunta de líneas, las consultas
    relativas a las tarifas de transporte de pasajeros y mercancías en los servicios
    aéreos regulares y la asignación de períodos horarios en los aeropuertos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1083/1999 av den 26 maj 1999 om ändring
