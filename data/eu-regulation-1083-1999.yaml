    på vissa kategorier av avtal och samordnade förfaranden med avseende på gemensam
    planering och samordning av tidtabeller, gemensam drift, samråd om passagerar-
    och frakttaxor i regelbunden luftfart samt fördelning av avgångs- och ankomsttider
