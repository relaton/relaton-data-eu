  script: Latn
  content: '76/481/EEC: Commission Decision of 13 April 1976 concerning the prolongation
    of farm development plans in certain regions of Italy pursuant to Article 4 (6)
    of Council Directive 72/159/EEC of 17 April 1972 on the modernization of farms
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/481/CEE: Décision de la Commission, du 13 avril 1976, relative à
    la prolongation de la durée des plans de développement des exploitations dans
    certaines régions d''Italie, conformément à l''article 4 paragraphe 6 de la
    directive 72/159/CEE du Conseil, du 17 avril 1972, concernant la modernisation
    des exploitations agricoles (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '76/481/EWG: Entscheidung der Kommission vom 13. April 1976 betreffend
    die Verlängerung der Laufzeit der Betriebsentwicklungspläne gemäß Artikel
    4 Absatz 6 der Richtlinie des Rates 72/159/EWG vom 17. April 1972 über die Modernisierung
    der landwirtschaftlichen Betriebe für bestimmte Gebiete in Italien (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '76/481/EØF: Kommissionens beslutning af 13. april 1976 vedrørende forlængelse
