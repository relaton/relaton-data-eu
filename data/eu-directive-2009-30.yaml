title:
- language: en
  script: Latn
  content: Directive 2009/30/EC of the European Parliament and of the Council of 23
    April 2009 amending Directive 98/70/EC as regards the specification of petrol,
    diesel and gas-oil and introducing a mechanism to monitor and reduce greenhouse
    gas emissions and amending Council Directive 1999/32/EC as regards the specification
    of fuel used by inland waterway vessels and repealing Directive 93/12/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 2009/30/CE du Parlement européen et du Conseil du 23 avril 2009
    modifiant la directive 98/70/CE en ce qui concerne les spécifications relatives
    à l’essence, au carburant diesel et aux gazoles ainsi que l’introduction
    d’un mécanisme permettant de surveiller et de réduire les émissions de gaz
    à effet de serre, modifiant la directive 1999/32/CE du Conseil en ce qui concerne
    les spécifications relatives aux carburants utilisés par les bateaux de navigation
    intérieure et abrogeant la directive 93/12/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 2009/30/EG des Europäischen Parlaments und des Rates vom 23.
    April 2009 zur Änderung der Richtlinie 98/70/EG im Hinblick auf die Spezifikationen
    für Otto-, Diesel- und Gasölkraftstoffe und die Einführung eines Systems zur
    Überwachung und Verringerung der Treibhausgasemissionen sowie zur Änderung der
    Richtlinie 1999/32/EG des Rates im Hinblick auf die Spezifikationen für von Binnenschiffen
    gebrauchte Kraftstoffe und zur Aufhebung der Richtlinie 93/12/EWG
  type: main
- language: bg
  script: Cyrl
  content: Директива 2009/30/ЕО на Европейския парламент
    и на Съвета от 23 април 2009 година за изменение
    на Директива 98/70/ЕО по отношение на спецификацията
    на бензина, дизеловото гориво и газьола и за
    въвеждане на механизъм за наблюдение и намаляване
    на нивата на емисиите на парникови газове и
    за изменение на Директива 1999/32/ЕО на Съвета
    по отношение на спецификацията на горивото,
    използвано от плавателни съдове по вътрешните
    водни пътища, и за отмяна на Директива 93/12/ЕИО
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2009/30/ES ze dne 23. dubna 2009
    , kterou se mění směrnice 98/70/ES, pokud jde o specifikaci benzinu, motorové
    nafty a plynových olejů, zavedení mechanismu pro sledování a snížení emisí
    skleníkových plynů, a směrnice Rady 1999/32/ES, pokud jde o specifikaci paliva
    používaného plavidly vnitrozemské plavby, a kterou se ruší směrnice 93/12/EHS
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2009/30/EF af 23. april 2009 om
    ændring af direktiv 98/70/EF for så vidt angår specifikationerne for benzin,
    diesel og gasolie og om indførelse af en mekanisme for overvågning og reduktion
    af emissionerne af drivhusgasser og om ændring af Rådets direktiv 1999/32/EF
    for så vidt angår specifikationerne for brændstof, der benyttes i fartøjer
    til sejlads på indre vandveje, og om ophævelse af direktiv 93/12/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 2009/30/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 23ης Απριλίου 2009 , με
    την οποία τροποποιείται η οδηγία 98/70/ΕΚ όσον
    αφορά τις προδιαγραφές για τη βενζίνη, το ντίζελ
    και το πετρέλαιο εσωτερικής καύσης και την
    καθιέρωση μηχανισμού για την παρακολούθηση
    και τη μείωση των εκπομπών αερίων του θερμοκηπίου,
    τροποποιείται η οδηγία 1999/32/ΕΚ του Συμβουλίου
    όσον αφορά την προδιαγραφή των καυσίμων που
    χρησιμοποιούνται στα πλοία εσωτερικής ναυσιπλοΐας
    και καταργείται η οδηγία 93/12/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2009/30/EÜ, 23. aprill 2009 ,
    millega muudetakse direktiivi 98/70/EÜ seoses bensiini, diislikütuse ja gaasiõli
    spetsifikatsioonidega ja kehtestatakse kasvuhoonegaaside heitkoguste järelevalve
    ja vähendamise mehhanism ning millega muudetakse nõukogu direktiivi 1999/32/EÜ
    seoses siseveelaevades kasutatava kütuse spetsifikatsioonidega ning tunnistatakse
    kehtetuks direktiiv 93/12/EMÜ
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2009/30/EY, annettu 23 päivänä
    huhtikuuta 2009 , direktiivin 98/70/EY muuttamisesta bensiinin, dieselin ja kaasuöljyn
    laatuvaatimusten osalta sekä kasvihuonekaasupäästöjen seurantaan ja vähentämiseen
    tarkoitetun mekanismin käyttöönottamisen osalta, neuvoston direktiivin 1999/32/EY
    muuttamisesta sisävesialusten käyttämien polttoaineiden laatuvaatimusten osalta
    ja direktiivin 93/12/ETY kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva 2009/30/EZ Europskog parlamenta i Vijeća od 23. travnja 2009.
    o izmjeni Direktive 98/70/EZ u pogledu specifikacije benzina, dizelskoga goriva
    i plinskog ulja i uvođenju mehanizma praćenja i smanjivanja emisija stakleničkih
    plinova, o izmjeni Direktive Vijeća 1999/32/EZ u pogledu specifikacije goriva
    koje se koristi na plovilima na unutarnjim plovnim putovima i stavljanju izvan
    snage Direktive 93/12/EEZ
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2009/30/EK irányelve ( 2009. április
    23.) a benzinre, a dízelolajra és a gázolajra vonatkozó követelmények, illetőleg
    az üvegházhatású kibocsátott gázok mennyiségének nyomon követését és
    mérséklését célzó mechanizmus bevezetése tekintetében a 98/70/EK irányelv
    módosításáról, a belvízi hajókban felhasznált tüzelőanyagokra vonatkozó
    követelmények tekintetében az 1999/32/EK irányelv módosításáról, valamint
    a 93/12/EGK irányelv hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 2009/30/CE del Parlamento europeo e del Consiglio, del 23 aprile
    2009 , che modifica la direttiva 98/70/CE per quanto riguarda le specifiche relative
    a benzina, combustibile diesel e gasolio nonché l’introduzione di un meccanismo
    inteso a controllare e ridurre le emissioni di gas a effetto serra, modifica la
    direttiva 1999/32/CE del Consiglio per quanto concerne le specifiche relative
    al combustibile utilizzato dalle navi adibite alla navigazione interna e abroga
    la direttiva 93/12/CEE
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2009/30/EK ( 2009. gada 23. aprīlis),
    ar ko groza Direktīvu 98/70/EK attiecībā uz benzīna, dīzeļdegvielas un gāzeļļas
    specifikācijām un ievieš mehānismu autotransporta līdzekļos lietojamās
    degvielas radītās siltumnīcefekta gāzu emisijas kontrolei un samazināšanai,
    groza Padomes Direktīvu 1999/32/EK attiecībā uz tās degvielas specifikācijām,
    kuru lieto iekšējo ūdensceļu kuģos, un atceļ Direktīvu 93/12/EEK
  type: main
- language: lt
  script: Latn
  content: 2009 m. balandžio 23 d. Europos Parlamento ir Tarybos direktyva 2009/30/EB,
    iš dalies keičianti Direktyvos 98/70/EB nuostatas dėl benzino, dyzelinių degalų
    (dyzelino) ir gazolių kokybės rodiklių, nustatanti šiltnamio efektą sukeliančių
    dujų stebėsenos ir mažinimo mechanizmą, iš dalies keičianti Tarybos direktyvos
    1999/32/EB nuostatas dėl vidaus vandens kelių laivų kuro kokybės rodiklių
    ir panaikinanti Direktyvą 93/12/EEB
  type: main
- language: mt
  script: Latn
  content: Direttiva 2009/30/KE tal-Parlament Ewropew u tal-Kunsill tat- 23 ta’
    April 2009 li temenda d-Direttiva 98/70/KE rigward l-ispeċifikazzjoni tal-petrol,
    tad-diżil u taż-żejt tal-gass u li tintroduċi mekkaniżmu għall-monitoraġġ
    u għat-tnaqqis tal-emissjonijiet tal-gassijiet serra u li temenda d-Direttiva
    tal-Kunsill 1999/32/KE rigward l-ispeċifikazzjoni tal-karburant użat mill-bastimenti
    tal-passaġġi tal-ilma interni u li tħassar id-Direttiva 93/12/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2009/30/EG van het Europees Parlement en de Raad van 23 april
    2009 tot wijziging van Richtlijn 98/70/EG met betrekking tot de specificatie van
    benzine, dieselbrandstof en gasolie en tot invoering van een mechanisme om de
    emissies van broeikasgassen te monitoren en te verminderen, tot wijziging van
    Richtlijn 1999/32/EG van de Raad met betrekking tot de specificatie van door binnenschepen
    gebruikte brandstoffen en tot intrekking van Richtlijn 93/12/EEG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2009/30/WE z dnia 23 kwietnia
    2009 r. zmieniająca dyrektywę 98/70/WE odnoszącą się do specyfikacji benzyny
    i olejów napędowych oraz wprowadzającą mechanizm monitorowania i ograniczania
    emisji gazów cieplarnianych oraz zmieniającą dyrektywę Rady 1999/32/WE odnoszącą
    się do specyfikacji paliw wykorzystywanych przez statki żeglugi śródlądowej
    oraz uchylająca dyrektywę 93/12/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 2009/30/CE do Parlamento Europeu e do Conselho, de 23 de Abril
    de 2009 , que altera a Directiva 98/70/CE no que se refere às especificações
    da gasolina e do gasóleo rodoviário e não rodoviário e à introdução de
    um mecanismo de monitorização e de redução das emissões de gases com efeito
    de estufa e que altera a Directiva 1999/32/CE do Conselho no que se refere às
    especificações dos combustíveis utilizados nas embarcações de navegação
    interior e que revoga a Directiva 93/12/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva 2009/30/CE a Parlamentului European și a Consiliului din 23
    aprilie 2009 de modificare a Directivei 98/70/CE în ceea ce privește specificațiile
    pentru benzine și motorine, de introducere a unui mecanism de monitorizare și
    reducere a emisiilor de gaze cu efect de seră și de modificare a Directivei
    1999/32/CE a Consiliului în ceea ce privește specificațiile pentru carburanții
    folosiți de navele de navigație interioară și de abrogare a Directivei 93/12/CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2009/30/ES z 23. apríla 2009 ,
    ktorou sa mení a dopĺňa smernica 98/70/ES, pokiaľ ide o kvalitu automobilového
    benzínu, motorovej nafty a plynového oleja a zavedenie mechanizmu na monitorovanie
    a zníženie emisií skleníkových plynov, a ktorou sa mení a dopĺňa smernica
    Rady 1999/32/ES, pokiaľ ide o kvalitu paliva využívaného v plavidlách vnútrozemskej
    vodnej dopravy, a zrušuje smernica 93/12/EHS
  type: main
- language: sl
  script: Latn
  content: Direktiva 2009/30/ES Evropskega parlamenta in Sveta z dne 23. aprila 2009
    o spremembah Direktive 98/70/ES glede specifikacij motornega bencina, dizelskega
    goriva in plinskega olja ter o uvedbi mehanizma za spremljanje in zmanjševanje
    emisij toplogrednih plinov ter o spremembi Direktive Sveta 1999/32/ES glede specifikacij
    goriva, ki ga uporabljajo plovila za plovbo po celinskih plovnih poteh, in o razveljavitvi
    Direktive 93/12/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 2009/30/CE del Parlamento Europeo y del Consejo, de 23 de abril
    de 2009 , por la que se modifica la Directiva 98/70/CE en relación con las especificaciones
    de la gasolina, el diésel y el gasóleo, se introduce un mecanismo para controlar
    y reducir las emisiones de gases de efecto invernadero, se modifica la Directiva
    1999/32/CE del Consejo en relación con las especificaciones del combustible utilizado
    por los buques de navegación interior y se deroga la Directiva 93/12/CEE
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2009/30/EG av den 23 april 2009
    om ändring av direktiv 98/70/EG, vad gäller specifikationer för bensin, diesel
    och gasoljor och införande av ett system för hur växthusgasutsläpp ska övervakas
    och minskas, om ändring av rådets direktiv 1999/32/EG, vad gäller specifikationen
    för bränsle som används av fartyg på inre vattenvägar, och om upphävande
    av direktiv 93/12/EEG
  type: main
