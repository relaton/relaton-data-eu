title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2445/83 of 30 August 1983 re-establishing
    the levying of customs duties on other vitamins, falling within subheading 29.38
    B V and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2445/83 de la Commission du 30 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux autres vitamines, de la
    sous-position 29.38 B V du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2445/83 der Kommission vom 30. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für andere Vitamine der Tarifstelle 29.38 B V, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2445/83 af 30. august 1983 om genindførelse
    af opkrævning af told for andre vitaminer, henhørende under pos. 29.38 B V og
    med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2445/83 της Επιτροπής
