id: EURegulation19391975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1939/75 of the Commission of 28 July 1975 re-establishing
    the levying of the customs duties on certain other kinds of leather, except leather
    falling within heading No 41.06, 41.07 or 41.08, falling within subheading 41.05
    B II, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1939/75 de la Commission, du 28 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables à certaines
    peaux préparées d'autres animaux, à l'exclusion de celles des n 41.06 à 41.08
    inclus, de la sous-position tarifaire 41.05 B II, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1939/75 der Kommission vom 28. Juli 1975 zur Wiedereinführung
    des Zollsatzes für bestimmtes Leder aus Häuten oder Fellen von anderen Tieren,
    ausgenommen Leder der Tarifnummern 41.06 bis 41.08, der Tarifstelle 41.05 B II,
    mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates
    vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1939/75 af 28. juli 1975 om genindførelse
    af opkrævning af toldafgifter for forskellige læder af andre dyrehuder og dyreskind
    (undtagen varer, der henhører under pos. 41.06, 41.07 og 41.08) under underposition
    41.05 B II, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1939/75 della Commissione, del 28 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili ad alcune pelli preparate
    di altri animali, escluse quelle delle voci dal n. 41.06 al n. 41.08 incluso,
    della sottovoce doganale n. 41.05 B II, originarie della Iugoslavia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1939/75 van de Commissie van 28 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op ander leder
    en voorgelooide huiden en vellen, van andere dieren, met uitzondering van de produkten
    bedoeld bij de posten 41.06 tot en met 41.08, van onderverdeling 41.05 B II van
    oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 5054/74
    van de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
