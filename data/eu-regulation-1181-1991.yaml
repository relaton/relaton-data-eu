    σταφύλια, τα πεπόνια, τα βερίκοκα, τα ροδάκινα
    και τις φράουλες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1181/91 della Commissione, del 6 maggio 1991, che
    stabilisce modalità aggiuntive di applicazione del meccanismo complementare agli
    scambi (MCS) nel settore degli ortofrutticoli fra la Spagna e la Comunità nella
    sua composizione al 31 dicembre 1985 per quanto riguarda i pomodori, le lattughe,
    le cicorie scarole, le carote, i carciofi, le uve da tavola, i meloni, le albicocche,
    le pesche e le fragole
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1181/91 van de Commissie van 6 mei 1991 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer (ARH) in de sector groenten en fruit tussen Spanje en de Gemeenschap
    in haar samenstelling op 31 december 1985, ten aanzien van tomaten, sla, andijvie,
    wortelen, artisjokken, tafeldruiven, meloenen, abrikozen, perziken en aardbeien
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1181/91 da Comissão, de 6 de Maio de 1991, que fixa
    determinadas normas adicionais para a execução do mecanismo complementar aplicável
    às trocas comerciais (MCT) no sector das frutas e produtos hortícolas entre
    Espanha e a Comunidade, na sua composição em 31 de Dezembro de 1985, no que
    diz respeito aos tomates, alfaces, chicórias escarolas, cenouras, alcachofras,
    uvas de mesa, melões, damascos, pêssegos e morangos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1181/91 de la Comisión, de 6 de mayo de 1991, por
    el que se fijan determinadas normas adicionales para la aplicación del mecanismo
    complementario aplicable a los intercambios (MCI) entre España y la Comunidad
    en su composición a 31 de diciembre de 1985 en el sector de las frutas y hortalizas,
    por lo que se refiere a los tomates, las lechugas, las escarolas, las zanahorias,
    las alcachofas, las uvas de mesa, los melones, los albaricoques, los melocotones
    y las fresas
