title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1181/91 of 6 May 1991 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to trade in fruit and vegetables between Spain and the Community as constituted
    on 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives, carrots,
    artichokes, table grapes, melons, apricots, peaches and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1181/91 de la Commission, du 6 mai 1991, fixant certaines
    modalités additionnelles pour l' application du mécanisme complémentaire aux
    échanges (MCE) dans le secteur des fruits et légumes entre l' Espagne et la
    Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les tomates,
    les laitues, les chicorées scaroles, les carottes, les artichauts, les raisins
    de table, les melons, les abricots, les pêches et les fraises
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1181/91 der Kommission vom 6. Mai 1991 mit zusätzlichen
    Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM) im Handel
    mit Tomaten, Salat, Endivie Eskariol, Karotten, Artischocken, Melonen, Aprikosen,
    Pfirsichen und Erdbeeren zwischen Spanien und der Gemeinschaft in ihrer Zusammensetzung
    am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1181/91 af 6. maj 1991 om visse yderligere
    gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen (SMS)
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985 inden
    for frugt- og grønsagssektoren, for så vidt angår tomater, salat, bredbladet
    endivie, gulerødder, artiskokker, druer til spisebrug, meloner, abrikoser, ferskner
    og jordbær
  type: main
- language: el
  script: Grek
