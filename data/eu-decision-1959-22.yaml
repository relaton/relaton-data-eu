  content: Décision n° 22-59 du 25 mars 1959 relative à l'institution d'une allocation
    spéciale temporaire tendant à aider les travailleurs des entreprises charbonnières
    de Belgique contraints à du chômage partiel collectif par manque de débouchés
    de l'entreprise
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 22/59 vom 25 März 1959 über die Gewährung einer besonderen,
    vorübergehenden finanziellen Hilfe für die Arbeiter des belgischen Kohlenbergbaus,
    die infolge Absatzschwierigkeiten allgemein zu Feierschichten gezwungen sind
  type: main
- language: it
  script: Latn
  content: Decisione N° 22-59 del 25 marzo 1959 relativa all'istituzione di una indennità
    temporanea, tendente ad aiutare i lavoratori delle imprese carboniere del Belgio
    costretti a disoccupazione parziale collettiva per mancanza di sbocchi dell'impresa
  type: main
- language: nl
  script: Latn
  content: Beschikking No. 22-59 van 25 maart 1959 met betrekking tot de instelling
    van een bijzondere tijdelijke toelage ter ondersteuning van de werknemers van
    de Belgische kolenmijnondernemingen, die wegens gebrek aan afzetmarkten van de
    onderneming collectief tot gedeeltelijke werkloosheid zijn gedwongen
