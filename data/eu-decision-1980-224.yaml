id: EUDecision1980224
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/224/EEC: Commission Decision of 29 January 1980 authorizing Ireland
    not to apply Community treatment to woven overcoats, raincoats and other coats,
    cloaks and capes, jackets and blazers, falling within subheading ex 61.02 B II
    of the Common Customs Tariff (category 15 B), originating in India and in free
    circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/224/CEE: Décision de la Commission, du 29 janvier 1980, autorisant
    l''Irlande à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes) et vestes tissés de la sous-position ex 61.02 B II du tarif
    douanier commun (catégorie 15 B), originaires de l''Inde et mis en libre pratique
    dans les autres Etats membres (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/224/EWG: Entscheidung der Kommission vom 29. Januar 1980, mit der Irland
    ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Mäntel, Umhänge und Jacken, aus Geweben, der Tarifstelle
    ex 61.02 B II des Gemeinsamen Zolltarifs (Kategorie 15 B) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/224/EØF: Kommissionens beslutning af 29. januar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage frakker, kapper og slag, jakker
    og blazere, vævede, som henhører under pos. ex 61.02 B II i den fælles toldtarif
    (kategori 15 B), har oprindelse i Indien og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/224/CEE: Decisione della Commissione, del 29 gennaio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i cappotti, soprabiti, mantelli
    e simili, e giacche, tessuti, della sottovoce ex 61.02 B II della tariffa doganale
    comune, categoria 15 B, originari dell''India e messi in libera pratica negli
    altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/224/EEG: Beschikking van de Commissie van 29 januari 1980 waarbij Ierland
    wordt gemachtigd mantels, regenjassen en capes daaronder begrepen, blazers en
    jasjes, geweven, van post ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 15 B), van oorsprong uit India en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Engelse taal is authentiek)'
  type: main
