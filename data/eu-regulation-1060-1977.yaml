title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1060/77 of 18 May 1977 re-establishing the
    levying of the customs duties on plaiting materials (other than products falling
    within heading No 46.01) bound together in parallel strands etc., falling within
    heading No 46.02, originating in South Korea to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1060/77 de la Commission, du 18 mai 1977 , portant
    rétablissement de la perception des droits de douane applicables aux matières
    à tresser tissées à plat ou parallélisées, etc., de la position tarifaire
    46.02, originaires de la Corée du Sud bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1060/77 der Kommission vom 18. Mai 1977 zur Wiedereinführung
    des Zollsatzes für Flechtstoffe, in Flächenform verwebt oder parallel aneinandergefügt,
    usw., der Tarifnummer 46.02, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1060/77 af 18. maj 1977 om genindførelse
    af opkrævning af toldafgifter for flettematerialer i pladeform, sammenbundne
    eller vævede etc., under position 46.02, som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1060/77 della Commissione, del 18 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai materiali da intreccio
    tessuti o parallelizzati, ecc., della voce doganale 46.02, originari della Corea
    del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1060/77 van de Commissie van 18 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op vlechtstoffen,
    vlak geweven of samengebonden, enz., van post 46.02, van oorsprong uit Zuid-Korea
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
