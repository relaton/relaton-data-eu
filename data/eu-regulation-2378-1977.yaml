title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2378/77 of 28 October 1977 amending Regulations
    (EEC) No 368/77 and (EEC) No 443/77 on the sale of skimmed-milk powder from public
    stocks for use in feed for pigs and poultry and laying down special detailed rules
    for sales during November 1977
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2378/77 de la Commission, du 28 octobre 1977, modifiant
    les règlements (CEE) n° 368/77 et (CEE) n° 443/77 relatifs à la vente de lait
    écrémé en poudre de stock public destiné à l' alimentation des porcs et des
    volailles et portant une modalité particulière pour les ventes effectuées au
    mois de novembre 1977
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2378/77 der Kommission vom 28. Oktober 1977 zur Änderung
    der Verordnungen (EWG) Nr. 368/77 und (EWG) Nr. 443/77 über den Verkauf von Magermilchpulver
    aus öffentlicher Lagerhaltung für Schweine und Geflügel und über eine Sonderbestimmung
    für die Verkäufe im November 1977
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2378/77 af 28. oktober 1977 om ændring
    af forordning (EØF) nr. 368/77 og (EØF) nr. 443/77 om salg fra offentlige lagre
    af skummetmælkspulver til svine- og fjerkræfoder og om særlig fremgangsmåde
    ved salg i november 1977
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2378/77 della Commissione, del 28 ottobre 1977, che
    modifica i regolamenti (CEE) n. 368/77 e (CEE) n. 443/77, relativi alla vendita
    di latte scremato in polvere d' ammasso pubblico destinato all' alimentazione
    dei suini e del pollame, e che stabilisce modalità particolari per le vendite
    effettuate nel mese di novembre 1977
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2378/77 van de Commissie van 28 oktober 1977 tot
    wijziging van de Verordeningen (EEG) nr. 368/77 en (EEG) nr. 443/77 met betrekking
    tot de verkoop van magere-melkpoeder bestemd voor voeder voor varkens en pluimvee,
    en houdende een bijzondere bepaling voor de verkopen in november 1977
  type: main
