title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2699/70 of the Commission of 30 December 1970 widening
    the scope of Regulation (EEC) No 2232/70 on private storage aid for table wines
    which stand in close economic relationship with the R I and A I types of table
    wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2699/70 de la Commission, du 30 décembre 1970, élargissant
    le champ d' application du règlement (CEE)" n° 2232/70 relatif aux aides au
    stockage pour des vins de table se trouvant dans une relation économique étroite
    avec les vins de table des types R I et A I
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2699/70 der Kommission vom 30. Dezember 1970 zur Erweiterung
    des Anwendungsbereichs der Verordnung (EWG) Nr. 2232/70 über die Beihilfen für
    die private Lagerhaltung für Tafelweine, die in enger wirtschaftlicher Beziehung
    zu den Tafelweinarten R I und A I stehen
  type: main
- language: da
  script: Latn
  content: ommissionens forordning (EØF) nr. 2699/70 af 30. december 1970 om udvidelse
    af anvendelsesområdet for forordning (EØF) nr. 2232/70 om støtte til privat
    oplagring af bordvine, der har nær økonomisk forbindelse med bordvinstyperne
    R I og A I
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2699/70 della Commissione, del 30 dicembre 1970, che
    estende il campo d' applicazione del regolamento (CEE) n. 2232/70 relativo agli
    aiuti al magazzinaggio privato per vini da pasto che si trovano in stretta relazione
    economica con i vini da pasto dei tipi R I ed A I
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2699/70 van de Commissie van 30 december 1970 houdende
    uitbreiding van het toepassingsgebied van Verordening (EEG) nr. 2232/70 betreffende
    de steun aan de particuliere opslag voor tafelwijn die in nauw economisch verband
    staat met tafelwijn van de soorten R I en A I
  type: main
