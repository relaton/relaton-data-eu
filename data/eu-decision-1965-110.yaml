  content: Décision 65/110/CEE du Conseil du 10 février 1965, portant suspension
    partielle des droits du Tarif douanier commun applicables à l'essence de térébenthine
    et aux autres produits de la position 38.07 ainsi qu'aux colophanes de la position
    38.08 A
  type: main
- language: de
  script: Latn
  content: '65/110/EWG: Entscheidung des Rates vom 10. Februar 1965 über die teilweise
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Balsamterpentinöl und
    die übrigen Erzeugnisse der Tarifnummer 38.07 sowie für Kolophonium der Tarifnummer
    38.08 A'
  type: main
- language: it
  script: Latn
  content: '65/110/CEE: Decisione del Consiglio, del 10 febbraio 1965, relativa alla
    sospensione parziale dei dazi della tariffa doganale comune applicabili all''essenza
    di trementina ed agli altri prodotti della voce 38.07 nonché alle colofonie della
    voce 38.08 A'
  type: main
- language: nl
  script: Latn
  content: '65/110/EEG: Beschikking van de Raad van 10 februari 1965 houdende gedeeltelijke
    schorsing van de rechten van het gemeenschappelijk douanetarief voor terpentijnolie
    en de overige produkten van tariefpost 38.07 enerzijds en voor vioolhars van tariefpost
    38.08 A anderzijds'
