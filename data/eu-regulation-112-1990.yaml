title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 112/90 of 16 January 1990 imposing a definitive
    anti-dumping duty on imports of certain compact disc players originating in Japan
    and the Republic of Korea and collecting definitively the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 112/90 du Conseil du 16 janvier 1990 instituant un
    droit antidumping définitif sur les importations de certains lecteurs de disques
    compacts originaires du Japon et de la République de Corée, et portant perception
    définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 112/90 DES RATES vom 16. Januar 1990 zur Einfuehrung
    eines endgueltigen Antidumpingzolls auf die Einfuhren bestimmter CD-Spieler mit
    Ursprung in Japan und der Republik Korea und zur endgueltigen Vereinnahmung des
    vorlaeufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 112/90 af 16. januar 1990 om indførelse
    af en endelig antidumpingtold på importen af visse CD-afspillere med oprindelse
    i Japan og Republikken Korea og om endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 112/90 της 16ης Ιανουαρίου
    1990 για την επιβολή του οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές συσκευών αναπαραγωγής του ήχου
    με σύστημα οπτικής ανάγνωσης με ακτίνες λέιζερ
    καταγωγής Ιαπωνίας και Δημοκρατίας της Κορέας
    και για την οριστική είσπραξη του προσωρινού
    δασμού
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 112/90 DEL CONSIGLIO del 16 gennaio 1990 che istituisce
    un dazio antidumping definitivo sulle importazioni di alcuni tipi di lettori di
    dischi compact originari del Giappone e della Repubblica di Corea e riscuote definitivamente
    il dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 112/90 VAN DE RAAD van 16 januari 1990 tot instelling
    van een definitief anti-dumpingrecht op de invoer van bepaalde compact-discspelers
    van oorsprong uit Japan en de Republiek Korea en tot definitieve inning van het
    voorlopige recht
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 112/90 DO CONSELHO de 16 de Janeiro de 1990 que institui
    um direito anti-dumping definitivo sobre as importaçoes de certos leitores de
    discos compactos, originarias do Japao e da Republica da Coreia, e que determina
    a cobrança definitiva do direito provisorio
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 112/90 DEL CONSEJO de 16 de enero de 1990 por el que
    se establece un derecho antidumping definitivo sobre las importaciones de determinados
    reproductores de disco compacto originarios de Japon y de la Republica de Corea
    y se percibe definitivamente el derecho provisional
  type: main
