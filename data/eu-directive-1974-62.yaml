title:
- language: en
  script: Latn
  content: Council Directive 74/62/EEC of 17 December 1973 making a ninth amendment
    to the Directive on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 74/62/CEE du Conseil, du 17 décembre 1973, portant neuvième
    modification de la directive relative au rapprochement des législations des États
    membres concernant les agents conservateurs pouvant être employés dans les denrées
    destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 74/62/EWG des Rates vom 17. Dezember 1973 zur neunten Änderung
    der Richtlinie zur Angleichung der Rechtsvorschriften der Mitgliedstaaten für
    konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 74/62/EØF af 17. december 1973 om den niende ændring
    af direktivet om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 74/62/ΕΟΚ του Συμβουλίου της 17ης Δεκεμβρίου
    1973 περί ενάτης τροποποιήσεως της οδηγίας περί
    προσεγγίσεως των νομοθεσιών των κρατών μελών
    σχετικά με τα συντηρητικά που επιτρέπεται
    να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 74/62/ETY, annettu 17 päivänä joulukuuta 1973,
    elintarvikkeissa sallittuja säilöntäaineita koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun direktiivin muuttamisesta yhdeksännen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 74/62/CEE del Consiglio, del 17 dicembre 1973, riguardante la
    nona modifica della direttiva relativa al ravvicinamento delle legislazioni degli
    Stati Membri sui conservativi che possono essere impiegati nelle derrate destinate
    all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 74/62/EEG van de Raad van 17 december 1973 houdende negende wijziging
    van de Richtlijn betreffende de aanpassing van de wetgevingen der Lid-Staten inzake
    conserveermiddelen die mogen worden gebruikt in voor menselijke voeding bestemde
    waren
  type: main
- language: pt
  script: Latn
  content: Directiva 74/62/CEE do Conselho, de 17 de Dezembro de 1973, que altera
    pela nona vez a Directiva relativa à aproximação das legislações dos Estados-Membros
    respeitantes aos conservantes que podem ser utilizados nos géneros destinados
    à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 74/62/CEE del Consejo, de 17 de diciembre de 1973, que modifica
    por novena vez la Directiva relativa a la aproximación de las legislaciones de
    los Estados Miembros sobre los agentes conservadores que pueden utilizarse en
    los productos destinados al consumo humano
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 74/62/EEG av den 17 december 1973 med den nionde ändringen
    av direktivet om tillnärmning av medlemsstaternas lagstiftning om konserveringsmedel
    som är godkända för användning i livsmedel
  type: main
