    dispositions de la directive 2000/29/CE du Conseil en ce qui concerne le bois
    de frêne originaire des États-Unis d'Amérique ou transformé aux États-Unis
    d'Amérique, et abrogeant la décision d'exécution (UE) 2017/204 de la Commission
