    μέτρων τα οποία αφορούν τους κατόχους συμφωνητικών
    μακροπρόθεσμης αποθεματοποίησης επιτραπέζιων
    οίνων για την περίοδο εμπορίας 1988/89
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2750/89 DELLA COMMISSIONE del 12 settembre 1989 relativo
