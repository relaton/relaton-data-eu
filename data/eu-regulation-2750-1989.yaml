  content: Commission Regulation (EEC) No 2750/89 of 12 September 1989 implementing
    additional measures applicable to holders of long-term storage contracts for table
    wine for the 1988/89 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2750/89 de la Commission du 12 septembre 1989 mettant
