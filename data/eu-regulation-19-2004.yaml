    έβδομη φορά τον κανονισμό (ΕΚ) αριθ. 881/2002 του
    Συμβουλίου για την επιβολή συγκεκριμένων περιοριστικών
    μέτρων κατά ορισμένων προσώπων και οντοτήτων
