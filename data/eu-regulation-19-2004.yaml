    henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista toimenpiteistä
    sekä neuvoston asetuksen (EY) N:o 467/2001 kumoamisesta annetun neuvoston asetuksen
    (EY) N:o 881/2002 muuttamisesta 27. kerran
  type: main
- language: it
  script: Latn
