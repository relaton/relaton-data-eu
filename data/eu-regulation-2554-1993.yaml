    por el que se modifica el derecho antidumping definitivo aplicable a las importaciones
    de rodamientos de bolas cuyo mayor diámetro exterior sea superior a 30 mm., originarios
    de Japón, establecido mediante el Reglamento (CEE) n° 1739/85
  type: main
- language: sv
  script: Latn
