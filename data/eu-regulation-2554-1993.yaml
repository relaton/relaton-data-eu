title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2554/93 of 13 September 1993 repealing Article
    1 (4) of Regulation (EEC) No 2849/92 modifying the definitive anti-dumping duty
    on imports of ball bearings with a greatest external diameter exceeding 30 mm
    originating in Japan imposed by Regulation (EEC) No 1739/85
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2554/93 du Conseil du 13 septembre 1993 abrogeant
    le paragraphe 4 de l'article 1er du règlement (CEE) n° 2849/92 modifiant le
    droit antidumping définitif institué par le règlement (CEE) n° 1739/85 sur
    les importations de roulements à billes originaires du Japon dont le plus grand
    diamètre extérieur excède 30 millimètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2554/93 des Rates vom 13. September 1993 über die
    Aufhebung von Artikel 1 Absatz 4 der Verordnung (EWG) Nr. 2849/92 zur Änderung
    des durch die Verordnung (EWG) Nr. 1739/85 eingeführten endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter Kugellager mit einem größten äußeren Durchmesser
    von mehr als 30 mm mit Ursprung in Japan
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EØF) Nr. 2554/93 af 13. september 1993 om ophævelse
    af artikel 1, stk. 4, i forordning (EØF) nr. 2849/92 om ændring af den ved forordning
    (EØF) nr. 1739/85 indførte endelige antidumpingtold på importen af kuglelejer
    med største udvendige diameter på over 30 mm med oprindelse i Japan
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2554/93 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 13ης Σεπτεμβρίου 1993 για την κατάργηση του
    άρθρου 1 παράγραφος 4 του κανονισμού (ΕΟΚ) αριθ.
    2849/92 περί τροποποιήσεως του οριστικού δασμού
    αντιντάμπινγκ κατά τις εισαγωγές ένσφαιρων
    τριβέων (ρουλεμάν με σφαιρίδια) με μέγιστη
    εξωτερική διάμετρο υπερβαίνουσα τα 30 χιλιοστά,
    καταγωγής Ιαπωνίας, που έχει επιβληθεί με τον
    κανονισμό (ΕΟΚ) αριθ. 1739/85
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2554/93, annettu 13 päivänä syyskuuta 1993,
    Japanista peräisin olevien kuulalaakerien, joiden suurin ulkohalkaisija on yli
    30 millimetriä, tuonnissa asetuksella (ETY) N:o 1739/85 käyttöön otetun lopullisen
    polkumyyntitullin muuttamisesta annetun asetuksen (ETY) N:o 2849/92 1 artiklan
    4 kohdan kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2554/93 del Consiglio del 13 settembre 1993 che abroga
    l'articolo 1, paragrafo 4 del regolamento (CEE) n. 2849/92, che modifica il dazio
    antidumping definitivo sulle importazioni di cuscinetti a sfera con diametro esterno
    massimo superiore a 30 mm, originari del Giappone, imposto dal regolamento (CEE)
    n. 1739/85
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2554/93 van de Raad van 13 september 1993 tot intrekking
    van artikel 1, lid 4, van Verordening (EEG) nr. 2849/92 tot wijziging van het
    bij Verordening (EEG) nr. 1739/85 ingestelde definitieve anti-dumpingrecht op
    de invoer in de Gemeenschap van kogellagers met een grootste uitwendige diameter
    van meer dan 30 mm, van oorsprong uit Japan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2554/93 do Conselho de 13 de Setembro de 1993 que
    revoga o nº 4 do artigo 1o do Regulamento (CEE) nº 2849/92, que altera o direito
    anti- dumping definitivo, instituído pelo Regulamento (CEE) nº 1739/85, sobre
    as importações de rolamentos de esferas cujo maior diâmetro exterior excede
    30 mm, originários do Japão
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2554/93 del Consejo de 13 de septiembre de 1993 por
