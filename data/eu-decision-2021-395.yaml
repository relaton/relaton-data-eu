    απόφασης (ΕΕ) 2020/668 όσον αφορά τα εναρμονισμένα
    πρότυπα σχετικά με τις ηλεκτροστατικές ιδιότητες
    της προστατευτικής ενδυμασίας, της προστατευτικής
    ενδυμασίας για πυροσβέστες και οδηγούς μοτοσικλετών,
    της προστατευτικής ενδυμασίας για χρήση στο
    άθλημα της χιονοσανίδας και της προστατευτικής
    ενδυμασίας για χειριστές εφαρμογής παρασιτοκτόνων
    και για εργαζόμενους που ενδέχεται να έρθουν
    σε επαφή με αυτά, του εξοπλισμού ενισχυμένης
    ορατότητας για καταστάσεις μεσαίου κινδύνου,
    του εξοπλισμού ορειβασίας και της προστατευτικής
    ενδυμασίας έναντι των θερμικών κινδύνων από
    το ηλεκτρικό τόξο
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/395, 4. märts 2021, millega muudetakse
    rakendusotsust (EL) 2020/668 harmoneeritud standardite osas, mis käsitlevad kaitseriietuse
    elektrostaatilisi omadusi, tuletõrjujate ja mootorratturite kaitserõivaid, lumelauaga
    sõitmiseks kasutatavat kaitseriietust, pestitsiidide käitlejate ja pestitsiididega
    töödeldud alale naasvate töötajate kaitseriietust, parema nähtavusega varustust
    keskmise riskiga olukordades, mägironimisvarustust ja elektrikaare termilise
    ohu kaitseriietust
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/395, annettu 4 päivänä
    maaliskuuta 2021, täytäntöönpanopäätöksen (EU) 2020/668 muuttamisesta niiden
    yhdenmukaistettujen standardien osalta, jotka koskevat suojavaatetuksen sähköstaattisia
    ominaisuuksia, palomiesten ja moottoripyöräilijöiden suojavaatetusta, lumilautailussa
    käytettävää suojavaatetusta, nestemäisiä torjunta-aineita käsittelevien
    sekä torjunta-aineilla käsitellyllä alueella työskentelevien työntekijöiden
    suojavaatteita, näkyvyyttä lisääviä tuotteita käyttötarkoituksiin, joihin
    liittyy keskinkertainen riski, seikkailuratojen välineitä ja suojavaatetusta
    valokaaren termisiltä vaaroilta suojautumiseksi
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2021/395 ón gCoimisiún an 4 Márta 2021
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2020/668 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe maidir le hairíonna leictreastatacha éadaí cosanta,
    éadaí cosanta do chomhraiceoirí dóiteáin agus tiománaithe gluaisrothar,
    éadaí cosanta atá le húsáid sa chlársciáil agus a chaitheann oibreoirí
    a chuireann lotnaidicídí amach, éadaí cosanta d’oibrithe athiontrála, trealaimh
    infheictheachta feabhsaithe le haghaidh cásanna meánriosca, trealaimh sléibhteoireachta
    agus éadaí cosanta ar na guaiseanna teirmeacha a bhaineann le stua leictreach
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/395 оd 4. ožujka 2021. o izmjeni
    Provedbene odluke (EU) 2020/668 u pogledu usklađenih normi za elektrostatička
    svojstva zaštitne odjeće, zaštitnu odjeću za vatrogasce i vozače motocikala,
    zaštitnu odjeću za daskanje na snijegu, zaštitnu odjeću koju nose radnici
    koji primjenjuju pesticide i radnici koji ulaze u tretirano područje, opremu
    pojačane vidljivosti za situacije srednjeg rizika, planinarsku opremu i zaštitnu
    odjeću protiv toplinskih opasnosti od električnog luka
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/395 végrehajtási határozata (2021. március 4.)
    az (EU) 2020/668 végrehajtási határozatnak a védőruházatok elektrosztatikus
    tulajdonságaira, a tűzoltók és motorkerékpárosok védőruházatára, a snowboardozáshoz
    használandó védőruházatra, a peszticideket alkalmazó és újra belépő
    munkavállalók által viselt védőruházatra, a közepes kockázatú helyzetekben
    alkalmazandó továbbfejlesztett láthatósági eszközökre, a hegymászó felszerelésekre
    és az elektromos ív hőhatásai elleni védőruházatra vonatkozó harmonizált
    szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/395 della Commissione del 4 marzo 2021
    che modifica la decisione di esecuzione (UE) 2020/668 per quanto riguarda le norme
    armonizzate sulle proprietà elettrostatiche degli indumenti di protezione, sugli
    indumenti di protezione per vigili del fuoco e sugli indumenti protettivi per
    motociclisti, sugli indumenti di protezione per l’utilizzo nello snowboard,
    sugli indumenti di protezione indossati da operatori che applicano prodotti pesticidi
    e lavoratori esposti a questi pesticidi applicati, sull’attrezzatura di visibilità
    migliorata per situazioni a medio rischio, sull’attrezzatura per alpinismo e
    sugli indumenti di protezione contro i pericoli termici da arco elettrico
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/395 (2021. gada 4. marts), ar
    ko Īstenošanas lēmumu (ES) 2020/668 groza attiecībā uz saskaņotajiem standartiem
    par aizsargapģērba elektrostatiskajām īpašībām, ugunsdzēsēju un motociklistu
    aizsargapģērbu, aizsargapģērbu, ko izmanto braukšanai ar sniegadēli un pesticīdu
    lietotāji un darbinieki, kas pakļauti pesticīdu iedarbībai, uzlabotas redzamības
    apģērbu vidējas bīstamības situācijās, alpīnisma inventāru un aizsargapģērbu
    pret elektriskā loka termisko bīstamību
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/395 2021 m. kovo 4 d. kuriuo
    iš dalies keičiamos Įgyvendinimo sprendimo (ES) 2020/668 nuostatos dėl apsauginės
    aprangos elektrostatinių savybių, ugniagesių ir motociklininkų apsauginės
    aprangos, snieglenčių sportui skirtos apsauginės aprangos, su pesticidais dirbančių
    operatorių ir apdorotoje zonoje dirbančių darbuotojų aprangos, gerai matomų
    priemonių, skirtų vidutiniškai rizikingoms situacijoms, alpinizmo įrangos
    ir apsauginės aprangos nuo šiluminio pavojaus, kurį sukelia elektros lankas,
    darniųjų standartų
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/395 tal-4
    ta’ Marzu 2021 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2020/668
    fir-rigward tal-istandards armonizzati dwar il-proprjetajiet elettrostatiċi tal-ilbies
    protettiv, tal-ilbies protettiv għall-ħaddiema tat-tifi tan-nar u għar-rikkieba
    tal-muturi, tal-ilbies protettiv li jintuża fis-snowboarding u tal-ilbies li
    jintlibes mill-operaturi li jitfgħu l-pestiċidi u mill-ħaddiema li jerġgħu
    jidħlu fiż-żona fejn ikunu ntefgħu l-pestiċidi, tat-tagħmir iktar viżibbli
    għal sitwazzjonijiet ta’ riskju medju, tat-tagħmir tal-alpiniżmu u tal-ilbies
    protettiv kontra l-perikli termali ta’ ark elettriku
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/395 van de Commissie van 4 maart 2021 tot
    wijziging van Uitvoeringsbesluit (EU) 2020/668 wat betreft geharmoniseerde normen
    voor elektrostatische eigenschappen van beschermende kleding, beschermende kleding
    voor brandweerlieden en motorrijders, beschermende kleding voor gebruik bij snowboarden
    en voor gebruik door personen die machines bedienen voor het aanbrengen van pesticiden,
    waarschuwingskleding voor niet-professioneel gebruik, bergbeklimmersuitrusting
    en beschermende kleding tegen de thermische gevaren van een elektrische boog
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/395 z dnia 4 marca 2021 r. zmieniająca
    decyzję wykonawczą (UE) 2020/668 w odniesieniu do norm zharmonizowanych dotyczących
    właściwości elektrostatycznych odzieży ochronnej, odzieży ochronnej dla strażaków
    i motocyklistów, odzieży ochronnej dla snowboardzistów i odzieży ochronnej
    noszonej przez pracowników stosujących pestycydy i przez pozostałych pracowników
    mających z nimi kontakt, sprzętu o zwiększonej widzialności w sytuacjach o
    umiarkowanym ryzyku, sprzętu alpinistycznego oraz odzieży ochronnej przed zagrożeniami
    termicznymi spowodowanymi łukiem elektrycznym
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/395 da Comissão de 4 de março de 2021
    que altera a Decisão de Execução (UE) 2020/668 no que diz respeito às normas
    harmonizadas sobre propriedades eletrostáticas do vestuário de proteção, vestuário
    de proteção para bombeiros e motociclistas, vestuário de proteção para a
    prática de snowboard e utilizado pelos trabalhadores que aplicam pesticidas e
    pelos trabalhadores que voltam a entrar no espaço tratado com esses pesticidas,
    equipamento de visibilidade reforçada para situações de risco moderado, e vestuário
    de proteção contra os riscos térmicos do arco elétrico
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/395 a Comisiei din 4 martie 2021
    de modificare a Deciziei de punere în aplicare (UE) 2020/668 în ceea ce privește
    standardele armonizate pentru proprietățile electrostatice ale îmbrăcămintei
    de protecție, ale îmbrăcămintei de protecție pentru pompieri și pentru motocicliști,
    ale îmbrăcămintei de protecție pentru snowboarding, ale îmbrăcămintei de
    protecție purtate de lucrătorii care aplică pesticide și de lucrătorii expuși
    la pesticidele aplicate, ale echipamentelor cu vizibilitate sporită pentru situații
    de risc moderat, ale echipamentelor pentru alpinism și escaladare și ale îmbrăcămintei
    de protecție împotriva pericolelor termice ale unui arc electric
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/395 zo 4. marca 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2020/668, pokiaľ ide o harmonizované
    normy týkajúce sa elektrostatických vlastností ochranných odevov, ochranných
    odevov pre hasičov a motocyklistov, ochranných odevov na použitie pri snowboardingu
    a na nosenie pracovníkmi pracujúcimi s kvapalnými pesticídmi a pre pracovníkov
    vykonávajúcich následné činnosti, vybavenia so zvýšenou viditeľnosťou
    pre stredne rizikové situácie, horolezeckého vybavenia a ochranných odevov
    na ochranu pred tepelným ohrozením elektrickým oblúkom
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/395 z dne 4. marca 2021 o spremembi
    Izvedbenega sklepa (EU) 2020/668 glede harmoniziranih standardov o elektrostatičnih
    lastnostih varovalne obleke, zaščitni obleki za gasilce in varovalni obleki
    za voznike motornih koles, varovalni obleki za uporabo pri deskanju na snegu in
    varovalnem oblačilu, ki ga nosijo osebe, ki rokujejo s pesticidi, in delavci
    pri ponovnem vstopu na kontaminirano območje, opremi z izboljšano vidljivostjo
    za razmere s srednjim tveganjem, gorniški opremi in oblačilih za zaščito pred
    temperaturno nevarnostjo električnega obloka
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/395 de la Comisión de 4 de marzo de
    2021 por la que se modifica la Decisión de Ejecución (UE) 2020/668 en lo que
    respecta a las normas armonizadas sobre propiedades electrostáticas de las ropas
    de protección, ropa de protección para bomberos y para motociclistas, ropa de
    protección para snowboard, ropa de protección para operadores que aplican líquidos
    pesticidas y trabajadores expuestos a estos pesticidas aplicados, equipos de visibilidad
    realzada para situaciones de riesgo medio, equipos de alpinismo y escalada y ropa
    de protección contra los peligros térmicos de los arcos eléctricos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/395 av den 4 mars 2021 om ändring
    av genomförandebeslut (EU) 2020/668 vad gäller harmoniserade standarder för
    elektrostatiska egenskaper hos skyddskläder, skyddskläder för brandmän, motorcyklister
    och snowboardåkare, skyddskläder som används av personal som arbetar med att
    sprida bekämpningsmedel och av personal som arbetar i behandlade områden, kläder
    med god synbarhet för medelhög risk, klätterutrustning samt kläder för skydd
    mot termiska risker orsakade av ljusbågar
  type: main
