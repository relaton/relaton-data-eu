title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/395 of 4 March 2021 amending
    Implementing Decision (EU) 2020/668 as regards harmonised standards on electrostatic
    properties of protective clothing, protective clothing for firefighters and motorcycle
    riders, protective clothing for use in snowboarding and worn by operators applying
    pesticides and for re-entry workers, enhanced visibility equipment for medium
    risk situations, mountaineering equipment and protective clothing against the
    thermal hazards of an electric arc
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/395 de la Commission du 4 mars 2021
    modifiant la décision d’exécution (UE) 2020/668 en ce qui concerne les normes
    harmonisées relatives aux propriétés électrostatiques des vêtements de protection,
    aux vêtements de protection pour les sapeurs-pompiers et les motocyclistes, à
    l’habillement de protection destiné à la pratique du surf, aux vêtements
    de protection portés par les opérateurs appliquant des pesticides et pour les
    travailleurs de rentrée, à l’équipement de visualisation améliorée pour
    des situations à risque modéré, à l’équipement d’alpinisme et d’escalade
    et aux vêtements de protection contre les dangers thermiques d’un arc électrique
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/395 der Kommission vom 4. März 2021
    zur Änderung des Durchführungsbeschlusses (EU) 2020/668 hinsichtlich harmonisierter
    Normen für elektrostatische Eigenschaften von Schutzkleidung, Schutzkleidung
    für Feuerwehrleute und Motorradfahrer, Schutzkleidung für Snowboardfahrer sowie
    Schutzkleidung für Anwender von Pflanzenschutzmitteln sowie Personen für Nachfolgearbeiten,
    Ausrüstungen zur besseren Sichtbarkeit in Situationen mit mittlerem Risiko, Bergsteigerausrüstung
    und Schutzkleidung gegen die thermischen Gefahren eines elektrischen Lichtbogens
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2021/395 на Комисията
    от 4 март 2021 година за изменение на Решение
    за изпълнение (ЕС) 2020/668 по отношение на хармонизираните
    стандарти за електростатичните свойства на
    защитното облекло, за защитното облекло за
    пожарникари и мотоциклетисти, за защитното
    облекло за сноуборд, за защитното облекло,
    носено от оператори, използващи течни пестициди,
    и от работници, изложени на тяхното въздействие,
    за облеклото с повишена видимост за ситуации
    със сpеден pиск, за екипировката за алпинизъм
    и спортно катерене и за защитното облекло срещу
    опасност от топлина при електрическа дъга
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/395 ze dne 4. března 2021, kterým
    se mění prováděcí rozhodnutí (EU) 2020/668, pokud jde o harmonizované normy
    týkající se elektrostatických vlastností ochranných oděvů, ochranných
    oděvů pro hasiče a řidiče motocyklů, ochranných oděvů pro použití při
    snowboardingu a pro pracovníky aplikující pesticidy a pracovníky vstupující
    do prostoru ošetřeného pesticidy, ochranných oděvů se zvýšenou viditelností
    pro středně rizikové situace, horolezecké výstroje a ochranného oblečení
    proti tepelným účinkům elektrického oblouku
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/395 af 4. marts 2021
    om ændring af gennemførelsesafgørelse (EU) 2020/668 for så vidt angår harmoniserede
    standarder for elektrostatiske egenskaber for beskyttelsesbeklædning, beskyttelsesbeklædning
    til brandmænd og motorcyklister, beskyttelsesbeklædning, som anvendes af brugere
    af snowboards og beskyttelsestøj båret af sprøjteførere ved anvendelse af
    pesticider samt ved re-entry, beskyttelsesbeklædning med forøget synlighed til
    situationer med middel risiko, bjergbestigningsudstyr og beskyttelsesbeklædning
    mod termisk fare fra en elektrisk lysbue
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/395 της Επιτροπής
