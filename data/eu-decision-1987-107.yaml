title:
- language: en
  script: Latn
  content: Commission Decision of 19 December 1986 on the duty-free importation of
    goods intended to be distributed or made available free of charge to victims of
    the earthquake which occurred in September 1986 in the Hellenic Republic (Only
    the Greek text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 19 décembre 1986 relative à l'admission
    en franchise des droits à l'importation de marchandises destinées à être distribuées
    ou mises à la disposition gratuitement des victimes du tremblement de terre survenu
    en Grèce en septembre 1986 (Le texte en langue grecque est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Dezember 1986 über die Befreiung von
    Eingangsabgaben für bestimmte Waren, die an die von dem im September 1986 in
    Griechenland aufgetretenen Erdbeben betroffenen Opfer unentgeltlich verteilt oder
    ihnen unentgeltlich zur Verfügung gestellt werden sollen (Nur der griechische
    Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 19. december 1986 om fritagelse for told ved
    indførsel af varer, der er bestemt til gratis udlevering til eller gratis bliver
    stillet til rådighed for ofrene for jordskælvene i september 1986 i Den hellenske
    Republik (Kun den graeske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 19ης Δεκεμβρίου
    1986 περί εισαγωγής, με ατέλεια δασμών, των εμπορευμάτων
    τα οποία προορίζονται να διανεμηθούν ή να διατεθούν
    δωρεάν στα θύματα του σεισμού που έπληξε την
    Ελλάδα τον Σεπτέμβριο του 1986 (Το κείμενο στην
    ελληνική γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 19 dicembre 1986 relativa all'ammissione
    in franchigia dai diritti all'importazione di merci destinate ad essere distribuite
    o messe gratuitamente a disposizione delle vittime del terremoto avvenuto nella
    Repubblica ellenica nel settembre 1986 (Il testo in lingua greca è il solo facente
    fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 december 1986 betreffende de invoer
    met vrijstelling van rechten van goederen, bestemd om gratis te worden verstrekt
    of ter beschikking gesteld aan de slachtoffers van de in september 1986 voorgevallen
    aardbeving in de Helleense Republiek (Slechts de tekst in de Griekse taal is authentiek)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 19 de Dezembro de 1986 relativa à importação
    com franquia dos direitos de importação de mercadorias destinadas a serem distribuídas
    por ou postas à disposição, a título gratuito, das vítimas do tremor de terra
    ocorrido na Grécia em Setembro de 1986 (Apenas faz fé o texto em língua grega)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 19 de diciembre de 1986 relativa a la admisión
    con franquicia de derechos de importación de mercancías destinadas a ser distribuidas
    o puestas gratuitamente a disposición de las víctimas del terremoto que afectó
    a la República Helénica en septiembre de 1986 (El texto en lengua griega es
    el único auténtico)
