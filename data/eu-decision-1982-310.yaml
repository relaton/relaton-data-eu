title:
- language: en
  script: Latn
  content: '82/310/EEC: Commission Decision of 29 April 1982 amending Decision 81/713/EEC
    on the list of establishments in the Federative Republic of Brazil approved for
    the purpose of importing fresh beef and veal and meat of domestic solipeds into
    the Community'
  type: main
- language: fr
  script: Latn
  content: '82/310/CEE: Décision de la Commission, du 29 avril 1982, modifiant la
    décision 81/713/CEE relative à la liste des établissements de la République
    fédérative du Brésil agréés pour l''importation dans la Communauté de viandes
    fraîches bovines et de viandes de solipèdes domestiques'
  type: main
- language: de
  script: Latn
  content: '82/310/EWG: Entscheidung der Kommission vom 29. April 1982 zur Änderung
    der Entscheidung 81/713/EWG über die Liste der Betriebe der Föderativen Republik
    Brasilien, aus denen die Einfuhr von frischem Fleisch von Rindern und von Einhufern
    (Haustieren) in die Gemeinschaft zugelassen ist'
  type: main
- language: da
  script: Latn
  content: '82/310/EØF: Kommissionens beslutning af 29. april 1982 om ændring af
    beslutning 81/713/EØF om listen over de virksomheder i forbundsrepublikken Brasilien,
    der er godkendt til indførsel til Fællesskabet af fersk kød af kvæg og enhovede
    husdyr'
  type: main
- language: el
  script: Grek
  content: '82/310/EOK: Απόφαση τής Επιτροπής τής 29ης Απριλίου
    1982 περί τροποποιήσεως τής αποφάσεως 81/713/EOK
    σχετικά μέ τόν πίνακα τών εγκεκριμένων εγκαταστάσεων
    τής Ομοσπονδιακής Δημοκρατίας τής Βραζιλίας
    γιά τήν εισαγωγή, στήν Κοινότητα, νωπού βοείου
    κρέατος καί κρέατος κατοικιδίων μονόπλων'
  type: main
- language: it
  script: Latn
  content: '82/310/CEE: Decisione della Commissione, del 29 aprile 1982, recante modifica
    della decisione 81/713/CEE relativa alla lista degli stabilimenti della Repubblica
    federativa del Brasile in provenienza dai quali é autorizzata l'' importazione
    nella Comunità di carni fresche di bovini e di solipedi domestici'
  type: main
- language: nl
