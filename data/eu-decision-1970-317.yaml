title:
- language: en
  script: Latn
  content: '70/317/EEC: Commission Decision of 3 June 1970 authorizing the Grand-Duchy
    of Luxembourg to approve for marketing seed of Pseudotsuga menziesii (Mirb.) Franco.
    and Picea sitchensis Trautv. and Mey., satisfying less stringent requirements
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/317/CEE: Décision de la Commission, du 3 juin 1970, autorisant le
    grand-duché de Luxembourg à admettre à la commercialisation des semences de
    Pseudotsuga menziesii (Mirb.) Franco. et de Picea sitchensis Trautv. et Mey.,
    soumises à des exigences réduites (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '70/317/EWG: Entscheidung der Kommission vom 3. Juni 1970, mit der das
    Großherzogtum Luxemburg ermächtigt wird, Saatgut von Pseudotsuga menziesii (Mirb.)
    Franco. und von Picea sitchensis Trautv. und Mey. mit minderen Anforderungen zum
    gewerbsmäßigen Verkehr zuzulassen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '70/317/EØF: Kommissionens beslutning af 3. juni 1970 om bemyndigelse
    af storhertugdømmet Luxembourg til at tillade handel med frø af Pseudotsuga
    menziesii (Mirb.) Franco., og af Picea sitchensis Trautv. og Mey., der opfylder
    mindre strenge krav (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '70/317/CEE: Decisione della Commissione, del 3 giugno 1970, che autorizza
    il Granducato del Lussemburgo ad ammettere alla commercializzazione le sementi
    di Pseudotsuga menziesii (Mirb.) Franco. e di Picea sitchensis Trautv. e Mey.,
    sottoposte a requisiti ridotti. (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '70/317/EEG: Beschikking van de Commissie van 3 juni 1970 houdende machtiging
