title:
- language: en
  script: Latn
  content: Council Regulation ( EEC ) No 3893/91 of 17 December 1991 fixing, for 1992,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of a Member State, other than Spain and Portugal, in
    waters falling under the sovereignty of within the jurisdiction of the Portuguese
    Republic
  type: main
- language: fr
  script: Latn
  content: Règlement ( CEE ) n° 3893/91 du Conseil, du 17 décembre 1991, fixant,
    pour l' année 1992, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon d' un Etat membre, à l' exception
    de l' Espagne et du Portugal, dans les eaux relevant de la souveraineté ou de
    la juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung ( EWG ) Nr. 3893/91 des Rates vom 17. Dezember 1991 zur Festlegung
