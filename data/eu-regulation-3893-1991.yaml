    für Schiffe unter der Flagge eines Mitgliedstaats mit Ausnahme Spaniens und Portugals
    in den Gewässern unter der Hoheitsgewalt oder Gerichtsbarkeit Portugals für
    1992
  type: main
- language: da
  script: Latn
  content: Rådets forordning ( EØF ) nr. 3893/91 af 17. december 1991 om fastsættelse
