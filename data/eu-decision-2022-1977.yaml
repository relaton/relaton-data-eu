    i dess konstellation för handelsfrågor, inrättad genom associeringsavtalet
    mellan Europeiska unionen och Europeiska atomenergigemenskapen och deras medlemsstater,
    å ena sidan, och Ukraina, å andra sidan, vad gäller uppdateringen av bilaga
    XV (Tillnärmning av tullagstiftning) till det avtalet
