title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/1977 of 17 October 2022 on the position to be
    taken on behalf of the European Union within the EU-Ukraine Association Committee
    in Trade configuration established by the Association Agreement between the European
    Union and the European Atomic Energy Community and their Member States, of the
    one part, and Ukraine, of the other part, as regards the update of Annex XV (Approximation
    of customs legislation) to that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/1977 du Conseil du 17 octobre 2022 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité d’association
    UE-Ukraine dans sa configuration «Commerce» institué par l’accord d’association
    entre l’Union européenne et la Communauté européenne de l’énergie atomique
    et leurs États membres, d’une part, et l’Ukraine, d’autre part, en ce qui
    concerne la mise à jour de l’annexe XV (Rapprochement de la législation douanière)
    dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/1977 des Rates vom 17. Oktober 2022 über den im Namen
    der Europäischen Union in dem durch das Assoziierungsabkommen zwischen der Europäischen
    Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten einerseits
    und der Ukraine andererseits eingesetzten EU-Ukraine Assoziationsausschuss in
    der Zusammensetzung „Handel“ in Bezug auf die Aktualisierung von Anhang XV
    (Annäherung des Zollrechts) dieses Abkommens zu vertretende Standpunkt ist
  type: main
- language: bg
  script: Cyrl
