    ve složení pro obchod zřízeném Dohodou o přidružení mezi Evropskou unií
    a Evropským společenstvím pro atomovou energii a jejich členskými státy
    na jedné straně a Ukrajinou na straně druhé, pokud jde o aktualizaci přílohy
    XV (Sbližování celních předpisů) dohody
  type: main
