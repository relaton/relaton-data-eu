id: EUDecision2006169
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2006/169/EC: Commission Decision of 21 February 2006 amending Decision
    93/52/EEC as regards the declaration that Poland and certain provinces or regions
    of Italy are free of brucellosis ( B. melitensis ) and Decision 2003/467/EC as
    regards the declaration that certain provinces or regions of Italy are free of
    bovine tuberculosis, bovine brucellosis and enzootic bovine leucosis (notified
    under document number C(2006) 490)'
  type: main
- language: fr
  script: Latn
  content: '2006/169/CE: Décision de la Commission du 21 février 2006 modifiant
    la décision 93/52/CEE en ce qui concerne la déclaration selon laquelle la Pologne
    et certaines provinces ou régions d''Italie sont indemnes de brucellose ( B.
    melitensis ) et la décision 2003/467/CE en ce qui concerne la déclaration selon
    laquelle certaines provinces ou régions d''Italie sont indemnes de tuberculose
    bovine, de brucellose bovine et de leucose bovine enzootique [notifiée sous le
    numéro C(2006) 490]'
  type: main
- language: de
  script: Latn
  content: '2006/169/EG: Entscheidung der Kommission vom 21. Februar 2006 zur Änderung
    der Entscheidung 93/52/EWG hinsichtlich der Erklärung, dass Polen und bestimmte
    Provinzen oder Regionen Italiens frei von Brucellose ( B. melitensis ) sind, und
    der Entscheidung 2003/467/EG hinsichtlich der Erklärung, dass bestimmte Provinzen
    oder Regionen Italiens frei von Rindertuberkulose, Rinderbrucellose und enzootischer
    Rinderleukose sind (Bekannt gegeben unter Aktenzeichen K(2006) 490)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 21 февруари 2006 година
    за изменение на Решение 93/52/ЕИО по отношение
    на декларирането, че Полша и определени провинции
    или региони на Италия са свободни от бруцелоза
    (B. melitensis), и Решение 2003/467/ЕО по отношение на
    декларирането, че някои провинции или региони
    на Италия са свободни от туберкулоза, бруцелоза
    и ензоотична левкоза по говедата (нотифицирано
    под номер С(2006) 490)
  type: main
- language: cs
  script: Latn
  content: '2006/169/ES: Rozhodnutí Komise ze dne 21. února 2006 , kterým se mění
    rozhodnutí 93/52/EHS, pokud jde o prohlášení Polska a některých provincií
    nebo oblastí Itálie za prosté brucelózy ( B. melitensis ), a rozhodnutí 2003/467/ES,
    pokud jde o prohlášení některých provincií nebo oblastí Itálie za prosté
    tuberkulózy skotu, brucelózy skotu a enzootické leukózy skotu (oznámeno pod
    číslem K(2006) 490)'
  type: main
- language: da
  script: Latn
  content: '2006/169/EF: Kommissionens beslutning af 21. februar 2006 om ændring
    af beslutning 93/52/EØF for så vidt angår erklæringen om, at Polen og visse
    italienske provinser eller regioner er fri for brucellose ( B. melitensis ), og
    beslutning 2003/467/EF for så vidt angår erklæringen om, at visse italienske
    provinser eller regioner er fri for kvægtuberkulose, kvægbrucellose og enzootisk
    kvægleukose (meddelt under nummer K(2006) 490)'
  type: main
- language: el
  script: Grek
  content: '2006/169/ΕΚ: Απόφαση της Επιτροπής, της 21ης
    Φεβρουαρίου 2006 , για την τροποποίηση της απόφασης
