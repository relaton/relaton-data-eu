    Italian maakuntien ja alueiden julistamista luomistaudista ( Br. melitensis )
    vapaiksi ja päätöksen 2003/467/EY muuttamisesta siltä osin kuin se koskee
    tiettyjen Italian maakuntien ja alueiden julistamista nautojen tuberkuloosista,
