  script: Latn
  content: '2006/169/EZ: Odluka Komisije od 21. veljače 2006. o izmjeni Odluke 93/52/EEZ
    s obzirom na izjavu da su Poljska i određene pokrajine ili regije Italije slobodne
    od bruceloze ( B. melitensis ) i Odluke 2003/467/EZ s obzirom na izjavu da su
    određene pokrajine ili regije Italije slobodne od tuberkuloze, bruceloze i enzootske
    leukoze goveda (priopćena pod brojem dokumenta C(2006) 490)'
  type: main
- language: hu
  script: Latn
  content: '2006/169/EK: A Bizottság határozata ( 2006. február 21. ) a 93/52/EGK
    határozat Lengyelország és Olaszország egyes megyéinek és tartományainak
    brucellózismentessé ( B. melitensis ) nyilvánítása és a 2003/467/EK határozat
    Olaszország egyes megyéinek vagy tartományainak tuberkulózismentessé, brucellózismentessé
    és a szarvasmarhák enzootikus leukózisától mentessé nyilvánítása tekintetében
    történő módosításáról (az értesítés a C(2006) 490. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2006/169/CE: Decisione della Commissione, del 21 febbraio 2006 , che modifica
    la decisione 93/52/CEE riguardo alla dichiarazione che la Polonia e alcune province
    o regioni dell’Italia sono esenti da brucellosi ( B. melitensis ) e la decisione
    2003/467/CE riguardo alla dichiarazione che alcune province o regioni dell’Italia
    sono esenti da tubercolosi bovina, brucellosi bovina e leucosi bovina enzootica
    [notificata con il numero C(2006) 490]'
  type: main
- language: lv
  script: Latn
  content: '2006/169/EK: Komisijas Lēmums ( 2006. gada 21. februāris ), ar ko groza
    Lēmumu 93/52/EEK attiecībā uz Polijas un noteiktu Itālijas provinču vai reģionu
    atzīšanu par brīviem no brucelozes ( B. melitensis ) un Lēmumu 2003/467/EK
    attiecībā uz noteiktu Itālijas provinču vai reģionu atzīšanu par brīviem
    no govju tuberkulozes, govju brucelozes un govju enzootiskās leikozes (izziņots
    ar dokumenta numuru K(2006) 490)'
  type: main
- language: lt
  script: Latn
  content: '2006/169/EB: 2006 m. vasario 21 d. Komisijos sprendimas, iš dalies keičiantis
    Sprendimą 93/52/EEB dėl paskelbimo, kad Lenkijoje ir tam tikrose Italijos provincijose
    arba regionuose nenustatyta bruceliozės ( B. melitensis ), ir Sprendimą 2003/467/EB
    dėl paskelbimo, kad tam tikrose Italijos provincijose arba regionuose nenustatyta
    tuberkuliozės, bruceliozės ir enzootinės galvijų leukozės (pranešta dokumentu
    Nr. C(2006) 490)'
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni tal- 21 ta' Frar 2006 li temenda d-Deċiżjoni
    93/52/KEE fir-rigward tad-dikjarazzjoni li l-Polonja u ċerti provinċji jew reġjuni
    fl-Italja huma ħielsa mill-bruċellosi ( B. melitensis ) u d-Deċiżjoni 2003/467/KE
    fir-rigward ta' l-istqarrija li ċerti provinċji jew reġjuni ta' l-Italja huma
    ħielsa mit-tuberkolosi tal-bovini, il-bruċellosi bovina u l-lewkosi enzotika
    bovina (innotifikata taħt dokument numru C(2006) 490)
  type: main
- language: nl
  script: Latn
  content: '2006/169/EG: Beschikking van de Commissie van 21 februari 2006 tot wijziging
    van Beschikking 93/52/EEG wat betreft de verklaring dat Polen en bepaalde provincies
    of regio’s in Italië brucellosevrij ( B. melitensis ) zijn en tot wijziging
    van Beschikking 2003/467/EG wat betreft de verklaring dat bepaalde provincies
    of regio’s in Italië vrij zijn van rundertuberculose, runderbrucellose en enzoötische
    boviene leukose (Kennisgeving geschied onder nummer C(2006) 490)'
  type: main
- language: pl
  script: Latn
  content: '2006/169/WE: Decyzja Komisji z dnia 21 lutego 2006 r. zmieniająca decyzję
    93/52/EWG w odniesieniu do uznania Polski i niektórych prowincji lub regionów
    Włoch za wolne od brucelozy ( B. melitensis ) oraz decyzję 2003/467/WE w odniesieniu
    do uznania niektórych prowincji lub regionów Włoch za wolne od gruźlicy bydła,
    brucelozy bydła i enzootycznej białaczki bydła (notyfikowana jako dokument
    nr C(2006) 490)'
  type: main
- language: pt
  script: Latn
  content: '2006/169/CE: Decisão da Comissão, de 21 de Fevereiro de 2006 , que altera
    a Decisão 93/52/CEE no que se refere à declaração da Polónia e de determinadas
    províncias ou regiões de Itália como indemnes de brucelose ( B. melitensis
    ) e a Decisão 2003/467/CE no que se refere à declaração de determinadas províncias
    ou regiões de Itália como indemnes de tuberculose e brucelose bovinas e de leucose
    bovina enzoótica [notificada com o número C(2006) 490]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 21 februarie 2006 de modificare a Deciziei 93/52/CEE
    cu privire la declarația potrivit căreia Polonia și anumite provincii sau regiuni
    din Italia sunt indemne de bruceloză (B. melitensis) și a Deciziei 2003/467/CE
    cu privire la declarația potrivit căreia anumite provincii sau regiuni din Italia
    sunt indemne de tuberculoză bovină, bruceloză bovină și leucoză enzootică
    bovină [notificată cu numărul C(2006) 490]
  type: main
- language: sk
  script: Latn
  content: '2006/169/ES: Rozhodnutie Komisie z 21. februára 2006 , ktorým sa mení
    a dopĺňa rozhodnutie 93/52/EHS, pokiaľ ide o vyhlásenie, že Poľsko a niektoré
    provincie alebo regióny v Taliansku sú bez výskytu brucelózy ( B. melitensis
    ), a rozhodnutie 2003/467/ES, pokiaľ ide o vyhlásenie, že niektoré provincie
    alebo regióny v Taliansku sú bez výskytu tuberkulózy hovädzieho dobytka,
    brucelózy hovädzieho dobytka a enzootickej bovinnej leukózy [oznámené pod
    číslom K(2006) 490]'
  type: main
- language: sl
  script: Latn
  content: '2006/169/ES: Odločba Komisije z dne 21. februarja 2006 o spremembah Odločbe
    93/52/EGS v zvezi z razglasitivijo Poljske in nekaterih italijanskih pokrajin
    ali dežel kot prostih bruceloze ( B. melitensis ) in Odločbe 2003/467/ES v zvezi
    z razglasitvijo nekaterih italijanskih pokrajin ali dežel kot prostih tuberkuloze
    pri govedu, bruceloze pri govedu in enzootske levkoze pri govedu (notificirano
    pod dokumentarno številko C(2006) 490)'
  type: main
- language: es
  script: Latn
  content: '2006/169/CE: Decisión de la Comisión, de 21 de febrero de 2006 , por
