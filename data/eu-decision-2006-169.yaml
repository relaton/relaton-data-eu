    ορισμένες επαρχίες ή περιφέρειες της Ιταλίας
    είναι απαλλαγμένες από τη βρουκέλλωση (B. melitensis)
    και της απόφασης 2003/467/ΕΚ όσον αφορά τη δήλωση
    ότι ορισμένες επαρχίες ή περιφέρειες της Ιταλίας
    είναι απαλλαγμένες από τη φυματίωση, τη βρουκέλλωση
    και την ενζωοτική λεύκωση των βοοειδών [κοινοποιηθείσα
    υπό τον αριθμό Ε(2006) 490]'
  type: main
- language: et
  script: Latn
  content: '2006/169/EÜ: Komisjoni otsus, 21. veebruar 2006 , millega muudetakse
    otsust 93/52/EMÜ seoses Poola ja teatavate Itaalia provintside või maakondade
    ametlikult brutselloosivabaks ( B. melitensis ) tunnistamisega ning otsust 2003/467/EÜ
    seoses teatavate Itaalia provintside või maakondade ametlikult veiste tuberkuloosi,
    brutselloosi ja ensootilise leukoosi vabaks tunnistamisega (teatavaks tehtud numbri
    K(2006) 490 all)'
  type: main
