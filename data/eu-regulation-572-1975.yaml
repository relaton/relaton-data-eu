title:
- language: en
  script: Latn
  content: Regulation (EEC) No 572/75 of the Council of 3 March 1975 increasing the
    Community tariff quotas opened for 1975 by Regulation (EEC) No 2925/74 for certain
    textile products falling within heading Nos 55.05 and 55.09 and subheading ex
    58.01 A of the Common Customs Tariff, coming from Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 572/75 du Conseil, du 3 mars 1975, portant augmentation
    des volumes des contingents tarifaires communautaires ouverts, pour l'année 1975,
    par le règlement (CEE) n° 2925/74, pour certains produits textiles des positions
    55.05 et 55.09 et de la sous-position EX 58.01 A du tarif douanier commun, en
    provenance de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 572/75 des Rates vom 3. März 1975 zur Erhöhung der
    für 1975 mit der Verordnung (EWG) Nr. 2925/74 eröffneten Gemeinschaftszollkontingente
    für bestimmte Textilerzeugnisse der Tarifnummern 55.05 und 55.09 und der Tarifstelle
    ex 58.01 A des Gemeinsamen Zolltarifs mit Herkunft aus der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 572/75 af 3. marts 1975 om forhøjelse af
    de for året 1975 ved forordning (EØF) nr. 2925/74 åbnede fællesskabstoldkontingenter
    for visse tekstilvarer fra Tyrkiet henhørende under pos. 55.05, 55.09 og ex 58.01
    A i den fælles toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 572/75 del Consiglio, del 3 marzo 1975, che aumenta
    i volumi dei contingenti tariffari comunitari aperti, per l'anno 1975, con regolamento
    (CEE) n. 2925/74, per alcuni prodotti tessili delle voci 55.05 e 55.09 e della
    sottovoce ex 58.01 A della tariffa doganale comune, in provenienza dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 572/75 van de Raad van 3 maart 1975 houdende verhoging
    van de voor 1975 bij Verordening (EEG) nr. 2925/74 geopende communautaire tariefcontingenten
    voor bepaalde textielprodukten van de posten 55.05 en 55.09 en van onderverdeling
    ex 58.01 A van het gemeenschappelijk douanetarief, van herkomst uit Turkije
  type: main
