title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1365/82 of 2 June 1982 laying down standard
    rates for the financing, by the European Agricultural Guidance and Guarantee Fund,
    Guarantee Section, of expenditure resulting from the free distribution of products
    withdrawn from the market by producers' organizations, or bought in by the intervention
    agencies, in the fruit and vegetables sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1365/82 de la Commission, du 2 juin 1982, déterminant,
    de façon forfaitaire, le financement par le Fonds européen d' orientation et
    de garantie agricole, section "garantie", des dépenses résultant de la distribution
    gratuite des produits retirés du marché par les organisations de producteurs
    ou achetés par les organismes d' intervention dans le secteur des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1365/82 der Kommission vom 2. Juni 1982 zur Festlegung
    der vom Europäischen Ausrichtungs- und Garantiefonds für die Landwirtschaft,
    Abteilung Garantie, pauschal zu finanzierenden Ausgaben im Zusammenhang mit der
    kostenlosen Verteilung von Erzeugnissen des Obst- und Gemüsesektors, die von
    den Erzeugerorganisationen aus dem Markt genommen oder von den Interventionsstellen
    angekauft wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1365/82 af 2. juni 1982 om fastsættelse
    af faste satser for finansiering gennem Den europæiske udviklings- og garantifond
    for Landbruget, garantisektionen, af udgifter i forbindelse med gratis uddeling
    af frugt og grønsager, der er trukket tilbage fra markedet af producentorganisationerne
    eller opkøbt af interventionsorganerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1365/82 τής Επιτροπής
    τής 2ας Ιουνίου 1982 περί καθορισμού, κατ αποκοπή,
    τής χρηματοδοτήσεως από τό Ευρωπαϊκό Γεωργικό
    Ταμείο Προσανατολισμού καί Εγγυήσεων, τμήμα
    Εγγυήσεων, τών δαπανών πού προκύπτουν στόν
    τομέα τών οπωρολαχανικών από τή δωρεάν διανομή
    τών προϊόντων τά οποία αποσύρονται από τήν
    αγορά από τίς οργανώσεις παραγωγών ή αγοράζονται
    από τούς οργανισμούς παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1365/82 della Commissione, del 2 giugno 1982, che
    determina forfettariamente il finanziamento, da parte del Fondo europeo agricolo
    di orientamento e di garanzia, sezione "garanzia", delle spese per la distribuzione
    gratuita dei prodotti ritirati dal mercato dalle organizzazioni di produttori
    o acquistati dagli organismi d' intervento nel settore degli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1365/82 van de Commissie van 2 juni 1982 houdende
    voorschriften voor de forfaitaire financiering door het Europees Oriëntatie-
    en Garantiefonds voor de Landbouw, afdeling Garantie, van de uitgaven in verband
    met de gratis uitreiking van door de telersverenigingen uit de markt genomen of
    door de interventiebureaus aangekochte produkten in de sector groenten en fruit
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1365/82 da Comissão, de 2 de Junho de 1982, que
    determina as taxas-padrão para o financiamento, pelo Fundo Europeu de Orientação
    e Garantia Agrícola, Secção "Garantia", das despesas resultantes da distribuição
    gratuita dos produtos retirados do mercado pelas organizações de produtores
    ou comprados pelos organismos de intervenção no sector das frutas e produtos
    hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1365/82 de la Comisión, de 2 de junio de 1982, por
    el que se determina globalmente la financiación por el Fondo Europeo de Orientación
    y de Garantía Agrícola, sección "Garantía", de los gastos derivados de la
    distribución gratuita de los productos retirados del mercado por las organizaciones
    de productores o comprados por los organismos de intervención en el sector de
    las frutas y hortalizas
  type: main
