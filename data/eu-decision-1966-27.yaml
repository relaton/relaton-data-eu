title:
- language: fr
  script: Latn
  content: Décision 66/27/CEE de la Commission, du 15 décembre 1965, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/27/EWG: Entscheidung der Kommission vom 15. Dezember 1965 über die
    Inanspruchnahme von Artikel 115 Absatz (1) des Vertrages durch die Französische
    Republik, um bestimmte aus dritten Ländern stammende und in den anderen Mitgliedstaaten
    in den freien Verkehr gebrachte Erzeugnisse von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/27/CEE: Decisione della Commissione, del 15 dicembre 1965, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    al fine di escludere dal trattamento comunitario taluni prodotti originari di
    paesi terzi e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/27/EEG: Beschikking van de Commissie van 15 december 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag bepaalde produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
