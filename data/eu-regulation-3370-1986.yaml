  script: Latn
  content: Commission Regulation (EEC) No 3370/86 of 3 November 1986 re-establishing
    the levying of customs duties on other bovine cattle leather, falling within subheading
    41.02 ex C, originating in Uruguay, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3370/86 de la Commission du 3 novembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux autres cuirs
    et peaux de bovins de la sous-position 41.02 ex C du tarif douanier commun, originaires
    de l' Uruguay, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
