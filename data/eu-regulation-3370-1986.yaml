    ex C des Gemeinsamen Zolltarifs mit Ursprung in Uruguay, dem die in der Verordnung
    (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3370/86 af 3. november 1986 om genindførelse
