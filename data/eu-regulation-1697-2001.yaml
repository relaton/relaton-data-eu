title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1697/2001 of 27 August 2001 derogating from
    Council Regulation (EC) No 1251/1999 establishing a support system for producers
    of certain arable crops, as regards the area payments for certain arable crops
    and the payments for set-aside for the 2001/02 marketing year to producers in
    Portugal and to certain producers in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1697/2001 de la Commission du 27 août 2001 dérogeant
    au règlement (CE) n° 1251/1999 du Conseil, instituant un régime de soutien
    aux producteurs de certaines cultures arables, en ce qui concerne les paiements
    à la surface pour certaines cultures arables et les paiements au titre de gel
    de terre pour la campagne de commercialisation 2001/2002 aux producteurs du Portugal
    et à certains producteurs de l'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1697/2001 der Kommission vom 27. August 2001 zur Abweichung
    von der Verordnung (EG) Nr. 1251/1999 des Rates zur Einführung einer Stützungsregelung
    für Erzeuger bestimmter landwirtschaftlicher Kulturpflanzen hinsichtlich der
    Flächenzahlungen für bestimmte Kulturpflanzen und der Stilllegungsausgleichszahlungen
    für das Wirtschaftsjahr 2001/02 an die Erzeuger in Portugal und an bestimmte
    Erzeuger in Spanien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1697/2001 af 27. august 2001 om undtagelse
    fra Rådets forordning (EF) nr. 1251/1999 om indførelse af en støtteordning
    for producenter af visse markafgrøder for så vidt angår arealbetalingen for
    visse markafgrøder og betalingen for jordudtagning i produktionsåret 2001/02
    til producenterne i Portugal og til visse producenter i Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1697/2001 της Επιτροπής,
    της 27ης Αυγούστου 2001, για την παρέκκλιση από
    τον κανονισμό (ΕΚ) αριθ. 1251/1999 του Συμβουλίου,
    για τη θέσπιση καθεστώτος στήριξης των παραγωγών
    ορισμένων αροτραίων καλλιεργειών, όσον αφορά
    τις πληρωμές βάσει της έκτασης για ορισμένες
    αροτραίες καλλιέργειες και τις πληρωμές βάσει
    της προσωρινής παύσης της καλλιέργειας για
    την περίοδο εμπορίας 2001/02 στους παραγωγούς
    της Πορτογαλίας και σε ορισμένους παραγωγούς
    της Ισπανίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1697/2001, annettu 27 päivänä elokuuta 2001,
    tukijärjestelmästä tiettyjen peltokasvien viljelijöille annetusta neuvoston
    asetuksesta (EY) N:o 1251/1999 poikkeamisesta portugalilaisille viljelijöille
    ja joillekin espanjalaisille viljelijöille markkinointivuodelta 2001/2002 maksettavan
    eräiden peltokasvien pinta-alatuen sekä kesantokorvauksen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1697/2001 della Commissione, del 27 agosto 2001, recante
    deroga al regolamento (CE) n. 1251/1999 del Consiglio, che istituisce un regime
    di sostegno a favore dei coltivatori di taluni seminativi, per quanto riguarda
    i pagamenti per superficie per determinati seminativi e i pagamenti per il ritiro
    di seminativi dalla produzione per la campagna di commercializzazione 2001/2002
    ai produttori del Portogallo e a taluni produttori della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1697/2001 van de Commissie van 27 augustus 2001 houdende
    afwĳking van Verordening (EG) nr. 1251/1999 van de Raad tot instelling van een
    steunregeling voor producenten van bepaalde akkerbouwgewassen, ten aanzien van
    de areaalbetalingen voor bepaalde akkerbouwgewassen en van de betalingen voor
    braaklegging voor het verkoopseizoen 2001/2002 ten behoeve van de Portugese producenten
    en bepaalde Spaanse producenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1697/2001 da Comissão, de 27 de Agosto de 2001,
    que estabelece uma derrogação ao Regulamento (CE) n.° 1251/1999 do Conselho
    que institui um sistema de apoio aos produtores de determinadas culturas arvenses,
    no que diz respeito aos pagamentos por superfície para certas culturas arvenses
    e aos pagamentos por retirada de terras da produção para a campanha de comercialização
    de 2001/2002 aos produtores de Portugal e a certos produtores de Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1697/2001 de la Comisión, de 27 de agosto de 2001,
    por el que se establece una excepción al Reglamento (CE) n° 1251/1999 del Consejo,
    por el que se establece un régimen de apoyo a los productores de determinados
    cultivos herbáceos, en lo relativo a los pagos por superficie para determinados
    cultivos herbáceos y los pagos en concepto de retirada de tierras para la campaña
    de comercialización 2001/02 a los productores de Portugal y a determinados productores
    de España
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1697/2001 av den 27 augusti 2001 om undantag
    från rådets förordning (EG) nr 1251/1999 om upprättande av ett stödsystem
    för producenter av vissa jordbruksgrödor, när det gäller arealersättning
    för vissa jordbruksgrödor och ersättning för arealuttag under regleringsåret
    2001/2002 till producenter i Portugal och vissa producenter i Spanien
  type: main
