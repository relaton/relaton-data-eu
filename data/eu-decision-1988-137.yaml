title:
- language: en
  script: Latn
  content: '88/137/EEC: Commission Decision of 24 February 1988 allocating to Ireland
    resources to be charged to the 1988 budget year for the supply of food from intervention
    stocks to designated organizations for distribution to the most deprived persons
    in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/137/CEE: Décision de la Commission du 24 février 1988 allouant à
    l'' Irlande les crédits imputables à l'' exercice 1988 pour la fourniture de
    denrées alimentaires provenant des stocks d'' intervention à des organisations
    désignées pour les distribuer aux personnes les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/137/EWG: Entscheidung der Kommission vom 24. Februar 1988 über die
