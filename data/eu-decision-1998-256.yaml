title:
- language: en
  script: Latn
  content: '98/256/EC: Council Decision of 16 March 1998 concerning emergency measures
    to protect against bovine spongiform encephalopathy, amending Decision 94/474/EC
    and repealing Decision 96/239/EC'
  type: main
- language: fr
  script: Latn
  content: '98/256/CE: Décision du Conseil du 16 mars 1998 concernant certaines mesures
    d''urgence en matière de protection contre l''encéphalopathie spongiforme bovine,
    modifiant la décision 94/474/CE et abrogeant la décision 96/239/CE'
  type: main
- language: de
  script: Latn
  content: '98/256/EG: Entscheidung des Rates vom 16. März 1998 mit Dringlichkeitsmaßnahmen
    zum Schutz gegen die spongiforme Rinderenzephalopathie sowie zur Änderung der
    Entscheidung 94/474/EG und zur Aufhebung der Entscheidung 96/239/EG'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 16. března 1998 o mimořádných opatřeních
    k ochraně před bovinní spongiformní encefalopatií a o změně rozhodnutí
    94/474/ES a zrušení rozhodnutí 96/239/ES
  type: main
- language: da
  script: Latn
  content: '98/256/EF: Rådets beslutning af 16. marts 1998 om hasteforanstaltninger
    til beskyttelse mod bovin spongiform encephalopati, om ændring af beslutning
    94/474/EF og om ophævelse af beslutning 96/239/EF'
  type: main
- language: el
  script: Grek
  content: '98/256/ΕΚ: Απόφαση του Συμβουλίου της 16ης
    Μαρτίου 1998 σχετικά με επείγοντα μέτρα για προστασία
    από την σπογγώδη εγκεφαλοπάθεια των βοοειδών
    και σχετικά με την τροποποίηση της απόφασης
    94/474/ΕΚ και την κατάργηση της απόφασης 96/239/ΕΚ'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 16. märts 1998, erakorraliste kaitsemeetmete kohta veiste
    spongioosse entsefalopaatia suhtes ning otsuse 94/474/EÜ muutmise ja otsuse 96/239/EÜ
    kehtetuks tunnistamise kohta
  type: main
- language: fi
  script: Latn
  content: '98/256/CE: Neuvoston päätös, tehty 16 päivänä maaliskuuta 1998,
    tietyistä BSE:hen liittyvistä kiireellisistä suojatoimenpiteistä sekä päätöksen
    94/474/EY muuttamisesta ja päätöksen 96/239/EY kumoamisesta'
  type: main
- language: hu
  script: Latn
  content: A Tanács 98/256/EK határozata (1998. március 16.) a szarvasmarhák szivacsos
    agyvelőbántalma elleni sürgős intézkedésekről, a 94/474/EK határozat módosításáról
    és a 96/239/EK határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: '98/256/CE: Decisione del Consiglio del 16 marzo 1998 che stabilisce misure
    d''emergenza in materia di protezione contro l''encefalopatia spongiforme bovina,
    modifica la decisione 94/474/CE e abroga la decisione 96/239/CE'
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (1998. gada 16. marts) par ārkārtas pasākumiem aizsardzībai
    pret govju sūkļveida encefalopātiju, ar ko groza Lēmumu 94/474/EK un atceļ
    Lēmumu 96/239/EK
  type: main
- language: lt
  script: Latn
  content: 1998 m. kovo 16 d. Tarybos sprendimas dėl padarinių likvidavimo priemonių,
    siekiant apsisaugoti nuo galvijų spongiforminės encefalopatijos, iš dalies
    keičiantis Sprendimą 94/474/EB ir panaikinantis Sprendimą 96/239/EB
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tas-16 ta’ Marzu, 1998 rigward miżuri ta’
    emerġenza biex ikun hemm protezzjoni kontra l-enċefalopatija sponġiformi bovina,
    li temenda d-Deċiżjoni 94/474/KE u li tħassar id-Deċiżjoni 96/239/KE
  type: main
- language: nl
  script: Latn
  content: '98/256/EG: Beschikking van de Raad van 16 maart 1998 inzake spoedmaatregelen
    ter bescherming tegen boviene spongiforme encefalopathie, tot wijziging van Beschikking
    94/474/EG en tot intrekking van Beschikking 96/239/EG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 16 marca 1998 r. w sprawie środków nadzwyczajnych
    w celu ochrony przed gąbczastą encefalopatią bydła, zmieniająca decyzję
    94/474/WE i uchylająca decyzję 96/239/WE
  type: main
- language: pt
  script: Latn
  content: '98/256/CE: Decisão do Conselho de 16 de Março de 1998 relativa a determinadas
    medidas de emergência em matéria de protecção contra a encefalopatia espongiforme
    bovina, que altera a Decisão 94/474/CE e revoga a Decisão 96/239/CE'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady zo 16. marca 1998, ktoré sa týka mimoriadnych opatrení
    na ochranu proti spongiformnej encefalopatii dobytka, ktoré mení a dopĺňa
    rozhodnutie č. 94/474/ES a ruší rozhodnutie č. 96/239/ES
  type: main
- language: sl
  script: Latn
  content: Odločba Sveta z dne 16. marca 1998 o nujnih ukrepih za zaščito pred
    govejo spongiformno encefalopatijo, in o spremembi Odločbe 94/474/ES ter razveljavitvi
    Odločbe 96/239/ES
  type: main
- language: es
  script: Latn
  content: '98/256/CE: Decisión del Consejo de 16 de marzo de 1998 relativa a medidas
    de emergencia en materia de protección contra la encefalopatía espongiforme
    bovina y por la que se modifica la Decisión 94/474/CE y se deroga la Decisión
    96/239/CE'
  type: main
- language: sv
  script: Latn
  content: '98/256/CE: Rådets beslut av den 16 mars 1998 om nödåtgärder vad beträffar
    skydd mot bovin spongiform encefalopati, som ändrar beslut 94/474/EG och upphäver
    beslut 96/239/EG'
  type: main
