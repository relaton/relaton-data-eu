type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 August 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to jerseys, pullovers, slip-overs, twinsets, cardigans, bed-jackets
    and jumpers, knitted or crocheted, not elastic or rubberized, of wool, of cotton
    or of man-made textile fibres, falling within subheading ex 60.05 A (NIMEXE codes
    60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) of the Common Customs Tariff, originating
    in Czechoslovakia and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/729/CEE: Décision de la Commission, du 11 août 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chandails, "pullovers", "slip-overs",
    "twinsets", gilets, vestes de bonneterie non élastique ni caoutchoutée, de laine,
    de coton, de fibres synthétiques ou artificielles de la sous-position Ex 60.05
    à du Tarif douanier commun (codes Nimexe : 60.05-01; 27; 28; 29; 30; 33; 36;
    37; 38), originaires de Tchécoslovaquie et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. August 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen und dergleichen
    aus Gewirken, aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen
    (weder gummielastisch noch kautschutiert) der Tarifnummer ex 60.05 A des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 60.05-01; 27; 28; 29; 30; 33; 36; 37; 38) von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 11. august 1978 om bemyndigelse til kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage sweatere, pullovere, slipovere, cardigansæt, veste og trøjer, af
    uld, bomuld eller syntetiske eller regenererede fibre, som henhører under pos.
    ex 60.05 A (NIMEXE-kode 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) i den fælles
    toldtarif, har oprindelse i Tjekkoslovakiet og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, dell''11 agosto 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario maglie, pullover, slip-over, twinset, giubbotti, giacche
    e bluse, a maglia non elastica né gommata, di lana, di cotone o di fibre sintetiche
    od artificiali, della sottovoce ex 60.05 A della tariffa doganale comune (codice
    Nimexe: 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), originari della Cecoslovacchia
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 augustus 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd truien, jumpers, pull-overs en slip-overs, twinsets, vesten en jasjes
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, van wol, van katoen,
    of van synthetische of van kunstmatige textielvezels, van post ex 60.05 A van
    het gemeenschappelijk douanetarief (NIMEXE-code 60.05-01, 27, 28, 29, 30, 33,
    37, 38), van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
