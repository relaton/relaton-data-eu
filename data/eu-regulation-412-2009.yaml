    Tautas Republikas un Saūda Arābijas izcelsmes poliestera štāpeļšķiedru
    importam, ar kuru groza Regulu (EK) Nr. 2852/2000, ar ko piemēro galīgo antidempinga
    maksājumu un galīgi iekasē pagaidu maksājumu, kas piemērots par Indijas un
    Korejas Republikas izcelsmes poliestera štāpeļšķiedru importu, un ar kuru
    izbeidz antidempinga procedūru attiecībā uz Taivānas izcelsmes minētā produkta
    importu
  type: main
- language: lt
