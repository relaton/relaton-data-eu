    štapelio pluoštams, kurių kilmės šalys – Kinijos Liaudies Respublika ir
    Saudo Arabija, galutinį antidempingo muitą ir iš dalies keičiantį Reglamentą
    (EB) Nr. 2852/2000, įvedantį galutinį antidempingo muitą importuojamiems poliesterių
    štapelio pluoštams, kurių kilmės šalys – Indija ir Korėjos Respublika,
    ir nutraukiantį antidempingo procedūrą dėl tokio importo, kurio kilmės šalis
    yra Taivanas
  type: main
