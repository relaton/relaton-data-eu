title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 412/2009 of 18 May 2009 amending Regulation
    (EC) No 428/2005 imposing a definitive anti-dumping duty on imports of polyester
    staple fibres originating in the People’s Republic of China and Saudi Arabia,
    amending Regulation (EC) No 2852/2000 imposing a definitive anti-dumping duty
    on imports of polyester staple fibres originating in the Republic of Korea and
    terminating the anti-dumping proceeding in respect of such imports originating
    in Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 412/2009 du Conseil du 18 mai 2009 modifiant le règlement
    (CE) n o 428/2005 instituant un droit antidumping définitif sur les importations
    de fibres discontinues de polyesters originaires de la République populaire de
    Chine et d’Arabie saoudite, modifiant le règlement (CE) n o 2852/2000 instituant
    un droit antidumping définitif sur les importations de fibres discontinues de
    polyesters originaires de la République de Corée, et clôturant la procédure
    antidumping concernant Taïwan
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 412/2009 des Rates vom 18. Mai 2009 zur Änderung der
    Verordnung (EG) Nr. 428/2005 des Rates zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von Polyester-Spinnfasern mit Ursprung in der Volksrepublik
    China und Saudi-Arabien, zur Änderung der Verordnung (EG) Nr. 2852/2000 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Polyester-Spinnfasern
    mit Ursprung in der Republik Korea und zur Einstellung des Antidumpingverfahrens
    betreffend solcher Einfuhren mit Ursprung in Taiwan
  type: main
- language: bg
  script: Cyrl
