  script: Latn
  content: Uredba Vijeća (EZ) br. 412/2009 od 18. svibnja 2009. o izmjeni Uredbe
    (EZ) br. 428/2005 o uvođenju konačne antidampinške pristojbe na uvoz rezanih
    vlakana od poliestera podrijetlom iz Narodne Republike Kine i Saudijske Arabije,
    o izmjeni Uredbe (EZ) br. 2852/2000 o uvođenju konačne antidampinške pristojbe
    na uvoz rezanih vlakana od poliestera podrijetlom iz Republike Koreje i prekidu
    antidampinškog postupka u pogledu takvog uvoza podrijetlom iz Tajvana
  type: main
