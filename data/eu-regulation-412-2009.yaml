    definitivo sobre las importaciones de fibras sintéticas discontinuas de poliéster
    originarias de la República Popular China y de Arabia Saudí, por el que se modifica
    el Reglamento (CE) n o 2852/2000 por el que se establece un derecho antidumping
    definitivo sobre las importaciones de fibras sintéticas discontinuas de poliéster
    originarias de la República de Corea y por el que se da por concluido el procedimiento
    antidumping relativo a tales importaciones originarias de Taiwán
