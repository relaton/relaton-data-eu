  script: Latn
  content: A Tanács 412/2009/EK rendelete ( 2009. május 18. ) a Kínai Népköztársaságból
    és Szaúd-Arábiából származó poliészter vágott szálak behozatalára végleges
    dömpingellenes vám kivetéséről, valamint a Koreai Köztársaságból származó
    poliészter vágott szálak behozatalára végleges dömpingellenes vám kivetéséről
    szóló 2852/2000/EK rendelet módosításáról, továbbá a Tajvanról származó
    ilyen behozatalra vonatkozó dömpingellenes eljárás lezárásáról szóló
    428/2005/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 412/2009 del Consiglio, del 18 maggio 2009 , che modifica
    il regolamento (CE) n. 428/2005 che istituisce un dazio antidumping definitivo
    sulle importazioni di fibre di poliesteri in fiocco originarie della Repubblica
    popolare cinese e dell’Arabia Saudita, che modifica il regolamento (CE) n. 2852/2000,
    che istituisce un dazio antidumping definitivo sulle importazioni di fibre di
    poliesteri in fiocco originarie della Repubblica di Corea e che chiude il procedimento
    antidumping relativo alle importazioni di tale prodotto originarie di Taiwan
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 412/2009 ( 2009. gada 18. maijs ), ar kuru groza
