    мито върху вноса на полиестерни щапелни влакна
    с произход от Китайската народна република
    и Саудитска Арабия и за изменение на Регламент
    (ЕО) № 2852/2000 за налагане на окончателно антидъмпингово
    мито върху вноса на полиестерни щапелни влакна
    с произход от Република Корея и за прекратяване
    на антидъмпинговата процедура по вноса на
    такива продукти с произход от Тайван
  type: main
