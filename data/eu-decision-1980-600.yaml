id: EUDecision1980600
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/600/EEC: Commission Decision of 19 June 1980 accepting undertakings
    offered by the Chinese and Czechoslovak exporters in connection with the anti-dumping
    proceeding concerning imports of mechanical alarm clocks (other than travel alarms)
    originating in China, Czechoslovakia, the German Democratic Republic, Hong Kong
    and the USSR, terminating the proceeding in respect of China, Czechoslovakia and
    Hong Kong, and withdrawing acceptance of undertakings previously accepted by the
    United Kingdom Government from the exporters in the German Democratic Republic
    and the USSR'
  type: main
- language: fr
  script: Latn
  content: '80/600/CEE: Décision de la Commission, du 19 juin 1980, acceptant les
    engagements offerts par les exportateurs chinois et tchécoslovaques dans le contexte
    de la procédure anti-"dumping" concernant les importations de réveils et pendulettes-réveils
    mécaniques (autres que les réveils et pendulettes de voyage), originaires de
    Chine, de Tchécoslovaquie, de République démocratique allemande, de Hong-kong
    et d'' Union soviétique, clôturant la procédure à l'' égard de la Chine,
    de la Tchécoslovaquie et de Hong-kong et retirant l'' acceptation des engagements
    précédemment acceptés par le gouvernement du Royaume-Uni de la part des exportateurs
    de République démocratique allemande et d'' Union soviétique'
  type: main
- language: de
  script: Latn
  content: '80/600/EWG: Beschluß der Kommission vom 19. Juni 1980 über die Annahme
    von Verpflichtungen, die von den chinesischen und tschechoslowakischen Ausführern
    im Rahmen des Antidumpingverfahrens betreffenden Einfuhren von mechanischen Weckern
    (ausgenommen Reisewecker) und Uhren mit Weckerwerk mit Ursprung in China, der
    Tschechoslowakei, der Deutschen Demokratischen Republik, Hongkong und der UdSSR
    angeboten wurden, über die Einstellung des Verfahrens hinsichtlich Chinas, der
    Tschechoslowakei und Hongkongs und über die Kündigung der zuvor von der Regierung
    des Vereinigten Königreichs angenommenen Verpflichtungen der Ausführer der Deutschen
    Demokratischen Republik und der UdSSR'
  type: main
- language: da
  script: Latn
  content: '80/600/EØF: Kommissionens afgørelse af 19. juni 1980 om godtagelse af
    tilsagn i forbindelse med en antidumpingprocedure vedrørende mekaniske vækkeure
    (bortset fra rejseure) med oprindelse i Den tyske demokratiske Republik, Hongkong,
    Kina, Sovjetunionen og Tjekkoslovakiet og om ophævelse af en national antidumpingtold
    på mekaniske vækkeure med oprindelse i Den tyske demokratiske Republik, Hongkong,
    Kina, Sovjetunionen og Tjekkoslovakiet, om afslutning af proceduren for Hongkongs,
    Kinas og Tjekkoslovakiets vedkommende og om tilbagetrækning af godtagelsen af
    tilsagn fra eksportørerne i Den tyske demokratiske Republik og Sovjetunionen,
    der tidligere er godtaget af Det forenede Kongeriges regering'
  type: main
- language: it
  script: Latn
  content: '80/600/CEE: Decisione della Commissione, del 19 giugno 1980, che accetta
    gli impegni offerti dagli esportatori cinesi e cecoslovacchi in rapporto alla
    procedura antidumping relativa alle importazioni di sveglie e pendolette-sveglie
    meccaniche (diverse dalle sveglie da viaggio), originarie della Cina, della Cecoslovacchia,
    della Repubblicæ democratica tedesca, di Hong Kong e dell'' Unione Sovietica,
    che chiude la procedura nei confronti della Cina, della Cecoslovacchia e di Hong
    Kong e che annulla l'' accettazione degli impegni degli esportatori della Repubblica
    democratica tedesca e dell'' Unione Sovietica precedentemente accettati dal governo
    del Regno Unito'
  type: main
- language: nl
  script: Latn
  content: '80/600/EEG: Besluit van de Commissie van 19 juni 1980 houdende aanvaarding
    van de verbintenissen aangegaan door Chinese en Tsjechoslowaakse exporteurs in
    het kader van de anti-dumpingprocedure betreffende de invoer van mechanische wekkers
    (andere dan reiswekkers) van oorsprong uit China, Tsjechoslowakije, de Duitse
    Democratische Republiek, Hong-Kong en de USSR, houdende beëindiging van de procedure
    met betrekking tot China, Tsjechoslowakije en Hong-Kong en houdende intrekking
    van de aanvaarding van de voordien door de Regering van het Verenigd Koninkrijk
    aanvaarde verbintenissen aangegaan door de exporteurs in de Duitse Democratische
    Republiek en de USSR'
  type: main
