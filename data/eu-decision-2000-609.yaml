    ūkiuose auginamų Ratitae genties paukščių mėsą ir iš dalies keičiantis
    Sprendimą 94/85/EB, pateikiantį trečiųjų šalių, iš kurių valstybės narės
    leidžia importuoti šviežią paukštieną, sąrašą (pranešta dokumentu Nr.
    C(2000) 2885)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta Settembru 2000 li tistabbilixxi
