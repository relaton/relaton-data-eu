    94/85/EG über das Verzeichnis der Drittländer, aus denen die Mitgliedstaaten
    die Einfuhr von frischem Geflügelfleisch genehmigen (Bekannt gegeben unter Aktenzeichen
    K(2000) 2885)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 29 септември 2000
    година относно определяне на ветеринарно-санитарните
    и здравните условия и ветеринарното сертифициране
    за внос на месо от щраусови птици от ферми и
    за изменение на Решение 94/85/ЕО относно изготвянето
    на списък с трети страни, от които държавите-членки
    разрешават вноса на прясно месо от домашни
    птици (нотифицирано под номер C(2000) 2885)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. září 2000 o veterinárních a hygienických
