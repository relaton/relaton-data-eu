  script: Latn
  content: '2000/609/CE: Decisione della Commissione, del 29 settembre 2000, che stabilisce
    le condizioni sanitarie e di polizia sanitaria e la certificazione veterinaria
    per l''importazione da paesi terzi di carni di ratiti d''allevamento e recante
    modifica della decisione 94/85/CE che fissa l''elenco dei paesi terzi da cui gli
    Stati membri autorizzano l''importazione di carni di pollame fresche [notificata
    con il numero C(2000) 2885]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2000. gada 29. septembris), ar kuru nosaka dzīvnieku
    un sabiedrības veselības nosacījumus un veterināro sertifikāciju saimniecībā
    audzētu skrējējputnu gaļas importam un groza Lēmumu 94/85/EK, ar ko izveido
    to trešo valstu sarakstu, no kurām dalībvalstis atļauj importēt svaigu mājputnu
    gaļu (izziņots ar dokumenta numuru C(2000) 2885)
  type: main
- language: lt
  script: Latn
