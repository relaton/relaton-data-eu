    għall- importazzjonijiet ta’ laħam ta’ għasafar li ma jtirux mrobbija fl-
    irziezet li temenda d- Deċiżjoni 94/85/KE li telenka numru ta’ pajjiżi terzi
    li minngħandhom l- Istati Membri jawtorizzaw l- importazzjoni ta’ laħam frisk
    tat-tjur. (notifikata taħt id- dokument numru C(2000) 2885)
  type: main
