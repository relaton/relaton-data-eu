title:
- language: en
  script: Latn
  content: '2000/609/EC: Commission Decision of 29 September 2000 laying down animal
    and public health conditions and veterinary certification for imports of farmed
    ratite meat amending Decision 94/85/EC drawing up a list of third countries from
    which the Member States authorise imports of fresh poultry meat (notified under
    document number C(2000) 2885)'
  type: main
- language: fr
  script: Latn
  content: '2000/609/CE: Décision de la Commission du 29 septembre 2000 établissant
    les conditions sanitaires et de police sanitaire et la certification vétérinaire
    requises à l''importation de viandes de ratites d''élevage et modifiant la décision
    94/85/CE établissant une liste de pays tiers en provenance desquels les États
    membres autorisent les importations de viandes fraîches de volaille [notifiée
    sous le numéro C(2000) 2885]'
  type: main
- language: de
  script: Latn
  content: '2000/609/EG: Entscheidung der Kommission vom 29. September 2000 über
    die tierseuchenrechtlichen und gesundheitlichen Bedingungen und die Veterinärbescheinigungen
