    vedrørende beregning af importafgift for mælk og mejeriprodukter, for så vidt
    angår varebeskrivelsen af visse produkter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 650/72 del Consiglio, del 30 marzo 1972, che modifica,
