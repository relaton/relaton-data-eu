  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/1013 of 7 May 2026 concerning
    the authorisation of a preparation of 6-phytase produced with Aspergillus oryzae
    DSM 33737 as a feed additive for poultry for laying or reproduction, piglets of
    porcine species, porcine species for fattening and porcine species reared for
    reproduction (holder of authorisation: Novozymes A/S)'
  type: main
- language: fr
  script: Latn
