    concernant l’autorisation d’une préparation de 6-phytase produite avec Aspergillus
    oryzae DSM 33737 en tant qu’additif pour l’alimentation des volailles destinées
    à la ponte ou à la reproduction, des porcelets des espèces porcines, des espèces
    porcines destinées à l’engraissement et des espèces porcines élevées pour
    la reproduction (titulaire de l’autorisation: Novozymes A/S)'
  type: main
