    landbrugsprodukter, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2979/74 del Consiglio, del 26 novembre 1974, che stabilisce
