    de certains produits agricoles exportés sous forme de marchandises ne relevant
    pas de l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2979/74 des Rates vom 26. November 1974 über die
    Einführung von bei der Ausfuhr bestimmter landwirtschaftlicher Erzeugnisse, die
    in Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt werden,
    anwendbaren durchschnittlichen Ausgleichsbeträgen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2979/74 af 26. november 1974 om fastsættelse
