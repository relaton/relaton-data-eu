    med oprindelse i de associerede afrikanske stater og Madagaskar eller de oversøiske
    lande og territorier
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2738/73 del Consiglio, dell'8 ottobre 1973, che modifica
