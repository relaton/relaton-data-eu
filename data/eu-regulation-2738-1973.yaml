  content: Regulation (EEC) No 2738/73 of the Council of 8 October 1973 amending Regulation
    (EEC) No 859/72 on the treatment to be accorded to certain fruit and vegetables
    originating in Associated African States and Madagascar or in the Overseas Countries
    and Territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2738/73 du Conseil, du 8 octobre 1973, modifiant le
    règlement (CEE) n° 859/72 relatif au régime applicable à certains fruits et
    légumes originaires des États africains et malgache associés ou des pays et
    territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2738/73 des Rates vom 8. Oktober 1973 zur Änderung
