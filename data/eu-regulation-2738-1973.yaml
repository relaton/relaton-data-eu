    mit Ursprung in den assoziierten afrikanischen Staaten und Madagaskar oder den
    überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2738/73 af 8. oktober 1973 om ændring af
