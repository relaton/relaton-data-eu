    και αγοράς για τα νεκταρίνια για την περίοδο
    1989 μετά την υπέρβαση του κατωφλίου παρέμβασης
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1486/89 DELLA COMMISSIONE del 30 maggio 1989 che
