title:
- language: en
  script: Latn
  content: '79/13/EEC: Commission Decision of 28 November 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to objects made of pressed or blown glass, falling
    within heading No ex 70.10 or ex 70.13 of the Common Customs Tariff, originating
    in Czechoslovakia and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/13/CEE: Décision de la Commission, du 28 novembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les objets en verre soufflé ou pressé
    des positions ex 70.10 et ex 70.13 du tarif douanier commun, originaires de Tchécoslovaquie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/13/EWG: Entscheidung der Kommission vom 28. November 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus der Tschechoslowakei stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Glaswaren, geblasen oder
    gepreßt, der Tarifnummern ex 70.10 und ex 70.13 des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/13/EØF: Kommissionens beslutning af 28. november 1978 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage glasvarer, blæst eller presset, som
    henhører under pos. ex 70.10 og ex 70.13 i den fælles toldtarif, har oprindelse
    i Tjekkoslovakiet og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/13/CEE: Decisione della Commissione, del 28 novembre 1978, che autorizza
    il Regno del Belgio, il Granducto del Lussemburgo e il Regno dei Paesi Bassi ad
    escludere dal trattamento comunitario gli oggetti in vetro soffiato anche in stampi,
    delle voci ex 70.10 e ex 70.13 della tariffa doganale comune, originari della
    Cecoslovacchia e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/13/EEG: Beschikking van de Commissie van 28 november 1978 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd voorwerpen in glas, geblazen of geperst, van de posten ex 70.10
    en ex 70.13 van het gemeenschappelijke douanetarief, van oorsprong uit Tsjechoslowakije
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
