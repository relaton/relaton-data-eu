title:
- language: en
  script: Latn
  content: '91/272/EEC: Commission Decision of 14 May 1991 authorizing the French
    Republic to permit temporarily the marketing of maize seed not satisfying the
    requirements of Council Directive 66/402/EEC and of sunflower seed not satisfying
    the requirements of Council Directive 69/208/EEC'
  type: main
- language: fr
  script: Latn
  content: '91/272/CEE: Décision de la Commission du 14 mai 1991 autorisant la République
    française à admettre temporairement la commercialisation de semences de maïs
    ne répondant pas aux exigences de la directive 66/402/CEE du Conseil et de semences
    de tournesol ne répondant pas aux exigences de la directive 69/208/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 14. Mai 1991 zur Ermächtigung der Französischen
    Republik, vorübergehend Saatgut von Mais, das den Anforderungen der Richtlinie
    66/402/EWG nicht entspricht, und von Sonnenblumen, das den Anforderungen der Richtlinie
    69/208/EWG nicht gerecht wird, zum Verkehr zuzulassen (91/272/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 14. maj 1991 om bemyndigelse af Den Franske
    Republik til midlertidigt at tillade handel med frø af majs, der ikke opfylder
    kravene i Rådets direktiv 66/402/EØF og frø af solsikke, der ikke opfylder
    kravene i Rådets direktiv 69/208/EØF (91/272/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/272/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
    Μαΐου 1991 που παρέχει στη Γαλλική Δημοκρατία
    την άδεια να επιτρέπει προσωρινά την εμπορία
    ορισμένων ποικιλιών σπόρων αραβοσίτου προς
    σπορά που δεν ανταποκρίνονται στις απαιτήσεις
    της οδηγίας 66/402/ΕΟΚ του Συμβουλίου και ορισμένων
    ποικιλιών σπόρων ηλιάνθου προς σπορά που δεν
    ανταποκρίνονται στις απαιτήσεις της οδηγίας
    69/208/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 14 maggio 1991 che autorizza la Repubblica
    francese ad ammettere temporaneamente la commercializzazione di sementi di granturco
    che non soddisfano ai requisiti della direttiva 66/402/CEE del Consiglio e di
    sementi di girasole che non soddisfano ai requisiti della direttiva 69/208/CEE
    del Consiglio (91/272/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 14 mei 1991 houdende machtiging van de
    Franse Republiek om maïszaad dat niet aan de eisen van Richtlijn 66/402/EEG van
    de Raad voldoet en zonnebloemzaad dat niet aan de eisen van Richtlijn 69/208/EEG
    van de Raad voldoet, tijdelijk tot de handel toe te laten (91/272/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '91/272/CEE: Decisão da Comissão, de 14 de Maio de 1991, que autoriza
    a Republica francesa a admitir temporariamente a comercialização de sementes
    de milho que nao satisfazem as exigencias da Directiva 66/402/CEE do Conselho
    e de sementes de girassol que nao satisfazem as exigencias da Directiva 69/208/CEE
    do Conselho'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 14 de mayo de 1991 por la que se autoriza
    a la República Francesa a admitir temporalmente la comercialización de semillas
    de maíz que no cumplan los requisitos establecidos en la Directiva 66/402/CEE
    del Consejo así como de semillas de girasol que no cumplan los requisitos establecidos
    en la Directiva 69/208/CEE del Consejo (91/272/CEE) #'
