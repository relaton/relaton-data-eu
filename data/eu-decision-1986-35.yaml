title:
- language: en
  script: Latn
  content: '86/35/EEC: Commission Decision of 21 February 1986 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of fibre
    building board from Finland and Sweden and terminating the investigation'
  type: main
- language: fr
  script: Latn
  content: '86/35/CEE: Décision de la Commission du 21 février 1986 portant acceptation
    des engagements souscrits dans le cadre de la procédure antidumping concernant
    les importations de panneaux de fibres originaires de Finlande et de Suède et
    portant clôture de l'' enquête'
  type: main
- language: de
  script: Latn
  content: '86/35/EWG: Beschluß der Kommission vom 21. Februar 1986 zur Annahme von
    Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren von
    Platten aus Fasern mit Ursprung in Finnland und Schweden und zur Einstellung der
    Untersuchung'
  type: main
- language: da
  script: Latn
  content: '86/35/EØF: Kommissionens afgørelse af 21. februar 1986 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende importen af fiberplader
    med oprindelse i Finland og Sverige og om afslutning af undersøgelsen'
  type: main
- language: el
  script: Grek
  content: '86/35/ΕΟΚ: Απόφαση της Επιτροπής της 21ης Φεβρουαρίου
    1986 για την αποδοχή της ανάληψης υποχρεώσεων
    που προτάθηκαν όσον αφορά τη διαδικασία αντιντάμπινγκ
    σχετικά με τις εισαγωγές οικοδομικών πλακών—διαφραγμάτων
    εξ ινών (ινοπλακών) καταγωγής Φινλανδίας και
    Σουηδίας και για την περάτωση της διαδικασίας
    αυτής'
  type: main
- language: it
  script: Latn
  content: '86/35/CEE: Decisione della Commissione del 21 febbraio 1986 che accetta
    gli impegni assunti nell'' ambito della procedura antidumping relativa alle importazioni
    di pannelli da costruzione di fibre di legno originari della Finlandia e della
    Svezia e chiude la procedura stessa'
  type: main
- language: nl
  script: Latn
  content: '86/35/EEG: Besluit van de Commissie van 21 februari 1986 tot aanvaarding
    van de in het kader van de anti-dumpingprocedure betreffende de invoer van vezelplaat
