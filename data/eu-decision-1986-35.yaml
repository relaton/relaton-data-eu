  type: main
- language: pt
  script: Latn
  content: '86/35/CEE: Decisão da Comissão de 21 de Fevereiro de 1986 que aceita
    um compromisso oferecido no âmbito do processo "anti-dumping" relativo às importações
    de painéis de fibras da Finlândia e da Suécia e dando por terminado o respectivo
    inquérito'
  type: main
- language: es
  script: Latn
  content: '86/35/CEE: Decisión de la Comisión de 21 de febrero de 1986 por la que
    se aceptan los compromisos ofrecidos en relación con el procedimiento antidumping
    relativo a las importaciones de tableros de fibra originarios de Finlandia y Suecia,
    y por la que se concluye la investigación'
