title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2769/74 of the Commission of 30 October 1974 re-establishing
    the levying of customs duties on builders' carpentry and joinery, falling within
    heading No 44.23, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2769/74 de la Commission, du 30 octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    de menuiserie, de la position tarifaire 44.23, originaires des pays en voie de
    développement bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2769/74 der Kommission vom 30. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Bautischler- und Zimmermannsarbeiten, der Tarifnummer 44.23,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3501/73
    des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2769/74 af 30. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for tømrer- og snedkerarbeider under position
    44.23, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2769/74 della Commissione, del 30 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di falegnameria
    della voce doganale n. 44.23 originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2769/74 van de Commissie van 30 oktober 1974 houdende
    wederinstelling van de heffing van de douanerechten voor schrijnwerk en timmerwerk,
    van post nr. 44.23, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan
    bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 tariefpreferenties
    werden geopend
  type: main
