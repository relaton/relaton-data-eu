title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 780/98 of 7 April 1998 amending Regulation (EC)
    No 1488/96 as regards the procedure for adopting the appropriate measures where
    an essential element for the continuation of support measures for a Mediterranean
    Partner is lacking
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 780/98 du Conseil du 7 avril 1998 modifiant le règlement
    (CE) nº 1488/96 en ce qui concerne la procédure à suivre pour adopter les mesures
    appropriées lorsqu'un élément essentiel pour la poursuite des mesures d'appui
    en faveur d'un partenaire méditerranéen fait défaut
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 780/98 des Rates vom 7. April 1998 zur Änderung der
    Verordnung (EG) Nr. 1488/96 hinsichtlich des Verfahrens zur Annahme geeigneter
    Maßnahmen beim Fehlen einer wesentlichen Voraussetzung für die Fortsetzung der
    Stützungsmaßnahmen zugunsten eines Mittelmeer-Partnerlandes
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 780/98 ze dne 7. dubna 1998, kterým se mění
    nařízení (ES) č. 1488/96, pokud jde o postup pro přijetí vhodných opatření,
    pokud chybí některý z podstatných prvků pro pokračování opatření na
    podporu středomořského partnera
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 780/98 af 7. april 1998 om ændring af forordning
    (EF) nr. 1488/96 for så vidt angår proceduren for vedtagelse af hensigtsmæssige
    foranstaltninger i tilfælde, hvor en væsentlig forudsætning for videreførelse
    af støtten til en Middelhavspartner ikke længere er opfyldt
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 780/98 του Συμβουλίου
    της 7ης Απριλίου 1998 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1488/96 σχετικά με τη διαδικασία
    έγκρισης των κατάλληλων μέτρων, όταν απουσιάζει
    ένα ουσιαστικό στοιχείο για τη συνέχιση των
    μέτρων στήριξης υπέρ ενός μεσογειακού εταίρου
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 780/98, 7. aprill 1998, millega muudetakse määrust
    (EÜ) nr 1488/96 selles osas, mis käsitleb asjakohaste meetmete võtmise korda,
    kui mõni Vahemere piirkonna partneri toetuseks mõeldud meetmete jätkamiseks
    vajalik tingimus jääb täitmata
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 780/98, annettu 7 päivänä huhtikuuta 1998,
    asetuksen (EY) N:o 1488/96 muuttamisesta siltä osin kuin on kyse menettelystä
    aiheellisten toimenpiteiden toteuttamiseksi silloin, kun Välimeren alueen yhteistyökumppani
    ei täytä jotain tukitoimien jatkamiseksi vaadittua olennaista edellytystä
  type: main
- language: hu
  script: Latn
  content: A Tanács 780/98/EK rendelete (1998. április 7.) az 1488/96/EK rendeletnek
    az egy mediterrán térségbeli partner további támogatásának valamely lényeges
    feltétele hiánya esetén alkalmazandó megfelelő intézkedések elfogadására
    vonatkozó eljárás tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 780/98 del Consiglio del 7 aprile 1998 che modifica
    il regolamento (CE) n. 1488/96 per quanto riguarda la procedura per l'adozione
    di misure appropriate in assenza di un elemento fondamentale per il proseguimento
    delle misure di sostegno a favore di un partner mediterraneo
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 780/98 (1998. gada 7. aprīlis), ar ko groza Regulu
    (EK) Nr. 1488/96 attiecībā uz procedūru, saskaņā ar kuru nosaka attiecīgus
    pasākumus gadījumos, kad iztrūkst kāds būtisks priekšnoteikums palīdzības
    turpināšanai kādam Vidusjūras reģiona partnerim
  type: main
- language: lt
  script: Latn
  content: 1998 m. balandžio 7 d. Tarybos reglamentas (EB) Nr. 780/98, iš dalies
    keičiantis Reglamentą (EB) Nr. 1488/96 dėl tinkamų priemonių patvirtinimo
    tvarkos, kai nesama būtinos sudedamosios dalies tęsti paramą Viduržemio jūros
    regiono partneriui
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 780/98 tas-7 ta' April 1998 li jemenda
    Regolament (KE) Nru 1488/96 dwar il-proċedura biex ikunu adottati l-miżuri xierqa
    meta jkun hemm nuqqas ta' element essenzjali għall-kontinwazzjoni ta' miżuri
    ta' appoġġ għal Sieħeb Mediterranju
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 780/98 van de Raad van 7 april 1998 tot wijziging
    van Verordening (EG) nr. 1488/96 wat betreft de procedure voor de aanneming van
    passende maatregelen ingeval een essentieel element voor de voortzetting van steunmaatregelen
    voor een mediterrane partner ontbreekt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) NR 780/98 z dnia 7 kwietnia 1998 r. zmieniające
    rozporządzenie (WE) nr 1488/96 w odniesieniu do procedury przyjmowania właściwych
    środków w przypadku braku jednego z zasadniczych warunków kontynuowania środków
    wsparcia na rzecz śródziemnomorskiego kraju partnerskiego
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 780/98 do Conselho de 7 de Abril de 1998 que altera
    o Regulamento (CE) nº 1488/96 no que diz respeito ao processo de adopção de
    medidas adequadas quando falte um elemento essencial para o prosseguimento de
    medidas de apoio a um parceiro mediterrânico
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 780/98 zo 7. apríla 1998, ktorým sa mení a
    dopĺňa nariadenie (ES) č. 1488/96, pokiaľ ide o postup prijímania primeraných
    opatrení v prípade, že chýba základný predpoklad pre pokračovanie podporných
    opatrení pre stredomorského partnera
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 780/98 z dne 7. aprila 1998 o spremembi Uredbe (ES)
    št. 1488/96 glede postopka sprejemanja za sprejetje ustreznih ukrepov, kjer manjka
    bistven element za nadaljnje ukrepe za podporo sredozemskemu partnerju
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 780/98 del Consejo de 7 de abril de 1998 por el que
    se modifica el Reglamento (CE) nº 1488/96 en lo que respecta al procedimiento
    para la adopción de medidas apropiadas cuando falte un elemento fundamental para
    proseguir las medidas de apoyo a un socio meditarráneo
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 780/98 av den 7 april 1998 om ändring av förordning
    (EG) nr 1488/96 såvitt avser förfarandet för beslut om lämpliga åtgärder
    om någon väsentlig förutsättning saknas för att stödåtgärder till en Medelhavspartner
    skall kunna fullföljas
