---
id: EUDecision1977430
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 May 1977 authorizing the French Republic not
    to apply Community treatment to woven fabrics of cotton or of synthetic textile
    fibres, unbleached or bleached, falling within heading No ex 55.09 or subheading
    56.07 ex A of the Common Customs Tariff, originating in Thailand and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/430/CEE: Décision de la Commission, du 18 mai 1977, autorisant la
    République française à exclure du traitement communautaire les tissus écrus
    et blanchis de coton ou les fibres textiles synthétiques, des positions et sous-positions
    Ex 55.09 et 56.07 Ex A du Tarif douanier commun, originaires de la Thaïlande
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Mai 1977, mit der die Französische
    Republik ermächtigt wird, aus Thailand stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche ungebleichte und gebleichte Gewebe aus Baumwolle
    oder synthetischen Spinnfasern der Tarifstellen ex 55.09 und 56.07 ex A des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. maj 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof, ubleget eller
    bleget, af bomuld eller syntetiske fibre, som henhører under pos. 55.09 og 56.07
    ex A i den fælles toldtarif, har oprindelse i Thailand og frit kan omsættes
    i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 maggio 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti greggi e imbianchiti
    di cotone o di fibre tessili sintetiche, della voce ex 55.09 e della sottovoce
    56.07 ex A della tariffa doganale comune, originari della Tailandia e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 mei 1977 waarbij de Franse Republiek
    wordt gemachtigd ongebleekte en gebleekte weefsels van katoen of van synthetische
    vezels, van de posten ex 55.09 en 56.07 ex A van het gemeenschappelijk douanetarief,
    van oorsprong uit Thailand en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
