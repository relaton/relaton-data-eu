title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/1059 of 25 May 2023 on the position to be adopted
    on behalf of the European Union within the Specialised Committee on Social Security
    Coordination established by the Trade and Cooperation Agreement between the European
    Union and the European Atomic Energy Community, of the one part, and the United
    Kingdom of Great Britain and Northern Ireland, of the other part, as regards the
    designation of the financial institution to serve as reference to determine the
    interest rate for late payments and the exchange rate for currency conversions,
    as well as the date to be taken into consideration for determining the rates of
    currency conversion
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/1059 du Conseil du 25 mai 2023 établissant la position
    à prendre au nom de l’Union européenne au sein du comité spécialisé chargé
    de la coordination de la sécurité sociale institué par l’accord de commerce
    et de coopération entre l’Union européenne et la Communauté européenne de
    l’énergie atomique, d’une part, et le Royaume-Uni de Grande-Bretagne et d’Irlande
    du Nord, d’autre part, en ce qui concerne la désignation de l’établissement
    financier servant de référence pour déterminer le taux d’intérêt pour retard
    de paiement et le taux de change applicable aux conversions monétaires, ainsi
    que la date à prendre en considération pour déterminer les taux de conversion
    monétaire
  type: main
