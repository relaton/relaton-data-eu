title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2359/2000 of 24 October 2000 amending Regulation
    (EC) No 28/97 and assessing requirements for the supply of certain vegetable oils
    (other than olive oil) for the processing industry in the French overseas departments
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2359/2000 de la Commission du 24 octobre 2000 modifiant
    le règlement (CE) nº 28/97 et établissant le bilan prévisionnel d'approvisionnement
    en certaines huiles végétales (excepté l'huile d'olive) destinées à l'industrie
    de transformation pour les départements français d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2359/2000 der Kommission vom 24. Oktober 2000 zur Änderung
    der Verordnung (EG) Nr. 28/97 und zur Erstellung der vorläufigen Versorgungsbilanz
    für das für die verarbeitende Industrie in den französischen überseeischen
    Departements bestimmte Pflanzenöl außer Olivenöl
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2359/2000 af 24. oktober 2000 om ændring
    af forordning (EF) nr. 28/97 og om fastsættelse af den foreløbige forsyningsopgørelse
    for visse vegetabilske olier (undtagen olivenolie) til forarbejdningsindustrien
    for de franske oversøiske departementer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2359/2000 της Επιτροπής,
    της 24ης Οκτωβρίου 2000, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 28/97 και την κατάρτιση προβλέψεων
    εφοδιασμού των γαλλικών υπερπόντιων διαμερισμάτων
    με ορισμένα φυτικά έλαια (εκτός του ελαιολάδου)
    που προορίζονται για τη βιομηχανία μεταποίησης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2359/2000, annettu 24 päivänä lokakuuta 2000,
    asetuksen (EY) N:o 28/97 muuttamisesta ja Ranskan merentakaisten departementtien
    jalostusteollisuuteen tarkoitettujen tiettyjen kasviöljyjen (oliiviöljyä lukuun
    ottamatta) arvioidun hankintataseen vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2359/2000 della Commissione, del 24 ottobre 2000, recante
    modifica del regolamento (CE) n. 28/97 e fissazione del bilancio previsionale
    di approvvigionamento dei dipartimenti francesi d'oltremare in taluni oli vegetali
    (escluso l'olio d'oliva) destinati all'industria di trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2359/2000 van de Commissie van 24 oktober 2000 tot
    wijziging van Verordening (EG) nr. 28/97 en tot vaststelling van de balans voor
    de voorziening van de Franse overzeese departementen met bepaalde plantaardige
    oliën (met uitzondering van olijfolie) voor de verwerkende industrie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2359/2000 da Comissão, de 24 de Outubro de 2000,
    que altera o Regulamento (CE) n.o 28/97 e estabelece a estimativa das necessidades
    de abastecimento dos departamentos franceses ultramarinos em óleos vegetais (com
    excepção do azeite), destinados à indústria de transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2359/2000 de la Comisión, de 24 de octubre de 2000,
    por el que se modifica el Reglamento (CE) nº 28/97 y se establece el plan de
    previsiones de abastecimiento a los departamentos franceses de Ultramar de determinados
    aceites vegetales (excepto el de oliva) destinados a la industria de transformación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2359/2000 av den 24 oktober 2000 om ändring
    av förordning (EG) nr 28/97 och om upprättande av en prognostiserad försörjningsbalans
    för vissa vegetabiliska oljor (utom olivolja) avsedda för bearbetningsindustrin
    i de utomeuropeiska franska departementen
  type: main
