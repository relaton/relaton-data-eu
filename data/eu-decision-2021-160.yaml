title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/160 of 21 January 2021 adopting
    the twelfth update of the list of sites of Community importance for the Pannonian
    biogeographical region (notified under document C(2021) 20)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/160 de la Commission du 21 janvier 2021
    arrêtant la douzième actualisation de la liste des sites d’importance communautaire
    pour la région biogéographique pannonique [notifiée sous le numéro C(2021)
    20]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/160 der Kommission vom 21. Januar 2021
    zur Annahme einer zwölften aktualisierten Liste von Gebieten von gemeinschaftlicher
    Bedeutung in der pannonischen biogeografischen Region (Bekannt gegeben unter Aktenzeichen
    C(2021) 20)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/160 на Комисията
