    importanza Komunitarja għar-reġjun bijoġeografiku Pannonjan (notifikata bid-dokument
    C(2021) 20)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/160 van de Commissie van 21 januari 2021 tot
    vaststelling van een twaalfde bijgewerkte lijst van gebieden van communautair
    belang voor de Pannonische biogeografische regio (Kennisgeving geschied onder
    nummer C(2021) 20)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/160 z dnia 21 stycznia 2021 r. w sprawie
    przyjęcia dwunastego zaktualizowanego wykazu terenów mających znaczenie dla
    Wspólnoty składających się na panoński region biogeograficzny (notyfikowana
    jako dokument nr C(2021) 20)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/160 da Comissão de 21 de janeiro de 2021
    que adota a décima segunda atualização da lista dos sítios de importância
    comunitária da região biogeográfica panónica [notificada com o número C(2021)
    20]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/160 a Comisiei din 21 ianuarie
    2021 de adoptare a celei de a douăsprezecea actualizări a listei siturilor de
    importanță comunitară pentru regiunea biogeografică panonică [notificată
    cu numărul C(2021) 20]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/160 z 21. januára 2021, ktorým
    sa prijíma dvanásta aktualizácia zoznamu lokalít s európskym významom v
    panónskom biogeografickom regióne [oznámené pod číslom C(2021) 20]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/160 z dne 21. januarja 2021 o sprejetju
    dvanajste posodobitve seznama za Skupnost pomembnih območij v panonski biogeografski
    regiji (notificirano pod dokumentarno številko C(2021) 20)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/160 de la Comisión de 21 de enero de
    2021 por la que se adopta la duodécima lista actualizada de lugares de importancia
    comunitaria de la región biogeográfica panónica [notificada con el número
    C(2021) 20]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/160 av den 21 januari 2021
