    актуализация на списъка на териториите от
    значение за Общността в Панонския биогеографски
    регион (нотифицирано под номер C(2021) 20)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/160, ze dne 21. ledna 2021, kterým
    se přijímá dvanáctá aktualizace seznamu lokalit významných pro Společenství
    v panonské biogeografické oblasti (oznámeno pod číslem C(2021) 20)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/160 af 21. januar 2021
    om vedtagelse af 12. ajourførte liste over lokaliteter af fællesskabsbetydning
    i det pannoniske biogeografiske område (meddelt under nummer C(2021) 20)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/160 της Επιτροπής
    της 21ης Ιανουαρίου 2021 για την έγκριση του δωδέκατου
    επικαιροποιημένου καταλόγου τόπων κοινοτικής
    σημασίας για την παννονική βιογεωγραφική περιοχή
    [κοινοποιηθείσα υπό τον αριθμό C(2021) 20]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/160, 21. jaanuar 2021, millega võetakse
    vastu Pannoonia biogeograafilises piirkonnas asuvate ühenduse tähtsusega alade
    loetelu kaheteistkümnes uuendatud versioon (teatavaks tehtud numbri C(2021) 20
    all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/160, annettu 21 päivänä
    tammikuuta 2021, Pannonian vyöhykkeen luonnonmaantieteellisellä alueella olevista
    yhteisön tärkeinä pitämistä alueista tehdyn luettelon kahdennestatoista päivityksestä
    (tiedoksiannettu numerolla C(2021) 20)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/160 оd 21. siječnja 2021. o donošenju
    dvanaestog ažuriranog popisa područja od značaja za Zajednicu za panonsku biogeografsku
    regiju (priopćeno pod brojem dokumenta C(2021) 20)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/160 végrehajtási határozata (2021. január 21.)
    a pannon biogeográfiai régió közösségi jelentőségű természeti területeit
    tartalmazó, tizenkettedik alkalommal frissített jegyzék elfogadásáról (az
    értesítés a C(2021) 20. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/160 della Commissione del 21 gennaio
