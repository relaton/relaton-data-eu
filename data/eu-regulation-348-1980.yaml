title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 348/80 of 14 February 1980 re-establishing
    the levying of customs duties on yarn of regenerated textile fibres, products
    of category 42 (code 0420), originating in Brazil, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 348/80 de la Commission, du 14 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles artificielles de la catégorie de produits n° 42 (code 0420),
    originaires du Brésil, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 348/80 der Kommission vom 14. Februar 1980 über die
    Wiedereinführung des Zollsatzes für künstliche Spinnfäden der Warenkategorie
    Nr. 42 (Kennziffer 0420), mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 348/80 af 14. februar 1980 om genindførelse
    af opkrævning af toldafgifter for garn af endeløse regenererede fibre, under
    varekategori 42 (kode 0420), som har oprindelse i Brasilien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 348/80 della Commissione, del 14 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di fibre tessili
    sintetiche della categoria di prodotti n. 42 (codice 0420), originari del Brasile.
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 348/80 van de Commissie van 14 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    kunstmatige vezels van de categorie van produkten nr. 42 (codenummer 0420), van
    oorsprong uit Brazilië waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
