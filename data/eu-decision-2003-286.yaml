title:
- language: en
  script: Latn
  content: '2003/286/EC: Council Decision of 8 April 2003 on the conclusion of a Protocol
    adjusting the trade aspects of the Europe Agreement establishing an association
    between the European Communities and their Member States, of the one part, and
    the Republic of Bulgaria, of the other part, to take account of the outcome of
    negotiations between the Parties on new mutual agricultural concessions'
  type: main
- language: fr
  script: Latn
  content: '2003/286/CE: Décision du Conseil du 8 avril 2003 relative à la conclusion
    d''un protocole d''adaptation des aspects commerciaux de l''accord européen établissant
    une association entre les Communautés européennes et leurs États membres, d''une
    part, et la République de Bulgarie, d''autre part, pour tenir compte des résultats
    des négociations entre les parties concernant l''établissement de nouvelles
    concessions agricoles réciproques'
  type: main
- language: de
  script: Latn
  content: '2003/286/EG: Beschluss des Rates vom 8. April 2003 über den Abschluss
    eines Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zur Gründung
    einer Assoziation zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten
    einerseits und der Republik Bulgarien andererseits zur Berücksichtigung der Ergebnisse
    der Verhandlungen zwischen den Parteien über neue gegenseitige Zugeständnisse
    in der Landwirtschaft'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 8. dubna 2003 o uzavření protokolu, kterým se
    upravují obchodní aspekty Evropské dohody zakládající přidružení mezi
    Evropskými společenstvími a jejich členskými státy na jedné straně a Bulharskou
    republikou na straně druhé s ohledem na závěry jednání mezi stranami o nových
    vzájemných koncesích pro zemědělské produkty
  type: main
- language: da
  script: Latn
  content: '2003/286/EF: Rådets afgørelse af 8. april 2003 om indgåelse af en protokol
    om tilpasning af handelsaspekterne i Europaaftalen om oprettelse af en associering
    mellem De Europæiske Fællesskaber og deres medlemsstater på den ene side og
    Bulgarien på den anden side for at tage hensyn til resultatet af parternes forhandlinger
    om yderligere gensidige indrømmelser på landbrugsområdet'
  type: main
- language: el
