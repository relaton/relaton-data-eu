    Wspólnotami Europejskimi i ich Państwami Członkowskimi, z jednej strony, a
    Republiką Bułgarii, z drugiej strony, w celu uwzględnienia wyników negocjacji
    między Stronami w sprawie nowych wzajemnych koncesji rolnych
  type: main
