  content: Commission Regulation (EU) 2026/909 of 27 April 2026 amending Regulation
    (EC) No 1223/2009 of the European Parliament and of the Council as regards the
    use of Benzyl Salicylate, Triphenyl Phosphate, Ammonium Silver Zinc Aluminium
    Silicate, Aluminium, water-soluble zinc salts, Acetylated Vetiver Oil, Citral,
    HC Blue No 18, HC Red No 18, HC Yellow No 16, Hydroxypropyl-p-phenylenediamine
    and its dihydrochloride salt, and DHHB in cosmetic products
  type: main
