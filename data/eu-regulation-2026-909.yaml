    règlement (CE) no 1223/2009 du Parlement européen et du Conseil en ce qui concerne
    l’utilisation du Benzyl Salicylate, du Triphenyl Phosphate, de l’Ammonium
    Silver Zinc Aluminium Silicate, de l’aluminium, des sels de zinc hydrosolubles,
    de l’huile de vétiver acétylée, du Citral, du HC Blue No. 18, du HC Red No.
    18, du HC Yellow No. 16, de l’Hydroxypropyl-p-phenylenediamine et de son sel
    de dichlorhydrate, ainsi que du DHHB dans les produits cosmétiques
  type: main
