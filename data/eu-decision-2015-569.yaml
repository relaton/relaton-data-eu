    Új-Zéland hivatalosan gümőkórmentesnek minősített szarvasmarha-állományai
    közötti egyenértékűség, valamint az állat-egészségügyi bizonyítványmintán
    a spermamennyiségre vonatkozóan megadandó információ tekintetében történő
    módosításáról (az értesítés a C(2015) 2187. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/569 della Commissione, del 7 aprile 2015
    , che modifica gli allegati della decisione di esecuzione 2011/630/UE per quanto
    riguarda l'equivalenza tra gli allevamenti bovini ufficialmente indenni da tubercolosi
    degli Stati membri e quelli della Nuova Zelanda e per quanto riguarda i dati sulla
    quantità di sperma che figurano nel modello di certificato sanitario [notificata
    con il numero C(2015) 2187]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/569 ( 2015. gada 7. aprīlis
    ), ar ko Īstenošanas lēmuma 2011/630/ES pielikumus groza attiecībā uz oficiāli
