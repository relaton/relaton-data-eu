title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/569 of 7 April 2015 amending
    the Annexes to Implementing Decision 2011/630/EU as regards the equivalence between
    officially tuberculosis-free bovine herds in Member States and in New Zealand
    and the information in the model animal health certificate on the quantity of
    semen (notified under document C(2015) 2187)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/569 de la Commission du 7 avril 2015 modifiant
    les annexes de la décision d'exécution 2011/630/UE en ce qui concerne l'équivalence
    des troupeaux bovins officiellement indemnes de tuberculose entre les États membres
    et la Nouvelle-Zélande et les informations relatives à la quantité de sperme
    devant figurer dans le modèle de certificat sanitaire [notifiée sous le numéro
    C(2015) 2187]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/569 der Kommission vom 7. April 2015
