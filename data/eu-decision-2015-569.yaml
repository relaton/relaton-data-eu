    der Gleichwertigkeit amtlich anerkannt tuberkulosefreier Rinderbestände in den
    Mitgliedstaaten und in Neuseeland sowie hinsichtlich der Angaben zur Spermamenge
    in der Musterveterinärbescheinigung (Bekanntgegeben unter Aktenzeichen C(2015)
    2187)
  type: main
