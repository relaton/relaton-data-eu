    de modificare a anexelor la Decizia de punere în aplicare 2011/630/UE în ceea
    ce privește echivalența șeptelurilor de bovine oficial indemne de tuberculoză
    din statele membre și din Noua Zeelandă și informațiile din modelul de certificat
    de sănătate animală privind cantitatea de material seminal [notificată cu
    numărul C(2015) 2187]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/569 zo 7. apríla 2015 , ktorým
    sa menia prílohy k vykonávaciemu rozhodnutiu 2011/630/EÚ, pokiaľ ide o rovnocennosť
    stád hovädzieho dobytka bez úradne potvrdeného výskytu tuberkulózy v členských
    štátoch so stádami na Novom Zélande a o informácie vo vzore veterinárneho
    osvedčenia týkajúce sa množstva spermy [oznámené pod číslom C(2015) 2187]
  type: main
- language: sl
