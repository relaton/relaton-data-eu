title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3085/73 of the Commission of 14 November 1973 concerning
    the application with retrospective effect of Regulations (EEC) Nos 1858/73 and
    2210/73, adjusting certain compensatory amounts and variable components applicable
    during the second and third quarters respectively of 1973 on importation of goods
    covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3085/73 de la Commission, du 14 novembre 1973, concernant
    l'application avec effet rétroactif des règlements (CEE) n 1858/73 et (CEE)
    n 2210/73 portant rectification de certains montants compensatoires et éléments
    mobiles applicables pendant le deuxième et le troisième trimestre respectivement
    de l'année 1973 à l'importation de marchandises relevant du règlement (CEE)
    n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3085/73 vom 14. November 1973 über die rückwirkende
    Anwendung der Verordnungen (EWG) Nr. 1858/73 und (EWG) Nr. 2210/73 zur Berichtigung
    bestimmter im zweiten bzw. dritten Vierteljahr 1973 bei der Einfuhr der unter
    die Verordnung (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge
    und Ausgleichsbeträge
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3085/73 af 14. november 1973 vedrørende
    anvendelsen med tilbagevirkende kraft i forordningerne (EØF) nr. 1858/73 og (EØF)
    nr. 2210/73 om berigtigelse af visse udligningsbeløb og variable elementer, som
    i henholdsvis andet og tredje kvartal af 1973 skal anvendes ved indførsel af
    varer, henhørende under forordning (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3085/73 della Commissione, del 14 novembre 1973, relativo
    all'applicazione con effetto retroattivo dei regolamenti (CEE) n. 1858/73 e (CEE)
    n. 2210/73, che rettificano taluni importi compensativi ed elementi mobili applicabili
    rispettivamente per il secondo e il terzo trimestre dell'anno 1973, all'importazione
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3085/73 van de Commissie van 14 november 1973 betreffende
    de toepassing met terugwerkende kracht van Verordeningen (EEG) nr. 1858/73 en
    (EEG) nr. 2210/73 houdende verbetering van bepaalde compenserende bedragen en
    variabele elementen, toepasselijk gedurende respectievelijk het tweede en het
    derde kwartaal 1973 bij invoer van onder Verordening (EEG) nr. 1059/69 vallende
    goederen
  type: main
