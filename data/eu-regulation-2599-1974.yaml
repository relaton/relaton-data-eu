  content: Regulation (EEC) No 2599/74 of the Commission of 11 October 1974 supplementing
    certain provisions of Regulations (EEC) No 2637/70 and (EEC) No 432/71 as regards
    advance fixing certificates for beef and veal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2599/74 de la Commission, du 11 octobre 1974, complétant
    certaines dispositions des règlements (CEE) n° 2637/70 et (CEE) n° 432/71 en
    ce qui concerne les certificats de fixation à l' avance du prélèvement dans
    le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2599/74 der Kommission vom 11. Oktober 1974 zur Ergänzung
    verschiedener Bestimmungen der Verordnungen (EWG) Nr. 2637/70 und (EWG) Nr. 432/71
    über die Lizenzen zur Vorausfestsetzung der Abschöpfung im Rindfleischsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2599/74 af 11. oktober 1974 om tillæg
    til visse bestemmelser i forordning (EØF) nr. 2637/70 og (EØF) nr. 432/71 med
    hensyn til forudfastsættelsesattester for importafgifter for oksekød
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2599/74 della Commissione, dell' 11 ottobre 1974,
    che completa talune disposizioni dei regolamenti (CEE) n. 2637/70 e (CEE) n. 432/71,
    per quanto riguarda i titoli di fissazione anticipata del prelievo nel settore
    delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2599/74 van de Commissie van 11 oktober 1974 houdende
