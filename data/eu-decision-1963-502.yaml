title:
- language: fr
  script: Latn
  content: '63/502/CEE: Décision de la Commission du 29 juillet 1963 autorisant la
    perception d''une taxe compensatoire à l''importation, en République fédérale
    d''Allemagne, de dextrines et d''amidons et fécules solubles ou torréfiés en
    provenance du Royaume des Pays-Bas'
  type: main
- language: de
  script: Latn
  content: '63/502/EWG: Entscheidung der Kommission vom 29. Juli 1963 über die Erhebung
    einer Ausgleichsabgabe bei der Einfuhr von Dextrin, löslicher oder gerösteter
    Stärke aus dem Königreich der Niederlande in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '63/502/CEE: Decisione della Commissione del 29 luglio 1963 con cui si
    autorizza la riscossione di una tassa di compensazione all''importazione nella
    Repubblica federale di Germania di destrine, amidi e fecole solubili o torrefatti
    in provenienza dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '63/502/EEG: Beschikking van de Commissie van 29 juli 1963 houdende machtiging
    tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van dextrine en van oplosbaar of geroost zetmeel uit het Koninkrijk
    der Nederlanden'
  type: main
