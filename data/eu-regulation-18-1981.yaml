title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 18/81 of 1 January 1981 fixing, for the
    period 1 January to 31 May 1981, the Community offer prices for sweet oranges
    applicable as regards Greece and the coefficients to be used to calculate the
    offer prices for Greek oranges
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 18/81 de la Commission, du 1er janvier 1981, fixant,
    pour la période du 1er janvier au 31 mai 1981, le prix d' offre communautaire
    des oranges douces applicable vis-à-vis de la Grèce ainsi que les coefficients
    à appliquer pour le calcul du prix d' offre du produit grec
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 18/81 der Kommission vom 1. Januar 1981 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Süßorangen gegenüber Griechenland
    sowie der zur Berechnung des Angebotspreises für das griechische Erzeugnis anzuwendenden
    Koeffizienten für den Zeitraum vom 1. Januar bis zum 31. Mai 1981
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 18/81 af 1. januar 1981 om fastsættelse
    for perioden fra den 1. januar til den 31. maj 1981, for så vidt angår Grækenland,
    af fællesskabstilbudsprisen på appelsiner samt af koefficienterne for beregningen
    af tilbudsprisen på det græske produkt
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 18/81 τής Επιτροπής
    τής 1ης Ιανουαρίου 1981 περί καθορισμού, γιά τήν
    περίοδο από τήν 1η Ιανουαρίου έως τήν 31η Μαΐου
    1981, τής κοινοτικής τιμής προσφοράς γιά τά γλυκά
    πορτοκάλια η οποία εφαρμόζται έναντι τής Ελλάδος,
    καθώς καί τών συντελεστών πού πρέπει νά εφαρμόζονται
    γιά τόν υπολογισμό τής τιμής προσφοράς τού
    ελληνικού προϊόντος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 18/81 della Commissione, del 1° gennaio 1981, che
    fissa, per il periodo dal 1° gennaio al 31 maggio 1981, il prezzo d' offerta
    comunitario applicabile nei confronti della Grecia per le arance dolci, nonché
    i coefficienti da utilizzare per il calcolo del prezzo d' offerta del prodotto
    ellenico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 18/81 van de Commissie van 1 januari 1981 tot vaststelling,
    voor het tijdvak van 1 januari tot en met 31 mei 1981, van de ten aanzien van
    Griekenland toe te passen communautaire aanbiedingsprijs voor zoete sinaasappelen
    en van de voor de berekening van de aanbiedingsprijs van het Griekse produkt toe
    te passen coëfficiënten
  type: main
