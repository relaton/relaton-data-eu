title:
- language: en
  script: Latn
  content: Regulation (EEC) No 459/73 of the Commission of 31 January 1973 suspending
    the rates of customs duties applicable in trade between Denmark and the Community
    as originally constituted in respect of beef and veal products for which a compensatory
    amount is laid down
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 459/73 de la Commission, du 31 janvier 1973, portant
    suspension totale des taux des droits de douane applicables dans les échanges
    entre le Danemark et la Communauté dans sa composition originaire pour les produits
    du secteur de la viande bovine pour lesquels un montant compensatoire est prévu
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 459/73 der Kommission vom 31. Januar 1973 zur vollständigen
    Aussetzung der Zollsätze, die im Handelsverkehr zwischen Dänemark und der Gemeinschaft
    in ihrer ursprünglichen Zusammensetzung auf Erzeugnisse des Rindfleischsektors
    anwendbar sind, für die ein Ausgleichsbetrag erhoben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 459/73 af 31. januar 1973 om total
    suspension af de toldsatser, som i handelen mellem Danmark og Fællesskabet i
    dets oprindelige udstrækning finder anvendelse på produkter inden for oksekødsektoren,
    for hvilke der er fastsat et udligningsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 459/73 της Επιτροπής,
    της 31ης Ιανουαρίου 1973, περί πλήρους αναστολής
    των ποσοστών δασμού που ισχύουν για τις ανταλλαγές
    μεταξύ Δανίας και Κοινότητας υπό την αρχική
    της σύσταση για τα προϊόντα του τομέα του βοεΐου
    κρέατος για τα οποία προβλέπεται αντισταθμιστικό
    ποσόν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 459/73 della Commissione, del 31 gennaio 1973, recante
    sospensione delle aliquote dei dazi doganali applicabili negli scambi tra la Danimarca
    e la Comunità nella sua composizione originaria ai prodotti del settore delle
    carni bovine per i quali è previsto un importo compensativo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 459/73 van de Commissie van 31 januari 1973 houdende
    schorsing van de douanerechten in het handelsverkeer tussen Denemarken en de oorspronkelijke
    Gemeenschap voor de produkten van de sector rundvlees waarvoor een compenserend
    bedrag is vastgesteld
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 459/73 de la Comisión, de 31 de enero de 1973, por
    el que se suspenden totalmente los montantes de los derechos aduaneros que se
    aplican en los intercambios entre Dinamarca y la Comunidad en su composición
    originaria para los productos del sector de las carnes de ovino para los que está
    previsto un montante compensatorio
  type: main
