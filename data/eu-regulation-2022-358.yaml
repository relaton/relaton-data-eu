    2019/1379 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren
    von Fahrrädern mit Ursprung in der Volksrepublik China für einen chinesischen
    ausführenden Hersteller, zur Außerkraftsetzung des Zolls auf die von diesem
    ausführenden Hersteller stammenden Einfuhren und zur zollamtlichen Erfassung
    dieser Einfuhren
