title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/358 of 2 March 2022 initiating
    a ‘new exporter’ review of Implementing Regulation (EU) 2019/1379 imposing
    a definitive anti-dumping duty on imports of bicycles originating in the People’s
    Republic of China for one Chinese exporting producer, repealing the duty with
    regard to imports from that exporting producer and making these imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/358 de la Commission du 2 mars 2022
    portant ouverture d’un réexamen au titre de «nouvel exportateur» du règlement
    d’exécution (UE) 2019/1379 instituant un droit antidumping définitif sur les
    importations de bicyclettes originaires de la République populaire de Chine pour
    un producteur-exportateur chinois, abrogeant le droit en ce qui concerne les importations
    provenant de ce producteur-exportateur et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/358 der Kommission vom 2. März 2022
