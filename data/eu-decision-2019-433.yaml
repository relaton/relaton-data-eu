    à prendre, au nom de l'Union européenne, au sein du comité d'association dans
    sa configuration «Commerce» créé par l'accord d'association entre l'Union
    européenne et la Communauté européenne de l'énergie atomique et leurs États
    membres, d'une part, et la République de Moldavie, d'autre part, concernant l'actualisation
    des annexes XXVIII-A (Règles applicables aux services financiers), XXVIII-B (Règles
    applicables aux services de télécommunication) et XXVIII-D (Règles applicables
    au transport maritime international) de l'accord
  type: main
