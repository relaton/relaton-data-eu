    „Handel“, der durch das Assoziierungsabkommen zwischen der Europäischen Union
    und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten einerseits und
    der Republik Moldau andererseits eingerichtet wurde, zu der Aktualisierung des
    Anhangs XXVIII-A (Regelungen für Finanzdienstleistungen), des Anhangs XXVIII-B
    (Regelungen für Telekommunikationsdienstleistungen) und des Anhangs XXVIII-D
    (Regelungen für den internationalen Seeverkehr) des Abkommens zu vertreten ist
  type: main
