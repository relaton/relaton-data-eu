  content: Council Decision (EU) 2019/433 of 20 February 2018 on the position to be
    taken on behalf of the European Union within the Association Committee meeting
    in Trade configuration established by the Association Agreement between the European
    Union and the European Atomic Energy Community and their Member States, of the
    one part, and the Republic of Moldova, of the other part, concerning the update
    of Annexes XXVIII-A (Rules applicable to financial services), XXVIII-B (Rules
    applicable to telecommunication services) and XXVIII-D (Rules applicable to international
    maritime transport) to the Agreement
  type: main
- language: fr
  script: Latn
