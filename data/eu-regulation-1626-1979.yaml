title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1626/79 of 26 July 1979 re-establishing
    the levying of customs duties on gloves, mittens, mitts, stockings, socks and
    sockettes, not being knitted or crocheted goods, falling within heading No 61.10
    and originating in Pakistan, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1626/79 de la Commission, du 26 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables à la ganterie,
    aux bas, chaussettes et socquettes, autres qu' en bonneterie, de la position 61.10
    du tarif douanier commun, originaires du Pakistan, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1626/79 der Kommission vom 26. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Handschuhe, Strümpfe, Socken und Söckchen, nicht gewirkt,
    der Tarifnummer 61.10, mit Ursprung in Pakistan, dem die in der Verordnung (EWG)
    Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1626/79 af 26. juli 1979 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter, luffer, strømper og sokker,
    ikke af trikotage, under pos. 61.10, som har oprindelse i Pakistan og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1626/79 della Commissione, del 26 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili a guanti, calze e calzini,
    esclusi quelli a maglia, della voce 61.10 della tariffa doganale comune, originari
    del Pakistan beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1626/79 van de Commissie van 26 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen,
    wanten en dergelijke, kousen en sokken, andere dan die van brei- of haakwerk,
    van post 61.10, van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 1195/79 van de Raad
  type: main
