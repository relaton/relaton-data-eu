title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2314/92 of 6 August 1992 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for processing within the Community and repealing
    Regulation (EEC) No 1550/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2314/92 de la Commission du 6 août 1992 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d'intervention en vue de
    leur transformation dans la Communauté et abrogeant le règlement (CEE) n° 1550/92
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2314/92 DER KOMMISSION vom 6. August 1992 über den
    Verkauf von Rindfleisch, das zur Verarbeitung in der Gemeinschaft bestimmt ist,
    aus Beständen einiger Interventionsstellen nach dem Verfahren der Verordnung
    (EWG) Nr. 2539/84 und zur Aufhebung der Verordnung (EWG) Nr. 1550/92 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2314/92 af 6. august 1992 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 1550/92 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2314/92 της Επιτροπής
    της 6ης Αυγούστου 1992 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που
    κατέχεται από ορισμένους οργανισμούς παρεμβάσεως
    και προορίζεται για μεταποίηση στην Κοινότητα
    και για την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    1550/92
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2314/92 DELLA COMMISSIONE del 6 agosto 1992 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'' intervento e destinate alla trasformazione
    nella Comunità e recante abrogazione del regolamento (CEE) n. 1550/92 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2314/92 VAN DE COMMISSIE van 6 augustus 1992 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor verwerking in de Gemeenschap
    bestemd rundvlees en houdende intrekking van Verordening (EEG) nr. 1550/92 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2314/92 DA COMISSÃO de 6 de Agosto de 1992 relativo
    à venda, no âmbito do procedimento definido no Regulamento (CEE) no 2539/84,
    de carne de bovino detida por certos organismos de intervenção com vista à
    sua transformação na Comunidade e que revoga o Regulamento (CEE) no 1550/92
    #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2314/92 DE LA COMISIÓN de 6 de agosto de 1992 relativo
    a la venta, según el procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carne de vacuno en poder de organismos de intervención para su transformación
    en la Comunidad y que deroga el Reglamento (CEE) no 1550/92 #'
