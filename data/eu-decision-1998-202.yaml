title:
- language: en
  script: Latn
  content: '98/202/EC: Commission Decision of 27 February 1998 to authorise Italy
    to apply the requirements of section a of Article 4 of Council Directive 64/433/EEC
    to certain slaughterhouses which handle not more than 2 000 livestock units per
    year (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/202/CE: Décision de la Commission du 27 février 1998 autorisant l''Italie
    à appliquer les conditions prévues à l''article 4 section A de la directive
    64/433/CEE du Conseil à certains abattoirs traitant un maximum de 2 000 unités
    de gros bétail par an (Le texte en langue italienne est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '98/202/EG: Entscheidung der Kommission vom 27. Februar 1998 zur Ermächtigung
    Italiens, Artikel 4 Abschnitt A der Richtlinie 64/433/EWG des Rates auf Schlachtbetriebe
    anzuwenden, in denen höchstens 2 000 Großvieheinheiten pro Jahr geschlachtet
    werden (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/202/EF: Kommissionens beslutning af 27. februar 1998 om bemyndigelse
    af Italien til at anvende bestemmelserne i artikel 4, litra A, i Rådets direktiv
    64/433/EØF på visse slagterier, der højst behandler 2 000 storkreaturer om
    året (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '98/202/ΕΚ: Απόφαση της Επιτροπής της 27ης Φεβρουαρίου
    1998 που επιτρέπει στην Ιταλία να εφαρμόσει τις
    απαιτήσεις του άρθρου 4 τμήμα Α της οδηγίας
    64/433/ΕΟΚ του Συμβουλίου σε ορισμένα σφαγεία
    που επεξεργάζονται 2 000 μονάδες χονδρού ζώου
    κατ''ανώτατο όριο ετησίως (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '98/202/EY: Komission päätös, tehty 27 päivänä helmikuuta 1998, luvan
