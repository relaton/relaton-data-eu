    vaatimuksia eräisiin vuodessa enintään 2 000 nautayksikköä käsitteleviin
    teurastamoihin (Ainoastaan italiankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '98/202/CE: Decisione della Commissione del 27 febbraio 1998 che autorizza
    l''Italia ad applicare le disposizioni di cui all''articolo 4, punto A, della
    direttiva 64/433/CEE del Consiglio a taluni macelli che trattano un massimo di
    2 000 UGB all''anno (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '98/202/EG: Beschikking van de Commissie van 27 februari 1998 tot machtiging
    van Italië om de voorwaarden van artikel 4, punt A, van Richtlijn 64/433/EEG
    toe te passen op bepaalde slachthuizen die niet meer dan 2 000 grootvee-eenheden
    per jaar behandelen (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
