    des produits auxquels s'appliquent les coefficients fixés pour les quartiers
    avant et les quartiers arrière (viande bovine)
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 150/65/EWG des Rates vom 27. Oktober 1965 zur Änderung
    des Artikels 3 der Verordnung Nr. 47/64/EWG des Rates betreffend die Definition
    der Erzeugnisse, auf welche die für Vorderviertel und Hinterviertel festgesetzten
    Koeffizienten anzuwenden sind (Rindfleisch)
  type: main
- language: it
  script: Latn
  content: Regolamento n. 150/65/CEE del Consiglio, del 27 ottobre 1965, relativo
