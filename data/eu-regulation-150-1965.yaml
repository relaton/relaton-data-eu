    concerne la definizione dei prodotti cui sono applicabili i coefficienti fissati
    per i quarti anteriori e i quarti posteriori (carni bovine)
  type: main
- language: nl
  script: Latn
  content: Verordening no. 150/65/EEG van de Raad van 27 oktober 1965 houdende wijziging
