  script: Latn
  content: Commission Implementing Decision (EU) 2019/1301 of 26 July 2019 amending
    Implementing Decision 2013/327/EU as regards the renewal of the authorisation
    to place on the market feed containing or consisting of genetically modified oilseed
    rapes Ms8, Rf3 and Ms8 × Rf3 pursuant to Regulation (EC) No 1829/2003 of the
    European Parliament and of the Council (notified under document C(2019) 5499)
  type: main
- language: fr
  script: Latn
