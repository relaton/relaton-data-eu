    modifiant la décision d'exécution 2013/327/UE en ce qui concerne le renouvellement
    de l'autorisation de mise sur le marché d'aliments pour animaux contenant les
    colzas génétiquement modifiés Ms8, Rf3 et Ms8 × Rf3 ou consistant en ces colzas,
