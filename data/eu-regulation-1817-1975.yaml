title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1817/75 of the Council of 10 July 1975 derogating from
    Regulation (EEC) No 1693/72 in respect of the procedures for mobilizing food aid
    for distribution by the International Committee of the Red Cross to the population
    affected by the events in South Vietnam
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1817/75 du Conseil, du 10 juillet 1975, portant dérogation
    au règlement (CEE) n° 1693/72 en ce qui concerne les procédures de mobilisation
    de l' aide alimentaire desinée à être distribuée par l' intermédiaire du
    Comité international de la Croix-Rouge aux populations affectées par les événements
    au Viêt-Nam du Sud
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1817/75 des Rates vom 10. Juli 1975 zur Abweichung
    von der Verordnung (EWG) Nr. 1693/72 hinsichtlich der Verfahren für die Bereitstellung
    der Nahrungsmittelhilfe, die durch das Internationale Komitee vom Roten Kreuz
    an die von den Ereignissen in Südvietnam betroffene Bevölkerung verteilt wird
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1817/75 af 10. juli 1975 om afvigelse fra
    forordning (EØF) nr. 1693/72 for så vidt angår fremgangsmåderne ved tilvejebringelse
    af fødevarehjælp bestemt til uddeling gennem Den internationale Røde Kors Komité
    blandt de befolkningsgrupper, der er berørt af begivenhederne i Syd-Vietnam
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1817/75 del Consiglio, del 10 luglio 1975, che deroga
    al regolamento (CEE) n. 1693/72 per quanto si riferisce alle procedure di mobilitazione
    dell' aiuto alimentare destinato ad essere distribuito tramite il comitato internazionale
    della Croce Rossa alle popolazioni colpite dagli eventi del Vietnam del Sud
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1817/75 van de Raad van 10 juli 1975 houdende afwijking
    van Verordening (EEG) nr. 1693/72 ten aanzien van de procedure voor de beschikbaarstelling
    van de voedselhulp, door bemiddeling van het Internationaal Comité van het Rode
    Kruis te verstrekken aan de door de gebeurtenissen in Zuid-Vietnam getroffen bevolkingsgroepen
  type: main
