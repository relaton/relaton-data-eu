    à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1367/71 der Kommission vom 29. Juni 1971 zur Festsetzung
    der ab 1. Juli 1971 geltenden Erstattungssätze bei der Ausfuhr von Zucker und
    Melasse in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1367/71 della Commissione, del 29 giugno 1971, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 luglio 1971, allo
    zucchero e al melasso esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1367/71 van de Commissie van 29 juni 1971 houdende
    vaststelling van de restituties die met ingang van 1 juli 1971 worden toegepast
    voor suiker en melasse, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
