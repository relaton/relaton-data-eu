title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2233/80 of 25 August 1980 re-establishing
    the levying of customs duties on citric acid, falling within subheading 29.16
    A IV a) and originating in China, to which the preferential tariff arrangements
    in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2233/80 de la Commission, du 25 août 1980, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    citrique, de la sous-position 29.16 A IV a) du tarif douanier commun, originaire
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2233/80 der Kommission vom 25. August 1980 zur Wiedereinführung
    des Zollsatzes für Citronensäure der Tarifsteile 29.16 A IV a) mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2233/80 af 25. august 1980 om genindførelse
    af opkrævning af toldafgifter for citronsyre under underposition 29.16 A IV a),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2233/80 della Commissione, del 25 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' acido citrico, della
    sottovoce doganale 29.16 A IV a) della tariffa doganale comune, originario della
    Cina, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2233/80 van de Commissie van 25 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op citroenzuur,
    van post 29.16 A IV a), van oorsprong uit China, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
