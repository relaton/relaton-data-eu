---
id: EUDecision1978708
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 July 1978 authorizing the French Republic not
    to apply Community treatment to woven suits, of wool, of cotton or of man-made
    textile fibres, falling within heading No ex 61.01 (NIMEXE codes 61.01-51, 54,
    57) of the Common Customs Tariff, originating in Romania and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/708/CEE: Décision de la Commission, du 27 juillet 1978, autorisant
    la République française à exclure du traitement communautaire les costumes
    et complets tissés, de laine, de coton ou de fibres textiles synthétiques ou
    artificielles de la position Ex 61.01 du Tarif douanier commun (codes Nimexe :
    61.01-51; 54; 57), originaires de Roumanie et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. Juli 1978, mit der die Französische
    Republik ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Anzüge und Kombinationen aus Geweben, aus Wolle,
    aus Baumwolle oder künstlichen Spinnstoffen der Tarifnummer ex 61.01 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 61.01-51; 54; 57) von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 27. juli 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage jakkesæt, vævede, af uld,
    bomuld eller kemofibre, som henhører under pos. ex 61.01 (NIMEXE-kode 61.01-51,
    54, 57) i den fælles toldtarif, har oprindelse i Rumænien og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 27 luglio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i vestiti e completi, tessuti,
    di lana, di cotone o di fibre tessili sintetiche o artificiali della voce ex 61.01
    (codice Nimexe 61.01-51; 54; 57) della tariffa doganale comune, originari della
    Romania e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 juli 1978 waarbij de Franse Republiek
    wordt gemachtigd kostuums, geweven van wol, van katoen of van synthetische of
    van kunstmatige textielvezels, van post ex 61.01 van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.01-51, 54, 57), van oorsprong uit Roemenië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
