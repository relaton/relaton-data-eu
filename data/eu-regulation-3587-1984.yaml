    le secteur vitivinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3587/84 der Kommission vom 19. Dezember 1984 zur Festsetzung
    des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse aus Obst
    und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds zwischen
    Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3587/84 af 19. december 1984 om fastsættelse
