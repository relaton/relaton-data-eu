    Gewalt auf seiner 18. Sitzung hinsichtlich Empfehlungen und Schlussfolgerungen,
    die an bestimmte Vertragsstaaten gerichtet sind und sich auf deren Durchführung
    dieses Übereinkommens beziehen, in Bezug auf Aspekte, die die Organe und die
    öffentliche Verwaltung der Union betreffen, zu vertreten ist
