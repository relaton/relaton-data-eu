  script: Latn
  content: Council Decision (EU) 2025/1169 of 5 June 2025 on the position to be taken
    on behalf of the European Union within the Committee of the Parties to the Council
    of Europe Convention on preventing and combating violence against women and domestic
    violence, at its 18th meeting, on the recommendations and conclusions addressed
    to certain Parties on their implementation of that Convention, with regard to
    matters related to institutions and public administration of the Union
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1169 du Conseil du 5 juin 2025 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité des parties à
    la convention du Conseil de l’Europe sur la prévention et la lutte contre la
    violence à l’égard des femmes et la violence domestique, lors de sa 18e réunion,
    au sujet des recommandations et conclusions adressées à certaines parties et
    portant sur la mise en œuvre par elles de ladite convention, en ce qui concerne
    les questions liées aux institutions et à l’administration publique de l’Union
  type: main
