  content: Règlement (CEE) n° 2529/70 du Conseil, du 14 décembre 1970, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de tabacs bruts ou non fabriqués et de déchets de tabac, de la position 24.01
    du tarif douanier commun, originaires et en provenance de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2529/70 des Rates vom 14. Dezember 1970 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für unverarbeiteten
    Tabak und Tabakabfälle der Tarifnummer 24.01 des Gemeinsamen Zolltarifs mit Ursprung
    in und Herkunft aus der Türkei
  type: main
- language: it
  script: Latn
