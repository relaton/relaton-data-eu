title:
- language: en
  script: Latn
  content: '86/116/EEC: Commission Decision of 7 March 1986 concerning the zones referred
    to in Article 2 (3) of Regulation (EEC) No 2616/80 instituting a specific Community
    regional development measure contributing to overcoming constraints on the development
    of new economic activities in certain zones adversely affected by restructuring
    of the steel industry (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/116/CEE: Décision de la Commission du 7 mars 1986 relative aux zones
    visées à l''article 2 paragraphe 3 du règlement (CEE) n° 2616/80 instituant
    une action communautaire spécifique de développement régional contribuant à
    l''élimination des obstacles au développement de nouvelles activités économiques
    dans certaines zones affectées par la restructuration de l''industrie sidérurgique
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/116/EWG: Entscheidung der Kommission vom 7. März 1986 bezüglich der
    Gebiete gemäß Artikel 2 Absatz 3 der Verordnung (EWG) Nr. 2616/80 des Rates
    zur Einführung einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung
    im Hinblick auf die Beseitigung von Entwicklungshemmnissen für neue Wirtschaftszweige
    in bestimmten von der Umstrukturierung der Eisen- und Stahlindustrie betroffenen
    Gebieten (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/116/EØF: Kommissionens beslutning af 7. marts 1986 om de områder,
    der er omhandlet i artikel 2, stk. 3, i forordning (EØF) nr. 2616/80 om gennemførelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til at fjerne hindringerne for udviklingen af nye økonomiske aktiviteter i visse
    områder, der er berørt af strukturomlægningen i jern- og stålindustrien (Kun
    den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/116/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Μαρτίου
    1986 για τις ζώνες οι οποίες αναφέρονται στο
    άρθρο 2 παράγραφος 3 του κανονισμού (ΕΟΚ) αριθ.
    2616/80 του Συμβουλίου περί ανάληψης ειδικής κοινοτικής
    ενέργειας περιφερειακής ανάπτυξης για τη συμβολή
    στην εξάλειψη των εμποδίων στην ανάπτυξη νέων
    οικονομικών δραστηριοτήτων σε ορισμένες ζώνες
    που θίγονται από την αναδιάρθρωση της βιομηχανίας
    σιδήρου και χάλυβα (Το κείμενο στην αγγλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/116/CEE: Decisione della Commissione del 7 marzo 1986 relativa alle
    zone di cui all''articolo 2, paragrafo 3, del regolamento (CEE) n. 2616/80 che
    istituisce un''azione comunitaria specifica di sviluppo regionale per contribuire
    ad eliminare gli ostacoli allo sviluppo di nuove attività economiche in talune
    zone colpite dalla ristrutturazione dell''industria siderurgica (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '86/116/EEG: Beschikking van de Commissie van 7 maart 1986 betreffende
    de gebieden als bedoeld in artikel 2, lid 3, van Verordening (EEG) nr. 2616/80
    van de Raad tot instelling van een specifieke communautaire actie voor regionale
    ontwikkeling om bij te dragen tot de uitschakeling van de hinderpalen voor de
    ontwikkeling van nieuwe economische activiteiten in sommige door de herstructurering
    van de ijzer- en staalindustrie getroffen zones (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/116/CEE: Decisão da Comissão de 7 de Março de 1986 relativa às
    zonas referidas no n° 3 do artigo 2º do Regulamento (CEE) n° 2616/80 que institui
    uma acção comunitária específica de desenvolvimento regional para contribuir
    para a eliminação dos obstáculos ao desenvolvimento de novas actividades económicas
    em determinadas zonas afectadas pela reestruturação da indústria siderúrgica
    (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '86/116/CEE: Decisión de la Comisión de 7 de marzo de 1986 relativa a
    las zonas contempladas en el apartado 3 del artículo 2 del Reglamento (CEE) n°
    2616/80 del Consejo, por el que se establece una acción comunitaria específica
    de desarrollo regional que contribuya a eliminar los obstáculos al desarrollo
    de nuevas actividades económicas en determinadas zonas afectadas por la reestructuración
    de la industria siderúrgica (El texto en lengua inglesa es el único auténtico)'
