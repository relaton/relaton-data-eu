  content: Commission Regulation (EEC) No 1910/82 of 13 July 1982 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community and repealing Regulation (EEC) No 1229/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1910/82 de la Commission, du 13 juillet 1982, relatif
