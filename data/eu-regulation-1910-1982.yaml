    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant le règlement (CEE) n 1229/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1910/82 der Kommission vom 13. Juli 1982 über den
    Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der Gemeinschaft
    bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur Aufhebung der
    Verordnung (EWG) Nr. 1229/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1910/82 af 13. juli 1982 om salg til
