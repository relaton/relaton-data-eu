id: EURegulation24571977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2457/77 of 8 November 1977 re-establishing
    the levying of customs duties on other made up textile articles (including dress
    patterns) other than of jute, other than textile bast fibres of heading No 57.03
    or coir, falling within heading No ex 62.05, originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2457/77 de la Commission, du 8 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, y compris les patrons de vêtements, à l'exclusion
    des articles en jute ou en autres fibres textiles libériennes du n° 57.03, ou
    en coco, de la position tarifaire EX 62.05, originaires des pays et territoires
    en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2457/77 der Kommission vom 8. November 1977 zur Wiedereinführung
    des Zollsatzes für andere konfektionierte Waren aus Geweben, einschließlich
    Schnittmuster zum Herstellen von Bekleidung, ausgenommen Waren aus Jute oder anderen
    textilen Bastfasern der Tarifnummer 57.03, oder Kokosfasern der Tarifnummer ex
    62.05 mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2457/77 af 8. november 1977 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer (herunder
    snitmønstre), med undtagelse af varer af jute, andre bastfibre henhørende under
    pos. 57.03 eller kokosfibre under position ex 62.05, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2457/77 della Commissione, dell'8 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, compresi i modelli di vestiti, esclusi i manufatti di iuta e di altre
    fibre tessili liberiane della voce n. 57.03, o di cocco, della voce doganale ex
    62.05, originari dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2457/77 van de Commissie van 8 november 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere geconfectioneerde
    artikelen van weefsels, patronen van kleding daaronder begrepen, met uitzondering
    van artikelen van jute of andere bastvezels van post nr. 57.03 of van kokosvezels,
    van post ex 62.05, van oorsprong uit de ontwikkelingslanden en -gebieden, ten
    behoeve waarvan bij Verordening (EEG) nr. 3022/76 van de Raad tariefpreferenties
    werden geopend
  type: main
