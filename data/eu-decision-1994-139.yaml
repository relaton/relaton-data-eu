id: EUDecision1994139
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 February 1994 concerning the dates to be fixed
    by Member States for the submission of 'area' aid applications under the integrated
    administration and control system for certain Community aid schemes (the 'integrated
    system') (Only the German, French and Italian texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 21 février 1994 relative aux dates à fixer
    par les États membres pour la présentation des demandes d'aides «surfaces»
    dans le cadre du système intégré de gestion et de contrôle relatif à certains
    régimes d'aides communautaires («système intégré») (Les textes en langues
    allemande, française et italienne sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 21. Februar 1994 über die von den Mitgliedstaaten
    zu bestimmenden Zeitpunkte für die Stellung der Beihilfeanträge "Flächen" im
    Rahmen des integrierten Verwaltungs- und Kontrollsystems für bestimmte gemeinschaftliche
    Beihilferegelungen ("integriertes System") (Nur der deutsche, französische und
    italienische Text sind verbindlich)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 21. februar 1994 om de frister, som medlemsstaterne
    skal fastsætte for indgivelse af ansøgninger om arealstøtte i forbindelse med
    det integrerede system for forvaltning og kontrol af visse EF-støtteordninger
    (»det integrerede system«) (Kun de tyske, franske og italienske udgaver er autentiske)
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 21ης Φεβρουαρίου
    1994 σχετικά με τις ημερομηνίες που πρέπει να
    καθοριστούν από τα κράτη μέλη για την υποβολή
    των αιτήσεων για ενίσχυση «εκτάσεις» στο πλαίσιο
    του ολοκληρωμένου συστήματος διαχείρισης
    και ελέγχου σχετικά με ορισμένα καθεστώτα
    κοινοτικών ενισχύσεων (ολοκληρωμένο σύστημα)
    (Τα κείμενα στη γερμανική, γαλλική και ιταλική
    γλώσσα είναι τα μόνα αυθεντικά)
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 21 febbraio 1994 relativa alle date che
    gli Stati membri devono stabilire per la presentazione delle domande di aiuto
    « superfici » nel quadro del sistema integrato di gestione e di controllo di
    taluni regimi di aiuti comunitari (« sistema integrato ») (I testi in lingua
    tedesca, francese e italiana sono i soli facente fede)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 21 februari 1994 inzake de door de Lid-Staten
    vast te stellen data voor de indiening van de steunaanvragen "oppervlakten" in
    het kader van het geïntegreerd beheers- en controlesysteem voor bepaalde communautaire
    steunregelingen ("geïntegreerd systeem") (Slechts de tekst in de Duitse, de Franse
    en de Italiaanse taal is authentiek)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 21 de Fevereiro de 1994 relativa às datas a fixar
    pelos Estados-membros para a apresentação dos pedidos de ajudas « superfícies
    » no âmbito do sistema integrado de gestão e de controlo relativo a determinados
    regimes de ajudas comunitários (« sistema integrado ») (Apenas fazem fé os
    textos nas línguas alemã, francesa e italiana)
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 21 de febrero de 1994 relativa a las fechas
    de presentación de las solicitudes de ayuda « superficies » que los Estados
    miembros deben fijar dentro del sistema integrado de gestión y control de determinados
    regímenes de ayuda comunitarios (« sistema integrado ») (Los textos en lenguas
    alemana, francesa e italiana son los únicos auténticos)
  type: main
