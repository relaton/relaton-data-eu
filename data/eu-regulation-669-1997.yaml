    Kopienas tarifu kvotas un limitus, kā arī paredz to pārvaldību, ievieš Kopienas
    pārraudzību attiecībā uz dažiem Farēru salu izcelsmes zivju un zvejniecības
    produktiem, paredz sīki izstrādātus noteikumus šo pasākumu grozīšanai un
