  script: Latn
  content: A Tanács 669/97/EK rendelete (1997. április 14.) a közösségi vámkontingensek
    és felső határok megnyitásáról és kezeléséről, a Feröer-szigetekről
    származó egyes hal- és halászati termékekre közösségi felügyelet létrehozásáról,
    ezen intézkedések módosítására és elfogadására irányuló részletes
    rendelkezések meghatározásáról, valamint az 1983/95/EK rendelet hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 669/97 del Consiglio del 14 aprile 1997 che reca apertura
    e modalità di gestione di contingenti e massimali tariffari comunitari, che stabilisce
    una sorveglianza comunitaria per taluni pesci e prodotti della pesca originari
    delle isole Færøer e che definisce le modalità di rettifica e di adattamento
    di tali misure, nonché che abroga il regolamento (CE) n. 1983/95
  type: main
- language: lv
  script: Latn
