  script: Latn
  content: Council Regulation (EC) No 669/97 of 14 April 1997 opening and providing
    for the administration of Community tariff quotas and ceilings, establishing Community
    surveillance for certain fish and fishery products originating in the Faroe Islands,
    defining detailed provisions for amending and adapting these measures and repealing
    Regulation (EC) No 1983/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 669/97 du Conseil du 14 avril 1997 portant ouverture
    et mode de gestion de contingents et de plafonds tarifaires communautaires, établissant
    une surveillance communautaire pour certains poissons et produits de la pêche
    originaires des îles Féroé et définissant certaines modalités d'amendement
    et d'adaptation desdites mesures, ainsi qu'abrogeant le règlement (CE) nº 1983/95
  type: main
- language: de
  script: Latn
