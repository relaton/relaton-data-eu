    32 00 mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 4257/88 des
    Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2854/89 af 22. september 1989 om genindførelse
