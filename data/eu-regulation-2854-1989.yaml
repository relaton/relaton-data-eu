title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2854/89 of 22 September 1989 re-establishing
    the levying of customs duties on aluminium chloride falling within CN code 2827
    32 00 originating in India to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2854/89 de la Commission du 22 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables au chlorure
    d'aluminium, du code NC 2827 32 00, originaire de l'Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2854/89 DER KOMMISSION vom 22. September 1989 zur
