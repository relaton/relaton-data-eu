title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 100/2004 of 21 January 2004 amending for
    the 28th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 100/2004 de la Commission du 21 janvier 2004 modifiant
    pour la vingt-huitième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 100/2004 der Kommission vom 21. Januar 2004 zur achtundzwanzigsten
    Änderung der Verordnung (EG) Nr. 881/2002 des Rates über die Anwendung bestimmter
    spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit Osama bin Laden, dem Al-Qaida-Netzwerk und den Taliban in Verbindung stehen,
    und zur Aufhebung der Verordnung (EG) Nr. 467/2001 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 100/2004 af 21. januar 2004 om otteogtyvende
    ændring af Rådets forordning (EF) nr. 881/2002 om indførelse af visse specifikke
    restriktive foranstaltninger mod visse personer og enheder, der har tilknytning
    til Usama bin Laden, Al-Qaida-organisationen og Taliban, og om ophævelse af Rådets
    forordning (EF) nr. 467/2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 100/2004 της Επιτροπής,
    της 21ης Ιανουαρίου 2004, που τροποποιεί για εικοστή
    όγδοη φορά τον κανονισμό (ΕΚ) αριθ. 881/2002 του
    Συμβουλίου για την επιβολή συγκεκριμένων περιοριστικών
    μέτρων κατά ορισμένων προσώπων και οντοτήτων
    που συνδέονται με τον Οσάμα Μπιν Λάντεν, το
    δίκτυο της Αλ Κάιντα και τους Ταλιμπάν και
    για την κατάργηση του κανονισμού (ΕΚ) αριθ.
    467/2001 του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 100/2004, annettu 21 päivänä tammikuuta 2004,
    tiettyihin Osama bin Ladenia, al-Qaida-verkostoa ja Talebania lähellä oleviin
    henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista toimenpiteistä
    sekä neuvoston asetuksen (EY) N:o 467/2001 kumoamisesta annetun neuvoston asetuksen
    (EY) N:o 881/2002 muuttamisesta 28. kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 100/2004 della Commissione, del 21 gennaio 2004, recante
    ventottesima modifica del regolamento (CE) n. 881/2002 che impone specifiche misure
    restrittive nei confronti di determinate persone ed entità associate a Osama
    bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE) n. 467/2001
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 100/2004 van de Commissie van 21 januari 2004 tot
    achtentwintigste wĳziging van Verordening (EG) nr. 881/2002 tot vaststelling
    van bepaalde specifieke beperkende maatregelen tegen sommige personen en entiteiten
    die banden hebben met Usama bin Laden, het Al Qa'ida-netwerk en de Taliban, en
    tot intrekking van Verordening (EG) nr. 467/2001 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 100/2004 da Comissão, de 21 de Janeiro de 2004,
