title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 991/93 of 23 April 1993 extending the measures
    taken under the Agreement between the European Economic Community and the United
    States of America for the conclusion of negotiations under GATT Article XXIV.6
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 991/93 du Conseil, du 23 avril 1993, portant prorogation
    des dispositions prises dans le cadre de l' accord entre la Communauté économique
    européenne et les Etats-Unis d' Amérique concernant la conclusion des négociations
    au titre de l' article XXIV paragraphe 6 du GATT
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 991/93 des Rates vom 23. April 1993 über die Verlängerung
    der Maßnahmen des Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft
    und den Vereinigten Staaten von Amerika aufgrund des Abschlusses der Verhandlungen
    gemäß Artikel XXIV.6 des GATT
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 991/93 af 23. april 1993 om videreførelse
    af de foranstaltninger, der er truffet inden for rammerne af aftalen mellem Det
    Europæiske Økonomiske Fællesskab og Amerikas Forenede Stater om afslutning
    af forhandlingerne på grundlag af artikel XXIV.6 i GATT
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 991/93 του Συμβουλίου
    της 23ης Απριλίου 1993 για την παράταση των διατάξεων
    που έχουν θεσπιστεί στα πλαίσια της συμφωνίας
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και των Ηνωμένων Πολιτειών της Αμερικής σχετικά
    με την περάτωση των διαπραγματεύσεων στα πλαίσια
    του άρθρου XXIV παράγραφος 6 της ΓΣΔΕ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 991/93 del Consiglio, del 23 aprile 1993, che proroga
    le disposizioni prese nel quadro dell' accordo tra la Comunità economica europea
    e gli Stati Uniti d' America sulla conclusione dei negoziati a titolo dell' articolo
    XXIV, paragrafo 6 del GATT
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 991/93 van de Raad van 23 april 1993 tot verlenging
    van de maatregelen getroffen in het kader van de Overeenkomst tussen de Europese
    Economische Gemeenschap en de Verenigde Staten van Amerika betreffende de afsluiting
    van de onderhandelingen uit hoofde van artikel XXIV, lid 6, van de GATT
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 991/93 do Conselho, de 23 de Abril de 1993, que prorroga
    as disposições tomadas ao abrigo do Acordo entre a Comunidade Económica Europeia
    e os Estados Unidos da América respeitantes à conclusão das negociações ao
    abrigo do artigo XXIV.6 do GATT
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 991/93 del Consejo, de 23 de abril de 1993, por el
    que se prorrogan las disposiciones adoptadas en el marco del Acuerdo entre la
    Comunidad Económica Europea y los Estados Unidos de América para la conclusión
    de las negociaciones en virtud del apartado 6 del artículo XXIV del GATT
