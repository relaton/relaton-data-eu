title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 684/1999 of 29 March 1999 amending Regulation
    (EC) No 1484/95 laying down detailed rules for implementing the system of additional
    import duties and fixing representative prices in the poultrymeat and egg sectors
    and for egg albumin, and repealing Regulation No 163/67/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 684/1999 de la Commission du 29 mars 1999 modifiant
    le règlement (CE) nº 1484/95 portant modalités d'application du régime relatif
    à l'application des droits additionnels à l'importation et fixant des prix représentatifs,
    dans les secteurs de la viande de volaille et des oeufs ainsi que pour l'ovalbumine,
    et abrogeant le règlement nº 163/67/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 684/1999 der Kommission vom 29. März 1999 zur Änderung
    der Verordnung (EG) Nr. 1484/95 mit Durchführungsbestimmungen zur Regelung der
    zusätzlichen Einfuhrzölle und zur Festsetzung der repräsentativen Preise in
    den Sektoren Geflügelfleisch und Eier sowie für Eieralbumin und zur Aufhebung
    der Verordnung Nr. 163/67/EWG
  type: main
