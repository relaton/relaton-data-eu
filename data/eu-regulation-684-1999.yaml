    regime relativo à aplicação dos direitos adicionais de importação, que fixa
    os preços representativos nos sectores da carne de aves de capoeira e dos ovos,
    bem como para a ovalbumina, e que revoga o Regulamento n.o 163/67/CEE
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 684/1999 al Comisiei din 29 martie 1999 de modificare
    a Regulamentului (CE) nr. 1484/95 de stabilire a normelor de aplicare a sistemului
    de drepturi de import suplimentare și de stabilire a prețurilor reprezentative
    în sectoarele cărnii de pasăre și al ouălor și pentru albumina din ouă,
    și de abrogare a Regulamentului nr. 163/67/CEE
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 684/1999 z 29. marca 1999, ktorým sa mení
