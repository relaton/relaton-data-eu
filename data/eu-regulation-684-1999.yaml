    aanvullende invoerrechten in de sectoren slachtpluimvee en eieren, alsmede voor
    ovoalbumine, en houdende vaststelling van representatieve prijzen en intrekking
    van Verordening nr. 163/67/EEG
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 684/1999 z dnia 29 marca 1999 r. zmieniające
    rozporządzenie (WE) nr 1484/95 ustanawiające szczegółowe zasady wprowadzania
    w życie systemu dodatkowych należności celnych przywozowych oraz ustalające
    ceny reprezentatywne w sektorach mięsa drobiowego i jaj oraz w odniesieniu do
    albumin jaj i uchylające rozporządzenie nr 163/67/EWG
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 684/1999 da Comissão de 29 de Março de 1999 que
