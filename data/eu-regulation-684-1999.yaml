    järjestelmän soveltamista koskevista yksityiskohtaisista säännöistä ja edustavien
    hintojen vahvistamisesta sekä asetuksen N:o 163/67/ETY kumoamisesta annetun komission
    asetuksen (EY) N:o 1484/95 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 684/1999 od 29. ožujka 1999. o izmjeni Uredbe
