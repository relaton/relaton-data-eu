    k režimu dodatečných dovozních cel a určují reprezentativní ceny v odvětví
    drůbežího masa a vajec, jakož i pro vaječný albumin, a kterým se zrušuje
    nařízení č. 163/67/EHS
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 684/1999 af 29. marts 1999 om ændring
