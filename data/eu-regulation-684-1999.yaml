    uvoznih carina i određivanju reprezentativnih cijena u sektorima mesa peradi
    i jaja i za albumin iz jaja te stavljanju izvan snage Uredbe br. 163/67/EEZ
  type: main
- language: hu
  script: Latn
  content: A Bizottság 684/1999/EK rendelete (1999. március 29.) a baromfihús-
    és tojáságazatra, valamint az ovalbuminra vonatkozó kiegészítő importvámrendszer
    végrehajtására és a kiegészítő importvám megállapítására vonatkozó
    részletes szabályok megállapításáról, valamint a 163/67/EGK rendelet hatályon
    kívül helyezéséről szóló 1484/95/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 684/1999 della Commissione del 29 marzo 1999 recante
    modifica del regolamento (CE) n. 1484/95 che stabilisce le modalità d'applicazione
    del regime relativo all'applicazione dei dazi addizionali all'importazione e fissa
    i prezzi rappresentativi nei settori delle uova e del pollame nonché per l'ovoalbumina
    e che abroga il regolamento n. 163/67/CEE
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 684/1999 (1999. gada 29. marts), ar kuru groza
    Regulu (EK) Nr. 1484/95, ar ko nosaka sīki izstrādātus noteikumus par papildu
    ievedmuitas nodokļu sistēmas ieviešanu un reprezentatīvo cenu noteikšanu
    mājputnu gaļas un olu nozarē, kā arī ovalbumīnam, un atceļ Regulu Nr. 163/67/EEK
  type: main
- language: lt
  script: Latn
  content: 1999 m. kovo 29 d. Komisijos reglamentas (EB) Nr. 684/1999, iš dalies
    keičiantis Reglamentą (EB) Nr. 1484/95, nustatantį išsamias papildomų importo
    muitų sistemos taikymo taisykles ir tipines kainas paukštienos bei kiaušinių
    sektoriams ir kiaušinių albuminui, ir panaikinantis Reglamentą Nr. 163/67/EEB
  type: main
- language: mt
  script: Latn
