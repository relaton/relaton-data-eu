title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1028/83 of 27 April 1983 amending Regulation
    (EEC) No 3035/80 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the Treaty, and the criteria for fixing the amount for such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1028/83 du Conseil du 27 avril 1983 modifiant le règlement
    (CEE) no 3035/80 établissant, pour certains produits agricoles exportés sous
    forme de marchandises ne relevant pas de l' annexe II du traité, les règles
    générales relatives à l' octroi des restitutions à l' exportation et les critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1028/83 des Rates vom 27. April 1983 zur Änderung
    der Verordnung (EWG) Nr. 3035/80 zur Festlegung der allgemeinen Regeln für die
    Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1028/83 af 27. april 1983 om ændring af
    forordning (EØF) nr. 3035/80 om fastsættelse af almindelige regler for ydelse
    af eksportrestitutioner og om fastlæggelse af kriterierne for fastsættelse af
    restitutionsbeløbet for visse landbrugsprodukter, der udføres i form af varer,
    som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1028/83 του Συμβουλίου
    της 27ης Απριλίου 1983 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 3035/80 περί καθορισμού
    των γενικών κανόνων που αφορούν τη χορήγηση
    επιστροφών κατά την εξαγωγή και των κριτηρίων
    καθορισμού του ύψους αυτών, για ορισμένα γεωργικά
    προϊόντα εξαγόμενα υπό μορφή εμπορευμάτων
    μη υπαγομένων στο παράρτημα ΙΙ της συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1028/83 del Consiglio del 27 aprile 1983 recante modifica
    del regolamento (CEE) n. 3035/80 che stabilisce, per taluni prodotti agricoli
    esportati sotto forma di merci non comprese nell' allegato II del trattato, le
    regole generali relative alla concessione delle restituzioni all' esportazione
    e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1028/83 van de Raad van 27 april 1983 houdende wijziging
    van Verordening (EEG) nr. 3035/80 tot vaststelling van de algemene regels aangaande
    de toekenning van restituties bij uitvoer en de criteria voor de vaststelling
    van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in
    de vorm van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1028/83 do Conselho, de 27 de Abril de 1983, que
    altera o Regulamento (CEE) n.° 3035/80 que estabelece para certos produtos agrícolas
    exportados sob a forma de mercadorias, que não constam do Anexo II do Tratado,
    as regras gerais relativas à concessão das restituições à exportação e
    os critérios de fixação do seu montante
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1028/83 del Consejo, de 27 de abril de 1983, por el
    que se modifica el Reglamento (CEE) n° 3035/80 por el que se establecen, para
    determinados productos agrícolas exportados en forma de mercancías no incluidas
    en el Anexo II del Tratado, las normas generales relativas a la concesión de
    restituciones a la exportación y los criterios para la fijación de su importe
  type: main
