    pro účinné látky pinoxaden a meptyldinokap (oznámeno pod číslem C(2014)
    3059)'
  type: main
- language: da
  script: Latn
  content: '2014/289/EU: Kommissionens gennemførelsesafgørelse af 15. maj 2014 om
    medlemsstaternes forlængelse af midlertidige godkendelser af aktivstofferne pinoxaden
