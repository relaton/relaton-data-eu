title:
- language: en
  script: Latn
  content: '2014/289/EU: Commission Implementing Decision of 15 May 2014 allowing
    Member States to extend provisional authorisations granted for the active substances
    pinoxaden and meptyldinocap (notified under document C(2014) 3059)'
  type: main
- language: fr
  script: Latn
  content: '2014/289/UE: Décision d''exécution de la Commission du 15 mai 2014 autorisant
    les États membres à prolonger les autorisations provisoires octroyées pour
    les substances actives «pinoxaden» et «meptyldinocap» [notifiée sous le numéro
    C(2014) 3059]'
  type: main
- language: de
  script: Latn
  content: '2014/289/EU: Durchführungsbeschluss der Kommission vom 15. Mai 2014 zur
    Ermächtigung der Mitgliedstaaten, vorläufige Zulassungen betreffend die Wirkstoffe
    Pinoxaden und Meptyldinocap zu verlängern (Bekanntgegeben unter Aktenzeichen
    C(2014) 3059)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/289/ЕС: Решение за изпълнение на Комисията
