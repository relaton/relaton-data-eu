title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1126/82 of 11 May 1982 re-establishing the
    levying of customs duties on watch cases and parts of watch cases, falling within
    heading No 91.09 and originating in Hong Kong, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1126/82 de la Commission, du 11 mai 1982, portant
    rétablissement de la perception des droits de douane applicables aux boîtes
    de montres du n° 91.01 et leurs parties, de la position 91.09 du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1126/82 der Kommission vom 11. Mai 1982 zur Wiedereinführung
    der Erhebung der Zölle für Gehäuse für Uhren der Tarifnummer 91.01 und Teile
    davon, der Tarifnummer 91.09, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1126/82 af 11. maj 1982 om genindførelse
    af opkrævning af told for kasser til de i pos. 91.01 omhandlede ure samt dele
    dertil henhørende under pos. 91.09 og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1126/82 τής Επιτροπής
    τής 11ης Μαΐου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά κελύφη ωρολογίων τής κλάσεως
    91. 01 καί μέρη αυτών, τής κλάσεως 91. 09 τού Κοινού
    Δασμολογίου, καταγωγής Χόνγκ Κόνγκ, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1126/82 della Commissione, dell' 11 maggio 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle casse per orologi
    della voce n. 91.01 e loro parti, della voce 91.09 della tariffa doganale comune,
    originarie di Hong Kong beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1126/82 van de Commissie van 11 mei 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kasten voor
    horloges bedoeld bij post 91.01, alsmede delen daarvan, van post 91.09, van oorsprong
    uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
