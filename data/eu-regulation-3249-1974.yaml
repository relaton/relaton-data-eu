title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3249/74 of the Commission of 20 December 1974 amending
    Regulation (EEC) No 1220/74 fixing export refunds for raw tobacco from the 1972
    and 1973 crops and shortening the period during which refunds may be granted in
    respect of the 1971, 1972 and 1973 crops
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3249/74 de la Commission, du 20 décembre 1974, modifiant
    le règlement (CEE) n° 1220/74 fixant les restitutions à l'exportation pour
    le tabac brut des récoltes 1972 et 1973 et limitant la durée de l'octroi des
    restitutions accordées pour les récoltes 1971, 1972 et 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3249/74 der Kommission vom 20. Dezember 1974 zur Änderung
    der Verordnung (EWG) Nr. 1220/74 zur Festsetzung der Erstattungen bei der Ausfuhr
    von Rohtabak der Ernten 1972 und 1973 und zur Befristung der für die Ernten der
    Jahre 1971, 1972 und 1973 gewährten Erstattungen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3249/74 af 20. december 1974 om ændring
    af forordning (EØF) nr. 1220/74 om fastsættelse af eksportrestitutioner for
    råtobak fra høsten 1972 og 1973 og om begrænsning af tidsrummet for ydelse
    af restitutioner for høsten 1971, 1972 og 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3249/74 della Commissione, del 20 dicembre 1974, recante
    modifica del regolamento (CEE) n. 1220/74, che fissa le restituzioni all'esportazione
    nel settore del tabacco greggio dei raccolti 1972 e 1973, nonché limitazione
    della durata di concessione delle restituzioni per tabacchi dei raccolti 1971,
    1972 e 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3249/74 van de Commissie van 20 december 1974 houdende
    wijziging van Verordening (EEG) nr. 1220/74 tot vaststelling van de restituties
    bij uitvoer van ruwe tabak van de oogsten 1972 en 1973, en tot beperking van de
    tijdsduur voor toekenning van restituties voor de oogsten 1971, 1972 en 1973
  type: main
