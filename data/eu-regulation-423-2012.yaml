  script: Latn
  content: Regulation (EU) No 423/2012 of the European Parliament and of the Council
    of 22 May 2012 amending Council Regulation (EC) No 1083/2006 as regards certain
    provisions relating to risk-sharing instruments for Member States experiencing
    or threatened with serious difficulties with respect to their financial stability
  type: main
- language: fr
  script: Latn
