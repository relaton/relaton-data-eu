  script: Latn
  content: '84/75/EEC: Commission Decision of 21 December 1983 instituting for the
    fisheries and aquaculture sector in the regions of Languedoc-Roussillon, Provence-Côte
    d''Azur, Corsica and Aquitaine, France, a pilot action in preparation for the
    integrated Mediterranean programmes (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/75/CEE: Décision de la Commission du 21 décembre 1983 relative à
    l''exécution pour le secteur de la pêche et de l''aquaculture et dans les régions
    du Languedoc- Roussillon, de la Provence-Côte d''Azur, de la Corse et de l''Aquitaine,
    France, d''une action pilote préparatoire à la mise en oeuvre des programmes
    méditerranéens intégrés (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
