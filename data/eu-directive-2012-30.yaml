---
id: EUDirective201230
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Directive 2012/30/EU of the European Parliament and of the Council of 25
    October 2012 on coordination of safeguards which, for the protection of the interests
    of members and others, are required by Member States of companies within the meaning
    of the second paragraph of Article 54 of the Treaty on the Functioning of the
    European Union, in respect of the formation of public limited liability companies
    and the maintenance and alteration of their capital, with a view to making such
    safeguards equivalent (recast)
  type: main
- language: fr
  script: Latn
  content: Directive 2012/30/UE du Parlement européen et du Conseil du 25 octobre
    2012 tendant à coordonner, pour les rendre équivalentes, les garanties qui sont
    exigées dans les États membres des sociétés au sens de l'article 54, deuxième
    alinéa, du traité sur le fonctionnement de l'Union européenne, en vue de la
    protection des intérêts tant des associés que des tiers, en ce qui concerne
    la constitution de la société anonyme ainsi que le maintien et les modifications
    de son capital (refonte)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2012/30/EU des Europäischen Parlaments und des Rates vom 25.
    Oktober 2012 zur Koordinierung der Schutzbestimmungen, die in den Mitgliedstaaten
    den Gesellschaften im Sinne des Artikels 54 Absatz 2 des Vertrages über die Arbeitsweise
    der Europäischen Union im Interesse der Gesellschafter sowie Dritter für die
    Gründung der Aktiengesellschaft sowie für die Erhaltung und Änderung ihres
    Kapitals vorgeschrieben sind, um diese Bestimmungen gleichwertig zu gestalten
    (Neufassung)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2012/30/ЕС на Европейския парламент
    и на Съвета от 25 октомври 2012 година за съгласуване
    на гаранциите, които се изискват в държавите
    членки за дружествата по смисъла на член 54,
    втора алинея от Договора за функционирането
    на Европейския съюз, за защита на интересите
    както на съдружниците, така и на трети лица
    по отношение учредяването на акционерни дружества
    и поддържането и изменението на техния капитал
    с цел тези гаранции да станат равностойни (преработен
    текст)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2012/30/EU ze dne 25. října 2012
    o koordinaci ochranných opatření, která jsou na ochranu zájmů společníků
    a třetích osob vyžadována v členských státech od společností ve smyslu
    čl. 54 druhého pododstavce Smlouvy o fungování Evropské unie při zakládání
    akciových společností a při udržování a změně jejich základního kapitálu,
    za účelem dosažení rovnocennosti těchto opatření (přepracované znění)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2012/30/EU af 25. oktober 2012
    om samordning af de garantier, der kræves i medlemsstaterne af de i artikel 54,
    stk. 2, i traktaten om Den Europæiske Unions funktionsmåde, nævnte selskaber
    til beskyttelse af såvel selskabsdeltagernes som tredjemands interesser, for
    så vidt angår stiftelsen af aktieselskabet samt bevarelse af og ændringer i
    dets kapital, med det formål at gøre disse garantier lige byrdefulde (omarbejdning)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2012/30/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 25ης Οκτωβρίου 2012 , περί
    συντονισμού των εγγυήσεων που απαιτούνται
    στα κράτη μέλη εκ μέρους των εταιρειών, κατά
    την έννοια του άρθρου 54 δεύτερο εδάφιο της
    Συνθήκης για τη λειτουργία της Ευρωπαϊκής
    'Ενωσης, για την προστασία των συμφερόντων
    των εταίρων και των τρίτων, με σκοπό να καταστούν
    οι εγγυήσεις αυτές ισοδύναμες όσον αφορά τη
    σύσταση ανωνύμων εταιρειών και τη διατήρηση
    και τις μεταβολές του κεφαλαίου τους (αναδιατύπωση)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2012/30/EL, 25. oktoober 2012
    , tagatiste kooskõlastamise kohta, mida liikmesriigid äriühingu liikmete ja
    kolmandate isikute huvide kaitseks Euroopa Liidu toimimise lepingu artikli 54
    teises lõigus tähendatud äriühingutelt nõuavad seoses aktsiaseltside asutamise
    ning nende kapitali säilitamise ja muutmisega, et muuta sellised tagatised võrdväärseteks
    (uuesti sõnastatud)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2012/30/EU, annettu 25 päivänä
    lokakuuta 2012 , niiden takeiden yhteensovittamisesta samanveroisiksi, joita jäsenvaltioissa
    vaaditaan Euroopan unionin toiminnasta tehdyn sopimuksen 54 artiklan toisessa
    kohdassa tarkoitetuilta yhtiöiltä niiden jäsenten sekä ulkopuolisten etujen
    suojaamiseksi osakeyhtiöitä perustettaessa sekä niiden pääomaa säilytettäessä
    ja muutettaessa (uudelleenlaadittu)
  type: main
- language: hr
  script: Latn
  content: Direktiva 2012/30/EU Europskog parlamenta i Vijeća od 25. listopada 2012.
    o usklađivanju zaštitnih mehanizama koje, radi zaštite interesa članova i
    trećih osoba, države članice zahtijevaju od trgovačkih društava u smislu
    članka 54. drugog stavka Ugovora o funkcioniranju Europske unije, u pogledu osnivanja
    dioničkih društava te održavanja i promjene njihovog kapitala, a s ciljem ujednačavanja
    tih zaštitnih mehanizama (preinaka)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2012/30/EU irányelve ( 2012. október
    25. ) a biztosítékok egyenértékűvé tétele céljából a részvénytársaságok
    alapításának, valamint tőkéjük fenntartásának és módosításának tekintetében
    a tagállamok által a társasági tagok és harmadik személyek érdekei védelmében
    az Európai Unió működéséről szóló szerződés 54. cikkének második
    bekezdése szerinti társaságoknak előírt biztosítékok összehangolásáról
    (átdolgozás)
  type: main
- language: it
  script: Latn
  content: Direttiva 2012/30/UE del Parlamento europeo e del Consiglio, del 25 ottobre
    2012 , sul coordinamento delle garanzie che sono richieste, negli Stati membri,
    alle società di cui all'articolo 54, secondo paragrafo, del trattato sul funzionamento
    dell'Unione europea, per tutelare gli interessi dei soci e dei terzi per quanto
    riguarda la costituzione della società per azioni, nonché la salvaguardia e
    le modificazioni del capitale sociale della stessa (rifusione)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2012/30/ES ( 2012. gada 25. oktobris
    ) par to, kā vienādošanas nolūkā koordinēt nodrošinājumus, ko saistībā
    ar akciju sabiedrību veidošanu un to kapitāla saglabāšanu un mainīšanu
    dalībvalstis prasa no sabiedrībām Līguma par Eiropas Savienības darbību
    54. panta otrās daļas nozīmē, lai aizsargātu sabiedrību dalībnieku un trešo
    personu intereses (pārstrādāta redakcija)
  type: main
- language: lt
  script: Latn
  content: 2012 m. spalio 25 d. Europos Parlamento ir Tarybos Direktyva 2012/30/ES
    dėl apsaugos priemonių, kurių valstybės narės, siekdamos tokias priemones
    suvienodinti, reikalauja iš Sutarties dėl Europos Sąjungos veikimo 54 straipsnio
    antroje pastraipoje apibrėžtų bendrovių, jų narių ir kitų interesų apsaugai,
    akcines bendroves steigiant, palaikant ir keičiant jų kapitalą, koordinavimo
    (nauja redakcija)
  type: main
- language: mt
  script: Latn
  content: Direttiva 2012/30/UE tal-Parlament Ewropew u tal-Kunsill tal- 25 ta' Ottubru
    2012 dwar il-koordinazzjoni ta’ salvagwardji li, għall-protezzjoni tal-interessi
    ta’ membri u oħrajn, huma meħtieġa mill-Istati Membri ta' kumpanniji fis-sens
    tat-tieni paragrafu tal-Artikolu 54 tat-Trattat dwar il-Funzjonament tal-Unjoni
    Ewropea, dwar il-formazzjoni ta’ kumpanniji pubbliċi ta’ responsabbiltà
    limitata u ż-żamma u t-tibdil tal-kapital tagħhom, bil-għan li jagħmlu dawn
    is-salvagwardji ekwivalenti (riformulazzjoni)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2012/30/EU van het Europees Parlement en de Raad van 25 oktober
    2012 strekkende tot het coördineren van de waarborgen welke in de lidstaten worden
    verlangd van de vennootschappen in de zin van artikel 54, tweede alinea, van het
    Verdrag betreffende de werking van de Europese Unie, om de belangen te beschermen
    zowel van de deelnemers in deze vennootschappen als van derden met betrekking
    tot de oprichting van de naamloze vennootschap, alsook de instandhouding en wijziging
    van haar kapitaal, zulks teneinde die waarborgen gelijkwaardig te maken (herschikking)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2012/30/UE z dnia 25 października
    2012 r. w sprawie koordynacji gwarancji, jakie są wymagane w państwach członkowskich
    od spółek w rozumieniu art. 54 akapit drugi Traktatu o funkcjonowaniu Unii Europejskiej,
    w celu uzyskania ich równoważności, dla ochrony interesów zarówno wspólników,
    jak i osób trzecich w zakresie tworzenia spółki akcyjnej, jak również utrzymania
    i zmian jej kapitału (przekształcenie)
  type: main
- language: pt
  script: Latn
  content: Diretiva 2012/30/UE do Parlamento Europeu e do Conselho, de 25 de outubro
    de 2012 , tendente a coordenar as garantias que, para proteção dos interesses
    dos sócios e de terceiros, são exigidas nos Estados-Membros às sociedades,
    na aceção do segundo parágrafo do artigo 54. °do Tratado sobre o Funcionamento
    da União Europeia, no que respeita à constituição da sociedade anónima, bem
    como à conservação e às modificações do seu capital social, a fim de tornar
    equivalentes essas garantias em toda a Comunidade (reformulação)
  type: main
- language: ro
  script: Latn
  content: Directiva 2012/30/UE a Parlamentului European și a Consiliului din 25
    octombrie 2012 de coordonare, în vederea echivalării, a garanțiilor impuse
    societăților comerciale în statele membre, în înțelesul articolului 54 al
    doilea paragraf din Tratatul privind funcționarea Uniunii Europene, pentru protejarea
    intereselor asociaților sau terților, în ceea ce privește constituirea societăților
    comerciale pe acțiuni și menținerea și modificarea capitalului acestora (reformare)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2012/30/EÚ z 25. októbra 2012
    o koordinácii ochranných opatrení, ktoré členské štáty vyžadujú od obchodných
    spoločností na ochranu záujmov spoločníkov a tretích osôb v zmysle druhého
    odseku článku 54 Zmluvy o fungovaní Európskej únie, pokiaľ ide o zakladanie
    akciových spoločností a udržiavanie a zmenu ich základného imania, s cieľom
    dosiahnuť rovnocennosť týchto opatrení (prepracované znenie)
  type: main
- language: sl
  script: Latn
  content: Direktiva 2012/30/EU Evropskega parlamenta in Sveta z dne 25. oktobra 2012
    o uskladitvi zaščitnih ukrepov za varovanje interesov družbenikov in tretjih
    oseb, ki jih države članice zahtevajo od gospodarskih družb v pomenu drugega
    odstavka člena 54 Pogodbe o delovanju Evropske unije, glede ustanavljanja delniških
    družb ter ohranjanja in spreminjanja njihovega kapitala, zato da se oblikujejo
    zaščitni ukrepi z enakim učinkom v vsej Skupnosti (prenovitev)
  type: main
- language: es
  script: Latn
  content: Directiva 2012/30/UE del Parlamento Europeo y del Consejo, de 25 de octubre
    de 2012 , tendente a coordinar, para hacerlas equivalentes, las garantías exigidas
    en los Estados miembros a las sociedades, definidas en el artículo 54, párrafo
    segundo, del Tratado de Funcionamiento de la Unión Europea, con el fin de proteger
    los intereses de los socios y terceros, en lo relativo a la constitución de la
    sociedad anónima, así como al mantenimiento y modificaciones de su capital (versión
    refundida)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2012/30/EU av den 25 oktober 2012
    om samordning av de skyddsåtgärder som krävs i medlemsstaterna av de i artikel
    54 andra stycket i fördraget om Europeiska unionens funktionssätt avsedda bolagen
    i bolagsmännens och tredje mans intressen när det gäller att bilda ett aktiebolag
    samt att bevara och ändra dettas kapital, i syfte att göra skyddsåtgärderna
    likvärdiga (omarbetning)
  type: main
