title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3319/94 of 22 December 1994 imposing a definitive
    anti-dumping duty on imports of urea ammonium nitrate solution originating in
    Bulgaria and Poland, exported by companies not exempted from the duty, and collecting
    definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3319/94 du Conseil, du 22 décembre 1994, instituant
    un droit antidumping définitif sur les importations de mélange d'urée et de
    nitrate d'ammonium en solution originaire de Bulgarie et de Pologne, exporté
    par des sociétés autres que celles qui sont exemptées du droit, et portant
    perception définitive des montants garantis par le droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3319/94 des Rates vom 22. Dezember 1994 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Lösungen von Harnstoff
    und Ammoniumnitrat mit Ursprung in Bulgarien und Polen, die von zollpflichtigen
    Unternehmen exportiert werden, und zur endgültigen Vereinnahmung des vorläufigen
    Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3319/94 af 22. december 1994 om indførelse
    af en endelig antidumpingtold på importen af opløsninger af urinstof og ammoniumnitrat
    med oprindelse i Bulgarien og Polen eksporteret af selskaber, der ikke er fritaget
    for tolden, og om endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3319/94 του Συμβουλίου
    της 22ας Δεκεμβρίου 1994 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές μείγματος
    ουρίας και νιτρικού αμμωνίου σε υδατικά ή αμμωνιακά
    διαλύματα καταγωγής Βουλγαρίας και Πολωνίας,
    εξαγομένων από εταιρείες που δεν εξαιρούνται
    του δασμού, και για την οριστική είσπραξη των
    προσωρινών δασμών που επιβλήθηκαν
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3319/94, annettu 22 päivänä joulukuuta 1994,
    lopullisen polkumyyntitullin käyttöön ottamisesta Bulgariasta ja Puolasta peräisin
    olevan tästä tullista vapauttamattomien yhtiöiden viemän virtsa-aineen (urean)
    ja ammoniumnitraatin liuosseoksen tuonnissa ja väliaikaisen tullin vakuutena
    olleiden määrien lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3319/94 del Consiglio, del 22 dicembre 1994, che istituisce
    un dazio antidumping definitivo sulle importazioni di soluzioni di urea e nitrato
    di ammonio originarie della Bulgaria e della Polonia, esportate da imprese non
    esentate dal dazio, e che decide la riscossione definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3319/94 van de Raad van 22 december 1994 tot instelling
    van een definitief anti-dumpingrecht op de invoer van oplossingen van ureum en
    ammoniumnitraat van oorsprong uit Bulgarije en Polen, uitgevoerd door firma's
    die niet vrijgesteld zijn van het anti-dumpingrecht, en tot definitieve inning
    van het voorlopige recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3319/94 do Conselho, de 22 de Dezembro de 1994, que
    cria um direito anti-dumping definitivo sobre as importações de solução de
    ureia e nitrato de amónio originária da Bulgária e da Polónia, e que procede
    à cobrança definitiva do direito provisório da referida mercadoria exportada
    por empresas não isentas do respectivo direito
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3319/94 del Consejo, de 22 de diciembre de 1994, por
    el que se establece un derecho antidumping definitivo sobre las importaciones
    de mezcla de urea con nitrato de amonio en disolución originaria de Bulgaria
    y Polonia, exportada por empresas no exentas del derecho, y por el que se percibe
    definitivamente el derecho provisional establecido
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 3319/94 av den 22 december 1994 om slutgiltig
