title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2598/2000 of 28 November 2000 determining
    the quantities for 2001 for which the annual allocations for newcomer operators
    are granted under the import tariff quotas and under the quantity of traditional
    ACP bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2598/2000 de la Commission du 28 novembre 2000 déterminant
    les quantités pour lesquelles les allocations annuelles aux «opérateurs nouveaux
    arrivés» sont octroyées, pour l'année 2001, dans le cadre des contingents
    tarifaires à l'importation et de la quantité de bananes traditionnelles ACP
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2598/2000 der Kommission vom 28. November 2000 zur
    Festsetzung der den "neuen Marktbeteiligten" im Rahmen der Einfuhrzollkontingente
    und der traditionellen AKP-Bananen für das Jahr 2001 zuzuteilenden Jahresmengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2598/2000 af 28. november 2000 om fastlæggelse
    af de årlige tildelinger til de nytilkomne erhvervsdrivende for 2001 i forbindelse
    med toldkontingenterne og mængden af traditionelle AVS-bananer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2598/2000 της Επιτροπής,
    της 28ης Νοεμβρίου 2000, περί καθορισμού των ποσοτήτων
    για τις οποίες χορηγούνται ετήσιες κατανομές
    στους «νεοεμφανιζόμενους εμπορικούς φορείς»,
    για το έτος 2001, στο πλαίσιο των δασμολογικών
    ποσοστώσεων εισαγωγής και της ποσότητας παραδοσιακών
    μπανανών ΑΚΕ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2598/2000, annettu 28 päivänä marraskuuta
    2000, tuontitariffikiintiöiden ja AKT-banaanien perinteisten määrien osana
    uusille toimijoille vuodeksi 2001 myönnettävistä vuosittaisista määristä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2598/2000 della Commissione, del 28 novembre 2000,
    che determina i quantitativi per i quali sono concesse, per il 2001, le assegnazioni
    annuali agli «operatori nuovi arrivati» nel quadro dei contingenti tariffari
    all'importazione e delle banane ACP tradizionali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2598/2000 van de Commissie van 28 november 2000 tot
    bepaling van de hoeveelheden waarvoor voor het jaar 2001 de jaarlijkse toewijzingen
    voor de invoer in het kader van de tariefcontingenten en de invoer van de hoeveelheid
    traditionele ACS-bananen aan de marktdeelnemers-nieuwkomers worden toegekend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2598/2000 da Comissão, de 28 de Novembro de 2000,
    que determina as quantidades em relação às quais são concedidas, em 2001,
    as atribuições anuais aos novos operadores, no âmbito dos contingentes pautais
    de importação e da quantidade de bananas tradicionais ACP
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2598/2000 de la Comisión, de 28 de noviembre de 2000,
    por el que se fijan las cantidades por las que se conceden las asignaciones anuales
    a los «operadores recién llegados», para el año 2001, en el marco de los contingentes
    arancelarios de importación y de la cantidad de plátanos tradicionales ACP
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2598/2000 av den 28 november 2000 om
