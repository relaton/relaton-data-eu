id: EUDecision1977762
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 30 March 1977 authorizing the French Republic not
    to apply Community treatment to shirts, except of silk, of noil or of other waste
    silk of flax and ramie falling within heading No ex 61.03 of the Common Customs
    Tariff, originating in the Republic of Korea and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '77/762/CEE: Décision de la Commission, du 30 mars 1977, autorisant la
    République française à exclure du traitement communautaire les chemises et
    chemisettes autres que de soie, de bourre de soie (schappes), bourrette de soie,
    lin ou ramie, de la position Ex 61.03 du Tarif douanier commun, originaires de
    la République de Corée et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. März 1977, mit der die Französische
    Republik ermächtigt wird, aus der Republik Korea stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden,
    andere als aus Seide, Schappeseide oder Bourretteseide, oder aus Flachs und Ramie,
    der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. marts 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage skjorter (herunder sports-
    og arbejdsskjorter) undtagen af natursilke, herunder schappesilke eller bourettesilke,
    eller hør og ramie, som henhører under pos. 61.03 i den fælles toldtarif, har
    oprindelse i republikken Korea og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 marzo 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le camicie e camicette diverse
    da quelle di seta o di cascami di seta o di lino e ramiè della voce ex 61.03
    della tariffa doganale comune, originarie della Repubblica di Corea e messe in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 maart 1977 waarbij de Franse Republiek
    wordt gemachtigd overhemden en sporthemden andere dan van zijde, van vlokzijde
    of van bourrette of van vlas en ramee van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Republiek Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
