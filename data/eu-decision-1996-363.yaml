id: EUDecision1996363
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '96/363/EC: Commission Decision of 13 May 1996 amending Decision 96/169/EC
    concerning the dates to be fixed by Member States for the submission of ''area''
    aid applications under the integrated administration and control system for certain
    Community aid schemes (the ''integrated system'') (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/363/CE: Décision de la Commission du 13 mai 1996 modifiant la décision
    96/169/CE relative aux dates à fixer par les États membres pour la présentation
    des demandes d''aides «surfaces» dans le cadre du système intégré de gestion
    et de contrôle relatif à certains régimes d''aides communautaires («système
    intégré») (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/363/EG: Entscheidung der Kommission vom 13. Mai 1996 zur Änderung
    der Entscheidung 96/169/EG über die von den Mitgliedstaaten zu bestimmenden Zeitpunkte
    für die Stellung der Beihilfeanträge "Flächen" im Rahmen des integrierten Verwaltungs-
    und Kontrollsystems für bestimmte gemeinschaftliche Beihilferegelungen ("integriertes
    System") (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/363/EF: Kommissionens beslutning af 13. maj 1996 om ændring af beslutning
    96/169/EF om de frister, som medlemsstaterne skal fastsætte for indgivelse af
    ansøgninger om arealstøtte i forbindelse med det integrerede system for forvaltning
    og kontrol af visse EF-støtteordninger (»det integrerede system«) (Kun den
    engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/363/ΕΚ: Απόφαση της Επιτροπής της 13ης Μαΐου
    1996 σχετικά με τις ημερομηνίες που πρέπει να
    καθορισθούν από τα κράτη μέλη για την υποβολή
    των αιτήσεων για ενίσχυση «εκτάσεις» στο πλαίσιο
    του ολοκληρωμένου συστήματος διαχείρισης
    και ελέγχου σχετικά με ορισμένα καθεστώτα
    κοινοτικών ενισχύσεων (ολοκληρωμένο σύστημα)
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/363/EY: Komission päätös, tehty 13 päivänä toukokuuta 1996, päätöksen
    96/169/EY muuttamiseksi jäsenvaltioiden asettamista tiettyjen yhteisön tukiohjelmien
    integroidun hallinto- ja valvontajärjestelmän ("integroidun järjestelmän")
    nojalla tehtyjen "alue"-tukea koskevien hakemusten esittämispäivämääristä
    (Ainoastaan englanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/363/CE: Decisione della Commissione del 13 maggio 1996 che modifica
    la decisione 96/169/CE relativa alle date che gli Stati membri devono stabilire
    per la presentazione delle domande di aiuto «superfici» nel quadro del sistema
    integrato di gestione e di controllo di taluni regimi di aiuti comunitari («sistema
    integrato») (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/363/EG: Beschikking van de Commissie van 13 mei 1996 tot wijziging
    van Beschikking 96/169/EG inzake de door de Lid-Staten vast te stellen data voor
    de indiening van de steunaanvragen "oppervlakten" in het kader van het geïntegreerd
    beheers- en controlesysteem voor bepaalde communautaire steunregelingen ("geïntegreerd
    systeem") (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/363/CE: Decisão da Comissão de 13 de Maio de 1996 que modifica a
    Decisão 96/169/CE, relativa às datas a fixar pelos Estados-membros para a apresentação
    dos pedidos de ajudas «superfícies» no âmbito do sistema integrado de gestão
    e de controlo relativo a determinados regimes de ajudas comunitárias («sistema
    integrado») (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '96/363/CE: Decisión de la Comisión de 13 de mayo de 1996 por la que
    se modifica la Decisión 96/169/CE relativa a las fechas de presentación de las
    solicitudes de ayuda «superficies» que los Estados miembros deben fijar dentro
    del sistema integrado de gestión y control de determinados regímenes de ayuda
    comunitarios («sistema integrado») (El texto en lengua inglesa es el único
    auténtico)'
  type: main
- language: sv
  script: Latn
  content: '96/363/EG: Kommissionens beslut av den 13 maj 1996 om ändring av beslut
    96/169/EG om de datum som skall bestämmas av medlemsstaterna för inlämnandet
    av ansökningar för arealstöd under det integrerade systemet för administration
    och kontroll av vissa stödsystem för gemenskapen ("integrerat system") (Endast
    den engelska texten är giltig)'
  type: main
