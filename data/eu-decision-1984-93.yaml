title:
- language: en
  script: Latn
  content: '84/93/EEC: Commission Decision of 6 February 1984 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain woven fabrics
    of synthetic textile fibres, originating in Indonesia, which have been put into
    free circulation in the Community (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/93/CEE: Décision de la Commission du 6 février 1984 autorisant la
    République française à procéder à une surveillance intracommunautaire des
    importations de certains tissus de fibres textiles synthétiques originaires d''Indonésie
    et mis en libre pratique dans la Communauté (Le texte en langue française est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/93/EWG: Entscheidung der Kommission vom 6. Februar 1984 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren bestimmter aus Indonesien stammender und in der Gemeinschaft im
    freien Verkehr befindlicher Gewebe aus synthetischen Spinnfasern (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/93/EØF: Kommissionens beslutning 6. februar 1984 om bemyndigelse af
    Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførslen
    af visse vævede stoffer af syntetiske fibre, der har oprindelse i Indonesien
    og er overgået til fri omsætning i Fællesskabet (Kun den franske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/93/ΕΟΚ: Απόφαση της Επιτροπής της 6ης Φεβρουαρίου
    1984 για τη χορήγηση αδείας στη Γαλλική Δημοκρατία
    να προβεί σε ενδοκοινοτική επιτήρηση των εισαγωγών
    ορισμένων υφασμάτων εκ συνθετικών υφαντικών
    ινών καταγωγής Ινδονησίας, που τίθενται σε
    ελεύθερη κυκλοφορία στην Κοινότητα (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/93/CEE: Decisione della Commissione del 6 febbraio 1984 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni tessuti di fibre tessili sintetiche originari dell''Indonesia e messi
    in libera pratica nella Comunità (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '84/93/EEG: Beschikking van de Commissie van 6 februari 1984 houdende machtiging
    van de Franse Republiek tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van bepaalde weefsels van synthetische stapelvezels van
    oorsprong uit Indonesië, die in de Gemeenschap in het vrije verkeer zijn gebracht
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
