title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2272/92 of 3 August 1992 re-establishing
    the levying of customs duties on products of categories 90 and 100 (order No 40.0900
    and 40.1000), originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2272/92 de la Commission du 3 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    90 et 100 (numéro d'ordre 40.0900 et 40.1000) originaires de Corée du Sud, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2272/92 DER KOMMISSION vom 3. August 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorien Nrn. 90 und 90 und 100 (laufende
    Nummern 40.0900 und 40.1000) mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2272/92 af 3. august 1992 om genindførelse
