title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3616/89 of 1 December 1989 amending Regulation
    (EEC) No 1328/89 authorizing Italy not to apply in certain areas the measures
    provided for in Council Regulation (EEC) No 1442/88 as regards the granting of
    permanent abandonment premiums in respect of wine-growing areas for the 1989/90
    to 1995/96 wine years
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3616/89 de la Commission du 1er décembre 1989 modifiant
    le règlement (CEE) n° 1328/89 autorisant l'Italie à ne pas appliquer dans certaines
    zones les mesures prévues au règlement (CEE) n° 1442/88 du Conseil, relatif
    à l'octroi de primes d'abandon définitif de superficies viticoles, pour les
    campagnes viticoles 1989/1990 à 1995/1996
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3616/89 DER KOMMISSION vom 1. Dezember 1989 zur Änderung
    der Verordnung (EWG) Nr. 1328/89 zur Ermächtigung Italiens, in bestimmten Gebieten
    die mit der Verordnung (EWG) Nr. 1442/88 des Rates über die Gewährung von Prämien
    zur endgültigen Aufgabe von Rebflächen vorgesehenen Maßnahmen in den Weinwirtschaftsjahren
    1989/90 bis 1995/96 nicht anzuwenden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3616/89 af 1. december 1989 om ændring
    af forordning (EØF) nr. 1328/89 om bemyndigelse af Italien til i visse zoner
    ikke at anvende foranstaltningerne i Rådets forordning (EØF) nr. 1442/88 om
    ydelse for produktionsårene 1989/90 til 1995/96 af præmier for endelig nedlæggelse
    af vinarealer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3616/89 της Επιτροπής
    της 1ης Δεκεμβρίου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 1328/89 που εξουσιοδοτεί την Ιταλία
    να μην εφαρμόσει σε ορισμένες ζώνες τα μέτρα
    που προβλέπονται στον κανονισμό (ΕΟΚ) αριθ.
    1442/88 του Συμβουλίου σχετικά με τη χορήγηση
    πριμοδοτήσεων για την οριστική εγκατάλειψη
    των αμπελουργικών εκτάσεων για τις αμπελουργικές
    περιόδους 1989/90 έως 1995/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3616/89, annettu 1 päivänä joulukuuta 1989,
    luvan antamisesta Italialle olla noudattamatta tietyillä alueilla lopullista
    viininviljelyaloista luopumista koskevan palkkion myöntämisestä viinivuosiksi
    1989/1990-1995/1996 annetussa neuvoston asetuksessa (ETY) N:o 1442/88 säädettyjä
    toimenpiteitä annetun asetuksen (ETY) N:o 1328/89 muuttamisesta
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3616/89 DELLA COMMISSIONE del 1o dicembre 1989 che
    modifica il regolamento (CEE) n. 1328/89 che autorizza l'' Italia a non applicare
    in alcune zone le misure di cui al regolamento (CEE) n. 1442/88, relativo alla
    concessione, per le campagne viticole 1989/1990-1995/1996, di premi di abbandono
    definitivo di superfici viticole #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3616/89 VAN DE COMMISSIE van 1 december 1989 tot
    wijziging van Verordening (EEG) nr. 1328/89 waarbij Italië wordt gemachtigd in
