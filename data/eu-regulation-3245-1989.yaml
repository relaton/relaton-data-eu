    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3245/89 af 27. oktober 1989 om fastsættelse
