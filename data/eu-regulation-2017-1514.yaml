    o no declarados originarios de la India e Indonesia], con objeto de determinar
    la posibilidad de eximir de tales medidas a un productor exportador indio, de
    derogar el derecho antidumping con respecto a las importaciones procedentes de
    ese productor exportador y de someter estas importaciones a la obligación de
    registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/1514 av den 31 augusti
    2017 om inledande av en översyn av rådets genomförandeförordning (EU) nr 1371/2013
    (om utvidgning av den slutgiltiga antidumpningstull som genom genomförandeförordning
    (EU) nr 791/2011 införts på import av vissa glasfibervävnader med öppna maskor
    med ursprung i Folkrepubliken Kina till att även omfatta import av vissa glasfibervävnader
    med öppna maskor vilken avsänts från Indien och Indonesien, oavsett om produkternas
    deklarerade ursprung är Indien och Indonesien eller inte) i syfte att fastställa
    om det är möjligt att bevilja en indisk exporterande tillverkare befrielse från
    dessa åtgärder, om upphävande av antidumpningstullen avseende import från
    den exporterande tillverkaren och om registrering av import från den exporterande
    tillverkaren
  type: main
