---
id: EURegulation20251949
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1949 of 29 September 2025
    amending Implementing Regulation (EU) 2018/2019 as regards certain plants for
    planting of Prunus cerasus and Prunus canescens originating in Ukraine and certain
    plants for planting of Prunus armeniaca, Prunus cerasifera, Prunus domestica,
    Prunus incisa and Prunus persica originating in the United Kingdom and amending
    Implementing Regulation (EU) 2020/1213 as regards the phytosanitary measures for
    the introduction into the Union territory of those plants originating in the United
    Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1949 de la Commission du 29 septembre
    2025 modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne
    certains végétaux destinés à la plantation appartenant aux espèces Prunus
    cerasus et Prunus canescens originaires d’Ukraine et certains végétaux destinés
    à la plantation appartenant aux espèces Prunus armeniaca, Prunus cerasifera,
    Prunus domestica, Prunus incisa et Prunus persica originaires du Royaume-Uni,
    et modifiant le règlement d’exécution (UE) 2020/1213 en ce qui concerne les
    mesures phytosanitaires requises pour l’introduction sur le territoire de l’Union
    desdits végétaux originaires du Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1949 der Kommission vom 29. September
    2025 zur Änderung der Durchführungsverordnung (EU) 2018/2019 hinsichtlich bestimmter
    zum Anpflanzen bestimmter Pflanzen von Prunus cerasus und Prunus canescens mit
    Ursprung in der Ukraine und bestimmter zum Anpflanzen bestimmter Pflanzen von
    Prunus armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa und Prunus
    persica mit Ursprung im Vereinigten Königreich sowie zur Änderung der Durchführungsverordnung
    (EU) 2020/1213 hinsichtlich der Pflanzenschutzmaßnahmen für das Einführen dieser
    Pflanzen mit Ursprung im Vereinigten Königreich in das Gebiet der Union
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1949 на Комисията
    от 29 септември 2025 година за изменение на Регламент
    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от видовете Prunus cerasus
    и Prunus canescens с произход от Украйна и някои растения
    за засаждане от видовете Prunus armeniaca, Prunus cerasifera,
    Prunus domestica, Prunus incisa и Prunus persica с произход от Обединеното
    кралство и за изменение на Регламент за изпълнение
    (ЕС) 2020/1213 по отношение на фитосанитарните мерки
    за въвеждането на територията на Съюза на посочените
    растения с произход от Обединеното кралство
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1949 ze dne 29. září 2025,
    kterým se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé
    rostliny k pěstování druhů Prunus cerasus a Prunus canescens pocházející
    z Ukrajiny a některé rostliny k pěstování druhů Prunus armeniaca, Prunus
    cerasifera, Prunus domestica, Prunus incisa a Prunus persica pocházející ze
    Spojeného království, a prováděcí nařízení (EU) 2020/1213, pokud jde
    o fytosanitární opatření pro dovoz uvedených rostlin pocházejících ze
    Spojeného království na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/1949 af 29. september
    2025 om ændring af gennemførelsesforordning (EU) 2018/2019 for så vidt angår
    visse planter til plantning af Prunus cerasus og Prunus canescens med oprindelse
    i Ukraine samt visse planter til plantning af Prunus armeniaca, Prunus cerasifera,
    Prunus domestica, Prunus incisa og Prunus persica med oprindelse i Det Forenede
    Kongerige og om ændring af gennemførelsesforordning (EU) 2020/1213 for så vidt
    angår de plantesundhedsmæssige foranstaltninger for indførsel til Unionen af
    disse planter med oprindelse i Det Forenede Kongerige
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2025/1949 της Επιτροπής,
    της 29ης Σεπτεμβρίου 2025, για την τροποποίηση
    του εκτελεστικού κανονισμού (ΕΕ) 2018/2019 όσον
    αφορά ορισμένα φυτά προς φύτευση των ειδών
    Prunus cerasus και Prunus canescens καταγωγής Ουκρανίας και
    ορισμένα φυτά προς φύτευση των ειδών Prunus armeniaca,
    Prunus cerasifera, Prunus domestica, Prunus incisa και Prunus persica καταγωγής
    Ηνωμένου Βασιλείου, και για την τροποποίηση
    του εκτελεστικού κανονισμού (ΕΕ) 2020/1213 όσον
    αφορά τα φυτοϋγειονομικά μέτρα για την είσοδο
    των εν λόγω φυτών καταγωγής Ηνωμένου Βασιλείου
    στο έδαφος της Ένωσης
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/1949, 29. september 2025, millega
    muudetakse rakendusmäärust (EL) 2018/2019 teatavate liikidesse Prunus cerasus
    ja Prunus canescens kuuluvate Ukrainast pärit istutamiseks ettenähtud taimede
    osas ja liikidesse Prunus armeniaca, Prunus cerasifera, Prunus domestica, Prunus
    incisa ja Prunus persica kuuluvate Ühendkuningriigist pärit istutamiseks ettenähtud
    taimede osas ning rakendusmäärust (EL) 2020/1213 kõnealuste Ühendkuningriigist
    pärit taimede liidu territooriumile sissetoomisel kehtivate fütosanitaarmeetmete
    osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/1949, annettu 29 päivänä
    syyskuuta 2025, täytäntöönpanoasetuksen (EU) 2018/2019 muuttamisesta tiettyjen
    Ukrainasta peräisin olevien Prunus cerasus- ja Prunus canescens -lajien istutettaviksi
    tarkoitettujen kasvien ja tiettyjen Yhdistyneestä kuningaskunnasta peräisin
    olevien Prunus armeniaca-, Prunus cerasifera-, Prunus domestica-, Prunus incisa-
    ja Prunus persica -lajien istutettaviksi tarkoitettujen kasvien osalta ja täytäntöönpanoasetuksen
    (EU) 2020/1213 muuttamisesta siltä osin kuin on kyse Yhdistyneestä kuningaskunnasta
    peräisin olevien kyseisten kasvien tuontia unionin alueelle koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/1949 ón gCoimisiún an 29 Meán
    Fómhair 2025 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid
    a bhaineann le plandaí áirithe Prunus cerasus agus Prunus canescens le haghaidh
    plandú de thionscnamh na hÚcráine agus plandaí áirithe Prunus armeniaca,
    Prunus cerasifera, Prunus domestica, Prunus incisa agus Prunus persica le haghaidh
    plandú de thionscnamh na Ríochta Aontaithe, agus lena leasaítear Rialachán
    Cur Chun Feidhme (AE) 2020/1213 a mhéid a bhaineann leis na bearta fíteashláintíochta
    chun na plandaí sin le haghaidh plandú a thabhairt isteach san Aontas
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/1949 оd 29. rujna 2025. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrsta Prunus
    cerasus i Prunus canescens podrijetlom iz Ukrajine i određenog bilja za sadnju
    vrsta Prunus armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa i Prunus
    persica podrijetlom iz Ujedinjene Kraljevine te o izmjeni Provedbene uredbe (EU)
    2020/1213 u pogledu fitosanitarnih mjera za unos na područje Unije tog bilja
    podrijetlom iz Ujedinjene Kraljevine
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1949 végrehajtási rendelete (2025. szeptember
    29.) az (EU) 2018/2019 végrehajtási rendeletnek a Prunus cerasus és a Prunus
    canescens bizonyos, Ukrajnából származó, ültetésre szánt növényei, valamint
    a Prunus armeniaca, a Prunus cerasifera, a Prunus domestica, a Prunus incisa és
    a Prunus persica bizonyos, az Egyesült Királyságból származó, ültetésre
    szánt növényei tekintetében történő módosításáról, továbbá az (EU)
    2020/1213 végrehajtási rendeletnek az Egyesült Királyságból származó említett
    növények Unió területére történő behozatalára vonatkozó növényegészségügyi
    intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1949 della Commissione, del 29 settembre
    2025, che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Prunus cerasus e Prunus canescens originarie dell’Ucraina
    e alcune piante da impianto di Prunus armeniaca, Prunus cerasifera, Prunus domestica,
    Prunus incisa e Prunus persica originarie del Regno Unito, e il regolamento di
    esecuzione (UE) 2020/1213 per quanto riguarda le misure fitosanitarie per l’introduzione
    nel territorio dell’Unione di tali piante originarie del Regno Unito
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1949 (2025. gada 29. septembris),
    ar ko attiecībā uz noteiktiem stādāmiem Prunus cerasus un Prunus canescens
    augiem, kuru izcelsme ir Ukrainā, un noteiktiem stādāmiem Prunus armeniaca,
    Prunus cerasifera, Prunus domestica, Prunus incisa un Prunus persica augiem, kuru
    izcelsme ir Apvienotajā Karalistē, groza Īstenošanas regulu (ES) 2018/2019
    un ar ko attiecībā uz fitosanitārajiem pasākumiem minēto Apvienotās Karalistes
    izcelsmes augu ievešanai Savienības teritorijā groza Īstenošanas regulu (ES)
    2020/1213
  type: main
- language: lt
  script: Latn
  content: 2025 m. rugsėjo 29 d. Komisijos įgyvendinimo reglamentas (ES) 2025/1949,
    kuriuo dėl tam tikrų Ukrainos kilmės sodinti skirtų Prunus cerasus ir Prunus
    canescens augalų ir tam tikrų Jungtinės Karalystės kilmės sodinti skirtų
    Prunus armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa ir Prunus
    persica augalų iš dalies keičiamas Įgyvendinimo reglamentas (EU) 2018/2019
    ir dėl fitosanitarinių priemonių, taikomų tiems į Sąjungos teritoriją įvežti
    skirtiems Jungtinės Karalystės kilmės augalams, iš dalies keičiamas Įgyvendinimo
    reglamentas (ES) 2020/1213
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/1949 tad-29
    ta’ Settembru 2025 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2018/2019
    fir-rigward ta’ ċerti pjanti għat-tħawwil ta-Prunus cerasus u l-Prunus canescens
    li joriġinaw mill-Ukrajna u ċerti pjanti għat-tħawwil tal-Prunus armeniaca,
    il-Prunus cerasifera, il-Prunus domestica, il-Prunus incisa u l-Prunus persica
    li joriġinaw mir-Renju Unit u li jemenda r-Regolament ta’ Implimentazzjoni
    (UE) 2020/1213 fir-rigward tal-miżuri fitosanitarji għall-introduzzjoni fit-territorju
    tal-Unjoni ta’ dawk il-pjanti li joriġinaw mir-Renju Unit
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/1949 van de Commissie van 29 september
    2025 tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde
    voor opplant bestemde planten van de soorten Prunus cerasus en Prunus canescens
    afkomstig uit Oekraïne en bepaalde voor opplant bestemde planten van de soorten
    Prunus armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa en Prunus
    persica afkomstig uit het Verenigd Koninkrijk en tot wijziging van Uitvoeringsverordening
    (EU) 2020/1213 wat betreft het binnenbrengen in de Unie van die planten afkomstig
    uit het Verenigd Koninkrijk
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/1949 z dnia 29 września 2025
    r. zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do niektórych
    roślin gatunków Prunus cerasus i Prunus canescens przeznaczonych do sadzenia,
    pochodzących z Ukrainy oraz niektórych roślin gatunków Prunus armeniaca, Prunus
    cerasifera, Prunus domestica, Prunus incisa i Prunus persica przeznaczonych do
    sadzenia, pochodzących ze Zjednoczonego Królestwa oraz zmieniające rozporządzenie
    wykonawcze (UE) 2020/1213 w odniesieniu do środków fitosanitarnych do celów
    wprowadzania na terytorium Unii tych roślin pochodzących ze Zjednoczonego Królestwa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1949 da Comissão, de 29 de setembro
    de 2025, que altera o Regulamento de Execução (UE) 2018/2019, no que diz respeito
    a determinados vegetais para plantação de Prunus cerasus e Prunus canescens
    , originários da Ucrânia, e a determinados vegetais para plantação de Prunus
    armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa e Prunus persica,
    originários do Reino Unido, e o Regulamento de Execução (UE) 2020/1213, no
    que diz respeito às medidas fitossanitárias para a introdução desses vegetais
    originários do Reino Unido no território da União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1949 al Comisiei din 29 septembrie
    2025 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării de Prunus cerasus și Prunus
    canescens originare din Ucraina și anumite plante destinate plantării de Prunus
    armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa și Prunus persica
    originare din Regatul Unit și a Regulamentului de punere în aplicare (UE) 2020/1213
    în ceea ce privește măsurile fitosanitare pentru introducerea pe teritoriul
    Uniunii a respectivelor plante destinate plantării
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1949 z 29. septembra 2025, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    určené na výsadbu patriace k druhom Prunus cerasus a Prunus canescens pochádzajúce
    z Ukrajiny a určité rastliny určené na výsadbu patriace k druhom Prunus armeniaca,
    Prunus cerasifera, Prunus domestica, Prunus incisa a Prunus persica pochádzajúce
    zo Spojeného kráľovstva, a ktorým sa mení vykonávacie nariadenie (EÚ) 2020/1213,
    pokiaľ ide o rastlinolekárske opatrenia v súvislosti so vstupom uvedených
    rastlín určených na výsadbu pochádzajúcich zo Spojeného kráľovstva na
    územie Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1949 z dne 29. septembra 2025 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Prunus cerasus
    in Prunus canescens s poreklom iz Ukrajine in nekaterih rastlin za saditev Prunus
    armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa in Prunus persica
    s poreklom iz Združenega kraljestva ter o spremembi Izvedbene uredbe (EU) 2020/1213
    glede fitosanitarnih ukrepov za vnos navedenih rastlin s poreklom iz Združenega
    kraljestva na ozemlje Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1949 de la Comisión, de 29 de septiembre
    de 2025, por el que se modifican el Reglamento de Ejecución (UE) 2018/2019 en
    lo relativo a determinados vegetales para plantación de Prunus cerasus y Prunus
    canescens originarios de Ucrania, así como determinados vegetales para plantación
    de Prunus armeniaca, Prunus cerasifera, Prunus domestica, Prunus incisa y Prunus
    persica originarios del Reino Unido, y el Reglamento de Ejecución (UE) 2020/1213
    en lo relativo a las medidas fitosanitarias para la introducción en la Unión
    de dichos vegetales originarios del Reino Unido
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1949 av den 29 september
    2025 om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa
    växter för plantering av Prunus cerasus och Prunus canescens med ursprung i
    Ukraina och vissa växter för plantering av Prunus armeniaca, Prunus cerasifera,
    Prunus domestica, Prunus incisa och Prunus persica med ursprung i Förenade kungariket,
    och om ändring av genomförandeförordning (EU) 2020/1213 vad gäller växtskyddsåtgärder
    för införsel till unionens territorium av dessa växter med ursprung i Förenade
    kungariket
  type: main
