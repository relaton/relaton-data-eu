  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1188/81, annettu 28 päivänä huhtikuuta 1981,
    tiettyinä alkoholijuomina vietävien viljojen mukautettujen tukien myöntämistä
    koskevista yleisistä säännöistä ja tukien määrän vahvistamisen perusteista
    sekä asetuksen (ETY) N:o 3035/80 muuttamisesta tiettyjen perustamissopimuksen
    liitteeseen II kuulumattomien tavaroiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1188/81 del Consiglio, del 28 aprile 1981, che stabilisce
    alcune norme generali relative alla concessione di restituzioni speciali per i
    cereali esportati sotto forma di determinate bevande alcoliche, nonché i criteri
    di fissazione del loro importo, e che modifica il regolamento (CEE) n. 3035/80
    per quanto riguarda alcune merci non comprese nell' allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1188/81 van de Raad van 28 april 1981 tot vaststelling
    van de algemene voorschriften voor de toekenning van aangepaste restituties voor
    in de vorm van bepaalde alcoholhoudende dranken uitgevoerde granen en van de criteria
    voor de vaststelling van het restitutiebedrag, en tot wijziging van Verordening
    (EEG) nr. 3035/80 ten aanzien van bepaalde goederen die niet onder bijlage II
    van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1188/81 do Conselho, de 28 de Abril de 1981, que
    estabelece regras gerais relativas à concessão de restituições adaptadas para
    os cereais exportados sob a forma de certas bebidas espirituosas, bem como os
    critérios de fixação do seu montante, e altera o Regulamento (CEE) n.° 3035/80
    no que respeita a certas mercadorias não sujeitas ao Anexo II do Tratado
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1188/81 del Consejo, de 28 de abril de 1981, por el
    que se establecen reglas generales relativas a la concesión de restituciones
    adaptadas para los cereales exportados bajo forma de determinadas bebidas espirituosas,
    así como los criterios de fijación de su importe, y por el que se modifica el
    Reglamento (CEE) n° 3035/80 en lo referente a determinadas mercancías no comprendidas
    en el Anexo II del Tratado
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1188/81 av den 28 april 1981 om allmänna
    bestämmelser om beviljande av ett särskilt exportbidrag för spannmål som exporteras
    i form av vissa spritdrycker och om kriterierna för fastställande av bidragsbeloppet
    samt om ändring av förordning (EEG) nr 3035/80 vad avser vissa varor som inte
    omfattas av bilaga 2 till fördraget
