title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1188/81 of 28 April 1981 laying down general
    rules for granting refunds adjusted in the case of cereals exported in the form
    of certain spirituous beverages and the criteria for fixing the amount of such
    refunds and amending Regulation (EEC) No 3035/80 concerning certain products not
    covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1188/81 du Conseil, du 28 avril 1981, établissant
    des règles générales relatives à l' octroi de restitutions adaptées pour
    les céréales exportées sous forme de certaines boissons spiritueuses ainsi
    que les critères de fixation de leur montant, et modifiant le règlement (CEE)
    n° 3035/80 en ce qui concerne certaines marchandises ne relevant pas de l' annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1188/81 des Rates vom 28. April 1981 zur Festlegung
    der Grundregeln für die Gewährung angepaßter Erstattungen für in Form bestimmter
    alkoholischer Getränke ausgeführtes Getreide und der Kriterien für die Festsetzung
    ihrer Höhe sowie zur Änderung der Verordnung (EWG) Nr. 3035/80 betreffend bestimmte
    nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1188/81 af 28. april 1981 om fastsættelse
    af generelle regler for ydelse af særlige restitutioner for korn, der eksporteres
    i form af visse alkoholholdige drikkevarer, og om kriterierne for fastsættelse
    af disse beløb samt om ændring af forordning (EØF) nr. 3035/80 for så vidt
    angår visse varer, som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1188/81 τού Συμβουλίου
    τής 28ης Απριλίου 1981 περί θεσπίσεως γενικών
    κανόνων γιά τή χορήγηση προσαρμοσμένων επιστροφών
    γιά τά σιτηρά πού εξάγονται υπό μορφή ορισμένων
    οινοπνευματωδών ποτών καθώς καί τών κριτηρίων
    καθορισμού τού ύψους αυτών, καί περί τροποποιήσεως
    τού κανονισμού (ΕΟΚ) αριθ. 3035/80 όσον αφορά ορισμένα
    προϊόντα πού δέν υπάγονται στό παράρτημα ΙΙ
