    qui concerne certains produits
  type: main
- language: de
  script: Latn
  content: '70/65/EWG: Entscheidung der Kommission vom 30. Dezember 1969, mit der
    die Französische Republik ermächtigt wird, die Anwendung der Zollsätze des
    Gemeinsamen Zolltarifs bei verschiedenen Erzeugnissen aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '70/65/CEE: Decisione della Commissione, del 30 dicembre 1969, che autorizza
    la Repubblica francese a differire l''applicazione dei dazi della tariffa doganale
    comune per alcuni prodotti'
  type: main
- language: nl
  script: Latn
  content: '70/65/EEG: Beschikking van de Commissie van 30 december 1969 waarbij de
    Franse Republiek wordt gemachtigd om voor bepaalde produkten de toepassing van
    de rechten van het gemeenschappelijk douanetarief uit te stellen'
