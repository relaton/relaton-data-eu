title:
- language: fr
  script: Latn
  content: Décision 67/739/CEE de la Commission, du 22 novembre 1967, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas,
    en vertu de l'article 115 alinéa 1 du Traité, à exclure du traitement communautaire
    certains carreaux de pavement et de revêtement, de la position n° Ex 69.07 et
    Ex 69.08 du Tarif douanier commun, originaires du Japon et mis en libre pratique
    en Allemagne
  type: main
- language: de
  script: Latn
  content: '67/739/EWG: Entscheidung der Kommission vom 22. November 1967 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande auf Grund von Artikel 115 Absatz (1) des Vertrages, bestimmte Wand-
    und Bodenplatten der Tarifnummern ex 69.07 und ex 69.08 des Gemeinsamen Zolltarifs
    mit Ursprung in Japan, die sich in Deutschland im freien Verkehr befinden, von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/739/CEE: Decisione della Commissione, del 22 novembre 1967, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi,
    in virtù dell''articolo 115, primo comma, del Trattato, ad escludere dal trattamento
    comunitario alcune piastrelle da pavimentazione e da rivestimento, di cui alle
    voci ex 69.07 ed ex 69.08 della tariffa doganale comune, originarie del Giappone
    e immesse in libera pratica nella Repubblica federale di Germania'
  type: main
- language: nl
  script: Latn
  content: '67/739/EEG: Beschikking van de Commissie van 22 november 1967 betreffende
    het verzoek van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk
    der Nederlanden om op grond van artikel 115, eerste alinea, van het Verdrag bepaalde
    vloer- en wandtegels van post ex 69.07 en ex 69.06'' van het gemeenschappelijk
    douanetarief die van oorsprong zijn uit Japan en in de Bondsrepubliek Duitsland
    in het vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
