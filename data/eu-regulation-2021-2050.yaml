title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2021/2050 of 24 November 2021
    concerning the authorisation of the preparation of Bacillus velezensis CECT 5940
    as a feed additive for turkeys for fattening, turkeys reared for breeding, minor
    poultry species for fattening and reared for breeding and ornamental birds (except
    for reproduction) (holder of authorisation: Evonik Operations GmbH)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2021/2050 de la Commission du 24 novembre
    2021 concernant l’autorisation de la préparation de Bacillus velezensis CECT
    5940 en tant qu’additif dans l’alimentation des dindes d’engraissement,
    des dindons élevés pour la reproduction, des espèces aviaires mineures destinées
    à l’engraissement ou à la reproduction et des oiseaux d’ornement (sauf ceux
    destinés à la reproduction) (titulaire de l’autorisation: Evonik Operations
    GmbH)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2021/2050 der Kommission vom 24. November
    2021 zur Zulassung der Zubereitung aus Bacillus velezensis CECT 5940 als Zusatzstoff
    in Futtermitteln für Masttruthühner, Zuchttruthühner, Geflügelarten von geringerer
    wirtschaftlicher Bedeutung für Mast- und Zuchtzwecke sowie Ziervögel (außer
    für Vermehrungszwecke) (Zulassungsinhaber: Evonik Operations GmbH)'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2021/2050 на Комисията
    от 24 ноември 2021 година за разрешаване на употребата
    на препарата от Bacillus velezensis CECT 5940 като фуражна
    добавка за пуйки за угояване, пуйки, отглеждани
    за разплод, видове домашни птици с по-малко
    стопанско значение, отглеждани за угояване
    и за разплод, и декоративни птици (освен за
    размножаване) (притежател на разрешението:
    Evonik Operations GmbH)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2021/2050 ze dne 24. listopadu 2021
    o povolení přípravku Bacillus velezensis CECT 5940 jako doplňkové látky
    pro výkrm krůt, odchov krůt, výkrm a odchov menšinových druhů drůbeže
    a okrasné ptáky (kromě rozmnožování) (držitel povolení: Evonik Operations
    GmbH)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2021/2050 af 24. november
    2021 om godkendelse af præparatet af Bacillus velezensis CECT 5940 som tilsætningsstof
    til foder til slagtekalkuner, kalkuner opdrættet til avl, mindre udbredte fjerkræarter
    bestemt til slagtning og opdrættet til avl og prydfugle (undtagen til avl) (indehaver
    af godkendelsen er: Evonik Operations GmbH)'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2021/2050 της
    Επιτροπής της 24ης Νοεμβρίου 2021 σχετικά με τη
    χορήγηση άδειας για το παρασκεύασμα Bacillus velezensis
    CECT 5940 ως πρόσθετης ύλης ζωοτροφών για γαλοπούλες
    προς πάχυνση, γαλοπούλες που εκτρέφονται για
    αναπαραγωγή, μικρά είδη πουλερικών προς πάχυνση
    και για αναπαραγωγή και διακοσμητικά πτηνά
    (εκτός των πτηνών αναπαραγωγής) (κάτοχος της
    άδειας: Evonik Operations GmbH)'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2021/2050, 24. november 2021, milles käsitletakse
    loa andmist Bacillus velezensis CECT 5940 preparaadi kasutamiseks broilerkalkunite,
    aretuskalkunite, vähem levinud kodulinnuliikide nuum- ja aretuslindude ning dekoratiivlindude
    (kes ei ole ette nähtud paljundamiseks) söödalisandina (loa hoidja: Evonik
    Operations GmbH)'
  type: main
- language: fi
