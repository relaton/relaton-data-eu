    beathaithe do thurcaithe lena ramhrú, do thurcaithe a thógtar le haghaidh pórúcháin,
    do mhionspeicis éanlaithe clóis lena ramhrú agus a thógtar le haghaidh pórúcháin
    agus d’éin ornáideacha (seachas le haghaidh an atáirgthe) (sealbhóir an
    údaraithe: Evonik Operations GmbH)'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2021/2050 оd 24. studenoga 2021. o odobrenju
    pripravka od Bacillus velezensis CECT 5940 kao dodatka hrani za purane za tov,
    purane koji se uzgajaju za rasplod, manje značajne vrste peradi za tov i peradi
    koja se uzgaja za rasplod te ukrasnih ptica (osim za rasplod) (nositelj odobrenja:
    Evonik Operations GmbH)'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2021/2050 végrehajtási rendelete (2021. november 24.)
