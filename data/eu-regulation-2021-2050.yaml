    kevésbé jelentős hízó- és tenyészbaromfifajok és díszmadarak (a szaporításra
    szánt állatok kivételével) takarmány-adalékanyagaként történő engedélyezéséről
    (az engedély jogosultja: Evonik Operations GmbH)'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2021/2050 della Commissione del 24 novembre
    2021 relativo all’autorizzazione del preparato di Bacillus velezensis CECT 5940
    come additivo per mangimi destinati a tacchini da ingrasso, tacchini allevati
    per la riproduzione, specie avicole minori da ingrasso e allevate per la riproduzione
    e uccelli ornamentali (esclusi quelli da riproduzione) (titolare dell’autorizzazione:
    Evonik Operations GmbH)'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2021/2050 (2021. gada 24. novembris),
    ar ko piešķir atļauju par gaļas tītaru, vaislas tītaru, retāk audzētu
    sugu gaļas un vaislas mājputnu un dekoratīvo putnu (izņemot vaislas putnus)
    barības piedevu lietot Bacillus Velezensis (CECT 5940) (atļaujas turētājs:
    uzņēmums Evonik Operations GmbH)'
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/2050 2021 m. lapkričio 24
