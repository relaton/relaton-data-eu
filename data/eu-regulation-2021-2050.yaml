    siitoseläimiksi kasvatettavien kalkkunoiden, lihantuotantoa varten ja siitoseläimiksi
    kasvatettavien toissijaisten siipikarjalajien ja koristetarkoituksessa pidettävien
    lintujen (lukuun ottamatta lisääntymiseen tarkoitettuja) rehun lisäaineena
    (hyväksynnän haltija Evonik Operations GmbH)
  type: main
- language: ga
  script: Latn
