title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3249/94 of 27 December 1994 establishing
    the quantity of certain cheeses available for the first quarter of 1995 under
    the arrangements provided for by the Interim Agreements concluded by the Community
    with Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3249/94 de la Commission, du 27 décembre 1994, déterminant
    la quantité disponible pour le premier trimestre de 1995 pour certains fromages
    dans le cadre du régime prévu par les accords intérimaires conclus par la Communauté
    avec la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3249/94 der Kommission vom 27. Dezember 1994 mit dem
    im ersten Vierteljahr 1995 gemäß den zwischen der Gemeinschaft und Bulgarien
    sowie Rumänien geschlossenen Interimsabkommen einführbaren Käsemengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3249/94 af 27. december 1994 om fastsættelse
    af den mængde, der er til rådighed for første kvartal af 1995 for bestemte
    oste under den ordning, der er fastsat i interimsaftalerne mellem Fællesskabet
    og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3249/94 της Επιτροπής
    της 27ης Δεκεμβρίου 1994 για τον καθορισμό της
    διαθέσιμης ποσότητας για το πρώτο τρίμηνο
    του 1995 για ορισμένα τυριά στο πλαίσιο του καθεστώτος
    που προβλέπεται από τις προσωρινές συμφωνίες
    που έχουν συναφθεί από την Κοινότητα με την
    Βουλγαρία και την Ρουμανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3249/94 della Commissione, del 27 dicembre 1994, che
    stabilisce la quantità di taluni formaggi disponibile nel corso del primo trimestre
    1995, nel quadro del regime previsto dagli accordi interinali conclusi dalla Comunità
    con la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3249/94 van de Commissie van 27 december 1994 tot
    vaststelling van de hoeveelheid van bepaalde kaassoorten die, in het kader van
    de regeling die is vastgesteld in de door de Gemeenschap met Bulgarije en Roemenië
    gesloten Interimovereenkomsten, beschikbaar is voor het eerste kwartaal van 1995
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3249/94 da Comissão, de 27 de Dezembro de 1994, que
    determina a quantidade disponível de determinados queijos, para o primeiro trimestre
    de 1995, no âmbito do regime previsto nos acordos provisórios concluídos entre
    a Comunidade e a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 3249/94 de la Comisión, de 27 de diciembre de 1994,
    por el que se fijan, en aplicación del régimen previsto en los Acuerdos interinos
    celebrados por la Comunidad con Bulgaria y Rumanía, las cantidades disponibles
    durante el primer trimestre de 1995 en lo que se refiere a determinados quesos
  type: main
