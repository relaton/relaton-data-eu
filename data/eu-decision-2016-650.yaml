    2016, che stabilisce norme per la valutazione di sicurezza dei dispositivi per
    la creazione di una firma e di un sigillo qualificati a norma dell'articolo 30,
    paragrafo 3, e dell'articolo 39, paragrafo 2, del regolamento (UE) n. 910/2014
    del Parlamento europeo e del Consiglio in materia di identificazione elettronica
    e servizi fiduciari per le transazioni elettroniche nel mercato interno
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/650 (2016. gada 25. aprīlis),
