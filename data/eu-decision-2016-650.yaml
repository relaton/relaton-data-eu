    drošības novērtēšanai saskaņā ar Eiropas Parlamenta un Padomes Regulas
    (ES) Nr. 910/2014 par elektronisko identifikāciju un uzticamības pakalpojumiem
    elektronisko darījumu veikšanai iekšējā tirgū 30. panta 3. punktu un 39.
    panta 2. punktu
  type: main
- language: lt
  script: Latn
  content: 2016 m. balandžio 25 d. Komisijos įgyvendinimo sprendimas (ES) 2016/650,
