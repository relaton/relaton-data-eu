    qualifiés de création de signature électronique et de cachet électronique
    conformément à l'article 30, paragraphe 3, et à l'article 39, paragraphe 2,
    du règlement (UE) n° 910/2014 du Parlement européen et du Conseil sur l'identification
    électronique et les services de confiance pour les transactions électroniques
    au sein du marché intérieur
  type: main
