    azonosításról és bizalmi szolgáltatásokról szóló 910/2014/EU európai
    parlamenti és tanácsi rendelet 30. cikkének (3) bekezdése és 39. cikkének
    (2) bekezdése alapján a minősített aláírást és bélyegzőt létrehozó
    eszközök biztonsági értékelésére vonatkozó szabványok megállapításáról
  type: main
- language: it
  script: Latn
