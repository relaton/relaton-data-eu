title:
- language: fr
  script: Latn
  content: Décision 66/458/CEE de la Commission, du 6 juillet 1966, autorisant la
    République française à surseoir à la délivrance de licences d'importation
    pour l'oxytétracycline chlorhydrate de la position Ex 29.44 D du Tarif douanier
    commun, originaire de Pologne et mis en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '66/458/EWG: Entscheidung der Kommission vom 6. Juli 1966, mit der die
    Französische Republik ermächtigt wird, die Erteilung von Einfuhrgenehmigungen
    für Oxytetracyclinchlorhydrat der Tarifnummer ex 29.44 D des Gemeinsamen Zolltarifs
    mit Ursprung in Polen, das sich in den anderen Mitgliedstaaten im freien Verkehr
    befindet, auszusetzen'
  type: main
- language: it
  script: Latn
  content: '66/458/CEE: Decisione della Commissione, del 6 luglio 1966, che autorizza
    la Repubblica francese a sospendere il rilascio di licenze d''importazione per
    l''ossitetraciclina cloridrato della voce ex 29.44 D della tariffa doganale comune,
    originaria della Polonia e messa in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/458/EEG: Beschikking van de Commissie van 6 juli 1966 waarbij de Franse
    Republiek wordt gemachtigd de afgifte op te schorten van invoervergunningen voor
    "oxytetracycline chloorhydraat" van post ex 29.44 D van het G.D.T. van oorsprong
    uit Polen en in andere Lid- Staten in het vrije verkeer gebracht'
  type: main
