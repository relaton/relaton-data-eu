title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 892/77 of 28 April 1977 re-establishing
    the levying of the customs duties on rubber tyres, tyre cases, interchangeable
    tyre treads, etc., falling within heading 40.11 originating in Yugoslavia to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3021/76
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 892/77 de la Commission, du 28 avril 1977, portant
    rétablissement de la perception des droits de douane applicables aux bandages,
    pneumatiques, bandes de roulement amovibles pour pneumatiques, etc., de la position
    tarifaire 40.11, originaires de la Yougoslavie bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 892/77 der Kommission vom 28. April 1977 zur Wiedereinführung
    des Zollsatzes für Reifen, auswechselbare Überreifen, Luftschläuche und Felgenbänder,
    aus Weichkautschuk, für Räder aller Art, der Tarifnummer 40.11, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 892/77 af 28. april 1977 om genindførelse
    af opkrævning af toldafgifter for dæk, ringe, udskiftelige slidbaner til dæk
    samt slanger etc., under position 40.11, som har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 892/77 della Commissione, del 28 aprile 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle gomme piene o semipiene,
    coperture, battistrada amovibili per coperture, ecc., della voce doganale 40.11,
    originari della Iugoslavia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 892/77 van de Commissie van 28 april 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op banden en
    velglinten, van niet-geharde gevulcaniseerde rubber enz., van post 40.11, van
    oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76
    van de Raad algemene tariefpreferenties werden geopend
  type: main
