title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1597/82 of 21 June 1982 re-establishing
    the levying of customs duties on glass inners for vacuum flasks or for other vacuum
    vessels falling within heading No 70.12 and originating in India, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3601/81
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1597/82 de la Commission, du 21 juin 1982, portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants, de la position 70.12 du tarif douanier commun,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1597/82 der Kommission vom 21. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für Glaskolben für Isolierbehälter der Tarifnummer
    70.12, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werdenw
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1597/82 af 21. juni 1982 om genindførelse
    af opkrævning af told for glaskolber til termoflasker og lignende isotermiske
    beholdere, henhørende under pos. 70.12 og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81a
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1597/82 τής Επιτροπής
    τής 21ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τίς υάλινες φύσιγγες
    γιά μονωτικά δοχεία τής κλάσεως 70. 12 τού Κοινού
    Δασμολογίου, καταγωγής Ινδίας, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1597/82 della Commissione, del 21 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle ampolle di vetro
    per recipienti isolanti della voce 70.12 della tariffa doganale comune, originarie
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1597/82 van de Commissie van 21 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op binnenflessen
    voor thermisch isolerende flessen van tariefpost 70.12, van oorsprong uit India,
    waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleendd
  type: main
