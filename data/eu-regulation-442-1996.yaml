title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 442/96 of 11 March 1996 amending Regulations
    (EEC) No 1912/92, No 1913/92, No 2254/92, No 2255/92, No 2312/92 and No 1148/93
    laying down detailed implementing rules for the specific measures for supplying
    the Canary Islands, the Azores, Madeira and the French overseas departments with
    beef and veal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 442/96 de la Commission, du 11 mars 1996, modifiant
    les règlements (CEE) n° 1912/92, (CEE) n 1913/92, (CEE) n° 2254/92, (CEE) n
    2255/92, (CEE) n 2312/92 et (CEE) n° 1148/93 portant modalités d'application
    du régime spécifique pour l'approvisionnement en produits du secteur de la viande
    bovine, des îles Canaries, des Açores, de Madère et des départements français
    d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 442/96 der Kommission vom 11. März 1996 zur Änderung
    der Verordnungen (EWG) Nr. 1912/92, (EWG) Nr. 1913/92, (EWG) Nr. 2254/92, (EWG)
    Nr. 2255/92, (EWG) Nr. 2312/92 und (EWG) Nr. 1148/93 hinsichtlich der Durchführungsbestimmungen
    für die Sondermaßnahmen zur Versorgung der Kanarischen Inseln, der Azoren, Madeiras
    und der französischen überseeischen Departements mit bestimmten landwirtschaftlichen
    Erzeugnissen und der zu gewährenden Beihilfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 442/96 af 11. marts 1996 om ændring
