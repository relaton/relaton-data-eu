title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2907/80 of 11 November 1980 re-establishing
    the levying of customs duties on other woods, sawn, etc., falling within subheading
    44.14 B, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2907/80 de la Commission, du 11 novembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres bois
    simplement sciés, etc., de la sous-position 44.14 B du tarif douanier commun,
    originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2907/80 der Kommission vom 11. November 1980 zur Wiedereinführung
    des Zollsatzes für anderes Holz, in der Längsrichtung gesägt, usw., der Tarifstelle
    44.14 B, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2907/80 af 11. november 1980 om genindførelse
    af opkrævning af toldafgifter for træ, savet i længderetningen, under pos.
    44.14 B, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2907/80 della Commissione, dell' 11 novembre 1980,
    che ripristina la riscossione dei dazi doganali applicabili agli altri legni semplicemente
    segati, ecc., della sottovoce 44.14 B della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2907/80 van de Commissie van 11 november 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor ander hout, enkel overlangs
    gezaagd enz., van post 44.14 B, van oorsprong uit de ontwikkelingslanden ten behoeve
    waarvan bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden
    geopend
  type: main
