title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1821/79 of 16 August 1979 re-establishing
    the levying of customs duties on plaiting materials bound together in parallel
    strands, etc., falling within heading No ex 46.02 and originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1821/79 de la Commission, du 16 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux matières
    à tresser tissées à plat ou parallélisées, etc., de la position ex 46.02
    du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1821/79 der Kommission vom 16. August 1979 zur Wiedereinführung
    des Zollsatzes für Flechtstoffe, in Flächenform, verwebt oder parallel aneinandergefügt,
    usw., der Tarifnummer ex 46.02, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1821/79 af 16. august 1979 om genindførelse
    af opkrævning af toldafgifter for flettematerialer i pladeform, etc., under pos.
    ex 46.02, som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1821/79 della Commissione, del 16 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili a meteriali da intreccio
    tessuti o parallelizzati, ecc., della voce ex 46.02 della tariffa doganale comune,
    originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1821/79 van de Commissie van 16 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op vlechtstoffen,
    vlak geweven of samengebonden, enz., van post ex 46.02, van oorsprong uit Zuid-Korea,
    ten behoeve waarven bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
