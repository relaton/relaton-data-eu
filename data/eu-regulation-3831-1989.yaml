title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3831/89 of 20 December 1989 amending for
    the second time Regulations (EEC) No 2209/87 and (EEC) No 2319/88 fixing certain
    coefficients applicable to cereals exported in the form of certain spirituous
    beverages for the periods 1987 to 1988 and 1988 to 1989 and fixing certain coefficients
    for the period 1989 to 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3831/89 de la Commission du 20 décembre 1989 modifiant
    pour la deuxième fois les règlements (CEE) n° 2209/87 et (CEE) n 2319/88 fixant
    certains coefficients applicables aux céréales exportées sous forme de certaines
    boissons spiritueuses pour les périodes 1987/1988 et 1988/1989 et fixant certains
    coefficients pour la période 1989/1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3831/89 DER KOMMISSION vom 20. Dezember 1989 zur zweiten
    Aenderung der Verordnungen (EWG) Nr. 2209/87 und (EWG) Nr. 2319/88 zur Festsetzung
    von Koeffizienten fuer in Form bestimmter alkoholischer Getraenke ausgefuehrtes
    Getreide fuer die Zeitraeume 1987/88 und 1988/89 und zur Festlegung bestimmter
    Koeffizienten fuer den Zeitraum 1989/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3831/89 af 20. december 1989 om anden
    ændring af forordning (EØF) nr. 2209/87 og forordning (EØF) nr. 2319/88 om
    fastsættelse for perioderne 1987/88 og 1988/89 af visse koefficienter, der gælder
    for korn, der eksporteres i form af visse alkoholholdige drikkevarer, og om fastsættelse
    af visse koefficienter for perioden 1989/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3831/89 της Επιτροπής
    της 20ής Δεκεμβρίου 1989 για την τροποποίηση για
    δεύτερη φορά των κανονισμών (ΕΟΚ) αριθ. 2209/87
    και (ΕΟΚ) αριθ. 2319/88 περί καθορισμού ορισμένων
    συντελεστών που εφαρμόζονται στα σιτηρά που
    εξάγονται υπό μορφή ορισμένων αλκοολούχων
    ποτών για τις περιόδους 1987/88 και 1988/89 και για
    τον καθορισμό ορισμένων συντελεστών για την
    περίοδο 1989/90
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3831/89 DELLA COMMISSIONE del 20 dicembre 1989 recante
    seconda modifica dei regolamenti (CEE) n. 2209/87 e (CEE) n. 2319/88 che fissano
    taluni coefficienti applicabili ai cereali esportati sotto forma di determinate
    bevande alcoliche per i periodi 1987/1988 e 1988/1989 e recante fissazione di
    taluni coefficienti per il periodo 1989/1990
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3831/89 VAN DE COMMISSIE van 20 december 1989 tot
    wijziging van de Verordeningen (EEG) nr. 2209/87 en (EEG) nr. 2319/88 tot vaststelling,
    voor de periodes 1987/1988 en 1988/1989, van enkele coëfficiënten voor in de
    vorm van bepaalde alcoholhoudende dranken uitgevoerde granen en houdende vaststelling
    van enkele coëfficiënten voor de periode 1989/1990 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3831/89 DA COMISSÃO de 20 de Dezembro de 1989 que
    altera pela segunda vez os Regulamentos (CEE) nº 2209/87 e (CEE) nº 2319/88,
    que fixam determinados coeficientes aplicáveis aos cereais exportados sob a forma
    de determinadas bebidas espirituosas para os períodos de 1987/1988 e 1988/1989,
    e que fixa determinados coeficientes para o período de 1989/1990 #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3831/89 DE LA COMISION de 20 de diciembre de 1989 que
    modifica por segunda vez los Reglamentos (CEE) no 2209/87 y (CEE) no 2319/88 por
    los que se fijan, para los periodos de 1987-1988 y 1988-1989, determinados coeficientes
    aplicables a los cereales que se exportan en forma de ciertas bebidas espirituosas,
    y por el que se fijan algunos coeficientes para el periodo 1989/1990
  type: main
