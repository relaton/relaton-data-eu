id: EUDecision1980436
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/436/EEC: Commission Decision of 1 April 1980 authorizing Ireland not
    to apply Community treatment to men''s and boys''shirts, woven, falling within
    heading No ex 61.03 of the Common Customs Tariff (category 8), originating in
    South Korea and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/436/CEE: Décision de la Commission, du 1er avril 1980, autorisant
    l''Irlande à exclure du traitement communautaire les chemises et chemisettes
    tissées pour hommes et garçonnets, de la position ex 61.03 du tarif douanier
    commun (catégorie 8), originaires de Corée du Sud et mises en libre pratique
    dans les autres Etats membres (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/436/EWG: Entscheidung der Kommission vom 1. April 1980, mit der Irland
    ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus Geweben,
    für Männer und Knaben, der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (Kategorie
    8) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/436/EØF: Kommissionens beslutning af 1. april 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage vævede skjorter (herunder
    sports- og arbejdsskjorter), til mænd og drenge, som henhører under pos. ex
    61.03 i den fælles toldtarif (kategori 8), har oprindelse i Sydkorea og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/436/CEE: Decisione della Commissione, del 1 aprile 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie e camicette, tessute,
    per uomo per ragazzo, della voce ex 61.03, categoria 8, della tariffa doganale
    comune, originari della Corea del Sud e messi in libera pratica negli altri Stati
    membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/436/EEG: Beschikking van de Commissie van 1 april 1980 waarbij Ierland
    wordt gemachtigd overhemden en sporthemden, geweven, van post ex 61.03 van het
    gemeenschappelijk douanetarief (categorie 8), van oorsprong uit Zuid-Korea en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
