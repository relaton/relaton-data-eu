    tariffario comunitario di carta da giornale della sottovoce 48.01 A della tariffa
    doganale comune (anno 1979) e relativo all' estensione del beneficio dello stesso
    contingente a talune altre carte
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2691/78 van de Raad van 16 november 1978 betreffende
