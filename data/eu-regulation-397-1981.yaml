title:
- language: en
  script: Latn
  content: Council Regulation (Euratom, ECSC, EEC) No 397/81 of 10 February 1981 fixing
    the tables of salaries and other components of remuneration consequent on Regulation
    (Euratom, ECSC, EEC) No 187/81 adjusting the salaries and pensions of officials
    and other servants of the European Communities and the weightings applying thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom, CECA, CEE) n° 397/81 du Conseil, du 10 février 1981,
    portant fixation des tableaux des traitements ainsi que des autres éléments
    de rémunération suite au règlement (Euratom, CECA, CEE) n° 187/81 portant
    adaptation des rémunérations et des pensions des fonctionnaires et autres agents
    des Communautés européennes ainsi que des coefficients correcteurs dont sont
    affectées ces rémunérations et pensions
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom, EGKS, EWG) Nr. 397/81 des Rates vom 10. Februar 1981
    zur Festlegung der Tabellen der Gehälter sowie der sonstigen Bestandteile der
    Bezüge im Anschluß an die Verordnung (Euratom, EGKS, EWG) Nr. 187/81 zur Angleichung
    der Dienst- und Versorgungsbezüge der Beamten der Europäischen Gemeinschaften
    und der sonstigen Bediensteten dieser Gemeinschaften sowie der Berichtigungskoeffizienten,
    die auf diese Dienst- und Versorgungsbezüge anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (Euratom, EKSF, EØF) nr. 397/81 af 10. februar 1981
    om fastsættelse af løntabeller samt af øvrige lønelementer som følger af
    forordning (Euratom, EKSF, EØF) nr. 187/81 om tilpasning af vederlag og pensioner
    til tjenestemænd og øvrige ansatte i De europæiske Fællesskaber samt af justeringskoefficienterne
    for disse vederlag og pensioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (Ευρατόμ, ΕΚΑΧ, ΕΟΚ) αριθ. 397/81
    τού Συμβουλίου τής 10ης Φεβρουαρίου 1981 περί
    καθορισμού τών μισθολογικών πινάκων καθώς
    καί τών άλλων στοιχείων τών αποδοχών βάσει
    τού κανονισμού (Ευρατόμ, ΕΚΑΧ, ΕΟΚ) αριθ. 187/81
    περί προσαρμογής τών αποδοχών καί τών συντάξεων
    τών υπαλλήλων καί τού λοιπού προσωπικού τών
    Ευρωπαϊκών Κοινοτήτων καθώς καί τών συντελεστών
    αναπροσαρμογής πού εφαρμόζονται στίς αμοιβές
    καί στίς συντάξεις
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom, CECA, CEE) n. 397/81 del Consiglio, del 10 febbraio
    1981, che fissa le tabelle degli stipendi e gli altri elementi della retribuzione
    a seguito del regolamento (Euratom, CECA, CEE) n. 187/81 relativo all' adeguamento
    delle retribuzioni e delle pensioni dei funzionari e degli altri agenti delle
    Comunità europee, nonché dei coefficienti correttori applicabili a tali retribuzioni
    e pensioni
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom, EGKS, EEG) nr. 397/81 van de Raad van 10 februari
    1981 houdende vaststelling van de tabellen van de salarissen alsmede van de andere
    onderdelen van de bezoldiging ingevolge Verordening (Euratom, EGKS, EEG) nr. 187/81
    houdende aanpassing van de bezoldigingen en de pensioenen van de ambtenaren en
    andere personeelsleden der Europese Gemeenschappen, alsmede van de aanpassingscoëfficiënten
    welke van toepassing zijn op deze bezoldigingen en pensioenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (Euratom, CECA, CEE) n.° 397/81 do Conselho, de 10 de Fevereiro
    de 1981, que fixa as tabelas dos vencimentos, assim como outros elementos de remuneração
    na sequência do Regulamento (Euratom, CECA, CEE) n.° 187/81 que adapta as remuneraçôes
    e as pensões dos funcionários e outros agentes das Comunidades Europeias, assim
    como os coeficientes de correcção a que ficam sujeitas estas remunerações
    e pensões
  type: main
- language: es
  script: Latn
  content: Reglamento (Euratom, CECA, CEE) n° 397/81 del Consejo, de 10 de febrero
    de 1981, sobre determinación de los cuadros de sueldos y de los demás conceptos
    retributivos, en aplicación del Reglamento (Euratom, CECA, CEE) n° 187/81, por
    el que se adaptan las retribuciones y pensiones de los funcionarios y otros agentes
    de las Comunidades Europeas, así como los coeficientes correctores que afectan
    a tales retribuciones y pensiones
  type: main
