---
id: EUDirective20211980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2021/1980 of 11 August 2021 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of bis(2-ethylhexyl) phthalate (DEHP) in ion-selective
    electrodes for analysing human body fluids and/or dialysate fluids
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2021/1980 de la Commission du 11 août 2021
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    IV de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative à l’utilisation du phtalate de bis(2-éthylhexyle) (DEHP)
    dans les électrodes sélectives d’ions pour l’analyse des fluides corporels
    humains et/ou des liquides de dialyse
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2021/1980 der Kommission vom 11. August 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Diethylhexylphthalat
    (DEHP) in ionenselektiven Elektroden für die Analyse menschlicher Körperflüssigkeiten
    und/oder Dialysierflüssigkeiten
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2021/1980 на Комисията
    от 11 август 2021 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение IV към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаване
    от ограничението за употребата на бис(2-етилхексилов)
    фталат (DEHP) в йоноселективни електроди за анализ
    на човешки телесни течности и/или диализни
    течности
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2021/1980 ze dne 11. srpna
    2021, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití bis(2-ethylhexyl)-ftalátu (DEHP) v iontově selektivních
    elektrodách pro analýzu tělních tekutin a/nebo dialyzátu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2021/1980 af 11. august 2021 om
    ændring, med henblik på tilpasning til den videnskabelige og tekniske udvikling,
    af bilag IV til Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt
    angår en undtagelse for anvendelsen af di(2-ethylhexyl)phthalat (DEHP) i ionselektive
    elektroder til analyse af menneskers legemsvæsker og/eller dialysevæsker
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2021/1980 της
    Επιτροπής της 11ης Αυγούστου 2021 για την τροποποίηση,
    προς τον σκοπό της προσαρμογής στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση φθαλικού δις(2-αιθυλεξυλίου) (DEHP) σε
    ιοντοεπιλεκτικά ηλεκτρόδια για την ανάλυση
    ανθρώπινων σωματικών υγρών και/ή υγρών αιμοκάθαρσης
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2021/1980, 11. august 2021, millega
    muudetakse teaduse ja tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi
    ja nõukogu direktiivi 2011/65/EL IV lisa seoses erandiga, mis hõlmab bis(2-etüülheksüül)ftalaadi
    (DEHP) kasutamist inimese kehavedelike ja/või dialüüsivedelike analüüsimiseks
    ette nähtud ioonselektiivsetes elektroodides
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2021/1980, annettu 11 päivänä elokuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    poikkeuksen myöntämisestä bis(2-etyyliheksyyli)ftalaatin (DEHP) käytölle
    ioniselektiivisissä elektrodeissa ihmiskehon nesteiden ja/tai dialyysinesteiden
    analysointia varten
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2021/1980 ón gCoimisiún an 11 Lúnasa 2021 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn teicniúil agus eolaíoch,
    Iarscríbhinn IV a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine i leith úsáid bios(2-eitilheicsil)
    taláite (DEHP) i leictreoidí ianroghnaitheacha chun anailís a dhéanamh ar
    shreabháin coirp an duine agus/nó ar shreabháin scagdhealáite
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/1980 оd 11. kolovoza 2021. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu di(2-etilheksil)
    ftalata (DEHP) u ionsko-selektivnim elektrodama za analizu ljudskih tjelesnih
    tekućina i/ili dijalizata
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1980 felhatalmazáson alapuló irányelve (2021.
    augusztus 11.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítása céljából,
    a bisz(2-etilhexil)-ftalát (DEHP) emberi testnedvek és/vagy dializátfolyadékok
    elemzésére szolgáló ionszelektív elektródokban való felhasználására
    vonatkozó mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2021/1980 della Commissione dell'11 agosto 2021
    che modifica, adeguandolo al progresso scientifico e tecnico, l'allegato IV della
    direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l'esenzione relativa all'uso di ftalato di bis(2-etilesil) (DEHP) negli elettrodi
    iono-selettivi per l'analisi dei fluidi corporei umani e/o dei fluidi di dialisi
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2021/1980 (2021. gada 11. augusts),
    ar ko attiecībā uz atbrīvojumu, kas atļautu bis(2-etilheksil)ftalātu (DEHP)
    izmantot jonselektīvajos elektrodos cilvēka ķermeņa šķidrumu un/vai dializāta
    analīzei, groza Eiropas Parlamenta un Padomes Direktīvas 2011/65/ES IV pielikumu,
    to pielāgojot zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2021/1980 2021 m. rugpjūčio 11 d.
    kuria, derinant prie mokslo ir technikos pažangos, dėl išimties, kuria bis(2-etilheksil)ftalatą
    (DEHP) leidžiama naudoti atrankiuosiuose jonų elektroduose, skirtuose žmogaus
    kūno skysčiams ir (arba) dializato skysčiams analizuoti, iš dalies keičiamas
    Europos Parlamento ir Tarybos direktyvos 2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2021/1980 tal-11 ta’ Awwissu
    2021 li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-ftalat tal-bis(2-etileżil) (DEHP) f’elettrodi
    selettivi għall-joni biex janalizzaw il-fluwidi tal-ġisem tal-bniedem u/jew
    il-fluwidi tad-dijalisat
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2021/1980 van de Commissie van 11 augustus
    2021 tot wijziging, met het oog op aanpassing aan de vooruitgang van wetenschap
    en techniek, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van bis(2-ethylhexyl)ftalaat
    (DEHP) in ionselectieve elektroden voor de analyse van menselijke lichaamsvloeistoffen
    en/of spoelvloeistoffen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2021/1980 z dnia 11 sierpnia 2021 r.
    zmieniająca, w celu dostosowania do postępu naukowo-technicznego, załącznik
    IV do dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    dotyczącego stosowania ftalanu bis (2-etyloheksylu) (DEHP) w elektrodach jonoselektywnych
    do analizy ludzkich płynów ustrojowych lub dializatu
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2021/1980 da Comissão de 11 de agosto de 2021 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante a
    uma isenção relativa à utilização de ftalato de bis(2-etil-hexilo) (DEHP)
    em elétrodos seletivos de iões para a análise de fluidos corporais humanos
    e/ou de soluções de diálise
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2021/1980 a Comisiei din 11 august 2021 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei IV la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea ftalatului de bis(2-etilhexil) (DEHP) la electrozii
    ion-selectivi pentru analiza fluidelor corpului uman și/sau a fluidelor de dializă
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2021/1980 z 11. augusta 2021, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    IV k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    na používanie bis(2-etylhexyl)-ftalátu (DEHP) v iónselektívnych elektródach
    na analýzu ľudských telových tekutín a/alebo v dialyzátoch
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/1980 z dne 11. avgusta 2021 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo bis(2-etilheksil) ftalata (DEHP) v ionsko selektivnih elektrodah za
    analizo telesnih tekočin človeka in/ali dializnih tekočin, zaradi prilagoditve
    znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2021/1980 de la Comisión de 11 de agosto de 2021
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo, por
    lo que respecta a una exención relativa al uso del ftalato de bis(2-etilexilo)
    (DEHP) en electrodos selectivos de iones para analizar líquidos corporales humanos
    y/o líquidos de diálisis
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2021/1980 av den 11 augusti 2021
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga IV till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av bis(2-etylhexyl)ftalat (DEHP) i jonselektiva elektroder
    för analys av mänskliga kroppsvätskor och/eller dialysatvätskor
  type: main
