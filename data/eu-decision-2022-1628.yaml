    hensættelsesfond med garantier fra medlemsstaterne og ved specifik hensættelse
    til visse finansielle forpligtelser i forbindelse med Ukraine, som er garanteret
    i henhold til afgørelse nr. 466/2014/EU, og om ændring af afgørelse (EU) 2022/1201
  type: main
