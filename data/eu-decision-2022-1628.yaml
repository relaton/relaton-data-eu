  content: Rozhodnutí Evropského parlamentu a Rady (EU) 2022/1628 ze dne 20. září
    2022 o poskytnutí mimořádné makrofinanční pomoci Ukrajině, navýšení
    společného rezervního fondu o záruky ze strany členských států a zvláštní
    rezervy na některé finanční závazky týkající se Ukrajiny, na které se
    poskytuje záruka podle rozhodnutí č. 466/2014/EU, a o změně rozhodnutí (EU)
    2022/1201
  type: main
