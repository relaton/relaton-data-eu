    20 d. kuriuo suteikiama išskirtinė makrofinansinė pagalba Ukrainai, bendras
    atidėjinių fondas sustiprinamas valstybių narių garantijomis ir specialiais
    atidėjiniais kai kuriems su Ukraina susijusiems finansiniams įsipareigojimams,
