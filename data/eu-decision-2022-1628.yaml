    466/2014/EU te o izmjeni Odluke (EU) 2022/1201
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2022/1628 határozata (2022. szeptember
    20.) az Ukrajnának nyújtandó rendkívüli makroszintű pénzügyi támogatásról,
    a közös tartalékalap tagállami garanciák és a 466/2014/EU határozat alapján
    garanciával fedezett, Ukrajnához kapcsolódó egyes pénzügyi kötelezettségekre
    vonatkozó egyedi tartalékfeltöltési szabályok segítségével történő
    megerősítéséről, valamint az (EU) 2022/1201 határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/1628 del Parlamento europeo e del Consiglio del 20
    settembre 2022 relativa alla concessione di assistenza macrofinanziaria eccezionale
    all’Ucraina, al rafforzamento del fondo comune di copertura mediante garanzie
    degli Stati membri e una dotazione specifica per alcune passività finanziarie
    relative all’Ucraina garantite a norma della decisione n. 466/2014/UE, e che
    modifica la decisione (UE) 2022/1201
  type: main
- language: lv
  script: Latn
