    за укрепване на общия фонд „Провизии“ чрез
    гаранции от държавите членки и чрез специално
    провизиране за някои финансови задължения,
    свързани с Украйна, гарантирани съгласно Решение
    № 466/2014/ЕС, и за изменение на Решение (ЕС) 2022/1201
  type: main
- language: cs
