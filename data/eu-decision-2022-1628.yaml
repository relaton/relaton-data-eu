  script: Latn
  content: Decizia (UE) 2022/1628 a Parlamentului European și a Consiliului din 20
    septembrie 2022 privind acordarea de asistență macrofinanciară excepțională
    Ucrainei și consolidarea fondului comun de provizionare prin garanții din partea
    statelor membre și prin provizionare specifică pentru anumite datorii financiare
