    uzkrājumu fondu ar dalībvalstu garantijām un ar īpašiem uzkrājumiem dažām
    finanšu saistībām, kuras saistītas ar Ukrainu un kuras garantētas saskaņā
    ar Lēmumu Nr. 466/2014/ES, un ar ko groza Lēmumu (ES) 2022/1201
  type: main
- language: lt
  script: Latn
