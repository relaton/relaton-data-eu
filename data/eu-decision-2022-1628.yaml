title:
- language: en
  script: Latn
  content: Decision (EU) 2022/1628 of the European Parliament and of the Council of
    20 September 2022 providing exceptional macro-financial assistance to Ukraine,
    reinforcing the common provisioning fund by guarantees by Member States and by
    specific provisioning for some financial liabilities related to Ukraine guaranteed
    under Decision No 466/2014/EU, and amending Decision (EU) 2022/1201
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/1628 du Parlement européen et du Conseil du 20 septembre
    2022 accordant une assistance macrofinancière exceptionnelle à l’Ukraine,
    renforçant le fonds commun de provisionnement par des garanties des États membres
    et par un provisionnement spécifique pour certaines responsabilités financières
    liées à l’Ukraine garanties en vertu de la décision no 466/2014/UE, et modifiant
    la décision (UE) 2022/1201
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/1628 des Europäischen Parlaments und des Rates vom
    20. September 2022 über die Bereitstellung einer außerordentlichen Makrofinanzhilfe
    für die Ukraine und zur Aufstockung des gemeinsamen Dotierungsfonds durch Garantien
    der Mitgliedstaaten und durch spezifische Dotierungen für bestimmte gemäß dem
    Beschluss Nr. 466/2014/EU garantierte finanzielle Verbindlichkeiten im Zusammenhang
    mit der Ukraine sowie zur Änderung des Beschlusses (EU) 2022/1201
  type: main
- language: bg
