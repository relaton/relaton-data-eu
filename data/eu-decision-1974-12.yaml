title:
- language: en
  script: Latn
  content: Commission Decision of 3 December 1973 authorizing the Italian Republic,
    the Federal Republic of Germany and the French Republic to apply protective measures
    in trade within the Community in wines falling within heading No 22.05 C of the
    Common Customs Tariff coming from Greece
  type: main
- language: fr
  script: Latn
  content: Décision 74/12/CEE de la Commission, du 3 décembre 1973, autorisant la
    République italienne la République fédérale d'Allemagne et la République
    française à appliquer des mesures de protection concernant les échanges intracommunautaires
    de vins, de la position 22.05 C du Tarif douanier commun, provenant de Grèce
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. Dezember 1973 mit der die Italienische
    Republik, die Bundesrepublik Deutschland und die Französische Republik ermächtigt
    werden, Schutzmaßnahmen betreffend den innergemeinschaftlichen Handel von Weinen
    der Tarifnummer 22.05 C des Gemeinsamen Zolltarifs mit Herkunft aus Griechenland
    anzuweden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. december 1973 hvorved Den italienske Republik,
    forbundsrepublikken Tyskland og Den franske Republik bemyndiges til at anvende
    beskyttelsesforanstaltninger vedrørende handelen inden for Fællesskabet med
    vine under pos. 22.05 C i den fælles toldtarif, indført fra Grækenland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 dicembre 1973, che autorizza la Repubblica
    italiana, la Repubblica federale di Germania e la Repubblica francese ad applicare
    misure di protezione negli scambi intracomunitari di vini, della voce 22.05 C
    della tariffa doganale comune, provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 december 1973 tot machtiging van de
    Italiaanse Republiek, de Duitse Bondsrepubliek en de Franse Republiek om beschermende
    maatregelen te treffen bij het intracommunautaire handelsverkeer van wijn, van
    post 22.05 C van het gemeenschappelijk douanetarief, van herkomst uit Griekenland
  type: main
