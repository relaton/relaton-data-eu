type: standard
title:
- language: en
  script: Latn
  content: '79/266/EEC: Commission Decision of 23 February 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, falling within heading No ex 60.02 of
    the Common Customs Tariff (NIMEXE codes 60.02-40, 50, 60, 70, 80) (categories
    10 and 11), originating in Taiwan and in free circulation in the other Member
    States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/266/CEE: Décision de la Commission, du 23 février 1979, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée de la position ex 60.02 du tarif douanier
    commun (codes Nimexe: 60.02-40, 50, 60, 70, 80) catégories 10 et 11, originaire
    de T''ai-wan et mise en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/266/EWG: Entscheidung der Kommission vom 23. Februar 1979, mit der
    die Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer ex 60.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern:
    60.02-40; 50; 60; 70; 80) (Kategorien 10 und 11) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/266/EØF: Kommissionens beslutning af 23. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer af trikotage, ikke elastisk eller gummeret, som henhører under pos.
    ex 60.02 i den fælles toldtarif (NIMEXE-nummer 60.02-40, 50, 60, 70, 80) kategori
    10 og 11, har oprindelse i Taiwan og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/266/CEE: Decisione della Commissione, del 23 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, della voce ex 60.02 della tariffa doganale comune (codice
    Nimexe: 60.02-40, 50, 60, 70, 80), categorie 10 e 11, originari di Taiwan e messi
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/266/EEG: Beschikking van de Commissie van 23 februari 1979 waarbij
    de Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke artikelen
    van niet- elastisch of van niet-gegummeerd brei- of haakwerk, van post ex 60.02
    van het gemeenschappelijk douanetarief (NIMEXE-code 60.02-40, 50, 60, 70, 80)
    (categorieën 10 en 11), van oorsprong uit Taiwan en in de overige Lid- Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
