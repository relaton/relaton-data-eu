title:
- language: en
  script: Latn
  content: '75/287/EEC: Commission Decision of 18 April 1975 exempting the Kingdom
    of Denmark, Ireland, the Kingdom of the Netherlands and the United Kingdom of
    Great Britain and Northern Ireland from applying the Council Directive of 9 April
    1968 on the marketing of material for the vegetative propagation of the vine (Only
    the English, Danish and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '75/287/CEE: Décision de la Commission, du 18 avril 1975, dispensant le
    Royaume du Danemark, l''Irlande, le Royaume des Pays-Bas et le Royaume-Uni d''appliquer
    la directive du Conseil, du 9 avril 1968, concernant la commercialisation des
    matériels de multiplication végétative de la vigne (Les textes en langues anglaise,
    danoise et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '75/287/EWG: Entscheidung der Kommission vom 18. April 1975 zur Entbindung
    des Königreichs Dänemark, Irlands, des Königreichs der Niederlande und des
    Vereinigten Königreichs von der Verpflichtung, die Richtlinie des Rates vom 9.
    April 1968 über den Verkehr mit vegetativem Vermehrungsgut von Reben anzuwenden
    (Nur der englische, dänische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '75/287/EØF: Kommissionens Beslutning af 18. april 1975 om kongeriget
    Danmarks, Irlands, kongeriget Nederlandenes og Det Forenede Kongeriges fritagelse
    for forpligtelsen til at anvende Rådets direktiv af 9. april 1968 om handel med
    vegetativt formeringsmateriale af vin (Kun de engelske, danske og nederlandske
    udgaver er autentiske)'
  type: main
- language: el
  script: Grek
