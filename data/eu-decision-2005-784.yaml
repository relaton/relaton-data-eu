title:
- language: en
  script: Latn
  content: Council Decision 2005/784/CFSP of 7 November 2005 extending and amending
    Decision 1999/730/CFSP with a view to a European Union contribution to combating
    the destabilising accumulation and spread of small arms and light weapons in Cambodia
  type: main
- language: fr
  script: Latn
  content: Décision 2005/784/PESC du Conseil du 7 novembre 2005 prorogeant et modifiant
    la décision 1999/730/PESC en vue d’une contribution de l’Union européenne
    à la lutte contre l’accumulation et la diffusion déstabilisatrices des armes
    légères et de petit calibre au Cambodge
  type: main
- language: de
  script: Latn
  content: Beschluss 2005/784/GASP des Rates vom 7. November 2005 zur Verlängerung
    und Änderung des Beschlusses 1999/730/GASP im Hinblick auf einen Beitrag der
    Europäischen Union zur Bekämpfung der destabilisierenden Anhäufung und Verbreitung
    von Kleinwaffen und leichten Waffen in Kambodscha
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2005/784/SZBP ze dne 7. listopadu 2005, kterým se prodlužuje
    a mění rozhodnutí 1999/730/SZBP s ohledem na příspěvek Evropské unie k
    boji proti destabilizujícímu hromadění a šíření ručních palných zbraní
    a lehkých zbraní v Kambodži
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2005/784/FUSP af 7. november 2005 om forlængelse og
    ændring af afgørelse 1999/730/FUSP med henblik på Den Europæiske Unions bidrag
    til bekæmpelse af destabiliserende ophobning og spredning af håndskydevåben
    og lette våben i Cambodja
  type: main
- language: el
  script: Grek
  content: Απόφαση 2005/784/ΚΕΠΠΑ του Συμβουλίου, της
    7ης Νοεμβρίου 2005, για την παράταση και τροποποίηση
    της απόφασης 1999/730/ΚΕΠΠΑ για τη συμβολή της
    Ευρωπαϊκής Ένωσης στην καταπολέμηση της αποσταθεροποιητικής
    συσσώρευσης και διάδοσης φορητών όπλων και
    ελαφρού οπλισμού στην Καμπότζη
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2005/784/ÜVJP, 7. november 2005, millega pikendatakse otsuse
    1999/730/ÜVJP (Euroopa Liidu osalemise kohta väike- ja kergrelvade destabiliseeriva
    hankimise ja leviku vastases võitluses Kambodžas) kehtivust ja muudetakse nimetatud
    otsust
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2005/784/YUTP, tehty 7 päivänä marraskuuta 2005,
    Euroopan unionin osallistumista käsiaseiden ja kevyiden aseiden epävakauttavan
    keskittymisen ja leviämisen torjumiseen Kambodžassa koskevan päätöksen 1999/730/YUTP
    voimassaolon jatkamisesta ja sen muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2005/784/KKBP határozata (2005. november 7.) az Európai Uniónak
    Kambodzsában a kézi lőfegyverek és a könnyű fegyverek destabilizációra
    vezető felhalmozódása és elterjedése elleni küzdelemhez való hozzájárulása
    tekintetében a 1999/730/KKBP határozat meghosszabbításáról és módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione 2005/784/PESC del Consiglio, del 7 novembre 2005, che proroga
    e modifica la decisione 1999/730/PESC in vista di un contributo dell’Unione
    europea alla lotta contro l’accumulazione e la diffusione destabilizzanti di
    armi portatili e di armi leggere in Cambogia
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2005/784/KĀDP (2005. gada 7. novembris), ar ko pagarina
    un groza Lēmumu 1999/730/KĀDP saistībā ar Eiropas Savienības ieguldījumu
    kājnieku ieroču un vieglo ieroču destabilizējošas uzkrāšanas un izplatīšanas
    apkarošanā Kambodžā
  type: main
- language: lt
  script: Latn
  content: 2005 m. lapkričio 7 d. Tarybos sprendimas 2005/784/BUSP, iš dalies keičiantis
    Sprendimą 1999/730/BUSP dėl Europos Sąjungos indėlio į kovą su mažų ginklų
    ir lengvųjų ginklų destabilizuojančiu kaupimu ir plitimu Kambodžoje, ir pratęsiantis
    jo taikymą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2005/784/PESK tas- 7 ta' Novembru 2005 li testendi
    u temenda d-Deċiżjoni 1999/730/PESK dwar is-sehem ta' l-Unjoni Ewropea fil-ġlieda
    kontra l-akkumulazzjoni u t-tixrid distabbilizzanti ta' armi żgħar u ħfief
    fil-Kambodja
  type: main
- language: nl
  script: Latn
  content: Besluit 2005/784/GBVB van de Raad van 7 november 2005 tot verlenging en
    wijziging van Besluit 1999/730/GBVB met het oog op een bijdrage van de Europese
    Unie aan de bestrijding van de destabiliserende accumulatie en verspreiding van
    handvuurwapens en lichte wapens in Cambodja
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2005/784/WPZiB z dnia 7 listopada 2005 r. rozszerzająca i
    zmieniająca decyzję 1999/730/WPZiB w związku z wkładem Unii Europejskiej w
    zwalczanie destabilizującego gromadzenia i rozpowszechniania ręcznej broni strzeleckiej
    i broni lekkiej w Kambodży
  type: main
- language: pt
  script: Latn
  content: Decisão 2005/784/PESC do Conselho, de 7 de Novembro de 2005, que prorroga
    e altera a Decisão 1999/730/PESC relativa ao contributo da União Europeia para
    o combate à acumulação e proliferação desestabilizadoras de armas de pequeno
    calibre e armas ligeiras no Camboja
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2005/784/SZBP zo 7. novembra 2005 o predĺžení účinnosti
    a o zmene a doplnení rozhodnutia 1999/730/SZBP o príspevku Európskej únie
    k boju proti destabilizačnému akumulovaniu a rozširovaniu ručných zbraní
    a ľahkých zbraní v Kambodži
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2005/784/SZVP z dne 7. novembra 2005 o podaljšanju veljavnosti
    in spremembi Sklepa 1999/730/SZVP o prispevku Evropske unije k boju proti destabilizirajočemu
    kopičenju in širjenju osebnega in lahkega orožja v Kambodži
  type: main
- language: es
  script: Latn
  content: Decisión 2005/784/PESC del Consejo, de 7 de noviembre de 2005, por la
    que se prorroga y modifica la Decisión 1999/730/PESC sobre la contribución de
    la Unión Europea para combatir la acumulación desestabilizadora y la proliferación
    de armas ligeras y de pequeño calibre en Camboya
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2005/784/GUSP av den 7 november 2005 om förlängning och
    ändring av beslut 1999/730/GUSP som ett bidrag från Europeiska unionen för
    att bekämpa destabiliserande anhopning och spridning av handeldvapen och lätta
    vapen i Kambodja
  type: main
