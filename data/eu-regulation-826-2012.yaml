title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 826/2012 of 29 June 2012 supplementing
    Regulation (EU) No 236/2012 of the European Parliament and of the Council with
    regard to regulatory technical standards on notification and disclosure requirements
    with regard to net short positions, the details of the information to be provided
    to the European Securities and Markets Authority in relation to net short positions
    and the method for calculating turnover to determine exempted shares
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 826/2012 de la Commission du 29 juin 2012
    complétant le règlement (UE) n ° 236/2012 du Parlement européen et du Conseil
    par des normes techniques de réglementation relatives aux obligations de notification
    et de publication des positions courtes nettes, au détail des informations à
    fournir à l'Autorité européenne des marchés financiers au sujet de ces positions
    et à la méthode de calcul du volume d'échanges à appliquer pour déterminer
    les actions exemptées
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 826/2012 der Kommission vom 29. Juni 2012
    zur Ergänzung der Verordnung (EU) Nr. 236/2012 des Europäischen Parlaments und
    des Rates im Hinblick auf technische Regulierungsstandards für die Melde- und
    Offenlegungspflichten in Bezug auf Netto-Leerverkaufspositionen, die Einzelheiten
    der in Bezug auf Netto-Leerverkaufspositionen an die Europäische Wertpapier-
    und Marktaufsichtsbehörde zu übermittelnden Informationen und die Methode zur
    Berechnung des Umsatzes zwecks Ermittlung der unter die Ausnahmeregelung fallenden
    Aktien
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) № 826/2012 на Комисията
    от 29 юни 2012 година за допълнение на Регламент
    (ЕС) № 236/2012 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за изискванията за уведомяване и оповестяване
    във връзка с нетни къси позиции, подробностите
    по информацията, която се предоставя на Европейския
    орган за ценни книжа и пазари относно нетните
    къси позиции, и метода за изчисляване на оборота,
    въз основа на който се определят изключените
    от изискванията акции
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 826/2012 ze dne 29.
    června 2012 , kterým se doplňuje nařízení Evropského parlamentu a Rady
    (EU) č. 236/2012, pokud jde o regulační technické normy týkající se požadavků
    na oznamování a zveřejňování, pokud jde o čisté krátké pozice, podrobností
    ohledně informací o čistých krátkých pozicích, které mají být poskytovány
