    di notifica e di comunicazione al pubblico delle posizioni corte nette, sulle
    informazioni dettagliate da presentare all'Autorità europea degli strumenti finanziari
    e dei mercati in relazione alle posizioni corte nette e sul metodo di calcolo
    del volume degli scambi per la determinazione dei titoli azionari esentati
  type: main
