  content: Regulamentul delegat (UE) nr. 826/2012 al Comisiei din 29 iunie 2012 de
    completare a Regulamentului (UE) nr. 236/2012 al Parlamentului European și al
    Consiliului în ceea ce privește standardele tehnice normative privind obligațiile
    de notificare și publicare referitoare la pozițiile scurte nete, detaliile informațiilor
    care trebuie furnizate Autorității europene pentru valori mobiliare și piețe
    cu privire la pozițiile scurte nete și metoda de calcul al volumului tranzacțiilor
    în vederea stabilirii acțiunilor exceptate
  type: main
- language: sk
  script: Latn
