    vedrørende korte nettopositioner, de oplysninger, som skal indgives til Den Europæiske
    Værdipapir- og Markedstilsynsmyndighed om korte nettopositioner, og metoden til
    beregning af omsætningen for at fastslå, hvilke aktier der er fritaget
  type: main
