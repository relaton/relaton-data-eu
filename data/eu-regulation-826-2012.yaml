    med tekniska tillsynsstandarder för krav på anmälan och offentliggörande av
    korta nettopositioner, för närmare uppgifter till Europeiska värdepappers-
    och marknadsmyndigheten om korta nettopositioner samt för metoden för omsättningsberäkning
    för att fastställa undantagna aktier
