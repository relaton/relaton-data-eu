    do Conselho, relativamente às normas técnicas de regulamentação no que se
    refere aos requisitos de notificação e de divulgação relativos às posições
    líquidas curtas, aos pormenores da informação a facultar à Autoridade Europeia
    dos Valores Mobiliários e dos Mercados em relação às posições líquidas
    curtas e ao método de cálculo do volume de transações para determinar as ações
    isentas
  type: main
