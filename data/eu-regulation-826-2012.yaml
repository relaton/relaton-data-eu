    ide o regulačné technické predpisy týkajúce sa požiadaviek na oznamovanie
    a zverejňovanie týkajúce sa čistých krátkych pozícií, podrobné informácie
    poskytované Európskemu orgánu pre cenné papiere a trhy v súvislosti s čistými
    krátkymi pozíciami a metódu na výpočet obratu na určenie oslobodených akcií
  type: main
- language: sl
  script: Latn
