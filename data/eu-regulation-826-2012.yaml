    uz regulatīvajiem tehniskajiem standartiem informēšanas un informācijas publiskošanas
    prasībām par neto īsajām pozīcijām, Eiropas Vērtspapīru tirgu iestādei
    sniedzamajām ziņām par neto īsajām pozīcijām un apgrozījuma aprēķināšanas
    metodi nolūkā noteikt atbrīvotās akcijas
  type: main
- language: lt
  script: Latn
  content: 2012 m. birželio 29 d. Komisijos deleguotasis reglamentas (ES) Nr. 826/2012,
