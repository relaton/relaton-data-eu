    Uredbe (EU) št. 236/2012 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi glede zahtev za priglasitev in razkritje neto kratkih pozicij,
    natančnih informacij o neto kratkih pozicijah, ki se posredujejo Evropskemu organu
    za vrednostne papirje in trge, in metod za izračun prometa za določitev izvzetih
    delnic
  type: main
