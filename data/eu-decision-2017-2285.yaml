title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2017/2285 of 6 December 2017 Amending the user's
    guide setting out the steps needed to participate in EMAS, under Regulation (EC)
    No 1221/2009 of the European Parliament and of the Council on the voluntary participation
    by organisations in a Community eco-management and audit scheme (EMAS) (notified
    under document C(2017) 8072)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2017/2285 de la Commission du 6 décembre 2017 modifiant
    le guide de l'utilisateur présentant les étapes nécessaires pour participer
    à l'EMAS conformément au règlement (CE) n° 1221/2009 du Parlement européen
    et du Conseil concernant la participation volontaire des organisations à un système
    communautaire de management environnemental et d'audit (EMAS) [notifiée sous
    le numéro C(2017) 8072]
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2017/2285 der Kommission vom 6. Dezember 2017 über die
    Änderung des Nutzerhandbuchs mit den Schritten, die zur Teilnahme an EMAS nach
    der Verordnung (EG) Nr. 1221/2009 des Europäischen Parlaments und des Rates über
    die freiwillige Teilnahme von Organisationen an einem Gemeinschaftssystem für
    Umweltmanagement und Umweltbetriebsprüfung unternommen werden müssen (Bekannt
    gegeben unter Aktenzeichen C(2017) 8072)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2017/2285 на Комисията от 6 декември
    2017 година за изменение на ръководството за
    потребителя, посочващо необходимите стъпки
    за участие в EMAS съгласно Регламент (ЕО) № 1221/2009
    на Европейския парламент и на Съвета относно
    доброволното участие на организации в Схемата
    на Общността за управление по околна среда
    и одит (EMAS) (нотифицирано под номер С(2017) 8072)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise (EU) 2017/2285 ze dne 6. prosince 2017 o změně příručky
    pro uživatele, která stanoví kroky nutné k účasti v systému EMAS podle
    nařízení Evropského parlamentu a Rady (ES) č. 1221/2009 o dobrovolné účasti
    organizací v systému Společenství pro environmentální řízení podniků
    a audit (EMAS) (oznámeno pod číslem C(2017) 8072)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse (EU) 2017/2285 af 6. december 2017 om ændring
    af brugervejledningen, der beskriver de skridt, det er nødvendigt at tage for
    at deltage i EMAS under Europa-Parlamentets og Rådets forordning (EF) nr. 1221/2009
    om organisationers frivillige deltagelse i en fællesskabsordning for miljøledelse
    og miljørevision (EMAS) (meddelt under nummmer C(2017) 8072)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2017/2285 της Επιτροπής, της 6ης
    Δεκεμβρίου 2017, για την τροποποίηση του οδηγού
    χρήστη που περιγράφει τα αναγκαία στάδια για
    τη συμμετοχή στο EMAS, βάσει του κανονισμού (ΕΚ)
    αριθ. 1221/2009 του Ευρωπαϊκού Κοινοβουλίου και
    του Συμβουλίου περί της εκούσιας συμμετοχής
    οργανισμών σε κοινοτικό σύστημα οικολογικής
    διαχείρισης και οικολογικού ελέγχου (EMAS) [κοινοποιηθείσα
    υπό τον αριθμό C(2017) 8072]
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus (EL) 2017/2285, 6. detsember 2017, millega muudetakse Euroopa
    Parlamendi ja nõukogu määruse (EÜ) nr 1221/2009 (organisatsioonide vabatahtliku
    osalemise kohta ühenduse keskkonnajuhtimis- ja -auditeerimissüsteemis (EMAS))
    kohast juhendit keskkonnajuhtimis- ja -auditeerimissüsteemis osalemiseks vajalike
    sammude kohta (teatavaks tehtud numbri C(2017) 8072 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös (EU) 2017/2285, annettu 6 päivänä joulukuuta 2017,
    organisaatioiden vapaaehtoisesta osallistumisesta yhteisön ympäristöasioiden
    hallinta- ja auditointijärjestelmään (EMAS-järjestelmä) annetun Euroopan
    parlamentin ja neuvoston asetuksen (EY) N:o 1221/2009 mukaisen, EMAS-järjestelmään
    liittymisen edellyttämät vaiheet esittävän käyttäjän käsikirjan muuttamisesta
    (tiedoksiannettu numerolla C(2017) 8072)
  type: main
- language: hr
  script: Latn
  content: Odluka Komisije (EU) 2017/2285 оd 6. prosinca 2017. o izmjeni priručnika
    za korisnike kojim se utvrđuju koraci koje je potrebno poduzeti za sudjelovanje
    u sustavu EMAS u skladu s Uredbom (EZ) br. 1221/2009 Europskog parlamenta i Vijeća
    o dobrovoljnom sudjelovanju organizacija u sustavu upravljanja okolišem i neovisnog
    ocjenjivanja Zajednice (EMAS) (priopćeno pod brojem dokumenta C(2017) 8072)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/2285 határozata (2017. december 6.) a szervezeteknek
    a közösségi környezetvédelmi vezetési és hitelesítési rendszerben (EMAS)
    való önkéntes részvételéről szóló 1221/2009/EK európai parlamenti és
    tanácsi rendelet értelmében létrehozott, az EMAS rendszerben való részvételhez
    szükséges lépéseket meghatározó felhasználói útmutató módosításáról
    (az értesítés a C(2017) 8072. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2017/2285 della Commissione, del 6 dicembre 2017, che modifica
    le linee guida per l'utente che illustrano le misure necessarie per aderire a
    EMAS, a norma del regolamento (CE) n. 1221/2009 del Parlamento europeo e del Consiglio,
    sull'adesione volontaria delle organizzazioni a un sistema comunitario di ecogestione
    e audit (EMAS) [notificata con il numero C(2017) 8072]
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2017/2285 (2017. gada 6. decembris), ar ko groza
    norādījumus par darbībām, kas vajadzīgas, lai piedalītos EMAS saskaņā
    ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1221/2009 par organizāciju brīvprātīgu
    dalību Kopienas vides vadības un audita sistēmā (EMAS) (izziņots ar dokumenta
    numuru C(2017) 8072)
  type: main
- language: lt
  script: Latn
  content: 2017 m. gruodžio 6 d. Komisijos sprendimas (ES) 2017/2285, kuriuo iš
    dalies keičiamas naudojimo vadovas, kuriame išdėstomi veiksmai, reikalingi
    siekiant dalyvauti Bendrijos aplinkosaugos vadybos ir audito sistemoje (EMAS)
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1221/2009 dėl organizacijų
    savanoriško Bendrijos aplinkosaugos vadybos ir audito sistemos (EMAS) taikymo
    (pranešta dokumentu Nr. C(2017) 8072)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni (UE) 2017/2285 tas-6 ta' Diċembru 2017 li
    temenda l-gwida għall-utent li tistabbilixxi l-passi meħtieġa għall-parteċipazzjoni
    fl-EMAS skont ir-Regolament (KE) Nru 1221/2009 tal-Parlament Ewropew u tal-Kunsill
    dwar il-parteċipazzjoni volontarja ta' organizzazzjonijiet fi skema Komunitarja
    ta' ġestjoni u verifika ambjentali (EMAS) (notifikata bid-dokument C(2017) 8072)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2017/2285 van de Commissie van 6 december 2017 tot wijziging
    van de leidraad waarin de noodzakelijke stappen voor deelname aan EMAS worden
    uitgelegd, overeenkomstig Verordening (EG) nr. 1221/2009 van het Europees Parlement
    en de Raad inzake de vrijwillige deelneming van organisaties aan een communautair
    milieubeheer- en milieuauditsysteem (EMAS) (Kennisgeving geschied onder nummer
    C(2017) 8072)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji (UE) 2017/2285 z dnia 6 grudnia 2017 r. zmieniająca przewodnik
    użytkownika, w którym określa się działania konieczne do uczestnictwa w EMAS,
    zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (WE) nr 1221/2009 w
    sprawie dobrowolnego udziału organizacji w systemie ekozarządzania i audytu
    we Wspólnocie (EMAS) (notyfikowana jako dokument nr C(2017) 8072)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2017/2285 da Comissão, de 6 de dezembro de 2017, que altera
    o guia do utilizador que indica os passos necessários para participar no EMAS,
    ao abrigo do Regulamento (CE) n.° 1221/2009 do Parlamento Europeu e do Conselho
    relativo à participação voluntária de organizações num sistema comunitário
    de ecogestão e auditoria (EMAS) [notificada com o número C(2017) 8072]
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2017/2285 a Comisiei din 6 decembrie 2017 de modificare a
    ghidului utilizatorului care stabilește etapele necesare participării la EMAS,
    în temeiul Regulamentului (CE) nr. 1221/2009 al Parlamentului European și al
    Consiliului privind participarea voluntară a organizațiilor la un sistem comunitar
    de management de mediu și audit (EMAS) [notificată cu numărul C(2017) 8072]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie (EÚ) 2017/2285 zo 6. decembra 2017, ktorým sa mení
    príručka pre používateľov s prehľadom podmienok účasti v EMAS podľa nariadenia
    Európskeho parlamentu a Rady (ES) č. 1221/2009 o dobrovoľnej účasti organizácií
    v schéme Spoločenstva pre environmentálne manažérstvo a audit (EMAS) [oznámené
    pod číslom C(2017) 8072]
  type: main
- language: sl
  script: Latn
  content: Sklep Komisije (EU) 2017/2285 z dne 6. decembra 2017 o spremembi navodil
    za uporabnike, v katerih so predstavljeni koraki, ki jih je treba opraviti za
    pristop k sistemu EMAS, v skladu z Uredbo (ES) št. 1221/2009 Evropskega parlamenta
    in Sveta o prostovoljnem sodelovanju organizacij v Sistemu Skupnosti za okoljsko
    ravnanje in presojo (EMAS) (notificirano pod dokumentarno številko C(2017) 8072)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2017/2285 de la Comisión, de 6 de diciembre de 2017, por
    la que se modifica la Guía del usuario en la que figuran los pasos necesarios
    para participar en el EMAS con arreglo al Reglamento (CE) n.° 1221/2009 del Parlamento
    Europeo y del Consejo relativo a la participación voluntaria de organizaciones
    en un sistema comunitario de gestión y auditoría medioambientales (EMAS) [notificada
    con el número C(2017) 8072]
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut (EU) 2017/2285 av den 6 december 2017 om ändring
    av användarhandledningen om hur man ska gå till väga för att delta i Emas
    i enlighet med Europaparlamentets och rådets förordning (EG) nr 1221/2009 om
