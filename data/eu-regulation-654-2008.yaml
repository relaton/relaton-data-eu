    επανεξέταση ενόψει της λήξης ισχύος των μέτρων
    σύμφωνα με το άρθρο 11 παράγραφος 2 του κανονισμού
    (ΕΚ) αριθ. 384/96
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 654/2008, 29. aprill 2008 , millega pärast
    määruse (EÜ) nr 384/96 artikli 11 lõike 2 kohast aegumise läbivaatamist kehtestatakse
    Hiina Rahvavabariigist pärit kumariini impordi suhtes lõplik dumpinguvastane
    tollimaks, mida laiendatakse Indiast, Taist, Indoneesiast ja Malaisiast pärit
    kumariini impordi suhtes, olenemata sellest, kas see deklareeritakse pärinevana
    Indiast, Taist, Indoneesiast ja Malaisiast või mitte
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 654/2008, annettu 29 päivänä huhtikuuta 2008
    , lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta
    peräisin olevan kumariinin tuonnissa, sellaisena kuin se on laajennettu koskemaan
    Intiasta, Thaimaasta, Indonesiasta ja Malesiasta lähetetyn kumariinin tuontia
    riippumatta siitä, onko kumariinin alkuperämaaksi ilmoitettu Intia, Thaimaa,
    Indonesia tai Malesia, asetuksen (EY) N:o 384/96 11 artiklan 2 kohdan mukaisen
    toimenpiteiden voimassaolon päättymistä koskevan tarkastelun seurauksena
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 654/2008 od 29. travnja 2008. o uvođenju konačne
    antidampinške pristojbe na uvoz kumarina podrijetlom iz Narodne Republike Kine
    kako je proširena na uvoz kumarina dostavljenog iz Indije, Tajlanda, Indonezije
    i Malezije, bez obzira na to je li deklariran kao da je podrijetlom iz Indije,
    Tajlanda, Indonezije i Malezije ili nije, po reviziji nakon isteka mjere u skladu
    s člankom 11. stavkom 2. Uredbe (EZ) br. 384/96
  type: main
- language: hu
  script: Latn
  content: A Tanács 654/2008/EK rendelete ( 2008. április 29. ) a 384/96/EK rendelet
    11. cikkének (2) bekezdése szerinti hatályvesztési felülvizsgálatot követően
    a Kínai Népköztársaságból származó kumarin behozatalára vonatkozó végleges
    dömpingellenes vám kivetéséről, az Indiából, Thaiföldről, Indonéziából
    és Malajziából feladott kumarin behozatalára is kiterjesztve, függetlenül
    attól, hogy Indiából, Thaiföldről, Indonéziából vagy Malajziából származónak
    jelentették-e be
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 654/2008 del Consiglio, del 29 aprile 2008 , che, in
    seguito ad un riesame in previsione della scadenza delle misure effettuato a norma
    dell’articolo 11, paragrafo 2, del regolamento (CE) n. 384/96, istituisce un
    dazio antidumping definitivo sulle importazioni di cumarina originaria della Repubblica
    popolare cinese, come esteso alle importazioni di cumarina spedita dall’India,
    dalla Tailandia, dall’Indonesia e dalla Malaysia, indipendentemente dal fatto
    che sia dichiarata o meno originaria di India, Tailandia, Indonesia o Malaysia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 654/2008 ( 2008. gada 29. aprīlis ), ar ko pēc
    termiņa beigu pārskatīšanas, kuru veica saskaņā ar Regulas (EK) Nr. 384/96
    11. panta 2. punktu, nosaka tādu galīgo antidempinga maksājumu Ķīnas Tautas
    Republikas izcelsmes kumarīna importam, kas ir attiecināts arī uz Indijas,
    Taizemes, Indonēzijas un Malaizijas kumarīna sūtījumiem, kuru izcelsme ir
    vai nav deklarēta Indijā, Taizemē, Indonēzijā un Malaizijā
  type: main
- language: lt
  script: Latn
  content: 2008 m. balandžio 29 d. Tarybos reglamentas (EB) Nr. 654/2008, nustatantis
    importuojamam Kinijos Liaudies Respublikos kilmės kumarinui galutinį antidempingo
    muitą, kurio taikymas, atlikus priemonių taikymo pabaigos peržiūrą remiantis
    Reglamento (EB) Nr. 384/96 11 straipsnio 2 dalimi, išplėstas importuojamam kumarinui,
    siunčiamam iš Indijos, Tailando, Indonezijos bei Malaizijos ir deklaruojamam
    arba ne kaip Indijos, Tailando, Indonezijos ar Malaizijos kilmės
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 654/2008 tad- 29 ta’ April 2008 li jimponi
    dazju antidumping definittiv fuq importazzjonijiet ta’ kumarina li toriġina
    fir-Repubblika Popolari taċ-Ċina, kif estiż għall-importazzjonijiet ta’
    kumarina konsenjati mill-Indja, mit-Tajlandja, mill-Indoneżja u mill-Malażja,
    kemm jekk dikjarati li joriġinaw fl-Indja, fit-Tajlandja, fl-Indoneżja u fil-Malażja
    kif ukoll jekk le wara reviżjoni ta’ skadenza skond l-Artikolu 11(2) tar-Regolament
    (KE) Nru 384/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 654/2008 van de Raad van 29 april 2008 tot instelling
    van een definitief antidumpingrecht op cumarine van oorsprong uit de Volksrepubliek
    China, zoals uitgebreid tot cumarine verzonden vanuit India, Thailand, Indonesië
    en Maleisië, al dan niet aangegeven als van oorsprong uit India, Thailand, Indonesië
    en Maleisië, naar aanleiding van een nieuw onderzoek bij het vervallen van de
    maatregelen op grond van artikel 11, lid 2, van Verordening (EG) nr. 384/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 654/2008 z dnia 29 kwietnia 2008 r. nakładające
    ostateczne cło antydumpingowe na przywóz kumaryny pochodzącej z Chińskiej
    Republiki Ludowej, rozszerzone na przywóz kumaryny wysyłanej z Indii, Tajlandii,
    Indonezji i Malezji, niezależnie od tego, czy zgłoszono ją jako pochodzącą
    z Indii, Tajlandii, Indonezji i Malezji, czy też nie, w następstwie przeglądu
    wygaśnięcia zgodnie z art. 11 ust. 2 rozporządzenia (WE) nr 384/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 654/2008 do Conselho, de 29 de Abril de 2008 , que
    institui um direito anti-dumping definitivo sobre as importações de cumarina
    originária da República Popular da China, tornado extensivo às importações
    de cumarina expedidas de Índia, Tailândia, Indonésia e Malásia, independentemente
    de ser ou não declarada originária de Índia, Tailândia, Indonésia e Malásia,
    na sequência de um reexame da caducidade em conformidade com o n. o 2 do artigo
    11. o do Regulamento (CE) n. o 384/96
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 654/2008 al Consiliului din 29 aprilie 2008 de impunere
    a unei taxe antidumping definitive la importurile de cumarină originară din
    Republica Populară Chineză, astfel cum a fost extins la importurile de cumarină
    expediată din India, Thailanda, Indonezia și Malaezia, fie că aceasta este
    declarată sau nu ca fiind originară din India, Thailanda, Indonezia și Malaezia,
    în urma unei reexaminări efectuate în perspectiva expirării măsurilor în
    temeiul articolului 11 alineatul (2) din Regulamentul (CE) nr. 384/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 654/2008 z 29. apríla 2008 , ktorým sa ukladá
    konečné antidumpingové clo na dovoz kumarínu s pôvodom v Čínskej ľudovej
    republike po jeho rozšírení na dovoz kumarínu dodávaného z Indie, Thajska,
    Indonézie a Malajzie, či je alebo nie je jeho pôvod deklarovaný v Indii, Thajsku,
    Indonézii a Malajzii po prešetrovaní pred uplynutím platnosti podľa článku
    11 ods. 2 nariadenia Rady (ES) č. 384/96
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 654/2008 z dne 29. aprila 2008 o uvedbi dokončne
    protidampinške dajatve na uvoz kumarina s poreklom iz Ljudske republike Kitajske,
    kakor je bila razširjena na uvoz kumarina poslanega iz Indije, Tajske, Indonezije
    in Malezije, ne glede na to, ali je deklariran kot s poreklom iz Indije, Tajske,
    Indonezije oziroma Malezije ali ne po pregledu zaradi izteka ukrepov skladno s
    členom 11(2) Uredbe (ES) št. 384/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 654/2008 del Consejo, de 29 de abril de 2008 , por
    el que se establece un derecho antidumping definitivo sobre las importaciones
    de cumarina originaria de la República Popular China, ampliado a las importaciones
    de cumarina procedentes de la India, Tailandia, Indonesia o Malasia, tanto si
    se declara originaria de la India, Tailandia, Indonesia o Malasia como si no,
    tras una reconsideración por expiración en virtud del artículo 11, apartado
    2, del Reglamento (CE) n o 384/96
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 654/2008 av den 29 april 2008 om införande
    av en slutgiltig antidumpningstull på import av kumarin med ursprung i Folkrepubliken
    Kina, utvidgad till att även omfatta Indien, Thailand, Indonesien och Malaysia,
    oavsett om deras deklarerade ursprung är Indien, Thailand, Indonesien och Malaysia
    eller inte, efter en översyn vid giltighetstidens utgång i enlighet med artikel
    11.2 i förordning (EG) nr 384/96
