type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 654/2008 of 29 April 2008 imposing a definitive
    anti-dumping duty on imports of coumarin originating in the People’s Republic
    of China, as extended to imports of coumarin consigned from India, Thailand, Indonesia
    and Malaysia, whether declared as originating in India, Thailand, Indonesia and
    Malaysia or not following an expiry review pursuant to Article 11(2) of Regulation
    (EC) No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 654/2008 du Conseil du 29 avril 2008 instituant un
    droit antidumping définitif sur les importations de coumarine originaire de la
    République populaire de Chine, tel qu’étendu aux importations de coumarine
    expédiée d’Inde, de Thaïlande, d’Indonésie et de Malaisie, qu’elle ait
    été ou non déclarée originaire de ces pays, à la suite d’un réexamen des
    mesures parvenant à expiration au titre de l’article 11, paragraphe 2, du règlement
    (CE) n o 384/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 654/2008 des Rates vom 29. April 2008 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Cumarin mit Ursprung
    in der Volksrepublik China, ausgeweitet auf aus Indien, Thailand, Indonesien und
    Malaysia versandte Einfuhren von Cumarin, ob als Ursprungserzeugnis Indiens, Thailands,
    Indonesiens und Malaysias angemeldet oder nicht, nach einer Auslaufüberprüfung
    gemäß Artikel 11 Absatz 2 der Verordnung (EG) Nr. 384/96
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 654/2008 на Съвета от 29 април
    2008 година относно налагане на окончателно
    антидъмпингово мито върху вноса на кумарин
    с произход от Китайската народна република
    с разширен обхват на действие и върху вноса
    на кумарин, изпращан от Индия, Тайланд, Индонезия
    и Малайзия независимо дали е деклариран с произход
    от Индия, Тайланд, Индонезия и Малайзия или
    не, след преразглеждане с оглед изтичането
    на срока на действие на мерките съгласно член
    11, параграф 2 от Регламент (ЕО) № 384/96
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 654/2008 ze dne 29. dubna 2008 , kterým se na
    základě přezkumu před pozbytím platnosti podle čl. 11 odst. 2 nařízení
    (ES) č. 384/96 ukládá konečné antidumpingové clo z dovozu kumarinu pocházejícího
    z Čínské lidové republiky rozšířené na dovoz kumarinu odesílaného z
    Indie, Thajska, Indonésie a Malajsie, ať již je deklarován jako pocházející
    z Indie, Thajska, Indonésie a Malajsie, či nikoliv
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 654/2008 af 29. april 2008 om indførelse af
    en endelig antidumpingtold på importen af cumarin med oprindelse i Folkerepublikken
    Kina, udvidet til også at omfatte import af cumarin afsendt fra Indien, Thailand,
    Indonesien og Malaysia, og uanset om varen er angivet med oprindelse i Indien,
    Thailand, Indonesien eller Malaysia eller ej, efter en udløbsundersøgelse i
    henhold til artikel 11, stk. 2, i forordning (EF) nr. 384/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 654/2008 του Συμβουλίου,
    της 29ης Απριλίου 2008 , για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές κουμαρίνης
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, μετά
    την επέκταση της ισχύος του δασμού στις εισαγωγές
    κουμαρίνης που αποστέλλονται από την Ινδία,
    την Ταϊλάνδη, την Ινδονησία και τη Μαλαισία,
    είτε έχουν δηλωθεί ως καταγωγής Ινδίας, Ταϊλάνδης,
