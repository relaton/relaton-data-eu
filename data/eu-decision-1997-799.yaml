title:
- language: en
  script: Latn
  content: '97/799/EC: Commission Decision of 14 November 1997 recognizing that the
    production of certain vins de pays and quality wines psr in France, by reason
    of their qualitative characteristics, is far from able to satisfy demand (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/799/CE: Décision de la Commission du 14 novembre 1997 reconnaissant
    que la production de certains vins de pays et certains v.q.p.r.d. en France est,
    du fait des caractéristiques qualitatives de ces vins, largement inférieure
    à la demande (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/799/EG: Entscheidung der Kommission vom 14. November 1997 mit der Feststellung,
    daß die Erzeugung bestimmter Landweine und bestimmter Qualitätsweine b. A. in
    Frankreich wegen qualitativer Merkmale der Nachfrage nicht entspricht (Nur der
    französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/799/EF: Kommissionens beslutning af 14. november 1997 om anerkendelse
    af, at produktionen af visse landvine og visse k.v.b.d. i Frankrig på grund af
    disse vines kvalitative egenskaber langtfra er tilstrækkelig til at dække efterspørgslen
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/799/ΕΚ: Απόφαση της Επιτροπής της 14ης Νοεμβρίου
    1997 με την οποία αναγνωρίζεται ότι η παραγωγή
    ορισμένων τοπικών οίνων και v.q.p.r.d. στη Γαλλία
    είναι, λόγω των ποιοτικών χαρακτηριστικών
    των οίνων αυτών, σε μεγάλο βαθμό κατώτερη από
    τη ζήτηση (Το κείμενο στη γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/799/EY: Komission päätös, tehty 14 päivänä marraskuuta 1997,
    Ranskassa tuotettujen tiettyjen maaviinien ja tiettyjen tma-laatuviinien tuotannon
    toteamisesta niiden laatuominaisuuksien vuoksi huomattavasti kysyntää pienemmäksi
    (Ainoastaan ranskankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/799/CE: Decisione della Commissione del 14 novembre 1997 che riconosce
    la produzione di taluni «vins de pays» e v.q.p.r.d. in Francia largamente inferiore
    alla domanda a causa delle caratteristiche qualitative di tali vini (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/799/EG: Beschikking van de Commissie van 14 november 1997 houdende
    erkenning van het feit dat de productie van bepaalde landwijnen en bepaalde v.q.p.r.d.
    in Frankrijk, gezien de kwaliteitskenmerken van deze wijnen, ver bij de vraag
    achterblijft (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/799/CE: Decisão da Comissão de 14 de Novembro de 1997 que reconhece
    que a produção de determinados vinhos regionais e vqprd em França é, pelas
    suas características de qualidade, substancialmente inferior à procura (Apenas
    faz fé o texto em língua francesa)'
  type: main
- language: es
  script: Latn
  content: '97/799/CE: Decisión de la Comisión de 14 de noviembre de 1997 por la
