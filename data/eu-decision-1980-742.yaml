id: EUDecision1980742
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/742/EEC: Commission Decision of 8 July 1980 authorizing the Italian
    Republic not to apply Community treatment to sewing machines, falling within subheading
    84.41 A of the Common Customs Tariff, originating in Japan and in free circulation
    in the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/742/CEE: Décision de la Commission, du 8 juillet 1980, autorisant
    la République italienne à exclure du traitement communautaire les machines à
    coudre (les tissus, les cuirs, les chaussures, etc.) y compris les meubles pour
    machines à coudre, de la sous-position 84.41 A du tarif douanier commun, originaires
    du Japon et mises en libre pratique dans les autres Etats membres (Le texte en
    langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/742/EWG: Entscheidung der Kommission vom 8. Juli 1980, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Nähmaschinen (z.B. zum Nähen von
    Spinnstoffwaren, Leder oder Schuhen), einschließlich Möbel zum Einbau von Nähmaschinen,
    der Tarifstelle 84.41 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/742/EØF: Kommissionens beslutning af 8. juli 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage symaskiner,
    møbler, specielt fremstillet til symaskiner, som henhører under pos. 84.41 A
    i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i de øvrige
    medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/742/CEE: Decisione della Commissione, dell''8 luglio 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le macchine per
    cucire (tessuti, cuoi, calzature ecc.), compresi i mobili per dette macchine,
    della sottovoce 84.41 A della tariffa doganale comune, originarie del Giappone
    e messe in libera pratica negli altri Stati membri (Il testo in lingua italiana
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/742/EEG: Beschikking van de Commissie van 8 juli 1980 waarbij de Italiaanse
    Republiek wordt gemachtigd naaimachines (voor weefsels, voor leder, voor schoeisel,
    enz.), meubelen voor naaimachines daaronder begrepen, van post 84.41 A van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
