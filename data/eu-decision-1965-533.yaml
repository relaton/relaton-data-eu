title:
- language: fr
  script: Latn
  content: Décision 65/533/CEE de la Commission, du 29 novembre 1965, autorisant
    la République fédérale d'Allemagne à suspendre partiellement à l'égard des
    pays tiers ses droits de douane applicables aux vaches vivantes de boucherie de
    l'espèce bovine, des espèces domestiques, de la sous-position Ex 01.02 A II
  type: main
- language: de
  script: Latn
  content: '65/533/EWG: Entscheidung der Kommission vom 29. November 1965 zur Ermächtigung
    der Bundesrepublik Deutschland, ihre Zollsätze für Schlachtkühe, lebend, der
    Rasse Hausrinder, der Tarifstelle ex 01.02 A II, gegenüber Drittländern teilweise
    auszusetzen'
  type: main
- language: it
  script: Latn
  content: '65/533/CEE: Decisione della Commissione, del 29 novembre 1965, che autorizza
    la Repubblica federale di Germania a sospendere parzialmente i dazi doganali applicabili
    alle importazioni dai paesi terzi di vacche vive da macello, della specie bovina,
    delle specie domestiche, della sottovoce ex 01.02 A II'
  type: main
- language: nl
  script: Latn
  content: '65/533/EEG: Beschikking van de Commissie van 29 november 1965 waarbij
    de Bondsrepubliek Duitsland wordt gemachtigd ten aanzien van derde landen haar
    douanerechten op levende slachtkoeien, runderen, huisdieren, van de onderverdeling
    ex 01.02 A II, gedeeltelijk te schorsen'
  type: main
