title:
- language: en
  script: Latn
  content: '81/945/EEC: Commission Decision of 10 November 1981 on a Belgian Government
    proposal to aid certain investments to be carried out by a Belgian undertaking
    for the establishment of production capacity of argon (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/945/CEE: Décision de la Commission, du 10 novembre 1981, concernant
    une aide que le gouvernement belge projette d''accorder en faveur de certains
    investissements à réaliser par une entreprise belge visant la mise en oeuvre
    d''une capacité de production d''argon (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/945/EWG: Entscheidung der Kommission vom 10. November 1981 über ein
    Beihilfevorhaben der belgischen Regierung zugunsten der Investitionen eines belgischen
    Unternehmens zur Inbetriebnahme einer Produktionskapazität für Argon (Nur der
    französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/945/EØF: Kommissionens beslutning af 10. november 1981 om en støtte,
    som den belgiske regering påtænker at yde til visse investeringer, som en belgisk
    virksomhed agter at foretage til opførsel af et anlæg til produktion af argon
    (Kun de franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/945/EOK: Απόφαση της Επιτροπής της 10ης Νοεμβρίου
    1981 σχετικά με την ενίσχυση που σχεδιάζει να
    χορηγήσει η κυβέρνηση του Βελγίου υπέρ ορισμένων
    επενδύσεων που πραγματοποιήθηκαν από μιά βελγική
    επιχείρηση με σκοπό τον εκσυγχρονισμό των
    εγκαταστάσεων παραγωγής αργού (Τα κείμενα
    στη γαλλική και ολλανδική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/945/CEE: Decisione della Commissione, del 10 novembre 1981, concernente
    un regime di aiuti che il governo belga intende accordare a favore di investimenti
    effettuati da una società belga per la creazione di un impianto di produzione
    di argon (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/945/EEG: Beschikking van de Commissie van 10 november 1981 betreffende
