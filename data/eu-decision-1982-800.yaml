title:
- language: en
  script: Latn
  content: '82/800/EEC: Commission Decision of 15 November 1982 establishing that
    the apparatus described as ''Ithaco - Heterodyne Lock-in Amplifier, model Dynatrac
    391A'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/800/CEE: Décision de la Commission, du 15 novembre 1982, constatant
    que l''importation de l''appareil dénommé "Ithaco - Heterodyne Lock-in Amplifier,
    model Dynatrac 391A" peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/800/EWG: Entscheidung der Kommission vom 15. November 1982, mit der
    festgestellt wird, daß das Gerät ,,Ithaco - Heterodyne Lock-in Amplifier, model
    Dynatrac 391A" , unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/800/EØF: Kommissionens beslutning af 15. november 1982 om fastslåelse
    af, at indførsel af apparatet "Ithaco - Heterodyne Lock-in Amplifier, model Dynatrac
    391A" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
