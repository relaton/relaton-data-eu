title:
- language: en
  script: Latn
  content: '80/712/EEC: Commission Decision of 3 July 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of expenditure incurred
    during 1976 on aids and premiums relating to the modernization of farms (Only
    the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/712/CEE: Décision de la Commission, du 3 juillet 1980, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", au Royaume de Belgique des dépenses effectuées pendant l''année
    1976 pour les aides et primes relatives à la modernisation des exploitations
    agricoles (Les textes en langues française et néerlandaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '80/712/EWG: Entscheidung der Kommission vom 3. Juli 1980 über die Rückvergütung
    der im Jahr 1976 zur Modernisierung landwirtschaftlicher Betriebe für Beihilfen
    und Prämien getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das
    Königreich Belgien (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/712/EØF: Kommissionens beslutning af 3. juli 1980 om refusion gennem
    EUGFL, udviklingssektionen, til kongeriget Belgien af de udgifter, som er afholdt
    i løbet af året 1976 til støtte og præmier vedrørende modernisering af landbrugsbedrifter
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/712/CEE: Decisione della Commissione, del 3 luglio 1980, relativa al
    rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle spese
    effettuate durante il 1976 per gli aiuti ed i premi relativi all''ammodernamento
    delle aziende agricole (Il testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/712/EEG: Beschikking van de Commissie van 3 juli 1980 inzake de vergoeding
    door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van de gedurende
    het jaar 1976 gedane uitgaven voor de steun en premies met betrekking tot de modernisering
    van landbouwbedrijven (Slechts de teksten in de Franse en de Nederlandse taal
    zijn authentiek)'
