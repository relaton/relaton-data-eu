title:
- language: en
  script: Latn
  content: '2000/585/EC: Commission Decision of 7 September 2000 laying down animal
    and public health conditions and veterinary certifications for import of wild
    and farmed game meat and rabbit meat from third countries and repealing Commission
    Decisions 97/217/EC, 97/218/EC, 97/219/EC and 97/220/EC (notified under document
    number C(2000) 2492)'
  type: main
- language: fr
  script: Latn
  content: '2000/585/CE: Décision de la Commission du 7 septembre 2000 définissant
    les conditions sanitaires et de police sanitaire ainsi que la certification vétérinaire
    requises pour les importations de viandes de gibier sauvage, de gibier d''élevage
    et de lapin en provenance de pays tiers et abrogeant les décisions 97/217/CE,
    97/218/CE, 97/219/CE et 97/220/CE de la Commission (notifiée sous le numéro
    C(2000) 2492)'
  type: main
- language: de
  script: Latn
  content: '2000/585/EG: Entscheidung der Kommission vom 7. September 2000 zur Festlegung
    der Veterinärbedingungen und Veterinärbescheinigungen für die Einfuhr von Fleisch
    von freilebendem Wild, Fleisch von Zuchtwild und Kaninchenfleisch aus Drittländern
    und zur Aufhebung der Entscheidungen 97/217/EG, 97/218/EG, 97/219/EG und 97/220/EG
    (Bekanntgegeben unter Aktenzeichen K(2000) 2492)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 7 септември 2000 година
    за определяне на ветеринарно-санитарните и
    здравните изисквания и ветеринарното сертифициране
    за вноса на месо от дивеч и отгледан във ферми
    дивеч, както и на заешко месо от трети страни,
    и за отмяна на Решения 97/217/ЕО, 97/218/ЕО, 97/219/ЕО
    и 97/220/ЕО на Комисията (нотифицирано под номер
    C(2000) 2492)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 7. září 2000, kterým se stanoví veterinární
    a hygienické podmínky a veterinární osvědčení pro dovoz masa volně žijící
    a farmové zvěře a králičího masa ze třetích zemí a kterým se zrušují
    rozhodnutí Komise 97/217/ES, 97/218/ES, 97/219/ES a 97/220/ES (oznámeno pod
    číslem K(2000) 2492)
  type: main
- language: da
  script: Latn
  content: '2000/585/EF: Kommissionens beslutning af 7. september 2000 om dyre- og
