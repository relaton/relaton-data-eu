  type: main
- language: it
  script: Latn
  content: '2000/585/CE: Decisione della Commissione, del 7 settembre 2000, che stabilisce
    le condizioni sanitarie, di polizia sanitaria e di certificazione veterinaria
    per l''importazione dai paesi terzi di carni di selvaggina, carni di selvaggina
    di allevamento e carni di coniglio e che abroga le decisioni 97/217/CE, 97/218/CE,
    97/219/CE e 97/220/CE [notificata con il numero C(2000) 2492]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2000. gada 7. septembris), ar ko paredz dzīvnieku un
    sabiedrības veselības nosacījumus un veterināro sertifikāciju savvaļas un
    saimniecībā audzētu medījamo dzīvnieku gaļas un trušu gaļas importam no
    trešām valstīm un atceļ Komisijas Lēmumus 97/217/EK, 97/218/EK, 97/219/EK
    un 97/220/EK (izziņots ar dokumenta Nr. C(2000) 2492)
  type: main
