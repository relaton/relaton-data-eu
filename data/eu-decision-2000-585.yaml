    ved import af kød af vildtlevende og opdrættet vildt og kaninkød fra tredjelande
    og om ophævelse af beslutning 97/217/EF, 97/218/EF, 97/219/EF og 97/220/EF (meddelt
    under nummer K(2000) 2492)'
  type: main
