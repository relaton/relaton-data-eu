title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 53/83 of 7 January 1983 accepting undertakings
    given in connection with the anti-dumping proceeding concerning photographic enlargers
    originating in Poland and the USSR, terminating the proceeding and lifting the
    provisional anti-dumping duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 53/83 de la Commission du 7 janvier 1983 portant acceptation
    d' engagements dans le cadre de la procédure anti-"dumping" concernant les appareils
    d' agrandissement photographiques originaires de Pologne et d' Union soviétique,
    clôture de la procédure et abrogation du droit anti-"dumping" provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 53/83 der Kommission vom 7. Januar 1983 über die
    Annahme von Verpflichtungserklärungen im Rahmen des Antidumpingverfahrens betreffend
    photographische Vergrößerungsgeräte mit Ursprung in Polen und der Sowjetunion,
    die Einstellung des Verfahrens und die Aufhebung des vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 53/83 af 7. januar 1983 om godtagelse
    af tilsagn afgivet i forbindelse med antidumpingproceduren vedrørende forstørrelsesapparater
    til fotografisk brug med oprindelse i Polen og Sovjetunionen, om afslutning af
    denne procedure og om ophævelse af den midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 53/83 της Επιτροπής
    της 7ης Ιανουαρίου 1983 περί της αποδοχής των
    δηλώσεων αναλήψεως υποχρεώσεων στο πλαίσιο
    της διαδικασίας αντιντάμπινγκ για μηχανήματα
    φωτογραφικών μεγεθύνσεων καταγωγής Πολωνίας
    και Σοβιετικής Ενώσεως, περατώσεως της διαδικασίας
    και καταργήσεως του προσωρινού δασμού αντιντάμπινγκ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 53/83 della Commissione del 7 gennaio 1983 che accetta
    gli impegni assunti nell' ambito della procedura antidumping relativa alle importazioni
    di apparecchi fotografici d' ingrandimento originari della Polonia e dell' Unione
    Sovietica, conclude detta procedura ed abolisce il dazio provvisorio antidumping
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 53/83 van de Commissie van 7 januari 1983 houdende
    aanvaarding van verbintenissen in het kader van de anti-dumpingprocedure betreffende
    vergrotingstoestellen voor de fotografie van oorsprong uit Polen en de USSR, beëindiging
    van de procedure en opheffing van het voorlopige anti-dumpingrecht
