- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3053/88 of 3 October 1988 amending Regulation
    (EEC) No 731/88 on the sale at prices fixed at a standard rate in advance of certain
    beef from intervention stocks for processing under an aid programme organized
    by a Member State
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3053/88 de la Commission, du 3 octobre 1988, modifiant
    le règlement (CEE) n 731/88 relatif à la vente à prix fixé forfaitairement
    à l'avance, en vue de leur transformation et exportation dans le cadre de programmes
    d'aide organisés par certains États membres, de certaines viandes bovines provenant
    des stocks d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3053/88 der Kommission vom 3. Oktober 1988 zur Änderung
