    βοείων κρεάτων που προέρχονται από τα αποθέματα
    της παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3053/88 della Commissione, del 3 ottobre 1988, che
    modifica il regolamento (CEE) n. 731/88 relativo alla vendita, a prezzi fissati
    forfettariamente in anticipo, di talune carni bovine provenienti dalle scorte
    di intervento destinate alla trasformazione e all'esportazione nell'ambito di
    programmi di aiuto organizzati da determinati Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3053/88 van de Commissie van 3 oktober 1988 tot wijziging
    van Verordening (EEG) nr. 731/88 inzake de verkoop, tegen vooraf forfaitair vastgestelde
    prijzen, van rundvlees uit interventievoorraden voor verwerking en export in het
    kader van door bepaalde Lid-Staten opgezette voedselhulpprogramma's
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3053/88 da Comissão, de 3 de Outubro de 1988, que
