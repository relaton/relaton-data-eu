    for oksekød fra interventionslagre med henblik på forarbejdning og udførsel
    som led i hjælpeprogrammer, tilrettelagt af visse medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3053/88 της Επιτροπής
