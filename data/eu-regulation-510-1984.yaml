    οποίες προορίζονται για μεταποίηση και είναι
    δυνατόν να εισαχθούν υπό ειδικούς όρους για
    το πρώτο τρίμηνο του 1984
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 510/84 della Commissione, del 27 febbraio 1984, che
