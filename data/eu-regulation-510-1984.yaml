  content: Commission Regulation (EEC) No 510/84 of 27 February 1984 fixing the quantities
    of frozen beef intended for processing which may be imported on special conditions
    for the first quarter of 1984
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 510/84 de la Commission, du 27 février 1984, fixant
    les quantités de viandes bovines congelées destinées à la transformation pouvant
    être importées à des conditions spéciales pour le premier trimestre de 1984
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 510/84 der Kommission vom 27. Februar 1984 zur Festsetzung
    der zur Verarbeitung bestimmten Mengen gefrorenen Rindfleisches, die für das
    erste Vierteljahr 1984 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 510/84 af 27. februar 1984 om fastsættelse
