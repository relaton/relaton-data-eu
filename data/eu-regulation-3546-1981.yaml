  content: Council Regulation (EEC) No 3546/81 of 3 December 1981 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and the Kingdom of Morocco fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Morocco, for the period 1 November 1981 to 31 October 1982
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3546/81 du Conseil, du 3 décembre 1981, concernant
    la conclusion de l'accord sous forme d'échange de lettres entre la Communauté
    économique européenne et le Royaume du Maroc fixant, pour la période du 1er
    novembre 1981 au 31 octobre 1982, le montant additionnel à déduire du prélèvement
    applicable à l'importation dans la Communauté d'huile d'olive non traitée originaire
    du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3546/81 des Rates vom 3. Dezember 1981 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Königreich Marokko zur Festsetzung des vom 1. November 1981 bis 31. Oktober
    1982 geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft von nicht
    behandeltem Olivenöl mit Ursprung in Marokko von der Abschöpfung abzuziehen
    ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3546/81 af 3. december 1981 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og kongeriget Marokko vedrørende fastsættelse for periden 1. november 1981 til
    31. oktober 1982 af det tillægsbeløb, som skal fratrækkes den afgift, der anvendes
    ved indførsel til Fællesskabet af ikke behandlet olivenolie med oprindelse i
    Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3546/81 τού Συμβουλίου
    τής 3ης Δεκεμβρίου 1981 περί συνάψεως συμφωνίας
    υπό μορφή ανταλλαγής επιστολών μεταξύ τής
    Ευρωπαϊκής Οικονομικής Κοινότητος καί τού
    Βασιλείου τού Μαρόκου περί καθορισμού, γιά
    τήν περίοδο από 1 Νοεμβρίου 1981 έως 31 Οκτωβρίου
    1982, τού πρόσθετου ποσού πού πρέπει νά αφαιρεθεί
