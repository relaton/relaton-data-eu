title:
- language: en
  script: Latn
  content: Commission Decision of 18 April 1978 authorizing the French Republic not
    to apply Community treatment to handkerchiefs, falling within heading No ex 61.05
    of the Common Customs Tariff, originating in the People's Republic of China and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/421/CEE: Décision de la Commission, du 18 avril 1978, autorisant la
    République française à exclure du traitement communautaire les mouchoirs, de
    la position Ex 61.05 du Tarif douanier commun, originaires de la République populaire
    de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. April 1978, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Taschentücher der Tarifnummer ex
    61.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 18. april 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage lommetørklæder, som henhører
    under pos. ex 61.05 i den fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 aprile 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i fazzoletti da naso della voce
    ex 61.05 della tariffa doganale comune, originari della Repubblica popolare cinese
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 april 1978 waarbij de Franse Republiek
    wordt gemachtigd zakdoeken van post ex 61.05 van het gemeenschappelijk douanetarief,
    van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
