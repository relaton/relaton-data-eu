title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3464/80 of 30 December 1980 amending Regulation
    (EEC) No 2657/80 on the determination of prices of fresh or chilled sheep carcases
    on representative Community markets and the survey of prices of certain other
    qualities of sheep carcases in the Community, as a result of Greek accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3464/80 de la Commission, du 30 décembre 1980, modifiant
    le règlement (CEE) n° 2657/80 relatif à la détermination des prix de carcasses
    d' ovins fraîches ou réfrigérées constatés sur les marchés représentatifs
    de la Communauté et au relevé des prix de certaines autres qualités de carcasses
    d' ovins dans la Communauté, à la suite de l' adhésion de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3464/80 der Kommission vom 30. Dezember 1980 zur Änderung
    der Verordnung (EWG) Nr 2657/80 zur Bestimmung der auf den repräsentativen Märkten
    der Gemeinschaft festgestellten Preise für frische oder gekühlte Tierkörper
    von Schafen und zur Ermittlung der Preise einiger anderer Qualitäten von Tierkörpern
    von Schafen in der Gemeinschaft infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3464/80 af 30. december 1980 om ændring
    af forordning (EØF) nr. 2657/80 om bestemmelser af priserne for ferske eller
    kølede fårekroppe, der konstateres på Fællesskabets repræsentative markeder,
    og om registrering af priserne for visse andre fårekroppekvaliteter i Fællesskabet,
    på grund af Grækenlands tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3464/80 τής Επιτροπής
    τής 30ής Δεκεμβρίου 1980 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 2657/80 «περί τού καθορισμού
    τιμών τών νωπών ή διατετηρημένων δι απλής ψύξεως
    σφαγίων προβατοειδών πού διαπιστώνονται στίς
    αντιπροσωπευτικές αγορές τής Κοινότητος»
    καί «περί τού πίνακος τών τιμών ορισμένων άλλων
    ποιοτήτων σφαγίων προβατοειδών εντός τής Κοινότητος,
    κατόπιν τής προσχωρήσεως τής Ελλάδος»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3464/80 della Commissione, del 30 dicembre 1980, che
    modifica, in seguito all' adesione della Grecia, il regolamento (CEE) n. 2657/80
    relativo alla determinazione dei prezzi delle carcasse ovine, fresche o refrigerate,
    constatati sui mercati rappresentativi della Comunità e al rilevamento dei prezzi
    di talune altre qualità di carcasse ovine nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3464/80 van de Commissie van 30 december 1980 tot
    wijziging van Verordening (EEG) nr. 2657/80 betreffende de vaststelling van de
    op de representatieve markten van de Gemeenschap geconstateerde prijzen voor geslachte
    schapen, vers of gekoeld, en betreffende de constatering van de prijzen voor sommige
    andere kwaliteiten geslachte schapen in de Gemeenschap, naar aanleiding van de
    toetreding van Griekenland
  type: main
