title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 321/94 of 11 February 1994 laying down exceptional
    measures in relation to the set- aside rules in order to alleviate the effects
    of severe flooding in certain areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 321/94 de la Commission du 11 février 1994 arrêtant
    des mesures exceptionnelles en rapport avec les modalités de gel des terres afin
    d'atténuer les conséquences de graves inondations dans certaines régions de
    la Communauté
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 321/94 DER KOMMISSION vom 11. Februar 1994 mit infolge
    erheblicher Überschwemmunsschäden in mehreren Gebieten der Gemeinschaft zu treffenden
    besonderen Stillegungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 321/94 af 11. februar 1994 om særforanstaltninger
    i forbindelse med jordudtagningsordningen for at afbøde virkningerne af den alvorlige
    oversvømmelse i visse EU-områder
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 321/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 11ης Φεβρουαρίου 1994 για έκτακτα μέτρα που
    σχετίζονται με τις λεπτομέρειες της εφαρμογής
    της παύσης καλλιέργειας των γαιών προκειμένου
    να αμβλυνθούν οι επιπτώσεις των σοβαρών πλημμυρών
    σε ορισμένες περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 321/94 DELLA COMMISSIONE dell' 11 febbraio 1994 recante
    miure eccezionali in materia di ritiro dei seminativi dalla produzione intese
    ad alleviare le conseguenze delle gravi inondazioni che hanno colpito alcune regioni
    della Comunità
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 321/94 VAN DE COMMISSIE van 11 februari 1994 tot vaststelling
    van uitzonderingsmaatregelen in het kader van de braakleggingsvoorschriften om
    de gevolgen van ernstige overstromingen in sommige delen van de Gemeenschap te
    beperken
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 321/94 DA COMISSÃO de 11 de Fevereiro de 1994 que
    estabelece derrogações às regras aplicáveis no âmbito do regime de retiradas
    de terras, a fim de compensar os efeitos de inundações graves registadas em
    determinadas zonas da Comunidade
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 321/94 DE LA COMISIÓN de 11 de febrero de 1994 por
    el que se establecen medidas especiales en relación con las normas de retirada
    de tierras para paliar las consecuencias de las graves inundaciones registradas
    en ciertas zonas de la Comunidad
  type: main
