title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1451/2006 of 29 September 2006 amending Annexes
    I and II to Council Regulation (EEC) No 2377/90 laying down a Community procedure
    for the establishment of maximum residue limits of veterinary medicinal products
    in foodstuffs of animal origin, as regards fluazuron, sodium nitrite and peforelin
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1451/2006 de la Commission du 29 septembre 2006 modifiant
    les annexes I et II du règlement (CEE) n o 2377/90 du Conseil établissant une
    procédure communautaire pour la fixation des limites maximales de résidus de
    médicaments vétérinaires dans les aliments d'origine animale en ce qui concerne
    le fluazuron, le nitrite de sodium et le peforelin
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1451/2006 der Kommission vom 29. September 2006 zur
    Änderung der Anhänge I und II der Verordnung (EWG) Nr. 2377/90 des Rates zur
    Schaffung eines Gemeinschaftsverfahrens für die Festsetzung von Höchstmengen
    für Tierarzneimittelrückstände in Nahrungsmitteln tierischen Ursprungs in Bezug
    auf Fluazuron, Natriumnitrit und Peforelin
  type: main
