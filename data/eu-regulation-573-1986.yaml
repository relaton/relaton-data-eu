  content: Council Regulation (EEC) No 573/86 of 28 February 1986 laying down the
    arrangements applicable to trade in certain fishery products with Norway and Sweden,
    consequent upon the accession of Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 573/86 du Conseil du 28 février 1986 fixant le régime
