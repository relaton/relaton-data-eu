    des Beitritts Spaniens und Portugals zur Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 573/86 af 28. februar 1986 om fastsættelse
    af den ordning, der skal gælde for samhandelen med visse fiskerivarer med Norge
    og Sverige som følge af Spaniens og Portugals tiltrædelse
  type: main
- language: el
  script: Grek
