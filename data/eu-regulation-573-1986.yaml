    καθεστώτος που εφαρμόζεται κατά τις συναλλαγές
    ορισμένων προϊόντων αλιείας με τη Νορβηγία
    και τη Σουηδία μετά από την προσχώρηση της
    Ισπανίας και της Πορτογαλίας
  type: main
- language: it
  script: Latn
