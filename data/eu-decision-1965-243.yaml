title:
- language: fr
  script: Latn
  content: Décision 65/243/CEE de la Commission, du 26 mars 1965, relative au concours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire les "filets de poisson de mer, frais, réfrigérés
    ou congelés", originaires de Norvège et mis en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '65/243/EWG: Entscheidung der Kommission vom 26. März 1965 über die Inanspruchnahme
    von Artikel 115 Absatz (1) des Vertrages durch die Französische Republik, um
    aus Norwegen stammende Seefischfilets, frisch, gekühlt oder gefroren, die in
    den anderen Mitgliedstaaten in den freien Verkehr gebracht wurden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/243/CEE: Decisione della Commissione, del 26 marzo 1965, relativa alla
    domanda presentata dalla Repubblica francese, ai sensi dell''articolo 115, primo
    comma, del Trattato, per ottenere l''autorizzazione ad escludere dal trattamento
    comunitario i «filetti di pesci di mare, freschi, refrigerati o congelati»,
    originari della Norvegia e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/243/EEG: Beschikking van de Commissie van 26 maart 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag filets van zeevis, vers, gekoeld of bevroren, die van oorsprong
    zijn uit Noorwegen en in de andere Lid-Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
