  content: Décision de la Commission, du 21 décembre 1967, portant octroi d'un contingent
    tarifaire supplémentaire à la République italienne pour les graines de betteraves
    à sucre, des variétés "Maribo", "Buszczinsky", "Janaz" et "Saroz"
  type: main
- language: de
  script: Latn
  content: '68/34/EWG: Entscheidung der Kommission vom 21. Dezember 1967 über die
    Gewährung eines zusätzlichen Zollkontingents an die Italienische Republik für
    Zuckerrübensamen der Sorten "Maribo", "Buszczinsky", "Janaz" und "Saroz" der
    Tarifnummer ex 12.03 A des Gemeinsamen Zolltarifs'
  type: main
- language: it
  script: Latn
  content: '68/34/CEE: Decisione della Commissione, del 21 dicembre 1967, relativa
    alla concessione di un contingente tariffario supplementare alla Repubblica italiana
    per i semi di barbabietola da zucchero delle varietà «Maribo», «Buszczinsky»,
    «Janaz» e «Saroz» (voce n. ex 12.03 A della tariffa doganale comune)'
  type: main
- language: nl
  script: Latn
  content: '68/34/EEG: Beschikking van de Commissie van 21 december 1967 houdende
    toekenning van een aanvullend tariefcontingent aan de Italiaanse Republiek voor
    suikerbietenzaad van de variëteiten: "Maribo", "Buszczinsky", "Janaz" en "Saroz"'
