title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2587/79 of 22 November 1979 re-establishing
    the levying of customs duties on articles of jewellery and parts thereof, of precious
    metal, falling within subheading 71.12 A and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2587/79 de la Commission, du 22 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux articles
    de bijouterie et de joaillerie et leurs parties, en métaux précieux, de la sous-position
    tarifaire 71.12 A, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2587/79 der Kommission vom 22. November 1979 zur Wiedereinführung
    des Zollsatzes für Schmuckwaren und Teile davon, aus Edelmetallen, der Tarifstelle
    71.12 A, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2587/79 af 22. november 1979 om genindførelse
    af opkrævning af toldafgifter bijouterivarer og dele deraf, af ædle metaller,
    henhørende under pos. 71.12 A i den fælles toldtarif, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2587/79 della Commissione, del 22 novembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili a minuterie e oggetti
    di gioielleria e loro parti, di metalli preziosi della sottovoce 71.12 A, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2587/79 van de Commissie van 22 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor bijouterieën en juwelen,
    alsmede delen daarvan, van edele metalen, van post 71.12 A, van oorsprong uit
    de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad tariefpreferenties werden geopend
  type: main
