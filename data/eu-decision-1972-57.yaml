  content: Décision de la Commission, du 17 décembre 1971, relative au remboursement
    par le FEOGA, section orientation, à la République fédérale d'Allemagne des
    frais entraînés par les enquêtes sur le cheptel porcin effectuées les 3 mars
    et 3 juin 1971
  type: main
- language: de
  script: Latn
  content: '72/57/EWG: Entscheidung der Kommission vom 17. Dezember 1971 über die
    Erstattung der bei den am 3. März und 3. Juni 1971 durchgeführten Erhebungen
    über den Schweinebestand entstandenen Kosten durch den EAGFL, Abteilung Ausrichtung,
    an die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '72/57/CEE: Decisione della Commissione del 17 dicembre 1971 relativa al
    rimborso da parte del FEAOG sezione orientamento alla Repubblica federale di Germania
    delle spese sostenute per le inchieste sul patrimonio suinicolo effettuate il
    3 marzo e il 3 giugno 1971'
  type: main
- language: nl
  script: Latn
  content: '72/57/EEG: Beschikking van de Commissie van 17 december 1971 betreffende
    de terugbetaling door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland
    van de kosten verbonden aan de op 3 maart en 3 juni 1971 uitgevoerde enquêtes
    inzake de varkensstapel'
