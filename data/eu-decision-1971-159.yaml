  content: Décision du Conseil du 8 février 1971, portant conclusion d'un accord
    entre la Communauté économique européenne et le comité international de la
    Croix-Rouge relatif à la fourniture de 200 tonnes de bouillie et 1000 tonnes
    de potage à titre d'aide alimentaire en faveur des populations sinistrées du
    Pakistan oriental
  type: main
- language: de
  script: Latn
  content: '71/159/EWG: Beschluß des Rates vom 8. Februar 1971 über den Abschluß
    eines Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft und dem Internationalen
    Komitee vom Roten Kreuz über die Lieferung von 200 Tonnen Brei und 1 000 Tonnen
    Suppe im Rahmen der Nahrungsmittelhilfe für die notleidende Bevölkerung in Ostpakistan'
  type: main
- language: it
  script: Latn
  content: '71/159/CEE: Decisione del Consiglio, dell''8 febbraio 1971, relativa alla
    conclusione di un accordo tra la Comunità economica europea e il Comitato internazionale
    della Croce rossa per la fornitura di 200 tonnellate di pappa e 1.000 tonnellate
    di minestra a titolo di aiuto alimentare a favore delle popolazioni sinistrate
    del Pakistan orientale'
  type: main
- language: nl
  script: Latn
  content: '71/159/EEG: Besluit van de Raad van 8 februari 1971 houdende sluiting
    van een Overeenkomst tussen de Europese Economische Gemeenschap en het Internationaal
    Comité van het Rode Kruis voor de levering van 200 ton pap en 1.000 ton soep,
    in het kader van de voedselhulp, ten behoeve van de getroffen bevolking van Oost-Pakistan'
  type: main
