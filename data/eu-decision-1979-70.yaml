title:
- language: en
  script: Latn
  content: '79/70/EEC: Commission Decision of 20 December 1978 amending for the second
    time Decision 78/360/EEC authorizing certain Member States to sell butter at a
    reduced price in the form of concentrated butter (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/70/CEE: Décision de la Commission, du 20 décembre 1978, portant deuxième
    modification de la décision 78/360/CEE autorisant plusieurs Etats membres à
    vendre du beurre à prix réduit sous forme de beurre concentré (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/70/EWG: Entscheidung der Kommission vom 20. Dezember 1978 zur zweiten
    Änderung der Entscheidung 78/360/EWG zur Ermächtigung einiger Mitgliedstaaten,
    Butter in Form von Butterreinfett zu ermäßigten Preisen zu verkaufen (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/70/EØF: Kommissionens beslutning af 20. december 1978 om anden ændring
    af beslutning 78/360/EØF om bemyndigelse af flere medlemsstater til at sælge
    smør til nedsat pris i form af koncentreret smør (Kun den engelske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '79/70/ΕΟΚ : Απόφαση της Επιτροπής, της 20ής
    Δεκεμβρίου 1978, με την οποία τροποποιείται για
    δεύτερη φορά η απόφαση 78/360/ΕΟΚ με την οποία
    επιτρέπεται σε αρκετά κράτη μέλη να πωλήσουν
    βούτυρο με μειωμένη τιμή υπό την μορφή συμπυκνώματος
    βουτύρου (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '79/70/CEE: Decisione della Commissione, del 20 dicembre 1978, recante
    seconda modifica della decisione 78/360/CEE che autorizza alcuni Stati membri
    a vendere burro a prezzo ridotto sotto forma di burro concentrato (Il testo in
    lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/70/EEG: Beschikking van de Commissie van 20 december 1978 houdende
    tweede wijziging van Beschikking 78/360/EEG tot machtiging van verschillende Lid-Staten
    om boter tegen verlaagde prijs in de vorm van boterconcentraat te verkopen (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
