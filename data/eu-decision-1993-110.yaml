  content: '93/110/EEC: Council Decision of 15 February 1993 authorizing the French
    Republic to extend the application of a measure derogating from Article 2 of the
    sixth Directive (77/388/EEC) on the harmonization of the laws of the Member States
    relating to turnover taxes'
  type: main
- language: fr
  script: Latn
