title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 31 juillet 1963, relative aux recours du
    Royaume de Belgique, du Grand-Duché de Luxembourg et du Royaume des Pays-Bas
    à l'article 115 alinéa 1 du Traité CEE pour exclure du traitement communautaire
    les engrais minéraux ou chimiques azotés de la position 31.02 B du Tarif douanier
    commun originaires de pays tiers et mis en libre pratique dans les autres États
    membres
  type: main
- language: de
  script: Latn
  content: '63/506/EWG: Entscheidung der Kommission vom 31. Juli 1963 betreffend die
    Inanspruchnahme von Artikel 115 Absatz (1) des Vertrages durch das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande zur
    Ausschließung von aus dritten Ländern stammenden mineralischen oder chemischen
    Stickstoffdüngemitteln der Tarifnummer 31.02 B des Gemeinsamen Zolltarifs, die
    sich in den anderen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung'
  type: main
- language: it
  script: Latn
  content: '63/506/CEE: Decisione della Commissione del 31 luglio 1963 relativa ai
    ricorsi del Regno del Belgio, del Granducato del Lussemburgo e del Regno dei Paesi
    Bassi, all''articolo 115, comma 1, del Trattato, per escludere dal trattamento
    comunitario i concimi minerali o chimici azotati di cui alla voce tariffaria 31.02
    B della tariffa doganale comune, originari da paesi terzi e immessi in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/506/EEG: Beschikking van de Commissie van 31 juli 1963 betreffende
    het beroep van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk
    der Nederlanden op artikel 115, alinea 1, van het EEG- Verdrag om minerale of
    chemische stikstofhoudende meststoffen van post 31.02 B van het gemeenschappelijk
    douanetarief, die van oorsprong zijn uit derde landen en in de andere Lid-Staten
    in het vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
