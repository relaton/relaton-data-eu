  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/2759 av den 19 juli 2024
    om komplettering av Europaparlamentets och rådets förordning (EU) 2015/760 vad
    gäller tekniska tillsynsstandarder som specificerar när derivat används enbart
    för att säkra inneboende risker i europeiska långsiktiga investeringsfonders
    (Eltif-fonders) andra investeringar, kraven på Eltif-fonders policy för inlösen
    och verktyg för likviditetshantering, omständigheterna för matchning av begäranden
    om överföring av andelar eller aktier i Eltif-fonder, vissa kriterier för avyttringen
    av Eltif-fonders tillgångar och vissa delar av redovisningen av kostnader
