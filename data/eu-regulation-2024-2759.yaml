title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/2759 of 19 July 2024 supplementing
    Regulation (EU) 2015/760 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying when derivatives will be used solely
    for hedging the risks inherent to other investments of the European long-term
    investment fund (ELTIF), the requirements for an ELTIF’s redemption policy and
    liquidity management tools, the circumstances for the matching of transfer requests
    of units or shares of the ELTIF, certain criteria for the disposal of ELTIF assets,
    and certain elements of the costs disclosure
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/2759 de la Commission du 19 juillet 2024
    complétant le règlement (UE) 2015/760 du Parlement européen et du Conseil par
    des normes techniques de réglementation précisant quand des instruments dérivés
    sont utilisés uniquement pour couvrir les risques inhérents aux autres investissements
    d’un fonds européen d’investissement à long terme (ELTIF), les exigences
    relatives à la politique de remboursement et aux outils de gestion de la liquidité
    d’un ELTIF, les circonstances de l’appariement des demandes de transfert de
    parts ou d’actions de l’ELTIF, certains critères de cession d’actifs de
    l’ELTIF et certains éléments relatifs à l’indication des frais
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/2759 der Kommission vom 19. Juli 2024 zur
    Ergänzung der Verordnung (EU) 2015/760 des Europäischen Parlaments und des Rates
    durch technische Regulierungsstandards, mit denen festgelegt wird, wann Derivate
    einzig und allein der Absicherung der mit anderen Anlagen europäischer langfristiger
    Investmentfonds (ELTIF) verbundenen Risiken dienen, und mit denen die Anforderungen
    in Bezug auf die Rücknahmegrundsätze und die Liquiditätsmanagementinstrumente
    eines ELTIF, die Umstände für den Abgleich von Anträgen auf Übertragung von
    Anteilen des ELTIF, bestimmte Kriterien für die Veräußerung von ELTIF-Vermögenswerten
    und bestimmte Elemente der Kostenangabe festgelegt werden
  type: main
- language: bg
  script: Cyrl
