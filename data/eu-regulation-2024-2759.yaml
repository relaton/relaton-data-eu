    átruházási kérelmek összepárosításának körülményeit, az EHTBA eszközeinek
    elidegenítésére vonatkozó bizonyos kritériumokat, valamint a ráfordítások
    nyilvánosságra hozatalának bizonyos elemeit meghatározó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/2759 della Commissione, del 19 luglio 2024,
    che integra il regolamento (UE) 2015/760 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i casi
    in cui i derivati saranno utilizzati unicamente allo scopo di copertura dei rischi
    inerenti ad altri investimenti del fondo di investimento europeo a lungo termine
