  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2024/2759, 19. juuli 2024, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2015/760 seoses regulatiivsete
    tehniliste standarditega, millega määratakse kindlaks, millal kasutatakse tuletisinstrumente
    üksnes Euroopa pikaajalise investeerimisfondi (ELTIF) muudele investeeringutele
    omaste riskide maandamiseks, ELTIFi osakute või aktsiate tagasivõtmise poliitikale
    ja likviidsuse juhtimise vahenditele esitatavad nõuded, ELTIFi osakute või aktsiate
    ülekandmise taotluste sobitamise asjaolud, ELTIFi vara võõrandamise teatavad
    kriteeriumid ja kulude avalikustamise teatavad elemendid
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2024/2759, annettu 19 päivänä heinäkuuta
    2024, Euroopan parlamentin ja neuvoston asetuksen (EU) 2015/760 täydentämisestä
    teknisillä sääntelystandardeilla, joissa määritetään, koska johdannaisia
    käytetään ainoastaan eurooppalaisen pitkäaikaissijoitusrahaston muihin sijoituksiin
    liittyviltä riskeiltä suojautumiseen, sekä eurooppalaisen pitkäaikaissijoitusrahaston
