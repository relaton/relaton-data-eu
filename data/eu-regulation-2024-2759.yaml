    ar informācijas atklāšanu par izmaksām
  type: main
- language: lt
  script: Latn
  content: 2024 m. liepos 19 d. Komisijos deleguotasis reglamentas (ES) 2024/2759,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2015/760 papildomas techniniais
    reguliavimo standartais, kuriais nustatomi atvejai, kuriais išvestinės finansinės
    priemonės bus naudojamos tik siekiant apsidrausti nuo kitoms Europos ilgalaikių
    investicijų fondo (ELTIF) investicijoms būdingos rizikos, ELTIF išpirkimo politikai
    ir likvidumo valdymo priemonėms taikomi reikalavimai, prašymų perleisti ELTIF
    investicinius vienetus ar akcijas derinimo aplinkybės, tam tikri ELTIF turto
    pardavimo ar perleidimo kriterijai ir tam tikri sąnaudų atskleidimo elementai
  type: main
