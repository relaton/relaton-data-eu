  script: Latn
  content: A Bizottság (EU) 2024/2759 felhatalmazáson alapuló rendelete (2024.
    július 19.) az (EU) 2015/760 európai parlamenti és tanácsi rendeletnek a származtatott
    ügyletek kizárólag az európai hosszú távú befektetési alap (EHTBA) egyéb
    befektetéseivel járó kockázatok fedezésére történő használatának feltételeit,
    az EHTBA visszaváltási politikájára és likviditáskezelési eszközeire vonatkozó
