  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/2759 ze dne 19. července
    2024, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2015/760,
    pokud jde o regulační technické normy, které stanoví, kdy se deriváty použijí
    výhradně k zajištění proti rizikům vyplývajícím z dalších investic
    evropského fondu dlouhodobých investic (ELTIF), požadavky na pravidla pro odkup
    a nástroje pro řízení likvidity fondu ELTIF, podmínky pro párování žádostí
    o převod podílových jednotek nebo akcií fondu ELTIF, některá kritéria pro
    prodej aktiv fondu ELTIF a některé prvky zveřejňování nákladů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/2759 af 19. juli 2024 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2015/760
    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer,
    hvornår derivater kun tjener det formål at afdække risici, der er knyttet til
    den europæiske langsigtede investeringsfonds (ELTIF) andre investeringer, kravene
    til en ELTIF's indløsningspolitik og likviditetsstyringsværktøj, omstændighederne
    for matchning af anmodninger om overdragelse af andele eller kapitalandele i ELTIF'en,
    visse kriterier for afhændelse af ELTIF-aktiver og visse elementer vedrørende
    oplysning om omkostninger
