  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2024/2759 van de Commissie van 19 juli 2024
    tot aanvulling van Verordening (EU) 2015/760 van het Europees Parlement en de
    Raad met technische reguleringsnormen ter bepaling van de situaties waarin derivaten
    mogen worden gebruikt uitsluitend voor het hedgen van de risico’s inherent aan
    andere beleggingen van de Europese langetermijnbeleggingsinstelling (Eltif), de
    vereisten voor een terugbetalingsbeleid en liquiditeitsbeheerinstrumenten van
    een Eltif, de omstandigheden voor het matchen van verzoeken tot overdracht van
    rechten van deelneming of aandelen in de Eltif, bepaalde criteria voor de vervreemding
    van Eltif-activa, en bepaalde elementen van de informatieverschaffing over de
    kosten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2024/2759 z dnia 19 lipca 2024
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2015/760
    w odniesieniu do regulacyjnych standardów technicznych określających, kiedy
    instrumenty pochodne są wykorzystywane jedynie do zabezpieczenia ryzyka związanego
    z innymi inwestycjami europejskiego długoterminowego funduszu inwestycyjnego
    (EDFI), wymogi dotyczące polityki umarzania EDFI i narzędzi zarządzania płynnością,
    okoliczności zestawiania wniosków o przeniesienie jednostek uczestnictwa lub
    udziałów EDFI, niektóre kryteria dotyczące zbycia aktywów EDFI oraz niektóre
    elementy ujawniania kosztów
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/2759 da Comissão, de 19 de julho de 2024,
    que complementa o Regulamento (UE) 2015/760 do Parlamento Europeu e do Conselho
    no respeitante às normas técnicas de regulamentação que especificam em que
    casos os derivados são utilizados unicamente para fins de cobertura de riscos
    inerentes a outros investimentos do fundo europeu de investimento a longo prazo
    (ELTIF), aos requisitos aplicáveis à política de resgate e aos instrumentos
    de gestão da liquidez de um ELTIF, às circunstâncias para a correspondência
    de pedidos de transferência de unidades de participação ou ações do ELTIF,
    a determinados critérios para a alienação de ativos do ELTIF e a determinados
    elementos da divulgação dos custos
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/2759 al Comisiei din 19 iulie 2024 de completare
    a Regulamentului (UE) 2015/760 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează situațiile
    în care instrumentele financiare derivate vor fi utilizate exclusiv pentru acoperirea
    riscurilor inerente altor investiții ale fondului european de investiții pe
    termen lung (ELTIF), cerințele privind politica de răscumpărare a ELTIF și
    instrumentele sale de gestionare a lichidităților, circumstanțele pentru corelarea
    cererilor de transfer de unități sau acțiuni ale ELTIF, anumite criterii pentru
    cesiunea activelor ELTIF și anumite elemente ale furnizării de informații privind
    costurile
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/2759 z 19. júla 2024, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2015/760, pokiaľ ide
    o regulačné technické predpisy, v ktorých sa bližšie určuje, kedy sa deriváty
    použijú výlučne na hedžing rizík vyplývajúcich z iných investícií európskeho
    dlhodobého investičného fondu (ELTIF), ako aj požiadavky na politiku vyplatenia
    a nástroje riadenia likvidity ELTIF, okolnosti spárovania žiadostí o prevod
    podielových listov alebo akcií ELTIF, určité kritériá na odpredaj aktív
    ELTIF a určité prvky zverejňovania informácií o nákladoch
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/2759 z dne 19. julija 2024 o dopolnitvi
    Uredbe (EU) 2015/760 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi za določitev, kdaj se izvedeni finančni instrumenti uporabljajo izključno
    za varovanje pred tveganji, neločljivo povezanimi z drugimi naložbami evropskega
    dolgoročnega investicijskega sklada (ELTIF), zahtev za politiko odkupov in orodja
    za upravljanje likvidnosti ELTIF, okoliščin za usklajevanje zahtev za prenos
    enot ali delnic ELTIF, nekaterih meril za prodajo sredstev ELTIF in nekaterih
    elementov razkritja stroškov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/2759 de la Comisión, de 19 de julio de 2024,
    por el que se completa el Reglamento (UE) 2015/760 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación en las que se
    especifican las circunstancias en que el uso de un derivado tendrá como única
    finalidad cubrir los riesgos inherentes a otras inversiones del fondo de inversión
    a largo plazo europeo (FILPE), los requisitos relativos a la política de reembolso
    y los instrumentos de gestión de la liquidez de un FILPE, las circunstancias
    para la coincidencia de las solicitudes de transferencia de participaciones o
    acciones del FILPE, determinados criterios para la enajenación de los activos
    del FILPE y determinados elementos de la indicación de los costes
  type: main
