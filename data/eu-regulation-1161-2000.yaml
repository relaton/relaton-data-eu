    δασμολογίου κατά την εισαγωγή τριαντάφυλλων
    με μικρό άνθος καταγωγής Ισραήλ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1161/2000, annettu 30 päivänä toukokuuta 2000,
