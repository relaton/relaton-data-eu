  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 842/90 DELLA COMMISSIONE del 30 marzo 1990 che ripristina
    la riscossione dei dazi doganali applicabili ai vestiti, completi e insiemi della
    categoria di prodotti n. 16 (numero d'ordine 40.0160) e agli abiti a giacca e
    completi a maglia della categoria di prodotti n. 74 (numero d'ordine 40.0740),
    originari della Tailandia, beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 842/90 VAN DE COMMISSIE van 30 maart 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties van de categorie van produkten nr. 16 (volgnummer 40.0160) en mantelpakken
    of broekpakken en combinaties van de categorie van produkten nr. 74 (volgnummer
    40.0740), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 842/90 DA COMISSAO de 30 de Março de 1990 que restabelece
