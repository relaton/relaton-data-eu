title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 842/90 of 30 March 1990 reintroducing the
    levying of the customs duties on men's or boys'suits and ensembles, products of
    category No 16 (order No 40.0160) and women's or girls'suits and ensembles products
    of category No 74 (order No 40.0740) originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 842/90 de la Commission du 30 mars 1990 portant rétablissement
    de la perception des droits de douane applicables aux costumes, complets et ensembles,
    de la catégorie de produits n° 16 (numéro d'ordre 40.0160), originaires de
    Thaïlande, et aux costumes-tailleurs et ensembles de la catégorie de produits
    n° 74 (numéro d'ordre 40.0740) originaires de Thaïlande, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 842/90 DER KOMMISSION vom 30. Maerz 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Anzuege und Kombinationen der Warenkategorie
    Nr. 16 (Laufende Nummer 40.0160) und Kostueme und Kombinationen der Warenkategorie
    Nr. 74 (Laufende Nummer 40.0740) mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 842/90 af 30. marts 1990 om genindførelse
    af opkrævning af told for jakkesæt under varekategori nr. 16 (løbenummer 40.0160)
    og dragter, kostumer og sæt, under varekategori nr. 74 (løbenummer 40.0740),
    som har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
