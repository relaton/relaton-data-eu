    for perioden 21. maj 1998 - 20. maj 2001 af de fiskerimuligheder og den finansielle
    modydelse, der er omhandlet i aftalen mellem Det Europæiske Økonomiske Fællesskab
    og Republikken Madagaskar om fiskeri ud for Madagaskar'
  type: main
- language: el
  script: Grek
