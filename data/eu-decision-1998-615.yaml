  type: main
- language: fi
  script: Latn
  content: '98/615/ÅÊ: Neuvoston päätös, tehty 22 päivänä lokakuuta 1998,
    Euroopan talousyhteisön ja Madagaskarin tasavallan välisessä Madagaskarin rannikon
    edustalla harjoitettavaa kalastusta koskevassa sopimuksessa määrättyjen kalastusmahdollisuuksien
    ja taloudellisen korvauksen vahvistamisesta 21 päivän toukokuuta 1998 ja 20
    päivän toukokuuta 2001 väliseksi ajaksi tehdyn pöytäkirjan väliaikaista
    soveltamista koskevan sopimuksen tekemisestä kirjeenvaihtona'
  type: main
