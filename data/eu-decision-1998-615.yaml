    Οκτωβρίου 1998 όσον αφορά τη σύναψη συμφωνίας
    υπό μορφή ανταλλαγής επιστολών σχετικά με
    την προσωρινή εφαρμογή του πρωτοκόλλου το
    οποίο καθορίζει τις αλιευτικές δυνατότητες
    και τη χρηματοδοτική αντιστάθμιση που προβλέπονται
    στη συμφωνία μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και της Δημοκρατίας της Μαδαγασκάρης
