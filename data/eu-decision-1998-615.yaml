title:
- language: en
  script: Latn
  content: '98/615/EC: Council Decision of 22 October 1998 on the conclusion of an
    agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol setting out the fishing opportunities and financial compensation
    provided for in the Agreement between the European Economic Community and the
    Republic of Madagascar on fishing off Madagascar for the period from 21 May 1998
    to 20 May 2001'
  type: main
- language: fr
  script: Latn
  content: '98/615/CE: Décision du Conseil du 22 octobre 1998 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contrepartie financière
    prévues dans l''accord entre la Communauté économique européenne et la République
    de Madagascar concernant la pêche au large de Madagascar, pour la période du
    21 mai 1998 au 20 mai 2001'
  type: main
- language: de
  script: Latn
  content: '98/615/EG: Beschluß des Rates vom 22. Oktober 1998 über den Abschluß
