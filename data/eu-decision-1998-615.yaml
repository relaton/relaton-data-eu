    nach dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Republik
    Madagaskar über die Fischerei vor der Küste Madagaskars für die Zeit vom 21.
    Mai 1998 bis zum 20. Mai 2001'
  type: main
- language: da
  script: Latn
  content: '98/615/EF: Rådets afgørelse af 22. oktober 1998 om indgåelse af aftalen
