    određenih osoba i subjekata povezanih s Osamom bin Ladenom, mrežom Al-Qaidom
    i talibanima te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2083/2002/EK rendelete (2002. november 22.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet nyolcadik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2083/2002 della Commissione, del 22 novembre 2002,
    recante ottava modifica del regolamento (CE) n. 881/2002 del Consiglio che impone
    specifiche misure restrittive nei confronti di determinate persone ed entità
    associate a Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento
    (CE) n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2083/2002 (2002. gada 22. novembris), ar kuru
    astoto reizi groza Padomes Regulu (EK) Nr. 881/2002, ar kuru paredz īpašus ierobežojošus
    pasākumus, kas vērsti pret konkrētām personām un organizācijām, kas saistītas
    ar Osamu Bin Ladenu, Al-Qaida tīklu un Taliban, un ar kuru atceļ Padomes Regulu
    (EK) Nr. 467/2001
  type: main
- language: lt
  script: Latn
  content: 2002 m. lapkričio 22 d. Komisijos reglamentas (EB) Nr. 2083/2002, aštuntą
    kartą iš dalies keičiantis Tarybos reglamentą (EB) Nr. 881/2002, nustatantį
    tam tikras specialias ribojančias priemones, taikomas tam tikriems asmenims ir
    subjektams, susijusiems su Usama bin Ladenu, Al-Qaida tinklu ir Talibanu, ir panaikinantį
    Tarybos reglamentą (EB) Nr. 467/2001
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2083/2002 tat-22 ta' Novembru 2002
    li jemenda għat-tmien darba r-Regolament tal-Kunsill (KE) Nru 881/2002 li jimponi
    ċerti miżuri restrittivi speċifiċi immirati kontra ċerti persuni u entitajiet
    assoċjati ma' Usama bin Laden, in-network ta' l-Al-Qaida u t-Taliban, u li jħassar
    ir-Regolament tal-Kunsill (KE) Nru 467/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2083/2002 van de Commissie van 22 november 2002 tot
    achtste wĳziging van Verordening (EG) nr. 881/2002 van de Raad tot vaststelling
    van bepaalde specifieke beperkende maatregelen tegen sommige personen en entiteiten
    die banden hebben met Usama bin Laden, het Al Qa'ida-netwerk en de Taliban, en
    tot intrekking van Verordening (EG) nr. 467/2001 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2083/2002 z dnia 22 listopada 2002 r. zmieniające
    po raz ósmy rozporządzenie Rady (WE) nr 881/2002 wprowadzające niektóre szczególne
    środki ograniczające skierowane przeciwko niektórym osobom i podmiotom związanym
    z Osamą bin Ladenem, siecią Al-Kaida i Talibami, i uchylające rozporządzenie
    Rady (WE) nr 467/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2083/2002 da Comissão, de 22 de Novembro de 2002,
    que altera pela oitava vez o Regulamento (CE) n.° 881/2002 do Conselho que institui
    certas medidas restritivas específicas contra determinadas pessoas e entidades
    associadas a Osama Bin Laden, à rede Al-Qaida e aos Talibã, e que revoga o Regulamento
    (CE) n.° 467/2001 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2083/2002 al Comisiei din 22 noiembrie 2002 de efectuare
    a celei de-a opta modificări a Regulamentului (CE) nr. 881/2002 al Consiliului
    de instituire a unor măsuri restrictive specifice împotriva anumitor persoane
    și entități care au legătură cu Osama ben Laden, cu rețeaua Al-Qaida și
    cu talibanii și de abrogare a Regulamentului (CE) nr. 467/2001 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2083/2002 z 22. novembra 2002, ktorým sa ôsmykrát
