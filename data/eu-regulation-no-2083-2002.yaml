    špecifické obmedzujúce opatrenia proti určitým osobám a subjektom v spojení
    s Usámom bin Ládinom, sieťou al-Káida a Talibanom a ktorým sa zrušuje nariadenie
    Rady (ES) č. 467/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2083/2002 z dne 22. novembra 2002 o osmi spremembi
    Uredbe Sveta (ES) št. 881/2002 o posebnih omejevalnih ukrepih za nekatere osebe
    in subjekte, povezane z Osama bin Ladnom, mrežo Al-Kaida in talibani, in o razveljavitvi
    Uredbe Sveta (ES) št. 467/2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2083/2002 de la Comisión, de 22 de noviembre de 2002,
