    на Регламент (ЕО) № 881/2002 на Съвета за налагане
    на някои специфични ограничителни мерки, насочени
    срещу определени лица и образувания, свързани
    с Осама бен Ладен, мрежата на Ал Кайда и талибаните,
    и за отмяна на Регламент (ЕО) № 467/2001 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2083/2002 ze dne 22. listopadu 2002, kterým
    se poosmé mění nařízení Rady (ES) č. 881/2002 o zavedení některých zvláštních
    omezujících opatření namířených proti některým osobám a subjektům spojeným
    s Usámou bin Ládinem, sítí Al-Kajdá a Talibanem a o zrušení nařízení
    Rady (ES) č. 467/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2083/2002 af 22. november 2002 om ottende
