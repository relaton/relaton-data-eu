title:
- language: en
  script: Latn
  content: Council Directive 85/6/EEC of 19 December 1984 amending for the third time
    Directive 74/329/EEC on the approximation of the laws of the Member States relating
    to emulsifiers, stabilizers, thickeners and gelling agents for use in foodstuffs
  type: main
- language: fr
  script: Latn
  content: Directive 85/6/CEE du Conseil du 19 décembre 1984 portant troisième modification
    de la directive 74/329/CEE relative au rapprochement des législations des États
    membres concernant les agents émulsifiants, stabilisants, épaississants et gélifiants
    pouvant être employés dans les denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 85/6/EWG des Rates vom 19. Dezember 1984 zur dritten Änderung
    der Richtlinie 74/329/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für Emulgatoren, Stabilisatoren, Verdickungs- und Geliermittel, die in Lebenmitteln
    verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 85/6/EØF af 19. december 1984 om tredje ændring af direktiv
    74/329/EØF om tilnærmelse af medlemsstaternes lovgivninger om emulgatorer, stabilisatorer,
    fortyknings- og geleringsmidler, der må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 85/6/ΕΟΚ του Συμβουλίου της 19ης Δεκεμβρίου
    1984 για τρίτη τροποποίηση της οδηγίας 74/329/ΕΟΚ
    περί προσεγγίσεως των νομοθεσιών των κρατών
    μελών σχετικά με τους γαλακτωματοποιητές,
    σταθεροποιητές, τα πυκνωτικά και πηκτικά μέσα
    που επιτρέπεται να χρησιμοποιηθούν στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 85/6/ETY, annettu 19 päivänä joulukuuta 1984, elintarvikkeissa
    sallittuja emulgointi-, stabilointi-, sakeuttamis- ja hyytelöimisaineita koskevan
    jäsenvaltioiden lainsäädännön lähentämisestä annetun direktiivin 74/329/ETY
    muuttamisesta kolmannen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 85/6/CEE del Consiglio del 19 dicembre 1984 recante terza modifica
    della direttiva 74/329/CEE relativa al ravvicinamento delle legislazioni degli
    Stati Membri concernenti gli emulsionanti, gli stabilizzanti, gli addensanti e
    i gelificanti che possono essere impiegati nei prodotti alimentari
  type: main
- language: nl
  script: Latn
  content: Richtlijn 85/6/EEG van de Raad van 19 december 1984 houdende derde wijziging
    van Richtlijn 74/329/EEG betreffende de onderlinge aanpassing van de wettelijke
    voorschriften der Lid-Staten inzake de emulgatoren, stabilisatoren, verdikkingsmiddelen
    en geleermiddelen waarvan het gebruik in levensmiddelen is toegestaan
  type: main
- language: pt
  script: Latn
  content: Directiva 85/6/CEE do Conselho, de 19 de Dezembro de 1984, que altera pela
    terceira vez a Directiva 74/329/CEE relativa à aproximação das legislações
    dos Estados-Membros respeitantes aos emulsionantes, estabilizadores, espessantes
    e gelificantes que podem ser utilizados nos géneros alimentícios
  type: main
- language: es
  script: Latn
  content: Directiva 85/6/CEE del Consejo, de 19 de diciembre de 1984, por la que
