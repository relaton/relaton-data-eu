title:
- language: en
  script: Latn
  content: '80/43/EEC: Commission Decision of 30 November 1979 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of the Netherlands of a payment
    on account in respect of expenditure incurred during 1978 on aids and premiums
    relating to the modernization of farms (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/43/CEE: Décision de la Commission, du 30 novembre 1979, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume-Uni d''un acompte sur les dépenses effectuées
    pendant l''année 1978 pour les aides et primes relatives à la modernisation
    des exploitations agricoles (Le texte en langue néerlandaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/43/EWG: Entscheidung der Kommission vom 30. November 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 zur Modernisierung landwirtschaftlicher Betriebe an Beihilfen und Prämien
    getätigten Ausgaben an das Königreich der Niederlande (Nur der niederländische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/43/EØF: Kommissionens beslutning af 30. november 1979 om udbetaling
    gennem EUGFL, udviklingssektionen til kongeriget Nederlandene af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1978 til støtte og præmier
    vedrørende modernisering af landbrugsbedrifter (Kun den nederlandske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/43/ΕΟΚ: Απόφαση τού Συμβουλίου τής 20ής
    Δεκεμβρίου 1979 περί προσαρμογής τής μεταφορικής
    ικανότητος στόν τομέα τών οδικών μεταφορών
    εμπορευμάτων γιά λογαριασμό τρίτων μεταξύ
    τών Κρατών μελών (Το κείμενο στην ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/43/CEE: Decisione della Commissione, del 30 novembre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno dei Paesi Bassi
    di un acconto sulle spese effettuate durante il 1978 per gli aiuti ed i premi
    relativi all''ammodernamento delle aziende agricole (Il testo in lingua olandese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/43/EEG: Beschikking van de Commissie van 30 november 1979 inzake de
    betaling door het EOGFL, afeling Oriëntatie, aan het Koninkrijk der Nederlanden
    van een voorschot in verband met de gedurende het jaar 1978 gedane uitgaven voor
    de steun en premies met betrekking tot de modernisering van landbouwbedrijven
    (Slechts de tekst in de Nederlandse taal is authentiek)'
