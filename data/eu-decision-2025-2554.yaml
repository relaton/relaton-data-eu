    álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2025) 8555. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/2554 della Commissione, del 16 dicembre
    2025, che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti, costituiti o derivati da soia geneticamente modificata MON 87708 in
    conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2025) 8555]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/2554 (2025. gada 16. decembris),
