    oder aus ihnen gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003 des
    Europäischen Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2025)
    8555)
  type: main
- language: bg
