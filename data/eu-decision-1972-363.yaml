- language: fr
  script: Latn
  content: Décision du Conseil du 18 octobre 1972, autorisant la tacite reconduction
    ou le maintien en vigueur de certains Traités d'amitié, de commerce et de navigation,
    et accords similaires conclus par les États membres avec des pays tiers
  type: main
- language: de
  script: Latn
  content: Entscheidung des Rates vom 18. Oktober 1972 zur Genehmigung der stillschweigenden
    Verlängerung oder der Beibehaltung bestimmter Freundschafts-, Handels- und Schifffahrtsverträge
    sowie ähnlicher Abkommen zwischen den Mitgliedstaaten und dritten Ländern
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 18 ottobre 1972, che autorizza il tacito rinnovo
    o il mantenimento in vigore di taluni trattati d'amicizia, di commercio e di navigazione
    ed accordi analoghi conclusi da Stati membri con paesi terzi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Raad van 18 oktober 1972 houdende machtiging tot stilzwijgende
    verlenging of handhaving van bepaalde tussen Lid-Staten en derde landen gesloten
    vriendschaps-, handels- en scheepvaartverdragen en soortgelijke akkoorden
