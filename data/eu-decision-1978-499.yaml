id: EUDecision1978499
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 31 May 1978 authorizing the French Republic not
    to apply Community treatment to woven fabrics of man-made fibres (continuous)
    (including woven fabrics of monofil or strip falling within heading No 51.01 or
    51.02), other than those for tyres and those containing elastomeric yarn, other
    than unbleached or bleached, falling within subheading ex 51.04 A of the Common
    Customs Tariff (NIMEXE codes 51.04-15, 17, 18, 23, 25, 26, 27, 28, 32, 34, 42,
    44, 46, 48), originating in South Korea and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/499/CEE: Décision de la Commission, du 31 mai 1978, autorisant la
    République française à exclure du traitement communautaire les tissus de fibres
    synthétiques continues (y compris les tissus de monofils ou de lames des n°
    51.01 ou 51.02) autres que ceux pour pneumatiques et ceux contenant des fils d''élastomères,
    autres qu''écrus ou blanchis, de la sous-position Ex 51.04 A du Tarif douanier
    commun (code Nimexe 51.04-15, 17, 18, 23, 25, 26, 27, 28, 32, 34, 42, 44, 46,
    48), originaires de la Corée du Sud et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 31. Mai 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus synthetischen Spinnfäden (einschließlich
    Geweben aus Monofilen oder Streifen der Tarifnummer 51.01 oder 51.02), andere
    als Cordgewebe für Reifenherstellung und Gewebe mit Elastomer-Fäden, andere
    als roh oder gebleicht, der Tarifnummer ex 51.04 A des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 51.04-15, 17, 18, 23, 25, 26, 27, 28, 32, 34, 42, 46, 48)
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 31. maj 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof af endeløse kemofibre
    (herunder stof vævet af monofilamenter eller strimler henhørende under pos.
    51.01 og 51.02) bortset fra cordvæv til fremstilling af dæk samt stoffer med
    indhold af elastiske monofilamenter, andre end ublegede eller blegede, som henhører
    under pos. ex 51.04 A (NIMEXE-kode: 51.04-15, 17, 18, 23, 25, 26, 27, 28, 32,
    34, 42, 44, 46, 48) i den fælles toldtarif, har oprindelse i Sydkorea og frit
    kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 31 maggio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    continue (compresi i tessuti di monofili o di lamette delle voci 51.01 o 51.02
    diversi da quelli per pneumatici o da quelli contenenti filets elastomeri non
    greggi o imbianchiti della sottovoce ex 51.04 A della tariffa doganale comune
    (codice Nimexe 51.04-15, 17, 18, 23, 25, 26, 27, 28, 32, 34, 42, 44, 46, 48),
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 31 mei 1978 waarbij de Franse Republiek
    wordt gemachtigd weefsels van synthetische continuvezels (weefsels van monofil
    en weefsels van strippen of van artikelen van dergelijke vorm, bedoeld bij post
    51.01 of bij post 51.02, daaronder begrepen), andere dan de voor buitenbanden
    bestemde en de elastomeergarens bevattende weefsels, andere dan ongebleekt of
    gebleekt, van de posten ex 51.04 A van het gemeenschappelijk douanetarief (NIMEXE-code
    51.04-15, 17, 18, 23, 25, 26, 27, 28, 32, 34, 42, 44, 46, 48), van oorsprong uit
    Zuid-Korea en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
