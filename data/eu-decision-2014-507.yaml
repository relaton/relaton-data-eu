    Crimée ou de Sébastopol, en réponse à l'annexion illégale de la Crimée et
    de Sébastopol
  type: main
- language: de
  script: Latn
  content: Beschluss 2014/507/GASP des Rates vom 30. Juli 2014 zur Änderung des Beschlusses
    2014/386/GASP über Beschränkungen für Waren mit Ursprung auf der Krim oder
    in Sewastopol als Reaktion auf die rechtswidrige Eingliederung der Krim und Sewastopols
    durch Annexion
  type: main
