  content: Council Decision 2014/507/CFSP of 30 July 2014 amending Decision 2014/386/CFSP
    concerning restrictions on goods originating in Crimea or Sevastopol, in response
    to the illegal annexation of Crimea and Sevastopol
  type: main
- language: fr
  script: Latn
  content: Décision 2014/507/PESC du Conseil du 30 juillet 2014 modifiant la décision
