    z Krymu nebo ze Sevastopolu v reakci na jejich protiprávní anexi
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2014/507/FUSP af 30. juli 2014 om ændring af afgørelse
    2014/386/FUSP om restriktioner for varer med oprindelse på Krim eller i Sevastopol
    som reaktion på den ulovlige annektering af Krim og Sevastopol
  type: main
- language: el
  script: Grek
  content: Απόφαση 2014/507/ΚΕΠΠΑ του Συμβουλίου, της
