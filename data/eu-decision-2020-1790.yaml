  script: Latn
  content: Council Decision (EU) 2020/1790 of 16 November 2020 authorising Portugal
    to apply a reduced rate of excise duty on certain alcoholic products produced
    in the autonomous regions of Madeira and of the Azores
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1790 du Conseil du 16 novembre 2020 autorisant le Portugal
