  script: Latn
  content: '2001/494/EC: Commission Decision of 21 June 2001 approving the scheme
    submitted by the United Kingdom for the withdrawal of all fish in farms infected
    with infectious salmon anaemia (ISA) and situated in England, Scotland and Wales
    and repealing Decision 2001/186/EC (Text with EEA relevance) (notified under document
    number C(2001) 1626)'
  type: main
- language: fr
  script: Latn
