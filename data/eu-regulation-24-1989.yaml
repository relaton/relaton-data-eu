title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 24/89 of 5 January 1989 suspending the preferential
    customs duties and re- introducing the common customs tariff duty on imports of
    large-flowered roses originating in Israel
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 24/89 de la Commission du 5 janvier 1989 suspendant
    le droit de douane préférentiel et réinstaurant le droit du tarif douanier
    commun à l'importation de roses à grande fleur originaires d'Israël
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 24/89 DER KOMMISSION vom 5. Januar 1989 zur Aussetzung
    des bei der Einfuhr von großblütigen Rosen mit Ursprung in Israel zu erhebenden
    Präferenzzolls und Wiedereinführung des Zolls des Gemeinsamen Zolltarifs #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 24/89 af 5. januar 1989 om suspension
    af præferencetolden og genindførelse af tolden ifølge Den Fælles Toldtarif
    ved indførsel af storblomstrede roser med oprindelse i Israel
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 24/89 της Επιτροπής
    της 5ης Ιανουαρίου 1989 για αναστολή του προτιμησιακού
    δασμού και επαναφορά του δασμού του κοινού
    δασμολογίου κατά την εισαγωγή τριαντάφυλλων
    με μεγάλο άνθος, καταγωγής Ισραήλ
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 24/89 DELLA COMMISSIONE del 5 gennaio 1989 che sospende
    il dazio doganale preferenziale e ripristina il dazio della tariffa doganale comune
    all'' importazione di rose a fiore grande originarie di Israele #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 24/89 VAN DE COMMISSIE van 5 januari 1989 tot schorsing
    van het preferentiële douanerecht en tot wederinvoering van het recht van het
    gemeenschappelijk douanetarief bij invoer van grootbloemige rozen van oorsprong
    uit Israël #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 24/89 DA COMISSAO de 5 de Janeiro de 1989 que suspende
    o direito aduaneiro preferencial e reinstaura o direito da Pauta Aduaneira Comum
    na importaçao de rosas de flor grande originarias de Israel
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 24/89 DE LA COMISIÓN de 5 de enero de 1989 por el
