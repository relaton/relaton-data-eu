    89/391/EEZ)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2012/11/EU irányelve ( 2012. április
    19. ) a munkavállalók fizikai tényezők (elektromágneses terek) hatásából
    keletkező kockázatoknak való expozíciójára vonatkozó egészségügyi és
    biztonsági minimumkövetelményekről szóló 2004/40/EK irányelv (18. egyedi
    irányelv a 89/391/EGK irányelv 16. cikke (1) bekezdésének értelmében) módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2012/11/UE del Parlamento europeo e del Consiglio, del 19 aprile
    2012 , che modifica la direttiva 2004/40/CE sulle prescrizioni minime di sicurezza
    e di salute relative all'esposizione dei lavoratori ai rischi derivanti dagli
    agenti fisici (campi elettromagnetici) (18 a direttiva particolare ai sensi dell'articolo
    16, paragrafo 1, della direttiva 89/391/CEE)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2012/11/ES ( 2012. gada 19. aprīlis
    ), ar ko groza Direktīvu 2004/40/EK par minimālajām drošības un veselības
    aizsardzības prasībām attiecībā uz darba ņēmēju pakļaušanu riskam, ko
    rada fizikāli faktori (elektromagnētiskie lauki) (18. atsevišķā direktīva
    Direktīvas 89/391/EEK 16. panta 1. punkta nozīmē)
  type: main
- language: lt
  script: Latn
