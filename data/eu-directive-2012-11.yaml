title:
- language: en
  script: Latn
  content: Directive 2012/11/EU of the European Parliament and of the Council of 19
    April 2012 amending Directive 2004/40/EC on minimum health and safety requirements
    regarding the exposure of workers to the risks arising from physical agents (electromagnetic
    fields) (18th individual Directive within the meaning of Article 16(1) of Directive
    89/391/EEC)
  type: main
- language: fr
  script: Latn
  content: Directive 2012/11/UE du Parlement européen et du Conseil du 19 avril 2012
    modifiant la directive 2004/40/CE concernant les prescriptions minimales de sécurité
    et de santé relatives à l'exposition des travailleurs aux risques dus aux agents
    physiques (champs électromagnétiques) (dix-huitième directive particulière
    au sens de l'article 16, paragraphe 1, de la directive 89/391/CEE)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2012/11/EU des Europäischen Parlaments und des Rates vom 19.
    April 2012 zur Änderung der Richtlinie 2004/40/EG über Mindestvorschriften zum
    Schutz von Sicherheit und Gesundheit der Arbeitnehmer vor der Gefährdung durch
    physikalische Einwirkungen (elektromagnetische Felder) (18. Einzelrichtlinie im
    Sinne des Artikels 16 Absatz 1 der Richtlinie 89/391/EWG)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2012/11/ЕС на Европейския парламент
