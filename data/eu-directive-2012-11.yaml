    u s-sigurtà fir-rigward tal-espożizzjoni ta’ ħaddiema għal riskji li jirriżultaw
    minn aġenti fiżiċi (kampi elettromanjetiċi) (it-18-il Direttiva individwali
    fis-sens tal-Artikolu 16(1) tad-Direttiva 89/391/KEE)
  type: main
- language: nl
  script: Latn
