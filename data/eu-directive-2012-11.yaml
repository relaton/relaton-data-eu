    ochrony zdrowia i bezpieczeństwa dotyczących narażenia pracowników na ryzyko
    spowodowane czynnikami fizycznymi (polami elektromagnetycznymi) (osiemnastą dyrektywę
    szczegółową w rozumieniu art. 16 ust. 1 dyrektywy 89/391/EWG)
  type: main
- language: pt
  script: Latn
  content: Diretiva 2012/11/UE do Parlamento Europeu e do Conselho, de 19 de abril
    de 2012 , que altera a Diretiva 2004/40/CE relativa às prescrições mínimas
    de segurança e saúde em matéria de exposição dos trabalhadores aos riscos
    devidos aos agentes físicos (campos eletromagnéticos) (18. a Diretiva especial
    na aceção do artigo 16. °, n. ° 1, da Diretiva 89/391/CEE)
  type: main
- language: ro
  script: Latn
  content: Directiva 2012/11/UE a Parlamentului European și a Consiliului din 19
    aprilie 2012 de modificare a Directivei 2004/40/CE privind cerințele minime de
    securitate și sănătate referitoare la expunerea lucrătorilor la riscuri generate
    de agenții fizici (câmpuri electromagnetice) [a optsprezecea directivă specială
    în sensul articolului 16 alineatul (1) din Directiva 89/391/CEE]
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2012/11/EÚ z 19. apríla 2012 ,
