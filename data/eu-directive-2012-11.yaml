    a ochranu zdraví před expozicí zaměstnanců rizikům spojeným s fyzikálními
    činiteli (elektromagnetickými poli) (18. samostatná směrnice ve smyslu čl.
    16 odst. 1 směrnice 89/391/EHS)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2012/11/EU af 19. april 2012 om
    ændring af direktiv 2004/40/EF om minimumsforskrifter for sikkerhed og sundhed
    i forbindelse med arbejdstagernes eksponering for risici på grund af fysiske
    agenser (elektromagnetiske felter) (18. særdirektiv i henhold til artikel 16,
    stk. 1, i direktiv 89/391/EØF)
  type: main
- language: el
  script: Grek
