    inzake gezondheid en veiligheid met betrekking tot de blootstelling van werknemers
    aan de risico's van fysische agentia (elektromagnetische velden) (18e bijzondere
    richtlijn in de zin van artikel 16, lid 1, van Richtlijn 89/391/EEG)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2012/11/UE z dnia 19 kwietnia
