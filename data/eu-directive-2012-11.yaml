    požiadavkách týkajúcich sa vystavenia pracovníkov rizikám vyplývajúcim
    z fyzikálnych činidiel (elektromagnetické polia) (18. individuálna smernica
    v zmysle článku 16 ods. 1 smernice 89/391/EHS)
  type: main
- language: sl
  script: Latn
  content: Direktiva 2012/11/EU Evropskega parlamenta in Sveta z dne 19. aprila 2012
