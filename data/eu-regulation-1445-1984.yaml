title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1445/84 of 25 May 1984 re-establishing the
    levying of customs duties on certain fibres (discontinuous), products of category
    55 (code 0550), originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1445/84 de la Commission du 25 mai 1984 portant rétablissement
    de la perception des droits de douane applicables à certaines fibres textiles
    synthétiques discontinues, de la catégorie 55 (code 0550), originaires du Mexique,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1445/84 der Kommission vom 25. Mai 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte synthetische Spinnfasern der Warenkategorie
    Nr. 55 (Kennziffer 0550) mit Ursprung in Mexiko, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1445/84 af 25. maj 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte korte kemofibre under varekategori
    nr. 55 (kode 0550), som har oprindelse i Mexico og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1445/84 της Επιτροπής
    της 25ης Μαΐου 1984 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για ορισμένες συνθετικές
    υφαντικές ίνες μη συνεχείς, προϊόντα της κατηγορίας
    αριθ. 55 (κωδικός αριθμός 0550), καταγωγής Μεξικού,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1445/84 della Commissione del 25 maggio 1984 che ripristina
    la riscossione dei dazi doganali applicabili a certe fibre tessili sintetiche
    della categoria di prodotti n. 55 (codice 0550) originarie del Messico, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1445/84 van de Commissie van 25 mei 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    synthetische stapelvezels van de categorie van produkten nr. 55 (codenummer 0550),
    van oorsprong uit Mexico, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
