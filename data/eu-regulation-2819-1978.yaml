title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2819/78 of 30 November 1978 amending for
    the fourth time Regulation (EEC) No 1393/76 laying down detailed rules for the
    importation of products in the wine-growing sector originating in certain third
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2819/78 de la Commission, du 30 novembre 1978, modifiant
    pour la quatrième fois le règlement (CEE) n° 1393/76 établissant les modalités
    d' application relatives à l' importation de produits relevant du secteur viti-vinicole
    originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2819/78 der Kommission vom 30. November 1978 zur vierten
    Änderung der Verordnung (EWG) Nr. 1393/76 über Durchführungsbestimmungen für
    die Einfuhr von Erzeugnissen des Weinsektors mit Ursprung in bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2819/78 af 30. november 1978 om fjerde
    ændring af forordning (EØF) nr. 1393/76 om fastsættelse af de nærmere bestemmelser
    for indførsel af produkter fra vinsektoren med oprindelse i visse tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2819/78 della Commissione, del 30 novembre 1978, recante
    quarta modifica del regolamento (CEE) n. 1393/76, che stabilisce le modalità
    di applicazione per l' importazione di prodotti del settore vitivinicolo originari
    di taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2819/78 van de Commissie van 30 november 1978 houdende
    vierde wijziging van Verordening (EEG) nr. 1393/76 houdende uitvoeringsbepalingen
    voor de invoer van produkten uit de wijnsector van oorsprong uit bepaalde derde
    landen
