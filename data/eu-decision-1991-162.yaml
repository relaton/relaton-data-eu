title:
- language: en
  script: Latn
  content: '91/162/EEC: Council Decision of 21 March 1991 on the conclusion of the
    Agreement in the form of an exchange of letters between the European Economic
    Community and the Kingdom of Morocco fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Morocco, for the period 1 November 1987 to 31 December 1991'
  type: main
- language: fr
  script: Latn
  content: '91/162/CEE: Décision du Conseil du 21 mars 1991 concernant la conclusion
    de l''accord sous forme d''échange de lettres entre la Communauté économique
    européenne et le Royaume du Maroc fixant, pour la période du 1er novembre 1987
    au 31 décembre 1991, le montant additionnel à déduire du prélèvement applicable
    à l''importation, dans la Communauté, d''huile d''olive non traitée originaire
    du Maroc'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DES RATES vom 21. März 1991 über den Abschluß des Abkommens
    in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Königreich Marokko zur Festsetzung des vom 1. November 1987 bis 31. Dezember
    1991 geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft von nicht
    behandeltem Olivenöl mit Ursprung in Marokko von der Abschöpfung abzuziehen
    ist (91/162/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS AFGØRELSE af 21. marts 1991 om indgåelse af aftalen i form af
    brevveksling mellem Det Europæiske Økonomiske Fællesskab og Kongeriget Marokko
    om fastsættelse for perioden 1. november 1987 til 31. december 1991 af det tillægsbeløb,
    som skal fratrækkes den afgift, der anvendes ved indførsel til Fællesskabet
    af ikke-behandlet olivenolie med oprindelse i Marokko (91/162/EØF) #'
  type: main
- language: el
