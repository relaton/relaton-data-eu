  content: Décision de la Commission, du 22 mai 1964, relative à l'autorisation
    accordée à la République italienne d'adopter des mesures de sauvegarde pour
    certains produits du chapitre 50 du tarif douanier italien (soie et déchets de
    soie)
  type: main
- language: de
  script: Latn
  content: '64/335/EWG: Entscheidung der Kommission vom 22. Mai 1964 betreffend die
    Ermächtigung der Italienischen Republik, für einige Waren des Kapitels 50 des
    italienischen Zolltarifs (Seide und Schappeseide) Schutzmaßnahmen zu ergreifen'
  type: main
- language: it
  script: Latn
  content: '64/335/CEE: Decisione della Commissione, del 22 maggio 1964, relativa
    all''autorizzazione accordata alla Repubblica italiana ad adottare misure di salvaguardia
    per alcuni prodotti del capitolo 50 della tariffa doganale italiana (seta e cascami
    di seta)'
  type: main
- language: nl
  script: Latn
  content: '64/335/EEG: Beschikking van de Commissie van 22 mei 1964 betreffende de
    aan de Italiaanse Republiek verleende machtiging om vrijwaringsmaatregelen te
    treffen voor enige produkten vallende onder hoofdstuk 50 van het Italiaanse douanetarief
    (zijde en afval van zijde)'
