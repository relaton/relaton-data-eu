    hinsichtlich der Annahmefrist für die Genehmigung der Verträge über die vorbeugende
    Destillation im Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 563/92 af 5. marts 1992 om ændring
