  content: Council Regulation (EEC) No 1735/91 of 13 June 1991 amending Regulation
    (EEC) No 358/79 as regards sparkling wines produced in the Community as defined
    in point 15 of Annex I to Regulation (EEC) No 822/87 and Regulation (EEC) No 4252/88
    on the preparation and marketing of liqueur wines produced in the Community
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1735/91 DU CONSEIL du 13 juin 1991 modifiant le règlement
