  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusmäärus (EL) 2026/1225, 8. juuni 2026, millega rakendatakse
    määrust (EL) 2023/1529, mis käsitleb piiravaid meetmeid seoses Iraani sõjalise
    toetusega Venemaa Ukraina-vastasele agressioonisõjale ning relvastatud rühmitustele
    ja üksustele Lähis-Idas ja Punase mere piirkonnas, ning Iraani tegevust, mis
