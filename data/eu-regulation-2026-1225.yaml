title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) 2026/1225 of 8 June 2026 implementing
    Regulation (EU) 2023/1529 concerning restrictive measures in view of Iran’s
    military support to Russia’s war of aggression against Ukraine and to armed
    groups and entities in the Middle East and the Red Sea region as well as Iran’s
    actions undermining freedom of navigation in the Middle East
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1225 du Conseil du 8 juin 2026 mettant
    en œuvre le règlement (UE) 2023/1529 concernant des mesures restrictives en
    raison du soutien militaire de l’Iran à la guerre d’agression menée par
    la Russie contre l’Ukraine, ainsi qu’à des groupes armés et des entités
    au Moyen-Orient et dans la région de la mer Rouge, ainsi que des actions imputables
    à l’Iran qui compromettent la liberté de navigation au Moyen-Orient
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/1225 des Rates vom 8. Juni 2026 zur
    Durchführung der Verordnung (EU) 2023/1529 über restriktive Maßnahmen angesichts
    der militärischen Unterstützung des Angriffskriegs Russlands gegen die Ukraine
    sowie bewaffneter Gruppen und Organisationen im Nahen Osten und in der Region
    des Roten Meeres durch Iran sowie der Handlungen Irans, die die Freiheit der Schifffahrt
    im Nahen Osten untergraben
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (EС) 2026/1225 на Съвета
    от 8 юни 2026 година за прилагане на Регламент
    (ЕС) 2023/1529 за налагане на ограничителни мерки
    с оглед на военната подкрепа на Иран за агресивната
    война на Русия срещу Украйна и за въоръжени
    групировки и образувания в Близкия изток и
    региона на Червено море, както и действията
    на Иран, подкопаващи свободата на корабоплаването
    в Близкия изток
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) 2026/1225 ze dne 8. června 2026, kterým
    se provádí nařízení (EU) 2023/1529 o omezujících opatřeních vzhledem
    k vojenské podpoře útočné války Ruska proti Ukrajině a ozbrojených skupin
    a subjektů v oblasti Blízkého východu a Rudého moře ze strany Íránu, jakož
    i v souvislosti s činnostmi Íránu narušujícími svobodu plavby na Blízkém
    východě
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) 2026/1225 af 8. juni 2026 om gennemførelse
    af forordning (EU) 2023/1529 om restriktive foranstaltninger på baggrund af Irans
    militære støtte til Ruslands angrebskrig mod Ukraine og til væbnede grupper
    og enheder i Mellemøsten og regionen omkring Det Røde Hav samt Irans handlinger,
    der undergraver den frie sejlads i Mellemøsten
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (EE) 2026/1225 του Συμβουλίου,
