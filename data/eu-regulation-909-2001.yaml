title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 909/2001 of 8 May 2001 initiating an investigation
    concerning the alleged circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 368/98 on imports of glyphosate originating in the People's
    Republic of China by imports of glyphosate consigned from Malaysia or Taiwan,
    and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 909/2001 de la Commission du 8 mai 2001 ouvrant une
    enquête sur le prétendu contournement des mesures antidumping instituées par
    le règlement (CE) n° 368/98 du Conseil sur les importations de glyphosate originaire
    de la République populaire de Chine par des importations de glyphosate expédié
    de Malaisie ou de Taïwan et rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 909/2001 der Kommission vom 8. Mai 2001 zur Einleitung
    einer Untersuchung betreffend die angebliche Umgehung des mit der Verordnung (EG)
    Nr. 368/98 des Rates eingeführten Antidumpingzolls auf die Einfuhren von Glyphosat
    mit Ursprung in der Volksrepublik China durch die Einfuhren von Glyphosat, das
    aus Malaysia oder Taiwan versandt wird und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 909/2001 ze dne 8. května 2001, kterým se
    zahajuje šetření údajného obcházení antidumpingových opatření uložených
    nařízením Rady (ES) č. 368/98 na dovozy glyfosátu pocházejícího z Čínské
    lidové republiky prostřednictvím dovozů glyfosátu odesílanými z Malajsie
    nebo Tchaj-wanu a kterým se zavádí evidence těchto dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 909/2001 af 8. maj 2001 om indledning
    af en undersøgelse vedrørende angivelig omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 368/98 om import af glyphosat med
    oprindelse i Folkerepublikken Kina, ved import af glyphosat afsendt fra Malaysia
    eller Taiwan og om at gøre denne import til genstand for registrering
  type: main
