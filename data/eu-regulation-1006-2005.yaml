title:
- language: en
  script: Latn
  content: Commission Regulation No 1006/2005 of 30 June 2005 amending Regulation
    (EC) No 1549/2004 derogating from Council Regulation (EC) No 1785/2003 as regards
    the arrangements for importing rice and laying down separate transitional rules
    for imports of basmati rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1006/2005 de la Commission du 30 juin 2005 modifiant
    le règlement (CE) n° 1549/2004 dérogeant au règlement (CE) n° 1785/2003 du
    Conseil en ce qui concerne le régime d’importation du riz et fixant des règles
    spécifiques transitoires applicables à l'importation du riz Basmati
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1006/2005 der Kommission vom 30. Juni 2005 zur Änderung
    der Verordnung (EG) Nr. 1549/2004 zur Abweichung von der Verordnung (EG) Nr. 1785/2003
    des Rates hinsichtlich der Einfuhrregelung für Reis und zur Festlegung besonderer
    Übergangsbestimmungen für die Einfuhr von Reis
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1006/2005 ze dne 30. června 2005, kterým
    se mění nařízení (ES) č. 1549/2004, kterým se stanoví odchylka od nařízení
    Rady (ES) č. 1785/2003, pokud jde o dovozní režim pro rýži, a kterým se
    stanoví zvláštní přechodná pravidla pro dovoz rýže Basmati
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1006/2005 af 30. juni 2005 om ændring
    af forordning (EF) nr. 1549/2004 om fravigelse af Rådets forordning (EF) nr.
    1785/2003 for så vidt angår importordningen for ris og om fastsættelse af særlige
    overgangsbestemmelser for importen af basmati-ris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1006/2005 της Επιτροπής,
    της 30ής Ιουνίου 2005, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1549/2004 για παρέκκλιση από τον κανονισμό
    (ΕΚ) αριθ. 1785/2003 του Συμβουλίου σχετικά με το
    καθεστώς εισαγωγής ρυζιού και για καθορισμό
    ειδικών μεταβατικών κανόνων που έχουν εφαρμογή
    στις εισαγωγές ρυζιού Basmati
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1006/2005, 30. juuni 2005, millega muudetakse
    määrust (EÜ) nr 1549/2004, millega kehtestatakse erand nõukogu määrusest
    (EÜ) nr 1785/2003 riisi impordikorra osas ning määratakse kindlaks basmati
    riisi impordi suhtes kohaldatavad üleminekuperioodi erieeskirjad
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1006/2005, annettu 30 päivänä kesäkuuta 2005,
    neuvoston asetuksesta (EY) N:o 1785/2003 poikkeamisesta riisin tuontijärjestelmän
    osalta ja Basmati-riisin tuontiin sovellettavien erityisten siirtymäkauden sääntöjen
    vahvistamisesta annetun asetuksen (EY) N:o 1549/2004 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1006/2005/EK rendelete (2005. június 30.) a rizs behozatali
    rendszere tekintetében az 1785/2003/EK tanácsi rendelettől való eltérésről
    és a basmati rizs behozatalára alkalmazandó átmeneti egyedi szabályok megállapításáról
    szóló 1549/2004/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1006/2005 della Commissione, del 30 giugno 2005, recante
    modifica del regolamento (CE) n. 1549/2004 che deroga al regolamento (CE) n. 1785/2003
    del Consiglio in ordine al regime di importazione del riso e che fissa specifiche
    regole transitorie applicabili alle importazioni di riso Basmati
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1006/2005 (2005. gada 30. jūnijs), ar ko groza
    Regulu (EK) Nr. 1549/2004, ar kuru paredz atkāpes no Padomes Regulas (EK) Nr.
    1785/2003 attiecībā uz rīsa ievešanas režīmu un nosaka īpašus pagaidu
    noteikumus Basmati rīsu ievešanai
  type: main
- language: lt
  script: Latn
  content: 2005 m. birželio 30 d. Komisijos reglamentas (EB) Nr. 1006/2005, iš dalies
