    (EB) Nr. 1785/2003 dėl ryžių importo tvarkos ir nustatantį konkrečias pereinamojo
    laikotarpio taisykles, taikomas Basmati ryžių importui
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1006/2005 van de Commissie van 30 juni 2005 tot wijziging
    van Verordening (EG) nr. 1549/2004 houdende afwijking van Verordening (EG) nr.
    1785/2003 van de Raad ten aanzien van de invoerregeling voor rijst en tot vaststelling
    van een overgangsregeling voor de invoer van Basmati-rijst
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1006/2005 z dnia 30 czerwca 2005 r. zmieniające
    rozporządzenie (WE) nr 1549/2004 wprowadzające odstępstwo od rozporządzenia
    Rady (WE) nr 1785/2003 w odniesieniu do systemu przywozu ryżu i ustalenia szczegółowych
    zasad przejściowych mających zastosowanie do przywozu ryżu Basmati
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1006/2005 da Comissão, de 30 de Junho de 2005, que
    altera o Regulamento (CE) n.° 1549/2004 que derroga ao Regulamento (CE) n.°
    1785/2003 do Conselho no que diz respeito ao regime de importação do arroz e
    que fixa regras específicas de transição aplicáveis à importação de arroz
    Basmati
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1006/2005 z 30. júna 2005, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1549/2004, ktoré sa odlišuje od nariadenia Rady
    (ES) č. 1785/2003 týkajúceho sa dovozného režimu pre ryžu a ktoré stanovuje
    špecifické prechodné pravidlá uplatniteľné na dovoz ryže Basmati
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1006/2005 z dne 30. junija 2005 o spremembi Uredbe
    (ES) št. 1549/2004 o odstopanju od Uredbe Sveta (ES) št. 1785/2003 v delu, ki
    se nanaša na uvozni režim za riž, in o določitvi posebnih prehodnih pravil
    za uvoz riža
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1006/2005 de la Comisión, de 30 de junio de 2005,
    que modifica el Reglamento (CE) n° 1549/2004 por el que se establecen excepciones
    al Reglamento (CE) n° 1785/2003 del Consejo en lo relativo al régimen de importación
    del arroz y se fijan normas específicas transitorias aplicables a la importación
    de arroz Basmati
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1006/2005 av den 30 juni 2005 om ändring
