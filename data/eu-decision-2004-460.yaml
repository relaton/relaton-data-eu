  content: 2004/460/EC:Commission Decision of 29 April 2004 amending Appendix A to
    Annex VIII to the 2003 Act of Accession to include certain establishments in the
    meat, milk and fish sectors in Latvia in the list of establishments in transition
    (notified under document C(2004) 1712)
  type: main
- language: fr
  script: Latn
