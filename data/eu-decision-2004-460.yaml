    Betriebe der Sektoren Fleisch, Milch und Fisch in Lettland in das Verzeichnis
    der Betriebe, für die eine Übergangsregelung gilt (Text von Bedeutung für den
    EWR) (Bekannt gegeben unter Aktenzeichen K(2004) 1712)
  type: main
