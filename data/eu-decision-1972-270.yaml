  content: "/* 72/270/EEC: Commission Decision of 7 July 1972 exempting the Federal Republic of Germany from applying to certain species the Council Directive of 29 September 1970 on the marketing of vegetable seed */ (Only the German text is authentic)"
  type: main
- language: fr
  script: Latn
  content: '72/270/CEE: Décision de la Commission, du 7 juillet 1972, dispensant
