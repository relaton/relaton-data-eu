id: EUDecision1995104
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '95/104/EC: Commission Decision of 29 March 1995 approving the single programming
    document for Community structural measures for improving the processing and marketing
    conditions for agricultural and forestry products in the Wallonian Region (with
    the exception of Hainaut province), in respect of Objective 5 (a), covering the
    period between 1994 and 1999 (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/104/CE: Décision de la Commission, du 29 mars 1995, portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits agricoles et sylvicoles dans la Région wallonne (à l''exception
    de la province du Hainaut), au titre de l''objectif 5a), couvrant la période
    entre 1994 et 1999 (Les textes en langues française et néerlandaise sont les
    seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '95/104/EG: Entscheidung der Kommission vom 29. März 1995 zur Genehmigung
    des den Zeitraum 1994 bis 1999 betreffenden einzigen Programmplanungsdokuments
    zu den strukturellen Interventionen der Gemeinschaft zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen land- und forstwirtschaftlicher Erzeugnisse im Rahmen
    der Zielvorgabe 5a in Wallonien (mit Ausnahme der Provinz Hainaut) (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/104/EF: Kommissionens beslutning af 29. marts 1995 om godkendelse af
    enhedsprogrammeringsdokumentet for EF''s strukturinterventioner vedrørende forarbejdning
    og afsætning af landbrugs- og skovbrugsprodukter i Vallonien (med undtagelse
    af provinsen Hainaut), for mål nr. 5a for perioden 1994 til 1999 (Kun den franske
    og den hollandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '95/104/ΕΚ: Απόφαση της Επιτροπής της 29ης Μαρτίου
    1995 σχετικά με την έγκριση του ενιαίου εγγράφου
    προγραμματισμού για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις που αφορούν τη βελτίωση των συνθηκών
    μεταποίησης και εμπορίας των γεωργικών και
    δασοκομικών προϊόντων στην περιοχή της Βαλονίας
    (εκτός της περιοχής του Hainaut) στο πλαίσιο του
    στόχου 5α, που καλύπτει την περίοδο από το 1994
    μέχρι το 1999 (Τα κείμενα στη γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '95/104/EY: Komission päätös, tehty 29 päivänä maaliskuuta 1995,
    Vallonian alueen (lukuun ottamatta Hainaut''n maakuntaa) maa- ja metsätaloustuotteiden
    jalostamisen ja kaupan pitämisen edellytysten parantamiseen liittyviä yhteisön
    rakenteellisia interventioita koskevan yhden ohjelma-asiakirjan hyväksymisestä
    tavoitteen 5 a mukaisesti vuosien 1994 ja 1999 väliseksi ajaksi (Ainoastaan ranskan-
    ja hollanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/104/CE: Decisione della Commissione, del 29 marzo 1995, recante approvazione
    del documento unico di programmazione per gli interventi strutturali comunitari
    relativi al miglioramento delle condizioni di trasformazione e di commercializzazione
    dei prodotti agricoli e silvicoli nella Regione Vallonia (ad eccezione della provincia
    dello Hainaut), nel quadro dell''obiettivo n. 5 a), per il periodo dal 1994 al
    1999 (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '95/104/EG: Beschikking van de Commissie van 29 maart 1995 houdende goedkeuring
    van het enig programmeringsdocument voor de structurele bijstandsverlening van
    de Gemeenschap voor de verbetering van de verwerking en de afzet van land- en
    bosbouwprodukten in het gewest Wallonië (met uitzondering van Henegouwen) in
    het kader van doelstelling 5a), voor de periode van 1994 tot en met 1999 (Slechts
    de teksten in de Franse en Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '95/104/CE: Decisão da Comissão, de 29 de Março de 1995, que aprova
    o documento único de programação para as intervenções estruturais comunitárias
    relativas à melhoria das condições de transformação e de comercialização
    dos produtos agrícolas e silvícolas na região da Valónia (à excepção da
    província do Hainaut), na Bélgica, a título do objectivo 5a, para o período
    compreendido entre 1994 e 1999 (Apenas fazem fé os textos nas línguas francesa
    e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '95/104/CE: Decisión de la Comisión, de 29 de marzo de 1995, por la que
    se aprueba el documento único de programación para las intervenciones estructurales
    comunitarias destinadas a la mejora de las condiciones de transformación y comercialización
    de productos agrarios y silvícolas en la región de Wallonia (excepto en la provincia
    de Hainaut), con arreglo al objetivo nº 5 a), durante el período comprendido
    entre 1994 y 1999 (Los textos en lengua francesa y neerlandesa son los únicos
    auténticos)'
  type: main
- language: sv
  script: Latn
  content: '95/104/EG: Kommissionens beslut av den 29 mars 1995 om godkännande av
    enhetsprogrammeringsdokumentet av gemenskapens strukturella åtgärder för förbättring
    av villkoren för bearbetning och saluföring av jordbruks- och skogsprodukter
    i regionen Vallonien (med undantag från Hainaut-provinsen), med avseende på
    mål 5a, som täcker perioden mellan 1994 och 1999. (Endast de franska och holländska
    texterna är giltiga.)'
  type: main
