    von Schweinen mit Ursprung in der Republik Serbien nach Auftreten der Afrikanischen
    Schweinepest in diesem Land und zur Änderung des Durchführungsbeschlusses 2013/426/EU
    (Bekannt gegeben unter Aktenzeichen C(2019) 6174)
  type: main
