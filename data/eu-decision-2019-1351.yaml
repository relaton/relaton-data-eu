title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1351 of 19 August 2019 setting
    up special conditions in respect of imports into and transit through the Union
    of meat products and treated stomachs, bladders and intestines derived from porcine
    animals originating in the Republic of Serbia following the occurrence of African
    swine fever in that country and amending Implementing Decision 2013/426/EU (notified
    under document C(2019) 6174)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1351 de la Commission du 19 août 2019
    fixant des conditions particulières pour les importations dans l'Union et le
    transit par celle-ci de produits à base de viande ainsi que d'estomacs, de vessies
    et de boyaux traités obtenus à partir d'animaux de l'espèce porcine provenant
    de la République de Serbie à la suite de l'apparition de la peste porcine africaine
    dans ce pays, et modifiant la décision d'exécution 2013/426/UE [notifiée sous
    le numéro C(2019) 6174]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1351 der Kommission vom 19. August 2019
