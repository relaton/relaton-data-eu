  script: Latn
  content: '91/361/EEC: Commission Decision of 14 June 1991 amending Council Decision
    79/542/EEC drawing up a list of third counties from which Member States authorize
    imports of bovine animals, swine and fresh meat and supplementing the list as
    regards meat products'
  type: main
- language: fr
  script: Latn
