title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 11 mars 1970, autorisant la République
    italienne à exclure du traitement communautaire les fils de soie, de la position
    50.04 du Tarif douanier commun, originaires de Corée du Sud et mis en libre pratique
    dans le autres États membres
  type: main
- language: de
  script: Latn
  content: '70/204/EWG: Entscheidung der Kommission vom 11. März 1970, mit der die
    Italienische Republik ermächtigt wird, die aus Südkorea stammenden und in den
    übrigen Mitgliedstaaten im freien Verkehr befindlichen Seidengarne der Position
    50.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/204/CEE: Decisione della Commissione, dell''11 marzo 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i filati di seta,
    della voce 50.04 della tariffa doganale comune, originari della Corea del Sud
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/204/EEG: Beschikking van de Commissie van 11 maart 1970 waarbij de
    Italiaanse Republiek wordt gemachtigd garens van zijde van post 50.04 van het
    gemeenschappelijk douanetarief, van oorsprong uit Zuid- Korea en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
