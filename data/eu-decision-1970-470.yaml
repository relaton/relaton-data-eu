title:
- language: fr
  script: Latn
  content: Décision du Conseil du 13 octobre 1970, autorisant la tacite reconduction
    ou le maintien en vigueur de certains Traités d'amitié, de commerce et de navigation
    et accords similaires conclus par les États membres avec des pays tiers
  type: main
- language: de
  script: Latn
  content: '70/470/EWG: Entscheidung des Rates vom 13. Oktober 1970 zur Genehmigung
    der stillschweigenden oder ausdrücklichen Verlängerung bestimmter Freundschafts-,
    Handels- und Schiffahrtsverträge sowie ähnlicher Abkommen zwischen den Mitgliedstaaten
    und dritten Ländern'
  type: main
- language: it
  script: Latn
  content: '70/470/CEE: Decisione del Consiglio, del 13 ottobre 1970, che autorizza
    il tacito rinnovo o il mantenimento in vigore di alcuni trattati d''amicizia,
    di commercio e di navigazione e accordi analoghi conclusi da Stati membri con
    paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '70/470/EEG: Beschikking van de Raad van 13 oktober 1970 houdende machtiging
    tot stilzwijgende verlenging of handhaving van bepaalde tussen de Lid-Staten en
    derde landen gesloten vriendschaps-, handels- en scheepvaartverdragen en soortgelijke
    akkoorden'
