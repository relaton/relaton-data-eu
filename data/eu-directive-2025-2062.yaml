    inkluderingen af nye psykoaktive stoffer i definitionen af narkotika
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2025/2062 της
    Επιτροπής, της 14ης Οκτωβρίου 2025, για την τροποποίηση
    του παραρτήματος της απόφασης-πλαισίου 2004/757/ΔΕΥ
    του Συμβουλίου όσον αφορά την υπαγωγή νέων
    ψυχοδραστικών ουσιών στον ορισμό των ναρκωτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2025/2062, 14. oktoober 2025, millega
