    snovi v opredelitev pojma prepovedana droga
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2025/2062 de la Comisión, de 14 de octubre de
    2025, por la que se modifica el anexo de la Decisión marco 2004/757/JAI del Consejo
    en lo que respecta a la inclusión de nuevas sustancias psicoactivas en la definición
    de droga
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2025/2062 av den 14 oktober 2025
