title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2025/2062 of 14 October 2025 amending
    the Annex to Council Framework Decision 2004/757/JHA as regards the inclusion
    of new psychoactive substances in the definition of drug
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2025/2062 de la Commission du 14 octobre 2025
    modifiant l’annexe de la décision-cadre 2004/757/JAI du Conseil en ce qui concerne
    l’inclusion de nouvelles substances psychoactives dans la définition du terme
    drogue
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2025/2062 der Kommission vom 14. Oktober 2025
