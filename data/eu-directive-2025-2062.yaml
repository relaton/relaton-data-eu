    iš dalies keičiamas Tarybos pamatinio sprendimo 2004/757/TVR priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2025/2062 tal-14 ta’ Ottubru
    2025 li temenda l-Anness tad-Deċiżjoni Kwadru tal-Kunsill 2004/757/ĠAI rigward
    l-inklużjoni ta’ sustanzi psikoattivi ġodda fid-definizzjoni ta’ droga
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2025/2062 van de Commissie van 14 oktober 2025
    tot wijziging van de bijlage bij Kaderbesluit 2004/757/JBZ van de Raad in verband
    met het opnemen van nieuwe psychoactieve stoffen in de definitie van drug
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2025/2062 z dnia 14 października 2025
    r. zmieniająca załącznik do decyzji ramowej Rady 2004/757/WSiSW w odniesieniu
    do włączenia nowych substancji psychoaktywnych do definicji narkotyku
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2025/2062 da Comissão, de 14 de outubro de 2025,
    que altera o anexo da Decisão-Quadro 2004/757/JAI do Conselho no respeitante
    à inclusão de novas substâncias psicoativas na definição de droga
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2025/2062 a Comisiei din 14 octombrie 2025 de
    modificare a anexei la Decizia-cadru 2004/757/JAI a Consiliului în ceea ce privește
    includerea unor substanțe psihoactive noi în definiția termenului drog
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2025/2062 zo 14. októbra 2025, ktorou
    sa mení príloha k rámcovému rozhodnutiu Rady 2004/757/SVV, pokiaľ ide o zahrnutie
    nových psychoaktívnych látok do vymedzenia pojmu drogy
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2025/2062 z dne 14. oktobra 2025 o spremembi
