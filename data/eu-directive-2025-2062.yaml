    ainete lisamisega uimasti määratlusse
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2025/2062, annettu 14 päivänä lokakuuta
    2025, neuvoston puitepäätöksen 2004/757/YOS liitteen muuttamisesta siltä osin
    kuin on kyse uusien psykoaktiivisten aineiden sisällyttämisestä huumausaineen
    määritelmään
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2025/2062 ón gCoimisiún an 14 Deireadh Fómhair
