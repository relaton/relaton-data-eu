title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 797/77 of 19 April 1977 re-establishing
    the levying of the customs duties on other sheep and lambskin leather falling
    within subheading 41.03 B II, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 797/77 de la Commission, du 19 avril 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d'ovins, préparées, non dénommées, de la sous-position tarifaire 41.03 B II,
    originaires de l'Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 797/77 der Kommission vom 19. April 1977 zur Wiedereinführung
    des Zollsatzes für bestimmtes Schaf- und Lammleder der Tarifstelle 41.03 B II,
    mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 797/77 af 19. april 1977 om genindførelse
    af opkrævning af toldafgifter for i andre tilfælde, læder af fåre- og lammeskind,
    andre varer, under underposition 41.03 B II, som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 797/77 della Commissione, del 19 aprile 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine,
    preparate, non nominate, della sottovoce doganale 41.03 B II, originarie dell'India
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 797/77 van de Commissie van 19 april 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op ander schapeleder,
    alsmede voorgelooide huiden en vellen, van schapen, andere overige, van post 41.03
    B II, van oorsprong uit India, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76
    van de Raad algemene tariefpreferenties werden geopend
  type: main
