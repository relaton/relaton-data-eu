title:
- language: en
  script: Latn
  content: '79/735/EEC: Commission Decision of 2 August 1979 on the granting by the
    Guidance Section of the EAGGF to the Kingdom of Denmark of a payment on account
    in respect of expenditure incurred during 1978 on aids and premiums relating to
    the modernization of farms (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/735/CEE: Décision de la Commission, du 2 août 1979, relative au versement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    au Royaume du Danemark, d''un acompte sur les dépenses effectuées pendant l''année
    1978 pour les aides et primes relatives à la modernisation des exploitations
    agricoles (Le texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/735/EWG: Entscheidung der Kommission vom 2. August 1979 über die Zahlung
    eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1978
    zur Modernisierung landwirtschaftlicher Betriebe an Beihilfen und Prämien getätigten
    Ausgaben an das Königreich Dänemark (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/735/EØF: Kommissionens beslutning af 2. august 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Danmark af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1978 til støtte og præmier vedrørende
    modernisering af landbrugsbedrifter (Kun den danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/735/CEE: Decisione della Commissione, del 2 agosto 1979, relativa al
    versamento da parte del FEAOG, sezione orientamento, al Regno di Danimarca di
    un anticipo sulle spese effettuate durante il 1978, per gli aiuti ed i premi relativi
    all''ammodernamento delle aziende agricole (Il testo in lingua danese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/735/EEG: Beschikking van de Commissie van 2 augustus 1979 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk Denemarken van
    een voorschot in verband met de gedurende het jaar 1978 gedane uitgaven voor de
    steun en premies met betrekking tot de modernisering van landbouwbedrijven (Slechts
    de tekst in de Deense taal is authentiek)'
