title:
- language: en
  script: Latn
  content: '2000/595/EC: Council Decision of 26 September 2000 on the conclusion of
    the Agreement in the form of an Exchange of Letters concerning the provisional
    application of the Protocol setting out the fishing opportunities and financial
    contribution provided for in the Agreement between the European Economic Community
    and the Government of the Republic of Guinea on fishing off the Guinean coast
    for the period 1 January 2000 to 31 December 2001'
  type: main
- language: fr
  script: Latn
  content: '2000/595/CE: Décision du Conseil du 26 septembre 2000 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contrepartie financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée concernant la pêche au large de la côte guinéenne,
    pour la période du 1er janvier 2000 au 31 décembre 2001'
  type: main
