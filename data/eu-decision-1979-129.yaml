type: standard
title:
- language: en
  script: Latn
  content: '79/129/EEC: Commission Decision of 18 January 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to blouses and shirt-blouses, knitted or crocheted
    (not elastic or rubberized) or woven, for women, girls and infants, of wool, of
    cotton or of man-made textile fibres, falling within subheadings ex 60.05 A II
    and ex 61.02 B of the Common Customs Tariff (NIMEXE codes 60.05-22, 23, 24, 25;
    61.02-78, 82, 84) (category 7), originating in Bulgaria and in free circulation
    in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/129/CEE: Décision de la Commission, du 18 janvier 1979, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemisiers, blouses- chemisiers et
    blouses de bonneterie (non élastique ni caoutchoutée) ou tissés, pour femmes,
    fillettes et jeunes enfants, de laine, de coton ou de fibres synthétiques ou
    artificielles des sous-positions ex 60.05 A II et ex 61.02 B (codes Nimexe: 60.05-22,
    23, 24, 25; 61.02-78, 82, 84) catégorie 7, du tarif douanier commun, originaires
    de Bulgarie et mis en libre pratique dans les autres États membres (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/129/EWG: Entscheidung der Kommission vom 18. Januar 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Bulgarien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken (weder gummielastisch
    noch kautschutiert) oder Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle,
    Baumwolle, synthetischen oder künstlichen Spinnstoffen, der Tarifstellen ex 60.05
    A II und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 60.05-22;
    23; 24; 25; 61.02-78; 82; 84) (Kategorie 7) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/129/EØF: Kommissionens beslutning af 18. januar 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage skjorter, skjortebluser og bluser af
    trikotage (ikke elastisk eller gummeret) eller vævede, til kvinder, piger og
    småbørn, af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 60.05 A II og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer
    60.05-22, 23, 24, 25; 61.02-78, 82, 84) kategori 7, har oprindelse i Bulgarien
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/129/CEE: Decisione della Commissione, del 18 gennaio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le camicie, camicette e bluse a maglia
    (non elastica né gommata) o tessute, per donna, per ragazza e per bambini, di
    lana, di cotone o di fibre tessili sintetiche o artificiali, delle sottovoci ex
    60.05 A II e ex 61.02 B della tariffa doganale comune (codice Nimexe: 60.05-22,
    23, 24, 25 ; 61.02-78, 82, 84), categoria 7, originarie della Bulgaria e messe
    in libera pratica negli altri Stati membri (I testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/129/EEG: Beschikking van de Commissie van 18 januari 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd blouses, overhemdblouses, van brei- of haakwerk (niet elastisch,
    niet gegummeerd), of geweven voor dames, meisjes en kinderen, van wol, van katoen,
    of van synthetische of van kunstmatige textielvezels, van de onderverdelingen
    ex 60.05 A II en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code
    60.05-22, 23, 24, 25 - 61.02-78, 82, 84) (categorie 7), van oorsprong uit Bulgarije
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
