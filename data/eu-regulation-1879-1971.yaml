title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1879/71 de la Commission, du 27 août 1971, fixant les
    taux des restitutions applicables, à compter du 1er septembre 1971, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1879/71 der Kommission vom 27. August 1971 zur Festsetzung
    der ab 1. September 1971 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1879/71 della Commissione, del 27 agosto 1971, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 settembre 1971,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1879/71 van de Commissie van 27 augustus 1971 houdende
    vaststelling van de restituties die met ingang van 1 september 1971 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
  type: main
