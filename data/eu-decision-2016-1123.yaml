    de frânare asistată (BAS), controlul electronic al stabilității (ESC), sistemele
    de monitorizare a presiunii pneurilor (TPMS) și montarea pneurilor, propunerea
    pentru un nou regulament tehnic mondial al ONU privind procedura de măsurare
    pentru emisiile autovehiculelor cu două sau trei roți și propunerea pentru
    o nouă Rezoluție specială nr. 2 (S.R.2) pentru îmbunătățirea punerii în
    aplicare a Acordului global din 1998
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2016/1123 zo 17. júna 2016, ktorým sa stanovuje
    pozícia, ktorá sa má prijať v mene Európskej únie v príslušných výboroch
    Európskej hospodárskej komisie Organizácie Spojených národov, pokiaľ ide
    o návrhy zmien predpisov OSN č. 9, 11, 13, 13-H, 14, 16, 30, 41, 44, 49, 54,
    55, 60, 64, 75, 78, 79, 83, 90, 106, 113, 115, 117, 129 a 134, návrhy zmien globálnych
    technických predpisov OSN č. 15 a 16, návrhy nových predpisov OSN o systémoch
    podpory brzdenia (BAS), o elektronickom systéme riadenia stability (ESC), o systémoch
    monitorovania tlaku v pneumatikách (TPMS) a o montáži pneumatík, návrh nového
    globálneho technického predpisu OSN o postupe merania emisií pri dvoj- alebo
    trojkolesových motorových vozidlách, a návrh novej osobitnej rezolúcie č.
    2 (S.R.2) na zlepšenie vykonávania Globálnej dohody z roku 1998
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2016/1123 z dne 17. junija 2016 o oblikovanju stališča,
    ki se v imenu Evropske unije zastopa v ustreznih odborih Ekonomske komisije Združenih
    narodov za Evropo, glede predlogov sprememb pravilnikov ZN št. 9, 11, 13, 13-H,
    14, 16, 30, 41, 44, 49, 54, 55, 60, 64, 75, 78, 79, 83, 90, 106, 113, 115, 117,
    129 in 134, predlogov sprememb globalnih tehničnih predpisov ZN št. 15 in 16,
    predlogov novih pravilnikov ZN o sistemih pomoči pri zaviranju (BAS), elektronskem
    nadzoru stabilnosti (ESC), sistemih za nadzor tlaka v pnevmatikah (TPMS) in nameščanju
    pnevmatik, predloga novega globalnega tehničnega predpisa ZN o postopku merjenja
    emisij za dvo- ali trikolesna motorna vozila ter predloga nove Posebne resolucije
    št. 2 (S.R.2) o izboljšanju izvajanja globalnega sporazuma iz leta 1998
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2016/1123 del Consejo, de 17 de junio de 2016, por la que
    se establece la posición que debe adoptarse en nombre de la Unión Europea, en
    los correspondientes comités de la Comisión Económica de las Naciones Unidas
    para Europa en lo que respecta a las propuestas de modificaciones de los Reglamentos
    n.os 9, 11, 13, 13-H, 14, 16, 30, 41, 44, 49, 54, 55, 60, 64, 75, 78, 79, 83,
    90, 106, 113, 115, 117, 129 y 134 de las Naciones Unidas, las propuestas de modificaciones
    de los Reglamentos Técnicos Mundiales n.os 15 y 16 de las Naciones Unidas, las
    propuestas de nuevos Reglamentos de las Naciones Unidas relativos a los sistemas
    de asistencia en el frenado (BAS), el control electrónico de estabilidad (ESC),
    los sistemas de control de la presión de los neumáticos (TPMS) y la instalación
    de neumáticos, la propuesta de un nuevo Reglamento Técnico Mundial de las Naciones
    Unidas sobre el procedimiento de medición aplicable a las emisiones de los vehículos
    de motor de dos o tres ruedas y una propuesta de nueva Resolución Especial n.°
    2 (S.R.2) relativa a la mejora de la aplicación del Acuerdo global de 1998
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2016/1123 av den 17 juni 2016 om fastställande av
    den ståndpunkt som ska intas på Europeiska unionens vägnar i de relevanta kommittéerna
    inom Förenta nationernas ekonomiska kommission för Europa vad gäller de föreslagna
    ändringarna av Uneceföreskrifterna nr 9, 11, 13, 13-H, 14, 16, 30, 41, 44, 49,
    54, 55, 60, 64, 75, 78, 79, 83, 90, 106, 113, 115, 117, 129 och 134, de föreslagna
    ändringarna av de globala tekniska föreskrifterna nr 15 och 16, förslagen till
    nya Uneceföreskrifter om bromsassistanssystem, elektronisk stabilitetskontroll,
    system för övervakning av däcktryck och montering av däck, förslaget till
    nya globala tekniska föreskrifter om mätförfarandet för utsläpp från två-
    och trehjuliga motorfordon samt förslaget till en ny särskild resolution nr
    2 (S.R.2) för att förbättra genomförandet av 1998 års globala överenskommelse
  type: main
