title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2900/77 of 22 December 1977 laying down
    detailed rules for the sale of beef held by the intervention agencies to enable
    the import with total suspension of the levy of frozen beef and veal intended
    for processing
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2900/77 de la Commission, du 22 décembre 1977, portant
    modalités de la vente de viandes bovines détenues par les organismes d' intervention
    afin de permettre l' importation en suspension totale du prélèvement de viandes
    bovines congelées destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2900/77 der Kommission vom 22. Dezember 1977 über
    die Modalitäten für den Verkauf von Rindfleisch aus Beständen der Interventionsstellen
    zur Ermöglichung der Einfuhr von zur Verarbeitung bestimmtem gefrorenem Rindfleisch
    mit vollständiger Aussetzung der Abschöpfung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2900/77 af 22. december 1977 om gennemførelsesbestemmelser
    for salg af oksekød, som interventionsorganerne ligger inde med, med henblik
    på at tillade indførsel af frosset oksekød til forarbejdning med fuld suspension
    af importafgiften
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2900/77 della Commissione, del 22 dicembre 1977, recante
    modalità per la vendita di carni bovine detenute dagli organismi d' intervento
    onde consentire l' importazione, con sospensione totale del prelievo, di carni
    bovine congelate destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2900/77 van de Commissie van 22 december 1977 houdende
    bepalingen betreffende de verkoop van rundvlees dat in het bezit is van de interventiebureaus
    ten einde de invoer, met totale schorsing van de heffing, van bevroren rundvlees
    bestemd voor de verwerking mogelijk te maken
  type: main
