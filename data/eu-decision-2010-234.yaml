    rautatiejärjestelmän osajärjestelmää liikkuva kalusto – melu koskevasta
    yhteentoimivuuden teknisestä eritelmästä tehtyyn komission päätökseen 2006/66/EY
    ja Euroopan laajuisen tavanomaisen rautatiejärjestelmän osajärjestelmää liikkuva
    kalusto – tavaraliikenteen vaunut koskevasta yhteentoimivuuden teknisestä eritelmästä
    tehtyyn komission päätökseen 2006/861/EY (tiedoksiannettu numerolla K(2010)
    2546)'
  type: main
- language: hu
  script: Latn
  content: '2010/234/: A Bizottság határozata ( 2010. április 26. ) a transzeurópai
    hagyományos vasúti rendszer járművek – zaj alrendszerére vonatkozó átjárhatósági
    műszaki előírásról szóló 2006/66/EK határozat és a transzeurópai hagyományos
    vasúti rendszer járművek – teherkocsik alrendszerére vonatkozó átjárhatósági
    műszaki előírásról szóló 2006/861/EK határozat alól Luxemburg részére
    biztosított részleges eltérés engedélyezéséről (az értesítés a C(2010)
    2546. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2010/234/: Decisione della Commissione, del 26 aprile 2010 , che concede
    al Lussemburgo una deroga parziale alla decisione 2006/66/CE relativa alla specifica
