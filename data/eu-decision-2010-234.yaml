    paprastųjų geležinkelių posistemio Riedmenys: triukšmas techninių sąveikos
    specifikacijų ir nuo Sprendimo 2006/861/EB dėl transeuropinės paprastųjų
    geležinkelių sistemos posistemio Riedmenys: prekiniai vagonai techninių sąveikos
    specifikacijų (pranešta dokumentu Nr. C(2010) 2546)'
  type: main
- language: mt
  script: Latn
  content: '2010/234/: Deċiżjoni tal-Kummissjoni tas- 26 ta’ April 2010 li tagħti
