title:
- language: en
  script: Latn
  content: '2010/234/: Commission Decision of 26 April 2010 granting Luxembourg a
    partial derogation from Decision 2006/66/EC concerning the technical specification
    for interoperability relating to the subsystem rolling stock — noise of the
    trans-European conventional rail system and from Decision 2006/861/EC concerning
    the technical specification of interoperability relating to the subsystem rolling
    stock — freight wagons of the trans-European conventional rail system (notified
    under document C(2010) 2546)'
  type: main
- language: fr
  script: Latn
  content: '2010/234/: Décision de la Commission du 26 avril 2010 accordant au Luxembourg
    une dérogation partielle à la décision 2006/66/CE relative à la spécification
    technique d’interopérabilité concernant le sous-système Matériel roulant
    — bruit du système ferroviaire transeuropéen conventionnel et à la décision
    2006/861/CE relative à la spécification technique d’interopérabilité concernant
    le sous-système Matériel roulant — wagons pour le fret du système ferroviaire
    transeuropéen conventionnel [notifiée sous le numéro C(2010) 2546]'
  type: main
- language: de
  script: Latn
