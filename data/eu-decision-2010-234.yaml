    Fahrzeuge — Lärm des konventionellen transeuropäischen Bahnsystems und von
    der Entscheidung 2006/861/EG betreffend die technische Spezifikation für Interoperabilität
    in Bezug auf das Teilsystem Fahrzeuge — Güterwagen des konventionellen transeuropäischen
    Bahnsystems (Bekannt gegeben unter Aktenzeichen K(2010) 2546)'
