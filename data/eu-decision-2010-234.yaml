    rumore del sistema ferroviario transeuropeo convenzionale, e della decisione 2006/861/CE
    relativa alla specifica tecnica di interoperabilità per il sottosistema Materiale
    rotabile — carri merci del sistema ferroviario transeuropeo convenzionale [notificata
    con il numero C(2010) 2546]'
  type: main
- language: lv
  script: Latn
  content: '2010/234/: Komisijas Lēmums ( 2010. gada 26. aprīlis ), ar ko Luksemburgai
