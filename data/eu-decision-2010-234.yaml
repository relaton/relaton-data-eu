    tehnisko specifikāciju attiecībā uz Eiropas parasto dzelzceļu sistēmas apakšsistēmu
    ritošais sastāvs – troksnis un no Lēmuma 2006/861/EK par savstarpējas izmantojamības
    tehnisko specifikāciju attiecībā uz Eiropas parasto dzelzceļu sistēmas apakšsistēmu
    ritošais sastāvs – kravas vagoni (izziņots ar dokumenta numuru C(2010) 2546)'
  type: main
