  script: Latn
  content: A Bizottság (EU) 2023/3 rendelete (2023. január 3.) az elektromos motorokra
    és a frekvenciaváltókra vonatkozó környezettudatos tervezési követelményeknek
    a 2009/125/EK európai parlamenti és tanácsi irányelv szerinti megállapításáról,
    a 641/2009/EK rendeletnek a tömszelence nélküli önálló keringetőszivattyúkra
    és a termékbe beépített tömszelence nélküli keringetőszivattyúkra vonatkozó
    környezettudatos tervezési követelmények tekintetében történő módosításáról
    szóló (EU) 2019/1781 rendelet német nyelvi változatának helyesbítéséről
  type: main
