    en matière d’écoconception applicables aux moteurs électriques et aux variateurs
    de vitesse conformément à la directive 2009/125/CE du Parlement européen et
    du Conseil, et modifiant le règlement (CE) no 641/2009 concernant les exigences
    d’écoconception applicables aux circulateurs sans presse-étoupe indépendants
    et aux circulateurs sans presse-étoupe intégrés dans des produits
