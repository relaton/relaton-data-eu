    requisitos de diseño ecológico para los motores eléctricos y los variadores
    de velocidad de conformidad con la Directiva 2009/125/CE del Parlamento Europeo
    y del Consejo, se modifica el Reglamento (CE) n.o 641/2009 en lo relativo a los
