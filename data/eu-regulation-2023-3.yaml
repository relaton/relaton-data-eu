    nosaka ekodizaina prasības elektromotoriem un regulējuma ātruma piedziņām
    un groza Regulu (EK) Nr. 641/2009 attiecībā uz ekodizaina prasībām autonomiem
    hermētiskajiem cirkulācijas sūkņiem un produktos iebūvējamiem hermētiskajiem
