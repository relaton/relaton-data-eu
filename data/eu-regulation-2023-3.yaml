    per la progettazione ecocompatibile dei motori elettrici e dei variatori di velocità
    in applicazione della direttiva 2009/125/CE del Parlamento europeo e del Consiglio
    recante modifica del regolamento (CE) n. 641/2009 della Commissione per quanto
    riguarda le specifiche per la progettazione ecocompatibile dei circolatori senza
    premistoppa indipendenti e dei circolatori senza premistoppa integrati in prodotti
  type: main
