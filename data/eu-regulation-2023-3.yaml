  content: Commission Regulation (EU) 2023/3 of 3 January 2023 correcting the German
    language version of Regulation (EU) 2019/1781 laying down ecodesign requirements
    for electric motors and variable speed drives pursuant to Directive 2009/125/EC
    of the European Parliament and of the Council, amending Regulation (EC) No 641/2009
    with regard to ecodesign requirements for glandless standalone circulators and
    glandless circulators integrated in products
  type: main
