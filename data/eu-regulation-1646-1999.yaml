title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1646/1999 of 27 July 1999 initiating an investigation
    concerning the alleged circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 2861/93 on imports of certain magnetic disks (3,5 in. microdisks)
    originating in Taiwan and the People's Republic of China by assembly operations
    in the Community and making imports of microdisk parts subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1646/1999 de la Commission, du 27 juillet 1999, ouvrant
    une enquête portant sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) nº 2861/93 du Conseil sur les importations de certains
    disques magnétiques (microdisques de 3,5 pouces) originaires de Taïwan et de
    la République populaire de Chine par des opérations d'assemblage dans la Communauté
    et soumettant à enregistrement les importations de parties de microdisques
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1646/1999 der Kommission vom 27. Juli 1999 zur Einleitung
    einer Untersuchung betreffend die angebliche Umgehung der mit der Verordnung (EG)
    Nr. 2861/93 des Rates eingeführten Antidumpingzölle auf die Einfuhren bestimmter
    Magnetplatten (3,5&Prime;-Mikroplatten) mit Ursprung in Taiwan und der Volksrepublik
    China durch Montagevorgänge in der Gemeinschaft und zur zollamtlichen Erfassung
    der Einfuhren von Teilen dieser Mikroplatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1646/1999 af 27. juli 1999 om indledning
    af en undersøgelse vedrørende angivelig omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EØF) nr. 2861/93 på importen af visse
    magnetplader (3,5&Prime; disketter) med oprindelse i Taiwan og Folkerepublikken
    Kina, ved samleprocesser i Fællesskabet og om indførelse af registrering af
    importen af dele til mikrodisketter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1646/1999 της Επιτροπής,
    της 27ης Ιουλίου 1999, για την έναρξη έρευνας σχετικά
    με ισχυρισμούς για καταστρατήγηση των μέτρων
    αντιντάμπινγκ επί των εισαγωγών ορισμένων
    μαγνητικών δίσκων (μικροδίσκων 3,5&Prime;) καταγωγής
    Ταϊβάν και Λαϊκής Δημοκρατίας της Κίνας μέσω
    εργασιών συναρμολόγησης στην Κοινότητα και
    για την καθιέρωση της υποβολής των εισαγωγών
    μερών μικροδίσκων σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1646/1999, annettu 27 päivänä heinäkuuta
    1999, tiettyjen Taiwanista ja Kiinan kansantasavallasta peräisin olevien magneettilevyjen
    (3,5 tuuman mikrolevyt) tuonnissa neuvoston asetuksella (ETY) N:o 2861/93 käyttöön
    otettujen polkumyynnin vastaisten toimenpiteiden kiertämistä yhteisössä suoritettavilla
    kokoonpanotoimilla koskevan tutkimuksen vireillepanosta ja mikrolevyjen osien
    tuonnin saattamisesta kirjaamisen alaiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1646/1999 della Commissione, del 27 luglio 1999, che
    apre un'inchiesta riguardante l'asserita elusione, mediante operazioni di assemblaggio
    nella Comunità, delle misure antidumping istituite dal regolamento (CEE) n. 2861/93
    del Consiglio nei confronti delle importazioni di alcuni tipi di dischi magnetici
    (microfloppy da 3,5 pollici) originari di Taiwan e della Repubblica popolare cinese
    e sottopone a registrazione le importazioni di parti di microfloppy
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1646/1999 van de Commissie van 27 juli 1999 houdende
    de opening van een onderzoek naar de mogelijke ontwijking van de bij Verordening
    (EG) nr. 2861/93 vastgestelde antidumpingmaatregelen ten aanzien van bepaalde
    magneetschijven (3,5"-microschijven) uit Taiwan en de Volksrepubliek China door
    assemblage in de Gemeenschap en het besluit tot registratie van de invoer van
    deze microschijven
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1646/1999 da Comissão, de 27 de Julho de 1999, que
    inicia um inquérito relativo à alegada evasão às medidas anti-dumping criadas
    pelo Regulamento (CE) n° 2861/93 do Conselho sobre as importações de certos
    discos magnéticos (microdiscos - «diskettes» - de 3,5 polegadas) originárias
    de Taiwan e da República Popular da China, através de operações de montagem
    na Comunidade e assegura que essas importações sejam objecto de registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1646/1999 de la Comisión, de 27 de julio de 1999,
    relativo a la apertura de una investigación sobre la presunta elusión de las
    medidas antidumping establecidas por el Reglamento (CEE) nº 2861/93 del Consejo
    relativo a las importaciones de determinados discos magnéticos (microdiscos de
    3,5 pulgadas) originarios de Taiwán y de la República Popular de China mediante
    operaciones de montaje en la Comunidad y por el que se someten a registro las
    importaciones de piezas de microdiscos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1646/1999 av den 27 juli 1999 om inledande
    av en undersökning om påstått kringgående av antidumpningsåtgärder införda
    genom rådets förordning (EEG) nr 2861/93 på import av vissa magnetskivor (3,5-tumsdisketter)
    med ursprung i Taiwan och i Folkrepubliken Kina genom monteringsverksamhet i gemenskapen
    och om registrering av import av delar till mikrodisketter
