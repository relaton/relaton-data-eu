title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3235/81 of 12 November 1981 authorizing
    the United Kingdom to permit for the 1981/82 wine-growing year an additional increase
    in the alcoholic strength of certain wines and certain products intended for wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3235/81 de la Commission, du 12 novembre 1981, autorisant
    le Royaume-Uni à permettre, pour la campagne viticole 1981/1982, une augmentation
    supplémentaire du titre alcoométrique de certains vins et de certains produits
    destinés à l' élaboration des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3235/81 der Kommission vom 12. November 1981 zur Ermächtigung
    des Vereinigten Königreichs, für das Weinwirtschaftsjahr 1981/82 eine zusätzliche
    Erhöhung des Alkoholgehalts bestimmter Weine und bestimmter zur Weinherstellung
    vorgesehener Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3235/81 af 12. november 1981 om bemyndigelse
    til Det forenede Kongerige til for produktionsåret 1981/82 at tillade en yderligere
    forhøjelse af alkoholindholdet i visse vine og visse produkter, der er bestemt
    til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3235/81 τής Επιτροπής
    τής 12ης Νοεμβρίου 1981 περί χορηγήσεως αδείας
    στό Ηνωμένο Βαίλειο νά επιτρέπει, γιά τήν αμπελουργική
    περίοδο 1981/82, τή συμπληρωματική αύξηση τού
    αλκοολικού τίτλου ορισμένων οίνων καί ορισμένων
    προϊόντων προοριζομένων γιά τήν παραγωγή οίνων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3235/81 della Commissione, del 12 novembre 1981, che
    autorizza il Regno Unito a permettere per la campagna viticola 1981/1982 un aumento
    supplementare della gradazione alcolometrica di taluni vini e di taluni prodotti
    destinati all' elaborazione dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3235/81 van de Commissie van 12 november 1981 tot
    machtiging van het Verenigd Koninkrijk voor het wijnoogstjaar 1981/1982 een extra
    verhoging van het alcoholgehalte van bepaalde wijnen en van bepaalde voor de bereiding
    van wijn bestemde produkten toe te staan
  type: main
