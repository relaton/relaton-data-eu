  content: Commission Regulation (EEC) No 3026/80 of 24 November 1980 opening an invitation
    to tender for the levy and/or refund for the export of common wheat to countries
    in Zones I, IIb, V, VI, VIIa and VIIc with the exception of the Soviet Union,
    and amending Regulation (EEC) No 1431/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3026/80 de la Commission, du 24 novembre 1980, relatif
    à l'ouverture d'une adjudication du prélèvement et/ou de la restitution à
    l'exportation de froment tendre vers les pays des zones I, II b), V, VI, VII a)
    et VII c) à l'exception de l'Union soviétique et modifiant le règlement (CEE)
    n 1431/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3026/80 der Kommission vom 24. November 1980 über
    die Eröffnung einer Ausschreibung der Abschöpfung und/oder der Erstattung für
    die Ausfuhr von Weichweizen nach Ländern der Zonen I, II b), V, VI, VII a) und
    VII c) mit Ausnahme der Sowjetunion und zur Änderung der Verordnung (EWG) Nr.
    1431/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3026/80 af 24. november 1980 om åbning
