    tenero verso i paesi delle zone I, II b), V, VI, VII a) e VII c), esclusa l'Unione
    Sovietica, e che modifica il regolamento (CEE) n. 1431/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3026/80 van de Commissie van 24 november 1980 inzake
    een openbare inschrijving voor de heffing en/of de restitutie bij uitvoer van
    zachte tarwe naar de landen van de zones I, II b), V, VI, VII a) en VII c), met
    uitzondering van de Sovjetunie, en tot wijziging van Verordening (EEG) nr. 1431/80
