    til lande i zone I, II b), V, VI, VII a) og VII c) med undtagelse af Sovjetunionen
    og om ændring af forordning (EØF) nr. 1431/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3026/80 della Commissione, del 24 novembre 1980, che
