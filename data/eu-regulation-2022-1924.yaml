  content: Commission Implementing Regulation (EU) 2022/1924 of 10 October 2022 imposing
    a definitive anti-dumping duty on imports of sodium cyclamate originating in the
    People’s Republic of China and Indonesia following an expiry review pursuant
    to Article 11(2) of Regulation (EU) 2016/1036 of the European Parliament and of
    the Council
  type: main
- language: fr
