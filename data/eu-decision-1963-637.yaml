title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 14 octobre 1963, relative à la circulation
    des marchandises obtenues dans un État membre, dans la fabrication desquelles
    sont entrés des produits qui, dans l'État membre de fabrication, n'ont pas été
    soumis aux droits de douane et taxes d'effet équivalent qui leur étaient applicables
    ou qui ont bénéficié d'une ristourne totale ou partielle de droits ou taxes
  type: main
- language: de
  script: Latn
  content: '63/637/EWG: Entscheidung der Kommission vom 14. Oktober 1963 über den
    Verkehr mit Waren, die in einem Mitgliedstaat unter Verwendung von Erzeugnissen
    hergestellt werden, für die im herstellenden Mitgliedstaat die auf sie anwendbaren
    Zölle und Abgaben gleicher Wirkung entweder nicht erhoben oder vollständig oder
    teilweise rückvergütet worden sind'
  type: main
- language: it
  script: Latn
  content: '63/637/CEE: Decisione della Commissione del 14 ottobre 1963 relativa alla
    circolazione delle merci ottenute in uno Stato membro, per la fabbricazione delle
    quali siano stati impiegati prodotti che, nello Stato membro di fabbricazione,
    non sono stati sottoposti ai dazi doganali né alle tasse di effetto equivalente
    loro applicabili, ovvero che abbiano beneficiato di un ristorno totale o parziale
    di tali dazi o tasse'
  type: main
- language: nl
  script: Latn
  content: '63/637/EEG: Beschikking van de Commissie van 14 oktober 1963 inzake het
    verkeer van de goederen die in een Lidstaat zijn verkregen en waarin produkten
    zijn verwerkt op welke, in het land waar de vervaardiging heeft plaatsgehad, de
    toepasselijke douanerechten en heffingen van gelijke werking niet zijn geheven
    of waarvoor gehele of gedeeltelijke teruggave van die rechten of heffingen is
    verleend'
  type: main
