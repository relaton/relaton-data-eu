title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 871/98 of 23 April 1998 determining the percentage
    of quantities which may be allowed in respect of import licence applications lodged
    in April 1998 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1939/97 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 871/98 de la Commission du 23 avril 1998 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en avril 1998 pour les contingents tarifaires de viandes bovines prévus
    par le règlement (CE) n° 1939/97 pour la République de Pologne, la République
    de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 871/98 der Kommission vom 23. April 1998 zur Bestimmung
    des Prozentsatzes, zu dem den im April 1998 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Fleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß Verordnung (EG)
    Nr. 1939/97 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 871/98 af 23. april 1998 om fastsættelse
