title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1413/78 of 23 June 1978 re-establishing
    the levying of customs duties on thread of asbestos, falling within subheading
    68.13 B I, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1413/78 de la Commission, du 23 juin 1978, portant
    rétablissement de la perception des droits de douane applicables aux fils d'amiante,
    de la sous- position tarifaire 68.13 B I, originaires de la Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1413/78 der Kommission vom 23. Juni 1978 zur Wiedereinführung
    des Zollsatzes für Fäden aus Asbest der Tarifstelle 68.13 B I, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1413/78 af 23. juni 1978 om genindførelse
    at opkrævning af toldafgifter for garn af asbest under underposition 68.13 B
    I, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1413/78 della Commissione, del 23 giugno 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai fili di amianto della
    sottovoce doganale 68.13 B I originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1413/78 van de Commissie van 23 juni 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op garens van
    asbest, van post 68.13 B I, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
