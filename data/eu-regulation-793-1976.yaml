title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 793/76 of 6 April 1976 amending Regulation
    (EEC) No 1035/72 on the common organization of the market in fruit and vegetables
    and Regulation (EEC) No 2511/69 laying down special measures for improving the
    production and marketing of Community citrus fruit
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 793/76 du Conseil, du 6 avril 1976, modifiant le règlement
    (CEE) n° 1035/72 portant organisation commune des marchés dans le secteur des
    fruits et légumes, ainsi que le règlement (CEE) n° 2511/69 prévoyant des mesures
    spéciales en vue de l'amélioration de la production et de la commercialisation
    dans le secteur des agrumes communautaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 793/76 des Rates vom 6. April 1976 zur Änderung der
    Verordnung (EWG) Nr. 1035/72 über eine gemeinsame Marktorganisation für Obst
    und Gemüse sowie der Verordnung (EWG) Nr. 2511/69 über Sondermaßnahmen zur
    Verbesserung der Erzeugung und Vermarktung von Zitrusfrüchten der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 793/76 af 6. april 1976 om ændring af forordning
    (EØF) nr. 1035/72 om den fælles markedsordning for frugt og grønsager samt
    af forordning (EØF) nr. 2511/69 om særlige foranstaltninger til forbedring af
    produktion og afsætning af citrusfrugter, produceret i Fællesskaber
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 793/76 του Συμβουλίου
    της 6ης Απριλίου 1976 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 1035/72 «περί κοινής οργανώσεως
    αγοράς στον τομέα των οπωροκηπευτικών» και
    του κανονισμού (ΕΟΚ) αριθ. 2511/69 «περί θεσπίσεως
    ειδικών μέτρων με σκοπό τη βελτίωση της παραγωγής
    και της εμπορίας στον τομέα των κοινοτικών
    εσπεριδοειδών»
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 793/76, annettu 6 päivänä huhtikuuta 1976,
    hedelmä- ja vihannesalan yhteisestä markkinajärjestelystä annetun asetuksen
    (ETY) N:o 1035/72 sekä erityistoimenpiteistä yhteisön sitrushedelmäalan tuotannon
    ja kaupan pitämisen parantamiseksi annetun asetuksen (ETY) N:o 2511/69 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 793/76 del Consiglio, del 6 aprile 1976, che modifica
    il regolamento (CEE) n. 1035/72 relativo all'organizzazione comune dei mercati
    nel settore degli ortofrutticoli ed il regolamento (CEE) n. 2511/69 che prevede
    misure speciali per il miglioramento della produzione e della commercializzazione
    nel settore degli agrumi Comunitàri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 793/76 van de Raad van 6 april 1976 tot wijziging
    van Verordening (EEG) nr. 1035/72 houdende een gemeenschappelijke ordening der
    markten in de sector groenten en fruit, alsmede van Verordening (EEG) nr. 2511/69
    houdende bijzondere maatregelen voor de verbetering van de produktie en de afzet
    van citrusvruchten in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 793/76 do Conselho, de 6 de Abril de 1976, que altera
    o Regulamento (CEE) nº 1035/72 que estabelece a organização comum de mercado
    no sector das frutas e produtos hortícolas, bem como o Regulamento (CEE) nº
    2511/69 que prevê medidas especiais tendo em vista o melhoramento da produção
    e da comercialização no sector dos citrinos produzidos na Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 793/76 del Consejo, de 6 de abril de 1976, por el
    que se modifican el Reglamento (CEE) n° 1035/72 por el que se establece la organización
    común de mercados en el sector de las frutas y hortalizas y el Reglamento (CEE)
    n° 2511/69 por el que se prevén medidas especiales para la mejora de la producción
    en el sector de los cítricos comunitarios
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 793/76 av den 6 april 1976 om ändring av
