  script: Latn
  content: Commission Directive 1999/51/EC of 26 May 1999 adapting to technical progress
    for the fifth time Annex I to Council Directive 76/769/EEC on the approximations
    of the laws, regulations, and administrative provisions of the Member States relating
    to restrictions on the marketing and use of certain dangerous substances and preparations
    (tin, PCP and cadmium)
  type: main
- language: fr
  script: Latn
