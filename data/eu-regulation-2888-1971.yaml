  content: Règlement (CEE) n° 2888/71 de la Commission, du 30 décembre 1971, relatif
    à la fixation des montants compensatoires valables à partir du 3 janvier 1972
    dans le secteur agricole à la suite de l'élargissement temporaire des marges
    de fluctuation des monnaies des États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2888/71 der Kommission vom 30. Dezember 1971 über
    die Festsetzung der ab 3. Januar 1972 geltenden Ausgleichsbeträge in der Landwirtschaft
    im Anschluß an die vorübergehende Erweiterung der Bandbreiten der Währungen
    der Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2888/71 della Commissione, del 30 dicembre 1971, relativo
    alla fissazione degli importi di compensazione valevoli a decorrere dal 3 gennaio
    1972 nel settore agricolo in seguito all'ampliamento temporaneo dei margini di
    fluttuazione delle monete degli Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2888/71 van de Commissie van 30 december 1971 houdende
    vaststelling van de compenserende bedragen geldig vanaf 3 januari 1972 in de landbouwsector
    naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges van de valuta's
    van de Lid-Staten
