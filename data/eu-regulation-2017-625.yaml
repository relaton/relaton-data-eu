    e as Diretivas 98/58/CE, 1999/74/CE, 2007/43/CE, 2008/119/CE e 2008/120/CE do
    Conselho, e que revoga os Regulamentos (CE) n.° 854/2004 e (CE) n.° 882/2004
    do Parlamento Europeu e do Conselho, as Diretivas 89/608/CEE, 89/662/CEE, 90/425/CEE,
    91/496/CEE, 96/23/CE, 96/93/CE e 97/78/CE do Conselho e a Decisão 92/438/CEE
    do Conselho (Regulamento sobre os controlos oficiais)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2017/625 al Parlamentului European și al Consiliului
    din 15 martie 2017 privind controalele oficiale și alte activități oficiale
    efectuate pentru a asigura aplicarea legislației privind alimentele și furajele,
    a normelor privind sănătatea și bunăstarea animalelor, sănătatea plantelor
    și produsele de protecție a plantelor, de modificare a Regulamentelor (CE) nr.
    999/2001, (CE) nr. 396/2005, (CE) nr. 1069/2009, (CE) nr. 1107/2009, (UE) nr.
    1151/2012, (UE) nr. 652/2014, (UE) 2016/429 și (UE) 2016/2031 ale Parlamentului
