    1/2005 a (ES) č. 1099/2009 a smerníc Rady 98/58/ES, 1999/74/ES, 2007/43/ES,
    2008/119/ES a 2008/120/ES a o zrušení nariadení Európskeho parlamentu a Rady
    (ES) č. 854/2004 a (ES) č. 882/2004, smerníc Rady 89/608/EHS, 89/662/EHS, 90/425/EHS,
    91/496/EHS, 96/23/ES, 96/93/ES a 97/78/ES a rozhodnutia Rady 92/438/EHS (nariadenie
    o úradných kontrolách)
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2017/625 Evropskega parlamenta in Sveta z dne 15. marca 2017
    o izvajanju uradnega nadzora in drugih uradnih dejavnosti, da se zagotovi uporaba
    zakonodaje o živilih in krmi, pravil o zdravju in dobrobiti živali ter zdravju
    rastlin in fitofarmacevtskih sredstvih, ter o spremembi uredb (ES) št. 999/2001,
    (ES) št. 396/2005, (ES) št. 1069/2009, (ES) št. 1107/2009, (EU) št. 1151/2012,
    (EU) št. 652/2014, (EU) 2016/429 in (EU) 2016/2031 Evropskega parlamenta in Sveta,
    uredb Sveta (ES) št. 1/2005 in (ES) št. 1099/2009 ter direktiv Sveta 98/58/ES,
    1999/74/ES, 2007/43/ES, 2008/119/ES in 2008/120/ES ter razveljavitvi uredb (ES)
    št. 854/2004 in (ES) št. 882/2004 Evropskega parlamenta in Sveta, direktiv Sveta
    89/608/EGS, 89/662/EGS, 90/425/EGS, 91/496/EGS, 96/23/ES, 96/93/ES in 97/78/ES
    ter sklepa Sveta 92/438/EGS (Uredba o uradnem nadzoru)
  type: main
