    ale Consiliului și a Directivelor 98/58/CE, 1999/74/CE, 2007/43/CE, 2008/119/CE
    și 2008/120/CE ale Consiliului și de abrogare a Regulamentelor (CE) nr. 854/2004
    și (CE) nr. 882/2004 ale Parlamentului European și ale Consiliului, precum și
    a Directivelor 89/608/CEE, 89/662/CEE, 90/425/CEE, 91/496/CEE, 96/23/CE, 96/93/CE
    și 97/78/CE ale Consiliului și a Deciziei 92/438/CEE a Consiliului (Regulamentul
    privind controalele oficiale)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2017/625 z 15. marca 2017
    o úradných kontrolách a iných úradných činnostiach vykonávaných na zabezpečenie
    uplatňovania potravinového a krmivového práva a pravidiel pre zdravie zvierat
    a dobré životné podmienky zvierat, pre zdravie rastlín a pre prípravky na
    ochranu rastlín, o zmene nariadení Európskeho parlamentu a Rady (ES) č. 999/2001,
    (ES) č. 396/2005, (ES) č. 1069/2009, (ES) č. 1107/2009, (EÚ) č. 1151/2012,
