    (EU) nr. 1151/2012, (EU) nr. 652/2014, (EU) 2016/429 en (EU) 2016/2031 van het
    Europees Parlement en de Raad, de Verordeningen (EG) nr. 1/2005 en (EG) nr. 1099/2009
    van de Raad en de Richtlijnen 98/58/EG, 1999/74/EG, 2007/43/EG, 2008/119/EG en
    2008/120/EG van de Raad, en tot intrekking van de Verordeningen (EG) nr. 854/2004
    en (EG) nr. 882/2004 van het Europees Parlement en de Raad, de Richtlijnen 89/608/EEG,
    89/662/EEG, 90/425/EEG, 91/496/EEG, 96/23/EG, 96/93/EG en 97/78/EG van de Raad
    en Besluit 92/438/EEG van de Raad (verordening officiële controles)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/625 z dnia 15
    marca 2017 r. w sprawie kontroli urzędowych i innych czynności urzędowych przeprowadzanych
    w celu zapewnienia stosowania prawa żywnościowego i paszowego oraz zasad dotyczących
    zdrowia i dobrostanu zwierząt, zdrowia roślin i środków ochrony roślin, zmieniające
    rozporządzenia Parlamentu Europejskiego i Rady (WE) nr 999/2001, (WE) nr 396/2005,
    (WE) nr 1069/2009, (WE) nr 1107/2009, (UE) nr 1151/2012, (UE) nr 652/2014, (UE)
    2016/429 i (UE) 2016/2031, rozporządzenia Rady (WE) nr 1/2005 i (WE) nr 1099/2009
    oraz dyrektywy Rady 98/58/WE, 1999/74/WE, 2007/43/WE, 2008/119/WE i 2008/120/WE,
    oraz uchylające rozporządzenia Parlamentu Europejskiego i Rady (WE) nr 854/2004
    i (WE) nr 882/2004, dyrektywy Rady 89/608/EWG, 89/662/EWG, 90/425/EWG, 91/496/EWG,
    96/23/WE, 96/93/WE i 97/78/WE oraz decyzję Rady 92/438/EWG (rozporządzenie w
    sprawie kontroli urzędowych)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho, de 15 de
    março de 2017, relativo aos controlos oficiais e outras atividades oficiais que
    visam assegurar a aplicação da legislação em matéria de géneros alimentícios
    e alimentos para animais e das regras sobre saúde e bem-estar animal, fitossanidade
    e produtos fitofarmacêuticos, que altera os Regulamentos (CE) n.° 999/2001,
    (CE) n.° 396/2005, (CE) n.° 1069/2009, (CE) n.° 1107/2009, (UE) n.° 1151/2012,
    (UE) n.° 652/2014, (UE) 2016/429 e (UE) 2016/2031 do Parlamento Europeu e do
