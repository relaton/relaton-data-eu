title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/108 of 28 January 2021 concerning
    the extension of the action taken by the Hungarian National Public Health Centre
    permitting the making available on the market and use of the biocidal product
    Biobor JF in accordance with Article 55(1) of Regulation (EU) No 528/2012 of the
    European Parliament and of the Council (notified under document C(2021) 403) (Only
    the Hungarian text is authentic)
  type: main
- language: fr
  script: Latn
