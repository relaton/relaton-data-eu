type: standard
title:
- language: en
  script: Latn
  content: '79/787/EEC: Commission Decision of 30 August 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''outer garments, women''s, girls''and
    infants''outer garments ; men''s and boys''woven breeches, shorts and trousers
    (including slacks) ; women''s, girls''and infants''woven trousers and slacks,
    of wool, of cotton or of man-made textile fibres, falling within subheadings 61.01
    ex B and 61.02 ex B of the Common Customs Tariff (NIMEXE codes 61.01-62, 64, 66,
    72, 74, 76 ; 61.02-66, 68, 72) (category 6), originating in the Philippines and
    in free circulation in the other Member States (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/787/CEE: Décision de la Commission, du 30 août 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vêtements de dessus pour hommes et
    garçonnets, vêtements de dessus pour femmes, fillettes et jeunes enfants : culottes,
    "shorts" et pantalons tissés pour hommes et garçonnets, pantalons tissés pour
    femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques et artificielles, des sous-positions 61.01 ex B et 61.02 ex B du
    tarif douanier commun (codes Nimexe : 61.01-62, 64, 66, 72, 74, 76 ; 61.02-66,
    68, 72) (catégorie 6), originaires des Philippines et mis en libre pratique dans
    les autres États membres (Les textes en langues française et néerlandaise sont
    les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/787/EWG: Entscheidung der Kommission vom 30. August 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus den Philippinen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberkleidung für Männer und Knaben, Oberkleidung
    für Frauen, Mädchen und Kleinkinder: Shorts und andere kurze Hosen und lange
    Hosen, aus Geweben, für Männer und Knaben; lange Hosen aus Geweben für Frauen,
    Mädchen und Kleinkinder; aus Wolle, Baumwolle, synthetischen oder künstlichen
    Spinnstoffen, der Tarifstellen 61.01 ex B und 61.02 ex B des Gemeinsamen Zolltarifs
    (NIMEXE- Kennziffern 61.01-62 ; 64 ; 66 ; 72 ; 74 ; 76 und 61.02- 66 ; 68 ; 72)
    (Kategorie 6) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/787/EØF: Kommissionens beslutning af 30. august 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage yderbeklædningsgenstande til mænd
    og drenge, yderbeklædningsgenstande til kvinder, piger og småbørn ; shorts
    og andre korte benklæder til mænd og drenge, vævede ; lange benklæder til
    kvinder, piger og småbørn, vævede af uld, bomuld eller syntetiske eller regenererede
    fibre, som henhører under pos. 61.01 ex B - 61.02 ex B i den fælles toldtarif
    (NIMEXE-nummer 61.01- 62, 64, 66, 72, 74, 76 - 61.02-66, 68, 72 ; kategori 6)
    har oprindelse i Philippinerne og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/787/CEE: Decisione della Commissione, del 30 agosto 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario gli indumenti esterni per uomo e per
    ragazzo, gli indumenti esterni per donna, per ragazza e per bambini: calzoncini,
    shorts e pantaloni, tessuti, per uomo e per ragazzo, pantaloni tessuti, per donna,
    per ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche o
    artificiali, delle sottovoci 61.01 ex B e 61.02 ex B della tariffa doganale comune
    (codici Nimexe: 61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72), categoria 6,
    originari delle Filippine e messi in libera pratica negli altri Stati membri (I
    testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/787/EEG: Beschikking van de Commissie van 30 augustus 1979 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd herenbovenkleding en jongensbovenkleding, damesbovenkleding,
    meisjesbovenkleding en kinderbovenkleding: shorts en andere korte broeken, lange
    broeken, geweven, voor heren en jongens; lange broeken, geweven van wol, van katoen
    of van synthetische of van kunstmatige textielvezels voor dames, meisjes en kinderen,
    van de posten 61.01 ex B en 61.02 ex B van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.01-62, 64, 66, 72, 74, 76 en 61.02-66, 68, 72) (categorie 6),
    van oorsprong uit de Filippijnen en in de overige Lid- Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
