title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 687/2008 of 18 July 2008 establishing procedures
    for the taking-over of cereals by intervention agencies or paying agencies and
    laying down methods of analysis for determining the quality of cereals (Codified
    version)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 687/2008 de la Commission du 18 juillet 2008 fixant
    les procédures de prise en charge des céréales par les organismes payeurs ou
    les organismes d’intervention ainsi que les méthodes d’analyse pour la détermination
    de la qualité (version codifiée)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 687/2008 der Kommission vom 18. Juli 2008 über das
