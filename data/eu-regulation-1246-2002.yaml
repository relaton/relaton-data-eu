title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1246/2002 of 10 July 2002 determining to
    what extent applications for the right to import for bulls, cows and heifers of
    certain Alpine and mountain breeds pursuant to Regulation (EC) No 1081/1999 can
    be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1246/2002 de la Commission du 10 juillet 2002 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n° 1081/1999 relatif à l'importation
    de taureaux, vaches et génisses de certaines races alpines et de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1246/2002 der Kommission vom 10. Juli 2002 zur Bestimmung
    des Umfangs, in dem den gemäß der Verordnung (EG) Nr. 1081/1999 gestellten Anträgen
    auf Einfuhrrechte für Stiere, Kühe und Färsen bestimmter Höhenrassen stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1246/2002 af 10. juli 2002 om det omfang,
    i hvilket der kan imødekommes ansøgninger om ret til import, som er indgivet
    under forordning (EF) nr. 1081/1999 vedrørende import af tyre, køer og kvier
    af bestemte alpine racer og bjergracer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1246/2002 της Επιτροπής,
    της 10ης Ιουλίου 2002, καθορισμού του βαθμού στον
    οποίο μπορεί να δοθεί συνέχεια στις αιτήσεις
    χορήγησης δικαιωμάτων εισαγωγής οι οποίες
    κατατίθενται βάσει του κανονισμού (ΕΚ) αριθ.
    1081/1999 σχετικά με την εισαγωγή ταύρων, αγελάδων
    και δαμάλεων ορισμένων αλπικών και ορεσίβιων
    φυλών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1246/2002, annettu 10 päivänä heinäkuuta
    2002, asetuksen (EY) N:o 1081/1999 mukaisesti jätettyjen tiettyihin alppi- ja
    vuoristorotuihin kuuluvia sonneja, lehmiä ja hiehoja koskevien tuontioikeushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1246/2002 della Commissione, del 10 luglio 2002, che
    stabilisce in che misura possono essere accolte le domande di diritti d'importazione
    presentate nel quadro del regolamento (CE) n. 1081/1999 relativo all'importazione
    di tori, vacche e giovenche di alcune razze alpine e di montagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1246/2002 van de Commissie van 10 juli 2002 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om rechten op invoer
    die zĳn ingediend op grond van Verordening (EG) nr. 1081/1999 betreffende de
    invoer van stieren, koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1246/2002 da Comissão, de 10 de Julho de 2002, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) n.° 1081/1999 relativo à importação
    de touros, de vacas e de novilhas de determinadas raças alpinas e de montanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1246/2002 de la Comisión, de 10 de julio de 2002,
    por el que se determina la medida en que pueden atenderse las solicitudes de derechos
    de importación presentadas de conformidad con el Reglamento (CE) n° 1081/1999,
    relativo a la importación de toros, vacas y novillas de determinadas razas alpinas
    y de montaña
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1246/2002 av den 10 juli 2002 om i vilken
    utsträckning godkännande kan ske av ansökningar om tullkvoter i enlighet med
    förordning (EG) nr 1081/1999 om import av tjurar, kor och kvigor av vissa alp-
    och bergraser
  type: main
