    comprovado das regras da União aplicáveis à utilização ou aos resíduos de
    substâncias farmacologicamente ativas autorizadas em medicamentos veterinários
    ou como aditivos para a alimentação animal ou das regras da União aplicáveis
    à utilização ou aos resíduos de substâncias farmacologicamente ativas proibidas
    ou não autorizadas
  type: main
