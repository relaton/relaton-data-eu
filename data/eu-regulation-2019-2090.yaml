    neskladnosti s pravili Unije, ki veljajo za uporabo ali ostanke farmakološko
    aktivnih snovi, dovoljenih v zdravilih za uporabo v veterinarskih medicini ali
    kot krmni dodatki, ali s pravili Unije, ki veljajo za uporabo ali ostanke prepovedanih
