    che integra il regolamento (UE) 2017/625 del Parlamento europeo e del Consiglio
    per quanto riguarda i casi di sospetta o accertata non conformità alle norme
    dell’Unione applicabili all’uso o ai residui di sostanze farmacologicamente
    attive autorizzate nei medicinali veterinari o come additivi per mangimi o alle
    norme dell’Unione applicabili all’uso o ai residui di sostanze farmacologicamente
    attive vietate o non autorizzate
  type: main
- language: lv
  script: Latn
