title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/2090 of 19 June 2019 supplementing
    Regulation (EU) 2017/625 of the European Parliament and Council regarding cases
    of suspected or established non-compliance with Union rules applicable to the
    use or residues of pharmacologically active substances authorised in veterinary
    medicinal products or as feed additives or with Union rules applicable to the
    use or residues of prohibited or unauthorised pharmacologically active substances
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/2090 de la Commission du 19 juin 2019 complétant
    le règlement (UE) 2017/625 du Parlement européen et du Conseil en ce qui concerne
    les cas de non-conformité, établie ou soupçonnée, aux règles de l’Union
    applicables à l’utilisation ou aux résidus de substances pharmacologiquement
    actives autorisées dans les médicaments vétérinaires ou en tant qu’additifs
    destinés à l’alimentation des animaux, ou aux règles de l’Union applicables
    à l’utilisation ou aux résidus de substances pharmacologiquement actives interdites
    ou non autorisées
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/2090 der Kommission vom 19. Juni 2019 zur
    Ergänzung der Verordnung (EU) 2017/625 des Europäischen Parlaments und des Rates
    in Bezug auf mutmaßliche oder festgestellte Verstöße gegen Unionsvorschriften
    über die Verwendung oder über Rückstände pharmakologisch wirksamer Stoffe,
    die in Tierarzneimitteln oder als Futtermittelzusatzstoffe zugelassen sind, bzw.
    gegen Unionsvorschriften über die Verwendung oder über Rückstände verbotener
    oder nicht zugelassener pharmakologisch wirksamer Stoffe
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2019/2090 на Комисията
    от 19 юни 2019 година за допълнение на Регламент
    (ЕС) 2017/625 на Европейския парламент и на Съвета
    по отношение на предполагаеми или установени
    несъответствия с правилата на Съюза, приложими
    за употребата на фармакологичноактивни субстанции
    или за остатъците от тях, разрешени във ветеринарномедицински
    продукти или като фуражни добавки, или с правилата
    на Съюза, приложими за употребата на забранени
    или неразрешени фармакологичноактивни субстанции
    или за остатъците от тях
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené Pravomoci (EU) 2019/2090 ze dne 19. června
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/625,
    pokud jde o případy podezření na nesoulad nebo zjištěného nesouladu s pravidly
    Unie pro používání nebo rezidua farmakologicky účinných látek, které
    jsou povoleny ve veterinárních léčivých přípravcích nebo jako doplňkové
    látky, nebo s pravidly Unie pro používání nebo rezidua zakázaných nebo
    nepovolených farmakologicky účinných látek
  type: main
- language: da
  script: Latn
  content: Kommissionens Delegerede Forordning (EU) 2019/2090 af 19. juni 2019 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2017/625
    for så vidt angår tilfælde af mistanke om eller konstateret manglende overholdelse
    af EU's regler vedrørende anvendelse eller restkoncentrationer af farmakologisk
    virksomme stoffer, der er tilladt i veterinærlægemidler eller som fodertilsætningsstoffer,
    eller af EU's regler vedrørende anvendelse eller restkoncentrationer af forbudte
    eller ikkegodkendte farmakologisk virksomme stoffer
  type: main
