    o prípady podozrenia na nedodržiavanie alebo zisteného nedodržiavania pravidiel
    Únie, ktoré sa vzťahujú na používanie alebo rezíduá farmakologicky účinných
    látok povolených vo veterinárnych liekoch alebo ako kŕmne doplnkové látky,
    alebo pravidiel Únie, ktoré sa vzťahujú na používanie alebo rezíduá zakázaných
    alebo nepovolených farmakologicky účinných látok
  type: main
