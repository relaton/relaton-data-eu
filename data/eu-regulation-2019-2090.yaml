  script: Latn
  content: Reglamento Delegado (UE) 2019/2090 de la Comisión de 19 de junio de 2019
    que complementa al Reglamento (UE) 2017/625 del Parlamento Europeo y del Consejo
    en lo que respecta a los casos de sospecha o constatación de incumplimiento de
    las normas de la Unión aplicables al uso de sustancias farmacológicamente activas
    autorizadas o sus residuos en medicamentos veterinarios o como aditivos de piensos
    o de las normas de la Unión aplicables al uso de sustancias farmacológicamente
    activas no autorizadas o prohibidas o sus residuos
  type: main
