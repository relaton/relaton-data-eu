    ceea ce privește cazurile de neconformitate suspectată sau confirmată cu normele
    Uniunii aplicabile utilizării sau reziduurilor substanțelor farmacologic active
    autorizate în medicamentele de uz veterinar sau ca aditivi pentru hrana animalelor
    sau cu normele Uniunii aplicabile utilizării sau reziduurilor substanțelor farmacologic
    active interzise sau neautorizate
  type: main
