    gadījumiem, kad ir aizdomas par neatbilstību vai ir konstatēta neatbilstība
    Savienības noteikumiem, kas piemērojami tādu farmakoloģiski aktīvo vielu
    lietošanai vai atliekām, kuras atļautas veterinārajās zālēs vai kā barības
    piedevas, vai Savienības noteikumiem, kas piemērojami aizliegtu vai neatļautu
    farmakoloģiski aktīvo vielu lietošanai vai atliekām
  type: main
- language: lt
  script: Latn
  content: Komisijos Deleguotasis Reglamentas (ES) 2019/2090 2019 m. birželio 19
