  script: Latn
  content: Kommissionens Delegerade Förordning (EU) 2019/2090 av den 19 juni 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
    gäller misstänkt eller konstaterad bristande efterlevnad av de unionsbestämmelser
    som är tillämpliga på användningen av eller på resthalter av farmakologiskt
    aktiva substanser som är godkända i veterinärmedicinska läkemedel eller som
    fodertillsatser eller av de unionsbestämmelser som är tillämpliga på användningen
    av eller på resthalter av förbjudna eller otillåtna farmakologiskt aktiva substanser
