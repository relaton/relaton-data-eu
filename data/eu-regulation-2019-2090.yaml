    tai jäämiin
  type: main
- language: hr
  script: Latn
  content: Delegirana Uredba Komisije (EU) 2019/2090 оd 19. lipnja 2019. o dopuni
    Uredbe (EU) 2017/625 Europskog parlamenta i Vijeća u pogledu slučajeva sumnje
    na neusklađenost ili utvrđene neusklađenosti s pravilima Unije koja se primjenjuju
    na upotrebu ili rezidue farmakološki djelatnih tvari koje su odobrene u veterinarsko-medicinskim
    proizvodima ili kao dodaci hrani za životinje ili s pravilima Unije koja se primjenjuju
