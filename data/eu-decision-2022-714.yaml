  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2022/714 της Επιτροπής
    της 5ης Μαΐου 2022 για τη χορήγηση παρέκκλισης
    που επιτρέπει στο Βέλγιο, τη Βουλγαρία, την
    Κύπρο, τη Λιθουανία, τις Κάτω Χώρες και τη Φινλανδία
    να χρησιμοποιούν μέσα ανταλλαγής και αποθήκευσης
    πληροφοριών για το Σύστημα ελέγχου εισαγωγών
    2 εκτός από τις ηλεκτρονικές τεχνικές επεξεργασίας
    δεδομένων σε σχέση με εμπορεύματα σε ταχυδρομικές
    αποστολές [κοινοποιηθείσα υπό τον αριθμό C(2022)
    2760] (Τα κείμενα στη βουλγαρική, ελληνική, γαλλική,
    λιθουανική, ολλανδική, φινλανδική και σουηδική
    γλώσσα είναι τα μόνα αυθεντικά)
  type: main
- language: et
  script: Latn
