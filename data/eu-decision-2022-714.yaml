    taikyti nukrypti leidžiančią nuostatą, pagal kurią „Importo kontrolės
    sistemai 2“ skirtos informacijos apie pašto siuntomis atsiunčiamas prekes
    mainams vykdyti ir tai informacijai saugoti leidžiama naudoti neelektronines
    duomenų apdorojimo priemones (pranešta dokumentu Nr. C(2022) 2760) (Tekstas
    autentiškas tik bulgarų, graikų, lietuvių, nyderlandų, prancūzų, suomių
    ir švedų kalbomis)
  type: main
