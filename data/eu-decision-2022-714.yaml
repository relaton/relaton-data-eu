    toukokuuta 2022, Belgialle, Bulgarialle, Kyprokselle, Liettualle, Alankomaille
    ja Suomelle myönnettävästä poikkeuksesta käyttää tuontivalvontajärjestelmää
    2 varten tehtävään postilähetyksiin sisältyviä tavaroita koskevien tietojen
    vaihtamiseen ja tallentamiseen muita menetelmiä kuin sähköisiä tietojenkäsittelymenetelmiä
    (tiedoksiannettu numerolla (2022) 2760) (Ainoastaan bulgarian-, kreikan-, ranskan-,
