    għajr tekniki elettroniċi għall-ipproċessar tad-data għall-iskambju u l-ħażna
    ta’ informazzjoni għas-Sistema ta’ Kontroll tal-Importazzjoni 2 fir-rigward
    ta’ merkanzija f’kunsinni postali (notifikata bid-dokument C(2022) 2760) (It-testi
