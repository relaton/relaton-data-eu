    Fínsku v súvislosti s tovarom v poštových zásielkach umožňuje používať
    iné prostriedky výmeny a uchovávania informácií pre systém kontroly dovozu
    2 než techniky elektronického spracovania údajov [oznámené pod číslom C(2022)
    2760] (Iba bulharské, grécke, francúzske, litovské, holandské, fínske a
    švédske znenie je autentické)
