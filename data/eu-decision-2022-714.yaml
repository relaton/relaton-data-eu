    wordt toegestaan andere middelen dan elektronische gegevensverwerkingstechnieken
    te gebruiken voor de uitwisseling en opslag van informatie voor het Invoercontrolesysteem
    2 met betrekking tot goederen in postzendingen (Kennisgeving geschied onder nummer
