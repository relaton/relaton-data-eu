title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/714 of 5 May 2022 granting a
    derogation allowing Belgium, Bulgaria, Cyprus, Lithuania, the Netherlands and
    Finland to use means other than electronic data-processing techniques for the
    exchange and storage of information for the Import Control System 2 in relation
    to goods in postal consignments (notified under document C(2022) 2760) (Only the
    Bulgarian, Greek, French, Lithuanian, Dutch, Finnish and Swedish texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/714 de la Commission du 5 mai 2022 relative
    à l’octroi d’une dérogation autorisant la Belgique, la Bulgarie, Chypre,
    la Lituanie, les Pays-Bas et la Finlande à utiliser des moyens autres que des
    procédés informatiques de traitement des données pour l’échange et le stockage
    d’informations aux fins du système de contrôle des importations 2 en ce qui
    concerne les marchandises contenues dans des envois postaux [notifiée sous le
    numéro C(2022) 2760] (Les textes en langue bulgare, grecque, française, lituanienne,
    néerlandaise, finnoise et suédoise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/714 der Kommission vom 5. Mai 2022 zur
    Gewährung einer abweichenden Regelung, die es Belgien, Bulgarien, Zypern, Litauen,
    den Niederlanden und Finnland gestattet, andere Mittel als die elektronische Datenverarbeitung
    für den Austausch und die Speicherung von Informationen für das Einfuhrkontrollsystem
    2 in Bezug auf Waren in Postsendungen zu verwenden (Bekannt gegeben unter Aktenzeichen
    C(2022) 2760) (Nur der bulgarische, griechische, französische, litauische, niederländische,
    finnische und schwedische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/714 на Комисията
    от 5 май 2022 година за предоставяне на дерогация,
    с която се разрешава на Белгия, България, Кипър,
    Литва, Нидерландия и Финландия да използват
    средства, различни от средствата за електронна
    обработка на данни, за обмена и съхранението
    на информация за системата за контрол на вноса
    2 във връзка със стоките в пощенски пратки (нотифицирано
    под номер С(2022) 2760) (само текстовете на български,
    гръцки, френски, литовски, нидерландски, фински
    и шведски език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/714 ze dne 5. května 2022, kterým
    se povoluje odchylka umožňující Belgii, Bulharsku, Kypru, Litvě, Nizozemsku
    a Finsku v souvislosti se zbožím v poštovních zásilkách používat jiný
    způsob výměny a uchovávání informací určených pro systém kontroly dovozu
    2 než metody elektronického zpracování dat (oznámeno pod číslem C(2022)
    2760) (Pouze bulharské, řecké, francouzské, litevské, nizozemské, finské
    a švédské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/714 af 5. maj 2022 om
    indrømmelse af en undtagelse, der giver Belgien, Bulgarien, Cypern, Litauen,
    Nederlandene og Finland mulighed for at anvende andre midler til udveksling og
    lagring af oplysninger i kodekssystemet til importkontrol end elektroniske databehandlingsteknikker
    i forbindelse med varer i postforsendelser (meddelt under nummer C(2022) 2760)
    (Kun den bulgarske, den græske, den franske, den litauiske, den nederlandske
