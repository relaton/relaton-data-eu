    atkāpi un atļauj informācijas apmaiņai un glabāšanai Importa kontroles sistēmā
    2 attiecībā uz precēm pasta sūtījumos izmantot citus līdzekļus, kas nav
    elektroniskās datu apstrādes metodes (izziņots ar dokumenta numuru C(2022)
    2760) (Autentisks ir tikai teksts bulgāru, franču, grieķu, lietuviešu, nīderlandiešu,
