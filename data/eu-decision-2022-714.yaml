    och Finland att använda andra metoder än elektronisk databehandlingsteknik för
    utbyte och lagring av information för importkontrollsystemet 2 avseende varor
    i postförsändelser (delgivet med nr C(2022) 2760) (Endast de bulgariska, grekiska,
