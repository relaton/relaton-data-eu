    prelucrare electronică a datelor pentru schimbul și stocarea de informații
    pentru sistemul de control al importurilor 2 în legătură cu mărfurile din
    trimiterile poștale [notificată cu numărul C(2022) 2760] (Numai textele în
    limbile bulgară, greacă, franceză, lituaniană, neerlandeză, finlandeză și
    suedeză sunt autentice)
