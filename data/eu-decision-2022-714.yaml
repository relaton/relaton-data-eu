    Lituania, los Países Bajos y Finlandia a utilizar medios distintos de las técnicas
    de tratamiento electrónico de datos para el intercambio y almacenamiento de información
    para el Sistema de Control de la Importación 2 en relación con las mercancías
    en envíos postales [notificada con el número C(2022) 2760] (Los textos en lenguas
    búlgara, griega, francesa, lituana, neerlandesa, finesa y sueca son los únicos
