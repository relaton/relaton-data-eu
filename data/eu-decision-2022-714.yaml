    küldeményekben lévő áruk tekintetében az importellenőrzési rendszer 2
    keretében történő információcserére és adattárolásra az elektronikus
    adatfeldolgozási eljárásoktól eltérő eszközök használatát lehetővé
    tevő eltérés engedélyezéséről (az értesítés a C(2022) 2760. számú
    dokumentummal történt) (Csak a bolgár, a görög, a francia, a litván, a holland,
