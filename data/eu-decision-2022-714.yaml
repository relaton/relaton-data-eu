    s katerim se Belgiji, Bolgariji, Cipru, Litvi, Nizozemski in Finski dovoli uporaba
    sredstev za izmenjavo in shranjevanje informacij za sistem nadzora uvoza 2, ki
    niso tehnike elektronske obdelave podatkov, v zvezi z blagom v poštnih pošiljkah
    (notificirano pod dokumentarno številko C(2022) 2760) (Besedilo v bolgarskem,
