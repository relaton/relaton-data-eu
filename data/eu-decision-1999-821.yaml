title:
- language: en
  script: Latn
  content: '1999/821/EC: Commission Decision of 22 November 1999 authorising Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directives 66/404/EEC and 71/161/EEC (notified
    under document number C(1999) 3793)'
  type: main
- language: fr
  script: Latn
  content: '1999/821/CE: Décision de la Commission, du 22 novembre 1999, autorisant
    les États membres à permettre temporairement la commercialisation des matériels
    forestiers de reproduction non conformes aux dispositions des directives 66/404/CEE
    et 71/161/CEE du Conseil [notifiée sous le numéro C(1999) 3793]'
  type: main
- language: de
  script: Latn
  content: '1999/821/EG: Entscheidung der Kommission vom 22. November 1999 zur Ermächtigung
