  script: Latn
  content: Commission Regulation (EC) No 951/2002 of 3 June 2002 amending Council
    Regulation (EC) No 881/2002 imposing certain specific restrictive measures directed
    against certain persons and entities associated with Usama bin Laden, the Al-Qaida
    network and the Taliban, and repealing Council Regulation (EC) No 467/2001
  type: main
- language: fr
  script: Latn
