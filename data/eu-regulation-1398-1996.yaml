    εμπορίας 1996/97, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τις τομάτες καθώς και
    το ποσό της ενίσχυσης στην παραγωγή για τα
    μεταποιημένα προϊόντα με βάση τις τομάτες
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1398/96, annettu 18 päivänä heinäkuuta 1996,
    tomaattien tuottajille maksettavan vähimmäishinnan ja tomaattijalosteiden tuotantotuen
    vahvistamisesta markkinointivuodeksi 1996/97
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1398/96 della Commissione del 18 luglio 1996 che stabilisce,
    per la campagna di commercializzazione 1996/1997, il prezzo minimo da pagare ai
    produttori di pomodori e l'importo dell'aiuto alla produzione per i prodotti trasformati
    a base di pomodoro
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1398/96 van de Commissie van 18 juli 1996 tot vaststelling,
