  content: Commission Regulation (EC) No 1398/96 of 18 July 1996 fixing for the 1996/97
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for processed tomato products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1398/96 de la Commission du 18 juillet 1996 fixant,
