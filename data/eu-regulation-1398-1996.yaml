    für Verarbeitungserzeugnisse aus Tomaten/Paradeiser im Wirtschaftsjahr 1996/97
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1398/96 af 18. juli 1996 om fastsættelse
    for produktionsåret 1996/97 af den minimumspris, der skal betales producenterne
    for tomater, samt af producentstøtten for produkter forarbejdet på basis af
    tomater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1398/96 της Επιτροπής
