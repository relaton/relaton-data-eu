id: EURegulation15361981
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1536/81 of 19 May 1981 amending, as a result
    of the accession of Greece, Regulation (EEC) No 1469/70 fixing the percentages
    and quantities of tobacco taken over by the intervention agencies and the percentage
    of Community tobacco production above which the procedure laid down in Article
    13 of Regulation (EEC) No 727/70 applies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1536/81 du Conseil, du 19 mai 1981, modifiant, à
    la suite de l' adhésion de la Grèce, le règlement (CEE) n° 1469/70 fixant
    les pourcentages et les quantités de tabac prises en charge par les organismes
    d' intervention, ainsi que le pourcentage de la production communautaire de tabac,
    dont le dépassement déclenche les procédures prévues à l' article 13 du règlement
    (CEE) n° 727/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1536/81 des Rates vom 19. Mai 1981 zur wegen des Beitritts
    Griechenlands erforderlichen Änderung der Verordnung (EWG) Nr. 1469/70 zur Festsetzung
    der Hundertsätze und Mengen des von den Interventionsstellen übernommenen Tabaks
    sowie des Hundertsatzes der gemeinschaftlichen Tabakerzeugung, deren Überschreitung
    die Verfahren nach Artikel 13 der Verordnung (EWG) Nr. 727/70 auslöst
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1536/81 af 19. maj 1981 om ændring, som
    følge af Grækenlands tiltrædelse, af forordning (EØF) nr. 1469/70 om fastsættelse
    af procentsatser og mængder af den af interventionsorganerne overtagne tobak
    samt procentsatsen af fællesskabsproduktionen af tobak, hvis overskridelse udløser
    foranstaltninger i medfør af artikel 13 i forordning (EØF) nr. 727/70
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1536/81 τού Συμβουλίου
    τής 19ης Μαΐου 1981 περί τροποποιήσεως, λόγω τής
    προσχωρήσεως τής Ελλάδος, τού κανονισμού (ΕΟΚ)
    αριθ. 1469/70 «περί καθορισμού τών ποσοστών καί
    τών ποσοτήτων καπνού πού αναλαμβάνονται από
    τούς οργανισμούς παρεμβάσεως, καθώς καί τού
    ποσοστού τής κοινοτικής παραγωγής καπνού,
    τού οποίου η υπέρβαση συνεπάγεται τή θέση σέ
    ενέργεια τών διαδικασιών πού προβλέπονται
    στό άρθρο 13 τού κανονισμού (ΕΟΚ) αριθ. 727/70»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1536/81 del Consiglio, del 19 maggio 1981, che modifica,
    in seguito all' adesione della Grecia, il regolamento (CEE) n. 1469/70 che fissa
    le percentuali e i quantitativi di tabacco presi a carico da parte degli organismi
    d' intervento, nonché la percentuale della produzione comunitaria di tabacco,
    il cui superamento è determinante per lo scatto delle procedure previste all'
    articolo 13 del regolamento (CEE) n. 727/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1536/81 van de Raad van 19 mei 1981 tot wijziging,
    in verband met de toetreding van Griekenland, van Verordening (EEG) nr. 1469/70
    houdende vaststelling van de percentages en de hoeveelheden door de interventiebureaus
    overgenomen tabak, alsmede van het percentage van de tabaksproduktie in de Gemeenschap
    bij overschrijding waarvan de in artikel 13 van Verordening (EEG) nr. 727/70 bedoelde
    procedures van toepassing worden
  type: main
