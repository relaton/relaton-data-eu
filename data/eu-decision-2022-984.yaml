  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/984 оd 22. lipnja 2022. o istovrijednosti
    regulatornog okvira Narodne Republike Kine za središnje druge ugovorne strane
    koje imaju odobrenje za obavljanje poravnanja OTC izvedenica na međubankovnom
    tržištu i koje nadzire Narodna banka Kine u odnosu na zahtjeve Uredbe (EU) br.
    648/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/984 végrehajtási határozata (2022. június 22.)
    a Kínai Népköztársaságnak a tőzsdén kívüli származtatott ügyletek bankközi
    piacon történő elszámolására engedéllyel rendelkező és a Kínai Központi
    Bank által felügyelt központi szerződő felekre vonatkozó szabályozási
    keretének a 648/2012/EU európai parlamenti és tanácsi rendelet követelményeivel
    való egyenértékűségéről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/984 della Commissione del 22 giugno 2022
    che stabilisce l’equivalenza del quadro normativo della Repubblica popolare
    cinese in materia di controparti centrali autorizzate a compensare derivati OTC
    sul mercato interbancario e soggette alla vigilanza della People’s Bank of China
    ai requisiti del regolamento (UE) n. 648/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/984 (2022. gada 22. jūnijs)
    par Ķīnas Tautas Republikas tiesiskā regulējuma, ko piemēro centrālajiem
    darījumu partneriem, kuriem ir atļauts veikt ārpusbiržas atvasināto instrumentu
    tīrvērti starpbanku tirgū un kurus uzrauga Ķīnas Tautas banka, līdzvērtību
    Eiropas Parlamenta un Padomes Regulas (ES) Nr. 648/2012 prasībām
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/984 2022 m. birželio 22 d.
    dėl Kinijos Liaudies Respublikos pagrindinėms sandorio šalims, kurioms leidimą
    atlikti ne biržos išvestinių finansinių priemonių tarpuskaitą tarpbankinėje
    rinkoje išduoda ir kurias prižiūri Kinijos liaudies bankas, taikomos reguliavimo
    sistemos lygiavertiškumo Europos Parlamento ir Tarybos reglamento (ES) Nr. 648/2012
    reikalavimams
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/984 tat-22
    ta’ Ġunju 2022 dwar l-ekwivalenza tal-qafas regolatorju tar-Repubblika tal-Poplu
    taċ-Ċina għal kontropartijiet ċentrali li huma awtorizzati jikklerjaw derivattivi
    OTC fis-suq interbankarju u taħt superviżjoni mill-Bank tal-Poplu taċ-Ċina
    għar-rekwiżiti tar-Regolament (UE) Nru 648/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/984 van de Commissie van 22 juni 2022 betreffende
    de gelijkwaardigheid van het regelgevingskader van de Volksrepubliek China voor
    centrale tegenpartijen die een vergunning hebben om otc-derivaten op de interbancaire
    markt te clearen en die onder toezicht staan van de People’s Bank of China,
    aan de vereisten van Verordening (EU) nr. 648/2012 van het Europees Parlement
    en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/984 z dnia 22 czerwca 2022 r. w sprawie
    równoważności ram regulacyjnych Chińskiej Republiki Ludowej dotyczących kontrahentów
    centralnych, którzy posiadają zezwolenie na rozliczanie na rynku międzybankowym
    instrumentów pochodnych będących przedmiotem obrotu poza rynkiem regulowanym
    i są nadzorowani przez Ludowy Bank Chin, z wymogami rozporządzenia Parlamentu
    Europejskiego i Rady (UE) nr 648/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/984 da Comissão de 22 de junho de 2022
    sobre a equivalência do quadro regulamentar da República Popular da China aplicável
    às contrapartes centrais autorizadas a compensar derivados OTC no mercado interbancário
    e supervisionadas pelo Banco Popular da China com os requisitos estabelecidos
    no Regulamento (UE) n.o 648/2012 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/984 a Comisiei din 22 iunie 2022
    privind echivalența cadrului de reglementare din Republica Populară Chineză
    aplicabil contrapărților centrale care sunt autorizate să compenseze instrumente
    financiare derivate extrabursiere pe piața interbancară și care sunt supravegheate
    de Banca Populară a Chinei cu cerințele Regulamentului (UE) nr. 648/2012 al
    Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/984 z 22. júna 2022 o rovnocennosti
    regulačného rámca Čínskej ľudovej republiky pre centrálne protistrany,
    ktorým Čínska ľudová banka udelila povolenie zúčtovávať mimoburzové
    deriváty na medzibankovom trhu a ktoré podliehajú jej dohľadu, s požiadavkami
    nariadenia Európskeho parlamentu a Rady (EÚ) č. 648/2012
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/984 z dne 22. junija 2022 o enakovrednosti
    regulativnega okvira Ljudske republike Kitajske za centralne nasprotne stranke,
    ki imajo dovoljenje za kliring izvedenih finančnih instrumentov OTC na medbančnem
    trgu in jih nadzoruje Ljudska banka Kitajske, z zahtevami iz Uredbe (EU) št.
    648/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/984 de la Comisión de 22 de junio de
    2022 sobre la equivalencia entre el marco regulador de la República Popular China
    y los requisitos del Reglamento (UE) n.o 648/2012 del Parlamento Europeo y del
    Consejo, en lo que respecta a las entidades de contrapartida central autorizadas
    a compensar derivados extrabursátiles en el mercado interbancario y supervisadas
    por el Banco Popular de China
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/984 av den 22 juni 2022 om
    likvärdighet mellan Folkrepubliken Kinas regelverk för centrala motparter, som
    auktoriserats för clearing av OTC-derivat på interbankmarknaden och som står
    under tillsyn av Kinas folkbank, och kraven i Europaparlamentets och rådets förordning
    (EU) nr 648/2012
