    og under tilsyn af People's Bank of China, og kravene i Europa-Parlamentets og
    Rådets forordning (EU) nr. 648/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/984 της Επιτροπής
    της 22ας Ιουνίου 2022 σχετικά με την ισοδυναμία
    του κανονιστικού πλαισίου της Λαϊκής Δημοκρατίας
    της Κίνας για τους κεντρικούς αντισυμβαλλομένους
    που έχουν λάβει άδεια να εκκαθαρίζουν εξωχρηματιστηριακά
