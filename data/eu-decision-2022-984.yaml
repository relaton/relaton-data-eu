title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/984 of 22 June 2022 on the equivalence
    of the regulatory framework of the People’s Republic of China for central counterparties
    that are authorised to clear OTC derivatives in the interbank market and supervised
    by the People’s Bank of China to the requirements of Regulation (EU) No 648/2012
    of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/984 de la Commission du 22 juin 2022
    relative à l’équivalence, avec les exigences du règlement (UE) no 648/2012
    du Parlement européen et du Conseil, du cadre réglementaire de la République
    populaire de Chine applicable aux contreparties centrales qui ont l’agrément
    requis pour compenser des produits dérivés de gré à gré sur le marché interbancaire
    et qui sont soumises à la surveillance de la Banque populaire de Chine
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/984 der Kommission vom 22. Juni 2022
    über die Gleichwertigkeit des Regulierungsrahmens der Volksrepublik China für
    die von der People’s Bank of China zum Clearing von OTC-Derivaten auf dem Interbankenmarkt
    zugelassenen und beaufsichtigten zentralen Gegenparteien mit den Anforderungen
    der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/984 на Комисията
    от 22 юни 2022 година относно еквивалентността
    на нормативната уредба на Китайската народна
    република на поднадзорните на Китайската народна
    банка централни контрагенти, лицензирани да
    извършват клиринг на извънборсови деривати
    на междубанковия пазар, с изискванията на Регламент
    (ЕС) № 648/2012 на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/984 ze dne 22. června 2022 o
    rovnocennosti regulačního rámce Čínské lidové republiky pro ústřední
    protistrany, které jsou oprávněny provádět clearing OTC derivátů na mezibankovním
    trhu a nad nimiž vykonává dohled Čínská lidová banka, s požadavky nařízení
    Evropského parlamentu a Rady (EU) č. 648/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/984 af 22. juni 2022
    om ækvivalens mellem Folkerepublikken Kinas reguleringsmæssige rammer for centrale
