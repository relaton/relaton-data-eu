    kesäkuuta 2022, OTC-johdannaisten määrittämiseen pankkien välisillä markkinoilla
    toimiluvan saaneita ja Kiinan keskuspankin valvomia keskusvastapuolia koskevan
    Kiinan kansantasavallan sääntelykehyksen vastaavuudesta Euroopan parlamentin
    ja neuvoston asetuksen (EU) N:o 648/2012 vaatimusten kanssa
  type: main
