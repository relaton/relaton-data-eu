    údajů poskytovaných Komisi pro účely schválení účetní závěrky záruční
    sekce EZOZF a pro účely sledování a odhadů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1769/2004 af 14. oktober 2004 om ændring
    af forordning (EF) nr. 2390/1999 om form og indhold af de regnskabsoplysninger,
    der skal forelægges for Kommissionen i forbindelse med regnskabsafslutningen
    for EUGFL, Garantisektionen, samt i forbindelse med kontrol og udarbejdelse af
    overslag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1769/2004 της Επιτροπής,
