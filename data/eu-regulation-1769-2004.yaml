    y el contenido de la información contable que deberá presentarse a la Comisión
    con vistas a la liquidación de cuentas de la sección de Garantía del FEOGA,
    así como con fines de seguimiento y elaboración de previsiones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1769/2004 av den 14 oktober 2004 om ändring
    av förordning (EG) nr 2390/1999 om fastställande av formen av och innehållet
    i den räkenskapsinformation som skall översändas till kommissionen inom ramen
    för granskning och godkännande av räkenskaperna för EUGFJ:s garantisektion
