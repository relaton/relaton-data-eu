    a Bizottság rendelkezésére bocsátandó számviteli adatok formájának és
    tartalmának megállapításáról szóló 2390/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1769/2004 della Commissione, del 14 ottobre 2004, recante
