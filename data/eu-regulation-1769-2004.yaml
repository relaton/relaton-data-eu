title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1769/2004 of 14 October 2004 amending Regulation
    (EC) No 2390/1999 laying down form and content of the accounting information to
    be submitted to the Commission for the purpose of the clearance of the EAGGF Guarantee
    Section accounts as well as for monitoring and forecasting purposes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1769/2004 de la Commission du 14 octobre 2004 modifiant
    le règlement (CE) n° 2390/1999 définissant la forme et le contenu des informations
    comptables à adresser à la Commission dans le cadre de la procédure d'apurement
    des comptes du FEOGA, section «Garantie», ainsi qu'à des fins de suivi et de
    prévisions
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1769/2004 der Kommission vom 14. Oktober 2004 zur Änderung
    der Verordnung (EG) Nr. 2390/1999 zur Festlegung von Form und Inhalt der der Kommission
    im Rahmen des Rechnungsabschlusses des EAGFL, Abteilung Garantie, sowie der Beobachtung
    und Prognose vorzulegenden Buchführungsdaten
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1769/2004 ze dne 14. říjne 2004, kterým
