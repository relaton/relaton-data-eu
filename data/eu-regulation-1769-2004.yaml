    kuri turi būti pateikta Komisijai EŽŪOGF garantijų skyriaus sąskaitoms apmokėti,
    prižiūrėti bei prognozuoti, formą ir turinį
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1769/2004 van de Commissie van 14 oktober 2004 houdende
    wijziging van Verordening (EG) nr. 2390/1999 tot vaststelling van vorm en inhoud
    van de boekhoudkundige informatie die aan de Commissie moet worden verstrekt met
    het oog op de goedkeuring van de rekeningen van het Europees Oriëntatie- en Garantiefonds
    voor de Landbouw, afdeling Garantie, alsmede ten behoeve van monitoring en het
    opstellen van prognoses
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1769/2004 z dnia 14 października 2004
    r. zmieniające rozporządzenie (WE) nr 2390/1999 ustanawiające formę i treść
    informacji rachunkowych, które należy przedłożyć Komisji dla celów rozliczania
    rachunków Sekcji Gwarancji EFOGR, jak również w celu monitorowania i prognozowania
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1769/2004 da Comissão, de 14 de Outubro de 2004,
    que altera o Regulamento (CE) n.° 2390/1999 que estabelece a forma e o conteúdo
    dos dados contabilísticos a apresentar à Comissão no âmbito do apuramento
    das contas do FEOGA, secção Garantia, e para efeitos de acompanhamento e de
    elaboração de previsões
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1769/2004 zo 14. októbra 2004, ktorým sa
    mení a dopĺňa nariadenie (ES) č. 2390/1999 o stanovení formy a obsahu účtovných
    údajov predkladaných Komisii na účely účtovnej uzávierky záručnej sekcie
    Európskeho poľnohospodárskeho usmerňovacieho a záručného fondu (EPUZF),
    ako aj na účely sledovania a prognózovania
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1769/2004 z dne 14. oktobra 2004 o spremembi
    Uredbe (ES) št. 2390/1999 o določitvi oblike in vsebine računovodskih informacij,
    ki se predložijo Komisiji za namen potrditve obračunov Jamstvenega oddelka EKUJS
    kot tudi za namene spremljanja in napovedovanja
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1769/2004 de la Comisión, de 14 de octubre de 2004,
