    τόσο για λόγους επίβλεψης όσο και πρόβλεψης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1769/2004, 14. oktoober 2004, millega muudetakse
    määrust (EÜ) nr 2390/1999, millega nähakse ette nende raamatupidamisandmete
    vorm ja sisu, mis tuleb esitada komisjonile seoses EAGGF tagatisrahastu raamatupidamisarvestuse
    kontrollimise ja heakskiitmisega ning järelevalve ja prognooside tegemiseks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1769/2004, annettu 14 päivänä lokakuuta 2004,
