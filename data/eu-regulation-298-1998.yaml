  content: COMMISSION REGULATION (EC) No 298/98 of 5 February 1998 correcting Regulation
    (EC) No 2350/97 fixing Community producer and import prices for carnations and
    roses with a view to the application of the arrangements governing imports of
    certain floricultural products originating in Cyprus, Israel, Jordan, Morocco
    and the West Bank and Gaza Strip
  type: main
- language: fr
  script: Latn
