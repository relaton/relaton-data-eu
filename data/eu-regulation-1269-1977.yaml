title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1269/77 of 14 June 1977 supplementing Article
    8 (2) of Regulation (EEC) No 3335/73 on the movement of goods obtained in the
    Community under a procedure for the suspension or drawback of customs duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1269/77 de la Commission, du 14 juin 1977, complétant
    les dispositions de l' article 8 paragraphe 2 du règlement (CEE) n° 3335/73
    relatif à la circulation des marchandises obtenues dans la Communauté sous un
    régime comportant suspension ou ristourne de droits de douane et d' autres impositions
    à l' importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1269/77 der Kommission vom 14. Juni 1977 zur Ergänzung
    von Artikel 8 Absatz 2 der Verordnung (EWG) Nr. 3335/73 über den Verkehr mit
    Waren, die in der Gemeinschaft in einem Verfahren hergestellt sind, das die Nichterhebung
    oder Rückvergütung der Zölle oder anderer Eingangsabgaben vorsieht
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1269/77 af 14. juni 1977 om tillæg
    til bestemmelserne i artikel 8, stk. 2, i Kommissionens forordning (EØF) nr.
    3335/73 om bevægeligheden af varer, som er fremstillet i Fællesskabet under
    en ordning, der indebærer suspension eller godtgørelse af told eller andre importafgifter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1269/77 della Commissione, del 14 giugno 1977, che
    completa le disposizioni dell' articolo 8, paragrafo 2, del regolamento (CEE)
    n. 3335/73, relativo alla circolazione delle merci ottenute nella Comunità sotto
    un regime recante sospensione o riduzione di dazi o di altre imposizioni all'
    importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1269/77 van de Commissie van 14 juni 1977 tot aanvulling
    van het bepaalde in artikel 8, lid 2, van Verordening (EEG) nr. 3335/73 betreffende
    het verkeer van goederen die in de Gemeenschap zijn verkregen onder een regeling
    houdende opschorting of teruggave van douanerechten of andere belastingen bij
    invoer
  type: main
