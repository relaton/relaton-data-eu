id: EUDecision1998617
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '98/617/EC: Commission Decision of 21 October 1998 denying authority to
    Italy to refuse the grant of exemption to certain products exempt from excise
    duty under Council Directive 92/83/EEC on the harmonisation of the structures
    of the excise duties on alcohol and alcoholic beverages (notified under document
    number C(1998) 3154) (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/617/CE: Décision de la Commission du 21 octobre 1998 déniant à l''Italie
    l''autorisation de refuser l''exonération pour certains produits qui sont exonérés
    des droits d''accises en vertu de la directive 92/83/CEE du Conseil concernant
    l''harmonisation des structures des droits d''accises sur l''alcool et les boissons
    alcooliques [notifiée sous le numéro C(1998) 3154] (Le texte en langue italienne
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '98/617/EG: Entscheidung der Kommission vom 21. Oktober 1998 zur Verweigerung
    der von der italienischen Regierung beantragten Ermächtigung, die Steuerbefreiung
    für bestimmte Erzeugnisse zu versagen, die gemäß der Richtlinie 92/83/EWG des
    Rates zur Harmonisierung der Struktur der Verbrauchsteuern auf Alkohol und alkoholische
    Getränke von der Verbrauchsteuer befreit sind (Bekanntgegeben unter Aktenzeichen
    K(1998) 3154) (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/617/EF: Kommissionens beslutning af 21. oktober 1998 om afvisning af
    Italiens anmodning om tilladelse til at nægte visse varer fritaget for punktafgifter
    i henhold til Rådets direktiv 92/83/EØF om harmonisering af punktafgiftsstrukturen
    for alkohol og alkoholholdige drikkevarer (meddelt under nummer K(1998) 3154)
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '98/617/ΕΚ: Απόφαση της Επιτροπής της 21ης Οκτωβρίου
    1998 με την οποία δεν επιτρέπεται στην Ιταλία
    να αρνείται τη χορήγηση απαλλαγής για ορισμένα
    προϊόντα που απαλλάσσονται από τους ειδικούς
    φόρους κατανάλωσης σύμφωνα με την οδηγία 92/83/ΕΟΚ
    του Συμβουλίου για την εναρμόνιση των διαρθρώσεων
    των ειδικών φόρων κατανάλωσης που επιβάλλονται
    στην αλκοόλη και τα αλκοολούχα ποτά [κοινοποιηθείσα
    υπό τον αριθμό Ε(1998) 3154] (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '98/617/EY: Komission päätös, tehty 21 päivänä lokakuuta 1998, jolla
    Italialta poistetaan valtuudet evätä tietyiltä tuotteilta vapautus valmisteverosta
    alkoholin ja alkoholijuomien valmisteverojen rakenteiden yhdenmukaistamisesta
    annetun neuvoston direktiivin 92/83/ETY nojalla (tiedoksiannettu numerolla K(1998)
    3154) (Ainoastaan italiankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '98/617/CE: Decisione della Commissione del 21 ottobre 1998 che nega all''Italia
    l''autorizzazione a rifiutare l''esenzione dall''accisa per determinati prodotti
    esenti dall''accisa in virtù della direttiva 92/83/CEE del Consiglio, relativa
    all''armonizzazione delle strutture delle accise sull''alcole e sulle bevande
    alcoliche [notificata con il numero C(1998) 3154] (Il testo in lingua italiana
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '98/617/EG: Beschikking van de Commissie van 21 oktober 1998 waarbij Italië
    geen toestemming wordt verleend om vrijstelling van accijns te weigeren voor bepaalde
    producten die zijn vrijgesteld van accijns uit hoofde van Richtlijn 92/83/EEG
    van de Raad betreffende de harmonisatie van de structuur van de accijns op alcohol
    en alcoholhoudende dranken (kennisgeving geschied onder nummer C(1998) 3154) (Slechts
    de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '98/617/CE: Decisão da Comissão de 21 de Outubro de 1998 que nega à
    Itália autorização para recusar a concessão de isenção em relação a determinados
    produtos isentos do imposto especial de consumo, por força da Directiva 92/83/CEE
    do Conselho, relativa à harmonização das estruturas dos impostos especiais
    sobre o consumo de álcool e bebidas alcoólicas [notificada com o número C(1998)
    3154] (Apenas faz fé o texto em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '98/617/CE: Decisión de la Comisión de 21 de octubre de 1998 por la que
    se deniega a Italia la autorización para prohibir la concesión de una exención
    a determinados productos eximidos de los impuestos especiales en virtud de la
    Directiva 92/83/CEE del Consejo relativa a la armonización de las estructuras
    de los impuestos especiales sobre el alcohol y las bebidas alcohólicas [notificada
    con el número C(1998) 3154] (El texto en lengua italiana es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '98/617/EG: Kommissionens beslut av den 21 oktober 1998 om att neka Italien
    bemyndigande att vägra att medge befrielse för vissa produkter som är befriade
    från punktskatt enligt rådets direktiv 92/83/EEG om harmonisering av strukturerna
    för punktskatter på alkohol och alkoholdrycker [delgivet med nr K(1998) 3154]
    (Endast den italienska texten är giltig)'
