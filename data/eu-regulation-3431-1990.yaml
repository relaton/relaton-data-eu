title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3431/90 of 27 November 1990 re-establishing
    the levying of the customs duties applicable to products of category No 146 a
    (order No 42.1461) originating in Mexico, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3431/90 de la Commission du 27 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 146 à (numéro d'ordre 42.1461) originaires du Mexique,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3431/90 DER KOMMISSION vom 27. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 146
    A (lfd. Nummer 42.1461) mit Ursprung in Mexiko, dem die in der Verordnung (EWG)
    Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3431/90 af 27. november 1990 om genindførelse
    af opkrævning af told for varer under varekategori 146 A (løbenummer 42.1461),
    som har oprindelse i Mexico og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3431/90 της Επιτροπής
    της 27ης Νοεμβρίου 1990 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα προϊόντα
    της κατηγορίας 146 Α ( αύξων αριθμός 42.1461 ) καταγωγής
    Μεξικού, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3431/90 DELLA COMMISSIONE del 27 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 146 A (numero d'ordine 42.1461) originari del Messico beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3431/90 VAN DE COMMISSIE van 27 november 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie nr. 146 A (volgnummer 42.1461), van oorsprong uit Mexico, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3897/89
    van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3431/90 DA COMISSAO de 27 de Novembro de 1990 que
    restabelece a cobrança dos direitos aduaneiros aplicaveis aos produtos da categoria
    n* 146 A (numero de ordem 42.1461), originarios do México, beneficiarios das
    preferências pautais previstas no Regulamento (CEE) n* 3897/89 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3431/90 DE LA COMISION de 27 de noviembre de 1990 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a los productos de la categoria no 146 A (numero de orden 420.1461), originarios
    de México, beneficiarios de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3897/89 del Consejo
