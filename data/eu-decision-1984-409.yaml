title:
- language: en
  script: Latn
  content: '84/409/EEC: Commission Decision of 21 August 1984 accepting an undertaking
    in connection with the anti-dumping proceeding concerning imports of certain angles,
    shapes and sections, of iron or steel, originating in the German Democratic Republic,
    and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/409/CEE: Décision de la Commission du 21 août 1984 portant acceptation
    d'' un engagement souscrit dans le cadre de la procédure antidumping concernant
    les importations de profilés en fer ou en acier, originaires de la République
    démocratique allemande, et portant clôture de cette procédure'
  type: main
- language: de
  script: Latn
  content: '84/409/EWG: Beschluß der Kommission vom 21. August 1984 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von bestimmten Profilen aus Stahl mit Ursprung in der Deutschen Demokratischen
    Republik und über die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '84/409/EØF: Kommissionens afgørelse af 21. august 1984 om godtagelse
    af et tilsagn i forbindelse med antidumpingproceduren vedrørende importen af
    visse profiler af jern og stål med oprindelse i Den tyske demokratiske Republik
    og om afslutning af denne procedure'
  type: main
- language: el
  script: Grek
  content: '84/409/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Αυγούστου 1984 για την αποδοχή αναλήψεων υποχρεώσεων
    που προτάθηκε σχετικά με τη διαδικασία αντιντάμπινγκ
    για εισαγωγές ορισμένων ειδών καθορισμένης
    μορφής από σίδηρο ή χάλυβα, καταγωγής Λαϊκής
    Δημοκρατίας της Γερμανίας, και την περάτωση
    της διαδικασίας αυτής'
  type: main
- language: it
  script: Latn
  content: '84/409/CEE: Decisione della Commissione del 21 agosto 1984 che accetta
    un impegno nell'' ambito della procedura antidumping relativa alle importazioni
    di alcuni tipi di profilati di ferro o di acciaio originari della Repubblica democratica
    tedesca e chiude tale procedura'
  type: main
- language: nl
  script: Latn
  content: '84/409/EEG: Besluit van de Commissie van 21 augustus 1984 tot aanvaarding
