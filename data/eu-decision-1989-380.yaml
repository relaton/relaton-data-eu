title:
- language: en
  script: Latn
  content: '89/380/EEC: Commission Decision of 16 June 1989 authorizing certain Member
    States provisionally to provide for derogations from certain provisions of Council
    Directive 77/93/EEC, in respect of plants of Pinus L. originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '89/380/CEE: Décision de la Commission du 16 juin 1989 autorisant certains
    États membres à prévoir provisoirement des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour les végétaux de Pinus L. originaires
    du Japon'
  type: main
- language: de
  script: Latn
  content: '89/380/EWG: Entscheidung der Kommission vom 16. Juni 1989 zur einstweiligen
    Ermächtigung bestimmter Mitgliedstaaten, für Pflanzen von Pinus L. mit Ursprung
    in Japan, Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates
    vorzusehen'
  type: main
- language: da
  script: Latn
  content: '89/380/EØF: Kommissionens Beslutning af 16. juni 1989 om bemyndigelse
    af visse medlemsstater til midlertidigt at undtage planter af Pinus L. med oprindelse
    i Japan fra visse bestemmelser i Rådets direktiv 77/93/EØF (89/380/EØF)'
  type: main
- language: el
  script: Grek
  content: '89/380/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Ιουνίου 1989 που επιτρέπει προσωρινά σε ορισμένα
    κράτη μέλη να προβλέπουν παρεκκλίσεις από
    ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ του
    Συμβουλίου, όσον αφορά τα φυτά του είδους Pinus
    L. προέλευσης Ιαπωνίας'
  type: main
- language: fi
  script: Latn
  content: '89/380/ETY: Komission päätös, tehty 16 päivänä kesäkuuta 1989,
    luvan antamisesta tietyille jäsenvaltioille säätää väliaikaisesti poikkeuksia
    tiettyihin neuvoston direktiivin 77/93/ETY säännöksiin Japanista peräisin
    olevien suvun Pinus L. kasvien osalta'
  type: main
- language: it
  script: Latn
  content: '89/380/CEE: Decisione della Commissione del 16 giugno 1989 che autorizza
    alcuni Stati membri a derogare provvisoriamente a determinate disposizioni della
    direttiva 77/93/CEE del Consiglio per quanto riguarda i vegetali di Pinus L. originari
    del Giappone'
  type: main
- language: nl
  script: Latn
  content: '89/380/EEG: Beschikking van de Commissie van 16 juni 1989 tot machtiging
    van bepaalde Lid-Staten om voor planten van Pinus L., van oorsprong uit Japan,
    voorlopig van sommige bepalingen van Richtlijn 77/93/EEG van de Raad afwijkingen
    toe te staan'
  type: main
- language: pt
  script: Latn
  content: '89/380/CEE: Decisão da Comissão de 16 de Junho de 1989 que autoriza
    certos Estados-membros a prever, provisoriamente, derrogações a determinadas
    normas da Directiva 77/93/CEE do Conselho, para plantas de Pinus L. originárias
    do Japão'
  type: main
- language: es
  script: Latn
  content: '89/380/CEE: Decisión de la Comisión de 16 de junio de 1989 por la que
    se autoriza a determinados Estados miembros para prever provisionalmente excepciones
    a determinadas disposiciones de la Directiva 77/93/CEE del Consejo respecto de
    los vegetales de Pinus L., originarios de Japón (89/380/CEE)'
  type: main
- language: sv
