title:
- language: en
  script: Latn
  content: '94/385/EC: Commission Decision of 8 June 1994 concerning the placing on
    the market of a product consisting of a genetically modified organism, seeds of
    herbicide- resistant tobacco variety ITB 1000 OX, pursuant to Article 13 of Council
    Directive 90/220/EEC'
  type: main
- language: fr
  script: Latn
  content: '94/385/CE: Décision de la Commission, du 8 juin 1994, concernant la mise
    sur le marché d''un produit consistant en un organisme génétiquement modifié,
    à savoir des semences de la variété de tabac ITB 1000 OX, résistant aux herbicides,
    en application de l''article 13 de la directive 90/220/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '94/385/EG: Entscheidung der Kommission vom 8. Juni 1994 über das Inverkehrbringen
