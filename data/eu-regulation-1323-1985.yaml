title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1323/85 of 20 May 1985 amending, with regard
    to certain monolithic integrated circuits falling within subheading ex 85.21 D
    II, Regulation (EEC) No 3385/84 temporarily suspending the autonomous Common Customs
    Tariff duties on a number of industrial products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1323/85 du Conseil du 20 mai 1985 modifiant, en ce
    qui concerne certains circuits intégrés monolithiques de la sous-position ex
    85.21 D II du tarif douanier commun, le règlement (CEE) no 3385/84 portant suspension
    temporaire des droits autonomes du tarif douanier commun sur un certain nombre
    de produits industriels
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1323/85 des Rates vom 20. Mai 1985 zur Änderung der
    Verordnung (EWG) Nr. 3385/84 zur zeitweiligen Aussetzung der Zollsätze des Gemeinsamen
    Zolltarifs für einige industrielle Waren hinsichtlich bestimmter monolithischer
    integrierter Schaltungen der Tarifstelle ex 85.21 D II
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1323/85 af 20. maj 1985 om ændring for så
    vidt angår visse monolitiske integrerede kredsløb henhørende under pos. ex
    85.21 D II af forordning (EØF) nr. 3385/84 om midlertidig suspension af de autonome
    satser i den fælles toldtarif for en række industrivarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1323/85 του Συμβουλίου
    της 20ής Μαΐου 1985 για την τροποποίηση, όσον αφορά
    ορισμένα ολοκληρωμένα μονολιθικά κυκλώματα
    της διάκρισης ex 85.21 Δ ΙΙ, του κανονισμού (ΕΟΚ)
    αριθ. 3385/84 περί προσωρινής αναστολής των αυτόνομων
    δασμών του Κοινού Δασμολογίου για έναν ορισμένο
    αριθμό βιομηχανικών προϊόντων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1323/85 del Consiglio del 20 maggio 1985 che modifica,
    per quanto riguarda taluni circuiti integrati monolitici della sottovoce ex 85.21
    D II, il regolamento (CEE) n. 3385/84 recante sospensione temporanea dei dazi
    autonomi della tariffa doganale comune per un certo numero di prodotti industriali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1323/85 van de Raad van 20 mei 1985 tot wijziging
    van Verordening (EEG) nr. 3385/84 houdende tijdelijke schorsing van de autonome
    rechten van het gemeenschappelijk douanetarief op een aantal industriële produkten,
    voor wat bepaalde monolitische geïntegreerde schakelingen van post ex 85.21 D
    II betreft
  type: main
