    ar kuru nosaka sīki izstrādātus noteikumus Padomes Regulas (EK) Nr. 1782/2003
    piemērošanai attiecībā uz šīs Regulas IV un IV a) sadaļā minētajām atbalsta
    shēmām un atmatā atstātas zemes izmantošanu izejvielu ražošanai
  type: main
