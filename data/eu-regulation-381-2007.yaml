title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 381/2007 of 4 April 2007 amending Regulation
    (EC) No 796/2004 laying down detailed rules for the implementation of cross-compliance,
    modulation and the integrated administration and control system provided for in
    Council Regulation (EC) No 1782/2003 establishing common rules for direct support
    schemes under the common agricultural policy and establishing certain support
    schemes for farmers and Regulation (EC) No 1973/2004 laying down detailed rules
    for the application of Council Regulation (EC) No 1782/2003 as regards the support
    schemes provided for in Titles IV and IVa of that Regulation and the use of land
    set aside for the production of raw materials
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 381/2007 de la Commission du 4 avril 2007 modifiant
    le règlement (CE) n o 796/2004 portant modalités d’application de la conditionnalité,
    de la modulation et du système intégré de gestion et de contrôle prévus par
    le règlement (CE) n o 1782/2003 du Conseil établissant des règles communes
    pour les régimes de soutien direct dans le cadre de la politique agricole commune
    et établissant certains régimes de soutien en faveur des agriculteurs et modifiant
    le règlement (CE) n o 1973/2004 portant modalités d’application du règlement
    (CE) n o 1782/2003 du Conseil en ce qui concerne les régimes d’aide prévus
    aux titres IV et IV bis dudit règlement et l’utilisation de terres mises en
    jachère pour la production de matières premières
  type: main
