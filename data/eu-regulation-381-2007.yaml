    paramos schemų pagal bendrąją žemės ūkio politiką taisykles ir nustatančiame
    tam tikras paramos schemas ūkininkams, įgyvendinimo taisykles, ir Reglamentą
    (EB) Nr. 1973/2004, nustatantį išsamias Tarybos reglamento (EB) Nr. 1782/2003
