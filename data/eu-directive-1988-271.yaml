title:
- language: en
  script: Latn
  content: Fifth Commission Directive 88/271/EEC of 5 April 1988 amending certain
    Annexes to Council Directive 77/93/EEC on protective measures against the introduction
    into the Member States of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Cinquième directive 88/271/CEE de la Commission du 5 avril 1988 modifiant
    certaines annexes de la directive 77/93/CEE du Conseil concernant les mesures
    de protection contre l'introduction dans les États membres d'organismes nuisibles
    aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Fünfte Richtlinie 88/271/EWG der Kommission vom 5. April 1988 zur Änderung
    bestimmter Anhänge der Richtlinie 77/93/EWG des Rates über Maßnahmen zum Schutz
    gegen das Verbringen von Schadorganismen der Pflanzen oder Pflanzenerzeugnisse
    in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens femte direktiv 88/271/EØF af 5. april 1988 om ændring af
    visse bilag til Rådets direktiv 77/93/EØF om foranstaltninger mod indslæbning
    i medlemsstaterne af skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Πέμπτη οδηγία 88/271/ΕΟΚ της Επιτροπής της
    5ης Απριλίου 1988 για την τροποποίηση ορισμένων
    παραρτημάτων της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    περί των μέτρων προστασίας κατά της εισαγωγής
    στα κράτη μέλη οργανισμών επιβλαβών για τα
    φυτά ή τα φυτικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission viides direktiivi 88/271/ETY, annettu 5 päivänä huhtikuuta
    1988, kasvien tai kasvituotteiden haitallisten organismien jäsenvaltioihin kulkeutumisen
    estämiseen liittyvistä suojatoimenpiteistä annetun neuvoston direktiivin 77/93/ETY
    tiettyjen liitteiden muuttamisesta
  type: main
- language: it
  script: Latn
  content: Quinta direttiva 88/271/CEE della Commissione del 5 aprile 1988 che modifica
    taluni allegati della direttiva 77/93/CEE del Consiglio concernente le misure
    di protezione contro l'introduzione negli Stati Membri di organismi nocivi ai
    vegetali o ai prodotti vegetali
  type: main
- language: nl
  script: Latn
  content: Vijfde Richtlijn 88/271/EEG van de Commissie van 5 april 1988 tot wijziging
    van enkele bijlagen bij Richtlijn 77/93/EEG van de Raad betreffende de beschermende
    maatregelen tegen het binnenbrengen op het grondgebied van de Lid-Staten van voor
    planten of voor plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Quinta Directiva 88/271/CEE da Comissão de 5 de Abril de 1988 que altera
    determinados anexos da Directiva 77/93/CEE do Conselho, relativa às medidas de
    protecção contra a introdução nos Estados-Membros de organismos prejudiciais
    às plantas e produtos vegetais
  type: main
- language: es
  script: Latn
  content: Quinta Directiva 88/271/CEE de la Comisión de 5 de abril de 1988 por la
    que se modifican determinados Anexos de la Directiva 77/93/CEE del Consejo relativa
    a las medidas de protección contra la introducción en los Estados Miembros de
    organismos nocivos para los vegetales o productos vegetales
  type: main
- language: sv
  script: Latn
  content: Kommissionens femte direktiv 88/271/EEG av den 5 april 1988 om ändring
    av bilagorna till rådets direktiv 77/93/EEG om skyddsåtgärder mot att skadegörare
    på växter eller växtprodukter förs in till medlemsstaterna
