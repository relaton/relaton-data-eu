  content: Commission Regulation (EC) No 386/97 of 28 February 1997 correcting the
    English and Swedish language versions of Regulation (EC) No 2257/94 laying down
    quality standards for bananas and the Spanish language version of Regulation (EC)
    No 2898/95 concerning verification of compliance with quality standards for bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 386/97 de la Commission du 28 février 1997 rectifiant
