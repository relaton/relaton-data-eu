---
id: EUDecision197361
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 March 1973 authorizing the French Republic not
    to apply Community treatment to knives with cutting blades, serrated or not (including
    pruning knives), except knives with handle in ivory or in gilded or silvered base
    metal falling within heading No ex 82.09 of the Common Customs Tariff, originating
    in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/61/CEE de la Commission, du 28 mars 1973, autorisant la République
    française à exclure du traitement communautaire les couteaux à lame tranchante
    ou dentelée, y compris les serpettes fermantes (à l'exception des couteaux à
    manche en ivoire ou en métaux communs dorés ou argentés), de la position Ex
    82.09 du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. März 1973, mit der die Französische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Messer mit schneidender oder gezahnter Klinge, einschließlich
    Klappmesser für den Gartenbau, (mit Ausnahme von Messern mit Griff aus Elfenbein
    oder aus vergoldetem oder versilbertem unedlem Metall) der Tarifnummer ex 82.09
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. marts 1973 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at unddrage knive, med skærende eller
    savtakket æg (herunder beskæreknive), bortset fra knive med skafter af elfenben
    eller uædelt metal, der er forgyldt eller forsølvet, som henhører under position
    ex 82.09 i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 marzo 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario coltelli a lama tranciante o
    dentata, compresi i roncoli chiudibili (eccetto i coltelli a manico d'avorio o
    di metalli comuni dorati o argentati), della voce n. ex 82.09 della tariffa doganale
    comune, originari del Giappone
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 maart 1973 waarbij de Franse Republiek
    wordt gemachtigd messen, ook indien getand, zaksnoeimessen daaronder begrepen,
    (met uitzondering van messen met heft van ivoor, verguld of verzilverd onedel
    metaal) van post ex 82.09 van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
