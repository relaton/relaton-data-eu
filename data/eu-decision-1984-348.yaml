  content: '84/348/EEC: Commission Decision of 20 June 1984 establishing that the
    apparatus described as ''Browne - Nocturnale Penile Tumescence Monitor, model
    9900 with Playback Printer, model 9800'' may not be imported free of Common Customs
    Tariff duties'
