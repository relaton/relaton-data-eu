title:
- language: en
  script: Latn
  content: '96/94/EC: Commission Decision of 12 January 1996 authorizing Sweden to
    maintain its national measures as regards infectious pancreatic necrosis and bacterial
    kidney disease in application of Article 12 (4) of Council Directive 91/67/EEC'
  type: main
- language: fr
  script: Latn
  content: '96/94/CE: Décision de la Commission, du 12 janvier 1996, autorisant la
    Suède à maintenir ses mesures nationales concernant la nécrose pancréatique
    infectieuse et la maladie bactérienne du rein en application de l''article 12
    paragraphe 4 de la directive 91/67/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '96/94/EG: Entscheidung der Kommission vom 12. Januar 1996 zur Ermächtigung
    Schwedens, gemäß Artikel 12 Absatz 4 der Richtlinie 91/67/EWG des Rates seine
    innerstaatliche Regelung in bezug auf die infektiöse Pankreasnekrose und die
    bakterielle Nierenerkrankung beizubehalten'
  type: main
- language: da
  script: Latn
  content: '96/94/EF: Kommissionens beslutning af 12. januar 1996 om bemyndigelse
