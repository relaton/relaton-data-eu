    direktiv 91/67/EØF'
  type: main
- language: el
  script: Grek
  content: '96/94/ΕΚ: Απόφαση της Επιτροπής, της 12ης Ιανουαρίου
    1996, για την έγκριση της διατήρησης από τη Σουηδία
    των εθνικών μέτρων που αφορούν τη λοιμώδη νεκρωτική
    παγκρεατίτιδα και την βακτηριακή νεφρίτιδα
    κατ’εφαρμογή του άρθρου 12 παράγραφος 4 της
    οδηγίας 91/67/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '96/94/EY: Komission päätös, tehty 12 päivänä tammikuuta 1996, luvan
