    e alla Bacterial Kidney Disease in applicazione dell''articolo 12, paragrafo 4
    della direttiva 91/67/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '96/94/EG: Beschikking van de Commissie van 12 januari 1996 waarbij Zweden
    op grond van artikel 12, lid 4, van Richtlijn 91/67/EEG van de Raad wordt gemachtigd
    om zijn nationale maatregelen in verband met infectieuze pancreatische necrose
    en Bacterial Kidney Disease te handhaven'
  type: main
- language: pt
  script: Latn
  content: '96/94/CE: Decisão da Comissão, de 12 de Janeiro de 1996, que autoriza
