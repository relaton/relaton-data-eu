title:
- language: fr
  script: Latn
  content: Décision du Conseil du 26 juillet 1966, relative à la suppression des
    droits de douane et à l'interdiction des restrictions quantitatives entre les
    États membres et à la mise en application des droits du Tarif douanier commun
    pour les produits autres que ceux énumérés à l'annexe II du Traité
  type: main
- language: de
  script: Latn
  content: '66/532/EWG: Entscheidung des Rates vom 26. Juli 1966 über die Abschaffung
    der Zölle und das Verbot der mengenmäßigen Beschränkungen zwischen den Mitgliedstaaten
    sowie über die Anwendung der Zollsätze des Gemeinsamen Zolltarifs für die in
    Anhang II des Vertrages nicht aufgeführten Erzeugnisse'
  type: main
- language: it
  script: Latn
  content: '66/532/CEE: Decisione del Consiglio del 26 luglio 1966 relativa alla soppressione
    dei dazi doganali e al divieto delle restrizioni quantitative tra gli Stati membri
    nonché all''applicazione dei dazi della tariffa doganale comune per i prodotti
    non compresi nell''allegato II del Trattato'
  type: main
- language: nl
  script: Latn
  content: '66/532/EEG: Beschikking van de Raad van 26 juli 1966 betreffende de afschaffing
    van de douanerechten en het verbod van kwantitatieve beperkingen tussen de Lid-
    Staten en het van toepassing worden van de rechten van het gemeenschappelijk douanetarief
    voor de niet in bijlage II van het Verdrag genoemde produkten'
  type: main
