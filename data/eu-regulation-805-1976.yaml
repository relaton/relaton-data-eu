title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 805/76 of 7 April 1976 re-establishing the
    levying of customs duties on women's, girls' and infants' under garments, other
    than of cotton, falling within heading No ex 61.04, originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3004/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 805/76 de la Commission, du 7 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour femmes, fillettes et jeunes enfants, autres que
    de coton, de la position tarifaire EX 61.04, originaires de la Corée du Sud bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3004/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 805/76 der Kommission vom 7. April 1976 über die
    Wiedereinführung des Zollsatzes für Unterkleidung (Leibwäsche) für Frauen,
    Mädchen und Kleinkinder, andere als aus Baumwolle, der Tarifnummer ex 61.04,
    mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3004/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 805/76 af 7. april 1976 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til kvinder, piger
    og småbørn, undtagen varer af bomuld under position ex 61.04, som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3004/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 805/76 della Commissione, del 7 aprile 1976, che ripristina
    la riscossione dei dazi doganali applicabili alle sottovesti (biancheria da dosso)
    per donna, per ragazza e per bambini, escluse quelle di cotone, della voce doganale
    ex 61.04, originarie della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3004/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 805/76 van de Commissie van 7 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op damesonderkleding,
    meisjesonderkleding en kinderonderkleding, andere dan van katoen, van post ex
    61.04, van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden
    als bedoeld bij Verordening (EEG) nr. 3004/75 van de Raad van 17 november 1975
  type: main
