    που πρέπει να ληφθούν υπόψη για τον υπολογισμό
    της αξίας των γεωργικών προϊόντων που βρίσκονται
    σε απόθεμα παρέμβασης και πρόκειται να μεταφερθούν
    στη χρήση 1986
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3375/85 della Commissione del 29 novembre 1985 che
    fissa i prezzi da prendere in considerazione per calcolare il valore dei prodotti
    agricoli giacenti all' intervento da riportare all' esercizio 1986
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3375/85 van de Commissie van 29 november 1985 houdende
    vaststelling van de prijzen die voor de berekening van de waarde van naar het
    begrotingsjaar 1986 over te boeken landbouwprodukten in interventievoorraden moeten
    worden toegepast
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3375/85 da Comissão, de 29 de Novembro de 1985,
