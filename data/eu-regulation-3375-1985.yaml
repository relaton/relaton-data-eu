    befindlichen und auf das Haushaltsjahr 1986 zu übertragenden landwirtschaftlichen
    Erzeugnisse zugrunde zu legen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3375/85 af 29. november 1985 om fastsættelse
