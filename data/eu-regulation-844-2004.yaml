    Einfuhren bestimmter aus Thailand versandter Ringbuchmechaniken, ob als Ursprungserzeugnis
    Thailands angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
