    behozataláról szóló, 119/97/EK tanácsi rendelettel bevezetett dömpingellenes
    intézkedések Thaiföldön feladott egyes gyűrűsfűzős irattartó-szerkezetek
    behozatalával – függetlenül attól, hogy azokat Thaiföldről származónak
