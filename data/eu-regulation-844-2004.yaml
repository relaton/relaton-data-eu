title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 844/2004 of 28 April 2004 initiating an investigation
    concerning the possible circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 119/97 on imports of certain ring binder mechanisms originating
    in the People's Republic of China by imports of certain ring binder mechanisms
    consigned from Thailand, whether declared as originating in Thailand or not and
    making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 844/2004 de la Commission du 28 avril 2004 portant
    ouverture d'une enquête sur le contournement possible des mesures antidumping
    instituées par le règlement (CE) n° 119/97 du Conseil sur les importations
    de certains mécanismes pour reliure à anneaux originaires de la République
    populaire de Chine par des importations de certains mécanismes pour reliure à
    anneaux expédiés de Thaïlande, qu'ils aient ou non été déclarés originaires
    de ce pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
