id: EUDecision1980349
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/349/EEC: Commission Decision of 3 March 1980 authorizing the United
    Kingdom not to apply Community treatment to men''s and boys''woven suits (including
    coordinate suits consisting of two or three pieces, which are ordered, packed,
    consigned and normally sold together), of wool, of cotton or of man-made textile
    fibres, excluding ski suits, falling within heading No ex 61.01 of the Common
    Customs Tariff (category 16), originating in Bulgaria and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/349/CEE: Décision de la Commission, du 3 mars 1980, autorisant le
    Royaume-Uni à exclure du traitement communautaire les costumes et complets, tissés
    (y compris les ensembles qui se composent de deux ou trois pièces qui sont commandées,
    conditionnées, transportées et normalement vendues ensemble), de laine, de coton
    ou de fibres textiles synthétiques ou artificielles, à l''exception des vêtements
    de ski, de la position ex 61.01 du tarif douanier commun (catégorie 16), originaires
    de Bulgarie et mis en libre pratique dans les autres Etats membres (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/349/EWG: Entscheidung der Kommission vom 3. März 1980, mit der das
    Vereinigte Königreich ermächtigt wird, aus Bulgarien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Anzüge und Kombinationen, ausgenommen
    Skianzüge, aus Geweben, für Männer und Knaben (einschließlich der aus zwei
    oder drei Teilen bestehenden Kombinationen, die zusammen bestellt, aufgemacht
    und befördert und normalerweise zusammen verkauft werden), aus Wolle, Baumwolle
    oder synthetischen oder künstlichen Spinnstoffen, der Tarifnummer ex 61.01 des
    Gemeinsamen Zolltarifs, Kategorie 16, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/349/EØF: Kommissionens beslutning af 3. marts 1980 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage jakkesæt,
    vævede til mænd og drenge (herunder sæt, der består af to eller tre stykker,
    der bestilles, emballeres, transporteres og normalt sælges sammen), af uld, bomuld
    eller kemofibre, eksklusiv skisæt, som henhører under pos. ex 61.01 i den fælles
    toldtarif (kategori 16), har oprindelse i Bulgarien og frit kan omsættes i de
    øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/349/CEE: Decisione della Commissione, del 3 marzo 1980, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i vestiti completi, tessuti,
    per uomo e per ragazzo (compresi i completi composti di due o tre pezzi ordinati,
    preparati, trasportati e normalmente venduti insieme), di lana, di cotone o di
    fibre tessili sintetiche o artificiali, esclusi quelli da sci, della voce ex 61.01
    della tariffa doganale comune, categoria 16, originari della Bulgaria e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/349/EEG: Beschikking van de Commissie van 3 maart 1980 waarbij het
    Verenigd Koninkrijk wordt gemachtigd kostuums, geweven, voor heren en jongens
    (daaronder begrepen kostuums welke uit twee of drie delen bestaan, welke gewoonlijk
    te zamen worden besteld, verpakt, vervoerd en verkocht), van wol, van katoen of
    van synthetische of van kunstmatige textielvezels, met uitzondering van skikleding,
    van post ex 61.01 van het gemeenschappelijk douanetarief (categorie 16), van oorsprong
    uit Bulgarije en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse taal
    is authentiek)'
  type: main
