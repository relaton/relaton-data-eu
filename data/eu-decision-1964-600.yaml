title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 octobre 1964, relative aux méthodes
    de coopération administrative pour l'application du régime intracommunautaire
    à certains produits relevant du règlement n° 14/64/CEE portant établissement
    graduel d'une organisation commune des marchés dans le secteur de la viande bovine
    ainsi qu'à la circulation des marchandises obtenues à partir desdits produits
    dans les circonstances visées à l'article 10 paragraphe 2 deuxième alinéa
    du Traité
  type: main
- language: de
  script: Latn
  content: '64/600/EWG: Entscheidung der Kommission vom 28. Oktober 1964 über die
    Methoden der Zusammenarbeit der Verwaltungen zur Anwendung der Gemeinschaftsbehandlung
    auf bestimmte Waren, die unter die Verordnung Nr. 14/64/ EWG über die schrittweise
    Errichtung einer gemeinsamen Marktorganisation für Rindfleisch fallen, sowie
    über den Verkehr mit Waren, die unter den in Artikel 10 Absatz (2) zweiter Unterabsatz
    des Vertrages genannten Voraussetzungen aus diesen Erzeugnissen hergestellt werden'
  type: main
- language: it
  script: Latn
  content: '64/600/CEE: Decisione della Commissione, del 28 ottobre 1964, relativa
    ai metodi di cooperazione amministrativa per l''applicazione del regime intracomunitario
    sia a taluni prodotti considerati dal regolamento n. 14/64/CEE, relativo alla
    graduale attuazione di un''organizzazione comune dei mercati nel settore delle
    carni bovine, sia alla circolazione delle merci ottenute a partire da altri prodotti
    nelle circostanze previste all''articolo 10, paragrafo 2, secondo comma, del Trattato'
  type: main
- language: nl
  script: Latn
  content: '64/600/EEG: Beschikking van de Commissie van 28 oktober 1964 betreffende
    methoden van administratieve samenwerking inzake de toepassing van de intracommunautaire
    regeling op bepaalde produkten die vallen onder Verordening Nr. 14/64/EEG houdende
    de geleidelijke totstandbrenging van een gemeenschappelijke ordening der markten
    in de sector rundvlees, alsmede op het verkeer van goederen die onder de in artikel
    10, lid 2, tweede alinea, van het Verdrag bedoelde voorwaarden zijn verkregen
    uit genoemde produkten'
  type: main
