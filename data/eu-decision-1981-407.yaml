    1981 περί τής έκτης παρατάσεως τής συμβάσεως
    περί εμπορίας τού σίτου τού 1971 καί περί τής
    πρώτης παρατάσεως τής συμβάσεως περί επισιτιστικής
    βοήθειας τού 1980, οι οποίες αποτελούν τή διεθνή
    συμφωνία σίτου τού 1971, καθώς καί περί τής καταθέσεως
    δηλώσεως προσωρινής εφαρμογής τών εν λόγω
