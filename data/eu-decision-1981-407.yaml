title:
- language: en
  script: Latn
  content: '81/407/EEC: Council Decision of 12 May 1981 on the signing of the Protocols,
    1981, for the sixth extension of the Wheat Trade Convention, 1971, and for the
    first extension of the Food Aid Convention, 1980, constituting the International
    Wheat Agreement, 1971, and the deposit of a declaration of provisional application
    of the said Protocols'
  type: main
- language: fr
  script: Latn
  content: '81/407/CEE: Décision du Conseil, du 12 mai 1981, concernant la signature
    des protocoles de 1981 portant sixième prorogation de la convention sur le commerce
    du blé de 1971 et portant première prorogation de la convention relative à
    l'' aide alimentaire de 1980, constituant l'' accord international sur le blé
    de 1971, ainsi que le dépôt d'' une déclaration d'' application provisoire
    desdits protocoles'
  type: main
- language: de
  script: Latn
  content: '81/407/EWG: Beschluß des Rates vom 12. Mai 1981 über die Unterzeichnung
    der Protokolle von 1981 zur sechsten Verlängerung des Weizenhandels-Übereinkommens
    von 1971 und zur ersten Verlängerung des Nahrungsmittelhilfe-Übereinkommens
    von 1980, welche die Internationale Weizen-Übereinkunft von 1971 bilden, und
    über die Hinterlegung einer Erklärung über die vorläufige Anwendung dieser
    Protokolle'
  type: main
- language: da
  script: Latn
  content: '81/407/EØF: Rådets afgørelse af 12. maj 1981 om undertegnelse af protokollerne
    af 1981 om den sjette forlængelse af konventionen om hvedemel af 1971 og den
    første forlængelse af konventionen om fødevarehjælp af 1980, der udgør den
    internationale hvedeoverenskomst af 1971, samt om deponering af en erklæring
    om midlertidig anvendelse af disse protokoller'
  type: main
- language: el
  script: Grek
  content: '81/407/ΕΟΚ: Απόφαση τού Συμβουλίου τής 12ης
