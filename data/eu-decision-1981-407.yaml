  type: main
- language: it
  script: Latn
  content: '81/407/CEE: Decisione del Consiglio, del 12 maggio 1981, sulla firma dei
    protocolli del 1981 recanti sesta proroga della convenzione sul commercio del
    grano del 1971 e prima proroga della convenzione relativa all'' aiuto alimentare
    del 1980, che costituiscono l'' accordo internazionale sul grano del 1971, nonché
    sul deposito di una dichiarazione di applicazione provvisoria di detti protocolli'
  type: main
- language: nl
  script: Latn
  content: '81/407/EEG: Besluit van de Raad van 12 mei 1981 inzake de ondertekening
    van de Protocollen van 1981 houdende zesde verlenging van het Tarwehandelsverdrag
    van 1971, en houdende eerste verlenging van het Voedselhulpverdrag van 1980, welke
    te zamen de Internationale Tarweovereenkomst van 1971 vormen, alsmede inzake de
    nederlegging van een verklaring van voorlopige toepassing van deze Protocollen'
