title:
- language: en
  script: Latn
  content: '81/761/EEC: Commission Decision of 27 August 1981 authorizing Ireland
    not to apply Community treatment to woven breeches, shorts and trousers (including
    slacks) originating in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/761/CEE: Décision de la Commission, du 27 août 1981, autorisant l''Irlande
    à exclure du traitement communautaire les culottes, "shorts" et pantalons tissés,
    originaires de Hong-kong (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/761/EWG: Entscheidung der Kommission vom 27. August 1981 zur Ermächtigung
    Irlands, aus Hongkong stammende Shorts und andere kurze Hosen und lange Hosen,
    aus Geweben, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/761/EØF: Kommissionens beslutning af 27. august 1981 om bemyndigelse
