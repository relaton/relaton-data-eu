id: EUDecision1989165
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '89/165/EEC: Commission Decision of 22 February 1989 recognizing that the
    United Kingdom applies to heat- treated milk intended for direct home consumption
    the microbiological standards laid down for step 2 in Directive 85/397/EEC'
  type: main
- language: fr
  script: Latn
  content: '89/165/CEE: Décision de la Commission du 22 février 1989 reconnaissant
    que le Royaume-Uni applique pour le lait traité thermiquement destiné à sa
    consommation nationale directe les normes microbiologiques prescrites pour la
    deuxième étape par la directive 85/397/CEE'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 22. Februar 1989 mit der anerkannt wird,
    dass das Vereinigte Koenigreich die in der Richtlinie 85/397/EWG fuer die Stufe
    2 vorgeschriebenen mikrobiologischen Normen auf die fuer seinen unmittelbaren
    inlaendischen Verbrauch bestimmte waermebehandelte Milch anwendet (89/165/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 22. februar 1989 om godkendelse af, at Det
    Forenede Kongerige for varmebehandlet maelk til direkte konsum paa hjemmemarkedet
    anvender de ved Raadets direktiv 85/397/EOEF for anden etape foreskrevne mikrobiologiske
    normer (89/165/EOEF)
  type: main
- language: el
  script: Grek
  content: '89/165/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Φεβρουαρίου 1989 με την οποία αναγνωρίζεται
    ότι το Ηνωμένο Βασίλειο εφαρμόζει για το θερμικά
    επεξεργασμένο γάλα που προορίζεται για άμεση
    εθνική κατανάλωση τις μικροβιολογικές προδιαγραφές
    που προβλέπονται για τη δεύτερη φάση στην οδηγία
    85/397/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '89/165/ETY: Komission päätös, tehty 22 päivänä helmikuuta 1989,
    sen tunnustamisesta, että Yhdistynyt kuningaskunta soveltaa direktiivissä 85/397/ETY
    2 vaihetta varten säädettyjä mikrobiologisia vaatimuksia suoraan kotimaan kulutukseen
    tarkoitettuun lämpökäsiteltyyn maitoon'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 22 febbraio 1989 con cui si riconosce che
    il Regno Unito applica, per il latte trattato termicamente destinato al consumo
    nazionale diretto, le norme microbiologiche prescritte per la fase 2 della direttiva
    85/397/CEE del Consiglio (89/165/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 22 februari 1989 waarbij wordt erkend
    dat het Verenigd Koninkrijk voor warmtebehandelde melk die voor directe binnenlandse
    consumptie is bestemd, de bij Richtlijn 85/397/EEG van de Raad voor etappe 2 voorgeschreven
    microbiologische normen toepast (89/165/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 22 de Fevereiro de 1989 que reconhece que o Reino
    Unido aplica ao leite tratado termicamente destinado a consumo nacional directo
    as normas microbiologicas prescritas para a segunda fase pela Directiva 85/397/CEE
    (89/165/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 22 de febrero de 1989 por la que se reconoce
    que el Reino Unido aplicara a la leche tratada térmicamente, destinada a su consumo
    nacional directo, las normas microbiologicas prescritas para la segunda etapa
    en la Directiva 85/397/CEE del Consejo (89/165/CEE)
  type: main
- language: sv
  script: Latn
  content: '89/165/EEG: Kommissionens beslut av den 22 februari 1989 om godkännande
    av att Storbritannien tillämpar de mikrobiologiska normer som fastställs för
    etapp 2 i direktiv 85/397/EEG på värmebehandlad mjölk'
  type: main
