title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1956/90 of 9 July 1990 amending for the
    second time of Regulation (EEC) No 1314/89 Regulation (EEC) No authorizing Greece
    not to apply in certain areas the areas provided for in Council Regulation (EEC)
    No 1442/88 as regards the granting of permanent abandonment premiums in respect
    of wine- growing areas for the 1989/90 to 1995/96 wine years
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1956/90 de la Commission du 9 juillet 1990 modifiant
    pour la deuxième fois le règlement (CEE) n 1314/89 autorisant la Grèce à ne
    pas appliquer dans certaines zones les mesures prévues au règlement (CEE) n
    1442/88 du Conseil, relatif à l'octroi de primes d'abandon définitif de superficies
    viticoles pour les campagnes viticoles 1989/1990 à 1995/1996
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1956/90 DER KOMMISSION vom 9. Juli 1990 zur Aenderung
    der Verordnung (EWG) Nr. 1314/89 zur Ermaechtigung Griechenlands, in bestimmten
    Gebieten die mit der Verordnung (EWG) Nr. 1442/88 des Rates ueber die Gewaehrung
    von Praemien zur endgueltigen Aufgabe von Rebflaechen vorgesehenen Massnahmen
    in den Weinwirtschaftsjahren 1989/90 bis 1995/96 nicht anzuwenden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1956/90 af 9. juli 1990 om anden ændring
    af forordning (EØF) nr. 1314/89 om bemyndigelse af Grækenland til i visse zoner
    ikke at anvende foranstaltningerne i forordning (EØF) nr. 1442/88 om ydelse for
    produktionsårene 1989/90 til 1995/96 af præmier for endelig nedlæggelse af
    vinarealer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1956/90 της Επιτροπής
    της 9ης Ιουλίου 1990 για την τροποποίηση για δεύτερη
    φορά του κανονισμού (ΕΟΚ) αριθ. 1314/89 που εξουσιοδοτεί
    την Ελλάδα να μην εφαρμόσει σε ορισμένες ζώνες
    τα μέτρα που προβλέπονται στον κανονισμό (ΕΟΚ)
    αριθ. 1442/88 του Συμβουλίου σχετικά με τη χορήγηση
    πριμοδοτήσεων για την οριστική εγκατάλειψη
    των αμπελουργικών εκτάσεων για τις αμπελουργικές
    περιόδους 1989/90 έως 1995/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1956/90, annettu 9 päivänä heinäkuuta 1990,
    luvan antamisesta Kreikalle olla soveltamatta tietyillä vyöhykkeillä lopullista
    viininviljelyaloista luopumista koskevan palkkion myöntämisestä viinivuosiksi
    1989/1990-1995/1996 annetussa neuvoston asetuksessa (ETY) N:o 1442/88 säädettyjä
    toimenpiteitä annetun asetuksen (ETY) N:o 1314/89 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1956/90 DELLA COMMISSIONE del 9 luglio 1990 recante
    seconda modifica del regolamento (CEE) n. 1314/89 che autorizza la Grecia a non
    applicare in alcune zone le misure di cui al regolamento (CEE) n. 1442/88 del
    Consiglio relativo alla concessione, per le campagne viticole 1989/1990 - 1995/1996,
    di premi di abbandono definitivo di superfici viticole
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1956/90 VAN DE COMMISSIE van 9 juli 1990 tot wijziging
    van Verordening (EEG) nr. 1314/89 waarbij Griekenland wordt gemachtigd in bepaalde
    gebieden de maatregelen als bedoeld in Verordening (EEG) nr. 1442/88 van de Raad
    inzake de toekenning van premies voor definitieve stopzetting van de wijnbouw
    op wijnbouwareaal in de wijnoogstjaren 1989/1990 tot en met 1995/1996 niet toe
    te passen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1956/90 DA COMISSAO de 9 de Julho de 1990 que altera,
    pela segunda vez, o Regulamento (CEE) n* 1314/89 que autoriza a Grécia a nao
    aplicar, em certas zonas, as medidas previstas no Regulamento (CEE) n* 1442/88
    do Conselho, relativo à concessao, para as campanhas viticolas de 1989/1990 a
    1995/1996, de prémios de abandono definitivo de superficies viticolas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1956/90 DE LA COMISION de 9 de julio de 1990 por el
    que se modifica por segunda vez el Reglamento (CEE) no 1314/89 por el que se autoriza
    a Grecia para no aplicar en algunas zonas las medidas establecidas en el Reglamento
    (CEE) no 1442/88 del Consejo sobre la concesion, para las campanas vitivinicolas
    de 1989/90 a 1995/96, de primas por abandono definitivo de superficies viticolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1956/90 av den 9 juli 1990 om ändring
    för andra gången av förordning (EEG) nr 1314/89 om bemyndigande för Grekland
    att inom vissa områden inte tillämpa de åtgärder som föreskrivs i förordning
