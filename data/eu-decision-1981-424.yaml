    Γαλλική Δημοκρατία νά εξαιρέσει από τήν κοινοτική
    μεταχείριση τά πλεκτά πουκάμισα καί πουκαμισάκια
    ανδρών καί παίδων, καταγωγής Ινδίας καί Ταϊβάν
