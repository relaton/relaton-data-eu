  content: '81/424/CEE: Decisione della Commissione, del 14 aprile 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario camicie e camicette,
    tessute, per uomo e per ragazzo, originarie dell''India e di Taiwan (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
