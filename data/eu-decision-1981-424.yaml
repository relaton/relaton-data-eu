title:
- language: en
  script: Latn
  content: '81/424/EEC: Commission Decision of 14 April 1981 authorizing the French
    Republic not to apply Community treatment to men''s and boys''woven shirts originating
    in India and Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/424/CEE: Décision de la Commission, du 14 avril 1981, autorisant la
    République française à exclure du traitement communautaire les chemises et
    chemisettes tissées, pour hommes et garçonnets, originaires de l''Inde et de
    T''ai-wan (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/424/EWG: Entscheidung der Kommission vom 14. April 1981 zur Ermächtigung
    der Französischen Republik, aus Indien und Taiwan stammende Oberhemden, auch
    Sport- und Arbeitshemden, aus Geweben, für Männer und Knaben von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/424/EØF: Kommissionens beslutning af 14. april 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter) til mænd og drenge med oprindelse i Indien
    og Taiwan (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/424/ΕΟΚ: Απόφαση τής Επιτροπής τής 14ης
