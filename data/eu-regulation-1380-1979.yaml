title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1380/79 of 2 July 1979 re-establishing the
    levying of customs duties on illuminating glassware, etc., other, falling within
    subheading 70.14 A II and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1380/79 de la Commission, du 2 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d' éclairage, etc., autre, de la sous-position 70.14 A II du tarif douanier commun,
    originaire de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1380/79 der Kommission vom 2. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, usw., andere, der Tarifstelle
    70.14 A II, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1380/79 af 2. juli 1979 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, etc., andre, under
    underposition 70.14 A II, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1380/79 della Commissione, del 2 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    ecc., altri, della sottovoce 70.14 A II della tariffa doganale comune, originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1380/79 van de Commissie van 2 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op verlichtingsartikelen,
    enz., andere, van post 70.14 A II, van oorsprong uit Joegoslavië, ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
