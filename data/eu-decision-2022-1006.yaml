title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1006 of 24 June 2022 on the
    unresolved objections regarding the terms and conditions of the authorisation
    of the biocidal product family Alphachloralose Pasta referred by France and Sweden
    in accordance with Regulation (EU) No 528/2012 of the European Parliament and
    of the Council (notified under document C(2022) 4226)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1006 de la Commission du 24 juin 2022
