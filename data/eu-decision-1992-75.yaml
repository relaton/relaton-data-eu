    Grèce, le Portugal et la France au cours de l''année 1992 pour assurer le respect
    du régime communautaire de conservation et de gestion des ressources de pêche
    (Les textes en langues espagnole, allemande, grecque, française et portugaise
    sont les seuls faisant foi)'
