- language: en
  script: Latn
  content: '92/75/EEC: Commission Decision of 16 December 1991 on the eligibility
    of expenditure to be incurred in 1992 by Germany, Spain, Greece, Portugal and
    France for the purpose of ensuring compliance with the Community system for the
    conservation and management of fishery resources (Only the Spanish, German, Greek,
    French and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/75/CEE: Décision de la Commission, du 16 décembre 1991, relative
