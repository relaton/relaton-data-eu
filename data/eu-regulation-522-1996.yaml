title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 522/96 of 26 March 1996 amending Commission
    Regulation (EEC) No 94/92 laying down detailed rules for implementing the arrangements
    for imports from third countries provided for in Regulation (EEC) No 2092/91 and
    amending Commission Regulation (EC) No 529/95 deferring for imports from certain
    third countries the date of application of Article 11 (1) of Regulation (EEC)
    No 2092/91 on organic production of agricultural products and indications referring
    thereto on agricultural products and feedstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 522/96 de la Commission, du 26 mars 1996, modifiant
    le règlement (CEE) n° 94/92 établissant les modalités d'application du régime
    d'importation de pays tiers prévu au règlement (CEE) n° 2092/91 et modifiant
    le règlement (CE) n° 529/95, prorogeant le délai de mise en application de
    l'article 11 paragraphe 1 du règlement (CEE) n° 2092/91 concernant le mode de
    production biologique de produits agricoles et sa présentation sur les produits
    agricoles et les denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 522/96 der Kommission vom 26. März 1996 zur Änderung
    der Verordnung (EWG) Nr. 94/92 mit Durchführungsbestimmungen zur Regelung der
    Einfuhren aus Drittländern gemäß der Verordnung (EWG) Nr. 2092/91 über den
    ökologischen Landbau und die entsprechende Kennzeichnung der landwirtschaftlichen
    Erzeugnisse und Lebensmittel sowie zur Änderung der Verordnung (EG) Nr. 529/95
    zur Verschiebung der Anwendung von Artikel 11 Absatz 1 der Verordnung (EWG) Nr.
    2092/91 auf die Einfuhren aus bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 522/96 af 26. marts 1996 om ændring
    af forordning (EØF) nr. 94/92 om nærmere regler for indførsel fra tredjelande
    som omhandlet i forordning (EØF) nr. 2092/91 og om ændring af forordning (EF)
    nr. 529/95 om udskydelse, for så vidt angår indførsler fra visse tredjelande,
    af fristen for anvendelsen af artikel 11, stk. 1, i forordning (EØF) nr. 2092/91
    om økologisk produktionsmetode for landbrugsprodukter og om angivelse heraf på
    landbrugsprodukter og levnedsmidler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 522/96 της Επιτροπής,
    της 26ης Μαρτίου 1996, για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 94/92 σχετικά με τη θέσπιση λεπτομερών
    κανόνων για την εφαρμογή του καθεστώτος εισαγωγών
    από τρίτες χώρες, οι οποίες προβλέπονται στον
    κανονισμό (ΕΟΚ) αριθ. 2092/91, και για τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 529/95 σχετικά με την
    παράταση της ημερομηνίας ενάρξεως της ισχύος
    του άρθρου 11 παράγραφος 1 του κανονισμού (ΕΟΚ)
    αριθ. 2092/91 όσον αφορά το βιολογικό τρόπο παραγωγής
    γεωργικών προϊόντων και τις σχετικές ενδείξεις
    επί των γεωργικών προϊόντων και τροφίμων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 522/96, annettu 26 päivänä maaliskuuta 1996,
    maataloustuotteiden luonnonmukaisesta tuotantotavasta ja siihen viittaavista merkinnöistä
    maataloustuotteissa ja elintarvikkeissa annetussa neuvoston asetuksessa (ETY)
    N:o 2092/91 säädetyn tuontia kolmansista maista koskevan järjestelmän yksityiskohtaisista
    soveltamissäännöistä annetun asetuksen (ETY) N:o 94/92 muuttamisesta ja asetuksen
    (ETY) N:o 2092/91 11 artiklan 1 kohdan täytäntöönpanoa koskevan määräajan
    jatkamisesta tietyistä kolmansista maista tapahtuvan tuonnin osalta asetuksen
    (EY) N:o 529/95 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 522/96 della Commissione, del 26 marzo 1996, che modifica
    il regolamento (CEE) n. 94/92, che stabilisce modalità d'applicazione del regime
    d'importazione dai paesi terzi previsto dal regolamento (CEE) n. 2092/91, nonché
    il regolamento (CE) n. 529/95, che rinvia, per quanto riguarda le importazioni
    da determinati paesi terzi, la data di applicazione dell'articolo 11, paragrafo
    1 del regolamento (CEE) n. 2092/91 relativo al metodo di produzione biologico
    di prodotti agricoli e all'indicazione di tale metodo sui prodotti agricoli e
    sulle derrate alimentari
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 522/96 van de Commissie van 26 maart 1996 houdende
    wijziging van Verordening (EEG) nr. 94/92 tot vaststelling van nadere bepalingen
    inzake de regeling voor de invoer uit derde landen, als bedoeld in Verordening
    (EEG) nr. 2092/91 van de Raad inzake de biologische produktiemethode en aanduidingen
    dienaangaande op landbouwprodukten en levensmiddelen, en wijziging van Verordening
    (EG) nr. 529/95 houdende verlenging van de termijn na afloop waarvan artikel 11,
    lid 1, van Verordening (EEG) nr. 2092/91 moet worden toegepast op de invoer uit
    bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 522/96 da Comissão, de 26 de Março de 1996, que
    altera o Regulamento (CEE) nº 94/92, que estatui as regras do regime de importação
    de países terceiros previsto no Regulamento (CEE) nº 2092/91 relativo ao modo
    de produção biológico de produtos agrícolas e à sua indicação nos produtos
    agrícolas e nos géneros alimentícios, e o Regulamento (CE) nº 529/95, que
    adia a aplicação do nº 1 do artigo 11º do Regulamento (CEE) nº 2092/91 no
    que se refere às importações de certos países
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 522/96 de la Comisión, de 26 de marzo de 1996, que
    modifica el Reglamento (CEE) nº 94/92 por el que se establecen las disposiciones
    de aplicación del régimen de importaciones de países terceros contemplado en
    el Reglamento (CEE) nº 2092/91, y en el Reglamento (CE) nº 529/95, por el que
    se prorroga con respecto a las importaciones procedentes de determinados países
    terceros el plazo para la aplicación del apartado 1 del artículo 11 del Reglamento
    (CEE) nº 2092/91 sobre la producción agrícola ecológica y su indicación en
    los productos agrarios y alimenticios
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 522/96 av den 26 mars 1996 om ändring
    av förordning (EEG) nr 94/92 om genomförande av den ordning för import från
    tredje land som föreskrivs i förordning (EEG) nr 2092/91 och om ändring av
    förordning (EG) nr 529/95 om uppskjutande av tillämpningen av artikel 11.1 i
    förordning (EEG) nr 2092/91 om ekologisk produktion av jordbruksprodukter och
    uppgifter därom på jordbruksprodukter och livsmedel vad gäller införsel från
    vissa tredje länder
  type: main
