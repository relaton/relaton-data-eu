title:
- language: en
  script: Latn
  content: '89/283/EEC: Commission Decision of 13 April 1989 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of certain types of footwear
    originating in the People''s Republic of China (only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/283/CEE: Décision de la Commission du 13 avril 1989 autorisant le
    Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de certaines chaussures originaires de la République populaire de Chine (Le texte
    en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 13. April 1989 zur Ermächtigung des Vereinigten
    Königreichs, die Einfuhren bestimmter Schuhe mit Ursprung in der Volksrepublik
    China einer innergemeinschaftlichen Überwachung zu unterwerfen (Nur der englische
    Text ist verbindlich) (89/283/EWG) #'
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 13. april 1989 om bemyndigelse af Det Forenede
    Kongerige til at indføre tilsyn inden for Fællesskabet med indførslen af visse
    typer fodtøj med oprindelse i Den Kinesiske Folkerepublik (Kun den engelske udgave
    er autentisk) (89/283/EØF)
  type: main
- language: el
  script: Grek
  content: '89/283/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Απριλίου 1989 που εξουσιοδοτεί το Ηνωμένο Βασίλειο
    να θεσπίσει ενδοκοινοτική επιτήρηση όσον αφορά
    τις εισαγωγές ορισμένων υποδημάτων καταγωγής
    Λαϊκής Δημοκρατίας της Κίνας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 13 aprile 1989 che autorizza il Regno
    Unito ad istituire una sorveglianza intracomunitaria delle importazioni di talune
    calzature originarie della Repubblica popolare cinese (Il testo in lingua inglese
    è il solo facente fede) (89/283/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 13 april 1989 houdende machtiging van
    het Verenigd Koninkrijk tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van bepaald schoeisel van oorsprong uit de Volksrepubliek
    China (Slechts de tekst in de Engelse taal is authentiek) (89/283/EEG) #'
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 13 de Abril de 1989 que autoriza o Reino Unido a
    proceder a uma vigilância intracomunitaria das importaçoes de certos sapatos
    originarios da Republica Popular da China
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 13 de abril de 1989 por la que se autoriza
    al Reino Unido a establecer medidas de vigilancia intracomunitaria en relación
    con las importaciones de determinado calzado originario de la República Popular
    de China (El texto en lengua inglesa es el único auténtico) (89/283/CEE) #'
