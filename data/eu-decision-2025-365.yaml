    veiligheid in het westelijke deel van de Indische Oceaan en in de Rode Zee (EUNAVFOR
    Atalanta) en tot intrekking van Besluit (GBVB) 2024/2983 (EUNAVFOR ATALANTA/1/2025)
  type: main
