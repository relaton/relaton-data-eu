  content: Political and Security Committee Decision (CFSP) 2025/365 of 18 February
    2025 on the appointment of the EU Force Commander for the European Union military
    operation to contribute to maritime security in the West Indian Ocean and in the
    Red Sea (EUNAVFOR ATALANTA) and repealing Decision (CFSP) 2024/2983 (EUNAVFOR
    ATALANTA/1/2025)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2025/365 du Comité politique et de sécurité du 18 février
    2025 portant nomination du commandant de la force de l’UE pour l’opération
    militaire de l’Union européenne en vue d’une contribution à la sûreté
    maritime dans l’ouest de l’océan Indien et en mer Rouge (EUNAVFOR ATALANTA)
    et abrogeant la décision (PESC) 2024/2983 (EUNAVFOR ATALANTA/1/2025)
  type: main
