    febbraio 2025, relativa alla nomina del comandante della forza dell’UE per l’operazione
    militare dell’Unione europea volta a contribuire alla sicurezza marittima nell’Oceano
    Indiano occidentale e nel Mar Rosso (EUNAVFOR ATALANTA) e che abroga la decisione
    (PESC) 2024/2983 (EUNAVFOR ATALANTA/1/2025)
  type: main
- language: lv
  script: Latn
  content: Politikas un drošības komitejas Lēmums (KĀDP) 2025/365 (2025. gada
    18. februāris), ar ko ieceļ ES spēku komandieri Eiropas Savienības militārajai
    operācijai ar mērķi veicināt jūras drošību Indijas okeāna rietumdaļā
    un Sarkanajā jūrā (EUNAVFOR ATALANTA) un atceļ Lēmumu (KĀDP) 2024/2983 (EUNAVFOR
    ATALANTA/1/2025)
  type: main
- language: lt
  script: Latn
