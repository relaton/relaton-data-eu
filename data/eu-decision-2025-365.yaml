    laivybos saugumo vakarinėje Indijos vandenyno dalyje ir Raudonojoje jūroje (EUNAVFOR
    ATALANTA), ES pajėgų vado skyrimo, kuriuo panaikinamas Sprendimas (BUSP) 2024/2983
    (EUNAVFOR ATALANTA/1/2025)
  type: main
- language: mt
  script: Latn
