title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3055/86 of 6 October 1986 re-establishing
    the levying of customs duties on diodes, transistors and similar semiconductor
    devices, light-emitting diodes, electronic micro-circuits and parts, falling within
    subheading 85.21 D, E, originating in Brazil, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3055/86 de la Commission du 6 octobre 1986 portant
    rétablissement de la perception des droits de douane applicables aux diodes,
    transistors et dispositifs similaires à semi-conducteurs; diodes émettrices
    de lumière; microstructures électroniques et parties et pièces détachées
    des sous-positions 85.21 D et 85.21 E du tarif douanier commun, originaires du
    Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3055/86 der Kommission vom 6. Oktober 1986 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter, Leuchtdioden,
    elektronische Mikroschaltungen und Teile der Tarifstelle 85.21 D und E des Gemeinsamen
    Zolltarifs, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3599/85
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3055/86 af 6. oktober 1986 om genindførelse
