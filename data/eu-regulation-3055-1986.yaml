  content: Regolamento (CEE) n. 3055/86 della Commissione del 6 ottobre 1986 che ripristina
    la riscossione dei dazi doganali applicabili ai diodi, transistori e simili dispositivi
    semiconduttori; diodi emettitori di luce; microstrutture elettroniche e parti
    e pezzi staccati, delle sottovoci 85.21 D e 85.21 E della tariffa doganale comune,
    originari del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3055/86 van de Commissie van 6 oktober 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen; luminescentiedioden; elektronische microstructuren
