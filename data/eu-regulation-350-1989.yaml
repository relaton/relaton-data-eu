  content: Commission Regulation (EEC) No 350/89 of 13 February 1989 laying down transitional
    measures for the 1988/89 marketing year regarding production aid for olive oil
    in Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 350/89 de la Commission du 13 février 1989 prévoyant
    des mesures transitoires pour la campagne 1988/1989 concernant l'aide à la production
    d'huile d'olive en Espagne et au Portugal
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 350/89 DER KOMMISSION vom 13. Februar 1989 mit Übergangsmaßnahmen
    für das Wirtschaftsjahr 1988/89 hinsichtlich der Beihilfe für die Erzeugung
    von Olivenöl in Spanien und Portugal #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 350/89 af 13. februar 1989 om fastsættelse
    af overgangsforanstaltninger for produktionsåret 1988/89 for ydelse af støtte
    til produktion af olivenolie i Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 350/89 της Επιτροπής
    της 13ης Φεβρουαρίου 1989 που προβλέπει μεταβατικά
    μέτρα για την περίοδο 1988/89 όσον αφορά την ενίσχυση
    στην παραγωγή ελαιολάδου στην Ισπανία και
    στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 350/89 DELLA COMMISSIONE del 13 febbraio 1989 che
    stabilisce misure transitorie per la campagna 1988/1989 in materia di aiuto alla
    produzione di olio d'' oliva in Spagna e in Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 350/89 VAN DE COMMISSIE van 13 februari 1989 houdende
    overgangsmaatregelen inzake de toekenning van produktiesteun voor olijfolie in
    Spanje en Portugal voor het verkoopseizoen 1988/1989 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 350/89 DA COMISSÃO de 13 de Fevereiro de 1989 que
    estabelece medidas transitórias, para a campanha de 1988/1989, relativas à ajuda
    à produção de azeite em Espanha e Portugal #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 350/89 DE LA COMISIÓN de 13 de febrero de 1989 por
    el que se establecen las medidas transitorias para la campaña 1988/89 relativas
    a la ayuda a la producción de aceite de oliva en España y en Portugal #'
