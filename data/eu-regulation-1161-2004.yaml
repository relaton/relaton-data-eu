  script: Latn
  content: Commission Regulation (EC) No 1161/2004 of 24 June 2004 determining the
    extent to which applications lodged in June 2004 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 July 2004 to 30 September 2004 can be accepted
  type: main
- language: fr
  script: Latn
