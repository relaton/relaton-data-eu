title:
- language: en
  script: Latn
  content: '2001/664/EC: Commission Decision of 16 August 2001 amending Decision 96/301/EC
    authorising Member States temporarily to take emergency measures against the dissemination
    of Pseudomonas solanacearum (Smith) Smith as regards Egypt (notified under document
    number C(2001) 2542)'
  type: main
- language: fr
  script: Latn
  content: '2001/664/CE: Décision de la Commission du 16 août 2001 modifiant la
    décision 96/301/CE autorisant les États membres à prendre provisoirement des
    mesures d''urgence en vue de se protéger contre la propagation de Pseudomonas
    solanacearum (Smith) Smith en provenance d''Égypte [notifiée sous le numéro
    C(2001) 2542]'
  type: main
- language: de
  script: Latn
  content: '2001/664/EG: Entscheidung der Kommission vom 16. August 2001 zur Änderung
    der Entscheidung 96/301/EG zur befristeten Ermächtigung der Mitgliedstaaten,
    gegen die Ausbreitung von Pseudomonas solanacearum (Smith) Smith gegenüber Ägypten
    zusätzliche Maßnahmen zu treffen (Bekannt gegeben unter Aktenzeichen K(2001)
    2542)'
  type: main
- language: da
  script: Latn
  content: '2001/664/EF: Kommissionens beslutning af 16. august 2001 om ændring af
    beslutning 96/301/EF om bemyndigelse af medlemsstaterne til midlertidigt at træffe
    hasteforanstaltninger mod spredning af Pseudomonas solanacearum (Smith) Smith
    for så vidt angår Egypten (meddelt under nummer K(2001) 2542)'
  type: main
- language: el
  script: Grek
  content: '2001/664/ΕΚ: Απόφαση της Επιτροπής, της 16ης
    Αυγούστου 2001, για τροποποίηση της απόφασης
    96/301/ΕΚ με την οποία επιτρέπεται προσωρινά στα
    κράτη μέλη να λάβουν κατεπείγοντα μέτρα κατά
    της εξάπλωσης της Pseudomonas solanacearum (Smith) Smith όσον
    αφορά την Αίγυπτο [κοινοποιηθείσα υπό τον αριθμό
    Ε(2001) 2542]'
  type: main
- language: fi
  script: Latn
  content: '2001/664/EY: Komission päätös, tehty 16 päivänä elokuuta 2001, luvan
    antamisesta jäsenvaltioille toteuttaa väliaikaisesti Egyptiä koskevia kiireellisiä
    toimenpiteitä Pseudomonas solanacearum (Smith) Smith -taudinaiheuttajan leviämisen
    estämiseksi tehdyn päätöksen 96/301/EY muuttamisesta (tiedoksiannettu numerolla
    K(2001) 2542)'
  type: main
- language: it
  script: Latn
  content: '2001/664/CE: Decisione della Commissione, del 16 agosto 2001, recante
    modifica della decisione 96/301/CE che autorizza gli Stati membri ad adottare,
    a titolo provvisorio, misure d''emergenza contro la propagazione di Pseudomonas
    solanacearum (Smith) Smith per quanto riguarda l''Egitto [notificata con il numero
    C(2001) 2542]'
  type: main
- language: nl
  script: Latn
  content: '2001/664/EG: Beschikking van de Commissie van 16 augustus 2001 houdende
    wĳziging van Beschikking 96/301/EG en machtiging van de lidstaten om ten aanzien
    van Egypte tĳdelĳk aanvullende maatregelen te nemen tegen de verspreiding van
    Pseudomonas solanacearum (Smith) Smith (kennisgeving geschied onder nummer C(2001)
    2542)'
  type: main
- language: pt
  script: Latn
  content: '2001/664/CE: Decisão da Comissão, de 16 de Agosto de 2001, que altera
    a Decisão 96/301/CE que autoriza os Estados-Membros a adoptar provisoriamente
    medidas adicionais contra a propagação de Pseudomonas solanacearum (Smith) Smith
    no que respeita ao Egipto [notificada com o número C(2001) 2542]'
  type: main
- language: es
  script: Latn
  content: '2001/664/CE: Decisión de la Comisión, de 16 de agosto de 2001, que modifica
