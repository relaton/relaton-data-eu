  script: Latn
  content: 21st Commission Directive 97/45/EC of 14 July 1997 adapting to technical
    progress Annexes II, III, VI and VII to Council Directive 76/768/EEC on the approximation
    of the laws of the Member States relating to cosmetic products
  type: main
- language: fr
  script: Latn
