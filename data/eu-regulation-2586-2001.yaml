title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2586/2001 of 19 December 2001 amending Regulation
    (EC) No 2820/98 applying a multiannual scheme of generalised tariff preferences
    for the period 1 July 1999 to 31 December 2001 so as to include Senegal in the
    list of countries enjoying the special support arrangement for the least developed
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2586/2001 du Conseil du 19 décembre 2001 modifiant
    le règlement (CE) n° 2820/98 portant application d'un schéma pluriannuel de
    préférences tarifaires généralisées pour la période du 1er juillet 1999
    au 31 décembre 2001, afin d'inclure le Sénégal dans la liste des pays bénéficiant
    du dispositif spécifique d'aide en faveur des pays les moins avancés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2586/2001 des Rates vom 19. Dezember 2001 zur Änderung
    der Verordnung (EG) Nr. 2820/98 über ein Mehrjahresschema allgemeiner Zollpräferenzen
    für den Zeitraum vom 1. Juli 1999 bis 31. Dezember 2001, zwecks Aufnahme Senegals
    in die Liste der Länder, die Sonderregelungen zur Unterstützung der am wenigsten
    entwickelten Länder in Anspruch nehmen können
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2586/2001 af 19. december 2001 om ændring
    af forordning (EF) nr. 2820/98 om anvendelse af et flerårigt arrangement med
    generelle toldpræferencer for perioden 1. juli 1999 til 31. december 2001 med
    henblik på at medtage Senegal i listen over lande, der nyder fordel af den særlige
    støtteordning for de mindst udviklede lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2586/2001 του Συμβουλίου,
    της 19ης Δεκεμβρίου 2001, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 2820/98 για την εφαρμογή
    πολυετούς συστήματος γενικευμένων δασμολογικών
    προτιμήσεων για την περίοδο από την 1η Ιουλίου
    1999 έως τις 31 Δεκεμβρίου 2001 ώστε να συμπεριληφθεί
    η Σενεγάλη στον κατάλογο χωρών που επωφελούνται
    από το πρόγραμμα ειδικής στήριξης για τις λιγότερο
    ανεπτυγμένες χώρες
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2586/2001, annettu 19 päivänä joulukuuta 2001,
    monivuotisen yleisen tullietuusjärjestelmän soveltamisesta 1 päivästä heinäkuuta
    1999 alkaen 31 päivään joulukuuta 2001 annetun asetuksen (EY) N:o 2820/98 muuttamisesta
    lisäämällä Senegal erityisen tukijärjestelyn piiriin kuuluvien vähiten kehittyneiden
    maiden luetteloon
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2586/2001 del Consiglio, del 19 dicembre 2001, che
    modifica il regolamento (CE) n. 2820/98, relativo all'applicazione di uno schema
    pluriennale di preferenze tariffarie generalizzate per il periodo 1° luglio 1999
    — 31 dicembre 2001, onde aggiungere il Senegal all'elenco dei paesi che beneficiano
    del regime speciale di sostegno ai paesi meno progrediti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2586/2001 van de Raad van 19 december 2001 tot wĳziging
    van Verordening (EG) nr. 2820/98 houdende toepassing, voor de periode van 1 juli
    1999 tot en met 31 december 2001, van een meerjarenschema van algemene tariefpreferenties,
    teneinde Senegal op te nemen in de lĳst van landen die in aanmerking komen voor
    de bĳzondere steunregeling voor de minst ontwikkelde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2586/2001 do Conselho, de 19 de Dezembro de 2001,
    que altera o Regulamento (CE) n.° 2820/98 relativo à aplicação de um sistema
    plurianual de preferências pautais generalizadas durante o período compreendido
    entre 1 de Julho de 1999 e 31 de Dezembro de 2001, com vista a incluir o Senegal
    na lista dos países beneficiários do dispositivo de apoio especial aos países
    menos avançados
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2586/2001 del Consejo, de 19 de diciembre de 2001,
    por el que se modifica el Reglamento (CE) n° 2820/98 relativo a la aplicación
    de un plan plurianual de preferencias arancelarias generalizadas durante el período
    comprendido entre el 1 de julio de 1999 y el 31 de diciembre de 2001, con el fin
    de incluir a Senegal en la lista de los países que se benefician de un régimen
    especial de apoyo a los países menos avanzados
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2586/2001 av den 19 december 2001 om ändring
    av förordning (EG) nr 2820/98 om tillämpning av en flerårig ordning med allmänna
    tullförmåner under tiden 1 juli 1999–31 december 2001 i syfte att föra upp
    Senegal på förteckningen över länder som omfattas av den särskilda stödordningen
    för de minst utvecklade länderna
  type: main
