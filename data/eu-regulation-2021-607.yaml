title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/607 of 14 April 2021 imposing
    a definitive anti-dumping duty on imports of citric acid originating in the People’s
    Republic of China as extended to imports of citric acid consigned from Malaysia,
    whether declared as originating in Malaysia or not, following an expiry review
    pursuant to Article 11(2) of Regulation (EU) 2016/1036 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/607 de la Commission du 14 avril 2021
    instituant un droit antidumping définitif sur les importations d’acide citrique
    originaire de la République populaire de Chine, tel qu’étendu aux importations
    d’acide citrique expédié de Malaisie, qu’il ait ou non été déclaré originaire
    de ce pays, à l’issue d’un réexamen au titre de l’expiration des mesures
    effectué conformément à l’article 11, paragraphe 2, du règlement (UE) 2016/1036
    du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/607 der Kommission vom 14. April 2021
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren von Zitronensäure
    mit Ursprung in der Volksrepublik China, ausgeweitet auf Einfuhren von aus Malaysia
    versandter Zitronensäure, ob als Ursprungserzeugnis Malaysias angemeldet oder
    nicht, im Anschluss an eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der
    Verordnung (EU) 2016/1036 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
