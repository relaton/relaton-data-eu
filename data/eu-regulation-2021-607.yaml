  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/607 av den 14 april 2021
    om införande av en slutgiltig antidumpningstull på import av citronsyra med
    ursprung i Folkrepubliken Kina, som utvidgats till att även omfatta import av
    citronsyra som avsänts från Malaysia, oavsett om produkternas deklarerade ursprung
    är Malaysia eller inte, till följd av en översyn vid giltighetstidens utgång
    enligt artikel 11.2 i Europaparlamentets och rådets förordning (EU) 2016/1036
