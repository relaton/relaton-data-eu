title:
- language: en
  script: Latn
  content: '84/465/EEC: Commission Decision of 26 September 1984 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of asbestos-cement
    corrugated sheets originating in Czechoslovakia and the German Democratic Republic
    and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/465/CEE: Décision de la Commission du 26 septembre 1984 portant acceptation
    d'' engagements souscrits dans le cadre de la procédure antidumping concernant
    les importations de plaques ondulées en amiante-ciment originaires de la République
    démocratique allemande et de Tchécoslovaquie et portant clôture de la procédure'
  type: main
- language: de
  script: Latn
  content: '84/465/EWG: Beschluß der Kommission vom 26. September 1984 über die
    Annahme von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die
    Einfuhren von Asbestzement-Wellplatten mit Ursprung in der Tschechoslowakei und
    der Deutschen Demokratischen Republik und über die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '84/465/EØF: Kommissionens afgørelse af 26. september 1984 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende importen af bølgeplader
    af asbestcement med oprindelse i Tjekkoslovakiet og Den tyske demokratiske Republik
    og om afslutning af denne procedure'
  type: main
- language: el
  script: Grek
  content: '84/465/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Σεπτεμβρίου 1984 για την αποδοχή αναλήψεων υποχρεώσεων
    που έχουν αναληφθεί όσον αφορά τη διαδικασία
    αντιντάμπινγκ σχετικά με τις εισαγωγές πλακών
    με κυματισμούς από τσιμέντο—αμίαντο καταγωγής
    Τσεχοσλοβακίας και Λαϊκής Δημοκρατίας της
    Γερμανίας και για την περάτωση της διαδικασίας
    αυτής'
  type: main
- language: it
  script: Latn
  content: '84/465/CEE: Decisione della Commissione del 26 settembre 1984 che accetta
    impegni assunti nell'' ambito della procedura antidumping relativa alle importazioni
    di lastre ondulate di amianto-cemento originarie della Cecoslovacchia e della
    Repubblica democratica tedesca e conclude la procedura stessa'
  type: main
- language: nl
  script: Latn
  content: '84/465/EEG: Besluit van de Commissie van 26 september 1984 tot aanvaarding
    van de in verband met de anti-dumpingprocedure betreffende de invoer van gegolfde
    platen van asbestcement, van oorsprong uit Tsjechoslowakije en uit de Duitse Democratische
    Republiek, aangeboden verbintenissen en tot beëindiging van die procedure'
