title:
- language: en
  script: Latn
  content: '79/778/EEC: Commission Decision of 28 August 1979 on the granting by the
    Guidance Section of the EAGGF to Ireland of a payment on account in respect of
    expenditure incurred during 1978 on aids for the less-favoured farming areas (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/778/CEE: Décision de la Commission, du 28 août 1979, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à l''Irlande d''un acompte sur les dépenses effectuées
    pendant l''année 1978 pour les aides en faveur des zones agricoles défavorisées
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/778/EWG: Entscheidung der Kommission vom 28. August 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 in benachteiligten landwirtschaftlichen Gebieten gewährten Hilfen an Irland
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/778/EØF: Kommissionens beslutning af 28. august 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til Irland af et acontobeløb for de udgifter,
    som er afholdt i løbet af året 1978 til støtte til ugunstigt stillede landbrugsområder
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/778/CEE: Decisione della Commissione, del 28 agosto 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, all''Irlanda di un anticipo
    sulle spese effettuate durante il 1978 per gli aiuti in favore delle zone agricole
    svantaggiate (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/778/EEG: Beschikking van de Commissie van 28 augustus 1979 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan Ierland van een voorschot
    in verband met de in 1978 verrichte uitgaven voor steun aan probleemgebieden in
    de landbouw (Slechts de tekst in de Engelse taal is authentiek)'
