    and Turkey as regards the amendment of Decision No 1/98 of the EC-Turkey Association
    Council on the trade regime for agricultural products by replacing Protocol 3
    thereto concerning the definition of the concept of ‘originating products’
    and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/3208 du Conseil du 5 décembre 2024 relative à la
