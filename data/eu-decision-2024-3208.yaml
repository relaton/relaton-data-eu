    institué par l’accord établissant une association entre la Communauté économique
    européenne et la Turquie, en ce qui concerne la modification de la décision
    n° 1/98 du Conseil d’association CE-Turquie concernant le régime de commerce
    pour les produits agricoles par le remplacement de son protocole n° 3 relatif
    à la définition de la notion de «produits originaires» et aux méthodes de
    coopération administrative
  type: main
