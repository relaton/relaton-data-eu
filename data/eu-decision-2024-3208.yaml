    Assoziationsrat hinsichtlich der Änderung des Beschlusses Nr. 1/98 des Assoziationsrates
    EG-Türkei über die Handelsregelung für Agrarerzeugnisse durch Ersetzung des
    Protokolls 3 über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung in“
