    uz emisijas palīgstratēģijām (AES), piekļuvi transportlīdzekļa OBD informācijai
    un transportlīdzekļa remonta un tehniskās apkopes informācijai, emisiju mērīšanu
    auksta motora iedarbināšanas periodos un pārnēsājamu emisiju mērīšanas
    sistēmu (PEMS) izmantošanu, lai mērītu daļiņu skaitu
  type: main
- language: lt
