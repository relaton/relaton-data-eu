    għall-Kontroll tal-Emissjonijiet (AES), l-aċċess għall-informazzjoni tal-OBD
    tal-vettura u għall-informazzjoni dwar it-tiswija u l-manutenzjoni tal-vettura,
    il-kejl tal-emissjonijiet matul il-perjodi ta’ startjar b’magna kiesħa u
    l-użu ta’ sistemi portabbli għall-kejl tal-emissjonijiet (PEMS) biex jitkejlu
    n-numri ta’ partikuli, fir-rigward ta’ vetturi heavy duty
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2019/1939 van de Commissie van 7 november 2019 tot wijziging
    van Verordening (EU) nr. 582/2011 wat betreft aanvullende emissiestrategieën
    (AES), de toegang tot OBD-informatie en reparatie- en onderhoudsinformatie van
    voertuigen, de meting van de emissies tijdens koudestartperioden van de motor
    en het gebruik van draagbare emissiemeetsystemen (PEMS) voor het meten van deeltjesaantallen,
    met betrekking tot zware bedrijfsvoertuigen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2019/1939 z dnia 7 listopada 2019 r. zmieniające
    rozporządzenie (UE) nr 582/2011 w odniesieniu do pomocniczych strategii emisji
    (AES), dostępu do informacji z OBD pojazdu oraz informacji dotyczących naprawy
    i obsługi technicznej pojazdów, pomiaru emisji w okresach rozruchu zimnego silnika
    oraz użytkowania przenośnych systemów pomiaru emisji (PEMS) na potrzeby pomiaru
    liczby cząstek stałych odnośnie do pojazdów ciężkich
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2019/1939 da Comissão de 7 de novembro de 2019 que altera
    o Regulamento (UE) n.o 582/2011 no que se refere às estratégias auxiliares em
    matéria de emissões (AES), ao acesso às informações do sistema OBD dos veículos
    e às informações relativas à reparação e manutenção de veículos, à medição
    das emissões durante os períodos de arranque do motor a frio e à utilização
    de sistemas portáteis de medição de emissões (PEMS) para medir o número de
    partículas, no que diz respeito aos veículos pesados
  type: main
