  script: Latn
  content: Regulamentul (UE) 2019/1939 al Comisiei din 7 noiembrie 2019 de modificare
    a Regulamentului (UE) nr. 582/2011 în ceea ce privește strategiile auxiliare
    privind emisiile (AES), accesul la informațiile referitoare la sistemele OBD
    ale vehiculelor și la cele referitoare la repararea și întreținerea vehiculelor,
    măsurarea emisiilor în timpul perioadelor de pornire la rece a motorului și
    utilizarea sistemelor portabile de măsurare a emisiilor (PEMS) pentru măsurarea
    numărului de particule în cazul vehiculelor grele
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2019/1939 zo 7. novembra 2019, ktorým sa mení
    nariadenie (EÚ) č. 582/2011, pokiaľ ide o pomocné emisné stratégie (AES),
    prístup k informáciám o systéme OBD vo vozidle a o opravách a údržbe vozidla,
    meranie emisií pri studenom štarte motora a použitie prenosných systémov
    na meranie emisií (PEMS) na meranie počtu častíc, s ohľadom na ťažké úžitkové
    vozidlá
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2019/1939 z dne 7. novembra 2019 o spremembi Uredbe
    (EU) št. 582/2011 glede pomožnih strategij za uravnavanje emisij, dostopa do
    informacij o vgrajeni napravi za diagnostiko ter popravilu in vzdrževanju vozila,
    merjenja emisij v času zagona hladnega motorja ter uporabe prenosnih sistemov
    za merjenje emisij za merjenje števila delcev pri težkih vozilih
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2019/1939 de la Comisión de 7 de noviembre de 2019 por
    el que se modifica el Reglamento (UE) n.o 582/2011 en lo que respecta a las estrategias
    auxiliares de emisiones (AES), el acceso a la información sobre el sistema de
    diagnóstica a bordo (DAB) y a la información sobre la reparación y el mantenimiento
    del vehículo, la medición de las emisiones durante los períodos de arranque
    en frío del motor y el uso de sistemas portátiles de medición de emisiones
    (PEMS) para medir el número de partículas, con respecto a los vehículos pesados
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2019/1939 av den 7 november 2019 om ändring
    av förordning (EU) nr 582/2011 vad gäller hjälpstrategier för avgasrening,
    tillgång till information om OBD och information om reparation och underhåll
    av fordonet, mätning av utsläpp under perioder med kall motorstart samt användning
    av ombordsystem för utsläppsmätning (PEMS) för att mäta partikelantal, med
    avseende på tunga fordon
