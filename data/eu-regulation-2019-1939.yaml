    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2019/1939 della Commissione del 7 novembre 2019 che modifica
    il regolamento (UE) n. 582/2011 per quanto riguarda le strategie ausiliarie di
    controllo delle emissioni (AES), l’accesso alle informazioni OBD del veicolo
    e alle informazioni sulla riparazione e la manutenzione del veicolo, la misurazione
    delle emissioni nelle fasi di avviamento a freddo del motore e l’uso di sistemi
    portatili di misura delle emissioni (PEMS) per misurare il numero di particelle,
    in relazione ai veicoli pesanti
  type: main
- language: lv
  script: Latn
