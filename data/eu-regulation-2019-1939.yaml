title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2019/1939 of 7 November 2019 amending Regulation
    (EU) No 582/2011 as regards Auxiliary Emission Strategies (AES), access to vehicle
    OBD information and vehicle repair and maintenance information, measurement of
    emissions during cold engine start periods and use of portable emissions measurement
    systems (PEMS) to measure particle numbers, with respect to heavy duty vehicles
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2019/1939 de la Commission du 7 novembre 2019 modifiant
    le règlement (UE) no 582/2011 en en ce qui concerne les stratégies auxiliaires
    de limitation des émissions (AES), l’accès aux informations du système OBD
    des véhicules et aux informations sur la réparation et l’entretien des véhicules,
    la mesure des émissions pendant les périodes de démarrage du moteur à froid
    et l’utilisation de systèmes portables de mesure des émissions (PEMS) pour
    mesurer le nombre de particules, pour les véhicules lourds
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2019/1939 der Kommission vom 7. November 2019 zur Änderung
    der Verordnung (EU) Nr. 582/2011 hinsichtlich zusätzlicher Emissionsstrategien,
    des Zugangs zu Fahrzeug-OBD-Informationen und zu Fahrzeugreparatur- und -wartungsinformationen,
    der Messung von Emissionen in Kaltstartphasen und der Verwendung transportabler
    Emissionsmesseinrichtungen (PEMS) zur Messung der Partikelzahl in Bezug auf schwere
    Nutzfahrzeuge
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2019/1939 на Комисията от 7 ноември
    2019 година за изменение на Регламент (ЕС) № 582/2011
    във връзка със спомагателните стратегии за
    контрол на емисиите (AES), достъпа до информацията
    от БД на превозните средства и информацията
    за ремонта и техническото обслужване на превозните
    средства, измерването на емисиите в периоди
    на пускане при студен двигател и използването
    на преносими системи за измерване на емисиите
    (PEMS) за измерване на броя на частиците, по отношение
    на тежките превозни средства
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2019/1939 ze dne 7. listopadu 2019, kterým se
    mění nařízení (EU) č. 582/2011, pokud jde o pomocné strategie pro emise
    (AES), přístup k informacím palubního diagnostického systému vozidla a k
    informacím o opravách a údržbě vozidla, měření emisí v době startu studeného
    motoru a používání přenosných systémů pro měření emisí (PEMS) za účelem
    měření počtu částic u těžkých nákladních vozidel
  type: main
