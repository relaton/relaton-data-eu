  script: Latn
  content: Uredba Komisije (EU) 2019/1939 оd 7. studenoga 2019. o izmjeni Uredbe
    (EU) br. 582/2011 u pogledu pomoćnih strategija za ograničenje emisija (AES),
    pristupanja informacijama o OBD sustavu vozila i informacijama za popravak i održavanje
    vozila, mjerenja emisija tijekom razdoblja pokretanja hladnog motora i uporabe
    prijenosnih sustava za mjerenje emisija (PEMS) za mjerenje broja čestica s obzirom
    na teška vozila
  type: main
- language: hu
  script: Latn
