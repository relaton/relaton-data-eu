    rendeletnek a nehézgépjárművek vonatkozásában, a kibocsátáscsökkentési
    segédstratégiák (AES), a jármű fedélzeti diagnosztikai információihoz,
    valamint a járműjavítási és -karbantartási információkhoz való hozzáférés,
    a motor hidegindítása alatti kibocsátás mérése, valamint a hordozható kibocsátásmérő
