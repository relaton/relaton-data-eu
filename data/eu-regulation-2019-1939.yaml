    lisästrategioista (AES), ajoneuvon OBD-järjestelmän tietojen ja ajoneuvon korjaamiseen
    ja huoltamiseen tarvittavien tietojen saatavuudesta, moottorin kylmäkäynnistysvaiheiden
    aikaisten päästöjen mittaamisesta ja kannettavan päästöjenmittausjärjestelmän
    (PEMS) käytöstä hiukkasmäärän mittaamiseksi raskaiden hyötyajoneuvojen
    osalta
  type: main
