    TPD sistemos informacijos ir transporto priemonės remonto ir priežiūros informacijos,
    išmetamųjų teršalų matavimo šaltojo paleidimo laikotarpiais ir nešiojamųjų
    išmetamųjų teršalų kiekio matavimo sistemų (NITKMS) naudojimo kietųjų
    dalelių kiekiui išmatuoti nuostatų taikymo sunkiosioms transporto priemonėms
    iš dalies keičiamas Reglamentas (ES) Nr. 582/2011
  type: main
- language: mt
  script: Latn
