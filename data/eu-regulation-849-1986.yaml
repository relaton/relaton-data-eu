title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 849/86 of 24 March 1986 re-establishing
    the levying duties on footwear with outer soles of leather or composition leather
    footwear (other than footwear falling within heading 64.01) with outer soles of
    rubber or artificial plastic material falling within subheading 64.02 B originating
    in the Philippines to which the preferential arrangements set out in Council Regulation
    (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 849/86 de la Commission du 24 mars 1986 portant rétablissement
    de la perception des droits de douane applicables aux chaussures à semelles extérieures
    en cuir naturel, artificiel ou reconstitué; chaussures (autres que celles du
    n° 64.01) à semelles extérieures en caoutchouc ou en matière artificielle
    de la sous-position 64.02 B du tarif douanier commun, originaires des Philippines,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 849/86 der Kommission vom 24. März 1986 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen aus Leder oder Kunstleder,
    Schuhe mit Laufsohlen aus Kautschuk oder Kunststoff (ausgenommen Schuhe der Tarifnummer
    64.01) der Tarifstelle 64.02 B des Gemeinsamen Zolltarifs mit Ursprung in den
    Philippinen, denen die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 849/86 af 24. marts 1986 om genindførelse
    af opkrævning af told for fodtøj med ydersål af læder eller kunstlæder, fodtøj
    (bortset fra fodtøj henhørende under pos. 64.01) med ydersål af gummi eller
    plast, henhørende under pos. 64.02 B i den fælles toldtarif og med oprindelse
    i Filippinerne, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 849/86 της Επιτροπής
    της 24ης Μαρτίου 1986 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένα υποδήματα
    που έχουν το εξωτερικό πέλμα από δέρμα φυσικό,
    τεχνητό ή ανασχηματισμένο, υποδήματα (άλλα
    από εκείνα της κλάσης 64.01) με πέλμα εξωτερικό
    από καουτσούκ ή από τεχνητή πλαστική ύλη, της
    διακρίσεως 64.02 Β του κοινού δασμολογίου, καταγωγής
    Φιλιππίνων, δικαιούχου των προβλεπόμενων από
    τον κανονισμό (ΕΟΚ) αριθ. 3599/85 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 849/86 della Commissione del 24 marzo 1986 che ripristina
    la riscossione dei dazi doganali applicabili alle calzature con suole esterne
    di cuoio naturale, artificiale o ricostituito; calzature (non comprese nella voce
    64.01) con suole esterne di gomma o di materia plastica artificiale, della sottovoce
    64.02 B della tariffa doganale comune, originarie delle Filippine beneficiarie
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 849/86 van de Commissie van 24 maart 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    buitenzool van leder of van kunstleder, schoeisel (ander dan schoeisel bedoeld
    bij post 64.01) met buitenzool van rubber of van kunstmatige plastische stof van
    postonderverdeling 64.02 B van het gemeenschappelijk douanetarief, van oorsprong
    uit de Filippijnen, waarvoor de in Verordening (EEG) nr. 3599/85 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 849/86 da Comissão de 24 de Março de 1986 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a calçado com sola
    exterior de couro natural, artificial ou reconstituído, calçado com sola exterior
    de borracha ou de matéria plástica artificial não compreendido no n.° 64.01
    da subposição pautal 64.02 B da pauta aduaneira comum originário das Filipinas,
    beneficiária das preferências pautais previstas pelo Regulamento (CEE) n.°
    3599/85 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 849/86 de la Comisión de 24 de marzo de 1986 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables al
    calzado con suela de cuero natural, artificial o regenerado; calzado con suela
    de caucho o de materia plástica artificial (distinto del comprendido en la partida
    n° 64.01) de la subpartida 64.02 B del arancel aduanero común originario de
    Filipinas y beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) n° 3599/85 del Consejo
