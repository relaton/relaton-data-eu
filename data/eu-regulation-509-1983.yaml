title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 509/83 of 3 March 1983 amending Regulation
    (EEC) No 2991/82 with regard to the maximum period for the packaging of butter
    not subject to intervention measures and destined for direct consumption in the
    Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 509/83 de la Commission du 3 mars 1983 modifiant le
    règlement (CEE) no 2991/82 en ce qui concerne le délai maximal pour le conditionnement
    du beurre ne faisant pas l' objet de mesures d' intervention et destiné à la
    consommation directe dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 509/83 der Kommission vom 3. März 1983 zur Änderung
    der Verordnung (EWG) Nr. 2991/82 hinsichtlich der Höchstfrist für die Verpackung
    von zum unmittelbaren Verbrauch in der Gemeinschaft von nicht aus Interventionsbeständen
    stammender Butter
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 509/83 af 3. marts 1983 om ændring
    af forordning (EØF) nr. 2991/82 for så vidt angår maksimumsfristen for emballering
    af smør, der er bestemt til direkte konsum i Fællesskabet, men som ikke omfattes
    af interventionsforanstaltninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 509/83 της Επιτροπής
    της 3ης Μαρτίου 1983 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 2991/82 όσον αφορά τη μέγιστη προθεσμία
    για τη συσκευασία του βουτύρου που δεν αποτελεί
    αντικείμενο μέτρων παρεμβάσεως και που προορίζεται
    για άμεση κατανάλωση στην Κοινότητα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 509/83 della Commissione del 3 marzo 1983 che modifica
    il regolamento (CEE) n. 2991/82 per quanto riguarda il termine massimo per il
    condizionamento del burro destinato al consumo diretto nella Comunità e non soggetto
    a misure d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 509/83 van de Commissie van 3 maart 1983 tot wijziging
    van Verordening (EEG) nr. 2991/82 ten aanzien van de uiterste termijn voor de
    verpakking van boter waarvoor geen interventiemaatregelen gelden en die bestemd
    is voor rechtstreekse consumptie in de Gemeenschap
