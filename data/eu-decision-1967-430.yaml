title:
- language: fr
  script: Latn
  content: Décision 67/430/CEE de la Commission, du 23 juin 1967, portant prorogation
    de la décision du 10 juin 1966, autorisant la République italienne à exclure
    du traitement communautaire les "huiles essentielles non déterpenées d'orange"
    de la position 33.01 A Ex I du Tarif douanier commun, originaires des USA et mises
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/430/EWG: Entscheidung der Kommission vom 23. Juni 1967 zur Verlängerung
    der Geltungsdauer der Entscheidung vom 10. Juni 1966, mit der die Italienische
    Republik ermächtigt wird, "nicht terpenfrei gemachte ätherische öle von Orangen"
    der Tarifnummer 33.01 A ex I mit Ursprung in den USA, die sich in den anderen
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/430/CEE: Decisione della Commissione, del 23 giugno 1967, che proroga
    la decisione del 10 giugno 1966, con cui si autorizza la Repubblica italiana ad
    escludere dal trattamento comunitario gli «oli essenziali non deterpenati di
    arancio» della voce 33.01 A ex I, originari degli USA e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/430/EEG: Beschikking van de Commissie van 23 juni 1967 houdende verlenging
    van de beschikking van 10 juni 1966 waarbij de Italiaanse Republiek wordt gemachtigd
    om "etherische oliën, waaruit de terpenen niet zijn afgesplitst, van sinaasappel"
    van post 33.01 A ex I van het gemeenschappelijk douanetarief, welke van oorsprong
    zijn uit de U.S.A. en in de andere Lid-Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
