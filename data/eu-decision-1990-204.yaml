  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 4 april 1990 houdende machtiging van de
    Italiaanse Republiek om zaaizaad van rijst dat niet aan de eisen van Richtlijn
