title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3731/81 of 21 December 1981 fixing the standard
    values to be used in calculating financial compensation in respect of fishery
    products withdrawn from the market during the period from 1 January to 31 December
    1982
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3731/81 de la Commission, du 21 décembre 1981, fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    période du 1er janvier au 31 décembre 1982, intervenant dans le calcul de la
    compensation financière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3731/81 der Kommission vom 21. Dezember 1981 zur Festsetzung
    des Pauschalwerts der aus dem Handel genommenen Fischereierzeugnisse, der zur
    Berechnung des finanziellen Ausgleichs für die Zeit vom 1. Januar bis 31. Dezember
    1982 herangezogen wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3731/81 af 21. december 1981 om fastsættelse
    af den ved beregningen af den finansielle udligning anvendte fikserede værdi
    af fiskerivarer, der fjernes fra handelen i perioden fra den 1. januar til den
    31. december 1982
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3731/8 τής Επιτροπής τής
    21ης Δεκεμβρίου 1981 περί καθορισμού τής κατ αποκοπή
    αξίας τών προϊόντων αλιείας πού αποσύρονται
    από τήν αγορά κατά τήν περίοδο από 1ης Ιανουαρίου
    έως 31ης Δεκεμβρίου 1982, η οποία παρεμβαίνει
    στόν υπολογισμό τής χρηματικής αντισταθμίσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3731/81 della Commissione, del 21 dicembre 1981, che
    fissa il valore forfettario dei prodotti della pesca ritirati dal mercato durante
    il periodo dal 1° gennaio fino al 31 dicembre 1982 che figura nel calcolo della
    compensazione finanziaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3731/81 van de Commissie van 21 december 1981 betreffende
    de vaststelling van de forfaitaire waarde van de in de periode van 1 januari tot
    en met 31 december 1982 uit de markt genomen visserijprodukten voor de berekening
    van de financiële vergoeding
