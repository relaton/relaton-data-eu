title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 502/93 of 4 March 1993 determining the loss
    of income and the premiums applicable per ewe and per female goat in the Member
    States and the specific aid for sheep and goat farming in certain less- favoured
    areas of the Community for the 1992 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 502/93 de la Commission, du 4 mars 1993, déterminant,
    pour les Etats membres et pour la campagne 1992 la perte de revenu et le montant
    de la prime payable par brebis et par chèvre ainsi que celui de l' aide spécifique
    à l' élevage ovin et caprin dans certaines zones défavorisées de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 502/93 der Kommission vom 4. März 1993 über die
    je Mitgliedstaat für das Wirtschaftsjahr 1992 vorzunehmende Bestimmung des Einkommensausfalls,
    der Mutterschaf- und Ziegenprämie und der besonderen Beihilfe für die Schaf-
    und Ziegenhaltung in bestimmten benachteiligten Gebieten der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 502/93 af 4. marts 1993 om fastsættelse
    for medlemsstaterne af indtægtstabet og det præmiebeløb, der skal betales pr.
    moderfår og pr. ged, samt af den særlige støtte til fåre- og gedeopdræt i
    visse ugunstigt stillede områder i Fællesskabet, for så vidt angår produktionsåret
    1992
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 502/93 της Επιτροπής
    της 4ης Μαρτίου 1993 που καθορίζει για τα κράτη
    μέλη και για την περίοδο εμπορίας 1992 την απώλεια
    εισοδήματος καθώς και το ποσό της πριμοδότησης
    που καταβάλλεται ανά προβατίνα και ανά αίγα,
    καθώς και το ποσό της ειδικής ενίσχυσης στην
    εκτροφή αιγοειδών και χοιροειδών σε ορισμένες
    μειονεκτικές περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 502/93 della Commissione, del 4 marzo 1993, che stabilisce,
    per gli Stati membri e per la campagna 1992, la perdita di reddito e il premio
    pagabile per pecora e per capra, nonché l' aiuto specifico all' allevamento ovicaprino
    in talune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 502/93 van de Commissie van 4 maart 1993 tot vaststelling,
    voor de Lid-Staten, van het inkomensverlies en het premiebedrag per ooi en per
    vrouwelijke geit alsmede het bedrag van de bijzondere steun voor de schapen- en
    geitenhouderij, in bepaalde probleemgebieden van de Gemeenschap voor het verkoopseizoen
    1992
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 502/93 da Comissão, de 4 de Março de 1993, que
    determina, para os Estados-membros e em relação à campanha de 1992, a perda
    de rendimento e o montante do prémio pagável por ovelha e por cabra, bem como
    o da ajuda específica à criação de ovinos e de caprinos em determinadas zonas
    desfavorecidas da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 502/93 de la Comisión, de 4 de marzo de 1993, por
    el que se determinan, para los Estados miembros, la pérdida de renta y los importes
    de la prima pagadera por ovega y por cabra y de la ayuda específica a la ganadería
    ovina y caprina en algunas zonas desfavorecidas de la Comunidad durante la campaña
    de 1992
