title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2569/2001 of 20 December 2001 fixing the
    standard values to be used in calculating the financial compensation and the advance
    pertaining thereto in respect of fishery products withdrawn from the market during
    the 2002 fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2569/2001 de la Commission du 20 décembre 2001 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 2002 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2569/2001 der Kommission vom 20. Dezember 2001 zur
    Festsetzung des Pauschalwerts für das Fischwirtschaftsjahr 2002 für die aus
    dem Handel genommenen Fischereierzeugnisse, der zur Berechnung des finanziellen
    Ausgleichs und des entsprechenden Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2569/2001 af 20. december 2001 om fastsættelse
    af den forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet i
    fangståret 2002, og som indgår i beregningen af den finansielle udligning og
    det tilsvarende forskud
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2569/2001 της Επιτροπής,
    της 20ής Δεκεμβρίου 2001, για τον καθορισμό της
    κατ' αποκοπή αξίας των προϊόντων αλιείας που
    αποσύρονται από την αγορά κατά την αλιευτική
    περίοδο 2002, η οποία υπεισέρχεται στον υπολογισμό
    της χρηματικής αντισταθμίσεως και της σχετικής
    προκαταβολής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2569/2001, annettu 20 päivänä joulukuuta 2001,
    kalastusvuoden 2002 aikana markkinoilta vedettyjen kalastustuotteiden taloudellisen
    korvauksen ja sen ennakon laskennassa käytettävästä kiinteästä arvosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2569/2001 della Commissione, del 20 dicembre 2001,
    che fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo
    corrispondente, il valore forfettario dei prodotti della pesca ritirati dal mercato
    nella campagna di pesca 2002
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2569/2001 van de Commissie van 20 december 2001 betreffende
    de vaststelling van de forfaitaire waarde van de in het visseizoen 2002 uit de
    markt genomen visserĳproducten die in aanmerking wordt genomen voor de berekening
    van de financiële vergoeding en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2569/2001 da Comissão, de 20 de Dezembro de 2001,
    que fixa, para efeitos do cálculo da compensação financeira e do adiantamento
    que lhe diz respeito, o valor forfetário dos produtos da pesca retirados do mercado
    durante a campanha de pesca de 2002
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2569/2001 de la Comisión, de 20 de diciembre de 2001,
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 2002, que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2569/2001 av den 20 december 2001 om
    fastställande av det schablonvärde som skall användas vid beräkningen av den
    ekonomiska ersättningen och tillhörande förskott för de fiskeriprodukter som
    återtagits från marknaden under fiskeåret 2002
  type: main
