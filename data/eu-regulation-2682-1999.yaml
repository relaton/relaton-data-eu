    της 17ης Δεκεμβρίου 1999, για την κατάρτιση των
    προβλέψεων του ισολογισμού εφοδιασμού σε δημητριακά
    προϊόντα και σε αποξηραμένες ζωοτροφές των
    μικρών νησιών του Αιγαίου Πελάγους για το 2000
    και για τροποποίηση του κανονισμού (ΕΚ) αριθ.
    3175/94 που αφορά τις λεπτομέρειες εφαρμογής του
    ειδικού καθεστώτος εφοδιασμού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2682/1999, annettu 17 päivänä joulukuuta 1999,
