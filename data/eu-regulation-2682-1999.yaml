    o abastecimento
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2682/1999 de la Comisión, de 17 de diciembre de 1999,
    por el que se establece el plan de previsiones de abastecimiento de productos
    del sector de los cereales y de forrajes desecados a las islas menores del mar
    Egeo para el año 2000 y por el que se modifica el Reglamento (CE) nº 3175/94
