    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2682/1999 della Commissione, del 17 dicembre 1999,
    che fissa il bilancio di approvvigionamento previsionale delle isole minori del
    Mar Egeo in prodotti cerealicoli e in foraggi essiccati per il 2000 e che modifica
    il regolamento (CE) n. 3175/94 recante modalità di applicazione del regime specifico
    di approvvigionamento
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2682/1999 van de Commissie van 17 december 1999 tot
    vaststelling van de op ramingen berustende balans voor de voorziening van de kleinere
    eilanden in de Egeïsche Zee met graanproducten en gedroogde voedergewassen in
    2000, en tot wijziging van Verordening (EG) nr. 3175/94 houdende bepalingen voor
    de toepassing van de specifieke regeling voor de voorziening
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2682/1999 da Comissão, de 17 de Dezembro de 1999,
    que estabelece o balanço previsional de abastecimento em produtos cerealíferos
    e em forragens secas das ilhas menores do mar Egeu para 2000 e altera o Regulamento
