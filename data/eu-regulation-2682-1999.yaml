title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2682/1999 of 17 December 1999 establishing
    the forecast supply balances for cereal products and dried fodder for the smaller
    Aegean islands for 2000 and amending Regulation (EC) No 3175/94 laying down detailed
    rules of application for the specific supply arrangements
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2682/1999 de la Commission, du 17 décembre 1999, établissant
