title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2659/81 of 11 September 1981 re-establishing
    the levying of customs duties on bars and rods of iron or steel, falling within
    subheadings 73.10 B, C, D I b) and D II and originating in Romania, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3322/80
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2659/81 de la Commission, du 11 septembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux barres en
    fer ou en acier, des sous-positions 73.10 B, C, D I b), II du tarif douanier commun,
    originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2659/81 der Kommission vom 11. September 1981 zur
    Wiedereinführung der Erhebung der Zölle für Stabstahl der Tarifstellen 73.10
    B, C, D I b) und II, mit Ursprung in Rumänien, dem die in der Verordnung (EWG)
    Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2659/81 af 11. september 1981 om genindførelse
    af opkrævning af told for stænger af jern og stål, henhørende under pos. 73.10
    B, C, D I b), II og med oprindelse i Rumænien, som er præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
