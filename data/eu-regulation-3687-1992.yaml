    do mercado a aplicar em relação a determinados montantes no âmbito da política
    agrícola comum e, nomeadamente, para o cálculo dos montantes compensatórios
    monetários, bem como a taxa de conversão agrícola aplicável no sector da carne
    da suíno no Reino Unido e em Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 3687/92 de la Comisión, de 21 de diciembre de 1992,
    por el que se rectifica el Reglamento (CEE) n 3497/92 por el que se fijan los
    tipos representativos del mercado aplicables a determinados importes en el marco
    de la política agraria común y, en particular, al cálculo de los montantes
