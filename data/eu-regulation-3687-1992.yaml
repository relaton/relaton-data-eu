title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3687/92 of 21 December 1992 correcting Regulation
    (EEC) No 3497/92 fixing the representative market rates to be applied for certain
    amounts in the context of the common agricultural policy and, in particular, for
    the calculation of the monetary compensatory amounts and the agricultural conversion
    rates for the pigmeat sector in the United Kingdom and in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3687/92 de la Commission, du 21 décembre 1992, rectifiant
    le règlement (CEE) n 3497/92 fixant les taux représentatifs du marché à appliquer
    pour certains montants dans le cadre de la politique agricole commune, et notamment
    pour le calcul des montants compensatoires monétaires, ainsi que le taux de conversion
    agricole applicable dans le secteur de la viande de porc au Royaume-Uni et en
    Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3687/92 der Kommission vom 21. Dezember 1992 zur Berichtigung
    der Verordnung (EWG) Nr. 3497/92 zur Festsetzung der repräsentativen Marktkurse,
    die für bestimmte Beträge im Rahmen der Gemeinsamen Agrarpolitik, insbesondere
    für die Berechnung der Währungsausgleichsbeträge, angewendet werden müssen,
    sowie des im Vereinigten Königreich auf Schweinefleisch anwendbaren landwirtschaftlichen
    Umrechnungskurse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3687/92 af 21. december 1992 om berigtigelse
    af forordning (EØF) nr. 3497/92 om fastsættelse af de repræsentative markedskurser,
    der skal anvendes for visse beløb i forbindelse med den fælles landbrugspolitik,
    navnlig ved beregning af de monetære udligningsbeløb, samt af landbrugsomregningskursen
    for svinekød i Det Forenede Kongerige og Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3687/92 της Επιτροπής
    της 21ης Δεκεμβρίου 1992 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 3497/92 για τον καθορισμό των αντιπροσωπευτικών
    τιμών της αγοράς που θα εφαρμοστούν σε ορισμένα
    ποσά στα πλαίσια της Κοινής Γεωργικής Πολιτικής
    και κυρίως για τον υπολογισμό των γεωργικών
    εξισωτικών ποσών, καθώς και της γεωργικής ισοτιμίας
    που εφαρμόζεται στον τομέα του χοιρείου κρέατος
    στο Ηνωμένο Βασίλειο και στην Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3687/92 della Commissione, del 21 dicembre 1992, che
    rettifica il regolamento (CEE) n. 3497/92 che fissa i tassi rappresentativi del
    mercato da applicare a taluni importi nel quadro della politica agricola comune,
    in particolare per il calcolo degli importi compensativi monetari, nonché il
    tasso di conversione agricolo applicabile nel settore delle carni bovine nel Regno
    Unito e in Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3687/92 van de Commissie van 21 december 1992 houdende
    rectificatie van Verordening (EEG) nr. 3497/92 tot vaststelling van de representatieve
    marktkoersen die moeten worden toegepast voor bepaalde bedragen in het kader van
    het gemeenschappelijk landbouwbeleid, en met name voor de berekening van de monetaire
    compenserende bedragen en van de landbouwomrekeningskoers die geldt in de sector
    varkensvlees in het Verenigd Koninkrijk en in Spanje
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3687/92 da Comissão, de 21 de Dezembro de 1992,
