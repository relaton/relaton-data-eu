title:
- language: en
  script: Latn
  content: '82/183/EEC: Commission Decision of 26 February 1982 establishing that
    the apparatus described as ''Perkin- Elmer - scattered transmission UV-VIS double-beam
    spectrophotometer, model 576'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/183/CEE: Décision de la Commission, du 26 février 1982, constatant
    que l''importation de l''appareil dénommé "Perkin Elmer - Scattered Transmission
    UV-VIS Double Beam Spectrophotometer, model 576" peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/183/EWG: Entscheidung der Kommission vom 26. Februar 1982, mit der
    festgestellt wird, daß das Gerät ,,PERKIN ELMER-Scattered Transmission UV-VIS
    Double Beam Spectrophotometer, model 576" unter Befreiung von den Zöllen des
    Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/183/EØF: Kommissionens beslutning af 26. februar 1982 om fastslåelse
    af, at indførsel af apparatet "PERKIN ELMER - Scattered Transmission UV-VIS Double
    Beam Spectrophotometer, model 576" kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/183/EOK: Απόφαση τής Επιτροπής τής 26ης Φεβρουαρίου
