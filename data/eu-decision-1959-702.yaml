id: EUDecision1959702
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: "/* Decision derogating from certain provisions of Regulation No 5 laying down rules relating to calls for and transfers of financial contributions, budgetary arrangements and administration of the resources of the Development Fund for the Overseas Countries and Territories */"
  type: main
- language: fr
  script: Latn
  content: Décision portant dérogation à certaines prescriptions du règlement
    n° 5 portant fixation des modalités relatives aux appels et aux transferts des
    contributions financières, au régime budgétaire et à la gestion des ressources
    du Fonds de développement pour les pays et territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Entscheidung über eine Abweichung von gewissen Vorschriften der Verordnung
    Nr. 5 zur Festlegung der Einzelheiten für die Anforderung und Überweisung der
    Finanzbeiträge sowie für die Haushaltsregelung und die Verwaltung der Mittel
    des Entwicklungsfonds für die überseeischen Länder und Hoheitsgebiete
  type: main
- language: da
  script: Latn
  content: "/* Afgørelse om undtagelse fra visse bestemmelser i forordning nr. 5 om fastsættelse af de nærmere bestemmelser for indkaldelser og overførsler af finansielle bidrag, budgetforhold og forvaltning af midlerne under Udviklingsfonden for de oversøiske lande og territorier */"
  type: main
- language: it
  script: Latn
  content: Decisione che deroga a talune prescrizioni del Regolamento N° 5 che fissa
    le modalità relative ai richiami e ai trasferimenti dei contributi finanziari,
    al regime di bilancio e alla gestione delle risorse del Fondo per lo sviluppo
    dei paesi e territori d' oltremare
  type: main
- language: nl
  script: Latn
  content: Besluit houdende afwijking van bepaalde voorschriften van Verordening No.
    5 tot bepaling van de wijze waarop de financiële bijdragen worden afgeroepen
    en overgemaakt, de begroting wordt ingericht en de middelen van het Fonds voor
    de ontwikkeling van de landen en gebieden overzee worden beheerd
  type: main
