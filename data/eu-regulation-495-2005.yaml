    (ΕΚ) αριθ. 824/2000 όσον αφορά την προθεσμία παράδοσης
    των σιτηρών στην παρέμβαση σε ορισμένα κράτη
    μέλη για την περίοδο εμπορίας 2004/05
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 495/2005, 30. märts 2005, millega tehakse
