    do agencji interwencyjnych w niektórych Państwach Członkowskich w roku gospodarczym
    2004/2005
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 495/2005 da Comissão, de 30 de Março de 2005, que
    derroga o Regulamento (CE) n.° 824/2000 no respeitante ao prazo de entrega dos
    cereais para intervenção em determinados Estados-Membros na campanha de 2004/2005
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 495/2005 z 30. marca 2005, ktorým sa ustanovuje
    výnimka z nariadenia (ES) č. 824/2000, pokiaľ ide o termín dodávky obilnín
    na intervenciu v niektorých členských štátoch v hospodárskom roku 2004/2005
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 495/2005 z dne 30. marca 2005 o odstopanju od
