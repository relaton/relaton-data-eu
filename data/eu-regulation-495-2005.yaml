title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 495/2005 of 30 March 2005 derogating from
    Regulation (EC) No 824/2000 as regards the period for delivering cereals into
    intervention in some Member States in the 2004/2005 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 495/2005 de la Commission du 30 mars 2005 dérogeant
    au règlement (CE) n° 824/2000 en ce qui concerne le délai de livraison des
    céréales à l’intervention dans certains États membres pour la campagne 2004/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 495/2005 der Kommission vom 30. März 2005 zur Abweichung
