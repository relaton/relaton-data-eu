    (ELAN) izveidi groza Īstenošanas regulas (ES) 2016/1239, (ES) 2020/761, (ES)
    2020/1988 un (ES) 2023/2834 un Īstenošanas regulu (ES) 2020/1988 groza attiecībā
    uz diviem jauniem tarifa kvotu numuriem rīsu importam no Bangladešas
  type: main
- language: lt
  script: Latn
