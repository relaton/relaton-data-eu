    zbog uspostave elektroničkog sustava za necarinske formalnosti za poljoprivredne
    proizvode (ELAN) i o izmjeni Provedbene uredbe (EU) 2020/1988 u pogledu dvaju
    novih brojeva carinskih kvota za uvoz riže iz Bangladeša
  type: main
- language: hu
  script: Latn
