title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1271 of 6 May 2025 amending
    Implementing Regulations (EU) 2016/1239, (EU) 2020/761, (EU) 2020/1988 and (EU)
    2023/2834 as a consequence of the establishment of the Electronic system for Agricultural
    Non-customs formalities (ELAN), and amending Implementing Regulation (EU) 2020/1988
    as regards two new tariff quota numbers for imports of rice from Bangladesh
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1271 de la Commission du 6 mai 2025
    modifiant les règlements d’exécution (UE) 2016/1239, (UE) 2020/761, (UE) 2020/1988
    et (UE) 2023/2834 à la suite de la mise en place du système électronique pour
    les formalités agricoles non douanières (ELAN), et modifiant le règlement d’exécution
    (UE) 2020/1988 en ce qui concerne deux nouveaux numéros de contingent tarifaire
    pour les importations de riz en provenance du Bangladesh
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1271 der Kommission vom 6. Mai 2025
    zur Änderung der Durchführungsverordnungen (EU) 2016/1239, (EU) 2020/761, (EU)
    2020/1988 und (EU) 2023/2834 infolge der Einrichtung des elektronischen Systems
    für Agrar-Nichtzollformalitäten (ELAN) und zur Änderung der Durchführungsverordnung
    (EU) 2020/1988 hinsichtlich zweier neuer Zollkontingentsnummern für Einfuhren
    von Reis aus Bangladesch
  type: main
- language: bg
