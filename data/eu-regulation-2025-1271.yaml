    sukūrimo iš dalies keičiami įgyvendinimo reglamentai (ES) 2016/1239, (ES)
    2020/761, (ES) 2020/1988 ir (ES) 2023/2834 ir dėl dviejų naujų ryžių importo
    iš Bangladešo tarifinių kvotų numerių iš dalies keičiamas Įgyvendinimo
    reglamentas (ES) 2020/1988
  type: main
- language: mt
  script: Latn
