    zaradi vzpostavitve elektronskega sistema za kmetijske necarinske formalnosti
    (ELAN) ter spremembi Izvedbene uredbe (EU) 2020/1988 glede uvedbe dveh novih številk
    tarifnih kvot za uvoz riža iz Bangladeša
  type: main
- language: es
  script: Latn
