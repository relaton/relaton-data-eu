    (UE) 2020/761, (UE) 2020/1988 u (UE) 2023/2834 bħala konsegwenza tal-istabbiliment
    tas-sistema Elettronika għall-formalitajiet Agrikoli Mhux Doganali (ELAN), u
    li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2020/1988 fir-rigward ta’
    żewġ numri ġodda tal-kwota tariffarja għall-importazzjonijiet tar-ross mill-Bangladesh
  type: main
