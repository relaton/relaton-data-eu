    rendeletnek a vámalakiságoktól eltérő mezőgazdasági alakiságok elektronikus
    rendszerének (ELAN) létrehozása következtében történő módosításáról,
    valamint az (EU) 2020/1988 végrehajtási rendeletnek a Bangladesből származó
    rizs behozatalára vonatkozó két új vámkontingensszám tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1271 della Commissione, del 6 maggio
    2025, che modifica i regolamenti di esecuzione (UE) 2016/1239, (UE) 2020/761,
    (UE) 2020/1988 e (UE) 2023/2834 a seguito dell’istituzione del sistema elettronico
    per le formalità non doganali in agricoltura (ELAN) e che modifica il regolamento
    di esecuzione (UE) 2020/1988 per quanto riguarda due nuovi numeri d’ordine dei
    contingenti tariffari per le importazioni di riso dal Bangladesh
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1271 (2025. gada 6. maijs), ar
