title:
- language: en
  script: Latn
  content: '2002/331/EC: Council Decision of 22 April 2002 on the signing, on behalf
    of the European Community, and provisional application of the Agreement in the
    form of an Exchange of Letters concerning the extension of the Protocol setting
    out the fishing opportunities and financial contribution provided for in the Agreement
    between the European Economic Community and the Government of the Revolutionary
    People''s Republic of Guinea on fishing off the Guinean coast for the period 1
    January 2002 to 31 December 2002'
  type: main
- language: fr
  script: Latn
  content: '2002/331/CE: Décision du Conseil du 22 avril 2002 relative à la signature,
    au nom de la Communauté européenne, et à l''application provisoire de l''accord
    sous forme d''échange de lettres relatif à la prorogation du protocole fixant
    les possibilités de pêche et la contrepartie financière prévues dans l''accord
    entre la Communauté économique européenne et le gouvernement de la République
    populaire révolutionnaire de Guinée concernant la pêche au large de la côte
    guinéenne pour la période allant du 1er janvier 2002 au 31 décembre 2002'
  type: main
- language: de
