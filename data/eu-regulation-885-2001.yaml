    ar kuru nosaka sīki izstrādātus noteikumus vīna tirgus kopīgās organizācijas
    ieviešanai attiecībā uz Kanādas izcelsmes vīniem ar tiesībām uz apzīmējumu
    Icewine
  type: main
- language: lt
  script: Latn
  content: 2001 m. balandžio 24 d. Komisijos reglamentas (EB) Nr. 885/2001, keičiantis
    Reglamentus (EEB) Nr. 3201/90, (EB) Nr. 1622/2000 ir (EB) Nr. 883/2001, nustatančius
    išsamias bendro vyno rinkos organizavimo įgyvendinimo taisykles, susijusias
    su Kanados kilmės vynais, turinčiais teisę į „Icewine“ pavadinimą
  type: main
