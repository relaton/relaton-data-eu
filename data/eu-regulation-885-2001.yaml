title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 885/2001 of 24 April 2001 amending Regulations
    (EEC) No 3201/90, (EC) No 1622/2000 and (EC) No 883/2001 laying down detailed
    rules for the application of the common organisation of the market in wine, with
    regard to wines originating in Canada and having the right to the designation
    "Icewine"
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 885/2001 de la Commission, du 24 avril 2001, modifiant
    les règlements (CEE) n° 3201/90, (CE) n° 1622/2000 et (CE) n° 883/2001 portant
    modalités d'application de l'organisation commune du marché vitivinicole, en
    ce qui concerne les vins originaires du Canada ayant droit de porter la mention
    "Icewine"
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 885/2001 der Kommission vom 24. April 2001 zur Änderung
    der Verordnungen (EWG) Nr. 3201/90, (EG) Nr. 1622/2000 und (EG) Nr. 883/2001 mit
    Durchführungsbestimmungen zur gemeinsamen Marktorganisation für Wein hinsichtlich
    der Weine aus Kanada, für die die Angabe "Icewine" zugelassen ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 885/2001 на Комисията от 24
