    annettujen asetusten (ETY) N:o 3201/90, (EY) N:o 1622/2000 ja (EY) N:o 883/2001
    muuttamisesta Kanadasta peräisin olevien "Icewine"-merkintään oikeutettujen
    viinien osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 885/2001/EK rendelete (2001. április 24.) a borpiac közös
