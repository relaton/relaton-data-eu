    che fissano talune modalità d'applicazione dell'organizzazione comune del mercato
    vitivinicolo, per quanto riguarda i vini originari del Canada aventi diritto alla
    designazione "Icewine"
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 885/2001 (2001. gada 24. aprīlis), ar ko groza
