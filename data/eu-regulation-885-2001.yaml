    szczegółowe zasady stosowania wspólnej organizacji rynku wina w odniesieniu
    do win pochodzących z Kanady i mających prawo do nazwy „Icewine”
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 885/2001 da Comissão, de 24 de Abril de 2001, que
    altera os Regulamentos (CEE) n.° 3201/90, (CE) n.° 1622/2000 e (CE) n.° 883/2001
    da Comissão, que fixam as normas de execução da organização comum do mercado
    vitivinícola, no que toca aos vinhos originários do Canadá com direito a ostentar
    a menção "Icewine"
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 885/2001 al Comisiei din 24 aprilie 2001 de modificare
    a Regulamentelor (CEE) nr. 3201/90, (CE) nr. 1622/2000 și (CE) nr. 883/2001 de
    stabilire a normelor de aplicare privind organizarea comună a pieței vitivinicole
    cu privire la vinurile originare din Canada care au dreptul la denumirea „Icewine”
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 885/2001 z 24. apríla 2001, ktorým sa menia
    a dopĺňajú nariadenia (EHS) č. 3201/90, (ES) č. 1622/2000 a (ES) č. 883/2001
    ustanovujúce podrobné pravidlá spoločnej organizácie trhu s vínom, pokiaľ
    ide o vína pochádzajúce z Kanady a oprávnené na označenie „Icewine“
  type: main
- language: sl
  script: Latn
