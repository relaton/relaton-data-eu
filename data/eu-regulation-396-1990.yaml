title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 396/90 of 15 February 1990 derogating, for
    the 1990/91 marketing year, from Regulation (EEC) No 1599/84 laying down detailed
    rules for the application of the system of production aid for products processed
    from fruit and vegetables in so far as the time limit for concluding delivery
    contracts is concerned and amending that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 396/90 de la Commission du 15 février 1990 dérogeant,
    pour la campagne 1990/1991, au règlement (CEE) n° 1599/84 portant modalités
    d'application du régime d'aide à la production pour les produits transformés
    à base de fruits et légumes, en ce qui concerne la date limite de conclusion
    des contrats et modifiant ledit règlement
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 396/90 DER KOMMISSION vom 15. Februar 1990 mit Abweichungen
    fuer das Wirtschaftsjahr 1990/91 von der Verordnung (EWG) Nr. 1599/84 mit Durchfuehrungsbestimmungen
    zur Produktionsbeihilferegelung fuer Verarbeitungserzeugnisse aus Obst und Gemuese
    hinsichtlich des Enddatums fuer den Abschluss von Liefervertraegen und zur Aenderung
    der genannten Verordnung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 396/90 af 15. februar 1990 om afvigelse
    for høståret 1990/91 fra forordning (EØF) nr. 1599/84 om fastsættelse af gennemførelsesbestemmelser
    for producentstøtteordningen for produkter forarbejdet på basis af frugt og
    grønsager, for så vidt angår datoen for indgåelse af leveringskontrakter og
    ændring af nævnte forordning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 396/90 της Επιτροπής
    της 15ης Φεβρουαρίου 1990 περί παρέκκλισης, για
    την περίοδο εμπορίας 1990/91, από τον κανονισμό
    (ΕΟΚ) αριθ. 1599/84 περί λεπτομερειών εφαρμογής
    του καθεστώτος ενισχύσεως στην παραγωγή για
    τα μεταποιημένα προϊόντα με βάση τα οπωροκηπευτικά
    σε ότι αφορά την ημερομηνία συνάψεως των συμβάσεων
    παραδόσεως και περί τροποποίησης του εν λόγω
    κανονισμού
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 396/90 DELLA COMMISSIONE del 15 febbraio 1990 che
    deroga, per la campagna 1990/1991, al regolamento (CEE) n. 1599/84 che stabilisce
    le modalità di applicazione del regime di aiuti alla produzione per taluni prodotti
    trasformati a base di ortofrutticoli, per la data limite di conclusione dei contratti
    e che modifica il detto regolamento
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 396/90 VAN DE COMMISSIE van 15 februari 1990 houdende
    afwijking voor het verkoopseizoen 1990/1991, van Verordening (EEG) nr. 1599/84
    tot vaststelling van uitvoeringsbepalingen inzake de produktiesteunregeling voor
    verwerkte produkten op basis van groenten en fruit wat betreft de uiterste datum
    van de leveringscontracten en houdende wijziging van deze verordening
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 396/90 DA COMISSAO de 15 de Fevereiro de 1990 que
    derroga, para a campanha de 1990/1991, o Regulamento (CEE) n* 1599/84, que estabelece
    modalidades de aplicaçao do regime de ajuda à produçao para os produtos transformados
    à base de frutas e produtos horticolas, no que respeita à data limite de conclusao
    dos contratos de entrega e altera o citado regulamento
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 396/90 DE LA COMISION de 15 de febrero de 1990 por
    el que se deroga, para la campana 1990/91 el Reglamento (CEE) no 1599/84 por el
    que se establecen las normas de aplicacion del régimen de ayuda a la produccion
    para los productos transformados a base de frutas y hortalizas, la fecha limite
    para la conclusion de los contratos de entrega, modificando dicho Reglamento
  type: main
