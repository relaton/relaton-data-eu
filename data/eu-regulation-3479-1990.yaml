title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3479/90 of 30 November 1990 re-establishing
    the levying of the customs duties applicable to products of CN code 4203 originating
    in India, to which the preferential arrangements of Council Regulation (EEC) No
    3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3479/90 de la Commission du 30 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 4203, originaires de l'Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3479/90 DER KOMMISSION vom 30. November 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer die Waren des KN-Codes 4203 mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3479/90 af 30. november 1990 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 4203 og med oprindelse
    i Indien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3479/90 της Επιτροπής
    της 30ής Νοεμβρίου 1990 περί αποκαταστάσεως της
    εφαρμογής των δασμών για προϊόντα του κωδικού
    ΣΟ 4203, καταγωγής Ινδίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3896/89 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3479/90 DELLA COMMISSIONE del 30 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 4203 originari dell'India, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3479/90 VAN DE COMMISSIE van 30 november 1990 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 4203, van oorsprong uit India, waarvoor de in Verordening (EEG) nr.
    3896/89 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3479/90 DA COMISSAO de 30 de Novembro de 1990 que
    restabelece a cobrança dos direitos aduaneiros aplicaveis aos produtos do codigo
    NC 4203, originarios da India, beneficiarios das preferências pautais previstas
    pelo Regulamento (CEE) n* 3896/89 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3479/90 DE LA COMISION de 30 de noviembre de 1990 relativo
