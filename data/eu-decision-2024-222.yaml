title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/222 of 12 January 2024 postponing
    the expiry date of the approval of boric acid for use in biocidal products of
    product-type 8 in accordance with Regulation (EU) No 528/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/222 de la Commission du 12 janvier 2024
