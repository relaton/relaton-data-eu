    v biocidních přípravcích typu 8 v souladu s nařízením Evropského parlamentu
    a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/222 af 12. januar 2024
