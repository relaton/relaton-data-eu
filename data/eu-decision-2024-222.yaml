    de son utilisation dans des produits biocides relevant du type de produits 8,
    conformément au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/222 der Kommission vom 12. Januar 2024
