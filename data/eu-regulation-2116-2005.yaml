  script: Latn
  content: Council Regulation (EC) No 2116/2005 of 20 December 2005 amending Regulation
    (EC) No 1480/2003 imposing a definitive countervailing duty and collecting definitively
    the provisional duty imposed on imports of certain electronic microcircuits known
    as DRAMs (dynamic random access memories) originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
