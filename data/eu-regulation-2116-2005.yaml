    Ausgleichszolls und zur endgültigen Vereinnahmung des vorläufigen Zolls auf
    die Einfuhren bestimmter elektronischer Mikroschaltungen, so genannter DRAMs (dynamische
    Schreib-Lesespeicher mit wahlfreiem Zugriff) mit Ursprung in der Republik Korea
  type: main
