title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1178/98 of 5 June 1998 initiating an investigation
    concerning the alleged circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 1015/94 on imports of certain television camera systems originating
    in Japan and making the latter imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1178/98 de la Commission du 5 juin 1998 ouvrant une
    enquête sur le prétendu contournement des mesures antidumping instituées par
    le règlement (CE) nº 1015/94 du Conseil sur les importations de certains systèmes
    de caméras de télévision originaires du Japon et rendant obligatoire l'enregistrement
    de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1178/98 der Kommission vom 5. Juni 1998 zur Einleitung
