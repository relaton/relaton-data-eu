title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1893/84 of 3 July 1984 re-establishing the
    levying of customs duties on gramophone records and other sound or similar recordings,
    falling within heading No 92.12 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1893/84 de la Commission du 3 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux supports
    de son pour les appareils du no 92.11 ou pour enregistrements analogues, de la
    position 92.12 du tarif douanier commun, originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1893/84 der Kommission vom 3. Juli 1984 zur Wiedereinführung
    der Erhebung der Zölle für Tonträger für Geräte der Tarifnummer 92.11 oder
    für ähnliche Aufnahmeverfahren der Tarifnummer 92.12 mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1893/84 af 3. juli 1984 om genindførelse
    af opkrævning af told for grammofonplader og andre lydoptagelser eller lignende
    optagelser, henhørende under pos. 92.12 og med oprindelse i Hongkong, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1893/84 της Επιτροπής
    της 3ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για υποθέματα εγγραφής
    του ήχου διά συσκευάς της κλάσεως 92.11 ή δι' αναλόγους
    εγγραφάς, της κλάσεως 92.12 του Κοινού Δασμολογίου,
    καταγωγής Χονγκ Κονγκ, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1893/84 della Commissione del 3 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili ai supporti di suono per apparecchi
    della voce 92.11 o per registrazioni analoghe della voce 92.12 della tariffa doganale
    comune, originari di Hong Kong beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1893/84 van de Commissie van 3 juli 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op grammofoonplaten
    voor de toestellen bedoeld bij post 92.11 of voor dergelijke doeleinden, van post
    92.12, van oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3569/83
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
