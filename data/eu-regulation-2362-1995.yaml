  content: Commission Regulation (EC) No 2362/95 of 9 October 1995 amending Council
    Regulation (EEC) No 2019/93 which fixed before 1 February 1995 the amount of aid
    for the production of honey for the smaller Aegean islands, whose value in ecus
    has been adapted due to the abolition of the corrective factor of the agricultural
    conversion rate
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2362/95 de la Commission, du 9 octobre 1995, modifiant
