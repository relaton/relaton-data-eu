id: EURegulation30211973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3021/73 of the Commission of 7 November 1973 re-establishing
    Common Customs Tariff duties on artificial flowers, foliage or fruit and parts
    thereof, etc, falling within heading No 67.02, originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2762/72
    of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3021/73 de la Commission, du 7 novembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fleurs, feuillages et fruits artificiels, etc., de la position tarifaire 67.02,
    originaires de Hong Kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3021/73 der Kommission vom 7. November 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für künstliche Blumen, Blätter und
    Früchte sowie Teile davon; Waren aus künstlichen Blumen, Blättern oder Früchten,
    der Tarifnummer 67.02, mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3021/73 af 7. november 1973 om genindførelse
    af tolden, ifølge den fælles toldtarif, for kunstige blomster, blade og frugter
    samt dele deraf, etc., under position 67.02, som har oprindelse i Hong Kong og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3021/73 della Commissione, del 7 novembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    fiori, foglie e frutti artificiali, ecc., della voce doganale n. 67.02, originari
    di Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3021/73 van de Commissie van 7 november 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op kunstbloemen, kunstloofwerk en kunstvruchten, alsmede delen
    daarvan; artikelen van kunstbloemen, van kunstloofwerk en kunstvruchten, van post
    67.02, van oorsprong uit Hongkong, ten behoeve waarvan bij Verordening (EEG) nr.
    2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
