  script: Latn
  content: A Bizottság 918/2012/EU felhatalmazáson alapuló rendelete ( 2012. július
    5. ) a short ügyletekről és a hitel-nemteljesítési csereügyletekkel kapcsolatos
    egyes szempontokról szóló 236/2012/EU európai parlamenti és tanácsi rendeletnek
    a fogalommeghatározások, a nettó rövid pozíciók számítása, az állampapírral
    kapcsolatos fedezett hitel-nemteljesítési csereügyletek, a bejelentési küszöbértékek,
    a korlátozások felfüggesztéséhez szükséges likviditási küszöbértékek,
