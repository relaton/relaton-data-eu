  content: Commission Delegated Regulation (EU) No 918/2012 of 5 July 2012 supplementing
    Regulation (EU) No 236/2012 of the European Parliament and of the Council on short
    selling and certain aspects of credit default swaps with regard to definitions,
    the calculation of net short positions, covered sovereign credit default swaps,
    notification thresholds, liquidity thresholds for suspending restrictions, significant
    falls in the value of financial instruments and adverse events
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 918/2012 de la Commission du 5 juillet
    2012 complétant le règlement (UE) n ° 236/2012 du Parlement européen et du
    Conseil sur la vente à découvert et certains aspects des contrats d’échange
    sur risque de crédit, en ce qui concerne les définitions, le calcul des positions
    courtes nettes, les contrats d’échange sur défaut souverain couverts, les
    seuils de notification, les seuils de liquidité pour la suspension de restrictions,
    les baisses de valeur significatives d’instruments financiers et les événements
    défavorables
  type: main
- language: de
  script: Latn
