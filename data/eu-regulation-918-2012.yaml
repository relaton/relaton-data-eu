    események tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 918/2012 della Commissione, del 5 luglio 2012
    , che integra il regolamento (UE) n. 236/2012 del Parlamento europeo e del Consiglio,
    relativo alle vendite allo scoperto e a taluni aspetti dei contratti derivati
    aventi ad oggetto la copertura del rischio di inadempimento dell’emittente (
    credit default swap ), per quanto riguarda le definizioni, il calcolo delle posizioni
    corte nette, le posizioni coperte in credit default swap su emittenti sovrani,
    le soglie di notifica, le soglie di liquidità per la sospensione delle restrizioni,
    le diminuzioni significative del valore degli strumenti finanziari e gli eventi
    sfavorevoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) Nr. 918/2012 ( 2012. gada 5. jūlijs
