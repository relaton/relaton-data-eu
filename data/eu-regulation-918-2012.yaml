    un dažiem kredītriska mijmaiņas darījumu aspektiem papildina attiecībā uz
    definīcijām, neto īso pozīciju aprēķināšanu, segtiem valsts kredītriska
    mijmaiņas darījumiem, informēšanas sliekšņiem, likviditātes sliekšņiem,
    ko piemēro ierobežojumu apturēšanai, ievērojamiem finanšu instrumentu vērtības
    kritumiem un negatīviem notikumiem
  type: main
- language: lt
