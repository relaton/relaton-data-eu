    Hinblick auf Begriffsbestimmungen, die Berechnung von Netto-Leerverkaufspositionen,
    gedeckte Credit Default Swaps auf öffentliche Schuldtitel, Meldeschwellen, Liquiditätsschwellen
    für die vorübergehende Aufhebung von Beschränkungen, signifikante Wertminderungen
    bei Finanzinstrumenten und ungünstige Ereignisse
  type: main
