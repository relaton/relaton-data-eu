    carni bovine detenute dagli organismi d' intervento e recante modifica del regolamento
    (CEE) n. 1687/76 nonché abrogazione del regolamento (CEE) n. 2311/77
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1557/78 van de Commissie van 5 juli 1978 inzake de
    verkoop van rundvleesconserven uit interventievoorraden tegen een vooraf forfaitair
    vastgestelde prijs, tevens houdende wijziging van Verordening (EEG) nr. 1687/76
    en intrekking van Verordening (EEG) nr. 2311/77
