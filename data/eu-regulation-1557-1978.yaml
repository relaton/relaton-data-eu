    bovine détenues par les organismes d' intervention, modifiant le règlement (CEE)
    n° 1687/76 et abrogeant le règlement (CEE) n° 2311/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1557/78 der Kommission vom 5. Juli 1978 über den
    Verkauf von Rindfleischkonserven aus Bestánden der Interventionsstellen zu im
    voraus festgesetztem Pauschpreis, zur Ánderung der Verordnung (EWG) Nr. 1687/76
    und zur Aufhebung der Verordnung (EWG) Nr. 2311/77
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1557/78 af 5. juli 1978 om salg til
