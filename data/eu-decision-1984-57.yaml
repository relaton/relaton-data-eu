  content: '84/57/EEC: Commission Decision of 23 January 1984 establishing that the
    apparatus described as ''Perkin- Elmer - Atomic Absorption Spectrophotometer,
    model Zeeman/5000'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/57/CEE: Décision de la Commission du 23 janvier 1984 constatant que
    l''importation de l''appareil dénommé "Perkin-Elmer - Atomic Absorption Spectrophotometer,
    model Zeeman/5000" peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '84/57/EWG: Entscheidung der Kommission vom 23. Januar 1984, mit der festgestellt
    wird, daß das Gerät ,,PERKIN- ELMER - Atomic Absorption Spectrophotometer, model
    Zeeman/5000" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '84/57/EØF: Kommissionens beslutning af 23. januar 1984 om fastslåelse
    af, at indførsel af apparatet "Perkin Elmer - Atomic Absorption Spectrophotometer,
    model Zeeman/5000" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
