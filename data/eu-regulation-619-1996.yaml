title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 619/96 of 25 March 1996 amending Regulation
    (EEC) No 715/90 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    ACP States or in the overseas countries and territories (OCT)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 619/96 du Conseil, du 25 mars 1996, modifiant le règlement
