- language: en
  script: Latn
  content: Regulation (EEC) No 679/75 of the Council of 4 March 1975 amending Regulation
    (EEC) No 1599/71 laying down additional conditions with which imported wines for
    direct human consumption have to comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 679/75 du Conseil, du 4 mars 1975, modifiant le règlement
    (CEE) n° 1599/71 fixant les conditions supplémentaires auxquelles doivent répondre
    les vins importés destinés à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 679/75 des Rates vom 4. März 1975 zur Änderung der
    Verordnung (EWG) Nr. 1599/71 zur Festsetzung zusätzlicher Bedingungen, denen
    eingeführter Wein, der zum unmittelbaren menschlichen Verbrauch bestimmt ist,
    entsprechen muß
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 679/75 af 4. marts 1975 om ændring af forordning
    (EØF) nr. 1599/71 om fastsættelse af yderligere betingelser, som indført vin,
    der er bestemt til direkte menneskeligt forbrug, skal opfylde
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 679/75 del Consiglio, del 4 marzo 1975, recante modifica
    del regolamento (CEE) n. 1599/71 che fissa le condizioni supplementari cui devono
    rispondere i vini importati destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 679/75 van de Raad van 4 maart 1975 houdende wijziging
    van Verordening (EEG) nr. 1599/71 tot vaststelling van nadere voorwaarden waaraan
    ingevoerde wijn die is bestemd voor rechtstreekse menselijke consumptie, moet
    beantwoorden
  type: main
