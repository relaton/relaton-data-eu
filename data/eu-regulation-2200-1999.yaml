title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2200/1999 of 15 October 1999 fixing the maximum
    compensatory aid resulting from the rates for the conversion of the euro into
    national currency units and the exchange rates applicable on 1 August 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2200/1999 de la Commission, du 15 octobre 1999, fixant
    le montant maximal de l'aide compensatoire résultant des taux de conversion de
    l'euro en unité monétaire nationale ou des taux de change applicables le 1er
    août 1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2200/1999 der Kommission vom 15. Oktober 1999 zur Festsetzung
    des Höchstbetrags der Ausgleichsbeihilfe infolge der Umrechnungskurse des Euro
    in nationale Währungseinheiten oder der am 1. August 1999 geltenden Wechselkurse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2200/1999 af 15. oktober 1999 om fastsættelse
    af maksimumsbeløbet for den udligningsstøtte, der ydes som følge af kurserne
    for euroens omregning til nationale valutaenheder og de vekselkurser, der var
    gældende pr. 1. august 1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2200/1999 της Επιτροπής,
    της 15ης Οκτωβρίου 1999, με τον οποίο καθορίζεται
    το ανώτατο ποσό της αντισταθμιστικής ενίσχυσης
    που προκύπτει από τον συντελεστή μετατροπής
    του ευρώ σε μονάδες εθνικού νομίσματος ή τις
    ισοτιμίες που εφαρμόζονται την 1η Αυγούστου
    1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2200/1999, annettu 15 päivänä lokakuuta 1999,
    euron muuntokursseista kansalliseksi rahayksiköksi tai 1 päivästä elokuuta
    1999 alkaen sovellettavista valuuttakursseista johtuvien tasaustukien enimmäismäärän
    vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2200/1999 della Commissione, del 15 ottobre 1999, che
    stabilisce il massimale dell'aiuto compensativo relativo ai tassi di conversione
    dell'euro in unità monetaria nazionale o ai tassi di cambio applicabili il 1°
    agosto 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2200/1999 van de Commissie van 15 oktober 1999 tot
    vaststelling van het maximumbedrag van de compenserende steun die voortvloeit
    uit de koersen voor de omrekening van de euro in een nationale munteenheid of
    uit de op 1 augustus 1999 geldende wisselkoersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2200/1999 da Comissão, de 15 de Outubro de 1999,
    que fixa o montante máximo da ajuda compensatória resultante das taxas de conversão
    do euro em unidade monetária nacional ou das taxas de câmbio aplicáveis em
    1 de Agosto de 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2200/1999 de la Comisión, de 15 de octubre de 1999,
    por el que se fija el importe máximo de la ayuda compensatoria resultante de
    los tipos de conversión del euro en unidad monetaria nacional o de los tipos
    de cambio aplicables el 1 de agosto de 1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2200/1999 av den 15 oktober 1999 om fastställande
