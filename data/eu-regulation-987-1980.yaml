id: EURegulation9871980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 987/80 of 22 April 1980 re-establishing
    the levying of customs duties on illuminating glassware, other, falling within
    subheading 70.14 B and originating in Hong Kong to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 987/80 de la Commission, du 22 avril 1980, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d' éclairage, autres, de la sous-position 70.14 B du tarif douanier commun, originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 987/80 der Kommission vom 22. April 1980 zur Wiedereinführung
    des Zollsatzes für andere Glaswaren für Beleuchtung der Tarifstelle 70.14 B,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 987/80 af 22. april 1980 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, i andre tilfælde,
    under pos. 70.14 B, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 987/80 della Commissione, del 22 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    altre, della sottovoce 70.14 B della tariffa doganale comune, originarie di Hong
    Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n.
    2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 987/80 van de Commissie van 22 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere verlichtingsartikelen
    van glas, van post 70.14 B, van oorsprong uit Hong-Kong ten behoeve waarvan bij
    Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
