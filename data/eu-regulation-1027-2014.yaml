---
id: EURegulation10272014
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 1027/2014 of 25 July 2014 amending
    Annex I to Council Regulation (EC) No 1528/2007 applying the arrangements for
    products originating in certain states which are part of the African, Caribbean
    and Pacific (ACP) Group of States provided for in agreements establishing, or
    leading to the establishment of, Economic Partnership Agreements, as amended by
    Regulation (EU) No 527/2013 of the European Parliament and of the Council as regards
    the exclusion of a number of countries from the list of regions or states which
    have concluded negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 1027/2014 de la Commission du 25 juillet
    2014 modifiant l'annexe I du règlement (CE) n ° 1528/2007 du Conseil appliquant
    aux produits originaires de certains États appartenant au groupe des États d'Afrique,
    des Caraïbes et du Pacifique (ACP) les régimes prévus dans les accords établissant
    ou conduisant à établir des accords de partenariats économiques, modifié par
    le règlement (UE) n ° 527/2013 du Parlement européen et du Conseil modifiant
    le règlement (CE) n ° 1528/2007 du Conseil en vue d'exclure un certain nombre
    de pays de la liste des régions ou États ayant conclu des négociations
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 1027/2014 der Kommission vom 25. Juli 2014
    zur Änderung von Anhang I der Verordnung (EG) Nr. 1528/2007 des Rates mit Durchführungsbestimmungen
    zu den Regelungen der Wirtschaftspartnerschaftsabkommen oder der zu Wirtschaftspartnerschaftsabkommen
    führenden Abkommen für Waren mit Ursprung in bestimmten Staaten, die zur Gruppe
    der Staaten Afrikas, des karibischen Raums und des Pazifischen Ozeans (AKP) gehören,
    geändert durch die Verordnung (EU) Nr. 527/2013 des Europäischen Parlaments
    und des Rates, mit der einige Länder von der Liste der Regionen oder Staaten,
    die Verhandlungen abgeschlossen haben, gestrichen werden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) № 1027/2014 на Комисията
    от 25 юли 2014 година за изменение на приложение
    I към Регламент (ЕО) № 1528/2007 на Съвета за прилагане
    на режима за продукти с произход от определени
    страни, които са част от групата държави от
    Африка, Карибския и Тихоокеанския басейн (АКТБ),
    предвидени в споразуменията, установяващи
    или водещи до установяване на споразуменията
    за икономическо партньорство, както е изменен
    с Регламент (ЕС) № 527/2013 на Европейския парламент
    и на Съвета за изменение на Регламент (ЕО) №
    1528/2007 на Съвета по отношение на изключването
    на определени държави от списъка с региони
    или държави, които са приключили преговори
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 1027/2014 ze dne 25.
    července 2014 , kterým se mění příloha I nařízení Rady (ES) č. 1528/2007
    o uplatňování režimu stanoveného v dohodách zakládajících hospodářské
    partnerství nebo vedoucích k jeho založení na produkty pocházející z některých
    států, které jsou součástí skupiny afrických, karibských a tichomořských
    států (AKT), v znění nařízení Evropského parlamentu a Rady (EU) č. 527/2013,
    pokud jde o vyloučení řady zemí ze seznamu regionů nebo států, které uzavřely
    jednání
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) nr. 1027/2014 af 25. juli 2014
    om ændring af bilag I til Rådets forordning (EF) nr. 1528/2007 om anvendelse
    af de ordninger for varer med oprindelse i bestemte lande i gruppen af stater
    i Afrika, Vestindien og Stillehavet (AVS), der er fastlagt i aftaler om indgåelse
    af økonomiske partnerskabsaftaler eller i aftaler, som fører til indgåelse
    af økonomiske partnerskabsaftaler, som ændret ved Europa-Parlamentets og Rådets
    forordning (EU) nr. 527/2013 om ændring af Rådets forordning (EF) nr. 1528/2007
    for så vidt angår udelukkelse af en række lande fra listen over regioner eller
    stater, der har afsluttet forhandlinger
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) αριθ.
    1027/2014 της Επιτροπής, της 25ης Ιουλίου 2014 , για
    την τροποποίηση του παραρτήματος I του κανονισμού
    (ΕΚ) αριθ. 1528/2007 του Συμβουλίου για την εφαρμογή
