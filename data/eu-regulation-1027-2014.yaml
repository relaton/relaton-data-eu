    ή κρατών που έχουν ολοκληρώσει τις διαπραγματεύσεις
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) nr 1027/2014, 25. juuli 2014 , millega
    muudetakse nõukogu määruse (EÜ) nr 1528/2007 (millega teatavatest Aafrika,
    Kariibi mere ja Vaikse ookeani (AKV) piirkonna riikide rühma riikidest pärit
    toodete suhtes kohaldatakse korda, mis on sätestatud lepingutes, millega või
    mille tulemusel luuakse majanduspartnerlus, ning mida on muudetud Euroopa Parlamendi
    ja nõukogu määrusega (EL) nr 527/2013, millega muudetakse nõukogu määrust
    (EÜ) nr 1528/2007 seoses mitme riigi väljajätmisega läbirääkimised lõpule
    viinud piirkondade ja riikide loetelust) I lisa
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) N:o 1027/2014, annettu 25 päivänä heinäkuuta
    2014 , talouskumppanuussopimukset vahvistavissa tai niiden vahvistamiseen johtavissa
    sopimuksissa määrättyjen järjestelyjen soveltamisesta Afrikan, Karibian ja
    Tyynenmeren valtioiden ryhmän (AKT) tietyistä valtioista peräisin oleviin tuotteisiin
    annetun neuvoston asetuksen (EY) N:o 1528/2007, sellaisena kuin se on muutettuna
    neuvoston asetuksen (EY) N:o 1528/2007 muuttamisesta siltä osin kuin on kyse
    tiettyjen valtioiden poistamisesta neuvottelut päätökseen saaneiden alueiden
    ja valtioiden luettelosta annetulla Euroopan parlamentin ja neuvoston asetuksella
    (EU) N:o 527/2013, liitteen I muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) br. 1027/2014 оd 25. srpnja 2014. o izmjeni
    Priloga I. Uredbi Vijeća (EZ) br. 1528/2007 o primjeni aranžmana za proizvode
    podrijetlom iz određenih država koje pripadaju Skupini afričkih, karipskih
    i pacifičkih država (AKP) predviđenih u sporazumima o uspostavi ili koji vode
    uspostavi sporazumâ o gospodarskom partnerstvu, kako je izmijenjena Uredbom (EU)
    br. 527/2013 Europskog parlamenta i Vijeća o izmjeni Uredbe Vijeća (EZ) br.
    1528/2007 u pogledu isključivanja određenog broja zemalja s popisa regija ili
    država koje su zaključile pregovore
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1027/2014/EU felhatalmazáson alapuló rendelete ( 2014. július
    25. ) a gazdasági partnerségi megállapodásokat létrehozó vagy azok létrehozásához
    vezető megállapodásokban meghatározott, az afrikai, karibi és csendes-óceáni
    államok (AKCS-államok) csoportjának egyes tagjaiból származó termékekre
    vonatkozó szabályozások alkalmazásáról szóló 527/2013/EU európai parlamenti
    és tanácsi rendelettel a több országnak a tárgyalásaikat már lezárt régiók
    és államok listájáról való törlése tekintetében módosított 1528/2007/EK
    tanácsi rendelet I. mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 1027/2014 della Commissione, del 25 luglio
    2014 , che modifica l'allegato I del regolamento (CE) n. 1528/2007 del Consiglio
    recante applicazione dei regimi per prodotti originari di alcuni Stati appartenenti
    al gruppo degli Stati dell'Africa, dei Caraibi e del Pacifico (ACP) previsti in
    accordi che istituiscono, o portano a istituire, accordi di partenariato economico,
    quale modificato dal regolamento (UE) n. 527/2013 del Parlamento europeo e del
    Consiglio per quanto riguarda l'esclusione di alcuni paesi dall'elenco delle regioni
    o degli Stati che hanno concluso negoziati
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) Nr. 1027/2014 ( 2014. gada 25. jūlijs
    ), ar kuru groza I pielikumu Padomes Regulā (EK) Nr. 1528/2007, ar ko dažu tādu
    valstu izcelsmes izstrādājumiem, kuras ietilpst Āfrikas, Karību jūras reģiona
    un Klusā okeāna (ĀKK) valstu grupā, piemēro režīmu, kas paredzēts nolīgumos,
    ar ko izveido ekonomisko partnerattiecību nolīgumus vai kuru rezultātā notiek
    to izveide, kas grozīta ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 527/2013
    attiecībā uz vairāku valstu izslēgšanu no to reģionu vai valstu saraksta,
    kas pabeigušas sarunas
  type: main
- language: lt
  script: Latn
  content: 2014 m. liepos 25 d. Komisijos deleguotasis reglamentas (ES) Nr. 1027/2014,
    kuriuo iš dalies keičiamas Tarybos reglamento (EB) Nr. 1528/2007, kuriuo taikoma
    prekybos tam tikrų valstybių, kurios yra Afrikos, Karibų jūros ir Ramiojo
    vandenyno (AKR) valstybių grupės dalis, kilmės produktais tvarka, nustatyta
    susitarimais, kuriais sudaromi arba ketinama sudaryti ekonominės partnerystės
    susitarimus, dėl tam tikrų šalių išbraukimo iš derybas baigusių regionų
    ar valstybių sąrašo iš dalies pakeisto Europos Parlamento ir Tarybos reglamentu
    (ES) Nr. 527/2013, I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Delega tal-Kummissjoni (UE) Nru 1027/2014 tal- 25 ta' Lulju
    2014 li jemenda l-Anness I tar-Regolament tal-Kunsill (KE) Nru 1528/2007 li japplika
    l-arranġamenti għall-prodotti li joriġinaw f'ċerti Stati li huma parti mill-Grupp
    ta' Stati Afrikani, Karibej u Paċifiċi (AKP) previsti fi ftehim li jistabbilixxu,
    jew li jwasslu biex jiġu stabbiliti, Ftehim ta' Sħubija Ekonomika, kif emendat
    bir-Regolament (UE) Nru 527/2013 tal-Parlament Ewropew u tal-Kunsill li jemenda
    r-Regolament tal-Kunsill (KE) Nru 1528/2007 fir-rigward tal-esklużjoni ta' għadd
    ta' pajjiżi mil-lista ta' reġjuni jew Stati li kkonkludew in-negozjati
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) nr. 1027/2014 van de Commissie van 25 juli
    2014 tot wijziging van bijlage I bij Verordening (EG) nr. 1528/2007 tot toepassing
    van de regelingen voor goederen van oorsprong uit bepaalde staten behorende tot
    de groep van staten in Afrika, het Caribisch gebied en de Stille Oceaan (ACS),
    die zijn opgenomen in overeenkomsten tot instelling van, of leidende tot instelling
    van, een economische partnerschapsovereenkomst, zoals gewijzigd bij Verordening
    (EU) nr. 527/2013 van het Europees Parlement en de Raad met betrekking tot het
    schrappen van sommige landen van de lijst van regio's of staten die onderhandelingen
    hebben afgesloten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 1027/2014 z dnia 25 lipca 2014
    r. zmieniające załącznik I do rozporządzenia Rady (WE) nr 1528/2007 w sprawie
    stosowania uzgodnień dotyczących produktów pochodzących z niektórych państw
    wchodzących w skład grupy państw Afryki, Karaibów i Pacyfiku (AKP) przewidzianych
    w umowach ustanawiających lub prowadzących do ustanowienia umów o partnerstwie
    gospodarczym, zmienionego rozporządzeniem Parlamentu Europejskiego i Rady (UE)
    nr 527/2013 w zakresie usunięcia niektórych państw z wykazu regionów lub państw,
    które zakończyły negocjacje
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) n. ° 1027/2014 da Comissão, de 25 de julho
    de 2014 , que altera o anexo I do Regulamento (CE) n. ° 1528/2007 do Conselho
    que aplica às mercadorias originárias de determinados Estados pertencentes ao
    Grupo de Estados de África, das Caraíbas e do Pacífico (ACP) os regimes previstos
    em acordos que estabelecem ou conduzem ao estabelecimento de Acordos de Parceria
    Económica, com a redação que lhe foi dada pelo Regulamento (UE) n. ° 527/2013
    do Parlamento Europeu e do Conselho no que diz respeito à exclusão de um certo
    número de países da lista de regiões ou Estados que concluíram negociações
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 1027/2014 al Comisiei din 25 iulie 2014 de
    modificare a anexei I la Regulamentul (CE) nr. 1528/2007 al Consiliului privind
    aplicarea regimurilor aplicabile produselor originare din anumite state care fac
    parte din grupul statelor din Africa, zona Caraibilor și Pacific (ACP) prevăzute
    în acordurile de stabilire sau care duc la stabilirea Acordurilor de parteneriat
    economic, astfel cum a fost modificat prin Regulamentul (UE) nr. 527/2013 al Parlamentului
    European și al Consiliului de modificare a Regulamentului (CE) nr. 1528/2007
    al Consiliului în ceea ce privește excluderea unui număr de țări din lista
    regiunilor sau statelor care au încheiat negocierile
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 1027/2014 z 25. júla 2014 , ktorým
    sa mení príloha I k nariadeniu Rady (ES) č. 1528/2007, ktorým sa uplatňujú
    opatrenia na výrobky s pôvodom v určitých štátoch, ktoré sú súčasťou
    skupiny afrických, karibských a tichomorských (AKT) štátov, stanovené v
    dohodách, ktorými sa uzatvárajú alebo ktoré vedú k uzatvoreniu dohôd o
    hospodárskom partnerstve, zmenenému nariadením Európskeho parlamentu a Rady
    (EÚ) č. 527/2013, pokiaľ ide o vypustenie niekoľkých krajín zo zoznamu regiónov
    alebo štátov, ktoré ukončili rokovania
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) št. 1027/2014 z dne 25. julija 2014 o
    spremembi Priloge I k Uredbi Sveta (ES) št. 1528/2007 o uporabi ureditev za blago
    s poreklom iz nekaterih držav iz skupine afriških, karibskih in pacifiških
    držav (AKP), določenih v sporazumih, ki vzpostavljajo ali vodijo k vzpostavitvi
    sporazumov o gospodarskem partnerstvu, kakor je bila spremenjena z Uredbo (EU)
    št. 527/2013 Evropskega parlamenta in Sveta glede izločitve več držav s seznama
    regij ali držav, ki so zaključile pogajanja
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) n °1027/2014 de la Comisión, de 25 de julio
    de 2014 , que modifica el anexo I del Reglamento (CE) n ° 1528/2007 del Consejo,
    por el que se aplica el régimen previsto para las mercancías originarias de
    determinados Estados pertenecientes al grupo de Estados de África, del Caribe
    y del Pacífico (ACP) en los acuerdos que establecen Acuerdos de Asociación Económica
    o conducen a su establecimiento, modificado por el Reglamento (UE) n ° 527/2013
    del Parlamento Europeo y del Consejo por el que se modifica el Reglamento (CE)
    n ° 1528/2007 del Consejo a efectos de la supresión de varios países de la
    lista de regiones o Estados que han finalizado negociaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) nr 1027/2014 av den 25 juli 2014
    om ändring av bilaga I till rådets förordning (EG) nr 1528/2007 om tillämpning
    av de ordningar som ska tillämpas på produkter med ursprung i vissa stater som
    ingår i gruppen av stater i Afrika, Västindien och Stillahavsområdet (AVS)
    enligt avtal om att sluta ekonomiska partnerskapsavtal eller som leder till att
    sådana partnerskapsavtal sluts, ändrad genom Europaparlamentets och rådets
    förordning (EU) nr 527/2013 om ändring av rådets förordning (EG) nr 1528/2007
    vad gäller strykning av ett antal länder från förteckningen över regioner
    eller stater som slutfört förhandlingar
  type: main
