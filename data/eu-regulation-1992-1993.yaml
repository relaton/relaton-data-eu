    ao co-financiamento do regime destinado a incentivar a retirada das terras
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1992/93 del Consejo, de 19 de julio de 1993, por el
    que se establece el traslado de la financiación de algunas ayudas establecidas
    en los Reglamentos (CEE) nº 1096/88 y 2328/91, de la sección Orientación a
    la sección Garantía del FEOGA, y por el que se modifica el Reglamento (CEE)
    nº 2328/91 en lo relativo a la cofinanciación del régimen de fomento de la
    retirada de tierras
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1992/93 av den 19 juli 1993 om överföring
    av finansieringen av vissa stöd enligt förordningarna (EEG) nr 1096/88 och (EEG)
    nr 2328/91 från utvecklingssektionen vid EUGFJ till garantisektionen vid EUGFJ,
