title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1992/93 of 19 July 1993 transferring the financing
    of certain aids provided for in Regulations (EEC) No 1096/88 and (EEC) No 2328/91
    from the EAGGF Guidance Section to the EAGGF Guarantee Section and amending Regulation
    (EEC) No 2328/91 as regards part-financing of the system to encourage the set-aside
    of arable land
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1992/93 du Conseil, du 19 juillet 1993, prévoyant
    le passage du Fonds européen d'orientation et de garantie agricole, section «orientation»,
    au Fonds européen d'orientation et de garantie agricole, section «garantie»,
    pour le financement de certaines aides prévues par les règlements (CEE) n°
    1096/88 et (CEE) n° 2328/91, et modifiant le règlement (CEE) n° 2328/91 en
    ce qui concerne le cofinancement du régime destiné à encourager le retrait
    des terres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1992/93 des Rates vom 19. Juli 1993 zur Umstellung
    der Finanzierung bestimmter Beihilfen gemäß den Verordnungen (EWG) Nr. 1096/88
    und (EWG) Nr. 2328/91 von der Abteilung Ausrichtung auf die Abteilung Garantie
    des EAGFL und zur Änderung der Verordnung (EWG) Nr. 2328/91 bezüglich der Kofinanzierung
    der Flächenstillegungsregelung
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1992/93 af 19. juli 1993 om overgang fra
    EUGFL, Udviklingssektionen, til EUGFL, Garantisektionen, for så vidt angår finansieringen
    af visse støtteordninger, som er fastsat i forordning (EØF) nr. 1096/88 og (EØF)
    nr. 2328/91 og om ændring af forordning (EØF) nr. 2328/91 med hensyn til medfinansiering
    af ordningen til fremme af udtagningen af landbrugsarealer
  type: main
- language: el
  script: Grek
