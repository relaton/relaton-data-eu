  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1992/93 del Consiglio, del 19 luglio 1993, relativo
    al trasferimento dalla sezione «orientamento» alla sezione «garanzia» del
    FEAOG del finanziamento di alcuni aiuti istituiti dai regolamenti (CEE) n. 1096/88
    e (CEE) n. 2328/91 e che modifica il regolamento (CEE) n. 2328/91 per quanto riguarda
    il cofinanziamento del regime inteso ad incentivare il ritiro dei seminativi dalla
    produzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1992/93 van de Raad van 19 juli 1993 inzake de overheveling
    van het EOGFL, afdeling Oriëntatie, naar het EOGFL, afdeling Garantie, van de
    financiering van sommige bij de Verordeningen (EEG) nr. 1096/88 en (EEG) nr. 2328/91
    vastgestelde steunregelingen en tot wijziging van Verordening (EEG) nr. 2328/91
    ten aanzien van de medefinanciering van de regeling tot bevordering van het uit
    produktie nemen van bouwland
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1992/93 do Conselho, de 19 de Julho de 1993, que
