id: EURegulation19561978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1956/78 of 10 August 1978 re-establishing
    the levying of customs duties on Portland cement, etc., falling within heading
    No 25.23, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1956/78 de la Commission, du 10 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux ciments
    hydrauliques, etc., de la position tarifaire 25.23, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1956/78 der Kommission vom 10. August 1978 zur Wiedereinführung
    des Zollsatzes für Zement (einschließlich Zementklinker), auch gefärbt, der
    Tarifnummer 25.23, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG)
    Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1956/78 af 10. august 1978 om genindførelse
    af opkrævning af toldafgifter for portlandcement, aluminatcement, slaggecement
    og lignende hydraulisk cement, også farvet eller i form af klinker, under position
    25.23, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1956/78 della Commissione, del 10 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai cementi idraulici,
    ecc., della voce doganale 25.23, originari della Iugoslavia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1956/78 van de Commissie van 10 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op hydraulisch
    cement (cementklinker daaronder begrepen), ook indien gekleurd, van post 25.23,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
