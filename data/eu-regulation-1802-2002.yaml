    ning nende impordiks ühendusse) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1802/2002, annettu 10 päivänä lokakuuta 2002,
    eläinten terveyttä koskevista vaatimuksista eläinten, siemennesteen, munasolujen
    ja alkioiden yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa siltä osin,
    kuin niitä eivät koske direktiivin 90/425/ETY liitteessä A olevassa I jaksossa
    mainittujen erityisten yhteisön säädösten eläinten terveyttä koskevat vaatimukset,
    annetun neuvoston direktiivin 92/65/ETY liitteiden muuttamisesta annetun asetuksen
    (EY) N:o 1282/2002 oikaisemisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1802/2002 od 10. listopada 2002. o ispravku Uredbe
    (EZ) br. 1282/2002 o izmjeni Priloga Direktivi Vijeća 92/65/EEZ o utvrđivanju
    zahtjeva zdravlja životinja kojima se uređuje trgovina unutar Zajednice i uvoz
    u Zajednicu životinja, sjemena, jajnih stanica i zametaka koji ne podliježu
    zahtjevima zdravlja životinja koji su utvrđeni posebnim pravilima Zajednice
    navedenim u Prilogu A(1) Direktivi 90/425/EEZ
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1802/2002/EK rendelete (2002. október 10.) a 90/425/EGK irányelv
    A. mellékletének I. pontjában felsorolt külön közösségi szabályokban
    megállapított állat-egészségügyi követelmények hatálya alá nem tartozó
    állatok, spermák, petesejtek és embriók Közösségen belüli kereskedelmére
    és a Közösségbe történő behozatalára irányadó állat-egészségügyi
    követelmények megállapításáról szóló 92/65/EGK tanácsi irányelv mellékleteinek
    módosításáról szóló 1282/2002/EK rendelet helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1802/2002 della Commissione, del 10 ottobre 2002, che
    rettifica il regolamento (CE) n. 1282/2002 recante modifica degli allegati della
    direttiva 92/65/CEE che stabilisce norme sanitarie per gli scambi e le importazioni
    nella Comunità di animali, sperma, ovuli ed embrioni non soggetti, per quanto
    riguarda le condizioni di polizia sanitaria, alle normative comunitarie specifiche
    di cui all'allegato A, sezione I, della direttiva 90/425/CEE
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1802/2002 (2002. gada 10. oktobris), ar kuru
    labo Regulu (EK) Nr. 1282/2002, ar ko groza pielikumus Padomes Direktīvai 92/65/EEK,
    kurā noteiktas dzīvnieku veselības prasības par tādu dzīvnieku, spermas,
    olšūnu un embriju tirdzniecību un importu Kopienā, uz kuriem neattiecas Direktīvas
    90/425/EEK A pielikuma 1. punktā minētajos īpašajos Kopienas noteikumos paredzētās
    dzīvnieku veselības prasības
  type: main
- language: lt
  script: Latn
  content: 2002 m. spalio 10 d. Komisijos reglamentas (EB) Nr. 1802/2002, ištaisantis
    Reglamentą (EB) Nr. 1282/2002, iš dalies keičiantį Tarybos direktyvos 92/65/EEB,
    nustatančios gyvūnų sveikatos reikalavimus, reglamentuojančius prekybą Bendrijoje
    gyvūnais, sperma, kiaušialąstėmis bei embrionais, kuriems netaikomi gyvūnų
    sveikatos reikalavimai, nustatyti specialiose Bendrijos taisyklėse, nurodytose
    Direktyvos 90/425/EEB A priedo 1 dalyje, bei jų importą į Bendriją, priedus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1802/2002 ta’ l-10 ta’ Ottubru
    2002 li jikkoreġi r-Regolament (KE) Nru 1282/2002 li jemenda l-Annessi għad-Direttiva
    tal-Kunsill 92/65/KEE li tistabbilixxi r-rekwiżiti dwar is-saħħa ta’ l-annimali
    fir-regolamentazzjoni tal-kummerċ fil- u l-importazzjoni għal ġol-Komunità
    ta’ annimali, sperma, ova u embrijoni li mhumiex suġġetti għar-rekwiżiti
    dwar is-saħħa ta’ l-annimali stabbiliti f’Regoli speċifiċi tal-Komunità
    msemmija fl-Anness A(1) għad-Direttiva 90/425/KEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1802/2002 van de Commissie van 10 oktober 2002 tot
    rectificatie van Verordening (EG) nr. 1282/2002 houdende wĳziging van de bĳlagen
    bĳ Richtlĳn 92/65/EEG van de Raad tot vaststelling van de veterinairrechtelĳke
    voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren,
    sperma, eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelĳke
    voorschriften geen specifieke communautaire regelgeving als bedoeld in bĳlage
    A, onder 1, van Richtlĳn 90/425/EEG geldt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1802/2002 z dnia 10 października 2002
    r. zawierające sprostowanie rozporządzenia (WE) nr 1282/2002 zmieniającego
    załączniki do dyrektywy Rady 92/65/EWG ustanawiającej wymagania dotyczące
    zdrowia zwierząt, regulujące handel i przywóz do Wspólnoty zwierząt, nasienia,
    komórek jajowych i zarodków nieobjętych wymaganiami dotyczącymi zdrowia zwierząt
    ustanowionymi w szczególnych zasadach wspólnotowych określonych w załączniku
    A pkt 1 do dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1802/2002 da Comissão, de 10 de Outubro de 2002,
    que altera o Regulamento (CE) n.° 1282/2002 que altera os anexos da Directiva
    92/65/CEE do Conselho que define as condições de polícia sanitária que regem
    o comércio e as importações na Comunidade de animais, sémens, óvulos e embriões
    não sujeitos, no que se refere às condições de polícia sanitária, às regulamentações
    comunitárias específicas referidas na secção I do anexo A da Directiva 90/425/CEE
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1802/2002 al Comisiei din 10 octombrie 2002 de rectificare
    a Regulamentului (CE) nr. 1282/2002 de modificare a anexelor la Directiva 92/65/CEE
    a Consiliului de definire a condițiilor de sănătate animală care reglementează
    comerțul și importurile în Comunitate de animale, material seminal, ovule și
    embrioni care nu se supun, în ceea ce privește condițiile de sănătate animală,
    reglementărilor comunitare specifice prevăzute la punctul I din anexa A la Directiva
    90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1802/2002 z 10. októbra 2002, ktorým sa opravuje
    nariadenie (ES) č. 1282/2002, ktorým sa menia a dopĺňajú prílohy k smernici
    Rady 92/65/EHS, ktorou sa ustanovujú veterinárne požiadavky na obchodovanie
    so zvieratami, spermou, vajíčkami a embryami, na ktoré sa nevzťahujú veterinárne
    požiadavky ustanovené v osobitných právnych predpisoch spoločenstva uvedených
    v prílohe A oddiele I k smernici 90/425/EHS, v rámci spoločenstva a na ich
    dovoz do spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1802/2002 z dne 10. oktobra 2002 o popravkih
    Uredbe (ES) št. 1282/2002 o spremembi prilog k Direktivi Sveta 92/65/EGS o zahtevah
    zdravstvenega varstva živali za trgovino in za uvoz v Skupnost živali, semena,
    jajčnih celic in zarodkov, za katere ne veljajo zahteve zdravstvenega varstva
    živali, določene v posebnih pravilih Skupnosti iz Priloge A(I) k Direktivi 90/425/EGSBesedilo
    velja za ES
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1802/2002 de la Comisión, de 10 de octubre de 2002,
    por el que se rectifica el Reglamento (CE) n° 1282/2002 que modifica determinados
    anexos de la Directiva 92/65/CEE del Consejo, por la que se establecen las condiciones
    de policía sanitaria aplicables a los intercambios y las importaciones en la
    Comunidad de animales, esperma, óvulos y embriones no sometidos, con respecto
    a estas condiciones, a las normativas comunitarias específicas a que se refiere
    la sección I del anexo A de la Directiva 90/425/CEE
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1802/2002 av den 10 oktober 2002 om rättelse
    av förordning (EG) nr 1282/2002 om ändring av bilagorna till rådets direktiv
    92/65/EEG om fastställande av djurhälsokrav i handeln inom och importen till
    gemenskapen av djur, sperma, ägg (ova) och embryon som inte faller under de krav
    som fastställs i de specifika gemenskapsregler som avses i bilaga A.I till direktiv
    90/425/EEG
