title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1802/2002 of 10 October 2002 correcting Regulation
    (EC) No 1282/2002 amending Annexes to Council Directive 92/65/EEC laying down
    animal health requirements governing trade in and imports into the Community of
    animals, semen, ova and embryos not subject to animal health requirements laid
    down in specific Community rules referred to in Annex A(1) to Directive 90/425/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1802/2002 de la Commission du 10 octobre 2002 rectifiant
    le règlement (CE) n° 1282/2002 modifiant les annexes de la directive 92/65/CEE
    du Conseil définissant les conditions de police sanitaire régissant les échanges
    et les importations dans la Communauté d'animaux, de spermes, d'ovules et d'embryons
    non soumis, en ce qui concerne les conditions de police sanitaire, aux réglementations
    communautaires spécifiques visées à l'annexe A, section I, de la directive
    90/425/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1802/2002 der Kommission vom 10. Oktober 2002 zur Berichtigung
    der Verordnung (EG) Nr. 1282/2002 zur Änderung der Anhänge der Richtlinie 92/65/EWG
    des Rates über die tierseuchenrechtlichen Bedingungen für den Handel mit Tieren,
    Samen, Eizellen und Embryonen in der Gemeinschaft sowie für ihre Einfuhr in die
    Gemeinschaft, soweit sie diesbezüglich nicht den spezifischen Gemeinschaftsregelungen
    nach Anhang A Abschnitt I der Richtlinie 90/425/EWG unterliegen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1802/2002 на Комисията от 10
    октомври 2002 година за поправка на Регламент
    (ЕО) № 1282/2002 за изменение на приложенията към
    Директива 92/65/ЕИО на Съвета за определяне на
    ветеринарно-санитарните изисквания относно
    търговията и вноса в Общността на животни,
    сперма, яйцеклетки и ембриони, които не са предмет
    на ветеринарно-санитарните изисквания, определени
    в специалните правила на Общността, посочени
    в приложение А, раздел I към Директива 90/425/ЕИО
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1802/2002 ze dne 10. října 2002, kterým
    se opravuje nařízení Komise (ES) č. 1282/2002, kterým se mění přílohy
    směrnice Rady 92/65/EHS o veterinárních předpisech pro obchod se zvířaty,
    spermatem, vajíčky a embryi uvnitř Společenství a jejich dovoz do Společenství,
    pokud se na ně nevztahují zvláštní veterinární předpisy Společenství
    uvedené v příloze A oddíle I směrnice 90/425/EHS
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1802/2002 af 10. oktober 2002 om berigtigelse
    af forordning (EF) nr. 1282/2002 om ændring af bilagene til Rådets direktiv
    92/65/EØF om dyresundhedsmæssige betingelser for samhandel med og indførsel
    til Fællesskabet af dyr samt sæd, æg og embryoner, der for så vidt angår
    disse betingelser ikke er underlagt specifikke fællesskabsbetingelser som omhandlet
    i bilag A, del I, til direktiv 90/425/EØF
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1802/2002 της Επιτροπής,
