type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2308/75 of the Commission of 9 September 1975 re-establishing
    the levying of customs duties on outer garments, clothing accessories and other
    articles, knitted or crocheted, not elastic or rubberized, of cotton, falling
    within subheadings 60.05 A ex II and ex B, originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3046/74
    of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2308/75 de la Commission, du 9 septembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessus, accessoires du vêtement et autres articles de bonneterie non élastique
    ni caoutchoutée, de coton, des sous-positions tarifaires 60.05 A EX II, EX B,
    originaires de la Corée du Sud bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2308/75 der Kommission vom 9. September 1975 über
    die Wiedereinführung des Zollsatzes für Oberkleidung, Bekleidungszubehör und
    andere Wirkwaren, weder gummielastisch noch kautschutiert, aus Baumwolle, der
    Tarifstellen 60.05 A ex II, ex B, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2308/75 af 9. september 1975 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande og tilbehør til
    beklædningsgenstande og andre varer af trikotage, ikke elastik eller gummeret,
    af bomuld, under underpositionerne 60.05 A ex II, og ex B, som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2308/75 della Commissione, del 9 settembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti esterni,
    accessori di abbigliamento ed altri manufatti, a maglia non elastica né gommata,
    di cotone, delle sottovoci doganali 60.05 A ex II e ex B, originari della Corea
    del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3046/ 74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2308/75 van de Commissie van 9 september 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bovenkleding,
    kledingtoebehoren en andere artikelen van niet-elastisch of van niet-gegummeerd
    brei- of haakwerk, van katoen van onderverdeling 60.05 A ex II, ex B, van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3046/74 van de Raad van 2 december 1974
  type: main
