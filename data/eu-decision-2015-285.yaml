- language: en
  script: Latn
  content: Council Decision (EU) 2015/285 of 17 February 2015 on the position to be
    adopted on behalf of the European Union within the EEA Joint Committee established
    by the Agreement on the European Economic Area, as regards the replacement of
    Protocol 4 to that Agreement, on rules of origin, by a new Protocol which is aligned
    to the Regional Convention on pan-Euro-Mediterranean preferential rules of origin
  type: main
- language: fr
  script: Latn
