---
id: EUDecision1975473
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 June 1975 authorizing the Republic of France
    not to apply Community treatment to garments and articles of textiles other than
    cotton, falling within heading Nos ex 60.02, ex 60.04, ex 60.05, ex 61.01, ex
    61.02 and ex 61.03 of the Common Customs Tariff, originating in South Korea and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/473/CEE: Décision de la Commission, du 18 juin 1975, autorisant la
    République française à exclure du traitement communautaire les articles confectionnés
    en matières textiles autres que le coton, des positions Ex 60.02, Ex 60.04, Ex
    60.05, Ex 61.01, Ex 61.02 et Ex 61.03 du Tarif douanier commun, originaires de
    Corée du Sud et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Juni 1975, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung und konfektionierte Waren aus anderen
    Spinnstoffen als aus Baumwolle der Tarifnummern ex 60.02, ex 60.04, ex 60.05,
    ex 61.01, ex 61.02 und ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. juni 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande og konfektionerede
    tekstilvarer af tekstilstoffer (dog ikke bomuld), som henhører under position
    ex 60.02, ex 60.04, ex 60.05, ex 61.01 ex 61.02, ex 61.03 i den fælles toldtarif,
    har oprindelse i Sydkorea og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 giugno 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i manufatti confezionati in
    materie tessili diverse dal cotone delle voci ex 60.02, ex 60.04, ex 60.05, ex
    61.01, ex 61.02 e ex 61.03 della tariffa doganale comune, originari della Corea
    del Sud e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 juni 1975 waarbij de Franse Republiek
    wordt gemachtigd kleding en geconfectioneerde artikelen uit textielstoffen andere
    dan van katoen van posten ex 60.02, ex 60.04, ex 60.05, ex 61.01, ex 61.02 en
    ex 61.03 van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
