title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 561/2003 of 27 March 2003 amending, as regards
    exceptions to the freezing of funds and economic resources, Regulation (EC) No
    881/2002 imposing certain specific restrictive measures directed against certain
    persons and entities associated with Usama bin Laden, the Al-Qaida network and
    the Taliban
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 561/2003 du Conseil du 27 mars 2003 modifiant, en ce
    qui concerne les exceptions au gel des fonds et des ressources économiques, le
    règlement (CE) n° 881/2002 instituant certaines mesures restrictives spécifiques
    à l'encontre de certaines personnes et entités liées à Oussama ben Laden,
    au réseau Al-Qaida et aux Taliban
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 561/2003 des Rates vom 27. März 2003 zur Änderung
    der Verordnung (EG) Nr. 881/2002 über die Anwendung bestimmter spezifischer restriktiver
    Maßnahmen gegen bestimmte Personen und Organisationen, die mit Osama bin Laden,
    dem Al-Qaida-Netzwerk und den Taliban in Verbindung stehen, im Hinblick auf Ausnahmen
    vom Einfrieren von Geldern und wirtschaftlichen Ressourcen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 561/2003 на Съвета от 27 март
    2003 година за изменение на Регламент (ЕО) № 881/2002
    за налагане на някои специфични ограничителни
    мерки, насочени срещу определени лица, свързани
    с Осама бен Ладен, мрежата на Ал Кайда и талибаните
    по отношение на изключенията за замразяване
    на финансови средства и други финансови ресурси
  type: main
- language: cs
  script: Latn
  content: Nařízení rady (ES) č. 561/2003 ze dne 27. března 2003, kterým se
    mění nařízení (ES) č. 881/2002 o zavedení některých zvláštních omezujících
    opatření namířených proti některým osobám a subjektům spojeným s Usámou
    bin Ládinem, sítí Al-Kajdá a Talibanem, pokud jde o výjimky ze zmrazení
    finančních prostředků a hospodářských zdrojů
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 561/2003 af 27. marts 2003 om ændring, for
    så vidt angår undtagelserne fra indefrysningen af midler og økonomiske ressourcer,
    af forordning (EF) nr. 881/2002 om indførelse af visse specifikke restriktive
    foranstaltninger mod visse personer og enheder, der har tilknytning til Usama
    bin Laden, Al-Qaida-organisationen og Taliban
  type: main
- language: el
  script: Grek
