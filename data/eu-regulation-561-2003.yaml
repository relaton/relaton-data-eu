    rozporządzenie (WE) nr 881/2002 wprowadzające niektóre szczególne środki
    ograniczające skierowane przeciwko niektórym osobom i podmiotom związanym z
    Osamą bin Ladenen, siecią Al-Qaida i Talibami
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 561/2003 do Conselho, de 27 de Março de 2003, que
