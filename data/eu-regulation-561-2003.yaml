    maatregelen tegen sommige personen en entiteiten die banden hebben met Osama bin
    Laden, het Al Qa'ida-netwerk en de Taliban, met betrekking tot uitzonderingen
    op de bevriezing van tegoeden en economische middelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 561/2003 z dnia 27 marca 2003 r. zmieniające,
