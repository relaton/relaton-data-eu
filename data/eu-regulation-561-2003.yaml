    u ta' riżorsi ekonomiċi, ir-Regolament (KE) Nru 881/2002 li jimponi ċerti miżuri
    restrittivi speċifiċi diretti kontra ċerti persuni u entitajiet assoċjati
    ma' Usama bin Laden, in-network ta' Al-Qaida u t-Taliban
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 561/2003 van de Raad van 27 maart 2003 tot wĳziging
