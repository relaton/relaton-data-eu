    Reglamentą (EB) Nr. 881/2002, nustatantį tam tikras specialias ribojančias
    priemones, taikomas tam tikriems asmenims ir subjektams, susijusiems su Osama
    bin Ladenu, Alkaeda tinklu ir Talibanu
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 561/2003 tas-27 ta' Marzu 2003 li jemenda,
