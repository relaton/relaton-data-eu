    osoba i subjekata povezanih s Osamom bin Ladenom, mrežom Al-Qaidom i talibanima
    s obzirom na iznimke od zamrzavanja financijskih sredstava i ekonomskih izvora
  type: main
- language: hu
  script: Latn
  content: A Tanács 561/2003/EK rendelete (2003. március 27.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedésekről szóló
    881/2002/EK rendeletnek a pénzkészletek és egyéb pénzügyi források befagyasztása
    alóli kivételek tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 561/2003 del Consiglio, del 27 marzo 2003, che modifica,
    per quanto riguarda le deroghe al congelamento dei capitali e delle risorse economiche,
    il regolamento (CE) n. 881/2002 che impone specifiche misure restrittive nei confronti
    di determinate persone ed entità associate a Osama bin Laden, alla rete Al-Qaida
    e ai Talibani
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 561/2003 (2003. gada 27. marts), ar kuru attiecībā
    uz izņēmumiem līdzekļu un saimniecisko resursu iesaldēšanā groza Regulu
    (EK) Nr. 881/2002, ar ko nosaka konkrētus, īpašus, ierobežojošus, pret noteiktām
    personām un organizācijām, kuras saistītas ar Osamu Bin Ladenu, organizācijas
    Al-Qaida tīklu un Taliban, vērstus pasākumus
  type: main
- language: lt
  script: Latn
  content: 2003 m. kovo 27 d. Tarybos reglamentas (EB) Nr. 561/2003, iš dalies keičiantis,
