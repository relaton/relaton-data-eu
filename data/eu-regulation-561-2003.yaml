    võrgu ja Talibaniga seotud isikute ja üksuste vastu suunatud eripiirangud
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 561/2003, annettu 27 päivänä maaliskuuta 2003,
    tiettyihin Osama bin Ladenia, al-Qaida-verkostoa ja Talebania lähellä oleviin
    henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista toimenpiteistä
    annetun asetuksen (EY) N:o 881/2002 muuttamisesta siltä osin kuin on kyse varojen
    ja taloudellisten resurssien jäädyttämistä koskevista poikkeuksista
  type: main
