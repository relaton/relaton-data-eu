  script: Latn
  content: Regulation (EU) 2024/2594 of the European Parliament and of the Council
    of 18 September 2024 laying down conservation, management and control measures
    applicable in the area covered by the Convention on future multilateral cooperation
    in the North-East Atlantic fisheries, amending Regulation (EU) 2019/1241 of the
    European Parliament and of the Council and Council Regulation (EC) No 1224/2009,
    and repealing Regulation (EU) No 1236/2010 of the European Parliament and of the
    Council and Council Regulations (EEC) No 1899/85 and (EEC) No 1638/87
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2024/2594 du Parlement européen et du Conseil du 18 septembre
    2024 établissant les mesures de conservation, de gestion et de contrôle applicables
    dans la zone de la convention sur la future coopération multilatérale dans les
    pêches de l’Atlantique du Nord-Est, modifiant le règlement (UE) 2019/1241
    du Parlement européen et du Conseil et le règlement (CE) n° 1224/2009 du Conseil,
    et abrogeant le règlement (UE) n° 1236/2010 du Parlement européen et du Conseil
    et les règlements (CEE) n° 1899/85 et (CEE) n° 1638/87 du Conseil
  type: main
