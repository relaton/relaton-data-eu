    Zusammenarbeit auf dem Gebiet der Fischerei im Nordostatlantik, zur Änderung
    der Verordnung (EU) 2019/1241 des Europäischen Parlaments und des Rates und der
    Verordnung (EG) Nr. 1224/2009 des Rates sowie zur Aufhebung der Verordnung (EU)
