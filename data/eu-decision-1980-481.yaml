title:
- language: en
  script: Latn
  content: '80/481/EEC: Commission Decision of 21 April 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''Perkin Elmer-Spectrophotofluorometer, model MPF-44A''
    are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/481/CEE: Décision de la Commission, du 21 avril 1980, constatant que
    les conditions requises pour l'' admission en franchise des droits du tarif douanier
    commun de l'' appareil scientifique dénommé "Perkin Elmer-Spectrophotofluorometer,
    model MPF-44 A" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/481/EWG: Entscheidung der Kommission vom 21. April 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    für das wissenschaftliche Gerät ,,Perkin Elmer-Spectrophotofluorometer, model
    MPF-44 A'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/481/EØF: Kommissionens beslutning af 21. april 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Perkin Elmer-Spectrophotofluorometer, model MPF-44
    A" ikke er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/481/ΕΟΚ: Απόφαση τής Επιτροπής τής 21ης
    Απριλίου 1980 περί διαπιστώσεως ότι οι όροι πού
    απαιτούνται γιά τήν παροχή ατελείας ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου στήν επιστημονική
    συσκευή μέ τήν ονομασία «Perkin Elmer—Spectrophotofluorometer,
    model MPF - 44 A» δέν πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/481/CEE: Decisione della Commissione, del 21 aprile 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Perkin Elmer-Spectrophotofluorometer,
    model MPF-44A" non sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/481/EEG: Beschikking van de Commissie van 21 april 1980 vaststellende
    dat de voorwaarden welke vereist zijn voor de toelating met vrijstelling van de
    rechten van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat
    genaamd ,,PERKIN ELMER-Spectrophotofluorometer, model MPF-44 A'' '' , niet vervuld
    zijn'
