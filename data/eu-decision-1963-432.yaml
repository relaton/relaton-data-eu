title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 juin 1963, relative à la fixation à
    compter du 1er juillet 1963, du taux du prélèvement à percevoir sur les marchandises
    obtenues dans les conditions visées à l'article 3 de la décision du 28 juin
    1960 et à l'article premier de la décision du 5 décembre 1960
  type: main
- language: de
  script: Latn
  content: '63/432/EWG: Entscheidung der Kommission vom 27. Juni 1963 über die Festsetzung
    des ab 1. Juli 1963 geltenden Satzes des anteiligen Zolls, der auf Waren zu erheben
    ist, die unter den Voraussetzungen des Artikels 3 der Entscheidung vom 28. Juni
    1960 und des Artikels 1 der Entscheidung vom 5. Dezember 1960 hergestellt wurden'
  type: main
- language: it
  script: Latn
  content: '63/432/CEE: Decisione della Commissione del 27 giugno 1963 relativa alla
    determinazione dell''aliquota del prelievo da percepire a decorrere dal 1 luglio
    1963 sulle merci ottenute nelle condizioni previste dall''articolo 3 della decisione
    del 28 giugno 1960 e dall''articolo 1 della decisione del 5 dicembre 1960'
  type: main
- language: nl
  script: Latn
  content: '63/432/EEG: Beschikking van de Commissie van 27 juni 1963 houdende vaststelling,
    voor de periode ingaande 1 juli 1963, van de hoogte van de heffing waaraan zijn
    onderworpen de goederen verkregen onder de in artikel 3 van de beschikking van
    28 juni 1960 en in artikel 1 van de beschikking van 5 december 1960 gestelde voorwaarden'
  type: main
