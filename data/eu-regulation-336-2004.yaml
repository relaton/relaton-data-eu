title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 336/2004 of 26 February 2004 amending Regulation
    (EC) No 2241/2003 as regards the available quantity for which import licence applications
    for certain egg sector products and poultrymeat products may be lodged for the
    period from 1 to 30 April 2004
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 336/2004 de la Commission du 26 février 2004 modifiant
    le règlement (CE) n° 2241/2003 en ce qui concerne la quantité disponible pour
    laquelle les demandes de certificats d'importation pour certains produits du secteur
    des œufs et de la viande de volaille peuvent être introduites pour la période
    du 1er avril au 30 avril 2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 336/2004 der Kommission vom 26. Februar 2004 zur Änderung
    der Verordnung (EG) Nr. 2241/2003 hinsichtlich der verfügbaren Menge, für die
    Anträge auf Einfuhrlizenzen für bestimmte Produkte des Sektors Eier und Geflügelfleisch
    für den Zeitraum vom 1. bis 30. April 2004 eingereicht werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 336/2004 af 26. februar 2004 om ændring
    af forordning (EF) nr. 2241/2003 for så vidt angår den disponible mængde, for
    hvilken der kan indgives importlicensansøgninger for visse ægprodukter og fjerkrækød
    for perioden 1. til 30. april 2004
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 336/2004 της Επιτροπής,
    της 26ης Φεβρουαρίου 2004, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 2241/2003 όσον αφορά τη
    διαθέσιμη ποσότητα για την οποία μπορούν να
    υποβληθούν αιτήσεις χορηγήσεως πιστοποιητικών
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών, για την
    περίοδο από την 1η Απριλίου έως τις 30 Απριλίου
    2004
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 336/2004, annettu 26 päivänä helmikuuta 2004,
    asetuksen (EY) N:o 2241/2003 muuttamisesta siltä osin kuin on kyse käytettävissä
    olevasta määrästä, jolle tiettyjä muna-alan ja siipikarjanliha-alan tuotteita
    koskevia tuontitodistushakemuksia voidaan jättää 1 päivän huhtikuuta ja 30
    päivän huhtikuuta 2004 välisen ajan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 336/2004 della Commissione, del 26 febbraio 2004, recante
    modifica del regolamento (CE) n. 2241/2003 per quanto concerne il quantitativo
    disponibile per il quale possono essere presentate le domande di titoli d'importazione
    per taluni prodotti del settore delle uova e del pollame per il periodo dal 1°
    aprile al 30 aprile 2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 336/2004 van de Commissie van 26 februari 2004 houdende
    wĳziging van Verordening (EG) nr. 2241/2003 met betrekking tot de beschikbare
    hoeveelheid waarvoor certificaataanvragen voor de invoer van bepaalde producten
    van de sector eieren en slachtpluimvee kunnen worden ingediend voor de periode
    van 1 tot en met 30 april 2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 336/2004 da Comissão, de 26 de Fevereiro de 2004,
    que altera o Regulamento (CE) n.° 2241/2003 no que diz respeito à quantidade
    disponível em relação à qual os pedidos de certificados de importação para
    determinados produtos do sector dos ovos e da carne de aves de capoeira podem
    ser apresentados para o período de 1 de Abril a 30 de Abril de 2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 336/2004 de la Comisión, de 26 de febrero de 2004,
    que modifica el Reglamento (CE) n° 2241/2003 en lo que respecta a la cantidad
    disponible por la que pueden presentarse las solicitudes de certificados de importación
    para determinados productos del sector de los huevos y la carne de aves de corral
    para el período comprendido entre el 1 y el 30 de abril de 2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 336/2004 av den 26 februari 2004 om ändring
    av förordning (EG) nr 2241/2003 när det gäller den tillgängliga kvantitet
    för vilken importlicensansökningar för vissa produkter inom sektorn för ägg
    och fjäderfäkött får lämnas in mellan den 1 och 30 april 2004
  type: main
