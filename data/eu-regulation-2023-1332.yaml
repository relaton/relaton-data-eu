    preparatą kaip mėsinių viščiukų, dedeklinių vištaičių, penimų kalakutų,
    veislei auginamų kalakutų lesalų priedą ir nujunkytų paršelių pašarų
    priedą (leidimo turėtoja – bendrovė „Roal Oy“) atnaujinimo, kuriuo panaikinamas
    Reglamentas (EB) Nr. 902/2009
