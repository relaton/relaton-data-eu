    получена от Trichoderma reesei CBS 114044, като фуражна добавка
    за пилета за угояване, пилета, отглеждани за
    кокошки носачки, пуйки за угояване, пуйки, отглеждани
    за разплод, и отбити прасенца (притежател на
    разрешението: Roal Oy), и за отмяна на Регламент
    (ЕО) № 902/2009'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2023/1332 ze dne 29. června 2023
    o obnovení povolení přípravku endo-1,4-beta-xylanázy z Trichoderma reesei
    CBS 114044 jako doplňkové látky pro výkrm kuřat, odchov kuřic, výkrm krůt,
    odchov krůt a odstavená selata (držitel povolení: Roal Oy) a o zrušení nařízení
    (ES) č. 902/2009'
  type: main
- language: da
  script: Latn
