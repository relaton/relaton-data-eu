title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/1332 of 29 June 2023 concerning
    the renewal of the authorisation of a preparation of endo-1,4-beta-xylanase produced
    by Trichoderma reesei CBS 114044 as a feed additive for chickens for fattening,
    chickens reared for laying, turkeys for fattening, turkeys reared for breeding
    and weaned piglets (holder of the authorisation: Roal Oy), and repealing Regulation
    (EC) No 902/2009'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/1332 de la Commission du 29 juin 2023
    concernant le renouvellement de l’autorisation d’une préparation à base
    d’endo-1,4-β-xylanase produite par Trichoderma reesei CBS 114044 en tant qu’additif
    dans l’alimentation des poulets d’engraissement, des poulettes élevées pour
    la ponte, des dindes d’engraissement, des dindons élevés pour la reproduction
    et des porcelets sevrés (titulaire de l’autorisation: Roal Oy), et abrogeant
    le règlement (CE) no 902/2009'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/1332 der Kommission vom 29. Juni 2023
    zur Verlängerung der Zulassung einer Zubereitung von Endo-1,4-beta-xylanase aus
    Trichoderma reesei CBS 114044 als Futtermittelzusatzstoff für Masthühner, Junghennen,
    Masttruthühner, Truthühner für Zuchtzwecke und entwöhnte Ferkel (Zulassungsinhaber:
    Roal Oy) und zur Aufhebung der Verordnung (EG) Nr. 902/2009'
  type: main
- language: bg
