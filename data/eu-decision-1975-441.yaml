title:
- language: en
  script: Latn
  content: '75/441/EEC: Council Decision of 24 June 1975 establishing a common procedure
    for the exchange of information between the surveillance and monitoring networks
    based on data relating to atmospheric pollution caused by certain compounds and
    suspended particulates'
  type: main
- language: fr
  script: Latn
  content: '75/441/CEE: Décision du Conseil, du 24 juin 1975, instituant une procédure
    commune d'' échange d'' informations entre les réseaux de surveillance et de
    contrôle en ce qui concerne les données relatives à la pollution atmosphérique
    causée par certains composés de cendre et des particules en suspension'
  type: main
- language: de
  script: Latn
  content: '75/441/EWG: Entscheidung des Rates vom 24. Juni 1975 zur Einführung eines
    gemeinsamen Verfahrens für einen Informationsaustausch zwischen den Überwachungs-
    und Kontrollnetzen betreffend die Daten über die Luftverschmutzung durch bestimmte
    Schwefelverbindungen und durch Schwebstoffe'
  type: main
- language: da
  script: Latn
  content: '75/441/EØF: Rådets Beslutning af 24. juni 1975 om indførelse af en
    fælles procedure for udveksling af information mellem overvågnings- og kontrolnet
    med hensyn til data om luftforurening forårsaget af svovlforbindelser og svævestøv'
  type: main
- language: el
  script: Grek
  content: '75/441/ΕΟΚ: Απόφαση τού Συμβουλίου τής 24ης
    Ιουνίου 1975 περί καθορισμού κοινής διαδικασίας
    γιά τήν ανταλλαγή πληροφοριών μεταξύ τών δικτύων
    επιβλέψεως καί ελέγχου τών στοιχείων τών σχετικών
    μέ τή ρύπανση τής ατμόσφαιρας, η οποία προκαλείται
    από ορισμένες ενώσεις θείου καί από αιωρούμενα
    σωματίδια'
  type: main
- language: it
