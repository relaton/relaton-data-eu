title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1078/81 of 23 April 1981 extending the period
    of validity of the measures provided for by Regulation (EEC) No 3191/80 on transitional
    measures concerning non-recovery of the variable slaughter premium for sheepment
    and goatmeat products exported from the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1078/81 de la Commission, du 23 avril 1981, prorogeant
    la durée de validité des mesures prévues par le règlement (CEE) n° 3191/80
    relatif à des mesures transitoires en ce qui concerne la non-récupération de
    la prime variable à l' abattage pour les produits du secteur des viandes ovine
    et caprine exportées hors de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1078/81 der Kommission vom 23. April 1981 zur Berichtigung
    der Verordnung (EWG) Nr. 3191/80 mit Übergangsmaßnahmen über die Nichtwiedereinziehung
    der variablen Schlachtprämie bei Erzeugnissen des Schaf- und Ziegenfleischsektors,
    die aus der Gemeinschaft ausgeführt worden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1078/81 af 23. april 1981 om forlængelse
    af gyldighedsperioden for de foranstaltninger, der er fastsat ved forordning (EØF)
    nr. 3191/80 om overgangsforanstaltninger indebærende, at den variable slagtepræmie
    ikke tilbagebetales for produkter fra sektoren for fåre- og gedekød, som udføres
    fra Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1078/81 τής Επιτροπής
    τής 23ης Απριλίου 1981 περί παρατάσεως τής διαρκείας
    τής ισχύος τών μέτρων πού προβλέπονται από
    τόν κανονισμό (ΕΟΚ) αριθ. 3191/80 «περί μεταβατικών
    μέτρων περί τής μή επανακτήσεως τής μεταβλητής
    πριμοδοτήσεως γιά σφαγή, γιά τά προϊόντα τού
    τομέα τού προβείου καί αιγείου κρέατος πού
    εξάγονται εκτός τής Κοινότητος»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1078/81 della Commissione, del 23 aprile 1981, che
    proroga la durata di validità delle misure previste dal regolamento (CEE) n.
    3191/80 recante misure transitorie che autorizzano a non prelevare un importo
    pari al premio variabile alla macellazione per i prodotti del settore delle carni
    ovine e caprine esportati fuori della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1078/81 van de Commissie van 23 april 1981 houdende
    verlenging van de geldigheidsduur van de maatregelen vastgesteld bij Verordening
    (EEG) nr. 3191/80 inzake overgangsmaatregelen voor het niet terugvorderen van
    de variabele slachtpremie voor de produkten van de sector schape- en geitevlees,
    die worden uitgevoerd uit de Gemeenschap
  type: main
