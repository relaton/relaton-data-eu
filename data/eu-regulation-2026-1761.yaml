  content: Commission Delegated Regulation (EU) 2026/1761 of 12 June 2026 amending
    Regulation (EU) 2018/975 of the European Parliament and of the Council as regards
    the time limits for the submission of the annual scientific report and total annual
    catch reporting, line weighting standards in Annex I, vessel data requirements
    in Annex V, observer data requirements in Annex X, and port data requirements
    in Annexes XI and XII
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/1761 de la Commission du 12 juin 2026 modifiant
    le règlement (UE) 2018/975 du Parlement européen et du Conseil en ce qui concerne
    les délais de présentation du rapport scientifique annuel et de communication
    du total des captures, les normes de lestage des lignes figurant à l’annexe
    I, les exigences en matière de données relatives aux navires figurant à l’annexe
    V, les exigences en matière de données d’observation figurant à l’annexe
    X et les exigences en matière de données relatives aux ports figurant aux annexes
    XI et XII
