title:
- language: en
  script: Latn
  content: '79/186/EEC: Commission Decision of 26 January 1979 authorizing the French
    Republic not to apply Community treatment to men''s and boys''woven suits (including
    coordinate suits consisting of two or three pieces, which are ordered, packed,
    consigned and normally sold together) of wool, of cotton or of man-made textile
    fibres, falling within heading No ex 61.01 of the Common Customs Tariff (NIMEXE
    codes 61.01-51, 54, 57) (category 16), originating in Yugoslavia and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/186/CEE: Décision de la Commission, du 26 janvier 1979, autorisant
    la République française à exclure du traitement communautaire les costumes
    et complets, tissés (y compris les ensembles qui se composent de deux ou trois
    pièces, qui sont commandées, conditionnées, transportées et normalement vendues
    ensemble) de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    de la position ex 61.01 du tarif douanier commun (codes Nimexe: 61.01-51, 54,
    57) catégorie 16, originaires de Yougoslavie et mis en libre pratique dans les
    autres Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/186/EWG: Entscheidung der Kommission vom 26. Januar 1979, mit der die
    Französische Republik ermächtigt wird, aus Jugoslawien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Anzüge und Kombinationen,
    ausgenommen Skianzüge, aus Geweben, für Männer und Knaben (einschließlich
    der aus zwei oder drei Teilen bestehenden Kombinationen, die zusammen bestellt,
    aufgemacht und befördert und normalerweise zusammen verkauft werden), aus Wolle,
    Baumwolle, synthetischen oder künstlichen Spinnstoffen, der Tarifnummer ex 61.01
    des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern: 61.01- 51; 54; 57) (Kategorie
    16) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/186/EØF: Kommissionens beslutning af 26. januar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage jakkesæt, vævede,
    til mænd og drenge (herunder sæt, der består af to eller tre stykker, der bestilles,
    emballeres, transporteres og normalt sælges sammen) af uld, bomuld eller kemofibre,
    som henhører under pos. ex 61.01 i den fælles toldtarif (NIMEXE-nummer 61.01-51,
    54, 57) kategori 16, har oprindelse i Jugoslavien og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/186/CEE: Decisione della Commissione, del 26 gennaio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i vestiti completi,
    tessuti, per uomo e per ragazzo (compresi i completi composti di due o tre pezzi
    ordinati, preparati, trasportati e normalmente venduti insieme), di lana, di cotone
    o di fibre tessili sintetiche o artificiali della voce ex 61.01 della tariffa
    doganale comune (codice Nimexe: 61.01-51, 54, 57), originari della Iugoslavia
    e messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/186/EEG: Beschikking van de Commissie van 26 januari 1979 waarbij de
    Franse Republiek wordt gemachtigd kostuums, geweven, voor heren en jongens, daaronder
    begrepen kostuums welke uit twee of drie delen bestaan welke gewoonlijk tezamen
    worden besteld, verpakt, vervoerd en verkocht, van wol, van katoen of van synthetische
    of van kunstmatige textielvezels, van post ex 61.01 van het gemeenschappelijk
    douanetarief (NIMEXE- code 61.01-51, 54, 57), van oorsprong uit Joegoslavië en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
