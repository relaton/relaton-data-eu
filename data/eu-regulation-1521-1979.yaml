    (ΕΟΚ) αριθ. 749/78 «περί τού καθορισμού τής εννοίας
    τής καταγωγής ορισμένων υφαντουργικών προϊόντων
    τών κεφαλαίων 51 καί 53 έως 62 τού Κοινού Δασμολογίου»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1521/79 della Commissione, del 20 luglio 1979, che
    modifica per quanto riguarda taluni tipi di guanti, il regolamento (CEE) n. 749/78,
    relativo alla determinazione dell' origine di taluni prodotti tessili dei capitoli
    51 e da 53 a 62 della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1521/79 van de Commissie van 20 juli 1979 houdende
