title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1521/79 of 20 July 1979 amending in respect
    of certain gloves, mittens and mitts Regulation (EEC) No 749/78 on the determination
    of the origin of certain textile products falling within Chapters 51 and 53 to
    62 of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1521/79 de la Commission, du 20 juillet 1979, modifiant,
    en ce qui concerne certains articles de la ganterie, le règlement (CEE) n° 749/78
    relatif à la détermination de l' origine de certains produits textiles des chapitres
    51 et 53 à 62 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1521/79 der Kommission vom 20. Juli 1979 zur Änderung
    der Verordnung (EWG) Nr. 749/78 über die Bestimmung des Ursprungs von Textilwaren
    der Kapitel 51 und 53 bis 62 des Gemeinsamen Zolltarifs in bezug auf bestimmte
    Handschuhe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1521/79 af 20. juli 1979 om ændring,
    for så vidt angår handsker, vanter og luffer, af forordning (EØF) nr. 749/78
    om bestemmelse af oprindelse for visse tekstilvarer henhørende under kapitel
    51 og 53-62 i den fælles toldtarif
  type: main
- language: el
  script: Grek
