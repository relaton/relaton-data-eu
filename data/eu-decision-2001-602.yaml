  script: Latn
  content: '2001/602/EC: Commission Decision of 26 July 2001 on accepting undertakings
    offered in connection with the anti-dumping proceeding concerning imports of certain
    iron or steel ropes and cables originating in the Czech Republic, the Republic
    of Korea, Malaysia, Russia, Thailand and Turkey and terminating the proceeding
    in respect of imports originating in the Republic of Korea and Malaysia (notified
    under document number C(2001) 2351)'
  type: main
- language: fr
  script: Latn
