    közösségi finanszírozási projektek leendő tapasztalatlan befektetőire vonatkozó
    belépéskori tudástesztet és a veszteségviselési képesség szimulációját
    meghatározó szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2114 della Commissione del 13 luglio 2022
    che integra il regolamento (UE) 2020/1503 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano il test
    d’ingresso di verifica delle conoscenze e la simulazione della capacità di
    sostenere perdite per i potenziali investitori non sofisticati in progetti di
    crowdfunding
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2114 (2022. gada 13. jūlijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) 2020/1503 papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem, kuros precizē pasākumus potenciālu
    nepieredzējušu kolektīvās finansēšanas projektu ieguldītāju iesaistīšanās
    zināšanu pārbaudes un zaudējumu segšanas spējas simulācijas veikšanai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/2114 2022 m. liepos 13 d.
