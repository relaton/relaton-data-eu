title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2114 of 13 July 2022 supplementing
    Regulation (EU) 2020/1503 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the entry knowledge test and the
    simulation of the ability to bear loss for prospective non-sophisticated investors
    in crowdfunding projects
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2114 de la Commission du 13 juillet 2022
    complétant le règlement (UE) 2020/1503 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les modalités du test
    de connaissances à l’entrée et de la simulation de la capacité à supporter
    des pertes des investisseurs potentiels non avertis dans les projets de financement
    participatif
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2114 der Kommission vom 13. Juli 2022 zur
    Ergänzung der Verordnung (EU) 2020/1503 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Präzisierung der Kenntnisprüfung
    bei Schwarmfinanzierungsprojekten und der Simulation der Fähigkeit von potenziellen
    nicht kundigen Anlegern, bei Schwarmfinanzierungsprojekten Verluste zu tragen
  type: main
- language: bg
  script: Cyrl
