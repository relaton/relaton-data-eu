    investuotojų į sutelktinio finansavimo projektus pirminis žinių patikrinimas
    ir gebėjimo prisiimti nuostolius modeliavimas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/2114 tat-13 ta’ Lulju 2022
    li jissupplimenta r-Regolament (UE) 2020/1503 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ standards tekniċi regolatorji li jispeċifikaw it-test inizjali
    tal-għarfien u s-simulazzjoni tal-kapaċità li jiġġarrab telf għal investituri
    mhux sofistikati prospettivi fi proġetti ta’ finanzjament kollettiv
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/2114 van de Commissie van 13 juli 2022
    tot aanvulling van Verordening (EU) 2020/1503 van het Europees Parlement en de
    Raad met technische reguleringsnormen tot nadere bepaling van de toelatingskennistest
    en de simulatie van de capaciteit om verlies te dragen voor niet-ervaren aspirant-beleggers
    in crowdfundingprojecten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/2114 z dnia 13 lipca 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2020/1503
    w odniesieniu do regulacyjnych standardów technicznych określających warunki
    przeprowadzania wstępnego testu wiedzy i symulacji zdolności ponoszenia strat
    dla potencjalnych inwestorów niedoświadczonych dokonujących inwestycji w projekty
    oparte na finansowaniu społecznościowym
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2114 da Comissão de 13 de julho de 2022
    que complementa o Regulamento (UE) 2020/1503 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam a
    prova de conhecimentos para admissão e a simulação da capacidade de suportar
    perdas dos potenciais investidores não sofisticados em projetos de financiamento
    colaborativo
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2114 al Comisiei din 13 iulie 2022 de completare
    a Regulamentului (UE) 2020/1503 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează modalitățile
    de testare a cunoștințelor la intrarea pe piață și simularea capacității
    de a suporta pierderi pentru investitorii nesofisticați potențiali în proiecte
    de finanțare participativă
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2114 z 13. júla 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2020/1503, pokiaľ
    ide o regulačné technické predpisy, ktorými sa spresňuje vstupný test znalostí
    a simulácia schopnosti potenciálnych nesofistikovaných investorov v projektoch
    hromadného financovania znášať stratu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2114 z dne 13. julija 2022 o dopolnitvi
    Uredbe (EU) 2020/1503 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo začetni preizkus znanja in simulacijo zmožnosti kritja
    izgub za potencialne nepoučene vlagatelje v projekte množičnega financiranja
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2114 de la Comisión de 13 de julio de 2022
    por el que se completa el Reglamento (UE) 2020/1503 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación que especifican
    la prueba inicial de conocimientos y la simulación de la capacidad de soportar
    pérdidas para inversores potenciales no experimentados en proyectos de financiación
    participativa
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2114 av den 13 juli 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 2020/1503
    vad gäller tekniska tillsynsstandarder som specificerar kunskapskontroll och
    simulering av förmågan att bära förluster för presumtiva icke-sofistikerade
    investerare i gräsrotsfinansieringsprojekt
