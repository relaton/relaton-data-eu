title:
- language: en
  script: Latn
  content: '73/311/EEC: Commission Decision of 28 September 1973 authorizing the Italian
    Republic not to apply the premium system for the conversion of dairy cow herds
    to meat production and to grant the development premium for the specialized raising
    of cattle for meat production'
  type: main
- language: fr
  script: Latn
  content: '73/311/CEE: Décision de la Commission, du 28 septembre 1973, autorisant
    la République italienne à ne pas mettre en application le régime de prime à
    la reconversion, vers la production de viande, de troupeaux bovins à orientation
    laitière et à octroyer la prime de développement de l'' élevage bovin spécialisé
    vers la production de viande'
  type: main
- language: de
  script: Latn
  content: '73/311/EWG: Entscheidung der Kommission vom 28. September 1973 zur Ermächtigung
    der Italienischen Republik, die Prämienregelung für die Umstellung von Milchkuhbeständen
    auf Bestände zur Fleischerzeugung nicht anzuwenden und Prämien zur Förderung
    der speziell auf die Fleischerzeugung ausgerichteten Rinderaufzucht zu gewähren'
  type: main
- language: da
  script: Latn
  content: '73/311/EØF: Kommissioens Beslutning af 28. september 1973 om bemyndigelse
    for Den italienske Republik til ikke at iværsætte præmieordningen for omlægning
    af besætninger af malkekvæg til kødproduktion og til at yde præmie for udvikling
    af opdræt af kvæg, specielt til kødproduktion'
  type: main
- language: it
  script: Latn
  content: '73/311/CEE: Decisione della Commissione, del 28 settembre 1973, che autorizza
    la Repubblica italiana a non applicare il regime di premio per la riconversione
    di mandrie bovine ad orientamento lattiero verso la produzione di carne e a concedere
    il premio allo sviluppo dell'' allevamento bovino specializzato nella produzione
    di carne'
  type: main
- language: nl
  script: Latn
  content: '73/311/EEG: Beschikking van de Commissie van 28 september 1973 waarbij
    de Republiek Italië gemachtigd wordt om het stelsel van premies voor de omschakeling
    van de melkveestapel op de rundvleesproduktie niet toe te passen en de premie
    voor de ontwikkeling van de teelt van rundvlees bestemd voor de vleesproduktie
    toe te kennen'
  type: main
