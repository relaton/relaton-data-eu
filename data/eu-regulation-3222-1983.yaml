title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3222/83 of 15 November 1983 on the fixing of
    the total allowable catch, the share available to the Community and the quota
    allocations among the Member States for saithe in 1983 in divisions III a, IV,
    II a (EEC zone) and III b, c and d (EEC zone)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3222/83 du Conseil du 15 novembre 1983 fixant, en ce
    qui concerne les stocks de lieus noirs se trouvant dans les divisions IIIa, IV,
    IIa (zone CEE) et IIIb, c et d (zone CEE), le total admissible des captures pour
    1983, la part de ces captures attribuée à la Communauté et la répartition
    de cette part entre les États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3222/83 des Rates vom 15. November 1983 zur Festlegung
    der zulässigen Gesamtfangmengen im Jahre 1983 für die Seelachsbestände in den
    Bereichen IIIa, IV, IIa (EG-Zone) und IIIb, c und d (EG-Zone) des für die Gemeinschaft
    verfügbaren Anteils und der Aufteilung dieses Anteils auf die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3222/83 af 15. november 1983 om fastsættelse
    af den samlede tilladte fangstmængde for sej i afsnit IIIa, IV, IIa (EØF-zone)
    og IIIb, c og d (EØF-zone), Fællesskabets andel af denne fangstmængde og denne
    andels fordeling blandt medlemsstaterne i 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3222/83 του Συμβουλίου
    της 15ης Νοεμβρίου 1983 για τον καθορισμό, όσον
    αφορά τα αποθέματα της μαύρης πολλάκας που
    ευρίσκονται στις διαιρέσεις III a, IV, II a (ζώνη
    ΕΟΚ) και III b, c και d (ζώνη ΕΟΚ), του συνόλου των
    επιτρεπομένων αλιευμάτων για το 1983, του μεριδίου
    αυτών των αλιευμάτων που χορηγείται στην Κοινότητα
    και της κατανομής του μεριδίου αυτού στα κράτη
    μέλη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3222/83 del Consiglio del 15 novembre 1983 che fissa
    il totale di catture ammesse, la quota di queste catture disponibile per la Comunità
    e la ripartizione di detta quota tra gli Stati membri, per il merluzzo carbonaro
    nelle divisioni IIIa, IV, IIa (zona CEE) e IIIb, c, d (zona CEE)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3222/83 van de Raad van 15 november 1983 inzake de
    vaststelling van de totaal toegestane vangsten, het voor de Gemeenschap beschikbare
    gedeelte en de verdeling van de quota over de Lid-Staten voor koolvis in 1983
    in de afdelingen III a, IV, II a (EEG-zone) en III b, c en d (EEG-zone)
  type: main
