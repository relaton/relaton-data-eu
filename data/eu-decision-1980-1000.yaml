title:
- language: en
  script: Latn
  content: '80/1000/EEC: Commission Decision of 7 October 1980 authorizing Ireland
    not to apply Community treatment to parkas, anoraks, windcheaters, waisted jackets
    and the like, woven, originating in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1000/CEE: Décision de la Commission, du 7 octobre 1980, autorisant
    l''Irlande à exclure du traitement communautaire les "parkas", anoraks, blousons
    et similaires, tissés, originaires de Hong-kong (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1000/EWG: Entscheidung der Kommission vom 7. Oktober 1980 zur Ermächtigung
    Irlands, aus Hongkong stammende Parkas, Anoraks, Windjacken und dergleichen, aus
    Geweben, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1000/EØF: Kommissionens beslutning af 7. oktober 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage parca-coats, anorakker, vindjakker,
    blouson- jakker og lignende med oprindelse i Hongkong (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1000/CEE: Decisione della Commissione, del 7 ottobre 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli eskimo, le giacche a vento
    e i giubbotti con o senza cappuccio e simili, tessuti, originari di Hong Kong
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1000/EEG: Beschikking van de Commissie van 7 oktober 1980 houdende
    machtiging van Ierland om parka''s, anoraks, windjakken en dergelijke, geweven,
    van oorsprong uit Hong-Kong, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Engelse taal is authentiek)'
