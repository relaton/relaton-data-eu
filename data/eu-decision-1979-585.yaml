title:
- language: en
  script: Latn
  content: '79/585/EEC: Commission Decision of 23 May 1979 authorizing the United
    Kingdom not to apply Community treatment to yarn of discontinuous or waste regenerated
    fibres, not put up for retail sale, falling within subheading 56.05 B of the Common
    Customs Tariff (NIMEXE codes 56.05-51, 55, 61, 65, 71, 75, 81, 85, 91, 95, 99)
    (category 23), originating in the German Democratic Republic and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/585/CEE: Décision de la Commission, du 23 mai 1979, autorisant le
    Royaume-Uni à exclure du traitement communautaire les fils de fibres textiles
    artificielles discontinues non conditionnés pour la vente au détail, de la sous-position
    56.05 B du tarif douanier commun (codes Nimexe: 56.05-51, 55, 61, 65, 71, 75,
    81, 85, 91, 95, 99) (catégorie 23), originaires de la République démocratique
    allemande et mis en libre pratique dans les autres Etats membres (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/585/EWG: Entscheidung der Kommission vom 23. Mai 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus der Deutschen Demokratischen Republik
    stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Garne
    aus künstlichen Spinnfasern, nicht in Aufmachungen für den Einzelverkauf, der
    Tarifstelle 56.05 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 56.05-51, 55,
    61, 65, 71, 75, 81, 85, 91, 95, 99), Kategorie 23, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/585/EØF: Kommissionens beslutning af 23. maj 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage garn af korte
    regenererede fibre, som henhører under pos. ex 56.05 B i den fælles toldtarif
    (NIMEXE-nummer 56.05-51, 55, 61, 65, 71, 75, 81, 85, 91, 95, 99 ; kategori 23),
    har oprindelse i Den tyske demokratiske Republik og frit kan omsættes i de øvrige
    medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/585/CEE: Decisione della Commissione, del 23 maggio 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i filati di fibre tessili
    artificiali in fiocco, non preparati per la vendita al minuto, della sottovoce
    ex 56.05 B della tariffa doganale comune (codici Nimexe: 56.05-51, 55, 61, 65,
    71, 75, 81, 85, 91, 95, 99) (categoria 23), originari della Repubblica democratica
    tedesca e messi in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/585/EEG: Beschikking van de Commissie van 23 mei 1979 waarbij het Verenigd
    Koninkrijk wordt gemachtigd garens van kunstmatige stapelvezels, niet gereed voor
    de verkoop in het klein, van post 56.05 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 56.05-51, 55, 61, 65, 71, 75, 81, 85, 91, 95, 99), categorie 23,
    van oorsprong uit de Duitse Democratische Republiek en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
