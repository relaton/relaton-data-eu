title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3240/80 of 15 December 1980 amending Annexes
    4 and 5 of Council Regulation (EEC) No 574/72 fixing the procedure for implementing
    Regulation (EEC) No 1408/71 on the application of social security schemes to employed
    persons and their families moving within the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3240/80 de la Commission, du 15 décembre 1980, modifiant
    les annexes 4 et 5 du règlement (CEE) n° 574/72 du Conseil fixant les modalités
    d' application du règlement (CEE) n° 1408/71 relatif à l' application des régimes
    de sécurité sociale aux travailleurs salariés et à leur famille qui se déplacent
    à l' intérieur de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3240/80 der Kommission vom 15. Dezember 1980 zur Änderung
    der Anhänge 4 und 5 der Verordnung (EWG) Nr. 574/72 des Rates über die Durchführung
    der Verordnung (EWG) Nr. 1408/71 zur Anwendung der Systeme der sozialen Sicherheit
    auf Arbeitnehmer und deren Familien, die innerhalb der Gemeinschaft zu- und abwandern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3240/80 af 15. december 1980 om ændring
    af bilag 4 og 5 til Rådets forordning (EØF) nr. 574/72 om regler til gennemførelse
    af forordning (EØF) nr. 1408/71 om anvendelse af de sociale sikringsordninger
    på arbejdstagere og deres familiemedlemmer, der flytter inden for Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3240/80 της Επιτροπής,
    της 15ης Δεκεμβρίου 1980, με τον οποίο τροποποιούνται
    τα παραρτήματα 4 και 5 του κανονισμού (ΕΟΚ) αριθ.
    574/72 του Συμβουλίου περί καθορισμού των τρόπων
    εφαρμογής του κανονισμού (ΕΟΚ) αριθ. 1408/71 όσον
    αφορά την εφαρμογή των καθεστώτων κοινωνικής
    ασφάλισης για τους μισθωτούς εργαζόμενους
    και την οικογένειά τους που μετακινούνται
    στο εσωτερικό της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3240/80 della Commissione, del 15 dicembre 1980, che
    modifica gli allegati 4 e 5 del regolamento (CEE) n. 574/72 del Consiglio che
    stabilisce le modalità d' applicazione del regolamento (CEE) n. 1408/71 relativo
    all' applicazione dei regimi di sicurezza sociale ai lavoratori subordinati ed
    ai loro familiari che si spostano all' interno della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3240/80 van de Commissie van 15 december 1980 tot
    wijziging van de bijlagen 4 en 5 van Verordening (EEG) nr. 574/72 van de Raad
    tot vaststelling van de wijze van toepassing van Verordening (EEG) nr. 1408/71
    betreffende de toepassing van de sociale zekerheidsregelingen op loontrekkenden
    en hun gezinnen die zich binnen de Gemeenschap verplaatsen
  type: main
