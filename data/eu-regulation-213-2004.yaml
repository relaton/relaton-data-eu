    se refiere al azúcar de los códigos NC 1701 y 1702 importado de Serbia y Montenegro,
    los arreglos previstos en el Reglamento (CE) n° 2007/2000 del Consejo por el
    que se introducen medidas comerciales excepcionales para los países y territorios
    participantes o vinculados al Proceso de estabilización y asociación de la Unión
    Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 213/2004 av den 5 februari 2004 om tillfälligt
