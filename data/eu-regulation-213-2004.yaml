title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 213/2004 of 5 February 2004 suspending for
    an additional period of six months, with regard to sugar of CN codes 1701 and
    1702 imported from Serbia and Montenegro, the arrangements provided for in Council
    Regulation (EC) No 2007/2000 introducing exceptional trade measures for countries
    and territories participating in or linked to the European Union's stabilisation
    and association process
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 213/2004 de la Commission du 5 février 2004 suspendant,
    pour une durée supplémentaire de six mois, en ce qui concerne le sucre des codes
    NC 1701 et 1702 importé de Serbie-et-Monténégro, le régime défini dans le
    règlement (CE) n° 2007/2000 du Conseil introduisant des mesures commerciales
    exceptionnelles en faveur des pays et territoires participant ou liés au processus
    de stabilisation et d'association mis en œuvre par l'Union européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 213/2004 der Kommission vom 5. Februar 2004 zur Aussetzung
    der für aus Serbien und Montenegro eingeführten Zucker der KN-Codes 1701 und
    1702 geltenden Präferenzregelung der Verordnung (EG) Nr. 2007/2000 des Rates
    zur Einführung besonderer Handelsmaßnahmen für die am Stabilisierungs- und
    Assoziierungsprozess der Europäischen Union teilnehmenden oder damit verbundenen
    Länder und Gebiete um weitere sechs Monate
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 213/2004 ze dne 5. února 2004, kterým se
    pozastavuje na další období šesti měsíců, pokud jde o cukr kódů KN 1701
    a 1702 dovezený ze Srbska a Černé Hory, režim stanovený v nařízení Rady
    (ES) č. 2007/2000, kterým se zavádějí mimořádná obchodní opatření pro
    země a území účastnící se procesu stabilizace a přidružení zavedeného
    Evropskou unií či s tímto procesem spjaté
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 213/2004 af 5. februar 2004 om suspension
    i en yderligere periode på seks måneder af ordningen i Rådets forordning (EF)
    nr. 2007/2000 om exceptionelle handelsforanstaltninger for lande og territorier,
    der deltager i eller er knyttet til Den Europæiske Unions stabiliserings- og
    associeringsproces, hvad angår sukker henhørende under KN-kode 1701 og 1702,
    der indføres fra Serbien og Montenegro
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 213/2004 της Επιτροπής,
    της 5ης Φεβρουαρίου 2004, για την αναστολή, για
    πρόσθετη περίοδο έξι μηνών, όσον αφορά τη ζάχαρη
    των κωδικών ΣΟ 1701 και 1702 που εισάγεται από τη
    Σερβία και Μαυροβούνιο, του προτιμησιακού
    καθεστώτος που προβλέπεται από τον κανονισμό
    (EΚ) αριθ. 2007/2000 για την εισαγωγή έκτακτων εμπορικών
    μέτρων για χώρες και εδάφη που συμμετέχουν
    ή συνδέονται με τη διαδικασία σταθεροποίησης
    και σύνδεσης της Ευρωπαϊκής Ένωσης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 213/2004, 5. veebruar 2004, millega peatatakse
    täiendavalt veel kuueks kuuks kord, mis on kehtestatud CN-koodide 1701 ja 1702
    alla kuuluva Serbiast ja Montenegrost imporditava suhkru suhtes nõukogu määrusega
    (EÜ) nr 2007/2000, millega kehtestatakse erandlikud kaubandusmeetmed Euroopa
    Liidu stabiliseerimis- ja assotsieerimisprotsessis osalevate või sellega seotud
    maade ja territooriumide suhtes
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 213/2004, annettu 5 päivänä helmikuuta 2004,
    poikkeuksellisten kaupan toimenpiteiden käyttöönotosta Euroopan unionin vakautus-
    ja assosiaatioprosessiin osallistuville tai siihen yhteydessä oleville maille
    ja alueille annetussa neuvoston asetuksessa (EY) N:o 2007/2000 säädettyjen,
    CN-koodeihin 1701 ja 1702 luokiteltavaa Serbia ja Montenegrosta tuotua sokeria
    koskevien menettelyjen keskeyttämisestä vielä kuudeksi kuukaudeksi
  type: main
- language: hu
  script: Latn
  content: A Bizottság 213/2004/EK rendelete (2004. február 5.) az Európai Unió
    stabilizációs és társulási folyamatában részt vevő vagy ahhoz kapcsolódó
    országokra és területekre kivételes kereskedelmi intézkedések bevezetéséről
    szóló 2007/2000/EK tanácsi rendeletben foglalt rendelkezéseknek a Szerbia
    és Montenegróból behozott, a 1701 és 1702 KN-kód alá tartozó cukor tekintetében
    további hat hónapos időtartamra történő felfüggesztéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 213/2004 della Commissione, del 5 febbraio 2004, che
    sospende per un periodo supplementare di sei mesi, per quanto riguarda lo zucchero
    classificato ai codici NC 1701 e 1702 importato dalla Serbia e Montenegro, i regimi
    stabiliti nel regolamento (CE) n. 2007/2000 del Consiglio recante misure commerciali
    eccezionali applicabili ai paesi e territori che partecipano o sono legati al
    processo di stabilizzazione e di associazione dell'Unione europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 213/2004 (2004. gada 5. februāris), kas attiecībā
    uz cukuru ar KN kodu 1701 un 1702, ko ieved no Serbijas un Melnkalnes, vēl uz
    sešiem mēnešiem atliek tā režīma piemērošanu, kas noteikts Padomes Regulā
    (EK) Nr. 2007/2000 par tirdzniecības ārkārtas pasākumu ieviešanu attiecībā
    uz valstīm un teritorijām, kuras piedalās Eiropas Savienības Stabilizācijas
    un asociācijas procesā vai ir ar to saistītas
  type: main
- language: lt
  script: Latn
  content: 2004 m. vasario 5 d. Komisijos reglamentas (EB) Nr. 213/2004 papildomam
    šešių mėnesių laikotarpiui sustabdantis priemonių, numatytų Tarybos reglamente
    (EB) Nr. 2007/2000 dėl išimtinių prekybos priemonių įvedimo šalims ir teritorijoms,
    dalyvaujančioms Europos Sąjungos stabilizacijos ir asociacijos procese ar su
    juo susijusioms, taikymą iš Serbijos ir Juodkalnijos importuojamam cukrui, kurio
    KN kodai yra 1701 ir 1702
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 213/2004 tal-5 ta' Frar 2004 li
    jissospendi għal perjodu addizzjonali ta' sitt xhur, fir-rigward ta' zokkor tal-kodiċijiet
    NM 1701 u 1702, impurtat mis-Serbja u l-Montenegro, l-arranġamenti provduti fir-Regolament
    tal-Kunsill (KE) Nru 2007/2000, li jintroduċi miżuri ta' kummerċ eċċezzjonali,
    għal pajjiżi u territorji li jipparteċipaw jew jassoċjaw ruħhom mal-proċess
    ta' stabilizzazzjoni u assoċjazzjoni ta' l-Unjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 213/2004 van de Commissie van 5 februari 2004 houdende
    schorsing voor een aanvullende periode van zes maanden, met betrekking tot uit
    Servië en Montenegro ingevoerde suiker van de GN-codes 1701 en 1702, van de regelingen
    ingesteld bĳ Verordening (EG) nr. 2007/2000 van de Raad tot vaststelling van
    uitzonderlĳke handelsmaatregelen ten behoeve van de landen en gebieden die deelnemen
    aan of verbonden zĳn met het stabilisatie- en associatieproces van de Europese
    Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 213/2004 z dnia 5 lutego 2004 r. zawieszające
    na dodatkowy okres sześciu miesięcy, w odniesieniu do cukru o kodach CN 1701
    i 1702 przywożonego z Serbii i Czarnogóry, uzgodnienia przewidziane w rozporządzeniu
    Rady (WE) nr 2007/2000 wprowadzającym nadzwyczajne środki handlowe dla krajów
    i terytoriów uczestniczących lub powiązanych z procesem stabilizacji i stowarzyszania
    Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 213/2004 da Comissão, de 5 de Fevereiro de 2004,
    que suspende, por um período adicional de seis meses, no que se refere ao açúcar
    dos códigos NC 1701 e 1702 importado da Sérvia e Montenegro, o regime previsto
    no Regulamento (CE) n.° 2007/2000 do Conselho que adopta medidas comerciais excepcionais
    em favor dos países e territórios que participam ou estão ligados ao processo
    de estabilização e associação da União Europeia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 213/2004 z 5. februára 2004, ktorým sa so
    zreteľom na cukor patriaci pod číselné znaky KN 1701 a 1702 dovážaný zo
    Srbska a Čiernej Hory pozastavujú na ďalšie obdobie šiestich mesiacov dojednania
    ustanovené v nariadení Rady (ES) č. 2007/2000 o zavedení mimoriadnych obchodných
    opatrení pre štáty a územia zúčastňujúce sa procesu Európskej únie zameraného
    na stabilizáciu a pridruženie alebo doňho zapojené
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 213/2004 z dne 5. februarja 2004 o začasni opustitvi
    režimov, predvidenih v Uredbi Sveta (ES) št. 2007/2000 o uvedbi izrednih trgovinskih
    ukrepov za države in ozemlja, ki sodelujejo ali so povezana s stabilizacijsko-pridružitvenim
    procesom Evropske unije, za dodatno obdobje šestih mesecev v zvezi s sladkorjem
    iz oznak KN 1701 in 1702, uvoženim iz Srbije in Črne gore
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 213/2004 de la Comisión, de 5 de febrero de 2004,
