    támogatásáról szóló, (KKBP) 2021/1694 határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2023/1181 del Consiglio del 16 giugno 2023 che modifica
    la decisione (PESC) 2021/1694 a sostegno dell’universalizzazione, dell’attuazione
    e del rafforzamento della convenzione sulla proibizione o la limitazione dell’uso
    di alcune armi convenzionali che possono essere considerate dannose o aventi effetti
    indiscriminati (CCW)
  type: main
- language: lv
  script: Latn
