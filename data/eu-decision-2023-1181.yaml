    (CCAC)
  type: main
- language: ro
  script: Latn
  content: Decizia (PESC) 2023/1181 a Consiliului din 16 iunie 2023 de modificare
    a Deciziei (PESC) 2021/1694 de sprijinire a universalizării, a punerii în aplicare
    și a consolidării Convenției privind interzicerea sau limitarea folosirii anumitor
    categorii de arme clasice care ar putea fi considerate ca producând efecte traumatice
    excesive sau care ar lovi fără discriminare (CCW)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (SZBP) 2023/1181 zo 16. júna 2023, ktorým sa mení rozhodnutie
