  script: Latn
  content: Council Decision (CFSP) 2023/1181 of 16 June 2023 amending Decision (CFSP)
    2021/1694 in support of the universalisation, implementation and strengthening
    of the Convention on Prohibitions or Restrictions on the Use of Certain Conventional
    Weapons Which May Be Deemed to Be Excessively Injurious or to Have Indiscriminate
    Effects (CCW)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2023/1181 du Conseil du 16 Juin 2023 modifiant la décision
    (PESC) 2021/1694 visant à soutenir l’universalisation, la mise en œuvre et
    le renforcement de la convention sur l’interdiction ou la limitation de l’emploi
    de certaines armes classiques qui peuvent être considérées comme produisant
    des effets traumatiques excessifs ou comme frappant sans discrimination (CCAC)
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2023/1181 des Rates vom 16. Juni 2023 zur Änderung des
