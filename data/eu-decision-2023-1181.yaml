    u t-tisħiħ tal-Konvenzjoni dwar il-Projbizzjonijiet u r-Restrizzjonijiet fuq
    l-Użu ta’ Ċerti Armi Konvenzjonali Li Jistgħu Jitqiesu li Huma Ta’ Ħsara
    Eċċessiva jew li Għandhom Effetti Indiskriminati (CCW)
  type: main
- language: nl
  script: Latn
