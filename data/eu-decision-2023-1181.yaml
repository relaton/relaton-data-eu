    mogą być uważane za powodujące nadmierne cierpienia lub mające niekontrolowane
    skutki (konwencji CCW)
  type: main
- language: pt
  script: Latn
  content: Decisão (PESC) 2023/1181 do Conselho de 16 junho 2023 que altera a Decisão
