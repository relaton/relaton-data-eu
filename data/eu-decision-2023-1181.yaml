    dėl tam tikrų įprastinių ginklų, kurie gali būti laikomi pernelyg žalojančiais
    arba veikia nesirinktinai, naudojimo uždraudimo arba apribojimo (CCW) visuotinis
    taikymas, įgyvendinimas ir stiprinimas
  type: main
- language: mt
  script: Latn
