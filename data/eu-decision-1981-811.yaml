title:
- language: en
  script: Latn
  content: '81/811/EEC: Commission Decision of 15 September 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven cotton terry fabrics; toilet and kitchen
    linen of woven cotton terry fabrics, originating in Brazil (Only the French and
    Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/811/CEE: Décision de la Commission, du 15 septembre 1981, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les tissus de coton bouclés du genre éponge,
    linge de toilette, d''office ou de cuisine, bouclé du genre éponge, de coton,
    originaires du Brésil (Les textes en langues française et néerlandaise sont
    les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/811/EWG: Entscheidung der Kommission vom 15. September 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus Brasilien stammende Schlingengewebe (Frottiergewebe) aus Baumwolle;
    Wäsche zur Körperpflege und andere Haushaltswäsche aus Schlingengeweben (Frottiergeweben)
    aus Baumwolle von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/811/EØF: Kommissionens beslutning af 15. september 1981 om bemyndigelse
    til kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage håndklædefrotterstof og lignende frotterstof
    af bomuld; håndklæder og viskestykker og lignende frotterstof af bomuld med
    oprindelse i Brasilien (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/811/EOK: Απόφαση τής Επιτροπής τής 15ης Σεπτεμβρίου
    1981 περί χορηγήσεως αδείας στό Βασίλειο τού
    Βελγίου, στό Μέγαλο Δουκάτο τού Λουξεμβούργου
    καί στό Βασίλειο τών Κάτω Χωρών νά εξαιρέσουν
    από τήν κοινοτική μεταχείριση βαμβακερά φλοκωτά
    (μπουκλέ) υφάσματα σπογγώδους μορφής, τίς βαμβακερές
    οθόνες καθαριότητος υπηρεσίας ή μαγειρείου,
    σπογγώδους μορφής, καταγωγής Βραζιλίας (Τα
    κείμενα στην γαλλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/811/CEE: Decisione della Commissione, del 15 settembre 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i tessuti di cotone ricci del tipo spugna
    e la biancheria da toletta, da servizio o da cucina, riccia del tipo spugna, di
    cotone, originari del Brasile (Il testi in lingua francese e olandese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/811/EEG: Beschikking van de Commissie van 15 september 1981 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd bad- of frotteerstof (lussendoek) van katoen, huishoudlinnen
    van bad- of frotteerstof (lussendoek) van katoen van oorsprong uit Brazilië van
    de communautaire behandeling uit te sluiten (Slechts de teksten in de Franse en
    de Nederlandse taal zijn authentiek)'
