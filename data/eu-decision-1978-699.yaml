type: standard
title:
- language: en
  script: Latn
  content: 'Commission Decision of 24 July 1978 authorizing Ireland not to apply Community
    treatment to outer garments and other articles, knitted or crocheted, not elastic
    or rubberized: outer garments and clothing accessories: jerseys, pullovers, slipovers,
    twinsets, cardigans, bed-jackets and jumpers, knitted or crocheted, not elastic
    or rubberized, of wool, of cotton or of man-made textile fibres, falling within
    subheading ex 60.05 A of the Common Customs Tariff (NIMEXE codes 60.05-01, 27,
    28, 29, 30, 33, 36, 37, 38), originating in Malaysia and in free circulation in
    the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/699/CEE: Décision de la Commission, du 24 juillet 1978, autorisant
    l''Irlande à exclure du traitement communautaire les vêtements de dessus, accessoires
    du vêtement et autres articles de bonneterie non élastique ni caoutchoutée
    : vêtements de dessus et accessoires du vêtement: chandails, "pullovers, slip-overs,
    twinsets", gilets et vestes de bonneterie non élastique ni caoutchoutée, de
    laine, de coton, de fibres textiles synthétiques ou artificielles de la sous-position
    Ex 60.05 A du Tarif douanier commun (codes Nimexe 60.05-01; 27; 28; 29; 30; 33;
    36; 37; 38), originaires de Malaisie et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 24. Juli 1978, mit der Irland ermächtigt
    wird, aus Malaysia stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Oberkleidung, Bekleidungszubehör und andere Wirkwaren, weder gummielastisch
    noch kautschutiert: Oberkleidung und Bekleidungszubehör: Pullover, Slipover,
    Twinsets, Westen und dergleichen aus Gewirken, aus Wolle, Baumwolle, synthetischen
    oder künstlichen Spinnstoffen (weder gummielastisch noch kautschutiert) der Tarifstelle
    ex 60.05 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-01; 27; 28; 29;
    30; 33; 36; 37; 38) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 24. juli 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage yderbeklædningsgenstande og andre varer
    af trikotage, ikke-elastisk eller gummeret; yderbeklædningsgenstande og tilbehør
    til beklædningsgenstande; sweatere, pullovere, slip-overe, cardingansæt, veste
    og trøjer af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 6005 A (NIMEXE-kode 60.05-1, 27, 28, 29, 30, 33, 36, 37, 38) i den
    fælles toldtarif, har oprindelse i Malaysia og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 24 luglio 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario indumenti esterni, accessori di abbigliamento
    ed altri manufatti, a maglia non elastica né gommata, indumenti esterni ed accessori
    di abbigliamento, maglie, pullover, slip-over, twinset, giubbotti, giacche e bluse,
    a maglia non elastica né gommata, di lana, di cotone o di fibre sintetiche o
    artificiali della sottovoce ex 60.05 A (codice Nimexe: 60.05-01; 27; 28; 29; 30;
    33; 36; 37; 38) della tariffa doganale comune, originari della Malaysia e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 24 juli 1978 waarbij Ierland wordt gemachtigd
    bovenkleding, kledingtoebehoren en andere artikelen, van niet-elastisch of van
    niet-gegummeerd brei- of haakwerk: bovenkleding en kledingtoebehoren: truien,
    jumpers, pull-overs en slip-overs, twinsets, vesten en jasjes van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van wol, van katoen of van kunstmatige
    textielvezels, van post ex 60.05 A van het gemeenschappelijk douanetarief (NIMEXE-code
    60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), van oorsprong uit Maleisië en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
