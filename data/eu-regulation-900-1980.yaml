id: EURegulation9001980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 900/80 of 11 April 1980 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres (discontinuous
    or waste), put up for retail sale, products of category 56 (code 0560), originating
    in Peru and Hong Kong, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 900/80 de la Commission, du 11 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques discontinues (y compris les déchets), conditionnés
    pour la vente au détail, de la catégorie de produits n° 56 (code 0560), originaires
    du Pérou et de Hong-kong bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 900/80 der Kommission vom 11. April 1980 über die
    Wiedereinführung des Zollsatzes für Garne aus synthetischen Spinnfasern (oder
    aus Abfällen von synthetischen Spinnstoffen), in Aufmachungen für den Einzelverkauf,
    der Warenkategorie Nr. 56 (Kennziffer 0560) mit Ursprung in Peru und Hongkong,
    denen die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 900/80 af 11. april 1980 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre (herunder affald),
    i detailsalgsoplægning under kategori 56 (kode 0560), som har oprindelse i Peru
    og Hongkong og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 900/80 della Commissione, dell' 11 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di fibre tessili
    sintetiche in fiocco (compresi i cascami), preparati per la vendita al minuto,
    della categoria di prodotti n. 56 (codice 0560), originari del Perù e di Hong
    Kong beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n.
    2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 900/80 van de Commissie van 11 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische stapelvezels (afval hieronder begrepen), gereed voor de verkoop in
    het klein, van de categorie van produkten nr. 56 (codenummer 0560), van oorsprong
    uit Peru en Hong-Kong waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
