title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 312/83 of 7 February 1983 re-establishing
    the levying of customs duties on woven pneumatic mattresses, products of category
    110 (code 1100), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 312/83 de la Commission du 7 février 1983 portant
    rétablissement de la perception des droits de douane applicables aux matelas
    pneumatiques, tissés, de la catégorie 110 (code 1100), originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 312/83 der Kommission vom 7. Februar 1983 über die
    Wiedereinführung des Zollsatzes für Luftmatratzen aus Geweben der Warenkategorie
    Nr. 110 (Kennziffer 1100), mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 312/83 af 7. februar 1983 om genindførelse
    af opkrævning af toldafgifter for luftmadrasser, vævede, under varekategori
    nr. 110 (kode 1100), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 312/83 της Επιτροπής
    της 7ης Φεβρουαρίου 1983 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για στρώματα
    πληρούμενα δι' αέρος, υφασμένα, των προϊόντων
    της κατηγορίας 110 (κωδικός 1100), καταγωγής Κίνας,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 312/83 della Commissione del 7 febbraio 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai materassi pneumatici, tessuti,
    della categoria di prodotti 110 (codice 1100), originari della Cina, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 312/83 van de Commissie van 7 februari 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    luchtbedden van de categorie van produkten nr. 110 (codenummer 1100) van oorsprong
    uit China, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3378/82 van de Raad
