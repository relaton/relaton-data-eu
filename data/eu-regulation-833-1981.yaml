  script: Latn
  content: Commission Regulation (EEC) No 833/81 of 30 March 1981 fixing the rates
    of the refunds applicable from 1 April 1981 to certain milk products exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 833/81 de la Commission, du 30 mars 1981, fixant les
