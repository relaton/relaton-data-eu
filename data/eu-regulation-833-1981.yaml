    laitiers exportés sous forme de marchandises ne relevant pas de l'annexe II du
    traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 833/81 der Kommission vom 30. März 1981 zur Festsetzung
    der ab 1. April 1981 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 833/81 af 30. marts 1981 om fastsættelse
