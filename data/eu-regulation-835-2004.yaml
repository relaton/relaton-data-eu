- language: en
  script: Latn
  content: Commission Regulation (EC) No 835/2004 of 28 April 2004 adapting Regulation
    (EC) No 2076/2002 and Decisions 2002/928/EC, 2004/129/EC, 2004/247/EC and 2004/248
    as regards the continued use of certain active substances not included in Annex
    I to Directive 91/414/EEC, by reason of the accession of the Czech Republic, Estonia,
    Cyprus, Latvia, Lithuania, Hungary, Malta, Poland, Slovenia and Slovakia
  type: main
- language: fr
  script: Latn
