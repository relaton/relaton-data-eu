    2004/247/CE et 2004/248/CE en ce qui concerne le maintien de l'utilisation de
    certaines substances actives non énumérées à l'annexe I de la directive 91/414/CEE,
    du fait de l'adhésion de la République tchèque, de l'Estonie, de Chypre, de
