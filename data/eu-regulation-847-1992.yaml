title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 847/92 of 2 April 1992 on the sale by the
    provedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export to Russia under Council Regulation (EEC) No 599/91
    and amending Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 847/92 de la Commission, du 2 avril 1992, relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d' intervention et destinées
    à être exportées vers la Russie en application du règlement (CEE) n° 599/91
    du Conseil et modifiant le règlement (CEE) n° 569/88
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 847/92 der Kommission vom 2. April 1992 über den
    Verkauf von Interventionsrindfleisch zur Ausfuhr nach Rußland gemäß der Verordnung
    (EWG) Nr. 2539/84 und der Verordnung (EWG) Nr. 599/91 des Rates sowie zur Änderung
    der Verordnung (EWG) Nr. 569/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 847/92 af 2. april 1992 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på eksport til Rusland i henhold til Rådets forordning (EØF) nr.
    599/91 og om ændring af forordning (EØF ) nr. 569/88
  type: main
- language: el
  script: Grek
