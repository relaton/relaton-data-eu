title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1033/71 de la Commission, du 19 mai 1971, modifiant
    le règlement (CEE) n° 1014/71 en ce qui concerne certains montants compensatoires
    fixés dans le secteur agricole à la suite de l'élargissement temporaire des
    marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1033/71 der Kommission vom 19. Mai 1971 zur Änderung
    der Verordnung (EWG) Nr. 1014/71 über bestimmte in der Landwirtschaft im Anschluß
    an die vorübergehende Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten
    festgesetzte Ausgleichsbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1033/71 della Commissione, del 19 maggio 1971, che
    modifica il regolamento (CEE) n. 1014/71 per quanto concerne taluni importi compensativi
    fissati nel settore agricolo in seguito all'ampliamento temporaneo dei margini
    di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1033/71 van de Commissie van 19 mei 1971 houdende
    wijziging van Verordening (EEG) nr. 1014/71 voor wat betreft bepaalde compenserende
    bedragen welke naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges
    van de valuta's van sommige Lid- Staten werden vastgesteld
  type: main
