title:
- language: en
  script: Latn
  content: '98/367/EC: Council Decision of 10 November 1997 concerning the conclusion
    of an Agreement in the form of an exchange of letters between the European Community
    and the Republic of Poland regarding the modernisation of the Polish oil sector
    within the framework of the Europe Agreement establishing an association between
    the European Communities and their Member States, of the one part, and the Republic
    of Poland, of the other part'
  type: main
- language: fr
  script: Latn
