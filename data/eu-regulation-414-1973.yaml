title:
- language: en
  script: Latn
  content: Regulation (EEC) No 414/73 of the Commission of 5 February 1973 fixing
    for the 1972/73 marketing year the maximum amount of the contribution to storage
    costs which sugar manufacturers may require of beet and cane producers when sugar
    is carried forward
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 414/73 de la Commission, du 5 février 1973, fixant,
    pour la campagne sucrière 1972/1973, les montants maxima pour la participation
    aux frais de stockage que les fabricants de sucre peuvent, en cas de report, exiger
    des producteurs de betteraves et de cannes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 414/73 der Kommission vom 5. Februar 1973 zur Festsetzung
    des Höchstbetrags, den die Zuckerhersteller im Zuckerwirtschaftsjahr 1972/1973
    bei Übertragungen von den Zuckerrüben- und Zuckerrohrerzeugern als Beteiligung
    an den Lagerkosten fordern können
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 414/73 af 5. februar 1973 om fastsættelse
    for sukkerproduktionsåret 1972/1973 af den maksimale andel i lageromkostningere,
    som sukkerfabrikanterne i tilfælde af overførsler kan kræve producenterne af
    sukkerroer og sukkerrør
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 414/73 della Commissione, del 5 febbraio 1973, che
    fissa per la campagna 1972/1973 l'importo massimo di partecipazione alle spese
    di magazzinaggio che i fabbricanti di zucchero, in caso di riporto, possono esigere
    dai produttori di barbabietole e di canna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 414/73 van de Commissie van 5 februari 1973 tot vaststelling
    voor het verkoopseizoen voor suiker 1972/1973 van het maximumbedrag van het aandeel
    in de opslagkosten dat de suikerfabrikanten in geval van overbrenging kunnen eisen
    van de suikerbieten- en suikerrietproducenten
  type: main
