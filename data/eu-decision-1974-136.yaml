title:
- language: en
  script: Latn
  content: Commission Decision of 5 March 1974 authorizing the Italian Republic not
    to apply Community treatment to diodes falling within heading No 85.21 ex D of
    the Common Customs Tariff, originating in Japan and in free circulation in the
    Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: Décision 74/136/CEE de la Commission, du 5 mars 1974, autorisant la République
    italienne à exclure du traitement communautaire les diodes, de la position 85.21
    Ex D du Tarif douanier commun, originaires du Japon et mises en libre pratique
    en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. März 1974, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in der Bundesrepublik Deutschland
    im freien Verkehr befindliche Dioden der Tarifnummer 85.21 ex D des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. marts 1974 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage dioder, som henhører under
    position 85.21 ex D i den fælles toldtarif, har oprindelse i Japan og frit kan
    omsættes i forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 marzo 1974, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i diodi della voce n. 85.21
    ex D della tariffa doganale comune, originari del Giappone e messi in libera pratica
    nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 maart 1974 waarbij de Italiaanse Republiek
    wordt gemachtigd diodes van post 85.21 ex D van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de Bondsrepubliek Duitsland in het vrije verkeer
    gebracht van de communautaire behandeling uit te sluiten
  type: main
