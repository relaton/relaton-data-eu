title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1656/71 de la Commission, du 23 juillet 1971, fixant
    les taux des restitutions applicables, à compter du 1er août 1971, à certains
    produits laitiers exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1656/71 der Kommission vom 23. Juli 1971 zur Festsetzung
    der ab 1. August 1971 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1656/71 della Commissione, del 23 luglio 1971, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 agosto 1971, a
    taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1656/71 van de Commissie van 23 juli 1971 houdende
    vaststelling van de restituties welke vanaf 1 augustus 1971 van toepassing zijn
    op bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het Verdrag vermelde goederen
