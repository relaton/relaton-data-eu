title:
- language: en
  script: Latn
  content: '95/252/EC: Council Decision of 29 June 1995 authorizing the United Kingdom
    to apply a measure derogating from Articles 6 and 17 of the Sixth Council Directive
    (77/388/EEC) on the harmonization of the laws of the Member States relating to
    turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '95/252/CE: Décision du Conseil, du 29 juin 1995, autorisant le Royaume-Uni
    à appliquer une mesure dérogatoire aux articles 6 et 17 de la sixième directive
    TVA 77/388/CEE en matière d''harmonisation des législations des États membres
    relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '95/252/EG: Entscheidung des Rates vom 29. Juni 1995 mit der das Vereinigte
    Königreich zur Anwendung einer von den Artikeln 6 und 17 der Sechsten Richtlinie
    (77/388/EWG) zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über
    die Umsatzsteuern abweichenden Sondermaßnahme ermächtigt wird'
  type: main
- language: da
  script: Latn
  content: '95/252/EF: Rådets beslutning af 29. juni 1995 om at give Det Forenede
    Kongerige tilladelse til at indføre en foranstaltning, der fragiver bestemmelserne
    i artikel 6 og 17 i sjette momsdirektiv (77/388/EØF) om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '95/252/ΕΚ: Απόφαση του Συμβουλίου της 29ης
    Ιουνίου 1995 με την οποία επιτρέπεται στο Ηνωμένο
    Βασίλειο να εφαρμόσει ένα μέτρο παρέκκλισης
    από τα άρθρα 6 και 17 της έκτης οδηγίας ΦΠΑ (77/388/ΕΟΚ)
    περί εναρμονίσεως των νομοθεσιών των κρατών
    μελών των σχετικών με τους φόρους κύκλου εργασιών'
  type: main
- language: fi
  script: Latn
  content: '95/252/EY: Neuvoston päätös, tehty 29 päivänä kesäkuuta 1995, Yhdistyneen
    kuningaskunnan valtuuttamisesta soveltamaan jäsenvaltioiden liikevaihtoverolainsäädännön
    yhdenmukaistamisesta annetun kuudennen direktiivin 77/388/ETY 6 ja 17 artiklasta
    poikkeavaa järjestelyä'
  type: main
- language: it
  script: Latn
  content: '95/252/CE: Decisione del Consiglio, del 29 giugno 1995, che autorizza
    il Regno Unito ad applicare una misura di deroga agli articoli 6 e 17 della sesta
    direttiva IVA (77/388/CEE) in materia di armonizzazione delle legislazioni degli
    Stati membri relative alle imposte sulla cifra d''affari'
  type: main
- language: nl
  script: Latn
  content: '95/252/EG: Beschikking van de Raad van 29 juni 1995 waarbij het Verenigd
    Koninkrijk wordt gemachtigd een maatregel toe te passen die afwijkt van de artikelen
    6 en 17 van Zesde BTW-Richtlijn 77/388/EEG betreffende de harmonisatie van de
    wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '95/252/CE: Decisão do Conselho, de 29 de Junho de 1995, que autoriza
    o Reino Unido a aplicar uma medida derrogatória dos artigos 6º e 17º da Sexta
    Directiva IVA (77/388/CEE) relativa à harmonização das legislações dos Estados-membros
    respeitantes aos impostos sobre o volume de negócios'
  type: main
- language: es
  script: Latn
  content: '95/252/CE: Decisión del Consejo, de 29 de junio de 1995, por la que se
