  content: COMMISSION REGULATION (EC) No 89/95 of 20 January 1995 determining the
    extent to which applications lodged in January 1995 for import certificates for
    certain cheeses covered by the arrangements provided for in the Interim Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 89/95 DE LA COMMISSION du 20 janvier 1995 déterminant
