    en janvier 1995 pour certains fromages dans le cadre du régime prévu par les
    accords intérimaires conclus par la Communauté avec la Bulgarie et la Roumanie
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 89/95 DER KOMMISSION vom 20. Januar 1995 zur Festsetzung
