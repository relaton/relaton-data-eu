  content: Council Regulation (EEC) No 3415/90 of 27 November 1990 fixing, for the
    1990/91 marketing year, the representative market price and the threshold price
    for olive oil and the percentages of consumption aid to be retained in accordance
    with article 11 (5) and (6) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3415/90 du Conseil du 27 novembre 1990 fixant, pour
