title:
- language: en
  script: Latn
  content: '84/363/EEC: Council Decision of 16 July 1984 extending the period of application
    of Decision 82/530/EEC authorizing the United Kingdom to permit the Isle of Man
    authorities to apply a system of special import licences to sheepmeat and beef
    and veal'
  type: main
- language: fr
  script: Latn
  content: '84/363/CEE: Décision du Conseil du 16 juillet 1984 prorogeant la décision
    82/530/CEE autorisant le Royaume-Uni à permettre aux autorités de l'' île de
    Man d'' appliquer un système de certificats spéciaux d'' importation pour la
    viande ovine et la viande bovine'
  type: main
- language: de
  script: Latn
  content: '84/363/EWG: Entscheidung des Rates vom 16. Juli 1984 zur Verlängerung
    der Entscheidung 82/530/EWG zur Ermächtigung des Vereinigten Königreichs, der
    Regierung der Insel Man zu gestatten, bei Schaf- und Rindfleisch eine besondere
    Einfuhrlizenzregelung anzuwenden'
  type: main
- language: da
  script: Latn
  content: '84/363/EØF: Rådets beslutning af 16. juli 1984 om forlængelse af anvendelsesperioden
    for beslutning 82/530/EØF om bemyndigelse til Det forenede Kongerige til at tillade
    myndighederne på øen Man at anvende en ordning med særlige importlicenser for
    fårekød og oksekød og kalvekød'
  type: main
- language: el
  script: Grek
  content: '84/363/ΕΟΚ: Απόφαση του Συμβουλίου της 16ης
    Ιουλίου 1984 για την παράταση της απόφασης 82/530/ΕΟΚ
    περί εξουσιοδοτήσεως του Ηνωμένου Βασιλείου
    να επιτρέψει στις αρχές της Νήσου Μαν την εφαρμογή
    καθεστώτος ειδικών αδειών εισαγωγής προβείου
    και βοείου κρέατος'
  type: main
- language: it
  script: Latn
  content: '84/363/CEE: Decisione del Consiglio del 16 luglio 1984 recante proroga
    della decisione 82/530/CEE che autorizza il Regno Unito a consentire alle autorità
    dell'' isola di Man di applicare un regime di titoli d'' importazione speciali
    per le carni ovine e bovine'
  type: main
- language: nl
  script: Latn
  content: '84/363/EEG: Beschikking van de Raad van 16 juli 1984 tot verlenging van
    de geldigheidsduur van Beschikking 82/530/EEG waarbij het Verenigd Koninkrijk
    wordt gemachtigd de autoriteiten van het eiland Man toe te staan een stelsel van
    bijzondere invoervergunningen toe te passen voor schapevlees en rundvlees'
  type: main
