  script: Latn
  content: Council Decision (EU) 2021/990 of 7 June 2021 on the conclusion, on behalf
    of the Union, of the Agreement in the form of an Exchange of Letters between the
    European Union and the Republic of Cuba pursuant to Article XXVIII of the General
    Agreement on Tariffs and Trade (GATT) 1994 relating to the modification of concessions
    on all the tariff-rate quotas included in the EU Schedule CLXXV as a consequence
    of the United Kingdom’s withdrawal from the European Union
  type: main
