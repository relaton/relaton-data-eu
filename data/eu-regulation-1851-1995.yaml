title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1851/95 of 26 July 1995 amending Regulation
    (EEC) No 1995/92 laying down detailed rules for the application, in respect of
    potato starch of the import arrangements provided for in the Interim Agreement
    concluded between the European Community and the European Coal and Steel Community,
    of the one part and the Republic of Poland, of the other part in order to implement
    the Agreement on Agriculture concluded during the Uruguay Round negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1851/95 de la Commission, du 26 juillet 1995, modifiant
    le règlement (CEE) n° 1995/92 établissant les modalités d'application, pour
    la fécule de pommes de terre, du régime d'importation prévu par l'accord intérimaire
    conclu entre la Communauté économique européenne et la Communauté européenne
    du charbon et de l'acier, d'une part, et la République de Pologne, d'autre part,
    en vue de la mise en oeuvre de l'accord sur l'agriculture conclu dans le cadre
    des négociations du cycle d'Uruguay
  type: main
- language: de
  script: Latn
