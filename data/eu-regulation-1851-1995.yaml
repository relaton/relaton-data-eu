    do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1851/95 de la Comisión, de 26 de julio de 1995, por
    el que se modifica el Reglamento (CEE) nº 1995/92, por el que se establecen,
    respecto a la fécula de patata, las disposiciones de aplicación del régimen
    de importación previsto por el Acuerdo interino celebrado entre la Comunidad
    Económica Europea y la Comunidad Europea del Carbón y del Acero, por una parte,
