title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1425/71 of the Council of 2 July 1971 supplementing
    Regulation (EEC) No 865/68 on the common organisation of the market in products
    processed from fruit and vegetables by certain provisions on the granting of export
    refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1425/71 du Conseil, du 2 juillet 1971, complétant
    le règlement (CEE)" n° 865/68 portant organisation commune des marchés dans
    le secteur des produits transformés à base de fruits et légumes, par certaines
    dispositions relatives à l' octroi des restitutions à l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1425/71 des Rates vom 2. Juli 1971 zur Ergänzung
    der Verordnung (EWG) Nr. 865/68 über die gemeinsame Marktorganisation für Verarbeitungserzeugnisse
    aus Obst und Gemüse durch einige Vorschriften über die Gewährung der Ausfuhrerstattungen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1425/71 af 2. juli 1971 til supplering af
    forordning (EØF) nr. 865/68 om den fælles markedsordning for forarbejdede produkter
    af frugt og grønsager med visse bestemmelser vedrørende ydelse af eksportrestitutioner
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1425/71 del Consiglio, del 2 luglio 1971, che completa
    il regolamento (CEE) n. 865/68, relativo all' organizzazione comune dei mercati
    nel settore dei prodotti trasformati a base di ortofrutticoli, con alcune disposizioni
    relative alla concessione delle restituzioni all' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1425/71 van de Raad van 2 juli 1971 tot aanvulling
    van Verordening (EEG) nr. 865/68 houdende een gemeenschappelijke ordening der
    markten in de sector van op basis van groenten en fruit verwerkte produkten, met
    enkele bepalingen betreffende de toekenning van restituties bij uitvoer
  type: main
