  script: Latn
  content: '2013/97/EU: Commission Implementing Decision of 19 February 2013 granting
    derogations to certain Member States with respect to the transmission of statistics
    pursuant to Regulation (EC) No 1338/2008 of the European Parliament and of the
    Council on Community statistics on public health and health and safety at work,
    as regards statistics based on the European Health Interview Survey (EHIS) (notified
    under document C(2013) 784)'
  type: main
- language: fr
  script: Latn
