title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1927/73 of 16 July 1973 determining for the 1973/74
    marketing year the principal marketing centres for cereals and the derived intervention
    prices applicable at those centres and the single intervention price for maize,
    for durum wheat and for rye respectively
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1927/73 du Conseil, du 16 juillet 1973, fixant, pour
    la campagne 1973/1974, les principaux centres de commercialisation des céréales
    et les prix d'intervention dérivés s'y rapportant, ainsi que les prix d'intervention
    uniques pour le maïs, pour le froment dur et pour le seigle
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1927/73 des Rates vom 16. Juli 1973 zur Festlegung
    der wesentlichsten Handelsplätze für Getreide, der für diese Handelsplätze
    geltenden abgeleiteten Interventionspreise sowie des jeweils für Mais, Hartweizen
    und für Roggen geltenden einzigen Interventionspreises für das Wirtschaftsjahr
    1973/1974
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1927/73 af 16. juli 1973 om fastsættelse
    for høståret 1973/1974 af de vigtigste handelscentre for korn og fastsættelse
    af afledte interventionspriser herfor, samt af fælles interventionspriser for
    majs, hård hvede og rug
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1927/73 del Consiglio, del 16 luglio 1973, che fissa,
    per la campagna 1973/1974, i principali centri di commercializzazione dei cereali
    ed i relativi prezzi d'intervento derivati, nonché il prezzo d'intervento unico
    rispettivamente per il granturco, per il frumento duro e per la segala
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1927/73 van de Raad van 16 juli 1973 houdende vaststelling,
    voor het verkoopseizoen 1973/1974, van de voornaamste commercialisatiecentra voor
    granen, de voor deze centra geldende afgeleide interventieprijzen, alsmede de
    uniforme interventieprijzen voor maïs, durum tarwe en rogge
  type: main
