title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2166/80 of 11 August 1980 laying down for the
    year 1980 certain measures for the conservation and management of fishery resources
    off the West Greenland coast applicable to vessels flying the flag of a Member
    State
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2166/80 du Conseil, du 11 août 1980, arrêtant, pour
    l' année 1980, certaines mesures de conservation et de gestion des ressources
    de pêche situées au large de la côte occidentale du Groenland, applicables
    aux navires battant pavillon d' un État membre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2166/80 des Rates vom 11. August 1980 zur Festlegung
    von Maßnahmen für 1980 zur Erhaltung und Bewirtschaftung der Fischbestände
    vor der Westküste Grönlands gegenüber Schiffen unter der Flagge eines Mitgliedstaats
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2166/80 af 11. august 1980 om fastsættelse
    af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne ud
    for Grønlands vestkyst i 1980, som skal gælde for fartøjer, der fører en medlemsstats
    flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2166/80 del Consiglio, dell' 11 agosto 1980, che adotta
    per il 1980 talune misure di conservazione e di gestione delle risorse ittiche
    al largo delle coste occidentali della Groenlandia, applicabili alle navi battenti
    bandiera di uno Stato membro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2166/80 van de Raad van 11 augustus 1980 tot vaststelling,
    voor 1980, van bepaalde maatregelen ten aanzien van de instandhouding en het beheer
    van de visbestanden voor de kust van West-Groenland, die van toepassing zijn op
    vaartuigen die de vlag van een Lid-Staat voeren
  type: main
