title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2015/80 of 28 July 1980 re-establishing
    the levying of customs duties on woven swimwear, etc., products of category 79
    (code 0790), originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2015/80 de la Commission, du 28 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux culottes
    et maillots de bain, tissés, etc., de la catégorie de produits n° 79 (code
    0790), originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2015/80 der Kommission vom 28. Juli 1980 über die
    Wiedereinführung des Zollsatzes für Badehosen und -anzüge aus Geweben usw.,
    der Warenkategorie Nr. 79 (Kennziffer 0790), mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2015/80 af 28. juli 1980 om genindførelse
    af opkrævning af toldafgifter for badebeklædning, etc., under varekategori 79
    (kode 0790), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2015/80 della Commissione, del 28 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai costumi e mutandine
    da bagno, tessuti, ecc., della categoria di prodotti n. 79 (codice 0790), originari
    della Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2015/80 van de Commissie van 28 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    zwembroeken en badpakken, enz., van de categorie van produkten nr. 79 (codenummer
    0790), van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
