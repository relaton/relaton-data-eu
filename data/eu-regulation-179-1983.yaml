  content: Council Regulation (EEC) No 179/83 of 25 January 1983 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 179/83 du Conseil du 25 janvier 1983 fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de la Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 179/83 des Rates vom 25. Januar 1983 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter schwedischer Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 179/83 af 25. januar 1983 om fastsættelse
