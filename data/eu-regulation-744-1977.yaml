  content: Council Regulation (EEC) No 744/77 of 5 April 1977 on the advance implementation
    of certain provisions of the ACP-EEC Convention of Lome relating to trade in respect
    of certain States which have signed Agreements of Accession to the Convention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 744/77 du Conseil, du 5 avril 1977, concernant l'application
    par anticipation de certaines dispositions de la convention ACP-CEE de Lomé afférentes
    aux échanges en ce qui concerne certains États signataires d'accords d'accession
    à cette convention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 744/77 des Rates vom 5. April 1977 über die vorzeitige
    Anwendung einiger den Warenhandel betreffender Bestimmungen des AKP-EWG-Abkommens
    von Lome gegenüber einigen Staaten, die Abkommen über den Beitritt zu diesem
    Abkommen unterzeichnet haben
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 744/77 af 5. april 1977 om fremskyndet anvendelse
    af visse bestemmelser i Lomé-konventionen AVS/EØF vedrørende samhandelen for
    så vidt angår visse stater, der har undertegnet aftalen om tiltrædelse af denne
    konvention
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 744/77 del Consiglio, del 5 aprile 1977, relativo
    all'applicazione anticipata di talune disposizioni della convenzione ACP-CEE di
    Lomé, concernenti gli scambi per quanto riguarda taluni Stati firmatari di accordi
    di accessione a detta convenzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 744/77 van de Raad van 5 april 1977 betreffende de
    vervroegde toepassing van sommige bepalingen van de ACS-EEG-Overeenkomst van Lomé
    met betrekking tot het handelsverkeer ten aanzien van bepaalde Staten die een
    akkoord houdende toetreding tot deze Overeenkomst hebben ondertekend
