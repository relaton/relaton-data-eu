    (ΕΚ) αριθ. 702/2001 και ορίζει σε 144636 τόνους τη διαρκή
    δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά μαλακού σίτου που έχει στη διάθεσή του
    ο σουηδικός οργανισμός παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 977/2001, annettu 18 päivänä toukokuuta 2001,
    asetuksen (EY) N:o 702/2001 muuttamisesta ja pysyvän tarjouskilpailun nostamisesta
    144636 tonniin Ruotsin interventioelimen hallussaan pitämän vehnämäärän
    uudelleen myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 977/2001 della Commissione, del 18 maggio 2001, che
