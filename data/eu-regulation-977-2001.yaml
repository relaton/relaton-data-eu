title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 977/2001 of 18 May 2001 amending Regulation
    (EC) No 702/2001 and increasing to 144636 tonnes the amount of common wheat held
    by the Swedish intervention agency for which a standing invitation to tender for
    resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 977/2001 de la Commission du 18 mai 2001 modifiant
    le règlement (CE) n° 702/2001 et portant à 144636 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de blé tendre détenu par l'organisme
    d'intervention suédois
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 977/2001 der Kommission vom 18. Mai 2001 zur Änderung
    der Verordnung (EG) Nr. 702/2001 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Weichweizen aus Beständen der schwedischen
    Interventionsstelle auf 144636 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 977/2001 af 18. maj 2001 om ændring
    af forordning (EF) nr. 702/2001 og om forhøjelse til 144636 tons af den løbende
    licitation med henblik på videresalg på det indre marked af blød hvede som
    det svenske interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
