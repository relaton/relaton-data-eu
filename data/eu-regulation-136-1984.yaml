id: EURegulation1361984
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 136/84 of 19 January 1984 laying down to
    what extent applications for issue of export licences submitted during January
    1984 for beef and veal products which may benefit from special import treatment
    in a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 136/84 de la Commission, du 19 janvier 1984, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de janvier 1984 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 136/84 der Kommission vom 19. Januar 1984 über das
    Ausmaß, in dem den im Januar 1984 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 136/84 af 19. januar 1984 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i januar
    1984 for oksekødsprodukter, for hvilke der indrømmes særbehandling ved indførsel
    til et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 136/84 της Επιτροπής
    της 19ης Ιανουαρίου 1984 που καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Ιανουάριο 1984 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 136/84 della Commissione, del 19 gennaio 1984, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di gennaio 1984 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 136/84 van de Commissie van 19 januari 1984 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in januari 1984 ingediende
    aanvragen om uitvoercertificaten voor produkten van de sector rundvlees waarvoor
    een bijzondere behandeling geldt bij invoer in een derde land
  type: main
