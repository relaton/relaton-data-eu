title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1627/80 of 26 June 1980 re-establishing
    the levying of customs duties on clocks with watch movements (excluding clocks
    of heading No 91.03), falling within heading No 91.02 and originating in China,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1627/80 de la Commission, du 26 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux pendulettes
    et réveils à mouvement de montre, de la position 91.02 du tarif douanier commun,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1627/80 der Kommission vom 26. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Uhren mit Kleinuhr-Werk der Tarifnummer 91.02, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1627/80 af 26. juni 1980 om genindførelse
    af opkrævning af toldafgifter for andre ure med lommeværk (undtagen ure henhørende
    under pos. 91.03), under pos. 91.02, som har oprindelse i Kina og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1627/80 della Commissione, del 26 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle pendolette e sveglie,
    con movimento di orologi tascabili, della voce 91.02 della tariffa doganale comune,
    originarie della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1627/80 van de Commissie van 26 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op klokjes
    en wekkers, met horlogeuurwerk, van post 91.02, van oorsprong uit China ten behoeve
    waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
