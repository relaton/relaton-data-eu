title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 198/68 du Conseil, du 20 février 1968, modifiant
    et prorogeant le règlement n° 361/67/CEE relatif au régime applicable aux produits
    transformés à base de céréales et de riz originaires des États africains
    et malgache associés et des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 198/68 des Rates vom 20. Februar 1968 zur Änderung
    und Verlängerung der Verordnung Nr. 361/67/EWG über die Regelung für Getreide-
    und Reisverarbeitungserzeugnisse mit Ursprung in den assoziierten afrikanischen
    Staaten und Madagaskar oder in den überseeischen Ländern und Gebieten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 198/68 del Consiglio, del 20 febbraio 1968, che modifica
    e proroga il regolamento n. 361/67/CEE relativo al regime applicabile ai prodotti
    trasformati a base di cereali e di riso originari degli Stati africani e malgascio
    associati e dei paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 198/68 van de Raad van 20 februari 1968 tot wijziging
    en verlenging van Verordening nr. 361/67/EEG betreffende de regeling voor op basis
    van granen en rijst verwerkte produkten van oorsprong uit de geassocieerde Afrikaanse
    staten en Madagaskar of de landen en gebieden overzee
  type: main
