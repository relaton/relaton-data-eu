    ei ole farmatseutiline
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 467/97, annettu 3 päivänä maaliskuuta 1997,
    tullittomuuden myöntämisestä tietyille lääkeaineille, joilla on Maailman
    terveysjärjestön kansainvälinen yleisnimi (INN), ja tietyille lääkevalmisteiden
    valmistuksessa käytettäville tuotteille sekä lääkkeille kuuluvan tullittomuuden
    peruuttamisesta tiettyjen sellaisten INN-luettelon aineiden osalta, joiden pääasiallinen
    käyttö ei ole lääkkeellistä
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 467/97 od 3. ožujka 1997. o oslobođenju od carina
    za određene farmaceutske aktivne sastojke koji kod Svjetske zdravstvene organizacije
    imaju „međunarodno nezaštićeni naziv” (INN) te određene proizvode koji
    se koriste za izradu gotovih farmaceutskih proizvoda i kojom se određenim INN-ovima,
    čija namjena nije prvenstveno farmaceutska, opoziva oslobođenje od carina namijenjeno
    farmaceutskim proizvodima
  type: main
- language: hu
  script: Latn
  content: A Tanács 467/97/EK rendelete (1997. március 3.) meghatározott, az Egészségügyi
    Világszervezet nemzetközi szabadneveit (INN) viselő gyógyszer-hatóanyagok,
    valamint gyógyszerészeti késztermékek előállításához használt meghatározott
    termékek vámmentes kezeléséről és bizonyos, elsődlegesen nem gyógyszerészeti
    használatú INN-ektől a gyógyszerpiari termékre vonatkozó a vámmentes kezelés
    visszavonásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 467/97 del Consiglio del 3 marzo 1997 che dispone l'ammissione
    in esenzione da dazi doganali per taluni principi attivi che hanno ricevuto una
    «denominazione comune internazionale» (DCI) dall'Organizzazione mondiale della
    sanità e per taluni prodotti utilizzati nella lavorazione di prodotti farmaceutici
    finiti, nonché la revoca dell'esenzione da dazi riservata ai prodotti farmaceutici,
    per alcuni DCI di uso prevalentemente non farmaceutico
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 467/97 (1997. gada 3. marts), kas paredz beznodokļu
    režīmu noteiktām farmaceitiski aktīvām sastāvdaļām ar starptautisko nepatentēto
    nosaukumu (SNN), ko piešķīrusi Pasaules Veselības organizācija, un noteiktiem
    produktiem, ko izmanto gatavo farmaceitisko līdzekļu ražošanā, kā arī atceļ
    beznodokļu režīmu tiem atsevišķiem SNN farmaceitiskiem produktiem, kurus
    neizmanto pirmām kārtām farmaceitiskiem mērķiem
  type: main
- language: lt
  script: Latn
  content: 1997 m. kovo 3 d. Tarybos reglamentas (EB) Nr. 467/97, numatantis atleisti
    nuo muitų mokesčių tam tikras vaistines veikliąsias medžiagas, turinčias
    Pasaulinės sveikatos organizacijos tarptautinį nepatentuotą pavadinimą (INN),
    ir tam tikrus produktus, naudojamus gaminti gatavus vaistus, bei panaikinti atleidimą
    nuo muitų mokesčių kai kuriems INN, kurie daugiausia naudojami ne farmacijoje
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 467/97 tat-3 ta' Marzu 1997 li jipprovdi
    għal trattament liberu mid-dazju għal ingredjenti speċifikati attiva farmaċewtikament
    li jkollhom isem internazzjonali mhux proprjetarju (INN) mill-Organiżżazzjoni
    Dinjija tas-Saħħa u prodotti speċifikati wżati għall-manifattura ta' farmaċewtiċi
    kompluti u li jirtira t-trattament liberu mid-dazju peress li prodotti farmaċewtiċi
    minn ċerti INNs li l-użu ewlieni tagħhom mhux farmaċewtiku
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 467/97 van de Raad van 3 maart 1997 betreffende vrijstelling
    van rechten voor bepaalde farmaceutische werkzame bestanddelen met een "internationale
    generieke benaming" ("international nonproprietary name") (INN) van de Wereldgezondheidsorganisatie
    en voor bepaalde producten die gebruikt worden voor de vervaardiging van farmaceutische
    eindproducten, alsmede betreffende de intrekking van de vrijstelling van rechten
    voor bepaalde INN's die als farmaceutische producten zijn aangemerkt, maar die
    hoofdzakelijk voor niet-farmaceutische doeleinden worden gebruikt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie rady (WE) NR 467/97 z dnia 3 marca 1997 r. przewidujące
