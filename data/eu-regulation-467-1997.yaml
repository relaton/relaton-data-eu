    χρήση δεν είναι φαρμακευτική
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 467/97, 3. märts 1997, millega nähakse ette
    tollimaksuvaba režiim teatavate farmatseutiliste toimeainete suhtes, mis kannavad
    Maailma Tervishoiuorganisatsiooni antud rahvusvahelisi mittekaubanduslikke nimetusi
