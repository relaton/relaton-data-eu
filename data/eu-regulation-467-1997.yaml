title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 467/97 of 3 March 1997 providing for duty-free
    treatment for specified pharmaceutical active ingredients bearing an 'international
    non-proprietary name' (INN) from the World Health Organization and specified products
    used for the manufacture of finished pharmaceuticals and withdrawing duty-free
    treatment as pharmaceutical products from certain INNs whose predominant use is
    not pharmaceutical
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 467/97 du Conseil du 3 mars 1997 prévoyant l'admission
    en exonération des droits pour certains principes actifs portant une «dénomination
    commune internationale» (DCI) de l'Organisation mondiale de la santé et certains
    produits utilisés pour la fabrication de produits pharmaceutiques finis, ainsi
    que la suppression de l'exonération des droits réservée aux produits pharmaceutiques
    pour certaines DCI dont l'utilisation prédominante n'est pas pharmaceutique
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 467/97 des Rates vom 3. März 1997 über die Zollbefreiung
    für bestimmte pharmazeutische Wirkstoffe, die einen von der Weltgesundheitsorganisation
    vergebenen "Internationalen Freinamen" (INN) tragen, und für bestimmte Erzeugnisse,
    die bei der Herstellung pharmazeutischer Fertigerzeugnisse verwendet werden, sowie
    über die Rücknahme der Zollbefreiung für bestimmte in erster Linie nichtpharmazeutischen
    Zwecken dienende INN
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕO) № 467/97 на Съвета oт 3 март 1997
    година относно предвиждане на освобождаване
    от мита на някои фармацевтични активни субстанции
    с „международни непатентни наименования“
    (INN) от Световната здравна организация и на
    някои продукти, използвани при производство
    на крайни фармацевтични продукти, както и отмяна
    на освобождаването от мита в качеството им
    на фармацевтични продукти за някои субстанции
    по INN, чиято преимуществена употреба не е за
    фармацевтични цели
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 467/97 ze dne 3. března 1997, kterým se stanoví
    osvobození od cla pro určité farmaceutické účinné látky nesoucí mezinárodní
    nechráněný název (INN) udělený Světovou zdravotnickou organizací a pro
    určité produkty, které se používají k výrobě hotových farmaceutických
    výrobků, a kterým se stanoví zrušení osvobození od cla vyhrazené farmaceutickým
    výrobkům, pokud jde o určité INN, jejichž převážné použití není farmaceutické
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 467/97 af 3. marts 1997 om sikring af toldfri
    behandling af specificerede aktive farmaceutiske ingredienser på WHO's liste
    over internationale ikke-navnebeskyttede navne (INNs) og af specificerede varer,
    der anvendes til fremstilling af farmaceutiske færdigvarer samt tilbagetrækning
    af den toldfri behandling af visse INNs, som er indrømmet disse i egenskab af
    farmaceutiske varer, selv om de hovedsagelig anvendes til ikke-farmaceutiske formål
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 467/97 του Συμβουλίου
    της 3ης Μαρτίου 1997 που προβλέπει την ατελή μεταχείριση
    για ορισμένα φαρμακευτικά ενεργά συστατικά
    που φέρουν «διεθνή μη κατοχυρωμένη ονομασία»
