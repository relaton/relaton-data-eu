    międzynarodową niezastrzeżoną prawnie nazwę (INN) Światowej Organizacji
    Zdrowia i określonych produktów używanych do wytwarzania gotowych środków
    farmaceutycznych oraz wycofujące bezcłowe traktowanie produktów farmaceutycznych
    objętych niektórymi INN, których dominujące użycie nie jest farmaceutyczne
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 467/97 do Conselho de 3 de Março de 1997 que prevê
    a concessão de isenção de direitos para determinados princípios activos farmacêuticos
    com uma «denominação comum internacional» (DCI) da Organização Mundial de
    Saúde e para determinados produtos utilizados no fabrico de produtos farmacêuticos
    acabados, e a supressão da isenção de direitos reservada aos produtos farmacêuticos
    em relação a determinados produtos DCI com uma utilização predominante não
    farmacêutica
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 467/97 al Consiliului din 3 martie 1997 de admitere
    cu scutire de drepturi a anumitor principii active care poartă o „denumire
    comună internațională” (DCI) a Organizației Mondiale a Sănătății și
    pentru anumite produse folosite pentru fabricarea produselor farmaceutice finite,
    și de revocare a scutirii de drepturi rezervate produselor farmaceutice pentru
    anumite DCI a căror utilizare predominantă nu este cea farmaceutică
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 467/97 z 3. marca 1997, ktorým sa ustanovuje
    oslobodenie od colných poplatkov pre určité farmaceutické aktívne zložky,
    ktoré majú medzinárodný generický názov (INN) pridelený Svetovou zdravotníckou
    organizáciou, a pre určité produkty a pre stanovené produkty používané
    na výrobu hotových farmaceutík a ktorým sa ruší oslobodenie od cla pre farmaceutické
    produkty z niektorých INN, ktorých prevažné použitie nie je farmaceutické
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 467/97 z dne 3. marca 1997 o dajatve prosti obravnavi
    določenih farmacevtskih aktivnih snovi, ki imajo pri Svetovni zdravstveni organizaciji
    mednarodno nezaščiteno ime (INN), in določenih izdelkov, ki se uporabljajo
    pri proizvodnji gotovih farmacevtskih izdelkov, ter o odpravi dajatve proste obravnave
    kot farmacevtski izdelki za določene INN substance, ki se prvenstveno ne uporabljajo
    za farmacevtske namene
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 467/97 del Consejo de 3 de marzo de 1997 por el que
    se establece la exención de derechos para determinados principios farmacéuticos
    activos que poseen una «denominación común internacional» (DCI) de la Organización
    Mundial de la Salud y para determinados productos utilizados para la fabricación
    de productos farmacéuticos acabados y por el que se establece la supresión de
    la exención de derechos en calidad de productos farmacéuticos para determinadas
    DCI que se destinan principalmente a usos no farmacéuticos
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 467/97 av den 3 mars 1997 om tullfri behandling
    för vissa aktiva ingredienser som har fått en internationell generisk beteckning
    (INN) inom ramen för Världshälsoorganisationen och för vissa produkter som
    används vid framställningen av färdiga farmaceutiska produkter samt om upphörande
    med tullfri behandling som farmaceutiska produkter för vissa INN, vilkas huvudsakliga
    användningsområde inte är farmaceutiskt
