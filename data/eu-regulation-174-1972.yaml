  content: Règlement (CEE) n° 174/72 de la Commission, du 26 janvier 1972, complétant
    le règlement (CEE) n° 1344/71 en ce qui concerne la conversion en franc français
    du montant à payer par les fabricants de sucre aux vendeurs de betteraves produites
    hors du quota de base pendant la campagne sucrière 1970/1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 174/72 der Kommission vom 26. Januar 1972 zur Ergänzung
    der Verordnung (EWG) Nr. 1344/71 betreffend die Umrechnung in französische Franken
    des durch die Zuckerhersteller zu bezahlenden Betrages an die Verkäufer von Zuckerrüben,
    die im Zuckerwirtschaftsjahr 1970/1971 oberhalb der Grundquote erzeugt wurden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 174/72 della Commissione, del 26 gennaio 1972, che
    completa il regolamento (CEE) n. 1344/71 per quanto riguarda la conversione in
    franchi francesi dell'importo che i fabbricanti di zucchero devono pagare ai venditori
    di barbabietole prodotte in eccedenza della quota di base nella campagna saccarifera
    1970/1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 174/72 van de Commissie van 26 januari 1972 houdende
    aanvulling van Verordening (EEG) nr. 1344/71 ten aanzien van de omrekening in
    Franse franken van het door de suikerfabrikanten te betalen bedrag aan de verkopers
    van suikerbieten, geproduceerd gedurende het verkoopseizoen voor suiker 1970/1971
    boven het basisquotum
  type: main
