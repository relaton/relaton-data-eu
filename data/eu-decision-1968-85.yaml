title:
- language: fr
  script: Latn
  content: '68/85/CEE: Décision de la Commission, du 25 janvier 1968, autorisant
    la République française en vertu de l''article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire les "instruments et appareils électriques
    ou électroniques de mesure, de vérification, de contrôle, de régulation ou
    d''analyse" de la position Ex 90.28 B du Tarif douanier commun originaires du
    Japon et mis en libre pratique dans d''autres États membres'
  type: main
- language: de
  script: Latn
  content: '68/85/EWG: Entscheidung der Kommission vom 25. Januar 1968, mit der die
    Französische Republik gemäß Artikel 115 Absatz 1 des Vertrages ermächtigt
    wird, aus Japan stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche "elektrische oder elektronische Instrumente, Apparate und Geräte
    zum Messen, Prüfen, Kontrollieren, Regeln oder zum Analysieren" der Tarifnummer
    ex 90.28 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '68/85/CEE: Decisione della Commissione, del 25 gennaio 1968, con cui,
    a norma dell''articolo 115, paragrafo 1, del trattato, si autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli «strumenti ed apparecchi
    elettrici o elettronici di misura, di verifica, di controllo, di regolazione o
    di analisi» di cui alla voce ex 90.28 B della tariffa doganale comune originari
    del Giappone ed immessi in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '68/85/EEG: Beschikking van de Commissie van 25 januari 1968 houdende machtiging
    van de Franse Republiek om, op grond van artikel 115, eerste alinea, van het Verdrag
    elektrische of elektronische meet-, verificatie-, controle-, regel- of analyseerinstrumenten,
    -apparaten en -toestellen van post ex 90.28 B van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in andere Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
