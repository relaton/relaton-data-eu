  content: Council Regulation (EEC) No 152/78 of 23 January 1978 amending Regulations
    (EEC) No 1059/69, (EEC) No 1060/69 and (EEC) No 2682/72 on the trade arrangements
    for processed agricultural products not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 152/78 du Conseil, du 23 janvier 1978, modifiant les
    règlements (CEE) n° 1059/69, (CEE) n° 1060/69 et (CEE) n° 2682/72 relatifs
    au régime d' échanges applicable à certaines marchandises résultant de la
    transformation de produits agricoles et ne relevant pas de l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 152/78 des Rates vom 23. Januar 1978 zur Änderung
    der Verordnungen (EWG) Nrn. 1059/69, 1060/69 und 2682/72 über die Handelsregelung
    für bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren, die nicht
    unter Anhang II des Vertrages fallen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 152/78 af 23. januar 1978 om ændring af
    forordning (EØF) nr. 1059/69, (EØF) nr. 1060/69 og (EØF) nr. 2682/72 vedrørende
    ordningen for handelen med varer fremstillet af landbrugsprodukter, som ikke omfattes
    af traktatens bilag II
  type: main
- language: el
  script: Grek
