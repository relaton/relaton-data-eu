title:
- language: en
  script: Latn
  content: Commission Decision of 21 October 1980 authorizing the French Republic
    to introduce intra- Community surveillance of imports of fresh, chilled and frozen
    sheepmeat and goatmeat originating in New Zealand (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 octobre 1980, autorisant la République
    française à instaurer une surveillance intracommunautaire des importations de
    viandes ovine et caprine, fraîches, réfrigérées et congelées, originaires
    de la Nouvelle-Zélande (Le texte en langue française est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Oktober 1980 zur Ermächtigung der
    Französischen Republik, innergemeinschaftliche Überwachungsmaßnahmen hinsichtlich
    der Einfuhren von Schaf- und Ziegenfleisch, frisch, gekühlt und gefroren, mit
    Ursprug in Neuseeland einzuführen (Nur der französische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 21. oktober 1980 om bemyndigelse af Den franske
    Republik til at indføre tilsyn inden for Fællesskabet over for indførsler af
    fåre- og gedekød, friskt, kølet og frosset, med oprindelse i New Zealand (Kun
    den franske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 ottobre 1980, che autorizza la Repubblica
    francese ad istituire una sorveglianza intracomunitaria sulle importazioni delle
    carni ovine e caprine fresche, refrigerate o congelate originarie della Nuova
    Zelanda (Il testo in lingua francese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 oktober 1980 waarbij de Franse Republiek
    wordt gemachtigd maatregelen inzake toezicht te nemen bij de invoer van vers schape-
    en geitevlees (gekoeld en bevroren) van oorsprong uit Nieuw-Zeeland (Slechts de
    tekst in de Franse taal is authentiek)
  type: main
