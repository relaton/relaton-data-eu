  script: Latn
  content: '1999/783/EC: Council Decision of 22 November 1999 on the conclusion of
    the Agreement in the form of an Exchange of Letters concerning the provisional
    application of the Protocol defining for the period 3 May 1999 to 2 May 2000 the
