title:
- language: en
  script: Latn
  content: Commission Decision of 22 June 1993 terminating the proceeding to review
    anti-dumping measures applicable to certain imports of gas-fuelled, non-refillable
    pocket flint lighters originating in the People's Republic of China
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 22 juin 1993 portant clôture de la procédure
    de réexamen des mesures antidumping applicables à certaines importations de
    briquets de poche avec pierre, à gaz, non rechargeables, originaires de la République
    populaire de Chine
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 22. Juni 1993 über die Einstellung des Verfahrens
    zur Überprüfung der Antidumpingmaßnahmen betreffend bestimmte Einfuhren von
    nichtnachfüllbaren Taschenfeuerzeugen mit Feuerstein für Gas mit Ursprung in
    der Volksrepublik China
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGØRELSE af 22. juni 1993 om afslutning af den fornyede
    undersøgelse af antidumpingforanstaltningerne vedrørende importen af lommetændere
    med fyrsten, med gas som brændstof, ikke til genopfyldning, med oprindelse i
    Den Kinesiske Folkerepublik
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 22ας Ιουνίου 1993
    για την περάτωση της διαδικασίας επανεξέτασης
    των μέτρων αντιντάμπινγκ που εφαρμόζονται
    στις εισαγωγές ορισμένων αναπτήρων τσέπης
    με πυρόλιθο αερίου, που δεν ξαναγεμίζουν, καταγωγής
    Λαϊκής Δημοκρατίας της Κίνας
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 22 giugno 1993 che chiude la procedura
    di riesame delle misure antidumping relative alle importazioni di accendini tascabili
    a pietra focaia e a gas, non ricaricabili, originari della Repubblica popolare
    cinese
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 22 juni 1993 tot beëindiging van het nieuwe
    onderzoek naar de anti-dumpingmaatregelen die van toepassing zijn op de invoer
    van bepaalde niet-navulbare zakgasaanstekers met vuursteentje van oorsprong uit
    de Volksrepubliek China
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 22 de Junho de 1993 que encerra o processo de
    reexame das medidas anti-dumping aplicáveis a certas importações de isqueiros
    de pedra, de bolso, a gás, não recarregáveis, originários da República Popular
    da China
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 22 de junio de 1993 por la que se da por concluido
    el procedimiento de reconsideración de las medidas antidumping aplicables a determinadas
    importaciones de encendedores de bolsillo no recargables, de gas y piedra, originarios
    de la República Popular de China
