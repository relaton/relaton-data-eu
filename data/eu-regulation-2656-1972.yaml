  content: Règlement (CEE) n° 2656/72 du Conseil, du 6 décembre 1972, concernant
    l'application de la décision n° 43/72 du Conseil d'association prévu par la
    convention d'association entre la Communauté européenne et les États africains
    et malgache associés à cette Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2656/72 des Rates vom 6. Dezember 1972 betreffend
    die Durchführung des Beschlusses Nr. 43/72 des Assoziationsrats, der im Assoziierungsabkommen
    zwischen der Europäischen Wirtschaftsgemeinschaft und den assoziierten afrikanischen
    Staaten und Madagaskar vorgesehen ist
  type: main
- language: it
  script: Latn
