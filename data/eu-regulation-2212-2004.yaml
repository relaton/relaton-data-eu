    v prosinci 2004 pro některé produkty z vepřového masa v rámci režimu stanoveného
    dohodami uzavřenými mezi Společenstvím a Bulharskem a Rumunskem
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2212/2004 af 21. december 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i december
    2004 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Bulgarien
    og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2212/2004 της Επιτροπής,
    της 21ης Δεκεμβρίου 2004, για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν το Δεκέμβριο 2004
    για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τις
