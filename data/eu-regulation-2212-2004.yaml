title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2212/2004 of 21 December 2004 determining
    the extent to which applications lodged in December 2004 for import licences for
    certain pigmeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2212/2004 de la Commission du 21 décembre 2004 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en décembre 2004 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par les accords conclus par la Communauté avec la Bulgarie
    et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2212/2004 der Kommission vom 21. Dezember 2004 über
    die Festsetzung des Umfangs, in dem die im Dezember 2004 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung
    der Abkommen zwischen der Gemeinschaft und Bulgarien und Rumänien genehmigt werden
    können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2212/2004 ze dne 21. prosince 2004, kterým
