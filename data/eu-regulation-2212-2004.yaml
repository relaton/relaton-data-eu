    2004, za nekatere proizvode iz prašičjega mesa v skladu z režimom, predvidenim
    v sporazumih, ki so bili sklenjeni med Skupnostjo ter Bolgarijo in Romunijo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2212/2004 de la Comisión, de 21 de diciembre de 2004,
