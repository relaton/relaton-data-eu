    invoercertificaten voor bepaalde producten in de sector varkensvlees, die in december
    2004 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomsten met Bulgarije en Roemenië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2212/2004 z dnia 21 grudnia 2004 r. określające
