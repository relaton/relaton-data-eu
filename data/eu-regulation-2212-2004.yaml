    pozwolenia na przywóz niektórych produktów z wieprzowiny w systemie przewidzianym
    w umowach zawartych przez Wspólnotę z Bułgarią i Rumunią
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2212/2004 da Comissão, de 21 de Dezembro de 2004,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Dezembro
    de 2004 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
    a Bulgária e a Roménia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2212/2004 z 21. decembra 2004, ktorým sa určuje
