- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/417 of 28 November 2024 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the manner in which crypto-asset
    service providers operating a trading platform for crypto-assets are to present
    transparency data
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/417 de la Commission du 28 novembre 2024
    complétant le règlement (UE) 2023/1114 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant la manière dont les prestataires
    de services sur crypto-actifs exploitant une plate-forme de négociation de crypto-actifs
    doivent présenter les données de transparence
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/417 der Kommission vom 28. November 2024
    zur Ergänzung der Verordnung (EU) 2023/1114 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Präzisierung der Art der
    Darstellung von Daten zur Transparenz durch Anbieter von Kryptowerte-Dienstleistungen,
    die eine Handelsplattform für Kryptowerte betreiben
  type: main
