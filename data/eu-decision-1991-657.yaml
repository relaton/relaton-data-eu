id: EUDecision1991657
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision of 19 December 1991 extending the period of application
    of Decision 82/530/EEC authorizing the United Kingdom to permit the Isle of Man
    authorities to apply a system of special import licences to sheepmeat and beef
    and veal
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 19 décembre 1991 prorogeant la décision 82/530/CEE
    autorisant le Royaume- Uni à permettre aux autorités de l'île de Man d'appliquer
    un système de certificats spéciaux d'importation pour la viande ovine et la
    viande bovine
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DES RATES vom 19. Dezember 1991 zur Verlängerung der Geltungsdauer
    der Entscheidung 82/530/EWG zur Ermächtigung des Vereinigten Königreichs, der
    Regierung der Insel Man zu gestatten, bei Schaf- und Rindfleisch eine besondere
    Einfuhrgenehmigung anzuwenden
  type: main
- language: da
  script: Latn
  content: 'RÅDETS BESLUTNING af 19. december 1991 om forlængelse af anvendelsesperioden
    for beslutning 82/530/EØF om bemyndigelse til Det Forenede Kongerige til at tillade
    myndighederne på øen Man at anvende en ordning med særlige importlicenser for
    fårekød, oksekød og kalvekød #'
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 19ης Δεκεμβρίου
    1991 για την παράταση της απόφασης 82/530/ΕΟΚ περί
    εξουσιοδοτήσεως του Ηνωμένου Βασιλείου να
    επιτρέψει στις αρχές της Νήσου Μαν την εφαρμογή
    καθεστώτος ειδικών αδειών εισαγωγής προβείου
    και βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 19 dicembre 1991, recante proroga della decisione
    82/530/CEE che autorizza il Regno Unito a consentire alle autorità dell'isola
    di Man di applicare un regime di titoli d'importazione speciali per le carni ovine
    e bovine
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE RAAD van 19 december 1991 tot verlenging van de geldigheidsduur
    van Beschikking 82/530/EEG waarbij het Verenigd Koninkrijk wordt gemachtigd de
    autoriteiten van het eiland Man toe te staan een stelsel van bijzondere invoervergunningen
    toe te passen voor schapevlees en rundvlees
  type: main
- language: pt
  script: Latn
  content: DECISÃO DO CONSELHO de 19 de Dezembro de 1991 que prolonga o período
    de aplicação da Decisão 82/530/CEE, que autoriza o Reino Unido a permitir às
    autoridades da ilha de Man a aplicação de um sistema de certificados especiais
    de importação para a carne de carneiro, de ovino e de bovino
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DEL CONSEJO de 19 de diciembre de 1991 que prorroga la Decisión
    82/530/CEE por la que se autoriza al Reino Unido a permitir que las autoridades
    de la isla de Man apliquen un sistema de certificados especiales de importación
    para la carne de ovino y la carne de vacuno (91/657/CEE) #'
  type: main
