title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2184/77 of 30 September 1977 re-establishing
    the levying of customs duties on wrought bars, rods, angles, shapes and sections
    of aluminium; aluminium wire, falling within heading No 76.02, originating in
    Yugoslavia to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2184/77 de la Commission, du 30 septembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux barres,
    profilés et fils de section pleine, en aluminium, de la position tarifaire 76.02,
    originaires de la Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2184/77 der Kommission vom 30. September 1977 zur
    Wiedereinführung des Zollsatzes für Stäbe, Profile und Draht, aus Aluminium,
    massiv, der Tarifnummer 76.02, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2184/77 af 30. september 1977 om genindførelse
    af opkrævning af toldafgifter for stænger, profiler og tråd, af aluminium,
    under position 76.02, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2184/77 della Commissione, del 30 settembre 1977,
    che ripristina la riscossione dei dazi doganali applicabili alle barre, profilati
    e fili di sezione piena, di alluminio, della voce doganale 76.02 originari della
    Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2184/77 van de Commissie van 30 september 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op staven,
    profielen en draad, massief, van aluminium, van post 76.02, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
