  content: Règlement n° 1048/67/CEE de la Commission , du 22 décembre 1967, modifiant
    les règlements n° 157/64/CEE et 158/64/CEE afin de tenir compte de l'incidence,
    sur les prix de certains produits laitiers, des changements du régime de taxation
    intervenus en Allemagne, en France et aux Pays-Bas
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 1048/67/EWG der Kommission vom 22. Dezember 1967 zur Änderung
    der Verordnungen Nr. 157/64/EWG und Nr. 158/64/EWG, um der Auswirkung der Änderung
    des Steuersystems in der Bundesrepublik Deutschland, in Frankreich und den Niederlanden
    auf die Preise bestimmter Milcherzeugnisse Rechnung zu tragen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 1048/67/CEE della Commissione, del 22 dicembre 1967, che
    modifica i regolamenti nn. 157/64/CEE e 158/64/CEE per tener conto dell'incidenza,
    sui prezzi di alcuni prodotti lattiero-caseari, dei cambiamenti del regime fiscale
    istituito in Germania, in Francia e nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 1048/67/EEG van de Commissie van 22 december 1967 tot wijziging
    van de Verordeningen Nrs. 157/64/EEG en 158/64/EEG om rekening te houden met de
    invloed, op de prijzen van bepaalde zuivelprodukten, van de wijzigingen van het
    stelsel van belastingen ingevoerd in Duitsland, in Frankrijk en in Nederland
  type: main
