    Ausfuhr von im Besitz der französischen Interventionsstelle befindlichem Brotweichweizen
    auf 4 000 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3018/93 af 29. oktober 1993 om ændring
