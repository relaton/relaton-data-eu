title:
- language: en
  script: Latn
  content: '84/408/EEC: Commission Decision of 16 August 1984 accepting an undertaking
    given in connection with the anti-dumping review proceeding concerning imports
    of copper sulphate originating in Czechoslovakia and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/408/CEE: Décision de la Commission du 16 août 1984 portant acceptation
    d'' un engagement souscrit dans le cadre du réexamen de la procédure antidumping
    concernant les importations de sulfate de cuivre originaire de Tchécoslovaquie
    et portant clôture de la procédure'
  type: main
- language: de
  script: Latn
  content: '84/408/EWG: Beschluß der Kommission vom 16. August 1984 über die Annahme
    von Verpflichtungen im Rahmen des Antidumping-Überprüfungsverfahrens betreffend
    die Einfuhren von Kupfersulfat mit Ursprung in der Tschechoslowakei und über
    die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '84/408/EØF: Kommissionens afgørelse af 16. august 1984 om godtagelse
    af tilsagn i forbindelse med den fornyede antidumpingprocedure vedrørende importen
    af kobbersulfat med oprindelse i Tjekkoslovakiet og om afslutning af denne procedure'
  type: main
- language: el
  script: Grek
  content: '84/408/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
