title:
- language: en
  script: Latn
  content: '2003/610/EC: Commission Decision of 19 August 2003 amending Decision 1999/815/EC
    concerning measures prohibiting the placing on the market of toys and childcare
    articles intended to be placed in the mouth by children under three years of age
    made of soft PVC containing certain phthalates (Text with EEA relevance) (notified
    under document number C(2003) 2944)'
  type: main
- language: fr
  script: Latn
  content: '2003/610/CE: Décision de la Commission du 19 août 2003 modifiant la
    décision 1999/815/CE concernant des mesures qui interdisent la mise sur le marché
    de jouets et articles de puériculture destinés à être mis en bouche par des
    enfants de moins de trois ans, fabriqués en PVC souple contenant certains phtalates
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2003)
    2944]'
  type: main
- language: de
  script: Latn
  content: '2003/610/EG: Entscheidung der Kommission vom 19. August 2003 zur Änderung
    der Entscheidung 1999/815/EG über Maßnahmen zur Untersagung des Inverkehrbringens
    von Spielzeug- und Babyartikeln, die dazu bestimmt sind, von Kindern unter drei
    Jahren in den Mund genommen zu werden, und aus Weich-PVC bestehen, das bestimmte
    Weichmacher enthält (Text von Bedeutung für den EWR) (Bekannt gegeben unter
    Aktenzeichen K(2003) 2944)'
  type: main
- language: da
  script: Latn
  content: '2003/610/EF: Kommissionens beslutning af 19. august 2003 om ændring af
