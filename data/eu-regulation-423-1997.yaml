  content: Council Regulation (EC) No 423/97 of 3 March 1997 amending Regulation (EEC)
    No 3433/91 in respect of imports originating in Thailand and imposing definitive
    anti-dumping duties on imports of gas-fuelled, non- refillable pocket flint lighters
    originating in Thailand, the Philippines and Mexico
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 423/97 du Conseil du 3 mars 1997 modifiant le règlement
