    die Einschleppung des Virus der Afrikanischen Schweinepest aus bestimmten Drittländern
    oder Teilen des Hoheitsgebiets von Drittländern, in denen diese Seuche bestätigt
    ist, in die Europäische Union und zur Aufhebung des Beschlusses 2011/78/EU (Bekanntgegeben
    unter Aktenzeichen C(2014) 715)'
