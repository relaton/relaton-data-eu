title:
- language: en
  script: Latn
  content: '2014/84/EU: Commission Implementing Decision of 12 February 2014 amending
    Implementing Decision 2013/426/EU on measures to prevent the introduction into
    the Union of the African swine fever virus from certain third countries or parts
    of the territory of third countries in which the presence of that disease is confirmed
    and repealing Decision 2011/78/EU (notified under document C(2014) 715)'
  type: main
- language: fr
  script: Latn
  content: '2014/84/UE: Décision d’exécution de la Commission du 12 février 2014
    modifiant la décision d’exécution 2013/426/UE concernant des mesures destinées
    à prévenir l’introduction dans l’Union du virus de la peste porcine africaine
    depuis certains pays tiers ou certaines parties du territoire de pays tiers où
    la présence de cette maladie est confirmée, et abrogeant la décision 2011/78/UE
    [notifiée sous le numéro C(2014) 715]'
  type: main
- language: de
  script: Latn
  content: '2014/84/EU: Durchführungsbeschluss der Kommission vom 12. Februar 2014
