title:
- language: en
  script: Latn
  content: '80/912/EEC: Commission Decision of 13 August 1980 authorizing the French
    Republic not to apply Community treatment to parkas ; anoraks, windcheaters, waisted
    jackets and the like, woven, falling within headings No 61.01 B IV and ex 61.02
    B II of the Common Customs Tariff (category 21), originating in South Korea and
    in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/912/CEE: Décision de la Commission, du 13 août 1980, autorisant la
    République française à exclure du traitement communautaire les "parkas", anoraks,
    blousons et similaires, tissés, des sous-positions 61.01 B IV et ex 61.02 B II
    du tarif douanier commun (catégorie 21), originaires de Corée du Sud et mis
    en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/912/EWG: Entscheidung der Kommission vom 13. August 1980, mit der die
    Französische Republik ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Parkas, Anoraks, Windjacken und
    dergleichen, aus Geweben, der Tarifstellen 61.01 B IV und ex 61.02 B II, Kategorie
    21, des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/912/EØF: Kommissionens beslutning af 13. august 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage parca-coats,
    anorakker, vindjakker, blouson-jakker o. lign., vævede, som henhører under pos.
    61.01 B IV og ex 61.02 B II kategori 21 i den fælles toldtarif, har oprindelse
    i Sydkorea og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/912/CEE: Decisione della Commissione, del 13 agosto 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario eskimo, giacche
    a vento e giubbotti con o senza cappuccio e simili, tessuti, delle sottovoci 61.01
    B IV e ex 61.02 B II della tariffa doganale comune, categoria 21, originari della
    Corea del Sud e messi in libera pratica negli altri Stati membri (Il testo in
    lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/912/EEG: Beschikking van de Commissie van 13 augustus 1980 waarbij
    de Franse Republiek wordt gemachtigd parka''s, anoraks, windjakken en dergelijke,
    geweven, van de posten 61.01 B IV en ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 21), van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
