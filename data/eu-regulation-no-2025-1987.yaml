title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2025/87 of 8 July 1987 re-establishing the
    levying of customs duties on outer garments, products of category 7 (code 40.0070),
    outer garments, products of category 26 (code 40.0260), women' s or girls' suits
    and ensembles, products of category 74 (code 40.0740), originating in Brazil to
    which the preferential tariff arrangements of Council Regulation (EEC) No 3925/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2025/87 de la Commission du 8 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessus de la catégorie 7 (code 40.0070), aux vêtements de dessus de la catégorie
    26 (code 40.0260) et aux costumes tailleurs et ensembles pour femmes de la catégorie
    74 (code 40.0740), originaires du Brésil, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2025/87 der Kommission vom 8. Juli 1987 zur Wiedereinführung
    des Zollsatzes für Oberkleidung der Warenkategorie Nr. 7 (Kennziffer 40.0070),
    Oberkleidung der Warenkategorie Nr. 26 (Kennziffer 40.0260) und Kostüme und Kombinationen
    für Frauen der Warenkategorie Nr. 74 (Kennziffer 40.0740) mit Ursprung in Brasilien,
    dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2025/87 af 8. juli 1987 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande under varekategori
    nr. 7 (kode 40.0070), yderbeklædningsgenstande under varekategori nr. 26 (kode
    40.0260) og dragter og kombinerede sæt under varekategori nr. 74 (kode 40.0740),
    som har oprindelse i Brasilien, og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2025/87 της Επιτροπής
