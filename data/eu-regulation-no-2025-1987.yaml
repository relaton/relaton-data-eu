    exteriores de la categoría de productos n° 7 (código 40.0070), prendas exteriores
    de la categoría de productos n° 26 (código 40.0260), trajes sastre y conjuntos
    para mujeres de la categoría de productos n° 74 (código 40.0740), originarios
    de Brasil, beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) n° 3925/86 del Consejo
