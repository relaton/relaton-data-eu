    de produtos n.° 7 (código 40.0070), a vestuário exterior da categoria de produtos
    n.° 26 (código 40.0260), aos saias-casacos, em malha, para senhoras da categoria
    de produtos n.° 74 (código 40.0740), originários do Brasil, beneficiário das
    preferências pautais previstas no Regulamento (CEE) n.° 3925/86 do Conselho
  type: main
