  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2025/87 della Commissione dell' 8 luglio 1987 che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti esterni
    della categoria di prodotti n. 7 (codice 40.0070), agli indumenti esterni della
    categoria di prodotti n. 26 (codice 40.0260), agli abiti a giacca e completi per
    donna della categoria di prodotti n. 74 (codice 40.0740), originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3925/86
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2025/87 van de Commissie van 8 juli 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bovenkleding
    van de categorie van produkten nr. 7 (codenummer 40.0070), bovenkleding van de
    categorie van produkten nr. 26 (codenummer 40.0260) en mantelpakken en broekpakken
    voor dames van de categorie van produkten nr. 74 (codenummer 40.0740), van oorsprong
    uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2025/87 da Comissão de 8 de Julho de 1987 que restabelece
