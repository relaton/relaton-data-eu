    modalités d'application du règlement (CE) nº 1706/98 du Conseil en ce qui concerne
    le régime d'importation de certains produits de substitution de céréales et
    produits transformés à base de céréales et de riz originaires des États d'Afrique,
    des Caraïbes et du Pacifique (ACP) ou des pays et territoires d'outre-mer (PTOM)
