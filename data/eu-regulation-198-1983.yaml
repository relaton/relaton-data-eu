  content: Council Regulation (EEC) No 198/83 of 25 January 1983 on fishing activities
    in waters under the sovereignty or jurisdiction of the Member States, adopted
    provisionally pending the fixing of TACs and quotas for 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 198/83 du Conseil du 25 janvier 1983 relatif aux activités
    de pêche exercées dans les eaux relevant de la souveraineté ou de la juridiction
    des États membres et pris à titre provisoire dans l' attente de la fixation
    des totaux admissibles des captures (TAC) et quotas pour l' année 1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 198/83 des Rates vom 25. Januar 1983 über die Fischerei
    in den der Hoheitsgewalt oder Gerichtsbarkeit der Mitgliedstaaten unterstehenden
    Gewässern mit vorläufiger Geltungsdauer bis zur Festlegung der zulässigen Gesamtfangmengen
    und der Quoten für 1983
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 198/83 af 25. januar 1983 om fiskeri i de
    farvande, der hører under medlemsstaternes højhedsområde eller jurisdiktion,
    truffet som midlertidig ordning, indtil TAC og kvoterne for 1983 er fastsat
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 198/83 του Συμβουλίου
