title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 679/83 of 24 March 1983 re-establishing
    the levying of customs duties applicable to methanol, falling within subheading
    29.04 A I and originating in Libya, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 679/83 de la Commission du 24 mars 1983 portant rétablissement
    de la perception des droits de douane applicables au méthanol, de la sous-position
    29.04 A I du tarif douanier commun, originaire de Libye, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 679/83 der Kommission vom 24. März 1983 zur Wiedereinführung
    der Erhebung der Zölle für Methanol der Tarifstelle 29.04 A I, mit Ursprung
    in Libyen, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 679/83 af 24. marts 1983 om genindførelse
    af opkrævning af told for methanol henhørende under pos. 29.04 A I og med oprindelse
    i Libyen som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3377/82
  type: main
