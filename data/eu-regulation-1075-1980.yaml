  content: Commission Regulation (EEC) No 1075/80 of 30 April 1980 derogating from
    Regulation (EEC) No 1726/70 on the procedure for granting the premium for leaf
    tobacco as regards the dates for the conclusion and registration of cultivation
    contracts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1075/80 de la Commission, du 30 avril 1980, dérogeant
    au règlement (CEE) n° 1726/70 relatif aux modalités d' octroi de la prime pour
    le tabac en feuilles en ce qui concerne les dates de conclusion et d' enregistrement
    des contrats de culture
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1075/80 der Kommission vom 30. April 1980 zur Abweichung
    von der Verordnung (EWG) Nr. 1726/70 über Durchführungsbestimmungen für die
    Gewährung der Prämie für Tabakblätter hinsichtlich der Termine für den Abschluß
    und die Registrierung der Anbauverträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1075/80 af 30. april 1980 om undtagelse
    fra forordning (EØF) nr. 1726/70 om gennemførelsesbestemmelser for ydelse af
    præmier for tobak i blade, for så vidt angår datoerne for indgåelse og registrering
    af dyrkningskontrakter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1075/80 della Commissione, del 30 aprile 1980, che
    deroga al regolamento (CEE) n. 1726/70 che fissa le modalità relative alle concessione
    del premio per il tabacco in foglia per quanto riguarda le date di conclusione
    e registrazione dei contratti di coltivazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1075/80 van de Commissie van 30 april 1980 houdende
    afwijking van Verordening (EEG) nr. 1726/70 betreffende de wijze van toekenning
    van de premie voor tabaksbladeren, ten aanzien van de termijnen voor de sluiting
    en de registrering van de teeltcontracten
