  script: Latn
  content: Council Regulation (EC) No 492/2004 of 8 March 2004 amending Regulation
    (EC) No 1338/2002 imposing a definitive countervailing duty on imports of sulphanilic
    acid originating in India and amending Regulation (EC) No 1339/2002 imposing a
    definitive anti-dumping duty on imports of sulphanilic acid originating, inter
    alia, in India
  type: main
- language: fr
  script: Latn
