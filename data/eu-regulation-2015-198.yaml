    koskevan kohdan osalta niiden kolmansien maiden, alueiden, vyöhykkeiden tai erillisalueiden
    luettelossa, joista tiettyjen siipikarjasta saatujen hyödykkeiden tuonti unioniin
    tai kuljettaminen sen kautta on sallittua korkeapatogeenisen lintuinfluenssan
    yhteydessä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/198 оd 6. veljače 2015. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Kanadu na popisu trećih
    zemalja, državnih područja, zona ili kompartmenta iz kojih je dozvoljen uvoz
    i provoz određenih proizvoda od peradi kroz Uniju u vezi s visokopatogenom influencom
    ptica
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/198 végrehajtási rendelete ( 2015. február 6.
    ) a 798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    a Kanadára vonatkozó bejegyzésnek a magas patogenitású madárinfluenzával
    kapcsolatban történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/198 della Commissione, del 6 febbraio
    2015 , che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa al Canada nell'elenco di paesi terzi, loro territori, zone o
    compartimenti da cui determinati prodotti ottenuti dal pollame possono essere
    importati e transitare nell'Unione in relazione all'influenza aviaria ad alta
    patogenicità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/198 ( 2015. gada 6. februāris
    ), ar ko groza Regulas (EK) Nr. 798/2008 I pielikumu attiecībā uz ierakstu par
    Kanādu to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā, no kurām
    atsevišķas mājputnu izcelsmes preces drīkst importēt Savienībā vai pārvadāt
    tranzītā caur to saistībā ar augsti patogēno putnu gripu
  type: main
- language: lt
  script: Latn
  content: '2015 m. vasario 6 d. Komisijos įgyvendinimo reglamentas (ES) 2015/198,
    kuriuo dėl labai patogeniško paukščių gripo iš dalies keičiamas Reglamento
    (EB) Nr. 798/2008 I priedas: Kanados įrašas trečiųjų šalių, teritorijų,
    zonų ar skyrių, iš kurių galima importuoti į Sąjungą ir vežti tranzitu
    per Sąjungą tam tikras naminių paukščių prekes, sąraše'
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/198 tas- 6 ta'
