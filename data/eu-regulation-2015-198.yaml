  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/198 van de Commissie van 6 februari 2015
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de vermelding
