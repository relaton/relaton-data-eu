    παθογονικότητας γρίπη των πτηνών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2015/198, 6. veebruar 2015 , millega muudetakse
    kõrge patogeensusega linnugripiga seonduvalt määruse (EÜ) nr 798/2008 I lisas
    esitatud kannet Kanada kohta loetelus, milles on esitatud need kolmandad riigid,
    territooriumid, tsoonid ja piirkonnad, millest võib importida liitu või vedada
    läbi liidu teatavaid linnukasvatussaadusi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/198, annettu 6 päivänä
