    i produktów drobiowych w odniesieniu do wysoce zjadliwej grypy ptaków
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2015/198 da Comissão, de 6 de fevereiro
    de 2015 , que altera o anexo I do Regulamento (CE) n. ° 798/2008 no que se refere
