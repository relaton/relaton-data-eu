    de invoer in of de doorvoer door de Unie van bepaalde pluimveeproducten in verband
    met hoogpathogene aviaire influenza, is toegestaan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/198 z dnia 6 lutego 2015 r.
