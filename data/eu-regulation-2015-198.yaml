    sa Kanady na zozname tretích krajín, území, oblastí alebo jednotiek, z ktorých
    možno do Únie dovážať alebo cez jej územie prevážať určité komodity
    z hydiny v súvislosti s vysokopatogénnou vtáčou chrípkou
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/198 z dne 6. februarja 2015 o spremembi
