title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/198 of 6 February 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Canada in the
    list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into or transit through the Union in relation
    to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/198 de la Commission du 6 février 2015
    modifiant l'annexe I du règlement (CE) n ° 798/2008 en ce qui concerne les mentions
    relatives au Canada sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l'Union ou transiter par celle-ci, quant à l'influenza aviaire hautement
    pathogène
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/198 der Kommission vom 6. Februar 2015
    zur Änderung von Anhang I der Verordnung (EG) Nr. 798/2008 hinsichtlich der Eintragung
    Kanadas in die Liste von Drittländern, Gebieten, Zonen und Kompartimenten, aus
    denen mit Blick auf die hochpathogene aviäre Influenza die Einfuhr von Geflügel
    und Geflügelerzeugnissen in die Union und ihre Durchfuhr durch die Union zugelassen
    ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/198 на Комисията
    от 6 февруари 2015 година за изменение във връзка
    с високопатогенна инфлуенца по птиците на
    приложение I към Регламент (ЕО) № 798/2008 по отношение
    на вписването за Канада в списъка на трети
    държави, територии, зони или компартменти,
    от които могат да бъдат внасяни и да преминават
    транзитно през територията на Съюза определени
    стоки, получени от домашни птици
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/198 ze dne 6. února 2015 , kterým
    se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku týkající
    se Kanady na seznamu třetích zemí, území, oblastí nebo jednotek, z nichž
    lze do Unie dovážet nebo přes její území přepravovat určité drůbeží
    komodity v souvislosti s vysoce patogenní influenzou ptáků
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/198 af 6. februar 2015
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om Canada i listen over tredjelande, områder, zoner og segmenter, hvorfra visse
    fjerkræprodukter kan importeres til og sendes i transit gennem Unionen i forbindelse
    med højpatogen aviær influenza
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2015/198 της Επιτροπής,
    της 6ης Φεβρουαρίου 2015 , για την τροποποίηση
    του παραρτήματος I του κανονισμού (ΕΚ) αριθ.
    798/2008 όσον αφορά την καταχώριση του Καναδά στον
    κατάλογο τρίτων χωρών, εδαφών, ζωνών ή διαμερισμάτων
    από τα οποία επιτρέπεται να εισαχθούν και να
