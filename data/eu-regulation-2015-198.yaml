    držav, ozemelj, območij ali kompartmentov, iz katerih je dovoljen uvoz nekaterega
    perutninskega blaga v Unijo ter njegov tranzit skozi Unijo v zvezi z visokopatogeno
    aviarno influenco
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/198 de la Comisión, de 6 de febrero
