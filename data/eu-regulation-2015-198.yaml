    ou compartimentos a partir dos quais são autorizados a importação e o trânsito
    na União de determinados produtos à base de aves de capoeira, relativamente
    à gripe aviária de alta patogenicidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/198 al Comisiei din 6 februarie
    2015 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Canada din lista cu țări terțe, teritorii, zone sau
    compartimente din care anumite produse obținute de la păsări de curte pot fi
    importate în Uniune sau pot tranzita Uniunea în contextul riscului de gripă
    aviară înalt patogenă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/198 zo 6. februára 2015 , ktorým
