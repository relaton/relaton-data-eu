  content: Commission Regulation (EEC) No 3114/85 of 7 November 1985 altering, from
    1 November 1985, the rate of refunds applicable for certain products of the cereals
    and rice sectors, exported in the form of goods not covered by Annex II to the
    Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3114/85 de la Commission, du 7 novembre 1985, modifiant,
