title:
- language: en
  script: Latn
  content: Regulation (EEC) No 362/73 of the Commission of 31 January 1973 extending
    the period of validity of the provisions of Regulation (EEC) No 2816/72 as regards
    the amount of security to be given upon importation of young bovine animals and
    calves for fattening
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 362/73 de la Commission, du 31 janvier 1973, prorogeant
    les dispositions du règlement (CEE) n° 2816/72 en ce qui concerne le montant
    de la caution constituée lors de l'importation des jeunes bovins ou des veaux
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 362/73 der Kommission vom 31. Januar 1973 zur Verlängerung
    der Bestimmungen der Verordnung (EWG) Nr. 2816/72 betreffend den Kautionsbetrag
    bei der Einfuhr von zur Mast bestimmten jungen Rindern und Kälbern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) Nr. 362/73 af 31. januar 1973 om forlængelse
    af gyldigheden af forordning (EØF) nr. 2816/72 for så vidt angår den sikkerhed,
    der skal stilles ved indførsel af ungkvæg og kalve bestemt til opfedning
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 362/73 della Commissione, del 31 gennaio 1973, che
    proroga le disposizioni del regolamento (CEE) n. 2816/72 per quanto riguarda l'importo
    della cauzione costituita all'atto dell'importazione dei giovani bovini e dei
    vitelli destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 362/73 van de Commissie van 31 januari 1973 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 2816/72 met betrekking tot de
    waarborg die wordt gesteld bij de invoer van voor de mesterij bestemde jonge runderen
    en kalveren
