title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1970, portant dérogation à
    la recommandation n° 1-64 de la Haute Autorité relative à un relèvement de
    la protection frappant les produits sidérurgiques à la périphérie de la Communauté
    (quarante-quatrième dérogation)
  type: main
- language: de
  script: Latn
  content: '70/557/EGKS: Entscheidung der Kommission vom 23. Dezember 1970 betreffend
    Ausnahmen von der Empfehlung Nr. 1/64 der Hohen Behörde über eine Erhöhung
    des Außenschutzes gegenüber Einfuhren von Stahlerzeugnissen in die Gemeinschaft
    (Vierundvierzigste Ausnahmeentscheidung)'
  type: main
- language: it
  script: Latn
  content: '70/557/CECA: Decisione della Commissione, del 23 dicembre 1970, che autorizza
    deroghe alla raccomandazione n. 1-64 dell''Alta Autorità relativa al rafforzamento
    della protezione che colpisce i prodotti siderurgici all''entrata nella Comunità
    (quarantaquattresima deroga)'
  type: main
- language: nl
  script: Latn
  content: '70/557/EGKS: Beschikking van de Commissie van 23 december 1970 houdende
    afwijking van Aanbeveling nr. 1- 64 van de Hoge Autoriteit betreffende een verhoging
    van de bescherming van ijzer- en staalprodukten aan de buitengrenzen van de Gemeenschap
    (vierenveertigste uitzonderingsbeschikking)'
