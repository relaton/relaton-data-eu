title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 345/2008 of 17 April 2008 laying down detailed
    rules for implementing the arrangements for imports from third countries provided
    for in Council Regulation (EEC) No 2092/91 on organic production of agricultural
    products and indications referring thereto on agricultural products and foodstuffs
    (Recast)
  type: main
- language: fr
  script: Latn
