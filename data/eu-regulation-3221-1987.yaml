title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3221/87 of 28 October 1987 authorizing the
    Federal Republic of Germany, the United Kingdom and Luxembourg to permit under
    certain conditions an additional increase in the alcoholic strength of certain
    wines and certain products intended for wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3221/87 de la Commission du 28 octobre 1987 autorisant
    la République fédérale d'Allemagne, le Royaume-Uni et le Grand-Duché de Luxembourg
    à permettre, sous certaines conditions, une augmentation supplémentaire du titre
    alcoométrique de certains vins et de certains produits destinés à l'élaboration
    des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3221/87 der Kommission vom 28. Oktober 1987 zur Ermächtigung
    der Bundesrepublik Deutschland, des Vereinigten Königreichs und Luxemburgs, unter
    bestimmten Voraussetzungen eine zusätzliche Erhöhung des Alkoholgehalts bestimmter
    Weine und bestimmter zur Weinherstellung vorgesehener Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3221/87 af 28. oktober 1987 om bemyndigelse
    til Forbundsrepublikken Tyskland, Det Forenede Kongerige og Luxembourg til under
    visse omstændigheder at tillade en yderligere forhøjelse af alkoholindholdet
    i visse vine og visse produkter, der er bestemt til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3221/87 της Επιτροπής
    της 28ης Οκτωβρίου 1987 που εξουσιοδοτεί την Ομοσπονδιακή
    Δημοκρατία της Γερμανίας, το Ηνωμένο Βασίλειο
    και το Λουξεμβούργο να επιτρέπουν, υπό ορισμένους
    όρους, συμπληρωματική αύξηση του αλκοολικού
    τίτλου ορισμένων οίνων και ορισμένων προϊόντων
    που προορίζονται για την παραγωγή οίνων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3221/87 della Commissione del 28 ottobre 1987 che
    autorizza la Repubblica federale di Germania, il Regno Unito e il Lussembugo a
    permettere in determinate condizioni un aumento supplementare della gradazione
    alcolometrica di alcuni vini e di taluni prodotti destinati all' elaborazione
    dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3221/87 van de Commissie van 28 oktober 1987 waarbij
    de Bondsrepubliek Duitsland, het Verenigd Koninkrijk en Luxemburg worden gemachtigd
    om op bepaalde voorwaarden een extra verhoging van het alcoholgehalte van bepaalde
    wijnen en van bepaalde voor de bereiding van wijn bestemde produkten toe te staan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3221/87 da Comissão de 28 de Outubro de 1987 que
    autoriza a República Federal da Alemanha, o Reino Unido e o Luxemburgo a permitir,
    em determinadas condições, um aumento suplementar do título alcoométrico de
    determinados vinhos e de determinados produtos destinados à elaboração dos
    vinhos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3221/87 de la Comisión de 28 de octubre de 1987 por
    el que se autoriza a la República Federal de Alemania, al Reino Unido y a Luxemburgo
    a que permitan, bajo determinadas condiciones, un aumento suplementario del grado
    alcohólico de determinados vinos y de determinados productos destinados a la
    elaboración de vinos
  type: main
