    την Τσεχική και Σλοβακική Ομοσπονδιακή Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1818/93 della Commissione, del 7 luglio 1993, che
    rettifica il regolamento (CEE) n. 951/93 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli di importazione presentate nel mese di aprile
    1993 per taluni prodotti del settore delle carni suine nel quadro del regime previsto
    dagli accordi interinali conclusi tra la Comunità e la Repubblica di Polonia,
    la Repubblica d'Ungheria e la Repubblica federativa ceca e slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1818/93 van de Commissie van 7 juli 1993 tot wijziging
    van Verordening (EEG) nr. 951/93 tot vaststelling van de mate waarin gevolg kan
    worden gegeven aan de aanvragen om invoercertificaten voor bepaalde produkten
    in de sector varkensvlees, die in april 1993 worden ingediend op grond van de
