title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1818/93 of 7 July 1993 amending Regulation
    (EEC) No 951/93 determining the extent to which applications lodged in April 1993
    for import licences for certain pigmeat products under the arrangements provided
    for by the Interim Agreements concluded by the Community with the Republic of
    Poland, the Republic of Hungary, the Czech Republic and Slovakia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1818/93 de la Commission, du 7 juillet 1993, rectifiant
    le règlement (CEE) n 951/93 déterminant la mesure dans laquelle les demandes
    de licences d'importation introduites en avril 1993 pour certains produits à
    base de viande de porc dans le cadre du régime prévu par les accords intérimaires
    conclus par la Communauté avec la république de Pologne, la republique de Hongrie
    et la République fédérative tchèque et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1818/93 der Kommission vom 7. Juli 1993 zur Berichtigung
    der Verordnung (EWG) Nr. 951/93 über die Festsetzung des Umfangs, in dem die
    im April 1993 gestellten Anträge auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse
    entsprechend der Regelung der Interimsabkommen zwischen der Gemeinschaft und Polen,
    Ungarn und der Tschechischen und Slowakischen Föderativen Republik genehmigt
    werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1818/93 af 7. juli 1993 om berigtigelse
    af forordning (EØF) nr. 951/93 om fastsættelse af, i hvilket omfang der kan
    accepteres ansøgninger, der blev indgivet i april 1993 om importlicenser for
    visse svinekødsprodukter i forbindelse med den ordning, der er fastsat i de interimsaftaler,
    som Fællesskabet har indgået med Republikken Polen, Republikken Ungarn og Den
    Tjekkiske og Slovakiske Føderative Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1818/93 της Επιτροπής
    της 7ης Ιουλίου 1993 για διόρθωση του κανονισμού
    (ΕΟΚ) αριθ. 951/93 περί καθορισμού ορίων εντός
    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε τον Απρίλιο του 1993 για άδειες
    εισαγωγής χοιρείου κρέατος βάσει του καθεστώτος
    που προβλέπεται από τις ενδιάμεσες συμφωνίες,
