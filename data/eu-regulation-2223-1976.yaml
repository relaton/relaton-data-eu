  content: Council Regulation (EEC) No 2223/76 of 9 September 1976 amending Regulation
    (EEC) No 2101/76 temporarily and totally suspending the autonomous Common Customs
    Tariff duties on a number of fresh or chilled vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2223/76 du Conseil, du 9 septembre 1976, modifiant
