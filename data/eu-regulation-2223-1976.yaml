    autonomes du tarif douanier commun pour un certain nombre de légumes à l'État
    frais ou réfrigéré
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2223/76 des Rates vom 9. September 1976 zur Änderung
