    von autonomen Zollsätzen des Gemeinsamen Zolltarifs für bestimmte Gemüse, frisch
    oder gekühlt
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2223/76 af 9. september 1976 om ændring
