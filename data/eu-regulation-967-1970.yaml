  content: Règlement (Euratom) n° 967/70 du Conseil, du 25 mai 1970, modifiant les
    conditions applicables en matière de rémunération et de sécurité sociale
    aux agents d'établissement du centre commun de recherches nucléaires affectés
    en Italie
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom) Nr. 967/70 des Rates vom 25. Mai 1970 zur Änderung
    der Regelung der Bezüge und der sozialen Sicherheit der Atomanlagenbediensteten
    der Gemeinsamen Kernforschungsstelle, die in Italien dienstlich verwendet werden
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom) n. 967/70 del Consiglio, del 25 maggio 1970, che
    modifica le condizioni applicabili in materia di retribuzione e di sicurezza sociale
    agli agenti degli stabilimenti del Centro comune di ricerche nucleari che prestano
    servizio in Italia
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom) nr. 967/70 van de Raad van 25 mei 1970 tot wijziging
