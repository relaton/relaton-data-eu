  script: Latn
  content: Commission Implementing Regulation (EU) 2022/528 of 1 April 2022 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for the United Kingdom and the United States in the lists of third countries authorised
    for the entry into the Union of consignments of poultry, germinal products of
    poultry and fresh meat of poultry and game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/528 de la Commission du 1er avril 2022
    modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404 en ce
    qui concerne les mentions relatives au Royaume-Uni et aux États-Unis dans les
    listes des pays tiers en provenance desquels l’entrée dans l’Union d’envois
    de volailles et de produits germinaux de volailles ainsi que de viandes fraîches
    de volailles et de gibier à plumes est autorisée
  type: main
- language: de
  script: Latn
