title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 décembre 1968, portant octroi du concours
    du FSE au bénéfice de la République italienne pour des dépenses relatives
    à des opérations de réinstallation effectuées par le "Ministero del lavoro
    e della previdenza sociale" et l'"Opera nazionale per gli invalidi di guerra (ONIG)"
  type: main
- language: de
  script: Latn
  content: '69/29/EWG: Entscheidung der Kommission vom 19. Dezember 1968 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Italien zu Aufwendungen
    für vom "Ministero dell''Interno", "Ministero del Lavoro e della Previdenza Sociale"
    und "Opera nazionale per gli invalidi di guerra (ONIG)" durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '69/29/CEE: Decisione della Commissione, del 19 dicembre 1968, relativa
    alla concessione di un contributo del FSE a favore della Repubblica italiana per
    spese concernenti operazioni di nuova sistemazione effettuate dal «Ministero
    dell''interno», dal «Ministero del lavoro e della previdenza sociale» e dall''«Opera
    nazionale per gli invalidi di guerra (ONIG)»'
  type: main
- language: nl
  script: Latn
  content: '69/29/EEG: Beschikking van de Commissie van 19 december 1968 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door het "Ministero dell''Interno", het "Ministero del Lavoro e della Previdenza
    Sociale" en het "Opera nazionale per gli invalidi di guerra (O.N.I.G.)" gemaakte
    verplaatsingskosten'
