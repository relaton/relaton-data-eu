    Mengen getrockneter Weintrauben und getrockneter Feigen aus Beständen der griechischen
    Einlagerungsstelle über das Ende des Wirtschaftsjahres 1981/82 hinaus
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 947/83 af 21. april 1983 om ændring
