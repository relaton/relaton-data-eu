- language: en
  script: Latn
  content: Commission Regulation (EEC) No 947/83 of 21 April 1983 amending Regulation
    (EEC) No 3434/82 extending the period of storage of certain quantities of dried
    figs and dried grapes held by the Greek storage agencies beyond the end of the
    1981/82 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 947/83 de la Commission du 21 avril 1983 modifiant
    le règlement (CEE) no 3434/82 relatif à la prolongation du stockage, au-delà
    de la fin de la campagne 1981/1982, de certaines quantités de raisins secs et
    de figues sèches détenues par les organismes stockeurs grecs
  type: main
- language: de
  script: Latn
