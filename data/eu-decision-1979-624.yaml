title:
- language: en
  script: Latn
  content: '79/624/EEC: Commission Decision of 6 June 1979 authorizing the United
    Kingdom not to apply Community treatment to women'' s, girls'' and infants'' woven
    overcoats, raincoats and other coats, cloaks and capes, jackets and blazers, other
    than garments of category 15 A, of wool, of cotton or of man-made textile fibres,
    falling within subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    61.02-31, 32, 33, 35, 36, 37, 39, 40) (category 15 B), originating in Romania
    and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/624/CEE: Décision de la Commission, du 6 juin 1979, autorisant le
    Royaume-Uni à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes) et vestes tissés, pour femmes, fillettes et jeunes enfants,
    autres que les vêtements de la catégorie 15 A, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles, de la sous-position ex 61.02 B du tarif
    douanier commun (codes Nimexe: 61.02-31, 32, 33, 35, 36, 37, 39, 40) (catégorie
    15 B), originaires de la Roumanie et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: '79/624/EWG: Entscheidung der Kommission vom 6. Juni 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus Rumänien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Mäntel, Umhänge und Jacken aus
    Geweben, für Frauen, Mädchen und Kleinkinder, andere als Kleidung der Kategorie
    15 A, der Tarifstelle ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.02-31; 32; 33; 35; 36; 37; 39; 40) (Kategorie 15 B) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/624/EØF: Kommissionens beslutning af 6. juni 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, jakker og blazere, vævede, til kvinder, piger og småbørn, andre end
    de under kategori 15 A hørende varer af uld, bomuld eller kemofibre, som henhører
    under pos. ex 61.02 B i den fælles toldtarif (NIMEXE-kode 61.02-31, 32, 33, 35,
    36, 37, 39, 40), kategori 15 B, har oprindelse i Rumænien og frit kan omsættes
    i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/624/CEE: Decisione della Commissione, del 6 giugno 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli
    e simili, e giacche, tessuti, per donna, per ragazza e per bambini, diversi dagli
    indumenti della categoria 15 A, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della sottovoce ex 61.02 B della tariffa doganale comune (codici
    Nimexe: 61.02-31, 32, 33, 35, 36, 37, 39, 40) categoria 15 B, originari della
    Romania e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/624/EEG: Beschikking van de Commissie van 6 juni 1979 waarbij het Verenigd
    Koninkrijk wordt gemachtigd mantels, regenjassen en andere jassen, capes, blazers
    en jasjes, geweven, andere dan de kledingstukken van categorie 15 A, van wol,
    van katoen of van synthetische of van kunstmatige textielvezels, van post ex 61.02
    B van het gemeenschappelijk douanetarief (NIMEXE-code 61.02-31, 32, 33, 35, 36,
    37, 39, 40) (categorie 15 B), van oorsprong uit Roemenië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
