    originaires du Mexique, de Chine, de Lituanie, du Brésil, du Pakistan, d'Inde
    et d'Indonésie, bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3831/90 du Conseil
  type: main
