title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/54 of 21 October 2021 amending
    Delegated Regulation (EU) 2020/692 as regards additional requirements for the
    entry into the Union of certain ungulates which originate in the Union, are moved
    to a third country or territory to participate in events, exhibitions, displays
    and shows and are then moved back to the Union
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/54 de la Commission du 21 octobre 2021
    modifiant le règlement délégué (UE) 2020/692 en ce qui concerne les exigences
    complémentaires applicables à l’entrée dans l’Union de certains ongulés
    originaires de l’Union qui sont déplacés vers un pays tiers ou territoire
    afin qu’ils y participent à des manifestations, des expositions, des présentations
    ou des spectacles, et qui reviennent ensuite dans l’Union
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/54 der Kommission vom 21. Oktober 2021
    zur Änderung der Delegierten Verordnung (EU) 2020/692 hinsichtlich zusätzlicher
    Anforderungen an den Eingang in die Union von bestimmten Huftieren, die aus der
    Union stammen, zur Teilnahme an Veranstaltungen, Ausstellungen, Vorführungen
    oder Shows in ein Drittland oder Gebiet und anschließend wieder zurück in die
    Union verbracht werden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/54 на Комисията
    от 21 октомври 2021 година за изменение на Делегиран
    регламент (ЕС) 2020/692 по отношение на допълнителни
    изисквания във връзка с въвеждането в Съюза
    на някои копитни животни с произход от Съюза,
    придвижвани в трета държава или територия
    за участие в мероприятия, изложби, изложения
    и представления и след това придвижвани обратно
    в Съюза
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/54 ze dne 21. října
    2021, kterým se mění nařízení v přenesené pravomoci (EU) 2020/692, pokud
    jde o další požadavky na vstup do Unie v případě některých kopytníků,
    kteří pocházejí z Unie, jsou přemístěni do třetí země nebo území za
    účelem účasti na akcích, výstavách a přehlídkách a poté jsou přemístěni
    nazpět do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/54 af 21. oktober 2021 om
    ændring af delegeret forordning (EU) 2020/692 for så vidt angår supplerende
    krav vedrørende indførsel til Unionen af visse hovdyr med oprindelse i Unionen,
    som flyttes til et tredjeland eller territorium med henblik på deltagelse i arrangementer,
    udstillinger, fremvisninger og dyrskuer og derefter flyttes tilbage til Unionen
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/54
    της Επιτροπής της 21ης Οκτωβρίου 2021 για την
    τροποποίηση του κατ’ εξουσιοδότηση κανονισμού
    (ΕΕ) 2020/692 όσον αφορά τις πρόσθετες απαιτήσεις
    για την είσοδο στην Ένωση ορισμένων οπληφόρων
    που κατάγονται από την Ένωση, μετακινούνται
    σε τρίτη χώρα ή έδαφος για να συμμετάσχουν
    σε εκδηλώσεις, εκθέσεις, επιδείξεις και θεάματα
    και στη συνέχεια επιστρέφουν στην Ένωση
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/54, 21. oktoober 2021, millega
    muudetakse delegeeritud määrust (EL) 2020/692 seoses täiendavate nõuetega
    teatavate liidust pärit kabiloomade liitu sissetoomiseks, kes viiakse üritustel,
    näitustel, väljapanekutel ja esitlustel osalemiseks kolmandasse riiki või kolmandale
    territooriumile ning tuuakse seejärel liitu tagasi
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/54, annettu 21 päivänä lokakuuta
    2021, delegoidun asetuksen (EU) 2020/692 muuttamisesta siltä osin kuin on kyse
    lisävaatimuksista, jotka koskevat sellaisten tiettyjen sorkka- ja kavioeläinten
    unioniin saapumista, jotka ovat peräisin unionista ja jotka siirretään kolmanteen
    maahan tai alueelle tapahtumiin, näyttelyihin, näytöksiin tai esityksiin osallistumista
    varten ja siirretään sen jälkeen takaisin unioniin
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/54 ón gCoimisiún an 21 Deireadh Fómhair
    2021 lena leasaítear Rialachán Tarmligthe (AE) 2020/692 a mhéid a bhaineann
    le crúbaigh áirithe ar de bhunadh an Aontais iad a thabhairt isteach san Aontas,
    crúbaigh a aistrítear go tríú tír nó críoch chun bheith rannpháirteach
    in imeachtaí, taispeántais agus seónna, agus a aistrítear ar ais go dtí an
    tAontas ina dhiaidh sin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/54 оd 21. listopada 2021. o izmjeni
    Delegirane uredbe (EU) 2020/692 u pogledu dodatnih zahtjeva za ulazak u Uniju
    određenih kopitara i papkara koji potječu iz Unije, premještaju se u treću
    zemlju ili područje radi sudjelovanja u događanjima, izložbama, prikazivanjima
    i priredbama te se zatim premještaju natrag u Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/54 felhatalmazáson alapuló rendelete (2021. október
    21.) az (EU) 2020/692 felhatalmazáson alapuló rendeletnek az Unióból származó,
    rendezvényeken, kiállításokon, bemutatókon és showműsorokban való részvétel
    céljából valamely harmadik országba vagy területre szállított, majd az
    Unióba visszaszállított egyes patás állatok Unióba történő beléptetésére
    vonatkozó kiegészítő követelmények tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/54 della Commissione del 21 ottobre 2021
    che modifica il regolamento delegato (UE) 2020/692 per quanto riguarda le prescrizioni
    supplementari per l’ingresso nell’Unione di determinati ungulati originari
    dell’Unione che sono spostati in un paese terzo o territorio per partecipare
    a eventi, esposizioni, mostre e spettacoli, per poi essere spostati nuovamente
    nell’Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/54 (2021. gada 21. oktobris), ar
    ko Deleģēto regulu (ES) 2020/692 groza attiecībā uz papildprasībām par tādu
    konkrētu nagaiņu ievešanu Savienībā, kuru izcelsme ir Savienībā, kuri ir
    pārvietoti uz trešo valsti vai teritoriju, lai tur piedalītos pasākumos, izstādēs,
    skatēs un izrādēs, un pēc tam tiek vesti atpakaļ uz Savienību
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/54 2021 m. spalio 21 d. kuriuo
    dėl papildomų reikalavimų, taikomų į Sąjungą įvežamiems tam tikriems
    Sąjungos kilmės kanopiniams, kurie gabenami į trečiąją šalį ar teritoriją
    dalyvauti renginiuose, parodose, ekspozicijose ir pasirodymuose, o vėliau grąžinami
    į Sąjungą, iš dalies keičiamas Deleguotasis reglamentas (ES) 2020/692
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/54 tal-21 ta’ Ottubru 2021
    li jemenda r-Regolament Delegat (UE) 2020/692 fir-rigward ta’ rekwiżiti addizzjonali
    għad-dħul fl-Unjoni ta’ ċerti ungulati li joriġinaw mill-Unjoni, li jinġarru
    lejn pajjiż terz jew territorju biex jipparteċipaw f’avvenimenti, f’eżibizzjonijiet,
    f’wirjiet u f’shows u mbagħad jinġarru lura lejn l-Unjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/54 van de Commissie van 21 oktober 2021
    tot wijziging van Gedelegeerde Verordening (EU) 2020/692 wat betreft aanvullende
    voorschriften voor de binnenkomst in de Unie van bepaalde hoefdieren die afkomstig
    zijn uit de Unie, voor deelname aan evenementen, tentoonstellingen, voorstellingen
    en shows naar een derde land of gebied worden verplaatst, en vervolgens naar de
    Unie terugkeren
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/54 z dnia 21 października
    2021 r. zmieniające rozporządzenie delegowane (UE) 2020/692 w odniesieniu do
    dodatkowych wymagań dotyczących wprowadzania do Unii niektórych zwierząt kopytnych,
    które pochodzą z Unii, są przemieszczane do państwa trzeciego lub na terytorium
    w celu wzięcia udziału w imprezach, wystawach, prezentacjach i pokazach, a następnie
    są przemieszczane z powrotem do Unii
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/54 da Comissão de 21 de outubro de 2021
    que altera o Regulamento Delegado (UE) 2020/692 no que diz respeito aos requisitos
    adicionais para a entrada na União de determinados ungulados originários da
    União que são transportados para um país terceiro ou território para participar
    em eventos, exposições, exibições e espetáculos, regressando em seguida à
    União
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/54 al Comisiei din 21 octombrie 2021 de
    modificare a Regulamentului delegat (UE) 2020/692 în ceea ce privește cerințele
    suplimentare privind intrarea în Uniune a anumitor ungulate care provin din Uniune,
    sunt deplasate într-o țară terță sau într-un teritoriu terț pentru a participa
    la evenimente, expoziții, prezentări și spectacole, după care sunt deplasate
    imediat înapoi în Uniune
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/54 z 21. októbra 2021, ktorým
    sa mení delegované nariadenie (EÚ) 2020/692, pokiaľ ide o dodatočné požiadavky
    na vstup do Únie v prípade určitých kopytníkov, ktoré pochádzajú z Únie,
    premiestňujú sa do tretej krajiny alebo na územie na účely účasti na podujatiach,
    výstavách, prehliadkach a potom sa premiestňujú späť do Únie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/54 z dne 21. oktobra 2021 o spremembi
    Delegirane uredbe (EU) 2020/692 glede dodatnih zahtev za vstop v Unijo nekaterih
    kopitarjev, ki izvirajo iz Unije, se premaknejo v tretjo državo ali na ozemlje
    zaradi udeležbe na dogodkih, razstavah, razkazovanjih in predstavah ter se nato
    vrnejo nazaj v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/54 de la Comisión de 21 de octubre de 2021
    que modifica el Reglamento Delegado (UE) 2020/692 en lo que respecta a los requisitos
    adicionales para la entrada en la Unión de determinados ungulados que procedan
    de la Unión, sean desplazados a un tercer país o territorio para participar
    en actos, exhibiciones, exposiciones y espectáculos y, a continuación, retornen
    a la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/54 av den 21 oktober 2021
    om ändring av delegerad förordning (EU) 2020/692 vad gäller ytterligare krav
    för införsel till unionen av vissa hov- och klövdjur med ursprung i unionen
    som flyttas till ett tredjeland eller territorium för deltagande i evenemang,
    utställningar, uppvisningar och föreställningar och sedan flyttas tillbaka
    till unionen
  type: main
