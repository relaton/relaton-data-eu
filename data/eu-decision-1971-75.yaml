title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 janvier 1971, autorisant la République
    italienne à exclure du traitement communautaire les appareils radio-récepteurs
    à transistors, de la position Ex 85.15 du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '71/75/EWG: Entscheidung der Kommission vom 21. Januar 1971, mit der die
    Italienische Republik ermächtigt wird, die aus Japan stammenden und in anderen
    Mitgliedstaaten im freien Verkehr befindlichen Transistor- Rundfunkempfänger
    der Tarifnummer ex 85.15 von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/75/CEE: Decisione della Commissione, del 21 gennaio 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario gli apparecchi
    radio riceventi a transistor, della voce ex 85.15 della tariffa doganale comune
    originari del Giappone e messi in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/75/EEG: Beschikking van de Commissie van 21 januari 1971 waarbij de
    Italiaanse Republiek wordt gemachtigd transistorradio-ontvangtoestellen van post
    ex 85.15 van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in
    andere Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
