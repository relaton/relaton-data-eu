title:
- language: fr
  script: Latn
  content: Règlement n° 100/63/CEE, n 5/63/Euratom, du 10 juillet 1963, fixant les
    modalités relatives à la liquidation des pensions des fonctionnaires visés
    à l'article 83 paragraphe 3 du statut, ainsi que la répartition des charges
    résultant de la liquidation de ces pensions entre le fonds des pensions de la
    Communauté européenne du charbon et de l'acier et les budgets de la Communauté
    économique européenne et de la Communauté européenne de l'énergie atomique
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 100/63/EWG, Nr. 5/63/Euratom, vom 10, Juli 1963 zur Festlegung
    der Einzelheiten für die Feststellung der Ruhegehälter der in Artikel 83 Absatz
    3 des Statuts bezeichneten Beamten sowie der Aufteilung der aus der Zahlung dieser
    Ruhegahälter entstehenden Lasten auf den Versorgungsfonds der Europäischen Gemeinschaft
    für Kohle und Stahl und die Haushaltspläne der Europäischen Wirtschaftsgemeinschaft
    und der Europäischen Atomgemeinschaft
  type: main
- language: el
  script: Grek
  content: Κανονισμός αριθ. 100/63/ΕΟΚ (5/63/Ευρατόμ) της
    10ης Ιουλίου 1963 περί καθορισμού του τρόπου ρευστοποίησης
    των συντάξεων των υπαλλήλων που προβλέπονται
    στο άρθρο 83 παράγραφος 3 του κανονισμού υπηρεσιακής
    κατάστασης, καθώς και περί της κατανομής των
    δαπανών που προκύπτουν από την ρευστοποίηση
    αυτών των συντάξεων μεταξύ του ταμείου συντάξεων
    της Ευρωπαϊκής Κοινότητας Άνθρακα και Χάλυβα
    και του προϋπολογισμού της Ευρωπαϊκής Οικονομικής
    Κοινότητας και της Ευρωπαϊκής Κοινότητας Ατομικής
    Ενέργειας
  type: main
- language: it
  script: Latn
  content: Regolamento n. 100/63/CEE, n. 5/63/Euratom del 10 luglio 1963 che definisce
    le modalità relative alla liquidazione delle pensioni dei funzionari di cui all'articolo
    83, paragrafo 3 dello statuto, nonché alla ripartizione degli oneri derivanti
    dalla liquidazione di dette pensioni tra il fondo pensioni della Comunità europea
    del carbone e dell'acciaio ed i bilanci della Comunità economica europea e della
    Comunità europea dell'energia atomica
  type: main
- language: nl
  script: Latn
  content: Verordening nr. 100/63/EEG, nr. 5/63/Euratom van 10 juli 1963 tot nadere
    regeling van de betaling der pensioenen van de ambtenaren, bedoeld in artikel
    83, lid 3, van het Statuut, en van de verdeling der uit deze pensioenen voortvloeiende
    lasten over het pensioenfonds van de Europese Gemeenschap voor Kolen en Staal
    en de begrotingen van de Europese Economische Gemeenschap en de Europese Gemeenschap
    voor Atoomenergie
  type: main
