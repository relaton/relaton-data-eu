    tarjontaan yhteisössä pystyviä maanpäällisiä järjestelmiä varten tehdyn
    päätöksen 2008/477/EY mukaiseen Bulgarian tasavallan pyyntöön perustuvan
    poikkeusluvan myöntämisestä tehdyn päätöksen 2009/1/EY muuttamisesta (tiedoksiannettu
    numerolla K(2010) 1987)'
  type: main
- language: hu
  script: Latn
