    de 2500 - 2690 MHz para os sistemas terrestres capazes de fornecer serviços de
    comunicações electrónicas na Comunidade [notificada com o número C(2010) 1987]'
  type: main
- language: ro
  script: Latn
  content: '2010/194/: Decizia Comisiei din 31 martie 2010 de modificare a Deciziei
    2009/1/CE de acordare a unei derogări ca urmare a solicitării formulate de Republica
