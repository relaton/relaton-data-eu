    kohta maapealsete süsteemide jaoks, millega on võimalik ühenduses pakkuda elektroonilisi
    sideteenuseid) kohaselt tehakse Bulgaaria Vabariigile taotletud erand (teatavaks
    tehtud numbri K(2010) 1987 all)'
  type: main
- language: fi
  script: Latn
  content: '2010/194/: Komission päätös, annettu 31 päivänä maaliskuuta 2010
