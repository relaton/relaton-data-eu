    skont id-Deċiżjoni tal-Kummissjoni 2008/477/KE dwar l-armonizzazzjoni tal-medda
    ta’ frekwenzi bejn 2500 - 2690 MHz għas-sistemi terrestri li huma kapaċi jipprovdu
    servizzi ta’ komunikazzjoni elettronika fil-Komunità (notifikata bid-dokument
    numru C(2010) 1987)'
  type: main
- language: nl
  script: Latn
  content: '2010/194/: Besluit van de Commissie van 31 maart 2010 tot wijziging van
    Beschikking 2009/1/EG tot verlening van een door de Republiek Bulgarije gevraagde
    afwijking in het kader van Beschikking 2008/477/EG betreffende de harmonisering
    van de 2500 - 2690 MHz-frequentieband voor terrestrische systemen die elektronischecommunicatiediensten
    kunnen verschaffen in de Gemeenschap (Kennisgeving geschied onder nummer C(2010)
    1987)'
  type: main
- language: pl
  script: Latn
  content: '2010/194/: Decyzja Komisji z dnia 31 marca 2010 r. zmieniająca decyzję
