    pagal Sprendimą 2008/477/EB dėl 2500 – 2690 MHz dažnių juostos suderinimo
    antžeminėms sistemoms, kuriomis Bendrijoje galima teikti elektroninio ryšio
    paslaugas (pranešta dokumentu Nr. C(2010) 1987)'
  type: main
- language: mt
  script: Latn
  content: '2010/194/: Deċiżjoni tal-Kummissjoni tal- 31 ta’ Marzu 2010 li temenda
