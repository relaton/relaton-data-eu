    na mocy decyzji 2008/477/WE w sprawie harmonizacji zakresu częstotliwości 2500
    – 2690 MHz na potrzeby ziemskich systemów zapewniających usługi łączności
    elektronicznej we Wspólnocie (notyfikowana jako dokument nr C(2010) 1987)'
  type: main
- language: pt
  script: Latn
  content: '2010/194/: Decisão da Comissão, de 31 de Março de 2010 , que altera
