title:
- language: en
  script: Latn
  content: '2010/194/: Commission Decision of 31 March 2010 amending Decision 2009/1/EC
    granting a derogation requested by the Republic of Bulgaria pursuant to Decision
    2008/477/EC on the harmonisation of the 2500 - 2690 MHz frequency band for terrestrial
    systems capable of providing electronic communications services in the Community
    (notified under document C(2010) 1987)'
  type: main
- language: fr
  script: Latn
  content: '2010/194/: Décision de la Commission du 31 mars 2010 modifiant la décision
    2009/1/CE accordant à la République de Bulgarie une dérogation demandée en
    application de la décision 2008/477/CE sur l’harmonisation de la bande de fréquences
    2500 - 2690 MHz pour les systèmes de Terre permettant de fournir des services
    de communications électroniques dans la Communauté [notifiée sous le numéro
    C(2010) 1987]'
  type: main
- language: de
  script: Latn
  content: '2010/194/: Beschluss der Kommission vom 31. März 2010 zur Änderung der
    Entscheidung 2009/1/EG der Kommission über eine von der Republik Bulgarien beantragte
    Ausnahmegenehmigung gemäß der Entscheidung 2008/477/EG der Kommission zur Harmonisierung
    des Frequenzbands 2500 — 2690 MHz für terrestrische Systeme, die elektronische
    Kommunikationsdienste in der Gemeinschaft erbringen können (Bekannt gegeben unter
    Aktenzeichen K(2010) 1987)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/194/ЕС: Решение на Комисията от 31 март
