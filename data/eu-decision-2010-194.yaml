    България съгласно Решение 2008/477/ЕО за хармонизиране
    на радиочестотната лента 2500 — 2690 MHz за наземни
    системи, позволяващи предоставяне на електронни
    съобщителни услуги в Общността (нотифицирано
    под номер C(2010) 1987)'
  type: main
- language: cs
  script: Latn
