    της Βουλγαρίας κατ’ εφαρμογή της απόφασης
    2008/477/ΕΚ σχετικά με την εναρμόνιση της ζώνης
    συχνοτήτων των 2500 - 2690 MHz για επίγεια συστήματα
    παροχής υπηρεσιών ηλεκτρονικών επικοινωνιών
    στην Κοινότητα [κοινοποιηθείσα υπό τον αριθμό
    Ε(2010) 1987]'
  type: main
- language: et
  script: Latn
