    podle rozhodnutí 2008/477/ES o harmonizaci kmitočtového pásma 2500 – 2690
    MHz pro zemské systémy k poskytování služeb elektronických komunikací ve
    Společenství (oznámeno pod číslem K(2010) 1987)'
  type: main
- language: da
  script: Latn
  content: '2010/194/: Kommissionens afgørelse af 31. marts 2010 om ændring af beslutning
    2009/1/EF om indrømmelse af en undtagelse, som Republikken Bulgarien har anmodet
    om i henhold til beslutning 2008/477/EF om harmonisering af 2500 - 2690 MHz-båndet
    for landbaserede systemer, som kan levere elektroniske kommunikationstjenester
    i Fællesskabet (meddelt under nummer K(2010) 1987)'
  type: main
- language: el
  script: Grek
  content: '2010/194/: Απόφαση της Επιτροπής, της 31ης Μαρτίου
