    szolgáltatások nyújtására alkalmas földfelszíni rendszerek érdekében
    történő harmonizálásáról szóló 2008/477/EK határozattal kapcsolatban
    a Bolgár Köztársaság által kérelmezett eltérés engedélyezéséről szóló
    2009/1/EK határozat módosításáról (az értesítés a C(2010) 1987. számú
    dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2010/194/: Decisione della Commissione, del 31 marzo 2010 , recante modifica
    della decisione 2009/1/CE relativa alla concessione di una deroga richiesta dalla
    Repubblica di Bulgaria in applicazione della decisione 2008/477/CE relativa all’armonizzazione
    della banda di frequenze 2500 - 2690 MHz per i sistemi terrestri in grado di fornire
    servizi di comunicazioni elettroniche nella Comunità [notificata con il numero
    C(2010) 1987]'
  type: main
- language: lv
  script: Latn
  content: '2010/194/: Komisijas Lēmums ( 2010. gada 31. marts ), ar ko groza Lēmumu
    2009/1/EK, ar ko Bulgārijas Republikai piešķir atkāpi, ko tā pieprasījusi
    atbilstīgi Lēmumam 2008/477/EK par 2500 – 2690 MHz frekvenču joslas harmonizāciju
    tādu zemes sistēmu vajadzībām, kas Kopienā spēj nodrošināt elektronisko
    sakaru pakalpojumus (izziņots ar dokumenta numuru C(2010) 1987)'
  type: main
- language: lt
  script: Latn
  content: '2010/194/: 2010 m. kovo 31 d. Komisijos sprendimas, kuriuo iš dalies
