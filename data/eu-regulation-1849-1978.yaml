  content: Council Regulation (EEC) No 1849/78 of 25 July 1978 laying down certain
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1849/78 du Conseil, du 25 juillet 1978, fixant certaines
    mesures de conservation et de gestion des ressources de pêche applicables aux
    navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1849/78 des Rates vom 25. Juli 1978 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände, die für
    Schiffe gelten, die die Flagge Norwegens führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1849/78 af 25. juli 1978 om fastsættelse
