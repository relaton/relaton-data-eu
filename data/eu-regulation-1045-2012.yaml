    de preferințe tarifare generalizate, pentru a lua în calcul situația specială
    din El Salvador legată de exporturile anumitor produse pescărești către Uniune
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1045/2012 z 8. novembra 2012
