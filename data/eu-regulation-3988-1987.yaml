  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3988/87 van de Commissie van 22 december 1987 tot
    wijziging van bepaalde besluiten betreffende de gemeenschappelijke ordening der
    markten in de sector rundvlees naar aanleiding van de invoering van de gecombineerde
    nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 3988/87 z dnia 22 grudnia 1987 r. zmieniające
    niektóre środki w odniesieniu do stosowania wspólnej organizacji rynków w
    sektorze wołowiny na skutek wprowadzenia Nomenklatury Scalonej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3988/87 da Comissão de 22 de Dezembro de 1987 que
    altera determinados actos relativos à aplicação da organização comum de mercado
    no sector da carne de bovino na sequência da criação da Nomenclatura Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 3988/87 al Comisiei din 22 decembrie 1987 de modificare
    a unor acte referitoare la aplicarea organizării comune a pieței în sectorul
    cărnii de vită ca urmare a introducerii Nomenclaturii Combinate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 3988/87 z 22. decembra 1987, ktorým sa menia
    a dopĺňajú určité opatrenia v súvislosti s uplatňovaním spoločnej organizácie
    trhov v sektore hovädzieho mäsa v dôsledku zavedenia kombinovanej nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 3988/87 z dne 22. decembra 1987 o spremembi
    nekaterih ukrepov o uporabi skupne ureditve trga za goveje meso zaradi uvedbe
    kombinirane nomenklature
  type: main
- language: es
  script: Latn
