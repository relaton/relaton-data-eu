    común de mercados en el sector de la carne de vacuno a raíz del establecimiento
    de la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3988/87 av den 22 december 1987 om ändring
    av vissa rättsakter som rör tillämpningen av den gemensamma organisationen
