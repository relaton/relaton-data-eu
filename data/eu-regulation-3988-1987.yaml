title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3988/87 of 22 December 1987 amending certain
    measures in respect of the application of the common organization of the markets
    in the beef sector on account of the introduction of the combined nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3988/87 de la Commission du 22 décembre 1987 modifiant
    certains actes relatifs à l'application de l'organisation commune des marchés
    dans le secteur de la viande bovine en raison de l'instauration de la nomenclature
    combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3988/87 der Kommission vom 22. Dezember 1987 zur Änderung
    von Rechtsakten betreffend die Anwendung der gemeinsamen Marktorganisation für
    Rindfleisch infolge der Einführung der Kombinierten Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 3988/87 на Комисията от 22
    декември 1987 година за изменение на някои актове
    относно прилагането на общата организация
    на пазарите на говеждо и телешко месо поради
    въвеждането на Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 3988/87 ze dne 22. prosince 1987, kterým
    se mění některé právní předpisy o používání společné organizace trhu
    v odvětví hovězího a telecího masa v důsledku zavedení kombinované nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3988/87 af 22. december 1987 om ændring
    af visse retsakter vedrørende anvendelsen af den fælles markedsordning for oksekød
    som følge af indførelsen af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3988/87 της Επιτροπής
    της 22ας Δεκεμβρίου 1987 που τροποποιεί ορισμένες
    πράξεις σχετικά με την κοινή οργάνωση αγοράς
    στον τομέα του βοείου κρέατος, λόγω της καθιέρωσης
    της συνδυασμένης ονοματολογίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 3988/87, 22. detsember 1987, millega muudetakse
    seoses kaupade koondnomenklatuuri kehtestamisega teatavaid veiselihaturu ühise
    korralduse kohaldamist käsitlevaid meetmeid
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3988/87, annettu 22 päivänä joulukuuta 1987,
    eräiden naudanliha-alan yhteistä markkinajärjestelyä koskevien asiakirjojen
    muuttamisesta yhdistetyn nimikkeistön muodostamisen vuoksi
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 3988/87 od 22. prosinca 1987. o izmjeni nekih
    mjera za primjenu zajedničke organizacije u sektoru govedine radi uvođenja kombinirane
    nomenklature
  type: main
- language: hu
  script: Latn
  content: A Bizottság 3988/87/EGK rendelete (1987. december 22.) a marhahúságazatban
    a közös piacszervezés alkalmazására tekintettel egyes intézkedéseknek a
    Kombinált Nómenklatúra bevezetése következtében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3988/87 della Commissione del 22 dicembre 1987 che
    modifica taluni atti relativi all'applicazione dell'organizzazione comune dei
    mercati nel settore delle carni bovine in seguito all'introduzione della nomenclatura
    combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 3988/87 (1987. gada 22. decembris), ar ko groza
