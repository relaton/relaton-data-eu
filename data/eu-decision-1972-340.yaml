title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 25 septembre 1972, autorisant la République
    française à exclure du traitement communautaire les poivrons surgelés, de la
    position 07.02 Ex B du Tarif douanier commun, originaires de Yougoslavie et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/340/EWG: Entscheidung der Kommission vom 25. September 1972, mit der
    die Französische Republik ermächtigt wird, aus Jugoslawien stammenden und in
    den übrigen Mitgliedstaaten im freien Verkehr befindlichen tiefgefrorenen Gemüsepaprika
    der Tarifnummer 07.02 ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/340/CEE: Decisione della Commissione, del 25 settembre 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i peperoni surgelati
    della voce n. 07.02 ex B della tariffa doganale comune, originari della Iugoslavia
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/340/EEG: Beschikking van de Commissie van 25 september 1972 waarbij
    de Franse Republiek wordt gemachtigd diepgevroren capsicumpepers van post 07.02
    ex B van het gemeenschappelijk douanetarief, van oorsprong uit Joegoslavië en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
