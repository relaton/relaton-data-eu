title:
- language: en
  script: Latn
  content: '91/591/EEC: Commission Decision of 5 November 1991 amending Commission
    Decision 90/613/EEC approving derogations provided for by Italy from certain provisions
    of Council Directive 77/93/EEC in respect of seed potatoes originating in Poland
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/591/CEE: Décision de la Commission du 5 novembre 1991 modifiant la
    décision 90/613/CEE approuvant les dérogations prévues par l''Italie à certaines
    dispositions de la directive 77/93/CEE du Conseil en ce qui concerne les plants
    de pommes de terre originaires de la Pologne (Le texte en langue italienne est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 5. November 1991 zur Änderung der Entscheidung
    90/613/EWG zur Genehmigung der von Italien für Pflanzkartoffeln mit Ursprung
    in Polen vorgesehenen Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG
    des Rates (Nur der italienische Text ist verbindlich) (91/591/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 5. november 1991 om ændring af beslutning
    90/613/EØF om godkendelse af de af Italien fastsatte undtagelser fra visse bestemmelser
    i Rådets direktiv 77/93/EØF for så vidt angår læggekartofler med oprindelse
    i Polen (Kun den italienske udgave er autentisk) (91/591/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/591/ΕΟΚ: Απόφαση της Επιτροπής, της 5ης
    Νοεμβρίου 1991, που τροποποιεί την απόφαση 90/613/ΕΟΚ
    για την έγκριση παρεκκλίσεων που προβλέπονται
    από την Ιταλία ως προς ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου όσον αφορά
    τους σπόρους γεωμήλων προς φύτευση καταγωγής
    Πολωνίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 5 novembre 1991 recante modifica della
    decisione 90/613/CEE che approva le deroghe, previste dall'' Italia, a talune
    disposizioni della direttiva 77/93/CEE del Consiglio per quanto riguarda i tuberi-seme
    di patata originari della Polonia (Il testo in lingua italiana è il solo facente
    fede) (91/591/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 5 november 1991 tot wijziging van Beschikking
    90/613/EEG tot goedkeuring van de door Italië vastgestelde afwijkingen van sommige
    bepalingen van Richtlijn 77/93/EEG van de Raad ten aanzien van pootaardappelen
    van oorsprong uit Polen (Slechts de tekst in de Italiaanse taal is authentiek)
    (91/591/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 5 de Novembro de 1991 que altera a Decisão 90/613/CEE,
    aprova as derrogações, previstas pela Itália, a determinadas normas da Directiva
    77/93/CEE do Conselho em relação à batata de semente originária da Polónia
    (Apenas faz fé o texto em língua italiana) (91/591/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 5 de noviembre de 1991 por la que se modifica
    la Decisión 90/613/CEE por la que se aprueban las excepciones previstas por Italia
    a determinadas disposiciones de la Directiva 77/93/CEE del Consejo por lo que
    se refiere a las patatas de siembra originarias de Polonia (El texto en lengua
    italiana es el único auténtico) (91/591/CEE) #'
