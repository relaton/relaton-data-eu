    εφαρμογής των δασμών για ουρία του κωδικού
    ΣΟ 3102 10 10, καταγωγής Βραζιλίας, δικαιούχου των
    προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ. 3896/89
    του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 846/90 DELLA COMMISSIONE del 2 aprile 1990 che ripristina
    la riscossione dei dazi doganali applicabili all'urea del codice NC 3102 10 10,
    originaria del Brasile, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 846/90 VAN DE COMMISSIE van 2 april 1990 houdende
