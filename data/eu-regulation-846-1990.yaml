title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 846/90 of 2 April 1990 reintroduced the
    levying of the customs duties on urea falling within CN code 3102 10 10 originating
    in Brazil to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 846/90 de la Commission du 2 avril 1990 portant rétablissement
    de la perception des droits de douane applicables à l'urée du code NC 3102 10
    10, originaire du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 846/90 DER KOMMISSION vom 2. April 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer Harnstoff des KN-Code 3102 10 10 mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 846/90 af 2. april 1990 om genindførelse
    af opkrævning af told for urinstof henhørende under KN-kode 3102 10 10 og med
    oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 846/90 της Επιτροπής
