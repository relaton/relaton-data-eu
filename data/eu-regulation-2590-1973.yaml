title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2590/73 of the Commission of 24 September 1973 re-establishing
    Common Customs Tariff duties on spoons, forks, fish-eaters, butter-knives, ladles,
    and similar kitchen or tableware, of stainless steel, falling within heading No
    82.14 A, originating in South Korea to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2590/73 de la Commission, du 24 septembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux cuillers, louches, fourchettes, pelles à tartes, couteaux spéciaux à poisson
    ou à beurre, pinces à sucre et articles similaires, en acier inoxydable, de
    la sous-position tarifaire 82.14 A, originaires de la Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2590/73 der Kommission vom 24. September 1973 zur
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Löffel, Schöpfkellen,
    Gabeln, Tortenschaufeln, Fischmesser, Buttermesser, Zuckerzangen und ähnliche
    Tischgeräte, aus rostfreiem Stahl, der Tarifstelle 82.14 A, mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2590/73 af 24. september 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for skeer, gafler, fiskeknive, smørknive,
    potageskeer og lignende artikler til køkken- og bordbrug af rustfrit stål under
    position 82.14 A, som har oprindelse i Syd-Korea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2590/73 della Commissione, del 24 settembre 1973,
    che ripristina la riscossione dei dazi della tariffa doganale comune applicabili
    ai cucchiai, cucchiaioni, forchette, palette da torta, coltelli speciali da pesce
    o da burro, pinze da zucchero e oggetti simili, di acciaio inossidabile, della
    sottovoce doganale n. 82.14 A originari della Corea del Sud beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio,
    del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2590/73 van de Commissie van 24 september 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op lepels, pollepels, vorken, taartscheppen, vismessen en botermesjes,
    suikertangen en dergelijke artikelen, van roestvrij staal van onderverdeling 82.14
    A, van oorsprong uit Zuid-Korea ten behoeve waarvan bij Verordening (EEG) nr.
    2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
