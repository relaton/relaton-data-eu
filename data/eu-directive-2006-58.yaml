title:
- language: en
  script: Latn
  content: Council Directive 2006/58/EC of 27 June 2006 amending Council Directive
    2002/38/EC as regards the period of application of the value added tax arrangements
    applicable to radio and television broadcasting services and certain electronically
    supplied services
  type: main
- language: fr
  script: Latn
  content: Directive 2006/58/CE du Conseil du 27 juin 2006 modifiant la directive
    2002/38/CE en ce qui concerne la période d'application du régime de taxe sur
    la valeur ajoutée applicable aux services de radiodiffusion et de télévision
    et à certains services fournis par voie électronique
  type: main
- language: de
  script: Latn
  content: Richtlinie 2006/58/EG des Rates vom 27. Juni 2006 zur Änderung der Richtlinie
    2002/38/EG bezüglich der Geltungsdauer der Mehrwertsteuerregelung für Rundfunk-
    und Fernsehdienstleistungen sowie bestimmte elektronisch erbrachte Dienstleistungen
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 2006/58/ES ze dne 27. června 2006 , kterou se mění směrnice
    2002/38/ES, pokud jde o dobu použití úpravy daně z přidané hodnoty uplatňované
    na služby rozhlasového a televizního vysílání a na určité elektronicky
    poskytované služby
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2006/58/EF af 27. juni 2006 om ændring af direktiv 2002/38/EF
    hvad angår anvendelsesperioden for merværdiafgiftssystemet for radio- og tv-spredningstjenester
    og visse elektronisk leverede tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 2006/58/ΕΚ του Συμβουλίου, της 27ης Ιουνίου
    2006 , για την τροποποίηση της οδηγίας 2002/38/ΕΚ
    όσον αφορά την περίοδο εφαρμογής των ρυθμίσεων
    ΦΠΑ για τις υπηρεσίες ραδιοφωνικών και τηλεοπτικών
    εκπομπών καθώς και για ορισμένες ηλεκτρονικά
    παρεχόμενες υπηρεσίες
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 2006/58/EÜ, 27. juuni 2006 , millega muudetakse direktiivi
    2002/38/EÜ seoses raadio- ja televisiooniringhäälinguteenuste ja teatavate
    elektrooniliselt osutatavate teenuste suhtes kohaldatava käibemaksukorra kohaldamisajaga
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi (EY) 2006/58/EY, annettu, 27 päivänä kesäkuuta
    2006 , direktiivin 2002/38/EY muuttamisesta radio- ja televisiolähetyspalveluihin
    ja tiettyihin sähköisesti suoritettaviin palveluihin sovellettavien arvonlisäverojärjestelyjen
    soveltamisajan osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/58/EK irányelve ( 2006. június 27. ) a 2002/38/EK irányelvnek
    a rádióműsor- és televízióműsor-terjesztési szolgáltatásokra és egyes
    elektronikus úton nyújtott szolgáltatásokra alkalmazandó hozzáadottérték-adó
    alkalmazási időszaka tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2006/58/CE del Consiglio, del 27 giugno 2006 , che modifica la
    direttiva 2002/38/CE relativamente al periodo di applicazione del regime di imposta
    sul valore aggiunto applicabile ai servizi di radiodiffusione e di televisione
    e a determinati servizi prestati tramite mezzi elettronici
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 2006/58/EK ( 2006. gada 27. jūnijs ), ar ko Direktīvu
    2002/38/EK groza attiecībā uz periodu pievienotās vērtības nodokļa piemērošanai
    radio un televīzijas apraides pakalpojumiem un dažiem elektroniski sniegtiem
    pakalpojumiem
  type: main
- language: lt
  script: Latn
  content: 2006 m. birželio 27 d. Tarybos direktyva 2006/58/EB, iš dalies keičianti
    Direktyvos 2002/38/EB nuostatas, susijusias su pridėtinės vertės mokesčio
    priemonių, taikomų radijo ir televizijos transliacijų paslaugoms ir tam tikroms
    elektroninėmis priemonėmis teikiamoms paslaugoms, taikymo laikotarpiu
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kunsill 2006/58/KE tas- 27 ta' Ġunju 2006 li temenda d-Direttiva
    2002/38/KE fir-rigward tal-perjodu ta' applikazzjoni ta' l-aġġustamenti tat-taxxa
    fuq il-valur miżjud applikabbli għas-servizzi tax-xandir bir-radju u bit-televiżjoni
    u xi servizzi forniti b'mezzi elettroniċi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2006/58/EG van de Raad van 27 juni 2006 tot wijziging van Richtlijn
    2002/38/EG wat betreft de toepassingsduur van de regeling inzake de belasting
    over de toegevoegde waarde voor bepaalde diensten die langs elektronische weg
    worden verricht alsook radio- en televisieomroepdiensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 2006/58/WE z dnia 27 czerwca 2006 r. zmieniająca dyrektywę
    2002/38/WE w odniesieniu do okresu stosowania systemu podatku od wartości dodanej
    stosowanego do usług nadawczych radiowych i telewizyjnych oraz niektórych usług
    świadczonych drogą elektroniczną
  type: main
- language: pt
  script: Latn
  content: Directiva 2006/58/CE do Conselho, de 27 de Junho de 2006 , que altera a
    Directiva 2002/38/CE no que respeita ao período de aplicação do regime do imposto
    sobre o valor acrescentado aplicável aos serviços de radiodifusão e televisão
    e a determinados serviços prestados por via electrónica
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 2006/58/ES z 27. júna 2006 , ktorou sa mení a dopĺňa
    smernica 2002/38/ES, pokiaľ ide o obdobie uplatňovania úprav týkajúcich sa
    dane z pridanej hodnoty vzhľadom na služby rozhlasového a televízneho vysielania
    a určité elektronicky poskytované služby
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2006/58/ES z dne 27 junija 2006 o spremembi Direktive 2002/38/ES
    glede obdobja uporabe ureditve davka na dodano vrednost, ki se uporablja za storitve
    radijskega in televizijskega oddajanja ter za določene elektronsko opravljene
    storitve
  type: main
- language: es
  script: Latn
  content: Directiva 2006/58/CE del Consejo, de 27 de junio de 2006 , por la que se
    modifica la Directiva 2002/38/CE en lo que se refiere al período de vigencia
    del régimen del impuesto sobre el valor añadido aplicable a los servicios de
    radiodifusión y de televisión y a algunos servicios prestados por vía electrónica
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 2006/58/EG av den 27 juni 2006 om ändring av rådets
    direktiv 2002/38/EG vad gäller tillämpningsperioden för mervärdesskatteordningen
    för radio- och televisionssändningar samt vissa tjänster som tillhandahålls
    på elektronisk väg
  type: main
