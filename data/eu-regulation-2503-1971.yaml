  content: Regulation (EEC) No 2503/71 of the Commission of 22 November 1971 amending
    Regulation (EEC) No 615/71 on detailed rules for the application of the production
    refund on olive oil used in the manufacture of certain preserved foods
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2503/71 de la Commission, du 22 novembre 1971, modifiant
    le règlement (CEE) n° 615/71 relatif aux modalités d' application de la restitution
    à la production pour les huiles d' olive utilisées pour la fabrication de certaines
    conserves
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2503/71 der Kommission vom 22. November 1971 zur Änderung
    der Verordnung (EWG) Nr. 615/71 mit Durchführungsbestimmungen für die Erstattung
    bei der Erzeugung für Olivenöl zur Herstellung bestimmter Konserven
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2503/71 af 22. november 1971 om ændring
    af forordning (EØF) nr. 615/71 om de nærmere regler for anvendelsen af produktionsrestitution
    til de olivenolier, der benyttes til fremstilling af visse konservesprodukter
  type: main
- language: el
  script: Grek
