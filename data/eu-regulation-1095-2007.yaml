  script: Latn
  content: Commission Regulation (EC) No 1095/2007 of 20 September 2007 amending Regulation
    (EC) No 1490/2002 laying down further detailed rules for the implementation of
    the third stage of the programme of work referred to in Article 8(2) of Council
    Directive 91/414/EEC and Regulation (EC) No 2229/2004 laying down further detailed
