title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1634/92 of 24 June 1992 reintroducing the
    levying of the customs duties applicable to products falling within CN code 2929
    90 00, originating in Brazil, to which the preferential tariff arrangements of
    Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1634/92 de la Commission du 24 juin 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 2929
    90 00 originaires du Brésil, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1634/92 DER KOMMISSION vom 24. Juni 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 2929 90 00 mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1634/92 af 24. juni 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2929 90 00 og med oprindelse
    i Brasilien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1634/92 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Ιουνίου 1992 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 2929 90 00, καταγωγής Βραζιλίας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1634/92 DELLA COMMISSIONE del 24 giugno 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 2929 90 00 originari del Brasile beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1634/92 VAN DE COMMISSIE van 24 juni 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 2929 90 00, van oorsprong uit Brazilië, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1634/92 DA COMISSÃO de 24 de Junho de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos do código NC 2929
    90 00, originários do Brasil, beneficiários das preferências pautais previstas
    pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1634/92 DE LA COMISIÓN de 24 de junio de 1992 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos del código NC 2929 90 00 originarios de Brasil, beneficiarios de las
    preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90 del Consejo
    #'
