    σε ορισμένα μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1923/88 della Commissione del 30 giugno 1988 che fissa
    gli importi compensativi adesione applicabili nel settore dei cereali per la campagna
    1988/1989, nonché i coefficienti da prendere in considerazione per il calcolo
    degli importi applicabili a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1923/88 van de Commissie van 30 juni 1988 tot vaststelling
