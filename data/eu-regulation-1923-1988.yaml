    1988/89 sowie der Koeffizienten für die Berechnung der auf bestimmte Verarbeitungserzeugnisse
    anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1923/88 af 30. juni 1988 om fastsættelse
