    para a campanha de 1988/1989, bem como os coeficientes a utilizar para o cálculo
    dos montantes aplicáveis a determinados produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1923/88 de la Comisión de 30 de junio de 1988 por
