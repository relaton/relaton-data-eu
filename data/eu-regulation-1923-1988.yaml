    pour la campagne 1988/1989 ainsi que les coefficients à retenir pour le calcul
    des montants applicables aux produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1923/88 der Kommission vom 30. Juni 1988 zur Festsetzung
