  script: Latn
  content: Commission Implementing Decision (EU) 2019/1309 of 26 July 2019 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean MON 87751 (MON-87751-7), pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2019) 5489)
  type: main
- language: fr
  script: Latn
