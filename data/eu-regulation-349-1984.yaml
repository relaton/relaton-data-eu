title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 349/84 of 6 February 1984 suspending tariff
    concessions and increasing duties under the Common Customs Tariff with regard
    to certain products originating in the United States of America, and establishing
    quantitative restrictions with regard to other products originating in that country
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 349/84 du Conseil du 6 février 1984 portant suspension
    de concessions tarifaires et relèvement des droits du tarif douanier commun applicables
    à certains produits originaires des États-Unis d' Amérique et instituant des
    restrictions quantitatives applicables à d' autres produits originaires de ce
    pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 349/84 des Rates vom 6. Februar 1984 betreffend die
    Aufhebung von Zollzugeständnissen und die Erhöhung der Zölle des Gemeinsamen
    Zolltarifs für die Einfuhr bestimmter Erzeugnisse mit Ursprung in den Vereinigten
    Staaten von Amerika und die Einführung mengenmäßiger Beschränkungen für andere
    Erzeugnisse mit Ursprung in diesem Land
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 349/84 af 6. februar 1984 om suspension af
    toldindrømmelser og forhøjelse af satserne i den fælles toldtarif for visse
    varer med oprindelse i Amerikas Forenede Stater og om indførelse af kvantitative
    restriktioner for andre varer med oprindelse i dette land
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 349/84 του Συμβουλίου
    της 6ης Φεβρουαρίου 1984 για την αναστολή των
    δασμολογικών παραχωρήσεων και την αύξηση των
    δασμών του Κοινού Δασμολογίου που εφαρμόζονται
    σε ορισμένα προϊόντα καταγωγής Ηνωμένων Πολιτειών
    Αμερικής και για την επιβολή ποσοτικών περιορισμών
    σε άλλα προϊόντα καταγωγής της χώρας αυτής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 349/84 del Consiglio del 6 febbraio 1984 recante sospensione
    delle concessioni tariffarie e aumento dei dazi della tariffa doganale comune
    applicabili a taluni prodotti originari degli Stati Uniti d' America e recante
    istituzione delle restrizioni quantitative applicabili ad altri prodotti originari
    di detto paese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 349/84 van de Raad van 6 februari 1984 houdende schorsing
    van tariefconcessies en verhoging van de rechten van het gemeenschappelijk douanetarief
    voor bepaalde produkten van oorsprong uit de Verenigde Staten van Amerika en houdende
    instelling van kwantitatieve beperkingen voor andere produkten van oorsprong uit
    dat land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 349/84 do Conselho, de 6 de Fevereiro de 1984, relativo
    a suspensões de concessões pautais e agravamento dos direitos da pauta aduaneira
    comum aplicáveis a certos produtos originários dos Estados Unidos da América
    e que institui restrições quantitativas aplicáveis a outros produtos desse
    país
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 349/84 del Consejo, de 6 de febrero de 1984, por el
    que se suspenden las concesiones arancelarias y se elevan los derechos del arancel
    aduanero común aplicables a ciertos productos originarios de los Estados Unidos
    de América y se establecen restricciones cuantitativas respecto a otros productos
    originarios de ese país
  type: main
