- language: en
  script: Latn
  content: Council Decision (EU) 2024/435 of 29 January 2024 on the position to be
    adopted on behalf of the European Union within the CETA Joint Committee established
    under the Comprehensive Economic and Trade Agreement (CETA) between Canada, of
    the one part, and the European Union and its Member States, of the other part,
    as regards the adoption of an Interpretation of Article 8.10, Annex 8-A, Article
    8.9 and Article 8.39 thereof in accordance with its Article 26.1.5(e)
  type: main
