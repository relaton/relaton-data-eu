title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 744/87 of 16 March 1987 amending Regulation
    (EEC) No 805/86 introducing a charge on denatured skimmed-milk powder coming from
    Spain and derogating from Regulation (EEC) No 1378/86 as regards the accession
    compensatory amounts in trade with Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 744/87 de la Commission du 16 mars 1987 modifiant
    le règlement (CEE) n° 805/86 instaurant une taxe sur le lait écrémé en poudre
    dénaturé en provenance d' Espagne et dérogeant au règlement (CEE) n° 1378/86
    en ce qui concerne les montants compensatoires "adhésion" dans les échanges
    avec l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 744/87 der Kommission vom 16. März 1987 zur Änderung
    der Verordnung (EWG) Nr. 805/86 zur Einführung einer Abgabe auf aus Spanien eingeführtes
    denaturiertes Magermilchpulver und zur Abweichung von der Verordnung (EWG) Nr.
    1378/86 hinsichtlich der im Handel mit Spanien geltenden Beitrittsausgleichsbeträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 744/87 af 16. marts 1987 om ændring
    af forordning (EØF) nr. 805/86 om indførelse af en afgift på denatureret skummetmælkspulver
    fra Spanien og om undtagelse fra forordning (EØF) nr. 1378/86 vedrørende fastsættelse
    af tiltrædelsesudligningsbeløbene i samhandelen med Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 744/87 της Επιτροπής
    της 16ης Μαρτίου 1987 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 805/86 που καθιέρωσε ένα φόρο στο μετουσιωμένο
    αποκορυφωμένο γάλα σε σκόνη προελεύσεως Ισπανίας
    και παρεκκλίνει από τον κανονισμό (ΕΟΚ) αριθ.
    1378/86 όσον αφορά τα εξισωτικά ποσά προσχώρησης
    στις συναλλαγές με την Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 744/87 della Commissione del 16 marzo 1987 recante
    modifica del regolamento (CEE) n. 805/86 che istituisce una tassa sul latte scremato
    in polvere denaturato proveniente dalla Spagna e recante deroga del regolamento
    (CEE) n. 1378/86 per quanto concerne gli importi compensativi adesione negli scambi
    con la Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 744/87 van de Commissie van 16 maart 1987 houdende
    wijziging van Verordening (EEG) nr. 805/86 tot instelling van een heffing op gedenatureerd
    magere-melkpoeder van herkomst uit Spanje en houdende afwijking van Verordening
    (EEG) nr. 1378/86 met betrekking tot de in het handelsverkeer met Spanje toe te
    passen compenserende bedragen ,,toetreding"
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 744/87 da Comissão de 16 de Março de 1987 que
    altera o Regulamento (CEE) n.° 805/86 que institui um imposto sobre o leite em
    pó desnatado e desnaturado proveniente de Espanha e que derroga o Regulamento
    (CEE) n.° 1378/86 no que respeita aos montantes compensatórios de adesão nas
    trocas comerciais com Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 744/87 de la Comisión de 16 de marzo de 1987 por
    el que se modifica el Reglamento (CEE) n° 805/86 por el que se establece un gravamen
    sobre la leche desnatada en polvo y desnaturalizada procedente de España y por
    el que se introduce una excepción al Reglamento (CEE) n° 1378/86 en lo que respecta
    a los montantes compensatorios "adhesión" en los intercambios con España
  type: main
