title:
- language: en
  script: Latn
  content: '2000/747/EC: Council Decision of 27 November 2000 amending Article 3 of
    Decision 98/198/EC authorising the United Kingdom to extend application of a measure
    derogating from Articles 6 and 17 of the sixth Directive (77/388/EEC) on the harmonisation
    of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '2000/747/CE: Décision du Conseil du 27 novembre 2000 modifiant l''article
    3 de la décision 98/198/CE autorisant le Royaume-Uni à proroger l''application
    d''une mesure dérogatoire aux articles 6 et 17 de la sixième directive (77/388/CEE)
    relative au système commun de taxe sur la valeur ajoutée'
  type: main
- language: de
  script: Latn
  content: '2000/747/EG: Entscheidung des Rates vom 27. November 2000 zur Änderung
    von Artikel 3 der Entscheidung 98/198/EG zur Ermächtigung des Vereinigten Königreichs,
    die Anwendung einer von den Artikeln 6 und 17 der Sechsten Richtlinie 77/388/EWG
    über das gemeinsame Mehrwertsteuersystem abweichenden Maßnahme zu verlängern'
  type: main
- language: da
  script: Latn
  content: '2000/747/EF: Rådets beslutning af 27. november 2000 om ændring af artikel
    3 i beslutning 98/198/EF om bemyndigelse til Det Forenede Kongerige til at forlænge
    en foranstaltning, der fraviger bestemmelserne i artikel 6 og 17 i sjette direktiv
    (77/388/EØF) om harmonisering af medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '2000/747/ΕΚ: Απόφαση του Συμβουλίου, της 27ης
    Νοεμβρίου 2000, για την τροποποίηση του άρθρου
    3 της απόφασης 98/198/ΕΚ με την οποία εξουσιοδοτείται
    το Ηνωμένο Βασίλειο να παρατείνει την εφαρμογή
    μέτρου κατά παρέκκλιση από τα άρθρα 6 και 17
    της έκτης οδηγίας (77/388/ΕΟΚ) σχετικά με το κοινό
    σύστημα φόρου προστιθεμένης αξίας'
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 27 päivänä marraskuuta 2000, luvan antamisesta
    Yhdistyneelle kuningaskunnalle jatkaa jäsenvaltioiden liikevaihtoverolainsäädännön
    yhdenmukaistamisesta annetun kuudennen direktiivin (77/388/ETY) 6 ja 17 artiklasta
    poikkeavan toimenpiteen soveltamisesta tehdyn päätöksen 98/198/EY 3 artiklan
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: '2000/747/CE: Decisione del Consiglio, del 27 novembre 2000, che modifica
    l''articolo 3 della decisione 98/198/CE che autorizza il Regno Unito a prorogare
    l''applicazione di una misura di deroga agli articoli 6 e 17 della sesta direttiva
    (77/388/CEE) relativa al sistema comune di imposta sul valore aggiunto'
  type: main
- language: nl
  script: Latn
  content: '2000/747/EG: Beschikking van de Raad van 27 november 2000 tot wijziging
    van artikel 3 van Beschikking 98/198/EG waarbij het Verenigd Koninkrijk wordt
    gemachtigd tot voortzetting van de toepassing van een maatregel die afwijkt van
    de artikelen 6 en 17 van Zesde Richtlijn 77/388/EEG betreffende de harmonisatie
    van de wetgevingen der lidstaten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '2000/747/CE: Decisão do Conselho, de 27 de Novembro de 2000, que altera
    o artigo 3.o da Decisão 98/198/CE que autoriza o Reino Unido a prorrogar a aplicação
    de uma medida derrogatória dos artigos 6.o e 17.o da Sexta Directiva (77/388/CEE)
    relativa ao sistema comum do imposto sobre o valor acrescentado'
  type: main
- language: es
  script: Latn
  content: '2000/747/CE: Decisión del Consejo, de 27 de noviembre de 2000, que modifica
    el artículo 3 de la Decisión 98/198/CE y autoriza al Reino Unido a prorrogar
    una medida de inaplicación a lo dispuesto en los artículos 6 y 17 de la Sexta
    Directiva (77/388/CEE) relativa al sistema común del impuesto sobre el valor
    añadido'
  type: main
- language: sv
