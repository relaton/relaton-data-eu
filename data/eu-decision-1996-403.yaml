title:
- language: en
  script: Latn
  content: '96/403/EC: Commission Decision of 21 June 1996 amending Decision 93/411/EEC
    authorizing Member States to provide for derogations from certain provisions of
    Council Directive 77/93/EEC in respect of plants of strawberry (Fragaria L.),
    intended for planting, other than seeds, originating in Argentina'
  type: main
- language: fr
  script: Latn
  content: '96/403/CE: Décision de la Commission du 21 juin 1996 modifiant la décision
    93/411/CEE autorisant les États membres à prévoir des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil pour les fraisiers (Fragaria
    L.) destinés à la plantation, à l''exception des semences, originaires d''Argentine'
  type: main
- language: de
  script: Latn
  content: '96/403/EG: Entscheidung der Kommission vom 21. Juni 1996 zur Änderung
    der Entscheidung 93/411/EWG zur Ermächtigung der Mitgliedstaaten, für Erdbeerpflanzen
    (Fragaria L.), zum Anpflanzen bestimmt, außer Samen, mit Ursprung in Argentinien,
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '96/403/EF: Kommissionens beslutning af 21. juni 1996 om ændring af beslutning
    93/411/EØF om bemyndigelse af medlemsstaterne til at indrømme undtagelser fra
    visse bestemmelser i Rådets direktiv 77/93/EØF, for jordbærplanter (Fragaria
    L.) til udplantning, dog ikke frø, med oprindelse i Argentina'
  type: main
- language: el
  script: Grek
  content: '96/403/ΕΚ: Απόφαση της Επιτροπής της 21ης Ιουνίου
    1996 για την τροποποίηση της απόφασης 93/411/ΕΟΚ
    που επιτρέπει στα κράτη μέλη να παρέχουν παρεκκλίσεις
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου σχετικά με τα φυτά χαμαικεράσου
    (Fragaria L.), που προορίζονται για φύτευση, με εξαίρεση
    τους σπόρους προς σπορά, καταγωγής Αργεντινής'
  type: main
- language: fi
  script: Latn
  content: '96/403/EY: Komission päätös, tehty 21 päivänä kesäkuuta 1996, luvan
    antamisesta jäsenvaltioille säätää poikkeuksia tiettyihin Argentiinasta peräisin
    olevia istutettaviksi tarkoitettuja mansikoita (Fragaria L.), siemeniä lukuun
    ottamatta, koskeviin neuvoston direktiivin 77/93/ETY säännöksiin tehdyn päätöksen
    93/411/ETY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/403/CE: Decisione della Commissione del 21 giugno 1996 recante modifica
    della decisione 93/411/CEE che autorizza gli Stati membri a prevedere deroghe
    a determinate disposizioni della direttiva 77/93/CEE del Consiglio riguardo alle
    piantine di fragole (Fragaria L.) destinate alla piantagione, tranne le sementi,
    originarie dell''Argentina'
  type: main
- language: nl
  script: Latn
  content: '96/403/EG: Beschikking van de Commissie van 21 juni 1996 houdende wijziging
    van Beschikking 93/411/EEG tot machtiging van de Lid-Staten om voor aardbeiplanten
    (Fragaria L.), bestemd voor opplant, met uitzondering van zaden, uit Argentinië
    afwijking van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '96/403/CE: Decisão da Comissão de 21 de Junho de 1996 que altera a Decisão
    93/411/CEE que autoriza os Estados- membros a prever derrogações a certas normas
    da Directiva 77/93/CEE do Conselho relativamente às plantas de Fragaria L., destinadas
    à plantação, com excepção das sementes, originárias da Argentina'
  type: main
- language: es
  script: Latn
  content: '96/403/CE: Decisión de la Comisión de 21 de junio de 1996 que modifica
    la Decisión 93/411/CEE por la que se autoriza a los Estados miembros para establecer
    excepciones a algunas disposiciones de la Directiva 77/93/CEE del Consejo en relación
    con las fresas (Fragaria L.) originarias de Argentina y destinadas a ser plantadas,
    con excepción de las semillas'
  type: main
- language: sv
  script: Latn
  content: '96/403/EG: Kommissionens beslut av den 21 juni 1996 om ändring av beslut
    93/411/EEG om bemyndigande av medlemsstaterna att tillåta undantag från vissa
    bestämmelser i rådets direktiv 77/93/EEG avseende jordgubbs- och smultronplantor
    (Fragaria L.) för plantering, dock inte fröer, med ursprung i Argentina'
