    no que diz respeito às normas técnicas de regulamentação para efeitos dos
    critérios qualitativos e quantitativos adequados para identificar as categorias
    de pessoal cujas atividades profissionais têm um impacto significativo no perfil
    de risco da instituição
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 604/2014 al Comisiei din 4 martie 2014 de
    completare a Directivei 2013/36/UE a Parlamentului European și a Consiliului
    în ceea ce privește standardele tehnice de reglementare referitoare la criteriile
    calitative și cantitative corespunzătoare pentru identificarea categoriilor
    de personal ale căror activități profesionale au un impact semnificativ asupra
    profilului de risc al unei instituții
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 604/2014 zo 4. marca 2014 , ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2013/36/EÚ, pokiaľ ide o
    regulačné technické predpisy so zreteľom na kvalitatívne a vhodné kvantitatívne
    kritériá na vymedzenie kategórií pracovníkov, ktorých profesionálne činnosti
    majú významný vplyv na rizikový profil inštitúcie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) št. 604/2014 z dne 4. marca 2014 o dopolnitvi
    Direktive 2013/36/EU Evropskega parlamenta in Sveta glede regulativnih tehničnih
    standardov v zvezi s kvalitativnimi in ustreznimi kvantitativnimi merili za opredelitev
    kategorij zaposlenih, katerih poklicne dejavnosti pomembno vplivajo na profil
