    en passende kwantitatieve criteria tot vaststelling van de categorieën van medewerkers
    wier beroepswerkzaamheden het risicoprofiel van een instelling materieel beïnvloeden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 604/2014 z dnia 4 marca 2014
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2013/36/UE w odniesieniu
    do regulacyjnych standardów technicznych w odniesieniu do kryteriów jakościowych
    i właściwych kryteriów ilościowych ustalania kategorii pracowników, których
    działalność zawodowa ma istotny wpływ na profil ryzyka instytucji
  type: main
- language: pt
  script: Latn
  content: Regulamento delegado (UE) n. ° 604/2014 da Comissão, de 4 de março de
