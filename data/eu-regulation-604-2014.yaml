    valamely intézmény kockázati profiljára jelentős hatást gyakorló munkavállalók
    kategorizálásának minőségi és megfelelő mennyiségi kritériumaira irányuló
    szabályozási technikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 604/2014 della Commissione, del 4 marzo 2014
    , che integra la direttiva 2013/36/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione relative ai criteri qualitativi
    e quantitativi adeguati per identificare le categorie di personale le cui attività
    professionali hanno un impatto sostanziale sul profilo di rischio dell'ente
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) Nr. 604/2014 ( 2014. gada 4. marts ),
