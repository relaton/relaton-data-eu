title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 604/2014 of 4 March 2014 supplementing
    Directive 2013/36/EU of the European Parliament and of the Council with regard
    to regulatory technical standards with respect to qualitative and appropriate
    quantitative criteria to identify categories of staff whose professional activities
    have a material impact on an institution's risk profile
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 604/2014 de la Commission du 4 mars 2014
    complétant la directive 2013/36/UE du Parlement européen et du Conseil par des
    normes techniques de réglementation en ce qui concerne les critères qualitatifs
    et quantitatifs appropriés permettant de recenser les catégories de personnel
    dont les activités professionnelles ont une incidence significative sur le profil
    de risque d'un établissement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 604/2014 der Kommission vom 4. März 2014
    zur Ergänzung der Richtlinie 2013/36/EU des Europäischen Parlaments und des
    Rates im Hinblick auf technische Regulierungsstandards in Bezug auf qualitative
    und angemessene quantitative Kriterien zur Ermittlung der Mitarbeiterkategorien,
    deren berufliche Tätigkeit sich wesentlich auf das Risikoprofil eines Instituts
    auswirkt
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) № 604/2014 на Комисията
    от 4 март 2014 година за допълване на Директива
    2013/36/ЕС на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    във връзка с качествените и подходящите количествени
    критерии за установяване на категориите персонал,
    чиито професионални дейности имат съществено
    въздействие върху рисковия профил на институцията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 604/2014 ze dne 4.
    března 2014 , kterým se doplňuje směrnice Evropského parlamentu a Rady 2013/36/EU,
    pokud jde o regulační technické normy týkající se kvalitativních a vhodných
    kvantitativních kritérií k určení kategorií zaměstnanců, jejichž pracovní
    činnosti mají podstatný vliv na rizikový profil instituce
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) nr. 604/2014 af 4. marts 2014
    om supplerende regler til Europa-Parlamentets og Rådets direktiv 2013/36/EU for
    så vidt angår reguleringsmæssige tekniske standarder for kvalitative og passende
    kvantitative kriterier til identifikation af de medarbejderkategorier, hvis arbejde
    har væsentlig indflydelse på institutters risikoprofil
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) αριθ.
