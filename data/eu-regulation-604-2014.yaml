    kwalitattivi u kwantitattivi xierqa biex jiġu identifikati l-kategoriji ta' persunal
    li l-attivitajiet professjonali tagħhom għandhom impatt materjali fuq il-profil
    tar-riskju tal-istituzzjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) nr. 604/2014 van de Commissie van 4 maart
