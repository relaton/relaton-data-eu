  script: Latn
  content: Commission Regulation (EU) 2022/2002 of 21 October 2022 amending Regulation
    (EC) No 1881/2006 as regards maximum levels of dioxins and dioxin-like PCBs in
    certain foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/2002 de la Commission du 21 octobre 2022 modifiant
