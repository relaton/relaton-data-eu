  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2022/2002 van de Commissie van 21 oktober 2022 tot wijziging
    van Verordening (EG) nr. 1881/2006 wat de maximumgehalten aan dioxinen en dioxineachtige
