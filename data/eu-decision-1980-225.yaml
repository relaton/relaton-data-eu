id: EUDecision1980225
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/225/EEC: Commission Decision of 29 January 1980 authorizing the Italian
    Republic not to apply Community treatment to woven fabrics of raw silk (not thrown),
    falling within heading No ex 50.09 of the Common Customs Tariff, originating in
    the People''s Republic of China and in free circulation in the other Member States
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/225/CEE: Décision de la Commission, du 29 janvier 1980, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    soie grège de la position ex 50.09 du tarif douanier commun, originaires de la
    République populaire de Chine et mis en libre pratique dans les autres États
    membres (Le texte en langue italienne est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/225/EWG: Entscheidung der Kommission vom 29. Januar 1980, mit der die
    Italienische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Seide
    (Grège) der Tarifnummer ex 50.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/225/EØF: Kommissionens beslutning af 29. januar 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage vævet stof
    af natursilke (herunder schappesilke og bourettesilke), som henhører under pos.
    ex 50.09 i den fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik
    og frit kan omsættes i de øvrige medlemsstater (Kun den italienske udgave er
    autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/225/CEE: Decisione della Commissione, del 29 gennaio 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i tessuti di seta
    greggi della voce 50.09 della tariffa doganale comune, originari della Repubblica
    popolare cinese e messi in libera pratica negli altri Stati membri (Il testo in
    lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/225/EEG: Beschikking van de Commissie van 29 januari 1980 waarbij de
    Italiaanse Republiek wordt gemachtigd weefsels van ruwe zijde (haspelzijde of
    grège) van post ex 50.09 van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Italiaanse
    taal is authentiek)'
  type: main
