title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 149/97 of 27 January 1997 determining the
    percentages of quantities which may be allowed in respect of import licence applications
    lodged in January 1997 under tariff quotas for meat provided for in Regulation
    (EC) No 2512/96 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 149/97 DE LA COMMISSION du 27 janvier 1997 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 1997 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 2512/96 pour la république de Pologne, la
    république de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 149/97 DER KOMMISSION vom 27. Januar 1997 zur Bestimmung
    des Prozentsatzes, zu dem den im Januar 1997 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Fleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß Verordnung (EG)
    Nr. 2512/96 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 149/97 af 27. januar 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i januar 1997 om
    importlicenser for kød i forbindelse med de toldkontingenter for oksekød, der
    i forordning (EF) nr. 2512/96 er fastsat for Republikken Polen, Republikken Ungarn,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 149/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιανουαρίου 1997 για τον καθορισμό σε
    ποιό βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιανουάριο 1997 για τις συμπληρωματικές δασμολογικές
    ποσοστώσεις βοείου κρέατος που προβλέπονται
    από τον κανονισμό (ΕΚ) αριθ. 2512/96 για την Πολωνία,
    τη Δημοκρατία της Ουγγαρίας, την Τσεχική Δημοκρατία,
    τη Σλοβακία, τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 149/97, annettu 27 päivänä tammikuuta 1997,
    asetuksessa (EY) N:o 2512/96 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    tammikuussa 1997 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 149/97 DELLA COMMISSIONE del 27 gennaio 1997 che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel gennaio 1997 per i contingenti tariffari supplementari di carni bovine previsti
    dal regolamento (CE) n. 2512/96 per la Repubblica di Polonia, la Repubblica di
    Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 149/97 VAN DE COMMISSIE van 27 januari 1997 tot vaststelling
