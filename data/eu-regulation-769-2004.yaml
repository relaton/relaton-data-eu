---
id: EURegulation7692004
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 769/2004 of 21 April 2004 amending Regulations
    (EEC) No 3906/89, (EC) No 555/2000, (EC) No 2500/2001, (EC) No 1268/1999 and (EC)
    No 1267/1999 in order to allow the Stabilisation and Association Process countries
    to participate in tenders organised under the pre-accession Community assistance
    programmes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 769/2004 du Conseil du 21 avril 2004 portant modification
    des règlements (CEE) n° 3906/89, (CE) n° 555/2000, (CE) n° 2500/2001, (CE)
    n° 1268/1999 et (CE) n° 1267/1999, afin de permettre aux pays participant au
    processus de stabilisation et d'associationde prendre part aux appels d'offres
    organisés dans le cadre des programmes communautaires d'aide en faveur de la
    préadhésion
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 769/2004 des Rates vom 21. April 2004 zur Änderung
    der Verordnungen (EWG) Nr. 3906/89, (EG) Nr. 555/2000, (EG) Nr. 2500/2001, (EG)
    Nr. 1268/1999 und (EG) Nr. 1267/1999 dahin gehend, es den am Stabilisierungs-
    und Assoziierungsprozess beteiligten Ländern zu ermöglichen, an Ausschreibungen
    im Rahmen der Heranführungsprogramme der Gemeinschaft teilzunehmen
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 769/2004 ze dne 21. dubna 2004, kterým se mění
    nařízení (EHS) č. 3906/89, (ES) č. 555/2000, (ES) č. 2500/2001, (ES) č.
    1268/1999 a (ES) č. 1267/1999 s cílem umožnit zemím zapojeným do procesu
    stabilizace a přidružení účastnit se nabídkových řízení organizovaných
    v rámci předvstupních programů pomoci Společenství
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 769/2004 af 21. april 2004 om ændring af forordning
    (EØF) nr. 3906/89, (EF) nr. 555/2000, (EF) nr. 2500/2001, (EF) nr. 1268/1999
    og (EF) nr. 1267/1999, således at de lande, der er omfattet af stabiliserings-
    og associeringsprocessen, kan deltage i udbud, som iværksættes som led i EF-programmerne
    for førtiltrædelsesstøtte
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 769/2004 του Συμβουλίου,
    της 21ης Απριλίου 2004, για τροποποίηση των κανονισμών
    (ΕΟΚ) αριθ. 3906/89, (ΕΚ) αριθ. 555/2000, (ΕΚ) αριθ. 2500/2001,
    (ΕΚ) αριθ. 1268/1999 και (ΕΚ) αριθ. 1267/1999, ώστε να δοθεί
    η δυνατότητα στις χώρες της διαδικασίας σταθεροποίησης
    και σύνδεσης να συμμετέχουν σε προσκλήσεις
    υποβολής προσφορών που διοργανώνονται στο
    πλαίσιο των κοινοτικών προγραμμάτων προενταξιακής
    βοήθειας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 769/2004, 21. aprill 2004, millega muudetakse
    määruseid (EMÜ) nr 3906/89, (EÜ) nr 555/2000, (EÜ) nr 2500/2001, (EÜ) 1268/1999
    ja (EÜ) nr 1267/1999, et võimaldada stabilisatsiooni- ja assotsiatsiooniprotsessi
    riikidel osaleda ühinemiseelsete ühenduse abiprogrammide raames korraldatud
    pakkumismenetlustes
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 769/2004, annettu 21 päivänä huhtikuuta 2004,
    asetusten (ETY) N:o 3906/89, (EY) N:o 555/2000, (EY) N:o 2500/2001, (EY) N:o 1268/1999
    ja (EY) N:o 1267/1999 muuttamisesta, jotta vakautus- ja assosiaatioprosessiin
    kuuluvat maat voisivat osallistua liittymistä valmistelevista yhteisön ohjelmistarahoitettaviin
    tarjouskilpailuihin
  type: main
- language: hu
  script: Latn
  content: A Tanács 769/2004/EK rendelete (2004. április 21.) a stabilizációs
    és társulási folyamatban részt vevő országok előcsatlakozási közösségi
    támogatási programok keretében szervezett pályázatokon való részvételének
    lehetővé tétele érdekében a 3906/89/EGK, az 555/2000/EK, a 2500/2001/EK,
    az 1268/1999/EK és az 1267/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 769/2004 del Consiglio, del 21 aprile 2004, che modifica
    i regolamenti (CEE) n. 3906/89, (CE) n. 555/2000, (CE) n. 2500/2001, (CE) n. 1268/1999
    e (CE) n. 1267/1999 per consentire ai paesi oggetto del processo di stabilizzazione
    e di associazione di partecipare alle gare di appalto organizzate nel quadro dei
    programmi comunitari di assistenza in vista dell'adesione
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 769/2004 (2004. gads 21. aprīlis), ar ko groza
    Regulas (EEK) Nr. 3906/89, (EK) Nr. 555/2000, (EK) Nr. 2500/2001, (EK) Nr. 1268/1999
    un (EK) Nr. 1267/1999, lai ļautu stabilizācijas un asociācijas procesa valstīm
    piedalīties konkursos, kuri rīkoti saskaņā ar pirmspievienošanās Kopienas
    palīdzības programmām
  type: main
- language: lt
  script: Latn
  content: 2004 m. balandžio 21 d. Tarybos reglamentas (EB) Nr. 769/2004, iš dalies
    keičiantis Reglamentus (EEB) Nr. 3906/89, (EB) Nr. 555/2000, (EB) Nr. 2500/2001,
    (EB) Nr. 1268/1999 ir (EB) Nr. 1267/1999, kad Stabilizavimo ir vienijimo proceso
    šalys galėtų dalyvauti konkursuose, rengiamuose pagal Bendrijos pasirengimo
    stojimui paramos programas
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 769/2004 tal-21 ta' April 2004 li jemenda
    r-Regolamenti (KEE) Nru 3906/89, (KE) Nru 555/2000, (KE) Nru 2500/2001, (KE) Nru
    1268/1999 u (KE) Nru 1267/1999 biex iħalli l-pajjiżi tal-Proċess ta' Stabilizzazzjoni
    u Assoċjazzjoni jipparteċipaw f'offerti għal xogħol bl-appalt, organizzati
    taħt il-programmi ta' assistenza tal-Komunità, ta' qabel l-adeżjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 769/2004 van de Raad van 21 april 2004 tot wĳziging
    van de Verordeningen (EEG) nr. 3906/89, (EG) nr. 555/2000, (EG) nr. 2500/2001,
    (EG) nr. 1268/1999 en (EG) nr. 1267/1999 om de landen van het stabilisatie- en
    associatieproces de mogelĳkheid te geven om deel te nemen aan aanbestedingen
    in het kader van de pretoetredingsprogramma's voor steun van de Gemeenschap
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 769/2004 z dnia 21 kwietnia 2004 r. zmieniające
    rozporządzenia (EWG) nr 3906/89, (WE) nr 555/2000, (WE) nr 2500/2001, (WE) nr
    1268/1999 i (WE) nr 1267/1999 w celu umożliwienia krajom uczestniczącym w procesie
    stabilizacji i stowarzyszenia wzięcia udziału w przetargach organizowanych w
    ramach wspólnotowych przedakcesyjnych programów pomocy
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 769/2004 do Conselho, de 21 de Abril de 2004, que
    altera os Regulamentos (CEE) n.° 3906/89, (CE) n.° 555/2000, (CE) n.° 2500/2001,
    (CE) n.° 1268/1999 e (CE) n.° 1267/1999 a fim de permitir que os países parte
    no processo de estabilização e de associação participem em concursos organizados
    no âmbito de programas comunitários de assistência de pré-adesão
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 769/2004 z 21. apríla 2004, ktorým sa menia
    a dopĺňajú nariadenia (EHS) č. 3906/89, (ES) č. 555/2000, (ES) č. 2500/2001,
    (ES) č. 1268/1999 a (ES) č. 1267/1999, aby sa umožnilo krajinám, zapojeným
    do procesu stabilizácie a pridružovania, zúčastniť sa na výberových konaniach,
    organizovaných v rámci predvstupových programov pomoci Spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 769/2004 z dne 21. aprila 2004 o spremembi uredb
    (EGS) št. 3906/89, (ES) št. 555/2000, (ES) št. 2500/2001, (ES) št. 1268/1999
    in (ES) št. 1267/1999, zato da se državam, sodelujočim v stabilizacijskem in
    pridružitvenem procesu, omogoči sodelovanje v razpisih po programih predpristopne
    pomoči Skupnosti
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 769/2004 del Consejo, de 21 de abril de 2004, por el
    que se modifican los Reglamentos del Consejo (CEE) n° 3906/89, (CE) n° 555/2000,
    (CE) n° 2500/2001, (CE) n° 1268/1999 y (CE) n° 1267/1999 con el fin de que
    los países del proceso de estabilización y asociación puedan participar en
    las licitaciones organizadas dentro de los programas de ayuda comunitarios de
    preadhesión
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 769/2004 av den 21 april 2004 om ändring av
    förordningarna (EEG) nr 3906/89, (EG) nr 555/2000, (EG) nr 2500/2001, (EG) nr
    1268/1999 och (EG) nr 1267/1999 i syfte att göra det möjligt för de länder
    som omfattas av stabiliserings- och associeringsprocessen att delta i anbudsinfordringar
    som anordnas inom ramen för gemenskapens program för stöd inför anslutningen
  type: main
