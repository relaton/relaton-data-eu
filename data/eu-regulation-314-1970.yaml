title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 314/70 de la Commission, du 20 février 1970, modifiant
    le règlement (CEE) n° 842/69 en ce qui concerne le prix de vente de certains
    produits dans le secteur de la viande bovine et abrogeant certaines dispositions
    du règlement (CEE) n° 1666/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 314/70 der Kommission vom 20. Februar 1970 zur Änderung
    der Verordnung (EWG) Nr. 842/69 hinsichtlich des Verkaufspreises bestimmter Erzeugnisse
    des Rindfleischsektors und zur Aufhebung bestimmter Vorschriften der Verordnung
    (EWG) Nr. 1666/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 314/70 della Commissione, del 20 febbraio 1970, che
    modifica il regolamento (CEE) n. 842/69 per quanto riguarda il prezzo di vendita
    di taluni prodotti nel settore delle carni bovine e che abroga alcune disposizioni
    del regolamento (CEE) n. 1666/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 314/70 van de Commissie van 20 februari 1970 houdende
    wijziging van Verordening (EEG) nr. 842/69 betreffende de verkoopprijs van bepaalde
    produkten in de sector rundvlees en houdende intrekking van enkele bepalingen
    van Verordening (EEG) nr. 1666/69
  type: main
