  content: Commission Regulation (EEC) No 1999/87 of 7 July 1987 derogating from Regulation
    (EEC) No 2729/81 as regards the issue of export licences with advance fixing of
    refunds in respect of milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1999/87 de la Commission du 7 juillet 1987 portant
    dérogation au règlement (CEE) n° 2729/81 en ce qui concerne la délivrance
    des certificats d'exportation comportant fixation à l'avance de la restitution
    dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1999/87 DER KOMMISSION vom 7. Juli 1987 zur Abweichung
