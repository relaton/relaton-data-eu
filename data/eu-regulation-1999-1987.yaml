    (ΕΟΚ) αριθ. 2729/81 όσον αφορά την έκδοση των πιστοποιητικών
    εξαγωγής που περιλαμβάνουν προκαθορισμό της
    επιστροφής στον τομέα του γάλακτος και των
    γαλακτοκομικών προϊόντων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1999/87 DELLA COMMISSIONE del 7 luglio 1987 recante
    deroga al regolamento (CEE) n. 2729/81 relativamente al rilascio dei titoli di
    esportazione che comportano la fissazione anticipata della restituzione nel settore
    del latte e dei prodotti lattiero-caseari #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1999/87 VAN DE COMMISSIE van 7 juli 1987 houdende
    afwijking van Verordening (EEG) nr. 2729/81 ten aanzien van de afgifte van uitvoercertificaten
    met vaststelling vooraf van de restitutie in de sector melk en zuivelprodukten
    #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1999/87 da Comissão de 7 de Julho de 1987 que derroga
