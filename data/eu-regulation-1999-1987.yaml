    de exportação com fixação prévia da restituição no sector do leite e dos
    produtos lácteos
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1999/87 DE LA COMISIÓN de 7 de julio de 1987 por
