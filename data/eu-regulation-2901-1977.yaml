  content: Commission Regulation (EEC) No 2901/77 of 22 December 1977 amending Regulations
    (EEC) No 585/77 and (EEC) No 597/77 especially as regards the total suspension
    of the levy in the framework of the special import system for frozen beef and
    veal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2901/77 de la Commission, du 22 décembre 1977, modifiant
    les règlements (CEE) n° 585/77 et (CEE) n° 597/77, notamment en ce qui concerne
    la suspension totale du prélèvement dans le cadre du régime spécial d' importation
    de viande bovine congelée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2901/77 der Kommission vom 22. Dezember 1977 zur Änderung
    der Verordnungen (EWG) Nr. 585/77 und (EWG) Nr. 597/77, insbesondere hinsichtlich
    der totalen Aussetzung der Abschöpfung im Rahmen der besonderen Einfuhrregelung
    für gefrorenes Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2901/77 af 22. december 1977 om ændring
    af forordningerne (EØF) nr. 585/77 og (EØF) nr. 597/77, især med henblik på
    fuld suspension af importafgiften inden for rammen af den særlige ordning om
    indførsel af frosset oksekød
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2901/77 della Commissione, del 22 dicembre 1977, che
