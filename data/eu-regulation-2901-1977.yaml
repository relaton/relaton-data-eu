    quanto concerne la sospensione totale del prelievo nel quadro del regime speciale
    d' importazione di carni bovine congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2901/77 van de Commissie van 22 december 1977 houdende
