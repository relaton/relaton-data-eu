title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 52/77 of 12 January 1977 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Algeria, Morocco and Tunisia is to be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 52/77 de la Commission, du 12 janvier 1977, fixant le
    montant dont doit être diminué l'élément mobile du prélèvement applicable
    aux sons et remoulages originaires d'Algérie, du Maroc et de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 52/77 der Kommission vom 12. Januar 1977 zur Festsetzung
    des Betrages, um den der bewegliche Teilbetrag der Abschöpfung auf Kleie mit
    Ursprung in Algerien, Marokko und Tunesien vermindert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 52/77 af 12. januar 1977 om fastsættelse
    af det beløb, hvormed det variable element i importafgiften for kild med oprindelse
    i Algeriet, Marokko og Tunesien skal nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 52/77 della Commissione, del 12 gennaio 1977, che
    fissa l'importo di cui deve essere diminuito l'elemento mobile del prelievo applicabile
    alle crusche e stacciature originarie dell'Algeria, del Marocco e della Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 52/77 van de Commissie van 12 januari 1977 tot vaststelling
    van het bedrag waarmee het variabele element moet worden verminderd van de heffing
    die van toepassing is op zemelen en slijpsel van oorsprong uit Algerije, Marokko
    en Tunesië
