title:
- language: en
  script: Latn
  content: Decision 2004/429/EC of 29 April 2004 amending Decisions 97/830/EC, 2000/49/EC,
    2002/79/EC and 2002/80/EC as regards the points of entry through which the products
    concerned may only be imported into the Community
  type: main
- language: fr
  script: Latn
  content: Décision 2004/429/CE de la Commission du 29 avril 2004 modifiant les décisions
    97/830/CE, 2000/49/CE, 2002/79/CE et 2002/80/CE en ce qui concerne les points
    d’entrée obligés pour l’importation des produits concernés dans la Communauté
    européenne
  type: main
- language: de
  script: Latn
  content: Entscheidung 2004/429/EG der Kommission vom 29. April 2004 zur Änderung
    der Entscheidungen 97/830/EG, 2000/49/EG, 2002/79/EG und 2002/80/EG hinsichtlich
    der Eingangszollstellen, über die die betroffenen Erzeugnisse in die Gemeinschaft
    eingeführt werden dürfen
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. dubna 2004, kterým se mění rozhodnutí
    97/830/ES, 2000/49/ES, 2002/79/ES a 2002/80/ES, pokud jde o vstupní místa, přes
    která mohou být dotčené výrobky dováženy do Společenství (oznámeno pod
    číslem K(2004) 1594)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning 2004/429/EF af 29. april 2004 om ændring af beslutning
    97/830/EF, 2000/49/EF, 2002/79/EF og 2002/80/EF for så vidt angår de indgangssteder,
    hvorigennem de pågældende produkter kan importeres til Fællesskabet
  type: main
- language: el
  script: Grek
  content: Aπόφαση 2004/429/ΕΚ της Επιτροπής, της 29ης Απριλίου
    2004, για την τροποποίηση των αποφάσεων 97/830/EΚ,
    2000/49/EΚ, 2002/79/EΚ και 2002/80/EΚ όσον αφορά τα μοναδικά
    σημεία εισόδου μέσω των οποίων τα εν λόγω προϊόντα
    μπορούν να εισάγονται στην Ευρωπαϊκή Κοινότητα
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. aprill 2004, millega muudetakse otsuseid 97/830/EÜ,
    2000/49/EÜ, 2002/79/EÜ ja 2002/80/EÜ seoses piiriületuskohtadega, üksnes
    mille kaudu võib asjaomaseid tooteid ühendusse importida (teatavaks tehtud numbri
    K(2004) 1594 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös 2004/429/EY, tehty 29 päivänä huhtikuuta 2004, päätösten
    97/830/EY, 2000/49/EY, 2002/79/EY ja 2002/80/EY muuttamisesta niiden maahantulopaikkojen
    osalta, joiden kautta päätöksissä tarkoitettuja tuotteita saa tuoda Euroopan
    yhteisöön
  type: main
- language: hu
  script: Latn
  content: A Bizottság 429/2004/EK határozata (2004. április 29.) a 97/830/EK,
    2000/49/EK, 2002/79/EK és a 2002/80/EK határozatok módosításáról tekintettel
    a belépési pontokra, amelyeken keresztül az érintett termékek az Európai
    Közösségbe behozhatók (az értesítés a C (2004) 1594. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione 2004/429/CE della Commissione, del 29 aprile 2004, che modifica
    le decisioni 97/830/CE, 2000/49/CE, 2002/79/CE e 2002/80/CE per quanto concerne
    i punti di entrata attraverso i quali i prodotti in questione possono essere importati
    nella Comunità
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2004. gada 29. aprīlis), ar ko groza Lēmumus 97/830/EK,
    2000/49/EK, 2002/79/EK un 2002/80/EK attiecībā uz ievešanas punktiem, caur
    kuriem attiecīgos produktus drīkst ievest Kopienā (izziņots ar dokumenta numuru
    C(2004) 1594)
  type: main
- language: lt
  script: Latn
  content: 2004 m. balandžio 29 d. Komisijos sprendimas, iš dalies keičiantis Sprendimus
    97/830/EB, 2000/49/EB, 2002/79/EB ir 2002/80/EB dėl įvažiavimo punktų, per
    kuriuos aptariami produktai gali būti tiktai importuojami į Bendriją (pranešta
    dokumentu Nr. C (2004)1594)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta' April 2004 li temenda d-Deċiżjonijiet
    97/830/KE, 2000/49/KE, 2002/79/KE u 2002/80/KE fir-rigward tal-punti tad-dħul
    li minnhom il-prodotti konċernati jistgħu jiġu biss importati fil-Komunità
    (innotifikata fid-dokument bin-numru C(2004) 1594)
  type: main
- language: nl
  script: Latn
  content: Beschikking 2004/429/EG van de Commissie van 29 april 2004 tot wijziging
    van de Beschikkingen 97/830/EG, 2000/49/EG, 2002/79/EG en 2002/80/EG ten aanzien
    van de punten van binnenkomst waarlangs de betreffende producten in de Gemeenschap
    mogen worden ingevoerd
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 kwietnia 2004 r. zmieniająca decyzje 97/830/WE,
    2000/49/WE, 2002/79/WE i 2002/80/WE w odniesieniu do jedynych miejsc wprowadzania
    do Wspólnoty produktów, których dotyczą te decyzje (notyfikowana jako dokument
    nr C(2004) 1594)
  type: main
- language: pt
  script: Latn
  content: Decisão 2004/429/CE da Comissão, de 29 de Abril de 2004, que altera as
    Decisões 97/830/CE, 2000/49/CE, 2002/79/CE e 2002/80/CE no que respeita aos pontos
    de entrada através dos quais podem ser importados para a Comunidade Europeia
    os produtos em causa
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. apríla 2004, ktorým sa menia a dopĺňajú
    rozhodnutia 97/830/ES, 2000/49/ES 2002/79/ES a 2002/80/ES, o vstupných miestach
    do spoločenstva, výhradne cez ktoré sa môžu dovážať dotknuté produkty
    [oznámené pod číslom dokumentu C(2004) 1594]
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. aprila 2004 o spremembah odločb 97/830/ES,
    2000/49/ES, 2002/79/ES in 2002/80/ES glede vstopnih mejnih prehodov, čez katere
    se lahko uvažajo zadevni proizvodi v Skupnost (notificirano pod dokumentno številko
    K (2004) 1594)
  type: main
- language: es
  script: Latn
  content: Decisión 2004/429/CE de la Comisión, de 29 de abril de 2004, por la que
    se modifican las Decisiones 97/830, 2000/49/CE, 2002/79/CE y 2002/80/CE en lo
    referente a los puntos exclusivos de entrada en la Comunidad Europea de las importaciones
    de los productos a los que se refieren dichas Decisiones
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut 2004/429/EG av den 29 april 2004 om ändring av beslut
    97/830/EG, 2000/49/EG, 2002/79/EG och 2002/80/EG om de införselplatser genom
    vilka de berörda produkterna endast får importeras till gemenskapen
  type: main
