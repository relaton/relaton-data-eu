title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3449/73 of the Commission of 21 December 1973 extending
    the provision under which import and export licences, advance fixing certificates,
    and applications for and extracts from such licences and certificates, may be
    drawn up on the forms in use before accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3449/73 de la Commission, du 21 décembre 1973, prorogeant
    la possibilité d'établir les certificats d'importation, d'exportation et de
    préfixation ainsi que les demandes et extraits de ces certificats selon les spécimens
    valables avant l'adhésion
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3449/73 der Kommission vom 21. Dezember 1973 zur Verlängerung
    der Möglichkeit, Einfuhr- und Ausfuhrlizenzen, Vorausfestsetzungsbescheinigungen
    sowie Lizenzanträge und Teillizenzen nach den vor dem Eintritt geltenden Mustern
    zu erteilen bzw. abzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3449/73 af 21. december 1973 om forlængelse
    af muligheden for udstedelse af import- og eksportlicenser samt forudfastsættelsesattester
    såvel som begæringer og partialliancer med anvendelse af de blanketter, der
    var gyldige inden tiltrædelsen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3449/73 della Commissione, del 21 dicembre 1973, che
    proroga la possibilità di compilare i titoli d'importazione e di esportazione
    e i certificati di fissazione anticipata, nonché le domande e gli estratti degli
    stessi, secondo gli esemplari validi prima dell'adesione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3449/73 van de Commissie van 21 december 1973 tot
    verlenging van de mogelijkheid om invoer-, uitvoer en voorfixatiecertificaten,
    alsmede aanvragen en uittreksels van deze certificaten op te stellen volgens de
    modellen die voor de toetreding geldig waren
  type: main
