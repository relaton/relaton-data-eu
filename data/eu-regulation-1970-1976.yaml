title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1970/76 of 6 August 1976 re-establishing
    the levying of customs duties on citric acid, falling within subheading 29.16
    A IV a), originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1970/76 de la Commission, du 6 août 1976, portant
    rétablissement de la perception des droits de douane applicables à l'acide citrique,
    de la sous- position tarifaire 29.16 A IV a), originaire du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1970/76 der Kommission vom 6. August 1976 zur Wiedereinführung
    des Zollsatzes für Zitronensäure der Tarifstelle 29.16 A IV a), mit Ursprung
    in Mexiko, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November
    1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1970/76 af 6. august 1976 om genindførelse
    af opkrævning af toldafgifter for citronsyre, under underposition 29.16 A IV
    a), som har oprindelse i Mexico og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1970/76 della Commissione, del 6 agosto 1976, che
    ripristina la riscossione dei dazi doganali applicabili all'acido citrico, della
    sottovoce doganale n. 29.16 A IV a) originario del Messico, beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1970/76 van de Commissie van 6 augustus 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op citroenzuur,
    van onderverdeling 29.16 A IV a), van oorsprong uit Mexico, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
