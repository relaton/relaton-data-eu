title:
- language: en
  script: Latn
  content: Regulation (EEC) No 634/75 of the Commission of 12 March 1975 re-establishing
    the levying of the customs duties on glass inners for vacuum flasks or for other
    vacuum vessels, falling within heading No 70.12, originating in Yugoslavia, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 634/75 de la Commission, du 12 mars 1975, portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants, de la position tarifaire 70.12, originaires
    de la Yougoslavie bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 634/75 der Kommission vom 12. März 1975 zur Wiedereinführung
    des Zollsatzes für Glaskolben für Isolierbehälter der Tarifnummer 70.12 mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates
    vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 634/75 af 12. marts 1975 om genindførelse
    af opkrævning af toldafgifter for glaskolber til termoflasker og lignende isotermiske
    beholdere under position 70.12, som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3054/74 af
    2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 634/75 della Commissione, del 12 marzo 1975, che ripristina
    la riscossione dei dazi doganali applicabili alle ampolle di vetro per recipienti
    isolanti della voce doganale n. 70.12, originari della Iugoslavia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 305/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 634/75 van de Commissie van 12 maart 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op binnenflessen
    voor thermisch isolerende flessen en voor andere soortgelijke isolerende bergingsmiddelen
    van post 70.12, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
