title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 610/95 of 20 March 1995 amending Regulations
    (EEC) No 2735/90, (EEC) No 2736/90 and (EEC) No 2737/90 imposing a definitive
    anti-dumping duty on imports of tungsten ores and concentrates, tungstic oxide,
    tungstic acid, tungsten carbide and fused tungsten carbide originating in the
    People's Republic of China, and definitively collecting the amounts secured by
    way of the provisional anti-dumping duty imposed by Commission Regulation (EC)
    No 2286/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 610/95 du Conseil, du 20 mars 1995, modifiant les règlements
    (CEE) n° 2735/90, (CEE) n 2736/90 et (CEE) n° 2737/90 instituant un droit antidumping
    définitif sur les importations de minerais de tungstène et de leurs concentrés,
    d'oxyde tungstique et d'acide tungstique, de carbure de tungstène et de carbure
    de tungstène fondu originaires de la République populaire de Chine, et portant
    perception définitive des montants déposés au titre du droit antidumping provisoire
    institué par le règlement (CE) n° 2286/94 de la Commission
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 610/95 des Rates vom 20. März 1995 zur Änderung der
    Verordnungen (EWG) Nr. 2735/90, (EWG) Nr. 2736/90 und (EWG) Nr. 2737/90 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Wolframerzen und ihren
    Konzentraten, Wolframoxid und Wolframsäure, Wolframcarbid und Mischwolframcarbid
    mit Ursprung in der Volksrepublik China und zur endgültigen Vereinnahmung der
    Sicherheitsleistungen für den vorläufigen Antidumpingzoll aufgrund der Verordnung
    (EG) Nr. 2286/94 der Kommission
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 610/95 af 20. marts 1995 om ændring af forordning
    (EØF) nr. 2735/90, (EØF) nr. 2736/90 og (EØF) nr. 2737/90 om indførelse af
    en endelig antidumpingtold på importen af wolframmalm og koncentrater deraf,
    wolframoxid og wolframsyre, wolframcarbid og sammensmeltet wolframcarbid med oprindelse
    i Den Kinesiske Folkerepublik og om endelig opkrævning af de beløb, for hvilke
    der er stillet sikkerhed i form af den midlertidige antidumpingtold, som indførtes
    ved Kommissionens forordning (EF) nr. 2286/94
