title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1597/77 of 15 July 1977 amending Regulation
    (EEC) No 1764/76 laying down certain detailed rules for granting the differential
    amount and the subsidy provided for the refining of raw sugar produced in the
    French overseas departments
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1597/77 de la Commission, du 15 juillet 1977, modifiant
    le règlement (CEE) n° 1764/76 établissant certaines modalités relatives à
    l' octroi du montant différentiel et de la subvention prévus pour le raffinage
    du sucre brut produit dans les départements français d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1597/77 der Kommission vom 15. Juli 1977 zur Änderung
    der Verordnung (EWG) Nr. 1764/76 zur Festlegung von Durchführungsbestimmungen
    für die Gewährung der für die Raffinierung von Rohzucker, der in den französischen
    überseeischen Departements erzeugt worden ist, vorgesehenen Beihilfe und des
    Differenzbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1597/77 af 15. juli 1977 om ændring
    af forordning (EØF) nr. 1764/76 vedrørende visse gennemførelsesbestemmelser
    for ydelse af differencebeløbet og det tilskud, som er fastsat til raffinering
    af råsukker, der er fremstillet i de franske oversøiske departementer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1597/77 della Commissione, del 15 luglio 1977, che
    modifica il regolamento (CEE) n. 1764/76, che stabilisce talune modalità relative
    alla concessione dell' importo differenziale e della sovvenzione previsti per
    la raffinazione dello zucchero greggio prodotto nei dipartimenti francesi d' oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1597/77 van de Commissie van 15 juli 1977 tot wijziging
    van Verordening (EEG) nr. 1764/76 tot vaststelling van uitvoeringsbepalingen voor
    de toekenning van het differentiële bedrag en de subsidie die zijn vastgesteld
    voor de raffinering van in de Franse overzeese departementen geproduceerde ruwe
    suiker
