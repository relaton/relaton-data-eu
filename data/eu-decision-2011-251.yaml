    üleeuroopalisi elektroonilisi sideteenuseid pakkuda võimaldavate maapealsete
    süsteemide jaoks (teatavaks tehtud numbri K(2011) 2633 all)'
  type: main
- language: fi
  script: Latn
  content: '2011/251/EU: Komission täytäntöönpanopäätös, annettu 18 päivänä
