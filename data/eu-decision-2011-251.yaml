    za terestričke sustave koji mogu pružati paneuropske elektroničke komunikacijske
    usluge u Zajednici (priopćena pod brojem dokumenta C(2011) 2633)'
  type: main
- language: hu
  script: Latn
  content: '2011/251/EU: A Bizottság végrehajtási határozata ( 2011. április
