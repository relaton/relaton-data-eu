    pystyviä maanpäällisiä järjestelmiä varten tehdyn päätöksen 2009/766/EY
    muuttamisesta (tiedoksiannettu numerolla K(2011) 2633)'
  type: main
- language: hr
  script: Latn
  content: '2011/251/EU: Provedbena odluka Komisije od 18. travnja 2011. o izmjeni
