title:
- language: en
  script: Latn
  content: '2011/251/EU: Commission Implementing Decision of 18 April 2011 amending
    Decision 2009/766/EC on the harmonisation of the 900 MHz and 1800 MHz frequency
    bands for terrestrial systems capable of providing pan-European electronic communications
    services in the Community (notified under document C(2011) 2633)'
  type: main
- language: fr
  script: Latn
  content: '2011/251/UE: Décision d’exécution de la Commission du 18 avril 2011
    modifiant la décision 2009/766/CE sur l’harmonisation des bandes de fréquences
    de 900 MHz et de 1800 MHz pour les systèmes terrestres capables de fournir des
    services paneuropéens de communications électroniques dans la Communauté [notifiée
    sous le numéro C(2011) 2633]'
  type: main
- language: de
  script: Latn
  content: '2011/251/EU: Durchführungsbeschluss der Kommission vom 18. April 2011
    zur Änderung der Entscheidung 2009/766/EG der Kommission zur Harmonisierung des
    900-MHz-Bands und des 1800 -MHz-Bands für terrestrische Systeme, die europaweite
    elektronische Kommunikationsdienste in der Gemeinschaft erbringen können (Bekannt
    gegeben unter Aktenzeichen K(2011) 2633)'
  type: main
- language: bg
  script: Cyrl
  content: '2011/251/ЕС: Решение за изпълнение на Комисията
    от 18 април 2011 година за изменение на Решение
    2009/766/ЕО относно хармонизирането на радиочестотните
    обхвати 900 MHz и 1800 MHz за наземни системи за предоставяне
    на общоевропейски електронни съобщителни
    услуги в Общността (нотифицирано под номер
    C(2011) 2633)'
  type: main
- language: cs
  script: Latn
  content: '2011/251/EU: Prováděcí rozhodnutí Komise ze dne 18. dubna 2011 , kterým
    se mění rozhodnutí 2009/766/ES o harmonizaci kmitočtových pásem 900 MHz
    a 1800 MHz pro zemské systémy schopné poskytovat celoevropské služby elektronických
    komunikací ve Společenství (oznámeno pod číslem K(2011) 2633)'
  type: main
- language: da
  script: Latn
  content: '2011/251/EU: Kommissionens gennemførelsesafgørelse af 18. april 2011
    om ændring af beslutning 2009/766/EF om harmonisering af 900 MHz-båndet og 1800
    MHz-båndet for landbaserede systemer, som kan levere fælleseuropæiske elektroniske
    kommunikationstjenester i Fællesskabet (meddelt under nummer K(2011) 2633)'
  type: main
- language: el
  script: Grek
  content: '2011/251/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 18ης Απριλίου 2011 , για την τροποποίηση της
    απόφασης 2009/766/ΕΚ σχετικά με την εναρμόνιση
    των ζωνών συχνοτήτων των 900 MHz και των 1800 MHz για
    επίγεια συστήματα ικανά να παρέχουν πανευρωπαϊκές
    υπηρεσίες ηλεκτρονικών επικοινωνιών στην
    Κοινότητα [κοινοποιηθείσα υπό τον αριθμό Ε(2011)
    2633]'
  type: main
- language: et
  script: Latn
  content: '2011/251/EL: Komisjoni rakendusotsus, 18. aprill 2011 , millega muudetakse
