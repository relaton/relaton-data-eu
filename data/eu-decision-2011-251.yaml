    páneurópai elektronikus hírközlési szolgáltatások nyújtására alkalmas
    földfelszíni rendszerek részére történő harmonizálásáról szóló 2009/766/EK
    határozat módosításáról (az értesítés a C(2011) 2633. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2011/251/UE: Decisione di esecuzione della Commissione, del 18 aprile
    2011 , che modifica la decisione 2009/766/CE relativa all’armonizzazione delle
    bande di frequenze 900 MHz e 1800 MHz per i sistemi terrestri in grado di fornire
    servizi di comunicazioni elettroniche paneuropee nella Comunità [notificata con
    il numero C(2011) 2633]'
  type: main
- language: lv
  script: Latn
  content: '2011/251/ES: Komisijas Īstenošanas lēmums ( 2011. gada 18. aprīlis
