title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1005 of 19 June 2019 determining
    that a temporary suspension of the preferential customs duty is not appropriate
    for imports of bananas originating in Nicaragua
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1005 de la Commission du 19 juin 2019
    déterminant qu'une suspension temporaire du droit de douane préférentiel n'est
    pas appropriée dans le cas des importations de bananes originaires du Nicaragua
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1005 der Kommission vom 19. Juni 2019
    zur Feststellung, dass eine vorübergehende Aussetzung des Präferenzzolls für
    Einfuhren von Bananen mit Ursprung in Nicaragua nicht angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2019/1005 на Комисията
    от 19 юни 2019 година за определяне на временното
    спиране на прилагането на преференциалното
    мито за нецелесъобразно по отношение на вноса
    на банани с произход от Никарагуа
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/1005 ze dne 19. června 2019,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby není
    vhodné pro dovoz banánů pocházejících z Nikaraguy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/1005 af 19. juni 2019
    om fastsættelse af, at en midlertidig suspension af præferencetolden ikke er
    hensigtsmæssig for import af bananer med oprindelse i Nicaragua
  type: main
- language: el
  script: Grek
