  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/1005 z dnia 19 czerwca 2019 r. stanowiąca,
    że tymczasowe zawieszenie preferencyjnego cła nie jest odpowiednie w odniesieniu
    do przywozu bananów pochodzących z Nikaragui
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/1005 da Comissão, de 19 de junho de 2019,
