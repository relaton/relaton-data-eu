title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 703/97 of 18 April 1997 introducing for a
    trial period from 1 July 1997 to 30 June 1998 a cumulative recovery system for
    determining certain import duties on rice and amending Regulation (EC) No 1503/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 703/97 de la Commission du 18 avril 1997 instituant
    au titre d'une période d'essai du 1er juillet 1997 au 30 juin 1998 un système
    de recouvrement cumulatif relatif à la détermination de certains droits à l'importation
    dans le secteur du riz et modifiant le règlement (CE) nº 1503/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 703/97 der Kommission vom 18. April 1997 zur Einrichtung
    eines kumulativen Rückforderungssystems für einen Versuchszeitraum vom 1. Juli
    1997 bis zum 30. Juni 1998 zur Festsetzung bestimmter Einfuhrzölle im Sektor
    Reis und zur Änderung der Verordnung (EG) Nr. 1503/96
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 703/97 af 18. april 1997 om indførelse
    i en forsøgsperiode fra 1. juli 1997 til 30. juni 1998 af en ordning for kumulativ
    tilbagebetaling vedrørende fastlæggelsen af importtold for ris og om ændring
    af forordning (EF) nr. 1503/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 703/97 της Επιτροπής
    της 18ης Απριλίου 1997 για τη θέσπιση, στη διάρκεια
    μιας δοκιμαστικής περιόδου από την 1η Ιουλίου
    1997 έως τις 30 Ιουνίου 1998, συστήματος σωρευτικής
    είσπραξης σχετικού με τον προσδιορισμό ορισμένων
    δασμών κατά την εισαγωγή, στον τομέα του ρυζιού
    και την τροποποίηση του κανονισμού (ΕΚ) αριθ.
    1503/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 703/97, annettu 18 päivänä huhtikuuta 1997,
    tiettyjen riisialan tuontitullien määrittämistä koskevan kumulatiivisen perintäjärjestelmän
    perustamisesta kokeilukaudeksi 1 päivästä heinäkuuta 1997 30 päivään kesäkuuta
    1998 sekä asetuksen (EY) N:o 1503/96 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 703/97 della Commissione del 18 aprile 1997 che istituisce,
    per un periodo di prova dal 1° luglio 1997 al 30 giugno 1998, un sistema di riscossione
    cumulativa per la determinazione di alcuni dazi all'importazione nel settore del
    riso e che modifica il regolamento (CE) n. 1503/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 703/97 van de Commissie van 18 april 1997 houdende
    invoering, voor een proefperiode van 1 juli 1997 tot en met 30 juni 1998, van
    een cumulatief invorderingssysteem voor de vaststelling van bepaalde invoerrechten
    in de sector rijst en houdende wijziging van Verordening (EG) nr. 1503/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 703/97 da Comissão de 18 de Abril de 1997 que cria,
    a título experimental entre 1 de Julho de 1997 e 30 de Junho de 1998, um sistema
    cumulativo de cobrança relativo à determinação de certos direitos de importação
    no sector do arroz e que altera o Regulamento (CE) nº 1503/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 703/97 de la Comisión de 18 de abril de 1997 por el
    que se establece, durante un período de prueba comprendido entre el 1 de julio
    de 1997 y el 30 de junio de 1998, un sistema de cobro acumulativo relativo a la
    determinación de determinados derechos de importación en el sector del arroz,
    y por el que se modifica el Reglamento (CE) nº 1503/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 703/97 av den 18 april 1997 om införande
    under en försöksperiod från den 1 juli 1997 till den 30 juni 1998 av ett system
    för kumulativ återbetalning i samband med fastställandet av vissa importtullar
    inom rissektorn och om ändring av förordning (EG) nr 1503/96
  type: main
