title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 617/2000 of 16 March 2000 imposing provisional
    anti-dumping duties on imports of solutions of urea and ammonium nitrate originating
    in Algeria, Belarus, Lithuania, Russia and Ukraine and accepting, on a provisional
    basis, an undertaking offered by an exporting producer in Algeria
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 617/2000 de la Commission, du 16 mars 2000, instituant
    un droit antidumping provisoire sur les importations de solutions d'urée et de
    nitrate d'ammonium originaires d'Algérie, du Belarus, de Lituanie, de Russie
    et d'Ukraine et acceptant, à titre provisoire, un engagement offert par un producteur-exportateur
    en Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 617/2000 der Kommission vom 16. März 2000 zur Einführung
    vorläufiger Antidumpingzölle auf die Einfuhren von Lösungen von Harnstoff und
    Ammoniumnitrat mit Ursprung in Algerien, Belarus, Litauen, Rußland und der Ukraine
    und zur vorläufigen Annahme eines Verpflichtungsangebots eines ausführenden
    Herstellers in Algerien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 617/2000 af 16. marts 2000 om indførelse
    af en midlertidig antidumpingtold på importen af opløsninger af urinstof og
    ammoniumnitrat med oprindelse i Algeriet, Belarus, Litauen, Rusland og Ukraine
    og om foreløbig godtagelse af et tilsagn afgivet af en eksporterende producent
    i Algeriet
  type: main
- language: el
  script: Grek
