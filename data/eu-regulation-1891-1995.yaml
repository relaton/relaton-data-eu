    mukaisesti toteutetun sadannen neljännenkymmenennen ensimmäisen osittaisen tarjouskilpailun
    ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1891/95 DELLA COMMISSIONE del 28 luglio 1995 che decide
    di non dare seguito alle offerte presentate per la centoquarantunesima gara parziale
    effettuata nel quadro delle misure generali di intervento a norma del regolamento
    (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1891/95 VAN DE COMMISSIE van 28 juli 1995 houdende
