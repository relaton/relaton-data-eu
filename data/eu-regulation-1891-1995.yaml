  content: COMMISSION REGULATION (EC) No 1891/95 of 28 July 1995 deciding not to accept
    tenders submitted in response to the 141st partial invitation to tender opened
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1891/95 DE LA COMMISSION du 28 juillet 1995 disposant
    de ne pas donner suite aux offres déposées à la suite de la cent quarante et
    unième adjudication partielle effectuée dans le cadre des mesures générales
    d'intervention conformément au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1891/95 DER KOMMISSION vom 28. Juli 1995 über den
    Beschluß, den zur 141. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1891/95 af 28. juli 1995 om ikke at tage
    den 141. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    i henhold til forordning (EØF) nr. 1627/89 til følge
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1891/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 28ης Ιουλίου 1995 για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τον 141ο
    μερικό διαγωνισμό που πραγματοποιείται στο
    πλαίσιο των γενικών μέτρων παρεμβάσεως σύμφωνα
    με τον κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1891/95, annettu 28 päivänä heinäkuuta 1995,
