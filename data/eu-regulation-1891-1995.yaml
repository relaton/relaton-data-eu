    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1891/95 DA COMISSÃO de 28 de Julho de 1995 que rejeita
    as propostas apresentadas na sequência do centésimo quadragésimo primeiro concurso
