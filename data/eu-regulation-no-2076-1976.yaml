  content: Commission Regulation (EEC) No 2076/76 of 23 August 1976 concerning the
    repetition of the issue of an invitation to tender for the supply to Somalia for
    use as food aid of vitaminized skimmed-milk powder to be purchased on the Community
    market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2076/76 de la Commission, du 23 août 1976, relatif
    à la répétition d'une adjudication pour la fourniture, au titre de l'aide alimentaire,
    de lait écrémé en poudre vitaminé acheté sur le marché de la Communauté
    et destiné à la Somalie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2076/76 der Kommission vom 23. August 1976 über die
    Ausschreibung für die Lieferung von auf dem Markt der Gemeinschaft angekauftem
    Magermilchpulver im Rahmen der Nahrungsmittelhilfe an Somalia
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2076/76 af 23. august 1976 om en ny
    licitation med henblik på levering af vitaminiseret skummetmælkspulver, der
    er opkøbt på Fællesskabets marked og bestemt til Somalia som fødevarehjælp
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2076/76 della Commissione, del 23 agosto 1976, relativo
