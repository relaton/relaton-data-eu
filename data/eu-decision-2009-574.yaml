    prețurile garantate pentru zahărul din trestie pentru perioadele de livrare
    2006/2007, 2007/2008, 2008/2009 și 1 iulie 2009 - 30 septembrie 2009 și a unui
    accord sub formă de schimb de scrisori între Comunitatea Europeană și Republica
    India privind prețurile garantate pentru zahărul din trestie pentru aceleași
    perioade de livrare'
  type: main
- language: sk
  script: Latn
  content: '2009/574/ES: Rozhodnutie Rady z 28. novembra 2008 o uzavretí Dohody vo
    forme výmeny listov medzi Európskym spoločenstvom a Barbadosom, Belize, Konžskou
    republikou, Republikou Pobrežie Slonoviny, Republikou fidžijských ostrovov,
    Guyanskou kooperatívnou republikou, Jamajkou, Kenskou republikou, Madagaskarskou
    republikou, Malawijskou republikou, Maurícijskou republikou, Mozambickou republikou,
    Federáciou Svätý Krištof a Nevis, Surinamskou republikou, Svazijským kráľovstvom,
    Tanzánijskou zjednotenou republikou, Republikou Trinidad a Tobago, Ugandskou
    republikou, Zambijskou republikou a Zimbabwianskou republikou o garantovaných
    cenách trstinového cukru na dodacie obdobia 2006/2007, 2007/2008, 2008/2009
    a na dodacie obdobie od 1. júla 2009 do 30. septembra 2009 a o uzavretí dohody
    vo forme výmeny listov medzi Európskym spoločenstvom a Indickou republikou
    o garantovaných cenách trstinového cukru na rovnaké dodacie obdobia'
  type: main
- language: sl
  script: Latn
  content: '2009/574/ES: Sklep Sveta z dne 28. novembra 2008 o sklenitvi Sporazuma
    v obliki izmenjave pisem med Evropsko skupnostjo ter Barbadosom, Belizejem, Republiko
    Kongo, Republiko Slonokoščeno obalo, Republiko Fidži, Republiko Gvajano, Jamajko,
    Republiko Kenijo, Republiko Madagaskar, Republiko Malavi, Republiko Mauritius,
    Republiko Mozambik, Saint Kittsom in Nevisom, Republiko Surinam, Kraljevino Svazi,
    Združeno republiko Tanzanijo, Republiko Trinidad in Tobago, Republiko Ugando,
    Republiko Zambijo in Republiko Zimbabve o zajamčenih cenah za trsni sladkor v
    dobavnih obdobjih 2006/2007, 2007/2008 in 2008/2009 ter dobavnem obdobju od 1.
    julija 2009 do 30. septembra 2009 ter Sporazuma v obliki izmenjave pisem med Evropsko
    skupnostjo in Republiko Indijo o zajamčenih cenah za trsni sladkor v istih dobavnih
    obdobjih'
  type: main
- language: es
  script: Latn
  content: '2009/574/CE: Decisión del Consejo, de 28 de noviembre de 2008 , relativa
    a la celebración de un Acuerdo en forma de Canje de Notas entre la Comunidad
    Europea y Barbados, Belice, la República del Congo, la República de Costa de
    Marfil, la República de las Islas Fiyi, la República Cooperativa de Guyana,
    Jamaica, la República de Kenia, la República de Madagascar, la República de
    Malawi, la República de Mauricio, la República de Mozambique, la Federación
    de San Cristóbal y Nieves, la República de Surinam, el Reino de Suazilandia,
    la República Unida de Tanzania, la República de Trinidad y Tobago, la República
    de Uganda, la República de Zambia y la República de Zimbabue sobre los precios
    garantizados del azúcar de caña para los períodos de entrega de 2006/2007,
    2007/2008, 2008/2009 y 1 de julio de 2009 a 30 de septiembre de 2009 y a la celebración
    de un Acuerdo en forma de Canje de Notas entre la Comunidad Europea y la República
    de la India sobre los precios garantizados del azúcar de caña para los mismos
    períodos de entrega'
  type: main
- language: sv
  script: Latn
  content: '2009/574/EG: Rådets beslut av den 28 november 2008 om ingående av ett
    avtal genom skriftväxling mellan Europeiska gemenskapen och Barbados, Belize,
    Republiken Kongo, Republiken Elfenbenskusten, Republiken Fijiöarna, Kooperativa
    republiken Guyana, Jamaica, Republiken Kenya, Republiken Madagaskar, Republiken
    Malawi, Republiken Mauritius, Republiken Moçambique, Saint Kitts och Nevis, Republiken
    Surinam, Konungariket Swaziland, Förenade republiken Tanzania, Republiken Trinidad
    och Tobago, Republiken Uganda, Republiken Zambia samt Republiken Zimbabwe om garantipriser
    för rörsocker för leveransperioderna 2006/07, 2007/08, 2008/09 och 1 juli 2009
    – 30 september 2009 och om ingående av ett avtal genom skriftväxling mellan
    Europeiska gemenskapen och Republiken Indien om garantipriser för rörsocker
    för samma leveransperioder'
