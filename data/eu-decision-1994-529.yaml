  script: Latn
  content: '94/529/CE: Decisão da Comissão de 6 de Dezembro de 1993 relativa à
    concessão de uma contribuição do instrumento financeiro de coesão para os
    projectos das redes de esgotos de Villia e de Fyli, das redes de esgotos e de
    recolha de águas pluviais de Alexandroupoli, de conclusão da rede de esgotos
