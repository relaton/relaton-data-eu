  script: Latn
  content: '94/529/CE: Decisión de la Comisión de 6 de diciembre de 1993 sobre la
    concesión de una ayuda del instrumento financiero de cohesión a los proyectos
    de: - alcantarillado de los municipios de Vilía y Filí, - red de evacuación
    de aguas pluviales y residuales en Alejandrópolis, - terminación de la red de
    alcantarillado de Xanti, - redes de suministro de agua y de evacuación de aguas
