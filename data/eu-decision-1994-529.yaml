title:
- language: en
  script: Latn
  content: '94/529/EC: Commission Decision of 6 December 1993 granting assistance
    from the cohesion financial instrument for the following projects: sewerage for
    the municipalities of Villia and Fili, sewerage (foul and rainwater) at Alexandroupolis,
    completion of sewer network at Xanthi, water supply and second stage of foul and
    rainwater sewage network at Komotini, water supply and sewerage at Rethimno, foul
    sewerage and rainwater collection at Tirnavos in Greece - Nos CF: 93/09/61/019
    - 93/09/61/037 - 93/09/61/060 - 93/09/61/066 (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/529/CE: Décision de la Commission du 6 décembre 1993 relative à
    l''octroi d''un concours de l''instrument financier de cohésion pour des projets
    concernant - les réseaux d''égouts des dèmes de Vilia et de Fyli - le réseau
    d''égouts et de collecte d''eaux pluviales d''Alexandroupoli - l''achèvement
    du réseau d''égouts de Xanthi - les réseaux d''adduction d''eau et d''égouts
    (deuxième phase) et de collecte d''eaux pluviales de Komotini - les réseaux
    d''adduction d''eau et d''égouts de Réthymno et - le réseau d''égouts et de
    collecte d''eaux pluviales de Tyrnavos en Grèce - nº FC: 93/09/61/019 - 93/09/61/037
    - 93/09/61/060 - 93/09/61/066 - (Le texte en langue grecque est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '94/529/EG: Entscheidung der Kommission vom 6. Dezember 1993 über die
    Gewährung einer Unterstützung aus dem Kohäsions-Finanzinstrument für die Serie
    von Vorhaben - Kanalisationsnetz der Gemeinden Villia und Fyli - Kanalisations-
    und Regenwassersammelnetz in Alexandroupoli - Fertigstellung des Kanalisationsnetzes
    in Xanthi - Kanalisations- und Wasserleitungsnetze (zweite Stufe) sowie Regenwassersammelnetz
    in Komotini - Wasserleitungs- und Kanalisationsnetz in Rethymno und - Kanalisations-
    und Regenwassersammelnetz im Tyrnavos in Griechenland. - Nr. F.C.: 93/09/61/019
    - 93/09/61/037 - 93/09/61/060 - 93/09/61/066 - (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
