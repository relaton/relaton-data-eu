    utilizzazione e/o della destinazione di prodotti provenienti dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1207/87 van de Commissie van 30 april 1987 houdende
    wijziging van Verordening (EEG) nr. 1687/76 tot vaststelling van gemeenschappelijke
    bepalingen inzake de controle op het gebruik en/of de bestemming van produkten
    uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1207/87 da Comissão de 30 de Abril de 1987 que
