title:
- language: en
  script: Latn
  content: '79/134/EEC: Commission Decision of 23 January 1979 authorizing the French
    Republic not to apply Community treatment to woven table linen, toilet and kitchen
    linen other than of cotton terry fabric, falling within subheading ex 62.02 B
    of the Common Customs Tariff (NIMEXE codes 62.02-41, 43, 47, 65, 73, 77) (category
    39), originating in the People''s Republic of China and in free circulation in
    the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/134/CEE: Décision de la Commission, du 23 janvier 1979, autorisant
    la République française à exclure du traitement communautaire le linge de table,
    de toilette, d''office et de cuisine, tissé, autre que de coton bouclé du genre
    éponge, de la sous-position ex 62.02 B du tarif douanier commun (codes Nimexe:
    62.02-41, 43, 47, 65, 73, 77) catégorie 39, originaire de la République populaire
    de Chine et mis en libre pratique dans les autres États membres (Le texte en
    langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/134/EWG: Entscheidung der Kommission vom 23. Januar 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Tischwäsche,
    Wäsche zur Körperpflege und andere Haushaltswäsche, aus Geweben, andere als
    Wäsche aus Frottiergeweben, der Tarifstelle ex 62.02 B des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 62.02-41; 43; 47; 65; 73; 77) (Kategorie 39) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/134/EØF: Kommissionens beslutning af 23. januar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage dækketøj,
    håndklæder, vaskeklude og viskestykker af vævede stoffer undtagen af håndklædefrotterstof
    eller lignende frotterstof af bomuld, som henhører under pos. ex 62.02 B i den
    fælles toldtarif (NIMEXE-nummer 62.02-41, 43, 47, 65, 73, 77) kategori 39, har
    oprindelse i Den kinesiske Folkerepublik og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/134/CEE: Decisione della Commissione, del 23 gennaio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario la biancheria
    da tavola, da toletta, da servizio o da cucina, tessuta, esclusa quella di cotone
    riccio del tipo spugna, della sottovoce ex 62.02 B della tariffa doganale comune
    (codice Nimexe: 62.02-41, 43, 47, 65, 73, 77), categoria 39, originarie della
    Repubblica popolare cinese e messe in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/134/EEG: Beschikking van de Commissie van 23 januari 1979 waarbij de
    Franse Republiek wordt gemachtigd tafellinnen, huishoudlinnen, ander dan van katoen
    en bad- of frotteerstof, van onderverdeling ex 62.02 B van het gemeenschappelijk
    douanetarief (NIMEXE-code 62.02- 41, 43, 47, 65, 73, 77) (categorie 39), van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
