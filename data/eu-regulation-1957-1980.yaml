title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1957/80 of 22 July 1980 increasing the volume
    of the Community tariff quota opened for the year 1980 for ferro-chromium containing
    not less than 4% by weight of carbon and falling within subheading ex 73.02 E
    I of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1957/80 du Conseil, du 22 juillet 1980, portant augmentation
    du volume du contingent tarifaire communautaire ouvert pour l' année 1980 pour
    le ferro-chrome contenant en poids 4% ou plus de carbone de la sous-position ex
    73.02 E I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1957/80 des Rates vom 22. Juli 1980 zur Aufstockung
    des für das Jahr 1980 eröffneten Gemeinschaftszollkontingents für Ferrochrom
    mit einem Gehalt an Kohlenstoff von 4 Gewichtshundertteilen oder mehr der Tarifstelle
    ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1957/80 af 22. juli 1980 om forhøjelse af
    det for 1980 åbnede fællesskabstoldkontingent for ferrochrom indeholdende mindst
    4 vægtprocent kulstof, henhørende under pos. 73.02 E I i den fælles toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1957/80 del Consiglio, del 22 luglio 1980, relativo
    all' aumento del volume del contingente tariffario comunitario aperto per il 1980
    per il ferrocromo contenente, in peso, il 4% o più di carbonio, della sottovoce
    ex 73.02 E I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1957/80 van de Raad van 22 juli 1980 houdende verhoging
    van het voor 1980 geopende communautaire tariefcontingent voor ferrochroom, bevattende
    4 of meer gewichtspercenten koolstof, van post ex 73.02 E I van het gemeenschappelijk
    douanetarief
