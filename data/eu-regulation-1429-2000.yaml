  content: Commission Regulation (EC) No 1429/2000 of 30 June 2000 amending Regulation
    (EC) No 1866/95 establishing detailed rules for application in the poultrymeat
    and eggs sectors of the arrangements provided for in the free trade Agreements
    between the Community, of the one part, and Estonia, Latvia and Lithuania, of
    the other part
  type: main
- language: fr
  script: Latn
