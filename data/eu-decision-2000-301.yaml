title:
- language: en
  script: Latn
  content: '2000/301/EC: Commission Decision of 18 April 2000 repealing the protective
    measures with regard to contamination by dioxins of certain products of porcine
    and poultry origin intended for human or animal consumption (notified under document
    number C(2000) 1034)'
  type: main
- language: fr
  script: Latn
  content: '2000/301/CE: Décision de la Commission, du 18 avril 2000, abrogeant les
    mesures de protection contre la contamination par les dioxines de certains produits
    d''origine porcine et de volaille destinés à la consommation humaine ou animale
    [notifiée sous le numéro C(2000) 1034]'
  type: main
- language: de
  script: Latn
  content: '2000/301/EG: Entscheidung der Kommission vom 18. April 2000 zur Aufhebung
    der Schutzmaßnahmen hinsichtlich der Dioxinkontamination bestimmter Schweine-
    und Geflügelerzeugnisse, die zur menschlichen Ernährung oder zur Verfütterung
    bestimmt sind (Bekanntgegeben unter Aktenzeichen K(2000) 1034)'
  type: main
- language: da
  script: Latn
  content: '2000/301/EF: Kommissionens beslutning af 18. april 2000 om ophævelse
    af beskyttelsesforanstaltningerne over for dioxinforurening af visse svine- og
    fjerkræprodukter til konsum eller foderbrug (meddelt under nummer K(2000) 1034)'
  type: main
- language: el
  script: Grek
  content: '2000/301/ΕΚ: Απόφαση της Επιτροπής, της 18ης
    Απριλίου 2000, για την κατάργηση των προστατευτικών
    μέτρων όσον αφορά τη μόλυνση από διοξίνες ορισμένων
    προϊόντων τα οποία προέρχονται από κρέας χοίρων
    ή πουλερικών και προορίζονται για κατανάλωση
    από τον άνθρωπο ή τα ζώα [κοινοποιηθείσα υπό
    τον αριθμό Ε(2000) 1034]'
  type: main
- language: fi
  script: Latn
  content: '2000/301/EY: Komission päätös, tehty 18 päivänä huhtikuuta 2000,
    eräitä ihmisravinnoksi tai eläinten rehuksi tarkoitettuja dioksiinin saastuttamia
    sioista tai siipikarjasta peräisin olevia tuotteita koskevien suojatoimenpiteiden
    kumoamisesta (tiedoksiannettu numerolla K(2000) 1034)'
  type: main
- language: it
  script: Latn
  content: '2000/301/CE: Decisione della Commissione, del 18 aprile 2000, che abroga
    le misure di protezione contro la contaminazione da diossina di alcuni prodotti
    di origine suina e avicola destinati al consumo umano o animale [notificata con
    il numero C(2000) 1034]'
  type: main
- language: nl
  script: Latn
  content: '2000/301/EG: Beschikking van de Commissie van 18 april 2000 houdende intrekking
    van de beschermende maatregelen met betrekking tot dioxineverontreiniging van
    bepaalde voor menselijke consumptie of voor vervoedering bestemde producten, afkomstig
    van varkens en van pluimvee (kennisgeving geschied onder nummer C(2000) 1034)'
  type: main
- language: pt
  script: Latn
  content: '2000/301/CE: Decisão da Comissão, de 18 de Abril de 2000, que revoga
