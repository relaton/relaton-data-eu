title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 323/70 du Conseil, du 17 février 1970, portant rétablissement
    du droit de douane relatif aux fils de bourre de soie (schappe), non conditionnés
    pour la vente au détail, de la position 50.05 du tarif douanier commun, et portant
    ouverture d'un contingent tarifaire communautaire pour certaines qualités de
    ces fils
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 323/70 des Rates vom 17. Februar 1970 über die Wiedereinführung
    des Zollsatzes für Schappeseidengarne, nicht in Aufmachungen für den Einzelverkauf,
    der Tarifnummer 50.05 des Gemeinsamen Zolltarifs und die Eröffnung eines Gemeinschaftszollkontingents
    für bestimmte Qualitäten dieser Garne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 323/70 del Consiglio, del 17 febbraio 1970, relativo
    al ristabilimento del dazio doganale per i filati di borra di seta (schappe) non
    preparati per la vendita al minuto, della voce 50.05 della tariffa doganale comune,
    e all'apertura, per alcune qualità di detti filati, di un contingente tariffario
    comunitario
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 323/70 van de Raad van 17 februari 1970 betreffende
    de wederinstelling van het douanerecht voor garens van vlokzijde, niet gereed
    voor de verkoop in het klein, van post 50.05 van het gemeenschappelijk douanetarief,
    en de opening van een communautair tariefcontingent voor bepaalde kwaliteiten
    van deze garens
  type: main
