title:
- language: en
  script: Latn
  content: '79/589/EEC: Commission Decision of 15 June 1979 making trade in crude
    oil and/or petroleum products between Italy and other Member States subject to
    a system of authorization to be granted automatically by the exporting Member
    State (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/589/CEE: Décision de la Commission, du 15 juin 1979, subordonnant
    les échanges de pétrole brut et/ou de produits pétroliers entre l''Italie et
    les autres Etats membres à un système d''autorisation à accorder automatiquement
    par l''État membre de provenance (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/589/EWG: Entscheidung der Kommission vom 15. Juni 1979 zur Unterstellung
    der Ausfuhren von Rohöl und/oder Erdölerzeugnissen zwischen Italien und den
    anderen Mitgliedstaaten unter ein System automatisch erteilter Genehmigungen durch
    den Herkunftsmitgliedstaat (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/589/EØF: Kommissionens beslutning af 15. juni 1979 om for handelen
    mellem Italien og de øvrige medlemsstater med mineralolie og/eller mineralolieprodukter
    at indføre en ordning med licenser, som automatisk gives af den udførende medlemsstat
    (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/589/CEE: Decisione della Commissione, del 15 giugno 1979, che subordina
    gli scambi di petrolio greggio e/o di prodotti petroliferi tra l''Italia e gli
    altri Stati membri ad un sistema di autorizzazioni rilasciate automaticamente
    dallo Stato membro di provenienza (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/589/EEG: Beschikking van de Commissie van 15 juni 1979 waarbij het
    handelsverkeer van ruwe aardolie en/of aardolieprodukten tussen Italië en de
    andere Lid-Staten wordt onderworpen aan een stelsel van vergunningen die automatisch
    door de Lid-Staat van herkomst moeten worden verleend (Slechts de tekst in de
    Italiaanse taal is authentiek)'
  type: main
