    con alcole di cui alla voce 22.05 della tariffa doganale comune interamente ottenuti
    in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2763/77 van de Raad van 5 december 1977 betreffende
