    in Griechenland gewonnenen Wein aus frischen Weintrauben und mit Alkohol stummmgemachten
    Most aus frischen Weintrauben der Tarifnummer 22.05 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2763/77 af 5. december 1977 om åbning, fordeling
