  content: Council Regulation (EEC) No 2763/77 of 5 December 1977 opening, allocating
    and providing for the administration of a Community tariff quota for wines from
    fresh grapes and grape must with fermentation arrested by the addition of alcohol,
    falling within heading No 22.05 of the Common Customs Tariff, originating entirely
    in Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2763/77 du Conseil, du 5 décembre 1977, portant ouverture,
    répartition et mode de gestion d'un contingent tarifaire communautaire pour les
    vins de raisins frais et moûts de raisins frais mutés à l'alcool, de la position
    22.05 du tarif douanier commun, entièrement obtenus en Grèce
  type: main
- language: de
  script: Latn
