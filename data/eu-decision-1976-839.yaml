title:
- language: en
  script: Latn
  content: Commission Decision of 9 September 1976 authorizing the French Republic
    not to apply Community treatment to blouses falling within heading No ex 61.02
    of the Common Customs Tariff, originating in the Republic of Korea and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/839/CEE: Décision de la Commission, du 9 septembre 1976, autorisant
    la République française à exclure du traitement communautaire les chemisiers
    et les blouses de la position Ex 61.02 du Tarif douanier commun, originaires de
    la République de Corée et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. September 1976, mit der die Französische
    Republik ermächtigt wird, aus der Republik Korea stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Hemdblusen und Blusen der Tarifnummer
    ex 61.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. september 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage bluser, som henhører under
    pos. ex. 61.02 i den fælles toldtarif, har oprindelse i republikken Korea og
    frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 settembre 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le camicette e bluse della voce
    ex 61.02 della tariffa doganale comune, originarie della Repubblica di Corea e
    messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 september 1976 waarbij de Franse Republiek
    wordt gemachtigd blouses, van post ex 61.02 van het gemeenschappelijk douanetarief,
    van oorsprong uit de Republiek Korea en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
