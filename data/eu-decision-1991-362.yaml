    Rådets forordning (EØF) nr. 328/88 om iværksættelse af et fællesskabsprogram,
    der skal bidrage til omstillingen i jern- og stålområder (RESIDER-programmet)
    (Kun den spanske udgave er autentisk) (91/362/EØF) #'
  type: main
