    (EWG) Nr. 328/88 des Rates zur Einführung eines Gemeinschaftsprogramms zugunsten
    der Umstellung von Eisen- und Stahlrevieren (Programm RESIDER) (Nur der spanische
    Wortlaut ist verbindlich) (91/362/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 20. juni 1991 om ændring af bilaget til Kommissionens
