title:
- language: en
  script: Latn
  content: '91/362/EEC: Commission Decision of 20 June 1991 amending the Annex to
    Commission Decision 90/411/EEC concerning the areas referred to in Article 3 (2)
    of Council Regulation (EEC) No 328/88 instituting a Community programme to assist
    the conversion of steel areas (Resider programme) (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/362/CEE: Décision de la Commission du 20 juin 1991 modifiant l''annexe
    de la décision 90/411/CEE concernant les zones visées à l''article 3 paragraphe
    2 du règlement (CEE) n° 328/88 du Conseil qui institue un programme communautaire
    en faveur de la reconversion de zones sidérurgiques (programme Resider) (Le texte
    en langue espagnole est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 20. Juni 1991 zur Änderung des Anhangs
