title:
- language: fr
  script: Latn
  content: Décision 64/690/CEE de la Commission, du 6 novembre 1964, autorisant la
    perception d'une taxe compensatoire sur les importations, en République fédérale
    d'Allemagne, de caramels mous, de caramels durs, de dragées ainsi que de pâte
    à fondant en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '64/690/EWG: Entscheidung der Kommission vom 6. November 1964 über die
    Erhebung einer Ausgleichsabgabe auf Einfuhren von Hartkaramellen, Weichkaramellen
    und Dragées in die Bundesrepublik Deutschland aus einigen Mitgliedstaaten'
  type: main
- language: it
  script: Latn
  content: '64/690/CEE: Decisione della Commissione, del 6 novembre 1964, che autorizza
    la riscossione di una tassa di compensazione sulle importazioni nella Repubblica
    federale di Germania, di caramelle tenere, di caramelle dure, di confetti e di
    pasta per fondente, in provenienza da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/690/EEG: Beschikking van de Commissie van 6 november 1964 houdende
    machtiging tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van zachte karamels, harde karamels, dragees en fondant uit bepaalde
    Lid-Staten'
  type: main
