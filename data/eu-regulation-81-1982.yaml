    ενδιάμεσων μέτρων διατηρήσεως καί διαχειρίσεως
    τών αλιευτικών πόρων τά οποία εφαρμόζονται
    σέ σκάφη υπό νορβηγική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 81/82 del Consiglio, dell' 8 gennaio 1982, che dispone
