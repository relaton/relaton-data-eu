title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 213/78 of 1 February 1978 amending Regulation
    (EEC) No 2104/75 in respect of certain special detailed rules for the application
    of the system of import licences in respect of products processed from fruit and
    vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 213/78 de la Commission, du 1er février 1978, modifiant
    le règlement (CEE) n° 2104/75 en ce qui concerne certaines modalités particulières
    d' application du régime des certificats d' importation dans le secteur des produits
    transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 213/78 der Kommission vom 1. Februar 1978 zur Änderung
    der Verordnung (EWG) Nr. 2104/75 hinsichtlich einiger besonderer Durchführungsbestimmungen
    über Einfuhrlizenzen für Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 213/78 af 1. februar 1978 om ændring
    af forordning (EØF) nr. 2104/75 for så vidt angår visse særlige gennemførelsesbestemmelser
    for ordningen med importlicenser for produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
