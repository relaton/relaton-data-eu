id: EURegulation25131997
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2513/97 of 15 December 1997 extending the definitive
    anti-dumping duty imposed by Regulation (EC) No 1490/96 on polyester staple fibre
    originating in Belarus to imports of polyester filament tow from Belarus and levying
    the extended duty on the latter imports as registered under Commission Regulation
    (EC) No 693/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2513/97 du Conseil du 15 décembre 1997 étendant le
    droit antidumping définitif institué par le règlement (CE) n° 1490/96 sur
    les importations de fibres discontinues de polyesters originaires du Bélarus
    aux importations de câbles de filaments de polyesters en provenance du même
    pays et portant perception du droit étendu aux importations enregistrées conformément
    au règlement (CE) n° 693/97 de la Commission
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2513/97 des Rates vom 15. Dezember 1997 zur Ausweitung
    des mit der Verordnung (EG) Nr. 1490/96 auf Polyester-Spinnfasern mit Ursprung
    in Belarus eingeführten endgültigen Antidumpingzolls auf die Einfuhren von Kabeln
    aus Polyester-Filamenten aus Belarus und zur Erhebung des ausgeweiteten Zolls
    auf solche gemäß der Verordnung (EG) Nr. 693/97 der Kommission zollamtlich erfaßten
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2513/97 af 15. december 1997 om udvidelse af
    den endelige antidumpingtold, der ved forordning (EF) nr. 1490/96 blev indført
    på importen af korte syntetiske fibre af polyester med oprindelse i Belarus,
    til også at omfatte bånd (tow) af polyester fra Belarus og om opkrævning af
    den udvidede told på sidstnævnte import registreret ved Kommissionens forordning
    (EF) nr. 693/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2513/97 του Συμβουλίου
    της 15ης Δεκεμβρίου 1997 για την επέκταση του
    οριστικού δασμού αντιντάμπινγκ που επιβλήθηκε
    με τον κανονισμό (ΕΚ) αριθ. 1490/96 στις μη συνεχείς
    ίνες από πολυεστέρα καταγωγής Λευκορωσίας
    και την εφαρμογή του επεκταθέντος δασμού στις
    εν λόγω εισαγωγές, οι οποίες έχουν καταγραφεί
    βάσει του κανονισμού (ΕΚ) αριθ. 693/97 της Επιτροπής
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2513/97, annettu 15 päivänä joulukuuta 1997,
    Valko-Venäjältä peräisin olevien polyesterikatkokuitujen tuonnissa neuvoston
    asetuksella (EY) N:o 1490/96 käyttöön otetun lopullisen polkumyyntitullin laajentamisesta
    Valko-Venäjältä peräisin oleviin polyesterikuitufilamenttitouveihin ja laajennetun
    tullin kantamisesta tällaiselta komission asetuksen (EY) N:o 693/97 mukaisesti
    kirjatulta tuonnilta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2513/97 del Consiglio del 15 dicembre 1997 che estende
    l'applicazione del dazio antidumping definitivo istituito dal regolamento (CE)
    n. 1490/96 sulle fibre di poliesteri in fiocco originarie della Bielorussia alle
    importazioni di fasci di filamenti di poliesteri dalla Bielorussia e decide la
    riscossione del dazio su tali importazioni soggette a registrazione a norma del
    regolamento (CE) n. 693/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 2513/97 van de Raad van 15 december 1997 waarbij het
    definitieve antidumpingrecht dat was ingesteld bij Verordening (EG) nr. 1490/96
    op de invoer van polyesterstapelvezels van oorsprong uit Wit-Rusland wordt uitgebreid
    tot de invoer van kabel van filamenten van polyesters van oorsprong uit Wit-Rusland
    en waarbij het uitgebreide recht op de in het kader van Verordening (EG) nr. 693/97
    van de Commissie geregistreerde invoer van kabel wordt geïnd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2513/97 do Conselho de 15 de Dezembro de 1997 que
    torna o direito anti-dumping definitivo instituído pelo Regulamento (CE) nº
    1490/96 do Conselho sobre as importações de fibras descontínuas de poliésteres
    originários da Bielorrússia extensivo às importações de cabos de filamentos
    sintéticos de poliésteres originários da Bielorrússia e que determina a cobrança
    do direito extensivo às últimas importações registadas nos termos do Regulamento
    (CE) nº 693/97 da Comissão
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2513/97 del Consejo de 15 de diciembre de 1997 por
    el que se amplía el derecho antidumping definitivo impuesto por el Reglamento
    (CE) n 1490/96 sobre las fibras discontinuas de poliéster originarias de Belarús
    a las importaciones de cables de filamentos sintéticos de poliéster de Belarús
    y por el que se percibe el derecho ampliado sobre las últimas importaciones aplicable
    a estas importaciones registradas de conformidad con el Reglamento (CE) n° 693/97
    de la Comisión
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2513/97 av den 15 december 1997 om utvidgning
    av den slutgiltiga antidumpningstull som införs genom förordning (EG) nr 1490/96
    på polyesterstapelfibrer med ursprung i Vitryssland till att omfatta import av
    fiberkabel av syntetfilament av polyestrar från Vitryssland och om uttag av den
    utvidgade tullen på sådan import som registrerats i enlighet med kommissionens
    förordning (EG) nr 693/97
  type: main
