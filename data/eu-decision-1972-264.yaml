title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 juin 1972, autorisant la République
    française à exclure du traitement communautaire les asperges préparées ou
    conservées sans vinaigre ou acide acétique, de la position 20.02 D du Tarif
    douanier commun, originaires du Brésil et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '72/264/EWG: Entscheidung der Kommission vom 30. Juni 1972, mit der die
    Französische Republik ermächtigt wird, aus Brasilien stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Spargel, ohne Essig zubereitet
    oder haltbar gemacht, der Tarifnummer 20.02 D des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/264/CEE: Decisione della Commissione, del 30 giugno 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli asparagi preparati
    o conservati senza aceto o acido acetico della voce n. 20.02 D della tariffa doganale
    comune, originari del Brasile e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/264/EEG: Beschikking van de Commissie van 30 juni 1972 waarbij de Franse
    Republiek wordt gemachtigd asperges, bereid of verduurzaamd, zonder azijn of azijnzuur
    van post 20.02 D van het gemeenschappelijk douanetarief, van oorsprong uit Brazilië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
