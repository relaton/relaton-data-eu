title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 957/81 of 8 April 1981 amending the Annex
    to Regulation (EEC) No 1687/76 laying down common detailed rules for verifying
    the use and/or destination of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 957/81 de la Commission, du 8 avril 1981, portant
    modification de l' annexe du règlement (CEE) n° 1687/76 établissant les modalités
    communes de contrôle de l' utilisation et/ou de la destination des produits provenant
    de l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 957/81 der Kommission vom 8. April 1981 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 1687/76 zur Festlegung der gemeinsamen Durchführungsbestimmungen
    für die Überwachung der Verwendung und/oder Bestimmung von Erzeugnissen aus
    den Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 957/81 af 8. april 1981 om ændring
    af bilaget til forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser
    for kontrol med anvendelse af og/eller bestemmelse for produkter fra intervention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 957/81 τής Επιτροπής
