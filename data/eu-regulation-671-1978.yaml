title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 671/78 of 3 April 1978 making the importation
    of certain textile products originating in State-trading countries subject to
    common rules for authorization and quantitative limitation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 671/78 de la Commission, du 3 avril 1978, soumettant
    à un régime commun d'autorisation et de contingentement les importations de
    certains produits textiles originaires des pays à commerce d'état
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 671/78 der Kommission vom 3. April 1978, mit der die
    Einfuhr von Textilwaren mit Ursprung in den Staatshandelsländern einer gemeinsamen
    Genehmigungspflicht und einer Kontingentierung unterworfen wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 671/78 af 3. april 1978 om indførelse
    af en fællesskabsordning vedrørende importtilladelser for og kontingentering
    af indførsel af visse tekstilvarer med oprindelse i statshandelslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 671/78 della Commissione, del 3 aprile 1978, che sottopone
    ad un regime comune di autorizzazione e di contingentamento le importazioni di
    taluni prodotti tessili originari dei paesi a commercio di Stato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 671/78 van de Commissie van 3 april 1978 waarbij
    de invoer van bepaalde textielprodukten van oorsprong uit landen met staatshandel
    aan een gemeenschappelijke regeling van invoervergunningen en contingentering
    wordt onderworpen
