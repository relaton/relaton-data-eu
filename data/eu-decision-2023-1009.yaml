    idir an tAontas Eorpach agus Stát Ilnáisiúnach na Bolaive maidir le malartú
    sonraí pearsanta idir Gníomhaireacht an Aontais Eorpaigh i ndáil le Comhar
    i bhForfheidhmiú an Dlí (Europol) agus údaráis na Bolaive atá inniúil chun
    an choireacht thromchúiseach agus an sceimhlitheoireacht a chomhrac
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2023/1009 od 15. svibnja 2023. o odobravanju otvaranja
    pregovora s Višenacionalnom Državom Bolivijom o sporazumu između Europske unije
    i Višenacionalne Države Bolivije o razmjeni osobnih podataka između Agencije
    Europske unije za suradnju tijela za izvršavanje zakonodavstva (Europol) i bolivijskih
    tijela nadležnih za borbu protiv teških kaznenih djela i terorizma
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2023/1009 határozata (2023. május 15.) az Európai Unió
    és a Többnemzetiségű Bolíviai Állam közötti, a személyes adatoknak a
    Bűnüldözési Együttműködés Európai Uniós Ügynöksége (Europol), valamint
    a súlyos bűncselekmények és a terrorizmus elleni küzdelem terén illetékes
    bolíviai hatóságok közötti cseréjéről szóló megállapodásra irányuló,
    a Többnemzetiségű Bolíviai Állammal folytatandó tárgyalások megkezdésére
    való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/1009 del Consiglio del 15 maggio 2023 che autorizza
    l’avvio di negoziati con lo Stato plurinazionale di Bolivia per un accordo tra
    l’Unione europea e lo Stato plurinazionale di Bolivia sullo scambio di dati
    personali tra l’Agenzia dell’Unione europea per la cooperazione nell’attività
    di contrasto (Europol) e le autorità boliviane competenti per la lotta contro
    le forme gravi di criminalità e il terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2023/1009 (2023. gada 15. maijs), ar ko pilnvaro sākt
    sarunas ar Bolīvijas Daudznāciju Valsti par nolīgumu starp Eiropas Savienību
    un Bolīvijas Daudznāciju Valsti par personas datu apmaiņu starp Eiropas Savienības
    Aģentūru tiesībaizsardzības sadarbībai (Eiropolu) un Bolīvijas iestādēm,
    kuru kompetencē ir smago noziegumu un terorisma apkarošana
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2023/1009 2023 m. gegužės 15 d. kuriuo suteikiami
    įgaliojimai pradėti derybas su Bolivijos Daugiataute Valstybe dėl Europos Sąjungos
    ir Bolivijos Daugiatautės Valstybės susitarimo dėl Europos Sąjungos teisėsaugos
    bendradarbiavimo agentūros (Europolo) ir Bolivijos kompetentingų kovos su sunkiais
    nusikaltimais ir terorizmu institucijų keitimosi asmens duomenimis
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2023/1009 tal-15 ta’ Mejju 2023 li tawtorizza
