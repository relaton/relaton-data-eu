    cu caracter personal între Agenția Uniunii Europene pentru Cooperare în Materie
    de Aplicare a Legii (Europol) și autoritățile boliviene cu competențe în
    materie de combatere a criminalității grave și a terorismului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/1009 z 15. mája 2023 o poverení začať rokovania
    s Bolívijským mnohonárodným štátom o dohode medzi Európskou úniou a Bolívijským
    mnohonárodným štátom o výmene osobných údajov medzi Agentúrou Európskej
    únie pre spoluprácu v oblasti presadzovania práva (Europol) a orgánmi Bolívie
    príslušnými pre boj proti závažnej trestnej činnosti a terorizmu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/1009 z dne 15. maja 2023 o pooblastilu za začetek
