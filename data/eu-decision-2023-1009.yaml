    državo Bolivijo o izmenjavi osebnih podatkov med Agencijo Evropske unije za sodelovanje
    na področju preprečevanja, odkrivanja in preiskovanja kaznivih dejanj (Europol)
    in bolivijskimi organi, pristojnimi za boj proti hudim kaznivim dejanjem in terorizmu
  type: main
