    Bolívia sobre o intercâmbio de dados pessoais entre a Agência da União Europeia
    para a Cooperação Policial (Europol) e as autoridades bolivianas competentes
    em matéria de luta contra a criminalidade grave e o terrorismo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/1009 a Consiliului din 15 mai 2023 de autorizare a începerii
    negocierilor cu Statul Plurinațional al Boliviei în vederea unui acord între
