title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/1009 of 15 May 2023 authorising the opening
    of negotiations with the Plurinational State of Bolivia for an agreement between
    the European Union and the Plurinational State of Bolivia on the exchange of personal
    data between the European Union Agency for Law Enforcement Cooperation (Europol)
    and the Bolivian authorities competent for fighting serious crime and terrorism
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/1009 du Conseil du 15 mai 2023 autorisant l’ouverture
    de négociations avec l’État plurinational de Bolivie en vue d’un accord
    entre l’Union européenne et l’État plurinational de Bolivie sur l’échange
    de données à caractère personnel entre l’Agence de l’Union européenne
    pour la coopération des services répressifs (Europol) et les autorités boliviennes
    compétentes pour lutter contre les formes graves de criminalité et le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/1009 des Rates vom 15. Mai 2023 über die Ermächtigung
    zur Aufnahme von Verhandlungen mit dem Plurinationalen Staat Bolivien über ein
    Abkommen zwischen der Europäischen Union und dem Plurinationalen Staat Bolivien
    über den Austausch personenbezogener Daten zwischen der Agentur der Europäischen
    Union für die Zusammenarbeit auf dem Gebiet der Strafverfolgung (Europol) und
    den für die Bekämpfung von schwerer Kriminalität und Terrorismus zuständigen
    bolivianischen Behörden
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/1009 на Съвета от 15 май 2023 година
