  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2023/1009, annettu 15 päivänä toukokuuta 2023,
    luvan antamisesta aloittaa neuvottelut Bolivian monikansaisen valtion kanssa Euroopan
    unionin lainvalvontayhteistyöviraston (Europol) ja vakavan rikollisuuden ja terrorismin
    torjunnasta vastaavien Bolivian toimivaltaisten viranomaisten välistä henkilötietojen
    vaihtoa koskevan Euroopan unionin ja Bolivian monikansaisen valtion välisen sopimuksen
    tekemiseksi
  type: main
- language: ga
  script: Latn
