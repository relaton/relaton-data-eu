  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/1009 van de Raad van 15 mei 2023 tot machtiging tot het
    openen van onderhandelingen met de Plurinationale Staat Bolivia over een overeenkomst
    tussen de Europese Unie en de Plurinationale Staat Bolivia op het gebied van de
    uitwisseling van persoonsgegevens tussen het Agentschap van de Europese Unie voor
    samenwerking op het gebied van rechtshandhaving (Europol) en de Boliviaanse autoriteiten
    die bevoegd zijn voor de bestrijding van zware criminaliteit en terrorisme
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/1009 z dnia 15 maja 2023 r. w sprawie upoważnienia
