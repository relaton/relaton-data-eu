    в областта на правоприлагането (Европол) и
    боливийските органи, компетентни в областта
    на борбата с тежките престъпления и тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/1009 ze dne 15. května 2023 o zmocnění k
    zahájení jednání s Mnohonárodním státem Bolívie o dohodě mezi Evropskou
    unií a Mnohonárodním státem Bolívie o výměně osobních údajů mezi Agenturou
