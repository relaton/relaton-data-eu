id: EUDecision1979902
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/902/EEC: Commission Decision of 17 October 1979 authorizing the French
    Republic not to apply Community treatment to toys of wood and others (except motors
    and movement mechanisms for toys and working models used for recreational purposes
    and parts thereof), falling within subheadings 97.03 A and ex B of the Common
    Customs Tariff, originating in Taiwan and in free circulation in the other Member
    States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/902/CEE: Décision de la Commission, du 17 octobre 1979, autorisant
    la République française à exclure du traitement communautaire les jouets en
    bois et autres (à l''exception des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées) de la sous-position
    97.03 A et ex B du tarif douanier commun, originaires de T''ai-wan et mis en libre
    pratique dans les autres Etats membres (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/902/EWG: Entscheidung der Kommission vom 17. Oktober 1979, mit der
    die Französische Republik ermächtigt wird, aus Taiwan stammendes und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliches Spielzeug aus Holz (mit
    Ausnahme der Motoren und Bewegungsmechanismen für Spielzeug und Modelle zum Spielen
    sowie deren Ersatzteile) der Tarifstellen 97.03 A und ex B des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/902/EØF: Kommissionens beslutning af 17. oktober 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ (med undtagelse af motorer og bevægelsesmekanismer til legetøj og arbejdsmodeller
    til fritidsbeskæftigelse og dele dertil), som henhører under pos. 97.03 A og
    ex B i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i
    de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/902/CEE: Decisione della Commissione, del 17 ottobre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori e i meccanismi d''animazione per giocattoli e
    modelli ridotti e i loro pezzi staccati) della voce 97.03 A e ex B della tariffa
    doganale comune, originari di Taiwan e messi in libera pratica negli altri Stati
    membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/902/EEG: Beschikking van de Commissie van 17 oktober 1979 waarbij de
    Franse Republiek wordt gemachtigd speelgoed van hout en andere (met uitzondering
    van motoren en bewegingsmechanismen voor speelgoed en modellen op schaal alsmede
    hun onderdelen), van post 97.03 A en ex B van het gemeenschappelijk douanetarief,
    van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
