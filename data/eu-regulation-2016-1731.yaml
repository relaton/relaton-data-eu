    o opětovném uložení konečného antidumpingového cla z dovozu některé obuvi
    se svrškem z usně pocházející z Čínské lidové republiky a Vietnamu a
    vyráběné společnostmi General Footwear Ltd (Čína), Diamond Vietnam Co Ltd
