    Settembru 2016 li jerġa' jimponi dazju antidumping definittiv u jiġbor b'mod
    definittiv id-dazju provviżorju impost fuq l-importazzjonijiet ta' ċerti tipi
    ta' lbies għar-riġlejn bil-parti ta' fuq tal-ġilda li joriġinaw mir-Repubblika
    tal-Poplu taċ-Ċina u l-Vjetnam u ffabbrikati minn General Footwear Ltd (iċ-Ċina),
