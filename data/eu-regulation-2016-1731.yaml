    произход от Китайската народна република и
    Виетнам, произведени от General Footwear Ltd (China), Diamond
    Vietnam Co Ltd и Ty Hung Footgearmex/Footwear Co. Ltd, и за изпълнение
    на решението на Съда на Европейския съюз по
    съединени дела C-659/13 и C-34/14
  type: main
