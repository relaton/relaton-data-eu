    vyberá dočasné clo uložené na dovoz určitej obuvi so zvrškom z usne s pôvodom
    v Čínskej ľudovej republike a vo Vietname a vyrobenej spoločnosťami General
    Footwear Ltd (Čína), Diamond Vietnam Co Ltd a Ty Hung Footgearmex/Footwear Co.
    Ltd a ktorým sa vykonáva rozsudok Súdneho dvora v spojených veciach C-659/13
    a C-34/14
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/1731 z dne 28. septembra 2016 o ponovni
    uvedbi dokončne protidampinške dajatve in dokončnem pobiranju začasne dajatve
    na uvoz določene obutve z zgornjim delom iz usnja s poreklom iz Ljudske republike
    Kitajske in Vietnama, ki jo proizvajajo družbe General Footwear Ltd (Kitajska),
    Diamond Vietnam Co Ltd in Ty Hung Footgearmex/Footwear Co. Ltd, ter o izvajanju
    sodbe Sodišča v združenih zadevah C-659/13 in C-34/14
  type: main
