    av den preliminära tull som införts på import av vissa skodon med överdelar
    av läder med ursprung i Folkrepubliken Kina och Vietnam och som tillverkas av
    General Footwear Ltd (Kina), Diamond Vietnam Co Ltd och Ty Hung Footgearmex/Footwear
    Co. Ltd och om genomförande av domstolens dom i de förenade målen C-659/13
    och C-34/14
