    pobraniu cła tymczasowego nałożonego na przywóz niektórych rodzajów obuwia
    ze skórzanymi cholewkami pochodzących z Chińskiej Republiki Ludowej i Wietnamu
    oraz wyprodukowanych przez General Footwear Ltd (Chiny), Diamond Vietnam Co Ltd
    i Ty Hung Footgearmex/Footwear Co. Ltd i wykonujące wyrok Trybunału Sprawiedliwości
    w sprawach połączonych C-659/13 i C-34/14
  type: main
