    uvođenju konačne antidampinške pristojbe i konačnoj naplati privremene pristojbe
    uvedene na uvoz određene obuće s gornjim dijelom od kože podrijetlom iz Narodne
    Republike Kine i Vijetnama koju proizvode trgovačka društva General Footwear
    Ltd (Kina), Diamond Vietnam Co Ltd i Ty Hung Footgearmex/Footwear Co. Ltd te o
    provedbi presude Suda u spojenim predmetima C-659/13 i C-34/14
  type: main
