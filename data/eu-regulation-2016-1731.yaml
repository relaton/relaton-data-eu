    tiettyjen Kiinan kansantasavallasta ja Vietnamista peräisin olevien sellaisten
    jalkineiden tuonnissa, joiden päälliset ovat nahkaa ja jotka on valmistanut
    General Footwear Ltd (China), Diamond Vietnam Co Ltd tai Ty Hung Footgearmex/Footwear
