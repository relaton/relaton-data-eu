    definitiva do direito provisório instituído sobre as importações de determinado
    tipo de calçado com a parte superior de couro natural originário da República
    Popular da China e do Vietname, produzido pelas empresas General Footwear Ltd
    (China), Diamond Vietnam Co Ltd e Ty Hung Footgearmex/Footwear Co. Ltd, e dá
    cumprimento ao acórdão do Tribunal de Justiça nos processos apensos C-659/13
    e C-34/14
  type: main
