    definitivamente el derecho provisional establecido sobre las importaciones de
    determinado calzado con parte superior de cuero originario de la República Popular
    China y de Vietnam y fabricado por General Footwear Ltd (China), Diamond Vietnam
    Co Ltd y Ty Hung Footgearmex/Footwear Co. Ltd, y se ejecuta la sentencia del Tribunal
    de Justicia en los asuntos acumulados C-659/13 y C-34/14
  type: main
