    Footwear Ltd (Kína), a Diamond Vietnam Co. Ltd és a Ty Hung Footgearmex/Footwear
    Co. Ltd által gyártott egyes bőr felsőrésszel rendelkező lábbelik behozatalára
    vonatkozó végleges dömpingellenes vám ismételt kivetéséről és a kivetett
    ideiglenes vám végleges beszedéséről, valamint a Bíróság által a C-659/13.
    és C-34/14. sz. egyesített ügyekben hozott ítélet végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/1731 della Commissione, del 28 settembre
    2016, che reistituisce un dazio antidumping definitivo e dispone la riscossione
    definitiva del dazio provvisorio istituito sulle importazioni di alcuni tipi di
    calzature con tomaie di cuoio originarie della Repubblica popolare cinese e del
    Vietnam e prodotte da General Footwear Ltd (Cina), Diamond Vietnam Co Ltd e Ty
    Hung Footgearmex/Footwear Co. Ltd, in esecuzione della sentenza della Corte di
    giustizia nelle cause riunite C-659/13 e C-34/14
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/1731 (2016. gada 28. septembris),
