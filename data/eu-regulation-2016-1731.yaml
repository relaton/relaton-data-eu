title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/1731 of 28 September 2016
    reimposing a definitive anti-dumping duty and collecting definitively the provisional
    duty imposed on imports of certain footwear with uppers of leather originating
    in the People's Republic of China and Vietnam and produced by General Footwear
    Ltd (China), Diamond Vietnam Co. Ltd and Ty Hung Footgearmex/Footwear Co. Ltd
    and implementing the judgment of the Court of Justice in Joined Cases C-659/13
    and C-34/14
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/1731 de la Commission du 28 septembre
    2016 réinstituant un droit antidumping définitif et portant perception définitive
    du droit provisoire institué sur les importations de certaines chaussures à
    dessus en cuir originaires de la République populaire de Chine et du Viêt Nam
    et produites par General Footwear Ltd (Chine), Diamond Vietnam Co Ltd et Ty Hung
    Footgearmex/Footwear Co. Ltd, et exécutant l'arrêt rendu par la Cour de justice
    dans les affaires jointes C-659/13 et C-34/14
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/1731 der Kommission vom 28. September
    2016 zur Wiedereinführung eines endgültigen Antidumpingzolls und zur endgültigen
    Vereinnahmung des vorläufigen Zolls auf die Einfuhren bestimmter Schuhe mit Oberteil
    aus Leder mit Ursprung in der Volksrepublik China und Vietnam, die von General
    Footwear Ltd (China), Diamond Vietnam Co Ltd und Ty Hung Footgearmex/Footwear
    Co. Ltd hergestellt werden, sowie zur Durchführung des Urteils des Gerichtshofs
    in den verbundenen Rechtssachen C-659/13 und C-34/14
  type: main
- language: bg
  script: Cyrl
