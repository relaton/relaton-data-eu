    maksājumu, kas uzlikts tādu konkrētu apavu ar ādas virsu importam, kuru izcelsme
    ir Ķīnas Tautas Republikā un Vjetnamā un kurus ražo General Footwear Ltd
    (China), Diamond Vietnam Co. Ltd un Ty Hung Footgearmex/Footwear Co. Ltd, un īsteno
    Tiesas spriedumu apvienotajās lietās C-659/13 un C-34/14
  type: main
- language: lt
  script: Latn
