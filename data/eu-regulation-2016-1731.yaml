    leder van oorsprong uit de Volksrepubliek China en Vietnam en vervaardigd door
    General Footwear Ltd (China), Diamond Vietnam Co Ltd en Ty Hung Footgearmex/Footwear
    Co. Ltd en tot uitvoering van het arrest van het Hof van Justitie van de Europese
    Unie in de gevoegde zaken C-659/13 en C-34/14
  type: main
- language: pl
