    laikinasis muitas, nustatytas tam tikrai importuojamai Kinijos Liaudies Respublikos
    ir Vietnamo kilmės avalynei su odiniais batviršiais, pagamintai bendrovių „General
    Footwear Ltd“ (Kinija), „Diamond Vietnam Co Ltd“ ir „Ty Hung Footgearmex/Footwear
    Co. Ltd“, ir kuriuo įgyvendinamas Teisingumo Teismo sprendimas sujungtose bylose
    C-659/13 ir C-34/14
  type: main
