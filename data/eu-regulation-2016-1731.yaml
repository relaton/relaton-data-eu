  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/1731 al Comisiei din 28 septembrie
    2016 de reinstituire a unei taxe antidumping definitive și de percepere definitivă
    a taxei provizorii instituite asupra importurilor de anumite tipuri de încălțăminte
    cu fețe din piele originare din Republica Populară Chineză și Vietnam și
    produse de General Footwear Ltd (China), Diamond Vietnam Co. Ltd și Ty Hung Footgearmex/Footwear
    Co. Ltd și de punere în aplicare a hotărârii Curții de Justiție în cauzele
    conexate C-659/13 și C-34/14
  type: main
- language: sk
  script: Latn
