title:
- language: en
  script: Latn
  content: '87/394/EEC: Commission Decision of 3 July 1987 determining the amount
    of VAT own resources payable by the Federal Republic of Germany for 1985 in respect
    of transactions covered by the 20th Council Directive 85/361/EEC on the harmonization
    of the laws of the Member States relating to turnover taxes - Common system of
    value added tax: derogations in connection with the special aids granted to certain
    farmers to compensate for the dismantlement of monetary compensatory amounts applying
    to certain agricultural products (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/394/CEE: Décision de la Commission du 3 juillet 1987 fixant le montant
    des ressources propres de la taxe sur la valeur ajoutée (TVA) dont la République
    fédérale d''Allemagne est redevable pour l''exercice 1985 et relatif aux opérations
    visées à la vingtième directive 85/361/CEE du Conseil en matière d''harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d''affaires
    - Système commun de taxe sur la valeur ajoutée: dérogations relatives aux aides
    spéciales accordées à certains agriculteurs en compensation du démantèlement
    des montants compensatoires monétaires applicables à certains produits agricoles
    (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '87/394/EWG: Entscheidung der Kommission vom 3. Juli 1987 zur Festsetzung
    des von der Bundesrepublik Deutschland für das Haushaltsjahr 1985 im Zusammenhang
    mit den in der zwanzigsten Richtlinie genannten Umsätzen geschuldeten Betrags
    der Mehrwertsteuer-Eigenmittel (Zwanzigste Richtlinie 85/361/EWG des Rates zur
    Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    - gemeinsames Mehrwertsteuersystem: Ausnahmeregelung im Zusammenhang mit den Sonderbeihilfen,
    die bestimmten Landwirten als Ausgleich für den Abbau der Währungsausgleichsbeträge
    für bestimmte landwirtschaftliche Erzeugnisse gewährt werden) (Nur der deutsche
    Text ist verbindlich)'
  type: main
