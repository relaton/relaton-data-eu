  content: COMMISSION REGULATION (EC) No 1642/97 of 18 August 1997 determining the
    extent to which applications lodged in August 1997 for import certificates for
    certain cheeses covered by the arrangements provided for in the Europe Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1642/97 DE LA COMMISSION du 18 août 1997 déterminant
