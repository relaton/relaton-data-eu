  content: Commission Regulation (EC) No 211/2007 of 27 February 2007 amending Regulation
    (EC) No 809/2004 implementing Directive 2003/71/EC of the European Parliament
    and of the Council as regards financial information in prospectuses where the
    issuer has a complex financial history or has made a significant financial commitment
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 211/2007 de la Commission du 27 février 2007 modifiant
    le règlement (CE) n o 809/2004 mettant en œuvre la directive 2003/71/CE du Parlement
    européen et du Conseil, en ce qui concerne les informations financières à inclure
    dans le prospectus lorsque l’émetteur a un historique financier complexe ou
    a pris un engagement financier important
  type: main
- language: de
  script: Latn
