    Parlaments und des Rates in Bezug auf die Finanzinformationen, die bei Emittenten
    mit komplexer finanztechnischer Vorgeschichte oder bedeutenden finanziellen Verpflichtungen
    im Prospekt enthalten sein müssen
  type: main
