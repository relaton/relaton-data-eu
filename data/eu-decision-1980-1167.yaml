title:
- language: en
  script: Latn
  content: '80/1167/EEC: Commission Decision of 1 December 1980 on the reimbursement
    by the Guidance Section of the EAGGF to Ireland of expenditure incurred during
    1978 on aids and premiums relating to the modernization of farms including those
    in the less favoured farming areas (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1167/CEE: Décision de la Commission, du 1er décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", à l''Irlande des dépenses effectuées pendant
    l''année 1978 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles dévaforisées (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1167/EWG: Entscheidung der Kommission vom 1. Dezember 1980 über die
    Rückvergütung durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1978 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an Irland (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1167/EØF: Kommissionens beslutning af 1. december 1980 om refusion
    gennem EUGFL, udviklingssektionen, til Irland af udgifter, som er afholdt i løbet
    af året 1978 til støtte og præmier vedrørende modernisering af landbrugsbedrifter,
    også i ugunstigt stillede områder (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1167/CEE: Decisione della Commissione, del 1 dicembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, all''Irlanda delle spese
    effettuate durante il 1978 per gli aiuti ed i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1167/EEG: Beschikking van de Commissie van 1 december 1980 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan Ierland voor de in 1978 verrichte
    uitgaven voor steun en premies met betrekking tot de modernisering van landbouwbedrijven
    waaronder mede begrepen die in probleemgebieden in de landbouw (Slechts de tekst
    in de Engelse taal is authentiek)'
