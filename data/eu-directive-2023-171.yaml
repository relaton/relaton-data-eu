    heicsifhiúsach mar oibreán in aghaidh creimeadh i dteaschaidéil ionsúite gáis
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2023/171 оd 28. listopada 2022. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga III. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za šesterovalentni krom kao
    antikorozivno sredstvo u apsorpcijskim plinskim dizalicama topline
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/171 felhatalmazáson alapuló irányelve (2022.
    október 28.) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítás céljából,
    a hat vegyértékű króm gázabszorpciós hőszivattyúkban korróziógátló
    szerként való felhasználására vonatkozó mentesség tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2023/171 della Commissione del 28 ottobre 2022
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato III
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso del cromo esavalente come agente anticorrosivo
    nelle pompe di calore ad assorbimento a gas
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2023/171 (2022. gada 28. oktobris),
    ar ko attiecībā uz atbrīvojumu sešvērtīgā hroma izmantošanai par pretkorozijas
    aģentu gāzes absorbcijas siltumsūkņos groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu, to pielāgojot zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2023/171 2022 m. spalio 28 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties, kuria šešiavalentį
    chromą leidžiama naudoti kaip antikorozinę medžiagą absorbciniuose dujiniuose
    šilumos siurbliuose, iš dalies keičiamas Europos Parlamento ir Tarybos direktyvos
    2011/65/ES III priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2023/171 tat-28 ta’ Ottubru 2022
    li temenda, għall-finijiet ta’ adattament għall-progress xjentifiku u tekniku,
    l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-kromu eżavalenti bħala aġent kontra l-korrużjoni
    fil-pompi tas-sħana mħaddma bl-assorbiment tal-gass
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2023/171 van de Commissie van 28 oktober 2022
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad betreffende een vrijstelling voor zeswaardig chroom als corrosiewering
    in gasabsorptiewarmtepompen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2023/171 z dnia 28 października 2022
    r. zmieniająca, w celu dostosowania do postępu naukowo-technicznego, załącznik
    III do dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    dotyczącego sześciowartościowego chromu jako środka antykorozyjnego w gazowych
    absorpcyjnych pompach ciepła
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2023/171 da Comissão de 28 de outubro de 2022 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção relativa à utilização de crómio hexavalente como agente anticorrosivo
    em bombas de calor de absorção a gás
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2023/171 a Comisiei din 28 octombrie 2022 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea cromului hexavalent ca agent anticoroziv în pompele
    de căldură cu absorbție acționate cu gaze
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2023/171 z 28. októbra 2022, ktorou
    sa na účely prispôsobenia technickému a vedeckému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    na používanie šesťmocného chrómu ako antikorózneho činidla v plynových
    absorpčných tepelných čerpadlách
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2023/171 z dne 28. oktobra 2022 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo šestvalentnega kroma kot protikorozijskega sredstva v plinskih absorpcijskih
    črpalkah zaradi prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2023/171 de la Comisión de 28 de octubre de 2022
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo por
    lo que respecta a una exención relativa al uso de cromo hexavalente como protector
    contra la corrosión en bombas de calor de absorción impulsadas por gas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2023/171 av den 28 oktober 2022
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    ett undantag för sexvärt krom som korrosionsskydd i gasdrivna absorptionsvärmepumpar
  type: main
