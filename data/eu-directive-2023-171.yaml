title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2023/171 of 28 October 2022 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for hexavalent chromium as an anticorrosion agent in gas absorption
    heat pumps
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2023/171 de la Commission du 28 octobre 2022
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    III de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption relative au chrome hexavalent comme anticorrosif dans les
    pompes à chaleur à absorption à gaz
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2023/171 der Kommission vom 28. Oktober 2022
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für sechswertiges Chrom als Korrosionsschutzmittel
    in Gasabsorptionswärmepumpen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2023/171 на Комисията
    от 28 октомври 2022 година за изменение, с цел
    привеждане в съответствие с научно-техническия
    напредък, на приложение III към Директива 2011/65/ЕС
    на Европейския парламент и на Съвета по отношение
    на освобождаването на употребата на шествалентен
    хром като противокорозионен агент в газово
    абсорбционни термопомпи
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2023/171 ze dne 28. října
    2022 kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití šestimocného chromu jako antikorozního činidla
    v plynových absorpčních tepelných čerpadlech
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2023/171 af 28. oktober 2022 om
    tilpasning til den videnskabelige og tekniske udvikling af bilag III til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for anvendelsen
    af hexavalent chrom anvendt til korrosionsbeskyttelse af gasabsorptionsvarmepumper
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2023/171 της
    Επιτροπής της 28ης Οκτωβρίου 2022 για την τροποποίηση,
    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος III της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση εξασθενούς χρωμίου ως αντιδιαβρωτικού
    σε λειτουργούσες με απορρόφηση αντλίες θερμότητας
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2023/171, 28. oktoober 2022, millega
    muudetakse teaduse ja tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi
    ja nõukogu direktiivi 2011/65/EL III lisa seoses erandiga, mis hõlmab kuuevalentse
    kroomi kasutamist korrosioonitõrjevahendina gaasiga töötavates absorptsioon-soojuspumpades
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2023/171, annettu 28 päivänä lokakuuta
    2022, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen III muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen kuudenarvoisen kromin käyttöä
    korroosionestoaineena kaasuabsorptiolämpöpumpuissa koskevan poikkeuksen osalta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2023/171 ón gCoimisiún an 28 Deireadh Fómhair
