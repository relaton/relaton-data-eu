type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 632/1999 of 24 March 1999 amending Regulation
    (EC) No 220/1999 determining the extent to which applications lodged in January
    1999 for import licences for certain egg sector products and poultrymeat pursuant
    to Regulations (EC) No 1474/95 and (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 632/1999 de la Commission du 24 mars 1999 modifiant
    le règlement (CE) n° 220/1999 déterminant la mesure dans laquelle les demandes
    de certificats d'importation introduites en janvier 1999 pour certains produits
    des secteurs de la viande de volaille et des oeufs dans le cadre des règlements
    (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 632/1999 der Kommission vom 24. März 1999 zur Änderung
    der Verordnung (EG) Nr. 220/1999 über die Festsetzung des Umfangs, in dem die
    im Januar 1999 gestellten Anträge auf Einfuhrlizenzen für bestimmte Produkte
    des Sektors Eier und Geflügelfleisch entsprechend den Verordnungen (EG) Nr. 1474/95
    und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 632/1999 af 24. marts 1999 om ændring
    af forordning (EF) nr. 220/1999 om fastsættelse af, i hvilket omfang der kan
    accepteres ansøgninger, der blev indgivet i januar 1999 om importlicenser for
    visse ægprodukter og fjerkrækød i forbindelse med forordning (EF) nr. 1474/95
    og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 632/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Μαρτίου 1999 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 220/1999 για τον καθορισμό
    του βαθμού στον οποίο μπορούν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιανουάριο 1999 για ορισμένα προϊόντα των
    τομέων του κρέατος πουλερικών και των αυγών
    στο πλαίσιο των κανονισμών (ΕΚ) αριθ. 1474/95 και
    (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 632/1999, annettu 24 päivänä maaliskuuta 1999,
    määrättyyn järjestelmään liittyvien tammikuussa 1999 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96
    mukaisesti annetun asetuksen (EY) N:o 220/1999 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 632/1999 della Commissione del 24 marzo 1999 che modifica
    il regolamento (CE) n. 220/1999 che stabilisce entro quali limiti possono essere
    accettate le domande di titoli di importazione presentate nel mese di gennaio
    1999 per taluni prodotti del settore delle uova e del pollame nel quadro dei regolamenti
    (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 632/1999 van de Commissie van 24 maart 1999 houdende
    wijziging van Verordening (EG) nr. 220/1999 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    producten in de sectoren slachtpluimvee en eieren, die in januari 1999 worden
    ingediend op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr. 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 632/1999 da Comissão de 24 de Março de 1999 que
    altera o Regulamento (CE) n° 220/1999 que determina em que medida podem ser aceites
    os pedidos de certificados de importação de determinados produtos do sector
    dos ovos e da carne de aves de capoeira apresentados em Janeiro de 1999 ao abrigo
    dos Regulamentos (CE) n° 1474/95 e (CE) n° 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 632/1999 de la Comisión de 24 de marzo de 1999 que
    modifica el Reglamento (CE) n° 220/1999 por el que se determina la proporción
    en que se satisfarán las solicitudes de certificados de importación de algunos
    productos del sector de los huevos y de la carne de aves de corral presentadas
    en el mes de enero de 1999 al amparo de los Reglamentos (CE) n° 1474/95 y (CE)
    n° 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 632/1999 av den 24 mars 1999 om ändring
    av förordning (EG) nr 220/1999 om fastställande av i vilken utsträckning de
    ansökningar om importlicens för vissa äggprodukter samt fjäderfäkött som
    ges in under januari 1999 inom ramen för förordningarna (EG) nr 1474/95 och
    (EG) nr 1251/96 kan godtas
  type: main
