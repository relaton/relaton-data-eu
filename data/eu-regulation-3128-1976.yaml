title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3128/76 of 16 December 1976 fixing, for
    the 1977 fishing year, withdrawal prices for the fishery products listed in Annex
    I (A) and (C) to Regulation (EEC) No 100/76 and for certain products landed in
    areas very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3128/76 de la Commission, du 16 décembre 1976, fixant,
    pour les produits de la pêche énumérés à l'annexe I sous A et C, ainsi que
    pour certains produits débarqués dans des zones très éloignées des principaux
    centres de consommation de la Communauté, du règlement (CEE) n° 100/76, les
    prix de retrait valables pour l'année 1977
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3128/76 der Kommission vom 16. Dezember 1976 zur Festsetzung
    der Rücknahmepreise für das Jahr 1977 für die im Anhang I unter A und C der
    Verordnung (EWG) Nr. 100/76 aufgeführten Fischereierzeugnisse sowie für bestimmte
    Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3128/76 af 16. december 1976 om fastsættelse
    af tilbagetagelsespriserne for året 1977 for de fiskerivarer, som er anført
    i afsnit A og C i bilag I til forordning (EØF) nr. 100/76, samt for visse af
    de i nævnte forordning omhandlede varer fra landingsområder, der ligger meget
    fjernt fra Fællesskabets vigtigste forbrugscentre
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3128/76 della Commissione, del 16 dicembre 1976, che
    fissa, per i prodotti della pesca di cui all'allegato I, lettere A e C, nonché
    per taluni prodotti sbarcati in zone molto lontane dai principali centri di consumo
    della Comunità, del regolamento (CEE) n. 100/76, i prezzi di ritiro validi per
    l'anno 1977
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3128/76 van de Commissie van 16 december 1976 tot
    vaststelling van de in 1977 geldende ophoudprijzen voor de in bijlage I, sub A
    en C, van Verordening (EEG) nr. 100/76 genoemde visserijprodukten en voor bepaalde
    produkten die in ver van de voornaamste verbruikscentra van de Gemeenschap gelegen
    gebieden zijn aangevoerd
  type: main
