title:
- language: en
  script: Latn
  content: '85/47/EEC: Commission Decision of 7 January 1985 recognizing that production
    of certain quality wines produced in specified regions is, because of their quality
    characteristics, far below demand'
  type: main
- language: fr
  script: Latn
  content: '85/47/CEE: Décision de la Commission du 7 janvier 1985 reconnaissant
    que la production de certains vins de qualité produits dans des régions déterminées
    est, du fait des caractéristiques qualitatives de ces vins, largement inférieure
    à la demande'
  type: main
- language: de
  script: Latn
  content: '85/47/EWG: Entscheidung der Kommission vom 7. Januar 1985 zur Feststellung,
    daß von Qualitätswein b. A. wegen der qualitativen Merkmale dieses Weines weit
    weniger erzeugt als nachgefragt wird'
  type: main
- language: da
  script: Latn
  content: '85/47/EØF: Kommissionens beslutning af 7. januar 1985 om anerkendelse
    af, at produktionen af visse kvalitetsvine kvbd fra bestemte dyrkningsområder
    på grund af deres kvalitative egenskaber langt fra er tilstrækkelig til at dække
    efterspørgslen'
  type: main
- language: el
  script: Grek
  content: '85/47/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Ιανουαρίου
    1985 που αναγνωρίζει ότι η παραγωγή ορισμένων
    οίνων ποιότητας που παράγονται σε καθορισμένες
    περιοχές είναι, λόγω των ποιοτικών χαρακτηριστικών
    αυτών των οίνων, σημαντικά κατώτερη από τη
    ζήτηση'
  type: main
- language: it
  script: Latn
  content: '85/47/CEE: Decisione della Commissione del 7 gennaio 1985 che riconosce
    che la produzione di taluni vini di qualità prodotti in regioni determinate è
    largamente inferiore alla domanda, a motivo delle caratteristiche qualitative
    di tali vini'
  type: main
- language: nl
  script: Latn
  content: '85/47/EEG: Beschikking van de Commissie van 7 januari 1985 waarbij wordt
    erkend dat de produktie van sommige in bepaalde gebieden voortgebrachte kwaliteitswijnen,
    gezien de kwaliteitskenmerken van die wijnen, ver bij de vraag achterblijft'
  type: main
- language: pt
  script: Latn
  content: '85/47/CEE: Decisão da Comissão, de 7 de Janeiro de 1985, que reconhece
    que a produção de certos vinhos de qualidade produzidos em regiões determinadas
    é, pelas características qualitativas desses vinhos, largamente inferior à
    procura'
  type: main
- language: es
  script: Latn
  content: '85/47/CEE: Decisión de la Comisión, de 7 de enero de 1985, por la que
    se reconoce que la producción de determinados vinos de calidad producidos en
    regiones determinadas es, debido a las características cualitativas de dichos
    vinos, muy inferior a la demanda'
  type: main
