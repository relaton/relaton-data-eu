title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2077/86 of 30 June 1986 fixing for the 1986/87
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for processed tomato products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2077/86 de la Commission du 30 juin 1986 fixant, pour
    la campagne 1986/1987, le prix minimal à payer aux producteurs pour les tomates
    ainsi que le montant de l' aide à la production pour les produits transformés
    à base de tomates
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2077/86 der Kommission vom 30. Juni 1986 zur Festsetzung
    des den Tomatenerzeugern zu zahlenden Mindestpreises sowie der Produktionsbeihilfe
    für Verarbeitungserzeugnisse aus Tomaten im Wirtschaftsjahr 1986/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2077/86 af 30. juni 1986 om fastsættelse
    af den minimumspris, der skal betales producenten for tomater, samt producentstøtten
    for forarbejdede tomater i produktionsåret 1986/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2077/86 της Επιτροπής
    της 30ής Ιουνίου 1986 για τον καθορισμό, για την
    περίοδο εμπορίας 1986/87, της ελάχιστης τιμής
    που πληρώνεται στους παραγωγούς για τις τομάτες
    και του ποσού της ενίσχυσης στην παραγωγή για
    τα προϊόντα με βάση τις τομάτες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2077/86 della Commissione del 30 giugno 1986 che fissa,
    per la campagna di commercializzazione 1986/1987, il prezzo minimo da pagare ai
    produttori di pomodori e l' importo dell' aiuto alla produzione per i prodotti
    trasformati a base di pomodoro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2077/86 van de Commissie van 30 juni 1986 tot vaststelling,
    voor het verkoopseizoen 1986/1987, van de aan de telers voor tomaten te betalen
    minimumprijs, alsmede van het bedrag van de steun bij de produktie van op basis
    van tomaten verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2077/86 da Comissão de 30 de Junho de 1986 que
    fixa para a campanha de comercialização de 1986/1987 o preço mínimo a pagar
    aos produtores para os tomates e o montante da ajuda à produção para os produtos
    transformados à base de tomate
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2077/86 de la Comisión de 30 de junio de 1986 por
    el que se establece, para la campaña 1986/87, el precio mínimo que debe pagarse
    a los productores de tomates y el importe de la ayuda a la producción de productos
    transformados a base de tomates
  type: main
