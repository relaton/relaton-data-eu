title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2675/80 of 17 October 1980 amending Regulation
    (EEC) No 1687/76 laying down common detailed rules for verifying the use and/or
    destination of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2675/80 de la Commission, du 17 octobre 1980, modifiant
    le règlement (CEE) n° 1687/76 établissant les modalités communes de contrôle
    de l' utilisation et/ou de la destination de produits provenant de l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2675/80 der Kommission vom 17. Oktober 1980 zur Änderung
    der Verordnung (EWG) Nr. 1687/76 zur Festsetzung der gemeinsamen Durchführungsbestimmungen
    für die Überwachung der Verwendung und/oder Bestimmung von Erzeugnissen aus
    Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2675/80 af 17. oktober 1980 om ændring
    af forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser for kontrol
    med anvendelse af og/eller bestemmelse for produkter fra intervention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2675/80 τής Επιτροπής
    τής 17ης Οκτωβρίου 1980 περί τροποποιήσεως τού
    κανονισμού (EOK) αριθ. 1687/76 «περί καθορισμού τών
    κοινών λεπτομερειών ελέγχου τής χρήσεως καί/ή
    τού προορισμού τών προϊόντων πού προέρχονται
    από τήν παρέμβαση»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2675/80 della Commissione, del 17 ottobre 1980, recante
    modifica del regolamento (CEE) n. 1687/76 che stabilisce modalità comuni di controllo
    dell' utilizzazione e/o della destinazione dei prodotti provenienti dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2675/80 van de Commissie van 17 oktober 1980 houdende
    wijziging van Verordening (EEG) nr. 1687/76 tot vaststelling van gemeenschappelijke
    bepalingen inzake de controle op het gebruik en/of de bestemming van produkten
    uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2675/80 da Comissão, de 17 de Outubro de 1980,
    que altera o Regulamento (CEE) n.° 1687/76 que estabelece as modalidades comuns
    de controlo da utilização e/ou do destino de produtos provenientes da intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2675/80 de la Comisión, de 17 de octobre de 1980,
    por el que se modifica el Reglamento (CEE) n° 1687/76 por el que se establecen
    las modalidades comunes de control de la utilización y/o el destino de productos
    procedentes de la intervención
