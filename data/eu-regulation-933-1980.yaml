id: EURegulation9331980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 933/80 of 14 April 1980 re-establishing
    the levying of customs duties on yarn of sheep' s or lambs' wool or of fine animal
    hair, products of category 49 (code 0490), originating in Yugoslavia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2894/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 933/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine ou de poils fins, conditionnés pour la vente au détail, de la catégorie
    49 (code 0490), originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 933/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für Garne aus Wolle oder aus feinen Tierhaaren,
    in Aufmachungen für den Einzelverkauf, der Warenkategorie Nr. 49 (Kennziffer
    0490), mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2894/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 933/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for garn af uld, hestehår eller andre dyrehår,
    i detailsalgsoplægninger under varekategori nr. 49 (kode 0490), som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 933/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana, di
    peli o di crine, preparati per la vendita al minuto, della categoria di prodotti
    n. 49 (codice 0490), originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 933/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    wol of van fijn haar, gereed voor de verkoop in het klein, van de categorie van
    produkten nr. 49 (codenummer 0490), van oorsprong uit Joegoslavië waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79
    van de Raad
  type: main
