  content: Commission Implementing Regulation (EU) 2024/1267 of 6 May 2024 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) 2021/2012
    on imports of stainless steel cold-rolled flat products originating in Indonesia
    to imports of stainless steel cold-rolled flat products consigned from Taiwan
    and Vietnam, whether declared as originating in Taiwan and Vietnam or not, and
    terminating the investigation concerning the possible circumvention of anti-dumping
    measures imposed by that Regulation by imports of stainless steel cold-rolled
    flat products consigned from Türkiye, whether declared as originating in Türkiye
    or not
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1267 de la Commission du 6 mai 2024
    étendant le droit antidumping définitif institué par le règlement d’exécution
    (UE) 2021/2012 sur les importations de produits plats laminés à froid en aciers
    inoxydables originaires d’Indonésie aux importations de produits plats laminés
    à froid en aciers inoxydables expédiés de Taïwan et du Viêt Nam, qu’ils
    aient ou non été déclarés originaires de ces pays, et clôturant l’enquête
    concernant un éventuel contournement des mesures antidumping instituées par
    ledit règlement par des importations de produits plats laminés à froid en aciers
    inoxydables expédiés de Turquie, qu’ils aient ou non été déclarés originaires
    de ce pays
