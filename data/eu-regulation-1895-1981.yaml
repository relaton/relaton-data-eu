  content: Commission Regulation (EEC) No 1895/81 of 9 July 1981 re-establishing the
    levying of customs duties on ethylene glycol, falling within subheading 29.04
    C ex I and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1895/81 de la Commission, du 9 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables à l' éthylèneglycol,
    de la sous-position 29.04 C ex I du tarif douanier commun, originaire du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3322/80 du Conseil
  type: main
