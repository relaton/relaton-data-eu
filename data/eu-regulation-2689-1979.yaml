title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2689/79 of 29 November 1979 re-establishing
    the levying of customs duties on yarn of combed sheep' s or lambs' wool (worsted
    yarn), not put up for retail sale, falling within heading No 53.07 and originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2689/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine peignée, non conditionnés pour la vente au détail, de la position 53.07
    du tarif douanier commun, originaires des pays et territoires en voie de développement,
    bénéficiaires de préférences tarifaires prévues par le règlement (CEE) n°
    1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2689/79 der Kommission vom 29. November 1979 zur Wiedereinführung
    des Zollsatzes für Kammgarne aus Wolle, nicht in Aufmachungen für den Einzelverkauf,
    der Tarifnummer 53.07 mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2689/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for garn af kæmmet uld (kamgarn), ikke i detailsalgsoplægninger
    under position 53.07, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2689/79 della Commissione, del 29 novembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana pettinata,
    non preparati per la vendita al minuto, della voce doganale 53.07, originari dei
    paesi in via di sviluppo beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2689/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kamgaren
    van wol, niet gereed voor de verkoop in het klein, van post 53.07, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 1195/79
    van de Raad tariefpreferenties werden geopend
  type: main
