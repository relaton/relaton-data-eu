    moduliams iš kristalinio silicio ir jų pagrindinėms sudėtinėms dalims (t.
    y. elementams), siunčiamiems iš Malaizijos ir Taivano ir deklaruojamiems arba
    nedeklaruojamiems kaip Malaizijos ir Taivano kilmės
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/185 tal-11 ta'
    Frar 2016 li jestendi d-dazju antidumping definittiv impost bir-Regolament tal-Kunsill
    (UE) Nru 1238/2013 fuq l-importazzjonijiet ta' moduli fotovoltajċi tas-siliċju
    kristallin u komponenti ewlenin (jiġifieri ċelloli) li joriġinaw fi jew li
    huma kkonsinjati mir-Repubblika Popolari taċ-Ċina għal importazzjonijiet ta'
    moduli fotovoltajċi tas-siliċju kristallin u komponenti ewlenin (jiġifieri
    ċelloli) ikkunsinjati mill-Malasja u t-Tajwan, kemm jekk iddikjarati bħala li
    joriġinaw fil-Malasja jew fit-Tajwan kif ukoll jekk le
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/185 van de Commissie van 11 februari 2016
    tot uitbreiding van het bij Uitvoeringsverordening (EU) nr. 1238/2013 van de Raad
    ingestelde definitieve antidumpingrecht op fotovoltaïsche modules van kristallijn
    silicium en de belangrijkste componenten daarvan (cellen), van oorsprong uit of
    verzonden uit de Volksrepubliek China, tot fotovoltaïsche modules van kristallijn
    silicium en de belangrijkste componenten daarvan (cellen) verzonden uit Maleisië
    en Taiwan, al dan niet aangegeven als van oorsprong uit Maleisië en Taiwan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/185 z dnia 11 lutego 2016
    r. rozszerzające ostateczne cło antydumpingowe nałożone rozporządzeniem Rady
    (UE) nr 1238/2013 na przywóz modułów fotowoltaicznych z krzemu krystalicznego
    i głównych komponentów (tj. ogniw) pochodzących lub wysyłanych z Chińskiej
    Republiki Ludowej, na przywóz modułów fotowoltaicznych z krzemu krystalicznego
    i głównych komponentów (tj. ogniw) wysyłanych z Malezji i Tajwanu, zgłoszonych
