  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/185 da Comissão, de 11 de fevereiro
    de 2016, que torna extensivo o direito anti-dumping definitivo instituído pelo
    Regulamento (UE) n.° 1238/2013 do Conselho, sobre as importações de módulos
    fotovoltaicos de silício cristalino e de componentes-chave (ou seja, células)
    originários ou expedidos da República Popular da China, às importações de
    módulos fotovoltaicos de silício cristalino e de componentes-chave (ou seja,
    células) expedidos da Malásia e de Taiwan, independentemente de serem ou não
    declarados originários da Malásia e de Taiwan
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/185 al Comisiei din 11 februarie
    2016 de extindere a taxei antidumping definitive instituite prin Regulamentul
    (UE) nr. 1238/2013 al Consiliului la importurile de module fotovoltaice pe bază
    de siliciu cristalin și componentele lor cheie (și anume celule) originare sau
    expediate din Republica Populară Chineză prin importuri de module fotovoltaice
    pe bază de siliciu cristalin și componentele lor cheie (și anume celule) expediate
    din Malaysia și Taiwan, indiferent dacă au fost sau nu declarate ca fiind originare
    din Malaysia sau din Taiwan
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/185 z 11. februára 2016, ktorým
    sa rozširuje konečné antidumpingové clo uložené nariadením Rady (EÚ) č.
    1238/2013 o dovoze fotovoltických modulov na báze kryštalického kremíka a
    hlavných komponentov (t. j. článkov) s pôvodom v Čínskej ľudovej republike
    alebo odosielaných z Čínskej ľudovej republiky na dovoz fotovoltických modulov
    na báze kryštalického kremíka a hlavných komponentov (t. j. článkov) odosielaných
    z Malajzie a Taiwanu bez ohľadu na to, či majú alebo nemajú deklarovaný pôvod
    v Malajzii a na Taiwane
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/185 z dne 11. februarja 2016 o razširitvi
    dokončne protidampinške dajatve, uvedene z Izvedbeno uredbo Sveta (EU) št.
    1238/2013, na uvoz fotonapetostnih modulov iz kristalnega silicija in njihovih
    ključnih sestavnih delov (tj. celic), poslanih iz Malezije ali s Tajvana, ne
    glede na to, ali so deklarirani kot izdelki s poreklom iz Malezije in Tajvana
    ali ne
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/185 de la Comisión, de 11 de febrero
    de 2016, por el que se amplía el derecho antidumping definitivo establecido por
    el Reglamento (UE) n.° 1238/2013 del Consejo a las importaciones de módulos
    fotovoltaicos de silicio cristalino y componentes clave (a saber, células) originarios
    o procedentes de la República Popular China, a las importaciones de módulos
    fotovoltaicos de silicio cristalino y componentes clave (a saber, células) procedentes
    de Malasia y de Taiwán, tanto si se declaran originarios de Malasia o de Taiwán
    como si no
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/185 av den 11 februari
    2016 om utvidgning av den slutgiltiga antidumpningstull som genom rådets förordning
    (EU) nr 1238/2013 införts på import av solcellsmoduler av kristallint kisel
    samt väsentliga komponenter (dvs. celler) med ursprung i eller avsända från
    Folkrepubliken Kina till att även omfatta import av solcellsmoduler av kristallint
    kisel samt väsentliga komponenter (dvs. celler) avsända från Malaysia och Taiwan,
    oavsett om produktens deklarerade ursprung är Malaysia och Taiwan eller inte
