    moodulite ja nende põhikomponentide (elementide) impordi suhtes nõukogu rakendusmäärusega
    (EL) nr 1238/2013 kehtestatud lõplikku dumpinguvastast tollimaksu Malaisiast
    ja Taiwanist lähetatud kristalsest ränist fotoelektriliste moodulite ja nende
    põhikomponentide (elementide) impordile, olenemata sellest, kas need on deklareeritud
    Malaisiast või Taiwanist pärinevatena või mitte
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/185, annettu 11 päivänä
    helmikuuta 2016, Kiinan kansantasavallasta peräisin olevien tai sieltä lähetettyjen
    kiteisestä piistä valmistettujen aurinkosähkömoduulien ja niiden keskeisten
    komponenttien (kennot) tuonnissa neuvoston asetuksella (EU) N:o 1238/2013 käyttöön
    otetun lopullisen polkumyyntitullin laajentamisesta koskemaan Malesiasta ja Taiwanista
    lähetettyjen kiteisestä piistä valmistettujen aurinkosähkömoduulien ja niiden
    keskeisten komponenttien (kennot) tuontia, riippumatta siitä, onko niiden alkuperämaaksi
    ilmoitettu Malesia tai Taiwan
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/185 оd 11. veljače 2016. o proširenju
    konačne antidampinške pristojbe uvedene Uredbom Vijeća (EU) br. 1238/2013 na
    uvoz kristalnih silicijskih fotonaponskih modula i ključnih elemenata (tj. ćelija)
    podrijetlom ili poslanih iz Narodne Republike Kine na uvoz kristalnih silicijskih
    fotonaponskih modula i ključnih elemenata (tj. ćelija) poslanih iz Malezije
    i Tajvana, neovisno o tome jesu li deklarirani kao proizvod podrijetlom iz Malezije
    i Tajvana
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/185 végrehajtási rendelete (2016. február 11.)
    a Kínai Népköztársaságból származó vagy ott feladott kristályos szilícium
    fotovillamos modulok és alapvető részeik (azaz elemek) behozatalára az 1238/2013/EU
    tanácsi rendelettel kivetett végleges dömpingellenes vámnak a Malajziában
    és Tajvanon feladott – függetlenül attól, hogy az árut Malajziából és
    Tajvanról származóként jelentették-e be vagy sem – kristályos szilícium
    fotovillamos modulok és alapvető részeik (azaz elemek) behozatalára történő
    kiterjesztéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/185 della Commissione, dell'11 febbraio
    2016, che estende il dazio antidumping definitivo istituito dal regolamento (UE)
    n. 1238/2013 del Consiglio sulle importazioni di moduli fotovoltaici in silicio
    cristallino e delle loro componenti essenziali (celle) originari o provenienti
    dalla Repubblica popolare cinese alle importazioni di moduli fotovoltaici in silicio
    cristallino e delle loro componenti essenziali (celle) provenienti dalla Malaysia
    e da Taiwan indipendentemente dal fatto che siano dichiarati o no originari della
    Malaysia e di Taiwan
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/185 (2016. gada 11. februāris),
    ar ko galīgo antidempinga maksājumu, kas ar Padomes Regulu (ES) Nr. 1238/2013
    noteikts tādu kristāliskā silīcija fotoelektrisko moduļu un to galveno sastāvdaļu
    (proti, elementu) importam, kuru izcelsme ir Ķīnas Tautas Republikā vai kuri
    nosūtīti no Ķīnas Tautas Republikas, attiecina arī uz to kristāliskā silīcija
    fotoelektrisko moduļu un to galveno sastāvdaļu (proti, elementu) importu, kuri
    nosūtīti no Malaizijas un Taivānas, neatkarīgi no tā, vai tiem deklarēta
    Malaizijas un Taivānas izcelsme
  type: main
- language: lt
  script: Latn
  content: 2016 m. vasario 11 d. Komisijos įgyvendinimo reglamentas (ES) 2016/185,
    kuriuo galutinio antidempingo muito, Tarybos reglamentu (ES) Nr. 1239/2013 nustatyto
