    δηλώνονται ως καταγωγής Μαλαισίας και Ταϊβάν
    είτε όχι
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/185, 11. veebruar 2016, millega laiendatakse
