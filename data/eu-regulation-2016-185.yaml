---
id: EURegulation2016185
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/185 of 11 February 2016 extending
    the definitive anti-dumping duty imposed by Council Regulation (EU) No 1238/2013
    on imports of crystalline silicon photovoltaic modules and key components (i.e.
    cells) originating in or consigned from the People's Republic of China to imports
    of crystalline silicon photovoltaic modules and key components (i.e. cells) consigned
    from Malaysia and Taiwan, whether declared as originating in Malaysia and in Taiwan
    or not
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/185 de la Commission du 11 février 2016
    portant extension du droit antidumping définitif institué par le règlement
    (UE) n° 1238/2013 du Conseil sur les importations de modules photovoltaïques
    en silicium cristallin et leurs composants essentiels (cellules) originaires ou
    en provenance de la République populaire de Chine aux importations de modules
    photovoltaïques en silicium cristallin et leurs composants essentiels (cellules)
    expédiés de Malaisie et de Taïwan, qu'ils aient ou non été déclarés originaires
    de ces pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/185 der Kommission vom 11. Februar 2016
    zur Ausweitung des mit der Verordnung (EU) Nr. 1238/2013 des Rates eingeführten
    endgültigen Antidumpingzolls auf Einfuhren von Fotovoltaikmodulen aus kristallinem
    Silicium und Schlüsselkomponenten davon (Zellen) mit Ursprung in oder versandt
    aus der Volksrepublik China auf aus Malaysia und Taiwan versandte Einfuhren von
    Fotovoltaikmodulen aus kristallinem Silicium und Schlüsselkomponenten davon (Zellen),
    ob als Ursprungserzeugnisse Malaysias oder Taiwans angemeldet oder nicht
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/185 на Комисията
    от 11 февруари 2016 година за разширяване на обхвата
    на окончателното антидъмпингово мито, наложено
    с Регламент за изпълнение (ЕС) № 1238/2013 на Съвета
    върху вноса на кристални силициеви фотоволтаични
    модули и ключови компоненти (т.е. елементи)
    с произход или изпратени от Китайската народна
    република, за да включва вноса на кристални
    силициеви фотоволтаични модули и ключови компоненти
    (т.е. елементи), изпращан от Малайзия и Тайван,
    независимо дали е с деклариран произход от
    Малайзия и Тайван
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/185 ze dne 11. února 2016, kterým
    se konečné antidumpingové clo uložené nařízením Rady (EU) č. 1238/2013
    na dovoz krystalických křemíkových fotovoltaických modulů a jejich klíčových
    komponentů (tj. článků) pocházejících nebo odesílaných z Čínské lidové
    republiky rozšiřuje na dovoz krystalických křemíkových fotovoltaických
    modulů a jejich klíčových komponentů (tj. článků) odesílaných z Malajsie
    a Tchaj-wanu, bez ohledu na to, zda je u nich deklarován původ z Malajsie a
    Tchaj-wanu, či nikoli
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/185 af 11. februar 2016
    om udvidelse af den endelige antidumpingtold, der indførtes ved Rådets forordning
    (EU) nr. 1238/2013 på importen af fotovoltaiske moduler af krystallinsk silicium
    og nøglekomponenter hertil (dvs. celler) med oprindelse i eller afsendt fra Folkerepublikken
    Kina, til at omfatte importen af fotovoltaiske moduler af krystallinsk silicium
    og nøglekomponenter hertil (dvs. celler) afsendt fra Malaysia og Taiwan, uanset
    om varen er angivet med oprindelse i Malaysia og Taiwan
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/185 της Επιτροπής,
    της 11ης Φεβρουαρίου 2016, για την επέκταση του
    οριστικού δασμού αντιντάμπινγκ που επιβλήθηκε
    με τον κανονισμό (ΕΕ) αριθ. 1238/2013 του Συμβουλίου
