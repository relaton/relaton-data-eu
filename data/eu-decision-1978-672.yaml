  type: main
- language: it
  script: Latn
  content: '78/672/CEE: Decisione della Commissione, del 13 luglio 1978, che modifica
    la decisione 76/481/CEE che autorizza l''Italia a prolungare, per determinate
    regioni, il periodo di realizzazione dei piani di sviluppo delle aziende, a norma
    dell''articolo 4, paragrafo 6, della direttiva 72/159/CEE del Consiglio, del 17
    aprile 1972, relativa all''ammodernamento delle aziende agricole (Il testo in
    lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
