    Ιουλίου 1978, περί τροποποίησης της Απόφασης
    78/481/ΕΟΚ σχετικά με την παράταση της διάρκειας
    των σχεδίων ανάπτυξης των εκμεταλλεύσεων σε
    ορισμένες περιοχές της Ιταλίας σύμφωνα με
