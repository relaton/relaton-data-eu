title:
- language: en
  script: Latn
  content: '78/672/EEC: Commission Decision of 13 July 1978 amending Decision 76/481/EEC
    concerning the prolongation of farm development plans in certain regions of Italy
    pursuant to Article 4 (6) of Council Directive 72/159/EEC of 17 April 1972 on
    the modernization of farms (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/672/CEE: Décision de la Commission, du 13 juillet 1978, portant modification
    de la décision 76/481/CEE relative à la prolongation de la durée des plans
    de développement des exploitations dans certaines régions d''Italie conformément
    à l''article 4 paragraphe 6 de la directive 72/159/CEE du Conseil, du 17 avril
    1972, concernant la modernisation des exploitations agricoles (Le texte en langue
    italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '78/672/EWG: Entscheidung der Kommission vom 13. Juli 1978 zur Änderung
    der Entscheidung 76/481/EWG betreffend die Verlängerung der Laufzeit der Betriebsentwicklungspläne
    gemäß Artikel 4 Absatz 6 der Richtlinie 72/159/EWG des Rates vom 17. April 1972
    über die Modernisierung der landwirtschaftlichen Betriebe für bestimmte Gebiete
    in Italien (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/672/EØF: Kommissionens beslutning af 13. juli 1978 om ændring af
    beslutning 76/481/EØF vedrørende forlængelse af løbetiden for bedriftsudviklingsplaner
    i visse områder i Italien i henhold til artikel 4, stk. 6, i Rådets direktiv
    72/159/EØF af 17. april 1972 om modernisering af landbrugsbedrifter (Kun den
    italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
