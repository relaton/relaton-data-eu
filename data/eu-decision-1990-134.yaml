title:
- language: en
  script: Latn
  content: '90/134/EEC: Commission Decision of 6 March 1990 amending for the second
    time Council Directive 82/894/EEC on the notification of animal diseases within
    the Community and temporarily amending the frequency of notification for bovine
    spongiform encephalopathy'
  type: main
- language: fr
  script: Latn
  content: '90/134/CEE: Décision de la Commission du 6 mars 1990 portant deuxième
    modification de la directive 82/894/CEE du Conseil concernant la notification
    des maladies des animaux dans la Communauté et modifiant temporairement la fréquence
    de la notification concernant l''encéphalopathie spongiforme bovine'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 6. Maerz 1990 zur zweiten Aenderung der
    Richtlinie 82/894/EWG des Rates ueber die Mitteilung von Viehseuchen in der Gemeinschaft
    und zur zeitweiligen Aenderung der Haeufigkeit der Meldepflicht bei Auftreten
    der spongiformen Rinderenzephalopathie (90/134/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 6. marts 1990 om anden aendring af Raadets
    direktiv 82/894/EOEF om anmeldelse af dyresygdomme inden for Faellesskabet og
    om midlertidig aendring af hyppigheden af anmeldelser vedroerende bovin spongiform
    encephalopati (90/134/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/134/ΕΟΚ: Απόφαση της Επιτροπής της 6ης Μαρτίου
    1990 για δεύτερη τροποποίηση της οδηγίας 82/894/ΕΟΚ
    του Συμβουλίου για την κοινοποίηση των ασθενειών
    των ζώων μέσα στην Κοινότητα και για την προσωρινή
    τροποποίηση της συχνότητας της κοινοποίησης,
    όσον αφορά τη σπογγώδη εγκεφαλοπάθεια των
    βοοειδών'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 6 marzo 1990 recante seconda modifica della
    direttiva 82/894/CEE del Consiglio concernente la notifica delle malattie degli
    animali della Comunità, recante modifica a titolo temporaneo della frequenza
    di notifica dell'encefalopatia spongiforme dei bovini (90/134/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 6 maart 1990 tot tweede wijziging van
    de bijlagen bij Richtlijn 82/894/EEG van de Raad inzake de melding van dierziekten
    in de Gemeenschap, en tot tijdelijke wijziging van de meldingsfrequentie met betrekking
    tot bovine spongiforme encefalopathie (90/134/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 6 de Março de 1990 que altera pela segunda vez
    a Directiva 82/894/CEE do Conselho relativa à notificaçao de doenças dos animais
    na Comunidade e altera temporariamente a frequência da notificaçao respeitante
    à encefalopatia espongiforme bovina (90/134/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 6 de marzo de 1990 por la que se modifica, por
    segunda vez, la Directiva 82/894/CEE del Consejo relativa a la notificacion de
    las enfermedades de los animales en la Comunidad, y por la que se modifica temporalmente
    la frecuencia de la notificacion de la encefalopatia espongiforme bovina (90/134/CEE)
