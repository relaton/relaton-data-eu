    Beträge, die auf die das Gebiet 5 verlassenden Erzeugnisse zu erheben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 226/87 af 26. januar 1987 om fastsættelse
    for Storbritannien af den variable præmie for slagtning af får og af de beløb,
    der skal opkræves for produkter, som udføres fra område 5
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 226/87 της Επιτροπής
