    της μεταβλητής πριμοδοτήσεως κατά τη σφαγή
    των προβατοειδών για τη Μεγάλη Βρετανία και
    των ποσών προς είσπραξη για τα προϊόντα που
    εξάγονται από την περιοχή 5
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 226/87 della Commissione, del 26 gennaio 1987, che
