title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 226/87 of 26 January 1987 fixing for Great
    Britain the level of the variable slaughter premium for sheep and the amounts
    to be charged on products leaving region 5
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 226/87 de la Commission, du 26 janvier 1987, fixant
    pour la Grande-Bretagne le montant de la prime variable à l'abattage des ovins
    et les montants à percevoir sur les produits quittant la région 5
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 226/87 der Kommission vom 26. Januar 1987 zur Festsetzung
