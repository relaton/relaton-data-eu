    degli ovini e gli importi da riscuotere all'uscita di determinati prodotti dal
    territorio della regione 5
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 226/87 van de Commissie van 26 januari 1987 tot vaststelling,
    voor Groot-Brittannië, van het bedrag van de variabele slachtpremie voor schapen
    en van de bedragen die moeten worden geheven op produkten bij het verlaten van
    regio 5
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 226/87 da Comissão, de 26 de Janeiro de 1987, que
