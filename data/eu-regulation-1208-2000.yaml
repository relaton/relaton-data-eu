title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1208/2000 of 8 June 2000 amending Council
    Regulation (EC) No 1420/1999 establishing common rules and procedures to apply
    to shipments of certain types of waste from the European Community to Bulgaria
    and Nigeria, and Regulation (EC) No 1547/1999 concerning the control procedures
    to apply to shipments of certain types of waste to Bulgaria and Nigeria
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1208/2000 de la Commission du 8 juin 2000 modifiant
    le règlement (CE) nº 1420/1999 du Conseil établissant des règles communes
    et des procédures à appliquer aux transferts de certains types de déchets de
    la Communauté européenne vers la Bulgarie et le Nigeria, et le règlement (CE)
    nº 1547/1999 concernant les procédures de contrôle à appliquer aux transferts
    de certains types de déchets vers la Bulgarie et le Nigeria
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1208/2000 der Kommission vom 8. Juni 2000 zur Änderung
    der Verordnung (EG) Nr. 1420/1999 des Rates zur Festlegung gemeinsamer Regeln
    und Verfahren für die Verbringung bestimmter Arten von Abfällen aus der Europäischen
    Gemeinschaft nach Bulgarien und Nigeria und der Verordnung (EG) Nr. 1547/1999
    zur Festlegung der bei der Verbringung bestimmter Arten von Abfällen nach Bulgarien
    und Nigeria anzuwendenden Kontrollverfahren
  type: main
