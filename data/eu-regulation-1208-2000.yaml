    da Comunidade Europeia para a Bulgária e Nigéria, o Regulamento (CE) n.o 1420/1999
    que estabelece regras e procedimentos comuns aplicáveis às transferências de
    determinados tipos de resíduos para certos países não membros da OCDE e o Regulamento
    (CE) n.o 1547/1999 que determina os processos de controlo a aplicar às transferências
    de certos tipos de resíduos para certos países onde não é aplicável a Decisão
    C(92) 39 final da OCDE
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1208/2000 al Comisiei din 8 iunie 2000 de modificare
    a Regulamentului (CE) nr. 1420/1999 al Consiliului de stabilire a normelor și
    procedurilor comune aplicabile transporturilor de anumite tipuri de deșeuri din
    Comunitatea Europeană către Bulgaria și Nigeria și a Regulamentului (CE) nr.
    1547/1999 privind procedurile de control aplicabile transporturilor de anumite
    tipuri de deșeuri către Bulgaria și Nigeria
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1208/2000 z 8. júna 2000, ktorým sa mení
    a dopĺňa nariadenie Rady (ES) č. 1420/1999 ustanovujúce spoločné pravidlá
    a postupy, ktoré sa vzťahujú na zásielky určitých druhov odpadov z Európskeho
    spoločenstva do Bulharska a Nigérie a nariadenie (ES) č. 1547/1999 určujúce
    kontrolné postupy, ktoré sa majú uplatňovať pri zásielkách určitých druhov
    odpadov do Bulharska a Nigérie
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1208/2000 z dne 8. junija 2000 o spremembi Uredbe
    Sveta (ES) št. 1420/1999 o določitvi skupnih pravil in postopkov, ki se uporabljajo
    za pošiljke določenih vrst odpadkov iz Evropske skupnosti v Bolgarijo in Nigerijo,
    ter Uredbe (ES) št. 1547/1999 o določitvi kontrolnih postopkov, ki se uporabljajo
    za pošiljke določenih vrst odpadkov v Bolgarijo in Nigerijo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1208/2000 de la Comisión, de 8 de junio de 2000, por
    el que se modifican, en lo que respecta a los traslados de ciertos tipos de residuos
    a Bulgaria y Nigeria, el Reglamento (CE) nº 1420/1999, por el que se establecen
    normas y procedimientos comunes aplicables a los traslados de ciertos tipos de
    residuos a determinados países no miembros de la OCDE, y el Reglamento (CE) nº
    1547/1999 por el que se determinan los procedimientos de control que deberán
    aplicarse a los traslados de algunos residuos a determinados países a los que
    no es aplicable la Decisión C(92)39 final de la OCDE
  type: main
