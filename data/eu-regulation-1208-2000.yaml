  script: Latn
  content: Uredba Komisije (EZ) br. 1208/2000 od 8. lipnja 2000. o izmjeni Uredbe
    Vijeća (EZ) br. 1420/1999 o utvrđivanju jedinstvenih pravila i postupaka koji
    se primjenjuju na pošiljke određenih vrsta otpada iz Europske zajednice u Bugarsku
    i Nigeriju, i Uredbe (EZ) br. 1547/1999 o kontrolnim postupcima za otpremu određenih
    vrsta otpada u Bugarsku i Nigeriju
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1208/2000/EK rendelete (2000. június 8.) egyes hulladékfajtáknak
    az Európai Közösségből Bulgáriába és Nigériába történő szállítására
    alkalmazandó közös szabályok és eljárások meghatározása tekintetében
    az 1420/1999/EK tanácsi rendelet, továbbá egyes hulladékfajtáknak Bulgáriába
    és Nigériába történő szállítására alkalmazandó ellenőrzési eljárások
    vonatkozásában az 1547/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1208/2000 della Commissione, dell'8 giugno 2000, che
    modifica il regolamento (CE) n. 1420/1999 del Consiglio recante regole e procedure
    comuni per le spedizioni di determinati tipi di rifiuti dalla Comunità europea
    verso la Bulgaria e la Nigeria, e il regolamento (CE) n. 1547/1999 che stabilisce
    la procedura di controllo in relazione alle spedizioni di determinati tipi di
    rifiuti verso la Bulgaria e la Nigeria
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1208/2000 (2000. gada 8. jūnijs), ar ko groza
    Padomes Regulu (EK) Nr. 1420/1999, ieviešot kopīgus noteikumus un procedūras
    dažu veidu atkritumu sūtīšanai no Eiropas Kopienas uz Bulgāriju un Nigēriju,
    un Regulu (EK) Nr. 1547/1999 par kontroles procedūrām dažu veidu atkritumu
    sūtīšanai uz Bulgāriju un Nigēriju
  type: main
- language: lt
  script: Latn
  content: 2000 m. birželio 8 d. Komisijos reglamentas (EB) Nr. 1208/2000, iš dalies
    keičiantis Tarybos reglamentą (EB) Nr. 1420/1999, nustatantį bendrąsias taisykles
    ir tvarką, taikytiną kai kurių rūšių atliekų vežimui iš Europos bendrijos
    į Bulgariją ir Nigeriją, bei Reglamentą (EB) Nr. 1547/1999 dėl kontrolės,
    taikytinos kai kurių rūšių atliekų vežimui į Bulgariją ir Nigeriją, tvarkos
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1208/2000 tat-8 ta'Ġunju 2000 li
    jemenda r-Regolament tal-Kunsill (KE) Nru 1420/1999 li jistabilixxi regoli u proċeduri
    komuni li għandhom jiġu applikati għat-trasport ta' ċerti tipi ta' skart mill-Komunità
    Ewropea lejn il-Bulgarija u in-Niġerja, u r-Regolament (KE) Nru 1547/1999 li
    jirrigwarda l-proċeduri ta' kontroll li għandhom japplikaw għat-trasport ta'
    ċerti tipi ta' skart lejn il-Bulgarija u in-Niġerja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1208/2000 van de Commissie van 8 juni 2000 tot wijziging
    van Verordening (EG) nr. 1420/1999 van de Raad van 29 april 1999 tot vaststelling
    van gemeenschappelijke voorschriften en procedures voor de overbrenging van bepaalde
    soorten afvalstoffen van de Europese Gemeenschap naar Bulgarije en Nigeria, en
    Verordening (EG) nr. 1547/1999 van de Commissie van 12 juli 1999 tot vaststelling
    van de controleprocedures die moeten worden toegepast voor de overbrenging van
    bepaalde soorten afvalstoffen naar Bulgarije en Nigeria
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1208/2000 z dnia 8 czerwca 2000 r. zmieniające
    rozporządzenie Rady (WE) nr 1420/1999 ustanawiające wspólne zasady i procedury
    stosowane do wysyłki niektórych rodzajów odpadów ze Wspólnoty Europejskiej
    do Bułgarii i Nigerii oraz rozporządzenie (WE) nr 1547/1999 dotyczące procedur
    kontrolnych mających zastosowanie do wysyłek niektórych rodzajów odpadów
    do Bułgarii i Nigerii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1208/2000 da Comissão, de 8 de Junho de 2000, que
