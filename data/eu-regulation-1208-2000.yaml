    mění nařízení Rady (ES) č. 1420/1999, kterým se stanoví společná pravidla
    a postupy pro přepravu některých druhů odpadů z Evropského společenství
    do Bulharska a Nigérie, a nařízení (ES) č. 1547/1999 o kontrolních postupech
    pro přepravu některých druhů odpadů do Bulharska a Nigérie
  type: main
