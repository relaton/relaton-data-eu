title:
- language: en
  script: Latn
  content: '82/524/EEC: Commission Decision of 20 July 1982 establishing that the
    apparatus described as ''Perkin Elmer - Gas Chromatograph, model Sigma 2'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/524/CEE: Décision de la Commission, du 20 juillet 1982, constatant
    que l''importation de l''appareil dénommé "Perkin Elmer - gas chromatograph,
    model Sigma 2" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/524/EWG: Entscheidung der Kommission vom 20. Juli 1982, mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer - Gas Chromatograph, model Sigma 2" nicht
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/524/EØF: Kommissionens beslutning af 20. juli 1982 om fastslåelse
    af, at indførsel af apparatet "Perkin Elmer- Gas Chromatograph, model Sigma 2"
    ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/524/EOK: Απόφαση τής Επιτροπής τής 20ής Ιουλίου
