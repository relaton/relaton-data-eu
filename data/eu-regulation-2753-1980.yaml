id: EURegulation27531980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2753/80 of 28 October 1980 amending Regulation
    (EEC) No 2325/80 laying down detailed rules for the application of the additional
    measures applicable to holders of long-term storage contracts for table wine for
    the 1979/80 wine-growing year and Regulations (EEC) No 2187/79 and (EEC) No 2281/79
    as regards the quantity of table wine which may be the subject of a delivery contract
    in the context of the said additional measures
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2753/80 de la Commission, du 28 octobre 1980, portant
    modification du règlement (CEE) n° 2325/80 établissant les modalités d' application
    des mesures complémentaires réservées aux détenteurs de contrats de stockage
    à long terme des vins de table pour la campagne 1979/1980, ainsi que des règlements
    (CEE) n° 2187/79 et (CEE) n° 2281/79 en ce qui concerne la quantité de vin
    de table pouvant faire l' objet d' un contrat de livraison dans le cadre des mesures
    complémentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2753/80 der Kommission vom 28. Oktober 1980 zur Änderung
    der Verordnung (EWG) Nr. 2325/80 zur Festlegung der Durchführungsbestimmungen
    für die Inhabern langfristiger Lagerverträge für Tafelweine vorbehaltenen ergänzenden
    Maßnahmen für das Wirtschaftsjahr 1979/80 sowie der Verordnungen (EWG) Nr. 2187/79
    und (EWG) Nr. 2281/79 bezüglich der Tafelweinmenge, für die im Rahmen der ergänzenden
    Maßnahmen ein Liefervertrag abgeschlossen werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2753/80 af 28. oktober 1980 om ændring
    af forordning (EØF) nr. 2325/80 om fastsættelse af gennemførelsesbestemmelser
    for de supplerende foranstaltninger, der er forbeholdt indehavere af langfristede
    oplagringskontrakter for bordvin for produktionsåret 1979/80, samt af forordning
    (EØF) nr. 2187/79 og (EØF) nr. 2281/79, for så vidt angår de bordvinsmængder,
    for hvilke der kan indgås leveringskontrakter som led i de supplerende foranstaltninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2753/80 της Επιτροπής
    της 28ης Οκτωβρίου 1980 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 2325/80 «περί καθορισμού
    των λεπτομερειών εφαρμογής συμπληρωματικών
    μέτρων που επιφυλάσσονται στους δικαιούχους
    μακροπροθέσμου αποθεματοποιήσεως για τους
    επιτραπεζίους οίνους της περιόδου 1979/80» καθώς
    και των κανονισμών (ΕΟΚ) αριθ. 2187/79 και 2281/79 όσον
    αφορά την ποσότητα του επιτραπεζίου οίνου
    που δύναται να αποτελέσει αντικείμενο συμφωνητικού
    παραδόσεως στα πλαίσια των συμπληρωματικών
    μέτρων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2753/80 della Commissione, del 28 ottobre 1980, recante
    modifica del regolamento (CEE) n. 2325/80 che stabilisce le modalità di applicazione
    delle misure complementari riservate ai titolari di contratti di magazzinaggio
    a lungo termine dei vini da tavola per la campagna 1979/1980, nonché dei regolamenti
    (CEE) n. 2187/79 e (CEE) n. 2281/79 per quanto riguarda il quantitativo di vino
    da tavola che può essere oggetto di un contratto di consegna nel quadro delle
    misure complementari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2753/80 van de Commissie van 28 oktober 1980 tot
    wijziging van Verordening (EEG) nr. 2325/80 tot vaststelling van de bepalingen
    ter uitvoering van de aanvullende maatregelen ten behoeve van degenen die voor
    het wijnoogstjaar 1979/1980 langlopende opslagcontracten voor tafelwijn hebben
    gesloten, alsmede van de Verordeningen (EEG) nr. 2187/79 en (EEG) nr. 2281/79
    met betrekking tot de hoeveelheid tafelwijn waarvoor in het kader van de aanvullende
    maatregelen leveringscontracten kunnen worden gesloten
  type: main
