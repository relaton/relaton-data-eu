    stanoví odchylky od nařízení (ES) č. 174/1999, kterým se stanoví zvláštní
    prováděcí pravidla k nařízení Rady (EHS) č. 804/68, pokud jde o vývozní
    licence a vývozní náhrady pro mléko a mléčné výrobky, a od nařízení
    (ES) č. 800/1999, kterým se stanoví společná prováděcí pravidla k režimu
    vývozních náhrad pro zemědělské produkty
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 348/2002 af 25. februar 2002 om fravigelse
