    asetuksesta (EY) N:o 800/1999 poikkeamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 348/2002/EK rendelete (2002. február 25.) a tejre és tejtermékekre
    vonatkozó kiviteli engedélyek és export-visszatérítések tekintetében a
    804/68/EGK tanácsi rendelet alkalmazására vonatkozó különös részletes
    szabályainak megállapításáról szóló 174/1999/EK rendelettől, valamint
    a mezőgazdasági termékek után járó export-visszatérítési rendszer alkalmazása
    közös részletes szabályainak megállapításáról szóló 800/1999/EK rendelettől
    való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 348/2002 della Commissione, del 25 febbraio 2002, recante
    deroga al regolamento (CE) n. 174/1999 recante modalità particolari di applicazione
    del regolamento (CEE) n. 804/68 del Consiglio, riguardo ai titoli di esportazione
    e alle restituzioni all'esportazione nel settore del latte e dei prodotti lattiero-caseari
    nonché al regolamento (CE) n. 800/1999 recante modalità comuni di applicazione
    del regime delle restituzioni all'esportazione per i prodotti agricoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 348/2002 (2002. gada 25. februāris), ar kuru
    atkāpjas no Regulas (EK) Nr. 174/1999, ar ko nosaka īpašus sīki izstrādātus
    noteikumus Padomes Regulas (EEK) Nr. 804/68 piemērošanai attiecībā uz piena
    un piena produktu eksporta licencēm un eksporta kompensācijām, un ar kuru atkāpjas
    no Regulas (EK) Nr. 800/1999, kas nosaka sīki izstrādātus kopīgus noteikumus,
    kas jāievēro, piemērojot eksporta kompensāciju sistēmu lauksaimniecības
    produktiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. vasario 25 d. Komisijos reglamentas (EB) Nr. 348/2002, nukrypstantis
    nuo Reglamento (EB) Nr. 174/1999, nustatančio išsamias specialiąsias Tarybos
    reglamento (EEB) Nr. 804/68 taikymo taisykles dėl pieno ir pieno produktų eksporto
    licencijų ir eksporto grąžinamųjų išmokų, ir nuo Reglamento (EB) Nr. 800/1999,
    nustatančio bendrąsias išsamias eksporto grąžinamųjų išmokų sistemos
    taikymo žemės ūkio produktams taisykles
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 348/2002 tal-25 ta’ Frar 2002
    li jidderoga mir-Regolament (KE) Nru 174/1999 li jistipula regoli dettaljati speċjali
    għall-applikazzjoni tar-Regolament tal-Kunsill (KEE) Nru 804/68 dwar il-liċenzi
    ta’ l-esportazzjoni u r-rifużjonijiet ta’ l-esportazzjoni fil-każ tal-ħalib
    u l-prodotti tal-ħalib u mir-Regolament (KE) Nru 800/1999 li jistipula regoli
    dettaljati komuni għall-applikazzjoni tas-sistemi tar-rifużjoni ta’ l-esportazzjoni
    għall-prodotti agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 348/2002 van de Commissie van 25 februari 2002 houdende
    afwĳking van Verordening (EG) nr. 174/1999 tot vaststelling van de specifieke
    uitvoeringsbepalingen van Verordening (EEG) nr. 804/68 van de Raad inzake de uitvoercertificaten
    en de uitvoerrestituties in de sector melk en zuivelproducten en houdende afwĳking
    van Verordening (EG) nr. 800/1999 houdende gemeenschappelĳke uitvoeringsbepalingen
    van het stelsel van restituties bĳ uitvoer voor landbouwproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 348/2002 z dnia 25 lutego 2002 r. wprowadzające
    odstępstwo od rozporządzenia (WE) nr 174/1999 ustanawiającego specjalne szczegółowe
    zasady stosowania rozporządzenia Rady (EWG) nr 804/68 w odniesieniu do pozwoleń
    na wywóz i refundacji wywozowych do mleka i przetworów mlecznych oraz od rozporządzenia
    (WE) nr 800/1999 ustanawiającego wspólne szczegółowe zasady stosowania systemu
    refundacji wywozowych w odniesieniu do produktów rolnych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 348/2002 da Comissão, de 25 de Fevereiro de 2002,
    que derroga ao Regulamento (CE) n.° 174/1999 que estabelece as normas especiais
    de execução do Regulamento (CEE) n.° 804/68 do Conselho no que respeita aos
    certificados de exportação e às restituições à exportação no sector do
    leite e dos produtos lácteos, e ao Regulamento (CE) n.° 800/1999 que estabelece
    regras comuns de execução do regime das restituições à exportação para
    os produtos agrícolas
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie (ES) č. 348/2002 z 25. februára 2002, ktorým sa
    ustanovuje výnimka z nariadenia (ES) č. 174/1999, ktorým sa stanovujú osobitné
    podrobné pravidlá uplatňovania nariadenia Rady (EHS) č. 804/68, pokiaľ ide
    o vývozné licencie a vývozné náhrady v prípade mlieka a mliečnych výrobkov,
    a z nariadenia (ES) č. 800/1999, ktorým sa stanovujú spoločné podrobné pravidlá
    uplatňovania vývozných náhrad za poľnohospodárske výrobky
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 348/2002 z dne 25. februarja 2002 o odstopanju
    od Uredbe (ES) št. 174/1999 o posebnih podrobnih pravilih za uporabo Uredbe Sveta
    (EGS) št. 804/68 glede izvoznih dovoljenj in izvoznih nadomestil za mleko in
    mlečne proizvode ter od Uredbe (ES) št. 800/1999 o skupnih podrobnih pravilih
    za uporabo sistema izvoznih nadomestil za kmetijske proizvode
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 348/2002 de la Comisión, de 25 de febrero de 2002,
    que introduce excepciones en el Reglamento (CE) n° 174/1999 por el que se establecen
    disposiciones específicas de aplicación del Reglamento (CEE) n° 804/68 del
    Consejo en lo relativo a los certificados de exportación y a las restituciones
    por exportación en el sector de la leche y de los productos lácteos, así como
    en el Reglamento (CE) n° 800/1999 por el que se establecen disposiciones comunes
    de aplicación del régimen de restituciones por exportación de productos agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 348/2002 av den 25 februari 2002 om undantag
    från förordning (EG) nr 174/1999 om fastställande av särskilda tillämpningsföreskrifter
    till rådets förordning (EEG) nr 804/68 i fråga om exportlicenser och exportbidrag
    inom sektorn för mjölk och mjölkprodukter och om undantag från förordning
    (EG) nr 800/1999 om gemensamma tillämpningsföreskrifter för systemet med exportbidrag
    för jordbruksprodukter
