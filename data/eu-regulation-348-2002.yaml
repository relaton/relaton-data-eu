title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 348/2002 of 25 February 2002 derogating from
    Regulation (EC) No 174/1999 laying down special detailed rules for the application
    of Council Regulation (EEC) No 804/68 as regards export licences and export refunds
    in the case of milk and milk products and from Regulation (EC) No 800/1999 laying
    down common detailed rules for the application of the system of export refunds
    on agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 348/2002 de la Commission du 25 février 2002 dérogeant
    au règlement (CE) n° 174/1999 établissant les modalités particulières d'application
    du règlement (CEE) n° 804/68 du Conseil en ce qui concerne les certificats d'exportation
    et des restitutions à l'exportation dans le secteur du lait et des produits laitiers
    et dérogeant au règlement (CE) n° 800/1999 portant modalités communes d'application
    du régime des restitutions à l'exportation pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 348/2002 der Kommission vom 25. Februar 2002 zur Abweichung
    von der Verordnung (EG) Nr. 174/1999 mit besonderen Durchführungsvorschriften
    zur Verordnung (EWG) Nr. 804/68 des Rates im Hinblick auf die Ausfuhrlizenzen
    und die Ausfuhrerstattungen im Sektor Milch und Milcherzeugnisse sowie zur Abweichung
    von der Verordnung (EG) Nr. 800/1999 über gemeinsame Durchführungsvorschriften
    für Ausfuhrerstattungen bei landwirtschaftlichen Erzeugnissen
  type: main
- language: cs
  script: Latn
