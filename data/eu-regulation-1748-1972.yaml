schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1748/72 de la Commission, du 10 août 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fleurs, feuillages et fruits artificiels, et leurs parties; articles confectionnés
    en fleurs, feuillages et fruits artificiels, de la position tarifaire 67.02, originaires
    de Hong-Kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1748/72 der Kommission vom 10. August 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für künstliche Blumen, Blätter und
    Früchte sowie Teile davon; Waren aus künstlichen Blumen, Blättern oder Früchten,
    der Tarifnummer 67.02, mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1748/72 della Commissione, del 10 agosto 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    fiori, foglie e frutti artificiali, loro parti; oggetti confezionati di fiori,
    foglie e frutti artificiali della voce doganale n. 67.02 originari di Hong Kong
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2795/71
    del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1748/72 van de Commissie van 10 augustus 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op kunstbloemen, kunstloofwerk en kunstvruchten, alsmede delen
    daarvan; artikelen van kunstbloemen, van kunstloofwerk en van kunstvruchten, van
    post 67.02, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG)
    nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties werden
    geopend
  type: main
