    ökonomische Information und die berufliche Qualifikation der in der Landwirtschaft
    tätigen Personen durch den EAGFL, Abteilung Ausrichtung, an das Königreich Dänemark
    (Nur der dänische Text ist verbindlich)'
  type: main
