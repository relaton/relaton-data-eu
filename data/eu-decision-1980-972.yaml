title:
- language: en
  script: Latn
  content: '80/972/EEC: Commission Decision of 30 September 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the Kingdom of Denmark of expenditure incurred
    during 1979 on aid relating to the provision of socio-economic guidance for and
    the acquisition of occupational skills by persons engaged in agriculture (Only
    the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/972/CEE: Décision de la Commission, du 30 septembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume du Danemark, des dépenses effectuées
    pendant l''année 1979 pour les aides relatives à l''information socio-économique
    et à la qualification professionnelle des personnes travaillant dans l''agriculture
    (Le texte en langue danoise est le seul faisant foi.)'
  type: main
