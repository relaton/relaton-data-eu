title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3379/90 of 20 November 1990 setting for the
    1990/91 marketing year the percentages mentioned in the second subparagraph of
    article 3 (1a) of Regulation (EEC) No 426/86 in connection with the premium granted
    for products processed from tomatoes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3379/90 du Conseil du 20 novembre 1990 fixant, pour
    la campagne 1990/1991, les pourcentages visés à l'article 3 paragraphe 1 bis
    deuxième alinéa du règlement (CEE) n° 426/86 en ce qui concerne la prime octroyée
    pour les produits transformés à base de tomates
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3379/90 DES RATES vom 20. November 1990 zur Festsetzung
    des Prozentsatzes nach Artikel 3 Absatz 1a Unterabsatz 2 der Verordnung (EWG)
    Nr. 426/86 hinsichtlich der Praemie fuer Verarbeitungserzeugnisse aus Tomaten
    fuer das Wirtschaftsjahr 1990/91
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3379/90 af 20. november 1990 om fastsættelse
    for produktionsåret 1990/91 af de procentdele, der er omhandlet i artikel 3,
    stk. la, andet afsnit, i forordning (EØF) nr. 426/86 for så vidt angår den
    præmie, der ydes for produkter forarbejdet på basis af tomater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3379/90 του Συμβουλίου
    της 20ής Νοεμβρίου 1990 που καθορίζει, για την
    περίοδο εμπορίας 1990/91, το ποσοστό που αναφέρεται
    στο άρθρο 3 παράγραφος 1α δεύτερο εδάφιο του
    κανονισμού (ΕΟΚ) αριθ. 426/86 όσον αφορά την ενίσχυση
    που χορηγείται στα μεταποιημένα προϊόντα με
    βάση την τομάτα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3379/90 DEL CONSIGLIO del 20 novembre 1990 che fissa,
    per la campagna 1990/1991, le percentuali di cui all'articolo 3, paragrafo 1 bis,
    secondo comma del regolamento (CEE) n. 426/86 per quanto riguarda l'aiuto accordato
    ai prodotti trasformati a base di pomodori
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3379/90 VAN DE RAAD van 20 november 1990 houdende
    vaststelling, voor het verkoopseizoen 1990/1991, van de in artikel 3, lid 1 bis,
    tweede alinea, van Verordening (EEG) nr. 426/86 bedoelde percentages voor wat
    betreft de premie voor op basis van tomaten verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3379/90 DO CONSELHO de 20 de Novembro de 1990 que
    fixa, para a campanha de 1990/1991, as percentagens referidas no n* 1A, alinea
    b), do artigo 3* do Regulamento (CEE) n* 426/86, no que diz respeito ao prémio
    concedido aos produtos transformados à base de tomate
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3379/90 DEL CONSEJO de 20 de noviembre de 1990 por
