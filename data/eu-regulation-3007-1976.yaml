title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3007/76 of 10 December 1976 re-establishing
    the levying of the customs duties on electric filament lamps for lighting, falling
    within subheading 85.20 A, originating in Hong Kong to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3007/76 de la Commission, du 10 décembre 1976, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes électriques à incandescence pour l'éclairage, de la sous-position tarifaire
    85.20 A, originaires de Hong- Kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3007/76 der Kommission vom 10. Dezember 1976 zur Wiedereinführung
    des Zollsatzes für elektrische Glühlampen und Entladungslampen usw., der Tarifstelle
    85.20 A, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3007/76 af 10. december 1976 om genindførelse
    af opkrævning af toldafgifter for elektriske glødelamper under underposition
    85.20 A, som har oprindelse i Hong Kong og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3007/76 della Commissione, del 10 dicembre 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle lampade e tubi a
    incandescenza per l'illuminazione, della sottovoce doganale 85.20 A, originari
    di Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3007/76 van de Commissie van 10 december 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op gloeilampen
    en gloeibuizen, voor verlichtingsdoeleinden, van post 85.20 A, van oorsprong uit
    Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van
    17 november 1975 algemene tariefpreferenties werden geopend
  type: main
