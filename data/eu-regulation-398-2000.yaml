    kaupan pitämän määrän laskemisen, tuotantohintojen, edustavien markkinoiden
    luettelon ja ilmaisjakelua koskevien yksityiskohtaisten soveltamissääntöjen
    osalta hedelmä- ja vihannesalalla ja asetuksen (ETY) N:o 1559/70 kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 398/2000/EK rendelete (2000. február 22.) a termelői szervezetek
    által forgalmazott mennyiségek kiszámítása, a termelői árak és a reprezentatív
    piacok listája, valamint a gyümölcs- és zöldségágazatban az ingyenes szétosztásra
    vonatkozó intézkedések tekintetében a 659/97/EK és a 921/1999/EK rendelet
    módosításáról és az 1559/70/EGK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 398/2000 della Commissione, del 22 febbraio 2000, che
    modifica i regolamenti (CE) n. 659/97 e (CE) n. 921/1999 per quanto riguarda il
    calcolo del quantitativo, commercializzato di un'organizzazione di produttori,
    i corsi alla produzione, l'elenco dei mercati rappresentativi e le modalità d'applicazione
    della distribuzione gratuita nel settore degli ortofrutticoli e abroga il regolamento
    (CEE) n. 1559/70
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 398/2000 (2000. gada 22. februāris), ar ko groza
    Regulu (EK) Nr. 659/97 un Regulu (EK) Nr. 921/1999 attiecībā uz ražotāju organizāciju
    realizēto daudzumu aprēķinu, produkcijas cenām un reprezentatīvo tirgu sarakstu
    un bezmaksas izplatīšanas pasākumiem augļu un dārzeņu nozarē un atceļ
    Regulu (EEK) Nr. 1559/70
  type: main
- language: lt
  script: Latn
  content: 2000 m. vasario 22 d. Komisijos reglamentas (EB) Nr. 398/2000, iš dalies
    keičiantis Reglamentus (EB) Nr. 659/97 ir (EB) Nr. 921/1999 dėl gamintojų organizacijų
    parduoto kiekio apskaičiavimo, gamybos kainų, reprezentatyvių rinkų sąrašo
    ir nemokamo paskirstymo priemonių vaisių ir daržovių sektoriuje bei panaikinantis
    Reglamentą (EEB) Nr. 1559/70
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 398/2000 tat-22 ta’ Frar 2000
    li jemenda r-Regolamenti (KE) Nru 659/97 u (KE) Nru 921/1999 fir-rigward tal-kalkolazzjoni
    tal-kwantità immarketjata ta’ l-organizzazzjonijiet tal-produtturi, tal-prezzijiet
    tal-produzzjoni u tal-lista tas-swieq rappreżentattivi u l-arranġamenti għad-distribuzzjoni
    bla ħlas fis-settur tal-frott u ħxejjex u li jħassar ir-Regolament (KEE) Nru
    1559/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 398/2000 van de Commissie van 22 februari 2000 houdende
    wijziging van de Verordeningen (EG) nr. 659/97 en (EG) nr. 921/1999 wat betreft
    de berekening van de door een telersvereniging in de handel gebrachte hoeveelheid,
    de producentenprijzen en de lijst van representatieve markten en de uitvoeringsbepalingen
    inzake gratis uitreiking, in de sector groenten en fruit en tot intrekking van
    Verordening (EEG) nr. 1559/70
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 398/2000 z dnia 22 lutego 2000 r. zmieniające
    rozporządzenia (WE) nr 659/97 i (WE) nr 921/1999 w odniesieniu do obliczania
    ilości wprowadzonej do obrotu przez organizacje producentów, cen produkcyjnych
    i wykazu rynków reprezentatywnych oraz ustaleń o swobodnej dystrybucji w sektorze
    owoców i warzyw oraz uchylające rozporządzenie (EWG) nr 1559/70
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 398/2000 da Comissão, de 22 de Fevereiro de 2000,
    que altera os Regulamentos (CE) n.o 659/97 e (CE) n.o 921/1999 no que respeita
    ao cálculo da quantidade comercializada de uma organização de produtores, às
    cotações na produção, à lista dos mercados representativos e às normas de
    execução da distribuição gratuita no sector das frutas e produtos hortícolas
    e revoga o Regulamento (CEE) n.o 1559/70
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 398/2000 al Comisiei din 22 februarie 2000 de modificare
    a Regulamentelor (CE) nr. 659/97 și (CE) nr. 921/1999 privind calculul cantității
    comercializate de organizațiile de producători, prețurile de producție și
    lista piețelor reprezentative și a acordurilor de distribuire gratuită în
    sectorul fructelor și al legumelor și de abrogare a Regulamentului (CEE) nr.
    1559/70
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 398/2000 z 22. februára 2000, ktorým sa menia
    a dopĺňajú nariadenia (ES) č. 659/97 a (ES) č. 921/1999, pokiaľ ide o výpočty
    predaných množstiev organizácií výrobcov, výrobné ceny a zoznam reprezentatívnych
    trhov a dojednania o distribúcii zdarma v sektore ovocia a zeleniny, a ktorým
    sa zrušuje nariadenie (EHS) č. 1559/70
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 398/2000 z dne 22. februarja 2000 o spremembah
