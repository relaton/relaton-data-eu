    (ЕО) № 659/97 и (ЕО) № 921/1999 по отношение на изчислението
    на търгуваното количество от организации на
    производители, производствените цени, списъка
    с представителните пазари и режимите на безвъзмездно
    разпределение в сектора на плодовете и зеленчуците
    и за отмяна на Регламент (ЕИО) № 1559/70
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 398/2000 ze dne 22. února 2000, kterým se
    mění nařízení (ES) č. 659/97 a nařízení (ES) č. 921/1999, pokud jde
    o výpočet množství uvedeného na trh u organizace producentů, kurzy produkce
    a seznam reprezentativních trhů a prováděcí pravidla pro bezplatné rozdělování
    v odvětví ovoce a zeleniny, a kterým se zrušuje nařízení (EHS) č. 1559/70
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 398/2000 af 22. februar 2000 om ændring
    af forordning (EF) nr. 659/97 og (EF) nr. 921/1999 for så vidt angår beregningen
    af en producentorganisations markedsførte mængde, noteringerne for de pågældende
    produkter, listen over repræsentative markeder og gennemførelsesbestemmelserne
    for gratis uddeling af frugt og grøntsager og om ophævelse af forordning (EØF)
    nr. 1559/70
  type: main
- language: el
  script: Grek
