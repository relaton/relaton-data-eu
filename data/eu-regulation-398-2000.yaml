title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 398/2000 of 22 February 2000 amending Regulations
    (EC) No 659/97 and (EC) No 921/1999 as regards the calculation of the marketed
    quantity of producer organisations, production prices and the list of representative
    markets and the free distribution arrangements in the fruit and vegetables sector
    and repealing Regulation (EEC) No 1559/70
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 398/2000 de la Commission, du 22 février 2000, modifiant
    les règlements (CE) nº 659/97 et (CE) nº 921/1999 en ce qui concerne le calcul
    de la quantité commercialisée d'une organisation de producteurs, les cours à
    la production et la liste des marchés représentatifs, et les modalités d'application
    de la distribution gratuite dans le secteur des fruits et légumes et abrogeant
    le règlement (CEE) nº 1559/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 398/2000 der Kommission vom 22. Februar 2000 zur Änderung
    der Verordnungen (EG) Nr. 659/97 und (EG) Nr. 921/1999 hinsichtlich der Berechnung
    der vermarkteten Menge einer Erzeugerorganisation, der Tagesnotierungen, der Liste
    der repräsentativen Märkte und der Durchführungsbestimmungen für die kostenlose
    Verteilung im Obst- und Gemüsesektor und zur Aufhebung der Verordnung (EWG) Nr.
    1559/70
  type: main
