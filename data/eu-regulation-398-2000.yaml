  script: Latn
  content: Komisjoni määrus (EÜ) nr 398/2000, 22. veebruar 2000, millega muudetakse
    määrusi (EÜ) nr 659/97 ja (EÜ) nr 921/1999 seoses tootjaorganisatsioonide
    turustatud koguste arvutamise, tootmishindade, tüüpiliste turgude loetelu ja
