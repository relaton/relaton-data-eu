    ao artigo 5.o da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/2244 a Consiliului din 16 decembrie
