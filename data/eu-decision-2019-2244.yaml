    derogare de la articolul 5 din Directiva 2006/112/CE privind sistemul comun al
    taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2019/2244 zo 16. decembra 2019, ktorým
