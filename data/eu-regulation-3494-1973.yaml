title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3494/73 of the Commission of 21 December 1973 defining
    additional measures to be taken in agriculture following the fixing, with effect
    from 1 January 1974, of a new representative rate for the Italian lira
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3494/73 de la Commission, du 21 décembre 1973, définissant
    les mesures supplémentaires à prendre dans le secteur agricole suite à la fixation,
    avec effet au 1er janvier 1974, d'un nouveau taux représentatif pour la lire
    italienne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3494/73 der Kommission vom 21. Dezember 1973 zur Bestimmung
    der zusätzlichen Maßnahmen, die in der Landwirtschaft infolge der Festsetzung
    eines neuen repräsentativen Umrechnungskurses, der für die italienische Lira
    ab 1. Januar 1974 gilt, zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3494/73 af 21. december 1973 om supplerende
    foranstaltninger, der skal træffes inden for landbrugssektoren som følge af
    fastsættelsen af en ny repræsentativ kurs for den italienske lire, der har virkning
    fra den 1. januar 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3494/73 della Commissione, del 21 dicembre 1973, che
    stabilisce le misure supplementari da adottare nel settore agricolo in seguito
    alla fissazione, con effetto dal 1 gennaio 1974, di un nuovo tasso rappresentativo
    per la lira italiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3494/73 van de Commissie van 21 december 1973 houdende
    vaststelling van aanvullende maatregelen in de landbouwsector naar aanleiding
    van de vaststelling van een nieuwe met ingang van 1 januari 1974 voor de Italiaanse
    lire toe te passen representatieve koers
  type: main
