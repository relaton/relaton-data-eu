  script: Latn
  content: COMMISSION REGULATION (EEC) No 1614/93 of 24 June 1993 re-establishing
    the levying of customs duties on products falling within CN code ex 3904, originating
    in Mexico, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1614/93 de la Commission du 24 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC ex 3904,
    originaires du Mexique, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1614/93 DER KOMMISSION vom 24. Juni 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes ex 3904 mit Ursprung in Mexiko,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1614/93 af 24. juni 1993 om genindførelse
