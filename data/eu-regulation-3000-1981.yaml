title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3000/81 of 10 October 1981 laying down for
    1981 certain measures for the conservation and management of fishery resources
    applicable to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3000/81 du Conseil, du 10 octobre 1981, fixant, pour
    l' année 1981, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3000/81 des Rates vom 10. Oktober 1981 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für die auf
    den Färöern registrierten Schiffe für 1981
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3000/81 af 10. oktober 1981 om fastsættelse
    for 1981 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3000/81 τού Συμβουλίου
    τής 10ης Οκτωβρίου 1981 περί καθορισμού γιά τό
    έτος 1981 ορισμένων μέτρων διατηρήσεως καί διαχειρίσεως
    τών αλιευτικών πόρων πού εφαρμόζονται στά
    σκάφη πού είναι νηολογημένα στίς Φερόες νήσους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3000/81 del Consiglio, del 10 ottobre 1981, che stabilisce,
    per il 1981, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3000/81 van de Raad van 10 oktober 1981 tot vaststelling
    voor 1981 van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden, van toepassing op vaartuigen die op de Faeröer geregistreerd zijn
  type: main
