title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1054/98 of 20 May 1998 amending Regulation
    (EC) No 1223/94 laying down special detailed rules for the application of the
    system of advance-fixing certificates for certain agricultural products exported
    in the form of goods not covered by Annex II to the Treaty, and Regulation (EC)
    No 1222/94 laying down common detailed rules for the application of the system
    of granting export refunds on certain agricultural products exported in the form
    of goods not covered by Annex II to the Treaty, and the criteria for fixing the
    amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1054/98 de la Commission du 20 mai 1998 modifiant le
    règlement (CE) nº 1223/94 portant modalités particulières d'application du
    régime des certificats de préfixation pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe II du traité, et modifiant
    le règlement (CE) nº 1222/94 établissant, pour certains produits agricoles
    exportés sous forme de marchandises ne relevant pas de l'annexe II du traité,
    les modalités communes d'application du régime d'octroi des restitutions à
    l'exportation et des critères de fixation de leurs montants
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1054/98 der Kommission vom 20. Mai 1998 zur Änderung
    der Verordnung (EG) Nr. 1223/94 über besondere Durchführungsvorschriften für
    Vorausfestsetzungsbescheinigungen für bestimmte landwirtschaftliche Erzeugnisse,
    die in Form von nicht unter Anhang II des Vertrags fallenden Waren ausgeführt
    werden, und zur Änderung der Verordnung (EG) Nr. 1222/94 zur Festlegung der gemeinsamen
    Durchführungsvorschriften für die Gewährung von Ausfuhrerstattungen und der
    Kriterien zur Festsetzung des Erstattungsbetrags für bestimmte landwirtschaftliche
    Erzeugnisse, die in Form von nicht unter Anhang II des Vertrags fallenden Waren
    ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1054/98 af 20. maj 1998 om ændring af
    forordning (EF) nr. 1223/94 om de særlige gennemførelsesbestemmelser for ordningen
    med forudfastsættelsesattester for visse landbrugsprodukter, som ikke omfattes
    af traktatens bilag II, og om ændring af forordning (EF) nr. 1222/94 om fastsættelse
    af fælles gennemførelsesregler for ordningen for ydelse af eksportrestitutioner
    og om fastlæggelse af kriterierne for fastsættelse af restitutionsbeløbet for
    visse landbrugsprodukter, der udføres i form af varer, som ikke er opført i
    traktatens bilag II
  type: main
- language: el
