    der zur Unterstützung der Verordnung (EU) 2016/425 des Europäischen Parlaments
    und des Rates erstellten Normen für persönliche Absturzschutzausrüstung, Atemschutzgeräte
    mit Gebläsefiltern, Schuhe, elektrisch isolierende Helme sowie Augen- und Gesichtsschutz
    für berufliche Anwendungen
  type: main
