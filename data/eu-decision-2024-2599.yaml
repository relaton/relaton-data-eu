- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/2599 of 4 October 2024 amending
    Commission Implementing Decision (EU) 2023/941 as regards the harmonised standards
    for personal fall protection equipment, powered filtering respiratory protective
    devices, footwear, electrically insulating helmets and eye and face protection
    for occupational use drafted in support of Regulation (EU) 2016/425 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/2599 de la Commission du 4 octobre 2024
    modifiant la décision d’exécution (UE) 2023/941 de la Commission en ce qui
    concerne les normes harmonisées relatives aux équipements de protection individuelle
    contre les chutes de hauteur, aux appareils filtrants à ventilation assistée
    de protection respiratoire, aux chaussures, aux casques électriquement isolants
    et aux protections de l’œil et du visage à usage professionnel, élaborées
    à l’appui du règlement (UE) 2016/425 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
