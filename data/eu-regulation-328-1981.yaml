title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 328/81 of 6 February 1981 on a further derogation
    for the first quarter of 1981 from Regulation (EEC) No 2377/80 in respect of the
    issue of import licences under certain special arrangements in the beef and veal
    sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 328/81 de la Commission, du 6 février 1981, portant
    nouvelle dérogation pour le premier trimestre de 1981 au règlement (CEE) n°
    2377/80 en ce qui concerne la délivrance des certificats d' importation dans
    le cadre de certains régimes spéciaux dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 328/81 der Kommission vom 6. Februar 1981 über eine
    weitere Abweichung von der Verordnung (EWG) Nr. 2377/80 hinsichtlich der Erteilung
    von Einfuhrlizenzen im Rahmen von Sonderregelungen im ersten Vierteljahr 1981
    auf dem Sektor Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 328/81 af 6. februar 1981 om ny undtagelse
    fra forordning (EØF) nr. 2377/80 for første kvartal af 1981 for så vidt angår
    udstedelsen af importlicenser under visse særordninger for oksekødsektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 328/81 τής Επιτροπής
    τής 6ης Φεβρουαρίου 1981 περί νέας παρεκκλίσεως,
    γιά τό πρώτο τρίμηνο τού 1981, από τόν κανονισμό
    (ΕΟΚ) αριθ. 2377/80 όσον αφορά τήν έκδοση πιστοποιητικών
    εισαγωγής στά πλαίσια ορισμένων ειδικών καθεστώτων
    στόν τομέα τού βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 328/81 della Commissione, del 6 febbraio 1981, recante
    nuova deroga, per il primo trimestre del 1981, al regolamento (CEE) n. 2377/80
    per quanto concerne il rilascio dei titoli d' importazione nell' ambito di regimi
    speciali nel settore delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 328/81 van de Commissie van 6 februari 1981 houdende
    nieuwe afwijking voor het eerste kwartaal 1981 van Verordening (EEG) nr. 2377/80
    ten aanzien van de afgifte van invoercertificaten in het kader van bepaalde bijzondere
    regelingen in de sector rundvlees
