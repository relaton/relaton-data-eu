title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1255/2005 of 29 July 2005 determining the
    extent to which the applications for import licences submitted in July 2005 for
    certain dairy products under certain tariff quotas opened by Regulation (EC) No
    2535/2001 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1255/2005 de la Commission du 29 juillet 2005 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 2005 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 2535/2001 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1255/2005 der Kommission vom 29. Juli 2005 zur Festlegung
    des Umfangs, in dem den im Juli 2005 gestellten Anträgen auf Erteilung von Lizenzen
    für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung (EG)
    Nr. 2535/2001 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1255/2005 ze dne 29. července 2005, kterým
    se stanoví, do jaké míry lze přijímat žádosti o dovozní licence podané
    v července 2005 pro některé mléčné výrobky v rámci některých kvót otevřených
    nařízením (ES) č. 2535/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1255/2005 af 29. juli 2005 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i juli 2005 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 2535/2001, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1255/2005 της Επιτροπής,
    της 29ης Ιουλίου 2005, για καθορισμό του κατά πόσον
    μπορούν να γίνουν δεκτές οι αιτήσεις πιστοποιητικών
    εισαγωγής που υπεβλήθησαν τον Ιουλίου του
    2005 για ορισμένα γαλακτοκομικά προϊόντα στο
