    bij Verordening (EG) nr. 2535/2001 geopende tariefcontingenten voor bepaalde zuivelproducten
    zijn ingediend, kunnen worden geaccepteerd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1255/2005 z dnia 29 lipca 2005 r. określające
    stopień, w jakim mogą zostać przyjęte wnioski złożone w lipcu 2005 r. o
    pozwolenia na przywóz dla niektórych przetworów mlecznych w ramach niektórych
    kontyngentów taryfowych otwartych rozporządzeniem (WE) nr 2535/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1255/2005 da Comissão, de 29 de Julho de 2005, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Julho de 2005 para certos produtos lácteos no âmbito de determinados
    contingentes pautais abertos pelo Regulamento (CE) n.° 2535/2001
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1255/2005 z 29. júla 2005, ustanovujúce podmienky,
    za ktorých je možné prijať žiadosti o dovozné certifikáty, predložené
    v júli 2005, pre niektoré mliečne výrobky v rámci niektorých tarifných
    kvót otvorených nariadením (ES) č. 2535/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1255/2005 z dne 29. julija 2005 o določitvi
