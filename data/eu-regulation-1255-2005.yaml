    di taluni contingenti tariffari aperti dal regolamento (CE) n. 2535/2001
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1255/2005 (2005. gada 29. jūlijs), ar ko nosaka
