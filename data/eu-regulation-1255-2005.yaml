    heinäkuuta 2005 jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1255/2005/EK rendelete (2005. július 29.) az egyes tejtermékekre
