    tammikuuta 2001 sovellettavista korjauskertoimista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE, CECA, Euratom) n. 2367/2001 del Consiglio, del 30 novembre
    2001, che modifica il regolamento (CE, CECA, Euratom) n. 106/2001 che stabilisce
    i coefficienti correttori applicabili con effetto dal 1° luglio 2000 alle retribuzioni
    dei funzionari delle Comunità europee con sede di servizio nei paesi terzi, e
    il regolamento (CE, CECA, Euratom) n. 1794/2001 che stabilisce i coefficienti
    correttori applicabili con effetto dal 1° gennaio 2001 alle retribuzioni dei
    funzionari delle Comunità europee con sede di servizio nei paesi terzi, per quanto
    riguarda i coefficienti correttori applicabili a partire dal 1° luglio 2000 e
    dal 1° gennaio 2001 alle retribuzioni dei funzionari con sede di servizio a Naka
    (Giappone)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG, EGKS, Euratom) nr. 2367/2001 van de Raad van 30 november
    2001 tot wĳziging van Verordening (EG, EGKS, Euratom) nr. 106/2001 houdende vaststelling
    van de aanpassingscoëfficiënten die met ingang van 1 juli 2000 van toepassing
    zĳn op de bezoldigingen van de ambtenaren van de Europese Gemeenschappen die
    in derde landen tewerkgesteld zĳn en Verordening (EG, EGKS, Euratom) nr. 1794/2001
    houdende vaststelling van de aanpassingscoëfficiënten die met ingang van 1 januari
    2001 van toepassing zĳn op de bezoldigingen van de ambtenaren van de Europese
    Gemeenschappen die in derde landen tewerkgesteld zĳn, voor wat betreft de aanpassingscoëfficiënten
    die met ingang van 1 juli 2000 en 1 januari 2001 van toepassing zĳn op de bezoldigingen
    van de ambtenaren die in Naka (Japan) tewerkgesteld zĳn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE, CECA, Euratom) n.° 2367/2001 do Conselho, de 30 de Novembro
    de 2001, que altera os Regulamentos (CE, CECA, Euratom) n.° 106/2001 que fixa
    os coeficientes de correcção aplicáveis, a partir de 1 de Julho de 2000, às
    remunerações dos funcionários das Comunidades Europeias cujo lugar de afectação
    seja em países terceiros e (CE, CECA, Euratom) n.° 1794/2001 que fixa os coeficientes
    de correcção aplicáveis a partir de 1 de Janeiro de 2001 às remunerações
    dos funcionários das Comunidades Europeias cujo lugar de afectação seja em
    países terceiros, no que se refere aos coeficientes de correcção aplicáveis
    a partir de 1 de Julho de 2000 e de 1 de Janeiro de 2001 aos vencimentos dos funcionários
    cujo lugar de afectação seja Naka (Japão)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE, CECA, Euratom) n° 2367/2001 del Consejo, de 30 de noviembre
    de 2001, que modifica los Reglamentos (CE, CECA, Euratom) n° 106/2001 por el
    que se fijan los coeficientes correctores aplicables a partir del 1 de julio de
    2000 a las retribuciones de los funcionarios de las Comunidades Europeas destinados
    en los terceros países y (CE, CECA, Euratom) n° 1794/2001 por el que se fijan
    los coeficientes correctores aplicables a partir del 1 de enero de 2001 a las
    retribuciones de los funcionarios de las Comunidades Europeas destinados en los
    terceros países, en lo que se refiere a los coeficientes correctores aplicables
    a partir del 1 de julio de 2000 y del 1 de enero de 2001 a las retribuciones de
    los funcionarios destinados en Naka (Japón)
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG, EKSG, Euratom) nr 2367/2001 av den 30 november
    2001 om ändring av förordningarna (EG, EKSG, Euratom) nr 106/2001 om fastställande
    av de korrigeringskoefficienter som skall tillämpas från och med den 1 juli
    2000 på löner till Europeiska gemenskapens tjänstemän som tjänstgör i tredje
    land och (EG, EKSG, Euratom) nr 1794/2001 om fastställande av korrigeringskoefficienter
    som skall tillämpas från och med den 1 januari 2001 på löner till Europeiska
    gemenskapernas tjänstemän som tjänstgör i tredje land, när det gäller de
    från och med den 1 juli 2000 och den 1 januari 2001 tillämpliga korrigeringskoefficienterna
    för lönerna till tjänstemän som tjänstgör i Naka (i Japan)
