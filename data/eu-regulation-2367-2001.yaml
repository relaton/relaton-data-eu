title:
- language: en
  script: Latn
  content: Council Regulation (EC, ECSC, Euratom) No 2367/2001 of 30 November 2001
    amending Regulations (EC, ECSC, Euratom) No 106/2001 laying down the weightings
    applicable from 1 July 2000 to the remuneration of officials of the European Communities
    serving in third countries and (EC, ECSC, Euratom) No 1794/2001 laying down the
    weightings applicable from 1 January 2001 to the remuneration of officials of
    the European Communities serving in third countries, with regard to the weightings
    applicable from 1 July 2000 and 1 January 2001 to the remuneration of officials
    serving in Naka (Japan)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE, CECA, Euratom) n° 2367/2001 du Conseil du 30 novembre
    2001 modifiant les règlements (CE, CECA, Euratom) n° 106/2001 portant fixation
    des coefficients correcteurs applicables à partir du 1er juillet 2000 aux rémunérations
    des fonctionnaires des Communautés européennes affectés dans les pays tiers
    et (CE, CECA, Euratom) n° 1794/2001 portant fixation des coefficients correcteurs
    applicables à partir du 1er janvier 2001 aux rémunérations des fonctionnaires
    des Communautés européennes affectés dans les pays tiers, en ce qui concerne
    les coefficients correcteurs applicables à partir des 1er juillet 2000 et 1er
    janvier 2001 aux rémunérations des fonctionnaires affectés à Naka (Japon)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG, EGKS, Euratom) Nr. 2367/2001 des Rates vom 30. November
    2001 zur Änderung der Verordnungen (EG, EGKS, Euratom) Nr. 106/2001 zur Festsetzung
    der Berichtigungskoeffizienten, die mit Wirkung vom 1. Juli 2000 auf die Dienstbezüge
    der Beamten der Europäischen Gemeinschaften in Drittländern anwendbar sind,
    und (EG, EGKS, Euratom) Nr. 1794/2001 zur Festsetzung der Berichtigungskoeffizienten,
    die mit Wirkung vom 1. Januar 2001 auf die Dienstbezüge der Beamten der Europäischen
    Gemeinschaften in Drittländern anwendbar sind, hinsichtlich der Berichtigungskoeffizienten,
    die mit Wirkung vom 1. Juli 2000 und 1. Januar 2001 auf die Dienstbezüge der
    Beamten in Naka (Japan) anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF, EKSF, Euratom) nr. 2367/2001 af 30. november 2001
    om ændring af forordning (EF, EKSF, Euratom) nr. 106/2001 om fastsættelse af
    de justeringskoefficienter, der fra 1. juli 2000 finder anvendelse på vederlag
    til tjenestemænd i De Europæiske Fællesskaber, som gør tjeneste i tredjelande,
    og (EF, EKSF, Euratom) nr. 1794/2001 om fastsættelse af de justeringskoefficienter,
    der fra 1. januar 2001 finder anvendelse på vederlag til tjenestemænd i De Europæiske
    Fællesskaber, som gør tjeneste i tredjelande, for så vidt angår de justeringskoefficienter,
    der har fundet anvendelse fra 1. juli 2000 og 1. januar 2001 på vederlag til
    tjenestemænd, som gør tjeneste i Naka (Japan)
  type: main
