title:
- language: en
  script: Latn
  content: '80/610/EEC: Commission Decision of 29 May 1980 authorizing the French
    Republic not to apply Community treatment to men''s and boys''shirts, woven, of
    wool, of cotton or of man-made textile fibres, falling within heading No ex 61.03
    of the Common Customs Tariff (category 8), originating in Romania and in free
    circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/610/CEE: Décision de la Commission, du 29 mai 1980, autorisant la
    République française à exclure du traitement communautaire les chemises et
    chemisettes tissées, de la position ex 61.03 du tarif douanier commun (catégorie
    8), originaires de Roumanie et mises en libre pratique dans les autres Etats membres
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/610/EWG: Entscheidung der Kommission vom 29. Mai 1980, mit der die
    Französische Republik ermächtigt wird, aus Rumänien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden,
    aus Geweben, der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (Kategorie 8)
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/610/EØF: Kommissionens beslutning af 29. maj 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabs1456behandling at undtage vævede
    skjorter, som henhører under pos. ex 61.03 i den fælles toldtarif (kategori
    8), har oprindelse i Rumænien og frit kan om1480sættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/610/CEE: Decisione della Commissione, del 29 maggio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie e le
    camicette, tessute, della voce ex 61.03 della tariffa doganale comune, categoria
    8, originarie della Romania e messe in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/610/EEG: Beschikking van de Commissie van 29 mei 1980 waarbij de Franse
    Republiek wordt gemachtigd overhemden en sporthemden, geweven, van post ex 61.03,
    categorie 8, van het gemeenschappelijk douanetarief, van oorsprong uit Roemenië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
