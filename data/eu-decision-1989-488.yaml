    Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    abweichende Sondermaßnahme zu treffen (89/488/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS BESLUTNING af 28. juli 1989 om bemyndigelse af Den Franske Republik
    til at anvende en foranstaltning som fraviger artikel 17. stk. 2, i sjette direktiv
    77/388/EØF om harmonisering af medlemsstaternes lovgivning om omsætningsafgifter
    (89/488/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/488/ΕΟΚ: Απόφαση του Συμβουλίου της 28ης
