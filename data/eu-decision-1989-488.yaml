  script: Latn
  content: '89/488/EEC: Council Decision of 28 July 1989 authorizing the French Republic
    to apply a measure derogating from Article 17 (2) of the Sixth Directive 77/388/EEC
    on the harmonization of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '89/488/CEE: Décision du Conseil du 28 juillet 1989 autorisant la République
    française à appliquer une mesure dérogatoire à l''article 17 paragraphe 2
    de la sixième directive 77/388/CEE en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DES RATES vom 28. Juli 1989 zur Ermächtigung der Französischen
