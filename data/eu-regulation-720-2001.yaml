title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 720/2001 of 10 April 2001 determining the
    extent to which applications lodged in April 2001 for import rights in respect
    of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 720/2001 de la Commission du 10 avril 2001 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2001 pour les viandes bovines congelées destinées
    à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 720/2001 der Kommission vom 10. April 2001 über den
    Umfang, in dem den im Monat April 2001 eingereichten Anträgen auf Einfuhrrechte
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 720/2001 af 10. april 2001 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder, indgivet i april
    2001 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 720/2001 της Επιτροπής,
    της 10ης Απριλίου 2001, ο οποίος καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιωμάτων εισαγωγής που κατατέθηκαν τον
    Απρίλιο 2001 για τα κατεψυγμένα βόεια κρέατα
    που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 720/2001, annettu 10 päivänä huhtikuuta 2001,
    huhtikuussa 2001 jätettyjen, jalostettavaksi tarkoitettua jäädytettyä naudanlihaa
    koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 720/2001 della Commissione, del 10 aprile 2001, che
    stabilisce in quale misura può essere dato seguito alle domande di diritti di
    importazione presentate nel mese di aprile 2001 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 720/2001 van de Commissie van 10 april 2001 waarbĳ
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in april 2001 ingediende
    aanvragen om rechten tot invoer voor bevroren rundvlees bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 720/2001 da Comissão, de 10 de Abril de 2001, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Abril de 2001 para carne de bovino congelada destinada à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 720/2001 de la Comisión, de 10 de abril de 2001, por
    el que se determina en qué medida podrá darse curso a las solicitudes de derechos
    de importación presentadas hasta el mes de abril de 2001 para las carnes de vacuno
    congeladas destinadas a la transformación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 720/2001 av den 10 april 2001 om i vilken
    utsträckning ansökningar om importrättigheter som lämnats in under april 2001
    för fruset nötkött för bearbetning kan godkännas
  type: main
