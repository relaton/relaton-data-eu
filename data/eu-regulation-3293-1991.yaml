    Nummer 40.0220) mit Ursprung in den Philippinen, denen die in der Verordnung (EWG)
    Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3293/91 af 11. november 1991 om genindførelse
