title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3293/91 of 11 November 1991 re-establishing
    the levying of customs duties on products of category 22 (order No 40.0220), originating
    in the Philippines, to which the preferential tariff arrangements set out in Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3293/91 DE LA COMMISSION du 11 novembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 22 (numéro d'' ordre 40.0220) originaires des Philippines, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3293/91 DER KOMMISSION vom 11. November 1991 über
