  script: Latn
  content: Decisione della Commissione, del 7 febbraio 1977, che modifica la decisione
    76/722/CEE che autorizza il Regno Unito ad ammettere temporaneamente la commercializzazione
    di sementi certificate di trifoglio violetto soggette a requisiti ridotti
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 februari 1977 houdende wijziging van
