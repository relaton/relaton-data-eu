  script: Latn
  content: '77/164/CEE: Décision de la Commission, du 7 février 1977, modifiant
    la décision 76/722/CEE autorisant le Royaume-Uni à admettre temporairement la
    commercialisation des semences certifiées de trèfle violet soumises à des exigences
    réduites'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. Februar 1977 zur Änderung der Entscheidung
