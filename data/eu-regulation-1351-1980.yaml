type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1351/80 of 30 May 1980 re-establishing the
    levying of customs duties on yarn of man-made fibres (continuous), not put up
    for retail sale, products of category 42 (code 0420), originating in India, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1351/80 de la Commission, du 30 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles artificielles non conditionnés pour la vente au détail, de la
    catégorie 42 (code 0420), originaires de l' Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1351/80 der Kommission vom 30. Mai 1980 über die
    Wiedereinführung des Zollsatzes für künstliche Spinnfäden, nicht in Aufmachungen
    für den Einzelverkauf, der Warenkategorie Nr. 42 (Kennziffer 0420) mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1351/80 af 30. maj 1980 om genindførelse
    af opkrævning af toldafgifter for garn af endeløse kemofibre, ikke i detailsalgsoplægninger,
    under kategori 42 (kode 0420), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1351/80 della Commissione, del 30 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di fibre tessili
    sintetiche ed artificiali continue, non preparati per la vendita al minuto, della
    categoria di prodotti n. 42 (codice 0420), originari dell' India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1351/80 van de Commissie van 30 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    kunstmatige vezels, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 42 (codenummer 0420), van oorsprong uit India, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
