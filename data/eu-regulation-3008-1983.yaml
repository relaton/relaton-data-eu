title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3008/83 of 27 October 1983 determining the
    amounts of the variable components and additional duties applicable from 1 November
    1983 to 31 January 1984 on the importation into the Community of goods covered
    by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3008/83 de la Commission, du 27 octobre 1983, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables
    pendant la période du 1er novembre 1983 au 31 janvier 1984 inclus à l'importation
    dans la Communauté des marchandises relevant du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3008/83 der Kommission vom 27. Oktober 1983 zur Festsetzung
    der Höhe der vom 1. November 1983 bis einschließlich 31. Januar 1984 bei der
    Einfuhr der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3008/83 af 27. oktober 1983 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 3033/80 for perioden fra den
    1. november 1983 til den 31. januar 1984
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3008/83 της Επιτροπής
    της 27ης Οκτωβρίου 1983 περί καθορισμού των ποσών
    των μεταβλητών στοιχείων και των πρόσθετων
    δασμών που εφαρμόζονται κατά την περίοδο από
    1ης Νοεμβρίου 1983 μέχρι και 31ης Ιανουαρίου 1984
    κατά την εισαγωγή στην Κοινότητα εμπορευμάτων
    που υπάγονται στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3008/83 della Commissione, del 27 ottobre 1983, che
    determina gli importi degli elementi mobili e i dazi addizionali applicabili all'importazione
    nella Comunità, per il periodo dal 1 novembre 1983 al 31 gennaio 1984, delle
    merci cui si applica il regolamento (CEE) n. 3033/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3008/83 van de Commissie van 27 oktober 1983 tot
