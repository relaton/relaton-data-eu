    in situ pentru protejarea patrimoniului cultural (Numai textul în limba spaniolă
    este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/1050 z 15. júla 2020, ktorým
    sa Španielsku povoľuje autorizovať na ochranu kultúrneho dedičstva biocídne
    výrobky pozostávajúce z dusíka získaného in situ (Iba španielske znenie
    je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/1050 z dne 15. julija 2020 o dovolitvi
