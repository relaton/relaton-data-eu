    jikkonsistu min-nitroġenu ġġenerat in situ għall-protezzjoni tal-wirt kulturali
    (It-test bl-Ispanjol biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/1050 van de Commissie van 15 juli 2020 om
    Spanje toe te staan biociden die uit in situ gegenereerd stikstof bestaan, toe
    te laten voor de bescherming van cultureel erfgoed (Slechts de tekst in de Spaanse
    taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/1050 z dnia 15 lutego 2020 r. zezwalająca
    Hiszpanii na udzielanie pozwoleń na produkty biobójcze składające się z azotu
    wytwarzanego in situ w celu ochrony dziedzictwa kulturowego (Jedynie tekst w języku
    hiszpańskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (EU) 2020/1050 da Comissão de 15 de julho de 2020
    que permite à Espanha autorizar produtos biocidas constituídos por azoto gerado
    in situ para proteger o património cultural (Apenas faz fé o texto na língua
    espanhola)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/1050 a Comisiei din 15 iulie 2020
