    teksts spāņu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/1050 2020 m. liepos 15 d.
    kuriuo Ispanijai leidžiama autorizuoti biocidinius produktus, kuriuos sudaro
    in situ pagamintas azotas, kultūros paveldui apsaugoti (Tekstas autentiškas
    tik ispanų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/1050 tal-15
