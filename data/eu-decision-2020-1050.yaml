title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1050 of 15 July 2020 allowing
    Spain to authorise biocidal products consisting of in-situ generated nitrogen
    for the protection of cultural heritage (Only the Spanish text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1050 de la Commission du 15 juillet
    2020 permettant à l’Espagne d’autoriser les produits biocides constitués
    d’azote généré in situ pour la protection du patrimoine culturel (Le texte
    en langue espagnole est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1050 der Kommission vom 15. Juli 2020
    zur Ermächtigung Spaniens, zum Schutz des kulturellen Erbes Biozidprodukte zuzulassen,
    die in situ hergestellten Stickstoff enthalten (Nur der spanische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/1050 на Комисията
    от 15 юли 2020 година за предоставяне на възможност
    на Испания да разреши употребата на биоциди,
    съставени от генериран на място азот, за опазването
    на културното наследство (само текстът на испански
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/1050 ze dne 15. července 2020,
    kterým se Španělsku v zájmu ochrany kulturního dědictví umožňuje povolit
    biocidní přípravky sestávající z dusíku připravovaného na místě (Pouze
    španělské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/1050 af 15. juli 2020
    om tilladelse til, at Spanien godkender biocidholdige produkter, der består af
    in situ-genereret nitrogen, til beskyttelse af kulturarv (Kun den spanske udgave
    er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/1050 της Επιτροπής
    της 15ης Ιουλίου 2020 με την οποία επιτρέπεται
    στην Ισπανία να χορηγήσει άδεια σε βιοκτόνα
    που αποτελούνται από επιτόπου παραχθέν άζωτο
    για την προστασία της πολιτιστικής κληρονομιάς
    (Το κείμενο στην ισπανική γλώσσα είναι το μόνο
    αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/1050, 15. juuli 2020, millega võimaldatakse
    Hispaanial anda luba kasutada kultuuripärandi kaitseks kohapeal toodetud lämmastikku
    sisaldavaid biotsiide (ainult hispaaniakeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/1050, annettu 15 päivänä
    heinäkuuta 2020, paikalla tuotetusta typestä koostuvia biosidivalmisteita koskevan
    luvan antamisen sallimisesta Espanjalle kulttuuriperinnön suojelemiseksi (Ainoastaan
    espanjankielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/1050 оd 15. srpnja 2020. o dopuštanju
