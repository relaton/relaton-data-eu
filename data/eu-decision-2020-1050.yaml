    dušika za zaštitu kulturne baštine (Vjerodostojan je samo tekst na španjolskom
    jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/1050 végrehajtási határozata (2020. július 15.)
    az in situ előállított nitrogénből álló biocid termékek kulturális örökségvédelmi
    célból történő engedélyezésének Spanyolország számára való lehetővé
    tételéről (Csak a spanyol nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/1050 della Commissione del 15 luglio
    2020 che permette alla Spagna di autorizzare biocidi costituiti da azoto generato
