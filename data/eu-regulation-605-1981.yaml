title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 605/81 of 6 March 1981 determining the time
    limit for the entry into storage of butter sold under Regulation (EEC) No 262/79
    and amending that Regulation as regards the time limits for processing the butter
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 605/81 de la Commission, du 6 mars 1981, déterminant
    la date limite d' entrée en stock du beurre vendu au titre du règlement (CEE)
    n° 262/79 et modifiant ce règlement en ce qui concerne les délais de transformation
    du beurre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 605/81 der Kommission vom 6. März 1981 zur Festsetzung
    des Einlagerungstermins für Butter, die gemäß der Verordnung (EWG) Nr. 262/79
    verkauft wird, und zur Änderung dieser Verordnung hinsichtlich der Verarbeitungsfristen
    für die Butter
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 605/81 af 6. marts 1981 om fastlæggelse
    af seneste indlagringstidspunkt for smør, der sælges i henhold til forordning
    (EØF) nr. 262/79, og om ændring af den pågældende forordning for så vidt
    angår fristerne for smørrets forarbejdning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 605/81 τής Επιτροπής
    τής 6ης Μαρτίου 1981 περί καθορισμού τής προθεσμίας
    αποθεματοποιήσεως βουτύρου πού πωλείται κατά
    τόν κανονισμό (ΕΟΚ) αριθ. 262/79 καί περί τροποποιήσεως
    τού κανονισμού αυτού όσον αφορά τίς προθεσμίες
    μεταποιήσεως τού βουτύρου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 605/81 della Commissione, del 6 marzo 1981, che determina
    la data limite di entrata all' ammasso del burro venduto a norma del regolamento
    (CEE) n. 262/79 e modifica tale regolamento per quanto concerne i termini di trasformazione
    del burro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 605/81 van de Commissie van 6 maart 1981 tot vaststelling
