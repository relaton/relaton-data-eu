title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 41/81 of 1 January 1981 adapting the provisions
    of the 1979 Act of Accession in respect of processed fruit and vegetables and
    laying down general rules for the application of the Act for that sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 41/81 du Conseil, du 1er janvier 1981, portant adaptation
    des dispositions de l' acte d' adhésion de 1979 en ce qui concerne le secteur
    des fruits et légumes transformés et déterminant les règles générales d'
    application dudit acte pour ce même secteur
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 41/81 des Rates vom 1. Januar 1981 zur Anpassung der
    den Sektor verarbeitetes Obst und Gemüse betreffenden Bestimmungen der Beitrittsakte
    von 1979 und zur Festlegung der allgemeinen Durchführungsvorschriften für diesen
    Sektor
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 41/81 af 1. januar 1981 om tilpasning af
    bestemmelserne i tiltrædelsesakten af 1979 for så vidt angår forarbejdede frugter
    og grønsager og om almindelige gennemførelsesbestemmelser til tiltrædelsesakten
    for disse produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 41/81 τού Συμβουλίου
    τής 1ης Ιανουαρίου 1981 περί προσαρμογής τών
    διατάξεων τής πράξεως προσχωρήσεως τού 1979,
    όσον αφορά τόν τομέα τών μεταποιημένων οπωροκηπευτικών,
    καί περί καθορισμού τών γενικών κανόνων εφαρμογής
    τής εν λόγω πράξεως γιά τόν τομέα αυτόν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 41/81 del Consiglio, del 1° gennaio 1981, che adatta
    le dispozioni dell' atto di adesione del 1979 per quanto riguarda il settore degli
    ortofrutticoli trasformati e che determina le norme generali d' applicazione dell'
    atto relative a tale settore
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 41/81 van de Raad van 1 januari 1981 houdende aanpassing
    van het bepaalde in de Toetredingsakte van 1979 ten aanzien van de sector verwerkte
    groenten en fruit en houdende vaststelling van de algemene regels voor de toepassing
    van de Akte voor deze sector
  type: main
