title:
- language: en
  script: Latn
  content: '80/293/EEC: Commission decision of 18 february 1980 establishing that
    the conditions required for the admission free of Common Customs Tariff duties
    of the scientific apparatus described as ''Canberra-Multichannel Analyzer, model
    3100'' , are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/293/CEE: Décision de la Commission, du 18 février 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Canberra-Multichannel
    Analyzer, model 3100" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/293/EWG: Entscheidung der Kommission vom 18. Februar 1980, mit der
    festgestellt wird, daß die Voraussetzungen für die Befreiung von den Zöllen
    des Gemeinsamen Zolltarifs für das wissenschaftliche Gerät ,,Canberra-Multichannel
    Analyzer, model 3100'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/293/EØF: Kommissionens beslutning af 18. februar 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Canberra-Multichannel Analyzer, model 3100" ikke
    er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/293/ΕΟΚ: Απόφαση τής Επιτροπής τής 18ης
    Φεβρουαρίου 1980 περί διαπιστώσεως ότι δέν συντρέχουν
    οι απαιτούμενοι όροι γιά τήν παροχή ατελείας
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου
    στήν επιστημονική συσκευή μέ τήν ονομασία
    «Canberra—Multichannel Analyzer, model 3100»'
  type: main
- language: it
  script: Latn
  content: '80/293/CEE: Decisione della Commissione, del 18 febbraio 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Canberra-Multichannel
    Analyzer, model 3100" non sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/293/EEG: Beschikking van de Commissie van 18 februari 1980 vaststellende
    dat de voorwaarden welke vereist zijn voor de toelating met vrijstelling van de
    rechten van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat
    genaamd ,,Canberra - Multichannel Analyzer, model 3100'' '' niet vervuld zijn'
