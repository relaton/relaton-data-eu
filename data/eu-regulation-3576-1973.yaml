title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3576/73 of the Council of 28 December 1973 on the extension
    and modification of the arrangements made by Regulation (EEC) No 1253/73 on imports
    of the wine product exported under the label of 'Cyprus Sherry', originating in
    and coming from Cyprus, and the introduction of subsidies for similar wine products
    produced in the Community as originally constituted and exported to Ireland and
    the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3576/73 du Conseil, du 28 décembre 1973, prorogeant
    et modifiant le régime prévu par le règlement (CEE) n° 1253/73 relatif à
    l'importation du produit vinicole exporté sous la mention "Cyprus Sherry", originaire
    et en provenance de Chypre, et instituant des aides pour des produits vinicoles
    similaires produits dans la Communauté dans sa composition originaire et expédiés
    vers l'Irlande et le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3576/73 des Rates vom 28. Dezember 1973 zur Verlängerung
    und Änderung der mit der Verordnung (EWG) Nr. 1253/73 getroffenen Einfuhrregelung
    für das Weinbauerzeugnis mit Ursprung in und Herkunft aus Zypern, das unter der
    Bezeichnung "Cyprus sherry" ausgeführt wird, sowie der Beihilferegelung für
    gleichartige Weinbauerzeugnisse, die in der Gemeinschaft in ihrer ursprünglichen
    Zusammensetzung erzeugt und nach Irland und dem Vereinigten Königreich ausgeführt
    werden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3576/73 af 28. december 1973 om en forlængelse
    og ændring af den ordning, som er fastsat i forordning (EØF) nr. 1253/73 om
    indførsel af vinprodukter, udført under betegnelsen »Cyprus Sherry« med oprindelse
    i og indført fra Cypern, og om oprettelse af støtte til lignende vinprodukter,
    der er fremstillet inden for Fællesskabet i dets oprindelige udstrækning og
    afsendt til Irland og Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3576/73 del Consiglio, del 28 dicembre 1973, che proroga
    e modifica il regime previsto dal regolamento (CEE) n. 1253/73 relativo all'importazione
    del prodotto vinicolo esportato sotto la menzione «Cyprus Sherry», originario
    e in provenienza da Cipro, ed istitutivo di aiuti per prodotti vinicoli simili
    prodotti nella Comunità nella sua composizione originaria e spediti verso l'Irlanda
    e il Regno Unito
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3576/73 van de Raad van 28 december 1973 tot verlenging
    en wijziging van de regeling ingesteld bij Verordening (EEG) nr. 1253/73 betreffende
    de invoer van het onder de naam "Cyprus sherry" uitgevoerde wijnbouwprodukt van
    oorsprong en van herkomst uit Cyprus en houdende instelling van steunmaatregelen
    voor soortgelijke in de Gemeenschap in haar oorspronkelijke samenstelling geproduceerde
    wijnbouwprodukten die worden verzonden naar Ierland en het Verenigd Koninkrijk
  type: main
