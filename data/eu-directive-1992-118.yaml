    ελέγχου καθώς και των υγειονομικών όρων που
    διέπουν το εμπόριο και τις εισαγωγές στην Κοινότητα
    προϊόντων που δεν υπόκεινται, όσον αφορά τους
    προαναφερόμενους όρους, στις ειδικές κοινοτικές
