title:
- language: en
  script: Latn
  content: Council Directive 92/118/EEC of 17 December 1992 laying down animal health
    and public health requirements governing trade in and imports into the Community
    of products not subject to the said requirements laid down in specific Community
    rules referred to in Annex A (I) to Directive 89/662/EEC and, as regards pathogens,
    to Directive 90/425/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 92/118/CEE du Conseil, du 17 décembre 1992, définissant les
    conditions de police sanitaire ainsi que les conditions sanitaires régissant
    les échanges et les importations dans la Communauté de produits non soumis,
    en ce qui concerne lesdites conditions, aux réglementations communautaires spécifiques
    visées à l'annexe A chapitre 1er de la directive 89/662/CEE et, en ce qui concerne
    les pathogènes, de la directive 90/425/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 92/118/EWG des Rates vom 17. Dezember 1992 über die tierseuchenrechtlichen
    und gesundheitlichen Bedingungen für den Handel mit Erzeugnissen tierischen Ursprungs
    in der Gemeinschaft sowie für ihre Einfuhr in die Gemeinschaft, soweit sie diesbezüglich
    nicht den spezifischen Gemeinschaftsregelungen nach Anhang A Kapitel I der Richtlinie
    89/662/EWG und - in bezug auf Krankheitserreger - der Richtlinie 90/425/EWG unterliegen
  type: main
- language: bg
  script: Cyrl
  content: Директива 92/118/ЕИО на Съвета от 17 декември
    1992 година за определяне на ветеринарно-санитарните
    и здравните изисквания относно търговията
    и вноса в Общността на продукти, които не са
    подчинени по отношение на посочените изисквания
    на специалните правила на Общността, посочени
    в глава I от приложение А към Директива 89/662/ЕИО
    и по отношение на патогените на Директива 90/425/ЕИО
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 92/118/EHS ze dne 17. prosince 1992 o veterinárních a
    hygienických předpisech pro obchod s produkty živočišného původu ve Společenství
    a jejich dovoz do Společenství, pokud se na ně nevztahují zvláštní předpisy
    Společenství uvedené v kapitole I přílohy A směrnice 89/662/EHS, a pokud
    jde o patogenní původce, směrnice 90/425/EHS
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 92/118/EØF af 17. december 1992 om dyresundhedsmæssige
    og sundhedsmæssige betingelser for samhandel med og indførsel til Fællesskabet
    af produkter, der for så vidt angår disse betingelser ikke er underlagt specifikke
    fællesskabsbestemmelser, som omhandlet i bilag A, kapitel I, i direktiv 89/662/EØF,
    og for så vidt angår patogener, i direktiv 90/425/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 92/118/ΕΟΚ του Συμβουλίου της 17ης Δεκεμβρίου
