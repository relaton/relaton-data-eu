    90/425/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 92/118/EMÜ, 17. detsember 1992, millega sätestatakse
    selliste toodete ühendusesisest kaubandust ja ühendusse importimist reguleerivad
    loomade ja inimeste tervishoiunõuded, mille suhtes ei kohaldata direktiivi 89/662/EMÜ
    A lisa I peatükis ja patogeenide puhul direktiivis 90/425/EMÜ osutatud ühenduse
    erieeskirjades sätestatud nõudeid
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 92/118/ETY, annettu 17 päivänä joulukuuta 1992,
    eläinten terveyttä ja kansanterveyttä koskevista vaatimuksista sellaisten tuotteiden
    yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa, joita eivät koske direktiivin
    89/662/ETY ja, taudinaiheuttajien osalta, direktiivin 90/425/ETY liitteessä A
    olevassa I luvussa mainittujen erityisten yhteisön säädösten kyseiset vaatimukset
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 92/118/EEZ od 17. prosinca 1992. o utvrđivanju zahtjeva
    za zdravlje životinja i zahtjeva za javno zdravlje kojima se uređuje trgovina
    i uvoz u Zajednicu proizvoda koji ne podliježu navedenim zahtjevima utvrđenim
    u posebnim pravilima Zajednice iz Priloga A dijela I. Direktive 89/662/EEZ te,
    s obzirom na patogene tvari, iz Direktive 90/425/EEZ
  type: main
- language: hu
  script: Latn
  content: A Tanács 92/118/EGK irányelve (1992. december 17.) a 89/662/EGK irányelv,
    illetve a kórokozók tekintetében a 90/425/EGK irányelv A. mellékletének
    I. pontjában felsorolt külön közösségi szabályokban megállapított állat-egészségügyi
    és közegészségügyi követelmények hatálya alá nem tartozó termékek Közösségen
    belüli kereskedelmére és a Közösségbe történő behozatalára irányadó
    állat-egészségügyi és közegészségügyi követelmények megállapításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 92/118/CEE del Consiglio, del 17 dicembre 1992, che stabilisce
    le condizioni sanitarie e di polizia sanitaria per gli scambi e le importazioni
    nella Comunità di prodotti non soggetti, per quanto riguarda tali condizioni,
    alle normative comunitarie specifiche di cui all'allegato A, capitolo I, della
    direttiva 89/662/CEE e, per quanto riguarda i patogeni, alla direttiva 90/425/CEE
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 92/118/EEK (1992. gada 17. decembris), ar ko paredz
    dzīvnieku veselības un sabiedrības veselības prasības attiecībā uz tādu
    produktu tirdzniecību un ievešanu Kopienā, uz kuriem neattiecas šādas prasības,
    kas paredzētas īpašos Kopienas noteikumos, kuri minēti Direktīvas 89/662/EEK
    A pielikuma I daļā, un – attiecībā uz slimību izraisītājiem – īpašos
    Kopienas noteikumos, kuri minēti Direktīvā 90/425/EEK
  type: main
- language: lt
  script: Latn
  content: 1992 m. gruodžio 17 d. Tarybos direktyva 92/118/EEB, nustatanti gyvūnų
    sveikatos ir visuomenės sveikatos reikalavimus, reglamentuojančius produktų,
    kuriems netaikomi minėti reikalavimai, nustatyti specialiose Bendrijos taisyklėse,
    nurodytose Direktyvos 89/662/EEB A priedo I dalyje, ir, ligų sukėlėjų atžvilgiu,
    Direktyvoje 90/425/EEB, prekybą Bendrijoje ir jų importą į Bendriją
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 92/118/KEE tas-17 ta’ Diċembru 1992 li tipprovdi
    għal rekwiżiti fir-rigward tas-saħħa ta’ l-annimali u tas-saħħa pubblika
    li jirregolaw il-kummerċ u l-importazzjoni fil-Komunità ta’ prodotti mhux
    soġġetti għar-rekwiżiti stabbiliti f'regoli Komunitarji speċifiċi msemmija
    fl-Anness A (I) tad-Direttiva 89/662/KEE u, fejn jidħlu l-patoġeni, għad-Direttiva
    90/425/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 92/118/EEG van de Raad van 17 december 1992 tot vaststelling
    van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer
    en de invoer in de Gemeenschap van produkten waarvoor ten aanzien van deze voorschriften
    geen specifieke communautaire regelgeving geldt als bedoeld in bijlage A, hoofdstuk
    I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 92/118/EWG z dnia 17 grudnia 1992 r. ustanawiająca warunki
    zdrowotne zwierząt i zdrowia publicznego regulujące handel i przywóz do Wspólnoty
    produktów nieobjętych wyżej wymienionymi warunkami ustanowionymi w szczególnych
    zasadach wspólnotowych określonych w załączniku A pkt I do dyrektywy 89/662/EWG
    oraz w zakresie czynników chorobotwórczych do dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 92/118/CEE do Conselho, de 17 de Dezembro de 1992, que define
    as condições sanitárias e de polícia sanitária que regem o comércio e as
    importações na Comunidade de produtos não sujeitos, no que respeita às referidas
    condições, às regulamentações comunitárias específicas referidas no capítulo
    I do anexo A da Directiva 89/662/CEE e, no que respeita aos agentes patogénicos,
    da Directiva 90/425/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva 92/118/CEE a Consiliului din 17 decembrie 1992 de stabilire a
    condițiilor de sănătate publică și animală care reglementează schimburile
    și importurile în Comunitate de produse care nu intră sub incidența condițiilor
    menționate, stabilite de reglementările comunitare specifice prevăzute de anexa
    A capitolul I la Directiva 89/662/CEE și, în ceea ce privește agenții patogeni,
    la Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 92/118/EHS zo 17. decembra 1992, ktorou sa stanovujú veterinárne
    a zdravotné požiadavky na obchodovanie s výrobkami, na ktoré sa nevzťahujú
    takéto požiadavky ustanovené v osobitných právnych predpisoch uvedených
    v prílohe A (I) k smernici 89/662/EHS a pokiaľ ide o patogény, k smernici 90/425/EHS,
    a na ich dovoz do spoločenstva
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 92/118/EGS z dne 17. decembra 1992 o zahtevah zdravstvenega
    varstva živali in javnozdravstvenega varstva, ki urejajo trgovino in uvoz v Skupnost
    za izdelke, ki niso predmet navedenih zahtev, določenih v posebnih pravilih Skupnosti
    iz Priloge A(I) Direktive 89/662/EGS, glede povzročiteljev bolezni pa v Direktivi
    90/425/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 92/118/CEE del Consejo, de 17 de diciembre de 1992, por la que
    se establecen las condiciones de policía sanitaria y sanitarias aplicables a
    los intercambios y a las importaciones en la Comunidad de productos no sometidos,
    con respecto a estas condiciones, a las normativas comunitarias específicas a
    que se refiere el capítulo I del Anexo A de la Directiva 89/662/CEE y, por lo
    que se refiere a los patógenos, de la Directiva 90/425/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 92/118/EEG av den 17 december 1992 om djurhälso- och
    hygienkrav för handel inom gemenskapen med produkter, som inte omfattas av sådana
    krav i de särskilda gemenskapsbestämmelser som avses i bilaga A. I till direktiv
    89/662/EEG och, i fråga om patogener, i direktiv 90/425/EEG, samt för import
    till gemenskapen av sådana produkter
  type: main
