title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2354/92 of 7 August 1992 re-establishing
    the levying of customs duties on products of category 75 (order No 40.0750), originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2354/92 de la Commission du 7 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    75 (numéro d'ordre 40.0750) originaires de Thaïlande, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2354/92 DER KOMMISSION vom 7. August 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie Nr. 75 (laufende Nummer 40.0750) mit
    Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2354/92 af 7. august 1992 om genindførelse
    af opkrævning af told for varer under kategori 75 (løbenummer 40.0750), som
    har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2354/92 της Επιτροπής
