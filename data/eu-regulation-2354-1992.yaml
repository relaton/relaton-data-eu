    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    75 (αύξων αριθμός 40.0750), καταγωγής Ταϊλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2354/92 DELLA COMMISSIONE del 7 agosto 1992 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria 75 (numero
    d'' ordine 40.0750) originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2354/92 VAN DE COMMISSIE van 7 augustus 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 75 (volgnummer 40.0750), van oorsprong uit Thailand, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad #'
  type: main
