id: EURegulation18822003
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EC) No 1882/2003 of the European Parliament and of the Council
    of 29 September 2003 adapting to Council Decision 1999/468/EC the provisions relating
    to committees which assist the Commission in the exercise of its implementing
    powers laid down in instruments subject to the procedure referred to in Article
    251 of the EC Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1882/2003 du Parlement européen et du Conseil du 29
    septembre 2003 portant adaptation à la décision 1999/468/CE du Conseil des dispositions
    relatives aux comités assistant la Commission dans l'exercice de ses compétences
    d'exécution prévues dans des actes soumis à la procédure visée à l'article
    251 du traité CE
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1882/2003 des Europäischen Parlaments und des Rates
    vom 29. September 2003 zur Anpassung der Bestimmungen über die Ausschüsse zur
    Unterstützung der Kommission bei der Ausübung von deren Durchführungsbefugnissen,
    die in Rechtsakten vorgesehen sind, für die das Verfahren des Artikels 251 des
    EG-Vertrags gilt, an den Beschluss 1999/468/EG des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1882/2003 на Европейския парламент
    и на Съвета от 29 септември 2003 година за адаптиране
    към Решение 1999/468/ЕО на Съвета на разпоредбите
    относно комитетите, които подпомагат Комисията
    при упражняването на изпълнителните ѝ правомощия,
    определени в актовете, които подлежат на процедурата,
    посочена в член 251 от Договора за Европейската
    общност
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 1882/2003 ze dne 29.
    září 2003 o přizpůsobení ustanovení týkajících se výborů, které jsou
    nápomocny Komisi při výkonu jejích prováděcích pravomocí, stanovených
    v právních aktech Rady přijatých postupem podle článku 251 Smlouvy o ES,
    ustanovením rozhodnutí 1999/468/ES
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EF) nr. 1882/2003 af 29. september
    2003 om tilpasning til Rådets afgørelse 1999/468/EF af bestemmelserne vedrørende
    de udvalg, der bistår Kommissionen i forbindelse med udøvelsen af de gennemførelsesbeføjelser,
    der er fastsat i retsakter omfattet af proceduren i EF-traktatens artikel 251
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1882/2003 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου της 29ης Σεπτεμβρίου
    2003 περί προσαρμογής στην απόφαση 1999/468/ΕΚ του
    Συμβουλίου των διατάξεων των σχετικών με τις
    επιτροπές που επικουρούν την Επιτροπή στην
    άσκηση των εκτελεστικών αρμοδιοτήτων της,
    οι οποίες προβλέπονται από πράξεις υποκείμενες
    στη διαδικασία του άρθρου 251 της συνθήκης ΕΚ
  type: main
- language: et
  script: Latn
  content: Euroopa parlamendi ja nõukogu määrus (EÜ) nr 1882/2003, 29. september
    2003, EÜ asutamislepingu artiklis 251 osutatud menetlusele vastavates õigusaktides
    sätestatud rakendusvolituste kasutamisel komisjoni abistavaid komiteesid käsitlevate
    sätete kohandamise kohta nõukogu otsusega 1999/468/EÜ
  type: main
- language: fi
  script: Latn
  content: Euroopan Parlamentin ja neuvoston asetus (EY) N:o 1882/2003, annettu 29
    päivänä syyskuuta 2003, EY:n perustamissopimuksen 251 artiklassa määrätyn
    menettelyn mukaisissa säädöksissä säädetyn täytäntöönpanovallan käytössä
    komissiota avustavia komiteoita koskevien sääntöjen mukauttamisesta neuvoston
    päätökseen 1999/468/EY
  type: main
- language: hr
  script: Latn
  content: Uredba (EZ) br. 1882/2003 Europskog parlamenta i Vijeća od 29. rujna 2003.
    o prilagodbi odredbi u vezi s odborima koji pomažu Komisiji u obavljanju njezinih
    provedbenih ovlasti predviđenih aktima koji podliježu postupku iz članka 251.
    Ugovora o EZ-u, s Odlukom Vijeća 1999/468/EZ
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 1882/2003/EK rendelete (2003. szeptember
    29.) a Bizottságot az EK-Szerződés 251. cikkében említett eljárásnak megfelelően
    elfogadott jogi aktusokban megállapított végrehajtási hatásköreinek gyakorlása
    során segítő bizottságokkal kapcsolatos rendelkezéseknek az 1999/468/EK tanácsi
    határozathoz történő hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1882/2003 del Parlamento europeo e del Consiglio del
    29 settembre 2003 recante adeguamento alla decisione 1999/468/CE del Consiglio
    delle disposizioni relative ai comitati che assistono la Commissione nell'esercizio
    delle sue competenze di esecuzione previste negli atti soggetti alla procedura
    prevista all'articolo 251 del trattato CE
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (EK) Nr. 1882/2003 (2003. gada 29.
    septembris), ar ko Padomes Lēmumam 1999/468/EK pielāgo noteikumus par komitejām,
    kuras palīdz Komisijai īstenot tai piešķirtās ieviešanas pilnvaras, kas
    noteiktas dokumentos, uz kuriem attiecas EK līguma 251. pantā minētā procedūra
  type: main
- language: lt
  script: Latn
  content: 2003 m. rugsėjo 29 d. Europos Parlamento ir Tarybos reglamentas (EB) Nr.
    1882/2003, suderinantis su Tarybos sprendimu 1999/468/EB nuostatas, susijusias
    su komitetais, padedančiais Komisijai naudotis savo įgyvendinimo įgaliojimais,
    nustatytais dokumentuose, priimtuose vadovaujantis EB sutarties 251 straipsnyje
    nustatyta tvarka
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament (KE) Nru 1882/2003 tal-Parlament Ewropew u tal-Kunsill tad-29
    ta' Settembru 2003 li jadatta għad-Deċiżjoni tal-Kunsill 1999/468/KE id-dispożizzjonijiet
    dwar kumitati li jassistu lill-Kummissjoni fl-eżerċizzju tas-setgħat ta' implimentazzjoni
    tagħha stabbiliti fi strumenti suġġetti għall-proċedura msemmija fl-Artikolu
    251 tat-Trattat tal-KE
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1882/2003 van het Europees Parlement en de Raad van
    29 september 2003 tot aanpassing aan Besluit 1999/468/EG van de Raad van de bepalingen
    betreffende de comités die de Commissie bijstaan in de uitoefening van haar uitvoeringsbevoegdheden
    die zijn vastgelegd in besluiten waarop de procedure van artikel 251 van het Verdrag
    van toepassing is
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie (WE) nr 1882/2003 Parlamentu Europejskiego i Rady z dnia
    29 września 2003 r. dostosowujące do decyzji Rady 1999/468/WE przepisy odnoszące
    się do komitetów, które wspomagają Komisję w wykonywaniu jej uprawnień wykonawczych
    ustanowionych w instrumentach podlegających procedurze określonej w art. 251
    Traktatu WE
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1882/2003 do Parlamento Europeu e do Conselho de
    29 de Setembro de 2003 que adapta à Decisão 1999/468/CE do Conselho, as disposições
    relativas aos comités que assistem a Comissão no exercício das suas competências
    de execução previstas em actos sujeitos ao artigo 251.° do Tratado
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1882/2003 al Parlamentului European și al Consiliului
    din 29 septembrie 2003 de adaptare la Decizia 1999/468/CE a Consiliului a dispozițiilor
    privind comitetele care asistă Comisia în exercitarea competențelor de executare
    prevăzute de actele care fac obiectul procedurii menționate la articolul 251
    din Tratatul CE
  type: main
- language: sk
  script: Latn
  content: Nariadenie (ES) č. 1882/2003 Európskeho parlamentu a Rady z 29. septembra
    2003, ktorým sa podľa rozhodnutia Rady 1999/468/ES upravujú ustanovenia týkajúce
    sa výborov, ktoré pomáhajú Komisii pri výkone jej vykonávacích právomocí
    ustanovených v nástrojoch, ktoré podliehajú postupu uvedenému v článku
    251 Zmluvy o založení ES
  type: main
- language: sl
  script: Latn
  content: Uredba (ES) št. 1882/2003 Evropskega parlamenta in Sveta z dne 29. septembra
    2003 o prilagoditvi določb glede odborov, ki pomagajo Komisiji pri uresničevanju
    njenih izvedbenih pooblastil, predvidenih aktih, za katere se uporablja postopek
    iz člena 251 Pogodbe ES, Sklepu Sveta 1999/468/ES
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1882/2003 del Parlamento Europeo y del Consejo de 29
    de septiembre de 2003 sobre la adaptación a la Decisión 1999/468/CE del Consejo
    de las disposiciones relativas a los comités que asisten a la Comisión en el
    ejercicio de sus competencias de ejecución previstas en los actos sujetos al
    procedimiento establecido en el artículo 251 del Tratado CE
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EG) nr 1882/2003 av den 29
    september 2003 om anpassning till rådets beslut 1999/468/EG av de bestämmelser
    i rättsakter som omfattas av förfarandet i artikel 251 i EG-fördraget som avser
    de kommittéer som biträder kommissionen när den utövar sina genomförandebefogenheter
  type: main
