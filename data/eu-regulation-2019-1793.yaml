    kas attiecas uz noteiktu preču ievešanu Savienībā no konkrētām trešām
    valstīm, un ar kuru īsteno Eiropas Parlamenta un Padomes Regulas (ES) 2017/625
    un (EK) Nr. 178/2002 un atceļ Komisijas Regulas (EK) Nr. 669/2009, (ES) Nr. 884/2014,
