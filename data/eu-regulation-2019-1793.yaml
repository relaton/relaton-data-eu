    vstupu určitých druhov tovaru z tretích krajín, ktoré vykonávajú nariadenia
    Európskeho parlamentu a Rady (EÚ) 2017/625 a (ES) č. 178/2002, do Únie, a
    o zrušení nariadení Komisie (ES) č. 669/2009, (EÚ) č. 884/2014, (EÚ) 2015/175,
