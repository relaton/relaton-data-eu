    urgență care reglementează intrarea în Uniune a anumitor bunuri din anumite
    țări terțe, de punere în aplicare a Regulamentelor (UE) 2017/625 și (CE)
    nr. 178/2002 ale Parlamentului European și ale Consiliului și de abrogare a
    Regulamentelor (CE) nr. 669/2009, (UE) nr. 884/2014, (UE) 2015/175, (UE) 2017/186
