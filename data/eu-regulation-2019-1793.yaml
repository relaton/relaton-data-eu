title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1793 of 22 October 2019 on
    the temporary increase of official controls and emergency measures governing the
    entry into the Union of certain goods from certain third countries implementing
    Regulations (EU) 2017/625 and (EC) No 178/2002 of the European Parliament and
    of the Council and repealing Commission Regulations (EC) No 669/2009, (EU) No
    884/2014, (EU) 2015/175, (EU) 2017/186 and (EU) 2018/1660
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2019/1793 de la Commission du 22 octobre
    2019 relatif au renforcement temporaire des contrôles officiels et aux mesures
    d’urgence régissant l’entrée dans l’Union de certains biens provenant
    de certains pays tiers, mettant en œuvre les règlements (UE) 2017/625 et (CE)
    n° 178/2002 du Parlement européen et du Conseil et abrogeant les règlements
    (CE) n° 669/2009, (UE) n° 884/2014, (UE) 2015/175, (UE) 2017/186 et (UE) 2018/1660
    de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1793 der Kommission vom 22. Oktober
    2019 über die vorübergehende Verstärkung der amtlichen Kontrollen und über
    Sofortmaßnahmen beim Eingang bestimmter Waren aus bestimmten Drittländern in
    die Union zur Durchführung der Verordnungen (EU) 2017/625 und (EG) Nr. 178/2002
    des Europäischen Parlaments und des Rates und zur Aufhebung der Verordnungen
    (EG) Nr. 669/2009, (EU) Nr. 884/2014, (EU) 2015/175, (EU) 2017/186 und (EU) 2018/1660
    der Kommission
  type: main
