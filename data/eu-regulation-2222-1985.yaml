title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2222/85 of 31 July 1985 fixing for the 1985/86
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for tomato based products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2222/85 de la Commission du 31 juillet 1985 fixant,
    pour la campagne 1985/1986, le prix minimal à payer aux producteurs pour les
    tomates ainsi que le montant de l' aide à la production pour les produits à
    base de tomates
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2222/85 der Kommission vom 31. Juli 1985 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises für Tomaten sowie des Betrages
    der Produktionsbeihilfe für Verarbeitungserzeugnisse aus Tomaten für das Wirtschaftsjahr
    1985/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2222/85 af 31. juli 1985 om fastsættelse
    af produktionsåret 1985/86 af den minimumpris, der skal betales til producenterne
    for tomater, samt producentstøtten for produkter forarbejdet på basis af tomater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2222/85 της Επιτροπής
    της 31ης Ιουλίου 1985 για τον καθορισμό, για την
    περίοδο εμπορίας 1985/86, της ελάχιστης τιμής
    που πληρώνεται στους παραγωγούς για τις τομάτες
    και του ποσού της ενίσχυσης στην παραγωγή για
    προϊόντα με βάση τις τομάτες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2222/85 della Commissione del 31 luglio 1985 che fissa,
    per la campagna di commercializzazione 1985/1986, il prezzo minimo dei pomodori
    da pagare ai produttori e l' importo dell' aiuto alla produzione per i prodotti
    a base di pomodoro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2222/85 van de Commissie van 31 juli 1985 tot vaststelling,
    voor het verkoopseizoen 1985/1986, van de aan de telers te betalen minimumprijs
    voor tomaten, alsmede van het bedrag van de steun bij de produktie voor op basis
    van tomaten verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2222/85 da Comissão, de 31 de Julho de 1985, que
    fixa, para a campanha de 1985/1986, o preço mínimo a pagar aos produtores em
    relação aos tomates bem como o montante da ajuda à produção para os produtos
    à base de tomates
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2222/85 de la Comisión, de 31 de julio de 1985, por
    el que se fija, para la campaña 1985/86, el precio mínimo que deberá pagarse
    a los productores por los tomates así como el importe de la ayuda a la producción
    por los productos a base de tomates
  type: main
