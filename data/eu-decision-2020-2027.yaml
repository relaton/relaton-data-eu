title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/2027 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the EU-Central America Association
    Council as regards modifications to Appendix 2 to Annex II and the introduction
    of Explanatory Notes to Articles 15, 16, 19, 20 and 30 of Annex II to the Agreement
    establishing an Association between the European Union and its Member States,
    on the one hand, and Central America on the other, and repealing Decisions (EU)
    2016/1001 and (EU) 2016/1336
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/2027 du Conseil du 7 décembre 2020 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil d’association
    UE-Amérique centrale en ce qui concerne des modifications de l’appendice 2
    de l’annexe II et l’introduction de notes explicatives relatives aux articles
    15, 16, 19, 20 et 30 de l’annexe II de l’accord établissant une association
    entre l’Union européenne et ses États membres, d’une part, et l’Amérique
    centrale, d’autre part, et abrogeant les décisions (UE) 2016/1001 et (UE) 2016/1336
  type: main
- language: de
