    (tfassil mill-ġdid)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2008/92/EG van het Europees Parlement en de Raad van 22 oktober
    2008 betreffende een communautaire procedure inzake de doorzichtigheid van de
    prijzen van gas en elektriciteit voor industriële eindverbruikers (herschikking)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2008/92/WE z dnia 22 października
    2008 r. dotycząca wspólnotowej procedury w celu poprawy przejrzystości cen
    gazu i energii elektrycznej dla końcowych odbiorców przemysłowych (Wersja przekształcona)
  type: main
- language: pt
  script: Latn
  content: Directiva 2008/92/CE do Parlamento Europeu e do Conselho, de 22 de Outubro
    de 2008 , que estabelece um processo comunitário que assegure a transparência
    dos preços no consumidor final industrial de gás e electricidade (reformulação)
  type: main
- language: ro
  script: Latn
  content: Directiva 2008/92/CE a Parlamentului European și a Consiliului din 22
    octombrie 2008 privind o procedură comunitară de ameliorare a transparenței
    prețurilor la gaz și energie electrică aplicate utilizatorilor finali din industrie
    (reformare)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2008/92/ES z 22. októbra 2008 o
    postupe Spoločenstva na zlepšenie transparentnosti cien plynu a elektrickej
    energie účtovaných priemyselným koncovým odberateľom (prepracované znenie)
  type: main
- language: sl
  script: Latn
  content: Direktiva 2008/92/ES Evropskega parlamenta in Sveta z dne 22. oktobra 2008
    o enotnem postopku Skupnosti za večjo preglednost cen plina in električne energije
    ki se zaračunavajo industrijskim končnim uporabnikom (prenovitev)
  type: main
- language: es
  script: Latn
  content: Directiva 2008/92/CE del Parlamento Europeo y del Consejo, de 22 de octubre
    de 2008 , relativa a un procedimiento comunitario que garantice la transparencia
    de los precios aplicables a los consumidores industriales finales de gas y de
    electricidad (versión refundida)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2008/92/EG av den 22 oktober 2008
    om ett gemenskapsförfarande för att främja öppenheten beträffande prissättningen
    på gas och el levererad till industriella slutanvändare (omarbetning)
  type: main
