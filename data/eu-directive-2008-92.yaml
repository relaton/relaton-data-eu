    на цените на газ и електроенергия за промишлени
    крайни потребители (преработена)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2008/92/ES ze dne 22. října 2008
    o postupu v rámci Společenství pro zvýšení transparentnosti cen plynu a
    elektřiny účtovaných konečným průmyslovým velkoodběratelům (přepracované
    znění)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2008/92/EF af 22. oktober 2008
    om en fællesskabsprocedure med hensyn til gennemsigtigheden af prisen på gas
    og elektricitet til den endelige forbruger i industrien (omarbejdning)
  type: main
- language: el
  script: Grek
