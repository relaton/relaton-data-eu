title:
- language: en
  script: Latn
  content: Directive 2008/92/EC of the European Parliament and of the Council of 22
    October 2008 concerning a Community procedure to improve the transparency of gas
    and electricity prices charged to industrial end-users (recast)
  type: main
- language: fr
  script: Latn
  content: Directive 2008/92/CE du Parlement européen et du Conseil du 22 octobre
    2008 instaurant une procédure communautaire assurant la transparence des prix
    au consommateur final industriel de gaz et d’électricité (refonte)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2008/92/EG des Europäischen Parlaments und des Rates vom 22.
    Oktober 2008 zur Einführung eines gemeinschaftlichen Verfahrens zur Gewährleistung
    der Transparenz der vom industriellen Endverbraucher zu zahlenden Gas- und Strompreise
    (Neufassung)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2008/92/ЕО на Европейския парламент
