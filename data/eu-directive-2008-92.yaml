    με κοινοτική διαδικασία για τη βελτίωση της
    διαφάνειας των τιμών αερίου και ηλεκτρικής
    ενέργειας για τον τελικό βιομηχανικό καταναλωτή
    (αναδιατύπωση)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2008/92/EÜ, 22. oktoober 2008
