    ja elektrihindade läbipaistvuse parandamiseks (uuestisõnastamine)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2008/92/EY, annettu 22 päivänä
    lokakuuta 2008 , yhteisön menettelyn toteuttamiseksi kaasusta ja sähköstä
    teollisilta käyttäjiltä perittävien hintojen avoimuuden takaamiseksi (uudelleenlaadittu)
  type: main
- language: hr
  script: Latn
  content: Direktiva 2008/92/EZ Europskog parlamenta i Vijeća od 22. listopada 2008.
