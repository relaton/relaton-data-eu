    i Japan og om ophævelse af antidumpingforanstaltningerne vedrørende sådan import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1114/97 του Συμβουλίου
    της 17ης Ιουνίου 1997 για την περάτωση της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές εξωτερικών
    δακτυλίων κωνικών ρουλεμάν, καταγωγής Ιαπωνίας,
    και την ανάκληση των μέτρων αντιντάμπινγκ
    επί των εισαγωγών αυτών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1114/97, annettu 17 päivänä kesäkuuta 1997,
    Japanista peräisin olevien kartiorullalaakereiden ulkorenkaiden tuontia koskevan
    polkumyynnin vastaisen menettelyn päättämisestä ja tällaisessa tuonnissa
    käyttöön otettujen polkumyyntitoimenpiteiden kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1114/97 del Consiglio del 17 giugno 1997 che chiude
    il procedimento antidumping relativo alle importazioni di anelli esterni di cuscinetti
    a rulli conici originari del Giappone e che abroga le misure antidumping nei confronti
    di tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1114/97 van de Raad van 17 juni 1997 houdende beëindiging
    van de antidumpingprocedure met betrekking tot de invoer van buitenringen van
    kegellagers van oorsprong uit Japan en intrekking van de op deze invoer ingestelde
    antidumpingmaatregelen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1114/97 do Conselho de 17 de Junho de 1997 que encerra
    o processo anti-dumping relativo às importações de anéis exteriores de rolamentos
    de roletes cónicos originários do Japão e revoga as medidas anti- dumping instituídas
    sobre essas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1114/97 del Consejo de 17 de junio de 1997 por el que
