    mit Ursprung in Japan und zur Aufhebung der für die betreffenden Einfuhren eingeführten
    Antidumpingmaßnahmen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1114/97 af 17. juni 1997 om afslutning af antidumpingproceduren
