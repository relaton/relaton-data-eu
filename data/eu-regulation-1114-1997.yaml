  content: Council Regulation (EC) No 1114/97 of 17 June 1997 terminating the anti-dumping
    proceeding concerning imports of outer rings of tapered roller bearings originating
    in Japan and repealing the anti-dumping measures imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1114/97 du Conseil du 17 juin 1997 clôturant la procédure
