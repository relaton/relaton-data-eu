title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1550/77 of 8 July 1977 re-establishing the
    levying of the customs duties on electrical capacitors, fixed or variable falling
    within heading No 85.18 originating in Singapore to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1550/77 de la Commission, du 8 juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques, fixes, variables ou ajustables, de la position tarifaire 85.18,
    originaires de Singapour, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1550/77 der Kommission vom 8. Juli 1977 zur Wiedereinführung
    des Zollsatzes für elektrische Festkondensatoren, Drehkondensatoren und andere
    einstellbare Kondensatoren der Tarifnummer 85.18, mit Ursprung in Singapur, dem
    die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1550/77 af 8. juli 1977 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable,
    under position 85.18, som har oprindelse i Singapore og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1550/77 della Commissione, dell'8 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce doganale 85.18, originari di Singapore,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1550/77 van de Commissie van 8 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op elektrische
    condensatoren (vaste condensatoren, draaicondensatoren en regelbare of instelbare
    condensatoren) van post 85.18, van oorsprong uit Singapore, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
