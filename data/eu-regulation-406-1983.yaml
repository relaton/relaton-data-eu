  content: Council Regulation (EEC) No 406/83 of 21 February 1983 amending Regulation
    (EEC) No 179/83 laying down certain interim measures for the conservation and
    management of fishery resources applicable to vessels flying the flag of Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 406/83 du Conseil du 21 février 1983 modifiant le
    règlement (CEE) no 179/83 fixant certaines mesures intérimaires de conservation
    et de gestion des ressources de pêches applicables aux navires battant pavillon
    de la Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 406/83 des Rates vom 21. Februar 1983 zur Änderung
    der Verordnung (EWG) Nr. 179/83 zur Festlegung von Interimsmaßnahmen zur Erhaltung
    und Bewirtschaftung der Fischbestände gegenüber Schiffen unter schwedischer
    Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 406/83 af 21. februar 1983 om ændring af
    forordning (EØF) nr. 179/83 om fastsættelse af visse midlertidige foranstaltninger
    til bevarelse og forvaltning af fiskeressourcerne, som skal finde anvendelse på
    fartøjer, der fører svensk flag
  type: main
