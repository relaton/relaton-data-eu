title:
- language: fr
  script: Latn
  content: Décision 65/411/CEE de la Commission, du 10 août 1965, relative au recours
    de la République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité,
    pour exclure du traitement communautaire les machines à coudre à usage domestique
    de la position 84.41 Ex A du Tarif douanier commun, originaires de la République
    populaire de Chine, et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/411/EWG: Entscheidung der Kommission vom 10. August 1965 über den
    Antrag der Bundesrepublik Deutschland gemäß Artikel 115 Absatz (1) des Vertrages,
    Haushaltsnähmaschinen der Tarifnummer 84.41 ex A des Gemeinsamen Zolltarifs mit
    Ursprung in der Volksrepublik China, die sich in den anderen Mitgliedstaaten im
    freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/411/CEE: Decisione della Commissione, del 10 agosto 1965, relativa
    al ricorso della Repubblica federale di Germania all''articolo 115, primo comma,
    del Trattato, per escludere dal trattamento comunitario le macchine per cucire
    ad uso domestico di cui alla voce 84.41 ex A della tariffa doganale comune, originarie
    della Repubblica popolare cinese ed immesse in libera pratica negli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: '65/411/EEG: Beschikking van de Commissie van 10 augustus 1965, betreffende
    het verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea, van het Verdrag naaimachines voor huishoudelijk gebruik van post 84.41
    ex A van het gemeenschappelijk douanetarief, die van oorsprong zijn uit de Volksrepubliek
    China en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
