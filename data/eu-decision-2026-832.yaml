    mit dem Abkommen über Handel und Zusammenarbeit zwischen der Europäischen Union
    und der Europäischen Atomgemeinschaft einerseits und dem Vereinigten Königreich
    Großbritannien und Nordirland andererseits eingesetzt wurde, im Hinblick auf
    die Annahme eines Beschlusses zur Erstellung einer Liste von Personen, die bereit
