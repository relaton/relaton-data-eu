- language: en
  script: Latn
  content: Council Decision (EU) 2026/832 of 30 March 2026 on the position to be taken
    on behalf of the European Union within the Trade Specialised Committee on Level
    Playing Field for Open and Fair Competition and Sustainable Development established
    by the Trade and Cooperation Agreement between the European Union and the European
    Atomic Energy Community, of the one part, and the United Kingdom of Great Britain
    and Northern Ireland, of the other part, as regards the adoption of a decision
    to establish a list of individuals who are willing and able to serve as members
    of the panel of experts established under Article 409 of that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/832 du Conseil du 30 mars 2026 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité spécialisé «Commerce»
    chargé des conditions équitables pour une concurrence ouverte et loyale et un
    développement durable institué par l’accord de commerce et de coopération
    entre l’Union européenne et la Communauté européenne de l’énergie atomique,
    d’une part, et le Royaume-Uni de Grande-Bretagne et d’Irlande du Nord, d’autre
    part, en ce qui concerne l’adoption d’une décision établissant une liste
    de personnes disposées et aptes à faire partie d’un groupe d’experts établi
    en vertu de l’article 409 dudit accord
  type: main
