id: EURegulation22601997
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2260/97 of 13 November 1997 derogating from
    Regulation (EEC) No 2454/93 in respect of the definition of the concept of originating
    products used for the purposes of the scheme of generalized preferences to take
    account of the special situation of Bangladesh regarding certain exports of textiles
    to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2260/97 de la Commission du 13 novembre 1997 portant
    dérogation au règlement (CEE) nº 2454/93 en ce qui concerne la définition
    de la notion de «produits originaires» établie dans le cadre du schéma de
    préférences tarifaires généralisées pour tenir compte de la situation particulière
    du Bangladesh en ce qui concerne certains produits textiles exportés de ce pays
    vers la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2260/97 der Kommission vom 13. November 1997 über
    eine Abweichung von der Bestimmung des Begriffs "Ursprungserzeugnisse" in der
    Verordnung (EWG) Nr. 2454/93 im Rahmen des Allgemeinen Präferenzsystems zur Berücksichtigung
    der besonderen Lage Bangladeschs bei bestimmten in die Gemeinschaft ausgeführten
    Textilwaren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2260/97 af 13. november 1997 om en undtagelse
    fra forordning (EØF) nr. 2454/93, hvad angår definitionen af begrebet »varer
    med oprindelsesstatus« i henhold til den generelle præferenceordning, for at
    tage hensyn til den særlige situation i Bangladesh for visse tekstilvarer, der
    udføres fra dette land til Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2260/97 της Επιτροπής
    της 13ης Νοεμβρίου 1997 σχετικά με την παρέκκλιση
    από τον κανονισμό (ΕΟΚ) αριθ. 2454/93 όσον αφορά
    την έννοια των «προϊόντων καταγωγής» που ορίζεται
    στο πλαίσιο του συστήματος γενικευμένων δασμολογικών
    προτιμήσεων, προκειμένου να ληφθεί υπόψη η
    ιδιαίτερη κατάσταση του Μπαγκλαντές όσον αφορά
    ορισμένα κλωστοϋφαντουργικά προϊόντα που
    εξάγονται από τη χώρα αυτή προς την Κοινότητα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2260/97, annettu 13 päivänä marraskuuta 1997,
    asetuksessa (ETY) N:o 2454/93 osana yleistä tullietuusjärjestelmää annetusta
    "alkuperätuotteiden" käsitteen määritelmästä poikkeamisesta Bangladeshin
    erityistilanteen huomioon ottamiseksi tiettyjen tästä maasta yhteisöön vietävien
    tekstiilituotteiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2260/97 della Commissione del 13 novembre 1997 recante
    deroga al regolamento (CEE) n. 2454/93 per quanto riguarda la definizione della
    nozione di «prodotti originari» stabilita nell'ambito dello schema di preferenze
    tariffarie generalizzate per tener conto della particolare situazione del Bangladesh
    per quanto concerne alcuni prodotti tessili esportati da tale paese nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2260/97 van de Commissie van 13 november 1997 houdende
    afwijking van de in Verordening (EEG) nr. 2454/93 opgenomen definitie van het
    begrip "producten van oorsprong" in het kader van het stelsel van algemene tariefpreferenties
    om rekening te houden met de bijzondere situatie van Bangladesh wat de uitvoer
    van bepaalde textielproducten naar de Gemeenschap betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2260/97 da Comissão de 13 de Novembro de 1997 que
    derroga o Regulamento (CEE) nº 2454/93 no que se refere à definição da noção
    de «produtos originários» estabelecida no âmbito do sistema de preferências
    pautais generalizadas, a fim de ter em conta a situação específica do Bangladesh
    no que respeita a determinados produtos têxteis exportados deste país para a
    Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2260/97 de la Comisión de 13 de noviembre de 1997
    por el que se establece una excepción al Reglamento (CEE) nº 2454/93 en lo relativo
    a la definición del concepto de «productos originarios» establecido con arreglo
    al plan de preferencias arancelarias generalizadas a fin de tener en cuenta la
    situación particular de Bangladesh por lo que se refiere a determinados productos
    textiles exportados de este país a la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2260/97 av den 13 november 1997 om undantag
    från förordning (EEG) nr 2454/93 med avseende på definitionen av begreppet
    "ursprungsvaror" som fastställs inom ramen för systemet för allmän förmånsbehandling
    för att ta hänsyn till Bangladeshs särskilda situation när det gäller vissa
    textilprodukter som exporteras från detta land till gemenskapen
  type: main
