title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3664/90 of 18 December 1990 establishing,
    for 1991, the list of vessels exceeding eight metres lenght overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate lenght exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3664/90 de la Commission, du 18 décembre 1990, établissant
    pour 1991 la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3664/90 DER KOMMISSION VOM 18. DEZEMBER 1990 ZUR
    FESTLEGUNG DER LISTE FUER 1991 DER SCHIFFE MIT EINER LAENGE UEBER ALLES VON MEHR
    ALS 8 M, DIE IN BESTIMMTEN GEBIETEN DER GEMEINSCHAFT MIT BAUMKURREN, DEREN GESAMTBAUMLAENGE
    MEHR ALS 9 M BETRAEGT, AUF SEEZUNGE FISCHEN DUERFEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3664/90 af 18. december 1990 om listen
    for 1991 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3664/90 της Επιτροπής
    της 18ης Δεκεμβρίου 1990 που καταρτίζει για το
    1991, τον κατάλογο των σκαφών συνολικού μήκους
    άνω των οκτώ μέτρων τα οποία επιτρέπεται να
    αλιεύουν γλώσσες σε ορισμένες περιοχές της
    Κοινότητας χρησιμοποιώντας δοκότρατες των
    οποίων το συνολικό μήκος υπερβαίνει τα εννέα
    μέτρα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 3664/90 DELLA COMMISSIONE, DEL 18 DICEMBRE 1990,
    CHE FISSA L' ELENCO PER IL 1991 DEI PESCHERECCI DI LUNGHEZZA FUORI TUTTO SUPERIORE
    A OTTO METRI, AUTORIZZATI A PESCARE LA SOGLIOLA IN DETERMINATE ZONE DELLA COMUNITA,
    UTILIZZANDO RETI A STRASCICO A PALI, LA CUI LUNGHEZZA COMPLESSIVA SUPERI I 9 METRI
  type: main
- language: nl
  script: Latn
  content: VERORDENING ( EEG ) NR. 3664/90 VAN DE COMMISSIE VAN 18 DECEMBER 1990 TOT
    VASTSTELLING VOOR 1991 VAN DE LIJST VAN VAARTUIGEN MET EEN LENGTE OVER ALLES VAN
    MEER DAN 8 METER EN DIE IN BEPAALDE ZONES VAN DE GEMEENSCHAP MET BOOMKORREN WAARVAN
    DE TOTALE BOOMLENGTE MEER DAN 9 METER BEDRAAGT, OP TONG MOGEN VISSEN
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 3664/90 DA COMISSAO, DE 18 DE DEZEMBRO DE 1990,
    QUE ESTABELECE PARA 1991 A LISTA DOS NAVIOS COM MAIS DE OITO METROS DE COMPRIMENTO
    DE FORA A FORA AUTORIZADOS A PESCAR LINGUADO EM DETERMINADAS ZONAS DA COMUNIDADE,
    UTILIZANDO REDES DE ARRASTO DE VARA EM QUE O COMPRIMENTO TOTAL DAS VARAS SEJA
    SUPERIOR A NOVE METROS
  type: main
- language: es
  script: Latn
  content: REGLAMENTO ( CEE ) NO 3664/90 DE LA COMISION, DE 18 DE DICIEMBRE DE 1990,
    POR EL QUE SE ESTABLECE PARA 1991 LA LISTA DE BARCOS CUYA ESLORA TOTAL EXCEDE
    LOS OCHO METROS Y A LOS QUE SE PERMITE LA PESCA DEL LENGUADO DENTRO DE DETERMINADAS
    ZONAS DE LA COMUNIDAD UTILIZANDO ARTES DE ARRASTE DE VARA CUYA LONGITUD TOTAL
    SUPERE LOS NUEVE METROS
