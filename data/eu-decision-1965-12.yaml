title:
- language: fr
  script: Latn
  content: Décision 65/12/CEE de la Commission, du 21 décembre 1964, autorisant
    la perception d'une taxe compensatoire sur les importations, en République fédérale
    d'Allemagne, de caramels mous, de caramels durs, de dragées, ainsi que de pâte
    à fondant en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '65/12/EWG: Entscheidung der Kommission vom 21. Dezember 1964 über die
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung einer Ausgleichsabgaben
    auf Einfuhren von Hartkaramellen, Weichkaramellen und Dragées in die Bundesrepublik
    Deutschland aus einigen Mitgliedstaaten'
  type: main
- language: it
  script: Latn
  content: '65/12/CEE: Decisione della Commissione, del 21 dicembre 1964, che autorizza
    la riscossione di una lassa di compensazione sulle importazioni nella Repubblica
    federale di Germania di caramelle tenere, di caramelle dure e di confetti, di
    pasta per fondente, in provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/12/EEG: Beschikking van de Commissie van 21 december 1964 houdende
    machtiging tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van zachte karamels, harde karamels, dragees en fondant uit bepaalde
    Lid-Staten'
  type: main
