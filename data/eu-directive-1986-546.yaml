title:
- language: en
  script: Latn
  content: Second Commission Directive 86/546/EEC of 29 October 1986 amending the
    Annexes to Council Directive 77/93/EEC on protective measures against the introduction
    into the Member States of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Seconde directive 86/546/CEE de la Commission du 29 octobre 1986 modifiant
    les annexes de la directive 77/93/CEE du Conseil concernant les mesures de protection
    contre l'introduction dans les États membres d'organismes nuisibles aux végétaux
    ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Zweite Richtlinie 86/546/EWG der Kommission vom 29. Oktober 1986 zur Änderung
    der Anhänge der Richtlinie 77/93/EWG des Rates über Maßnahmen zum Schutz gegen
    das Verbringen von Schadorganismen der Pflanzen oder Pflanzenerzeugnisse in die
    Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens andet direktiv 86/546/EØF af 29. oktober 1986 om ændring
    af bilagene til Rådets direktiv 77/93/EØF om foranstaltninger mod indslæbning
    i medlemsstaterne af skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Δεύτερη οδηγία 86/546/ΕΟΚ της Επιτροπής της
    29ης Οκτωβρίου 1986 που τροποποιεί τα παραρτήματα
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου περί των
    μέτρων προστασίας κατά της εισαγωγής στα κράτη
    μέλη οργανισμών επιβλαβών για τα φυτά ή τα
    φυτικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Toinen komission direktiivi 86/546/ETY, annettu 29 päivänä lokakuuta
    1986, kasvien tai kasvituotteiden haitallisten organismien yhteisöön kulkeutumisen
    estämiseen liittyvistä suojatoimenpiteistä annetun neuvoston direktiivin 77/93/ETY
    liitteiden muuttamisesta
  type: main
- language: it
  script: Latn
  content: Seconda direttiva 86/546/CEE della Commissione del 29 ottobre 1986 che
    modifica gli allegati della direttiva 77/93/CEE del Consiglio concernente le misure
    di protezione contro l'introduzione negli Stati Membri di organismi nocivi ai
    vegetali o ai prodotti vegetali
  type: main
- language: nl
  script: Latn
  content: Tweede Richtlijn 86/546/EEG van de Commissie van 29 oktober 1986 tot wijziging
    van de bijlagen bij Richtlijn 77/93/EEG van de Raad betreffende de beschermende
    maatregelen tegen het binnenbrengen op het grondgebied van de Lid-Staten van voor
    planten of voor plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Segunda Directiva 86/546/CEE da Comissão de 29 de Outubro de 1986 que
    altera os anexos da Directiva 77/93/CEE do Conselho relativa às medidas de protecção
    contra a introdução nos Estados-Membros de organismos prejudiciais às plantas
    e produtos vegetais
  type: main
- language: es
  script: Latn
  content: Segunda Directiva 86/546/CEE de la Comisión de 29 de octubre de 1986 por
    la que se modifican los Anexos de la Directiva 77/93/CEE del Consejo relativa
    a las medidas de protección contra la introducción en los Estados Miembros de
    organismos nocivos para los vegetales o productos vegetales
  type: main
- language: sv
  script: Latn
  content: Kommissionens andra direktiv 86/546/EEG av den 29 oktober 1986 om ändring
    av bilagorna till rådets direktiv 77/93/EEG om skyddsåtgärder mot att skadegörare
    på växter eller växtprodukter förs in till medlemsstaterna
