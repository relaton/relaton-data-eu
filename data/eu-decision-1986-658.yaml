title:
- language: en
  script: Latn
  content: '86/658/EEC: Council Decision of 22 December 1986 on the conclusion of
    an Agreement in the form of an Exchange of Letters concerning the provisional
    application of the Protocol establishing the fishing rights and financial compensation
    provided for in the Agreement between the European Economic Community and the
    Government of the Republic of Senegal on fishing off the coast of Senegal for
    the period 1 October 1986 to 28 February 1988'
  type: main
- language: fr
  script: Latn
  content: '86/658/CEE: Décision du Conseil du 22 décembre 1986 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les droits de pêche et la compensation financière prévus
    dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République du Sénégal concernant la pêche au large de la côte sénégalaise
    pour la période du 1er octobre 1986 au 28 février 1988'
  type: main
- language: de
  script: Latn
