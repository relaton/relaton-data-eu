    nach dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Republik
    Senegal über die Fischerei vor der senegalesischen Küste für die Zeit vom 1.
    Oktober 1986 bis zum 28. Februar 1988'
  type: main
- language: da
