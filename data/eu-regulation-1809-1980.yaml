    στους κατόχους συμφωνητικών μακροπροθέσμου
    αποθεματοποιήσεως επιτραπζίων οίνων για την
    περίοδο 1978/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1809/80 della Commissione, del 10 luglio 1980, che
