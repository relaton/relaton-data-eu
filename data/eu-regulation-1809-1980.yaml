    for de supplerende foranstaltninger, der er forbeholdt indehaverne af langfristede
    oplagringskontrakter for bordvin for produktionsåret 1978/79
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1809/80 της Επιτροπής
