title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1809/80 of 10 July 1980 amending Regulation
    (EEC) No 2186/79 laying down detailed rules for the application of the additional
    measures applicable to holders of long-term storage contracts for table wine for
    the 1978/79 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1809/80 de la Commission, du 10 juillet 1980, modifiant
