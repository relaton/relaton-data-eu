    für die Inhabern langfristiger Lagerverträge für Tafelweine vorbehaltenen ergänzenden
    Maßnahmen für das Wirtschaftsjahr 1978/79
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1809/80 af 10. juli 1980 om ændring
