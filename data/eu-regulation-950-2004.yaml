    associate a Osama Bin Laden, alla rete Al-Qaeda e ai Talebani e abroga il regolamento
    (CE) n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr 950/2004 (2004. gada 6. maijs) ar kuru 33. reizi
