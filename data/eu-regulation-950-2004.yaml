  type: main
- language: hu
  script: Latn
  content: A Bizottság 950/2004/EK rendelete (2004. május 6.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedések bevezetéséről
    és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről szóló
    881/2002/EK tanácsi rendelet 33. alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 950/2004 della Commissione del 6 maggio 2004 recante
    trentatreesima modifica del regolamento (CE) n. 881/2002 del Consiglio che impone
