title:
- language: en
  script: Latn
  content: '2011/876/EU: Commission Decision of 19 December 2011 granting certain
    parties an exemption from the extension to certain bicycle parts of the anti-dumping
    duty on bicycles originating in the People’s Republic of China imposed by Council
    Regulation (EEC) No 2474/93, lifting the suspension and revoking the exemption
    of the payment of the anti-dumping duty extended to certain bicycle parts originating
    in the People’s Republic of China granted to certain parties pursuant to Commission
    Regulation (EC) No 88/97 (notified under document C(2011) 9473)'
  type: main
- language: fr
  script: Latn
  content: '2011/876/UE: Décision de la Commission du 19 décembre 2011 exemptant
    certaines parties de l’extension à certaines parties de bicyclettes du droit
    antidumping institué par le règlement (CEE) n ° 2474/93 du Conseil sur les
    bicyclettes originaires de la République populaire de Chine, levant la suspension
    et révoquant l’exemption de paiement du droit antidumping étendu à certaines
    parties de bicyclettes originaires de la République populaire de Chine accordée
    à certaines parties en vertu du règlement (CE) n ° 88/97 de la Commission [notifiée
    sous le numéro C(2011) 9473]'
  type: main
- language: de
  script: Latn
  content: '2011/876/EU: Beschluss der Kommission vom 19. Dezember 2011 zur Befreiung
    bestimmter Parteien von der Ausweitung des Antidumpingzolls auf Fahrräder mit
    Ursprung in der Volksrepublik China, der mit der Verordnung (EWG) Nr. 2474/93
    des Rates eingeführt wurde, auf bestimmte Fahrradteile sowie zur Aufhebung der
    Aussetzung und zum Widerruf der Befreiung von der Entrichtung des auf bestimmte
    Fahrradteile mit Ursprung in der Volksrepublik China ausgeweiteten Antidumpingzolls,
    die bestimmten Parteien mit der Verordnung (EG) Nr. 88/97 der Kommission gewährt
    wurde (Bekanntgegeben unter Aktenzeichen K(2011) 9473)'
