id: EURegulation10482011
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EU) No 1048/2011 of 20 October 2011 repealing Regulation
    (EC) No 1763/2004 imposing certain restrictive measures in support of effective
    implementation of the mandate of the International Criminal Tribunal for the former
    Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 1048/2011 du Conseil du 20 octobre 2011 abrogeant le
    règlement (CE) n o 1763/2004 instituant certaines mesures restrictives à l’appui
    d’une mise en œuvre effective du mandat du Tribunal pénal international de
    l’ex-Yougoslavie (TPIY)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 1048/2011 des Rates vom 20. Oktober 2011 zur Aufhebung
    der Verordnung (EG) Nr. 1763/2004 über die Anwendung bestimmter restriktiver
    Maßnahmen zur Unterstützung der wirksamen Ausführung des Mandats des Internationalen
    Strafgerichtshofs für das ehemalige Jugoslawien (ICTY)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 1048/2011 на Съвета от 20 октомври
    2011 година за отмяна на Регламент (ЕО) № 1763/2004
    относно налагането на някои ограничителни
    мерки в подкрепа на ефективното изпълнение
    на мандата на Международния трибунал за бивша
    Югославия (МТБЮ)
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EU) č. 1048/2011 ze dne 20. října 2011 o zrušení
    nařízení (ES) č. 1763/2004, kterým se ukládají některá omezující opatření
    na podporu účinného provádění mandátu Mezinárodního trestního tribunálu
    pro bývalou Jugoslávii (ICTY)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EU) nr. 1048/2011 af 20. oktober 2011 om ophævelse
    af forordning (EF) nr. 1763/2004 om indførelse af visse restriktive foranstaltninger
    til støtte for den effektive gennemførelse af mandatet for Det Internationale
    Krigsforbrydertribunal vedrørende det Tidligere Jugoslavien (ICTY)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 1048/2011 του Συμβουλίου,
    της 20ής Οκτωβρίου 2011 , για την κατάργηση του
    κανονισμού (ΕΚ) αριθ. 1763/2004 για την επιβολή ορισμένων
    περιοριστικών μέτρων προς υποστήριξη της αποτελεσματικής
    εφαρμογής της εντολής του Διεθνούς Ποινικού
    Δικαστηρίου για την πρώην Γιουγκοσλαβία (ΙCTY)
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EL) nr 1048/2011, 20. oktoober 2011 , millega tunnistatakse
    kehtetuks määrus (EÜ) nr 1763/2004, millega kehtestatakse teatud eripiirangud,
    millega toetatakse endise Jugoslaavia asjade rahvusvahelise kriminaalkohtu (EJRK)
    volituste tõhusat rakendamist
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EU) N:o 1048/2011, annettu 20 päivänä lokakuuta 2011
    , tiettyjen rajoittavien toimenpiteiden käyttöönotosta entisen Jugoslavian
    alueen kansainvälisen rikostuomioistuimen toimeksiannon tehokkaan täytäntöönpanon
    tukemiseksi annetun asetuksen (EY) N:o 1763/2004 kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1048/2011/EU rendelete ( 2011. október 20. ) a volt Jugoszláviában
    elkövetett humanitárius bűncselekményeket vizsgáló nemzetközi törvényszék
    (ICTY) megbízatása hatékony végrehajtásának támogatására irányuló egyes
    korlátozó intézkedések bevezetéséről szóló 1763/2004/EK rendelet hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 1048/2011 del Consiglio, del 20 ottobre 2011 , che
    abroga il regolamento (CE) n. 1763/2004 che istituisce alcune misure restrittive
    a sostegno dell’attuazione effettiva del mandato del tribunale penale internazionale
    per l’ex Jugoslavia (ICTY)
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (ES) Nr. 1048/2011 ( 2011. gada 20. oktobris ), ar kuru
    atceļ Regulu (EK) Nr. 1763/2004, ar ko nosaka dažus ierobežojošus pasākumus,
    atbalstot Starptautiskā Kara noziegumu tribunāla bijušajai Dienvidslāvijai
    ( ICTY ) pilnvaru sekmīgu īstenošanu
  type: main
- language: lt
  script: Latn
  content: 2011 m. spalio 20 d. Tarybos reglamentas (ES) Nr. 1048/2011, kuriuo panaikinamas
    Reglamentas (EB) Nr. 1763/2004, nustatantis tam tikras ribojančias priemones,
    remiančias veiksmingą Tarptautinio baudžiamojo tribunolo buvusiai Jugoslavijai
    (TBTBJ) mandato vykdymą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (UE) Nru 1048/2011 tal- 20 ta’ Ottubru 2011 li
    jemenda r-Regolament (KE) Nru 1763/2004 li jimponi ċerti miżuri restrittivi
    biex isostnu l-implimentazzjoni effettiva tal-mandat tal-Qorti Kriminali Internazzjonali
    għal dik li qabel kienet il-Jugoslavja (ICTY)
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 1048/2011 van de Raad van 20 oktober 2011 tot intrekking
    van Verordening (EG) nr. 1763/2004 tot vaststelling van bepaalde beperkende maatregelen
    ter ondersteuning van de daadwerkelijke uitvoering van het mandaat van het Internationaal
    Straftribunaal voor het voormalige Joegoslavië (ICTY)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (UE) nr 1048/2011 z dnia 20 października 2011 r.
    uchylające rozporządzenie (WE) nr 1763/2004 nakładające określone środki
    ograniczające dla wsparcia skutecznego wykonania mandatu Międzynarodowego Trybunału
    Karnego dla byłej Jugosławii (MTKJ)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 1048/2011 do Conselho, de 20 de Outubro de 2011 ,
    que revoga o Regulamento (CE) n. o 1763/2004, que impõe determinadas medidas
    restritivas de apoio ao exercício efectivo do mandato do Tribunal Penal Internacional
    para a antiga Jugoslávia (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1048/2011 al Consiliului din 20 octombrie 2011 de
    abrogare a Regulamentului (CE) nr. 1763/2004 de instituire a anumitor măsuri
    restrictive în sprijinul punerii efective în aplicare a mandatului Tribunalului
    Penal Internațional pentru Fosta Iugoslavie (TPII)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EÚ) č. 1048/2011 z 20. októbra 2011 , ktorým sa zrušuje
    nariadenie Rady (ES) č. 1763/2004, ktorým sa ukladajú určité obmedzujúce
    opatrenia na podporu efektívneho vykonávania mandátu Medzinárodného trestného
    tribunálu pre bývalú Juhosláviu (ICTY)
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EU) št. 1048/2011 z dne 20. oktobra 2011 o razveljavitvi
    Uredbe (ES) št. 1763/2004 o uvedbi določenih omejevalnih ukrepov v podporo učinkovitemu
    izvajanju mandata Mednarodnega kazenskega sodišča za nekdanjo Jugoslavijo (MKSJ)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 1048/2011 del Consejo, de 20 de octubre de 2011 , que
    deroga el Reglamento (CE) n o 1763/2004 por el que se imponen determinadas medidas
    restrictivas en apoyo de la aplicación efectiva del mandato del Tribunal Penal
    Internacional para la ex Yugoslavia (TPIY)
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EU) nr 1048/2011 av den 20 oktober 2011 om upphävande
    av förordning (EG) nr 1763/2004 om införande av vissa restriktiva åtgärder
    till stöd för ett effektivt genomförande av Internationella tribunalen för
    f.d. Jugoslaviens (ICTY) uppgift
  type: main
