title:
- language: en
  script: Latn
  content: '85/209/EEC: Commission Decision of 26 March 1985 accepting the undertaking
    given in connection with the anti-dumping investigation concerning imports of
    plasterboard of Spanish origin into Ireland and Northern Ireland and terminating
    that investigation'
  type: main
- language: fr
  script: Latn
  content: '85/209/CEE: Décision de la Commission du 26 mars 1985 portant acceptation
    d''engagements souscrits dans le cadre de l''enquête antidumping concernant les
    importations, en République d''Irlande du Nord, de plaques de plâtre originaires
    d''Espagne et portant clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: '85/209/EWG: Beschluß der Kommission vom 26. März 1985 über die Annahme
    einer Verpflichtung im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von Gipsplatten mit Ursprung in Spanien in die Republik Irland und Nordirland
    und über die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '85/209/EØF: Kommissionens afgørelse af 26. marts 1985 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende Irland og Nordirlands
    import af gipsplader med oprindelse i Spanien og om afslutning af denne procedure'
  type: main
- language: el
  script: Grek
  content: '85/209/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Μαρτίου 1985 για την αποδοχή της ανάληψης υποχρεώσεων
    που προτάθηκε όσον αφορά τη διαδικασία αντιντάμπινγκ
    σχετικά με τις εισαγωγές γυψοσανίδας καταγωγής
    Ισπανίας, στη Δημοκρατία της Ιρλανδίας και
    στη Βόρεια Ιρλανδία, και για την περάτωση της
    διαδικασίας αυτής'
  type: main
- language: it
  script: Latn
  content: '85/209/CEE: Decisione della Commissione del 26 marzo 1985 che accetta
    l'' impegno assunto nell'' ambito della procedura antidumping relativa alle importazioni
    di tavole di gesso originarie della Spagna nella Repubblica d'' Irlanda e nell''
    Irlanda del Nord e chiude la procedura stessa'
  type: main
- language: nl
  script: Latn
  content: '85/209/EEG: Besluit van de Commissie van 26 maart 1985 houdende aanvaarding
    van een verbintenis in het kader van de anti-dumpingprocedure betreffende de invoer
    van gipsplaten, van oorsprong uit Spanje, in de Ierse Republiek en Noord-Ierland
    en beëindiging van de procedure'
