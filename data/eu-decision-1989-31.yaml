    bovini in alcune regioni della Repubblica federale di Germania (Il testo in lingua
    tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '89/31/EEG: Beschikking van de Commissie van 21 december 1988 houdende
