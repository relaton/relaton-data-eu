title:
- language: en
  script: Latn
  content: '89/31/EEC: Commission Decision of 21 December 1988 amending for the first
    time Commission Decision 80/775/EEC on laying down methods of control for maintaining
    the officially brucellosis-free status of bovine herds in certain regions of the
    Federal Republic of Germany (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/31/CEE: Décision de la Commission du 21 décembre 1988 modifiant la
    décision 80/775/CEE établissant les méthodes de contrôle visant à maintenir
    le statut de cheptels officiellement indemnes de brucellose dans certaines régions
    de la République fédérale d''Allemagne (Le texte en langue allemande est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '89/31/EWG: Entscheidung der Kommission vom 21. Dezember 1988 zur Änderung
    der Entscheidung 80/775/EWG zur Festlegung der Kontrollmethoden für die Beibehaltung
    des amtlich anerkannt brucellosefreien Status der Rinderbestände in bestimmten
    Gebieten der Bundesrepublik Deutschland (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '89/31/EØF: Kommissionens beslutning af 21. december 1988 om ændring
