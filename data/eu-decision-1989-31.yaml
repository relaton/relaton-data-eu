    των επίσημα απαλλαγμένων από βρουκέλλωση αγελών
    βοοειδών σε ορισμένες περιοχές της Ομοσπονδιακής
    Δημοκρατίας της Γερμανίας
  type: main
- language: it
  script: Latn
  content: '89/31/CEE: Decisione della Commissione del 21 dicembre 1988 recante prima
    modifica della decisione 80/775/CEE, che fissa le modalità del controllo cui
