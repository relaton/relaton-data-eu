    Programms für die Verarbeitung und Vermarktung von Fischereierzeugnissen in Italien
    für den Zeitraum 1989 bis 1990 (Nur der italienische Text ist verbindlich) (89/423/EWG)
    (89/423/EWG) #'
  type: main
- language: da
