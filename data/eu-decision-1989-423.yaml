  script: Latn
  content: '89/423/EEC: Commission Decision of 22 June 1989 relating to the specific
    programme concerning the processing and marketing of fish and fish products in
    Italy for the period 1989 to 1990 forwarded by Italy pursuant to Council Regulation
    (EEC) No 355/77 (only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/423/CEE: Décision de la Commission du 22 juin 1989 concernant la prorogation
    du programme spécifique relatif à la transformation et à la commercialisation
    des produits de la pêche en Italie pour la période 1989/1990 transmis par l''Italie
    conformément aux dispositions du règlement (CEE) n° 355/77 du Conseil (Le texte
    en langue italienne est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 22. Juni 1989 zur Verlängerung des von
