    do Peru aos certificados emitidos em conformidade com o Regulamento (UE) 2021/953
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1340 a Comisiei din 29 iulie 2022
