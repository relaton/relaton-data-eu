    się w Unii, zaświadczeń COVID-19 wydawanych przez Republikę Peru z zaświadczeniami
    wydawanymi zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1340 da Comissão de 29 de julho de 2022
