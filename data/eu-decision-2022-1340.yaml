    rovnocennost certifikátů týkajících se onemocnění COVID-19 vydaných Peruánskou
    republikou a certifikátů vydaných v souladu s nařízením Evropského parlamentu
    a Rady (EU) 2021/953
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1340 af 29. juli 2022
