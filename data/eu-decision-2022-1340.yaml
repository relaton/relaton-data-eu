title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1340 of 29 July 2022 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by the Republic of Peru to the certificates
    issued in accordance with Regulation (EU) 2021/953 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1340 de la Commission du 29 juillet
    2022 établissant l’équivalence, aux fins de faciliter l’exercice du droit
    à la libre circulation au sein de l’Union, des certificats COVID-19 délivrés
    par la République du Pérou avec les certificats délivrés conformément au
    règlement (UE) 2021/953 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1340 der Kommission vom 29. Juli 2022
    zur Feststellung der Gleichwertigkeit der von der Republik Peru ausgestellten
    COVID-19-Zertifikate mit den nach der Verordnung (EU) 2021/953 des Europäischen
    Parlaments und des Rates ausgestellten Zertifikaten zwecks Erleichterung der Ausübung
    des Rechts auf Freizügigkeit innerhalb der Union
  type: main
- language: bg
