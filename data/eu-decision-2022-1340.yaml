    met de overeenkomstig Verordening (EU) 2021/953 van het Europees Parlement en
    de Raad afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1340 z dnia 29 lipca 2022 r. ustanawiająca
