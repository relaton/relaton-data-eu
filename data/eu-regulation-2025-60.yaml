    dömpingellenes vám kivetéséről, a kivetett ideiglenes vám végleges beszedéséről,
    valamint a Kínai Népköztársaságból származó eritrit nyilvántartásba
    vett behozatalára vonatkozó végleges dömpingellenes vám kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/60 della Commissione, del 15 gennaio
