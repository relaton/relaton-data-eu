title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/60 of 15 January 2025 imposing
    a definitive anti-dumping duty, definitively collecting the provisional duty imposed
    on imports of erythritol originating in the People’s Republic of China and levying
    the definitive anti-dumping duty on the registered imports of erythritol originating
    in the People’s Republic of China
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/60 de la Commission du 15 janvier 2025
