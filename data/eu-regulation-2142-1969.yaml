title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2142/69 du Conseil, du 28 octobre 1969, portant ouverture
    et répartition d'un contingent tarifaire communautaire supplémentaire, pour
    l'année 1969, de ferro-chrome contenant en poids 0,10 % ou moins de carbone et
    plus de 30 % jusqu'à 90 % inclus de chrome (ferro-chrome surrafiné) de la position
    EX 73.02 E I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2142/69 des Rates vom 28. Oktober 1969 über die Eröffnung
    und Aufteilung eines zusätzlichen Gemeinschaftszollkontingents für Ferrochrom
    mit einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und
    an Chrom von mehr als 30, doch nicht mehr als 90 Gewichtshundertteilen (hochraffiniertes
    Ferrochrom) der Tarifnummer ex 73.02 E I des Gemeinsamen Zolltarifs für das Jahr
    1969
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2142/69 del Consiglio, del 28 ottobre 1969, relativo
    all'apertura e alla ripartizione di un contingente tariffario comunitario supplementare
    di ferrocromo contenente, in peso, lo 0,10 % o meno di carbonio e da oltre il
    30 % sino al 90 % incluso di cromo (ferro-cromo superraffinato) della voce ex
    73.02 E I della tariffa doganale comune per il 1969
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2142/69 van de Raad van 28 oktober 1969 houdende
    opening en verdeling van een extra communautair tariefcontingent voor ferrochroom,
    bevattende 0,1 of minder gewichtspercent koolstof en meer dan 30 doch niet meer
    dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom), van post ex 73.02
    E I van het gemeenschappelijk douanetarief voor het jaar 1969
  type: main
