- language: en
  script: Latn
  content: Council Regulation (EEC) No 2903/85 of 17 October 1985 amending the list
    of ACP countries in Regulation (EEC) No 486/85 on the arrangements applicable
    to agricultural products and certain goods resulting from the processing of agricultural
    products originating in the African, Caribbean and Pacific States or in the overseas
    countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2903/85 du Conseil, du 17 octobre 1985, modifiant,
    en ce qui concerne la liste des états ACP, le règlement (CEE) n° 486/85 relatif
    au régime applicable à des produits agricoles et à certaines marchandises résultant
    de la transformation des produits agricoles originaires des états d'Afrique,
    des Caraïbes et du Pacifique (états ACP) ou des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2903/85 DES RATES VOM 17. OKTOBER 1985 ZUR AENDERUNG
    DER VERORDNUNG ( EWG ) NR. 486/85 UEBER DIE REGELUNG FUER LANDWIRTSCHAFTLICHE
    ERZEUGNISSE UND BESTIMMTE AUS LANDWIRTSCHAFTLICHEN ERZEUGNISSEN HERGESTELLTE WAREN
    MIT URSPRUNG IN DEN STAATEN IN AFRIKA, IM KARIBISCHEN RAUM UND IM PAZIFISCHEN
    OZEAN ODER IN DEN UEBERSEEISCHEN LAENDERN UND GEBIETEN BEZUEGLICH DER LISTE DER
    AKP-STAATEN
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2903/85 af 17. oktober 1985 om ændring af
    forordning (EØF) nr. 486/85 om den ordning, der skal gælde for landbrugsprodukter
    og visse varer fremstillet af landbrugsprodukter med oprindelse i staterne i Afrika,
    Vestindien og Stillehavet eller i de oversøiske lande og territorier, for så
    vidt angår fortegnelsen over AVS-staterne
  type: main
- language: el
