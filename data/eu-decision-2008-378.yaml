id: EUDecision2008378
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2008/378/EC: Commission Decision of 15 May 2008 amending Decision 2006/133/EC
    requiring Member States temporarily to take additional measures against the dissemination
    of Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al . (the pinewood
    nematode) as regards areas in Portugal, other than those in which it is known
    not to occur (notified under document number C(2008) 1892)'
  type: main
- language: fr
  script: Latn
  content: '2008/378/CE: Décision de la Commission du 15 mai 2008 modifiant la décision
    2006/133/CE exigeant des États membres qu’ils prennent provisoirement des mesures
    supplémentaires contre la propagation de Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al . (nématode du pin) à partir des zones du Portugal autres
    que celles où son absence est attestée [notifiée sous le numéro C(2008) 1892]'
  type: main
- language: de
  script: Latn
  content: '2008/378/EG: Entscheidung der Kommission vom 15. Mai 2008 zur Änderung
    der Entscheidung 2006/133/EG zur Verpflichtung der Mitgliedstaaten, vorübergehend
    zusätzliche Maßnahmen gegen die Verbreitung von Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al . (dem Kiefernfadenwurm) gegenüber anderen Gebieten Portugals
    zu treffen als denjenigen, in denen dieser Schadorganismus bekanntermaßen nicht
    vorkommt (Bekannt gegeben unter Aktenzeichen K(2008) 1892)'
  type: main
- language: bg
  script: Cyrl
  content: '2008/378/ЕО: Решение на Комисията от 15 май 2008
    година за изменение на Решение 2006/133/ЕО относно
    изискване към държавите-членки временно да
    вземат допълнителни мерки срещу разпространението
    на Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al . (нематод
    по боровата дървесина) по отношение на области
    в Португалия, различни от тези, в които е известно,
    че заболяването не се среща (нотифицирано под
    номер C(2008) 1892)'
  type: main
- language: cs
  script: Latn
  content: '2008/378/ES: Rozhodnutí Komise ze dne 15. května 2008 , kterým se mění
    rozhodnutí 2006/133/ES, kterým se po členských státech žádá dočasné
    přijetí doplňujících opatření proti šíření háďátka Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al . z oblastí Portugalska, mimo oblastí,
    v nichž byla potvrzena jeho nepřítomnost (oznámeno pod číslem K(2008) 1892)'
  type: main
- language: da
  script: Latn
  content: '2008/378/EF: Kommissionens beslutning af 15. maj 2008 om ændring af beslutning
    2006/133/EF om et krav til medlemsstaterne om midlertidigt at træffe supplerende
    foranstaltninger mod spredning af Bursaphelenchus xylophilus (Steiner et Buhrer)
    Nickle et al. (fyrretræsnematoden) for så vidt angår andre områder i Portugal
    end dem, hvor den vides ikke at forekomme (meddelt under nummer K(2008) 1892)'
  type: main
- language: el
  script: Grek
  content: '2008/378/ΕΚ: Απόφαση της Επιτροπής, της 15ης
