  script: Latn
  content: '2008/378/EG: Beschikking van de Commissie van 15 mei 2008 tot wijziging
    van Beschikking 2006/133/EG tot tijdelijke verplichting van de lidstaten om ten
    aanzien van andere gebieden in Portugal dan die waarvan bekend is dat Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al. (het dennenaaltje) er niet voorkomt,
    aanvullende maatregelen te nemen teneinde de verspreiding ervan tegen te gaan
    (Kennisgeving geschied onder nummer C(2008) 1892)'
  type: main
- language: pl
  script: Latn
  content: '2008/378/WE: Decyzja Komisji z dnia 15 maja 2008 r. zmieniająca decyzję
