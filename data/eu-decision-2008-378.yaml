    dodatkowych środków przeciwko rozprzestrzenianiu się Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al . (węgorek sosnowiec) w odniesieniu do obszarów
    w Portugalii innych niż te, na których organizm ten nie występuje (notyfikowana
    jako dokument nr C(2008) 1892)'
  type: main
