    împotriva răspândirii Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle
    et al . (nematodul lemnului de pin) începând cu zonele Portugaliei, altele decât
    cele unde este atestată absența sa [notificată cu numărul C(2008) 1892]'
  type: main
- language: sk
  script: Latn
  content: '2008/378/ES: Rozhodnutie Komisie z 15. mája 2008 , ktorým sa mení a
    dopĺňa rozhodnutie 2006/133/ES, v ktorom sa od členských štátov vyžaduje
    dočasné prijatie ďalších opatrení proti šíreniu Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al . (háďatko borovicové) v súvislosti s oblasťami
    v Portugalsku okrem oblastí, v ktorých jeho výskyt nie je známy [oznámené
    pod číslom K(2008) 1892]'
  type: main
- language: sl
  script: Latn
  content: '2008/378/ES: Odločba Komisije z dne 15. maja 2008 o spremembi Odločbe
