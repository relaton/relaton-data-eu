    numerolla K(2008) 1892)'
  type: main
- language: hu
  script: Latn
  content: '2008/378/EK: A Bizottság határozata ( 2008. május 15. ) a Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al . (a fenyőfa fonalférge) elterjedése
    elleni, Portugáliának az attól ismerten mentes területein kívüli más területeire
    vonatkozó ideiglenes kiegészítő intézkedéseknek a tagállamok számára
    történő előírásáról szóló 2006/133/EK határozat módosításáról
    (az értesítés a C(2008) 1892. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2008/378/CE: Decisione della Commissione, del 15 maggio 2008 , recante
    modifica della decisione 2006/133/CE che prescrive agli Stati membri di adottare,
    a titolo provvisorio, misure supplementari contro la propagazione di Bursaphelenchus
    xylophilus (Steiner e Buhrer) Nickle et al . (nematode del pino) per quanto riguarda
    le regioni del Portogallo diverse da quelle notoriamente indenni da questo organismo
    [notificata con il numero C(2008) 1892]'
  type: main
- language: lv
  script: Latn
  content: '2008/378/EK: Komisijas Lēmums ( 2008. gada 15. maijs ), ar kuru groza
    Lēmumu 2006/133/EK, ar ko dalībvalstīm pieprasa veikt īslaicīgus papildu
    pasākumus pret Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al .
    (priedes koksnes nematode) izplatību tajās Portugāles teritorijās, kurās
    iespējama tās izplatība (izziņots ar dokumenta numuru K(2008) 1892)'
  type: main
