    miżuri addizzjonali kontra t-tixrid tal- Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al . (the pine wood nematode) fir-rigward ta’ żoni fil-Portugall,
    għajr dawk li fihom huwa magħruf li ma tinsabx (notifikata taħt id-dokument
    numru C(2008) 1892)'
  type: main
