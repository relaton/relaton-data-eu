    i prerađene poljoprivredne proizvode podrijetlom iz Egipta i o stavljanju izvan
    snage uredaba (EZ) br. 2276/2003, (EZ) br. 955/2005, (EZ) br. 1002/2007 i (EZ)
    br. 1455/2007
  type: main
- language: hu
  script: Latn
  content: A Bizottság 449/2010/EU rendelete ( 2010. május 25. ) a 747/2001/EK tanácsi
    rendeletnek az Egyiptomból származó egyes mezőgazdasági és feldolgozott
    mezőgazdasági termékek uniós vámkontingensei tekintetében történő módosításáról,
    valamint a 2276/2003/EK, a 955/2005/EK, az 1002/2007/EK és az 1455/2007/EK rendelet
    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 449/2010 della Commissione, del 25 maggio 2010 , che
    modifica il regolamento (CE) n. 747/2001 del Consiglio per quanto riguarda i contingenti
    tariffari dell’Unione per alcuni prodotti agricoli e prodotti agricoli trasformati
    originari dell’Egitto e abroga i regolamenti (CE) n. 2276/2003, (CE) n. 955/2005,
    (CE) n. 1002/2007 e (CE) n. 1455/2007
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 449/2010 ( 2010. gada 25. maijs ), ar kuru groza
    Padomes Regulu (EK) Nr. 747/2001 attiecībā uz Savienības tarifa kvotu noteiktiem
    Ēģiptes izcelsmes lauksaimniecības produktiem un pārstrādātiem lauksaimniecības
    produktiem un atceļ Regulu (EK) Nr. 2276/2003, (EK) Nr. 955/2005, (EK) Nr. 1002/2007
    un (EK) Nr. 1455/2007
  type: main
- language: lt
  script: Latn
  content: 2010 m. gegužės 25 d. Komisijos reglamentas (ES) Nr. 449/2010, kuriuo
    iš dalies keičiamas Tarybos reglamentas (EB) Nr. 747/2001 dėl tam tikrų Egipto
    kilmės žemės ūkio produktų ir perdirbtų žemės ūkio produktų Sąjungos
    tarifinių kvotų bei panaikinami Reglamentai (EB) Nr. 2276/2003, (EB) Nr. 955/2005,
    (EB) Nr. 1002/2007 ir (EB) Nr. 1455/2007
  type: main
- language: mt
  script: Latn
