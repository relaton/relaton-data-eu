title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 449/2010 of 25 May 2010 amending Council
    Regulation (EC) No 747/2001 as regards tariff quotas of the Union for certain
    agricultural and processed agricultural products originating in Egypt and repealing
    Regulations (EC) No 2276/2003, (EC) No 955/2005, (EC) No 1002/2007 and (EC) No
    1455/2007
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 449/2010 de la Commission du 25 mai 2010 modifiant
    le règlement (CE) n ° 747/2001 du Conseil en ce qui concerne les contingents
    tarifaires de l’Union européenne pour certains produits agricoles et produits
    agricoles transformés originaires d’Égypte et abrogeant les règlements (CE)
    n ° 2276/2003, (CE) n ° 955/2005, (CE) n ° 1002/2007 et (CE) n ° 1455/2007
  type: main
- language: de
  script: Latn
