    tal-Unjoni għal ċerti prodotti agrikoli u prodotti agrikoli pproċessati li
    joriġinaw mill-Eġittu u li jħassar ir-Regolamenti (KE) Nru 2276/2003, (KE)
    Nru 955/2005, (KE) Nru 1002/2007 u (KE) Nru 1455/2007
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 449/2010 van de Commissie van 25 mei 2010 tot wijziging
    van Verordening (EG) nr. 747/2001 van de Raad wat betreft EU-tariefcontingenten
    voor bepaalde landbouwproducten en verwerkte landbouwproducten van oorsprong uit
    Egypte en tot intrekking van de Verordeningen (EG) nr. 2276/2003, (EG) nr. 955/2005,
    (EG) nr. 1002/2007 en (EG) nr. 1455/2007
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 449/2010 z dnia 25 maja 2010 r. zmieniające
    rozporządzenie Rady (WE) nr 747/2001 w odniesieniu do unijnych kontyngentów
    taryfowych na niektóre produkty rolne i przetworzone produkty rolne pochodzące
    z Egiptu oraz uchylające rozporządzenia (WE) nr 2276/2003, (WE) nr 955/2005,
    (WE) nr 1002/2007 i (WE) nr 1455/2007
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 449/2010 da Comissão, de 25 de Maio de 2010 , que
    altera o Regulamento (CE) n. ° 747/2001 do Conselho no respeitante aos contingentes
    pautais da União para determinados produtos agrícolas e produtos agrícolas
    transformados originários do Egipto e revoga os Regulamentos (CE) n. ° 2276/2003,
    (CE) n. ° 955/2005, (CE) n. ° 1002/2007 e (CE) n. ° 1455/2007
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 449/2010 al Comisiei din 25 mai 2010 de modificare
    a Regulamentului (CE) nr. 747/2001 al Consiliului în ceea ce privește contingentele
    tarifare ale Uniunii pentru anumite produse agricole și produse agricole transformate
    provenind din Egipt și de abrogare a Regulamentelor (CE) nr. 2276/2003, (CE)
    nr. 955/2005, (CE) nr. 1002/2007 și (CE) nr. 1455/2007
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 449/2010 z 25. mája 2010 , ktorým sa mení
    a dopĺňa nariadenie Rady (ES) č. 747/2001, pokiaľ ide o colné kvóty Únie
    pre určité poľnohospodárske výrobky a spracované poľnohospodárske výrobky
    s pôvodom v Egypte, a ktorým sa zrušujú nariadenia (ES) č. 2276/2003, (ES)
    č. 955/2005, (ES) č. 1002/2007 a (ES) č. 1455/2007
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 449/2010 z dne 25. maja 2010 o spremembi Uredbe
    Sveta (ES) št. 747/2001 glede tarifnih kvot Unije za nekatere kmetijske in predelane
    kmetijske proizvode s poreklom iz Egipta ter o razveljavitvi uredb (ES) št. 2276/2003,
    (ES) št. 955/2005, (ES) št. 1002/2007 in (ES) št. 1455/2007
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 449/2010 de la Comisión, de 25 de mayo de 2010 ,
    por el que se modifica el Reglamento (CE) n ° 747/2001 del Consejo en lo concerniente
    a los contingentes arancelarios de la Unión para determinados productos agrícolas
    y productos agrícolas transformados originarios de Egipto, y por el que se derogan
