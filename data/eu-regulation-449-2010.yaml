    landbrugsprodukter og forarbejdede landbrugsprodukter med oprindelse i Egypten
    og om ophævelse af forordning (EF) nr. 2276/2003, (EF) nr. 955/2005, (EF) nr.
    1002/2007 og (EF) nr. 1455/2007
  type: main
