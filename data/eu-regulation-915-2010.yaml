title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 915/2010 of 12 October 2010 concerning a
    coordinated multiannual control programme of the Union for 2011, 2012 and 2013
    to ensure compliance with maximum levels of and to assess the consumer exposure
    to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 915/2010 de la Commission du 12 octobre 2010 concernant
    un programme de contrôle, pluriannuel et coordonné, de l’Union pour 2011,
    2012 et 2013, destiné à garantir le respect des teneurs maximales en résidus
    de pesticides dans et sur les denrées alimentaires d’origine végétale et
    animale et à évaluer l’exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 915/2010 der Kommission vom 12. Oktober 2010 über
    ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2011, 2012 und
    2013 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    in oder auf Lebensmitteln pflanzlichen und tierischen Ursprungs und zur Bewertung
    der Verbraucherexposition
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 915/2010 на Комисията от 12
    октомври 2010 година относно координирана многогодишна
    контролна програма на Съюза за 2011, 2012 и 2013 г.
    за гарантиране спазването на максимално допустимите
    граници на остатъчни вещества от пестициди
    във и върху храни от животински и растителен
    произход и за оценка на потребителската експозиция
    на тези остатъчни вещества
  type: main
- language: cs
  script: Latn
