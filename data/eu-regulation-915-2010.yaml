    víceletém kontrolním programu Unie pro roky 2011, 2012 a 2013 s cílem zajistit
    dodržování maximálních limitů reziduí pesticidů v potravinách rostlinného
    a živočišného původu a na jejich povrchu a vyhodnotit expozici spotřebitelů
    těmto reziduím pesticidů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 915/2010 af 12. oktober 2010 om et samordnet
