    2013 de asigurare a respectării limitelor maxime ale concentrațiilor de reziduuri
    de pesticide din și de pe alimentele de origine vegetală și animală și de
    evaluare a expunerii consumatorilor la aceste reziduuri
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 915/2010 z 12. októbra 2010 týkajúce sa
