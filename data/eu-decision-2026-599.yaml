id: EUDecision2026599
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/599 of 19 March 2026 not approving
    formaldehyde released from the reaction products of paraformaldehyde and 2-hydroxypropylamine
    (ratio 1:1) as an active substance for use in biocidal products of product-type
    6 in accordance with Regulation (EU) No 528/2012 of the European Parliament and
    of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/599 de la Commission du 19 mars 2026
    n’approuvant pas le formaldéhyde libéré par les produits de la réaction
    du paraformaldéhyde et de la 2-hydroxypropylamine (ratio 1:1) en tant que substance
    active destinée à être utilisée dans des produits biocides relevant du type
    de produits 6 conformément au règlement (UE) no 528/2012 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/599 der Kommission vom 19. März 2026
    zur Nichtgenehmigung von aus den Reaktionsprodukten von Paraformaldehyd und 2-Hydroxypropylamin
    (Verhältnis 1:1) freigesetztem Formaldehyd als Wirkstoff zur Verwendung in Biozidprodukten
    der Produktart 6 gemäß der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments
    und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/599 на Комисията
    от 19 март 2026 година за неодобряване на формалдехид,
    освободен от реакционните продукти на параформалдехид
    и 2-хидроксипропиламин (съотношение 1:1), като
    активно вещество за употреба в биоциди от продуктов
    тип 6 в съответствие с Регламент (ЕС) № 528/2012
    на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/599 ze dne 19. března 2026,
    kterým se neschvaluje formaldehyd uvolněný z reakčních produktů paraformaldehydu
    a 2-hydroxypropylaminu (poměr 1:1) jako účinná látka pro použití v biocidních
    přípravcích typu 6 v souladu s nařízením Evropského parlamentu a Rady (EU)
    č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/599 af 19. marts 2026
    om ikke-godkendelse af formaldehyd afgivet af reaktionsprodukter af paraformaldehyd
    og 2-hydroxypropylamin (i forholdet 1:1) som et aktivstof til anvendelse i biocidholdige
    produkter af produkttype 6 i overensstemmelse med Europa-Parlamentets og Rådets
    forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/599 της Επιτροπής,
    της 19ης Μαρτίου 2026, σχετικά με τη μη έγκριση
    της φορμαλδεΰδης που απελευθερώνεται από τα
    προϊόντα αντίδρασης παραφορμαλδεΰδης και
    2-υδροξυπροπυλαμίνης (σε αναλογία 1:1) ως δραστικής
    ουσίας για χρήση σε βιοκτόνα του τύπου προϊόντων
    6, σύμφωνα με τον κανονισμό (ΕΕ) αριθ. 528/2012 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2026/599, 19. märts 2026, millega jäetakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) nr 528/2012 heaks kiitmata
    paraformaldehüüdi ja 2-hüdroksüpropüülamiini (vahekorras 1:1) reaktsiooni
    saadustest vabaneva formaldehüüdi kasutamine toimeainena tooteliiki 6 kuuluvates
    biotsiidides
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/599, annettu 19 päivänä
    maaliskuuta 2026, paraformaldehydin ja 2-hydroksipropyyliamiinin reaktiotuotteista
    (suhde 1:1) vapautuneen formaldehydin hyväksymättä jättämisestä valmisteryhmään
    6 kuuluvissa biosidivalmisteissa käytettävänä tehoaineena Euroopan parlamentin
    ja neuvoston asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/599 ón gCoimisiún an 19 Márta 2026
    gan formaildéad arna scaoileadh ó tháirgí imoibriúcháin paraformaildéid
    agus 2-hiodrocsapróipiolaimín (cóimheas 1:1) a fhormheas mar shubstaint ghníomhach
    lena húsáid i dtáirgí bithicídeacha de chineál táirge 6 i gcomhréir le
    Rialachán (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: 'Provedbena odluka Komisije (EU) 2026/599 оd 19. ožujka 2026. o neodobravanju
    formaldehida oslobođenog iz produkata reakcije paraformaldehida i 2-hidroksipropilamina
    (omjer 1: 1) kao aktivne tvari za uporabu u biocidnim proizvodima vrste 6 u skladu
    s Uredbom (EU) br. 528/2012 Europskog parlamenta i Vijeća'
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/599 végrehajtási határozata (2026. március 19.)
    az (1:1 arányú) paraformaldehid és 2-hidroxipropilamin reakciótermékeiből
    felszabaduló formaldehid 6. terméktípusba tartozó biocid termékekben felhasználható
    hatóanyagként történő jóváhagyásának az 528/2012/EU európai parlamenti
    és tanácsi rendelet szerinti megtagadásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/599 della Commissione, del 19 marzo 2026,
    che non approva la formaldeide rilasciata dai prodotti di reazione di paraformaldeide
    e 2-idrossipropilammina (rapporto 1:1) come principio attivo ai fini del suo uso
    nei biocidi del tipo di prodotto 6 conformemente al regolamento (UE) n. 528/2012
    del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/599 (2026. gada 19. marts), ar
    ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 528/2012 no paraformaldehīda
    un 2-hidroksipropilamīna reakcijas produktiem (attiecībā 1:1) izdalītu formaldehīdu
    neapstiprina par 6. produkta veida biocīdos lietojamu aktīvo vielu
  type: main
- language: lt
  script: Latn
  content: 2026 m. kovo 19 d. Komisijos įgyvendinimo sprendimas (ES) 2026/599, kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 528/2012 iš paraformaldehido
    ir 2-hidroksipropilamino (santykis 1:1) reakcijos produktų išskirtas formaldehidas
    nepatvirtinamas kaip esama veiklioji medžiaga, skirta 6-o tipo biocidiniams produktams
    gaminti
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/599 tad-19
    ta’ Marzu 2026 li ma tapprovax il-formaldeid rilaxxat mill-prodotti tar-reazzjoni
    tal-paraformaldeid u tat-2-idrossipropilammina (proporzjon 1:1) bħala sustanza
    attiva eżistenti għall-użu fil-prodotti bijoċidali tat-tip ta’ prodott 6
    f’konformità mar-Regolament (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/599 van de Commissie van 19 maart 2026 tot
    niet-goedkeuring van formaldehyde vrijgekomen uit de reactieproducten van paraformaldehyde
    en 2-hydroxypropylamine (verhouding 1:1) als werkzame stof voor gebruik in biociden
    van productsoort 6 overeenkomstig Verordening (EU) nr. 528/2012 van het Europees
    Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/599 z dnia 19 marca 2026 r. w sprawie
    niezatwierdzenia formaldehydu uwalnianego z produktów reakcji paraformaldehydu
    i 2-hydroksypropyloaminy (w stosunku 1:1) jako istniejącej substancji czynnej
    do stosowania w produktach biobójczych należących do grupy produktowej 6 zgodnie
    z rozporządzeniem Parlamentu Europejskiego i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2026/599 da Comissão, de 19 de março de 2026,
    que não aprova o formaldeído libertado de produtos de reação de paraformaldeído
    com 2-hidroxipropilamina (razão 1:1) como substância ativa para utilização
    em produtos biocidas do tipo 6, em conformidade com o Regulamento (UE) n.o 528/2012
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/599 a Comisiei din 19 martie 2026
    de neaprobare a formaldehidei eliberate din produșii de reacție ai paraformaldehidei
    și 2-hidroxipropilaminei (raport 1:1) ca substanță activă destinată utilizării
    în produse biocide aparținând tipului de produse 6 în conformitate cu Regulamentul
    (UE) nr. 528/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie rozhodnutie Komisie (EÚ) 2026/599 z 19. marca 2026, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (EÚ) č. 528/2012 neschvaľuje
    formaldehyd uvoľnený z produktov reakcie paraformaldehydu a 2-hydroxypropylamínu
    (v pomere 1 : 1) ako účinná látka na použitie v biocídnych výrobkoch typu
    6'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbeni sklep Komisije (EU) 2026/599 z dne 19. marca 2026 o neodobritvi
    formaldehida, sproščenega iz reakcijskih produktov paraformaldehida in 2-hidroksipropilamina
    (v razmerju 1 : 1), kot aktivne snovi za uporabo v biocidnih proizvodih vrste
    proizvodov 6 v skladu z Uredbo (EU) št. 528/2012 Evropskega parlamenta in Sveta'
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2026/599 de la Comisión, de 19 de marzo de
    2026, por la que no se aprueba el formaldehído liberado a partir de los productos
    de reacción del paraformaldehído y la 2–hidroxipropalamina (proporción 1:1)
    como sustancia activa para su uso en biocidas del tipo de producto 6, de conformidad
    con el Reglamento (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2026/599 av den 19 mars 2026 om
    att inte godkänna formaldehyd frisatt från reaktionsprodukter av paraformaldehyd
    och 2-hydroxipropylamin (1:1) som ett verksamt ämne för användning i biocidprodukter
    i produkttyp 6 i enlighet med Europaparlamentets och rådets förordning (EU)
    nr 528/2012
