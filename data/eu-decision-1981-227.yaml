title:
- language: en
  script: Latn
  content: '81/227/EEC: Commission Decision of 20 March 1981 on a proposal by the
    Netherlands Government to grant aid for the creation of new production capacity
    by an undertaking in the chemical industry (polypropylene) (Only the Dutch text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/227/CEE: Décision de la Commission, du 20 mars 1981, concernant une
    aide que le gouvernement néerlandais projette d''accorder en faveur de la création
    d''une capacité nouvelle de production d''une entreprise du secteur chimique
    (polypropylène) (Le texte en langue néerlandaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/227/EWG: Entscheidung der Kommission vom 20. März 1981 zur Schaffung
    neuer Produktionskapazitäten eines Chemieunternehmens (Polypropylen) über eine
    von der niederländischen Regierung geplante Beihilfe (Nur der niederländische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/227/EØF: Kommissionens beslutning af 20. marts 1981 om en plan om
    støtte, som den nederlandske regering agter at yde til at skabe en ny produktionskapacitet
    for en virksomhed i den kemiske industri (polypropylen) (Kun den nederlandske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/227/ΕΟΚ: Απόφαση τής Επιτροπής τής 20ής
    Μαρτίου 1981 περί ενισχύσεως τήν οποία σχεδιάζει
    νά χορηγήσει η κυβέρνηση τών Κάτω Χωρών σέ
    επιχείρηση τού τομέα τής χημικής βιομηχανίας
    υπέρ τής δημιουργίας νέας παραγωγικής ικανότητος
    (πολυπροπυλένιο) (Το κείμενο στην ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
