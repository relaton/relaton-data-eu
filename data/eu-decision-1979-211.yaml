title:
- language: en
  script: Latn
  content: '79/211/EEC: Commission Decision of 6 February 1979 authorizing the French
    Republic not to apply Community treatment to handkerchiefs, falling within heading
    No ex 61.05 of the Common Customs Tariff, originating in the People''s Republic
    of China and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/211/CEE: Décision de la Commission, du 6 février 1979, autorisant
    la République française à exclure du traitement communautaire les mouchoirs,
    de la position ex 61.05 du tarif douanier commun, originaires de la République
    populaire de Chine et mis en libre pratique dans les autres États membres (Le
    texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/211/EWG: Entscheidung der Kommission vom 6. Februar 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Taschentücher
    der Tarifnummer ex 61.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/211/EØF: Kommissionens beslutning af 6. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage lommetørklæder,
    som henhører under pos. ex 61.05 i den fælles toldtarif har oprindelse i Den
    kinesiske Folkerepublik og frit kan omsættes i de øvrige medlemsstater (Kun
    den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/211/CEE: Decisione della Commissione, del 6 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i fazzoletti da
    naso della voce ex 61.05 della tariffa doganale comune, originari della Repubblica
    popolare cinese e messi in libera pratica negli altri Stati membri (Il testo in
    lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/211/EEG: Beschikking van de Commissie van 6 februari 1979 waarbij de
    Franse Republiek wordt gemachtigd zakdoeken, van post ex 61.05 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
