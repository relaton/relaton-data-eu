title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1001/97 of 2 June 1997 imposing a definitive
    anti-dumping duty on imports of polyester textured filament yarn originating in
    Malaysia and collecting definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1001/97 du Conseil du 2 juin 1997 instituant un droit
    antidumping définitif sur les importations de fils continus texturés de polyesters
    originaires de Malaysia et portant perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1001/97 des Rates vom 2. Juni 1997 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren texturierter Polyester-Filamentgarne
    mit Ursprung in Malaysia und zur endgültigen Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) Nr. 1001/97 af 2. juni 1997 om indførelse af en
    endelig antidumpingtold på importen af tekstureret garn af endeløse polyesterfibre
    med oprindelse i Malaysia og om endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1001/97 του Συμβουλίου
    της 2ας Ιουνίου 1997 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές νημάτων
    από πολυεστέρες καταγωγής Μαλαισίας και την
    οριστική είσπραξη του επιβληθέντος προσωρινού
    δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1001/97, annettu 2 päivänä kesäkuuta 1997,
    Malesiasta peräisin olevien teksturoitujen polyesterifilamenttilankojen tuontia
    koskevan lopullisen polkumyyntitullin käyttöönottamisesta sekä käyttöön
    otetun väliaikaistullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1001/97 del Consiglio del 2 giugno 1997 che istituisce
    un dazio antidumping definitivo sulle importazioni di filati di poliesteri testurizzati
    originari della Malaysia e riscuote definitivamente il dazio provvisorio imposto
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1001/97 van de Raad van 2 juni 1997 tot instelling
    van een definitief antidumpingrecht op de invoer van getextureerd filamentgaren
    van polyesters van oorsprong uit Maleisië en tot definitieve inning van het ingestelde
    voorlopige recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1001/97 do Conselho de 2 de Junho de 1997 que cria
    um direito anti-dumping definitivo sobre as importações de fios de filamentos
    texturizados de poliésteres originários da Malásia e que institui a cobrança
    definitiva do direito provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1001/97 del Consejo de 2 de junio de 1997 por el que
    se establece un derecho antidumping definitivo sobre las importaciones de hilados
    texturados de poliéster originarios de Malasia y por el que se percibe definitivamente
    el derecho provisional impuesto
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1001/97 av den 2 juni 1997 om införande av
    en slutgiltig antidumpningstull på import av texturerat filamentgarn av polyester
    med ursprung i Malaysia och om slutgiltigt uttag av den preliminära tullen
  type: main
