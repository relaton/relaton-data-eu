  content: COMMISSION REGULATION (EC) No 695/97 of 18 April 1997 determining the extent
    to which applications lodged in the second quarter of 1997 for import licences
    for certain milk products and milk products covered by the arrangements provided
    for in the Interim Agreement concluded by the Community with the Republic of Slovenia
    can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 695/97 DE LA COMMISSION du 18 avril 1997 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    au deuxième trimestre de 1997 pour certains produits dans le secteur du lait
    et des produits laitiers dans le cadre du régime prévu par l'accord intérimaire
    conclu par la Communauté avec la république de Slovénie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 695/97 DER KOMMISSION vom 18. April 1997 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im zweiten Vierteljahr
    1997 für die Einfuhr von Milch und Milcherzeugnissen gemäß dem zwischen der
    Gemeinschaft und der Republik Slowenien geschlossenen Interimsabkommen beantragt
    wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 695/97 af 18. april 1997 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i andet kvartal af
    1997 for visse produkter i sektoren for mælk og mejeriprodukter kan imødekommes
    under den ordning, der er fastsat i interimsaftalen mellem Fællesskabet og Republikken
    Slovenien
  type: main
- language: el
  script: Grek
