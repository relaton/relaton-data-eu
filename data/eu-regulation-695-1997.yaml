    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υποβάλλονται
    για το δεύτερο τρίμηνο 1997 για ορισμένα προϊόντα
    στον τομέα του γάλακτος και γαλακτοκομικών
    προϊόντων στα πλαίσια του καθεστώτος που προβλέπεται
    από την προσωρινή συμφωνία που έχει συναφθεί
    από την Κοινότητα με τη Δημοκρατία της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 695/97, annettu 18 päivänä huhtikuuta 1997,
    yhteisön ja Slovenian tasavallan kanssa tehdyssä väliaikaisessa sopimuksessa
    määrätyn järjestelmän mukaisesti vuoden 1997 toisen vuosineljänneksen aikana
    esitettyjen tiettyjä maito- ja maitotuotealan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 695/97 DELLA COMMISSIONE del 18 aprile 1997 che stabilisce
