    presentate nel secondo trimestre del 1997 per taluni prodotti del settore lattiero-caseario
    nel quadro del regime previsto dall'accordo interinale concluso con la Repubblica
    di Slovenia
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 695/97 VAN DE COMMISSIE van 18 april 1997 tot vaststelling
