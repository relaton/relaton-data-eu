  content: Regulation (EEC) No 2964/75 of the Council of 10 November 1975 on the temporary
    suspension of the autonomous Common Customs Tariff duty for mechanically propelled
    aircraft of an unladen weight exceeding 15 000 kg falling within subheading ex
    88.02 B II c)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2964/75 du Conseil, du 10 novembre 1975, portant suspension
    temporaire du droit autonome du tarif douanier commun pour les avions fonctionnant
    à l'aide d'une machine propulsive d'un poids à vide de plus de 15 000 kilogrammes,
    de la sous-position EX 88.02 B II c)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2964/75 des Rates vom 10. November 1975 über die
    zeitweilige Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für
    Flugzeuge für maschinellen Antrieb, mit einem Leergewicht von mehr als 15 000
    kg, aus Tarifstelle 88.02 B II c)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2964/75 af 10. november 1975 om midlertidig
    suspension af den autonome sats i den fælles toldtarif for flyvemaskiner med
    fremdrivningsmekanisme og med en egenvægt over 15 000 kg henhørende under position
    ex 88.02 B II c)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2964/75 del Consiglio, del 10 novembre 1975, relativo
    alla sospensione temporanea del dazio autonomo della tariffa doganale comune per
    gli aeroplani funzionanti con macchina propulsiva, del peso a vuoto di più di
    15 000 kg, della sottovoce ex 88.02 B II c)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2964/75 van de Raad van 10 november 1975 houdende
    tijdelijke schorsing van het autonome recht van het gemeenschappelijk douanetarief
    voor vliegtuigen functionerende met een voortbewegingsmechanisme, met een leeggewicht
    van meer dan 15 000 kg, van onderverdeling ex 88.02 B II c)
  type: main
