title:
- language: fr
  script: Latn
  content: Décision du Conseil du 20 décembre 1969, autorisant la tacite reconduction
    ou le maintien en vigueur, au-delà de la période de transition, de certains
    accords commerciaux conclus par les États membres avec des pays tiers
  type: main
- language: de
  script: Latn
  content: '70/3/EWG: Entscheidung des Rates vom 20. Dezember 1969 zur Genehmigung
    der stillschweigenden Verlängerung bzw. der Aufrechterhaltung bestimmter, zwischen
    Mitgliedstaaten und dritten Ländern geschlossener Handelsabkommen über die Übergangszeit
    hinaus'
  type: main
- language: it
  script: Latn
  content: '70/3/CEE: Decisione del Consiglio, del 20 dicembre 1969, che autorizza
    il rinnovo tacito o il mantenimento in vigore oltre il periodo transitorio di
    alcuni accordi commerciali conclusi dagli Stati membri con paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '70/3/EEG: Beschikking van de Raad van 20 december 1969 houdende machtiging
    tot stilzwijgende verlenging of handhaving na de overgangsperiode van bepaalde
    handelsakkoorden welke door Lid-Staten met derde landen zijn gesloten'
  type: main
