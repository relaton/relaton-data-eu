title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3734/89 of 13 December 1989 re-establishing
    the levying of customs duties on women's or girls'blouses, shirts and shirt-blouses,
    whether or not knitted or crocheted, of wool, cotton or man-made fibres products
    of category 7 (order No 40.0070), originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4529/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3734/89 de la Commission du 13 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux chemisiers,
    blouses, blouses-chemisiers et chemisettes en bonneterie et autres qu'en bonneterie,
    de laine, de coton ou de fibres synthétiques ou artificielles, pour femmes ou
    fillettes, de la catégorie de produits n° 7 (numéro d'ordre 40.0070), originaires
    de Malaysia, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3734/89 DER KOMMISSION vom 13. Dezember 1989 zur Wiedereinfuehrung
    des Zollsatzes fuer Blusen und Hemdblusen aus Gewirken und andere als aus Gewirken,
    aus Wolle, Baumwolle oder synthetischen oder kuenstlichen Spinnstoffen, fuer Frauen
    und Maedchen, der Warenkategorie Nr. 7 (lfd. Nr. 40.0070) mit Ursprung in Malaysia,
    dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3734/89 af 13. december 1989 om genindførelse
    af opkrævning af toldafgifter for skjorter, skjortebluser og bluser, også af
    trikotage, af uld, bomuld eller syntetiske eller regenererede fibre, til kvinder
    og piger, under varekategori nr. 7 (løbenummer 40.0070), som har oprindelse i
    Malaysia og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
