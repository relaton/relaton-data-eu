    ripristina la riscossione dei dazi doganali applicabili alle camicie, camicette
    e bluse, anche a maglia, di lana, di cotone o di fibre sintetiche o artificiali,
    per donna e per ragazza, della categoria di prodotti n. 7 (numero d'ordine 40.0070),
