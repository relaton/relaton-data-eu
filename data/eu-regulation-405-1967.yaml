title:
- language: fr
  script: Latn
  content: Règlement n° 405/67/CEE du Conseil, du 25 juillet 1967, autorisant la
    République fédérale d'Allemagne à prendre pendant l'année 1967 des mesures
    d'intervention en vue de permettre l'importation des bovins en provenance du Danemark
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 405/67/EWG des Rates vom 25. Juli 1967, durch die die Bundesrepublik
    Deutschland ermächtigt wird, im Jahre 1967 Interventionsmaßnahmen zu ergreifen,
    um die Einfuhr von Rindern aus Dänemark zu ermöglichen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 405/67/CEE del Consiglio, del 25 luglio 1967, che autorizza
    la Repubblica federale di Germania ad adottare per il 1967 talune misure d'intervento
    per consentire l'importazione di bovini in provenienza dalla Danimarca
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 405/67/EEG van de Raad van 25 juli 1967 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd in 1967 interventiemaatregelen te nemen ten einde de
    invoer van runderen uit Denemarken mogelijk te maken
  type: main
