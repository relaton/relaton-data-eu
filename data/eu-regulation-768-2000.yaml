title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 768/2000 of 13 April 2000 determining to
    what extent applications lodged in March 2000 for the right to import young male
    bovine animals for fattening can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 768/2000 de la Commission, du 13 avril 2000, déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de mars 2000 pour les jeunes bovins mâles destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 768/2000 der Kommission vom 13. April 2000 zur Bestimmung
    des Umfangs, in welchem den im März 2000 gestellten Anträgen auf Einfuhrrechte
    für zur Mast bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 768/2000 af 13. april 2000 om fastsættelse
    af nedsættelsesprocentsatsen for de ansøgninger om importrettigheder, der i
    marts 2000 er indgivet for ungtyre til opfedning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 768/2000 της Επιτροπής,
    της 13ης Απριλίου 2000, για καθορισμό του βαθμού
    στον οποίο μπορούν να γίνουν δεκτές οι αιτήσεις
    για δικαιώματα εισαγωγής, οι οποίες υπεβλήθησαν
    το Μάρτιο του 2000 για τα νεαρά αρσενικά βοοειδή
    που προορίζονται γα πάχυνση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 768/2000, annettu 13 päivänä huhtikuuta 2000,
    lihotettaviksi tarkoitettujen nuorten urospuolisten nautojen tuonnista maaliskuussa
    2000 jätettyjen tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 768/2000 della Commissione, del 13 aprile 2000, che
    stabilisce in quale misura possono essere accolte le domande di diritti d'importazione
    presentate nel mese di marzo 2000 per giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 768/2000 van de Commissie van 13 april 2000 tot vaststelling
    van de aantallen dieren waarvoor gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer die in maart 2000 zijn ingediend voor de invoer van jonge mannelijke
    mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 768/2000 da Comissão, de 13 de Abril de 2000, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Março de 2000 para os bovinos machos jovens para engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 768/2000 de la Comisión, de 13 de abril de 2000, por
    el que se determina la medida en que pueden atenderse las solicitudes de derechos
    de importación de bovinos machos jóvenes destinados al engorde presentadas en
    el mes de marzo de 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 768/2000 av den 13 april 2000 om i vilken
    utsträckning de ansökningar om importlicens som inlämnats i mars 2000 kan beviljas
    för import av unga handjur av nötkreatur avsedda för gödning
  type: main
