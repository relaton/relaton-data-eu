    opatrenia na účely článku 7 smernice Rady 2002/53/ES, resp. článku 7 smernice
    Rady 2002/55/ES týkajúce sa znakov, ktoré musia byť splnené ako minimum pri
    skúškach, a minimálnych podmienok na skúšanie určitých odrôd poľnohospodárskych
    rastlinných druhov a druhov zelenín
  type: main
- language: sl
  script: Latn
