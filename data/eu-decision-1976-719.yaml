id: EUDecision1976719
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 August 1976 authorizing the Italian Republic not
    to apply Community treatment to pyrotechnic articles, falling within heading No
    ex 36.05 of the Common Customs Tariff, originating in the People's Republic of
    China and in free circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '76/719/CEE: Décision de la Commission, du 9 août 1976, autorisant la
    République italienne à exclure du traitement communautaire les articles de pyrotechnie,
    de la position tarifaire Ex 36.05 du Tarif douanier commun, originaires de la
    République populaire de Chine et mis en libre pratique en République fédérale
    d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. August 1976, mit der die Italienische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in der Bundesrepublik
    Deutschland im freien Verkehr befindliche Feuerwerksartikel der Tarifnummer ex
    36.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. august 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage pyrotekniske artikler, som
    henhører under pos. ex 36.05 i den fælles toldtarif, har oprindelse i Den kinesiske
    Folkerepublik og frit kan omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 agosto 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli articoli pirotecnici, di
    cui alla voce ex 36.05 della tariffa doganale comune, originari della Repubblica
    popolare di Cina e messi in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 augustus 1976 waarbij de Italiaanse
    Republiek wordt gemachtigd de pyrotechnische artikelen van post ex 36.05 van het
    gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China en in
    de Bondsrepubliek Duitsland in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
