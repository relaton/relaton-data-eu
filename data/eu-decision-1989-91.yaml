title:
- language: en
  script: Latn
  content: '89/91/EEC: Commission Decision of 16 January 1989 authorizing the Kingdom
    of Spain to apply additional health guarantees for the prevention of enzootic
    bovine leucosis in the case of bovine animals imported for breeding or production'
  type: main
- language: fr
  script: Latn
  content: '89/91/CEE: Décision de la Commission du 16 janvier 1989 autorisant le
    Royaume d''Espagne à appliquer des garanties sanitaires complémentaires en matière
    de prévention de la leucose bovine enzootique lors de l''introduction de bovins
    d''élevage ou de rente sur son territoire'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 16. Januar 1989 zur Ermächtigung des
    Königreichs Spanien, bei der Einfuhr von Zucht- oder Nutzrindern zusätzliche
    Gesundheitsgarantien zum Schutz gegen die Einschleppung der enzootischen Leukose
    der Rinder zu verlangen (89/91/EWG) (89/91/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 16. januar 1989 om bemyndigelse af Kongeriget
    Spanien til at anvende supplerende sundhedsgarantier for forebyggelse af enzootisk
    kvægleukose med hensyn til kvæg, der indføres til avl eller produktion (89/91/EØF)
    (89/91/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/91/ΕΟΚ: Απόφαση της Επιτροπής της 16ης ιανουαρίου
    1989 που εξουσιοδοτεί το Βασίλειο της Ισπανίας
    να εφαρμόζει συμπληρωματικά υγειονομικά μέτρα
    για την πρόβλεψη της ενζωοτικής λεύκωσης των
    βοοειδών, στην περίπτωση των βοοειδών που εισάγονται
    για αναπαραγωγή ή παραγωγή'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 16 gennaio 1989 che autorizza il Regno
    di Spagna ad applicare garanzie sanitarie supplementari per prevenire la leucosi
    bovina enzootica, in caso d'' importazione di bovini da allevamento o da produzione
    (89/91/CEE) (89/91/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 16 januari 1989 houdende machtiging van
    het Koninkrijk Spanje om, bij de invoer van fok- en gebruiksrunderen, bijkomende
    gezondheidsgaranties toe te passen ter voorkoming van enzoötische bovine leukose
    (89/91/EEG) (89/91/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 16 de Janeiro de 1989 que autoriza o Reino de
    Espanha a aplicar exigências sanitárias adicionais, para prevenção da leucose
    bovina enzoótica, à importação de animais da espécie bovina de criação
    ou de rendimento (89/91/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 16 de enero de 1989 por la que se autoriza
    al Reino de España a aplicar garantías sanitarias adicionales para la prevención
    de la leucosis enzoótica bovina en animales de la especie bovina importados para
    la cría o producción (89/91/CEE) (89/91/CEE) #'
