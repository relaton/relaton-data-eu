  content: Council Regulation (EC) No 664/2009 of 7 July 2009 establishing a procedure
    for the negotiation and conclusion of agreements between Member States and third
    countries concerning jurisdiction, recognition and enforcement of judgments and
    decisions in matrimonial matters, matters of parental responsibility and matters
    relating to maintenance obligations, and the law applicable to matters relating
    to maintenance obligations
  type: main
- language: fr
