title:
- language: en
  script: Latn
  content: '79/835/EEC: Commission Decision of 24 September 1979 authorizing Ireland
    to store outside its territory during the fourth quarter of 1979 beef products
    held by its intervention agency (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/835/CEE: Décision de la Commission, du 24 septembre 1979, autorisant
    l''Irlande à stocker hors de son territoire, pendant le quatrième trimestre
    1979, des produits du secteur de la viande bovine détenus par son organisme d''intervention
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/835/EWG: Entscheidung der Kommission vom 24. September 1979 zur Ermächtigung
    Irlands, während des vierten Vierteljahres 1979 Erzeugnisse des Rindfleischsektors
    im Besitz seiner Interventionsstelle außerhalb seines Hoheitsgebiets zu lagern
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/835/EØF: Kommissionens beslutning af 24. september 1979 om bemyndigelse
    af Irland til i fjerde kvartal 1979 uden for sit område at oplagre produkter
    fra oksekødsektoren, som dets interventionsorgan ligger inde med (Kun den engelske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/835/CEE: Decisione della Commissione, del 24 settembre 1979, che autorizza
    l''Irlanda a immagazzinare, nel quarto trimestre 1979, fuori del proprio territorio
    prodotti del settore delle carni bovine detenuti dall''organismo d''intervento
    irlandese (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/835/EEG: Beschikking van de Commissie van 24 september 1979 waarbij
    Ierland wordt gemachtigd om produkten van de sector rundvlees die in het bezit
    zijn van het Ierse interventiebureau, gedurende het vierde kwartaal 1979 buiten
    zijn grondgebied op te slaan (Slechts de tekst in de Engelse taal is authentiek)'
