  script: Latn
  content: Commission Implementing Regulation (EU) 2015/595 of 15 April 2015 concerning
    a coordinated multiannual control programme of the Union for 2016, 2017 and 2018
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
