title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1758/84 of 22 June 1984 re-establishing
    the levying of customs duties on methanol (methyl alcohol), falling within subheading
    29.04 A I and originating in Saudi Arabia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1758/84 de la Commission du 22 juin 1984 portant rétablissement
    de la perception des droits de douane applicables au méthanol, de la sous-position
    29.04 A I du tarif douanier commun, originaire d' Arabie saoudite, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1758/84 der Kommission vom 22. Juni 1984 zur Wiedereinführung
    der Erhebung der Zölle für Methanol (Methylalkohol) der Tarifstelle 29.04 A
    I mit Ursprung in Saudi-Arabien, dem die in der Verordnung (EWG) Nr. 3569/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1758/84 af 22. juni 1984 om genindførelse
    af opkrævning af told for methanol (methylalkohol), henhørende under pos. 29.04
    A I og med oprindelse i Saudi-Arabien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1758/84 της Επιτροπής
    της 22ας Ιουνίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τη μεθανόλη (μεθυλική
    αλκοόλη), της διακρίσεως 29.04 Α Ι του Κοινού Δασμολογίου,
    καταγωγής Σαουδικής Αραβίας, δικαιούχου των
    προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1758/84 della Commissione del 22 giugno 1984 che ripristina
    la riscossione dei dazi doganali applicabili al metanolo (alcole metilico) della
    sottovoce 29.04 A I della tariffa doganale comune, originario dell' Arabia Saudita
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1758/84 van de Commissie van 22 juni 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op methanol (methylalcohol)
    van postonderverdeling 29.04 A I, van oorsprong uit Saoedi-Arabië, waarvoor de
    in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
