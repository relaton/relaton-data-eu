title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 954/81 of 7 April 1981 re-establishing the
    levying of customs duties on made up accessories for articles of apparel, other
    than knitted or crocheted, products of category 88 (code 0880), originating in
    Peru, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 954/81 de la Commission, du 7 avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres accessoires
    confectionnés du vêtement, autres qu' en bonneterie, de la catégorie 88 (code
    0880), originaires du Pérou, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 954/81 der Kommission vom 7. April 1981 über die
    Wiedereinführung des Zollsatzes für anderes konfektioniertes Bekleidungszubehör,
    anderes als aus Gewirken, der Warenkategorie Nr. 88 (Kennziffer 0880), mit Ursprung
    in Peru, dem die in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 954/81 af 7. april 1981 om genindførelse
    af opkrævning af toldafgifter for konfektioneret tilbehør til beklædningsgenstande,
    ikke af trikotage, under kategori 88, (kode 0880), som har oprindelse i Peru og
    omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr.
    3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 954/81 τής Επιτροπής
    τής 7ης Απριλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά έτοιμα συμπληρώματα
    τού ενδύματος, έτερα τών πλεκτών, τών προϊόντων
    τής κατηγορίας αριθ. 88 (κώδικας 0880), καταγωγής
    Περού, δικαιούχων τών προβλεπομένων στόν κανονισμό
    (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 954/81 della Commissione, del 7 aprile 1981, che ripristina
    la riscossione dei dazi doganali applicabili agli altri accessori confezionati
    per oggetti di vestiario, esclusi quelli a maglia, della categoria di prodotti
    n. 88 (codice 0880), originari del Perù, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 954/81 van de Commissie van 7 april 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander geconfectioneerd
    kledingtoebehoren, andere dan die van brei- of haakwerk, van de categorie van
    produkten nr. 88 (codenummer 0880), van oorsprong uit Peru waarvoor de algemene
    tariefpreferenties gelden als bedoeld bij Verordening (EEG) nr. 3320/80 van de
    Raad
  type: main
