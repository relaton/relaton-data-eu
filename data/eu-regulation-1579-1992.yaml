  script: Latn
  content: Commission Regulation (EEC) No 1579/92 of 19 June 1992 fixing the difference
    in white sugar prices to be used in calculating the levy for processed fruit and
    vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1579/92 de la Commission, du 19 juin 1992, fixant la
    différence de prix du sucre blanc applicable pour le calcul du prélèvement
    dans le secteur des produits transformés à base de fruits et légumes et dans
    le secteur viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1579/92 der Kommission vom 19. Juni 1992 zur Festsetzung
    des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse aus Obst
    und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds zwischen
    Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1579/92 af 19. juni 1992 om fastsættelse
    af den prisforskel for hvidt sukker, som anvendes ved afgiftsberegningen for produkter
    forarbejdet på basis af frugt og grønsager og for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1579/92 της Επιτροπής
    της 19ης Ιουνίου 1992 περί καθορισμού της διαφοράς
    των τιμών της λευκής ζάχαρης η οποία λαμβάνεται
    υπόψη για τον υπολογισμό της εισφοράς στον
    τομέα των μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά και στον αμπελοοινικό τομέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1579/92 della Commissione, del 19 giugno 1992, che
    fissa la differenza di prezzo dello zucchero bianco applicabile per il calcolo
    del prelievo nel settore dei prodotti trasformati a base di ortofrutticoli e nel
    settore vitivinicolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1579/92 van de Commissie van 19 juni 1992 tot vaststelling
    van het prijsverschil voor witte suiker dat wordt toegepast bij de berekening
    van de heffing in de sector van op basis van groenten en fruit verwerkte produkten
    en in de wijnsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1579/92 da Comissão, de 19 de Junho de 1992, que
    fixa a diferença de preço do açúcar branco aplicável para o cálculo do direito
    nivelador no sector dos produtos transformados à base de frutos e produtos hortícolas
    e no sector vitivinícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1579/92 de la Comisión, de 19 de junio de 1992, por
