title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 176/80 of 15 January 1980 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 176/80 du Conseil, du 15 janvier 1980, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 176/80 des Rates vom 15. Januar 1980 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für
    die auf den Färöern registrierten Schiffe
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 176/80 af 15. januar 1980 om fastsættelse
    af visse midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 176/80 del Consiglio, del 15 gennaio 1980, che dispone
    talune misure provvisorie di conservazione e di gestione delle risorse di pesca,
    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 176/80 van de Raad van 15 januari 1980 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden, van toepassing op de Faeröer geregistreerde vaartuigen
  type: main
