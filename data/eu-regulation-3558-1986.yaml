title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3558/86 of 20 November 1986 re-establishing
    the levying of customs duties on other woven fabrics of cotton, unbleached or
    bleached, products of category ex 2 (code 40.0023), originating in Indonesia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3558/86 de la Commission du 20 novembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux autres tissus
    de coton, écrus ou blanchis, de la catégorie ex 2 (code 40.0023), originaires
    de l' Indonésie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3558/86 der Kommission vom 20. November 1986 über
    die Wiedereinführung des Zollsatzes für andere Gewebe aus Baumwolle, roh oder
    gebleicht, der Warenkategorie Nr. ex 2 (Kennziffer 40.0023), mit Ursprung in Indonesien,
    dem die in der Verordnung (EWG) Nr. 3600/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
