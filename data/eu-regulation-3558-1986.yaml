    originari dell' Indonesia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3600/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3558/86 van de Commissie van 20 november 1986 houdende
