    εντός τρίτης χώρας, στόν τομέα τού γάλακτος
    καί τών γαλακτοκομικών προϊόντων
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 3034/82, annettu 16 päivänä marraskuuta 1982,
    asetuksen (ETY) N:o 2729/81 muuttamisesta maito- ja maitotuotealalla kolmannessa
    maassa järjestettävän tarjouskilpailun yhteydessä ennalta vahvistettavaa tukea
    koskevan määräajan noudattamisen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3034/82 della Commissione, del 16 novembre 1982, che
    modifica il regolamento (CEE) n. 2729/81 per quanto riguarda il termine da rispettare
    in caso di fissazione in anticipo della restituzione, nell' ambito di una gara
    in un paese terzo, nel settore del latte e del prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3034/82 van de Commissie van 16 november 1982 tot
    wijziging van Verordening (EEG) nr. 2729/81 ten aanzien van de in de sector melk
    en zuivelprodukten in acht te nemen termijn in geval van vaststelling vooraf van
    de restitutie in het kader van een openbare inschrijving in een derde land
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 3034/82 av den 16 november 1982 om ändring
