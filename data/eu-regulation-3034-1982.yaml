    ved forudfastsættelse af restitution i forbindelse med en licitation i et tredjeland
    vedrørende mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ 3034/82 τής Επιτροπής τής
