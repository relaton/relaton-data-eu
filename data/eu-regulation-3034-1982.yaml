    of the refund in connection with an invitation to tender in a non-member country
    in the milk and milk products sectoro
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3034/82 de la Commission, du 16 novembre 1982, modifiant
    le règlement (CEE) n° 2729/81 en ce qui concerne le délai à respecter en cas
    de fixation à l' avance de la restitution dans le cadre d' une adjudication dans
    un pays tiers, dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3034/82 der Kommission vom 16. November 1982 zur Änderung
    der Verordnung (EWG) Nr. 2729/81 hinsichtlich der Frist, die im Fall der Vorausfestsetzung
    der Erstattung für Milch und Milcherzeugnisse im Rahmen einer Ausschreibung in
    einem Drittland einzuhalten ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3034/82 af 16. november 1982 om ændring
