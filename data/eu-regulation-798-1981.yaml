title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 798/81 of 26 March 1981, re-establishing
    the levying of customs duties on yarn of synthetic textile fibres, products of
    category 56 (code 0560), originating in Hong Kong, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 798/81 de la Commission, du 26 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques, de la catégorie de produits n° 56 (code 0560),
    originaires de Hong-kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 798/81 der Kommission vom 26. März 1981 über die
    Wiedereinführung des Zollsatzes für Garne aus synthetischen Spinnfasern der
    Warenkategorie Nr. 56 (Kennziffer 0560), mit Ursprung in Hongkong, dem die in
    der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 798/81 af 26. marts 1981 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre, under kategori
    56 (kode 0560), som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 798/81 τής Επιτροπής
