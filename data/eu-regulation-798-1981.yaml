    συνθετικών υφαντικών ινών τών προϊόντων τής
    κατηγορίας αριθ. 56 (κώδικας 0560) καταγωγής Χόνγκ
    Κόνγκ δικαιούχων τών προβλεπομένων στόν κανονισμό
    (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 798/81 della Commissione, del 26 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili ai filati di fibre tessili sintetiche,
    della categoria di prodotti n. 56 (codice 0560), originari di Hong Kong beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 798/81 van de Commissie van 26 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische stapelvezels van de categorie van produkten 56 (codenummer 0560),
    van oorsprong uit Hong-Kong, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3320/80 van de Raad
