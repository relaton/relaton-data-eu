title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3195/93 of 22 November 1993 amending Regulation
    (EEC) No 1517/93 fixing at 25 000 tonnes the quantity of bread-making wheat held
    by the Belgian intervention agency for which a standing invitation to tender for
    export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3195/93 de la Commission, du 22 novembre 1993, modifiant
    le règlement (CEE) n 1517/93 et fixant à 25 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    belge
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3195/93 der Kommission vom 22. November 1993 zur Änderung
    der Verordnung (EWG) Nr. 1517/93 und zur Festsetzung der Dauerausschreibung zur
    Ausfuhr von im Besitz der belgischen Interventionsstelle befindlichem Brotweichweizen
    auf 25 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3195/93 af 22. november 1993 om ændring
    af forordning (EØF) nr. 1517/93 og om fastsættelse af den løbende licitation
    med henblik på eksport af bageegnet blød hvede på 25 000 tons, som er i det
    belgiske interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3195/93 της Επιτροπής
    της 22ας Νοεμβρίου 1993 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 1517/93 και περί καθορισμού
    διαρκούς διαγωνισμού για εξαγωγή 25 000 τόνων
    μαλακού αρτοποιήσιμου σίτου που έχει στη διάθεσή
    του ο βελγικός οργανισμός παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3195/93 della Commissione, del 22 novembre 1993, che
    modifica il regolamento (CEE) n. 1517/93 e che fissa a 25 000 tonnellate il quantitativo
    globale oggetto della gara permanente per l'esportazione di frumento tenero panificabile
    detenuto dall'organismo d'intervento belga
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3195/93 van de Commissie van 22 november 1993 tot
    wijziging van Verordening (EEG) nr. 1517/93, ten einde de hoeveelheid waarop de
    permanente openbare inschrijving voor de uitvoer van zachte broodtarwe uit Belgische
    interventievoorraden betrekking heeft, op 25 000 ton vast te stellen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3195/93 da Comissão, de 22 de Novembro de 1993, que
    altera o Regulamento (CEE) nº 1517/93 e fixa em 25 000 toneladas o concurso permanente
    para a exportação do trigo mole panificável detido pelo organismo de intervenção
    belga
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 3195/93 de la Comisión, de 22 de noviembre de 1993,
