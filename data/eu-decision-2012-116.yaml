title:
- language: en
  script: Latn
  content: '2012/116/EU: Commission Implementing Decision of 22 February 2012 providing
    for the temporary marketing of seed of the species Triticum durum Desf. belonging
    to the variety Marialva not satisfying the requirements of Council Directive 66/402/EEC
    as regards the maximum content of seeds of wheat ( Triticum aestivum L.) (notified
    under document C(2012) 1114)'
  type: main
- language: fr
  script: Latn
  content: '2012/116/UE: Décision d’exécution de la Commission du 22 février
    2012 prévoyant la commercialisation temporaire de semences de l’espèce Triticum
    durum Desf. de la variété Marialva qui ne satisfont pas aux exigences de la
    directive 66/402/CEE du Conseil en ce qui concerne la teneur maximale en semences
    de blé ( Triticum aestivum L.) [notifiée sous le numéro C(2012) 1114]'
  type: main
- language: de
  script: Latn
  content: '2012/116/EU: Durchführungsbeschluss der Kommission vom 22. Februar 2012
