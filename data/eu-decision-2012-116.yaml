    Desf. der Sorte Marialva, das den Anforderungen der Richtlinie 66/402/EWG des
    Rates hinsichtlich des zahlenmäßigen Höchstanteils an Körnern von Weichweizen
    ( Triticum aestivum L.) nicht entspricht (Bekanntgegeben unter Aktenzeichen K(2012)
    1114)'
