title:
- language: en
  script: Latn
  content: Council Directive 91/496/EEC of 15 July 1991 laying down the principles
    governing the organization of veterinary checks on animals entering the Community
    from third countries and amending Directives 89/662/EEC, 90/425/EEC and 90/675/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 91/496/CEE du Conseil, du 15 juillet 1991, fixant les principes
    relatifs à l'organisation des contrôles vétérinaires pour les animaux en provenance
    des pays tiers introduits dans la Communauté et modifiant les directives 89/662/CEE,
    90/425/CEE et 90/675/CEE
  type: main
- language: de
  script: Latn
