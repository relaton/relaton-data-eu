    endgültigen Antidumpingzolls auf die Einfuhren bestimmter nahtloser Rohre aus
    Eisen oder Stahl mit Ursprung in Russland und der Ukraine im Anschluss an eine
    teilweise Interimsüberprüfung nach Artikel 11 Absatz 3 der Verordnung (EG) Nr.
    1225/2009
