    di ferro o di acciaio, originari della Russia e dell’Ucraina, in seguito a un
    riesame intermedio parziale a norma dell’articolo 11, paragrafo 3, del regolamento
    (CE) n. 1225/2009
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 795/2012 ( 2012. gada 28. augusts
    ), ar kuru pēc daļējas starpposma pārskatīšanas atbilstīgi Regulas (EK)
    Nr. 1225/2009 11. panta 3. punktam groza Īstenošanas regulu (ES) Nr. 585/2012,
    ar ko nosaka galīgo antidempinga maksājumu konkrētu Krievijas un Ukrainas izcelsmes
    dzelzs vai tērauda bezšuvju cauruļvadu un cauruļu importam
  type: main
- language: lt
  script: Latn
  content: 2012 m. rugpjūčio 28 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 795/2012,
    kuriuo, atlikus dalinę tarpinę peržiūrą pagal Reglamento (EB) Nr. 1225/2009
    11 straipsnio 3 dalį, iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr.
    585/2012, kuriuo nustatomas galutinis antidempingo muitas tam tikriems importuojamiems
