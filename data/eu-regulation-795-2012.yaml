title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 795/2012 of 28 August 2012 amending
    Implementing Regulation (EU) No 585/2012 imposing a definitive anti-dumping duty
    on imports of certain seamless pipes and tubes, of iron or steel, originating
    in Russia and Ukraine, following a partial interim review pursuant to Article
    11(3) of Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 795/2012 du Conseil du 28 août 2012
    modifiant le règlement d’exécution (UE) n ° 585/2012 instituant un droit
    antidumping définitif sur les importations de certains tubes et tuyaux sans soudure,
    en fer ou en acier, originaires de Russie et d’Ukraine, à la suite d’un réexamen
    intermédiaire partiel conformément à l’article 11, paragraphe 3, du règlement
    (CE) n ° 1225/2009
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 795/2012 des Rates vom 28. August 2012
