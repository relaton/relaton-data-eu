  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/674 ón gCoimisiún an 22 Aibreán
    2022 lena gceartaítear Rialachán Cur Chun Feidhme (AE) 2022/95 lena bhforchuirtear
    dleacht frithdhumpála chinntitheach ar allmhairí d’fheistithe áirithe feadán
    agus píopaí, as iarann nó as cruach, ar de thionscnamh Dhaon-Phoblacht na Síne
    iad, mar a leathnaítear chun allmhairí d’fheistithe áirithe feadán agus
    píopaí, as iarann nó as cruach, ar de thionscnamh na Téaváine, na hIndinéise,
    Shrí Lanca agus na nOileán Filipíneach iad, bídís dearbhaithe gur de thionscnamh
    na dtíortha sin iad nó ná bídís, a chumhdach, tar éis athbhreithniú éaga
    de bhun Airteagal 11(2) de Rialachán (AE) 2016/1036 ó Pharlaimint na hEorpa
    agus ón gComhairle
  type: main
