  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/674 av den 22 april 2022
    om ändring av genomförandeförordning (EU) 2022/95 om införande av en slutgiltig
    antidumpningstull på import av vissa rördelar av järn eller stål med ursprung
    i Folkrepubliken Kina, utvidgad till att även omfatta import av vissa rördelar
    av järn eller stål som avsänts från Taiwan, Indonesien, Sri Lanka och Filippinerna,
    oavsett om produktens deklarerade ursprung är dessa länder eller inte, efter
    en översyn vid giltighetstidens utgång enligt artikel 11.2 i Europaparlamentets
    och rådets förordning (EU) 2016/1036
