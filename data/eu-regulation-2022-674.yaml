title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/674 of 22 April 2022 correcting
    Implementing Regulation (EU) 2022/95 imposing a definitive anti-dumping duty on
    imports of certain tube and pipe fittings, of iron or steel, originating in the
    People’s Republic of China, as extended to imports of certain tube and pipe
    fittings, of iron or steel consigned from Taiwan, Indonesia, Sri Lanka and the
    Philippines, whether declared as originating in these countries or not following
    an expiry review pursuant to Article 11(2) of Regulation (EU) 2016/1036 of the
    European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/674 de la Commission du 22 avril 2022
    portant rectification du règlement d’exécution (UE) 2022/95 instituant un
    droit antidumping définitif sur les importations de certains accessoires de tuyauterie,
    en fer ou en acier, originaires de la République populaire de Chine, tel qu’étendu
    aux importations de certains accessoires de tuyauterie, en fer ou en acier, expédiés
    de Taïwan, d’Indonésie, de Sri Lanka et des Philippines, qu’ils aient ou
    non été déclarés originaires de ces pays, à l’issue d’un réexamen de
    mesures parvenant à expiration effectué conformément à l’article 11, paragraphe
    2, du règlement (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
