    Lanky a z Filipín bez ohľadu na to, či majú alebo nemajú deklarovaný pôvod
    v týchto krajinách
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/674 z dne 22. aprila 2022 o popravku
    Izvedbene uredbe Komisije (EU) 2022/95 o uvedbi dokončne protidampinške dajatve
    na uvoz nekaterega železnega ali jeklenega pribora (fitingov) za cevi s poreklom
    iz Ljudske republike Kitajske, kakor je bila razširjena na uvoz nekaterega železnega
    ali jeklenega pribora (fitingov) za cevi, poslanega s Tajvana, iz Indonezije,
    s Šrilanke in Filipinov, ne glede na to, ali je deklariran kot izdelek s poreklom
    iz teh držav ali ne, po pregledu zaradi izteka ukrepa v skladu s členom 11(2)
    Uredbe (EU) 2016/1036 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/674 de la Comisión de 22 de abril de
    2022 que corrige el Reglamento de Ejecución (UE) 2022/95, por el que se establece
    un derecho antidumping definitivo sobre las importaciones de determinados accesorios
    de tubería de hierro o acero originarios de la República Popular China, ampliado
    a las importaciones de determinados accesorios de tubería de hierro o acero procedentes
    de Taiwán, Indonesia, Sri Lanka y Filipinas, tanto si se declaran originarios
    de estos países como si no, a raíz de una reconsideración por expiración con
    arreglo al artículo 11, apartado 2, del Reglamento (UE) 2016/1036 del Parlamento
    Europeo y del Consejo
  type: main
