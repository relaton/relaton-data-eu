title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2256/80 of 27 August 1980 re-establishing
    the levying of customs duties on benzoic acid and its salts and esters, falling
    within subheading 29.14 D I and originating in developing countries, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2256/80 de la Commission, du 27 août 1980, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    benzoïque, ses sels et ses esters, de la sous-position 29.14 D I du tarif douanier
    commun, originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2256/80 der Kommission vom 27. August 1980 zur Wiedereinführung
    des Zollsatzes für Benzoesäure, ihre Salze und Ester, der Tarifstelle 29.14
    D I, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2256/80 af 27. august 1980 om genindførelse
    af opkrævning af toldafgifter for benzoesyre samt salte og estere deraf, under
    pos. 29.14 D I, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2256/80 della Commissione, del 27 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' acido benzoico, suoi
    sali e suoi esteri, della sottovoce 29.14 D I della tariffa doganale comune, originario
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2256/80 van de Commissie van 27 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor benzoëzuur, alsmede
    zouten en esters daarvan, van post 29.14 D I, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties
    werden geopend
  type: main
