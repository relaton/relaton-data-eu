title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 683/82 of 24 March 1982 on a decision to
    make no award in respect of the second partial invitation to tender for white
    sugar issued in connection with the supplementary standing invitation to tender
    referred to in Regulation (EEC) No 2042/81
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 683/82 de la Commission, du 24 mars 1982, portant décision
    de ne pas donner suite à la deuxième adjudication partielle de sucre blanc effectuée
    dans le cadre de l'adjudication permanente complémentaire visée au règlement
    (CEE) n 2042/81
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 683/82 der Kommission vom 24. März 1982 über die
    Entscheidung, der im Rahmen der in der in der Verordnung (EWG) Nr. 2042/81 genannten
    ergänzenden Dauerausschreibung durchgeführten zweiten Teilausschreibung nicht
    stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 683/82 af 24. marts 1982 om ikke at
    gennemføre den anden del-licitation for hvidt sukker, der er afholdt inden for
    rammerne af den løbende tillægslicitation omhandlet i forordning (EØF) nr.
    2042/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 683/82 της Επιτροπής
    της 24ης Μαρτίου 1982 περί αποφάσεως να μη δοθεί
    συνέχεια στον δεύτερο επί μέρους διαγωνισμό
    λευκής ζάχαρης πού πραγματοποιείται στο πλαίσιο
    του συμπληρωματικού διαρκούς διαγωνισμού
    πού αναφέρεται στον κανονισμό (ΕΟΚ) αριθ. 2042/81
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 683/82 della Commissione, del 24 marzo 1982, recante
    decisione di non date seguito alla seconda gara parziale di zucchero bianco effettuata
    nell'ambito della gara permanente complementare prevista dal regolamento (CEE)
    n. 2042/81
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 683/82 van de Commissie van 24 maart 1982 houdende
