    Belgien, Deutschland, Frankreich, Luxemburg und den Niederlanden auf der Ebene
    funktionaler Luftraumblöcke gemäß der Verordnung (EG) Nr. 549/2004 des Europäischen
    Parlaments und des Rates vorgelegten überarbeiteten Leistungsplanentwurf für
