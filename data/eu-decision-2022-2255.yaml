    Council (notified under document C(2022) 7438) (Only the Dutch, French and German
    texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2255 de la Commission du 24 octobre 2022 relative au
    lancement de l’examen détaillé de certains objectifs de performance figurant
    dans le projet de plan de performance révisé pour la troisième période de
    référence présenté au niveau du bloc d’espace aérien fonctionnel par la
    Belgique, l’Allemagne, la France, le Luxembourg et les Pays-Bas conformément
    au règlement (CE) no 549/2004 du Parlement européen et du Conseil [notifiée
    sous le numéro C(2022) 7438] (Les textes en langues allemande, française et
    néerlandaise sont les seuls faisant foi.)
  type: main
