  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/325 2022 m. vasario 24 d.
    kuriuo dėl leidimo pateikti rinkai produktus, kurių sudėtyje yra tam tikrų
    genetiškai modifikuotų organizmų arba kurie iš jų sudaryti ar pagaminti,
    turėtojo ir jo atstovo Sąjungoje iš dalies keičiami įgyvendinimo sprendimai
