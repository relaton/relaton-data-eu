    (ES) 2019/1304, (ES) 2019/1306 ir (ES) 2021/1388 (pranešta dokumentu Nr. C(2022)
    1049) (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/325 tal-24
    ta’ Frar 2022 li temenda d-Deċiżjonijiet ta’ Implimentazzjoni (UE) 2015/698,
    (UE) 2017/2448, (UE) 2017/2452, (UE) 2018/1109, (UE) 2018/1110, (UE) 2019/1304,
    (UE) 2019/1306 u (UE) 2021/1388 fir-rigward tad-detentur tal-awtorizzazzjoni u
    tar-rappreżentant tiegħu fl-Unjoni għat-tqegħid fis-suq ta’ prodotti li
    fihom, li jikkonsistu, jew li huma prodotti minn ċerti organiżmi ġenetikament
    modifikati (notifikata bid-dokument C(2022) 1049) (It-test bl-Olandiż biss huwa
    awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/325 van de Commissie van 24 februari 2022
    tot wijziging van de Uitvoeringsbesluiten (EU) 2015/698, (EU) 2017/2448, (EU)
    2017/2452, (EU) 2018/1109, (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 en (EU)
    2021/1388 wat betreft de vergunninghouder en zijn vertegenwoordiger in de Unie
    voor het in de handel brengen van producten die geheel of gedeeltelijk bestaan
    uit of zijn geproduceerd met bepaalde genetisch gemodificeerde organismen (Kennisgeving
    geschied onder nummer C(2022) 1049) (Slechts de tekst in de Nederlandse taal is
    authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/325 z dnia 24 lutego 2022 r. zmieniająca
    decyzje wykonawcze (UE) 2015/698, (UE) 2017/2448, (UE) 2017/2452, (UE) 2018/1109,
    (UE) 2018/1110, (UE) 2019/1304, (UE) 2019/1306 oraz (UE) 2021/1388 w odniesieniu
    do posiadacza zezwolenia na wprowadzanie do obrotu produktów zawierających niektóre
    organizmy zmodyfikowane genetycznie, składających się z nich lub z nich wyprodukowanych
    oraz do jego przedstawiciela w Unii (notyfikowana jako dokument nr C(2022) 1049)
    (Jedynie tekst w języku niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/325 da Comissão de 24 de fevereiro de
    2022 que altera as Decisões de Execução (UE) 2015/698, (UE) 2017/2448, (UE)
    2017/2452, (UE) 2018/1109, (UE) 2018/1110, (UE) 2019/1304, (UE) 2019/1306 e (UE)
    2021/1388 no que diz respeito ao detentor da autorização e ao seu representante
    na União para a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de certos organismos geneticamente modificados
    [notificada com o número C(2022) 1049] (Texto relevante para efeitos do EEE)
    (Apenas faz fé o texto em língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/325 a Comisiei din 24 februarie
    2022 de modificare a Deciziilor de punere în aplicare (UE) 2015/698, (UE) 2017/2448,
    (UE) 2017/2452, (UE) 2018/1109, (UE) 2018/1110, (UE) 2019/1304, (UE) 2019/1306
    și (UE) 2021/1388 în ceea ce privește titularul autorizației de introducere
    pe piață a produselor care conțin, constau în sau sunt fabricate din anumite
    organisme modificate genetic și reprezentantul acestuia în Uniune [notificată
    cu numărul C(2022) 1049] (Numai textul în limba neerlandeză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/325 z 24. februára 2022, ktorým
    sa menia vykonávajúce rozhodnutia (EÚ) 2015/698, (EÚ) 2017/2448, (EÚ) 2017/2452,
    (EÚ) 2018/1109, (EÚ) 2018/1110, (EÚ) 2019/1304, (EÚ) 2019/1306 a (EÚ) 2021/1388,
    pokiaľ ide o držiteľa povolenia na umiestnenie na trh týkajúceho sa výrobkov,
    ktoré obsahujú určité geneticky modifikované organizmy, sú z nich zložené
    alebo vyrobené, a jeho zástupcu v Únii [oznámené pod číslom C(2022 1049]
    (Iba holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/325 z dne 24. februarja 2022 o spremembi
    izvedbenih sklepov (EU) 2015/698, (EU) 2017/2448, (EU) 2017/2452, (EU) 2018/1109,
    (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 in (EU) 2021/1388 glede imetnika
    odobritve za dajanje na trg proizvodov, ki vsebujejo nekatere gensko spremenjene
    organizme, so iz njih sestavljeni ali proizvedeni, in njegovega zastopnika v Uniji
    (notificirano pod dokumentarno številko C(2022) 1049) (Besedilo v nizozemskem
    jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/325 de la Comisión de 24 de febrero
    de 2022 por la que se modifican las Decisiones de Ejecución (UE) 2015/698, (UE)
    2017/2448, (UE) 2017/2452, (UE) 2018/1109, (UE) 2018/1110, (UE) 2019/1304, (UE)
    2019/1306 y (UE) 2021/1388 en lo que respecta al titular de la autorización y
    su representante en la Unión para la comercialización de productos que contengan
    o estén compuestos por determinados organismos modificados genéticamente, o
    se hayan producido a partir de ellos [notificada con el número C(2022) 1049]
    (El texto en lengua neerlandesa es el único auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/325 av den 24 februari 2022
    om ändring av genomförandebesluten (EU) 2015/698, (EU) 2017/2448, (EU) 2017/2452,
    (EU) 2018/1109, (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 och (EU) 2021/1388
    vad gäller innehavaren av godkännandet och dess företrädare i unionen för
    utsläppande på marknaden av produkter som innehåller, består av eller har
    framställts av vissa genetiskt modifierade organismer [delgivet med nr C(2022)
    1049] (Endast den nederländska texten är giltig)
