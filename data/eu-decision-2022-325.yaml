id: EUDecision2022325
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/325 of 24 February 2022 amending
    Implementing Decisions (EU) 2015/698, (EU) 2017/2448, (EU) 2017/2452, (EU) 2018/1109,
    (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 and (EU) 2021/1388 as regards the
    authorisation holder and its representative in the Union for the placing on the
    market of products containing, consisting of, or produced from certain genetically
    modified organisms (notified under document C(2022) 1049) (Only the Dutch text
    is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/325 de la Commission du 24 février
    2022 modifiant les décisions d’exécution (UE) 2015/698, (UE) 2017/2448, (UE)
    2017/2452, (UE) 2018/1109, (UE) 2018/1110, (UE) 2019/1304, (UE) 2019/1306 et (UE)
    2021/1388 en ce qui concerne le titulaire de l’autorisation et son représentant
    dans l’Union pour la mise sur le marché de produits contenant certains organismes
    génétiquement modifiés, consistant en ces organismes ou produits à partir
    de ceux-ci [notifiée sous le numéro C(2022) 1049] (Le texte en langue néerlandaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/325 der Kommission vom 24. Februar 2022
    zur Änderung der Durchführungsbeschlüsse (EU) 2015/698, (EU) 2017/2448, (EU)
    2017/2452, (EU) 2018/1109, (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 und
    (EU) 2021/1388 hinsichtlich des Inhabers der Zulassungen für das Inverkehrbringen
    von Erzeugnissen, die bestimmte genetisch veränderte Organismen enthalten, aus
    ihnen bestehen oder aus ihnen hergestellt werden, und seines Vertreters in der
    Union (Bekannt gegeben unter Aktenzeichen C(2022) 1049) (Nur der niederländische
    Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/325 на Комисията
    от 24 февруари 2022 година за изменение на решения
    за изпълнение (ЕС) 2015/698, (ЕС) 2017/2448, (ЕС) 2017/2452,
    (ЕС) 2018/1109, (ЕС) 2018/1110, (ЕС) 2019/1304, (ЕС) 2019/1306 и (ЕС)
    2021/1388 по отношение на титуляря на разрешението
    и неговия представител в Съюза за пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от определени генетично
    модифицирани организми (нотифицирано под номер
    С(2022) 1049) (само текстът на нидерландски език
    е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/325 ze dne 24. února 2022, kterým
    se mění prováděcí rozhodnutí (EU) 2015/698, (EU) 2017/2448, (EU) 2017/2452,
    (EU) 2018/1109, (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 a (EU) 2021/1388,
    pokud jde o držitele povolení a jeho zástupce v Unii pro uvádění produktů,
    které obsahují určité geneticky modifikované organismy, sestávají z nich
    nebo jsou z nich vyrobeny, na trh (oznámeno pod číslem C(2022) 1049) (Text
    s významem pro EHP) (Pouze nizozemské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/325 af 24. februar 2022
    om ændring af gennemførelsesafgørelse (EU) 2015/698, (EU) 2017/2448, (EU) 2017/2452,
    (EU) 2018/1109, (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 og (EU) 2021/1388
    for så vidt angår indehaveren og dennes repræsentant i Unionen af tilladelsen
    til markedsføring af produkter, der indeholder, består af eller er fremstillet
    af visse genetisk modificerede organismer (meddelt under nummer C(2022) 1049)
    (Kun den nederlandske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/325 της Επιτροπής
    της 24ης Φεβρουαρίου 2022 για την τροποποίηση
    των εκτελεστικών αποφάσεων (ΕΕ) 2015/698, (ΕΕ) 2017/2448,
    (ΕΕ) 2017/2452, (ΕΕ) 2018/1109, (ΕΕ) 2018/1110, 2019/1304, (ΕΕ) 2019/1306
    και (ΕΕ) 2021/1388 όσον αφορά τον κάτοχο της έγκρισης
