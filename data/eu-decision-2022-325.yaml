    2017/2452, (UE) 2018/1109, (UE) 2018/1110, (UE) 2019/1304, (UE) 2019/1306 e (UE)
    2021/1388 per quanto riguarda il titolare dell’autorizzazione e il suo rappresentate
    nell’Unione per l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da alcuni organismi geneticamente modificati [notificata con il numero
    C(2022) 1049] (Il testo in lingua neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
