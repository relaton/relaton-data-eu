    οργανισμούς [κοινοποιηθείσα υπό τον αριθμό
    C(2022) 1049] (Το κείμενο στην ολλανδική γλώσσα είναι
    το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/325, 24. veebruar 2022, millega muudetakse
    seoses loa hoidja ja tema esindajaga liidus rakendusotsuseid 2015/698, 2017/2448,
    2017/2452, 2018/1109, 2018/1110, 2019/1304, 2019/1306 ja 2021/1388, millega lubatakse
    lasta turule teatavaid geneetiliselt muundatud organisme sisaldavaid, neist koosnevaid
    või neist valmistatud tooteid (teatavaks tehtud numbri C(2022) 1049 all) (Ainult
    hollandikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/325, annettu 24 päivänä
    helmikuuta 2022, täytäntöönpanopäätösten (EU) 2015/698, (EU) 2017/2448,
    (EU) 2017/2452, (EU) 2018/1109, (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306
    ja (EU) 2021/1388 muuttamisesta siltä osin kuin on kyse tiettyjä muuntogeenisiä
    organismeja sisältävien, niistä koostuvien tai niistä valmistettujen tuotteiden
    markkinoille saattamista koskevan luvan haltijasta ja tämän edustajasta unionissa
    (tiedoksiannettu numerolla C(2022) 1049) (Ainoastaan hollanninkielinen teksti
    on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/325 ón gCoimisiún an 24 Feabhra 2022
    lena leasaítear Cinntí Cur Chun Feidhme 2015/698 2017/2448, 2017/2452, 2018/1109,
    2018/1110, 2019/1304, 2019/1306 agus 2021/1388 a mhéid a bhaineann le sealbhóir
    an údaraithe agus a ionadaí san Aontas maidir le táirgí ina bhfuil orgánaigh
    ghéinmhodhnaithe áirithe, nó atá comhdhéanta díobh, nó a tháirgtear astu,
    a chur ar an margadh (a bhfuil fógra tugtha faoi ina leith C(2022) 1049) (Is
