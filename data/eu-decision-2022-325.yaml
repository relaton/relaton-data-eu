  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/325 оd 24. veljače 2022. o izmjeni
    provedbenih odluka (EU) 2015/698, (EU) 2017/2448, (EU) 2017/2452, (EU) 2018/1109,
    (EU) 2018/1110, (EU) 2019/1304, (EU) 2019/1306 i (EU) 2021/1388 u pogledu nositelja
    odobrenja i njegova zastupnika u Uniji za stavljanje na tržište proizvoda koji
    sadržavaju određene genetski modificirane organizme ili se sastoje ili su proizvedeni
    od njih (priopćeno pod brojem dokumenta C(2022) 1049) (Vjerodostojan je samo
    tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/325 végrehajtási határozata (2022. február 24.)
    az (EU) 2015/698, az (EU) 2017/2448, az (EU) 2017/2452, az (EU) 2018/1109, az
    (EU) 2018/1110, az (EU) 2019/1304, az (EU) 2019/1306 és az (EU) 2021/1388 végrehajtási
    határozatnak a bizonyos géntechnológiával módosított szervezetet tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély jogosultja és uniós képviselője tekintetében történő módosításáról
    (az értesítés a C(2022) 1049. számú dokumentummal történt) (Csak a holland
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/325 della Commissione del 24 febbraio
