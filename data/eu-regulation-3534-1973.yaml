title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3534/73 of the Commission of 27 December 1973 introducing
    subsidies for vinicultural products similar to the vinicultural product exported
    as 'Cyprus sherry' produced in the Community as originally constituted and shipped
    to Ireland and the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3534/73 de la Commission, du 27 décembre 1973, instituant
    des aides pour des produits vinicoles similaires au produit vinicole exporté
    sous la mention "Cyprus Sherry" et produits dans la Communauté dans sa composition
    originaire et expédiés vers l' Irlande et le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3534/73 der Kommission vom 27. Dezember 1973 zur Einführung
    von Beihilfen für Weinbauerzeugnisse, die dem unter der Bezeichnung ,,Cyprus
    Sherry' ' ausgeführten Weinbauerzeugnis gleichartig sind und in der Gemeinschaft
    in ihrer ursprünglichen Zusammensetzung erzeugt und nach Irland und dem Vereinigten
    Königreich ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3534/73 af 27. december 1973 om indførelse
    af støtte til vinprodukter, som svarer til vinprodukter der udføres under betegnelsen
    "Cyprus Sherry", og som er fremstillet inden for Fællesskabet i dets oprindelige
    udstrækning og afsendt til Irland og Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3534/73 della Commissione, del 27 dicembre 1973, che
    istituisce delle sovvenzioni per i prodotti vinicoli simili al prodotto vinicolo
    esportato con la menzione "Cyprus Sherry" prodotti nella Comunità nella sua composizione
    originaria e spediti verso l' Irlanda e la Gran Bretagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3534/73 van de Commissie van 27 december 1973 houdende
    invoering van steun voor in de oorspronkelijke Gemeenschap geproduceerde en naar
    Ierland en het Verenigd Koninkrijk verzonden produkten van dezelfde aard als het
    wijnbouwprodukt dat onder de naam ,,Cyprus Sherry' ' wordt uitgevoerd
  type: main
