title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1485/97 of 29 July 1997 determining the extent
    to which applications lodged in July 1997 for import licences for certain egg
    sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and (EC)
    No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1485/97 DE LA COMMISSION du 29 juillet 1997 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1997 pour certains produits du secteur des oeufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1485/97 DER KOMMISSION vom 29. Juli 1997 über die
    Festsetzung des Umfangs, in dem die im Juli 1997 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1485/97 af 29. juli 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1997 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1485/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Ιουλίου 1997 για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Ιούλιο του 1997 για άδειες
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 1474/95 και (ΕΚ) 1251/96
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1485/97, annettu 29 päivänä heinäkuuta 1997,
    määrättyyn järjestelmään liittyvien heinäkuussa 1997 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontilupahakemusten hyväksyttävyydestä
    asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96 mukaisesti
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1485/97 DELLA COMMISSIONE del 29 luglio 1997 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1997 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1485/97 VAN DE COMMISSIE van 29 juli 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector eieren en slachtpluimvee die in juli 1997
    worden ingediend op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr. 1251/96
  type: main
