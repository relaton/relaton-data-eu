  content: Regulation (EEC) No 2833/72 of the Council of 28 December 1972 opening,
    allocating and providing for the administration of a Community tariff quota for
    cotton yarn, not put up for retail sale, and other woven fabrics of cotton falling
    within subheadings 55.05 and 55.09 of the Common Customs Tariff, coming from Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2833/72 du Conseil, du 28 décembre 1972, portant
    ouverture, répartition et mode de gestion de contingents tarifaires communautaires
    de fils de coton, non conditionnés pour la vente au détail, et d' autres tissus
    de coton, des positions 55.05 et 55.09 du tarif douanier commun, en provenance
    de Turquie
  type: main
- language: de
  script: Latn
