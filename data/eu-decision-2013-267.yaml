  script: Latn
  content: '2013/267/EU: Council Decision of 13 May 2013 on the position to be taken
    on behalf of the European Union at the 65th session of the Marine Environment
    Protection Committee as regards amendments to the Condition Assessment Scheme
    and at the 92nd session of the Maritime Safety Committee as regards amendments
    to the International Safety Management Code as well as amendments to Chapter III
    of the SOLAS Convention and to the High Speed Craft Codes 1994 and 2000 concerning
    enclosed space entry and rescue drills'
  type: main
- language: fr
