    impordi tollimaks ja kehtestatakse nimetatud impordi suhtes registreerimisnõue
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 653/2012, annettu 17 päivänä heinäkuuta 2012
    , lopullisen polkumyyntitullin käyttöönotosta muun muassa Taiwanista peräisin
    olevan tietynlaisen polyeteenitereftalaatin tuonnissa annettuun neuvoston asetukseen
    (EY) N:o 192/2007 liittyvän uuden viejän tarkastelun vireillepanosta, yhden
    kyseisen maan viejän tuotteiden tuontiin sovellettavan tullin kumoamisesta ja
    tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 653/2012 od 17. srpnja 2012. o pokretanju revizije
    „novog izvoznika” prema Uredbi Vijeća (EZ) br. 192/2007 o uvođenju konačne
    antidampinške pristojbe na uvoz određenih polietilentereftalata podrijetlom,
    među ostalim, iz Tajvana, kojom se stavlja izvan snage pristojba s obzirom na
    uvoz od jednog izvoznika iz te zemlje i uvodi evidentiranje tog uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság 653/2012/EU rendelete ( 2012. július 17. ) a többek között
    Tajvanból származó polietilén-tereftalátok behozatalára végleges dömpingellenes
    vámot kivető 192/2007/EK tanácsi rendelet „új exportőr” tekintetében
    történő felülvizsgálatának megindításáról, az ezen ország egyik exportőrétől
    származó behozatalra vonatkozó vám hatályon kívül helyezéséről, valamint
    e behozatal nyilvántartásba vételének kötelezővé tételéről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 653/2012 della Commissione, del 17 luglio 2012 , che
    avvia un riesame in tema di "nuovi esportatori" del regolamento (CE) n. 192/2007
    del Consiglio che istituisce un dazio anti-dumping definitivo sulle importazioni
    di polietilentereftalato (PET) originarie, tra l’altro, di Taiwan, abroga il
    dazio per quanto riguarda le importazioni provenienti da un esportatore di questo
    paese e stabilisce che tali importazioni sono soggette a registrazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 653/2012 ( 2012. gada 17. jūlijs ), ar kuru
    sakarā ar jauniem eksportētājiem sāk pārskatīt Padomes Regulu (EK) Nr. 192/2007,
    ar ko piemēro galīgo antidempinga maksājumu polietilēntereftalāta importam,
    kā izcelsme ir cita starpā Taivānā, un ar kuru atceļ maksājumu par viena
    šīs valsts eksportētāja veiktu importu un nosaka šā importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2012 m. liepos 17 d. Komisijos reglamentas (ES) Nr. 653/2012, kuriuo inicijuojama
    Tarybos reglamento (EB) Nr. 192/2007, nustatančio galutinį antidempingo muitą
    importuojamam, inter alia , Taivano kilmės polietileno tereftalatui, peržiūra
    dėl naujojo eksportuotojo, panaikinamas muitas už vieno šios šalies eksportuotojo
    importuojamą produktą ir nustatoma privaloma šio importuojamo produkto registracija
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 653/2012 tas- 17 ta’ Lulju 2012 li
    jniedi reviżjoni ta’ "esportatur ġdid" tar-Regolament tal-Kunsill (KE) Nru
    192/2007 li jimponi dazju anti-dumping definittiv fuq importazzjonijiet ta’
    ċerti tipi ta’ polyethylene terephthalate li joriġinaw, inter alia, fit-Tajwan,
    li jirrevoka d-dazju fir-rigward tal-importazzjonijiet minn esportatur wieħed
    f’dan il-pajjiż u li jagħmel dawn l-importazzjonijiet suġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 653/2012 van de Commissie van 17 juli 2012 tot opening
    van een nieuw onderzoek ten behoeve van een nieuwe exporteur betreffende Verordening
    (EG) nr. 192/2007 van de Raad tot instelling van een definitief antidumpingrecht
    op polyethyleentereftalaat uit onder meer Taiwan, tot intrekking van het recht
    ten aanzien van een exporteur in dat land en tot registratie van de invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 653/2012 z dnia 17 lipca 2012 r. wszczynające
    przegląd pod kątem „nowego eksportera” rozporządzenia Rady (WE) nr 192/2007
    nakładającego ostateczne cło antydumpingowe na przywóz politereftalanu etylenu
    (PET) pochodzącego między innymi z Tajwanu, uchylające cło w odniesieniu do
    przywozu od jednego eksportera w tym państwie i poddające ten przywóz wymogowi
    rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 653/2012 da Comissão, de 17 de julho de 2012 ,
    que inicia um reexame relativo a um «novo exportador» no âmbito do Regulamento
    (CE) n. ° 192/2007 do Conselho, que institui um direito anti-dumping definitivo
    sobre as importações de poli(tereftalato de etileno) originário, nomeadamente,
    de Taiwan e que revoga o direito sobre as importações de um exportador desse
    país, sujeitando-as a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 653/2012 al Comisiei din 17 iulie 2012 de deschidere
    a unei reexaminări în ceea ce privește un nou exportator a Regulamentului (CE)
    nr. 192/2007 al Consiliului de instituire a unei taxe antidumping definitive la
    importurile de polietilen teraftalat originar, printre altele, din Taiwan, de
    abrogare a taxei cu privire la importurile care provin de la un exportator din
    această țară și de impunere a obligativității de înregistrare a acestor
    importuri
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 653/2012 zo 17. júla 2012 , ktorým sa v
    súvislosti s novým vývozcom začína preskúmanie nariadenia Rady (ES) č.
    192/2007, ktorým sa ukladá konečné antidumpingové clo na dovoz polyetyléntereftalátu
    s pôvodom okrem iného na Taiwane, zrušuje sa clo na dovoz od jedného vývozcu
    z tejto krajiny a stanovuje sa povinnosť registrácie tohto dovozu
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 653/2012 z dne 17. julija 2012 o začetku pregleda
    v zvezi z novim izvoznikom Uredbe Sveta (ES) št. 192/2007 o uvedbi dokončne
    protidampinške dajatve na uvoz polietilen tereftalata s poreklom, med drugim,
    s Tajvana, odpravi dajatev na uvoz od enega izvoznika iz te države in uvedbi
    registracije takšnega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 653/2012 de la Comisión, de 17 de julio de 2012 ,
    por el que se inicia la reconsideración, en relación con un «nuevo exportador»
    , del Reglamento (CE) n ° 192/2007 del Consejo, por el que se establece un derecho
    antidumping definitivo sobre las importaciones de determinado politereftalato
    de etileno originario, entre otros países, de Taiwán, y por el que se deroga
    el derecho aplicable a las importaciones de un exportador de ese país y se someten
    a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 653/2012 av den 17 juli 2012 om inledande
    av en översyn, avseende en ny exportör, av rådets förordning (EG) nr 192/2007
    om införande av en slutgiltig antidumpningstull på import av visst slags polyetentereftalat
    med ursprung i bland annat Taiwan, samt om upphävande av tullen på import från
    en exportör i det landet och om registrering av denna import
  type: main
