  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 653/2012, 17. juuli 2012 , millega algatatakse
    nõukogu määruse (EÜ) nr 192/2007 (millega kehtestatakse lõplik dumpinguvastane
    tollimaks muu hulgas Taiwanilt pärit polüetüleentereflataadi impordi suhtes)
