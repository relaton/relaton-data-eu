title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 653/2012 of 17 July 2012 initiating a 'new
    exporter' review of Council Regulation (EC) No 192/2007 imposing a definitive
    anti-dumping duty on imports of polyethylene terephthalate originating, inter
    alia, in Taiwan, repealing the duty with regard to imports from one exporter in
    this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 653/2012 de la Commission du 17 juillet 2012 portant
    ouverture d’un réexamen au titre de «nouvel exportateur» du règlement (CE)
    n ° 192/2007 du Conseil instituant un droit antidumping définitif sur les importations
    de certains types de polyéthylène téréphtalate originaires, entre autres,
    de Taïwan, abrogeant le droit en ce qui concerne les produits d’un exportateur
    de ce pays et soumettant les importations de ces produits à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 653/2012 der Kommission vom 17. Juli 2012 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 192/2007 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Polyethylenterephthalat
    mit Ursprung unter anderem in Taiwan (Überprüfung für einen neuen Ausführer),
    zur Außerkraftsetzung des Zolls auf die Einfuhren der Ware von einem Ausführer
    in diesem Land und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 653/2012 на Комисията от 17
    юли 2012 година за образуване на процедура по
    преразглеждане във връзка с „нов износител“
    на Регламент (ЕО) № 192/2007 на Съвета за налагане
    на окончателно антидъмпингово мито върху вноса
    на полиетилен терефталат с произход, inter alia
    , от Тайван, за отмяна на митото по отношение
    на вноса от един износител от тази държава
    и за подлагането на този внос на регистриране
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 653/2012 ze dne 17. července 2012 , kterým
    se zahajuje přezkum, pro „nového vývozce“ , nařízení Rady (ES) č. 192/2007
    týkajícího se uložení konečného antidumpingového cla na dovoz polyethylentereftalátů
    pocházejících mimo jiné z Tchaj-wanu, zrušuje clo z dovozu od jednoho vývozce
    z této země a zavádí celní evidence tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 653/2012 af 17. juli 2012 om indledning
    af en fornyet undersøgelse ( "ny eksportør" ) af Rådets forordning (EF) nr.
    192/2007 om indførelse af en endelig antidumpingtold på import af visse typer
    polyethylenterephthalat med oprindelse i bl.a. Taiwan, om ophævelse af tolden
    for så vidt angår importen fra en eksportør i dette land og om at gøre denne
    import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 653/2012 της Επιτροπής,
