title:
- language: en
  script: Latn
  content: '83/355/EEC: Commission Decision of 6 July 1983 authorizing certain Member
    States provisionally to provide for derogations from certain provisions of Council
    Directive 77/93/EEC, in respect of plants of Pinus L. originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '83/355/CEE: Décision de la Commission du 6 juillet 1983 autorisant certains
    États membres à prévoir provisoirement des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour les végétaux de "Pinus L." originaires
    du Japon'
  type: main
- language: de
  script: Latn
  content: '83/355/EWG: Entscheidung der Kommission vom 6. Juli 1983 zur einstweiligen
    Ermächtigung bestimmter Mitgliedstaaten, für Pflanzen von Pinus L. mit Ursprung
    in Japan Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates
    vorzusehen'
  type: main
- language: da
  script: Latn
  content: '83/355/EØF: Kommissionens beslutning af 6. juli 1983 om midlertidig bemyndigelse
    af visse medlemsstater til at undtage planter af Pinus L. med oprindelse i Japan
    fra visse bestemmelser i Rådets direktiv 77/93/EØF'
  type: main
- language: el
  script: Grek
  content: '83/355/ΕΟΚ: Απόφαση της Επιτροπής της 6ης Ιουλίου
    1983 που επιτρέπει προσωρινά σε ορισμένα Κράτη
    μέλη να προβλέπουν παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου,
    όσον αφορά τα φυτά του Pinus L. καταγωγής Ιαπωνίας'
  type: main
- language: it
  script: Latn
  content: '83/355/CEE: Decisione della Commissione del 6 luglio 1983 che autorizza
    alcuni Stati membri a derogare provvisoriamente a determinate disposizioni della
    direttiva 77/93/CEE del Consiglio per quanto riguarda i vegetali di Pinus L. originari
    del Giappone'
  type: main
- language: nl
  script: Latn
  content: '83/355/EEG: Beschikking van de Commissie van 6 juli 1983 houdende machtiging
    voor een aantal Lid-Staten om voorlopig afwijkingen toe te staan van sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad ten aanzien van planten van Pinus L. van oorsprong
    uit Japan'
  type: main
- language: es
  script: Latn
  content: '83/355/CEE: Decisión de la Comisión, de 6 de julio de 1983, que autoriza
    a determinados Estados miembros a establecer provisionalmente excepciones a ciertas
    disposiciones de la Directiva 77/93/CEE del Consejo en lo referente a vegetales
    de Pinus L. procedentes de Japón'
  type: main
