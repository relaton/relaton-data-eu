title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1018/91 of 24 April 1991 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for processing within the Community and repealing
    Regulation (EEC) No 399/91
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CEE) No 1018/91 DE LA COMMISSION du 24 avril 1991 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) no 2539/84,
    de viandes bovines détenues par certains organismes d' intervention en vue de
    leur transformation dans la Communauté et abrogeant le règlement (CEE) no 399/91
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1018/91 DER KOMMISSION vom 24. April 1991 über den
    Verkauf von Rindfleisch, das zur Verarbeitung in der Gemeinschaft bestimmt ist,
    aus Beständen einiger Interventionsstellen nach dem Verfahren der Verordnung
    (EWG) Nr. 2539/84 und zur Aufhebung der Verordnung (EWG) Nr. 399/91 #DIE KOMMISSION
    DER EUROPÄISCHEN #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1018/91 af 24. april 1991 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 399/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1018/91 της Επιτροπής
    της 24ης Απριλίου 1991 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που κατέχεται
    από ορισμένους οργανισμούς παρεμβάσεως και
    προορίζεται για μεταποίηση στην Κοινότητα
    και για την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    399/91
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1018/91 DELLA COMMISSIONE del 24 aprile 1991 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d' intervento e destinate alla trasformazione
    nella Comunità e recante abrogazione del regolamento (CEE) n. 399/91
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1018/91 VAN DE COMMISSIE van 24 april 1991 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor verwerking in de Gemeenschap
    bestemd rundvlees en houdende intrekking van Verordening (EEG) nr. 399/91
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1018/91 DA COMISSAO, DE 24 DE ABRIL DE 1991, RELATIVO
    A VENDA, NO AMBITO DO PROCEDIMENTO DEFINIDO NO REGULAMENTO ( CEE ) NO 2539/84,
    DE CARNE DE BOVINO DETIDA POR CERTOS ORGANISMOS DE INTERVENCAO COM VISTA A SUA
    TRANSFORMACAO NA COMUNIDADE, E QUE REVOGA O REGULAMENTO ( CEE ) NO 399/91
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 1018/91 DE LA COMISIÓN de 24 de abril de 1991 relativo
