title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2962/84 of 23 October 1984 re-establishing
    the levying of customs duties on articles of apparel and clothing accessories,
    falling within subheading 39.07 B V ex d) and originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3569/83
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2962/84 de la Commission du 23 octobre 1984 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement, de la sous-position 39.07 B V ex d) du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2962/84 der Kommission vom 23. Oktober 1984 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör der Tarifstelle
    39.07 B V ex d) mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr.
    3569/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2962/84 af 23. oktober 1984 om genindførelse
    af opkrævning af told for beklædningsgenstande og tilbehør dertil, henhørende
    under pos. 39.07 B V ex d) og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2962/84 της Επιτροπής
    της 23ης Οκτωβρίου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ενδύματα και εξαρτήματα
    ενδυμάτων, της διακρίσεως 39.07 Β V ex δ) του Κοινού
    Δασμολογίου, καταγωγής Χονγκ Κονγκ, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2962/84 della Commissione del 23 ottobre 1984 che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti da vestiario
    ed accessori per oggetti da vestiario, della sottovoce 39.07 B V ex d), della
    tariffa doganale comune, originari di Hong Kong beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2962/84 van de Commissie van 23 oktober 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding en
    kledingtoebehoren van postonderverdeling 39.07 B V ex d), van oorsprong uit Hong-Kong,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
