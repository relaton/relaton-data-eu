title:
- language: en
  script: Latn
  content: '79/763/EEC: Commission Decision of 22 August 1979 authorizing Ireland
    not to apply Community treatment to under garments, knitted or crocheted, not
    elastic or rubberized ; men''s and boys''pyjamas, of cotton or of man-made textile
    fibres; women''s, girls''and infants''(other than babies'') knitted or crocheted
    pyjamas and nightdresses, of cotton or of man-made textile fibres, falling within
    subheading ex 60.04 B IV of the Common Customs Tariff (NIMEXE codes 60.04-47,
    51, 53, 73, 81, 83) (categories 24 and 25), originating in Hong Kong and in free
    circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/763/CEE: Décision de la Commission, du 22 août 1979, autorisant l''Irlande
    à exclure du traitement communautaire les sous-vétements de bonneterie non élastique
    ni caoutchoutée : pyjamas de bonneterie, de coton ou de fibres textiles synthétiques,
    pour hommes et garçonnets, pyjamas et chemises de nuit de bonneterie, de coton
    ou de fibres textiles synthétiques, pour femmes, fillettes et jeunes enfants
    (autres que bébés), de la sous-position ex 60.04 B IV du tarif douanier commun
    (codes Nimexe : 60.04-47, 51, 53, 73, 81, 83) (catégories 24 et 25), originaires
    de Hong-kong et mis en libre pratique dans les autres Etats membres (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/763/EWG: Entscheidung der Kommission vom 22. August 1979, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Unterkleidung aus Gewirken aus Baumwolle oder aus synthetischen
    Spinnstoffen für Männer und Knaben; Schlafanzüge und Nachthemden aus Gewirken,
    aus Baumwolle oder aus synthetischen Spinnstoffen für Frauen, Mädchen und Kleinkinder
    (ausgenommen Säuglinge), der Tarifstelle ex 60.04 B IV des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 60.04-47 ; 51 ; 53 ; 73 ; 81 ; 83), Kategorie 24/25, von der
    Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/763/EØF: Kommissionens beslutning af 22. august 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage underbeklædningsgenstande
    af trikotage, ikke elastisk eller gummeret : pyjamas af trikotage, bomuld eller
    syntetiske fibre, til mænd og drenge ; pyjamas og natskjorter af trikotage, bomuld
    eller kemofibre til kvinder, piger og småbørn (undtagen spædbørn), som henhører
    under pos. ex 60.04 B IV i den fælles toldtarif (NIMEXE-nummer 60.04-47, 51,
    53, 73, 81, 83 ; kategori 24/25), har oprindelse i Hongkong og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/763/CEE: Decisione della Commissione, del 22 agosto 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le sottovesti a maglia non
    elastica né gommata [pigiami a maglia, di cotone o di fibre tessili sintetiche,
    per uomo e per ragazzo, e pigiami e camicie da notte, a maglia, di cotone o di
    fibre tessili sintetiche, per donna, per ragazza e per bambini, diversi dai bambini
    piccoli (bébés)], della sottovoce ex 60.04 B IV della tariffa doganale comune
    (codici Nimexe: 60.04-47, 51, 53, 73, 81, 83), categorie 24 e 25, originarie di
    Hong Kong e messe in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/763/EEG: Beschikking van de Commissie van 22 augustus 1979 waarbij
    Ierland wordt gemachtigd onderkleding van niet-elastisch of van niet-gegummeerd
    brei- of haakwerk: pyjama''s van brei- of haakwerk, van katoen of van synthetische
    textielvezels, voor heren en jongens; pyjama''s en nachthemden voor dames, meisjes
    en kinderen (andere dan die voor baby''s), van brei- of haakwerk, van katoen of
    van synthetische vezels, van post ex 60.04 B IV van het gemeenschappelijk douanetarief
    (NIMEXE-code 60.04-47, 51, 53, 73, 81, 83) (categorie 24/25), van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
