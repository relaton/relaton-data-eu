title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1974/97 of 7 October 1997 amending, for the
    fifth time, Regulation (EC) No 390/97 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1997 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1974/97 du Conseil du 7 octobre 1997 modifiant, pour
    la cinquième fois, le règlement (CE) nº 390/97 fixant, pour certains stocks
    et groupes de stocks de poissons, les totaux admissibles des captures pour 1997
    et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1974/97 des Rates vom 7. Oktober 1997 zur fünften
    Änderung der Verordnung (EG) Nr. 390/97 zur Festlegung der zulässigen Gesamtfangmengen
    und entsprechender Fangbedingungen für bestimmte Fischbestände oder -bestandsgruppen
    (1997)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1974/97 af 7. oktober 1997 om femte ændring
    af forordning (EF) nr. 390/97 om fastsættelse for 1997 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1974/97 του Συμβουλίου
    της 7ης Οκτωβρίου 1997 για την τροποποίηση για
    πέμπτη φορά του κανονισμού (ΕΚ) αριθ. 390/97, περί
    καθορισμού, για ορισμένα αποθέματα ιχθύων
    και ομάδες αποθεμάτων ιχθύων, των συνολικών
    επιτρεπομένων αλιευμάτων (TAC) για το 1997, καθώς
    και ορισμένων όρων υπό τους οποίους είναι δυνατόν
    να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1974/97, annettu 7 päivänä lokakuuta 1997,
    tiettyjen kalakantojen ja kalakantaryhmien osalta vuodeksi 1997 vahvistettavista
    suurimmista sallituista saaliista ja niiden pyyntiä koskevista tietyistä edellytyksistä
    annetun neuvoston asetuksen (EY) N:o 390/97 muuttamisesta viidennen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1974/97 del Consiglio del 7 ottobre 1997 recante quinta
    modifica del regolamento (CE) n. 390/97 che stabilisce, per alcuni stock o gruppi
    di stock ittici, il totale ammissibile di catture per il 1997 e talune condizioni
    cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1974/97 van de Raad van 7 oktober 1997 houdende vijfde
    wijziging van Verordening (EG) nr. 390/97 inzake de vaststelling van de voor 1997
    geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden,
    alsmede bepaalde bij de visserij in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1974/97 do Conselho de 7 de Outubro de 1997 que altera
    pela quinta vez o Regulamento (CE) nº 390/97 que fixa os totais admissíveis
    de capturas para 1997 e certas condições em que podem ser pescadas determinadas
    unidades populacionais ou grupos de unidades populacionais de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1974/97 del Consejo de 7 de octubre de 1997 que modifica,
    por quinta vez, el Reglamento (CE) nº 390/97 por el que se fijan los totales
    admisibles de capturas (TAC) de determinadas poblaciones y grupos de poblaciones
    de peces para 1997 y determinadas condiciones en que pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1974/97 av den 7 oktober 1997 om ändring för
    femte gången av förordning (EG) nr 390/97 om fastställande, för vissa fiskbestånd
    och grupper av fiskbestånd, av totala tillåtna fångstmängder för år 1997
    och av vissa villkor för fångsten
  type: main
