    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 100 (numéro d'ordre 40.1000) originaires de Chine, d'Inde et
    de Malaysia, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
