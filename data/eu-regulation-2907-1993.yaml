    Ursprung in China, Indien und Malaysia, für die die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2907/93 af 20. oktober 1993 om genindførelse
