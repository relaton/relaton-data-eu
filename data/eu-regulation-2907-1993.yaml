  script: Latn
  content: COMMISSION REGULATION (EEC) No 2907/93 of 20 October 1993 re-establishing
    the levying of customs duties on products of category 100 (order No 40.1000),
    originating in China, India and Malaysia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
