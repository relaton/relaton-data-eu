title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 976/2002 of 4 June 2002 imposing a definitive
    anti-dumping duty on imports of certain ring binder mechanisms (RBM) originating
    in Indonesia and terminating the anti-dumping proceeding in respect of imports
    of certain RBM originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 976/2002 du Conseil du 4 juin 2002 instituant un droit
    antidumping définitif sur les importations de certains mécanismes pour reliure
    à anneaux originaires d'Indonésie et clôturant la procédure antidumping concernant
    les importations de certains mécanismes pour reliure à anneaux originaires de
    l'Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 976/2002 des Rates vom 4. Juni 2002 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter Ringbuchmechaniken
    (RBM) mit Ursprung in Indonesien und zur Einstellung des Antidumpingverfahrens
    betreffend die Einfuhren bestimmter RBM mit Ursprung in Indien
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 976/2002 на Съвета от 4 юни
