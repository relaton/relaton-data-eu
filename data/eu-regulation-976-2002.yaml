    anti-dumping relativo às importações de certos mecanismos de argolas para encadernação
    originários da Índia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 976/2002 al Consiliului din 4 iunie 2002 de instituire
    a unui drept antidumping definitiv privind importurile anumitor mecanisme de îndosariat
    cu inele originare din Indonezia și de încheiere a procedurii antidumping privind
    importurile anumitor mecanisme de îndosariat cu inele originare din India
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 976/2002 zo 4. júna 2002, ktorým sa ukladá
