title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1765/74 of the Commission of 8 July 1974 amending Regulation
    (EEC) No 1493/71 as regards the calculation of price increases and reductions
    applicable to intervention in durum wheat, barley, maize and rye
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1765/74 de la Commission, du 8 juillet 1974, modifiant
    le règlement (CEE) n° 1493/71 en ce qui concerne le calcul des bonifications
    et réfactions à appliquer au prix du froment dur, de l' orge, du maïs et du
    seigle lors de la prise en charge à l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1765/74 der Kommission vom 8. Juli 1974 zur Änderung
    der Verordnung (EWG) Nr. 1493/71 bezüglich der Berechnung der bei der Intervention
    auf den Preis von Hartweizen, von Gerste, von Mais und von Roggen anzuwendenden
    Zu- und Abschläge
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1765/74 af 8. juli 1974 om ændring
    af forordning (EØF) nr. 1493/71 for så vidt angår beregningen af tillæg og
    fradrag i prisen på hård hvede, byg, majs og rug i forbindelse med overtagelse
    ved intervention
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1765/74 della Commissione, dell' 8 luglio 1974, che
    modifica il regolamento (CEE) n. 1493/71 per quanto riguarda il calcolo delle
    maggiorazioni e detrazioni applicabili al prezzo del frumento duro, dell' orzo,
    del granturco e della segala all' atto della presa in consegna all' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1765/74 van de Commissie van 8 juli 1974 houdende
    wijziging van Verordening (EEG) nr. 1493/71 voor wat betreft de berekening van
    de bij overneming in interventie op de prijs van harde tarwe, rogge, maais en
    gerst toe te passen toeslagen en kortingen
