title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1618/90 of 15 June 1990 fixing the number
    of young male bovine animals which may be imported on special terms in the first,
    second and third quarters of 1990, amending Regulation (EEC) No 2377/80 and derogating
    therefrom in respect of those quarters as regards the issue of import licences
    and their term of validity
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1618/90 de la Commission du 15 juin 1990 relatif à
    la fixation de la quantité de jeunes bovins mâles pouvant être importés à
    des conditions spéciales pour les premier, deuxième et troisième trimestres
    de 1990, portant dérogation, pour ces trimestres, au règlement (CEE) n° 2377/80
    en ce qui concerne la délivrance des certificats d'importation et leur durée
    de validité, et modifiant le règlement (CEE) n 2377/80
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1618/90 DER KOMMISSION vom 15. Juni 1990 zur Festsetzung
    der Stueckzahl maennlicher Jungrinder, die im ersten, zweiten und dritten Vierteljahr
    1990 unter Sonderbedingungen eingefuehrt werden koennen, zur Abweichung von der
    Verordnung (EWG) Nr. 2377/80 hinsichtlich der Erteilung von Einfuhrlizenzen und
    ihrer Gueltigkeitsdauer und zur Aenderung der Verordnung (EWG) Nr. 2377/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1618/90 af 15. juni 1990 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i første,
    andet og tredje kvartal af 1990, om undtagelse for disse kvartaler fra forordning
    (EØF) nr. 2377/80 for så vidt angår udstedelse af importlicenser og disses
    gyldighedsperiode og om ændring af forordning (EØF) nr. 2377/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1618/90 της Επιτροπής
    της 15ης Ιουνίου 1990 για τον καθορισμό των ποσοτήτων
    των νεαρών αρρένων βοοειδών που είναι δυνατό
    να εισαχθούν με ειδικούς όρους κατά το πρώτο,
    δεύτερο και τρίτο τρίμηνο του 1990 για παρέκκλιση,
    για τα τρίμηνα αυτά, από τον κανονισμό (ΕΟΚ)
    αριθ. 2377/80 όσον αφορά την έκδοση των πιστοποιητικών
    εισαγωγής και τη διάρκεια ισχύος τους και για
    την τροποποίηση του κανονισμού (ΕΟΚ) αριθ. 2377/80
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1618/90, annettu 15 päivänä kesäkuuta 1990,
    vuoden 1990 ensimmäisellä, toisella ja kolmannella neljänneksellä erityisedellytyksin
    tuotavien nuorten urospuolisten nautojen määrän vahvistamisesta, asetuksesta
    2377/80 poikkeamisesta kyseisten vuosineljännesten ajaksi tuontitodistusten myöntämisen
    ja niiden voimassaoloajan osalta sekä asetuksen (ETY) N:o 2377/80 muuttamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1618/90 DELLA COMMISSIONE del 15 giugno 1990 che fissa
    il numero di giovani bovini maschi che possono essere importati a condizioni speciali
    nei primi tre trimestri del 1990, che modifica il regolamento (CEE) n. 2377/80
    e vi deroga, per detto periodo, in ordine al rilascio dei titoli di importazione
    e alla loro validità
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1618/90 VAN DE COMMISSIE van 15 juni 1990 tot vaststelling
    van het aantal jonge mannelijke runderen dat in het eerste, tweede en derde kwartaal
    van 1990 onder bijzondere voorwaarden mag worden ingevoerd, houdende afwijking
    van Verordening (EEG) nr. 2377/80 ten aanzien van de afgifte van invoercertificaten
    en de looptijd ervan, en tot wijziging van Verordening (EEG) nr. 2377/80
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1618/90 DA COMISSAO de 15 de Junho de 1990 relativo
    à fixaçao da quantidade de vitelos machos que podem ser importados em condiçoes
    especiais durante os primeiro, segundo e terceiro trimestres de 1990, que derroga,
    no que diz respeito aos referidos trimestres, o Regulamento (CEE) n* 2377/80 quanto
    à emissao dos certificados de importaçao e respectivo prazo de validade, e que
    altera o Regulamento (CEE) n* 2377/80
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1618/90 DE LA COMISION de 15 de junio de 1990 relativo
    a la fijacion de la cantidad de machos jovenes de la especie bovina que pueden
    importarse en condiciones en el primer, segundo y tercer trimestres de 1990, por
    el que se establece una excepcion durante estos trimestres, del Reglamento (CEE)
    no 2377/80 en lo relativo a la expedicion de los certificados de importacion y
    su periodo de validez, y por el que se modifica el Reglamento (CEE) no 2377/80
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 1618/90 av den 15 juni 1990 om fastställande
    av antalet unga handjur av nötkreatur som får importeras på särskilda villkor
    under första, andra och tredje kvartalet 1990, om ändring av förordning (EEG)
    nr 2377/80 och om undantag från den förordningen för dessa kvartal vad gäller
    utfärdande av importlicenser och deras giltighetstid
  type: main
