    San Pedro y Miquelón, la Decisión 79/542/CEE del Consejo por la que se confecciona
    una lista de terceros países desde los cuales los Estados miembros autorizan
    importaciones de animales de las especies bovina, porcina, ovina y caprina, de
    équidos, de carnes frescas y de productos a base de carne (Texto pertinente a
    efectos del EEE) [notificada con el número C(2001) 3080]'
  type: main
