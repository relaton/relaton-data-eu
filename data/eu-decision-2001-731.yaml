title:
- language: en
  script: Latn
  content: '2001/731/EC: Commission Decision of 16 October 2001 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorise
    imports of bovine animals, swine, equidae, sheep and goats, fresh meat and meat
    products, in particular in relation to New Caledonia and the Islands of St Pierre
    and Miquelon (Text with EEA relevance) (notified under document number C(2001)
    3080)'
  type: main
- language: fr
  script: Latn
  content: '2001/731/CE: Décision de la Commission du 16 octobre 2001 modifiant la
    décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les États membres autorisent l''importation d''animaux des espèces
    bovine, porcine, équine, ovine et caprine ainsi que de viandes fraîches et de
    produits carnés, notamment en ce qui concerne la Nouvelle-Calédonie et les îles
    de Saint-Pierre-et-Miquelon (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2001) 3080]'
  type: main
- language: de
  script: Latn
  content: '2001/731/EG: Entscheidung der Kommission vom 16. Oktober 2001 zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung einer Liste der Drittländer,
    aus denen die Mitgliedstaaten Einfuhren von Rindern, Schweinen, Einhufern, Schafen
    und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen zulassen, insbesondere
    hinsichtlich von Neukaledonien sowie der Inseln St. Pierre und Miquelon (Text
    von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 3080)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 16 октомври 2001 година
    за изменение на Решение 79/542/ЕИО на Съвета относно
    съставянето на списък на трети страни, от които
    държавите-членки разрешават вноса на животни
    от рода на едрия рогат добитък, свине, еднокопитни
    животни, овце и кози, прясно месо и месни продукти,
    и по-специално по отношение на Нова Каледония
    и островите Сен Пиер и Микелон (нотифицирано
    под номер С(2001) 3080)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 16. října 2001, kterým se mění rozhodnutí
    Rady 79/542/EHS, kterým se stanoví seznam třetích zemí, z nichž členské
    státy povolují dovoz skotu, prasat, koňovitých, ovcí a koz, čerstvého masa
    a masných výrobků, zejména pokud jde o Novou Kaledonii a ostrovy St. Pierre
    a Miquelon (oznámeno pod číslem K(2001) 3080)
  type: main
