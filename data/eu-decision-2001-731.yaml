  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 16 października 2001 r. zmieniająca decyzję Rady
    79/542/EWG ustalającą wykaz państw trzecich, z których Państwa Członkowskie
    dopuszczają przywóz bydła, trzody chlewnej oraz świeżego mięsa, w szczególności
    w odniesieniu do Nowej Kaledonii oraz wysp St. Pierre i Miquelon (notyfikowana
    jako dokument nr C(2001) 3080)
  type: main
- language: pt
  script: Latn
  content: '2001/731/CE: Decisão da Comissão, de 16 de Outubro de 2001, que altera
    a Decisão 79/542/CEE do Conselho, que estabelece uma lista de países terceiros
    a partir dos quais os Estados-Membros autorizam a importação de bovinos, suínos,
    equídeos, ovinos e caprinos, carne fresca e produtos à base de carne, em especial
    no que respeita à Nova Caledónia e às ilhas de St. Pierre e Miquelon (Texto
    relevante para efeitos do EEE) [notificada com o número C(2001) 3080]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 16 octombrie 2001 de modificare a Deciziei 79/542/CEE
    a Consiliului privind întocmirea listei țărilor terțe din care statele membre
    autorizează importurile de bovine, porcine, ecvidee, ovine și caprine, carne
    proaspătă și produse din carne, în special în ceea ce privește Noua Caledonie
    și Insulele St. Pierre și Miquelon [notificată cu numărul C(2001) 3080]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 16. októbra 2001, ktorým sa mení a dopĺňa rozhodnutie
    Rady 79/542/EHS, ktoré vypracováva zoznam tretích krajín, z ktorých členské
    štáty schvaľujú dovoz hovädzieho dobytka, ošípaných, domácich nepárnokopytníkov,
    oviec a kôz, čerstvého mäsa a mäsových výrobkov, najmä vo vzťahu k Novej
    Kaledónii a ostrovov Saint Pierre a Miquelon (oznámené pod číslom dokumentu
    C(2001) 3080)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 16. oktobra 2001 o spremembi Odločbe Sveta 79/542/EGS
    o seznamu tretjih držav, iz katerih države članice odobrijo uvoz goveda, prašičev,
    kopitarjev, ovac in koz, svežega mesa in mesnih izdelkov, zlasti v zvezi z Novo
    Kaledonijo in otokov Saint Pierre in Miquelon (notificirano pod dokumentarno številko
    K(2001) 3080)
  type: main
- language: es
  script: Latn
  content: '2001/731/CE: Decisión de la Comisión, de 16 de octubre de 2001, que
