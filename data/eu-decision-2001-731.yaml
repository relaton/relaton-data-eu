    behozatalára feljogosított harmadik országok jegyzékének megállapításáról
    szóló 79/542/EGK tanácsi határozatnak különösen Új-Kaledónia, valamint
    St. Pierre és Miquelon szigete tekintetében történő módosításáról (az
    értesítés a C(2001) 3080. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2001/731/CE: Decisione della Commissione, del 16 ottobre 2001, che modifica
    la decisione 79/542/CEE del Consiglio recante l''elenco dei paesi terzi da cui
    gli Stati membri autorizzano l''importazione di animali delle specie bovina, suina,
    ovina e caprina, di equidi nonché di carni fresche e di prodotti a base di carne,
    relativamente alla Nuova Caledonia e alle isole Saint-Pierre e Miquelon (Testo
    rilevante ai fini del SEE) [notificata con il numero C(2001) 3080]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 16. oktobris), ar ko groza Padomes Lēmumu
    79/542/EEK, ar kuru nosaka to trešo valstu sarakstu, no kurām dalībvalstis
    atļauj liellopu, cūku, zirgu dzimtas dzīvnieku, aitu un kazu, svaigas gaļas
    un gaļas produktu ievedumus, konkrēti attiecībā uz Jaunkaledoniju, Senpjēras
    un Mikelonas salām (izziņots ar dokumenta numuru C(2001) 3080)
  type: main
- language: lt
  script: Latn
  content: 2001 m. spalio 16 d. Komisijos sprendimas, iš dalies keičiantis Tarybos
    sprendimą 79/542/EEB dėl trečiųjų šalių, iš kurių valstybės narės leidžia
    importuoti galvijus, kiaules, arklinių šeimos gyvūnus, avis ir ožkas, šviežią
    mėsą ir mėsos produktus, sąrašo sudarymo, ypač dėl Naujosios Kaledonijos
    ir Sent Pjero ir Mikelono (pranešta dokumentu Nr. C(2001) 3080)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-16 ta’ Ottubru 2001 li temenda d-Deċiżjoni
    tal-Kunsill 79/542/KEE li tfassal lista ta’ pajjiżi terzi li minnhom l-Istati
    Membri jistgħu jawtorizzaw l-importazzjoni tal-bhejjem tal-fart, il-ħnieżer,
    l-ekwidi, in-nagħaġ u l-mogħoż, il-laħam frisk u l-prodotti mil-laħam, b’mod
    partikolari fejn għandhom x’jaqsmu n-New Caledonia u l-Gżejjer ta’ St Pierre
    u Miquelon (innotifikata fid-dokument bin-numru K (2001) 3080)
  type: main
- language: nl
  script: Latn
  content: '2001/731/EG: Beschikking van de Commissie van 16 oktober 2001 houdende
    wĳziging van Beschikking 79/542/EEG van de Raad tot vaststelling van een lĳst
    van derde landen waaruit de lidstaten de invoer van runderen, varkens, paardachtigen,
