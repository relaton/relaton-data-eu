  script: Latn
  content: '2001/731/EZ: Odluka Komisije od 16. listopada 2001. o izmjeni Odluke Vijeća
    79/542/EEZ o sastavljanju popisa trećih država iz kojih države članice odobravaju
    uvoz goveda, svinja, kopitara, ovaca i koza, svježeg mesa i mesnih proizvoda,
