title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2786/91 of 23 September 1991 re-establishing
    the levying of customs duties on products falling within CN code 8516 50 00, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2786/91 DE LA COMMISSION du 23 septembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 8516 50 00, originaires de la Thaïlande, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2786/91 DER KOMMISSION vom 23. September 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 8516 50
    00 mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2786/91 af 23. september 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 8516 50 00 og med oprindelse
    i Thailand, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2786/91 της Επιτροπής
    της 23ης Σεπτεμβρίου 1991 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 8516 50 00, καταγωγής Ταϊλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2786/91 DELLA COMMISSIONE del 23 settembre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 8516 50 00 originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2786/91 VAN DE COMMISSIE van 23 september 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 8516 50 00, van oorsprong uit Thailand, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2786/91 DA COMISSÃO de 23 de Setembro de 1991 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos produtos do código
    NC 8516 50 00, originários da Tailândia, beneficiários das preferências pautais
    previstas pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2786/91 DE LA COMISIÓN de 23 de septiembre de 1991
