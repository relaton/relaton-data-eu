    lentus (DSM 28088) als Zusatzstoff in Futtermitteln für Masthühner, Junghennen
    und Geflügelarten von geringerer wirtschaftlicher Bedeutung außer Legegeflügel,
    Masttruthühner, Zuchttruthühner, Absetzferkel, Mastschweine und Schweinearten
    von geringerer wirtschaftlicher Bedeutung (Zulassungsinhaber: Elanco GmbH)'
  type: main
