title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/1565 of 17 October 2018 concerning
    the authorisation of a preparation of endo-1,4-beta-mannanase produced by Paenibacillus
    lentus (DSM 28088) as a feed additive for chickens for fattening, chickens reared
    for laying and minor poultry species other than laying birds, turkeys for fattening,
    turkeys reared for breeding, weaned piglets, pigs for fattening and minor porcine
    species (holder of authorisation Elanco GmbH)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2018/1565 de la Commission du 17 octobre
    2018 concernant l''autorisation d''une préparation d''endo-1,4-bêta-mannanase
    produite par Paenibacillus lentus (DSM 28088) en tant qu''additif pour l''alimentation
    des poulets d''engraissement, des poulettes élevées pour la ponte et des espèces
    mineures de volailles autres que les volailles de ponte, des dindes d''engraissement,
    des dindes élevées pour la reproduction, des porcelets sevrés, des porcs d''engraissement
    et des espèces porcines mineures (titulaire de l''autorisation: Elanco GmbH)'
  type: main
