title:
- language: fr
  script: Latn
  content: Décision 65/279/CEE de la Commission, du 14 mai 1965, relative au recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire "les sacs et sachets d'emballage en tissus de jute
    autres que usagés", originaires de l'Inde et de la Pologne et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/279/EWG: Entscheidung der Kommission vom 14. Mai 1965 über den Antrag
    der Französischen Republik gemäß Artikel 115 Absatz (1) des Vertrages, um aus
    Indien und Polen stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche "Säcke und Beutel zu Verpackungszwecken aus Jutegeweben", andere
    als gebrauchte, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/279/CEE: Decisione della Commissione, del 14 maggio 1965, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario i sacchi e sacchetti da imballaggio
    di tessuti di juta, esclusi quelli usati, originari dell''India e della Polonia
    ed immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/279/EEG: Beschikking van de Commissie van 14 mei 1965 betreffende hel
    verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea, van
    het Verdrag zakken voor verpakkingsdoeleinden, van juteweefsel, anders dan gebruikte,
    die van oorsprong zijn uit India en Polen en in de andere Lid-Staten in het vrije
    verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
