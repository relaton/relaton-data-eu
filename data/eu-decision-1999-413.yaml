title:
- language: en
  script: Latn
  content: '1999/413/EC: Commission Decision of 15 June 1999 amending Decision 98/657/EC
    adopting the plan allocating to the Member States resources to be charged to the
    1999 budget year for the supply of food from intervention stocks for the benefit
    of the most deprived persons in the Community (notified under document number
    C(1999) 1625)'
  type: main
- language: fr
  script: Latn
  content: '1999/413/CE: Décision de la Commission, du 15 juin 1999, modifiant la
    décision 98/657/CE adoptant le plan portant attribution aux États membres de
    ressources imputables à l''exercice 1999 pour l''exécution des fournitures de
    denrées alimentaires provenant des stocks d''intervention au bénéfice des personnes
    les plus démunies de la Communauté [notifiée sous le numéro C(1999) 1625]'
  type: main
- language: de
  script: Latn
  content: '1999/413/EG: Entscheidung der Kommission vom 15. Juni 1999 zur Änderung
    der Entscheidung 98/657/EG zur Annahme des Programms zur Bewilligung von Mitteln,
    die den Mitgliedstaaten für die Lieferung von Nahrungsmitteln aus Interventionsbeständen
    zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr
    1999 zur verbuchen sind (Bekanntgegeben unter Aktenzeichen K(1999) 1625)'
  type: main
- language: da
  script: Latn
  content: '1999/413/EF: Kommissionens beslutning af 15. juni 1999 om ændring af
    beslutning 98/657/EF om vedtagelse af planen for tildeling til medlemsstaterne
    af midler, der skal afholdes over 1999-budgettet, og som skal dække udgifterne
    til levering af levnedsmidler fra interventionslagre til de socialt dårligst
    stillede personer i Fællesskabet (meddelt under nummer K(1999) 1625)'
  type: main
- language: el
  script: Grek
  content: '1999/413/ΕΚ: Απόφαση της Επιτροπής της 15ης
    Ιουνίου 1999 για την τροποποίηση της απόφασης
    98/657/ΕΚ για την έγκριση του προγράμματος για
    την κατανομή στα κράτη μέλη των πόρων που θα
    καταλογισθούν στο έτος προϋπολογισμού 1999 για
    την παροχή τροφίμων, που προέρχονται από τα
    αποθέματα παρέμβασης στα πιο άπορα άτομα της
    Κοινότητας [κοινοποιηθείσα υπό τον αριθμό
    Ε(1999) 1625]'
  type: main
- language: fi
  script: Latn
  content: '1999/413/EY: Komission päätös, tehty 15 päivänä kesäkuuta 1999,
