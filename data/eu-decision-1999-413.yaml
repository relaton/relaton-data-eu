    suunnitelman hyväksymisestä interventiovarastoista peräisin olevien elintarvikkeiden
    toimittamiseksi yhteisön vähävaraisimmille henkilöille tehdyn päätöksen
    98/657/EY muuttamisesta (tiedoksiannettu numerolla K(1999) 1625)'
  type: main
- language: it
  script: Latn
  content: '1999/413/CE: Decisione della Commissione del 15 giugno 1999 recante modifica
