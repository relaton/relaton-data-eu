    forniture di derrate alimentari provenienti dalle scorte d''intervento a favore
    di indigenti nella Comunità [notificata con il numero C(1999) 1625]'
  type: main
- language: nl
  script: Latn
  content: '1999/413/EG: Beschikking van de Commissie van 15 juni 1999 houdende wijziging
