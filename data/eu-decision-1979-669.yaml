title:
- language: en
  script: Latn
  content: '79/669/EEC: Commission Decision of 4 July 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to women''s, girls''and infants''woven pyjamas and
    night dresses, of wool, cotton or man-made textile fibres, falling within heading
    No ex 61.04 of the Common Customs Tariff (NIMEXE codes 61.04- 11, 13, 18) (category
    30 A), originating in Macao and in free circulation in the other Member States
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/669/CEE: Décision de la Commission, du 4 juillet 1979, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les pyjamas et chemises de nuit, tissés,
    pour femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles de la position ex 61.04 du tarif douanier commun
    (codes Nimexe : 61.04-11, 13, 18) (catégorie 30 A), originaires de Macao et mis
    en libre pratique dans les autres États membres (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/669/EWG: Entscheidung der Kommission vom 4. Juli 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Macau stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Schlafanzüge und Nachthemden, aus Geweben, für Frauen,
    Mädchen und Kleinkinder, aus Wolle, Baumwolle, synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer ex 61.04 des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern
    61.04-11 ; 13 ; 18), Kategorie 30 A, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/669/EØF: Kommissionens beslutning af 4. juli 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage pyjamas og anden natbeklædning, vævede,
    til kvinder, piger og småbørn, af uld, bomuld eller kemofibre, som henhører
    under pos. ex 61.04 i den fælles toldtarif (NIMEXE-nummer 61.04-11, 13, 18 ;
    kategori 30 A), har oprindelse i Macao og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/669/CEE: Decisione della Commissione, del 4 luglio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario pigiami e camicie da notte tessute, per
    donna, per ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche
    o artificiali della voce ex 61.04 della tariffa doganale comune (codici Nimexe:
    61.04-11, 13, 18), categoria 30 A, originari di Macao e messi in libera pratica
    negli altri Stati membri (I testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/669/EEG: Beschikking van de Commissie van 4 juli 1979 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd geweven pyjama''s en nachthemden voor dames, meisjes en kinderen, van
    wol, van katoen of van synthetische of van kunstmatige textielvezels, van post
    ex 61.04 van het gemeenschappelijk douanetarief (NIMEXE- code 61.04-11, 13, 18),
    (categorie 30 A), van oorsprong uit Macao en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    teksten in de Franse en de Nederlandse taal zijn authentiek)'
