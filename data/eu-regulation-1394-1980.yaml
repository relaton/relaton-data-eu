title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1394/80 of 2 June 1980 re-establishing the
    levying of customs duties on hermetic or semi-hermetic compressors, for refrigerating
    equipment, falling within subheading 84.11 A II ex c) and originating in Singapore,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1394/80 de la Commission, du 2 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux compresseurs
    hermétiques ou semi-hermétiques pour groupes frigorifiques de la sous-position
    84.11 A II ex c) du tarif douanier commun, originaires de Singapour, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1394/80 der Kommission vom 2. Juni 1980 zur Wiedereinführung
    des Zollsatzes für hermetische oder halbhermetische Kompressoren für Kältemaschinen
    der Tarifstelle 84.11 A II ex c), mit Ursprung in Singapur, dem die in der Verordnung
    (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1394/80 af 2. juni 1980 om genindførelse
    af opkrævning af toldafgifter for hermetiske eller halvhermetiske kompressorer
    til kølemaskiner, under pos. 84.11 A II ex c), som har oprindelse i Singapore
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1394/80 della Commissione del 2 giugno 1980, che ripristina
    la riscossione dei dazi doganali applicabili ai compressori per gruppi frigoriferi,
    a chiusura ermetica o semiermetica, della sottovoce 84.11 A II ex c) della tariffa
    doganale comune, originari di Singapore, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1394/80 van de Commissie van 2 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op hermetische
    of halfhermetische compressors voor koelgroepen, van post 84.11 A II ex c), van
    oorsprong uit Singapore, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
