  script: Latn
  content: '91/200/EEC: Commission Decision of 11 March 1991 on the establishment
    of the Community support framework for Community structural assistance on the
    improvement of the conditions under which fishery and aquaculture products are
    processed and marketed in Germany (excluding the five new länder) (Only the German
    text is authentic)'
  type: main
- language: fr
  script: Latn
