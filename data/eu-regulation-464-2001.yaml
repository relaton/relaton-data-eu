    merkintöjen ja alkuperänimitysten suojasta annetussa neuvoston asetuksessa (ETY)
    N:o 2081/92 säädettyyn "Suojattujen alkuperänimitysten ja suojattujen maantieteellisten
    merkintöjen rekisteriin" annetun komission asetuksen (EY) N:o 2400/96 liitteen
    täydentämisestä
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 464/2001 od 7. ožujka 2001. o dopuni Priloga
    Uredbi (EZ) br. 2400/96 o upisu određenih naziva u Registar zaštićenih oznaka
    izvornosti i zaštićenih oznaka zemljopisnog podrijetla kako je predviđeno u
    Uredbi Vijeća (EEZ) br. 2081/92 o zaštiti oznaka zemljopisnog podrijetla i oznaka
    izvornosti za poljoprivredne i prehrambene proizvode
  type: main
- language: hu
  script: Latn
  content: A Bizottság 464/2001/EK rendelete (2001. március 7.) egyes neveknek a
    mezőgazdasági termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben foglalt, az oltalom alatt
    álló földrajzi jelzések és eredetmegjelölések nyilvántartásába való
    bejegyzéséről szóló 2400/96/EK rendelet mellékletének kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 464/2001 della Commissione, del 7 marzo 2001, che completa
    l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di alcune denominazioni
    nel "Registro delle denominazioni di origine protette e delle indicazioni geografiche
    protette" di cui al regolamento (CEE) n. 2081/92 del Consiglio relativo alla protezione
    delle indicazioni geografiche e delle denominazioni di origine dei prodotti agricoli
    e alimentari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 464/2001 (2001. gada 7. marts), ar ko papildina
    pielikumu Regulai (EK) Nr. 2400/96 par dažu nosaukumu iekļaušanu “Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā”,
    kurš paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu aizsardzību
  type: main
- language: lt
  script: Latn
  content: 2001 m. kovo 7 d. Komisijos reglamentas (EB) Nr. 464/2001, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įtraukimo į Tarybos
    reglamente (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų
    geografinių nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų
    kilmės vietos nuorodų ir saugomų geografinių nuorodų registrą“ priedą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 464/2001 tas-7 ta’ Marzu 2001
    li jissupplimenta l-Anness mar-Regolament (KE) Nru 2400/96 dwar id-dħul ta’
    ċerti ismijiet fir-“Reġistru ta’ denominazzjoni protetta ta’ oriġini
    u indikazzjonijiet ġeografiċi protetti” pprovdut bir-Regolament tal-Kunsill
    (KEE) Nru 2081/92 dwar il-protezzjoni ta’ l-indikazzjonijiet ġeografiċi u
    l-ismijiet ta’ l-oriġini għall-prodotti u l-oġġetti ta' l-ikel agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 464/2001 van de Commissie van 7 maart 2001 tot aanvulling
    van de bĳlage bĳ Verordening (EG) nr. 2400/96 betreffende de inschrĳving van
    bepaalde benamingen in het "Register van beschermde oorsprongsbenamingen en beschermde
    geografische aanduidingen" bedoeld in Verordening (EEG) nr. 2081/92 van de Raad
    inzake de bescherming van geografische aanduidingen en oorsprongsbenamingen van
    landbouwproducten en levensmiddelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) NR 464/2001 z dnia 7 marca 2001 r. uzupełniające
    Załącznik do rozporządzenia (WE) nr 2400/96 w sprawie wpisu niektórych nazw
    do „Rejestru chronionych nazw pochodzenia i chronionych oznaczeń geograficznych”
    przewidzianego w rozporządzeniu Rady (EWG) nr 2081/92 w sprawie ochrony oznaczeń
    geograficznych i nazw pochodzenia dla produktów rolnych i środków spożywczych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 464/2001 da Comissão, de 7 de Março de 2001, que
    completa o anexo do Regulamento (CE) n.° 2400/96 relativo à inscrição de determinadas
    denominações no "Registo das denominações de origem protegidas e das indicações
    geográficas protegidas" previsto no Regulamento (CEE) n.° 2081/92 do Conselho
    relativo à protecção das indicações geográficas e denominações de origem
    dos produtos agrícolas e dos géneros alimentícios
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 464/2001 al Comisiei din 7 martie 2001 de completare
    a anexei la Regulamentul (CE) nr. 2400/96 privind înscrierea anumitor denumiri
    în „Registrul denumirilor de origine protejate și al indicațiilor geografice
    protejate”, prevăzut în Regulamentul (CEE) nr. 2081/92 al Consiliului privind
    protecția indicațiilor geografice și denumirilor de origine ale produselor
    agricole și alimentare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 464/2001 zo 7. marca 2001, ktorým sa dopĺňa
    príloha k nariadeniu (ES) č. 2400/96 o zápise určitých názvov do Registra
    chránených označení pôvodu a chránených zemepisných označení, uvedeného
    v nariadení Rady (EHS) č. 2081/92 o ochrane zemepisných označení a označení
    pôvodu poľnohospodárskych výrobkov a potravín
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 464/2001 z dne 7. marca 2001 o dopolnitvi Priloge
    k Uredbi (ES) št. 2400/96 o vnosu nekaterih imen v „Register zaščitenih označb
    porekla in zaščitenih geografskih oznak“, določen z Uredbo Sveta (EGS) št.
    2081/92 o zaščiti geografskih oznak in označb porekla za kmetijske pridelke
    in živila
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 464/2001 de la Comisión, de 7 de marzo de 2001, que
    completa el anexo del Reglamento (CE) n° 2400/96 relativo a la inscripción de
    determinadas denominaciones en el Registro de Denominaciones de Origen Protegidas
