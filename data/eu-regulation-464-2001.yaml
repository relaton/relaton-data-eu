    του κανονισμού (ΕΚ) αριθ. 2400/96 σχετικά με την
    εγγραφή ορισμένων ονομασιών στο "μητρώο προστατευόμενων
    ονομασιών προέλευσης και προστατευόμενων
    γεωγραφικών ενδείξεων" που προβλέπεται στον
    κανονισμό (ΕΟΚ) αριθ. 2081/92 του Συμβουλίου περί
    προστασίας των γεωγραφικών ενδείξεων και των
    ονομασιών προέλευσης των γεωργικών προϊόντων
    και των τροφίμων
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 464/2001, 7. märts 2001, millega täiendatakse
    määruse (EÜ) nr 2400/96 (teatavate nimede kandmise kohta kaitstud päritolunimetuste
    ja kaitstud geograafiliste tähiste registrisse, mis on ette nähtud nõukogu
    määrusega (EMÜ) nr 2081/92 põllumajandussaaduste ja toiduainete geograafiliste
    tähiste ning päritolunimetuste kaitse kohta) lisa
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 464/2001, annettu 7 päivänä maaliskuuta 2001,
