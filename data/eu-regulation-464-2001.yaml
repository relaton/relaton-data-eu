title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 464/2001 of 7 March 2001 supplementing the
    Annex to Regulation (EC) No 2400/96 on the entry of certain names in the "Register
    of protected designations of origin and protected geographical indications" provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 464/2001 de la Commission du 7 mars 2001 complétant
    l'annexe du règlement (CE) n° 2400/96 relatif à l'inscription de certaines
    dénominations dans le "Registre des appellations d'origine protégées et des
    indications géographiques protégées" prévu au règlement (CEE) n° 2081/92
    du Conseil relatif à la protection des indications géographiques et des appellations
    d'origine des produits agricoles et des denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 464/2001 der Kommission vom 7. März 2001 zur Ergänzung
    des Anhangs der Verordnung (EG) Nr. 2400/96 zur Eintragung bestimmter Bezeichnungen
    in das Verzeichnis der geschützten Ursprungsbezeichnungen und der geschützten
    geografischen Angaben für Agrarerzeugnisse und Lebensmittel gemäß der Verordnung
    (EWG) Nr. 2081/92 des Rates zum Schutz von geografischen Angaben und Ursprungsbezeichnungen
    für Agrarerzeugnisse und Lebensmittel
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 464/2001 на Комисията от 7 март
    2001 година за допълване на приложението към
    Регламент (ЕО) № 2400/96 относно вписването на
    някои означения в Регистъра на защитените
    наименования за произход и на защитените географски
    указания, предвиден в Регламент (ЕИО) № 2081/92
    на Съвета за защита на географските указания
    и наименованията за произход на селскостопанските
    и хранителните продукти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 464/2001 ze dne 7. března 2001, kterým se
    doplňuje příloha nařízení (ES) č. 2400/96 o zápisu určitých názvů
    do „Rejstříku chráněných označení původu a chráněných zeměpisných
    označení“ podle nařízení Rady (EHS) č. 2081/92 o ochraně zeměpisných
    označení a označení původu zemědělských produktů a potravin
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 464/2001 af 7. marts 2001 om tilføjelse
    af bilaget til forordning (EF) nr. 2400/96 om optagelse af visse betegnelser i
    det register over beskyttede oprindelsesbetegnelser og beskyttede geografiske
    betegnelser, der er fastsat i Rådets forordning (EØF) nr. 2081/92 om beskyttelse
    af geografiske betegnelser og oprindelsesbetegnelser for landbrugsprodukter og
    levnedsmidler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 464/2001 της Επιτροπής,
