title:
- language: fr
  script: Latn
  content: Décision du Conseil du 9 décembre 1969, portant dérogation à la décision
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux,
    pour l'accord à long terme négocié entre le gouvernement de la République
    fédérale d'Allemagne et le gouvernement de la République socialiste de Roumanie
    et relatif aux échanges commerciaux et au développement de la coopération économique
    entre les deux pays
  type: main
- language: de
  script: Latn
  content: '69/470/EWG: Entscheidung des Rates vom 9. Dezember 1969 zur Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen hinsichtlich des langfristigen Abkommens zwischen der Regierung
    der Bundesrepublik Deutschland und der Regierung der Sozialistischen Republik
    Rumänien über den Warenverkehr und die Erweiterung der wirtschaftlichen Zusammenarbeit
    zwischen beiden Ländern'
  type: main
- language: it
  script: Latn
  content: '69/470/CEE: Decisione del Consiglio, del 9 dicembre 1969, recante deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali, per quanto concerne l''accordo a lungo termine negoziato
    tra il governo della Repubblica federale di Germania e il governo della Repubblica
    socialista di Romania concernente gli scambi commerciali e lo sviluppo della cooperazione
    economica fra i due paesi'
  type: main
- language: nl
  script: Latn
  content: '69/470/EEG: Beschikking van de Raad van 9 december 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden, ten aanzien van het akkoord op lange termijn tussen de Regering
    van de Bondsrepubliek Duitsland en de Regering van de Socialistische Republiek
    Roemenië inzake het handelsverkeer en de uitbreiding van de economische samenwerking
    tussen de beide landen'
  type: main
