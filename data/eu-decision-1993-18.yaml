---
id: EUDecision199318
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '93/18/EEC: Commission Decision of 23 December 1992 establishing that the
    exploitation of geographical areas for the purpose of exploring for or extracting
    oil or gas does not constitute in France an activity defined in Article 2 (2)
    (b) (i) of Council Directive 90/531/EEC and that entities carrying on such an
    activity are not to be considered in France as operating under special or exclusive
    rights within the meaning of Article 2 (3) (b) of the Directive (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/18/CEE: Décision de la Commission, du 23 décembre 1992, constatant
    que l''exploitation d''aires géographiques dans le but de prospecter ou d''extraire
    du pétrole ou du gaz ne constitue pas en France une activité visée à l''article
    2 paragraphe 2 point b) i) de la directive 90/531/CEE du Conseil et que les entités
    exerçant cette activité ne sont pas considérées en France comme bénéficiant
    de droits spéciaux ou exclusifs au sens de l''article 2 paragraphe 3 point b)
    de cette directive (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/18/EWG: Entscheidung der Kommission vom 23. Dezember 1992 zur Feststellung,
    daß die Nutzung eines geographisch abgegrenzten Gebiets zum Zwecke der Suche
    nach oder der Förderung von Öl oder Gas in Frankreich nicht als Tätigkeit im
    Sinne von Artikel 2 Absatz 2 Buchstabe b) Ziffer i) der Richtlinie 90/531/EWG
    des Rates gilt und daß die diese Tätigkeit ausübenden Auftraggeber in Frankreich
    als nicht im Besitz von besonderen oder ausschließlichen Rechten im Sinne von
    Artikel 2 Absatz 3 Buchstabe b) der genannten Richtlinie gelten (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/18/EØF: Kommissionens beslutning af 23. december 1992 om konstatering
    af, at udnyttelse af geografiske områder med henblik på efterforskning efter
    eller udvinding af olie eller gas i Frankrig ikke udgør virksomhed som omhandlet
    i artikel 2, stk. 2, litra b), nr. i), i Rådets direktiv 90/531/EØF, og at foretagender,
    der driver sådan virksomhed, ikke i Frankrig anses for at have særlige eller
    eksklusive rettigheder i henhold til artikel 2, stk. 3, litra b), i nævnte direktiv
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/18/ΕΟΚ: Απόφαση της Επιτροπής της 23ης Δεκεμβρίου
    1992 περί διαπιστώσεως ότι η εκμετάλλευση γεωγραφικών
    περιοχών με σκοπό την ανεύρεση πετρελαίου
    ή αερίου, καθώς και την άντληση ή τη συλλογή
    τους αντιστοίχως, δεν συνιστά στη Γαλλία δραστηριότητα
    αναφερόμενη στο άρθρο 2 παράγραφος 2 στοιχείο
    β) σημείο i) της οδηγίας 90/531/ΕΟΚ του Συμβουλίου
    και ότι οι φορείς που ασκούν τις δραστηριότητες
    αυτές δεν θεωρείται στην Γαλλία ότι απολαύουν
    ειδικών ή αποκλειστικών δικαιωμάτων κατά την
    έννοια του άρθρου 2 παράγραφος 3 στοιχείο β)
    της εν λόγω οδηγίας (Το κείμενο στην γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/18/CEE: Decisione della Commissione, del 23 dicembre 1992, che constata
    che lo sfruttamento di aree geografiche ai fini della prospezione o dell''estrazione
    di petrolio o di gas naturale non costituisce in Francia un''attività ai sensi
    dell''articolo 2, paragrafo 2, lettera b), punto i) della direttiva 90/531/CEE
    del Consiglio e che gli enti che esercitano tale attività non sono considerati
    in Francia fruire di diritti speciali o esclusivi ai sensi dell''articolo 2, paragrafo
    3, lettera b) di detta direttiva (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '93/18/EEG: Beschikking van de Commissie van 23 december 1992 inzake een
    procedure waarbij wordt vastgesteld dat de exploitatie van geografische gebieden
    met het oogmerk van prospectie of winning van aardolie of gas in Frankrijk geen
    relevante activiteit in de zin van artikel 2, lid 2, onder b) i), van Richtlijn
    90/531/EEG van de Raad vormt en dat de diensten welke deze activiteit uitoefenen,
    in Frankrijk niet worden geacht voor bijzondere of uitsluitende rechten in de
    zin van artikel 2, lid 3, onder b), van die richtlijn in aanmerking te komen (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/18/CEE: Decisão da Comissão, de 23 de Dezembro de 1992, que verifica
    que a exploração de áreas geográficas com o objectivo de prospectar ou extrair
    petróleo ou gás não constitui, em França, uma actividade abrangida pelo n°
    2, subalínea i) da alínea b), do artigo 2 da Directiva 90/531/CEE e que as entidades
    que exercem essa actividade não são consideradas, em França, como beneficiando
    de direitos especiais ou exclusivos, nos termos do n° 3, alínea b), do artigo
    2 da referida Directiva (Apenas faz fé o texto em língua francesa)'
  type: main
- language: es
  script: Latn
  content: '93/18/CEE: Decisión de la Comisión, de 23 de diciembre de 1992, por
    la que se establece que la explotación de zonas geográficas para la prospección
    o extracción de petróleo o gas no constituye en Francia una actividad contemplada
    en el inciso i) de la letra b) del apartado 2 del artículo 2 de la Directiva
    90/531/CEE del Consejo, y que las entidades que ejerzan tal actividad no se consideran
    en Francia beneficiarias de derechos especiales o exclusivos contemplados en la
    letra b) del apartado 3 del artículo 2 de dicha Directiva (El texto en lengua
    francesa es el único auténtico)'
  type: main
