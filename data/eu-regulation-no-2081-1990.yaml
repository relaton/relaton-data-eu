title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2081/90 of 20 July 1990 fixing for the 1990/91
    marketing year the minimum price to be paid to producers for dried plums and the
    amount of production aid for prunes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2081/90 de la Commission du 20 juillet 1990 fixant,
    pour la campagne 1990/1991, le prix minimal à payer aux producteurs pour les
    prunes séchées ainsi que le montant de l'aide à la production pour les pruneaux
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2081/90 DER KOMMISSION vom 20. Juli 1990 zur Festsetzung
    des den Erzeugern unverarbeiteter getrockneter Pflaumen zu zahlenden Mindestpreises
    sowie der Produktionsbeihilfe fuer Trockenpflaumen im Wirtschaftsjahr 1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2081/90 af 20. juli 1990 om fastsættelse
    af den minimumspris, der skal betales producenter for tørrede blommer, samt af
    producentstøtten for svesker i produktionsåret 1990/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2081/90 της Επιτροπής
    της 20ής Ιουλίου 1990 που καθορίζει, για την περίοδο
    εμπορίας 1990/91, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τα αποξηραμένα δαμάσκηνα
    καθώς και το ποσό της ενίσχυσης στην παραγωγή
    για τα δαμάσκηνα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2081/90 DELLA COMMISSIONE del 20 luglio 1990 che fissa,
    per la campagna di commercializzazione 1990/1991, il prezzo minimo da pagare ai
    produttori di prugne secche e l'importo dell'aiuto alla produzione per le susine
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2081/90 VAN DE COMMISSIE van 20 juli 1990 tot vaststelling,
    voor het verkoopseizoen 1990/1991, van de voor gedroogde pruimen (basisprodukt)
    aan de telers te betalen minimumprijs, alsmede van het bedrag van de steun bij
    de produktie van gedroogde pruimen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2081/90 DA COMISSAO de 20 de Julho de 1990 que fixa,
    para a campanha de comercializaçao de 1990/1991, o preço minimo a pagar aos
    produtores para as ameixas secas e o montante da ajuda à produçao para as ameixas
    secas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2081/90 DE LA COMISION de 20 de julio de 1990 por el
    que se establece, para la campana de 1990/91, el precio minimo que debe pagarse
    a los productores de ciruelas secas y el importe de la ayuda a la produccion de
    ciruelas pasas
