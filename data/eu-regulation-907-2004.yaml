    a označování
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 907/2004 af 29. april 2004 om ændring
    af præsentations- og mærkningsbestemmelserne i handelsnormerne for friske frugter
    og grøntsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 907/2004 της Επιτροπής,
    της 29ης Απριλίου 2004, για τροποποίηση των προτύπων
    εμπορίας που εφαρμόζονται στα νωπά οπωροκηπευτικά,
    όσον αφορά την παρουσίαση και τη σήμανση
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 907/2004, 29. aprill 2004, millega muudetakse
    värske puu- ja köögivilja turustusnorme esitusviisi ja märgistuse osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 907/2004, annettu 29 päivänä huhtikuuta 2004,
