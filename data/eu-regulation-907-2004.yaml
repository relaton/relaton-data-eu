title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 907/2004 of 29 April 2004 amending the marketing
    standards applicable for fresh fruit and vegetables with regards to presentation
    and labelling
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 907/2004 de la Commission du 29 avril 2004 modifiant
    les normes de commercialisation applicables aux fruits et légumes frais en ce
    qui concerne la présentation et le marquage
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 907/2004 der Kommission vom 29. April 2004 zur Änderung
    der Vermarktungsnormen für frisches Obst und Gemüse hinsichtlich der Aufmachung
    und Kennzeichnung
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 907/2004 на Комисията от 29
    април 2004 година за изменение на стандартите
    за търговия, прилагани за пресни плодове и
    зеленчуци по отношение на техния търговски
    вид и етикетиране
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 907/2004 ze dne 29. dubna 2004, kterým se
