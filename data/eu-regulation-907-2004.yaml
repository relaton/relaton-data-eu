    előírások módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 907/2004 della Commissione, del 29 aprile 2004, che
    modifica le norme di commercializzazione applicabili agli ortofrutticoli freschi
    per quanto riguarda la presentazione e le indicazioni esterne
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 907/2004 (2004. gada 29. aprīlis), ar ko groza
