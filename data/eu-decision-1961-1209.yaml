title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant le Royaume des Pays-Bas à différer
    le rapprochement des droits prévus dans son tarif douanier vers ceux du Tarif
    douanier commun, en ce qui concerne l'aluminium brut
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, durch die das Königreich der Niederlande
    ermächtigt wird, die Angleichung seiner Rohaluminium-Zollsätze an diejenigen
    des Gemeinsamen Zolltarifs auf einen späteren Zeitpunkt zu verschieben
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione che autorizza il Regno dei Paesi Bassi a differire
    il ravvicinamento dei dazi iscritti nella sua tariffa doganale a quelli della
    tariffa doganale comune per quanto riguarda l'alluminio greggio
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie waarbij het Koninkrijk der Nederlanden wordt
    gemachtigd de aanpassing van de in zijn douanetarief voorziene invoerrechten aan
    het gemeenschappelijk douanetarief voor wat betreft ruw aluminium uit te stellen
  type: main
