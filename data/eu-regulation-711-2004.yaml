    régies par le règlement (CE) n° 780/2003 portant ouverture et mode de gestion
    d'un sous-contingent tarifaire ouvert pour la viande bovine congelée relevant
    du code NC 0202 et pour les produits relevant du code NC 02062991 en raison de
    l'adhésion de la République tchèque, de l'Estonie, de Chypre, de la Lettonie,
    de la Lituanie, de la Hongrie, de Malte, de la Pologne, de la Slovénie et de
    la Slovaquie à l'Union européenne
