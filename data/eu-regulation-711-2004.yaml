  content: Commission Regulation (EC) No 711/2004 of 16 April 2004 laying down transitional
    measures as regards import licence applications pursuant to Regulation (EC) No
    780/2003 opening and providing for the administration of a tariff subquota for
    frozen meat of bovine animals covered by CN code 0202 and products covered by
    CN code 02062991, by reason of the accession of the Czech Republic, Estonia, Cyprus,
    Latvia, Lithuania, Hungary, Malta, Poland, Slovenia and Slovakia to the European
    Union
  type: main
