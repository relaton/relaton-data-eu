title:
- language: en
  script: Latn
  content: '79/43/EEC: Council Decision of 21 December 1978 concerning the conclusion
    of the Agreement in the form of an exchange of letters extending and amending
    until 30 June 1978 the Convention between the European Economic Community and
    the United Nations Relief and Works Agency for Palestine Refugees (UNRWA) and
    laying down transitional measures with a view to the conclusion of a new Convention'
  type: main
- language: fr
  script: Latn
  content: '79/43/CEE: Décision du Conseil, du 21 décembre 1978, concernant la conclusion
    de l'' accord sous forme d'' échange de lettres portant reconduction et modification,
    jusqu'' au 30 juin 1978, de la convention entre la Communauté économique européenne
    et l'' Office de secours et de travaux des Nations unies pour les réfugiés de
    Palestine (UNRWA), et arrêtant les mesures de transition en vue de la conclusion
    d'' une nouvelle convention'
  type: main
- language: de
  script: Latn
  content: '79/43/EWG: Beschluß des Rates vom 21. Dezember 1978 über den Abschluß
    des Abkommens in Form eines Briefwechsels zur Verlängerung und Änderung des
    Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft und dem Hilfswerk
    der Vereinten Nationen für die Palästinaflüchtlinge (UNRWA) bis zum 30. Juni
    1978 und zur Festlegung von Übergangsmaßnahmen im Hinblick auf den Abschluß
    eines neuen Abkommens'
  type: main
- language: da
  script: Latn
  content: '79/43/EØF: Rådets afgørelse af 21. december 1978 om indgåelse af aftalen
    i form af brevveksling om videreførelse og ændring indtil den 30. juni 1978
    af konventionen mellem Det europæiske økonomiske Fællesskab og De forenede
    Nationers hjælpeorganisation for Palæstinaflygtninge (UNRWA) og om overgangsforanstaltninger
    med henblik på indgåelse af en ny konvention'
  type: main
- language: it
  script: Latn
  content: '79/43/CEE: Decisione del Consiglio, del 21 dicembre 1978, relativa alla
    conclusione dell'' accordo sotto forma di scambio di lettere che proroga e modifica
    fino al 30 giugno 1978 la convenzione fra la Comunità economica europea e l''
    Ente soccorso e lavori delle Nazioni Unite per i profughi della Palestina (UNRWA)
    e che adotta le misure di transizione necessarie in vista della conclusione di
    una nuova convenzione'
  type: main
- language: nl
  script: Latn
  content: '79/43/EEG: Besluit van de Raad van 21 december 1978 betreffende de sluiting
    van de Overeenkomst in de vorm van een briefwisseling tot verlenging en wijziging
    tot en met 30 juni 1978 van de Overeenkomst tussen de Europese Economische Gemeenschap
    en de United Nations Relief and Works Agency for Palestine Refugees (UNRWA) en
    voor het treffen van de overgangsmaatregelen ten einde een nieuwe overeenkomst
    af te sluiten'
  type: main
