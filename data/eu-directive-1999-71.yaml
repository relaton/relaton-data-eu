  type: main
- language: it
  script: Latn
  content: Direttiva 1999/71/CE della Commissione, del 14 luglio 1999, recante modifica
    degli allegati delle direttive 86/362/CEE, 86/363/CEE e 90/642/CEE del Consiglio,
    che fissano le quantità massime di residui di antiparassitari rispettivamente
    sui e nei cereali, sui e nei prodotti alimentari di origine animale e su e in
    alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 1999/71/EK (1999. gada 14. jūlijs), ar ko groza pielikumus
    Padomes Direktīvām 86/362/EEK, 86/363/EEK un 90/642/EEK par pesticīdu atliekvielu
    maksimāli pieļaujamo daudzumu noteikšanu attiecīgi labībā un uz tās, dzīvnieku
    izcelsmes pārtikas produktos un uz tiem, kā arī dažos augu izcelsmes produktos,
    tajā skaitā augļos un dārzeņos, un uz tiem
  type: main
