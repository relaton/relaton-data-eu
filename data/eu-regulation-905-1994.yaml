    των οποίων δύναται να γίνουν αποδεκτές αιτήσεις
    που υποβλήθηκαν τον Απρίλιο του 1994 για άδειες
    εισαγωγής χοιρείου κρέατος βάσει του καθεστώτος
    που προβλέπεται από τις διμερείς γεωργικές
