    o fornecimento e a exportação para a Birmânia/Mianmar de equipamento susceptível
    de ser utilizado para actividades de repressão interna ou de terrorismo e que
    congela os fundos de determinadas pessoas ligadas a importantes cargos públicos
    nesse país
  type: main
- language: sk
