    vývozu zariadení, ktoré môžu byť použité na vnútornú represiu alebo
    terorizmus, do Barmy/Mjanmarska a o zmrazení finančných prostriedkov určitých
    osôb v súvislosti s dôležitými vládnymi funkciami v tejto krajine
  type: main
