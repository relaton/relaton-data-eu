    de luta contra o tremor epizoótico em determinados Estados-Membros, define garantias
    adicionais e concede derrogações relativamente aos programas de criação de
    ovinos resistentes às EET ao abrigo da Decisão 2003/100/CE
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1472/2004 z 18. augusta 2004, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1874/2003 schvaľujúce národné programy niektorých
    členských štátov na kontrolu scrapie, definujúce ďalšie garancie a povoľujúce
    odchýlenia v oblasti chovných programov zameraných na rezistenciu oviec proti
    PSE podľa rozhodnutia 2003/100/ES
  type: main
