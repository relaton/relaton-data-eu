title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3080/81 of 28 October 1981 determining the
    extent to which applications lodged during the month of October 1981 for the issue
    of import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3080/81 de la Commission, du 28 octobre 1981, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'octobre 1981 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3080/81 der Kommission vom 28. Oktober 1981 über
    den Umfang, in dem den im Monat Oktober 1981 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3080/81 af 28. oktober 1981 om fastsættelse
    af, i hvilken udstrækning anmodningen om udstedelse af importlicens, indgivet
    i oktober 1981 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3080/81 της Επιτροπής
    της 28ης Οκτωβρίου 1981 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, πού
    υποβλήθηκαν τον Οκτώβριο 1981, για τα κατεψυγμένα
    βόεια κρέατα πού προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3080/81 della Commissione, del 28 ottobre 1981, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 1981 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3080/81 van de Commissie van 28 oktober 1981 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in de maand oktober
    1981 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
