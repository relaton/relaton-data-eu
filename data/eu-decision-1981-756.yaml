title:
- language: en
  script: Latn
  content: '81/756/EEC: Commission Decision of 11 August 1981 authorizing Ireland
    not to apply Community treatment to jerseys, pullovers, slip-overs, waistcoats,
    twinsets, cardigans, bedjackets and jumpers, knitted or crocheted, originating
    in South Korea (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/756/CEE: Décision de la Commission, du 11 août 1981, autorisant l''Irlande
    à exclure du traitement communautaire les chandails, "pullovers" (avec ou sans
    manches), "twinsets", gilets et vestes de bonneterie, originaires de Corée du
    Sud (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/756/EWG: Entscheidung der Kommission vom 11. August 1981 zur Ermächtigung
    Irlands, aus Südkorea stammende Pullover, Slipover, Twinsets, Westen und Strickjacken,
    aus Gewirken, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/756/EØF: Kommissionens beslutning af 11. august 1981 om bemyndigelse
    til Irland til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere,
    cardigans, cardigansæt, jumpere, trøjer og veste af trikotage med oprindelse
    i Sydkorea (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/756/EOK: Απόφαση τής Επιτροπής τής 11ης Αυγούστου
    1981 περί χορηγήσεως αδείας στήν Ιρλανδία νά
    εξαιρέσει από τήν κοινοτική μεταχείριση τά
    πλεκτά chandails, pullovers (μετά ή άνευ μανικίων), twinsets,
    γιλέκα καί σακκάκια, καταγωγής Νοτίου Κορέας
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/756/CEE: Decisione della Commissione, dell''11 agosto 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario maglie, pullover, con o senza
    maniche, slip-over, twinset, giubbotti e giacche a maglia originari della Corea
    del Sud (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/756/EEG: Beschikking van de Commissie van 11 augustus 1981 houdende
