title:
- language: en
  script: Latn
  content: Decision No 1209/2003/EC of the European Parliament and of the Council
    of 16 June 2003 on Community participation in a research and development programme
    aimed at developing new clinical interventions to combat HIV/AIDS, malaria and
    tuberculosis through a long-term partnership between Europe and developing countries,
    undertaken by several Member States
  type: main
- language: fr
  script: Latn
  content: Décision n° 1209/2003/CE du Parlement européen et du Conseil du 16 juin
    2003 relative à la participation de la Communauté à un programme de recherche
    et développement visant à développer de nouvelles interventions cliniques afin
    de lutter contre le VIH/sida, le paludisme et la tuberculose grâce à un partenariat
    à long terme entre l'Europe et les pays en développement, entrepris par plusieurs
    États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 1209/2003/EG des Europäischen Parlaments und des Rates
    vom 16. Juni 2003 über die Beteiligung der Gemeinschaft an einem von mehreren
    Mitgliedstaaten durchgeführten Forschungs- und Entwicklungsprogramm zur Entwicklung
    neuer klinischer Interventionen zur Bekämpfung von HIV/AIDS, Malaria und Tuberkulose
    im Rahmen einer langfristigen Partnerschaft zwischen Europa und den Entwicklungsländern
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady č. 1209/2003/ES ze dne 16. června
    2003 o účasti Společenství na programu výzkumu a vývoje, který provádějí
    některé členské země a jehož cílem je rozvoj nových klinických zásahů
    v boji proti HIV/AIDS, malárii a tuberkulóze prostřednictvím dlouhodobého
    partnerství mezi Evropou a rozvojovými zeměmi
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets beslutning nr. 1209/2003/EF af 16. juni
    2003 om Fællesskabets deltagelse i et forsknings- og udviklingsprogram, der iværksættes
    af flere medlemsstater, med det formål at udvikle nye kliniske tiltag til bekæmpelse
    af hiv/aids, malaria og tuberkulose gennem et langsigtet partnerskab mellem Europa
    og udviklingslandene
  type: main
- language: el
  script: Grek
