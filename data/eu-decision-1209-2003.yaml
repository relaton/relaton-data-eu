    mērķis ir izstrādāt jaunas klīniskas iejaukšanās, lai apkarotu HIV/AIDS,
    malāriju un tuberkulozi, izveidojot ilgtermiņa partnerattiecības starp Eiropu
    un jaunattīstības valstīm, ko uzņēmušās vairākas dalībvalstis
  type: main
- language: lt
  script: Latn
  content: 2003 m. birželio 16 d. Europos Parlamento ir Tarybos Sprendimas dėl Bendrijos
