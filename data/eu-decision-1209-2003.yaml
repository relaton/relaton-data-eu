    kurios tikslas – naujų klinikinių intervencijų, skirtų likviduoti ŽIV/AIDS,
    maliariją ir tuberkuliozę, kūrimas per ilgalaikę Europos ir besivystančių
    šalių partnerystę
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni Nru 1209/2003/KE tal-parlament ewropew u tal-kunsill tas-16
