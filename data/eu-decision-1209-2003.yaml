    e desenvolvimento destinado a desenvolver novas intervenções clínicas para
    lutar contra o HIV/SIDA, a malária e a tuberculose através de uma parceria a
    longo prazo entre a Europa e os países em desenvolvimento, adoptado por vários
    Estados-Membros
  type: main
