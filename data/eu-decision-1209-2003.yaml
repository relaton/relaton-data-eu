    με τη συμμετοχή της Κοινότητας σε πρόγραμμα
    έρευνας και ανάπτυξης με σκοπό την ανάπτυξη
    νέων κλινικών παρεμβάσεων για την καταπολέμηση
    των ασθενειών HIV/AIDS, ελονοσίας και φυματίωσης,
    στο πλαίσιο μακροπρόθεσμης σύμπραξης μεταξύ
    της Ευρώπης και των αναπτυσσομένων χωρών, το
    οποίο αναλαμβάνουν πλείονα κράτη μέλη
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu otsus nr 1209/2003/EÜ, 16. juuni 2003,
    ühenduse osalemise kohta Euroopa ja arengumaade pikaajalise koostöö kaudu uute
    HIV/AIDSi, malaaria ja tuberkuloosi vastaste ravimenetluste väljaarendamisele
    suunatud uurimis- ja arendustegevuse programmis, mille on algatanud mitmed liikmesriigid
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 1209/2003/EY, tehty 16
    päivänä kesäkuuta 2003, yhteisön osallistumisesta useiden jäsenvaltioiden
    käynnistämään tutkimus- ja kehittämisohjelmaan HI-viruksen/aidsin, malarian
    ja tuberkuloosin torjumisessa käytettävien uusien kliinisten interventioiden
