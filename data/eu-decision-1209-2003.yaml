  content: Az Európai Parlament és a Tanács 1209/2003/EK határozata (2003. június
    16.) a HIV/AIDS, a malária és a tuberkulózis elleni új klinikai beavatkozások
    kifejlesztését célzó, európai és a fejlődő országok közötti, több
    tagállam által vállalt hosszú távú partnerkapcsolat útján megvalósuló
    kutatási és fejlesztési programban való közösségi részvételéről
  type: main
- language: it
  script: Latn
  content: Decisione n. 1209/2003/CE del Parlamento europeo e del Consiglio, del 16
