    programie badawczo-rozwojowym mającym na celu rozwijanie nowych interwencji klinicznych
    w celu zwalczania HIV/AIDS, malarii i gruźlicy w ramach długoterminowego partnerstwa
    między Europą a krajami rozwijającymi się
  type: main
- language: pt
  script: Latn
  content: Decisão n.° 1209/2003/CE do Parlamento Europeu e do Conselho, de 16 de
