title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 649/82 of 18 March 1982 on a decision to
    make no award in respect of the first partial invitation to tender for white sugar
    issued in connection with the supplementary standing invitation to tender referred
    to in Regulation (EEC) No 2042/81
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 649/82 de la Commission, du 18 mars 1982, portant décision
    de ne pas donner suite à la première adjudication partielle de sucre blanc effectuée
    dans le cadre de l'adjudication permanente complémentaire visée au règlement
    (CEE) n 2042/81
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 649/82 der Kommission vom 18. März 1982 über die
    Entscheidung, der im Rahmen der in der Verordnung (EWG) Nr. 2042/81 genannten
    ergänzenden Dauerausschreibung durchgeführten ersten Teilausschreibung nicht
    stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 649/82 af 18. marts 1982 om ikke at
    gennemføre den første del-licitation for hvidt sukker, der er afholdt inden
    for rammerne af den løbende tillægslicitation omhandlet i forordning (EØF)
    nr. 2042/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 649/82 της Επιτροπής
