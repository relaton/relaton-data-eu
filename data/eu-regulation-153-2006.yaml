title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 153/2006 of 27 January 2006 amending Regulation
    (EC) No 1819/2005 adopting a plan allocating resources to the Member States to
    be charged against 2006 budget year for the supply of food from intervention stocks
    for the benefit of the most deprived persons in the Community
  type: main
- language: fr
  script: Latn
