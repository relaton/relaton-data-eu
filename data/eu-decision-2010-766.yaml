title:
- language: en
  script: Latn
  content: Council Decision 2010/766/CFSP of 7 December 2010 amending Joint Action
    2008/851/CFSP on a European Union military operation to contribute to the deterrence,
    prevention and repression of acts of piracy and armed robbery off the Somali coast
  type: main
- language: fr
  script: Latn
  content: Décision 2010/766/PESC du Conseil du 7 décembre 2010 modifiant l’action
    commune 2008/851/PESC concernant l’opération militaire de l’Union européenne
    en vue d’une contribution à la dissuasion, à la prévention et à la répression
    des actes de piraterie et de vols à main armée au large des côtes de la Somalie
  type: main
- language: de
  script: Latn
  content: Beschluss 2010/766/GASP des Rates vom 7. Dezember 2010 zur Änderung der
    Gemeinsamen Aktion 2008/851/GASP über die Militäroperation der Europäischen
    Union als Beitrag zur Abschreckung, Verhütung und Bekämpfung von seeräuberischen
    Handlungen und bewaffneten Raubüberfällen vor der Küste Somalias
  type: main
- language: bg
  script: Cyrl
  content: Решение 2010/766/ОВППС на Съвета от 7 декември
    2010 година за изменение на Съвместно действие
    2008/851/ОВППС относно военната операция на Европейския
    съюз, предназначена да допринесе за възпирането,
    предотвратяването и потушаването на пиратските
    действия и въоръжените грабежи край бреговете
    на Сомалия
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2010/766/SZBP ze dne 7. prosince 2010 , kterým se mění
    společná akce 2008/851/SZBP o vojenské operaci Evropské unie s cílem přispět
    k odvrácení, prevenci a potlačení pirátství a ozbrojených loupeží u pobřeží
    Somálska
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2010/766/FUSP af 7. december 2010 om ændring af fælles
    aktion 2008/851/FUSP om Den Europæiske Unions militæroperation med henblik på
    at bidrage til at afskrække fra, forebygge og bekæmpe piratvirksomhed og væbnede
    røverier ud for Somalias kyster
  type: main
- language: el
  script: Grek
  content: Απόφαση 2010/766/ΚΕΠΠΑ του Συμβουλίου, της
    7ης Δεκεμβρίου 2010 , για την τροποποίηση της
    κοινής δράσης 2008/851/ΚΕΠΠΑ σχετικά με στρατιωτική
    επιχείρηση της Ευρωπαϊκής Ένωσης που θα συμβάλει
    στην αποτροπή, την πρόληψη και την καταστολή
    των πειρατικών επιθέσεων και των ένοπλων ληστειών
    στα ανοικτά των ακτών της Σομαλίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2010/766/ÜVJP, 7. detsember 2010 , millega muudetakse ühismeedet
    2008/851/ÜVJP, mis käsitleb Euroopa Liidu sõjalist operatsiooni Somaalia ranniku
    lähedal aset leidvate piraatlusjuhtumite ja relvastatud röövimiste tõkestamiseks,
    ärahoidmiseks ja ohjeldamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2010/766/YUTP, annettu 7 päivänä joulukuuta 2010
    , Euroopan unionin sotilasoperaatiosta, jolla osallistutaan merirosvouksen ja
    aseellisten ryöstöjen ehkäisemiseen ja torjuntaan Somalian rannikkovesillä,
    hyväksytyn yhteisen toiminnan 2008/851/YUTP muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća 2010/766/ZVSP od 7. prosinca 2010. o izmjeni Zajedničke
    akcije 2008/851/ZVSP o vojnoj operaciji Europske unije za doprinos odvraćanju,
    sprečavanju i suzbijanju djela gusarstva i oružane pljačke na somalskoj obali
  type: main
- language: hu
  script: Latn
  content: A Tanács 2010/766/KKBP határozata ( 2010. december 7. ) a Szomália partjainál
    folytatott kalóztámadásoktól és fegyveres rablásoktól való elrettentéshez,
    azok megelőzéséhez és visszaszorításához való hozzájárulás céljából
    folytatott európai uniós katonai műveletről szóló 2008/851/KKBP együttes
    fellépés módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione 2010/766/PESC del Consiglio, del 7 dicembre 2010 , che modifica
    l’azione comune 2008/851/PESC relativa all’operazione militare dell’Unione
    europea volta a contribuire alla dissuasione, alla prevenzione e alla repressione
    degli atti di pirateria e delle rapine a mano armata al largo della Somalia
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2010/766/KĀDP ( 2010. gada 7. decembris ), ar kuru groza
    Vienoto rīcību 2008/851/KĀDP par Eiropas Savienības militāro operāciju ar
    mērķi palīdzēt Somālijas piekrastē novērst un apkarot pirātismu un bruņotas
    laupīšanas un atturēt no šādiem nodarījumiem
  type: main
- language: lt
  script: Latn
  content: 2010 m. gruodžio 7 d. Tarybos sprendimas 2010/766/BUSP, kuriuo iš dalies
    keičiami Bendrieji veiksmai 2008/851/BUSP dėl Europos Sąjungos karinės operacijos,
    skirtos prisidėti prie atgrasymo nuo piratavimo veiksmų ir ginkluotų plėšimų
    jūroje prie Somalio krantų ir jų prevencijos bei sustabdymo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2010/766/PESK tas- 7 ta’ Diċembru 2010 li temenda
    l-Azzjoni Konġunta 2008/851/PESK dwar l-operazzjoni militari tal-Unjoni Ewropea
    bil-ħsieb ta’ kontribut għad-deterrenza, il-prevenzjoni u t-trażżin tal-atti
    ta’ piraterija u ta’ serq bl-użu tal-armi ‘l barra mix-xtut tas-Somalja
  type: main
- language: nl
  script: Latn
  content: Besluit 2010/766/GBVB van de Raad van 7 december 2010 houdende wijziging
    van Gemeenschappelijk Optreden 2008/851/GBVB inzake de militaire operatie van
    de Europese Unie teneinde bij te dragen tot het ontmoedigen, het voorkomen en
    bestrijden van piraterij en gewapende overvallen voor de Somalische kust
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2010/766/WPZiB z dnia 7 grudnia 2010 r. zmieniająca wspólne
    działanie 2008/851/WPZiB w sprawie operacji wojskowej Unii Europejskiej mającej
    na celu udział w powstrzymywaniu, zapobieganiu i zwalczaniu aktów piractwa i
    rozboju u wybrzeży Somalii
  type: main
- language: pt
  script: Latn
  content: Decisão 2010/766/PESC do Conselho, de 7 de Dezembro de 2010 , que altera
    a Acção Comum 2008/851/PESC relativa à operação militar da União Europeia
    tendo em vista contribuir para a dissuasão, a prevenção e a repressão dos
    actos de pirataria e dos assaltos à mão armada ao largo da costa da Somália
  type: main
- language: ro
  script: Latn
  content: Decizia 2010/766/PESC a Consiliului din 7 decembrie 2010 de modificare
    a Acțiunii comune 2008/851/PESC privind operația militară a Uniunii Europene
    în vederea unei contribuții la descurajarea, prevenirea și reprimarea actelor
    de piraterie și de jaf armat din largul coastelor Somaliei
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2010/766/SZBP zo 7. decembra 2010 , ktorým sa mení a
    dopĺňa jednotná akcia 2008/851/SZBP o vojenskej operácii Európskej únie
    na podporu odradzovania od pirátskych činov a ozbrojených lúpeží pri somálskom
    pobreží, prevencie pred nimi a ich potláčania
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2010/766/SZVP z dne 7. decembra 2010 o spremembah Skupnega
    ukrepa 2008/851/SZVP o vojaški operaciji Evropske unije kot prispevku k odvračanju,
    preprečevanju in zatiranju piratstva in oboroženih ropov pred somalsko obalo
  type: main
- language: es
  script: Latn
  content: Decisión 2010/766/PESC del Consejo, de 7 de diciembre de 2010 , por la
    que se modifica la Acción Común 2008/851/PESC relativa a la Operación Militar
    de la Unión Europea destinada a contribuir a la disuasión, prevención y la
    represión de los actos de piratería y del robo a mano armada frente a las costas
    de Somalia
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2010/766/Gusp av den 7 december 2010 om ändring av gemensam
    åtgärd 2008/851/Gusp om Europeiska unionens militära insats i syfte att bidra
    till avvärjande, förebyggande och bekämpande av piratdåd och väpnade rån
    utanför Somalias kust
