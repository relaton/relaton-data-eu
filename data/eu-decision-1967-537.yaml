title:
- language: fr
  script: Latn
  content: Décision 67/537/CEE de la Commission, du 1er août 1967, autorisant la
    République italienne à adopter des mesures de sauvegarde pour certains produits
    du chapitre 50 du tarif douanier italien (soie et certains produits dérivés
    de la soie)
  type: main
- language: de
  script: Latn
  content: '67/537/EWG: Entscheidung der Kommission vom 1. August 1967, mit der die
    Italienische Republik ermächtigt wird, für einige Waren des Kapitels 50 des
    italienischen Zolltarifs (Seide und gewisse aus Seide hergestellte Erzeugnisse)
    Schutzmaßnahmen zu ergreifen'
  type: main
- language: it
  script: Latn
  content: '67/537/CEE: Decisione della Commissione, del 1 agosto 1967, che autorizza
    la Repubblica italiana ad adottare misure di salvaguardia per alcuni prodotti
    del capitolo 50 della tariffa doganale italiana (seta e taluni prodotti derivati
    della seta)'
  type: main
- language: nl
  script: Latn
  content: '67/537/EEG: Beschikking van de Commissie van 1 augustus 1967 waarbij de
    Italiaanse Republiek machtiging wordt verleend om vrijwaringsmaatregelen te nemen
    voor enige produkten vallende onder hoofdstuk 50 van het Italiaanse douanetarief
    (zijde en bepaalde van zijde afgeleide produkten)'
  type: main
