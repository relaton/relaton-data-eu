title:
- language: en
  script: Latn
  content: Eight Commission Directive 90/490/EEC of 25 September 1990 amending certain
    Annexes to Council Directive 77/93/EEC on protective measures against the introduction
    into the Member States of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Huitième Directive 90/490/CEE de la Commission du 25 septembre 1990 modifiant
    certaines annexes de la directive 77/93/CEE du Conseil, concernant les mesures
    de protection contre l'introduction dans les États membres d'organismes nuisibles
    aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: ACHTE RICHTLINIE DER KOMMISSION vom 25. September 1990 zur Aenderung bestimmter
    Anhaenge der Richtlinie 77/93/EWG des Rates ueber Massnahmen zum Schutz gegen
    das Verbringen von Schadorganismen der Pflanzen oder Pflanzenerzeugnisse in die
    Mitgliedstaaten (90/490/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS OTTENDE DIREKTIV af 25. september 1990 om aendring af visse
    bilag til Raadets direktiv 77/93/EOEF om foranstaltninger mod indslaebning i medlemsstaterne
    af skadegoerere paa planter eller planteprodukter (90/490/EOEF)
  type: main
- language: el
  script: Grek
  content: Όγδοη οδηγία 90/490/ΕΟΚ της Επιτροπής της
    25ης Σεπτεμβρίου 1990 που τροποποιεί ορισμένα
    παραρτήματα της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    περί των μέτρων προστασίας κατά της εισαγωγής
    στα κράτη μέλη οργανισμών επιβλαβών για τα
    φυτά ή τα φυτικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission kahdeksas direktiivi 90/490/ETY, annettu 25 päivänä syyskuuta
    1990, kasvien tai kasvituotteiden haitallisten organismien jäsenvaltioihin kulkeutumisen
    estämiseen liittyvistä suojatoimenpiteistä annetun neuvoston direktiivin 77/93/ETY
    tiettyjen liitteiden muuttamisesta
  type: main
- language: it
  script: Latn
  content: OTTAVA DIRETTIVA DELLA COMMISSIONE del 25 settembre 1990 che modifica alcuni
    allegati della direttiva 77/93/CEE del Consiglio concernente le misure di protezione
    contro l'introduzione negli Stati membri di organismi nocivi ai vegetali o ai
    prodotti vegetali (90/490/CEE)
  type: main
- language: nl
  script: Latn
  content: ACHTSTE RICHTLIJN VAN DE COMMISSIE van 25 september 1990 houdende wijziging
    van een aantal bijlagen bij Richtlijn 77/93/EEG betreffende de beschermende maatregelen
    tegen het binnenbrengen op het grondgebied van de Lid-Staten van voor planten
    of voor plantaardige produkten schadelijke organismen (90/490/EEG)
  type: main
- language: pt
  script: Latn
  content: OITAVA DIRECTIVA DA COMISSAO de 25 de Setembro de 1990 que altera determinados
    anexos da Directiva 77/93/CEE do Conselho, relativa às medidas de protecçao
    contra a introduçao nos Estados-membros de organismos prejudiciais às plantas
    e produtos vegetais (90/490/CEE)
  type: main
- language: es
  script: Latn
  content: OCTAVA DIRECTIVA DE LA COMISION de 25 de septiembre de 1990 por la que
    se modifican algunos Anexos de la Directiva 77/93/CEE del Consejo relativa a las
    medidas de proteccion contra la introduccion en los Estados miembros de organismos
    nocivos para los vegetales o productos vegetales (90/490/CEE)
  type: main
- language: sv
  script: Latn
  content: Kommissionens åttonde direktiv 90/490/EEG av den 25 september 1990 om
    ändring av vissa bilagor till rådets direktiv 77/93/EEG om skyddsåtgärder
    mot att skadegörare på växter eller växtprodukter förs in till medlemsstaternad
  type: main
