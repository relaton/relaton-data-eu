title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1855/94 of 27 July 1994 authorizing the competent
    authorities of the Member States to extend, on specific conditions, the period
    of validity of import authorizations issued on the basis of Regulation (EC) No
    934/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1855/94 de la Commission du 27 juillet 1994 autorisant
    les autorités compétentes des États membres à proroger dans certaines conditions,
    la période de validité des licences d'importation délivrées sur la base du
    règlement (CE) n° 934/94
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1855/94 DER KOMMISSION vom 27. Juli 1994 zur Ermächtigung
    der zuständigen Behörden der Mitgliedstaaten, die Gültigkeitsdauer der gemäß
    der Verordnung (EG) Nr. 934/94 ausgestellten Einfuhrgenehmigungen unter bestimmten
    Umständen zu verlängern
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1855/94 af 27. juli 1994 om bemyndigelse
    af medlemsstaternes kompetente myndigheder til på bestemte betingelser at forlænge
    gyldighedsperioden for importbevillinger, der er udstedt på grundlag af forordning
    (EF) nr. 934/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1855/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιουλίου 1994 για την εξουσιοδότηση των
    αρμόδιων αρχών των κρατών μελών να επεκτείνουν
    υπό ορισμένες προϋποθέσεις, την περίοδο ισχύος
    των αδειών εισαγωγής που εκδίδονται βάσει
    του κανονισμού (ΕΚ) αριθ. 934/94
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1855/94 DELLA COMMISSIONE del 27 luglio 1994 che autorizza
    le autorità competenti degli Stati membri a prorogare, a condizioni specifiche,
    il periodo di validità delle autorizzazioni all' importazione rilasciate in base
    al regolamento (CE) n. 934/94
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1855/94 VAN DE COMMISSIE van 27 juli 1994 betreffende
    de verlenging van de geldigheidsduur van op grond van Verordening (EG) nr. 934/94
    afgegeven invoervergunningen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1855/94 DA COMISSÃO de 27 de Julho de 1994 que autoriza
    as autoridades competentes dos Estados-membros a prorrogar em determinadas condições,
    o prazo de validade das autorizações de importação emitidas com base no Regulamento
    (CE) nº 934/94
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1855/94 DE LA COMISIÓN de 27 de julio de 1994 por
    el que se autoriza a las autoridades competentes de los Estados miembros a prorrogar,
    en determinadas condiciones, el período de validez de las autorizaciones de importación
    expedidas en virtud del Reglamento (CE) nº 934/94
