  content: Council Regulation (EC) No 1425/2006 of 25 September 2006 imposing a definitive
    anti-dumping duty on imports of certain plastic sacks and bags originating in
    the People’s Republic of China and Thailand, and terminating the proceeding
    on imports of certain plastic sacks and bags originating in Malaysia
