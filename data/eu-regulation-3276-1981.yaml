title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3276/81 of 16 November 1981 opening, allocating
    and providing for the administration of a Community tariff quota for newsprint
    falling within subheading 48.01 A of the Common Customs Tariff (1982) and extending
    this quota to include certain other types of paper
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3276/81 du Conseil, du 16 novembre 1981, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de papier
    journal, de la sous-position 48.01 A du tarif douanier commun (année 1982), et
    étendant le bénéfice de ce même contingent à certains autres papiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3276/81 des Rates vom 16. November 1981 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Zeitungsdruckpapier
    der Tarifstelle 48.01 A des Gemeinsamen Zolltarifs (1982) und zur Ausdehnung dieses
    Kontingents auf bestimmte andere Papiere
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3276/81 af 16. november 1981 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for avispapir henhørende
    under pos. 48.01 A i den fælles toldtarif (1982) og om udvidelse af dette kontingent
    til også at omfatte andre former for papir
  type: main
- language: el
  script: Grek
