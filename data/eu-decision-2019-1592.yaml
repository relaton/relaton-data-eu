    artikel 193 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel
    van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2019/1592 z dnia 24 września 2019 r. w sprawie
