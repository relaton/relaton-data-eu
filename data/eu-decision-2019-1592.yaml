    od art. 193 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości
    dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/1592 do Conselho, de 24 de setembro de
    2019, que autoriza Portugal a aplicar uma medida especial em derrogação ao artigo
    193.° da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre o valor
    acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/1592 a Consiliului din 24 septembrie
    2019 de autorizare a Portugaliei să introducă o măsură specială de derogare
    de la articolul 193 din Directiva 2006/112/CE privind sistemul comun al taxei
    pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2019/1592 z 24. septembra 2019, ktorým
    sa Portugalsku povoľuje zaviesť osobitné opatrenie odchyľujúce sa od článku
    193 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2019/1592 z dne 24. septembra 2019 o dovoljenju
