    Eröffnung, Aufteilung und Verwaltung der Gemeinschaftszollkontingente für auf
    Handwebstühlen hergestellte Gewebe aus Seide oder Schappeseide oder aus Baumwolle
    der Tarifnummern ex 50.09 und ex 55.09 des Gemeinsamen Zolltarifs (1971)
  type: main
- language: it
