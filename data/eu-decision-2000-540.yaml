title:
- language: en
  script: Latn
  content: '2000/540/EC: Commission Decision of 6 September 2000 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of RH-7281 (zoxamide), B-41; E-187 (milbemectin), BAS500F
    (pyraclostrobin) and AEF130360 (foramsulfuron) in Annex I to Council Directive
    91/414/EEC concerning the placing of plant-protection products on the market (notified
    under document number C(2000) 2285)'
  type: main
- language: fr
  script: Latn
  content: '2000/540/CE: Décision de la Commission du 6 septembre 2000 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
