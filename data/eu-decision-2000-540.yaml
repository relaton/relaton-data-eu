    du BAS500F (pyraclostrobine) et de l''AEF130360 (foramsulfurone) dans l''annexe
    I de la directive 91/414/CEE du Conseil concernant la mise sur le marché des
    produits phytopharmaceutiques [notifiée sous le numéro C(2000) 2285]'
  type: main
