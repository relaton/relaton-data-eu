    presentate nel mese di ottobre 1998 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dall'accordo concluso tra la Comunità e
    la Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2276/98 van de Commissie van 22 oktober 1998 tot vaststelling
