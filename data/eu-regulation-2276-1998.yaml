title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2276/98 of 22 October 1998 determining the
    extent to which applications lodged in October 1998 for import licences for certain
    pigmeat products under the regime provided for by the Agreement concluded by the
    Community with Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2276/98 de la Commission du 22 octobre 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 1998 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par l'accord conclu par la Communauté avec la Slovénie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2276/98 der Kommission vom 22. Oktober 1998 über die
    Festsetzung des Umfangs, in dem die im Oktober 1998 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung des Abkommens
    zwischen der Gemeinschaft und Slowenien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2276/98 af 22. oktober 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1998 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i den aftale, som Fællesskabet har indgået med Slovenien
  type: main
- language: el
  script: Grek
