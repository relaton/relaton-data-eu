title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1087/72 de la Commission, du 26 mai 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    au verre étiré ou soufflé, de la position tarifaire 70.05, originaire de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1087/72 der Kommission vom 26. Mai 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für gezogenes oder geblasenes Flachglas
    der Tarifnummer 70.05, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1087/72 della Commissione, del 26 maggio 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili al
    vetro tirato o soffiato, della voce doganale n. 70.05, originario della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2795/71
    del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1087/72 van de Commissie van 26 mei 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op getrokken of geblazen glas van post 70.05, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2795/71 van de Raad
    van 20 december 1971 algemene tariefpreferenties werden geopend
  type: main
