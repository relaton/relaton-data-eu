title:
- language: en
  script: Latn
  content: Regulation (EEC) No 385/73 of the Commission of 19 January 1973 on the
    methods of administrative cooperation to safeguard during the transitional period
    the free movement of goods in trade between the Community as originally constituted
    and the new Member States and in trade between the new Member States themselves
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 385/73 de la Commission, du 19 janvier 1973, relatif
    aux méthodes de coopération administrative destinées à assurer, pendant la
    période de transition, la libre circulation des marchandises dans les échanges
    entre la Communauté dans sa composition originaire et les nouveaux États membres
    et dans les échanges entre les nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 385/73 der Kommission vom 19. Januar 1973 über die
    Methoden der Zusammenarbeit der Verwaltungen zur Gewährleistung des freien Warenverkehrs
    im Handel zwischen der Gemeinschaft in ihrer ursprünglichen Zusammensetzung und
    den neuen Mitgliedstaaten sowie im Handel der neuen Mitgliedstaaten untereinander
    während der Übergangszeit
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 385/73 af 19. januar 1973 om metoderne
    for det administrative samarbejde med det formål i overgangsperioden at sikre
    den frie varetransport ved handel mellem Fællesskabet i dets oprindelige sammensætning
    og de nye medlemsstater, samt mellem de nye medlemsstater indbyrdes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 385/73 della Commissione, del 19 gennaio 1973, relativo
    ai metodi di cooperazione amministrativa destinati ad attuare nel periodo transitorio
    la libera circolazione delle merci negli scambi tra la Comunità nella sua composizione
    originaria ed i nuovi Stati membri, nonché negli scambi tra i nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 385/73 van de Commissie van 19 januari 1973 betreffende
    de methoden van administratieve samenwerking welke gedurende de overgangsperiode
    het vrije verkeer van goederen in het handelsverkeer tussen de Gemeenschap in
    haar oorspronkelijke samenstelling en de nieuwe Lid-Staten en in het handelsverkeer
    tussen de nieuwe Lid-Staten onderling moeten waarborgen
  type: main
