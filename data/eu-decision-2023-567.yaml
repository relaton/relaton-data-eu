    ülésszakán képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/567 del Consiglio del 9 marzo 2023 relativa alla posizione
    da adottare, a nome dell’Unione europea, alla 66a sessione della commissione
    Stupefacenti sull’inclusione di sostanze nelle tabelle della Convenzione unica
    sugli stupefacenti del 1961, modificata dal Protocollo del 1972, e della Convenzione
    sulle sostanze psicotrope del 1971
  type: main
- language: lv
  script: Latn
