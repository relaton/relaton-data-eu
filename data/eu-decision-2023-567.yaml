    Aufnahme von Stoffen in die Anhänge des Einheits-Übereinkommens von 1961 über
    Suchtstoffe in der durch das Protokoll von 1972 geänderten Fassung und des Übereinkommens
    von 1971 über psychotrope Stoffe zu vertretenden Standpunkt
  type: main
