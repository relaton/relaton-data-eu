title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/567 of 9 March 2023 on the position to be taken,
    on behalf of the European Union, in the 66th session of the Commission on Narcotic
    Drugs on the scheduling of substances under the Single Convention on Narcotic
    Drugs of 1961, as amended by the 1972 Protocol, and the Convention on Psychotropic
    Substances of 1971
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/567 du Conseil du 9 mars 2023 relative à la position
    à prendre au nom de l’Union européenne lors de la soixante-sixième session
    de la Commission des stupéfiants, en ce qui concerne l’inscription de substances
    aux tableaux annexés à la convention unique sur les stupéfiants de 1961, modifiée
    par le protocole de 1972, et à la convention sur les substances psychotropes
    de 1971
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/567 des Rates vom 9. März 2023 über den im Namen
