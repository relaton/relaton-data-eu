    medžiagų komisijos sesijoje, dėl medžiagų įtraukimo į sąrašą pagal 1961
    m. Bendrąją narkotinių medžiagų konvenciją su pakeitimais, padarytais 1972
    m. protokolu, ir 1971 m. Psichotropinių medžiagų konvenciją
  type: main
