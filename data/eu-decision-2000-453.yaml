  script: Latn
  content: '2000/453/EC: Commission Decision of 11 July 2000 amending Decision 96/252/EC
    accepting undertakings offered in connection with the anti-dumping proceeding
    concerning imports of certain tube or pipe fittings, of iron or steel, originating
    in the People''s Republic of China, Croatia and Thailand (notified under document
    number C(2000) 1957)'
  type: main
- language: fr
  script: Latn
