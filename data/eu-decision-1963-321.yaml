title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 mai 1963, autorisant la République italienne
    à différer le rapprochement des droits prévus dans son tarif national vers
    ceux du Tarif douanier commun en ce qui concerne l'huile d'olive, autre que vierge
  type: main
- language: de
  script: Latn
  content: '63/321/EWG: Entscheidung der Kommission vom 13. Mai 1963, mit der die
    Italienische Republik ermächtigt wird, für Olivenöl, anderes als Jungfernöl
    (Tarifnummer ex 15.07 B II a), die Angleichung der Zollsätze ihres Zolltarifs
    an die Zollsätze des Gemeinsamen Zolltarifs aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '63/321/CEE: Decisione della Commissione del 13 maggio 1963 che autorizza
    la Repubblica italiana a differire l''accostamento dei dazi previsti nella sua
    tariffa nazionale a quelli della tariffa doganale comune per quanto riguarda l''olio
    d''oliva non vergine'
  type: main
- language: nl
  script: Latn
  content: '63/321/EEG: Beschikking van de Commissie van 13 mei 1963 waarbij de Italiaanse
    Republiek wordt gemachtigd de aanpassing van de rechten van haar douanetarief
    aan die van het gemeenschappelijke douanetarief voor olijfolie, andere dan verkregen
    bij de eerste persing, uit te stellen'
  type: main
