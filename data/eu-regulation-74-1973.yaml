title:
- language: en
  script: Latn
  content: Regulation (EEC) No 74/73 of the Commission of 29 December 1972 amending
    Regulation (EEC) No 1600/72 amending the Annex to Regulation (EEC) No 1373/70
    on common detailed rules for the application of the system of import and export
    licences and advance fixing certificates for agricultural products subject to
    a single price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 74/73 de la Commission, du 29 décembre 1972, modifiant
    le règlement (CEE) n° 1600/72 qui modifie l' annexe du règlement (CEE) n°
    1373/70, portant modalités communes d' application du régime de certificats
    d' importation, d' exportation et de préfixation pour les produits agricoles
    soumis à un régime de prix unique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 74/73 der Kommission vom 29. Dezember 1972 zur Änderung
    der Verordnung (EWG) Nr. 1600/72 zur Änderung des Anhangs der Verordnung (EWG)
    Nr. 1373/70 über gemeinsame Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen
    sowie Vorausfestsetzungsbescheinigungen für landwirtschaftliche Erzeugnisse,
    die einem System gemeinsamer Preise unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 74/73 af 29. december 1972, om ændring
    af Forordning (EØF) nr. 1600/72, som ændrer bilaget til Forordning (EØF) nr.
    1373/70 om fælles gennemførelsesbestemmelser for import- og eksportlicenser
    samt forudfastsættelsesattester for landbrugsvarer, for hvilke der gælder en
    ordning med fællespriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 74/73 della Commissione, del 29 dicembre 1972, recante
    modifica del regolamento (CEE) n. 1600/72 che modifica l' allegato del regolamento
    (CEE) n. 1373/70, che stabilisce modalità comuni d' applicazione per il regime
    dei titoli di importazione, d' esportazione e di prefissazione per i prodotti
    agricoli soggetti a un regime di prezzo unico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 74/73 van de Commissie van 29 december 1972 houdende
    wijziging van Verordening (EEG) nr. 1600/72 tot wijziging van de bijlage van Verordening
    (EEG) nr. 1373/70 houdende gemeenschappelijke uitvoeringsbepalingen inzake het
    stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten
    waarvoor een stelsel van gemeenschappelijke prijzen geldt
  type: main
