title:
- language: en
  script: Latn
  content: '82/262/EEC: Commission Decision of 1 April 1982 establishing that the
    apparatus described as ''PHI - Auger electron spectrometer, model 5000, consisting
    of : - cylindrical - Auger electron optics, model 10-155 ; - Auger spectroscopy
    electronics system, model 50-510 ; - multiplex control, model 20-055 ; X-Y recorder,
    model 18-020 ; - Sputter ion gun, model 04-161 and - Sputter ion gun control,
    model 20-045'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/262/CEE: Décision de la Commission, du 1er avril 1982, constatant
    que l''importation de l''appareil dénommé "P.H.I. - Auger Electron Spectrometer,
    model 5000, consisting of : - cylindrical - Auger Electron Optics, model 10-155
    ; - Auger Spectroscopy Electronics System, model 50-510 ; - Multiplex Control,
    model 20-055 ; X-Y recorder, model 18-020 ; - Sputter Ion Gun, model 04-161 and
    Sputter Ion Gun Control model 20-045" ne peut être faite en franchise des droits
    du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/262/EWG: Entscheidung der Kommission vom 1. April 1982, mit der festgestellt
    wird, daß das Gerät ,,P.H.I. - Auger Electron Spectrometer, model 5000, consisting
    of: - cylindrical-Auger Electron Optics, model 10-155; - Auger Spectroscopy Eletronics
    System, model 50-510; - Multiplex Control, model 20-055 ; X-Y recorder, model
    18-020 ; - Sputter Ion Gun, model 04-161 and Sputter Ion Gun Control, model 20-045"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/262/EØF: Kommissionens beslutning af 1. april 1982 om fastslåelse
    af, at indførsel af apparatet "P.H.I. - Auger electron spectrometer, model 5000,
    consisting of: - cylindrical - Auger electron optics, model 10-155, - Auger spectroscopy
    electronics system, model 50-510; - multiplex control, model 20-055; X-Y recorder,
    model 18- 020; - Sputter ion gun, model 04-161 and Sputter ion gun control, model
    20-045" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/262/EOK: Απόφαση τής Επιτροπής τής 1ης Απριλίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «PHI auger electron spectrometer, model 5000, consisting
    of: cylindrical auger electron optics, model 10-155, auger spectroscopy electronics
    system, model 50- 510 ; multiplex control, model 20-055 ; X-Y recorder, model
    18-020 ; sputter ion gun, model 04-161, and sputter ion gun control, model 20-045»
    δέν δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/262/CEE: Decisione della Commissione, del 1 aprile 1982, che stabilisce
    che l''importazione dell''apparecchio denominato : "P.H.I. - Auger Electron Spectrometer,
    model 5000, consisting of : - Cylindrical - Auger Electron Optics, model 10-155
    ; - Auger Spectroscopy Electronics System, model 50-510 ; - Multiplex Control,
    model 20-055 ; X-Y recorder, model 18-020 ; - Sputter Ion Gun, model 04-161 and
    Sputter Ion Gun Control model 20-045" non può avvenire in franchigia dai dazi
    della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/262/EEG: Beschikking van de Commissie van 1 april 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,P.H.I.-Auger electron spectrometer, model
    5000, consisting of: cylindrical-Auger electron optics, model 10-155 ; Auger spectroscopy
    electronics system, model 50-510 ; Multiplex control, model 20-055 ; X-Y Recorder,
    model 18-020 ; Sputter ion gun, model 04-161 and Sputter ion gun control, model
    20-045" niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
  type: main
