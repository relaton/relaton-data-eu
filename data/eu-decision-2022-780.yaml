---
id: EUDecision2022780
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/780 of 13 April 2022 on the
    inconsistency of certain performance targets contained in the draft functional
    airspace block performance plan submitted by Switzerland pursuant to Regulation
    (EC) No 549/2004 of the European Parliament and of the Council with the Union-wide
    performance targets for the third reference period and setting out recommendations
    for the revision of those targets (notified under document C(2022) 2313) (Only
    the German, French and Italian texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/780 de la Commission du 13 avril 2022
    concernant l’incompatibilité de certains objectifs de performance contenus
    dans le projet de plan de performance au niveau des blocs d’espace aérien fonctionnels
    présenté par la Suisse conformément au règlement (CE) no 549/2004 du Parlement
    européen et du Conseil avec les objectifs de performance à l’échelle de l’Union
    pour la troisième période de référence et formulant des recommandations pour
    la révision de ces objectifs [notifiée sous le numéro C(2022) 2313] (Les textes
    en langue allemande, française et italienne sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/780 der Kommission vom 13. April 2022
    bezüglich der Inkohärenz bestimmter Leistungsziele, die in dem von der Schweiz
    gemäß der Verordnung (EG) Nr. 549/2004 des Europäischen Parlaments und des
    Rates vorgelegten Entwurf des Leistungsplans für die funktionalen Luftraumblöcke
    enthalten sind, mit den unionsweit geltenden Leistungszielen für den dritten
    Bezugszeitraum und zur Festlegung von Empfehlungen für die Überarbeitung dieser
    Ziele (Bekannt gegeben unter Aktenzeichen C(2022) 2313) (Nur der deutsche, französische
    und italienische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/780 на Комисията
    от 13 април 2022 година относно несъгласуваността
    на определени цели за ефективност, заложени
    в проектоплана за ефективност на равнище функционален
    блок въздушно пространство, представен от
    Швейцария в съответствие с Регламент (ЕО) №
    549/2004 на Европейския парламент и на Съвета,
    с валидните за целия Европейски съюз цели за
    ефективност за третия референтен период, както
    и за определяне на препоръки за преразглеждане
    на тези цели (нотифицирано под номер С(2022) 2313)
    (само текстовете на италиански, немски и френски
    език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/780 ze dne 13. dubna 2022 o nesouladu
    některých výkonnostních cílů obsažených v návrhu plánu výkonnosti funkčních
    bloků vzdušného prostoru předložených Švýcarskem podle nařízení Evropského
    parlamentu a Rady (ES) č. 549/2004 s výkonnostními cíli pro celou Unii pro
    třetí referenční období a o stanovení doporučení pro revizi těchto cílů
    (oznámeno pod číslem C(2022)2313) (Pouze německé, francouzské a italské
    znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/780 af 13. april 2022
    om uoverensstemmelse mellem visse præstationsmål i udkastet til præstationsplanen
    for den funktionelle luftrumsblok, der er forelagt af Schweiz i henhold til Europa-Parlamentets
    og Rådets forordning (EF) nr. 549/2004, og de unionsdækkende præstationsmål
    for den tredje referenceperiode og om fremsættelse af anbefalinger om revision
    af disse mål (meddelt under nummer C(2022) 2313) (Kun den franske, den italienske
    og den tyske udgave er autentiske)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2022/780 της Επιτροπής
    της 13ης Απριλίου 2022 σχετικά με την έλλειψη
    συνοχής ορισμένων στόχων επιδόσεων περιλαμβανόμενων
    στο προσχέδιο του σχεδίου επιδόσεων λειτουργικού
    τμήματος εναέριου χώρου που υποβλήθηκε από
    την Ελβετία σύμφωνα με τον κανονισμό (ΕΚ) αριθ.
    549/2004 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    με τους στόχους επιδόσεων σε κλίμακα Ένωσης
    για την τρίτη περίοδο αναφοράς, καθώς και σχετικά
    με τη διατύπωση συστάσεων για την αναθεώρηση
    των εν λόγω στόχων [κοινοποιηθείσα υπό τον
    αριθμό C(2022) 2313] (Τα κείμενα στη γαλλική, στη
    γερμανική και στην ιταλική γλώσσα είναι τα
    μόνα αυθεντικά)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/780, 13. aprill 2022, milles käsitletakse
    Euroopa Parlamendi ja nõukogu määruse (EÜ) nr 549/2004 kohaselt Šveitsi esitatud
    funktsionaalse õhuruumiosa tulemuslikkuse kava projektis sisalduvate teatavate
    tulemuseesmärkide mittevastavust kogu Euroopa Liitu hõlmavatele kolmanda võrdlusperioodi
    tulemuseesmärkidele ning milles antakse soovitused nimetatud eesmärkide läbivaatamiseks
    (teatavaks tehtud numbri C(2022) 2313 all) (Ainult itaalia-, prantsus- ja saksakeelne
    tekst on autentsed)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/780, annettu 13 päivänä
    huhtikuuta 2022, Sveitsin Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    549/2004 mukaisesti esittämään toiminnallista ilmatilan lohkoa koskevaan suorituskykysuunnitelman
    luonnokseen sisältyvien tiettyjen suorituskykytavoitteiden yhteensopimattomuudesta
    kolmannelle viiteajanjaksolle vahvistettujen unionin laajuisten suorituskykytavoitteiden
    kanssa sekä suosituksista kyseisten tavoitteiden tarkistamiseksi (tiedoksiannettu
    numerolla C(2022) 2313) (Ainoastaan italian-, ranskan- ja saksankieliset tekstit
    ovat todistusvoimaisia)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/780 ón gCoimisiún an 13 Aibreán
    2022 maidir le neamhréireacht spriocanna feidhmíochta áirithe a áirítear
    sa dréachtphlean feidhmíochta bloic feidhme aerspáis a chuir an Eilvéis isteach
    de bhun Rialachán (CE) Uimh. 549/2004 ó Pharlaimint na hEorpa agus ón gComhairle
    le spriocanna feidhmíochta uile-Aontais le haghaidh an tríú tréimhse thagartha
    agus lena leagtar amach moltaí chun na spriocanna sin a athbhreithniú (a bhfuil
    fógra tugtha ina leith faoi dhoiciméad C(2022)2313) (Is ag na téacsanna sa
    Ghearmáinis, sa Fhraincis agus san Iodáilis a bheidh an t-údarás agus acu
    siúd amháin)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/780 оd 13. travnja 2022. o neusklađenosti
    određenih ciljeva performansi uključenih u nacrt plana na razini funkcionalnog
    bloka zračnog prostora koje je dostavila Švicarska u skladu s Uredbom (EZ) br.
    549/2004 Europskog parlamenta i Vijeća s ciljevima performansi na razini Unije
    za treće referentno razdoblje te o donošenju preporuka za reviziju tih ciljeva
    (priopćeno pod brojem dokumenta C(2022) 2313) (Vjerodostojan je samo tekst na
    njemačkom, francuskom i talijanskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/780 végrehajtási határozata (2022. április 13.)
    az 549/2004/EK európai parlamenti és tanácsi rendelet alapján Svájc által
    benyújtott funkcionális légtérblokkszintű teljesítményterv-tervezetben
    foglalt bizonyos teljesítménycélok és a harmadik referencia-időszakra meghatározott
    uniós szintű teljesítménycélok közötti összhang hiányáról és az e
    célok felülvizsgálatára vonatkozó ajánlások felsorolásáról (az értesítés
    a C(2022) 2313. számú dokumentummal történt) (Csak a német, a francia és
    az olasz nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/780 della Commissione del 13 aprile 2022
    relativa all’incoerenza di taluni obiettivi prestazionali inclusi nel progetto
    di piano di miglioramento delle prestazioni per i blocchi funzionali di spazio
    aereo presentato dalla Svizzera a norma del regolamento (CE) n. 549/2004 del Parlamento
    europeo e del Consiglio con gli obiettivi prestazionali a livello dell’Unione
    per il terzo periodo di riferimento, recante raccomandazioni per la revisione
    di tali obiettivi [notificata con il numero C(2022) 2313] (I testi in lingua tedesca,
    francese e italiana sono i soli facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/780 (2022. gada 13. aprīlis)
    par dažu darbības uzlabošanas mērķu, kas iekļauti funkcionālā gaisa telpas
    bloka darbības uzlabošanas plāna projektā, kuru Šveice iesniegusi saskaņā
    ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 549/2004, neatbilstību Savienības
    mēroga darbības uzlabošanas mērķiem trešajam pārskata periodam, un ar ko
    nosaka ieteikumus šo mērķu pārskatīšanai (izziņots ar dokumenta numuru
    C(2022) 2313) (Autentisks ir tikai teksts franču, itāļu un vācu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/780 2022 m. balandžio 13
    d. dėl tam tikrų tikslinių veiklos rodiklių, nustatytų Šveicarijos pagal
    Europos Parlamento ir Tarybos reglamentą (EB) Nr. 549/2004 pateiktame funkcinio
    oro erdvės bloko plano projekte, nesuderinamumo su trečiojo ataskaitinio laikotarpio
    Sąjungos masto tiksliniais veiklos rodikliais, kuriame pateikiamos rekomendacijos
    dėl tų tikslinių rodiklių peržiūros (pranešta dokumentu Nr. C(2022) 2313)
    (Tekstas autentiškas tik italų, prancūzų ir vokiečių kalbomis)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/780 tat-13
    ta’ April 2022 dwar l-inkonsistenza ta’ ċerti miri tal-prestazzjoni li jinsabu
    fl-abbozz ta’ pjan tal-prestazzjoni ta’ blokk ta’ spazju tal-ajru funzjonali
    sottomess mill-Iżvizzera skont ir-Regolament (KE) Nru 549/2004 tal-Parlament
    Ewropew u tal-Kunsill mal-miri tal-prestazzjoni tal-Unjoni kollha għat-tielet
    perjodu referenzjarju u li tistabbilixxi rakkomandazzjonijiet għar-reviżjoni
    ta’ dawk il-miri (notifikata bid-dokument C(2022) 2313) (It-testi bil-Ġermaniż,
    bil-Franċiż u bit-Taljan biss huma awtentiċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/780 van de Commissie van 13 april 2022 inzake
    de onverenigbaarheid van bepaalde prestatiedoelstellingen in het overeenkomstig
    Verordening (EG) nr. 549/2004 van het Europees Parlement en de Raad door Zwitserland
    ingediende ontwerpprestatieplan voor functionele luchtruimblokken met de EU-wijde
    prestatiedoelstellingen voor de derde referentieperiode, en met aanbevelingen
    voor de herziening van deze doelstellingen (Kennisgeving geschied onder nummer
    C(2022) 2313) (Slechts de teksten in de Duitse, Franse en Italiaanse taal zijn
    authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/780 z dnia 13 kwietnia 2022 r. dotycząca
    niezgodności niektórych docelowych parametrów skuteczności działania zawartych
    w projekcie planu skuteczności działania na szczeblu funkcjonalnego bloku przestrzeni
    powietrznej przedłożonym przez władze Szwajcarii zgodnie z rozporządzeniem
    (WE) nr 549/2004 Parlamentu Europejskiego i Rady, z ustalonymi na trzeci okres
    odniesienia ogólnounijnymi docelowym parametrami skuteczności działania oraz
    wyznaczająca zalecenia w sprawie korekty tych celów (notyfikowana jako dokument
    nr C(2022) 2313) (Jedynie teksty w języku francuskim, niemieckim i włoskim są
    autentyczne)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/780 da Comissão de 13 de abril de 2022
    sobre a incoerência de determinados objetivos de desempenho previstos no projeto
    de plano de desempenho dos blocos funcionais de espaço aéreo apresentado pela
    Suíça ao abrigo do Regulamento (CE) n.o 549/2004 do Parlamento Europeu e do
    Conselho com os objetivos de desempenho a nível da União para o terceiro período
    de referência e que formula recomendações para a revisão desses objetivos
    [notificada com o número C(2022) 2313] (Apenas fazem fé os textos nas línguas
    alemã, francesa e italiana)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/780 a Comisiei din 13 aprilie
    2022 privind lipsa de coerență a anumitor obiective de performanță incluse
    în proiectul de plan de performanță la nivel de bloc funcțional de spațiu
    aerian prezentat de Elveția în temeiul Regulamentului (CE) nr. 549/2004 al Parlamentului
    European și al Consiliului cu obiectivele de performanță la nivelul Uniunii
    pentru cea de a treia perioadă de referință și care prevede recomandări pentru
    revizuirea obiectivelor respective [notificată cu numărul C(2022) 2313] (Numai
    textele în limbile germană, franceză și italiană sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/780 z 13. apríla 2022 o nesúlade
    niektorých výkonnostných cieľov uvedených v návrhu plánu výkonnosti funkčného
    bloku vzdušného priestoru, ktorý predložilo Švajčiarsko podľa nariadenia
    Európskeho parlamentu a Rady (ES) č. 549/2004, s celoúnijnými výkonnostnými
    cieľmi na tretie referenčné obdobie a ktorým sa stanovujú odporúčania na
    revíziu uvedených cieľov [oznámené pod číslom C(2022) 2313] (Iba nemecké,
    francúzske a talianske znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/780 z dne 13. aprila 2022 o neskladnosti
    nekaterih ciljev uspešnosti, vključenih v osnutek načrta izvedbe na ravni funkcionalnega
    bloka zračnega prostora, ki ga je Švica predložila v skladu z Uredbo (ES) št.
    549/2004 Evropskega parlamenta in Sveta, z vseevropskimi cilji uspešnosti za
    tretje referenčno obdobje ter o določitvi priporočil za revizijo navedenih
    ciljev (notificirano pod dokumentarno številko C(2022) 2313) (Besedilo v francoskem,
    italijanskem in nemškem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/780 de la Comisión de 13 de abril de
    2022 relativa a la incoherencia de determinados objetivos de rendimiento incluidos
    en el proyecto de plan de rendimiento a escala de bloque funcional de espacio
    aéreo presentado por Suiza con arreglo al Reglamento (CE) n.o 549/2004 del Parlamento
    Europeo y del Consejo con los objetivos de rendimiento para toda la Unión en
    el tercer período de referencia y en la que se formulan recomendaciones para
    la revisión de dichos objetivos [notificada con el número C(2022) 2313] (Los
    textos en lenguas alemana, francesa e italiana son los únicos auténticos)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/780 av den 13 april 2022 om
    bristande överensstämmelse vad gäller vissa prestationsmål i det utkast till
    prestationsplan på nivån för funktionella luftrumsblock som har lämnats in
    av Schweiz i enlighet med Europaparlamentets och rådets förordning (EG) nr 549/2004
    med de unionstäckande prestationsmålen för den tredje referensperioden samt
    rekommendationer för översyn av dessa mål (delgivet med nr C(2022)2313) (Endast
    de franska, italienska och tyska texterna är giltiga)
