id: EUDecision1978391
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 April 1978 authorizing the Federal Republic of
    Germany not to apply Community treatment to men's and boys' woven jackets and
    blazers, falling within heading No ex 61.01 of the Common Customs Tariff, originating
    in Macao and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/391/CEE: Décision de la Commission, du 6 avril 1978, autorisant la
    République fédérale d''Allemagne à exclure du traitement communautaire les
    vestes et vestons tissés pour hommes et garçonnets de la position Ex 61.01 du
    Tarif douanier commun, originaires de Macao et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. April 1978, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus Macao stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Sakkos und Jacken aus Geweben, für Männer und
    Knaben, der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 6. april 1978 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage jakker og blazere (undtagen
    arbejdsjakker, hjemmejakker og strandjakker) vævede, til mænd og drenge, som
    henhører under pos. ex 61.01 i den fælles toldtarif, har oprindelse i Macao,
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 aprile 1978, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario le giacche e giacchette
    per uomo e ragazzo della voce ex 61.01 della tariffa doganale comune, originarie
    di Macao e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 april 1978 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd colbertjassen en blazers, geweven, voor heren en jongens,
    van post ex 61.01, van het gemeenschappelijk douanetarief, van oorsprong uit Macao
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
