  content: Commission Implementing Decision (EU) 2026/79 of 12 January 2026 amending
    Commission Implementing Decision (EU) 2025/165 as regards harmonised standards
    for seamless steel tubes, butt-welding pipe fittings, copper and copper alloys,
    unfired pressure vessels, flanges and their joints, industrial valves, and safety
    devices for protection against excessive pressure, drafted in support of Directive
    2014/68/EU of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
