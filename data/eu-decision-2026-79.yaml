    modifiant la décision d’exécution (UE) 2025/165 de la Commission en ce qui
    concerne les normes harmonisées relatives aux tubes en acier sans soudure, aux
    raccords à souder bout à bout, au cuivre et aux alliages de cuivre, aux récipients
    sous pression non soumis à la flamme, aux brides et à leurs assemblages, à
    la robinetterie industrielle et aux dispositifs de sécurité pour protection
    contre les pressions excessives, élaborées à l’appui de la directive 2014/68/UE
    du Parlement européen et du Conseil
  type: main
