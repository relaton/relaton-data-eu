    Kupfer und Kupferlegierungen, unbefeuerte Druckbehälter, Flansche und ihre Verbindungen,
    Industriearmaturen und Sicherheitseinrichtungen gegen unzulässigen Überdruck
    zur Unterstützung der Richtlinie 2014/68/EU des Europäischen Parlaments und
    des Rates
