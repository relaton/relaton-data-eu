  content: Commission Regulation (EEC) No 1311/86 of 2 May 1986 re-establishing the
    levying of customs duties on diodes, transistors and similar semiconductor devices,
    light-emitting diodes, electronic micro-circuits and parts, falling within subheadings
    85.21 D and E, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
