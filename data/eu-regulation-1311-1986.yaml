    similaires à semi-conducteur, diodes émettrices de lumière, microstructures
    électroniques et parties et pièces détachées de la sous-position 85.21 D,
    E du tarif douanier commun, originaires de la Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
