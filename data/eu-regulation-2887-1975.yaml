- language: en
  script: Latn
  content: Regulation (EEC) No 2887/75 of the Council of 29 October 1975 on the opening,
    allocation and administration of a Community tariff quota for dried grapes in
    immediate containers of a net capacity of 15 kg or less, falling within subheading
    08.04 B I of the Common Customs Tariff (1976)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2887/75 du Conseil, du 29 octobre 1975, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de raisins
    secs présentés en emballages immédiats d'un contenu net inférieur ou égal
    à 15 kilogrammes, de la sous-position 08.04 B I du tarif douanier commun (année
    1976)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2887/75 des Rates vom 29. Oktober 1975 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Weintrauben
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 Kilogramm
    oder weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs (1976)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2887/75 af 29. oktober 1975 om åbning, fordeling
