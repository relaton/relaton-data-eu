title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 266/70 de la Commission, du 12 février 1970, relatif
    à la diminution du montant compensatoire, applicable dans le secteur du sucre
    à certaines exportations françaises vers les pays tiers et complétant le règlement
    (CEE) n° 1669/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 266/70 der Kommission vom 12. Februar 1970 zur Verminderung
    des im Zuckersektor auf bestimmte französische Ausfuhren nach Drittländern anwendbaren
    Ausgleichsbetrags und zur Ergänzung der Verordnung (EWG) Nr. 1669/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 266/70 della Commissione, del 12 febbraio 1970, che
    diminuisce l'importo di compensazione applicabile nel settore dello zucchero ad
    alcune esportazioni francesi verso i paesi terzi ed integra il regolamento (CEE)
    n. 1669/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 266/70 van de Commissie van 12 februari 1970 betreffende
    de vermindering van het compenserende bedrag dat in de sector suiker geheven wordt
    bij bepaalde uitvoertransacties van Frankrijk naar derde landen, en houdende aanvulling
    van Verordening (EEG) nr. 1669/69
  type: main
