    steun die voor 1999 wordt toegekend aan telersverenigingen die een actiefonds
    vormen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1067/2000 da Comissão, de 19 de Maio de 2000, que
    fixa, a título do Regulamento (CE) n.o 411/97, o limite máximo de ajuda financeira
    comunitária a conceder às organizações de produtores que constituíram um
    fundo operacional para 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1067/2000 de la Comisión, de 19 de mayo de 2000, por
