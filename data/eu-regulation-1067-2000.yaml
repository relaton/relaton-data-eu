    (EG) Nr. 411/97 zu gewährenden Beihilfe für 1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1067/2000 af 19. maj 2000 om fastsættelse
    i henhold til forordning (EF) nr. 411/97 af loftet over den finansielle fællesskabsstøtte,
    der ydes til producentorganisationer, som har oprettet en driftsfond for året
    1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1067/2000 της Επιτροπής,
