  script: Latn
  content: Commission Regulation (EC) No 1067/2000 of 19 May 2000 fixing, for the
    purposes of Regulation (EC) No 411/97, the ceiling for Community financial assistance
    granted to producer organisations setting up operational funds for 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1067/2000 de la Commission du 19 mai 2000 fixant, au
    titre du règlement (CE) nº 411/97, pour l'année 1999, le plafond de l'aide
    financière communautaire à octroyer aux organisations de producteurs ayant constitué
    un fonds opérationnel
  type: main
- language: de
  script: Latn
