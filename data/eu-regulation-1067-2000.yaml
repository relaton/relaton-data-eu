    με τον κανονισμό (ΕΚ) αριθ. 411/97, του ανωτάτου
    ορίου της κοινοτικής οικονομικής ενισχύσεως
    που θα χορηγηθεί στις οργανώσεις παραγωγών
    που έχουν συστήσει επιχειρησιακό ταμείο για
    το 1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1067/2000, annettu 19 päivänä toukokuuta 2000,
    asetuksen (EY) N:o 411/97 mukaisesti vuodeksi 1999 toimintarahaston perustaneille
    tuottajaorganisaatioille myönnettävän yhteisön taloudellisen tuen enimmäismäärästä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1067/2000 della Commissione, del 19 maggio 2000, che
    fissa, nel quadro del regolamento (CE) n. 411/97, il massimale dell'aiuto finanziario
    comunitario a favore delle organizzazioni di produttori che hanno costituito un
    fondo di esercizio per il 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1067/2000 van de Commissie van 19 mei 2000 tot vaststelling,
