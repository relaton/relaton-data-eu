  content: Council Regulation (EC) No 2315/2000 of 17 October 2000 amending Regulation
    (EC) No 2402/98 imposing a definitive anti-dumping duty on imports of unwrought
    unalloyed magnesium originating in the People's Republic of China
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2315/2000 du Conseil du 17 octobre 2000 modifiant le
    règlement (CE) nº 2402/98 instituant un droit antidumping définitif sur les
    importations de magnésium non allié sous forme brute originaire de la République
    populaire de Chine
  type: main
- language: de
  script: Latn
