    κανονισμού (ΕΚ) αριθ. 2402/98 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ακατέργαστου
    μη κεκραμένου μαγνησίου καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2315/2000, annettu 17 päivänä lokakuuta 2000,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta
    peräisin olevan muokkaamattoman ja seostamattoman magnesiumin tuonnissa annetun
    asetuksen (EY) N:o 2402/98 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2315/2000 del Consiglio, del 17 ottobre 2000, recante
