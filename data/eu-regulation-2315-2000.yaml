  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2315/2000 do Conselho, de 17 de Outubro de 2000, que
    altera o Regulamento (CE) n.o 2402/98 que institui um direito anti-dumping definitivo
