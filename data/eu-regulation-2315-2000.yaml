    der Verordnung (EG) Nr. 2402/98 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von nichtlegiertem Magnesium in Rohform mit Ursprung in der
    Volksrepublik China
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2315/2000 af 17. oktober 2000 om ændring af
    forordning (EF) nr. 2402/98 om indførelse af en endelig antidumpingtold på importen
    af ubearbejdet, ulegeret magnesium med oprindelse i Folkerepublikken Kina
  type: main
- language: el
  script: Grek
