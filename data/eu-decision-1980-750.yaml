title:
- language: en
  script: Latn
  content: '80/750/EEC: Commission Decision of 14 July 1980 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, other than those of category 10, of wool,
    of cotton or of man-made textile fibres, falling within heading No ex 60.02 of
    the Common Customs Tariff (category 11), originating in Taiwan and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/750/CEE: Décision de la Commission, du 14 juillet 1980, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, autre que celle de la catégorie 10,
    de laine, de coton ou de fibres textiles synthétiques ou artificielles de la
    position ex 60.02 du tarif douanier commun (catégorie 11), originaire de T''aï-wan
    et mise en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/750/EWG: Entscheidung der Kommission vom 14. Juli 1980 mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, andere als Waren der Kategorie 10, aus Wolle, Baumwolle oder
    synthetischen oder künstlichen Spinnstoffen, der Tarifnummer ex 60.02 des Gemeinsamen
    Zolltarifs (Kategorie 11) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/750/EØF: Kommissionens beslutning af 14. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, ikke elastisk, bortset fra varer i kategori 10, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 60.02 i den fælles
    toldtarif (kategori 11), har oprindelse i Taiwan og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/750/CEE: Decisione della Commissione, del 14 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, diversi da quelli della categoria 10, di lana, di cotone
    o di fibre tessili sintetiche o artificiali, della voce ex 60.02 della tariffa
    doganale comune, categoria 11, originari di Taiwan e messi in libera pratica negli
    altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/750/EEG: Beschikking van de Commissie van 14 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd handschoenen, wanten en dergelijke van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, andere dan die van categorie 10, van
    wol, van katoen of van synthetische of kunstmatige textielvezels, van post ex
    60.02 van het gemeenschappelijk douanetarief (categorie 11), van oorsprong uit
    Taiwan en in de overige Lid- Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
