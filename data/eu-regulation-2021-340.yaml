    modifiant les règlements délégués (UE) 2019/2013, (UE) 2019/2014, (UE) 2019/2015,
    (UE) 2019/2016, (UE) 2019/2017 et (UE) 2019/2018 en ce qui concerne les exigences
    en matière d’étiquetage énergétique applicables aux dispositifs d’affichage
    électroniques, aux lave-linge ménagers et aux lave-linge séchants ménagers,
    aux sources lumineuses, aux appareils de réfrigération, aux lave-vaisselle ménagers
    et aux appareils de réfrigération disposant d’une fonction de vente directe
  type: main
