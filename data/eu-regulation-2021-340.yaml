  content: Commission Delegated Regulation (EU) 2021/340 of 17 December 2020 amending
    Delegated Regulations (EU) 2019/2013, (EU) 2019/2014, (EU) 2019/2015, (EU) 2019/2016,
    (EU) 2019/2017 and (EU) 2019/2018 with regard to energy labelling requirements
    for electronic displays, household washing machines and household washer-dryers,
    light sources, refrigerating appliances, household dishwashers, and refrigerating
    appliances with a direct sales function
  type: main
- language: fr
