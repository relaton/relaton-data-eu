    Ljudske republike Kitajske, kakor je bila razširjena na uvoz jeklenih vrvi in
    kablov, poslanih iz Maroka in Republike Koreje, ne glede na to, ali so deklarirani
    kot izdelek s poreklom iz teh držav ali ne, po pregledu zaradi izteka ukrepov
    v skladu s členom 11(2) Uredbe (EU) 2016/1036 Evropskega parlamenta in Sveta
  type: main
