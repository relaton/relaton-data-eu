  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1666 оd 6. lipnja 2024. o uvođenju
    konačne antidampinške pristojbe na uvoz čelične užadi i kabela podrijetlom
    iz Narodne Republike Kine kako je proširena na uvoz čelične užadi i kabela
    poslanih iz Maroka i Republike Koreje, bez obzira na to imaju li deklarirano podrijetlo
    iz tih zemalja ili ne, nakon revizije zbog predstojećeg isteka mjera u skladu
    s člankom 11. stavkom 2. Uredbe (EU) 2016/1036 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
