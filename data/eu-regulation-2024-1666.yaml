    pocházejících z Čínské lidové republiky, rozšířené na dovoz ocelových
    lan a kabelů zasílaných z Maroka a Korejské republiky, bez ohledu na to, zda
    je u něj deklarován původ z těchto zemí, na základě přezkumu před pozbytím
