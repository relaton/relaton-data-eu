    om införande av en slutgiltig antidumpningstull på import av linor och kablar
    av stål med ursprung i Folkrepubliken Kina, som utvidgats till att även omfatta
    import av linor och kablar av stål som avsänts från Marocko och Sydkorea, oavsett
