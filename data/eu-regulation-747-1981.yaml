title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 747/81 of 23 March 1981 fixing for the second
    quarter of 1981, the quantities of high-quality, fresh, chilled or frozen beef
    and veal which may be imported under special conditions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 747/81 de la Commission, du 23 mars 1981, fixant les
    quantités de viandes bovines de haute qualité, fraîches, réfrigérées ou
    congelées pouvant être importées à des conditions spéciales pour le deuxième
    trimestre de 1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 747/81 der Kommission vom 23. März 1981 zur Festsetzung
    der Mengen frischen, gekühlten oder gefrorenen Qualitätsrindfleisches, die für
    das zweite Vierteljahr 1981 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 747/81 af 23. marts 1981 om fastsættelse
    af de mængder fersk, kølet eller frosset oksekød af høj kvalitet, der kan
    indføres på særbetingelser i andet kvartal af 1981
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 747/81 της Επιτροπής
    της 23ης Μαρτίου 1981 περί των ποσοτήτων βοείου
    κρέατος ανωτέρας ποιότητος, νωπού, διατηρημένου
    δι' απλής ψύξεως η κατεψυγμένου, πού δύνανται
    να εισαχθούν υπό ειδικούς όρους για το δεύτερο
    τρίμηνο του 1981
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 747/81 della Commissione, del 23 marzo 1981, che fissa
    le quantità di carni bovine di qualità pregiata, fresche, refrigerate o congelate,
    che possono essere importate a condizioni speciali per il secondo trimestre 1981
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 747/81 van de Commissie van 23 maart 1981 tot vaststelling
    van de hoeveelheid vers, gekoeld of bevroren kwaliteitsrundvlees dat in het tweede
    kwartaal van 1981 op bijzondere voorwaarden kan worden ingevoerd
  type: main
