    ja maksujen määrittämisestä sekä niihin liittyvistä korjausmääristä annetun
    asetuksen (ETY) N:o 1613/71 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3320/75 della Commissione, del 19 dicembre 1975, che
