    levies on rice and broken rice and the corrective amounts relating thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3320/75 de la Commission, du 19 décembre 1975, modifiant
    le règlement (CEE) n° 1613/71 arrêtant les modalités de détermination des
    prix caf et des prélèvements du riz et des brisures, ainsi que les montants
    correcteurs y afférents
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3320/75 der Kommission vom 19. Dezember 1975 zur Änderung
