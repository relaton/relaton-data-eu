    Bestimmung der cif-Preise und der Abschöpfungen für Reis und Bruchreis sowie
    der diesbezüglichen Berichtigungsbeträge
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3320/75 af 19. december 1975 om ændring
