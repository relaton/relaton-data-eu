    82/894/EWG des Rates sowie zur Aufhebung der Entscheidungen 84/90/EWG und 90/442/EWG
    (Bekannt gegeben unter Aktenzeichen K(2000) 3701)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 11. prosince 2000 o stanovení kódované formy
