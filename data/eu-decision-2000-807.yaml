    ja tunnistatakse kehtetuks otsused 84/90/EMÜ ja 90/442/EMÜ (teatavaks tehtud
    numbri K(2000) 3701 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 11 päivänä joulukuuta 2000, neuvoston direktiivin
