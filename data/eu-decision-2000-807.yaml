    sekä päätösten 84/90/ETY ja 90/442/ETY kumoamisesta (tiedoksiannettu numerolla
    K(2000) 3701) (ETA:n kannalta merkityksellinen teksti) (2000/807/EY)
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2000. december 11.) az állatbetegségek 82/894/EGK
