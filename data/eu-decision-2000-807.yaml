    direktiv 82/894/EØF og om ophævelse af beslutning 84/90/EØF og 90/442/EØF
    (meddelt under nummer K(2000) 3701)'
  type: main
- language: el
  script: Grek
  content: '2000/807/ΕΚ: Απόφαση της Επιτροπής, της 11ης
    Δεκεμβρίου 2000, για τον καθορισμό της κωδικοποιημένης
    μορφής και των κωδικών όσον αφορά τη γνωστοποίηση
    ασθενειών ζώων σύμφωνα με την οδηγία 82/894/ΕΟΚ
    του Συμβουλίου και για την κατάργηση των αποφάσεων
    84/90/ΕΟΚ και 90/442/ΕΟΚ [κοινοποιηθείσα υπό τον
    αριθμό Ε(2000) 3701]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 11. detsember 2000, millega kehtestatakse kodeeritud vorm
