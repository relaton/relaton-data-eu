title:
- language: en
  script: Latn
  content: '2000/807/EC: Commission Decision of 11 December 2000 laying down the codified
    form and the codes for the notification of animal diseases pursuant to Council
    Directive 82/894/EEC and repealing Decisions 84/90/EEC and 90/442/EEC (notified
    under document number C(2000) 3701)'
  type: main
- language: fr
  script: Latn
  content: '2000/807/CE: Décision de la Commission du 11 décembre 2000 établissant
    la forme codifiée et les codes relatifs à la notification des maladies des animaux
    en application de la directive 82/894/CEE du Conseil et abrogeant les décisions
    84/90/CEE et 90/442/CEE [notifiée sous le numéro C(2000) 3701]'
  type: main
- language: de
  script: Latn
  content: '2000/807/EG: Entscheidung der Kommission vom 11. Dezember 2000 zur Festlegung
