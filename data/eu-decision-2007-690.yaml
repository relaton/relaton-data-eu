  script: Latn
  content: Council Decision 2007/690/CFSP of 22 October 2007 implementing Joint Action
    2005/557/CFSP on the European Union civilian-military supporting action to the
    African Union missions in the Darfur region of Sudan and in Somalia
  type: main
- language: fr
  script: Latn
  content: Décision 2007/690/PESC du Conseil du 22 octobre 2007 mettant en œuvre
