    unie v oblasti Dárfúru v Súdánu a v Somálsku
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2007/690/FUSP af 22. oktober 2007 om gennemførelse
    af fælles aktion 2005/557/FUSP om Den Europæiske Unions civil-militære aktion
    til støtte for Den Afrikanske Unions mission i Darfur-området i Sudan og i Somalia
  type: main
- language: el
  script: Grek
  content: Απόφαση 2007/690/ΚΕΠΠΑ του Συμβουλίου, της
