title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2615/95 of 9 November 1995 amending and derogating
    partly from Regulation (EC) No 3338/93 in order to provide for the payment of
    financial compensation to producers of certain citrus fruits
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2615/95 de la Commission, du 9 novembre 1995, modifiant
    et dérogeant pour partie au règlement (CE) nº 3338/93 pour prévoir le paiement
    de la compensation financière aux producteurs de certains agrumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2615/95 der Kommission vom 9. November 1995 zur Änderung
    und teilweisen Abweichung von der Verordnung (EG) Nr. 3338/93 im Hinblick auf
    die Zahlung des finanziellen Ausgleichs an die Erzeuger bestimmter Zitrusfrüchte
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2615/95 af 9. november 1995 om ændring
    af og delvis undtagelse fra forordning (EF) nr. 3338/93 med henblik på udbetaling
    af udligningstilskuddet til citrusfrugtproducenterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2615/95 της Επιτροπής
    της 9ης Νοεμβρίου 1995 σχετικά με την τροποποίηση
    και την εν μέρει παρέκκλιση από τον κανονισμό
    (ΕΚ) αριθ. 3338/93 για να προβλεφθεί η καταβολή
    της χρηματικής αντιστάθμισης στους παραγωγούς
    ορισμένων εσπεριδοειδών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2615/95, annettu 9 päivänä marraskuuta 1995,
    asetuksen (EY) N:o 3338/93 muuttamisesta ja siitä osittain poikkeamisesta tiettyjen
    sitrushedelmien tuottajille maksettavan rahallisen korvauksen vahvistamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2615/95 della Commissione, del 9 novembre 1995, recante
    modifica e deroga parziale del regolamento (CE) n. 3388/93 per prevedere il pagamento
    della compensazione finanziaria ai produttori di taluni agrumi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2615/95 van de Commissie van 9 november 1995 houdende
    wijziging en gedeeltelijke afwijking van Verordening (EG) nr. 3338/93 met het
    oog op de betaling van de financiële vergoeding aan producenten van bepaalde
    citrusvruchten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2615/95 da Comissão, de 9 de Novembro de 1995, que
    altera e derroga parcialmente o Regulamento (CE) nº 3338/93 a fim de prever o
    pagamento da compensão financeira aos produtores de determinados citrinos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2615/95 de la Comisión, de 9 de noviembre de 1995,
    por el que se modifica el Reglamento (CE) nº 3338/93 y se establecen parcialmente
    excepciones al mismo a efectos del pago de la compensación financiera a los productores
    de determinados cítricos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2615/95 av den 9 november 1995 om ändring
    av och delvis avsteg från förordning (EG) nr 3338/93 för föreskrifter beträffande
    utbetalningen av utjämningsbidraget till producenter av vissa citrusfrukter
