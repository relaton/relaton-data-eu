    atbilstības, modulācijas un integrētās administrācijas un kontroles sistēmas
    ieviešanai, kas paredzēta Padomes Regulā (EK) Nr. 1782/2003, ar ko izveido
    kopīgus tiešā atbalsta shēmu noteikumus saskaņā ar kopējo lauksaimniecības
    politiku un izveido dažas atbalsta shēmas lauksaimniekiem
  type: main
