title:
- language: en
  script: Latn
  content: Regulation (EEC) No 441/69 of the Council of 4 March 1969 laying down additional
    general rules for granting export refunds on products subject to a single price
    system, exported unprocessed or in the form of certain goods not covered by Annex
    II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n°441/69 du Conseil, du 4 mars 1969, établissant des
    règles générales complémentaires concernant l' octroi des restitutions à
    l' exportation pour les produits soumis à un régime de prix uniques, exportés
    en l' état ou sous forme de certaines marchandises ne relevant pas de l' annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 441/69 des Rates vom 4. März 1969 zur Festlegung
    ergänzender Grundregeln für die Gewährung von Ausfuhrerstattungen für die
    einer einheitlichen Preisregelung unterliegenden Erzeugnisse, die unbearbeitet
    oder in Form bestimmter, nicht unter Anhang II des Vertrages fallender Waren ausgeführt
    werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 441/69 af 4. marts 1969 om supplerende hovedregler
    for ydelse af eksportrestitutioner til de produkter, for hvilke der gælder en
    ordning med en enhedspris, og som udføres i uforandret stand eller i form af
    visse varer, som ikke henhører under traktatens bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 441/69 τού Συμβουλίου
    τής 4ης Μαρτίου 1969 περί καθορισμού τών γενικών
    συμπληρωματικών κανόνων γιά τή χορήγηση επιστροφών
    κατά τήν εξαγωγή γιά τά προϊόντα πού υπόκεινται
    σέ καθεστώς ενιαίων τιμών καί εξάγονται στήν
    κατάσταση πού ευρίσκονται ή υπό μορφή ορισμένων
    εμπορευμάτων πού δέν υπάγονται στό παράρτημα
    ΙΙ τής συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 441/69 del Consiglio, del 4 marzo 1969, che stabilisce
    le norme generali complementari concernenti la concessione delle restituzioni
    all' esportazione per i prodotti soggetti a un regime di prezzi unici, esportati
    allo stato naturale e sotto forma di talune merci non comprese nell' allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 441/69 van de Raad van 4 maart 1969 houdende aanvullende
    algemene voorschriften betreffende de toekenning van restituties bij uitvoer van
    produkten die aan een stelsel van gemeenschappelijke prijzen zijn onderworpen
    en die als zodanig of in de vorm van bepaalde niet in bijlage II van het Verdrag
    vermelde goederen worden uitgevoerd
  type: main
