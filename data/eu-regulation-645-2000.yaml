title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 645/2000 of 28 March 2000 setting out detailed
    implementing rules necessary for the proper functioning of certain provisions
    of Article 7 of Council Directive 86/362/EEC and of Article 4 of Council Directive
    90/642/EEC concerning the arrangements for monitoring the maximum levels of pesticide
    residues in and on cereals and products of plant origin, including fruit and vegetables,
    respectively
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 645/2000 de la Commission, du 28 mars 2000, établissant
    les modalités d'application nécessaires au bon fonctionnement de certaines dispositions
    de l'article 7 de la directive 86/362/CEE et de l'article 4 de la directive 90/642/CEE
    concernant respectivement la surveillance des teneurs maximales pour les résidus
    de pesticides sur et dans les céréales et sur et dans certains produits d'origine
    végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 645/2000 der Kommission vom 28. März 2000 mit Durchführungsbestimmungen
