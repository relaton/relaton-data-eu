    86/362/EWG und Artikel 4 der Richtlinie 90/642/EWG hinsichtlich der Kontrolle
    der Höchstgehalte an Rückständen von Schädlingsbekämpfungsmitteln auf und
    in Getreide bzw. bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich
    Obst und Gemüse
  type: main
