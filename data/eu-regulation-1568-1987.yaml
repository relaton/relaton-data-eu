  script: Latn
  content: Regolamento (CEE) n. 1568/87 della Commissione del 4 giugno 1987 recante
    modifica del regolamento (CEE) n. 2417/82 che istituisce una sorveglianza comunitaria
    a posteriori sulle importazioni di taluni prodotti tessili originari della Tunisia
    e del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1568/87 van de Commissie van 4 juni 1987 tot wijziging
