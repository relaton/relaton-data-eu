  content: Commission Regulation (EEC) No 3384/87 of 11 November 1987 re-establishing
    the levying of customs duties on oxalic acid and its salts and esters, falling
    within subheading 29.15 A I of the Common Customs Tariff, originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
