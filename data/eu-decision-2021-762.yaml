    под номер С(2021) 3127) (само текстът на английски
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/762 ze dne 6. května 2021 o
    prodloužení platnosti opatření přijatého irským Ministerstvem pro zemědělství,
    potraviny a rybolov povolujícího dodávání biocidních přípravků obsahujících
    propan-2-ol na trh a jejich používání jako přípravků pro osobní hygienu
    v souladu s čl. 55 odst. 1 nařízení Evropského parlamentu a Rady (EU) č.
    528/2012 (oznámeno pod číslem C(2021) 3127) (Pouze anglické znění je závazné)
  type: main
