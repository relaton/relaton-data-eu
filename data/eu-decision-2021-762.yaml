title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/762 of 6 May 2021 concerning
    the extension of the action taken by the Irish Department of Agriculture, Food
    and the Marine permitting the making available on the market and use of biocidal
    products containing propan-2-ol for use as human hygiene products in accordance
    with Article 55(1) of Regulation (EU) No 528/2012 of the European Parliament and
    of the Council (notified under document C(2021) 3127) (Only the English text is
    authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/762 de la Commission du 6 mai 2021 concernant
    la prorogation de la mesure prise par le ministère irlandais de l’agriculture,
    de l’alimentation et des affaires maritimes autorisant la mise à disposition
    sur le marché et l’utilisation des produits biocides contenant du propan-2-ol
    en tant que produits d’hygiène humaine conformément à l’article 55, paragraphe
    1, du règlement (UE) no 528/2012 du Parlement européen et du Conseil [notifiée
    sous le numéro C(2021) 3127] (Le texte en langue anglaise est le seul faisant
    foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/762 der Kommission vom 6. Mai 2021 über
    die Verlängerung der vom irischen Ministerium für Landwirtschaft, Lebensmittel
    und maritime Angelegenheiten getroffenen Maßnahme zur Genehmigung der Bereitstellung
    auf dem Markt und der Verwendung von Propan-2-ol enthaltenden Biozidprodukten
    zur Verwendung als Produkte für die menschliche Hygiene gemäß Artikel 55 Absatz
    1 der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments und des Rates
    (Bekannt gegeben unter Aktenzeichen C(2021) 3127) (Nur der englische Text ist
    verbindlich)
  type: main
- language: bg
  script: Cyrl
