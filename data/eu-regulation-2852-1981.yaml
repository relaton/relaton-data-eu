  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2852/81 del Consiglio, del 28 settembre 1981, che
    deroga al regolamento (CEE) n. 343/79 per quanto concerne le norme generali per
    la distillazione dei vini da tavola decisa ai sensi dell' articolo 12 bis del
    regolamento (CEE) n. 337/79
  type: main
- language: nl
