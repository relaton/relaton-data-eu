  content: Council Regulation (EEC) No 2852/81 of 28 September 1981 derogating from
    Regulation (EEC) No 343/79 in respect of general rules relating to the distillation
    of table wines decided upon in accordance with Article 12a of Regulation (EEC)
    No 337/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2852/81 du Conseil, du 28 septembre 1981, dérogeant
    au règlement (CEE) n° 343/79 en ce qui concerne les règles générales de distillation
    de vins de table décidée conformément à l' article 12 bis du règlement (CEE)
    n° 337/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2852/81 des Rates vom 28. September 1981 zur Abweichung
    von der Verordnung (EWG) Nr. 343/79 hinsichtlich der allgemeinen Regeln der nach
    Artikel 12a der Verordnung (EWG) Nr. 337/79 beschlossenen Destillation von Tafelwein
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2852/81 af 28. september 1981 om afvigelse
    fra forordning (EØF) nr. 343/79 for så vidt angår de almindelige regler for
    destillation af bordvin, som er besluttet i henhold til artikel 12a i forordning
    (EØF) nr. 337/79
  type: main
- language: el
  script: Grek
