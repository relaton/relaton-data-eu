  script: Latn
  content: '2001/936/EC: Commission Decision of 28 December 2001 derogating from Council
    Decision 2001/822/EC, as regards the rules of origin for prepared and preserved
    shrimps and prawns from Greenland (notified under document number C(2001) 4648)'
  type: main
- language: fr
  script: Latn
  content: '2001/936/CE: Décision de la Commission du 28 décembre 2001 portant dérogation
