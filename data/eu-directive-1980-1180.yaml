title:
- language: en
  script: Latn
  content: Council Directive 80/1180/EEC of 4 December 1980 amending, consequent on
    the accession of Greece, Directive 77/796/EEC aiming at the mutual recognition
    of diplomas, certificates and other evidence of formal qualifications for goods
    haulage operators and road passenger transport operators, including measures intended
    to encourage these operators effectively to exercise their right to freedom of
    establishment
  type: main
- language: fr
  script: Latn
  content: Directive 80/1180/CEE du Conseil, du 4 décembre 1980, modifiant, en raison
    de l'adhésion de la Grèce, la directive 77/796/CEE visant à la reconnaissance
    mutuelle des diplômes, certificats et autres titres de transporteur de marchandises
    et de transporteur de personnes par route et comportant des mesures destinées
    à favoriser l'exercice effectif de la liberté d'établissement de ces transporteurs
  type: main
- language: de
  script: Latn
  content: Richtlinie 80/1180/EWG des Rates vom 4. Dezember 1980 zur wegen des Beitritts
    Griechenlands erforderlichen Änderung der Richtlinie 77/796/EWG über die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    für die Beförderung von Gütern und die Beförderung von Personen im Straßenverkehr
    und über Maßnahmen zur Förderung der tatsächlichen Inanspruchnahme der Niederlassungsfreiheit
    der betreffenden Verkehrsunternehmer
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 80/1180/EØF af 4. december 1980 om ændring af direktiv
    77/796/EØF om gensidig anerkendelse af eksamensbeviser, certifikater og andre
    kvalifikationsbeviser i forbindelse med udøvelse af transportvirksomhed inden
    for personbefordring og transportvirksomhed inden for godstransport ad landevej
    omfattende foranstaltninger, som skal lette den faktiske udøvelse af etableringsfrihed
    for de pågældende udøvere af transportvirksomhed som følge af Grækenlands
    tiltrædelse
  type: main
- language: el
  script: Grek
  content: Οδηγία 80/1180/ΕΟΚ του Συμβουλίου της 4ης Δεκεμβρίου
    1980 περί τροποποιήσεως, λόγω της προσχωρήσεως
    της Ελλάδος, της οδηγίας 77/796/ΕΟΚ «περί αμοιβαίας
    αναγνωρίσεως των διπλωμάτων, πιστοποιητικών
    και άλλων τίτλων των οδικών μεταφορέων εμπορευμάτων
    και μεταφορέων επιβατών, και περί των μέτρων
    προς διευκόλυνση της πραγματικής ασκήσεως
    του δικαιώματος της εγκαταστάσεως των μεταφορέων
    αυτών»
  type: main
- language: it
  script: Latn
  content: Direttiva 80/1180/CEE del Consiglio, del 4 dicembre 1980, che modifica,
    a seguito dell'adesione della Grecia, la direttiva 77/796/CEE per il riconoscimento
    reciproco di diplomi, certificati e altri titoli di trasportatore di merci e di
    trasportatore di persone su strada, che comporta misure destinate a favorire l'esercizio
    effettivo della libertà di stabilimento di detti trasportatori
  type: main
- language: nl
  script: Latn
  content: Richtlijn 80/1180/EEG van de Raad van 4 december 1980 tot wijziging, wegens
    de toetreding van Griekenland, van Richtlijn 77/796/EEG inzake de onderlinge erkenning
    van diploma' s, certificaten en andere titels van ondernemer van goederenvervoer
    over de weg en ondernemer van personenvervoer over de weg en houdende maatregelen
    ter bevordering van de daadwerkelijke uitoefening van het recht van vrije vestiging
    van die vervoerondernemers
  type: main
- language: pt
  script: Latn
  content: Directiva 80/1180/CEE do Conselho, de 4 de Dezembro de 1980, que altera,
    em razão da adesão da Grécia, a Directiva 77/796/CEE que tem por objectivo
    o reconhecimento mútuo dos diplomas, certificados e outros títulos de transportador
    rodoviário de mercadorias e de transportador rodoviário de passageiros e que
    inclui medidas destinadas a facilitar o exercício efectivo da liberdade de estabelecimento
    desses transportadores
  type: main
- language: es
  script: Latn
  content: Directiva 80/1180/CEE del Consejo, de 4 de diciembre de 1980, por la que
    se modifica, con motivo de la adhesión de Grecia, la Directiva 77/796/CEE relativa
    al reconocimiento recíproco de los diplomas, certificados y otros títulos de
    transportista de mercancías y de transportista de viajeros por carretera y en
    la que se incluyen las medidas destinadas a favorecer el ejercicio efectivo de
    la libertad de establecimiento de estos transportistas
  type: main
