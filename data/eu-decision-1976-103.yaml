  content: Commission Decision of 18 December 1975 on the granting by the Guidance
    Section of the EAGGF to the Federal Republic of Germany of a payment on account
    in respect of expenditure incurred during 1973 on aids and premiums relating to
    the modernization of farms
  type: main
- language: fr
  script: Latn
  content: '76/103/CEE: Décision de la Commission, du 18 décembre 1975, relative
    au versement par le FEOGA, section orientation, à la République fédérale d''Allemagne
    d''un acompte sur les dépenses effectuées pendant l''année 1973 pour les aides
    et primes relatives à la modernisation des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Dezember 1975 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahre 1973 zur Modernisierung
    landwirtschaftlicher Betriebe an Beihilfen und Prämien getätigten Ausgaben an
    die Bundesrepublik Deutschland
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. december 1975 om udbetaling gennem EUGFL,
    udviklingssektionen, til Forbundsrepublikken Tyskland af et acontobeløb for de
    udgifter, som er afholdt i løbet af året 1973 til støtte og præmier vedrørende
    modernisering af landbrugsbedrifter
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 dicembre 1975, relativa al versamento
    da parte del FEAOG, sezione orientamento, alla Repubblica federale di Germania
    di un anticipo sulle spese effettuate durante il 1973 per gli aiuti ed i premi
    relativi all'ammodernamento delle aziende agricole
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 december 1975 inzake de betaling door
