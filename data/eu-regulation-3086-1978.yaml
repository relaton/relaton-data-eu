title:
- language: en
  script: Latn
  content: Council Regulation (Euratom, ECSC, EEC) No 3086/78 of 21 December 1978
    adjusting the weightings applicable to the remuneration and pensions of officials
    and other servants of the European Communities following the amendment of the
    provisions of the Staff Regulations concerning the monetary parities to be used
    in implementing the Staff Regulations
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom, CECA, CEE) n° 3086/78 du Conseil, du 21 décembre
    1978, portant adaptation des coefficients correcteurs dont sont affectées les
    rémunérations et pensions des fonctionnaires et autres agents des Communautés
    européennes à la suite de la modification des dispositions du statut concernant
    les parités monétaires à utiliser dans l' application du statut
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom, EGKS, EWG) Nr. 3086/78 des Rates vom 21. Dezember
    1978 zur Anpassung der Berichtigungskoeffizienten, die auf die Dienst- und Versorgungsbezüge
    der Beamten und sonstigen Bediensteten der Europäischen Gemeinschaften angewandt
    werden, im Anschluß an die Änderung der Bestimmungen des Statuts über die bei
    der Anwendung des Statuts zu verwendenden Währungsparitäten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (Euratom, EKSF, EØF) nr. 3086/78 af 21. december 1978
    om tilpasning af justeringskoefficienterne for vederlag og pensioner til tjenestemænd
    og øvrige ansatte i De europæiske Fællesskaber som følge af ændringer af
    vedtægtens bestemmelser vedrørende de valutakurser, der anvendes i forbindelse
    med vedtægten
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom, CECA, CEE) n. 3086/78 del Consiglio, del 21 dicembre
    1978, che adegua i coefficienti correttori applicabili alle retribuzioni e alle
    pensioni dei funzionari e altri agenti delle Comunità europee in seguito alla
    modifica delle disposizioni dello statuto concernenti le parità monetarie da
    utilizzare nell' applicazione dello statuto
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom, EGKS, EEG) nr. 3086/78 van de Raad van 21 december
    1978 tot wijziging van de aanpassingscoëfficiënten die van toepassing zijn op
    de bezoldigingen en de pensioenen van de ambtenaren en andere personeelsleden
    van de Europese Gemeenschappen ingevolge de wijziging van de bepalingen van het
    Statuut betreffende de bij de toepassing van het Statuut te gebruiken muntpariteiten
  type: main
- language: pt
  script: Latn
  content: Regulamento (Euratom, CECA, CEE) n.° 3086/78 do Conselho, de 21 de Dezembro
    de 1978, que adapta os coeficientes de correcção a que estão sujeitas as remunerações
    e pensões dos funcionários e dos outros agentes das Comunidades Europeias na
    sequência da alteração das disposições do estatuto referentes às paridades
    monetárias a utilizar na aplicação do estatuto
  type: main
- language: es
  script: Latn
  content: Reglamento (Euratom, CECA, CEE) n° 3086/78 del Consejo, de 21 de diciembre
    de 1978, sobre adaptaciones de los coeficientes correctores aplicables a las retribuciones
    y pensiones de los funcionarios y los otros agentes de las Comunidades Europeas
    como consecuencia de la modificación del Estatuto referente a las paridades monetarias
    a utilizar en la aplicación del Estatuto
  type: main
