title:
- language: en
  script: Latn
  content: '85/20/EEC: Commission Decision of 4 December 1984 changing the import
    arrangements established by Council Regulation (EEC) No 3420/83 and applied in
    the Benelux countries, in Denmark and in the United Kingdom in respect of Romania
    regarding various industrial products (Only the French, Dutch, Danish and English
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/20/CEE: Décision de la Commission du 4 décembre 1984 modifiant le
    régime d''importation prévu par le règlement (CEE) n° 3420/83 du Conseil et
    appliqué au Benelux, au Danemark et au Royaume-Uni à l''égard de la Roumanie
    en ce qui concerne divers produits industriels (Les textes en langues française,
    néerlandaise, danoise et anglaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/20/EWG: Entscheidung der Kommission vom 4. Dezember 1984 zur Änderung
    der durch Verordnung (EWG) Nr. 3420/83 des Rates festgelegten und in den Beneluxländern,
    in Dänemark und dem Vereinigten Königreich gegenüber Rumänien für einige
    gewerbliche Waren angewandten Einfuhrregelung (Nur der französische, niederländische,
    dänische und englische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/20/EØF: Kommissionens beslutning af 4. december 1984 om ændring af
    den importordning, der er fastsat ved Rådets forordning (EØF) nr. 3420/83, og
    som anvendes i Benelux-landene, kongeriget Danmark og Det forenede Kongerige over
    for Rumænien for så vidt angår forskellige industrivarer (Kun den franske,
    nederlandske, danske og engelske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '85/20/ΕΟΚ: Απόφαση της Επιτροπής της 4ης Δεκεμβρίου
    1984 για την τροποποίηση του καθεστώτος εισαγωγής
    που προβλέπεται από τον κανονισμό (ΕΟΚ) αριθ.
    3420/83 του Συμβουλίου και εφαρμόζεται στα κράτη
    της Μπενελούξ, στη Δανία και στο Ηνωμένο Βασίλειο,
    απέναντι στη Ρουμανία, όσον αφορά διάφορα βιομηχανικά
    προϊόντα (Τα κείμενα στην γαλλική, ολλανδική,
    δανική και αγγλική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '85/20/CEE: Decisione della Commissione del 4 dicembre 1984 che modifica
    il regime d''importazione, istituito con regolamento (CEE) n. 3420/83 del Consiglio,
    applicato nel Benelux, in Danimarca e nel Regno Unito nei confronti della Romania
    per quanto concerne diversi prodotti industriali (Il testi in lingua francese,
    olandese, danese e inglese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '85/20/EEG: Beschikking van de Commissie van 4 december 1984 tot wijziging
    van de bij Verordening (EEG) nr. 3420/83 van de Raad vastgestelde invoerregeling
    welke in de Benelux, in Denemarken en in het Verenigd Koninkrijk wordt toegepast
    ten opzichte van Roemenië met betrekking tot diverse industrieprodukten (Slechts
    de teksten in de Franse, Nederlandse, Deense en de Engelse taal zijn authentiek)'
