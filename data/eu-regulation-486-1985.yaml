    hergestellte Waren mit Ursprung in den Staaten in Afrika, im karibischen Raum
    und im Pazifischen Ozean oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 486/85 af 26. februar 1985 om den ordning,
