id: EUDecision1977765
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 June 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's pyjamas of mixed synthetic fibres falling within
    heading No ex 61.03 of the Common Customs Tariff, originating in Taiwan and in
    free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/765/CEE: Décision de la Commission, du 20 juin 1977, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les pyjamas de fibres textiles synthétiques
    mélangées pour hommes, de la position Ex 61.03 du Tarif douanier commun, originaires
    de Taiwan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Juni 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Schlafanzüge für Männer, aus synthetischen gemischten Spinnstoffen,
    der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. juni 1977 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage natbeklædning til mænd af blandede syntetiske fibre, som henhører
    under pos. ex 61.03 i den fælles toldtarif, har oprindelse i Taiwan og frit kan
    omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 giugno 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i pigiama per uomo e per ragazzo di fibre tessili
    sintetiche miste della voce ex 61.03 della tariffa doganale comune, originarie
    di Taiwan e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 juni 1977 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    herenpyjama's van weefsels van gemengde synthetische garens van post ex 61.03
    van het gemeenschappelijk douanetarief, van oorsprong uit Taïwan en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
