title:
- language: fr
  script: Latn
  content: Décision 66/457/CEE de la Commission, du 5 juillet 1966, autorisant la
    République italienne à exclure du traitement communautaire, à titre de mesure
    de sauvegarde conservatoire, le bichromate de sodium de la position Ex 28.47 B
    II du Tarif douanier commun, originaire de l'URSS, de Pologne, de Hongrie, de
    Tchécoslovaquie et de Roumanie, et mis en libre pratique dans d'autres États
    membres
  type: main
- language: de
  script: Latn
  content: '66/457/EWG: Entscheidung der Kommission vom 5. Juli 1966, mit der die
    Italienische Republik ermächtigt wird, als vorübergehende Schutzmaßnahme Natriumbichromat
    der Tarifnummer ex 28.47 B II des Gemeinsamen Zolltarifs mit Ursprung in der UdSSR,
    Polen, Ungarn, der Tschechoslowakei und Rumänien, das sich in den anderen Mitgliedstaaten
    im freien Verkehr befindet, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/457/CEE: Decisione della Commissione, del 5 luglio 1966, con cui si
    autorizza la Repubblica italiana ad escludere dal trattamento comunitario, a titolo
    di misura conservativa di salvaguardia, il bicromato di sodio della voce ex 28.47
    B II della tariffa doganale comune, originario dall''U.R.S.S., dalla Polonia,
    dall''Ungheria, dalla Cecoslovacchia e dalla Romania, e messo in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/457/EEG: Beschikking van de Commissie van 5 juli 1966 waarbij de Italiaanse
    Republiek wordt gemachtigd bij wijze van conservatoire vrijwaringsmaatregel natriumbichromaat
    van post ex 28.47 B II van het gemeenschappelijk douanetarief, dat van oorsprong
    is uit de USSR, Polen, Hongarije, Tsjechoslowakije, en Roemenië en in andere
    Lid-Staten in het vrije verkeer is gebracht van de communautaire behandeling uit
    te sluiten'
  type: main
