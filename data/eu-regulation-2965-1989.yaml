  content: Commission Regulation (EEC) No 2965/89 of 29 September 1989 providing for
    the grant of private storage aid fixed at a standard rate in advance in respect
    of carcases, half-carcases, hindquarters and forequarters of adult male bovine
    animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2965/89 de la Commission, du 29 septembre 1989, prévoyant
    l'octroi d'une aide au stockage privé de carcasses, de demi-carcasses, de quartiers
    arrière et de quartiers avant de gros bovins mâles, fixée forfaitairement à
    l'avance
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2965/89 der Kommission vom 29. September 1989 zur
    Gewährung einer im voraus pauschal festgesetzten Beihilfe zur privaten Lagerhaltung
    von Schlachtkörpern, halben Schlachtkörpern, Hinter- und Vordervierteln von
    ausgewachsenen männlichen Rindern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2965/89 af 29. september 1989 om ydelse
    af en skønsmæssigt forudfastsat støtte til privat oplagring af hele kroppe,
    halve kroppe og bag- og forfjerdinger af voksne handyr
  type: main
- language: el
  script: Grek
