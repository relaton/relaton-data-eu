    χονδρών αρσενικών βοοειδών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2965/89 della Commissione, del 29 settembre 1989,
    recante concessione di un aiuto fissato forfettariamente in anticipo all'ammasso
    privato di carcasse, quarti posteriori e quarti anteriori di animali adulti maschi
    della specie bovina
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2965/89 van de Commissie van 29 september 1989 inzake
