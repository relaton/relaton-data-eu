    genom avtalet om handel och samarbete mellan Europeiska unionen och Europeiska
    atomenergigemenskapen, å ena sidan, och Förenade konungariket Storbritannien
    och Nordirland, å andra sidan, vad gäller antagande av ett beslut om upprättande
    av en förteckning över personer som är villiga och kapabla att tjänstgöra
