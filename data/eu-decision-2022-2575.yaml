  content: Council Decision (EU) 2022/2575 of 19 December 2022 on the position to
    be taken on behalf of the European Union within the Partnership Council established
    by the Trade and Cooperation Agreement between the European Union and the European
    Atomic Energy Community, of the one part, and the United Kingdom of Great Britain
    and Northern Ireland, of the other part, as regards the adoption of a decision
    establishing a list of individuals who are willing and able to serve as members
    of an arbitration tribunal under that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2575 du Conseil du 19 décembre 2022 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil de partenariat
    institué par l’accord de commerce et de coopération entre l’Union européenne
    et la Communauté européenne de l’énergie atomique, d’une part, et le Royaume-Uni
    de Grande-Bretagne et d’Irlande du Nord, d’autre part, en ce qui concerne
    l’adoption d’une décision établissant une liste de personnes désireuses
    et capables de siéger dans un tribunal d’arbitrage au titre dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/2575 des Rates vom 19. Dezember 2022 über den im Namen
