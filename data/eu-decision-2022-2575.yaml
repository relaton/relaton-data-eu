    v imenu Evropske unije zastopa v Partnerskem svetu, ustanovljenem s Sporazumom
    o trgovini in sodelovanju med Evropsko unijo in Evropsko skupnostjo za atomsko
    energijo na eni strani ter Združenim kraljestvom Velika Britanija in Severna
