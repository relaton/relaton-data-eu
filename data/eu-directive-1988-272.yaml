title:
- language: en
  script: Latn
  content: Sixth Commission Directive 88/272/EEC of 8 April 1988 amending certain
    Annexes to Council Directive 77/93/EEC on protective measures against the introduction
    into the Member States of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Sixième directive 88/272/CEE de la Commission du 8 avril 1988 modifiant
    certaines annexes de la directive 77/93/CEE du Conseil concernant les mesures
    de protection contre l'introduction dans les États membres d'organismes nuisibles
    aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Sechste Richtlinie 88/272/EWG der Kommission vom 8. April 1988 zur Änderung
    bestimmter Anhänge der Richtlinie 77/93/EWG des Rates über Maßnahmen zum Schutz
    gegen das Verbringen von Schadorganismen der Pflanzen oder Pflanzenerzeugnisse
    in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens sjette direktiv 88/272/EØF af 8. april 1988 om ændring
    af visse bilag til Rådets direktiv 77/93/EØF om foranstaltninger mod indslæbning
    af skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Έκτη οδηγία 88/272/ΕΟΚ της Επιτροπής της 8ης
    Απριλίου 1988 για την τροποποίηση ορισμένων
    παραρτημάτων της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    σχετικά με τα μέτρα προστασίας κατά της εισαγωγής
    στα κράτη μέλη οργανισμών επιβλαβών για τα
    φυτά ή τα φυτικά προϊόντα
  type: main
- language: it
  script: Latn
  content: Sesta direttiva 88/272/CEE della Commissione dell'8 aprile 1988 che modifica
    taluni allegati della direttiva 77/93/CEE del Consiglio concernente le misure
    di protezione contro l'introduzione negli Stati Membri di organismi nocivi ai
    vegetali o ai prodotti vegetali
  type: main
- language: nl
  script: Latn
  content: Zesde Richtlijn 88/272/EEG van de Commissie van 8 april 1988 tot wijziging
    van enkele bijlagen bij Richtlijn 77/93/EEG van de Raad betreffende de beschermende
    maatregelen tegen het binnenbrengen op het grondgebied van de Lid-Staten van voor
    planten of voor plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Sexta Directiva 88/272/CEE da Comissão de 8 de Abril de 1988 que altera
    determinados anexos da Directiva 77/93/CEE do Conselho relativa às medidas de
    protecção contra a introdução nos Estados-Membros de organismos prejudiciais
    às plantas e produtos vegetais
  type: main
- language: es
  script: Latn
  content: Sexta Directiva 88/272/CEE de la Comisión de 8 de abril de 1988 por la
    que se modifican determinados Anexos de la Directiva 77/93/CEE, relativa a las
    medidas de protección contra la introducción en los Estados miembos de organismos
    nocivos para los vegetales o productos vegetales
  type: main
