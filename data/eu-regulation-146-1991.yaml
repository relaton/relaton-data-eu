title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 146/91 of 22 January 1991 establishing a
    list of products excluded from the application of Council Regulation (EEC) No
    737/90 on the conditions governing imports of agricultural products originating
    in third countries following the accident at the Chernobyl nuclear power stations
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 146/91 DE LA COMMISSION du 22 janvier 1991 établissant
    une liste de produits exclus du champ d'' application du règlement (CEE) no 737/90
    du Conseil relatif aux conditions d'' importation de produits agricoles originaires
    des pays tiers à la suite de l'' accident survenu à la centrale nucléaire de
    Tchernobyl #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 146/91 DER KOMMISSION vom 22. Januar 1991 zur Festlegung
    einer Liste von Erzeugnissen, die von der Durchführung der Verordnung (EWG) Nr.
    737/90 des Rates über die Einfuhrbedingungen für landwirtschaftliche Erzeugnisse
    mit Ursprung in Drittländern nach dem Unfall im Kernkraftwerk Tschernobyl ausgenommen
    sind #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 146/91 af 22. januar 1991 indeholdende
    en fortegnelse over produkter, der undtages fra Rådets forordning (EØF) nr.
    737/90 om betingelser for indførsel af landbrugsprodukter med oprindelse i tredjelande
    som følge af ulykken på kernekraftværket i Tjernobyl
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 146/91 της Επιτροπής
    της 22ας Ιανουαρίου 1991 για την κατάρτιση καταλόγου
    προϊόντων που εξαιρούνται από το πεδίο εφαρμογής
    του κανονισμού (ΕΟΚ) αριθ. 737/90 του Συμβουλίου
    σχετικά με τους όρους που διέπουν τις εισαγωγές
    γεωργικών προϊόντων που προέρχονται από τρίτες
    χώρες μετά το ατύχημα στον πυρηνικό σταθμό
    ηλεκτροπαραγωγής του Τσερνομπίλ
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 146/91 DELLA COMMISSIONE del 22 gennaio 1991 che
    stabilisce un elenco di prodotti esclusi dal campo di applicazione del regolamento
    (CEE) n. 737/90 del Consiglio, relativo alle condizioni di importazione di prodotti
    agricoli originari di paesi terzi in seguito all'' incidente intervenuto nella
    centrale nucleare di Cernobyl #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 146/91 VAN DE COMMISSIE van 22 januari 1991 tot
    vaststelling van een lijst van produkten die zijn uitgesloten van Verordening
    (EEG) nr. 737/90 van de Raad betreffende de voorwaarden voor de invoer van landbouwprodukten
    van oorsprong uit derde landen ingevolge het ongeval in de kerncentrale van Tsjernobyl
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 146/91 DA COMISSÃO de 22 de Janeiro de 1991 que
    estabelece uma lista de produtos excluídos do âmbito de aplicação do Regulamento
    (CEE) no 737/90 do Conselho, relativo às condições de importação de produtos
    agrícolas originários de países terceiros na sequência do acidente ocorrido
    na central nuclear de Chernobyl #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 146/91 DE LA COMISIÓN de 22 de enero de 1991 por
    el que se establece una lista de productos excluidos de la aplicación del Reglamento
    (CEE) no 737/90 del Consejo relativo a las condiciones de importación de productos
    agrícolas originarios de países terceros como consecuencia del accidente ocurrido
    en la central nuclear de Chernobyl #'
