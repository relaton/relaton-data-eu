title:
- language: en
  script: Latn
  content: '2003/305/EC: Commission Decision of 2 May 2003 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of sulphuryl fluoride, bispyribac sodium and paecilomyces
    lilacinus in Annex I to Council Directive 91/414/EEC concerning the placing of
    plant-protection products on the market (Text with EEA relevance) (notified under
    document number C(2003) 1426)'
  type: main
- language: fr
  script: Latn
  content: '2003/305/CE: Décision de la Commission du 2 mai 2003 reconnaissant en
    principe la conformité des dossiers transmis pour examen détaillé en vue de
    l''inscription éventuelle du fluorure de sulfuryle, du bispyribac sodium et du
    paecilomyces lilacinus à l''annexe I de la directive 91/414/CEE du Conseil concernant
    la mise sur le marché des produits phytopharmaceutiques (Texte présentant de
    l''intérêt pour l''EEE) [notifiée sous le numéro C(2003) 1426]'
  type: main
- language: de
  script: Latn
  content: '2003/305/EG: Entscheidung der Kommission vom 2. Mai 2003 zur grundsätzlichen
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von Sulfurylfluoride, Bispyribac-Natrium
    und Paecilomyces lilacinus in Anhang I der Richtlinie 91/414/EWG des Rates über
    das Inverkehrbringen von Pflanzenschutzmitteln eingereicht wurden (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2003) 1426)'
  type: main
- language: bg
