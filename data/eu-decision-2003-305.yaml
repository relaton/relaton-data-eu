    szóló 91/414/EGK tanácsi irányelv I. mellékletébe történő lehetséges
    felvétele céljából részletes vizsgálatra benyújtott dossziék teljességének
    elvi elismeréséről (az értesítés a C(2003) 1426. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2003/305/CE: Decisione della Commissione, del 2 maggio 2003, che riconosce
    la completezza, in linea di massima, dei fascicoli presentati per un esame particolareggiato
    ai fini dell''eventuale inserimento del sulfuryl fluoride, del bispyribac sodium
    e del paecilomyces lilacinus nell''allegato I della direttiva 91/414/CEE del Consiglio
    relativa all''immissione in commercio dei prodotti fitosanitari (Testo rilevante
    ai fini del SEE) [notificata con il numero C(2003) 1426]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2003. gada 2. maijs), ar ko principā atzīst par pilnīgu
