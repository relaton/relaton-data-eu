    bispiribaknātrija un paecilomyces lilacinus iespējamo iekļaušanu I pielikumā
    Padomes Direktīvai 91/414/EEK par augu aizsardzības līdzekļu laišanu tirgū
    (izziņots ar dokumenta numuru C(2003) 1426)
  type: main
