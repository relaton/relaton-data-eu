    ποσών αυτών στον τομέα της ζάχαρης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3828/92 della Commissione, del 28 dicembre 1992, che
    abroga il regolamento (CEE) n. 581/86 che stabilisce le modalità di applicazione
    degli importi compensativi adesione e che fissa tali importi nel settore dello
    zucchero
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3828/92 van de Commissie van 28 december 1992 tot
    intrekking van Verordening (EEG) nr. 581/86 tot vaststelling van uitvoeringsbepalingen
    inzake de compenserende bedragen "toetreding" en tot vaststelling van deze bedragen
    in de suikersector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3828/92 da Comissão, de 28 de Dezembro de 1992,
    que revoga o Regulamento (CEE) n° 581/86 que estabelece as regras de execução
    dos montantes compensatórios de adesão e a fixação desses montantes no sector
    do açúcar
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3828/92 de la Comisión, de 28 de diciembre de 1992,
    por el que se deroga el Reglamento (CEE) n° 581/86 por el que se establecen las
    modalidades de aplicación de los montantes compensatorios de adhesión y se fijan
    dichos montantes en el sector del azúcar
