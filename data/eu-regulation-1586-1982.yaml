title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1586/82 of 21 June 1982 amending and derogating
    from Regulation (EEC) No 1530/78 laying down rules for the application of the
    system of aid in respect of certain products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1586/82 de la Commission, du 21 juin 1982, modifiant
    et dérogeant au règlement (CEE) n° 1530/78 établissant les modalités d' application
    du régime d' aide pour certains produits transformés à base de fruits et légumest
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1586/82 der Kommission vom 21. Juni 1982 zur Änderung
    und Abweichung von der Verordnung (EWG) Nr. 1530/78 zur Festlegung der Durchführungsbestimmungen
    zu der Beihilfereglung für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse2
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1586/82 af 21. juni 1982 om ændring
    af og undtagelse fra forordning (EØF) nr. 1530/78 om gennemførelsesbestemmelser
    vedrørende støtteordningen for visse produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1586/82 τής Επιτροπής
    τής 21ης Ιουνίου 1982 περί τροποποιήσεως καί παρεκκλίσεως
    από τόν κανονισμό (EOK) αριθ. 1530/78 περί καθορισμού
    τών λεπτομερειών εφαρμογής τού καθεστώτος
    ενισχύσεως γιά ορισμένα μεταποιημένα προϊόντα
    μέ βάση τά οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1586/82 della Commissione, del 21 giugno 1982, recante
    modifica e deroga del regolamento (CEE) n. 1530/78 che stabilisce le modalità
    d' applicazione del regime di aiuti per taluni prodotti trasformati a base di
    ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1586/82 van de Commissie van 21 juni 1982 tot wijziging
