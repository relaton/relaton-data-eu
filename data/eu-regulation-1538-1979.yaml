title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1538/79 of 23 July 1979 re-establishing
    the levying of customs duties on articles of asbestos, falling within subheading
    68.13 B II and B III, originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1538/79 de la Commission, du 23 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    en amiante, des sous-positions 68.13 B II et B III du tarif douanier commun, originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1538/79 der Kommission vom 23. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Waren aus Asbest der Tarifstellen 68.13 B II und B III mit
    Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1538/79 af 23. juli 1979 om genindførelse
    af opkrævning af toldafgifter for varer af asbest, under underpostition 68.13
    B II og B III, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1538/79 della Commissione, del 23 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di amianto,
    delle sottovoci 68.13 B II e B III della tariffa doganale comune, originari della
    Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1538/79 van de Commissie van 23 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op werken van
    asbest, van de posten 68.13 B en B III, van oorsprong uit Zuid-Korea, ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
