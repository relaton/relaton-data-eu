id: EUDecision2008613
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2008/613/CFSP of 24 July 2008 implementing Common Position
    2004/694/CFSP on further measures in support of the effective implementation of
    the mandate of the International Criminal Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
  content: Décision 2008/613/PESC du Conseil du 24 juillet 2008 mettant en œuvre
    la position commune 2004/694/PESC concernant de nouvelles mesures définies à
    l'appui d'une mise en œuvre effective du mandat du Tribunal pénal international
    pour l'ex-Yougoslavie (TPIY)
  type: main
- language: de
  script: Latn
  content: Beschluss 2008/613/GASP des Rates vom 24. Juli 2008 zur Durchführung des
    Gemeinsamen Standpunkts 2004/694/GASP betreffend weitere Maßnahmen zur Unterstützung
    der wirksamen Ausführung des Mandats des Internationalen Strafgerichtshofs für
    das ehemalige Jugoslawien (ICTY)
  type: main
- language: bg
  script: Cyrl
  content: Решение 2008/613/ОВППС на Съвета от 24 юли 2008
    година за изпълнение на Обща позиция 2004/694/ОВППС
    за по-нататъшни мерки в подкрепа на ефективното
    изпълнение на мандата на Международния трибунал
    за престъпленията в бивша Югославия (МТПЮ)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2008/613/SZBP ze dne 24. července 2008 , kterým se provádí
    společný postoj 2004/694/SZBP o dalších opatřeních na podporu účinného
    provádění mandátu Mezinárodního trestního tribunálu pro bývalou Jugoslávii
    (ICTY)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2008/613/FUSP af 24. juli 2008 om gennemførelse af
    fælles holdning 2004/694/FUSP om yderligere foranstaltninger til støtte for
    den effektive gennemførelse af mandatet til Det Internationale Krigsforbrydertribunal
    vedrørende Det Tidligere Jugoslavien (ICTY)
  type: main
- language: el
  script: Grek
  content: Απόφαση 2008/613/ΚΕΠΠΑ του Συμβουλίου, της
    24ης Ιουλίου 2008 , η οποία θέτει σε εφαρμογή την
    κοινή θέση 2004/694/ΚΕΠΠΑ για περαιτέρω μέτρα προς
    υποστήριξη της αποτελεσματικής εφαρμογής
    της εντολής του Διεθνούς Ποινικού Δικαστηρίου
    για την πρώην Γιουγκοσλαβία (ICTY)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2008/613/ÜVJP, 24. juuli 2008 , millega rakendatakse ühist
    seisukohta 2004/694/ÜVJP edasiste meetmete kohta, millega toetatakse endise Jugoslaavia
    asjade rahvusvahelise kriminaalkohtu (EJRK) volituste tõhusat rakendamist
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2008/613/YUTP, tehty 24 päivänä heinäkuuta 2008
    , entisen Jugoslavian alueen kansainvälisen rikostuomioistuimen toimeksiannon
    tehokasta täytäntöönpanoa tukevista lisätoimenpiteistä hyväksytyn yhteisen
    kannan 2004/694/YUTP täytäntöönpanosta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2008/613/KKBP határozata ( 2008. július 24. ) a volt Jugoszláviában
    elkövetett háborús bűncselekményeket vizsgáló Nemzetközi Törvényszék
    (ICTY) célkitűzései hatékony végrehajtásának támogatására irányuló
    további intézkedésekről szóló 2004/694/KKBP közös álláspont végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2008/613/PESC del Consiglio, del 24 luglio 2008 , che attua la
    posizione comune 2004/694/PESC relativa ad ulteriori misure a sostegno dell'effettiva
    attuazione del mandato del tribunale penale internazionale per la ex Jugoslavia
    (ICTY)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2008/613/KĀDP ( 2008. gada 24. jūlijs ), ar ko īsteno
    Kopējo nostāju 2004/694/KĀDP par turpmākiem pasākumiem, lai atbalstītu sekmīgu
    Starptautiskā Kara noziegumu tribunāla bijušajai Dienvidslāvijai ( ICTY )
    mandāta īstenošanu
  type: main
- language: lt
  script: Latn
  content: 2008 m. liepos 24 d. Tarybos sprendimas 2008/613/BUSP, įgyvendinantis
    Bendrąją poziciją 2004/694/BUSP dėl tolesnių priemonių, remiančių veiksmingą
    Tarptautinio baudžiamojo tribunolo buvusiai Jugoslavijai (TBTBJ) mandato vykdymą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2008/613/PESK ta’ l- 24 ta’ Lulju 2008 li timplimenta
    l-Pożizzjoni Komuni 2004/694/PESK dwar aktar miżuri ta’ appoġġ għall-implimentazzjoni
    effettiva tal-mandat tat-Tribunal Kriminali Internazzjonali għal dik li qabel
    kienet il-Jugoslavja (ICTY)
  type: main
- language: nl
  script: Latn
  content: Besluit 2008/613/GBVB van de Raad van 24 juli 2008 tot uitvoering van Gemeenschappelijk
    Standpunt 2004/694/GBVB betreffende aanvullende maatregelen ter ondersteuning
    van de daadwerkelijke uitvoering van het mandaat van het Internationaal Straftribunaal
    voor het voormalige Joegoslavië (ICTY)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2008/613/WPZiB z dnia 24 lipca 2008 r. wprowadzająca w życie
    wspólne stanowisko 2004/694/WPZiB w sprawie dalszych środków wspierających
    skuteczne wykonanie mandatu Międzynarodowego Trybunału Karnego dla byłej Jugosławii
    (MTKJ)
  type: main
- language: pt
  script: Latn
  content: Decisão 2008/613/PESC do Conselho, de 24 de Julho de 2008 , que dá execução
    à Posição Comum 2004/694/PESC relativa a medidas adicionais de apoio ao exercício
    efectivo do mandato do Tribunal Penal Internacional para a ex-Jugoslávia (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Decizia 2008/613/PESC a Consiliului din 24 iulie 2008 de punere în aplicare
    a Poziției comune 2004/694/PESC privind noi măsuri în sprijinul punerii în
    aplicare efective a mandatului Tribunalului Penal Internațional pentru fosta
    Iugoslavie (TPII)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2008/613/SZBP z 24. júla 2008 , ktorým sa vykonáva
    spoločná pozícia 2004/694/SZBP o ďalších opatreniach na podporu efektívneho
    vykonávania mandátu Medzinárodného trestného tribunálu pre bývalú Juhosláviu
    (ICTY)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2008/613/SZVP z dne 24. julija 2008 o izvajanju Skupnega stališča
    2004/694/SZVP o nadaljnjih ukrepih v podporo učinkovitemu izvajanju mandata Mednarodnega
    kazenskega sodišča za nekdanjo Jugoslavijo (MKSJ)
  type: main
- language: es
  script: Latn
  content: Decisión 2008/613/PESC del Consejo, de 24 de julio de 2008 , por la que
    se aplica la Posición Común 2004/694/PESC sobre otras medidas en apoyo de la
    aplicación efectiva del mandato del Tribunal Penal Internacional para la ex Yugoslavia
    (TPIY)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2008/613/Gusp av den 24 juli 2008 om genomförande av gemensam
    ståndpunkt 2004/694/Gusp om ytterligare åtgärder till stöd för ett effektivt
    genomförande av Internationella tribunalen för f.d. Jugoslaviens (ICTY) uppgift
  type: main
