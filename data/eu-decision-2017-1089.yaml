    Köztársaságnak, Grúziának és a Kiribati Köztársaságnak az emberi fogyasztásra
    szánt egyes halászati termékek behozatalára jogosult harmadik országok és
    területek jegyzékébe való felvétele tekintetében történő – módosításáról
    (az értesítés a C(2017) 4049. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/1089 della Commissione, del 16 giugno
    2017, che modifica l'allegato II della decisione 2006/766/CE per quanto concerne
    l'inserimento dell'ex Repubblica jugoslava di Macedonia, della Georgia e della
    Repubblica di Kiribati nell'elenco dei paesi terzi e dei territori da cui sono
    autorizzate le importazioni di determinati prodotti della pesca destinati al consumo
    umano [notificata con il numero C(2017) 4049]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/1089 (2017. gada 16. jūnijs),
