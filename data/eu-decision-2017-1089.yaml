    Bývalé jugoslávské republiky Makedonie, Gruzie a Republiky Kiribati do seznamu
    třetích zemí a území, ze kterých je povolen dovoz některých produktů
    rybolovu určených k lidské spotřebě (oznámeno pod číslem C(2017) 4049)
  type: main
