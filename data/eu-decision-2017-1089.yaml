    na lista de países terceiros e territórios a partir dos quais são autorizadas
    as importações de determinados produtos da pesca para consumo humano [notificada
    com o número C(2017) 4049]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/1089 a Comisiei din 16 iunie 2017
    de modificare a anexei II la Decizia 2006/766/CE în ceea ce privește includerea
    fostei Republici iugoslave a Macedoniei, a Georgiei și a Republicii Kiribati
    pe lista țărilor terțe și a teritoriilor din care se autorizează importurile
    de anumite produse pescărești destinate consumului uman [notificată cu numărul
    C(2017) 4049]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/1089 zo 16. júna 2017, ktorým
    sa mení príloha II k rozhodnutiu 2006/766/ES, pokiaľ ide o zaradenie bývalej
    Juhoslovanskej republiky Macedónsko, Gruzínska a Kiribatskej republiky do zoznamu
    tretích krajín a území, z ktorých je povolený dovoz určitých produktov
    rybolovu určených na ľudskú spotrebu [oznámené pod číslom C(2017) 4049]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/1089 z dne 16. junija 2017 o spremembi
