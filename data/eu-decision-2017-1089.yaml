    Maķedonijas Republikas, Gruzijas un Kiribati Republikas iekļaušanu to trešo
    valstu un teritoriju sarakstā, no kurām ir atļauts importēt konkrētus lietošanai
    pārtikā paredzētus zvejniecības produktus (izziņots ar dokumenta numuru C(2017)
    4049)
  type: main
- language: lt
  script: Latn
