title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1089 of 16 June 2017 amending
    Annex II to Decision 2006/766/EC as regards the inclusion of the former Yugoslav
    Republic of Macedonia, Georgia and the Republic of Kiribati in the list of third
    countries and territories from which imports of certain fishery products for human
    consumption are permitted (notified under document C(2017) 4049)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1089 de la Commission du 16 juin 2017
    modifiant l'annexe II de la décision 2006/766/CE en ce qui concerne l'inscription
    de l'ancienne République yougoslave de Macédoine, de la Géorgie et de la République
    de Kiribati dans la liste des pays tiers et territoires en provenance desquels
    l'importation de certains produits de la pêche destinés à l'alimentation humaine
    est autorisée [notifiée sous le numéro C(2017) 4049]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1089 der Kommission vom 16. Juni 2017
    zur Änderung des Anhangs II der Entscheidung 2006/766/EG zwecks Aufnahme der
    ehemaligen jugoslawischen Republik Mazedonien, Georgiens und der Republik Kiribati
    in die Liste der Drittländer und Gebiete, aus denen Einfuhren bestimmter Fischereierzeugnisse
    zum menschlichen Verzehr zulässig sind (Bekannt gegeben unter Aktenzeichen C(2017)
    4049)
  type: main
- language: bg
  script: Cyrl
