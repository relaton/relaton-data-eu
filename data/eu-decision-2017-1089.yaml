  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/1089 van de Commissie van 16 juni 2017 tot
    wijziging van bijlage II bij Beschikking 2006/766/EG wat betreft de opname van
    de voormalige Joegoslavische Republiek Macedonië, Georgië en de Republiek Kiribati
    in de lijst van derde landen en gebieden waaruit bepaalde visserijproducten voor
