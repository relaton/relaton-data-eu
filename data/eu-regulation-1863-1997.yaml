    Svizzera per tener conto dei risultati dei negoziati dell'Uruguay Round nel settore
    agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1863/97 van de Raad van 22 september 1997 tot vaststelling
