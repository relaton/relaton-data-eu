    μέτρων σχετικών με την εισαγωγή μεταποιημένων
    γεωργικών προϊόντων από την Ελβετία προκειμένου
    να ληφθούν υπόψη τα αποτελέσματα των διαπραγματεύσεων
    του Γύρου της Ουρουγουάης στο γεωργικό τομέα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1863/97, annettu 22 päivänä syyskuuta 1997,
