title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1863/97 of 22 September 1997 establishing certain
    measures concerning imports of processed agricultural products from Switzerland
    in order to take account of the results of the Uruguay Round negotiations in the
    agricultural sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1863/97 du Conseil du 22 septembre 1997 établissant
    certaines mesures concernant l'importation de produits agricoles transformés
    de Suisse pour tenir compte des résultats des négociations du cycle d'Uruguay
    dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1863/97 des Rates vom 22. September 1997 über bestimmte
    Maßnahmen betreffend die Einfuhr von landwirtschaftlichen Verarbeitungserzeugnissen
    aus der Schweiz im Hinblick auf die Ergebnisse der Verhandlungen der Uruguay-Runde
    im Agrarbereich
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1863/97 af 22. september 1997 om visse foranstaltninger
    vedrørende import af forarbejdede landbrugsprodukter fra Schweiz for at tage
    hensyn til resultaterne af Uruguay-rundens forhandlinger på landbrugsområdet
  type: main
- language: el
  script: Grek
