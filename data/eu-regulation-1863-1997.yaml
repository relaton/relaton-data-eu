    toteuttamisesta Uruguayn kierroksen neuvottelujen tulosten huomioon ottamiseksi
    maatalouden alalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1863/97 del Consiglio del 22 settembre 1997 che stabilisce
