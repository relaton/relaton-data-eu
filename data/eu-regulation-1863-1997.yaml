    uit Zwitserland om rekening te houden met de resultaten van de in het kader van
    de Uruguayronde gevoerde onderhandelingen in de landbouwsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1863/97 do Conselho de 22 de Setembro de 1997 que
