title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1209/74 of the Commission of 14 May 1974 re-establishing
    the levying of the customs duties on cycles (including delivery tricycles), not
    motorized falling within heading No 87.10 of the Common Customs Tariff, originating
    in Yugoslavia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1209/74 de la Commission, du 14 mai 1974, portant
    rétablissement de la perception des droits de douane applicables aux vélocipèdes
    (y compris les triporteurs et similaires) sans moteur, de la position tarifaire
    87.10, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1209/74 der Kommission vom 14. Mai 1974 zur Wiedereinführung
    des Zollsatzes für Fahrräder, einschließlich Lastendreiräder und dergleichen,
    ohne Motor, der Tarifnummer 87.10, mit Ursprung in Jugoslawien, dem die in der
    Verordnung (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1209/74 af 14. maj 1974 om genindførelse
    af opkrævning af toldafgifter for cykler uden motor (herunder trehjulede transportcykler),
    under position 87.10, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1209/74 della Commissione, del 14 maggio 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai velocipedi (compresi
    i furgoncini a triciclo e simili), senza motore, della voce doganale n. 87.10,
    originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1209/74 van de Commissie van 14 mei 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op rijwielen
    (bakfietsen en dergelijke daaronder begrepen) zonder motor, van post 87.10, van
    oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3501/73
    van de Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
