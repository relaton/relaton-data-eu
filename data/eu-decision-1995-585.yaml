id: EUDecision1995585
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '95/585/EC: Council Decision of 22 December 1995 authorizing certain Member
    States to apply or to continue to apply to certain mineral oils, when used for
    specific purposes, reduced rates of excise duty or exemptions from excise duty,
    in accordance with the procedure provided for in Article 8 (4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/585/CE: Décision du Conseil, du 22 décembre 1995, autorisant certains
    États membres à appliquer ou à continuer à appliquer à certaines huiles minérales
    utilisées à des fins spécifiques des réductions ou des exonérations d''accise
    selon la procédure prévue à l''article 8 paragraphe 4 de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '95/585/EG: Entscheidung des Rates vom 22. Dezember 1995 zur Ermächtigung
    bestimmter Mitgliedstaaten, gemäß dem Verfahren in Artikel 8 Absatz 4 der Richtlinie
    92/81/EWG Verbrauchsteuerermäßigungen oder -befreiungen auf Mineralöle mit
    bestimmten Verwendungszwecken zu gewähren oder beizubehalten'
  type: main
- language: da
  script: Latn
  content: '95/585/EF: Rådets beslutning af 22. december 1995 om bemyndigelse af
    en række medlemsstater til at anvende eller fortsat at anvende punktafgiftsnedsættelser
    eller -fritagelser for visse typer mineralolie, når disse benyttes til særlige
    formål, i overensstemmelse med proceduren i artikel 8, stk. 4, i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '95/585/ΕΚ: Απόφαση του Συμβουλίου της 22ας
    Δεκεμβρίου 1995 με την οποία επιτρέπεται σε ορισμένα
    κράτη μέλη να εφαρμόσουν ή να συνεχίσουν να
    εφαρμόζουν σε ορισμένα πετρελαιοειδή, όταν
    χρησιμοποιούνται για συγκεκριμένους σκοπούς,
    μειώσεις από ειδικούς φόρους κατανάλωσης ή
    απαλλαγές από ειδικούς φόρους κατανάλωσης,
    σύμφωνα με τη διαδικασία που προβλέπεται στο
    άρθρο 8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '95/585/EY: Neuvoston päätös, tehty 22 päivänä joulukuuta 1995, luvan
    antamisesta tietyille jäsenvaltioille soveltaa tai edelleen soveltaa tiettyihin
    erityistarkoituksiin käytettyihin kivennäisöljyihin valmisteveron alennuksia
    tai vapautuksia valmisteverosta direktiivin 92/81/ETY 8 artiklan 4 kohdassa säädetyn
    menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: '95/585/CE: Decisione del Consiglio, del 22 dicembre 1995, che autorizza
    alcuni Stati membri ad applicare o a continuare ad applicare per taluni oli minerali
    utilizzati a fini specifici esenzioni o reduzioni d''accisa secondo la procedura
    di cui all''articolo 8, paragrafo 4 della direttiva 95/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '95/585/EG: Beschikking van de Raad van 22 december 1995 waarbij sommige
    Lid-Staten toestemming wordt verleend om verlaagde accijnstarieven of vrijstellingen
    van accijns toe te passen of te blijven toepassen op bepaalde minerale oliën
    die voor bijzondere doeleinden worden gebruikt, in overeenstemming met de procedure
    van artikel 8, lid 4, van Richtlijn 92/81/EEG'
  type: main
- language: pt
  script: Latn
  content: '95/585/CE: Decisão do Conselho, de 22 de Dezembro de 1995, que autoriza
    certos Estados-membros a aplicar ou a continuar a aplicar reduções ou isenções
    do imposto especial sobre o consumo de certos óleos minerais utilizados para
    fins específicos, nos termos do procedimento previsto no nº 4 do artigo 8º
    da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '95/585/CE: Decisión del Consejo, de 22 de diciembre de 1995, por la que
    se autoriza a determinados Estados miembros a aplicar o seguir aplicando, a determinados
    hidrocarburos utilizados para fines específicos, tipos reducidos del impuesto
    especial o exenciones del mismo, con arreglo al procedimiento del apartado 4 del
    artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '95/585/EG: Rådets beslut av den 22 december 1995 om rätt för vissa
    medlemsstater att på vissa mineraloljor för särskilda användningssätt tillämpa
    nedsatt punktskatt eller medge befrielse från punktskatt enligt det förfarande
    som fastställs i artikel 8.4 i direktiv 92/81/EEG'
  type: main
