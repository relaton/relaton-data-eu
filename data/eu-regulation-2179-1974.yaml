title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2179/74 of the Commission of 20 August 1974 laying
    down in respect of the 1974/75 wine-growing year detailed rules for applying the
    obligation to distil the by-products of wine-making and repealing Regulation (EEC)
    No 2069/73
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2179/74 de la Commission, du 20 août 1974, relatif
    aux modalités d'application de l'obligation de distiller les sous-produits de
    la vinification pour la campagne 1974/1975 et abrogeant le règlement (CEE) n°
    2069/73
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2179/74 der Kommission vom 20. August 1974 über die
    Durchführungsbestimmungen für die Verpflichtung zur Destillation von Nebenerzeugnissen
    der Weinbereitung im Weinwirtschaftsjahr 1974/1975 und zur Aufhebung der Verordnung
    (EWG) Nr. 2069/73
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2179/74 af 20. august 1974 om gennemførelsesbestemmelser
    for forpligtelse til at destillere biprodukter fra vinfremstilling i produktionsåret
    1974/1975 og om ophævelse af forordning (EØF) nr. 2069/73
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2179/74 della Commissione, del 20 agosto 1974, che
    stabilisce le modalità di applicazione dell'obbligo di distillare i sottoprodotti
    della vinificazione per la campagna viticola 1974/1975 e abroga il regolamento
    (CEE) n. 2069/73
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2179/74 van de Commissie van 20 augustus 1974 houdende
    uitvoeringsbepalingen inzake de verplichte distillatie van de bijprodukten van
    de wijnbereiding in het wijnoogstjaar 1974/1975 en houdende intrekking van Verordening
    (EEG) nr. 2069/73
