id: EURegulation9841980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 984/80 of 22 April 1980 re-establishing
    the levying of customs duties on other inner tubes and tyre cases (including tyre
    cases with sewn-in inner tubes and tyre flaps), falling within heading No ex 40.11
    and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 984/80 de la Commission, du 22 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres bandages,
    pneumatiques, etc. (y compris les "flaps" et les boyaux), de la position ex 40.11
    du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 984/80 der Kommission vom 22. April 1980 zur Wiedereinführung
    des Zollsatzes für andere Reifen und Felgenbänder usw. (einschließlich Felgenbänder
    und Schlauchreifen) der Tarifnummer ex 40.11, mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 984/80 af 22. april 1980 om genindførelse
    af opkrævning af toldafgifter for andre dæk, ringe, udskiftelige etc. (herunder
    dæk med isat slange til racercykler, og fælgbånd), under pos. ex 40.11, som
    har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 984/80 della Commissione, del 22 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle altre camera d' aria
    (compresi proiettori [flaps] e tubolari), della voce ex 40.11 della tariffa doganale
    comune, originarie della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 984/80 van de Commissie van 22 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere banden
    en velglinten, enz. (velglinten en tuben daaronder begrepen), van post ex 40.11,
    van oorsprong uit Zuid-Korea ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
