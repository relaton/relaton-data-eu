    à l'avance de certaines viandes bovines désossées détenues par certains organismes
    d'intervention et destinées à être exportées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1064/86 der Kommission vom 11. April 1986 zur Änderung
