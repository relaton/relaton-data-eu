title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2559/93 of 16 September 1993 re-establishing
    the levying of customs duties on products of category 68 (order No 40.0680), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2559/93 de la Commission du 16 septembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 68 (numéro d'ordre 40.0680) originaires d'Inde, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2559/93 DER KOMMISSION vom 16. September 1993 zur
    Wiedereinführung des Zollsatzes für die Waren der Kategorie 68 (laufende Nummer
    40.0680) mit Ursprung in Indien, für die die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2559/93 af 16. september 1993 om genindførelse
    af opkrævning af told for varer under kategori 68 (løbenummer 40.0680), som
    har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
