    riskikaalude asjakohasuse hindamisel, ja tingimused, mida tuleb arvesse võtta
    kinnisvaraga tagatud riskipositsioonide makseviivitusest tingitud kahjumäära
    miinimumväärtuste asjakohasuse hindamisel
  type: main
