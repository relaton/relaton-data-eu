  script: Latn
  content: Komission delegoitu asetus (EU) 2023/206, annettu 5 päivänä lokakuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 575/2013 täydentämisestä
    teknisillä sääntelystandardeilla, joissa täsmennetään kiinteistövakuudellisiin
    vastuisiin sovellettavien riskipainojen asianmukaisuuden arvioinnissa huomioon
    otettavat tekijät ja kiinteistövakuudellisten vastuiden tappio-osuuksien vähimmäislukujen
    asianmukaisuuden arvioinnissa huomioon otettavat edellytykset
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/206 ón gCoimisiún an 5 Deireadh Fómhair
    2022 lena bhforlíontar Rialachán (AE) Uimh. 575/2013 ó Pharlaimint na hEorpa
    agus ón gComhairle maidir le caighdeáin theicniúla rialála lena sonraítear
    na cineálacha fachtóirí atá le cur san áireamh chun measúnú a dhéanamh
    ar oiriúnacht na n-ualaí priacail le haghaidh risíochtaí a urraítear le maoin
    dhochorraithe agus na coinníollacha atá le cur san áireamh chun measúnú a
    dhéanamh ar oiriúnacht luachanna íosta an chaillteanais i gcás mainneachtana
    le haghaidh risíochtaí a urraítear le maoin dhochorraithe
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/206 оd 5. listopada 2022. o dopuni
    Uredbe (EU) br. 575/2013 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda kojima se određuju vrste čimbenika koje treba uzeti u obzir
    pri procjeni primjerenosti pondera rizika za izloženosti osigurane nekretninama
    i uvjeti koje treba uzeti u obzir pri procjeni primjerenosti minimalnih vrijednosti
    gubitka zbog nastanka statusa neispunjavanja obveza za izloženosti osigurane
    nekretninama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/206 felhatalmazáson alapuló rendelete (2022. október
    5.) az 575/2013/EU európai parlamenti és tanácsi rendeletnek az ingatlannal
    fedezett kitettségekre vonatkozó kockázati súlyok megfelelőségének értékelése
    során figyelembe veendő tényezők típusait, valamint az ingatlannal fedezett
    kitettségek minimális nemteljesítéskori veszteségráta értékei megfelelőségének
    értékelése során figyelembe veendő feltételeket meghatározó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/206 della Commissione del 5 ottobre 2022
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i tipi
    di fattori da considerare per la valutazione dell’adeguatezza dei fattori di
    ponderazione del rischio per le esposizioni garantite da beni immobili e le condizioni
    di cui tenere conto per la valutazione dell’adeguatezza dei valori minimi della
    perdita in caso di default per le esposizioni garantite da beni immobili
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/206 (2022. gada 5. oktobris), ar
    ko papildina Eiropas Parlamenta un Padomes Regulu (ES) Nr. 575/2013 attiecībā
    uz regulatīvajiem tehniskajiem standartiem, kuros precizē to faktoru veidus,
    kuri jāņem vērā, lai novērtētu riska pakāpju atbilstību ar nekustamo īpašumu
    nodrošinātiem riska darījumiem, un nosacījumus, kas jāņem vērā, lai novērtētu
    minimālo saistību nepildīšanas zaudējumu vērtību atbilstību ar nekustamo
    īpašumu nodrošinātiem riska darījumiem
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/206 2022 m. spalio 5 d. kuriuo
    Europos Parlamento ir Tarybos reglamentas (ES) Nr. 575/2013 papildomas techniniais
    reguliavimo standartais, kuriais nustatomos veiksnių, kuriuos reikia apsvarstyti
    vertinant nekilnojamuoju turtu užtikrintų pozicijų rizikos koeficientų tinkamumą,
    rūšys ir sąlygos, į kurias reikia atsižvelgti vertinant nekilnojamuoju turtu
    užtikrintų pozicijų mažiausių nuostolio dėl įsipareigojimų neįvykdymo
    verčių tinkamumą
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/206 tal-5 ta’ Ottubru 2022
    li jissupplimenta r-Regolament (UE) Nru 575/2013 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw it-tipi ta’
    fatturi li għandhom jiġu kkunsidrati għall-valutazzjoni tal-adegwatezza tal-piżijiet
    tar-riskju għal skoperturi ggarantiti bi proprjetà immobbli u l-kundizzjonijiet
    li għandhom jitqiesu għall-valutazzjoni tal-adegwatezza tal-valuri minimi ta’
    telf fil-każ ta’ inadempjenza għal skoperturi ggarantiti minn proprjetà immobbli
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/206 van de Commissie van 5 oktober 2022
    tot aanvulling van Verordening (EU) nr. 575/2013 van het Europees Parlement en
    de Raad met technische reguleringsnormen tot nadere bepaling van de soorten factoren
    die in aanmerking moeten worden genomen voor de beoordeling van de geschiktheid
    van risicogewichten voor blootstellingen die gedekt zijn door onroerend goed,
    en van de omstandigheden waarmee rekening moet worden gehouden bij de beoordeling
    van de toereikendheid van de minimumwaarden van het verlies bij wanbetaling voor
    blootstellingen die gedekt zijn door onroerend goed
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/206 z dnia 5 października
    2022 r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr
    575/2013 w zakresie regulacyjnych standardów technicznych określających rodzaje
    czynników, które należy uwzględnić przy ocenie adekwatności wag ryzyka w
    odniesieniu do ekspozycji zabezpieczonych nieruchomościami, oraz warunki, które
    należy uwzględnić przy ocenie adekwatności minimalnych wartości straty z
    tytułu niewykonania zobowiązania w odniesieniu do ekspozycji zabezpieczonych
    nieruchomościami
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/206 da Comissão de 5 de outubro de 2022
    que complementa o Regulamento (UE) n.o 575/2013 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam os
    tipos de fatores a ter em conta ao avaliar a adequação dos ponderadores de risco
    para exposições garantidas por bens imóveis e as condições a ter em conta
    ao avaliar a adequação dos valores mínimos de perda dado o incumprimento para
    exposições garantidas por bens imóveis
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/206 al Comisiei din 5 octombrie 2022 de
    completare a Regulamentului (UE) nr. 575/2013 al Parlamentului European și al
    Consiliului în ceea ce privește standardele tehnice de reglementare care precizează
    tipurile de factori care trebuie avuți în vedere pentru evaluarea caracterului
    adecvat al ponderilor de risc pentru expunerile garantate cu bunuri imobile și
    condițiile care trebuie luate în considerare pentru evaluarea caracterului adecvat
    al valorilor minime ale pierderilor în caz de nerambursare pentru expunerile
    garantate cu bunuri imobile
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/206 z 5. októbra 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 575/2013, pokiaľ
    ide o regulačné technické predpisy, v ktorých sa presne stanovujú typy faktorov,
    ktoré sa majú zohľadniť pri posúdení primeranosti rizikových váh pre expozície
    zabezpečené nehnuteľným majetkom, a podmienky, ktoré sa majú zohľadniť
    pri posudzovaní primeranosti minimálnych hodnôt strát v prípade zlyhania
    pre expozície zabezpečené nehnuteľným majetkom
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/206 z dne 5. oktobra 2022 o dopolnitvi
    Uredbe (EU) št. 575/2013 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi, ki določajo vrste dejavnikov, ki jih je treba upoštevati
    pri oceni ustreznosti uteži tveganja za izpostavljenosti, zavarovane z nepremičninami,
    in pogoje, ki jih je treba upoštevati pri oceni ustreznosti minimalnih vrednosti
    izgube ob neplačilu za izpostavljenosti, zavarovane z nepremičninami
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/206 de la Comisión de 5 de octubre de 2022
    por el que se completa el Reglamento (UE) n.o 575/2013 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    los tipos de factores que deben tenerse en cuenta para evaluar la idoneidad de
    las ponderaciones de riesgo de las exposiciones garantizadas por bienes inmuebles
    y las condiciones que deben tenerse en cuenta para evaluar la idoneidad de los
    valores mínimos de pérdida en caso de impago para las exposiciones garantizadas
    por bienes inmuebles
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/206 av den 5 oktober 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 575/2013
    vad gäller tekniska tillsynsstandarder som specificerar de typer av faktorer
    som ska beaktas vid bedömningen av riskvikters lämplighet för exponeringar
    säkrade genom panträtt i fast egendom och de villkor som ska beaktas vid bedömningen
    av LGD-minimivärdens lämplighet för exponeringar säkrade genom panträtt i
    fast egendom
  type: main
