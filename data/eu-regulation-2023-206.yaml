title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/206 of 5 October 2022 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the types of factors to be
    considered for the assessment of the appropriateness of risk weights for exposures
    secured by immovable property and the conditions to be taken into account for
    the assessment of the appropriateness of minimum loss given default values for
    exposures secured by immovable property
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/206 de la Commission du 5 octobre 2022
    complétant le règlement (UE) no 575/2013 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les types de facteurs
    à prendre en considération pour l’évaluation du caractère approprié des
    pondérations de risque appliquées aux expositions garanties par un bien immobilier
    et les conditions à prendre en considération pour l’évaluation du caractère
    approprié des valeurs minimales de pertes en cas de défaut pour les expositions
    garanties par un bien immobilier
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/206 der Kommission vom 5. Oktober 2022
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung der Arten von
    Faktoren, die bei der Bewertung der Angemessenheit von Risikogewichten für durch
    Immobilien besicherte Risikopositionen zu berücksichtigen sind, und der Bedingungen,
    die bei der Bewertung der Angemessenheit der Mindestwerte für die Verlustquote
    bei Ausfall bei durch Immobilien besicherten Risikopositionen zu berücksichtigen
    sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/206 на Комисията
    от 5 октомври 2022 година за допълнение на Регламент
    (ЕС) № 575/2013 на Европейския парламент и на Съвета
    с регулаторни технически стандарти за определяне
    на видовете фактори, които да се отчитат при
    оценяването на адекватността на рисковите
    тегла на обезпечените с недвижими имоти експозиции,
    и на условията, които да се взимат под внимание
    при оценяването на адекватността на минималните
    стойности на загубата при неизпълнение при
    обезпечените с недвижими имоти експозиции
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/206 ze dne 5. října
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    575/2013, pokud jde o regulační technické normy, jimiž se upřesňují druhy
    faktorů, které je třeba zohlednit při posuzování vhodnosti rizikových vah
    pro expozice zajištěné nemovitostmi, a podmínky, k nimž je třeba přihlédnout
    při posuzování přiměřenosti minimálních hodnot ztrátovosti ze selhání
    pro expozice zajištěné nemovitostmi
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/206 af 5. oktober 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 575/2013
    for så vidt angår reguleringsmæssige tekniske standarder til præcisering af
    de typer faktorer, der skal tages hensyn til ved vurdering af hensigtsmæssigheden
    af risikovægte for eksponeringer sikret ved fast ejendom, og de betingelser,
    der skal tages hensyn til ved vurdering af hensigtsmæssigheden af mindsteværdier
    for tab givet misligholdelse for eksponeringer sikret ved fast ejendom
  type: main
