    provenienti dalle scorte d'intervento e destinate alla trasformazione nella Comunità,
    e recante abrogazione di alcune disposizioni del regolamento (CEE) n. 1431/87
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2215/87 van de Commissie van 24 juli 1987 inzake
