    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention,
    et abrogeant certaines dispositions du règlement (CEE) n 1431/87
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2215/87 der Kommission vom 24. Juli 1987 über den
