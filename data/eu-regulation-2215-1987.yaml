  content: Commission Regulation (EEC) No 2215/87 of 24 July 1987 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community, and repealing certain provisions of Regulation (EEC)
    No 1431/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2215/87 de la Commission, du 24 juillet 1987, relatif
