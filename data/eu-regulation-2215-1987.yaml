    bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur Aufhebung gewisser
    Bestimmungen der Verordnung (EWG) Nr. 1431/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2215/87 af 24. juli 1987 om salg til
