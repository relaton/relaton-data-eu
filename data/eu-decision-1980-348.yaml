id: EUDecision1980348
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/348/EEC: Commission Decision of 3 March 1980 authorizing Ireland not
    to apply Community treatment to woven table linen, toilet and kitchen linen, falling
    within subheading ex 62.02 B II of the Common Customs Tariff (category 39), originating
    in India and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/348/CEE: Décision de la Commission, du 3 mars 1980, autorisant l''Irlande
    à exclure du traitement communautaire le linge de table, linge de toilette, d''office
    et de cuisine, tissé, de la sous-position ex 62.02 B II du tarif douanier commun
    (catégorie 39), originaire de l''Inde et mis en libre pratique dans les autres
    Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/348/EWG: Entscheidung der Kommission vom 3. März 1980, mit der Irland
    ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Tischwäsche, Wäsche zur Körperpflege und andere
    Haushaltswäsche, aus Geweben, der Tarifstelle ex 62.02 B II des Gemeinsamen Zolltarifs,
    Kategorie 39, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/348/EØF: Kommissionens beslutning af 3. marts 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage dækketøj, håndklæder,
    vaskeklude, viskestykker og lignende køkkentekstiler, vævede, som henhører
    under pos. ex 62.02 B II i den fælles toldtarif (kategori 39), har oprindelse
    i Indien og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/348/CEE: Decisione della Commissione, del 3 marzo 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario la biancheria da tavola, da
    toletta, da servizio o da cucina, tessuta, della sottovoce ex 62.02 B II della
    tariffa doganale comune, categoria 39, originaria dell''India e messa in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/348/EEG: Beschikking van de Commissie van 3 maart 1980 waarbij Ierland
    wordt gemachtigd tafellinnen en huishoudlinnen, van post ex 62.02 B II van het
    gemeenschappelijk douanetarief (categorie 39), van oorsprong uit India en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
