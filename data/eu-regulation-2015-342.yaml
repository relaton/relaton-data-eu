title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/342 of 2 March 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza following outbreaks in the States
    of Idaho and California
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/342 de la Commission du 2 mars 2015 modifiant
    l'annexe I du règlement (CE) n ° 798/2008 en ce qui concerne la ligne relative
    aux États-Unis sur la liste des pays tiers, territoires, zones ou compartiments
    à partir desquels certains produits de volailles peuvent être importés dans
    l'Union ou transiter par celle-ci, dans le cadre des mesures prises à la suite
    de l'apparition de foyers d'influenza aviaire hautement pathogène dans les États
    de l'Idaho et de Californie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/342 der Kommission vom 2. März 2015
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags der Vereinigten Staaten in der Liste von Drittländern, Gebieten, Zonen
    und Kompartimenten, aus denen die Einfuhr von Geflügel und Geflügelerzeugnissen
    in die Union und ihre Durchfuhr durch die Union gestattet ist, im Zusammenhang
    mit Ausbrüchen der hochpathogenen Aviären Influenza in den Bundesstaaten Idaho
    und Kalifornien
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/342 на Комисията
    от 2 март 2015 година за изменение, във връзка
    с появата на огнища на високопатогенна инфлуенца
    по птиците в щати Айдахо и Калифорния, на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Съединените щати в списъка на трети държави,
    територии, зони или компартменти, от които
    могат да бъдат внасяни и да преминават транзитно
    през територията на Съюза определени стоки,
    получени от домашни птици
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/342 ze dne 2. března 2015 ,
    kterým se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku
    týkající se Spojených států amerických na seznamu třetích zemí, území,
    oblastí nebo jednotek, z nichž lze do Unie dovážet nebo přes její území
    přepravovat určité drůbeží komodity, v souvislosti s ohnisky vysoce patogenní
    influenzy ptáků ve státě Idaho a Kalifornie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/342 af 2. marts 2015
