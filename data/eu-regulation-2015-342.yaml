    Aidaho ir Kalifornijos valstijose ir Jungtinių Amerikos Valstijų įrašo trečiųjų
    šalių, teritorijų, zonų ar skyrių, iš kurių galima importuoti į Sąjungą
    ir vežti tranzitu per Sąjungą tam tikras naminių paukščių prekes, sąraše
