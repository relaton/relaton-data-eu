    na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih je
    dovoljen uvoz nekaterih perutninskih proizvodov v Unijo ali njihov tranzit skozi
    Unijo, v zvezi z visokopatogeno aviarno influenco po izbruhih v zveznih državah
    Idaho in Kalifornija
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/342 de la Comisión, de 2 de marzo de
