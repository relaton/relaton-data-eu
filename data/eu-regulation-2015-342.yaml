    à entrada relativa aos Estados Unidos na lista de países terceiros, territórios,
    zonas ou compartimentos a partir dos quais são autorizados a importação e o
    trânsito na União de determinados produtos à base de aves de capoeira, no seguimento
    da ocorrência de surtos de gripe aviária de alta patogenicidade nos Estados
    de Idaho e Califórnia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/342 al Comisiei din 2 martie
    2015 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Statele Unite din lista cu țări terțe, teritorii, zone
    sau compartimente din care anumite produse obținute de la păsări de curte pot
    fi importate în Uniune sau pot tranzita Uniunea în contextul riscului de gripă
    aviară înalt patogenă, în urma apariției unor focare în statele Idaho și
    California
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/342 z 2. marca 2015 , ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Spojených štátov amerických v zozname tretích krajín, území, oblastí
    alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti s ohniskami vysokopatogénnej aviárnej
    influenzy v štátoch Idaho a Kalifornia
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/342 z dne 2. marca 2015 o spremembi
