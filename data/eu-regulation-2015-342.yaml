    na popisu trećih zemalja, državnih područja, zona ili kompartmenta iz kojih
    je dozvoljen uvoz i provoz određenih proizvoda od peradi kroz Uniju u vezi s
    visokopatogenom influencom ptica nakon izbijanja bolesti u državama Idaho i Kalifornija
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/342 végrehajtási rendelete ( 2015. március 2.
    ) a 798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    az Egyesült Államokra vonatkozó bejegyzés tekintetében a magas patogenitású
    vírustörzsek okozta madárinfluenza Idaho és Kalifornia államban való megjelenése
    nyomán szükségessé vált módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/342 della Commissione, del 2 marzo
    2015 , che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa agli Stati Uniti nell'elenco di paesi terzi, loro territori,
    zone o compartimenti da cui sono consentiti le importazioni e il transito nell'Unione
    di determinati prodotti a base di pollame, in relazione all'influenza aviaria
    ad alta patogenicità a seguito della comparsa di focolai negli Stati dell'Idaho
    e della California
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/342 ( 2015. gada 2. marts ), ar
