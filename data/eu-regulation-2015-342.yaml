    Savienotajām Valstīm to trešo valstu, teritoriju, zonu un nodalījumu sarakstā,
    no kuriem konkrētas mājputnu izcelsmes preces drīkst Savienībā importēt
    vai tranzītā pārvadāt, saistībā ar augsti patogēno putnu gripu pēc uzliesmojumiem
    Aidaho štatā un Kalifornijas štatā
  type: main
- language: lt
  script: Latn
  content: 2015 m. kovo 2 d. Komisijos įgyvendinimo reglamentas (ES) 2015/342, kuriuo
