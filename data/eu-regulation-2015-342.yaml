    til eller transit gennem Unionen af visse fjerkræprodukter er tilladt i forbindelse
    med højpatogen aviær influenza, som følge af udbrud i staterne Idaho og Californien
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2015/342 της Επιτροπής,
