    respecto a la entrada relativa a los Estados Unidos en la lista de terceros países,
    territorios, zonas o compartimentos desde los cuales están permitidos la importación
    en la Unión o el tránsito por la misma de determinados productos de aves de
    corral, en relación con la influenza aviar altamente patógena a raíz de la
    aparición de brotes en los Estados de Idaho y California
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/342 av den 2 mars 2015
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Förenta staterna i förteckningen över tredjeländer, områden, zoner eller
    delområden från vilka vissa varor av fjäderfä får importeras till och transiteras
    genom unionen i samband med högpatogen aviär influensa efter utbrott i delstaterna
    Idaho och Kalifornien
