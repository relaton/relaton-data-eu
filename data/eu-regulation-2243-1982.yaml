  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2243/82 della Commissione, del 12 agosto 1982, che
    istituisce un dazio antidumping provvisorio sulle importazioni di metilammina,
    dimetilammina e trimetilammina originarie della Repubblica democratica tedesca,
    che accetta un impegno e conclude la procedura per quanto riguarda le importazioni
    di metilammina, dimetilammina e trimetilammina originarie della Romania`
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2243/82 van de Commissie van 12 augustus 1982 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van methylamine, dimethylamine
    en trimethylamine van oorsprong uit de Duitse Democratische Republiek, en houdende
    aanvaarding van een verbintenis en beëindiging van de procedure betreffende de
    invoer van methylamine, dimethylamine en trimethylamine van oorsprong uit Roemenië
