title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2243/82 of 12 August 1982 imposing a provisional
    anti-dumping duty on imports of methylamine, dimethylamine and trimethylamine
    originating in the German Democratic Republic and accepting an undertaking and
    terminating the procedure in respect of imports of methylamine, dimethylamine
    and trimethylamine originating in Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2243/82 de la Commission, du 12 août 1982, instituant
    un droit anti-"dumping" provisoire sur les importations de méthylamine, diméthylamine
    et triméthylamine originaires de la République démocratique allemande, d' une
    part, et portant acceptation d' un engagement et clôture de la procédure concernant
    les importations de méthylamine, diméthylamine et triméthylamine originaires
    de Roumanie, d' autre partc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2243/82 der Kommission vom 12. August 1982 über die
    Einführung eines vorläufigen Antidumpingzolls auf Methylamin, Dimethylamin und
    Trimethylamin mit Ursprung in der Deutschen Demokratischen Republik sowie über
    die Annahme einer Verpflichtung betreffend die Einfuhren von Methylamin, Dimethylamin
    und Trimethylamin mit Ursprung in Rumänien und über die Einstellung letzteren
    Verfahrenso
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2243/82 af 12. august 1982 om indførelse
    af en midlertidig antidumpingtold på importen af methylamin, dimethylamin og
    trimethylamin med oprindelse i Den tyske demokratiske Republik og om godtagelse
    af et tilsagn og afslutning af proceduren vedrørende import af methylamin, dimethylamin
    og trimethylamin med oprindelse i Rumæniene
  type: main
- language: el
  script: Grek
