    τής 12ης Αυγούστου 1982 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στίς εισαγωγές μεθυλαμίνης,
    διμεθυλαμίνης καί τριμεθυλαμίνης καταγωγής
