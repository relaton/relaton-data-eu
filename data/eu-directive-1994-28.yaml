  script: Latn
  content: Council Directive 94/28/EC of 23 June 1994 laying down the principles relating
    to the zootechnical and genealogical conditions applicable to imports from third
    countries of animals, their semen, ova and embryos, and amending Directive 77/504/EEC
    on pure-bred breeding animals of the bovine species
  type: main
- language: fr
  script: Latn
