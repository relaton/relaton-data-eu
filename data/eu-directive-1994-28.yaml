    aux conditions zootechniques et généalogiques applicables à l'importation en
    provenance des pays tiers d'animaux, de spermes, d'ovules et d'embryons, et modifiant
    la directive 77/504/CEE concernant les animaux de l'espèce bovine reproducteurs
    de race pure
  type: main
- language: de
  script: Latn
  content: Richtlinie 94/28/EG des Rates vom 23. Juni 1994 über die grundsätzlichen
