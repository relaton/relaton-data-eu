    Sperma, Eizellen und Embryonen aus Drittländern und zur Änderung der Richtlinie
    77/504/EWG über reinrassige Zuchtrinder
  type: main
- language: bg
  script: Cyrl
  content: Директива 94/28/ЕО на Съвета от 23 юни 1994 година
