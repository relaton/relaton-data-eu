title:
- language: en
  script: Latn
  content: Commission Decision of 30 September 1976 on the granting by the Guidance
    Section of the EAGGF to the Federal Republic of Germany of a payment on account
    in respect of expenditure incurred during 1975 on annuities relating to measures
    to encourage the cessation of farming and the reallocation of utilized agricultural
    area for the purposes of structural improvement
  type: main
- language: fr
  script: Latn
  content: '76/797/CEE: Décision de la Commission, du 30 septembre 1976, relative
    au versement par le FEOGA, section orientation, à la République fédérale d''Allemagne,
    d''un acompte sur les dépenses effectuées pendant l''année 1975 pour les indemnités
    relatives à l''encouragement à la cessation de l''activité agricole et à l''affectation
    de la superficie agricole utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. September 1976 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1975 zur Förderung
    der Einstellung der landwirtschaftlichen Erwerbstätigkeit und der Verwendung
    der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben an die Bundesrepublik Deutschland
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. september 1976 om udbetaling gennem EUGFL,
    udviklingssektionen til Forbundsrepublikken Tyskland af et a contobeløb for de
    udgifter, som er afholdt i løbet af året 1975 til godtgørelser vedrørende
    støtte til ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal
    til strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 settembre 1976, relativa al versamento
    da parte del FEAOG, sezione orientamento, alla Repubblica federale di Germania
    di un anticipo sulle spese effettuate durante il 1975 per le indennità concernenti
    l'incoraggiamento alla cessazione dell'attività agricola e alla destinazione
    della superficie agricola utilizzata a scopi di miglioramento delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 september 1976 inzake de betaling door
    het E.O.G.F.L., afdeling Oriëntatie, aan de Bondsrepubliek Duitsland van een
    voorschot voor de gedurende het jaar 1975 gedane uitgaven voor de uitkeringen
    met betrekking tot de bevordering van de bedrijfsbeëindiging in de landbouw en
    van de aanwending van cultuurgrond tot verbetering van de structuur
