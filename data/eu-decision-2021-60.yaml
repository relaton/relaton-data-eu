---
id: EUDecision202160
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/60 of 22 January 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 87427 × MON 89034 × MIR162 × NK603 and genetically
    modified maize combining two or three of the single events MON 87427, MON 89034,
    MIR162 and NK603, and repealing Implementing Decision (EU) 2018/1111 pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2021) 150) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/60 de la Commission du 22 janvier 2021
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 87427 × MON 89034 × MIR162 × NK603 et du maïs génétiquement
    modifié combinant deux ou trois des événements simples MON 87427, MON 89034,
    MIR162 et NK603, consistant en ces maïs ou produits à partir de ceux-ci, et
    abrogeant la décision d’exécution (UE) 2018/1111, en application du règlement
    (CE) no 1829/2003 du Parlement européen et du Conseil [notifiée sous le numéro
    C(2021) 150] (Le texte en langue néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/60 der Kommission vom 22. Januar 2021
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte MON 87427 × MON 89034 × MIR162 × NK603 enthalten, aus ihm bestehen
    oder aus ihm hergestellt werden, und von genetisch verändertem Mais, bei dem
    zwei oder drei der Einzelereignisse MON 87427, MON 89034, MIR162 und NK603 kombiniert
    werden, sowie zur Aufhebung des Durchführungsbeschlusses (EU) 2018/1111 der Kommission
    gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des
    Rates (Bekannt gegeben unter Aktenzeichen C(2021)150) (Nur der niederländische
    Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/60 на Комисията
    от 22 януари 2021 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 87427 × MON 89034 × MIR162 × NK603 и генетично
    модифицирана царевица, съвместяваща две или
    три от единичните събития MON 87427, MON 89034, MIR162 и
    NK603, и за отмяна на Решение за изпълнение (ЕС)
    2018/1111 в съответствие с Регламент (ЕО) № 1829/2003
    на Европейския парламент и на Съвета (нотифицирано
    под номер С(2021) 150) (само текстът на нидерландски
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/60, ze dne 22. ledna 2021 o povolení
    uvádění produktů, které obsahují geneticky modifikovanou kukuřici MON 87427
    × MON 89034 × MIR162 × NK603 a geneticky modifikovanou kukuřici kombinující
    dvě nebo tři z jednoduchých událostí MON 87427, MON 89034, MIR162 a NK603,
    sestávají z nich nebo jsou z nich vyrobeny, na trh a o zrušení prováděcího
    rozhodnutí (EU) 2018/1111 podle nařízení Evropského parlamentu a Rady (ES)
    č. 1829/2003 (oznámeno pod číslem C(2021) 150) (Pouze nizozemské znění
    je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/60 af 22. januar 2021
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret MON 87427 × MON 89034 × MIR162 × NK603-majs
    og genetisk modificeret majs, der kombinerer to eller tre af begivenhederne MON
    87427, MON 89034, MIR162 og NK603, og om ophævelse af gennemførelsesafgørelse
    (EU) 2018/1111 i henhold til Europa-Parlamentets og Rådets forordning (EF) nr.
    1829/2003 (meddelt under nummer C(2021) 150) (Kun den nederlandske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/60 της Επιτροπής
    της 22ας Ιανουαρίου 2021 για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    MON 87427 × MON 89034 × MIR162 × NK603 και γενετικώς τροποποιημένο
    αραβόσιτο που συνδυάζει δύο ή τρία από τα μονά
    συμβάντα MON 87427, MON 89034, MIR162 και NK603 και την κατάργηση
    της εκτελεστικής απόφασης (ΕΕ) 2018/1111 σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1829/2003 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου [κοινοποιηθείσα
    υπό τον αριθμό C(2021) 150] (Το κείμενο στην ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/60, 22. jaanuar 2021, millega lubatakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EÜ) nr 1829/2003 lasta
    turule geneetiliselt muundatud maisi MON 87427 × MON 89034 × MIR162 × NK603
    ning geneetiliselt muundatud maisi, milles on kombineeritud kaks või kolm MON
    87427, MON 89034, MIR162 ja NK603 transformatsioonidest, sisaldavaid, neist koosnevaid
    või valmistatud tooteid, ning millega tunnistatakse kehtetuks rakendusotsus (EL)
    2018/1111 (teatavaks tehtud numbri C(2021) 150 all) (Ainult hollandikeelne tekst
    on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/60, annettu 22 päivänä
    tammikuuta 2021, muuntogeenistä maissia MON 87427 × MON 89034 × MIR162 × NK603
    ja yksittäisistä geenimuunnostapahtumista MON 87427, MON 89034, MIR162 ja NK603
    kahta tai kolmea yhdistelemällä muodostettua muuntogeenistä maissa sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille saattamisen
    sallimisesta sekä komission täytäntöönpanopäätöksen (EU) 2018/1111 kumoamisesta
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu
    numerolla C(2021) 150) (Ainoastaan hollanninkielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/60 оd 22. siječnja 2021. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    MON 87427 × MON 89034 × MIR162 × NK603, sastoje se ili su proizvedeni od njega,
    i genetski modificirani kukuruz u kojem se kombiniraju dvije ili tri od pojedinačnih
    promjena MON 87427, MON 89034, MIR162 i NK603 te o stavljanju izvan snage Provedbene
    odluke (EU) 2018/1111, na temelju Uredbe (EZ) br. 1829/2003 Europskog parlamenta
    i Vijeća (priopćeno pod brojem dokumenta C(2021) 150) (Vjerodostojan je samo
    tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/60 végrehajtási határozata (2021. január 22.)
    a géntechnológiával módosított MON 87427 × MON 89034 × MIR162 × NK603
    kukoricát és a géntechnológiával módosított, a MON 87427, a MON 89034,
    a MIR162 és az NK603 egyszeres genetikai események közül kettőt vagy hármat
    ötvöző kukoricát tartalmazó, abból álló vagy abból előállított termékek
    forgalomba hozatalának az 1829/2003/EK európai parlamenti és tanácsi rendelet
    szerinti engedélyezéséről, valamint az (EU) 2018/1111 bizottsági végrehajtási
    határozat hatályon kívül helyezéséről (az értesítés a C(2021) 150. számú
    dokumentummal történt) (Csak a holland nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/60 della Commissione del 22 gennaio 2021
    che autorizza l’immissione in commercio di prodotti contenenti, costituiti o
    derivati dal granturco geneticamente modificato MON 87427 × MON 89034 × MIR162
    × NK603 e dal granturco geneticamente modificato che combina due o tre dei singoli
    eventi MON 87427, MON 89034, MIR162 e NK603, e che abroga la decisione di esecuzione
    (UE) 2018/1111 a norma del regolamento (CE) n. 1829/2003 del Parlamento europeo
    e del Consiglio [notificata con il numero C(2021) 1150] (Il testo in lingua neerlandese
    è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/60 (2021. gada 22. janvāris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu MON 87427
    × MON 89034 × MIR162 × NK603 un tādu ģenētiski modificēto kukurūzu, kurā
    kombinēti divi vai trīs vienkārši notikumi MON 87427, MON 89034, MIR162 un
    NK603, no tās sastāv vai ir no tās ražoti, un atceļ Īstenošanas lēmumu
    (ES) 2018/1111 (izziņots ar dokumenta numuru C(2021) 150) (Autentisks ir tikai
    teksts nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/60 2021 m. sausio 22 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    MON 87427 × MON 89034 × MIR162 × NK603 ir genetiškai modifikuotų kukurūzų,
    sudarytų iš dviejų ar trijų atskirų MON 87427, MON 89034, MIR162 ir NK603
    transformacijos įvykių derinių, kurie iš šių kukurūzų sudaryti arba pagaminti,
    ir panaikinamas Komisijos įgyvendinimo sprendimas (ES) 2018/1111 (pranešta dokumentu
    Nr. C(2021) 150) (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/60 tat-22
    ta’ Jannar 2021 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu jew li huma prodotti mill-qamħirrum modifikat ġenetikament MON 87427
    × MON 89034 × MIR162 × NK603, u mill-qamħirrun modifikat ġenetikament li
    jikkombina tnejn jew tlieta mill-eventi uniċi MON 87427, MON 89034, MIR162 u
    NK603, u li jħassar id-Deċiżjoni ta’ Implimentazzjoni (UE) 2018/1111 skont
    ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata
    bid-dokument C(2021)150) (It-test Olandiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/60 van de Commissie van 22 januari 2021 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 87427 × MON 89034 × MIR162 × NK603 en genetisch gemodificeerde maisrassen
    die twee of drie van de afzonderlijke transformatiestappen MON 87427, MON 89034,
    MIR162 en NK603 combineert, en tot intrekking van Uitvoeringsbesluit (EU) 2018/1111
    overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement en de
    Raad (Kennisgeving geschied onder nummer C(2021) 150) (Slechts de tekst in de
    Nederlandse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/60 z dnia 22 stycznia 2021 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    MON 87427 × MON 89034 × MIR162 × NK603 oraz rodzaje genetycznie zmodyfikowanej
    kukurydzy łączące dwie lub trzy modyfikacje MON 87427, MON 89034, MIR162 i
    NK603, produktów składających się z wymienionych rodzajów genetycznie zmodyfikowanej
    kukurydzy lub z niej wyprodukowanych, oraz uchylająca decyzję wykonawczą Komisji
    (UE) 2018/1111 (notyfikowana jako dokument nr C(2021) 150) (Jedynie tekst w języku
    niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/60 da Comissão de 22 de janeiro de 2021
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado MON 87427 ×
    MON 89034 × MIR162 × NK603 e milho geneticamente modificado combinando dois
    ou três dos eventos únicos MON 87427, MON 89034, MIR162 e NK603, e que revoga
    a Decisão de Execução (UE) 2018/1111, nos termos do Regulamento (CE) n.o 1829/2003
    do Parlamento Europeu e do Conselho [notificada com o número C(2021) 150] (Apenas
    faz fé o texto em língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/60 a Comisiei din 22 ianuarie
    2021 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic MON 87427 × MON 89034 ×
    MIR162 × NK603 și din porumb modificat genetic obținut din combinarea a două
    sau trei dintre evenimentele de transformare MON 87427, MON 89034, MIR162 și
    NK603 și de abrogare a Deciziei de punere în aplicare (UE) 2018/1111 în temeiul
    Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    [notificată cu numărul C(2021) 150] (Numai textul în limba neerlandeză este
    autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/60 z 22. januára 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    MON 87427 × MON 89034 × MIR162 × NK603 a geneticky modifikovanú kukuricu obsahujúcu
    kombináciu dvoch alebo troch genetických modifikácií MON 87427, MON 89034,
    MIR162 a NK603, sú z nich zložené alebo vyrobené, a ktorým sa zrušuje vykonávacie
    rozhodnutie Komisie (EÚ) 2018/1111 [oznámené pod číslom C(2021) 150] (Iba
    holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/60 z dne 22. januarja 2021 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON 87427 ×
    MON 89034 × MIR162 × NK603, so iz nje sestavljeni ali proizvedeni, in gensko
    spremenjeno koruzo, v kateri sta združena dva ali trije od dogodkov MON 87427,
    MON 89034, MIR162 in NK603, ter razveljavitvi Izvedbenega sklepa (EU) 2018/1111
    v skladu z Uredbo (ES) št. 1829/2003 Evropskega parlamenta in Sveta (notificirano
    pod dokumentarno številko C(2021) 150) (Besedilo v nizozemskem jeziku je edino
    verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/60 de la Comisión de 22 de enero de
    2021 por la que se autoriza la comercialización de productos que contengan, se
    compongan o se hayan producido a partir del maíz modificado genéticamente MON
    87427 × MON 89034 × MIR162 × NK603, y de maíz modificado genéticamente que
    combine dos o tres de los eventos únicos MON 87427, MON 89034, MIR162 y NK603,
    de conformidad con el Reglamento (CE) n.o 1829/2003 del Parlamento Europeo y del
    Consejo, y por la que se deroga la Decisión de Ejecución (UE) 2018/1111 [notificada
    con el número C(2021) 150] (El texto en lengua neerlandesa es el único auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/60 av den 22 januari 2021 om
    godkännande för utsläppande på marknaden av produkter som innehåller, består
    av eller har framställts av den genetiskt modifierade majsen MON 87427 × MON
    89034 × MIR162 × NK603 och av genetiskt modifierad majs som kombinerar två
    eller tre av de enskilda transformationshändelserna MON 87427, MON 89034, MIR162
    och NK603 samt om upphävande av kommissionens genomförandebeslut (EU) 2018/1111,
    i enlighet med Europaparlamentets och rådets förordning (EG) nr 1829/2003 (delgivet
    med nr C(2021) 150) (Endast den nederländska texten är giltig)
