title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 août 1970, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure du traitement
    communautaire les tissus écrus en fibres synthétiques et artificielles, des
    positions Ex 51.04 et Ex 56.07 du Tarif douanier commun, originaires du Japon
    et mis en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: '70/404/EWG: Entscheidung der Kommission vom 5. August 1970, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die aus Japan stammenden und in der Bundesrepublik Deutschland
    im freien Verkehr befindlichen Rohgewebe aus synthetischen oder künstlichen Spinnfäden
    der Tarifnummern ex 51.04 und ex 56.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/404/CEE: Decisione della Commissione, del 5 agosto 1970, che autorizza
    il Regno del Belgio, il Granducato di Lussemburgo ed il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i tessuti greggi di fibre tessili sintetiche
    ed artificiali delle voci ex 51.04 e ex 56.07 della tariffa doganale comune, originari
    del Giappone e messi in libera pratica nella Repubblica federale di Germania'
  type: main
- language: nl
  script: Latn
  content: '70/404/EEG: Beschikking van de Commissie van 5 augustus 1970 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd ongebleekt doek van synthetische en van kunstmatige vezels van
    de posten ex 51.04 en ex 56.07 van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de Bondsrepubliek Duitsland in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
