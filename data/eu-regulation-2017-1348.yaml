title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1348 of 19 July 2017 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Implementing Regulation (EU) No 1008/2011, as amended by Implementing
    Regulation (EU) No 372/2013, on imports of hand pallet trucks and their essential
    parts originating in the People's Republic of China by imports consigned from
    Vietnam, whether declared as originating in Vietnam or not, and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/1348 de la Commission du 19 juillet 2017
    portant ouverture d'une enquête sur un éventuel contournement des mesures antidumping
    instituées par le règlement d'exécution (UE) n° 1008/2011 du Conseil, tel
    que modifié par le règlement d'exécution (UE) n° 372/2013, sur les importations
    de transpalettes à main et de leurs parties essentielles originaires de la République
    populaire de Chine par des importations des mêmes produits expédiés du Viêt
    Nam, qu'ils aient ou non été déclarés originaires de ce pays, et soumettant
    ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/1348 der Kommission vom 19. Juli 2017
