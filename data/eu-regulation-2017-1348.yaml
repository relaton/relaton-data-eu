    der Durchführungsverordnung (EU) Nr. 1008/2011 des Rates, geändert durch die
    Durchführungsverordnung (EU) Nr. 372/2013, eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren manueller Palettenhubwagen und wesentlicher Teile davon
    mit Ursprung in der Volksrepublik China durch aus Vietnam versandte Einfuhren,
    ob als Ursprungserzeugnisse Vietnams angemeldet oder nicht, und zur zollamtlichen
    Erfassung der letztgenannten Einfuhren
