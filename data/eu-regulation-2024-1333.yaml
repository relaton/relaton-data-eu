title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1333 of 17 May 2024 amending
    and correcting Annex III to Implementing Regulation (EU) 2020/2235 as regards
    model certificates for the entry into the Union of live fish, live crustaceans
    and products of animal origin from those animals and certain fishery products,
    intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1333 de la Commission du 17 mai 2024
    modifiant et rectifiant l’annexe III du règlement d’exécution (UE) 2020/2235
    en ce qui concerne les modèles de certificat pour l’entrée dans l’Union
    de poissons vivants, de crustacés vivants et de produits d’origine animale
    issus de ces animaux ainsi que de certains produits de la pêche destinés à
    la consommation humaine
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1333 der Kommission vom 17. Mai 2024
    zur Änderung und Berichtigung von Anhang III der Durchführungsverordnung (EU)
    2020/2235 in Bezug auf Musterbescheinigungen für den Eingang in die Union von
    lebenden Fischen, lebenden Krebstieren, aus diesen Tieren gewonnenen Erzeugnissen
    tierischen Ursprungs und bestimmten Fischereierzeugnissen, die für den menschlichen
    Verzehr bestimmt sind
  type: main
