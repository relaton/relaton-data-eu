  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/1333 della Commissione, del 17 maggio
    2024, che modifica e rettifica l’allegato III del regolamento di esecuzione
    (UE) 2020/2235 per quanto riguarda i modelli di certificati per l’ingresso nell’Unione
    di pesci vivi, crostacei vivi, prodotti di origine animale ottenuti da tali animali
    e determinati prodotti della pesca destinati al consumo umano
  type: main
- language: lv
  script: Latn
