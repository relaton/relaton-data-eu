    szánt élő halak, élő rákfélék és az ezekből származó, emberi fogyasztásra
    szánt állati eredetű termékek, valamint bizonyos, emberi fogyasztásra szánt
    halászati termékek Unióba történő beléptetésére vonatkozó bizonyítványminták
