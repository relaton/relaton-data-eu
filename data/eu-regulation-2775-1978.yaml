title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2775/78 of 28 November 1978 re-establishing
    the levying of customs duties on articles of asbestos-cement, of cellulose fibre-cement
    or the like, falling within heading No 68.12, originating in Yugoslavia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2775/78 de la Commission, du 28 novembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    en amiante-ciment, cellulose-ciment et similaires, de la position tarifaire 68.12,
    originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2775/78 der Kommission vom 28. November 1978 zur Wiedereinführung
    des Zollsatzes fúr Waren aus Asbestzement, Zellulosezement oder dergleichen,
    der Tarifnummer 68.12, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2775/78 af 28. november 1978 om genindførelse
    af opkrævning af toldafgifter for varer af asbestcement, cellulosecement o.lign.,
    under position 68.12, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2775/78 della Commissione, del 28 novembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di amianto-cemento,
    cellulosa-cemento e simili, della voce doganale 68.12, originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2775/78 van de Commissie van 28 november 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op werken van
    asbestcement, van cellulosecement en dergelijke, van post 68.12, van oorsprong
    uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
