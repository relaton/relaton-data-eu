  content: Décision 65/169/CEE du Conseil du 29 mars 1965, portant prorogation et
    modification de la décision du Conseil du 4 avril 1962, prévoyant la perception
    d'une taxe compensatoire sur certaines marchandises résultant de la transformation
    de produits agricoles
  type: main
- language: de
  script: Latn
  content: '65/159/EWG: Beschluß des Rates vom 29. März 1965 zur Verlängerung und
    Änderung des Beschlusses des Rates vom 4. April 1962 zur Erhebung einer Ausgleichsabgabe
    auf bestimmte Waren, die durch Verarbeitung landwirtschaftlicher Erzeugnisse entstehen'
  type: main
- language: it
  script: Latn
  content: '65/159/CEE: Decisione del Consiglio, del 29 marzo 1965, che proroga e
    modifica la decisione del Consiglio del 4 aprile 1962 relativa alla percezione
    di una tassa di compensazione su talune merci risultanti dalla trasformazione
    di prodotti agricoli'
  type: main
- language: nl
  script: Latn
  content: '65/159/EEG: Besluit van de Raad van 29 maart 1965 houdende verlenging
    en wijziging van zijn besluit van 4 april 1962 inzake het opleggen van een compenserende
    heffing op bepaalde produkten, verkregen uit de verwerking van landbouwprodukten'
  type: main
