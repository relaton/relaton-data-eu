- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/733 of 5 May 2021 amending
    Implementing Regulation (EU) No 887/2011 and Implementing Regulation (EU) 2017/961
    as regards the name of the holder of the authorisation of Enterococcus faecium
    CECT 4515 as a feed additive and amending Implementing Regulation (EU) 2020/1395
    as regards the name of the holder of the authorisation of Bacillus amyloliquefaciens
    CECT 5940 as a feed additive
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/733 de la Commission du 5 mai 2021
    modifiant le règlement d’exécution (UE) no 887/2011 et le règlement d’exécution
    (UE) 2017/961 en ce qui concerne le nom du titulaire de l’autorisation d’Enterococcus
    faecium CECT 4515 en tant qu’additif pour l’alimentation animale et modifiant
    le règlement d’exécution (UE) 2020/1395 en ce qui concerne le nom du titulaire
    de l’autorisation de Bacillus amyloliquefaciens CECT 5940 en tant qu’additif
    pour l’alimentation animale
