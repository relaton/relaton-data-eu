title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2656/2000 of 1 December 2000 deciding not
    to accept tenders submitted in response to the 256th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2656/2000 de la Commission du 1er décembre 2000 disposant
    de ne pas donner suite aux offres déposées à la suite de la 256e adjudication
    partielle effectuée dans le cadre des mesures générales d'intervention conformément
    au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2656/2000 der Kommission vom 1. Dezember 2000 über
    den Beschluss, den zur 256. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2656/2000 af 1. december 2000 om ikke
    at tage den 256. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2656/2000 της Επιτροπής,
    της 1ης Δεκεμβρίου 2000, για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τη 256η μερική
    δημοπρασία που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2656/2000, annettu 1 päivänä joulukuuta 2000,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun 256. osittaisen tarjouskilpailun ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2656/2000 della Commissione, del 1° dicembre 2000,
    che decide di non dar seguito alle offerte presentate per la 256a gara parziale
    effettuata nel quadro delle misure generali d'intervento conformemente al regolamento
    (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2656/2000 van de Commissie van 1 december 2000 houdende
    het besluit om geen gevolg te geven aan de offertes in het kader van de 256e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2656/2000 da Comissão, de 1 de Dezembro de 2000,
    que rejeita as propostas apresentadas na sequência do 256.° concurso parcial
    efectuado no âmbito das medidas gerais de intervenção, em conformidade com
    o Regulamento (CEE) n.° 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2656/2000 de la Comisión, de 1 de diciembre de 2000,
    por el que se decide no dar curso a las ofertas presentadas para la 256a licitación
    parcial efectuada en el marco de las medidas generales de intervención en virtud
    del Reglamento (CEE) n° 1627/89
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2656/2000 av den 1 december 2000 om att
    inte fullfölja det tvåhundrafemtiösjätte delanbudsförfarandet som inletts
    som en allmän interventionsåtgärd i enlighet med förordning (EEG) nr 1627/89
  type: main
