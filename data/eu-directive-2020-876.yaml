title:
- language: en
  script: Latn
  content: Council Directive (EU) 2020/876 of 24 June 2020 amending Directive 2011/16/EU
    to address the urgent need to defer certain time limits for the filing and exchange
    of information in the field of taxation because of the COVID-19 pandemic
  type: main
- language: fr
  script: Latn
  content: Directive (UE) 2020/876 du Conseil du 24 juin 2020 modifiant la directive
    2011/16/UE afin de répondre au besoin urgent de reporter certains délais pour
    la déclaration et l’échange d’informations dans le domaine de la fiscalité
    en raison de la pandémie de COVID-19
  type: main
- language: de
  script: Latn
  content: Richtlinie (EU) 2020/876 des Rates vom 24. Juni 2020 zur Änderung der
    Richtlinie 2011/16/EU, um der dringenden Notwendigkeit einer Verlängerung bestimmter
    Fristen für die Vorlage und den Austausch von Informationen im Bereich der Besteuerung
    infolge der COVID-19-Pandemie Rechnung zu tragen
  type: main
