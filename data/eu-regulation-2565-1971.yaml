  content: Règlement (CEE) n 2565/71 de la Commission, du 25 novembre 1971, fixant
    les taux des restitutions applicables, à compter du 1er décembre 1971, au sucre
    et à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2565/71 der Kommission vom 25. November 1971 zur Festsetzung
    der ab 1. Dezember 1971 geltenden Erstattungssätze bei der Ausfuhr von Zucker
    und Melasse in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2565/71 della Commissione, del 25 novembre 1971, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 dicembre 1971,
    allo zucchero e al melasso esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2565/71 van de Commissie van 25 november 1971 houdende
    vaststelling van de restituties die met ingang van 1 december 1971 worden toegepast
    voor suiker en melasse, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
