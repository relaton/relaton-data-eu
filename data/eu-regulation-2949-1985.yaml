title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2949/85 of 23 October 1985 re-establishing
    the levying of customs duties applicable to ammonium chloride falling within subheading
    28.30 A ex I, originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2949/85 de la Commission du 23 octobre 1985 portant
    rétablissement de la perception des droits de douane applicables au chlorure
    d' ammonium, de la sous-position 28.30 A ex I du tarif douanier commun, originaire
    de la Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2949/85 der Kommission vom 23. Oktober 1985 zur Wiedereinführung
    der Erhebung der Zölle für Ammoniumchlorid der Tarifstelle 28.30 A ex I mit
    Ursprung in China, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2949/85 af 23. oktober 1985 om genindførelse
    af opkrævning af told for chlorider af ammonium henhørende under pos. 28.30
    A ex I og med oprindelse i Kina som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3562/84
  type: main
