title:
- language: en
  script: Latn
  content: '92/20/EEC: Commission Decision of 12 December 1991 Amending Decision 90/541/EEC
    determining the countries to the companies or other legal persons of which legal
    protection of topographies of semiconducteur products is extended'
  type: main
- language: fr
  script: Latn
  content: '92/20/CEE: Décision de la Commission, du 12 décembre 1991, modifiant
    la décision 90/541/CEE déterminant les pays dont les sociétés ou autres personnes
    juridiques bénéficient d'' une extension de la protection juridique des topographies
    des produits semi­conducteurs'
  type: main
- language: de
  script: Latn
  content: '92/20/EWG: Entscheidung der Kommission vom 12. Dezember 1991 zur Änderung
    der Entscheidung 90/541/EWG zur Bestimmung der Länder, auf deren Unternehmen
    oder sonstige juristische Personen der Rechtsschutz für Topographien von Halbleitererzeugnissen
    ausgedehnt wird'
  type: main
- language: da
  script: Latn
  content: '92/20/EØF: Kommissions beslutning af 12. december 1991 om ændring af
    beslutning 90/541/EØF om fastsættelse af de lande, hvis selskaber eller andre
    juridiske personer den retlige beskyttelse af halvlederprodukters topografi udvides
    til at omfatte'
  type: main
- language: el
  script: Grek
  content: '92/20/ΕΟΚ: Απόφαση της Επιτροπής της 12ης Δεκεμβρίου
    1991 για τροποποίηση της απόφασης 90/541/ΕΟΚ για
    τον καθορισμό των χωρών στις εταιρείες ή άλλα
    νομικά πρόσωπα των οποίων επεκτείνεται η νομική
    προστασία των τοπογραφιών προϊόντων ημιαγωγών'
  type: main
- language: it
  script: Latn
  content: '92/20/CEE: Decisione della Commissione, del 12 dicembre 1991, che modifica
    la decisione 90/541/CEE che stabilisce i paesi alle cui imprese o altre persone
    giuridiche è estesa la tutela delle topografie dei prodotti a semiconduttori'
  type: main
- language: nl
  script: Latn
  content: '92/20/EEG: Beschikking van de Commissie van 12 december 1991 tot wijziging
    van Beschikking 90/541/EEG tot vaststelling van de landen wier vennootschappen
    of andere rechtspersonen rechtsbescherming van topografieën van halfgeleiderprodukten
    genieten'
  type: main
- language: pt
  script: Latn
  content: '92/20/CEE: Decisão da Comissão, de 12 de Dezembro de 1991, que altera
    a Decisão 90/541/CEE que determina os países a cujas empresas ou outras pessoas
    colectivas é alargada a protecção jurídica das topografias de produtos semicondutores'
  type: main
- language: es
  script: Latn
  content: '92/20/CEE: Decisión de la Comisión, de 12 de diciembre de 1991, por
    la que se modifica la Decisión 90/541/CEE por la que se determinan los países
    en los que se amplía la protección jurídica de las topografías de los productos
    semiconductores a determinadas sociedades y otras personas jurídicas'
  type: main
