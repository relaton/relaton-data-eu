title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 504/79 of 15 March 1979 re-establishing
    the levying of customs duties on umbrellas and sunshades, etc., falling within
    heading No 66.01 and originating in Hong Kong, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 504/79 de la Commission, du 15 mars 1979, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, etc., de la position tarifaire 66.01, originaires de Hong-kong
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 504/79 der Kommission vom 15. März 1979 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme, usw., der Tarifnummer 66.01,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 504/79 af 15. marts 1979 om genindførelse
    af opkrævning af toldafgifter for paraplyer og parasoller, etc., under position
    66.01, som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 504/79 della Commissione, del 15 marzo 1979, che ripristina
    la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia e da sole),
    ecc., della voce 66.01 della tariffa doganale comune, originari di Hong Kong beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 504/79 van de Commissie van 15 maart 1979 houdende
    wederinstelling van de heffingen van de invoerrechten van toepassing op paraplu'
    s en parasols, enz., van post 66.01, van oorsprong uit Hong-Kong, ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
