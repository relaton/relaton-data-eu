    ir tam tikrų jos Karūnos priklausinių įtraukimo į trečiųjų šalių arba
    jų dalių, iš kurių leidžiama į Sąjungą įvežti avinių ir ožkinių rūšių
    gyvūnų spermą, kiaušialąstes ir embrionus, sąrašus iš dalies keičiami
