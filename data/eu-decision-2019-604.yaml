    Spojeného kráľovstva Veľkej Británie a Severného Írska a niektorých z
    jeho závislých území Britskej koruny do zoznamov tretích krajín alebo ich
    častí, z ktorých sa povoľuje dovoz zásielok spermy, vajíčok a embryí oviec
    a kôz do Únie [oznámené pod číslom C(2019) 2838]
  type: main
