    Egyesült Királyságának és egyes koronafüggőségeinek a juh- és kecskefélékhez
    tartozó állatok spermáinak, petesejtjeinek és embrióinak Unióba történő
    behozatalára engedéllyel rendelkező harmadik országok, illetve azok részeinek
    jegyzékeibe való felvétele tekintetében történő módosításáról (az
    értesítés a C(2019) 2838. számú dokumentummal történt)
