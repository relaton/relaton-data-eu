title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/604 of 11 April 2019 amending
    Annexes I and III to Decision 2010/472/EU as regards the inclusion of the United
    Kingdom of Great Britain and Northern Ireland and certain of its Crown Dependencies
    in the lists of third countries or parts thereof authorised for the introduction
    into the Union of semen, ova and embryos of animals of the ovine and caprine species
    (notified under document C(2019) 2838)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/604 de la Commission du 11 avril 2019
    modifiant les annexes I et III de la décision 2010/472/UE en ce qui concerne
    l'inscription du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord et de certaines
    dépendances de la Couronne sur les listes des pays tiers ou parties de pays tiers
    en provenance desquels l'introduction dans l'Union de sperme, d'ovules et d'embryons
    d'ovins et de caprins est autorisée [notifiée sous le numéro C(2019) 2838]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/604 der Kommission vom 11. April 2019
    zur Änderung der Anhänge I und III des Beschlusses 2010/472/EU im Hinblick auf
    die Aufnahme des Vereinigten Königreichs Großbritannien und Nordirland und mancher
    seiner unmittelbar der englischen Krone unterstehenden Gebiete in die Listen der
    Drittländer und Teile von Drittländern, aus denen die Einfuhr von Samen, Eizellen
    und Embryonen von Schafen und Ziegen in die Union zugelassen ist (Bekannt gegeben
    unter Aktenzeichen C(2019) 2838)
  type: main
- language: bg
