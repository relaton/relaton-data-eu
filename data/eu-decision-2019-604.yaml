    království Velké Británie a Severního Irska a určitých jeho závislých
    území do seznamů třetích zemí nebo jejich částí, ze kterých je povolen
    vstup spermatu, vajíček a embryí ovcí a koz na území Unie (oznámeno pod
    číslem C(2019) 2838)
  type: main
