    riguarda l'inclusione del Regno Unito di Gran Bretagna e Irlanda del Nord e di
    alcune dipendenze della Corona negli elenchi dei paesi terzi, o di parti di essi,
    autorizzati a introdurre nell'Unione sperma, ovuli ed embrioni di animali delle
    specie ovina e caprina [notificata con il numero C(2019) 2838]
  type: main
