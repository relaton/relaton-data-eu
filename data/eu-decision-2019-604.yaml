    includerea Regatului Unit al Marii Britanii și Irlandei de Nord și a anumitor
    teritorii dependente ale Coroanei Britanice în lista țărilor terțe sau părților
    acestora autorizate să introducă în Uniune material seminal, ovule și embrioni
    de animale din speciile ovină și caprină [notificată cu numărul C(2019) 2838]
  type: main
