id: EUDecision1979261
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/261/EEC: Commission Decision of 22 February 1979 authorizing the French
    Republic not to apply Community treatment to toys made of wood or other (except
    motors and movement mechanisms for toys and working models used for recreational
    purposes and parts thereof), falling within subheadings 97.03 A and ex B of the
    Common Customs Tariff, originating in Japan and in free circulation in the other
    Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/261/CEE: Décision de la Commission, du 22 février 1979, autorisant
    la République française à exclure du traitement communautaire les jouets en
    bois et autres (à l''exception des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées), des sous-positions
    97.03 A et ex B du tarif douanier commun, originaires du Japon et mis en libre
    pratique dans les autres Etats membres (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/261/EWG: Entscheidung der Kommission vom 22. Februar 1979, mit der
    die Französische Republik ermächtigt wird, aus Japan stammendes und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliches Spielzeug aus Holz und andere (mit
    Ausnahme der Motor- und Bewegungsmechanismen für Spielzeug und Modelle zum Spielen
    sowie deren Ersatzteile) der Tarifstellen 97.03 A und ex B des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/261/EØF: Kommissionens beslutning af 22. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ eller andre materialer (bortset fra motoren og bevægelsesmekanismer til
    legetøj og modeller samt dele hertil), som henhører under pos. 97.03 A og ex
    B i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/261/CEE: Decisione della Commissione, del 22 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori e i meccanismi di animazione per giocattoli e
    modelli ridotti ed i loro pezzi staccati), delle sottovoci 97.03 A e ex B della
    tariffa doganale comune, originari del Giappone e messi in libera pratica negli
    altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/261/EEG: Beschikking van de Commissie van 22 februari 1979 waarbij
    de Franse Republiek wordt gemachtigd speelgoed uit hout en andere (met uitzondering
    van animatiemotoren en mechanismen voor speelgoed en modellen op schaal alsook
    hun onderdelen), van post 97.03 A en ex B van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
