    (ЕС) 2019/6 на Европейския парламент и на Съвета
    чрез определяне на правила относно подходящите
    мерки за гарантиране на ефективната и безопасна
    употреба на ветеринарните лекарствени продукти,
    разрешени и предписвани за прилагане през
    устата по начини, различни от употребата им
    под формата на медикаментозни фуражи, и даването
    на животните, отглеждани за производство на
    храни, от лицето, което отглежда животните
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/1159 ze dne 7. února
    2024, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2019/6
    stanovením pravidel o vhodných opatřeních k zajištění účinného a bezpečného
    používání veterinárních léčivých přípravků povolených a předepsaných
    pro perorální podávání jinými způsoby než prostřednictvím medikovaného
    krmiva a podávaných chovatelem zvířatům určeným k produkci potravin
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/1159 af 7. februar 2024 om
