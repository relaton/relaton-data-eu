title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/1159 of 7 February 2024 supplementing
    Regulation (EU) 2019/6 of the European Parliament and of the Council by laying
    down rules on appropriate measures to ensure the effective and safe use of veterinary
    medicinal products authorised and prescribed for oral administration via routes
    other than medicated feed and administered by the animal keeper to food-producing
    animals
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/1159 de la Commission du 7 février 2024
    complétant le règlement (UE) 2019/6 du Parlement européen et du Conseil en
    établissant des règles relatives aux mesures appropriées pour assurer l’utilisation
    efficace et sûre des médicaments vétérinaires autorisés et prescrits pour
    administration par voie orale autres que les aliments médicamenteux administrés
    par le détenteur des animaux aux animaux producteurs d’aliments
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/1159 der Kommission vom 7. Februar 2024
    zur Ergänzung der Verordnung (EU) 2019/6 des Europäischen Parlaments und des
    Rates durch Festlegung von Bestimmungen über angemessene Maßnahmen, mit denen
    eine wirksame und sichere Anwendung von Tierarzneimitteln gewährleistet werden
    soll, die für die orale Verabreichung bzw. Anwendung auf anderem Wege denn als
    Arzneifuttermittel zugelassen und verschrieben wurden und vom Tierhalter an der
    Lebensmittelgewinnung dienende Tiere verabreicht werden
  type: main
- language: bg
  script: Cyrl
