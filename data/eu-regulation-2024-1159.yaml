    taisykles dėl tinkamų priemonių užtikrinti veiksmingam ir saugiam veterinarinių
    vaistų, kurie leidžiami naudoti ir skiriami vartoti oraliniu būdu ir kuriuos
    gyvūnų laikytojas duoda maistiniams gyvūnams, naudojimui ne vaistinių pašarų
