    pravidiel týkajúcich sa primeraných opatrení na zaistenie účinného a bezpečného
    používania veterinárnych liekov povolených a predpísaných na perorálne
    podávanie inými cestami ako prostredníctvom medikovaného krmiva a podávaných
    držiteľom zvierat zvieratám určeným na výrobu potravín
  type: main
