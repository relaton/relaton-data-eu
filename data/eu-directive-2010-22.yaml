    86/415/EGK és 87/402/EGK tanácsi irányelvnek, valamint a 2000/25/EK és a 2003/37/EK
    európai parlamenti és tanácsi irányelvnek a műszaki fejlődéshez való hozzáigazítása
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2010/22/UE della Commissione, del 15 marzo 2010 , che modifica,
    per adeguarle al progresso tecnico, le direttive del Consiglio 80/720/CEE, 86/298/CEE,
    86/415/CEE e 87/402/CEE nonché le direttive del Parlamento europeo e del Consiglio
