title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/1952 of 13 October 2022 on the position to be
    taken on behalf of the Union within the Special Committee on Geographical Indications
    and Trade in Wines and Spirits established by the Economic Partnership Agreement
    between the European Union and its Member States, of the one part, and the SADC
    EPA States, of the other part, as regards the adoption of the rules of procedure
    of the Special Committee
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/1952 du Conseil du 13 octobre 2022 relative à la position
    à prendre, au nom de l’Union, au sein du comité spécial en matière d’indications
    géographiques et de commerce des vins et boissons spiritueuses établi par l’accord
    de partenariat économique entre l’Union européenne et ses États membres,
    d’une part, et les États de l’APE CDAA, d’autre part, en ce qui concerne
    l’adoption du règlement intérieur du comité spécial
  type: main
- language: de
  script: Latn
