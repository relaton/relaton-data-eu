    og Handel med Vin og Spiritus, der er nedsat ved den økonomiske partnerskabsaftale
    mellem Den Europæiske Union og dens medlemsstater på den ene side og SADC-ØPA-landene
    på den anden side, til vedtagelsen af det særlige udvalgs forretningsorden
  type: main
- language: el
  script: Grek
