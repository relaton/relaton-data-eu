    der Union in dem mit dem Wirtschaftspartnerschaftsabkommen zwischen der Europäischen
    Union und ihren Mitgliedstaaten einerseits und den SADC-WPA-Staaten andererseits
    eingesetzten Sonderausschuss für geografische Angaben und den Handel mit Weinen
    und Spirituosen im Hinblick auf die Annahme der Geschäftsordnung des Sonderausschusses
    zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/1952 на Съвета от 13 октомври
    2022 година относно позицията, която трябва да
    се заеме от името на Съюза в рамките на Специалния
    комитет по географските означения и търговията
    с вина и спиртни напитки, създаден със Споразумението
    за икономическо партньорство между Европейския
    съюз и неговите държави членки, от една страна,
    и държавите по СИП ЮАОР, от друга страна, във
    връзка с приемането на процедурния правилник
    на Специалния комитет
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/1952 ze dne 13. října 2022 o postoji, který
    má být jménem Unie zaujat ve Zvláštním výboru pro zeměpisná označení
    a obchod s vínem a lihovinami zřízeném Dohodou o hospodářském partnerství
    mezi Evropskou unií a jejími členskými státy na jedné straně a státy Jihoafrického
    společenství pro rozvoj (SADC) EPA na straně druhé, pokud jde o přijetí
    jednacího řádu zvláštního výboru
  type: main
