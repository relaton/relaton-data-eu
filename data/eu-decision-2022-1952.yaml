  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/1952 od 13. listopada 2022. o stajalištu koje
    treba zauzeti u ime Unije u okviru Posebnog odbora o oznakama zemljopisnog podrijetla
    i trgovini vinima i jakim alkoholnim pićima osnovanog Sporazumom o gospodarskom
    partnerstvu između Europske unije i njezinih država članica, s jedne strane,
    i država SADC SGP-a, s druge strane, u pogledu donošenja poslovnika Posebnog
    odbora
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/1952 határozata (2022. október 13.) az egyrészről
    az Európai Unió és tagállamai, és másrészről az SADC-GPM-államok közötti
    gazdasági partnerségi megállapodással létrehozott, a földrajzi jelzésekkel,
    valamint a borok és a szeszes italok kereskedelmével foglalkozó különbizottságban
    a különbizottság eljárási szabályzatának elfogadása tekintetében az Unió
    által képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/1952 del Consiglio del 13 ottobre 2022 sulla posizione
    da adottare a nome dell’Unione in sede di comitato speciale per le indicazioni
    geografiche e il commercio di vini e bevande spiritose istituito dall’accordo
    di partenariato economico tra l’Unione europea e i suoi Stati membri, da una
    parte, e gli Stati della SADC aderenti all’APE, dall’altra, riguardo alla
    prevista adozione del regolamento interno del comitato speciale
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/1952 (2022. gada 13. oktobris) par nostāju,
    kas Savienības vārdā jāieņem Īpašajā komitejā ģeogrāfiskās izcelsmes
    norāžu un vīnu un stipro alkoholisko dzērienu tirdzniecības jautājumos,
    kas izveidota ar Ekonomisko partnerattiecību nolīgumu starp Eiropas Savienību
    un tās dalībvalstīm, no vienas puses, un DAK EPN valstīm, no otras puses,
    attiecībā uz īpašās komitejas reglamenta pieņemšanu
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/1952 2022 m. spalio 13 d. dėl pozicijos,
    kurios Sąjungos vardu turi būti laikomasi Europos Sąjungos bei jos valstybių
    narių ir PAVB EPS valstybių ekonominės partnerystės susitarimu įsteigtame
    Specialiajame geografinių nuorodų, prekybos vynu ir spiritiniais gėrimais komitete,
    dėl Specialiojo komiteto darbo tvarkos taisyklių priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/1952 tat-13 ta’ Ottubru 2022 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni fi ħdan il-Kumitat Speċjali dwar l-Indikazzjonijiet
    Ġeografiċi u l-Kummerċ tal-Inbejjed u l-Ispirti stabbilit mill-Ftehim ta’
    Sħubija Ekonomika bejn l-Unjoni Ewropea u l-Istati Membri tagħha, min-naħa
    waħda, u l-Istati tal-SADC aderenti mal-FSE, min-naħa l-oħra, b’rabta mal-adozzjoni
    tar-regoli ta’ proċedura tal-Kumitat Speċjali
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/1952 van de Raad van 13 oktober 2022 inzake het standpunt
    dat namens de Unie moet worden ingenomen in het Speciaal Comité voor geografische
    aanduidingen en handel in wijn en gedistilleerde dranken dat is ingesteld bij
    de economische partnerschapsovereenkomst tussen de Europese Unie en haar lidstaten,
    enerzijds, en de SADC-EPO-staten, anderzijds, wat betreft de vaststelling van
    het reglement van orde van het Speciaal Comité
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/1952 z dnia 13 października 2022 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii w ramach Specjalnego Komitetu ds. Oznaczeń
    Geograficznych oraz Handlu Winem i Napojami Spirytusowymi ustanowionego na podstawie
    Umowy o partnerstwie gospodarczym między Unią Europejską i jej państwami członkowskimi,
    z jednej strony, a państwami SADC UPG, z drugiej strony, w związku z przyjęciem
    regulaminu wewnętrznego Komitetu Specjalnego
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/1952 do Conselho de 13 de outubro de 2022 relativa à
    posição a tomar em nome da União Europeia no âmbito do Comité Especial das
    indicações geográficas e comércio de vinhos e de bebidas espirituosas criado
    pelo Acordo de Parceria Económica entre a União Europeia e os seus Estados-Membros,
    por um lado, e os Estados do APE SADC, por outro, no que diz respeito à adoção
    do regulamento interno do Comité Especial
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/1952 a Consiliului din 13 octombrie 2022 privind poziția
    care urmează să fie adoptată în numele Uniunii în cadrul Comitetului special
    pentru indicații geografice și comerțul cu vinuri și băuturi spirtoase instituit
    prin Acordul de parteneriat economic dintre Uniunea Europeană și statele membre
    ale acesteia, pe de o parte, și statele părți la APE din SADC, pe de altă
    parte, în ceea ce privește adoptarea regulamentului de procedură al Comitetului
    special
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/1952 z 13. októbra 2022 o pozícii, ktorá
    sa má v mene Únie zaujať v Osobitnom výbore pre zemepisné označenia a obchod
    s vínom a liehovinami zriadenom Dohodou o hospodárskom partnerstve medzi Európskou
    úniou a jej členskými štátmi na jednej strane a štátmi SADC-DHP na strane
    druhej, pokiaľ ide o prijatie rokovacieho poriadku osobitného výboru
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/1952 z dne 13. oktobra 2022 o stališču, ki se v
    imenu Unije zastopa v Posebnem odboru za geografske označbe ter trgovino z vini
    in žganimi pijačami, ustanovljenem s Sporazumom o gospodarskem partnerstvu med
    Evropsko unijo in njenimi državami članicami na eni strani ter državami SADC,
    ki izvajajo SGP, na drugi strani, v zvezi s sprejetjem poslovnika Posebnega odbora
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/1952 del Consejo de 13 de octubre de 2022 relativa
    a la posición que debe adoptarse en nombre de la Unión en el Comité Especial
    sobre Indicaciones Geográficas y Comercio de Vinos y Bebidas Espirituosas, creado
    por el Acuerdo de Asociación Económica entre la Unión Europea y sus Estados
    miembros, por una parte, y los Estados del AAE de la SADC, por otra, en lo que
    respecta a la aprobación del reglamento interno del Comité Especial
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/1952 av den 13 oktober 2022 om den ståndpunkt
    som ska intas på unionens vägnar i den särskilda kommitté för geografiska
    beteckningar och handel med vin och sprit som inrättades genom det ekonomiska
    partnerskapsavtalet mellan Europeiska unionen och dess medlemsstater, å ena sidan,
    och de avtalsslutande SADC-staterna, å andra sidan, vad gäller antagandet av
    den särskilda kommitténs arbetsordning
