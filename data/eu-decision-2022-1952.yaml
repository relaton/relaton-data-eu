    leis an gComhaontú um Chomhpháirtíocht Eacnamaíoch idir an tAontas Eorpach
    agus a Bhallstáit, de pháirt, agus na Stáit atá i gComhphobal Forbraíochta
    Dheisceart na hAfraice atá sa Chomhaontú Comhpháirtíochta Eacnamaíche, den
