title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1235/88 of 5 May 1988 re-establishing the
    levying of customs duties on table linen, toilet and kitchen linen, other than
    knitted or crocheted, or terry fabrics of cotton, products of category No 39 (order
    No 40.0390), originating in Pakistan to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1235/88 de la Commission du 5 mai 1988 portant rétablissement
    de la perception des droits de douane applicables au linge de table, de toilette
    ou de cuisine autre que de bonneterie ou éponge de la catégorie de produits
    n° 39 (numéro d' ordre 40.0390), originaires du Pakistan, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1235/88 der Kommission vom 5. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Tischwäsche, Wäsche zur Körperpflege und Haushaltswäsche,
    andere als aus Gewirken oder Frottiergewebe, der Warenkategorie Nr. 39 (lfd. Nr.
    40.0390) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3783/87
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1235/88 af 5. maj 1988 om genindførelse
    af opkrævning af toldafgifter for dækketøj, håndklæder, vaskeklude, viskestykker
    og lignende køkkentekstiler, ikke af frottéstof, under varekategori nr. 39 (løbenummer
    40.0390), som har oprindelse i Pakistan og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
