    της 5ης Μαΐου 1988 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για πανικά τραπεζιού, καθαριότητας
    ή κουζίνας εκτός από πλεκτά, εκτός από τα φλοκωτά,
    σπογγοειδή ή από βαμβάκι, προϊόντα της κατηγορίας
