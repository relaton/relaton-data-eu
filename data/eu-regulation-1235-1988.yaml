    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3783/87 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1235/88 della Commissione del 5 maggio 1988 che ripristina
    la riscossione dei dazi doganali applicabili alla biancheria da toletta o da cucina,
    esclusa quella a maglia e quella del tipo spugna, della categoria di prodotti
    n. 39 (numero d' ordine 40.0390), originari del Pakistan beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1235/88 van de Commissie van 5 mei 1988 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op tafellinnen,
    huishoudlinnen, ander dan van brei- of haakwerk of frotteerstof, van de categorie
    van produkten nr. 39 (volgnummer 40.0390), van oorsprong uit Pakistan, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3783/87
    van de Raad
  type: main
- language: pt
