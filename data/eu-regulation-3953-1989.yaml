title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3953/89 of 27 December 1989 re-establishing
    the levying of customs duties on nets, products of category 97 (order No 40.0970),
    originating in Mexico, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3953/89 de la Commission du 27 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux filets de
    la catégorie de produits n° 97 (numéro d'ordre 40.0970), originaires du Mexique,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3953/89 DER KOMMISSION vom 27. Dezember 1989 ueber
    die Wiedereinfuehrung des Zollsatzes fuer Netze der Warenkategorie Nr. 97 (lfd.
    Nr. 40.0970) mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 4259/88
    des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3953/89 af 27. december 1989 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn under varekategori
    97 (løbenummer 40.0970), som har oprindelse i Mexico og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3953/89 της Επιτροπής
    της 27ης Δεκεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για δίχτυα,
    προϊόντα της κατηγορίας 97 ( αύξων αριθμός 40.0970
    ), καταγωγής Μεξικού, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 4259/88 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3953/89 DELLA COMMISSIONE del 27 dicembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili alle reti della categoria
    di prodotti n. 97 (numero d'ordine 40.0970), originarie del Messico, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3953/89 VAN DE COMMISSIE van 27 december 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op netten van
    de categorie van produkten nr. 97 (volgnummer 40.0970), van oorsprong uit Mexico,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 4259/88 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3953/89 DA COMISSAO de 27 de Dezembro de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicaveis às redes da categoria
    de produtos n* 97 (n* de ordem 40.0970), originarios do México, beneficiario
    das preferências pautais previstas no Regulamento (CEE) n* 4259/88 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3953/89 DE LA COMISION de 27 de diciembre de 1989 relativo
