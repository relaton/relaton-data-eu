title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1207/77 of 7 June 1977 maintaining in force
    the arrangements subjecting to authorization imports into the United Kingdom of
    certain knitted or crocheted under garments originating in the Republic of India
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1207/77 du Conseil, du 7 juin 1977, portant maintien
    du régime soumettant à autorisation les importations au Royaume-Uni de certains
    vêtements de dessous de bonneterie originaires de la République de l'Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1207/77 des Rates vom 7. Juni 1977 zur Aufrechterhaltung
    der Regelung, mit der die Einfuhr bestimmter Unterkleidung aus Gewirken mit Ursprung
    in der Republik Indien in das Vereinigte Königreich von der Vorlage einer Genehmigung
    abhängig gemacht wird
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1207/77 af 7. juni 1977 om opretholdelse
    af importbevillingsordningen ved indførsel til Det forenede Kongerige af visse
    underbeklædningsgenstande af trikotage med oprindelse i republikken Indien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1207/77 del Consiglio, del 7 giugno 1977, che mantiene
    in vigore il regime che subordina a licenza le importazioni nel Regno Unito di
    determinate sottovesti a maglia originarie della Repubblica dell'India
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1207/77 van de Raad van 7 juni 1977 tot handhaving
    van de regeling waarbij de invoer in het Verenigd Koninkrijk van bepaalde onderkleding
    van brei- of haakwerk, van oorsprong uit de Republiek India, aan invoervergunningen
    wordt onderworpen
  type: main
