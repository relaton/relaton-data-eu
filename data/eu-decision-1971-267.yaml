title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er juillet 1971, portant dérogation à
    la recommandation n° 1-64 de la Haute Autorité relative à un relèvement de
    la protection frappant les produits sidérurgiques à la périphérie de la Communauté
    (quarante-sixième dérogation)
  type: main
- language: de
  script: Latn
  content: '71/267/EGKS: Entscheidung der Kommission vom 1. Juli 1971 betreffend Ausnahmen
    von der Empfehlung Nr. 1/64 der Hohen Behörde über eine Erhöhung des Außenschutzes
    gegenüber Einfuhren von Stahlerzeugnissen in die Gemeinschaft (Sechsundvierzigste
    Ausnahmeentscheidung)'
  type: main
- language: it
  script: Latn
  content: '71/267/CECA: Decisione della Commissione, del 1 luglio 1971, che autorizza
    deroghe alla raccomandazione n. 1-64 dell''Alta Autorità relativa al rafforzamento
    della protezione che colpisce i prodotti siderurgici all''entrata nella Comunità
    (Quarantaseiesima deroga)'
  type: main
- language: nl
  script: Latn
  content: '71/267/EGKS: Beschikking van de Commissie van 1 juli 1971 houdende afwijking
    van Aanbeveling nr. 1-64 van de Hoge Autoriteit betreffende een verhoging van
    de bescherming van de ijzer- en staalprodukten aan de buitengrenzen van de Gemeenschap
    (zesenveertigste uitzonderingsbeschikking)'
