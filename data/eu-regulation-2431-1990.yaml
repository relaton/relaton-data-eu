title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2431/90 of 21 August 1990 fixing for the
    1990/91 marketing year the minimum price to be paid to producers for unprocessed
    sultanas, currants and muscatels and the amount of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2431/90 de la Commission du 21 août 1990 fixant,
    pour la campagne 1990/1991, le prix minimal à payer aux producteurs pour les
    sultanines, les raisins secs de Corinthe et les variétés Moscatel non transformés,
    ainsi que le montant de l'aide à la production pour ces raisins secs
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2431/90 DER KOMMISSION vom 21. August 1990 zur Festsetzung
    des den Erzeugern unverarbeiteter Sultaninen, Korinthen und Moscatel zu zahlenden
    Mindestpreises sowie der Produktionsbeihilfe fuer getrocknete Korinthen im Wirtschaftsjahr
    1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2431/90 af 21. august 1990 om fastsættelse
    for produktionsåret 1990/91 af den minimumspris, der skal betales producenten
    af uforarbejdede sultanas, korender og muskateller, samt af producentstøtten
    for disse tørrede druer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2431/90 της Επιτροπής
    της 21ης Αυγούστου 1990 που καθορίζει, για την
    περίοδο εμπορίας 1990/91, την ελάχιστη τιμή που
    καταβάλλεται στους παραγωγούς για τις σουλτανίνες,
    τις κορινθιακές σταφίδες, και τις μη μεταποιημένες
    ποικιλίες Moscatel, καθώς και το ποσό της ενίσχυσης
    στην παραγωγή για τις σταφίδες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2431/90 DELLA COMMISSIONE del 21 agosto 1990 che fissa,
    per la campagna di commercializzazione 1990-1991, il prezzo minimo da pagare ai
    produttori di uva Sultanina, di uva secca di Corinto e di Moscatel non trasformate
    e l'importo dell'aiuto alla produzione per le dette uve
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2431/90 VAN DE COMMISSIE van 21 augustus 1990 tot
    vaststelling voor het verkoopseizoen 1990/1991 van de voor sultanarozijnen, krenten
    (basisprodukt) en Moscatel aan de telers te betalen minimumprijs, alsmede van
    het bedrag van de steun bij de produktie van deze rozijnen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2431/90 DA COMISSAO de 21 de Agosto de 1990 que fixa,
    para a campanha de comercializaçao de 1990/1991, o preço minimo a pagar aos
    produtores para as sultanas, uvas secas de Corinto e passas de uva Moscatel nao
    transformadas e o montante de ajuda à produçao para estas uvas secas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2431/90 DE LA COMISION de 21 de agosto de 1990 por
    el que se establece el precio minimo que debe pagarse a los productores de sultaninas,
    pasas de Corinto y pasas moscatel no transformadas y el importe de la ayuda a
    la produccion de dichas pasas para la campana de 1990-1991
  type: main
