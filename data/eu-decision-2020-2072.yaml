title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/2072 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Communities and their Member States, of the one part, and the Republic
    of Serbia, of the other part, as regards the amendment of that Agreement by replacing
    Protocol 3 thereto concerning the definition of the concept of ‘originating
    products’ and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/2072 du Conseil du 7 décembre 2020 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil de stabilisation
    et d’association institué par l’accord de stabilisation et d’association
    entre les Communautés européennes et leurs États membres, d’une part, et
    la République de Serbie, d’autre part, en ce qui concerne la modification dudit
    accord par le remplacement de son protocole no 3 portant sur la définition de
    la notion de «produits originaires» et sur les méthodes de coopération administrative
  type: main
