    a C(2023) 6729. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/2134 della Commissione, del 13 ottobre
    2023, che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato MON 87419 in conformità al regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2023) 6729]
  type: main
- language: lv
  script: Latn
