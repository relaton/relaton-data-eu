    MON 87419 ili se sastoje ili su proizvedeni od njega, u skladu s Uredbom (EZ)
    br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2023) 6729)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/2134 végrehajtási határozata (2023. október
