    või sellest toodetud tooteid vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2023) 6729 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/2134, annettu 13 päivänä
