    géinmhodhnaithe MON 87419, nó atá comhdhéanta de, nó a tháirgtear as, a
    chur ar an margadh de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa
    agus ón gComhairle (tugadh fógra faoi leis an doiciméad C(2023) 6729)
  type: main
- language: hr
  script: Latn
