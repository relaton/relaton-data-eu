    MON 87419, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2023)
    6729)
  type: main
- language: da
  script: Latn
