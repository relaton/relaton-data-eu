title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/2134 of 13 October 2023 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 87419 pursuant to Regulation (EC) No 1829/2003
    of the European Parliament and of the Council (notified under document C(2023)
    6729)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/2134 de la Commission du 13 octobre
    2023 autorisant la mise sur le marché de produits contenant le maïs génétiquement
    modifié MON 87419, consistant en ce maïs ou produits à partir de celui-ci,
    conformément au règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2023) 6729]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/2134 der Kommission vom 13. Oktober 2023
