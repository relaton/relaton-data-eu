title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 576/86 of 28 February 1986 fixing, until
    the end of the 1985/86 marketing year, the accession compensatory amounts applicable
    to cereals and rice and the coefficients to be used for the calculation of the
    amounts applicable to certain processed products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 576/86 de la Commission du 28 février 1986 fixant
    les montants compensatoires "adhésion" applicables dans les secteurs des céréales
    et du riz jusqu' à la fin de la campagne 1985/1986 ainsi que les coefficients
    à retenir pour le calcul des montants applicables à certains produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 576/86 der Kommission vom 28. Februar 1986 zur Festsetzung
    der bis zum Ende des Wirtschaftsjahres 1985/86 geltenden Beitrittsausgleichsbeträge
    für Getreide und Reis sowie der Koeffizienten für die Berechnung der auf bestimmte
    Verarbeitungserzeugnisse anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 576/86 af 28. februar 1986 om fastsættelse
    af tiltrædelsesudligningsbeløbene for korn og ris indtil udgangen af høståret
    1985/86 og af de koefficienter, der skal lægges til grund ved beregning af beløbene
    for visse forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 576/86 της Επιτροπής
    της 28ης Φεβρουαρίου 1986 για τον καθορισμό των
    εξισωτικών ποσών προσχώρησης που εφαρμόζονται
    στους τομείς σιτηρών και του ρυζιού μέχρι το
    τέλος της περιόδου 1985/86 καθώς και των συντελεστών
    που λαμβάνονται υπόψη για τον υπολογισμό των
    ποσών που εφαρμόζονται σε ορισμένα μεταποιημένα
    προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 576/86 della Commissione del 28 febbraio 1986 che
    fissa gli importi compensativi adesione applicabili nei settori dei cereali e
    del riso sino alla fine della campagna 1985/1986 nonché i coefficienti da prendere
    in considerazione per il calcolo degli importi applicabili a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 576/86 van de Commissie van 28 februari 1986 tot
    vaststelling van de compenserende bedragen toetreding die tot het einde van het
    verkoopseizoen 1985/1986 van toepassing zijn in de sectoren granen en rijst, alsmede
    van de coëfficiënten voor de berekening van de bedragen die gelden voor sommige
    verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 576/86 da Comissão de 28 de Fevereiro de 1986 que
    fixa os montantes compensatórios de adesão aplicáveis nos sectores dos cereais
    e do arroz até ao final da campanha de 1985/1986, bem como os coeficientes a
    utilizar para o cálculo dos montantes aplicáveis a determinados produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 576/86 de la Comisión de 28 de febrero de 1986 por
    el que se fijan los montantes compensatorios de adhesión aplicables en los sectores
    de los cereales y del arroz hasta la finalización de la campaña 1985/86, así
    como los coeficientes que deberán utilizarse para el cálculo de los montantes
    aplicables a determinados productos transformados
  type: main
