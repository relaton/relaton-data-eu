type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2059/73 of the Commission of 27 July 1973 re-establishing
    Common Customs Tariff duties on sacks and bags, of a kind used for the packing
    of goods, of cotton, falling within subheading No 62.03 B ex II, originating in
    South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2764/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2059/73 de la Commission, du 27 juillet 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux sacs et sachets d' emballage en tissus de coton, de la sous-position tarifaire
    62.03 B ex II, originaires de la Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2764/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2059/73 der Kommission vom 27. Juli 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Säcke und Beutel
    zu Verpackungszwecken, aus Geweben aus Baumwolle, der Tarifstelle 62.03 B ex II,
    mit Ursprung in Korea (Süd-), dem die in der Verordnung (EWG) Nr. 2764/72 des
    Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2059/73 af 27. juli 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for sække og poser til emballage, af
    bomuld under underposition 62.03 B ex II, som har oprindelse i Syd-Korea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2764/72
    af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2059/73 della Commissione, del 27 luglio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    sacchi e sacchetti di imballaggio in tessuti di cotone, della sottovoce doganale
    n. 62.03 B ex II originari della Corea del Sud, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2764/72 del Consiglio, del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2059/73 van de Commissie van 27 juli 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op zakken voor verpakkingsdoeleinden, van weefsels van katoen van
    onderverdeling 62.03 B ex II, van oorsprong uit Zuid-Korea, waarvan de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2764/72 van de
    Raad van 19 december 1972
  type: main
