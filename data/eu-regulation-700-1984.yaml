title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 700/84 of 16 March 1984 re-establishing
    the levying of customs duties on ammonium chloride, falling within subheading
    28.30 A ex I and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 700/84 de la Commission du 16 mars 1984 portant rétablissement
