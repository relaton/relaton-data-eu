title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2567/80 of 7 October 1980 re-establishing
    the levying of customs duties on equipment for parlour, falling within heading
    No 97.04 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2567/80 de la Commission, du 7 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour jeux de société, de la position 97.04 du tarif douanier commun, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2567/80 der Kommission vom 7. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Gesellschaftsspiele der Tarifnummer 97.04, mit Ursprung in
    Singapur, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2567/80 af 7. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for selskabsspil under pos. 97.04, som har oprindelse
    i Singapore og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2567/80 della Commissione, del 7 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti per giuochi
    di società della voce 97.04 della tariffa doganale comune, originari di Singapore
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2567/80 van de Commissie van 7 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op gezelschapsspellen
    van post 97.04, van oorsprong uit Singapore ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
