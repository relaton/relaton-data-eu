    Gewebe aus Glasfasern mit Ursprung in der Volksrepublik China, ausgeweitet auf
    die Einfuhren bestimmter aus Indien, Indonesien, Malaysia, Taiwan und Thailand
    versandter offenmaschiger Gewebe aus Glasfasern, ob als Ursprungserzeugnisse dieser
    Länder angemeldet oder nicht
