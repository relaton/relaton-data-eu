- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2457 of 14 December 2022 amending
    Implementing Regulation (EU) 2017/1993 imposing a definitive anti-dumping duty
    on imports of certain open mesh fabrics of glass fibres originating in the People’s
    Republic of China as extended to imports of certain open mesh fabrics of glass
    fibres consigned from India, Indonesia, Malaysia, Taiwan and Thailand, whether
    declared as originating in these countries or not
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2457 de la Commission du 14 décembre
    2022 modifiant le règlement d’exécution (UE) 2017/1993 instituant un droit
    antidumping définitif sur les importations de certains tissus de fibre de verre
    à maille ouverte originaires de la République populaire de Chine tel qu’étendu
    aux importations de certains tissus de fibre de verre à maille ouverte expédiés
    de l’Inde, d’Indonésie, de Malaisie, de Taïwan et de Thaïlande, qu’ils
    aient ou non été déclarés originaires de ces pays
  type: main
- language: de
  script: Latn
