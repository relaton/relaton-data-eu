title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/1190 of 24 April 2024 concerning
    the renewal of the authorisation of a preparation of Enterococcus lactis DSM 7134
    as a feed additive for chickens reared for laying and minor poultry species for
    fattening, reared for laying and reared for breeding (holder of authorisation:
    Lactosan GmbH & Co.KG) and repealing Implementing Regulation (EU) No 775/2013'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/1190 de la Commission du 24 avril
    2024 concernant le renouvellement de l’autorisation d’une préparation d’Enterococcus
    lactis DSM 7134 en tant qu’additif dans l’alimentation des poulettes destinées
    à la ponte et des espèces aviaires mineures destinées à l’engraissement,
    élevées pour la ponte et élevées pour la reproduction (titulaire de l’autorisation:
    Lactosan GmbH & Co.KG) et abrogeant le règlement d’exécution (UE) no 775/2013'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/1190 der Kommission vom 24. April 2024
    zur Verlängerung der Zulassung einer Zubereitung aus Enterococcus lactis DSM
    7134 als Futtermittelzusatzstoff für Junghennen und für Geflügelarten von geringerer
    wirtschaftlicher Bedeutung für Mastzwecke sowie für Jungtiere von Geflügelarten
    von geringerer wirtschaftlicher Bedeutung für Lege- und Zuchtzwecke (Zulassungsinhaber:
    Lactosan GmbH & Co. KG) und zur Aufhebung der Durchführungsverordnung (EU) Nr.
    775/2013'
  type: main
- language: bg
