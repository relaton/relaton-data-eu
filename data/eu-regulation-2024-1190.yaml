    като фуражна добавка за пилета, отглеждани
    за носачки, и за видове домашни птици с по-малко
    стопанско значение, за угояване, отглеждани
    за носачки или за разплод (притежател на разрешителното:
    Lactosan GmbH & CoKG) и за отмяна на Регламент за изпълнение
    (ЕС) № 775/2013'
  type: main
- language: cs
  script: Latn
