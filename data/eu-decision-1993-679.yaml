type: standard
title:
- language: en
  script: Latn
  content: '93/679/EC: Council Decision of 6 December 1993 authorizing the automatic
    renewal or maintenance in force of provisions governing matters covered by the
    common commercial policy contained in the friendship, trade and navigation treaties
    and in trade agreements concluded between Member States and third countries'
  type: main
- language: fr
  script: Latn
  content: '93/679/CE: Décision du Conseil du 6 décembre 1993 autorisant la tacite
    reconduction ou le maintien en vigueur des dispositions dont les matières relèvent
    de la politique commerciale commune, contenues dans les traités d''amitié, de
    commerce et de navigation et dans les accords commerciaux, conclus par les États
    membres avec les pays tiers'
  type: main
- language: de
  script: Latn
  content: '93/679/EG: ENTSCHEIDUNG DES RATES vom 6. Dezember 1993 zur Genehmigung
    der stillschweigenden Verlängerung oder der Beibehaltung der Bestimmungen von
    Freundschafts-, Handels- und Schiffahrtsverträgen sowie Handelsabkommen zwischen
    den Mitgliedstaaten und dritten Ländern, deren Gegenstand unter die gemeinsame
    Handelspolitik fällt'
  type: main
- language: da
  script: Latn
  content: '93/679/EF: RÅDETS BESLUTNING af 6. december 1993 om bemyndigelse til
    stiltiende videreførelse eller opretholdelse af bestemmelser, hvis indhold er
    omfattet af den fælles handelspolitik, og som er indeholdt i de venskabs-, handels-
    og skibsfartstraktater og handelsaftaler, som medlemsstaterne har indgået med
    tredjelande'
  type: main
- language: el
  script: Grek
  content: '93/679/ΕΚ: ΑΠΟΦΑΣΗ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 6ης Δεκεμβρίου
    1993 για την έγκριση της σιωπηρής ανανέωσης ή
    της διατήρησης σε ισχύ ορισμένων διατάξεων
    το αντικείμενο των οποίων υπάγεται στην κοινή
    εμπορική πολιτική, και οι οποίες περιλαμβάνονται
    στις συνθήκες φιλίας, εμπορίου και ναυτιλίας
    και στις εμπορικές συμφωνίες που έχουν συνάψει
    τα κράτη μέλη με τις τρίτες χώρες'
  type: main
- language: it
  script: Latn
  content: '93/679/CE: DECISIONE DEL CONSIGLIO del 6 dicembre 1993 che autorizza il
    tacito rinnovo o il mantenimento in vigore delle disposizioni relative a materie
    che rientrano nella politica commerciale comune contenute nei trattati d'' amicizia
    di commercio e di navigazione e negli accordi commerciali conclusi dagli Stati
    membri con i paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '93/679/EG: BESCHIKKING VAN DE RAAD van 6 december 1993 houdende machtiging
    tot stilzwijgende verlenging of handhaving van de bepalingen betreffende aangelegenheden
    die vallen onder de gemeenschappelijke handelspolitiek en die vervat zijn in de
    tussen de Lid-Staten en derde landen gesloten vriendschaps-, handels- en scheepvaartverdragen
    en handelsovereenkomsten'
  type: main
- language: pt
  script: Latn
  content: '93/679/CE: DECISÃO DO CONSELHO de 6 de Dezembro de 1993 que autoriza
    a prorrogação tácita ou a manutenção em vigor das disposições cujas matérias
    sejam abrangidas pela política comercial comum e figurem em tratados de amizade,
    de comércio e de navegação e em acordos comerciais celebrados pelos Estados-membros
    com países terceiros'
  type: main
- language: es
  script: Latn
  content: '93/679/CE: DECISIÓN DEL CONSEJO de 6 de diciembre de 1993 por la que
    se autoriza la tácita reconducción o el mantenimiento en vigor de las disposiciones
    cuyas materias estén sujetas a la política comercial común contenidas en los
    tratados de amistad, comercio y navegación, y en los acuerdos comerciales celebrados
    por los Estados miembros con terceros países'
  type: main
