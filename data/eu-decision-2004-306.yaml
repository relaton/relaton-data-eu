title:
- language: en
  script: Latn
  content: '2004/306/EC: Council Decision of 2 April 2004 implementing Article 2(3)
    of Regulation (EC) No 2580/2001 on specific restrictive measures directed against
    certain persons and entities with a view to combating terrorism and repealing
    Decision 2003/902/EC'
  type: main
- language: fr
  script: Latn
  content: '2004/306/CE: Décision du Conseil du 2 avril 2004 mettant en œuvre l''article
    2, paragraphe 3, du règlement (CE) n° 2580/2001 concernant l''adoption de mesures
    restrictives spécifiques à l''encontre de certaines personnes et entités dans
    le cadre de la lutte contre le terrorisme, et abrogeant la décision 2003/902/CE'
  type: main
- language: de
  script: Latn
  content: '2004/306/EG: Beschluss des Rates vom 2. April 2004 zur Durchführung von
    Artikel 2 Absatz 3 der Verordnung (EG) Nr. 2580/2001 über spezifische, gegen
    bestimmte Personen und Organisationen gerichtete restriktive Maßnahmen zur Bekämpfung
    des Terrorismus und zur Aufhebung des Beschlusses 2003/902/EG'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 2. dubna 2004, kterým se provádí čl. 2 odst.
    3 nařízení (ES) č. 2580/2001 o zvláštních omezujících opatřeních namířených
    proti některým osobám a subjektům s cílem bojovat proti terorismu a kterým
    se zrušuje rozhodnutí 2003/902/ES
  type: main
- language: da
  script: Latn
  content: '2004/306/EF: Rådets afgørelse af 2. april 2004 om gennemførelse af
    artikel 2, stk. 3, i forordning (EF) nr. 2580/2001 om specifikke restriktive foranstaltninger
    mod visse personer og enheder med henblik på at bekæmpe terrorisme, og om ophævelse
    af afgørelse 2003/902/EF'
  type: main
- language: el
  script: Grek
  content: '2004/306/ΕΚ: Απόφαση του Συμβουλίου, της 2ας
    Απριλίου 2004, για την εφαρμογή του άρθρου 2 παράγραφος
    3 του κανονισμού (EK) αριθ. 2580/2001 για τη λήψη ειδικών
    περιοριστικών μέτρων κατά ορισμένων προσώπων
    και οντοτήτων με σκοπό την καταπολέμηση της
    τρομοκρατίας, και την κατάργηση της απόφασης
    2003/902/ΕΚ'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 2. aprill 2004, millega rakendatakse nõukogu määruse
    (EÜ) nr 2580/2001 (teatavate isikute ja üksuste vastu suunatud eripiirangute
    kohta terrorismivastaseks võitluseks) artikli 2 lõiget 3 ja tunnistatakse kehtetuks
    otsus 2003/902/EÜ
  type: main
- language: fi
  script: Latn
  content: '2004/306/EY: Neuvoston päätös, tehty 2 päivänä huhtikuuta 2004,
    tiettyihin henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista
    toimenpiteistä terrorismin torjumiseksi annetun asetuksen (EY) N:o 2580/2001
    2 artiklan 3 kohdan täytäntöönpanosta ja päätöksen 2003/902/EY kumoamisesta'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (2004. április 2.) a terrorizmus leküzdése érdekében
    egyes személyekkel és szervezetekkel szemben hozott különleges korlátozó
    intézkedésekről szóló 2580/2001/EK rendelet 2. cikke (3) bekezdésének végrehajtásáról
    és a 2003/902/EK határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: '2004/306/CE: Decisione del Consiglio, del 2 aprile 2004, che attua l''articolo
    2, paragrafo 3, del regolamento (CE) n. 2580/2001 relativo a misure restrittive
    specifiche, contro determinate persone e entità, destinate a combattere il terrorismo,
    e che abroga la decisione 2003/902/CE'
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (2004. gada 2. aprīlis), ar ko īsteno 2. panta 3. punktu
    Regulā (EK) Nr. 2580/2001 par īpaši ierobežojošiem pasākumiem, kas terorisma
    apkarošanas nolūkā vērsti pret konkrētām personām un vienībām, un atceļ
    Lēmumu 2003/902/EK
  type: main
- language: lt
  script: Latn
  content: 2004 m. balandžio 2 d. Tarybos sprendimas, įgyvendinantis Reglamento
    (EB) Nr. 2580/2001 dėl specialių ribojančių priemonių, taikomų tam tikriems
    asmenims ir subjektams siekiant kovoti su terorizmu, 2 straipsnio 3 dalį ir panaikinantis
    Sprendimą 2003/902/EB
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tat-2 ta' April 2004 li timplementa l-Artikolu
    2(3) tar-Regolament (KE) Nru 2580/2001 dwar certi miżuri restrittivi speċifiċi
    mmirati lejn ċerti persuni u entitajiet bil-ħsieb li jiġi miġġieled it-terroriżmu
    u li tħassar id-Deċiżjoni 2003/902
  type: main
- language: nl
  script: Latn
  content: '2004/306/EG: Besluit van de Raad van 2 april 2004 tot uitvoering van artikel
    2, lid 3, van Verordening (EG) nr. 2580/2001 inzake specifieke beperkende maatregelen
    tegen bepaalde personen en entiteiten met het oog op de strĳd tegen het terrorisme,
    en tot intrekking van Besluit 2003/902/EG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 2 kwietnia 2004 r. wykonująca art. 2 ust. 3 rozporządzenia
    (WE) nr 2580/2001 w sprawie szczególnych środków ograniczających skierowanych
    przeciwko niektórym osobom i podmiotom, mających na celu zwalczanie terroryzmu
    i uchylająca decyzję 2003/902/WE
  type: main
- language: pt
  script: Latn
  content: '2004/306/CE: Decisão do Conselho, de 2 de Abril de 2004, que dá execução
    ao disposto no n.° 3 do artigo 2.° do Regulamento (CE) n.° 2580/2001 relativo
    a medidas restritivas específicas de combate ao terrorismo dirigidas contra determinadas
    pessoas e entidades e que revoga a Decisão 2003/902/CE'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady z 2. apríla 2004, ktorým sa vykonáva článok 2 ods.
    3 nariadenia (ES) č. 2580/2001 o určitých obmedzujúcich opatreniach zameraných
    proti určitým osobám a subjektom s cieľom boja proti terorizmu a ktorým sa
    zrušuje rozhodnutie 2003/902/ES
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta z dne 2. aprila 2004 o izvajanju člena 2(3) Uredbe (ES) št.
    2580/2001 o posebnih omejevalnih ukrepih proti nekaterim osebam in entitetam zaradi
    boja proti terorizmu in o razveljavitvi Sklepa 2003/902/ES
  type: main
- language: es
  script: Latn
  content: '2004/306/CE: Decisión del Consejo, de 2 de abril de 2004, relativa a
    la aplicación del apartado 3 del artículo 2 del Reglamento (CE) n° 2580/2001
    sobre medidas restrictivas específicas dirigidas a determinadas personas y entidades
    con el fin de luchar contra el terrorismo y por la que se deroga la Decisión
    2003/902/CE'
  type: main
- language: sv
  script: Latn
  content: '2004/306/EG: Rådets beslut av den 2 april 2004 om genomförande av artikel
    2.3 i förordning (EG) nr 2580/2001 om särskilda restriktiva åtgärder mot vissa
    personer och enheter i syfte att bekämpa terrorism och om upphävande av beslut
    2003/902/EG'
