---
id: EURegulation2024221
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/221 of 12 January 2024 concerning
    the renewal of the authorisation of a preparation of endo-1,4-beta-xylanase, endo-1,3(4)-beta-glucanase
    and endo-1,4-beta-glucanase, produced by Trichoderma reesei ATCC 74444, as a feed
    additive for all poultry species for fattening, all poultry species for laying
    and weaned piglets (holder of authorisation: DSM Nutritional Products) and amending
    Implementing Regulation (EU) No 403/2013'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/221 de la Commission du 12 janvier
    2024 concernant le renouvellement de l’autorisation d’une préparation à
    base d’endo–1,4-bêta-xylanase, d’endo–1,3(4)-bêta-glucanase et d’endo–1,4-bêta-glucanase
    produites par Trichoderma reesei ATCC 74444 comme additif dans l’alimentation
    de toutes les espèces de volailles d’engraissement, de toutes les espèces
    de volailles de ponte et des porcelets sevrés (titulaire de l’autorisation:
    DSM Nutritional Products) et modifiant le règlement d’exécution (UE) no 403/2013'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/221 der Kommission vom 12. Januar 2024
    zur Verlängerung der Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase,
    Endo-1,3(4)-beta-Glucanase und Endo-1,4-beta-Glucanase aus Trichoderma reesei
    (ATCC 74444) als Futtermittelzusatzstoff für alle Mastgeflügelarten, alle Legegeflügelarten
    und für abgesetzte Ferkel (Zulassungsinhaber: DSM Nutritional Products) sowie
    zur Änderung der Durchführungsverordnung (EU) Nr. 403/2013'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2024/221 на Комисията
    от 12 януари 2024 година за подновяване на разрешаването
    на употребата на препарат от ендо–1,4-бета-ксиланаза,
    ендо–1,3(4)-бета-глюканаза и ендо–1,4-бета-глюканаза,
    получени от Trichoderma reesei ATCC 74444, като фуражна добавка
    за всички видове домашни птици за угояване,
    всички видове домашни птици, отглеждани за
    носачки, и отбити прасенца (притежател на разрешението:
    DSM Nutritional Products) и за изменение на Регламент за
    изпълнение (ЕС) № 403/2013'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2024/221 ze dne 12. ledna 2024 o
    obnovení povolení přípravku z endo–1,4-beta-xylanázy, endo–1,3(4)-beta-glukanázy
    a endo–1,4-beta-glukanázy z Trichoderma reesei ATCC 74444 jako doplňkové
    látky pro výkrm všech druhů drůbeže, všechny druhy drůbeže určené ke
    snášce a odstavená selata (držitel povolení: DSM Nutritional Products) a
    o změně prováděcího nařízení (EU) č. 403/2013'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2024/221 af 12. januar 2024
    om forlængelse af godkendelsen af et præparat af endo–1,4-beta-xylanase, endo–1,3(4)-beta-glucanase
    og endo–1,4-beta-glucanase produceret af Trichoderma reesei ATCC 74444 som fodertilsætningsstof
    til alle fjerkræarter bestemt til opfedning, alle fjerkræarter bestemt til æglægning
    samt fravænnede smågrise (indehaver af godkendelsen: DSM Nutritional Products)
    og om ændring af gennemførelsesforordning (EU) nr. 403/2013'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2024/221 της Επιτροπής,
    της 12ης Ιανουαρίου 2024, για την ανανέωση της
    άδειας χρήσης παρασκευάσματος ενδο–1,4-β-ξυλανάσης,
    ενδο–1,3(4)-β-γλυκανάσης και ενδο–1,4-β-γλυκανάσης,
    που παράγεται από Trichoderma reesei ATCC 74444, ως πρόσθετης
    ύλης ζωοτροφών για όλα τα είδη πουλερικών προς
    πάχυνση, όλα τα είδη πουλερικών ωοπαραγωγής
    και για απογαλακτισμένα χοιρίδια (κάτοχος
    της άδειας: DSM Nutritional Products) και για την τροποποίηση
    του εκτελεστικού κανονισμού (ΕΕ) αριθ. 403/2013'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2024/221, 12. jaanuar 2024, milles käsitletakse
    Trichoderma reesei (ATCC 74444) abil toodetud endo–1,4-β-ksülanaasi, endo–1,3(4)-β-glükanaasi
    ja endo–1,4-β-glükanaasi preparaadi kõigi kodulinnuliikide nuumlindude, kõigi
    kodulinnuliikide munalindude ja võõrdepõrsaste söödalisandina kasutamise
    loa kehtivuse pikendamist (loa hoidja: DSM Nutritional Products) ja millega muudetakse
    rakendusmäärust (EL) nr 403/2013'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2024/221, annettu 12 päivänä
    tammikuuta 2024, Trichoderma reesei ATCC 74444 -organismin tuottamia endo–1,4-beeta-ksylanaasia,
    endo–1,3(4)-beeta-glukanaasia ja endo–1,4-beeta-glukanaasia sisältävän
    valmisteen hyväksynnän uusimisesta lihasiipikarjan, munivan siipikarjan ja vieroitettujen
    porsaiden rehun lisäaineena (hyväksynnän haltija: DSM Nutritional Products)
    ja täytäntöönpanoasetuksen (EU) N:o 403/2013 muuttamisesta'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2024/221 ón gCoimisiún an 12 Eanáir
    2024 maidir le húdarú ullmhóide d’ion–1,4-béite-xiolanáis, ion–1,3(4)
    béite-ghlúcanáis agus ion–1,4-béite-ghlúcanáis, arna táirgeadh ag Trichoderma
    reesei ATCC 74444 a athnuachan mar bhreiseán beathaithe le haghaidh gach speicis
    éanlaithe clóis lena ramhrú, gach speicis éanlaithe clóis le bheith ina bhéaróg
    agus bainbh scoite (sealbhóir an údaraithe: DSM Nutritional Products) agus lena
    leasaítear Rialachán Cur Chun Feidhme (AE) Uimh. 403/2013'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2024/221 оd 12. siječnja 2024. o produljenju
    odobrenja pripravka endo–1,4-beta-ksilanaze, endo–1,3(4)-beta-glukanaze i
    endo–1,4-beta-glukanaze dobivenih od Trichoderma reesei ATCC 74444 kao dodatka
    hrani za sve vrste peradi za tov, sve vrste peradi za nesenje i odbijenu prasad
    (nositelj odobrenja: DSM Nutritional Products) te o izmjeni Provedbene uredbe
    (EU) br. 403/2013'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2024/221 végrehajtási rendelete (2024. január 12.)
    a Trichoderma reesei ATCC 74444 által termelt endo–1,4-béta-xilanázt, endo–1,3(4)-béta-glükanázt
    és endo–1,4-béta-glükanázt tartalmazó készítmény valamennyi hízóbaromfifaj,
    valamennyi tojóbaromfifaj és elválasztott malac takarmány-adalékanyagaként
    történő engedélyezésének megújításáról (az engedély jogosultja: DSM
    Nutritional Products) és a 403/2013/EU végrehajtási rendelet módosításáról'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2024/221 della Commissione, del 12 gennaio
    2024, relativo al rinnovo dell’autorizzazione di un preparato di endo–1,4-beta-xilanasi,
    endo–1,3(4)-beta-glucanasi ed endo–1,4-beta-glucanasi, prodotto da Trichoderma
    reesei ATCC 74444, come additivo per mangimi destinati a tutte le specie di pollame
    da ingrasso, a tutte le specie di pollame da produzione di uova e a suinetti svezzati
    (titolare dell’autorizzazione: DSM Nutritional Products) e recante modifica
    del regolamento di esecuzione (UE) n. 403/2013'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2024/221 (2024. gada 12. janvāris),
    ar ko atjauno atļauju Trichoderma reesei ATCC 74444 producētas endo–1,4-beta-ksilanāzes,
    endo–1,3(4)-beta-glikanāzes un endo–1,4-beta-glikanāzes preparātu lietot
    par barības piedevu visu sugu gaļas mājputniem, visu sugu dējējputniem un
    atšķirtiem sivēniem (atļaujas turētājs: DSM Nutritional Products) un groza
    Īstenošanas regulu (ES) Nr. 403/2013'
  type: main
- language: lt
  script: Latn
  content: 2024 m. sausio 12 d. Komisijos įgyvendinimo reglamentas (ES) 2024/221
    dėl leidimo naudoti endo–1,4-beta-ksilanazės, endo–1,3(4)-beta-gliukanazės
    ir endo–1,4-beta-gliukanazės, gautų iš Trichoderma reesei ATCC 74444, preparatą
    kaip visų rūšių mėsinių naminių paukščių, visų rūšių dedeklių ir
    nujunkytų paršelių pašarų priedą atnaujinimo (leidimo turėtoja – bendrovė
    DSM Nutritional Products), kuriuo iš dalies keičiamas Įgyvendinimo reglamentas
    (ES) Nr. 403/2013
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/221 tat-12
    ta’ Jannar 2024 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparazzjoni ta’
    endo–1,4-beta-ksilanażi, endo–1,3(4)-beta-glukanażi u endo–1,4-beta-glukanażi,
    prodotta mit-Trichoderma reesei ATCC 74444, bħala addittiv tal-għalf għall-ispeċijiet
    kollha ta’ pollam għas-simna, għall-ispeċijiet kollha ta’ pollam tal-bajd
    u għall-qżieqeż tal-ftama (detentur tal-awtorizzazzjoni: DSM Nutritional Products)
    u li jemenda r-Regolament ta’ Implimentazzjoni (UE) Nru 403/2013'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2024/221 van de Commissie van 12 januari 2024
    tot verlenging van de vergunning voor een preparaat van endo-1,4-bèta-xylanase,
    endo-1,3(4)-bèta-glucanase en endo-1,4-bèta-glucanase, geproduceerd door Trichoderma
    reesei ATCC 74444, als toevoegingsmiddel voor diervoeding voor alle pluimveesoorten
    gehouden voor mest- en legdoeleinden en voor gespeende biggen (vergunninghouder:
    DSM Nutritional Products) en tot wijziging van Uitvoeringsverordening (EU) nr.
    403/2013'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2024/221 z dnia 12 stycznia 2024
    r. dotyczące odnowienia zezwolenia na stosowanie preparatu z endo–1,4-beta-ksylanazy,
    endo–1,3(4)-beta-glukanazy i endo–1,4-beta-glukanazy wytwarzanych przez Trichoderma
    reesei ATCC 74444 jako dodatku paszowego dla wszystkich gatunków drobiu rzeźnego
    i nieśnego i dla prosiąt odstawionych od maciory (posiadacz zezwolenia: DSM
    Nutritional Products) i zmieniające rozporządzenie wykonawcze (UE) nr 403/2013'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2024/221 da Comissão, de 12 de janeiro
    de 2024, relativo à renovação da autorização de uma preparação de endo–1,4-beta-xilanase,
    endo–1,3(4)-beta-glucanase e endo–1,4-beta-glucanase, produzida por Trichoderma
    reesei ATCC 74444 como aditivo em alimentos para todas as espécies de aves de
    capoeira de engorda, todas as espécies de aves de capoeira de postura e para
    leitões desmamados (detentor da autorização: DSM Nutritional Products) e que
    altera o Regulamento de Execução (UE) n.o 403/2013'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2024/221 al Comisiei din 12 ianuarie
    2024 privind reînnoirea autorizației unui preparat de endo–1,4-beta-xilanază,
    endo–1,3(4)-beta-glucanază și endo–1,4-beta-glucanază, produse de Trichoderma
    reesei ATCC 74444, ca aditiv pentru hrana tuturor speciilor de păsări de curte
    pentru îngrășare, a tuturor speciilor de păsări de curte ouătoare și a
    purceilor înțărcați (titularul autorizației: DSM Nutritional Products) și
    de modificare a Regulamentului de punere în aplicare (UE) nr. 403/2013'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2024/221 z 12. januára 2024 o obnovení
    povolenia prípravku s obsahom endo–1,4-beta-xylanázy, endo–1,3(4)-beta-glukanázy
    a endo–1,4-beta-glukanázy produkovaných kmeňom Trichoderma reesei ATCC 74444
    ako kŕmnej doplnkovej látky pre všetky druhy hydiny chovanej na výkrm, všetky
    druhy hydiny chovanej na znášku a pre odstavené prasiatka (držiteľ povolenia:
    DSM Výživové výrobky) a zmene vykonávacieho nariadenia (EÚ) č. 403/2013'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2024/221 z dne 12. januarja 2024 o podaljšanju
    dovoljenja za pripravek iz endo–1,4-beta-ksilanaze, endo–1,3(4)-beta-glukanaze
    in endo–1,4-beta-glukanaze, ki jih proizvaja Trichoderma reesei ATCC 74444,
    kot krmni dodatek za vse vrste perutnine za pitanje, vse vrste perutnine za nesnice
    in odstavljene pujske (imetnik dovoljenja: DSM Nutritional Products) ter spremembi
    Izvedbene uredbe (EU) št. 403/2013'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2024/221 de la Comisión, de 12 de enero
    de 2024, relativo a la renovación de la autorización de un preparado de endo–1,4-beta-xilanasa,
    endo–1,3(4)-beta-glucanasa y endo–1,4-beta-glucanasa, producido por Trichoderma
    reesei ATCC 74444, como aditivo para la alimentación de todas las especies de
    aves de engorde y ponedoras y para lechones destetados (titular de la autorización:
    DSM Nutritional Products) y por el que se modifica el Reglamento de Ejecución
    (UE) n.o 403/2013'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2024/221 av den 12 januari
    2024 om förlängning av godkännandet av ett preparat av endo–1,4-beta-xylanas,
    endo–1,3(4)-beta-glukanas och endo–1,4-beta-glukanas, framställt av Trichoderma
    reesei ATCC 74444, som fodertillsats för alla fjäderfäarter avsedda för slakt,
    alla fjäderfäarter avsedda för värpning och avvanda smågrisar (innehavare
    av godkännandet: DSM Nutritional Products) och ändring av genomförandeförordning
    (EU) nr 403/2013'
  type: main
