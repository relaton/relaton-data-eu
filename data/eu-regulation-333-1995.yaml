  content: Commission Regulation (EC) No 333/95 of 17 February 1995 laying down detailed
    rules for the application of Council Regulation (EEC) No 1765/92 as regards the
    limitation of the area in respect of which a producer may receive oilseed compensatory
    payment
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 333/95 de la Commission, du 17 février 1995, établissant
