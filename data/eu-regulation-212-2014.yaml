    pieļaujamo koncentrāciju uztura bagātinātājos, kuru pamatā ir ar sarkano
    raugu Monascus purpureus fermentēti rīsi
  type: main
- language: lt
  script: Latn
  content: 2014 m. kovo 6 d. Komisijos reglamentas (ES) Nr. 212/2014, kuriuo iš dalies
    keičiamos Reglamento (EB) Nr. 1881/2006 nuostatos dėl didžiausios leidžiamosios
    teršalo citrinino koncentracijos maisto papilduose, kurių pagrindinė sudedamoji
    dalis yra raudonosiomis mielėmis Monascus purpureus fermentuoti ryžiai
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 212/2014 tas- 6 ta’ Marzu 2014 li
    jemenda r-Regolament (KE) Nru 1881/2006 fir-rigward ta’ livelli massimi għall-kontaminant
    ċitrinina fis-supplimenti tal-ikel bbażati fuq ir-ross aħmar iffermentat Monascus
    purpureus
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 212/2014 van de Commissie van 6 maart 2014 tot wijziging
    van Verordening (EG) nr. 1881/2006 wat betreft de maximumgehalten aan de verontreiniging
    citrinine in voedingssupplementen op basis van met rode gist Monascus purpureus
    gefermenteerde rijst
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 212/2014 z dnia 6 marca 2014 r. zmieniające
    rozporządzenie (WE) nr 1881/2006 w odniesieniu do najwyższych dopuszczalnych
    poziomów zanieczyszczenia „cytrynina” w suplementach diety na bazie ryżu
    poddanego fermentacji grzybami Monascus purpureus
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 212/2014 da Comissão, de 6 de março de 2014 ,
    que altera o Regulamento (CE) n. ° 1881/2006 no que diz respeito aos limites
    máximos do contaminante citrinina em suplementos alimentares à base de arroz
    fermentado com levedura vermelha Monascus purpureus
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 212/2014 al Comisiei din 6 martie 2014 de modificare
    a Regulamentului (CE) nr. 1881/2006 în ceea ce privește nivelurile maxime pentru
    contaminantul citrinină în suplimentele alimentare pe bază de orez fermentat
    cu drojdie roșie Monascus purpureus
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 212/2014 zo 6. marca 2014 , ktorým sa mení
    nariadenie (ES) č. 1881/2006, pokiaľ ide o maximálne hodnoty obsahu kontaminantu
    citrinín v potravinových doplnkoch na báze ryže fermentovanej červenými
    kvasinkami Monascus purpureus
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 212/2014 z dne 6. marca 2014 o spremembi Uredbe
    (ES) št. 1881/2006 glede mejnih vrednosti onesnaževala citrinin v prehranskih
    dopolnilih na osnovi riža, fermentiranega z rdečimi kvasovkami Monascus purpureus
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 212/2014 de la Comisión, de 6 de marzo de 2014 ,
    por el que se modifica el Reglamento (CE) n ° 1881/2006 en lo que concierne a
