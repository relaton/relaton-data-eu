title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 212/2014 of 6 March 2014 amending Regulation
    (EC) No 1881/2006 as regards maximum levels of the contaminant citrinin in food
    supplements based on rice fermented with red yeast Monascus purpureus
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 212/2014 de la Commission du 6 mars 2014 modifiant
    le règlement (CE) n ° 1881/2006 en ce qui concerne les teneurs maximales en
    contaminant citrinine dans les compléments alimentaires à base de riz fermenté
    avec de la levure rouge Monascus purpureus
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 212/2014 der Kommission vom 6. März 2014 zur Änderung
    der Verordnung (EG) Nr. 1881/2006 hinsichtlich des Höchstgehalts für den Kontaminanten
    Citrinin in Nahrungsergänzungsmitteln auf Basis von Reis, der durch den Schimmelpilz
    Monascus purpureus fermentiert wurde
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 212/2014 на Комисията от 6 март
    2014 година за изменение на Регламент (ЕО) № 1881/2006
    по отношение на максимално допустимите количества
    от замърсителя цитринин в хранителни добавки
    на основата на ориз, подложен на ферментация
    с червени дрожди Monascus purpureus
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 212/2014 ze dne 6. března 2014 , kterým se
    mění nařízení (ES) č. 1881/2006, pokud jde o maximální limity kontaminující
    látky citrininu v doplňcích stravy na bázi rýže fermentované červenými
    kvasnicemi Monascus purpureus
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 212/2014 af 6. marts 2014 om ændring
    af forordning (EF) nr. 1881/2006 for så vidt angår grænseværdier for det forurenende
    stof citrinin i kosttilskud baseret på ris fermenteret med rød gær ( Monascus
    purpureus )
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 212/2014 της Επιτροπής,
    της 6ης Μαρτίου 2014 , για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1881/2006 όσον αφορά τα μέγιστα
    επιτρεπτά επίπεδα κιτρινίνης στα πρόσθετα
    τροφίμων με βάση το ρύζι που έχει υποστεί ζύμωση
    με τον ερυθρό μύκητα Monascus purpureus
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 212/2014, 6. märts 2014 , millega muudetakse
    määrust (EÜ) nr 1881/2006 seoses saasteaine tsitriniini piirnormidega punase
    pärmi Monascus purpureus ega kääritatud riisil põhinevates toidulisandites
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 212/2014, annettu 6 päivänä maaliskuuta 2014
    , asetuksen (EY) n:o 1881/2006 muuttamisesta siltä osin kuin kyse on vierasaine
    sitriniinin enimmäismääristä punahiivalla ( Monascus purpureus ) fermentoituun
    riisiin perustuvissa ravintolisissä
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 212/2014 оd 6. ožujka 2014. o izmjeni Uredbe
    (EZ) br. 1881/2006 s obzirom na najveće dopuštene količine kontaminanta citrinina
    u dodacima prehrani na osnovi riže fermentirane crvenim kvascem Monascus purpureus
  type: main
- language: hu
  script: Latn
  content: A Bizottság 212/2014/EU rendelete ( 2014. március 6. ) az 1881/2006/EK
    rendeletnek a Monascus purpureus vörös élesztővel fermentált rizsen alapuló
    étrend-kiegészítőkben előforduló citrinin felső határértékei tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 212/2014 della Commissione, del 6 marzo 2014 , che
    modifica il regolamento (CE) n. 1881/2006 per quanto riguarda i tenori massimi
    del contaminante citrinina negli integratori alimentari a base di riso fermentato
    con lievito rosso Monascus purpureus
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 212/2014 ( 2014. gada 6. marts ), ar ko groza
