    para las actividades no asalariadas incluidas en: 1. el sector de los «Negocios
    inmobiliarios (salvo 6401)» (grupo ex 640 CITI), 2. el sector de determinados
    «Servicios prestados a las empresas no clasificados en otro lugar» (grupo 839
    CITI)'
  type: main
