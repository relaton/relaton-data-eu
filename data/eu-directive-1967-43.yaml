title:
- language: en
  script: Latn
  content: 'Council Directive 67/43/EEC of 12 January 1967 concerning the attainment
    of freedom of establishment and freedom to provide services in respect of activities
    of self-employed persons concerned with: 1. Matters of ''real estate'' (excluding
    6401) (ISIC Group ex 640) 2. The provision of certain ''business services not
    elsewhere classified'' (ISIC Group 839)'
  type: main
- language: fr
  script: Latn
  content: 'Directive 67/43/CEE du Conseil, du 12 janvier 1967, concernant la réalisation
    de la liberté d''établissement et de la libre prestation des services pour les
    activités non salariées relevant: 1. du secteur des «Affaires immobilières
    (sauf 6401)» (groupe ex 640 CITI) 2. du secteur de certains «Services fournis
    aux entreprises non classés ailleurs» (groupe 839 CITI)'
  type: main
- language: de
  script: Latn
  content: Richtlinie 67/43/EWG des Rates vom 12. Januar 1967 über die Verwirklichung
    der Niederlassungsfreiheit und des freien Dienstleistungsverkehrs für selbständige
    Tätigkeiten auf dem Gebiet 1. der "Immobiliengeschäfte (außer 6 401)" (Gruppe
    aus 640 ISIC) 2. einiger "sonstiger Dienste für das Geschäftsleben" (Gruppe
    839 ISIC)
  type: main
- language: da
  script: Latn
  content: 'Rådets direktiv 67/43/EØF af 12. januar 1967 om gennemførelse af etableringsfrihed
    og fri udveksling af tjenesteydelser for selvstændig virksomhed inden for: 1.
    »ejendomshandel og -administration (undtagen 6401)» (ex CITI-gruppe 640) 2.
    »visse tjenesteydelser for erhvervslivet» (CITI-gruppe 839)'
  type: main
- language: el
  script: Grek
  content: 'Οδηγία 67/43/ΕΟΚ του Συμβουλίου της 12ης Ιανουαρίου
    1967 περί πραγματοποιήσεως του δικαιώματος εγκαταστάσεως
    και της ελεύθερης παροχής υπηρεσιών των μη
    μισθωτών δραστηριοτήτων που υπάγονται: 1. στον
    τομέα των συναλλαγών επί ακινήτων (εκτός 6401)
    (ομάδα ex 640 ΔΤΤΒ) 2. στον τομέα ορισμένων υπηρεσιών
    παρεχομένων σε επιχειρήσεις που δεν έχουν
    ταξινομηθεί αλλού (ομάδα 839 ΔΤΤΒ)'
  type: main
- language: fi
  script: Latn
  content: 'Neuvoston direktiivi 67/43/ETY, annettu 12 päivänä tammikuuta 1967,
    sijoittautumisvapauden ja palvelujen tarjoamisen vapauden toteuttamisesta itsenäisten
    ammatinharjoittajien toiminnassa: 1. "kiinteään omaisuuteen liittyvässä toiminnassa
    (lukuun ottamatta 6401)" (ISIC-ryhmästä 640) 2. tiettyjen "muualla luokittelemattomien
    yrityspalvelujen tarjoaminen" (ISIC-ryhmä 839)'
  type: main
- language: it
  script: Latn
  content: 'Direttiva 67/43/CEE del Consiglio, del 12 gennaio 1967, relativa all''attuazione
    della libertà di stabilimento e della libera prestazione dei servizi per le attività
    non salariate attinenti: 1. al settore degli «Affari immobiliari (escluso 6401)»
    (Gruppo ex 640 C.I.T.I.) 2. al settore di taluni «Servizi forniti alle imprese
    non classificati altrove» (Gruppo 839 C.I.T.I.)'
  type: main
- language: nl
  script: Latn
  content: 'Richtlijn 67/43/EEG van de Raad van 12 januari 1967 betreffende verwezenlijking
    van de vrijheid van vestiging en het vrij verrichten van diensten voor de niet
    in loondienst verrichte werkzaamheden behorende tot: 1. de sector "handel in onroerende
    goederen (uitgezonderd 6401)" (groep ex 640 I.S.I.C.) 2. de sector bepaalde "diensten
    aan ondernemingen, niet elders ingedeeld" (groep 839 I.S.I.C.)'
  type: main
- language: pt
  script: Latn
  content: 'Directiva 67/43/CEE do Conselho, de 12 de Janeiro de 1967, relativa à
