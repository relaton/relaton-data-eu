    nas actividades não assalariadas: 1. Do sector dos «Negócios imobiliários
    (salvo 6041)» (ex grupo 640 CITI); 2. Do sector de alguns «Serviços prestados
    às empresas não classificados noutra parte» (grupo 839 CITI)'
  type: main
- language: es
  script: Latn
  content: 'Directiva 67/43/CEE del Consejo, de 12 de enero de 1967, relativa a la
