title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2283/77 of 14 October 1977 re-establishing
    the levying of the customs duties on filament lamps for lighting, falling within
    subheading 85.20 A, originating in Romania to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2283/77 de la Commission, du 14 octobre 1977, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes électriques à incandescence pour l'éclairage, de la sous-position tarifaire
    85.20 A, originaires de la Roumanie bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2283/77 der Kommission vom 14. Oktober 1977 zur Wiedereinführung
    des Zollsatzes für Glühlampen für elektrische Beleuchtung, der Tarifstelle
    85.20 A, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3021/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2283/77 af 14. oktober 1977 om genindførelse
    af opkrævning af toldafgifter for elektriske glødelamper under underposition
    85.20 A, som har oprindelse i Rumænien og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2283/77 della Commissione, del 14 ottobre 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle lampade e tubi a
    incandescenza per l'illuminazione, della sottovoce doganale 85.20 A, originari
    della Romania, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2283/77 van de Commissie van 14 oktober 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op gloeilampen
    en gloeibuizen, voor verlichtingsdoeleinden, van post 85.20 A, van oorsprong uit
    Roemenië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
