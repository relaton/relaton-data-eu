title:
- language: en
  script: Latn
  content: '74/166/EEC: First Commission Decision of 6 February 1974 relating to the
    application of Council Directive No 72/166/EEC of 24 April 1972 on the approximation
    of the laws of the Member States relating to insurance against civil liability
    in respect of the use of motor vehicles, and to the enforcement of the obligation
    to insure against such liability'
  type: main
- language: fr
  script: Latn
  content: '74/166/CEE: Première décision de la Commission, du 6 février 1974,
    relative à l'' application de la directive 72/166/CEE du Conseil, du 24 avril
    1972, concernant le rapprochement des législations des États membres relatives
    à l'' assurance de la responsabilité civile résultant de la circulation des
    véhicules automoteurs et au contrôle de l'' obligation d'' assurer cette responsabilité'
  type: main
- language: de
  script: Latn
  content: '74/166/EWG: Erste Entscheidung der Kommission vom 6. Februar 1974 zur
    Durchführung der Richtlinie 72/166/EWG des Rates vom 24. April 1972 betreffend
    die Angleichung der Rechtsvorschriften der Mitgliedstaaten bezüglich der Kraftfahrzeug-Haftpflichtversicherung
    und der Kontrolle der entsprechenden Versicherungspflicht'
  type: main
- language: da
  script: Latn
  content: '74/166/EØF: Kommissionens første Beslutning af 6. februar 1974 om anvendelse
    af Rådets direktiv nr. 72/166/EØF af 24. april 1972 om indbyrdes tilnærmelse
    af medlemsstaternes lovgivning om ansvarsforsikring for motorkøretøjer og kontrollen
    med forsikringspligtens overholdelse'
  type: main
- language: el
  script: Grek
  content: '74/166/ΕΟΚ: Πρώτη απόφαση τής Επιτροπής τής
    6ης Φεβρουαρίου 1974 περί τής εφαρμογής τής οδηγίας
    τού Συμβουλίου 72/166/ΕΟΚ τής 24ης Απριλίου 1972
    «περί εναρμονίσεως τών νομοθεσιών τών Κρατών
    μελών τών σχετικών μέ τήν ασφάλιση τής αστικής
    ευθύνης πού προκύπτει από τήν κυκλοφορία αυτοκινήτων
    οχημάτων καί μέ τόν έλεγχο τής υποχρεώσεως
    πρός ασφάλιση τής ευθύνης αυτής»'
  type: main
- language: it
  script: Latn
  content: '74/166/CEE: Prima decisione della Commissione, del 6 febbraio 1974, relativa
