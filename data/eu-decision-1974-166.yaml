    1972, concernente il ravvicinamento delle legislazioni degli Stati membri in materia
    di assicurazione della responsabilità civile risultante dalla circolazione di
    autoveicoli e di controllo dell'' obbligo di assicurare tale responsabilità'
  type: main
- language: nl
  script: Latn
  content: '74/166/EEG: Eerste Beschikking van de Commissie van 6 februari 1974 tot
