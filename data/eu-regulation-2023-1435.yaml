  content: Commission Delegated Regulation (EU) 2023/1435 of 2 May 2023 amending Regulation
    (EC) No 1272/2008 of the European Parliament and of the Council on classification,
    labelling and packaging of substances and mixtures as regards the modification
    of entries in Part 3 of Annex VI for 2-ethylhexanoic acid and its salts, boric
    acid, diboron trioxide, tetraboron disodium heptaoxide hydrate, disodium tetraborate
    anhydrous, orthoboric acid sodium salt, disodium tetraborate decahydrate, and
    disodium tetraborate pentahydrate
  type: main
