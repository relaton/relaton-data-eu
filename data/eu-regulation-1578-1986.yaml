id: EURegulation15781986
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1578/86 of 23 May 1986 amending, by reason
    of the accession of Spain and Portugal, Regulation (EEC) No 1469/70 fixing the
    percentages and quantities of tobacco taken over by the intervention agencies
    and the percentage of Community tobacco production above which the procedures
    laid down in Article 13 of Regulation (EEC) No 727/70 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1578/86 du Conseil du 23 mai 1986 modifiant, à la
    suite de l' adhésion de l' Espagne et du Portugal, le règlement (CEE) n° 1469/70
    fixant les pourcentages et les quantités de tabac prises en charge par les organismes
    d' intervention, ainsi que le pourcentage de la production communautaire de tabac,
    dont le dépassement déclenche les procédures prévues à l' article 13 du règlement
    (CEE) n° 727/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1578/86 des Rates vom 23. Mai 1986 zur durch den Beitritt
    Spaniens und Portugals bedingten Änderung der Verordnung (EWG) Nr. 1469/70 zur
    Festsetzung der Hundertsätze und Mengen des von den Interventionsstellen übernommenen
    Tabaks sowie des Hundertsatzes der gemeinschaftlichen Tabakerzeugung, deren Überschreitung
    die Verfahren nach Artikel 13 der Verordnung (EWG) Nr. 727/70 auslöst
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1578/86 af 23. maj 1986 om ændring, som
    følge af Spaniens og Portugals tiltrædelse, af forordning (EØF) nr. 1469/70
    om fastsættelse af procentsatser og mængder af den af interventionsorganerne
    overtagne tobak samt procentsatsen af fælleskabsproduktionen af tobak, hvis overskridelse
    udløser foranstaltningerne i medfør af artikel 13 i forordning (EØF) nr. 727/70
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ, αριθ. 1578/86 του Συμβουλίου
    της 23ης Μαΐου 1986 για την τροποποίηση, λόγω της
    προσχώρησης της Ισπανίας και της Πορτογαλίας,
    του κανονισμού (ΕΟΚ) αριθ. 1469/70 περί καθορισμού
    των ποσοστών και των ποσοτήτων καπνού που αναλαμβάνονται
    από τους οργανισμούς παρεμβάσεως, καθώς και
    του ποσοστού της κοινοτικής παραγωγής καπνού,
    του οποίου η υπέρβαση συνεπάγεται τη θέση σε
    εφαρμογή των διαδικασιών που προβλέπονται
    στο άρθρο 13 του κανονισμού (ΕΟΚ) αριθ. 727/70
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1578/86 del Consiglio del 23 maggio 1986 recante modifica,
    in seguito all' adesione della Spagna e del Portogallo, del regolamento (CEE)
    n. 1469/70 che fissa le percentuali e i quantitativi di tabacco presi a carico
    da parte degli organismi d' intervento nonché la percentuale della produzione
    comunitaria di tabacco, il cui superamento è determinante per lo scatto delle
    procedure previste all' articolo 13 del regolamento (CEE) n. 727/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1578/86 van de Raad van 23 mei 1986 tot wijziging,
    in verband met de toetreding van Spanje en Portugal, van Verordening (EEG) nr.
    1469/70 houdende vaststelling van de percentages en de hoeveelheden door de interventiebureaus
    overgenomen tabak, alsmede van het percentage van de tabaksproduktie in de Gemeenschap
    bij overschrijding waarvan de in artikel 13 van Verordening (EEG) nr. 727/70 bedoelde
    procedures van toepassing worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1578/86 do Conselho de 23 de Maio de 1986 que altera,
    na sequência da adesão de Espanha e de Portugal, o Regulamento (CEE) n.° 1469/70
    que fixa as percentagens e as quantidades de tabaco tomadas a cargo pelos organismos
    de intervenção, bem como a percentagem da produção comunitária de tabaco
    que, a ser exercida, desencadeia os processos previstos no artigo 13.° do Regulamento
    (CEE) n.° 727/70
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1578/86 del Consejo de 23 de mayo de 1986 por el que,
    con ocasión de la adhesión de España y de Portugal, se modifica el Reglamento
    (CEE) n° 1469/70 por el que se fijan los porcentajes y las cantidades de tabaco
    tomados a su cargo por los organismos de intervención, así como el porcentaje
    de la producción comunitaria de tabaco por encima del cual se aplican los procedimientos
    previstos en el artículo 13 del Reglamento (CEE) n° 727/70
  type: main
