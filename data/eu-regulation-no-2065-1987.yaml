  script: Latn
  content: Commission Regulation (EEC) No 2065/87 of 14 July 1987 re-establishing
    the levying of customs duties on mounted piezo-electric crystals falling within
    subheading 85.21 C, originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3924/46 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2065/87 de la Commission du 14 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux cristaux
    piézo-électriques montés de la sous-position 85.21 C du tarif douanier commun,
    originaires de la Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2065/87 der Kommission vom 14. Juli 1987 zur Wiedereinführung
