    der Tarifstelle 85.21 C des Gemeinsamen Zolltarifs mit Ursprung in Südkorea ,
    dem die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2065/87 af 14. juli 1987 om genindførelse
