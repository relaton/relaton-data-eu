title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1485/77 of 1 July 1977 re-establishing the
    levying of customs duties on household utensils of wood falling within heading
    No 44.24, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1485/77 de la Commission, du 1er juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux ustensiles
    de ménage en bois, de la position tarifaire 44.24, originaires des pays en voie
    de développement bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1485/77 der Kommission vom 1. Juli 1977 zur Wiedereinführung
    des Zollsatzes für Haushaltsgeräte aus Holz, der Tarifnummer 44.24, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1485/77 af 1. juli 1977 om genindførelse
    af opkrævning af toldafgifter for husholdningsartikler af træ, under position
    44.24, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1485/77 della Commissione, del 1 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti di uso domestico,
    di legno, della voce doganale 44.24, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1485/77 van de Commissie van 1 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten voor huishoudelijke artikelen
    van hout, van post 44.24, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden
    geopend
  type: main
