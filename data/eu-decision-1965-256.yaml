title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 14 avril 1965, relative au recours de la
    République italienne à l'article 115 alinéa 1 du Traité pour exclure du traitement
    communautaire les "piles électriques", originaires du Japon et mises en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/256/EWG: Entscheidung der Kommission vom 14. April 1965 über die Inanspruchnahme
    von Artikel 115 Absatz (1) des Vertrages durch die Italienische Republik, um "Primärelemente
    und Primärbatterien" japanischen Ursprungs, die sich in den anderen Mitgliedstaaten
    im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/256/CEE: Decisione della Commissione, del 14 aprile 1965, relativa
    al ricorso della Repubblica italiana all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario le «pile elettriche» originarie del
    Giappone e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/256/EEG: Beschikking van de Commissie van 14 april 1965 betreffende
    het verzoek van de Italiaanse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag elektrische elementen en elektrische batterijen, die van oorsprong
    zijn uit Japan en in de andere Lid- Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
