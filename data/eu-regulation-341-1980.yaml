title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 341/80 of 13 February 1980 re-establishing
    the levying of customs duties on gloves, etc., protective, for all trades, falling
    within subheading 42.03 B I, originating in Thailand, to which the preferential
    tariff arrangements are set out in Council Regulation (EEC) No 2789/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 341/80 de la Commission, du 13 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles, de protection pour tous métiers, de la sous-position 42.03
    B I du tarif douanier commun, originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 341/80 der Kommission vom 13. Februar 1980 zur Wiedereinführung
    des Zollsatzes für Schutzhandschuhe für alle Berufe der Tarifstelle 42.03 B
    I mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 341/80 af 13. februar 1980 om genindførelse
    af opkrævning af toldafgifter for beskyttelseshandsker til erhvervsmæssig brug,
    under pos. 42.03 B I, som har oprindelse i Thailand og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 341/80 della Commissione, del 13 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, ecc., di protezione
    per qualunque mestiere, della sottovoce 42.03 B I della tariffa doganale comune,
    originari della Tailandia, beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 341/80 van de Commissie van 13 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op werkhandschoenen
    en -wanten, van post 42.03 B I, van oorsprong uit Thailand ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
