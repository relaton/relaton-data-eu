- language: en
  script: Latn
  content: Council Regulation (EEC) No 3280/89 of 24 October 1989 fixing, for the
    1989/90 marketing year, the representative market price and the threshold price
    for olive oil and the percentages of consumption aid to be retained in accordance
    with article 11 (5) and (6) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3280/89 du Conseil du 24 octobre 1989 fixant, pour
