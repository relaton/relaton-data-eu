title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3207/81 of 10 November 1981 re-establishing
    the levying of customs duties on other made up articles, woven, products of category
    112 (1120), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3207/81 de la Commission, du 10 novembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, de la catégorie 112 (code 1120), originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3207/81 der Kommission vom 10. November 1981 über
    die Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben
    der Warenkategorie Nr. 112 (Kennziffer 1120), mit Ursprung in China, dem die in
    der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3207/81 af 10. november 1981 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer, under kategori
    112 (kode 1120), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3207/81 τής Επιτροπής
    τής 10ης Νοεμβρίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά τά έτερα
    είδη έτοιμα εξ υφασμάτων τών προϊόντων τής
    κατηγορίας 112 (κώδικας 1120) καταγωγής Κίνας,
    δικαιούχου τών προβλεπομένων στόν κανονισμό
    (EOK) αριθ. 3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3207/81 della Commissione, del 10 novembre 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, della categoria di prodotti n. 112 (codice 1120), originari della
    Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3207/81 van de Commissie van 10 november 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels van categorie van produkten nr. 112 (codenummer 1120) van
    oorsprong uit China waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3320/80 van de Raad
  type: main
