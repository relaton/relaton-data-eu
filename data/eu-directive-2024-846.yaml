    jogszabályok tekintetében az 561/2006/EK és a 165/2014/EU rendelet, valamint
    a 2002/15/EK irányelv végrehajtásának minimumfeltételeiről szóló 2006/22/EK
    európai parlamenti és tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2024/846 della Commissione, del 14 marzo 2024,
