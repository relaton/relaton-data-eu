title:
- language: en
  script: Latn
  content: '85/263/EEC: Commission Decision of 26 April 1985 amending Decision 85/228/EEC
    authorizing the Kingdom of the Netherlands to permit temporarily the marketing
    of field pea seed not satisfying the requirements of Council Directive 66/401/EEC'
  type: main
- language: fr
  script: Latn
  content: '85/263/CEE: Décision de la Commission du 26 avril 1985 modifiant la décision
    85/228/CEE autorisant le Royaume des Pays-Bas à admettre temporairement la commercialisation
    de semences de pois fourragers ne répondant pas aux exigences de la directive
    66/401/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '85/263/EWG: Entscheidung der Kommission vom 26. April 1985 zur Änderung
    der Entscheidung 85/228/EWG zur Ermächtigung des Königreichs der Niederlande,
    vorübergehend Saatgut von Futtererbsen zum Verkehr zuzulassen, das den Anforderungen
    der Richtlinie 66/401/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '85/263/EØF: Kommissionens beslutning af 26. april 1985 om ændring af
    beslutning 85/228/EØF om bemyndigelse af kongeriget Nederlandene til midlertidigt
    at tillade handel med frø af forderært, der ikke opfylder kravene i Rådets
    direktiv 66/401/EØF'
  type: main
- language: el
  script: Grek
  content: '85/263/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Απριλίου 1985 για τροποποίηση της απόφασης 85/228/ΕΟΚ
    για παροχή αδείας στο Βασίλειο των Κάτω Χωρών
    να επιτρέψει προσωρινά την εμπορία σπόρων
    προς σπορά κτηνοτροφικών πίσων που δεν ανταποκρίνονται
    στις απαιτήσεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '85/263/CEE: Decisione della Commissione del 26 aprile 1985 recante modifica
    della decisione 85/228/CEE che autorizza il Regno dei Paesi Bassi ad ammettere
    temporaneamente la commercializzazione di sementi di piselli da foraggio che non
    soddisfano ai requisiti della direttiva 66/401/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '85/263/EEG: Beschikking van de Commissie van 26 april 1985 tot wijziging
    van Beschikking 85/228/EEG houdende machtiging van het Koninkrijk der Nederlanden
    om zaaizaad van voedererwten dat niet aan de eisen van Richtlijn 66/401/EEG van
    de Raad voldoet, tijdelijk tot de handel toe te laten'
