title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 248/2010 of 24 March 2010 amending Regulation
    (EC) No 1484/95 laying down detailed rules for implementing the system of additional
    import duties and fixing representative prices in the poultry meat and egg sectors
    and for egg albumin, and Regulation (EC) No 504/2007 laying down detailed rules
    for the application of the arrangements for additional import duties in the milk
    and milk products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 248/2010 de la Commission du 24 mars 2010 modifiant
    le règlement (CE) n o 1484/95 portant modalités d’application du régime relatif
    à l’application des droits additionnels à l’importation et fixant des prix
    représentatifs, dans les secteurs de la viande de volaille et des œufs ainsi
    que pour l’ovalbumine, et le règlement (CE) n o 504/2007 portant modalités
    d’application du régime relatif à l’application des droits additionnels
    à l’importation dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 248/2010 der Kommission vom 24. März 2010 zur Änderung
    der Verordnung (EG) Nr. 1484/95 mit Durchführungsbestimmungen zur Regelung der
    zusätzlichen Einfuhrzölle und zur Festsetzung der repräsentativen Preise in
    den Sektoren Geflügelfleisch und Eier sowie für Eieralbumin und der Verordnung
    (EG) Nr. 504/2007 mit Durchführungsbestimmungen zur Regelung über die Erhebung
    eines zusätzlichen Einfuhrzolls auf Milch und Milcherzeugnisse
  type: main
