  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 248/2010, annettu 24 päivänä maaliskuuta 2010
    , siipikarjanliha- ja muna-alan sekä ovalbumiinin tuonnissa sovellettavien lisätullien
    järjestelmän soveltamista koskevista yksityiskohtaisista säännöistä ja edustavien
    hintojen vahvistamisesta annetun asetuksen (EY) N:o 1484/95 sekä maito- ja maitotuotealan
    tuotteiden tuonnin lisätullijärjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä annetun asetuksen (EY) N:o 504/2007 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 248/2010 od 24. ožujka 2010. o izmjeni Uredbe
    (EZ) br. 1484/95 o utvrđivanju detaljnih pravila za provedbu sustava dodatnih
    uvoznih carina i određivanju reprezentativnih cijena u sektoru mesa peradi i
    jaja i za albumin iz jaja te Uredbe (EZ) br. 504/2007 o utvrđivanju detaljnih
    pravila za primjenu režima za dodatne uvozne carine u sektoru mlijeka i mliječnih
    proizvoda
  type: main
- language: hu
  script: Latn
  content: A Bizottság 248/2010/EU rendelete ( 2010. március 24. ) a baromfihús-
    és tojáságazatra, valamint az ovalbuminra vonatkozó kiegészítő importvámrendszer
    végrehajtására és az irányadó árak meghatározásáról szóló 1484/95/EK
    rendelet, valamint a tej- és tejtermékágazatban kivetett kiegészítő importvámokkal
    kapcsolatos rendelkezések alkalmazására vonatkozó részletes szabályok megállapításáról
    szóló 504/2007/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 248/2010 della Commissione, del 24 marzo 2010 , recante
    modifica del regolamento (CE) n. 1484/95 che stabilisce le modalità d’applicazione
    del regime relativo all’applicazione dei dazi addizionali all’importazione
    e fissa i prezzi rappresentativi nei settori delle uova e del pollame nonché
    per l’ovoalbumina, e del regolamento (CE) n. 504/2007 che stabilisce le modalità
    d’applicazione del regime relativo all’applicazione dei dazi addizionali all’importazione
    nel settore del latte e dei prodotti lattiero-caseari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 248/2010 ( 2010. gada 24. marts ), ar kuru groza
    Regulu (EK) Nr. 1484/95, ar ko nosaka sīki izstrādātus noteikumus par papildu
    ievedmuitas sistēmas ieviešanu un reprezentatīvo cenu noteikšanu mājputnu
    gaļas un olu nozarē, kā arī ovalbumīnam, un Regulu (EK) Nr. 504/2007, ar
    ko paredz sīki izstrādātus noteikumus par papildu ievedmuitas nodokļa piemērošanu
    piena un piena produktu nozarē
  type: main
- language: lt
  script: Latn
  content: 2010 m. kovo 24 d. Komisijos reglamentas (ES) Nr. 248/2010, kuriuo iš
    dalies keičiamas Reglamentas (EB) Nr. 1484/95, nustatantis išsamias papildomų
    importo muitų sistemos taikymo taisykles ir tipines kainas paukštienos bei kiaušinių
    sektoriams ir kiaušinių albuminui, ir Reglamentas (EB) Nr. 504/2007, nustatantis
    išsamias papildomų importo muitų pieno ir pieno produktų sektoriuje tvarkos
    taikymo taisykles
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 248/2010 tal- 24 ta’ Marzu 2010 li
    jemenda r-Regolament tal-Kunsill (KE) Nru 1484/95 li jistabbilixxi regoli dettaljati
    għall-implimentazzjoni ta’ sistema ta’ dazji addizzjonali fuq l-importazzjoni
    u jiffissa dazji addizzjonali tal-importazzjoni fl-oqsma tal-laħam tat-tjur u
    l-bajd u għall-albumina tal-bajd, u r-Regolament tal-Kummissjoni (KE) Nru 504/2007
    li jistabbilixxi regoli dettaljati għall-applikazzjoni tal-arranġamenti għal
    dazji addizzjonali fuq l-importazzjoni fis-settur tal-ħalib u prodotti tal-ħalib
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 248/2010 van de Commissie van 24 maart 2010 tot wijziging
    van Verordening (EG) nr. 1484/95 houdende bepalingen voor de toepassing van de
    aanvullende invoerrechten in de sectoren slachtpluimvee en eieren, alsmede voor
    ovalbumine, en houdende vaststelling van representatieve prijzen, en tot wijziging
    van Verordening (EG) nr. 504/2007 tot vaststelling van uitvoeringsbepalingen van
    de regeling inzake de toepassing van aanvullende invoerrechten in de sector melk
    en zuivelproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 248/2010 z dnia 24 marca 2010 r. zmieniające
    rozporządzenie (WE) nr 1484/95 określające szczegółowe zasady wdrażania
    systemu dodatkowych należności przywozowych oraz ustalające ceny reprezentatywne
    w sektorach mięsa drobiowego i jaj oraz w odniesieniu do albumin jaj oraz rozporządzenie
    (WE) nr 504/2007 ustanawiające szczegółowe zasady stosowania ustaleń dotyczących
    dodatkowych należności przywozowych w sektorze mleka i przetworów mlecznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 248/2010 da Comissão, de 24 de Março de 2010 ,
    que altera o Regulamento (CE) n. o 1484/95, que estabelece as normas de execução
    do regime relativo à aplicação dos direitos adicionais de importação, que
    fixa os preços representativos nos sectores da carne de aves de capoeira e dos
    ovos, bem como para a ovalbumina, e o Regulamento (CE) n. o 504/2007, que estabelece
    as normas de execução do regime relativo à aplicação dos direitos de importação
    adicionais no sector do leite e dos produtos lácteos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 248/2010 al Comisiei din 24 martie 2010 de modificare
    a Regulamentului (CE) nr. 1484/95 de stabilire a normelor de aplicare a sistemului
    de drepturi de import suplimentare și de fixare a prețurilor reprezentative
    în sectoarele cărnii de pasăre și ouălor și pentru albumina din ouă și
    a Regulamentului (CE) nr. 504/2007 de stabilire a normelor de aplicare a regimului
    privind aplicarea drepturilor suplimentare la import în sectorul laptelui și
    al produselor lactate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 248/2010 z 24. marca 2010 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1484/95, ktorým sa stanovujú podrobné pravidlá
    uplatňovania systému dodatočných dovozných ciel a stanovujú dodatočné
    dovozné clá v sektoroch hydinového mäsa, vajec a pre vaječný albumín a
    ktorým sa mení a dopĺňa nariadenie (ES) č. 504/2007, ktorým sa stanovujú
    podrobné pravidlá uplatňovania dohôd o dodatočných dovozných clách na
    mlieko a mliečne výrobky
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 248/2010 z dne 24. marca 2010 o spremembi Uredbe
    (ES) št. 1484/95 o podrobnih pravilih za izvajanje sistema dodatnih uvoznih dajatev
    in o določitvi reprezentativnih cen v sektorju za perutninsko meso in v sektorju
    za jajca ter za albumine iz jajc ter Uredbe (ES) št. 504/2007 o določitvi podrobnih
    pravil za uporabo režimov dodatnih uvoznih dajatev v sektorju mleka in mlečnih
    proizvodov
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 248/2010 de la Comisión, de 24 de marzo de 2010 ,
    que modifica el Reglamento (CE) n o 1484/95, por el que se establecen disposiciones
    de aplicación del régimen de aplicación de derechos adicionales de importación
    y se fijan los derechos adicionales de importación en los sectores de la carne
    de aves de corral, de los huevos y de la ovoalbúmina, y el Reglamento (CE) n
    o 504/2007, por el que se establecen las disposiciones de aplicación del régimen
    de aplicación de los derechos de importación adicionales en el sector de la
    leche y de los productos lácteos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 248/2010 av den 24 mars 2010 om ändring
    av förordning (EG) nr 1484/95 om tillämpningsföreskrifter för ordningen för
    tillämpning av tilläggsbelopp för import och om fastställande av representativa
    priser för fjäderfäkött och ägg och för äggalbumin och om ändring av förordning
    (EG) nr 504/2007 om tillämpningsföreskrifter för systemet för tillämpningen
    av tilläggstull vid import inom sektorn för mjölk och mjölkprodukter
