id: EUDecision19621012
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission relative au recours de la République fédérale
    d'Allemagne à l'article 115, alinéa I, du Traité, pour exclure du traitement
    communautaire les feuilles de tabac non écotées et déchets de tabac originaires
    des pays tiers et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über die Inanspruchnahme von Artikel 115 Absatz
    (1) EWG durch die Bundesrepublik Deutschland, um aus dritten Ländern stammende
    nicht entrippte Tabakblätter und Tabakabfälle, die in den anderen Mitgliedstaaten
    in den freien Verkehr gebracht wurden, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa al ricorso all'articolo 115, primo
    comma, del Trattato CEE da parte della Repubblica federale di Germania, allo scopo
    di escludere dal trattamento comunitario i tabacchi greggi o non lavorati e i
    cascami di tabacchi provenienti dai paesi terzi e introdotti in libera pratica
    negli Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende het beroep van de Bondsrepubliek
    Duitsland op artikel 115, alinea 1, van het Verdrag om niet gestripte tabaksbladeren
    en afvallen van tabak die van oorsprong zijn uit derde landen en in de andere
    Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
