title:
- language: en
  script: Latn
  content: '82/498/EEC: Council Decision of 21 July 1982 under the Treaties, concerning
    fishery activities in waters under the sovereignty or jurisdiction of Member States,
    taken on a temporary basis pending the adoption of permanent Community measures'
  type: main
- language: fr
  script: Latn
  content: '82/498/CEE: Décision du Conseil, du 21 juillet 1982, fondée sur les
    traités, relative aux activités de pêche exercées dans les eaux relevant de
    la souveraineté ou de la juridiction des États membres et prise à titre provisoire
    dans l'' attente de l'' adoption de mesures communautaires définitives'
  type: main
- language: de
  script: Latn
  content: '82/498/EWG: Beschluß des Rates vom 21. Juli 1982 gestützt auf die Verträge
    betreffend die Fischereitätigkeit in den der Hoheit oder der Rechtsprechung der
    Mitgliedstaaten unterstehenden Gewässern auf zeitweiliger Grundlage bis zum Erlaß
    dauerhafter Gemeinschaftsmaßnahmenz'
  type: main
- language: da
  script: Latn
  content: '82/498/EØF: Rådets afgørelse af 21. juli 1982 på grundlag af traktaterne
    om fiskeri i farvande henhørende under medlemsstaternes højhedsområde eller
    jurisdiktion, truffet som foreløbig ordning indtil vedtagelse af endelige fællesskabsforanstaltninger'
  type: main
- language: el
  script: Grek
  content: '82/498/EOK: Απόφαση τού Συμβουλίου τής 21ης Ιουλίου
    1982 βασισμένη στίς συνθήκες σχετικά μέ τίς δραστηριότητες
    αλιείας πού ασκούνται στά ύδατα πού υπάγονται
    στήν κυριαρχία ή τή δικαιοδοσία τών Κρατών
    μελών, καί προσωρινής ισχύος εν αναμονή τής
    λήψεως τελικών κοινοτικών μέτρων'
  type: main
- language: it
  script: Latn
  content: '82/498/CEE: Decisione del Consiglio, del 21 luglio 1982, fondata sui trattati,
    relativa alle attività di pesca nelle acque soggette alla sovranità o alla giurisdizione
    degli Stati membri e adottata a titolo provvisorio, in attesa dell'' adozione
    di misure comunitarie definitive'
  type: main
- language: nl
  script: Latn
  content: '82/498/EEG: Besluit van de Raad van 21 juli 1982 gebaseerd op de Verdragen,
    betreffende een tijdelijke regeling voor de visserijactiviteiten in onder de soevereiniteit
    of de jurisdictie van de Lid-Staten vallende wateren, in afwachting van de vaststelling
    van definitieve communautaire maatregeleno'
