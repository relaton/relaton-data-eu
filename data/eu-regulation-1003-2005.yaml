title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1003/2005 of 30 June 2005 implementing Regulation
    (EC) No 2160/2003 as regards a Community target for the reduction of the prevalence
    of certain salmonella serotypes in breeding flocks of Gallus gallus and amending
    Regulation (EC) No 2160/2003
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1003/2005 de la Commission du 30 juin 2005 portant
    application du règlement (CE) n° 2160/2003 du Parlement européen et du Conseil
    en ce qui concerne la fixation d’un objectif communautaire de réduction de
    la prévalence de certains sérotypes de salmonelles dans les cheptels reproducteurs
    de Gallus gallus et portant modification du règlement (CE) n° 2160/2003
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1003/2005 der Kommission vom 30. Juni 2005 zur Durchführung
    der Verordnung (EG) Nr. 2160/2003 hinsichtlich eines Gemeinschaftsziels zur Senkung
    der Prävalenz bestimmter Salmonella-Serotypen bei Zuchtherden von Gallus gallus
    und zur Änderung der Verordnung (EG) Nr. 2160/2003
  type: main
- language: bg
  script: Cyrl
