    tal-prevalenza ta’ ċerti serotipi tas-salmonella f’qatgħat għat-tgħammir
    ta’ Gallus gallus u li jemenda r-Regolament (KE) Nru 2160/2003
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1003/2005 van de Commissie van 30 juni 2005 ter uitvoering
