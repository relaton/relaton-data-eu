    powszechnego występowania niektórych serotypów salmonelli w stadach hodowlanych
    gatunku Gallus gallus oraz zmieniające rozporządzenie (WE) nr 2160/2003
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1003/2005 da Comissão, de 30 de Junho de 2005, relativo
    à execução do Regulamento (CE) n.° 2160/2003 no que se refere ao objectivo
    comunitário de redução da prevalência de determinados serótipos de salmonela
    em bandos de reprodução de Gallus gallus e que altera o Regulamento (CE) n.°
    2160/2003
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1003/2005 al Comisiei din 30 iunie 2005 de aplicare
    a Regulamentului (CE) nr. 2160/2003 al Parlamentului European și al Consiliului
    cu privire la stabilirea unui obiectiv comunitar de reducere a prevalenței anumitor
    serotipuri de salmonela în efectivele de reproducere din specia Gallus gallus
    și de modificare a Regulamentului (CE) nr. 2160/2003
  type: main
- language: sk
