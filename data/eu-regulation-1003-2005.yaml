    na snížení výskytu určitých sérotypů salmonely v reprodukčních hejnech
    druhu Gallus gallus, a kterým se mění nařízení Evropského parlamentu a
    Rady (ES) č. 2160/2003
  type: main
- language: da
  script: Latn
