title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3367/90 of 23 November 1990 on the sale
    by the procedure laid down in Regulation (EEC) No 2539/84 of bone-in beef held
    by certain intervention agencies and intended for export, amending Regulations
    (EEC) 569/88 and No 2722/90 and repealing Regulation (EEC) No 3182/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3367/90 de la Commission du 23 novembre 1990 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines non désossées détenues par certains organismes d'intervention
    et destinées à être exportées, modifiant les règlements (CEE) n° 569/88
    et (CEE) n 2722/90 et abrogeant le règlement (CEE) n° 3182/90
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3367/90 DER KOMMISSION vom 23. November 1990 über
    den Verkauf von zur Ausfuhr bestimmtem Rindfleisch mit Knochen aus Beständen
    einiger Interventionsstellen nach dem Verfahren der Verordnung (EWG) Nr. 2539/84,
    zur Änderung der Verordnungen (EWG) Nr. 569/88 und (EWG) Nr. 2722/90 und zur
    Aufhebung der Verordnung (EWG) Nr. 3182/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3367/90 af 23. november 1990 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af ikke-udbenet oksekød fra
    visse interventionsorganer med henblik på udførsel, om ændring af forordning
    (EØF) nr. 569/88 og (EØF) nr. 2722/90 og om ophævelse af forordning (EØF)
    nr. 3182/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3367/90 της Επιτροπής
    της 23ης Νοεμβρίου 1990 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος με
    κόκαλα που κρατείται από ορισμένους οργανισμούς
    παρέμβασης και προορίζεται για εξαγωγή καθώς
    και σχετικά με την τροποποίηση των κανονισμών
    (ΕΟΚ) αριθ. 569/88 και (ΕΟΚ) αριθ. 2722/90 και την κατάργηση
    του κανονισμού (ΕΟΚ) αριθ. 3182/90
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3367/90 DELLA COMMISSIONE del 23 novembre 1990 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine non disossate detenute da taluni organismi d'' intervento e destinate
    all'' esportazione, che modifica i regolamenti (CEE) n. 569/88 e (CEE) n. 2722/90
    e recante abrogazione del regolamento (CEE) n. 3182/90 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3367/90 VAN DE COMMISSIE van 23 november 1990 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees
    met been, houdende wijziging van de Verordeningen (EEG) nr. 569/88 en (EEG) nr.
    2722/90 en houdende intrekking van Verordening (EEG) nr. 3182/90 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3367/90 DA COMISSÃO de 23 de Novembro de 1990 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) nº 2539/84, de
    carne de bovino não desossada detida por certos organismos de intervenção e
    destinada a ser exportada, que altera os Regulamentos (CEE) nº 569/88 e (CEE)
    nº 2722/90 e que revoga o Regulamento (CEE) nº 3182/90 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3367/90 DE LA COMISIÓN de 23 de noviembre de 1990
    relativo a la venta, en el marco del procedimiento definido en el Reglamento (CEE)
    no 2539/84, de carnes de vacuno sin deshuesar en poder de determinados organismos
    de intervención y destinadas a ser exportadas, que modifica los Reglamentos (CEE)
    no 569/88 y (CEE) no 2722/90 y deroga el Reglamento (CEE) no 3182/90 #'
