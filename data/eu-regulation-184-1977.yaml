  content: Commission Regulation (EEC) No 184/77 of 28 January 1977 fixing the rates
    of the refunds applicable from 1 February 1977 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 184/77 de la Commission, du 28 janvier 1977, fixant
    les taux des restitutions applicables, à compter du 1er février 1977, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 184/77 der Kommission vom 28. Januar 1977 zur Festsetzung
