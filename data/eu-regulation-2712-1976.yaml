title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2712/76 of 9 November 1976 amending Regulation
    (EEC) No 221/72 as regards the qualifying date for the takeover of intervention
    beef meat for which the maximum tolerance for weight losses resulting from storage
    applies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2712/76 de la Commission, du 9 novembre 1976, modifiant
    le règlement (CEE) n° 221/72 en ce qui concerne la date de prise en charge des
    viandes bovines à l' intervention auxquelles s' applique la limite de tolérance
    pour les pertes de quantités résultant du stockage
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2712/76 der Kommission vom 9. November 1976 zur Änderung
    der Verordnung (EWG) Nr. 221/72 betreffend den Übernahmestichtag für Interventionsrindfleisch,
    auf das die Toleranzgrenze für aus der Lagerung herrührende Mengenverluste anwendbar
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2712/76 af 9. november 1976 om ændring
    af forordning (EØF) nr. 221/72 for så vidt angår datoen for overtagelse af
    interventionsoksekød, for hvilket tolerancegrænsen for mængdetab, som følge
    af oplagring, finder anvendelse
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2712/76 della Commissione, del 9 novembre 1976, che
    modifica il regolamento (CEE) n. 221/72 per quanto riguarda la data di presa in
    consegna all' intervento delle carni bovine cui si applica il limite di tolleranza
    per le perdite di quantità dovute all' ammasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2712/76 van de Commissie van 9 november 1976 tot
    wijziging van Verordening (EEG) nr. 221/72 ten aanzien van de datum van overname
    door de interventiebureaus van rundvlees waarvoor de tolerantielimiet voor gewichtsverliezen
    bij de opslag van toepassing is
