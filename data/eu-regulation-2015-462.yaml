    стандарти за изпълнение по отношение на процедурите
    за одобрение от надзорните органи за учредяването
    на схеми със специална цел за алтернативно
    прехвърляне на застрахователен риск и по отношение
    на процедурите за сътрудничество и обмен на
    информация между надзорните органи във връзка
    с такива схеми със специална цел, както и за
    определяне на форматите и образците за информацията,
    която трябва да бъде отчитана от такива схеми
    със специална цел в съответствие с Директива
    2009/138/ЕО на Европейския парламент и на Съвета
  type: main
