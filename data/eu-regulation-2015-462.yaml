    für die Zusammenarbeit und den Informationsaustausch zwischen den Aufsichtsbehörden
    im Hinblick auf Zweckgesellschaften sowie zur Festlegung der Formate und Muster
    für die von Zweckgesellschaften gemäß der Richtlinie 2009/138/EG des Europäischen
    Parlaments und des Rates vorzulegenden Angaben
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/462 на Комисията
