title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/462 of 19 March 2015 laying
    down implementing technical standards with regard to the procedures for supervisory
    approval to establish special purpose vehicles, for the cooperation and exchange
    of information between supervisory authorities regarding special purpose vehicles
    as well as to set out formats and templates for information to be reported by
    special purpose vehicles in accordance with Directive 2009/138/EC of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/462 de la Commission du 19 mars 2015
    définissant des normes techniques d'exécution concernant les procédures de
    délivrance de l'agrément prudentiel nécessaire à l'établissement de véhicules
    de titrisation, la coopération et l'échange d'informations entre les autorités
    de contrôle des véhicules de titrisation, ainsi que les formats et modèles
    à utiliser par les véhicules de titrisation pour les informations qu'ils doivent
    soumettre conformément à la directive 2009/138/CE du Parlement européen et
    du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/462 der Kommission vom 19. März 2015
