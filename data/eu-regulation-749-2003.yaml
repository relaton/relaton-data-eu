    y Rumania, presentadas en abril de 2003
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 749/2003 av den 28 april 2003 om i vilken
    utsträckning ansökningar om importlicenser inlämnade under april 2003 för
