    om invoercertificaten voor de tariefcontingenten voor rundvlees die bĳ Verordening
    (EG) nr. 1279/98 zĳn vastgesteld voor de Republiek Polen, de Republiek Hongarĳe,
    de Tsjechische Republiek, Slowakĳe, Bulgarĳe en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 749/2003 da Comissão, de 28 de Abril de 2003, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Abril de 2003 para os contingentes pautais de carnes de bovino
    previstos pelo Regulamento (CE) n.° 1279/98 para a República da Polónia, a
