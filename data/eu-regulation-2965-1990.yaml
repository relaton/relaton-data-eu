  content: Commission Regulation (EEC) No 2965/90 of 12 October 1990 introducing a
    corrective amount on the import of cucumbers into the Community of Ten from Spain
    (except the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2965/90 de la Commission, du 12 octobre 1990, instituant
