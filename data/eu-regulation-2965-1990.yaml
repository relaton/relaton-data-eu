    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή,
    στην Κοινότητα των Δέκα, αγγουριών από την
    Ισπανία (εκτός των Καναρίων Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2965/90 della Commissione, del 12 ottobre 1990, che
