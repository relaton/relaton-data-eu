title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/57 of 19 January 2016 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    poultry and poultry products may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza outbreaks in the State of Minnesota
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/57 de la Commission du 19 janvier 2016
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives aux États-Unis sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certaines volailles et certains produits de volailles peuvent
    être importés dans l'Union ou transiter par celle-ci, à la suite de l'apparition
    de foyers d'influenza aviaire hautement pathogène dans l'État du Minnesota
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/57 der Kommission vom 19. Januar 2016
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich der
    Einträge zu den Vereinigten Staaten in der Liste von Drittländern, Gebieten,
    Zonen und Kompartimenten, aus denen Geflügel und Geflügelerzeugnisse in die
    Union eingeführt bzw. durch die Union durchgeführt werden dürfen, im Zusammenhang
    mit Ausbrüchen der hochpathogenen Aviären Influenza im Bundesstaat Minnesota
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/57 на Комисията
    от 19 януари 2016 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Съединените щати в списъка на третите държави,
    територии, зони или компартменти, от които
    са разрешени вносът и транзитът през Съюза
    на домашни птици и продукти от домашни птици,
    във връзка с появата на огнища на високопатогенна
    инфлуенца по птиците в щата Минесота
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/57 ze dne 19. ledna 2016, kterým
    se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku týkající
    se Spojených států amerických na seznamu třetích zemí, území, oblastí
    nebo jednotek, z nichž lze do Unie dovážet nebo přes její území přepravovat
    drůbež a drůbeží produkty, v souvislosti s ohnisky vysoce patogenní influenzy
    ptáků ve státě Minnesota
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/57 af 19. januar 2016
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om USA i listen over tredjelande, områder, zoner og segmenter, hvorfra import
    til eller transit gennem Unionen af fjerkræ og fjerkræprodukter er tilladt i
    forbindelse med udbrud af højpatogen aviær influenza i staten Minnesota
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/57 της Επιτροπής,
