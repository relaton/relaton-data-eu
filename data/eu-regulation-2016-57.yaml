    koskevan kohdan osalta niiden kolmansien maiden, alueiden, vyöhykkeiden tai erillisalueiden
    luettelossa, joista siipikarjan tai siipikarjatuotteiden tuonti unioniin tai kuljettaminen
    sen kautta on sallittua Minnesotan osavaltiossa ilmenneiden korkeapatogeenisen
    lintuinfluenssan taudinpurkausten yhteydessä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/57 оd 19. siječnja 2016. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Sjedinjene Američke Države
    na popisu trećih zemalja, državnih područja, zona ili kompartmenta iz kojih
    je dozvoljen uvoz u Uniju i provoz kroz nju peradi i proizvoda od peradi u vezi
    s izbijanjem visokopatogene influence ptica u saveznoj državi Minnesoti
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/57 végrehajtási rendelete (2016. január 19.)
    a 798/2008/EK rendelet I. mellékletének a baromfi és baromfitermékek Unióba
    történő behozatala vagy Unió területén való átszállítása céljából
    engedélyezett harmadik országok, területek, övezetek és területi egységek
    jegyzékében az Amerikai Egyesült Államokra vonatkozó bejegyzés tekintetében
    az erősen patogén vírustörzsek okozta madárinfluenza Minnesota államban
    való megjelenése nyomán szükségessé vált módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/57 della Commissione, del 19 gennaio
    2016, che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa agli Stati Uniti nell'elenco di paesi terzi, loro territori,
    zone o compartimenti da cui sono consentiti le importazioni e il transito nell'Unione
    di pollame e di prodotti a base di pollame, in relazione alla comparsa di focolai
    di influenza aviaria ad alta patogenicità nello Stato del Minnesota
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/57 (2016. gada 19. janvāris),
    ar ko Regulas (EK) Nr. 798/2008 I pielikumā groza ierakstu par Amerikas Savienotajām
    Valstīm to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā, no kuriem
    attiecībā uz augsti patogēnās putnu gripas uzliesmojumiem Minesotas štatā
    atļauts Savienībā importēt vai tranzītā caur to pārvadāt mājputnus un
    mājputnu produktus
  type: main
- language: lt
  script: Latn
  content: 2016 m. sausio 19 d. Komisijos įgyvendinimo reglamentas (ES) 2016/57,
    kuriuo dėl labai patogeniško paukščių gripo protrūkių Minesotos valstijoje
    ir su ta liga susijusių Jungtinių Amerikos Valstijų įrašų trečiųjų šalių,
    teritorijų, zonų ar skyrių, iš kurių galima importuoti į Sąjungą ir vežti
    tranzitu per Sąjungą tam tikrus naminius paukščius ir jų produktus, sąraše
    iš dalies keičiamas Reglamento (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/57 tad-19 ta'
    Jannar 2016 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 dwar l-entrata
    għall-Istati Uniti fil-lista ta' pajjiżi terzi, territorji, żoni jew kumpartimenti
    li minnhom jistgħu jiġu importati tjur u prodotti tat-tjur lejn l-Unjoni jew
    isir tranżitu minnha fir-rigward tat-tifqigħat tal-influwenza tat-tjur b'patoġeniċità
    għolja fl-Istat ta' Minnesota
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/57 van de Commissie van 19 januari 2016
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de gegevens
    voor de Verenigde Staten in de lijst van derde landen, gebieden, zones of compartimenten
    waaruit pluimvee en pluimveeproducten mogen worden ingevoerd in en doorgevoerd
    door de Unie in verband met uitbraken van hoogpathogene aviaire influenza in de
    staat Minnesota
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/57 z dnia 19 stycznia 2016
    r. zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w odniesieniu
    do wpisu dotyczącego Stanów Zjednoczonych w wykazie państw trzecich, terytoriów,
    stref lub grup, z których dopuszczalny jest przywóz do Unii i tranzyt przez
    jej terytorium drobiu oraz produktów drobiowych, w związku z wystąpieniem ognisk
    wysoce zjadliwej grypy ptaków w stanie Minnesota
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/57 da Comissão, de 19 de janeiro de
    2016, que altera o anexo I do Regulamento (CE) n.° 798/2008 no que se refere
    à entrada relativa aos Estados Unidos na lista de países terceiros, territórios,
    zonas ou compartimentos a partir dos quais são autorizados a importação e o
    trânsito na União de aves de capoeira e produtos à base de aves de capoeira,
    relativamente aos surtos de gripe aviária de alta patogenicidade no Estado do
    Minnesota
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/57 al Comisiei din 19 ianuarie
    2016 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Statele Unite din lista cu țări terțe, teritorii, zone
    sau compartimente din care păsările de curte și produsele obținute de la păsări
    de curte pot fi importate în Uniune sau pot tranzita Uniunea în contextul apariției
    unor focare de gripă aviară înalt patogenă în statul Minnesota
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/57 z 19. januára 2016, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Spojených štátov amerických v zozname tretích krajín, území, oblastí
    alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    hydinu a výrobky z hydiny v súvislosti s ohniskami vysokopatogénnej aviárnej
    influenzy v štáte Minnesota
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/57 z dne 19. januarja 2016 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Združene države Amerike
    na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih je
    dovoljen uvoz perutnine in perutninskih proizvodov v Unijo ali njihov tranzit
    skozi Unijo, v zvezi z izbruhi visokopatogene aviarne influence v zvezni državi
    Minnesota
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/57 de la Comisión, de 19 de enero de
    2016, por el que se modifica el anexo I del Reglamento (CE) n° 798/2008 en lo
    que atañe a la entrada correspondiente a los Estados Unidos de la lista de terceros
    países, territorios, zonas o compartimentos desde los cuales están permitidos
    la importación en la Unión y el tránsito por esta de aves de corral y productos
    derivados en relación con los brotes de influenza aviar de alta patogenicidad
    en el Estado de Minnesota
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/57 av den 19 januari 2016
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgiften
    om Förenta staterna i förteckningen över tredjeländer, områden, zoner eller
    delområden från vilka fjäderfä och fjäderfäprodukter får importeras till
    eller transiteras genom unionen i samband med utbrott av högpatogen aviär influensa
    i delstaten Minnesota
