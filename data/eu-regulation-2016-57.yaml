    των πτηνών έπειτα από την εκδήλωση εστιών στην
    πολιτεία της Μινεσότα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/57, 19. jaanuar 2016, millega muudetakse
    Minnesota osariigis esinenud kõrge patogeensusega linnugripi puhangute tõttu
    määruse (EÜ) nr 798/2008 I lisas Ameerika Ühendriike käsitlevat kannet loetelus,
    milles on esitatud need kolmandad riigid, territooriumid, tsoonid ja piirkonnad,
    millest võib importida liitu või vedada läbi liidu kodulinde ja linnukasvatussaadusi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/57, annettu 19 päivänä
