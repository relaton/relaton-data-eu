title:
- language: en
  script: Latn
  content: '90/390/EEC: Commission Decision of 16 July 1990 amending Decision 79/542/EEC
    drawing up a list of third countries from which the Member States authorize imports
    of bovine animals, swine and fresh meat'
  type: main
- language: fr
  script: Latn
  content: '90/390/CEE: Décision de la Commission du 16 juillet 1990 modifiant la
    décision 79/542/CEE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent l''importation d''animaux des espèces bovine et
    porcine et de viandes fraîches'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 16. Juli 1990 zur Aenderung der Entscheidung
    79/542/EWG ueber die Erstellung einer Liste der Drittlaender, aus denen die Mitgliedstaaten
    die Einfuhr von Rindern, Schweinen und frischem Fleisch gestatten (90/390/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 16. juli 1990 om aendring af beslutning 79/542/EOEF
    om opstilling af en liste over de tredjelande, hvorfra medlemsstaterne tillader
    indfoersel af kvaeg og svin samt fersk koed (90/390/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/390/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Ιουλίου 1990 που τροποποιεί την απόφαση 79/527/ΕΟΚ
    σχετικά με τον καθορισμό του πίνακα των τρίτων
    χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    τις εισαγωγές βοοειδών, χοίρων και νωπών κρεάτων'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 16 luglio 1990 che modifica la decisione
    79/542/CEE per quanto riguarda la lista dei paesi terzi dai quali gli Stati membri
    autorizzano l'importazione di animali delle specie bovina suina e di carni fresche
    (90/390/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 16 juli 1990 tot wijziging van Beschikking
    79/542/EEG inzake de lijst van derde landen van waaruit de Lid-Staten de invoer
    van runderen, varkens en vers vlees toelaten (90/390/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 16 de Julho de 1990 que altera a Decisao 79/542/CEE,
    estabelecendo a lista de paises terceiros a partir dos quais os Estados-membros
    autorizam a importaçao de animais das espécies bovina e suina e de carnes frescas
    (90/390/CEE)
  type: main
- language: es
  script: Latn
