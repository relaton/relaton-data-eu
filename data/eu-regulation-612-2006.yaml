title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 612/2006 of 19 April 2006 determining to
    what extent applications lodged in April 2006 for the right to import bulls, cows
    and heifers other than for slaughter of certain Alpine and mountain breeds can
    be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 612/2006 de la Commission du 19 avril 2006 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2006 pour l'importation de taureaux, vaches et génisses,
    autres que ceux destinés à la boucherie, de certaines races alpines et de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 612/2006 der Kommission vom 19. April 2006 zur Bestimmung
