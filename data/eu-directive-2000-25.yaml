    inquinante prodotti dai motori destinati alla propulsione dei trattori agricoli
    o forestali e recante modificazione della direttiva 74/150/CEE del Consiglio
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2000/25/EK (2000. gada 22. maijs),
    ar kuru paredz darbības, kas veicamas, lai samazinātu gāzveida un cieto daļiņu
    piesārņojumu emisiju no dzinējiem, kas paredzēti lauksaimniecības vai mežsaimniecības
    traktoriem, un ar kuru groza Padomes Direktīvu 74/150/EEK
  type: main
- language: lt
  script: Latn
  content: 2000 m. gegužės 22 d. Europos Parlamento ir Tarybos Direktyva 2000/25/EB
    dėl veiksmų, kurių būtina imtis dėl variklių, skirtų žemės ūkio ar miškų
    ūkio traktoriams, išmetamų dujinių teršalų ir kietųjų dalelių, iš dalies
    keičianti Tarybos direktyvą 74/150/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2000/25/KE tal-Parlament Ewropew u l-Kunsill tat-22 ta' Mejju
    2000 dwar l-azzjoni li għandha tittieħed kontra l-emissjonijiet ta' inkwinanti
    ta' gass u partikolati minn magni għat-tmexxija ta' tratturi għall-agrikoltura
    jew għall-forestrija u li temenda d-Direttiva tal-Kunsill 74/150/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/25/EG van het Europees Parlement en de Raad van 22 mei 2000
    inzake maatregelen tegen de uitstoot van verontreinigende gassen en deeltjes door
    motoren bestemd voor het aandrijven van landbouw- of bosbouwtrekkers en houdende
    wijziging van Richtlijn 74/150/EEG van de Raad
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2000/25/WE Parlamentu Europejskiego i Rady z dnia 22 maja 2000
    r. w sprawie środków stosowanych przeciwko stałym i gazowym zanieczyszczeniom
    pochodzącym z silników napędzających ciągniki rolnicze lub leśne i zmieniająca
    dyrektywę Rady 74/150/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/25/CE do Parlamento Europeu e do Conselho, de 22 de Maio
    de 2000, relativa às medidas a tomar contra as emissões de gases poluentes e
    de partículas poluentes provenientes dos motores destinados à propulsão dos
    tractores agrícolas ou florestais e que altera a Directiva 74/150/CEE do Conselho
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/25/CE a Parlamentului European și a Consiliului din 22
    mai 2000 privind măsurile care trebuie luate împotriva emisiei de poluanți
    gazoși și de pulberi provenind de la motoarele pentru tractoare agricole și
    forestiere și de modificare a Directivei 74/150/CEE a Consiliului
  type: main
- language: sk
  script: Latn
  content: Smernica 2000/25/ES Európskeho parlamentu a Rady z 22. mája 2000 o opatreniach
    proti emisiám plynných a pevných znečisťujúcich látok motorov na pohon
    poľnohospodárskych alebo lesných traktorov, ktorou sa mení a dopĺňa smernica
    Rady 74/150/EHS
  type: main
- language: sl
  script: Latn
  content: Direktiva Evropskega parlamenta in Sveta 2000/25/ES z dne 22. maja 2000
