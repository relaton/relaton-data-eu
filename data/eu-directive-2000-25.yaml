title:
- language: en
  script: Latn
  content: Directive 2000/25/EC of the European Parliament and of the Council of 22
    May 2000 on action to be taken against the emission of gaseous and particulate
    pollutants by engines intended to power agricultural or forestry tractors and
    amending Council Directive 74/150/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 2000/25/CE du Parlement européen et du Conseil du 22 mai 2000
    relative aux mesures à prendre contre les émissions de gaz polluants et de particules
    polluantes provenant des moteurs destinés à la propulsion des tracteurs agricoles
    ou forestiers et modifiant la directive 74/150/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/25/EG des Europäischen Parlaments und des Rates vom 22.
    Mai 2000 über Maßnahmen zur Bekämpfung der Emission gasförmiger Schadstoffe
    und luftverunreinigender Partikel aus Motoren, die für den Antrieb von land-
    und forstwirtschaftlichen Zugmaschinen bestimmt sind, und zur Änderung der Richtlinie
    74/150/EWG des Rates
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/25/ЕО на Европейския парламент
    и на Съвета от 22 май 2000 година относно мерките,
    които следва да бъдат предприети срещу емисиите
    от газообразни и прахообразни замърсяващи
    околната среда вещества от двигателите, предназначени
    за задвижване на селскостопански и горски
    трактори, и за изменение на Директива 74/150/ЕИО
    на Съвета
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2000/25/ES ze dne 22. května 2000
    o opatřeních proti emisím plynných znečišťujících látek a znečišťujících
    částic z motorů používaných k pohonu zemědělských a lesnických traktorů,
    kterou se mění směrnice Rady 74/150/EHS
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2000/25/EF af 22. maj 2000 om foranstaltninger
    mod emission af forurenende luftarter og partikler fra forbrændingsmotorer til
    fremdrift af landbrugs- og skovbrugstraktorer og om ændring af Rådets direktiv
    74/150/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/25/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 22ας Μαΐου 2000, σχετικά
    με τα μέτρα που πρέπει να ληφθούν κατά των εκπομπών
    ρυπογόνων αερίων και σωματιδίων από κινητήρες
    προοριζόμενους για την πρόωση γεωργικών ή
    δασικών ελκυστήρων, και για την τροποποίηση
    της οδηγίας 74/150/ΕΟΚ του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2000/25/EÜ, 22. mai 2000, põllumajandus-
    ja metsatraktorite mootoritest paisatavate gaasiliste ja tahkete osakeste heitmete
    vastu võetavate meetmete kohta, millega muudetakse nõukogu direktiivi 74/150/EMÜ
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2000/25/EY, annettu 22 päivänä
    toukokuuta 2000, maatalous- ja metsätraktoreiden käyttövoimaksi tarkoitettujen
    moottoreiden kaasu- ja hiukkaspäästöjen vähentämiseksi toteutettavista toimenpiteistä
    ja neuvoston direktiivin 74/150/ETY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva 2000/25/EZ Europskog parlamenta i Vijeća od 22. svibnja 2000.
    o mjerama koje treba poduzeti protiv emisije plinovitih i krutih onečišćujućih
    tvari iz motora namijenjenih za pogon traktora za poljoprivredu i šumarstvo i
    o izmjeni Direktive Vijeća 74/150/EEZ
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2000/25/EK irányelve (2000. május
    22.) a mezőgazdasági vagy erdészeti traktorok hajtására szánt motorok gáz-
    és szilárd halmazállapotú szennyezőanyag-kibocsátása elleni intézkedésről,
    valamint a 74/150/EGK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/25/CE del Parlamento europeo e del Consiglio, del 22 maggio
