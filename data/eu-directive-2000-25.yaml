    iz motorjev, namenjenih za pogon kmetijskih ali gozdarskih traktorjev in spremembi
    Direktive Sveta 74/150/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 2000/25/CE del Parlamento Europeo y del Consejo, de 22 de mayo
    de 2000, relativa a las medidas que deben adoptarse contra las emisiones de gases
    contaminantes y de partículas contaminantes procedentes de motores destinados
    a propulsar tractores agrícolas o forestales y por la que se modifica la Directiva
    74/150/CEE del Consejo
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2000/25/EG av den 22 maj 2000 om
