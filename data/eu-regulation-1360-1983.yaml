title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1360/83 of 30 May 1983 re-establishing the
    levying of customs duties on other leather, falling within subheading 41.02 ex
    C and originating in Uruguay, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1360/83 de la Commission du 30 mai 1983 portant rétablissement
    de la perception des droits de douane applicables aux autres cuirs et peaux de
    la sous-position tarifaire 41.02 ex C, originaires de l' Uruguay, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1360/83 der Kommission vom 30. Mai 1983 zur Wiedereinführung
    der Erhebung der Zölle für anderes Leder der Tarifstelle 41.02 ex C, mit Ursprung
    in Uruguay, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1360/83 af 30. maj 1983 om genindførelse
    af opkrævning af told for andre varer, henhørende under pos. 41.02 ex C og med
    oprindelse i Uruguay, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
