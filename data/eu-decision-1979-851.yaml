id: EUDecision1979851
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 1 October 1979 on the granting by the Guidance Section
    of the EAGGF to Ireland of a payment on account in respect of expenditure incurred
    during 1978 on aids and premiums relating to the modernization of farms including
    those in the less- favoured farming areas (Only the English text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er octobre 1979, relative au versement
    par le Fonds européen d'orientation et de garantie agricole (FEOGA), section
    "orientation", à l'Irlande d'un acompte sur les dépenses effectuées pendant
    l'année 1978 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées (Le texte en langue
    anglaise est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. Oktober 1979 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1978 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an Irland (Nur der englische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 1. oktober 1979 om udbetaling gennem EUGFL,
    udviklingssektionen, til Irland af et acontobeløb for de udgifter, som er afholdt
    i løbet af året 1978 til støtte og præmier vedrørende modernisering af landbrugsbedrifter,
    herunder sådanne beliggende i ugunstigt stillede områder (Kun den engelske udgave
    er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1 ottobre 1979, relativa al versamento
    da parte del FEAOG, sezione orientamento, all'Irlanda di un anticipo sulle spese
    effettuate durante il 1978 per gli aiuti ed i premi relativi all'ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testo
    in lingua inglese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 oktober 1979 betreffende de betaling
    door het EOGFL, afdeling Oriëntatie, aan Ierland van een voorschot in verband
    met de in 1978 verrichte uitgaven voor steun en premies met betrekking tot de
    modernisering van landbouwbedrijven, waaronder mede begrepen die in probleemgebieden
    in de landbouw (Slechts de tekst in de Engelse taal is authentiek)
  type: main
