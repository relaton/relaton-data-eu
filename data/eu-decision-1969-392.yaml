title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 3 novembre 1969, relative aux modalités
    d'application à certaines marchandises relevant du règlement (CEE) n° 1059/69
    de la décision de la Commission, du 30 octobre 1969, autorisant la République
    fédérale d'Allemagne à prendre des mesures de sauvegarde dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: '69/392/EWG: Entscheidung der Kommission vom 3. November 1969 über die
    Bestimmungen zur Anwendung der Entscheidung der Kommission vom 30. Oktober 1969
    betreffend die Ermächtigung der Bundesrepublik Deutschland zur Ergreifung von
    Schutzmaßnahmen für die deutsche Landwirtschaft auf bestimmte, unter die Verordnung
    (EWG) Nr. 1059/69 fallende Waren'
  type: main
- language: it
  script: Latn
  content: '69/392/CEE: Decisione della Commissione, del 3 novembre 1969, relativa
    alle modalità di applicazione della decisione della Commissione, del 30 ottobre
    1969, che autorizza la Repubblica federale di Germania ad adottare misure di salvaguardia
    nel settore agricolo per talune merci di cui al regolamento (CEE) n. 1059/69'
  type: main
- language: nl
  script: Latn
  content: '69/392/EEG: Beschikking van de Commissie van 3 november 1969 houdende
    voorschriften voor de toepassing van de beschikking van de Commissie van 30 oktober
    1969 waarbij de Bondsrepubliek Duitsland wordt gemachtigd vrijwaringsmaatregelen
    voor de Duitse landbouw te treffen, op bepaalde goederen welke onder Verordening
    (EEG) nr. 1059/69 vallen'
  type: main
