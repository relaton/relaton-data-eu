title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2379/96 of 13 December 1996 authorizing the
    conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1996/97 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2379/96 de la Commission du 13 décembre 1996 ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1996/1997
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2379/96 der Kommission vom 13. Dezember 1996 zur Eröffnung
    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifizierten Traubenmost für das Wirtschaftsjahr 1996/97
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 2379/96 af 13. december 1996 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost
    og rektificeret koncentreret druemost for produktionsåret 1996/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2379/96 της Επιτροπής
    της 13ης Δεκεμβρίου 1996 για την παροχή δυνατότητας
    σύναψης συμφωνητικών μακροπρόθεσμης ιδιωτικής
    αποθεματοποίησης επιτραπέζιου οίνου, γλεύκους
    σταφυλών, συμπυκνωμένου γλεύκους σταφυλών
    και διορθωμένου συμπυκνωμένου γλεύκους σταφυλών
    για την περίοδο 1996/97
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2379/96, annettu 13 päivänä joulukuuta 1996,
    mahdollisuudesta tehdä yksityistä varastointia koskevia pitkän aikavälin sopimuksia
    viinivuodelle 1996/97 pöytäviinin, rypälemehun, tiivistetyn rypälemehun ja
    puhdistetun tiivistetyn rypälemehun osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2379/96 della Commissione del 13 dicembre 1996 che
    concede, per la campagna 1996/97, la possibilità di concludere contratti di magazzinaggio
    privato a lungo termine per il vino da tavola, il mosto di uve concentrato e il
    mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2379/96 van de Commissie van 13 december 1996 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1996/1997
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2379/96 da Comissão de 13 de Dezembro de 1996 que
    permite concluir contratos de armazenamento privado a longo prazo para o vinho
    de mesa, o mosto de uvas, o mosto de uvas concentrado e o mosto de uvas concentrado
    rectificado, para a campanha de 1996/1997
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2379/96 de la Comisión de 13 de diciembre de 1996
