title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2010/82 of 19 July 1982 determining, for the
    1982/83 wine-growing year, the prices to be paid under the compulsory distillation
    of the by-products of wine making and, notwithstanding Regulation (EEC) No 349/79,
    the amount of the contribution from the Guarantee Section of the European Agricultural
    Guidance and Guarantee Funde
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2010/82 du Conseil, du 19 juillet 1982, déterminant,
    pour la campagne viticole 1982/1983, les prix à payer au titre de la distillation
    obligatoire des sous-produits de la vinification et, par dérogation au règlement
    (CEE) n° 349/79, le montant de la participation du Fonds européen d' orientation
    et de garantie agricole, section "garantie"
  type: main
