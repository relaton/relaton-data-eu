    szóló 607/2009/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 428/2012 della Commissione, del 22 maggio
    2012 , che modifica il regolamento (CE) n. 607/2009 recante modalità di applicazione
    del regolamento (CE) n. 479/2008 del Consiglio per quanto riguarda le denominazioni
    di origine protette e le indicazioni geografiche protette, le menzioni tradizionali,
    l’etichettatura e la presentazione di determinati prodotti vitivinicoli
  type: main
