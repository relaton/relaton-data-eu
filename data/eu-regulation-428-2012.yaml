    zur Änderung der Verordnung (EG) Nr. 607/2009 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 479/2008 des Rates hinsichtlich der geschützten Ursprungsbezeichnungen
    und geografischen Angaben, der traditionellen Begriffe sowie der Kennzeichnung
    und Aufmachung bestimmter Weinbauerzeugnisse
  type: main
