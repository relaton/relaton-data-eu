title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 428/2012 of 22 May 2012 amending
    Regulation (EC) No 607/2009 laying down certain detailed rules for the implementation
    of Council Regulation (EC) No 479/2008 as regards protected designations of origin
    and geographical indications, traditional terms, labelling and presentation of
    certain wine sector products
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 428/2012 de la Commission du 22 mai
    2012 modifiant le règlement (CE) n ° 607/2009 fixant certaines modalités d’application
    du règlement (CE) n ° 479/2008 du Conseil en ce qui concerne les appellations
    d’origine protégées et les indications géographiques protégées, les mentions
    traditionnelles, l’étiquetage et la présentation de certains produits du secteur
    vitivinicole
  type: main
- language: de
  script: Latn
