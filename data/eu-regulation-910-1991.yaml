    di carni bovine detenute da taluni organismi d'' intervento e destinate all''
    esportazione in Brasile e recante modifica del regolamento (CEE) n. 569/88 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 910/91 VAN DE COMMISSIE van 11 april 1991 betreffende
