title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 910/91 of 11 April 1991 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export to Brazil and amending Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CEE) No 910/91 DE LA COMMISSION du 11 avril 1991 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) no 2539/84,
    de viandes bovines détenues par certains organismes d' intervention et destinées
    à être exportées vers le Brésil et modifiant le règlement (CEE) no 569/88
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 910/91 DER KOMMISSION vom 11. April 1991 über den
    Verkauf von zur Ausfuhr nach Brasilien bestimmtem Rindfleisch aus Interventionsbeständen
    nach der Verordnung (EWG) Nr. 2539/84 und zur Änderung der Verordnung (EWG) Nr.
    569/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 910/91 af 11. april 1991 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på eksport til Brasilien og om ændring af forordning (EØF) nr.
    569/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. αριθ. 910/91 της Επιτροπής
    της 11ης Απριλίου 1991 σχετικά με την πώληση, βάσει
    διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που κατέχεται
    από ορισμένους οργανισμούς παρεμβάσεως και
    προορίζεται να εξαχθεί προς τη Βραζιλία και
    για τροποποίηση του κανονισμού (ΕΟΚ) αριθ. 569/88
  type: main
- language: it
  script: Latn
