id: EURegulation4161980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 416/80 of 21 February 1980 re-establishing
    the levying of customs duties on umbrellas and sunshades, etc., falling within
    heading No 66.01 and originating in Hong Kong, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 416/80 de la Commission, du 21 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, etc., de la position 66.01 du tarif douanier commun, originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 416/80 der Kommission vom 21. Februar 1980 zur Wiedereinführung
    des Zollsatzes für Regenschirme, Sonnenschirme und dergleichen der Tarifnummer
    66.01, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2789/79 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 416/80 af 21. februar 1980 om genindførelse
    af opkrævning af toldafgifter for paraplyer og parasoller etc., under position
    66.01, som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 416/80 della Commissione, del 21 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia
    e da sole), ecc., della voce n. 66.01 della tariffa doganale comune, originari
    di Hong Kong beneciaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 416/80 van de Commissie van 21 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op paraplu'
    s, parasols, enz., van post 66.01, van oorsprong uit Hong-Kong, ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
