title:
- language: en
  script: Latn
  content: '98/173/EC: Commission Decision of 17 February 1998 amending Decision 95/232/EC
    on the organisation of a temporary experiment under Council Directive 69/208/EEC
    in order to establish conditions to be satisfied by the seed of hybrids and varietal
    associations of swede rape and turnip rape'
  type: main
- language: fr
  script: Latn
  content: '98/173/CE: Décision de la Commission du 17 février 1998 modifiant la
    décision 95/232/CE concernant l''organisation d''un essai temporaire en vertu
    de la directive 69/208/CEE du Conseil en vue de fixer les conditions auxquelles
    doivent satisfaire les semences d''hybrides et d''associations variétales de
    colza et de navette'
  type: main
- language: de
  script: Latn
  content: '98/173/EG: Entscheidung der Kommission vom 17. Februar 1998 zur Änderung
    der Entscheidung 95/232/EG zur Durchführung eines befristeten Versuchs gemäß
    der Richtlinie 69/208/EWG des Rates zwecks Festlegung der Anforderungen an Saatgut
    von Raps- und Rübsen-Hybriden und Verbundsorten dieser Arten'
  type: main
- language: da
  script: Latn
  content: '98/173/EF: Kommissionens beslutning af 17. februar 1998 om ændring af
    Kommissionens beslutning 95/232/EF om gennemførelse af et tidsbegrænset forsøg
    i henhold til Rådets direktiv 69/208/EØF for at fastsætte de betingelser, som
    frø af hybrider og af sammensatte sorter af raps og rybs skal opfylde'
  type: main
- language: el
  script: Grek
  content: '98/173/ΕΚ: Απόφαση της Επιτροπής της 17ης Φεβρουαρίου
    1998 για τροποποίηση της απόφασης 95/232/ΕΚ για
    τη διοργάνωση προσωρινών δοκιμασιών δυνάμει
    της οδηγίας 69/208/ΕΟΚ του Συμβουλίου προκειμένου
    να καθοριστούν οι όροι που πρέπει να πληρούνται
    από τους σπόρους υβριδίων και συνδυασμό ποικιλιών
    ελαιοκράμβης και γογγυλοκράμβης'
  type: main
- language: fi
  script: Latn
  content: '98/173/EY: Komission päätös, tehty 17 päivänä helmikuuta 1998, määräaikaisen
    kokeen järjestämisestä neuvoston direktiivin 69/208/ETY mukaisesti rapsi- ja
    rypsihybridien ja lajikeseosten siementen laatua koskevien vaatimusten vahvistamiseksi
    tehdyn komission päätöksen 95/232/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '98/173/CE: Decisione della Commissione del 17 febbraio 1998 che modifica
    la decisione 95/232/CE concernente l''organizzazione di un esperimento temporaneo
    a norma della direttiva 69/208/CE del Consiglio, inteso alla determinazione delle
    condizioni cui devono soddisfare le sementi di ibridi e di associazioni varietali
    di colza e di ravizzone'
  type: main
- language: nl
  script: Latn
  content: '98/173/EG: Beschikking van de Commissie van 17 februari 1998 tot wijziging
    van Beschikking 95/232/EG betreffende het opzetten van een tijdelijk experiment
    in het kader van Richtlijn 69/208/EEG van de Raad teneinde de voorwaarden vast
    te stellen waaraan zaad van hybriden en van mengrassen van kool- en van raapzaad
    moet voldoen'
  type: main
- language: pt
  script: Latn
  content: '98/173/CE: Decisão da Comissão de 17 de Fevereiro de 1998 que altera
