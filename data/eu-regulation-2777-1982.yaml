title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2777/82 of 18 October 1982 re-establishing
    the levying of customs duties on sodium dichromate falling within subheading 28.47
    B ex II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 applyn
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2777/82 de la Commission, du 18 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables au dichromate
    de sodium de la sous-position 28.47 B ex II du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseili
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2777/82 der Kommission vom 18. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für Natriumdichromat der Tarifstelle 28.47 B ex II, mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2777/82 af 18. oktober 1982 om genindførelse
    af opkrævning af told for natriumdichromat henhørende under pos. 28.47 B ex
    II og med oprindelse i Rumænien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2777/82 τής Επιτροπής
    τής 18ης Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά διχρωμικά τού νατρίου,
    τής διακρίσεως 28. 47 Β ex II τού Κοινού Δασμολογίου,
    καταγωγής Ρουμανίας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2777/82 della Commissione, del 18 ottobre 1982, che
    ripristina la riscossione dei dazi doganali applicabili al dicromato di sodio,
    della sottovoce 28.47 B ex II della tariffa doganale comune, originario della
    Romania, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3601/81 del Consiglioo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2777/82 van de Commissie van 18 oktober 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op natriumdichromaat
    van postonderverdeling 28.47 B ex II, van oorsprong uit Roemenië, waarvoor de
    in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn
    verleend
