    üvegházhatású gázokról szóló (EU) 2024/573 európai parlamenti és tanácsi
    rendelet 14. cikke szerinti – a 2022-ben ilyen anyagokat előállító gyártók
    közötti – kiosztásáról (az értesítés a C(2024) 5212. számú dokumentummal
    történt)
  type: main
