    standartiem mājsaimniecības ierīcēm ēdiena gatavošanai ar gāzes liesmu,
    gāzes degļu un gāzes iekārtu drošuma un vadības ierīcēm, liesmas kontroles
    termoelektriskajām ierīcēm, gāzes apkures katliem un automātiskajiem ventilācijas
    vārstiem gāzes degļiem un gāzes iekārtām
  type: main
- language: lt
