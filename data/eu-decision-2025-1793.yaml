    normy pre varné spotrebiče na plynné palivá pre domácnosť, bezpečnostné
    a ovládacie zariadenia horákov a spotrebičov na plynné palivá, zariadenia
    s termoelektrickou poistkou plameňa, kotly na plynné palivá na ústredné vykurovanie
    a automatické odvzdušňovacie ventily pre horáky a spotrebiče na plynné palivá
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/1793 z dne 10. septembra 2025 o spremembi
    Izvedbenega sklepa (EU) 2024/2944 glede harmoniziranih standardov za gospodinjske
    aparate za kuhanje na plin, varnostne in krmilne naprave za plinske gorilnike
    in plinske aparate, termoelektrična varovala za nadzor plamena, plinske kotle
    za centralno ogrevanje in avtomatske varnostno izpustne ventile za plinske gorilnike
    in plinske aparate
  type: main
