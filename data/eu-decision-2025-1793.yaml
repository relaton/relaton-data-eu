    dujinių prietaisų saugos ir valdymo įtaisų, termoelektrinių liepsnos kontrolės
    įtaisų, dujinių centrinio šildymo katilų ir dujų degiklių ir dujinių prietaisų
    automatinių išleidimo vožtuvų darniųjų standartų iš dalies keičiamas
