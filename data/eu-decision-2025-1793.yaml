    normen voor huishoudelijke gaskooktoestellen, drukregelaars en bijbehorende veiligheidsvoorzieningen
    voor gasverbruikstoestellen, vlambeveiligingsinrichtingen, met gas gestookte centrale-verwarmingsketels
