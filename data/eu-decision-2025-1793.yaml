    que respecta a las normas armonizadas sobre los aparatos domésticos de cocción
    que utilizan combustibles gaseosos, los dispositivos de seguridad y de control
    para quemadores y aparatos que utilizan gas como combustible, los dispositivos
    termoeléctricos de vigilancia de llama, las calderas de calefacción central
    que utilizan combustibles gaseosos y las válvulas automáticas de ventilación
    para quemadores y aparatos que utilizan gas como combustible
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2025/1793 av den 10 september 2025
    om ändring av genomförandebeslut (EU) 2024/2944 vad gäller harmoniserade standarder
    för gasspisar, säkerhets- och kontrollanordningar för gasbrännare och gasbrännartillbehör,
    termoelektriska flamövervakningsanordningar, gaseldade värmepannor samt automatiska
    avluftningsventiler för gasbrännare och gasbrännartillbehör
