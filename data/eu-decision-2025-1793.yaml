    le caighdeáin chomhchuibhithe maidir le fearais chócaireachta tí a dhónn gás,
    feistí sábháilteachta agus rialaithe le haghaidh dóirí gáis agus fearas
    a dhónn gás, gairis maoirseachta lasrach theirmileictreacha, coirí téimh lárnaigh
    gásadhainte agus comhlaí gaothaire uathoibríocha le haghaidh dóirí gáis
    agus fearas a dhónn gás
  type: main
