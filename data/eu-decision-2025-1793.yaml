  script: Latn
  content: Decisione di esecuzione (UE) 2025/1793 della Commissione, del 10 settembre
    2025, che modifica la decisione di esecuzione (UE) 2024/2944 per quanto riguarda
    le norme armonizzate per apparecchi di cottura a gas per uso domestico, regolatori
    di pressione e dispositivi di sicurezza associata per apparecchi a gas, dispositivi
    termoelettrici di sicurezza all’accensione e allo spegnimento, caldaie per riscaldamento
    a gas e valvole automatiche di sfiato per bruciatori a gas e apparecchi a gas
  type: main
- language: lv
