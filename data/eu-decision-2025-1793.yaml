    privește standardele armonizate pentru aparatele de gătit casnice care utilizează
    combustibili gazoși, dispozitivele de comandă și de securitate pentru arzătoare
    cu gaz și aparate care utilizează combustibili gazoşi, dispozitivele termoelectrice
    de supraveghere a flăcării, cazanele de încălzire centrală care utilizează
    combustibili gazoşi și robinetele de ventilație automate pentru arzătoare
    cu gaz și aparate care utilizează combustibili gazoși
  type: main
