    normas harmonizadas aplicáveis aos aparelhos domésticos para preparação de
    alimentos que utilizam os combustíveis gasosos, aos dispositivos de controlo
    e segurança para queimadores a gás e aparelhos que utilizam combustíveis gasosos,
