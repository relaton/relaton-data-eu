title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/1793 of 10 September 2025 amending
    Implementing Decision (EU) 2024/2944 as regards harmonised standards for domestic
    cooking appliances burning gas, safety and control devices for gas burners and
    gas burning appliances, thermoelectric flame supervision devices, gas-fired central
    heating boilers and automatic vent valves for gas burners and gas burning appliances
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/1793 de la Commission du 10 septembre
    2025 modifiant la décision d’exécution (UE) 2024/2944 en ce qui concerne les
    normes harmonisées relatives aux appareils de cuisson domestiques utilisant les
    combustibles gazeux, aux dispositifs de sécurité et de contrôle pour les brûleurs
    à gaz et appareils utilisant des combustibles gazeux, aux dispositifs thermoélectriques
    de surveillance de flamme, aux chaudières de chauffage central utilisant les
    combustibles gazeux et aux robinets d’évent automatiques pour brûleurs à
    gaz et appareils à gaz
  type: main
- language: de
  script: Latn
