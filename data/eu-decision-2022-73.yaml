    accordée à la Hongrie d’appliquer pour une nouvelle période la mesure particulière
    dérogatoire à l’article 287 de la directive 2006/112/CE relative au système
    commun de taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
