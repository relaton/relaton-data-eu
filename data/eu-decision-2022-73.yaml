    concedida à Hungria para aplicar, por um novo período, a medida especial em
    derrogação ao artigo 287.o da Diretiva 2006/112/CE relativa ao sistema comum
    do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
