    Maďarsko uplatňovalo na ďalšie obdobie osobitné opatrenie odchyľujúce sa
    od článku 287 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2022/73 z dne 18. januarja 2022 o spremembi
