    privește autorizarea Ungariei de a aplica în continuare măsura specială de
    derogare de la articolul 287 din Directiva 2006/112/CE privind sistemul comun
    al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2022/73 z 18. januára 2022, ktorým
