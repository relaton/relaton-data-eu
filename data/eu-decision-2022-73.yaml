  script: Latn
  content: Council Implementing Decision (EU) 2022/73 of 18 January 2022 amending
    Implementing Decision (EU) 2018/1490 as regards authorisation to Hungary to apply
    for a further period the special measure derogating from Article 287 of Directive
    2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
