    landbrugselementer og tillægstolden, for perioden 1. juli til 31. december 1999
    inklusive, for indførsel til Fællesskabet af varer henhørende under Rådets
    forordning (EF) nr. 3448/93 inden for rammerne af aftalerne med Estland, med Letland
    og med Litauen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2185/1999 της Επιτροπής,
    της 14ης Οκτωβρίου 1999, περί τροποποιήσεως του
    κανονισμού (ΕΚ) αριθ. 1407/1999 σχετικά με τον προσδιορισμό
    του ύψους των μειωμένων γεωργικών συνιστωσών
    καθώς και των πρόσθετων δασμών που ισχύουν
    για το χρονικό διάστημα από 1ης Ιουλίου έως
    και 31 Δεκεμβρίου 1999 προκειμένου για τις προς
