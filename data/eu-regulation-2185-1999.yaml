  script: Latn
  content: Reglamento (CE) n° 2185/1999 de la Comisión, de 14 de octubre de 1999,
    que modifica el Reglamento (CE) n° 1407/1999 por el que se determina el importe
    de los elementos agrícolas y de los derechos adicionales aplicables, durante
