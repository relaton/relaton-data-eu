  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2185/1999, annettu 14 päivänä lokakuuta 1999,
    neuvoston asetuksessa (EY) N:o 3448/93 mainittujen tuotteiden yhteisöön kohdistuvaan
    tuontiin 1 päivän heinäkuuta ja 31 päivän joulukuuta 1999 välisenä aikana
    Viron tasavallan, Latvian tasavallan ja Liettuan tasavallan kanssa tehtyjen sopimusten
