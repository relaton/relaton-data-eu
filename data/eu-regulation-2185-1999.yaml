title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2185/1999 of 14 October 1999 amending Regulation
    (EC) No 1407/1999 laying down the reduced agricultural components and additional
    duties applicable from 1 July to 31 December 1999 to the importation into the
    Community of goods covered by Council Regulation (EC) No 3448/93 under Agreements
    with Estonia, Latvia and Lithuania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2185/1999 de la Commission, du 14 octobre 1999, modifiant
    le règlement (CE) n° 1407/1999 déterminant les montants des éléments agricoles
    réduits ainsi que les droits additionnels applicables du 1er juillet au 31 décembre
    1999 inclus à l'importation dans la Communauté des marchandises relevant du
    règlement (CE) n° 3448/93 du Conseil dans le cadre des accords avec l'Estonie,
    la Lettonie et la Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2185/1999 der Kommission vom 14. Oktober 1999 zur Änderung
    der Verordnung (EG) Nr. 1407/1999 zur Festsetzung der Höhe der ermäßigten Agrarteilbeträge
    und Zusatzzölle, die vom 1. Juli bis 31. Dezember 1999 bei der Einfuhr der unter
    die Verordnung (EG) Nr. 3448/93 des Rates fallenden Waren in die Gemeinschaft
    im Rahmen der Abkommen mit Estland, Lettland und Litauen anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2185/1999 af 14. oktober 1999 om ændring
