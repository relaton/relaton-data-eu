  content: Council Decision (EU) 2023/2856 of 7 December 2023 on the position to be
    taken on behalf of the European Union within the Cooperation Committee meeting
    in trade configuration established by the Enhanced Partnership and Cooperation
    Agreement between the European Union and its Member States, of the one part, and
    the Republic of Kazakhstan, of the other part, as regards the establishment of
    a list of 15 individuals who are willing and able to serve as arbitrators in dispute
    settlement proceedings
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2856 du Conseil du 7 décembre 2023 relative à la
    position à prendre au nom de l’Union européenne au sein du comité de coopération
    se réunissant dans sa configuration Commerce institué par l’accord de partenariat
    et de coopération renforcé entre l’Union européenne et ses États membres,
    d’une part, et la République du Kazakhstan, d’autre part, en ce qui concerne
    l’établissement d’une liste de quinze personnes qui sont disposées et aptes
    à exercer les fonctions d’arbitre dans les procédures de règlement des différends
  type: main
