title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2905/93 of 20 October 1993 re-establishing
    the levying of customs duties on products of category 41 (order No 40.0410), originating
    in India, Indonesia, Malaysia and Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2905/93 de la Commission du 20 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 41 (numéro d'ordre 40.0410) originaires d'Inde, d'Indonésie,
    de Malaysia et de Thaïlande, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2905/93 DER KOMMISSION vom 20. Oktober 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 41 (laufende Nummer 40.0410) mit Ursprung
    in Indien, Indonesien, Malaysia und Thailand, für die die in der Verordnung (EWG)
    Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2905/93 af 20. oktober 1993 om genindførelse
