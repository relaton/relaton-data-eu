    van categorie 41 (volgnummer 40.0410), van oorsprong uit India, Indonesië, Maleisië
    en Thailand, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3832/90 van de Raad
  type: main
