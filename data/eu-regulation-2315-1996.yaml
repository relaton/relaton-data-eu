---
id: EURegulation23151996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2315/96 of 25 November 1996 establishing, pursuant
    to Article 1 (7) of Regulation (EEC) 3030/93, the list of textiles and clothing
    products to be integrated into GATT 1994 on 1 January 1998 and amending Annex
    X to Regulation (EEC) No 3030/93 and Annex II to Regulation (EC) No 3285/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2315/96 du Conseil du 25 novembre 1996 établissant,
    conformément à l'article 1er paragraphe 7 du règlement (CEE) n° 3030/93, la
    liste des produits textiles et des vêtements à intégrer, au 1er janvier 1998,
    dans le cadre du GATT 1994 et modifiant l'annexe X du règlement (CEE) n° 3030/93
    et l'annexe II du règlement (CE) n° 3285/94
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2315/96 des Rates vom 25. November 1996 über die gemäß
    Artikel 1 Absatz 7 der Verordnung (EWG) Nr. 3030/93 am 1. Januar 1998 in das GATT
    1994 einzubeziehenden Textil- und Bekleidungswaren und zur Änderung des Anhangs
    X der Verordnung (EWG) Nr. 3030/93 und des Anhangs II der Verordnung (EG) Nr.
    3285/94
  type: main
- language: bg
  script: Cyrl
  content: Регламент (СЕ) № 2315/96 на Съвета от 25 ноември
    1996 година за утвърждаване, съгласно член 1,
    параграф 7 от Регламент (ЕИО) № 3030/93, на списъка
    на текстилните продукти и облекла, които от
    1 януари 1998 година се включват в рамките на
    ГАТТ 1994, и за изменение на приложение Х към
    Регламент (ЕИО) № 3030/93 и приложение II към Регламент
    (ЕО) № 3285/94
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2315/96 ze dne 25. listopadu 1996, kterým se
    na základě čl. 1 odst. 7 nařízení (EHS) č. 3030/93 stanoví seznam textilních
    a oděvních výrobků, které mají být ke dni 1. ledna 1998 začleněny do
    rámce GATT 1994, a kterým se mění příloha X nařízení (EHS) č. 3030/93
    a příloha II nařízení (ES) č. 3285/94
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 2315/96 af 25. november 1996 om opstilling
    i henhold til artikel 1, stk. 7, i forordning (EØF) nr. 3030/93 af listen over
    tekstilvarer og beklædningsgenstande, der skal integreres i GATT 1994 pr. 1.
    januar 1998, og om ændring af bilag X til forordning (EØF) nr. 3030/93 og bilag
    II til forordning (EF) nr. 3285/94
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2315/96 του Συμβουλίου
    της 25ης Νοεμβρίου 1996 για την κατάρτιση, σύμφωνα
    με το άρθρο 1 παράγραφος 7 του κανονισμού (ΕΟΚ)
    αριθ. 3030/93, του καταλόγου των κλωστοϋφαντουργικών
    προϊόντων και των ειδών ένδυσης που πρόκειται
    να ενσωματωθούν την 1η Ιανουαρίου 1998 στη ΓΣΔΕ
    1994 και για τροποποίηση του παραρτήματος Χ του
    κανονισμού (ΕΟΚ) αριθ. 3030/93 και του παραρτήματος
    ΙΙ του κανονισμού (ΕΚ) αριθ. 3285/94
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2315/96, 25. november 1996, millega kehtestatakse
    määruse (EMÜ) nr 3030/93 artikli 1 lõike 7 alusel tekstiil- ja rõivatoodete
    nimekiri, mille suhtes kohaldatakse 1. jaanuarist 1998 GATT 1994 tavaeeskirju,
    ja muudetakse määruse (EMÜ) nr 3030/93 X lisa ning määruse (EÜ) nr 3285/94
    II lisa
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2315/96, annettu 25 päivänä marraskuuta 1996,
    asetuksen (ETY) N:o 3030/93 1 artiklan 7 kohdan mukaisesti 1 päivänä tammikuuta
    1998 vuoden 1994 GATT-sopimukseen sisällytettävien tekstiili- ja vaatetustuotteiden
    luettelon vahvistamisesta sekä asetuksen (ETY) N:o 3030/93 liitteen X ja asetuksen
    (EY) N:o 3285/94 liitteen II muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 2315/96 od 25. studenoga 1996. o utvrđivanju popisa
    tekstilnih proizvoda i odjevnih predmeta u skladu s člankom 1. stavkom 7. Uredbe
    (EEZ) 3030/93, koji se od 1. siječnja 1998. treba uključiti u GATT iz 1994.
    i o izmjeni Priloga X. Uredbi (EEZ) br. 3030/93 i Priloga II. Uredbi (EZ) br.
    3285/94
  type: main
- language: hu
  script: Latn
  content: A Tanács 2315/96/EK rendelete (1996. november 25.) a 3030/93/EGK rendelet
    1. cikkének (7) bekezdése értelmében a textil- és ruházati termékeknek
    az 1994. évi Általános Vám- és Kereskedelmi Egyezménybe 1998. január 1-jén
    beépítendő jegyzékének létrehozásáról, valamint a 3030/93/EGK rendelet
    X. mellékletének és a 3285/94/EK rendelet II. mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2315/96 del Consiglio del 25 novembre 1996 che stabilisce,
    a norma dell'articolo 1, paragrafo 7 del regolamento (CEE) n. 3030/93, l'elenco
    dei prodotti tessili e dell'abbigliamento da integrare, il 1° gennaio 1998, nel
    quadro del GATT 1994 e che modifica l'allegato X del regolamento (CEE) n. 3030/93
    e l'allegato II del regolamento (CE) n. 3285/94
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2315/96 (1996. gada 25. novembris), ar ko atbilstīgi
    Regulas (EEK) Nr. 3030/93 1. panta 7. punktam izveido to tekstilizstrādājumu
    un apģērbu sarakstu, uz kuriem no 1998. gada 1. janvāra attiecināma Vispārējā
    vienošanās par tarifiem un tirdzniecību (VVTT 1994), un ar ko groza Regulas
    (EEK) Nr. 3030/93 X pielikumu un Regulas (EK) Nr. 3285/94 II pielikumu
  type: main
- language: lt
  script: Latn
  content: 1996 m. lapkričio 25 d. Tarybos reglamentas (EB) Nr. 2315/96 nustatantis
    tekstilės ir aprangos gaminių, kuriems, vadovaujantis Reglamento (EEB) Nr. 3030/93
    1 straipsnio 7 dalimi, nuo 1998 m. sausio 1 d. taikomas 1994 m. GATT, sąrašą
    ir iš dalies keičiantis Reglamento (EEB) Nr. 3030/93 X priedą bei Reglamento
    (EB) Nr. 3285/94 II priedą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2315/96 tal-25 ta' Novembru 1996 li
    jistabilixxi, skond l-Artikolu 1(7) tar-Regolament (KEE) 3030/93, l-elenku ta'
    tessuti u prodotti tal-ilbies li għandhom jiġu integrati fil-GATT 1994 fl-1
    ta' Jannar 1998 u li jemenda l-Anness X tar-Regolament (KEE) Nru 3030/93 u l-Anness
    II tar-Regolament (KE) Nru 3285/94
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2315/96 van de Raad van 25 november 1996 tot vaststelling,
    overeenkomstig artikel 1, lid 7, van Verordening (EEG) nr. 3030/93 van de Raad,
    van de lijst van textiel- en kledingprodukten die op 1 januari 1998 in GATT 1994
    dienen te worden geïntegreerd en tot wijziging van bijlage X bij Verordening
    (EEG) nr. 3030/93 en van bijlage II bij Verordening (EG) nr. 3285/94
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2315/96 z dnia 25 listopada 1996 r. ustanawiające
    na podstawie art. 1 ust. 7 rozporządzenia (EWG) 3030/93 wykaz wyrobów włókienniczych
    i odzieżowych, które mają zostać włączone do GATT 1994 dnia 1 stycznia 1998
    r. oraz zmieniające załącznik X do rozporządzenia (EWG) nr 3030/93 i załącznik
    II rozporządzenia (WE) nr 3285/94
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2315/96 do Conselho de 25 de Novembro de 1996 que
    estabelece, em conformidade com o nº 7 do artigo 1º do Regulamento (CEE) nº
    3030/93, a lista dos produtos têxteis e do vestuário a integrar, em 1 de Janeiro
    de 1998, no GATT de 1994 e que altera o anexo X do Regulamento (CEE) nº 3030/93
    e o anexo II do Regulamento (CE) nº 3285/94
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2315/96 al Consiliului din 25 noiembrie 1996 de stabilire,
    în temeiul articolului 1 alineatul (7) din Regulamentul (CEE) nr. 3030/93, a
    listei produselor textile și confecțiilor ce urmează a fi integrate în GATT
    1994 la 1 ianuarie 1998 și de modificare a anexei X la Regulamentul (CEE) nr.
    3030/93 și a anexei II la Regulamentul (CE) nr. 3285/94
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2315/96 z 25. novembra 1996, ktorým sa podľa
    článku 1 ods. 7 nariadenia (EHS) č. 3030/93 stanovuje zoznam textilných a
    odevných výrobkov, ktoré sa k 1. januáru 1998 zaradia do GATT 1994, a ktorým
    sa mení a dopĺňa príloha X k nariadeniu (EHS) č. 3030/93 a príloha II k
    nariadeniu (ES) č. 3285/94
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2315/96 z dne 25. novembra 1996 o oblikovanju, na
    podlagi člena 1(7) Uredbe (EGS) 3030/93, seznama tekstilnih izdelkov in oblačil,
    ki jih je dne 1. januarja 1998 treba vključiti v GATT 1994 in spremembi Priloge
    X k Uredbi (EGS) št. 3030/93 ter Priloge II k Uredbi (ES) št. 3285/94
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2315/96 del Consejo de 25 de noviembre de 1996 por
    el que, de conformidad con el apartado 7 del artículo 1 del Reglamento (CEE)
    nº 3030/93, se establece la lista de los productos textiles y de la confección
    que deben integrarse el 1 de enero de 1998 en el GATT de 1994, y por el que se
    modifican el Anexo X del Reglamento (CEE) nº 3030/93 y el Anexo II del Reglamento
    (CE) nº 3285/94
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2315/96 av den 25 november 1996 om fastställande
    enligt artikel 1.7 i rådets förordning (EEG) nr 3030/93 av den förteckning
    över textil- och konfektionsprodukter som den 1 januari 1998 skall införlivas
    inom ramen för GATT 1994, och om ändring av bilaga X till förordning (EEG)
    nr 3030/93 och bilaga II till rådets förordning (EG) nr 3285/94
  type: main
