title:
- language: en
  script: Latn
  content: '95/126/EC: Commission Decision of 6 April 1995 concerning the evaluation
    of 71 proposed measures which qualify for Community financing pursuant to Council
    Decision 94/445/EC on inter-administration telematic networks for statistics relating
    to the trading of goods between Member States (Edicom)'
  type: main
- language: fr
  script: Latn
  content: '95/126/CE: Décision de la Commission, du 6 avril 1995, portant approbation
    de soixante et onze propositions d''actions susceptibles de bénéficier d''un
    financement communautaire au titre de la décision 94/445/CE du Conseil, relative
    aux réseaux télématiques entre administrations pour les statistiques des échanges
    de biens entre États membres (Edicom)'
  type: main
- language: de
  script: Latn
