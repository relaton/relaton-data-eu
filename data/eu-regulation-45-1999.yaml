    kokkidiostaattien ja muiden lääkkeen kaltaisten aineiden ryhmään kuuluvien
    aineiden hyväksymisen peruuttamisen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 45/1999/EK rendelete (1999. január 11.) a takarmány-adalékanyagokról
