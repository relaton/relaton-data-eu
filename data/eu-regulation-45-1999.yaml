    środków farmaceutycznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) N.o 45/1999 da Comissão de 11 de Janeiro de 1999 que
    altera a Directiva 70/524/CEE do Conselho relativa aos aditivos na alimentação
    para animais no que se refere à revogação da autorização de determinados
    coccidiostáticos e outras substâncias medicamentosas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 45/1999 z 11. januára 1999, ktorým sa mení
