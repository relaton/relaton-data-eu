    povolení některých doplňkových látek náležejících do skupiny kokcidiostatik
    a dalších léčebných látek
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 45/1999 af 11. januar 1999 om ændring
    af Rådets direktiv 70/524/EØF om tilsætningsstoffer til foderstoffer, hvad
    angår tilbagekaldelse af tilladelsen for visse coccidiostatika og andre lægemidler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 45/1999 της Επιτροπής
    της 11ης Ιανουαρίου 1999 για την τροποποίηση της
    οδηγίας 70/524/ΕΟΚ του Συμβουλίου περί των πρόσθετων
    υλών στη διατροφή των ζώων όσον αφορά την αφαίρεση
