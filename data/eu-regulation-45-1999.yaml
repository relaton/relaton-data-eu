  script: Latn
  content: Commission Regulation (EC) No 45/1999 of 11 January 1999 amending Council
    Directive 70/524/EEC concerning additives in feedingstuffs as regards withdrawal
    of the authorisation of certain additives belonging to the group of coccidiostats
    and other medicinal substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 45/1999 de la Commission du 11 janvier 1999 modifiant
    la directive 70/524/CEE du Conseil concernant les additifs dans l'alimentation
    des animaux en ce qui concerne le retrait de l'autorisation de certains additifs
    appartenant au groupe des coccidiostatiques et autres substances médicamenteuses
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 45/1999 der Kommission vom 11. Januar 1999 zur Änderung
    der Richtlinie 70/524/EWG des Rates über Zusatzstoffe in der Tierernährung hinsichtlich
    des Widerrufs der Zulassung bestimmter Zusatzstoffe der Gruppe Coccidiostatika
    und andere Arzneimittel
  type: main
- language: cs
  script: Latn
