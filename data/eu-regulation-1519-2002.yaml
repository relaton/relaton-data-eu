title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1519/2002 of 23 August 2002 derogating from
    Council Regulation (EC) No 1251/1999 establishing a support system for producers
    of certain arable crops, as regards the area payments for certain arable crops
    and the payments for set-aside for the 2002/2003 marketing year to producers in
    certain regions of Italy
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1519/2002 de la Commission du 23 août 2002 dérogeant
    au règlement (CE) n° 1251/1999 du Conseil instituant un régime de soutien aux
    producteurs de certaines cultures arables, en ce qui concerne les paiements à
    la surface pour certaines cultures arables et les paiements au titre de gel de
    terre pour la campagne de commercialisation 2002/2003 aux producteurs de certaines
    régions de l'Italie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1519/2002 der Kommission vom 23. August 2002 zur Abweichung
    von der Verordnung (EG) Nr. 1251/1999 des Rates zur Einführung einer Stützungsregelung
    für Erzeuger bestimmter landwirtschaftlicher Kulturpflanzen hinsichtlich der
    Flächenzahlungen für bestimmte Kulturpflanzen und der Stilllegungsausgleichszahlungen
    für das Wirtschaftsjahr 2002/03 an die Erzeuger in bestimmten Regionen Italiens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1519/2002 af 23. august 2002 om undtagelse
    fra Rådets forordning (EF) nr. 1251/1999 om indførelse af en støtteordning
    for producenter af visse markafgrøder for så vidt angår arealbetalingen for
    visse markafgrøder og betalingen for jordudtagning i produktionsåret 2002/03
    til producenterne i visse regioner i Italien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1519/2002 της Επιτροπής,
    της 23ης Αυγούστου 2002, περί παρεκκλίσεως από
    τον κανονισμό (ΕΚ) αριθ. 1251/1999 του Συμβουλίου,
    για τη θέσπιση καθεστώτος στήριξης των παραγωγών
    ορισμένων αροτραίων καλλιεργειών, όσον αφορά
    τις πληρωμές βάσει της έκτασης για ορισμένες
    αροτραίες καλλιέργειες και τις πληρωμές βάσει
    προσωρινής παύσης της καλλιέργειας για την
    περίοδο εμπορίας 2002/03 στους παραγωγούς ορισμένων
    περιοχών της Ιταλίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1519/2002, annettu 23 päivänä elokuuta 2002,
    tukijärjestelmästä tiettyjen peltokasvien viljelijöille annetusta neuvoston
    asetuksesta (EY) N:o 1251/1999 poikkeamisesta joidenkin alueiden viljelijöille
    Italiassa markkinointivuodelta 2002—2003 maksettavan eräiden peltokasvien pinta-alatuen
    sekä kesantokorvauksen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1519/2002 della Commissione, del 23 agosto 2002, recante
    deroga al regolamento (CE) n. 1251/1999 del Consiglio, che istituisce un regime
    di sostegno a favore dei coltivatori di taluni seminativi, per quanto riguarda
    i pagamenti per superficie per determinati seminativi e i pagamenti per il ritiro
    dei terreni dalla produzione per la campagna di commercializzazione 2002/03 ai
    produttori di talune regioni d'Italia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1519/2002 van de Commissie van 23 augustus 2002 houdende
    afwĳking van Verordening (EG) nr. 1251/1999 van de Raad tot instelling van een
    steunregeling voor producenten van bepaalde akkerbouwgewassen, ten aanzien van
    de areaalbetalingen voor bepaalde akkerbouwgewassen en van de betalingen voor
    braaklegging voor het verkoopseizoen 2002/2003 ten behoeve van de producenten
    in bepaalde Italiaanse regio's
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1519/2002 da Comissão, de 23 de Agosto de 2002,
    que estabelece uma derrogação do Regulamento (CE) n.° 1251/1999 do Conselho
    que institui um sistema de apoio aos produtores de determinadas culturas arvenses,
    no que diz respeito aos pagamentos por superfície para certas culturas arvenses
    e aos pagamentos por retirada de terras da produção para a campanha de comercialização
    de 2002/2003 aos produtores de certas regiões de Itália
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1519/2002 de la Comisión, de 23 de agosto de 2002,
    que establece una excepción al Reglamento (CE) n° 1251/1999 del Consejo, por
    el que se establece un régimen de apoyo a los productores de determinados cultivos
    herbáceos, en lo relativo a los pagos por superficie para determinados cultivos
    herbáceos y los pagos en concepto de retirada de tierras para la campaña de
    comercialización 2002/03 a los productores de determinadas regiones de Italia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1519/2002 av den 23 augusti 2002 om undantag
    från rådets förordning (EG) nr 1251/1999 om upprättande av ett stödsystem
    för producenter av vissa jordbruksgrödor, när det gäller arealersättning
    för vissa jordbruksgrödor och ersättning för arealuttag under regleringsåret
    2002/2003 till producenter i vissa regioner i Italien
  type: main
