title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2215/83 of 2 August 1983 re-establishing
    the levying of customs duties on men' s and boys' woven suits, products of category
    16 (code 0160) and originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2215/83 de la Commission du 2 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux costumes et complets, tissés,
    de la catégorie de produits 16 (code 0160), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2215/83 der Kommission vom 2. August 1983 über die
    Wiedereinführung des Zollsatzes für Anzüge und Kombinationen der Warenkategorie
    Nr. 16 (Kennziffer 0160), mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2215/83 af 2. august 1983 om genindførelse
    af opkrævning af toldafgifter for jakkesæt, vævede, til mænd og drenge under
    kategori nr. 16 (kode 0160), som har oprindelse i Thailand og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2215/83 της Επιτροπής
    της 2ας Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για κοστούμια
    και σύνολα, υφασμένα, προϊόντα της κατηγορίας
    16 (κωδικός 0160), καταγωγής Ταϋλάνδης, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2215/83 della Commissione del 2 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai vestiti e completi, tessuti, della
    categoria di prodotti n. 16 (codice 0160), originari della Tailandia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2215/83 van de Commissie van 2 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    kostuums van de categorie van produkten nr. 16 (codenummer 0160), van oorsprong
    uit Thailand, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3378/82 van de Raad
  type: main
