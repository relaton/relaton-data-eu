id: EURegulation15051980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1505/80 of 16 June 1980 re-establishing
    the levying of customs duties on made-up accessories for articles of apparel etc.,
    other than knitted or crocheted, products of category 88 (code 0880), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1505/80 de la Commission, du 16 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres accessoires
    confectionnés du vêtement, etc., autres qu' en bonneterie, de la catégorie
    88 (code 0880), originaires de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1505/80 der Kommission vom 16. Juni 1980 über die
    Wiedereinführung des Zollsatzes für anderes konfektioniertes Bekleidungszubehör,
    andere als aus Gewirken, der Warenkategorie Nr. 88 (Kennziffer 0880), mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1505/80 af 16. juni 1980 om genindførelse
    af opkrævning af toldafgifter for konfektioneret tilbehør til beklædningsgenstande,
    etc., ikke af trikotage, under kategori 88 (kode 0880), som har oprindelse i Indien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1505/80 della Commissione, del 16 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili a altri accessori confezionati
    per oggetti di vestiario, esclusi quelli a maglia, della categoria di prodotti
    n. 88 (codice 0880), originari dell' India beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1505/80 van de Commissie van 16 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander geconfectioneerd
    kledingtoebehoren enz., andere dan die van brei- of haakwerk, van de categorie
    van produkten nr. 88 (codenummer 0880), van oorsprong uit India waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
