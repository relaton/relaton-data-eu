title:
- language: en
  script: Latn
  content: '93/37/EEC: Commission Decision of 18 December 1992 amending Decision 91/28/EEC
    authorizing certain Member States to provide for exceptions from certain provisions
    of Directive 77/93/EEC in respect of potatoes for human consumption originating
    in Turkey (Only the German, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/37/CEE: Décision de la Commission, du 18 décembre 1992, modifiant
    la décision 91/28/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour les pommes
    de terre de consommation originaires de Turquie (Les textes en langues allemande,
    française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/37/EWG: Entscheidung der Kommission vom 18. Dezember 1992 zur Änderung
    der Entscheidung 91/28/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Speisekartoffeln mit Ursprung in der Türkei Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der deutsche, französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/37/EØF: Kommissionens beslutning af 18. december 1992 om ændring
    af beslutning 91/28/EØF om bemyndigelse af visse medlemmer til at fastsætte
    undtagelser fra visse bestemmelser i direktiv 77/93/EØF for spisekartofler med
    oprindelse i Tyrkiet (Kun den tyske, franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '93/37/ΕΟΚ: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1992 για την τροποποίηση της απόφασης 91/28/ΕΟΚ
    που επιτρέπει σε ορισμένα κράτη μέλη να προβλέπουν
    παρεκκλίσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ όσον αφορά τις πατάτες για ανθρώπινη
    κατανάλωση, καταγωγής Τουρκίας (Τα κείμενα
    στην γερμανική, γαλλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '93/37/CEE: Decisione della Commissione, del 18 dicembre 1992, recante
    modifica della decisione 91/28/CEE che autorizza taluni Stati membri a prevedere
    deroghe, per le patate da consumo originarie della Turchia, ad alcune disposizioni
    della direttiva 77/93/CEE (Il testi in lingua tedesca, francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '93/37/EEG: Beschikking van de Commissie van 18 december 1992 tot wijziging
    van Beschikking 91/28/EEG houdende machtiging van bepaalde Lid-Staten om, voor
    consumptieaardappelen van oorsprong uit Ru Turkije, afwijkingen van sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts de teksten in de Duitse,
    Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/37/CEE: Decisão da Comissão, de 18 de Dezembro de 1992, que altera
    a Decisão 91/28/CEE, que autoriza determinados Estados-membros a estabelecer
    derrogações de determinadas normas da Directiva 77/93/CEE do Conselho em relação
    à batata de consumo originária da Turquia (Apenas fazem fé os textos nas línguas
    alemã, francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '93/37/CEE: Decisión de la Comisión, de 18 de diciembre de 1992, por
    la que se modifica la Decisión 91/28/CEE por la que se autoriza a algunos Estados
    miembros para establecer excepciones a determinadas disposiciones de la Directiva
    77/93/CEE del Consejo con respecto a las patatas destinadas al consumo humano
    originarias de Turquía (Los textos en lenguas alemana, francesa y neerlandesa
    son los únicos auténticos)'
  type: main
