id: EURegulation23821975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2382/75 of the Commission of 17 September 1975 re-establishing
    the levying of customs duties on waste (including yarn waste and pulled or garnetted
    rags) of man-made fibres, falling within heading No 56.03, originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3048/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2382/75 de la Commission, du 17 septembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux déchets
    de fibres textiles synthétiques et artificielles, de la position tarifaire 56.03,
    originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3048/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2382/75 der Kommission vom 17. September 1975 über
    die Wiedereinführung des Zollsatzes für Abfälle von synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer 56.03 mit Ursprung in Jugoslawien, dem die in der
    Verordnung (EWG) Nr. 3048/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2382/75 af 17. september 1975 om genindførelse
    af opkrævning af toldafgifter for affald af kemofibre (herunder garnaffald og
    opkradsede klude), ikke kartet, kæmmet eller på anden måde beredt til spinding,
    under position 56.03, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3048/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2382/75 della Commissione, del 17 settembre 1975,
    che ripristina la riscossione dei dazi doganali applicabili ai cascami di fibre
    tessili sintetiche ed artificiali, della voce doganale 56.03, originari della
    Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3048/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2382/75 van de Commissie van 17 september 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op afval van
    synthetische of van kunstmatige vezels van post 56.03, van oorsprong uit Joegoslavië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3048/74 van de Raad van 2 december 1974
  type: main
