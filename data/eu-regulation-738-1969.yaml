  content: Règlement (CEE) n° 738/69 du Conseil, du 22 avril 1969, modifiant le
    règlement (CEE) n° 324/69 du Conseil, du 21 février 1969, autorisant l'Italie
    à appliquer des mesures particulières d'intervention sur le marché des oranges
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 738/69 des Rates vom 22. April 1969 zur Änderung
    der Verordnung (EWG) Nr. 324/69 des Rates vom 21. Februar 1969, mit der Italien
    ermächtigt wird, besondere Interventionsmaßnahmen auf dem Orangenmarkt anzuwenden
  type: main
- language: it
