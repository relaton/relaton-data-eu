    dėl biudžeto išteklių procentinės dalies, skirtos gamtos ir biologinės įvairovės
    išsaugojimo projektams, finansuojamiems veiksmų dotacijomis pagal Aplinkos paprogramę,
    padidinimo pagal Europos Parlamento ir Tarybos reglamento (ES) Nr. 1293/2013 dėl
    aplinkos ir klimato politikos programos (LIFE) įsteigimo ir kuriuo panaikinamas
    Reglamentas (EB) Nr. 614/2007 9 straipsnio 4 dalį
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2018/93 tas-16 ta' Novembru 2017
    dwar iż-żieda fil-perċentwal tar-riżorsi baġitarji allokati lill-proġetti
    appoġġati permezz ta' għotjiet ta' azzjoni taħt is-Sottoprogramm għall-Ambjent
    dedikat lill-proġetti li jappoġġaw il-konservazzjoni tan-natura u l-bijodiversità
    skont l-Artikolu 9(4) tar-Regolament (UE) Nru 1293/2013 tal-Parlament Ewropew
    u tal-Kunsill dwar l-istabbiliment ta' Programm għall-Ambjent u l-Azzjoni Klimatika
    (LIFE) u li jħassar ir-Regolament (KE) Nru 614/2007
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2018/93 van de Commissie van 16 november
