    a los proyectos apoyados por subvenciones para actividades concretas del subprograma
    de Medio Ambiente dedicado a proyectos de apoyo a la conservación de la naturaleza
    y la biodiversidad de conformidad con el artículo 9, apartado 4, del Reglamento
    (UE) n.° 1293/2013 del Parlamento Europeo y del Consejo relativo al establecimiento
    de un Programa de Medio Ambiente y Acción por el Clima (LIFE) y por el que se
    deroga el Reglamento (CE) n.° 614/2007
  type: main
