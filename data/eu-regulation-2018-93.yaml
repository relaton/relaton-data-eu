    om ökning av procentandelen budgetmedel som tilldelas projekt som får stöd
    genom verksamhetsbidrag inom ramen för delprogrammet Miljö och som ska gå till
    projekt som stöder bevarandet av natur och biologisk mångfald i enlighet med
