    granturi pentru acțiuni în cadrul subprogramului pentru mediu, dedicate proiectelor
    care sprijină conservarea naturii și a biodiversității, în conformitate cu
    articolul 9 alineatul (4) din Regulamentul (UE) nr. 1293/2013 al Parlamentului
