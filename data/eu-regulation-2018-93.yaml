    támogatott, a természet és a biológiai sokféleség megőrzésére irányuló
    projektek részére előirányzott költségvetési források százalékos arányának
    a környezetvédelmi és éghajlat-politikai program (LIFE) létrehozásáról
    és a 614/2007/EK rendelet hatályon kívül helyezéséről szóló 1293/2013/EU
    európai parlamenti és tanácsi rendelet 9. cikke (4) bekezdése szerinti megnöveléséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2018/93 della Commissione, del 16 novembre 2017,
    sull'aumento della percentuale delle risorse di bilancio destinate a progetti
    finanziati a titolo di sovvenzioni nell'ambito del sottoprogramma Ambiente riservato
    a progetti a sostegno della conservazione della natura e della biodiversità ai
    sensi dell'articolo 9, paragrafo 4, del regolamento (UE) n. 1293/2013 del Parlamento
    europeo e del Consiglio sull'istituzione di un programma per l'ambiente e l'azione
    per il clima (LIFE) e che abroga il regolamento (CE) n. 614/2007
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2018/93 (2017. gada 16. novembris) par
    budžeta līdzekļu procenta palielināšanu projektiem, ko apakšprogrammā “Vide”
    atbalsta ar rīcības dotācijām projektiem, kuri atbalsta dabas un bioloģiskās
    daudzveidības saglabāšanu saskaņā ar Eiropas Parlamenta un Padomes Regulas
    (ES) Nr. 1293/2013 par vides un klimata pasākumu programmas (LIFE) izveidi un
    ar ko atceļ Regulu (EK) Nr. 614/2007 9. panta 4. punktu
  type: main
- language: lt
  script: Latn
