title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2018/93 of 16 November 2017 on the
    increase of the percentage of the budgetary resources allocated to projects supported
    by way of action grants under the sub-programme for Environment dedicated to projects
    supporting the conservation of nature and biodiversity according to Article 9(4)
    of Regulation (EU) No 1293/2013 of the European Parliament and of the Council
    on the establishment of a Programme for the Environment and Climate Action (LIFE)
    and repealing Regulation (EC) No 614/2007
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/93 de la Commission du 16 novembre 2017
    relatif à l'augmentation du pourcentage des ressources budgétaires allouées
    aux projets financés au moyen de subventions à l'action dans le cadre du sous-programme
    «Environnement» consacré à la réalisation de projets favorisant la conservation
    de la nature et de la biodiversité, conformément à l'article 9, paragraphe
    4, du règlement (UE) n° 1293/2013 du Parlement européen et du Conseil relatif
    à l'établissement d'un programme pour l'environnement et l'action pour le climat
    (LIFE) et abrogeant le règlement (CE) n° 614/2007
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/93 der Kommission vom 16. November 2017
    zur Anhebung — gemäß Artikel 9 Absatz 4 der Verordnung (EU) Nr. 1293/2013
    des Europäischen Parlaments und des Rates zur Aufstellung des Programms für
    die Umwelt und Klimapolitik (LIFE) und zur Aufhebung der Verordnung (EG) Nr. 614/2007
    — des Prozentsatzes der Haushaltsmittel für Projekte, die im Rahmen des dem
    Schutz der Umwelt und der Biodiversität dienenden Teilprogramms „Umwelt“
    in Form von maßnahmenbezogenen Zuschüssen unterstützt werden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2018/93 на Комисията
    от 16 ноември 2017 година за увеличаване на процентната
    стойност на бюджетните средства, отпуснати
    за проекти под формата на безвъзмездни средства
    за дейности по подпрограмата за околната среда,
    които са предназначени за проекти в подкрепа
    на опазването на природата и биологичното
    разнообразие съгласно член 9, параграф 4 от
    Регламент (ЕС) № 1293/2013 на Европейския парламент
    и на Съвета за създаване на Програма за околната
    среда и действията по климата (LIFE) и за отмяна
    на Регламент (ЕО) № 614/2007
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2018/93 ze dne 16. listopadu
    2017 o navýšení procentního podílu rozpočtových zdrojů přidělených
    na projekty podporované prostřednictvím grantů na akce v rámci podprogramu
    pro životní prostředí věnovaných na projekty podporující ochranu přírody
    a biologické rozmanitosti podle čl. 9 odst. 4 nařízení Evropského parlamentu
    a Rady (EU) č. 1293/2013 o zřízení programu pro životní prostředí a oblast
    klimatu (LIFE) a o zrušení nařízení (ES) č. 614/2007
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2018/93 af 16. november 2017 om
