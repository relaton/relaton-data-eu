title:
- language: en
  script: Latn
  content: '80/253/EEC: Commission Decision of 26 February 1980 accepting undertakings
    offered in connection with the anti-dumping procedure concerning imports of certain
    angles, shapes and sections of iron or steel originating in Romania, and terminating
    that procedure'
  type: main
- language: fr
  script: Latn
  content: '80/253/CEE: Décision de la Commission, du 26 février 1980, portant acceptation
    d'' engagements offerts dans le cadre de la procédure anti-"dumping" concernant
    les importations de certains profilés, en fer ou en acier, originaires de Roumanie
    et portant clôture de cette procédure'
  type: main
- language: de
  script: Latn
  content: '80/253/EWG: Beschluß der Kommission vom 26. Februar 1980 über die Annahme
    von Verpflichtungen, die im Rahmen des Antidumpingverfahrens betreffend Einfuhren
    von bestimmten Profilen aus Stahl mit Ursprung in Rumänien angeboten worden sind,
    und über die Einstellung dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '80/253/EØF: Kommissionens afgørelse af 26. februar 1980 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende indførsel af visse
    profiler af jern og stål med oprindelse i Rumænien og en afslutning af denne
    procedure'
  type: main
- language: it
  script: Latn
  content: '80/253/CEE: Decisione della Commissione, del 26 febbraio 1980, recante
    accettazione di impegni offerti nell'' ambito della procedura antidumping relativa
    alle importazioni di taluni profilati, di ferro o di acciaio, originari della
    Romania, e recante chiusura di detta procedura'
  type: main
- language: nl
  script: Latn
  content: '80/253/EEG: Besluit van de Commissie van 26 februari 1980 houdende aanvaarding
    van de in het kader van de anti-dumpingprocedure aangeboden verbintenissen met
    betrekking tot de invoer van bepaald profielijzer en profielstaal, van oorsprong
    uit Roemenië, en houdende sluiting van deze procedure'
  type: main
