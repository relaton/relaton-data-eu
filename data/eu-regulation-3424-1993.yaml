    soveltamista koskevista yksityiskohtaisista säännöistä ja arvioidun hankintataseen
    vahvistamisesta annettujen asetusten (ETY) N:o 2257/92 ja (ETY) N:o 2258/92 muuttamisesta
  type: main
- language: it
  script: Latn
