    applicazione del regime specifico di approvvigionamento di taluni oli vegetali
    per Madera e, rispettivamente, per le isole Canarie, e relativi al bilancio previsionale
    di approvvigionamento
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3424/93 VAN DE COMMISSIE van 13 december 1993 tot
