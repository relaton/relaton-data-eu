  content: Commission Regulation (EC) No 2592/94 of 25 October 1994 correcting Regulation
    (EC) No 2551/94 determining the extent to which application lodged in October
    1994 for import licences for certain pigmeat products under the regime provided
    for by the Agreements concluded by the Community with the Republic of Poland,
    the Republic of Hungary and the Czech and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2592/94 de la Commission, du 25 octobre 1994, rectifiant
    le règlement (CE) n 2551/94 déterminant la mesure dans laquelle les demandes
    de licences d'importation introduites en octobre 1994 pour certains produits à
    base de viande de porc dans le cadre du régime prévu par les accords intérimaires
    conclus par la Communauté avec la république de Pologne, la république de Hongrie
    et la République fédérative tchèque et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2592/94 der Kommission vom 25. Oktober 1994 zur Berichtigung
    der Verordnung (EG) Nr. 2551/94 über die Festsetzung des Umfangs, in dem die
    im Oktober 1994 gestellten Anträge auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse
    entsprechend der Regelung der Abkommen zwischen der Gemeinschaft und Polen, Ungarn
    sowie der Tschechischen und Slowakischen Föderativen Republik genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2592/94 af 25. oktober 1994 om ændring
