    i forbindelse med den ordning, der er fastsat i de aftaler, som Fællesskabet
    har indgået med Republikken Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske
    Føderative Republik
  type: main
- language: el
  script: Grek
