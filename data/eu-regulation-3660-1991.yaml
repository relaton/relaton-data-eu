  content: Commission Regulation (EEC) No 3660/91 of 16 December 1991 extending Regulation
    (EEC) No 3714/89 introducing retrospective surveillance of the reimportation after
    outward processing of certain textile products originating in Malta, Morocco,
    Tunisia and Turkey
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3660/91 DE LA COMMISSION du 16 décembre 1991 portant
