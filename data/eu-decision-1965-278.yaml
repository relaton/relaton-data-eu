title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 mai 1966, relative à l'autorisation accordée
    à la République italienne d'adopter des mesures de sauvegarde pour certains
    produits du chapitre 50 du tarif douanier italien (soie et déchets de soie)
  type: main
- language: de
  script: Latn
  content: '65/278/EWG: Entscheidung der Kommission vom 5. Mai 1965 betreffend die
    Ermächtigung der Italienischen Republik, für einige Waren des Kapitels 50 des
    Italienischen Zolltarifs (Seide und Schappeseide) Schutzmaßnahmen zu erlassen'
  type: main
- language: it
  script: Latn
  content: '65/278/CEE: Decisione della Commissione, del 5 maggio 1965, relativa all''autorizzazione
    accordata alla Repubblica italiana ad adottare misure di salvaguardia per alcuni
    prodotti del capitolo 50 della tariffa doganale comune (seta e cascami di seta)'
  type: main
- language: nl
  script: Latn
  content: '65/278/EEG: Beschikking van de Commissie van 5 mei 1965 betreffende de
    aan de Italiaanse Republiek verleende machtiging om vrijwaringsmaatregelen te
    treffen voor enige produkten vallende onder hoofdstuk 50 van het Italiaanse douanetarief
    (zijde en afval van zijde)'
