title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3323/74 of the Commission of 20 December 1974 amending
    Regulation (EEC) No 3559/73 as regards the landing areas very distant from the
    main centres of consumption in the Community and the conversion factors to be
    applied in those areas
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3323/74 de la Commission, du 20 décembre 1974, modifiant
    le règlement (CEE) n° 3559/73 en ce qui concerne la détermination des zones
    de débarquement très éloignées des principaux centres de consommation de la
    Communauté ainsi que les coefficients d' ajustement applicables dans ces zones
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3323/74 der Kommission vom 20. Dezember 1974 zur Änderung
    der Verordnung (EWG) Nr. 3559/73 in bezug auf die Bestimmung der Anlandegebiete,
    die von den Hauptverbrauchszentren der Gemeinschaft sehr weit entfernt liegen,
    sowie die in diesen Gebieten geltenden Anpassungskoeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3323/74 af 20. december 1974 om ændring
    af forordning (EØF) nr. 3559/73 for så vidt angår fastsættelsen af de landingsområder,
    der ligger meget fjernt fra Fællesskabets vigtigste forbrugscentre samt de tilpasningskoefficienter,
    der skal anvendes i disse områder
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3323/74 della Commissione, del 20 dicembre 1974, che
    modifica il regolamento (CEE) n. 3559/73 per quanto riguarda la determinazione
    delle zone di sbarco situate a grande distanza dai principali centri di consumo
    della Comunità e i coefficienti di adattamento applicabili in tali zone
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3323/74 van de Commissie van 20 december 1974 tot
    wijziging van Verordening (EEG) nr. 3359/73 betreffende de bepalingen van de lossingsgebieden
    die verafgelegen zijn van de voornaamste verbruikscentra van de Gemeenschap, alsmede
    van de voor deze gebieden geldende aanpassingscoëfficiënten
  type: main
