    citrinoviride Bisset (IM SD135) ako kŕmnej doplnkovej látky pre kurčatá vo
    výkrme, morky vo výkrme, nosnice, odstavené prasiatka, ošípané vo výkrme
    a menej významné druhy hydiny vo výkrme a na znášku a o zmene nariadení
    (ES) č. 2148/2004, (ES) č. 828/2007 a (ES) č. 322/2009 (držiteľ povolenia:
