title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1043 of 30 June 2015 concerning
    the authorisation of the preparation of endo-1,4-beta-xylanase (EC 3.2.1.8) produced
    by Trichoderma citrinoviride Bisset (IM SD135) as a feed additive for chickens
    for fattening, turkeys for fattening, laying hens, weaned piglets, pigs for fattening
    and minor poultry species for fattening and for laying, and amending Regulations
    (EC) No 2148/2004, (EC) No 828/2007 and (EC) No 322/2009 (holder of authorisation
    Huvepharma NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2015/1043 de la Commission du 30 juin 2015
    concernant l''autorisation de la préparation d''endo-1,4-bêta-xylanase (EC 3.2.1.8)
    produite par Trichoderma citrinoviride Bisset (IM SD135) en tant qu''additif pour
    l''alimentation des poulets d''engraissement, des dindes d''engraissement, des
    poules pondeuses, des porcelets sevrés, des porcs d''engraissement et des espèces
    mineures de volailles destinées à l''engraissement et à la ponte, et modifiant
    les règlements (CE) n° 2148/2004, (CE) n° 828/2007 et (CE) n° 322/2009 (titulaire
    de l''autorisation: Huvepharma NV)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2015/1043 der Kommission vom 30. Juni 2015
    zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase (EC 3.2.1.8), gewonnen
    aus Trichoderma citrinoviride Bisset (IM SD135), als Futtermittelzusatzstoff für
    Masthühner, Masttruthühner, Legehennen, Absetzferkel, Mastschweine sowie für
    Mast- und Legegeflügelarten von geringerer wirtschaftlicher Bedeutung und zur
    Änderung der Verordnungen (EG) Nr. 2148/2004, (EG) Nr. 828/2007 und (EG) Nr.
    322/2009 (Zulassungsinhaber: Huvepharma NV)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/1043 на Комисията
    от 30 юни 2015 година относно разрешаването на
    препарата от ендо-1,4-бета-ксиланаза (ЕС 3.2.1.8),
    получен от Trichoderma citrinoviride Bisset (IM SD135), като фуражна
    добавка при пилета за угояване, пуйки за угояване,
    кокошки носачки, отбити прасенца, свине за
    угояване и видовете домашни птици с по-малко
    стопанско значение за угояване и за яйца, и
    за изменение на регламенти (ЕО) № 2148/2004, (ЕО)
    № 828/2007 и (ЕО) № 322/2009 (притежател на разрешителното
    Huvepharma NV)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/1043 ze dne 30. června 2015
    o povolení přípravku endo-1,4-beta-xylanázy (EC 3.2.1.8) z Trichoderma citrinoviride
    Bisset (IM SD135) jako doplňkové látky pro výkrm kuřat, výkrm krůt, nosnice,
    selata po odstavu, výkrm prasat a výkrm a nosnice menšinových druhů drůbeže
    a o změně nařízení (ES) č. 2148/2004, (ES) č. 828/2007 a (ES) č. 322/2009
    (držitel povolení Huvepharma NV)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/1043 af 30. juni 2015
    om godkendelse af præparatet af endo-1,4-beta-xylanase (EC 3.2.1.8) produceret
    af Trichoderma citrinoviride Bisset (IM SD135) som fodertilsætningsstof til slagtekyllinger,
    slagtekalkuner, æglæggende høner, fravænnede smågrise, slagtesvin og mindre
    udbredte fjerkræarter bestemt til slagtning og opdrættet til æglægning og
    om ændring af forordning (EF) nr. 2148/2004, (EF) nr. 828/2007 og (EF) nr. 322/2009
    (indehaver af godkendelsen er Huvepharma NV)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2015/1043 της
    Επιτροπής, της 30ής Ιουνίου 2015, για την έγκριση
    του παρασκευάσματος ενδο-1,4-β-ξυλανάσης (EC 3.2.1.8)
    που παράγεται από Trichoderma citrinoviride Bisset (IM SD 135)
    ως πρόσθετης ύλης ζωοτροφών για κοτόπουλα
    προς πάχυνση, γαλοπούλες προς πάχυνση, όρνιθες
    ωοπαραγωγής, απογαλακτισμένα χοιρίδια, χοίρους
    προς πάχυνση και μικρά είδη πουλερικών προς
    πάχυνση και ωοπαραγωγή, και για την τροποποίηση
    των κανονισμών (ΕΚ) αριθ. 2148/2004, (ΕΚ) αριθ. 828/2007
    και (ΕΚ) αριθ. 322/2009 (κάτοχος της άδειας: Huvepharma
    NV)'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2015/1043, 30. juuni 2015, milles käsitletakse
    loa andmist Trichoderma citrinoviride Bisset (IM SD135) abil toodetud endo-1,4-β-ksülanaasi
    (EC 3.2.1.8) valmistise kasutamiseks broilerkanade, broilerkalkunite, munakanade,
    võõrutatud põrsaste, nuumsigade ja vähe levinud kodulinnuliikide nuum- ja
    munalindude söödalisandina ning millega muudetakse määrusi (EÜ) nr 2148/2004,
    (EÜ) nr 828/2007 ja (EÜ) nr 322/2009 (loa omanik Huvepharma NV)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/1043, annettu 30 päivänä
    kesäkuuta 2015, Trichoderma citrinoviride Bisset (IM SD135) -organismin tuottaman
    endo-1,4-beetaksylanaasi (EC 3.2.1.8) -valmisteen hyväksymisestä broilerien,
    lihakalkkunoiden, munivien kanojen, vieroitettujen porsaiden, lihasikojen, toissijaisten
    lihasiipikarjalajien ja toissijaisten munivien siipikarjalajien rehun lisäaineena
    sekä asetusten (EY) N:o 2148/2004, (EY) N:o 828/2007 ja (EY) N:o 322/2009 muuttamisesta
    (hyväksynnän haltija Huvepharma NV)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/1043 оd 30. lipnja 2015. o odobrenju
    pripravka endo-1,4-beta-ksilanaze (EC 3.2.1.8) dobivenog od Trichoderma citrinoviride
    Bisset (IM SD135) kao dodatka hrani za piliće za tov, pure za tov, nesilice,
    odbijenu prasad, svinje za tov i manje značajne vrste peradi za tov i nesenje
    i o izmjeni uredbi (EZ) br. 2148/2004, (EZ) br. 828/2007 i (EZ) br. 322/2009 (nositelj
    odobrenja Huvepharma NV)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/1043 végrehajtási rendelete (2015. június 30.)
    a Trichoderma citrinoviride Bisset (IM SD135) által termelt endo-1,4-béta-xilanázt
    (EC 3.2.1.8) tartalmazó készítmény brojlercsirkék, hízópulykák, tojótyúkok,
    elválasztott malacok, hízósertések és kisebb hízó- és tojóbaromfifajok
    takarmány-adalékanyagaként történő felhasználásának engedélyezéséről,
    valamint a 2148/2004/EK, a 828/2007/EK és a 322/2009/EK rendelet módosításáról
    (az engedély jogosultja a Huvepharma NV)
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/1043 della Commissione, del 30 giugno
    2015, relativo all'autorizzazione del preparato di endo- 1,4-beta-xilanasi (EC
    3.2.1.8) prodotto da Trichoderma citrinoviride Bisset (IM SD135) come additivo
    per mangimi destinati a polli da ingrasso, tacchini da ingrasso, galline ovaiole,
    suinetti svezzati, suini da ingrasso e specie avicole minori da ingrasso e destinate
    alla produzione di uova, e che modifica i regolamenti (CE) n. 2148/2004, (CE)
    n. 828/2007 e (CE) n. 322/2009 (titolare dell'autorizzazione Huvepharma NV)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/1043 (2015. gada 30. jūnijs),
    ar kuru atļauj lietot no Trichoderma citrinoviride Bisset (IM SD135) iegūtas
    endo-1,4-beta-ksilanāzes (EC 3.2.1.8) preparātu kā barības piedevu gaļas
    cāļiem, gaļas tītariem, dējējvistām, atšķirtiem sivēniem, gaļas cūkām
    un mazāk izplatītu sugu gaļas mājputniem un dējējmājputniem un groza Regulu
    (EK) Nr. 2148/2004, (EK) Nr. 828/2007 un (EK) Nr. 322/2009 (atļaujas turētājs
    Huvepharma NV)
  type: main
- language: lt
  script: Latn
  content: 2015 m. birželio 30 d. Komisijos įgyvendinimo reglamentas (ES) 2015/1043
    dėl leidimo naudoti endo-1,4-beta-ksilanazės (EC 3.2.1.8), gautos iš grybo
    Trichoderma citrinoviride Bisset (IM SD135), preparatą kaip mėsinių viščiukų,
    mėsinių kalakutų, vištų dedeklių, nujunkytų paršelių, penimųjų kiaulių
    ir retesnių rūšių mėsinių ir dedeklinių naminių paukščių pašaro priedą,
    kuriuo iš dalies keičiami reglamentai (EB) Nr. 2148/2004, (EB) Nr. 828/2007
    ir (EB) Nr. 322/2009 (leidimo turėtojas – „Huvepharma NV“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/1043 tat-30 ta'
    Ġunju 2015 li jikkonċerna l-awtorizzazzjoni tal-preparat tal-endo-1,4-beta-ksilanażi
    (KE 3.2.1.8) li jsir mit-Trichoderma citrinoviride Bisset (IM SD135) bħala addittiv
    tal-għalf għat-tiġieġ għat-tismin, għad-dundjani għat-tismin, għat-tiġieġ
    tal-bajd, għall-ħnienes miftuma, għall-ħnieżer għat-tismin u għal speċijiet
    minuri ta' tjur imrobbija għall-bajd u għat-tismin, u li jemenda r-Regolamenti
    (KE) Nru 2148/2004, (KE) Nru 828/2007 u (KE) Nru 322/2009 (detentur tal-awtorizzazzjoni
    Huvepharma NV)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/1043 van de Commissie van 30 juni 2015
    tot verlening van een vergunning voor een preparaat van endo-1,4-bèta-xylanase
    (EC 3.2.1.8) geproduceerd door Trichoderma citrinoviride Bisset (IM SD135), als
    toevoegingsmiddel voor voeding voor mestkippen, mestkalkoenen, legkippen, gespeende
    biggen, mestvarkens en voor minder gangbare pluimveesoorten gehouden voor mest-
    en legdoeleinden, en tot wijziging van de Verordeningen (EG) nr. 2148/2004, (EG)
    nr. 828/2007 en (EG) nr. 322/2009 (vergunninghouder Huvepharma NV)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/1043 z dnia 30 czerwca 2015
    r. dotyczące zezwolenia na stosowanie preparatu endo-1,4-beta-ksylanazy (EC 3.2.1.8)
    wytwarzanej przez Trichoderma citrinoviride Bisset (IM SD135) jako dodatku paszowego
    dla kurcząt rzeźnych, indyków rzeźnych, kur niosek, prosiąt odsadzonych od
    maciory, tuczników oraz podrzędnych gatunków drobiu rzeźnego i odchowywanego
    na nioski oraz zmieniające rozporządzenia (WE) nr 2148/2004, (WE) nr 828/2007
    i (WE) nr 322/2009 (posiadacz zezwolenia Huvepharma NV)
  type: main
