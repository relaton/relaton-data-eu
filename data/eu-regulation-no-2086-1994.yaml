title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2086/94 of 19 August 1994 re-establishing
    the levying of customs duties on certain industrial products originating in Indonesia,
    Malaysia and China, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2086/94 de la Commission du 19 août 1994 portant rétablissement
    de la perception des droits de douane applicables à certains produits industriels
    originaires de l'Indonésie, de Malaysia et de Chine bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2086/94 DER KOMMISSION vom 19. August 1994 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte gewerbliche Waren mit Ursprung in Indonesien,
    Malaysia und China für die die in der Verordnung (EWG) Nr. 3831/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2086/94 af 19. august 1994 om genindførelse
    af opkrævning af told for visse industrivarer med oprindelse i Indonesien, Malaysia
    og Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2086/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Αυγούστου 1994 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών σε ορισμένα βιομηχανιικά
    προϊόντα, καταγωγής Ινδονησίας, Μαλαισίας
    και Κίνας, δικαιούχων των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2086/94 DELLA COMMISSIONE del 19 agosto 1994 che ripristina
    la riscossione dei dazi doganali a taluni prodotti industriali originari dell'
    Indonesia, della Malaysia e della Cina, beneficiarie delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2086/94 VAN DE COMMISSIE van 19 augustus 1994 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde industrieprodukten
    van oorsprong uit Indonesië, Maleisië en China, waarvoor de in Verordening (EEG)
    nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2086/94 DA COMISSÃO de 19 de Agosto de 1994 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis a certos produtos industriais
    originários da Indonésia, da Malásia e da China, beneficiários das preferências
    pautais previstas no Regulamento (CEE) nº 3831/90 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 2086/94 DE LA COMISIÓN de 19 de agosto de 1994 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a determinados
    productos industriales originarios de Indonesia, Malasia y China, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) nº 3831/90
    del Consejo
