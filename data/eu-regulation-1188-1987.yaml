    auf die Einfuhr von Auberginen mit Ursprung in Spanien (mit Ausnahme der Kanarischen
    Inseln)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1188/87 af 29. april 1987 om anden
