id: EURegulation202295
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/95 of 24 January 2022 imposing
    a definitive anti-dumping duty on imports of certain tube and pipe fittings, of
    iron or steel, originating in the People’s Republic of China, as extended to
    imports of certain tube and pipe fittings, of iron or steel consigned from Taiwan,
    Indonesia, Sri Lanka and the Philippines, whether declared as originating in these
    countries or not, following an expiry review pursuant to Article 11(2) of Regulation
    (EU) 2016/1036 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/95 de la Commission du 24 janvier 2022
    instituant un droit antidumping définitif sur les importations de certains accessoires
    de tuyauterie, en fer ou en acier, originaires de la République populaire de
    Chine, tel qu’étendu aux importations de certains accessoires de tuyauterie,
    en fer ou en acier, expédiés de Taïwan, d’Indonésie, du Sri Lanka et des
    Philippines, qu’ils aient ou non été déclarés originaires de ces pays, à
    l’issue d’un réexamen de mesures parvenant à expiration effectué conformément
    à l’article 11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/95 der Kommission vom 24. Januar 2022
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    Rohrformstücke, Rohrverschlussstücke und Rohrverbindungsstücke aus Eisen oder
    Stahl mit Ursprung in der Volksrepublik China, ausgeweitet auf aus Taiwan, Indonesien,
    Sri Lanka und den Philippinen versandte Einfuhren bestimmter Rohrformstücke,
    Rohrverschlussstücke und Rohrverbindungsstücke aus Eisen oder Stahl, ob als
    Ursprungserzeugnisse aus diesen Ländern angemeldet oder nicht, im Anschluss an
    eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der Verordnung (EU) 2016/1036
    des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/95 на Комисията
    от 24 януари 2022 година за налагане на окончателно
    антидъмпингово мито върху вноса на някои принадлежности
    за тръбопроводи от желязо или стомана с произход
    от Китайската народна република, чийто обхват
    е разширен с включването на вноса на някои
    принадлежности за тръбопроводи от желязо или
    стомана, изпращани от Тайван, Индонезия, Шри
    Ланка и Филипините, независимо дали са декларирани
    с произход от посочените държави, след преглед
    с оглед изтичане на срока на действие на мерките
    в съответствие с член 11, параграф 2 от Регламент
    (ЕС) 2016/1036 на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/95 ze dne 24. ledna 2022, kterým
    se ukládá konečné antidumpingové clo na dovoz některých potrubních tvarovek
    ze železa nebo oceli pocházejících z Čínské lidové republiky, rozšířené
    na dovoz některých potrubních tvarovek ze železa nebo oceli odesílaných
    z Tchaj-wanu, Indonésie, Šrí Lanky a Filipín, bez ohledu na to, zda je u nich
    deklarován původ z těchto zemí, na základě přezkumu před pozbytím platnosti
    podle čl. 11 odst. 2 nařízení Evropského parlamentu a Rady (EU) 2016/1036
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/95 af 24. januar 2022
    om indførelse af en endelig antidumpingtold på importen af visse rørfittings
    af jern eller stål med oprindelse i Folkerepublikken Kina som udvidet til også
    at omfatte importen af visse rørfittings af jern eller stål afsendt fra Taiwan,
    Indonesien, Sri Lanka og Filippinerne, uanset om varen er angivet med oprindelse
    i disse lande eller ej, efter en udløbsundersøgelse i henhold til artikel 11,
    stk. 2, i Europa-Parlamentets og Rådets forordning (EU) 2016/1036
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/95 της Επιτροπής
    της 24ης Ιανουαρίου 2022 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    εξαρτημάτων σωληνώσεων, από σίδηρο ή χάλυβα,
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, όπως
    επεκτάθηκε στις εισαγωγές ορισμένων εξαρτημάτων
    σωληνώσεων, από σίδηρο ή χάλυβα, που αποστέλλονται
    από την Ταϊβάν, την Ινδονησία, τη Σρι Λάνκα
    και τις Φιλιππίνες, είτε δηλώνονται ως καταγωγής
    αυτών των χωρών είτε όχι, έπειτα από επανεξέταση
    ενόψει της λήξης ισχύος των μέτρων σύμφωνα
    με το άρθρο 11 παράγραφος 2 του κανονισμού (ΕΕ)
    2016/1036 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/95, 24. jaanuar 2022, millega kehtestatakse
    pärast Euroopa Parlamendi ja nõukogu määruse (EL) 2016/1036 artikli 11 lõike
    2 kohast aegumise läbivaatamist teatavate Hiina Rahvavabariigist pärit rauast
    või terasest toruliitmike impordi suhtes lõplik dumpinguvastane tollimaks, mida
    laiendatakse teatavate Taiwanist, Indoneesiast, Sri Lankalt ja Filipiinidelt lähetatud
    rauast või terasest toruliitmike impordile, olenemata sellest, kas need on deklareeritud
    nimetatud riikidest pärinevana või mitte
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/95, annettu 24 päivänä
    tammikuuta 2022, lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen
    Kiinan kansantasavallasta peräisin olevien raudasta tai teräksestä valmistettujen
    putkien liitososien tuonnissa sellaisena kuin se on laajennettuna koskemaan tiettyjen
    Taiwanista, Indonesiasta, Sri Lankasta ja Filippiineiltä lähetettyjen raudasta
    tai teräksestä valmistettujen putkien liitososien tuontia riippumatta siitä,
    onko niiden alkuperämaaksi ilmoitettu jokin näistä maista, Euroopan parlamentin
    ja neuvoston asetuksen (EU) 2016/1036 11 artiklan 2 kohdan mukaisen toimenpiteiden
    voimassaolon päättymistä koskevan tarkastelun jälkeen
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/95 ón gCoimisiún an 24 Eanáir
    2022 lena bhforchuirtear dleacht frithdhumpála chinntitheach ar allmhairí d’fheistithe
    áirithe feadán agus píopaí, as iarann nó as cruach, ar de thionscnamh Dhaon-Phoblacht
    na Síne iad, mar a leathnaítear chun allmhairí d’fheistithe áirithe feadán
    agus píopaí, as iarann nó as cruach, ar de thionscnamh na Téaváine, na hIndinéise,
    Shrí Lanca agus na nOileán Filipíneach iad, bídís dearbhaithe gur de thionscnamh
    na dtíortha sin iad nó ná bídís, a chumhdach, tar éis athbhreithniú éaga
    de bhun Airteagal 11(2) de Rialachán (AE) 2016/1036 ó Pharlaimint na hEorpa
    agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/95 оd 24. siječnja 2022. o uvođenju
    konačne antidampinške pristojbe na uvoz određenog željeznog ili čeličnog
    pribora za cijevi podrijetlom iz Narodne Republike Kine kako je proširena na
    uvoz određenog željeznog ili čeličnog pribora za cijevi otpremljenog iz Tajvana,
    Indonezije, Šri Lanke i Filipina, neovisno o tome ima li ili nema deklarirano
    podrijetlo iz tih zemalja, nakon revizije zbog predstojećeg isteka mjera u skladu
    s člankom 11. stavkom 2. Uredbe (EU) 2016/1036 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/95 végrehajtási rendelete (2022. január 24.)
    a Kínai Népköztársaságból származó, vasból vagy acélból készült egyes
    csőszerelvények behozatalára vonatkozó, a Tajvanon, az Indonéziában, a Srí
    Lankán és a Fülöp-szigeteken feladott, akár ezekből az országokból származóként,
    akár nem ilyenként bejelentett, vasból vagy acélból készült egyes csőszerelvények
    behozatalára is kiterjesztett végleges dömpingellenes vámnak az (EU) 2016/1036
    európai parlamenti és tanácsi rendelet 11. cikkének (2) bekezdése szerinti
    hatályvesztési felülvizsgálatot követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/95 della Commissione del 24 gennaio
    2022 che istituisce un dazio antidumping definitivo sulle importazioni di alcuni
    accessori per tubi di ferro o di acciaio, originari della Repubblica popolare
    cinese, esteso alle importazioni di alcuni accessori per tubi di ferro o di acciaio,
    spediti da Taiwan, Indonesia, Sri Lanka e Filippine, indipendentemente dal fatto
    che siano dichiarati o meno originari di tali paesi, in seguito ad un riesame
    in previsione della scadenza a norma dell’articolo 11, paragrafo 2, del regolamento
    (UE) 2016/1036 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/95 (2022. gada 24. janvāris),
    ar ko pēc termiņbeigu pārskatīšanas, kura veikta saskaņā ar Eiropas Parlamenta
    un Padomes Regulas (ES) 2016/1036 11. panta 2. punktu, nosaka galīgo antidempinga
    maksājumu konkrētu Ķīnas Tautas Republikas izcelsmes dzelzs un tērauda cauruļu
    savienotājelementu importam, attiecinot to arī uz tādu konkrētu dzelzs un
    tērauda cauruļu savienotājelementu importu, kas nosūtīti no Taivānas, Indonēzijas,
    Šrilankas un Filipīnām, neatkarīgi no tā, vai šiem savienotājelementiem
    ir deklarēta šo valstu izcelsme
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/95 2022 m. sausio 24 d. kuriuo,
    pagal Europos Parlamento ir Tarybos reglamento (ES) 2016/1036 11 straipsnio 2
    dalį atlikus priemonių galiojimo termino peržiūrą, tam tikroms importuojamoms
    Kinijos Liaudies Respublikos kilmės vamzdžių arba vamzdelių jungiamosioms
    detalėms iš geležies arba plieno nustatomas galutinis antidempingo muitas,
    taip pat taikomas iš Taivano, Indonezijos, Šri Lankos ir Filipinų siunčiamoms
    tam tikroms importuojamoms vamzdžių arba vamzdelių jungiamosioms detalėms
    iš geležies arba plieno, deklaruojamoms arba nedeklaruojamoms kaip šių šalių
    kilmės
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/95 tal-24 ta’
    Jannar 2022 li jimponi dazju anti-dumping definittiv fuq l-importazzjonijiet ta’
    ċerti fittings ta’ tubi u pajpijiet, tal-ħadid jew tal-azzar, li joriġinaw
    mir-Repubblika tal-Poplu taċ-Ċina, kif estiż għall-importazzjonijiet ta’
    ċerti fittings ta’ tubi u pajpijiet, tal-ħadid jew tal-azzar ikkonsenjati
    mit-Tajwan, mill-Indoneżja, mis-Sri Lanka u mill-Filippini, kemm jekk iddikjarati
    bħala li joriġinaw minn dawn il-pajjiżi kif ukoll jekk le, wara rieżami ta’
    skadenza skont l-Artikolu 11(2) tar-Regolament (UE) 2016/1036 tal-Parlament Ewropew
    u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/95 van de Commissie van 24 januari 2022
    tot instelling van een definitief antidumpingrecht op bepaalde hulpstukken voor
    buisleidingen, van ijzer of van staal, van oorsprong uit de Volksrepubliek China,
    zoals uitgebreid tot bepaalde hulpstukken voor buisleidingen, van ijzer of van
    staal, verzonden vanuit Taiwan, Indonesië, Sri Lanka en de Filipijnen, al dan
    niet aangegeven als van oorsprong uit deze landen, naar aanleiding van een nieuw
    onderzoek in verband met het vervallen van de maatregelen op grond van artikel
    11, lid 2, van Verordening (EU) 2016/1036 van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/95 z dnia 24 stycznia 2022
    r. nakładające ostateczne cło antydumpingowe na przywóz niektórych łączników
    rur i przewodów rurowych z żeliwa lub stali pochodzących z Chińskiej Republiki
    Ludowej rozszerzone na przywóz niektórych łączników rur i przewodów rurowych
    z żeliwa lub stali wysyłanych z Tajwanu, Indonezji, Sri Lanki i Filipin, zgłoszonych
    lub niezgłoszonych jako pochodzące z tych państw, w następstwie przeglądu
    wygaśnięcia na podstawie art. 11 ust. 2 rozporządzenia Parlamentu Europejskiego
    i Rady (UE) 2016/1036
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/95 da Comissão de 24 de janeiro de
    2022 que institui um direito anti-dumping definitivo sobre as importações de
    determinados acessórios para tubos, de ferro ou de aço, originários da República
    Popular da China, tornado extensivo às importações de determinados acessórios
    para tubos, de ferro ou de aço, expedidos de Taiwan, da Indonésia, do Seri Lanca
    e das Filipinas, independentemente de serem ou não declarados originários desses
    países, na sequência de um reexame da caducidade nos termos do artigo 11.o,
    n.o 2, do Regulamento (UE) 2016/1036 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/95 al Comisiei din 24 ianuarie
    2022 de instituire a unei taxe antidumping definitive la importurile de anumite
    accesorii de țevărie, din fier sau din oțel, originare din Republica Populară
    Chineză, astfel cum a fost extinsă la importurile de anumite accesorii de țevărie,
    din fier sau din oțel, expediate din Taiwan, Indonezia, Sri Lanka și Filipine,
    indiferent dacă au fost sau nu declarate ca fiind originare din aceste țări,
    în urma unei reexaminări efectuate în perspectiva expirării măsurilor în
    temeiul articolului 11 alineatul (2) din Regulamentul (UE) 2016/1036 al Parlamentului
    European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/95 z 24. januára 2022, ktorým
    sa po revíznom prešetrovaní pred uplynutím platnosti podľa článku 11 ods.
    2 nariadenia Európskeho parlamentu a Rady (EÚ) 2016/1036 ukladá konečné antidumpingové
    clo na dovoz určitých rúrových a potrubných tvaroviek zo železa alebo z
    ocele s pôvodom v Čínskej ľudovej republike, rozšírené na dovoz určitých
    rúrových a potrubných tvaroviek zo železa alebo z ocele odosielaných z Taiwanu,
    Indonézie, zo Srí Lanky a z Filipín bez ohľadu na to, či majú alebo nemajú
    deklarovaný pôvod v týchto krajinách
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/95 z dne 24. januarja 2022 o uvedbi
    dokončne protidampinške dajatve na uvoz nekaterega železnega ali jeklenega
    pripora (fitingov) za cevi s poreklom iz Ljudske republike Kitajske, kakor je
    bila razširjena na uvoz nekaterega železnega ali jeklenega pripora (fitingov)
    za cevi, poslanega s Tajvana, iz Indonezije, s Šrilanke in Filipinov, ne glede
    na to, ali je deklariran kot izdelek s poreklom iz teh držav ali ne, po pregledu
    zaradi izteka ukrepa v skladu s členom 11(2) Uredbe (EU) 2016/1036 Evropskega
    parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/95 de la Comisión de 24 de enero de
    2022 por el que se establece un derecho antidumping definitivo sobre las importaciones
    de determinados accesorios de tubería de hierro o acero originarios de la República
    Popular China, ampliado a las importaciones de determinados accesorios de tubería
    de hierro o acero procedentes de Taiwán, Indonesia, Sri Lanka y Filipinas, tanto
    si se declaran originarios de estos países como si no, a raíz de una reconsideración
    por expiración con arreglo al artículo 11, apartado 2, del Reglamento (UE) 2016/1036
    del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/95 av den 24 januari 2022
    om införande av en slutgiltig antidumpningstull på import av vissa rördelar
    av järn eller stål med ursprung i Folkrepubliken Kina, utvidgad till att även
    omfatta import av vissa rördelar av järn eller stål som avsänts från Taiwan,
    Indonesien, Sri Lanka och Filippinerna, oavsett om produktens deklarerade ursprung
    är dessa länder eller inte, efter en översyn vid giltighetstidens utgång enligt
    artikel 11.2 i Europaparlamentets och rådets förordning (EU) 2016/1036
  type: main
