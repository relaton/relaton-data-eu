title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3512/91 of 3 December 1991 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of boneless beef held by
    certain intervention agencies and intended for export, amending Regulation (EEC)
    No 569/88 and repealing Regulation (EEC) No 2654/91
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3512/91 DE LA COMMISSION du 3 décembre 1991 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) no 2539/84,
    de viandes bovines désossées détenues par certains organismes d'' intervention
    et destinées à être exportées, modifiant le règlement (CEE) no 569/88 et
    abrogeant le règlement (CEE) no 2654/91 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3512/91 DER KOMMISSION vom 3. Dezember 1991 über
    den Verkauf von zur Ausfuhr bestimmtem Rindfleisch ohne Knochen aus Interventionsbeständen
    nach der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung (EWG) Nr.
    569/88 und zur Aufhebung der Verordnung (EWG) Nr. 2654/91 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3512/91 af 3. december 1991 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af udbenet oksekød fra visse
    interventionsorganer med henblik på udførsel, om ændring af forordning (EØF)
    nr. 569/88 og om ophævelse af forordning (EØF) nr. 2654/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3512/91 της Επιτροπής
    της 3ης Δεκεμβρίου 1991 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό (ΕΟΚ) αριθ. 2539/84, αποστεωμένου βοείου
    κρέατος που κρατείται από ορισμένους οργανισμούς
    παρεμβάσεως και προορίζεται να εξαχθεί καθώς
    και σχετικά με την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 569/88 και την κατάργηση του κανονισμού
    (ΕΟΚ) αριθ. 2654/91
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3512/91 DELLA COMMISSIONE del 3 dicembre 1991 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine disossate detenute da taluni organismi d'' intervento e destinate
    ad essere esportate, che modifica il regolamento (CEE) n. 569/88 e recante abrogazione
    del regolamento (CEE) n. 2654/91 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3512/91 VAN DE COMMISSIE van 3 december 1991 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees
    zonder been, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende intrekking
    van Verordening (EEG) nr. 2654/91 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3512/91 DA COMISSÃO de 3 de Dezembro de 1991 relativo
