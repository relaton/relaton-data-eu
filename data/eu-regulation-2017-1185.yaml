  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1185 of 20 April 2017 laying
    down rules for the application of Regulations (EU) No 1307/2013 and (EU) No 1308/2013
    of the European Parliament and of the Council as regards notifications to the
    Commission of information and documents and amending and repealing several Commission
    Regulations
  type: main
- language: fr
  script: Latn
