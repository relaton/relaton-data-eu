title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 886/94 of 21 April 1994 determining the extent
    to which applications lodged in April 1994 for import licences for fresh, chilled
    or frozen beef under the import arrangements provided for in the Agreements concluded
    by the Community with the Republic of Poland, the Republic of Hungary and the
    Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 886/94 de la Commission, du 21 avril 1994, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en avril 1994 pour les viandes bovines fraîches, réfrigérées ou
    congelées dans le cadre des régimes d'importation prévus par les accords conclus
    par la Communauté avec la république de Pologne, la république de Hongrie et
    la République tchèque et la République slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 886/94 der Kommission vom 21. April 1994 zur Festsetzung
    des Umfangs, in dem die im April 1994 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Abkommen zwischen der
    Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen Republik
    und der Slowakischen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 886/94 af 21. april 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i april 1994, om
    importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i aftalerne mellem Fællesskabet og Republikken Polen, Republikken
    Ungarn og Den Tjekkiske Republic og Den Slovakiske Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 886/94 της Επιτροπής
    της 21ης Απριλίου 1994 περί καθορισμού του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Απρίλιο 1994 για τα νωπά, διατηρημένα με απλή
    ψύξη ή κατεψυγμένα βόεια κρέατα στα πλαίσια
    των καθεστώτων εισαγωγής που προβλέπονται
    από τις συμφωνίες που συνήφθησαν από την Κοινότητα
    με τη Δημοκρατία της Πολωνίας, τη Δημοκρατία
    της Ουγγαρίας, την Τσεχική Δημοκρατία και τη
    Σλοβακική Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 886/94 della Commissione, del 21 aprile 1994, che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 1994 per le carni bovine fresche, refrigerate o
    congelate nel quadro dei regimi di importazione previsti dagli accordi conclusi
    tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica
    ceca e la Repubblica slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 886/94 van de Commissie van 21 april 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor vers, gekoeld of bevroren rundvlees, die in april 1994 zijn ingediend op
    grond van de invoerregelingen die zijn vastgesteld in de door de Gemeenschap met
    de Republiek Polen, de Republiek Hongarije, de Tsjechische Republiek en de Slowaakse
    Republiek gesloten overeenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 886/94 da Comissão, de 21 de Abril de 1994, que determina
