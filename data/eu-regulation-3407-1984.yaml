    λαμπτήρες και σωλήνες της διακρίσεως 85.20 Α
    ΙΙ του Κοινού Δασμολογίου, καταγωγής Ρουμανίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3407/84 della Commissione del 4 dicembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili ad alcune lampade e tubi
    elettrici, della sottovoce 85.20 A II della tariffa doganale comune, originari
    della Romania beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3407/84 van de Commissie van 4 december 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde elektrische
    gloeilampen en -buizen van post 85.20 A II, van oorsprong uit Roemenië, waarvoor
    de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn
    verleend
