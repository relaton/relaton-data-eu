title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3407/84 of 4 December 1984 re-establishing
    the levying of customs duties on certain electric filament lamps and electric
    discharge lamps, falling within subheading 85.20 A II and originating in Romania,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3407/84 de la Commission du 4 décembre 1984 portant
    rétablissement de la perception des droits de douane applicables à certaines
    lampes et tubes électriques, de la sous-position 85.20 A II du tarif douanier
    commun, originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3407/84 der Kommission vom 4. Dezember 1984 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte elektrische Glühlampen der Tarifstelle
    85.20 A II mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3569/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3407/84 af 4. december 1984 om genindførelse
    af opkrævning af told for bestemte elektriske glødelamper og udladningslamper,
    henhørende under pos. 85.20 A II og med oprindelse i Rumænien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3407/84 της Επιτροπής
    της 4ης Δεκεμβρίου 1984 περί αποκαταστάσεως της
