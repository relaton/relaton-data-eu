title:
- language: en
  script: Latn
  content: '93/396/EEC: Commission Decision of 13 July 1993 on Spain''s request for
    adoption by the Commission of a prolongation of safeguard measures pursuant to
    Article 5 of Regulation (EEC) No 3577/92 applying the principle of freedom to
    provide services to maritime transport within Member States (maritime cabotage)
    (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/396/CEE: Décision de la Commission, du 13 juillet 1993, relative à
    la demande espagnole de prorogation des mesures de sauvegarde adoptées en vertu
    de l''article 5 du règlement (CEE) n° 3577/92 concernant l''application du principe
    de la libre circulation des services aux transports maritimes à l''intérieur
    des États membres (cabotage maritime) (Le texte en langue espagnole est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/396/EWG: Entscheidung der Kommission vom 13. Juli 1993 über den Antrag
    Spaniens auf Genehmigung einer Verlängerung von Schutzmaßnahmen nach Artikel
    5 der Verordnung (EWG) Nr. 3577/92 des Rates zur Anwendung des Grundsatzes des
    freien Dienstleistungsverkehrs auf den Seeverkehr in den Mitgliedstaaten (Seekabotage)
    (Nur der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/396/EØF: Kommissionens beslutning af 13. juli 1993 i anledning af
    Spaniens anmodning om, at Kommissionen vedtager at forlænge beskyttelsesforanstaltningerne
    i henhold til artikel 5 i forordning (EØF) nr. 3577/92 om anvendelse af princippet
    om fri udveksling af tjenesteydelser inden for søtransport i medlemsstaterne
    (cabotagesejlads) (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
