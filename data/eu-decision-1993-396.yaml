  type: main
- language: it
  script: Latn
  content: '93/396/CEE: Decisione della Commissione, del 13 luglio 1993, in merito
    alla richiesta presentata dalla Spagna affinché la Commissione adotti una proroga
    delle misure di salvaguardia ai sensi dell''articolo 5 del regolamento (CEE) n.
    3577/92 del Consiglio concernente l''applicazione del principio della libera prestazione
    dei servizi ai trasporti marittimi fra Stati membri (cabotaggio marittimo) (Il
    testo in lingua spagnola è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/396/EEG: Beschikking van de Commissie van 13 juli 1993 betreffende
    het verzoek van Spanje tot goedkeuring door de Commissie van de verlenging van
    de vrijwaringsmaatregelen op grond van artikel 5 van Verordening (EEG) nr. 3577/92
    van de Raad houdende toepassing van het beginsel van het vrij verrichten van diensten
    op het zeevervoer binnen de Lid-Staten (cabotage in het zeevervoer) (Slechts de
    tekst in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/396/CEE: Decisão da Comissão, de 13 de Julho de 1993, relativa ao
