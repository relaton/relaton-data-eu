    για έγκριση από την Επιτροπή παράτασης των
    μέτρων διασφάλισης που προβλέπονται στο άρθρο
    5 του κανονισμού (ΕΟΚ) αριθ. 3577/92 του Συμβουλίου
    για την εφαρμογή της αρχής της ελεύθερης κυκλοφορίας
    των υπηρεσιών στις θαλάσσιες μεταφορές στο
