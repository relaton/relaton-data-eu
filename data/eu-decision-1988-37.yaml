title:
- language: en
  script: Latn
  content: '88/37/EEC: Commission Decision of 8 January 1988 making an initial allocation
    to Luxembourg of part of the resources to be charged to the 1988 budget year for
    the supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/37/CEE: Décision de la Commission du 8 janvier 1988 allouant au Luxembourg
    une première tranche des crédits imputables à l'' exercice 1988 pour la fourniture
    de denrées alimentaires provenant des stocks d'' intervention à des organisations
    désignées pour les distribuer aux personnes les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/37/EWG: Entscheidung der Kommission vom 8. Januar 1988 über die anfängliche
    Bewilligung für Luxemburg eines Teils der Mittel, die im Haushaltsjahr 1988 für
    die zur Verfügungstellung von Nahrungsmitteln aus Interventionsbeständen an
    bezeichnete Organisationen zur Verteilung an stark benachteiligte Personen in
    der Gemeinschaft zu verbuchen sind'
  type: main
- language: da
  script: Latn
  content: '88/37/EØF: Kommissionens beslutning af 8. januar 1988 om en første tildeling
    til Luxembourg af en del af de midler, der skal opføres på 1988-budgettet for
    levering af levnedsmidler fra interventionslagre til nærmere bestemte organisationer
    med henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/37/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Ιανουαρίου
    1988 που χορηγεί στο Λουξεμβούργο μια πρώτη μερίδα
    πιστώσεων που καταλογίζονται στο οικονομικό
    έτος 1988 για τη χορήγηση τροφίμων που προέρχονται
    από τα αποθέματα παρεμβάσεως στους οργανισμούς
    που ορίζονται για τη διανομή τους στους απόρους
    της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '88/37/CEE: Decisione della Commissione dell'' 8 gennaio 1988 relativa
    ad uno stanziamento iniziale a Lussemburgo di parte delle risorse da imputare
    all'' esercizio finanziario 1988 per la fornitura di derrate alimentari provenienti
    dalle scorte d'' intervento agli organismi incaricati di distribuirle agli indigenti
    nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '88/37/EEG: Beschikking van de Commissie van 8 januari 1988 houdende een
    eerste toewijzing aan Luxemburg van de op het begrotingsjaar 1988 te boeken middelen
    voor de levering van voedsel uit interventievoorraden aan bepaalde organisaties
    voor de bedeling aan behoeftigen in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '88/37/CEE: Decisão da Comissão de 8 de Janeiro de 1988 relativa à afectação
    inicial, ao Luxemburgo, de parte dos recursos a imputar ao exercício orçamental
    de 1988 para o fornecimento de alimentos provenientes de existências de intervenção
    às organizações designadas para distribuição às pessoas mais necessitadas
    na Comunidade'
  type: main
- language: es
  script: Latn
  content: '88/37/CEE: Decisión de la Comisión de 8 de enero de 1988 por la que
    se establece una asignación inicial a Luxemburgo de parte de los recursos con
    cargo al presupuesto de 1988 para el suministro de alimentos procedentes de las
    existencias de intervención a las organizaciones encargadas de su distribución
    a las personas más necesitadas de la Comunidad'
  type: main
