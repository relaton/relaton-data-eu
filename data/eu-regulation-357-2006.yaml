title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 357/2006 of 28 February 2006 amending for
    the 64th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 357/2006 de la Commission du 28 février 2006 modifiant
    pour la soixante-quatrième fois le règlement (CE) n o 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n o 467/2001 du Conseil
  type: main
- language: de
  script: Latn
