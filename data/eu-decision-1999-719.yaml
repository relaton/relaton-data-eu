title:
- language: en
  script: Latn
  content: '1999/719/EC: Commission Decision of 30 March 1999 on State aid which France
    is planning to grant as development aid in the sale of two cruise vessels to be
    built by Chantiers de l''Atlantique and operated by Renaissance Financial in French
    Polynesia (notified under document number C(1999) 903) (Text with EEA relevance)
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/719/CE: Décision de la Commission du 30 mars 1999 concernant l''aide
    d''État que la France envisage d''accorder à titre d''aide au développement
    pour la vente de deux paquebots construits aux Chantiers de l''Atlantique et exploités
    par Renaissance Financial en Polynésie française [notifiée sous le numéro
    C(1999) 903] (Texte présentant de l''intérêt pour l''EEE) (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '1999/719/EG: Entscheidung der Kommission vom 30. März 1999 über das
    Beihilfevorhaben Frankreichs in Form einer Entwicklungshilfe für den Verkauf
    von zwei in den Chantiers de l''Atlantique für Renaissance Financial in Französisch-Polynesien
    gebauten Passagierschiffen (Bekanntgegeben unter Aktenzeichen K(1999) 903) (Text
    von Bedeutung für den EWR) (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '1999/719/EF: Kommissionens beslutning af 30. marts 1999 om den statsstøtte,
    som Frankrig påtænker at yde i form af udviklingsbistand til salg af to krydstogtfartøjer,
    der bygges på Chantiers de l''Atlantique, og som skal benyttes af Renaissance
    Financial i Fransk Polynesien (meddelt under nummer K(1999) 903) (EØS-relevant
    tekst) (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '1999/719/ΕΚ: Απόφαση της Επιτροπής, της 30ής
    Μαρτίου 1999, σχετικά με κρατική ενίσχυση την
    οποία προτίθεται να χορηγήσει η Γαλλία υπό
    μορφή αναπτυξιακής ενίσχυσης για την πώληση
    δύο επιβατικών πλοίων που πρόκειται να κατασκευάσει
    η Chantiers de l''Atlantique και τα οποία θα εκμεταλλεύεται
    η Renaissance Financial στη Γαλλική Πολυνησία [κοινοποιηθείσα
    υπό τον αριθμό Ε(1999) 903] (Κείμενο που παρουσιάζει
    ενδιαφέρον για τον ΕΟΧ) (Το κείμενο στη γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '1999/719/EY: Komission päätös, tehty 30 päivänä maaliskuuta 1999,
    Ranskan suunnittelemasta kehitystuesta kahden Chantiers de l''Atlantiquen rakentaman
    ja Renaissance Financialin Ranskan Polynesiassa liikennöimän matkustaja-aluksen
    myyntiin (tiedoksiannettu numerolla K(1999) 903) (ETA:n kannalta merkityksellinen
    teksti) (Ainoastaan ranskankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '1999/719/CE: Decisione della Commissione, del 30 marzo 1999, relativa
    all''aiuto di Stato che la Francia intende accordare, come aiuto allo sviluppo,
    per la vendita di due navi costruite negli «Chantiers de l''Atlantique" e gestite
    da «Renaissance Financial" nella Polinesia francese [notificata con il numero
    C(1999) 903] (Testo rilevante ai fini del SEE) (Il testo in lingua francese è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '1999/719/EG: Beschikking van de Commissie van 30 maart 1999 inzake de
    staatssteun die Frankrijk voornemens is om bij wijze van ontwikkelingshulp te
    verlenen voor de verkoop van twee passagiersschepen die door Chantiers de l''Atlantique
    worden gebouwd en door Renaissance Financial in Frans-Polynesië worden geëxploiteerd
    (Kennisgeving geschied onder nummer C(1999) 903) (Voor de EER relevante tekst)
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '1999/719/CE: Decisão da Comissão, de 30 de Março de 1999, relativa
    ao auxílio estatal que a França tenciona conceder a título de ajuda ao desenvolvimento
    à venda de dois navios construídos nos Chantiers de l''Atlantique e explorados
    pela Renaissance Financial na Polinésia francesa [notificada com o número C(1999)
    903] (Texto relevante para efeitos do EEE) (Apenas faz fé o texto em língua
    francesa)'
  type: main
- language: es
  script: Latn
  content: '1999/719/CE: Decisión de la Comisión, de 30 de marzo de 1999, relativa
    a la ayuda estatal que Francia prevé conceder como ayuda al desarrollo para la
    venta de dos paquebotes construidos en Chantiers de l''Atlantique y explotados
    por Renaissance Financial en la Polinesia Francesa [notificada con el número
    C(1999) 903] (Texto pertinente a efectos del EEE) (El texto en lengua francesa
    es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '1999/719/EG: Kommissionens beslut av den 30 mars 1999 om det statsstöd
    som Frankrike planerar att bevilja som utvecklingsbistånd för försäljningen
    av två kryssningsfartyg byggda vid Chantiers de l''Atlantique för Renaissance
    Financial som skulle bedriva verksamhet med fartygen i franska Polynesien [delgivet
    med nr K(1999) 903] (Text av betydelse för EES) (Endast den franska texten är
    giltig)'
