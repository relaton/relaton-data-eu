  content: Commission Regulation (EC) No 2387/96 of 16 December 1996 amending Regulation
    (EC) No 666/96 laying down detailed rules for the application of Regulation (EC)
    No 447/96 laying down special measures for the import of olive oil from Tunisia
    and amending Regulation (EC) No 1477/95 laying down certain transitional measures
    for the implementation of the Uruguay Round Agreement on agriculture as regards
    olive oil
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2387/96 de la Commission du 16 décembre 1996 modifiant
    le règlement (CE) nº 666/96 portant modalités d'application du règlement (CE)
    nº 447/96 prévoyant des mesures spéciales pour l'importation d'huile d'olive
    originaire de Tunisie et modifiant le règlement (CE) nº 1477/95 portant certaines
    mesures transitoires relatives à la mise en oeuvre de l'accord agricole du cycle
    d'Uruguay dans le secteur de l'huile d'olive
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2387/96 der Kommission vom 16. Dezember 1996 zur Änderung
