  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2387/96, annettu 16 päivänä joulukuuta 1996,
    Tunisiasta peräisin olevan oliiviöljyn tuontia koskevista erityistoimenpiteistä
    annetun asetuksen (EY) N:o 447/96 yksityiskohtaisista soveltamissäännöistä
    ja Uruguayn kierroksen maataloussopimuksen täytäntöönpanoon liittyvistä tietyistä
    siirtymätoimenpiteistä annetun asetuksen (EY) N:o 1477/95 muuttamisesta annetun
    asetuksen (EY) N:o 666/96 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2387/96 della Commissione del 16 dicembre 1996 che
    modifica il regolamento (CE) n. 666/96 recante modalità d'applicazione del regolamento
    (CE) n. 447/96 recante misure speciali per l'importazione di olio d'oliva originario
    della Tunisia e recante modifica del regolamento (CE) n. 1477/95 recante misure
    transitorie relative all'attuazione dell'accordo sull'agricoltura dell'Uruguay
    Round nel settore dell'olio d'oliva
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2387/96 van de Commissie van 16 december 1996 tot
    wijziging van Verordening (EG) nr. 666/96 houdende uitvoeringsbepalingen van Verordening
    (EG) nr. 447/96 tot vaststelling van bijzondere maatregelen voor de uitvoer van
    olijfolie van oorsprong uit Tunesië en houdende wijziging van Verordening (EG)
