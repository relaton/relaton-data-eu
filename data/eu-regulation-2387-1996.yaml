    van de landbouwovereenkomst in het kader van de Uruguay-Ronde, in de sector olijfolie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2387/96 da Comissão de 16 de Dezembro de 1996 que
    altera o Regulamento (CE) nº 666/96 que estabelece as normas de execução do
    Regulamento (CE) nº 447/96, que prevê medidas especiais para a importação
    de azeite originário da Tunísia e que altera o Regulamento (CE) nº 1477/95,
    que estabelece certas medidas transitórias relativas à execução do acordo
    agrícola do «Uruguay Round» no sector do azeite
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2387/96 de la Comisión de 16 de diciembre de 1996
    por el que se modifica el Reglamento (CE) nº 666/96 por el que se establecen
    disposiciones de aplicación del Reglamento (CE) nº 447/96 del Consejo por el
    que se establecen medidas especiales para la importación de aceite de oliva originario
    de Túnez y se modifica el Reglamento (CE) nº 1477/95 por el que se establecen
    medidas transitorias para la aplicación del Acuerdo agrícola de la Ronda Uruguay
    en el sector del aceite de oliva
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2387/96 av den 16 december 1996 om ändring
