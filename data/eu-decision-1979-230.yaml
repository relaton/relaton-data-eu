title:
- language: en
  script: Latn
  content: '79/230/EEC: Commission Decision of 12 February 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to bed linen, woven, falling within subheading ex
    62.02 B of the Common Customs Tariff (NIMEXE codes 62.02-11, 19) (category 20),
    originating in Romania and in free circulation in the other Member States (Only
    the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/230/CEE: Décision de la Commission, du 12 février 1979, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le linge de lit, tissé, de la sous-position
    ex 62.02 B du tarif douanier commun (codes Nimexe: 62.02-11, 19) catégorie 20,
    originaire de Roumanie et mis en libre pratique dans les autres États membres
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/230/EWG: Entscheidung der Kommission vom 12. Februar 1979, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bettwäsche aus Geweben der Tarifnummer ex 62.02
    B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 62.02-11; 19) (Kategorie 20)
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/230/EØF: Kommissionens beslutning af 12. februar 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage sengelinned, vævet, som henhører under
    pos. ex 62.02 B i den fælles toldtarif (NIMEXE-kode 62.02-11, 19) kategori 20,
    har oprindelse i Rumænien og frit kan omsættes i de øvrige medlemsstater (Kun
    den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/230/CEE: Decisione della Commissione, del 12 febbraio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario la biancheria da letto, tessuta, della
    sottovoce ex 62.02 B della tariffa doganale comune (codice Nimexe: 62.02-11, 19)
    (categoria 20), originaria della Romania e messa in libera pratica negli altri
    Stati membri (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/230/EEG: Beschikking van de Commissie van 12 februari 1979 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd beddelinnen van post ex 62.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 62.02-11, 19) (categorie 20), van oorsprong uit Roemenië en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
