title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 130/2001 of 23 January 2001 determining the
    extent to which the applications for import licences submitted in January 2001
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 1374/98 can be accepted
  type: main
- language: fr
  script: Latn
