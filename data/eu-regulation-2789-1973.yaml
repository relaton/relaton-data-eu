title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2789/73 of the Commission of 12 October 1973 re-establishing
    Common Customs Tariff duties on image projectors (other than cinematographic projectors)
    etc falling within CCT heading No 90.09, originating in developing countries to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2789/73 de la Commission, du 12 octobre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux appareils de projection fixe, etc., de la position tarifaire 90.09, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2789/73 der Kommission vom 12. Oktober 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Stehbildwerfer usw., der Tarifnummer
    90.09, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2789/73 af 12. oktober 1973 om genindførelse
    af told ifølge den fælles toldtarif for lysbilledapparater; forstørrelses-
    og formindskelsesapparater til fotografisk brug (undtagen kinematografiske) under
    position 90.09 som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2789/73 della Commissione, del 12 ottobre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    apparecchi di proiezione fissa, ecc., della voce doganale 90.09, originari dei
    paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2789/73 van de Commissie van 12 oktober 1973 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor projectietoestellen voor niet bewegende beelden, enzovoort van post 90.09,
    van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2762/72 van de Raad van 19 december 1972 tariefpreferenties werden geopend
  type: main
