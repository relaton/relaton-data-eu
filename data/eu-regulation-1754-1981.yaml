title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1754/81 of 30 June 1981 derogating from
    Regulations (EEC) No 1569/77 and (EEC) No 1629/77 as regards the minimum quantity
    of cereals which may be taken over by the Greek intervention agency
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1754/81 de la Commission, du 30 juin 1981, dérogeant
    aux règlements (CEE) n° 1569/77 et (CEE) n° 1629/77 en ce qui concerne la quantité
    minimale de céréales pouvant être prise en charge par l' organisme d' intervention
    grec
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1754/81 der Kommission vom 30. Juni 1981 über eine
    Abweichung von den Verordnungen (EWG) Nr. 1569/77 und (EWG) Nr. 1629/77 hinsichtlich
    der Mindestmenge Getreide, das von der griechischen Interventionsstelle übernommen
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1754/81 af 30. juni 1981 om undtagelse
    fra forordning (EØF) nr. 1569/77 og (EØF) nr. 1629/77 for så vidt angår den
    minimumsmængde af korn, der kan overtages af det græske interventionsorgan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1754/81 τής Επιτροπής
    τής 30ής Ιουνίου 1981 περί παρεκκλίσεως από τούς
    κανονισμούς (ΕΟΚ) αριθ. 1569/77 καί (ΕΟΚ) αριθ. 1629/77
    σχετικά μέ τήν ελάχιστη ποσότητα σιτηρών πού
    μπορεί νά αναληφθεί από τόν ελληνικό οργανισμό
    παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1754/81 della Commissione, del 30 giugno 1981, che
    deroga ai regolamenti (CEE) n. 1569/77 e (CEE) n. 1629/77 per quanto riguarda
    la quantità minima di cereali che può essere presa in consegna dall' organismo
    d' intervento greco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1754/81 van de Commissie van 30 juni 1981 houdende
    afwijking van de Verordeningen (EEG) nr. 1569/77 en (EEG) nr. 1629/77 met betrekking
    tot de minimumhoeveelheid graan die door het Griekse interventiebureau mag worden
    overgenomen
