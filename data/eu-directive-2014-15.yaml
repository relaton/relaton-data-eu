id: EUDirective201415
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/15/EU of 18 October 2013 amending,
    for the purposes of adapting to technical progress, the Annex IV to Directive
    2011/65/EU of the European Parliament and of the Council as regards an exemption
    for lead, cadmium and hexavalent chromium in reused spare parts, recovered from
    medical devices placed on the market before 22 July 2014 and used in category
    8 equipment placed on the market before 22 July 2021 , provided that reuse takes
    place in auditable closed-loop business-to-business return systems, and that the
    reuse of parts is notified to the consumer
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/15/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb, le cadmium et le chrome hexavalent dans les pièces détachées
    réemployées, récupérées sur des dispositifs médicaux mis sur le marché
    avant le 22 juillet 2014 et utilisées dans des équipements de la catégorie
    8 mis sur le marché avant le 22 juillet 2021 , à condition que ce réemploi
    s’effectue dans le cadre de systèmes de récupération interentreprises en
    circuit fermé et contrôlables et que le réemploi des pièces soit notifié
    aux consommateurs
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/15/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei, Cadmium und sechswertiges Chrom in wiederverwendeten
    Ersatzteilen, die aus vor dem 22. Juli 2014 in den Verkehr gebrachten medizinischen
    Geräten ausgebaut werden und in vor dem 22. Juli 2021 in den Verkehr gebrachten
    Geräten der Kategorie 8 verwendet werden, sofern die Wiederverwendung in einem
    überprüfbaren geschlossenen zwischenbetrieblichen System erfolgt und den Verbrauchern
    mitgeteilt wird, dass Teile wiederverwendet wurden
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/15/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово,
    кадмий и шествалентен хром в повторно използвани
    резервни части, произхождащи от медицински
    апарати, пуснати на пазара преди 22 юли 2014 г.
    , и вложени в изделия от категория 8, пуснати
    на пазара преди 22 юли 2021 г. , при условие че повторната
    употреба се извършва в рамките на одитируеми
    междуфирмени системи със затворен цикъл за
    връщане на резервните части, както и че наличието
    на повторно използвани резервни части се обявява
    на потребителя
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/15/EU ze dne 18. října
    2013 , kterou se z důvodu přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    olovo, kadmium a šestimocný chrom obsažený v opětovně používaných náhradních
    dílech, získaných ze zdravotnických prostředků uvedených na trh před 22.
    červencem 2014 a používaných v kategorii 8 zařízení uvedeného na trh před
    22. červencem 2021 za podmínky, že se opětovné použití uskutečňuje v
    rámci kontrolovatelného uzavřeného systému zpětného odběru mezi podniky
    a že spotřebitel je o opětovném použití dílů informován
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/15/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår en undtagelse for bly, cadmium og hexavalent chrom
    i genanvendte reservedele, der er udtaget fra medicinsk udstyr, der er bragt i
    omsætning før den 22. juli 2014 , til anvendelse i udstyr i kategori 8, der
    er bragt i omsætning før den 22. juli 2021 , forudsat at genanvendelsen foregår
    i lukkede kontrollerbare virksomhed-til-virksomhed-retursystemer, og at forbrugeren
    bliver underrettet om, at dele bliver genanvendt
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/15/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση του
    παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για «μόλυβδο, κάδμιο και εξασθενές
    χρώμιο σε επαναχρησιμοποιούμενα ανταλλακτικά,
    ανακτηθέντα από ιατρικές συσκευές που διατίθενται
    στην αγορά πριν τις 22 Ιουλίου 2014 και χρησιμοποιούνται
    σε εξοπλισμό κατηγορίας 8 που διατίθεται στην
    αγορά πριν τις 22 Ιουλίου 2021 , υπό την προϋπόθεση
    ότι η επαναχρησιμοποίηση αυτή γίνεται στο
    πλαίσιο ελεγχόμενων διεπιχειρησιακών συστημάτων
    επιστροφής κλειστού βρόχου και ότι η επαναχρησιμοποίηση
    ανταλλακτικών γνωστοποιείται στον καταναλωτή»
    , με σκοπό την προσαρμογή στην τεχνική πρόοδο
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/15/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii, kaadmiumi ja
    kuuevalentse kroomi kasutamist korduskasutusse võetud varuosades, mis pärinevad
    enne 22. juulit 2014 turule lastud meditsiiniseadmetest ja mida kasutatakse enne
    22. juulit 2021 turule lastavates rühma 8 kuuluvates seadmetes, tingimusel et
    korduskasutamine toimub auditeeritavates ettevõtetevahelistes suletud ahelana
    toimivates tagastussüsteemides ja tarbijat teavitatakse osade korduskasutamisest
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/15/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä, kadmiumia ja kuudenarvoista kromia uudelleen käytettävissä varaosissa,
    jotka otetaan talteen ennen 22 päivää heinäkuuta 2014 markkinoille saatetuista
    lääkinnällisistä laitteista ja joita käytetään ennen 22 päivää heinäkuuta
    2021 markkinoille saatettavissa luokan 8 laitteissa edellyttäen, että uudelleenkäyttö
    tapahtuu tarkastettavissa olevassa yritysten välisessä suljetussa palautusjärjestelmässä
    ja että osien uudelleenkäytöstä ilmoitetaan kuluttajille
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/15/EU оd 18. listopada 2013. o izmjeni,
    u svrhe prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća s obzirom na izuzeće za olovo, kadmij i heksavalentni krom
    u zamjenskim dijelovima koji se ponovno upotrebljavaju, a dobiveni su iz medicinskih
    uređaja stavljenih na tržište prije 22. srpnja 2014. i koji se koriste u kategoriji
    8 opreme stavljene na tržište prije 22. srpnja 2021. , pod uvjetom da se ponovna
    uporaba odvija u povratnim sustavima zatvorene petlje poslovanja između tvrtki
    koji se mogu provjeravati, i da se potrošači obavijeste o ponovnoj uporabi dijelova
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/15/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a 2014. július 22. előtt forgalomba hozott orvostechnikai eszközökből nyert
    és a 8. kategóriába tartozó, 2021. július 22. előtt forgalomba hozott eszközökben
    újrafelhasznált cserealkatrészekben – amennyiben az újrafelhasználásra
    vállalatok közötti, ellenőrizhető zárt csererendszereken belül kerül sor,
    valamint az alkatrészek újrafelhasználásáról értesítik a fogyasztót –
    lévő ólom, kadmium és hat vegyértékű króm mentesítése tekintetében,
    a műszaki fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/15/UE della Commissione, del 18 ottobre 2013 ,
    che modifica, per adeguarlo al progresso tecnico, l’allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione
    relativa a piombo, cadmio e cromo esavalente nei pezzi di ricambio riutilizzati,
    recuperati da dispositivi medici immessi sul mercato anteriormente al 22 luglio
    2014 e utilizzati nelle apparecchiature appartenenti alla categoria 8 immesse
    sul mercato anteriormente al 22 luglio 2021 , purché il riutilizzo avvenga in
    sistemi controllabili di restituzione a circuito chiuso da impresa a impresa e
    che la presenza di parti riutilizzate sia comunicata al consumatore
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/15/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam, kadmijam
    un sešvērtīgajam hromam atkārtoti izmantotās rezerves detaļās, kas iegūtas
    no medicīnas ierīcēm, kuras laistas tirgū pirms 2014. gada 22. jūlija un
    tiks izmantotas 8. kategorijas iekārtās, kuras laistas tirgū pirms 2021. gada
    22. jūlija , ar nosacījumu, ka minētā atkārtotā izmantošana notiek revidējamās
    slēgta cikla uzņēmumu mijmaiņas sistēmās un ka par detaļu atkārtoto izmantošanu
    ir paziņots patērētājam
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/15/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną, kadmį ir šešiavalentį chromą pakartotinai naudojamose atsarginėse
    dalyse, paimtose iš medicinos prietaisų, pateiktų rinkai iki 2014 m. liepos
    22 d. , naudojamose 8 kategorijos įrangoje, pateiktoje rinkai iki 2021 m. liepos
    22 d. , jei pakartotinis naudojimas vyksta uždaros patikrinamos grandinės principu
    veikiančioje „verslas verslui“ surinkimo sistemoje ir jei vartotojas informuojamas
    apie pakartotinį atsarginių dalių naudojimą
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/15/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb, kadmju u kromju eżavalenti fil-parts ta’ sostituzzjoni
    użati mill-ġdid, irkuprati minn tagħmir mediku mqiegħed fis-suq qabel it-
    22 ta’ Lulju 2014 u użat f’tagħmir tal-kategorija 8 mqiegħed fis-suq qabel
    it- 22 ta’ Lulju 2021 , bil-kundizzjoni li dan l-użu mill-ġdid iseħħ f’sistemi
    ta’ rkupru bejn negozji b’ċiklu magħluq u verifikabbli, u li l-użu mill-ġdid
    tal-partijiet jiġi nnotifikat lill-konsumatur
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/15/EU van de Commissie van 18 oktober 2013
    tot wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood, cadmium en zeswaardig chroom in hergebruikte reserveonderdelen
    afkomstig uit vóór 22 juli 2014 in de handel gebrachte medische hulpmiddelen
    die worden hergebruikt bij vóór 22 juli 2021 in de handel gebrachte apparatuur
    van categorie 8, mits het hergebruik plaatsvindt in controleerbare, gesloten business-to-business
    inruilsystemen en het hergebruik van onderdelen kenbaar wordt gemaakt aan de consument
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/15/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu, kadmu i sześciowartościowego chromu w częściach zamiennych służących
    do ponownego użycia, odzyskanych z wyrobów medycznych wprowadzonych do obrotu
    przed dniem 22 lipca 2014 r. i wykorzystywanych w sprzęcie objętym kategorią
    8, wprowadzonym do obrotu przed dniem 22 lipca 2021 r. , pod warunkiem że ponowne
    wykorzystanie odbywa się w zamkniętym systemie handlowym przyjmowania zwrotów,
    podlegającym kontroli, a konsument został powiadomiony o zastosowaniu części
    przeznaczonych do ponownego użycia
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/15/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para a utilização de chumbo, cádmio e crómio hexavalente em peças sobresselentes
    reutilizadas, recuperadas de dispositivos médicos colocados no mercado antes
    de 22 de julho de 2014 , e utilizadas em equipamentos da categoria 8 colocados
    no mercado antes de 22 de julho de 2021 , desde que a reutilização tenha lugar
    no âmbito de sistemas fechados de retorno interempresas, passíveis de controlo,
    e que o consumidor seja informado da reutilização de peças
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/15/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul, cadmiul și cromul hexavalent din piesele de schimb reutilizate, recuperate
    din dispozitivele medicale introduse pe piață înainte de 22 iulie 2014 și
    utilizate în echipamentele din categoria 8 introduse pe piață înainte de 22
    iulie 2021 , cu condiția ca reutilizarea să aibă loc în cadrul unor sisteme
    de returnare, cu circuit închis și auditabile, între întreprinderi, iar consumatorul
    să fie înștiințat de reutilizarea pieselor
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/15/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo, kadmium a šesťmocný
    chróm v opätovne použitých náhradných dieloch získaných zo zdravotníckych
    prístrojov uvedených na trh pred 22. júlom 2014 a použitých v prístrojoch
    kategórie 8 uvedených na trh pred 22. júlom 2021 za predpokladu, že opätovné
    použitie sa uskutočňuje v rámci kontrolovateľného uzatvoreného systému
    spätného odberu medzi podnikmi a že spotrebiteľ je o opätovnom použití
    náhradných dielov informovaný
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/15/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjem za
    svinec, kadmij in šestvalentni krom v ponovno uporabljenih rezervnih delih iz
    medicinskih pripomočkov, danih na trg pred 22. julijem 2014 , in uporabljenih
    v opremi kategorije 8, dani na trg pred 22. julijem 2021 , če ponovna uporaba
    poteka v zaprtem sistemu poslovanja med podjetji, ki ga je mogoče nadzirati,
    in če je potrošnik obveščen o ponovni uporabi, zaradi prilagoditve tehničnemu
    napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/15/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo, cadmio y cromo hexavalente en piezas de repuesto reutilizadas,
    procedentes de productos sanitarios comercializados antes del 22 de julio de 2014
    y utilizadas como parte de aparatos de la categoría 8 comercializados antes del
    22 de julio de 2021 , siempre que la reutilización se enmarque en sistemas de
    recuperación interempresas de circuito cerrado que puedan ser objeto de control,
    y que la reutilización de dichas piezas se notifique al consumidor
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/15/EU av den 18 oktober 2013 om
    ändring, för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly, kadmium och sexvärt
    krom i återanvända reservdelar som återvunnits från medicintekniska produkter
    som släppts ut på marknaden före den 22 juli 2014 och som används i kategori
    8-utrustning som släpps ut på marknaden före den 22 juli 2021 , förutsatt
    att återanvändningen görs i sådana slutna kretslopp företag emellan som kan
    underkastas granskning, och att konsumenten får reda på att delar har återanvänts
  type: main
