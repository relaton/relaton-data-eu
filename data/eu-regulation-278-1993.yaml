  content: Commission Regulation (EEC) No 278/93 of 8 February 1993 derogating from
    Regulation (EEC) No 3115/92 fixing, for the 1992/93 marketing year, the minimum
    purchase price for oranges delivered for processing and the financial compensation
    for oranges payable after processing and from Regulation (EEC) No 1562/85 with
    regard to information to be supplied to the Commission
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 278/93 de la Commission, du 8 février 1993, dérogeant
    au règlement (CEE) n° 3115/92 fixant, pour la campagne 1992/1993, le prix d'
    achat minimal des oranges, livrées à la transformation et le montant de la compensation
    financière après transformation de ces oranges ainsi qu' au règlement (CEE)
    n° 1562/85 en ce qui concerne les informations à fournir à la Commission
  type: main
