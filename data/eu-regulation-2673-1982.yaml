title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2673/82 of 4 October 1982 fixing for the 1982/83
    marketing year the representative market price and the threshold price for olive
    oil and the percentages of the consumption aid to be retained in accordance with
    Article 11 (5) and (6) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2673/82 du Conseil, du 4 octobre 1982, fixant, pour
    la campagne de commercialisation 1982/1983, le prix représentatif de marché
    et le prix de seuil de l' huile d' olive ainsi que les pourcentages du montant
    de l' aide à la consommation à retenir conformément à l' article 11 paragraphes
    5 et 6 du règlement n° 136/66/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2673/82 des Rates vom 4. Oktober 1982 zur Festsetzung
    des repräsentativen Marktpreises und des Schwellenpreises für Olivenöl sowie
    der gemäß Artikel 11 Absätze 5 und 6 der Verordnung Nr. 136/66/EWG vom Betrag
    der Verbrauchsbeihilfe einzubehaltenden Prozentsätze für das Wirtschaftsjahr
    1982/83
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2673/82 af 4. oktober 1982 om fastsættelse
    for produktionsåret 1982/1983 af den repræsentative markedspris og tærskelprisen
    for olivenolie, samt af de procentdele af forbrugsstøtten, der skal tilbageholdes
    i henhold til artikel 11, stk. 5 og 6, i forordning nr. 136/66/EØF
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2673/82 τού Συμβουλίου
    τής 4ης Οκτωβρίου 1982 περί καθορισμού τής αντιπροσωπευτικής
    τιμής αγοράς καί τής τιμής κατωφλίου τού ελαιολάδου
    γιά τήν περίοδο εμπορίας 1982/83, καθώς καί τών
    ποσοστών τού ποσού τής ενισχύσεως στήν κατανάλωση
    πού πρέπει νά καθορισθούν σύμφωνα μέ τό άρθρο
    11 παράγραφοι 5 καί 6 τού κανονισμού αριθ. 136/66/EOK
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2673/82 del Consiglio, del 4 ottobre 1982, che fissa,
    per la campagna di commercializzazione 1982/1983, il prezzo rappresentativo di
    mercato e il prezzo d' entrata dell' olio d' oliva, nonché le percentuali dell'
    importo dell' aiuto al consumo da adottare in conformità dell' articolo 11, paragrafi
    5 e 6, del regolamento n. 136/66/CEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2673/82 van de Raad van 4 oktober 1982 houdende vatstelling
    voor het verkoopseizoen 1982/1983 van de representatieve marktprijs en de drempelprijs
    voor olijfolie en van de overeenkomstig artikel 11, lid 5 en lid 6, van Verordening
    nr. 136/66/EEG in te houden percentages van het bedrag van de consumptiesteun
