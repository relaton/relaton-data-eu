title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3059/83 of 17 October 1983 opening, allocating
    and providing for the administration of a Community tariff quota for ferro-chromium
    containing not more than 0,10 % by weight of carbon and more than 30 % but not
    more than 90 % by weight of chromium (super-refined ferro-chromium), falling within
    subheading ex 73.02 E I of the Common Customs Tariff (1984)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3059/83 du Conseil du 17 octobre 1983 portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de ferrochrome
    contenant en poids 0,10 % ou moins de carbone et plus de 30 %, jusqu' à 90 %
    inclus, de chrome (ferrochrome surraffiné) de la sous-position ex 73.02 E I du
    tarif douanier commun (1984)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3059/83 des Rates vom 17. Oktober 1983 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom mit
    einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und an
    Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs (1984)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3059/83 af 17. oktober 1983 om åbning, fordeling
    og forvaltning af et fællesskabstoldkontingent for ferrochrom med et kulstofindhold
    på 0,10 vægtprocent eller derunder og med et indhold af chrom (raffineret ferrochrom)
    på over 30 %, men højst 90 %, henhørende under pos. ex 73.02 E I i den fælles
    toldtarif (1984)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3059/83 του Συμβουλίου
    της 17ης Οκτωβρίου 1983 περί ανοίγματος, κατανομής
    και τρόπου διαχειρίσεως κοινοτικής δασμολογικής
    ποσοστώσεως για το σιδηροχρώμιο που περιέχει
    κατά βάρος 0,10 ή λιγότερο άνθρακα και πλέον
    του 30 μέχρι 90 , περιλαμβανομένου, χρώμιο (σιδηροχρώμιο
    επαναδιυλισμένο), της διακρίσεως ex 73.02 Ε Ι του
    Κοινού Δασμολογίου (1984)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3059/83 del Consiglio del 17 ottobre 1983 relativo
    all' apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10 % o meno di
    carbonio e oltre il 30 % sino al 90 % incluso di cromo (ferro-cromo superraffinato),
    della sottovoce ex 73.02 E I della tariffa doganale comune (1984)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3059/83 van de Raad van 17 oktober 1983 betreffende
    de opening, de verdeling en de wijze van beheer van het communautair tariefcontingent
    voor ferrochroom, bevattende 0,1 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hoog-geraffineerd ferrochroom),
    van post ex 73.02 E I van het gemeenschappelijk douanetarief (1984)
