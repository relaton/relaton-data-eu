    de productos para la salud y equipo doméstico de terapia por luz
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/6 av den 4 januari 2022 om
    ändring av genomförandebeslut (EU) 2021/1182 vad gäller harmoniserade standarder
    för biologisk värdering av medicintekniska produkter, sterilisering av medicintekniska
    produkter, aseptisk behandling av medicintekniska produkter, ledningssystem för
