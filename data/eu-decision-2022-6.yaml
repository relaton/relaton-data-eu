    sa mení vykonávacie rozhodnutie (EÚ) 2021/1182, pokiaľ ide o harmonizované
    normy pre biologické hodnotenie zdravotníckych pomôcok, sterilizáciu výrobkov
    na zdravotnú starostlivosť, aseptické spracovanie výrobkov na zdravotnú starostlivosť,
    systémy manažérstva kvality, značky na použitie s informáciami poskytovanými
    výrobcom, úpravu výrobkov na zdravotnú starostlivosť a prístroje na domácu
    svetelnú terapiu
  type: main
