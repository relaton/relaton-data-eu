    értékelésére, az egészségügyi termékek sterilizálására, az egészségügyi
    termékek aszeptikus kezelésére, a minőségirányítási rendszerekre, a gyártó
    tájékoztatóiban használandó szimbólumokra, az egészségügyi termékek
    feldolgozására és az otthoni használatra szánt fényterápiás készülékekre
    vonatkozó harmonizált szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/6 della Commissione del 4 gennaio 2022
    che modifica la decisione di esecuzione (UE) 2021/1182 per quanto riguarda le
    norme armonizzate per la valutazione biologica dei dispositivi medici, la sterilizzazione
    dei dispositivi medici e dei prodotti per la cura della salute, il trattamento
    asettico dei prodotti per la cura della salute, i sistemi di gestione per la qualità,
    i simboli da utilizzare nelle informazioni che devono essere fornite da parte
    del fabbricante, il condizionamento dei prodotti per la cura della salute e gli
    apparecchi per fototerapia ad uso domiciliare
  type: main
- language: lv
  script: Latn
