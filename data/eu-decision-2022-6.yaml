    за домашно лечение със светлина
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/6 ze dne 4. ledna 2022, kterým
    se mění prováděcí rozhodnutí (EU) 2021/1182, pokud jde o harmonizované
    normy pro biologické hodnocení zdravotnických prostředků, sterilizaci výrobků
    pro zdravotní péči, aseptické zpracování výrobků pro zdravotní péči,
    systémy managementu kvality, značky, které mají být používány s informacemi
    poskytovanými výrobcem, zpracování výrobků pro zdravotní péči a přístroje
    pro domácí světelnou terapii
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/6 af 4. januar 2022 om
