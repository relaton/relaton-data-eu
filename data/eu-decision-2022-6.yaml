title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/6 of 4 January 2022 amending
    Implementing Decision (EU) 2021/1182 as regards harmonised standards for biological
    evaluation of medical devices, sterilisation of health care products, aseptic
    processing of health care products, quality management systems, symbols to be
    used with information to be supplied by the manufacturer, processing of health
    care products and home light therapy equipment
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/6 de la Commission du 4 janvier 2022
    modifiant la décision d’exécution (UE) 2021/1182 en ce qui concerne les normes
    harmonisées pour l’évaluation biologique des dispositifs médicaux, la stérilisation
    des produits de santé, le traitement aseptique des produits de santé, les systèmes
    de management de la qualité, les symboles à utiliser avec les informations à
    fournir par le fabricant, le traitement de produits de soins de santé et les
    appareils de luminothérapie à domicile
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/6 der Kommission vom 4. Januar 2022 zur
