  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/6 z dne 4. januarja 2022 o spremembi
    Izvedbenega sklepa (EU) 2021/1182 glede harmoniziranih standardov za biološko
    ovrednotenje medicinskih pripomočkov, sterilizacijo izdelkov za zdravstveno nego,
    aseptično proizvodnjo izdelkov za zdravstveno nego, sisteme vodenja kakovosti,
    simbole za označevanje podatkov, ki jih mora podati dobavitelj, proizvodnjo izdelkov
    za zdravstveno nego in opremo za svetlobno terapijo na domu
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/6 de la Comisión de 4 de enero de 2022
    por la que se modifica la Decisión de Ejecución (UE) 2021/1182 en lo que respecta
    a las normas armonizadas sobre evaluación biológica de productos sanitarios,
    esterilización de productos para la salud, procesado aséptico de productos para
    la salud, sistemas de gestión de la calidad, símbolos a utilizar en las etiquetas,
