    (sealhulgas nektariinide), pirnide ja lauaviinamarjade suhtes kohaldatavate täiendavate
    tollimaksude käivitusläve osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 589/2007, annettu 30 päivänä toukokuuta 2007
