    cla pro rajčata, meruňky, citrony, švestky, broskve, včetně nektarinek, hrušky
    a stolní hrozny
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 589/2007 af 30. maj 2007 om ændring
