    dos direitos adicionais aplicáveis aos tomates, aos damascos, aos limões, às
    ameixas, aos pêssegos, incluindo as nectarinas, às peras e às uvas de mesa
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 589/2007 al Comisiei din 30 mai 2007 de modificare
    a Regulamentului (CE) nr. 1555/96 în ceea ce privește nivelurile de declanșare
    a drepturilor suplimentare pentru tomate, caise, lămâi, prune, piersici, inclusiv
    piersici fără puf și nectarine, pere și struguri de masă
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 589/2007 z 30. mája 2007 , ktorým sa mení
