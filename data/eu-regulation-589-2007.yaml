    id-dazji addizzjonali għal-lanġas, il-berquq, il-lumi, l-għanbaqar, il-ħawħ,
    inkluż in-nuċiprisk, il-lanġas u l-għeneb tal-mejda
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 589/2007 van de Commissie van 30 mei 2007 tot wijziging
    van Verordening (EG) nr. 1555/96 met betrekking tot de drempelvolumes voor de
    toepassing van de aanvullende rechten voor tomaten, abrikozen, citroenen, pruimen,
    perziken (nectarines daaronder begrepen), peren en tafeldruiven
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 589/2007 z dnia 30 maja 2007 r. zmieniające
