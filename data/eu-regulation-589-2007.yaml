    ciel na rajčiny, marhule, citróny, slivky, broskyne vrátane nektáriniek a
    iných odrôd, hrušky a stolové hrozno
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 589/2007 z dne 30. maja 2007 o spremembah Uredbe
