    za pomidory, morele, cytryny, śliwki, brzoskwinie włącznie z nektarynami, gruszki
    i winogrona stołowe
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 589/2007 da Comissão, de 30 de Maio de 2007 , que
