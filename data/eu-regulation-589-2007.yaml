title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 589/2007 of 30 May 2007 amending Regulation
    (EC) No 1555/96 as regards the trigger levels for additional duties on tomatoes,
    apricots, lemons, plums, peaches, including nectarines, pears and table grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 589/2007 de la Commission du 30 mai 2007 modifiant
    le règlement (CE) n o 1555/96, en ce qui concerne le volume de déclenchement
    des droits additionnels pour les tomates, les abricots, les citrons, les prunes,
    les pêches, y compris les brugnons et les nectarines, les poires et les raisins
    de table
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 589/2007 der Kommission vom 30. Mai 2007 zur Änderung
    der Verordnung (EG) Nr. 1555/96 in Bezug auf die Auslösungsschwellen für die
    Zusatzzölle für Tomaten/Paradeiser, Aprikosen/Marillen, Zitronen, Pflaumen,
    Pfirsiche, einschließlich Brugnolen und Nektarinen, Birnen und Tafeltrauben
  type: main
