  content: Commission Delegated Regulation (EU) 2021/139 of 4 December 2020 amending
    Annexes I and V to Regulation (EU) 2019/125 concerning trade in certain goods
    which could be used for capital punishment, torture or other cruel, inhuman or
    degrading treatment or punishment to take into account the withdrawal of the United
    Kingdom from the Union
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/139 de la Commission du 4 décembre 2020
    modifiant les annexes I et V du règlement (UE) 2019/125 concernant le commerce
    de certains biens susceptibles d’être utilisés en vue d’infliger la peine
    capitale, la torture ou d’autres peines ou traitements cruels, inhumains ou
    dégradants afin de tenir compte du retrait du Royaume-Uni de l’Union
  type: main
- language: de
  script: Latn
