  content: Commission Regulation (EEC) No 2216/91 of 24 July 1991 re-establishing
    the levying of customs duties on products of categories 29, 72 and 78 (order Nos
    40.0290, 40.0720 and 40.0780), originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 2216/91 de la Commission, du 24 juillet 1991, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 29 (numéro d' ordre 40.0290), 72 (numéro d' ordre 40.0720) et
    78 (numéro d' ordre 40.0780) originaires de la Thaïlande, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) nº 3832/90 du Conseil
  type: main
- language: de
  script: Latn
