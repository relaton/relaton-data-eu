title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1594/80 of 24 June 1980 fixing, for the 1980/81
    sugar year, the derived intervention prices, the intervention price for raw beet
    sugar, the minimum prices for beet, the threshold prices, the maximum amount of
    the production levy and the amount of the repayment to offset storage costs and
    the coefficient for calculating the special maximum quota
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1594/80 du Conseil, du 24 juin 1980, fixant, pour
    la campagne sucrière 1980/1981, les prix d' intervention dérivés, le prix d'
    intervention pour le sucre de betterave brut, les prix minimaux de la betterave,
    les prix de seuil, le montant maximal de la cotisation à la production, le montant
    du remboursement pour la compensation des frais de stockage ainsi que le coefficient
    de calcul du quota maximal spécial
  type: main
- language: de
  script: Latn
