title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2046/90 of 18 July 1990 determining, for
    tobacco from the 1989 harvest, the quantity actually produced and the prices and
    premiums payable under the system of maximum guaranteed quantities
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2046/90 de la Commission du 18 juillet 1990 établissant,
    pour le tabac de la récolte 1989, la production effective ainsi que les prix
    et les primes à payer en application du régime des quantités maximales garanties
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2046/90 DER KOMMISSION vom 18. Juli 1990 zur Feststellung
    der tatsaechlichen Erzeugung und zur Festsetzung der in Anwendung der Regelung
    der Hoechstgarantiemengen zu zahlenden Preise und Praemien fuer Tabak der Ernte
    1989
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2046/90 af 18. juli 1990 om fastsættelse
    af den faktiske produktion af, samt de priser og præmier, der i henhold til ordningen
    med maksimale garantimængder skal betales for tobak fra 1989-høsten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2046/90 της Επιτροπής
    της 18ης Ιουλίου 1990 περί καθορισμού, για τον
    καπνό της συγκομιδής 1989, της πραγματικής παραγωγής
    καθώς και των τιμών και πριμοδοτήσεων που πληρώνονται
    κατ' εφαρμογή του καθεστώτος των μέγιστων εγγυημένων
    ποσοτήτων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2046/90 DELLA COMMISSIONE del 18 luglio 1990 che stabilisce,
    per il tabacco del raccolto 1989, la produzione effettiva, nonché i prezzi ed
    i premi da pagare in applicazione del regime dei quantitativi massimi garantiti
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2046/90 VAN DE COMMISSIE van 18 juli 1990 tot bepaling
    van de werkelijke produktie voor tabakssoorten van de oogst 1989 en tot vaststelling
    van de geldende prijzen en premies in het kader van de regeling inzake gegarandeerde
    maximumhoeveelheden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2046/90 DA COMISSAO de 18 de Julho de 1990 que estabelece,
    para o tabaco da colheita de 1989, a produçao efectiva, bem como os preços e
    os prémios a pagar em aplicaçao do regime de quantidades maximas garantidas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2046/90 DE LA COMISION de 18 de julio de 1990 por el
    que se establecen, para el tabaco de la cosecha de 1989, la produccion efectiva,
    los precios y las primas que deberan pagarse en aplicacion del régimen de las
    cantidades maximas garantizadas
  type: main
