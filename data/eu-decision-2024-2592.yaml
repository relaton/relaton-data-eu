title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/2592 of 26 September 2024 on the position to
    be taken on behalf of the European Union in reply to the State Letter issued by
    the International Civil Aviation Organization (ICAO) as regards the review of
    limits of liability conducted by the ICAO under Article 24 of the Convention for
    the Unification of Certain Rules for International Carriage by Air (the Montreal
    Convention)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/2592 du Conseil du 26 septembre 2024 relative à la
    position à prendre au nom de l’Union européenne, en réponse à la lettre
    aux États envoyée par l’Organisation de l’aviation civile internationale
    (OACI) en ce qui concerne la révision des limites de responsabilité effectuée
    par l’OACI en vertu de l’article 24 de la convention pour l’unification
    de certaines règles relatives au transport aérien international (convention
    de Montréal)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/2592 des Rates vom 26. September 2024 über den im
    Namen der Europäischen Union als Antwort auf das von der Internationalen Zivilluftfahrt-Organisation
    (ICAO) ausgegebene Rundschreiben zu vertretenden Standpunkt betreffend die Überprüfung
    der Haftungshöchstbeträge, die von der Internationalen Zivilluftfahrt-Organisation
    gemäß Artikel 24 des Übereinkommens zur Vereinheitlichung bestimmter Vorschriften
    über die Beförderung im internationalen Luftverkehr (Übereinkommen von Montreal)
    vorgenommen wird
  type: main
- language: bg
  script: Cyrl
