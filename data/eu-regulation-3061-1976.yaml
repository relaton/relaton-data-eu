  content: Commission Regulation (EEC) No 3061/76 of 14 December 1976 abolishing the
    countervailing charge on mandarins (including tangerines and satsumas), clementines,
    wilkings and other similar citrus hybrids originating in Algeria
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3061/76 de la Commission, du 14 décembre 1976, supprimant
    la taxe compensatoire à l'importation de mandarines, y compris tangérines et
    satsumas, clémentines, wilkings et autres hybrides similaires d'agrumes originaires
    d'Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3061/76 der Kommission vom 14. Dezember 1976 zur Aufhebung
    der Ausgleichsabgabe auf die Einfuhr von Mandarinen, einschließlich Tangerinen
    und Satsumas, Clementinen, Wilkings und anderen ähnlichen Kreuzungen von Zitrusfrüchten,
    mit Ursprung in Algerien
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3061/76 af 14. december 1976 om ophævelse
    af udligningsafgiften ved indførsel af mandariner (herunder tangeriner og satsumas),
    clementiner, wilkings og andre lignende krydsninger af citrusfrugter med oprindelse
    i Algeriet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3061/76 della Commissione, del 14 dicembre 1976, che
    sopprime la tassa di compensazione all'importazione di mandarini, compresi i tangerini
    e i mandarini satsuma (o sazuma), clementine, wilkings e altri ibridi simili di
    agrumi, originari dell'Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3061/76 van de Commissie van 14 december 1976 houdende
    intrekking van de compenserende heffing op de invoer van mandarijnen, tangerines
    en satsuma's daaronder begrepen, clementines, wilkings en andere dergelijke kruisingen
    van citrusvruchten van, oorsprong uit Algerije
