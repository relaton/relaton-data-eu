- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2002 of 7 December 2020 laying
    down rules for the application of Regulation (EU) 2016/429 of the European Parliament
    and of the Council with regard to Union notification and Union reporting of listed
    diseases, to formats and procedures for submission and reporting of Union surveillance
    programmes and of eradication programmes and for application for recognition of
    disease-free status, and to the computerised information system
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/2002 de la Commission du 7 décembre
    2020 portant modalités d’application du règlement (UE) 2016/429 du Parlement
    européen et du Conseil en ce qui concerne la notification des maladies répertoriées
    et les rapports relatifs à ces maladies au sein de l’Union, les formats et
    procédures pour la présentation des programmes de surveillance au sein de l’Union,
    des programmes d’éradication et des rapports y afférents ainsi que pour la
    demande de reconnaissance du statut «indemne de maladie», et le système informatisé
    de gestion de l’information
  type: main
