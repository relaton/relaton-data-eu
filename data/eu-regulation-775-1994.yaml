title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 775/94 of 29 March 1994 opening, for 1994, as
    an autonomous measure, a special import quota for high-quality, fresh, chilled
    or frozen beef and veal falling within CN codes 0201 and 0202 and for products
    falling within CN codes 0206 10 95 and 0206 29 91
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 775/94 du Conseil du 29 mars 1994 portant ouverture,
    pour l'année 1994, à titre autonome, d'un quota exceptionnel d'importation de
    viandes bovines de haute qualité, fraîches, réfrigérées ou congelées, relevant
    des codes NC 0201 et 0202, ainsi que des produits relevant des codes NC 0206 10
    95 et 0206 29 91
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 775/94 DES RATES vom 29. März 1994 zur Eröffnung
    eines außerordentlichen autonomen Kontingents für die Einfuhr von hochwertigem,
    frischem, gekühltem oder gefrorenem Rindfleisch der KN-Codes 0201 und 0202 sowie
    von Erzeugnissen der KN-Codes 0206 10 95 und 0206 29 91 für 1994
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 775/94 af 29. marts 1994 om autonom åbning
    for 1994 af et særligt importkontingent for oksekød af høj kvalitet, fersk,
    kølet eller frosset, henhørende under KN-kode 0201 og 0202 samt produkter henhørende
    under KN-kode 0206 10 95 og 0206 29 91
  type: main
- language: el
  script: Grek
