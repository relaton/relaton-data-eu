id: EUDecision1978469
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 May 1978 authorizing the French Republic not
    to apply Community treatment to woven fabrics of synthetic fibres (discontinuous
    or waste), unbleached or bleached, falling within subheading ex 56.07 A (NIMEXE
    code 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28,
    32, 33, 34, 36) of the Common Customs Tariff, originating in Taiwan and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/469/CEE: Décision de la Commission, du 12 mai 1978, autorisant la
    République française à exclure du traitement communautaire les tissus de fibres
    textiles synthétiques et artificielles discontinues écrus ou blanchis, de la
    sous-position Ex 56.07 A du Tarif douanier commun (codes Nimexe 56.07-01, 04,
    05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36), originaires
    de Taiwan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. Mai 1978, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern, roh oder gebleicht,
    der Tarifstelle ex 56.07 A des Gemeinsamen Zolltarifs (NIMEXE 56.07-01, 04, 05,
    07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 12. maj 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof af korte kemofibre,
    syntetiske eller regenererede, ublegede eller blegede, som henhører under pos.
    ex 56.07 A (Nimexe kode 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21,
    23, 24, 26, 27, 28, 32, 33, 34, 36) i den fælles toldtarif, har oprindelse i
    Taiwan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 maggio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    ed artificiali in fiocco, greggi o imbianchiti della sottovoce ex 56.07 A della
    tariffa doganale comune (codice Nimexe 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16,
    18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) originari di Taiwan e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 mei 1978 waarbij de Franse Republiek
    wordt gemachtigd weefsels van synthetische en kunstmatige stapelvezels, ongebleekt
    of gebleekt, van post ex 56.07 A van het gemeenschappelijk douanetarief (NIMEXE-code
    56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32,
    33, 34, 36), van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
