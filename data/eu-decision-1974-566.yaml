title:
- language: en
  script: Latn
  content: '74/566/EEC: Commission Decision of 6 November 1974 empowering a Member
    of the Commission to take measures provided under Article 2 of Council Regulation
    (EEC) No 1410/74 of 4 June 1974 on the tariff treatment applicable to goods imported
    for free circulation in the event of disasters occurring in the territory of one
    or more Member States'
  type: main
- language: fr
  script: Latn
  content: '74/566/CEE: Décision de la Commission, du 6 novembre 1974, habilitant
    un membre de la Commission à prendre les mesures prévues à l'' article 2 du
    règlement (CEE) n° 1410/74 du Conseil, du 4 juin 1974, relatif au traitement
    tarifaire applicable aux marchandises importées pour la libre pratique à l''
    occasion de catastrophes afectant le territoire d'' un ou de plusieurs États
    membres'
  type: main
- language: de
  script: Latn
  content: '74/566/EWG: Beschluß der Kommission vom 6. November 1974 zur Ermächtigung
    eines Mitglieds der Kommission zum Erlaß der Maßnahmen nach Artikel 2 der Verordnung
    (EWG) Nr. 1410/74 des Rates vom 4. Juni 1974 über die zolltarifliche Behandlung
    von Waren, die aus Anlaß von Katastrophen, die das Hoheitsgebiet eines oder mehrerer
    Mitgliedstaaten berühren, für den freien Verkehr eingeführt werden'
  type: main
- language: da
  script: Latn
  content: '74/566/EØF: Kommissionens Afgørelse af 6. november 1974 om bemyndigelse
    af et medlem af Kommissionen til at træffe de foranstaltninger som er fastsat
    i artikel 2 i Rådets forordning (EØF) nr. 1410/74 af 4. juni 1974 om den toldordning,
    der skal gælde for varer, som er indført til fri omsætning i tilfælde af katastrofer,
    der rammer en eller flere medlemsstaters områder'
  type: main
- language: el
  script: Grek
  content: '74/566/EOK: Απόφαση τής Επιτροπής τής 6ης Νοεμβρίου
    1974 περί εξου000000'
  type: main
- language: it
  script: Latn
  content: '74/566/CEE: Decisione della Commissione, del 6 novembre 1974, che autorizza
    un membro della Commissione a prendere le misure previste dall'' articolo 2 del
    regolamento (CEE) n. 1410/74 del Consiglio, del 4 giugno 1974, relativo al trattamento
    tariffario applicabile alle merci importate per la libera pratica in occasione
    di calamità che colpiscano il territorio di uno o più Stati membri'
  type: main
- language: nl
  script: Latn
  content: '74/566/EEG: Besluit van de Commissie van 6 november 1974 waarbij een lid
    van de Commissie wordt gemachtigd tot het nemen van de in artikel 2 van Verordening
    (EEG) nr. 1410/74 van de Raad van 4 juni 1974 genoemde maatregelen, inzake de
    douanebehandeling van goederen die voor het vrije verkeer worden ingevoerd bij
    rampen op het grondgebied van één of meer Lid-Staten'
  type: main
