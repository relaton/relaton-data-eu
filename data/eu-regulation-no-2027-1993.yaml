    groenten en fruit, en ter vaststelling van de voorzieningsbalans voor de periode
    van 1 juli 1993 tot en met 30 juni 1994 in het bijzonder
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 2027/93 z dnia 26 lipca 1993 r. zmieniające
    rozporządzenie (EWG) nr 2999/92 ustanawiające szczegółowe zasady stosowania
    szczególnych środków dotyczących dostaw przetworów owocowych i warzywnych
    na Maderę, w szczególności w celu określenia prognozy bilansu dostaw na okres
    od dnia 1 lipca 1993 r. do dnia 30 czerwca 1994 r.
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2027/93 da Comissão de 26 de Julho de 1993 que altera,
    em relação ao período compreendido entre 1 de Julho de 1993 e 30 de Junho de
    1994, o Regulamento (CEE) nº 2999/92 que estabelece normas de execução do regime
    específico de abastecimento da ilha da Madeira em produtos do sector dos produtos
    transformados à base de frutas e produtos hortícolas e determinando, nomeadamente,
    a estimativa de abastecimento
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 2027/93 z 26. júla 1993, ktorým sa mení
