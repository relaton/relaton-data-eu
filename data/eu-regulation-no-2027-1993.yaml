    osobitných opatrení na dodávku spracovaného ovocia a zeleniny do Madeiry s
    cieľom stanovenia odhadovanej bilancie dodávok počas obdobia od 1. júla 1993
    do 30. júna 1994
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 2027/93 z dne 26. julija 1993 o spremembi Uredbe
