  content: Regulation (EEC) No 1302/75 of the Council of 20 May 1975 temporarily and
    totally suspending the customs duties applicable in the Community as originally
    constituted on a number of products imported from the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1302/75 du Conseil, du 20 mai 1975, portant suspension
    temporaire et totale des droits de douane applicables dans la Communauté dans
    sa composition originaire sur un certain nombre de produits importés des nouveaux
    États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1302/75 des Rates vom 20. Mai 1975 zur zeitweiligen,
    vollständigen Aussetzung der in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung
    geltenden Zollsätze für die Einfuhr von einigen Waren aus den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1302/75 af 20. maj 1975 om midlertidig og
    fuldstændig suspension af de toldsatser, der i Fællesskabet i dets oprindelige
    udstrækning anvendes på en række produkter, der indføres fra de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1302/75 del Consiglio, del 20 maggio 1975, che sospende
    temporaneamente e totalmente i dazi doganali applicabili nella Comunità nella
    sua composizione originaria per un certo numero di prodotti importati dai nuovi
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1302/75 van de Raad van 20 mei 1975 houdende tijdelijke
    en algehele schorsing van de douanerechten van toepassing in de Gemeenschap in
    haar oorspronkelijke samenstelling voor een aantal produkten, ingevoerd uit de
    nieuwe Lid-Staten
