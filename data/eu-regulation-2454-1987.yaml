title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2454/87 of 13 August 1987 re-establishing
    the levying of customs duties on other clocks, falling within heading No 91.04,
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2454/87 de la Commission du 13 août 1987 portant
    rétablissement de la perception des droits de douane applicables aux horloges,
    pendules, réveils et appareils d' horlogerie similaires à mouvement autre que
    de montre, de la position 91.04 du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2454/87 der Kommission vom 13. August 1987 zur Wiedereinführung
    der Erhebung der Zölle für andere Uhren der Tarifnummer 91.04 des Gemeinsamen
    Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3924/86
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2454/87 af 13. august 1987 om genindførelse
    af opkrævning af told for andre ure, henhørende under pos. 91.04 i den fælles
    toldtarif og med oprindelse i Kina, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
