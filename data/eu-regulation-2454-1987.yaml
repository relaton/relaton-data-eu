  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2454/87 della Commissione del 13 agosto 1987 che ripristina
    la riscossione dei dazi doganali applicabili agli orologi, pendole, sveglie e
    simili apparecchi di orologeria, con movimento diverso da quello degli orologi
    trascabili della voce 91.04 della tariffa doganale comune, originari della Cina,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3924/86
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2454/87 van de Commissie van 13 augustus 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op klokken, pendules,
    wekkers en dergelijke artikelen met ander uurwerk dan horloge-uurwerk, van tariefpost
    91.04 van het gemeenschappelijk douanetarief, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3924/86 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2454/87 da Comissão de 13 de Agosto de 1987 que
