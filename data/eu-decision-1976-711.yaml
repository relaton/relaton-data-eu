title:
- language: en
  script: Latn
  content: Commission Decision of 3 August 1976 concerning the application made by
    the United Kingdom under Article 115 of the Treaty for authorization to apply
    protective measures in respect of knitted cotton outerwear, falling within heading
    No ex 60.05 of the Common Customs Tariff, originating in Romania and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/711/CEE: Décision de la Commission, du 3 août 1976, relative au recours
    à l''article 115 du Traité de Rome introduit par le Royaume-Uni, visant à l''application
    de mesures de protection pour les vêtements de bonneterie de coton, de la position
    Ex 60.05 du Tarif douanier commun, originaires de Roumanie et mis en libre pratique
    en France'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. August 1976 über den vom Vereinigten
    Königreich gestellten Antrag auf Anwendung des Artikels 115 des Vertrages von
    Rom zwecks Durchführung von Schutzmaßnahmen für gewirkte Baumwollkleidung der
    Tarifnummer ex 60.05 des Gemeinsamen Zolltarifs, die aus Rumänien stammt und
    sich in Frankreich im freien Verkehr befindet
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. august 1976 om den begæring om anvendelse
    af Rom-traktatens artikel 115, som Det forenede Kongerige har indgivet vedrørende
    anvendelse af beskyttelsesforanstaltninger for trikotagebeklædningsgenstande
    af bomuld, som henhører under pos. ex 60.05 i den fælles toldtarif, har oprindelse
    i Rumænien og frit kan omsættes i Frankrig
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 agosto 1976, relativa al ricorso all'articolo
    115 del trattato di Roma, presentato dal Regno Unito, riguardante l'applicazione
    di misure di salvaguardia agli indumenti a maglia, di cotone, della voce 60.05
    della tariffa doganale comune, originari della Romania ed immessi in libera pratica
    in Francia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 augustus 1976 betreffende het beroep
    op artikel 115 van het Verdrag van Rome dat door het Verenigd Koninkrijk is ingediend
    met het oog op de toepassing van beschermende maatregelen voor kleding van brei-
    of haakwerk van katoen, van post ex 60.05 van het gemeenschappelijk douanetarief,
    van oorsprong uit Roemenië en in Frankrijk in het vrije verkeer gebracht
