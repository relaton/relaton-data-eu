title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 593/86 of 28 February 1986 laying down certain
    detailed rules for the application of the quantitative restrictions on imports
    into Spain and Portugal of agricultural products from third countries and the
    system of import and export licences
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 593/86 de la Commission du 28 février 1986 déterminant
    pour les produits agricoles en provenance des pays tiers certaines modalités
    d' application des restrictions quantitatives applicables à l' importation en
    Espagne et au Portugal ainsi que du régime des certificats d' importation et
    d' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 593/86 der Kommission vom 28. Februar 1986 zur Festlegung
    von Durchführungsbestimmungen zu den mengenmäßigen Beschränkungen bei der
    Einfuhr landwirtschaftlicher Erzeugnisse aus Drittländern nach Spanien und Portugal
    und zur Einfuhr- und Ausfuhrlizenzregelung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 593/86 af 28. februar 1986 om fastsættelse
    for landbrugsprodukter fra tredjelande af visse gennemførelsesbestemmelser for
    de kvantitative restriktioner ved indførsel til Spanien og Portugal og for ordningen
    med import- og eksportlicenser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 593/86 της Επιτροπής
    της 28ης Φεβρουαρίου 1986 που καθορίζει για τα
    γεωργικά προϊόντα καταγωγής τρίτων χωρών ορισμένες
    λεπτομέρειες εφαρμογής των ποσοτικών περιορισμών
    που εφαρμόζονται κατά την εισαγωγή στην Ισπανία
    και την Πορτογαλία καθώς και του καθεστώτος
    των πιστοποιητικών εισαγωγής και εξαγωγής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 593/86 della Commissione del 28 febbraio 1986 che
    stabilisce, per i prodotti agricoli in provenienza dai paesi terzi, alcune modalità
    d' applicazione delle restrizioni quantitative applicabili all' importazione in
    Spagna e in Portogallo, nonché del regime dei titoli d' importazione e di esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 593/86 van de Commissie van 28 februari 1986 houdende
    enige uitvoeringsbepalingen in verband met de kwantitatieve beperkingen bij de
    invoer van landbouwprodukten uit derde landen in Spanje en Portugal, en in verband
    met het stelsel van invoer- en uitvoercertificaten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 593/86 da Comissão de 28 de Fevereiro de 1986 que
    define, para os produtos agrícolas provenientes dos países terceiros, determinadas
    regras de execução das restrições quantitativas aplicáveis à importação
    em Espanha e em Portugal, bem como do regime dos certificados de importação
    e de exportação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 593/86 de la Comisión de 28 de febrero de 1986 por
    el que se establecen determinadas modalidades de aplicación de las restricciones
    cuantitativas aplicables a la importación en España y en Portugal de productos
    agrícolas procedentes de terceros países, así como del régimen de los certificados
    de importación y de exportación
  type: main
