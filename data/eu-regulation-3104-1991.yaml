title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3104/91 of 23 October 1991 re-establishing
    the levying of customs duties on products falling within CN code 4106 20 00, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3104/91 DE LA COMMISSION du 23 octobre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 4106 20 00 originaires du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3104/91 DER KOMMISSION vom 23. Oktober 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 4106 20 00 mit Ursprung in
    Pakistan, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3104/91 af 23. oktober 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 4106 20 00 og med oprindelse
    i Pakistan, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3104/91 της Επιτροπής,
    της 23ης Οκτωβρίου 1991, περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 4106 20 00 καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό ( ΕΟΚ ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3104/91 DELLA COMMISSIONE del 23 ottobre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 4106 20 00 originari del Pakistan, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3104/91 VAN DE COMMISSIE van 23 oktober 1991 houdende
