  content: Règlement (CEE) n° 2214/72 de la Commission, du 18 octobre 1972, fixant
    définitivement le montant de l'aide pour les graines de colza, de navette et
    de tournesol, déterminé provisoirement depuis le 29 mars 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2214/72 der Kommission vom 18. Oktober 1972 zur endgültigen
    Festsetzung des seit dem 29. März 1972 vorläufig festgesetzten Beihilfebetrags
    für Raps-, Rübsen- und Sonnenblumensamen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2214/72 della Commissione, del 18 ottobre 1972, che
    fissa definitivamente l'importo dell'integrazione per i semi di colza, di ravizzone
    e di girasole stabilito provvisoriamente a partire dal 29 marzo 1972
  type: main
- language: nl
