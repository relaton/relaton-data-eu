    Protocolo que determina, para el período comprendido entre el 18 de enero de
    1993 y el 17 de enero de 1996, las posibilidades de pesca y la contribución financiera
    previstas en el Acuerdo entre la Comunidad Europea y la República de las Seychelles
    sobre la pesca frente a las costas de las Seychelles'
  type: main
- language: sv
  script: Latn
  content: '93/322/EEG: Rådets beslut av den 17 maj 1993 om ingående av avtalet
    i form av en skriftväxling om den interimistiska tillämpningen av protokollet
    som för perioden 18 januari 1993-17 januari 1996 fastställer de fiskemöjligheter
    och den ekonomiska ersättning som föreskrivs i avtalet mellan Europeiska gemenskapen
    och Republiken Seychellerna om fiske utanför Seychellernas kust'
