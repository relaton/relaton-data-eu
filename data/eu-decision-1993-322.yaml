title:
- language: en
  script: Latn
  content: '93/322/EEC: Council Decision of 17 May 1993 on the conclusion of the Agreement
    in the form of an exchange of letters concerning the provisional application of
    the Protocol defining for the period 18 January 1993 to 17 January 1996 the fishing
    opportunities and the financial contribution provided for by the Agreement between
    the European Community and the Republic of Seychelles on fishing off the coast
    of Seychelles'
  type: main
- language: fr
  script: Latn
  content: '93/322/CEE: Décision du Conseil du 17 mai 1993 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant, pour la période du 18 janvier 1993 au 17 janvier 1996, les
    possibilités de pêche et la contribution financière prévues par l''accord
    entre la Communauté européenne et la République des Seychelles concernant la
    pêche au large des Seychelles'
  type: main
- language: de
  script: Latn
  content: '93/322/EWG: BESCHLUSS DES RATES vom 17. Mai 1993 über den Abschluß des
    Abkommens in Form eines Briefwechsels über die vorläufige Anwendung des Protokolls
    zur Festlegung der Fangmöglichkeiten und des Finanzbeitrags nach dem Abkommen
    zwischen der Europäischen Gemeinschaft und der Republik Seschellen über die
    Fischerei vor der Küste der Seschellen für die Zeit vom 18. Januar 1993 bis
    zum 17. Januar 1996'
  type: main
- language: da
  script: Latn
  content: '93/322/EØF: RÅDETS AFGØRELSE af 17. maj 1993 om indgåelse af aftalen
    i form af brevveksling om midlertidig anvendelse af protokollen om fastsættelse
    af de fiskerimuligheder og det finansielle bidrag, der er omhandlet i aftalen
    mellem Det Europæiske Fællesskab og Republikken Seychellerne om fiskeri ud for
    Seychellerne, for perioden 18. januar 1993 til 17. januar 1996'
  type: main
- language: el
  script: Grek
  content: '93/322/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 17ης
    Μαΐου 1993 για τη σύναψη συμφωνίας υπό μορφή
    ανταλλαγής επιστολών σχετικά με την προσωρινή
    εφαρμογή του πρωτοκόλλου που καθορίζει, για
    την περίοδο από 18 Ιανουαρίου 1993 έως 17 Ιανουαρίου
    1996, τις αλιευτικές δυνατότητες για τη χρηματική
    συνεισφορά που προβλέπονται από τη συμφωνία
    μεταξύ της Ευρωπαϊκής Κοινότητας και της Δημοκρατίας
    των Σεϋχελλών σχετικά με την αλιεία στα ανοικτά
    των Σεϋχελλών'
  type: main
- language: fi
  script: Latn
  content: '93/322/ETY: Neuvoston päätös, tehty 17 päivänä toukokuuta 1993,
    Euroopan yhteisön ja Seychellien tasavallan välisessä Seychellien edustalla
    harjoitettavaa kalastusta koskevassa sopimuksessa määrätyt kalastusmahdollisuudet
    ja taloudellisen korvauksen 18 päivän tammikuuta 1993 ja 17 päivän tammikuuta
    1996 väliseksi ajanjaksoksi vahvistavan pöytäkirjan väliaikaista soveltamista
    koskevan kirjeenvaihtona tehdyn sopimuksen tekemisestä'
  type: main
- language: it
  script: Latn
  content: '93/322/CEE: DECISIONE DEL CONSIGLIO del 17 maggio 1993 relativa alla conclusione
    dell'' accordo in forma di scambio di lettere sull'' applicazione provvisoria
    del protocollo che fissa le possibilità di pesca ed il contributo finanziario
    previsti nell'' accordo tra la Comunità europea e la Repubblica delle Seicelle
    sulla pesca al largo delle Seicelle, per il periodo 18 gennaio 1993 - 17 gennaio
    1996'
  type: main
- language: nl
  script: Latn
  content: '93/322/EEG: BESLUIT VAN DE RAAD van 17 mei 1993 betreffende de sluiting
    van de Overeenkomst in de vorm van een briefwisseling inzake de voorlopige toepassing
    van het Protocol tot vaststelling van de voor de periode van 18 januari 1993 tot
    en met 17 januari 1996 geldende vangstmogelijkheden en financiële bijdrage, als
    bedoeld in de Overeenkomst tussen de Europese Gemeenschap en de Republiek der
    Seychellen inzake de visserij voor de kust van de Seychellen'
  type: main
- language: pt
  script: Latn
  content: '93/322/CEE: DECISÃO DO CONSELHO de 17 de Maio de 1993 relativa à celebração
    do Acordo sob forma de troca de cartas relativo à aplicação provisória do
