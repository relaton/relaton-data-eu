    17 de Janeiro de 1996, as possibilidades de pesca e a contribuição financeira
    previstas no Acordo entre a Comunidade Europeia e a República das Seychelles
    relativo à pesca ao largo das Seychelles'
  type: main
- language: es
  script: Latn
  content: '93/322/CEE: DECISIÓN DEL CONSEJO de 17 de mayo de 1993 sobre la celebración
