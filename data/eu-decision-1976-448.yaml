id: EUDecision1976448
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 2 April 1976 authorizing the Italian Republic not
    to apply Community treatment to men's and boy's shirts of cotton and of mixed
    textile fibres falling within heading No ex 60.04, originating in the Republic
    of Korea and in free circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '76/448/CEE: Décision de la Commission, du 2 avril 1976, autorisant la
    République italienne à exclure du traitement communautaire les chemises de coton
    et de fibres textiles mélangées, pour hommes et garçonnets, de la position
    Ex 60.04, originaires de la République de Corée et mises en libre pratique en
    République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. April 1976, mit der die Italienische
    Republik ermächtigt wird, aus der Republik Korea stammende und in der Bundesrepublik
    Deutschland im freien Verkehr befindliche Hemden aus Baumwolle und aus gemischten
    Spinnfasern, für Männer und Knaben, der Tarifnummer ex 60.04 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 2. april 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage skjorter af bomuld og blandede
    tekstilfibre til mænd og drenge, som henhører under pos. ex 60.04, har oprindelse
    i republikken Korea og frit kan omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 aprile 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le camicie per uomo e ragazzo
    di cotone e di fibre tessili miste della voce ex 60.04 della tariffa doganale
    comune, originarie della Repubblica di Corea e messe in libera pratica nella Repubblica
    federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 april 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd hemden van katoen en van gemengde textielvezels voor heren en
    jongens van post ex 60.04, van oorsprong uit de Republiek Korea en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
