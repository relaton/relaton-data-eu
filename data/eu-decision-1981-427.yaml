title:
- language: en
  script: Latn
  content: '81/427/EEC: Commission Decision of 20 May 1981 authorizing Ireland not
    to apply Community treatment to woven table linen, toilet and kitchen linen originating
    in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/427/CEE: Décision de la Commission, du 20 mai 1981, autorisant l''Irlande
    à exclure du traitement communautaire le linge de table, linge de toilette, d''office
    ou de cuisine, tissé, originaire de Hong-kong (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/427/EWG: Entscheidung der Kommission vom 20. Mai 1981 zur Ermächtigung
    Irlands, aus Hongkong stammende Tischwäsche, Wäsche zur Körperpflege und andere
    Haushaltswäsche, aus Geweben, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/427/EØF: Kommissionens beslutning af 20. maj 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage dækketøj, håndklæder,
    vaskeklude, viskestykker og lignende, køkkentekstiler, vævede, med oprindelse
    i Hongkong (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/427/ΕΟΚ: Απόφαση τής Επιτροπής τής 20ής
    Μαΐου 1981 μέ τήν οποία εξουσιοδοτείται η Ιρλανδία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τίς πλεκτές οθόνες τραπέζης, τίς οθόνες καθαριότητος,
    υπηρεσίας ή μαγειρείου, καταγωγής Χόνγκ Κόνγκ
