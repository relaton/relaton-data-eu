title:
- language: en
  script: Latn
  content: Council Directive 85/7/EEC of 19 December 1984 amending a first series
    of Directives on the approximation of the laws of the Member States in the foodstuffs
    sector, as regards the involvement of the Standing Committee for Foodstuffs
  type: main
- language: fr
  script: Latn
  content: Directive 85/7/CEE du Conseil du 19 décembre 1984 modifiant une première
    série de directives relatives au rapprochement des législations des États membres
    dans le domaine des denrées alimentaires en ce qui concerne l'intervention du
    comité permanent des denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 85/7/EWG des Rates vom 19. Dezember 1984 zur Änderung einer
    ersten Serie von Richtlinien betreffend die Angleichung der Rechtsvorschriften
    der Mitgliedstaaten im Lebensmittelbereich hinsichtlich der Intervention des Ständigen
    Lebensmittelausschusses
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 85/7/EØF af 19. december 1984 om ændring af en første
    række direktiver om indbyrdes tilnærmelse af medlemsstaternes lovgivning på
    levnedsmiddelområdet, for så vidt angår Den stående Levnedsmiddelkomités
    indgriben
  type: main
- language: el
  script: Grek
  content: Οδηγία 85/7/ΕΟΚ του Συμβουλίου της 19ης Δεκεμβρίου
    1984 για την τροποποίηση μιας πρώτης σειράς οδηγιών
    για την προσέγγιση των νομοθεσιών των κρατών
    μελών των σχετικών με τα τρόφιμα, όσον αφορά
    την παρέμβαση της Μόνιμης Επιτροπής Τροφίμων
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 85/7/ETY, annettu 19 päivänä joulukuuta 1984, elintarvikkeita
    koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun ensimmäisen
    direktiivisarjan muuttamisesta pysyvän elintarvikekomitean osallistumisen osalta
  type: main
- language: it
  script: Latn
  content: Direttiva 85/7/CEE del Consiglio del 19 dicembre 1984 che modifica una
    prima serie di direttive relative al ravvicinamento delle legislazioni degli Stati
    Membri concernenti i prodotti alimentari per quanto riguarda l'intervento del
    Comitato permanente per i prodotti alimentari
  type: main
- language: nl
  script: Latn
  content: Richtlijn 85/7/EEG van de Raad van 19 december 1984 tot wijziging van een
    eerste reeks Richtlijnen betreffende de onderlinge aanpassing van de wetgevingen
    van de Lid- Staten inzake levensmiddelen ten aanzien van de tussenkomst door het
    Permanent Comité voor levensmiddelen
  type: main
- language: pt
  script: Latn
  content: Directiva 85/7/CEE do Conselho, de 19 de Dezembro de 1984, que altera uma
    primeira série de directivas relativas à aproximação das legislações dos
    Estados- membros no domínio dos géneros alimentícios no que respeita à intervenção
    do Comité Permanente dos Géneros Alimentícios
  type: main
- language: es
  script: Latn
  content: Directiva 85/7/CEE del Consejo, de 19 de diciembre de 1984, por la que
    se modifica una primera serie de directivas relativas a la aproximación de las
    legislaciones de los Estados Miembros en materia de productos alimenticios en
    lo referente a la intervención del Comité permanente de productos alimenticios
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 85/7/EEG av den 19 december 1984 med ändring av en första
    serie direktiv om Ständiga livsmedelskommitténs medverkan vid tillnärmningen
    av medlemsstaternas lagstiftning på livsmedelsområdet
  type: main
