  content: Council Regulation (EEC) No 1708/79 of 24 July 1979 determining, for the
    1979/80 wine-growing year, the prices to be paid under the compulsory distillation
    of the by-products of wine-making and the maximum amount of the contribution from
    the Guarantee Section of the European Agricultural Guidance and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1708/79 du Conseil, du 24 juillet 1979, déterminant,
