    partecipazione del Fondo europeo agricolo di orientamento e di garanzia, sezione
    garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1708/79 van de Raad van 24 juli 1979 houdende vaststelling,
