type: standard
title:
- language: en
  script: Latn
  content: '92/15/EEC: Commission Decision of 18 December 1991 authorizing certain
    Member States to apply intra- Communit surveillance to imports originating in
    third countries which have been put into free circulation in the Community and
    which may be the subject of protective measures pursuant to Article 115 of the
    EEC Treaty (Only the Spanish, French, English, Italian and Portuguese texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/15/CEE: Décision de la Commission, du 18 décembre 1991, autorisant
    certains Etats membres à instaurer une surveillance intracommunautaire des importations
    de produits originaires de pays tiers, mis en libre pratique dans la Communauté,
    susceptibles de faire l''objet de mesures de protection au titre de l''article
    115 du traité CEE (Les textes en langues espagnole, française, anglaise, italienne
    et portugaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/15/EWG: Entscheidung der Kommission vom 18. Dezember 1991 zur Ermächtigung
    bestimmter Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Drittländern stammenden, in der Gemeinschaft im freien
    Verkehr befindlichen Waren, die Schutzmaßnahmen gemäß Artikel 115 des Vertrages
    unterworfen werden können (Nur der spanische, französische, englische, italienische
    und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/15/EØF: Kommissionens beslutning af 18. december 1991 om bemyndigelse
    af visse medlemsstater til at indføre tilsyn inden for Fællesskabet med indførsel
    af produkter, der har oprindelse i tredjelande og er overgået til fri omsætning
    i Fællesskabet, og som ville kunne gøres til genstand for beskyttelsesforanstaltninger
    i henhold til Traktatens artikel 115 (Kun den spanske, franske, engelske, italienske
    og portugisiske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '92/15/ΕΟΚ: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1991 που εξουσιοδοτεί ορισμένα κράτη μέλη να
    θεσπίσουν ενδοκοινοτική επιτήρηση των εισαγωγών
    προϊόντων καταγωγής τρίτων χωρών, τα οποία
    τίθενται σε ελεύθερη κυκλοφορία στην Κοινότητα
    και τα οποία μπορούν να αποτελέσουν αντικείμενο
    μέτρων προστασίας δυνάμει του άρθρου 115 της
    συνθήκης ΕΟΚ (Τα κείμενα στην ισπανική, γαλλική,
    αγγλική, ιταλική και πορτογαλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '92/15/CEE: Decisione della Commissione, del 18 dicembre 1991, che autorizza
    taluni Stati membri ad istituire una sorveglianza intracomunitaria sulle importazioni
    di prodotti originari dei paesi terzi, messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (Il testi in lingua spagnola, francese, inglese, italiana e portoghese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '92/15/EEG: Beschikking van de Commissie van 18 december 1991 houdende
    machtiging van bepaalde Lid-Staten om over te gaan tot een intracommunautair toezicht
    in te stellen ten aanzien van de invoer van produkten van oorsprong uit derde
    landen die in de Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp
    kunnen zijn van beschermende maatregelen krachtens artikel 115 van het Verdrag
    (Slechts de teksten in de Spaanse, Franse, Engelse, Italiaanse en de Portugese
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/15/CEE: Decisão da Comissão, de 18 de Dezembro de 1991, que autoriza
    certos Estados-membros a procederem a uma vigilância intracomunitária das importações
    de produtos originários de países terceiros introduzidos em livre prática na
    Comunidade susceptíveis de serem objecto de medidas de protecção ao abrigo
    do artigo 115 do Tratado (Apenas fazem fé os textos nas línguas espanhola, francesa,
    inglesa, italiana e portuguesa)'
  type: main
- language: es
  script: Latn
  content: '92/15/CEE: Decisión de la Comisión, de 18 de diciembre de 1991, por
    la que se autoriza a ciertos Estados miembros a establecer medidas de vigilancia
    intracomunitaria en relación con las importaciones de productos originarios de
    terceros países despachados a libre práctica en la Comunidad que pueden ser
    objeto de medidas de protección en virtud de lo dispuesto en el artículo 115
    del Tratado (Los textos en lenguas española, francesa, inglesa, italiana y portuguesa
    son los únicos auténticos)'
  type: main
