    προσαρμογή των εμπορικών πτυχών της ευρωπαϊκής
    συμφωνίας σύνδεσης μεταξύ των Ευρωπαϊκών Κοινοτήτων
    και των κρατών μελών τους, αφενός, και της Δημοκρατίας
    της Εσθονίας, αφετέρου, ώστε να ληφθούν υπόψη
    τα αποτελέσματα των διαπραγματεύσεων μεταξύ
    των μερών για νέες αμοιβαίες γεωργικές παραχωρήσεις'
  type: main
- language: fi
  script: Latn
  content: '2003/463/EY: Neuvoston päätös, tehty 18 päivänä maaliskuuta 2003,
