title:
- language: en
  script: Latn
  content: '2003/463/EC: Council Decision of 18 March 2003 concerning the conclusion
    of a Protocol adjusting the trade aspects of the Europe Agreement establishing
    an association between the European Communities and their Member States, of the
    one part, and the Republic of Estonia, of the other part, to take account of the
    outcome of negotiations between the parties on new mutual agricultural concessions'
  type: main
- language: fr
  script: Latn
  content: '2003/463/CE: Décision du Conseil du 18 mars 2003 relative à la conclusion
    d''un protocole d''adaptation des aspects commerciaux de l''accord européen établissant
    une association entre les Communautés européennes et leurs États membres, d''une
    part, et la République d''Estonie, d''autre part, pour tenir compte des résultats
    des négociations entre les parties concernant l''établissement de nouvelles
    concessions agricoles réciproques'
  type: main
- language: de
  script: Latn
  content: '2003/463/EG: Beschluss des Rates vom 18. März 2003 über den Abschluss
    eines Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zwischen
    den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits und der
    Republik Estland andererseits zur Berücksichtigung der Ergebnisse der Verhandlungen
    zwischen den Parteien über neue gegenseitige Zugeständnisse in der Landwirtschaft'
  type: main
- language: da
  script: Latn
  content: '2003/463/EF: Rådets afgørelse af 18. marts 2003 om indgåelse af en
    protokol om tilpasning af handelsaspekterne i Europaaftalen om oprettelse af en
    associering mellem De Europæiske Fællesskaber og deres medlemsstater på den
    ene side og Republikken Estland på den anden side for at tage hensyn til resultatet
    af parternes forhandlinger om yderligere gensidige indrømmelser på landbrugsområdet'
  type: main
- language: el
  script: Grek
  content: '2003/463/ΕΚ: Απόφαση του Συμβουλίου, της 18ης
