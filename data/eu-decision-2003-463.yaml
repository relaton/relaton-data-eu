    assosiaatiosta tehdyn Eurooppa-sopimuksen kauppaa koskevien määräysten mukauttamista
    koskevan pöytäkirjan tekemisestä maatalouden uusia keskinäisiä myönnytyksiä
    koskevien neuvottelujen tulosten huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '2003/463/CE: Decisione del Consiglio, del 18 marzo 2003, relativa alla
