    jde o zrušení některých výjimek týkajících se zahřívaných tabákových
    výrobků
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2022/2100 af 29. juni 2022 om ændring
    af Europa-Parlamentets og Rådets direktiv 2014/40/EU for så vidt angår tilbagetrækning
    af visse undtagelser vedrørende opvarmede tobaksvarer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2022/2100 της
    Επιτροπής της 29ης Ιουνίου 2022 για την τροποποίηση
    της οδηγίας 2014/40/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου σχετικά με την απόσυρση
    ορισμένων εξαιρέσεων όσον αφορά τα θερμαινόμενα
    προϊόντα καπνού
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2022/2100, 29. juuni 2022, millega
