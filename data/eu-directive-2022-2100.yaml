title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/2100 of 29 June 2022 amending
    Directive 2014/40/EU of the European Parliament and of the Council as regards
    the withdrawal of certain exemptions in respect of heated tobacco products
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/2100 de la Commission du 29 juin 2022 modifiant
    la directive 2014/40/UE du Parlement européen et du Conseil en ce qui concerne
    le retrait de certaines exemptions pour les produits du tabac chauffés
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/2100 der Kommission vom 29. Juni 2022 zur
    Änderung der Richtlinie 2014/40/EU des Europäischen Parlaments und des Rates
    hinsichtlich der Rücknahme bestimmter Ausnahmen in Bezug auf erhitzte Tabakerzeugnisse
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/2100 на Комисията
