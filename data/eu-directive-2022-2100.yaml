    с оглед на оттеглянето на определени освобождавания
    по отношение на нагреваемите тютюневи изделия
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2022/2100 ze dne 29. června
