    dalies keičiama Europos Parlamento ir Tarybos direktyva 2014/40/ES
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/2100 tad-29 ta’ Ġunju 2022
    li temenda d-Direttiva 2014/40/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    tal-irtirar ta’ ċerti eżenzjonijiet fir-rigward tal-prodotti tat-tabakk imsaħħan
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/2100 van de Commissie van 29 juni 2022
    tot wijziging van Richtlijn 2014/40/EU van het Europees Parlement en de Raad wat
    betreft de intrekking van bepaalde vrijstellingen met betrekking tot verhitte
    tabaksproducten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/2100 z dnia 29 czerwca 2022 r. zmieniająca
    dyrektywę Parlamentu Europejskiego i Rady 2014/40/UE w odniesieniu do zniesienia
    niektórych zwolnień w przypadku podgrzewanych wyrobów tytoniowych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/2100 da Comissão de 29 de junho de 2022 que
    altera a Diretiva 2014/40/UE do Parlamento Europeu e do Conselho no que diz respeito
    à retirada de certas isenções aplicáveis aos produtos de tabaco aquecido
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/2100 a Comisiei din 29 iunie 2022 de modificare
    a Directivei 2014/40/UE a Parlamentului European și a Consiliului în ceea ce
    privește retragerea anumitor exceptări care vizează produsele din tutun încălzit
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/2100 z 29. júna 2022, ktorou sa
    mení smernica Európskeho parlamentu a Rady 2014/40/EÚ, pokiaľ ide o zrušenie
    určitých výnimiek týkajúcich sa zahrievaných tabakových výrobkov
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/2100 z dne 29. junija 2022 o spremembi
