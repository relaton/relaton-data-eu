    v zvezi z ogrevanimi tobačnimi izdelki
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/2100 de la Comisión de 29 de junio de 2022
    por la que se modifica la Directiva 2014/40/UE del Parlamento Europeo y del Consejo
    en lo que respecta a la retirada de determinadas excepciones aplicables a los
    productos de tabaco calentado
  type: main
- language: sv
  script: Latn
