    erandite tühistamisega kuumutatud tubakatoodete puhul
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2022/2100, annettu 29 päivänä kesäkuuta
    2022, Euroopan parlamentin ja neuvoston direktiivin 2014/40/EU muuttamisesta siltä
    osin kuin on kyse tiettyjen kuumennettavien tupakkatuotteita koskevien vapautusten
    lopettamisesta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/2100 ón gCoimisiún an 29 Meitheamh 2022 lena
