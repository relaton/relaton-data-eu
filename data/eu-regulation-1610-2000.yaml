title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1610/2000 of 24 July 2000 amending Regulation
    (EEC) No 3769/92 implementing and amending Council Regulation (EEC) No 3677/90
    laying down measures to be taken to discourage the diversion of certain substances
    to the illicit manufacture of narcotic drugs and psychotropic substances
  type: main
- language: fr
  script: Latn
