title:
- language: en
  script: Latn
  content: '90/661/ECSC: Commission Decision of 12 December 1990 amending Decision
    90/459/ECSC authorizing the member States to institute intra-Community surveillance
    of the importation for home use of certain iron and steel products originating
    in certain third countries and covered by the Treaty establishing the European
    Coal and Steel Community and in free circulation in the Community'
  type: main
- language: fr
  script: Latn
  content: '90/661/CECA: Décision de la Commission, du 12 décembre 1990, modifiant
    la décision 90/459/CECA autorisant les États membres à instaurer une surveillance
    intracommunautaire des importations pour la mise à la consommation de certains
    produits sidérurgiques originaires de certains pays tiers relevant du Traité
    instituant la Communauté européenne du charbon et de l''acier et mis en libre
    pratique dans un autre État membre'
  type: main
- language: de
  script: Latn
  content: '90/661/EGKS: ENTSCHEIDUNG DER KOMMISSION VOM 12. DEZEMBER 1990 ZUR AENDERUNG
    DER ENTSCHEIDUNG 90/459/EGKS ZUR ERMAECHTIGUNG DER MITGLIEDSTAATEN ZUR EINFUEHRUNG
    EINER INNERGEMEINSCHAFTLICHEN UEBERWACHUNG DER EINFUHREN ZUR UEBERFUEHRUNG IN
    DEN STEUERRECHTLICH FREIEN VERKEHR VON BESTIMMTEN, UNTER DEN VERTRAG UEBER DIE
    GRUENDUNG DER EUROPAEISCHEN GEMEINSCHAFT FUER KOHLE UND STAHL FALLENDEN EISEN-
    UND STAHLERZEUGNISSEN MIT URSPRUNG IN BESTIMMTEN DRITTLAENDERN, DIE SICH IN DER
    GEMEINSCHAFT IM ZOLLRECHTLICH FREIEN VERKEHR BEFINDEN'
  type: main
- language: da
  script: Latn
  content: '90/661/EKSF: KOMMISSIONENS BESLUTNING AF 12. DECEMBER 1990 OM AENDRING
    AF KOMMISSIONENS BESLUTNING 90/459/EKSF OM BEMYNDIGELSE AF MEDLEMSSTATERNE TIL
    AT INDFOERE TILSYN INDEN FOR FAELLESSKABET MED IMPORTEN TIL FRIT FORBRUG AF VISSE
    JERN- OG STAALPRODUKTER MED OPRINDELSE I VISSE TREDJELANDE, DER HENHOERER UNDER
    TRAKTATEN OM OPRETTELSE AF DET EUROPAEISKE KUL- OG STAALFAELLESSKAB, OG SOM OVERGAAR
    TIL FRI OMSAETNING I FAELLESSKABET'
  type: main
- language: el
  script: Grek
  content: '90/661/ΕΚΑΧ: Απόφαση της Επιτροπής της 12ης
    Δεκεμβρίου 1990 για την τροποποίηση της απόφασης
    90/459/ΕΚΑΧ για την παροχή αδείας στα κράτη μέλη
    να καθιερώσουν ενδοκοινοτική επίβλεψη των
    εισαγωγών για τη διάθεση για κατανάλωση ορισμένων
    σιδηρουργικών προϊόντων, καταγωγής ορισμένων
    τρίτων χωρών, που υπόκεινται στη συνθήκη για
    την ίδρυση της Ευρωπαϊκής Κοινότητας Άνθρακα
    και Χάλυβα και τίθενται σε ελεύθερη κυκλοφορία
    σε ένα άλλο κράτος μέλος'
  type: main
- language: it
  script: Latn
  content: '90/661/CECA: DECISIONE DELLA COMMISSIONE, DEL 12 DICEMBRE 1990, RECANTE
    MODIFICA DELLA DECISIONE 90/459/CECA CHE AUTORIZZA GLI STATI MEMBRI A ISTITUIRE
    UNA SORVEGLIANZA INTRACOMUNITARIA SULLE IMPORTAZIONI PER L'' IMMISSIONE IN CONSUMO
    DI TALUNI PRODOTTI SIDERURGICI ORIGINARI DEI PAESI TERZI CONTEMPLATI DAL TRATTATO
    CHE ISTITUISCE LA COMUNITA EUROPEA DEL CARBONE E DELL'' ACCIAIO E IMMESSI IN LIBERA
    PRATICA NELLA COMUNITA'
  type: main
- language: nl
  script: Latn
  content: '90/661/EGKS: BESCHIKKING VAN DE COMMISSIE VAN 12 DECEMBER 1990 TOT WIJZIGING
    VAN BESCHIKKING 90/459/EGKS WAARBIJ DE LID-STATEN WORDEN GEMACHTIGD EEN INTRACOMMUNAUTAIR
    TOEZICHT IN TE STELLEN OP DE INVOER TOT VERBRUIK VAN BEPAALDE IJZER- EN STAALPRODUKTEN
    VAN OORSPRONG UIT BEPAALDE DERDE LANDEN DIE ONDER HET VERDRAG TOT OPRICHTING VAN
    DE EUROPESE GEMEENSCHAP VOOR KOLEN EN STAAL VALLEN EN DIE IN DE GEMEENSCHAP IN
    HET VRIJE VERKEER WORDEN GEBRACHT'
  type: main
- language: pt
  script: Latn
  content: '90/661/CECA: DECISAO DA COMISSAO, DE 12 DE DEZEMBRO DE 1990, QUE ALTERA
    A DECISAO 90/459/CECA, QUE AUTORIZA OS ESTADOS-MEMBROS A INSTALAREM UMA VIGILANCIA
    INTRACOMUNITARIA DAS IMPORTACOES PARA INTRODUCAO NO CONSUMO DE CERTOS PRODUTOS
    SIDERURGICOS, ORIGINARIOS DE CERTOS PAISES TERCEIROS, ABRANGIDOS PELO TRATADO
    QUE INSTITUI A COMUNIDADE EUROPEIA DO CARVAO E DO ACO E INTRODUZIDOS EM LIVRE
    PRATICA NUM OUTRO ESTADO-MEMBRO'
  type: main
- language: es
  script: Latn
  content: '90/661/CECA: DECISION DE LA COMISION, DE 12 DE DICIEMBRE DE 1990, POR
    LA QUE SE MODIFICA LA DECISION 90/459/CECA POR LA QUE SE AUTORIZA A LOS ESTADOS
    MIEMBROS A ESTABLECER MEDIDAS DE VIGILANCIA INTRACOMUNITARIA EN RELACION CON LAS
    IMPORTACIONES PARA LA PUESTA AL CONSUMO DE DETERMINADOS PRODUCTOS SIDERURGICOS
    ORIGINARIOS DE DETERMINADOS PAISES TERCEROS DEL TRATADO CONSTITUTIVO DE LA COMUNIDAD
    EUROPEA DEL CARBON Y DEL ACERO Y DESPACHADOS A LIBRE PRACTICA EN LA COMUNIDAD'
