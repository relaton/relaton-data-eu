title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2175/91 of 24 July 1991 re-establishing
    the levying of customs duties on products of category 50 (order No 40.0500), originating
    in Argentina, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2175/91 DE LA COMMISSION du 24 juillet 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 50 (numéro d'' ordre 40.0500) originaires de l'' Argentine,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2175/91 DER KOMMISSION vom 24. Juli 1991 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie Nr. 50 (laufende Nummer 40.0500) mit
    Ursprung in Argentinien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2175/91 af 24. juli 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 50 (løbenummer 40.0500),
    som har oprindelse i Argentina og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
