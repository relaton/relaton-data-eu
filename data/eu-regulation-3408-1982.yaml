  content: Council Regulation (EEC) No 3408/82 of 13 December 1982 fixing for 1983
    the quantity of oil seeds and vegetable oils for which the Hellenic Republic is
    authorized to apply an import control system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3408/82 du Conseil, du 13 décembre 1982, fixant,
    pour l' année 1983, la quantité des graines oléagineuses et des huiles végétales
    pour lesquelles la République hellénique est autorisée à appliquer un régime
    de contrôle à l' importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3408/82 des Rates vom 13. Dezember 1982 zur Festsetzung
    der Menge Ölsaaten und pflanzlicher Öle für das Jahr 1983, bei deren Einfuhr
    die Republik Griechenland zur Anwendung einer Kontrollregelung ermächtigt ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3408/82 af 13. december 1982 om fastsættelse
