title:
- language: en
  script: Latn
  content: '95/444/EC: Commission Decision of 18 October 1995 amending Decision 94/278/EC
    drawing up a list of third countries from which Member States authorize the imports
    of certain products subject to Council Decision 92/118/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/444/CE: Décision de la Commission, du 18 octobre 1995, modifiant la
    décision 94/278/CE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent l''importation de certains produits visés par la
    directive 92/118/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '95/444/EG: Entscheidung der Kommission vom 18. Oktober 1995 zur Änderung
    der Entscheidung 94/278/EG der Kommission zur Festlegung der Listen von Drittländern,
    aus denen die Mitgliedstaaten die Einfuhr von bestimmten Erzeugnissen der Richtlinie
    92/118/EWG des Rates zulassen'
  type: main
- language: da
  script: Latn
  content: '95/444/EF: Kommissionens beslutning af 18. oktober 1995 om ændring af
    beslutning 94/278/EF om listen over tredjelande, hvorfra medlemsstaterne tillader
    indførsel af en række produkter omhandlet i Rådets direktiv 92/118/EØF'
  type: main
- language: el
  script: Grek
  content: '95/444/ΕΚ: Απόφαση της Επιτροπής της 18ης Οκτωβρίου
    1995 για την τροποποίηση της απόφασης 94/278/ΕΚ
    της Επιτροπής, σχετικά με την κατάρτιση καταλόγου
    τρίτων χωρών από τις οποίες τα κράτη μέλη εγκρίνουν
    τις εισαγωγές ορισμένων προϊόντων που υπόκεινται
    στις διατάξεις της οδηγίας 92/118/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '95/444/EY: Komission päätös, tehty 18 päivänä lokakuuta 1995, luettelosta
    kolmansista maista, joista jäsenvaltiot sallivat tiettyjen neuvoston direktiivissä
    92/118/ETY tarkoitettujen tuotteiden tuonnin, tehdyn komission päätöksen 94/278/EY
    muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '95/444/CE: Decisione della Commissione, del 18 ottobre 1995, che modifica
    la decisione 94/278/CE che stabilisce l''elenco dei paesi terzi da cui gli Stati
    membri autorizzano l''importazione di taluni prodotti disciplinati dalla direttiva
    92/118/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '95/444/EG: Beschikking van de Commissie van 18 oktober 1995 houdende wijziging
    van Beschikking 94/278/EG tot vaststelling van de lijst van derde landen waaruit
    de Lid-Staten de invoer van bepaalde produkten als bedoeld bij Richtlijn 92/118/EEG
    van de Raad toestaan'
  type: main
- language: pt
  script: Latn
  content: '95/444/CE: Decisão da Comissão, de 18 de Outubro de 1995, que altera
    a Decisão 94/278/CE que estabelece uma lista de países terceiros dos quais os
    Estados-membros autorizam a importação de determinados produtos abrangidos pela
    Directiva 92/118/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '95/444/CE: Decisión de la Comisión, de 18 de octubre de 1995, que modifica
    la Decisión 94/278/CE por la que se establece la lista de los terceros países
    desde los que los Estados miembros deben autorizar la importación de ciertos
    productos contemplados en la Directiva 92/118/CEE del Consejo'
  type: main
- language: sv
