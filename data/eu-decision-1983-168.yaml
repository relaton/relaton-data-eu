title:
- language: en
  script: Latn
  content: '83/168/EEC: Commission Decision of 7 April 1983 establishing that the
    apparatus described as ''Cordin - Rotating Mirror Streak Camera, model 132, with
    accessories'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/168/CEE: Décision de la Commission du 7 avril 1983 constatant que
    l''importation de l''appareil dénommé "Cordin - Rotating Mirror Streak Camera,
    model 132, with accessories" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/168/EWG: Entscheidung der Kommission vom 7. April 1983, mit der festgestellt
    wird, daß das Gerät ,,Cordin - Rotating Mirror Streak Camera, model 132, mit
    Zubehör" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '83/168/EØF: Kommissionens beslutning af 7. april 1983 om fastslåelse
    af, at indførsel af apparatet "Cordin - Rotating Mirror Streak Camera, model
    132, with accessories" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
