title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1382/90 of 22 May 1990 re-establishing the
    levying of customs duties on tents, products of category 91 (order No 40.0910)
    and other made up textile articles, woven, products of category 112 (order No
    40.1120), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1382/90 de la Commission du 22 mai 1990 portant rétablissement
    de la perception des droits de douane applicables aux tentes de la catégorie
    de produits n° 91 (numéro d'ordre 40.0910) et aux autres articles confectionnés
    en tissu de la catégorie de produits n° 112 (numéro d'ordre 40.1120) originaires
    de Chine, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1382/90 DER KOMMISSION vom 22. Mai 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Zelte der Warenkategorie 91 (laufende Nummer
    40.0910) und andere konfektionierte Waren, aus Geweben, der Warenkategorie 112
    (laufende Nummer 40.1120) mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1382/90 af 22. maj 1990 om genindførelse
    af opkrævning af told for telte under varekategori nr. 91 (løbenummer 40.0910)
    og andre varer fremstillet af tekstilstoffer under varekategori nr. 112 (løbenummer
    40.1120), som har oprindelse i Kina og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1382/90 της Επιτροπής
    της 22ας Μαΐου 1990 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για τέντες, προϊόντα της
    κατηγορίας 91 ( αύξων αριθμός 40.0910 ), και άλλα
    είδη έτοιμα από υφάσματα, προϊόντα της κατηγορίας
    112 ( αύξων αριθμός 40.1120 ), καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3897/89 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1382/90 DELLA COMMISSIONE del 22 maggio 1990 che ripristina
    la riscossione dei dazi doganali applicabili alle tende della categoria di prodotti
    n. 91 (numero d'ordine 40.0910) e agli altri manufatti confezionati di tessuti,
    della categoria di prodotti n. 112 (numero d'ordine 40.1120) originari della Cina
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3897/89
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1382/90 VAN DE COMMISSIE van 22 mei 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tenten,
    van de categorie van produkten nr. 91 (volgnummer 40.0910), en andere geconfectioneerde
    artikelen, van weefsels, van de categorie van produkten nr. 112 (volgnummer 40.1120),
    van oorsprong uit China, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1382/90 DA COMISSAO de 22 de Maio de 1990 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis às tendas, da categoria de produtos
    91 (numero de ordem 40.0910), e outros artefactos confeccionados em tecido, da
    categoria de produtos 112 (numero de ordem 40.1120), originarios da China, beneficiarios
    das preferências pautais previstas no Regulamento (CEE) n* 3897/89 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1382/90 DE LA COMISION de 22 de mayo de 1990 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a las tiendas de la categoria de productos no 91 (no de orden 40.0910), y los
    otros articulos confeccionados con tejidos, de la categoria de productos no 112
    (no de orden 40.1120), originarios de China, beneficiaria de las preferencias
    arancelarias previstas por el Reglamento (CEE) no 3897/89 del Consejo
