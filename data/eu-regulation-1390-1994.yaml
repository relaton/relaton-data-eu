    Republik Polen, und der Republik Ungarn und in dem Interimsabkommen mit der ehemaligen
    Tschechischen und Slowakischen Föderativen Republik für den Zeitraum vom 1.
    Juli 1994 bis 30. Juni 1995 vorgesehenen Einfuhrregelungen für frisches, gekühltes
    oder gefrorenes Rindfleisch
  type: main
- language: da
  script: Latn
