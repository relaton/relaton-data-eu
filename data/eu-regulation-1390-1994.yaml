title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1390/94 of 17 June 1994 laying down detailed
    rules for the period 1 July 1994 to 30 June 1995 for the application of the import
    arrangements for fresh, chilled or frozen beef provided by the European Agreements
    between the Community and the Republic of Poland and the Republic of Hungary and
    by the Interim Agreement with the former Czech and Slovak Federal Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1390/94 de la Commission du 17 juin 1994 établissant
    pour la période du 1er juillet 1994 au 30 juin 1995 les modalités d'application
    des régimes d'importation de viandes bovines fraîches, réfrigérées ou congelées,
    prévus par les accords européens entre la Communauté et la République de Pologne
    et la République de Hongrie et par l'accord intérimaire avec l'ancienne République
    fédérative tchèque et slovaque
  type: main
