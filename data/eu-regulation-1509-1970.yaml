  content: Règlement (CEE) n° 1509/70 de la Commission, du 28 juillet 1970, modifiant
    le règlement (CEE) n° 1667/69 relatif à certaines mesures à prendre dans le
    secteur du lait et des produits laitiers à la suite de la dévaluation du franc
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1509/70 der Kommission vom 28. Juli 1970 zur Änderung
    der Verordnung (EWG) Nr. 1667/69 betreffend bestimmte Maßnahmen auf dem Sektor
    Milch und Milcherzeugnisse infolge der Abwertung des französischen Franken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1509/70 della Commissione, del 28 luglio 1970, che
    modifica il regolamento (CEE) n. 1667/69 relativo a talune misure da adottare
    nel settore del latte e dei prodotti lattiero-caseari a seguito della svalutazione
    del franco francese
  type: main
- language: nl
  script: Latn
