title:
- language: en
  script: Latn
  content: '2014/734/EU: Council Decision of 9 October 2014 on the position to be
    adopted on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Communities and their Member States, of the one part, and the former
    Yugoslav Republic of Macedonia, of the other part, as regards the replacement
    of Protocol 4 to that Agreement, concerning the definition of the concept of ‘originating
    products’ and methods of administrative cooperation, by a new protocol which,
    as regards the rules of origin, refers to the Regional Convention on pan-Euro-Mediterranean
    preferential rules of origin'
  type: main
- language: fr
  script: Latn
  content: '2014/734/UE: Décision du Conseil du 9 octobre 2014 relative à la position
    à adopter au nom de l''Union européenne au sein du conseil de stabilisation
    et d''association institué par l''accord de stabilisation et d''association entre
    les Communautés européennes et leurs États membres, d''une part, et l''ancienne
    République yougoslave de Macédoine, d''autre part, en ce qui concerne le remplacement
    du protocole n ° 4 à cet accord, relatif à la définition de la notion de «produits
    originaires» et aux méthodes de coopération administrative, par un nouveau
    protocole qui, pour ce qui est des règles d''origine, fait référence à la
    convention régionale sur les règles d''origine préférentielles paneuro-méditerranéennes'
  type: main
- language: de
  script: Latn
  content: '2014/734/EU: Beschluss des Rates vom 9. Oktober 2014 über den Standpunkt,
    der im Namen der Europäischen Union im Stabilitäts- und Assoziationsrat, der
    gemäß dem Stabilisierungs- und Assoziierungsabkommen zwischen den Europäischen
    Gemeinschaften und ihren Mitgliedstaaten einerseits und der ehemaligen jugoslawischen
    Republik Mazedonien andererseits eingesetzt wurde, hinsichtlich der Ersetzung
    des Protokolls Nr. 4 dieses Abkommens über die Bestimmung des Begriffs „Erzeugnisse
    mit Ursprung in“ oder „Ursprungserzeugnisse“ und die Methoden der Zusammenarbeit
    der Verwaltungen durch ein neues Protokoll, das hinsichtlich der Ursprungsregeln
    auf das Regionale Übereinkommen über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    verweist, zu vertreten ist'
  type: main
- language: bg
