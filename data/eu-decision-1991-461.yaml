title:
- language: en
  script: Latn
  content: '91/461/EEC: Commission Decision of 13 August 1991 amending Decision 90/472/EEC
    recognizing that production of certain quality wines produced in specified regions
    is, because of their qualitative features, far below demand (Only the German text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/461/CEE: Décision de la Commission du 13 août 1991 modifiant la décision
    90/472/CEE reconnaissant que la production de certains vins de qualité produits
    dans des régions déterminées est, du fait des caractéristiques qualitatives
    de ces vins, largement inférieure à la demande (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '91/461/EWG: Entscheidung der Kommission vom 13. August 1991 zur Änderung
    der Entscheidung 90/472/EWG zur Anerkennung, daß die Nachfrage die Erzeugung
    an bestimmten Qualitätsweinen b. A. wegen der qualitativen Merkmale weit überschreitet
    (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/461/EØF: Kommissionens beslutning af 13. august 1991 om ændring af
    beslutning 90/472/EØF om anerkendelse af, at produktionen af visse kvalitetsvine
    fra bestemte dyrkningsområder på grund af disse vines kvalitative egenskaber
    langt fra er tilstrækkelig til at dække efterspørgslen (Kun den tyske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '91/461/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Αυγούστου 1991 που τροποποιεί την απόφαση 90/472/ΕΟΚ
    η οποία αναγνωρίζει ότι η παραγωγή ορισμένων
    οίνων ποιότητας που παράγονται σε καθορισμένες
    περιοχές λόγω των ποιοτικών χαρακτηριστικών
    των οίνων αυτών, είναι πολύ μικρότερη από τη
    ζήτηση'
  type: main
- language: it
  script: Latn
  content: '91/461/CEE: Decisione della Commissione del 13 agosto 1991 che modifica
    la decisione 90/472/CEE che riconosce che la produzione di taluni vini di qualità
    prodotti in regioni determinate, in considerazione delle loro caratteristiche
    qualitative, è ampiamente inferiore alla domanda (Il testo in lingua tedesca
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '91/461/EEG: Beschikking van de Commissie van 13 augustus 1991 tot wijziging
    van Beschikking 90/472/EEG houdende erkenning van het feit dat de produktie van
    bepaalde v.q.p.r.d., gezien haar kwaliteitskenmerken, ver bij de vraag achterblijft
    (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '91/461/CEE: Decisão da Comissão de 13 de Agosto de 1991 que altera a
    Decisão 90/472/CEE que reconhece que a produção de determinados vinhos de qualidade
    produzidos em regiões determinadas (VQPRD) é, devido às características qualitativas
    destes vinhos, largamente inferior à procura (Apenas faz fé o texto em língua
    alemã)'
  type: main
- language: es
  script: Latn
  content: '91/461/CEE: Decisión de la Comisión de 13 de agosto de 1991 por la que
    se modifica la Decisión 90/472/CEE por la que se reconoce que la producción
    de determinados vinos de calidad producidos en regiones determinadas, debido a
    las características cualitativas de dichos vinos, es ampliamente inferior a la
    demanda (El texto en lengua alemana es el único auténtico)'
