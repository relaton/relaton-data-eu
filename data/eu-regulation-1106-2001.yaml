title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1106/2001 of 30 May 2001 extending the period
    of application of Regulation (EEC) No 3621/92 temporarily suspending the autonomous
    Common Customs Tariff duties on imports of certain fishery products into the Canary
    Islands and Regulation (EC) No 527/96 temporarily suspending the autonomous Common
    Customs Tariff duties and progressively introducing the Common Customs Tariff
    duties on imports of certain industrial products into the Canary Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1106/2001 du Conseil du 30 mai 2001 étendant la période
    d'application du règlement (CEE) n° 3621/92 portant suspension temporaire des
    droits autonomes du tarif douanier commun lors de l'importation de certains produits
    de la pêche aux îles Canaries et du règlement (CE) n° 527/96 portant suspension
    temporaire des droits autonomes du tarif douanier commun et portant introduction
    progressive des droits du tarif douanier commun lors de l'importation d'un certain
    nombre de produits industriels aux îles Canaries
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1106/2001 des Rates vom 30. Mai 2001 zur Verlängerung
    der Anwendung der Verordnung (EWG) Nr. 3621/92 zur zeitweiligen Aussetzung der
    autonomen Zollsätze des Gemeinsamen Zolltarifs bei der Einfuhr bestimmter Fischereierzeugnisse
    auf die Kanarischen Inseln und der Verordnung (EG) Nr. 527/96 zur zeitweiligen
    Aussetzung der autonomen Zollsätze des Gemeinsamen Zolltarifs und zur schrittweisen
    Einführung der Zollsätze des Gemeinsamen Zolltarifs bei der Einfuhr bestimmter
    gewerblicher Waren auf die Kanarischen Inseln
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1106/2001 af 30. maj 2001 om forlængelse af
    anvendelsesperioden for forordning (EØF) nr. 3621/92 om midlertidig suspension
    af de autonome satser i den fælles toldtarif ved indførsel af visse fiskerivarer
    til De Kanariske Øer og forordning (EF) nr. 527/96 om midlertidig suspension
    af de autonome satser i den fælles toldtarif og om gradvis indførelse af satserne
    i den fælles toldtarif ved indførsel af visse industrivarer til De Kanariske
    Øer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1106/2001 του Συμβουλίου,
    της 30ής Μαΐου 2001, για την παράταση της περιόδου
    εφαρμογής του κανονισμού (ΕΟΚ) αριθ. 3621/92 για
    την προσωρινή αναστολή των αυτόνομων δασμών
    του κοινού δασμολογίου κατά την εισαγωγή ορισμένων
    προϊόντων της αλιείας στις Καναρίους Νήσους
    και του κανονισμού (ΕΚ) αριθ. 527/96 για την προσωρινή
    αναστολή των αυτόνομων δασμών του κοινού δασμολογίου
    και για τη σταδιακή εφαρμογή των δασμών του
    κοινού δασμολογίου κατά την εισαγωγή ορισμένων
    βιομηχανικών προϊόντων στις Καναρίους Νήσους
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1106/2001, annettu 30 päivänä toukokuuta 2001,
    eräiden kalastustuotteiden Kanariansaarille tuonnin yhteydessä sovellettavien
    yhteisen tullitariffin autonomisten tullien tilapäisestä suspensiosta annetun
    asetuksen (ETY) N:o 3621/92 sekä eräiden teollisuustuotteiden tuonnin yhteydessä
    Kanariansaarille sovellettavien autonomisten tullien tilapäisestä suspensiosta
    ja yhteisen tullitariffin (CCT) tullien asteittaisesta käyttöönotosta annetun
    asetuksen (EY) N:o 527/96 soveltamisen jatkamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1106/2001 del Consiglio, del 30 maggio 2001, che proroga
    il periodo di applicazione del regolamento (CEE) n. 3621/92, recante sospensione
    temporanea dei dazi autonomi della tariffa doganale comune all'importazione di
    determinati prodotti della pesca nelle Isole Canarie e del regolamento (CE) n.
    527/96, recante sospensione temporanea dei dazi autonomi della tariffa doganale
    comune nonché introduzione progressiva dei dazi della tariffa doganale comune
    all'importazione di un certo numero di prodotti industriali nelle Isole Canarie
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1106/2001 van de Raad van 30 mei 2001 betreffende
    de verlenging van de toepassing van Verordening (EEG) nr. 3621/92 houdende tĳdelĳke
    schorsing van de autonome rechten van het gemeenschappelĳk douanetarief bĳ invoer
    van een aantal visserĳproducten op de Canarische Eilanden en van Verordening
    (EG) nr. 527/96 houdende tĳdelĳke schorsing van de autonome rechten van het
    gemeenschappelĳk douanetarief bĳ de invoer van een aantal industriële producten
    op de Canarische Eilanden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1106/2001 do Conselho, de 30 de Maio de 2001, que
    prorroga o prazo de aplicação do Regulamento (CEE) n.° 3621/92, relativo à
    suspensão dos direitos autónomos da pauta aduaneira comum na importação de
    certos produtos da pesca nas Ilhas Canárias e do Regulamento (CE) n.° 527/96,
    relativo à suspensão dos direitos autónomos da pauta aduaneira comum e à introdução
    progressiva dos direitos da pauta aduaneira comum na importação de certos produtos
    industriais nas Ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1106/2001 del Consejo, de 30 de mayo de 2001, por el
    que se prorroga el período de aplicación del Reglamento (CEE) n° 3621/92 por
    el que se suspenden temporalmente los derechos autónomos del arancel aduanero
    común para la importación de determinados productos de la pesca en las islas
    Canarias y del Reglamento (CE) n° 527/96 por el que suspenden temporalmente los
    derechos autónomos del arancel aduanero común y por el que se introducen progresivamente
    los derechos del arancel aduanero común en la importación de determinados productos
    industriales en las islas Canarias
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1106/2001 av den 30 maj 2001 om förlängning
    av giltighetstiden av förordning (EEG) nr 3621/92 om tillfälligt upphävande
    av de autonoma tullarna i Gemensamma tulltaxan vid import av vissa fiskeprodukter
    till Kanarieöarna och förordning (EG) nr 527/96 om tillfälligt upphävande
    av de autonoma tullarna i Gemensamma tulltaxan och om gradvist införande av tullar
    i Gemensamma tulltaxan vid import av vissa industriprodukter till Kanarieöarna
  type: main
