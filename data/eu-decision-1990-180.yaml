    di operazioni o a ricorrere a talune valutazioni approssimative per il calcolo
    della base delle risorse proprie provenienti dall''imposta (Il testo in lingua
    olandese è il solo facente fede) sul valore aggiunto'
  type: main
- language: nl
  script: Latn
  content: '90/180/Euratom, EEG: Beschikking van de Commissie van 23 maart 1990 waarbij
