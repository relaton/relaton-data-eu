    κατηγορίες δραστηριοτήτων και να χρησιμοποιούν
    κατά προσέγγιση εκτιμήσεις κατά τον υπολογισμό
    της βάσης των ιδίων πόρων που προέρχονται από
    το φόρο επί της προστιθέμενης αξίας (Το κείμενο
    στην ολλανδική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '90/180/Euratom, ETY: Komission päätös, tehty 23 päivänä maaliskuuta
    1990, luvan antamisesta Alankomaille olla ottamatta huomioon eräitä toimiluokkia
    tai käyttää eräitä likimääräisiä arvioita arvonlisäverosta kertyvien
    omien varojen perustan laskemiseksi (Ainoastaan hollanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '90/180/Euratom, CEE: Decisione della Commissione, del 23 marzo 1990, che
