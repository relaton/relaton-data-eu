  script: Latn
  content: '90/180/Euratom, EEC: Commission Decision of 23 March 1990 authorizing
    the Netherlands not to take into account certain categories of transactions and
    to use certain approximate estimates for the calculation of the VAT own resources
    base (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/180/Euratom, CEE: Décision de la Commission, du 23 mars 1990, autorisant
    les Pays-Bas à ne pas tenir compte de certaines catégories d''opérations et
    à utiliser certaines estimations approximatives pour le calcul de la base des
    ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en langue
    néerlandaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/180/Euratom, EWG: Entscheidung der Kommission vom 23. März 1990 mit
    der die Niederlande ermächtigt werden, bei der Berechnung der Grundlage für
    die MwSt.-Eigenmittel bestimmte Gruppen von Umsätzen nicht zu berücksichtigen
    und die Grundlage bei bestimmten anderen Gruppen von Umsätzen anhand annähernder
    Schätzungen zu ermitteln (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/180/Euratom, EØF: Kommissionens beslutning af 23. marts 1990 om bemyndigelse
    af Nederlandene til at beregne grundlaget for Fællesskabernes momsindtægter
    uden hensyntagen til visse transaktioner og, for andre transaktioners vedkommende,
    på basis af en tilnærmelsesvis vurdering (Kun den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/180/Ευρατόμ, ΕΟΚ: Απόφαση της Επιτροπής
