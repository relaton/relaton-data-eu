  content: Décision de la Commission, du 17 décembre 1971, relative au remboursement
    par le FEOGA, section orientation, au Royaume de Belgique les frais entraînés
    par les enquêtes sur le cheptel porcin effectuées les 1er mars et 15 mai 1971
  type: main
- language: de
  script: Latn
  content: '72/58/EWG: Entscheidung der Kommission vom 17. Dezember 1971 über die
    Erstattung der bei den am 1. März und 15. Mai 1971 durchgeführten Erhebungen
    über den Schweinebestand entstandenen Kosten durch den EAGFL, Abteilung Ausrichtung,
    an das Königreich Belgien'
  type: main
- language: it
  script: Latn
  content: '72/58/CEE: Decisione della Commissione del 17 dicembre 1971 relativa al
    rimborso da parte del FEAOG sezione orientamento al Regno del Belgio delle spese
    sostenute per le inchieste sul patrimonio suinicolo effettuate il 1 marzo e il
    15 maggio 1971'
  type: main
- language: nl
  script: Latn
  content: '72/58/EEG: Beschikking van de Commissie van 17 december 1971 betreffende
    de terugbetaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België
    van de kosten verbonden aan de op 1 maart en 15 mei 1971 uitgevoerde enquêtes
    inzake de varkensstapel'
