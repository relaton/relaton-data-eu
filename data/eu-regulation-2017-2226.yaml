id: EURegulation20172226
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EU) 2017/2226 of the European Parliament and of the Council
    of 30 November 2017 establishing an Entry/Exit System (EES) to register entry
    and exit data and refusal of entry data of third-country nationals crossing the
    external borders of the Member States and determining the conditions for access
    to the EES for law enforcement purposes, and amending the Convention implementing
    the Schengen Agreement and Regulations (EC) No 767/2008 and (EU) No 1077/2011
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/2226 du Parlement européen et du Conseil du 30 novembre
    2017 portant création d’un système d’entrée/de sortie (EES) pour enregistrer
    les données relatives aux entrées, aux sorties et aux refus d’entrée concernant
    les ressortissants de pays tiers qui franchissent les frontières extérieures
    des États membres et portant détermination des conditions d’accès à l’EES
    à des fins répressives, et modifiant la convention d’application de l’accord
    de Schengen et les règlements (CE) no 767/2008 et (UE) no 1077/2011
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2017/2226 des Europäischen Parlaments und des Rates vom
    30. November 2017 über ein Einreise-/Ausreisesystem (EES) zur Erfassung der Ein-
    und Ausreisedaten sowie der Einreiseverweigerungsdaten von Drittstaatsangehörigen
    an den Außengrenzen der Mitgliedstaaten und zur Festlegung der Bedingungen für
    den Zugang zum EES zu Gefahrenabwehr- und Strafverfolgungszwecken und zur Änderung
    des Übereinkommens zur Durchführung des Übereinkommens von Schengen sowie der
    Verordnungen (EG) Nr. 767/2008 und (EU) Nr. 1077/2011
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2017/2226 на Европейския парламент
    и на Съвета от 30 ноември 2017 година за създаване
    на Система за влизане/излизане (СВИ) с цел регистриране
    на данните относно влизането и излизането
    и данните относно отказа за влизане на граждани
    на трети страни, преминаващи външните граници
    на държавите членки, за определяне на условията
    за достъп до СВИ за целите на правоприлагането
    и за изменение на Конвенцията за прилагане
    на Шенгенското споразумение и регламенти (ЕО)
    № 767/2008 и (ЕС) № 1077/2011
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2017/2226 ze dne 30. listopadu
    2017, kterým se zřizuje Systém vstupu/výstupu (EES) pro registraci údajů
    o vstupu a výstupu a údajů o odepření vstupu, pokud jde o státní příslušníky
    třetích zemí překračující vnější hranice členských států, kterým
    se stanoví podmínky přístupu do systému EES pro účely vymáhání práva
    a kterým se mění Úmluva k provedení Schengenské dohody a nařízení (ES)
    č. 767/2008 a (EU) č. 1077/2011
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2017/2226 af 30. november
    2017 om oprettelse af et ind- og udrejsesystem til registrering af ind- og udrejseoplysninger
    og oplysninger om nægtelse af indrejse vedrørende tredjelandsstatsborgere, der
    passerer medlemsstaternes ydre grænser, om fastlæggelse af betingelserne for
    adgang til ind- og udrejsesystemet til retshåndhævelsesformål og om ændring
    af konventionen om gennemførelse af Schengenaftalen og forordning (EF) nr. 767/2008
    og (EU) nr. 1077/2011
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2017/2226 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 30ής Νοεμβρίου 2017, σχετικά
    με τη θέσπιση συστήματος εισόδου/εξόδου (ΣΕΕ)
    για την καταχώριση δεδομένων εισόδου και εξόδου
