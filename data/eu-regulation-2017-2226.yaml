    τρίτων χωρών που διέρχονται τα εξωτερικά σύνορα
    των κρατών μελών, τον καθορισμό των όρων πρόσβασης
    στο ΣΕΕ για σκοπούς επιβολής του νόμου και
    την τροποποίηση της σύμβασης εφαρμογής της
    Συμφωνίας του Σένγκεν και των κανονισμών (ΕΚ)
    αριθ. 767/2008 και (ΕΕ) αριθ. 1077/2011
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2017/2226, 30. november 2017,
    millega luuakse riiki sisenemise ja riigist lahkumise süsteem liikmesriikide
    välispiire ületavate kolmandate riikide kodanike riiki sisenemise ja riigist
    lahkumise andmete ja sisenemiskeeluandmete registreerimiseks ning määratakse
    kindlaks riiki sisenemise ja riigist lahkumise süsteemile õiguskaitse eesmärgil
    juurdepääsu andmise tingimused ning millega muudetakse Schengeni lepingu rakendamise
    konventsiooni ning määruseid (EÜ) nr 767/2008 ja (EL) nr 1077/2011
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2017/2226, annettu 30 päivänä
    marraskuuta 2017, rajanylitystietojärjestelmän (EES) perustamisesta jäsenvaltioiden
    ulkorajat ylittävien kolmansien maiden kansalaisten maahantuloa, maastalähtöä
    ja pääsyn epäämistä koskevien tietojen rekisteröimiseksi ja edellytysten
    määrittämisestä pääsylle EES:n tietoihin lainvalvontatarkoituksissa sekä
    Schengenin sopimuksen soveltamisesta tehdyn yleissopimuksen ja asetusten (EY)
    N:o 767/2008 ja (EU) N:o 1077/2011 muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2017/2226 ó Pharlaimint na hEorpa agus ón gComhairle
    an 30 Samhain 2017 lena mbunaítear Córas Dul Isteach/Imeachta (EES) chun sonraí
    faoi dhul isteach agus imeacht agus sonraí faoi dhiúltú cead isteach náisiúnach
    tríú tír a chlárú agus iad ag trasnú theorainneacha seachtracha na mBallstát
    agus lena gcinntear na coinníollacha ar a dtabharfar rochtain ar EES chun críocha
    fhorghníomhú an dlí, agus lena leasaítear an Coinbhinsiún lena ndéantar
    Comhaontú Schengen a chur chun feidhme agus Rialachán (CE) Uimh. 767/2008 agus
    Rialachán (AE) Uimh. 1077/2011
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2017/2226 Europskog parlamenta i Vijeća od 30. studenoga 2017.
    o uspostavi sustava ulaska/izlaska (EES) za registraciju podataka o ulasku i izlasku
    te podataka o odbijanju ulaska za državljane trećih zemalja koji prelaze vanjske
    granice država članica i određivanju uvjeta za pristup EES-u za potrebe izvršavanja
    zakonodavstva te o izmjeni Konvencije o provedbi Schengenskog sporazuma i uredbi
    (EZ) br. 767/2008 i (EU) br. 1077/2011
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2017/2226 rendelete (2017. november
    30.) a tagállamok külső határait átlépő harmadik országbeli állampolgárok
    belépésére és kilépésére, valamint beléptetésének megtagadására vonatkozó
    adatok rögzítésére szolgáló határregisztrációs rendszer (EES) létrehozásáról
    és az EES-hez való bűnüldözési célú hozzáférés feltételeinek meghatározásáról,
    valamint a Schengeni Megállapodás végrehajtásáról szóló egyezmény, a
    767/2008/EK rendelet és az 1077/2011/EU rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2017/2226 del Parlamento europeo e del Consiglio, del
    30 novembre 2017, che istituisce un sistema di ingressi/uscite per la registrazione
    dei dati di ingresso e di uscita e dei dati relativi al respingimento dei cittadini
    di paesi terzi che attraversano le frontiere esterne degli Stati membri e che
    determina le condizioni di accesso al sistema di ingressi/uscite a fini di contrasto
    e che modifica la Convenzione di applicazione dell’Accordo di Schengen e i regolamenti
    (CE) n. 767/2008 e (UE) n. 1077/2011
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2017/2226 (2017. gada 30. novembris),
    ar ko izveido ieceļošanas/izceļošanas sistēmu (IIS), lai reģistrētu to
    trešo valstu valstspiederīgo ieceļošanas un izceļošanas datus un ieceļošanas
    atteikumu datus, kuri šķērso dalībvalstu ārējās robežas, un ar ko paredz
    nosacījumus piekļuvei IIS tiesībaizsardzības nolūkos, un ar ko groza Konvenciju,
    ar ko īsteno Šengenas nolīgumu, un Regulas (EK) Nr. 767/2008 un (ES) Nr. 1077/2011
  type: main
- language: lt
  script: Latn
  content: 2017 m. lapkričio 30 d. Europos Parlamento ir Tarybos reglamentas (ES)
    2017/2226, kuriuo sukuriama atvykimo ir išvykimo sistema (AIS), kurioje registruojami
    trečiųjų šalių piliečių, kertančių valstybių narių išorės sienas,
    atvykimo ir išvykimo bei atsisakymo leisti jiems atvykti duomenys, nustatomos
    prieigos prie AIS teisėsaugos tikslais sąlygos ir iš dalies keičiama Konvencija
    dėl Šengeno susitarimo įgyvendinimo ir reglamentai (EB) Nr. 767/2008 ir (ES)
    Nr. 1077/2011
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2017/2226 tal-Parlament Ewropew u tal-Kunsill tat-30 ta’
    Novembru 2017 li jistabbilixxi Sistema ta’ Dħul/Ħruġ (EES) biex tiġi rreġistrata
    data dwar id-dħul u l-ħruġ u data dwar iċ-ċaħda tad-dħul ta’ ċittadini
    ta’ pajjiżi terzi li jaqsmu l-fruntieri esterni tal-Istati Membri u li jiddetermina
    l-kondizzjonijiet għall-aċċess għall-EES għal raġunijiet ta’ infurzar
    tal-liġi, u li jemenda l-Konvenzjoni li timplimenta l-Ftehim ta’ Schengen u
    r-Regolamenti (KE) Nru 767/2008 u (UE) Nru 1077/2011
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2017/2226 van het Europees Parlement en de Raad van 30
    november 2017 tot instelling van een inreis-uitreissysteem (EES) voor de registratie
    van inreis- en uitreisgegevens en van gegevens over weigering van toegang ten
    aanzien van onderdanen van derde landen die de buitengrenzen overschrijden en
    tot vaststelling van de voorwaarden voor toegang tot het EES voor rechtshandhavingsdoeleinden
    en tot wijziging van de overeenkomst ter uitvoering van het te Schengen gesloten
    akkoord en Verordeningen (EG) nr. 767/2008 en (EU) nr. 1077/2011
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/2226 z dnia 30
    listopada 2017 r. ustanawiające system wjazdu/wyjazdu (EES) w celu rejestrowania
    danych dotyczących wjazdu i wyjazdu obywateli państw trzecich przekraczających
    granice zewnętrzne państw członkowskich i danych dotyczących odmowy wjazdu
    w odniesieniu do takich obywateli oraz określające warunki dostępu do EES na
    potrzeby ochrony porządku publicznego i zmieniające konwencję wykonawczą do
    układu z Schengen i rozporządzenia (WE) nr 767/2008 i (UE) nr 1077/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2017/2226 do Parlamento Europeu e do Conselho, de 30 de
    novembro de 2017, que estabelece o Sistema de Entrada/Saída (SES) para registo
    dos dados das entradas e saídas e dos dados das recusas de entrada dos nacionais
    de países terceiros aquando da passagem das fronteiras externas dos Estados-Membros,
    que determina as condições de acesso ao SES para efeitos de aplicação da lei,
    e que altera a Convenção de Aplicação do Acordo de Schengen e os Regulamentos
    (CE) n.o 767/2008 e (UE) n.o 1077/2011
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2017/2226 al Parlamentului European și al Consiliului
    din 30 noiembrie 2017 de instituire a Sistemului de intrare/ieșire (EES) pentru
    înregistrarea datelor de intrare și de ieșire și a datelor referitoare la
    refuzul intrării ale resortisanților țărilor terțe care trec frontierele
    externe ale statelor membre, de stabilire a condițiilor de acces la EES în scopul
    aplicării legii și de modificare a Convenției de punere în aplicare a Acordului
    Schengen și a Regulamentelor (CE) nr. 767/2008 și (UE) nr. 1077/2011
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2017/2226 z 30. novembra
    2017, ktorým sa zriaďuje systém vstup/výstup na zaznamenávanie údajov o
    vstupe a výstupe štátnych príslušníkov tretích krajín prekračujúcich
    vonkajšie hranice členských štátov a o odopretí ich vstupu a stanovujú
    podmienky prístupu do systému vstup/výstup na účely presadzovania práva,
    a ktorým sa mení Dohovor, ktorým sa vykonáva Schengenská dohoda, a nariadenia
    (ES) č. 767/2008 a (EÚ) č. 1077/2011
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2017/2226 Evropskega parlamenta in Sveta z dne 30. novembra
    2017 o vzpostavitvi sistema vstopa/izstopa (SVI) za evidentiranje podatkov o vstopu
    in izstopu ter podatkov o zavrnitvi vstopa državljanov tretjih držav pri prehajanju
    zunanjih meja držav članic in določitvi pogojev za dostop do SVI zaradi preprečevanja,
    odkrivanja in preiskovanja kaznivih dejanj ter o spremembi Konvencije o izvajanju
    Schengenskega sporazuma in uredb (ES) št. 767/2008 ter (EU) št. 1077/2011
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2017/2226 del Parlamento Europeo y del Consejo, de 30 de
    noviembre de 2017, por el que se establece un Sistema de Entradas y Salidas (SES)
    para registrar los datos de entrada y salida y de denegación de entrada relativos
    a nacionales de terceros países que crucen las fronteras exteriores de los Estados
    miembros, se determinan las condiciones de acceso al SES con fines policiales
    y se modifican el Convenio de aplicación del Acuerdo de Schengen y los Reglamentos
    (CE) n.o 767/2008 y (UE) n.o 1077/2011
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2017/2226 av den 30 november
    2017 om inrättande av ett in- och utresesystem för registrering av in- och utreseuppgifter
    och av uppgifter om nekad inresa för tredjelandsmedborgare som passerar medlemsstaternas
    yttre gränser, om fastställande av villkoren för åtkomst till in- och utresesystemet
    för brottsbekämpande ändamål och om ändring av konventionen om tillämpning
    av Schengenavtalet och förordningarna (EG) nr 767/2008 och (EU) nr 1077/2011
