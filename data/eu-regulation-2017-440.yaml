- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/440 of 13 March 2017 concerning
    the authorisation of the preparation of Bacillus amyloliquefaciens (PTA-6507),
    Bacillus amyloliquefaciens (NRRL B-50013) and Bacillus amyloliquefaciens (NRRL
    B-50104) as a feed additive for chickens for fattening, chickens reared for laying,
    minor poultry species for fattening and minor poultry species reared for laying
    (holder of authorisation Danisco (UK) Ltd, trading as Danisco Animal Nutrition)
  type: main
