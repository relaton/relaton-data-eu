title:
- language: en
  script: Latn
  content: Second Council Directive 65/264/EEC of 13 May 1965 implementing in respect
    of the film industry the provisions of the General Programmes for the abolition
    of restrictions on freedom of establishment and freedom to provide services
  type: main
- language: fr
  script: Latn
  content: Deuxième directive 65/264/CEE du Conseil, du 13 mai 1965, en vue de la
    mise en oeuvre des dispositions des programmes généraux pour la suppression
    des restrictions à la liberté d'établissement et à la libre prestation des
    services en matière de cinématographie
  type: main
- language: de
  script: Latn
  content: Zweite Richtlinie 65/264/EWG de Rates vom 13. Mai 1965 zur Durchführung
    der Allgemeinen Programme zur Aufhebung der Beschränkungen der Niederlassungsfreiheit
    und des freien Dienstleistungsverkehrs auf dem Gebiet des Filmwesens
  type: main
- language: da
  script: Latn
  content: Rådets andet direktiv 65/264/EØF af 13. maj 1965 til gennemførelsesbestemmelserne
    i de almindelige planer om ophævelse af begrænsninger i etableringsfriheden
    og om den frie udveksling af tjenesteydelser vedrørende film
  type: main
- language: el
  script: Grek
  content: Δεύτερη οδηγία 65/264/ΕΟΚ του Συμβουλίου της
    13ης Μαΐου 1965 περί της θέσεως σε εφαρμογή των
    διατάξεων των γενικών προγραμμάτων για την
    κατάργηση των περιορισμών στο δικαίωμα εγκαταστάσεως
    και στην ελεύθερη παροχή υπηρεσιών στον τομέα
    της κινηματογραφίας
  type: main
- language: fi
  script: Latn
  content: Toinen neuvoston direktiivi 65/264/ETY, annettu 13 päivänä toukokuuta
    1965, sijoittautumisvapauden ja palvelujen tarjoamisen vapauden rajoitusten poistamiseksi
    annettujen yleisten toimintaohjelmien määräysten täytäntöönpanosta elokuvateollisuudessa
  type: main
- language: it
  script: Latn
  content: Seconda direttiva 65/264/CEE del Consiglio, del 13 maggio 1965, relativa
    all'applicazione delle disposizioni dei Programmi generali per la soppressione
    delle restrizioni alle libertà di stabilimento ed alla libera prestazione dei
    servizi in materia di cinematografia
  type: main
- language: nl
  script: Latn
  content: Tweede Richtlijn 65/264/EEG van de Raad van 13 mei 1965 ter uitvoering
    van de Algemene Programma's voor de opheffing van de beperkingen van de vrijheid
    van vestiging en van het vrij verrichten van diensten op het gebied van de cinematografie
  type: main
- language: pt
  script: Latn
  content: Segunda Directiva 65/264/CEE do Conselho, de 13 de Maio de 1965, relativa
    à aplicação das disposições dos Programas Gerais para a Supressão das Restrições
    à Liberdade de Estabelecimento e à Livre Prestação de Serviços em matéria
    de cinematografia
  type: main
- language: es
  script: Latn
  content: Segunda Directiva 65/264/CEE del Consejo, de 13 de mayo de 1965, para la
    aplicación de las disposiciones de los Programas generales para la supresión
    de las restricciones a la libertad de establecimiento y a la libre prestación
    de servicios en materia de cinematografía
  type: main
- language: sv
  script: Latn
  content: Rådets andra direktiv 65/264/EEG av den 13 maj 1965 för genomförande
    av bestämmelserna i de allmänna handlingsprogrammen för upphävande av begränsningar
    av etableringsfriheten och friheten att tillhandahålla tjänster inom filmindustrin
  type: main
