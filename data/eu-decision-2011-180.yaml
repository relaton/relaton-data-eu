    das Inverkehrbringen von Kleinpackungen mit Mischungen von Standardsaatgut verschiedener
    Gemüsesorten der gleichen Art gestattet werden darf (Bekannt gegeben unter Aktenzeichen
    K(2011) 1760)'
  type: main
