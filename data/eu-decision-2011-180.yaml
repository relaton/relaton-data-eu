  script: Latn
  content: '2011/180/EU: Commission Decision of 23 March 2011 implementing Council
    Directive 2002/55/EC as regards conditions under which the placing on the market
    of small packages of mixtures of standard seed of different vegetable varieties
    belonging to the same species may be authorised (notified under document C(2011)
    1760)'
  type: main
- language: fr
  script: Latn
  content: '2011/180/UE: Décision de la Commission du 23 mars 2011 portant modalités
    d’application de la directive 2002/55/CE du Conseil en ce qui concerne les conditions
    dans lesquelles la commercialisation de petits emballages de mélanges de semences
    standard de plusieurs variétés de légumes de la même espèce peut être autorisée
    [notifiée sous le numéro C(2011) 1760]'
  type: main
- language: de
  script: Latn
