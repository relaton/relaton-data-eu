    zur Änderung der Durchführungsverordnung (EU) 2018/2019 hinsichtlich bestimmter
    zum Anpflanzen bestimmter Pflanzen von Berberis thunbergii mit Ursprung im Vereinigten
    Königreich und zur Änderung der Durchführungsverordnung (EU) 2020/1213 hinsichtlich
    der Pflanzenschutzmaßnahmen für das Einführen dieser zum Anpflanzen bestimmten
    Pflanzen in die Union sowie zur Berichtigung der Durchführungsverordnung (EU)
    2020/1213 hinsichtlich bestimmter zum Anpflanzen bestimmter Pflanzen von Alnus
    cordata, Alnus glutinosa und Alnus incana mit Ursprung im Vereinigten Königreich
