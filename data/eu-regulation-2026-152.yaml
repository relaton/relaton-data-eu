    тези растения за засаждане на територията
    на Съюза и за поправка на Регламент за изпълнение
    (ЕС) 2020/1213 по отношение на някои растения за
    засаждане от видовете Alnus cordata, Alnus glutinosa и Alnus
    incana с произход от Обединеното кралство
  type: main
