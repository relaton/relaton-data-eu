    Alnus cordata, Alnus glutinosa en Alnus incana van oorsprong uit het Verenigd
    Koninkrijk
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2026/152 z dnia 22 stycznia 2026
    r. zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do niektórych
    roślin przeznaczonych do sadzenia gatunku Berberis thunbergii pochodzących ze
    Zjednoczonego Królestwa i rozporządzenie wykonawcze (UE) 2020/1213 w odniesieniu
    do środków fitosanitarnych do celów wprowadzania tych roślin przeznaczonych
    do sadzenia na terytorium Unii oraz w sprawie sprostowania rozporządzenia wykonawczego
    (UE) 2020/1213 w odniesieniu do niektórych roślin przeznaczonych do sadzenia
    gatunków Alnus cordata, Alnus glutinosa i Alnus incana pochodzących ze Zjednoczonego
    Królestwa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2026/152 da Comissão, de 22 de janeiro
    de 2026, que altera o Regulamento de Execução (UE) 2018/2019 no que diz respeito
    a determinados vegetais para plantação de Berberis thunbergii originários do
    Reino Unido, que altera o Regulamento de Execução (UE) 2020/1213 no que se refere
    às medidas fitossanitárias para a introdução desses vegetais para plantação
    no território da União e que retifica o Regulamento de Execução (UE) 2020/1213
    relativamente a determinados vegetais para plantação de Alnus cordata, Alnus
    glutinosa e Alnus incana originários do Reino Unido
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2026/152 al Comisiei din 22 ianuarie
    2026 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării aparținând speciei Berberis
    thunbergii originare din Regatul Unit și de modificare a Regulamentului de punere
    în aplicare (UE) 2020/1213 în ceea ce privește măsurile fitosanitare pentru
    introducerea respectivelor plante destinate plantării pe teritoriul Uniunii și
    de rectificare a Regulamentului de punere în aplicare (UE) 2020/1213 în ceea
    ce privește anumite plante destinate plantării aparținând speciilor Alnus
    cordata, Alnus glutinosa și Alnus incana originare din Regatul Unit
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2026/152 z 22. januára 2026, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    určené na výsadbu patriace k druhu Berberis thunbergii pochádzajúce zo Spojeného
    kráľovstva, a ktorým sa mení vykonávacie nariadenie (EÚ) 2020/1213, pokiaľ
    ide o rastlinolekárske opatrenia v súvislosti so vstupom uvedených rastlín
    určených na výsadbu na územie Únie, a ktorým sa opravuje vykonávacie nariadenie
    (EÚ) 2020/1213, pokiaľ ide o určité rastliny určené na výsadbu patriace
    k druhom Alnus cordata, Alnus glutinosa a Alnus incana pochádzajúce zo Spojeného
    kráľovstva
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2026/152 z dne 22. januarja 2026 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Berberis thunbergii
    s poreklom iz Združenega kraljestva ter spremembi Izvedbene uredbe (EU) 2020/1213
    glede fitosanitarnih ukrepov za vnos navedenih rastlin za saditev na ozemlje Unije
    in popravku Izvedbene uredbe (EU) 2020/1213 glede nekaterih rastlin za saditev
    Alnus cordata, Alnus glutinosa in Alnus incana s poreklom iz Združenega kraljestva
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2026/152 de la Comisión, de 22 de enero
    de 2026, por el que se modifica el Reglamento de Ejecución (UE) 2018/2019 en
    lo que respecta a determinados vegetales para plantación de Berberis thunbergii
    originarios del Reino Unido, se modifica el Reglamento de Ejecución (UE) 2020/1213
    en lo que respecta a las medidas fitosanitarias para la introducción de dichos
    vegetales para plantación en el territorio de la Unión y se corrige el Reglamento
    de Ejecución (UE) 2020/1213 en lo que respecta a determinados vegetales para
    plantación de Alnus cordata, Alnus glutinosa y Alnus incana originarios del Reino
    Unido
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2026/152 av den 22 januari
    2026 om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa
    växter för plantering av Berberis thunbergii med ursprung i Förenade kungariket
    och om ändring av genomförandeförordning (EU) 2020/1213 vad gäller växtskyddsåtgärder
    för införsel av dessa växter för plantering till unionens territorium samt
    om rättelse av genomförandeförordning (EU) 2020/1213 vad gäller vissa växter
    för plantering av Alnus cordata, Alnus glutinosa och Alnus incana med ursprung
    i Förenade kungariket
