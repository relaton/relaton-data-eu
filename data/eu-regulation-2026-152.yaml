title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/152 of 22 January 2026 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Berberis thunbergii originating in the United Kingdom, and amending Implementing
    Regulation (EU) 2020/1213 as regards the phytosanitary measures for the introduction
    of those plants for planting into the Union territory and correcting Implementing
    Regulation (EU) 2020/1213 as regards certain plants for planting of Alnus cordata,
    Alnus glutinosa and Alnus incana originating in the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/152 de la Commission du 22 janvier
    2026 modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne
    certains végétaux destinés à la plantation, appartenant à l’espèce Berberis
    thunbergii et originaires du Royaume-Uni, modifiant le règlement d’exécution
    (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires préalables à l’introduction
    de ces végétaux destinés à la plantation sur le territoire de l’Union et
    rectifiant le règlement d’exécution (UE) 2020/1213 en ce qui concerne certains
    végétaux destinés à la plantation, appartenant aux espèces Alnus cordata,
    Alnus glutinosa et Alnus incana et originaires du Royaume-Uni
  type: main
- language: de
  script: Latn
