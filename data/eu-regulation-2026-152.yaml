    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde voor
    opplant bestemde planten van de soort Berberis thunbergii van oorsprong uit het
    Verenigd Koninkrijk, tot wijziging van Uitvoeringsverordening (EU) 2020/1213 wat
    betreft de fytosanitaire maatregelen voor het binnenbrengen op het grondgebied
    van de Unie van die voor opplant bestemde planten, en tot rectificatie van Uitvoeringsverordening
