    fir-rigward ta’ ċerti pjanti għat-tħawwil tal-Berberis thunbergii li joriġinaw
    mir-Renju Unit, u li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2020/1213
    fir-rigward tal-miżuri fitosanitarji għall-introduzzjoni ta’ dawk il-pjanti
    għat-tħawwil fit-territorju tal-Unjoni u li jikkoreġi r-Regolament ta’ Implimentazzjoni
    (UE) 2020/1213 fir-rigward ta’ ċerti pjanti għat-tħawwil ta’ Alnus cordata,
    ta’ Alnus glutinosa u ta’ Alnus incana li joriġinaw mir-Renju Unit
  type: main
