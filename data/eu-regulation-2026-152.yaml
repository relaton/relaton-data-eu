    Savienības teritorijā, groza Īstenošanas regulu (ES) 2020/1213 un attiecībā
    uz noteiktiem Alnus cordata, Alnus glutinosa un Alnus incana stādāmiem augiem,
    kuru izcelsme ir Apvienotajā Karalistē, labo Īstenošanas regulu (ES) 2020/1213
  type: main
