    thunbergii augalų iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2018/2019,
    dėl fitosanitarinių priemonių, taikomų tiems į Sąjungos teritoriją įvežamiems
    sodinti skirtiems augalams, iš dalies keičiamas Įgyvendinimo reglamentas (ES)
    2020/1213 ir dėl tam tikrų Jungtinės Karalystės kilmės sodinti skirtų Alnus
