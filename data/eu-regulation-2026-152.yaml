  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2026/152, 22. jaanuar 2026, millega muudetakse
    rakendusmäärust (EL) 2018/2019 teatavate Ühendkuningriigist pärit, liiki Berberis
    thunbergii kuuluvate istutamiseks ettenähtud taimede osas ning rakendusmäärust
    (EL) 2020/1213 kõnealuste istutamiseks ettenähtud taimede liidu territooriumile
    sissetoomisel kehtivate fütosanitaarmeetmete osas ning parandatakse rakendusmäärust
    (EL) 2020/1213 teatavate Ühendkuningriigist pärit, liikidesse Alnus cordata,
    Alnus glutinosa ja Alnus incana kuuluvate istutamiseks ettenähtud taimede osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2026/152, annettu 22 päivänä
    tammikuuta 2026, täytäntöönpanoasetuksen (EU) 2018/2019 muuttamisesta tiettyjen
    Yhdistyneestä kuningaskunnasta peräisin olevien Berberis thunbergii -lajin istutettaviksi
    tarkoitettujen kasvien osalta ja täytäntöönpanoasetuksen (EU) 2020/1213 muuttamisesta
    siltä osin kuin on kyse kyseisten istutettaviksi tarkoitettujen kasvien tuomista
    unionin alueelle koskevista kasvinsuojelutoimenpiteistä sekä täytäntöönpanoasetuksen
    (EU) 2020/1213 oikaisemisesta tiettyjen Yhdistyneestä kuningaskunnasta peräisin
    olevien Alnus cordata-, Alnus glutinosa- ja Alnus incana -lajien istutettaviksi
    tarkoitettujen kasvien osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2026/152 ón gCoimisiún an 22 Eanáir
    2026 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid a bhaineann
    le plandaí áirithe Berberis thunbergii le haghaidh plandú de thionscnamh na
    Ríochta Aontaithe, agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1213
    a mhéid a bhaineann leis na bearta fíteashláintíochta chun na plandaí sin
    le haghaidh plandú a thabhairt isteach i gcríoch an Aontais agus lena gceartaítear
    Rialachán Cur Chun Feidhme (AE) 2020/1213 a mhéid a bhaineann le plandaí áirithe
    Alnus cordata, Alnus glutinosa agus Alnus incana le haghaidh plandú de thionscnamh
    na Ríochta Aontaithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2026/152 оd 22. siječnja 2026. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrste Berberis
    thunbergii podrijetlom iz Ujedinjene Kraljevine te o izmjeni Provedbene uredbe
    (EU) 2020/1213 u pogledu fitosanitarnih mjera za unos tog bilja za sadnju na područje
    Unije i o ispravku Provedbene uredbe (EU) 2020/1213 u pogledu određenog bilja
    za sadnju vrsta Alnus cordata, Alnus glutinosa i Alnus incana podrijetlom iz Ujedinjene
    Kraljevine
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/152 végrehajtási rendelete (2026. január 22.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Berberis thunbergii egyes, az Egyesült
    Királyságból származó, ültetésre szánt növényei tekintetében történő
    módosításáról, az (EU) 2020/1213 végrehajtási rendeletnek az említett,
    ültetésre szánt növényeknek az Unió területére történő behozatalára
    vonatkozó növényegészségügyi intézkedések tekintetében történő módosításáról,
    valamint az (EU) 2020/1213 végrehajtási rendeletnek az Alnus cordata, az Alnus
    glutinosa és az Alnus incana egyes, az Egyesült Királyságból származó,
    ültetésre szánt növényei tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2026/152 della Commissione, del 22 gennaio
    2026, che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Berberis thunbergii originarie del Regno Unito e
    il regolamento di esecuzione (UE) 2020/1213 per quanto riguarda le misure fitosanitarie
    per l’introduzione di tali piante da impianto nel territorio dell’Unione e
    che rettifica il regolamento di esecuzione (UE) 2020/1213 per quanto riguarda
    alcune piante da impianto di Alnus cordata, Alnus glutinosa e Alnus incana originarie
    del Regno Unito
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2026/152 (2026. gada 22. janvāris),
