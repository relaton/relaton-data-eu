    ulegeret stål med oprindelse i Kroatien og Ukraine og om endelig opkrævning
    af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 348/2000 του Συμβουλίου,
    της 14ης Φεβρουαρίου 2000, για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    σωλήνων κάθε είδους χωρίς συγκόλληση από σίδηρο
    ή μη κραματοποιημένο χάλυβα καταγωγής Κροατίας
