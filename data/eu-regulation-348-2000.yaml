title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 348/2000 of 14 February 2000 imposing a definitive
    anti-dumping duty on imports of certain seamless pipes and tubes of iron or non-alloy
    steel originating in Croatia and Ukraine and collecting definitively the provisional
    duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 348/2000 du Conseil, du 14 février 2000, instituant
    un droit antidumping définitif sur les importations de certains tubes et tuyaux
    sans soudure, en fer ou en acier non allié, originaires de Croatie et d'Ukraine
    et portant perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
