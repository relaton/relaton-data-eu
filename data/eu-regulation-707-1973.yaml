  content: Regulation (EEC) No 707/73 of the Council of 12 March 1973 amending Council
    Regulation (EEC) No 1464/72 opening, allocating and providing for the administration
    of the Community tariff quota of 20 000 head of heifers and cows, other than those
    intended for slaughter, of certain mountain breeds falling within heading No ex
    01.02 A II b) 2 of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 707/73 du Conseil, du 12 mars 1973, modifiant le règlement
    (CEE) n° 1464/72 portant ouverture, répartition et mode de gestion du contigent
    tarifaire communautaire de 20 000 têtes de génisses et vaches, autres que celles
    destinées à la boucherie, de certaines races de montagne, de la sous-position
    ex 01.02 A II b) 2 du tarif douanier commun
  type: main
