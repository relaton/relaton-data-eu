    des Gemeinschaftszollkontingents für 20*000 Stück Färsen und Kühe bestimmter
    Höhenrassen, nicht zum Schlachten, der Tarifstelle ex 01.02 A II b) 2 des Gemeinsamen
    Zolltarifs
  type: main
- language: da
  script: Latn
