title:
- language: en
  script: Latn
  content: '79/237/EEC: Commission Decision of 8 February 1979 authorizing the Kingdom
    of Denmark to permit temporarily the marketing of cereal seed in packaging with
    traditional marking (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/237/CEE: Décision de la Commission, du 8 février 1979, autorisant
    le Royaume de Danemark à permettre temporairement la commercialisation de semences
    de céréales dans les emballages à marquage traditionnel (Le texte en langue
    danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/237/EWG: Entscheidung der Kommission vom 8. Februar 1979 zur Ermächtigung
    des Königreichs Dänemark, vorübergehend den Verkehr mit Getreidesaatgut in
    Packungen mit herkömmlicher Kennzeichnung zu gestatten (Nur der dänische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/237/EØF: Kommissionens beslutning af 8. februar 1979 om bemyndigelse
