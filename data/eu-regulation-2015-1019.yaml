  content: Commission Implementing Regulation (EU) 2015/1019 of 29 June 2015 amending
    Council Implementing Regulation (EU) No 1106/2013 imposing a definitive anti-dumping
    duty and collecting definitively the provisional duty imposed on imports of certain
