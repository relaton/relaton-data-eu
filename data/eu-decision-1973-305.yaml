title:
- language: en
  script: Latn
  content: '73/305/EEC: Commission Decision of 24 September 1973 authorizing the French
    Republic not to apply in Corsica the premium system for the conversion of dairy
    herds to meat production and to grant in this region the development premium for
    the specialized raising of cattle for meat production'
  type: main
- language: fr
  script: Latn
  content: '73/305/CEE: Décision de la Commission, du 24 septembre 1973, autorisant
    la République française à ne pas mettre en application en Corse le régime
    de prime à la reconversion, vers la production de viande, de troupeaux bovins
    à orientation laitière et à octroyer, dans cette région, la prime de développement
    de l'' élevage bovin spécialisé vers la production de viande'
  type: main
- language: de
  script: Latn
  content: '73/305/EWG: Entscheidung der Kommission vom 24. September 1973 zur Ermächtigung
    der Französischen Republik, die Prämienregelung für die Umstellung von Milchkuhbeständen
    auf Bestände zur Fleischerzeugung in Korsika nicht anzuwenden und Prämien zur
    Förderung der speziell auf die Fleischerzeugung ausgerichteten Rinderaufzucht
    in diesem Gebiet zu gewähren'
  type: main
- language: da
  script: Latn
  content: '73/305/EØF: Kommissionens Beslutning af 24. september 1973 om bemyndigelse
    for Den franske Republik til ikke at iværksætte præmieordningen for omlægning
    af besætninger af malkekvæg til kødproduktion på Korsika og til i dette område
    at yde præmie for udvikling af opdræt af kvæg specielt til kødproduktion'
  type: main
- language: it
  script: Latn
  content: '73/305/CEE: Decisione della Commissione del 24 settembre 1973, che autorizza
    la Repubblica francese a non applicare in Corsica il regime di premio per la riconversione
    di mandrie bovine ad orientamento lattiero verso la produzione di carne e a concedere
    in tale regione il premio allo sviluppo dell'' allevamento bovino specializzato
    nella produzione di carne'
  type: main
- language: nl
  script: Latn
  content: '73/305/EEG: Beschikking van de Commissie van 24 september 1973 waarbij
    de Republiek Frankrijk gemachtigd wordt om in Corsica het stelsel van premies
    voor de omschakeling van de melkveestapel op de rundvleesproduktie niet toe te
    passen en in dit gebied de premie voor de ontwikkeling van de teelt van rundvee
    bestemd voor de vleesproduktie toe te kennen'
  type: main
