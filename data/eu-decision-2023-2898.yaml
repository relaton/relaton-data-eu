    magyarázatok, besorolási vélemények vagy egyéb tanácsok, valamint a Harmonizált
    Rendszernek a Harmonizált Áruleíró és Kódrendszerről szóló nemzetközi
    egyezmény szerinti egységes értelmezését és alkalmazását biztosító ajánlások
