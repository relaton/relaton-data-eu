title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/2898 of 19 December 2023 on the position to
    be taken on behalf of the European Union within the World Customs Organization
    (WCO) with regard to the adoption of Explanatory Notes, Classification Opinions
    or other advice on the interpretation of the Harmonized System and recommendations
    to secure uniformity in the interpretation of the Harmonized System under the
    HS Convention
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2898 du Conseil du 19 décembre 2023 relative à la
    position à prendre au nom de l’Union européenne au sein de l’Organisation
    mondiale des douanes (OMD) en ce qui concerne l’adoption des notes explicatives,
    des avis de classement ou d’autres avis se rapportant à l’interprétation
    du système harmonisé ainsi que des recommandations visant à assurer l’interprétation
    uniforme du système harmonisé dans le cadre de la convention sur le SH
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/2898 des Rates vom 19. Dezember 2023 über den Standpunkt,
    der im Namen der Europäischen Union in der Weltzollorganisation (WZO) im Hinblick
    auf die Annahme von Erläuterungen, Einreihungsavisen oder anderen Stellungnahmen
    zur Auslegung des Harmonisierten Systems und Empfehlungen zur Gewährleistung
    einer einheitlichen Auslegung des Harmonisierten Systems im Rahmen des HS-Übereinkommens
    zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/2898 на Съвета от 19 декември
