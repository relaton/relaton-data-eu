    се заеме от името на Европейския съюз в рамките
    на Световната митническа организация (СМО)
    във връзка с приемането на обяснителни бележки,
    мнения за класиране или други мнения за тълкуването
    на Хармонизираната система и препоръки за
    осигуряване на унифицирано тълкуване на Хармонизираната
    система съгласно Конвенцията за ХС
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/2898 ze dne 19. prosince 2023 o postoji, který
    má být zaujat jménem Evropské unie v rámci Světové celní organizace (WCO),
    pokud jde o přijímání vysvětlivek, stanovisek k zařazení zboží nebo ostatních
    pokynů pro výklad harmonizovaného systému a doporučení potřebných k zajištění
    jednotného výkladu harmonizovaného systému podle úmluvy o HS
  type: main
