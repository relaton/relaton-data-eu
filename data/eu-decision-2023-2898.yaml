    attiecībā uz skaidrojumu, klasifikācijas viedokļu vai citu padomu pieņemšanu
    par harmonizētās sistēmas interpretāciju un attiecībā uz ieteikumu pieņemšanu
    par vienveidības nodrošināšanu harmonizētās sistēmas interpretācijā saskaņā
