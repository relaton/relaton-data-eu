    u pogledu donošenja objašnjenja, mišljenja o razvrstavanju ili drugih savjeta
    o tumačenju Harmoniziranog sustava i preporuka za osiguravanje ujednačenosti
    u tumačenju Harmoniziranog sustava na temelju Konvencije o HS-u
  type: main
