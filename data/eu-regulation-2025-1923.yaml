    ide o zápisy týkajúce sa Brazílie v zoznamoch tretích krajín, území alebo
    ich pásiem, z ktorých sa povoľuje vstup zásielok hydiny, zárodočných produktov
    hydiny a čerstvého mäsa z hydiny a pernatej zveri do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1923 z dne 19. septembra 2025 o spremembi
    prilog V in XIV k Izvedbeni uredbi (EU) 2021/404 glede vnosov za Brazilijo na
    seznamih tretjih držav, njihovih ozemelj ali območij, s katerih je dovoljen
    vstop pošiljk perutnine, zarodnega materiala perutnine ter svežega mesa perutnine
    in pernate divjadi v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1923 de la Comisión, de 19 de septiembre
    de 2025, por el que se modifican los anexos V y XIV del Reglamento de Ejecución
    (UE) 2021/404 en lo que concierne a las entradas correspondientes a Brasil en
    las listas de terceros países, territorios o zonas de estos, desde los que se
    permite la entrada en la Unión de partidas de aves de corral, productos reproductivos
    de aves de corral y carne fresca de aves de corral y de aves de caza
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1923 av den 19 september
