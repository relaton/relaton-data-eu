  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1923 della Commissione, del 19 settembre
    2025, che modifica gli allegati V e XIV del regolamento di esecuzione (UE) 2021/404
    per quanto riguarda le voci relative al Brasile negli elenchi di paesi terzi,
    territori o loro zone da cui è autorizzato l’ingresso nell’Unione di partite
    di pollame e materiale germinale di pollame e di carni fresche di pollame e selvaggina
    da penna
  type: main
- language: lv
  script: Latn
