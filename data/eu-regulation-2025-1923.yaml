    és baromfi-szaporítóanyagokat, valamint baromfi és szárnyas vadak friss húsát
    tartalmazó szállítmányok Unióba történő beléptetésére engedéllyel
    rendelkező harmadik országok, területek vagy azok körzetei jegyzékeiben a
