    w odniesieniu do pozycji dotyczących Brazylii w wykazach państw trzecich, terytoriów
    lub ich stref, z których dozwolone jest wprowadzanie do Unii przesyłek drobiu
    i materiału biologicznego drobiu oraz świeżego mięsa drobiu i ptaków łownych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1923 da Comissão, de 19 de setembro
