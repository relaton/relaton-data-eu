    jų zonų, iš kurių į Sąjungą leidžiama įvežti naminių paukščių, naminių
    paukščių genetinės medžiagos produktų ir šviežios naminių paukščių
    ir medžiojamųjų paukščių mėsos siuntas, sąrašuose iš dalies keičiami
