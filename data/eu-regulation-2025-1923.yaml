    no que diz respeito às entradas relativas ao Brasil nas listas de países terceiros,
    territórios ou respetivas zonas autorizados para a entrada na União de remessas
    de aves de capoeira e produtos germinais de aves de capoeira, e de carne fresca
    de aves de capoeira e aves de caça
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1923 al Comisiei din 19 septembrie
    2025 de modificare a anexelor V și XIV la Regulamentul de punere în aplicare
    (UE) 2021/404 în ceea ce privește rubricile referitoare la Brazilia din listele
    conținând țările terțe, teritoriile sau zonele acestora care sunt autorizate
    pentru introducerea în Uniune a transporturilor de păsări de curte, de materiale
    germinative provenite de la păsări de curte și de carne proaspătă provenită
    de la păsări de curte și de la vânat cu pene
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1923 z 19. septembra 2025, ktorým
