title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1923 of 19 September 2025
    amending Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards
    the entries for Brazil in the lists of third countries, territories or zones thereof
    authorised for the entry into the Union of consignments of poultry and germinal
    products of poultry and of fresh meat of poultry and game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1923 de la Commission du 19 septembre
    2025 modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives au Brésil dans les listes de pays tiers,
    de territoires ou de zones de pays tiers en provenance desquels l’entrée dans
    l’Union d’envois de volailles et de produits germinaux de volailles ainsi
    que de viandes fraîches de volailles et de gibier à plumes est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1923 der Kommission vom 19. September
    2025 zur Änderung der Anhänge V und XIV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Einträge für Brasilien in den Listen der Drittländer, Gebiete
    oder Zonen derselben, aus denen der Eingang von Sendungen von Geflügel und Zuchtmaterial
    von Geflügel sowie frischem Fleisch von Geflügel und Wildgeflügel in die Union
    zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1923 на Комисията
    от 19 септември 2025 година за изменение на приложения
    V и XIV към Регламент за изпълнение (ЕС) 2021/404 по
    отношение на вписванията за Бразилия в списъците
    на трети държави, територии или зони от тях,
    от които е разрешено въвеждането в Съюза на
    пратки с домашни птици, зародишни продукти
    от домашни птици и прясно месо от домашни птици
    и пернат дивеч
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1923 ze dne 19. září 2025,
    kterým se mění přílohy V a XIV prováděcího nařízení (EU) 2021/404,
    pokud jde o položky pro Brazílii v seznamech třetích zemí, území nebo jejich
    oblastí, z nichž je povolen vstup zásilek drůbeže a zárodečných produktů
    drůbeže a čerstvého masa drůbeže a pernaté zvěře do Unie
  type: main
