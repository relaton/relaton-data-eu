  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/1923 оd 19. rujna 2025. o izmjeni
    priloga V. i XIV. Provedbenoj uredbi (EU) 2021/404 u pogledu unosa za Brazil na
    popisima trećih zemalja, područja ili njihovih zona iz kojih je odobren ulazak
    u Uniju pošiljaka peradi, zametnih proizvoda peradi te svježeg mesa peradi i
    pernate divljači
  type: main
- language: hu
  script: Latn
