    celní prohlášení
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/398 af 14. december 2022
    om ændring af delegeret forordning (EU) 2015/2446 for så vidt angår udvidelse
    af mulighederne for at indgive toldangivelser mundtligt eller ved enhver anden
    handling, der anses for at være en toldangivelse, ugyldighedserklæring af angivelser
    i særlige tilfælde og præcisering af udvekslingen af oplysninger for summariske
    indpassageangivelser
  type: main
- language: el
  script: Grek
