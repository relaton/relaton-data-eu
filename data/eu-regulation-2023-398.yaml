    tulli-ilmoituksen antamista suullisesti tai muulla tulli-ilmoituksena pidettävällä
    toimella koskevan mahdollisuuden laajentamisesta, ilmoitusten mitätöimisestä
    erityistapauksissa ja saapumisen yleisilmoituksia koskevan tietojenvaihdon erittelemisestä
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/398 ón gCoimisiún an 14 Nollaig 2022
    lena leasaítear Rialachán Tarmligthe (AE) 2015/2446 a mhéid a bhaineann leis
    na féidearthachtaí chun dearbhuithe custaim a dhéanamh ó bhéal nó trí aon
    ghníomh eile a mheastar a bheith ina dhearbhú custaim, le dearbhuithe a chur
    ó bhail i gcásanna sonracha agus le faisnéis a mhalartú maidir le dearbhuithe
    iontrála achomair
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/398 оd 14. prosinca 2022. o izmjeni
    Delegirane uredbe (EU) 2015/2446 u pogledu proširenja mogućnosti za podnošenje
    carinskih deklaracija usmeno ili bilo kojom drugom radnjom koja se smatra carinskom
    deklaracijom, poništenja deklaracija u posebnim slučajevima i utvrđivanja razmjene
    informacija za ulazne skraćene deklaracije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/398 felhatalmazáson alapuló rendelete (2022. december
    14.) az (EU) 2015/2446 felhatalmazáson alapuló rendeletnek a vám-árunyilatkozatok
    szóban vagy bármely más, vám-árunyilatkozatnak minősülő cselekmény útján
    történő megtételére vonatkozó lehetőségek körének kiszélesítése,
    a nyilatkozatok meghatározott esetekben történő érvénytelenítése, valamint
    a belépési gyűjtő árunyilatkozatokkal kapcsolatos információcsere meghatározása
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/398 della Commissione del 14 dicembre 2022
    che modifica il regolamento delegato (UE) 2015/2446 per quanto riguarda l’estensione
    delle possibilità di presentare dichiarazioni doganali verbalmente o con altro
    atto assimilato a una dichiarazione doganale nonché l’invalidamento delle dichiarazioni
    in casi specifici, e stabilisce le modalità dello scambio di informazioni per
    le dichiarazioni sommarie di entrata
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/398 (2022. gada 14. decembris),
    ar ko groza Deleģēto regulu (ES) 2015/2446 attiecībā uz to, lai paplašinātu
    iespējas sniegt muitas deklarācijas mutiski vai ar jebkuru citu aktu, ko uzskata
    par muitas deklarāciju, attiecībā uz deklarāciju atzīšanu par nederīgām
    īpašos gadījumos un informācijas apmaiņas precizēšanu ievešanas kopsavilkuma
    deklarācijās
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/398 2022 m. gruodžio 14 d.
    kuriuo dėl galimybių pateikti muitinės deklaracijas žodžiu arba bet kuriuo
    kitu muitinės deklaracija laikomu veiksmu išplėtimo, dėl deklaracijų pripažinimo
    negaliojančiomis tam tikrais atvejais ir dėl informacijos, nurodytinos įvežimo
    bendrosiose deklaracijose, mainų patikslinimo iš dalies keičiamas Deleguotasis
    reglamentas (ES) 2015/2446
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/398 tal-14 ta’ Diċembru
    2022 li jemenda r-Regolament Delegat (UE) 2015/2446 fir-rigward tal-estensjoni
    tal-possibbiltajiet biex id-dikjarazzjonijiet doganali bil-fomm jew permezz ta’
    xi att ieħor jitqiesu bħala dikjarazzjoni doganali, tal-invalidazzjoni tad-dikjarazzjonijiet
    f’każijiet speċifiċi, u tal-ispeċifikazzjoni tal-iskambju tal-informazzjoni
    għad-dikjarazzjonijiet fil-qosor tad-dħul
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/398 van de Commissie van 14 december
    2022 tot wijziging van Gedelegeerde Verordening (EU) 2015/2446 wat betreft de
    uitbreiding van de mogelijkheden om douaneaangiften mondeling of door een andere
    handeling die als douaneaangifte wordt beschouwd, te doen, de ongeldigmaking van
    aangiften in specifieke gevallen, en de specificatie van de uitwisseling van inlichtingen
    voor summiere aangiften bij binnenbrengen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/398 z dnia 14 grudnia 2022
    r. zmieniające rozporządzenie delegowane (UE) 2015/2446 w odniesieniu do rozszerzenia
    możliwości dokonywania zgłoszeń celnych ustnie lub w drodze jakiejkolwiek
    innej czynności uznanej za zgłoszenie celne, unieważnienia zgłoszeń w szczególnych
    przypadkach oraz określenia wymiany informacji na potrzeby przywozowych deklaracji
    skróconych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/398 da Comissão de 14 de dezembro de 2022
    que altera o Regulamento Delegado (UE) 2015/2446 no que diz respeito ao alargamento
    das possibilidades de efetuar declarações aduaneiras verbalmente ou por qualquer
    outro ato considerado uma declaração aduaneira, bem como à anulação de declarações
    em casos específicos, e que estabelece as modalidades do intercâmbio de informações
    para as declarações sumárias de entrada
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/398 al Comisiei din 14 decembrie 2022 de
    modificare a Regulamentului delegat (UE) 2015/2446 în ceea ce privește extinderea
    posibilităților de efectuare a declarațiilor vamale verbal sau prin orice alt
    act considerat a fi o declarație vamală, invalidarea declarațiilor în cazuri
    specifice și stabilirea modalităților de efectuare a schimbului de informații
    pentru declarațiile sumare de intrare
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/398 zo 14. decembra 2022, ktorým
    sa mení delegované nariadenie (EÚ) 2015/2446, pokiaľ ide o rozšírenie možností
    podania colných vyhlásení ústne alebo akýmkoľvek iným úkonom považovaným
    za colné vyhlásenie, zrušenie platnosti vyhlásení v osobitných prípadoch
    a spresnenie výmeny informácií na účely predbežných colných vyhlásení
    o vstupe
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/398 z dne 14. decembra 2022 o spremembi
    Delegirane uredbe (EU) 2015/2446 glede razširitve možnosti za vložitev carinskih
    deklaracij ustno ali s katerim koli drugim dejanjem, ki se šteje za carinsko
    deklaracijo, razveljavitve deklaracij v posebnih primerih in določitve izmenjave
    informacij za vstopne skupne deklaracije
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/398 de la Comisión de 14 de diciembre de
    2022 por el que se modifica el Reglamento Delegado (UE) 2015/2446 en lo que respecta
    a la ampliación de las posibilidades de hacer declaraciones en aduana oralmente
    o por medio de cualquier otro acto que se considere una declaración en aduana,
    a la invalidación de declaraciones en casos específicos y a la especificación
    del intercambio de información para las declaraciones sumarias de entrada
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/398 av den 14 december 2022
    om ändring av delegerad förordning (EU) 2015/2446 vad gäller utökade möjligheter
    att upprätta tulldeklarationer muntligen eller genom någon annan handling som
    anses vara en tulldeklaration, ogiltigförklaring av deklarationer i särskilda
    fall och precisering av informationsutbytet för summariska införseldeklarationer
