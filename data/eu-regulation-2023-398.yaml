  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/398, 14. detsember 2022, millega
    muudetakse delegeeritud määrust (EL) 2015/2446 osas, mis puudutab tollideklaratsioonide
    suuliselt või mis tahes muu, tollideklaratsioonina käsitatava toimingu abil
