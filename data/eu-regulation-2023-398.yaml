title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/398 of 14 December 2022 amending
    Delegated Regulation (EU) 2015/2446 as regards extending the possibilities for
    making customs declarations orally or by any other act deemed to be a customs
    declaration, the invalidation of declarations in specific cases, and specifying
    the exchange of information for entry summary declarations
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/398 de la Commission du 14 décembre 2022
    modifiant le règlement délégué (UE) 2015/2446 en ce qui concerne l’extension
    des possibilités d’effectuer des déclarations en douane verbalement ou par
    tout autre acte considéré comme une déclaration en douane ainsi que l’invalidation
    des déclarations dans des cas spécifiques, et établissant les modalités de
    l’échange d’informations relatives aux déclarations sommaires d’entrée
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/398 der Kommission vom 14. Dezember 2022
    zur Änderung der Delegierten Verordnung (EU) 2015/2446 in Bezug auf die Ausweitung
    der Möglichkeiten zur mündlichen Abgabe von Zollanmeldungen oder mittels einer
    anderen als Zollanmeldung geltende Handlung, die Ungültigerklärung von Anmeldungen
    in bestimmten Fällen und die Präzisierung des Informationsaustauschs für summarische
    Eingangsanmeldungen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/398 на Комисията
    от 14 декември 2022 година за изменение на Делегиран
    регламент (ЕС) 2015/2446 по отношение на разширяването
    на възможностите за извършване на митническо
    деклариране в устна форма или чрез друго действие,
    считано за митническо деклариране, по отношение
    на анулирането на декларации в конкретни случаи
    и определянето на обмена на информация за обобщените
    декларации за въвеждане
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/398 ze dne 14. prosince
    2022, kterým se mění nařízení v přenesené pravomoci (EU) 2015/2446, pokud
    jde o rozšíření možností činit celní prohlášení ústně nebo jakýmkoli
    jiným úkonem považovaným za celní prohlášení, zrušení platnosti prohlášení
