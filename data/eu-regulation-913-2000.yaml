    suspendoimisesta ja yhteisen tullitariffin tullin uudelleen käyttöön ottamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 913/2000 della Commissione, del 2 maggio 2000, che
    sospende il dazio doganale preferenziale e ripristina il dazio della tariffa doganale
    comune all'importazione di garofani a fiore singolo (standard) originari del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 913/2000 van de Commissie van 2 mei 2000 tot schorsing
