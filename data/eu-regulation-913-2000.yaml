    zu erhebenden Präferenzzolls und zur Wiedereinführung des Zolls des Gemeinsamen
    Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 913/2000 af 2. maj 2000 om suspension
    af præferencetolden og genindførelse af tolden ifølge den fælles toldtarif
    ved indførsel af enkeltblomstrede nelliker (standard) med oprindelse i Marokko
  type: main
- language: el
  script: Grek
