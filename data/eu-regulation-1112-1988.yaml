title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1112/88 of 25 April 1988 amending Regulation
    (EEC) No 777/87 as regards the period of application of the intervention measures
    for butter and skimmed-milk powder
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1112/88 du Conseil du 25 avril 1988 modifiant le règlement
    (CEE) n° 777/87 en ce qui concerne la période d'application des mesures relatives
    aux achats à l'intervention pour le beurre et le lait écrémé en poudre
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1112/88 DES RATES vom 25. April 1988 zur Änderung
    der Verordnung (EWG) Nr. 777/87 hinsichtlich der Anwendungsdauer der den Ankauf
    von Butter und Magermilchpulver betreffenden Interventionsmaßnahmen#
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1112/88 af 25. april 1988 om ændring af
    forordning (EØF) nr. 777/87 for så vidt angår anvendelsesperioden for foranstaltningerne
    vedrørende interventionsopkøb af smør og skummetmælkspulver
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1112/88 του Συμβουλίου
    της 25ης Απριλίου 1988 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 777/87 όσον αφορά την περίοδο εφαρμογής
    των μέτρων σχετικά με τις αγορές στην παρέμβαση
    για το βούτυρο και το αποκορυφωμένο γάλα σε
    σκόνη
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1112/88 DEL CONSIGLIO del 25 aprile 1988 che modifica
    il regolamento (CEE) n. 777/87 per quanto concerne il periodo di applicazione
    delle misure relative agli acquisti all' intervento per il burro ed il latte scremato
    in polvere#
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1112/88 VAN DE RAAD van 25 april 1988 tot wijziging
    van Verordening (EEG) nr. 777/87 voor wat betreft de periode van toepassing van
    de maatregelen inzake de interventieaankopen voor boter en magere-melkpoeder#
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1112/88 do Conselho de 25 de Abril de 1988 que altera
    o Regulamento (CEE) n.° 777/87, no que diz respeito ao período de aplicação
    das medidas relativas às compras à intervenção para a manteiga e o leite em
    pó desnatado
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 1112/88 DEL CONSEJO de 25 de abril de 1988 por el
    que se modifica el Reglamento (CEE) nº 777/87 en lo que se refiere al período
    de aplicación de las medidas relativas a las compras de intervención para la
    mantequilla y la leche desnatada en polvo#
  type: main
