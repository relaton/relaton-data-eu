id: EUDecision1977542
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 June 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to knitted or crocheted jerseys, pullovers, slipovers, twinsets,
    cardigans, bed-jackets and jumpers falling within heading No ex 60.05 of the Common
    Customs Tariff, originating in Macao and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '77/542/CEE: Décision de la Commission, du 16 juin 1977, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chandails, "pull-overs", "slip-overs",
    "twinsets", gilets, vestes et blouses, de bonneterie, de la position Ex 60.05
    du Tarif douanier commun, originaires de Macao et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. Juni 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Macau stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Pullover, Slipover, Twinsets, Westen und Blusen aus Wirkwaren der
    Tarifnummer ex 60.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 16. juni 1977 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage sweatere, pullovere, slipovere, cardigans, cardigansæt, jumpere, trøjer,
    veste og bluser af trikotage, som henhører under pos. ex 60.05 i den fælles
    toldtarif, har oprindelse i Macao og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 giugno 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario maglie, pullovers, slip-overs, twinsets, giubbotti,
    giacche e bluse a maglia della voce ex 60.05 della tariffa doganale comune, originari
    di Macao e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 juni 1977 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    truien, pullovers, slipovers, jumpers, twinsets, vesten, jasjes en blouses van
    brei- of haakwerk, van post ex 60.05 van het gemeenschappelijk douanetarief, van
    oorsprong uit Macao en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
