title:
- language: en
  script: Latn
  content: '2004/359/EC: Commission Decision of 13 April 2004 amending Decision 97/296/EC
    drawing up the list of third countries from which the import of fishery products
    is authorised for human consumption, with respect to Romania and Zimbabwe (Text
    with EEA relevance) (notified under document number C(2004) 1304)'
  type: main
- language: fr
  script: Latn
  content: '2004/359/CE: Décision de la Commission du 13 avril 2004 modifiant la
    décision 97/296/CE établissant la liste des pays tiers en provenance desquels
    l''importation des produits de la pêche est autorisée pour l''alimentation humaine,
    en ce qui concerne la Roumanie et le Zimbabwe (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2004) 1304]'
  type: main
- language: de
  script: Latn
