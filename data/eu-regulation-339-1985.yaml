title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 339/85 of 7 February 1985 re-establishing
    the levying of customs duties on sodium dichromate, falling within subheading
    28.47 B ex II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 339/85 de la Commission du 7 février 1985 portant
    rétablissement de la perception des droits de douane applicables au dichromate
    de sodium, de la sous-position 28.47 B ex II du tarif douanier commun, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 339/85 der Kommission vom 7. Februar 1985 zur Wiedereinführung
    der Erhebung der Zölle für Natriumdichromat der Tarifstelle 28.47 B ex II mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 339/85 af 7. februar 1985 om genindførelse
