  script: Latn
  content: '2013/217/EU: Commission Implementing Decision of 8 May 2013 amending Decision
    2007/777/EC as regards the entry for Mexico in the list of third countries or
    parts thereof from which the introduction of meat products and treated stomachs,
    bladders and intestines into the Union is authorised (notified under document
    C(2013) 2589)'
  type: main
- language: fr
  script: Latn
