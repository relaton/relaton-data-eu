    tam tikrai importuojamai Kinijos Liaudies Respublikos kilmės avalynei batviršiais
    iš odos, vengimo importuojant tam tikrą avalynę batviršiais iš odos iš SAR
    Makao, neatsižvelgiant į tai, ar SAR Makao deklaruojama kilmės šalimi, ar
    ne, tyrimą ir nustatantis reikalavimą registruoti tokį importą
