title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1028/2007 of 5 September 2007 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 1472/2006 on imports of certain footwear
    with uppers of leather originating in the People's Republic of China by imports
    of certain footwear with uppers of leather consigned from Macao SAR, whether declared
    as originating in Macao SAR or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1028/2007 de la Commission du 5 septembre 2007 portant
    ouverture d'une enquête sur le contournement éventuel des mesures antidumping
    instituées par le règlement (CE) n° 1472/2006 du Conseil sur les importations
    de certaines chaussures à dessus en cuir originaires de la République populaire
    de Chine par des importations de certaines chaussures à dessus en cuir expédiées
    de la RAS de Macao, qu'elles aient ou non été déclarées originaires de la
    RAS de Macao, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
