  script: Latn
  content: Regolamento (CE) n. 1028/2007 della Commissione, del 5 settembre 2007 ,
    che apre un’inchiesta sulla possibile elusione delle misure antidumping istituite
    dal regolamento (CE) n. 1472/2006 del Consiglio sulle importazioni di alcuni tipi
    di calzature con tomaie di cuoio originarie della Repubblica popolare cinese mediante
