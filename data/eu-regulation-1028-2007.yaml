    Padomes Regulu (EK) Nr. 1472/2006 piemēroti dažiem tādu konkrētu Ķīnas Tautas
    Republikas izcelsmes apavu ievedumiem, kuriem ir ādas virsa, kas nosūtīti no
    Makao īpašās pārvaldes apgabala un deklarēti vai nedeklarēti kā Makao īpašās
    pārvaldes apgabala izcelsmes ražojumi, un ar ko uz šādiem ievedumiem attiecina
    reģistrāciju
  type: main
