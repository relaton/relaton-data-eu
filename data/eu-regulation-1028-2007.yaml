    di Macao, indipendentemente dal fatto che siano dichiarate o meno originarie di
    tale paese, e che dispone la registrazione di dette importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1028/2007 ( 2007. gada 5. septembris ), ar ko
