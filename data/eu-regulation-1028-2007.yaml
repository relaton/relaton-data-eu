    den Einfuhren bestimmter Schuhe mit Oberteil aus Leder mit Ursprung in der Volksrepublik
    China durch die Einfuhren bestimmter aus der Sonderverwaltungsregion Macau versandter
    Schuhe mit Oberteil aus Leder, ob als Ursprungserzeugnisse der Sonderverwaltungsregion
    Macau angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
