  content: Komission asetus (EY) N:o 1028/2007, annettu 5 päivänä syyskuuta 2007
    , tiettyjen Kiinan kansantasavallasta peräisin olevien sellaisten jalkineiden
    tuonnissa, joiden päälliset ovat nahkaa, neuvoston asetuksella (EY) N:o 1472/2006
    käyttöön otettujen polkumyynnin vastaisten toimenpiteiden mahdollista kiertämistä
    tiettyjen sellaisten jalkineiden tuonnilla Macaon erityishallintoalueelta, joiden
    päälliset ovat nahkaa, riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu
    Macaon erityishallintoalue, koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin
    kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1028/2007/EK rendelete ( 2007. szeptember 5. ) az 1472/2006/EK
    tanácsi rendelettel a Kínai Népköztársaságból származó, egyes bőr felsőrésszel
    rendelkező lábbelik behozatalára vonatkozóan bevezetett dömpingellenes intézkedéseknek
    a Makaó Különleges Közigazgatási Területről feladott, – akár Makaó
    Különleges Közigazgatási Területről származóként, akár nem ilyenként
    megjelölt – egyes bőr felsőrésszel rendelkező lábbelik behozatala általi
    lehetséges kijátszásával kapcsolatos vizsgálat kezdeményezéséről, valamint
    e behozatalok nyilvántartásbavételi kötelezettségének előírásáról
  type: main
