  content: '90/47/EEC: Commission Decision of 1 February 1990 terminating the proceeding
    under Article 13 (10) of Regulation (EEC) No 2423/88 concerning plain paper photocopiers
    assembled or produced in the Community by Ricoh Industrie France SA'
  type: main
- language: fr
  script: Latn
  content: '90/47/CEE: Décision de la Commission du 1er février 1990 portant clôture
    de la procédure concernant les photocopieurs à papier ordinaire assemblés ou
    fabriqués dans la Communauté par Ricoh Industrie France SA, au titre de l''article
    13 paragraphe 10 du règlement (CEE) n 2423/88'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 1. Februar 1990 ueber die Einstellung des
