title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 168/2000 of 25 January 2000 amending Regulation
    (EC) No 1758/98 increasing to 3 450 000 tonnes the quantity of wheat of breadmaking
    quality held by the French intervention agency for which a standing invitation
    to tender for export has been opened
  type: main
- language: fr
  script: Latn
