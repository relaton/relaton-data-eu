    von im Besitz der französischen Interventionsstelle befindlichem Brotweichweizen
    auf 3 450 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 168/2000 af 25. januar 2000 om ændring
    af forordning (EF) nr. 1758/98 og om forhøjelse til 3 450 000 tons af den løbende
