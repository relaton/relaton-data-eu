title:
- language: en
  script: Latn
  content: '82/144/EEC: Commission Decision of 5 February 1982 establishing that the
    equipment described as ''Matec- pulse modulator and receiver, model 6600; - R.
    F. plug- in, model 765 V, model 760 VRF, model 770; - automatic attenuation recorder,
    model 2470 A; - decade dividers and dual delay generator, model 122 B; - high
    resolution frequency source, model 110'' may be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/144/CEE: Décision de la Commission, du 5 février 1982, constatant
    que l''importation de l''équipement dénommé "Matec - Pulse Modulator and Receiver,
    model 6600; - R.F. Plug-in, model 765 V, model 760 VRF, model 770; - Automatic
    Attenuation Recorder, model 2470 A; - Decade Dividers and Dual Delay Generator,
    model 122 B; - High Resolution Frequency Source, model 110" peut être faite en
    franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/144/EWG: Entscheidung der Kommission vom 5. Februar 1982, mit der festgestellt
    wird, daß die Anlage ,,MATEC- Pulse Modulator and Receiver, model 6600; - R.F.
    Plug- in, model 765 V, model 760 VRF, model 770; - Automatic Attenuation Recorder,
    model 2470 A; - Decade Dividers and Dual Delay Generator, model 122 B; - High
    Resolution Frequency Source, model 110" unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/144/EØF: Kommissionens beslutning af 5. februar 1982 om fastslåelse
    af, at indførsel af udstyret "MATEC-Pulse Modulator and Receiver, model 6600;
    - R.F. Plug-in, model 765 V, model 760 VRF, model 770; - Automatic Attenuation
    Recorder, model 2470 A; - Decade Dividers and Dual Delay Generator, model 122
    B; - High Resolution Frequency Source, model 110" kan ske med fritagelse for told
    efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/144/EOK: Απόφαση τής Επιτροπής τής 5ης Φεβρουαρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Matec-pulse modulator and receiver, model 6600.
    R. F. plug-in, model 765 V, model 760 VRF, model 770. automatic attenuation recorder,
    model 2470 A. decade dividers and dual delay generator, model 122 B. high resolution
    frequency source, model 110» δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/144/CEE: Decisione della Commissione, del 5 febbraio 1982, che stabilisce
    che l''importazione dell''equipaggiamento denominato "Matec - pulse modulator
    and receiver, model 6600; R.F. plug-in, model 765 V, model 760 VRF, model 770;
    automatic attenuation recorder, model 2470 A; decade dividers and dual delay generator,
    model 122 B; high resolution frequency source, model 110" può avvenire in franchigia
    dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/144/EEG: Beschikking van de Commissie van 5 februari 1982 waarbij wordt
    vastgesteld dat de uitrusting genaamd ,,MATEC-Pulse Modulator and Receiver, model
    6600; -R.F. Plug-in, model 765 V, model 760 VRF, model 770; - Automatic Attenuation
    Recorder, model 2470 A; -Decade Dividers and Dual Delay Generator, model 122 B;
    -High Resolution Frequency Source, model 110" met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
