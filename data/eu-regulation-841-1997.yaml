title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 841/97 of 7 May 1997 laying down rates of
    compensatory interest applicable during the second half of 1997 to customs debts
    incurred in relation to compensating products or goods in the unaltered state
    (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 841/97 de la Commission du 7 mai 1997 fixant les taux
    d'intérêts compensatoires applicables en cas de naissance d'une dette douanière
    relative aux produits compensateurs ou aux marchandises en l'état (régime du
    perfectionnement actif, système de la suspension et régime de l'admission temporaire)
    pendant le second semestre de 1997
  type: main
- language: de
  script: Latn
