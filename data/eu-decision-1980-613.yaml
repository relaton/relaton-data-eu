title:
- language: en
  script: Latn
  content: '80/613/EEC: Commission Decision of 6 June 1980 authorizing the French
    Republic not to apply Community treatment to woven fabrics of cotton, falling
    within heading No 55.09 of the Common Customs Tariff (category 2), originating
    in South Korea and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/613/CEE: Décision de la Commission, du 6 juin 1980, autorisant la
    République française à exclure du traitement communautaire les tissus de coton,
    de la position 55.09 du tarif douanier commun (catégorie 2), originaires de Corée
    du Sud et mis en libre pratique dans les autres Etats membres (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/613/EWG: Entscheidung der Kommission vom 6. Juni 1980, mit der die
    Französische Republik ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle der Tarifnummer
    55.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/613/EØF: Kommissionens beslutning af 6. juni 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbe1609handling at undtage vævede
    stoffer af bomuld, som henhører under pos. 55.09 i den fælles toldtarif, har
    oprindelse i Sydkorea og frit kan omsættes i de øvrige medlemsstater (Kun den
    franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/613/CEE: Decisione della Commissione, del 6 giugno 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di cotone,
    della voce 55.09 della tariffa doganale comune, categoria 2, originari della Corea
    del Sud e messi in libera pratica negli altri Stati membri (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/613/EEG: Beschikking van de Commissie van 6 juni 1980 waarbij de Franse
    Republiek wordt gemachtigd weefsels van katoen, van post 55.09 van het gemeenschappelijk
    douanetarief, categorie 2, van oorsprong uit Zuid-Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
