    perioada de aplicare și în ceea ce privește echivalența inspecțiilor în
    câmp efectuate în Bolivia asupra culturilor producătoare de semințe de cereale
    și asupra culturilor producătoare de semințe de plante oleaginoase și pentru
    fibre și echivalența semințelor de cereale și a semințelor de plante oleaginoase
    și pentru fibre produse în Bolivia
