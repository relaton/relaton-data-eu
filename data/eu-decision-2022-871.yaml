  script: Latn
  content: Europa-Parlamentets og Rådets afgørelse (EU) 2022/871 af 30. maj 2022
    om ændring af Rådets beslutning 2003/17/EF for så vidt angår dens anvendelsesperiode
    og for så vidt angår ligestilling af markinspektioner, der gennemføres i Bolivia
    af afgrøder til formering af sædekorn og afgrøder til formering af olie- og
    spindplanter, og ligestilling af sædekorn og frø af olie- og spindplanter, der
    er produceret i Bolivia
  type: main
