    un attiecībā uz tādu lauka apskašu līdzvērtīgumu, ko Bolīvijā veic sakarā
    ar graudaugu sēklu ražošanai paredzētiem augiem un eļļas augu un šķiedraugu
    sēklu ražošanai paredzētiem augiem, un attiecībā uz Bolīvijā ražotu graudaugu
    sēklu un eļļas augu un šķiedraugu sēklu līdzvērtīgumu
  type: main
- language: lt
  script: Latn
