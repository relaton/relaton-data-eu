  content: Decision (EU) 2022/871 of the European Parliament and of the Council of
    30 May 2022 amending Council Decision 2003/17/EC as regards its period of application
    and as regards the equivalence of field inspections carried out in Bolivia on
    cereal seed-producing crops and oil and fibre plant seed-producing crops and the
    equivalence of cereal seed and oil and fibre plant seed produced in Bolivia
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/871 du Parlement européen et du Conseil du 30 mai
    2022 modifiant la décision 2003/17/CE du Conseil en ce qui concerne sa période
    d’application et en ce qui concerne l’équivalence des inspections sur pied
    des cultures productrices de semences de céréales et des cultures productrices
    de semences de plantes oléagineuses et à fibres effectuées en Bolivie, et l’équivalence
    des semences de céréales et des semences de plantes oléagineuses et à fibres
    produites en Bolivie
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/871 des Europäischen Parlaments und des Rates vom
