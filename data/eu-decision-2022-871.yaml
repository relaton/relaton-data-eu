    jednakovrijednosti pregleda usjeva na terenu koji se provode u Boliviji na sjemenskim
    usjevima žitarica i sjemenskim usjevima uljarica i predivog bilja te jednakovrijednosti
    sjemena žitarica i sjemena uljarica i predivog bilja proizvedenog u Boliviji
  type: main
