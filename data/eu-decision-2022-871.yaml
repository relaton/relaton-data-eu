    von Getreidesaatgutvermehrungsbeständen und Öl- und Faserpflanzensaatgutvermehrungsbeständen
    in Bolivien sowie der Gleichstellung von in Bolivien erzeugtem Getreidesaatgut
    sowie Öl- und Faserpflanzensaatgut
  type: main
- language: bg
  script: Cyrl
