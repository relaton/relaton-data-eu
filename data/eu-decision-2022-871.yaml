    срока на неговото прилагане, както и по отношение
    на еквивалентността на полските инспекции,
    извършвани в Боливия, напосеви за производство
    на семена от зърнени култури и посеви за производство
    на семената от маслодайни и влакнодайни култури
    и по отношение на еквивалентността на семената
    от зърнени култури и на семената от маслодайни
    и влакнодайни култури, произведени в Боливия
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady (EU) 2022/871 ze dne 30. května
    2022, kterým se mění rozhodnutí Rady 2003/17/ES, pokud jde o dobu jeho použitelnosti
    a o rovnocennost přehlídek porostu prováděných v Bolívii u množitelského
    porostu pro produkci osiva obilovin a množitelského porostu pro produkci osiva
    olejnin a přadných rostlin a rovnocennost osiva obilovin a osiva olejnin a přadných
    rostlin vyprodukovaných v Bolívii
  type: main
