    a Bolíviában a gabona-, olaj- és rostnövényvetőmag-termesztés során végrehajtott
    szántóföldi ellenőrzések egyenértékűsége és a Bolíviában termesztett
    gabona-, olaj- és rostnövényvetőmagok egyenértékűsége tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/871 del Parlamento europeo e del Consiglio del 30 maggio
