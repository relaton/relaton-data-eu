    suo periodo di applicazione e l’equivalenza delle ispezioni in campo delle colture
    di sementi di cereali e delle colture di sementi di piante oleaginose e da fibra
    effettuate in Bolivia nonché l’equivalenza delle sementi di cereali e di piante
    oleaginose e da fibra prodotte in Bolivia
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Lēmums (ES) 2022/871 (2022. gada 30. maijs),
