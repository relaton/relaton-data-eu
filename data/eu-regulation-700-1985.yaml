title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 700/85 of 18 March 1985 re-establishing
    the levying of customs duties on certain woven fabrics of cotton, unbleached or
    bleached, products of category ex 2 (code 40.0023), originating in Indonesia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 700/85 de la Commission du 18 mars 1985 portant rétablissement
    de la perception des droits de douane applicables à certains tissus de coton,
    écrus ou blanchis, de la catégorie de produits no ex 2 (code 40.0023), originaires
    de l' Indonésie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 700/85 der Kommission vom 18. März 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Gewebe aus Baumwolle, roh oder
    gebleicht, der Warenkategorie Nr. ex 2 (Kennziffer 40.0023) mit Ursprung in Indonesien,
    dem die in der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 700/85 af 18. marts 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte vævede stoffer af bomuld, ublegede
    og blegede, under varekategori nr. ex 2 (kode 40.0023), som har oprindelse i Indonesien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 700/85 της Επιτροπής
    της 18ης Μαρτίου 1985 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    υφάσματα βαμβακηρά, αλεύκαστα ή λευκασμένα,
    της κατηγορίας προϊόντων ex 2 (κωδικός 40.0023) καταγωγής
    Ινδονησίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 700/85 della Commissione del 18 marzo 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni tessuti di cotone, greggi
    o imbianchiti, della categoria di prodotti n. ex 2 (codice 40.0023), originari
    dell' Indonesia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 700/85 van de Commissie van 18 maart 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    weefsels van katoen, ongebleekt of gebleekt, van de categorie van produkten nr.
    ex 2 (codenummer 40.0023), van oorsprong uit Indonesië, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3563/84 van de
    Raad
