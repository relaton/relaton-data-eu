title:
- language: en
  script: Latn
  content: '2000/814/EC: Council Decision of 14 December 2000 on the conclusion of
    an Agreement in the form of an Exchange of Letters concerning the provisional
    application of the Protocol establishing, for the period 1 July 2000 to 30 June
    2001, the fishing rights and financial compensation provided for in the Agreement
    between the European Economic Community and the Government of the Republic of
    Equatorial Guinea on fishing off the coast of Equatorial Guinea'
  type: main
- language: fr
  script: Latn
  content: '2000/814/CE: Décision du Conseil du 14 décembre 2000 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée équatoriale concernant la pêche au large de la
    côte de Guinée équatoriale, pour la période du 1er juillet 2000 au 30 juin
    2001'
  type: main
- language: de
  script: Latn
  content: '2000/814/EG: Beschluss des Rates vom 14. Dezember 2000 über den Abschluss
    des Abkommens in Form eines Briefwechsels über die vorläufige Anwendung des
    Protokolls zur Festlegung der Fangmöglichkeiten und des finanziellen Ausgleichs
    nach dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Republik Äquatorialguinea über die Fischerei vor der Küste Äquatorialguineas
    für die Zeit vom 1. Juli 2000 bis zum 30. Juni 2001'
  type: main
- language: da
  script: Latn
  content: '2000/814/EF: Rådets afgørelse af 14. december 2000 om indgåelse af
    aftalen i form af brevveksling om midlertidig anvendelse af protokollen om fastsættelse
    af de fiskerimuligheder og den finansielle modydelse, der er omhandlet i aftalen
    mellem Det Europæiske Økonomiske Fællesskab og regeringen for Republikken Ækvatorialguinea
    om fiskeri ud for Ækvatorialguineas kyster, for perioden 1. juli 2000 til 30.
    juni 2001'
  type: main
- language: el
  script: Grek
  content: '2000/814/ΕΚ: Απόφαση του Συμβουλίου, της 14ης
    Δεκεμβρίου 2000, για τη σύναψη συμφωνίας υπό
    τη μορφή ανταλλαγής επιστολών σχετικά με την
    προσωρινή εφαρμογή του πρωτοκόλλου που καθορίζει
    τις αλιευτικές δυνατότητες και την χρηματική
    αντιστάθμιση που προβλέπονται στη συμφωνία
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και της Κυβέρνησης της Δημοκρατίας της Ισημερινής
