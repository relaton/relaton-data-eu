    από 1ης Ιουλίου 2000 έως 30 Ιουνίου 2001'
  type: main
- language: fi
  script: Latn
  content: '2000/814/EY: Neuvoston päätös, tehty 14 päivänä joulukuuta 2000,
    Euroopan talousyhteisön ja Päiväntasaajan Guinean tasavallan hallituksen välisessä,
    Päiväntasaajan Guinean rannikon edustalla harjoitettavasta kalastuksesta tehdyssä
    sopimuksessa määrättyjen kalastusmahdollisuuksien ja taloudellisen korvauksen
    vahvistamisesta 1 päivän heinäkuuta 2000 ja 30 päivän kesäkuuta 2001 väliseksi
    ajaksi tehdyn pöytäkirjan väliaikaista soveltamista koskevan sopimuksen tekemisestä
    kirjeenvaihtona'
  type: main
- language: it
  script: Latn
  content: '2000/814/CE: Decisione del Consiglio, del 14 dicembre 2000, concernente
