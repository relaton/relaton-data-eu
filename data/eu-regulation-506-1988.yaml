    στον τομέα του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 506/88 della Commissione del 25 febbraio 1988 che
    deroga, per il primo trimestre del 1988, al regolamento (CEE) n. 2377/80 per quanto
    concerne il rilascio dei titoli d' importazione nell' ambito di regimi speciali
    nel settore delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 506/88 van de Commissie van 25 februari 1988 tot
    afwijking voor het eerste kwartaal van 1988 van Verordening (EEG) nr. 2377/80
    ten aanzien van de afgifte van invoercertificaten in het kader van bepaalde bijzondere
    regelingen in de sector rundvlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 506/88 da Comissão de 25 de Fevereiro de 1988 que
    derroga, relativamente ao primeiro trimestre de 1988, o Regulamento (CEE) n.°
    2377/80 no que respeita à emissão de autorizações de importação no âmbito
    de certos regimes especiais no sector da carne de bovino
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 506/88 de la Comisión de 25 de febrero de 1988 por
    el que se establece que durante el primer trimestre de 1988 no se aplicarán las
    disposiciones del Reglamento (CEE) n° 2377/80 relativas a la expedición de certificados
    de importación en el marco de determinados regímenes especiales en el sector
    de la carne de bovino
