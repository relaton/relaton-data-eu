    en ce qui concerne la délivrance des certificats d' importation dans le cadre
    de certains régimes spéciaux dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 506/88 der Kommission vom 25. Februar 1988 zur Abweichung
    von der Verordnung (EWG) Nr. 2377/80 hinsichtlich der Erteilung von Einfuhrlizenzen
    im Rahmen von Sonderregelungen im ersten Vierteljahr 1988 auf dem Sektor Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 506/88 af 25. februar 1988 om undtagelse
