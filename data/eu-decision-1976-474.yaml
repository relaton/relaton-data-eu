title:
- language: en
  script: Latn
  content: Commission Decision of 5 May 1976 specifying the extent to which applications
    for import licences lodged from 26 to 30 April 1976 for young bovine animals of
    highland breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '76/474/CEE: Décision de la Commission, du 5 mai 1976, déterminant dans
    quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées du 26 au 30 avril 1976 pour les jeunes bovins de races
    alpines destinés à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Mai 1976 darüber, inwieweit den vom
    26. bis 30. April 1976 gestellten Anträgen auf Einfuhrlizenzen für Mastjungrinder
    der Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. maj 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicenser, som er indgivet i perioden fra den 26. til 30.
    april 1976 for ungkvæg af alpine racer, bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 maggio 1976, che determina in quale
    misura può essere dato seguito alle domande d'importazione, presentate dal 26
    al 30 aprile 1976, per giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 mei 1976 tot vaststelling van de mate
    waarin van 26 tot en met 30 april 1976 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mestrunderen van Alpenrassen kunnen worden ingewilligd
  type: main
