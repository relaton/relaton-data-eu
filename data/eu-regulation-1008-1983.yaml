title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1008/83 of 27 April 1983 laying down for 1983
    certain measures for the conservation and management of fishery resources applicable
    to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1008/83 du Conseil du 27 avril 1983 fixant, pour l'
    année 1983, certaines mesures de conservation et de gestion des ressources de
    pêche applicables aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1008/83 des Rates vom 27. April 1983 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für auf den
    Färöern registrierte Schiffe für 1983
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1008/83 af 27. april 1983 om fastsættelse
    for 1983 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1008/83 του Συμβουλίου
    της 27ης Απριλίου 1983 για τον καθορισμό, για το
    έτος 1983, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη που είναι νηολογημένα στις νήσους Φερόε
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1008/83 del Consiglio del 27 aprile 1983 che stabilisce,
    per il 1983, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1008/83 van de Raad van 27 april 1983 tot vaststelling
    voor 1983 van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden, van toepassing op vaartuigen die op de Faeröer geregistreerd zijn
  type: main
