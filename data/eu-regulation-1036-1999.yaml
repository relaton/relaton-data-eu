title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1036/1999 of 17 May 1999 amending Regulation
    (EEC) No 3508/92 establishing an integrated administration and control system
    for certain Community aid schemes as regards the deadlines for lodging applications
    for compensatory payments under the aid scheme for rice producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1036/1999 du Conseil, du 17 mai 1999, modifiant le
    règlement (CEE) n° 3508/92 établissant un système intégré de gestion et
    de contrôle relatif à certains régimes d'aides communautaires, en ce qui concerne
    les dates limites de dépôt des demandes d'aide dans le cadre du régime de paiement
    compensatoire aux producteurs de riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1036/1999 des Rates vom 17. Mai 1999 zur Änderung
    der Verordnung (EWG) Nr. 3508/92 zur Einführung eines integrierten Verwaltungs-
    und Kontrollsystems für bestimmte gemeinschaftliche Beihilferegelungen hinsichtlich
    der Fristen für die Einreichung von Beihilfeanträgen im Rahmen der Ausgleichszahlungsregelung
    für Reiserzeuger
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1036/1999 af 17. maj 1999 om ændring af forordning
    (EØF) nr. 3508/92 om et integreret system for forvaltning og kontrol af visse
    EF- støtteordninger, for så vidt angår fristerne for indgivelse af støtteansøgninger
    inden for rammerne af godtgørelsesordningen for risproducenter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1036/1999 του Συμβουλίου,
    της 17ης Μαΐου 1999, για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3508/92 για τη θέσπιση ολοκληρωμένου
    συστήματος διαχείρισης και ελέγχου σχετικά
    με ορισμένα καθεστώτα κοινοτικών ενισχύσεων,
    όσον αφορά τις προθεσμίες υποβολής των αιτήσεων
    ενίσχυσης στο πλαίσιο του καθεστώτος αντισταθμιστικών
    πληρωμών στους παραγωγούς ρυζιού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1036/1999, annettu 17 päivänä toukokuuta 1999,
    tiettyjä yhteisön tukijärjestelmiä koskevasta yhdennetystä hallinto- ja valvontajärjestelmästä
    annetun asetuksen (ETY) N:o 3508/92 muuttamisesta riisintuottajien korvausjärjestelmän
    mukaisten tukihakemusten jättämistä koskevien määräpäivien osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1036/1999 del Consiglio, del 17 maggio 1999, che modifica
    il regolamento (CEE) n. 3508/92 che istituisce un sistema integrato di gestione
    e di controllo di taluni regimi di aiuti comunitari, in ordine alle date limite
    per la presentazione delle domande di aiuto nell'ambito del regime di pagamenti
    compensativi ai produttori di riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1036/1999 van de Raad van 17 mei 1999 houdende wijziging
    van Verordening (EEG) nr. 3508/92 tot instelling van een geïntegreerd beheers-
    en controlesysteem voor bepaalde communautaire steunregelingen, wat betreft de
    uiterste data voor de indiening van de steunaanvragen in het kader van de regeling
    inzake compensatiebetaling aan rijsttelers
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1036/1999 do Conselho, de 17 de Maio de 1999, que
    altera o Regulamento (CEE) n° 3508/92 que estabelece um sistema integrado de
    gestão e de controlo relativo a determinados regimes de ajudas comunitários,
    no respeitante às datas-limite de apresentação dos pedidos de ajuda no âmbito
    do regime de pagamentos compensatórios aos produtores de arroz
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1036/1999 del Consejo, de 17 de mayo de 1999, que modifica
    el Reglamento (CEE) n° 3508/92 por el que se establece un sistema integrado de
    gestión y control de determinados regímenes de ayuda comunitarios en lo que
    se refiere a las fechas límite de presentación de las solicitudes de ayuda dentro
    del régimen de pagos compensatorios a los productores de arroz
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1036/1999 av den 17 maj 1999 om ändring av
