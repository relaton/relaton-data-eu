id: EUDecision1977785
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 September 1977 authorizing the French Republic
    not to apply Community treatment to garments falling within heading No 61.01,
    61.02 or 61.03 of the Common Customs Tariff, originating in Hungary and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/785/CEE: Décision de la Commission, du 9 septembre 1977, autorisant
    la République française à exclure du traitement communautaire les vêtements,
    des positions 61.01, 61.02 et 61.03 du Tarif douanier commun, originaires de Hongrie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. September 1977, mit der die Französische
    Republik ermächtigt wird, aus Ungarn stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung der Tarifnummern 61.01, 61.02 und 61.03
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. september 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande, som
    henhører under pos. 61.01, 61.02 og 61.03 i den fælles toldtarif, har oprindelse
    i Ungarn og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 settembre 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti di cui alle voci
    61.01, 61.02 e 61.03 della tariffa doganale comune, originari dell'Ungheria e
    messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 september 1977 waarbij de Franse Republiek
    wordt gemachtigd kleding van de posten 61.01, 61.02 en 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hongarije en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
