  script: Latn
  content: Commission Regulation (EEC) No 2529/78 of 27 October 1978 re-establishing
    the levying of the customs duties on equipment for parlour games, etc., falling
    within heading No 97.04, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2529/78 de la Commission, du 27 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour jeux de société, etc., de la position tarifaire 97.04, originaires de la
    Corée du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2529/78 der Kommission vom 27. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr Gesellschaftsspiele der Tarifnummer 97.04, mit Ursprung in
    Súdkorea, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2529/78 af 27. oktober 1978 om genindførelse
