    di società, della voce 97.04 della tariffa doganale comune, originari della Corea
    del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2529/78 van de Commissie van 27 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op artikelen
    voor gezelschapsspellen, van post 97.04, van oorsprong uit Zuid-Korea, ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
