title:
- language: fr
  script: Latn
  content: Décision 64/554/CEE de la Commission, du 21 septembre 1964, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire les pommes de table originaires de certains
    pays tiers et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/554/EWG: Entscheidung der Kommission vom 21. September 1964 über den
    Antrag der Französischen Republik nach Artikel 115 Absatz (1) des Vertrages auf
    Ausschließung von Tafeläpfeln aus dritten Ländern aus der Gemeinschaftsbehandlung,
    die in anderen Mitgliedstaaten in den freien Verkehr gebracht worden sind'
  type: main
- language: it
  script: Latn
  content: '64/554/CEE: Decisione della Commissione, del 21 settembre 1964, relativa
    al ricorso presentato dalla Repubblica francese ai sensi dell''articolo 115, comma
    I, del Trattato, per escludere dal trattamento comunitario le mele da tavola originarie
    di taluni paesi terzi e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/554/EEG: Beschikking van de Commissie van 21 september 1964 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 155, eerste alinea,
    van het Verdrag tafelappelen, die van oorsprong zijn uit sommige derde landen
    en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
