title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant le Royaume de Belgique et le Grand-Duché
    de Luxembourg à différer le rapprochement des droits prévus dans leur tarif
    douanier vers ceux du Tarif douanier commun, en ce qui concerne l'aluminium brut
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission zur Ermächtigung des Königreichs Belgien
    und des Großherzogtums Luxemburg, die Angleichung der Zölle ihres Zolltarifs
    an den Gemeinsamen Zolltarif für Rohaluminium aufzuschieben
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione che autorizza il Regno del Belgio e il Granducato
    del Lussemburgo a differire il ravvicinamento dei dazi iscritti nella loro tariffa
    doganale a quelli della tariffa doganale comune per quanto riguarda l'alluminio
    greggio
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie waarbij het Koninkrijk België en het Groothertogdom
    Luxemburg worden gemachtigd de aanpassing van de in hun douanetarief opgenomen
    invoerrechten aan het gemeenschappelijk douanetarief ten aanzien van ruw aluminium
    uit te stellen
  type: main
