title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 91/2004 of 20 January 2004 laying down to
    what extent applications for issue of export licences submitted during January
    2004 for beef products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 91/2004 de la Commission du 20 janvier 2004 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de janvier 2004 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 91/2004 der Kommission vom 20. Januar 2004 über das
    Ausmaß, in dem den im Januar 2004 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 91/2004 af 20. januar 2004 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    januar 2004 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 91/2004 της Επιτροπής,
    της 20ής Ιανουαρίου 2004, που καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Ιανουάριου του 2004 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 91/2004, annettu 20 päivänä tammikuuta 2004,
    kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden tammikuussa
    2004 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 91/2004 della Commissione, del 20 gennaio 2004, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di gennaio 2004 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese quarto
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 91/2004 van de Commissie van 20 januari 2004 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in januari 2004 ingediende
    aanvragen om uitvoercertificaten voor producten van de sector rundvlees waarvoor
    een bĳzondere behandeling geldt bĳ invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 91/2004 da Comissão, de 20 de Janeiro de 2004, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Janeiro de 2004 em relação a produtos
    do sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 91/2004 de la Comisión, de 20 de enero de 2004, por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentadas en el mes de enero de 2004, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en un tercer país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 91/2004 av den 20 januari 2004 om fastställande
