    aanpassing van de wetgevingen van de lidstaten betreffende elektrisch materieel
    bestemd voor gebruik in "explosieve omgeving", dat aan bepaalde beveiligingswijzen
    voldoet
  type: main
- language: pt
  script: Latn
  content: Directiva 97/53/CE da Comissão de 11 de Setembro de 1997 que adapta ao
