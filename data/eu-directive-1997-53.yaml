- language: en
  script: Latn
  content: Commission Directive 97/53/EC of 11 September 1997 adapting to technical
    progress Council Directive 79/196/EEC on the approximation of the laws of the
    Member States concerning electrical equipment for use in potentially explosive
    atmospheres employing certain types of protection
  type: main
- language: fr
  script: Latn
  content: Directive 97/53/CE de la Commission du 11 septembre 1997 portant adaptation
    au progrès technique de la directive 79/196/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives au matériel électrique utilisable
    en atmosphère explosible mettant en oeuvre certains modes de protection
  type: main
- language: de
  script: Latn
  content: Richtlinie 97/53/EG der Kommission vom 11. September 1997 zur Anpassung
    der Richtlinie 79/196/EWG des Rates zur Angleichung der Rechtsvorschriften der
    Mitgliedstaaten betreffend elektrische Betriebsmittel zur Verwendung in explosibler
    Atmosphäre, die mit bestimmten Zündschutzarten versehen sind, an den technischen
    Fortschritt
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 97/53/EF af 11. september 1997 om tilpasning til
    den tekniske udvikling af Rådets direktiv 79/196/EØF om indbyrdes tilnærmelse
    af medlemsstaternes lovgivning vedrørende elektrisk materiel til anvendelse i
    eksplosionsfarlig atmosfære og om indførelse af visse beskyttelsesmåder
  type: main
- language: el
  script: Grek
  content: Οδηγία 97/53/ΕΚ της Επιτροπής της 11ης Σεπτεμβρίου
    1997 για την προσαρμογή στην τεχνική πρόοδο της
    οδηγίας 79/196/ΕΟΚ του Συμβουλίου περί προσεγγίσεως
    των νομοθεσιών των κρατών μελών που αφορούν
    το ηλεκτρολογικό υλικό που δύναται να χρησιμοποιηθεί
    σε ατμόσφαιρα υπέχουσα τον κίνδυνο εκρήξεως
    και που απαιτεί ορισμένους τρόπους προστασίας
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 97/53/EY, annettu 11 päivänä syyskuuta 1997, räjähdysvaarallisissa
