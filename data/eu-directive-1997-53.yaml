    delle legislazioni degli Stati membri relative al materiale elettrico destinato
    ad essere utilizzato in atmosfera esplosiva, per il quale si applicano taluni
    metodi di protezione
  type: main
- language: nl
  script: Latn
  content: Richtlijn 97/53/EG van de Commissie van 11 september 1997 tot aanpassing
