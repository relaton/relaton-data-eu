    den finansielle udligning og godtgørelse samt om fastsættelse af tilbagetagelsespriser
    og beregning af købspriser for visse fiskerivarer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3127/76 della Commissione, del 16 dicembre 1976, che
    modifica il regolamento (CEE) n. 3559/73, relativo a disposizioni d' applicazione
    concernenti concessione della compensazione finanziaria e dell' indennità nonché
    la fissazione dei prezzi di ritiro e la constatazione dei prezzi di acquisto per
    determinati prodotti della pesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3127/76 van de Commissie van 16 december 1976 tot
