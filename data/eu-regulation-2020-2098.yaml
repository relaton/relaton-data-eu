    εν λόγω παραγωγό-εξαγωγέα και την καταγραφή
    των εισαγωγών που προέρχονται από αυτόν
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2020/2098, 15. detsember 2020, millega
    algatatakse nõukogu rakendusmääruste (EL) nr 443/2011 ja (EL) nr 444/2011 (millega
    laiendatakse vastavalt lõplikku tasakaalustavat tollimaksu ja lõplikku dumpinguvastast
    tollimaksu Kanadast lähetatud biodiislikütuse impordile olenemata sellest, kas
    see on deklareeritud Kanadast pärinevana või mitte) läbivaatamine, et teha
    kindlaks võimalus vabastada üks Kanada eksportiv tootja nende meetmete kohaldamisest,
    ning tühistatakse dumpinguvastane tollimaks kõnealuselt eksportivalt tootjalt
    pärineva impordi suhtes ja kehtestatakse sellelt eksportivalt tootjalt pärineva
    impordi registreerimise nõue
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2020/2098, annettu 15 päivänä
    joulukuuta 2020, Kanadasta lähetetyn biodieselin tuontia koskevan lopullisen
    tasoitustullin ja lopullisen polkumyyntitullin soveltamisalan laajentamisesta
    riippumatta siitä, onko alkuperämaaksi ilmoitettu Kanada, annettuja neuvoston
    täytäntöönpanoasetuksia (EU) N:o 443/2011 ja (EU) N:o 444/2011 koskevan tarkastelun
    vireillepanosta sen määrittämiseksi, voidaanko näistä toimenpiteistä myöntää
    vapautus yhdelle kanadalaiselle vientiä harjoittavalle tuottajalle, polkumyyntitullin
    kumoamisesta kyseisen vientiä harjoittavan tuottajan tuonnissa ja kyseisen vientiä
    harjoittavan tuottajan tuonnin kirjaamisvelvoitteesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/2098 оd 15. prosinca 2020. o pokretanju
    revizije provedbenih uredbi Vijeća (EU) br. 443/2011 i (EU) br. 444/2011 o proširenju
    konačne kompenzacijske i antidampinške pristojbe na uvoz biodizela poslanog
    iz Kanade, bez obzira na to ima li deklarirano podrijetlo iz Kanade ili ne, radi
    utvrđivanja mogućnosti odobravanja izuzeća od tih mjera jednom kanadskom proizvođaču
    izvozniku, stavljanja izvan snage antidampinške pristojbe s obzirom na uvoz od
    tog proizvođača izvoznika te nametanja obveze evidentiranja njegova uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/2098 végrehajtási rendelete (2020. december 15.)
    a Kanadában feladott, akár Kanadából származóként, akár nem ilyenként
    bejelentett biodízel behozatalára vonatkozó végleges kiegyenlítő és dömpingellenes
    vám kiterjesztéséről szóló 443/2011/EU és 444/2011/EU tanácsi végrehajtási
    rendelet felülvizsgálatának az intézkedések alól egy kanadai exportáló
    gyártó számára biztosítható mentesség lehetőségének megállapítása
    céljából történő megindításáról, a dömpingellenes vámnak az érintett
    exportáló gyártótól származó behozatalok tekintetében való hatályon
    kívül helyezéséről, valamint az érintett exportáló gyártótól érkező
    behozatalokra vonatkozó nyilvántartásbavételi kötelezettség bevezetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/2098 della Commissione del 15 dicembre
    2020 che avvia un riesame dei regolamenti di esecuzione (UE) n. 443/2011 e n.
    444/2011 del Consiglio che estendono rispettivamente il dazio compensativo definitivo
    e il dazio antidumping definitivo sulle importazioni di biodiesel spedito dal
    Canada, a prescindere dal fatto che venga dichiarato originario del Canada o no,
    allo scopo di determinare la possibilità di concedere un’esenzione da tali
    misure a un produttore esportatore canadese, che abroga il dazio antidumping sulle
    importazioni provenienti da detto produttore esportatore e che dispone la registrazione
    di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/2098 (2020. gada 15. decembris),
    ar ko sāk pārskatīt Padomes Īstenošanas regulas (ES) Nr. 443/2011 un (ES)
    Nr. 444/2011, ar kurām galīgo kompensācijas un galīgo antidempinga maksājumu
    attiecīgi piemēro arī biodīzeļdegvielas importam, kas sūtīts no Kanādas
    un kam ir vai nav deklarēta izcelsme Kanādā, lai noteiktu, vai var piešķirt
    atbrīvojumu no šiem pasākumiem vienam Kanādas ražotājam eksportētājam,
    atceltu antidempinga maksājumu attiecībā uz šā ražotāja eksportētāja
    veikto importu un šā ražotāja eksportētāja veiktajam importam piemērotu
    reģistrāciju
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/2098 2020 m. gruodžio 15
    d. kuriuo inicijuojama Tarybos įgyvendinimo reglamentų (ES) Nr. 443/2011 ir
    (ES) Nr. 444/2011, kuriais išplečiamas atitinkamai galutinio kompensacinio ir
    galutinio antidempingo muito taikymas importuojamam iš Kanados siunčiamam biodyzelinui,
    deklaruojamam arba nedeklaruojamam kaip Kanados kilmės, peržiūra siekiant nustatyti
    galimybę atleisti nuo šių priemonių vieną Kanados eksportuojantį gamintoją,
    panaikinamas antidempingo muitas šio eksportuojančio gamintojo importuojamam
    produktui ir nustatoma privaloma šio eksportuojančio gamintojo importuojamo
    produkto registracija
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/2098 tal-15
    ta’ Diċembru 2020 li jniedi rieżami tar-Regolamenti ta’ Implimentazzjoni
    tal-Kunsill (UE) Nru 443/2011 u (UE) Nru 444/2011 b’mod li jiġi estiż, rispettivament,
    id-dazju antidumping u kumpensatorju definittiv fuq l-importazzjonijiet tal-bijodiżil
    ikkunsinnati mill-Kanada, kemm jekk iddikjarati bħala li joriġinaw mill-Kanada
    kif ukoll jekk le, għall-finijiet tad-determinazzjoni tal-possibbiltà li tingħata
    eżenzjoni minn dawk il-miżuri lil produttur esportatur Kanadiż wieħed, li
    jħassar id-dazju antidumping fir-rigward tal-importazzjonijiet minn dak il-produttur
    esportatur u li jagħmel l-importazzjonijiet minn dak il-produttur esportatur
    soġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/2098 van de Commissie van 15 december
    2020 tot opening van een nieuw onderzoek ten aanzien van de Uitvoeringsverordeningen
    (EU) nr. 443/2011 en (EU) nr. 444/2011 van de Raad tot verlenging van, respectievelijk,
    het definitieve compenserende recht en het definitieve antidumpingrecht op uit
    Canada verzonden biodiesel, al dan niet aangegeven als van oorsprong uit Canada,
    met het oog op het bepalen van de mogelijkheid om vrijstelling van die maatregelen
    te verlenen aan één Canadese producent-exporteur, tot intrekking van het antidumpingrecht
    met betrekking tot de invoer van die producent-exporteur en tot registratie van
    de invoer van die producent-exporteur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/2098 z dnia 15 grudnia 2020
    r. wszczynające przegląd rozporządzeń wykonawczych Rady (UE) nr 443/2011 i
    (UE) nr 444/2011, rozszerzających odpowiednio ostateczne cło wyrównawcze i
    antydumpingowe na przywóz biodiesla wysyłanego z Kanady, zgłoszonego lub niezgłoszonego
    jako pochodzący z Kanady, w celu określenia możliwości przyznania zwolnienia
    z tych środków jednemu kanadyjskiemu producentowi eksportującemu, uchylenia
    cła antydumpingowego w odniesieniu do przywozu od tego producenta eksportującego
    i poddania przywozu od tego producenta eksportującego rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2020/2098 da Comissão de 15 de dezembro
    de 2020 que dá início ao reexame dos Regulamentos de Execução (UE) n.o 443/2011
    e (UE) n.o 444/2011 do Conselho que tornam extensivo, respetivamente, o direito
    de compensação definitivo e o direito anti-dumping definitivo instituídos sobre
    as importações de biodiesel originário dos Estados Unidos da América às importações
    de biodiesel expedido do Canadá, quer seja ou não declarado originário do Canadá,
    para efeitos de determinar a possibilidade de conceder uma isenção dessas medidas
    a um produtor-exportador canadiano, que revoga o direito anti-dumping no que diz
    respeito às importações provenientes desse produtor-exportador e que sujeita
    as importações desse produtor-exportador a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/2098 al Comisiei din 15 decembrie
    2020 de deschidere a unei reexaminări a Regulamentelor de punere în aplicare
    (UE) nr. 443/2011 și (UE) nr. 444/2011 ale Consiliului de extindere a taxei compensatorii
    definitive și, respectiv, a taxei antidumping definitive asupra importurilor
    de biomotorină expediate din Canada, indiferent dacă au fost sau nu declarate
    ca fiind originare din Canada, în scopul stabilirii posibilității de a acorda
    unui producător-exportator canadian o scutire de la măsurile respective, de
    abrogare a taxei antidumping cu privire la importurile provenite de la respectivul
    producător-exportator și de înregistrare a importurilor de biomotorină provenite
    de la respectivul producător-exportator
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/2098 z 15. decembra 2020, ktorým
    sa začína revízne prešetrovanie vykonávacích nariadení Rady (EÚ) č. 443/2011
    a č. 444/2011, ktorými sa rozširuje konečné vyrovnávacie a antidumpingové
    clo na dovoz bionafty odosielanej z Kanady bez ohľadu na to, či má, alebo nemá
    deklarovaný pôvod v Kanade, s cieľom určiť, či je možné udeliť výnimku
    z uvedených opatrení jednému kanadskému vyvážajúcemu výrobcovi, zrušiť
    antidumpingové clo vzťahujúce sa na dovoz od uvedeného vyvážajúceho výrobcu
    a zaviesť registráciu dovozu od uvedeného vyvážajúceho výrobcu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/2098 z dne 15. decembra 2020 o začetku
    pregleda izvedbenih uredb Sveta (EU) št. 443/2011 in (EU) št. 444/2011 o razširitvi
    dokončne izravnalne in protidampinške dajatve na uvoz biodizla, poslanega iz
    Kanade, ne glede na to, ali je deklariran kot izdelek s poreklom iz Kanade ali
    ne, da se določi možnost odobritve izvzetja iz teh ukrepov enemu kanadskemu
    proizvajalcu izvozniku, razveljavi protidampinška dajatev na uvoz tega proizvajalca
    izvoznika in uvede registracija uvoza tega proizvajalca izvoznika
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/2098 de la Comisión de 15 de diciembre
    de 2020 por el que se inicia una reconsideración de los Reglamentos de Ejecución
    (UE) n.o 443/2011 y (UE) n.o 444/2011 del Consejo, por los que se amplían, respectivamente,
    el derecho compensatorio definitivo y el derecho antidumping definitivo a las
    importaciones de biodiésel expedido desde Canadá, haya sido o no declarado originario
    de Canadá, a fin de determinar la posibilidad de conceder una exención en relación
    con tales medidas a un productor exportador canadiense, derogar el derecho antidumping
    con respecto a las importaciones procedentes de ese productor exportador y someter
    a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2020/2098 av den 15 december
    2020 om inledande av en översyn av rådets genomförandeförordningar (EU) nr
    443/2011 och (EU) nr 444/2011 om utvidgning av den slutgiltiga utjämningstullen
    respektive antidumpningstullen på import av biodiesel som avsänts från Kanada,
    oavsett om produktens deklarerade ursprung är Kanada eller inte, i syfte att
    fastställa möjligheten att bevilja en kanadensisk exporterande tillverkare befrielse
    från dessa åtgärder, upphäva antidumpningstullen på import från den exporterande
    tillverkaren och göra import från den exporterande tillverkaren till föremål
    för registrering
  type: main
