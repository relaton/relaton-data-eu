id: EURegulation20202098
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2098 of 15 December 2020 initiating
    a review of Council Implementing Regulations (EU) No 443/2011 and (EU) No 444/2011
    extending, respectively, the definitive countervailing and anti-dumping duty on
    imports of biodiesel consigned from Canada, whether declared as originating in
    Canada or not, for the purposes of determining the possibility of granting an
    exemption from those measures to one Canadian exporting producer, repealing the
    anti-dumping duty with regard to imports from that exporting producer and making
    imports from that exporting producer subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/2098 de la Commission du 15 décembre
    2020 portant ouverture d’un réexamen des règlements d’exécution (UE) no
    443/2011 et (UE) no 444/2011 du Conseil portant extension, respectivement, du
    droit compensateur définitif et du droit antidumping définitif institués sur
    les importations de biodiesel expédié du Canada, qu’il ait ou non été déclaré
    originaire de ce pays, afin d’étudier la possibilité d’accorder une exemption
    de ces mesures à un producteur-exportateur canadien, abrogeant le droit antidumping
    en ce qui concerne les importations provenant de ce producteur-exportateur et
    soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/2098 der Kommission vom 15. Dezember
    2020 zur Einleitung einer Überprüfung der Durchführungsverordnungen (EU) Nr.
    443/2011 und (EU) Nr. 444/2011 des Rates zur Ausweitung des endgültigen Ausgleichszolls
    bzw. des endgültigen Antidumpingzolls auf die aus Kanada versandten Einfuhren
    von Biodiesel, ob als Ursprungserzeugnisse Kanadas angemeldet oder nicht, zwecks
    Prüfung der Möglichkeit einer Befreiung eines kanadischen ausführenden Herstellers
    von diesen Maßnahmen, zur Außerkraftsetzung des Antidumpingzolls auf die von
    diesem ausführenden Hersteller stammenden Einfuhren und zur zollamtlichen Erfassung
    der von diesem ausführenden Hersteller stammenden Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/2098 на Комисията
    от 15 декември 2020 година за започване на преглед
    на регламенти за изпълнение (ЕС) № 443/2011 и (ЕС)
    № 444/2011 на Съвета за разширяване на обхвата
    съответно на окончателното изравнително мито
    и окончателното антидъмпингово мито върху
    вноса на биодизел, изпращан от Канада, деклариран
    или не с произход от Канада, с цел проучване
    на възможността за освобождаване от посочените
    мерки на един канадски производител износител,
    отмяна на антидъмпинговото мито по отношение
    на вноса от посочения производител износител
    и въвеждане на регистрационен режим за вноса
    от този производител износител
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/2098 ze dne 15. prosince 2020,
    kterým se zahajuje přezkum prováděcích nařízení Rady (EU) č. 443/2011
    a (EU) č. 444/2011, kterými se konečné vyrovnávací a konečné antidumpingové
    clo rozšiřuje na dovoz bionafty zasílané z Kanady, bez ohledu na to, zda je
    u ní deklarován původ z Kanady, jehož účelem je zjistit, zda lze od těchto
    opatření osvobodit jednoho kanadského vyvážejícího výrobce, zrušit antidumpingové
    clo, pokud jde o dovoz od tohoto vyvážejícího výrobce, a zavést celní evidenci
    dovozu od tohoto vyvážejícího výrobce
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/2098 af 15. december
    2020 om indledning af en fornyet undersøgelse af Rådets gennemførelsesforordning
    (EU) nr. 443/2011 og (EU) nr. 444/2011 om udvidelse af henholdsvis den endelige
    udligningstold og den endelige antidumpingtold på importen af biodiesel afsendt
    fra Canada, uanset om den er angivet med oprindelse i Canada, med henblik på
    at fastslå, om der kan bevilges en fritagelse for disse foranstaltninger til
    en enkelt canadisk eksporterende producent, om ophævelse af antidumpingtolden
    på importen fra denne eksporterende producent og om registrering af importen
    fra denne eksporterende producent
  type: main
