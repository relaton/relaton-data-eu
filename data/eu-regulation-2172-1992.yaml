title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2172/92 of 30 July 1992 fixing for the 1992/93
    marketing year the minimum price to be paid to producers for unprocessed sultanas,
    currants and muscatels and the amount of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n0 2172/92 de la Commission, du 30 juillet 1992, fixant,
    pour la campagne 1992/1993, le prix minimal à payer aux producteurs pour les
    sultanines, les raisins secs de Corinthe et les variétés Moscatel non transformés,
    ainsi que le montant de l' aide à la production pour ces raisins secs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2172/92 der Kommission vom 30. Juli 1992 zur Festsetzung
    des den Erzeugern unverarbeiteter Sultaninen, Korinthen und Moscatel zu zahlenden
    Mindestpreises sowie der Produktionsbeihilfe für getrocknete Korinthen im Wirtschaftsjahr
    1992/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2172/92 af 30. juli 1992 om fastsættelse
    for produktionsåret 1992/93 af den minimumspris, der skal betales producenten
    af uforarbejdede sultanas, korender og muskateller, samt af producentstøtten
    for disse tørrede druer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2172/92 της Επιτροπής
    της 30ής Ιουλίου 1992 που καθορίζει, για την περίοδο
    εμπορίας 1992/93, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τις σουλτανίνες, τις κορινθιακές
    σταφίδες και τις μη μεταποιημένες ποικιλίες
    Moscatel, καθώς και το ποσό της ενίσχυσης στην παραγωγή
    για τις σταφίδες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2172/92 della Commissione, del 30 luglio 1992, che
    fissa, per la campagna di commercializzazione 1992- 1993, il prezzo minimo da
    pagare ai produttori di uva Sultanina, di uva secca di Corinto e di Moscatel non
    trasformate e l' importo dell' aiuto alla produzione per le dette uve
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2172/92 van de Commissie van 30 juli 1992 tot vaststelling
