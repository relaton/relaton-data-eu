    aos produtores para as sultanas, uvas secas de Corinto e passas de uva Moscatel
    não transformadas e o montante de ajuda à produção para estas uvas secas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2172/92 de la Comisión, de 30 de julio de 1992, por
