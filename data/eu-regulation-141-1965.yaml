  content: Règlement n 141/65/CEE de la Commission, du 12 octobre 1965, relatif à
    la fixation des prix franco frontière en ce qui concerne les importations de
    lait et de produits laitiers en provenance des pays tiers et modifiant les règlements
    ns 156/64/CEE, 41/65/CEE et 42/65/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 141/65/EWG der Kommission vom 12. Oktober 1965 betreffend
    die Festsetzung der Preise frei Grenze für Einfuhren von Milch und Milcherzeugnissen
    aus dritten Ländern und zur Änderung der Verordnungen Nr. 156/64/EWG, Nr. 41/65/EWG
    und Nr. 42/65/EWG
  type: main
- language: it
  script: Latn
  content: Regolamento n. 141/65/CEE della Commissione, del 12 ottobre 1965, che fissa
    i prezzi franco frontiera all'importazione di latte e prodotti lattiero-caseari
    dai paesi terzi e che modifica i regolamenti nn. 156/64/CEE, 41/65/CEE e 42/65/CEE
  type: main
- language: nl
  script: Latn
  content: Verordening no. 141/65/EEG van de Commissie van 12 oktober 1965 betreffende
    de vaststelling van de prijzen franco-grens bij invoer van melk en zuivelprodukten
    uit derde landen en voorts houdende wijziging van de Verordeningen nos. 156/64/EEG,
    41/65/EEG en 42/65/EEG
