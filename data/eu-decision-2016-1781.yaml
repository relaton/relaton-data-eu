  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/1781 a Comisiei din 5 octombrie
    2016 de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește introducerea
    unei rubrici pentru Saint-Pierre și Miquelon în lista cu țări terțe sau părți
    ale acestora din care se autorizează introducerea în Uniune a produselor din
    carne și stomacuri, vezici și intestine tratate [notificată cu numărul C(2016)
    6287]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/1781 z 5. októbra 2016, ktorým
