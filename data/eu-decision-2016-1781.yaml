    af Saint-Pierre og Miquelon på listen over tredjelande eller dele af tredjelande,
    hvorfra det er tilladt at indføre kødprodukter og behandlede maver, blærer
    og tarme til Unionen (meddelt under nummer C(2016) 6287)
  type: main
- language: el
  script: Grek
