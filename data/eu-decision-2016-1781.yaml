    vonatkozó bejegyzéssel való kiegészülése tekintetében történő módosításáról
    (az értesítés a C(2016) 6287. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/1781 della Commissione, del 5 ottobre
    2016, che modifica l'allegato II della decisione 2007/777/CE per quanto riguarda
    l'inserimento di una voce relativa a Saint Pierre e Miquelon nell'elenco di paesi
    terzi o di parti di paesi terzi da cui è autorizzata l'introduzione nell'Unione
    di prodotti a base di carne e stomaci, vesciche e intestini trattati [notificata
    con il numero C(2016) 6287]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/1781 (2016. gada 5. oktobris),
    ar ko attiecībā uz ieraksta par Senpjēru un Mikelonu iekļaušanu to trešo
    valstu vai to daļu sarakstā, no kurām Savienībā atļauts ievest gaļas produktus
    un apstrādātus kuņģus, pūšļus un zarnas, groza Lēmuma 2007/777/EK II pielikumu
    (izziņots ar dokumenta numuru C(2016) 6287)
  type: main
- language: lt
  script: Latn
