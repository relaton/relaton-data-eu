title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/1781 of 5 October 2016 amending
    Annex II to Decision 2007/777/EC as regards inserting an entry for Saint Pierre
    and Miquelon in the list of third countries or parts thereof from which the introduction
    into the Union of meat products and treated stomachs, bladders and intestines
    is authorised (notified under document C(2016) 6287)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/1781 de la Commission du 5 octobre 2016
    modifiant l'annexe II de la décision 2007/777/CE en ce qui concerne l'inscription
    de Saint-Pierre-et-Miquelon sur la liste des pays tiers ou parties de pays tiers
    à partir desquels l'introduction dans l'Union de produits à base de viande et
    d'estomacs, vessies et boyaux traités est autorisée [notifiée sous le numéro
    C(2016) 6287]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/1781 der Kommission vom 5. Oktober 2016
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich der Aufnahme
    eines Eintrags für St. Pierre und Miquelon in die Liste der Drittländer bzw.
    der Teile von Drittländern, aus denen die Einfuhr von Fleischerzeugnissen und
    behandelten Mägen, Blasen und Därmen in die Europäische Union gestattet ist
    (Bekannt gegeben unter Aktenzeichen C(2016) 6287)
  type: main
- language: bg
  script: Cyrl
