  content: Council Regulation (EEC) No 2195/91 of 25 June 1991 amending Regulation
    (EEC) No 1408/71 on the application of social security schemes to employed persons,
    self- employed persons and members of their families moving within the Community
    and Regulation (EEC) No 574/72 laying down the procedure for implementing Regulation
    (EEC) No 1408/71
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2195/91 DU CONSEIL du 25 juin 1991 modifiant le règlement
    (CEE) no 1408/71 relatif à l'' application des régimes de sécurité sociale
    aux travailleurs salariés, aux travailleurs non salariés et aux membres de leur
    famille qui se déplacent à l'' intérieur de la Communauté, et le règlement
    (CEE) no 574/72 fixant les modalités d'' application du règlement (CEE) no 1408/71
    #'
