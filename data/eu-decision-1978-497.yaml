id: EUDecision1978497
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 May 1978 authorizing the Italian Republic not
    to apply Community treatment to synthetic textile fibres, acrylic, falling within
    subheading ex 56.04 A of the Common Customs Tariff (NIMEXE code 56.04-15), originating
    in Romania and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/497/CEE: Décision de la Commission, du 29 mai 1978, autorisant la
    République italienne à exclure du traitement communautaire les fibres textiles
    synthétiques acryliques de la position Ex 56.04 (code Nimexe 56.04-15) du Tarif
    douanier commun, originaires de Roumanie et mises en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. Mai 1978, mit der die Italienische
    Republik ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche synthetische Spinnstoffe, Polyacryl-Spinnfasern
    der Tarifnummer ex 56.04 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffer 56.04-15)
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 29. maj 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage syntetiske fibre af polyacryl,
    som henhører under pos. ex 56.04 A (NIMEXE-kode 56.04-15) i den fælles toldtarif,
    har oprindelse i Rumænien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 maggio 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le fibre tessili sintetiche
    acriliche della voce ex 56.04 della tariffa doganale comune (codice Nimexe 56.04-15),
    originarie della Romania e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 mei 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd synthetische vezels, acrylvezels, van post ex 56.04 A van het
    gemeenschappelijk douanetarief (NIMEXE-code 56.04-15), van oorsprong uit Roemenië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
