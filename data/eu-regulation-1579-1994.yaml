    van de heffing in de sector van op basis van groenten en fruit verwerkte produkten
    en in de wijnsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1579/94 da Comissão, de 30 de Junho de 1994, que
