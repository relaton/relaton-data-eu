title:
- language: en
  script: Latn
  content: '2012/102/EU: Commission Implementing Decision of 17 February 2012 amending
    Decision 2005/51/EC as regards the period during which soil contaminated by pesticides
    or persistent organic pollutants may be introduced into the Union for decontamination
    purposes (notified under document C(2012) 869)'
  type: main
- language: fr
  script: Latn
  content: '2012/102/UE: Décision d’exécution de la Commission du 17 février
    2012 modifiant la décision 2005/51/CE en ce qui concerne la période pendant
    laquelle de la terre contaminée par des pesticides ou des polluants organiques
    persistants peut être introduite dans l’Union européenne à des fins de décontamination
    [notifiée sous le numéro C(2012) 869]'
  type: main
- language: de
  script: Latn
  content: '2012/102/EU: Durchführungsbeschluss der Kommission vom 17. Februar 2012
    zur Änderung der Entscheidung 2005/51/EG hinsichtlich des Zeitraums, in dem von
    mit Pestiziden oder persistenten organischen Schadstoffen verseuchte Böden zu
    Dekontaminierungszwecken in die EU eingeführt werden dürfen (Bekanntgegeben
    unter Aktenzeichen K(2012) 869)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/102/ЕС: Решение за изпълнение на Комисията
    от 17 февруари 2012 година за изменение на Решение
    2005/51/ЕО по отношение на периода, през който
    в Съюза може да бъде внасяна почва, заразена
    с пестициди или устойчиви органични замърсители,
    с цел обеззаразяване (нотифицирано под номер
    C(2012) 869)'
  type: main
- language: cs
  script: Latn
  content: '2012/102/EU: Prováděcí rozhodnutí Komise ze dne 17. února 2012 ,
    kterým se mění rozhodnutí 2005/51/ES, pokud jde o období, během něhož
    může být zemina zamořená pesticidy nebo perzistentními organickými znečišťujícími
    látkami dovážena do Unie za účelem dekontaminace (oznámeno pod číslem
    K(2012) 869)'
  type: main
- language: da
  script: Latn
  content: '2012/102/EU: Kommissionens gennemførelsesafgørelse af 17. februar 2012
    om ændring af beslutning 2005/51/EF for så vidt angår den periode, hvor jord
    forurenet med pesticider eller persistente organiske miljøgifte må indføres
    i Unionen med henblik på rensning (meddelt under nummer K(2012) 869)'
  type: main
- language: el
  script: Grek
  content: '2012/102/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 17ης Φεβρουαρίου 2012 , για την τροποποίηση
    της απόφασης 2005/51/ΕΚ όσον αφορά την περίοδο
    κατά τη διάρκεια της οποίας μπορεί να εισαχθεί
    στην Ένωση χώμα μολυσμένο από παρασιτοκτόνα
    ή από ανθεκτικούς οργανικούς ρύπους προς απομόλυνση
    [κοινοποιηθείσα υπό τον αριθμό Ε(2012) 869]'
  type: main
- language: et
  script: Latn
  content: '2012/102/EL: Komisjoni rakendusotsus, 17. veebruar 2012 , millega muudetakse
    otsust 2005/51/EÜ seoses ajavahemikuga, mille jooksul tohib tuua Euroopa Liitu
    pestitsiidide või püsivate orgaaniliste saasteainetega saastunud pinnast saastest
    puhastamise eesmärgil (teatavaks tehtud numbri K(2012) 869 all)'
  type: main
- language: fi
  script: Latn
  content: '2012/102/EU: Komission täytäntöönpanopäätös, annettu 17 päivänä
    helmikuuta 2012 , päätöksen 2005/51/EY muuttamisesta siltä osin kuin on kyse
    ajanjaksosta, jonka kuluessa torjunta-aineiden tai pysyvien orgaanisten yhdisteiden
    saastuttamaa maa-ainesta saa tuoda unioniin dekontaminaatiotarkoituksiin (tiedoksiannettu
    numerolla K(2012) 869)'
  type: main
- language: hr
  script: Latn
  content: '2012/102/EU: Provedbena Odluka Komisije od 17. veljače 2012. o izmjeni
    Odluke 2005/51/EZ u pogledu razdoblja tijekom kojeg tlo kontaminirano pesticidima
    ili postojanim organskim onečišćujućim tvarima smije biti uneseno u Uniju
    za potrebe dekontaminacije (priopćena pod brojem dokumenta C(2012) 869)'
  type: main
- language: hu
  script: Latn
  content: '2012/102/EU: A Bizottság végrehajtási határozata ( 2012. február
    17. ) a 2005/51/EK határozatnak a peszticidek és a környezetben tartósan megmaradó
    szerves szennyező anyagok által szennyezett talajnak az Unióba, dekontaminálás
    céljára történő behozatalára engedélyezett időszak tekintetében történő
    módosításáról (az értesítés a C(2012) 869. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2012/102/UE: Decisione di esecuzione della Commissione, del 17 febbraio
    2012 , che modifica la decisione 2005/51/CE concernente il periodo in cui è possibile
    importare nell’Unione a scopo di decontaminazione terra contaminata da antiparassitari
    o da inquinanti organici persistenti [notificata con il numero C(2012) 869]'
  type: main
- language: lv
  script: Latn
  content: '2012/102/ES: Komisijas Īstenošanas lēmums ( 2012. gada 17. februāris
    ), ar ko groza Lēmumu 2005/51/EK attiecībā uz periodu, kurā Savienībā var
    ievest augsni, kas ir piesārņota ar pesticīdiem vai noturīgiem organiskiem
    piesārņotājiem, atsārņošanas nolūkā (izziņots ar dokumenta numuru C(2012)
    869)'
  type: main
- language: lt
  script: Latn
  content: '2012/102/ES: 2012 m. vasario 17 d. Komisijos įgyvendinimo sprendimas,
    kuriuo dėl laikotarpio, kuriuo į Sąjungą leidžiama įvežti pesticidais ir
    patvariais organiniais teršalais užterštą dirvožemį, siekiant jį nukenksminti,
    iš dalies keičiamas Sprendimas 2005/51/EB (pranešta dokumentu Nr. C(2012) 869)'
  type: main
- language: mt
  script: Latn
  content: '2012/102/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tas- 17
