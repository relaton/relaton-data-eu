    fih il-ħamrija li hija kkontaminata mill-pestiċidi jew minn sustanzi organiċi
    persistenti li jniġġsu, jistgħu jiġu introdotti fl-Unjoni għall-għanijiet
    ta’ dekontaminazzjoni (notifikata bid-dokument numru C(2012) 869)'
  type: main
- language: nl
  script: Latn
  content: '2012/102/EU: Uitvoeringsbesluit van de Commissie van 17 februari 2012
    tot wijziging van Beschikking 2005/51/EG wat betreft de periode waarin door bestrijdingsmiddelen
    of persistente organische verontreinigende stoffen verontreinigde grond met het
    oog op reiniging in de Unie mag worden binnengebracht (Kennisgeving geschied onder
    nummer C(2012) 869)'
  type: main
- language: pl
  script: Latn
  content: '2012/102/UE: Decyzja wykonawcza Komisji z dnia 17 lutego 2012 r. zmieniająca
    decyzję 2005/51/WE w odniesieniu do okresu, w jakim można wprowadzać do Unii
    glebę skażoną pestycydami lub trwałymi zanieczyszczeniami organicznymi w celu
    jej odkażenia (notyfikowana jako dokument nr C(2012) 869)'
  type: main
- language: pt
  script: Latn
  content: '2012/102/UE: Decisão de Execução da Comissão, de 17 de fevereiro de
    2012 , que altera a Decisão 2005/51/CE no que diz respeito ao período durante
    o qual pode ser introduzido na União, para efeitos de descontaminação, solo
    contaminado com pesticidas ou poluentes orgânicos persistentes [notificada com
    o número C(2012) 869]'
  type: main
- language: ro
  script: Latn
  content: '2012/102/UE: Decizia de punere în aplicare a Comisiei din 17 februarie
    2012 de modificare a Deciziei 2005/51/CE cu privire la perioada în care pământul
    contaminat cu pesticide sau cu poluanți organici persistenți poate fi introdus
    în Uniune în scopul decontaminării [notificată cu numărul C(2012) 869]'
  type: main
- language: sk
  script: Latn
  content: '2012/102/EÚ: Vykonávacie rozhodnutie Komisie zo 17. februára 2012 ,
    ktorým sa mení a dopĺňa rozhodnutie 2005/51/ES, pokiaľ ide o obdobie, počas
    ktorého sa pôda kontaminovaná pesticídmi alebo perzistentnými organickými
    látkami môže dovážať do Únie na účely dekontaminácie [oznámené pod
    číslom K(2012) 869]'
  type: main
- language: sl
  script: Latn
  content: '2012/102/EU: Izvedbeni sklep Komisije z dne 17. februarja 2012 o spremembi
    Odločbe 2005/51/ES glede obdobja, v katerem se lahko za namene dekontaminacije
    v Unijo vnaša zemlja, onesnažena s pesticidi ali težko razgradljivimi organskimi
    snovmi (notificirano pod dokumentarno številko C(2012) 869)'
  type: main
- language: es
  script: Latn
  content: '2012/102/UE: Decisión de Ejecución de la Comisión, de 17 de febrero
    de 2012 , por la que se modifica la Decisión 2005/51/CE en lo que respecta al
    período durante el cual puede introducirse en la Unión tierra contaminada con
    plaguicidas o contaminantes orgánicos persistentes a efectos de su descontaminación
    [notificada con el número C(2012) 869]'
  type: main
- language: sv
  script: Latn
  content: '2012/102/EU: Kommissionens genomförandebeslut av den 17 februari 2012
    om ändring av beslut 2005/51/EG vad gäller den period under vilken jord som
    förorenats av bekämpningsmedel eller långlivade organiska föroreningar får
    föras in till unionen för dekontaminering [delgivet med nr K(2012) 869]'
