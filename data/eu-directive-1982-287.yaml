    rostlin na trh a směrnice 78/386/EHS a 78/388/EHS
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 82/287/EØF af 13. april 1982 om ændring af bilagene
    til Rådets direktiv 66/401/EØF og 69/208/EØF om handel med frø henholdsvis
    af foderplanter og af olie- og spindplanter, samt om ændring af direktiv 78/386/EØF
    og 78/388/EØF
  type: main
- language: el
