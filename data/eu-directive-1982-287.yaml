    à comercialização de sementes de plantas forrageiras e à comercialização
    de plantas oleaginosas e de fibras, bem como as Directivas 78/386/CEE e 78/388/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva Comisiei din 13 aprilie 1982 de modificare a anexelor la Directivele
    66/401/CEE și 69/208/CEE ale Consiliului privind comercializarea semințelor
    de plante furajere și comercializarea semințelor de plante oleaginoase și pentru
    fibră, precum și a Directivelor 78/386/CEE și 78/388/CEE
  type: main
- language: sk
