    het in de handel brengen van zaaizaad van groenvoedergewassen, respectievelijk
    zaaizaad van oliehoudende planten en vezelgewassen, en tot wijziging van de Richtlijnen
    78/386/EEG en 78/388/EEG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji z dnia 13 kwietnia 1982 r. zmieniająca załączniki
