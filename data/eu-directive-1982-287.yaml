    és 69/208/EGK tanácsi irányelv mellékleteinek, valamint a 78/386/EGK és 78/388/EGK
    irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 82/287/CEE della Commissione, del 13 aprile 1982, che modifica
