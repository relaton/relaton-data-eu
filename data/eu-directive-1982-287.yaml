title:
- language: en
  script: Latn
  content: Commission Directive 82/287/EEC of 13 April 1982 amending the Annexes to
    Council Directives 66/401/EEC and 69/208/EEC on the marketing of fodder plant
    seed and seed of oil and fibre plants respectively, and Directives 78/386/EEC
    and 78/388/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 82/287/CEE de la Commission, du 13 avril 1982, modifiant les
    annexes des directives 66/401/CEE et 69/208/CEE du Conseil concernant respectivement
    la commercialisation des semences de plantes fourragères et la commercialisation
    des semences de plantes oléagineuses et à fibres, ainsi que les directives 78/386/CEE
    et 78/388/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 82/287/EWG der Kommission vom 13. April 1982 zur Änderung der
    Anlagen der Richtlinien 66/401/EWG und 69/208/EWG des Rates über den Verkehr
    mit Futterpflanzensaatgut und Saatgut von Öl- und Faserpflanzen sowie zur Änderung
    der Richtlinien 78/386/EWG und 78/388/EWG
  type: main
- language: bg
  script: Cyrl
  content: Директива на Комисията от 13 април 1982 година
    за изменение на приложенията към Директиви
    66/401/ЕИО и 69/208/ЕИО на Съвета съответно относно
    търговията със семена от фуражни култури и
    със семена от маслодайни и влакнодайни култури
    и на Директиви 78/386/ЕИО и 78/388/ЕИО
  type: main
- language: cs
  script: Latn
