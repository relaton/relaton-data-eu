    siewnym roślin pastewnych oraz materiałem siewnym roślin oleistych i włóknistych
    oraz dyrektywy 78/386/EWG i 78/388/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 82/287/CEE da Comissão, de 13 de Abril de 1982, que altera os
