    προς σπορά κτηνοτροφικών, ελαιούχων και κλωστικών
    φυτών, καθώς και περί τροποποίησης των οδηγιών
    78/386/EOK και 78/388/EOK
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv, 13. aprill 1982, millega muudetakse nõukogu direktiivide
