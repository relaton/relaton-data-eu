    kiudtaimede seemnete turustamise kohta) lisasid ning direktiive 78/386/EMÜ ja
    78/388/EMÜ (82/287/EMÜ)
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 82/287/ETY, annettu 13 päivänä huhtikuuta 1982,
    rehukasvien sekä öljy- ja kuitukasvien siementen pitämisestä kaupan annettujen
    neuvoston direktiivien 66/401/ETY ja 69/208/ETY sekä direktiivien 78/386/ETY
    ja 78/388/ETY liitteiden muuttamisesta
  type: main
