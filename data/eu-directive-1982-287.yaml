    krmnog bilja te sjemena uljarica i predivog bilja i direktiva 78/386/EEZ i 78/388/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság irányelve (1982. április 13.) a takarmánynövény-vetőmagok
