title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 novembre 1970, modifiant sa décision
    du 5 novembre 1970 relative à l'application de mesures de protection par l'Italie
    lors de l'importation de montures pour parapluies, de la position 66.03 B du Tarif
    douanier commun, originaires du Japon et mises en libre pratique dans d'autres
    États membres
  type: main
- language: de
  script: Latn
  content: '70/520/EWG: Entscheidung der Kommission vom 24. November 1970 in Abänderung
    der Entscheidung vom 5. November 1970 zur Ermächtigung der Italienischen Republik,
    bei der Einfuhr von aus Japan stammenden und in den übrigen Mitgliedstaaten im
    freien Verkehr befindlichen Schirmgestellen der Tarifnummer 66.03 B des Gemeinsamen
    Zolltarifs Schutzmaßnahmen zu ergreifen'
  type: main
- language: it
  script: Latn
  content: '70/520/CEE: Decisione della Commissione, del 24 novembre 1970, che modifica
    la decisione del 5 novembre 1970 relativa all''applicazione di misure di protezione
    da parte dell''Italia all''importazione di montature per ombrelli, della voce
    66.03 B della tariffa doganale comune, originarie del Giappone e messe in libera
    pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/520/EEG: Beschikking van de Commissie van 24 november 1970 waarbij
    de beschikking van 5 november 1970 betreffende de toepassing van beschermende
    maatregelen door Italië gedurende de invoer van frames voor paraplu''s van post
    66.03 B van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in
    de overige Lid-Staten in het vrije verkeer gebracht, wordt gewijzigd'
  type: main
