title:
- language: en
  script: Latn
  content: '83/306/EEC: Commission Decision of 16 June 1983 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of low
    carbon ferro-chromium originating in South Africa, Sweden, Turkey and Zimbabwe,
    and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '83/306/CEE: Décision de la Commission du 16 juin 1983 portant acceptation
    d'' engagements souscrits dans le cadre de la procédure anti-"dumping" concernant
    les importations de ferrochrome à faible teneur en carbone, originaires d'' Afrique
    du Sud, de Suède, de Turquie et du Zimbabwe, et portant clôture de cette procédure'
  type: main
- language: de
  script: Latn
