    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von Ferrochrom mit niedrigem Kohlenstoffgehalt mit Ursprung in Südafrika, Schweden,
    der Türkei und Simbabwe und über die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '83/306/EØF: Kommissionens afgørelse af 16. juni 1983 om godtagelse af
