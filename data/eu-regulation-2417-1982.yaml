title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2417/82 of 3 September 1982 introducing
    retrospective Community surveillance of imports of certain textile products originating
    in Tunisia and Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2417/82 de la Commission, du 3 septembre 1982, instaurant
    une surveillance communautaire "a posteriori" des importations de certains produits
    textiles originaires de Tunisie et du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2417/82 der Kommission vom 3. September 1982 zur Einführung
    einer nachträglichen gemeinschaftlichen Überwachung der Einfuhren bestimmter
    Textilwaren mit Ursprung in Tunesien und Marokko
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2417/82 af 3. september 1982 om indførelse
    af et efterfølgende fællesskabstilsyn med indførselen af visse tekstilvarer
    med oprindelse i Tunesien og Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2417/82 τής Επιτροπής
    τής 3ης Σεπτεμβρίου 1982 περί θεσπίσεως κοινοτικής
    επιβλέψεως εκ τών υστέρων τών εισαγωγών ορισμένων
    κλωστοϋφαντουργικών προϊόντων καταγωγής Τυνησίας
    καί Μαρόκου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2417/82 della Commissione, del 3 settembre 1982, che
    istituisce una sorveglianza comunitaria a posteriori sulle importazioni di taluni
    prodotti tessili originari della Tunisia e del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2417/82 van de Commissie van 3 september 1982 houdende
    instelling van communautair toezicht a posteriori op de invoer van bepaalde textielprodukten
    van oorsprong uit Tunesië en Marokko
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2417/82 da Comissão, de 3 de Setembro de 1982,
    que instaura uma vigilância comunitária a posteriori das importações de certos
    produtos têxteis originários da Tunísia e de Marrocos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2417/82 de la Comisión, de 3 de septiembre de 1982,
    por el que se establece una vigilancia comunitaria a posteriori de las importaciones
    de determinados productos textiles originarios de Túnez y Marruecos
