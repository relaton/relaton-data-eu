title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2797/83 of 6 October 1983 re-establishing
    the levying of customs duties on other footwear, falling within subheading 64.02
    B and originating in the Philippines, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2797/83 de la Commission du 6 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables aux autres chaussures,
    de la sous-position 64.02 B du tarif douanier commun, originaires des Philippines,
    bénéficiaire des préférences tarifaires par le règlement (CEE) no 3377/82
    du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2797/83 der Kommission vom 6. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für andere Schuhe der Tarifstelle 64.02 B, mit Ursprung
    in den Philippinen, denen die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2797/83 af 6. oktober 1983 om genindførelse
    af opkrævning af told for andet fodtøj, henhørende under pos. 64.02 B og med
    oprindelse i Filippinerne, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2797/83 της Επιτροπής
    της 6ης Οκτωβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για έτερα υποδήματα της
    διακρίσεως 64.02 Β του Κοινού Δασμολογίου, καταγωγής
    Φιλιππίνων, δικαιούχου των προβλεπομένων από
    τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2797/83 della Commissione del 6 ottobre 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle altre calzature della sottovoce
    64.02 B della tariffa doganale comune, originarie delle Filippine beneficiarie
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2797/83 van de Commissie van 6 oktober 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander schoeisel,
    van postonderverdeling 64.02 B, van oorsprong uit de Filippijnen, waarvoor de
    in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
