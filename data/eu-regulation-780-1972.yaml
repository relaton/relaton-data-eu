  content: Regulation (EEC) No 780/72 of the Council of 17 April 1972 suspending the
    autonomous Common Customs Tariff duty on sweet oranges, fresh, falling within
    subheading No ex 08.02 A I (a) and on grapefruit falling within subheading No
    08.02 D
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 780/72 du Conseil, du 17 avril 1972, portant suspension
