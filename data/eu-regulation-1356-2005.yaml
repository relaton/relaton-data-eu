  script: Latn
  content: Commission Regulation (EC) No 1356/2005 of 18 August 2005 amending Annex
    I to Council Regulation (EEC) No 2377/90 laying down a Community procedure for
    the establishment of maximum residue limits of veterinary medicinal products in
    foodstuffs of animal origin, as regards oxolinic acid and morantel
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CE) n° 1356/2005 de la Commission du 18 août 2005 modifiant
