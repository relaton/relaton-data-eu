title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3408/90 of 27 November 1990 re-establishing
    the levying of the customs duties applicable to the products of the CN codes 3903,
    3915 20 00, 3920 30 00 and 3920 99 50 originating in Mexico, to which the preferential
    arrangements of Council Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3408/90 de la Commission du 27 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 3903, 3915 20 00, 3920 30 00 et 3920 99 50 originaires du Mexique,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3408/90 DER KOMMISSION vom 27. November 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer die Waren der KN-Codes 3903, 3915 20 00, 3920 30
    00 und 3920 99 50 mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr.
    3896/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3408/90 af 27. november 1990 om genindførelse
