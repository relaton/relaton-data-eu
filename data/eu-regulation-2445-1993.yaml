  content: COMMISSION REGULATION (EEC) No 2445/93 of 1 September 1993 re-establishing
    the levying of customs duties on products of categories 47, 86 and 90 (order Nos
    40.0470, 40.0860 and 40.0900), originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2445/93 de la Commission du 1er septembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 47, 86 et 90 (numéros d'ordre 40.0470, 40.0860 et 40.0900) originaires
    de Chine, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
