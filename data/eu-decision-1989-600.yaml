title:
- language: en
  script: Latn
  content: '89/600/EEC: Commission Decision of 10 November 1989 authorizing Belgium
    provisionally to provide for derogations from certain provisions of Council Directive
    77/93/EEC, in respect of plants of Juniperus L. and Pinus L., originating in Japan
    (only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/600/CEE: Décision de la Commission du 10 novembre 1989 autorisant
    la Belgique à prévoir provisoirement des dérogations à certaines dispositions
    de la directive 77/93/CEE pour les végétaux de Juniperus L. et de Pinus L. originaires
    du Japon (Les textes en langues française et néerlandaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 10. November 1989 zur Ermächtigung Belgiens,
    für Pflanzen von Juniperus L. und Pinus L. mit Ursprung in Japan vorübergehend
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen
    (Nur der französische und der niederländische Text sind verbindlich) (89/600/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 10. november 1989 om midlertidig bemyndigelse
    af Belgien til at undtage planter af Juniperus L. og Pinus L. med oprindelse i
    Japan fra visse bestemmelser i Rådets direktiv 77/93/EØF (Kun den franske og
    den nederlandske udgave er autentisk) (89/600/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/600/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Νοεμβρίου 1989 που επιτρέπει στο Βέλγιο να προβλέπει
    προσωρινά παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου όσον αφορά
    τα φυτά του είδους Juniperus L. και Pinus L., καταγωγής
    Ιαπωνίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 10 novembre 1989 che autorizza il Belgio
    a stabilire provvisoriamente deroghe a determinate disposizioni della direttiva
    77/93/CEE del Consiglio per quanto riguarda i vegetali di Juniperus L. e di Pinus
    L. originari del Giappone (I testi in lingua francese e olandese sono i soli facenti
    fede) (89/600/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 10 november 1989 tot machtiging van België
    om voor planten van Juniperus L. en Pinus L., van oorsprong uit Japan, voorlopig
    afwijkingen toe te staan van sommige bepalingen van Richtlijn 77/93/EEG van de
    Raad (Slechts de teksten in de Nederlandse en de Franse taal zijn authentiek)
    (89/600/EEG) #'
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 10 de Novembro de 1989 que autoriza a Bélgica a
    prever provisoriamente derrogaçoes de determinadas disposiçoes da Directiva
    77/93/CEE do Conselho, em relaçao a plantas de Juniperus L. e Pinus L., originarias
    do Japao
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 10 de noviembre de 1989 por la que se autoriza
    a Bélgica para establecer provisionalmente excepciones a determinadas disposiciones
    de la Directiva 77/93/CEE del Consejo, en relación con ejemplares de las plantas
    Juniperus L. y Pinus L. originarios de Japón (Los textos en lengua francesa y
    neerlandesa son los únicos auténticos) (89/600/CEE) #'
