    od obale i minimalne dubine mora za potegače otvorenog mora koje love hujice
    (Gymnammodytes cicerelus i G. semisquamatus) i glavoče (Aphia minuta i Crystallogobius
    linearis) u određenim teritorijalnim vodama Španjolske (Katalonija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/2085 végrehajtási rendelete (2026. szeptember
