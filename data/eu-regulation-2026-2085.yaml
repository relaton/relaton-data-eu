    minimalnych odległości od brzegu i minimalnej głębokości morza przy połowach
    dobijakowatych (Gymnammodytes cicerelus i G. semisquamatus) oraz babkowatych (Aphia
    minuta i Crystallogobius linearis) niewodami pełnomorskimi na niektórych wodach
