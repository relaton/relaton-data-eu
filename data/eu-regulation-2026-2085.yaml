    (CE) n.o 1967/2006 del Consejo en lo concerniente a la distancia mínima de la
    costa y la profundidad marina mínima para la pesca de lanzones (Gymnammodytes
    cicerelus y G. semisquamatus) y góbidos (Aphia minuta y Crystallogobius linearis)
