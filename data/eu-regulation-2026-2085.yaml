    no respeitante à distância mínima da costa e à profundidade mínima para as
    redes envolventes-arrastantes de alar para bordo utilizadas na pesca de galeota
    (Gymnammodytes cicerelus e G. semisquamatus) e de cabozes (Aphia minuta e Crystallogobius
    linearis) em determinadas águas territoriais de Espanha (Catalunha)
  type: main
