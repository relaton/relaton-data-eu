title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/2085 of 18 September 2026
    extending a derogation from Council Regulation (EC) No 1967/2006 as regards the
    minimum distance from the coast and the minimum sea depth for boat seines fishing
    for sand eel (Gymnammodytes cicerelus and G. semisquamatus) and gobies (Aphia
    minuta and Crystallogobius linearis) in certain territorial waters of Spain (Catalonia)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/2085 de la Commission du 18 septembre
    2026 portant prolongation de la dérogation au règlement (CE) no 1967/2006 du
    Conseil en ce qui concerne la distance de la côte et la profondeur minimales
    pour les sennes de bateau pêchant le lançon (Gymnammodytes cicerelus et G. semisquamatus)
    et les gobies (Aphia minuta et Crystallogobius linearis) dans certaines eaux territoriales
    de l’Espagne (Catalogne)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/2085 der Kommission vom 18. September
    2026 zur Verlängerung einer Abweichung von der Verordnung (EG) Nr. 1967/2006
    des Rates hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe
    für Bootswaden für den Fang von Sandaal (Gymnammodytes cicerelus und G. semisquamatus)
    und Grundeln (Aphia minuta und Crystallogobius linearis) in bestimmten Hoheitsgewässern
    Spaniens (Katalonien)
  type: main
- language: bg
  script: Cyrl
