    ta’ Settembru 2026 li jestendi deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tad-distanza minima mill-kosta u l-fond minimu tal-baħar għat-tartaruni
    li jistadu għaċ-ċiċċirell (Gymnammodytes cicerelus u G. semisquamatus) u
    għall-gobi (Aphia minuta u Crystallogobius linearis) f’ċerti ibħra territorjali
