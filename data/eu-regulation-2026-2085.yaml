    (Katalónia) a homoki angolna (Gymnammodytes cicerelus és G. semisquamatus) és
    a gébfélék (Aphia minuta és Crystallogobius linearis) halászatában alkalmazott,
    hajóról működtetett kerítőhálók telepítésének a parttól számított
    legkisebb távolsága és legkisebb mélysége tekintetében történő eltérés
    meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2026/2085 della Commissione, del 18 settembre
    2026, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto riguarda la distanza minima dalla costa e la profondità minima per le
    sciabiche da natante utilizzate per la pesca del cicerello (Gymnammodytes cicerelus
    e Gymnammodytes semisquamatus) e del ghiozzo (Aphia minuta e Crystallogobius linearis)
    in talune acque territoriali della Spagna (Catalogna)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2026/2085 (2026. gada 18. septembris),
    ar kuru attiecībā uz minimālo attālumu no krasta un minimālo dziļumu, kas
    noteiktos Spānijas (Katalonijas) teritoriālajos ūdeņos jāievēro tūbīšu
    (Gymnammodytes cicerelus un G. semisquamatus) un jūrasgrunduļu (Aphia minuta
    un Crystallogobius linearis) zvejā ar laivas velkamajiem vadiem, pagarina atkāpi
    no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2026 m. rugsėjo 18 d. Komisijos įgyvendinimo reglamentas (ES) 2026/2085,
    kuriuo pratęsiamas nuostatos, leidžiančios nukrypti nuo Tarybos reglamento
    (EB) Nr. 1967/2006 nuostatų dėl minimalaus atstumo nuo kranto ir minimalaus
    jūros gylio reikalavimų, taikomos laivų traukiamaisiais tinklais žvejojant
    tobines (Gymnammodytes cicerelus ir G. semisquamatus) ir afijas (Aphia minuta
    ir Crystallogobius linearis) tam tikruose Ispanijos (Katalonijos) teritoriniuose
    vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
