  content: Kommissionens genomförandeförordning (EU) 2026/2085 av den 18 september
    2026 om förlängning av ett undantag från rådets förordning (EG) nr 1967/2006
    vad gäller minimiavstånd från kusten och minimidjup för fiske med fartygsvad/not
    efter tobisfiskar (Gymnammodytes cicerelus och G. semisquamatus) och smörbultar
    (Aphia minuta och Crystallogobius linearis) i vissa territorialvatten i Spanien
