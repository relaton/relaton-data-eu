    roller chains for cycles originating in the People'' s Republic of China and terminating
    that investigation'
  type: main
- language: fr
  script: Latn
  content: '86/33/CEE: Décision de la Commission du 13 février 1986 portant acceptation
    d''un engagement souscrit dans le cadre de l''enquête antidumping concernant
    les importations de chaînes à rouleaux pour cycles originaires de la République
    populaire de Chine et portant clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: '86/33/EWG: Beschluß der Kommission vom 13. Februar 1986 über die Annahme
    einer Verpflichtung im Rahmen eines Antidumpingverfahrens betreffend die Einfuhren
    von Rollenketten für Fahrräder mit Ursprung in der Volksrepublik China und über
    die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '86/33/EØF: Kommissionens afgørelse af 13. februar 1986 om godtagelse
