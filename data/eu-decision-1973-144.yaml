---
id: EUDecision1973144
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 May 1973 authorizing the French Republic not
    to apply Community treatment to garments and articles of textiles other than cotton,
    falling within headings Nos ex 60.05, ex 61.01, ex 61.02 and ex 61.03 of the Common
    Customs Tariff, originating in South Korea and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission 73/144/CEE, du 11 mai 1973, autorisant la République
    française à exclure du traitement communautaire les vêtements et articles confectionnés
    en matières textiles autres que le coton, des positions Ex 60.05, Ex 61.01, Ex
    61.02 et Ex 61.03 du Tarif douanier commun, originaires de Corée du Sud et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. Mai 1973, mit der die Französische
    Republik ermächtigt wird, aus Süd-Korea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung und konfektionierte Waren aus anderen
    Spinnstoffen als aus Baumwolle der Tarifnummern ex 60.05, ex 61.01, ex 61.02 und
    ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 11. maj 1973 om bemyndigelse for Den franske
    Republik til fra fælleskabsbehandling at undtage beklædningsgenstande og konfektionerede
    tekstilvarer position ex 60.05, ex 61.01, ex 61.02, ex 61.03 i den fælles toldtarif,
    har oprindelse i Sydkorea og overgår til fri omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 maggio 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti e manufatti confezionati
    di materie tessili diverse dal cotone delle voci nn. ex 60.05, ex 61.01, ex 61.02
    e ex 61.03 della tariffa doganale comune, originari della Corea del Sud e messi
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 mei 1973 waarbij de Franse Republiek
    wordt gemachtigd kleding en geconfectioneerde artikelen, uit textielstoffen andere
    dan katoen, van de posten ex 60.05, ex 61.01, ex 61.02 en ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
