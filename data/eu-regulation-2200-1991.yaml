type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2200/91 of 22 July 1991 amending for the fifth
    time Regulation (EEC) No 1873/84 authorizing the offer or disposal for direct
    consumption of certain imported wines which may have undergone oenological processes
    not provided for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2200/91 DU CONSEIL du 22 juillet 1991 portant cinquième
    modification du règlement (CEE) no 1873/84 autorisant l'' offre et la livraison
    à la consommation humaine directe de certains vins importés susceptibles d''
    avoir fait l'' objet de pratiques oenologiques non prévues par le règlement
    (CEE) no 822/87 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2200/91 DES RATES vom 22. Juli 1991 zur fünften
    Änderung der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder
    der Abgabe zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten
    Weinen, bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung
    (EWG) Nr. 822/87 nicht vorgesehenen önologischen Verfahren waren #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2200/91 af 22. juli 1991 om femte ændring
    af forordning (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til
    direkte konsum af visse indførte vine, som eventuelt har været underkastet andre
    ønologiske fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2200/91 του Συμβουλίου
    της 22ας Ιουλίου 1991 για την πέμπτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει
    την προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγόμενων οίνων δυνάμενων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    (ΕΟΚ) αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2200/91 DEL CONSIGLIO del 22 luglio 1991 recante
    quinta modifica del regolamento (CEE) n. 1873/84 che autorizza l'' offerta e la
    consegna per il consumo umano diretto di taluni vini importati che possono essere
    stati sottoposti a pratiche enologiche non previste dal regolamento (CEE) n. 822/87
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2200/91 VAN DE RAAD van 22 juli 1991 tot vijfde
    wijziging van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding
    of levering voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen
    waarop oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij
    Verordening (EEG) nr. 822/87 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2200/91 DO CONSELHO de 22 de Julho de 1991 que altera
    pela quinta vez o Regulamento (CEE) no 1873/84, que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptíveis de terem
    sido objecto de práticas enológicas não previstas no Regulamento (CEE) no 822/87
    #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2200/91 DEL CONSEJO de 22 de julio de 1991 que modifica,
    por quinta vez, el Reglamento (CEE) no 1873/84 por el que se autoriza la oferta
    y la entrega al consumo humano directo de determinados vinos importados que pueden
    haber sido sometidos a prácticas enológicas no previstas en el Reglamento (CEE)
    no 822/87 #'
  type: main
