title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1158/2000 of 30 May 2000 repealing Regulation
    (EC) No 1781/1999 suspending the import quota for milk powder for the Dominican
    Republic and derogating from certain provisions of Regulation (EC) No 174/1999
    laying down detailed rules for the application of Council Regulation (EEC) No
    804/68 as regards export licences and export refunds in the case of milk and milk
    products and Regulation (EEC) No 3719/88 laying down common detailed rules for
    the application of the system of import and export licences and advance fixing
    certificates for agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1158/2000 de la Commission du 30 mai 2000 abrogeant
    le règlement (CE) nº 1781/1999 portant suspension du contingent d'importation
    de lait en poudre destiné à la République dominicaine et dérogeant à certaines
    dispositions du règlement (CE) nº 174/1999 établissant les modalités particulières
    d'application du règlement (CEE) nº 804/68 du Conseil en ce qui concerne les
    certificats d'exportation et des restitutions à l'exportation dans le secteur
    du lait et des produits laitiers ainsi que du règlement (CEE) nº 3719/88 portant
    modalités communes d'application du régime des certificats d'importation, d'exportation
    et de préfixation pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1158/2000 der Kommission vom 30. Mai 2000 zur Aufhebung
    der Verordnung (EG) Nr. 1781/1999 zur Aussetzung des Kontingents für die Einfuhr
    von Milchpulver in die Dominikanische Republik und zur Abweichung von der Verordnung
    (EG) Nr. 174/1999 mit besonderen Durchführungsvorschriften zur Verordnung (EWG)
    Nr. 804/68 des Rates im Hinblick auf die Ausfuhrlizenzen und die Ausfuhrerstattungen
    im Sektor Milch und Milcherzeugnisse sowie von der Verordnung (EWG) Nr. 3719/88
    über gemeinsame Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen
    sowie Vorausfestsetzungsbescheinigungen für landwirtschaftliche Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1158/2000 af 30. maj 2000 om ophævelse
    af forordning (EF) nr. 1781/1999 om suspension af importkontingentet for mælkepulver
    bestemt til Den Dominikanske Republik og om fravigelse af visse bestemmelser i
    forordning (EF) nr. 174/1999 om særlige gennemførelsesbestemmelser til Rådets
    forordning (EØF) nr. 804/68 for så vidt angår anvendelsen af eksportlicenser
    og eksportrestitutioner for mælk og mejeriprodukter og af forordning (EØF) nr.
    3719/88 om fælles gennemførelsesbestemmelser for import- og eksportlicenser
    samt forudfastsættelsesattester for landbrugsprodukter
  type: main
- language: el
  script: Grek
