  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1158/2000, annettu 30 päivänä toukokuuta 2000,
    Dominikaaniseen tasavaltaan tarkoitettua maitojauhetta koskevan tuontikiintiön
    soveltamisen keskeyttämisestä annetun asetuksen (EY) N:o 1781/1999 kumoamisesta,
    neuvoston asetuksen (EY) N:o 804/68 soveltamista koskevista yksityiskohtaisista
    erityissäännöistä maito- ja maitotuotealan vientitodistusten ja vientitukien
    osalta annetun asetuksen (EY) N:o 174/1999 tietyistä säännöksistä poikkeamisesta
    sekä maataloustuotteiden tuonti-, vienti- ja ennakkovahvistustodistusten järjestelmän
    soveltamista koskevista yhteisistä yksityiskohtaisista säännöistä annetun
    asetuksen (ETY) N:o 3719/88 tietyistä säännöksistä poikkeamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1158/2000 della Commissione, del 30 maggio 2000, recante
    abrogazione del regolamento (CE) n. 1781/1999 che sospende il contingente d'importazione
    di latte in polvere destinato alla Repubblica dominicana e deroga ad alcune disposizioni
    del regolamento (CE) n. 174/1999, recante modalità particolari di applicazione
    del regolamento (CEE) n. 804/68 del Consiglio riguardo ai titoli di esportazione
    e alle restituzioni all'esportazione nel settore del latte e dei prodotti lattiero-caseari,
    nonché del regolamento (CEE) n. 3719/88 che stabilisce le modalità comuni d'applicazione
    del regime dei titoli d'importazione, di esportazione e di fissazione anticipata
    relativi ai prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1158/2000 van de Commissie van 30 mei 2000 tot intrekking
    van Verordening (EG) nr. 1781/1999 houdende schorsing van het contingent melkpoeder
    dat in de Dominicaanse Republiek mag worden ingevoerd, en tot afwijking van Verordening
    (EG) nr. 174/1999 tot vaststelling van de specifieke uitvoeringsbepalingen van
    Verordening (EEG) nr. 804/68 van de Raad inzake de uitvoercertificaten en de uitvoerrestituties
    in de sector melk en zuivelproducten, en van Verordening (EEG) nr. 3719/88 houdende
    gemeenschappelijke uitvoeringsbepalingen inzake het stelsel van invoer-, uitvoer-
    en voorfixatiecertificaten voor landbouwproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1158/2000 da Comissão, de 30 de Maio de 2000, que
    revoga o Regulamento (CE) n.o 1781/1999, que suspende o contingente de importação
    de leite em pó destinado à República Dominicana, e derroga a determinadas disposições
    do Regulamento (CE) n.o 174/1999, que estabelece as normas especiais de execução
    do Regulamento (CEE) n.o 804/68 no que respeita aos certificados de exportação
    e às restituições à exportação no sector do leite e dos produtos lácteos,
    e do Regulamento (CEE) n.o 3719/88, que estabelece normas comuns de execução
    do regime de certificados de importação, de exportação e de prefixação para
    os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1158/2000 de la Comisión, de 30 de mayo de 2000, por
    el que se revoca el Reglamento (CE) nº 1781/1999 que suspende el contingente
    de importación de leche en polvo destinada a la República Dominicana y se derogan
    determinadas disposiciones del Reglamento (CE) nº 174/1999 por el que se establecen
    disposiciones específicas de aplicación del Reglamento (CEE) nº 804/68 del
    Consejo relativo a los certificados de exportación y de las restituciones por
    exportación en el sector de la leche y de los productos lácteos y el Reglamento
    (CEE) nº 3719/88 por el que se establecen disposiciones comunes de aplicación
    del régimen de certificados de importación, de exportación y de fijación anticipada
    para los productos agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1158/2000 av den 30 maj 2000 om upphävande
    av förordning (EG) nr 1781/1999 om upphävande av den importkvot för mjölkpulver
    avsedd för Dominikanska republiken som föreskrivs i förordning (EG) nr 174/1999
    om fastställande av särskilda tillämpningsföreskrifter till rådets förordning
    (EEG) nr 804/68 i fråga om exportlicenser och exportbidrag inom sektorn för
    mjölk och mjölkprodukter samt förordning (EEG) nr 3719/88 om gemensamma tillämpningsföreskrifter
    för systemet med import- och exportlicenser och förutfastställelselicenser
    för jordbruksprodukter
