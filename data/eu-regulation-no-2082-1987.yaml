    system of import and export licences and advance fixing certificates for agricultural
    products and Regulation (EEC) No 548/86 laying down detailed rules for the application
    of accession compensatory amounts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2082/87 de la Commission du 15 juillet 1987 modifiant
