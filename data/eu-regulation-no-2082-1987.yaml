  content: Regolamento (CEE) n. 2082/87 della Commissione del 15 luglio 1987 recante
    modifica del regolamento (CEE) n. 3183/80 che stabilisce le modalità comuni di
    applicazione del regime dei titoli d' importazione, di esportazione e di fissazione
    anticipata relativi ai prodotti agricoli e modifica del regolamento (CEE) n. 548/86
    che stabilisce le modalità di applicazione degli importi compensativi adesione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2082/87 van de Commissie van 15 juli 1987 tot wijziging
    van Verordening (EEG) nr. 3183/80 houdende gemeenschappelijke uitvoeringsbepalingen
    inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten
