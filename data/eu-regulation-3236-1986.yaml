    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3236/86 della Commissione del 24 ottobre 1986 che
    ripristina la riscossione dei dazi doganali applicabili alle barre, profilati
    e fili di sezione piena, di alluminio, della voce 76.02 della tariffa doganale
    comune, originari del Venezuela beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3236/86 van de Commissie van 24 oktober 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op staven, profielen
    en draad, massief, van aluminium, van post 76.02 van het gemeenschappelijk douanetarief,
    van oorsprong uit Venezuela, waarvoor de in Verordening (EEG) nr. 3599/85 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3236/86 da Comissão de 24 de Outubro de 1986 que
