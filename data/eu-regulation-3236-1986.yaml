title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3236/86 of 24 October 1986 re-establishing
    the levying of customs duties applicable to wrought bars, rods, angles, shapes
    and sections of aluminium; aluminium wire falling within heading No 76.02, originating
    in Venezuela, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3236/86 de la Commission du 24 octobre 1986 portant
    rétablissement de la perception des droits de douane applicables aux barres,
    profilés et fils de section pleine en aluminium de la position 76.02 du tarif
    douanier commun originaires du Venezuela, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3236/86 der Kommission vom 24. Oktober 1986 zur Wiedereinführung
    der Erhebung der Zölle für Stäbe, Profile und Draht, aus Aluminium, massiv,
    der Tarifnummer 76.02 des Gemeinsamen Zolltarifs mit Ursprung in Venezuela, dem
    die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3236/86 af 24. oktober 1986 om genindførelse
    af opkrævning af told for stænger, profiler og tråd, af aluminium, henhørende
    under pos. 76.02 i den fælles toldtarif og med oprindelse i Venezuela, som er
    præferenceberettigede i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
