  content: Commission Regulation (EEC) No 2162/87 of 22 July 1987 fixing for the 1987/88
    marketing year the minimum price to be paid to producers for unprocessed dried
    figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2162/87 de la Commission du 22 juillet 1987 fixant,
    pour la campagne 1987/1988, le prix minimal à payer aux producteurs pour les
    figues sèches non transformées ainsi que le montant de l' aide à la production
    pour les figues sèches
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2162/87 der Kommission vom 22. Juli 1987 zur Festsetzung
    des den Erzeugern unverarbeiteter getrockneter Feigen zu zahlenden Mindestpreises
    sowie der Produktionsbeihilfe für getrocknete Feigen im Wirtschaftsjahr 1987/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2162/87 af 22. juli 1987 om fastsættelse
    af den minimumspris, der skal betales producenten for uforarbejdede tørrede figner,
    samt af producentstøtten for tørrede figner i produktionsåret 1987/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2162/87 της Επιτροπής
