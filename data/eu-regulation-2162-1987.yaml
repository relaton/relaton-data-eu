    για την περίοδο εμπορίας 1987/88, της ελάχιστης
    τιμής που καταβάλλεται στους παραγωγούς για
    τα μη μεταποιημένα ξηρά σύκα και του ποσού
    ενίσχυσης στην παραγωγή για τα ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2162/87 della Commissione del 22 luglio 1987 che fissa,
    per la campagna di commercializzazione 1987/1988, il prezzo minimo da pagare ai
    produttori di fichi secchi non trasformati e l' importo dell' aiuto alla produzione
    per i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2162/87 van de Commissie van 22 juli 1987 tot vaststelling,
    voor het verkoopseizoen 1987/1988, van de aan de telers voor niet verwerkte, gedroogde
    vijgen te betalen minimumprijs, alsmede van het bedrag van de produktiesteun voor
    gedroogde vijgen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2162/87 da Comissão de 22 de Julho de 1987 que
