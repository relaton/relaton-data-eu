  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 608/94 della Commissione del 18 marzo 1994 che modifica
    il regolamento (CEE) n. 334/93 recante modalità d'applicazione relative all'uso
    di superfici ritirate dalla produzione allo scopo di ottenere materiali per la
    fabbricazione, nella Comunità, di prodotti non destinati in primo luogo al consumo
    umano o animale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 608/94 van de Commissie van 18 maart 1994 tot wijziging
