    κανονισμού (ΕΟΚ) αριθ. 334/93 περί λεπτομερών κανόνων
    σχετικά με τη χρησιμοποίηση των γαιών που βρίσκονται
    υπό καθεστώς προσωρινής παύσης καλλιέργειας
    για την παραγωγή πρώτων υλών που χρησιμεύουν
    κατά την παρασκευή, στην Κοινότητα, προϊόντων
    προοριζόμενων καταρχήν για άλλους σκοπούς
    εκτός της κατανάλωσης από τον άνθρωπο ή τα
    ζώα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 608/94, annettu 18 päivänä maaliskuuta 1994,
