title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 608/94 of 18 March 1994 amending Regulation
    (EEC) No 334/93 laying down detailed implementing rules for the use of land set
    aside for the provision of materials for the manufacture within the Community
    of products not primarily intended for human or animal consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 608/94 de la Commission du 18 mars 1994 modifiant le
    règlement (CEE) n° 334/93 portant modalités d'application relatives à l'utilisation
    des terres mises en jachère pour la production de matières premières servant
    à la fabrication, dans la Communauté, de produits destinés à des fins principales
    autres que la consommation humaine ou animale
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 608/94 der Kommission vom 18. März 1994 zur Änderung
    der Verordnung (EWG) Nr. 334/93 mit detaillierten Durchführungsbestimmungen für
    die Nutzung stillgelegter Flächen zur Erzeugung von Ausgangserzeugnissen, die
    in der Gemeinschaft zu nicht in erster Linie für Lebens- oder Futtermittelzwecke
    bestimmten Erzeugnissen verarbeitet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 608/94 af 18. marts 1994 om ændring
