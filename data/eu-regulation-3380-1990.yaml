title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3380/90 of 20 November 1990 amending Regulation
    (EEC) No 3034/80 fixing the quantities of basic products considered to have been
    used in the manufacture of goods covered by Regulation (EEC) No 3033/80, and fixing
    the rates of certain variable component levies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3380/90 du Conseil du 20 novembre 1990 modifiant le
    règlement (CEE) n° 3034/80 fixant les quantités de produits de base considérées
    comme étant entrées dans la fabrication de marchandises relevant du règlement
    (CEE) n° 3033/80, et fixant le taux de certains éléments mobiles
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3380/90 DES RATES vom 20. November 1990 zur Aenderung
    der Verordnung (EWG) Nr. 3034/80 zur Festlegung der Grunderzeugnismengen, von
    denen unterstellt wird, dass sie zur Herstellung von Waren der Verordnung (EWG)
    Nr. 3033/80 verwendet worden sind, und zur Festsetzung der Hoehe von bestimmten
    beweglichen Teilbetraegen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3380/90 af 20. november 1990 om ændring
    af forordning (EØF) nr. 3034/80 om fastsættelse af de mængder basisprodukter,
    der anses som medgået til fremstilling af varer, der henhører under forordning
    (EØF) nr. 3033/80, og om fastsættelse af størrelsen af visse variable elementer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3380/90 του Συμβουλίου
    της 20ής Νοεμβρίου 1990 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3034/80 περί καθορισμού
    των ποσοτήτων προϊόντων βάσης που θεωρούνται
    ότι έχουν χρησιμοποιηθεί στην παρασκευή εμπορευμάτων
    τα οποία υπάγονται στον κανονισμό (ΕΟΚ) αριθ.
    3033/80
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3380/90 DEL CONSIGLIO del 20 novembre 1990 recante
    modifica del regolamento (CEE) n. 3034/80 che fissa i quantitativi di prodotti
    di base che si considerano entrati nella fabbricazione di merci cui si applica
    il regolamento (CEE) n. 3033/80 e che determina gli importi di alcuni elementi
    mobili
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3380/90 VAN DE RAAD van 20 november 1990 houdende
    wijziging van Verordening (EEG) nr. 3034/80 tot vaststelling van de hoeveelheden
    basisprodukten die worden geacht bij de vervaardiging van de onder Verordening
    (EEG) nr. 3033/80 vallende goederen te zijn gebruikt, en tot vaststelling van
    de hoogte van bepaalde variabele elementen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3380/90 DO CONSELHO de 20 de Novembro de 1990 que
    altera o Regulamento (CEE) n* 3034/80 que fixa as quantidades de produtos de base
    consideradas como tendo entrado no fabrico de mercadorias abrangidas pelo Regulamento
    (CEE) n* 3033/80, que fixa a taxa de determinados elementos moveis
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3380/90 DEL CONSEJO de 20 de noviembre de 1990 que
    modifica el Reglamento (CEE) no 3034/80 por el que se determinan las cantidades
    de productos de base que se consideran incluidas en la fabricacion de mercancias
    reguladas por el Reglamento (CEE) no 3033/80, asi como los porcentajes de determinados
    elementos moviles
  type: main
