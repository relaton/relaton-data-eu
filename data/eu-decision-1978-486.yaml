id: EUDecision1978486
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 May 1978 authorizing Ireland not to apply Community
    treatment to men's and boys' woven industrial and occupational clothing; women's,
    girls' and infants' woven aprons, smock-overalls and other industrial clothing
    (whether or not also suitable for domestic use) of wool, of cotton or man-made
    textile fibres, falling within heading No ex 61.01 or subheading ex 61.02 B of
    the Common Customs Tariff (NIMEXE codes 61.01-13, 15, 17, 19; 61.02-12, 14), originating
    in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/486/CEE: Décision de la Commission, du 12 mai 1978, autorisant l''Irlande
    à exclure du traitement communautaire les vêtements de travail tissés pour
    hommes et garçonnets, tabliers, blouses et autres vêtements de travail tissés
    pour femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles de la position Ex 61.01 et de la sous-position
    Ex 61.02 B du Tarif douanier commun (code Nimexe 61.03-13, 15, 17, 19 - 61.02-12,
    14) originaires de Hong-Kong et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. Mai 1978, mit der Irland ermächtigt
    wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Arbeits- und Berufskleidung aus Geweben für Männer und Knaben, Schürzen,
    Kittel und andere Arbeits- und Berufskleidung aus Geweben für Frauen, Mädchen
    und Kleinkinder, aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen
    der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.01-13, 15, 17, 19 - 61.02-12, 14) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 12. maj 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage arbejds- og beskyttelsesbeklædning, vævet,
    til mænd og drenge; kitler og forklæder samt anden arbejds- og beskyttelsesbeklædning,
    vævet, til kvinder, piger og småbørn, af uld, bomuld eller syntetiske eller
    regenererede fibre, som henhører under pos. ex 61.01 og ex 61.02 B i den fælles
    toldtarif (NIMEXE-kode 61.01-13, 15, 17, 19 - 61.02-12, 14), har oprindelse i
    Hong Kong og frit kan omsættes i de andre mdlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 maggio 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario gli indumenti da lavoro tessuti, per
    uomo e per ragazzo; grembiuli; camiciotti e altri indumenti da lavoro, tessuti,
    per donna, per ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche
    o artificiali della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale
    comune (codice Nimexe 61.01-13, 15, 17, 19 - 61.02-12, 14), originari di Hong
    Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 mei 1978 waarbij Ierland wordt gemachtigd
    geweven werk- en bedrijfskleding, voor heren en jongens, geweven schorten, jasschorten
    en andere werkkleding, voor dames, meisjes en kinderen, van wol, van katoen of
    van synthetische of kunstmatige textielvezels, van de posten ex 61.01 en ex 61.02
    B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-13, 15, 17, 19 - 61.02-12,
    14), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
