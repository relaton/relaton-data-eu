title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2075/80 of 1 August 1980 re-establishing
    the levying of customs duties on other sheep and lambskin leather, other, falling
    within subheading 41.03 B II and originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2075/80 de la Commission, du 1er août 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d' ovins, non dénommées, de la sous-position 41.03 B II du tarif douanier commun,
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2075/80 der Kommission vom 1. August 1980 zur Wiedereinführung
    des Zollsatzes für anderes Schaf- und Lammleder, {{{ anderes, der Tarifstelle
    41.03 B II, mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2075/80 af 1. august 1980 om genindførelse
    af opkrævning af toldafgifter for andet læder af fåre- og lammeskind, andre
    varer, under pos. 41.03 B II, som har oprindelse i Pakistan og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2075/80 della Commissione, del 1° agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine,
    non nominate, della sottovoce 41.03 B II della tariffa doganale comune, originarie
    del Pakistan, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2075/80 van de Commissie van 1 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander schapeleder,
    {{{ overige, van post 41.03 B II, van oorsprong uit Pakistan, ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
