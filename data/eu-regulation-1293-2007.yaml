---
id: EURegulation12932007
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1293/2007 of 30 October 2007 repealing the anti-dumping
    duties imposed by Regulation (EC) No 1050/2002 on imports of recordable compact
    discs originating in Taiwan and allowing for their repayment or remission and
    repealing the countervailing duties imposed by Regulation (EC) No 960/2003 on
    imports of recordable compact discs originating in India, allowing for their repayment
    or remission and terminating the proceeding in their respect
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1293/2007 du Conseil du 30 octobre 2007 abrogeant les
    droits antidumping institués par le règlement (CE) n° 1050/2002 sur les importations
    de disques compacts pour l’enregistrement originaires de Taïwan et autorisant
    leur remboursement ou leur remise et abrogeant les droits compensateurs institués
    par le règlement (CE) n° 960/2003 sur les importations de disques compacts pour
    l’enregistrement originaires de l’Inde, autorisant leur remboursement ou leur
    remise et clôturant la procédure les concernant
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1293/2007 des Rates vom 30. Oktober 2007 zur Aufhebung
    sowie zur Rückzahlung bzw. zum Erlass der mit der Verordnung (EG) Nr. 1050/2002
    auf Einfuhren bespielbarer Compact Discs mit Ursprung in Taiwan eingeführten
    Antidumpingzölle und zur Aufhebung sowie zur Rückzahlung bzw. zum Erlass der
    mit der Verordnung (EG) Nr. 960/2003 auf Einfuhren bespielbarer Compact Discs
    mit Ursprung in Indien eingeführten Ausgleichszölle und zur Einstellung des
    diesbezüglichen Verfahrens
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1293/2007 на Съвета от 30 октомври
    2007 година за отмяна на антидъмпинговите мита,
    наложени с Регламент (ЕО) № 1050/2002 спрямо вноса
    на записващи компактдискове с произход от
    Тайван и за разрешаване на възстановяването
    или опрощаването на тези мита, както и за отмяна
    на изравнителните мита, наложени с Регламент
    (ЕО) № 960/2003 върху вноса на записваеми компактдискове
    с произход от Индия, за разрешаване на възстановяването
    или опрощаването на тези мита и за прекратяване
    на процедурата във връзка с тях
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1293/2007 ze dne 30. října 2007 , kterým se
    ruší antidumpingové clo uložené nařízením (ES) č. 1050/2002 na dovoz
    záznamových kompaktních disků pocházejících z Tchaj-wanu a kterým se umožňuje
    jeho vrácení nebo prominutí a kterým se ruší vyrovnávací clo uložené
    nařízením (ES) č. 960/2003 na dovoz zapisovatelných kompaktních disků pocházejících
    z Indie, umožňuje jeho vrácení nebo prominutí a zastavuje řízení týkající
    se zmíněného dovozu
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1293/2007 af 30. oktober 2007 om ophævelse
    af den antidumpingtold, der indførtes ved forordning (EF) nr. 1050/2002 på importen
    af compactdiske til indspilning med oprindelse i Taiwan og om godtgørelse heraf
    eller fritagelse herfor og om ophævelse af den udligningstold, der indførtes
    ved forordning (EF) nr. 960/2003, på importen af compactdiske til indspilning
    med oprindelse i Indien, om godtgørelse heraf eller fritagelse herfor og om afslutning
    af de pågældende procedurer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1293/2007 του Συμβουλίου,
    της 30ής Οκτωβρίου 2007 , για την κατάργηση των
    δασμών αντιντάμπινγκ που επιβλήθηκαν με τον
    κανονισμό (ΕΚ) αριθ. 1050/2002 στις εισαγωγές οπτικών
    δίσκων με δυνατότητα εγγραφής, καταγωγής Ταϊβάν,
    και την παροχή δυνατότητας επανείσπραξης ή
    επιστροφής τους, καθώς και για την κατάργηση
    των αντισταθμιστικών δασμών που επιβλήθηκαν
    με τον κανονισμό (ΕΚ) αριθ. 960/2003 στις εισαγωγές
    οπτικών δίσκων με δυνατότητα εγγραφής, καταγωγής
    Ινδίας, και την παροχή δυνατότητας επανείσπραξης
    ή επιστροφής τους, και για την περάτωση της
    διαδικασίας όσον αφορά τις εισαγωγές αυτές
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1293/2007, 30. oktoober 2007 , millega tunnistatakse
    kehtetuks määrusega (EÜ) nr 1050/2002 (Taiwanist pärinevate salvestatavate
    laserketaste impordi kohta) kehtestatud dumpinguvastased tollimaksud ja tehakse
    võimalikuks nende tagasimaksmine või vähendamine ning tunnistatakse kehtetuks
    määrusega (EÜ) nr 960/2003 (Indiast pärit salvestatavate laserketaste impordi
    kohta) kehtestatud tasakaalustavad tollimaksud, tehakse võimalikuks nende tagasimaksmine
    või vähendamine ja lõpetatakse nendega seotud menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1293/2007, annettu 30 päivänä lokakuuta 2007
    , Taiwanista peräisin olevien kirjoitettavien CD-levyjen tuonnissa asetuksella
    (EY) N:o 1050/2002 käyttöön otettujen polkumyyntitullien kumoamisesta ja niiden
    palauttamisen tai peruuttamisen sallimisesta sekä Intiasta peräisin olevien
    kirjoitettavien CD-levyjen tuonnissa asetuksella (EY) N:o 960/2003 käyttöön
    otettujen tasoitustullien kumoamisesta, niiden palauttamisen tai peruuttamisen
    sallimisesta ja menettelyn päättämisestä niiden osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1293/2007/EK rendelete ( 2007. október 30. ) a Tajvanból származó
    írható kompakt lemezek behozatalára vonatkozó dömpingellenes vám kivetéséről
    szóló 1050/2002/EK rendelet hatályon kívül helyezéséről és a vám visszafizetéséről
    vagy elengedéséről, valamint az Indiából származó írható kompakt lemezek
    behozatalára vonatkozó kiegyenlítő vám kivetéséről szóló 960/2003/EK
    rendelet hatályon kívül helyezéséről, a vám visszafizetéséről vagy elengedéséről
    és az arra vonatkozó eljárás megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1293/2007 del Consiglio, del 30 ottobre 2007 , che
    revoca i dazi antidumping istituiti dal regolamento (CE) n. 1050/2002 sulle importazioni
    di compact disc registrabili originari di Taiwan e autorizza il loro rimborso
    o sgravio e che revoca i dazi compensativi istituiti dal regolamento (CE) n. 960/2003
    sulle importazioni di compact disc registrabili originari dell’India, autorizza
    il loro rimborso o sgravio e chiude il procedimento nei loro confronti
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1293/2007 ( 2007. gada 30. oktobris ), ar ko atceļ
    antidempinga maksājumu, kurš noteikts ar Regulu (EK) Nr. 1050/2002 par Taivānas
    izcelsmes ierakstāmu kompaktdisku importu, un ar ko atļauj šā maksājuma atmaksāšanu
    vai atlaišanu, un ar ko atceļ kompensācijas maksājumu, kurš noteikts ar Regulu
    (EK) Nr. 960/2003 par Indijas izcelsmes ierakstāmu kompaktdisku importu, un ar
    ko atļauj šā maksājuma atmaksāšanu vai atcelšanu, kā arī izbeidz attiecīgo
    procedūru
  type: main
- language: lt
  script: Latn
  content: 2007 m. spalio 30 d. Tarybos reglamentas (EB) Nr. 1293/2007, panaikinantis
    antidempingo muitus, nustatytus Reglamentu (EB) Nr. 1050/2002 Taivano kilmės
    įrašomųjų kompaktinių diskų importui ir nustatantis muitų grąžinimo ar
    atsisakymo juos išieškoti sąlygas ir panaikinantis kompensacinius muitus, nustatytus
    Tarybos Reglamentu (EB) Nr. 960/2003 Indijos kilmės įrašomųjų kompaktinių
    diskų importui, leidžiantis juos grąžinti arba atsisakyti juos išieškoti
    bei nutraukiantis tyrimą dėl šių diskų importo
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1293/2007 tat- 30 ta’ Ottubru 2007 li
    tirrevoka d-dazji ta’ antidumping imposti mir-Regolament tal-Kunsill (KE) Nru
    1050/2002 dwar importazzjonijiet ta’ compact disks li wieħed jista’ jirrekordja
    fuqhom li joriġinaw fit-Tajwan u li jippermetti r-rifużjoni jew ir-remissjoni
    tagħhom kif ukoll li jirrevoka d-dazji kompensatorji imposti mir-Regolament tal-Kunsill
    (KE) Nru 960/2003 dwar importazzjonijiet ta’ compact disks li jistgħu jkunu
    rrekordjati li joriġinaw mill-Indja, li jippermetti r-rifużjoni jew ir-remissjoni
    tagħhom u li jtemm il-proċediment li jirrigwardahom
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1293/2007 van de Raad van 30 oktober 2007 tot intrekking
    van de bij Verordening (EG) nr. 1050/2002 ingestelde antidumpingrechten op opneembare
    compact discs van oorsprong uit Taiwan, zodat deze kunnen worden terugbetaald
    of kwijtgescholden en tot intrekking van de bij Verordening (EG) nr. 960/2003
    ingestelde compenserende rechten op opneembare compact discs van oorsprong uit
    India, zodat deze kunnen worden terugbetaald of kwijtgescholden, en tot beëindiging
    van de desbetreffende procedure
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1293/2007 z dnia 30 października 2007 r.
    uchylające cła antydumpingowe nałożone rozporządzeniem (WE) nr 1050/2002
    na przywóz płyt kompaktowych jednokrotnego zapisu pochodzących z Tajwanu i
    zezwalające na ich zwrot lub umorzenie oraz uchylające cła wyrównawcze nałożone
    rozporządzeniem Rady (WE) nr 960/2003 na przywóz płyt kompaktowych jednokrotnego
    zapisu pochodzących z Indii, zezwalające na ich zwrot lub umorzenie oraz kończące
    postępowanie w tej sprawie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1293/2007 do Conselho, de 30 de Outubro de 2007 ,
    que revoga os direitos anti-dumping instituídos pelo Regulamento (CE) n.° 1050/2002
    sobre as importações de discos compactos para gravação originários de Taiwan
    e que autoriza o respectivo reembolso ou a dispensa do seu pagamento e que revoga
    os direitos de compensação instituídos pelo Regulamento (CE) n.° 960/2003
    sobre as importações de discos compactos para gravação originários da Índia,
    que autoriza o respectivo reembolso ou a dispensa do seu pagamento e encerra o
    processo que lhes respeita
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1293/2007 al Consiliului din 30 octombrie 2007 de
    eliminare a taxelor antidumping instituite prin Regulamentul (CE) nr. 1050/2002
    la importurile de compact-discuri inscriptibile originare din Taiwan și de autorizare
    a rambursării sau remiterii acestora, și de eliminare a taxelor compensatorii
    instituite prin Regulamentul (CE) nr. 960/2003 la importurile de compact-discuri
    inscriptibile originare din India, de autorizare a rambursării sau remiterii
    acestora și de încheiere a procedurii corespunzătoare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1293/2007 z 30. októbra 2007 , ktorým sa zrušujú
    antidumpingové clá uložené nariadením (ES) č. 1050/2002 na dovoz nahrávateľných
    kompaktných diskov s pôvodom na Taiwane a povoľuje sa ich vrátenie alebo odpustenie
    a ktorým sa zrušujú vyrovnávacie clá uložené nariadením (ES) č. 960/2003
    na dovoz nahrávateľných kompaktných diskov s pôvodom v Indii a povoľuje
    sa ich vrátenie alebo odpustenie a ukončuje sa konanie v tejto veci
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1293/2007 z dne 30. oktobra 2007 o razveljavitvi
    protidampinških dajatev, uvedenih z Uredbo (ES) št. 1050/2002 na uvoz zapisljivih
    zgoščenk po poreklu iz Tajvana, kar omogoča povračilo ali opustitev dajatev,
    in o razveljavitvi izravnalnih dajatev, uvedenih z Uredbo (ES) št. 960/2003 na
    uvoz zapisljivih CD plošč s poreklom iz Indije, kar omogoča povračilo ali
    opustitev dajatev ter zaključku postopka v zvezi z njimi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1293/2007 del Consejo, de 30 de octubre de 2007 , por
    el que se derogan los derechos antidumping establecidos por el Reglamento (CE)
    n° 1050/2002, sobre las importaciones de discos compactos registrables originarias
    de Taiwán, y por el que se autoriza su devolución o condonación y por el que
    se derogan los derechos compensatorios establecidos por el Reglamento (CE) n°
    960/2003, sobre las importaciones de discos compactos registrables originarias
    de la India, se autoriza su devolución o condonación y se da por concluido el
    procedimiento al respecto
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1293/2007 av den 30 oktober 2007 om upphävande
    av de antidumpningstullar som infördes genom förordning (EG) nr 1050/2002 på
    import av inspelningsbara cd-skivor med ursprung i Taiwan och om medgivande av
    återbetalning eller eftergift av dessa tullar och om upphävande av de utjämningstullar
    som infördes genom förordning (EG) nr 960/2003 på import av inspelningsbara
    cd-skivor med ursprung i Indien, om medgivande av återbetalning eller eftergift
    av dessa tullar och om avslutande av förfarandet rörande dem
  type: main
