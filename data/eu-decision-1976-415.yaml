id: EUDecision1976415
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 March 1976 authorizing the Italian Republic not
    to apply Community treatment to imports of printed cotton fabrics, other than
    gauze and terry towelling and similar terry fabrics, falling within heading No
    ex 55.09 of the Common Customs Tariff, originating in Hong Kong and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/415/CEE: Décision de la Commission, du 9 mars 1976, autorisant la
    République italienne à exclure du traitement communautaire les importations
    des tissus de coton autres qu''à point de gaze ou boucles du genre éponge, imprimés,
    de la position Ex 55.09 du Tarif douanier commun, originaires de Hong-Kong et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. März 1976, mit der die Italienische
    Republik ermächtigt wird, aus Hongkong stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus Baumwolle, andere als Drehergewebe oder
    Schlingengewebe (Frottiergewebe), bedruckt, der Tarifnummer ex 55.09 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. marts 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage indførsler af vævede stoffer
    af bomuld eller trykket håndklædefrotterstof og lignende frotterstof af bomuld,
    som henhører under pos. ex 55.09 i den fælles toldtarif, har oprindelse i Hong
    Kong, og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 marzo 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le importazioni di tessuti di
    cotone diversi da quelli di garza o ricci del tipo spugna, stampati, della voce
    ex 55.09 della tariffa doganale comune, originari di Hong Kong e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 maart 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd weefsels van katoen, andere dan weefsels met gaasbindingen, bad-
    of frotteerstof (lussendoek), bedrukt, van post ex 55.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
