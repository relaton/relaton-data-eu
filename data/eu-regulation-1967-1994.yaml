    dos limões, dos tomates, das beringelas, das uvas de mesa e das maçãs até
    ao final da campanha de 1994/1995, na sequência dos realinhamentos monetários
    de Janeiro e Maio de 1993 e da superação do limiar de intervenção fixado para
    a campanha de 1993/1994
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1967/94 DE LA COMISIÓN de 29 de julio de 1994 por
