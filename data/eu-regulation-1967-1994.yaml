    las nectarinas, los limones, los tomates, las berenjenas, las uvas de mesa y las
    manzanas hasta el final de la campaña 1994/95 como consecuencia de los reajustes
    monetarios de enero y de mayo de 1993 y del rebasamiento del umbral de intervención
    fijado para la campaña 1993/94
  type: main
