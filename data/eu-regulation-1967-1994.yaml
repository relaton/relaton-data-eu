title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1967/94 of 29 July 1994 reducing the basic
    price and buying-in price for cauliflowers, peaches, nectarines, lemons, tomatoes,
    aubergines, table grapes and apples until the end of the 1994/95 marketing year
    as a result of the monetary realignments of January and May 1993 and the overrun
    of the intervention threshold fixed for the 1993/94 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1967/94 de la Commission du 29 juillet 1994 diminuant
    les prix de base et d'achat des choux- fleurs, des pêches, des nectarines, des
    citrons, des tomates, des aubergines, des raisins de table et des pommes jusqu'à
    la fin de la campagne 1994/1995 par suite des réalignements monétaires de janvier
    et de mai 1993 et du dépassement du seuil d'intervention fixé pour la campagne
    1993/1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1967/94 DER KOMMISSION vom 29. Juli 1994 zur Kürzung
    der Grund- und Ankaufspreise für Blumenkohl, Pfirsiche, Nektarinen, Zitronen,
    Tomaten, Auberginen, Tafeltrauben und Äpfel bis zum Ende des Wirtschaftsjahres
    1994/95 infolge der Währungsneufestsetzungen von Januar 1993 und Mai 1993 sowie
    der Überschreitung der Interventionsschwelle für das Wirtschaftsjahr 1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1967/94 af 29. juli 1994 om nedsættelse
    af basis- og opkøbspriserne for blomkål, ferskner, nektariner, citroner, tomater,
    auberginer, spisedruer og æbler indtil udgangen af høståret 1994/95 som følge
    af de monetære justeringer i januar 1993 og i maj 1993 og overskridelsen af interventionstærsklen
    for høståret 1993/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1967/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Ιουλίου 1994 για τη μείωση των τιμών βάσης
    και αγοράς των κουνουπιδιών, ροδακίνων, νεκταρινιών,
    λεμονιών, τοματών, μελιτζανών, επιτραπέζιων
    σταφυλιών και μήλων, μέχρι το τέλος της περιόδου
    εμπορίας 1994/95, λόγω των νομισματικών επανευθυγραμμίσεων
    του Ιανουαρίου 1993 και του Μαΐου 1993 και της υπέρβασης
    του κατωφλίου παρέμβασης που καθορίστηκε για
    την περίοδο εμπορίας 1993/94
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1967/94, annettu 29 päivänä heinäkuuta 1994,
    kukkakaalien, persikoiden, nektariinien, sitruunoiden, tomaattien, munakoisojen,
    syötäväksi tarkoitettujen viinirypäleiden ja omenoiden perus- ja ostohinnan
    alentamisesta markkinointivuoden 1994/1995 loppuun asti vuoden 1993 tammikuun
    ja toukokuun hallinnollisten valuuttakurssitarkistusten ja markkinointivuodeksi
    1993/1994 vahvistetun interventiokynnyksen ylittymisen johdosta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1967/94 DELLA COMMISSIONE del 29 luglio 1994 che riduce
    i prezzi di base e d' acquisto dei cavolfiori, delle pesche, delle nettarine,
    dei limoni, dei pomodori, delle melanzane, delle uve da tavola e delle mele sino
    alla fine della campagna 1994/1995 in conseguenza dei riallineamenti monetari
    del gennaio 1993 e del maggio 1993 nonché del superamento del limite d' intervento
    fissato per la campagna 1993/1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1967/94 VAN DE COMMISSIE van 29 juli 1994 tot verlaging
    van de basis- en de aankoopprijzen voor bloemkool, perziken, nectarines, citroenen,
    tomaten, aubergines, tafeldruiven en appelen tot het einde van het verkoopseizoen
    1994/1995, in verband met de monetaire herschikkingen van januari en mei 1993
    en met de overschrijding van de voor het verkoopseizoen 1993/1994 vastgestelde
    interventiedrempel
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1967/94 DA COMISSÃO de 29 de Julho de 1994 que diminui
