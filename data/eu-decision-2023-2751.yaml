  content: Rådets beslut (EU) 2023/2751 av den 30 november 2023 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar inom Internationella sjöfartsorganisationen
    vid det 33:e mötet i dess församling om antagandet av ändringar av riktlinjerna
    för skyddade platser för fartyg i behov av assistans, av riktlinjerna inom ramen
