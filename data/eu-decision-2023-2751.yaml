  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/2751 z 30. novembra 2023 o pozícii, ktorá
    sa má v mene Európskej únie zaujať v Medzinárodnej námornej organizácii
    na 33. zasadnutí jej zhromaždenia, pokiaľ ide o prijatie zmien usmernení o
    miestach útočišťa pre lode, ktoré potrebujú pomoc, usmernení pre prehliadky
    v rámci harmonizovaného systému prehliadok a osvedčovania, neúplného zoznamu
    povinností vyplývajúcich z nástrojov relevantných pre kódex vykonávania
    nástrojov IMO a usmernení na vykonávanie Medzinárodného kódexu pre bezpečnostný
    manažment správami
  type: main
