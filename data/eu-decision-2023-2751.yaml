  content: Decisión (UE) 2023/2751 del Consejo, de 30 de noviembre de 2023, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en la Organización
    Marítima Internacional durante el 33.° período de sesiones de su Asamblea,
    con respecto a la adopción de enmiendas a las Directrices relativas a los lugares
    de refugio para los buques necesitados de asistencia, a las Directrices para efectuar
    reconocimientos de conformidad con el sistema armonizado de reconocimientos y
    certificación, a la Lista no exhaustiva de las obligaciones contraídas en virtud
