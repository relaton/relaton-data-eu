  script: Latn
  content: Sklep Sveta (EU) 2023/2751 z dne 30. novembra 2023 o stališču, ki se
    v imenu Evropske unije zastopa v Mednarodni pomorski organizaciji na 33. zasedanju
    njene Skupščine glede sprejetja sprememb smernic o pribežališčih za ladje,
    ki potrebujejo pomoč, smernic v okviru usklajenega sistema za pregled in izdajo
