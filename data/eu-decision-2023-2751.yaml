  content: Decizia (UE) 2023/2751 a Consiliului din 30 noiembrie 2023 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul celei de
    a 33-a sesiuni a Adunării Organizației Maritime Internaționale cu privire la
    adoptarea unor modificări aduse Orientărilor privind locurile de refugiu pentru
    navele care au nevoie de asistență, Orientărilor din cadrul Sistemului armonizat
