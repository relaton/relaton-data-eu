  script: Latn
  content: Council Decision (EU) 2023/2751 of 30 November 2023 on the position to
    be taken on behalf of the European Union within the International Maritime Organization
    during the 33rd session of its Assembly on the adoption of amendments to the Guidelines
    on places of refuge for ships in need of assistance, to the Guidelines under the
    Harmonized System of Survey and Certification, to the Non-exhaustive list of obligations
    under instruments relevant to the IMO Instruments Implementation Code and to the
    Guidelines on implementation of the International Safety Management Code by Administrations
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2751 du Conseil du 30 novembre 2023 relative à la
    position à prendre, au nom de l’Union européenne, au sein de l’Organisation
    maritime internationale lors de la 33e session de son Assemblée sur l’adoption
    d’amendements aux directives sur les lieux de refuge pour les navires ayant
    besoin d’assistance, aux directives en vertu du système harmonisé de visites
    et de délivrance des certificats, à la liste non exhaustive des obligations
    découlant des instruments pertinents pour le code d’application des instruments
    de l’OMI et aux directives sur l’application du code international de gestion
    de la sécurité par les administrations
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/2751 des Rates vom 30. November 2023 über den Standpunkt,
    der im Namen der Europäischen Union auf der 33. Tagung der Versammlung der Internationalen
    Seeschifffahrtsorganisation in Bezug auf die Annahme von Änderungen der Richtlinien
    über Notliegeplätze für auf Hilfe angewiesene Schiffe, der Leitlinien im Rahmen
    des Harmonisierten Systems der Besichtigung und Zeugniserteilung, der nicht erschöpfenden
    Liste der Verpflichtungen im Rahmen der für den Code für die Anwendung der IMO-Instrumente
    relevanten Instrumente und der Richtlinien für die Umsetzung des Internationalen
    Codes für die Organisation eines sicheren Schiffsbetriebs durch die Verwaltungen
    zu vertreten ist
  type: main
