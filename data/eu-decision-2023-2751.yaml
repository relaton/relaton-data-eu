  script: Latn
  content: Rozhodnutí Rady (EU) 2023/2751 ze dne 30. listopadu 2023 o postoji, který
    má být jménem Evropské unie zaujat v Mezinárodní námořní organizaci během
    33. zasedání jejího shromáždění k přijetí změn Pokynů pro útočiště
    pro lodě potřebující pomoc, pokynů podle harmonizovaného systému prohlídek
    a vydávání osvědčení, demonstrativního seznamu závazků na základě nástrojů
    souvisejících s předpisy k provádění nástrojů IMO a Pokynů pro provádění
    Mezinárodního předpisu pro řízení bezpečnosti správami
  type: main
