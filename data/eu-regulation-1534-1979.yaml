title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1534/79 of 23 July 1979 re-establishing
    the levying of customs duties on melamine, falling within subheading 29.35 ex
    Q and originating in Mexico, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1534/79 de la Commission, du 23 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position 29.35 ex Q du tarif douanier commun, originaire du Mexique,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1534/79 der Kommission vom 23. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Melamine der Tarifstelle 29.35 ex Q, mit Ursprung in Mexiko,
    dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1534/79 af 23. juli 1979 om genindførelse
    af opkrævning af toldafgifter for melamin under underposition 29.35 ex Q, som
    har oprindelse i Mexico og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1534/79 della Commissione, del 23 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili alla melammina, della
    sottovoce 29.35 ex Q della tariffa doganale comune, originaria del Messico, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1534/79 van de Commissie van 23 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op melamine,
    van post 29.35 ex Q, van oorsprong uit Mexico ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
