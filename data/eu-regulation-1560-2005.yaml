title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1560/2005 of 23 September 2005 determining
    the extent to which applications lodged in September 2005 for import licences
    for certain egg sector products and poultrymeat pursuant to Regulations (EC) No
    593/2004 and (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1560/2005 de la Commission du 23 septembre 2005 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en septembre 2005 pour certains produits du secteur des œufs et de la viande
    de volaille dans le cadre des règlements (CE) n° 593/2004 et (CE) n° 1251/96
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1560/2005 der Kommission vom 23. September 2005 über
    die Festsetzung des Umfangs, in dem die im September 2005 gestellten Anträge
    auf Einfuhrlizenzen für bestimmte Produkte des Sektors Eier und Geflügelfleisch
    entsprechend den Verordnungen (EG) Nr. 593/2004 und (EG) Nr. 1251/96 genehmigt
    werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1560/2005 ze dne 23. září 2005, kterým
    se stanoví rozsah, v němž mohou být přijímány žádosti o dovozní licence
    na některé výrobky z odvětví vajec a drůbežího masa podané v září
    2005 na základě nařízení (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1560/2005 af 23. september 2005 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i september
    2005 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 593/2004 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1560/2005 της Επιτροπής,
    της 23ης Σεπτεμβρίου 2005, για καθορισμό ορίων
    εντός των οποίων δύναται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Σεπτέμβριο
    του 2005 για πιστοποιητικά εισαγωγής για ορισμένα
    προϊόντα του τομέα των αυγών και του κρέατος
    πουλερικών στα πλαίσια των κανονισμών (ΕΚ)
    αριθ. 593/2004 και (ΕΚ) αριθ. 1251/96
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1560/2005, 23. september 2005, millega määratakse
    kindlaks, millises ulatuses võib heaks kiita määruste (EÜ) nr 593/2004 ja
    (EÜ) nr 1251/96 alusel septembris 2005 esitatud teatavate muna- ja kodulinnulihasektorite
    toodete impordilitsentsi taotlusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1560/2005, annettu 23 päivänä syyskuuta 2005,
