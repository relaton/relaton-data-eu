    r. o pozwolenia na przywóz niektórych produktów z sektorów jaj i mięsa drobiowego
    w ramach rozporządzeń (WE) nr 593/2004 i nr 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1560/2005 da Comissão, de 23 de Setembro de 2005,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Setembro de 2005 ao abrigo dos Regulamentos (CE) n.° 593/2004 e (CE) n.°
    1251/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1560/2005 z 23. septembra 2005, ktoré určuje
