title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1675/2003 of 22 September 2003 amending Regulation
    (EC) No 1995/2000 imposing, inter alia, a definitive anti-dumping duty on imports
    of solution of urea and ammonium nitrate originating in Algeria, Belarus, Lithuania,
    Russia and Ukraine
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1675/2003 du Conseil du 22 septembre 2003 modifiant
    le règlement (CE) n° 1995/2000 du Conseil instituant, entre autres, un droit
    antidumping définitif sur les importations de solutions d'urée et de nitrate
    d'ammonium originaires d'Algérie, du Belarus, de Lituanie, de Russie et d'Ukraine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1675/2003 des Rates vom 22. September 2003 zur Änderung
    der Verordnung (EG) Nr. 1995/2000 zur Einführung, unter anderem, eines endgültigen
    Antidumpingzolls auf die Einfuhren von Lösungen von Harnstoff und Ammoniumnitrat
    mit Ursprung in Algerien, Belarus, Litauen, Russland und der Ukraine
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1675/2003 ze dne 22. září 2003, kterým se
