title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 700/2003 of 16 April 2003 laying down to
    what extent applications for issue of export licences submitted during April 2003
    for beef products which may benefit from special import treatment in a third country
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 700/2003 de la Commission du 16 avril 2003 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'avril 2003 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 700/2003 der Kommission vom 16. April 2003 über das
    Ausmaß, in dem den im April 2003 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 700/2003 af 16. april 2003 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    april 2003 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 700/2003 της Επιτροπής,
    της 16ης Απριλίου 2003, που καθορίζει σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Απρίλιο 2003 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 700/2003, annettu 16 päivänä huhtikuuta 2003,
    kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden huhtikuussa
    2003 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 700/2003 della Commissione, del 16 aprile 2003, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di aprile 2003 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 700/2003 van de Commissie van 16 april 2003 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in april 2003 ingediende aanvragen
    om uitvoercertificaten voor producten van de sector rundvlees waarvoor een bĳzondere
    behandeling geldt bĳ invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 700/2003 da Comissão, de 16 de Abril de 2003, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Abril de 2003 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 700/2003 de la Comisión, de 16 de abril de 2003, por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentadas en el mes de abril de 2003, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en un tercer país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 700/2003 av den 16 april 2003 om fastställande
