title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 15 janvier 1968, autorisant la République
    française, en vertu de l'article 115, alinéa 1, du Traité, à exclure du traitement
    communautaire les "concombres" de la position 07.01 Ex O du Tarif douanier commun
    originaires d'Espagne et mis en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '68/57/EWG: Entscheidung der Kommission vom 15. Januar 1968, mit der die
    Französische Republik gemäß Artikel 115 Absatz 1 des Vertrages ermächtigt
    wird, Gurken der Tarifnummer 07.01 ex O des Gemeinsamen Zolltarifs mit Ursprung
    in Spanien, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '68/57/CEE: Decisione della Commissione, del 15 gennaio 1968, che autorizza
    la Repubblica francese a norma dell''articolo 115, primo comma, del trattato,
    ad escludere dal trattamento comunitario i cetrioli della voce 07.01 ex O della
    tariffa doganale comune, originari della Spagna ed immessi in libera pratica in
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '68/57/EEG: Beschikking van de Commissie van 15 januari 1968 houdende machtiging
    van de Franse Republiek om, op grond van artikel 115, eerste alinea, van het Verdrag,
    komkommers van post 07.01 ex O van het gemeenschappelijk douanetarief, die van
    oorsprong zijn uit Spanje en in andere Lid-Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
