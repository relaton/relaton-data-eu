title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1297/89 of 10 May 1989 re-establishing the
    levying of customs duties on table linen, toilet and kitchen linen, products of
    category 39 (order No 40.0390) and track suits of knitted or crocheted fabric,
    products of category 73 (order No 40.0730), originating in Pakistan to which the
    preferential tariff arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1297/89 de la Commission du 10 mai 1989 portant rétablissement
    de la perception des droits de douane applicables au linge de table, de toilette
    ou de cuisine de la catégorie de produits 39 (numéro d'ordre 40.0390) et aux
    trainings en bonneterie de la catégorie de produits n° 73 (numéro d'ordre 40.0730),
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1297/89 DER KOMMISSION vom 10. Mai 1989 zur Wiedereinführung
    des Zollsatzes für Tischwäsche, Wäsche zur Körperpflege und Haushaltswäsche
    der Warenkategorie Nr. 39 (lfd. Nr. 40.0390) sowie Kostüme und Kombinationen
    aus Gewirken der Warenkategorie Nr. 73 (lfd. Nr. 40.0730) mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1297/89 af 10. maj 1989 om genindførelse
    af opkrævning af toldafgifter for - dækketøj, håndklæder, vaskeklude, viskestykker
    o. lign. køkkentekstiler under varekategori nr. 39 (løbenummer 40.0390) - træningsdragter
    af trikotage under varekategori nr. 73 (løbenummer 40.0730), som har oprindelse
    i Pakistan og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
