  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1297/89 DELLA COMMISSIONE del 10 maggio 1989 che
    ripristina la riscossione dei dazi doganali applicabili alla biancheria da tavola,
    da toletta o da cucina della categoria di prodotti n. 39 (numero d'' ordine 40.0390)
    e alle tute sportive a maglia della categoria di prodotti n. 73 (numero d'' ordine
    40.0730) originari del Pakistan, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 4259/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1297/89 VAN DE COMMISSIE van 10 mei 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tafellinnen
