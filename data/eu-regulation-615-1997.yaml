title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 615/97 of 8 April 1997 authorizing on a temporary
    basis the conclusion of direct contracts between producers who are members of
    producer organizations and processing undertakings in the fruit and vegetable
    sector under Council Regulation (EC) No 2200/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 615/97 de la Commission du 8 avril 1997 autorisant
    temporairement au titre du règlement (CE) nº 2200/96 du Conseil la conclusion
    de contrats directs entre les producteurs membres des organisations de producteurs
    et les entreprises de transformation dans le secteur des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 615/97 der Kommission vom 8. April 1997 zur befristeten
    Genehmigung des Abschlusses von Direktverträgen zwischen Mitgliedern von Erzeugerorganisationen
    und Verarbeitungsunternehmen im Sektor Obst und Gemüse gemäß Verordnung (EG)
    Nr. 2200/96
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 615/97 af 8. april 1997 om midlertidig
    tilladelse i henhold til forordning (EF) nr. 2200/96 til at indgå direkte kontrakter
    mellem producenter, der er tilsluttet producentorganisationer og virksomheder,
    som forarbejder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 615/97 της Επιτροπής
    της 8ης Απριλίου 1997 που εξουσιοδοτεί προσωρινά
    δυνάμει του κανονισμού (ΕΚ) αριθ. 2200/96 του Συμβουλίου
    τη σύναψη απευθείας συμβάσεων μεταξύ των παραγωγών
    μελών οργανώσεων παραγωγών και των επιχειρήσεων
    μεταποίησης στον τομέα των οπωροκηπευτικών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 615/97, annettu 8 päivänä huhtikuuta 1997,
    väliaikaisen luvan antamisesta sopimusten tekemiseen neuvoston asetuksen (EY)
    N:o 2200/96 mukaisesti suoraan hedelmä- ja vihannesalan tuottajaorganisaatioiden
    jäsentuottajien ja jalostusyritysten välillä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 615/97 della Commissione dell'8 aprile 1997 che autorizza,
    in via temporanea, nel quadro del regolamento (CE) n. 2200/96 la conclusione di
    contratti diretti tra produttori soci di organizzazioni di produttori e le imprese
    di trasformazione nel settore degli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 615/97 van de Commissie van 8 april 1997 tot tijdelijke
    machtiging, op grond van Verordening (EG) nr. 2200/96 van de Raad, van bij een
    telersvereniging in de sector groenten en fruit aangesloten telers om rechtstreeks
    contracten te sluiten met verwerkende bedrijven
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 615/97 da Comissão de 8 de Abril de 1997 que autoriza
    temporariamente, a título do Regulamento (CE) nº 2200/96 do Conselho, a celebração
    de contratos directos entre os produtores membros das organizações de produtores
    e as empresas de transformação no sector das frutas e produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 615/97 de la Comisión de 8 de abril de 1997 por el
    que se autoriza temporalmente, con arreglo al Reglamento (CE) nº 2200/96 del
    Consejo, la celebración de contratos directos entre los productores miembros
    de organizaciones de productores y las empresas de transformación del sector
    de las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 615/97 av den 8 april 1997 om att tillfälligt
    och i enlighet med förordning (EG) nr 2200/96 bemyndiga att direkta kontrakt
    sluts mellan producerande medlemmar i producentorganisationer och bearbetningsföretag
    inom sektorn för frukt och grönsaker
  type: main
