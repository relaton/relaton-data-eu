title:
- language: en
  script: Latn
  content: '97/98/EC: Commission Decision of 23 January 1997 concerning the placing
    on the market of genetically modified maize (Zea mays L.) with the combined modification
    for insecticidal properties conferred by the Bt-endotoxin gene and increased tolerance
    to the herbicide glufosinate ammonium pursuant to Council Directive 90/220/EEC'
  type: main
- language: fr
  script: Latn
  content: '97/98/CE: Décision de la Commission du 23 janvier 1997 concernant la
    mise sur le marché de maïs génétiquement modifié (Zea mays L.) ayant subi
    la modification combinée lui assurant les propriétés insecticides conférées
    par le gène Bt-endotoxine et une meilleure tolérance à l''herbicide glufosinate-ammonium,
    en application de la directive 90/220/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '97/98/EG: Entscheidung der Kommission vom 23. Januar 1997 über das Inverkehrbringen
    von genetisch verändertem Mais (Zea Mays L.) mit der kombinierten Veränderung
    der Insektizidwirkung des BT-Endotoxin-Gens und erhöhter Toleranz gegenüber
    dem Herbizid Glufosinatammonium gemäß der Richtlinie 90/220/EWG des Rates'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 23 януари 1997 година
    относно пускането на пазара на генетично модифицирана
    царевица (Zea mays L.), претърпяла комбинирано модифициране,
    което ѝ придава свойства на инсектицид, заради
    гена Bt-ендотоксин и по-добра поносимост към
    хербицида глюфосинат-амониум в съответствие
    с Директива 90/220/ЕИО на Съвета
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 23. ledna 1997 o uvedení geneticky modifikované
    kukuřice (Zea mays L.) s kombinovanou modifikací pro insekticidní vlastnosti,
    které jí propůjčuje gen pro Bt endotoxin, a se zvýšenou tolerancí vůči
    herbicidnímu glufosinátu amonnému na trh podle směrnice Rady 90/220/EHS
  type: main
- language: da
  script: Latn
  content: '97/98/EF: Kommissionens beslutning af 23. januar 1997 om markedsføring
    af genetisk modificeret majs (Zea mays L.) med kombineret modifikation for insekticide
    egenskaber, frembragt ved Bt-endotoxin-genet, og øget tolerance over for herbicidet
    ammoniumglufonisat fremsat i henhold til Rådets direktiv 90/220/EØF'
  type: main
- language: el
  script: Grek
  content: '97/98/ΕΚ: Απόφαση της Επιτροπής της 23ης Ιανουαρίου
    1997 για τη διάθεση στην αγορά γενετικώς τροποποιημένου
    αραβοσίτου (Zea mays L.) που έχει υποστεί συνδυασμένη
    τροποποίηση, η οποία τον εφοδιάζει με τις εντομοκτόνες
    ιδιότητες που προσδίδονται από το γονίδιο
    κωδικοποίησης της ενδοτοξίνης Bt και με αυξημένη
    ανοχή του ζιζανιοκτόνου γλυφοσινικού αμμωνίου,
    δυνάμει της οδηγίας 90/220/ΕΟΚ του Συμβουλίου'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 23. jaanuar 1997, mis käsitleb sellise geneetiliselt
    muundatud maisi (Zea mays L.) turuleviimist, milles on kombineeritud muundamise
    tagajärjel Bt-endotoksiini geenist tulenevad insektitsiidsed omadused ja herbitsiid
    glufosinaatammooniumi kõrgendatud taluvus, vastavalt nõukogu direktiivile 90/220/EMÜ
  type: main
- language: fi
  script: Latn
  content: '97/98/EY: Komission päätös, tehty 23 päivänä tammikuuta 1997, geneettisesti
    muunnetun maissin (Zea mays L.), jolla yhdistetyn muuntamisen avulla on Bt-endotoksiinigeenin
    sille antamat insektisidiset ominaisuudet ja lisääntynyt sietokyky glufosinaattiammonium-nimiselle
    rikkakasvien torjunta-aineelle, markkinoille saattamisesta neuvoston direktiivin
    90/220/ETY mukaisesti'
  type: main
- language: hr
  script: Latn
  content: '97/98/EZ: Odluka Komisije od 23. siječnja 1997. o stavljanju na tržište
    genetski modificiranog kukuruza ( Zea mays L.) s kombiniranom modifikacijom za
    insekticidna svojstva koja prenosi gen Bt-endotoksin i povišenom tolerancijom
    na herbicid glufosinat-amonijak, prema Direktivi Vijeća 90/220/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1997. január 23.) a Bt-endotoxin gén által
    inszekticid tulajdonságot és a glufozinát-ammónium gyomirtó szerrel szemben
    fokozott ellenálló képességet biztosító kombinált módosítással géntechnológiával
    módosított kukoricának (Zea mays L.) a 90/220/EGK tanácsi irányelv értelmében
    történő forgalomba hozataláról
  type: main
- language: it
  script: Latn
  content: '97/98/CE: Decisione della Commissione del 23 gennaio 1997 concernente
    l''immissione in commercio di granturco geneticamente modificato (Zea mays L.)
    sottoposto a una modificazione combinata che garantisce proprietà insetticide
    conferite dal gene della Bt-endotossina e una maggiore tolleranza all''erbicida
    glufosinato-ammonio ai sensi della direttiva 90/220/CEE del Consiglio'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1997. gada 23. janvāris) par ģenētiski modificētas
    kukurūzas (Zea mays L.) ar paaugstinātu toleranci pret glufozinātamonija herbicīdu
    un ar kombinēto modifikāciju attiecībā uz insekticīdām īpašībām, kuras
    dod Bt endotoksīna gēns, laišanu tirgū, ievērojot Padomes Direktīvu 90/220/EEK
  type: main
- language: lt
  script: Latn
  content: 1997 m. sausio 23 d. Komisijos sprendimas dėl genetiškai modifikuotų
    cukrinių kukurūzų (Zea mays L.), kurių insekticidinės savybės buvo kompleksiškai
    modifikuotos Bt-endotoksino genu ir kurie įgijo padidintą toleranciją herbicidui
    amonio glufozinatui, pateikimo į rinką remiantis Tarybos Direktyva 90/220/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-23 ta' Jannar 1997 dwar it-tpoġġija
    fis-suq tal-qamħirrun ġenetikament modifikat (Zea mays L.) bil-modifika kombinata
    għall-proprjetajiet insettiċidi mogħtija lilha mill-ġeni Bt-endotoxin u b'
    tolleranza akbar għall-erbiċida glufosinate ammonium skond id-Direttiva tal-Kunsill
    90/220/KEE
  type: main
- language: nl
  script: Latn
  content: '97/98/EG: Beschikking van de Commissie van 23 januari 1997 betreffende
    het overeenkomstig Richtlijn 90/220/EEG van de Raad in de handel brengen van genetisch
    gemodificeerde maïs (Zea mays L.) met de gecombineerde modificatie voor insectendodende
    eigenschappen door het Bt-endotoxinegen en voor verhoogde tolerantie voor het
    herbicide glufosinaatammonium'
  type: main
- language: pl
