    член 26, параграф 1, буква а) и членове 168 и 168а
    от Директива 2006/112/ЕО относно общата система
    на данъка върху добавената стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2021/1998 ze dne 15. listopadu 2021,
    kterým se Estonsku povoluje uplatňovat opatření odchylující se od čl. 26
    odst. 1 písm. a) a článků 168 a 168a směrnice 2006/112/ES o společném systému
    daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2021/1998 af 15. november 2021 om
    tilladelse til Estland til at anvende en foranstaltning, der fraviger artikel
    26, stk. 1, litra a), og artikel 168 og 168a i Rådets direktiv 2006/112/EF om
    det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/1998 του Συμβουλίου
