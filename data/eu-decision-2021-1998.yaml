    vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2021/1998 2021 m. lapkričio 15 d.
    kuriuo Estijai leidžiama taikyti priemonę, kuria nukrypstama nuo Direktyvos
    2006/112/EB dėl pridėtinės vertės mokesčio bendros sistemos 26 straipsnio
    1 dalies a punkto ir 168 bei 168a straipsnių
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2021/1998 tal-15 ta’
    Novembru 2021 li tawtorizza lill-Estonja tapplika miżura li tidderoga mill-Artikolu
    26(1), il-punt (a), u l-Artikoli 168 u 168a tad-Direttiva 2006/112/KE dwar is-sistema
    komuni ta’ taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/1998 van de Raad van 15 november 2021 waarbij
    Estland wordt gemachtigd een maatregel toe te passen die afwijkt van artikel 26,
    lid 1, punt a), en de artikelen 168 en 168 bis van Richtlijn 2006/112/EG betreffende
    het gemeenschappelijke stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2021/1998 z dnia 15 listopada 2021 r. upoważniająca
    Estonię do zastosowania środka stanowiącego odstępstwo od art. 26 ust. 1 lit.
    a), art. 168 i 168a dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku
    od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1998 do Conselho de 15 de novembro de
    2021 que autoriza a Estónia a aplicar uma medida em derrogação do artigo 26.o,
    n.o 1, alínea a), e dos artigos 168.o e 168.o-A da Diretiva 2006/112/CE relativa
    ao sistema comum do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1998 a Consiliului din 15 noiembrie
    2021 de autorizare a Estoniei să aplice o măsură de derogare de la articolul
    26 alineatul (1) litera (a) și de la articolele 168 și 168a din Directiva 2006/112/CE
    privind sistemul comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2021/1998 z 15. novembra 2021, ktorým
    sa Estónsku povoľuje zaviesť opatrenie odchyľujúce sa od článku 26 ods.
    1 písm. a) a článkov 168 a 168a smernice 2006/112/ES o spoločnom systéme
    dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2021/1998 z dne 15. novembra 2021 o dovoljenju
    Estoniji, da uporabi posebni ukrep, ki odstopa od točke (a) člena 26(1) ter
    členov 168 in 168a Direktive 2006/112/ES o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/1998 del Consejo de 15 de noviembre de
    2021 por la que se autoriza a Estonia a aplicar medidas de excepción al artículo
    26, apartado 1, letra a), y a los artículos 168 y 168 bis de la Directiva 2006/112/CE,
    relativa al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2021/1998 av den 15 november 2021 om bemyndigande
    för Estland att införa en särskild åtgärd som avviker från artiklarna 26.1
    a, 168 och 168a i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
