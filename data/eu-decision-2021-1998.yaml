  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1998 del Consiglio del 15 novembre 2021
    che autorizza l’Estonia ad applicare una misura di deroga all’articolo 26,
    paragrafo 1, lettera a), e agli articoli 168 e 168 bis della direttiva 2006/112/CE
