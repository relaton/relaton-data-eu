    (mis käsitleb ühist käibemaksusüsteemi) artikli 26 lõike 1 punktist a ning
    artiklitest 168 ja 168a
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2021/1998, annettu 15 päivänä
    marraskuuta 2021, luvan antamisesta Virolle ottaa käyttöön yhteisestä arvonlisäverojärjestelmästä
    annetun neuvoston direktiivin 2006/112/EY 26 artiklan 1 kohdan a alakohdasta,
    168 artiklasta ja 168 a artiklasta poikkeava erityistoimenpide
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2021/1998 od 15. studenog 2021. kojom se
