title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2021/1998 of 15 November 2021 authorising
    Estonia to apply a measure derogating from Article 26(1), point (a), and Articles
    168 and 168a of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1998 du Conseil du 15 novembre 2021
    autorisant l’Estonie à appliquer une mesure dérogatoire à l’article 26,
    paragraphe 1, point a), et aux articles 168 et 168 bis de la directive 2006/112/CE
    relative au système commun de taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1998 des Rates vom 15. November 2021
    zur Ermächtigung Estlands, eine von Artikel 26 Absatz 1 Buchstabe a sowie den
    Artikeln 168 und 168a der Richtlinie 2006/112/EG über das gemeinsame Mehrwertsteuersystem
    abweichende Regelung anzuwenden
  type: main
- language: bg
  script: Cyrl
