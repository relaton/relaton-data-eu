type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/435 of 3 March 2021 amending
    Commission Implementing Regulation (EU) No 288/2014 as regards changes to the
    models for operational programmes under the Investment for growth and jobs goal
    and under the European Territorial Cooperation goal to provide assistance under
    the thematic objective ‘Fostering crisis repair in the context of the COVID-19
    pandemic and its social consequences and preparing a green, digital and resilient
    recovery of the economy’
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/435 de la Commission du 3 mars 2021
    modifiant le règlement d’exécution (UE) no 288/2014 en ce qui concerne les
    modifications apportées au modèle destiné aux programmes opérationnels présentés
    au titre de l’objectif «Investissement pour la croissance et l’emploi» et
    au modèle destiné aux programmes de coopération présentés au titre de l’objectif
    «Coopération territoriale européenne» afin de fournir un soutien au titre
    de l’objectif thématique «Favoriser la réparation des dommages à la suite
    de la crise engendrée par la pandémie de COVID-19 et ses conséquences sociales
    et préparer une reprise écologique, numérique et résiliente de l’économie»
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/435 der Kommission vom 3. März 2021
    zur Änderung der Durchführungsverordnung (EU) Nr. 288/2014 hinsichtlich Änderungen
    der Muster für operationelle Programme im Rahmen des Ziels „Investitionen in
    Wachstum und Beschäftigung“ und des Ziels „Europäische territoriale Zusammenarbeit“
    zur Bereitstellung von Unterstützung im Rahmen des thematischen Ziels „Unterstützung
    der Krisenbewältigung im Zusammenhang mit der COVID-19-Pandemie und ihrer sozialen
    Folgen und Vorbereitung einer grünen, digitalen und stabilen Erholung der Wirtschaft“
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/435 на Комисията
    от 3 март 2021 година за изменение на Регламент
    за изпълнение (ЕС) № 288/2014 на Комисията по отношение
    на промени в образците на оперативните програми
    по цел „Инвестиции за растеж и работни места“
    и по цел „Европейско териториално сътрудничество“
    с цел предоставяне на помощ по тематичната
    цел „Улесняване на преодоляването на последиците
    от кризата в контекста на пандемията от COVID-19
    и социалните последици от нея и подготовка
    за екологично, цифрово и устойчиво възстановяване
    на икономиката“
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/435 ze dne 3. března 2021, kterým
    se mění prováděcí nařízení Komise (EU) č. 288/2014, pokud jde o změny
    vzorů pro operační programy v rámci cíle Investice pro růst a zaměstnanost
    a v rámci cíle Evropská územní spolupráce s cílem poskytovat pomoc v rámci
    tematického cíle „Podpora zotavení z krize v souvislosti s pandemií COVID-19
    a jejími sociálními dopady a příprava zeleného, digitálního a odolného
    oživení hospodářství“
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/435 af 3. marts 2021
    om ændring af gennemførelsesforordning (EU) nr. 288/2014 for så vidt angår
    ændringer af modellerne for operationelle programmer under målet om investeringer
    i vækst og beskæftigelse og under målet om europæisk territorialt samarbejde
    med henblik på at yde bistand under det tematiske mål »Fremme af kriseafhjælpning
    i forbindelse med covid-19-pandemien og dens sociale konsekvenser og forberedelse
    af en grøn, digital og modstandsdygtig genopretning af økonomien«
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/435 της Επιτροπής
    της 3ης Μαρτίου 2021 για την τροποποίηση του εκτελεστικού
    κανονισμού (ΕΕ) αριθ. 288/2014 της Επιτροπής όσον
    αφορά τις αλλαγές στα υποδείγματα για τα επιχειρησιακά
    προγράμματα στο πλαίσιο του στόχου «Επενδύσεις
    στην ανάπτυξη και την απασχόληση» και στο πλαίσιο
    του στόχου της ευρωπαϊκής εδαφικής συνεργασίας
    με σκοπό την παροχή βοήθειας στο πλαίσιο του
    θεματικού στόχου «Στήριξη της αποκατάστασης
    των συνεπειών της κρίσης, συμπεριλαμβανομένων
    των κοινωνικών, λόγω της πανδημίας COVID-19 και
    προετοιμασία μιας πράσινης, ψηφιακής και ανθεκτικής
    ανάκαμψης της οικονομίας»
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/435, 3. märts 2021, millega muudetakse
    komisjoni rakendusmäärust (EL) nr 288/2014 seoses majanduskasvu ja tööhõivesse
    investeerimise eesmärgi ning Euroopa territoriaalse koostöö eesmärgi alla
    kuuluvate rakenduskavade näidiste muutmisega, et anda abi valdkondliku eesmärgi
    „COVID-19 pandeemiaga seotud kriisi ja selle sotsiaalsete tagajärgede kõrvaldamine
    ning ettevalmistuste tegemine majanduse taastamiseks rohelisel, digitaalsel ja
    vastupidaval viisil“ raames
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/435, annettu 3 päivänä
    maaliskuuta 2021, komission täytäntöönpanoasetuksen (EU) N:o 288/2014 muuttamisesta
    siltä osin kuin on kyse Investoinnit kasvuun ja työpaikkoihin -tavoitteen ja
    Euroopan alueellinen yhteistyö -tavoitteen toimenpideohjelmien mallien muuttamisesta
    tuen myöntämiseksi temaattisen tavoitteen ”Covid-19-pandemian ja sen sosiaalisten
    seurausten aiheuttaman kriisin vahinkojen korjaamisen edistäminen sekä talouden
    vihreän, digitaalisen ja palautumiskykyä tukevan elpymisen pohjustaminen”
    puitteissa
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/435 ón gCoimisiún an 3 Márta 2021
    lena leasaítear Rialachán Cur Chun Feidhme (AE) Uimh. 288/2014 a mhéid a bhaineann
    le hathruithe ar na samhlacha do chláir oibríochtúla faoi sprioc na hInfheistíochta
    le haghaidh fáis agus post agus faoi sprioc an Chomhair Chríochaigh Eorpaigh
    chun cúnamh a sholáthar faoin gcuspóir téamach “Leigheas dhíobháil na
    géarchéime a chothú i gcomhthéacs phaindéim COVID-19 agus a hiarmhairtí
    sóisialta agus téarnamh glas, digiteach agus athléimneach a ullmhú don gheilleagar”
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/435 оd 3. ožujka 2021. o izmjeni
    Provedbene uredbe Komisije (EU) br. 288/2014 u pogledu modela za operativne programe
    u okviru cilja ulaganja u rast i radna mjesta i cilja europske teritorijalne suradnje
    radi pružanja pomoći u sklopu tematskog cilja „Sanacija krize u kontekstu
    pandemije bolesti COVID-19 i njezinih socijalnih posljedica te priprema zelenog,
    digitalnog i otpornog oporavka gospodarstva”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/435 végrehajtási rendelete (2021. március 3.)
    a 288/2014/EU bizottsági végrehajtási rendeletnek a „Beruházás a növekedésbe
    és munkahelyteremtésbe” célkitűzés és az európai területi együttműködési
    célkitűzés operatív programjaira vonatkozó modell vonatkozásában „A Covid19-világjárvány
    és társadalmi következményei okozta válság elhárításának előmozdítása
    és a zöld, digitális és reziliens gazdasági helyreállítás előkészítése”
    elnevezésű tematikus célkitűzés címén nyújtható támogatás miatt szükséges
    változtatások tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/435 della Commissione del 3 marzo 2021
    recante modifica del regolamento di esecuzione (UE) n. 288/2014 per quanto riguarda
    le modifiche dei modelli per i programmi operativi nell’ambito dell’obiettivo
    Investimenti in favore della crescita e dell’occupazione e dell’obiettivo
    di cooperazione territoriale europea volte a fornire assistenza nell’ambito
    dell’obiettivo tematico «Promuovere il superamento degli effetti della crisi
    nel contesto della pandemia di COVID-19 e delle sue conseguenze sociali e preparare
    una ripresa verde, digitale e resiliente dell’economia»
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/435 (2021. gada 3. marts), ar
    ko Īstenošanas regulu (ES) Nr. 288/2014 groza attiecībā uz izmaiņām darbības
    programmu paraugos atbilstīgi mērķim “Investīcijas izaugsmei un nodarbinātībai”
    un mērķim “Eiropas teritoriālā sadarbība”, lai sniegtu palīdzību saskaņā
    ar tematisko mērķi “Palīdzēt veicināt ar Covid-19 pandēmiju un tās sociālajām
    sekām saistītās krīzes seku pārvarēšanu un sagatavoties zaļas, digitālas
    un noturīgas ekonomikas atveseļošanai”
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/435 2021 m. kovo 3 d. kuriuo
    dėl investicijų į ekonomikos augimą ir darbo vietų kūrimą tikslo ir Europos
    teritorinio bendradarbiavimo tikslo veiksmų programų modelių pakeitimų tam,
    kad būtų galima teikti paramą pagal teminį tikslą „Veiksmų, skirtų COVID-19
    pandemijos sukeltai krizei ir jos socialiniams padariniams įveikti, skatinimas
    ir pasirengimas žaliajam, skaitmeniniam ir atspariam ekonomikos atgaivinimui“,
    iš dalies keičiamas Komisijos įgyvendinimo reglamentas (ES) Nr. 288/2014
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/435 tat-3 ta’
    Marzu 2021 li jemenda r-Regolament ta’ Implimentazzjoni (UE) Nru 288/2014 fir-rigward
    tal-bidliet fil-mudell għall-programmi operazzjonali skont l-Investiment għall-mira
    tat-tkabbir u l-impjiegi u skont l-għan ta’ kooperazzjoni territorjali Ewropea
    li tingħata assistenza taħt l-objettiv tematiku “It-trawwim tat-tiswija tal-kriżijiet
    fil-kuntest tal-pandemija tal-COVID-19 u l-konsegwenzi soċjali tagħha u t-tħejjija
    ta’ rkupru ekoloġiku, diġitali u reżiljenti tal-ekonomija”
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/435 van de Commissie van 3 maart 2021
    tot wijziging van Uitvoeringsverordening (EU) nr. 288/2014 van de Commissie wat
    betreft wijzigingen in de modellen voor operationele programma’s in het kader
    van de doelstelling “investeren in groei en werkgelegenheid” en de doelstelling
    “Europese territoriale samenwerking”, om bijstand te verlenen in het kader
    van de thematische doelstelling “de bevordering van het crisisherstel in de
    context van de COVID-19-pandemie en de sociale gevolgen daarvan en de voorbereiding
    van een groen, digitaal en veerkrachtig herstel van de economie”
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/435 z dnia 3 marca 2021 r.
    zmieniające rozporządzenie wykonawcze (UE) nr 288/2014 w odniesieniu do zmian
    we wzorach programów operacyjnych w ramach celu „Inwestycje na rzecz wzrostu
    i zatrudnienia” oraz w ramach celu „Europejska współpraca terytorialna”,
    aby zapewnić pomoc w ramach celu tematycznego „Wspieranie kryzysowych działań
    naprawczych w kontekście pandemii COVID-19 i jej skutków społecznych oraz przygotowanie
    do ekologicznej i cyfrowej odbudowy gospodarki zwiększającej jej odporność”
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/435 da Comissão de 3 de março de
    2021 que altera o Regulamento de Execução (UE) n.o 288/2014 no que diz respeito
    às alterações dos modelos para os programas operacionais no âmbito do objetivo
    de Investimento no Crescimento e no Emprego e do objetivo de Cooperação Territorial
    Europeia para prestar assistência no âmbito do objetivo temático «Promover
    a recuperação da crise no contexto da pandemia de COVID-19 e respetivas consequências
    sociais e preparar uma recuperação ecológica, digital e resiliente da economia»
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/435 al Comisiei din 3 martie
    2021 de modificare a Regulamentului de punere în aplicare (UE) nr. 288/2014 al
    Comisiei în ceea ce privește modificările aduse modelelor pentru programele
    operaționale din cadrul obiectivului privind investițiile pentru creștere economică
    și locuri de muncă și din cadrul obiectivului de cooperare teritorială europeană,
    pentru a oferi asistență în cadrul obiectivului tematic „Sprijinirea ameliorării
    efectelor provocate de criză în contextul pandemiei de COVID-19 și al consecințelor
    sale sociale și pregătirea unei redresări verzi, digitale și reziliente a
    economiei”
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/435 z 3. marca 2021, ktorým
    sa mení vykonávacie nariadenie Komisie (EÚ) č. 288/2014, pokiaľ ide o zmeny
    vzorov operačných programov v rámci cieľa Investovanie do rastu a zamestnanosti
    a v rámci cieľa Európska územná spolupráca s cieľom poskytnúť pomoc v
    rámci tematického cieľa „Podpora obnovy po kríze spojenej s pandémiou COVID-19
    vrátane jej sociálnych dôsledkov a príprava zeleného, digitálneho a odolného
    oživenia hospodárstva“
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/435 z dne 3. marca 2021 o spremembi
    Izvedbene uredbe Komisije (EU) št. 288/2014 glede sprememb vzorcev za operativne
    programe v okviru ciljev „naložbe za rast in delovna mesta“ in „evropsko
    teritorialno sodelovanje“ zaradi zagotovitve pomoči v okviru tematskega cilja
    „spodbujanje odprave posledic krize v okviru pandemije COVID-19 in njenih socialnih
    posledic ter priprava zelenega, digitalnega in odpornega okrevanja gospodarstva“
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/435 de la Comisión de 3 de marzo de
    2021 por el que se modifica el Reglamento de Ejecución (UE) n.o 288/2014 por
    lo que respecta a las modificaciones en los modelos para los programas operativos
    en el marco del objetivo de inversión en crecimiento y empleo y del objetivo
    de cooperación territorial europea para proporcionar asistencia en el marco del
    objetivo temático «Favorecer la reparación de la crisis en el contexto de la
    pandemia de COVID-19 y sus consecuencias sociales y preparar una recuperación
    verde, digital y resiliente de la economía»
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/435 av den 3 mars 2021
    om ändring av genomförandeförordning (EU) nr 288/2014 vad gäller ändring
    av mallarna för operativa program inom målet Investering för tillväxt och
    sysselsättning och inom målet Europeiskt territoriellt samarbete, i syfte att
    tillhandahålla stöd inom det tematiska målet Främjande av krisreparation i
    samband med covid-19-pandemin och dess sociala konsekvenser och förberedande
    av en grön, digital och resilient återhämtning av ekonomin
