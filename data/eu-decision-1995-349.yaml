title:
- language: en
  script: Latn
  content: '95/349/EC: Commission Decision of 26 July 1995 amending Decision 93/402/EEC
    concerning animal health conditions and veterinary certification for imports of
    fresh meat from certain South American countries, in order to take account of
    information concerning the State of Goias (Brazil) and Argentina'
  type: main
- language: fr
  script: Latn
  content: '95/349/CE: Décision de la Commission, du 26 juillet 1995, modifiant la
    décision 93/402/CEE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l'' importation de viandes fraîches en provenance de
    certains pays de l'' Amérique du Sud, en vue de tenir compte de certains éléments
    concernant l'' État de Goiás (Brésil) et l'' Argentine'
  type: main
- language: de
  script: Latn
  content: '95/349/EG: Entscheidung der Kommission vom 26. Juli 1995 zur Änderung
    der Entscheidung 93/402/EWG über die Veterinärbedingungen und Veterinärzeugnisse
    für die Einfuhr von frischem Fleisch aus bestimmten südamerikanischen Ländern
    hinsichtlich des brasilianischen Bundesstaates Goias und der Argentinischen Republik'
  type: main
- language: da
  script: Latn
  content: '95/349/EF: Kommissionens beslutning af 26. juli 1995 om ændring af beslutning
    93/402/EØF om dyresundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved indførsel af fersk kød fra bestemte lande i Sydamerika for at tage hensyn
    til forhold vedrørende staten Goias (Brasilien) og Argentina'
  type: main
- language: el
  script: Grek
  content: '95/349/ΕΚ: Απόφαση της Επιτροπής της 26ης Ιουλίου
    1995 περί τροποποιήσεως της απόφασης 93/402/ΕΟΚ
    σχετικά με τους όρους υγειονομικού ελέγχου
    και την κτηνιατρική πιστοποίηση που απαιτούνται
    κατά την εισαγωγή νωπών κρεάτων προελεύσεως
    ορισμένων χωρών της Νοτίου Αμερικής, για να
    ληφθούν υπόψη ορισμένα στοιχεία που αφορούν
    την πολιτεία Goias (Βραζιλία) και την Αργεντινή'
  type: main
- language: fi
  script: Latn
  content: '95/349/EY: Komission päätös, tehty 26 päivänä heinäkuuta 1995,
    eläinten terveyttä koskevista edellytyksistä ja eläinlääkärintodistuksista
    tuoreen lihan tuonnissa tietyistä Etelä-Amerikan maista tehdyn päätöksen
    93/402/ETY muuttamisesta tiettyjen Brasilian Goiásin osavaltiota ja Argentiinaa
    koskevien seikkojen huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '95/349/CE: Decisione della Commissione, del 26 luglio 1995, che modifica
    la decisione 93/402/CEE relativa alle condizioni di polizia sanitaria ed alla
    certificazione veterinaria cui è subordinata l'' importazione di carni fresche
    provenienti da taluni paesi dell'' America del Sud, per tener conto della situazione
    sanitaria nella Stato di Goias (Brasile) e in Argentina'
  type: main
- language: nl
  script: Latn
  content: '95/349/EG: Beschikking van de Commissie van 26 juli 1995 tot wijziging
    van Beschikking 93/402/EEG betreffende veterinairrechtelijke voorschriften en
    veterinaire certificering voor de invoer van vers vlees uit landen van Zuid-Amerika,
    om rekening te houden met bepaalde elementen inzake de Staat Goias (Brazilië)
    en Argentinië'
  type: main
- language: pt
  script: Latn
  content: '95/349/CE: Decisão da Comissão, de 26 de Julho de 1995, que altera a
    Decisão 93/402/CEE relativa às condições de polícia sanitária e à certificação
    veterinária requeridas para a importação de carne fresca proveniente de determinados
    países da América do Sul, com vista a ter em conta determinados elementos relativos
    ao Estado de Goiás (Brasil) e à Argentina'
  type: main
- language: es
  script: Latn
  content: '95/349/CE: Decisión de la Comisión, de 26 de julio de 1995, por la que
    se modifica la Decisión 93/402/CEE, relativa a las condiciones de policía sanitaria
    y a la certificación veterinaria requeridas para la importación de carnes frescas
    procedentes de países de América del Sur, para tener en cuenta algunos elementos
    referentes al Estado brasileño de Goiás y a Argentina'
  type: main
- language: sv
  script: Latn
  content: '95/349/EG: Kommissionens beslut av den 26 juli 1995 om ändring av beslut
    93/402/EEG om djurhälsovillkor och veterinärintyg för import av färskt kött
    från länder i Sydamerika i syfte att beakta vissa förhållanden i delstaten
    Goias, (Brasilien) och Argentina'
  type: main
