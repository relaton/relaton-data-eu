title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1214/70 du Conseil, du 29 juin 1969, fixant, pour
    la campagne 1970/1971, les prix d'intervention du riz paddy, les prix de seuil
    du riz décortiqué et des brisures, et le montant de protection à inclure dans
    le prix du seuil du riz blanchi
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1214/70 des Rates vom 29. Juni 1970 zur Festsetzung
    des Interventionspreises für Rohreis, der Schwellenpreise für geschälten Reis
    und Bruchreis und des in den Schwellenpreis für vollständig geschliffenen Reis
    einzubeziehenden Schutzbetrags für das Wirtschaftsjahr 1970/1971
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1214/70 del Consiglio, del 29 giugno 1970, che fissa
    i prezzi d'intervento del risone, i prezzi d'entrata del riso semigreggio e delle
    rotture di riso e l'importo di protezione da includere nel prezzo d'entrata del
    riso lavorato, per la campagna 1970/1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) Nr. 1214/70 van de Raad van 29 juni 1970 houdende vaststelling
    voor het verkoopseizoen 1970/1971 van de interventieprijzen voor padie, de drempelprijzen
    voor gedopte rijst en breukrijst en het in de drempelprijs voor volwitte rijst
    op te nemen bedrag voor industriële bescherming
  type: main
