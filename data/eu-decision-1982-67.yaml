  script: Latn
  content: '82/67/EEC: Commission Decision of 21 December 1981 establishing that the
    apparatus described as ''TSI-laser anemometer system, consisting of: base for
    argon ion laser ; mirror system ; risers, model 9177 ; rotating mount, model 9178,
    model 9179 ; beam splitter, model 9115-1 ; ring mount, model 9176 ; beam spacer,
    model 9113-9 ; model 9113-22 ; receiving assembly, model 9140 ; photomultiplier
    system, model 9160 ; counter, model 1990A ; interface for minicomputer, model
    1998D'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/67/CEE: Décision de la Commission, du 21 décembre 1981, constatant
    que l''importation de l''appareil dénommé "T.S.I. - Laser Anemometer System,
    consisting of: - base for argon ion laser; - mirror system; - risers, model 9177;
    - rotating mount, model 9178, model 9179; - beam splitter, model 9115-1; - ring
    mount, model 9176; - beam spacer, model 9113-9, model 9113-22; - receiving assembly,
    model 9140; - photomultiplier system, model 9160; - counter, model 1990 A; - interface
    for minicomputer, model 1998 D" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/67/EWG: Entscheidung der Kommission vom 21. Dezember 1981, mit der
