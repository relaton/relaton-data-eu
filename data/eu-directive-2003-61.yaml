    o obchodovaní s osivom olejnín a priadnych rastlín pokiaľ ide o porovnávacie
    skúšky a pokusy Komisie
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2003/61/ES z dne 18. junija 2003 o spremembi direktiv 66/401/EGS
    o trženju semena krmnih rastlin, 66/402/EGS o trženju semena žit, 68/193/EGS
    o trženju materiala za vegetativno razmnoževanje vinske trte, 92/33/EGS o trženju
    razmnoževalnega in sadilnega materiala zelenjadnic, razen semena, 92/34/EGS o
    trženju razmnoževalnega in sadilnega materiala sadnih rastlin, 98/56/ES o trženju
    razmnoževalnega materiala okrasnih rastlin, 2002/54/ES o trženju semena pese,
    2002/55/ES o trženju semena zelenjadnic, 2002/56/ES o trženju semenskega krompirja
    in 2002/57/ES o trženju semena oljnic in predivnic, glede primerjalnih testov
    in poskusov Skupnosti
  type: main
- language: es
  script: Latn
  content: Directiva 2003/61/CE del Consejo, de 18 de junio de 2003, por la que se
    modifican, con respecto a las pruebas y análisis comparativos comunitarios, la
    Directiva 66/401/CEE, relativa a la comercialización de las semillas de plantas
    forrajeras, la Directiva 66/402/CEE, relativa a la comercialización de las semillas
    de cereales, la Directiva 68/193/CEE, referente a la comercialización de los
    materiales de multiplicación vegetativa de la vid, la Directiva 92/33/CEE, relativa
    a la comercialización de plantones de hortalizas y de materiales de multiplicación
    de hortalizas, distintos de las semillas, la Directiva 92/34/CEE, relativa a la
    comercialización de materiales de multiplicación de frutales y de plantones
    de frutal destinados a la producción frutícola, la Directiva 98/56/CE, relativa
    a la comercialización de los materiales de reproducción de las plantas ornamentales,
    la Directiva 2002/54/CE, relativa a la comercialización de las semillas de remolacha,
    la Directiva 2002/55/CE, referente a la comercialización de semillas de plantas
    hortícolas, la Directiva 2002/56/CE, relativa a la comercialización de patatas
    de siembra, y la Directiva 2002/57/CE, relativa a la comercialización de semillas
    de plantas oleaginosas y textiles
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 2003/61/EG av den 18 juni 2003 om ändring av direktiven
    66/401/EEG om saluföring av utsäde av foderväxter, 66/402/EEG om saluföring
    av utsäde av stråsäd, 68/193/EEG om saluföring av vegetativt förökningsmaterial
    av vinstockar, 92/33/EEG om saluförande av annat föröknings- och plantmaterial
    av grönsaker än utsäde, 92/34/EEG om saluföring av fruktplantsförökningsmaterial
    och fruktplantor avsedda för fruktproduktion, 98/56/EG om saluföring av förökningsmaterial
    av prydnadsväxter, 2002/54/EG om saluföring av betutsäde, 2002/55/EG om saluföring
    av utsäde av köksväxter, 2002/56/EG om saluföring av utsädespotatis och 2002/57/EG
    om saluföring av utsäde av olje- och spånadsväxter vad gäller gemenskapens
    jämförande kontrollodlingar och analyser
