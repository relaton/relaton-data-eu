title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2539/82 of 20 September 1982 fixing the
    difference in white sugar prices to be used in calculating the levy for processed
    fruit and vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2539/82 de la Commission, du 20 septembre 1982, fixant
    la différence de prix du sucre blanc applicable pour le calcul du prélèvement
    dans le secteur des produits transformés à base de fruits et légumes et dans
    le secteur viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2539/82 der Kommission vom 20. September 1982 zur
    Festsetzung des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse
    aus Obst und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds
    zwischen Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2539/82 af 20. september 1982 om fastsættelse
    af den prisforskel for hvidt sukker, som anvendes ved afgiftsberegningen for produkter
    forarbejdet på basis af frugt og grønsager og for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2539/82 της Επιτροπής
    της 20ής Σεπτεμβρίου 1982 περί καθορισμού της
    διαφοράς των τιμών λευκής ζάχαρης η οποία λαμβάνεται
    υπόψη για τον υπολογισμό της εισφοράς στον
    τομέα των μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά και στον αμπελοοινικό τομέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2539/82 della Commissione, del 20 settembre 1982,
    che fissa la differenza di prezzo dello zucchero bianco applicabile per il calcolo
    del prelievo nel settore dei prodotti trasformati a base di ortofrutticoli e nel
    settore vitivinicolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2539/82 van de Commissie van 20 september 1982 tot
    vaststelling van het prijsverschil voor witte suiker dat wordt toegepast bij de
    berekening van de heffing in de sector van op basis van groenten en fruit verwerkte
    produkten en in de wijnsector
