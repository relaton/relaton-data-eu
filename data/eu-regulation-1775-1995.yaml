  content: COMMISSION REGULATION (EC) No 1775/95 of 24 July 1995 determining the extent
    to which applications lodged in July 1995 for import certificates for certain
    cheeses covered by the arrangements provided for in the Interim Agreements concluded
    by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1775/95 DE LA COMMISSION du 24 juillet 1995 déterminant
