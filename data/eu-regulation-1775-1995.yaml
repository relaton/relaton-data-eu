    für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1775/95 af 24. juli 1995 om fastsættelse
