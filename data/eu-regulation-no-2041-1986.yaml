title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2041/86 of 30 June 1986 re-establishing
    the levying of customs duties on rosin and resin acids, rosin spirit and rosin
    oils, falling within heading No 38.08 originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2041/86 de la Commission du 30 juin 1986 portant rétablissement
    de la perception des droits de douane applicables aux colophanes et acides résiniques,
    essence de colophane et huiles de colophanes, de la position 38.08 du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2041/86 der Kommission vom 30. Juni 1986 zur Wiedereinführung
    der Erhebung der Zölle für Kolophonium, Harzsäuren, leichte und schwere Harzöle
    der Tarifnummer 38.08 des Gemeinsamen Zolltarifs mit Ursprung in China, dem die
    in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2041/86 af 30. juni 1986 om genindførelse
    af opkrævning af told for colophonium og harpikssyrer, harpiksessens (pinolin)
    og harpiksolier, henhørende under pos. 38.08 og med oprindelse i Kina, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
