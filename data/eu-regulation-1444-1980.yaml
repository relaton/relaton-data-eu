id: EURegulation14441980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1444/80 of 9 June 1980 re-establishing the
    levying of customs duties on yarn of sheep' s or lambs' wool or of fine animal
    hair, put up for retail sale, products of category 49 (code 0490), originating
    in Uruguay, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1444/80 de la Commission, du 9 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine ou de poils fins, conditionnés pour la vente au détail, de la catégorie
    49 (code 0490), originaires d' Uruguay, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1444/80 der Kommission vom 9. Juni 1980 über die
    Wiedereinführung des Zollsatzes für Garne aus Wolle oder aus feinen Tierhaaren,
    in Aufmachungen für den Einzelverkauf, der Warenkategorie Nr. 49 (Kennziffer
    0490), mit Ursprung in Uruguay, dem die in der Verordnung (EWG) Nr. 2894/79 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1444/80 af 9. juni 1980 om genindførelse
    af opkrævning af toldafgifter for garn af uld eller fine dyrehår, i detailsalgsoplægninger,
    under kategori 49 (kode 0490), som har oprindelse i Uruguay og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1444/80 della Commissione, del 9 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana o di
    peli fini, preparati per la vendita al minuto, della categoria di prodotti n.
    49 (codice 0490), originari dell' Uruguay, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1444/80 van de Commissie van 9 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    wol of van fijn haar, gereed voor de verkoop in het klein, van de categorie van
    produkten nr. 49 (codenummer 0490), van oorsprong uit Uruguay, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
