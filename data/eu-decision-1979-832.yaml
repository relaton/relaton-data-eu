title:
- language: en
  script: Latn
  content: '79/832/EEC: Commission Decision of 7 September 1979 setting out the tables
    relating to the classification of agricultural holdings on the basis of a Community
    typology, the method of their transcription on to magnetic tape and the deadline
    for their transmission for the purposes of the survey on the structure of agricultural
    holdings for 1977'
  type: main
- language: fr
  script: Latn
  content: '79/832/CEE: Décision de la Commission, du 7 septembre 1979, fixant les
    tableaux relatifs à la classification des exploitations agricoles selon une typologie
    communautaire, les modalités de leur transcription sur bande magnétique et la
    date limite pour leur transmission en vue de l'' enquête sur la structure des
    exploitations agricoles en 1977'
  type: main
- language: de
  script: Latn
  content: '79/832/EWG: Entscheidung der Kommission vom 7. September 1979 zur Festlegung
    der Tabellen mit der Einteilung der landwirtschaftlichen Betriebe nach einem gemeinschaftlichen
    Klassifizierungssystem zur Festlegung der Modalitäten der Übertragung dieser
    Tabellen auf Magnetband und der Frist für ihre Übermittlung im Rahmen der Strukturerhebung
    bei den landwirtschaftlichen Betrieben 1977'
  type: main
- language: da
  script: Latn
  content: '79/832/EØF: Kommissionens beslutning af 7. september 1979 om opstilling
    af tabellerne vedrørende klassificering af landbrugsbedrifter ifølge en fællesskabssystematik,
    om de nærmere bestemmelser om overførelsen af disse tabeller på magnet samt
    om fristen for indsendelse af disse magnetbånd med henblik på undersøgelsen
    af landbrugsbedrifternes struktur i 1977'
  type: main
- language: el
  script: Grek
  content: '79/832/EOK: Απόφαση τής Επιτροπής τής 7ης Σεπτεμβρίου
    1979 περί καθορισμού τών πινάκων σχετικά μέ τήν
    ταξινόμηση τών γεωργικών εκμεταλλεύσεων, σύμφωνα
    μέ μία κοινοτική τυπολογία, τών λεπτομερειών
    μεταγραφής τους σέ μαγνητική ταινία καί τής
    τελικής ημερομηνίας γιά τή διαβίβασή τους
    εν όψει τής έρευνας επί τής διαρθρώσεως τών
    γεωργικών εκμεταλλεύσεων γιά τό 1977'
  type: main
- language: it
  script: Latn
  content: '79/832/CEE: Decisione della Commissione, del 7 settembre 1979, che stabilisce,
    ai fini dell'' indagine sulla struttura delle aziende agricole 1977, le tabelle
    relative alla classificazione delle aziende agricole secondo una tipologia comunitaria
    e fissa le modalità della loro trascrizione su nastro magnetico e la data limite
    per la trasmissione'
  type: main
- language: nl
  script: Latn
  content: '79/832/EEG: Beschikking van de Commissie van 7 september 1979 houdende
    vaststelling van de tabellen voor de classificatie van de landbouwbedrijven volgens
    een communautaire typologie, de wijze van opneming ervan op magneetband en de
    uiterste datum voor de toezending van deze tabellen voor de enquête inzake de
    structuur van de landbouwbedrijven 1977'
  type: main
