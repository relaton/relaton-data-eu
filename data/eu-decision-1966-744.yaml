title:
- language: fr
  script: Latn
  content: Décision 66/744/CEE du Conseil du 22 décembre 1966, portant suspension
    totale des droits du Tarif douanier commun applicables à certains produits utilisés
    à des fins d'entretien ou de réparation sur des avions d'un poids à vide supérieur
    à 15.000 kg
  type: main
- language: de
  script: Latn
  content: '66/744/EWG: Entscheidung des Rates vom 22. Dezember 1966 über die vollständige
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für bestimmte Erzeugnisse,
    die zur Instandhaltung oder Reparatur von Luftfahrzeugen mit einem Leergewicht
    von mehr als 15 000 kg verwendet werden'
  type: main
- language: it
  script: Latn
  content: '66/744/CEE: Decisione del Consiglio, del 22 dicembre 1966, recante sospensione
    totale dei dazi della tariffa doganale comune applicabili ad alcuni prodotti utilizzati
    per l''equipaggiamento, la manutenzione o la riparazione di aeroplani del peso
    a vuoto superiore a 15.000 kg'
  type: main
- language: nl
  script: Latn
  content: '66/744/EEG: Beschikking van de Raad van 22 december 1966 houdende algehele
    schorsing van de rechten van het gemeenschappelijk douanetarief voor sommige produkten
    welke worden gebruikt voor onderhoud of reparatie van vliegtuigen met een leeggewicht
    van meer dan 15.000 kilogram'
  type: main
