title:
- language: en
  script: Latn
  content: '83/96/EEC: Commission Decision of 25 February 1983 authorizing Ireland
    and the United Kingdom temporarily to take additional measures to protect themselves
    against the introduction of Dendroctonos micans (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/96/CEE: Décision de la Commission du 25 février 1983 autorisant l''Irlande
    et le Royaume-Uni à prendre à titre temporaire des dispositions complémentaires
    en vue de se préserver contre l''introduction du "Dendroctonus micans" (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/96/EWG: Entscheidung der Kommission vom 25. Februar 1983 zur Ermächtigung
    Irlands und des Vereinigten Königreichs, zum Schutz gegen die Einschleppung von
    Dendroctonus micans vorübergehend ergänzende Maßnahmen zu treffen (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/96/EØF: Kommissionens beslutning af 25. februar 1983 om bemyndigelse
    af Irland og Det forenede Kongerige til midlertidigt at træffe supplerende foranstaltninger
    til beskyttelse mod indslæbning af Dendroctonus micans (Kun den engelske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/96/ΕΟΚ: Απόφαση της Επιτροπής της 25ης Φεβρουαρίου
    1983 που επιτρέπει στην Ιρλανδία και το Ηνωμένο
    Βασίλειο να λάβουν, προσωρινά, συμπληρωματικά
    μέτρα για να προστατευθούν από την εισαγωγή
    του Dendroctonus micans (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/96/CEE: Decisione della Commissione del 25 febbraio 1983 che autorizza
    l''Irlanda e il Regno Unito ad adottare a titolo provisorio disposizioni complementari
    per premunirsi contro l''introduzione di Dendroctonus micans (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/96/EEG: Beschikking van de Commissie van 25 februari 1983 tot machtiging
    van Ierland en van het Verenigd Koninkrijk om tijdelijk aanvullende maatregelen
    te nemen ten einde het binnenbrengen op hun grondgebied van Dendroctonus micans
    te voorkomen (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '83/96/CEE: Decisión de la Comisión de 25 de febrero de 1983 por la que
    se autoriza a Irlanda y al Reino Unido a adoptar con caracter temporal disposiciones
    complementarias para protegerse contra la introducción del dendroctonus micans
    (El texto en lengua inglesa es el único auténtico)'
  type: main
