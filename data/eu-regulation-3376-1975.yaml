  content: Regulation (EEC) No 3376/75 of the Commission of 23 December 1975 laying
    down rules for the application of Council Regulation (EEC) No 3328/75 renewing
    the arrangements for the reduction of import charges on beef and veal products
    originating in the African, Caribbean and Pacific States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3376/75 de la Commission, du 23 décembre 1975, fixant
    les modalités d'application du règlement (CEE) n° 3328/75 du Conseil portant
    reconduction du régime de diminution des charges à l'importation de produits
    du secteur de la viande bovine originaires des États d'Afrique, des Caraïbes
    et du Pacifique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3376/75 der Kommission vom 23. Dezember 1975 zur Festlegung
    der Durchführungsbestimmungen zur Verordnung (EWG) Nr. 3328/75 des Rates zur
    Beibehaltung der Senkung der Einfuhrbelastung für Rindfleischerzeugnisse mit
    Ursprung in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3376/75 af 23. december 1975 om fastsættelse
