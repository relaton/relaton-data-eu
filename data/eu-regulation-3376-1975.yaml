    forlængelse af ordningen med nedsatte importbelastninger for varer inden for
    oksekødsektoren med oprindelse i staterne i Afrika, Vestindien og Stillehavet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3376/75 della Commissione, del 23 dicembre 1975, che
    fissa le modalità d'applicazione del regolamento (CEE) n. 3328/75 del Consiglio,
    che proroga il regime di riduzione degli oneri all'importazione di prodotti del
    settore delle carni bovine originari degli Stati africani, dei Caraibi e del Pacifico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3376/75 van de Commissie van 23 december 1975 houdende
    vaststelling van de uitvoeringsbepalingen van Verordening (EEG) nr. 3328/75 van
    de Raad tot verlenging van de regeling inzake de verlaging van de belasting bij
    invoer van produkten in de sector rundvlees van oorsprong uit de Staten in Afrika,
    het Caribische gebied en de Stille Oceaan
