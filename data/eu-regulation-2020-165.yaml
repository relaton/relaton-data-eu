title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/165 of 5 February 2020 concerning
    the authorisation of endo-1,4-beta-mannanase produced by Paenibacillus lentus
    DSM 32052 as a feed additive for chickens for fattening, for chickens reared for
    laying, turkeys for fattening or reared for breeding and for minor poultry species
    and repealing Regulation (EC) No 786/2007 (holder of authorisation Elanco GmbH)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2020/165 de la Commission du 5 février
    2020 concernant l’autorisation de l’endo-1,4-bêta-mannanase produite par
    Paenibacillus lentus (DSM 32052) en tant qu’additif pour l’alimentation des
    poulets d’engraissement, des poulettes élevées pour la ponte, des dindes/dindons
    d’engraissement ou élevés pour la reproduction et des espèces mineures de
    volailles, et abrogeant le règlement (CE) no 786/2007 (titulaire de l’autorisation:
    Elanco GmbH)'
  type: main
- language: de
  script: Latn
