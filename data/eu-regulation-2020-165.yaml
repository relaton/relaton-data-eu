    Futtermittelzusatzstoff für Masthühner, Junghennen, Masttruthühner, Jungtruthühner
    für die Zucht und Geflügelarten von geringerer wirtschaftlicher Bedeutung sowie
    zur Aufhebung der Verordnung (EG) Nr. 786/2007 (Zulassungsinhaber: Elanco GmbH)'
