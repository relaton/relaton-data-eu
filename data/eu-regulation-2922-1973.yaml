id: EURegulation29221973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2922/73 of the Commission of 26 October 1973 re-establishing
    Common Customs Tariff duties on men' s and boys' outer garments, other than of
    cotton, of heading No ex 61.01 of the Common Customs Tariff, originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2629/73 of 26 September 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2922/73 de la Commission, du 26 octobre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour hommes et garçonnets, en tissus autres que de coton,
    de la position tarifaire ex 61.01, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2629/73 du Conseil du 26 septembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2922/73 der Kommission vom 26. Oktober 1973 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberkleidung
    für Männer und Knaben, aus anderen Geweben als aus Baumwolle, der Tarifnummer
    ex 61.01, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2629/73 des Rates vom 26. September 1973 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2922/73 af 26. oktober 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for yderbeklædningsgenstande til mænd
    og drenge, undtagen af bomuld, under position ex 60.01, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2629/73 af 26.september 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2922/73 della Commissione, del 26 ottobre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni per uomo e per ragazzo, in tessuti non di cotone, della voce
    doganale n. ex 61.01 originari dei paesi in via di sviluppo beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2629/73 del Consiglio,
    del 26 settembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2922/73 van de Commissie van 26 oktober 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op herenbovenkleding en jongensbovenkleding van andere weefsels
    dan van katoen, van tariefpost ex 61.01, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2629/73 van de Raad van 26 september
    1973 algemene tariefpreferenties werden geopend
  type: main
