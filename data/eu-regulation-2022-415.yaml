    ασβεστίου και του προπιονικού αμμωνίου, του
    μυρμηκικού οξέος, του μυρμηκικού νατρίου, του
    μυρμηκικού ασβεστίου και του μυρμηκικού αμμωνίου
    και του γαλακτικού οξέος που παράγεται από
    Bacillus coagulans (LMG S-26145 ή DSM 23965) ή Bacillus smithii (LMG S-27890)
