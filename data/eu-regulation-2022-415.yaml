    niger DSM 25794 nó CGMCC 4513/CGMCC 5751 nó CICC 40347/CGMCC 5343, aigéad sorbach
    agus sorbáit photaisiam, aigéad aicéiteach, dé-aicéatáit sóidiam agus aicéatáit
    chailciam, aigéad próipianach, próipianáit sóidiam, próipianáit chailciam
    agus próipianáit amóiniam, aigéad formach, formáit sóidiam, formáit chailciam
    agus formáit amóiniam, agus aigéad lachtach arna tháirgeadh ag Bacillus coagulans
    (LMG S-26145 nó DSM 23965), nó Bacillus smithii (LMG S-27890) nó Bacillus subtilis
    (LMG S-27889) agus lachtáit chailciam a údarú mar bhreiseáin bheathaithe le
    haghaidh gach speicis ainmhíoch
  type: main
