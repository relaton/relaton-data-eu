title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2268/2003 of 22 December 2003 extending the
    validity of Regulation (EC) No 812/2003 on transitional measures pursuant to Regulation
    of the European Parliament and of the Council (EC) No 1774/2002 as regards the
    importation and transit of certain products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2268/2003 de la Commission du 22 décembre 2003 prorogeant
    la validité du règlement (CE) n° 812/2003 portant mesures transitoires, en
    vertu du règlement (CE) n° 1774/2002 du Parlement européen et du Conseil en
    ce qui concerne l'importation et le transit de certains produits en provenance
    de pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2268/2003 der Kommission vom 22. Dezember 2003 zur
    Verlängerung der Geltungsdauer der Verordnung (EG) Nr. 812/2003 betreffend Übergangsregelungen
    gemäß der Verordnung (EG) Nr. 1774/2002 des Europäischen Parlaments und des
    Rates hinsichtlich der Einfuhr und Durchfuhr bestimmter Produkte aus Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2268/2003 af 22. december 2003 om forlængelse
    af gyldighedsperioden for forordning (EF) nr. 812/2003 om overgangsforanstaltninger
    i henhold til forordning (EF) nr. 1774/2002 for så vidt angår indførsel og
    transit af visse produkter fra tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2268/2003 της Επιτροπής,
    της 22ας Δεκεμβρίου 2003, για παράταση της ισχύος
    του κανονισμού (ΕΚ) αριθ. 812/2003 για μεταβατικά
    μέτρα, σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1774/2002,
    όσον αφορά τις εισαγωγές και τη διαμετακόμιση
    ορισμένων προϊόντων από τρίτες χώρες
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2268/2003, annettu 22 päivänä joulukuuta 2003,
    kolmansista maista tulevien tiettyjen tuotteiden maahantuontia ja kauttakuljetusta
    koskevista Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1774/2002 mukaisista
    siirtymäkauden toimenpiteistä annetun asetuksen (EY) N:o 812/2003 voimassaolon
    jatkamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2268/2003 della Commissione, del 22 dicembre 2003,
    che estende la validità del regolamento (CE) n. 812/2003 recante misure transitorie
    a norma del regolamento (CE) n. 1774/2002 relative all'importazione e al transito
    di taluni prodotti provenienti da paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2268/2003 van de Commissie van 22 december 2003 tot
    verlenging van de geldigheidsduur van Verordening (EG) nr. 812/2003 inzake overgangsmaatregelen
    krachtens Verordening (EG) nr. 1774/2002 wat betreft de invoer en doorvoer van
    bepaalde producten uit derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2268/2003 da Comissão, de 22 de Dezembro de 2003,
    que prorroga a validade do Regulamento (CE) n.° 812/2003 relativo a medidas de
    transição, nos termos do Regulamento (CE) n.° 1774/2002 do Parlamento Europeu
    e do Conselho, no que respeita à importação e ao trânsito de certos produtos
    a partir de países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2268/2003 de la Comisión, de 22 de diciembre de 2003,
    por el que se amplía el período de vigencia del Reglamento (CE) n° 812/2003
    sobre medidas transitorias, con arreglo al Reglamento (CE) n° 1774/2002 del Parlamento
    Europeo y del Consejo, relativas a la importación y el tránsito de algunos productos
    de terceros países
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2268/2003 av den 22 december 2003 om
    förlängning av giltighetstiden för förordning (EG) nr 812/2003 om övergångsbestämmelser
    enligt Europaparlamentets och rådets förordning (EG) nr 1774/2002 avseende import
    och transitering av vissa produkter från tredje land
