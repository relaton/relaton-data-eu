title:
- language: en
  script: Latn
  content: '80/153/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to electronic instruments and apparatus,
    falling within subheading 90.28 A of the Common Customs Tariff, originating in
    Japan and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/153/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    la République française à exclure du traitement communautaire les instruments
    et appareils électriques ou électroniques de la sous-position 90.28 A du tarif
    douanier commun, originaires du Japon et mis en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/153/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche elektrische oder elektronische Instrumente,
    Apparate und Geräte der Tarifstelle 90.28 A des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/153/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage elektriske og
    elektroniske instrumenter og apparater, som henhører under pos. 90.28 A i den
    fælles toldtarif, har oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/153/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli strumenti
    e apparecchi elettrici o elettronici della sottovoce 90.28 A della tariffa doganale
    comune, originari del Giappone e messi in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/153/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd elektrische of elektronische instrumenten en
    apparaten van post 90.28 A van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
