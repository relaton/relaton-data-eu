title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2065/93 of 27 July 1993 determining, for
    tobacco from the 1992 harvest, the quantity actually produced and the prices and
    premiums payable under the system of maximum guaranteed quantities
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2065/93 de la Commission du 27 juillet 1993 établissant,
    pour le tabac de la récolte 1992, la production effective ainsi que les prix
    et les primes à payer en application du régime des quantités maximales garanties
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2065/93 DER KOMMISSION vom 27. Juli 1993 zur Feststellung
    der tatsächlichen Erzeugung und zur Festsetzung der in Anwendung der Regelung
    der Höchstgarantiemengen zu zahlenden Preise und Prämien für Tabak der Ernte
    1992
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2065/93 af 27. juli 1993 om fastsættelse
    af den faktiske produktion af samt de priser og præmier, der i henhold til ordningen
    med maksimale garantimængder skal betales for tobak fra 1992-høsten
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2065/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιουλίου 1993 περί καθορισμού για τον
    καπνό της συγκομιδής 1992 της πραγματικής παραγωγής,
    καθώς και των τιμών και πριμοδοτήσεων που πληρώνονται
    κατ' εφαρμογή του καθεστώτος των μέγιστων εγγυημένων
    ποσοτήτων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2065/93 DELLA COMMISSIONE del 27 luglio 1993 che stabilisce,
    per il tabacco del raccolto 1992, la produzione effettiva, nonché i prezzi da
    pagare in applicazione del regime dei quantitativi massimi garantiti
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2065/93 VAN DE COMMISSIE van 27 juli 1993 tot bepaling
    van de werkelijke produktie voor tabakssoorten van de oogst 1992 en tot vaststelling
    van de geldende prijzen en premies in het kader van de regeling inzake gegarandeerde
    maximumhoeveelheden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 2065/93 DA COMISSÃO de 27 de Julho de 1993 que estabelece,
    para o tabaco da colheita de 1992, a produção efectiva, bem como os preços
    e os prémios a pagar em aplicação do regime de quantidades máximas garantidas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2065/93 DE LA COMISIÓN de 27 de julio de 1993 por
    el que se establecen, para el tabaco de la cosecha de 1992, la producción efectiva,
    los precios y las primas que deberán pagarse en aplicación del régimen de las
    cantidades máximas garantizadas
