title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2835/83 of 11 October 1983 fixing, in respect
    of certain maritime areas to the west of Scotland, the exact period, falling between
    1 October 1983 and 31 March 1984, when the use of trawls, Danish seines or similar
    nets as well as purse seines and ring nets, is prohibited
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2835/83 de la Commission du 11 octobre 1983 fixant,
    dans certaines zones maritimes à l' ouest de l' Écosse, la période exacte s'
    échelonnant du 1er octobre 1983 au 31 mars 1984 pendant laquelle l' utilisation
    de chaluts, de seines danoises ou filets similaires aussi bien que celle de seines
    tournantes ou de filets tournants est interdite
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2835/83 der Kommission vom 11. Oktober 1983 über
    den genauen Zeitraum zwischen dem 1. Oktober 1983 und dem 31. März 1984, in dem
    in bestimmten Fischereigebieten westlich von Schottland die Verwendung von Schleppnetzen,
    Zugnetzen oder ähnlichen Netzen sowie Ringwaden und anderen Ringnetzen verboten
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2835/83 af 11. oktober 1983 om fastsættelse
    af den nøjagtige periode for visse havområder vest for Skotland mellem den 1.
    oktober 1983 og den 31. marts 1984, i hvilken trawl, snurrevod eller lignende
    net samt snurpenot og ringnet ikke må anvendes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2835/83 της Επιτροπής
    της 11ης Οκτωβρίου 1983 περί καθορισμού της ακριβούς
    χρονικής περιόδου, μεταξύ της 1ης Οκτωβρίου
    1983 και της 31ης Μαρτίου 1984, κατά την οποία απαγορεύεται
    η χρήση γρίπων, δανικών σχοινότρατων ή παρόμοιων
    δικτυών, καθώς και η χρήση γρι—γρι και θυλάκων
    σε ορισμένες αλιευτικές περιοχές δυτικά της
    Σκοτίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2835/83 della Commissione dell' 11 ottobre 1983 che
    determina, in talune zone marittime situate all' ovest della Scozia, il periodo
    preciso, che si estende dal 1o ottobre 1983 al 31 marzo 1984, durante il quale
    è vietato l' impiego di reti a strascico, di ciancioli danesi o reti analoghe
    nonché di ciancioli o di reti da circuizione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2835/83 van de Commissie van 11 oktober 1983 houdende
    vaststelling, voor bepaalde zeegebieden ten westen van Schotland, van de juiste
    periode tussen 1 oktober 1983 en 31 maart 1984 gedurende welke het gebruik van
    trawlnetten, Deense zegennetten (snurrevod) en soortgelijke netten, alsmede van
    ringzegens en andere ringnetten, verboden is
  type: main
