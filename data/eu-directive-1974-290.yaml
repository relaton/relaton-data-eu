    aanpassing van de wetgevingen der Lid-Staten met betrekking tot de maatregelen
    die moeten worden genomen tegen luchtverontreiniging door gassen afkomstig van
    motoren met elektrische ontsteking in motorvoertuigen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 28 maja 1974 r. dostosowująca do postępu technicznego
    dyrektywę Rady nr 70/220/EWG w sprawie zbliżenia ustawodawstw Państw Członkowskich
    odnoszących się do działań, jakie mają być podjęte w celu ograniczenia
    zanieczyszczenia powietrza przez spaliny z silników o zapłonie iskrowym pojazdów
    silnikowych
  type: main
- language: pt
  script: Latn
  content: Directiva 74/290/CEE do Conselho, de 28 de Maio de 1974, relativa à adaptação
    ao progresso técnico da Directiva 70/220/CEE relativa à aproximação das legislações
    dos Estados-Membros respeitantes às medidas a tomar contra a poluição do ar
    pelos gases provenientes dos motores de ignição comandada que equipam os veículos
    a motor
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 28. mája 1974 prispôsobujúca technickému pokroku smernicu
    Rady č. 70/220/EHS o aproximácii právnych predpisov členských štátov o
    opatreniach proti znečisťovaniu ovzdušia výfukovými plynmi zo zážihových
    motorov motorových vozidiel
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 28. maja 1974 ki prilagaja Direktivo Sveta 70/220/EGS
    o približevanju zakonodaje držav članic o ukrepih proti onesnaževanju zraka
    s plini iz motornih vozil z motorjem na prisilni vžig tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva 74/290/CEE del Consejo, de 2- de mayo de 1974, por la que se
    adapta al progreso técnico la Directiva 70/220/CEE relativa a la aproximación
    de las legislaciones de los Estados Miembros sobre las medidas que han de adoptarse
    contra la contaminación del aire causada por los gases procedentes de los motores
    de explosión con los que están equipados los vehículos a motor
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 74/290/EEG av den 28 maj 1974 om anpassning till tekniska
    framsteg av rådets direktiv 70/220/EEG om tillnärmning av medlemsstaternas lagstiftning
    om åtgärder mot luftförorening genom avgaser från motorfordon
