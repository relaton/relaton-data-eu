    ta’ l-Istati Membri li għandhom x’jaqsmu ma’ miżuri li għandhom jittieħdu
    kontra t-tniġġis ta’ l-arja b’emissjonijiet minn vetturi b’mutur positive-ignition
  type: main
- language: nl
  script: Latn
  content: Richtlijn 74/290/EEG van de Raad van 28 mei 1974 houdende aanpassing aan
