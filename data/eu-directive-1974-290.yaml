  script: Latn
  content: Council Directive 74/290/EEC of 28 May 1974 adapting to technical progress
    Council Directive No 70/220/EEC on the approximation of the laws of the Member
    States relating to measures to be taken against air pollution by gases from positive-ignition
    engines of motor vehicles
  type: main
- language: fr
  script: Latn
  content: Directive 74/290/CEE du Conseil, du 28 mai 1974, portant adaptation au
    progrès technique, de la directive 70/220/CEE concernant le rapprochement des
    législations des États membres relatives aux mesures à prendre contre la pollution
    de l'air par les gaz provenant des moteurs à allumage commandé équipant les
    véhicules à moteur
  type: main
- language: de
  script: Latn
