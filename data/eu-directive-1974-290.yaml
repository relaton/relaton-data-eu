  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 28. mai 1974, millega kohandatakse tehnika arenguga
    nõukogu direktiivi 70/220/EMÜ ottomootoriga mootorsõidukite heitgaaside tekitatud
    õhusaaste vastu võetavaid meetmeid käsitlevate liikmesriikide õigusaktide
    ühtlustamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 74/290/ETY, annettu 28 päivänä toukokuuta 1974,
    moottoriajoneuvojen ottomoottoreiden kaasujen aiheuttaman ilman pilaantumisen
    estämiseksi toteutettavia toimenpiteitä koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun neuvoston direktiivin 70/220/ETY mukauttamisesta tekniikan
    kehitykseen
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1974. május 28.) a gépjárművek külső gyújtású
    motorjainak kipufogógázai által okozott levegőszennyezés elleni intézkedésekre
    vonatkozó tagállami jogszabályok közelítéséről szóló 70/220/EGK tanácsi
    irányelvnek a műszaki fejlődéshez történő hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 74/290/CEE del Consiglio, del 28 maggio 1974, per l'adeguamento
