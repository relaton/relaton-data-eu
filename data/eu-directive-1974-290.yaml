    udvikling af direktiv 70/220/EØF om tilnærmelse af medlemsstaternes lovgivning
    om foranstaltninger mod luftforurening forårsaget af udstødningsgas fra køretøjsmotorer
    med styret tænding
  type: main
- language: el
  script: Grek
  content: Οδηγία 74/290/ΕΟΚ του Συμβουλίου της 28ης Μαΐου
    1974 περί προσαρμογής στην τεχνική πρόοδο της
    οδηγίας 70/220/ΕΟΚ περί προσεγγίσεως των νομοθεσιών
    των κρατών μελών αφορωσών στα μέτρα που πρέπει
