title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2542/1999 of 25 November 1999 amending Annex
    I to Council Regulation (EC) No 517/94 on common rules for imports of textile
    products from certain third countries not covered by bilateral agreements, protocols
    or other arrangements, or by other specific Community import rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2542/1999 de la Commission, du 25 novembre 1999, modifiant
    l'annexe I du règlement (CE) nº 517/94 du Conseil relatif au régime commun
    applicable aux importations de produits textiles en provenance de certains pays
    tiers non couverts par des accords, protocoles ou autres arrangements bilatéraux,
    ou par d'autres régimes communautaires spécifiques d'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2542/1999 der Kommission vom 25. November 1999 zur
    Änderung des Anhangs I der Verordnung (EG) Nr. 517/94 des Rates über die gemeinsame
    Regelung der Einfuhren von Textilwaren aus bestimmten Drittländern, die nicht
    unter bilaterale Abkommen, Protokolle, andere Vereinbarungen oder eine spezifische
    gemeinschaftliche Einfuhrregelung fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2542/1999 af 25. november 1999 om ændring
    af bilag I til Rådets forordning (EF) nr. 517/94 om den fælles ordning for indførsel
    af tekstilvarer fra en række tredjelande, som ikke er omfattet af bilaterale
    aftaler, protokoller eller andre arrangementer eller af andre specifikke fællesskabsregler
    for indførsel
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2542/1999 της Επιτροπής,
    της 25ης Νοεμβρίου 1999, για την τροποποίηση του
    παραρτήματος Ι του κανονισμού (ΕΚ) αριθ. 517/94
    του Συμβουλίου περί της θεσπίσεως κοινών κανόνων
    για τις εισαγωγές κλωστοϋφαντουργικών προϊόντων
    από ορισμένες τρίτες χώρες, τα οποία δεν καλύπτονται
    από διμερείς συμφωνίες, πρωτόκολλα ή άλλους
    διακανονισμούς ή άλλους κοινοτικούς κανόνες
    εισαγωγής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2542/1999, annettu 25 päivänä marraskuuta
    1999, muiden kuin kahdenvälisten sopimusten, pöytäkirjojen tai muiden järjestelyjen
    taikka muiden yhteisön erityisten tuontimenettelyjen soveltamisalaan kuuluvien
    tiettyjen kolmansien maiden tekstiilituotteiden tuontiin sovellettavasta yhteisestä
    menettelystä annetun neuvoston asetuksen (EY) N:o 517/94 liitteen I muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2542/1999 della Commissione, del 25 novembre 1999,
    recante modifica dell'allegato I del regolamento (CE) n. 517/94 del Consiglio,
    del 7 marzo 1994, che concerne il regime comune applicabile alle importazioni
    di prodotti tessili da taluni paesi terzi, non contemplato da accordi bilaterali,
    da protocolli o da altre disposizioni né da altro regime comunitario specifico
    in materia di importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2542/1999 van de Commissie van 25 november 1999 tot
    wijziging van bijlage I bij Verordening (EG) nr. 517/94 van de Raad betreffende
    een gemeenschappelijke regeling voor de invoer van textielproducten uit bepaalde
    derde landen die niet vallen onder bilaterale overeenkomsten, protocollen of andere
    regelingen, noch onder een andere, bijzondere, communautaire regeling
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2542/1999 da Comissão, de 25 de Novembro de 1999,
    que altera o anexo I do Regulamento (CE) n° 517/94 do Conselho, relativo ao regime
    comum aplicável às importações de produtos têxteis de determinados países
    terceiros, não abrangidas por acordos, protocolos ou outros convénios bilaterais
    ou por outras regras comunitárias específicas de importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2542/1999 de la Comisión, de 25 de noviembre de 1999,
    por el que se modifica el anexo I del Reglamento (CE) nº 517/94 del Consejo relativo
    al régimen común aplicable a las importaciones de productos textiles de determinados
    países terceros que no estén cubiertos por Acuerdos bilaterales, Protocolos,
    otros Acuerdos o por otros regímenes específicos comunitarios de importación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2542/1999 av den 25 november 1999 om
    ändring av bilaga I till rådets förordning (EG) nr 517/94 om gemensamma bestämmelser
    för import av textilprodukter från vissa tredje länder som inte omfattas av
    bilaterala avtal, protokoll eller andra överenskommelser eller av andra särskilda
    gemenskapsbestämmelser för import
  type: main
