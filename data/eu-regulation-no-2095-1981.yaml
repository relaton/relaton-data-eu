title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2095/81 of 23 July 1981 determining, for
    the 1981/82 marketing year, the components for protection of the processing industry
    in the cereals and rice sector in trade between Greece and the other Member States
    of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2095/81 de la Commission, du 23 juillet 1981, déterminant,
    pour la campagne de commercialisation 1981/1982, les éléments destinés à assurer
    la protection de l' industrie de transformation des céréales et du riz dans
    les échanges entre la Grèce et les autres États membres de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2095/81 der Kommission vom 23. Juli 1981 zur Festsetzung
    der Bestandteile zum Schutz der Verarbeitungsindustrie auf dem Getreide- und Reissektor
    beim Handel zwischen Griechenland und den anderen Mitgliedstaaten der Gemeinschaft
    für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2095/81 af 23. juli 1981 om fastsættelse
    for produktionsåret 1981/82 af de elementer, der skal beskytte forarbejdningsindustrien
    for korn og ris i samhandelen mellem Grækenland og Fællesskabets øvrige medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2095/81 τής Επιτροπής
    τής 23ης Ιουλίου 1981 περί καθορισμού γιά τήν
    περίοδο εμπορίας 1981/82 τών στοιχείων τά οποία
    προορίζονται νά εξασφαλίσουν τήν προστασία
    τής μεταποιητικής βιομηχανίας σιτηρών καί
    όρυζας στίς συναλλαγές μεταύ τής Ελλάδος καί
    τών άλλων Κρατών μελών τής Κοινότητος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2095/81 della Commissione, del 23 luglio 1981, che
    stabilisce, per la campagna di commercializzazione 1981/1982, gli elementi destinati
    ad assicurare, nel settore dei cereali e del riso, la protezione dell' industria
    di trasformazione negli scambi tra la Grecia e gli altri Stati membri della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2095/81 van de Commissie van 23 juli 1981 tot vaststelling
