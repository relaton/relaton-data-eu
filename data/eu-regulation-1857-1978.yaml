  content: Commission Regulation (EEC) No 1857/78 of 31 July 1978 amending Regulations
    (EEC) No 2054/76, (EEC) No 1036/78 and (EEC) No 1654/78 as regards a new method
    of denaturing skimmed-milk powder intended for use as feed for export to non-member
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1857/78 de la Commission, du 31 juillet 1978, modifiant
    les règlements (CEE) n° 2054/76, (CEE) n° 1036/78 et (CEE) n° 1654/78 en ce
    qui concerne une nouvelle méthode de dénaturation du lait écrémé en poudre
    destiné à l' alimentation des animaux en vue de l' exportation vers les pays
    tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1857/78 der Kommission vom 31. Juli 1978 zur Änderung
