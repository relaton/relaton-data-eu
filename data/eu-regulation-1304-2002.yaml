title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1304/2002 of 18 July 2002 correcting Regulation
    (EC) No 1116/2002 determining the extent to which applications lodged in June
    2002 for import licences for certain pigmeat products under the regime provided
    for by the Agreements concluded by the Community with the Republic of Poland,
    the Republic of Hungary, the Czech Republic, Slovakia, Bulgaria and Romania can
    be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1304/2002 de la Commission du 18 juillet 2002 rectifiant
    le règlement (CE) n° 1116/2002 déterminant la mesure dans laquelle les demandes
    de certificats d'importation introduites en juin 2002 pour certains produits à
    base de viande de porc dans le cadre du régime prévu par les accords conclus
    par la Communauté avec la République de Pologne, la République de Hongrie,
    la République tchèque, la Slovaquie, la Bulgarie et la Roumanie peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1304/2002 der Kommission vom 18. Juli 2002 zur Berichtigung
    der Verordnung (EG) Nr. 1116/2002 über die Festsetzung des Umfangs, in dem die
    im Juni 2002 gestellten Anträge auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse
    entsprechend der Regelung der Abkommen zwischen der Gemeinschaft und Polen, Ungarn,
    der Tschechischen Republik, der Slowakei, Bulgarien und Rumänien genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1304/2002 af 18. juli 2002 om berigtigelse
    af forordning (EF) nr. 1116/2002 om fastsættelse af, i hvilket omfang der kan
    accepteres ansøgninger, der blev indgivet i juni 2002 om importlicenser for visse
    svinekødsprodukter i forbindelse med den ordning, der er fastsat i de aftaler,
    som Fællesskabet har indgået med Republikken Polen, Republikken Ungarn, Den
    Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1304/2002 της Επιτροπής,
    της 18ης Ιουλίου 2002, για τη διόρθωση του κανονισμού
    (ΕΚ) αριθ. 1116/2002 για καθορισμό ορίων εντός των
    οποίων δύνανται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Ιούνιο 2002 για πιστοποιητικά
    εισαγωγής χοιρείου κρέατος βάσει του καθεστώτος
    που προβλέπεται από τις συμφωνίες τις οποίες
    συνήψε η Κοινότητα με τη Δημοκρατία της Πολωνίας,
    τη Δημοκρατία της Ουγγαρίας, την Τσεχική Δημοκρατία,
    τη Σλοβακία, τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1304/2002, annettu 18 päivänä heinäkuuta
    2002, yhteisön Puolan tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
