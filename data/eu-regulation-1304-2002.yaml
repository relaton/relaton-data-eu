    ser aceites os pedidos de certificados de importação de determinados produtos
    do sector da carne de suíno apresentados em Junho de 2002 ao abrigo do regime
    previsto nos acordos concluídos pela Comunidade com a República da Polónia,
    a República da Hungria, a República Checa, a Eslováquia, a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1304/2002 de la Comisión, de 18 de julio de 2002,
    que modifica el Reglamento (CE) n° 1116/2002 por el que se determina la proporción
    en que se satisfarán las solicitudes de certificados de importación de algunos
    productos del sector de la carne de porcino presentadas en el mes de junio de
    2002 al amparo del régimen previsto en los Acuerdos celebrados entre la Comunidad
