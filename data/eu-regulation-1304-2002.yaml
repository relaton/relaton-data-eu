    oikaisemisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1304/2002 della Commissione, del 18 luglio 2002, che
    rettifica il regolamento (CE) n. 1116/2002 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli d'importazione presentate nel mese di giugno
    2002 per taluni prodotti del settore delle carni suine nel quadro del regime previsto
    dagli accordi conclusi tra la Comunità e la Repubblica di Polonia, la Repubblica
    di Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria e la Romania
  type: main
