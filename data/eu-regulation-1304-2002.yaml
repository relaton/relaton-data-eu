  script: Latn
  content: Verordening (EG) nr. 1304/2002 van de Commissie van 18 juli 2002 houdende
    rectificatie van Verordening (EG) nr. 1116/2002 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    producten in de sector varkensvlees, die in juni 2002 worden ingediend op grond
