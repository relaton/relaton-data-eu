title:
- language: en
  script: Latn
  content: '88/18/EEC: Commission Decision of 22 December 1987 amending Decision 87/119/EEC
    as regards the list of establishments in Brazil approved for the purpose of importing
    meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '88/18/CEE: Décision de la Commission du 22 décembre 1987 modifiant la
    décision 87/119/CEE en ce qui concerne la liste des établissements du Brésil
    agréés pour l''importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 22. Dezember 1987 zur Änderung der Entscheidung
    87/119/EWG in bezug auf die Liste der Betriebe in Brasilien, aus denen die Einfuhr
    von Fleischerzeugnissen in die Gemeinschaft zugelassen ist (88/18/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 22. december 1987 om ændring af beslutning
    87/119/EØF for så vidt angår listen over de virksomheder i Brasilien, der er
    godkendt til indførsel af kødprodukter til Fællesskabet (88/18/EØF) #'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1987 που τροποποιεί την απόφαση 87/119/ΕΟΚ όσον
    αφορά τον πίνακα των εγκαταστάσεων της Βραζιλίας
    που έχουν εγκριθεί για την εισαγωγή προϊόντων
    με βάση το κρέας στην Κοινότητα ( 88/18/ΕΟΚ )
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 22 dicembre 1987 che modifica la decisione
    87/119/CEE per quanto riguarda l'' elenco degli stabilimenti del Brasile, in provenienza
    dai quali è autorizzata l'' importazione di prodotti a base di carne nella Comunità
    (88/18/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 22 december 1987 tot wijziging van Beschikking
    87/119/EEG met betrekking tot de lijst van inrichtingen in Brazilië die erkend
    zijn voor de invoer van vleesprodukten in de Gemeenschap (88/18/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '88/18/CEE: Decisão da Comissão de 22 de Dezembro de 1987 que altera
    a Decisão 87/119/CEE no que respeita à lista dos estabelecimentos do Brasil
    aprovados para a importação de produtos à base de carne pela Comunidade'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 22 de diciembre de 1987 por la que se modifica
    la Decisión 87/119/CEE en lo que se refiere a la lista de los establecimientos
    del Brasil autorizados para la importación de productos a base de carne en la
    Comunidad (88/18/CEE) #'
