title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1024/92 of 24 April 1992 adopting definitive
    measures on the issuing of STM licences for milk and milk products in regard to
    Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1024/92 de la Commission du 24 avril 1992 arrêtant
    les mesures définitives concernant la délivrance des certificats «MCE» dans
    le secteur du lait et des produits laitiers en ce qui concerne l'Espagne
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1024/92 DER KOMMISSION vom 24. April 1992 zur Festlegung
    der zur Erteilung von EHM-Lizenzen für Milch und Milcherzeugnisse für Spanien
    zu treffenden endgültigen Maßnahmen #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1024/92 af 24. april 1992 om fastsættelse
    af endelige foranstaltninger vedrørende udstedelse af SMS-licenser for mælk
    og mejeriprodukter for så vidt angår Spanien #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1024/92 της Επιτροπής
    της 24ης Απριλίου 1992 περί θεσπίσεως των οριστικών
    μέτρων ως προς την έκδοση των πιστοποιητικών
    "ΣΜΣ" στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, όσον αφορά την Ισπανία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1024/92 DELLA COMMISSIONE del 24 aprile 1992 recante
    misure definitive in materia di rilascio dei titoli MCS nel settore del latte
    e dei prodotti lattiero-caseari relativamente alla Spagna #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1024/92 VAN DE COMMISSIE van 24 april 1992 tot vaststelling
    van definitieve maatregelen betreffende de afgifte van ARH-certificaten in de
    sector melk en zuivelprodukten ten aanzien van Spanje #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1024/92 DA COMISSÃO de 24 de Abril de 1992 que adopta
    as medidas definitivas respeitantes à emissão de certificados « MCT » no sector
    do leite e dos produtos lácteos no que se refere a Espanha #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1024/92 DE LA COMISIÓN de 24 de abril de 1992 por
    el que se establecen las medidas definitivas relativas a la expedición de los
    certificados « MCI » en el sector de la leche y productos lácteos en lo que
    se refiere a España #'
