title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 119/76 of 31 December 1975 concluding the Agreement
    in the form of an exchange of letters between the European Economic Community
    and the State of Israel suspending the implementation of the tariff reduction
    for imports into the Community of tomato concentrates falling within subheading
    20.02 ex C of the Common Customs Tariff and originating in Israel
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 119/76 du Conseil, du 31 décembre 1975, portant conclusion
    de l' accord sous forme d' échange de lettres entre la Communauté économique
    européenne et l' État d' Israël qui suspend l' application de la réduction
    tarifaire aux importations, dans la Communauté, de concentrés de tomates relevant
    de la sous-position 20.02 ex C du tarif douanier commun et originaires d' Israël
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 119/76 des Rates vom 31. Dezember 1975 über den Abschluß
    des Abkommens im Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Staat Israel, mit dem die Anwendung der Zollsenkung für Einfuhren von
    Tomatenmark der Tarifstelle 20.02 ex C des Gemeinsamen Zolltarifs mit Ursprung
    in Israel in die Gemeinschaft ausgesetzt wird
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 119/76 af 31. december 1975 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Israel, som suspenderer anvendelse af toldnedsættelsen for indførsel i Fællesskabet
    af tomatkoncentrater henhørende under pos. 20.02 ex C i den fælles toldtarif
    og med oprindelse i Israel
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 119/76 του Συμβουλίου,
    της 31ης Δεκεμβρίου 1975, περί σύναψης συμφωνίας
    υπό τη μορφή ανταλλαγής επιστολών μεταξύ της
    Ευρωπαϊκής Οικονομικής Κοινότητας και του
    κράτους Ισραήλ η οποία αναστέλλει την εφαρμογή
    της μείωσης των θεσμών στις εισαγωγές, στην
    Κοινότητα, για τους ντοματοπολτούς προέλευσης
    Ισραήλ της θέσης 20.02 ex C του κοινού δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 119/76 del Consiglio, del 31 dicembre 1975, recante
    conclusione dell' accordo sotto forma di scambio di lettere fra la Comunità economica
    europea e lo Stato d' Israele concernente la sospensione dell' applicazione della
    riduzione tariffaria per le importazioni nella Comunità di concentrati di pomodoro
    della sottovoce 20.02 ex C della tariffa doganale comune, originari d' Israele
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 119/76 van de Raad van 31 december 1975 houdende
    sluiting van de Overeenkomst, in de vorm van een briefwisseling, tussen de Europese
    Economische Gemeenschap en de Staat Israël tot schorsing van de toepassing van
    de tariefverlaging voor de invoer in de Gemeenschap van tomatenpasta van onderverdeling
    20.02 ex C van het gemeenschappelijk douanetarief, van oorsprong uit Israël
