    jikkonsistu minn, jew ikunu prodotti minn qamħirrum ġenetikament modifikat (ĠM)
    MON 89034 × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3
    × DAS-59122-7), erba’ qamħirrum ĠM relatati li jgħaqdu tliet eventi singli
    differenti ĠM (MON89034 × 1507 × MON88017 (MON-89Ø34-3 × DAS-Ø15Ø7-1 ×
    MON-88Ø17-3), MON89034 × 1507 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × DAS-59122-7),
    MON89034 × MON88017 × 59122 (MON-89Ø34-3 × MON-88Ø17-3 × DAS-59122-7), 1507
    × MON 88017 × 59122 (DAS-Ø15Ø7-1 × MON-88Ø17-3 × DAS-59122-7)) u erba’
    qamħirrum ĠM relatati li jgħaqqdu żewġ eventi ĠM singli differenti (MON89034
    × 1507 (MON-89Ø34-3 × DAS-Ø15Ø7-1), MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7),
    1507 × MON88017 (DAS-Ø15Ø7-1 × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3
    × DAS-59122-7)))) skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew
    u tal-Kunsillsingli (notifikata bid-dokument C(2013) 4755)'
  type: main
- language: nl
  script: Latn
  content: '2013/650/EU: Uitvoeringsbesluit van de Commissie van 6 november 2013 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 89034 × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 ×
    MON-88Ø17-3 × DAS-59122-7), vier gerelateerde genetisch gemodificeerde maissoorten
    die drie afzonderlijke transformatiestappen combineren (MON89034 × 1507 × MON88017
    (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3), MON89034 × 1507 × 59122 (MON-89Ø34-3
    × DAS-Ø15Ø7-1 × DAS-59122-7), MON89034 × MON88017 × 59122 (MON-89Ø34-3
    × MON-88Ø17-3 × DAS-59122-7), 1507 × MON 88017 × 59122 (DAS-Ø15Ø7-1 ×
    MON-88Ø17-3 × DAS-59122-7)) en vier gerelateerde genetisch gemodificeerde maissoorten
    die twee afzonderlijke transformatiestappen combineren (MON89034 × 1507 (MON-89Ø34-3
    × DAS-Ø15Ø7-1), MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7), 1507 × MON88017
    (DAS-Ø15Ø7-1 × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3 × DAS-59122-7))
    overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement en de
    Raad (Kennisgeving geschied onder nummer C(2013) 4755)'
  type: main
- language: pl
  script: Latn
  content: '2013/650/UE: Decyzja wykonawcza Komisji z dnia 6 listopada 2013 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    MON 89034 × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3
    × DAS-59122-7) składających się z niej lub z niej wyprodukowanych, czterech
    pokrewnych rodzajów zmodyfikowanej genetycznie kukurydzy łączących trzy różne
    pojedyncze modyfikacje genetyczne (MON89034 × 1507 × MON88017 (MON-89Ø34-3
    × DAS-Ø15Ø7-1 × MON-88Ø17-3), MON89034 × 1507 × 59122 (MON-89Ø34-3 ×
    DAS-Ø15Ø7-1 × DAS-59122-7), MON89034 × MON88017 × 59122 (MON-89Ø34-3 ×
    MON-88Ø17-3 × DAS-59122-7), 1507 × MON 88017 × 59122 (DAS-Ø15Ø7-1 × MON-88Ø17-3
    × DAS-59122-7)) oraz czterech pokrewnych rodzajów zmodyfikowanej genetycznie
    kukurydzy łączących dwie różne pojedyncze modyfikacje (MON89034 × 1507 (MON-89Ø34-3
    × DAS-Ø15Ø7-1), MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7), 1507 × MON88017
    (DAS-Ø15Ø7-1 × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3 × DAS-59122-7))
    (notyfikowana jako dokument nr C(2013) 4755)'
  type: main
- language: pt
  script: Latn
  content: '2013/650/UE: Decisão de Execução da Comissão, de 6 de novembro de
    2013 , que autoriza a colocação no mercado de produtos que contenham, sejam
    constituídos por, ou produzidos a partir de milho geneticamente modificado MON
    89034 × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAŚ-Ø15Ø7-1 × MON-88Ø17-3
    × DAS-59122-7), quatro milhos relacionados geneticamente modificados, combinando
    três eventos únicos de combinações genéticas [MON89034 ×1507 × MON88017
    (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3), MON89034 × 1507 × 59122 (MON-89Ø34-3
    × DAS-Ø15Ø7-1 × DAS-59122-7), MON89034 × MON88017 × 59122 (MON-89Ø34-3
    × MON-88Ø17-3 × DAS-59122-7), 1507 × MON 88017 × 59122 (DAS-Ø15Ø7-1 ×
    MON-88Ø17-3 × DAS-59122-7)], e quatro milhos relacionados geneticamente modificados,
    combinando dois eventos únicos de modificações genéticas [MON89034 × 1507
    (MON-89Ø34-3 × DAS-Ø15Ø7-1), MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7),
    1507 × MON88017 (DAS-Ø15Ø7-1 × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3
    × DAS-59122-7)], nos termos do Regulamento (CE) n. ° 1829/2003 do Parlamento
    Europeu e do Conselho [notificada com o número C(2013) 4755]'
  type: main
- language: ro
  script: Latn
  content: '2013/650/UE: Decizia de punere în aplicare a Comisiei din 6 noiembrie
    2013 de autorizare a introducerii pe piață a produselor care conțin, sunt compuse
    sau fabricate din porumb modificat genetic (MG) MON89034 × 1507 × MON88017 ×
    59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3 × DAS-59122-7), patru soiuri
    înrudite de porumb MG care combină trei evenimente unice MG diferite (MON89034
    × 1507 × MON88017 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3), MON89034
    × 1507 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × DAS-59122-7), MON89034 × MON88017
    × 59122 (MON-89Ø34-3 × MON-88Ø17-3 × DAS-59122-7), 1507 × MON 88017 × 59122
    (DAS-Ø15Ø7-1 × MON-88Ø17-3 × DAS-59122-7)] și patru soiuri înrudite de
    porumb MG care combină două evenimente unice MG diferite (MON89034 × 1507 (MON-89Ø34-3
    × DAS-Ø15Ø7-1), MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7), 1507 × MON88017
    (DAS-Ø15Ø7-1 × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3 × DAS-59122-7)],
    în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al
    Consiliului [notificată cu numărul C(2013) 4755]'
  type: main
- language: sk
  script: Latn
  content: '2013/650/EÚ: Vykonávacie rozhodnutie Komisie zo 6. novembra 2013 , ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    uviesť na trh produkty, ktoré obsahujú geneticky modifikovanú kukuricu MON
    89034 × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3
    × DAS-59122-7), štyri súvisiace geneticky modifikované kukurice, v ktorých
    sa kombinujú tri rôzne individuálne genetické modifikácie [MON89034 × 1507
    × MON88017 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3), MON89034 × 1507
    × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × DAS-59122-7), MON89034 × MON88017
    × 59122 (MON-89Ø34-3 × MON-88Ø17-3 × DAS-59122-7), 1507 × MON 88017 × 59122
    (DAS-Ø15Ø7-1 × MON-88Ø17-3 × DAS-59122-7)], a štyri súvisiace geneticky
    modifikované kukurice, v ktorých sa kombinujú dve rôzne individuálne genetické
    modifikácie [MON89034 × 1507 (MON-89Ø34-3 × DAS-Ø15Ø7-1), MON89034 × 59122
    (MON-89Ø34-3 × DAS-59122-7), 1507 × MON88017 (DAS-Ø15Ø7-1 × MON-88Ø17-3),
    MON 88017 × 59122 (MON-88Ø17-3 × DAS-59122-7)], sú z nich zložené alebo
    vyrobené [oznámené pod číslom C(2013) 4755]'
  type: main
- language: sl
  script: Latn
  content: '2013/650/EU: Izvedbeni sklep Komisije z dne 6. novembra 2013 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno (GS) koruzo MON 89034
    × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3 ×
    DAS-59122-7), so iz nje sestavljeni ali proizvedeni, štirih sorodnih GS koruze,
    ki združujejo tri različne posamezne dogodke GS (MON89034 × 1507 × MON88017
    (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3), MON89034 × 1507 × 59122 (MON-89Ø34-3
    × DAS-Ø15Ø7-1 × DAS-59122-7), MON89034 × MON88017 × 59122 (MON-89Ø34-3
    × MON-88Ø17-3 × DAS-59122-7), 1507 × MON 88017 × 59122 (DAS-Ø15Ø7-1 ×
    MON-88Ø17-3 × DAS-59122-7)), in štiri sorodne GS koruze, ki združujejo dva
    različna posamezna dogodka GS (MON89034 × 1507 (MON-89Ø34-3 × DAS-Ø15Ø7-1),
    MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7), 1507 × MON88017 (DAS-Ø15Ø7-1
    × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3 × DAS-59122-7)) v skladu z
    Uredbo (ES) št. 1829/2003 Evropskega parlamenta in Sveta (notificirano pod dokumentarno
    številko C(2013) 4755)'
  type: main
- language: es
  script: Latn
  content: '2013/650/UE: Decisión de Ejecución de la Comisión, de 6 de noviembre
    de 2013 , por la que se autoriza la comercialización de productos que contienen,
    se componen o se han producido a partir de maíz modificado genéticamente (MG)
    MON 89034 × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3
    × DAS-59122-7), cuatro maíces MG relacionados que combinan tres eventos únicos
    MG diferentes [MON89034 × 1507 × MON88017 (MON-89Ø34-3 × DAS-Ø15Ø7-1 ×
    MON-88Ø17-3), MON89034 × 1507 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × DAS-59122-7),
    MON89034 × MON88017 × 59122 (MON-89Ø34-3 × MON-88Ø17-3 × DAS-59122-7), 1507
    × MON 88017 × 59122 (DAS-Ø15Ø7-1 × MON-88Ø17-3 × DAS-59122-7)] y cuatro
    maíces MG relacionados que combinan dos eventos únicos MG diferentes [MON89034
    × 1507 (MON-89Ø34-3 × DAS-Ø15Ø7-1), MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7),
    1507 × MON88017 (DAS-Ø15Ø7-1 × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3
    × DAS-59122-7)] con arreglo al Reglamento (CE) n ° 1829/2003 del Parlamento
    Europeo y del Consejo [notificada con el número C(2013) 4755]'
  type: main
- language: sv
  script: Latn
  content: '2013/650/EU: Kommissionens genomförandebeslut av den 6 november 2013
    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av den genetiskt modifierade majsen MON 89034
    × 1507 × MON88017 × 59122 (MON-89Ø34-3 × DAS-Ø15Ø7-1 × MON-88Ø17-3 ×
    DAS-59122-7), fyra närstående genetiskt modifierade majssorter som kombinerar
    tre olika transformationshändelser (MON89034 × 1507 × MON88017 (MON-89Ø34-3
    × DAS-Ø15Ø7-1 × MON-88Ø17-3), MON89034 × 1507 × 59122 (MON-89Ø34-3 ×
    DAS-Ø15Ø7-1 × DAS-59122-7), MON89034 × MON88017 × 59122 (MON-89Ø34-3 ×
    MON-88Ø17-3 × DAS-59122-7), 1507 × MON 88017 × 59122 (DAS-Ø15Ø7-1 × MON-88Ø17-3
    × DAS-59122-7)) och fyra närstående genetiskt modifierade majssorter som kombinerar
    två olika transformationshändelser (MON89034 × 1507 (MON-89Ø34-3 × DAS-Ø15Ø7-1),
    MON89034 × 59122 (MON-89Ø34-3 × DAS-59122-7), 1507 × MON88017 (DAS-Ø15Ø7-1
    × MON-88Ø17-3), MON 88017 × 59122 (MON-88Ø17-3 × DAS-59122-7)) i enlighet
    med Europaparlamentets och rådets förordning (EG) nr 1829/2003 [delgivet med
    nr C(2013) 4755]'
