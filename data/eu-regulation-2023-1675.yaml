  content: Commission Delegated Regulation (EU) 2023/1675 of 26 June 2023 correcting
    certain language versions of Delegated Regulation (EU) 2021/1958 supplementing
    Regulation (EU) 2019/2144 of the European Parliament and of the Council by laying
    down detailed rules concerning the specific test procedures and technical requirements
    for the type-approval of motor vehicles with regard to their intelligent speed
    assistance systems and for the type-approval of those systems as separate technical
    units
  type: main
