title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 309/88 of 2 February 1988 amending Regulation
    (EEC) No 537/70 authorizing Member States to take measures derogating from certain
    requirements of the quality standards applicable to exports to third countries
    of flowering bulbs, corms and tubers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 309/88 de la Commission du 2 février 1988 modifiant
    le règlement (CEE) n° 537/70 autorisant les États membres à prendre des mesures
    dérogatoires à certains critères des normes de qualité applicables aux exportations
    vers les pays tiers des bulbes, oignons et tubercules à fleurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 309/88 der Kommission vom 2. Februar 1988 zur Änderung
    der Verordnung (EWG) Nr. 537/70, mit der die Mitgliedstaaten ermächtigt werden,
    bei der Ausfuhr von Blumenbulben, -zwiebeln und -knollen nach dritten Ländern
    abweichende Maßnahmen in bezug auf gewisse Kriterien der Qualitätsnormen zu
    treffen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 309/88 af 2. februar 1988 om ændring
    af forordning (EØF) nr. 537/70 ved hvilken medlemsstaterne bemyndiges til for
    udførsel af blomsterløg og -knolde til tredjelande at træffe foranstaltninger,
    der afviger fra visse af kvalitetsnormernes kriterier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 309/88 της Επιτροπής
    της 2ας Φεβρουαρίου 1988 για τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 537/70 που εξουσιοδοτεί
    τα κράτη μέλη να λάβουν μέτρα παρεκκλίσεως
    από ορισμένα κριτήρια των κανόνων ποιότητος
    που εφαρμόζονται στις εξαγωγές προς τις τρίτες
    χώρες βολβών, κρομμύων και κονδύλων για παραγωγή
    ανθέων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 309/88 della Commissione del 2 febbraio 1988 recante
    modifica del regolamento (CEE) n. 537/70 che autorizza gli Stati membri ad adottare
    misure di deroga a taluni criteri delle norme di qualità applicabili alle esportazioni
    verso i paesi terzi dei bulbi, tuberi e rizomi da fiore
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 309/88 van de Commissie van 2 februari 1988 tot wijziging
    van Verordening (EEG) nr. 537/70 houdende machtiging van de Lid-Staten tot het
    treffen van maatregelen die afwijken van bepaalde criteria van de kwaliteitsnormen
    bij uitvoer naar de derde landen van bloembollen en bloemknollen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 309/88 da Comissão de 2 de Fevereiro de 1988 que
    altera o Regulamento (CEE) n.° 537/70, que autoriza os Estados-membros a tomar
    medidas derrogatórias de certos critérios das normas de qualidade aplicáveis
    às exportações para países terceiros de bolbos, cebolas e tubérculos com
    flores
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 309/88 de la Comisión de 2 de febrero de 1988 por
    el que se modifica el Reglamento (CEE) n° 537/70 por el que se autoriza a los
    Estados miembros a adoptar medidas que constituyan excepción a determinados criterios
    de la normas de calidad aplicables a las exportaciones a terceros países de bulbos,
    cebollas y tubérculos de flores
  type: main
