title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2116/75 of the Commission of 12 August 1975 amending
    Regulation (EEC) No 2179/74 by postponing until 31 August 1975 the final date
    for the delivery of alcohol obtained from the compulsory distillation of the by-products
    of wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2116/75 de la Commission, du 12 août 1975, modifiant
    le règlement (CEE) n° 2179/74 en prorogeant jusqu'au 31 août 1975 le délai
    pour la livraison de l'alcool obtenu au titre de la distillation obligatoire des
    sous-produits de la vinification
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2116/75 der Kommission vom 12. August 1975 zur Änderung
    der Verordnung (EWG) Nr. 2179/74 und zur Verlängerung der Frist für die Ablieferung
    des aus der vorgeschriebenen Destillierung von Nebenerzeugnissen der Weinbereitung
    gewonnenen Alkohols bis 31. August 1975
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2116/75 af 12. august 1975 om ændring
    af forordning (EØF) nr. 2179/74 ved forlængelse af fristen for levering af alkohol,
    der udvindes ved obligatorisk destillering af biprodukter fra vinfremstilling,
    indtil 31. august 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2116/75 della Commissione, del 12 agosto 1975, che
    modifica il regolamento (CEE) n. 2179/74 prorogando fino al 31 agosto 1975 il
    termine di consegna dell'alcole ottenuto a titolo della distillazione obbligatoria
    dei sottoprodotti della vinificazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2116/75 van de Commissie van 12 augustus 1975 tot
    wijziging van Verordening (EEG) nr. 2179/74 door de verlenging tot 31 augustus
    1975 van de termijn voor de levering van de alcohol verkregen bij de verplichte
    distillatie van de bijprodukten van de wijnbereiding
  type: main
