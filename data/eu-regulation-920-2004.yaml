    règlement (CE) n° 2529/2001 du Conseil portant organisation commune des marchés
    dans le secteur des viandes ovine et caprine en ce qui concerne les régimes de
    primes et modifiant le règlement (CE) n° 2419/2001 en raison de l'adhésion
