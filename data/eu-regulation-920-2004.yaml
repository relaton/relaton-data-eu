    Regulu (EK) Nr. 2550/2001, ar kuru nosaka sīki izstrādātus noteikumus, kas
    jāievēro, piemērojot Padomes Regulu (EK) Nr. 2529/2001 par aitu gaļas un kazu
    gaļas tirgus kopēju organizāciju attiecībā uz piemaksu sistēmām, un ar
    ko groza Regulu (EK) Nr. 2419/2001, sakarā ar Čehijas, Igaunijas, Kipras, Latvijas,
