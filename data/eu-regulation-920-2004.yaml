    della Repubblica ceca, dell'Estonia, di Cipro, della Lettonia, della Lituania,
    dell'Ungheria, di Malta, della Polonia, della Slovenia e della Slovacchia all'Unione
    europea
  type: main
- language: lv
  script: Latn
