  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 920/2004 della Commissione, del 29 aprile 2004, recante
    adeguamento del regolamento (CE) n. 2550/2001 che stabilisce le modalità d'applicazione
    del regolamento (CE) n. 2529/2001 del Consiglio relativo all'organizzazione comune
    dei mercati nel settore delle carni ovine e caprine per quanto riguarda i regimi
