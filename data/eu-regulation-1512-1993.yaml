  content: COMMISSION REGULATION (EEC) No 1512/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of categories 63 and 100 (order Nos
    40.0630 and 40.1000), originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1512/93 de la Commission du 18 juin 1993 portant rétablissement
