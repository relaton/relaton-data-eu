id: EUDecision20172277
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/2277 of 8 December 2017 determining
    that a temporary suspension of the preferential customs duty pursuant to Article
    15 of Regulation (EU) No 19/2013 of the European Parliament and of the Council
    is not appropriate for imports of bananas originating in Peru
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/2277 de la Commission du 8 décembre 2017
    déterminant qu'une suspension temporaire du droit de douane préférentiel au
    titre de l'article 15 du règlement (UE) n° 19/2013 du Parlement européen et
    du Conseil n'est pas appropriée dans le cas des importations de bananes originaires
    du Pérou
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/2277 der Kommission vom 8. Dezember 2017
    zur Feststellung, dass eine vorübergehende Aussetzung des Präferenzzolls nach
    Artikel 15 der Verordnung (EU) Nr. 19/2013 des Europäischen Parlaments und des
    Rates für Einfuhren von Bananen mit Ursprung in Peru nicht angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/2277 на Комисията
    от 8 декември 2017 година за определяне на временното
    спиране на прилагането на преференциалното
    мито по член 15 от Регламент (ЕС) № 19/2013 на Европейския
    парламент и на Съвета за нецелесъобразно по
    отношение на вноса на банани с произход от
    Перу
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/2277 ze dne 8. prosince 2017,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby podle
    článku 15 nařízení Evropského parlamentu a Rady (EU) č. 19/2013 není vhodné
    pro dovoz banánů pocházejících z Peru
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/2277 af 8. december 2017
    om fastsættelse af, at en midlertidig suspension af den præferencetold, som
    er fastsat i henhold til artikel 15 i Europa-Parlamentets og Rådets forordning
    (EU) nr. 19/2013, ikke er hensigtsmæssig for import af bananer med oprindelse
    i Peru
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/2277 της Επιτροπής,
    της 8ης Δεκεμβρίου 2017, με την οποία ορίζεται
    ότι η προσωρινή αναστολή του προτιμησιακού
    δασμού, σύμφωνα με το άρθρο 15 του κανονισμού
    (ΕΕ) αριθ. 19/2013 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, δεν κρίνεται σκόπιμη για
    τις εισαγωγές μπανανών καταγωγής Περού
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/2277, 8. detsember 2017, milles sätestatakse,
    et Peruust pärit banaanide impordi suhtes kehtiva (Euroopa Parlamendi ja nõukogu
    määruse (EL) nr 19/2013 artikli 15 kohase) soodustollimaksu ajutine peatamine
    ei ole asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/2277, annettu 8 päivänä
    joulukuuta 2017, sen määrittämisestä, että Euroopan parlamentin ja neuvoston
    asetuksen (EU) N:o 19/2013 15 artiklan mukainen etuustullin väliaikainen suspendoiminen
    ei ole aiheellista Perusta peräisin olevien banaanien tuonnissa
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/2277 оd 8. prosinca 2017. kojom se
    utvrđuje da privremena obustava povlaštene carine na temelju članka 15. Uredbe
    (EU) br. 19/2013 Europskog parlamenta i Vijeća nije primjerena za uvoz banana
    podrijetlom iz Perua
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/2277 végrehajtási határozata (2017. december
    8.) a Peruból származó banán behozatalára a 19/2013/EU európai parlamenti
    és tanácsi rendelet 15. cikke értelmében alkalmazott kedvezményes vámtételek
    ideiglenes felfüggesztése nem helyénvaló voltának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/2277 della Commissione, dell'8 dicembre
    2017, che stabilisce che la sospensione temporanea del dazio doganale preferenziale
    a norma dell'articolo 15 del regolamento (UE) n. 19/2013 del Parlamento europeo
    e del Consiglio non è appropriata per quanto riguarda le importazioni di banane
    originarie del Perù
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/2277 (2017. gada 8. decembris),
    ar ko nosaka, ka Peru izcelsmes banānu importam nav lietderīgi piemērot saskaņā
    ar Eiropas Parlamenta un Padomes Regulas (ES) Nr. 19/2013 15. pantu noteiktā
    atvieglotā muitas nodokļa pagaidu atcelšanu
  type: main
- language: lt
  script: Latn
  content: 2017 m. gruodžio 8 d. Komisijos įgyvendinimo sprendimas (ES) 2017/2277,
    kuriuo nustatoma, kad laikinas lengvatinės muito normos taikymo sustabdymas pagal
    Europos Parlamento ir Tarybos reglamento (ES) Nr. 19/2013 15 straipsnį importuojamiems
    Peru kilmės bananams yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/2277 tat-8 ta'
    Diċembru 2017 li tiddetermina li s-sospensjoni temporanja tad-dazju doganali
    preferenzjali skont l-Artikolu 15 tar-Regolament (UE) Nru 19/2013 tal-Parlament
    Ewropew u tal-Kunsill mhijiex adegwata għall-importazzjonijiet tal-banana li
    toriġina mill-Perù
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/2277 van de Commissie van 8 december 2017
    waarbij wordt bepaald dat een tijdelijke opschorting van het preferentiële douanerecht
    krachtens artikel 15 van Verordening (EU) nr. 19/2013 van het Europees Parlement
    en de Raad niet passend is voor de invoer van bananen van oorsprong uit Peru
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/2277 z dnia 8 grudnia 2017 r. stanowiąca,
    że tymczasowe zawieszenie preferencyjnego cła na podstawie art. 15 rozporządzenia
    Parlamentu Europejskiego i Rady (UE) nr 19/2013 nie jest odpowiednie w odniesieniu
    do przywozu bananów pochodzących z Peru
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/2277 da Comissão, de 8 de dezembro de
    2017, que determina que a suspensão temporária do direito aduaneiro preferencial,
    nos termos do disposto no artigo 15.° do Regulamento (UE) n.° 19/2013 do Parlamento
    Europeu e do Conselho, não é adequada para as importações de bananas originárias
    do Peru
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/2277 a Comisiei din 8 decembrie
    2017 de stabilire a faptului că o suspendare temporară a taxei vamale preferențiale
    în temeiul articolului 15 din Regulamentul (UE) nr. 19/2013 al Parlamentului
    European și al Consiliului nu este adecvată pentru importurile de banane originare
    din Peru
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/2277 z 8. decembra 2017, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla podľa článku 15
    nariadenia Európskeho parlamentu a Rady (EÚ) č. 19/2013 nie je primerané pre
    dovoz banánov s pôvodom v Peru
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/2277 z dne 8. decembra 2017 o ugotovitvi,
    da začasna opustitev preferencialnih carin v skladu s členom 15 Uredbe (EU)
    št. 19/2013 ni primerna za uvoz banan s poreklom iz Peruja
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/2277 de la Comisión, de 8 de diciembre
    de 2017, por la que se determina que una suspensión temporal del arancel aduanero
    preferencial con arreglo al artículo 15 del Reglamento (UE) n.° 19/2013 del
    Parlamento Europeo y del Consejo no es apropiada para las importaciones de plátanos
    (bananas) originarios de Perú
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/2277 av den 8 december 2017
    om fastställande av att ett tillfälligt upphävande av förmånstullarna i enlighet
    med artikel 15 i Europaparlamentets och rådets förordning (EU) nr 19/2013 inte
    är lämpligt för import av bananer med ursprung i Peru
