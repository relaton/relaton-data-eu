    einschließlich Kathodenstrahlröhren für Videomonitore der Unterpositionen 8540
    12 10, 8540 12 30 und 8540 30 00 der Kombinierten Nomenklatur mit Ursprung in
    Südkorea, dem die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
