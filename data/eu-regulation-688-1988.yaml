title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 688/88 of 16 March 1988 re-establishing
    the levying of customs duties on cathode-ray television picture tubes, including
    video monitor cathode-ray tubes, falling within CN codes 8540 12 10, 8540 12 30
    and 8540 30 00, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 688/88 de la Commission du 16 mars 1988 portant rétablissement
    de la perception des droits de douane applicables aux tubes cathodiques pour récepteurs
    de télévision, y compris les tubes pour moniteurs vidéo des codes NC 8540 12
    10, 8540 12 30 et 8540 30 00 originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 688/88 DER KOMMISSION vom 16. März 1988 zur Wiedereinführung
