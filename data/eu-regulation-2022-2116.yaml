    standardi, ki določajo ukrepe in postopke načrtov neprekinjenega poslovanja
    ponudnikov storitev množičnega financiranja
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2116 de la Comisión de 13 de julio de 2022
    por el que se completa el Reglamento (UE) 2020/1503 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación que especifican
    las medidas y los procedimientos del plan de continuidad de las actividades de
