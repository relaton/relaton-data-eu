  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2116 da Comissão de 13 de julho de 2022
    que complementa o Regulamento (UE) 2020/1503 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam as
    medidas e os procedimentos do plano de continuidade das atividades dos prestadores
    de serviços de financiamento colaborativo
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2116 al Comisiei din 13 iulie 2022 de completare
    a Regulamentului (UE) 2020/1503 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează măsurile
    și procedurile pe care trebuie să le prevadă planul de asigurare a continuității
    activității al furnizorilor de servicii de finanțare participativă
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2116 z 13. júla 2022, ktorým
