title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2056/97 of 20 October 1997 determining the
    extent to which applications lodged in October 1997 for import licences for certain
    milk and milk products covered by the arrangements provided for in the Interim
    Agreement concluded by the Community with the Republic of Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2056/97 DE LA COMMISSION du 20 octobre 1997 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 1997 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre du régime prévu par l'accord intérimaire conclu par
    la Communauté avec la république de Slovénie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2056/97 DER KOMMISSION vom 20. Oktober 1997 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im Oktober 1997
    für die Einfuhr von Milch und Milcherzeugnissen gemäß dem zwischen der Gemeinschaft
    und der Republik Slowenien geschlossenen Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2056/97 af 20. oktober 1997 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i oktober 1997 for
    visse produkter i sektoren for mælk og mejeriprodukter kan imødekommes under
    den ordning, der er fastsat i interimsaftalen mellem Fællesskabet og Republikken
    Slovenien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2056/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 20ής Οκτωβρίου 1997 για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υποβάλλονται
    τον Οκτώβριο 1997 για ορισμένα προϊόντα στον
    τομέα του γάλακτος και γαλακτοκομικών προϊόντων
    στα πλαίσια του καθεστώτος που προβλέπεται
    από την προσωρινή συμφωνία που έχει συναφθεί
    από την Κοινότητα με τη Δημοκρατία της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2056/97, annettu 20 päivänä lokakuuta 1997,
    yhteisön ja Slovenian tasavallan kanssa tehdyssä väliaikaisessa sopimuksessa
    määrätyn järjestelmän mukaisesti vuoden 1997 lokakuun aikana esitettyjen
    tiettyjä maito- ja maitotuotealan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2056/97 DELLA COMMISSIONE del 20 ottobre 1997 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli di importazione
    presentate in ottobre 1997 per taluni prodotti del settore lattiero-caseario nel
    quadro del regime previsto dall'accordo interinale concluso con la Repubblica
    di Slovenia
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2056/97 VAN DE COMMISSIE van 20 oktober 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector melk en zuivelproducten, die in oktober 1997
    zijn ingediend op grond van de regeling die is vastgesteld in de Interim-overeenkomst
    tussen de Gemeenschap en de Republiek Slovenië
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2056/97 DA COMISSÃO de 20 de Outubro de 1997 que
