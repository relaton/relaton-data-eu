    apresentados em Outubro de 1997, para determinados produtos do sector do leite
    e dos produtos lácteos, no âmbito do regime previsto no acordo intercalar concluído
    pela Comunidade com a República da Eslovénia
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2056/97 DE LA COMISIÓN de 20 de octubre de 1997 por
