    de commercialisation 1988/1989, ainsi que la taxe compensatoire à percevoir dans
    les cas où ce prix n' est pas respecté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2303/88 der Kommission vom 26. Juli 1988 zur Festsetzung
