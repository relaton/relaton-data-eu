    und der im Fall der Nichteinhaltung dieses Preises zu erhebenden Ausgleichsabgabe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2303/88 af 26. juli 1988 om fastsættelse
