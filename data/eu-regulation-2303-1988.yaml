  script: Latn
  content: Commission Regulation (EEC) No 2303/88 of 26 July 1988 fixing the minimum
    price applicable to dried grapes during the marketing year 1988/89 as well as
    the countervailing charges to be imposed where that price is not observed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2303/88 de la Commission du 26 juillet 1988 fixant
