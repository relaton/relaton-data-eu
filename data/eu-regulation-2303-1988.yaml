    τιμή στην εισαγωγή, που εφαρμόζεται στις σταφίδες
    κατά τη διάρκεια της περιόδου εμπορίας 1988/89,
    καθώς και την εξισωτική εισφορά που εισπράττεται
    στις περιπτώσεις που δεν τηρείται η τιμή αυτή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2303/88 della Commissione del 26 luglio 1988 che fissa,
    per la campagna di commercializzazione 1988/1989, il prezzo minimo all' importazione
    per le uve secche, nonché la tassa di compensazione applicabile qualora tale
    prezzo non sia rispettato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2303/88 van de Commissie van 26 juli 1988 tot vaststelling
