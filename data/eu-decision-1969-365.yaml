title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 octobre 1969, portant nouvelle modification
    de la décision du 10 octobre 1969 fixant les montants compensatoires maxima que
    la République fédérale d'Allemagne est autorisée à percevoir lors de l'importation
    de certains produits
  type: main
- language: de
  script: Latn
  content: '69/365/EWG: Entscheidung der Kommission vom 23. Oktober 1969 zur erneuten
    Änderung der Entscheidung vom 10. Oktober 1969 zur Festsetzung der Höchstausgleichsbeträge,
    die die Bundesrepublik Deutschland bei der Einfuhr bestimmter Erzeugnisse zu erheben
    berechtigt ist'
  type: main
- language: it
  script: Latn
  content: '69/365/CEE: Decisione della Commissione, del 23 ottobre 1969, che apporta
    nuove modifiche alla decisione del 10 ottobre 1969, che determina gli importi
    compensativi massimi che la Repubblica federale di Germania è autorizzata a riscuotere
    all''importazione di determinati prodotti'
  type: main
- language: nl
  script: Latn
  content: '69/365/EEG: Beschikking van de Commissie van 23 oktober 1969 houdende
    nieuwe wijziging van de beschikking van 10 oktober 1969 tot vaststelling van de
    maximale compenserende bedragen welke de Bondsrepubliek Duitsland bij de invoer
    van bepaalde produkten mag heffen'
  type: main
