title:
- language: en
  script: Latn
  content: '92/105/EEC: Commission Decision of 28 January 1992 establishing transitional
    measures for trade in bovine animals in relation to the cessation of vaccination
    against foot-and-mouth disease and revoking Decisions 91/13/EEC and 91/177/EEC'
  type: main
- language: fr
  script: Latn
  content: '92/105/CEE: Décision de la Commission du 28 janvier 1992 arrêtant des
    mesures transitoires en matière d''échanges d''animaux de l''espèce bovine
    en ce qui concerne la cessation de la vaccination contre la fièvre aphteuse et
    abrogeant la décision 91/13/CEE et la décision 91/177/CEE'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 28. Januar 1992 mit Übergangsmaßnahmen
    für den Handel mit Rindern im Hinblick auf die Einstellung der Impfung gegen
    die Maul- und Klauenseuche und zur Aufhebung der Entscheidungen 91/13/EWG und
    91/177/EWG (92/105/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 28. januar 1992 om overgangsforanstaltninger
    for handel med kvæg i forbindelse med ophøret med vaccination mod mund- og klovesyge
    og om ophævelse af beslutning 91/13/EØF og 91/177/EØF (92/105/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/105/ΕΟΚ : Απόφαση της Επιτροπής της 28ης
    Ιανουαρίου 1992 σχετικά με τη θέσπιση μεταβατικών
    μέτρων για το εμπόριο των βοοειδών όσον αφορά
    την παύση του εμβολιασμού κατά του αφθώδους
    πυρετού και την ανάκληση της απόφασης 91/13/ΕΟΚ
    και της απόφασης 91/177/ΕΟΚ'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 28 gennaio 1992 che fissa misure transitorie
    per gli scambi di bovini, in seguito alla cessazione della vaccinazione contro
    l'' afta epizootica che revoca le decisioni 91/13/CEE e 91/177/CEE (92/105/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 28 januari 1992 tot vaststelling van
    overgangsmaatregelen voor het handelsverkeer in runderen in verband met de stopzetting
    van vaccinatie tegen mond- en klauwzeer en tot intrekking van de Beschikkingen
    91/13/EEG en 91/177/EEG (92/105/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '92/105/CEE: Decisão da Comissão, de 28 de Janeiro de 1992, que define
    medidas transitórias aplicáveis ao comércio de bovinos, relacionadas com a
    cessação da vacinação contra a febre aftosa, e que revoga as decisões 91/13/CEE
    e 91/177/CEE'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 28 de enero de 1992 por la que se establecen
    medidas transitorias para el comercio de animales de la especie bovina en relación
    con la supresión de la vacunación contra la fiebre aftosa y por la que se derogan
    las Decisiones 91/13/CEE y 91/177/CEE (92/105/CEE) #'
