title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1593/93 of 24 June 1993 amending Regulation
    (EEC) No 3713/92 deferring the date of application of Article 11 (1) of Council
    Regulation (EEC) No 2092/91 on organic production of agricultural products and
    indications referring thereto on agricultural products and foodstuffs, with regard
    to the imports from certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1593/93 de la Commission du 24 juin 1993 modifiant
    le règlement (CEE) n° 3713/92 prorogeant le délai de mise en application de
    l'article 11 paragraphe 1 du règlement (CEE) n° 2092/91 du Conseil concernant
    le mode de production biologique de produits agricoles et sa présentation sur
    les produits agricoles et les denrées alimentaires en ce qui concerne les importations
    de certains pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1593/93 DER KOMMISSION vom 24. Juni 1993 zur Änderung
    der Verordnung (EWG) Nr. 3713/92 zur Verschiebung der Anwendung von Artikel 11
    Absatz 1 der Verordnung (EWG) Nr. 2092/91 des Rates über den ökologischen Landbau
    und die entsprechende Kennzeichnung der landwirtschaftlichen Erzeugnisse und Lebensmittel
    auf die Einfuhr aus bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1593/93 af 24. juni 1993 om ændring
    af forordning (EØF) nr. 3713/92 om udskydelse, for så vidt angår indførsler
    fra visse tredjelande, af fristen for anvendelsen af artikel 11, stk. 1, i Rådets
    forordning (EØF) nr. 2092/91 om økologisk produktionsmetode for landbrugsprodukter
    og om angivelse heraf på landbrugsprodukter og levnedsmidler
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1593/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Ιουνίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3713/92 περί παρατάσεως
    της ημερομηνίας εφαρμογής του άρθρου 11 παράγραφος
    1 του κανονισμού (ΕΟΚ) αριθ. 2092/91 του Συμβουλίου
    σχετικά με την βιολογική παραγωγή γεωργικών
    προϊόντων και συναφείς αναφορές γεωργικών
    προϊόντων και τροφίμων, όσον αφορά τις εισαγωγές
    από ορισμένες τρίτες χώρες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1593/93 DELLA COMMISSIONE del 24 giugno 1993 che modifica
    il regolamento (CEE) n. 3713/92 che rinvia, per quanto riguarda le importazioni
    da determinati paesi terzi, la data di applicazione dell' articolo 11, paragrafo
    1 del regolamento (CEE) n. 2092/91 del Consiglio, relativo al metodo di produzione
    biologico di prodotti agricoli e all' indicazione di tale metodo sui prodotti
    agricoli e sulle derrate alimentari
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1593/93 VAN DE COMMISSIE van 24 juni 1993 tot wijziging
    van Verordening (EEG) nr. 3713/92 houdende verlenging van de termijn na afloop
    waarvan artikel 11, lid 1, van Verordening (EEG) nr. 2092/91 van de Raad inzake
    de biologische produktiemethode en aanduidingen dienaangaande op landbouwprodukten
    en levensmiddelen, moet worden toegepast op de invoer uit bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1593/93 DA COMISSÃO de 24 de Junho de 1993 que altera
    o Regulamento (CEE) no 3713/92 que adia a aplicação do no 1 do artigo 11o do
    Regulamento (CEE) no 2092/91, relativo ao modo de produção biológico de produtos
    agrícolas e à sua indicação nos produtos agrícolas e nos géneros alimentícios,
    no que se refere às importações de certos países terceiros
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1593/93 DE LA COMISIÓN de 24 de junio de 1993 por
    el que se modifica el Reglamento (CEE) no 3713/92 por el que se aplaza la fecha
    de aplicación del apartado 1 del artículo 11 del Reglamento (CEE) no 2092/91
    del Consejo, sobre la producción agrícola ecológica y su indicación en los
    productos agrarios y alimenticios, en relación con las importaciones procedentes
    de determinados terceros países
  type: main
