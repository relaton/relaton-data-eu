title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2887/90 of 5 October 1990 on the rate of
    interest to be used for calculating the costs of financing intervention measures
    comprising buying-in, storage and disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2887/90 de la Commission du 5 octobre 1990 fixant
    les taux d'intérêt à appliquer pour le calcul des frais de financement des
    interventions consistant en achat, stockage et écoulements
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2887/90 DER KOMMISSION vom 5. Oktober 1990 zur Festsetzung
    des bei der Berechnung der Finanzierungskosten fuer Interventionen in Form von
    Ankauf, Lagerung und Absatz anzuwendenden Zinssatzes
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2887/90 af 5. oktober 1990 om fastsættelse
    af den rentesats, der skal anvendes ved beregningen af finansieringsomkostninger
    i forbindelse med interventioner i form af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2887/90 της Επιτροπής
    της 5ης Οκτωβρίου 1990 για τον καθορισμό των επιτοκίων
    που θα εφαρμοσθούν για τον υπολογισμό των δαπανών
    χρηματοδοτήσεως των παρεμβάσεως σε αγορά,
    αποθεματοποίηση και διάθεση
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2887/90 DELLA COMMISSIONE del 5 ottobre 1990 che stabilice
    i tassi d'interesse da applicare per il calcolo delle spese di finanziamento degli
    interventi consistenti in operazioni di acquisto, magazzinaggio e smercio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2887/90 VAN DE COMMISSIE van 5 oktober 1990 tot vaststelling
    van de bij de berekening van de financieringskosten van de interventies in de
    vorm van aankoop, opslag en afzet toe te passen rentevoeten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2887/90 DA COMISSAO de 5 de Outubro de 1990 que fixa
    as taxas de juro a aplicar no calculo das despesas de financiamento das intervençoes
    que consistem na compra, armazenagem e escoamentos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2887/90 DE LA COMISION de 5 de octubre de 1990 por
    el que se fijan los tipos de interés que habran de aplicarse para calcular los
    gastos de financiacion de las intervenciones consistentes en operaciones de compra,
    almacenamiento y salida
  type: main
