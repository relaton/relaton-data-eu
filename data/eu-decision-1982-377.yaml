    μέ τήν ονομασία «Akashi — Scanning Electron Microscope, model
    ISI-DS-130» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/377/CEE: Decisione della Commissione, del 19 maggio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Akashi - Scanning Electron Microscope,
    model ISI-DS-130" non può avvenire in franchigia dai dazi della tariffa doganale
    comune'
  type: main
- language: nl
  script: Latn
  content: '82/377/EEG: Beschikking van de Commissie van 19 mei 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Akashi-Scanning Electron Microscope, model
    ISI-DS-130" , niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
