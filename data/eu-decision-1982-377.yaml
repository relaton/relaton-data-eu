title:
- language: en
  script: Latn
  content: '82/377/EEC: Commission Decision of 19 May 1982 establishing that the apparatus
    described as ''Akashi - Scanning Electron Microscope, model ISI-DS-130'' may not
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/377/CEE: Décision de la Commission, du 19 mai 1982, constatant que
    l''importation de l''appareil dénommé "Akashi - Scanning Electron Microscope,
    model ISI - DS- 130" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/377/EWG: Entscheidung der Kommission vom 19. Mai 1982, mit der festgestellt
    wird, daß das Gerät ,,Akashi- Scanning Electron Microscope, model ISI-DS-130"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/377/EØF: Kommissionens beslutning af 19. maj 1982 om fastslåelse
    af, at indførsel af apparatet "Akashi - Scanning Electron Microscope, model ISI
    - DS-130" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/377/EOK: Απόφαση τής Επιτροπής τής 19ης Μαΐου
