title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2659/93 of 29 September 1993 correcting
    Regulation (EEC) No 2583/93 authorizing certain intervention agencies to put up
    for sale by tender 60 000 tonnes of durum wheat for export in the form of durum
    wheat meal and groats
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2659/93 de la Commission, du 29 septembre 1993, rectifiant
    le règlement (CEE) n° 2583/93 autorisant certains organismes d'intervention
    à mettre en adjudication 60 000 tonnes de froment dur en vue d'exportation sous
    forme de semoules et de gruaux de blé dur
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2659/93 der Kommission vom 29. September 1993 zur
    Berichtigung der Verordnung (EWG) Nr. 2583/93 zur Ermächtigung bestimmter Interventionsstellen
    zur Ausschreibung des Verkaufs von 60 000 Tonnen Hartweizen zur Ausfuhr in Form
    von Fein- und Grobgrieß
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2659/93 af 29. september 1993 om berigtigelse
    af forordning (EØF) nr. 2583/93 om bemyndigelse af visse interventionsorganer
    til at udbyde 60 000 tons hård hvede i licitation med henblik på udførsel i
    form af gryn og groft mel af hård hvede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2659/93 της Επιτροπής
    της 29ης Σεπτεμβρίου 1993 για τη διόρθωση του
    κανονισμού (ΕΟΚ) αριθ. 2583/93 που επιτρέπει σε
    ορισμένους οργανισμούς παρεμβάσεως να προκηρύξουν
    δημοπρασία 60 000 τόνων σκληρού σίτου με σκοπό
    την εξαγωγή του υπό μορφή σιμιγδαλιών και πλιγουριών
    σκληρού σίτου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2659/93 della Commissione, del 29 settembre 1993,
    che rettifica il regolamento (CEE) n. 2583/93 che autorizza taluni organismi di
    intervento a vendere mediante gara 60 000 t di frumento duro da esportare sotto
    forma di semole e semolini di frumento duro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2659/93 van de Commissie van 29 september 1993 houdende
    rectificatie van Verordening (EEG) nr. 2583/93 tot machtiging van bepaalde interventiebureaus
