    voor uitvoer daarvan in de vorm van gries en griesmeel van durum tarwe
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2659/93 da Comissão, de 29 de Setembro de 1993,
    que rectifica o Regulamento (CEE) nº 2583/93 que autoriza determinados organismos
    de intervenção a adjudicar 60 000 toneladas de trigo duro tendo em vista a sua
    exportação sob forma de sêmolas e grumos de trigo duro
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2659/93 de la Comisión, de 29 de septiembre de 1993,
