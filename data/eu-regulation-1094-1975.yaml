title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1094/75 of the Commission of 28 April 1975 further
    amending Regulation (EEC) No 2163/74 as regards the date by which animals eligible
    for the premium for the orderly marketing of certain adult bovine animals for
    slaughter must be slaughtered
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1094/75 de la Commission, du 28 avril 1975, portant
    nouvelle modification du règlement (CEE) n° 2163/74 en ce qui concerne la date
    limite pour l' abattage des animaux pouvant faire l' objet de la prime pour une
    mise sur le marché ordonnée de certains gros bovins de boucherie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1094/75 der Kommission vom 28. April 1975 zur erneuten
    Änderung der Verordnung (EWG) Nr. 2163/74 bezüglich des Endtermins für die
    Schlachtung von Rindern, für die die Prämie für eine geregelte Vermarktung
    bestimmter ausgewachsener Schlachtrinder beansprucht werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1094/75 af 28. april 1975 om en ny
    ændring af forordning (EØF) nr. 2163/74 for så vidt angår tidsfristen for
    slagtning af dyr, for hvilke der kan ydes præmie for reguleret markedsføring
    af visse former for voksent slagtekvæg
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1094/75 della Commissione, del 28 aprile 1975, recante
    nuova modifica del regolamento (CEE) n. 2163/74 per quanto riguarda la data limite
    di macellazione degli animali che possono formare oggetto del premio per un' ordinata
    immissione in commercio di taluni bovini adulti da macello
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1094/75 van de Commissie van 28 april 1975 houdende
    nieuwe wijziging van Verordening (EEG) nr. 2163/74 met betrekking tot de uiterste
    termijn voor het slachten van dieren die in aanmerking komen voor de premie voor
    het geordend op de markt brengen van bepaalde volwassen slachtrunderen
  type: main
