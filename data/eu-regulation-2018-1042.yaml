---
id: EURegulation20181042
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2018/1042 of 23 July 2018 amending Regulation
    (EU) No 965/2012, as regards technical requirements and administrative procedures
    related to introducing support programmes, psychological assessment of flight
    crew, as well as systematic and random testing of psychoactive substances to ensure
    medical fitness of flight and cabin crew members, and as regards equipping newly
    manufactured turbine-powered aeroplanes with a maximum certified take-off mass
    of 5700 kg or less and approved to carry six to nine passengers with a terrain
    awareness warning system
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2018/1042 de la Commission du 23 juillet 2018 modifiant
    le règlement (UE) n° 965/2012 en ce qui concerne les exigences techniques et
    les procédures administratives applicables à l'introduction de programmes de
    soutien, l'évaluation psychologique des membres de l'équipage de conduite, ainsi
    que le dépistage systématique et aléatoire de substances psychotropes en vue
    de garantir l'aptitude médicale des membres de l'équipage de conduite et de
    l'équipage de cabine, et en ce qui concerne l'installation d'un système d'avertissement
    et d'alarme d'impact sur les avions à turbine neufs dont la masse maximale certifiée
    au décollage est inférieure ou égale à 5700 kg et qui sont autorisés à transporter
    entre six et neuf passagers
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2018/1042 der Kommission vom 23. Juli 2018 zur Änderung
    der Verordnung (EU) Nr. 965/2012 in Bezug auf die technischen Anforderungen und
    Verwaltungsverfahren für die Einführung von Unterstützungsprogrammen, einer
    psychologischen Beurteilung der Flugbesatzung sowie von systematischen und stichprobenartigen
    Tests, bei denen die Flugbesatzung und Flugbegleiter zur Gewährleistung ihrer
    flugmedizinischen Tauglichkeit auf psychoaktive Substanzen getestet werden, sowie
    in Bezug auf die Ausrüstung neu gebauter turbinengetriebener Flugzeuge mit einer
    höchstzulässigen Startmasse von höchstens 5700 kg und einer genehmigten Anzahl
    von sechs bis neun Fluggastsitzen mit einem Geländewarnsystem
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2018/1042 на Комисията от 23 юли
    2018 година за изменение на Регламент (ЕС) № 965/2012,
    отнасящо се за техническите изисквания и административните
    процедури, свързани с въвеждането на помощни
    програми, психологичното оценяване на полетните
    екипажи и систематичните и случайните проверки
    за психоактивни вещества, целящи осигуряване
    на медицинска годност на членовете на полетните
    и кабинните екипажи, и отнасящо се за оборудването
    със система за предупреждение за опасно сближение
    с терена на новопроизведените самолети с турбинни
    двигатели с максимална сертифицирана излетна
    маса, по-малка или равна на 5700 kg и одобрени да
    превозват от шест до девет пътници
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2018/1042 ze dne 23. července 2018, kterým se
    mění nařízení (EU) č. 965/2012, pokud jde o technické požadavky a správní
    postupy týkající se zavedení podpůrných programů, psychologického posouzení
    členů letové posádky a systematického a náhodného testování členů letové
    posádky a palubních průvodčích na přítomnost psychoaktivních látek k
    zajištění jejich zdravotní způsobilosti a pokud jde o vybavení nově vyrobených
    letounů s turbínovým pohonem s maximální schválenou vzletovou hmotností
    5700 kg nebo nižší, které jsou schváleny k přepravě šesti až devíti
    cestujících na palubě, systémem výstrahy nebezpečné blízkosti terénu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2018/1042 af 23. juli 2018 om ændring af
    forordning (EU) nr. 965/2012 for så vidt angår de tekniske krav og administrative
    procedurer for indførelse af støtteprogrammer, psykologisk vurdering af flyvebesætningen
    samt systematisk og stikprøvebaseret test for psykoaktive stoffer for at sikre
    flyve- og kabinebesætningsmedlemmernes helbredsmæssige egnethed og for så vidt
    angår udstyring af nye turbinedrevne flyvemaskiner med en maksimal certificeret
    startmasse på 5700 kg eller derunder, der er godkendt til at befordre seks til
    ni passagerer, med et terrænadvarselssystem
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2018/1042 της Επιτροπής, της
    23ης Ιουλίου 2018, σχετικά με την τροποποίηση
    του κανονισμού (ΕΕ) αριθ. 965/2012, όσον αφορά τις
    τεχνικές απαιτήσεις και τις διοικητικές διαδικασίες
    σχετικά με την εισαγωγή υποστηρικτικών προγραμμάτων,
    την ψυχολογική αξιολόγηση πληρωμάτων πτήσης,
    καθώς και τον συστηματικό και τον δειγματοληπτικό
    έλεγχο ψυχοτρόπων ουσιών, για να διασφαλίζεται
    η καλή κατάσταση της υγείας των μελών πληρωμάτων
    πτήσης και των μελών πληρωμάτων θαλάμου επιβατών
    και όσον αφορά τον εξοπλισμό νεότευκτων αεροπλάνων
    με στροβιλοκινητήρα, μέγιστης πιστοποιημένης
    μάζας απογείωσης έως 5700 kg και εγκεκριμένων
    να μεταφέρουν έξι έως εννέα επιβάτες, με σύστημα
    προειδοποίησης γειτνίασης εδάφους
  type: main
- language: et
  script: Latn
  content: 'Komisjoni määrus (EL) 2018/1042, 23. juuli 2018, millega muudetakse
    määrust (EL) nr 965/2012 seoses järgmisega: toetusprogrammide kasutuselevõtuga
    seotud tehnilised nõuded ja haldusmenetlused, lennumeeskonna psühholoogiline
    hindamine, psühhoaktiivsetest ainetest põhjustatud joobe süstemaatiline ja
    pisteline kontroll lennu- ja salongimeeskonna liikmete hea terviseseisundi tagamiseks
    ning turbiinmootoriga, maksimaalse sertifitseeritud stardimassiga kuni 5700 kg,
    6–9 reisijale ettenähtud hiljuti toodetud lennukite varustamine reljeefi jälgimise
    ja hoiatussüsteemiga'
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2018/1042, annettu 23 päivänä heinäkuuta 2018,
    asetuksen (EU) N:o 965/2012 muuttamisesta siltä osin kuin on kyse ohjaamo- ja
    matkustamomiehistön lääketieteellisen kelpoisuuden varmistamiseen tarkoitettujen
    tukiohjelmien, ohjaamomiehistön psykologisen arvioinnin sekä psykoaktiivisten
    aineiden järjestelmällisen ja satunnaisen testauksen käyttöönottoon liittyvistä
    teknisistä vaatimuksista ja hallinnollisista menettelyistä ja siltä osin kuin
    on kyse uusien turbiinimoottorikäyttöisten lentokoneiden, joiden suurin sallittu
    lentoonlähtömassa on enintään 5700 kg ja jotka saavat kuljettaa 6–9 matkustajaa,
    varustamisesta maan läheisyydestä varoittavalla järjestelmällä
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2018/1042 оd 23. srpnja 2018. o izmjeni Uredbe (EU)
    br. 965/2012 u pogledu tehničkih zahtjeva i upravnih postupaka u vezi s uvođenjem
    programa podrške, psihološke procjene letačke posade i sustavnog i nasumičnog
    testiranja na psihoaktivne tvari kako bi se osigurala zdravstvena sposobnost članova
    letačke i kabinske posade te u pogledu opremanja novoproizvedenih turbinskih
    aviona s najvećom certificiranom masom pri uzlijetanju ne većom od 5700 kg koji
    mogu prevoziti šest do devet putnika sustavom za upozoravanje i prepoznavanje
    terena
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/1042 rendelete (2018. július 23.) a 965/2012/EU
    rendeletnek a támogatási programok bevezetéséhez, a hajózó személyzet pszichológiai
    vizsgálatához, valamint a hajózó személyzet és a légiutas-kísérő személyzet
    tagjainak alkalmasságát biztosító rendszeres és szúrópróbaszerű pszichoaktívanyag-vizsgálathoz
    kapcsolódó műszaki követelmények és igazgatási eljárások tekintetében,
    továbbá az újonnan gyártott, legfeljebb 5700 kg legnagyobb engedélyezett
    felszállótömegű, hat és kilenc közötti maximális üzemi utasülésszámú
    gázturbinás repülőgépek földközelség-jelző rendszerrel való felszerelése
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2018/1042 della Commissione, del 23 luglio 2018, che modifica
    il regolamento (UE) n. 965/2012 per quanto riguarda i requisiti tecnici e le procedure
    amministrative concernenti l'introduzione di programmi di sostegno, della valutazione
    psicologica dell'equipaggio di condotta, nonché di test sistematici e casuali
    per il rilevamento di sostanze psicoattive al fine di garantire l'idoneità medica
    dei membri degli equipaggi di condotta e di cabina e per quanto riguarda l'equipaggiamento
    dei velivoli di nuova fabbricazione a turbina, aventi una massa massima certificata
    al decollo pari o inferiore a 5700 kg e autorizzati a trasportare da sei a nove
    passeggeri, con un sistema di avviso e rappresentazione del terreno
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2018/1042 (2018. gada 23. jūlijs), ar ko Regulu
    (ES) Nr. 965/2012 groza attiecībā uz tehniskajām prasībām un administratīvajām
    procedūrām, kas saistītas ar atbalsta programmu ieviešanu, lidojuma apkalpes
    psiholoģisko novērtēšanu, kā arī sistemātiskām un izlases veida pārbaudēm
    psihoaktīvo vielu ietekmes konstatēšanai nolūkā nodrošināt lidojuma apkalpes
    un salona apkalpes locekļu medicīnisko piemērotību un attiecībā uz jaunizgatavotu
    turbodzinēju lidmašīnu, kuru maksimālā sertificētā pacelšanās masa nepārsniedz
    5700 kg un kuras apstiprinātas sešu līdz deviņu pasažieru pārvadāšanai,
    aprīkošanu ar reljefa apzināšanās brīdināšanas sistēmu
  type: main
- language: lt
  script: Latn
  content: 2018 m. liepos 23 d. Komisijos reglamentas (ES) 2018/1042, kuriuo dėl
    techninių reikalavimų ir administracinių procedūrų, susijusių su paramos
    programų įvedimu, skrydžio įgulos narių psichologiniu vertinimu, taip pat
    sisteminiu ir atrankiuoju psichoaktyviųjų medžiagų vartojimo tikrinimu siekiant
    užtikrinti, kad skrydžio įgulos ir keleivių salono įgulos nariai būtų tinkamos
    sveikatos būklės, ir dėl įspėjimo apie vietovės reljefą sistemos įrengimo
    naujuose lėktuvuose su turbininiais varikliais, kurių didžiausia sertifikuota
    kilimo masė yra ne didesnė kaip 5700 kg ir kuriais galima vežti nuo šešių
    iki devynių keleivių, iš dalies keičiamas Reglamentas (ES) Nr. 965/2012
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2018/1042 tat-23 ta' Lulju 2018 li jemenda
    r-Regolament (UE) Nru 965/2012, fir-rigward tar-rekwiżiti tekniċi u l-proċeduri
    amministrattivi relatati mal-introduzzjoni ta' programmi ta' appoġġ, mal-valutazzjoni
    psikoloġika tal-ekwipaġġ tat-titjira, kif ukoll mal-ittestjar aleatorju u sistematiku
    għas-sustanzi psikoattivi sabiex tiġi żgurata l-idoneità medika tal-membri
    tal-ekwipaġġ tal-kabina u tat-titjira, u fir-rigward tat-tgħammir tal-ajruplani
    ġodda li jaħdmu b'magna b'turbina b'massa massima ta' tlugħ iċċertifikata
    ta' 5700 kg jew inqas approvati biex iġorru minn sitta sa disa' passiġġieri
    b'sistema ta' twissija u ta' għarfien tat-terren
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2018/1042 van de Commissie van 23 juli 2018 tot wijziging
    van Verordening (EU) nr. 965/2012 voor wat betreft de technische eisen en administratieve
    procedures met betrekking tot de invoering van ondersteuningsprogramma's, psychologische
    beoordelingen van cockpitbemanningsleden en systematische en willekeurige tests
    op psychoactieve stoffen, teneinde de medische geschiktheid van cockpit- en cabinebemanningsleden
    te garanderen en voor wat betreft de uitrusting van nieuwe vliegtuigen met schroefturbinemotoren
    met een gecertificeerde maximale startmassa van hoogstens 5700 kg die in staat
    zijn zes tot negen passagiers te vervoeren, met een terreinsignalerings- en waarschuwingssysteem
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2018/1042 z dnia 23 lipca 2018 r. zmieniające
    rozporządzenie (UE) nr 965/2012 odnośnie do wymagań technicznych i procedur
    administracyjnych dotyczących programów wsparcia, testów psychologicznych załogi
    lotniczej, a także systematycznych i losowych badań na obecność substancji
    psychoaktywnych w celu zapewnienia sprawności fizycznej i psychicznej załogi
    lotniczej i personelu pokładowego, oraz odnośnie do wyposażenia nowo wyprodukowanych
    samolotów z napędem turbinowym o maksymalnej certyfikowanej masie startowej
    nie większej niż 5700 kg posiadających homologację na przewóz od sześciu
    do dziewięciu pasażerów w zbliżeniowy system ostrzegania o przeszkodach terenu
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2018/1042 da Comissão, de 23 de julho de 2018, que altera
    o Regulamento (UE) n.° 965/2012 no que respeita aos requisitos técnicos e aos
    procedimentos administrativos aplicáveis à introdução de programas de apoio,
    à avaliação psicológica da tripulação de voo, bem como à realização de
    testes sistemáticos e aleatórios para despistagem de substâncias psicoativas
    para garantir a aptidão médica dos tripulantes de voo e de cabina, e no que
    respeita à instalação de um sistema de perceção e aviso do terreno em aviões
    de turbina recentemente fabricados com massa máxima certificada à descolagem
    inferior a 5700 kg, autorizados a transportar seis a nove passageiros
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2018/1042 al Comisiei din 23 iulie 2018 de modificare
    a Regulamentului (UE) nr. 965/2012 în ceea ce privește cerințele tehnice și
    procedurile administrative legate de introducerea programelor de sprijin, a evaluării
    psihologice a echipajului de zbor, precum și a testării sistematice și aleatorii
    în vederea depistării consumului de substanțe psihoactive, pentru a se asigura
    aptitudinea din punct de vedere medical a membrilor echipajului de zbor și de
    cabină, precum și în ceea ce privește echiparea cu un sistem de avertizare
    și de informare asupra configurației terenului a avioanelor cu motor cu turbină
    nou fabricate care au o masă maximă certificată la decolare de 5700 kg sau
    mai mică și care sunt aprobate să transporte între șase și nouă pasageri
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2018/1042 z 23. júla 2018, ktorým sa mení nariadenie
    (EÚ) č. 965/2012, pokiaľ ide o technické požiadavky a administratívne postupy
    týkajúce sa zavedenia podporných programov, psychologického posudzovania letovej
    posádky, ako aj systematického a náhodného zisťovania prítomnosti psychoaktívnych
    látok s cieľom zabezpečiť zdravotnú spôsobilosť členov letovej posádky
    a palubných sprievodcov, a pokiaľ ide o vybavenie novo vyrobených letúnov
    s turbínovým pohonom s maximálnou schválenou vzletovou hmotnosťou 5700 kg
    alebo menšou, ktoré sú schválené na prepravu šiestich až deviatich cestujúcich,
    výstražným systémom signalizácie blízkosti zeme
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2018/1042 z dne 23. julija 2018 o spremembi Uredbe
    (EU) št. 965/2012 glede tehničnih zahtev in upravnih postopkov v zvezi z uvedbo
    podpornih programov, psihološko oceno letalske posadke ter sistematičnimi in
    naključnimi preizkusi za ugotavljanje prisotnosti psihoaktivnih snovi, da se
    zagotovi zdravstvena sposobnost letalske posadke in kabinskega osebja, ter glede
    opremljanja novih letal na turbinski pogon z največjo certificirano vzletno maso
    5700 kg ali manj in največjim operativnim številom potniških sedežev od šest
    do devet s sistemom opozarjanja na bližino tal
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2018/1042 de la Comisión, de 23 de julio de 2018, que
    modifica el Reglamento (UE) n.° 965/2012 en lo que respecta a los requisitos
    técnicos y procedimientos administrativos relativos a la introducción de programas
    de apoyo, la evaluación psicológica de las tripulaciones de vuelo y los controles
    sistemáticos y aleatorios de sustancias psicoactivas para asegurar la aptitud
    médica de los miembros de las tripulaciones de vuelo y de cabina, y en lo que
    respecta al equipamiento de los aviones de turbina nuevos con una masa máxima
    certificada de despegue de 5700 kg o menos y aprobados para transportar a entre
    6 y 9 pasajeros con un sistema de advertencia y alarma de impacto
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2018/1042 av den 23 juli 2018 om ändring
    av förordning (EU) nr 965/2012 vad gäller tekniska krav och administrativa förfaranden
    i samband med införande av stödprogram, psykologiska bedömningar av flygbesättning
    samt systematiska och slumpmässiga kontroller av psykoaktiva substanser för
    att säkerställa medicinsk lämplighet vad gäller flygbesättnings- och kabinbesättningsmedlemmar
    och vad gäller att utrusta nytillverkade turbinmotordrivna flygplan vars maximala
    certifierade startmassa är högst 5700 kg och som är godkända att transportera
    sex till nio passagerare med ett terrängvarningssystem
  type: main
