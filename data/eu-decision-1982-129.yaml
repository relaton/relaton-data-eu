    applicato nel Benelux, nella Repubblica federale di Germania, in Grecia e nel
    Regno Unito nei confronti della Cina per quanto concerne taluni prodotti industriali'
  type: main
- language: nl
  script: Latn
  content: '82/129/EEG: Beschikking van de Commissie van 17 februari 1982 tot wijziging
