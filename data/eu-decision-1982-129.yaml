title:
- language: en
  script: Latn
  content: '82/129/EEC: Commission Decision of 17 February 1982 changing the import
    arrangements established by Commission Decision 81/248/EEC and applied in the
    Benelux countries, the Federal Republic of Germany, Greece, Italy and the United
    Kingdom in respect of China regarding various industrial products'
  type: main
- language: fr
  script: Latn
  content: '82/129/CEE: Décision de la Commission, du 17 février 1982, modifiant
    le régime d''importation prévu par la décision 81/248/CEE de la Commission
    et appliqué au Benelux, en République fédérale d''Allemagne, en Grèce, en
    Italie et au Royaume-Uni à l''égard de la Chine en ce qui concerne divers produits
    industriels'
  type: main
- language: de
  script: Latn
  content: '82/129/EWG: Entscheidung der Kommission vom 17. Februar 1982 zur Änderung
    der durch Entscheidung der Kommission 81/248/EWG festgelegten und in den Benelux-Ländern,
    der Bundesrepublik Deutschland, Griechenland, Italien und im Vereinigten Königreich
    gegenüber China für einige gewerbliche Waren angewandten Einfuhrregelung'
  type: main
- language: da
  script: Latn
  content: '82/129/EØF: Kommissionens beslutning af 17. februar 1982 om ændring
    af den importordning, der er fastsat ved Kommissionens beslutning 81/248/EØF,
    og som anvendes i Benelux-landene, Forbundsrepublikken Tyskland, Grækenland,
    Italien og Det forenede Kongerige over for Kina, for så vidt angår forskellige
    industrivarer'
  type: main
- language: el
  script: Grek
  content: '82/129/EOK: Απόφαση της Επιτροπής της 17ης Φεβρουαρίου
    1982 περί τροποποίησης του καθεστώτος εισαγωγής
    που προβλέπεται από την απόφαση 81/248/EOK της Επιτροπής
    και εφαρμόζεται στην Μπενελούξ, στην Ομοσπονδιακή
    Δημοκρατία της Γερμανίας, στην Ελλάδα, στην
    Ιταλία και στο Ηνωμένο Βασίλειο έναντι της
    Κίνας, όσον αφορά διάφορα βιομηχανικά προϊόντα'
  type: main
- language: it
  script: Latn
  content: '82/129/CEE: Decisione della Commissione, del 17 febbraio 1982, che modifica
