  content: Commission Regulation (EEC) No 2888/92 of 1 October 1992 re- establishing
    the levying of customs duties on products of category 9 (order No 40.0090), originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
