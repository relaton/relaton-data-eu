title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3293/82 of 7 December 1982 re-establishing
    the levying of customs duties on borosilicates of lead, falling within subheading
    32.08 ex B and originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply 8
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3293/82 de la Commission, du 7 décembre 1982, portant
    rétablissement de la perception des droits de douane applicables aux borosilicates
    de plomb, de la sous-position 32.08 ex B du tarif douanier commun, originaires
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil C
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3293/82 der Kommission vom 7. Dezember 1982 zur Wiedereinführung
    der Erhebung der Zölle für Bleiborosilikate der Tarifstelle 32.08 ex B, mit
    Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3293/82 af 7. december 1982 om genindførelse
    af opkrævning af told for blyborosilicat, henhørende under pos. 32.08 ex B og
    med oprindelse i Mexico, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81 Ø
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3293/82 τής Επιτροπής
    τής 7ης Δεκεμβρίου 1982 σχετικά μέ τήν αποκατάσταση
    τής εφαρμογής τών δασμών γιά τά βοροπυριτικά
    τού μολύβδου τής διακρίσεως 32. 08 ex B τού Κοινού
