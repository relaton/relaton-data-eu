    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3293/82 della Commissione, del 7 dicembre 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai borosilicati di piombo
    della sottovoce 32.08 ex B della tariffa doganale comune, originari del Messico
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3293/82 van de Commissie van 7 december 1982 houdende
