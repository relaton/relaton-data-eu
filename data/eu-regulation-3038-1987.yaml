    Tarifstelle 71.12 A des Gemeinsamen Zolltarifs mit Ursprung in Thailand, dem die
    in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3038/87 af 9. oktober 1987 om genindførelse
