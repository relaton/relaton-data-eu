    e loro parti, di metalli preziosi della sottovoce 71.12 A della tariffa doganale
    comune, originari della Tailandia beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3038/87 van de Commissie van 9 oktober 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bijouterieën
    en juwelen, alsmede delen daarvan, van edele metalen, van postonderverdeling 71.12
    A van het gemeenschappelijk douanetarief, van oorsprong uit Thailand, waarvoor
    de in Verordening (EEG) nr. 3924/86 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
