title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3038/87 of 9 October 1987 re-establishing
    the levying of customs duties on articles of jewellery and parts thereof, of precious
    metal, falling within subheading 71.12 A of the Common Customs Tariff originating
    in Thailand to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3038/87 de la Commission du 9 octobre 1987 portant
    rétablissement de la perception des droits de douane applicables aux articles
    de bijouterie et de joaillerie et leurs parties, en métaux précieux, de la sous-position
    71.12 A du tarif douanier commun, originaires de Thaïlande, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3038/87 der Kommission vom 9. Oktober 1987 zur Wiedereinführung
