    zur Festlegung eines Rahmens für die Sanierung und Abwicklung von Kreditinstituten
    und Wertpapierfirmen im Hinblick auf technische Regulierungsstandards zur Spezifizierung
    einer Mindestauswahl der in die detaillierten Aufzeichnungen aufzunehmenden Angaben
    zu Finanzkontrakten und der Umstände, unter denen die Anforderung aufzuerlegen
    ist
  type: main
