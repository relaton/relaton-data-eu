title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2016/1712 of 7 June 2016 supplementing
    Directive 2014/59/EU of the European Parliament and of the Council establishing
    a framework for the recovery and resolution of credit institutions and investment
    firms with regard to regulatory technical standards specifying a minimum set of
    the information on financial contracts that should be contained in the detailed
    records and the circumstances in which the requirement should be imposed
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/1712 de la Commission du 7 juin 2016 complétant
    la directive 2014/59/UE du Parlement européen et du Conseil établissant un cadre
    pour le redressement et la résolution des établissements de crédit et des entreprises
    d'investissement par des normes techniques de réglementation dressant une liste
    minimale des informations sur les contrats financiers qui devraient figurer dans
    des registres détaillés et précisant les circonstances dans lesquelles cette
    exigence devrait être imposée
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2016/1712 der Kommission vom 7. Juni 2016 zur
