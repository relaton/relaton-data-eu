title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1959/78 of 10 August 1978 re-establishing
    the levying of customs duties on nails, tacks, etc., falling within heading No
    73.31, originating in Romania to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1959/78 de la Commission, du 10 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux pointes,
    clous, etc., de la position tarifaire 73.31, originaires de Roumanie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1959/78 der Kommission vom 10. August 1978 zur Wiedereinführung
    des Zollsatzes für Stifte, Nägel, usw., der Tarifnummer 73.31, mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1959/78 af 10. august 1978 om genindførelse
    af opkrævning af toldafgifter for søm, spiger, under position 73.31, som har
    oprindelse i Rumænien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1959/78 della Commissione, del 10 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle punte, chiodi, ecc.,
    esclusi quelli con capocchia di rame, della voce doganale 73.31, originari della
    Romania beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1959/78 van de Commissie van 10 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op draadnagels,
    spijkers, enz., van post 73.31, van oorsprong uit Roemenië, ten behoeve waarvan
    bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
