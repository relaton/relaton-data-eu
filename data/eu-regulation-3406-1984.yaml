id: EURegulation34061984
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3406/84 of 4 December 1984 authorizing the
    use in the production of sparkling wines, aerated sparkling and aerated semi-sparkling
    wines or wines obtained from grapes harvested in certain parts of zone A which
    do not have the alcoholic strength by volume required under the common organization
    of the market in wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3406/84 de la Commission du 4 décembre 1984 permettant
    l' utilisation dans l' élaboration de vins mousseux, de vins mousseux gazéifiés
    et de vins pétillants gazéifiés de vins issus des raisins récoltés dans certaines
    parties de la zone A n' ayant pas le titre alcoométrique volumique requis par
    l' organisation commune des marchés du vin
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3406/84 der Kommission vom 4. Dezember 1984 zur Gestattung
    der Verwendung von Wein, der aus in bestimmten Teilen der Weinbauzone A geernteten
    Weintrauben gewonnen wurde und nicht den von der gemeinsamen Marktorganisation
    vorgeschriebenen Alkoholgehalt aufweist, zur Herstellung von Schaumwein, Schaumwein
    mit zugesetzter Kohlensäure und Perlwein mit zugesetzter Kohlensäure
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3406/84 af 4. december 1984 om tilladelse
    til ved fremstilling af mousserende vin, mousserende vin tilsat kulsyre og perlevin
    tilsat kulsyre at anvende vin af druer, der er høstet i visse dele af zone A,
    og som ikke har det alkoholindhold udtrykt i volumen, der er krævet i den fælles
    markedsordning for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3406/84 της Επιτροπής
    της 4ης Δεκεμβρίου 1984 που επιτρέπει, κατά την
    παρασκευή αφρωδών οίνων, αεριούχων οίνων ή
    ημιαεριούχων οίνων, τη χρησιμοποίηση οίνων
    οι οποίοι παρήχθησαν από σταφύλια που συγκομίστηκαν
    σε ορισμένες περιοχές της ζώνης Α και οι οποίοι
    δεν έχουν τον αλκοολικό τίτλο κατ' όγκο που
    απαιτείται από την κοινή οργάνωση της οινικής
    αγοράς
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3406/84 della Commissione del 4 dicembre 1984 che
    consente l' utilizzazione, nell' elaborazione di vini spumanti, di vini spumanti
    gassificati e di vini frizzanti gassificati, di vini ottenuti da uve raccolte
    in talune parti della zona A che non hanno il titolo alcolometrico volumico richiesto
    dall' organizzazione comune del mercato vitivinicolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3406/84 van de Commissie van 4 december 1984 houdende
    toelating om bij de vervaardiging van mousserende wijn, mousserende wijn waaraan
    koolzuurgas is toegevoegd en parelwijn waaraan koolzuurgas is toegevoegd, gebruik
    te maken van wijn afkomstig van in sommige gebieden van wijnbouwzone A geoogste
    druiven, die het bij de gemeenschappelijke ordening van de wijnmarkt voorgeschreven
    alcohol-volumegehalte niet bezit
  type: main
