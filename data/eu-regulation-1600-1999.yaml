title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1600/1999 of 12 July 1999 imposing definitive
    anti-dumping duties and collecting definitively the provisional duties imposed
    on imports of stainless steel wires with a diameter of 1 mm or more originating
    in India and terminating the proceeding concerning imports of stainless steel
    wires with a diameter of 1 mm or more originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1600/1999 du Conseil du 12 juillet 1999 instituant
    un droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les fils en aciers inoxydables d'un diamètre égal ou supérieur
    à 1 millimètre originaires de l'Inde et clôturant la procédure concernant
    les importations de fils en aciers inoxydables d'un diamètre égal ou supérieur
    à 1 millimètre originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1600/1999 des Rates vom 12. Juli 1999 zur Einführung
    endgültiger Antidumpingzölle auf die Einfuhren von Draht aus nichtrostendem
    Stahl mit einem Durchmesser von 1 mm oder mehr mit Ursprung in Indien, zur endgültigen
    Vereinnahmung der vorläufigen Zölle auf diese Einfuhren und zur Einstellung
    des Verfahrens gegenüber den Einfuhren von Draht aus nichtrostendem Stahl mit
    einem Durchmesser von 1 mm oder mehr mit Ursprung in der Republik Korea
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1600/1999 ze dne 12. července 1999 o uložení
    konečného antidumpingového cla z dovozu drátů z korozivzdorné oceli o průměru
    nejméně 1 mm pocházejících z Indie a konečném výběru uloženého prozatímního
    cla a o zastavení řízení týkajícího se dovozu drátů z korozivzdorné
    oceli o průměru nejméně 1 mm pocházejících z Korejské republiky
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1600/1999 af 12. juli 1999 om indførelse af
    endelig antidumpingtold og endelig opkrævning af den midlertidige told på importen
    af tråd af rustfrit stål af diameter 1 mm og derover med oprindelse i Indien
    og om afslutning af proceduren vedrørende importen af tråd af rustfrit stål
    af diameter 1 mm og derover med oprindelse i Republikken Korea
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1600/1999 του Συμβουλίου
    της 12ης Ιουλίου 1999 για την επιβολή οριστικών
    δασμών αντιντάμπινγκ και την οριστική είσπραξη
    των προσωρινών δασμών που επιβλήθηκαν στις
    εισαγωγές συρμάτων από ανοξείδωτους χάλυβες
    με διάμετρο 1 mm ή μεγαλύτερη, καταγωγής Ινδίας,
    και την περάτωση της διαδικασίας σχετικά με
    τις εισαγωγές συρμάτων από ανοξείδωτους χάλυβες
    με διάμετρο 1 mm ή μεγαλύτερη καταγωγής Δημοκρατίας
    της Κορέας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1600/1999, 12. juuli 1999, millega kehtestatakse
    Indiast pärit vähemalt 1 mm läbimõõduga roostevaba terastraadi impordi suhtes
    lõplik dumpinguvastane tollimaks ja nõutakse lõplikult sisse selle impordi
    suhtes kehtestatud ajutine tollimaks ning lõpetatakse menetlus Korea Vabariigist
    pärit vähemalt 1 mm läbimõõduga roostevaba terastraadi impordi suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1600/1999, annettu 12 päivänä heinäkuuta
    1999, lopullisten polkumyyntitullien käyttöönotosta Intiasta peräisin olevan,
    läpimitaltaan vähintään 1 mm:n ruostumattoman teräslangan tuonnissa, kyseisessä
    tuonnissa käyttöön otettujen väliaikaisten tullien lopullisesta kantamisesta
    sekä Korean tasavallasta peräisin olevan, läpimitaltaan vähintään 1 mm:n
    ruostumattoman teräslangan tuontia koskevan menettelyn päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 1600/1999/EK rendelete (1999. július 12.) az Indiából származó
    1 mm vagy annál nagyobb átmérőjű rozsdamentes acélhuzal behozatalára végleges
    dömpingellenes vámok kivetéséről és a kivetett ideiglenes vámok végleges
    beszedéséről, valamint a Koreai Köztársaságból származó 1 mm vagy annál
    nagyobb átmérőjű rozsdamentes acélhuzal behozatalára vonatkozó eljárás
    megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1600/1999 del Consiglio del 12 luglio 1999 che istituisce
    dazi antidumping definitivi sulle importazioni di filo di acciaio inossidabile
    avente un diametro pari o superiore a 1 mm originarie dell'India, decide la riscossione
    definitiva dei dazi provvisori imposti sulle stesse importazioni e chiude il procedimento
    relativo alle importazioni di filo di acciaio inossidabile avente un diametro
    pari o superiore a 1 mm originarie della Repubblica di Corea
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1600/1999 (1999. gada 12. jūlijs), ar ko uzliek
    galīgus antidempinga maksājumus un galīgi iekasē pagaidu maksājumus, kuri
    uzlikti Indijas izcelsmes nerūsējošā tērauda stiepļu ar 1 mm un lielāku
    diametru ievedumiem, un izbeidz procesu attiecībā uz Korejas Republikas izcelsmes
    nerūsējošā tērauda stiepļu ar 1 mm un lielāku diametru ievedumiem
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 12 d. Tarybos reglamentas (EB) Nr. 1600/1999, nustatantis
    galutinius antidempingo muitus ir galutinai surenkantis laikinuosius muitus, taikomus
    Indijos kilmės 1 mm ar didesnio diametro nerūdijančio plieno vielos importui,
    ir nutraukiantis procedūrą dėl Korėjos Respublikos kilmės 1 mm ar didesnio
    diametro nerūdijančio plieno vielos importo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1600/1999 tat-12 ta' Lulju 1999 li jimponi
    dazji definitivi kontra id-dumping u jiġbor definittivament dazji provisorji
    fuq l-importazzjoni ta' wajers tal-azzar li ma jissaddadx b'dijametru ta' 1 mm
    jew iżjed li oriġina fl-Indja u jitermina il-proċediment li jikkonċerna l-importazzjoni
    ta' wajers ta' l-azzar li ma jissaddadx b' dijametru ta' 1 mm jew iżjed li oriġina
    fir-Repubblika tal-Koreja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1600/1999 van de Raad van 12 juli 1999 tot instelling
    van definitieve antidumpingrechten en tot definitieve inning van de voorlopig
    ingestelde antidumpingrechten op de invoer van roestvrij staaldraad met een diameter
    van 1 mm of meer uit India alsmede tot beëindiging van de procedure met betrekking
    tot de invoer van roestvrij staaldraad met een diameter van 1 mm of meer uit de
    Republiek Korea
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1600/1999 z dnia 12 lipca 1999 r. nakładające
    ostateczne cła antydumpingowe i pobierające ostatecznie cła tymczasowe nałożone
    na przywóz drutu ze stali nierdzewnej o średnicy 1 mm lub większej pochodzącego
    z Indii oraz kończące postępowanie dotyczące przywozu drutu ze stali nierdzewnej
    o średnicy 1 mm lub większej pochodzącego z Republiki Korei
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1600/1999 do Conselho de 12 de Julho de 1999 que institui
    direitos anti-dumping definitivos e que prevê a cobrança definitiva dos direitos
    provisórios instituídos sobre as importações de fios de aço inoxidável de
    diâmetro igual ou superior a 1 mm originários da Índia e que encerra o processo
    relativo às importações dos fios de aço inoxidável de diâmetro igual ou
    superior a 1 milímetro originários da República da Coreia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1600/1999 z 12. júla 1999, ktorým sa ukladá
    konečné antidumpingové clo a s konečnou platnosťou sa vyberá dočasné clo
    uložené na dovozy drôtov z nehrdzavejúcej ocele s priemerom 1 mm alebo viac
    s pôvodom v Indii a ktorým sa ukončuje konanie týkajúce sa dovozu drôtov
    z nehrdzavejúcej ocele o priemere 1 mm alebo viac s pôvodom v Kórejskej republike
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1600/1999 z dne 12. julija 1999 o uvedbi dokončnih
    protidampinških dajatev in o dokončnem pobiranju začasnih dajatev, uvedenih
    na uvoz žice iz nerjavnega jekla premera 1 mm ali več s poreklom iz Indije,
    ter o ustavitvi postopka v zvezi z uvozom žice iz nerjavnega jekla premera 1
    mm ali več s poreklom iz Republike Koreje
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1600/1999 del Consejo de 12 de julio de 1999 por el
    que se establecen derechos antidumping definitivos y se perciben definitivamente
    los derechos provisionales establecidos sobre las importaciones de alambre de
    acero inoxidable de diámetro igual o mayor de 1 mm originario de la India y se
    da por concluido el procedimiento referente a las importaciones de alambre de
    acero inoxidable de diámetro igual o superior a 1 mm originario de la República
    de Corea
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1600/1999 av den 12 juli 1999 om införande
    av slutgiltiga antidumpningstullar och slutgiltigt uttag av de preliminära tullar
    som införts på import av tråd av rostfritt stål med en diameter av minst 1
    mm med ursprung i Republiken Indien och om avslutande av förfarandet rörande
    import av tråd av rostfritt stål med en diameter av minst 1 mm med ursprung
    i Republiken Korea
