title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 867/1999 of 26 April 1999 determining the
    extent to which applications lodged in April 1999 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 867/1999 de la Commission, du 26 avril 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 1999 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords conclus par la Communauté avec la république
    de Pologne, la république de Hongrie, la République tchèque, la Slovaquie,
    la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 867/1999 der Kommission vom 26. April 1999 über die
    Festsetzung des Umfangs, in dem die im April 1999 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen Republik, der Slowakei,
    Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 867/1999 af 26. april 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    1999 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 867/1999 της Επιτροπής,
    της 26ης Απριλίου 1999, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Απρίλιο του 1999
    για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τις
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Δημοκρατία της Πολωνίας, τη Δημοκρατία της
    Ουγγαρίας, την Τσεχική Δημοκρατία, τη Σλοβακία,
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 867/1999, annettu 26 päivänä huhtikuuta 1999,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti huhtikuussa 1999 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 867/1999 della Commissione, del 26 aprile 1999, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 1999 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi conclusi tra la Comunità e
    la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia,
    la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 867/1999 van de Commissie van 26 april 1999 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector varkensvlees, die in april 1999 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    overeenkomsten met de Republiek Polen, de Republiek Hongarije, de Tsjechische
    Republiek, de Slowaakse Republiek, Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 867/1999 da Comissão, de 26 de Abril de 1999, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Abril de
    1999 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
