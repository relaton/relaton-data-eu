title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1331/85 of 22 May 1985 re-establishing the
    levying of customs duties on oxalic acid and its salts and esters, falling within
    subheading 29.15 A I and originating in Brazil, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1331/85 de la Commission du 22 mai 1985 portant rétablissement
    de la perception des droits de douane applicables à l' acide oxalique, ses sels
    et ses esters, de la sous-position 29.15 A I du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1331/85 der Kommission vom 22. Mai 1985 zur Wiedereinführung
    der Erhebung der Zölle für Oxalsäure, ihre Salze und Ester der Tarifstelle
    29.15 A I mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3562/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1331/85 af 22. maj 1985 om genindførelse
    af opkrævning af told for oxalsyre samt salte og estere deraf, henhørende under
    pos. 29.15 A I og med oprindelse i Brasilien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1331/85 της Επιτροπής
    της 22ας Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των δασμών για το οξαλικό οξύ, άλατα και εστέρες
    αυτού, της διακρίσεως 29.15 Α Ι του Κοινού Δασμολογίου,
    καταγωγής Βραζιλίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1331/85 della Commissione del 22 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili all' acido ossalico, suoi sali e
    suoi esteri, della sottovoce 29.15 A I della tariffa doganale comune, originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1331/85 van de Commissie van 22 mei 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op oxaalzuur,
    alsmede zouten en esters daarvan, van postonderverdeling 29.15 A I, van oorsprong
    uit Brazilië, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
