    applicabili alla navi battenti bandiera degli Stati membri, esclusi la Spagna
    e il Portogallo, nelle acque soggette alla sovranità o alla giurisdizione della
    Spagna
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3974/89 VAN DE RAAD van 19 december 1989 tot vaststelling,
    voor 1990, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag voeren van de Lid-Staten,
    met uitzondering van Spanje en Portugal, in de wateren die onder de soevereiniteit
    of de jurisdictie van Spanje vallen
  type: main
- language: pt
