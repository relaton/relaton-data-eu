title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3223/83 of 15 November 1983 on the fixing of
    the total allowable catch of Baltic Sea cod, the share available to the Community
    and the quota allocations among the Member States in 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3223/83 du Conseil du 15 novembre 1983 fixant, en ce
    qui concerne les stocks de cabillauds se trouvant dans la mer Baltique, le total
    admissible des captures pour 1983, la part de ces captures attribuée à la Communauté
    et la répartition de cette part entre les États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3223/83 des Rates vom 15. November 1983 zur Festlegung
    der zulässigen Gesamtfangmengen im Jahre 1983 für die Kabeljaubestände der
    Ostsee, des für die Gemeinschaft verfügbaren Anteils und der Aufteilung dieses
    Anteils auf die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3223/83 af 15. november 1983 om fastsættelse
    af den samlede tilladte fangstmængde for østersøtorsk, Fællesskabets andel
    af denne fangstmængde og denne andels fordeling blandt medlemsstaterne i 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3223/83 του Συμβουλίου
    της 15ης Νοεμβρίου 1983 για τον καθορισμό, όσον
    αφορά τα αποθέματα γάδων που ευρίσκονται στη
    Βαλτική Θάλασσα, του συνόλου των επιτρεπομένων
    αλιευμάτων για το 1983, του μεριδίου αυτών των
    αλιευμάτων που χορηγείται στην Κοινότητα και
    της κατανομής του μεριδίου αυτού στα κράτη
    μέλη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3223/83 del Consiglio del 15 novembre 1983 che fissa
    il totale di catture ammesse, la quota di queste catture disponibile per la Comunità
    e la ripartizione di detta quota tra gli Stati membri, per il merluzzo bianco
    del Mar Baltico nel 1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3223/83 van de Raad van 15 november 1983 inzake de
    vaststelling van de totaal toegestane vangsten van kabeljauw uit de Oostzee, het
    beschikbare gedeelte voor de Gemeenschap en de verdeling van de quota over de
    Lid-Staten in 1983
