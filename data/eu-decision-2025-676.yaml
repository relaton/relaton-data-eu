title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2025/676 of 3 April 2025 on relief from import
    duties and VAT exemption on importation granted for goods to be distributed or
    made available free of charge to persons fleeing Russia’s military aggression
    against Ukraine and to persons in need in Ukraine (notified under document C(2025)
    1932)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/676 de la Commission du 3 avril 2025 relative à l’octroi
    d’une franchise des droits à l’importation et d’une exonération de la
    TVA à l’importation pour les marchandises destinées à être distribuées
    aux personnes fuyant l’agression militaire de la Russie contre l’Ukraine et
    aux personnes dans le besoin dans ce pays ou à être mises à leur disposition
    gratuitement [notifiée sous le numéro C(2025) 1932]
  type: main
