    certains végétaux destinés à la plantation des espèces Ligustrum delavayanum
    et Ligustrum japonicum originaires du Royaume-Uni, et le règlement d’exécution
    (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires applicables à l’introduction
