title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 43/2003 of 23 December 2002 laying down detailed
    rules for applying Council Regulations (EC) No 1452/2001, (EC) No 1453/2001 and
    (EC) No 1454/2001 as regards aid for the local production of crop products in
    the outermost regions of the European Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 43/2003 de la Commission du 23 décembre 2002 portant
    modalités d'application des règlements (CE) n° 1452/2001, (CE) n° 1453/2001
    et (CE) n° 1454/2001 du Conseil en ce qui concerne les aides en faveur des productions
    locales de produits végétaux dans les régions ultrapériphériques de l'Union
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 43/2003 der Kommission vom 23. Dezember 2002 mit Durchführungsbestimmungen
    zu den Verordnungen (EG) Nr. 1452/2001, (EG) Nr. 1453/2001 und (EG) Nr. 1454/2001
    des Rates hinsichtlich der Beihilfen für die örtliche Erzeugung pflanzlicher
    Produkte in den Gemeinschaftsregionen in äußerster Randlage
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 43/2003 ze dne 23. prosince 2002, kterým se
    stanoví prováděcí pravidla k nařízením Rady (ES) č. 1452/2001, (ES) č.
    1453/2001 a (ES) č. 1454/2001, pokud jde o podpory místní produkce rostlinných
    produktů v nejvzdálenějších regionech Evropské unie
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 43/2003 af 23. december 2002 om gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 1452/2001, (EF) nr. 1453/2001 og (EF) nr. 1454/2001
    for så vidt angår støtten til den lokale produktion af vegetabilske produkter
    i regionerne i EU's yderste periferi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 43/2003 της Επιτροπής,
    της 23ης Δεκεμβρίου 2002, σχετικά με τη θέσπιση
    των λεπτομερειών εφαρμογής των κανονισμών
    του Συμβουλίου (ΕΚ) αριθ. 1452/2001, (ΕΚ) αριθ. 1453/2001
    και (ΕΚ) αριθ. 1454/2001 όσον αφορά τις ενισχύσεις
    για την τοπική παραγωγή φυτικών προϊόντων
    στις ιδιαίτερα απομακρυσμένες περιφέρειες
    της Ένωσης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 43/2003, 23. detsember 2002, milles sätestatakse
    nõukogu määruste (EÜ) nr 1452/2001, (EÜ) nr 1453/2001 ja (EÜ) nr 1454/2001
    üksikasjalikud rakenduseeskirjad seoses toetusega taimekasvatussaaduste kohalikuks
    tootmiseks Euroopa Liidu äärepoolseimates piirkondades
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 43/2003, annettu 23 päivänä joulukuuta 2002,
    neuvoston asetusten (EY) N:o 1452/2001, (EY) N:o 1453/2001 ja (EY) N:o 1454/2001
    soveltamista koskevista yksityiskohtaisista säännöistä kasvituotteiden paikalliseen
    tuotantoon yhteisön syrjäisimmillä alueilla myönnettävien tukien osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 43/2003/EK rendelete (2002. december 23.) az Európai Unió
    legkülső régióiban a növényi termékek helyi termeléséhez nyújtott támogatás
    tekintetében az 1452/2001/EK, az 1453/2001/EK és az 1454/2001/EK tanácsi rendelet
    alkalmazása részletes szabályainak megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 43/2003 della Commissione, del 23 dicembre 2002, recante
    modalità e applicazione dei regolamenti (CE) n. 1452/2001, (CE) n. 1453/2001
    e (CE) n. 1454/2001 del Consiglio per quanto riguarda gli aiuti a favore delle
    produzioni locali di prodotti vegetali nelle regioni ultraperiferiche dell'Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 43/2003 (2002. gada 23. decembris), ar ko paredz
    sīki izstrādātus noteikumus par to, kā piemērot Padomes Regulas (EK) Nr.
    1452/2001, (EK) Nr. 1453/2001 un (EK) Nr. 1454/2001 attiecībā uz atbalstu augkopības
    produktu vietējai ražošanai Eiropas Savienības attālākajos reģionos
  type: main
- language: lt
  script: Latn
  content: 2002 m. gruodžio 23 d. Komisijos reglamentas (EB) Nr. 43/2003, nustatantis
    išsamias Tarybos reglamentų (EB) Nr. 1452/2001, (EB) Nr. 1453/2001 ir (EB) Nr.
    1454/2001 taikymo taisykles, dėl pagalbos vietinei augalininkystės produktų
    gamybai atokiausiuose Europos Sąjungos regionuose
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 43/2003 tat-23 ta’ Diċembru 2002
    li jistabbilixxi regoli dettaljati għall-applikazzjoni tar-Regolamenti tal-Kunsill
    (KE) Nru 1452/2001, (KE) Nru 1453/2001 u (KE) Nru 1454/2001 f’dak li jirrigwardja
    l-għajnuna għall-produzzjoni lokali ta’ prodotti minn uċuħ tar-raba fir-reġjuni
    l-aktar imbiegħda ta’ l-Unjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 43/2003 van de Commissie van 23 december 2002 tot
    vaststelling van uitvoeringsbepalingen van de Verordeningen (EG) nr. 1452/2001,
    (EG) nr. 1453/2001 en (EG) nr. 1454/2001 van de Raad ten aanzien van de steun
    voor de plaatselĳke productie van plantaardige producten in de ultraperifere
    regio's van de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 43/2003 z dnia 23 grudnia 2002 r. ustanawiające
    szczegółowe zasady stosowania rozporządzeń (WE) nr 1452/2001, (WE) nr 1453/2001
    i (WE) nr 1454/2001 w odniesieniu do pomocy dla lokalnej produkcji roślin uprawnych
    w najbardziej peryferyjnych regionach Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 43/2003 da Comissão, de 23 de Dezembro de 2002,
    que estabelece as normas de execução dos Regulamentos (CE) n.° 1452/2001, (CE)
    n.° 1453/2001 e (CE) n.° 1454/2001 do Conselho no respeitante às ajudas a favor
    das produções locais de produtos vegetais nas regiões ultraperiféricas da
    União
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 43/2003 z 23. decembra 2002, ktorým sa ustanovujú
    podrobné pravidlá pre uplatňovanie nariadení Rady (ES) č. 1452/2001, (ES)
    č. 1453/2001 a (ES) č. 1454/2001, ktoré sa týkajú pomoci pre miestnu produkciu
    rastlinných výrobkov v najodľahlejších regiónoch Európskej únie
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 43/2003 z dne 23. decembra 2002 o podrobnih pravilih
    za uporabo uredb Sveta (ES) št. 1452/2001, (ES) št. 1453/2001 in (ES) št. 1454/2001
    glede pomoči za lokalno proizvodnjo rastlinskih pridelkov v najbolj oddaljenih
    regijah Evropske unije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 43/2003 de la Comisión, de 23 de diciembre de 2002,
    por el que se establecen las disposiciones de aplicación de los Reglamentos (CE)
    nos 1452/2001, 1453/2001 y 1454/2001 del Consejo en lo relativo a las ayudas en
    favor de la producción local de productos vegetales en las regiones ultraperiféricas
    de la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 43/2003 av den 23 december 2002 om tillämpningsföreskrifter
    till rådets förordningar (EG) nr 1452/2001, (EG) nr 1453/2001 och (EG) nr 1454/2001
    beträffande stöd till lokal produktion av vegetabiliska produkter i Europeiska
    unionens yttersta randområden
  type: main
