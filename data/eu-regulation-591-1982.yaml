title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 591/82 of 15 March 1982 re-establishing
    the levying of customs duties on woven pneumatic mattresses, products of category
    110 (code 1100), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 591/82 de la Commission, du 15 mars 1982, portant
    rétablissement de la perception des droits de douane applicables aux matelas
    pneumatiques, tissés, de la catégorie 110 (code 1100), originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 591/82 der Kommission vom 15. März 1982 über die
    Wiedereinführung des Zollsatzes für Luftmatratzen aus Geweben der Warenkategorie
    Nr. 110 (Kennziffer 1100), mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3602/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 591/82 af 15. marts 1982 om genindførelse
    af opkrævning af toldafgifter for luftmadrasser, vævede, under kategori 110
    (kode 1100), som har oprindelse i Kina og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 591/82 τής Επιτροπής τής
    15ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τελωνειακών δασμών γιά στρώματα πληρούμενα
    δι αέρος, υφασμένα, τών προϊόντων τής κατηγορίας
    110 (κώδικας 1100), καταγωγής Κίνας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (EOK) αριθ.
    3602/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 591/82 della Commissione, del 15 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili ai materassi pneumatici, tessuti,
    della categoria di prodotti n. 110 (codice 1100), originari della Cina, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3602/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 591/82 van de Commissie van 15 maart 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    luchtbedden van categorie van produkten 110 (codenummer 1100), van oorsprong uit
    China, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3602/81 van de Raad
  type: main
