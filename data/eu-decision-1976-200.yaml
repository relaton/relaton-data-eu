id: EUDecision1976200
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 January 1976 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's and boys' shirts falling within heading No ex 61.03,
    originating in Taiwan and in free circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 20 janvier 1976, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les chemises pour hommes et garçonnets de la position
    Ex 61.03 du Tarif douanier commun, originaires de Taiwan et mises en libre pratique
    en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Januar 1976, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in der Bundesrepublik Deutschland im freien Verkehr
    befindliche Hemden für Männer und Knaben der Tarifstelle ex 61.03 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. januar 1976 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage skjorter til mænd og drenge, som henhører under pos. ex 61.03 i den
    fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i Forbundsrepublikken
    Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 gennaio 1976, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie per uomo e per ragazzo della voce ex 61.03
    della tariffa doganale comune, originarie di Taiwan e messe in libera pratica
    nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 januari 1976 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd heren- en jongensoverhemden van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taïwan en in de Bondsrepubliek Duitsland in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
