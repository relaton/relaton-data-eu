title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1379/94 of 16 June 1994 derogating from Regulation
    (EC) No 1222/94 as regards the rules for the advance fixing of the export refund
    for glucose used in the manufacture of goods not covered by Annex II to the treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1379/94 de la Commission du 16 juin 1994 portant dérogation
    au règlement (CE) n° 1222/94 en ce qui concerne le régime de fixation à l'avance
    de la restitution à l'exportation pour le glucose mis en oeuvre pour la fabrication
    de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1379/94 DER KOMMISSION vom 16. Juni 1994 zur Abweichung
    von der Verordnung (EG) Nr. 1222/94 hinsichtlich der Regelung zur Vorausfestsetzung
    der Erstattung bei der Ausfuhr von Glucose, die zur Herstellung von nicht unter
    Anhang II des Vertrages fallenden Waren verwendet wird
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1379/94 af 16. juni 1994 om fravigelse
    af forordning (EF) nr. 1222/94 for så vidt angår ordningen for forudfastsættelse
    af eksportrestitutionen for glucose, der anvendes til fremstilling af varer, som
    ikke er opført i traktatens bilag II
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1379/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 16ης Ιουνίου 1994 περί παρεκκλίσεως από τον
    κανονισμό (ΕΚ) αριθ. 1222/94 όσον αφορά το καθεστώς
    προκαθορισμού της επιστροφής κατά την εξαγωγή
    για τη γλυκόζη που χρησιμοποιείται στην παρασκευή
    εμπορευμάτων μη υπαγόμενων στο παράρτημα ΙΙ
    της συνθήκης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1379/94 DELLA COMMISSIONE del 16 giugno 1994 che prevede
    una deroga al regolamento (CE) n. 1222/94 per quanto riguarda il sistema di fissazione
    anticipata della restituzione all' esportazione per il glucosio utilizzato nella
    fabbricazione di merci non comprese nell' allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1379/94 VAN DE COMMISSIE van 16 juni 1994 houdende
    afwijking van Verordening (EG) nr. 1222/94 inzake het stelsel van vaststelling
    vooraf van de restituties bij uitvoer voor glucose die wordt gebruikt voor de
    vervaardiging van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1379/94 DA COMISSÃO de 16 de Junho de 1994 que derroga
    o Regulamento (CE) nº 1222/94 no respeitante ao regime de prefixação da restituição
    à exportação para a glicose utilizada para o fabrico de mercadorias não abrangidas
    pelo anexo II do Tratado
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1379/94 DE LA COMISIÓN de 16 de junio de 1994 por
    el que se deroga el Reglamento (CE) nº 1222/94 en cuanto al régimen de fijación
    anticipada de la restitución a la exportación de glucosa empleada en la fabricación
    de productos que no figuran en el Anexo II del Tratado
  type: main
