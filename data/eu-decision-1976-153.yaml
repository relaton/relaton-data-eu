id: EUDecision1976153
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 January 1976 specifying the extent to which applications
    for import licences lodged in January 1976 for young bovine animals of highland
    breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '76/153/CEE: Décision de la Commission, du 20 janvier 1976, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées au mois de janvier 1976 pour les jeunes bovins de races
    alpines destinées à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Januar 1976 darüber, inwieweit den
    im Januar 1976 gestellten Anträgen auf Einfuhrlizenzen für Mastjungrinder der
    Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. januar 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicenser, som er indgivet i januar 1976 for ungkvæg af
    alpine racer bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 gennaio 1976, che determina in quale
    misura può essere dato seguito alle domande di titoli d'importazione, presentate
    nel mese di gennaio 1976, per giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 januari 1976 tot vaststelling van de
    mate waarin de in januari 1976 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mestrunderen van alpenrassen kunnen worden ingewilligd
  type: main
