title:
- language: en
  script: Latn
  content: '82/927/EEC: Commission Decision of 20 December 1982 establishing that
    the apparatus described as ''Spectraphonics - Speech Spectrographic Display Unit,
    model SSD II'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/927/CEE: Décision de la Commission, du 20 décembre 1982, constatant
    que l''importation de l''appareil dénommé "Spectraphonics - Speech spectrographic
    display unit, model SSD II" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/927/EWG: Entscheidung der Kommission vom 20. Dezember 1982, mit der
    festgestellt wird, daß das Gerät ,,Spectraphonics - Speech Spectrographic Display
    Unit, Model SSD II" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/927/EØF: Kommissionens beslutning af 20. december 1982 om fastslåelse
    af, at indførsel af apparatet "Spectraphonics - Speech Spectrographic Display
    Unit, Model SSD II" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/927/EOK: Απόφαση τής Επιτροπής τής 20ής Δεκεμβρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Spectraphonics — Speech Spectrographic Display
    Unit, Model SSD II» δύναται νά πραγματοποιηθεί ατελώς,
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/927/CEE: Decisione della Commissione, del 20 dicembre 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Spectraphonics - Speech Spectrographic
    Display Unit, model SSD II" può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/927/EEG: Beschikking van de Commissie van 20 december 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Spectraphonics - Speech Spectrographic
    Display Unit, model SSD II" met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
