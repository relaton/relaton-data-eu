  script: Latn
  content: Commission Regulation (EC) No 260/2008 of 18 March 2008 amending Regulation
    (EC) No 396/2005 of the European Parliament and of the Council by establishing
    Annex VII listing active substance/product combinations covered by a derogation
    as regards post harvest treatments with a fumigant
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 260/2008 de la Commission du 18 mars 2008 modifiant
    le règlement (CE) n° 396/2005 du Parlement européen et du Conseil par l’établissement
    d’une annexe VII répertoriant les combinaisons substance active/produit couvertes
    par une dérogation applicable aux traitements par fumigation postérieurs à
    la récolte
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 260/2008 der Kommission vom 18. März 2008 zur Änderung
    der Verordnung (EG) Nr. 396/2005 des Europäischen Parlaments und des Rates durch
    die Festlegung des Anhangs VII, der eine Liste der Wirkstoff-Erzeugnis-Kombinationen
    enthält, für die eine Ausnahmeregelung hinsichtlich Behandlungen mit einem Begasungsmittel
    nach der Ernte gilt
  type: main
- language: bg
  script: Cyrl
