  content: Commission Regulation (EU) 2024/1719 of 20 June 2024 correcting the Spanish
    language version of Regulation (EU) No 142/2011 implementing Regulation (EC) No
    1069/2009 of the European Parliament and of the Council laying down health rules
    as regards animal by-products and derived products not intended for human consumption
    and implementing Council Directive 97/78/EC as regards certain samples and items
    exempt from veterinary checks at the border under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2024/1719 de la Commission du 20 juin 2024 rectifiant la
