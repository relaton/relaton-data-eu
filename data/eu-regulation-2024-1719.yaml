  script: Latn
  content: Kommissionens förordning (EU) 2024/1719 av den 20 juni 2024 om rättelse
    av den spanska språkversionen av förordning (EU) nr 142/2011 om genomförande
    av Europaparlamentets och rådets förordning (EG) nr 1069/2009 om hälsobestämmelser
    för animaliska biprodukter och därav framställda produkter som inte är avsedda
