    corrige la versión española del Reglamento (UE) n.o 142/2011, por el que se
    establecen las disposiciones de aplicación del Reglamento (CE) n.o 1069/2009
    del Parlamento Europeo y del Consejo, por el que se establecen las normas sanitarias
