  content: Council Regulation (EEC) No 2896/77 of 20 December 1977 extending to other
    products the Annex to Regulation (EEC) No 109/70 establishing common rules for
    imports from State-trading countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2896/77 du Conseil, du 20 décembre 1977, étendant
    à d' autres produits l' annexe du règlement (CEE) n° 109/70 portant établissement
    d' un régime commun applicable aux importations de pays à commerce d' État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2896/77 des Rates vom 20. Dezember 1977 zur Ausdehnung
    des Anhangs der Verordnung (EWG) Nr. 109/70 zur Festlegung einer gemeinsamen Regelung
    für die Einfuhr aus Staatshandelsländern auf weitere Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2896/77 af 20. december 1977 om udvidelse
