title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1253/75 of the Commission of 14 May 1975 re-establishing
    the levying of the customs duties on heavy petroleum oils, falling within subheadings
    27.10 C I c), II c), III c) and d), originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1253/75 de la Commission, du 14 mai 1975, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole lourdes, des sous-positions tarifaires 27.10 C I c), II c), III c) et
    d), originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1253/75 der Kommission vom 14. Mai 1975 zur Wiedereinführung
    des Zollsatzes für Schweröle der Tarifstellen 27.10 C I c), II c), III c) und
    d), mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3054/74 des
    Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1253/75 af 14. maj 1975 om genindførelse
    af opkrævning af toldafgifter for olier, tunge olier, under underposition 27.10
    C I c), II c), III c) og d), som har oprindelse i Rumænien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2.
    december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1253/75 della Commissione, del 14 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio pesanti
    delle sottovoci doganali 27.10 C I c), II c), III c) e d) originari della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1253/75 van de Commissie van 14 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op aardoliën
    en zware oliën van onderverdelingen 27.10 C I c), II c), III c) en d), van oorsprong
    uit Roemenë, ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad
    van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
