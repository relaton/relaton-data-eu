title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 30/90 of 5 January 1990 fixing for Great
    Britain the level of the variable slaughter premium for sheep and the amounts
    to be charged on products leaving region 5
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 30/90 de la Commission, du 5 janvier 1990, fixant,
