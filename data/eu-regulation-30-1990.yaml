    Μεγάλη Βρετανία, του ποσού της μεταβλητής πριμοδοτήσεως
    κατά τη σφαγή των προβατοειδών και των ποσών
    προς είσπραξη για τα προϊόντα που εξάγονται
    από την περιοχή 5
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 30/90 della Commissione, del 5 gennaio 1990, che fissa
