title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 253/97 of 12 February 1997 laying down to
    what extent applications for issue of export licences submitted during February
    1997 for beef and veal products which may benefit from special import treatment
    in Canada may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 253/97 DE LA COMMISSION du 12 février 1997 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de février 1997 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation au
    Canada
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 253/97 DER KOMMISSION vom 12. Februar 1997 über das
    Ausmaß, in dem den im Februar 1997 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr nach Kanada eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 253/97 af 12. februar 1997 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i februar
    1997 for oksekødsprodukter, der nyder særbehandling ved indførsel til Canada,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 253/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 12ης Φεβρουαρίου 1997 για καθορισμό σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν το Φεβρουάριο 1997 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή στον Καναδά
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 253/97, annettu 12 päivänä helmikuuta 1997,
    Kanadassa erityistuontikohtelun saavien naudanliha-alan tuotteiden helmikuussa
    1997 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 253/97 DELLA COMMISSIONE del 12 febbraio 1997 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di febbraio 1997 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in Canada
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 253/97 VAN DE COMMISSIE van 12 februari 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in februari 1997 ingediende
    aanvragen om uitvoercertificaten voor producten van de sector rundvlees waarvoor
    een bijzondere behandeling geldt bij invoer in Canada
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 253/97 DA COMISSÃO de 12 de Fevereiro de 1997 que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Fevereiro de 1997 em relação a produtos
    do sector da carne de bovino que beneficiam de um tratamento especial na importação
    no Canadá
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 253/97 DE LA COMISIÓN de 12 de febrero de 1997 por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentados en el mes de febrero de 1997, para los productos
    del sector de la carne de bovino que se beneficien de un trato especial para su
    importación en Canadá
  type: main
- language: sv
  script: Latn
