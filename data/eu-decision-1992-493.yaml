  content: '92/493/EEC: Commission Decision of 12 October 1992 accepting undertakings
    offered in connection with the review of anti-dumping measures applicable to certain
    imports of monosodium glutamate originating in Indonesia and terminating the investigation'
  type: main
- language: fr
  script: Latn
  content: '92/493/CEE: Décision de la Commission, du 12 octobre 1992, portant acceptation
    d'' engagements offerts dans le cadre de la procédure de réexamen des mesures
    antidumping applicables à certaines importations de glutamate monosodique, originaire
    d'' Indonésie, et portant clôture de l'' enquête'
  type: main
- language: de
  script: Latn
  content: '92/493/EWG: Beschluß der Kommission vom 12. Oktober 1992 über die Annahme
    von Preisverpflichtungen im Rahmen der Überprüfung der Antidumpingmaßnahmen
    betreffend bestimmte Einfuhren von Mononatriumglutamat mit Ursprung in Indonesien
    und über die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '92/493/EØF: Kommissionens afgørelse af 12. oktober 1992 om godtagelse
