title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 699/68 de la Commission, du 6 juin 1968, complétant,
    en ce qui concerne l'Autriche, le règlement n 887/67/CEE établissant la liste
    des organismes émetteurs de certificats destinés à permettre l'admission de
    certains produits laitiers dans certaines positions tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 699/68 der Kommission vom 6. Juni 1968 zur Ergänzung,
    hinsichtlich Österreichs, der Verordnung Nr. 887/67/EWG zur Aufstellung einer
    Liste derjenigen Stellen, die Bescheinigungen ausstellen dürfen, durch die bestimmte
    Milcherzeugnisse mit Herkunft aus dritten Ländern zu bestimmten Tarifnummern
    zugelassen werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 699/68 della Commissione, del 6 giugno 1968, che completa,
    per quanto riguarda l'Austria, il regolamento n. 887/67/CEE che stabilisce l'elenco
    degli organismi emittenti dei certificati destinati a permettere l'ammissione
    in alcune voci tariffarie di alcuni prodotti lattiero-caseari in provenienza dai
    paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 699/68 van de Commissie van 6 juni 1968 ter aanvulling,
    voor wat betreft Oostenrijk, van Verordening nr. 887/67/EEG houdende vaststelling
    van de lijst van instellingen belast met de afgifte van certificaten welke bestemd
    zijn om bepaalde zuivelprodukten uit derde landen in te delen in bepaalde tariefposten
  type: main
