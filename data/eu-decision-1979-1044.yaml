  script: Latn
  content: '79/1044/EEC: Commission Decision of 23 November 1979 on the granting by
    the Guidance Section of the EAGGF to the Federal Republic of Germany of a payment
    on account in respect of expenditure incurred during 1978 on aids for the less-favoured
    farming areas(Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/1044/CEE: Décision de la Commission, du 23 novembre 1979, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République fédérale d''Allemagne, d''un acompte
    sur les dépenses effectuées pendant l''année 1978 pour les aides en faveur
    des zones agricoles défavorisées (Le texte en langue allemande est le seul faisant
    foi.)'
  type: main
