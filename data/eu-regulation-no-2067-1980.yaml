title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2067/80 of 1 August 1980 re-establishing
    the levying of customs duties on shawls, scarves, {{{, other than knitted or crocheted,
    of wool, of cotton or of man-made textile fibres, products of category 84 (code
    0840), originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2067/80 de la Commission, du 1er août 1980, portant
    rétablissement de la perception des droits de douane applicables aux châles,
    écharpes, etc., autres qu' en bonneterie, de coton, de laine, de fibres textiles
    synthétiques ou artificielles, de la catégorie 84 (code 0840), originaires du
    Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2067/80 der Kommission vom 1. August 1980 über die
    Wiedereinführung des Zollsatzes für Schals, Umschlagtücher, Halstücher{{{,
    andere als Wirkwaren, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen, der Warenkategorie Nr. 84 (Kennziffer 0840), mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2067/80 af 1. august 1980 om genindførelse
    af opkrævning af toldafgifter for sjaler, tørklæder,{{{bortset fra varer af
    trikotage, af uld, bomuld, eller kemofibre, under kategori 84 (kode 0840), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2067/80 della Commissione, del 1° agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli scialli, sciarpe,
    ecc., esclusi quelli a maglia, di cotone, di lana, di fibre tessili sintetiche
    o artificiali, della categoria di prodotti n. 84 (codice 0840), originari del
    Pakistan, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2067/80 van de Commissie van 1 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sjaals,
    sjerpen, {{{, andere dan van brei- of haakwerk, van wol, van katoen, van synthetische
    of van kunstmatige textielvezels, van de categorie van produkten nr. 84 (codenummer
    0840) van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
