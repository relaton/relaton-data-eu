title:
- language: en
  script: Latn
  content: Council Directive 77/796/EEC of 12 December 1977 aiming at the mutual recognition
    of diplomas, certificates and other evidence of formal qualifications for goods
    haulage operators and road passenger transport operators, including measures intended
    to encourage these operators effectively to exercise their right to freedom of
    establishment
  type: main
- language: fr
  script: Latn
  content: Directive 77/796/CEE du Conseil, du 12 décembre 1977, visant à la reconnaissance
    mutuelle des diplômes, certificats et autres titres de transporteur de marchandises
    et de transporteur de personnes par route et comportant des mesures destinées
    à favoriser l'exercice effectif de la liberté d'établissement de ces transporteurs
  type: main
- language: de
  script: Latn
  content: Richtlinie 77/796/EWG des Rates vom 12. Dezember 1977 über die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    für die Beförderung von Gütern und die Beförderung von Personen im Straßenverkehr
    und über Maßnahmen zur Förderung der tatsächlichen Inanspruchnahme der Niederlassungsfreiheit
    der betreffenden Verkehrsunternehmer
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 77/796/EØF af 12. december 1977 om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser i forbindelse
    med udøvelse af transportvirksomhed inden for personbefordring og transportvirksomhed
    inden for godstransport ad landevej omfattende foranstaltninger, som skal lette
    den faktiske udøvelse af etableringsfrihed for de pågældende udøvere af transportvirksomhed
  type: main
- language: el
  script: Grek
  content: Οδηγία 77/796/EOK του Συμβουλίου της 12ης Δεκεμβρίου
    1977 περί της αμοιβαίας αναγνωρίσεως των διπλωμάτων
    πιστοποιητικών και άλλων τίτλων των οδικών
    μεταφορέων εμπορευμάτων και μεταφορέων επιβατών
    και περί των μέτρων προς διευκόλυνση της πραγματικής
    ασκήσεως του δικαιώματος εγκαταστάσεως των
    μεταφορέων αυτών
  type: main
- language: it
  script: Latn
  content: Direttiva 77/796/CEE del Consiglio, del 12 dicembre 1977, per il riconoscimento
    reciproco di diplomi, certificati e altri titoli di trasportatore di merci e di
    trasportatore di persone su strada, che comporta misure destinate a favorire l'esercizio
    effettivo della libertà di stabilimento di detti trasportatori
  type: main
- language: nl
  script: Latn
  content: Richtlijn 77/796/EEG van de Raad van 12 december 1977 inzake de onderlinge
    erkenning van diploma' s, certificaten en andere titels van ondernemer van goederenvervoer
    over de weg en ondernemer van personenvervoer over de weg en houdende maatregelen
    ter bevordering van de daadwerkelijke uitoefening van het recht van vrije vestiging
    van die vervoerondernemers
  type: main
- language: pt
  script: Latn
  content: Directiva 77/796/CEE do Conselho, de 12 de Dezembro de 1977, que tem por
    objectivo o reconhecimento mútuo dos diplomas, certificados e outros títulos
    de transportador rodoviário de mercadorias e de transportador rodoviário de
    passageiros e que inclui medidas destinadas a facilitar o exercício da liberdade
    de estabelecimento desses transportadores
  type: main
- language: es
  script: Latn
  content: Directiva 77/796/CEE del Consejo, de 12 de diciembre de 1977, relativa
    al reconocimiento recíproco de los diplomas, certificados y otros títulos de
    transportista de mercancías y de transportista de viajeros por carretera y en
    la que se incluyen medidas destinadas a favorecer el ejercicio efectivo de la
    libertad de establecimiento de estos transportistas
  type: main
