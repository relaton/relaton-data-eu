id: EUDecision1976667
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 14 June 1976 authorizing the Italian Republic not
    to apply Community treatment to used units of computers, falling within heading
    No ex 84.53 of the Common Customs Tariff, originating in the United States and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/667/CEE: Décision de la Commission, du 14 juin 1976, autorisant la
    République italienne à exclure du traitement communautaire les unités usagées
    pour ordinateurs, de la position Ex 84.53 du Tarif douanier commun originaires
    des États-Unis et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. Juni 1976, mit der die Italienische
    Republik ermächtigt wird, aus den Vereinigten Staaten stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Einheiten für Datenverarbeitungsmaschinen,
    gebraucht, der Tarifnummer ex 84.53 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 14. juni 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage brugte enheder til databehandlingsmaskiner,
    som henhører under pos. ex 84.53 i den fælles toldtarif, har oprindelse i De
    forenede Stater og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 14 giugno 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le unità usate per elaboratori
    elettronici, della voce ex 84.53 della tariffa doganale comune, originarie degli
    Stati Uniti e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 juni 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd gebruikte eenheden voor computers, van post ex 84.53 van het
    gemeenschappelijk douanetarief, van oorsprong uit de Verenigde Staten en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
