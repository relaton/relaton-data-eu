id: EURegulation2016148
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/148 of 4 February 2016 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza of the subtype H7N8
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/148 de la Commission du 4 février 2016
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives aux États-Unis d'Amérique sur la liste des pays tiers, territoires,
    zones ou compartiments en provenance desquels certains produits de volailles peuvent
    être importés dans l'Union ou transiter par celle-ci, en raison de la présence
    d'influenza aviaire hautement pathogène du sous-type H7N8 dans ce pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/148 der Kommission vom 4. Februar 2016
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags zu den Vereinigten Staaten von Amerika in der Liste von Drittländern,
    Gebieten, Zonen und Kompartimenten, aus denen bestimmte Geflügelwaren in die
    Union eingeführt bzw. durch die Union durchgeführt werden dürfen, im Zusammenhang
    mit der hochpathogenen Aviären Influenza des Subtyps H7N8 in diesem Land
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/148 на Комисията
    от 4 февруари 2016 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Съединените американски щати в списъка
    на трети държави, територии, зони или компартменти,
    от които са разрешени вносът и транзитът през
    Съюза на определени стоки от домашни птици,
    във връзка с появата на огнища от високопатогенна
    инфлуенца по птиците от подтип H7N8
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/148 ze dne 4. února 2016, kterým
    se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku týkající
    se Spojených států amerických na seznamu třetích zemí, území, oblastí
    nebo jednotek, z nichž lze do Unie dovážet nebo přes její území přepravovat
    určité drůbeží komodity, v souvislosti s vysoce patogenní influenzou ptáků
    podtypu H7N8
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/148 af 4. februar 2016
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om USA i listen over tredjelande, områder, zoner og segmenter, hvorfra import
    til eller transit gennem Unionen af visse fjerkræprodukter er tilladt i forbindelse
    med højpatogen aviær influenza af subtype H7N8
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/148 της Επιτροπής,
    της 4ης Φεβρουαρίου 2016, για την τροποποίηση
    του παραρτήματος I του κανονισμού (ΕΚ) αριθ.
    798/2008 όσον αφορά την καταχώριση των Ηνωμένων
    Πολιτειών της Αμερικής στον κατάλογο τρίτων
    χωρών, εδαφών, ζωνών ή διαμερισμάτων από τα
    οποία επιτρέπεται να εισαχθούν στην Ένωση
    και να διαμετακομιστούν μέσω της Ένωσης ορισμένα
    προϊόντα πουλερικών σε σχέση με την υψηλής
    παθογονικότητας γρίπη των πτηνών του υποτύπου
    H7N8
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/148, 4. veebruar 2016, millega muudetakse
    kõrge patogeensusega linnugripi alatüübi H7N8 esinemise tõttu määruse (EÜ)
    nr 798/2008 I lisas Ameerika Ühendriike käsitlevat kannet loetelus, milles on
    esitatud need kolmandad riigid, territooriumid, tsoonid ja piirkonnad, millest
    võib importida liitu või vedada läbi liidu teatavaid linnukasvatussaadusi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/148, annettu 4 päivänä
    helmikuuta 2016, asetuksen (EY) N:o 798/2008 liitteen I muuttamisesta Amerikan
    yhdysvaltoja koskevan kohdan osalta niiden kolmansien maiden, alueiden, vyöhykkeiden
    tai erillisalueiden luettelossa, joista tiettyjen siipikarjasta saatujen hyödykkeiden
    tuonti unioniin tai kuljettaminen sen kautta on sallittua kyseisessä maassa ilmenneen
    korkeapatogeenisen lintuinfluenssan H7N8-alatyypin esiintymisen yhteydessä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/148 оd 4. veljače 2016. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Sjedinjene Američke Države
    na popisu trećih zemalja, državnih područja, zona ili kompartmenta iz kojih
    je dopušten uvoz u Uniju i provoz kroz nju određenih proizvoda od peradi u vezi
    s visokopatogenom influencom ptica podtipa H7N8
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/148 végrehajtási rendelete (2016. február 4.)
    a 798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    az Amerikai Egyesült Államokra vonatkozó bejegyzésnek a H7N8 altípusba tartozó,
    magas patogenitású vírustörzsek okozta madárinfluenza kitöréseivel kapcsolatban
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/148 della Commissione, del 4 febbraio
    2016, che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa agli Stati Uniti d'America nell'elenco di paesi terzi, loro territori,
    zone o compartimenti da cui sono consentiti le importazioni e il transito nell'Unione
    di determinati prodotti a base di pollame, in relazione all'influenza aviaria
    ad alta patogenicità del sottotipo H7N8
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/148 (2016. gada 4. februāris),
    ar ko Regulas (EK) Nr. 798/2008 I pielikumā groza ierakstu par Amerikas Savienotajām
    Valstīm to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā, no kuriem
    attiecībā uz augsti patogēno H7N8 apakštipa putnu gripu atļauts Savienībā
    importēt vai tranzītā caur to pārvadāt konkrētas mājputnu izcelsmes preces
  type: main
- language: lt
  script: Latn
  content: 2016 m. vasario 4 d. Komisijos įgyvendinimo reglamentas (ES) 2016/148,
    kuriuo dėl H7N8 potipio labai patogeniško paukščių gripo ir su juo susijusio
    Jungtinių Amerikos Valstijų įrašo trečiųjų šalių, teritorijų, zonų
    ar skyrių, iš kurių galima importuoti į Sąjungą ir vežti tranzitu per Sąjungą
    tam tikras naminių paukščių prekes, sąraše iš dalies keičiamas Reglamento
    (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/148 tal-4 ta'
    Frar 2016 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 dwar l-entrata
    għall-Istati Uniti tal-Amerika fil-lista ta' pajjiżi terzi, territorji, żoni
    jew kumpartimenti li minnhom jistgħu jiġu importati ċerti prodotti tat-tjur
    lejn l-Unjoni jew isir tranżitu minnha fir-rigward tal-influwenza tat-tjur b'patoġeniċità
    għolja tas-sottotip H7N8
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/148 van de Commissie van 4 februari 2016
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de gegevens
    voor de Verenigde Staten van Amerika op de lijst van derde landen, gebieden, zones
    of compartimenten waaruit bepaalde pluimveeproducten mogen worden ingevoerd in
    en doorgevoerd door de Unie in verband met hoogpathogene aviaire influenza van
    het subtype H7N8
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/148 z dnia 4 lutego 2016 r.
    zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w zakresie wpisu
    dotyczącego Stanów Zjednoczonych Ameryki w wykazie państw trzecich, terytoriów,
    stref lub grup, z których dopuszczalny jest przywóz do Unii i tranzyt przez
    jej terytorium niektórych produktów drobiowych, w odniesieniu do wysoce zjadliwej
    grypy ptaków podtypu H7N8
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/148 da Comissão, de 4 de fevereiro
    de 2016, que altera o anexo I do Regulamento (CE) n.° 798/2008 no que se refere
    à entrada relativa aos Estados Unidos da América na lista de países terceiros,
    territórios, zonas ou compartimentos a partir dos quais são autorizados a importação
    e o trânsito na União de determinados produtos à base de aves de capoeira,
    relativamente à gripe aviária de alta patogenicidade do subtipo H7N8
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/148 al Comisiei din 4 februarie
    2016 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Statele Unite ale Americii din lista cu țări terțe,
    teritorii, zone sau compartimente din care anumite produse obținute de la păsări
    de curte pot fi importate în Uniune sau pot tranzita Uniunea în contextul apariției
    unor focare de gripă aviară înalt patogenă de subtip H7N8
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/148 zo 4. februára 2016, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Spojených štátov amerických v zozname tretích krajín, území, oblastí
    alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti s ohniskami vysokopatogénnej vtáčej
    chrípky podtypu H7N8
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/148 z dne 4. februarja 2016 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Združene države Amerike
    na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih je
    dovoljen uvoz nekaterega perutninskega blaga v Unijo ali njegov tranzit skozi
    Unijo v zvezi z visokopatogeno aviarno influenco podtipa H7N8
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/148 de la Comisión, de 4 de febrero
    de 2016, por el que se modifica el anexo I del Reglamento (CE) n.° 798/2008 con
    respecto a la entrada relativa a los Estados Unidos de la lista de terceros países,
    territorios, zonas o compartimentos desde los cuales están permitidos la importación
    en la Unión o el tránsito por ella de determinadas mercancías de aves de corral,
    en relación con la influenza aviar de alta patogenicidad del subtipo H7N8
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/148 av den 4 februari
    2016 om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Förenta staterna i förteckningen över tredjeländer, områden, zoner eller
    delområden från vilka vissa varor av fjäderfä får importeras till eller transiteras
    genom unionen i samband med högpatogen aviär influensa av subtyp H7N8
