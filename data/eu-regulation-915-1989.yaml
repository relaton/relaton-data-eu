    dans le secteur des céréales en faveur des producteurs ayant participé au régime
    de retrait des terres arables
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 915/89 DER KOMMISSION vom 10. April 1989 mit Durchfuehrungsbestimmungen
