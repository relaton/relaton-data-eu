    καθεστώτος απαλλαγής από εισφορές συνυπευθυνότητας
    στον τομέα των σιτηρών υπέρ των παραγωγών που
    έχουν συμμετάσχει στο καθεστώς της προσωρινής
    παύσης καλλιέργειας αροσίμων γαιών
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 915/89 DELLA COMMISSIONE del 10 aprile 1989 recante
