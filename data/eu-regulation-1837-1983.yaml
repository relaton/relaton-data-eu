title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1837/83 of 5 July 1983 re-establishing the
    levying of customs duties applicable to diethylene glycol, falling within subheading
    29.08 B ex I and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1837/83 de la Commission du 5 juillet 1983 portant
    rétablissement de la perception des droits de douane applicables au 2,2' -Oxydiéthanol
    (diéthylèneglycol) de la sous-position 29.08 B ex I du tarif douanier commun,
    originaire du Brésil, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
