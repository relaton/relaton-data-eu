    der Erhebung der Zölle für Diäthylenglykol der Tarifstelle 29.08 B ex I, mit
    Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1837/83 af 5. juli 1983 om genindførelse
