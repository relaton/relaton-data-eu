id: EUDecision19801012
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/1012/EEC: Commission Decision of 19 September 1980 authorizing the
    Kingdom of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands
    not to apply Community treatment to men''s and boys''under garments : shirts,
    woven, of wool, of cotton or of man- made textile fibres, falling within subheading
    61.03 A of the Common Customs Tariff (category 8), originating in Bulgaria and
    in free circulation in the other Member States (Only the Dutch and French texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1012/CEE: Décision de la Commission, du 19 septembre 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vêtements de dessous pour hommes et
    garçonnets, les chemises et chemisettes tissées, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles, de la sous-position 61.03 A du tarif
    douanier commun (catégorie 8), originaires de Bulgarie et mis en libre pratique
    dans les autres États membres (Les textes en langues néerlandaise et française
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1012/EWG: Entscheidung der Kommission vom 19. September 1980, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Bulgarien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterkleidung für Männer und Knaben, Oberhemden,
    auch Sport- und Arbeitshemden, aus Geweben, aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen der Tarifstelle 61.03 A des Gemeinsamen Zolltarifs
    (Kategorie 8) von der Gemeinschaftsbehandlung auszuschließen (Nur der niederländische
    und französische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1012/EØF: Kommissionens beslutning af 19. september 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage underbeklædningsgenstande til mænd
    og drenge ; vævede skjorter (herunder sports- og arbejdsskjorter, af uld, bomuld
    eller syntetiske eller regenererede fibre, som henhører under pos. 61.03 A i
    den fælles toldtarif (kategori 8), har oprindelse i Bulgarien og frit kan omsættes
    i de øvrige medlemsstater (Kun den nederlandske og franske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/1012/CEE: Decisione della Commissione, del 19 settembre 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le sottovesti per uomo e per ragazzo,
    le camicie e le camicette, tessute, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della sottovoce 61.03 A della tariffa doganale comune, categoria
    8, originarie della Bulgaria e messe in libera pratica negli altri Stati membri
    (Il testi in lingua olandese e francese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1012/EEG: Beschikking van de Commissie van 19 september 1980 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd heren- en jongensonderkleding, overhemden en sporthemden, geweven,
    van wol, van katoen of van synthetische of van kunstmatige textielvezels, van
    post 61.03 A van het gemeenschappelijk douanetarief (categorie 8), van oorsprong
    uit Bulgarije en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten (Slechts de teksten in de Nederlandse
    en de Franse taal zijn authentiek)'
  type: main
