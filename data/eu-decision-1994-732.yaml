id: EUDecision1994732
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '94/732/EC: Commission Decision of 11 November 1994 amending Decision 93/402/EEC
    on the health conditions and veterinary certification required for the importation
    of fresh meat from certain countries of South America in order to take account
    of the provinces of Chaco and Formosa (Argentina) and the State of Santa Catarina
    (Brazil)'
  type: main
- language: fr
  script: Latn
  content: '94/732/CE: Décision de la Commission du 11 novembre 1994 modifiant la
    décision 93/402/CEE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays de l''Amérique du Sud, en vue de tenir compte des provinces du
    Chaco et de Formosa (Argentine) et de l''État de Santa Catarina (Brésil)'
  type: main
- language: de
  script: Latn
  content: '94/732/EG: ENTSCHEIDUNG DER KOMMISSION vom 11. November 1994 zur Änderung
    der Entscheidung 93/402/EWG über die Veterinärbedingungen und Veterinärzeugnisse
    für die Einfuhr von frischem Fleisch aus bestimmten Ländern Südamerikas im
    Hinblick auf die argentinischen Provinzen Chaco und Formosa sowie den brasilianischen
    Bundesstaat Santa Catarina'
  type: main
- language: da
  script: Latn
  content: '94/732/EF: KOMMISSIONENS BESLUTNING af 11. november 1994 om ændring af
    beslutning 93/402/EØF om dyresundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved indførsel af fersk kød fra bestemte lande i Sydamerika for at tage hensyn
    til provinserne Chaco og Formosa (Argentina) samt til Santa Catarina (Brasilien)'
  type: main
- language: el
  script: Grek
  content: '94/732/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 11ης Νοεμβρίου
    1994 για τροποποίηση της αποφάσεως 93/402/ΕΟΚ σχετικά
    με τους υγειονομικούς όρους και τα υγειονομικά
    πιστοποιητικά που απαιτούνται για την εισαγωγή
    νωπών κρεάτων από ορισμένες χώρες της Νότιας
    Αμερικής προκειμένου να ληφθούν υπόψη ορισμένα
    θέματα που αφορούν τις επαρχίες Chao και Formosa
    (Αργεντινή) και την Πολιτεία Santa Catarina (Βραζιλία)'
  type: main
- language: fi
  script: Latn
  content: '94/732/EY: Komission päätös, tehty 11 päivänä marraskuuta 1994,
    eläinten terveyttä koskevista vaatimuksista ja eläinlääkärintodistuksista
    tuoreen lihan tuonnissa tietyistä Etelä-Amerikan maista tehdyn päätöksen
    93/402/ETY muuttamisesta Chacon ja Formosan maakuntien (Argentiina) ja Santa Catarinan
    osavaltion (Brasilia) huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '94/732/CE: DECISIONE DELLA COMMISSIONE dell'' 11 novembre 1994 che modifica
    la decisione 93/402/CEE relativa alle condizioni di polizia sanitaria ed alla
    certificazione veterinaria cui è subordinata l'' importazione di carni fresche
    provenienti da taluni paesi dell'' America del Sud, in modo da tener conto delle
    province Chaco e Formosa (Argentina) e dello Stato di Santa Catarina (Brasile)'
  type: main
- language: nl
  script: Latn
  content: '94/732/EG: BESCHIKKING VAN DE COMMISSIE van 11 november 1994 tot wijziging
    van Beschikking 93/402/EEG betreffende veterinairrechtelijke voorschriften en
    veterinaire certificering voor de invoer van vers vlees uit landen van Zuid-Amerika,
    ten einde rekening te houden met de provincies Chaco en Formosa (Argentinië)
    en de staat Santa Catarina (Brazilië)'
  type: main
- language: pt
  script: Latn
  content: '94/732/CE: DECISÃO DA COMISSÃO de 11 de Novembro de 1994 que altera
    a Decisão 93/402/CEE, relativa às condições sanitárias e à certificação
    veterinária exigidas para a importação de carne fresca proveniente de países
    da América do Sul, a fim de ter em conta as províncias de Chaco e Formosa (Argentina)
    e o Estado de Santa Catarina (Brasil)'
  type: main
- language: es
  script: Latn
  content: '94/732/CE: DECISIÓN DE LA COMISIÓN de 11 de noviembre de 1994 por la
    que se modifica la Decisión 93/402/CEE relativa a las condiciones de policía
    sanitaria y a la certificación veterinaria requeridas para la importación de
    carnes frescas procedentes de países de América del Sur para incluir las provincias
    del Chaco y Formosa (Argentina) y el Estado de Santa Catarina (Brasil)'
  type: main
- language: sv
  script: Latn
  content: '94/732/EG: Kommissionens beslut av den 11 november 1994 om ändring av
    beslut 93/402/EEG om djurhälsovillkor och utfärdande av veterinärintyg för
    import av färskt kött från vissa länder i Sydamerika för att ta hänsyn till
    förhållanden vad avser provinserna Chaco och Formosa (Argentina) och delstaten
    Santa Catarina (Brasilien)'
  type: main
