title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1895/78 of 2 August 1978 re-establishing
    the levying of customs duties on gloves, mittens, mitts, stockings, socks and
    sockettes, not being knitted or crocheted goods, falling within heading No 61.10
    and originating in Pakistan, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1895/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables à la ganterie,
    bas, chaussettes et socquettes, autres qu'en bonneterie, de la position 61.10
    du tarif douanier commun, originaires du Pakistan, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1895/78 der Kommission vom 2. August 1978 über die
    Wiedereinführung des Zollsatzes für Handschuhe, Strümpfe, Socken und Söckchen,
    nicht gewirkt, der Tarifnummer 61.10 mit Ursprung in Pakistan, dem die in der
    Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1895/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter, luffer, strømper og sokker,
    ikke af trikotage, under position 61.10, som har oprindelse i Pakistan, og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1895/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, calze e calzini,
    esclusi quelli a maglia, della voce doganale 61.10, originari del Pakistan beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1895/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke, kousen en sokken, andere dan die van brei- of haakwerk,
    van post 61.10, van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 1197/78 van de Raad
  type: main
