id: EUDecision1974176
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 December 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the Federal Republic
    of Germany for expenditure on vocational retraining operations carried out by
    the 'Bundesanstalt für Arbeit (BA)' and the social insurance organizations for
    workers
  type: main
- language: fr
  script: Latn
  content: Décision 74/176/CEE de la Commission, du 21 décembre 1973, portant octroi
    du concours du Fonds social européen, prévu à l'article 125 du Traité, au
    bénéfice de la République fédérale d'Allemagne pour des dépenses relatives
    à des opérations de rééducation professionnelle effectuées par la "Bundesanstalt
    für Arbeit (BA)" et les organismes d'assurances sociales des travailleurs
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973 zur Gewährung des in
    Artikel 125 EWG-Vertrag vorgesehenen Zuschusses aus dem Europäischen Sozialfonds
    an die Bundesrepublik Deutschland zu Aufwendungen für von der Bundesanstalt für
    Arbeit (BA) und den Arbeiterrentenversicherungsträgern durchgeführte Berufsumschulungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om ydelse af det i artikel
    125 i traktaten fastsatte tilskud fra Den europæiske Socialfond til forbundsrepublikken
    Tyskland i forbindelse med udgifter vedrørende faglig omskoling, som er gennemført
    af "Bundesanstalt für Arbeit (BA)" og af bidragyderne til arbejdspensionsforsikringen
  type: main
- language: it
  script: Latn
  content: '74/176/CEE: Decisione della Commissione, del 21 dicembre 1973, recante
    concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore della Repubblica federale di Germania per spese concernenti
    operazioni di riqualificazione effettuate dalla «Bundesanstalt für Arbeit (BA)»
    e dagli enti di assicurazioni sociali dei lavoratori'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van de Bondsrepubliek Duitsland voor door het "Bundesanstalt
    für Arbeit (BA)" en de sociale verzekeringsinstellingen voor werknemers gemaakte
    herscholingskosten
  type: main
