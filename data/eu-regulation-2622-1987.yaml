title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2622/87 of 31 August 1987 re-establishing
    the levying of customs duties on footwear with outer soles of other materials,
    falling within heading 64.04, originating in South Korea to which the tariff preferences
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2622/87 de la Commission du 31 août 1987 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    à semelles extérieures en autres matières de la position 64.04 du tarif douanier
    commun, originaires de la Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2622/87 der Kommission vom 31. August 1987 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen aus anderen Stoffen der Tarifnummer
    64.04 des Gemeinsamen Zolltarifs mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2622/87 af 31. august 1987 om genindførelse
    af opkrævning af told for fodtøj med ydersål af andre materialer, henhørende
    under pos. 64.04 i den fælles toldtarif og med oprindelse i Sydkorea, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2622/87 της Επιτροπής
    της 31ης Αυγούστου 1987 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τα υποδήματα μετά
    πέλματος εξωτερικού εξ άλλων υλών, της κλάσης
    64.04 του κοινού δασμολογίου, καταγωγής Νοτίου
    Κορέας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2622/87 della Commissione del 31 agosto 1987 che ripristina
    la riscossione dei dazi doganali applicabili alle calzature con suole esterne
    di altre materie, della voce 64.04 della tariffa doganale comune, originarie della
    Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2622/87 van de Commissie van 31 augustus 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    buitenzool van andere stoffen, van post 64.04 van het gemeenschappelijk douanetarief,
    van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3924/86 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2622/87 da Comissão de 31 de Agosto de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a calçado com sola
    exterior de outras matérias (corda, cartão, tecido, feltro, trança, etc.),
    da posição 64.04 da pauta aduaneira comum, originário da Coreia do Sul, beneficiária
    das preferências pautais previstas pelo Regulamento (CEE) n.° 3924/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2622/87 de la Comisión de 31 de agosto de 1987 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables al
    calzado con piso de otras materias (cuerda, cartón tejido, fieltro, etc.) de
    la partida n° 64.04 del arancel aduanero común, originario de Corea del Sur,
    beneficiaria de las preferencias arancelarias previstas por el Reglamento (CEE)
    n° 3924/86 del Consejo
  type: main
