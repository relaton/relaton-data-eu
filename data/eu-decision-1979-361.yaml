title:
- language: en
  script: Latn
  content: '79/361/EEC: Commission Decision of 21 March 1979 authorizing the United
    Kingdom not to apply Community treatment to cotton yarn not put up for retail
    sale, falling within heading No 55.05 of the Common Customs Tariff (NIMEXE codes
    55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67,
    69, 72, 78, 92, 98) (category I), originating in Romania and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/361/CEE: Décision de la Commission, du 21 mars 1979, autorisant le
    Royaume-Uni à exclure du traitement communautaire les fils de coton non conditionnés
    pour la vente au détail de la position 55.05 du tarif douanier commun (codes
    Nimexe: 55.05-13, 19, 21, 25, 27, 29, 33, 37, 41, 45, 46, 48, 52, 58, 61, 65,
    67, 69, 72, 78, 92, 98) catégorie 1, originaires de la Roumanie et mis en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/361/EWG: Entscheidung der Kommission vom 21. März 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus Rumänien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf der Tarifnummer 55.05 des Gemeinsamen Zolltarifs (NIMEXE-Kodex
    55.05-13; 19; 21; 25; 27; 29; 33; 35; 37; 41; 45; 46; 48; 52; 58; 61; 65; 67;
    69; 72; 78; 92; 98) (Kategorie 1) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/361/EØF: Kommissionens beslutning af 21. marts 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage garn af bomuld,
    ikke i detailsalgsoplægninger, som henhører under pos. 55.05 i den fælles toldtarif
    (NIMEXE-nummer 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58,
    61, 65, 67, 69, 72, 78, 92, 98 ; kategori 1), har oprindelse i Rumænien og frit
    kan omsættes i de andre medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/361/CEE: Decisione della Commissione, del 21 marzo 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario filati di cotone non preparati
    per la vendita al minuto della voce 55.05 della tariffa doganale comune (codice
    Nimexe 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65,
    67, 69, 72, 78, 92, 98), categoria 1, originari della Romania e messi in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/361/EEG: Beschikking van de Commissie van 21 maart 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd garens van katoen, niet gereed voor de verkoop
    in het klein, van post 55.05 van het gemeenschappelijk douanetarief (NIMEXE-code
    55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67,
    69, 72, 78, 92, 98) (categorie 1), van oorsprong uit Roemenië en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
