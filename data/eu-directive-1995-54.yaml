title:
- language: en
  script: Latn
  content: Commission Directive 95/54/EC of 31 October 1995 adapting to technical
    progress Council Directive 72/245/EEC on the approximation of the laws of the
    Member States relating to the suppression of radio interference produced by spark-ignition
    engines fitted to motor vehicles and amending Directive 70/156/EEC on the approximation
    of the laws of the Member States relating to the type-approval of motor vehicles
    and their trailers
  type: main
- language: fr
  script: Latn
  content: Directive 95/54/CE de la Commission, du 31 octobre 1995, portant adaptation
    au progrès technique de la directive 72/245/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives à la suppression des parasites
    radioélectriques produits par les moteurs à allumage commandé équipant les
    véhicules à moteur et portant modification de la directive 70/156/CEE du Conseil
    concernant le rapprochement des législations des États membres relatives à
    la réception des véhicules à moteur et de leurs remorques
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/54/EG der Kommission vom 31. Oktober 1995 zur Anpassung der
    Richtlinie 72/245/EWG des Rates zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    über die Funkentstörung von Kraftfahrzeugmotoren mit Fremdzündung an den technischen
    Fortschritt und zur Änderung der Richtlinie 70/156/EWG des Rates zur Angleichung
    der Rechtsvorschriften der Mitgliedstaaten über die Betriebserlaubnis von Kraftfahrzeugen
    und Kraftfahrzeuganhängern
  type: main
- language: bg
  script: Cyrl
  content: Директива 95/54/ЕО на Комисията от 31 октомври
    1995 година за привеждане в съответствие с техническия
    прогрес на Директива 72/245/ЕИО на Съвета за сближаване
    на законодателствата на държавите-членки относно
    потискането на радиосмущенията, които се причиняват
    от двигателите с искрово запалване, инсталирани
    на моторни превозни средства, и за изменение
    на Директива 70/156/ЕИО за сближаване на законодателствата
    на държавите-членки относно типовото одобрение
    на моторните превозни средства и на техните
    ремаркета
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 95/54/ES ze dne 31. října 1995, kterou se přizpůsobuje
    technickému pokroku směrnice Rady 72/245/EHS o sbližování právních předpisů
    členských států týkajících se potlačení vysokofrekvenčního rušení
    způsobovaného zážehovými motory namontovanými do motorových vozidel a kterou
    se mění směrnice 70/156/EHS o sbližování právních předpisů členských
    států týkajících se schvalování typu motorových vozidel a jejich přípojných
    vozidel
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 95/54/EF af 31. oktober 1995 om tilpasning til den
    tekniske udvikling af Rådets direktiv 72/245/EØF om tilnærmelse af medlemsstaternes
    lovgivning om radiostøjdæmpning af tændingsmotorer i motordrevne køretøjer
    og om ændring af direktiv 70/156/EØF om tilnærmelse af medlemsstaternes lovgivning
    om godkendelse af motordrevne køretøjer og påhængskøretøjer dertil
  type: main
- language: el
  script: Grek
  content: Οδηγία 95/54/ΕΚ της Επιτροπής της 31ης Οκτωβρίου
    1995 για την προσαρμογή στην τεχνική πρόοδο της
    οδηγίας 72/245/ΕΟΚ του Συμβουλίου σχετικά με την
    εξουδετέρωση των ραδιοηλεκτρικών παρασίτων
    τα οποία παράγονται από τους κινητήρες με επιβαλλόμενη
    ανάφλεξη με τους οποίους είναι εφοδιασμένα
    τα μηχανοκίνητα οχήματα και για τροποποίηση
    της οδηγίας 70/156/ΕΟΚ του Συμβουλίου που αφορά
    την έγκριση τύπου των μηχανοκινήτων οχημάτων
    και των ρυμουλκουμένων τους
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 95/54/EÜ, 31. oktoober 1995, millega kohandatakse
    tehnika arenguga nõukogu direktiivi 72/245/EMÜ mootorsõidukitele paigaldatud
    sädesüütemootorite tekitatud raadiohäirete summutamist käsitlevate liikmesriikide
    õigusaktide ühtlustamise kohta ja muudetakse direktiivi 70/156/EMÜ mootorsõidukite
    ja nende haagiste tüübikinnitust käsitlevate liikmesriikide õigusaktide ühtlustamise
    kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 95/54/EY, annettu 31 päivänä okakuuta 1995, ottomoottorilla
    varustettujen moottoriajoneuvojen radiohäiriöiden vaimennusta koskevan jäsenvaltioiden
    lainsäädännön lähentämisestä annetun neuvoston direktiivin 72/245/ETY mukauttamisesta
    tekniikan kehitykseen ja moottoriajoneuvojen ja niiden perävaunujen tyyppihyväksyntää
    koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun direktiivin
    70/156/ETY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva Komisije 95/54/EZ od 31. listopada 1995. o prilagodbi tehničkom
    napretku Direktive Vijeća 72/245/EEZ o usklađivanju zakonodavstava država članica
    u odnosu na smanjenje smetnji u radiofrekvencijskom području uzrokovanih radom
    automobilskih motora sa svjećicama te o izmjeni Direktive 70/156/EEZ o usklađivanju
    zakonodavstava država članica u odnosu na homologaciju tipa motornih vozila
    i njihovih prikolica
  type: main
- language: hu
  script: Latn
  content: A Bizottság 95/54/EK irányelve (1995. október 31.) a gépjárművek
    külső gyújtású motorjai által előidézett rádiózavarok szűrésére vonatkozó
    tagállami jogszabályok közelítéséről szóló 72/245/EGK tanácsi irányelvnek
    a műszaki fejlődéshez történő hozzáigazításáról, és a gépjárművek
    és pótkocsijaik típusjóváhagyására vonatkozó tagállami jogszabályok
    közelítéséről szóló 70/156/EGK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 95/54/CE della Commissione, del 31 ottobre 1995, che adegua al
    progresso tecnico la direttiva 72/245/CEE del Consiglio concernente il ravvicinamento
    delle disposizioni legislative degli Stati Membri, relative alla soppressione
    delle perturbazioni radioelettriche provocate dai motori ad accensione comandata
    dei veicoli a motore e che modifica la direttiva 70/156/CEE per quanto riguarda
    l'omologazione dei veicoli a motore e dei loro rimorchi
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 95/54/EK (1995. gada 31. oktobris), ar kuru tehnikas
    attīstībai pielāgo Padomes Direktīvu 72/245/EEK par dalībvalstu tiesību
    aktu tuvināšanu attiecībā uz to, kā novērst radiotraucējumus, ko rada mehāniskiem
    transportlīdzekļiem paredzēti dzirksteļaizdedzes dzinēji, un ar kuru groza
    Direktīvu 70/156/EEK par dalībvalstu tiesību aktu tuvināšanu attiecībā
    uz mehānisko transportlīdzekļu un to piekabju tipa apstiprinājumu
  type: main
- language: lt
  script: Latn
  content: 1995 m. spalio 31 d. Komisijos direktyva 95/54/EB, derinanti su technikos
    pažanga Tarybos direktyvą 72/245/EEB dėl valstybių narių įstatymų, reglamentuojančių
    radijo trukdžių slopinimą motorinėse transporto priemonėse su kibirkštinio
    uždegimo varikliais, suderinimo ir iš dalies pakeičianti Direktyvą 70/156/EEB
    dėl valstybių narių įstatymų, reglamentuojančių motorinių transporto priemonių
    ir jų priekabų tipo patvirtinimą, suderinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 95/54/KE tal-31 ta’ Ottubru 1995 li tadatta
