  script: Latn
  content: Directiva 95/54/CE da Comissão, de 31 de Outubro de 1995, que adapta ao
    progresso técnico a Directiva 72/245/CEE do Conselho relativa à aproximação
    das legislações dos Estados-Membros respeitantes à supressão das interferências
    radioeléctricas produzidas pelos motores de ignição comandada que equipam os
