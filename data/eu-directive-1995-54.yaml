    la omologarea de tip a autovehiculelor și a remorcilor acestora
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 95/54/ES z 31. októbra 1995, ktorou sa prispôsobuje
    technickému pokroku smernica Rady 72/245/EHS o aproximácii právnych predpisov
    členských štátov o rádiovom odrušení zážihových motorov motorových
