    das legislações dos Estados- membros respeitantes à recepção dos veículos
    a motor e seus reboques
  type: main
- language: ro
  script: Latn
  content: Directiva 95/54/CE a Comisiei din 31 octombrie 1995 de adaptare la progresul
    tehnic a Directivei 72/245/CEE a Consiliului privind apropierea legislațiilor
    statelor membre referitoare la eliminarea paraziților radioelectrici produși
    de motoarele cu aprindere prin scânteie montate pe autovehicule și de modificare
