    prípojných vozidiel
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 95/54/ES z dne 31. oktobra 1995 o prilagoditvi tehničnemu
    napredku Direktive Sveta 72/245/EGS o približevanju zakonodaj držav članic
    o odpravi radijskih motenj, ki jih povzročajo motorji s prisilnim vžigom, vgrajeni
