title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 55/90 of 10 January 1990 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Argentina must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 55/90 de la Commission, du 10 janvier 1990, fixant
