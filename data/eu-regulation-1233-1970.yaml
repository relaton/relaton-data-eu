  content: Règlement (CEE) n° 1233/70 du Conseil, du 29 juin 1970, portant augmentation
    du contingent tarifaire communautaire de thons, frais, réfrigérés ou congelés,
    entiers, décapités ou tronçonnés, destinés à l'industrie de la conserve,
    de la position EX 03.01 B I b) du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1233/70 des Rates vom 29. Juni 1970 zur Erhöhung
    des Gemeinschaftszollkontingents für Thunfische, frisch, gekühlt oder gefroren,
    ganz, ohne Kopf oder zerteilt, für die Konservenindustrie, der Tarifnummer ex
    03.01 B I b) des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1233/70 del Consiglio, del 29 giugno 1970, relativo
    all'aumento del contingente tariffario comunitario di tonni, freschi, refrigerati
    o congelati, interi, decapitati o in pezzi, destinati all'industria conserviera,
    della voce ex 03.01 B I b) della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1233/70 van de Raad van 29 juni 1970 houdende vergroting
    van het communautaire tariefcontingent voor tonijn, vers, gekoeld of bevroren,
    ook indien ontdaan van kop of in moten gesneden, bestemd voor de conservenindustrie,
    van post ex 03.01 B I b) van het gemeenschappelijk douanetarief
  type: main
