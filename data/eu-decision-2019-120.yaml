title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/120 of 24 January 2019 amending
    Council Directive 2008/90/EC as regards the extension of the derogation relating
    to import conditions for fruit plant propagating material and fruit plants intended
    for fruit production from third countries (notified under document C(2019) 254)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/120 de la Commission du 24 janvier 2019
    modifiant la directive 2008/90/CE du Conseil en vue de prolonger la dérogation
    relative aux conditions d'importation des matériels de multiplication de plantes
    fruitières et des plantes fruitières destinées à la production de fruits en
    provenance de pays tiers [notifiée sous le numéro C(2019) 254]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/120 der Kommission vom 24. Januar 2019
    zur Änderung der Richtlinie 2008/90/EG des Rates hinsichtlich der Verlängerung
    der Ausnahmeregelung für die Einfuhrbedingungen für Vermehrungsmaterial und
    Pflanzen von Obstarten zur Fruchterzeugung aus Drittländern (Bekannt gegeben
    unter Aktenzeichen C(2019) 254)
  type: main
- language: bg
  script: Cyrl
