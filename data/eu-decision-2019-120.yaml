    týkající se dovozních podmínek pro rozmnožovací materiál ovocných rostlin
    a ovocné rostliny určené k produkci ovoce ze třetích zemí (oznámeno pod
    číslem C(2019) 254)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/120 af 24. januar 2019
