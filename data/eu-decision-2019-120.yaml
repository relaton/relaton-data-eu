    odstępstwa dotyczącego warunków przywozu materiału rozmnożeniowego roślin
    sadowniczych oraz roślin sadowniczych przeznaczonych do produkcji owoców z państw
    trzecich (notyfikowana jako dokument nr C(2019) 254)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/120 da Comissão, de 24 de janeiro de
