    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/120 della Commissione, del 24 gennaio
    2019, che modifica la direttiva 2008/90/CE del Consiglio per quanto riguarda la
    proroga della deroga relativa alle condizioni di importazione dei materiali di
    moltiplicazione delle piante da frutto e delle piante da frutto destinate alla
    produzione di frutti provenienti da paesi terzi [notificata con il numero C(2019)
    254]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/120 (2019. gada 24. janvāris),
    ar ko attiecībā uz tās atkāpes pagarināšanu, kas attiecas uz nosacījumiem
    augļaugu pavairošanas materiāla un augļu ražošanai paredzētu augļaugu
    importam no trešām valstīm, groza Padomes Direktīvu 2008/90/EK (izziņots
    ar dokumenta numuru C(2019) 254)
  type: main
- language: lt
  script: Latn
