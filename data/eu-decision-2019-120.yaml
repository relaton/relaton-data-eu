    periode waarin mag worden afgeweken van de voorwaarden voor de invoer van teeltmateriaal
    van fruitgewassen alsmede van voor de fruitteelt gebruikte fruitgewassen uit derde
    landen (Kennisgeving geschied onder nummer C(2019) 254)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/120 z dnia 24 stycznia 2019 r. zmieniająca
