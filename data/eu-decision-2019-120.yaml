    da derrogação relativa às condições de importação de países terceiros
    de material de propagação de fruteiras e de fruteiras destinados à produção
    de frutos [notificada com o número C(2019) 254]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/120 a Comisiei din 24 ianuarie
    2019 de modificare a Directivei 2008/90/CE a Consiliului în ceea ce privește
    prelungirea derogării privind condițiile de import pentru materialul de înmulțire
    și plantare fructifer destinat producției de fructe provenind din țări terțe
    [notificată cu numărul C(2019) 254]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/120 z 24. januára 2019, ktorým
