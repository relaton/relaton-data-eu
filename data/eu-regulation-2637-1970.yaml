title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2637/70 of the Commission of 23 December 1970 on special
    detailed rules for the application of the system of import and export licences
    and advance fixing certificates for agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2637/70 de la Commission, du 23 décembre 1970, portant
    modalités particulières d' application du régime des certificats d' importation,
    d' exportation et de préfixation pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2637/70 der Kommission vom 23. Dezember 1970 über
    besondere Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen
    für landwirtschaftliche Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2637/70 af 23. december 1970 om de
    særlige gennemførelsesbestemmelser for ordningen med import- og eksportlicenser
    og forudfastsættelsesattester for landbrugsprodukter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2637/70 della Commissione, del 23 dicembre 1970, che
    stabilisce modalità particolari di applicazione per il regime dei titoli di importazione,
    di esportazione e dei certificati di fissazione anticipata relativi ai prodotti
    agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2637/70 van de Commissie van 23 december 1970 houdende
    bijzondere uitvoeringsbepalingen inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten
    voor landbouwprodukten
  type: main
