title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1880/79 of 24 August 1979 re-establishing
    the levying of customs duties on primary cells and primary batteries, falling
    within heading No 85.03 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1880/79 de la Commission, du 24 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux piles électriques
    de la position 85.03 du tarif douanier commun, originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1880/79 der Kommission vom 24. August 1979 zur Wiedereinführung
    des Zollsatzes für Primärelemente und Primärbatterien der Tarifnummer 85.03,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1880/79 af 24. august 1979 om genindførelse
    af opkrævning af toldafgifter for primærbatterier under position 85.03, som
    har oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1880/79 della Commissione, del 24 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle pile elettriche,
    della voce 85.03 della tariffa doganale comune, originarie di Hong Kong beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1880/79 van de Commissie van 24 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elektrische
    elementen en elektrische batterijen, van post 85.03, van oorsprong uit Hong-Kong
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
