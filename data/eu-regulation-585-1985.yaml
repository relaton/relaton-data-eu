  content: Commission Regulation (EEC) No 585/85 of 6 March 1985 re-establishing the
    levying of customs duties on antimony oxides, falling within subheading 28.28
    ex N, originating in China to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
