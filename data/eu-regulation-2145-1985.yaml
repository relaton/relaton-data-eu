title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2145/85 of 30 July 1985 determining the
    extent to which applications lodged in July 1985 for the issued of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2145/85 de la Commission, du 30 juillet 1985, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1985 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2145/85 der Kommission vom 30. Juli 1985 über den
    Umfang, in dem den im Monat Juli 1985 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2145/85 af 30. juli 1985 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i juli måned 1985 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2145/85 της Επιτροπής
    της 30ής Ιουλίου 1985 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Ιούλιο του 1985, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2145/85 della Commissione, del 30 luglio 1985, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1985 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2145/85 van de Commissie van 30 juli 1985 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand juli
    1985 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
