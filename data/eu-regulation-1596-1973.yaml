id: EURegulation15961973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1596/73 of the Commission of 14 June 1973 re-establishing
    Common Customs Tariff duties on embroidery, in strips or motifs falling within
    heading No 58.10, originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2764/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1596/73 de la Commission, du 14 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux broderies en pièces, en bandes ou en motifs, de la position tarifaire 58.10,
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2764/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1596/73 der Kommission vom 14. Juni 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Stickereien als
    Meterware oder als Motiv, der Tarifnummer 58.10, mit Ursprung in Pakistan, dem
    die in der Verordnung (EWG) Nr. 2764/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1596/73 af 14. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for broderier, i løbende længder, strimler
    eller motiver under position 58.10 som har oprindelse i Pakistan og omfattes af
    de toldpræferencer som er fastsat i Rådets forordning (EØF) nr. 2764/72 a 19.
    december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1596/73 della Commissione, del 14 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    ricami in pezza, in strisce o in motivi, della voce doganale n. 58.10 originari
    del Pakistan, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2764/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1596/73 van de Commissie van 14 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op borduurwerk, aan het stuk, in banden of in de vorm van motieven,
    van post 58.10, van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2764/72 van de Raad van 19 december
    1972
  type: main
