---
id: EUDecision1977192
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 January 1977 authorizing the French Republic
    not to apply Community treatment to radio receivers, whether or not combined with
    a sound recorder or reproducer, falling within subheading 85.15 A III of the Common
    Customs Tariff, originating in Japan and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '77/192/CEE: Décision de la Commission, du 21 janvier 1977, autorisant
    la République française à exclure du traitement communautaire les appareils
    d''enregistrement ou de reproduction du son, de la sous-position 85.15 A III du
    Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Januar 1977, mit der die Französische
    Republik ermächtigt wird, bestimmte aus Japan stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Tonaufnahme- oder Tonwiedergabegeräte der Tarifstelle
    85.15 A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. januar 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage lydoptagere og lydgengivere,
    som henhører under pos. 85.15 A m i den fælles toldtarif, har oprindelse i Japan
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 gennaio 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli apparecchi di registrazione
    o di riproduzione del suono della sottovoce 85.15 A III della tariffa doganale
    comune, originari del Giappone e immessi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 januari 1977 waarbij de Franse Republiek
    wordt gemachtigd ontvangtoestellen voor de radio-omroep, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid, van post 85.15 A III
    van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
