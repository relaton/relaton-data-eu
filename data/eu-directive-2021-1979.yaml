---
id: EUDirective20211979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2021/1979 of 11 August 2021 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of bis(2-ethylhexyl) phthalate (DEHP) in plastic components
    in magnetic resonance imaging (MRI) detector coils
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2021/1979 de la Commission du 11 août 2021
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    IV de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative à l’utilisation du phtalate de bis(2-éthylhexyle) (DEHP)
    dans les composants en matière plastique de bobines de détection pour l’imagerie
    par résonance magnétique (IRM)
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2021/1979 der Kommission vom 11. August 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Diethylhexylphthalat
    (DEHP) in Kunststoffbauteilen in Magnetresonanztomographie-Detektorspulen (MRT-Detektorspulen)
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2021/1979 на Комисията
    от 11 август 2021 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение IV към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаване
    от ограничението за употребата на бис(2-етилхексилов)
    фталат (DEHP) в пластмасови елементи на детекторни
    намотки на магнитно-резонансни томографи (МРТ)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2021/1979 ze dne 11. srpna
    2021, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití bis(2-ethylhexyl)-ftalátu (DEHP) v plastových součástech
    v cívkách pro detektory magnetické rezonance (MRI)
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2021/1979 af 11. august 2021 om
    tilpasning til den videnskabelige og tekniske udvikling af bilag IV til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for brugen af
    di(2-ethylhexyl)phthalat (DEHP) i plastkomponenter i detektorspoler til magnetisk
    resonans-billeddannelse (MRI)
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2021/1979 της
    Επιτροπής της 11ης Αυγούστου 2021 για την τροποποίηση,
    προς τον σκοπό της προσαρμογής στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση φθαλικού δις(2-αιθυλεξυλίου) (DEHP) σε
    πλαστικά κατασκευαστικά στοιχεία πηνίων ανιχνευτών
    σε συσκευές απεικόνισης με μαγνητικό συντονισμό
    (MRI)
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2021/1979, 11. august 2021, millega
    muudetakse teaduse ja tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi
    ja nõukogu direktiivi 2011/65/EL IV lisa seoses erandiga, mis hõlmab bis(2-etüülheksüül)ftalaadi
    (DEHP) kasutamist magnetresonantstomograafia (MRT) detektoripoolide plastkoostisosades
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2021/1979, annettu 11 päivänä elokuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    poikkeuksen myöntämisestä bis(2-etyyliheksyyli)ftalaatin (DEHP) käytölle
    muovikomponenteissa magneettikuvauksen (MRI) vastaanotinkeloissa
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2021/1979 ón gCoimisiún an 11 Lúnasa 2021 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn teicniúil agus eolaíoch,
    Iarscríbhinn IV a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine i leith úsáid bios(2-eitilheicsil)
    taláite (DEHP) i gcomhpháirteanna plaisteacha i gcornaí brathadóra íomháithe
    athshondais mhaighnéadaigh (MRI)
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/1979 оd 11. kolovoza 2021. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu di(2-etilheksil)
    ftalata (DEHP) u plastičnim komponentama zavojnica uređaja za magnetsku rezonanciju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1979 felhatalmazáson alapuló irányelve (2021.
    augusztus 11.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítása céljából,
    a bisz(2-etilhexil)-ftalát (DEHP) mágneses rezonanciás képalkotó (MRI) berendezések
    érzékelő tekercseinek műanyag alkatrészeiben való felhasználására vonatkozó
    mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2021/1979 della Commissione dell'11 agosto 2021
    che modifica, adattandolo al progresso scientifico e tecnico, l'allegato IV della
    direttiva n. 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l'esenzione relativa all'uso del bis(2-etilesil) ftalato (DEHP) nei componenti
    plastici delle bobine di rilevamento per la risonanza magnetica per immagini (RMI)
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2021/1979 (2021. gada 11. augusts),
    ar ko attiecībā uz atbrīvojumu, kas atļautu bis(2-etilheksil)ftalātu (DEHP)
    izmantot magnētiskās rezonanses attēldiagnostikas (MRI) detektorspoļu plastmasas
    detaļās, groza Eiropas Parlamenta un Padomes Direktīvas 2011/65/ES IV pielikumu,
    to pielāgojot zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2021/1979 2021 m. rugpjūčio 11 d.
    kuria, derinant prie mokslo ir technikos pažangos, dėl išimties, kuria bis(2-etilheksil)ftalatą
    leidžiama naudoti magnetinio rezonanso vaizdo gavimo įrenginių detektoriaus
    ričių plastikinėse sudedamosiose dalyse, iš dalies keičiamas Europos Parlamento
    ir Tarybos direktyvos 2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2021/1979 tal-11 ta’ Awwissu
    2021 li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-ftalat ta’ bis(2-etileżil) (DEHP) f’komponenti
    tal-plastik li jinsabu fil-kojls tad-ditekter tal-Immaġni bir-Reżonanza Manjetika
    (MRI)
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2021/1979 van de Commissie van 11 augustus
    2021 tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van bis(2-ethylhexyl)ftalaat
    (DEHP) in kunststofonderdelen van detectorspoelen in apparaten voor beeldvorming
    door middel van magnetische resonantie (MRI)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2021/1979 z dnia 11 sierpnia 2021 r.
    zmieniająca, w celu dostosowania do postępu naukowo-technicznego, załącznik
    IV do dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    dotyczącego stosowania ftalanu di-2-etyloheksylu (DEHP) w elementach z tworzyw
    sztucznych do cewek detekcyjnych w skanerach rezonansu magnetycznego (MRI)
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2021/1979 da Comissão de 11 de agosto de 2021 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante a
    uma isenção relativa à utilização de ftalato de bis(2-etil-hexilo) (DEHP)
    em componentes plásticos de bobinas de deteção para imagiologia por ressonância
    magnética (IRM)
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2021/1979 a Comisiei din 11 august 2021 de modificare,
    în scopul adaptării la progresele științifice și tehnice, a anexei IV la
    Directiva 2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește
    o derogare pentru utilizarea ftalatului de bis(2-etilhexil) (DEHP) în componentele
    din plastic ale bobinelor detectoare din aparatele de imagistică prin rezonanță
    magnetică (IRM)
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2021/1979 z 11. augusta 2021, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    IV k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    z používania bis(2-etylhexyl)-ftalátu (DEHP) v plastových komponentoch do
    cievok v prístrojoch na zobrazovanie magnetickou rezonanciou (MRI)
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/1979 z dne 11. avgusta 2021 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo bis(2-etilheksil) ftalata (DEHP) v plastičnih komponentah v tuljavah
    detektorjev naprav za magnetnoresonančno slikanje (MRI) zaradi prilagoditve znanstvenemu
    in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2021/1979 de la Comisión de 11 de agosto de 2021
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo, por
    lo que respecta a una exención relativa al uso del ftalato de bis(2-etilexilo)
    (DEHP) en componentes de plástico de bobinas detectoras para tomografía por
    resonancia magnética nuclear (IRM)
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2021/1979 av den 11 augusti 2021
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga IV till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av bis(2-etylhexyl)ftalat (DEHP) i plastkomponenter
    i detektorspolar för magnetisk resonanstomografi (MRI)
  type: main
