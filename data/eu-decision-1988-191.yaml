    οικονομικό έτος 1988 για τη χορήγηση τροφίμων
    που προέρχονται από τα αποθέματα της παρεμβάσεως
    στους οργανισμούς που ορίζονται για τη διανομή
    τους στους απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 22 marzo 1988 relativa ad uno stanziamento
