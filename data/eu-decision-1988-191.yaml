title:
- language: en
  script: Latn
  content: '88/191/EEC: Commission Decision of 22 March 1988 making an initial allocation
    to Greece of part of the resources to be charged to the 1988 budget year for the
    supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/191/CEE: Décision de la Commission du 22 mars 1988 allouant à la
    Grèce une première tranche d''une partie des crédits imputables à l''exercice
    1988 pour la fourniture de denrées alimentaires provenant des stocks d''intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 22. März 1988 über die erste Bewilligung
    von Mitteln, die im Haushaltsjahr 1988 für die Zurverfügungstellung von Nahrungsmitteln
    aus Interventionsbeständen an bezeichnete Organisationen zur Verteilung an stark
    benachteiligte Personen in der Gemeinschaft zu verbuchen sind, für Griechenland
    (88/191/EWG) (88/191/EWG) #'
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 22. marts 1988 om en foreløbig tildeling til
    Grækenland af en del af de midler, der skal opføres på 1988-budgettet for levering
    af levnedsmidler fra interventionslagre til nærmere bestemte organisationer med
    henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet
    (88/191/EØF)
  type: main
- language: el
  script: Grek
