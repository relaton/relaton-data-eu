title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2967/92 of 12 October 1992 amending Regulation
    (EEC) No 2112/90 imposing a definitive anti-dumping duty on imports of certain
    types of electronic microcircuits known as DRAMs (dynamic random access memories)
    originating in Japan and collecting definitively the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2967/92 du Conseil, du 12 octobre 1992, modifiant
    le règlement (CEE) n° 2112/90 instituant un droit antidumping définitif sur
    les importations de certains types de microstructures électroniques, dites "DRAM"
    (dynamic random access memories), originaires du Japon, et portant perception
    définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2967/92 des Rates vom 12. Oktober 1992 zur Änderung
    der Verordnung (EWG) Nr. 2112/90 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter elektronischer Mikroschaltungen, sogenannter DRAMs
    (dynamische Schreib-Lesespeicher), mit Ursprung in Japan und zur endgültigen
    Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2967/92 af 12. oktober 1992 om ændring af
    forordning (EØF) nr. 2112/90 om indførelse af en endelig antidumpingtold på
    importen af visse typer elektroniske mikrokredsløb, såkaldte DRAM's (Dynamic
    Random Access Memories) med oprindelse i Japan, og om endelig opkrævning af den
    midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2967/92 του Συμβουλίου
    της 12ης Οκτωβρίου 1992 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2112/90 περί επιβολής αντιντάμπινγκ
    στις εισαγωγές ορισμένων τύπων ηλεκτρονικών
    μικροκυκλωμάτων γνωστών ως DRAM (δυναμικές μνήμες
    τυχαίας προσπέλασης) καταγωγής Ιαπωνίας, και
    περί της οριστικής είσπραξης του προσωρινού
    δασμού
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2967/92 del Consiglio, del 12 ottobre 1992, relativo
    alla modifica del regolamento (CEE) n. 2112/90 che istituisce un dazio antidumping
    definitivo sulle importazioni di alcuni tipi di microcircuiti elettronici, detti
    DRAM (memorie dinamiche ad accesso casuale), originari del Giappone, e relativo
    alla riscossione definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2967/92 van de Raad van 12 oktober 1992 tot wijziging
    van Verordening (EEG) nr. 2112/90 tot instelling van een definitief antidumpingrecht
    op de invoer van bepaalde soorten elektronische microschakelingen, bekend als
    DRAM's (Dynamic Random Access Memories) van oorsprong uit Japan, en tot definitieve
    inning van het voorlopige recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2967/92 do Conselho, de 12 de Outubro de 1992, que
    altera o Regulamento (CEE) n° 2112/90, que institui um direito anti-dumping definitivo
    sobre as importações de certos tipos de microcircuitos electrónicos conhecidos
    por DRAM (memórias dinâmicas de acesso directo), originárias do Japão, e que
    estabelece a cobrança definitiva do direito provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2967/92 del Consejo, de 12 de octubre de 1992, que
    modifica el Reglamento (CEE) n° 2112/90 por el que se establece un derecho antidumping
    definitivo sobre las importaciones de determinados tipos de microcircuitos electrónicos
    conocidos como DRAMS (dynamic random acces memories), originarios de Japón, y
    por el que se percibe definitivamente el derecho provisional
  type: main
