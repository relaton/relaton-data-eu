- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3751/81 of 22 December 1981 amending Regulation
    (EEC) No 263/81 laying down detailed rules for the application of the import arrangements
    provided for by Regulation (EEC) No 217/81 and (EEC) No 218/81 in the beef and
    veal sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3751/81 de la Commission, du 22 décembre 1981, modifiant
    le règlement (CEE) n° 263/81 établissant les modalités d' application des
    régimes d' importation prévus par les règlements (CEE) n° 217/81 et (CEE)
    n° 218/81 dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3751/81 der Kommission vom 22. Dezember 1981 zur Änderung
