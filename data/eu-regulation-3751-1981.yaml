    im Rindfleischsektor gemäß den Verordnungen (EWG) Nr. 217/81 und (EWG) Nr. 218/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3751/81 af 22. december 1981 om ændring
