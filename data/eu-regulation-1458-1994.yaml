title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1458/94 of 23 June 1994 re-etablishing the
    levying of the customs duties applicable to products falling within CN code 2929
    90 00 originating in Brazil, to which the preferential tariff arrangements of
    Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1458/94 de la Commission du 23 juin 1994 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 2929
    90 00 originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1458/94 DER KOMMISSION vom 23. Juni 1994 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 2929 90 00 mit Ursprung in
    Brasilien, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1458/94 af 23. juni 1994 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2929 90 00 og med oprindelse
    i Brasilien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1458/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 23ης Ιουνίου 1994 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 2929 90 00 καταγωγής Βραζιλίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1458/94 DELLA COMMISSIONE del 23 giugno 1994 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice della nomenclatura
    combinata 2929 90 00 originari del Brasile, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1458/94 VAN DE COMMISSIE van 23 juni 1994 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 2929 90 00, van oorsprong uit Brazilië, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1458/94 DA COMISSÃO de 23 de Junho de 1994 que restabelece
