    ja tuotanto-organisaatioilta edellytettävistä hallintojärjestelmistä ja poikkeamailmoitusjärjestelmistä
    sekä viraston soveltamista menettelyistä ja mainitun asetuksen oikaisemisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/201 ón gCoimisiún an 10 Nollaig 2021
