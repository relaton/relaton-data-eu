    bhainistíochta agus córais tuairiscithe tarluithe atá le bunú ag eagraíochtaí
    deartha agus táirgthe, agus le nósanna imeachta a gcuireann an Ghníomhaireacht
    i bhfeidhm iad, agus lena gceartaítear an Rialachán sin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/201 оd 10. prosinca 2021. o izmjeni
    Uredbe (EU) br. 748/2012 u pogledu sustava upravljanja i sustava izvješćivanja
    o događajima koje trebaju uspostaviti projektne i proizvodne organizacije kao
    i postupaka koje primjenjuje Agencija i o ispravku te uredbe
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/201 felhatalmazáson alapuló rendelete (2021. december
    10.) a 748/2012/EU rendeletnek a tervező és gyártó szervezetek által létrehozandó
    vezetési rendszerek és eseményjelentési rendszerek, valamint az Ügynökség
    által alkalmazott eljárások tekintetében történő módosításáról, továbbá
    az említett rendelet helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/201 della Commissione del 10 dicembre 2021
    che modifica il regolamento (UE) n. 748/2012 per quanto riguarda i sistemi di
    gestione e i sistemi di segnalazione delle non conformità che devono essere istituiti
    dalle imprese di progettazione e di produzione, nonché le procedure applicate
    dall’Agenzia, e rettifica tale regolamento
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/201 (2021. gada 10. decembris),
    ar ko Regulu (ES) Nr. 748/2012 groza attiecībā uz pārvaldības sistēmām un
    sistēmām ziņošanai par atgadījumiem, kuras jāizveido projektēšanas un
    ražošanas organizācijām, kā arī attiecībā uz procedūrām, kuras piemēro
    Aģentūra, un ar ko izdara minētās regulas labojumus
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/201 2021 m. gruodžio 10 d.
