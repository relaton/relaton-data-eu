    και για τη διόρθωση του εν λόγω κανονισμού
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/201, 10. detsember 2021, millega
    muudetakse määrust (EL) nr 748/2012 projekteerimis- ja tootjaorganisatsioonide
    kehtestatavate juhtimissüsteemide ning lennuohutust mõjutavatest juhtumitest
