title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/201 of 10 December 2021 amending
    Regulation (EU) No 748/2012 as regards management systems and occurrence-reporting
    systems to be established by design and production organisations, as well as procedures
    applied by the Agency, and correcting that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/201 de la Commission du 10 décembre 2021
    modifiant le règlement (UE) no 748/2012 en ce qui concerne les systèmes de gestion
    et les systèmes de comptes rendus d’événements que doivent mettre en place
    les organismes de conception et de production, ainsi que les procédures appliquées
    par l’Agence, et rectifiant ledit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/201 der Kommission vom 10. Dezember 2021
    zur Änderung der Verordnung (EU) Nr. 748/2012 in Bezug auf von Entwicklungs-
    und Herstellungsorganisationen einzuführende Managementsysteme und Systeme zur
    Meldung von Ereignissen sowie in Bezug auf die von der Agentur anzuwendenden Verfahren
    und zur Berichtigung jener Verordnung
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/201 на Комисията
    от 10 декември 2021 година за изменение на Регламент
    (ЕС) № 748/2012 по отношение на системите за управление
    и системите за докладване на събития, които
    трябва да бъдат въведени от проектантските
    и производствените организации, както и процедурите,
    прилагани от Агенцията, и за поправка на посочения
    регламент
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/201 ze dne 10. prosince
    2021, kterým se mění nařízení (EU) č. 748/2012, pokud jde o systémy řízení
    a systémy hlášení událostí, jež mají být zřízeny projekčními a výrobními
    organizacemi, jakož i postupy uplatňované agenturou, a kterým se opravuje
    uvedené nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/201 af 10. december 2021
    om ændring af forordning (EU) nr. 748/2012 for så vidt angår styringssystemer,
    systemer for indberetning af begivenheder, der skal indføres af konstruktions-
    og produktionsorganisationer, og de procedurer, der skal anvendes af agenturet,
    og om berigtigelse af nævnte forordning
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/201
    της Επιτροπής της 10ης Δεκεμβρίου 2021 για την
    τροποποίηση του κανονισμού (ΕΕ) αριθ. 748/2012 όσον
    αφορά τα συστήματα διαχείρισης και τα συστήματα
    αναφοράς περιστατικών που πρέπει να θεσπιστούν
    από τους φορείς σχεδιασμού και παραγωγής, καθώς
