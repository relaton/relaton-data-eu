    sukurti projektavimo ir gamybinės organizacijos, ir dėl Agentūros taikomų
    procedūrų iš dalies keičiamas ir ištaisomas Reglamentas (ES) Nr. 748/2012
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/201 tal-10 ta’ Diċembru
    2021 li jemenda r-Regolament (UE) Nru 748/2012 fir-rigward tas-sistemi ta’ ġestjoni
    u s-sistemi tar-rappurtar tal-okkorrenzi li għandhom jiġu stabbiliti mill-organizzazzjonijiet
    tad-disinn u tal-produzzjoni, kif ukoll il-proċeduri applikati mill-Aġenzija,
    u li jikkoreġi dak ir-Regolament
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/201 van de Commissie van 10 december
    2021 tot wijziging van Verordening (EU) nr. 748/2012 wat betreft door ontwerp-
    en productieorganisaties op te zetten beheersystemen en voorvallenmeldingssystemen,
    alsmede wat betreft de door het Agentschap toegepaste procedures, en tot rectificatie
    van die verordening
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/201 z dnia 10 grudnia 2021
    r. w sprawie zmiany rozporządzenia (UE) nr 748/2012 w odniesieniu do systemów
    zarządzania i systemów zgłaszania zdarzeń, które mają zostać ustanowione
    przez organizacje projektujące i produkujące, a także procedur stosowanych
    przez Agencję, oraz w sprawie sprostowania tego rozporządzenia
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/201 da Comissão de 10 de dezembro de 2021
    que altera o Regulamento (UE) n.o 748/2012 no que respeita aos sistemas de gestão
    e aos sistemas de comunicação de ocorrências a estabelecer pelas entidades
    de projeto e produção, bem como aos procedimentos aplicados pela Agência, e
    retifica esse regulamento
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/201 al Comisiei din 10 decembrie 2021 de
    modificare a Regulamentului (UE) nr. 748/2012 în ceea ce privește sistemele
    de management al siguranței și sistemele de raportare a evenimentelor care urmează
    să fie instituite de către organizațiile de proiectare și de producție și
    în ceea ce privește procedurile aplicate de agenție, precum și de rectificare
    a regulamentului respectiv
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/201 z 10. decembra 2021, ktorým
    sa mení nariadenie (EÚ) č. 748/2012, pokiaľ ide o systémy manažmentu a systémy
    hlásenia udalostí, ktoré majú zriadiť projekčné a výrobné organizácie,
    ako aj postupy uplatňované agentúrou, a ktorým sa opravuje uvedené nariadenie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/201 z dne 10. decembra 2021 o spremembi
    Uredbe (EU) št. 748/2012 glede sistemov upravljanja in poročanja o dogodkih,
    ki jih vzpostavijo projektivne in proizvodne organizacije, ter postopkov, ki jih
    uporablja agencija, in o popravku navedene uredbe
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/201 de la Comisión de 10 de diciembre de
    2021 por el que se modifica el Reglamento (UE) n.o 748/2012 en lo que respecta
    a los sistemas de gestión y los sistemas de notificación de sucesos que deben
    crear las organizaciones de diseño y de producción, así como a los procedimientos
    aplicados por la Agencia, y por el que se corrige dicho Reglamento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/201 av den 10 december 2021
    om ändring av förordning (EU) nr 748/2012 vad gäller ledningssystem och system
    för händelserapportering som ska inrättas av konstruktions- och tillverkningsorganisationer,
    samt förfaranden som tillämpas av byrån, och om rättelse av den förordningen
