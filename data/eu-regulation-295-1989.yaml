    μπορούν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 295/89 DEL CONSIGLIO del 3 febbraio 1989 recante
    modifica del regolamento (CEE) n. 4194/88 che fissa, per alcune popolazioni o
    gruppi di popolazioni ittiche, il totale delle catture permesse per il 1989 ed
    alcune condizioni cui è soggetta la pesca del totale delle catture permesse #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 295/89 VAN DE RAAD van 3 februari 1989 tot wijziging
    van Verordening (EEG) nr. 4194/88 inzake de vaststelling van de voor 1989 geldende
    totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden
