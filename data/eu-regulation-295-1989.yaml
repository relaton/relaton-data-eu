  content: Council Regulation (EEC) No 295/89 of 3 February 1989 amending Regulation
    (EEC) No 4194/88 fixing, for certain fish stocks and groups of fish stocks, the
    total allowable catches for 1989 and certain conditions under which they may be
    fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 295/89 du Conseil du 3 février 1989 modifiant le
    règlement (CEE) n° 4194/88 fixant, pour certains stocks et groupes de stocks
    de poissons, les totaux admissibles des captures pour 1989 et certaines conditions
    dans lesquelles ils peuvent être pêchés
  type: main
