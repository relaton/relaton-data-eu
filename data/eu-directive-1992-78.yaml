    και 79/32/ΕΟΚ περί των φόρων, πλην των φόρων κύκλου
    εργασιών, οι οποίοι βαρύνουν την κατανάλωση
    βιομηχανοποιημένων καπνών
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 92/78/ETY, annettu 19 päivänä lokakuuta 1992, muista
    valmistetun tupakan kulutukseen kohdistuvista veroista kuin liikevaihtoveroista
    annettujen direktiivien 72/464/ETY ja 79/32/ muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 92/78/CEE del Consiglio, del 19 ottobre 1992, che modifica le
    direttive 72/464/CEE e 79/32/CEE relative alle imposte diverse dall' imposta sulla
    cifra d' affari che gravano sul consumo dei tabacchi lavorati
  type: main
- language: nl
  script: Latn
  content: Richtlijn 92/78/EEG van de Raad van 19 oktober 1992 tot wijziging van de
