    die Umsatzsteuer
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 92/78/EØF af 19. oktober 1992 om ændring af direktiv
    72/464/EØF og 79/32/EØF om forbrugsbeskatning af forarbejdet tobak bortset fra
    omsætningsafgift
  type: main
- language: el
  script: Grek
