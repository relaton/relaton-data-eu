    op het verbruik van tabaksfabrikaten
  type: main
- language: pt
  script: Latn
  content: Directiva 92/78/CEE do Conselho, de 19 de Outubro de 1992, que altera as
    directivas 72/464/CEE e 79/32/CEE, relativas aos impostos que incidem sobre o
    consumo de tabacos manufacturados com excepção dos impostos sobre o volume de
    negócios
  type: main
- language: es
  script: Latn
