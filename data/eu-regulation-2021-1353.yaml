title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1353 of 17 May 2021 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council with regard
    to the cases and conditions under which competent authorities may designate official
    laboratories which do not fulfil the conditions in relation to all the methods
    they use for official controls or other official activities
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1353 de la Commission du 17 mai 2021 complétant
    le règlement (UE) 2017/625 du Parlement européen et du Conseil en ce qui concerne
    les cas et les conditions dans lesquels les autorités compétentes peuvent désigner
    comme laboratoires officiels des laboratoires qui ne remplissent pas les conditions
    par rapport à toutes les méthodes qu’ils emploient pour les contrôles officiels
    ou les autres activités officielles
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1353 der Kommission vom 17. Mai 2021 zur
    Ergänzung der Verordnung (EU) 2017/625 des Europäischen Parlaments und des Rates
    hinsichtlich der Fälle und Bedingungen, in bzw. unter denen die zuständigen
    Behörden amtliche Laboratorien benennen können, die nicht für alle von ihnen
    im Rahmen amtlicher Kontrollen oder anderer amtlicher Tätigkeiten verwendeten
    Methoden die entsprechenden Bedingungen erfüllen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1353 на Комисията
    от 17 май 2021 година за допълнение на Регламент
    (ЕС) 2017/625 на Европейския парламент и на Съвета
    по отношение на случаите и условията, при които
    компетентните органи могат да определят официални
    лаборатории, които не отговарят на условията
    по отношение на всички методи, които те използват
    за официален контрол или други официални дейности
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1353 ze dne 17. května
    2021, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/625,
    pokud jde o případy a podmínky, kdy příslušné orgány mohou určit úřední
    laboratoře, které nesplňují podmínky pro všechny metody, jež používají
    pro úřední kontroly nebo jiné úřední činnosti
  type: main
- language: da
  script: Latn
