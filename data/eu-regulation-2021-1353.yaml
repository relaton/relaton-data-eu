    službene aktivnosti
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1353 felhatalmazáson alapuló rendelete (2021.
    május 17.) az (EU) 2017/625 európai parlamenti és tanácsi rendeletnek a hatósági
    ellenőrzések és más hatósági tevékenységek céljára alkalmazott valamennyi
    módszerre vonatkozó feltételeket nem teljesítő laboratóriumok illetékes
    hatóság általi, hatósági laboratóriumként való kijelölését lehetővé
    tévő esetek és feltételek tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/1353 della Commissione del 17 maggio 2021
    che integra il regolamento (UE) 2017/625 del Parlamento europeo e del Consiglio
    per quanto riguarda i casi e le condizioni in cui le autorità competenti possono
    designare laboratori ufficiali che non soddisfano le condizioni per tutti i metodi
    da essi impiegati per i controlli ufficiali o le altre attività ufficiali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/1353 (2021. gada 17. maijs), ar
    ko papildina Eiropas Parlamenta un Padomes Regulu (ES) 2017/625, nosakot, kādos
    gadījumos un ar kādiem nosacījumiem kompetentās iestādes drīkst nozīmēt
    oficiālās laboratorijas, kas neatbilst nosacījumiem attiecībā uz visām metodēm,
    kuras tās izmanto oficiālajām kontrolēm vai citām oficiālajām darbībām
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/1353 2021 m. gegužės 17
