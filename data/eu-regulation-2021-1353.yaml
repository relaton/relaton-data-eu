  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/1353 z dnia 17 maja 2021 r.
    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/625
    w odniesieniu do tego, w jakich przypadkach i na jakich warunkach właściwe organy
    mogą wyznaczać laboratoria urzędowe, które nie spełniają warunków w odniesieniu
    do wszystkich metod, które laboratoria te stosują w ramach kontroli urzędowych
    lub innych czynności urzędowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/1353 da Comissão de 17 de maio de 2021
    que completa o Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho no
    que diz respeito aos casos e às condições em que as autoridades competentes
    podem designar laboratórios oficiais que não cumpram as condições relativamente
    a todos os métodos que utilizem para os controlos oficiais ou outras atividades
    oficiais
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1353 al Comisiei din 17 mai 2021 de completare
    a Regulamentului (UE) 2017/625 al Parlamentului European și al Consiliului în
    ceea ce privește cazurile și condițiile în care autoritățile competente
    pot desemna drept laboratoare oficiale laboratoarele care nu îndeplinesc condițiile
    privind toate metodele pe care acestea le utilizează pentru controalele oficiale
    sau alte activități oficiale
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1353 zo 17. mája 2021, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2017/625, pokiaľ ide
    o prípady a podmienky, za ktorých môžu príslušné orgány určiť úradné
    laboratóriá, ktoré nespĺňajú podmienky v súvislosti so všetkými metódami,
    ktoré používajú na úradné kontroly alebo iné úradné činnosti
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1353 z dne 17. maja 2021 o dopolnitvi
