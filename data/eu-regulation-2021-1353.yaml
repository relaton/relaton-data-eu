  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/1353 de la Comisión de 17 de mayo de 2021
    por el que se completa el Reglamento (UE) 2017/625 del Parlamento Europeo y del
    Consejo por lo que respecta a los supuestos y las condiciones en que las autoridades
    competentes pueden designar como laboratorios oficiales a laboratorios que no
    cumplan las condiciones en relación con todos los métodos que utilicen para
    realizar los controles oficiales y otras actividades oficiales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/1353 av den 17 maj 2021
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
    gäller i vilka fall och på vilka villkor behöriga myndigheter får utse officiella
    laboratorier som inte uppfyller villkoren för alla de metoder som de använder
    vid offentlig kontroll och annan offentlig verksamhet
