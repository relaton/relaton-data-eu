    laboratorijas, kurios netenkina sąlygų, keliamų visiems oficialiai kontrolei
    ar kitai oficialiai veiklai vykdyti jų naudojamiems metodams
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/1353 tas-17 ta’ Mejju 2021
