title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2748/89 of 12 September 1989 re-establishing
    the levying of customs duties on waterproof footwear with outer soles and uppes
    of rubber or of plastics falling within CN codes 6401 and 6402 originating in
    Brazil and those originating in Malaysia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2748/89 de la Commission du 12 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    étanches à semelles extérieures et dessus en caoutchouc ou en matière plastique,
    des codes NC 6401 et 6402, originaires du Brésil, et à celles originaires de
    la Malaysia, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 4257/88 du Conseil
  type: main
