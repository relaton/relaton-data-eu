    und Oberteil aus Kautschuk oder Kunststoff der KN-Code 6401 und 6402 mit Ursprung
    in Brasilien und mit Ursprung in Malaysia, denen die in der Verordnung (EWG) Nr.
    4257/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2748/89 af 12. september 1989 om genindførelse
