    plast henhørende under KN-kode 6401 og 6402 og med oprindelse i Brasilien og
    i Malaysia, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 4257/88
  type: main
- language: el
  script: Grek
