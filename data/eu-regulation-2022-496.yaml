    isolat BV-0004» en tant que substance active à faible risque, conformément
    au règlement (CE) no 1107/2009 du Parlement européen et du Conseil concernant
    la mise sur le marché des produits phytopharmaceutiques, et modifiant le règlement
    d’exécution (UE) no 540/2011 de la Commission
