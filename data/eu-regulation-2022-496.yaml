  script: Latn
  content: Commission Implementing Regulation (EU) 2022/496 of 28 March 2022 approving
    the low-risk active substance Spodoptera exigua multicapsid nucleopolyhedrovirus
    (SeMNPV), isolate BV-0004 in accordance with Regulation (EC) No 1107/2009 of the
    European Parliament and of the Council concerning the placing of plant protection
    products on the market, and amending Commission Implementing Regulation (EU) No
    540/2011
  type: main
- language: fr
