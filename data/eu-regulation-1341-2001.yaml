title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1341/2001 of 3 July 2001 amending Regulation
    (EC) No 169/2001 and increasing the quantity covered by the standing invitation
    to tender for the resale on the internal market of rice held by the Italian intervention
    agency to 70000 tonnes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1341/2001 de la Commission du 3 juillet 2001 modifiant
    le règlement (CE) n° 169/2001 et portant à 70000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur du riz détenu par l'organisme d'intervention
    italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1341/2001 der Kommission vom 3. Juli 2001 zur Änderung
    der Verordnung (EG) Nr. 169/2001 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Reis aus Beständen der italienischen
    Interventionsstelle auf 70000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1341/2001 af 3. juli 2001 om ændring
    af forordning (EF) nr. 169/2001 og om forhøjelse af den mængde, der udbydes
    i løbende licitation med henblik på videresalg på det indre marked af ris fra
    det italienske interventionsorgan, til 70000 tons
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1341/2001 της Επιτροπής,
    της 3ης Ιουλίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 169/2001 και για την αύξηση
    σε 70000 τόνους της προκήρυξης δημοπρασίας για
    τη μεταπώληση στην εσωτερική αγορά ρυζιού
    που βρίσκεται στην κατοχή του ιταλικού οργανισμού
    παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1341/2001, annettu 3 päivänä heinäkuuta 2001,
    asetuksen (EY) N:o 169/2001 muuttamisesta ja pysyvän tarjouskilpailun avaamisesta
    Italian interventioelimen hallussa olevan 70000 riisitonnin jälleenmyymiseksi
    sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1341/2001 della Commissione, del 3 luglio 2001, che
    modifica il regolamento (CE) n. 169/2001 e porta a 70000 tonnellate la gara permanente
    per la rivendita sul mercato interno di riso detenuto dall'organismo d'intervento
    italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1341/2001 van de Commissie van 3 juli 2001 houdende
    wĳziging van Verordening (EG) nr. 169/2001 en houdende verhoging, tot 70000 ton,
    van de hoeveelheid rĳst uit de Italiaanse interventievoorraden waarvoor een permanente
    inschrĳving voor de verkoop op de interne markt gehouden wordt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1341/2001 da Comissão, de 3 de Julho de 2001, que
    altera o Regulamento (CE) n.° 169/2001 e eleva a 70000 toneladas a quantidade
    objecto do concurso permanente para a venda no mercado interno de arroz na posse
    do organismo de intervenção italiano
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1341/2001 de la Comisión, de 3 de julio de 2001, que
    modifica el Reglamento (CE) n° 169/2001 y aumenta a 70000 toneladas la licitación
    permanente para la reventa en el mercado interior de arroz que obra en poder del
    organismo de intervención italiano
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1341/2001 av den 3 juli 2001 om ändring
