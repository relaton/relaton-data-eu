title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3445/86 of 12 November 1986 laying down
    transitional measures to facilitate the passage from existing arrangements in
    Spain and Portugal to those applicable in the framework of the system of production
    aid as provided for in Regulation (EEC) No 426/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3445/86 de la Commission du 12 novembre 1986 portant
    mesures transitoires visant à faciliter le passage de la réglementation actuellement
    en vigueur en Espagne et au Portugal à la réglementation applicable dans le
    cadre du régime d' aide à la production prévu par le règlement (CEE) n° 426/86
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3445/86 der Kommission vom 12. November 1986 mit Übergangsmaßnahmen
    zur Erleichterung der Umstellung von den in Spanien und Portugal geltenden Regelungen
    auf die im Rahmen der Produktionsbeihilferegelung gemäß der Verordnung (EWG)
    Nr. 426/86 anwendbaren Vorschriften
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3445/86 af 12. november 1986 om overgangsforanstaltninger
    med henblik på at lette overgangen fra de nuværende arrangementer i Spanien
    og Portugal til dem, der gælder i forbindelse med producentstøtteordningen som
    fastsat i forordning (EØF) nr. 426/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3445/86 της Επιτροπής
    της 12ης Νοεμβρίου 1986 που καθορίζει μεταβατικά
    μέτρα για να διευκολυνθεί η μετάβαση από τις
    ισχύουσες διευθετήσεις στην Ισπανία και την
    Πορτογαλία σε εκείνες που εφαρμόζονται στα
    πλαίσια του συστήματος ενισχύσεως στην παραγωγή
    που προβλέπεται στον κανονισμό (ΕΟΚ) αριθ. 426/86
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3445/86 della Commissione del 12 novembre 1986 che
    stabilisce misure transitorie intese ad agevolare il passaggio dal regime attualmente
    in vigore in Spagna ed in Portogallo a quello applicabile nell' ambito del regime
    di aiuto alla produzione ai sensi del regolamento (CEE) n. 426/86
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3445/86 van de Commissie van 12 november 1986 houdende
    overgangsmaatregelen ter vergemakkelijking van de overgang van de bestaande regelingen
    in Spanje en Portugal naar die welke van toepassing zijn in het kader van de produktiesteunregeling
    waarin is voorzien bij Verordening (EEG) nr. 426/86
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3445/86 da Comissão de 12 de Novembro de 1986 que
    estabelece medidas transitórias para facilitar a passagem das disposições existentes
    em Espanha e em Portugal para as que se aplicam no âmbito do regime de ajuda
    à produção nos termos do Regulamento (CEE) n.° 426/86
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3445/86 de la Comisión de 12 de noviembre de 1986
    por el que se adoptan medidas transitorias para facilitar el tránsito de las
    regulaciones vigentes en España y en Portugal a las regulaciones aplicables en
    el marco del sistema de ayuda a la producción previsto por el Reglamento (CEE)
    n° 426/86
  type: main
