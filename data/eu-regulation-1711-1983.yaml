title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1711/83 of 24 June 1983 re-establishing
    the levying of customs duties on made-up accessories for articles of apparel,
    products of category 88 (code 0880), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1711/83 de la Commission du 24 juin 1983 portant rétablissement
    de la perception des droits de douane applicables aux autres accessoires confectionnés
    du vêtement, de la catégorie 88 (code 0880), originaires de l' Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1711/83 der Kommission vom 24. Juni 1983 über die
    Wiedereinführung des Zollsatzes für anderes konfektioniertes Bekleidungszubehör
    der Warenkategorie Nr. 88 (Kennziffer 0880), mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1711/83 af 24. juni 1983 om genindførelse
    af opkrævning af toldafgifter for konfektioneret tilbehør til beklædningsgenstande,
    under varekategori nr. 88 (kode 0880), som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1711/83 της Επιτροπής
    της 24ης Ιουνίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα έτερα
    έτοιμα συμπληρώματα του ενδύματος της κατηγορίας
    προϊόντων 88 (κωδικός αριθμός 0880), καταγωγής
    Ινδίας, δικαιούχου των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1711/83 della Commissione del 24 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli altri accessori confezionati
    per oggetti di vestiario, della categoria di prodotti n. 88 (codice 0880), originari
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1711/83 van de Commissie van 24 juni 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander geconfectioneerd
    kledingtoebehoren van de categorie van produkten nr. 88 (codenummer 0880) van
    oorsprong uit India waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
