type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1748/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on spoons, forks, fish-eaters, butter-knives, ladles
    and similar kitchen or tableware, of stainless steel, falling within subheading
    82.14 A, originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1748/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, pelles à tarte, couteaux spéciaux à poisson ou à beurre,
    pinces à sucre et articles similaires, en acier inoxydable, de la sous-position
    tarifaire 82.14 A, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1748/75 der Kommission vom 7. Juli 1975 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln, Tortenschaufeln, Fischmesser,
    Buttermesser, Zuckerzangen und ähnliche Tischgeräte, aus rostfreiem Stahl, der
    Tarifstelle 82.14 A, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1748/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskeknive, smørknive, potageskeer
    og lignende artikler til køkken og bordbrug, af rustfrit stål, under underposition
    82.14 A, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1748/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni,
    forchette, palette da torta, coltelli speciali da pesce o da burro, pinze da zucchero
    e oggetti simili, di acciaio inossidabile, della sottovoce doganale 82.14 A, originari
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie, previste
    dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1748/75 van de Commissie van 7 juli 1975 houdende
    wederinstelling van de heffing van de douanerechten voor lepels, pollepels, vorken,
    taartscheppen, vismessen en botermesjes, suikertangen en dergelijke artikelen,
    van roestvrij staal, van onderverdeling 82.14 A, van oorsprong uit de ontwikkelingslandenten
    behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974
    tariefpreferenties werden geopend
  type: main
