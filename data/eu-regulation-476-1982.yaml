title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 476/82 of 26 February 1982 specifying the
    extent to which applications lodged during the month of February 1982 for import
    licences in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 476/82 de la Commission, du 26 février 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de février 1982 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 476/82 der Kommission vom 26. Februar 1982 über das
    Ausmaß, in dem den im Februar 1982 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 476/82 af 26. februar 1982 om det omfang
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i februar
    1982 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 476/82 της Επιτροπής
    της 26ης Φεβρουαρίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, πού
    υποβλήθηκαν τον Φεβρουάριο του 1982, για τα νεαρά
    άρρενα βοοειδή πού προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 476/82 della Commissione, del 26 febbraio 1982, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1982 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 476/82 van de Commissie van 26 februari 1982 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in februari 1982
    ingediende aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
