    non nominate, della sottovoce 41.04 B II della tariffa doganale comune, originarie
    del Pakistan beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2648/81 van de Commissie van 11 september 1981 houdende
