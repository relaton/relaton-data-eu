title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2648/81 of 11 September 1981 re-establishing
    the levying of customs duties on other goat and kid skin leather, falling within
    subheading 41.04 B II and originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2648/81 de la Commission, du 11 septembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux peaux de
    caprins préparées, de la sous-position 41.04 B II du tarif douanier commun,
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2648/81 der Kommission vom 11. September 1981 zur
    Wiedereinführung der Erhebung der Zölle für Ziegen- und Zickelleder der Tarifstelle
    41.04 B II, mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3322/80
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2648/81 af 11. september 1981 om genindførelse
    af opkrævning af told for andet læder af gede- og gedekidskind, henhørende
    under pos. 41.04 B II og med oprindelse i Pakistan, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2648/81 τής Επιτροπής
    τής 11ης Σεπτεμβρίου 1981 περί αποκαταστάσεως
