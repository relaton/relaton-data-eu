title:
- language: en
  script: Latn
  content: '82/802/EEC: Commission Decision of 15 November 1982 establishing that
    the apparatus described as ''Beckman - Analytical Ultracentrifuge, model E'' may
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/802/CEE: Décision de la Commission, du 15 novembre 1982, constatant
    que l''importation de l''appareil dénommé "Beckman - Analytical Ultracentrifuge,
    model E" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/802/EWG: Entscheidung der Kommission vom 15. November 1982, mit der
    festgestellt wird, daß das Gerät ,,Beckman - Analytical Ultracentrifuge, model
    E" , unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/802/EØF: Kommissionens beslutning af 15. november 1982 om fastslåelse
    af, at indførsel af apparatet "Beckman - Analytical Ultracentrifuge, model E"
    kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/802/EOK: Απόφαση τής Επιτροπής τής 15ης Νοεμβρίου
