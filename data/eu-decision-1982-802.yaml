    μέ τήν ονομασία «Beckman - Analytical Ultracentrifuge, model E»
    δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/802/CEE: Decisione della Commissione, del 15 novembre 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Beckman - Analytical Ultracentrifuge,
    model E" può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/802/EEG: Beschikking van de Commissie van 15 november 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Beckman-Analytical Ultracentrifuge,
    model E" met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
