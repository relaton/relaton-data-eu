    ΕΚΑΧ καταγωγής Πορτογαλίας στην κοινοτική
    αγορά πλην της Ισπανίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 24 ottobre 1989 che fissa il livello delle
    forniture di prodotti siderurgici CECA di origine portoghese sul resto del mercato
    comunitario, Spagna esclusa (Il testo in lingua portoghese è il solo facente
    fede) (89/574/CECA) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 24 oktober 1989 tot vaststelling van
    de omvang van de leveranties van EGKS ijzer- en staalprodukten, van oorsprong
