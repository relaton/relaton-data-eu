  content: '89/574/ECSC: Commission Decision of 24 October 1989 establishing the delivery
    levels of ECSC steel products of Portuguese origin onto the rest of the Community
    market, excluding Spain (only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/574/CECA: Décision de la Commission du 24 octobre 1989 fixant le niveau
    des livraisons de produits sidérurgiques CECA d''origine portugaise sur le reste
    du marché communautaire, Espagne exclue (Le texte en langue portugaise est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 24. Oktober 1989 zur Festsetzung der für
    den übrigen Gemeinsamen Markt mit Ausnahme Spaniens bestimmten Lieferungen an
    EGKS-Stahlerzeugnissen portugiesischen Ursprungs (Nur der portugiesische Text
    ist verbindlich) (89/574/EGKS) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 24. oktober 1989 om fastsættelse af størrelsen
    af leverancerne af jern- og stålprodukter (EKSF) med oprindelse i Portugal til
    det øvrige fællesskabsmarked, bortset fra Spanien (Kun den portugisiske udgave
    er autentisk) (89/574/EKSF) #'
  type: main
- language: el
  script: Grek
