id: EURegulation17241973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1724/73 of the Commission of 28 June 1973 re-establishing
    Common Customs Tariff duties on equipment for parlour, table and funfair games
    for adults or children (including billiard tables and pintables and table-tennis
    requisites) falling within heading No 97.04, originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2762/72
    of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1724/73 de la Commission, du 28 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux articles pour jeux de société (y compris les jeux à moteur ou à mouvement
    pour lieux publics, les tennis de table, les billards-meubles et les tables spéciales
    pour jeux de casinos) de la position tarifaire 97.04, originaires de Hong Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1724/73 der Kommission vom 28. Juni 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Gesellschaftsspiele (einschließlich
    mechanische Spiele zur öffentlichen Benutzung, Billardtische, Glücksspieltische,
    Tischtennis) der Tarifnummer 97.04, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1724/73 af 28. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for selskabsspil (herunder spilleautomater
    og lignende spilleapparater, billard-borde, rouletborde og bordtennisrekvisitter)
    under position 97.04, som har oprindelse i Hong Kong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1724/73 della Commissione, del 28 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale applicabili agli oggetti
    per giuochi di società (compresi i giuochi meccanici, anche a motore, per pubblici
    esercizi, i tennis da tavolo, i bigliardi a forma di mobile ed i tavoli speciali
    per case da giuoco) della voce doganale n. 97.04 originari di Hong Kong beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio,
    del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1724/73 van de Commissie van 28 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op artikelen voor gezelschapsspellen (spellen met motor of met
    drijfwerk voor openbare gelegenheden, tafeltennisspellen, biljarten en speciale
    tafels voor casinospellen daaronder begrepen) van post 97.04, van oorsprong uit
    Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van
    19 december 1972 algemene tariefpreferenties werden geopend
  type: main
