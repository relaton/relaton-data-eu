title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2809/83 of 3 October 1983 imposing a definitive
    anti-dumping duty on certain imports of outboard motors originating in Japan and
    terminating the anti-dumping proceedings with regard to other imports of outboard
    motors originating in Japan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2809/83 du Conseil du 3 octobre 1983 instituant un
    droit anti-"dumping" définitif sur certaines importations de propulseurs spéciaux
    du type hors-bord originaires du Japon et clôturant la procédure anti-"dumping"
    concernant d' autres importations de propulseurs spéciaux du type hors-bord originaires
    du Japon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2809/83 des Rates vom 3. Oktober 1983 zur Erhebung
    eines endgültigen Antidumpingzolls auf bestimmte Einfuhren von Außenbordmotoren
    mit Ursprung in Japan und zur Beendigung des Antidumpingverfahrens in bezug auf
    andere Einfuhren von Außenbordmotoren mit Ursprung in Japan
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2809/83 af 3. oktober 1983 om indførelse
    af en endelig antidumpingtold på importen af visse påhængsmotorer med oprindelse
    i Japan og om afslutning af proceduren med hensyn til importen af andre påhængsmotorer
    med oprindelse i Japan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2809/83 του Συμβουλίου
    της 3ης Οκτωβρίου 1983 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ σε ορισμένες εισαγωγές
    ειδικών προωστήρων εξωλέμβιου τύπου, καταγωγής
    Ιαπωνίας, και την περάτωση της διαδικασίας
    αντιντάμπινγκ σχετικά με άλλες εισαγωγές ειδικών
    προωστήρων εξωλέμβιου τύπου, καταγωγής Ιαπωνίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2809/83 del Consiglio del 3 ottobre 1983 che istituisce
    un dazio antidumping definitivo su talune importazioni di motori fuoribordo originari
    del Giappone e che conclude la procedura antidumping relativa ad altre importazioni
    di motori fuoribordo originari del Giappone
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2809/83 van de Raad van 3 oktober 1983 houdende instelling
    van een definitief anti-dumpingrecht op de invoer van bepaalde buitenboordmotoren
    van oorsprong uit Japan en beëindiging van de anti-dumpingprocedure met betrekking
    tot de invoer van andere buitenboordmotoren van oorsprong uit Japan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2809/83 do Conselho, de 3 de Outubro de 1983, que
    institui um direito "anti-dumping" definitivo sobre certas importações de motores
    fora de bordo originários do Japão e que encerra o processo "anti-dumping" relativamente
    a outras importações de motores fora de bordo originários do Japão
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2809/83 del Consejo, de 3 de octubre de 1983, por
    el que se establece un derecho antidumping definitivo sobre determinadas importaciones
    de propulsores especiales del tipo fuera borda originarios de Japón y por el
    que se cierra el procedimiento antidumping relativo a otras importaciones de propulsores
    especiales del tipo fuera borda originarios de Japón
