    μέτρων σχετικών με την ενεργοποίηση τηης γεωργικής
    συμφωνίας του Γύρου της Ουρουγουάης που εφαρμόζονται
    κατά την εξαγωγή γεωργικών προϊόντων υπό μορφή
    εμπορευμάτων μη υπαγομένων στο παράρτημα ΙΙ
