    Übereinkommens über die Landwirtschaft auf die Ausfuhr landwirtschaftlicher
    Erzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden Waren und
    zur Änderung der Verordnung (EG) Nr. 2476/94
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1268/95 af 2. juni 1995 om overgangsforanstaltninger
