    siirtymäkauden toimenpiteistä, joita sovelletaan perustamissopimuksen liitteeseen
    II kuulumattomien tavaroiden muodossa vietyihin maataloustuotteisiin, ja asetuksen
    (EY) N:o 2476/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1268/95 della Commissione, del 2 giugno 1995, che stabilisce
    talune misure transitorie relative all'attuazione dell'accordo agricolo dell'Uruguay
    Round applicabili all'esportazione di prodotti agricoli sotto forma di merci non
    comprese nell'allegato II del trattato e che modifica il regolamento (CE) n. 2476/94
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1268/95 van de Commissie van 2 juni 1995 tot vaststelling
