title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1268/95 of 2 June 1995 laying down certain
    transitional measures concerning the implementation of the Uruguay Round Agreement
    on Agriculture applicable to agricultural products exported in the form of goods
    not covered by Annex II to the Treaty and modifying Regulation (EC) No 2476/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1268/95 de la Commission, du 2 juin 1995, portant certaines
    mesures transitoires relatives à la mise en oeuvre de l'accord agricole du cycle
    d'Uruguay applicables à l'exportation de produits agricoles sous forme de marchandises
    ne relevant pas de l'annexe II du traité et modifiant le règlement (CE) n 2476/94
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1268/95 der Kommission vom 2. Juni 1995 über bestimmte
