title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2024/232 of 25 October 2023 amending
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for cadmium and lead in plastic profiles in electrical and electronic
    windows and doors containing recovered rigid polyvinyl chloride
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2024/232 de la Commission du 25 octobre 2023
    modifiant la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption relative au cadmium et au plomb dans les profilés en matière
    plastique contenant du polychlorure de vinyle rigide valorisé destinés à la
    fabrication de portes et fenêtres électriques et électroniques
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2024/232 der Kommission vom 25. Oktober 2023
    zur Änderung der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates
    hinsichtlich einer Ausnahme für Cadmium und Blei in Kunststoffprofilen für elektrische
    und elektronische Fenster und Türen mit wiedergewonnenem Hart-Polyvinylchlorid
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2024/232 на Комисията
