    pre kadmium a olovo v plastových profiloch v elektrických a elektronických
    oknách a dverách s obsahom zhodnoteného tvrdeného polyvinylchloridu
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2024/232 z dne 25. oktobra 2023 o spremembi
