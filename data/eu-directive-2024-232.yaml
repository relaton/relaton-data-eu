    2011/65/ЕС на Европейския парламент и на Съвета
    по отношение на освобождаване от ограничението
    за кадмий и олово в пластмасови профили в електрически
    и електронни прозорци и врати, съдържащи оползотворен
    твърд поливинилхлорид
  type: main
- language: cs
  script: Latn
