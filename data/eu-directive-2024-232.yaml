    jde o výjimku pro kadmium a olovo v plastových profilech elektrických a elektronických
    oken a dveří obsahujících recyklovaný tvrdý polyvinylchlorid
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2024/232 af 25. oktober 2023 om
    ændring af Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår
    en undtagelse for cadmium og bly i plastprofiler i elektriske og elektroniske
    vinduer og døre, der indeholder nyttiggjort hård polyvinylchlorid
  type: main
- language: el
  script: Grek
