    ta’ eżenzjoni għall-kadmju u ċ-ċomb fil-profili tal-plastik fit-twieqi u
    fil-bibien elettriċi u elettroniċi li jkun fihom il-klorur tal-polivinil riġidu
    rkuprat
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2024/232 van de Commissie van 25 oktober 2023
