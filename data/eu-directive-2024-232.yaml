    en elektronische ramen en deuren die teruggewonnen polyvinylchloride bevatten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2024/232 z dnia 25 października 2023
    r. zmieniająca dyrektywę Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu
    do wyłączenia dotyczącego kadmu i ołowiu w profilach z tworzyw sztucznych
    wykorzystywanych w elektrycznych i elektronicznych oknach i drzwiach i zawierających
    twardy polichlorek winylu (PVC) z odzysku
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2024/232 da Comissão, de 25 de outubro de 2023,
