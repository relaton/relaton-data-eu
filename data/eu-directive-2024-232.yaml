    a uma isenção aplicável à utilização de cádmio e de chumbo em perfis de
    plástico de janelas e portas elétricas e eletrónicas que contenham poli(cloreto
    de vinilo) rígido recuperado
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2024/232 a Comisiei din 25 octombrie 2023 de modificare
    a Directivei 2011/65/UE a Parlamentului European și a Consiliului în ceea ce
    privește o derogare pentru cadmiul și plumbul utilizat în profilurile de plastic
    ale ferestrelor și ușilor electrice și electronice care conțin clorură de
    polivinil rigidă recuperată
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2024/232 z 25. októbra 2023, ktorou
