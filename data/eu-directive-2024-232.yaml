    in svinca v plastičnih profilih električnih in elektronskih oken in vrat, ki
    vsebujejo predelan trdi polivinilklorid
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2024/232 de la Comisión, de 25 de octubre de 2023,
