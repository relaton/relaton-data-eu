    és elektronikus ablakok és ajtók újrahasznosított kemény polivinil-kloridot
    tartalmazó műanyag profiljaiban előforduló kadmiumra és ólomra megadott
    mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2024/232 della Commissione, del 25 ottobre 2023,
    che modifica la direttiva 2011/65/UE del Parlamento europeo e del Consiglio per
    quanto riguarda l’esenzione relativa al cadmio e al piombo nei profili in plastica
    contenenti cloruro di polivinile rigido recuperato utilizzati per finestre e porte
    elettriche ed elettroniche
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2024/232 (2023. gada 25. oktobris),
    ar ko Eiropas Parlamenta un Padomes Direktīvu 2011/65/ES groza attiecībā uz
    atbrīvojumu kadmija un svina izmantošanai tādu elektrisko un elektronisko logu
    un durvju plastmasas profilos, kas satur reģenerētu cieto polivinilhlorīdu
  type: main
- language: lt
  script: Latn
  content: 2023 m. spalio 25 d. Komisijos deleguotoji direktyva (ES) 2024/232, kuria
    dėl išimties, kuria elektrinių ir elektroninių langų ir durų plastikiniuose
    profiliuose, kurių sudėtyje yra regeneruoto standžiojo polivinilchlorido, leidžiama
    naudoti kadmį ir šviną, iš dalies keičiama Europos Parlamento ir Tarybos
    direktyva 2011/65/ES
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2024/232 tal-25 ta’ Ottubru 2023
