title:
- language: en
  script: Latn
  content: '80/164/EEC: Commission Decision of 18 January 1980 authorizing the United
    Kingdom not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, falling within heading No 60.02 of the
    Common Customs Tariff (NIMEXE codes 60.02-40, 50, 60, 70, 80) (categories 10 and
    11), originating in the People''s Republic of China and in free circulation in
    the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/164/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    le Royaume-Uni à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée, de la position 60.02 du tarif douanier commun
    (codes Nimexe: 60.02-40, 50, 60, 70, 80) (catégories 10 et 11), originaire de
    la République populaire de Chine et mise en libre pratique dans les autres États
    membres (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/164/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der das
    Vereinigte Königreich ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus
    Gewirken, weder gummielastisch noch kautschutiert, der Tarifnummer 60.02 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 60.02-40, 50, 60, 70, 80), Kategorien 10 und 11,
    von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/164/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage handsker,
    vanter og luffer af trikotage, ikke elastisk eller gummeret, som henhører under
    pos. 60.02 i den fælles toldtarif (NIMEXE-nummer 60.02-40, 50, 60, 70, 80; kategori
    10 og 11), har oprindelse i Den kinesiske Folkerepublik og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/164/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario guanti a maglia non elastica
    né gommata, della voce n. 60.02 della tariffa doganale comune (codici Nimexe:
    60.02-40, 50, 60, 70, 80) categorie 10 e 11, originari della Repubblica popolare
    cinese e messi in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/164/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij het
    Verenigd Koninkrijk wordt gemachtigd handschoenen, wanten en dergelijke artikelen,
    van niet- elastisch of van niet-gegummeerd brei- of haakwerk, van post 60.02 van
    het gemeenschappelijk douanetarief (NIMEXE-code 60.02-40, 50, 60, 70, 80) (categorieën
    10 en 11), van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
