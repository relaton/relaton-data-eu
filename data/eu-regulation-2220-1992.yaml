title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2220/92 of 30 July 1992 derogating from
    the detailed rules for the application of compulsory distillation as regards table
    wine in respect of the 1991/92 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2220/92 de la Commission, du 30 juillet 1992, portant
    mesure dérogatoire pour la campagne 1991/1992 en matière de livraison par les
    producteurs de leurs quantités de vin de table à livrer à la distillation obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2220/92 der Kommission vom 30. Juli 1992 mit einer
    im Wirtschaftsjahr 1991/92 abweichenden Maßnahme bezüglich des von den Erzeugern
    zur obligatorischen Destillation zu liefernden Tafelweins
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2220/92 af 30. juli 1992 om undtagelsesbestemmelser
    for produktionsåret 1991/92 om producenters levering af bordvin til obligatorisk
    destillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2220/92 της Επιτροπής
    της 30ής Ιουλίου 1992 για τη θέσπιση μέτρου παρέκκλισης
    για την περίοδο εμπορίας 1991/92 στον τομέα της
    παράδοσης από τους παραγωγούς των ποσοτήτων
    επιτραπέζιου οίνου τους οποίους πρέπει να
    παραδώσουν στην υποχρεωτική απόσταξη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2220/92 della Commissione, del 30 luglio 1992, recante
    deroga, per la campagna 1991/1992, in ordine alle consegne di vino da tavola conferito
    dai produttori per la distillazione obbligatoria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2220/92 van de Commissie van 30 juli 1992 tot vaststelling
    van een afwijking voor het wijnoogstjaar 1991/1992 inzake de levering door de
    producenten van de in het kader van de verplichte distillatie te leveren hoeveelheden
    tafelwijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2220/92 da Comissão, de 30 de Julho de 1992, que
    estabelece uma medida derrogatória para a campanha de 1991/1992 eml matéria
    de entrega pelos produtores de vinhos de mesa para destilação obrigatória
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2220/92 de la Comisión, de 30 de julio de 1992, por
    el que se establece una excepción relativa a la entrega por parte de los productores
    de cantidades de vino de mesa con destino a la destilación obligatoria durante
    la campaña 1991/92
  type: main
