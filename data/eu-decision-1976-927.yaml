id: EUDecision1976927
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 November 1976 authorizing the United Kingdom
    not to apply Community treatment to unbleached and bleached yarn of synthetic
    textile fibres (polyester/cotton) falling within subheading 56.07 ex A of the
    Common Customs Tariff, originating in the Republic of Korea and in free circulation
    in the Netherlands
  type: main
- language: fr
  script: Latn
  content: '76/927/CEE: Décision de la Commission, du 11 novembre 1976, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tissus écrus et blanchis
    de fibres textiles synthétiques (polyester/coton), de la position 56.07 Ex A
    du Tarif douanier commun, originaires de la République de Corée et mis en libre
    pratique aux Pays- Bas'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. November 1976, mit der das Vereinigte
    Königreich ermächtigt wird, aus der Republik Korea stammende und in den Niederlanden
    im freien Verkehr befindliche rohe und gebleichte Gewebe aus synthetischen Spinnfasern
    (Polyester/Baumwolle) der Tarifstelle 56.07 ex A des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 11. november 1976 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage vævet stof af syntetiske
    fibre, ubleget eller bleget, (polyester/bomuld), som henhører under pos. 56.07
    ex A i den fælles toldtarif, har oprindelse i republikken Korea og frit kan omsættes
    i Nederlandene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 novembre 1976, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario i tessuti grezzi e sbiancati di
    fibre tessili sintetiche (poliesteri/cotone) di cui alla voce 56.07 ex A della
    tariffa doganale comune, originari della Repubblica di Corea e messi in libera
    pratica nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 november 1976 waarbij het Verenigd
    Koninkrijk wordt gemachtigd ongebleekte en gebleekte weefsels van synthetische
    vezels (polyester/katoen), van post 56.07 ex A van het gemeenschappelijk douanetarief,
    van oorsprong uit de Republiek Korea en in Nederland in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
