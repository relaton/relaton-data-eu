title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 265/78 of 7 February 1978 making the importation
    into the Community of textile products originating in certain third countries
    subject to common rules for authorization and quantitative limitation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 265/78 du Conseil, du 7 février 1978, soumettant
    à un régime commun d'autorisation et de limitation quantitative les importations,
    dans la Communauté, de produits textiles originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 265/78 des Rates vom 7. Februar 1978, mit der die
    Einfuhr von Textilwaren mit Ursprung in bestimmten Drittländern in die Gemeinschaft
    einer Genehmigungspflicht und einer Höchstmengenregelung unterworfen wird
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 265/78 af 7. februar 1978 om indførelse
    af en fælles ordning for bevillinger og kvantitative begrænsninger for indførsel
    i Fællesskabet af tekstilvarer med oprindelse i visse tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 265/78 del Consiglio, del 7 febbraio 1978, che subordina
    l'importazione nella Comunità di prodotti tessili originari di taluni paesi terzi
    ad un regime comune di autorizzazione e di limitazione quantitativa
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 265/78 van de Raad van 7 februari 1978 waarbij de
    invoer in de Gemeenschap van textielprodukten van oorsprong uit bepaalde derde
    landen aan een gemeenschappelijke regeling van invoervergunningen en kwantitatieve
    maxima wordt onderworpen
  type: main
