title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 778/78 of 18 April 1978 re-establishing
    the levying of customs duties on sacks and bags, of a kind used for the packing
    of goods, of other textile materials, falling within subheading 62.03 ex B and
    originating in developing countries, to which the preferential tariff arrangements
    set out in Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 778/78 de la Commission, du 18 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux sacs et
    sachets d'emballage, en tissus d'autres matières textiles, de la sous- position
    tarifaire 62.03 EX B, originaires des pays et territoires en voie de développement,
    bénéficiaires de préférences tarifaires prévues par le règlement (CEE) n°
    2706/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 778/78 der Kommission vom 18. April 1978 zur Wiedereinführung
    des Zollsatzes für Säcke und Beutel zu Verpackungszwecken, aus Geweben aus anderen
    Spinnstoffen, der Tarifstelle 62.03 ex B, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 778/78 af 18. april 1978 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage, af andre tekstilmaterialer,
    under underposition 62.03 ex B, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 778/78 della Commissione, del 18 aprile 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai sacchi e sacchetti
    da imballaggio, di tessuti di altre materie tessili, della sottovoce doganale
    62.03 ex B, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 778/78 van de Commissie van 18 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zakken voor
    verpakkingsdoeleinden, van weefsel van andere textielstoffen, van post 62.03 ex
    B, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2706/77 van de Raad tariefpreferenties werden geopend
  type: main
