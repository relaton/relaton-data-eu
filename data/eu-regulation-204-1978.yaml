title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 204/78 of 31 January 1978 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 204/78 du Conseil, du 31 janvier 1978, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 204/78 des Rates vom 31. Januar 1978 zur Festlegung
    von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    gegenüber Schiffen, welche die Flagge Spaniens führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 204/78 af 31. januar 1978 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører Spaniens flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 204/78 del Consiglio, del 31 gennaio 1978, che stabilisce
    talune misure provvisorie per la conservazione e la gestione delle risorse ittiche
    da applicare alle navi battenti bandiera della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 204/78 van de Raad van 31 januari 1978 tot vaststelling
    van bepaalde overgangsmaatregelen voor de instandhouding en het beheer van de
    visbestanden, die van toepassing zijn op vaartuigen die de vlag van Spanje voeren
  type: main
