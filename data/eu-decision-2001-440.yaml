    uznávají za prosté Xanthomonas campestris (všech kmenů patogenních pro Citrus),
    Cercospora angolensis Carv. et Mendes a Guignardia citricarpa Kiely (všech kmenů
    patogenních pro Citrus) (oznámeno pod číslem K(2001) 1484)
  type: main
