title:
- language: en
  script: Latn
  content: '2001/440/EC: Commission Decision of 29 May 2001 amending Decision 98/83/EC
    recognising certain third countries and certain areas of third countries as being
    free of Xanthomonas campestris (all strains pathogenic to Citrus), Cercospora
    angolensis Carv. et Mendes and Guignardia citricarpa Kiely (all strains pathogenic
    to Citrus) (notified under document number C(2001) 1484)'
  type: main
- language: fr
  script: Latn
  content: '2001/440/CE: Décision de la Commission du 29 mai 2001 modifiant la décision
    98/83/CE reconnaissant certains pays tiers et certaines régions de pays tiers
    comme indemnes de Xanthomonas campestris (toutes les souches pathogènes aux Citrus),
    Cercospora angolensis Carv. et Mendes ou Guignardia citricarpa Kiely (toutes les
    souches pathogènes aux Citrus) [notifiée sous le numéro C(2001) 1484]'
  type: main
- language: de
  script: Latn
  content: '2001/440/EG: Entscheidung der Kommission vom 29. Mai 2001 zur Änderung
    der Entscheidung 98/83/EG zur Anerkennung mehrerer Drittländer und Gebiete von
    Drittländern als frei von Xanthomonas campestris (für Citrus pathogene Stämme),
    Cercospora angolensis Carv. et Mendes und Guignardia citricarpa Kiely (für Citrus
    pathogene Stämme) (Bekannt gegeben unter Aktenzeichen K(2001) 1484)'
  type: main
