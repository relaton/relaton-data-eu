title:
- language: en
  script: Latn
  content: '2000/236/EC: Commission Decision of 22 March 2000 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorise
    imports of bovine animals, swine, equidae, sheep and goats, fresh meat and meat
    products (notified under document number C(2000) 815'
  type: main
- language: fr
  script: Latn
  content: '2000/236/CE: Décision de la Commission, du 22 mars 2000, modifiant la
    décision 79/542/CEE du Conseil établissant une liste de pays tiers en provenance
    desquels les États membres autorisent les importations d''animaux des espèces
    bovine et porcine, d''équidés, d''ovins et de caprins, de viandes fraîches
    et de produits à base de viande [notifiée sous le numéro C(2000) 815]'
  type: main
- language: de
  script: Latn
