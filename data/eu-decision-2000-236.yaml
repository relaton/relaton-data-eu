    aus denen die Mitgliedstaaten Einfuhren von Rindern, Schweinen, Einhufern, Schafen
    und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen zulassen (Bekanntgegeben
    unter Aktenzeichen K(2000) 815)'
  type: main
- language: da
  script: Latn
