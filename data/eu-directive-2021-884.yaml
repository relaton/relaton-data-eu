id: EUDirective2021884
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2021/884 of 8 March 2021 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    the validity period of an exemption for the use of mercury in electric rotating
    connectors used in intravascular ultrasound imaging systems
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2021/884 de la Commission du 8 mars 2021 modifiant,
    aux fins de son adaptation au progrès scientifique et technique, l’annexe IV
    de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    la période de validité d’une exemption relative à l’utilisation du mercure
    dans les collecteurs électriques tournants équipant les systèmes d’imagerie
    intravasculaire ultrasonore
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2021/884 der Kommission vom 8. März 2021 zur
    Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich der Geltungsdauer einer Ausnahme für die Verwendung von
    Quecksilber in elektrischen Drehübertragern in intravaskulären Ultraschallbildgebungssystemen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2021/884 на Комисията
    от 8 март 2021 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение IV към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на срока
    на валидност на освобождаването за употребата
    на живак в електрически ротационни съединители
    за интраваскуларно ултразвуково образно изследване
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2021/884 ze dne 8. března
    2021, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o dobu platnosti výjimky pro použití rtuti v otáčecích elektrických
    konektorech používaných v systémech intravaskulárního ultrazvukového obrazového
    snímání
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2021/884 af 8. marts 2021 om ændring,
    med henblik på tilpasning til den videnskabelige og tekniske udvikling, af bilag
    IV til Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår
    gyldighedsperioden for en undtagelse for brugen af kviksølv i elektriske roterende
    connectorer i systemer til intravaskulær ultralydbilleddannelse
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2021/884 της
    Επιτροπής της 8ης Μαρτίου 2021 για την τροποποίηση,
    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά την περίοδο ισχύος
    μιας εξαίρεσης για τη χρήση υδραργύρου σε ηλεκτρικά
    περιστρεφόμενα εξαρτήματα σύνδεσης που χρησιμοποιούνται
    σε συστήματα ενδοφλέβιας υπερηχογραφικής
    απεικόνισης
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2021/884, 8. märts 2021, millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, milles käsitletakse elavhõbeda
    kasutamist elektrilistes pöördliitmikes, mida kasutatakse intravaskulaarse ultrahelidiagnostika
    süsteemides
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2021/884, annettu 8 päivänä maaliskuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen elohopean käyttöä sähköisissä
    pyörintäliittimissä suonensisäisen ultraäänikuvauksen järjestelmissä koskevan
    poikkeuksen voimassaoloajan osalta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2021/884 ón gCoimisiún an 8 Márta 2021 lena leasaítear,
    chun í a chur in oiriúint don dul chun cinn eolaíoch agus teicniúil, Iarscríbhinn
    IV a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus ón gComhairle
    a mhéid a bhaineann le tréimhse bhailíochta díolúine maidir le mearcair a
    úsáid i nascóirí rothlacha leictreacha a úsáidtear i gcórais íomháithe
    ultrafhuaime ionsoithíche
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/884 оd 8. ožujka 2021. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu razdoblja valjanosti za izuzeće za uporabu
    žive u električnim zakretnim konektorima koji se upotrebljavaju u sustavima
    za intravaskularno ultrazvučno snimanje
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/884 felhatalmazáson alapuló irányelve (2021.
    március 8.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítása céljából,
    az intravaszkuláris ultrahangos képalkotó rendszerek elektromos forgóérintkezőiben
    használt higanyra vonatkozó mentesség érvényességi időszakának tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2021/884 della Commissione dell’8 marzo 2021
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato IV
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    il periodo di validità dell’esenzione relativa all’uso di mercurio nei connettori
    elettrici rotanti presenti nei dispositivi medici per l’imaging ad ultrasuoni
    intravascolare
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2021/884 (2021. gada 8. marts), ar
    ko attiecībā uz termiņu, uz kādu piešķir atbrīvojumu dzīvsudraba izmantošanai
    elektriskos rotējošos savienotājos, kurus izmanto intravaskulārās ultraskaņas
    attēlveidošanas sistēmās, groza Eiropas Parlamenta un Padomes Direktīvas
    2011/65/ES IV pielikumu, lai to pielāgotu zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2021/884 2021 m. kovo 8 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties, kuria gyvsidabrį
    leidžiama naudoti intravaskulinių ultragarsinio vaizdavimo sistemų elektrinėse
    sukamosiose jungtyse, iš dalies keičiamas Europos Parlamento ir Tarybos direktyvos
    2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2021/884 tat-8 ta’ Marzu 2021
    li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-merkurju f’konnetturi elettriċi rotanti użati
    f’sistemi ta’ immaġnijiet intravaskulari ultrasonori
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2021/884 van de Commissie van 8 maart 2021
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft de geldigheidsperiode van een vrijstelling voor het gebruik
    van kwik in systemen voor intravasculaire echografie
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2021/884 z dnia 8 marca 2021 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik IV do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do okresu obowiązywania
    wyłączenia dotyczącego stosowania rtęci w elektrycznych złączach obrotowych
    w wyrobach medycznych do wewnątrznaczyniowego obrazowania ultrasonograficznego
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2021/884 da Comissão de 8 de março de 2021 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante ao
    prazo de validade de uma isenção aplicável à utilização de mercúrio em
    conectores elétricos rotativos utilizados em sistemas de imagiologia de ultrassom
    intravascular capazes de funcionar a alta frequência
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2021/884 a Comisiei din 8 martie 2021 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei IV la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește perioada
    de valabilitate a unei derogări pentru utilizarea mercurului în conectorii electrici
    rotativi folosiți în sistemele de imagistică cu ultrasunete pentru analiză
    intravasculară
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2021/884 z 8. marca 2021, ktorou sa
    na účely prispôsobenia vedeckému a technickému pokroku mení príloha IV
    k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o predĺženie
    obdobia platnosti výnimky týkajúcej sa používania ortuti v rotačných elektrických
    konektoroch v zdravotníckych pomôckach na intravaskulárne ultrazvukové zobrazenie
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/884 z dne 8. marca 2021 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede obdobja
    veljavnosti izjeme za uporabo živega srebra v električnih vrtečih se konektorjih,
    ki se uporabljajo v sistemih intravaskularnega ultrazvočnega slikanja, zaradi
    prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2021/884 de la Comisión de 8 de marzo de 2021
    que modifica, para adaptarlo al progreso científico y técnico, el anexo IV de
    la Directiva 2011/65/UE del Parlamento Europeo y del Consejo en lo relativo al
    período de validez de una exención para el uso de mercurio en conectores rotatorios
    eléctricos empleados en los sistemas de obtención de imágenes de ultrasonido
    intravascular
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2021/884 av den 8 mars 2021 om ändring,
    för anpassning till den vetenskapliga och tekniska utvecklingen, av bilaga IV
    till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller giltighetstiden
    för ett undantag för användning av kvicksilver i elektriska roterande kontaktdon
    i system för intravaskulär ultraljudsavbildning
