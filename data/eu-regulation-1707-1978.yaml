title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1707/78 of 18 July 1978 derogating, for certain
    products coming from Malta, from the Protocol to the Agreement establishing an
    association between the European Economic Community and Malta concerning the definition
    of the concept of "originating products" and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1707/78 du Conseil, du 18 juillet 1978, portant dérogation,
    pour certains produits provenant de Malte, au protocole à l'accord créant une
    association entre la Communauté économique européenne et Malte, relatif à
    la définition de la notion de produits originaires et aux méthodes de coopération
    administrative
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1707/78 des Rates vom 18. Juli 1978 zur bestimmte
    Waren mit Herkunft aus Malta betreffenden Abweichung vom Protokoll über die Bestimmung
    des Begriffs "Waren mit Ursprung in ..." oder "Ursprungswaren" und über die Methoden
    der Zusammenarbeit der Verwaltungen zum Abkommen zur Gründung einer Assoziation
    zwischen der Europäischen Wirtschaftsgemeinschaft und Malta
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1707/78 af 18. juli 1978 om undtagelse, for
    så vidt angår visse varer fra Malta, fra den til aftalen om oprettelse af en
    associering mellem Det europæiske økonomiske Fællesskab og Malta knyttede protokol
    angående definitionen af begrebet »varer med oprindelsesstatus« og angående
    metoderne for administrativt samarbejde
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1707/78 del Consiglio, del 18 luglio 1978, recante
    deroga, per taluni prodotti provenienti da Malta, al protocollo dell'accordo che
    istituisce una associazione tra la Comunità economica europea e Malta, relativo
    alla definizione della nozione di «prodotti originari» ed ai metodi di cooperazione
    amministrativa
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1707/78 van de Raad van 18 juli 1978 houdende afwijking
    voor bepaalde produkten uit Malta, van het Protocol betreffende de definitie van
    het begrip "produkten van oorsprong" en betreffende de methoden van administratieve
    samenwerking bij de Overeenkomst waarbij een associatie tot stand wordt gebracht
    tussen de Europese Economische Gemeenschap en Malta
  type: main
