  script: Latn
  content: Council Directive 91/173/EEC of 21 March 1991 amending for the ninth time
    Directive 76/769/EEC on the approximation of the laws, regulations and administrative
    provisions of the Member States relating to restrictions on the marketing and
    use of certain dangerous substances and preparations
  type: main
- language: fr
  script: Latn
