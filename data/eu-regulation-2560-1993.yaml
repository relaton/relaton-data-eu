  content: COMMISSION REGULATION (EEC) No 2560/93 of 16 September 1993 re-establishing
    the levying of customs duties on products of category 4 (order No 40.0040), originating
    in Sri Lanka, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
