    40.0040) mit Ursprung in Sri Lanka, für die die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2560/93 af 16. september 1993 om genindførelse
