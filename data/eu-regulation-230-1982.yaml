title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 230/82 of 29 January 1982 determining to
    what extent applications for import licences lodged during the first quarter of
    1982 for high-quality fresh, chilled or frozen beef and veal can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 230/82 de la Commission, du 29 janvier 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposés pendant le premier trimestre de 1982 pour les viandes bovines de haute
    qualité, fraîches, réfrigérées ou congelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 230/82 der Kommission vom 29. Januar 1982 zur Bestimmung
    des Maßstabs für die Genehmigung der während des ersten Vierteljahres 1982
    eingereichten Anträge auf Einfuhrlizenzen für frisches, gekühltes oder gefrorenes
    Qualitätsrindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 230/82 af 29. januar 1982 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indgivet i første
    kvartal af 1982 for oksekød af høj kvalitet, fersk, kølet eller frosset, kan
    imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 230/82 της Επιτροπής
    της 29ης Ιανουαρίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, πού
    έχουν υποβληθεί κατά το πρώτο τρίμηνο του 1982,
    για βόειο κρέας υψηλής ποιότητος, νωπό, διατηρημένο
    με απλή ψύξη η κατεψυγμένο
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 230/82 della Commissione, del 29 gennaio 1982, che
    determina in quale misura possono essere accolte le domande di titoli d'importazione
    presentate durante il primo trimestre 1982 per le carni bovine di qualità pregiate,
    fresche, refrigerate o congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 230/82 van de Commissie van 29 januari 1982 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de certificaataanvragen die gedurende
    het eerste kwartaal van 1982 zijn ingediend voor de invoer van vers, gekoeld of
    bevroren kwaliteitsrundvlees
  type: main
