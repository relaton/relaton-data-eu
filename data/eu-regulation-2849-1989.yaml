    από συνθετικές ίνες μη συνεχείς, της κατηγορίας
    προϊόντων αριθ. 3 ( αύξων αριθμός 40.0033 ), καταγωγής
    Ινδίας, δικαιούχου των προβλεπόμενων από τον
