title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2849/89 of 22 September 1989 re-establishing
    the levying of customs duties on woven fabrics of synthetic fibres (staple or
    waste), products of category 3 (order No 40.0033), originating in India to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2849/89 de la Commission du 22 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres synthétiques discontinues, de la catégorie de produits n 3 (numéro d'ordre
    40.0033), originaires de l'Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2849/89 DER KOMMISSION vom 22. September 1989 zur
    Wiedereinführung des Zollsatzes für Gewebe aus synthetischen Spinnfasern der
    Warenkategorie Nr. 3 (lfd. Nr. 40.0033) mit Ursprung in Indien, dem die in der
    Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2849/89 af 22. september 1989 om genindførelse
    af opkrævning af toldafgifter forvævet stof af korte syntetiske fibre under
    varekategori nr. 3 (løbenummer 40.0033), som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
