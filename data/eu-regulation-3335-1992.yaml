  script: Latn
  content: Regolamento (CEE) n. 3335/92 della Commissione, del 18 novembre 1992, che
    fissa i tassi rappresentativi del mercato da applicare a taluni importi nel quadro
    della politica agricola comune, in particolare per il calcolo degli importi compensativi
    monetari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3335/92 van de Commissie van 18 november 1992 tot
