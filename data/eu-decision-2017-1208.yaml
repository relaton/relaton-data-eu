title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1208 of 4 July 2017 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified cotton GHB119 (BCS-GHØØ5-8) pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council on genetically modified
    food and feed (notified under document C(2017) 4457)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1208 de la Commission du 4 juillet 2017
    autorisant la mise sur le marché de produits contenant du coton génétiquement
    modifié GHB119 (BCS-GHØØ5-8), consistant en ce coton ou produits à partir
    de celui-ci, en application du règlement (CE) n° 1829/2003 du Parlement européen
    et du Conseil concernant les denrées alimentaires et les aliments pour animaux
    génétiquement modifiés [notifiée sous le numéro C(2017) 4457]
