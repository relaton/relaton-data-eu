    ihr gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates über genetisch veränderte Lebensmittel und Futtermittel
    (Bekannt gegeben unter Aktenzeichen C(2017) 4457)
