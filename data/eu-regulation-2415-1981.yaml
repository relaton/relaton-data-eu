title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2415/81 of 21 August 1981 re-establishing
    the levying of customs duties on carbonates of sodium, falling within subheading
    28.42 A II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2415/81 de la Commission, du 21 août 1981, portant
    rétablissement de la perception des droits de douane applicables aux carbonates
    de sodium, de la sous-position 28.42 A II du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2415/81 der Kommission vom 21. August 1981 zur Wiedereinführung
    der Erhebung der Zölle für Natriumcarbonate der Tarifstelle 28.42 A II mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2415/81 af 21. august 1981 om genindførelse
    af opkrævning af told for carbonater af natrium henhørende under pos. 28.42
    A II og med oprindelse i Rumænien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2415/81 τής Επιτροπής
    τής 21ης Αυγούστου 1981 περί αποκαταστάσεως τής
    εφαρμογής δασμών γιά τά ανθρακικά άλατα νατρίου
    τής δασμολογικής διακρίσεως 28. 42 Α ΙΙ καταγωγής
    Ρουμανίας, δικαιούχου τών προβλεπομένων από
    τόν κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2415/81 della Commissione, del 21 agosto 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai carbonati di sodio,
    della sottovoce 28.42 A II della tariffa doganale comune, originari della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2415/81 van de Commissie van 21 augustus 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op natriumcarbonaten,
    van postonderverdeling 28.42 A II, van oorsprong uit Roemenië, waarvoor de in
    Verordening (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn verleend
