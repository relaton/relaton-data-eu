  content: Commission Regulation (EEC) No 837/93 of 6 April 1993 re- establishing
    the levying of customs duties on products falling within CN code 8528, originating
    in Malaysia, to which the preferential tarrif arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 837/93 de la Commission, du 6 avril 1993, portant
