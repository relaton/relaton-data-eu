title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2382/72 de la Commission, du 14 novembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux cuillers, louches, etc. en acier inoxydable, de la sous- position tarifaire
    82.14 A, originaires de Hong-Kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2382/72 der Kommission vom 14. November 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Löffel, Schöpfkellen usw., aus
    rostfreiem Stahl, der Tarifstelle 82.14 A, mit Ursprung in Hongkong dem die in
    der Verordnung (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2382/72 della Commissione, del 14 novembre 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    cucchiai, cucchiaioni ecc., in acciaio inossidabile, della sottovoce doganale
    n. 82.14 A, originari di Hong Kong, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2382/72 van de Commissie van 14 november 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op lepels, pollepels, enz., van roestvrij staal van onderverdeling
    82.14 A, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG)
    nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties werden
    geopend
  type: main
