title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 725/84 of 20 March 1984 re-establishing
    the levying of customs duties on certain bovine cattle leather, falling within
    subheading 41.02 ex C and originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 725/84 de la Commission du 20 mars 1984 portant rétablissement
    de la perception des droits de douane applicables à certains cuirs et peaux de
    bovins, de la sous-position 41.02 ex C du tarif douanier commun, originaires du
    Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 725/84 der Kommission vom 20. März 1984 zur Wiedereinführung
    der Erhebung der Zölle für bestimmtes Rind- und Kalbleder der Tarifstelle 41.02
    ex C mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3569/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 725/84 af 20. marts 1984 om genindførelse
    af opkrævning af told for bestemt læder af kvæghuder, henhørende under pos.
    41.02 ex C og med oprindelse i Pakistan, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 725/84 της Επιτροπής
    της 20ής Μαρτίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένα σκύτη και
    δέρματα βοοειδών, της διακρίσεως 41.02 ex Γ του
    Κοινού Δασμολογίου, καταγωγής Πακιστάν, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 725/84 della Commissione del 20 marzo 1984 che ripristina
    la riscossione dei dazi doganali applicabili a taluni cuoi e pelli di bovini,
    della sottovoce 41.02 ex C della tariffa doganale comune, originari del Pakistan
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 725/84 van de Commissie van 20 maart 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaald leder
    en voorgelooide huiden en vellen, van runderen, van tariefpostonderverdeling 41.02
    ex C, van oorsprong uit Pakistan, waarvoor de in Verordening (EEG) nr. 3569/83
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
