title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 janvier 1972, autorisant la République
    française à exclure du traitement communautaire les microscopes optiques, de
    la position 90.12 du Tarif douanier commun, originaires du Japon et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/99/EWG: Entscheidung der Kommission vom 17. Januar 1972, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche optische Mikroskope der Tarifnummer
    90.12 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/99/CEE: Decisione della Commissione, del 17 gennaio 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i microscopi ottici,
    della voce n. 90.12 della tariffa doganale comune, originari del Giappone e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/99/EEG: Beschikking van de Commissie van 17 januari 1972 waarbij de
    Franse Republiek wordt gemachtigd optische microscopen, van post 90.12 van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
