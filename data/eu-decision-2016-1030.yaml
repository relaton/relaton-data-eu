---
id: EUDecision20161030
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/1030 of 23 June 2016 amending
    Annex I to Decision 2004/211/EC as regards the entry for Lebanon in the list of
    third countries and parts of territory thereof from which Member States authorise
    imports of live equidae and semen, ova and embryos of the equine species (notified
    under document C(2016) 3778)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/1030 de la Commission du 23 juin 2016
    modifiant l'annexe I de la décision 2004/211/CE en ce qui concerne la mention
    relative au Liban sur la liste des pays tiers et des parties de territoires de
    ces pays en provenance desquels les États membres autorisent les importations
    d'équidés vivants et de sperme, d'ovules et d'embryons de l'espèce équine
    [notifiée sous le numéro C(2016) 3778]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/1030 der Kommission vom 23. Juni 2016
    zur Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich des Eintrags
    zum Libanon in der Liste von Drittländern und Teilen von Drittländern, aus denen
    die Mitgliedstaaten die Einfuhr von lebenden Equiden sowie von Equidensperma,
    -eizellen und -embryonen zulassen (Bekanntgegeben unter Aktenzeichen C(2016) 3778)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/1030 на Комисията
    от 23 юни 2016 година за изменение на приложение
    I към Решение 2004/211/ЕО по отношение на вписването
    за Ливан в списъка на трети страни и части от
    техните територии, от които държавите членки
    разрешават вноса на живи еднокопитни и на сперма,
    яйцеклетки и ембриони от еднокопитни (нотифицирано
    под номер С(2016) 3778)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/1030 ze dne 23. června 2016,
    kterým se mění příloha I rozhodnutí 2004/211/ES, pokud jde o položku týkající
    se Libanonu v seznamu třetích zemí a jejich částí, ze kterých členské
    státy povolují dovoz živých koňovitých a spermatu, vajíček a embryí druhů
    koňovitých (oznámeno pod číslem C(2016) 3778)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/1030 af 23. juni 2016
    om ændring af bilag I til beslutning 2004/211/EF for så vidt angår oplysningerne
    om Libanon i listen over tredjelande og dele af tredjelande, hvorfra medlemsstaterne
    tillader import af levende dyr af hestefamilien samt sæd, æg og embryoner fra
    dyr af hestefamilien (meddelt under nummer C(2016) 3778)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/1030 της Επιτροπής,
    της 23ης Ιουνίου 2016, για την τροποποίηση του
    παραρτήματος I της απόφασης 2004/211/ΕΚ όσον αφορά
    την καταχώριση για τον Λίβανο στον κατάλογο
    των τρίτων χωρών και των περιοχών τους από
    τις οποίες τα κράτη μέλη επιτρέπουν τις εισαγωγές
    ζώντων ιπποειδών και σπέρματος, ωαρίων και
    εμβρύων ιπποειδών [κοινοποιηθείσα υπό τον
    αριθμό C(2016) 3778]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/1030, 23. juuni 2016, millega muudetakse
    otsuse 2004/211/EÜ I lisa seoses Liibanoni kohta tehtud kandega loetelus, kuhu
    on kantud sellised kolmandad riigid ja nende territooriumide osad, millest liikmesriigid
    lubavad importida elushobuslasi ning hobuslaste spermat, munarakke ja embrüoid
    (teatavaks tehtud numbri C(2016) 3778 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/1030, annettu 23 päivänä
    kesäkuuta 2016, päätöksen 2004/211/EY liitteen I muuttamisesta Libanonia koskevan
    kohdan osalta niiden kolmansien maiden ja kolmansien maiden alueiden osien luettelossa,
    joista jäsenvaltiot sallivat elävien hevoseläinten ja hevoseläinten siemennesteen,
    munasolujen ja alkioiden tuonnin (tiedoksiannettu numerolla C(2016) 3778)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/1030 оd 23. lipnja 2016. o izmjeni
    Priloga I. Odluci 2004/211/EZ u pogledu unosa za Libanon na popisu trećih zemalja
    i dijelova njihovog državnog područja iz kojih države članice odobravaju uvoz
    živih kopitara i sjemena, jajnih stanica i zametaka kopitara (priopćeno pod
    brojem dokumenta C(2016) 3778)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1030 végrehajtási határozata (2016. június 23.)
    a 2004/211/EK határozat I. mellékletének a tagállamok által az élő lófélék,
    továbbá a lófélék spermájának, petesejtjeinek és embrióinak behozatalára
    feljogosított harmadik országok és országrészek jegyzékében szereplő,
    Libanonra vonatkozó bejegyzés módosításáról (az értesítés a C(2016)
    3778. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/1030 della Commissione, del 23 giugno
    2016, che modifica l'allegato I della decisione 2004/211/CE per quanto concerne
    la voce relativa al Libano figurante nell'elenco dei paesi terzi e delle parti
    territorio di paesi terzi da cui gli Stati membri autorizzano le importazioni
    di equidi vivi nonché di sperma, ovuli ed embrioni della specie equina [notificata
    con il numero C(2016) 3778]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/1030 (2016. gada 23. jūnijs),
    ar ko Lēmuma 2004/211/EK I pielikumu groza attiecībā uz ierakstu par Libānu
    to trešo valstu un to teritoriju daļu sarakstā, no kurām dalībvalstis atļauj
    dzīvu zirgu dzimtas dzīvnieku un to spermas, olšūnu un embriju importu (izziņots
    ar dokumenta numuru C(2016) 3778)
  type: main
- language: lt
  script: Latn
  content: 2016 m. birželio 23 d. Komisijos įgyvendinimo sprendimas (ES) 2016/1030,
    kuriuo dėl Libanui skirto įrašo trečiųjų šalių ar jų dalių, iš kurių
    valstybės narės leidžia importuoti gyvus arklinių šeimos gyvūnus ir arklių
    rūšių gyvūnų spermą, kiaušialąstes ir embrionus, sąraše iš dalies keičiamas
    Sprendimo 2004/211/EB I priedas (pranešta dokumentu Nr. C(2016) 3778)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/1030 tat-23
    ta' Ġunju 2016 li temenda l-Anness I tad-Deċiżjoni 2004/211/KE fir-rigward
    tal-entrata tal-Libanu fil-lista ta' pajjiżi terzi u ta' partijiet mit-territorju
    tagħhom li minnhom l-Istati Membri jawtorizzaw l-importazzjoni ta' ekwidi ħajjin
    u ta' semen, ova u embrijuni tal-ispeċi ekwina (innotifikata bid-dokument C(2016)
    3778)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/1030 van de Commissie van 23 juni 2016 tot
    wijziging van bijlage I bij Beschikking 2004/211/EG wat betreft de gegevens voor
    Libanon in de lijst van derde landen en delen van hun grondgebied waaruit de lidstaten
    de invoer toestaan van levende paardachtigen en sperma, eicellen en embryo's van
    paarden (Kennisgeving geschied onder nummer C(2016) 3778)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/1030 z dnia 23 czerwca 2016 r. zmieniająca
    załącznik I do decyzji 2004/211/WE w odniesieniu do wpisu dotyczącego Libanu
    w wykazie państw trzecich oraz części ich terytoriów, z których państwa
    członkowskie dopuszczają przywóz żywych zwierząt z rodziny koniowatych, nasienia,
    komórek jajowych i zarodków koni (notyfikowana jako dokument nr C(2016) 3778)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/1030 da Comissão, de 23 de junho de 2016,
    que altera o anexo I da Decisão 2004/211/CE no que se refere à entrada relativa
    ao Líbano na lista de países terceiros e partes de países terceiros a partir
    dos quais os Estados-Membros autorizam as importações de equídeos vivos e sémen,
    óvulos e embriões de equídeos [notificada com o número C(2016) 3778]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/1030 a Comisiei din 23 iunie 2016
    de modificare a anexei I la Decizia 2004/211/CE în ceea ce privește rubrica
    referitoare la Liban din lista țărilor terțe și a părților din teritoriile
    acestora din care statele membre autorizează importuri de ecvidee vii și de
    material seminal, de ovule și de embrioni din specia ecvină [notificată cu
    numărul C(2016) 3778]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/1030 z 23. júna 2016, ktorým
    sa mení príloha I k rozhodnutiu 2004/211/ES, pokiaľ ide o položku týkajúcu
    sa Libanonu v zozname tretích krajín a častí ich územia, z ktorých členské
    štáty povoľujú dovoz živých zvierat koňovitých a spermy, oocytov a embryí
    druhov koňovitých [oznámené pod číslom C(2016) 3778]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/1030 z dne 23. junija 2016 o spremembi
    Priloge I k Odločbi 2004/211/ES v zvezi z uvrstitvijo Libanona na seznam tretjih
    držav in delov njihovih ozemelj, iz katerih države članice dovolijo uvoz živih
    enoprstih kopitarjev ter njihovega semena, jajčnih celic in zarodkov (notificirano
    pod dokumentarno številko C(2016) 3778)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/1030 de la Comisión, de 23 de junio
    de 2016, por la que se modifica el anexo I de la Decisión 2004/211/CE en lo que
    respecta a la entrada correspondiente al Líbano de la lista de terceros países
    y partes de su territorio a partir de los cuales los Estados miembros autorizan
    la importación de équidos vivos y esperma, óvulos y embriones de la especie
    equina [notificada con el número C(2016) 3778]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/1030 av den 23 juni 2016 om
    ändring av bilaga I till beslut 2004/211/EG vad gäller posten för Libanon i
    förteckningen över tredjeländer eller delar av tredjeländer från vilka medlemsstaterna
    tillåter import av levande hästdjur och sperma, ägg och embryon från hästdjur
