title:
- language: fr
  script: Latn
  content: Décision de la Commission du 6 mars 1964 autorisant le Royaume de Belgique
    et le Grand-Duché de Luxembourg à percevoir un montant compensatoire sur l'importation
    de certaines catégories d'aliments pour animaux, contenant du lait
  type: main
- language: de
  script: Latn
  content: '64/161/EWG: Entscheidung der Kommission vom. 6. März 1964, durch die
    das Königreich Belgien und das Großherzogtum Luxemburg ermächtigt werden, bei
    der Einfuhr einiger Futtermittelarten, die Milch enthalten, einen Ausgleichsbetrag
    zu erheben'
  type: main
- language: it
  script: Latn
  content: '64/161/CEE: Decisione della Commissione del 6 marzo 1964, che autorizza
    il Regno del Belgio ed il Granducato del Lussemburgo a riscuotere un ammontare
    compensativo all''importazione di alcune categorie di alimenti per animali, contenenti,
    latte'
  type: main
- language: nl
  script: Latn
  content: '64/161/EEG: Beschikking van de Commissie van 6 maart 1964 houdende machtiging
    van het Koninkrijk België en het Groothertogdom Luxemburg een compenserend bedrag
    te heffen op de invoer van sommige soorten melk bevattende veevoeders'
  type: main
