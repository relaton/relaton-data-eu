title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1760/81 of 30 June 1981 re-establishing
    the levying of customs duties on floor cloths, dish cloths, dusters and the like,
    other than knitted or crocheted, products of category 113 (code 1130), originating
    in China, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1760/81 de la Commission, du 30 juin 1981, portant
    rétablissement de la perception des droits de douane applicables aux torchons,
    serpillières, lavettes et chamoisettes, autres qu' en bonneterie, de la catégorie
    de produits n° 113 (code 1130), originaires de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1760/81 der Kommission vom 30. Juni 1981 über die
    Wiedereinführung des Zollsatzes für Scheuertücher, Wischtücher, Spültücher
    und Staubtücher, andere als aus Gewirken, der Warenkategorie Nr. 113 (Kennziffer
    1130), mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3320/80 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1760/81 af 30. juni 1981 om genindførelse
    af opkrævning af toldafgifter for gulvklude, karklude, støveklude og pudseklude,
    ikke af trikotage under kategori 113 (kode 1130) som har oprindelse i Kina og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1760/81 τής Επιτροπής
    τής 30ής Ιουνίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά μάκτρα καθαρισμού,
    υφάσματα διά τόν καθαρισμόν δαπέδων, υφάσματα
