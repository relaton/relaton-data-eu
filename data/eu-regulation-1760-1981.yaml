  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1760/81 della Commissione, del 30 giugno 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai torcioni e strofinacci,
    anche scamosciati, esclusi quelli a maglia, della categoria di prodotti n. 113
    (codice 1130), originari della Cina, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1760/81 van de Commissie van 30 juni 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dweilen,
    vaatdoeken, stofdoeken en poetsdoeken, andere dan die van brei- of haakwerk, van
    categorie van produkten 113 (codenummer 1130) van oorsprong uit China, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3320/80
    van de Raad
