title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 471/88 of 19 February 1988 re-establishing
    the levying of customs duties on men' s or boys' knitted or crocheted suits and
    ensembles, products of category 75 (order No 40.0750), and other made up textile
    articles, products of category 112 (order No 40.1120) originating in South Korea
    to which the preferential tariff arrangements of Council Regulation (EEC) No 3783/87
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 471/88 de la Commission du 19 février 1988 portant
    rétablissement de la perception des droits de douane applicables aux costumes,
    complets et ensembles en bonneterie pour hommes et garçonnets de la catégorie
    de produits 75 (numéro d' ordre 40.0750), originaires de Corée du Sud, et aux
    autres articles confectionnés en tissus de la catégorie de produits n° 112
    (numéro d' ordre 40.1120), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 471/88 der Kommission vom 19. Februar 1988 über die
    Wiedereinführung des Zollsatzes für Anzüge und Kombinationen, aus Gewirken,
    für Männer und Knaben, der Warenkategorie 75 (Laufende Nummer 40.0750) und andere
    konfektionierte Waren der Warenkategorie 112 (Laufende Nummer 40.1120) mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 471/88 af 19. februar 1988 om genindførelse
    af opkrævning af toldafgifter for dragter, kostumer og sæt, af trikotage, til
    mænd og drenge (kategori 75, løbenummer 40.0750) og andre varer fremstillet
    af tekstilstoffer (kategori 112, løbenummer 40.1120), som har oprindelse i Sydkorea
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3783/87
  type: main
- language: el
  script: Grek
