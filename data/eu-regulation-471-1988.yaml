  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 471/88 della Commissione del 19 febbraio 1988 che
    ripristina la riscossione dei dazi doganali applicabili a vestiti e completi a
    maglia, per uomo e per ragazzo della categoria di prodotti 75 (numero d' ordine
    40.0750) e ad altri manufatti confezionati di tessuti, della categoria di prodotti
    n. 112 (numero d' ordine 40.1120) originari della Corea del Sud beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 471/88 van de Commissie van 19 februari 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties van brei- of haakwerk, voor heren en jongens, van de categorie
    van produkten nr. 75 (volgnummer 40.0750), en andere geconfectioneerde artikelen
