  content: Décision 66/667/CEE de la Commission, du 9 novembre 1966, portant augmentation
    du volume du contingent tarifaire octroyé au Royaume de Belgique et au Grand-
    Duché de Luxembourg pour certaines espèces de crabes et crevettes, destinés
    à la conserverie
  type: main
- language: de
  script: Latn
  content: '66/667/EWG: Entscheidung der Kommission vom 9. November 1966 über die
    Erhöhung des dem Königreich Belgien und dem Großherzogtum Luxemburg gewährten
    Zollkontingents für bestimmte Krabben- und Garnelenarten für die Konservenindustrie'
  type: main
- language: it
  script: Latn
  content: '66/667/CEE: Decisione della Commissione, del 9 novembre 1966, che aumenta
    il volume del contingente tariffario concesso al Regno del Belgio ed al Granducato
    del Lussemburgo per alcune specie di granchi e gamberetti destinati all''industria
    conserviera'
  type: main
- language: nl
  script: Latn
  content: '66/667/EEG: Beschikking van de Commissie van 9 november 1966 houdende
    vergroting van het aan het Koninkrijk België en het Groothertogdom Luxemburg
    toegekende tariefcontingent voor sommige soorten krabben en garnalen, bestemd
    voor de conservenindustrie'
