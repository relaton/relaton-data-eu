title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1584/76 of 24 June 1976 determining the
    amounts of the variable components, compensatory amounts and additional duties
    applicable during the third quarter of 1976 on the importation of goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1584/76 de la Commission, du 24 juin 1976, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant le troisième trimestre de l'année
    1976, à l'importation des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1584/76 der Kommission vom 24. Juni 1976 zur Festsetzung
    der Höhe der im dritten Vierteljahr 1976 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge, Ausgleichsbeträge
    und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1584/76 af 24. juni 1976 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    indførsel af varer henhørende under forordning (EØF) nr. 1059/69 i tredje kvartal
    1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1584/76 della Commissione, del 24 giugno 1976, che
    determina gli importi degli elementi mobili e gli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per il terzo trimestre 1976,
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1584/76 van de Commissie van 24 juni 1976 tot vaststelling
    van het beloop der gedurende het derde kwartaal van 1976 bij invoer van onder
    Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele elementen,
    compenserende bedragen en aanvullende invoerrechten
