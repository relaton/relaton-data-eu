title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 860/2005 of 30 May 2005 amending Regulation
    (EC) No 27/2005, as concerns fishing opportunities in Greenland, Faroese and Icelandic
    waters and fishing for cod in the North Sea, and amending Regulation (EC) No 2270/2004,
    as concerns fishing opportunities for deep-sea sharks and roundnose grenadier
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 860/2005 du Conseil du 30 mai 2005 modifiant le règlement
    (CE) n° 27/2005, en ce qui concerne les possibilités de pêche dans les eaux
    du Groenland, des îles Féroé et de l’Islande et la pêche du cabillaud dans
    la mer du Nord et modifiant le règlement (CE) n° 2270/2004, en ce qui concerne
    les possibilités de pêche du requin des grands fonds et du grenadier de roche
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 860/2005 des Rates vom 30. Mai 2005 zur Änderung der
    Verordnung (EG) Nr. 27/2005 hinsichtlich der Fangmöglichkeiten in grönländischen,
    färöischen und isländischen Gewässern sowie des Kabeljaufangs in der Nordsee
    und zur Änderung der Verordnung (EG) Nr. 2270/2004 hinsichtlich der Fangmöglichkeiten
    für Tiefseehaie und Grenadierfisch
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 860/2005 ze dne 30. května 2005, kterým se
    mění nařízení (ES) č. 27/2005, pokud jde o rybolovná práva ve vodách
    Grónska, Faerských ostrovů a Islandu a rybolov tresky obecné v Severním moři,
    a nařízení (ES) č. 2270/2004, pokud jde o rybolovná práva na hlubinné druhy
    žraloka a hlavouna tuponosého
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 860/2005 af 30. maj 2005 om ændring af forordning
    (EF) nr. 27/2005 for så vidt angår fiskerimulighederne i grønlandske, færøske
    og islandske farvande og torskefiskeri i Nordsøen og om ændring af forordning
    (EF) nr. 2270/2004 for så vidt angår fiskerimulighederne for dybhavshajer og
    skolæst
  type: main
- language: el
  script: Grek
