  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 860/2005, annettu 30 päivänä toukokuuta 2005,
    asetuksen (EY) N:o 27/2005 muuttamisesta Grönlannin, Färsaarten ja Islannin
    vesillä olevien kalastusmahdollisuuksien osalta ja turskan kalastuksen osalta
