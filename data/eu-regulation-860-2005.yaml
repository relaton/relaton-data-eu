    το γρεναδιέρο των βράχων
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 860/2005, 30. mai 2005, millega muudetakse määrust
    (EÜ) nr 27/2005 seoses kalapüügivõimalustega Gröönimaa, Fääri saarte ja
    Islandi vetes ning tursapüügiga Põhjameres ning määrust (EÜ) nr 2270/2004
