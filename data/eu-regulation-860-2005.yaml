    ja lestikalan kalastuksen osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 860/2005/EK rendelete (2005. május 30.) a grönlandi, a Feröer-szigeteki
    és az izlandi vizekre vonatkozó halászati lehetőségek, valamint az északi-tengeri
    tőkehalhalászat tekintetében a 27/2005/EK rendelet módosításáról, továbbá
    a mélytengeri cápákra és a gránátoshalra vonatkozó halászati lehetőségek
    tekintetében a 2270/2004/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 860/2005 del Consiglio, del 30 maggio 2005, recante
    modifica del regolamento (CE) n. 27/2005 per quanto riguarda le possibilità di
    pesca nelle acque della Groenlandia, delle Isole Færøer e dell’Islanda e la
    pesca del merluzzo bianco nel Mare del Nord e recante modifica del regolamento
    (CE) n. 2270/2004 per quanto riguarda le possibilità di pesca di squali pelagici
    e di granatieri
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 860/2005 (2005. gada 30. maijs), ar ko groza Padomes
    Regulu (EK) Nr. 27/2005 attiecībā uz zvejas iespējām Grenlandes, Farēru salu
    un Islandes ūdeņos un mencu zveju Ziemeļjūrā un Padomes Regulu (EK) Nr. 2270/2004
    attiecībā uz dziļūdens haizivju un strupdeguna garastes zvejas iespējām
  type: main
- language: lt
  script: Latn
  content: 2005 m. gegužės 30 d. Tarybos reglamentas (EB) Nr. 860/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 27/2005 dėl žvejybos galimybių Grenlandijos,
    Farerų salų ir Islandijos vandenyse bei menkių žvejybos Šiaurės jūroje,
    ir iš dalies keičiantis Reglamentą (EB) Nr. 2270/2004 dėl giliavandenių ryklių
    ir bukasnukių ilgauodegių grenadierių žvejybos galimybių
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 860/2005 tat- 30 ta' Mejju 2005 li jemenda
    r-Regolament (KE) Nru 27/2005, fir-rigward ta' l-opportunitajiet ta' sajd fl-ibħra
    tal-Groenlandja, tal-Gżejjer Faroe u ta' l-Islanda u s-sajd għall-merluzz fil-Baħar
    tat-Tramuntana, u li jemenda r-Regolament (KE) Nru 2270/2004, fir-rigward ta'
    l-opportunitajiet ta' sajd għall-kelb il-baħar tal-fond u r-roundnose grenadier
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 860/2005 van de Raad van 30 mei 2005 tot wijziging
    van Verordening (EG) nr. 27/2005 wat de vangstmogelijkheden in de wateren van
    Groenland, de Faeröer en IJsland en de visserij op kabeljauw in de Noordzee betreft,
    en tot wijziging van Verordening (EG) nr. 2270/2004 wat de vangstmogelijkheden
    voor diepzeehaaien en grenadiervis betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 860/2005 z dnia 30 maja 2005 r. zmieniające
    rozporządzenie (WE) nr 27/2005 w zakresie możliwości połowowych na wodach
    Grenlandii, Wysp Owczych i Islandii oraz połowów dorsza w Morzu Północnym,
    a także zmieniające rozporządzenie (WE) nr 2270/2004 w zakresie możliwości
    połowowych rekina głębinowego i buławika czarnego
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 860/2005 do Conselho, de 30 de Maio de 2005, que
    altera o Regulamento (CE) n.° 27/2005 em relação às possibilidades de pesca
    nas águas da Gronelândia, Ilhas Faroé e Islândia e à pesca do bacalhau no
    mar do Norte e que altera o Regulamento (CE) n.° 2270/2004 em relação às possibilidades
    de pesca de tubarões de profundidade e de lagartixa da rocha
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 860/2005 z 30. mája 2005, ktorým sa mení a
    dopĺňa nariadenie (ES) č. 27/2005, pokiaľ ide o príležitosti na rybolov
    v grónskych, faerských a islandských vodách, lov tresky v Severnom mori a
    ktorým sa mení a dopĺňa nariadenie (ES) č. 2270/2004, pokiaľ ide o možnosti
    lovu žraloka hlbokomorského a hlavúňa tuponosého
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 860/2005 z dne 30. maja 2005 o spremembi Uredbe
    (ES) št. 27/2005 glede ribolovnih možnosti v grenlandskih, ferskih in islandskih
    vodah in ribolova trsk v Severnem morju ter o spremembi Uredbe (ES) št. 2270/2004
    glede ribolovnih možnosti za globokomorske morske pse in okroglonosega repaka
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 860/2005 del Consejo, de 30 de mayo de 2005, que modifica
    el Reglamento (CE) n° 27/2005, en lo que atañe a las posibilidades de pesca
    en aguas de Groenlandia, Islas Feroe e Islandia y a la pesca de bacalao en el
    Mar del Norte, y que modifica el Reglamento (CE) n° 2270/2004, en lo que atañe
    a las posibilidades de pesca de tiburones de aguas profundas y de granadero
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 860/2005 av den 30 maj 2005 om ändring av
    förordning (EG) nr 27/2005 vad gäller fiskemöjligheter i grönländska, färöiska
    och isländska vatten och fiske efter torsk i Nordsjön, och ändring av förordning
    (EG) nr 2270/2004 vad gäller möjligheter till fiske efter djuphavshaj och skoläst
