    nr. 1499/2002, (CE) nr. 1500/2003 și (CE) nr. 1798/2003 ale Consiliului, a Deciziilor
    nr. 1719/1999/CE, nr. 1720/1999/CE, nr. 253/2000/CE, nr. 508/2000/CE, nr. 1031/2000/CE,
    nr. 163/2001/CE, nr. 2235/2002/CE și nr. 291/2003/CE ale Parlamentului European
    și ale Consiliului și a Deciziilor 1999/382/CE, 2000/821/CE, 2003/17/CE și
    2003/893/CE ale Consiliului în domeniul liberei circulații a mărfurilor, în
    domeniul dreptului societăților, în domeniul agriculturii, în domeniul fiscalității,
    în domeniul educației și formării profesionale, în domeniul culturii și
    politicii audiovizuale, precum și în domeniul relațiilor externe, ca urmare
    a aderării Republicii Cehe, a Estoniei, a Ciprului, a Letoniei, a Lituaniei,
    a Ungariei, a Maltei, a Poloniei, a Sloveniei și a Slovaciei
  type: main
- language: sk
  script: Latn
  content: Nariadenie rady (ES) č. 885/2004 z 26. apríla 2004, ktorým sa z dôvodu
    pristúpenia Českej republiky, Estónskej republiky, Cyperskej republiky, Lotyšskej
    republiky, Litovskej republiky, Maďarskej republiky, Maltskej republiky, Poľskej
    republiky, Slovinskej republiky a Slovenskej republiky upravuje nariadenie Európskeho
    parlamentu a Rady (ES) č. 2003/2003, nariadenia Rady (ES) č. 1334/2000, (ES)
    č. 2157/2001, (ES) č. 152/2002, (ES) č. 1499/2002, (ES) č. 1500/2003 a (ES)
    č. 1798/2003, rozhodnutia Európskeho parlamentu a Rady č. 1719/1999/ES, č.
    1720/1999/ES, č. 253/2000/ES, č. 508/2000/ES, č. 1031/2000/ES, č. 163/2001/ES,
    č. 2235/2002/ES a č. 291/2003/ES a rozhodnutia Rady č. 1999/382/ES, č. 2000/821/ES,
    č. 2003/17/ES a č. 2003/893/ES v oblastiach voľného pohybu tovaru, práva
    obchodných spoločností, poľnohospodárstva, zdaňovania, všeobecného a odborného
    vzdelávania, kultúry a audiovizuálnej politiky a vonkajších vzťahov
  type: main
- language: sl
  script: Latn
  content: Uredba sveta 2004/885/ES z dne 26. aprila 2004 o prilagoditvi Uredbe (ES)
    št. 2003/2003 Evropskega parlamenta in Sveta, Uredb (ES) št. 1334/2000, (ES)
    št. 2157/2001, (ES) št. 152/2002, (ES) št. 1499/2002, (ES) št. 1500/2003 in
    (ES) št. 1798/2003 Sveta, Odločbe št. 1719/1999/ES, Sklepa št. 1720/1999/ES,
    Sklepa št. 253/2000/ES, Sklepa št. 508/2000/ES, Sklepa št. 1031/2000/ES, Sklepa
    št. 163/2001/ES, Odločbe št. 2235/2002/ES in Sklepa št. 291/2003/ES Evropskega
    parlamenta in Sveta ter Sklepa 1999/382/ES, Sklepa 2000/821/ES, Odločbe 2003/17/ES
    in Sklepa 2003/893/ES Sveta na področjih prostega pretoka blaga, prava družb,
    kmetijstva, obdavčitve, izobraževanja in usposabljanja, kulture in avdiovizualne
    politike in zunanjih odnosov zaradi pristopa Češke, Estonije, Cipra, Latvije,
    Litve, Madžarske, Malte, Poljske, Slovenije in Slovaške
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 885/2004 del Consejo, de 26 de abril de 2004, por el
    que se que se adaptan el Reglamento (CE) n° 2003/2003 del Parlamento Europeo
    y del Consejo, los Reglamentos (CE) n° 1334/2000, (CE) n° 2157/2001, (CE) n°
    152/2002, (CE) n° 1499/2002, (CE) n° 1500/2003 y (CE) n° 1798/2003 del Consejo,
    las Decisiones n° 1719/1999/CE, n° 1720/1999/CE, n° 253/2000/CE, n° 508/2000/CE,
    n° 1031/2000/CE, n° 163/2001/CE, n° 2235/2002/CE y n° 291/2003/CE del Parlamento
    Europeo y del Consejo, y las Decisiones 1999/382/CE, 2000/821/CE, 2003/17/CE y
    2003/893/CE del Consejo, en los ámbitos de la libre circulación de mercancías,
    el derecho de sociedades, la agricultura, la fiscalidad, la educación y la formación,
    la cultura y la política audiovisual y las relaciones exteriores, como consecuencia
    de la adhesión de la República Checa, Estonia, Chipre, Letonia, Lituania, Hungría,
    Malta, Polonia, Eslovenia y Eslovaquia
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 885/2004 av den 26 april 2004 om anpassning
    av Europaparlamentets och rådets förordning (EG) nr 2003/2003, rådets förordningar
    (EG) nr 1334/2000, (EG) nr 2157/2001, (EG) nr 152/2002, (EG) nr 1499/2002, (EG)
    nr 1500/2003 och (EG) nr 1798/2003, Europaparlamentets och rådets beslut nr 1719/1999/EG,
    nr 1720/1999/EG, nr 253/2000/EG, nr 508/2000/EG, nr 1031/2000/EG, nr 163/2001/EG,
    nr 2235/2002/EG och nr 291/2003/EG och rådets beslut 1999/382/EG, 2000/821/EG,
    2003/17/EG och 2003/893/EG angående fri rörlighet för varor, bolagsrätt, jordbruk,
    beskattning, utbildning, kultur och politik på det audiovisuella området samt
    yttre förbindelser, till följd av Tjeckiens, Estlands, Cyperns, Lettlands, Litauens,
    Ungerns, Maltas, Polens, Sloveniens och Slovakiens anslutning
  type: main
