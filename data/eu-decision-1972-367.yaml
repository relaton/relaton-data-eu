title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 octobre 1972, autorisant la République
    fédérale d'Allemagne, la République française et le Grand-Duché de Luxembourg
    à permettre, sous certaines conditions, une augmentation supplémentaire du titre
    alcoométrique de certains vins et de certains produits destinés à l'élaboration
    des vins
  type: main
- language: de
  script: Latn
  content: '72/367/EWG: Entscheidung der Kommission vom 30. Oktober 1972 zur Ermächtigung
    der Bundesrepublik Deutschland, der Französischen Republik und des Großherzogtums
    Luxemburg, unter bestimmten Bedingungen eine zusätzliche Erhöhung des Alkoholgehalts
    bestimmter Weine und bestimmter zur Herstellung von Wein vorgesehener Erzeugnisse
    zu gestatten'
  type: main
- language: it
  script: Latn
  content: '72/367/CEE: Decisione della Commissione, del 30 ottobre 1972, che autorizza
    la Repubblica federale di Germania, la Repubblica francese e il Granducato del
    Lussemburgo a permettere, in determinate condizioni, un aumento supplementare
    della gradazione alcolometrica di taluni vini e di taluni prodotti destinati all''elaborazione
    dei vini'
  type: main
- language: nl
  script: Latn
  content: '72/367/EEG: Beschikking van de Commissie van 30 oktober 1972 waarbij de
    Bondsrepubliek Duitsland, de Franse Republiek en het Groothertogdom Luxemburg
    gemachtigd worden om op bepaalde voorwaarden een extra verhoging van het alcoholgehalte
    van bepaalde wijnen en van bepaalde voor de bereiding van wijn bestemde produkten
    toe te staan'
  type: main
