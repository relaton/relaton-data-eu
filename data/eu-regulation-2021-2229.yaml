title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/2229 of 14 December 2021 initiating
    an investigation concerning possible circumvention of the countervailing measures
    imposed by Implementing Regulation (EU) 2020/776 on imports of certain woven and/or
    stitched glass fibre fabrics originating in People’s Republic of China and Egypt
    by imports of certain woven and/or stitched glass fibre fabrics consigned from
    Turkey,whether declared as originating in Turkey or not, and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/2229 de la Commission du 14 décembre
    2021 ouvrant une enquête concernant un éventuel contournement des mesures compensatoires
    instituées par le règlement d’exécution (UE) 2020/776 sur les importations
    de certains tissus en fibres de verre tissées et/ou cousues originaires de la
    République populaire de Chine et d’Égypte par des importations de certains
    tissus en fibres de verre tissées et/ou cousues expédiés de Turquie, qu’ils
    aient ou non été déclarés originaires de ce pays, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/2229 der Kommission vom 14. Dezember
