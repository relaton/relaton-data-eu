  content: Commission Implementing Regulation (EU) No 1346/2014 of 17 December 2014
    imposing a definitive anti-dumping duty on imports of sulphanilic acid originating
    in the People's Republic of China and repealing the definitive anti-dumping duty
    on imports of sulphanilic acid originating in India following an expiry review
    pursuant to Article 11(2) of Council Regulation (EC) No 1225/2009
  type: main
