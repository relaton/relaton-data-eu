title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 552/80 of 3 March 1980 derogating from the
    concept of 'originating products' to take into account the special situation of
    Mauritius with regard to its production of canned tuna
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 552/80 du Conseil, du 3 mars 1980, portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière de l' île Maurice en ce qui concerne ses productions
    de conserves de thon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 552/80 des Rates vom 3. März 1980 zur Abweichung
    von der Bestimmung des Begriffs der Ursprungswaren, um der besonderen Lage von
    Mauritius in bezug auf haltbargemachten Thunfisch Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 552/80 af 3. marts 1980 om undtagelse fra
    definitionen af begrebet "varer med oprindelsesstatus" for at tage hensyn til
    den særlige situation i Mauritius for så vidt angår produktionen af tunfiskekonserves
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 552/80 del Consiglio, del 3 marzo 1980, che deroga
    alla definizione della nozione di prodotti originari per tener conto della particolare
    situazione di Maurizio relativamente alla produzione di conserve di tonno
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 552/80 van de Raad van 3 maart 1980 houdende afwijking
    van de definitie van het begrip ,,produkten van oorsprong' ' ten einde rekening
    te houden met de bijzondere situatie van Mauritius met betrekking tot zijn produktie
    van tonijnconserven
  type: main
