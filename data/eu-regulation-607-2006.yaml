title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 607/2006 of 19 April 2006 initiating an investigation
    concerning the possible circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 398/2004 on imports of silicon originating in the People's
    Republic of China by imports of silicon consigned from the Republic of Korea,
    whether declared as originating in the Republic of Korea or not, and making such
    imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 607/2006 de la Commission du 19 avril 2006 portant
    ouverture d’une enquête relative à un éventuel contournement des mesures
    antidumping instituées par le règlement (CE) n o 398/2004 du Conseil sur les
    importations de silicium originaire de la République populaire de Chine par des
    importations de silicium expédié de la République de Corée, qu’il ait ou
    non été déclaré originaire de la République de Corée, et soumettant ces
    importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 607/2006 der Kommission vom 19. April 2006 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 398/2004 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren von Silicium mit Ursprung in der Volksrepublik China durch die Einfuhren
    von aus der Republik Korea versandtem Silicium, ob als Ursprungserzeugnis der
    Republik Korea angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
