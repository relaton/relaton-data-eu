  script: Latn
  content: A Bizottság 607/2006/EK rendelete ( 2006. április 19. ) a Kínai Népköztársaságból
    származó szilícium behozatalára vonatkozó 398/2004/EK tanácsi rendelet által
    kivetett dömpingellenes intézkedéseknek a Koreai Köztársaságból feladott,
    akár a Koreai Köztársaságból származóként, akár nem ilyenként megjelölt
    szilikon behozatala által megvalósuló esetleges kijátszására vonatkozó
