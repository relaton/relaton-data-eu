  script: Latn
  content: Regolamento (CE) n. 607/2006 della Commissione, del 19 aprile 2006 , che
    apre un’inchiesta relativa alla possibile elusione delle misure antidumping
    istituite dal regolamento (CE) n. 398/2004 del Consiglio sulle importazioni di
    silicio originario della Repubblica popolare cinese mediante importazioni di silicio
    spedito dalla Repubblica di Corea, indipendentemente dal fatto che sia dichiarato
    o meno originario della Repubblica di Corea, e che dispone la registrazione di
    tali importazioni
  type: main
