title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 256/83 of 31 January 1983 fixing the rates
    of the refunds applicable from I February 1983 to eggs and egg yolks exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 256/83 de la Commission, du 31 janvier 1983, fixant
    les taux des restitutions applicables, à compter du 1er février 1983, aux oeufs
    et aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 256/83 der Kommission vom 31. Januar 1983 zur Festsetzung
    der ab 1. Februar 1983 geltenden Erstattungssätze bei der Ausfuhr von Eiern und
    Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 256/83 af 31. januar 1983 om fastsættelse
    af de restitutionssatser, der fra den 1. februar 1983 skal anvendes for æg og
    æggeblommer, der udføres i form af varer, som ikke omfattes af traktatens bilag
    II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 256/83 της Επιτροπής
    της 31ης Ιανουαρίου 1983 περί καθορισμού του ύψους
    των επιστροφών που εφαρμόζονται από την 1η
    Φεβρουαρίου 1983 στα αυγά και τους κρόκους αυγών
    τα οποία εξάγονται υπό μορφή εμπορευμάτων
    που δεν υπάγονται στο παράρτημα II της συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 256/83 della Commissione, del 31 gennaio 1983, che
    fissa i tassi delle restituzioni applicabili a decorrere dal 1 febbraio 1983 alle
    uova e al giallo d'uova esportati sotto forma di merci non comprese nell'allegato
    II del trattato.
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 256/83 van de Commissie van 31 januari 1983 houdende
    vaststelling van de restituties die met ingang van 1 februari 1983 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
