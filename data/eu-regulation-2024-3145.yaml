    2021/404 hinsichtlich der Listen der Drittländer, Gebiete oder Zonen derselben,
    aus denen der Eingang von Sendungen bestimmter Erzeugnisse tierischen Ursprungs
    in die Union zulässig ist, und zur Berichtigung ihres Anhangs XXI hinsichtlich
    der Einträge für die Vereinigten Staaten
  type: main
