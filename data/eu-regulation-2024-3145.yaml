  script: Latn
  content: Commission Implementing Regulation (EU) 2024/3145 of 18 December 2024 amending
    Annexes I, IX, X and XV to Implementing Regulation (EU) 2021/404 as regards the
    lists of third countries or territories or zones thereof authorised for the entry
    into the Union of consignments of certain products of animal origin, and correcting
    Annex XXI thereto as regards the entries for the United States
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/3145 de la Commission du 18 décembre
    2024 modifiant les annexes I, IX, X et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les listes des pays tiers, territoires et zones de pays tiers
    et territoires en provenance desquels l’entrée dans l’Union d’envois de
    certains produits d’origine animale est autorisée, et rectifiant son annexe
    XXI en ce qui concerne les mentions relatives aux États-Unis
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/3145 der Kommission vom 18. Dezember
