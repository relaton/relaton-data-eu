title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2293 of 18 November 2022 amending
    Implementing Regulation (EU) 2021/405 as regards the list of third countries with
    an approved control plan on the use of pharmacologically active substances, the
    maximum residue limits of pharmacologically active substances and pesticides and
    the maximum levels of contaminants
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2293 de la Commission du 18 novembre
    2022 modifiant le règlement d’exécution (UE) 2021/405 en ce qui concerne la
    liste des pays tiers ayant mis en place un plan de contrôle approuvé pour l’utilisation
    des substances pharmacologiquement actives, les limites maximales de résidus
    de substances pharmacologiquement actives et de pesticides et les teneurs maximales
    en contaminants
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2293 der Kommission vom 18. November
    2022 zur Änderung der Durchführungsverordnung (EU) 2021/405 im Hinblick auf
    die Liste der Drittländer mit einem genehmigten Kontrollplan in Bezug auf die
    Verwendung pharmakologisch wirksamer Stoffe, die Höchstmengen für Rückstände
    von pharmakologisch wirksamen Stoffen und Pestiziden und die Höchstgehalte an
    Kontaminanten
  type: main
