title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3120/75 of the Commission of 28 November 1975 re-establishing
    the levying of customs duties on woodscrews, falling within subheading 73.32 B
    ex II, originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3120/75 de la Commission, du 28 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux VIS à bois
    de la sous-position tarifaire 73.32 B EX II, originaires de Hong-Kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3120/75 der Kommission vom 28. Dezember 1975 zur Wiedereinführung
    des Zollsatzes für Holzschrauben der Tarifstelle 73.32 B ex II mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember
    1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3120/75 af 28. november 1975 om genindførelse
    af opkrævning af toldafgifter for træskruer, under underposition 73.32 B ex
    II, som har oprindelse i Hong Kong og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3120/75 della Commissione, del 28 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle viti per legno della
    sottovoce doganale 73.32 B ex II, originarie di Hong Kong, beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3120/75 van de Commissie van 28 november 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op houtschroeven,
    van onderverdeling 73.32 B ex II, van oorsprong uit Hong-Kong, ten behoeve waarvan
    bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
