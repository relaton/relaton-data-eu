title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2018/1918 of 4 December 2018 authorising
    the United Kingdom to apply a special measure derogating from Articles 16 and
    168 of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1918 du Conseil du 4 décembre 2018 autorisant
    le Royaume-Uni à appliquer une mesure particulière dérogatoire aux articles
    16 et 168 de la directive 2006/112/CE relative au système commun de taxe sur
    la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1918 des Rates vom 4. Dezember 2018 zur
    Ermächtigung des Vereinigten Königreichs, eine von Artikel 16 und 168 der Richtlinie
    2006/112/EG über das gemeinsame Mehrwertsteuersystem abweichende Sonderregelung
    anzuwenden
  type: main
- language: bg
  script: Cyrl
