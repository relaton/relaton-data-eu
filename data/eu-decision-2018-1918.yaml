    fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/1918 van de Raad van 4 december 2018 waarbij
    het Verenigd Koninkrijk wordt gemachtigd een bijzondere maatregel toe te passen
    die afwijkt van de artikelen 16 en 168 van Richtlijn 2006/112/EG betreffende het
    gemeenschappelijke stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2018/1918 z dnia 4 grudnia 2018 r. upoważniająca
    Zjednoczone Królestwo do stosowania szczególnego środka stanowiącego odstępstwo
    od art. 16 i 168 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od
    wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/1918 do Conselho, de 4 de dezembro de
    2018, que autoriza o Reino Unido a aplicar uma medida especial em derrogação
    aos artigos 16.° e 168.° da Diretiva 2006/112/CE relativa ao sistema comum do
    imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/1918 a Consiliului din 4 decembrie
    2018 de autorizare a Regatului Unit de a aplica o măsură specială de derogare
    de la articolele 16 și 168 din Directiva 2006/112/CE privind sistemul comun al
    taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2018/1918 zo 4. decembra 2018, ktorým
    sa Spojenému kráľovstvu povoľuje uplatňovať osobitné opatrenie odchyľujúce
    sa od článkov 16 a 168 smernice 2006/112/ES o spoločnom systéme dane z pridanej
    hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2018/1918 z dne 4. decembra 2018 o dovoljenju
