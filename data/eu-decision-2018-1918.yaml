  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/1918 του Συμβουλίου,
    της 4ης Δεκεμβρίου 2018, με την οποία επιτρέπεται
    στο Ηνωμένο Βασίλειο να εφαρμόσει ειδικό μέτρο
    παρέκκλισης από τα άρθρα 16 και 168 της οδηγίας
    2006/112/ΕΚ σχετικά με το κοινό σύστημα φόρου προστιθέμενης
    αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2018/1918, 4. detsember 2018, millega antakse
