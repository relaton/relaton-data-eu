    2006/112/EÜ (mis käsitleb ühist käibemaksusüsteemi) artiklitest 16 ja 168
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2018/1918, annettu 4 päivänä
    joulukuuta 2018, luvan antamisesta Yhdistyneelle kuningaskunnalle soveltaa yhteisestä
    arvonlisäverojärjestelmästä annetun direktiivin 2006/112/EY 16 ja 168 artiklasta
    poikkeavaa erityistoimenpidettä
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2018/1918 od 4. prosinca 2018. kojom se
