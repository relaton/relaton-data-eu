    мярка за дерогация от членове 16 и 168 от Директива
    2006/112/ЕО относно общата система на данъка върху
    добавената стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2018/1918 ze dne 4. prosince 2018, kterým
