    se od článků 16 a 168 směrnice 2006/112/ES o společném systému daně z
    přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2018/1918 af 4. december 2018 om
    at give Det Forenede Kongerige tilladelse til at anvende en særlig foranstaltning,
