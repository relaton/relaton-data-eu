id: EUDecision1976245
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 December 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to imports of socks of synthetic fibres falling within heading
    No ex 60.03 of the Common Customs Tariff, originating in the Republic of Korea
    and in free circulation in Italy and the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '76/245/CEE: Décision de la Commission du 5 décembre 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas,
    à exclure du traitement communautaire les importations de chaussettes en fibres
    synthétiques, de la position Ex 60.03 du Tarif douanier commun, originaires de
    la République de Corée et mises en libre pratique en Italie et en République
    fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Dezember 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Republik Korea stammende und in Italien und in der Bundesrepublik
    Deutschland im freien Verkehr befindliche Strümpfe aus synthetischen Spinnstoffen
    der Tarifnummer ex 60.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. december 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage indførsel af sokker af kunstfibre, som henhører under pos. ex 60.03
    i den fælles toldtarif, har oprindelse i republikken Korea og frit kan omsættes
    i Italien og i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 dicembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le importazioni di calzini di fibre tessili sintetiche
    della voce ex 60.03 della tariffa doganale comune, originari della Repubblica
    di Corea ed immessi in libera pratica in Italia e nella Repubblica federale di
    Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 december 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden
    gemachtigd de invoer van sokken van synthetische vezels, van post ex 60.03 van
    het gemeenschappelijk douanetarief, van oorsprong uit de Republiek Korea en in
    de Bondsrepubliek Duitsland en in Italië in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten
  type: main
