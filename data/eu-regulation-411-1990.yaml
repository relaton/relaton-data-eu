- language: en
  script: Latn
  content: Commission Regulation (EEC) No 411/90 of 16 February 1990 determining,
    for the period 1 February to 30 June 1990, the quantities of raw sugar produced
    in the French overseas departments benefiting from the refining aid referred to
    in Council Regulation (EEC) No 2225/86 and amending Regulation (EEC) No 2089/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 411/90 de la Commission du 16 février 1990 déterminant,
    pour la période du 1er février au 30 juin 1990, les quantités de sucre brut
    produites dans les départements français d'outre-mer bénéficiant de l'aide
    au raffinage visée au règlement (CEE) n° 2225/86 du Conseil, et modifiant le
    règlement (CEE) n° 2089/89
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 411/90 DER KOMMISSION vom 16. Februar 1990 zur Bestimmung
    der Mengen fuer im Zeitraum vom 1. Februar bis 30. Juni 1990 in den franzoesischen
    ueberseeischen Departements erzeugten Rohzucker, die die Raffinationsbeihilfe
    nach der Verordnung (EWG) Nr. 2225/86 des Rates erhalten koennen, und zur Aenderung
    der Verordnung (EWG) Nr. 2089/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 411/90 af 16. februar 1990 om fastsættelse
    for perioden 1. februar til 30. juni 1990 af de mængder råsukker produceret
    i de franske oversøiske departementer, der omfattes af den i Rådets forordning
    (EØF) nr. 2225/86 omhandlede raffineringsstøtte, og om ændring af forordning
    (EØF) nr. 2089/89
  type: main
- language: el
  script: Grek
