  script: Latn
  content: REGOLAMENTO (CEE) N. 411/90 DELLA COMMISSIONE del 16 febbraio 1990 che
    fissa, per il periodo dal 1o febbraio al 30 giugno 1990, i quantitativi di zucchero
    greggio prodotti nei dipartimenti francesi d'oltremare che beneficiano dell'aiuto
    alla raffinazione di cui al regolamento (CEE) n. 2225/86 del Consiglio e che modifica
    il regolamento (CEE) n. 2089/89
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 411/90 VAN DE COMMISSIE van 16 februari 1990 tot
    vaststelling voor de periode van 1 februari tot en met 30 juni 1990 van in de
    Franse overzeese departementen geproduceerde hoeveelheden ruwe suiker die in aanmerking
    komen voor de in Verordening (EEG) nr. 2225/86 van de Raad bedoelde steun voor
    raffinage en tot wijziging van Verordening (EEG) nr. 2089/89
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 411/90 DA COMISSAO de 16 de Fevereiro de 1990 que
    determina, para o periodo compreendido entre 1 de Fevereiro de 1990 e 30 de Junho
    de 1990, as quantidades de açucar bruto produzidas nos departamentos franceses
    ultramarinos que beneficiam da ajuda à refinaçao referida no Regulamento (CEE)
    n* 2225/86 do Conselho e que altera o Regulamento (CEE) n* 2089/89
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 411/90 DE LA COMISION de 16 de febrero de 1990 por
    el que se determinan, para el periodo del 1 de febrero al 30 de junio de 1990,
    cantidades de azucar terciado producidas en los departamentos franceses de Ultramar
    que se benefician de la ayuda al refinado contemplada en el Reglamento (CEE) no
    2225/86 del Consejo, y por el que se modifica el Reglamento (CEE) no 2089/89
