    poziomów pozostałości pestycydów odpowiednio w zbożach i niektórych produktach
    pochodzenia zwierzęcego i roślinnego, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2005/48/CE da Comissão, de 23 de Agosto de 2005, que altera
