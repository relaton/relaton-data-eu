    de limites máximos de resíduos de pesticidas à superfície e no interior dos
    cereais e de determinados produtos de origem animal e vegetal
  type: main
- language: ro
  script: Latn
  content: Directiva 2005/48/CE a Comisiei din 23 august 2005 de modificare a Directivelor
