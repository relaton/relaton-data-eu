  script: Latn
  content: Commission Directive 2005/48/EC of 23 August 2005 amending Council Directives
    86/362/EEC, 86/363/EEC and 90/642/EEC as regards maximum residue levels for certain
    pesticides in and on cereals and certain products of animal and plant origin
  type: main
- language: fr
  script: Latn
  content: Directive 2005/48/CE de la Commission du 23 août 2005 modifiant les directives
    86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil en ce qui concerne les teneurs
    maximales pour les résidus de certains pesticides sur et dans les céréales
    et certains produits d’origine animale et végétale
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/48/EG der Kommission vom 23. August 2005 zur Änderung
    der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates hinsichtlich der
    Rückstandshöchstwerte für bestimmte Schädlingsbekämpfungsmittel auf und in
    Getreide und bestimmten Erzeugnissen tierischen und pflanzlichen Ursprungs
  type: main
- language: bg
