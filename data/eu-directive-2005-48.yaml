    limitů reziduí pro některé pesticidy v obilovinách a některých produktech
    živočišného a rostlinného původu a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2005/48/EF af 23. august 2005 om ændring af Rådets
