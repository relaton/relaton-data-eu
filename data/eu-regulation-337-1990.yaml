title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 337/90 of 8 February 1990 determining the
    extent to which applications in the beef and veal sector for the issue of import
    licences lodged pursuant to Regulation (EEC) No 4024/89 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 337/90 de la Commission, du 8 février 1990, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au titre du règlement (CEE) n 4024/89 dans le secteur
    de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 337/90 der Kommission vom 8. Februar 1990 zur Bestimmung
    des Ausmaßes, in dem den Anträgen auf Erteilung von Einfuhrlizenzen für Rindfleisch
    im Rahmen der Verordnung (EWG) Nr. 4024/89 Rechnung getragen werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 337/90 af 8. februar 1990 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicenser i henhold
    til forordning (EØF) nr. 4024/89 for oksekød kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 337/90 της Επιτροπής
    της 8ης Φεβρουαρίου 1990 για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που κατατίθενται
    βάσει του κανονισμού (ΕΟΚ) αριθ. 2327/89 στον τομέα
    του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 337/90 della Commissione, dell'8 febbraio 1990, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate a norma del regolamento regolamento (CEE) n. 4029/89 nel settore delle
    carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 337/90 van de Commissie van 8 februari 1990 tot vaststelling
