title:
- language: en
  script: Latn
  content: '97/686/EC: Commission Decision of 13 October 1997 recognizing that the
    production of certain quality wines produced in specified regions in Italy, by
    reason of their qualitative characteristics, is far from able to satisfy demand
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/686/CE: Décision de la Commission du 13 octobre 1997 reconnaissant
    que la production de certains vins de qualité produits dans des régions déterminées
    en Italie est, du fait des caractéristiques qualitatives de ces vins, largement
    inférieure à la demande (Le texte en langue italienne est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/686/EG: Entscheidung der Kommission vom 13. Oktober 1997 zur Anerkennung,
    daß die Erzeugung von Qualitätsweinen bestimmter Anbaugebiete in Italien wegen
    qualitativer Merkmale der Nachfrage nicht entspricht (Nur der italienische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/686/EF: Kommissionens beslutning af 13. oktober 1997 om anerkendelse
    af, at produktionen af visse kvalitetsvine fra bestemte dyrkningsområder i Italien
    på grund af disse vines kvalitative egenskaber langtfra er tilstrækkelig til
    at dække efterspørgslen (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/686/ΕΚ: Απόφαση της Επιτροπής της 13ης Οκτωβρίου
    1997 με την οποία αναγνωρίζεται ότι η παραγωγή
    ορισμένων οίνων ποιότητας που παράγονται σε
    καθορισμένες περιοχές της Ιταλίας είναι, λόγω
    των ποιοτικών χαρακτηριστικών των οίνων αυτών,
    σε μεγάλο βαθμό κατώτερη από τη ζήτηση (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/686/EY: Komission päätös, tehty 13 päivänä lokakuuta 1997, tiettyjen
    Italiassa määritetyillä alueilla tuotettujen laatuviinien tuotannon toteamisesta
    niiden laatuominaisuuksien vuoksi huomattavasti kysyntää pienemmäksi (Ainoastaan
    italiankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/686/CE: Decisione della Commissione del 13 ottobre 1997 che riconosce
    la produzione di taluni vini di qualità prodotti in determinate regioni d''Italia
    largamente inferiore alla domanda a causa delle caratteristiche qualitative di
    tali vini (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/686/EG: Beschikking van de Commissie van 13 oktober 1997 houdende erkenning
    van het feit dat de productie van sommige in bepaalde productiegebieden in Italië
    voortgebrachte kwaliteitswijnen, gezien de kwaliteitskenmerken van deze wijnen,
    ver bij de vraag achterblijft (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/686/CE: Decisão da Comissão de 13 de Outubro de 1997 que reconhece
    que a produção em Itália de determinados vinhos de qualidade produzidos em
    regiões determinadas é, pelas suas características de qualidade, substancialmente
    inferior à procura (Apenas faz fé o texto em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '97/686/CE: Decisión de la Comisión de 13 de octubre de 1997 por la que
    se reconoce que la producción en Italia de determinados vinos de calidad producidos
    en regiones determinadas es muy inferior a la demanda, debido a sus características
    cualitativas (El texto en lengua italiana es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '97/686/EG: Kommissionens Beslut av den 13 oktober 1997 om erkännande
    av att produktionen av vissa kvalitetsviner som framställs i specificerade områden
    i Italien på grund av dessa viners kvalitativa egenskaper ligger långt under
    efterfrågan (Endast den italienska texten är giltig)'
  type: main
