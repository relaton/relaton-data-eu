---
id: EUDecision2016771
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/771 of 13 May 2016 temporarily
    authorising Spain to approve for marketing seed of the species Pinus radiata D.
    Don imported from New Zealand, which does not satisfy the requirements of Council
    Directive 1999/105/EC in respect of identification and labelling, and planting
    stock produced from that seed (notified under document C(2016) 2784)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/771 de la Commission du 13 mai 2016 autorisant
    temporairement l'Espagne à admettre la commercialisation de semences de l'espèce
    Pinus radiata D. Don importées de Nouvelle-Zélande, ne satisfaisant pas aux
    exigences de la directive 1999/105/CE du Conseil en matière d'identification
    et d'étiquetage, et de plants issus de ces semences [notifiée sous le numéro
    C(2016) 2784]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/771 der Kommission vom 13. Mai 2016 zur
    vorübergehenden Ermächtigung Spaniens, aus Neuseeland eingeführtes Saatgut
    der Art Pinus radiata D. Don, das den Anforderungen der Richtlinie 1999/105/EG
    des Rates in Bezug auf die Kennzeichnung und Etikettierung nicht entspricht, und
    daraus erzeugtes Pflanzgut zum Verkehr zuzulassen (Bekanntgegeben unter Aktenzeichen
    C(2016) 2784)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/771 на Комисията
    от 13 май 2016 година за предоставяне на временно
    разрешение на Испания да одобрява за търговия
    семена от вида Pinus radiata D. Don, внесени от Нова
    Зеландия и неотговарящи на изискванията на
    Директива 1999/105/ЕО на Съвета по отношение на
    идентификацията и етикетирането, и посадъчен
    материал, произведен от посочените семена
    (нотифицирано под номер С(2016) 2784)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/771 ze dne 13. května 2016,
    kterým se Španělsko dočasně opravňuje, aby povolilo uvádění na trh osiva
    druhu Pinus radiata D. Don dovezeného z Nového Zélandu, které nesplňuje požadavky
    směrnice Rady 1999/105/ES na identifikaci a označování, a sadebního materiálu
    vyprodukovaného z tohoto osiva (oznámeno pod číslem C(2016) 2784)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/771 af 13. maj 2016 om
    midlertidig bemyndigelse af Spanien til at godkende markedsføring af frø af
    arten Pinus radiata D. Don, der er importeret fra New Zealand, og som ikke opfylder
    identifikations- og mærkningskravene i Rådets direktiv 1999/105/EF af plantemateriale
    til plantning fremstillet af sådanne frø (meddelt under nummer C(2016) 2784)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/771 της Επιτροπής,
    της 13ης Μαΐου 2016, με την οποία η Ισπανία εξουσιοδοτείται
    προσωρινά να εγκρίνει την εμπορία σπόρων του
    είδους Pinus radiata D. Don, οι οποίοι εισάγονται από
    τη Νέα Ζηλανδία και δεν πληρούν τις απαιτήσεις
    της οδηγίας 1999/105/ΕΚ του Συμβουλίου όσον αφορά
    την ταυτοποίηση και την επισήμανση, καθώς και
    μητρικού υλικού παραγόμενου από τους σπόρους
    αυτούς [κοινοποιηθείσα υπό τον αριθμό C(2016)
    2784]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/771, 13. mai 2016, millega ajutiselt
    lubatakse Hispaanial turustamiseks heaks kiita Uus-Meremaalt imporditud liigi
    Pinus radiata D. Don seeme, mille identifitseerimine ja märgistamine ei ole kooskõlas
    nõukogu direktiivi 1999/105/EÜ nõuetega, ja sellest seemnest kasvatatud istutusmaterjal
    (teatavaks tehtud numbri C(2016) 2784 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/771, annettu 13 päivänä
    toukokuuta 2016, tilapäisen luvan antamisesta Espanjalle sallia sellaisten Uudesta-Seelannista
    tuotujen lajin Pinus radiata D. Don siementen sekä näistä siemenistä tuotettujen
    taimien pitäminen kaupan, jotka eivät täytä neuvoston direktiivin 1999/105/EY
    vaatimuksia tunnistetietojen ja merkintöjen osalta (tiedoitettu dokumentissa
    C(2016) 2784)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/771 оd 13. svibnja 2016. o privremenom
    dopuštenju Španjolskoj da odobri stavljanje na tržište sjemena vrste Pinus
    radiata D. Don uvezenog iz Novog Zelanda koje ne udovoljava zahtjevima Direktive
    Vijeća 1999/105/EZ u pogledu identifikacije i označivanja te sadnog materijala
    proizvedenog od tog sjemena (priopćeno pod brojem dokumenta C(2016) 2784)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/771 végrehajtási határozata (2016. május 13.)
    az 1999/105/EK tanácsi irányelvben meghatározott azonosítási és címkézési
    követelményeknek nem megfelelő, Új-Zélandból importált Pinus radiata D.
    Don fajok vetőmagja és az e magból előállított ültetési anyagok forgalmazásának
    engedélyezése tekintetében Spanyolországnak biztosítandó ideiglenes felhatalmazásról
    (az értesítés a C(2016) 2784. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/771 della Commissione, del 13 maggio
    2016, che autorizza temporaneamente la Spagna ad approvare a fini di commercializzazione
    sementi della specie Pinus radiata D. Don, importate dalla Nuova Zelanda, che
    non soddisfano i requisiti della direttiva 1999/105/CE del Consiglio relativamente
    all'identificazione e all'etichettatura, nonché postime ottenuto da dette sementi
    [notificata con il numero C(2016) 2784]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/771 (2016. gada 13. maijs), ar
    ko uz laiku atļauj Spānijai apstiprināt Padomes Direktīvas 1999/105/EK prasībām
    identificēšanas un marķēšanas ziņā neatbilstošu no Jaunzēlandes importētu
    sugas Pinus radiata D. Don sēklu un no tām iegūta stādāmā materiāla tirdzniecību
    (izziņots ar dokumenta numuru C(2016) 2784)
  type: main
- language: lt
  script: Latn
  content: 2016 m. gegužės 13 d. Komisijos įgyvendinimo sprendimas (ES) 2016/771,
    kuriuo Ispanijai suteikiama laikina teisė leisti prekiauti iš Naujosios Zelandijos
    importuotomis Pinus radiata D. Don rūšies sėklomis, neatitinkančiomis Tarybos
    direktyvos 1999/105/EB identifikavimo ir ženklinimo reikalavimų, ir iš tų
    sėklų išauginta sodinamąja medžiaga (pranešta dokumentu Nr. C(2016) 2784)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/771 tat-13 ta'
    Mejju 2016 li tawtorizza temporanjament lil Spanja sabiex tapprova il-kummerċjalizzazzjoni
    taż-żerriegħa tal-ispeċi Pinus radiata D. Don impurtata minn New Zealand,
    li ma tissodisfax ir-rekwiżiti tad-Direttiva tal-Kunsill 1999/105/KE fir-rigward
    tal-identifikazzjoni u t-tikkettar, u tal-istokk għat-tħawwil prodott minn dik
    iż-żerriegħa (notifikata bid-dokument C(2016) 2784)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/771 van de Commissie van 13 mei 2016 tot verlening
    van een tijdelijke machtiging aan Spanje om het in de handel brengen toe te staan
    van uit Nieuw-Zeeland ingevoerd zaad van de soort Pinus radiata D. Don, dat niet
    voldoet aan de identificatie- en etiketteringsvoorschriften van Richtlijn 1999/105/EG
    van de Raad, alsmede van uit dat zaad geproduceerd plantgoed (Kennisgeving geschied
    onder nummer C(2016) 2784)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/771 z dnia 13 maja 2016 r. tymczasowo
    zezwalająca Hiszpanii na zatwierdzanie wprowadzania do obrotu nasion gatunku
    Pinus radiata D. Don przywożonych z Nowej Zelandii niespełniających wymagań
    dyrektywy Rady 1999/105/WE w odniesieniu do identyfikacji i etykietowania oraz
    materiału sadzeniowego wyprodukowanego z tych nasion (notyfikowana jako dokumenr
    nr C(2016) 2784)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/771 da Comissão, de 13 de maio de 2016,
    que autoriza temporariamente a Espanha a permitir a comercialização de sementes
    da espécie Pinus radiata D. Don importadas da Nova Zelândia que não cumpram
    as exigências relativas à identificação e à rotulagem definidas na Diretiva
    1999/105/CE do Conselho, assim como de plantas para arborização produzidas a
    partir dessas sementes [notificada com o número C(2016) 1784]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/771 a Comisiei din 13 mai 2016
    de autorizare temporară a Spaniei să aprobe în vederea comercializării semințele
    din specia Pinus radiata D. Don importate din Noua Zeelandă care nu îndeplinesc
    cerințele din Directiva 1999/105/CE a Consiliului în ceea ce privește identificarea
    și etichetarea, precum și materialul de plantare obținut din respectivele semințe
    [notificată cu numărul C(2016) 2784]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/771 z 13. mája 2016, ktorým
    sa Španielsku dočasne povoľuje, aby schválilo uvádzanie semien druhu Pinus
    radiata D. Don dovezených z Nového Zélandu, ktoré nespĺňajú požiadavky
    na identifikáciu a označovanie podľa smernice Rady 1999/105/ES, a sadiva vyprodukovaného
    z týchto semien na trh [oznámené pod číslom C(2016) 2784]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/771 z dne 13. maja 2016 o začasnem
    dovoljenju Španiji, da odobri trženje semena vrste Pinus radiata D. Don, ki
    je uvoženo iz Nove Zelandije in ne izpolnjuje zahtev Direktive Sveta 1999/105/ES
    v zvezi z identifikacijo in označevanjem, ter sadilnega materiala iz tega semena
    (notificirano pod dokumentarno številko C(2016) 2784)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/771 de la Comisión, de 13 de mayo de
    2016, por la que se autoriza temporalmente a España a permitir la comercialización
    de semillas de la especie Pinus radiata D. Don, importadas de Nueva Zelanda, que
    no cumplen los requisitos de la Directiva 1999/105/CE por lo que respecta a la
    identificación y el etiquetado, y de plantas producidas a partir de dichas semillas
    [notificada con el número C(2016) 2784]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/771 av den 13 maj 2016 om tillstånd
    för Spanien att tillfälligt godkänna saluföring av utsäde av arten Pinus
    radiata D. Don som importerats från Nya Zeeland och som inte uppfyller kraven
    för identifiering och märkning i rådets direktiv 1999/105/EG, och plantpartier
    producerade av detta utsäde [delgivet med nr C(2016) 2784]
