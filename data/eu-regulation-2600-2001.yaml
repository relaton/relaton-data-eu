  content: Commission Regulation (EC) No 2600/2001 of 28 December 2001 authorising
    transfers between the quantitative limits of textiles and clothing products originating
    in Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2600/2001 de la Commission du 28 décembre 2001 autorisant
    des transferts entre les limites quantitatives de produits textiles et d'habillement
    originaires de Taïwan
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2600/2001 der Kommission vom 28. Dezember 2001 zur
    Genehmigung von Übertragungen zwischen den Höchstmengen für Textilwaren und
    Bekleidung mit Ursprung in Taiwan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2600/2001 af 28. december 2001 om tilladelse
    til overførsel mellem de kvantitative lofter for tekstilvarer og beklædningsgenstande
    med oprindelse i Taiwan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2600/2001 της Επιτροπής,
    της 28ης Δεκεμβρίου 2001, που εγκρίνει μεταφορές
    μεταξύ των ποσοτικών ορίων για τα κλωστοϋφαντουργικά
    προϊόντα και τα είδη ένδυσης καταγωγής Ταϊβάν
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2600/2001, annettu 28 päivänä joulukuuta 2001,
    luvan antamisesta siirtoihin Taiwanista peräisin olevien tekstiili- ja vaatetustuotteiden
    määrällisten rajoitusten välillä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2600/2001 della Commissione, del 28 dicembre 2001,
    che autorizza i trasferimenti tra i limiti quantitativi per i prodotti tessili
    e dell'abbigliamento originari di Taiwan
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2600/2001 van de Commissie van 28 december 2001 waarbĳ
    machtiging wordt verleend tot de overdracht tussen de kwantitatieve beperkingen
    voor textiel- en kledingproducten van oorsprong uit Taiwan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2600/2001 da Comissão, de 28 de Dezembro de 2001,
    que autoriza transferências entre os limites quantitativos aplicáveis aos produtos
    têxteis e de vestuário originários de Taiwan
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2600/2001 de la Comisión, de 28 de diciembre de 2001,
