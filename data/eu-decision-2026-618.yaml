    ning nende liikmesriikide ja teiselt poolt Ukraina vahelise assotsieerimislepinguga
    moodustatud ELi-Ukraina assotsieerimisnõukogus võetav seisukoht seoses avaliku
    halduse reformi allkomitee loomisega ning Euroopa Regioonide Komitee ja Ukraina
    valitud kohalike ja piirkondlike omavalitsuste vahelise ühise nõuandekomitee
    loomise heakskiitmisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2026/618, annettu 16 päivänä maaliskuuta 2026,
    Euroopan unionin ja Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden
    sekä Ukrainan välisellä assosiaatiosopimuksella perustetussa EU:n ja Ukrainan
    assosiaationeuvostossa Euroopan unionin puolesta esitettävästä kannasta julkishallinnon
    uudistamista käsittelevän alakomitean perustamiseen sekä Euroopan alueiden
    komitean ja Ukrainan vaaleilla valittujen paikallis- ja alueviranomaisten välisen
    neuvoa-antavan sekakomitean perustamisen hyväksymiseen
  type: main
