    áitiúla agus réigiúnacha tofa na hÚcráine a fhormhuiniú
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2026/618 od 16. ožujka 2026. o stajalištu koje treba
    zauzeti u ime Europske unije u okviru Vijeća za pridruživanje EU – Ukrajina
    osnovanog Sporazumom o pridruživanju između Europske unije i Europske zajednice
    za atomsku energiju te njihovih država članica, s jedne strane, i Ukrajine,
    s druge strane, u pogledu osnivanja Pododbora za reformu javne uprave i potvrđivanja
    osnivanja Zajedničkog savjetodavnog odbora Europskog odbora regija te izabranih
    lokalnih i regionalnih tijela Ukrajine
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2026/618 határozata (2026. március 16.) az egyrészről
    az Európai Unió, az Európai Atomenergia-közösség és tagállamaik, másrészről
    Ukrajna közötti társulási megállapodással létrehozott EU–Ukrajna Társulási
    Tanácsban a közigazgatási reformmal foglalkozó albizottság létrehozásával,
    valamint a Régiók Európai Bizottsága és Ukrajna választott helyi és regionális
    hatóságai közötti konzultatív vegyes bizottság létrehozásának jóváhagyásával
    kapcsolatban az Európai Unió által képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2026/618 del Consiglio, del 16 marzo 2026, relativa alla
    posizione da adottare a nome dell’Unione europea in sede di Consiglio di associazione
