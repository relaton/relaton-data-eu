    ska intas på Europeiska unionens vägnar i associeringsrådet EU–Ukraina som
    inrättats genom associeringsavtalet mellan Europeiska unionen och Europeiska
    atomenergigemenskapen och deras medlemsstater, å ena sidan, och Ukraina, å andra
    sidan, vad gäller inrättandet av underkommittén för reform av den offentliga
    förvaltningen och godkännande av inrättandet av den gemensamma rådgivande
    kommittén mellan Europeiska regionkommittén och Ukrainas valda lokala och regionala
