    de asociere UE-Ucraina instituit prin Acordul de asociere dintre Uniunea Europeană
    și Comunitatea Europeană a Energiei Atomice și statele membre ale acestora,
    pe de o parte, și Ucraina, pe de altă parte, în ceea ce privește constituirea
    Subcomitetului pentru reforma administrației publice și aprobarea constituirii
    Comitetului consultativ mixt dintre Comitetul European al Regiunilor și autoritățile
    locale și regionale alese din Ucraina
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2026/618 zo 16. marca 2026 o pozícii, ktorá sa
    má v mene Európskej únie prijať v Rade pre pridruženie medzi EÚ a Ukrajinou,
    zriadenej Dohodou o pridružení medzi Európskou úniou a Európskym spoločenstvom
    pre atómovú energiu a ich členskými štátmi na jednej strane a Ukrajinou
    na strane druhej, pokiaľ ide o zriadenie Podvýboru pre reformu verejnej správy
    a schválenie zriadenia zmiešaného poradného výboru medzi Európskym výborom
    regiónov a volenými miestnymi a regionálnymi orgánmi Ukrajiny
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2026/618 z dne 16. marca 2026 o stališču, ki naj se
    v imenu Evropske unije zastopa v Pridružitvenem svetu EU-Ukrajina, ustanovljenem
    s Sporazumom o pridružitvi med Evropsko unijo in Evropsko skupnostjo za atomsko
    energijo in njunimi državami članicami na eni strani ter Ukrajino na drugi strani,
    v zvezi z ustanovitvijo Pododbora za reformo javne uprave in potrditvijo ustanovitve
    Skupnega posvetovalnega odbora med Evropskim odborom regij ter izvoljenimi lokalnimi
    in regionalnimi organi Ukrajine
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2026/618 del Consejo, de 16 de marzo de 2026, relativa a
    la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Asociación UE-Ucrania establecido por el Acuerdo de Asociación entre la Unión
    Europea y la Comunidad Europea de la Energía Atómica y sus Estados miembros,
    por una parte, y Ucrania, por otra, con respecto a la creación del Subcomité
    para la Reforma de la Administración Pública y al refrendo de la creación del
    Comité Consultivo Mixto entre el Comité Europeo de las Regiones y las autoridades
    locales y regionales elegidas de Ucrania
  type: main
