    UE–Ukraina ustanowionej na mocy Układu o stowarzyszeniu między Unią Europejską
    i Europejską Wspólnotą Energii Atomowej oraz ich państwami członkowskimi,
    z jednej strony, a Ukrainą, z drugiej strony, w odniesieniu do ustanowienia Podkomitetu
    ds. Reformy Administracji Publicznejoraz w sprawie zatwierdzenia ustanowienia
    Wspólnego Komitetu Konsultacyjnegomiędzy Europejskim Komitetem Regionów a wybranymi
    władzami lokalnymi i regionalnymi Ukrainy
  type: main
