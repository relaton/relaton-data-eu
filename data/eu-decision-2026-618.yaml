    įsteigtoje Europos Sąjungos ir Europos atominės energijos bendrijos bei jų
    valstybių narių ir Ukrainos asociacijos susitarimu, dėl Viešojo administravimo
    reformos pakomitečio įsteigimo ir dėl pritarimo Europos regionų komiteto ir
    Ukrainos išrinktų vietos valdžios institucijų jungtinio konsultacinio komiteto
    įsteigimui
  type: main
