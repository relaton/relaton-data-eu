title:
- language: en
  script: Latn
  content: Council Decision (EU) 2026/618 of 16 March 2026 on the position to be adopted
    on behalf of the European Union within the EU-Ukraine Association Council established
    by the Association Agreement between the European Union and the European Atomic
    Energy Community and their Member States, of the one part, and Ukraine, of the
    other part, as regards the establishment of the Public Administration Reform Sub-Committee
    and the endorsement of the establishment of the Joint Consultative Committee between
    the European Committee of the Regions and the elected local and regional authorities
    of Ukraine
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/618 du Conseil du 16 mars 2026 relative à la position
    à prendre au nom de l’Union européenne au sein du conseil d’association
    UE-Ukraine établi par l’accord d’association entre l’Union européenne
    et la Communauté européenne de l’énergie atomique et leurs États membres,
    d’une part, et l’Ukraine, d’autre part, en ce qui concerne la création
    du sous-comité chargé de la réforme de l’administration publique et l’approbation
    de la création du comité consultatif paritaire entre le Comité européen des
    régions et les autorités locales et régionales ukrainiennes élues
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/618 des Rates vom 16. März 2026 zur Festlegung des
    im Namen der Europäischen Union in dem mit dem Assoziierungsabkommen zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und der Ukraine andererseits eingesetzten Assoziationsrat EU-Ukraine
    in Bezug auf die Einsetzung des Unterausschusses für die Reform der öffentlichen
    Verwaltung und die Billigung der Einsetzung des Gemischten Beratenden Ausschusses
    zwischen dem Europäischen Ausschuss der Regionen und den gewählten lokalen und
    regionalen Gebietskörperschaften der Ukraine zu vertretenden Standpunkts
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2026/618 на Съвета от 16 март 2026
    година относно позицията, която трябва да се
    заеме от името на Европейския съюз в рамките
    на Съвета за асоцииране ЕС — Украйна, създаден
    със Споразумението за асоцииране между Европейския
    съюз и Европейската общност за атомна енергия
    и техните държави членки, от една страна, и
    Украйна, от друга страна, относно създаването
    на Подкомитет за реформа на публичната администрация
    и одобряване на създаването на Съвместен консултативен
    комитет между Европейския комитет на регионите
    и избраните местни и регионални органи на Украйна
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2026/618 ze dne 16. března 2026 o postoji, který
    má být zaujat jménem Evropské unie v Radě přidružení EU–Ukrajina, zřízené
    Dohodou o přidružení mezi Evropskou unií a Evropským společenstvím pro
    atomovou energii a jejich členskými státy na jedné straně a Ukrajinou na
    straně druhé, pokud jde o zřízení Podvýboru pro reformu veřejné správy,
    a o schválení zřízení Smíšeného poradního výboru mezi Evropským výborem
    regionů a volenými místními a regionálními orgány Ukrajiny
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2026/618 af 16. marts 2026 om den holdning, der
    skal indtages på Den Europæiske Unions vegne i Associeringsrådet EU-Ukraine
    oprettet i henhold til associeringsaftalen mellem Den Europæiske Union og Det
    Europæiske Atomenergifællesskab og deres medlemsstater på den ene side og Ukraine
    på den anden side, til oprettelsen af underudvalget for reform af den offentlige
    forvaltning og godkendelsen af oprettelsen af det blandede rådgivende udvalg
    mellem Det Europæiske Regionsudvalg og de valgte lokale og regionale myndigheder
    i Ukraine
  type: main
- language: el
  script: Grek
