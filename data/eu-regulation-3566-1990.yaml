title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3566/90 of 6 December 1990 establishing
    the list of products processed from fruit and vegetables the granting of import
    licences for which is covered by special rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3566/90 de la Commission, du 6 décembre 1990, établissant
    la liste des produits transformés à base de fruits et légumes pour lesquels
    l'octroi des certificats d'importation est soumis à des conditions particulières
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3566/90 der Kommission vom 6. Dezember 1990 zur Auflistung
    der Verarbeitungserzeugnisse aus Obst und Gemüse, bei denen die Erteilung von
    Einfuhrlizenzen besonderen Bedingungen unterliegt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3566/90 af 6. december 1990 om listen
    over produkter, der er forarbejdet på basis af frugt og grønsager, og for hvilke
    udstedelse af importlicenser sker på særlige betingelser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3566/90 της Επιτροπής
    της 6ης Δεκεμβρίου 1990 για τον καθορισμό του
    καταλόγου των μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά για τα οποία η χορήγηση των
    πιστοποιητικών εισαγωγής υπόκειται σε ειδικούς
    όρους
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3566/90, annettu 12 päivänä joulukuuta 1990,
    tuontitodistuksia annettaessa erityisedellytykset täyttävien hedelmä- ja vihannesjalosteiden
    luettelosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3566/90 della Commissione, del 6 dicembre 1990, che
    stabilisce l'elenco dei prodotti trasformati a base di ortofrutticoli per i quali
    la concessione dei titoli d'importazione è subordinata a condizioni particolari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3566/90 van de Commissie van 6 december 1990 tot
    vaststelling van de lijst van op basis van groenten en fruit verwerkte produkten
    ten aanzien waarvan voor de toekenning van invoercertificaten bijzondere voorwaarden
    gelden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3566/90 da Comissão, de 6 de Dezembro de 1990, que
    estabelece a lista dos produtos transformados à base de frutas e produtos hortícolas
    para os quais a concessão dos certificados de importação está sujeita a condições
    especiais
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3566/90 de la Comisión, de 6 de diciembre de 1990,
    por el que se establece la lista de los productos transformados a base de frutas
    y hortalizas, respecto a los cuales se somete a condiciones especiales la concesión
    de licencias de importación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3566/90 av den 6 december 1990 om upprättandet
    av en förteckning över bearbetade produkter av frukt och grönsaker för vilka
    beviljandet av importlicenser omfattas av särskilda bestämmelser
  type: main
