---
id: EUDecision1977428
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 April 1977 authorizing the French Republic not
    to apply Community treatment to tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or china (including biscuit
    porcelain and parian) or other kinds of pottery, except common pottery and stoneware,
    falling within heading No 69.11 or subheading 69.12 C or D of the Common Customs
    Tariff, originating in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/428/CEE: Décision de la Commission, du 29 avril 1977, autorisant la
    République française à exclure du traitement communautaire la vaisselle et
    les articles de ménage ou de toilette en porcelaine ou en autres matières céramiques
    que la terre commune ou le grès, des position et sous-positions 69.11 et 69.12
    C et D du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. April 1977, mit der die Französische
    Republik ermächtigt wird, aus Japan stammendes und in den anderen Mitgliedstaaten
    im freien Verkehr befindliches Geschirr sowie Haushalts- und Toilettengegenstände
    aus Porzellan oder aus anderen keramischen Stoffen als gewöhnlichem Ton und Steinzeug,
    der Tarifnummern 69.11 und 69.12 C und D des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 29. april 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage bordservice samt husholdnings-
    og toiletartikler af porcelæn og andet keramisk materiale undtagen af almindeligt
    ler eller stentøj, som henhører under pos. 69.11 og 69.12 C og D i den fælles
    toldtarif, har oprindelse i Japan og frit kan omsættes i de øvrige medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 aprile 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario il vasellame e gli oggetti di
    uso domestico o da toletta, di porcellana o di altre materie ceramiche, esclusi
    la terracotta comune e il gres, di cui alla voce 69.11 e alle sottovoci 69.12
    C e D della tariffa doganale comune, originari del Giappone e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 april 1977 waarbij de Franse Republiek
    wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen, van porselein
    of van andere keramische stoffen dan gewoon aardewerk of gres, van de posten 69.11
    en 69.12 C en D van het gemeenschappelijk douanetarief, van oorsprong uit Japan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
