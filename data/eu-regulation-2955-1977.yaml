    concernenti la concessione della compensazione finanziaria e dell' indennità,
    nonché la fissazione dei prezzi di ritiro e la constatazione dei prezzi d' acquisto
    per determinati prodotti della pesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2955/77 van de Commissie van 23 december 1977 tot
