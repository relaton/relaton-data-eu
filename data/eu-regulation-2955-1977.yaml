    κανονισμού (ΕΟΚ) αριθ. 3559/73 «περί θεσπίσεως
    τών διατάξεων εφαρμογής σχετικά μέ τή χορήγηση
    τής χρηματικής αντισταθμίσεως καί τής αποζημιώσεως
