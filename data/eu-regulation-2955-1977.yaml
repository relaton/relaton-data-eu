title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2955/77 of 23 December 1977 amending Regulation
    (EEC) No 3559/73 laying down detailed rules for granting financial compensation
    and indemnities, fixing the withdrawal price and determining the buying-in price
    for certain fishery products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2955/77 de la Commission, du 23 décembre 1977, modifiant
    le règlement (CEE) n° 3559/73 établissant les dispositions d' application relatives
    à l' octroi de la compensation financière et de l' indemnité ainsi qu' à la
    fixation des prix de retrait et à la détermination des prix d' achat pour certains
    produits de la pêche
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2955/77 der Kommission vom 23. Dezember 1977 zur Änderung
    der Verordnung (EWG) Nr. 3559/73 mit Durchführungsbestimmungen über die Gewährung
    des finanziellen Ausgleichs und der Entschädigung sowie über die Festsetzung
    der Rücknahmepreise und die Feststellung der Ankaufspreise für bestimmte Fischereierzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2955/77 af 23. december 1977 om ændring
    af forordning (EØF) nr. 3559/73 om gennemførelsesbestemmelser for ydelse af
    den finansielle udligning og godtgørelse samt om fastsættelse af tilbagetagelsespriser
    og beregning af købspriser for visse fiskerivarer
  type: main
- language: el
  script: Grek
