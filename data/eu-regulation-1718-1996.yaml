id: EURegulation17181996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1718/96 of 29 August 1996 initiating an investigation
    concerning the circumvention of anti-dumping measures imposed by Council Regulations
    (EEC) No 993/93 and (EEC) No 2887/93 on imports of certain electronic weighing
    scales originating respectively in Japan and Singapore, by imports of parts thereof
    assembled in the European Community and making the latter imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1718/96 de la Commission du 29 août 1996 ouvrant une
    enquête sur le contournement des mesures antidumping instituées par les règlements
    (CEE) nº 993/93 et (CEE) nº 2887/93 du Conseil sur les importations de certaines
    balances électroniques respectivement originaires du Japon et de Singapour par
    des importations de pièces utilisées dans des opérations d'assemblage dans
    la Communauté européenne et rendant l'enregistrement de ces importations obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1718/96 der Kommission vom 29. August 1996 zur Einleitung
    einer Untersuchung betreffend die Umgehung der mit der Verordnung (EWG) Nr. 993/93
    des Rates und der Verordnung (EWG) Nr. 2887/93 des Rates eingeführten Antidumpingzölle
    auf die Einfuhren bestimmter elektronischer Waagen mit Ursprung in Japan bzw.
    Singapur durch die Einfuhren von in der Europäischen Gemeinschaft montierten
    Teilen dieser Waagen und zur zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1718/96 af 29. august 1996 om indledning
    af en undersøgelse vedrørende omgåelse af de antidumpingforanstaltninger, der
    indførtes ved Rådets forordning (EØF) nr. 993/93 og (EØF) nr. 2887/93, på
    importen af visse elektroniske vægte med oprindelse i henholdsvis Japan og Singapore,
    ved import af dele deraf samlet i Det Europæiske Fællesskab og om at gøre sidstnævnte
    import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1718/96 της Επιτροπής
    της 29ης Αυγούστου 1996 για την έναρξη έρευνας
    αναφορικά με την καταστρατήγηση μέτρων αντιντάμπινγκ
    που επιβλήθηκαν με τους κανονισμούς (ΕΟΚ) αριθ.
    993/93 και (ΕΟΚ) αριθ. 2887/93 του Συμβουλίου, επί των
    εισαγωγών ορισμένων ηλεκτρονικών ζυγών καταγωγής,
    αντιστοίχως, Ιαπωνίας και Σιγκαπούρης, με εισαγωγές
    μερών τους που συναρμολογούνται στην Ευρωπαϊκή
    Κοινότητα, και για την υπαγωγή αυτών των εισαγωγών
    σε διαδικασία καταγραφής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1718/96, annettu 29 päivänä elokuuta 1996,
    Japanista ja Singaporesta peräisin olevien elektronisten vaakojen tuonnissa neuvoston
    asetuksilla (ETY) N:o 993/93 ja (ETY) N:o 2887/93 käyttöön otettujen polkumyyntitoimenpiteiden
    kiertämistä tuomalla osat kyseisistä maista ja kokoamalla ne Euroopan yhteisössä
    koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin saattamisesta kirjaamisen
    alaiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1718/96 della Commissione del 29 agosto 1996 che avvia
    un'inchiesta relativa all'elusione delle misure antidumping istituite dai regolamenti
    (CEE) n. 993/93 e (CEE) n. 2887/93 del Consiglio, sulle importazioni di alcuni
    tipi di bilance elettroniche originarie del Giappone e di Singapore per mezzo
    di importazioni di parti degli stessi prodotti per l'assemblaggio nella Comunità
    europea e che stabilisce che tali importazioni devono essere soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1718/96 van de Commissie van 29 augustus 1996 houdende
    opening van een onderzoek naar de ontwijking van de anti-dumpingmaatregelen die
    zijn ingesteld bij de Verordeningen (EEG) nr. 993/93 en (EEG) nr. 2887/93 van
    de Raad, op de invoer van bepaalde elektronische weegschalen van oorsprong uit
    respectievelijk Japan en Singapore, door invoer van onderdelen die geassembleerd
    worden in de Europese Gemeenschap, waardoor deze invoer aan registratie wordt
    onderworpen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1718/96 da Comissão de 29 de Agosto de 1996 que inicia
    um inquérito sobre a evasão das medidas anti-dumping instituídas pelos Regulamentos
    (CEE) nº 993/93 e (CEE) nº 2887/93 do Conselho, sobre a importação de certas
    balanças electrónicas originárias, respectivamente, do Japão e de Singapura,
    através de importações de partes desses produtos destinadas a ser montadas
    na Comunidade Europeia e que torna obrigatório o registo destas últimas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1718/96 de la Comisión de 29 de agosto de 1996 por
    el que se abre una investigación relativa a la elusión de las medidas antidumping
    establecidas por los Reglamentos (CEE) nos 993/93 y 2887/93 del Consejo sobre
    las importaciones de determinadas balanzas electrónicas originarias, respectivamente,
    de Japón y Singapur, mediante importaciones de partes de dichos productos en
    la Comunidad Europea, y por el que estas importaciones se someten a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1718/96 av den 29 augusti 1996 om inledande
    av en undersökning om kringgående av de antidumpningsåtgärder som införts
    genom rådets förordningar (EEG) nr 993/93 och (EEG) nr 2887/93 mot import av
    vissa elektroniska vågar med ursprung i Japan respektive Singapore genom import
    av delar till dessa vågar som hopsatts i Europeiska gemenskapen, och om registrering
    av import av sådana delar
  type: main
