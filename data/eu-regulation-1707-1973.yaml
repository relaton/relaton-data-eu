title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1707/73 of the Council of 26 June 1973 providing for
    special measures in respect of colza and rape seed for sowing, and adapting in
    respect of these products the nomenclature given in Regulations No 136/66/EEC,
    (EEC) No 2358/71 and (EEC) No 950/68
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1707/73 du Conseil, du 26 juin 1973, prévoyant des
    mesures spéciales pour les graines de colza et de navette destinées à l'ensemencement
    et adaptant la nomenclature prévue pour ces produits dans les règlements n°
    136/66/CEE, (CEE) n 2358/71 et (CEE) n 950/68
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1707/73 des Rates vom 26. Juni 1973 zur Festlegung
    von Sondermaßnahmen für zur Aussaat bestimmte Raps- und Rübsensamen und zur
    Anpassung des in den Verordnungen Nr. 136/66/EWG, (EWG) Nr. 2358/71 und (EWG)
    Nr. 950/68 festgelegten Schemas dieser Waren
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EHS) č. 1707/73 ze dne 26. června 1973, kterým se
    stanoví zvláštní opatření pro osivo řepky a řepice a upravuje nomenklatura
    pro tyto produkty uvedená v nařízeních č. 136/66/EHS, (EHS) č. 2358/71 a
    (EHS) č. 950/68
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1707/73 af 26. juni 1973 om fastsættelse
    af særlige foranstaltninger for raps- og rybsfrø til udsæd og om tilpasning
    af den nomenklatur, der er fastsat for disse varer i forordningerne nr. 136/66/EØF)
    nr. 2358/71 og (EØF) nr. 950/68
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1707/73 του Συμβουλίου,
    της 26ης Ιουνίου 1973, περί καθορισμού των ειδικών
    μέτρων για τους σπόρους αγριοκράνδης και αγριογογγύλης
    που προορίζονται για σπορά και με τον οποίο
    προσαρμόζεται η ονοματολογία που προβλέπεται
    για τα προϊόντα αυτά στους Κανονισμούς αριθ.
    136/66/ΕΟΚ, (ΕΟΚ) αριθ. 2358/71 και (ΕΟΚ) αριθ. 950/68
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EMÜ) nr 1707/73, 26. juuni 1973, millega nähakse ette
    erimeetmed rüpsi ja rapsi külviseemnete osas ning kohandatakse kõnealuste toodete
    puhul määrustes nr 136/66/EMÜ, (EMÜ) nr 2358/71 ja (EMÜ) nr 950/68 sätestatud
    nomenklatuuri
  type: main
- language: hu
  script: Latn
  content: A Tanács 1707/73/EGK rendelete (1973. június 26.) a vetésre szánt káposztarepce-
    és réparepcemagra vonatkozó különleges intézkedésekről, valamint a 136/66/EGK,
    a 2358/71/EGK és a 950/68/EGK rendeletben meghatározott nómenklatúra e termékekkel
    kapcsolatos kiigazításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1707/73 del Consiglio, del 26 giugno 1973, che prevede
    misure speciali per i semi di colza e di ravizzone destinati alla semina e adegua
    la nomenclatura prevista per tali prodotti nei regolamenti n. 136/66/CEE, (CEE)
    n. 2358/71 e (CEE) n. 950/68
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EEK) Nr. 1707/73 (1973. gada 26. jūnijs), ar ko noteikti
    īpaši pasākumi attiecībā uz ripša un rapša sēklas materiālu un pielāgota
    Regulā Nr. 136/66/EEK, (EEK) Nr. 2358/71 un (EEK) Nr. 950/68 dotā nomenklatūra
    attiecībā uz šiem produktiem
  type: main
- language: lt
  script: Latn
  content: 1973 m. birželio 26 d. Tarybos reglamentas (EEB) Nr. 1707/73, numatantis
    specialias priemones dėl rapsiuko ir rapso sėklos, skirtos sėjai, ir tikslinantis
    šių produktų nomenklatūrą, pateiktą Reglamentuose Nr. 136/66/EEB, (EEB)
    Nr. 2358/71 ir (EEB) Nr. 950/68
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KEE) Nru No 1707/73 tas-26 ta' Ġunju 1973 li
    jipprovdi għall-miżuri speċjali fir-rigward taż-żerriegħa tal-kolza u tar-rapa
    għaż-żriegħ, u li jaddatta fir-rigward ta' dawn il-prodotti in-nomenklatura
    mogħtija fir-Regolamenti Nru 136/66/KEE, (KEE) Nru 2358/71 u (KEE) Nru 950/68
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1707/73 van de Raad van 26 juni 1973, houdende bijzondere
    maatregelen voor koolzaad en raapzaad, bestemd voor zaaidoeleinden, en houdende
    aanpassing van de nomenclatuur van deze produkten in de Verordeningen nr. 136/66/EEG,
    (EEG) nr. 2358/71 en (EEG) nr. 950/68
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (EWG) nr 1707/73 z dnia 26 czerwca 1973 r. przewidujące
    specjalne środki dotyczące nasion rzepiku i rzepaku z przeznaczeniem do siewu
    oraz dostosowujące w odniesieniu do tych produktów nomenklaturę podaną w rozporządzeniach
    nr 136/66/EWG, (EWG) nr 2358/71 oraz (EWG) nr 950/68
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EHS) č. 1707/73 z 26. júna 1973, ktoré ustanovuje špeciálne
    opatrenia vo vzťahu k repke a repke olejnej na siatie a prispôsobuje vo vzťahu
    k týmto produktom nomenklatúru uvedenú v nariadeniach č. 136/66/EHS, (EHS)
    č. 2358/71 a (EHS) č. 950/68
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EGS) št. 1707/73 z dne 26. junija 1973 o določitvi posebnih
    ukrepov glede semena oljne repice in oljne ogrščice za setev ter o prilagoditvi
    nomenklature, določene v uredbah 136/66/EGS, (EGS) št. 2358/71 in (EGS) št.
    950/68, za te proizvode
  type: main
