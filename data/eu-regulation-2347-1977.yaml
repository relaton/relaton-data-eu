title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2347/77 of 25 October 1977 re-establishing
    the levying of the customs duties on angles, shapes and sections, of iron and
    steel, falling within subheadings 73.11 A II, III, IV a) 2 and IV b), originating
    in Romania to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2347/77 de la Commission, du 25 octobre 1977, portant
    rétablissement de la perception des droits de douane applicables aux profilés
    en fer ou en acier des sous-positions tarifaires 73.11 A II, III, IV a) 2 et IV
    b), originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2347/77 der Kommission vom 25. Oktober 1977 zur Wiedereinführung
    des Zollsatzes für Profile aus Stahl der Tarifstellen 73.11 A II, III, IV a)
    2 und IV b), mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3021/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2347/77 af 25. oktober 1977 om genindførelse
    af opkrævning af toldafgifter for profiler af jern og stål, under pos. 73.11
    A II, III, IV a) 2 og IV b), som har oprindelse i Rumænien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2347/77 della Commissione, del 25 ottobre 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai profilati di ferro
    o di acciaio delle sottovoci doganali 73.11 A II, III, IV a) 2 e IV b), originari
    della Romania beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2347/77 van de Commissie van 25 oktober 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op profielijzer
    en profielstaal, van de posten 73.11 A II, III, IV a) 2 en IV b), van oorsprong
    uit Roemenië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
