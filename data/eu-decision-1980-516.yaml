type: standard
title:
- language: en
  script: Latn
  content: '80/516/EEC: Commission Decision of 6 May 1980 authorizing the French Republic
    not to apply Community treatment to men''s and boys''shirts, woven, falling within
    subheading ex 61.03 A of the Common Customs Tariff (category 8), originating in
    Hong Kong and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/516/CEE: Décision de la Commission, du 6 mai 1980, autorisant la République
    française à exclure du traitement communautaire les chemises et chemisettes
    tissées pour hommes et garçonnets, de la sous-position ex 61.03 A du tarif douanier
    commun (catégorie 8), originaires de Hong-kong et mis en libre pratique dans
    les autres Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/516/EWG: Entscheidung der Kommission vom 6. Mai 1980, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus der
    Tarifstelle ex 61.03 A des Gemeinsamen Zolltarifs (Kategorie 8) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/516/EØF: Kommissionens beslutning af 6. maj 1980 om bemyndigelse af
    Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter), til mænd og drenge, som henhører under
    pos. ex 61.03 A i den fælles toldtarif (kategori 8), har oprindelse i Hongkong
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/516/CEE: Decisione della Commissione, del 6 maggio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie e camicette
    tessute, per uomo e per ragazzo, della sottovoce ex 61.03 A della tariffa doganale
    comune, categoria 8, originarie di Hong Kong e messe in libera pratica negli altri
    Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/516/EEG: Beschikking van de Commissie van 6 mei 1980 waarbij de Franse
    Republiek wordt gemachtigd overhemden en sporthemden, geweven, van post ex 61.03
    A van het gemeenschappelijk douanetarief (categorie 8), van oorsprong uit Hong-Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
