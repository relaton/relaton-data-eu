    2004/926/EK határozat módosításáról'
  type: main
- language: it
  script: Latn
  content: '2014/857/UE: Decisione del Consiglio, del 1 °dicembre 2014 , relativa
    alla notifica da parte del Regno Unito di Gran Bretagna e Irlanda del Nord che
    desidera partecipare ad alcune disposizioni dell''acquis di Schengen contenute
    in atti dell''Unione nel settore della cooperazione di polizia e della cooperazione
    giudiziaria in materia penale e che modifica le decisioni 2000/365/CE e 2004/926/CE'
  type: main
- language: lv
  script: Latn
  content: '2014/857/ES: Padomes Lēmums ( 2014. gada 1. decembris ) par Lielbritānijas
    un Ziemeļīrijas Apvienotās Karalistes paziņojumu, ka tā vēlas piedalīties
    dažos Šengenas acquis noteikumos, kas ietilpst Savienības tiesību aktos par
