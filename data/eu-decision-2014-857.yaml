    σε ορισμένες από τις διατάξεις του κεκτημένου
    Σένγκεν που περιέχονται σε πράξεις της Ένωσης
    στον τομέα της αστυνομικής συνεργασίας και
    της δικαστικής συνεργασίας σε ποινικά ζητήματα
