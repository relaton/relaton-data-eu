title:
- language: en
  script: Latn
  content: '2014/857/EU: Council Decision of 1 December 2014 concerning the notification
    of the United Kingdom of Great Britain and Northern Ireland of its wish to take
    part in some of the provisions of the Schengen acquis which are contained in acts
    of the Union in the field of police cooperation and judicial cooperation in criminal
    matters and amending Decisions 2000/365/EC and 2004/926/EC'
  type: main
- language: fr
  script: Latn
  content: '2014/857/UE: Décision du Conseil du 1 er décembre 2014 concernant la
    notification par le Royaume-Uni de Grande-Bretagne et d''Irlande du Nord de son
    souhait de prendre part à certaines dispositions de l''acquis de Schengen qui
    sont contenues dans les actes de l''Union dans le domaine de la coopération policière
    et de la coopération judiciaire en matière pénale et modifiant les décisions
    2000/365/CE et 2004/926/CE'
  type: main
- language: de
  script: Latn
  content: '2014/857/EU: Beschluss des Rates vom 1. Dezember 2014 über die Mitteilung
    des Vereinigten Königreichs Großbritannien und Nordirland, dass es sich an einigen
    der Bestimmungen des Schengen-Besitzstands, die in Rechtsakten der Union im Bereich
    der polizeilichen Zusammenarbeit und der justiziellen Zusammenarbeit in Strafsachen
    enthalten sind, beteiligen möchte, und zur Änderung der Beschlüsse 2000/365/EG
    und 2004/926/EG'
  type: main
- language: bg
  script: Cyrl
  content: '2014/857/ЕС: Решение на Съвета от 1 декември
    2014 година относно нотифицирането на желанието
    на Обединеното кралство Великобритания и Северна
    Ирландия да участва в някои разпоредби от достиженията
    на правото от Шенген, които се съдържат в актове
    на Съюза в областта на полицейското и на съдебното
    сътрудничество по наказателноправни въпроси,
    и за изменение на решения 2000/365/ЕО и 2004/926/ЕО'
  type: main
- language: cs
  script: Latn
  content: '2014/857/EU: Rozhodnutí Rady ze dne 1. prosince 2014 o oznámení Spojeného
    království Velké Británie a Severního Irska, že si přeje účastnit se
    některých ustanovení schengenského acquis , jež jsou obsažena v aktech Unie
    v oblasti policejní spolupráce a justiční spolupráce v trestních věcech,
    a o změně rozhodnutí 2000/365/ES a 2004/926/ES'
  type: main
- language: da
  script: Latn
  content: '2014/857/EU: Rådets afgørelse af 1. december 2014 om meddelelsen fra
    Det Forenede Kongerige Storbritannien og Nordirland om, at det ønsker at deltage
    i visse bestemmelser i Schengenreglerne, som findes i EU-retsakter på området
    politisamarbejde og retligt samarbejde i straffesager, og om ændring af afgørelse
    2000/365/EF og 2004/926/EF'
  type: main
- language: el
  script: Grek
  content: '2014/857/ΕΕ: Απόφαση του Συμβουλίου, της 1ης
