title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2022/92 of 20 July 1992 on detailed rules
    of application for the minimum price to be paid to producers for certain tomatoes
    delivered for processing and repealing Regulation (EEC) No 2036/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2022/92 de la Commission, du 20 juillet 1992, portant
    modalités d'application du prix minimal à payer au producteur pour certaines
    tomates livrées à l'industrie et abrogeant le règlement (CEE) n° 2036/91
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2022/92 der Kommission vom 20. Juli 1992 mit Durchführungsbestimmungen
    zur Zahlung des Erzeugermindestpreises für bestimmte Verarbeitungstomaten und
    zur Aufhebung der Verordnung (EWG) Nr. 2036/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2022/92 af 20. juli 1992 om gennemførelsesbestemmelser
    for den minimumspris, der skal betales producenten for visse tomater, der leveres
    til industrien, og om ophævelse af forordning (EØF) nr. 2036/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2022/92 της Επιτροπής
    της 20ής Ιουλίου 1992 για λεπτομέρειες εφαρμογής
    της ελάχιστης τιμής που θα πληρωθεί στον παραγωγό
    για ορισμένες τομάτες που παραδίδονται στη
    βιομηχανία και για κατάργηση του κανονισμού
    (ΕΟΚ) αριθ. 2036/91
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 2022/92, annettu 20 päivänä heinäkuuta 1992,
    tiettyjen jalostettavaksi tarkoitettujen tomaattien tuottajille maksettavan vähimmäishinnan
    soveltamista koskevista yksityiskohtaisista säännöistä ja asetuksen (ETY)
    N:o 2036/91 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2022/92 della Commissione, del 20 luglio 1992, recante
    modalità di applicazione del prezzo minimo da versare al produttore per taluni
    pomodori conferiti all'industria, nonché abrogazione del regolamento (CEE) n.
    2036/91
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2022/92 van de Commissie van 20 juli 1992 tot vaststelling
    van bepalingen voor de toepassing van de aan de teler te betalen minimumprijs
    voor bepaalde tomatenleveranties aan de industrie en tot intrekking van Verordening
    (EEG) nr. 2036/91
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2022/92 da Comissão, de 20 de Julho de 1992, que
    estabelece as normas de execução do preço mínimo a pagar ao produtor por determinados
    tomates entregues à indústria que revoga o Regulamento (CEE) nº 2036/91
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2022/92 de la Comisión, de 20 de julio de 1992, por
    el que se establecen las disposiciones de aplicación del precio mínimo que debe
    pagarse al productor por determinados tomates entregados a la industria y se deroga
    el Reglamento (CEE) nº 2036/91
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 2022/92 av den 20 juli 1992 om tillämpningsföreskrifter
    för det minimipris som skall betalas till producenter för vissa tomater som
    levereras till bearbetning och om upphävande av förordning (EEG) nr 2036/91
  type: main
