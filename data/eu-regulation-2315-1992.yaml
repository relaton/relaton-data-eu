title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2315/92 of 6 August 1992 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of bone-in beef held by
    certain intervention agencies and intended for export to certain destinations,
    amending Regulation (EEC) No 569/88 and repealing Regulation (EEC) No 3755/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2315/92 de la Commission du 6 août 1992 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines non désossées détenues par certains organismes d'intervention
    et destinées à être exportées vers certaines destinations, modifiant le règlement
    (CEE) n° 569/88 et abrogeant le règlement (CEE) n° 3755/91
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2315/92 DER KOMMISSION vom 6. August 1992 über den
    Verkauf von zur Ausfuhr nach gewissen Bestimmungsländern bestimmtem Rindfleisch
    mit Knochen aus Beständen einiger Interventionsstellen nach dem Verfahren der
    Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung (EWG) Nr. 569/88 und
    zur Aufhebung der Verordnung (EWG) Nr. 3755/91 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2315/92 af 6. august 1992 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af ikke-udbenet oksekød fra
    visse interventionsorganer med henblik på udførsel til visse destinationer,
    om ændring af forordning (EØF) nr. 569/88 og om ophævelse af forordning (EØF)
    nr. 3755/91 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2315/92 της Επιτροπής
    της 6ης Αυγούστου 1992 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος με
    κόκαλα που κρατείται από ορισμένους οργανισμούς
    παρέμβασης και προορίζεται για εξαγωγή προς
    ορισμένους προορισμούς, σχετικά με την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 569/88 και την κατάργηση
    του κανονισμού (ΕΟΚ) αριθ. 3755/91
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2315/92 DELLA COMMISSIONE del 6 agosto 1992 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine non disossate detenute da taluni organismi d'' intervento e destinate
    all'' esportazione in talune destinazioni, che modifica il regolamento (CEE) n.
    569/88 e recante abrogazione del regolamento (CEE) n. 3755/91 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2315/92 VAN DE COMMISSIE van 6 augustus 1992 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer naar bepaalde
    bestemmingen bestemd rundvlees met been, houdende wijziging van Verordening (EEG)
    nr. 569/88 en houdende intrekking van Verordening (EEG) nr. 3755/91 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2315/92 DA COMISSÃO de 6 de Agosto de 1992 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) no 2539/84, de
    carne de bovino não desossada detida por certos organismos de intervenção e
    destinada a ser exportada para certos destinos, que altera o Regulamento (CEE)
    no 569/88 e que revoga o Regulamento (CEE) no 3755/91 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2315/92 DE LA COMISIÓN de 6 de agosto de 1992 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno sin deshuesar en poder de determinados organismos de intervención
    y destinadas a ser exportadas a determinados destinos, que modifica el Reglamento
    (CEE) no 569/88 y por el que se deroga el Reglamento (CEE) no 3755/91 #'
