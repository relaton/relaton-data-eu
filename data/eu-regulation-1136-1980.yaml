  content: Council Regulation (EEC) No 1136/80 of 6 May 1980 concerning the temporary
    total suspension of the Common Customs Tariff duties for certain types of electronic
    memories, falling within subheading ex 85.21 D II and repealing Regulation (EEC)
    No 2841/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1136/80 du Conseil, du 6 mai 1980, portant suspension
    temporaire et totale des droits du tarif douanier commun pour certains types de
    mémoires électroniques de la sous-position ex 85.21 D II et abrogeant le règlement
    (CEE) n° 2841/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1136/80 des Rates vom 6. Mai 1980 zur zeitweiligen
    vollständigen Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für bestimmte
    Arten von elektronischen Speichern der Tarifstelle ex 85.21 D II und zur Aufhebung
    der Verordnung (EWG) Nr. 2841/79
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1136/80 af 6. maj 1980 om midlertidig og
    fuldstændig suspension af satserne i den fælles toldtarif for visse elektroniske
