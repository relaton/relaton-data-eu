    (EØF) nr. 2841/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1136/80 del Consiglio, del 6 maggio 1980, che reca
    sospensione temporanea e totale dei dazi della tariffa doganale comune per taluni
