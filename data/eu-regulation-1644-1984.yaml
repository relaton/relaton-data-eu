title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1644/84 of 8 June 1984 re-establishing the
    levying of customs duties on certain articles of apparel and clothing accessories,
    of leather or of composition leather, falling within subheadings 42.03 A, B II
    and III, and C and originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1644/84 de la Commission du 8 juin 1984 portant rétablissement
    de la perception des droits de douane applicables à certains vêtements et accessoires
    du vêtement en cuir naturel, artificiel ou reconstitué, des sous-positions 42.03
    A, B II, III et C du tarif douanier commun, originaires de l' Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1644/84 der Kommission vom 8. Juni 1984 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör, aus Leder oder
    Kunstleder, der Tarifstellen 42.03 A, B II, B III und C mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1644/84 af 8. juni 1984 om genindførelse
    af opkrævning af told for bestemte beklædningsgenstande og tilbehør dertil,
    af læder eller kunstlæder, henhørende under pos. 42.03 A, B II, III, C og med
    oprindelse i Indien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1644/84 της Επιτροπής
    της 8ης Ιουνίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένα ενδύματα
    και εξαρτήματα του ενδύματος εκ δέρματος φυσικού,
    τεχνητού ή ανεσχηματισμένου, των διακρίσεων
    42.03 Α, Β ΙΙ και ΙΙΙ και Γ του Κοινού Δασμολογίου,
    καταγωγής Ινδίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1644/84 della Commissione dell' 8 giugno 1984 che
    ripristina la riscossione dei dazi doganali applicabili a certi oggetti di vestiario
    e loro accessori di cuoio o di pelli, naturali, artificiali o ricostituiti, delle
    sottovoci 42.03 A, B II e III e C della tariffa doganale comune, originari dell'
    India, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1644/84 van de Commissie van 8 juni 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde kleding
    en kledingtoebehoren, van leder of van kunstleder, van postonderverdelingen 42.03
    A, B II, B III en C, van oorsprong uit India, waarvoor de in Verordening (EEG)
    nr. 3569/83 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
