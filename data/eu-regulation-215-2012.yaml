title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 215/2012 of 13 March 2012 amending
    for the 166th time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the Al Qaida network
  type: main
- language: fr
  script: Latn
