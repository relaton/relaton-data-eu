title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3996/88 of 21 December 1988 reducing for
    the 1988/89 wine year the quantities of concentrated grape must in approved contracts
    for use in feedingstuffs as provided for in Regulation (EEC) No 2635/88 and derogating
    from certain time limits for the same wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3996/88 de la Commission du 21 décembre 1988 portant,
    pour la campagne 1988/1989, réduction des quantités de moûts de raisins concentrés
    figurant dans les contrats agréés au titre de l'utilisation dans l'alimentation
    animale ouverte par le règlement (CEE) n° 2635/88, et portant dérogation pour
    la même campagne en ce qui concerne certains délais
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3996/88 DER KOMMISSION vom 21. Dezember 1988 über
    die für das Wirtschaftsjahr 1988/89 vorzunehmende Verringerung der Mengen Traubenmostkonzentrat,
    die in den hinsichtlich der Verfütterung gemäß der Verordnung (EWG) Nr. 2635/88
    gebilligten Verträgen angegeben sind, und zur Abweichung von bestimmten Fristen
    im selben Wirtschaftsjahr #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3996/88 af 21. december 1988 om nedsættelse
    for produktionsåret 1988/89 af de mængder koncentreret druemost, som er anført
    i kontrakter, der er godkendt med henblik på produktets anvendelse til foder
    som omhandlet i forordning (EØF) nr. 2635/88, og om fastsættelse af en undtagelse
    for samme produktionsår, for så vidt angår visse frister
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3996/88 της Επιτροπής
    της 21ης Δεκεμβρίου 1988 για μείωση για την περίοδο
    1988/89 των ποσοτήτων του συμπυκνωμένου γλεύκους
    σταφυλής που εμφαίνεται στις εγκεκριμένες
    συμβάσεις για τη χρησιμοποίηση στη διατροφή
    των ζώων που άνοιξε από τον κανονισμό (ΕΟΚ)
    αριθ. 2635/88 και για παρέκκλιση για την ίδια περίοδο
    όσον αφορά ορισμένες προθεσμίες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3996/88 DELLA COMMISSIONE del 21 dicembre 1988 che
    riduce per la campagna 1988/1989 i quantitativi di mosti di uve concentrati indicati
    nei contratti approvati a titolo dell'' utilizzazione nell'' alimentazione animale
    introdotta dal regolamento (CEE) n. 2635/88 e reca deroga per la stessa campagna
    relativamente ad alcuni termini #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3996/88 VAN DE COMMISSIE van 21 december 1988 houdende
    vermindering, voor het wijnoogstjaar 1988/1989, van de hoeveelheden geconcentreerde
    druivemost in de contracten die zijn goedgekeurd op grond van Verordening (EEG)
    nr. 2635/88 inzake het gebruik van most bij de diervoeding en tot vaststelling
    van afwijkende termijnen voor het wijnoogstjaar 1988/1989 #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3996/88 DA COMISSAO de 21 de Dezembro de 1988 que
    reduz relativamente à campanha de 1988/1989, as quantidades de mostos de uva
    concentrados que constam dos contratos aprovados a titulo da utilizaçao na alimentaçao
    dos animais prevista no Regulamento (CEE) n* 2635/88, e que derroga determinados
    prazos no que diz respeito à referida campanha
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3996/88 DE LA COMISIÓN de 21 de diciembre de 1988
    por el que se reducen las cantidades de mosto de uva concentrado de la campaña
    1988/89 que figuran en los contratos autorizados de conformidad con el Reglamento
    (CEE) no 2635/88 por el que se autoriza su utilización en la alimentación animal
    y por el que se establecen durante esa misma campaña casos de excepción a algunos
    plazos #'
