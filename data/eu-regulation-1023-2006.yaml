    decyzji Rady 2003/286/WE w zakresie koncesji w formie wspólnotowych kontyngentów
    taryfowych na niektóre produkty zbożowe pochodzące z Republiki Bułgarii i
    zmieniające rozporządzenie (WE) nr 2809/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1023/2006 da Comissão, de 5 de Julho de 2006 , que
    altera o Regulamento (CE) n. o 958/2003 que estabelece normas de execução da
    Decisão 2003/286/CE do Conselho no que respeita às concessões sob a forma de
    contingentes pautais comunitários para certos produtos à base de cereais provenientes
    da Republica da Bulgária e que altera o Regulamento (CE) n. o 2809/2000
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1023/2006 z 5. júla 2006 , ktorým sa mení
