  script: Latn
  content: Commission Regulation (EC) No 1023/2006 of 5 July 2006 amending Regulation
    (EC) No 958/2003 laying down detailed rules for the application of Council Decision
    2003/286/EC as regards the concessions in the form of Community tariff quotas
    on certain cereal products originating in the Republic of Bulgaria and amending
    Regulation (EC) No 2809/2000
  type: main
- language: fr
  script: Latn
