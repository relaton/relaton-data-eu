    de Republiek Bulgarije, en tot wijziging van Verordening (EG) nr. 2809/2000
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1023/2006 z dnia 5 lipca 2006 r. zmieniające
