    della Repubblica di Bulgaria e che deroga al regolamento (CE) n. 2809/2000
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1023/2006 ( 2006. gada 5. jūlijs ), ar ko groza
    Regulu (EK) Nr. 958/2003, ar ko paredz sīki izstrādātus noteikumus par to,
    kā piemērot Padomes Lēmumu 2003/286/EK attiecībā uz koncesijām Kopienas
    tarifu kvotu veidā dažiem labības produktiem, kuru izcelsme ir Bulgārijas
    Republikā, un ar ko groza Regulu (EK) Nr. 2809/2000
  type: main
- language: lt
  script: Latn
  content: 2006 m. liepos 5 d. Komisijos reglamentas (EB) Nr. 1023/2006, iš dalies
