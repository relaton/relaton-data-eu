title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2439/78 of 18 October 1978 re-establishing
    the levying of customs duties on illuminating glassware, signalling glassware
    and optical elements, falling within subheading 70.14 A II, originating in Yugoslavia
    and Romania, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2439/78 de la Commission, du 18 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d' éclairage, de signalisation et d' optique commune de la sous-position tarifaire
    70.14 A II, originaire de Yougoslavie et de Roumanie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2439/78 der Kommission vom 18. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr Glaswaren fúr Beleuchtung, fúr Signalvorrichtungen oder
    zu optischen Zwecken, der Tarifstelle 70.14 A II, mit Ursprung in Jugoslawien
    und Rumánien, denen die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2439/78 af 18. oktober 1978 om genindførelse
    af toldafgifter for belysningsartikler af glas; refleksglas; optiske artikler
    af glas, hverken optisk bearbejdet eller af optisk glas, under underposition 70.14
    A II, som har oprindelse i Jugoslavien og Rumænien og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2439/78 della Commissione, del 18 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, della sottovoce 70.14 A II della tariffa
    doganale comune, originarie della Iugoslavia e della Romania beneficiarie delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2439/78 van de Commissie van 18 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas ; optische elementen van gewoon glas,
    niet optisch bewerkt, van onderverdeling 70.14 A II, van oorsprong uit Joegoslavië
    en Roemenië ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
