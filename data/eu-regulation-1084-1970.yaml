    1969/1970 eingelagert und zur Ausfuhr bestimmt sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1084/70 del Consiglio, del 9 giugno 1970, che fissa
    un importo compensativo per il frumento duro e l'orzo che si trovano in stock
    alla fine della campagna di commercializzazione 1969/1970 e che sono destinati
    all'esportazione
  type: main
- language: nl
  script: Latn
