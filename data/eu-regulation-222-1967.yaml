  content: Règlement n° 222/67/CEE de la Commission, du 28 juin 1967, modifiant
    le règlement n° 25/67/CEE relatif aux modalités d'application de la suspension
    du prélèvement à l'importation d'huile d'olive utilisée pour la fabrication
    de certaines conserves
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 222/67/EWG der Kommission vom 28. Juni 1967 zur Änderung
    der Verordnung Nr. 25/67/EWG über Durchführungsbestimmungen für die Aussetzung
    der Einfuhrabschöpfung für Olivenöl zur Herstellung bestimmter Konserven
  type: main
- language: it
  script: Latn
  content: Regolamento n. 222/67/CEE della Commissione, del 28 giugno 1967, che modifica
    il regolamento n. 25/67/CEE relativo alle modalità d'applicazione della sospensione
    del prelievo all'importazione d'olio d'oliva utilizzato nella fabbricazione di
    talune conserve
  type: main
- language: nl
  script: Latn
  content: Verordening no. 222/67/EEG van de Commissie van 28 juni 1967 houdende wijziging
    van Verordening no. 25/67/EEG betreffende de wijze van toepassing van de schorsing
    van de heffing bij invoer van olijfolie die voor de vervaardiging van bepaalde
    conserven wordt gebruikt
