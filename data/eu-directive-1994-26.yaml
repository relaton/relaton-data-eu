title:
- language: en
  script: Latn
  content: Commission Directive 94/26/EC of 15 June 1994 adapting to technical progress
    Council Directive 79/196/EEC on the approximation of the laws of the Member States
    concerning electrical equipment for use in potentially explosive atmospheres employing
    certain types of protection
  type: main
- language: fr
  script: Latn
  content: Directive 94/26/CE de la Commission du 15 juin 1994 portant adaptation
    au progrès technique de la directive 79/196/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives au matériel électrique utilisable
    en atmosphère explosible mettant en oeuvre certains modes de protection
  type: main
- language: de
  script: Latn
  content: RICHTLINIE 94/26/EG DER KOMMISSION vom 15. Juni 1994 zur Anpassung der
    Richtlinie 79/196/EWG des Rates zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    betreffend elektrische Betriebsmittel zur Verwendung in explosibler Atmosphäre,
    die mit bestimmten Zündschutzarten versehen sind, an den technischen Fortschritt
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 94/26/EF af 15. juni 1994 om tilpasning til den
    tekniske udvikling af Rådets direktiv 79/196/EØF om indbyrdes tilnærmelse af
    medlemsstaternes lovgivning vedrørende elektrisk materiel til anvendelse i eksplosionsfarlig
    atmosfære og om indførelse af visse beskyttelsesområder
  type: main
- language: el
  script: Grek
  content: ΟΔΗΓΙΑ 94/26/ΕΚ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 15ης Ιουνίου
    1994 για την προσαρμογή στην τεχνική πρόοδο της
    οδηγίας 79/196/ΕΟΚ του Συμβουλίου περί προσεγγίσεως
    των νομοθεσιών των κρατών μελών που αφορούν
    το ηλεκτρολογικό υλικό που δύναται να χρησιμοποιηθεί
    σε ατμόσφαιρα υπέχουσα τον κίνδυνο εκρήξεως
    και που απαιτεί ορισμένους τρόπους προστασίας
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 94/26/EY, annettu 15 päivänä kesäkuuta 1994, räjähdysvaarallisissa
    tiloissa käytettäviä, tietyn tyyppisellä suojauksella varustettuja sähkölaitteita
    koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun neuvoston
    direktiivin 79/196/ETY mukauttamisesta tekniikan kehitykseen
  type: main
- language: it
  script: Latn
  content: Direttiva 94/26/CE della Commissione del 15 giugno 1994 che adegua al progresso
    tecnico la direttiva 79/196/CEE del Consiglio riguardante il ravvicinamento delle
    legislazioni degli Stati membri relative al materiale elettrico destinato ad essere
    utilizzato in atmosfera esplosiva, per il quale si applicano taluni metodi di
    protezione
  type: main
- language: nl
  script: Latn
  content: Richtlijn 94/26/EG van de Commissie van 15 juni 1994 tot aanpassing aan
    de stand van de techniek van Richtlijn 79/196/EEG van de Raad inzake de onderlinge
    aanpassing van de wetgevingen van de Lid-Staten betreffende elektrisch materieel
    bestemd voor gebruik in "explosieve omgeving", dat aan bepaalde beveiligingswijzen
    voldoet
  type: main
- language: pt
  script: Latn
  content: Directiva 94/26/CE da Comissão de 15 de Junho de 1994 que adapta ao progresso
    técnico a Directiva 79/196/CEE do Conselho relativa à aproximação das legislações
    dos Estados-membros respeitantes ao material eléctrico utilizável em atmosfera
    explosiva que emprega certos tipos de protecção
  type: main
- language: es
  script: Latn
  content: Directiva 94/26/CE de la Comisión de 15 de junio de 1994 por la que se
