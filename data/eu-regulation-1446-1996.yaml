  content: COMMISSION REGULATION (EC) No 1446/96 of 24 July 1996 determining the extent
    to which applications lodged in July 1996 for import licences for certain poultrymeat
    products under the regime provided for in Council Regulation (EC) No 774/94 opening
    and providing for the administration of certain Community tariff quotas for poultrymeat
    and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1446/96 DE LA COMMISSION du 24 juillet 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1996 pour certains produits à base de viande de volaille peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande de volaille et certains autres produits agricoles
  type: main
