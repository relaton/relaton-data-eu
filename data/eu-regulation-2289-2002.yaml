  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2289/2002, annettu 19 päivänä joulukuuta 2002,
    lopullisten polkumyyntitullien käyttöönotosta Intiasta peräisin olevan, läpimitaltaan
    vähintään 1 mm:n ruostumattoman teräslangan tuonnissa annettua neuvoston asetusta
    (EY) N:o 1600/1999 koskevan uuden viejän tarkastelun päättämisestä, tullin
