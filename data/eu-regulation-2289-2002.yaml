    kyseisen tuonnin kirjaamisen lopettamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2289/2002/EK rendelete (2002. december 19.) az Indiából származó,
    1 mm vagy annál nagyobb átmérőjű rozsdamentes acélhuzal behozatalára vonatkozó
    végleges dömpingellenes vámok kivetéséről szóló 1600/1999/EK rendelet
    szerinti új exportőrre vonatkozó felülvizsgálat megszüntetéséről, az
    említett ország egyik exportőrének behozatala tekintetében a vám ismételt
    kivetéséről, valamint e behozatalok bejegyzési kötelezettségének megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2289/2002 del Consiglio, del 19 dicembre 2002, che
    chiude il riesame relativo ai nuovi esportatori del regolamento (CE) n. 1600/1999
    che istituisce dazi antidumping definitivi sulle importazioni di filo di acciaio
    inossidabile avente un diametro pari o superiore a 1 mm originarie dell'India,
    istituisce nuovamente il dazio in vigore nei confronti delle importazioni di un
    esportatore di tale paese e stabilisce che tali importazioni non sono più soggette
    a registrazione
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2289/2002 (2002. gada 19. decembris), ar ko izbeidz
    Regulas (EK) Nr. 1600/1999, ar kuru uzliek galīgos antidempinga maksājumus attiecībā
    uz Indijas izcelsmes nerūsējošā tērauda stiepļu ar 1 mm un lielāku diametru
    importu, pārskatīšanu pēc jauna eksportētāja pieprasījuma, atkārtoti uzliek
    maksājumus attiecībā uz importu, ko veic viens šīs valsts eksportētājs,
    un izbeidz šā importa reģistrēšanu
  type: main
- language: lt
  script: Latn
  content: 2002 m. gruodžio 19 d. Tarybos Reglamentas (EB) Nr. 2289/2002 nutraukiantis
    naujo eksportuotojo peržiūrą pagal Reglamentą (EB) Nr. 1600/1999, nustatantį
    galutinius antidempingo muitus Indijos kilmės nerūdijančio plieno laidų, kurių
    skersmuo – 1 mm arba didesnis, importui, vėl įvedantis muitą vieno šios
    šalies eksportuotojo importui, bei nutraukiantis šio importo registraciją
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2289/2002 tas-19 ta’ Diċembru 2002
    jintemm ir-reviżjoni dwar l-esportatur l-ġdid tar-Regolament (KE) Nru 1600/1999
    fejn jimponi l-miżura definita kontra d-dumping fuq importazzjoni ta’ stainless
    steel wajer b’dajametru ta’ 1 mm jew aktar li ġej mill-Indja, u jerġa’
    jimponi d-dazju fuq l-importazzjonijiet minn esportatur ta’ dan il-pajjiż u
    tintemm ir-reġistrazzjoni ta’ dawn l-importazzjonijiet.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2289/2002 van de Raad van 19 december 2002 tot beëindiging
    van een procedure, ten behoeve van een nieuwe exporteur, voor de herziening van
    Verordening (EG) nr. 1600/1999 tot instelling van definitieve antidumpingrechten
    op roestvrĳ staaldraad met een diameter van 1 mm of meer uit India, tot wederinstelling
    van het recht ten aanzien van een exporteur in dit land en tot beëindiging van
    de registratie van de invoer van dit product
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2289/2002 z dnia 19 grudnia 2002 r. kończące
    weryfikację nowego eksportera w świetle rozporządzenia (WE) nr 1600/1999 nakładającego
    ostateczne cła antydumpingowe na przywóz drutu ze stali nierdzewnej o średnicy
    1 mm lub większej pochodzącego z Indii, nakładające ponownie cło w odniesieniu
    do przywozu od jednego z eksporterów z tego kraju oraz kończące rejestrację
    tego przywozu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2289/2002 do Conselho, de 19 de Dezembro de 2002,
    que encerra um inquérito de reexame de um novo exportador no âmbito do Regulamento
    (CE) n.° 1600/1999, que institui direitos anti-dumping definitivos sobre as importações
    de fios de aço inoxidável de diâmetro igual ou superior a 1 mm originários
    da Índia, e reinstitui os direitos no que respeita às importações de um exportador
    deste país e encerra o registo destas importações
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2289/2002 z 19. decembra 2002, ktorým sa končí
    preskúmanie nariadenia (ES) č. 1600/1999 týkajúce sa nového vývozcu, ktorým
    sa ukladá konečné antidumpingové clo na dovoz drôtu z nehrdzavejúcej ocele
    s priemerom minimálne 1 mm s pôvodom v Indii a ktorým sa opätovne ukladá
    clo s ohľadom na dovoz od jedného vývozcu v tejto krajine a končí registrácia
    takéhoto dovozu
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2289/2002 z dne 19. decembra 2002 o zaključku pregleda
    za novega izvoznika Uredbe (ES) št. 1600/1999 o uvedbi dokončnih protidampinških
    dajatev za uvoz žice iz nerjavnega jekla premera 1 mm ali več po poreklu iz
    Indije, o ponovni uvedbi dajatve v zvezi z uvozom od enega izvoznika v tej državi
    ter o zaključitvi carinske prijave tega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2289/2002 del Consejo, de 19 de diciembre de 2002,
    por el que da por concluido un procedimiento de reconsideración del Reglamento
    (CE) n° 1600/1999, por el que se establecen derechos antidumping definitivos
    sobre las importaciones de alambre de acero inoxidable de diámetro igual o superior
    a 1 mm originarias de la India, respecto de un "nuevo exportador", y por el que
    se impone de nuevo el derecho aplicable a las importaciones procedentes de un
    exportador de ese país y se pone fin al registro de las mismas
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2289/2002 av den 19 december 2002 om avslutande
    av en översyn (avseende ny exportör) av förordning (EG) nr 1600/1999 om införande
    av slutgiltiga antidumpningstullar på import av tråd av rostfritt stål med
    en diameter av minst 1 mm med ursprung i Republiken Indien, om återinförande
    av tullen på import från en exportör i det landet och om avslutande av registrering
    av denna import
