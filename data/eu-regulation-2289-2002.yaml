title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2289/2002 of 19 December 2002 terminating a
    "new exporter" review of Regulation (EC) No 1600/1999 imposing definitive anti-dumping
    duties on imports of stainless steel wire with a diameter of 1 mm or more originating
    in India, re-imposing the duty with regard to imports from one exporter in this
    country and terminating the registration of these imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2289/2002 du Conseil du 19 décembre 2002 clôturant
    un réexamen au titre de "nouvel exportateur" du règlement (CE) n° 1600/1999
    instituant un droit antidumping définitif sur les importations de fils en aciers
    inoxydables d'un diamètre égal ou supérieur à 1 millimètre originaires de
    l'Inde, rétablissant ce droit en ce qui concerne les importations d'un exportateur
    de ce pays et supprimant l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2289/2002 des Rates vom 19. Dezember 2002 zur Einstellung
    der Überprüfung "für einen neuen Ausführer" der Verordnung (EG) Nr. 1600/1999
    zur Einführung endgültiger Antidumpingzölle auf die Einfuhren von Draht aus
    nicht rostendem Stahl mit einem Durchmesser von 1 mm oder mehr mit Ursprung in
    Indien, zur Wiedereinführung des Zolls gegenüber den Einfuhren der Ware von
    einem Ausführer in diesem Land und zur Einstellung der zollamtlichen Erfassung
    dieser Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2289/2002 ze dne 19. prosince 2002, kterým se
    zastavuje přezkum pro nového vývozce nařízení (ES) č. 1600/1999 o uložení
    konečného antidumpingového cla z dovozu drátů z korozivzdorné oceli o průměru
    nejméně 1 mm pocházejících z Indie, opětovně se ukládá clo na dovozy
    od jednoho vývozce v této zemi a zastavuje se celní evidence těchto dovozů
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2289/2002 af 19. december 2002 om afslutning
    af en undersøgelse (vedrørende en ny eksportør) af Rådets forordning (EF)
    nr. 1600/1999 om indførelse af en endelig antidumpingtold på importen af tråd
    af rustfrit stål af diameter 1 mm og derover med oprindelse i Indien og om genindførelse
    af told for så vidt angår importen fra en eksportør i dette land og ophævelse
    af registreringen af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2289/2002 του Συμβουλίου,
    της 19ης Δεκεμβρίου 2002, για την περάτωση της
    διαδικασίας επανεξέτασης ως προς "νέο εξαγωγέα"
    του κανονισμού (ΕΚ) αριθ. 1600/1999 του Συμβουλίου
    για την επιβολή οριστικών δασμών αντιντάμπινγκ
    στις εισαγωγές σύρματος από ανοξείδωτους χάλυβες
    με διάμετρο 1 mm ή περισσότερο, καταγωγής Ινδίας,
    για την εκ νέου επιβολή του δασμού όσον αφορά
