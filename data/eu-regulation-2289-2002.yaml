  script: Latn
  content: Nõukogu määrus (EÜ) nr 2289/2002, 19. detsember 2002, millega lõpetatakse
    uut eksportijat käsitlev läbivaatamine seoses määrusega (EÜ) nr 1600/1999
    Indiast pärit vähemalt 1 mm läbimõõduga roostevaba terastraadi impordi suhtes
    lõpliku dumpinguvastase tollimaksu kehtestamise kohta, kehtestatakse uuesti tollimaks
