    ιού οξείας παράλυσης
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 489/2013, 27. mai 2013 , millega muudetakse
    määruse (EL) nr 37/2010 (mis käsitleb farmakoloogilisi toimeaineid ja nende
    liigitust loomsetes toiduainetes sisalduvate jääkide piirnormide järgi) lisa
    seoses toimeainega kaheahelaline ribonukleiinhape (dsRNA), mis on homoloogne Iisraeli
    akuutse paralüüsi viiruse (IAPV) viiruselise ribonukleiinhappe kapsiidi osa
    ja geenidevahelise piirkonna osa koodiga
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 489/2013, annettu 27 päivänä
    toukokuuta 2013 , farmakologisesti vaikuttavista aineista ja niiden eläinperäisissä
    elintarvikkeissa esiintyvien jäämien enimmäismääriä koskevasta luokituksesta
    annetun asetuksen (EU) N:o 37/2010 liitteen muuttamisesta siltä osin kuin kyse
    vaikuttavasta aineesta kaksisäikeinen ribonukleiinihappo, joka on homologinen
    IAPV-viruksen (Israel Acute Paralysis Virus) ribonukleiinihapon koodin kanssa
    siltä osin kuin on kyse kuoriproteiinin osasta ja geenien välisen alueen osasta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 489/2013 od 27. svibnja 2013. o izmjeni
    Priloga Uredbi (EU) br. 37/2010 o farmakološki djelatnim tvarima i njihovoj klasifikaciji
    u odnosu na najveće dopuštene količine rezidua u hrani životinjskog podrijetla
    u pogledu tvari dvolančane ribonukleinske kiseline homologne virusnoj ribonukleinskoj
    kiselini koja kodira dio proteinskog omotača i dio intergenske regije izraelskog
    virusa akutne paralize
  type: main
- language: hu
  script: Latn
  content: A Bizottság 489/2013/EU végrehajtási rendelete ( 2013. május 27. )
    a farmakológiai hatóanyagokról és az állati eredetű élelmiszerekben előforduló
    maximális maradékanyag-határértékek szerinti osztályozásukról szóló
    37/2010/EU rendelet mellékletének a részben az izraeli akut paralízis vírus
    köpenyfehérjéjét, részben intergénikus régióját kódoló vírus-ribonukleinsavval
    homológ kettős szálú ribonukleinsav hatóanyag tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 489/2013 della Commissione, del 27 maggio
    2013 , che modifica l’allegato del regolamento (UE) n. 37/2010 concernente le
    sostanze farmacologicamente attive e la loro classificazione per quanto riguarda
    i limiti massimi di residui negli alimenti di origine animale con riferimento
    all’acido ribonucleico a doppio filamento omologo all’acido ribonucleico virale
    che codifica una parte della proteina del capside e una parte della regione intergenica
    del virus israeliano della paralisi acuta
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 489/2013 ( 2013. gada 27. maijs
    ), ar ko groza pielikumu Regulai (ES) Nr. 37/2010 par farmakoloģiski aktīvajām
    vielām un to klasifikāciju pēc to atlieku maksimāli pieļaujamā satura dzīvnieku
    izcelsmes pārtikas produktos attiecībā uz dubultspirālisku ribonukleīnskābi,
    kas homologa vīrusa ribonukleīnskābei, kura nosaka apvalka proteīna daļas
    un Izraēlas akūtās paralīzes vīrusa starpgēnu rajona daļas kodu
  type: main
- language: lt
  script: Latn
  content: 2013 m. gegužės 27 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 489/2013,
    kuriuo dėl medžiagos – Izraelio ūminio paralyžiaus viruso dangos baltymo
    dalies ir intergeninio regiono dalies ribonukleino rūgšties kodui homologinės
    dvigrandės spiralės struktūros ribonukleino rūgšties – iš dalies keičiamas
    Reglamento (ES) Nr. 37/2010 dėl farmakologiškai aktyvių medžiagų, jų klasifikacijos
    ir didžiausios leidžiamosios koncentracijos gyvūniniuose maisto produktuose
    priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 489/2013 tas-
    27 ta’ Mejju 2013 li jemenda l-Anness tar-Regolament (UE) Nru 37/2010 dwar is-sustanzi
    farmakoloġikament attivi u l-klassifikazzjoni tagħhom fir-rigward tal-limiti
    massimi ta’ residwu fl-oġġetti tal-ikel li ġejjin mill-annimali, fir-rigward
    tal-Aċidu Ribonuklejku b’filament doppju (dsRNA) omologu għall-Proteina Kapsidika
    (CP) u r-Reġjun Interġeniku (IR) tal-Vajrus Iżraeljan tal-Paraliżi Akuta (IAPV)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 489/2013 van de Commissie van 27 mei 2013
    tot wijziging van de bijlage bij Verordening (EU) nr. 37/2010 betreffende farmacologisch
    werkzame stoffen en de indeling daarvan op basis van maximumwaarden voor residuen
    in levensmiddelen van dierlijke oorsprong, wat betreft de stof dubbelstrengs ribonucleïnezuur
    homoloog aan viraal ribonucleïnezuur dat voor een deel van het manteleiwit en
    een deel van het intergenisch gebied van het Israëlische acute-paralysevirus
    codeert
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 489/2013 z dnia 27 maja 2013
    r. zmieniające załącznik do rozporządzenia (UE) nr 37/2010 w sprawie substancji
    farmakologicznie czynnych i ich klasyfikacji w odniesieniu do maksymalnych limitów
    pozostałości w środkach spożywczych pochodzenia zwierzęcego, w odniesieniu
    do substancji dwuniciowy kwas rybonukleinowy homologiczny do wirusowego kwasu
    rybonukleinowego kodujący część białka opłaszczającego i część regionu
    międzygenowego izraelskiego wirusa ostrego paraliżu
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 489/2013 da Comissão, de 27 de maio
    de 2013 , que altera o anexo do Regulamento (UE) n. ° 37/2010 relativo a substâncias
    farmacologicamente ativas e respetiva classificação no que respeita aos limites
    máximos de resíduos nos alimentos de origem animal, relativamente à substância
    ácido ribonucleico de cadeia dupla homólogo ao ácido ribonucleico viral que
    codifica parte da proteína capsidial e parte da região intergénica do vírus
    da paralisia aguda israelita
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 489/2013 al Comisiei din 27
    mai 2013 de modificare a anexei la Regulamentul (UE) nr. 37/2010 privind substanțele
    active din punct de vedere farmacologic și clasificarea lor în funcție de limitele
    reziduale maxime din produsele alimentare de origine animală, în ceea ce privește
    substanța „acid ribonucleic dublu catenar omolog acidului ribonucleic viral
    care codifică o parte a proteinei capsidale și o parte a regiunii intergenice
    a virusului israelian al paraliziei acute”
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 489/2013 z 27. mája 2013 , ktorým
    sa mení a dopĺňa príloha k nariadeniu (EÚ) č. 37/2010 o farmakologicky účinných
    látkach a ich klasifikácii, pokiaľ ide o maximálne limity rezíduí v potravinách
    živočíšneho pôvodu, v súvislosti s dvojreťazcovou kyselinou ribonukleovou
    homológnou s kódovaním vírusovej ribonukleovej kyseliny pre časť obalového
    proteínu a časť intergénovej oblasti izraelského vírusu akútnej paralýzy
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) št. 489/2013 z dne 27. maja 2013 o spremembi
    Priloge k Uredbi (EU) št. 37/2010 o farmakološko aktivnih snoveh in njihovi
    razvrstitvi glede mejnih vrednosti ostankov v živilih živalskega izvora v zvezi
    s snovjo: dvoverižna ribonukleinska kislina, homologna virusni ribonukleinski
    kislini, ki nosi zapis za del plaščne beljakovine in del medgenske regije izraelskega
    virusa akutne paralize'
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 489/2013 de la Comisión, de 27 de mayo
    de 2013 , por el que se modifica el anexo del Reglamento (UE) n ° 37/2010 relativo
    a las sustancias farmacológicamente activas y su clasificación por lo que se
    refiere a los límites máximos de residuos en los productos alimenticios de origen
    animal, en lo que respecta al ácido ribonucleico bicatenario homólogo del ácido
    ribonucleico viral que codifica una parte de la proteína de la cápside y una
    parte de la región intergénica del virus israelí de la parálisis aguda
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 489/2013 av den 27 maj 2013
    om ändring av bilagan till förordning (EU) nr 37/2010 om farmakologiskt aktiva
    substanser och deras klassificering med avseende på MRL-värden i animaliska
    livsmedel vad gäller substansen dubbelsträngad ribonukleinsyrahomolog till virus-RNA
    som kodar för en del av höljesproteinet och en del av den intergeniska regionen
    av viruset IAPV (Israel Acute Paralysis Virus)
  type: main
