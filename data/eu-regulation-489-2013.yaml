type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 489/2013 of 27 May 2013 amending
    the Annex to Regulation (EU) No 37/2010 on pharmacologically active substances
    and their classification regarding maximum residue limits in foodstuffs of animal
    origin, as regards the substance double stranded ribonucleic acid homologous to
    viral ribonucleic acid coding for part of the coat protein and part of the intergenic
    region of the Israel Acute Paralysis Virus
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 489/2013 de la Commission du 27 mai
    2013 modifiant l’annexe du règlement (UE) n ° 37/2010 relatif aux substances
    pharmacologiquement actives et à leur classification en ce qui concerne les limites
    maximales de résidus dans les aliments d’origine animale, concernant la substance
    acide ribonucléique double brin homologue à l’acide ribonucléique viral qui
    code pour une partie de la protéine d’enveloppe et une partie de la région
    intergénique du virus israélien de la paralysie aiguë
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 489/2013 der Kommission vom 27. Mai 2013
    zur Änderung des Anhangs der Verordnung (EU) Nr. 37/2010 über pharmakologisch
    wirksame Stoffe und ihre Einstufung hinsichtlich der Rückstandshöchstmengen
    in Lebensmitteln tierischen Ursprungs in Bezug auf doppelsträngige Ribonukleinsäure
    homolog zu Virus-Ribonukleinsäure, die für einen Teil des Viruskapsids und einen
    Teil der intergenischen Region des Israelischen Akute-Bienen-Paralyse-Virus codiert
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 489/2013 на Комисията
    от 27 май 2013 година за изменение на приложението
    към Регламент (ЕС) № 37/2010 относно фармакологичноактивните
    субстанции и тяхната класификация по отношение
    на максимално допустимите стойности на остатъчните
    количества в храните от животински произход
    по отношение на субстанцията двойноверижна
    рибонуклеинова киселина, хомоложна на част
    от вирусната рибонуклеинова киселина, кодираща
    част от белтъчната обвивка, както и на част
    от междугенния участък на израелския вирус
    на острия паралич
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 489/2013 ze dne 27. května 2013
    , kterým se mění příloha nařízení (EU) č. 37/2010 o farmakologicky účinných
    látkách a jejich klasifikaci podle maximálních limitů reziduí v potravinách
    živočišného původu, pokud jde o dvouvláknovou ribonukleovou kyselinu homologní
    s virovou ribonukleovou kyselinou kódující část obalového proteinu a část
    intergenové oblasti izraelského viru akutní paralýzy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 489/2013 af 27. maj 2013
    om ændring af bilaget til forordning (EU) nr. 37/2010 om farmakologisk virksomme
    stoffer og disses klassifikation med hensyn til maksimalgrænseværdier for restkoncentrationer
    i animalske fødevarer for så vidt angår stoffet dobbeltstrenget ribonukleinsyre
    homolog til viral ribonukleinsyre, som koder for en del af proteinkappen og en
    del af den intergeniske region hos israelsk akutparalysevirus
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (EE) αριθ. 489/2013 της
    Επιτροπής, της 27ης Μαΐου 2013 , για την τροποποίηση
    του παραρτήματος του κανονισμού (ΕΕ) αριθ. 37/2010
    σχετικά με φαρμακολογικώς δραστικές ουσίες
    και την ταξινόμησή τους όσον αφορά τα ανώτατα
    όρια καταλοίπων στα τρόφιμα ζωικής προέλευσης,
    όσον αφορά την ουσία δίκλωνο ριβονουκλενικό
