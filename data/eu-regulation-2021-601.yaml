    ta’ residwi tal-pestiċidi fi u fuq ikel li joriġina mill-pjanti u mill-annimali
    u biex jiġi vvalutat l-esponiment tal-konsumatur għalihom
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/601 van de Commissie van 13 april 2021
    inzake een in 2022, 2023 en 2024 uit te voeren gecoördineerd meerjarig controleprogramma
