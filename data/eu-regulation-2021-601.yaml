  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/601 оd 13. travnja 2021. o koordiniranom
    višegodišnjem programu kontrole Unije za 2022., 2023. i 2024. za osiguranje
    sukladnosti s maksimalnim razinama ostataka pesticida i ocjenu izloženosti potrošača
    ostacima pesticida u i na hrani biljnog i životinjskog podrijetla
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/601 végrehajtási rendelete (2021. április 13.)
