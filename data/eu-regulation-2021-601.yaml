    at sikre overholdelse af maksimalgrænseværdierne for pesticidrester i og på
    vegetabilske og animalske fødevarer og at vurdere forbrugernes eksponering for
    disse rester
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/601 της Επιτροπής
