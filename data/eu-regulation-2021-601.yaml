title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/601 of 13 April 2021 concerning
    a coordinated multiannual control programme of the Union for 2022, 2023 and 2024
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/601 de la Commission du 13 avril 2021
    concernant un programme de contrôle, pluriannuel et coordonné, de l’Union
    pour 2022, 2023 et 2024, destiné à garantir le respect des teneurs maximales
    en résidus de pesticides dans et sur les denrées alimentaires d’origine végétale
    et animale et à évaluer l’exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/601 der Kommission vom 13. April 2021
    über ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2022, 2023
    und 2024 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/601 на Комисията
    от 13 април 2021 година относно координирана многогодишна
    контролна програма на Съюза за 2022, 2023 и 2024 г.
    за гарантиране на спазването на максимално
    допустимите граници на остатъчни вещества
    от пестициди във и върху храни от растителен
    и животински произход и за оценка на експозицията
    на потребителите на тези пестицидни остатъци
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/601 ze dne 13. dubna 2021 o koordinovaném
    víceletém kontrolním programu Unie pro roky 2022, 2023 a 2024 s cílem zajistit
    dodržování maximálních limitů reziduí pesticidů v potravinách rostlinného
    a živočišného původu a na jejich povrchu a vyhodnotit expozici spotřebitelů
    těmto reziduím pesticidů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/601 af 13. april 2021
