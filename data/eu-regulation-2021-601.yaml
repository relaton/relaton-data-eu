    de pesticidas no interior e à superfície dos alimentos de origem vegetal e animal
    e a avaliar a exposição dos consumidores a estes resíduos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/601 al Comisiei din 13 aprilie
    2021 privind un program de control multianual coordonat al Uniunii pentru 2022,
    2023 și 2024 vizând asigurarea respectării limitelor maxime de reziduuri de
    pesticide și evaluarea expunerii consumatorilor la reziduurile de pesticide din
    și de pe alimentele de origine vegetală și animală
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/601 z 13. apríla 2021 o koordinovanom
    viacročnom kontrolnom programe Únie na roky 2022, 2023 a 2024 s cieľom zabezpečiť
    dodržiavanie maximálnych hladín rezíduí pesticídov a posúdiť vystavenie
    spotrebiteľov rezíduám pesticídov v potravinách rastlinného a živočíšneho
