    növényvédőszer-maradékok határértékeinek való megfelelés biztosítására,
    valamint a fogyasztók ilyen növényvédőszer-maradékokból eredő expozíciójának
    értékelésére irányuló, a 2022., a 2023. és a 2024. évre vonatkozó többéves
    összehangolt uniós ellenőrzési programról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/601 della Commissione del 13 aprile
    2021 relativo a un programma coordinato di controllo pluriennale dell’Unione
    per il 2022, il 2023 e il 2024, destinato a garantire il rispetto dei livelli
    massimi di residui di antiparassitari e a valutare l’esposizione dei consumatori
    ai residui di antiparassitari nei e sui prodotti alimentari di origine vegetale
    e animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/601 (2021. gada 13. aprīlis)
