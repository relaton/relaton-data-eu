    en ter beoordeling van de blootstelling van de consument aan bestrijdingsmiddelenresiduen
    in en op levensmiddelen van plantaardige en dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/601 z dnia 13 kwietnia 2021
    r. dotyczące wieloletniego skoordynowanego unijnego programu kontroli na lata
    2022, 2023 i 2024, mającego na celu zapewnienie zgodności z najwyższymi dopuszczalnymi
    poziomami pozostałości pestycydów w żywności pochodzenia roślinnego i zwierzęcego
    oraz na jej powierzchni, a także mającego na celu ocenę narażenia konsumenta
    na te pozostałości
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/601 da Comissão de 13 de abril de
