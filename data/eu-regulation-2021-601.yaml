    skirtos užtikrinti, kad nebūtų viršijama didžiausia leidžiamoji pesticidų
    liekanų koncentracija augaliniuose ir gyvūniniuose maisto produktuose bei ant
    jų, ir pesticidų liekanų poveikiui vartotojams įvertinti
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/601 tat-13
