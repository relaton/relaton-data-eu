id: EUDecision1961717
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission relative à l'autorisation accordée à la République
    italienne, en application de l'article 226 du Traité, de maintenir pour une période
    d'un an, à compter de la date de la notification de la présente décision, les
    droits spécifiques minima en vigueur au 2 mars 1960 pour le plomb brut (position
    du tarif italien n. 78.01 A) et le zinc brut (position du tarif italien n. 79.01
    A)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission betreffend die Ermächtigung Italiens gemäß
    Artikel 226 des Vertrages, vom Datum der Notifizierung dieser Entscheidung an
    für die Dauer eines Jahrs die am 2. März 1960 für Rohblei (Nummer des italienischen
    Zolltarifs 78.01 a) und für Rohzink (Nummer des italienischen Zolltarifs 79.01
    a) gellenden spezifischen Mindestzollsätze beizubehalten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione accordata alla
    Repubblica Italiana, ai sensi dell'articolo 226 del Trattato, di mantenere per
    un periodo di un anno dalla data della notifica della presente decisione, i dazi
    minimi specifici in vigore il 2 marzo 1960 per il piombo greggio (voce della tariffa
    italiana n. 78.01 a) e lo zinco greggio (voce della tariffa italiana n. 79.01
    a)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de op grond van artikel 226 van
    het Verdrag aan de Italiaanse Republiek verleende machtiging om gedurende een
    periode van één jaar, te rekenen van de datum waarop van deze beschikking kennis
    wordt gegeven, de per 2 maart 1960 geldende specifieke minimumrechten te handhaven
    voor ruw lood (post 78.01 a van het Italiaanse tarief) en voor ruw zink (post
    79.01 a van het Italiaanse tarief)
  type: main
