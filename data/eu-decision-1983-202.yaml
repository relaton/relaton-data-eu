title:
- language: en
  script: Latn
  content: '83/202/EEC: Commission Decision of 18 April 1983 authorizing the French
    Republic to apply intra-Community surveillance to imports of woven fabrics of
    cotton and T-shirts, originating in Turkey, which have been put into free circulation
    in the Community (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/202/CEE: Décision de la Commission du 18 avril 1983 autorisant la
    République française à instaurer une surveillance intracommunautaire à l''égard
    des importations de tissus de coton et de T-shirts originaires de Turquie et mis
    en libre pratique dans la Communauté (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/202/EWG: Entscheidung der Kommission vom 18. April 1983 zur Ermaechtigung
    der Franzoesischen Republik zur Einfuehrung einer innergemeinschaftlichen Ueberwachung
    der Einfuhren von aus der Tuerkei stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Geweben aus Baumwolle und T-Shirts (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/202/EOEF: Kommissionens beslutning af 18. april 1983 om bemyndigelse
    af Den franske Republik til at indfoere tilsyn inden for Faellesskabet med indfoersel
    af vaevede stoffer af bomuld og T-shirts med oprindelse i Tyrkiet og overgaaet
    til fri omsaetning i en anden medlemsstat (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/202/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Απριλίου 1983 περί χορηγήσεως αδείας στη Γαλλική
    Δημοκρατία για την καθιέρωση ενδοκοινοτικής
    επίβλεψης των εισαγωγών βαμβακερών υφασμάτων
    και T-shirts καταγωγής Τουρκίας, που έχουν τεθεί
    σε ελεύθερη κυκλοφορία στην Κοινότητα (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/202/CEE: Decisione della Commissione del 18 aprile 1983 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria sulle importazioni
    di tessuti di cotone e di T-shirts originari della Turchia e immessi in libera
    pratica nella Comunità (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/202/EEG: Beschikking van de Commissie van 18 april 1983 houdende machtiging
    van de Franse Republiek tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van weefsels van katoen en T- shirts, van oorsprong uit
    Turkije, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de
    tekst in de Franse taal is authentiek)'
