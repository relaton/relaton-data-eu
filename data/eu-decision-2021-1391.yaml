title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1391 of 17 August 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified oilseed rapes Ms8 × Rf3 × GT73, Ms8 × GT73 and Rf3 ×
    GT73 pursuant to Regulation (EC) No 1829/2003 of the European parliament and of
    the Council (notified under document C(2021)5998) (Only the Dutch and German texts
    are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1391 de la Commission du 17 août 2021
    autorisant la mise sur le marché de produits contenant les colzas génétiquement
    modifiés Ms8 × Rf3 × GT73, Ms8 × GT73 et Rf3 × GT73, consistant en ces colzas
    ou produits à partir de ceux-ci, en application du règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2021) 5998]
    (Les textes en langues allemande et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1391 der Kommission vom 17. August 2021
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die aus den genetisch
    veränderten Rapssorten Ms8 × Rf3 × GT73, Ms8 × GT73 und Rf3 × GT73 bestehen,
    diese enthalten oder aus diesen gewonnen werden, gemäß der Verordnung (EG) Nr.
    1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen
    C(2021) 5998) (Nur der niederländische und der deutsche Text sind verbindlich)
  type: main
