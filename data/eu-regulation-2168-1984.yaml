    τελωνειακών δασμών για τα εξαχλωροκυκλοεξάνια
    της διακρίσεως 29.02 Β Ι του Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2168/84 della Commissione del 26 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili agli esaclorocicloesani, della sottovoce
    29.02 B I della tariffa doganale comune, originari della Cina beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
