title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2168/84 of 26 July 1984 re-establishing
    the levying of customs duties on hexachlorocyclohexanes, falling within subheading
    29.02 B I and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2168/84 de la Commission du 26 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux hexachlorocyclohexanes
    de la sous-position 29.02 B I du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2168/84 der Kommission vom 26. Juli 1984 zur Wiedereinführung
    der Erhebung der Zölle für Hexachlorcyclohexane der Tarifstelle 29.02 B I mit
    Ursprung in China, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2168/84 af 26. juli 1984 om genindførelse
    af opkrævning af told for hexachlorcyclohexaner, henhørende under pos. 29.02
    B I og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
