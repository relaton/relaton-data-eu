    pokud jde o maximální limity reziduí pro akrinathrin, fluvalinát, folpet,
    fosetyl, isofetamid, „virus mozaiky pepina, kmen EU, mírný izolát Abp1“,
    „virus mozaiky pepina, kmen CH2, mírný izolát Abp2“, spinetoram a spirotetramat
    v některých produktech a na jejich povrchu
  type: main
- language: da
  script: Latn
