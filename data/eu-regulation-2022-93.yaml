title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2022/93 of 20 January 2022 amending Annexes
    II, III and IV to Regulation (EC) No 396/2005 of the European Parliament and of
    the Council as regards maximum residue levels for acrinathrin, fluvalinate, folpet,
    fosetyl, isofetamid, ‘Pepino Mosaic Virus, EU strain, mild isolate Abp1’,
    ‘Pepino Mosaic Virus, CH2 strain, mild isolate Abp2’, spinetoram and spirotetramat
    in or on certain products
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/93 de la Commission du 20 janvier 2022 modifiant les
    annexes II, III et IV du règlement (CE) no 396/2005 du Parlement européen et
    du Conseil en ce qui concerne les limites maximales applicables aux résidus d’acrinathrine,
    de fluvalinate, de folpet, de fosétyl, d’isofétamide, de «Pepino Mosaic Virus
    – souche européenne (EU), isolat Abp1 peu virulent», de «Pepino Mosaic Virus
    — souche CH2, isolat Abp2 peu virulent», de spinetoram et de spirotétramate
    présents dans ou sur certains produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/93 der Kommission vom 20. Januar 2022 zur Änderung
    der Anhänge II, III und IV der Verordnung (EG) Nr. 396/2005 des Europäischen
    Parlaments und des Rates hinsichtlich der Höchstgehalte an Rückständen von
    Acrinathrin, Fluvalinat, Folpet, Fosetyl, Isofetamid, ‚Pepino Mosaic Virus,
    EU-Stamm, mildes Isolat Abp1‘, ‚Pepino Mosaic Virus, CH2-Stamm, mildes Isolat
    Abp2‘, Spinetoram und Spirotetramat in oder auf bestimmten Erzeugnissen
  type: main
- language: bg
  script: Cyrl
