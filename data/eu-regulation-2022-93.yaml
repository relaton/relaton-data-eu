    fosetyylin, isofetamidin, ”pepinon mosaiikkiviruksen, EU:n kannan, lievän isolaatin
    Abp1”, ”pepinon mosaiikkiviruksen, CH2-kannan, lievän isolaatin Abp2”,
    spinetoramin ja spirotetramaatin jäämien enimmäismääristä tietyissä tuotteissa
    tai niiden pinnalla
