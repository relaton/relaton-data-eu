    Mosaic Virus, щам EU, изолат с ниска вирулентност Abp1“,
    „Pepino Mosaic Virus, щам CH2, изолат с ниска вирулентност
    Abp2“, спинеторам и спиротетрамат във или върху
    определени продукти
  type: main
