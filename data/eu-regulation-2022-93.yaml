    mozaikos viruso ES padermės silpnojo izoliato Abp1, kiauliauogių mozaikos viruso
    CH2 padermės silpnojo izoliato Abp2, spinetoramo ir spirotetramato koncentracijos
    tam tikruose produktuose ar ant jų iš dalies keičiami Europos Parlamento ir
    Tarybos reglamento (EB) Nr. 396/2005 II, III ir IV priedai
  type: main
