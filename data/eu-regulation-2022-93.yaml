    maksimalnih razina ostataka za akrinatrin, fluvalinat, folpet, fosetil, izofetamid,
    „Pepino mosaic virus, soj EU, blagi izolat Abp1”, „Pepino mosaic virus,
    soj CH2, blagi izolat Abp2”, spinetoram i spirotetramat u ili na određenim
    proizvodima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/93 rendelete (2022. január 20.) a 396/2005/EK európai
    parlamenti és tanácsi rendelet II., III. és IV. mellékletének az akrinatrin,
    a fluvalinát, a folpet, a foszetil, az izofetamid, a pepinó mozaikvírus EU
    törzs, enyhe Abp1 izolátum, a pepinó mozaikvírus CH2 törzs, enyhe Abp2 izolátum,
    a spinetoram és a spirotetramat megengedett szermaradék-határértékei tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/93 della Commissione del 20 gennaio 2022 che modifica
    gli allegati II, III e IV del regolamento (CE) n. 396/2005 del Parlamento europeo
    e del Consiglio per quanto riguarda i livelli massimi di residui di acrinatrina,
    fluvalinato, folpet, fosetil, isofetamid, virus del mosaico del pepino ceppo UE
    isolato blando Abp1, virus del mosaico del pepino ceppo CH2 isolato blando Abp2,
    spinetoram e spirotetrammato in o su determinati prodotti
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2022/93 (2022. gada 20. janvāris), ar ko attiecībā
    uz akrinatrīna, fluvalināta, folpeta, fozetila, izofetamīda, Pepino mozaīkas
    vīrusa (ES celms, mazāk agresīvais izolāts Abp1), Pepino mozaīkas vīrusa
    (celms CH2, mazāk agresīvais izolāts Abp2), spinetorāma un spirotetramāta
    maksimālajiem atlieku līmeņiem noteiktos produktos vai uz tiem groza Eiropas
    Parlamenta un Padomes Regulas (EK) Nr. 396/2005 II, III un IV pielikumu
  type: main
- language: lt
  script: Latn
