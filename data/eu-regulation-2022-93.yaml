    Pharlaimint na hEorpa agus ón gComhairle a mhéid a bhaineann le huasleibhéil
    iarmhar aicrinitrine, fluvailionáite, foilpéid, foiseitile, isifeitimíde, “Víreas
    Mósáice an Pheipíonó, tréithchineál AE, aonraíoch lag Abp1”, “Víreas
    Mósáice an Pheipíonó, tréithchineál CH2, aonraíoch lag Abp2”, táirgí
    spineatoram agus spiriteitreamat i dtáirgí áirithe nó orthu
  type: main
