- language: fr
  script: Latn
  content: Règlement (CEE) n° 410/72 de la Commission, du 28 février 1972, abrogeant
    le règlement (CEE) n° 2738/71 portant application du droit du tarif douanier
    commun aux importations de mandarines, satsumas, clémentines, tangerines et autres
    hybrides similaires d'agrumes originaires de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 410/72 der Kommission vom 28. Februar 1972 zur Aufhebung
    der Verordnung (EWG) Nr. 2738/71 zur Anwendung des Gemeinsamen Zolltarifs auf
    Einfuhren von Mandarinen, Satsumas, Clementinen, Tangerinen und sonstigen ähnlichen
    Hybriden von Zitrusfrüchten mit Ursprung in der Türkei
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 410/72 della Commissione, del 28 febbraio 1972, che
    abroga il regolamento (CEE) n. 2738/71 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di mandarini, satsuma, clementine, tangerini
    ed altri ibridi similari di agrumi originari della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 410/72 van de Commissie van 28 februari 1972 tot
    intrekking van Verordening (EEG) nr. 2738/71 houdende toepassing van het recht
    van het gemeenschappelijk douanetarief op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten van
    oorsprong uit Turkije
  type: main
