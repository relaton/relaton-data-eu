  script: Latn
  content: '94/646/EC: Council Decision of 19 September 1994 on the conclusion of
    the Agreement in the form of an exchange of letters on the provisional application
    of the Protocol defining for the period 3 May 1994 to 2 May 1996 the fishing possibilities
    and financial compensation provided for in the Agreement between the European
    Economic Community and the Government of the People''s Republic of Angola on fishing
    off Angola'
  type: main
- language: fr
  script: Latn
  content: '94/646/CE: Décision du Conseil du 19 septembre 1994 concernant la conclusion
