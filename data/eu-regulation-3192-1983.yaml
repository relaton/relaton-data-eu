title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3192/83 of 11 November 1983 re-establishing
    the levying of customs duties on other fertilizers, falling within heading No
    31.05 and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3192/83 de la Commission du 11 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux autres engrais,
    de la position 31.05 du tarif douanier commun, originaires du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3192/83 der Kommission vom 11. November 1983 zur Wiedereinführung
    der Erhebung der Zölle für andere Düngemittel der Tarifnummer 31.05 mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3192/83 af 11. november 1983 om genindførelse
    af opkrævning af told for andre gødningsstoffer, henhørende under pos. 31.05
    og med oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3192/83 της Επιτροπής
