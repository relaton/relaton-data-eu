title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 444/86 of 25 February 1986 authorizing the
    Kingdom of Spain and the Portuguese Republic to include national subdivisions
    for certain agricultural products within the Common Customs Tariff nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 444/86 du Conseil du 25 février 1986 autorisant le
    Royaume d'Espagne et la République portugaise à reprendre à l'intérieur de
    la nomenclature du tarif douanier commun des subdivisions nationales pour certains
    produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 444/86 des Rates vom 25. Februar 1986 mit der das
    Königreich Spanien und die Portugiesische Republik ermächtigt werden, in das
    Schema des Gemeinsamen Zolltarifs für bestimmte landwirtschaftliche Erzeugnisse
    innerstaatliche Unterteilungen zu übernehmen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 444/86 af 25. februar 1986 om bemyndigelse
    af kongeriget Spanien og republikken Portugal til i nomenklaturen i den fælles
    toldtarif at optage en række nationale underpositioner for visse landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 444/86 του Συμβουλίου
    της 25ης Φεβρουαρίου 1986 που επιτρέπει στο Βασίλειο
    της Ισπανίας και στην Πορτογαλική Δημοκρατία
    να συμπεριλάβουν στην ονοματολογία του κοινού
    δασμολογίου εθνικές υποδιαιρέσεις για ορισμένα
    γεωργικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 444/86, annettu 25 päivänä helmikuuta 1986,
    luvan antamisesta Espanjan kuningaskunnalle ja Portugalin tasavallalle sisällyttää
    yhteisen tullitariffin nimikkeistöön tiettyjä maataloustuotteita koskevia kansallisia
    alajakoja
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 444/86 del Consiglio del 25 febbraio 1986 che autorizza
    il Regno di Spagna e la Repubblica portoghese a riprendere all' interno della
    nomenclatura della tariffa doganale comune suddivisioni nazionali per taluni prodotti
    agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 444/86 van de Raad van 25 februari 1986 waarbij het
    Koninkrijk Spanje en de Portugese Republiek worden gemachtigd om in de nomenclatuur
    van het gemeenschappelijk douanetarief voor bepaalde landbouwprodukten nationale
    onderverdelingen over te nemen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 444/86 do Conselho de 25 de Fevereiro de 1986 que
    autoriza o Reino de Espanha e a República Portuguesa a retomar, na nomenclatura
    da pauta aduaneira comum, subdivisões nacionais para certos produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 444/86 del Consejo de 25 de febrero de 1986 por el
    que se autoriza al Reino de España y a la República Portuguesa a utilizar las
    subdivisiones nacionales para determinados productos agrícolas dentro de la nomenclatura
    del arancel aduanero común
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 444/86 av den 25 februari 1986 om tillåtelse
    för Spanien och Portugal att för vissa jordbruksprodukter införa nationella
    underuppdelningar i Gemensamma tulltaxenomenklaturen
  type: main
