title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3127/89 of 18 October 1989 re-establishing
    the levying of customs duties on mounted piezo-electric crystals falling within
    CN code 8541 60 00 originating in Malaysia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3127/89 de la Commission du 18 octobre 1989 portant
    rétablissement de la perception des droits de douane applicables aux cristaux
    piézo- électriques montés, du code NC 8541 60 00, originaires de la Malaysia,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3127/89 DER KOMMISSION vom 18. Oktober 1989 zur Wiedereinführung
    der Erhebung der Zölle für gefaßte oder montierte piezoelektrische Kristalle
    des KN-Code 8541 60 00 mit Ursprung in Malaysia, dem die in der Verordnung (EWG)
    Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3127/89 af 18. oktober 1989 om genindførelse
    af opkrævning af told for monterede piezo-elektriske krystaller henhørende under
    KN-kode 8541 60 00 og med oprindelse i Malaysia, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3127/89 της Επιτροπής
    της 18ης Οκτωβρίου 1989 περί αποκαταστάσεως της
