title:
- language: en
  script: Latn
  content: '79/676/EEC: Commission Decision of 17 July 1979 authorizing the United
    Kingdom not to apply Community treatment to receivers for monochrome portable
    televisions falling within subheading 85.15 A ex III of the Common Customs Tariff,
    originating in Taiwan and in free circulation in the other Member States (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/676/CEE: Décision de la Commission, du 17 juillet 1979, autorisant
    le Royaume-Uni à exclure du traitement communautaire les appareils pour télévision
    noir et blanc portatifs de la sous-position 85.15 A ex III du tarif douanier commun,
    originaires de T''ai-wan et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/676/EWG: Entscheidung der Kommission vom 17. Juli 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Schwarzweiß- Fernsehempfangsgeräte:
    mit Tragvorrichtung versehene Empfangsgeräte der Tarifstelle 85.15 A ex III des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/676/EØF: Kommissionens beslutning af 17. juli 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage modtagere
    til transportable sort/hvid fjernsyn, som henhører under pos 85.15 A ex III i
    den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i de øvrige
    medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/676/CEE: Decisione della Commissione, del 17 luglio 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario apparecchi per la televisione
    monocromi portatili della sottovoce 85.15 A ex III della tariffa doganale comune
    originari di Taiwan e messi in libera pratica negli altri Stati membri (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/676/EEG: Beschikking van de Commissie van 17 juli 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd ontvangtoestellen voor draagbare zwart-wit
    televisie, van post 85.15 A ex III van het gemeenschappelijk douanetarief, van
    oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
