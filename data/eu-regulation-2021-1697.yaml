  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1697 of 13 July 2021 amending
    Regulation (EU) 2018/848 of the European Parliament and of the Council as regards
    the criteria for the recognition of control authorities and control bodies that
    are competent to carry out controls on organic products in third countries, and
    for the withdrawal of their recognition
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1697 de la Commission du 13 juillet 2021
