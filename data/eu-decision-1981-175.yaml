title:
- language: en
  script: Latn
  content: '81/175/EEC: Commission Decision of 5 March 1981 establishing that the
    apparatus described as ''Sperry - uniscope 200 display terminal with other peripheral
    instruments'' may not be imported free of Common Customs Tariff duties'''
  type: main
- language: fr
  script: Latn
  content: '81/175/CEE: Décision de la Commission, du 5 mars 1981, constatant que
    l''importation de l''appareil dénommé "Sperry - uniscope 200 display terminal
    with other peripheral instruments" ne peut être faite en franchise des droits
    du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/175/EWG: Entscheidung der Kommission vom 5. März 1981, mit der festgestellt
    wird, daß das Gerät ,,SPERRY- Uniscope 200 Display Terminal with other peripheral
    instruments" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '81/175/EØF: Kommissionens beslutning af 5. marts 1981 om fastslåelse
    af, at indførsel af apparatet "SPERRY- Uniscope 200 Display Terminal with other
    peripheral instruments" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/175/ΕΟΚ: Απόφαση τής Επιτροπής τής 5ης Μαρτίου
    1981 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «SPERRY - Uniscope 200 Display Terminal with other
    peripheral instruments» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/175/CEE: Decisione della Commissione, del 5 marzo 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "Sperry - uniscope 200 display
    terminal with other peripheral instruments" non può avvenire in franchigia dai
    dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/175/EEG: Beschikking van de Commissie van 5 maart 1981 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,SPERRY-Uniscope 200 Display Terminal with
    other peripheral instruments" niet met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
