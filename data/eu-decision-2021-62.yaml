  script: Latn
  content: Decisión de Ejecución (UE) 2021/62 de la Comisión de 22 de enero de
    2021 por la que se renueva la autorización de comercialización de los productos
    que contengan, estén compuestos o hayan sido producidos a partir de maíz modificado
    genéticamente MIR604 (SYN-IR6Ø4-5) con arreglo al Reglamento (CE) n.o 1829/2003
    del Parlamento Europeo y del Consejo [notificada con el número C(2021) 260] (Los
    textos en lenguas francesa y neerlandesa son los únicos auténticos)
  type: main
