    τα μόνα αυθεντικά)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/62, 22. jaanuar 2021, millega pikendatakse
    geneetiliselt muundatud maisi MIR604 (SYN-IR6Ø4-5) sisaldavate, sellest koosnevate
    või sellest toodetud toodete turulelaskmise luba vastavalt Euroopa Parlamendi
    ja nõukogu määrusele (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2021) 260
    all) (Ainult hollandi- ja prantsuskeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/62, annettu 22 päivänä
    tammikuuta 2021, muuntogeenistä maissia MIR604 (SYN-IR6Ø4-5) sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille saattamista
    koskevan luvan uusimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    1829/2003 mukaisesti (tiedoksiannettu numerolla C(2021) 260) (Ainoastaan hollannin-
    ja ranskankieliset tekstit ovat todistusvoimaisia)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/62 оd 22. siječnja 2021. o produljenju
    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificirani
    kukuruz MIR604 (SYN-IR6Ø4-5), sastoje se ili su proizvedeni od njega, u skladu
    s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2011) 260) (Vjerodostojan je samo tekst na nizozemskom i francuskom
    jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/62 végrehajtási határozata (2021. január 22.)
    a géntechnológiával módosított MIR604 (SYN-IR6Ø4-5) kukoricát tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2021) 260. számú dokumentummal történt) (Csak a holland
    és a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/62 della Commissione del 22 gennaio 2021
    che rinnova l'autorizzazione all'immissione in commercio di prodotti contenenti,
    costituiti o derivati dal granturco geneticamente modificato MIR604 (SYN-IR6Ø4-5)
    a norma del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2021) 260] (I testi in lingua francese e neerlandese
    sono i soli facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/62 (2021. gada 22. janvāris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu MIR604
    (SYN-IR6Ø4-5), no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta
    numuru C(2021) 260) (Autentisks ir tikai teksts nīderlandiešu un franču valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/62 2021 m. sausio 22 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 pratęsiamas
    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    kukurūzų MIR604 (SYN-IR6Ø4-5), kurie iš jų sudaryti arba kurie iš jų pagaminti
    (pranešta dokumentu Nr. C(2021) 260) (Tekstas autentiškas tik nyderlandų ir
    prancūzų kalbomis)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/62 tat-22
    ta’ Jannar 2021 li ġġedded l-awtorizzazzjoni għat-tqegħid fis-suq ta’
    prodotti li fihom, li jikkonsistu jew li huma prodotti mill-qamħirrum modifikat
    ġenetikament MIR604 (SYN-IR6Ø4-5) skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill (notifikata bid-dokument C(2021) 260) (It-testi bl-Olandiż
    u bil-Franċiż biss huma awtentiċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/62 van de Commissie van 22 januari 2021 tot
    verlenging van de vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MIR604 (SYN-IR6Ø4-5) overeenkomstig Verordening (EG) nr. 1829/2003 van het
    Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2021) 260)
