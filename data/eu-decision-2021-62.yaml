    innehåller, består av eller har framställts av den genetiskt modifierade majsen
    MIR604 (SYN-IR6Ø4-5), i enlighet med Europaparlamentets och rådets förordning
    (EG) nr 1829/2003 [delgivet med nr C(2021) 260] (Endast de franska och nederländska
