  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/62 z dnia 22 stycznia 2021 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną
    kukurydzę MIR604 (SYN-IR6Ø4-5), składających się z niej lub z niej wyprodukowanych
    (notyfikowana jako dokument nr C(2021) 260) (Jedynie teksty w języku francuskim
    i niderlandzkim są autentyczne)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/62 da Comissão de 22 de janeiro de 2021
    que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por ou sejam produzidos a partir de milho geneticamente modificado
    MIR604 (SYN-IR6Ø4-5) nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento
    Europeu e do Conselho [notificada com o número C(2021) 260] (Apenas fazem fé
    os textos em língua francesa e neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/62 a Comisiei din 22 ianuarie
    2021 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau în sau sunt fabricate din porumbul modificat genetic MIR604
    (SYN-IR6Ø4-5) în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului
    European și al Consiliului [notificată cu numărul C(2021) 260] (Numai textul
    în limbile neerlandeză și franceză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/62 z 22. januára 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu MIR604 (SYN-IR6Ø4-5), sú z nej zložené alebo vyrobené [oznámené
    pod číslom C(2021) 260] (Iba holandské a francúzske znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/62 z dne 22. januarja 2021 o obnovitvi
    odobritve dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MIR604
    (SYN-IR6Ø4-5), so iz nje sestavljeni ali proizvedeni, v skladu z Uredbo (ES)
    št. 1829/2003 Evropskega parlamenta in Sveta (notificirano pod dokumentarno številko
    C(2021) 260) (Besedilo v francoskem in nizozemskem jeziku je edino verodostojno)
  type: main
