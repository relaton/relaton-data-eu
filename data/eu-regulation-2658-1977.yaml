    des Rindfleischsektors, die Gegenstand von Interventionskäufen im Vereinigten
    Königreich sein können, sowie ihrer Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2658/77 af 30. november 1977 om ændring
