title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 73/77 of 14 January 1977 amending Regulations
    (EEC) No 1896/73 and (EEC) No 582/76 as regards the coefficients used to calculate
    buying-in prices for intervention beef in Ireland, and as regards the buying-in
    prices for those products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 73/77 de la Commission, du 14 janvier 1977, modifiant
    le règlement (CEE) n° 1896/73 en ce qui concerne les coefficients servant au
    calcul des prix d' achat de viande bovine à l' intervention en Irlande, ainsi
    que le règlement (CEE) n° 582/76 en ce qui concerne les prix d' achat de ces
    produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 73/77 der Kommission vom 14. Januar 1977 zur Änderung
    der Verordnung (EWG) Nr. 1896/73 in bezug auf die bei der Berechnung der Ankaufspreise
    für Interventionen bei Rindfleisch in Irland zugrunde gelegten Koeffizienten
    sowie der Verordnung (EWG) Nr. 582/76 in bezug auf die Ankaufspreise dieser Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 73/77 af 14. januar 1977 om ændring
    af forordning (EØF) nr. 1896/73 og forordning (EØF) nr. 582/76 for så vidt
    angår de koefficienter, der anvendes ved beregningen af opkøbsprisen for oksekød
    ved intervention i Irland, samt opkøbspriserne for disse produkter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 73/77 della Commissione, del 14 gennaio 1977, che
    modifica il regolamento (CEE) n. 1896/73, per quanto concerne i coefficienti impiegati
    per calcolare i prezzi d' acquisto delle carni bovine applicabili all' intervento
    in Irlanda, nonché il regolamento (CEE) n. 582/76, per quanto concerne i prezzi
    d' acquisto degli stessi prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 73/77 van de Commissie van 14 januari 1977 tot wijziging
    van Verordening (EEG) nr. 1896/73 ten aanzien van de coëfficiënten voor de berekening
    van de interventie-aankoopprijzen voor rundvlees in Ierland en van Verordening
    (EEG) nr. 582/76 ten aanzien van de aankoopprijzen van die produkten
  type: main
