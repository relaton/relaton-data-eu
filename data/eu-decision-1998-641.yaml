title:
- language: en
  script: Latn
  content: '98/641/EC: Commission Decision of 4 November 1998 amending Decision 93/452/EEC
    authorising the Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC, in respect of plants of Chamaecyparis Spach, Juniperus
    L. and Pinus L., respectively, originating in Japan (notified under document number
    C(1998) 3333)'
  type: main
- language: fr
  script: Latn
  content: '98/641/CE: Décision de la Commission du 4 novembre 1998 modifiant la
    décision 93/452/CEE autorisant les États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour les végétaux
    de Chamaecyparis Spach, de Juniperus L. et de Pinus L., originaires du Japon [notifiée
    sous le numéro C(1998) 3333]'
  type: main
- language: de
  script: Latn
  content: '98/641/EG: Entscheidung der Kommission vom 4. November 1998 zur Änderung
