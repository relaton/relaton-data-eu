title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2034/84 of 13 July 1984 laying down detailed
    rules implementing the system of aid for the use of concentrated grape must for
    the manufacture in the United Kingdom and Ireland of certain products and fixing
    the amounts of aid for the 1984/85 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2034/84 de la Commission du 13 juillet 1984 portant
    modalités d' application du régime d' aide à l' utilisation de moûts de raisins
    concentrés en vue de la fabrication de certains produits au Royaume-Uni et en
    Irlande et fixant les montants de l' aide pour la campagne viticole 1984/1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2034/84 der Kommission vom 13. Juli 1984 mit Durchführungsbestimmungen
    zu der Beihilferegelung für die Verwendung von konzentriertem Traubenmost zur
    Herstellung bestimmter Erzeugnisse im Vereinigten Königreich und in Irland sowie
    zur Festsetzung eines Beihilfebetrags für das Weinwirtschaftsjahr 1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2034/84 af 13. juli 1984 om gennemførelsesbestemmelser
    for støtteordningen vedrørende anvendelse af koncentreret druemost til fremstilling
    af visse produkter i Det forenede Kongerige og i Irland, samt om fastsættelse
    af støttebeløbene for vinproduktionsåret 1984/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2034/84 της Επιτροπής
    της 13ης Ιουλίου 1984 περί των λεπτομερειών εφαρμογής
    του καθεστώτος ενισχύσεων στη χρησιμοποίηση
    συμπυκνωμένου γλεύκους σταφυλής για την παρασκευή
    ορισμένων προϊόντων στο Ηνωμένο Βασίλειο και
    στην Ιρλανδία, καθώς και περί καθορισμού του
    ποσού ενίσχυσης για την αμπελουργική περίοδο
    1984/85
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2034/84 della Commissione del 13 luglio 1984 che fissa,
    per la campagna viticola 1984/1985, le modalità di applicazione del regime di
    aiuti per l' utilizzazione di mosti di uve concentrati a fini di fabbricazione
    di taluni prodotti nel Regno Unito e in Irlanda, nonché l' importo dell' aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2034/84 van de Commissie van 13 juli 1984 houdende
    vaststelling, voor het wijnoogstjaar 1984/1985, van de uitvoeringsbepalingen van
    de steunregeling voor het gebruik van geconcentreerde druivemost met het oog op
    de vervaardiging van bepaalde produkten in het Verenigd Koninkrijk en Ierland,
    alsmede van de steunbedragen
  type: main
