title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1025/74 of the Commission of 26 April 1974 re-establishing
    the levying of customs duties on flax or ramie yarn, not put up for retail sale
    falling within heading No 54.03, originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3505/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1025/74 de la Commission, du 26 avril 1974, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    lin ou de ramie, non conditionnés pour la vente au détail de la position tarifaire
    54.03 originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1025/74 der Kommission vom 26. April 1974 zur Wiedereinführung
    des Zollsatzes für Leinengarne und Ramiegarne, nicht in Aufmachungen für den
    Einzelverkauf, der Tarifnummer 54.03, mit Ursprung in Brasilien, dem die in der
    Verordnung (EWG) Nr. 3505/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1025/74 af 26. april 1974 om genindførelse
    af opkrævning af toldafgifter for garn af hør eller ramie, i detailsalgsoplægninger
    under position 54.03, som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3505/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1025/74 della Commissione, del 26 aprile 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lino o di
    ramié, non preparati per la vendita al minuto della voce doganale n. 54.03 originari
    del Brasile, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3505/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1025/74 van de Commissie van 26 april 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    vlas of van ramee, niet gereed voor de verkoop in het klein, van post 54.03, van
    oorsprong uit Brazilië, ten behoeve waarvan bij Verordening (EEG) nr. 3505/73
    van de Raad van 18 december 1973 tariefpreferenties werden geopend
  type: main
