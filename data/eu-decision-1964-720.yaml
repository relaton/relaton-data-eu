title:
- language: fr
  script: Latn
  content: Décision 64/720/CEE de la Commission, du 10 décembre 1964, portant augmentation
    du volume du contingent tarifaire au bénéfice du Royaume des Pays-Bas, pour
    les cubes, plaques, feuilles et bandes en liège naturel, y compris les cubes
    ou carrés pour la fabrication des bouchons
  type: main
- language: de
  script: Latn
  content: '64/720/EWG: Entscheidung der Kommission vom 10. Dezember 1964 zur Erhöhung
    des Zollkontingents zugunsten des Königreichs der Niederlande für Würfel, Platten,
    Blätter, Bänder aus Naturkork, einschließlich Würfel oder Quader zur Herstellung
    von Stopfen'
  type: main
- language: it
  script: Latn
  content: '64/720/CEE: Decisione della Commissione, del 10 dicembre 1964, che aumenta
    il contingente tariffario concesso al Regno dei Paesi Bassi per i cubi, le lastre,
    i fogli e le strisce di sughero naturale, compresi i cosiddetti cubi o quadretti
    per la fabbricazione dei turaccioli'
  type: main
- language: nl
  script: Latn
  content: '64/720/EEG: Beschikking van de Commissie van 10 december 1964 tot vergroting
    van het aan het Koninkrijk der Nederlanden toegekende tariefcontingent voor blokken,
    platen, bladen, vellen en strippen, van natuurkurk, blokjes voor het vervaardigen
    van kurken (stoppen) daaronder begrepen'
  type: main
