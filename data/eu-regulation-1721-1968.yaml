    Jugoslawien, Rumänien und der UdSSR
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1721/68 della Commissione, del 30 ottobre 1968, che
    aumenta l'ammontare di compensazione all'importazione di oli di semi di girasole
    originari o in provenienza dalla Bulgaria, dalla Romania, dall'Ungheria, dalla
    Jugoslavia e dall'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1721/68 van de Commissie van 30 oktober 1968 houdende
