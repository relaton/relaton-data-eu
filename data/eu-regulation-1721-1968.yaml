    ou en provenance de Bulgarie, de Hongrie, de Yougoslavie, de Roumanie et d'U.R.S.S.
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1721/68 der Kommission vom 30. Oktober 1968 zur Erhöhung
