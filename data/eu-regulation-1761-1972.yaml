    de grains échaudés dans l' orge prise en charge par les organismes d' intervention
    pour la campagne 1972/1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1761/72 der Kommission vom 11. August 1972 über eine
    Abweichung von der Verordnung (EWG) Nr. 1492/71 hinsichtlich des Anteils an Schmachtkorn
    bei Gerste, die im Wirtschaftsjahr 1972/1973 durch die Interventionsstelle übernommen
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1761/72 af 11. august 1972 om ændring
