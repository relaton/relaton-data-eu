id: EUDecision1976408
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 November 1975 authorizing the Federal Republic
    of Germany not to apply Community treatment to jerseys, pullovers, slip-overs,
    twinsets, cardigans, bed-jackets and jumpers, falling within heading No ex 60.05
    of the Common Customs Tariff, originating in the Republic of Korea and in free
    circulation in the Benelux countries
  type: main
- language: fr
  script: Latn
  content: '76/408/CEE: Décision de la Commission, du 24 novembre 1975, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    les importations de "pull-overs", chandails, "slip-overs", "twinsets", gilets,
    vestes et blouses de la position Ex 60.05 du Tarif douanier commun, originaires
    de la République de Corée et mises en libre pratique au Benelux'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. November 1975, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Republik Korea stammende und in den Beneluxstaaten
    im freien Verkehr befindliche Pullover, Jacken, Slip-over, Twinsets, Westen und
    Blusen der Tarifnummer ex 60.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 24. november 1975 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage sweatere, pull-overe, slip-overe,
    cardigans, cardigansæt, jumpere, trøjer, veste, bluser o. lign., som henhører
    under pos. ex 60.05 i den fælles toldtarif, har oprindelse i republikken Korea
    og frit kan omsættes i Benelux-landene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 novembre 1975, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario le importazioni
    di maglie, pullover, slip-overs, twinsets, giubbotti, giacche e bluse della voce
    ex 60.05 della tariffa doganale comune, originari della Repubblica di Corea e
    messi in libera pratica nel Benelux
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 november 1975 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd truien, pullovers, slipovers, jumpers, twinsets, vesten,
    jasjes en blouses van post ex 60.05 van het gemeenschappelijk douanetarief, van
    oorsprong uit de Republiek Korea en in de Benelux-landen in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
