title:
- language: en
  script: Latn
  content: '85/488/EEC: Commission Decision of 17 October 1985 supplementing, by the
    addition of Greenland, the list of third countries from which the Member States
    authorize imports of bovine animals, swine and fresh meat'
  type: main
- language: fr
  script: Latn
  content: '85/488/CEE: Décision de la Commission du 17 octobre 1985 complétant,
    par l'' adjonction du Groenland, la liste des pays tiers en provenance desquels
    les États membres autorisent l'' importation d'' animaux des espèces bovine
    et porcine et de viandes fraîches'
  type: main
- language: de
  script: Latn
  content: '85/488/EWG: Entscheidung der Kommission vom 17. Oktober 1985 zur Ergänzung
    der Liste der Drittländer, aus denen die Einfuhr von Rindern, Schweinen und frischem
    Fleisch von den Mitgliedstaaten zugelassen wird, durch Hinzufügung von Grönland'
  type: main
- language: da
  script: Latn
  content: '85/488/EØF: Kommissionens beslutning af 17. oktober 1985 om optagelse
    af Grønland på listen over tredjelande, hvorfra medlemsstaterne tillader indførsel
    af kvæg og svin samt fersk kød'
  type: main
- language: el
  script: Grek
  content: '85/488/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Οκτωβρίου 1985 για τη συμπλήρωση, με την προσθήκη
    της Γροιλανδίας, του καταλόγου των τρίτων χωρών
    από τις οποίες τα κράτη μέλη επιτρέπουν την
    εισαγωγή ζώων του βοείου και χοιρείου είδους
    και νωπών κρεάτων'
  type: main
- language: it
  script: Latn
  content: '85/488/CEE: Decisione della Commissione del 17 ottobre 1985 che completa,
    con l'' aggiunta della Groenlandia, l'' elenco dei paesi terzi dai quali gli stati
    membri autorizzano l'' importazione di animali delle specie bovina e suina e di
    carni fresche'
  type: main
- language: nl
  script: Latn
  content: '85/488/EEG: Beschikking van de Commissie van 17 oktober 1985 tot aanvulling
    van de lijst van derde landen waaruit invoer van runderen, varkens en vers vlees
    door de Lid-Staten wordt toegestaan, door Groenland daaraan toe te voegen'
  type: main
- language: pt
  script: Latn
  content: '85/488/CEE: Decisão da Comissão, de 17 de Outubro de 1985, que completa,
    pela inclusão da Gronelândia, a lista dos países terceiros em proveniência
    dos quais Estados-membros autorizam a importação de animais das espécies bovina
    e suína e de carnes frescas'
  type: main
- language: es
  script: Latn
  content: '85/488/CEE: Decisión de la Comisión, de 17 de octubre de 1985, por la
    que, con la adjunción de Groenlandia, se completa la lista de los países terceros
    de cuya procedencia los Estados miembros autorizan la importación de animales
    de las especies bovina y porcina y de carnes frescas'
  type: main
