    (ΕΟΚ) αριθ. 2035/74 και (ΕΟΚ) αριθ. 2036/74
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2374/79 della Commissione, del 26 ottobre 1979, relativo
    alla vendita a prezzo ridotto di taluni prodotti del settore delle carni bovine
    detenuti dagli organismi d' intervento a determinate istituzioni ed enti di carattere
    sociale, e recante modifica del regolamento (CEE) n. 1687/76 e abrogazione dei
    regolamenti (CEE) n. 2035/74 e (CEE) n. 2036/74
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2374/79 van de Commissie van 26 oktober 1979 inzake
    de verkoop tegen verlaagde prijs van bepaalde produkten van de rundvleessector
    die door de interventiebureaus zijn opgeslagen, aan bepaalde sociale instellingen
    en gemeenschappen, tevens houdende wijziging van Verordening (EEG) nr. 1687/76
    en intrekking van de Verordeningen (EEG) nr. 2035/74 en (EEG) nr. 2036/74
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2374/79 de la Comisión, de 26 de octubre de 1979,
