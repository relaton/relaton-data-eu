title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2374/79 of 26 October 1979 on the sale at
    reduced prices of certain products in the beef and veal sector held by intervention
    agencies to certain welfare institutions and bodies, amending Regulation (EEC)
    No 1687/76 and repealing Regulations (EEC) No 2035/74 and (EEC) No 2036/74
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2374/79 de la Commission, du 26 octobre 1979, relatif
    à la vente à prix réduit de certains produits du secteur de la viande bovine,
    détenus par les organismes d' intervention, à certaines institutions et collectivités
    à caractère social, modifiant le règlement (CEE) n° 1687/76 et abrogeant les
    règlements (CEE) n° 2035/74 et (CEE) n° 2036/74
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2374/79 der Kommission vom 26. Oktober 1979 über
    den Verkauf von bestimmten durch die Interventionsstellen gelagerten Erzeugnissen
    des Rindfleischsektors zu herabgesetzten Preisen an bestimmte soziale Einrichtungen
    und zur Änderung der Verordnung (EWG) Nr. 1687/76 und Aufhebung der Verordnungen
    (EWG) Nr. 2035/74 und (EWG) Nr. 2036/74
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2374/79 af 26. oktober 1979 om salg
    til nedsat pris af visse oksekødprodukter, som interventionsorganerne ligger
    inde med, til visse institutioner og organer med socialt formål, og om ændring
    af forordning (EØF) nr. 1687/76 og om ophævelse af forordning (EØF) nr. 2035/74
    og (EØF) nr. 2036/74
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2374/79 της Επιτροπής
    της 26ης Οκτωβρίου 1979 περί πωλήσεως σε μειωμένη
    τιμή ορισμένων προϊόντων του τομέα του βοείου
    κρέατος που κατέχουν οι οργανισμοί παρεμβάσεως
