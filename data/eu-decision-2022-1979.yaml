title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1979 of 31 August 2022 on establishing
    the form and databases for communicating the information referred to in Articles
    18(1) and 21(3) of Directive 2012/18/EU of the European Parliament and of the
    Council on the control of major-accident hazards involving dangerous substances
    and repealing Commission Implementing Decision 2014/895/EU (notified under document
    C(2022) 6124)
  type: main
- language: fr
