    l’article 21, paragraphe 3, de la directive 2012/18/UE du Parlement européen
    et du Conseil concernant la maîtrise des dangers liés aux accidents majeurs
    impliquant des substances dangereuses et abrogeant la décision d’exécution
    2014/895/UE de la Commission [notifiée sous le numéro C(2022) 6124]
  type: main
