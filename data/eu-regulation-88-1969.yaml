  content: Règlement (CEE) n° 88/69 du Conseil, du 16 janvier 1969, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de 30 000
    tonnes de thons, frais, réfrigérés ou congelés, entiers, décapités ou tronçonnés,
    destinés à l'industrie de la conserve, de la position EX 03.01 B I b) du tarif
    douanier commun (année 1969)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 88/69 des Rates vom 16. Januar 1969 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents von 30 000 Tonnen für
    Thunfische, frisch, gekühlt oder gefroren, ganz, ohne Kopf oder zerteilt, für
    die Konservenindustrie, der Tarifnummer ex 03.01 B I b) des Gemeinsamen Zolltarifs
    (1969)
  type: main
- language: it
