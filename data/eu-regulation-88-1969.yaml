    comunitario di 30.000 tonnellate di tonni freschi, refrigerati o congelati, interi,
    decapitati o in pezzi, destinati all'industria conserviera, della voce ex 03.01
    B I b) della tariffa doganale comune (anno 1969)
  type: main
