    levensmiddelen van dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 93/57/EWG z dnia 29 czerwca 1993 r. zmieniająca załączniki
    do dyrektyw 86/362/EWG i 86/363/EWG w sprawie ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w zbożach i na ich powierzchni oraz w środkach
    spożywczych pochodzenia zwierzęcego i na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 93/57/CEE do Conselho de 29 de Junho de 1993 que altera os anexos
