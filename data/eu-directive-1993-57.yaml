    de contenidos máximos para los residuos de plaguicidas sobre y en los cereales
    y los productos alimenticios de origen animal, respectivamente
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 93/57/EEG av den 29 juni 1993 om ändring av bilagorna
    till direktiven 86/362/EEG och 86/363/EEG om fastställande av gränsvärden för
    bekämpningsmedelsrester i och på spannmål respektive livsmedel av animaliskt
    ursprung
