    para os resíduos de pesticidas à superfície e no interior de, respectivamente,
    cereais e géneros alimentícios de origem animal
  type: main
- language: ro
  script: Latn
  content: Directiva 93/57/CEE a Consiliului din 29 iunie 1993 de modificare a anexelor
    la Directivele 86/362/CEE și 86/363/CEE de stabilire a conținuturilor maxime
    de reziduuri de pesticide de pe și din cereale și produsele alimentare de origine
    animală
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 93/57/EHS z 29. júna 1993, ktorou sa menia a dopĺňajú
