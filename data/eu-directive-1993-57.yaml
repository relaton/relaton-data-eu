    rezíduí pesticídov v a na obilninách a potravinách živočíšneho pôvodu
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 93/57/EGS z dne 29. junija 1993 o spremembi prilog k Direktivam
