  script: Latn
  content: Council Directive 93/57/EEC of 29 June 1993 amending the Annexes to Directives
    86/362/EEC and 86/363/EEC on the fixing of maximum levels for pesticide residues
    in and on cereals and foodstuffs of animal origin respectively
  type: main
- language: fr
  script: Latn
