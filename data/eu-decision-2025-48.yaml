title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/48 of 28 November 2024 on the position to be
    taken on behalf of the European Union within the Association Council established
    by the Euro-Mediterranean Agreement establishing an association between the European
    Communities and their Member States, of the one part, and the State of Israel,
    of the other part, as regards the amendment of that Agreement by replacing Protocol
    4 concerning the definition of the concept of ‘originating products’ and methods
    of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/48 du Conseil du 28 novembre 2024 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    les Communautés européennes et leurs États membres, d’une part, et l’État
    d’Israël, d’autre part, en ce qui concerne la modification dudit accord par
    le remplacement du protocole n° 4 relatif à la définition de la notion de «produits
    originaires» et aux méthodes de coopération administrative
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/48 des Rates vom 28. November 2024 über den Standpunkt,
    der im Namen der Europäischen Union im Assoziationsrat, der gemäß dem Europa-Mittelmeer-Abkommen
    zur Gründung einer Assoziation zwischen den Europäischen Gemeinschaften und
    ihren Mitgliedstaaten einerseits und dem Staat Israel andererseits eingesetzt
    wurde, hinsichtlich der Änderung des genannten Abkommens durch die Ersetzung
    des Protokolls Nr. 4 über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung
    in“ oder „Ursprungserzeugnisse“ und über die Methoden der Zusammenarbeit
    der Verwaltungen zu vertreten ist
