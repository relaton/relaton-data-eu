title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1241/2006 of 17 August 2006 amending Regulation
    (EC) No 929/2006 as regards the available quantity for which import licence applications
    for certain poultrymeat products may be lodged for the period from 1 October to
    31 December 2006
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1241/2006 de la Commission du 17 août 2006 modifiant
    le règlement (CE) n o 929/2006 en ce qui concerne la quantité disponible pour
    laquelle des demandes de certificats d'importation pour certains produits du secteur
    de la viande de volaille peuvent être introduites pour la période allant du
    1 er octobre au 31 décembre 2006
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1241/2006 der Kommission vom 17. August 2006 zur Änderung
    der Verordnung (EG) Nr. 929/2006 hinsichtlich der verfügbaren Menge, für die
    für den Zeitraum vom 1. Oktober bis zum 31. Dezember 2006 Anträge auf Einfuhrlizenzen
    für bestimmte Geflügelfleischerzeugnisse gestellt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1241/2006 ze dne 17. srpna 2006 , kterým se
    mění nařízení (ES) č. 929/2006, pokud jde o dostupné množství, na které
    lze podat žádosti o dovozní licence na některé produkty z drůbežího masa
    na období od 1. října do 31. prosince 2006
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1241/2006 af 17. august 2006 om ændring
    af forordning (EF) nr. 929/2006 for så vidt angår den disponible mængde, som
    der kan indgives ansøgninger om importlicenser for visse fjerkrækødsprodukter
    for i perioden fra den 1. oktober til den 31. december 2006
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1241/2006 της Επιτροπής,
    της 17ης Αυγούστου 2006 , για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 929/2006 όσον αφορά τη διαθέσιμη
    ποσότητα για την οποία μπορούν να υποβληθούν
    αιτήσεις χορηγήσεως πιστοποιητικών εισαγωγής
    για ορισμένα προϊόντα με βάση το κρέας πουλερικών,
    για την περίοδο από την 1η Οκτωβρίου έως τις
    31 Δεκεμβρίου 2006
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1241/2006, 17. august 2006 , millega muudetakse
    määrust (EÜ) nr 929/2006 seoses saadaolevate kogustega, mille jaoks võib esitada
    teatavate kodulinnulihasektorite toodete impordilitsentsi taotlusi ajavahemikuks
    1. oktoobrist kuni 31. detsembrini 2006
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1241/2006, annettu 17 päivänä elokuuta 2006
    , asetuksen (EY) N:o 929/2006 muuttamisesta siltä osin kuin on kyse käytettävissä
    olevasta määrästä, josta tiettyjä siipikarjanliha-alan tuotteita koskevia
    tuontitodistushakemuksia voidaan jättää 1 päivän lokakuuta ja 31 päivän
    joulukuuta 2006 väliseltä ajalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1241/2006/EK rendelete ( 2006. augusztus 17. ) a 929/2006/EK
    rendeletnek a 2006. október 1. és 2006. december 31. közötti időszakra vonatkozóan
    egyes baromfihústermékek behozatalának engedélyezése iránt benyújtható
    kérelmekben igényelhető mennyiség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1241/2006 della Commissione, del 17 agosto 2006 , recante
    modifica del regolamento (CE) n. 929/2006 in ordine al quantitativo disponibile
    per il quale possono essere presentate domande di titoli di importazione per taluni
    prodotti del settore del pollame per il periodo dal 1 o ottobre al 31 dicembre
    2006
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1241/2006 ( 2006. gada 17. augusts ), ar ko groza
    Regulu (EK) Nr. 929/2006 attiecībā uz pieejamiem daudzumiem, par kuriem var
    iesniegt importa atļauju pieteikumus par dažiem mājputnu gaļas produktiem
    laikposmam no 2006. gada 1. oktobra līdz 31. decembrim
  type: main
- language: lt
  script: Latn
  content: 2006 m. rugpjūčio 17 d. Komisijos reglamentas (EB) Nr. 1241/2006, iš
    dalies keičiantis Reglamentą (EB) Nr. 929/2006 dėl turimo kiekio, dėl kurio
    gali būti pateiktos paraiškos gauti tam tikrų paukštienos produktų importo
    licenciją nuo 2006 m. spalio 1 d. iki gruodžio 31 d.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1241/2006 van de Commissie van 17 augustus 2006 tot
    wijziging van Verordening (EG) nr. 929/2006, ten aanzien van de beschikbare hoeveelheid
    waarvoor invoercertificaataanvragen met betrekking tot bepaalde producten in de
    sector slachtpluimvee mogen worden ingediend voor de periode van 1 oktober tot
    en met 31 december 2006
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1241/2006 z dnia 17 sierpnia 2006 r. zmieniające
    rozporządzenie (WE) nr 929/2006 w odniesieniu do dostępnej ilości, dla której
    na okres od dnia 1 października do dnia 31 grudnia 2006 r. mogą być składane
    wnioski o pozwolenie na przywóz dotyczące niektórych przetworów z mięsa drobiowego
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1241/2006 da Comissão, de 17 de Agosto de 2006 ,
    que altera o Regulamento (CE) n. o 929/2006 no que diz respeito à quantidade
    disponível em relação à qual os pedidos de certificados de importação para
    determinados produtos do sector da carne de aves de capoeira podem ser apresentados
    para o período de 1 de Outubro a 31 de Dezembro de 2006
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1241/2006 zo 17. augusta 2006 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 929/2006, pokiaľ ide o dostupné množstvo,
    na ktoré sa môžu predložiť žiadosti o dovozné povolenia na určité výrobky
    z hydinového mäsa na obdobie od 1. októbra do 31. decembra 2006
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1241/2006 z dne 17. avgusta 2006 o spremembi
    Uredbe (ES) št. 929/2006 glede razpoložljive količine, za katero se lahko vložijo
    zahtevki za uvozna dovoljenja za nekatere proizvode iz perutninskega mesa za obdobje
    od 1. oktobra do 31. decembra 2006
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1241/2006 de la Comisión, de 17 de agosto de 2006
    , que modifica el Reglamento (CE) n o 929/2006 en lo que respecta a la cantidad
    disponible por la que pueden presentarse las solicitudes de certificados de importación
    para determinados productos a base de carne de aves de corral para el período
    comprendido entre el 1 de octubre y el 31 de diciembre de 2006
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1241/2006 av den 17 augusti 2006 om ändring
    av förordning (EG) nr 929/2006 när det gäller den kvantitet som är tillgänglig
    för ansökan om importlicens för vissa fjäderfäköttprodukter för perioden
    1 oktober – 31 december 2006
  type: main
