title:
- language: en
  script: Latn
  content: '80/307/EEC: Commission Decision of 20 February 1980 authorizing the French
    Republic not to apply Community treatment to women''s, girls''and infants''(other
    than babies'') woven and knitted or crocheted dresses, falling within subheadings
    ex 60.05 A II and ex 61.02 B II of the Common Customs Tariff (category 26), originating
    in India and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/307/CEE: Décision de la Commission, du 20 février 1980, autorisant
    la République française à exclure du traitement communautaire les robes tissées
    et robes de bonneterie pour femmes, fillettes et jeunes enfants autres que bébés,
    des sous-positions ex 60.05 A II et ex 61.02 B II du tarif douanier commun (catégorie
    26), originaires de l''Inde et mises en libre pratique dans les autres Etats membres
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/307/EWG: Entscheidung der Kommission vom 20. Februar 1980, mit der
    die Französische Republik ermächtigt wird, aus Indien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Kleider aus Geweben und aus Gewirken,
    für Frauen, Mädchen und Kleinkinder (ausgenommen Säuglinge), der Tarifstellen
    ex 60.05 A II und ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie 26, von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/307/EØF: Kommissionens beslutning af 20. februar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede kjoler
    og kjoler af trikotage, til kvinder, piger og småbørn (bortset fra spædbørn),
    som henhører under pos. ex 60.05 A II og ex 61.02 B II i den fælles toldtarif
    (kategori 26), har oprindelse i Indien og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/307/CEE: Decisione della Commissione, del 20 febbraio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli abiti interi
    tessuti ed a maglia per donna, per ragazza e per bambini, diversi dai bambini
    piccoli (bébés), delle sottovoci ex 60.05 A II ed ex 61.02 B II della tariffa
    doganale comune (categoria 26), originari dell''India e messi in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/307/EEG: Beschikking van de Commissie van 20 februari 1980 waarbij
    de Franse Republiek wordt gemachtigd japonnen voor dames, meisjes en kinderen
    (andere dan die voor baby''s), geweven en van brei- of haakwerk, van de posten
    ex 60.05 A II en ex 61.02 B II van het gemeenschappelijk douanetarief (categorie
    26), van oorsprong uit India en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Franse taal is authentiek)'
