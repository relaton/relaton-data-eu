title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2758/75 of the Council of 29 October 1975 laying down
    general rules concerning the components designed to ensure, within the cereals
    and rice sectors, the protection of the processing industry, and fixing those
    components in respect of the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2758/75 du Conseil, du 29 octobre 1975, déterminant
    les règles générales relatives aux éléments destinés à assurer, dans le
    secteur des céréales et du riz, la protection de l' industrie de transformation
    et fixant ceux pour les nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2758/75 des Rates vom 29. Oktober 1975 zur Festlegung
    der Grundregeln für den Bestandteil zum Schutz der Verarbeitungsindustrie auf
    dem Getreide- und Reissektor und zur Festsetzung dieses Bestandteils für die
    neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2758/75 af 29. oktober 1975 om fastsættelse
    af de almindelige regler vedrørende de elementer, der for korn og ris har til
    formål at sikre beskyttelsen af forarbejdningsindustrien, og om fastsættelse
    af disse elementer for de nye medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2758/75 του Συμβουλίου
    της 29ης Οκτωβρίου 1975 περί καθορισμού των γενικών
    κανόνων σχετικά με τα στοιχεία που προορίζονται
    να εξασφαλίζουν, στον τομέα των σιτηρών και
    της ορύζης, την προστασία της μεταποιητικής
    βιομηχανίας, καθώς και περί καθορισμού των
    στοιχείων αυτών για τα νέα κράτη μέλη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2758/75 del Consiglio, del 29 ottobre 1975, che determina
    le norme generali relative agli elementi destinati ad assicurare, nel settore
    dei cereali e del riso, la protezione dell' industria di trasformazione e che
    fissa i suddetti elementi per i nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2758/75 van de Raad van 29 oktober 1975 houdende
    bepaling van de algemene regels betreffende de elementen die dienen om in de sector
    granen en rijst de bescherming van de verwerkende industrie te verzekeren, en
    vaststelling van genoemde elementen voor de nieuwe Lid-Staten
  type: main
