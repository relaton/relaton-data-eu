title:
- language: fr
  script: Latn
  content: Décision 64/258/CEE de la Commission, du 2 avril 1964, portant modification
    de sa décision du 19 décembre 1963, autorisant la perception de taxes compensatoires
    à l'importation, en République fédérale d'Allemagne, de dextrines et d'amidons
    et fécules solubles ou torréfiés en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '64/258/EWG: Entscheidung der Kommission vom 2. April 1964 zur Änderung
    ihrer Entscheidung vom 19. Dezember 1963 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Dextrin, löslicher und gerösteter Stärke, aus verschiedenen
    Mitgliedstaaten in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '64/258/CEE: Decisione della Commissione, del 2 aprile 1964, recante modifica
    alla decisione del 19 dicembre 1963 che autorizza la riscossione di tasse di compensazione
    all''importazione nella Repubblica federale di Germania di destrine, amidi e fecole
    solubili o torrefatti provenienti dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/258/EEG: Beschikking van de Commissie van 2 april 1964 tot wijziging
    van haar beschikking van 19 december 1963 houdende machtiging tot het leggen van
    een compenserende heffing op de invoer in de Bondsrepubliek Duitsland van dextrine
    en oplosbaar of geroost zetmeel uit de andere Lid-Staten'
  type: main
