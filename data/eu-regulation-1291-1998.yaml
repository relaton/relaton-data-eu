title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1291/98 of 22 June 1998 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira and to determine
    the forecast supply balance for the period 1 July 1998 to 30 June 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1291/98 de la Commission du 22 juin 1998 modifiant
    le règlement (CEE) nº 2999/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement de Madère en produits du secteur des fruits et légumes
    transformés et déterminant le bilan d'approvisionnement pour la période du
    1er juillet 1998 au 30 juin 1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1291/98 der Kommission vom 22. Juni 1998 zur Änderung
    der Verordnung (EWG) Nr. 2999/92 mit Durchführungsbestimmungen zur Sonderregelung
    für die Versorgung von Madeira mit Verarbeitungserzeugnissen aus Obst und Gemüse
    und zur Errichtung der Versorgungsbilanz für den Zeitraum vom 1. Juli 1998 bis
    30. Juni 1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1291/98 af 22. juni 1998 om ændring
    af forordning (EØF) nr. 2999/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for Madeira vedrørende forarbejdede frugt- og grøntsagsprodukter,
    og fastsættelse af den foreløbige forsyningsopgørelse, for så vidt angår
    perioden 1. juli 1998 til 30. juni 1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1291/98 της Επιτροπής
    της 22ας Ιουνίου 1998 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2999/92 όσον αφορά τις λεπτομέρειες
    εφαρμογής του ειδικού καθεστώτος για τον εφοδιασμό
    της Μαδέρας με προϊόντα του τομέα των μεταποιημένων
    οπωροκηπευτικών και για τον καθορισμό του
    ισοζυγίου εφοδιασμού για την περίοδο από 1ης
    Ιουλίου 1998 έως 30 Ιουνίου 1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1291/98, annettu 22 päivänä kesäkuuta 1998,
    Madeiran hedelmä- ja vihannesjalosteiden tuotteiden hankintaa koskevien erityisjärjestelyjen
    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 2999/92 muuttamisesta ja hankintaa koskevan ennakkoarvion määrittämisestä
    ajanjaksolle 1 päivästä heinäkuuta 1998 30 päivään kesäkuuta 1999
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1291/98 della Commissione del 22 giugno 1998 recante
    modifica del regolamento (CEE) n. 2999/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per Madera e che stabilisce il bilancio di approvvigionamento per il periodo dal
    1o luglio 1998 al 30 giugno 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1291/98 van de Commissie van 22 juni 1998 tot aanpassing
    van Verordening (EEG) nr. 2999/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van Madeira met producten van de sector van op basis
    van groenten en fruit verwerkte producten en ter vaststelling van de voorzieningsbalans
    voor de periode van 1 juli 1998 tot en met 30 juni 1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1291/98 da Comissão de 22 de Junho de 1998 que altera
    o Regulamento (CEE) nº 2999/92, que estabelece normas de execução do regime
    específico de abastecimento da Madeira em produtos do sector dos produtos transformados
    à base de frutas e produtos hortícolas, e determina a estimativa das necessidades
    de abastecimento para o período compreendido entre 1 de Julho de 1998 e 30 de
    Junho de 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1291/98 de la Comisión de 22 de junio de 1998 por
    el que se modifica el Reglamento (CEE) nº 2999/92 por el que se establecen disposiciones
    de aplicación del régimen específico de abastecimiento a Madeira de productos
    del sector de las frutas y hortalizas transformadas y establece el plan de abastecimiento
    para el período del 1 de julio de 1998 al 30 de junio de 1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1291/98 av den 22 juni 1998 om ändring
