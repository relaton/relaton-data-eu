id: EUDecision2014202
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 March 2014 determining the European Union position
    for a decision of the Management entities under the Agreement between the Government
    of the United States of America and the European Union on the coordination of
    energy-efficiency labelling programmes for office equipment on adding specifications
    for computer servers and uninterruptible power supplies to Annex C to the Agreement
    and on the revision of specifications for displays and imaging equipment included
    in Annex C to the Agreement (Text with EEA relevance) (2014/202/EU)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 20 mars 2014 fixant la position de l’Union
    européenne en vue d’une décision des organes de gestion, en application de
    l’accord entre le gouvernement des États-Unis d’Amérique et l’Union européenne
    concernant la coordination des programmes d’étiquetage relatifs à l’efficacité
    énergétique des équipements de bureau, relative à l’ajout, à l’annexe
    C de l’accord, de spécifications applicables aux serveurs et aux alimentations
    sans interruption et à la révision, à l’annexe C de l’accord, des spécifications
    applicables aux dispositifs d’affichage et aux appareils de traitement d’images
    (Texte présentant de l'intérêt pour l'EEE) (2014/202/UE)
  type: main
- language: de
  script: Latn
  content: Beschluss der Kommission vom 20. März 2014 zur Festlegung des Standpunkts
    der Europäischen Union für einen Beschluss der nach dem Abkommen zwischen der
    Regierung der Vereinigten Staaten von Amerika und der Europäischen Union über
    die Koordinierung von Kennzeichnungsprogrammen für Strom sparende Bürogeräte
    eingesetzten Verwaltungsorgane zur Aufnahme von Spezifikationen für Computerserver
    und die unterbrechungsfreie Stromversorgung in Anhang C des Abkommens und zur
    Überarbeitung der Spezifikationen für Displays und bildgebende Geräte in Anhang
    C des Abkommens (Text von Bedeutung für den EWR) (2014/202/EU)
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 20 март 2014 година
    за определяне на позицията на Европейския
    съюз относно решение на Управляващите органи
    към Споразумението между правителството на
    Съединените американски щати и Европейския
    съюз за координирането на програми за етикетиране
    на енергийната ефективност на офис оборудване
    относно добавянето на спецификации за компютърни
    сървъри и източници на непрекъсваемо електрическо
    захранване в приложение В към Споразумението
    и за преразглеждане на спецификациите за екрани
    и за оборудване за възпроизвеждане на изображения,
    включени в приложение В към Споразумението
    (текст от значение за ЕИП) (2014/202/ЕС)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 20. března 2014, kterým se stanoví postoj
    Evropské unie k rozhodnutí řídících subjektů na základě Dohody mezi vládou
    Spojených států amerických a Evropskou unií o koordinaci programů označování
    energetické účinnosti kancelářských přístrojů štítky o doplnění specifikací
    počítačových serverů a zdrojů nepřerušovaného napájení do přílohy
    C dohody a o revizi specifikací displejů a zobrazovacích zařízení zahrnutých
    v příloze C dohody (Text s významem pro EHP) (2014/202/EU)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse af 20. marts 2014 om fastlæggelse af Den Europæiske
    Unions holdning til en afgørelse truffet af administrationsenhederne i henhold
    til aftalen mellem Amerikas Forenede Staters regering og Den Europæiske Union
    om koordinering af programmer for energieffektivitetsmærkning af kontorudstyr,
    for så vidt angår tilføjelse af specifikationer for computerservere og nødstrømsforsyninger
    til aftalens bilag C og revision af specifikationerne vedrørende skærme og billedreproducerende
    udstyr i aftalens bilag C (EØS-relevant tekst) (2014/202/EU)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 20ής Μαρτίου 2014
    που καθορίζει τη θέση της Ευρωπαϊκής Ένωσης
    ως προς απόφαση των διαχειριστικών φορέων,
    δυνάμει της συμφωνίας μεταξύ της κυβέρνησης
    των Ηνωμένων Πολιτειών της Αμερικής και της
    Ευρωπαϊκής Ένωσης σχετικά με τον συντονισμό
    προγραμμάτων επισήμανσης της ενεργειακής
    απόδοσης για τον εξοπλισμό γραφείου, που αφορά
    την προσθήκη, στο παράρτημα Γ της συμφωνίας,
    προδιαγραφών για τους εξυπηρετητές υπολογιστών
    και τα τροφοδοτικά αδιάλειπτης παροχής καθώς
    και την αναθεώρηση των προδιαγραφών για τις
    διατάξεις και τον εξοπλισμό απεικόνισης που
    περιλαμβάνονται στο παράρτημα Γ της συμφωνίας
    (Κείμενο που παρουσιάζει ενδιαφέρον για τον
    ΕΟΧ) (2014/202/ΕΕ)
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 20. märts 2014, millega määratakse kindlaks Euroopa
    Liidu seisukoht seoses Ameerika Ühendriikide valitsuse ja Euroopa Liidu vahelise
    kontoriseadmete energiatõhususmärgistuse programmide kooskõlastamise lepingu
    kohaselt määratud haldusasutuste otsusega, mis käsitleb arvutiserverite ja
    puhvertoiteallikate spetsifikaatide lisamist lepingu C lisasse ning lepingu C
    lisas märgitud kuvarite ja pilditöötlusseadmete spetsifikaatide läbivaatamist
    (EMPs kohaldatav tekst) (2014/202/EL)
  type: main
- language: fi
  script: Latn
  content: Komission päätös, annettu 20 päivänä maaliskuuta 2014, Euroopan unionin
    kannasta Amerikan yhdysvaltojen hallituksen ja Euroopan unionin välisen toimistolaitteiden
    energiatehokkuutta osoittavia merkintöjä koskevien ohjelmien yhteensovittamista
    koskevan sopimuksen mukaiseen hallintoyksikköjen päätökseen tietokonepalvelimia
    ja keskeytymättömän sähkönsyötön järjestelmiä koskevien vaatimusten lisäämisestä
    sopimuksen liitteeseen C sekä liitteeseen C sisältyvien näyttöjä ja kuvantamislaitteita
    koskevien vaatimusten tarkistamisesta (ETA:n kannalta merkityksellinen teksti)
    (2014/202/EU)
  type: main
- language: hr
  script: Latn
  content: Odluka Komisije оd 20. ožujka 2014. o utvrđivanju stajališta Europske
    unije za odluku upravljačkih tijela iz Sporazuma između Vlade Sjedinjenih Američkih
    Država i Europske unije o usklađivanju programa za označivanje energetske učinkovitosti
    uredske opreme o dodavanju specifikacija za računalne poslužitelje i sustave
    besprekidnog napajanja Prilogu C Sporazumu i o reviziji specifikacija za zaslone
    i opremu za izradu slika iz Priloga C Sporazumu (Tekst značajan za EGP) (2014/202/EU)
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2014. március 20.) az Amerikai Egyesült Államok
    kormánya és az Európai Unió közötti, az irodai berendezések energiahatékonyságára
    vonatkozó címkézési programok összehangolásáról szóló megállapodás
    szerinti irányítási testületek által meghozandó, a kiszolgáló számítógépek
    és szünetmentes tápegységek előírásainak a megállapodás C. mellékletéhez
    történő hozzáadásáról, valamint a C. melléklet kijelzőkre és képalkotó
    berendezésekre vonatkozó előírásainak felülvizsgálatáról szóló határozattal
    kapcsolatos uniós álláspont meghatározásáról (EGT-vonatkozású szöveg)
    (2014/202/EU)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 20 marzo 2014 che stabilisce la posizione
    dell’Unione europea sulla decisione degli enti di gestione, istituiti in applicazione
    dell’accordo tra il governo degli Stati Uniti d’America e l’Unione europea
    relativo al coordinamento dei programmi di etichettatura di efficienza energetica
    delle apparecchiature per ufficio, volta ad aggiungere all’allegato C dell’accordo
    le specifiche dei server informatici e dei sistemi statici di continuità e rivedere
    le specifiche dei display e dei dispositivi per il trattamento di immagini contenute
    nell’allegato C dell’accordo (Testo rilevante ai fini del SEE) (2014/202/UE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2014. gada 20. marts), ar ko nosaka Eiropas Savienības
    nostāju attiecībā uz lēmumu, ko pārvaldības struktūras, kuras izveidotas
    saskaņā ar Amerikas Savienoto Valstu valdības un Eiropas Savienības Nolīgumu
    par biroja iekārtu energoefektivitātes marķēšanas programmu koordinēšanu,
    pieņem par datorserveru un nepārtrauktas barošanas avotu specifikāciju pievienošanu
    nolīguma C pielikumā un to displeju specifikāciju un attēlveidošanas ierīču
    specifikāciju pārskatīšanu, kuras iekļautas nolīguma C pielikumā (Dokuments
    attiecas uz EEZ) (2014/202/ES)
  type: main
- language: lt
  script: Latn
  content: Komisijos sprendimas 2014 m. kovo 20 d. kuriuo nustatoma Europos Sąjungos
    pozicija dėl valdymo subjektų, veikiančių pagal Jungtinių Amerikos Valstijų
    Vyriausybės ir Europos Sąjungos susitarimą dėl raštinės įrangos energijos
    vartojimo efektyvumo ženklinimo programų suderinimo, sprendimo dėl serverių
    ir nenutrūkstamojo maitinimo šaltinių specifikacijų įtraukimo į susitarimo
    C priedą ir dėl monitorių ir vaizdo atkūrimo įrangos specifikacijų, įtrauktų
    į susitarimo C priedą, persvarstymo (Tekstas svarbus EEE) (2014/202/ES)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni tal-20 ta’ Marzu 2014 li tiddetermina l-pożizzjoni
    tal-Unjoni Ewropea għal deċiżjoni tal-Entitajiet Amministrattivi skont il-Ftehim
    bejn il-Gvern tal-Istati Uniti tal-Amerika u l-Unjoni Ewropea dwar il-koordinazzjoni
    tal-programmi ta’ tikkettar tal-effiċjenza enerġetika għat-tagħmir tal-uffiċċju
    dwar iż-żieda tal-ispeċifikazzjonijiet għas-servers tal-kompjuter u l-provvisti
    tal-enerġija mingħajr interruzzjoni mal-Anness C tal-Ftehim u dwar ir-reviżjoni
    tal-ispeċifikazzjonijiet għad-displejs u t-tagħmir tal-immaġni inkluż fl-Anness
    C tal-Ftehim (Test b’relevanza għaż-ŻEE) (2014/202/UE)
  type: main
- language: nl
  script: Latn
  content: Besluit van de Commissie van 20 maart 2014 houdende bepaling van het standpunt
    van de Europese Unie inzake een besluit van de beheersinstanties, in het kader
    van de Overeenkomst tussen de regering van de Verenigde Staten van Amerika en
    de Europese Unie over de coördinatie van programma’s voor energie-efficiëntie-etikettering
    voor kantoorapparatuur, met betrekking tot de toevoeging in bijlage C van de overeenkomst
    van specificaties voor computerservers en onderbrekingsvrije voedingen en met
    betrekking tot de herziening van de in bijlage C bij de overeenkomst vervatte
    specificaties voor beeldschermen en grafische apparatuur (Voor de EER relevante
    tekst) (2014/202/EU)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 20 marca 2014 r. określająca stanowisko Unii Europejskiej
    w odniesieniu do decyzji podmiotów zarządzających na mocy Umowy między rządem
    Stanów Zjednoczonych Ameryki a Unią Europejską w sprawie koordynacji programów
    znakowania efektywności energetycznej urządzeń biurowych, dotyczącej dodania
    specyfikacji serwerów komputerowych i zasilaczy awaryjnych do załącznika C
    do Umowy oraz zmiany specyfikacji wyświetlaczy i urządzeń do przetwarzania
    obrazu zawartych w załączniku C do Umowy (Tekst mający znaczenie dla EOG) (2014/202/UE)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 20 de março de 2014 que determina a posição
    da União Europeia sobre uma decisão dos órgãos de gestão no âmbito do Acordo
    entre o Governo dos Estados Unidos da América e a União Europeia sobre a coordenação
    dos programas de rotulagem em matéria de eficiência energética do equipamento
    de escritório, que acrescenta ao anexo C do Acordo especificações relativas
    a servidores informáticos e fontes de alimentação ininterrupta e procede à
    revisão das especificações relativas a ecrãs e equipamento de representação
    gráfica incluídas no mesmo anexo (Texto relevante para efeitos do EEE) (2014/202/UE)
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 20 martie 2014 de stabilire a poziției Uniunii Europene
    în ceea ce privește o decizie a autorităților administrative, în temeiul
    Acordului dintre Guvernul Statelor Unite ale Americii și Uniunea Europeană privind
    coordonarea programelor de etichetare referitoare la eficiența energetică a
    echipamentelor de birou, cu privire la adăugarea de specificații pentru computerele-server
    și pentru sursele de alimentare neîntreruptibile la anexa C la acord și cu
    privire la revizuirea specificațiilor pentru dispozitivele de afișare și echipamentele
    de procesare a imaginii incluse în anexa C la acord (Text cu relevanță pentru
    SEE) (2014/202/UE)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 20. marca 2014, ktorým sa určuje pozícia Európskej
    únie v súvislosti s rozhodnutím riadiacich orgánov podľa Dohody medzi vládou
    Spojených štátov amerických a Európskou úniou o koordinácii programov označovania
    energetickej účinnosti kancelárskych zariadení týkajúcim sa doplnenia špecifikácií
    serverov a zdrojov neprerušovaného napájania do prílohy C k dohode a revízie
    špecifikácií displejov a zobrazovacích zariadení uvedených v prílohe C
    k dohode (Text s významom pre EHP) (2014/202/EÚ)
  type: main
- language: sl
  script: Latn
  content: Sklep Komisije z dne 20. marca 2014 o določitvi stališča Evropske unije
    glede priložitve specifikacij za računalniške strežnike in brezprekinitvene
    napajalnike Prilogi C k Sporazumu ter revizije specifikacij za prikazovalnike
    in opremo za preslikovanje, vključene v Prilogo C k Sporazumu, za namene sklepa
    upravnih organov na podlagi Sporazuma med vlado Združenih držav Amerike in Evropsko
    unijo o usklajevanju programov za označevanje energetske učinkovitosti pisarniške
    opreme (Besedilo velja za EGP) (2014/202/EU)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 20 de marzo de 2014 por la que se determina
    la posición de la Unión Europea sobre una decisión de los órganos de gestión,
    con arreglo al Acuerdo entre el Gobierno de los Estados Unidos de América y la
    Unión Europea sobre la coordinación de los programas de etiquetado de la eficiencia
    energética para los equipos ofimáticos, referente a la inclusión en el anexo
    C del Acuerdo de especificaciones aplicables a los servidores informáticos y
    los sistemas de alimentación ininterrumpida, y a la revisión de las especificaciones
    aplicables a los equipos de visualización y de impresión que figuran en el anexo
    C del Acuerdo (Texto pertinente a efectos del EEE) (2014/202/UE)
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut av den 20 mars 2014 om fastställande av Europeiska
    unionens ståndpunkt i fråga om ett beslut som ska fattas av förvaltningsorganen
    enligt avtalet mellan Amerikas förenta staters regering och Europeiska unionen
    om samordning av program för energieffektivitetsmärkning av kontorsutrustning
    om tillägg av specifikationer för datorservrar och avbrottsfri kraftförsörjning
    till bilaga C till avtalet och om ändring av specifikationerna för bildskärmar
    och bildåtergivningsutrustning i bilaga C till avtalet (Text av betydelse för
    EES) (2014/202/EU)
