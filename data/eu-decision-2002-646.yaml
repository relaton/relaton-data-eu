    ιδίως όσον αφορά τη Μποτσουάνα και για την
    τροποποίηση της απόφασης 2000/585/ΕΚ για τον καθορισμό
    των όρων σχετικά με την υγεία των ζώων και τη
    δημόσια υγεία, καθώς και της κτηνιατρικής πιστοποίησης
    για την εισαγωγή κρέατος αγρίων και εκτρεφόμενων
    θηραμάτων και κουνελιών από τρίτες χώρες (Κείμενο
    που παρουσιάζει ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα
    υπό τον αριθμό Ε(2002) 2889]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 31. juuli 2002, millega muudetakse eriti Botswana osas
    otsust 1999/283/EÜ, milles sätestatakse loomatervishoiu nõuded ja veterinaarsertifikaadid
    värske liha impordiks teatavatest Aafrika riikidest ning muudetakse otsust 2000/585/EÜ,
    millega sätestatakse loomatervishoiu nõuded ja veterinaarsertifikaadid looduslike
    ja tehistingimustes peetavate ulukite liha ning küülikuliha impordiks kolmandatest
    riikidest (teatavaks tehtud numbri K(2002) 2889 all)
  type: main
- language: fi
  script: Latn
  content: '2002/646/EY: Komission päätös, tehty 31 päivänä heinäkuuta 2002,
    eläinten terveysvaatimuksista ja eläinlääkärintodistuksesta tuoreen lihan
    tuonnissa tietyistä Afrikan maista tehdyn päätöksen 1999/283/EY muuttamisesta
    erityisesti Botswanan osalta sekä eläinten terveyttä ja kansanterveyttä koskevista
    vaatimuksista sekä eläinlääkärintodistuksista tarhatun tai luonnonvaraisen
    riistan lihan ja kaninlihan tuonnissa kolmansista maista tehdyn päätöksen 2000/585/EY
    muuttamisesta (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla
    K(2002) 2889)'
  type: main
- language: hr
  script: Latn
  content: '2002/646/EZ: Odluka Komisije od 31. srpnja 2002. o izmjeni Odluke 1999/283/EZ
    o utvrđivanju uvjeta zdravlja životinja i veterinarskog certificiranja za uvoz
    svježeg mesa iz određenih afričkih zemalja, posebno u vezi s Bocvanom i o izmjeni
    Odluke 2000/585/EZ o utvrđivanju uvjeta zdravlja životinja i veterinarskog certificiranja
    za uvoz divljači i divljači iz uzgoja i mesa kunića iz trećih zemalja (priopćena
    pod brojem dokumenta C(2002) 2889)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2002. július 31.) az egyes afrikai országokból
    behozott friss húsra vonatkozó állat-egészségügyi feltételek és a szükséges
    állatorvosi bizonyítványok megállapításáról szóló 1999/283/EK határozat
    különösen Botswana tekintetében történő módosításáról, valamint a
    vadhús, a tenyésztettvad-hús és a nyúlhús harmadik országokból történő
    behozatalára vonatkozó állat-egészségügyi és közegészségügyi feltételek
    és a szükséges állatorvosi bizonyítványok meghatározásáról szóló 2000/585/EK
    határozat módosításáról (az értesítés a C(2002) 2889. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: '2002/646/CE: Decisione della Commissione, del 31 luglio 2002, che modifica
    la decisione 1999/283/CE relativa alle condizioni di polizia sanitaria e alla
    certificazione veterinaria cui è subordinata l''importazione di carni fresche
    provenienti da alcuni paesi africani, in particolare per quanto concerne il Botswana,
    e la decisione 2000/585/CE che stabilisce le condizioni sanitarie, di polizia
    sanitaria e di certificazione veterinaria per l''importazione dai paesi terzi
    di carni di selvaggina, carni di selvaggina di allevamento e carni di coniglio
    (Testo rilevante ai fini del SEE) [notificata con il numero C(2002) 2889]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2002. gada 31. jūlijs), ar kuru groza Lēmumu 1999/283/EK,
    kas paredz dzīvnieku veselības nosacījumus un veterināro sertifikāciju svaigas
    gaļas ievešanai no dažām Āfrikas valstīm un jo īpaši attiecībā uz Botsvānu,
    un groza Lēmumu 2000/585/EK, ar ko nosaka dzīvnieku veselības nosacījumus
    un veterināro sertifikāciju savvaļas un saimniecībā audzētu medījamo dzīvnieku
    gaļas un truša gaļas ievešanai no trešām valstīm (izziņots ar dokumenta
    numuru C(2002) 2889)Teksts attiecas uz EEZ
  type: main
- language: lt
  script: Latn
  content: 2002 m. liepos 31 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    1999/283/EB, nustatantį gyvūnų sveikatos reikalavimus ir veterinarinį sertifikavimą
    importuojant šviežią mėsą iš tam tikrų Afrikos šalių, ypač Botsvanos,
    ir Sprendimą 2000/585/EB, nustatantį gyvūnų sveikatos reikalavimus ir veterinarinį
    sertifikavimą importuojant laukinių bei ūkiuose auginamų laukinių medžiojamų
    gyvūnų mėsą ir triušieną iš trečiųjų šalių (pranešta dokumentu Nr.
    C(2002) 2889)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-31 ta’ Lulju 2002 li temenda d-Deċiżjoni
    1999/283/KE li tistabbilixxi l-kondizzjonijiet sanitarji ta’ l-annimali u l-attestazzjoni
    veterinarja għall-importazzjoni tal-laħam frisk minn ċerti pajjiżi Afrikani
    u b’mod partikolari dwar il-Botswana, u li temenda d-Deċiżjoni 2000/585/KE
    li tistabbilixxi l-kondizzjonijiet sanitarji ta’ l-annimali u l-attestazzjoni
    veterinarja għall-importazzjoni tal-laħam ta’ l-annimali tal-kaċċa selvaġġ
    u mill-irziezet u l-laħam tal-fniek minn pajjiżi terzi (notifikata taħt dokument
    numru C(2002) 2889)
  type: main
- language: nl
  script: Latn
  content: '2002/646/EG: Beschikking van de Commissie van 31 juli 2002 tot wĳziging
    van Beschikking 1999/283/EG tot vaststelling van de veterinairrechtelĳke voorschriften
    en de voorschriften inzake veterinaire certificering voor de invoer van vers vlees
    uit bepaalde Afrikaanse landen, met name met betrekking tot Botswana, en tot wĳziging
    van Beschikking 2000/585/EG tot vaststelling van de veterinairrechtelĳke voorschriften,
    de gezondheidsvoorschriften en de voorschriften inzake veterinaire certificering
    voor de invoer van vlees van vrĳ wild, vlees van gekweekt wild en konĳnenvlees
    uit derde landen (Voor de EER relevante tekst) (kennisgeving geschied onder nummer
    C(2002) 2889)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 31 lipca 2002 r. zmieniająca decyzję 1999/283/WE
    ustanawiającą warunki zdrowotne zwierząt oraz świadectwa weterynaryjne przy
    przywozie świeżego mięsa z niektórych państw afrykańskich, w szczególności
    z Botswany, oraz zmieniająca decyzję 2000/585/WE ustanawiającą warunki zdrowotne
    zwierząt oraz świadectwa weterynaryjne przy przywozie mięsa zwierząt łownych,
    mięsa zwierząt dzikich utrzymywanych przez człowieka oraz mięsa króliczego
    z państw trzecich (notyfikowana jako dokument nr C (2002) 2889)
  type: main
- language: pt
  script: Latn
  content: '2002/646/CE: Decisão da Comissão, de 31 de Julho de 2002, que altera
    a Decisão 1999/283/CE relativa às condições sanitárias e à certificação
    veterinária exigidas para a importação de carne fresca proveniente de determinados
    países africanos, nomeadamente no que respeita ao Botsuana, e que altera a Decisão
    2000/585/CE que estabelece as condições de saúde pública e de sanidade animal
    e a certificação veterinária para a importação de carne de coelho e de carne
    de caça selvagem e de criação proveniente de países terceiros (Texto relevante
    para efeitos do EEE) [notificada com o número C(2002) 2889]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 31 iulie 2002 de modificare a Deciziei 1999/283/CE
    privind condițiile de sănătate animală și certificarea veterinară pentru
    importul de carne proaspătă din anumite țări africane, în special în ceea
    ce privește Botswana, și de modificare a Deciziei 2000/585/CE de stabilire a
    condițiilor de sănătate animală și sănătate publică și a certificărilor
    veterinare pentru importurile de carne de vânat sălbatic și de crescătorie
    și de carne de iepure din țările terțe [notificată cu numărul C (2002) 2889]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 31. júla 2002, ktorým sa mení a dopĺňa rozhodnutie
    1999/283/ES ustanovujúce veterinárne podmienky a udeľovanie veterinárnych
    osvedčení pre dovozy čerstvého mäsa z určitých afrických krajín, a najmä
    pokiaľ ide o Botswanu, a ktorým sa mení a dopĺňa rozhodnutie 2000/585/ES,
    ktorým sa ustanovujú veterinárne podmienky a udeľovanie veterinárnych osvedčení
    pre dovozy zveriny z voľne žijúcej zveri a zo zveri z farmových chovov a králičieho
    mäsa z tretích krajín (oznámené pod dokumentačným číslom C(2002) 2889)Text
    s významom pre pre EHP
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 31. julija 2002 o spremembi Odločbe 1999/283/ES
    o pogojih v zvezi z zdravstvenim varstvom živali in veterinarskimi spričevali
    za uvoz svežega mesa iz nekaterih afriških držav in zlasti iz Bocvane ter o
    spremembi Odločbe 2000/585/ES o pogojih zdravstvenega varstva živali in javnozdravstvenih
    pogojih ter veterinarskem certificiranju za uvoz mesa divjadi in mesa gojene divjadi
    ter mesa kuncev iz tretjih držav (notificirano pod dokumentarno številko K(2002)2889)
  type: main
- language: es
  script: Latn
  content: '2002/646/CE: Decisión de la Comisión, de 31 de julio de 2002, que modifica
    la Decisión 1999/283/CE relativa a las condiciones zoosanitarias y a la certificación
    veterinaria aplicables a las importaciones de carne fresca procedente de determinados
    países africanos en lo que respecta, en particular, a Botsuana, y que modifica
    la Decisión 2000/585/CE por la que se establecen las condiciones zoosanitarias
    y de sanidad pública, así como la certificación veterinaria aplicables a la
    importación de carne de caza silvestre, carne de caza de cría y carne de conejo
    procedente de terceros países (Texto pertinente a efectos del EEE) [notificada
    con el número C(2002) 2889]'
  type: main
- language: sv
  script: Latn
  content: '2002/646/EG: Kommissionens beslut av den 31 juli 2002 om ändring av beslut
    1999/283/EG om djurhälsovillkor och utfärdande av veterinärintyg för import
    av färskt kött från vissa afrikanska länder, särskilt när det gäller Botswana,
    och om ändring av beslut 2000/585/EG om djurhälso- och hygienkrav och utfärdande
    av veterinärintyg för import av kött av vilt, hägnat vilt och kanin från
    tredje länder (Text av betydelse för EES) [delgivet med nr K(2002) 2889]'
