title:
- language: en
  script: Latn
  content: '2002/646/EC: Commission Decision of 31 July 2002 amending Decision 1999/283/EC
    laying down the animal health conditions and veterinary certification for imports
    of fresh meat from certain African countries and in particular as regards Botswana
    and amending Decision 2000/585/EC laying down the animal health conditions and
    veterinary certification for imports of wild and farmed game meat and rabbit meat
    from third countries (Text with EEA relevance) (notified under document number
    C(2002) 2889)'
  type: main
- language: fr
  script: Latn
  content: '2002/646/CE: Décision de la Commission du 31 juillet 2002 modifiant la
    décision 1999/283/CE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays africains, et en particulier en ce qui concerne le Botswana et modifiant
    la décision 2000/585/CE définissant les conditions sanitaires et de police sanitaire
    ainsi que la certification vétérinaire requises pour les importations de viandes
    de gibier sauvage, de gibier d''élevage et de lapin en provenance de pays tiers
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2002)
    2889]'
  type: main
- language: de
  script: Latn
  content: '2002/646/EG: Entscheidung der Kommission vom 31. Juli 2002 zur Änderung
    der Entscheidung 1999/283/EG über die Veterinärbedingungen und Veterinärbescheinigungen
    für die Einfuhr von frischem Fleisch aus bestimmen afrikanischen Ländern, insbesondere
    hinsichtlich Botsuanas, und zur Änderung der Entscheidung 2000/585/EG zur Festlegung
    der Veterinärbedingungen und Veterinärbescheinigungen für die Einfuhr von Fleisch
    von freilebendem Wild, Fleisch von Zuchtwild und Kaninchenfleisch aus Drittländern
    (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002)
    2889)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 31 юли 2002 година
    за изменение на Решение 1999/283/EО относно ветеринарно-санитарните
    условия и ветеринарното сертифициране за внос
    на прясно месо от някои африкански страни,
    и по-специално от Ботсуана, и за изменение на
    Решение 2000/585/EО за определяне на ветеринарно-санитарните
    и здравните изисквания и ветеринарното сертифициране
    за вноса на месо от дивеч и отгледан във ферми
    дивеч, както и на заешко месо от трети страни
    (нотифицирано под номер С (2002) 2889)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 31. července 2002, kterým se mění rozhodnutí
    1999/283/ES, kterým se stanoví veterinární a hygienické podmínky a veterinární
    osvědčení pro dovoz čerstvého masa z některých afrických zemí, zejména
    pokud jde o Botswanu, a kterým se mění rozhodnutí 2000/585/ES, kterým se
    stanoví veterinární a hygienické podmínky a veterinární osvědčení pro
    dovoz masa volně žijící a farmové zvěře a králičího masa ze třetích
    zemí (oznámeno pod číslem K(2002) 2889)
  type: main
- language: da
  script: Latn
  content: '2002/646/EF: Kommissionens beslutning af 31. juli 2002 om ændring af
    beslutning 1999/283/EF om dyresundhedsmæssige betingelser og udstedelse af veterinærcertifikat
    ved indførsel af fersk kød fra visse afrikanske lande, særlig for så vidt
    angår Botswana, og om ændring af beslutning 2000/585/EF om dyre- og folkesundhedsmæssige
    betingelser og udstedelse af sundheds- og hygiejnecertifikat ved import af kød
    af vildtlevende og opdrættet vildt og kaninkød fra tredjelande (EØS-relevant
    tekst) (meddelt under nummer K(2002) 2889)'
  type: main
- language: el
  script: Grek
