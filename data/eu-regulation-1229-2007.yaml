title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1229/2007 of 19 October 2007 terminating
    the investigation concerning possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 1629/2004 on imports of certain graphite electrode
    systems originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1229/2007 de la Commission du 19 octobre 2007 clôturant
    l’enquête sur le contournement éventuel des mesures antidumping instituées
    par le règlement (CE) n° 1629/2004 du Conseil sur les importations de certains
    systèmes d’électrodes en graphite originaires de l’Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1229/2007 der Kommission vom 19. Oktober 2007 zur Einstellung
    der Untersuchung betreffend die mutmaßliche Umgehung von Antidumpingmaßnahmen,
    die mit der Verordnung (EG) Nr. 1629/2004 des Rates gegenüber Einfuhren bestimmter
    Grafitelektrodensysteme mit Ursprung in Indien eingeführt wurden
  type: main
- language: bg
