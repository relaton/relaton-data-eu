    bestimmt ist, zu pauschal im voraus festgesetzten Preisen, zur Aufhebung der Verordnung
    (EWG) Nr. 786/87 und zur Änderung der Verordnung (EWG) Nr. 2182/77
  type: main
- language: da
  script: Latn
