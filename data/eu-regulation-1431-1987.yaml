    recante abrogazione del regolamento (CEE) n. 786/87 e che modifica il regolamento
    (CEE) n. 2182/77
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1431/87 van de Commissie van 25 mei 1987 inzake de
