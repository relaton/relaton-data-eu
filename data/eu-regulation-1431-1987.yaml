title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1431/87 of 25 May 1987 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community, repealing Regulation (EEC) No 786/87 and amending
    Regulation (EEC) No 2182/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1431/87 de la Commission du 25 mai 1987 relatif à
