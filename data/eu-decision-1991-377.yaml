type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 June 1991 authorizing the Italian Republic to
    apply intra- Community surveillance in respect of bananas originating in certain
    third countries and put into free circulation in the other Member States (Only
    the Italian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 28 juin 1991 autorisant la République italienne
    à instaurer les mesures de surveillance intracommunautaire à l'égard des importations
    de bananes originaires de certains pays tiers et mises en libre pratique dans
    les autres États membres (Le texte en langue italienne est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 28. Juni 1991 mit der die Italienische
    Republik ermächtigt wird, eine innergemeinschaftliche Überwachung von aus bestimmten
    Drittländern stammenden und in den anderen Mitgliedstaaten im freien Verkehr
    befindlichen Bananen einzuführen (Nur der italienische Text ist verbindlich)
    (91/377/EWG) #'
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 28. juni 1991 om bemyndigelse af Den Italienske
    Republik til at indføre foranstaltninger med henblik på tilsyn inden for Fællesskabet
    med indførsel af bananer, der har oprindelse i visse tredjelande, og som er overgået
    til fri omsætning i de øvrige medlemsstater (Kun den italienske udgave er autentisk)#
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 28ης Ιουνίου 1991
    που επιτρέπει στην Ιταλική Δημοκρατία να θεσπίσει
    μέτρα ενδοκοινοτικής επιτήρησης των εισαγωγών
    μπανάνας καταγωγής ορισμένων τρίτων χωρών
    που έχουν τεθεί σε ελεύθερη κυκλοφορία στα
    υπόλοιπα κράτη μέλη
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 28 giugno 1991 che autorizza la Repubblica
    italiana a istituire le misure di sorveglianza intracomunitaria nei confronti
    delle banane originarie di taluni paesi terzi e messe in libera pratica negli
    altri Stati membri (91/377/CEE) #'
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 28 juni 1991 waarbij de Italiaanse Republiek
    wordt gemachtigd maatregelen inzake intracommunautair toezicht te treffen ten
    aanzien van de invoer van bananen van oorsprong uit derde landen en die in de
    andere Lid-Staten in het vrije verkeer zijn gebracht (Slechts de tekst in de Italiaanse
    taal is authentiek)#
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 28 de Junho de 1991 que autoriza a República
    Italiana a instituir medidas de vigilância intracomunitária em relação às
    importações de bananas originárias de certos países terceiros, introduzidas
    em livre prática nos outros Estados-membros (Apenas faz fé o texto em língua
    italiana) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 28 de junio de 1991 por la que se autoriza
    a la República Italiana a establecer medidas de vigilancia intracomunitaria respecto
    a las importaciones de plátanos originarios de determinados terceros países,
    despachados a libre práctica en los demás Estados miembros (El texto en lengua
    italiana es el único auténtico) #'
  type: main
