    τής Ελλάδος»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3468/80 della Commissione, del 30 dicembre 1980, che
    modifica, in seguito all' adesione della Grecia, il regolamento (CEE) n. 2467/80
    relativo alla vendita, a prezzo fissato forfettariamente in anticipo, di talune
    carni bovine disossate detenute dall' organismo d' intervento irlandese e destinate
    ad essere esportate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3468/80 van de Commissie van 30 december 1980 tot
    wijziging van Verordening (EEG) nr. 2467/80 betreffende de verkoop, tegen vooraf
