title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3468/80 of 30 December 1980 amending Regulation
    (EEC) No 2467/80 on the sale at a price fixed in advance of boned beef and veal
    held by the Irish intervention agency and intended for export, as a result of
    Greek accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3468/80 de la Commission, du 30 décembre 1980, modifiant
    le règlement (CEE) n° 2467/80 relatif à la vente à prix fixé forfaitairement
    à l' avance de certaines viandes bovines désossées détenues par l' organisme
    d' intervention irlandais et destinées à être exportées, à la suite de l'
    adhésion de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3468/80 der Kommission vom 30. Dezember 1980 zur Änderung
    der Verordnung (EWG) Nr. 2467/80 über den Verkauf von zur Ausfuhr bestimmtem
    entbeintem Rindfleisch aus Beständen der irischen Interventionsstelle zu pauschal
    im voraus festgesetzten Preisen infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3468/80 af 30. december 1980 om ændring
    af forordning (EØF) nr. 2467/80 om salg til forudfastsat pris med henblik på
    udførsel af visse former for udbenet oksekød fra det irske interventionsorgan,
    som følge af Grækenlands tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3468/80 τής Επιτροπής
    τής 30ής Δεκεμβρίου 1980 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 2467/80 «περί τής πωλήσεως
    σέ τιμή πού καθορίζεται κατ αποκοπή εκ τών
    προτέρων ορισμένων αποστεωμένων βοείων κρεάτων
    πού κατέχει ο ιρλανδικός οργανισμός παρεμβάσεως
