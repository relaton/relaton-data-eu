  content: Council Regulation (EEC) No 3490/89 of 21 November 1989 repealing Regulation
    (EEC) No 3042/89 extending the anti-dumping duty imposed by Regulation (EEC) No
    3651/88 to certain serial-impact dot-matrix printers assembled in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3490/89 du Conseil du 21 novembre 1989 abrogeant le
    règlement (CEE) n° 3042/89 étendant le droit antidumping institué par le règlement
    (CEE) n° 3651/88 à certaines imprimantes matricielles à impact assemblées
    dans la Communauté
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3490/89 DES RATES vom 21. November 1989 zur Aufhebung
    der Verordnung (EWG) Nr. 3042/89 zur Ausdehnung des mit der Verordnung (EWG) Nr.
    3651/88 eingeführten Antidumpingzolls auf bestimmte in der Gemeinschaft montierte
    Punkt-Matrix-Drucker #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3490/89 af 21. november 1989 om ophævelse
    af forordning (EØF) nr. 3042/89 om udvidelse af den antidumpingtold, der indførtes
    ved forordning (EØF) nr. 3651/88, til også at omfatte visse serietilsluttede
    matrixslagprintere, der samles i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3490/89 του Συμβουλίου
    της 21ης Νοεμβρίου 1989 περί καταργήσεως του κανονισμού
    (ΕΟΚ) αριθ. 3042/89 για την παράταση του δασμού
    αντιντάμπινγκ που έχει επιβληθεί με τον κανονισμό
    (ΕΟΚ) αριθ. 3651/88 σε ορισμένους κρουστικούς εκτυπωτές
    χαρακτήρων με πίνακα κουκίδων που συναρμολογούνται
    στην Κοινότητα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3490/89 DEL CONSIGLIO del 21 novembre 1989 che abroga
    il regolamento (CEE) n. 3042/89 che estende il dazio antidumping istituito con
    il regolamento (CEE) n. 3651/88 ad alcuni modelli di stampanti a impatto seriale
    a matrice di punti, montate nella Comunità #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3490/89 VAN DE RAAD van 21 november 1989 houdende
    intrekking van Verordening (EEG) nr. 3042/89 tot uitbreiding van het bij Verordening
    (EEG) nr. 3651/88 ingestelde anti-dumpingrecht tot bepaalde in de Gemeenschap
