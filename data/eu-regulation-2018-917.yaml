    alfa-cipermetrina, beflubutamida, benalaxil, bentiavalicarbo, bifenazato, boscalid,
    bromoxinil, captan, carvone, clorprofam, ciazofamida, desmedifam, dimetoato, dimetomorfo,
    dicuat, etefon, etoprofos, etoxazol, famoxadona, fenamidona, fenamifos, flumioxazina,
    fluoxastrobina, folpet, foramsulfurón, formetanato, Gliocladium catenulatum cepa:
    J1446, isoxaflutol, metalaxilo-m, metiocarb, metoxifenozida, metribuzin, milbemectina,
    oxasulfurón, Paecilomyces lilacinus cepa 251, fenmedifam, fosmet, pirimifos-metilo,
    propamocarb, protioconazol, pimetrozina y s-metolacloro'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2018/917 av den 27 juni 2018
    om ändring av genomförandeförordning (EU) nr 540/2011 vad gäller förlängning
    av godkännandeperioderna för de verksamma ämnena alfacypermetrin, beflubutamid,
    benalaxyl, bentiavalikarb, bifenazat, boskalid, bromoxinil, kaptan, karvon, klorprofam,
    cyazofamid, desmedifam, dimetoat, dimetomorf, dikvat, etefon, etoprofos, etoxazol,
    famoxadon, fenamidon, fenamifos, flumioxazin, fluoxastrobin, folpet, foramsulfuron,
    formetanat, Gliocladium catenulatum stam: J1446, isoxaflutol, metalaxyl-M, metiokarb,
    metoxifenozid, metribuzin, milbemektin, oxasulfuron, Paecilomyces lilacinus stam:
    251, fenmedifam, fosmet, pirimifosmetyl, propamokarb, protiokonazol, pymetrozin
    och S-metolaklor'
