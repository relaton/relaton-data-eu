    η κυβέρνηση του Βελγίου υπέρ ορισμένων επενδύσεων
    που θα πραγματοποιηθούν από επιχείρηση της
    Αμβέρσας με σκοπό την παραγωγή POLYETHER-POLYOL (Τα
    κείμενα στη γαλλική και ολλανδική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
