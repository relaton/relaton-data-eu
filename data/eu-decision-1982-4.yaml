  content: '82/4/EEC: Commission Decision of 4 December 1981 on proposed assistance
    by the Belgian Government for investments by an Antwerp chemical firm for the
    production of polyether-polyol (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/4/CEE: Décision de la Commission, du 4 décembre 1981, concernant
    une aide que le gouvernement belge projette d''accorder en faveur d''investissements
    à réaliser par une entreprise chimique d''Anvers pour la production de polyéther-polyol
    (Les textes en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/4/EWG: Entscheidung der Kommission vom 4. Dezember 1981 über eine
    Beihilfe, die die belgische Regierung zugunsten von bestimmten Investitionen eines
    Unternehmens der chemischen Industrie in Antwerpen zur Herstellung von Polyäther-Polyol
    zu gewähren beabsichtigt (Nur der französische und niederländische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/4/EØF: Kommissionens beslutning af 4. december 1981 om en støtte,
    som den belgiske regering påtænker at yde til investeringer, som en kemisk virksomhed
    i Antwerpen vil foretage med henblik på produktion af polyether- polyol (Kun
    de franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/4/EOK: Απόφαση της Επιτροπής της 4ης Δεκεμβρίου
