title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1099/78 of 25 May 1978 re-establishing the
    levying of customs duties on wrought plates, sheets and strip, of copper, falling
    within heading No 74.04, originating in Yugoslavia to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1099/78 de la Commission, du 25 mai 1978, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en cuivre, de la position tarifaire 74.04, originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1099/78 der Kommission vom 25. Mai 1978 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Kupfer, der Tarifnummer
    74.04, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1099/78 af 25. maj 1978 om genindførelse
    af opkrævning af toldafgifter for plader og bånd, af kobber, under position
    74.04, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1099/78 della Commissione, del 25 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri di rame, della voce doganale 74.04, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1099/78 van de Commissie van 25 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op platen,
    bladen en strippen, van koper, van post 74.04, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
