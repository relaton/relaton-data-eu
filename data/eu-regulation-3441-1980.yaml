  content: Council Regulation (EEC) No 3441/80 of 22 December 1980 opening, allocating
    and providing for the administration of a Community tariff quota for newsprint
    falling within subheading 48.01 A of the Common Customs Tariff (1981) and extending
    this quota to include certain other types of paper
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3441/80 du Conseil, du 22 décembre 1980, portant
