  content: Commission Regulation (EEC) No 2350/91 of 31 July 1991 amending Regulation
    (EEC) No 1589/87 on the sale by tender of butter to intervention agencies and
    repealing Regulation (EEC) No 1982/87 issuing the standing invitation to tender
    provided for in Council Regulation (EEC) No 777/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2350/91 de la Commission du 31 juillet 1991 modifiant
