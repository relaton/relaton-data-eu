title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2474/82 of 1 September 1982 amending Annex
    5 and updating Annexes 1, 4, 5, 6, 7 and 8 to Council Regulation (EEC) No 574/72
    laying down the procedure for implementing Regulation (EEC) No 1408/71 on the
    application of social security schemes to employed and self-employed persons and
    members of their families moving within the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2474/82 de la Commission, du 1er septembre 1982, portant
    modification de l' annexe 5 et mise à jour des annexes 1, 4, 5, 6, 7 et 8 du
    règlement (CEE) n° 574/72 du Conseil fixant les modalités d' application du
    règlement (CEE) n° 1408/71 relatif à l' application des régimes de sécurité
    sociale aux travailleurs salariés, aux travailleurs non salariés et aux membres
    de leur famille qui se déplacent à l' intérieur de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2474/82 der Kommission vom 1. September 1982 zur Änderung
    des Anhangs 5 und Aktualisierung der Anhänge 1, 4, 5, 6, 7 und 8 der Verordnung
    (EWG) Nr. 574/72 über die Durchführung der Verordnung (EWG) Nr. 1408/71 zur
    Anwendung der Systeme der sozialen Sicherheit auf Arbeitnehmer und Selbständige
    sowie ihre Familienangehörige, die innerhalb der Gemeinschaft zu- und abwandern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2474/82 af 1. september 1982 om ændring
