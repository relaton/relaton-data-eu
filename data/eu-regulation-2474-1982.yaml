  script: Latn
  content: Regolamento (CEE) n. 2474/82 della Commissione, del 1° settembre 1982,
    che apporta emendamenti all' allegato 5 e aggiorna gli allegati 1, 4, 5, 6, 7
    e 8 del regolamento (CEE) n. 574/72 del Consiglio che stabilisce le modalità
    d' applicazione del regolamento (CEE) n. 1408/71 relativo all' applicazione dei
    regimi di sicurezza sociale ai lavoratori salariati e non salariati nonché ai
    loro familiari che si spostano all' interno della Comunità
  type: main
