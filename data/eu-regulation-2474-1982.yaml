    (EØF) nr. 574/72 om regler til gennemførelse af forordning (EØF) nr. 1408/71
    om anvendelse af de sociale sikringsordninger på arbejdstagere, selvstændige
    erhvervsdrivende og deres familiemedlemmer, der flytter inden for Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2474/82 τής Επιτροπής
    τής 1ης Σεπτεμβρίου 1982 περί τροποποιήσεως τού
