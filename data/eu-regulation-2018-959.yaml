  content: Commission Delegated Regulation (EU) 2018/959 of 14 March 2018 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards of the specification of the assessment
    methodology under which competent authorities permit institutions to use Advanced
    Measurement Approaches for operational risk
  type: main
- language: fr
  script: Latn
