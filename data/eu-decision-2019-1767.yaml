- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1767 of 23 October 2019 amending
    Annexes I and III to Decision 2010/472/EU as regards the inclusion of the United
    Kingdom of Great Britain and Northern Ireland in the lists of third countries
    or parts thereof authorised for the introduction into the Union of semen, ova
    and embryos of animals of the ovine and caprine species (notified under document
    C(2019) 7635)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2019/1767 de la Commission du 23 octobre
    2019 modifiant les annexes I et III de la décision 2010/472/UE en ce qui concerne
    l’inscription du Royaume-Uni de Grande-Bretagne et d’Irlande du Nord sur les
    listes des pays tiers ou parties de pays tiers en provenance desquels l’introduction
    dans l’Union de sperme, d’ovules et d’embryons d’ovins et de caprins est
    autorisée [notifiée sous le numéro C(2019) 7635]
  type: main
