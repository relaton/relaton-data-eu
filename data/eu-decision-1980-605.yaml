id: EUDecision1980605
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/605/EEC: Commission Decision of 27 June 1980 authorizing Member States
    to apply intra-Community surveillance to imports of products originating in a
    third country which have been put into free circulation in the Community and which
    may be the subject of protective measures under Article 115 of the Treaty'
  type: main
- language: fr
  script: Latn
  content: '80/605/CEE: Décision de la Commission, du 27 juin 1980, autorisant les
    États membres à instaurer une surveillance intracommunautaire des importations
    de produits originaires d'' un pays tiers et mis en libre pratique dans la Communauté,
    susceptibles de faire l'' objet de mesures de protection au titre de l'' article
    115 du traité'
  type: main
- language: de
  script: Latn
  content: '80/605/EWG: Entscheidung der Kommission vom 27. Juni 1980 zur Ermächtigung
    der Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus einem Drittland stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Waren, die Schutzmaßnahmen gemäß Artikel 115 des Vertrages
    unterworfen werden können'
  type: main
- language: da
  script: Latn
  content: '80/605/EØF: Kommissionens beslutning af 27. juni 1980 om bemyndigelse
    af medlemsstaterne til at indføre tilsyn inden for Fællesskabet med indførsel
    af produkter, der har oprindelse i et tredjeland og er overgået til fri omsætning
    i Fællesskabet, og som ville kunne gøres til genstand for beskyttelsesforanstaltninger
    i henhold til traktatens artikel 115'
  type: main
- language: el
  script: Grek
  content: '80/605/ΕΟΚ : Απόφαση της Επιτροπής, της 27ης
    Ιουνίου 1980, με την οποία επιτρέπεται στα κράτη
    μέλη να καθιερώσουν ενδοκοινοτική επιτήρηση
    των εισαγωγών προϊόντων προέλευσης τρίτων
    χωρών τα οποία τίθενται σε ελεύθερη κυκλοφορία
    στην Κοινότητα και που θα μπορούσαν να αποτελέσουν
    αντικείμενο προστατευτικών μέτρων με βάση
    το άρθρο 115 της Συνθήκης'
  type: main
- language: it
  script: Latn
  content: '80/605/CEE: Decisione della Commissione, del 27 giugno 1980, che autorizza
    gli Stati membri a istituire una sorveglianza intracomunitaria sulle importazioni
    di prodotti originari di paesi terzi e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell'' articolo 115
    del trattato'
  type: main
- language: nl
  script: Latn
  content: '80/605/EEG: Beschikking van de Commissie van 27 juni 1980 houdende machtiging
    van de Lid-Staten tot instelling van een intracommunautair toezicht ten aanzien
    van de invoer van produkten van oorsprong uit derde landen die in de Gemeenschap
    in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn van beschermende
    maatregelen krachtens artikel 115 van het Verdrag'
  type: main
