title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1285/96 of 3 July 1996 initiating a 'new
    exporter' review of Council Regulation (EEC) No 54/93 concerning the imposition
    of definitive anti-dumping duties on imports of synthetic fibres of polyester
    originating, inter alia, in India, repealing the duty with regard to imports from
    an exporter in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1285/96 de la Commission du 3 juillet 1996 portant
    ouverture d'un réexamen pour un «nouvel exportateur» du règlement (CEE) nº
    54/93 du Conseil instituant un droit antidumping définitif sur les importations
    de fibres synthétiques de polyesters originaires, entre autres, d'Inde abrogeant
    le droit pour les importations en provenance d'un exportateur dans ce pays et
    soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1285/96 der Kommission vom 3. Juli 1996 zur Einleitung
    einer Überprüfung der Verordnung (EWG) Nr. 54/93 des Rates zur Einführung eines
    endgültigen Antidumpingzolls auf die Einfuhren synthetischer Polyesterspinnfasern
    mit Ursprung u. a. in Indien, zur Aufhebung des Zolls auf die Einfuhren eines
    Ausführers in Indien und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1285/96 af 3. juli 1996 om indledning
    af en fornyet undersøgelse (»ny eksportør«) af Rådets forordning (EØF) nr.
    54/93 om indførelse af en endelig antidumpingtold på importen af syntetiske
    fibre af polyester med oprindelse i bl. a. Indien, om ophævelse af tolden for
    så vidt angår importen fra en eksportør i dette land og om indførelse af registrering
    af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1285/96 της Επιτροπής
    της 3ης Ιουλίου 1996 σχετικά με την έναρξη επανεξέτασης
    ως προς νέους εξαγωγείς του κανονισμού (ΕΟΚ)
    αριθ. 54/93 του Συμβουλίου, για την επιβολή οριστικών
    δασμών αντιντάμπινγκ στις εισαγωγές συνθετικών
    ινών από πολυεστέρες καταγωγής, μεταξύ άλλων,
    Ινδίας, καθώς και σχετικά με την κατάργηση
    του δασμού προκειμένου για τις εισαγωγές που
    προέρχονται από έναν εξαγωγέα της εν λόγω χώρας
    και με την υπαγωγή των συγκεκριμένων εισαγωγών
    σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: 'Komission asetus (EY) N:o 1285/96,#annettu 3 päivänä heinäkuuta 1996,#lopullisen
    polkumyyntitullin käyttöön ottamisesta muun muassa Intiasta peräisin olevien
    polyesteristä valmistettujen synteettikuitujen tuonnissa annettuun neuvoston
    asetukseen (ETY) N:o 54/93 liittyvän uutta viejää koskevan tarkastelun aloittamisesta,
    tullin kumoamisesta kyseisessä maassa toimivan viejän tuonnin osalta ja kyseisen
    tuonnin kirjaamisvelvollisuudesta #'
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1285/96 della Commissione del 3 luglio 1996 che avvia
    un riesame relativo ai «nuovi esportatori» del regolamento (CEE) n. 54/93 del
    Consiglio, che istituisce un dazio antidumping definitivo sulle importazioni di
    fibre sintetiche di poliesteri originarie, tra l'altro, dell'India e che abroga
    il dazio per quanto riguarda le importazioni di un esportatore in questo paese
    e stabilisce che le importazioni siano soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1285/96 van de Commissie van 3 juli 1996 tot opening
    van een nieuw onderzoek voor "een nieuwe exporteur" van Verordening (EEG) nr.
    54/93 van de Raad betreffende de instelling van een definitief anti- dumpingrecht
    op de invoer van synthetische vezels van polyester van oorsprong uit ondermeer
    India, waarbij het recht voor de invoer van een importeur in dit land wordt ingetrokken
    en deze invoer moet worden geregistreerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1285/96 da Comissão de 3 de Julho de 1996 relativo
    ao início de um reexame, respeitante a um «novo exportador», do Regulamento
    (CEE) nº 54/93 do Conselho, que cria um direito anti-dumping definitivo sobre
    as importações de fibras sintéticas de poliésteres originárias, inter alia,
    da Índia, que revoga o direito em vigor no que respeita às importações provenientes
    de um exportador deste país e que sujeita estas importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1285/96 de la Comisión de 3 de julio de 1996 por el
    que se abre una reconsideración, para un nuevo exportador, del Reglamento (CEE)
    nº 54/93 del Consejo, por el que se establece un derecho antidumping definitivo
    sobre las importaciones de fibras sintéticas de poliéster originarias, entre
    otros países, de la India, por el que se deroga el derecho aplicable a las importaciones
    de un exportador de este país y por el que se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens förordning (EG) nr 1285/96 av den 3 juli 1996 om inledande
    av en "ny exportör"-översyn av rådets förordning (EEG) nr 54/93 avseende införandet
    av slutgiltiga antidumpningstullar på import av syntetfibrer av polyester med
    ursprung i bland annat Indien, om upphävande av tullen på import från en exportör
    i detta land och om registrering av denna import #'
