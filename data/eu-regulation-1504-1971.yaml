title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1504/71 of the Commission of 14 July 1971 implementing,
    as regards products processed from fruit and vegetables, Regulation No 1041/67/EEC
    on detailed rules for the application of export refunds on products subject to
    a single price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1504/71 de la Commission, du 14 juillet 1971, rendant
    applicable, dans le secteur des produits transformés à base de fruits et légumes,
    le règlement n° 1041/67/CEE portant modalités d' application des restitutions
    à l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1504/71 der Kommission vom 14. Juli 1971 zur Anwendung
    der Verordnung Nr. 1041/67/EWG über die Durchführungsvorschriften für die Ausfuhrerstattungen
    auf Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1504/71 af 14. juli 1971 om anvendelse
    af forordning nr. 1041/67/EØF om de nærmere regler for eksportrestitutioner
    vedrørende forarbejdede varer på basis af frugt og grøntsager
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1504/71 della Commissione, del 14 luglio 1971, che
    rende applicabile nel settore dei prodotti trasformati a base di ortofrutticoli
    il regolamento n. 1041/67/CEE relativo alle modalità d' applicazione delle restituzioni
    all' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1504/71 van de Commissie van 14 juli 1971 waarbij
    Verordening nr. 1041/67/EEG houdende uitvoeringsbepalingen inzake de verlening
    van restituties bij de uitvoer van toepassing wordt verklaard in de sector van
    op basis van groenten en fruit verwerkte produkten
  type: main
