title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 141/77 of 25 January 1977 setting up, as
    a protective measure, a system linking imports of products in the beef and veal
    sector with the sale of boned beef held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 141/77 de la Commission, du 25 janvier 1977, instituant
    un régime de jumelage de l'importation de produits du secteur de la viande bovine
    au titre de mesures de sauvegarde, avec la vente de certaines viandes bovines
    désossées détenues par les organismes d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 141/77 der Kommission vom 25. Januar 1977 zur Einführung
    einer Koppelung der Einfuhr von Rindfleischerzeugnissen im Rahmen von Schutzmaßnahmen
    mit dem Verkauf von bestimmtem entbeintem Interventionsrindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 141/77 af 25. januar 1977 om indførelse
    som beskyttelsesforanstaltning af en ordning med kobling af indførsel af varer
    henhørende under oksekødsektoren med salg af visse former for udbenet oksekød,
    som interventionsorganerne ligger inde med
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 141/77 della Commissione, del 25 gennaio 1977, che
    istituisce un regime di abbinamento tra l'importazione di prodotti del settore
    delle carni bovine nel quadro delle misure di salvaguardia e la vendita di talune
    carni bovine disossate detenute dagli organismi d'intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 141/77 van de Commissie van 25 januari 1977 tot instelling
    van een regeling voor de koppeling van de invoer van produkten van de sector rundvlees
    in het kader van de vrijwaringsmaatregelen, aan de verkoop van bepaalde soorten
    rundvlees zonder been uit interventievoorraden
