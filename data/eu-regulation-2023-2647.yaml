title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/2647 of 28 November 2023
    concerning the authorisation of the preparation of Bacillus subtilis DSM 5750
    and Bacillus paralicheniformis DSM 5749 as a feed additive for calves for fattening,
    lambs for rearing and for fattening and minor ruminant species for rearing and
    for fattening, and amending Implementing Regulation (EU) 2017/2308 as regards
    the terms of the authorisation of that preparation for suckling piglets (holder
    of authorisation: Chr. Hansen A/S)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/2647 de la Commission du 28 novembre
    2023 concernant l’autorisation de la préparation de Bacillus subtilis DSM 5750
    et Bacillus paralicheniformis DSM 5749 en tant qu’additif pour l’alimentation
    des veaux d’engraissement, des agneaux d’élevage et d’engraissement ainsi
    que des espèces mineures de ruminants destinés à l’élevage et à l’engraissement,
    et modifiant le règlement d’exécution (UE) 2017/2308 en ce qui concerne les
    conditions d’autorisation de cette préparation pour les porcelets non sevrés
    (titulaire de l’autorisation: Chr. Hansen A/S)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/2647 der Kommission vom 28. November
    2023 zur Zulassung der Zubereitung aus Bacillus subtilis DSM 5750 und Bacillus
    paralicheniformis DSM 5749 als Zusatzstoff in Futtermitteln für Mastkälber,
    Aufzuchtlämmer und Mastlämmer und Wiederkäuerarten von geringerer wirtschaftlicher
    Bedeutung (zur Aufzucht und zur Mast) sowie zur Änderung der Durchführungsverordnung
    (EU) 2017/2308 hinsichtlich der Bedingungen für die Zulassung dieser Zubereitung
    für Saugferkel (Zulassungsinhaber: Chr. Hansen A/S)'
  type: main
