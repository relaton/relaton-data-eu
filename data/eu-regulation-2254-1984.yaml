title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2254/84 of 1 August 1984 re-establishing
    the levying of customs duties on track suits, products of category 73 (code 0730),
    originating in Brazil, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2254/84 de la Commission du 1er août 1984 portant
    rétablissement de la perception des droits de douane applicables aux survêtements
    de sport (trainings) de la catégorie de produits 73 (code 0730) originaires du
    Brésil, bénéficiaire des préférences tarifaires prévues au règlement (CEE)
    no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2254/84 der Kommission vom 1. August 1984 über die
    Wiedereinführung des Zollsatzes für Trainingsanzüge der Warenktategorie Nr.
    73 (Kennziffer 0730) mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2254/84 af 1. august 1984 om genindførelse
    af opkrævning af toldafgifter for træningsdragter af trikotage under kategori
    nr. 73 (kode 0730), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2254/84 της Επιτροπής
    της 1ης Αυγούστου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τις αθλητικές
    φόρμες (training), προϊόντα της κατηγορίας 73 (κωδικός
    0730), καταγωγής Βραζιλίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2254/84 della Commissione del 1o agosto 1984 che ripristina
    la riscossione dei dazi doganali applicabili alle tute sportive a maglia non elastica
    né gommata, della categoria di prodotti n. 73 (codice 0730), originarie del Brasile
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2254/84 van de Commissie van 1 augustus 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op trainingspakken,
    van de categorie van produkten nr. 73 (codenummer 0730), van oorsprong uit Brazilië
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3570/83 van de Raad
