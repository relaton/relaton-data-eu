    tiettyjen kielitoisintojen oikaisemisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/16 ón gCoimisiún an 22 Deireadh Fómhair
    2021 lena gceartaítear leaganacha i dteangacha áirithe de Rialachán Tarmligthe
    (AE) 2019/934 lena bhforlíontar Rialachán (AE) Uimh. 1308/2013 ó Pharlaimint
    na hEorpa agus ón gComhairle maidir le ceantair fíonsaothrúcháin inar féidir
    neart an alcóil a mhéadú, maidir le cleachtais fíoneolaíochta údaraithe
    agus le srianta is infheidhme i ndáil le táirgeadh agus caomhnú táirgí fíniúna,
    maidir leis an íoschéatadán alcóil i gcás fotháirgí agus a ndiúscairt,
    agus le foilsiú comhad de chuid OIV
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/16 оd 22. listopada 2021. o ispravljanju
    određenih jezičnih verzija Delegirane uredbe (EU) 2019/934 o dopuni Uredbe (EU)
    br. 1308/2013 Europskog parlamenta i Vijeća u pogledu vinogradarskih područja
    u kojima se može povećati alkoholna jakost, odobrenih enoloških postupaka i
    ograničenja primjenjivih na proizvodnju i čuvanje proizvoda od vinove loze,
    najmanjeg postotka alkohola za nusproizvode i njihova odlaganja te objave zapisa
    OIV-a
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/16 felhatalmazáson alapuló rendelete (2021. október
    22.) az 1308/2013/EU európai parlamenti és tanácsi rendeletnek az alkoholtartalom-növelés
    engedélyezésére vonatkozó lehetőség által érintett szőlőtermő területek,
    az engedélyezett borászati eljárások és a szőlőből készült termékek
    előállítására és tartósítására alkalmazandó korlátozások, a melléktermékek
    százalékos arányban megadott minimális alkoholtartalma és a melléktermékek
    kivonása, valamint az OIV adatlapjainak közzététele tekintetében történő
    kiegészítéséről szóló (EU) 2019/934 felhatalmazáson alapuló rendelet
    egyes nyelvi változatainak helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/16 della Commissione del 22 ottobre 2021
    che rettifica alcune versioni linguistiche del regolamento delegato (UE) 2019/934
    della Commissione che integra il regolamento (UE) n. 1308/2013 del Parlamento
    europeo e del Consiglio per quanto riguarda le zone viticole in cui il titolo
    alcolometrico può essere aumentato, le pratiche enologiche autorizzate e le restrizioni
    applicabili in materia di produzione e conservazione dei prodotti vitivinicoli,
    la percentuale minima di alcole per i sottoprodotti e la loro eliminazione, nonché
    la pubblicazione delle schede dell’OIV
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/16 (2021. gada 22. oktobris), ar
    kuru labo Deleģētās regulas (ES) 2019/934, ar ko Eiropas Parlamenta un Padomes
    Regulu (ES) Nr. 1308/2013 papildina attiecībā uz vīnogu audzēšanas apgabaliem,
    kuros spirta koncentrāciju var paaugstināt, atļautajām vīndarības metodēm
    un ierobežojumiem, kas piemērojami vīnkopības produktu ražošanai un konservācijai,
    minimālo spirta procentuālo daudzumu attiecībā uz blakusproduktiem un to realizēšanu,
    un OIV punktu publicēšanu, dažu valodu versijas
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/16 2021 m. spalio 22 d. kuriuo
    ištaisomos Deleguotojo reglamento (ES) 2019/934, kuriuo papildomos Europos Parlamento
    ir Tarybos reglamento (ES) Nr. 1308/2013 nuostatos dėl vynuogių auginimo zonų,
    kuriose galima padidinti alkoholio koncentraciją, leidžiamų vynininkystės
    metodų ir apribojimų, taikytinų vynuogių produktų gamybai ir laikymui, mažiausios
    procentinės alkoholio koncentracijos šalutiniuose produktuose bei tų produktų
    šalinimo ir OIV bylų paskelbimo, redakcijos tam tikromis kalbomis
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/16 tat-22 ta’ Ottubru 2021
    li jikkoreġi ċerti verżjonijiet tal-lingwa tar-Regolament Delegat (UE) 2019/934
    li jissupplimenta r-Regolament (UE) Nru 1308/2013 tal-Parlament Ewropew u tal-Kunsill
    f’dak li jirrigwarda ż-żoni ta’ vitikultura li fihom tista’ tiżdied il-qawwa
    alkoħolika, il-prattiki enoloġiċi awtorizzati u r-restrizzjonijiet applikabbli
    għall-produzzjoni u l-konservazzjoni tal-prodotti tad-dielja, il-persentaġġ
    minimu tal-alkoħol għall-prodotti sekondarji u r-rimi tagħhom, u l-pubblikazzjoni
    tal-fajls tal-OIV
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/16 van de Commissie van 22 oktober 2021
    tot rectificatie van bepaalde taalversies van Gedelegeerde Verordening (EU) 2019/934
    tot aanvulling van Verordening (EU) nr. 1308/2013 van het Europees Parlement en
    de Raad wat betreft de wijnbouwoppervlakten waar het alcoholgehalte mag worden
    verhoogd, de toegestane oenologische procedés en de beperkingen met betrekking
    tot de productie en de bewaring van wijnbouwproducten, het minimale alcoholpercentage
    voor bijproducten en de verwijdering van die producten, en de bekendmaking van
    OIV-dossiers
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/16 z dnia 22 października
    2021 r. w sprawie sprostowania niektórych wersji językowych rozporządzenia
    delegowanego (UE) 2019/934 uzupełniającego rozporządzenie Parlamentu Europejskiego
    i Rady (UE) nr 1308/2013 w odniesieniu do obszarów uprawy winorośli, w przypadku
    których zawartość alkoholu może być zwiększona, dozwolonych praktyk enologicznych
    i ograniczeń mających zastosowanie do produkcji i konserwowania produktów sektora
    win, minimalnej zawartości alkoholu w odniesieniu do produktów ubocznych oraz
    ich usuwania, a także publikacji dokumentów OIV
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/16 da Comissão de 22 de outubro de 2021
    que retifica determinadas versões linguísticas do Regulamento Delegado (UE)
    2019/934 que completa o Regulamento (UE) n.o 1308/2013 do Parlamento Europeu e
    do Conselho no que respeita às zonas vitícolas em que o título alcoométrico
    pode ser aumentado, às práticas enológicas autorizadas e às restrições aplicáveis
    à produção e conservação dos produtos vitivinícolas, à percentagem mínima
    de álcool dos subprodutos e à sua eliminação, bem como à publicação das
    fichas da OIV
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/16 al Comisiei din 22 octombrie 2021 de
    corectare a anumitor versiuni lingvistice ale Regulamentului delegat (UE) 2019/934
    de completare a Regulamentului (UE) nr. 1308/2013 al Parlamentului European și
    al Consiliului în ceea ce privește zonele viticole în care poate fi majorată
    tăria alcoolică, practicile oenologice autorizate și restricțiile aplicabile
    producerii și conservării produselor vitivinicole, procentajul minim de alcool
    al subproduselor și eliminarea acestora și publicarea fișelor OIV
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/16 z 22. októbra 2021, ktorým
    sa opravujú určité jazykové znenia delegovaného nariadenia (EÚ) 2019/934,
    ktorým sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 1308/2013,
    pokiaľ ide o vinohradnícke oblasti, v ktorých sa môže zvýšiť obsah alkoholu,
    povolené enologické postupy a obmedzenia uplatniteľné na výrobu a konzervovanie
    vinárskych výrobkov, minimálny percentuálny podiel alkoholu pri vedľajších
    produktoch a ich zneškodňovanie a zverejňovanie dokumentov OIV
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/16 z dne 22. oktobra 2021 o popravku
    Delegirane uredbe (EU) 2019/934 o dopolnitvi Uredbe (EU) št. 1308/2013 Evropskega
    parlamenta in Sveta glede vinorodnih območij, na katerih je mogoče delež alkohola
    povečati, dovoljenih enoloških postopkov in omejitev, povezanih s pridelavo
    in konzerviranjem proizvodov vinske trte, najmanjšega odstotnega deleža alkohola
    za stranske proizvode in njihovega odstranjevanja ter objave spisov OIV
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/16 de la Comisión de 22 de octubre de 2021
    que corrige determinadas versiones lingüísticas del Reglamento Delegado (UE)
    2019/934, por el que se completa el Reglamento (UE) n.o 1308/2013 del Parlamento
    Europeo y del Consejo en lo que se refiere a las zonas vitícolas donde el grado
    alcohólico pueda verse incrementado, las prácticas enológicas autorizadas y
    las restricciones aplicables a la producción y conservación de los productos
    vitícolas, el porcentaje mínimo de alcohol para subproductos y la eliminación
    de estos, y la publicación de las fichas de la OIV
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/16 av den 22 oktober 2021
    om rättelse av vissa språkversioner av delegerad förordning (EU) 2019/934 om
    komplettering av Europaparlamentets och rådets förordning (EU) nr 1308/2013
    vad gäller vinodlingsområden där alkoholhalten får höjas, tillåtna oenologiska
    metoder och restriktioner som är tillämpliga på framställning och bevarande
    av vinprodukter, lägsta alkoholhalt för biprodukter och bortskaffande av dessa
    samt offentliggörande av OIV-akter
  type: main
