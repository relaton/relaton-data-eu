  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/16, 22. oktoober 2021, millega
    parandatakse delegeeritud määruse (EL) 2019/934 (millega täiendatakse Euroopa
    Parlamendi ja nõukogu määrust (EL) nr 1308/2013 seoses viinamarjakasvatusaladega,
    kus saaduste alkoholisisaldust võib suurendada, viinamarjasaaduste tootmisele
    ja säilitamisele kehtivate lubatud veinivalmistustavade ja piirangutega, kõrvalsaaduste
    minimaalse alkoholisisalduse ja nende kõrvaldamisega ning Rahvusvahelise Viinamarja-
    ja Veiniorganisatsiooni (OIV) toimikute avaldamisega) teatavaid keeleversioone
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/16, annettu 22 päivänä lokakuuta
    2021, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 1308/2013 täydentämisestä
    viininviljelyalueiden, joilla alkoholipitoisuutta voi lisätä, rypäletuotteiden
    valmistukseen ja säilytykseen sovellettavien sallittujen viininvalmistusmenetelmien
    ja sovellettavien rajoitusten, sivutuotteiden vähimmäisalkoholipitoisuuden ja
    sivutuotteiden poistamisen sekä OIV:n viininvalmistusmenetelmien käytännesäännöstön
