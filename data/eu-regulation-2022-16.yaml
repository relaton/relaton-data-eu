title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/16 of 22 October 2021 correcting
    certain language versions of Delegated Regulation (EU) 2019/934 supplementing
    Regulation (EU) No 1308/2013 of the European Parliament and of the Council as
    regards wine-growing areas where the alcoholic strength may be increased, authorised
    oenological practices and restrictions applicable to the production and conservation
    of grapevine products, the minimum percentage of alcohol for by-products and their
    disposal, and publication of OIV files
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/16 de la Commission du 22 octobre 2021
    rectifiant certaines versions linguistiques du règlement délégué (UE) 2019/934
    complétant le règlement (UE) no 1308/2013 du Parlement européen et du Conseil
    en ce qui concerne les zones viticoles où le titre alcoométrique peut être
    augmenté, les pratiques œnologiques autorisées et les restrictions applicables
    à la production et à la conservation de produits de la vigne, le pourcentage
    minimal d’alcool pour les sous-produits et leur élimination, et la publication
    des fiches de l’OIV
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/16 der Kommission vom 22. Oktober 2021
    zur Berichtigung bestimmter Sprachfassungen der Delegierten Verordnung (EU) 2019/934
    zur Ergänzung der Verordnung (EU) Nr. 1308/2013 des Europäischen Parlaments
    und des Rates hinsichtlich der Anbauflächen, auf denen der Alkoholgehalt der
    Weine erhöht werden darf, der zugelassenen önologischen Verfahren und der Einschränkungen
    für die Erzeugung und Haltbarmachung von Weinbauerzeugnissen, des Mindestalkoholgehalts
    von Nebenerzeugnissen und deren Beseitigung sowie der Veröffentlichung von OIV-Dossiers
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/16 на Комисията
    от 22 октомври 2021 година за поправка на текста
    на някои езици на Делегиран регламент (ЕС) 2019/934
    за допълнение на Регламент (ЕС) № 1308/2013 на Европейския
    парламент и на Съвета по отношение на лозарските
    райони, където алкохолното съдържание може
    да бъде увеличено, разрешените енологични
    практики и ограниченията, приложими към производството
    и съхраняването на лозаро-винарските продукти,
    минималния съдържим процент алкохол във вторичните
    продукти и тяхното отстраняване, както и публикуването
    на досиетата на OIV
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/16 ze dne 22. října
    2021, kterým se opravují některá jazyková znění nařízení v přenesené
    pravomoci (EU) 2019/934, kterým se doplňuje nařízení Evropského parlamentu
    a Rady (EU) č. 1308/2013, pokud jde o vinařské oblasti, kde lze zvýšit obsah
    alkoholu, povolené enologické postupy a omezení týkající se výroby a ošetření
    výrobků z révy vinné, minimální procentní podíl alkoholu pro vedlejší
    výrobky a jejich likvidaci a zveřejnění složek OIV
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/16 af 22. oktober 2021 om
    berigtigelse af visse sprogudgaver af delegeret forordning (EU) 2019/934 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) nr. 1308/2013 for så
    vidt angår vindyrkningsområder, hvor alkoholindholdet kan forhøjes, de tilladte
    ønologiske fremgangsmåder og restriktioner for produktion og konservering af
    vinavlsprodukter, minimumsalkoholindholdet for biprodukter og deres bortskaffelse
    samt offentliggørelsen af OIV-dossierer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/16
    της Επιτροπής της 22ας Οκτωβρίου 2021 για τη διόρθωση
