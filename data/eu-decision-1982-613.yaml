title:
- language: en
  script: Latn
  content: '82/613/EEC: Commission Decision of 16 August 1982 establishing that the
    apparatus described as ''PHI - Analysis System, consisting of: differential Ion
    Gun, model 04-303, Ion Gun Control, model 11-065, X-Y Recorder, model 18-020 and
    Multiplex Control, model 20- 055'' may not be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/613/CEE: Décision de la Commission, du 16 août 1982, constatant que
    l''importation de l''appareil dénommé "P.H.I. - Analysis System, consisting
    of: differential Ion Gun, model 04-303, Ion Gun Control, model 11-065, X- Y Recorder,
    model 18-020, Multiplex Control, model 20- 055" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/613/EWG: Entscheidung der Kommission vom 16. August 1982, mit der festgestellt
    wird, daß das Gerät ,,P.H.I. - Analysis System, consisting of: - differential
    Ion Gun, model 04-303, - Ion Gun Control, model 11-065, - X- Y Recorder, model
    18-020, - Multiplex Control, model 20- 055" nicht unter Befreiung von den Zöllen
    des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/613/EØF: Kommissionens beslutning af 16. august 1982 om fastslåelse
    af, at indførsel af apparatet "PHI - Analysis System, consisting of: - differential
    Ion Gun, model 04 - 303, - Ion Gun Control, model 11 - 065, - X-Y Recorder, model
    18 - 020, - Multiplex Control, model 20 - 055" ikke kan ske med fritagelse for
    told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/613/EOK: Απόφαση τής Επιτροπής τής 16ης Αυγούστου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «PHI — Analysis System, consisting of: — differential
    Jon Gun, model 04-303, — Jon Gun Control, model 11-065, — XY Recorder, model
    18-020, — Multiplex Control, model 20-055» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/613/CEE: Decisione della Commissione, del 16 agosto 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "PHI - Analysis System, consisting
    of: - Differential Ion Gun, model 04-303 - Ion Gun Control, model 11-065 - X-Y
    Recorder, model 18-020 - Multiplex Control, model 20-055" non può avvenire in
    franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/613/EEG: Beschikking van de Commissie van 16 augustus 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,P.H.I.-Analysis System, consisting
    of: -Differential Ion Gun, model 04-303, -Ion Gun Control, model 11-065, - X-Y
    Recorder, model 18-020, -Multiplex Control, model 20-055" niet met vrijstelling
    van de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
