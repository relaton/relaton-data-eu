title:
- language: en
  script: Latn
  content: '89/653/EEC: Commission Decision of 26 October 1989 establishing, for the
    surveys on the structure of agricultural holdings between 1988 and 1997, a Community
    programme of tables to be stored in the Tabular Data Bank (BDT) of the Eurofarm
    system'
  type: main
- language: fr
  script: Latn
  content: '89/653/CEE: Décision de la Commission, du 26 octobre 1989, fixant, en
    vue des enquêtes sur la structure des exploitations agricoles aux cours de la
    période 1988- 1997, le programme communautaire de tableaux destinés à être
    stockés dans la banque de données tabulaires (BDT) du système Eurofarm'
  type: main
- language: de
  script: Latn
  content: '89/653/EWG: Entscheidung der Kommission vom 26. Oktober 1989 zur Festlegung
    des Gemeinschaftsprogramms der für die Tabellendatenbank (BDT) des Systems Eurofarm
    bestimmten Tabellen zum Zweck der Durchführung der Erhebungen für die Struktur
    der landwirtschaftlichen Betriebe im Zeitraum 1988 bis 1997'
  type: main
- language: da
  script: Latn
  content: '89/653/EØF: Kommissionens beslutning af 26. oktober 1989 om fastsættelse
    af Fællesskabets tabelprogram, som skal lagres i EUROFARM-projektets Bank for
    Tabeldata (BDT) med henblik på undersøgelserne af landbrugsbedrifternes struktur
    i perioden 1988 til 1997'
  type: main
- language: el
  script: Grek
  content: '89/653/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Οκτωβρίου 1989 που καθορίζει, ενόψει των ερευνών
    σχετικά με τη διάρθρωση των γεωργικών εκμεταλλεύσεων
    κατά τη χρονική περίοδο 1988-1997, το κοινοτικό
    πρόγραμμα πινάκων που θα περιληφθούν στη βάση
    πινακοποιημένων στοιχείων (BDT) του συστήματος
    Eurofarm'
  type: main
- language: fi
  script: Latn
  content: '89/653/ETY: Komission päätös, tehty 26 päivänä lokakuuta 1989, yhteisön
    ohjelmasta vuosina 1988-1997 suoritettavan maatilojen rakennetta koskevien tietojen
    keruun yhteydessä Eurofarm-järjestelmän taulukkotietopankkiin (BDT) tallennettavia
    taulukoita varten'
  type: main
- language: it
  script: Latn
  content: '89/653/CEE: Decisione della Commissione, del 26 ottobre 1989, che fissa,
    in vista delle indagini sulla struttura delle aziende agricole nel corso del periodo
    1988-1997, il programma comunitario di tabelle destinate ad essere memorizzate
    nella banca dati tabulari (BDT) del sistema EUROFARM'
  type: main
- language: nl
  script: Latn
  content: '89/653/EEG: Beschikking van de Commissie van 26 oktober 1989 houdende
    vaststelling, ten behoeve van de enquêtes inzake de structuur van de landbouwbedrijven
    in het tijdvak van 1988 tot en met 1997, van het communautaire programma van tabellen
    die in de bank voor gegevens in tabelvorm (BDT) van het Eurofarm-systeem moeten
    worden opgeslagen'
  type: main
- language: pt
  script: Latn
  content: '89/653/CEE: Decisão da Comissão, de 26 de Outubro de 1989, determinando,
    com vista aos inquéritos sobre a estrutura das explorações agrícolas para
    o período de 1988 a 1997, o programa comunitário de quadros destinados a serem
    armazenados no banco de dados tabulares (BDT) do sistema Eurofarm'
  type: main
- language: es
  script: Latn
  content: '89/653/CEE: Decisión de la Comisión, de 26 de octubre de 1989, por la
