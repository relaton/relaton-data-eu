title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1748/77 of 29 July 1977 determining the
    amounts applicable as accession compensatory amounts during the month of August
    1977 to certain cereal and rice products exported in the form of goods not covered
    by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1748/77 de la Commission, du 29 juillet 1977, déterminant
    les montants applicables à titre de montants compensatoires «adhésion» pendant
    le mois d'août 1977 à certains produits des secteurs des céréales et du riz
    exportés sous forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1748/77 der Kommission vom 29. Juli 1977 zur Festsetzung
    der im August 1977 als Beitrittsausgleichsbeträge geltenden Beträge für bestimmte
    Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang II des Vertrages
    fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1748/77 af 29. juli 1977 om fastsættelse
    af de beløb, der i august 1977 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1748/77 della Commissione, del 29 luglio 1977, che
    determina gli importi compensativi «adesione» applicabili, durante il mese di
    agosto 1977, a taluni prodotti dei settori dei cereali e del riso esportati sotto
    forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1748/77 van de Commissie van 29 juli 1977 houdende
    vaststelling van de bedragen die gedurende de maand augustus 1977 als compenserende
    bedragen "toetreding" moeten worden toegepast voor bepaalde produkten van de sector
    granen en de sector rijst, uitgevoerd in de vorm van niet onder bijlage II van
    het Verdrag vallende goederen
  type: main
