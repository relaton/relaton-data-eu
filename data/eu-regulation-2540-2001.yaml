  script: Latn
  content: Commission Regulation (EC) No 2540/2001 of 21 December 2001 derogating
    from Regulation (EC) No 1148/2001 as regards conformity checks at the stage of
    import applicable to fresh fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2540/2001 de la Commission du 21 décembre 2001 dérogeant
    au règlement (CE) n° 1148/2001 en ce qui concerne les contrôles de conformité
    au stade de l'importation applicables dans le secteur des fruits et légumes frais
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2540/2001 der Kommission vom 21. Dezember 2001 zur
