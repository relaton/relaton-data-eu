    Obst und Gemüse auf der Einfuhrstufe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2540/2001 af 21. december 2001 om fravigelse
    af forordning (EF) nr. 1148/2001 for så vidt angår overensstemmelseskontrol
    ved import af friske frugter og grøntsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2540/2001 της Επιτροπής,
    της 21ης Δεκεμβρίου 2001, για παρέκκλιση από τον
    κανονισμό (ΕΚ) αριθ. 1148/2001 όσον αφορά τους ελέγχους
    τήρησης των προδιαγραφών στο στάδιο της εισαγωγής
    που εφαρμόζονται στον τομέα των νωπών οπωροκηπευτικών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2540/2001, annettu 21 päivänä joulukuuta 2001,
    asetuksesta (EY) N:o 1148/2001 poikkeamisesta hedelmä- ja vihannesalalla tuontivaiheessa
    sovellettavien vaatimustenmukaisuustarkastusten osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2540/2001 della Commissione, del 21 dicembre 2001,
    che deroga al regolamento (CE) n. 1148/2001 per quanto riguarda i controlli di
    conformità nella fase dell'importazione applicabili nel settore degli ortofrutticoli
    freschi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2540/2001 van de Commissie van 21 december 2001 houdende
    afwĳking van Verordening (EG) nr. 1148/2001 ten aanzien van normcontroles in
    het invoerstadium in de sector verse groenten en fruit
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2540/2001 da Comissão, de 21 de Dezembro de 2001,
    que estabelece uma derrogação do Regulamento (CEE) n.° 1148/2001 no que respeita
    aos controlos de conformidade no estádio da importação aplicáveis no sector
    das frutas e produtos hortícolas frescos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2540/2001 de la Comisión, de 21 de diciembre de 2001,
