title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2824/71 du Conseil, du 20 décembre 1971, portant
    fixation des contingents quantitatifs communautaires à l'exportation pour certaines
    cendres et certains résidus de cuivre ainsi que pour certains déchets et débris
    de cuivre, d'aluminium et de plomb
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2824/71 des Rates vom 20. Dezember 1971 zur Festsetzung
    der mengenmäßigen Ausfuhrkontingente der Gemeinschaft für bestimmte Aschen
    und Rückstände von Kupfer sowie für bestimmte Bearbeitungsabfälle und bestimmten
    Schrott aus Kupfer, Aluminium und Blei
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2824/71 del Consiglio, del 20 dicembre 1971, che fissa
    i contingenti quantitativi comunitari all'esportazione per alcune ceneri e alcuni
    residui di rame, nonché per alcuni cascami e rottami di rame, di alluminio e
    di piombo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2824/71 van de Raad van 20 december 1971 betreffende
    de vaststelling van de gemeenschappelijke kwantitatieve uitvoercontingenten voor
    bepaalde assen en residuen van koper, alsmede voor bepaalde resten en afvallen
    van koper, aluminium en lood
  type: main
