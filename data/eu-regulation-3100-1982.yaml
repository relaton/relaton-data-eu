title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3100/82 of 8 November 1982 opening, allocating
    and providing for the administration of a Community tariff quota for dried grapes
    in immediate containers of a net capacity of 15 kilograms or less, falling within
    subheading 08.04 B I of the Common Customs Tariff (1983)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3100/82 du Conseil, du 8 novembre 1982, portant ouverture,
    répartition et mode de gestion d' un contingent tarifaire communautaire de raisins
    secs, présentés en emballages immédiats d' un contenu net inférieur ou égal
    à 15 kilogrammes, de la sous-position 08.04 B I du tarif douanier commun (1983)
  type: main
- language: de
  script: Latn
