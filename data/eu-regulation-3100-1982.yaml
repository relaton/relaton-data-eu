    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 Kilogramm
    oder weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs (1983)
  type: main
- language: da
  script: Latn
