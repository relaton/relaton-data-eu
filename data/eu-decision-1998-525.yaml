title:
- language: en
  script: Latn
  content: '98/525/EC: Commission Decision of 5 August 1998 amending Decision 97/660/EC
    adopting the plan allocating to the Member States resources to be charged to the
    1998 budget year for the supply of food from intervention stocks for the benefit
    of the most deprived persons in the Community (notified under document number
    C(1998) 2331)'
  type: main
- language: fr
  script: Latn
  content: '98/525/CE: Décision de la Commission du 5 août 1998 modifiant la décision
    97/660/CE adoptant le plan portant attribution aux États membres de ressources
    imputables à l''exercice 1998 pour l''exécution des fournitures de denrées
    alimentaires provenant des stocks d''intervention au bénéfice des personnes
    les plus démunies de la Communauté [notifiée sous le numéro C(1998) 2331]'
  type: main
- language: de
  script: Latn
  content: '98/525/EG: Entscheidung der Kommission vom 5. August 1998 zur Änderung
    der Entscheidung 97/660/EG mit dem Programm zur Bewilligung von Mitteln, die den
    Mitgliedstaaten für die Lieferung von Nahrungsmitteln aus Interventionsbeständen
    zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr
    1998 zu verbuchen sind (Bekanntgegeben unter Aktenzeichen K(1998) 2331)'
  type: main
- language: da
  script: Latn
  content: '98/525/EF: Kommissionens beslutning af 5. august 1998 om ændring af beslutning
    97/660/EF om vedtagelse af planen for tildeling til medlemsstaterne af midler,
    der kan afholdes over 1998-budgettet, og som skal dække udgifterne til levering
    af levnedsmidler fra interventionslagre til de socialt dårligst stillede personer
    i Fællesskabet (meddelt under nummer K(1998) 2331)'
  type: main
- language: el
  script: Grek
  content: '98/525/ΕΚ: Απόφαση της Επιτροπής της 5ης Αυγούστου
    1998 περί τροποποίησης της απόφασης 97/660/ΕΚ για
    την έγκριση του προγράμματος για την κατανομή
    στα κράτη μέλη των πόρων που θα καταλογισθούν
    στο έτος προϋπολογισμού 1998 για την παροχή τροφίμων
    που προέρχονται από τα αποθέματα παρέμβασης
    στα άπορα άτομα της Κοινότητας [κοινοποιηθείσα
    υπό τον αριθμό Ε(1998) 2331]'
  type: main
- language: fi
  script: Latn
  content: '98/525/EY: Komission päätös, tehty 5 päivänä elokuuta 1998, varainhoitovuodelle
    1998 kirjattavien varojen jakamista jäsenvaltioille koskevan suunnitelman hyväksymisestä
    interventiovarastoista peräisin olevien elintarvikkeiden toimittamiseksi yhteisön
    vähävaraisimmille henkilöille tehdyn päätöksen 97/660/EY muuttamisesta (tiedoksiannettu
    numerolla K(1998) 2331)'
  type: main
- language: it
  script: Latn
  content: '98/525/CE: Decisione della Commissione del 5 agosto 1998 recante modifica
    della decisione 97/660/CE che approva il piano di ripartizione tra gli Stati membri
    delle risorse da imputare all''esercizio finanziario 1998 per l''esecuzione delle
    forniture di derrate alimentari provenienti dalle scorte d''intervento a favore
    degli indigenti nella Comunità [notificata con il numero C(1998) 2331]'
  type: main
- language: nl
  script: Latn
  content: '98/525/EG: Beschikking van de Commissie van 5 augustus 1998 houdende wijziging
    van Beschikking 97/660/EG tot vaststelling van het jaarplan voor de toewijzing
    aan de lidstaten van voor het begrotingsjaar 1998 te boeken financiële middelen
    voor de levering van levensmiddelen uit interventievoorraden aan de meest hulpbehoevenden
    in de Gemeenschap (kennisgeving geschied onder nummer C(1998) 2331)'
  type: main
- language: pt
  script: Latn
  content: '98/525/CE: Decisão da Comissão de 5 de Agosto de 1998 que altera a Decisão
