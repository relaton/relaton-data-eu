    for anvendelsen af traktatens artikel 85 og 86 på søtransport og ændring af
    forordning (EF) nr. 1/2003 med henblik på udvidelse af dens anvendelsesområde
    til at omfatte cabotagesejlads og international trampfart
  type: main
