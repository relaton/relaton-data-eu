  script: Latn
  content: Reglamento (CE) n o 1419/2006 del Consejo, de 25 de septiembre de 2006
    , que deroga el Reglamento (CEE) n o 4056/86 por el que se determinan las modalidades
    de aplicación de los artículos 85 y 86 del Tratado a los transportes marítimos
    y se modifica el Reglamento (CE) n o 1/2003 ampliando su alcance con objeto de
    incluir el cabotaje y los servicios internacionales de tramp
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1419/2006 av den 25 september 2006 om upphävande
