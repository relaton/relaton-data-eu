    art. 85 i 86 Traktatu do transportu morskiego oraz zmieniające rozporządzenie
    (WE) nr 1/2003 w zakresie rozszerzenia jego zakresu na usługi kabotażu i międzynarodowe
    usługi trampowe
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1419/2006 do Conselho, de 25 de Setembro de 2006
    , que revoga o Regulamento (CEE) n. o 4056/86, que determina as regras de aplicação
    aos transportes marítimos dos artigos 85. o e 86. o do Tratado, e que altera
    o Regulamento (CE) n. o 1/2003 por forma a tornar o seu âmbito de aplicação
    extensível aos serviços internacionais de cabotagem e de tramp
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1419/2006 al Consiliului din 25 septembrie 2006 de
    abrogare a Regulamentului (CEE) nr. 4056/86 de stabilire a normelor detaliate
    de aplicare a dispozițiilor articolelor 85 și 86 din tratat la transportul maritim
    și de modificare a Regulamentului (CE) nr. 1/2003 în sensul extinderii domeniului
    de aplicare al acestuia pentru a include cabotajul și serviciile tramp internaționale
  type: main
