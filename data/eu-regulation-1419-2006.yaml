    a nemzetközi tramphajózási szolgáltatásokra való kiterjesztéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1419/2006 del Consiglio, del 25 settembre 2006 , che
    abroga il regolamento (CEE) n. 4056/86, che determina le modalità di applicazione
    degli articoli 85 e 86 del trattato ai trasporti marittimi, e che modifica il
    regolamento (CE) n. 1/2003 estendendone il campo di applicazione al cabotaggio
    e ai servizi internazionali di trasporto con navi da carico non regolari
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1419/2006 ( 2006. gada 25. septembris ), ar kuru
    atceļ Regulu (EEK) Nr. 4056/86, ar ko paredz sīki izstrādātus noteikumus par
    to, kā Līguma 85. un 86. pantu piemērot attiecībā uz jūras transportu, un
    ar kuru groza Regulu (EK) Nr. 1/2003 attiecībā uz tās darbības jomas paplašināšanu,
    iekļaujot kabotāžas un starptautisko līgumreisu kuģu pakalpojumus
  type: main
- language: lt
  script: Latn
