    toepassing van de artikelen 85 en 86 van het Verdrag op het zeevervoer en tot
    wijziging van Verordening (EG) nr. 1/2003 inzake de uitbreiding van het toepassingsgebied
    van deze verordening tot cabotage en internationale wilde vaart
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1419/2006 z dnia 25 września 2006 r. uchylające
