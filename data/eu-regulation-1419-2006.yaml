    taikymo jūrų transportui taisykles, ir iš dalies keičiantis Reglamentą (EB)
    Nr. 1/2003, išplečiant jo taikymo sritį, įtraukiant kabotažą ir tarptautines
    trampines paslaugas
  type: main
