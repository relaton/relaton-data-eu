title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1419/2006 of 25 September 2006 repealing Regulation
    (EEC) No 4056/86 laying down detailed rules for the application of Articles 85
    and 86 of the Treaty to maritime transport, and amending Regulation (EC) No 1/2003
    as regards the extension of its scope to include cabotage and international tramp
    services
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1419/2006 du Conseil du 25 septembre 2006 abrogeant
    le règlement (CEE) n o 4056/86 déterminant les modalités d'application des
    articles 85 et 86 du traité aux transports maritimes, et modifiant le règlement
    (CE) n o 1/2003 de manière à étendre son champ d'application au cabotage et
    aux services internationaux de tramp
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1419/2006 des Rates vom 25. September 2006 zur Aufhebung
    der Verordnung (EWG) Nr. 4056/86 über die Einzelheiten der Anwendung der Artikel
    85 und 86 des Vertrags auf den Seeverkehr und zur Ausweitung des Anwendungsbereichs
    der Verordnung (EG) Nr. 1/2003 auf Kabotage und internationale Trampdienste
  type: main
