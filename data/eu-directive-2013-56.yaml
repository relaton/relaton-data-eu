    и на Съвета относно батерии и акумулатори и
    отпадъци от батерии и акумулатори по отношение
    на пускането на пазара на преносими батерии
    и акумулатори, съдържащи кадмий и предназначени
    за използване в електрически инструменти без
    захранващ шнур, както и на клетъчни батерии
    с ниско живачно съдържание и за отмяна на Решение
    2009/603/ЕО на Комисията
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2013/56/EU ze dne 20. listopadu
    2013 , kterou se mění směrnice Evropského parlamentu a Rady 2006/66/ES o bateriích
    a akumulátorech a odpadních bateriích a akumulátorech, pokud jde o uvádění
    na trh přenosných baterií a akumulátorů obsahujících kadmium, které jsou
    určené do bezšňůrových elektrických nástrojů, a knoflíkových článků
    s nízkým obsahem rtuti, a kterou se zrušuje rozhodnutí Komise 2009/603/ES
  type: main
