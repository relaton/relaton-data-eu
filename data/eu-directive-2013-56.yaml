    dėl baterijų ir akumuliatorių bei baterijų ir akumuliatorių atliekų nuostatos
    dėl nešiojamų baterijų ir akumuliatorių, kurių sudėtyje yra kadmio ir kurie
    skirti naudoti bevieliuose elektriniuose įrankiuose, ir sagos formos elementų,
    kuriuose yra nedidelis kiekis gyvsidabrio, pateikimo rinkai ir panaikinamas Komisijos
    sprendimas 2009/603/EB
  type: main
