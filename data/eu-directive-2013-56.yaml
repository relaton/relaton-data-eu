    -akkumulátorokról szóló 2006/66/EK európai parlamenti és tanácsi irányelvnek
    a vezeték nélküli villamos kézi szerszámokba szánt, kadmiumot tartalmazó
    hordozható elemek és akkumulátorok, valamint az alacsony higanytartalmú gombelemek
    forgalomba hozatala tekintetében történő módosításáról, és a 2009/603/EK
    bizottsági határozat hatályon kívül helyezéséről
  type: main
