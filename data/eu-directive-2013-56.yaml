  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2013/56/EU af 20. november 2013
    om ændring af Europa-Parlamentets og Rådets direktiv 2006/66/EF om batterier
    og akkumulatorer og udtjente batterier og akkumulatorer for så vidt angår markedsføring
    af bærbare cadmiumholdige batterier og akkumulatorer, der er beregnet til anvendelse
    i batteridrevet håndværktøj, og af knapcellebatterier med lavt kviksølvindhold,
    og om ophævelse af Kommissionens beslutning 2009/603/EF
  type: main
