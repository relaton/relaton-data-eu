    inzake batterijen en accu’s, alsook afgedankte batterijen en accu’s, wat het
    op de markt brengen van cadmiumhoudende draagbare batterijen en accu’s voor
    gebruik in draadloos elektrisch gereedschap en van knoopcellen met een laag kwikgehalte
    betreft, en houdende intrekking van Beschikking 2009/603/EG van de Commissie
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2013/56/UE z dnia 20 listopada
    2013 r. zmieniająca dyrektywę 2006/66/WE Parlamentu Europejskiego i Rady w sprawie
    baterii i akumulatorów oraz zużytych baterii i akumulatorów w odniesieniu do
    wprowadzania do obrotu baterii i akumulatorów przenośnych zawierających kadm
    przeznaczonych do użytku w elektronarzędziach bezprzewodowych i ogniwach guzikowych
    o niskiej zawartości rtęci, oraz uchylająca decyzję Komisji 2009/603/WE
  type: main
- language: pt
  script: Latn
  content: Diretiva 2013/56/UE do Parlamento Europeu e do Conselho, de 20 de novembro
    de 2013 , que altera a Diretiva 2006/66/CE do Parlamento Europeu e do Conselho
    relativa a pilhas e acumuladores e respetivos resíduos, no que respeita à colocação
    no mercado de pilhas e acumuladores portáteis que contenham cádmio, destinados
    à utilização em ferramentas elétricas sem fios, e de pilhas-botão com baixo
    teor de mercúrio, e que revoga a Decisão 2009/603/CE da Comissão
  type: main
- language: ro
  script: Latn
  content: Directiva 2013/56/UE a Parlamentului European și a Consiliului din 20
    noiembrie 2013 de modificare a Directivei 2006/66/CE a Parlamentului European
    și a Consiliului privind bateriile și acumulatorii și deșeurile de baterii
    și acumulatori, în ceea ce privește introducerea pe piață a bateriilor și
    acumulatorilor portabili care conțin cadmiu și sunt destinați utilizării în
    uneltele electrice fără fir și a bateriilor tip „nasture” cu conținut
    redus de mercur, și de abrogare a Deciziei 2009/603/CE a Comisiei
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2013/56/EÚ z 20. novembra 2013
    , ktorou sa mení smernica Európskeho parlamentu a Rady 2006/66/ES o batériách
    a akumulátoroch a použitých batériách a akumulátoroch, pokiaľ ide o uvádzanie
    prenosných batérií a akumulátorov, ktoré obsahujú kadmium a sú určené
    na použitie v bezšnúrových elektrických nástrojoch, a gombíkových článkov
    s nízkym obsahom ortuti na trh, a ktorou sa zrušuje rozhodnutie Komisie 2009/603/ES
  type: main
