    dwar batteriji u akkumulaturi u skart ta’ batteriji u ta’ akkumulaturi fir-rigward
    tat-tqegħid fis-suq ta’ batteriji u akkumulaturi portabbli li jkun fihom il-kadmju
    maħsuba għall-użu f’għodda mingħajr fil imħaddma bl-enerġija, u ta’
