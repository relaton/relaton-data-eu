    2013 o spremembi Direktive 2006/66/ES Evropskega parlamenta in Sveta o baterijah
    in akumulatorjih ter odpadnih baterijah in akumulatorjih glede dajanja na trg
    prenosnih baterij in akumulatorjev, ki vsebujejo kadmij, namenjenih za brezžično
    električno orodje, in gumbastih celic z nizko vsebnostjo živega srebra ter o
    razveljavitvi Odločbe Komisije 2009/603/ES
  type: main
- language: es
  script: Latn
  content: Directiva 2013/56/UE del Parlamento Europeo y del Consejo, de 20 de noviembre
    de 2013 , por la que se modifica la Directiva 2006/66/CE del Parlamento Europeo
    y del Consejo, relativa a las pilas y acumuladores y a los residuos de pilas y
    acumuladores, por lo que respecta a la puesta en el mercado de pilas y acumuladores
    portátiles que contengan cadmio, destinados a utilizarse en herramientas eléctricas
    inalámbricas, y de pilas botón con un bajo contenido de mercurio, y se deroga
    la Decisión 2009/603/CE de la Comisión
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2013/56/EU av den 20 november 2013
    om ändring av Europaparlamentets och rådets direktiv 2006/66/EG om batterier
    och ackumulatorer och förbrukade batterier och ackumulatorer vad gäller utsläppande
    på marknaden av bärbara batterier och ackumulatorer som innehåller kadmium
    och som är avsedda att användas i sladdlösa elektriska handverktyg och knappceller
    med låg kvicksilverhalt och om upphävande av kommissionens beslut 2009/603/EG
