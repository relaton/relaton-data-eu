  script: Latn
  content: Direttiva 2013/56/UE del Parlamento europeo e del Consiglio, del 20 novembre
    2013 , che modifica la direttiva 2006/66/CE del Parlamento europeo e del Consiglio
    relativa a pile e accumulatori e ai rifiuti di pile e accumulatori per quanto
    riguarda l’immissione sul mercato di batterie portatili e di accumulatori contenenti
    cadmio destinati a essere utilizzati negli utensili elettrici senza fili e di
    pile a bottone con un basso tenore di mercurio, e che abroga la decisione 2009/603/CE
    della Commissione
  type: main
- language: lv
  script: Latn
