title:
- language: en
  script: Latn
  content: Directive 2013/56/EU of the European Parliament and of the Council of 20
    November 2013 amending Directive 2006/66/EC of the European Parliament and of
    the Council on batteries and accumulators and waste batteries and accumulators
    as regards the placing on the market of portable batteries and accumulators containing
    cadmium intended for use in cordless power tools, and of button cells with low
    mercury content, and repealing Commission Decision 2009/603/EC
  type: main
- language: fr
  script: Latn
  content: Directive 2013/56/UE du Parlement européen et du Conseil du 20 novembre
    2013 modifiant la directive 2006/66/CE du Parlement européen et du Conseil relative
    aux piles et accumulateurs ainsi qu’aux déchets de piles et d’accumulateurs
    en ce qui concerne la mise sur le marché de piles et d’accumulateurs portables
    contenant du cadmium destinés à être utilisés dans des outils électriques
    sans fil et de piles bouton à faible teneur en mercure, et abrogeant la décision
    2009/603/CE de la Commission
  type: main
- language: de
  script: Latn
  content: Richtlinie 2013/56/EU des Europäischen Parlaments und des Rates vom 20.
    November 2013 zur Änderung der Richtlinie 2006/66/EG des Europäischen Parlaments
    und des Rates über Batterien und Akkumulatoren sowie Altbatterien und Altakkumulatoren
    hinsichtlich des Inverkehrbringens von Cadmium enthaltenden Gerätebatterien und
    -akkumulatoren, die zur Verwendung in schnurlosen Elektrowerkzeugen bestimmt sind,
    und von Knopfzellen mit geringem Quecksilbergehalt sowie zur Aufhebung der Entscheidung
    2009/603/EG der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Директива 2013/56/ЕС на Европейския парламент
