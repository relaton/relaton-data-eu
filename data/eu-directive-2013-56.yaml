    un akumulatoriem, un bateriju un akumulatoru atkritumiem attiecībā uz tādu
    kadmiju saturošu pārnēsājamu bateriju un akumulatoru laišanu tirgū, kurus
    paredzēts izmantot bezvada elektriskajos instrumentos, kā arī attiecībā uz
    podziņelementu ar nelielu dzīvsudraba saturu laišanu tirgū un ar ko atceļ
    Komisijas Lēmumu 2009/603/EK
  type: main
