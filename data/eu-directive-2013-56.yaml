    i o otpadnim baterijama i akumulatorima s obzirom na stavljanje na tržište prijenosnih
    baterija i akumulatora koji sadržavaju kadmij namijenjenih za korištenje u bežičnim
    električnim alatima te gumbastih ćelija s niskim sadržajem žive te o stavljanju
