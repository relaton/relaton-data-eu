title:
- language: en
  script: Latn
  content: '82/477/EEC: Commission Decision of 5 July 1982 establishing that the apparatus
    described as ''Photo Research - Pritchard Photometer, model 1980 A-WB with Cassegrain
    Telescope, model CO-1250, Scotopic Response Filter, model SF-80 and Tristimulus
    Filter, model TF-80'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/477/CEE: Décision de la Commission, du 5 juillet 1982, constatant
    que l''importation de l''appareil dénommé "Photo Research-Pritchard Photometer,
    model 1980 A-WB with Cassegrain Telescope, model CO-1250, Scotopic Response Filter,
    model SF-80, and Tristimulus Filter, model TF-80" peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/477/EWG: Entscheidung der Kommission vom 5. Juli 1982, mit der festgestellt
    wird, daß das Gerät ,,Photo Research-Pritchard Photometer, model 1980 A-WB with
    Cassegrain Telescope, model CO-1250, Scotopic Response Filter, model SF-80, and
    Tristimulus Filter, model TF- 80" unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/477/EØF: Kommissionens beslutning af 5. juli 1982 om fastslåelse
    af, at indførsel af apparatet "Photo Research-Pritchard Photometer, model 1980
    A-WB with Cassegrain Telescope, model CO-1250, Scotopic Response Filter, model
    S6-80 and Tristimulus Filter, model TF-80" kan ske med fritagelse for told efter
    den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/477/EOK: Απόφαση τής Επιτροπής τής 5ης Ιουλίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Photo Research — Pritchard Photometer, model
    1980 A-WB with Cassegrain Telescope, model CO-1250, Scotopic Response Filter,
    model SF-80 and Tristimulus Filter, model TF 80» δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/477/CEE: Decisione della Commissione, del 5 luglio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Photo Research -Pritchard Photometer,
    model 1980 A-WB with Cassegrain Telescope, model CO-1250, Scotopic Response Filter,
    model SF-80 and Tristimulus Filter, model TF-80" può avvenire in franchigia dai
    dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/477/EEG: Beschikking van de Commissie van 5 juli 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,PHOTO RESEARCH - Pritchard Photometer,
    model 1980 A-WB with Cassegrain Telescope, model CO-1250, Scotopic Response Filter,
    model SF-80 and Tristimulus Filter, model TF-80" met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
