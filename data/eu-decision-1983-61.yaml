title:
- language: en
  script: Latn
  content: '83/61/EEC: Commission Decision of 28 January 1983 establishing that the
    apparatus described as ''WMI - Radio-Tracking Transmitter'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/61/CEE: Décision de la Commission du 28 janvier 1983 constatant que
    l''importation de l''appareil dénommé "W.M.I. - Radio-Tracking Transmitter"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/61/EWG: Entscheidung der Kommission vom 28. Januar 1983, mit der festgestellt
    wird, daß das Gerät ,,W.M.I. - Radio-Tracking Transmitter" nicht unter Befreiung
    von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/61/EØF: Kommissionens beslutning af 28. januar 1983 om fastslåelse
    af, at indførsel af apparatet "WMI - Radio-Tracking Transmitter" ikke kan ske
    med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/61/ΕΟΚ: Απόφαση της Επιτροπής της 28ης Ιανουαρίου
    1983 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «WMI — Radio-Tracking Transmitter» δεν δύναται
    να πραγματοποιηθεί ατελώς ως προς τους δασμούς
    του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/61/CEE: Decisione della Commissione del 28 gennaio 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "WMI - Radio-Tracking Transmitter"
    non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/61/EEG: Beschikking van de Commissie van 28 januari 1983 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,W.M.I. - Radio-Tracking Transmitter" niet
    met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag worden
    ingevoerd'
  type: main
