title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1000/2004 of 18 May 2004 accepting undertakings
    offered in connection with the anti-dumping proceeding concerning imports of certain
    grain oriented electrical sheets and strips of silicon-electrical steel with a
    width of more than 500 mm originating in the Russian Federation and making imports
    of certain grain oriented electrical sheets originating in the Russian Federation
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1000/2004 de la Commission du 18 mai 2004 portant acceptation
    des engagements offerts dans le cadre de la procédure antidumping concernant
    les importations de certaines tôles et de certains feuillards laminés à froid,
    à grains orientés, en aciers au silicium dits «magnétiques», d'une largeur
    supérieure à 500 mm originaires de la Fédération de Russie et soumettant à
    enregistrement les importations de certaines tôles dites «magnétiques» à
    grains orientés originaires de la Fédération de Russie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1000/2004 der Kommission vom 18. Mai 2004 zur Annahme
    von Verpflichtungsangeboten im Zusammenhang mit dem Antidumpingverfahren betreffend
    die Einfuhren bestimmter kornorientierter Bleche aus Silicium-Elektrostahl mit
    einer Breite von mehr als 500 mm mit Ursprung in der Russischen Föderation und
    zur zollamtlichen Erfassung der genannten Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1000/2004 ze dne 18. května 2004 o přijetí
    závazků nabídnutých v souvislosti s antidumpingovým řízením týkajícím
    se dovozů některých izotropních elektroplechů a pásů z křemíkové elektrooceli
    širších než 500 mm pocházejících z Ruské federace a o vedení záznamů
    o dovozech některých izotropních elektroplechů pocházejících z Ruské federace
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1000/2004 af 18. maj 2004 om godtagelse
    af tilsagn, der er afgivet i forbindelse med antidumpingproceduren vedrørende
    importen af visse kornorienterede elektriske plader og bånd af silicium-elektrisk
    stål af en bredde på over 500 mm med oprindelse i Den Russiske Føderation,
    og om at gøre importen af visse kornorienterede elektriske plader med oprindelse
    i Den Russiske Føderation til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1000/2004 της Επιτροπής,
    της 18ης Μαΐου 2004, για την αποδοχή των αναλήψεων
    υποχρεώσεων που προτάθηκαν στο πλαίσιο της
    διαδικασίας αντιντάμπινγκ όσον αφορά τις εισαγωγές
    ορισμένων φύλλων και ταινιών με προσανατολισμένους
    κόκκους από πυριτιούχο χάλυβα για ηλεκτρικές
    εφαρμογές, με πλάτος που υπερβαίνει τα 500 mm,
    καταγωγής Ρωσικής Ομοσπονδίας, και για την
    υποβολή των εισαγωγών ορισμένων φύλλων από
    χάλυβες με προσανατολισμένους κόκκους για
    ηλεκτρικές εφαρμογές, καταγωγής Ρωσικής Ομοσπονδίας,
    σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1000/2004, 18. mai 2004, millega kiidetakse
    heaks seoses Venemaa Föderatsioonist pärit teatava suundorienteeritud struktuuriga
    elektrotehnilise lehtterase ja üle 500 mm laiusega elektrotehnilise räniterase
    ribade importi käsitleva dumpinguvastase menetlusega pakutud kohustused ning
    kehtestatakse Venemaa Föderatsioonist pärit teatava suundorienteeritud struktuuriga
    elektrotehnilise lehtterase impordi suhtes registreerimisnõue
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1000/2004, annettu 18 päivänä toukokuuta 2004,
    Venäjän federaatiosta peräisin olevien tiettyjen piiseosteisesta sähköteknisestä
    teräksestä valmistettujen suuntaisrakeisten levyvalmisteiden, joiden leveys
    on suurempi kuin 500 mm, tuontia koskevan polkumyynnin vastaisen menettelyn yhteydessä
    tarjottujen sitoumusten hyväksymisestä sekä Venäjän federaatiosta peräisin
    olevien tiettyjen suuntaisrakeisten sähköteknisten levyvalmisteiden tuonnin
    kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1000/2004/EK rendelete (2004. május 18.) az Orosz Föderációból
    származó egyes irányított szemcseszerkezetű elektromos lemezek és 500 mm-nél
    szélesebb szilícium-elektromos acélszalagok behozatalát érintő dömpingellenes
    eljárással kapcsolatban vállalt kötelezettségek elfogadásáról és az Orosz
    Föderációból származó egyes irányított szemcseszerkezetű elektromos lemezek
    bejegyzésköteles behozataláról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1000/2004 della Commissione, del 18 maggio 2004, che
    accetta gli impegni offerti in relazione al procedimento antidumping relativo
    alle importazioni di alcuni tipi di lamiere dette «magnetiche», a grani orientati,
    e nastri di acciai al silicio detti «magnetici», a grani orientati, di larghezza
    superiore a 500 mm, originarie della Federazione Russa e che sottopone a registrazione
    le importazioni di alcuni tipi di lamiere dette «magnetiche», a grani orientati,
    originarie della Federazione Russa
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1000/2004 (2004. gada 18 maijs), ar ko pieņem
    saistības, kas piedāvātas saistībā ar antidempinga procedūru, kas attiecas
    uz dažu to Krievijas Federācijas izcelsmes elektrisko lokšņu ar orientētu
    graudu un elektrotehniskā silīcijtērauda slokšņu importu, kuru platums pārsniedz
    500 mm, un ar ko paredz dažu Krievijas Federācijas izcelsmes elektrisko lokšņu
    ar orientētu graudu importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2004 m. gegužės 18 d. Komisijos reglamentas (EB) Nr. 1000/2004 priimantis
    įsipareigojimus, pasiūlytus pagal antidempingo procedūrą dėl kai kurių orientuoto
    grūdėtumo plokščių valcavimo produktų, kurių plotis didesnis kaip 500 mm,
    ir kurių kilmės šalis yra Rusijos Federacija, importo, ir įpareigojantis registruoti
    importuojamus kai kuriuos orientuoto grūdėtumo plokščius valcavimo produktus,
    kurių kilmės šalis yra Rusijos Federacija
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1000/2004 tat- 18 ta' Mejju 2004 li
    jaċċetta l-garanziji offruti marbuta mal-proċeduri ta’ anti-dumping li jirreferu
    għall-importazzjoni ta’ xi tipi ta’ pjanċi elettroniċi li huma grain oriented
    ( grain oriented electrical sheets ) u strixxi ta’ azzar silikon-elettriku (
    strips of silicon-electrical steel ) b’wisa’ ta’ aktar minn 500 mm li joriġinaw
    mill-Federazzjoni Russa u li l-importazzjoni ta’ xi tipi ta’ pjanċi elettroniċi
    li huma grain oriented u li oriġinaw mill-Federazzjoni Russa tkun suġġetta
    għal reġistrazzjoni.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1000/2004 van de Commissie van 18 mei 2004 tot aanvaarding
    van verbintenissen aangeboden in het kader van de antidumpingprocedure betreffende
    de invoer van bepaalde platen en banden met georiënteerde korrel van siliciumstaal
    met een breedte van meer dan 500 mm uit de Russische Federatie en tot registratie
    van de invoer van bepaalde elektroplaten met georiënteerde korrel uit de Russische
    Federatie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1000/2004 z dnia 18 maja 2004 r. przyjmujące
    zobowiązania oferowane w związku z postępowaniem antydumpingowym w odniesieniu
    do przywozu niektórych elektrotechnicznych blach teksturowanych oraz pasów stali
    elektrotechnicznej krzemowej o szerokości powyżej 500 mm pochodzących z Rosji
    oraz obejmujące obowiązkiem rejestracji przywóz niektórych elektrotechnicznych
    blach teksturowanych pochodzących z Rosji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1000/2004 da Comissão, de 18 de Maio de 2004, que
    aceita os compromissos oferecidos no âmbito do processo anti-dumping relativo
    às importações de determinadas chapas e bandas de aço ao silício, denominadas
    “magnéticas”, de grãos orientados de largura superior a 500 mm originárias
    da Federação da Rússia e que torna obrigatório o registo dessas importações
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1000/2004 zo dňa 18 mája 2004, ktorým sa
    prijímajú záväzky ponúknuté v súvislosti s antidumpingovým konaním týkajúcim
    sa dovozov niektorých orientovaných plechov pre elektrotechniku a pásov z kremíkovej
    elektroocele so šírkou väčšou ako 500 mm pôvodom z Ruskej federácie a zavádza
    sa registrácia dovozov niektorých orientovaných plechov pre elektrotechniku
    pôvodom z Ruskej federácie
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1000/2004 z dne 18. maja 2004 o sprejetju zavez,
    ponujenih v zvezi s protidampinškim postopkom glede uvoza nekaterih zrnato usmerjenih
    elektropločevin in trakov iz silicijevega jekla za elektropločevine s širino
    več kot 500 mm s poreklom iz Ruske federacije, in o registraciji uvoza nekaterih
    zrnato usmerjenih elektropločevin s poreklom iz Ruske federacije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1000/2004 de la Comisión, de 18 de mayo de 2004, por
    el que se aceptan los compromisos ofrecidos con respecto al procedimiento antidumping
    relativo a las importaciones de determinadas chapas y tiras eléctricas con granos
    orientados de acero eléctrico al silicio, de anchura superior a 500 mm, originarias
    de la Federación Rusa y se someten a registro las importaciones de determinadas
    chapas eléctricas con granos orientados
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1000/2004 av den 18 maj 2004 om godtagande
    av åtaganden som gjorts i samband med antidumpningsförfarandet rörande import
    av vissa kornorienterade elektroplåtar och band av kisellegerat elektrostål
    med en bredd av mer än 500 mm med ursprung i Ryska federationen och om registrering
    av import av dessa elektroplåtar
