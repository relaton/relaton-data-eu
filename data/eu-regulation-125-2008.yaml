  script: Latn
  content: Council Regulation (EC) No 125/2008 of 12 February 2008 amending Regulation
    (EC) No 3286/94 laying down Community procedures in the field of the common commercial
    policy in order to ensure the exercise of the Community’s rights under international
    trade rules, in particular those established under the auspices of the World Trade
    Organisation
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 125/2008 du Conseil du 12 février 2008 modifiant le
