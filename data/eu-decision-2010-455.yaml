    kai pranešėjas pateikė skubos tvarką atitinkančią paraišką pagal Reglamentą
    (EB) Nr. 33/2008, iš dalies keičiami sprendimai 2008/934/EB ir 2008/941/EB (pranešta
    dokumentu Nr. C(2010) 5536)'
  type: main
- language: mt
  script: Latn
  content: '2010/455/UE: Deċiżjoni tal-Kummissjoni tat- 13 ta’ Awwissu 2010 li
