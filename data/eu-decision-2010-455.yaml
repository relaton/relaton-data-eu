    rozhodnutí 2008/934/ES a 2008/941/ES, pokud jde o datum, do kterého mohou povolení
    zůstat v platnosti, a o dobu odkladu v případech, kdy oznamovatel podal žádost
    podle zkráceného postupu podle nařízení (ES) č. 33/2008 (oznámeno pod číslem
    K(2010) 5536)'
  type: main
- language: da
  script: Latn
  content: '2010/455/EU: Kommissionens afgørelse af 13. august 2010 om ændring af
    beslutning 2008/934/EF og 2008/941/EF for så vidt angår den dato, hvortil godkendelser
    fortsat kan være gældende, og fristen i tilfælde, hvor anmelderen har indgivet
    en ansøgning efter den fremskyndede procedure i forordning (EF) nr. 33/2008 (meddelt
    under nummer K(2010) 5536)'
  type: main
- language: el
  script: Grek
