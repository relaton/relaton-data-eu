    jistgħu jkomplu jseħħu l-awtorizzazzjonijiet u l-perijodu ta’ konċessjoni
    f’każi fejn in-notifikant ikun ressaq applikazzjoni skont il-proċedura mħaffa
    skont ir-Regolament (KE) Nru 33/2008 (notifikata bid-dokument numru C(2010) 5536)'
  type: main
