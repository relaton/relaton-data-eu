  type: main
- language: it
  script: Latn
  content: '2010/455/UE: Decisione della Commissione, del 13 agosto 2010 , che modifica
    le decisioni 2008/934/CE e 2008/941/CE per quanto riguarda la data fino alla quale
    le autorizzazioni possono restare in vigore ed il periodo di moratoria, nei casi
    in cui il notificante ha presentato una domanda secondo la procedura accelerata
    di cui al regolamento (CE) n. 33/2008 [notificata con il numero C(2010) 5536]'
  type: main
- language: lv
  script: Latn
  content: '2010/455/ES: Komisijas Lēmums ( 2010. gada 13. augusts ), ar ko groza
    Lēmumus 2008/934/EK un 2008/941/EK attiecībā uz datumu, līdz kuram atļaujas
    drīkst palikt spēkā, un papildlaiku gadījumos, kad iesniedzējs saskaņā
    ar paātrināto procedūru atbilstīgi Regulai (EK) Nr. 33/2008 ir iesniedzis
    pieteikumu (izziņots ar dokumenta numuru C(2010) 5536)'
  type: main
