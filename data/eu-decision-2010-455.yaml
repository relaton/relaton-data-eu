title:
- language: en
  script: Latn
  content: '2010/455/EU: Commission Decision of 13 August 2010 amending Decisions
    2008/934/EC and 2008/941/EC as regards the date until which authorisations may
    continue to be in force and the period of grace, in cases where the notifier has
    submitted an application in accordance with the accelerated procedure under Regulation
    (EC) No 33/2008 (notified under document C(2010) 5536)'
  type: main
- language: fr
  script: Latn
  content: '2010/455/UE: Décision de la Commission du 13 août 2010 modifiant les
    décisions 2008/934/CE et 2008/941/CE en ce qui concerne la durée de validité
    des autorisations et le délai de grâce dans les cas où le notifiant a soumis
    une demande selon la procédure accélérée prévue par le règlement (CE) n
    ° 33/2008 [notifiée sous le numéro C(2010) 5536]'
  type: main
- language: de
  script: Latn
  content: '2010/455/EU: Beschluss der Kommission vom 13. August 2010 zur Änderung
    der Entscheidungen 2008/934/EG und 2008/941/EG hinsichtlich des Zeitpunkts, bis
    zu dem Zulassungen in Kraft bleiben können, sowie der entsprechenden Übergangsfristen
    für den Fall, dass der Antragsteller einen Antrag nach dem beschleunigten Verfahren
    gemäß der Verordnung (EG) Nr. 33/2008 gestellt hat (Bekannt gegeben unter Aktenzeichen
    K(2010) 5536)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/455/ЕС: Решение на Комисията от 13 август
    2010 година за изменение на решения 2008/934/ЕО и
    2008/941/ЕО относно датата, до която разрешенията
    може да продължат да са в сила, и гратисния
    период в случаите, когато нотификаторът е внесъл
    заявление съгласно ускорената процедура, предвидена
    в Регламент (ЕО) № 33/2008 (нотифицирано под номер
    C(2010) 5536)'
  type: main
