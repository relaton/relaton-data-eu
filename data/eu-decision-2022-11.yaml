id: EUDecision202211
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/11 of 2 December 2021 on the position to be
    taken on behalf of the European Union at the 22nd meeting of the Contracting Parties
    to the Convention for the Protection of the Marine Environment and the Coastal
    Region of the Mediterranean (Barcelona Convention) and its Protocols as regards
    the adoption of a decision to amend Annexes I, II, III and IV and Annex VII, section
    A, to the Protocol for the Protection of the Mediterranean Sea against Pollution
    Resulting from Exploration and Exploitation of the Continental Shelf and the Seabed
    and its Subsoil (Offshore Protocol)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/11 du Conseil du 2 décembre 2021 relative à la position
    à prendre, au nom de l’Union européenne, lors de la 22e réunion des parties
    contractantes à la convention sur la protection du milieu marin et du littoral
    de la Méditerranée (convention de Barcelone) et à ses protocoles en ce qui
    concerne l’adoption d’une décision modifiant les annexes I, II, III et IV
    et l’annexe VII, section A, du protocole relatif à la protection de la mer
    Méditerranée contre la pollution résultant de l’exploration et de l’exploitation
    du plateau continental, du fond de la mer et de son sous-sol (protocole «offshore»)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/11 des Rates vom 2. Dezember 2021 über den Standpunkt,
    der auf der 22. Tagung der Vertragsparteien des Übereinkommens zum Schutz der
    Meeresumwelt und der Küstengebiete des Mittelmeers (Übereinkommen von Barcelona)
    und seiner Protokolle zu dem Erlass eines Beschlusses zur Änderung der Anhänge
    I, II, III und IV und des Anhangs VII Abschnitt A des Protokolls zum Schutz des
    Mittelmeers vor Verschmutzung durch die Erforschung und Nutzung des Festlandsockels,
    des Meeresbodens und des Meeresuntergrunds (Offshore-Protokoll) im Namen der Europäischen
    Union zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/11 на Съвета от 2 декември
    2021 година относно позицията, която трябва да
    се заеме от името на Европейския съюз на 22-рата
    среща на договарящите се страни по Конвенцията
    за защита на морската среда и на крайбрежните
    райони в Средиземноморието (Конвенцията от
    Барселона) и протоколите към нея по отношение
    на приемането на решение за изменение на приложения
    I, II, III и IV, и приложение VII, част A към Протокола
    относно опазването на Средиземно море от замърсяване
    в резултат на проучване и експлоатация на континенталния
    шелф и на морското дъно и неговите недра („Офшорен
    протокол“)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/11 ze dne 2. prosince 2021 o postoji, který
    má být jménem Evropské unie zaujat na 22. zasedání smluvních stran Úmluvy
    o ochraně mořského prostředí a pobřežní oblasti Středomoří (Barcelonská
    úmluva) a jejích protokolů, pokud jde o přijetí rozhodnutí o změně příloh
    I, II, III a IV a přílohy VII oddílu A Protokolu o ochraně Středozemního
    moře před znečišťováním způsobeným průzkumem a využíváním pevninského
    šelfu a mořského dna a jeho podloží (protokol o činnostech na moři)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/11 af 2. december 2021 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det 22. møde mellem de kontraherende
    parter i konventionen om beskyttelse af Middelhavets havmiljø og kystområder
    (Barcelonakonventionen) og protokollerne hertil, til vedtagelsen af en afgørelse
    om ændring af bilag I, II, III og IV og bilag VII, afsnit A, til protokollen
    om beskyttelse af Middelhavet mod forurening som følge af undersøgelse og udnyttelse
    af kontinentalsoklen og af havbunden og dennes undergrund (offshoreprotokollen)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/11 του Συμβουλίου της 2ας
    Δεκεμβρίου 2021 σχετικά με τη θέση που πρέπει
    να ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης
    κατά την 22η σύνοδο της διάσκεψης των συμβαλλόμενων
    μερών της σύμβασης για την προστασία του θαλάσσιου
    περιβάλλοντος και των παράκτιων περιοχών της
    Μεσογείου (σύμβαση της Βαρκελώνης) και των
    πρωτοκόλλων της όσον αφορά την έκδοση απόφασης
    για την τροποποίηση των παραρτημάτων I, II, III
    και IV και του παραρτήματος VII τμήμα Α του πρωτοκόλλου
    για την προστασία της Μεσογείου Θαλάσσης από
    τη ρύπανση που προκαλείται από την εξερεύνηση
    και την εκμετάλλευση του θαλάσσιου βυθού και
    του υπεδάφους του (πρωτόκολλο για τις υπεράκτιες
    δραστηριότητες)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/11, 2. detsember 2021, seisukoha kohta, mis võetakse
    Euroopa Liidu nimel Vahemere merekeskkonna ja rannikuala kaitse konventsiooni
    (Barcelona konventsioon) ja selle protokollide osalisriikide 22. istungil vastu
    võetava otsuse suhtes, millega muudetakse selle protokolli, milles käsitletakse
    Vahemere kaitset mandrilava, merepõhja ja selle aluspinnase uuringutest ja kasutamisest
    lähtuva reostuse eest (avamereprotokoll), I, II, III ja IV lisa ning VII lisa
    A osa
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/11, annettu 2 päivänä joulukuuta 2021,
    Välimeren merellisen ympäristön ja rannikkoalueiden suojelemista koskevan yleissopimuksen
    (Barcelonan yleissopimus) ja sen pöytäkirjojen sopimuspuolten 22. kokouksessa
    Euroopan unionin puolesta otettavasta kannasta Välimeren suojelemisesta mannerjalustan
    sekä merenpohjan ja sen maaperän tutkimisesta ja hyväksikäytöstä johtuvalta
    pilaantumiselta tehdyn pöytäkirjan (Offshore-pöytäkirjan) liitteiden I, II,
    III ja IV ja liitteessä VII olevan A jakson muuttamista koskevan päätöksen
    hyväksymiseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2022/11 ón gComhairle an 2 Nollaig 2021 maidir leis an seasamh
    atá le glacadh thar ceann an Aontais Eorpaighag an 22ú cruinniú de na Páirtithe
    Conarthacha sa Choinbhinsiúnmaidir le Cosaint Mhuirthimpeallacht agus Réigiún
    Cósta na Meánmhara(Coinbhinsiún Barcelona) gona Phrótacail a mhéid a bhaineann
    le cinneadh a ghlacadhlena leasaítear Iarscríbhinní I, II, III agus IV agus
    Iarscríbhinn VII, roinn A,a ghabhann leis an bPrótacal maidir le Cosaint na
    Meánmhara ar Thruailliúó Thaiscéalaíocht agus ó Shaothrú na Scairbhe Ilchríochaíagus
    Ghrinneall na Farraige agus a Fho-ithreach (Prótacal Eischósta)
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/11 od 2. prosinca 2021. o stajalištu koje treba
    zauzeti u ime Europske unije na 22. sastanku ugovornih stranaka Konvencije o zaštiti
    morskog okoliša i obalnog područja Sredozemlja (Barcelonska konvencija) i njezinih
    protokola u pogledu donošenja odluke o izmjenama priloga I., II., III. i IV.
    te Priloga VII. odjeljka A Protokolu o zaštiti Sredozemnog mora od onečišćenja
    koje proizlazi iz istraživanja i iskorištavanja epikontinentalnog pojasa, morskog
    dna i morskog podzemlja (Protokol o odobalnim aktivnostima)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/11 határozata (2021. december 2.) a Földközi-tenger
    tengeri környezetének és partvidékének szennyezés elleni védelméről szóló
    egyezmény (a Barcelonai Egyezmény) és jegyzőkönyvei szerződő feleinek 22.
    üléséna Földközi-tengernek a kontinentális talapzat és tengerfenék, illetve
    az ezek alatti altalaj feltárásából és kiaknázásából eredő szennyezése
    elleni védelméről szóló jegyzőkönyvhöz(a tengeri kitermelésről szóló
    jegyzőkönyvhöz) csatolt I., II., III., IV. mellékletet,valamint VII. melléklet
    A részét módosító határozat elfogadására tekintettelaz Európai Unió
    nevében képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/11 del Consiglio del 2 dicembre 2021 relativa alla
    posizione da adottare a nome dell’Unione europea alla 22a riunione delle parti
    contraenti della convenzione sulla protezione dell’ambiente marino e del litorale
    del Mediterraneo (convenzione di Barcellona) e dei relativi protocolli in merito
    all’adozione di una decisione volta a modificare gli allegati I, II, III, IV
    e l’allegato VII, parte A, del protocollo per la protezione del Mar Mediterraneo
    dall’inquinamento derivante dall’esplorazione e dallo sfruttamento della piattaforma
    continentale, del fondo del mare e del sottosuolo (protocollo offshore)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/11 (2021. gada 2. decembris) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Konvencijas par Vidusjūras reģiona jūras
    vides un piekrastes aizsardzību (Barselonas konvencija) un tās protokolu Līgumslēdzēju
    pušu 22. sanāksmē attiecībā uz tāda lēmuma pieņemšanu, ar kuru groza
    I, II, III un IV pielikumu un VII pielikuma A iedaļu Protokolā par Vidusjūras
    aizsardzību pret piesārņojumu, ko izraisa kontinentālā šelfa, jūras gultnes
    un tās dzīļu izpēte un izmantošana (Atkrastes protokols)
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/11 2021 m. gruodžio 2 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi 22-ajame Viduržemio jūros
    aplinkos ir pakrančių zonos apsaugos konvencijos (Barselonos konvencijos) ir
    jos protokolų susitariančiųjų šalių susitikime, dėl sprendimo iš dalies
    pakeisti Viduržemio jūros apsaugos nuo taršos, susidarančios dėl kontinentinio
    šelfo ir jūros dugno bei podugnio žvalgymo ir eksploatavimo, protokolo (Jūros
    protokolo) I, II, III bei IV priedus ir VII priedo A dalį priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/11 tat-2 ta’ Diċembru 2021 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni Ewropea fit-22 laqgħa tal-Partijiet
    Kontraenti għall-Konvenzjoni għall-Protezzjoni tal-Ambjent tal-Baħar u tar-Reġjun
    Kostali tal-Mediterran (il-Konvenzjoni ta’ Barċellona) u l-Protokolli tagħha
    fir-rigward tal-adozzjoni ta’ deċiżjoni li temenda l-Annessi I, II, III u
    IV u l-Anness VII, Taqsima A, tal-Protokoll dwar il-Ħarsien tal-Baħar Mediterran
    mit-Tniġġis Ikkaġunat mill-Esplorazzjoni u l-Isfruttament tal-Blata Kontinentali,
    Qiegħ il-Baħar u s-Sottoswol tiegħu (“Protokoll Offshore”)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/11 van de Raad van 2 december 2021 betreffende het namens
    de Europese Unie in te nemen standpunt tijdens de 22e vergadering van de partijen
    bij het Verdrag inzake de bescherming van het mariene milieu en de kustgebieden
    van de Middellandse Zee (Verdrag van Barcelona) en de bijbehorende protocollen,
    wat betreft de vaststelling van een besluit tot wijziging van de bijlagen I, II,
    III en IV en bijlage VII, afdeling A, bij het Protocol inzake de bescherming van
    de Middellandse Zee tegen verontreiniging door exploratie en exploitatie van het
    continentaal plat en de zeebodem en de ondergrond daarvan (offshore-protocol)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/11 z dnia 2 grudnia 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej na 22. posiedzeniu Umawiających
    się Stron Konwencji o ochronie środowiska morskiego i regionu przybrzeżnego
    Morza Śródziemnego („konwencja barcelońska”) i protokołów do niej, w
    odniesieniu do przyjęcia decyzji o zmianie załączników I, II, III i IV oraz
    załącznika VII, sekcji A do Protokołu dotyczącego ochrony Morza Śródziemnego
    przed zanieczyszczeniem powstałym w wyniku działalności poszukiwawczej i wydobywczej
    na szelfie kontynentalnym oraz na dnie morskim i w jego podglebiu („protokół
    o działalności na morzu”)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/11 do Conselho de 2 de dezembro de 2021 relativa à
    posição a tomar em nome da União Europeia na 22.a reunião das Partes Contratantes
    na Convenção sobre a Proteção do Meio Marinho e do Litoral do Mediterrâneo
    («Convenção de Barcelona») e respetivos protocolos no que respeita à adoção
    de uma decisão que altere os anexos I, II, III e IV e o anexo VII, secção A,
    do Protocolo relativo à Proteção do Mar Mediterrâneo contra a Poluição resultante
    da Prospeção e da Exploração da Plataforma Continental, do Fundo do Mar e
    do seu Subsolo («Protocolo Offshore»)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/11 a Consiliului din 2 decembrie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene, la cea de a 22-a
    reuniune a părților contractante la Convenția privind protejarea mediului marin
    și a zonei de coastă a Mării Mediterane (Convenția de la Barcelona) și la
    protocoalele la aceasta, în ceea ce privește adoptarea unei decizii de modificare
    a anexelor I, II, III și IV și a secțiunii A din anexa VII la Protocolul privind
    protecția Mării Mediterane împotriva poluării rezultate în urma explorării
    și exploatării platformei continentale, a fundului mării și a subsolului marin
    (Protocolul privind activitățile în larg)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/11 z 2. decembra 2021 o pozícii, ktorá sa
    má v mene Európskej únie zaujať na 22. zasadnutí zmluvných strán Dohovoru
    o ochrane morského prostredia a pobrežných oblastí Stredozemného mora (Barcelonský
    dohovor) a jeho protokolov, pokiaľ ide o prijatie rozhodnutia o zmene príloh
    I, II, III a IV a prílohy VII oddielu A k Protokolu o ochrane Stredozemného
    mora pred znečisťovaním spôsobeným prieskumom a využívaním kontinentálneho
    šelfu a morského dna a jeho podložia (protokol o pobrežiach)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/11 z dne 2. decembra 2021 o stališču, ki se v imenu
    Evropske unije zastopa na 22. zasedanju pogodbenic Konvencije za varstvo morskega
    okolja in obalnega območja Sredozemlja (Barcelonska konvencija) in njenih protokolov
    glede sprejetja sklepa o spremembi prilog I, II, III in IV ter priloge VII, oddelek
    A, k Protokolu o varstvu Sredozemskega morja pred onesnaženjem, ki ga povzročata
    raziskovanje in izkoriščanje epikontinentalnega pasu ter morskega dna in podzemlja
    (Protokol o dejavnostih na morju)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/11 del Consejo de 2 de diciembre de 2021 relativa a
    la posición que debe adoptarse en nombre de la Unión Europea en la 22.a reunión
    de las Partes Contratantes en el Convenio para la Protección del Medio Marino
    y de la Región Costera del Mediterráneo (Convenio de Barcelona) y sus Protocolos,
    con respecto a la adopción de una decisión por la que se modificarán los anexos
    I, II, III y IV, y el anexo VII, sección A, del Protocolo para la Protección
    del Mediterráneo contra la Contaminación Resultante de la Exploración y Explotación
    de la Plataforma Continental, del Fondo del Mar y de su Subsuelo (Protocolo Offshore)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/11 av den 2 december 2021 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar vid det 22:a mötet för de fördragsslutande
    parterna i konventionen om skydd av Medelhavets marina miljö och kustregion (Barcelonakonventionen)
    och dess protokoll vad gäller antagandet av ett beslut om ändring av bilagorna
    I, II, III och IV och avsnitt A i bilaga VII till protokollet om skydd av Medelhavet
    mot förorening orsakad av prospektering och utvinning på kontinentalsockeln
    och i områden på eller under havsbotten (offshore-protokollet)
  type: main
