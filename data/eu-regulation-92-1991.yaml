    της 15ης Ιανουαρίου 1991 περί θεσπίσεως των λεπτομερειών
    εφαρμογής, για το άμυλο γεωμήλων του κωδικού
    ΣΟ 1108 13 00, του κανονισμού (ΕΟΚ) αριθ. 3834/90 του
    Συμβουλίου για τη μείωση, για το 1991, των εισφορών
    για ορισμένα γεωργικά προϊόντα που κατάγονται
    από αναπτυσσόμενες χώρες
  type: main
- language: it
  script: Latn
