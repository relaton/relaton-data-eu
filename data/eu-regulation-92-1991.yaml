title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 92/91 of 15 January 1991 laying down detailed
    rules of application to potato starch falling within CN code 1108 13 00 of Council
    Regulation (EEC) No 3834/90, reducing for 1991 the levies on certain agricultural
    products originating in developing countries
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 92/91 DE LA COMMISSION du 15 janvier 1991 établissant
    les modalités d'' application, pour la fécule de pommes de terre relevant du
    code NC 1108 13 00, du règlement (CEE) no 3834/90 du Conseil portant réduction,
    pour l'' année 1991, des prélèvements pour certains produits agricoles originaires
    de pays en voie de développement #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 92/91 DER KOMMISSION vom 15. Januar 1991 mit Durchführungsbestimmungen
