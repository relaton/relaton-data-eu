    bestimmte landwirtschaftliche Erzeugnisse mit Ursprung in Entwicklungsländern
    für das Jahr 1991 hinsichtlich der Kartoffelstärke des KN-Codes 1108 13 00 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 92/91 af 15. januar 1991 om gennemførelsesbestemmelser,
    for så vidt angår kartoffelstivelse henhørende under KN-kode 1108 13 00, til
    Rådets forordning (EØF) nr. 3834/90 om nedsættelse i 1991 af importafgifterne
    for visse landbrugsprodukter med oprindelse i udviklingslande
  type: main
- language: el
  script: Grek
