    no 218. un 232. panta Direktīvā 2006/112/EK par kopējo pievienotās vērtības
    nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2022/1003 2022 m. birželio 17 d.
    kuriuo Lenkijai leidžiama taikyti specialią priemonę, kuria nukrypstama nuo
    Direktyvos 2006/112/EB dėl pridėtinės vertės mokesčio bendros sistemos 218
    ir 232 straipsnių
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2022/1003 tas-17 ta’
    Ġunju 2022 li tawtorizza lir-Repubblika tal-Polonja sabiex tapplika miżura speċjali
    li tidderoga mill-Artikoli 218 u 232 tad-Direttiva 2006/112/KE dwar is-sistema
    komuni ta’ taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1003 van de Raad van 17 juni 2022 waarbij
    de Republiek Polen wordt gemachtigd een bijzondere maatregel toe te passen die
    afwijkt van de artikelen 218 en 232 van Richtlijn 2006/112/EG betreffende het
    gemeenschappelijke stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2022/1003 z dnia 17 czerwca 2022 r. upoważniająca
    Rzeczpospolitą Polską do stosowania szczególnego środka stanowiącego odstępstwo
    od art. 218 i 232 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od
    wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1003 do Conselho de 17 de junho de 2022
    que autoriza a República da Polónia a aplicar uma medida especial em derrogação
    dos artigos 218.o e 232.o da Diretiva 2006/112/CE relativa ao sistema comum do
    imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1003 a Consiliului din 17 iunie
    2022 prin care Republica Polonă este autorizată să aplice o măsură specială
    de derogare de la articolele 218 și 232 din Directiva 2006/112/CE privind sistemul
    comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2022/1003 zo 17. júna 2022 ktorým
    sa Poľskej republike povoľuje zaviesť osobitné opatrenie odchyľujúce sa
    od článkov 218 a 232 smernice 2006/112/ES o spoločnom systéme dane z pridanej
    hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2022/1003 z dne 17. junija 2022 o dovoljenju
    Republiki Poljski, da uporabi posebni ukrep, ki odstopa od členov 218 in 232
    Direktive 2006/112/ES o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1003 del Consejo de 17 de junio de 2022
    por la que se autoriza a la República de Polonia a aplicar una medida especial
    de excepción a lo dispuesto en los artículos 218 y 232 de la Directiva 2006/112/CE
    relativa al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2022/1003 av den 17 juni 2022 om bemyndigande
    för Republiken Polen att tillämpa en särskild åtgärd som avviker från artiklarna
    218 och 232 i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
  type: main
