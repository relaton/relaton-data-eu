    218 og 232 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1003 του Συμβουλίου
    της 17ης Ιουνίου 2022 με την οποία επιτρέπεται
    στη Δημοκρατία της Πολωνίας να εφαρμόσει ειδικό
    μέτρο παρέκκλισης από τα άρθρα 218 και 232 της
    οδηγίας 2006/112/ΕΚ σχετικά με το κοινό σύστημα
    φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2022/1003, 17. juuni 2022, millega lubatakse
