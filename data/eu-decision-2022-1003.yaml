title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2022/1003 of 17 June 2022 authorising
    the Republic of Poland to apply a special measure derogating from Articles 218
    and 232 of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1003 du Conseil du 17 juin 2022 autorisant
    la République de Pologne à appliquer une mesure particulière dérogatoire aux
    articles 218 et 232 de la directive 2006/112/CE relative au système commun de
    taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1003 des Rates vom 17. Juni 2022 zur
    Ermächtigung der Republik Polen, eine von den Artikeln 218 und 232 der Richtlinie
    2006/112/EG über das gemeinsame Mehrwertsteuersystem abweichende Sondermaßnahme
    anzuwenden
  type: main
- language: bg
  script: Cyrl
