    od článků 218 a 232 směrnice 2006/112/ES o společném systému daně z přidané
    hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2022/1003 af 17. juni 2022 om tilladelse
