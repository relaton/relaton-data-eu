    за дерогация от членове 218 и 232 от Директива
    2006/112/ЕО относно общата система на данъка върху
    добавената стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2022/1003 ze dne 17. června 2022, kterým
