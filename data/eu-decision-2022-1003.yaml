    2006/112/EK irányelv 218. és 232. cikkétől eltérő különös intézkedés
    alkalmazására történő felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1003 del Consiglio del 17 giugno 2022
    che autorizza la Repubblica di Polonia ad applicare una misura speciale di deroga
    agli articoli 218 e 232 della direttiva 2006/112/CE, relativa al sistema comune
    d’imposta sul valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2022/1003 (2022. gada 17. jūnijs),
