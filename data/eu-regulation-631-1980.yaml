title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 631/80 of 14 March 1980 derogating from
    Regulation (EEC) No 2186/79 as regards the time limits set for the lodging of
    applications for the approval of distillation contracts reserved for holders of
    long-term storage contracts for table wines for the 1978/79 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 631/80 de la Commission, du 14 mars 1980, dérogeant
    au règlement (CEE) n° 2186/79 en ce qui concerne les délais prévus pour l'
    introduction des demandes d' agrément de contrats de distillation réservés
    aux détenteurs de contrats de stockage à long terme des vins de table pour la
    campagne 1978/1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 631/80 der Kommission vom 14. März 1980 zur Abweichung
    der Verordnung (EWG) Nr. 2186/79 hinsichtlich der Abgabefristen für die Anträge
    auf Genehmigung von Destillationsverträgen, die Inhabern langfristiger Lagerverträge
    für Tafelweine vorbehalten sind, für das Wirtschaftsjahr 1978/79
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 631/80 af 14. marts 1980 om fravigelse
    af forordning (EØF) nr. 2186/79 for så vidt angår fristerne for indgivelse
    af ansøgninger om godkendelse af destillationskontrakter, der er forbeholdt indehavere
    af langfristede oplagringskontrakter for bordvin for produktionsåret 1978/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 631/80 della Commissione, del 14 marzo 1980, recante
    deroga al regolamento (CEE) n. 2186/79 per quanto concerne i termini previsti
    per la presentazione delle domande di approvazione dei contratti di distillazione
    riservati ai detentori di contratti di magazzinaggio a lungo termine di vini da
    tavola per la campagna 1978/1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 631/80 van de Commissie van 14 maart 1980 houdende
    afwijking van Verordening (EEG) nr. 2186/79 ten aanzien van de termijnen voor
    het indienen van de aanvragen om goedkeuring van distillatiecontracten ten behoeve
    van degenen die voor het wijnoogstjaar 1978/1979 langlopende opslagcontracten
    voor tafelwijn hebben gesloten
  type: main
