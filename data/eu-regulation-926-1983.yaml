title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 926/83 of 19 April 1983 re-establishing
    the levying of customs duties on certain woven fabrics of synthetic fibres, unbleached
    or bleached, products of category ex 3 (code 0033), originating in Brazil, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 926/83 de la Commission du 19 avril 1983 portant rétablissement
    de la perception des droits de douane applicables à certains tissus de fibres
    synthétiques, écrus ou blanchis, de la catégorie de produits no ex 3 (code
    0033), originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 926/83 der Kommission vom 19. April 1983 über die
    Wiedereinführung des Zollsatzes für bestimmte Gewebe aus synthetischen Spinnfasern,
    roh oder gebleicht, der Warenkategorie Nr. ex 3 (Kennziffer 0033), mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 926/83 af 19. april 1983 om genindførelse
    af opkrævning af toldafgifter for vævet stof af syntetiske fibre, ublegede og
    blegede under kategori nr. ex 3, (kode 0033) som har oprindelse i Brasilien og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 926/83 της Επιτροπής
    της 19ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    υφάσματα από συνθετικές υφαντικές ίνες, αλεύκαστα
    ή λευκασμένα, των προϊόντων της κατηγορίας
    ex 3 (κωδικός αριθμός 0033), καταγωγής Βραζιλίας,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 926/83 della Commissione del 19 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili sintetiche,
    greggi o imbianchiti, della categoria di prodotti n. ex 3 (codice 0033), originari
    del Brasile, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 926/83 van de Commissie van 19 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    weefsels van synthetische stapelvezels, ongebleekt of gebleekt, van de categorie
    van produkten nr. ex 3 (codenummer 0033), van oorsprong uit Brazilië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3378/82
    van de Raad
  type: main
