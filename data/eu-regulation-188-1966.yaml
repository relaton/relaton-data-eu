  content: Règlement n 188/66/CEE du Conseil, du 24 novembre 1966, autorisant le
    royaume de Belgique, la république fédérale d'Allemagne, la République française
    et la République italienne à majorer, dans le secteur de la viande bovine, les
    prélèvements applicables à certaines importations en provenance des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 188/66/EWG des Rates vom 24. November 1966 zur Ermächtigung
    des Königreichs Belgien, der Bundesrepublik Deutschland, der Französischen Republik
    und der Italienischen Republik, die Abschöpfungen auf bestimmte Rinder- und Rindfleischeinfuhren
    aus dritten Ländern zu erhöhen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 188/66/CEE del Consiglio, del 24 novembre 1966, che autorizza
    il Regno del Belgio, la Repubblica federale di Germania, la Repubblica francese
    e la Repubblica italiana a maggiorare, nel settore delle carni bovine, i prelievi
    applicabili ad alcune importazioni in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening no. 188/66/EEG van de Raad van 24 november 1966 waarbij het
    Koninkrijk België, de Bondsrepubliek Duitsland, de Franse Republiek en de Italiaanse
    Republiek worden gemachtigd in de sector rundvlees de heffingen op de invoer van
    bepaalde produkten uit derde landen te verhogen
  type: main
