    του ύψους της ενίσχυσης για τα πίσα, τα κουκιά,
    τα φούλια και τα γλυκά λούπινα που χρησιμοποιούνται
    στις ζωοτροφές, που προκαθορίστηκε πριν από
    την 1η Ιουλίου 1987 για την περίοδο εμπορίας 1987/88,
    καθώς και του ύψους της εν λόγω ενίσχυσης που
    εφαρμόζεται από την 1η Ιουλίου 1987 μέχρι τις
    7 Ιουλίου 1987
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2516/87 della Commissione, del 18 agosto 1987, che
    fissa definitivamente l'importo dell'aiuto per i piselli, le fave, le favette
    e i lupini dolci utilizzati nell'alimentazione degli animali, fissato in anticipo,
    entro il 1 luglio 1987, per la campagna di commercializzazione 1987/1988 e l'importo
    dell'aiuto dal 1 al 7 luglio 1987
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2516/87 van de Commissie van 18 augustus 1987 houdende
    definitieve vaststelling van het steunbedrag voor erwten, tuin- en veldbonen en
    nietbittere lupinen die voor diervoeding worden gebruikt, dat vóór 1 juli 1987
    voor het verkoopseizoen 1987/1988 vooraf is vastgesteld, alsmede van het bedrag
    van die steun dat van toepassing is van 1 juli 1987 tot en met 7 juli 1987
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2516/87 da Comissão, de 18 de Agosto de 1987, que
