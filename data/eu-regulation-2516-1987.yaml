title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2516/87 of 18 August 1987 fixing definitively
    the amount of the aid for peas, field beans and sweet lupins used in animal feed
    fixed in advance before 1 July 1987 for the 1987/88 marketing year and the amount
    of the aid applicable from 1 to 7 July 1987
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2516/87 de la Commission, du 18 août 1987, fixant définitivement
    le montant de l'aide pour le pois, fèves, féveroles et lupins doux utilisés
    dans l'alimentation des animaux, fixé à l'avance avant le 1er juillet 1987 pour
    la campagne de commercialisation 1987/1988, ainsi que le montant de cette aide
    applicable du 1er juillet au 7 juillet 1987
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2516/87 der Kommission vom 18. August 1987 zur endgültigen
    Festsetzung des vor dem 1. Juli 1987 für das Wirtschaftsjahr 1987/88 im voraus
    festgesetzten Beihilfebetrags für zu Futterzwecken verwendete Erbsen, Puffbohnen,
    Ackerbohnen und Süßlupinen sowie des vom 1. Juli 1987 bis zum 7. Juli 1987 geltenden
    Betrags dieser Beihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2516/87 af 18. august 1987 om endelig
    fastsættelse af støtten for ærter, bønner, hestebønner og sødlupiner, der
    anvendes til foderbrug, som forudfastsættes inden den 1. juli 1987 for produktionsåret
    1987/88 samt af den støtte, der anvendes fra den 1. juli til den 7. juli 1987
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2516/87 της Επιτροπής
