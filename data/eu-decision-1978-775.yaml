title:
- language: en
  script: Latn
  content: Commission Decision of 8 September 1978 on the reimbursement by the Guidance
    Section of the EAGGF to the Federal Republic of Germany of expenditure incurred
    during 1976 on annuities relating to measures to encourage the cessation of farming
    and the reallocation of utilized agricultural area for the purpose of structural
    improvement
  type: main
- language: fr
  script: Latn
  content: '78/775/CEE: Décision de la Commission, du 8 septembre 1978, relative
    au remboursement par le FEOGA, section orientation, à la République fédérale
    d''Allemagne des dépenses effectuées pendant l''année 1976 pour les indemnités
    relatives à l''encouragement à la cessation de l''activité agricole et à l''affectation
    de la superficie agricole utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. September 1978 über die Rückvergütung
    der im Jahr 1976 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an die Bundesrepublik
    Deutschland
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 8. september 1978 om refusion gennem EUGFL,
    udviklingssektionen, til Forbundsrepublikken Tyskland af de udgifter, som er afholdt
    i løbet af året 1976 til godtgørelse vedrørende støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 settembre 1978, relativa al rimborso
    da parte del FEAOG, sezione orientamento, alla Repubblica federale di Germania
    delle spese effettuate durante il 1976 per le indennità concernenti l'incoraggiamento
    alla cessazione dell'attività agricola e alla destinazione della superficie agricola
    utilizzata a scopi di miglioramento delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 september 1978 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland van de gedurende
    het jaar 1976 gedane uitgaven voor de uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van aanwending van cultuurgrond
    tot verbetering van de structuur
