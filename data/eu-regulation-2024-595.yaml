    zur Ergänzung der Verordnung (EU) Nr. 1093/2010 des Europäischen Parlaments
    und des Rates durch technische Regulierungsstandards zur Präzisierung der Wesentlichkeit
    von Schwächen, der Art der erhobenen Informationen, der praktischen Umsetzung
    der Informationserhebung sowie der Analyse und Verbreitung der Informationen in
    der zentralen Datenbank zur Bekämpfung von Geldwäsche und Terrorismusfinanzierung
    nach Artikel 9a Absatz 2 jener Verordnung
  type: main
