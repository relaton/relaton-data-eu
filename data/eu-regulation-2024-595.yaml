- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/595 of 9 November 2023 supplementing
    Regulation (EU) No 1093/2010 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the materiality of weaknesses,
    the type of information collected, the practical implementation of the information
    collection and the analysis and dissemination of the information contained in
    the Anti-money laundering and counter terrorist financing (AML/CFT) central database
    referred to in Article 9a(2) of that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/595 de la Commission du 9 novembre 2023
    complétant le règlement (UE) no 1093/2010 du Parlement européen et du Conseil
    par des normes techniques de réglementation apportant des précisions sur la
    notion de déficience significative, le type d’informations collectées, le
    déroulement pratique de la collecte d’informations et l’analyse et la diffusion
    des informations contenues dans la base de données centrale pour la lutte contre
    le blanchiment de capitaux et le financement du terrorisme (LBC/FT) prévue par
    l’article 9 bis, paragraphe 2, dudit règlement
  type: main
- language: de
  script: Latn
