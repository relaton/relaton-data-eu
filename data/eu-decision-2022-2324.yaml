    přístupu a opatření pro provozování mobilních komunikačních služeb v
    letadlech (služeb MCA) v Unii (oznámeno pod číslem C(2022) 8321)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2324 af 23. november
    2022 om ændring af beslutning 2008/294/EF med henblik på at inkludere yderligere
    adgangsteknologier og foranstaltninger vedrørende mobilkommunikationstjenester
    om bord på fly (MCA-tjenester) (meddelt under nummer C(2022) 8321)
  type: main
- language: el
  script: Grek
