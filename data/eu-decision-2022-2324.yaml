    und Maßnahmen für den Betrieb von Mobilfunkdiensten an Bord von Luftfahrzeugen
    (MCA-Diensten) in der Union (Bekannt gegeben unter Aktenzeichen C(2022) 8321)
  type: main
- language: bg
  script: Cyrl
