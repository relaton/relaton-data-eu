    en maatregelen voor de exploitatie van mobielecommunicatiediensten aan boord van
    vliegtuigen (MCA-diensten) in de Unie op te nemen (Kennisgeving geschied onder
    nummer C(2022) 8321)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2324 z dnia 23 listopada 2022 r. zmieniająca
    decyzję 2008/294/WE w celu uwzględnienia dodatkowych technologii dostępu i
    środków na potrzeby wykonywania usług łączności ruchomej na pokładach statków
    powietrznych (usługi MCA) w Unii (notyfikowana jako dokument nr C(2022) 8321)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2324 da Comissão de 23 de novembro de
    2022 que altera a Decisão 2008/294/CE a fim de incluir outras tecnologias de
    acesso e medidas para a exploração de serviços de comunicações móveis em
    aeronaves (serviços MCA) na União [notificada com o número C(2022) 8321]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2324 a Comisiei din 23 noiembrie
    2022 de modificare a Deciziei 2008/294/CE pentru a include tehnologii și măsuri
    de acces suplimentare pentru operarea serviciilor de comunicații mobile la bordul
    aeronavelor (serviciile CMA) în Uniune [notificată cu numărul C(2022) 8321]
  type: main
- language: sk
