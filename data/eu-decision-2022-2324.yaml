    uusia liityntäteknologioita ja -toimenpiteitä ilma-aluksissa tarjottavien matkaviestintäpalvelujen
    (MCA-palvelujen) toimintaa varten unionissa (tiedoksiannettu numerolla C(2022)
    8321)
  type: main
- language: ga
