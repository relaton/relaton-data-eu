    paslaugoms orlaiviuose (JRO paslaugoms) teikti Sąjungoje įtraukimo iš dalies
    keičiamas Sprendimas 2008/294/EB (pranešta dokumentu Nr. C(2022) 8321)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2324 tat-23
    ta’ Novembru 2022 li temenda d-Deċiżjoni 2008/294/KE biex tkun tinkludi teknoloġiji
    ta’ aċċess addizzjonali u miżuri għall-operat ta’ servizzi ta’ komunikazzjoni
    mobbli fuq l-inġenji tal-ajru (servizzi MCA) fl-Unjoni (notifikata bid-dokument
    C(2022) 8321)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2324 van de Commissie van 23 november 2022
