    un pasākumus mobilo sakaru pakalpojumu gaisa kuģos (MCA pakalpojumu) darbībai
    Savienībā (izziņots ar dokumenta numuru C(2022) 8321)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2324 2022 m. lapkričio 23
