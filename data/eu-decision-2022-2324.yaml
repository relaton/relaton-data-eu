    mobilhírközlési szolgáltatások (MCA-szolgáltatások) Unióban való működtetésére
    vonatkozóan további hozzáférési technológiákkal és intézkedésekkel való
    kiegészítése céljából történő módosításáról (az értesítés a C(2022)
    8321. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2324 della Commissione del 23 novembre
    2022 recante modifica della decisione 2008/294/CE, al fine di includere ulteriori
    tecnologie di accesso e misure per il funzionamento dei servizi di comunicazione
    mobile a bordo degli aeromobili (servizi MCA) nell’Unione [notificata con il
    numero C(2022) 8321)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/2324 (2022. gada 23. novembris),
