title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2324 of 23 November 2022 amending
    Decision 2008/294/EC, to include additional access technologies and measures for
    the operation of mobile communications services on aircraft (MCA services) in
    the Union (notified under document C(2022) 8321)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2324 de la Commission du 23 novembre
    2022 modifiant la décision 2008/294/CE afin d’y inclure des technologies et
    des mesures d’accès supplémentaires pour l’exploitation de services de communications
    mobiles à bord des aéronefs (services MCA) dans l’Union [notifiée sous le
    numéro C(2022) 8321]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2324 der Kommission vom 23. November
