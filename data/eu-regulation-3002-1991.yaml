title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3002/91 of 14 October 1991 re-establishing
    the levying of customs duties on products of categories 9 and 20 (order Nos 40.0090
    and 40.0200), originating in Sri Lanka, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3002/91 DE LA COMMISSION du 14 octobre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 9 (numéro d'' ordre 40.0090), et aux produits de la catégorie
    20 (numéro d'' ordre 40.0200), originaires du Sri Lanka, bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
