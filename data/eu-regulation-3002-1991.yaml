    Nummer 40.0090) und der Kategorie 20 (laufende Nummer 40.0200) mit Ursprung in
    Sri Lanka, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3002/91 af 14. oktober 1991 om genindførelse
