title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2275/70 of the Council of 10 November 1970 amending
    Regulation (EEC) No 865/68 on the common organisation of the market in products
    processed from fruit and vegetables, as regards the calculation of the levy on
    various added sugars
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2275/70 du Conseil, du 10 novembre 1970, modifiant,
    en ce qui concerne le calcul du prélèvement au titre des sucres divers d' addition,
    le règlement (CEE) n° 865/68 portant organisation commune des marchés dans
    le secteur des produits transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2275/70 des Rates vom 10. November 1970 zur Änderung
    der Verordnung (EWG) Nr. 865/68 über die gemeinsame Marktorganisation für Verarbeitungserzeugnisse
    aus Obst und Gemüse hinsichtlich der Berechnung der Abschöpfung auf den Gehalt
    an verschiedenen zugesetzten Zuckerarten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2275/70 af 10. november 1970 om ændring
    af forordning (EØF) nr. 865/68 om den fælles markedsordning for produkter forarbejdet
    på basis af frugt og grønsager med hensyn til beregningen af importafgiften
    af indholdet af de forskellige tilsatte sukkerarter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2275/70 del Consiglio, del 10 novembre 1970, che modifica,
