  script: Latn
  content: '88/481/EEC: Commission Decision of 26 July 1988 determining the amount
    of VAT own resources payable by the Federal Republic of Germany for 1986 in respect
    of transactions covered by the 20th Council Directive 85/361/EEC of 16 July 1985
    on the harmonization of the laws of the Member States relating to turnover taxes
    - Common system of value-added tax: derogations in connection with the special
    aid granted to certain farmers to compensate for the dismantlement of monetary
    compensatory amounts applying to certain agricultural products'
  type: main
- language: fr
  script: Latn
  content: '88/481/CEE: Décision de la Commission du 26 juillet 1988 fixant le montant
    des ressources propres provenant de la TVA dont la République fédérale d''Allemagne
    est redevable pour l''exercice 1986 et relatif aux opérations visées à la vingtième
    directive 85/361/CEE du Conseil en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires - Système commun
    de taxe sur la valeur ajoutée: dérogations relatives aux aides spéciales accordées
    à certains agriculteurs en compensation du démantèlement des montants compensatoires
    monétaires applicables à certains produits agricoles'
  type: main
