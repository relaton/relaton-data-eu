    de Alemania por el ejercicio 1986 y relativa a las operaciones contempladas en
    la vigésima Directiva 85/361/CEE del Consejo en materia de armonización de las
    legislaciones de los Estados miembros relativas a los impuestos sobre el volumen
    de negocios - Sistema común del Impuesto sobre el Valor Añadido: excepciones
    relativas a las ayudas especiales concedidas a algunos agricultores como compensación
