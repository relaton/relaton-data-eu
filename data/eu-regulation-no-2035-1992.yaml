title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2035/92 of 22 July 1992 determining the
    extent to which applications lodged in July 1992 for import licences for certain
    milk products and products covered by the arrangements provided for in the Interim
    Agreements concluded by the Community with the Republic of Poland, the Republic
    of Hungary and the Czech and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2035/92 de la Commission, du 22 juillet 1992, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1992 pour certains produits dans le secteur du lait et des produits laitiers
    du régime prévu par les accords intérimaires conclus par la Communauté avec
    la république de Pologne, la république de Hongrie, et la République fédérative
    tchèque et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2035/92 der Kommission vom 22. Juli 1992 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im Juli 1992 für
    die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und Polen, Ungarn sowie der Tschechischen und Slowakischen Föderativen Republik
    geschlossenen Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2035/92 af 22. juli 1992 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1992 om importlicenser for visse mejeriprodukter i forbindelse med den ordning,
    der er fastsat i de interimsaftaler, som Fællesskabet har indgået med Republikken
    Polen, Den Tjekkiske og Slovakiske Føderative Republik og Republikken Ungarn
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2035/92 της Επιτροπής
    της 22ας Ιουλίου 1992 περί καθορισμού ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Ιούλιο του 1992 για ορισμένα
    προϊόντα του τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων του καθεστώτος που προβλέπεται από
    τις ενδιάμεσες συμφωνίες τις οποίες συνήψε
    η Κοινότητα με τη Δημοκρατία της Πολωνίας,
    τη Δημοκρατία της Ουγγαρίας και την Τσεχική
    και Σλοβακική Ομοσπονδιακή Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2035/92 della Commissione, del 22 luglio 1992, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli di
    importazione presentate nel mese di luglio 1992 per taluni prodotti del settore
    del latte e dei prodotti lattiero-caseari nel quadro del regime previsto dagli
    accordi interinali conclusi tra la Comunità e la Repubblica di Polonia, la Repubblica
    di Ungheria e la Repubblica federativa ceca e slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2035/92 van de Commissie van 22 juli 1992 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector melk en zuivelprodukten, die in juli 1992
    zijn ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Interimovereenkomsten met de Republiek Polen, de Republiek Hongarije
    en de Tsjechische en Slowaakse Federatieve Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2035/92 da Comissão, de 22 de Julho de 1992, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector do leite e dos produtos lácteos apresentados
    em Julho de 1992 ao abrigo do regime previsto nos acordos provisórios concluídos
    pela Comunidade com a República da Polónia, a República da Hungria e a República
    Federativa Checa a Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2035/92 de la Comisión, de 22 de julio de 1992, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación presentadas en julio de 1992 de algunos productos del sector de
    la leche y los productos lácteos al amparo del régimen previsto en los Acuerdos
    interinos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría y la República Federativa Checa y Eslovaca
