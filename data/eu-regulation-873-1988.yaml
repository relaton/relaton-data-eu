  content: Commission Regulation (EEC) No 873/88 of 30 March 1988 re-establishing
    the levying of customs duties on swimwear products of category 72 (order No 40.0720)
    originating in South Korea, to which the preferential tariff arrangements of Council
    Regulation (EEC) No 3783/87 apply
  type: main
