  content: Commission Regulation (EEC) No 1164/92 of 5 May 1992 re- establishing the
    levying of customs duties on products of categories 9, 23 and 39 (order Nos 40.0090,
    40.0230 and 40.0390), originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1164/92 de la Commission du 5 mai 1992 portant rétablissement
