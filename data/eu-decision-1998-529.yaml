  script: Latn
  content: '98/529/EC: Council Decision of 27 November 1997 concerning the conclusion
    of an Agreement in the form of an exchange of letters between the European Community
    and the Republic of Poland regarding a Protocol on a European Conformity Assessment
    Agreement within the framework of the Europe Agreement between the European Communities
    and their Member States, of the one part, and the Republic of Poland, of the other
    part'
  type: main
- language: fr
  script: Latn
