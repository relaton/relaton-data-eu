    partikolarment il-kummerċ elettroniku, fis-Suq Intern (Direttiva dwar il-kummerċ
    elettroniku)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/31/EG van het Europees Parlement en de Raad van 8 juni 2000
    betreffende bepaalde juridische aspecten van de diensten van de informatiemaatschappij,
    met name de elektronische handel, in de interne markt ("Richtlijn inzake elektronische
    handel")
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2000/31/WE Parlamentu Europejskiego i Rady z dnia 8 czerwca 2000
    r. w sprawie niektórych aspektów prawnych usług społeczeństwa informacyjnego,
    w szczególności handlu elektronicznego w ramach rynku wewnętrznego (dyrektywa
    o handlu elektronicznym)
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/31/CE do Parlamento Europeu e do Conselho de 8 de Junho
    de 2000 relativa a certos aspectos legais dos serviços da sociedade de informação,
    em especial do comércio electrónico, no mercado interno («Directiva sobre o
    comércio electrónico»)
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/31/CE a Parlamentului European și a Consiliului din 8 iunie
    2000 privind anumite aspecte juridice ale serviciilor societății informaționale,
    în special ale comerțului electronic, pe piața internă (directiva privind
    comerțul electronic)
  type: main
- language: sk
  script: Latn
  content: Smernica 2000/31/ES Európskeho parlamentu a Rady z 8. júna 2000 o určitých
    právnych aspektoch služieb informačnej spoločnosti na vnútornom trhu, najmä
    o elektronickom obchode (smernica o elektronickom obchode)
  type: main
- language: sl
  script: Latn
  content: Direktiva 2000/31/ES Evropskega parlamenta in Sveta z dne 8. junija 2000
    o nekaterih pravnih vidikih storitev informacijske družbe, zlasti elektronskega
    poslovanja na notranjem trgu (Direktiva o elektronskem poslovanju)
  type: main
- language: es
  script: Latn
  content: Directiva 2000/31/CE del Parlamento Europeo y del Consejo, de 8 de junio
    de 2000, relativa a determinados aspectos jurídicos de los servicios de la sociedad
    de la información, en particular el comercio electrónico en el mercado interior
    (Directiva sobre el comercio electrónico)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2000/31/EG av den 8 juni 2000 om
    vissa rättsliga aspekter på informationssamhällets tjänster, särskilt elektronisk
    handel, på den inre marknaden ("Direktiv om elektronisk handel")
