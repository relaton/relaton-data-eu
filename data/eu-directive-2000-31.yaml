title:
- language: en
  script: Latn
  content: Directive 2000/31/EC of the European Parliament and of the Council of 8
    June 2000 on certain legal aspects of information society services, in particular
    electronic commerce, in the Internal Market ('Directive on electronic commerce')
  type: main
- language: fr
  script: Latn
  content: Directive 2000/31/CE du Parlement européen et du Conseil du 8 juin 2000
    relative à certains aspects juridiques des services de la société de l'information,
    et notamment du commerce électronique, dans le marché intérieur («directive
    sur le commerce électronique»)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/31/EG des Europäischen Parlaments und des Rates vom 8.
    Juni 2000 über bestimmte rechtliche Aspekte der Dienste der Informationsgesellschaft,
    insbesondere des elektronischen Geschäftsverkehrs, im Binnenmarkt ("Richtlinie
    über den elektronischen Geschäftsverkehr")
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/31/ЕО на Европейския парламент
    и на Съвета от 8 юни 2000 година за някои правни
    аспекти на услугите на информационното общество,
    и по-специално на електронната търговия на
    вътрешния пазар (Директива за електронната
    търговия)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2000/31/ES ze dne 8. června 2000
    o některých právních aspektech služeb informační společnosti, zejména
    elektronického obchodu, na vnitřním trhu (směrnice o elektronickém obchodu)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2000/31/EF af 8. juni 2000 om visse
    retlige aspekter af informationssamfundstjenester, navnlig elektronisk handel,
    i det indre marked (»Direktivet om elektronisk handel«)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/31/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 8ης Ιουνίου 2000 για ορισμένες
    νομικές πτυχές των υπηρεσιών της κοινωνίας
    της πληροφορίας, ιδίως του ηλεκτρονικού εμπορίου,
    στην εσωτερική αγορά («οδηγία για το ηλεκτρονικό
    εμπόριο»)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2000/31/EÜ, 8. juuni 2000, infoühiskonna
