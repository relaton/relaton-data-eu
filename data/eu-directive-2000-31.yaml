    siseturul (direktiiv elektroonilise kaubanduse kohta)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2000/31/EY, annettu 8 päivänä
    kesäkuuta 2000, tietoyhteiskunnan palveluja, erityisesti sähköistä kaupankäyntiä,
