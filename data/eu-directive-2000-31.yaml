    kereskedelemről szóló irányelv)
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/31/CE del Parlamento europeo e del Consiglio dell'8 giugno
    2000 relativa a taluni aspetti giuridici dei servizi della società dell'informazione,
