  content: Reglamento de Ejecución (UE) 2024/251 de la Comisión, de 16 de enero
    de 2024, relativo a la renovación de la autorización de los preparados de Lactiplantibacillus
    plantarum CNCM I-3235, Lactiplantibacillus plantarum DSM 11672/CNCM I-3736, Pediococcus
    acidilactici CNCM I-3237, Pediococcus acidilactici DSM 11673/CNCM I-4622, Pediococcus
    pentosaceus NCIMB 12455, Acidipropionibacterium acidipropionici CNCM I-4661 y
    Lentilactobacillus buchneri NCIMB 40788/CNCM I-4323, así como de Lentilactobacillus
    hilgardii CNCMI I-4785 y Lentilactobacillus buchneri CNCM I-4323/NCIMB 40788 como
    aditivos en los piensos para todas las especies animales, y por el que se modifican
    los Reglamentos de Ejecución (UE) n.o 1065/2012, (UE) n.o 1119/2012, (UE) n.o
    1113/2013 y (UE) n.o 304/2014 y se derogan los Reglamentos de Ejecución (UE)
    n.o 990/2012 y (UE) 2019/764
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/251 av den 16 januari
    2024 om förlängning av godkännandet av ett preparat av Lactiplantibacillus
    plantarum CNCM I-3235, Lactiplantibacillus plantarum DSM 11672/CNCM I-3736, Pediococcus
    acidilactici CNCM I-3237, Pediococcus acidilactici DSM 11673/CNCM I-4622, Pediococcus
    pentosaceus NCIMB 12455, Acidipropionibacterium acidipropionici CNCM I-4661, Lentilactobacillus
    buchneri NCIMB 40788/CNCM I-4323 samt Lentilactobacillus hilgardii CNCM I-4785
    och Lentilactobacillus buchneri CNCM I-4323/NCIMB 40788 som fodertillsats för
    alla djurarter och om ändring av genomförandeförordningarna (EU) nr 1065/2012,
    (EU) nr 1119/2012, (EU) nr 1113/2013 och (EU) nr 304/2014 samt upphävande av
    genomförandeförordningarna (EU) nr 990/2012 och (EU) 2019/764
  type: main
