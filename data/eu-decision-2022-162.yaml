title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/162 of 4 February 2022 laying
    down rules for the application of Directive (EU) 2019/904 of the European Parliament
    and of the Council as regards the calculation, verification and reporting on the
    reduction in the consumption of certain single-use plastic products and the measures
    taken by Member States to achieve such reduction
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/162 de la Commission du 4 février 2022
    établissant les modalités d’application de la directive (UE) 2019/904 du Parlement
    européen et du Conseil en ce qui concerne le calcul et la vérification de la
    réduction de la consommation de certains produits en plastique à usage unique
    et la communication des données y relatives et des mesures prises par les États
    membres pour parvenir à cette réduction
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/162 der Kommission vom 4. Februar 2022
    mit Vorschriften für die Anwendung der Richtlinie (EU) 2019/904 des Europäischen
    Parlaments und des Rates hinsichtlich der Berechnung und Überprüfung der Verminderung
    des Verbrauchs an bestimmten Einwegkunststoffartikeln und der von den Mitgliedstaaten
    zur Verbrauchsminderung ergriffenen Maßnahmen sowie der Berichterstattung darüber
  type: main
- language: bg
  script: Cyrl
