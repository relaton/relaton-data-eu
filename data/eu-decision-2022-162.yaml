    за прилагането на Директива (ЕС) 2019/904 на Европейския
    парламент и на Съвета по отношение на изчисляването,
    проверката и докладването на намаляването
    на потреблението на някои пластмасови продукти
    за еднократна употреба и предприетите от държавите
    членки мерки за постигане на това намаление
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/162 ze dne 4. února 2022, kterým
    se stanoví prováděcí pravidla ke směrnici Evropského parlamentu a Rady (EU)
    2019/904, pokud jde o výpočet, ověřování a vykazování údajů o snížení
    spotřeby některých plastových výrobků na jedno použití a opatření přijatá
    členskými státy za účelem dosažení tohoto snížení
  type: main
