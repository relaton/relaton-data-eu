    Dezember 1984 und vom 1. Januar 1985 bis 31. Oktober 1985 geltenden Zusatzbetrags,
    der bei der Einfuhr von nicht behandeltem Olivenöl mit Ursprung in Tunesien in
    die Gemeinschaft von der Abschöpfung abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 438/85 af 18. februar 1985 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Den tunesiske Republik vedrørende fastsættelse for perioden fra den 1. november
