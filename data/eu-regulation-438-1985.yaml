  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 438/85 del Consiglio del 18 febbraio 1985 relativo
    alla conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e la Repubblica tunisina, che fissa, per il periodo dal 1o novembre
    al 31 dicembre 1984 e per il periodo dal 1o gennaio al 31 ottobre 1985, l' importo
    aggiuntivo da detrarre dal prelievo applicabile all' importazione nella Comunità
    di olio d' oliva non trattato originario della Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 438/85 van de Raad van 18 februari 1985 betreffende
    de sluiting van de Overeenkomst in de vorm van een briefwisseling tussen de Europese
    Economische Gemeenschap en de Republiek Tunesië tot vaststelling, voor het tijdvak
    van 1 november 1984 tot en met 31 december 1984 en van 1 januari 1985 tot en met
    31 oktober 1985, van het aanvullend bedrag dat in mindering moet worden gebracht
    op de heffing die bij invoer in de Gemeenschap van toepassing is op niet-behandelde
    olijfolie van oorsprong uit Tunesië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 438/85 do Conselho, de 18 de Fevereiro de 1985,
