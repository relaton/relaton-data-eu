    Europea y la República de Túnez por el que se establece, para el período comprendido
    entre el 1 de noviembre y el 31 de diciembre de 1984 y, para el período comprendido
    entre el 1 de enero y el 31 de octubre de 1985, el montante adicional que ha de
    deducirse de la exacción reguladora aplicable a la importación en la Comunidad
    de aceite de oliva sin tratar originario de Túnez
