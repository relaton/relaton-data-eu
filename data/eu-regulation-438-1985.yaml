  content: Council Regulation (EEC) No 438/85 of 18 February 1985 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and the Republic of Tunisia fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Tunisia, for the period 1 November to 31 December 1984 and the period 1 January
    to 31 October 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 438/85 du Conseil du 18 février 1985 concernant la
    conclusion de l' accord sous forme d' échange de lettres entre la Communauté
    économique européenne et la République tunisienne fixant, pour la période
    du 1er novembre au 31 décembre 1984 et pour la période du 1er janvier au 31
    octobre 1985, le montant additionnel à déduire du prélèvement applicable à
    l' importation, dans la Communauté, d' huile d' olive non traitée originaire
    de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 438/85 des Rates vom 18. Februar 1985 über den Abschluß
