  content: Règlement (CEE) n 2417/70 de la Commission, du 26 novembre 1970, fixant
    les taux des restitutions applicables, à compter du 1er décembre 1970, au sucre
    et à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2417/70 der Kommission vom 26. November 1970 zur Festsetzung
    der ab 1. Dezember 1970 geltenden Erstattungssätze bei der Ausfuhr von Zucker
    und Melasse in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2417/70 della Commissione, del 26 novembre 1970, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 dicembre 1970,
    allo zucchero e al melasso esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2417/70 van de Commissie van 26 november 1970 houdende
    vaststelling van de restituties die met ingang van 1 december 1970 worden toegepast
    voor suiker en melasse, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
