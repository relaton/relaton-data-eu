title:
- language: en
  script: Latn
  content: Commission Decision of 21 December 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the Kingdom of the
    Netherlands for expenditure on vocational retraining and resettlement operations
    carried out by the Ministry for Social Affairs
  type: main
- language: fr
  script: Latn
  content: Décision 74/179/CEE de la Commission, du 21 décembre 1973, portant octroi
    du concours du Fonds social européen, prévu à l'article 125 du Traité, au
    bénéfice du Royaume des Pays-Bas pour des dépenses relatives à des opérations
    de rééducation professionnelle et de réinstallation effectuées par le Ministère
    des affaires sociales
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973 zur Gewährung eines
    Zuschusses nach Artikel 125 EWGV aus dem Europäischen Sozialfonds an das Königreich
    der Niederlande zu Aufwendungen für vom "Ministerie van Sociale Zaken" durchgeführte
    Berufsumschulungs- und Umsiedlungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om ydelse af tilskud i henhold
    til traktatens artikel 125 fra Den europæiske Socialfond til kongeriget Nederlandene
    til udgifter ved foranstaltninger til faglig omskoling og flytning, gennemført
    af Ministerie van Sociale Zaken
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 dicembre 1973, recante concessione
    di un contributo del Fondo sociale europeo, previsto dall'articolo 125 del trattato,
    a favore del Regno dei Paesi Bassi per spese concernenti operazioni di riqualificazione
    professionale e di nuova sistemazione effettuata dal ministero degli affari sociali
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van het Koninkrijk der Nederlanden voor door het Ministerie
    van Sociale Zaken gemaakte herscholings- en verplaatsingskosten
