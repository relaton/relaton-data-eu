title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2215/86 of 15 July 1986 re-establishing
    the levying of customs duties on other vitamins, falling within subheading 29.38
    B V, originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2215/86 de la Commission du 15 juillet 1986 portant
    rétablissement de la perception des droits de douane applicables aux autres vitamines
    de la sous-position 29.38 B V du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2215/86 der Kommission vom 15. Juli 1986 zur Wiedereinführung
    der Erhebung der Zölle für andere Vitamine der Tarifstelle 29.38 B V des Gemeinsamen
    Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3599/85
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2215/86 af 15. juli 1986 om genindførelse
