    waarvoor de in Verordening (EEG) nr. 3599/85 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2215/86 da Comissão de 15 de Julho de 1986 que
