title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/2420 of 24 October 2023 authorising the opening
    of negotiations on amending the Arrangements between the European Union, on the
    one part, and, respectively, the Republic of Iceland, the Kingdom of Norway, the
    Swiss Confederation and the Principality of Liechtenstein, on the other part,
    as regards the modalities of the participation by those countries in the European
    Asylum Support Office, in order for them to be able to participate in the European
    Union Agency for Asylum
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2420 du Conseil du 24 octobre 2023 autorisant l’ouverture
    de négociations en vue de la modification des arrangements ou accords conclus
    entre l’Union européenne, d’une part, et, respectivement, la République
    d’Islande, le Royaume de Norvège, la Confédération suisse et la Principauté
    de Liechtenstein, d’autre part, sur les modalités de la participation de ces
    pays au Bureau européen d’appui en matière d’asile, afin qu’ils puissent
    participer à l’Agence de l’Union européenne pour l’asile
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/2420 des Rates vom 24. Oktober 2023 über die Ermächtigung
    zur Aufnahme von Verhandlungen zur Änderung der Vereinbarungen zwischen der Europäischen
    Union einerseits und der Republik Island, dem Königreich Norwegen, der Schweizerischen
    Eidgenossenschaft beziehungsweise dem Fürstentum Liechtenstein andererseits über
    die Modalitäten der Beteiligung dieser Staaten am Europäischen Unterstützungsbüro
    für Asylfragen, um es diesen Ländern zu ermöglichen, sich an der Asylagentur
    der Europäischen Union zu beteiligen
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/2420 на Съвета от 24 октомври
    2023 година за разрешаване на започването на
    преговори за изменение на договореностите
    между Европейския съюз, от една страна, и съответно
    Република Исландия, Кралство Норвегия, Конфедерация
    Швейцария и Княжество Лихтенщайн, от друга
    страна, по отношение на реда и условията за
    участието на тези държави в Европейската служба
    за подкрепа в областта на убежището, за да могат
