  script: Latn
  content: Neuvoston päätös (EU) 2023/2420, annettu 24 päivänä lokakuuta 2023,
    luvan antamisesta aloittaa neuvottelut Euroopan unionin sekä Islannin tasavallan,
    Norjan kuningaskunnan, Sveitsin valaliiton ja Liechtensteinin ruhtinaskunnan välisten,
    kyseisten maiden osallistumista Euroopan turvapaikka-asioiden tukiviraston toimintaan
    koskevista yksityiskohtaisista säännöistä tehtyjen järjestelyasiakirjojen
    muuttamiseksi, jotta kyseiset maat voivat osallistua Euroopan unionin turvapaikkaviraston
    toimintaan
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2023/2420 ón gComhairle an 24 Deireadh Fómhair 2023 lena
    n-údaraítear tús a chur le caibidlíocht maidir le leasú a dhéanamh ar na
    Socruithe idir an tAontas Eorpach, de pháirt, agus Cónaidhm na hEilvéise, Ríocht
    na hIorua, Poblacht na hÍoslainne, agus Prionsacht Lichtinstéin, faoi seach,
    den pháirt eile, maidir le módúlachtaí rannpháirtíocht na dtíortha sin
    san Oifig Eorpach Tacaíochta do Chúrsaí Tearmainn, chun go bhféadfaidh siad
    a bheith rannpháirteach i nGníomhaireacht an Aontais Eorpaigh um Thearmann
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2023/2420 od 24. listopada 2023. o odobravanju otvaranja
    pregovora o izmjeni Aranžmanâ između Unije, s jedne strane, i Republike Islanda,
    Kraljevine Norveške, Švicarske Konfederacije odnosno Kneževine Lihtenštajna,
    s druge strane, o modalitetima sudjelovanja tih država u Europskom potpornom
    uredu za azil, kako bi im se omogućilo da sudjeluju u Agenciji Europske unije
    za azil
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2023/2420 határozata (2023. október 24.) az egyrészről
    az Európai Unió, és másrészről az Izlandi Köztársaság, a Norvég Királyság,
    a Svájci Államszövetség, illetve a Liechtensteini Hercegség közötti, az
    említett országok Európai Menekültügyi Támogatási Hivatalban való részvételének
    részletes szabályairól szóló megállapodásoknak az említett országok Európai
    Unió Menekültügyi Ügynökségében való részvételének lehetővé tétele
    érdekében történő módosítására irányuló tárgyalások megkezdésére
    való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/2420 del Consiglio, del 24 ottobre 2023, che autorizza
    l’avvio di negoziati relativi alla modifica degli accordi tra l’Unione europea,
    da una parte, e, rispettivamente, la Repubblica d’Islanda, il Regno di Norvegia,
    la Confederazione svizzera e il Principato del Liechtenstein, dall’altra, per
    quanto riguarda le modalità di partecipazione di tali paesi all’Ufficio europeo
    di sostegno per l’asilo affinché essi possano partecipare all’Agenzia dell’Unione
    europea per l’asilo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2023/2420 (2023. gada 24. oktobris), ar ko pilnvaro
    sākt sarunas par vienošanās starp Eiropas Savienību, no vienas puses, un,
    attiecīgi, Islandes Republiku, Norvēģijas Karalisti, Šveices Konfederāciju
    un Lihtenšteinas Firstisti, no otras puses, grozīšanu attiecībā uz kārtību,
    kādā minētās valstis piedalās Eiropas Patvēruma atbalsta birojā, lai tās
    varētu piedalīties Eiropas Savienības Patvēruma aģentūrā
  type: main
- language: lt
  script: Latn
  content: 2023 m. spalio 24 d. Tarybos sprendimas (ES) 2023/2420, kuriuo suteikiami
    įgaliojimai pradėti derybas dėl Europos Sąjungos ir atitinkamai Islandijos
    Respublikos, Norvegijos Karalystės, Šveicarijos Konfederacijos ir Lichtenšteino
    Kunigaikštystės susitarimų dalinių pakeitimų, kiek tai susiję su tų valstybių
    dalyvavimo Europos prieglobsčio paramos biuro veikloje sąlygomis, kad jos galėtų
    dalyvauti Europos Sąjungos prieglobsčio agentūros veikloje
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2023/2420 tal-24 ta’ Ottubru 2023 li tawtorizza
    l-ftuħ ta’ negozjati dwar l-emendar tal-Arranġamenti bejn l-Unjoni Ewropea,
    min-naħa waħda, u, rispettivament, ir-Repubblika tal-Iżlanda, ir-Renju tan-Norveġja,
    il-Konfederazzjoni Żvizzera u l-Prinċipalità tal-Liechtenstein, min-naħa l-oħra,
    fir-rigward tal-modalitajiet tal-parteċipazzjoni minn dawk il-pajjiżi fl-Uffiċċju
    Ewropew ta’ Appoġġ fil-qasam tal-Ażil, sabiex ikunu jistgħu jipparteċipaw
    fl-Aġenzija tal-Unjoni Ewropea għall-Ażil
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/2420 van de Raad van 24 oktober 2023 tot machtiging tot
    het openen van onderhandelingen over de wijziging van de regelingen tussen de
    Unie, enerzijds, en respectievelijk de Republiek IJsland, het Koninkrijk Noorwegen,
    de Zwitserse Bondsstaat en het Vorstendom Liechtenstein, anderzijds, over de nadere
    bijzonderheden van de deelname van die landen aan het Europees Ondersteuningsbureau
    voor asielzaken, teneinde ervoor te zorgen dat zij kunnen deelnemen aan het Asielagentschap
    van de Europese Unie
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/2420 z dnia 24 października 2023 r. w sprawie upoważnienia
    do podjęcia negocjacji dotyczących zmiany Uzgodnień między Unią Europejską,
    z jednej strony, a odpowiednio Republiką Islandii, Królestwem Norwegii, Konfederacją
    Szwajcarską oraz Księstwem Liechtensteinu, z drugiej strony, dotyczących warunków
    udziału tych państw w pracach Europejskiego Urzędu Wsparcia w dziedzinie Azylu,
    aby mogły one brać udział w pracach Agencji Unii Europejskiej ds. Azylu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2023/2420 do Conselho, de 24 de outubro de 2023, que autoriza
    a abertura de negociações com vista a alterar os convénios entre a União Europeia,
    por um lado, e, respetivamente, a República da Islândia, o Reino da Noruega,
    a Confederação Suíça e o Principado do Listenstaine, por outro, no que diz
    respeito às modalidades da participação desses países no Gabinete Europeu
    de Apoio em matéria de Asilo, a fim de lhes permitir participar na Agência da
    União Europeia para o Asilo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/2420 a Consiliului din 24 octombrie 2023 de autorizare
    a începerii negocierilor în vederea modificării acordurilor dintre Uniunea
    Europeană, pe de o parte, și, respectiv, Republica Islanda, Regatul Norvegiei,
    Confederația Elvețiană și Principatul Liechtenstein, pe de altă parte, privind
    modalitățile de participare a acestor țări la Biroul European de Sprijin pentru
    Azil, pentru ca aceste țări să poată participa la Agenția Uniunii Europene
    pentru Azil
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/2420 z 24. októbra 2023 o poverení začať
    rokovania o zmene jednotlivých dohôd medzi Európskou úniou na jednej strane
    a Islandskou republikou, Nórskym kráľovstvom, Švajčiarskou konfederáciou
    a Lichtenštajnským kniežatstvom na strane druhej, pokiaľ ide o dojednanie
    foriem účasti uvedených krajín na činnosti Európskeho podporného úradu
    pre azyl, aby sa mohli zúčastňovať na činnosti Agentúry Európskej únie
    pre azyl
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/2420 z dne 24. oktobra 2023 o odobritvi začetka
    pogajanj o spremembi dogovorov med Evropsko unijo na eni strani in Republiko Islandijo,
    Kraljevino Norveško, Švicarsko konfederacijo oziroma Kneževino Lihtenštajn
    na drugi strani, kar zadeva podrobnosti sodelovanja teh držav v Evropskem azilnem
    podpornem uradu, da bodo lahko sodelovale v Agenciji Evropske unije za azil
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2023/2420 del Consejo, de 24 de octubre de 2023, por la
    que se autoriza la apertura de negociaciones con vistas a la modificación de
    los Acuerdos entre la Unión Europea, por un lado, y la República de Islandia,
    el Reino de Noruega, la Confederación Suiza y el Principado de Liechtenstein
    respectivamente, por otro, sobre las modalidades de la participación de dichos
    países en la Oficina Europea de Apoyo al Asilo, con el fin de que puedan participar
    en la Agencia de Asilo de la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/2420 av den 24 oktober 2023 om bemyndigande att
    inleda förhandlingar om att ändra avtalen mellan Europeiska unionen, å ena
    sidan, och Island, Konungariket Norge, Schweiziska edsförbundet respektive Furstendömet
    Liechtenstein, å andra sidan, om villkoren för dessa länders deltagande i Europeiska
    stödkontoret för asylfrågor, så att de kan delta i Europeiska unionens asylbyrå
  type: main
