  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/2420 ze dne 24. října 2023 o zmocnění k
    zahájení jednání o změně ujednání mezi Evropskou unií na jedné straně
    a Islandskou republikou, Norským královstvím, Švýcarskou konfederací a Lichtenštejnským
    knížectvím na straně druhé, pokud jde o pravidla pro účast uvedených zemí
    na činnosti Evropského podpůrného úřadu pro otázky azylu, aby se mohly
    účastnit činnosti Agentury Evropské unie pro otázky azylu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2023/2420 af 24. oktober 2023 om bemyndigelse til
    at indlede forhandlinger om ændring af ordningerne mellem Den Europæiske Union
    på den ene side og henholdsvis Republikken Island, Kongeriget Norge, Det Schweiziske
    Forbund og Fyrstendømmet Liechtenstein på den anden side for så vidt angår
    vilkårene for disse landes deltagelse i Det Europæiske Asylstøttekontor med
    henblik på at muliggøre deres deltagelse i Den Europæiske Unions Asylagentur
  type: main
