title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2337/80 of 8 September 1980 re-establishing
    the levying of customs duties on citric acid, falling within subheading 29.16
    A IV a) and originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2337/80 de la Commission, du 8 septembre 1980, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    citrique, de la sous-position 29.16 A IV a) du tarif douanier commun, originaire
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2337/80 der Kommission vom 8. September 1980 zur Wiedereinführung
    des Zollsatzes für Citronensäure der Tarifstelle 29.16 A IV a) mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2337/80 af 8. september 1980 om genindførelse
    af opkrævning af toldafgift for citronsyre, under pos. 29.16 A IV a), som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2337/80 della Commissione, dell' 8 settembre 1980,
    che ripristina la riscossione dei dazi doganali applicabili all' acido citrico,
    della sottovoce 29.16 A IV a) della tariffa doganale comune, originario dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2337/80 van de Commissie van 8 september 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor citroenzuur van post
    29.16 A IV a), van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
