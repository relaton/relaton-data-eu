title:
- language: en
  script: Latn
  content: '1999/651/EC: Commission Decision of 9 December 1998 on the measure which
    Ireland is planning to implement in favour of employers for the refund of social
    security contributions paid in respect of seafarers employed on certain categories
    of ships not being required to be registered in a Member State (notified under
    document number C(1998) 4278) (Text with EEA relevance) (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/651/CE: Décision de la Commission, du 9 décembre 1998, concernant
    la mesure que l''Irlande envisage de mettre à exécution en faveur des employeurs
    pour le remboursement des cotisations versées au titre de la sécurité sociale
    des gens de mer travaillant à bord de navires de certaines catégories qui ne
    doivent pas obligatoirement être immatriculés dans un registre d''un État membre
    [notifiée sous le numéro C(1998) 4278] (Texte présentant de l''intérêt pour
    l''EEE) (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '1999/651/EG: Entscheidung der Kommission vom 9. Dezember 1998 über die
    Maßnahme, die Irland zugunsten von Arbeitgebern durch die Erstattung von Sozialversicherungsbeiträgen
    für Seeleute auf bestimmten Kategorien von Schiffen, die nicht in einem Mitgliedstaat
    registriert sein müssen, plant (Bekanntgegeben unter Aktenzeichen K(1998) 4278)
    (Text von Bedeutung für den EWR) (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '1999/651/EF: Kommissionens beslutning af 9. december 1998 om Irlands påtænkte
    støtte til arbejdsgivere til refusion af socialsikringsbidrag til søfolk ombord
    på visse typer skibe, der ikke skal registreres i en EU-medlemsstat (meddelt
    under nummer K(1998) 4278) (EØS-relevant tekst) (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '1999/651/ΕΚ: Απόφαση της Επιτροπής, της 9ης
    Δεκεμβρίου 1998, σχετικά με το μέτρο που προγραμματίζει
    να εφαρμόσει η Ιρλανδία υπέρ της εργοδοσίας
    για την επιστροφή των εισφορών κοινωνικής
    ασφάλισης που καταβάλλονται για τους ναυτιλλόμενους
    που απασχολούνται σε ορισμένες κατηγορίες
    πλοίων τα οποία δεν απαιτείται να έχουν νηολογηθεί
    σε κράτος μέλος [κοινοποιηθείσα υπό τον αριθμό
    Ε(1998) 4278] (Κείμενο που παρουσιάζει ενδιαφέρον
    για τον ΕΟΧ) (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '1999/651/EY: Komission päätös, tehty 9 päivänä joulukuuta 1998,
    toimenpiteestä, jonka Irlanti aikoo toteuttaa palauttaakseen työnantajille jäsenvaltioissa
    rekisteröimispakon piiriin kuulumattomilla tietyillä alustyypeillä työskentelevistä
    merimiehistä maksetut sosiaaliturvamaksut (tiedoksiannettu numerolla K(1998)
    4278) (ETA:n kannalta merkityksellinen teksti) (Ainoastaan englanninkielinen teksti
    on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '1999/651/CE: Decisione della Commissione, del 9 dicembre 1998, relativa
    alla misura che l''Irlanda intende attuare a favore dei datori di lavoro per il
    rimborso degli oneri sociali versati per i marittimi in servizio su certe categorie
    di navi che non sono tenute a registrazione in uno Stato membro [notificata con
    il numero C(1998) 4278] (Testo rilevante ai fini del SEE) (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '1999/651/EG: Beschikking van de Commissie van 9 december 1998 inzake de
    door Ierland voorgenomen maatregel tot terugbetaling aan werkgevers van socialezekerheidsbijdragen
    die voor op bepaalde categorieën schepen waarvan registratie in een lidstaat
    niet vereist is, werkzame zeelieden zijn betaald (kennisgeving geschied onder
    nummer C(1998) 4278) (Voor de EER relevante tekst) (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '1999/651/CE: Decisão da Comissão, de 9 de Dezembro de 1998, relativa
    à medida, prevista pela Irlanda em favor das entidades patronais, de reembolso
    das contribuições para a segurança social respeitantes aos marítimos empregados
    em certos tipos de navios cujo registo num Estado-Membro não é exigido [notificada
    com o número C(1998) 4278] (Texto relevante para efeitos do EEE) (Apenas faz
    fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '1999/651/CE: Decisión de la Comisión, de 9 de diciembre de 1998, relativa
    a la medida que Irlanda proyecta aplicar en favor de los empresarios para la devolución
    de las cotizaciones de la seguridad social correspondientes a los marinos empleados
    a bordo de determinados tipos de buques que no están obligados a registrarse
    en un Estado miembro [notificada con el número C(1998) 4278] (Texto pertinente
    a efectos del EEE) (El texto en lengua inglesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '1999/651/EG: Kommissionens beslut av den 9 december 1998 om den stödåtgärd
    som Irland avser att införa till förmån för arbetsgivare genom återbetalning
    av socialförsäkringsavgifter som betalats för sjöfolk anställda på fartyg
    som inte är registreringspliktiga i en medlemsstat [delgivet med nr K(1998) 4278]
