title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3799/90 of 21 December 1990 re-establishing
    the levying of the customs duties applicable to the products of category No 27
    (order No 40.0270) originating in India, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 3799/90 de la Commission, du 21 décembre 1990, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie nº 27 (numéro d' ordre 40.0270) originaires de l' Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) nº 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3799/90 der Kommission vom 21. Dezember 1990 über
    die Wiedereinführung des Zollsatzes für die Waren der Warenkategorie Nr. 27
    (lfd. Nummer 40.0270) mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3897/89 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3799/90 af 21. december 1990 om genindførelse
    af opkrævning af told for varer under varekategori 27 (løbenummer 40.0270),
    som har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
