    n. 27 (numero d' ordine 40.0270) originari dell' India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3799/90 van de Commissie van 21 december 1990 houdende
