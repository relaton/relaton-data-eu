    της κατηγορίας 27 (αύξων αριθ. 40.0270), καταγωγής
    Ινδίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3799/90 della Commissione, del 21 dicembre 1990, che
