    quanto riguarda l’inclusione della nuova sostanza psicoattiva N,N-dietil-2-[[4-(1-metiletossi)fenil]metil]-5-nitro-1H-benzimidazol-1-etanammina
    (isotonitazene) nella definizione di «stupefacenti»
  type: main
- language: lv
  script: Latn
