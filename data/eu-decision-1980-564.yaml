title:
- language: en
  script: Latn
  content: '80/564/EEC: Commission Decision of 4 June 1980 accepting undertakings
    in connection with the anti-dumping proceedings concerning imports of fibre building
    board originating in Czechoslovakia, Finland, Norway, Poland, Romania, Spain,
    the Soviet Union and Sweden and terminating those proceedings'
  type: main
- language: fr
  script: Latn
  content: '80/564/CEE: Décision de la Commission, du 4 juin 1980, portant acceptation
    des engagements souscrits dans le cadre de procédures anti-"dumping" concernant
    les importations de panneaux de fibres originaires d'' Espagne, de Finlande, de
    Norvège, de Pologne, de Roumanie, de Suède, de Tchécoslovaquie et d'' Union
    soviétique et portant clôture de ces procédures'
  type: main
- language: de
  script: Latn
  content: '80/564/EWG: Beschluß der Kommission vom 4. Juni 1980 über die Annahme
    von Verpflichtungen im Zusammenhang mit dem Antidumpingverfahren betreffend Einfuhren
    von Platten aus Fasern mit Ursprung in Finnland, Norwegen, Polen, Rumänien, Schweden,
    der Sowjetunion, Spanien und der Tschechoslowakei und über die Einstellung dieses
    Verfahrens'
  type: main
- language: da
  script: Latn
  content: '80/564/EØF: Kommissionens afgørelse af 4. juni 1980 om godtagelse af
    tilsagn i forbindelse med antidumpingproceduren vedrørende indførsel af fiberplader
    med oprindelse i Finland, Norge, Polen, Rumænien, Sovjetunionen, Spanien, Sverige
    og Tjekkoslovakiet og om afslutning af denne procedure'
  type: main
- language: el
  script: Grek
  content: '80/564/ΕΟΚ : Απόφαση της Επιτροπής, της 4ης
    Ιουνίου 1980, με την οποία γίνονται αποδεκτές
    οι εγγυήσεις που καταβλήθηκαν στα πλαίσια
    των διαδικασιών αντιντάμπινγκ όσον αφορά τις
    εισαγωγές ινοσανίδων προέλευσης Ισπανίας,
    Φινλανδίας, Νορβηγίας, Πολωνίας, Ρουμανίας,
    Σουηδίας, Τσεχοσλαβακίας και Σοβιετικής Ένωσης
    και με την οποία ολοκληρώνονται οι σχετικές
    διαδικασίες'
  type: main
- language: it
  script: Latn
  content: '80/564/CEE: Decisione della Commissione, del 4 giugno 1980, recante accettazione
    degli impegni assunti dagli esportatori della Cecoslovacchia, della Finlandia,
    della Norvegia, della Polonia, della Romania, della Spagna, della Svezia e dell''
    Unione Sovietica, nell'' ambito della procedura "antidumping", relativa alle importazioni
    di pannelli di fibre originari di questi paesi, e recante conclusione di detta
    procedura'
  type: main
- language: nl
  script: Latn
  content: '80/564/EEG: Besluit van de Commissie van 4 juni 1980 houdende aanvaarding
    van de verbintenissen die zijn aangegaan in het kader van de anti-dumpingprocedures
    betreffende de invoer van vezelplaat van oorsprong uit Finland, Noorwegen, Polen,
    Roemenië, de Sowjetunie, Spanje, Tsjechoslowakije en Zweden en houdende beëindiging
    van deze procedures'
  type: main
