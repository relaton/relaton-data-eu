  content: Commission Regulation (EEC) No 76/93 of 18 January 1993 amending Regulation
    (EEC) No 1481/86 on the determination of prices of fresh or chilled sheep carcases
    on representative Community markets and the survey of prices of certain other
    qualities of sheep carcases in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 76/93 de la Commission, du 18 janvier 1993, modifiant
