  content: Règlement (CEE) n° 2644/70 de la Commission, du 28 décembre 1970, modifiant
    le règlement (CEE) n° 2104/68 en ce qui concerne la participation aux frais
    de stockage, en cas de report, des producteurs de betteraves et de cannes pendant
    la campagne sucrière 1970/71
  type: main
