title:
- language: en
  script: Latn
  content: '82/219/EEC: Commission Decision of 1 April 1982 authorizing the French
    Republic not to apply Community treatment to men''s and boys''shirts, woven, originating
    in Indonesiai (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/219/CEE: Décision de la Commission, du 1er avril 1982, autorisant
    la République française à exclure du traitement communautaire les chemises
    et chemisettes tissées, pour hommes et garçonnets, originaires de l''Indonésie
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/219/EWG: Entscheidung der Kommission vom 1. April 1982 zur Ermächtigung
    der Französischen Republik, aus Indonesien stammende Oberhemden, auch Sport-
    und Arbeitshemden, aus Geweben, für Männer und Knaben, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/219/EØF: Kommissionens beslutning af 1. april 1982 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter) til mænd og drenge, med oprindelse i Indonesien
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/219/EOK: Απόφαση τής Επιτροπής τής 1ης Απριλίου
