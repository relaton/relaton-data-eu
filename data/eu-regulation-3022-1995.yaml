title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3022/95 of 22 December 1995 temporarily suspending
    the autonomous Common Customs Tariff duty on certain industrial products (in the
    microelectronics and allied sectors)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3022/95 du Conseil, du 22 décembre 1995, portant suspension
    temporaire des droits autonomes du tarif douanier commun sur un certain nombre
    de produits industriels (microélectronique et secteurs connexes)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3022/95 des Rates vom 22. Dezember 1995 zur zeitweiligen
    Aussetzung der autonomen Zollsätze des Gemeinsamen Zolltarifs für einige industrielle
    Waren (Mikroelektronik und verwandte Bereiche)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3022/95 af 22. december 1995 om midlertidig
    suspension af de autonome satser i den fælles toldtarif for en række industrivarer
    (mikroelektronik og beslægtede områder)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3022/95 του Συμβουλίου
    της 22ας Δεκεμβρίου 1995 για την προσωρινή αναστολή
    των αυτόνομων δασμών του κοινού δασμολογίου
    για έναν ορισμένο αριθμό βιομηχανικών προϊόντων
    (τομέας μικροηλεκτρονικής και συναφείς τομείς)
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3022/95, annettu 22 päivänä joulukuuta 1995,
    tiettyihin teollisuustuotteisiin (mikroelektroniikka ja siihen liittyvät alat)
    sovellettavien yhteisen tullitariffin autonomisten tullien väliaikaisesta suspendoimisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3022/95 del Consiglio, del 22 dicembre 1995, recante
    sospensione temporanea dei dazi autonomi della tariffa doganale comune per un
    certo numero di prodotti industriali (microelettronica e settori affini)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3022/95 van de Raad van 22 december 1995 houdende
    tijdelijke schorsing van de autonome rechten van het gemeenschappelijk douanetarief
    op een aantal industriële produkten (micro-elektronica en aanverwante sectoren)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3022/95 do Conselho, de 22 de Dezembro de 1995, que
    suspende temporariamente os direitos autónomos da Pauta Aduaneira Comum para
    um certo número de produtos industriais (microelectrónica e sectores conexos)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3022/95 del Consejo, de 22 de diciembre de 1995, por
    el que se suspenden temporalmente los derechos autónomos del Arancel Aduanero
    Común sobre un determinado número de productos industriales (microelectrónica
    y sectores afines)
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) NR 3022/95 av den 22 december 1995 om tillfällig
    befrielse från autonoma tullar enligt Gemensamma tulltaxan för ett antal industriprodukter
    (inom mikroelektroniska och närstående sektorer)
  type: main
