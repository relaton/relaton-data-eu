  content: Commission Implementing Regulation (EU) 2022/302 of 24 February 2022 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) 2020/492,
    as amended by Implementing Regulation (EU) 2020/776, on imports of certain woven
    and/or stitched glass fibre fabrics (‘GFF’) originating in the People’s
    Republic of China (‘the PRC’) to imports of GFF consigned from Morocco, whether
    declared as originating in Morocco or not, and terminating the investigation concerning
    possible circumvention of the anti-dumping measures imposed by Implementing Regulation
    (EU) 2020/492 on imports of GFF originating in Egypt by imports of GFF consigned
    from Morocco, whether declared as originating in Morocco or not
  type: main
