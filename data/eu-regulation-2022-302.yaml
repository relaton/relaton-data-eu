    (LRK), na uvoz tkanin iz steklenih vlaken, poslanih iz Maroka, ne glede na to,
    ali so deklarirane kot izdelki s poreklom iz Maroka ali ne, ter o zaključku preiskave
    glede možnega izogibanja protidampinškim ukrepom, uvedenim z Izvedbeno uredbo
    (EU) 2020/492 na uvoz tkanin iz steklenih vlaken s poreklom iz Egipta, z uvozom
    tkanin iz steklenih vlaken, poslanih iz Maroka, ne glede na to, ali so deklarirane
    kot izdelki s poreklom iz Maroka ali ne
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/302 de la Comisión de 24 de febrero
    de 2022 por el que se amplía el derecho antidumping definitivo impuesto por el
    Reglamento de Ejecución (UE) 2020/492, modificado por el Reglamento de Ejecución
    (UE) 2020/776, sobre las importaciones de determinados tejidos de fibra de vidrio
    de punto y/o cosidos («TFV») originarios de la República Popular China («China»)
    a las importaciones de TFV procedentes de Marruecos, hayan sido o no declarados
    originarios de este país, y se da por concluida la investigación relativa a
    la posible elusión de las medidas antidumping que impuso el Reglamento de Ejecución
    (UE) 2020/492 a las importaciones de TFV originarios de Egipto mediante las importaciones
    de TFV procedentes de Marruecos, hayan sido o no declarados originarios de este
    último país
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/302 av den 24 februari
    2022 om utvidgning av den slutgiltiga antidumpningstull som infördes genom genomförandeförordning
    (EU) 2020/492, ändrad genom genomförandeförordning (EU) 2020/776, på import
    av vissa vävda och/eller sydda glasfibermaterial med ursprung i Folkrepubliken
    Kina till att även omfatta import av vissa vävda och/eller sydda glasfibermaterial
    som avsänds från Marocko, oavsett om produkternas deklarerade ursprung är Marocko
    eller inte, samt om avslutande av undersökningen beträffande eventuellt kringgående
    av de antidumpningsåtgärder som infördes genom genomförandeförordning (EU)
    2020/492 på import av vissa vävda och/eller sydda glasfibermaterial med ursprung
    i Egypten, som avsänds från Marocko, oavsett om produkternas deklarerade ursprung
    är Marocko eller inte
  type: main
