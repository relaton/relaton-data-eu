title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3486/82 of 10 December 1982 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and the People' s Democratic Republic of Algeria fixing the additional
    amount to be deducted from the levy on imports into the Community of untreated
    olive oil, originating in Algeria, for the period 1 November 1982 to 31 October
    1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3486/82 du Conseil, du 10 décembre 1982, concernant
    la conclusion de l' accord sous forme d' échange de lettres entre la Communauté
    économique européenne et la République algérienne démocratique et populaire
    fixant, pour la période du 1er novembre 1982 au 31 octobre 1983, le montant additionnel
    à déduire du prélèvement applicable à l' importation dans la Communauté
    d' huile d' olive non traitée originaire d' Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3486/82 des Rates vom 10. Dezember 1982 über den
    Abschluß des Abkommens in Form eines Briefwechsels zwischen der Europäischen
    Wirtschaftsgemeinschaft und der Demokratischen Volksrepublik Algerien zur Festsetzung
    des vom 1. November 1982 bis 31. Oktober 1983 geltenden Zusatzbetrags, der bei
    der Einfuhr in die Gemeinschaft von nicht behandeltem Olivenöl mit Ursprung in
    Algerien von der Abschöpfung abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3486/82 af 10. december 1982 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Den demokratiske folkerepublik Algeriet vedrørende fastsættelse for perioden
    1. november 1982 til 31. oktober 1983 af det tillægsbeløb, som skal fratrækkes
    den afgift, der anvendes ved indførsel til Fællesskabet af ikke behandlet olivenolie
    med oprindelse i Algerietv
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3486/82 τού Συμβουλίου
    τής 10ης Δεκεμβρίου 1982 περί συνάψεως συμφωνίας
    υπό μορφήν ανταλλαγής επιστολών μεταξύ τής
    Ευρωπαϊκής Οικονομικής Κοινότητος καί τής
    Λαϊκής Δημοκρατίας τής Αλγερίας περί καθορισμού,
    γιά τήν περίοδο από 1ης Νοεμβρίου 1982 μέχρι 31ης
    Οκτωβρίου 1983, τού προσθέτου ποσού πού πρέπει
    νά αφαιρεθεί από τήν εισφορά πού εφαρμόζεται
    κατά τήν εισαγωγή εντός τής Κοινότητος μή επεξεργασμένου
    ελαιολάδου καταγωγής Αλγερίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3486/82 del Consiglio, del 10 dicembre 1982, relativo
    alla conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e la Repubblica democratica popolare d' Algeria, che fissa,
    per il periodo 1° novembre 1982 - 31 ottobre 1983, l' importo aggiuntivo da detrarre
    dal prelievo applicabile all' importazione nella Comunità di olio di oliva non
    trattato originario dell' Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3486/82 van de Raad van 10 december 1982 betreffende
    de sluiting van de Overeenkomst in de vorm van een briefwisseling tussen de Europese
    Economische Gemeenschap en de Democratische Volksrepubliek Algerije tot vaststelling,
    voor het tijdvak van 1 november 1982 tot en met 31 oktober 1983, van het aanvullend
    bedrag dat in mindering moet worden gebracht op de heffing die bij invoer in de
    Gemeenschap van toepassing is op niet-behandelde olijfolie van oorsprong uit Algerijeh
