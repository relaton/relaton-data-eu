title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1800 of 24 July 2026 amending
    Implementing Decision (EU) 2020/1426 as regards introducing wider frequency channels
    in the Union-harmonised 5,9 GHz frequency band for safety-related applications
    of road intelligent transport systems (notified under document C(2026) 5125)
  type: main
- language: fr
  script: Latn
