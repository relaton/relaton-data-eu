    2026 modifiant la décision d’exécution (UE) 2020/1426 en ce qui concerne l’introduction
    de canaux de fréquences plus larges dans la bande de fréquences de 5,9 GHz harmonisée
    au niveau de l’Union pour les applications des systèmes de transport intelligents
    routiers liées à la sécurité [notifiée sous le numéro C(2026) 5125]
  type: main
- language: de
  script: Latn
