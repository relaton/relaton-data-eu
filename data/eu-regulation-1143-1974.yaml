title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1143/74 of the Commission of 7 May 1974 laying down
    implementing provisions and fixing the amount of subsidies for wine products similar
    to the wine product exported under the label of 'Cyprus Sherry' produced in the
    Community as originally constituted and consigned to Ireland or to the United
    Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1143/74 de la Commission, du 7 mai 1974, fixant les
    modalités d'application et le montant des aides pour des produits vinicoles similaires
    au produit vinicole exporté sous la mention "cyprus sherry" produits dans la
    Communauté dans sa composition originaire et expédiés vers l'Irlande et le
    Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1143/74 der Kommission vom 7. Mai 1974 zur Festsetzung
    der Bedingungen und der Höhe der Beihilfen für Weinbauerzeugnisse, die dem unter
    der Bezeichnung "Cyprus Sherry" ausgeführten Weinbauerzeugnis gleichartig sind
    und in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung erzeugt und nach
    Irland und dem Vereinigten Königreich ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1143/74 af 7. maj 1974 om fastsættelse
    af de nærmere bestemmelser for anvendelsen af samt størrelsen af støtte til
    vinprodukter, som svarer til vinprodukter, der udføres under betegnelsen »Cyprus
    Sherry«, og som er fremstillet inden for Fællesskabet i dets oprindelige udstrækning
    og afsendt til Irland og Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1143/74 della Commissione, del 7 maggio 1974, che
    fissa le modalità di applicazione e l'importo degli aiuti per i prodotti vinicoli
    simili al prodotto vinicolo esportato con la menzione «Cyprus Sherry», prodotti
    nella Comunità nella sua composizione originaria e spediti verso l'Irlanda e
    il Regno Unito
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1143/74 van de Commissie van 7 mei 1974 tot vaststelling
    van de uitvoeringsbepalingen en van het bedrag van de steun voor in de Gemeenschap
    in haar oorspronkelijke samenstelling geproduceerde en naar Ierland en het Verenigd
    Koninkrijk verzonden wijnbouwprodukten van dezelfde aard als het wijnbouwprodukt
    dat onder de naam "Cyprus sherry" wordt uitgevoerd
  type: main
