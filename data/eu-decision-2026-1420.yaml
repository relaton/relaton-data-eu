  content: Commission Implementing Decision (EU) 2026/1420 of 30 June 2026 on the
    non-approval of terbutryn, 1,2-Benzisothiazol-3(2H)-one (BIT) and tetrahydro-1,3,4,6-tetrakis(hydroxymethyl)imidazo[4,5-d]imidazole-2,5(1H,3H)-dione
