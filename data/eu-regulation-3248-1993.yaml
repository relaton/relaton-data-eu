title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3248/93 of 25 November 1993 laying down rates
    of compensatory interest applicable during the first half of 1994 to customs debts
    incurred in relation to compensating products or goods in the unaltered state
    (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3248/93 de la Commission du 25 novembre 1993 fixant
    les taux d'intérêts compensatoires applicables en cas de naissance d'une dette
    douanière relative aux produits compensateurs ou aux marchandises en l'état
    (régime du perfectionnement actif et de l'admission temporaire) pendant le premier
    semestre de 1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3248/93 DER KOMMISSION vom 25. November 1993 mit Sätzen
    von Ausgleichszinsen, die im ersten Halbjahr 1994 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3248/93 af 25. november 1993 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukterne eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i første halvår af 1994
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3248/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Νοεμβρίου 1993 για τον καθορισμό αντισταθμιστικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή αρχικά εμπορεύματα (καθεστώς τελειοποίησης
    προς επανεξαγωγή και προσωρινής εισαγωγής)
    κατά τη διάρκεια του πρώτου εξαμήνου 1994
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3248/93 DELLA COMMISSIONE del 25 novembre 1993 che
    determina i tassi di interesse compensatori applicabili ove sorga un' obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo e ammissione temporanea) nel primo semestre 1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3248/93 VAN DE COMMISSIE van 25 november 1993 tot
    vaststelling van de jaarlijkse interestpercentages van toepassing in geval van
    het ontstaan van een douaneschuld voor veredelingsprodukten of onveredelde goederen
    (regeling actieve veredeling en tijdelijke invoer) tijdens het eerste semester
    1994
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3248/93 DA COMISSÃO de 25 de Novembro de 1993 que
    fixa as taxas de juros de compensação aplicáveis aos casos de constituição
    de uma dívida aduaneira relativa a produtos compensadores ou a mercadorias no
    seu estado inalterado (regime do aperfeiçoamento activo e importação temporária),
    durante o primeiro semestre de 1994
  type: main
