---
id: EUDecision1978626
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 July 1978 authorizing Ireland to apply protective
    measures to trade within the Community in twine, cordage, ropes and cables, whether
    or not plaited, falling within heading No 59.04 of the Common Customs Tariff,
    originating in Portugal and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/626/CEE: Décision de la Commission, du 18 juillet 1978, autorisant
    l''Irlande à appliquer des mesures de protection concernant les échanges intracommunautaires
    de ficelles, cordes et cordages tressés ou non, de la position 59.04 du Tarif
    douanier commun, originaires du Portugal et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Juli 1978, mit der Irland ermächtigt
    wird, Schutzmaßnahmen im innergemeinschaftlichen Handel mit Bindfäden, Seilen
    und Tauen, auch geflochten, der Tarifnummer 59.04 des Gemeinsamen Zolltarifs,
    mit Ursprung in Portugal zu ergreifen, die in anderen Mitgliedstaaten zum freien
    Verkehr abgefertigt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 18. juli 1978 om bemyndigelse af Irland til
    at anvende beskyttelsesforanstaltninger vedrørende handelen inden for Fællesskabet
    med sejlgarn, reb og tovværk, også flettet, som henhører under pos. 59.04 i
    den fælles toldtarif, har oprindelse i Portugal og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 luglio 1978, che autorizza l'Irlanda
    ad applicare delle misure di protezione negli scambi intracomunitari di spago,
    corde e funi anche intrecciate della voce 59.04 della tariffa doganale comune,
    originari del Portogallo e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 juli 1978 waarbij Ierland wordt gemachtigd
    beschermende maatregelen te nemen voor wat betreft het intra-communautaire verkeer
    van bindgaren, touw en kabel, al dan niet gevlochten, van post 59.04 van het gemeenschappelijk
    douanetarief, van oorsprong uit Portugal en in de overige Lid-Staten in het vrije
    verkeer gebracht
  type: main
