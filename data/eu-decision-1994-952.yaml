title:
- language: en
  script: Latn
  content: '94/952/EC: Commission Decision of 20 December 1994 approving the 1995
    programmes for the eradication of anaplasmosis and babesiosis in Réunion and
    of cowdriosis and babesiosis in Guadeloupe and Martinique presented by France
    and fixing the Community financial contribution (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/952/CE: Décision de la Commission, du 20 décembre 1994, portant approbation
    des programmes d''éradication de l''anaplasmose et des babésioses à la Réunion
    et de la cowdriose et des babésioses en Guadeloupe et en Martinique pour l''année
    1995 présentés par la France et fixant le niveau de la participation financière
    de la Communauté (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/952/EG: Entscheidung der Kommission vom 20. Dezember 1994 zur Genehmigung
