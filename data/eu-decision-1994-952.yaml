    und der Babesiose auf La Réunion sowie der Cowdriose und der Babesiose auf Guadeloupe
    und Martinique sowie zur Festsetzung der finanziellen Beteiligung der Gemeinschaft
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/952/EF: Kommissionens beslutning af 20. december 1994 om godkendelse
