title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2581/70 du Conseil, du 17 décembre 1970, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de 34.000 tonnes de morues entières, décapitées ou tronçonnées, simplement
    salées ou en saumure, ou séchées, de la sous- position 03.02 à I b), et des
    filets de morues, de la sous-position 03.02 à II a) du tarif douanier commun
    (année 1971)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2581/70 des Rates vom 17. Dezember 1970 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents in Höhe
    von 34 000 Tonnen für Kabeljau, ganz, ohne Kopf oder zerteilt, nur gesalzen,
    in Salzlake oder getrocknet, der Tarifstellen 03.02 A I b), und für Filets vom
    Kabeljau der Tarifstelle 03.02 A II a) des Gemeinsamen Zolltarifs (1971)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2581/70 del Consiglio, del 17 dicembre 1970, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di 34.000 tonnellate di merluzzi interi, decapitati o in
    pezzi, semplicemente salati o in salamoia, o secchi, della sottovoce 03.02 A I
    b), e dei filetti di merluzzi, della sottovoce 03.02 A II a) della tariffa doganale
    comune (anno 1971)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2581/70 van de Raad van 17 december 1970 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    van 34.000 ton kabeljauw, ook indien ontdaan van kop of in moten gesneden, enkel
    gezouten, gepekeld of gedroogd, van onderverdeling 03.02 A I b) en van filets
    van kabeljauw van onderverdeling 03.02 A II a) van het gemeenschappelijk douanetarief
    (1971)
  type: main
