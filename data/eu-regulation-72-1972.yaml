    tangérines et autres hybrides similaires d'agrumes en provenance d'Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 72/72 der Kommission vom 12. Januar 1972 zur Einführung
    einer Ausgleichsabgabe auf die Einfuhr von Mandarinen, Satsumas, Clementinen,
    Tangerinen und anderen ähnlichen Kreuzungen von Zitrusfrüchten aus Algerien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 72/72 della Commissione, del 12 gennaio 1972, che
    istituisce una tassa di compensazione all'importazione di mandarini, satsuma,
    clementine, tangerini ed altri ibridi similari di agrumi in provenienza dall'Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 72/72 van de Commissie van 12 januari 1972 houdende
    instelling van een compenserende heffing bij invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten uit
    Algerië
