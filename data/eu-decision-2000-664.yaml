    «SISNET» για το περιβάλλον Σένγκεν'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 23. oktoober 2000, millega muudetakse otsust 2000/265/EÜ
    finantsmääruse kehtestamise kohta, millega reguleeritakse eelarveaspektide haldamist
    seoses nõukogu asepeasekretäri nimel teatavate liikmesriikide kasuks sõlmitud
    lepingutega Schengeni keskkonna side infrastruktuuri (Sisnet) paigaldamise ja
    toimimise kohta
  type: main
- language: fi
  script: Latn
