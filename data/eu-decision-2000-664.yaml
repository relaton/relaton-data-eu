id: EUDecision2000664
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2000/664/EC: Council Decision of 23 October 2000 amending Decision 2000/265/EC
    on the establishment of a financial regulation governing the budgetary aspects
    of the management by the Deputy Secretary-General of the Council of contracts
    concluded in his name, on behalf of certain Member States, relating to the installation
    and the functioning of the communication infrastructure for the Schengen environment,
    ''SISNET'''
  type: main
- language: fr
  script: Latn
  content: '2000/664/CE: Décision du Conseil du 23 octobre 2000 modifiant la décision
    2000/265/CE établissant un règlement financier régissant les aspects budgétaires
    de la gestion par le secrétaire général adjoint du Conseil des contrats conclus
    par celui-ci, en tant que représentant de certains États membres, concernant
    l''installation et le fonctionnement de l''infrastructure de communication pour
    l''environnement Schengen, dénommée «SISNET»'
  type: main
- language: de
  script: Latn
  content: '2000/664/EG: Beschluss des Rates vom 23. Oktober 2000 zur Änderung des
    Beschlusses 2000/265/EG zur Festlegung einer Finanzregelung für die Haushaltsaspekte
    der vom Stellvertretenden Generalsekretär des Rates zu verwaltenden Verträge
    über die Einrichtung und den Betrieb der Kommunikationsinfrastruktur für den
    Schengen-Rahmen ("Sisnet"), die von ihm als Vertreter bestimmter Mitgliedstaaten
    geschlossen worden sind'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 23 октомври 2000 година
    за изменение на Решение 2000/265/ЕО за създаване
    на финансов регламент, уреждащ бюджетните
    аспекти на управлението от страна на заместник
    генералния секретар на Съвета на договорите,
    сключени от него в качеството му на представител
    на някои държави-членки, във връзка с изграждането
    и функционирането на комуникационната инфраструктура
    за Шенгенското пространство „Сиснет“
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 23. října 2000, kterým se mění rozhodnutí
    2000/265/ES, kterým se stanoví finanční nařízení upravující rozpočtová
    hlediska správy prováděné náměstkem generálního tajemníka Rady pro smlouvy,
    které uzavírá v zastoupení některých členských států a které se týkají
    zřízení a fungování komunikační infrastruktury pro schengenské prostředí
    (Sisnet)
  type: main
- language: da
  script: Latn
  content: '2000/664/EF: Rådets afgørelse af 23. oktober 2000 om ændring af afgørelse
    2000/265/EF om en finansforordning vedrørende budgetaspekterne af Rådets vicegeneralsekretærs
    forvaltning af de kontrakter, som han indgår som repræsentant for visse medlemsstater
    om oprettelse og drift af kommunikationsinfrastrukturen i Schengen-sammenhæng,
    "Sisnet"'
  type: main
- language: el
  script: Grek
  content: '2000/664/ΕΚ: Απόφαση του Συμβουλίου, της 23ης
    Οκτωβρίου 2000, που τροποποιεί την απόφαση 2000/265/ΕΚ
    περί θεσπίσεως δημοσιονομικού κανονισμού
    για τα δημοσιονομικά θέματα της διαχείρισης
    από τον Αναπληρωτή Γενικό Γραμματέα του Συμβουλίου,
    των συμβάσεων τις οποίες συνάπτει ως αντιπρόσωπος
    ορισμένων κρατών μελών όσον αφορά την εγκατάσταση
