    strane zamjenika glavnog tajnika Vijeća, sklopljenih u ime određenih država
    članica u vezi s postavljanjem i funkcioniranjem komunikacijske infrastrukture
    za Schengensko okružje, „Sisnet”'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (2000. október 23.) a Sisnet elnevezésű kommunikációs
    infrastruktúrának a schengeni környezetben történő kiépítéséről és
    működtetéséről a Tanács főtitkárhelyettese által egyes tagállamok nevében
    kötött szerződéseknek a főtitkárhelyettes által történő igazgatására
    vonatkozó költségvetési szempontok pénzügyi szabályozásának megállapításáról
    szóló 2000/265/EK határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '2000/664/CE: Decisione del Consiglio, del 23 ottobre 2000, recante modifica
    della decisione 2000/265/CE, relativa ad un regolamento finanziario che disciplina
    gli aspetti di bilancio della gestione, da parte del segretario generale aggiunto
    del Consiglio, dei contratti dallo stesso stipulati in qualità di rappresentante
    di taluni Stati membri, relativi all''installazione e al funzionamento dell''infrastruttura
    delle comunicazioni nel contesto di Schengen, «SISNET»'
  type: main
- language: lv
  script: Latn
  content: Padomes lēmums (2000. gada 23. oktobris), ar kuru groza Lēmumu 2000/265/EK
    par finanšu regulas izveidi, ar ko nosaka budžeta aspektus attiecībā uz Padomes
    ģenerālsekretāra vietnieka vadību, līgumiem, ko viņš noslēdzis dažu dalībvalstu
    vārdā par komunikācijas infrastruktūras izveidi un darbību Šengenas videi
    SISNET
  type: main
- language: lt
  script: Latn
  content: 2000 m. spalio 23 d. Tarybos sprendimas, iš dalies keičiantis Sprendimą
    2000/265/EB dėl finansinio reglamento, reglamentuojančio Tarybos Generalinio
    Sekretoriaus pavaduotojo vardu tam tikrų valstybių narių naudai sudarytų sutarčių,
    susijusių su Šengeno aplinkai skirtos ryšių infrastruktūros Sisnet įrengimu
    ir veikimu, valdymo biudžetinius aspektus, nustatymo
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tat-23 ta' Ottubru 2000 li temenda d-Deċiżjoni
    2000/265/KE dwar l-istabbiliment ta' regolament finanzjarju li jirregola l-aspetti
    li għandhom x'jaqsmu ma’ l-estimi ta' l-amministrazzjoni mid-Deputat Segretarju-Ġenerali
    tal-Kunsill ta' kuntratti konklużi f'ismu, f'isem ċerti Stati Membri, relatati
    ma’ l-installazzjoni u funzjonament ta' infrastruttura ta' komunikazzjoni għall-ambjent
    ta' Schengen SISNET
  type: main
- language: nl
  script: Latn
