    „Sisnet”, infrastructura de comunicații în cadrul Schengen
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady z 23. októbra 2000, ktorým sa mení a dopĺňa rozhodnutie
    2000/265/ES o ustanovení rozpočtových pravidiel vzťahujúcich sa na rozpočtové
