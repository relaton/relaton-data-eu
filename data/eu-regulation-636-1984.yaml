title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 636/84 of 12 March 1984 re-establishing
    the levying of customs duties on ethanolamine, diethanolamine, triethanolamine,
    and their salts, falling within subheadings 29.23 A I and ex II and originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 636/84 de la Commission du 12 mars 1984 portant rétablissement
    de la perception des droits de douane applicables à l' éthanolamine, à la diéthanolamine,
    à la triéthanolamine, et leurs sels, des sous-positions 29.23 A I et ex II du
    tarif douanier commun, originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 636/84 der Kommission vom 12. März 1984 zur Wiedereinführung
    der Erhebung der Zölle für Äthanolamin, Diäthanolamin, Triäthanolamin und
    ihre Salze der Tarifstellen 29.23 A I und ex II mit Ursprung in Brasilien, dem
    die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 636/84 af 12. marts 1984 om genindførelse
    af opkrævning af told for ethanolamin, diethanolamin, triethanolamin samt salte
    deraf, henhørende under pos. 29.23 A I og ex II og med oprindelse i Brasilien,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
