  content: Kommissionens gennemførelsesforordning (EU) 2021/1911 af 27. oktober 2021
    om ændring af bilag II til gennemførelsesforordning (EU) 2021/620 for så vidt
    angår status som sygdomsfri for de selvstyrende regioner Galicien og Principado
    de Asturias i Spanien med hensyn til infektion med Mycobacterium tuberculosis-kompleks,
    om ændring af nævnte forordnings bilag VIII for så vidt angår status som sygdomsfri
    for den selvstyrende region Islas Baleares, provinserne Huelva og Sevilla og regionerne
    Azuaga, Badajoz, Mérida, Jerez de los Caballeros og Zafra i provinsen Badajoz
    i Spanien samt regionen Alentejo og distriktet Santarém i regionen Lisboa e Vale
    do Tejo i Portugal med hensyn til infektion med bluetonguevirus, om ændring af
    samme forordnings bilag IX for så vidt angår status som sygdomsfri for Åland
    i Finland med hensyn til infestering med Varroa spp. og om ændring af forordningens
    bilag XIII for så vidt angår status som sygdomsfri for Danmark og Finland med
    hensyn til infektiøs hæmatopoietisk nekrose
