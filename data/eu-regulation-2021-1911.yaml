    a Zafra v provincii Badajoz ve Španělsku a pro oblast Alentejo a distrikt Santarém
    v oblasti Lisboa e Vale do Tejo v Portugalsku, kterým se mění příloha IX
    uvedeného nařízení, pokud jde o status území prostého infestace roztočem
    Varroa spp. pro Alandy ve Finsku, a kterým se mění příloha XIII uvedeného
    nařízení, pokud jde o status území prostého infekční nekrózy krvetvorné
    tkáně pro Dánsko a Finsko
