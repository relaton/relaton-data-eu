    Galiza e da Comunidade Autónoma do Principado das Astúrias, em Espanha, relativamente
    à infeção pelo complexo Mycobacterium tuberculosis, que altera o anexo VIII
    do mesmo regulamento no que diz respeito ao estatuto de indemnidade de doença
    da Comunidade Autónoma das Ilhas Baleares, das províncias de Huelva e Sevilha,
    e das regiões de Azuaga, Badajoz, Mérida, Jerez de los Caballeros e Zafra na
    província de Badajoz, em Espanha, e da região do Alentejo e do distrito de Santarém
    na região de Lisboa e Vale do Tejo, em Portugal, relativamente à infeção pelo
    vírus da febre catarral ovina, que altera o anexo IX do mesmo regulamento no
    que diz respeito ao estatuto de indemnidade de doença de Alanda, na Finlândia,
    relativamente à infestação por Varroa spp. e que altera o anexo XIII do mesmo
    regulamento no que diz respeito ao estatuto de indemnidade de doença da Dinamarca
    e da Finlândia relativamente à necrose hematopoiética infeciosa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/1911 al Comisiei din 27 octombrie
    2021 de modificare a anexei II la Regulamentul de punere în aplicare (UE) 2021/620
    în ceea ce privește statutul de indemn de infecția cu complexul Mycobacterium
    tuberculosis al Comunității Autonome Galicia și al Comunității Autonome Principado
    de Asturias din Spania, de modificare a anexei VIII la regulamentul respectiv
    în ceea ce privește statutul de indemn de infecția cu virusul bolii limbii
    albastre al Comunității Autonome Islas Baleares, al provinciilor Huelva și
    Sevilla și al regiunilor Azuaga, Badajoz, Mérida, Jerez de los Caballeros și
    Zafra din provincia Badajoz din Spania, precum și al regiunii Alentejo și al
    districtului Santarém din regiunea Lisboa e Vale do Tejo din Portugalia, de modificare
    a anexei IX la regulamentul respectiv în ceea ce privește statutul de indemn
    de infestare cu Varroa spp. al Insulelor Åland din Finlanda și de modificare
    a anexei XIII la regulamentul respectiv în ceea ce privește statutul de indemn
    de necroza hematopoietică infecțioasă al Danemarcei și Finlandei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1911 z 27. októbra 2021, ktorým
    sa mení príloha II k vykonávaciemu nariadeniu (EÚ) 2021/620, pokiaľ ide o
    štatút bez výskytu infekcie baktériami skupiny Mycobacterium tuberculosis
    complex v autonómnej oblasti Galícia a v autonómnej oblasti Astúrske kniežatstvo
    v Španielsku, ktorým sa mení príloha VIII k uvedenému nariadeniu, pokiaľ
    ide o štatút bez výskytu infekcie vírusom katarálnej horúčky oviec v autonómnej
    oblasti Baleárske ostrovy, provinciách Huelva a Sevilla a regiónoch Azuaga,
    Badajoz, Mérida, Jerez de los Caballeros a Zafra v provincii Badajoz v Španielsku
    a v regióne Alentejo a okrese Santarém v regióne Lisboa e Vale do Tejo v Portugalsku,
    ktorým sa mení príloha IX k uvedenému nariadeniu, pokiaľ ide o štatút bez
    zamorenia parazitom Varroa spp. Na Alandách vo Fínsku, a ktorým sa mení príloha
    XIII k uvedenému nariadeniu, pokiaľ ide o štatút bez výskytu infekčnej hematopoetickej
    nekrózy v Dánsku a vo Fínsku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/1911 z dne 27. oktobra 2021 o spremembi
    Priloge II k Izvedbeni uredbi (EU) 2021/620 glede statusa prost okužbe s kompleksom
    Mycobacterium tuberculosis v avtonomni skupnosti Galicija in avtonomni skupnosti
    Asturija v Španiji, o spremembi Priloge VIII k Uredbi glede statusa prost okužbe
    z virusom modrikastega jezika v avtonomni skupnosti Balearski otoki, pokrajinah
    Huelva in Sevilla ter regijah Azuaga, Badajoz, Mérida, Jerez de los Caballeros
    in Zafra v pokrajini Badajoz v Španiji ter regiji Alentejo in okrožju Santarém
    v regiji Lisboa e Vale do Tejo na Portugalskem, o spremembi Priloge IX k Uredbi
    glede statusa prost infestacije z Varroa spp. na Ålandskih otokih na Finskem
    ter spremembi Priloge XIII k Uredbi glede statusa prost infekciozne hematopoetske
    nekroze na Danskem in Finskem
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1911 de la Comisión de 27 de octubre
    de 2021 que modifica el anexo II del Reglamento de Ejecución (UE) 2021/620 en
    lo relativo al estatus de libre de enfermedad de las Comunidades Autónomas de
    Galicia y Principado de Asturias, en España, con respecto a la infección por
    el complejo Mycobacterium tuberculosis; que modifica su anexo VIII en lo relativo
    al estatus de libre de enfermedad de la Comunidad Autónoma de Illes Balears,
    las provincias de Huelva y Sevilla y las regiones de Azuaga, Badajoz, Jerez de
    los Caballeros, Mérida y Zafra, en la provincia de Badajoz, en España, así
    como la región de Alentejo y el distrito de Santarém, en la región de Lisboa
    e Vale do Tejo, en Portugal, con respecto a la infección por el virus de la lengua
    azul; que modifica su anexo IX en lo relativo al estatus de libre de enfermedad
    de Aland, en Finlandia, con respecto a la infestación por Varroa spp., y que
    modifica su anexo XIII en lo relativo al estatus de libre de enfermedad de Dinamarca
    y Finlandia con respecto a la necrosis hematopoyética infecciosa
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1911 av den 27 oktober
    2021 om ändring av bilaga II till genomförandeförordning (EU) 2021/620 vad
    gäller sjukdomsfri status för de autonoma regionerna Galicien och Principado
    de Asturias i Spanien med avseende på infektion med Mycobacterium tuberculosis-komplexet,
    om ändring av bilaga VIII till samma genomförandeförordning vad gäller sjukdomsfri
    status för den autonoma regionen Islas Baleares, provinserna Huelva och Sevilla
    och regionerna Azuaga, Badajoz, Mérida, Jerez de los Caballeros och Zafra i provinsen
    Badajoz i Spanien samt regionen Alentejo och distriktet Santarém i regionen Lisboa
    e Vale do Tejo i Portugal med avseende på infektion med blåtungevirus, om ändring
    av bilaga IX till samma genomförandeförordning vad gäller sjukdomsfri status
    för Åland i Finland med avseende på angrepp av Varroa spp. och om ändring
    av bilaga XIII till samma genomförandeförordning vad gäller sjukdomsfri status
    för Danmark och Finland med avseende på infektion med infektiös hematopoietisk
    nekros
