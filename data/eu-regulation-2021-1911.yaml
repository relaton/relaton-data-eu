  content: Commission Implementing Regulation (EU) 2021/1911 of 27 October 2021 amending
    Annex II to Implementing Regulation (EU) 2021/620 as regards the disease-free
    status of the Autonomous Community of Galicia and the Autonomous Community of
    Principado de Asturias in Spain from infection with Mycobacterium tuberculosis
    complex, amending Annex VIII thereto as regards the disease-free status of Autonomous
    Community of Islas Baleares, Huelva and Sevilla provinces and the regions of Azuaga,
    Badajoz, Mérida, Jerez de los Caballeros and Zafra in Badajoz province in Spain
    and Alentejo region and Santarém district in Lisboa e Vale do Tejo region in
    Portugal from infection with bluetongue virus, amending Annex IX thereto as regards
    the disease-free status of the Åland islands in Finland from infestation with
    Varroa spp and amending Annex XIII thereto as regards the disease-free status
    of Denmark and Finland regarding Infectious haematopoietic necrosis
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1911 de la Commission du 27 octobre
    2021 modifiant l’annexe II du règlement d’exécution (UE) 2021/620 en ce
    qui concerne le statut «indemne de maladie» de la Communauté autonome de Galice
    et de la Communauté autonome de la Principauté des Asturies en Espagne au regard
    de l’infection par le complexe Mycobacterium tuberculosis, modifiant l’annexe
    VIII dudit règlement en ce qui concerne le statut «indemne de maladie» de la
    Communauté autonome des Baléares, des provinces de Huelva et de Séville et
    des régions d’Azuaga, Badajoz, Mérida, Jerez de los Caballeros et Zafra dans
    la province de Badajoz en Espagne, et de la région de l’Alentejo et du district
    de Santarém dans la région de Lisboa e Vale do Tejo au Portugal au regard de
    l’infection par le virus de la fièvre catarrhale ovine, modifiant l’annexe
    IX dudit règlement en ce qui concerne le statut «indemne de maladie» des îles
    Åland en Finlande au regard de l’infestation à Varroa spp., et modifiant l’annexe
    XIII dudit règlement en ce qui concerne le statut «indemne de maladie» du Danemark
    et de la Finlande au regard de la nécrose hématopoïétique infectieuse
