  content: Komisijos įgyvendinimo reglamentas (ES) 2021/1911 2021 m. spalio 27 d.
    kuriuo dėl Mycobacterium tuberculosis komplekso infekcija neužkrėstos teritorijos
    statuso suteikimo Ispanijos Galisijos autonominei sričiai ir Astūrijos autonominei
    sričiai iš dalies keičiamas Įgyvendinimo reglamento (ES) 2021/620 II priedas,
    dėl mėlynojo liežuvio virusu neužkrėstos teritorijos statuso suteikimo Ispanijos
    Balearų saloms, Huelvos ir Sevilijos provincijoms ir Asuagos, Badachoso, Meridos,
    Cheres de los Kabaljeroso ir Safros regionams Badachoso provincijoje, Portugalijos
    Alentežo regionui ir Santareno rajonui Lisabonos ir Težo Slėnio regione iš
    dalies keičiamas jo VIII priedas, dėl varoze (Varoa spp.) neužkrėstos teritorijos
    statuso suteikimo Suomijos Alandų saloms iš dalies keičiamas jo IX priedas
    ir dėl infekcine hematopoetine nekroze neužkrėstos teritorijos statuso suteikimo
    Danijai ir Suomijai iš dalies keičiamas jo XIII priedas
