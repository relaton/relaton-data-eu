  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1911 tas-27
    ta’ Ottubru 2021 li jemenda l-Anness II tar-Regolament ta’ Implimentazzjoni
    (UE) 2021/620 fir-rigward tal-istatus ta’ ħieles mill-mard tal-Komunità Awtonoma
    ta’ Galicia u l-Komunità Awtonoma ta’ Principado de Asturias fi Spanja mill-infezzjoni
    bil-kumpless tal-Mycobacterium tuberculosis, li jemenda l-Anness VIII tiegħu
    fir-rigward tal-istatus ta’ ħieles mill-mard tal-Komunità Awtonoma ta’ Islas
    Baleares, il-provinċji ta’ Huelva u Sevilla u r-reġjuni ta’ Azuaga, Badajoz,
    Mérida, Jerez de los Caballeros u Zafra fil-provinċja ta’ Badajoz fi Spanja
    u r-reġjun ta’ Alentejo u d-distrett ta’ Santarém fir-reġjun ta’ Lisboa
    e Vale do Tejo fil-Portugall mill-infezzjoni bil-virus tal-ilsien blu, li jemenda
    l-Anness IX tiegħu fir-rigward tal-istatus ta’ ħieles mill-mard tal-gżejjer
    Åland fil-Finlandja mill-infestazzjoni bil-Varroa spp u li jemenda l-Anness XIII
    tiegħu fir-rigward tal-istatus ta’ ħieles mill-mard tad-Danimarka u tal-Finlandja
    fir-rigward tan-nekrożi ematopojetika infettiva
