title:
- language: en
  script: Latn
  content: '81/949/EEC: Commission Decision of 11 November 1981 establishing that
    the whole apparatus described as ''IPM RBC velocity tracking correlator, model
    102; video photometric analyzer model 204; video time code generator model 710''
    and ''COHU self-contained TV camera, model 4410'' may be imported free of Common
    Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/949/CEE: Décision de la Commission, du 11 novembre 1981, constatant
    que l''importation de l''ensemble constitué des appareils dénommés "IPM - RBC
    velocity tracking correlator, model 102; Video photometric analyzer, model 204;
    Video time code generator, model 710" et "COHU - self-contained TV camera, model
    4410" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/949/EWG: Entscheidung der Kommission vom 11. November 1981, mit der
    festgestellt wird, daß die Geräteeinheit ,,I.P.M. - RBC Velocity Tracking Correlator,
    model 102; Ü Video Photometric Analyzer, model 204; Ü Video Time Code Generator,
    model 710" und ,,COHU - Self - Contained TV Camera, model 4410" unter Befreiung
    von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '81/949/EØF: Kommissionens beslutning af 11. november 1981 om fastslåelse
    af, at indførsel af udstyr bestående af apparaterne "I.P.M. - RBC Velocity Tracking
    Correlator, model 102; - Video Photometric Analyzer, model 204; - Video Time Code
    Generator, model 710" og "COHU-Self-Contained TV Camera, model 4410" kan ske med
    fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/949/EOK: Απόφαση τής Επιτροπής τής 11ης Νοεμβρίου
    1981 περί διαπιστώσεως ότι η εισαγωγή τού συνόλου
    πού αποτελείται από τίς συσκευές μέ τίς ονομασίες
    «IPM-RBC velocity tracking correlator, model 102. video photometric analyzer,
    model 204. video time code generator, model 710» καί «COHU self-contained
    TV camera, model 4410» δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/949/CEE: Decisione della Commissione, dell''11 novembre 1981, che stabilisce
    che l''importazione dell''insieme costituito dagli apparecchi denominati "IPM
    - RBC Velocity Tracking Correlator, model 102; Video Photometric Analyzer, model
    204; Video Time Code Generator, model 710" e "COHU-Self-Contained TV Camera, model
    4410" può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/949/EEG: Beschikking van de Commissie van 11 november 1981 waarbij
    wordt vastgesteld dat het geheel bestaande uit de apparaten ,,IPM-RBC Velocity
    Tracking Correlator, model 102, Video Photometric Analyzer, model 204, Video Time
    Code Generator, model 710" en ,,Cohu-Self-Contained TV Camera, model 4410" met
    vrijstelling van de rechten van het gemeenschappelijk douanetarief mag worden
    ingevoerd'
  type: main
