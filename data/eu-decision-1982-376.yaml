title:
- language: en
  script: Latn
  content: '82/376/EEC: Commission Decision of 19 May 1982 establishing that the apparatus
    described as ''Perkin- Elmer - Liquid Chromatograph, model Series 2/2 with Spectrophotometric
    Detector, model LC-85 and accessories'' may not be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/376/CEE: Décision de la Commission, du 19 mai 1982, constatant que
    l''importation de l''appareil dénommé "Perkin Elmer - Liquid Chromatograph,
    model Series 2/2 with spectrophotometric Detector, model LC-85 and accessories"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/376/EWG: Entscheidung der Kommission vom 19. Mai 1982, mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer-Liquid Chromatograph, model Series 2/2 with
    Spectrophotometric Detector, model LC-85 and accessories" nicht unter Befreiung
    von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kan'
  type: main
- language: da
  script: Latn
  content: '82/376/EØF: Kommissionens beslutning af 19. maj 1982 om fastslåelse
    af, at indførsel af apparatet "Perkin-Elmer - Liquid Chromatograph, model Series
    2/2 with Spectrophotometric Detector, model LC-85 and accessories" ikke kan ske
    med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/376/EOK: Απόφαση τής Επιτροπής τής 19ης Μαΐου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Perkin-Elmer — Liquid Chromatograph, model Series
    2/2 with Spectrophotometric Detector, model LC-85 and accessories» δέν δύναται
    νά πραγματοποιηθεί ατελώς ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/376/CEE: Decisione della Commissione, del 19 maggio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Perkin Elmer - Liquid Chromatograph,
    model Series 2/2 with spectrophotometric Detector, model LC-85 and accessories"
    non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/376/EEG: Beschikking van de Commissie van 19 mei 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Perkin Elmer-Liquid Chromatograph, model
    Series 2/2 with spectrophotometric Detector, model LC-85 and accessories" niet
    met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag worden
    ingevoerd'
  type: main
