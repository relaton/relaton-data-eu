  script: Latn
  content: Commission Delegated Regulation (EU) 2023/363 of 31 October 2022 amending
    and correcting the regulatory technical standards laid down in Delegated Regulation
    (EU) 2022/1288 as regards the content and presentation of information in relation
    to disclosures in pre-contractual documents and periodic reports for financial
    products investing in environmentally sustainable economic activities
  type: main
- language: fr
