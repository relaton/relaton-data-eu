title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3636/85 of 17 December 1985 amending Regulation
    (EEC) No 219/84 instituting a specific Community regional development measure
    contributing to overcoming constraints on the development of new economic activities
    in certain zones adversely affected by restructuring of the textile and clothing
    industry
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3636/85 du Conseil du 17 décembre 1985 modifiant
    le règlement (CEE) n° 219/84 instituant une action communautaire spécifique
    de développement régional contribuant à l'élimination des obstacles au développement
    de nouvelles activités économiques dans certaines zones affectées par la restructuration
    de l'industrie du textile et de l'habillement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3636/85 des Rates vom 17. Dezember 1985 zur Änderung
    der Verordnung (EWG) Nr. 219/84 zur Einführung einer spezifischen Gemeinschaftsmaßnahme
    zur regionalen Entwicklung im Hinblick auf die Beseitigung von Entwicklungshemmnissen
    für neue Wirtschaftszweige in bestimmten von der Umstrukturierung der Textil-
    und Bekleidungsindustrie betroffenen Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3636/85 af 17. december 1985 om ændring
    af forordning (EØF) nr. 219/84 om gennemførelse af en særlig fællesskabsaktion
    med henblik på regionaludvikling, der skal bidrage til at fjerne hindringerne
    for udviklingen af nye økonomiske aktiviteter i visse områder, der er berørt
    af strukturomlægningen i tekstil- og beklædningsindustrien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3636/85 του Συμβουλίου
    της 17ης Δεκεμβρίου 1985 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 219/84 περί ανάληψης ειδικής
    κοινοτικής ενέργειας περιφερειακής ανάπτυξης
    για τη συμβολή στην εξάλειψη των εμποδίων στην
    ανάπτυξη νέων οικονομικών δραστηριοτήτων
    σε ορισμένες ζώνες που θίγονται από την αναδιάρθρωση
    της υφαντουργίας και της βιομηχανίας ενδυμάτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3636/85 del Consiglio del 17 dicembre 1985 recante
    modifica del regolamento (CEE) n. 219/84 che istituisce un'azione comunitaria
    specifica di sviluppo regionale per contribuire ad eliminare gli ostacoli allo
    sviluppo di nuove attività economiche in talune zone colpite dalla ristrutturazione
    dell'industria tessile e dell'abbigliamento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) Nr. 3636/85 van de Raad van 17 december 1985 tot wijziging
    van Verordening (EEG) Nr. 219/84 tot instelling van een specifieke communautaire
    actie voor regionale ontwikkeling om bij te dragen tot de uitschakeling van de
    hinderpalen voor de ontwikkeling van nieuwe economische activiteiten in sommige
    door de herstructurering van de textiel- en kledingindustrie getroffen zones
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3636/85 do Conselho, de 17 de Dezembro de 1985, que
    altera o Regulamento (CEE) nº 219/84 que institui uma acção comunitária específica
    de desenvolvimento regional para contribuir para a eliminação dos obstáculos
    ao desenvolvimento de novas actividades económicas em certas zonas afectadas
    pela reestruturação da indústria têxtil e do vestuário
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3636/85 del Consejo, de 17 de diciembre de 1985, por
    el que se modifica el Reglamento (CEE) n° 219/84 que establece una acción comunitaria
    específica de desarrollo regional que contribuya a la supresión de los obstáculos
    al desarrollo de nuevas actividades económicas en determinadas zonas afectadas
    por la reestructuración de la industria textil y de la confección.
  type: main
