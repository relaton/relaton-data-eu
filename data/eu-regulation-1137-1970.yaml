title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1137/70 of the Commission of 17 June 1970 supplementing
    Regulation (EEC) No 822/70 on a standing invitation to tender for the sale of
    white sugar intended for animal feed and closing the invitation to tender for
    the export of white sugar opened by Regulation (EEC) No 923/70
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1137/70 de la Commission, du 17 juin 1970, complétant
    le règlement (CEE) n° 822/70 relatif à une adjudication permanente de sucre
    blanc destiné à l' alimentation animale et clôturant l' adjudication en matière
    d' exportation de sucre blanc ouverte par le règlement (CEE) n° 923/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1137/70 der Kommission vom 17. Juni 1970 zur Ergänzung
    der Verordnung (EWG) Nr. 822/70 über eine Ausschreibung von zur Tierfütterung
    bestimmtem Weißzucker und zur Beendigung der durch die Verordnung (EWG) Nr. 923/70
    eröffneten Ausschreibung für die Ausfuhr von Weißzucker
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1137/70 af 17. juni 1970 om tillæg
    til forordning (EØF) nr. 882/70 vedrørende fortløbende licitation med henblik
    på salg af hvidt sukker, bestemt til dyrefoder, og om afslutning af den med henblik
    på udførsel af hvidt sukker ved forordning (EØF) nr. 923/70 åbnede licitation
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1137/70 della Commissione, del 17 giugno 1970, che
    completa il regolamento(CEE) n. 822/70 relativo ad una gara di zucchero bianco
    destinato all' alimentazione animale e che chiude la gara in materia d' esportazione
    di zucchero bianco aperta dal regolamento (CEE) n. 923/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1137/70 van de Commissie van 17 juni 1970 houdende
    aanvulling van Verordening (EEG) nr. 822/70 betreffende een permanente inschrijving
    voor de verkoop van witte suiker welke bestemd is voor veevoeder en houdende afsluiting
    van de bij Verordening (EEG) nr. 923/70 opengestelde openbare inschrijving voor
    de uitvoer van witte suiker
  type: main
