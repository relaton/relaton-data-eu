  content: Règlement (CEE) n° 1745/68 de la Commission, du 31 octobre 1968, modifiant
    le règlement n° 173/66/CEE en ce qui concerne la détermination du prix CAF
    et du prix franco frontière des huiles d'olive n'ayant pas subi un processus
    de raffinage
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1745/68 der Kommission vom 31. Oktober 1968 zur Änderung
    der Verordnung Nr. 173/66/EWG, soweit sie die Bestimmung des cif-Preises und des
    Frei- Grenze-Preises für nicht raffiniertes Olivenöl betrifft
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1745/68 della Commissione, del 31 ottobre 1968, che
    modifica il regolamento n. 173/66/CEE che determina il prezzo cif e il prezzo
    franco frontiera degli oli d'oliva che non hanno subito un processo di raffinazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1745/68 van de Commissie van 31 oktober 1968 houdende
    wijziging van Verordening nr. 173/66/EEG met betrekking tot de vaststelling van
    de c.i.f.-prijs en de prijs franco-grens van olijfolie welke niet aan een raffinageproces
    onderworpen is geweest
  type: main
