title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 512/2009 of 16 June 2009 initiating a new
    exporter review of Council Regulation (EC) No 1905/2003 imposing a definitive
    anti-dumping duty on imports of furfuryl alcohol originating in the People’s
    Republic of China, repealing the duty with regard to imports from one exporter
    in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 512/2009 de la Commission du 16 juin 2009 portant ouverture
    d’un réexamen au titre de nouvel exportateur du règlement (CE) n o 1905/2003
    du Conseil instituant un droit antidumping définitif sur les importations d’alcool
    furfurylique originaire de la République populaire de Chine, abrogeant le droit
    en ce qui concerne le produit d’un exportateur de ce pays et soumettant les
    importations de ce produit à enregistrement
  type: main
