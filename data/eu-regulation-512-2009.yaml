  type: main
- language: hu
  script: Latn
  content: A Bizottság 512/2009/EK rendelete ( 2009. június 16. ) a Kínai Népköztársaságból
    származó furfurilalkohol behozatalára végleges dömpingellenes vám kivetéséről
    és a kivetett ideiglenes vám végleges beszedéséről szóló 1905/2003/EK
    tanácsi rendelet új exportőrre vonatkozó felülvizsgálatának megindításáról,
    az ezen ország egyik exportőrétől származó behozatalra vonatkozó vám eltörléséről,
    valamint az e behozatalra vonatkozó nyilvántartásba vételi kötelezettségről
  type: main
