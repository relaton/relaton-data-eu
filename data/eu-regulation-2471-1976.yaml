  content: Commission Regulation (EEC) No 2471/76 of 11 October 1976 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Algeria, Morocco and Tunisia must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2471/76 de la Commission, du 11 octobre 1976, fixant
