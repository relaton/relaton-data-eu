    kráľovstva Veľkej Británie a Severného Írska a niektorých z jeho závislých
    území Britskej koruny do zoznamov tretích krajín a území, z ktorých sa
    povoľuje dovoz lastúrnikov, ostnatokožcov, plášťovcov, morských ulitníkov
    a produktov rybolovu na ľudskú spotrebu do Únie [oznámené pod číslom C(2019)
