    Regatului Unit al Marii Britanii și Irlandei de Nord și a anumitor teritorii
    dependente ale Coroanei Britanice în listele țărilor terțe și teritoriilor
    autorizate să introducă în Uniune moluște bivalve, echinoderme, tunicieri,
    gasteropode marine și produse pescărești pentru consumul uman [notificată
    cu numărul C(2019) 2834]
  type: main
