    van het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland en sommige
    van zijn van de Kroon afhankelijke gebieden in de lijsten van derde landen en
    gebieden waaruit tweekleppige weekdieren, stekelhuidigen, manteldieren, mariene
