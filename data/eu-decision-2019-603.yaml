---
id: EUDecision2019603
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/603 of 11 April 2019 amending
    the Annexes to Decision 2006/766/EC as regards the inclusion of the United Kingdom
    of Great Britain and Northern Ireland and certain of its Crown Dependencies in
    the lists of third countries and territories authorised for the introduction into
    the Union of bivalve molluscs, echinoderms, tunicates, marine gastropods and fishery
    products for human consumption (notified under document C(2019) 2834)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/603 de la Commission du 11 avril 2019
    modifiant les annexes de la décision 2006/766/CE en ce qui concerne l'inscription
    du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord et de certaines dépendances
    de la Couronne sur les listes des pays tiers et territoires en provenance desquels
    l'introduction dans l'Union de mollusques bivalves, d'échinodermes, de tuniciers,
    de gastéropodes marins et de produits de la pêche destinés à l'alimentation
    humaine est autorisée [notifiée sous le numéro C(2019) 2834]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/603 der Kommission vom 11. April 2019
    zur Änderung der Anhänge der Entscheidung 2006/766/EG im Hinblick auf die Aufnahme
    des Vereinigten Königreichs Großbritannien und Nordirland und mancher seiner
    unmittelbar der englischen Krone unterstehenden Gebiete in die Listen der Drittländer
    und Drittlandsgebiete, aus denen die Einfuhr von zum menschlichen Verzehr bestimmten
    Muscheln, Stachelhäutern, Manteltieren, Meeresschnecken und Fischereierzeugnissen
    in die Union zulässig ist (Bekannt gegeben unter Aktenzeichen C(2019) 2834)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/603 на Комисията
    от 11 април 2019 година за изменение на приложенията
    към Решение 2006/766/ЕО по отношение на включването
    на Обединеното кралство Великобритания и Северна
    Ирландия и на някои от териториите, зависими
    от Британската корона, в списъка на третите
    държави и територии, от които е разрешено въвеждането
    в Съюза на двучерупчести мекотели, бодлокожи,
    ципести, морски коремоноги и рибни продукти
    за консумация от човека (нотифицирано под номер
    С(2019) 2834)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/603 ze dne 11. dubna 2019, kterým
    se mění přílohy rozhodnutí 2006/766/ES, pokud jde o zahrnutí Spojeného
    království Velké Británie a Severního Irska a určitých jeho závislých
    území do seznamů třetích zemí a území, ze kterých je povolen vstup mlžů,
    ostnokožců, pláštěnců, mořských plžů a produktů rybolovu určených
    k lidské spotřebě na území Unie (oznámeno pod číslem C(2019) 2834)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/603 af 11. april 2019
    om ændring af bilagene til beslutning 2006/766/EF for så vidt angår opførelse
    af Det Forenede Kongerige Storbritannien og Nordirland og visse af dets kronbesiddelser
    på listerne over tredjelande og områder, som er godkendt med hensyn til indførsel
    i Unionen af toskallede bløddyr, pighuder, sækdyr, havsnegle og fiskevarer (meddelt
    under nummer C(2019) 2834)
  type: main
- language: el
