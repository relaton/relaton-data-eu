    Królestwa Wielkiej Brytanii i Irlandii Północnej oraz niektórych terytoriów
    zależnych Korony Brytyjskiej do wykazów państw trzecich i terytoriów, z których
    dozwolone jest wprowadzanie do Unii małży, szkarłupni, osłonic, ślimaków
    morskich i produktów rybołówstwa przeznaczonych do spożycia przez ludzi (notyfikowana
