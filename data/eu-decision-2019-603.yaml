    Egyesült Királyságának és egyes koronafüggőségeinek a kéthéjú kagylók,
    tüskésbőrűek, zsákállatok, tengeri haslábúak és halászati termékek
    Unióba történő behozatalára engedéllyel rendelkező harmadik országok és
    területek jegyzékébe való felvétele tekintetében történő módosításáról
    (az értesítés a C(2019) 2834. számú dokumentummal történt)
  type: main
