    ir tam tikrų jos Karūnos priklausinių įtraukimo į trečiųjų šalių ir
    teritorijų, iš kurių leidžiama į Sąjungą įvežti žmonėms vartoti skirtus
    dvigeldžius moliuskus, dygiaodžius, gaubtagyvius, jūrų pilvakojus ir žuvininkystės
    produktus, sąrašus iš dalies keičiami Sprendimo 2006/766/EB priedai (pranešta
    dokumentu Nr. C(2019) 2834)
  type: main
