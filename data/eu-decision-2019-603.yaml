    l'inclusione del Regno Unito di Gran Bretagna e Irlanda del Nord e di alcune dipendenze
    della Corona negli elenchi dei paesi terzi e territori autorizzati a introdurre
    nell'Unione molluschi bivalvi, echinodermi, tunicati, gasteropodi marini e prodotti
    della pesca destinati al consumo umano [notificata con il numero C(2019) 2834]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/603 (2019. gada 11. aprīlis),
    ar ko attiecībā uz Lielbritānijas un Ziemeļīrijas Apvienotās Karalistes
    un noteiktu tās atkarīgo teritoriju iekļaušanu to trešo valstu un teritoriju
    sarakstos, no kurām Savienībā atļauts ievest lietošanai pārtikā paredzētas
    gliemenes, adatādaiņus, tunikātus, jūras gliemežus un zvejniecības produktus,
    groza Lēmuma 2006/766/EK pielikumus (izziņots ar dokumenta numuru C(2019) 2834)
  type: main
- language: lt
  script: Latn
