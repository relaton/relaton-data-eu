    ja Pohjois-Irlannin yhdistyneen kuningaskunnan ja tiettyjen sen kruunun alaisuuteen
    kuuluvien alueiden sisällyttämiseksi sellaisten kolmansien maiden ja niiden
    alueiden luetteloon, joista simpukoiden, piikkinahkaisten, vaippaeläinten, merikotiloiden
    ja ihmisravinnoksi tarkoitettujen kalastustuotteiden tuonti unioniin on sallittu
    (tiedoksiannettu numerolla C(2019) 2834)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/603 оd 11. travnja 2019. o izmjeni
    prilogâ Odluci 2006/766/EZ u pogledu uvrštenja Ujedinjene Kraljevine Velike
    Britanije i Sjeverne Irske i nekih njezinih krunskih posjeda na popise trećih
    zemalja i državnih područja iz kojih je odobreno unošenje školjkaša, bodljikaša,
    plaštenjaka, morskih puževa i proizvoda ribarstva za prehranu ljudi u Uniju
    (priopćeno pod brojem dokumenta C(2019) 2834)
  type: main
