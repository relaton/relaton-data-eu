  content: Commission Regulation (EEC) No 1599/89 of 8 June 1989 re-establishing the
    levying of customs duties on men's or boys'knitted or crocheted suits and ensembles
    products of category No 75 (order No 40.0750) originating in Brazil to which the
    preferential tariff arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1599/89 de la Commission du 8 juin 1989 portant rétablissement
    de la perception des droits de douane applicables aux costumes, complets et ensembles
    en bonneterie pour hommes et garçonnets de la catégorie de produits n° 75 (numéro
    d'ordre 40.0750), originaires du Brésil, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
