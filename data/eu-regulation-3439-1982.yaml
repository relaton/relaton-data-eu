title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3439/82 of 14 December 1982 amending Regulation
    (EEC) No 974/71 on certain measures of conjunctural policy to be taken in agriculture
    following the temporary widening of the margins of fluctuation for the currencies
    of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3439/82 du Conseil, du 14 décembre 1982, modifiant
    le règlement (CEE) n° 974/71 relatif à certaines mesures de politique de conjoncture
    à prendre dans le secteur agricole à la suite de l' élargissement temporaire
    des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3439/82 des Rates vom 14. Dezember 1982 zur Änderung
    der Verordnung (EWG) Nr. 974/71 über bestimmte konjunkturpolitische Maßnahmen,
    die in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der
    Bandbreiten der Währungen einiger Mitgliedstaaten zu treffen sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3439/82 af 14. december 1982 om ændring
    af forordning (EØF) nr. 974/71 om visse konjunkturpolitiske foranstaltninger,
    der skal træffes inden for landbrugssektoren som følge af den midlertidige udvidelse
    af grænserne for kursudsving i visse medlemsstaters valutaer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3439/82 τού Συμβουλίου
    τής 14ης Δεκεμβρίου 1982 περί τροποποιήσεως τού
    κανονισμού (EOK) αριθ. 974/71 περί ορισμένων μέτρων
    συγκυριακής πολιτικής πού πρέπει νά ληφθούν
    στό γεωργικό τομέα σάν συνέπεια τής προσωρινής
    διευρύνσεως τών περιθωρίων διακυμάνσεως τών
    νομισμάτων ορισμένων Κρατών μελών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3439/82 del Consiglio, del 14 dicembre 1982, che modifica
    il regolamento (CEE) n. 974/71 relativo a talune misure di politica congiunturale
    da adottare nel settore agricolo in seguito all' ampliamento temporaneo dei margini
    di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3439/82 van de Raad van 14 december 1982 tot wijziging
    van Verordening (EEG) nr. 974/71 betreffende bepaalde conjunctuurpolitieke maatregelen
    welke naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges van
    de valuta' s van sommige Lid-Staten dienen te worden genomen in de landbouwsectorp
