  content: Règlement n° 23/64/CEE du Conseil, du 4 mars 1964, portant fixation du
    montant des prélèvements envers les pays tiers pour le porc et les produits
    à base de viande de porc, en ce qui concerne les importations effectuées du
    1er avril au 30 juin 1964
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 23/64/EWG des Rats vom 4. März 1964 über die Festsetzung
    der Abschöpfungsbeträge gegenüber dritten Ländern für Schweine sowie Schweinefleisch
    enthaltende Erzeugnisse für Einfuhren, die vom 1. April bis zum 30. Juni 1964
    getätigt werden
  type: main
- language: it
  script: Latn
  content: Regolamento n. 23/64/CEE del Consiglio, del 4 marzo 1964, relativo alla
    fissazione dell'ammontare dei prelievi nei confronti dei paesi terzi applicabili
    ai suini ed ai prodotti a base di carni suine per le importazioni effettuate dal
    1 aprile al 30 giugno 1964
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 23/64/EEG van de Raad van 4 maart 1964 houdende vaststelling
