title:
- language: en
  script: Latn
  content: '87/154/EEC: Commission Decision of 18 February 1987 approving derogations
    provided for by Greece and Italy from certain provisions of Council Directive
    77/93/EEC in respect of seed potatoes originating in Canada (only the Greek and
    the Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/154/CEE: Décision de la Commission du 18 février 1987 approuvant
    des dérogations prévues par la Grèce et l''Italie à certaines dispositions
    de la directive 77/93/CEE du Conseil en ce qui concerne les plants de pommes de
    terre originaires du Canada (Les textes en langues grecque et italienne sont les
    seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 18. Februar 1987 zur Genehmigung der von
    Griechenland und Italien für Pflanzkartoffeln mit Ursprung in Kanada vorgesehenen
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates (Nur
    der griechische und der italienische Text sind verbindlich) (87/154/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 18. februar 1987 om godkendelse af undtagelser
    for Grækenland og Italien fra visse bestemmelser i direktiv 77/93/EØF, for så
    vidt angår læggekartofler med oprindelse i Canada (Kun de græske og italienske
    udgaver er autentiske) (87/154/EØF) #'
  type: main
- language: el
  script: Grek
  content: '87/154/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Φεβρουαρίου 1987 για την έγκριση παρεκκλίσεων
    που προβλέπονται από την Ελλάδα και την Ιταλία
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά τους σπόρους γεωμήλων
    προς φύτευση καταγωγής Καναδά'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 18 febbraio 1987 che approva le deroghe,
    previste dalla Grecia e dall'' Italia, a talune disposizioni della direttiva 77/93/CEE
    del Consiglio per quanto riguarda i tuberi-seme di patate originari del Canada
    (I testi in lingua greca ed italiana sono i soli facenti fede) (87/154/CEE) #'
  type: main
- language: nl
  script: Latn
  content: '87/154/EEG: Beschikking van de Commissie van 18 februari 1987 houdende
    goedkeuring van de door Griekenland en Italië vastgestelde afwijkingen van sommige
    bepalingen van Richtlijn 77/93/EEG van de Raad ten aanzien van pootaardappelen
    van oorsprong uit Canada'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 18 de Fevereiro de 1987 que aprova derrogações
    a estabelecer pela Grécia e pela Itália, de determinados preceitos da Directiva
    77/93/CEE do Conselho no que respeita às batatas de semente originárias do Canadá
    (Apenas fazem fé os textos nas línguas grega e italiana) (87/154/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 18 de febrero de 1987 por la que se autorizan
    las excepciones previstas por Grecia e Italia respecto de determinadas disposiciones
    de la Directiva 77/93/CEE del Consejo relativas a las patatas de siembra originarias
    de Canadá (Los textos en lenguas griega e italiana son los únicos auténticos)
    (87/154/CEE) #'
