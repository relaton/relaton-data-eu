  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 527/2002, annettu 22 päivänä maaliskuuta 2002,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti maaliskuussa 2002 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 527/2002 della Commissione, del 22 marzo 2002, che
