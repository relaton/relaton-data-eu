title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 527/2002 of 22 March 2002 determining the
    extent to which applications lodged in March 2002 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 527/2002 de la Commission du 22 mars 2002 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mars 2002 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords conclus par la Communauté avec la République
    de Pologne, la République de Hongrie, la République tchèque, la Slovaquie,
    la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 527/2002 der Kommission vom 22. März 2002 über die
    Festsetzung des Umfangs, in dem die im März 2002 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen Republik, der Slowakei,
    Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 527/2002 af 22. marts 2002 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i marts
    2002 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
