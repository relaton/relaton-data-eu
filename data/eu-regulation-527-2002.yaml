  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 527/2002 da Comissão, de 22 de Março de 2002, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Março de
    2002 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
