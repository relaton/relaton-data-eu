    der Preisbedingung, der die Einfuhr frischer Zitronen mit Ursprung in einigen
    Ländern des Mittelmeerraums in die Gemeinschaft unterliegt
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2144/80 af 7. august 1980 om ændring af
