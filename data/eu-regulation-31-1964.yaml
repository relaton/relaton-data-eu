id: EURegulation311964
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement n 31/64/CEE de la Commission, du 17 mars 1964, portant, pour
    la période 1er avril - 30 juin 1964, adaptation et fixation des prix d'écluse
    pour les oeufs de volailles en coquille et les volailles vivantes et abattues
    et fixation des prélèvements envers les pays tiers pour les oeufs de volailles
    en coquille, les volailles vivantes d'un poids n'excédant pas 185 grammes et
    les volailles abattues
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 31/64/EWG der Kommission vom 17. März 1964 über die Anpassung
    und Festsetzung der Einschleusungspreise für Eier von Hausgeflügel, lebendes
    und geschlachtetes Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für die Zeit vom 1. April bis zum 30. Juni 1964
  type: main
- language: it
  script: Latn
  content: Regolamento n. 31/64/CEE della Commissione del 17 marzo 1964, che adatta
    e fissa i prezzi limite per le uova di volatili da cortile, per i volatili da
    cortile vivi e macellati e fissa i prelievi nei confronti dei paesi terzi per
    le uova in guscio di volatili da cortile, per i volatili da cortile vivi di peso
    non superiore a 185 grammi e per i volatili da cortile macellati per il periodo
    1 aprile - 30 giugno 1964
  type: main
- language: nl
  script: Latn
  content: Verordening no. 31/64/EEG van de Commissie van 17 maart 1964 houdende aanpassing
    en vaststelling van de sluisprijzen voor eieren van pluimvee, levend pluimvee
    en geslacht pluimvee, alsmede vaststelling van de heffingen ten opzichte van derde
    landen op eieren in de schaal van pluimvee, levend pluimvee dat niet meer dan
    185 gram weegt en geslacht pluimvee, voor de periode van 1 april 1964 tot en met
    30 juni 1964
  type: main
