type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/923 of 25 March 2021 supplementing
    Directive 2013/36/EU of the European Parliament and of the Council with regard
    to regulatory technical standards setting out the criteria to define managerial
    responsibility, control functions, material business units and a significant impact
    on a material business unit’s risk profile, and setting out criteria for identifying
    staff members or categories of staff whose professional activities have an impact
    on the institution’s risk profile that is comparably as material as that of
    staff members or categories of staff referred to in Article 92(3) of that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/923 de la Commission du 25 mars 2021 complétant
    la directive 2013/36/UE du Parlement européen et du Conseil par des normes techniques
    de réglementation fixant les critères permettant de définir les responsabilités
    dirigeantes, les fonctions de contrôle, l’unité opérationnelle importante
    et l’incidence significative sur le profil de risque de cette unité, et fixant
    les critères permettant de recenser les membres du personnel ou les catégories
    de personnel dont les activités professionnelles ont une incidence sur le profil
    de risque de l’établissement qui est comparativement aussi significative que
    celle des membres du personnel ou catégories de personnel visés à l’article
    92, paragraphe 3, de ladite directive
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/923 der Kommission vom 25. März 2021 zur
    Ergänzung der Richtlinie 2013/36/EU des Europäischen Parlaments und des Rates
    durch technische Regulierungsstandards zur Festlegung der Kriterien für die Definition
    der Managementverantwortung, der Kontrollaufgaben, der wesentlichen Geschäftsbereiche
    und einer erheblichen Auswirkung auf das Risikoprofil eines wesentlichen Geschäftsbereichs
    sowie zur Festlegung der Kriterien für die Ermittlung der Mitarbeiter oder Mitarbeiterkategorien,
    deren berufliche Tätigkeiten vergleichsweise ebenso wesentliche Auswirkungen
    auf das Risikoprofil des Instituts haben wie diejenigen der in Artikel 92 Absatz
    3 der genannten Richtlinie aufgeführten Mitarbeiter oder Mitarbeiterkategorien
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/923 на Комисията
    от 25 март 2021 година за допълване на Директива
    2013/36/ЕС на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти,
    с които се установяват критериите за определяне
    на управленската отговорност, контролните
    функции, съществените стопански единици и
    значителното въздействие върху рисковия профил
    на съществена стопанска единица, и за установяване
    на критерии за определяне на служителите или
    категориите служители, чиито професионални
    дейности имат въздействие върху рисковия профил
    на институцията, съпоставимо с това на служителите
    или категориите служители, посочени в член
    92, параграф 3 от същата директива
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/923 ze dne 25. března
    2021, kterým se doplňuje směrnice Evropského parlamentu a Rady 2013/36/EU,
    pokud jde o regulační technické normy, které stanoví kritéria vymezující
    manažerskou odpovědnost, kontrolní funkce, významné obchodní jednotky a
    podstatný vliv na rizikový profil významné obchodní jednotky, a které stanoví
    kritéria pro určení pracovníků nebo kategorií pracovníků, jejichž pracovní
    činnosti mají vliv na rizikový profil instituce, který je srovnatelně podstatný
    jako u pracovníků nebo kategorií pracovníků uvedených v čl. 92 odst. 3
    uvedené směrnice
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/923 af 25. marts 2021 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv 2013/36/EU for
    så vidt angår reguleringsmæssige tekniske standarder, der fastsætter kriterier
    til at definere ledelsesmæssigt ansvar, kontrolfunktioner, væsentlige forretningsenheder
    og væsentlig indflydelse på en væsentlig forretningsenheds risikoprofil, og
    kriterier til identifikation af medarbejdere eller medarbejderkategorier, hvis
    arbejde har indflydelse på instituttets risikoprofil, der forholdsmæssigt er
    lige så væsentlig som de medarbejderes eller medarbejderkategoriers indflydelse,
    der er omhandlet i artikel 92, stk. 3, i nævnte direktiv
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2021/923
    της Επιτροπής της 25ης Μαρτίου 2021 για τη συμπλήρωση
    της οδηγίας 2013/36/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά τα ρυθμιστικά
    τεχνικά πρότυπα για τον καθορισμό των κριτηρίων
    βάσει των οποίων ορίζονται οι διευθυντικές
    ευθύνες, οι λειτουργίες ελέγχου, οι σημαντικές
    επιχειρηματικές μονάδες και ο ουσιώδης αντίκτυπος
    στα χαρακτηριστικά κινδύνου σημαντικής επιχειρηματικής
    μονάδας, καθώς και των κριτηρίων για τον προσδιορισμό
    μελών ή κατηγοριών προσωπικού, των οποίων οι
    επαγγελματικές δραστηριότητες έχουν αντίκτυπο
    στα χαρακτηριστικά κινδύνου του ιδρύματος,
    συγκριτικά τόσο ουσιώδη όσο και ο αντίκτυπος
    των μελών ή κατηγοριών προσωπικού που αναφέρονται
    στο άρθρο 92 παράγραφος 3 της εν λόγω οδηγίας
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/923, 25. märts 2021, millega
    täiendatakse Euroopa Parlamendi ja nõukogu direktiivi 2013/36/EL seoses regulatiivsete
    tehniliste standarditega, milles sätestatakse kriteeriumid, mille alusel määratakse
    kindlaks juhtimisvastutus ja kontrollifunktsioonid, olulised äriüksused ja märkimisväärne
    mõju asjaomase äriüksuse riskiprofiilile, ning kriteeriumid selliste töötajate
    või töötajate kategooriate kindlaksmääramiseks, kelle ametialane tegevus
    mõjutab krediidiasutuse või investeerimisühingu riskiprofiili kõnealuse direktiivi
    artikli 92 lõikes 3 osutatud töötajate tegevusega võrreldaval määral
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/923, annettu 25 päivänä maaliskuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2013/36/EU täydentämisestä
    teknisillä sääntelystandardeilla, joissa vahvistetaan kriteerit johtotehtävien,
    valvontatoimintojen, olennaisten liiketoimintayksiköiden ja olennaisten liiketoimintayksiköiden
    riskiprofiiliin kohdistuvien merkittävien vaikutusten määrittelemiseksi ja
    sellaisten henkilöstön jäsenten tai henkilöstöryhmien yksilöimiseksi, joiden
    ammattitoiminnalla on laitoksen riskiprofiiliin yhtä olennainen vaikutus kuin
    kyseisen direktiivin 92 artiklan 3 kohdassa tarkoitetuilla henkilöstön jäsenillä
    tai henkilöstöryhmillä
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/923 ón gCoimisiún an 25 Márta 2021 lena
    bhforlíontar Treoir 2013/36/AE ó Pharlaimint na hEorpa agus ón gComhairle maidir
    le caighdeáin theicniúla rialála lena leagtar amach na critéir chun freagracht
    bhainistíochta, feidhmeanna rialúcháin, aonaid ghnó ábhartha agus tionchar
    suntasach ar phróifíl riosca aonaid gnó ábhartha a shainiú, agus lena leagtar
    amach na critéir chun baill foirne nó catagóirí ball foirne a shainaithint
    a mbíonn tionchar ag a gcuid gníomhaíochtaí gairmiúla ar phróifíl riosca
    na hinstitiúide atá chomh hábhartha céanna le baill foirne nó catagóirí
    ball foirne dá dtagraítear in Airteagal 9(3) den Treoir sin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/923 оd 25. ožujka 2021. o dopuni
    Direktive 2013/36/EU Europskog parlamenta i Vijeća u vezi s regulatornim tehničkim
    standardima kojima se utvrđuju kriteriji za definiranje upravljačkih odgovornosti
    i kontrolnih funkcija, značajnih poslovnih jedinica i značajnog utjecaja na
    profil rizičnosti značajnih poslovnih jedinica te kojima se utvrđuju kriteriji
    za utvrđivanje zaposlenika ili kategorija zaposlenika čije profesionalne aktivnosti
    imaju utjecaj na profil rizičnosti institucije koji je usporediv s utjecajem
    zaposlenika ili kategorija zaposlenika iz članka 92. stavka 3. te direktive
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/923 felhatalmazáson alapuló rendelete (2021. március
    25.) az Európai Parlament és a Tanács 2013/36/EU irányelvének a vezetői
    felelősség, az ellenőrzési funkciók, a lényeges szervezeti egységek és
    az intézmény kockázati profiljára gyakorolt jelentős hatás meghatározására
    vonatkozó kritériumokat megállapító, valamint az intézmény kockázati profiljára
    az irányelv 92. cikkének (3) bekezdésében említett munkavállalók vagy munkavállalói
    kategóriák szakmai tevékenységeinek hatásával összehasonlítható módon
    ugyanolyan lényeges hatást gyakorló szakmai tevékenységeket végző munkavállalók
    vagy munkavállalói kategóriák azonosítására vonatkozó kritériumokat megállapító
    szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/923 della Commissione del 25 marzo 2021
    che integra la direttiva 2013/36/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione che stabiliscono i criteri
    per definire le responsabilità manageriali, le funzioni di controllo, l’unità
    operativa/aziendale rilevante e l’impatto significativo sul profilo di rischio
    dell’unità operativa/aziendale in questione, e i criteri per individuare i
    membri del personale o le categorie di personale le cui attività professionali
    hanno un impatto sul profilo di rischio dell’ente comparativamente altrettanto
    rilevante di quello delle categorie di personale menzionate all’articolo 92,
    paragrafo 3, della direttiva
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/923 (2021. gada 25. marts), ar ko
    papildina Eiropas Parlamenta un Padomes Direktīvu 2013/36/ES attiecībā uz regulatīvajiem
    tehniskajiem standartiem, kuros noteikti kritēriji, pēc kuriem definē vadītāja
    atbildību, kontroles funkcijas, būtiskas sabiedrības struktūrvienības un
    būtisku ietekmi uz būtiskas sabiedrības struktūrvienības riska profilu, un
    noteikti kritēriji to darba ņēmēju vai darba ņēmēju kategoriju identificēšanai,
    kuru profesionālajai darbībai ir tāda ietekme uz iestādes riska profilu, kas
    ir salīdzinoši tikpat būtiska kā iepriekš minētās direktīvas 92. panta
    3. punktā minētajiem darba ņēmējiem vai darba ņēmēju kategorijām
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/923 2021 m. kovo 25 d. kuriuo
    papildomos Europos Parlamento ir Tarybos direktyvos 2013/36/ES nuostatos dėl
    techninių reguliavimo standartų, kuriais nustatomi kriterijai vadovaujamoms
    pareigoms, kontrolės funkcijoms, reikšmingiems verslo padaliniams ir reikšmingam
    poveikiui reikšmingo verslo padalinio rizikos pobūdžiui apibrėžti, taip pat
    kriterijai, pagal kuriuos nustatomi darbuotojai ar kategorijos darbuotojų, kurių
    profesinės veiklos poveikis įstaigos rizikos pobūdžiui toks reikšmingas,
    kaip ir direktyvos 92 straipsnio 3 dalyje nurodytų darbuotojų ar darbuotojų
    kategorijų
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/923 tal-25 ta’ Marzu 2021
    li jissupplimenta d-Direttiva 2013/36/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ standards tekniċi regolatorji li jistabbilixxu l-kriterji biex jiġu definiti
    r-responsabbiltà maniġerjali, il-funzjonijiet ta’ kontroll, unità tan-negozju
    materjali u impatt sinifikanti fuq il-profil tar-riskju tal-unità tan-negozju
    rilevanti, u li jistabbilixxu l-kriterji għall-identifikazzjoni tal-membri tal-persunal
    jew kategoriji ta’ persunal li l-attivitajiet professjonali tiegħu għandhom
    impatt fuq il-profil tar-riskju tal-istituzzjonijiet li b’mod komparabbli huwa
    materjali daqs dak tal-membri tal-persunal jew tal-kategoriji ta’ persunal imsemmija
    fl-Artikolu 92(3) ta’ dik id-Direttiva
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/923 van de Commissie van 25 maart 2021
    tot aanvulling van Richtlijn 2013/36/EU van het Europees Parlement en de Raad
    met betrekking tot technische reguleringsnormen met de criteria ter bepaling van
    leidinggevende verantwoordelijkheid, controlefuncties, essentiële bedrijfseenheden
    en een aanzienlijke impact op het risicoprofiel van een essentiële bedrijfseenheid,
    en met criteria voor het identificeren van personeelsleden of categorieën personeelsleden
    wier beroepswerkzaamheden het risicoprofiel van de instelling even wezenlijk beïnvloeden
    als die van de in artikel 92, lid 3, van die richtlijn bedoelde personeelsleden
    of categorieën personeelsleden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/923 z dnia 25 marca 2021 r.
    uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2013/36/UE w odniesieniu
    do regulacyjnych standardów technicznych określających kryteria służące
    ustaleniu obowiązków kierowniczych, funkcji kontrolnych, istotnych jednostek
    gospodarczych i znacznego wpływu na profil ryzyka istotnej jednostki gospodarczej
    oraz określające kryteria służące ustaleniu pracowników lub kategorii pracowników,
    których działalność zawodowa wpływa na profil ryzyka tych instytucji w sposób
    porównywalnie tak istotny jak w przypadku pracowników lub kategorii pracowników,
    o których mowa w art. 92 ust. 3 tej dyrektywy
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/923 da Comissão de 25 de março de 2021
    que complementa a Diretiva 2013/36/UE do Parlamento Europeu e do Conselho no que
    diz respeito às normas técnicas de regulamentação que estabelecem os critérios
    para definir responsabilidades de gestão, funções de controlo, unidades de
    negócio significativas e impacto significativo no perfil de risco de uma unidade
    de negócio, e que estabelecem critérios para identificar os membros ou categorias
    do pessoal cujas atividades profissionais têm um impacto no perfil de risco da
    instituição comparável ao dos membros ou categorias de pessoal a que se refere
    o artigo 92.o, n.o 3, da diretiva
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/923 al Comisiei din 25 martie 2021 de completare
    a Directivei 2013/36/UE a Parlamentului European și a Consiliului în ceea ce
    privește standardele tehnice de reglementare care stabilesc criteriile de definire
    a responsabilității de conducere, a funcțiilor de control, a unităților operaționale
    importante și a unui impact semnificativ asupra profilului de risc al unei unități
    operaționale, precum și criteriile de identificare a membrilor personalului
    sau a categoriilor de personal ale căror activități profesionale au asupra
    profilului de risc al instituției un impact la fel de semnificativ ca cel al
    membrilor personalului sau al categoriilor de personal menționate la articolul
    92 alineatul (3) din directiva respectivă
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/923 z 25. marca 2021, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2013/36/EÚ, pokiaľ ide o
    regulačné technické predpisy, v ktorých sa stanovujú kritériá na vymedzenie
    riadiacej zodpovednosti, kontrolných funkcií, významných obchodných útvarov
    a významného vplyvu na rizikový profil významného obchodného útvaru, ako
    aj kritériá na identifikáciu zamestnancov alebo kategórií zamestnancov, ktorých
    profesionálne činnosti majú vplyv na rizikový profil inštitúcie, ktorý
    je rovnako významný ako vplyv zamestnancov alebo kategórií zamestnancov uvedených
    v článku 92 ods. 3 uvedenej smernice
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/923 z dne 25. marca 2021 o dopolnitvi
    Direktive 2013/36/EU Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo merila za opredelitev vodstvene odgovornosti, kontrolnih
    funkcij, pomembnih poslovnih enot in pomembnega vpliva na profil tveganosti pomembne
    poslovne enote ter merila za opredelitev zaposlenih ali kategorij zaposlenih,
    katerih poklicne dejavnosti podobno pomembno vplivajo na profil tveganosti institucije
    kot dejavnosti zaposlenih ali kategorij zaposlenih iz člena 92(3) Direktive
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/923 de la Comisión de 25 de marzo de 2021
    por el que se complementa la Directiva 2013/36/UE del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación por las que se
    establecen los criterios de definición de las responsabilidades de dirección,
    las funciones de control, las unidades de negocio importantes y la incidencia
    significativa en el perfil de riesgo de una unidad de negocio importante, y se
    establecen los criterios para determinar los miembros del personal o las categorías
    de personal cuyas actividades profesionales tienen una incidencia en el perfil
    de riesgo de la entidad comparable en importancia a la de los miembros del personal
    o las categorías de personal a que se refiere el artículo 92, apartado 3, de
    dicha Directiva
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/923 av den 25 mars 2021
    om komplettering av Europaparlamentets och rådets direktiv 2013/36/EU vad gäller
    tekniska standarder för tillsyn som fastställer kriterier för att identifiera
    ledningsansvar och kontrollfunktioner, väsentliga affärsenheter och betydande
    inverkan på en berörd affärsenhets riskprofil samt fastställer kriterier för
    att identifiera anställda eller kategorier av personal vars yrkesutövning har
    en inverkan på institutets riskprofil som är lika väsentlig som de anställda
    eller kategorier av personal som avses i artikel 92.3 i det direktivet
  type: main
