- language: en
  script: Latn
  content: Council Decision (EU) 2015/362 of 2 March 2015 establishing the position
    to be taken on behalf of the European Union within the General Council of the
    World Trade Organization on the United States' request for a WTO waiver to extend
    and expand the scope of the US Caribbean Basin Economic Recovery Act (CBERA)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/362 du Conseil du 2 mars 2015 établissant la position
    à prendre au nom de l'Union européenne au sein du Conseil général de l'Organisation
    mondiale du commerce en ce qui concerne la demande de dérogation aux règles
    de l'OMC présentée par les États-Unis en vue de prolonger la durée d'application
    et d'élargir le champ de la loi américaine relative au redressement économique
    du bassin des Caraïbes (loi CBERA)
