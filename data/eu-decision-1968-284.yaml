title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 juin 1968, relative aux dispositions
    applicables, à partir du 1er juillet 1968, à la circulation des marchandises
    obtenues dans les circonstances visées à l'article 10 paragraphe 2 deuxième
    alinéa du Traité
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Juni 1968 über die Vorschriften, die
    ab 1. Juli 1968 auf den Verkehr mit Waren anzuwenden sind, die unter den Voraussetzungen
    des Artikels 10 Absatz 2 zweiter Unterabsatz des Vertrages gewonnen worden sind
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 giugno 1968, relativa alle disposizioni
    applicabili, a datare dal 1 luglio 1968, alla circolazione delle merci ottenute
    nelle circostanze di cui all'articolo 10, paragrafo 2, secondo comma, del trattato
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 juni 1968 inzake de bepalingen welke
    van 1 juli 1968 af toepasselijk zijn op het verkeer van goederen die in de bij
    artikel 10, lid 2, tweede alinea, van het Verdrag bedoelde omstandigheden verkregen
    zijn
