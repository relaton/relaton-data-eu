title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 407/97 of 20 December 1996 laying down for 1997
    certain conservation and management measures for fishery resources in the Convention
    Area as defined in the Convention on future Multilateral Cooperation in North-East
    Atlantic Fisheries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 407/97 du Conseil du 20 décembre 1996 fixant, pour
    1997, certaines mesures techniques de conservation et de gestion des ressources
    halieutiques de la zone de la convention définie par la convention sur la future
    coopération multilatérale dans les pêches de l'Atlantique du Nord-Est
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 407/97 des Rates vom 20. Dezember 1996 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischereiressourcen im Regelungsbereich
    des Übereinkommens über die künftige multilaterale Zusammenarbeit auf dem Gebiet
    der Fischerei im Nordostatlantik (1997)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 407/97 af 20. december 1996 om fastsættelse
    for 1997 af foranstaltninger til bevarelse og forvaltning af fiskeressourcer i
    konventionsområdet som defineret i konventionen om det fremtidige multilaterale
    samarbejde vedrørende fiskeriet i det nordøstlige Atlanterhav
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 407/97 του Συμβουλίου
    της 20ής Δεκεμβρίου 1996 για τη θέσπιση, για το
    1997, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων στη ζώνη της σύμβασης,
    όπως αυτή καθορίζεται στη συμβάση για τη μελλοντική
    πολυμερή συνεργασία στο Βορειοανατολικό Ατλαντικό
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 407/97, annettu 20 päivänä joulukuuta 1996,
    Koillis-Atlantilla harjoitettavaan kalastukseen liittyvää tulevaa monenkeskistä
    yhteistyötä koskevassa yleissopimuksessa määritetyn yleissopimusalueen kalavarojen
    tietyistä vuonna 1997 sovellettavista säilyttämis- ja hoitotoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 407/97 del Consiglio del 20 dicembre 1996 che stabilisce,
    per il 1997, talune misure di conservazione e di gestione delle risorse alieutiche
    della zona definita dalla convenzione sulla futura cooperazione multilaterale
    per la pesca nell'Atlantico nordorientale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 407/97 van de Raad van 20 december 1996 tot vaststelling,
    voor 1997, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden in het gebied zoals omschreven in het Verdrag inzake toekomstige
    multilaterale samenwerking op visserijgebied in het noordoostelijk deel van de
    Atlantische Oceaan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 407/97 do Conselho de 20 de Dezembro de 1996 que estabelece,
    para 1997, determinadas medidas de conservação e de gestão dos recursos haliêuticos
    da área da convenção definida na Convenção sobre a futura cooperação multilateral
    nas pescas do Atlântico Nordeste
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 407/97 del Consejo de 20 de diciembre de 1996 por el
    que se establecen para 1997 determinadas medidas de conservación y de gestión
