    gelieferten Apfelsinen und des finanziellen Ausgleichs für die Verarbeitung dieser
    Orangen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3115/92 af 28. oktober 1992 om fastsættelse
    for produktionsåret 1992/93 af minimumsopkøbsprisen for appelsiner, der leveres
    til forarbejdning, og af udligningstilskuddet efter forarbejdning af disse produkter
  type: main
- language: el
  script: Grek
