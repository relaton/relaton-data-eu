  content: Commission Regulation (EEC) No 3115/92 of 28 October 1992 fixing for the
    1992/93 marketing year the minimum purchase price for oranges delivered for processing
    and the financial compensation for oranges payable after processing
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3115/92 de la Commission, du 28 octobre 1992, fixant,
