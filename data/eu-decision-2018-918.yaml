    článku 5 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2018/918 z dne 22. junija 2018 o dovoljenju
