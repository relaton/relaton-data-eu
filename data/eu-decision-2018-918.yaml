    odstępstwo od art. 5 dyrektywy Rady 2006/112/WE w sprawie wspólnego systemu
    podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/918 do Conselho, de 22 de junho de 2018,
    que autoriza a Alemanha e a Polónia a aplicar uma medida especial em derrogação
    ao artigo 5.° da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/918 a Consiliului din 22 iunie
    2018 prin care Germania și Polonia sunt autorizate să adopte o măsură specială
    de derogare de la articolul 5 din Directiva 2006/112/CE privind sistemul comun
    al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2018/918 z 22. júna 2018, ktorým
