  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2018/918, annettu 22 päivänä
    kesäkuuta 2018, luvan antamisesta Saksalle ja Puolalle ottaa käyttöön yhteisestä
