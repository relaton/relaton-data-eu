title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1326/89 of 16 May 1989 amending Regulation
    (EEC) No 3782/88 and authorizing Germany and France not to apply in certain areas
    the measures provided for in Council Regulation (EEC) No 1442/88 as regards the
    granting of permanent abondonment premiums in respect of wine-growing areas for
    the 1989/90 to 1995/96 wine-growing years
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1326/89 de la Commission du 16 mai 1989 modifiant
    le règlement (CEE) n° 3782/88 et autorisant l'Allemagne et la France à ne pas
    appliquer dans certaines zones les mesures prévues au règlement (CEE) n° 1442/88
    du Conseil, relatif à l'octroi de primes d'abandon définitif de superficies
    viticoles, pour les campagnes viticoles 1989/1990 à 1995/1996
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1326/89 DER KOMMISSION vom 16. Mai 1989 zur Änderung
    der Verordnung (EWG) Nr. 3782/88 zur Ermächtigung der Bundesrepublik Deutschland
    und Frankreichs, in bestimmten Gebieten die mit der Verordnung (EWG) Nr. 1442/88
    des Rates über die Gewährung von Prämien zur endgültigen Aufgabe von Rebflächen
    vorgesehenen Maßnahmen in den Weinwirtschaftsjahren 1989/90 bis 1995/96 nicht
    anzuwenden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1326/89 af 16. maj 1989 om ændring
