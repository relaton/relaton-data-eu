title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2123/76 of 27 August 1976 re-establishing
    the levying of the customs duties on equipment for parlour games, etc., falling
    within heading No 97.04, originating in Hong Kong to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November 1975
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2123/76 de la Commission, du 27 août 1976, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour jeux de société, de la position tarifaire 97.04, originaires de Hong- Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2123/76 der Kommission vom 27. August 1976 zur Wiedereinführung
    des Zollsatzes für Gesellschaftsspiele der Tarifnummer 97.04, mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November
    1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2123/76 af 27. august 1976 om genindførelse
    af opkrævning af toldafgifter for selskabsspil under position 97.04, som har
    oprindelse i Hong Kong og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2123/76 della Commissione, del 27 agosto 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti per giuochi
    di società, della voce doganale 97.04, originari di Hong Kong beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2123/76 van de Commissie van 27 augustus 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op artikelen
    voor gezelschapsspellen, (...), van post 97.04, van oorsprong uit Hong-Kong, ten
    behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
