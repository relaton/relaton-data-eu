title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2050/71 de la Commission, du 23 septembre 1971, modifiant
    les montants compensatoires fixés dans le secteur agricole à la suite de l'élargissement
    temporaire des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2050/71 der Kommission vom 23. September 1971 zur
    Änderung der Ausgleichsbeträge, die in der Landwirtschaft im Anschluß an die
    vorübergehende Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten
    festgesetzt wurden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2050/71 della Commissione, del 23 settembre 1971,
    che modifica gli importi di compensazione fissati per il settore agricolo in seguito
    all'ampliamento temporaneo dei margini di fluttuazione delle monete di taluni
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2050/71 van de Commissie van 23 september 1971 houdende
    wijziging van de compenserende bedragen welke naar aanleiding van de tijdelijke
    verruiming van de fluctuatiemarges van de valuta's van sommige Lid-Staten werden
    vastgesteld in de landbouwsector
  type: main
