title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 845/84 of 30 March 1984 re-establishing
    the levying of customs duties on other vitamins, falling within subheading 29.38
    B V and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 845/84 de la Commission du 30 mars 1984 portant rétablissement
    de la perception des droits de douane applicables aux autres vitamines de la sous-position
    29.38 B V du tarif douanier commun, originaires de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 845/84 der Kommission vom 30. März 1984 zur Wiedereinführung
    der Erhebung der Zölle für andere Vitamine der Tarifstelle 29.38 B V mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 845/84 af 30. marts 1984 om genindførelse
    af opkrævning af told for andre vitaminer henhørende under pos. 29.38 B V og
    med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
