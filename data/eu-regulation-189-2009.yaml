  script: Latn
  content: Regolamento (CE) n. 189/2009 del Consiglio, del 9 marzo 2009 , che modifica
    il regolamento (CE) n. 1425/2006, che impone un dazio antidumping definitivo sulle
    importazioni di alcuni tipi di sacchi e sacchetti di plastica originari della
    Repubblica popolare cinese e della Thailandia e chiude il procedimento relativo
    alle importazioni di alcuni tipi di sacchi e sacchetti di plastica originari della
    Malaysia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 189/2009 ( 2009. gada 9. marts ), ar kuru groza
    Regulu (EK) Nr. 1425/2006, ar ko uzliek galīgo antidempinga maksājumu dažu
    Ķīnas Tautas Republikas un Taizemes izcelsmes plastikāta maisu un maisiņu
