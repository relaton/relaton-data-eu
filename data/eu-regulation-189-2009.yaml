    en tot staking van de procedure betreffende de invoer van bepaalde kunststof zakken
    uit Maleisië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 189/2009 z dnia 9 marca 2009 r. zmieniające
