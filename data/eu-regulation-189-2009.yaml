    definitivo sobre as importações de determinados sacos de plástico de quaisquer
    dimensões originários da República Popular da China e da Tailândia e que encerra
    o processo relativo às importações de determinados sacos de plástico de quaisquer
    dimensões originários da Malásia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 189/2009 al Consiliului din 9 martie 2009 de modificare
    a Regulamentului (CE) nr. 1425/2006 de instituire a unei taxe antidumping definitive
    la importurile unor saci și pungi din materiale plastice originare din Republica
    Populară Chineză și din Thailanda și de închidere a procedurii privind importurile
    unor saci și pungi din materiale plastice originare din Malaezia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 189/2009 z 9. marca 2009 , ktorým sa mení a
