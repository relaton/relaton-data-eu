title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 189/2009 of 9 March 2009 amending Regulation
    (EC) No 1425/2006 imposing a definitive anti-dumping duty on imports of certain
    plastic sacks and bags originating in the People’s Republic of China and Thailand,
    and terminating the proceeding on imports of certain plastic sacks and bags originating
    in Malaysia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 189/2009 du Conseil du 9 mars 2009 modifiant le règlement
    (CE) n o 1425/2006 instituant un droit antidumping définitif sur les importations
    de certains sacs et sachets en matières plastiques originaires de la République
    populaire de Chine et de Thaïlande et clôturant la procédure concernant les
    importations de certains sacs et sachets en matières plastiques originaires de
    Malaisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 189/2009 des Rates vom 9. März 2009 zur Änderung
