  content: Règlement (CEE) n 2629/69 de la Commission, du 22 décembre 1969, fixant
    les taux des restitutions applicables, à compter du 1er janvier 1970, au sucre
    et à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2629/69 der Kommission vom 22. Dezember 1969 zur Festsetzung
    der ab 1. Januar 1970 geltenden Erstattungssätze bei der Ausfuhr von Zucker und
    Melasse in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2629/69 della Commissione, del 22 dicembre 1969, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 gennaio 1970,
    allo zucchero ed al melasso esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2629/69 van de Commissie van 22 december 1969 houdende
    vaststelling van de restituties die met ingang van 1 januari 1970 worden toegepast
    voor suiker en melasse uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
