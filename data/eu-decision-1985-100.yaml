title:
- language: en
  script: Latn
  content: '85/100/EEC: Commission Decision of 21 December 1984 authorizing the Italian
    Republic to extend intra- Community surveillance in respect of imports of bananas
    originating in certain third countries and put into free circulation in the other
    Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/100/CEE: Décision de la Commission du 21 décembre 1984 autorisant
    la République italienne à proroger les mesures de surveillance intracommunautaire
    à l''égard des importations de bananes originaires de certains pays tiers et
    mises en libre pratique dans les autres États membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/100/EWG: Entscheidung der Kommission vom 21. Dezember 1984 mit der
    die Italienische Republik zur Verlängerung der innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Bananen ermächtigt wird (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/100/EØF: Kommissionens beslutning af 21. december 1984 om bemyndigelse
    af Den italienske Republik til at forlænge gyldighedsperioden for foranstaltninger
    med henblik på tilsyn inden for Fællesskabet med indførsel af bananer, der
    har oprindelse i visse tredjelande, og som er overgået til fri omsætning i de
    øvrige medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/100/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Δεκεμβρίου 1984 για τη χορήγηση άδειας στην Ιταλική
    Δημοκρατία να παρατείνει τα μέτρα ενδοκοινοτικής
    επίβλεψης έναντι των εισαγωγών μπανανών καταγωγής
    ορισμένων τρίτων χωρών, οι οποίες τίθενται
    σε ελεύθερη κυκλοφορία στα άλλα κράτη μέλη
    (Το κείμενο στην ιταλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/100/CEE: Decisione della Commissione del 21 dicembre 1984 che autorizza
    la Repubblica italiana a prorogare le misure di sorveglianza intracomunitaria
    nei confronti delle banane originarie di taluni paesi terzi e messe in libera
    pratica negli altri Stati membri (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '85/100/EEG: Beschikking van de Commissie van 21 december 1984 waarbij
    de Italiaanse Republiek wordt gemachtigd maatregelen inzake intracommunautair
    toezicht te verlengen ten aanzien van de invoer van bananen van oorsprong uit
    bepaalde derde landen en in de andere Lid- Staten in het vrije verkeer gebracht
    (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
