    της εφαρμογής τελωνειακών δασμών για έτερα
    υφάσματα βαμβακηρά αλεύκαστα ή λελευκασμένα,
    προϊόντα της κατηγορίας ex 2 (κωδικός αριθμός
    0023), καταγωγής Ινδονησίας, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2526/83 della Commissione del 7 settembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili a altri tessuti di cotone,
    greggi o imbianchiti, della categoria di prodotti ex 2 (codice 0023), originari
    dell' Indonesia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2526/83 van de Commissie van 7 september 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geweven
    weefsels van katoen, ongebleekt of gebleekt, van de categorie van produkten nr.
    ex 2 (codenummer 0023), van oorsprong uit Indonesië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
