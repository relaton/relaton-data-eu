title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2526/83 of 7 September 1983 re-establishing
    the levying of customs duties on other woven fabrics of cotton, unbleached or
    bleached, products of category ex 2 (code 0023), originating in Indonesia, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2526/83 de la Commission du 7 septembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux autres tissus
    de coton écrus ou blanchis de la catégorie de produits ex 2 (code 0023), originaires
    de l' Indonésie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2526/83 der Kommission vom 7. September 1983 über
    die Wiedereinführung des Zollsatzes für andere Gewebe aus Baumwolle, roh oder
    gebleicht, der Warenkategorie Nr. ex 2 (Kennziffer 0023), mit Ursprung in Indonesien,
    dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2526/83 af 7. september 1983 om genindførelse
    af opkrævning af toldafgifter for andre vævede stoffer af bomuld, ublegede og
    blegede, under varekategori nr. ex 2 (kode 0023), som har oprindelse i Indonesien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2526/83 της Επιτροπής
