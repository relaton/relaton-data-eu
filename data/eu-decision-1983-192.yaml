title:
- language: en
  script: Latn
  content: '83/192/EEC: Commission Decision of 19 April 1983 accepting an undertaking
    given in connection with the anti-dumping proceeding concerning imports of certain
    cellulose ester resins (cellulose-acetobutyrate and cellulose-acetopropionate)
    originating in the United States of America and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '83/192/CEE: Décision de la Commission du 19 avril 1983 portant acceptation
    d'' un engagement souscrit dans le cadre de la procédure anti-"dumping" concernant
    les importations de certaines résines d'' ester cellulosique (cellulose-acétobutyrate
    et cellulose-acétopropionate), originaires des États-Unis d'' Amérique, et
    portant clôture de la procédure'
  type: main
- language: de
  script: Latn
  content: '83/192/EWG: Beschluß der Kommission vom 19. April 1983 zur Annahme einer
    Verpflichtung im Rahmen des Antidumpingverfahrens betreffend die Einfuhren bestimmter
    Zelluloseesterharze (Zellulose-Acetobutyrat und Zellulose-Acetopropionat) mit
    Ursprung in den Vereinigten Staaten von Amerika und zur Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '83/192/EØF: Kommissionens afgørelse af 19. april 1983 om godtagelse
    af tilsagn afgivet i forbindelse med anti-dumpingproceduren vedrørende importen
    af visse celluloseesterharpikser (celluloseacetobutyrat og celluloseacetopropionat)
    med oprindelse i Amerikas Forenede Stater og om afslutning af denne procedure'
  type: main
- language: el
  script: Grek
  content: '83/192/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Απριλίου 1983 για την αποδοχή ανάληψης υποχρεώσεων
    που προτάθηκε σχετικά με τη διαδικασία αντιντάμπινγκ
    που αφορά τις εισαγωγές ορισμένων ρητινών
    εστέρων κυτταρίνης (οξικοβουτυρική κυτταρίνη
    και οξικοπροπιονική κυτταρίνη) καταγωγής Ηνωμένων
    Πολιτειών Αμερικής και για την περάτωση της
    διαδικασίας αυτής'
  type: main
- language: it
  script: Latn
  content: '83/192/CEE: Decisione della Commissione del 19 aprile 1983 che accetta
    l'' impegno offerto nell'' ambito della procedura antidumping relativa alle importazioni
    di talune resine a base di esteri della cellulosa (aceto butirrato e acetopropionato
    di cellulosa), originarie degli Stati Uniti d'' America, e che conclude tale procedura'
  type: main
- language: nl
  script: Latn
  content: '83/192/EEG: Besluit van de Commissie van 19 april 1983 tot aanvaarding
    van een verbintenis aangegaan in het kader van de anti-dumpingprocedure betreffende
    de invoer van bepaalde harsen van cellulose-esters (cellulose-acetobutyraat en
    cellulose-acetopropionaat) van oorsprong uit de Verenigde Staten van Amerika en
    tot beëindiging van de procedure'
  type: main
