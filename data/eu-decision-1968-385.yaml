- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1968, portant octroi du concours
    du Fonds social européen au bénéfice de la République italienne pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    le "Ministero del lavore e della previdenza sociale" et plusieurs organismes italiens
  type: main
- language: de
  script: Latn
  content: '68/385/EWG: Entscheidung der Kommission vom 30. September 1968 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Italien zu Aufwendungen
    für vom "Ministero del Lavoro e della Previdenza sociale" und mehreren italienischen
    Körperschaften durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '68/385/CEE: Decisione della Commissione, del 30 settembre 1968, relativa
    alla concessione di un contributo del FSE a favore della Repubblica italiana per
    spese concernenti operazioni di riqualificazione effettuate dal «Ministero del
    lavoro e della previdenza sociale» e vari enti italiani'
  type: main
- language: nl
  script: Latn
  content: '68/385/EEG: Beschikking van de Commissie van 30 september 1968 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door het "Ministero del lavoro e della previdenza sociale" en enkele Italiaanse
    instellingen gemaakte herscholingskosten'
