    121, 125, 141, 142, 148, 149, 152, 154, 155, 160, 161, 162 e 163 da ONU, à proposta
    de um novo regulamento da ONU relativo aos pneus com pregos, à proposta de um
    novo regulamento técnico global da ONU relativo à durabilidade das baterias
    a bordo dos veículos elétricos, à proposta de alteração da Resolução Consolidada
    R.E.5, à proposta de autorização para elaborar a alteração 4 do RTG n.o 3
    da ONU, bem como à proposta de autorização para elaborar um novo regulamento
    técnico global da ONU relativo às emissões de partículas dos travões
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/387 a Consiliului din 3 martie 2022 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Forumului
    mondial pentru armonizarea regulamentelor privind vehiculele al Comisiei Economice
    pentru Europa a Organizației Națiunilor Unite în ceea ce privește propunerile
    de amendamente la Regulamentele ONU nr. 0, 9, 10, 13, 39, 46, 51, 53, 55, 63,
    78, 79, 90, 107, 108, 109, 116, 117, 121, 125, 141, 142, 148, 149, 152, 154, 155,
    160, 161, 162 și 163, propunerea pentru un nou regulament ONU privind pneurile
    cu nituri, propunerea pentru un nou regulament tehnic mondial ONU privind durabilitatea
    bateriilor încorporate la bordul vehiculelor pentru vehiculele electrice, propunerea
    de amendamente la Rezoluția consolidată R.E.5, propunerea de autorizare a elaborării
    amendamentului 4 la RTM ONU nr. 3 și propunerea de autorizare a elaborării unui
    nou regulament tehnic mondial ONU privind emisiile de particule la frânare
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/387 z 3. marca 2022 o pozícii, ktorá sa má
    v mene Európskej únie zaujať vo Svetovom fóre Európskej hospodárskej komisie
    Organizácie Spojených národov pre harmonizáciu predpisov o vozidlách, pokiaľ
    ide o návrhy na zmeny predpisov OSN č. 0, 9, 10, 13, 39, 46, 51, 53, 55, 63,
    78, 79, 90, 107, 108, 109, 116, 117, 121, 125, 141, 142, 148, 149, 152, 154, 155,
    160, 161, 162 a 163, návrh nového predpisu OSN o pneumatikách s kovovými hrotmi,
    návrh nového globálneho technického predpisu OSN o životnosti batérií vo
    vozidle pre elektrické vozidlá, návrh na zmeny konsolidovanej rezolúcie R.E.5,
    návrh na povolenie na vypracovanie zmeny 4 GTP OSN č. 3 a návrh na povolenie
    na vypracovanie nového globálneho technického predpisu OSN o emisiách častíc
    z bŕzd
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/387 z dne 3. marca 2022 o stališču, ki se v imenu
    Evropske unije zastopa na Svetovnem forumu Ekonomske komisije Združenih narodov
    za Evropo za harmonizacijo pravilnikov o vozilih glede predlogov sprememb pravilnikov
    ZN št. 0, 9, 10, 13, 39, 46, 51, 53, 55, 63, 78, 79, 90, 107, 108, 109, 116,
    117, 121, 125, 141, 142, 148, 149, 152, 154, 155, 160, 161, 162 in 163, kar zadeva
    predlog novega pravilnika ZN o ježevkah, predlog novega globalnega tehničnega
    predpisa ZN o trajnosti akumulatorjev v električnih vozilih, predlog sprememb
    Konsolidirane resolucije R.E.5, predlog za dovoljenje za pripravo spremembe 4
    globalnega tehničnega predpisa ZN št. 3 in predlog za dovoljenje za pripravo
    novega globalnega tehničnega predpisa ZN o emisijah delcev pri zaviranju
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/387 del Consejo de 3 de marzo de 2022 relativa a la
    posición que debe adoptarse, en nombre de la Unión Europea, en el Foro Mundial
    para la Armonización de la Reglamentación sobre Vehículos de la Comisión Económica
    para Europa de las Naciones Unidas por lo que respecta a las propuestas de modificación
    de los Reglamentos n.os 0, 9, 10, 13, 39, 46, 51, 53, 55, 63, 78, 79, 90, 107,
    108, 109, 116, 117, 121, 125, 141, 142, 148, 149, 152, 154, 155, 160, 161, 162
    y 163 de las Naciones Unidas, la propuesta de un nuevo Reglamento de las Naciones
    Unidas sobre neumáticos con clavos, la propuesta de un nuevo Reglamento Técnico
    Mundial de las Naciones Unidas sobre la durabilidad de las baterías integradas
    en los vehículos eléctricos, la propuesta de enmiendas a la Resolución consolidada
    R.E.5, la propuesta de autorización para elaborar la enmienda 4 del RTM n.o 3
    de las Naciones Unidas y la propuesta de autorización para elaborar un nuevo
    Reglamento Técnico Mundial de las Naciones Unidas sobre las emisiones de partículas
    de los frenos
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/387 av den 3 mars 2022 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Förenta nationernas ekonomiska kommission
    för Europas världsforum för harmonisering av fordonsföreskrifter vad gäller
    förslagen till ändringar av FN-föreskrifter nr 0, 9, 10, 13, 39, 46, 51, 53,
    55, 63, 78, 79, 90, 107, 108, 109, 116, 117, 121, 125, 141, 142, 148, 149, 152,
    154, 155, 160, 161, 162 och 163, vad gäller förslaget till ny FN-föreskrift
    om dubbdäck, vad gäller förslaget till ny global teknisk FN-föreskrift om
    hållbarhet hos fordonsmonterade batterier i elfordon, vad gäller förslaget
    till ändring av konsoliderad resolution R.E.5, vad gäller förslaget till godkännande
    av utveckling av ändring 4 av global teknisk FN-föreskrift nr 3 samt vad gäller
    förslaget om godkännande av en ny global teknisk FN-föreskrift om bromspartikelutsläpp
