title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 199/83 of 25 January 1983 laying down for the
    period 1 February to 31 March 1983 certain measures for the conservation and management
    of fishery resources applicable to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 199/83 du Conseil du 25 janvier 1983 fixant, pour la
    période du 1er février au 31 mars 1983, certaines mesures de conservation et
    de gestion des ressources de pêche applicables aux navires battant pavillon de
    l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 199/83 des Rates vom 25. Januar 1983 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter spanischer Flagge für die Zeit vom 1. Februar bis zum 31. März
    1983
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 199/83 af 25. januar 1983 om fastsættelse
    af en række foranstaltninger til bevarelse og forvaltning af fiskeriressourcerne,
    som skal finde anvendelse på fartøjer, der fører spansk flag, i perioden fra
    den 1. februar til den 31. marts 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 199/83 του Συμβουλίου
    της 25ης Ιανουαρίου 1983 περί καθορισμού, για
    την περίοδο από 1ης Φεβρουαρίου μέχρι 31 Μαρτίου
    1983, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων, που εφαρμόζονται σε σκάφη
    υπό ισπανική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 199/83 del Consiglio del 25 gennaio 1983 che dispone
    talune misure di conservazione e di gestione delle risorse di pesca da applicare
    alle navi battenti bandiera della Spagna, per il periodo dal 1o febbraio al 31
    marzo 1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 199/83 van de Raad van 25 januari 1983 tot vaststelling,
    voor de periode van 1 februari tot en met 31 maart 1983, van bepaalde maatregelen
    voor de instandhouding en het beheer van de visbestanden ten aanzien van vaartuigen
    die de vlag van Spanje voeren
  type: main
