    Republiku par pasažieru datu reģistra (PDR) datu pārsūtīšanu no Eiropas
    Savienības uz Korejas Republiku teroristu nodarījumu un smagu noziegumu novēršanai,
    atklāšanai, izmeklēšanai un saukšanai pie atbildības par tiem
  type: main
- language: lt
  script: Latn
