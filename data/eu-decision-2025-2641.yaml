    Union og Republikken Korea om overførsel af passagerlisteoplysninger (PNR-oplysninger)
    fra Den Europæiske Union til Republikken Korea med henblik på forebyggelse,
    opdagelse, efterforskning og retsforfølgning af terrorhandlinger og grov kriminalitet
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2025/2641 του Συμβουλίου, της 16ης
