  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2025/2641 od 16. prosinca 2025. o odobravanju otvaranja
    pregovora s Republikom Korejom o sporazumu između Europske unije i Republike
    Koreje o prijenosu podataka iz evidencije podataka o putnicima (PNR) iz Europske
    unije Republici Koreji u svrhu sprečavanja, otkrivanja, istrage i kaznenog progona
    kaznenih djela terorizma i teških kaznenih djela
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2025/2641 határozata (2025. december 16.) az Európai Unió
    és a Koreai Köztársaság közötti, az utasnyilvántartási adatállomány
    (PNR) adatainak a terrorista bűncselekmények és a súlyos bűncselekmények
    megelőzése, felderítése, nyomozása és a vádeljárás lefolytatása céljából
    az Európai Unióból a Koreai Köztársaság részére történő továbbításáról
    szóló megállapodásra irányuló, a Koreai Köztársasággal folytatandó tárgyalások
    megkezdésére való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2025/2641 del Consiglio, del 16 dicembre 2025, che autorizza
    l’avvio di negoziati con la Repubblica di Corea per un accordo tra l’Unione
    europea e la Repubblica di Corea sul trasferimento dei dati del codice di prenotazione
    (Passenger Name Record – PNR) dall’Unione europea alla Repubblica di Corea
    a fini di prevenzione, accertamento, indagine e azione penale nei confronti dei
    reati di terrorismo e dei reati gravi
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2025/2641 (2025. gada 16. decembris), ar ko pilnvaro
