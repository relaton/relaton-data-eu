    и наказателно преследване на терористични
    престъпления и тежки престъпления
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2025/2641 ze dne 16. prosince 2025 o zmocnění k
    zahájení jednání s Korejskou republikou o dohodě mezi Evropskou unií a Korejskou
    republikou o předávání údajů jmenné evidence cestujících (PNR) z Evropské
