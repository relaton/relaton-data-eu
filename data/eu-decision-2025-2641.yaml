title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/2641 of 16 December 2025 authorising the opening
    of negotiations with the Republic of Korea for an agreement between the European
    Union and the Republic of Korea on the transfer of Passenger Name Record (PNR)
    data from the European Union to the Republic of Korea for the prevention, detection,
    investigation and prosecution of terrorist offences and serious crime
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/2641 du Conseil du 16 décembre 2025 autorisant l’ouverture
    de négociations avec la République de Corée en vue d’un accord entre l’Union
    européenne et la République de Corée sur le transfert de données des dossiers
    passagers (PNR) depuis l’Union européenne vers la République de Corée pour
    la prévention et la détection des infractions terroristes et des formes graves
    de criminalité, ainsi que pour les enquêtes et les poursuites en la matière
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/2641 des Rates vom 16. Dezember 2025 über die Ermächtigung
    zur Aufnahme von Verhandlungen mit der Republik Korea über ein Abkommen zwischen
    der Europäischen Union und der Republik Korea über die Übermittlung von Fluggastdatensätzen
    (PNR-Daten) aus der Europäischen Union an die Republik Korea zum Zwecke der Verhütung,
    Aufdeckung, Ermittlung und Verfolgung von terroristischen Straftaten und schwerer
    Kriminalität
  type: main
- language: bg
  script: Cyrl
