  content: Commission Regulation (EEC) No 2276/91 of 29 July 1991 on transitional
    measures regarding the total acidity content of table wines produced in Spain
    and released to the Spanish market for 1991
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2276/91 DE LA COMMISSION du 29 juillet 1991 portant
    mesure transitoire en matière d'' acidité totale des vins de table produits
    en Espagne et mis à la consommation sur le marché de cet État membre pour l''
    année 1991 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2276/91 DER KOMMISSION vom 29. Juli 1991 mit den
    1991 bezüglich des Gesamtsäuregehalts von in Spanien erzeugtem und dort in Verkehr
    gebrachtem Tafelwein anzuwendenden Übergangsmaßnahmen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2276/91 af 29. juli 1991 om en overgangsforanstaltning
    for 1991 vedrørende det totale syreindhold i bordvine, der er produceret i Spanien,
    og som overgår til frit forbrug i denne medlemsstat
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2276/91 της Επιτροπής
    της 29ης Ιουλίου 1991 για μεταβατικά μέτρα όσον
    αφορά την ολική οξύτητα των επιτραπέζιων οίνων
    που παράγονται στην Ισπανία και διατίθενται
    προς κατανάλωση στην αγορά αυτού του κράτους
    μέλους για το 1991
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2276/91 DELLA COMMISSIONE del 29 luglio 1991 recante
    misure transitorie in materia di acidità totale dei vini da tavola prodotti in
    Spagna messi in consumo sul mercato spagnolo nel 1991 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2276/91 VAN DE COMMISSIE van 29 juli 1991 tot vaststelling,
    voor het jaar 1991, van een overgangsmaatregel met betrekking tot het totale zuurgehalte
    van in Spanje vervaardigde tafelwijn die op de markt van deze Lid-Staat ter consumptie
    wordt aangeboden #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2276/91 DA COMISSÃO de 29 de Julho de 1991 que estabelece
    uma medida transitória em matéria de acidez total dos vinhos de mesa produzidos
    em Espanha e introduzidos no consumo no mercado deste Estado-membro em 1991 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2276/91 DE LA COMISIÓN de 29 de julio de 1991 por
    el que se establece una medida transitoria en materia de acidez total de los vinos
    de mesa producidos en España y despachados al consumo en el mercado de dicho
    Estado miembro durante el año 1991 #'
  type: main
