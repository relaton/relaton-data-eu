type: standard
title:
- language: en
  script: Latn
  content: '79/408/EEC: Commission Decision of 4 April 1979 authorizing the French
    Republic not to apply Community treatment to men''s and boys''woven undergarments
    other than shirts, of wool, cotton or man-made textile fibres, falling within
    heading No ex 61.03 of the Common Customs Tariff (NIMEXE codes 61.03-51, 55, 59,
    81, 85, 89) (category 18), originating in the People''s Republic of China and
    in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/408/CEE: Décision de la Commission, du 4 avril 1979, autorisant la
    République française à exclure du traitement communautaire les sous-vêtements
    tissés, autres que chemises et chemisettes pour hommes et garçonnets, de laine,
    de coton ou de fibres textiles synthétiques ou artificielles, de la position
    ex 61.03 du tarif douanier commun (codes Nimexe: 61.03-51, 55, 59, 81, 85, 89)
    (catégorie 18), originaires de la République populaire de Chine et mis en libre
    pratique dans les autres États membres (Le texte en langue française est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/408/EWG: Entscheidung der Kommission vom 4. April 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Unterkleidung
    aus Geweben, andere als Oberhemden, auch Sport- und Arbeitshemden, für Männer
    und Knaben, aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnfasern,
    der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.03-51,
    55, 59, 81, 85, 89) (Kategorie 18) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/408/EØF: Kommissionens beslutning af 4. april 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage underbeklædningsgenstande,
    vævede, andre end skjorter (herunder sports- og arbejdsskjorter) til mænd og
    drenge, af uld, bomuld eller kunstige og syntetiske tekstilfibre, som henhører
    under pos. ex 61.03 i den fælles toldtarif (NIMEXE-nummer 61.03-51, 55, 59, 81,
    85, 89 ; kategori 18), har oprindelse i Den kinesiske Folkerepublik og frit kan
    omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/408/CEE: Decisione della Commissione, del 4 aprile 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario sottovesti tessute,
    diverse dalle camicie e camicette per uomo e per ragazzo, di lana, di cotone o
    di fibre tessili sintetiche o artificiali della voce ex 61.03 della tariffa doganale
    comune (codici Nimexe 61.03-51, 55, 59, 81, 85, 89 - categoria 18), originarie
    della Repubblica popolare cinese e messe in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/408/EEG: Beschikking van de Commissie van 4 april 1979 waarbij de Franse
    Republiek wordt gemachtigd herenonderkleding en jongensonderkleding, geweven,
    andere dan overhemden en sporthemden van wol of katoen of van synthetische of
    kunstmatige textielvezels, van post ex 61.03 van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.03-51, 55, 59, 81, 85, 89) (c (categorie 18), van oorsprong uit
    de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
