title:
- language: en
  script: Latn
  content: '91/21/EEC: Commission Decision of 18 December 1990 amending Commission
    Decision 85/634/EEC authorizing certain Member States to provide for derogations
    from certain provisions of Council Directive 77/93/EEC in respect of oak wood
    originating in Canada or the United States of America (Only the Spanish, Danish,
    German, French, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/21/CEE: Décision de la Commission du 18 décembre 1990 modifiant la
    décision 85/634/CEE autorisant certains États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour le bois de
    chêne originaire du Canada ou des États-Unis d''Amérique (Les textes en langues
    espagnole, danoise, allemande, française, italienne et néerlandaise sont les
    seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '91/21/EWG: Entscheidung der Kommission vom 18. Dezember 1990 zur Änderung
    der Entscheidung 85/634/EWG der Kommission zur Ermächtigung bestimmter Mitgliedstaaten,
    für Eichenholz mit Ursprung in Kanada oder den Vereinigten Staaten von Amerika
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen
    (Nur der spanische, dänische, deutsche, französische, italienische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/21/EØF: Kommissionens beslutning af 18. december 1990 om ændring
    af Kommissionens beslutning 85/634/EØF om bemyndigelse af visse medlemsstater
    til at undtage egetræ med oprindelse i Canada eller USA for visse bestemmelser
    i Rådets direktiv 77/93/EØF (Kun de spanske, danske, tyske, franske, italienske
    og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '91/21/ΕΟΚ: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1990 για την τροποποίηση της απόφασης 85/634/ΕΟΚ
    της Επιτροπής για την παροχή αδείας σε ορισμένα
    κράτη μέλη να παρεκκλίνουν από διατάξεις της
    οδηγίας 77/93/ΕΟΚ του Συμβουλίου, όσον αφορά το
    ξύλο βελανιδιάς, καταγωγής Καναδά ή Ηνωμένων
    Πολιτειών της Αμερικής'
  type: main
- language: it
  script: Latn
  content: '91/21/CEE: Decisione della Commissione del 18 dicembre 1990 recante modifica
    della decisione 85/634/CEE della Commissione che autorizza taluni Stati membri
    a prevedere deroghe a determinate disposizioni della direttiva 77/93/CEE del Consiglio
    per quanto riguarda il legname di quercia originario del Canada o degli Stati
    Uniti d''America (I testi in lingua spagnola, danese, tedesca, francese, italiana
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '91/21/EEG: Beschikking van de Commissie van 18 december 1990 tot wijziging
    van Beschikking 85/634/EEG houdende machtiging van bepaalde Lid-Staten om voor
    eikehout van oorsprong uit Canada of de Verenigde Staten van Amerika afwijking
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts
    de teksten in de Spaanse, de Deense, de Duitse, de Franse, de Italiaanse en de
    Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '91/21/CEE: Decisão da Comissão de 18 de Dezembro de 1990 que altera
    a Decisão 85/634/CEE da Comissão, que autoriza determinados Estados-membros
    a derrogar determinadas disposições da Directiva 77/93/CEE do Conselho em relação
    à madeira de carvalho originária do Canadá ou dos Estados Unidos da América
    (Apenas fazem fé os textos nas línguas espanhola, dinamarquesa, alemã, francesa,
    italiana e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '91/21/CEE: Decisión de la Comisión de 18 de diciembre de 1990 que modifica
    la Decisión 85/634/CEE de la Comisión por la que se autoriza a determinados
    Estados miembros a establecer excepciones a determinadas disposiciones de la Directiva
    77/93/CEE del Consejo respecto de la madera de roble originaria de Canadá o de
    los Estados Unidos de América (Los textos en lenguas española, danesa, alemana,
    francesa, italiana y neerlandesa son los únicos auténticos)'
