id: EUDecision1971288
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 15 juillet 1971, autorisant la République
    française à exclure du traitement communautaire les haut-parleurs et amplificateurs
    électriques de basse fréquence, les appareils récepteurs de radio-diffusion,
    même combinés avec un appareil d'enregistrement et de reproduction du son, des
    positions 85.14 B, 85.15 A Ex III et 92.11 A III du Tarif douanier commun originaires
    du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/288/EWG: Entscheidung der Kommission vom 15. Juli 1971, mit der die
    Französische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Lautsprecher und Tonfrequenzverstärker,
    Empfangsgeräte für Rundfunk, auch mit Tonaufnahme- oder Tonwiedergabegeräten
    kombiniert, und kombinierte Tonaufnahme- und Tonwiedergabegeräte der Tarifnummern
    85.14 B, 85.15 A ex III und 92.11 A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/288/CEE: Decisione della Commissione, del 15 luglio 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli altoparlanti
    ed amplificatori elettrici a bassa frequenza, gli apparecchi radioriceventi anche
    combinati con un apparecchio di registrazione o di riproduzione del suono, e gli
    apparecchi misti di registrazione e di riproduzione del suono, delle voci 85.14
    B, 85.15 A ex III e 92.11 A III, originari del Giappone e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/288/EEG: Beschikking van de Commissie van 15 juli 1971 waarbij de Franse
    Republiek wordt gemachtigd luidsprekers, elektrische laagfrequentversterkers,
    ontvangtoestellen, ook indien met ingebouwd toestel voor het opnemen of voor het
    weergeven van geluid, gecombineerde opname- en weergavetoestellen van de posten
    85.14 B, 85.15 A ex III en 92.11 A III van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
