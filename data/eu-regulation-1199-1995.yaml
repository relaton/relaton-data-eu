title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1199/95 of 29 May 1995 amending Regulation
    (EEC) No 3719/88 laying down common detailed rules for the application of the
    system of import and export licences and advance-fixing certificates for agricultural
    products, to take account of the adjustments necessary for implementing the Agreement
    on Agriculture resulting from the Uruguay Round
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1199/95 de la Commission du 29 mai 1995 modifiant le
    règlement (CEE) n° 3719/88 portant modalités communes d'application du régime
    des certificats d'importation, d'exportation et de préfixation pour les produits
    agricoles en ce qui concerne notamment les adaptations nécessaires à la mise
    en oeuvre de l'accord sur l'agriculture du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1199/95 der Kommission vom 29. Mai 1995 zur Änderung
    der Verordnung (EWG) Nr. 3719/88 über gemeinsame Durchführungsvorschriften für
    die Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für
    landwirtschaftliche Erzeugnisse, insbesondere hinsichtlich der erforderlichen
    Anpassungen zur Anwendung des in der Uruguay-Runde geschlossenen Übereinkommens
    über die Landwirtschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1199/95 af 29. maj 1995 om ændring af
    forordning (EØF) nr. 3719/88 om fælles gennemførelsesbestemmelser for import-
    og eksportlicenser samt forudfastsættelsesattester for landbrugsprodukter, for
    så vidt angår de tilpasninger, der er nødvendige for iværksættelsen af Uruguay-rundens
    landbrugsaftale
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1199/95 της Επιτροπής
    της 29ης Μαΐου 1995 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3719/88 περί κοινών τρόπων εφαρμογής
    του καθεστώτος πιστοποιητικών εισαγωγής, εξαγωγής
    και προκαθορισμού για τα γεωργικά προϊόντα,
    όσον αφορά, ιδίως, τις αναγκαίες προσαρμογές
    για την εφαρμογή της συμφωνίας για τη γεωργία
    η οποία συνάφθηκε στο πλαίσιο του Γύρου της
    Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1199/95, annettu 29 päivänä toukokuuta 1995,
    maataloustuotteiden tuonti-, vienti- ja ennakkovahvistustodistusten järjestelmän
    soveltamista koskevista yhteisistä yksityiskohtaisista säännöistä annetun
    asetuksen (ETY) N:o 3719/88 muuttamisesta erityisesti Uruguayn kierroksen maataloutta
    koskevan sopimuksen täytäntöön panemiseksi tarvittavien mukautusten osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1199/95 della Commissione del 29 maggio 1995 recante
    modifica del regolamento (CEE) n. 3719/88, che stabilisce modalità comuni d'applicazione
    del regime dei titoli d'importazione, di esportazione e di fissazione anticipata
    relativi ai prodotti agricoli, per quanto concerne in particolare gli adattamenti
    necessari all'attuazione degli accordi sull'agricoltura conclusi nell'ambito dell'Uruguay
    Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1199/95 van de Commissie van 29 mei 1995 tot wijziging
    van Verordening (EEG) nr. 3719/88 houdende gemeenschappelijke uitvoeringsbepalingen
    inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten,
    meer in het bijzonder ten aanzien van de Overeenkomst inzake de landbouw in het
    kader van de Uruguay-Ronde
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1199/95 da Comissão de 29 de Maio de 1995 que altera
    o Regulamento (CEE) nº 3719/88 que estabelece normas comuns de execução do
    regime de certificados de importação, de exportação e de prefixação para
    os produtos agrícolas, nomeadamente no que se refere às adaptações necessárias
    para a execução do Acordo sobre a agricultura do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1199/95 de la Comisión de 29 de mayo de 1995 por el
    que se modifica el Reglamento (CEE) n° 3719/88, por el que se establecen disposiciones
    comunes de aplicación del régimen de certificados de importación, de exportación
    y fijación anticipada para los productos agrícolas, en lo que respecta en particular
    a las adaptaciones necesarias para la aplicación del Acuerdo agrícola de la
    Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1199/95 av den 29 maj 1995 om ändring
    av förordning (EEG) nr 3719/88 om gemensamma tillämpningsföreskrifter för
    systemet med import- och exportlicenser och förutfastställelselicencer för
    jordbruksprodukter, särskilt vad avser de anpassningar som är nödvändiga för
    genomförandet av jordbruksavtalet från Uruguayrundan
