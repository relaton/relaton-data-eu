title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 907/2011 of 6 September 2011 amending
    Implementing Regulation (EU) No 1105/2010 imposing a definitive anti-dumping duty
    and collecting definitively the provisional duty imposed on imports of high tenacity
    yarn of polyesters originating in the People’s Republic of China, and terminating
    the proceeding concerning imports of high tenacity yarn of polyesters originating
    in the Republic of Korea and Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 907/2011 du Conseil du 6 septembre
    2011 modifiant le règlement d’exécution (UE) n ° 1105/2010 instituant un
    droit antidumping définitif et portant perception définitive du droit provisoire
    sur les importations de fils de polyesters à haute ténacité originaires de
    la République populaire de Chine, et clôturant la procédure concernant les
    importations de fils de polyesters à haute ténacité en provenance de la République
    de Corée et de Taïwan
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 907/2011 des Rates vom 6. September 2011
