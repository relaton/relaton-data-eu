    eines endgültigen Antidumpingzolls und zur endgültigen Vereinnahmung des vorläufigen
    Zolls auf die Einfuhren hochfester Garne aus Polyestern mit Ursprung in der Volksrepublik
    China und zur Einstellung des Verfahrens betreffend die Einfuhren hochfester Garne
    aus Polyestern mit Ursprung in der Republik Korea und in Taiwan
  type: main
