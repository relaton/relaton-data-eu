  content: '82/797/EEC: Commission Decision of 15 November 1982 establishing that
    the apparatus described as ''Tektronix - Controller Based Transient Digitizer
    System, model WP 2200'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/797/CEE: Décision de la Commission, du 15 novembre 1982, constatant
    que l''importation de l''appareil dénommé "Tektronix - Controller Based Transient
    Digitizer System, model WP 2200" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/797/EWG: Entscheidung der Kommission vom 15. November 1982, mit der
    festgestellt wird, daß das Gerät ,,Tektronix - Controller Based Transient Digitizer
    System, model WP 2200" , unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/797/EØF: Kommissionens beslutning af 15. november 1982 om fastslåelse
    af, at indførsel af apparatet "Tektronix - Controller Based Transient Digitizer
