title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 664/79 of 4 April 1979 re-establishing the
    levying of customs duties on cotton yarn, put up for retail sale, falling within
    heading No 55.06 and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 664/79 de la Commission, du 4 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton conditionnés pour la vente au détail, de la position 55.06 du tarif douanier
    commun, originaires des pays et territoires en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 664/79 der Kommission vom 4. April 1979 zur Wiedereinführung
    des Zollsatzes für Baumwollgarne in Aufmachungen für den Einzelverkauf der Tarifnummer
    55.06, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 664/79 af 4. april 1979 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, i detailsalgsoplægninger,
    under pos. 55.06, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 664/79 della Commissione, del 4 aprile 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai filati di cotone preparati per
    la vendita al minuto, della voce doganale 55.06, originari dei paesi in via di
    sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 664/79 van de Commissie van 4 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    katoen, gereed voor de verkoop in het klein, van post 55.06, van oorsprong uit
    de ontwikkelingslanden en -gebieden, ten behoeve waarvan bij Verordening (EEG)
    nr. 3157/78 van de Raad tariefpreferenties werden geopend
  type: main
