    общата процедура за фиксиране на максималното
    съдържание на остатъчни вещества от ветеринарномедицински
    продукти в храните от животински произход,
    по отношение на моксидектин, линейните алкилбензен
    сулфонови киселини с дължина на алкиловата
    верига от С9 до С13, съдържащи най-малко 2,5 % вериги
    над С13, и ацетилизовалерилтилозина
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 75/2005 ze dne 18. ledna 2005, kterým se mění
