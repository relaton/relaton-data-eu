title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 75/2005 of 18 January 2005 amending Annexes
    I, II and III to Council Regulation (EEC) No 2377/90 laying down a Community procedure
    for the establishment of maximum residue limits of veterinary medicinal products
    in foodstuffs of animal origin as regards moxidectin, linear alkyl benzene sulphonic
    acids with alkyl chain lengths ranging from C9 to C13, containing less than 2,5
    % of chains longer than C13 and Acetylisovaleryltylosin
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 75/2005 de la Commission du 18 janvier 2005 modifiant
    les annexes I, II et III du règlement (CEE) n° 2377/90 du Conseil établissant
    une procédure communautaire pour la fixation des limites maximales de résidus
    de médicaments vétérinaires dans les aliments d'origine animale en ce qui concerne
    la moxidectine, les acides alkyl benzène sulfoniques linéaires dont la longueur
    des chaînes alkyl va de C9 à C13, contenant moins de 2,5 % de chaînes plus
    grandes que C13 et l’acétylisovaléryltylosine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 75/2005 der Kommission vom 18. Januar 2005 zur Änderung
    der Anhänge I, II und III der Verordnung (EWG) Nr. 2377/90 des Rates zur Schaffung
    eines Gemeinschaftsverfahrens für die Festsetzung von Höchstmengen für Tierarzneimittelrückstände
    in Nahrungsmitteln tierischen Ursprungs in Bezug auf Moxidectin, „Lineare Alkylbenzolsulfonsäuren
    mit Alkylkettenlängen im Bereich von C9 bis C13, mit einem Gehalt an Ketten länger
    als C13 von weniger als 2,5 %“ und Acetylisovaleryltylosin
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 75/2005 на Комисията от 18 януари
    2005 година за изменение на приложения I, II и III
