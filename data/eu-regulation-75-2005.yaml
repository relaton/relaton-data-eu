    osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 75/2005/EK rendelete (2005. január 18.) az állati eredetű
    élelmiszerekben található állatgyógyászati készítmények maximális szermaradék-határértékeinek
    megállapítására szolgáló közösségi eljárás kialakításáról szóló
    2377/90/EGK tanácsi rendelet I., II. és III. mellékletének a Moxidectinre,
    a C9-C13 alkil-lánchosszúságú és kevesebb mint 2,5 % C13-nál hosszabb láncot
    tartalmazó lineáris alkil-benzol szulfonsavakra és az acetilizovaleriltilozinra
    vonatkozó módosításáról
  type: main
