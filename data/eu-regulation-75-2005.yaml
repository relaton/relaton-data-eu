    che definisce una procedura comunitaria per la determinazione dei limiti massimi
    di residui di medicinali veterinari negli alimenti di origine animale per quanto
    riguarda la moxidectina, gli acidi benzen sulfonici con catena alchilica lineare
    di lunghezza compresa tra C9 e C13, con un contenuto di catene superiori a C13
    inferiore al 2,5 % e l’acetilisovaleriltilosina
  type: main
