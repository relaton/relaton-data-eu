    postup Společenství pro stanovení maximálních limitů reziduí veterinárních
    léčivých přípravků v potravinách živočišného původu, pokud jde o moxidektin,
    lineární alkylbenzensulfonové kyseliny s alkylovými řetězci s délkou C9
    až C13, obsahující méně než 2,5 % řetězců delších než C13 a acetylisovaleryltylosin
  type: main
