  content: Komission asetus (EY) N:o 75/2005, annettu 18 päivänä tammikuuta 2005,
    yhteisön menettelystä eläinlääkejäämien enimmäismäärien vahvistamiseksi
    eläinperäisissä elintarvikkeissa annetun neuvoston asetuksen (ETY) N:o 2377/90
    liitteiden I, II ja III muuttamisesta moksidektiinin, lineaaristen alkyylibentseenisulfonihappojen,
    joiden alkyyliketjujen pituudet ovat välillä C9 ja C13 ja jotka sisältävät
