title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1049/73 of the Commission of 18 April 1973 re-establishing
    Common Customs Tariff duties on glass inners for vacuum flasks or for other vacuum
    vessels falling within heading No 70.12, originating in developing countries to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1049/73 de la Commission, du 18 avril 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux ampoules en verre pour récipients isolants, de la position tarifaire 70.12,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1049/73 der Kommission vom 18. April 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Glaskolben für Isolierbehälter,
    der Tarifnummer 70.12, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1049/73 af 18. april 1973 om genindførelse
    af told ifølge den fælles toldtarif for glaskolber til termoflasker og lignende
    isotermiske beholdere, under position 70.12 som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1049/73 della Commissione, del 18 aprile 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    ampolle di vetro per recipienti isolanti, della voce doganale n. 70.12 originarie
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1049/73 van de Commissie van 18 april 1973 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor binnenflessen voor thermisch isolerende flessen en voor andere soortgelijke
    isolerende bergingsmiddelen van post 70.12, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 tariefpreferenties werden geopend
  type: main
