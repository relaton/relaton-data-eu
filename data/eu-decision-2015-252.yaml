  script: Latn
  content: Decisione di esecuzione (UE) 2015/252 della Commissione, del 13 febbraio
    2015 , che modifica l'allegato II della decisione 2007/777/CE per quanto riguarda
    la voce relativa agli Stati Uniti nell'elenco di paesi terzi o di parti di paesi
    terzi dai quali l'introduzione nell'Unione di prodotti a base di carne e stomaci,
    vesciche e intestini trattati è autorizzata, in relazione all'influenza aviaria
    ad alta patogenicità [notificata con il numero C(2015) 714]
  type: main
- language: lv
  script: Latn
