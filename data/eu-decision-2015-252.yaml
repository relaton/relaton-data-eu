title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/252 of 13 February 2015 amending
    Annex II to Decision 2007/777/EC as regards the entry for the United States in
    the list of third countries or parts thereof from which the introduction of meat
    products and treated stomachs, bladders and intestines into the Union is authorised
    in relation to highly pathogenic avian influenza (notified under document C(2015)
    714)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/252 de la Commission du 13 février 2015
    modifiant l'annexe II de la décision 2007/777/CE en ce qui concerne les mentions
    relatives aux États-Unis sur la liste des pays tiers ou parties de pays tiers
    à partir desquels l'introduction dans l'Union de produits à base de viande et
    d'estomacs, vessies et boyaux traités est autorisée, pour ce qui est de l'influenza
    aviaire hautement pathogène [notifiée sous le numéro C(2015) 714]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/252 der Kommission vom 13. Februar 2015
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich des Eintrags
    für die Vereinigten Staaten in der Liste der Drittländer bzw. Teile von Drittländern,
    aus denen die Einfuhr von Fleischerzeugnissen und behandelten Mägen, Blasen und
    Därmen in die Union in Bezug auf die hochpathogene Aviäre Influenza gestattet
    ist (Bekanntgegeben unter Aktenzeichen C(2015) 714)
  type: main
