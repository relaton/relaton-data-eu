  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/252 a Comisiei din 13 februarie
    2015 de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește rubrica
    referitoare la Statele Unite ale Americii din lista țărilor terțe sau a părților
    acestora din care se autorizează introducerea în Uniune de produse din carne
    și stomacuri, vezici și intestine tratate, cu privire la gripa aviară înalt
