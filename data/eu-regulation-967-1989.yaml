title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 967/89 of 13 April 1989 amending Regulation
    (EEC) No 486/85 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific States or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 967/89 du Conseil du 13 avril 1989 modifiant le règlement
    (CEE) n° 486/85 relatif au régime applicable à des produits agricoles et à
    certaines marchandises résultant de la transformation de produits agricoles originaires
    des Etats d'Afrique, des Caraïbes et du Pacifique (Etats ACP) ou des pays et
    territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 967/89 DES RATES vom 13. April 1989 zur Aenderung
    der Verordnung (EWG) Nr. 486/85 ueber die Regelung fuer landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean oder in
    den ueberseeischen Laendern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 967/89 af 13. april 1989 om ændring af forordning
    (EØF) nr. 486/85 om den ordning, der skal gælde for landbrugsprodukter og visse
    varer fremstillet af landbrugsprodukter med oprindelse i staterne i Afrika, Vestindien
    og Stillehavet eller i de oversøiske lande og territorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 967/89 του Συμβουλίου
    της 13ης Απριλίου 1989 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 486/85 σχετικά με το καθεστώς
    που εφαρμόζεται στα γεωργικά προϊόντα και
    σε ορισμένα εμπορεύματα που προκύπτουν από
    τη μεταποίηση των γεωργικών προϊόντων καταγομένων
    από τα κράτη της Αφρικής, της Καραϊβικής και
    του Ειρηνικού ( κράτη ΑΚΕ ) ή από υπερπόντιες
    χώρες και διαμερίσματα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 967/89 DEL CONSIGLIO del 13 aprile 1989 che modifica
    il regolamento (CEE) n. 486/85 relativo al regime applicabile a taluni prodotti
    agricoli ed a talune merci risultanti dalla trasformazione di prodotti agricoli,
    originari degli Stati dell'Africa, dei Caraibi e del Pacifico o dei paesi e territori
    d'oltremare
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 967/89 VAN DE RAAD van 13 april 1989 tot wijziging
    van Verordening (EEG) nr. 486/85 inzake de regeling voor landbouwprodukten en
    bepaalde door verwerking van landbouwprodukten verkregen goederen, van oorsprong
    uit de Staten in Afrika, het Caribische Gebied en de Stille Oceaan of uit de landen
    en gebieden overzee
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 967/89 DO CONSELHO de 13 de Abril de 1989 que altera
    o Regulamento (CEE) n* 486/85, relativo ao regime aplicavel a produtos agricolas
    e a determinadas mercadorias resultantes da transformaçao de produtos agricolas
    originarios dos Estados de Africa, das Caraibas e do Pacifico (Estados ACP) ou
    dos paises e territorios ultramarinos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 967/89 DEL CONSEJO de 13 de abril de 1989 por el que
    se modifica el Reglamento (CEE) no 486/85 relativo al régimen aplicable a determinados
    productos agricolas y a determinadas mercancias resultantes de la transformacion
    de productos agricolas originarios de los Estados de Africa, del Caribe y del
    Pacifico (Estados ACP) o de los paises y territorios de Ultramar
  type: main
