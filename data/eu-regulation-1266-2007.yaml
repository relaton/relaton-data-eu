title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1266/2007 of 26 October 2007 on implementing
    rules for Council Directive 2000/75/EC as regards the control, monitoring, surveillance
    and restrictions on movements of certain animals of susceptible species in relation
    to bluetongue
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1266/2007 de la Commission du 26 octobre 2007 portant
    modalités d’application de la directive 2000/75/CE du Conseil en ce qui concerne
    la lutte contre la fièvre catarrhale du mouton, son suivi, sa surveillance et
    les restrictions applicables aux mouvements de certains animaux des espèces qui
    y sont sensibles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1266/2007 der Kommission vom 26. Oktober 2007 mit Durchführungsvorschriften
