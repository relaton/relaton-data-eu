  content: Commission Regulation (EEC) No 3072/92 of 26 October 1992 re- establishing
    the levying of customs duties on products of categories 65 and 72 (order Nos 40.0650
    and 40.0720), originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3072/92 de la Commission, du 26 octobre 1992, portant
