    und 40.0720) mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3072/92 af 26. oktober 1992 om genindførelse
