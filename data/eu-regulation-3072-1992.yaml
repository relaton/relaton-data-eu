    des catégories 65 et 72 (numéros d' ordre 40.0650 et 40.0720) originaires de
    Corée du Sud, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
