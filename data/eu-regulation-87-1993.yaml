  script: Latn
  content: Regolamento (CEE) n. 87/93 della Commissione, del 19 gennaio 1993, recante
    deroga ai regolamenti (CEE) n. 1423/92 e (CEE) n. 3115/92 in ordine ai prezzi
    minimi di acquisto applicabili in Spagna fino al termine della campagna 1992/1993
    per i limoni e le arance consegnati all' industria nonché alle compensazioni
    finanziarie concesse dopo la loro trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 87/93 van de Commissie van 19 januari 1993 tot afwijking
    van de Verordeningen (EEG) nr. 1423/92 en (EEG) nr. 3115/92 voor wat betreft de
    tot het einde van het verkoopseizoen 1992/1993 in Spanje geldende minimumaankoopprijzen
    voor citroenen en sinaasappelen bij levering aan de industrie en financiële vergoedingen
    na verwerking daarvan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 87/93 da Comissão, de 19 de Janeiro de 1993, que
