title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 87/93 of 19 January 1993 derogating from
    Regulations (EEC) No 1423/92 and (EEC) No 3115/92 concerning the minimum purchase
    price for lemons and oranges delivered for processing and the amount of the financial
    compensation after processing of such products applicable in Spain until the end
    of the 1992/93 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 87/93 de la Commission, du 19 janvier 1993, dérogeant
    aux règlements (CEE) n° 1423/92 et (CEE) n° 3115/92 en ce qui concerne les
    prix d' achats minimaux des citrons et des oranges livrés à l' industrie ainsi
    que les compensations financières octroyées après transformation de ces produits
    applicables en Espagne jusqu' à la fin de la campagne 1992/1993
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 87/93 der Kommission vom 19. Januar 1993 zur Abweichung
    von den Verordnungen (EWG) Nr. 1423/92 und (EWG) Nr. 3115/92 hinsichtlich der
    Mindestankaufspreise für zur Verarbeitung gelieferte Zitronen und Apfelsinen
    sowie des nach ihrer Verarbeitung in Spanien bis zum Ende des Wirtschaftsjahres
    1992/93 gewährten Ausgleichs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 87/93 af 19. januar 1993 om undtagelse
    fra forordning (EØF) nr. 1423/92 og (EØF) nr. 3115/92 for så vidt angår minimumsopkøbsprisen
    for citroner og appelsiner, der leveres til forarbejdning, og udligningstilskuddet
    efter forarbejdning af disse produkter gældende i Spanien indtil udgangen af
    produktionsåret 1992/93
  type: main
- language: el
  script: Grek
