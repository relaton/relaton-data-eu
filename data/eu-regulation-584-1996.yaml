  content: Council Regulation (EC) No 584/96 of 11 March 1996 imposing a definitive
    anti-dumping duty on imports of certain tube or pipe fittings, of iron or steel,
    originating in the People's Republic of China, Croatia and Thailand, and collecting
    definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
