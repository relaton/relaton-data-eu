id: EUDecision1979683
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/683/EEC: Commission Decision of 18 July 1979 authorizing the French
    Republic not to apply Community treatment to handkerchiefs, falling within heading
    No ex 61.05 of the Common Customs Tariff (NIMEXE codes 61.05- 20, 30, 90) (categories
    19 and 89), originating in the People''s Republic of China and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/683/CEE: Décision de la Commission, du 18 juillet 1979, autorisant
    la République française à exclure du traitement communautaire les mouchoirs,
    de la position ex 61.05 du tarif douanier commun (codes Nimexe : 61.05- 20, 30,
    90) (catégories 19 et 89), originaires de la République populaire de Chine et
    mis en libre pratique dans les autres États membres (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/683/EWG: Entscheidung der Kommission vom 18. Juli 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Taschentücher
    der Tarifnummer ex 61.05 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.05-20,
    30, 90) (Kategorien 19 und 89) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/683/EØF: Kommissionens beslutning af 18. juli 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage lommetørklæder,
    som henhører under pos. ex 61.05 i den fælles toldtarif (NIMEXE-nummer 61.05-20,
    30, 90; kategori 19 og 89), har oprindelse i Den kinesiske Folkerepublik og frit
    kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/683/CEE: Decisione della Commissione, del 18 luglio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i fazzoletti da
    naso, della voce ex 61.05 della tariffa doganale comune (codici Nimexe: 61.05-20,
    30, 90), categorie 19 e 89, originari della Repubblica popolare cinese e messi
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/683/EEG: Beschikking van de Commissie van 18 juli 1979 waarbij de Franse
    Republiek wordt gemachtigd zakdoeken, van post ex 61.05 van het gemeenschappelijk
    douanetarief (NIMEXE-code 61.05-20, 30, 90) (categorie 19 en 89), van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
