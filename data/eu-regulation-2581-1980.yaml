title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2581/80 of 8 October 1980 re-establishing
    the levying of customs duties on other articles of iron or steel, falling within
    heading No 73.40 and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2581/80 de la Commission, du 8 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres ouvrages
    en fonte, fer ou acier, de la position 73.40 du tarif douanier commun, originaires
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2581/80 der Kommission vom 8. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für andere Waren aus Eisen oder Stahl der Tarifnummer 73.40, mit
    Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2581/80 af 8. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for andre varer af jern og stål, under pos. 73.40
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2581/80 della Commissione, dell' 8 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli altri lavori di ghisa,
    di ferro o di acciaio, della voce 73.40 della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento, (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2581/80 van de Commissie van 8 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor andere werken van gietijzer,
    van ijzer of van staal, van post 73.40, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties
    werden geopend
  type: main
