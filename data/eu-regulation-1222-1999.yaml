title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1222/1999 of 14 June 1999 on periodical sales
    by tender of beef held by certain intervention agencies for export and repealing
    Regulation (EC) No 951/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1222/1999 de la Commission, du 14 juin 1999, relatif
    à la vente, dans le cadre d'une procédure d'adjudication périodique, de viandes
    bovines détenues par certains organismes d'intervention et destinées à être
    exportées et abrogeant le règlement (CE) n° 951/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1222/1999 der Kommission vom 14. Juni 1999 über den
    Verkauf - im Rahmen regelmäßiger Ausschreibungen - von Rindfleisch, das bei
    bestimmten Interventionsstellen eingelagert und zur Ausfuhr bestimmt ist, und
    zur Aufhebung der Verordnung (EG) Nr. 951/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1222/1999 af 14. juni 1999 om salg ved
    periodisk licitation af oksekød, som visse interventionsorganer ligger inde med,
    og som er beregnet til udførsel, samt om ophævelse af forordning (EF) nr. 951/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1222/1999 της Επιτροπής,
    της 14ης Ιουνίου 1999, για την πώληση, με διαγωνισμό,
    βοείου κρέατος που κατέχεται από ορισμένους
    οργανισμούς παρέμβασης και προορίζεται για
    εξαγωγή και για την κατάργηση του κανονισμού
    (ΕΚ) αριθ. 951/1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1222/1999, annettu 14 päivänä kesäkuuta 1999,
    tiettyjen interventioelinten hallussaan pitämän ja vientiin tarkoitetun naudanlihan
    määräaikaisesta myynnistä tarjouskilpailumenettelyllä ja asetuksen (EY) N:o
    951/1999 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1222/1999 della Commissione, del 14 giugno 1999, relativo
    alla vendita, nell'ambito di una procedura di gara periodica, di carni bovine
    detenute da taluni organismi d'intervento e destinate ad essere esportate e recante
    abrogazione del regolamento (CE) n. 951/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1222/1999 van de Commissie van 14 juni 1999 betreffende
    de verkoop, bij periodieke openbare inschrijving en voor uitvoer, van rundvlees
    uit de voorraden van bepaalde interventiebureaus en tot intrekking van Verordening
    (EG) nr. 951/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1222/1999 da Comissão, de 14 de Junho de 1999, relativo
    à venda, por concurso periódico, de carne de bovino na posse de determinados
    organismos de intervenção, com vista à sua exportação e que revoga o Regulamento
    (CE) n° 951/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1222/1999 de la Comisión, de 14 de junio de 1999,
    relativo a la venta, mediante licitación periódica, de carne de vacuno en poder
    de determinados organismos de intervención destinada a su exportación y por
    el que se deroga el Reglamento (CE) n° 951/1999
  type: main
- language: sv
  script: Latn
