title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2232/83 of 3 August 1983 re-establishing
    the levying of customs duties on choline chloride, falling within subheading 29.24
    ex B and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2232/83 de la Commission du 3 août 1983 portant rétablissement
    de la perception des droits de douane applicables au chlorure de choline, de la
    sous-position 29.24 ex B du tarif douanier commun, originaire de Roumanie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2232/83 der Kommission vom 3. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Chlorinchlorid der Tarifstelle 29.24 ex B, mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2232/83 af 3. august 1983 om genindførelse
    af opkrævning af told for cholinchlorid, henhørende under pos. 29.24 ex B og
    med oprindelse i Rumænien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
