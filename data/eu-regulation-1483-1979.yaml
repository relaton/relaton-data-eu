  content: Council Regulation (EEC) No 1483/79 of 16 July 1979 opening, allocating
    and providing for the administration of a Community tariff quota of 5*000 head
    of bulls, cows and heifers, other than those intended for slaughter, of certain
    Alpine breeds, falling within subheading ex 01.02 A II b) of the Common Customs
    Tariff
  type: main
