id: EUDecision1973207
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 July 1973 authorizing the French Republic not
    to apply Community treatment to dehydrated garlic falling within heading No 07.04
    ex B of the Common Customs Tariff, originating in the Poeple's Republic of China
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/207/CEE de la Commission, du 20 juillet 1973, autorisant la
    République française à exclure du traitement communautaire l'ail déshydraté,
    de la position 07.04 Ex B du Tarif douanier commun, originaire de la République
    populaire de Chine et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Juli 1973, mit der die Französiche
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Knoblauchpuder der Tarifnummer 07.04
    ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. juli 1973 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage gørret hvidløg, som henhører
    under position 07.04 ex B i den fælles toldtarif, har oprindelse i folkerepublikken
    Kina og overgår til fri omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 luglio 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario l'aglio disidratato della voce
    n. 07.04 ex B della tariffa doganale comune, originario della Repubblica popolare
    cinese e messo in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 Juli 1973 waarbij de Franse Republiek
    wordt gemachtigd gedehydreerd look van post 07.04 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
