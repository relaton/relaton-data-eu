title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1225/2003 of 9 July 2003 initiating a "new
    exporter" review of Council Regulation (EC) No 1600/1999 imposing definitive anti-dumping
    duties on imports of stainless steel wires with a diameter of 1 mm or more originating
    in India, repealing the duty with regard to imports from one exporter in this
    country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1225/2003 de la Commission du 9 juillet 2003 portant
    ouverture d'un réexamen au titre de "nouvel exportateur" du règlement (CE) n°
    1600/1999 du Conseil instituant un droit antidumping définitif sur les importations
    de fils en aciers inoxydables d'un diamètre égal ou supérieur à un millimètre
    originaires de l'Inde, abrogeant le droit en ce qui concerne les produits d'un
    exportateur de ce pays et soumettant les importations de ces produits à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1225/2003 der Kommission vom 9. Juli 2003 zur Einleitung
    einer Überprüfung (Überprüfung für einen neuen Ausführer) der Verordnung
    (EG) Nr. 1600/1999 zur Einführung endgültiger Antidumpingzölle auf die Einfuhren
    von Draht aus nicht rostendem Stahl mit einem Durchmesser von 1 mm oder mehr mit
    Ursprung in Indien, zur Außerkraftsetzung des Zolls auf die Einfuhren von einem
    ausführenden Hersteller in diesem Land und zur zollamtlichen Erfassung dieser
    Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1225/2003 ze dne 9. července 2003, kterým
    se zahajuje přezkum pro nového vývozce nařízení Rady (ES) č. 1600/1999
    o uložení konečných antidumpingových cel z dovozu drátů z korozivzdorné
    oceli o průměru nejméně 1 mm pocházejících z Indie, kterým se zrušuje
    clo ohledně dovozů jednoho vyvážejícího výrobce z této země a kterým
    se zavádí celní evidence těchto dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1225/2003 af 9. juli 2003 om indledning
    af en fornyet undersøgelse vedrørende en ny eksportør af Rådets forordning
    (EF) nr. 1600/1999 om indførelse af en endelig antidumpingtold på importen af
    tråd af rustfrit stål af diameter 1 mm og derover med oprindelse i Indien, om
    ophævelse af tolden for så vidt angår importen fra en eksportør i dette land
    og om at gøre denne import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1225/2003 της Επιτροπής,
    της 9ης Ιουλίου 2003, για έναρξη επανεξέτασης
    όσον αφορά έναν "νέο εξαγωγέα" στο πλαίσιο του
    κανονισμού (ΕΚ) αριθ. 1600/1999 του Συμβουλίου περί
    επιβολής οριστικού δασμού αντιντάμπινγκ στις
    εισαγωγές συρμάτων από ανοξείδωτο χάλυβα με
    διάμετρο 1 χιλιοστού ή μεγαλύτερη, καταγωγής
    Ινδίας, για την κατάργηση του δασμού όσον αφορά
    τις εισαγωγές ενός εξαγωγέα της ως άνω χώρας
    και για την καταγραφή των εν λόγω εισαγωγών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1225/2003, 9. juuli 2003, millega algatatakse
    uut eksportijat käsitlev läbivaatamine seoses määrusega (EÜ) nr 1600/1999
    Indiast pärit vähemalt 1 mm läbimõõduga roostevaba terastraadi impordi suhtes
    lõpliku dumpinguvastase tollimaksu kehtestamise kohta, tühistatakse tollimaks
    impordile selles riigis paiknevalt ühelt eksportivalt tootjalt ning kehtestatakse
    sellise impordi suhtes registreerimisnõue
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1225/2003, annettu 9 päivänä heinäkuuta 2003,
    lopullisten polkumyyntitullien käyttöönotosta Intiasta peräisin olevan, läpimitaltaan
    vähintään 1 mm:n ruostumattoman teräslangan tuonnissa annettua neuvoston asetusta
    (EY) N:o 1600/1999 koskevan "uuden viejän" tarkastelun vireillepanosta, yhden
    kyseisen maan viejän tuontiin sovellettavan tullin kumoamisesta ja tällaisen
    tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1225/2003/EK Rendelete (2003. július 9.) az Indiából származó
    1 mm vagy annál nagyobb átmérőjű rozsdamentes acélhuzal behozatalára végleges
    dömpingellenes vámok kivetéséről szóló 1600/1999/EK tanácsi rendelettel
    kapcsolatban új exportőr-felülvizsgálat megindításáról, az ebből az országból
    származó egyik exportőrrel kapcsolatban a vámtétel hatályon kívül helyezéséről,
    valamint ezeknek a behozataloknak a nyilvántartásba vételéről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1225/2003 della Commissione, del 9 luglio 2003, recante
    apertura di un riesame relativo ai "nuovi esportatori" del regolamento (CE) n.
    1600/1999 del Consiglio, che istituisce dazi antidumping definitivi sulle importazioni
    di filo di acciaio inossidabile avente un diametro pari o superiore a 1 mm originarie
    dell'India, abroga il dazio per quanto riguarda le importazioni di un esportatore
    di questo paese e stabilisce che tali importazioni siano soggette a registrazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1225/2003 (2003. gada 9. jūlijs), ar kuru attiecībā
    uz jaunu eksportētāju sāk pārskatīt Padomes Regulu (EK) Nr. 1600/1999, ar
    ko uzliek galīgos antidempinga maksājumus, ievedot Indijas izcelsmes nerūsējošā
    tērauda stieples ar 1 mm vai lielāku diametru, atceļ maksājumus par viena
    šīs valsts eksportētāja ievedumiem un nosaka, ka uz šiem ievedumiem attiecas
    reģistrācija
  type: main
- language: lt
  script: Latn
  content: 2003 m. liepos 9 d. Komisijos Reglamentas (EB) Nr. 1225/2003 inicijuojantis
    naujo eksportuotojo peržiūrą pagal Tarybos reglamentą (EB) Nr. 1600/1999,
    nustatantį galutinius antidempingo muitus įvežamiems Indijos kilmės nerūdijančio
    plieno laidams, kurių skersmuo – 1 mm arba didesnis, ir panaikinantį muitą
    įvežamoms vieno šios šalies eksportuotojo prekėms, bei nustatantis, kad šios
    įvežamos prekės būtų registruojamos
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1225/2003 tad-9 ta' Lulju 2003 li
    jagħti bidu għar-reviżjoni esportatur ġdid tar-Regolament tal-Kunsill (KE)
    Nru 1600/1999 li jimponi dazji definittivi anti-dumping fuq l-importazzjonijiet
    ta' wajers ta' l-istainless steel b'djametru ta' 1 mm jew iżjed li joriġinaw
    mill-Indja, wara li jitneħħa d-dazju fuq importazzjonijiet minn esportatur wieħed
    f'dan il-pajjiż u li jagħmlu dawn l-importazzjonijiet bla ħsara għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1225/2003 van de Commissie van 9 juli 2003 tot inleiding
    van een procedure, ten behoeve van een nieuwe exporteur, voor de herziening van
    Verordening (EG) nr. 1600/1999 van de Raad tot instelling van een definitief antidumpingrecht
    op roestvrĳ staaldraad met een diameter van 1 mm of meer uit India, tot intrekking
    van het recht voor een Indiase exporteur en tot registratie van de invoer van
    het product van deze exporteur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1225/2003 z dnia 9 lipca 2003 r. wszczynające
    przegląd pod kątem nowych eksporterów rozporządzenia Rady (WE) nr 1600/1999
    nakładającego ostateczne cła antydumpingowe na przywóz drutu ze stali nierdzewnej
    o średnicy 1 mm lub większej pochodzącego z Indii, uchylające cło w odniesieniu
    do przywozu od jednego eksportera w tym kraju i poddające ten przywóz wymogowi
    rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1225/2003 da Comissão, de 9 de Julho de 2003, que
    inicia um reexame sobre um novo exportador no âmbito do Regulamento (CE) n.°
    1600/1999 do Conselho, que institui direitos anti-dumping definitivos sobre as
    importações de fios de aço inoxidável de diâmetro igual ou superior a 1 mm,
    originários da Índia, e que revoga o direito sobre as importações de um exportador
    indiano, sujeitando-as a registo
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1225/2003 z 9 júla 2003, o začatí preskúmania
    nariadenia Rady (ES) č. 1600/1999, týkajúce sa nového vývozcu, ktorým sa
    uvaľuje definitívne antidumpingové clo na dovoz drôtu z nehrdzavejúcej ocele
    s priemerom minimálne 1 mm s pôvodom v Indii, a ktorým sa opätovne uvaľuje
    clo s ohľadom na dovoz od jedného vývozcu v tejto krajine a končí registrácia
    takéhoto dovozu
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1225/2003 z dne 9. julija 2003 o začetku pregleda
    novega izvoznika Uredbe Sveta (ES) št. 1600/1999 o uvedbi dokončnih protidampinških
    dajatev pri uvozu žice iz nerjavnega jekla premera 1 mm ali več s poreklom iz
    Indije, o razveljavitvi dajatve pri uvozu izvoznika v tej državi in o obvezni
    registraciji tega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1225/2003 de la Comisión, de 9 de julio de 2003, por
    el que se inicia un procedimiento de reconsideración para "un nuevo exportador"
    del Reglamento (CE) n° 1600/1999 del Consejo por el que se establecen derechos
    antidumping definitivos sobre las importaciones de alambre de acero inoxidable
    de diámetro igual o mayor de 1 mm originario de la India, y por el que se deroga
    el derecho aplicable a las importaciones de un exportador de este país y se someten
    a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1225/2003 av den 9 juli 2003 om inledande
    av en översyn, avseende en ny exportör, av rådets förordning (EG) nr 1600/1999
    rörande införande av slutgiltiga antidumpningstullar på import av tråd av
    rostfritt stål med en diameter av minst 1 mm med ursprung i Republiken Indien
    och om upphävande av tullen på import från en exportör i det landet och om
    registrering av denna import
  type: main
