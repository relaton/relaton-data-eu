  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1434/2007 van de Commissie van 5 december 2007 tot
    inleiding van een onderzoek naar de mogelijke ontwijking van de bij Verordening
    (EG) nr. 2074/2004 van de Raad ingestelde antidumpingmaatregelen voor ringbandmechanismen
    van oorsprong uit de Volksrepubliek China door invoer van bepaalde vanuit Thailand
    verzonden ringbandmechanismen, al dan niet enigszins gewijzigd en al dan niet
    aangegeven als van oorsprong uit Thailand, en door invoer van bepaalde enigszins
    gewijzigde ringbandmechanismen van oorsprong uit de Volksrepubliek China, en tot
    registratie van deze invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1434/2007 z dnia 5 grudnia 2007 r. w sprawie
    wszczęcia dochodzenia dotyczącego możliwego obchodzenia środków antydumpingowych
    wprowadzonych rozporządzeniem Rady (WE) nr 2074/2001 w odniesieniu do przywozu
    niektórych kołowych mechanizmów segregatorowych pochodzących z Chińskiej
    Republiki Ludowej poprzez przywóz niektórych kołowych mechanizmów segregatorowych
    wysyłanych z Tajlandii, nieznacznie zmodyfikowanych lub nie, zgłoszonych lub
    niezgłoszonych jako pochodzące z Tajlandii, a także poprzez przywóz niektórych
    nieznacznie zmodyfikowanych kołowych mechanizmów segregatorowych pochodzących
    z Chińskiej Republiki Ludowej i poddające ten przywóz rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1434/2007 da Comissão, de 5 de Dezembro de 2007
    , que inicia um inquérito sobre uma eventual evasão das medidas anti-dumping
    instituídas pelo Regulamento (CE) n.° 2074/2004 do Conselho relativo às importações
    de determinados mecanismos de argolas para encadernação originários da República
    Popular da China através da importação de determinados mecanismos de argolas
    para encadernação expedidos da Tailândia, mesmo ligeiramente modificados e
    mesmo declarados como originários da Tailândia, e através da importação de
    determinados mecanismos de argolas para encadernação ligeiramente modificados
    originários da República Popular da China, e que torna obrigatório o registo
    dessas importações
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1434/2007 al Comisiei din 5 decembrie 2007 de deschidere
    a unei anchete privind o eventuală eludare a măsurilor antidumping instituite
    prin Regulamentul (CE) nr. 2074/2004 al Consiliului privind importurile de anumite
    mecanisme de îndosariat cu inele originare din Republica Populară Chineză prin
    importuri de anumite mecanisme de îndosariat cu inele expediate din Thailanda,
    indiferent dacă au fost sau nu modificate sau indiferent dacă au fost sau nu
    declarate originare din această țară, și prin importuri de anumite mecanisme
    de îndosariat cu inele ușor modificate originare din Republica Populară Chineză,
    și de supunere a acestor importuri la înregistrare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1434/2007 z 5. decembra 2007 , ktorým sa začína
    prešetrovanie týkajúce sa možného obchádzania antidumpingových opatrení
    uložených nariadením Rady (ES) č. 2074/2004 na dovoz určitých mechanizmov
    krúžkových viazačov pochádzajúcich z Čínskej ľudovej republiky prostredníctvom
    dovozu určitých mechanizmov krúžkových viazačov odoslaných z Thajska, nepatrne
    upravených alebo bez zmeny, a bez ohľadu na to, či sa vo vyhlásení uvádza,
    alebo neuvádza, že majú pôvod v Thajsku, a prostredníctvom dovozu určitých
    nepatrne upravených mechanizmov krúžkových viazačov pochádzajúcich z Čínskej
    ľudovej republiky, ktorým sa na takýto dovoz uplatňuje registrácia
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1434/2007 z dne 5. decembra 2007 o začetku preiskave
    glede možnega izogibanja protidampinškim ukrepom, uvedenim z Uredbo Sveta (ES)
    št. 2074/2004 o uvedbi dokončne protidampinške dajatve na uvoz določenih obročkastih
    mehanizmov za mape s poreklom iz Ljudske republike Kitajske, pri uvozu določenih
