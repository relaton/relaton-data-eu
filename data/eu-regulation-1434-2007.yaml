  script: Latn
  content: A Bizottság 1434/2007/EK rendelete ( 2007. december 5. ) a Kínai Népköztársaságból
    származó egyes gyűrűs iratgyűjtő szerkezetek behozatalára a 2074/2004/EK
    tanácsi rendelettel elrendelt dömpingellenes intézkedéseknek a Thaiföldről
    feladott, akár kis mértékben módosított, akár nem, akár Thaiföldről származóként,
    akár nem ilyenként bejelentett egyes gyűrűs iratgyűjtő szerkezetek, valamint
    a Kínai Népköztársaságból származó, kis mértékben módosított egyes
    gyűrűs iratgyűjtő szerkezetek behozatala által megvalósuló esetleges kijátszására
