    iz Ljudske republike Kitajske in o registraciji takšnega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1434/2007 de la Comisión, de 5 de diciembre de 2007
    , por el que se abre una investigación referente a la supuesta elusión de las
    medidas antidumping impuestas por el Reglamento (CE) n° 2074/2004 del Consejo,
    sobre las importaciones de determinados mecanismos para encuadernación con anillos
    originarios de la República Popular China, mediante importaciones de determinados
    mecanismos para encuadernación con anillos procedentes de Tailandia, ligeramente
    modificados o no y declarados o no originarios de este país, y mediante importaciones
    de determinados mecanismos para encuadernación con anillos ligeramente modificados
    originarios de la República Popular China, y por el que se someten dichas importaciones
    a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1434/2007 av den 5 december 2007 om inledande
    av en undersökning rörande eventuellt kringgående av antidumpningsåtgärder,
    som genom rådets förordning (EG) nr 2074/2004 införts beträffande import av
    vissa ringpärmsmekanismer med ursprung i Folkrepubliken Kina, genom import av
    vissa ringpärmsmekanismer som avsänts från Thailand, oavsett om de ändrats
    något eller inte och oavsett om produktens deklarerade ursprung är Thailand
    eller inte, och genom import av vissa något ändrade ringpärmsmekanismer med
    ursprung i Folkrepubliken Kina samt om registrering av sådan import
