  script: Latn
  content: Komission asetus (EY) N:o 1434/2007, annettu 5 päivänä joulukuuta 2007
    , tiettyjen Kiinan kansantasavallasta peräisin olevien rengaskansiomekanismien
    tuonnissa neuvoston asetuksella (EY) N:o 2074/2004 käyttöön otettujen polkumyynnin
