title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1434/2007 of 5 December 2007 on initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 2074/2004 on imports of certain ring binder
    mechanisms originating in the People's Republic of China by imports of certain
    ring binder mechanisms consigned from Thailand, whether slightly modified or not
    and whether declared as originating in Thailand or not, and by imports of certain
    slightly modified ring binder mechanisms originating in the People's Republic
    of China, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1434/2007 de la Commission du 5 décembre 2007 portant
    ouverture d’une enquête sur un éventuel contournement des mesures antidumping
    instituées par le règlement (CE) n° 2074/2004 du Conseil sur les importations
    de certains mécanismes pour reliure à anneaux originaires de la République
    populaire de Chine par des importations de certains mécanismes pour reliure à
    anneaux expédiés de Thaïlande, légèrement modifiés ou non, qu’ils aient
    ou non été déclarés originaires de ce pays, et par des importations de certains
    mécanismes pour reliure à anneaux légèrement modifiés originaires de la République
    populaire de Chine, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1434/2007 der Kommission vom 5. Dezember 2007 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 2074/2004 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter Ringbuchmechaniken mit Ursprung in der Volksrepublik China
    durch die Einfuhren bestimmter aus Thailand versandter Ringbuchmechaniken, ob
    geringfügig geändert oder nicht und ob als Ursprungserzeugnis Thailands angemeldet
    oder nicht, sowie durch die Einfuhren geringfügig geänderter Ringbuchmechaniken
    mit Ursprung in der Volksrepublik China und zur zollamtlichen Erfassung dieser
    Einfuhren
