title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2674/80 of 17 October 1980 amending for
    the third time Regulation (EEC) No 2730/79 laying down common detailed rules for
    the application of the system of export refunds on agricultural products and amending
    Regulation (EEC) No 798/80 laying down detailed rules on the advance payment of
    export refunds and positive monetary compensatory amounts in respect of agricultural
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2674/80 de la Commission, du 17 octobre 1980, portant
    troisième modification du règlement (CEE) n° 2730/79 relatif aux modalités
    communes d' application du régime de restitutions à l' exportation pour les
    produits agricoles et modifiant le règlement (CEE) n° 798/80 portant modalités
    d' application concernant le paiement à l' avance des restitutions à l' exportation
    et des montants compensatoires monétaires positifs pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2674/80 der Kommission vom 17. Oktober 1980 zur dritten
    Änderung der Verordnung (EWG) Nr. 2730/79 über gemeinsame Durchführungsvorschriften
    für Ausfuhrerstattungen bei landwirtschaftlichen Erzeugnissen und zur Änderung
    der Verordnung (EWG) Nr. 798/80 über Durchführungsvorschriften für die Vorfinanzierung
    von Ausfuhrerstattungen und positiven Währungsausgleichsbeträgen bei landwirtschaftlichen
    Erzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2674/80 af 17. oktober 1980 om tredje
    ændring af forordning (EØF) nr. 2730/79 om fælles gennemførelsesbestemmelser
    for eksportrestitutioner for landbrugsprodukter samt om ændring af forordning
    (EØF) nr. 798/80 om gennemførelsesbestemmelser for udbetaling af eksportrestitutioner
    og positive monetære udligningsbeløb for landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2674/80 της Επιτροπής
    της 17ης Οκτωβρίου 1980 περί τρίτης τροποποιήσεως
    του κανονισμού αριθ. 2730/79 «περί κοινών λεπτομερειών
    εφαρμογής του καθεστώτος των επιστροφών κατά
    την εξαγωγή για τα γεωργικά προϊόντα», καθώς
    και περί τροποποιήσεως του κανονισμού αριθ.
    798/80 «περί των λεπτομερειών εφαρμογής σχετικά
    με την εκ των προτέρων πληρωμή των επιστροφών
    κατά την εξαγωγή και των θετικών νομισματικών
    εξισωτικών ποσών για τα γεωργικά προϊόντα»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2674/80 della Commissione, del 17 ottobre 1980, recante
    terza modifica del regolamento (CEE) n. 2730/79, recante modalità comuni di applicazione
    del regime delle restituzioni all' esportazione per i prodotti agricoli e modifica
    del regolamento (CEE) n. 798/80, che stabilisce le modalita per il pagamento anticipato
    delle restituzioni all' esportazione e degli importi compensativi monetari positivi
    per i prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2674/80 van de Commissie van 17 oktober 1980 tot
    derde wijziging van Verordening (EEG) nr. 2730/79 houdende gemeenschappelijke
    uitvoeringsbepalingen inzake het stelsel van restituties bij uitvoer voor landbouwprodukten,
    en tot wijziging van Verordening (EEG) nr. 798/80 houdende uitvoeringsbepalingen
    betreffende de vooruitbetaling van uitvoerrestituties en positieve monetaire compenserende
    bedragen voor landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2674/80 da Comissão, de 17 de Outubro de 1980,
    que altera pela terceira vez o Regulamento (CEE) n.° 2730/79 relativo às regras
    comuns de aplicação do regime de restituições à exportação para os produtos
    agrícolas e que altera o Regulamento (CEE) n.° 798/80 que estabelece regras
    de aplicação referentes ao pagamento antecipado das restituições à exportação
    e dos montantes compensatórios monetários positivos para os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2674/80 de la Comisión, de 17 de octubre de 1980,
    sobre tercera modificación del Reglamento (CEE) n° 2730/79 relativo a las modalidades
    comunes de aplicación del régimen de restituciones a la exportación para los
    productos agrícolas y por el que se modifica el Reglamento (CEE) n° 798/80 sobre
    modalidades de aplicación referentes al pago por anticipado de las restituciones
    a la exportación y de los montantes compensatorios monetarios positivos para
    los productos agrícolas
  type: main
