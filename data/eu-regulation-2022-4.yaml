    lena bhformheastar an tsubstaint ghníomhach tréithchineál PL11 Purpureocillium
    lilacinum mar shubstaint a mbaineann riosca íseal léi i gcomhréir le Rialachán
    (CE) Uimh. 1107/2009 ó Pharlaimint na hEorpa agus ón gComhairle maidir le táirgí
    cosanta plandaí a chur ar an margadh, agus lena leasaítear Rialachán Cur Chun
    Feidhme (AE) Uimh. 540/2011 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/4 оd 4. siječnja 2022. o odobravanju
    aktivne tvari Purpureocillium lilacinum soj PL11 kao tvari niskog rizika u skladu
    s Uredbom (EZ) br. 1107/2009 Europskog parlamenta i Vijeća o stavljanju na tržište
    sredstava za zaštitu bilja te o izmjeni Provedbene uredbe Komisije (EU) br. 540/2011
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/4 végrehajtási rendelete (2022. január 4.) a
    Purpureocillium lilacinum PL11 törzs hatóanyagnak mint kis kockázatú hatóanyagnak
    a növényvédő szerek forgalomba hozataláról szóló 1107/2009/EK európai
    parlamenti és tanácsi rendelet szerinti jóváhagyásáról, továbbá az 540/2011/EU
    bizottsági végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/4 della Commissione del 4 gennaio 2022
    che approva la sostanza attiva Purpureocillium lilacinum ceppo PL11 come sostanza
    a basso rischio, in conformità al regolamento (CE) n. 1107/2009 del Parlamento
    europeo e del Consiglio relativo all’immissione sul mercato dei prodotti fitosanitari,
    e che modifica il regolamento di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/4 (2022. gada 4. janvāris), ar
    ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009 par augu
    aizsardzības līdzekļu laišanu tirgū darbīgo vielu Purpureocillium lilacinum
    celmu PL11 apstiprina par zema riska vielu un groza Komisijas Īstenošanas Regulu
    (ES) Nr. 540/2011
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/4 2022 m. sausio 4 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl augalų
    apsaugos produktų pateikimo į rinką veikliosios medžiagos Purpureocillium
    lilacinum padermė PL11 patvirtinama kaip nedidelės rizikos veiklioji medžiaga
    ir iš dalies keičiamas Komisijos įgyvendinimo reglamentas (ES) Nr. 540/2011
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/4 tal-4 ta’
