    jako substancji niskiego ryzyka, zgodnie z rozporządzeniem Parlamentu Europejskiego
    i Rady (WE) nr 1107/2009 dotyczącym wprowadzania do obrotu środków ochrony
    roślin, oraz w sprawie zmiany rozporządzenia wykonawczego Komisji (UE) nr 540/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/4 da Comissão de 4 de janeiro de 2022
    que aprova a substância ativa Purpureocillium lilacinum estirpe PL11 como substância
    de baixo risco em conformidade com o Regulamento (CE) n.o 1107/2009 do Parlamento
    Europeu e do Conselho relativo à colocação dos produtos fitofarmacêuticos
    no mercado, e que altera o Regulamento de Execução (UE) n.o 540/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/4 al Comisiei din 4 ianuarie
    2022 de aprobare a substanței active Purpureocillium lilacinum tulpina PL11 ca
    substanță cu risc mic în conformitate cu Regulamentul (CE) nr. 1107/2009 al
    Parlamentului European și al Consiliului privind introducerea pe piață a produselor
    fitosanitare, și de modificare a Regulamentului de punere în aplicare (UE) nr.
    540/2011 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/4 zo 4. januára 2022, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 o
    uvádzaní prípravkov na ochranu rastlín na trh schvaľuje účinná látka
    Purpureocillium lilacinum kmeň PL11 ako látka s nízkym rizikom a ktorým sa
    mení vykonávacie nariadenie (EÚ) č. 540/2011
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/4 z dne 4. januarja 2022 o odobritvi
    aktivne snovi Purpureocillium lilacinum, sev PL11, kot snovi z majhnim tveganjem
    v skladu z Uredbo (ES) št. 1107/2009 Evropskega parlamenta in Sveta o dajanju
