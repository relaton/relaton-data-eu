    PL11 bħala sustanza b’riskju baxx f’konformità mar-Regolament (KE) Nru 1107/2009
    tal-Parlament Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta’ prodotti għall-protezzjoni
    tal-pjanti, u li jemenda r-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE)
    Nru 540/2011
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/4 van de Commissie van 4 januari 2022
    tot goedkeuring van de werkzame stof Purpureocillium lilacinum stam PL11 als stof
    met een laag risico overeenkomstig Verordening (EG) nr. 1107/2009 van het Europees
    Parlement en de Raad betreffende het op de markt brengen van gewasbeschermingsmiddelen,
    en tot wijziging van Uitvoeringsverordening (EU) nr. 540/2011 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/4 z dnia 4 stycznia 2022 r.
