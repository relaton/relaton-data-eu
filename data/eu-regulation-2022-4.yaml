title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/4 of 4 January 2022 approving
    the active substance Purpureocillium lilacinum strain PL11 as a low-risk substance
    in accordance with Regulation (EC) No 1107/2009 of the European Parliament and
    of the Council concerning the placing of plant protection products on the market,
    and amending Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/4 de la Commission du 4 janvier 2022
    portant approbation de la substance active «Purpureocillium lilacinum souche
    PL11» en tant que substance à faible risque, conformément au règlement (CE)
    no 1107/2009 du Parlement européen et du Conseil concernant la mise sur le marché
    des produits phytopharmaceutiques, et modifiant le règlement d’exécution (UE)
    no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/4 der Kommission vom 4. Januar 2022
    zur Genehmigung des Wirkstoffs Purpureocillium lilacinum Stamm PL11 als Wirkstoff
    mit geringem Risiko gemäß der Verordnung (EG) Nr. 1107/2009 des Europäischen
    Parlaments und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln
    und zur Änderung der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/4 на Комисията
    от 4 януари 2022 година за одобряване на активното
    вещество Purpureocillium lilacinum, щам PL11, като вещество
    с нисък риск в съответствие с Регламент (ЕО)
    № 1107/2009 на Европейския парламент и на Съвета
    относно пускането на пазара на продукти за
    растителна защита и за изменение на Регламент
    за изпълнение (ЕС) № 540/2011 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/4 ze dne 4. ledna 2022, kterým
    se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009 o
    uvádění přípravků na ochranu rostlin na trh schvaluje účinná látka Purpureocillium
    lilacinum kmen PL11 jako látka představující nízké riziko a mění prováděcí
    nařízení Komise (EU) č. 540/2011
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/4 af 4. januar 2022 om
    godkendelse af aktivstoffet Purpureocillium lilacinum stamme PL11 som lavrisikostof,
    jf. Europa-Parlamentets og Rådets forordning (EF) nr. 1107/2009 om markedsføring
    af plantebeskyttelsesmidler, og om ændring af Kommissionens gennemførelsesforordning
    (EU) nr. 540/2011
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/4 της Επιτροπής
    της 4ης Ιανουαρίου 2022 για την έγκριση της δραστικής
    ουσίας Purpureocillium lilacinum στέλεχος PL11 ως ουσίας
    χαμηλού κινδύνου, σύμφωνα με τον κανονισμό
    (ΕΚ) αριθ. 1107/2009 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου σχετικά με τη διάθεση φυτοπροστατευτικών
