    του εκτελεστικού κανονισμού (ΕΕ) αριθ. 540/2011
    της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/4, 4. jaanuar 2022, millega kiidetakse
    madala riskiastmega ainena heaks toimeaine Purpureocillium lilacinum’i tüvi
    PL11 kooskõlas Euroopa Parlamendi ja nõukogu määrusega (EÜ) nr 1107/2009
    taimekaitsevahendite turulelaskmise kohta ning muudetakse komisjoni rakendusmäärust
    (EL) nr 540/2011
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/4, annettu 4 päivänä tammikuuta
    2022, tehoaineen Purpureocillium lilacinum kanta PL11 hyväksymisestä vähäriskisenä
    tehoaineena kasvinsuojeluaineiden markkinoille saattamisesta annetun Euroopan
    parlamentin ja neuvoston asetuksen (EY) N:o 1107/2009 mukaisesti ja komission
    täytäntöönpanoasetuksen (EU) N:o 540/2011 muuttamisesta
  type: main
- language: ga
  script: Latn
