    (EU) št. 540/2011
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/4 de la Comisión de 4 de enero de 2022
    por el que se aprueba la sustancia activa Purpureocillium lilacinum cepa PL11
    como sustancia de bajo riesgo con arreglo al Reglamento (CE) n.o 1107/2009 del
    Parlamento Europeo y del Consejo, relativo a la comercialización de productos
    fitosanitarios, y se modifica el Reglamento de Ejecución (UE) n.o 540/2011 de
    la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/4 av den 4 januari 2022
    om godkännande av det verksamma ämnet Purpureocillium lilacinum stam PL11 som
