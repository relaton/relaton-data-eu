title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3538/89 of 27 November 1989 fixing, for
    1990 the quota for imports into Spain of meat of domestic rabbits from third countries
    and certain detailed rules for the application thereof and repealing Regulation
    (EEC) No 3868/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3538/89 de la Commission du 27 novembre 1989 fixant,
    pour l'année 1990, le contingent applicable à l'importation en Espagne pour
    la viande de lapins domestiques en provenance des pays tiers et certaines modalités
    pour son application et abrogeant le règlement (CEE) n° 3868/88
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3538/89 DER KOMMISSION vom 27. November 1989 zur
    Festsetzung des 1990 in Spanien anwendbaren Kontingents für die Einfuhr von Fleisch
    von Hauskaninchen aus Drittländern und diesbezüglicher Durchführungsbestimmungen
    sowie zur Aufhebung der Verordnung (EWG) Nr. 3868/88 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3538/89 af 27. november 1989 om fastsættelse
    for 1990 af kontingentet for import til Spanien af tamkaninkød fra tredjelande
    og af visse bestemmelser for dets anvendelse samt om ophævelse af forordning
    (EØF) nr. 3868/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3538/89 της Επιτροπής
    της 27ης Νοεμβρίου 1989 για τον καθορισμό της
    ποσόστωσης, για το έτος 1990, η οποία εφαρμόζεται
    κατά την εισαγωγή στην Ισπανία κρέατος κατοικιδίων
    κουνελιών, προέλευσης τρίτων χωρών, και ορισμένων
    λεπτομερειών που αφορούν την εφαρμογή της,
    και για την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    2868/88
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3538/89 DELLA COMMISSIONE del 27 novembre 1989 che
    fissa il contingente applicabile nel 1990 alle importazioni in Spagna delle carni
    di conigli domestici provenienti dai paesi terzi, stabilisce le relative modalità
    di applicazione e abroga il regolamento (CEE) n. 3868/88 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3538/89 VAN DE COMMISSIE van 27 november 1989 tot
    vaststelling van het contingent voor 1990 dat Spanje kan toepassen bij invoer
    van vlees van tamme konijnen uit derde landen, en van uitvoeringsbepalingen ter
    zake, alsmede tot intrekking van Verordening (EEG) nr. 3868/88 #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3538/89 DA COMISSAO de 27 de Novembro de 1989 que
    fixa, para o ano de 1990, o contingente aplicavel à importaçao em Espanha de
    carne de coelho doméstico proveniente de paises terceiros e determinadas regras
    para a sua aplicaçao e que revoga o Regulamento (CEE) n* 3868/88
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3538/89 DE LA COMISIÓN de 27 de noviembre de 1989
    por el que se establecen para 1990 el contingente aplicable a la importación
    en España de carne de conejo doméstico procedente de terceros países y algunas
    normas de aplicación y por el que se deroga el Reglamento (CEE) no 3868/88 #'
  type: main
