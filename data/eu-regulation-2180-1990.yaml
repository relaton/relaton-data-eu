id: EURegulation21801990
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2180/90 of 24 July 1990 amending for the fourth
    time Regulation (EEC) No 1873/84 authorizing the offer or disposal for direct
    consumption of certain imported wines which may have undergone oenological processes
    not provided for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2180/90 du Conseil du 24 juillet 1990 portant quatrième
    modification du règlement (CEE) n° 1873/84 autorisant l'offre et la livraison
    à la consommation humaine directe de certains vins importés susceptibles d'avoir
    fait l'objet de pratiques oenologiques non prévues par le règlement (CEE) n°
    822/87
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2180/90 DES RATES vom 24. Juli 1990 zur vierten Aenderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingefuehrten Weinen,
    bei denen angenommen werden kann, dass sie Gegenstand von in der Verordnung (EWG)
    Nr. 822/87 nicht vorgesehenen oenologischen Verfahren waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2180/90 af 24. juli 1990 om fjerde ændring
    af forordning (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til
    direkte konsum af visse indførte vine, som eventuelt har været underkastet andre
    ønologiske fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2180/90 του Συμβουλίου
    της 24ης Ιουλίου 1990 για την τέταρτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει
    την προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων δυναμένων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται στον κανονισμό
    (ΕΟΚ) αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2180/90 DEL CONSIGLIO del 24 luglio 1990 recante quarta
    modifica del regolamento (CEE) n. 1873/84 che autorizza l'offerta e la consegna
    per il consumo umano diretto di taluni vini importati che possono essere stati
    sottoposti a pratiche enologiche non previste dal regolamento (CEE) n. 822/87
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2180/90 VAN DE RAAD van 24 juli 1990 tot vierde wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 822/87
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2180/90 DO CONSELHO de 24 de Julho de 1990 que altera
    pela quarta vez o Regulamento (CEE) n* 1873/84, que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptiveis de terem
    sido objecto de praticas enologicas nao previstas no Regulamento (CEE) n* 822/87
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2180/90 DEL CONSEJO de 24 de julio de 1990 por el que
    se modifica, por cuarta vez, el Reglamento (CEE) no 1873/84 por el que se autoriza
    la oferta y la entrega al consumo humano directo de determinados vinos importados
    que pueden haber sido sometidos a practicas enologicas no previstas en el Reglamento
    (CEE) no 822/87
  type: main
