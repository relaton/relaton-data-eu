    gyanúsított személyeknek és a kalóztámadásokkal összefüggésben lefoglalt
    javaknak az Európai Unió által vezetett tengeri erők részéről a Mauritiusi
    Köztársaság részére történő átadására vonatkozó feltételekről, valamint
    a kalóztámadások elkövetésével gyanúsított személyekre az átadást követően
    vonatkozó feltételekről szóló megállapodás aláírásáról és megkötéséről
