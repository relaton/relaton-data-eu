title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 343/94 of 15 February 1994 opening compulsory
    distillation as provided for in Article 39 of Council Regulation (EEC) No 822/87
    and derogating for the 1993/94 wine year from certain detailed rules for the application
    thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 343/94 de la Commission du 15 février 1994 ouvrant
    la distillation obligatoire prévue à l'article 39 du règlement (CEE) n° 822/87
    du Conseil et dérogeant à certaines modalités d'application y afférentes pour
    la campagne 1993/1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 343/94 DER KOMMISSION vom 15. Februar 1994 zur Eröffnung
    der obligatorischen Destillation gemäß Artikel 39 der Verordnung (EWG) Nr. 822/87
    des Rates und zur Abweichung von diesbezüglichen Durchführungsbestimmungen für
    das Wirtschaftsjahr 1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 343/94 af 15. februar 1994 om iværksættelse
    af obligatorisk destillation som omhandlet i artikel 39 i Rådets forordning (EØF)
    nr. 822/87 og om undtagelse fra visse bestemmelser om destillationens gennemførelse
    for produktionsåret 1993/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 343/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 15ης Φεβρουαρίου 1994 για το άνοιγμα υποχρεωτικής
    αποστάξεως που προβλέπεται στο άρθρο 39 του
    κανονισμού (ΕΟΚ) αριθ. 822/87 του Συμβουλίου και
    για την παρέκκλιση ορισμένων σχετικών λεπτομερειών
    εφαρμογής για την περίοδο 1993/94
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 343/94 DELLA COMMISSIONE del 15 febbraio 1994 recante
    apertura della distillazione obbligatoria di cui all' articolo 39 del regolamento
    (CEE) n. 822/87 del Consiglio e recante deroga ad alcune modalità di applicazione
    ad essa relative per la campagna 1993/1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 343/94 VAN DE COMMISSIE van 15 februari 1994 tot instelling
    van de in artikel 39 van Verordening (EEG) nr. 822/87 van de Raad bedoelde verplichte
    distillatie en houdende afwijking van uitvoeringsbepalingen ter zake voor het
    wijnoogstjaar 1993/1994
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 343/94 DA COMISSÃO de 15 de Fevereiro de 1994 que
    abre a destilação obrigatória referida no artigo 39º do Regulamento (CEE)
    nº 822/87 do Conselho e derroga determinadas regras de execução a ela relativas
    para a campanha de 1993/1994
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 343/94 DE LA COMISIÓN de 15 de febrero de 1994 por
    el que se decide iniciar la destilación obligatoria contemplada en el artículo
    39 del Reglamento (CEE) nº 822/87 del Consejo y se establecen casos de excepción
    a algunas de las normas de aplicación correspondientes durante la campaña 1993/94
  type: main
