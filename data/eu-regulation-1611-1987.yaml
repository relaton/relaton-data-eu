title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1611/87 of 9 June 1987 re-establishing the
    levying of customs duties on yarn of man-made fibres (discontinuous or waste),
    products of category 22 (code 40.0220), originating in Mexico, to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1611/87 de la Commission du 9 juin 1987 portant rétablissement
    de la perception des droits de douane applicables aux fils de fibres textiles
    synthétiques de la catégorie de produits n° 22 (code 40.0220), originaires
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1611/87 der Kommission vom 9. Juni 1987 zur Wiedereinführung
    des Zollsatzes für Garne aus synthetischen Spinnfasern der Warenkategorie Nr.
    22 (Kennziffer 40.0220) mit Ursprung in Mexiko, dem die in der Verordnung (EWG)
    Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1611/87 af 9. juni 1987 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre, under varekategori
    nr. 22 (kode 40.0220), som har oprindelse i Mexico og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1611/87 της Επιτροπής
    της 9ης Ιουνίου 1987 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για νήματα από
    συνθετικές υφαντικές ίνες, προϊόντα της κατηγορίας
    22 (κωδικός 40.0220), καταγωγής Μεξικού, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3925/86 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1611/87 della Commissione del 9 giugno 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai filati di fibre tessili sintetiche
    in fiocco della categoria di prodotti n. 22 (codice 40.0220), originari del Messico
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3925/86
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1611/87 van de Commissie van 9 juni 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op garens van
    synthetische stapelvezels, van de categorie van produkten nr. 22 (codenummer 40.0220),
    van oorsprong uit Mexico, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1611/87 da Comissão de 9 de Junho de 1987 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos fios de fibras têxteis sintéticas
    da categoria de produtos n.° 22 (código 40.0220), originários do México, beneficiário
    das preferências pautais previstas no Regulamento (CEE) n.° 3925/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1611/87 de la Comisión de 9 de junio de 1987 relativo
