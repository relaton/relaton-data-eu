  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2295/2002 della Commissione, del 20 dicembre 2002,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di dicembre 2002 nel quadro dei contingenti
    tariffari d'importazione per taluni prodotti del settore delle carni suine per
    il periodo dal 1° gennaio al 31 marzo 2003
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2295/2002 van de Commissie van 20 december 2002 tot
