title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2295/2002 of 20 December 2002 determining
    the extent to which applications lodged in December 2002 for import licences under
    the regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 January to 31 March 2003 can be accepted
  type: main
- language: fr
  script: Latn
