    προσωρινώς την εμπορία δασικού πολλαπλασιαστικού
    υλικού που δεν πληροί τις απαιτήσεις της οδηγίας
    66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '95/423/EY: Komission päätös, tehty 13 päivänä lokakuuta 1995, luvan
    antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivin 66/404/ETY vaatimuksia'
  type: main
- language: it
  script: Latn
  content: '95/423/CE: Decisione della Commissione, del 13 ottobre 1995, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisiti prescritti dalla direttiva
    66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '95/423/EG: Beschikking van de Commissie van 13 oktober 1995 tot machtiging
    van de Lid-Staten om tijdelijk toe te staan dat bosbouwkundig teeltmateriaal dat
    niet beantwoordt aan de vereisten van Richtlijn 66/404/EEG van de Raad in de handel
    wordt gebracht'
  type: main
- language: pt
  script: Latn
  content: '95/423/CE: Decisão da Comissão, de 13 de Outubro de 1995, que autoriza
    os Estados-membros a permitir temporariamente a comercialização de materiais
    florestais de reprodução que não satisfaçam as exigências da Directiva 66/404/CEE
    do Conselho'
  type: main
- language: es
  script: Latn
  content: '95/423/CE: Decisión de la Comisión, de 13 de octubre de 1995, por la
    que se autoriza a los Estados miembros para permitir temporalmente la comercialización
    de material de reproducción forestal que no cumpla los requisitos de la Directiva
    66/404/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '95/423/EG: Kommissionens beslut av den 13 oktober 1995 om bemyndigande
