title:
- language: en
  script: Latn
  content: '95/423/EC: Commission Decision of 13 October 1995 authorizing Member States
    to permit temporarily the marketing of forest reproductive material not satisfying
    the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/423/CE: Décision de la Commission, du 13 octobre 1995, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers ne répondant pas aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '95/423/EG: Entscheidung der Kommission vom 13. Oktober 1995 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '95/423/EF: Kommissionens beslutning af 13. oktober 1995 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '95/423/ΕΚ: Απόφαση της Επιτροπής της 13ης Οκτωβρίου
