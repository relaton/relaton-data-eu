id: EURegulation29791978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2979/78 of 15 December 1978 re-establishing
    the levying of customs duties on appliances, apparatus, accessories and requisites
    for gymnastics or athletics, etc., falling within subheadings 97.06 B and C and
    originating in developing countries, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2979/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux articles
    et engins pour les jeux de plein air, la gymnastique, etc., des sous-positions
    97.06 B et C, originaires des pays en voie de développement bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2979/78 der Kommission vom 15. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für Geräte für Freiluftspiele, Leichtathletik, Gymnastik und
    andere Sportarten, usw., der Tarifstellen 97.06 B und C, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2979/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for redskaber og rekvisitter til udendørsspil
    samt til gymnastik, etc., under underposition 97.06 B og C, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2979/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti ed attrezzi
    per giuochi all' aperto, da ginnastica, ecc., delle sottovoci doganali 97.06 B
    e C, originari dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2979/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten voor artikelen en toestellen
    voor openluchtspelen, voor gymnastiek, enz., van de onderverdelingen 97.06 B en
    C, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad tariefpreferenties werden geopend
  type: main
