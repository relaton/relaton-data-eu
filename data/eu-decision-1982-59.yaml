title:
- language: en
  script: Latn
  content: '82/59/EEC: Commission Decision of 21 December 1981 establishing that the
    apparatus described as ''Tracor gas chromatograph, model 560, with detector, model
    Hall 700A and hydrogen generator, model 15 EHG 2B4'' may not be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/59/CEE: Décision de la Commission, du 21 décembre 1981, constatant
    que l''importation de l''appareil dénommé "TRACOR-Gas Chromatograph, model 560,
    with Detector, model Hall 700 A and hydrogen generator, model 15 EHG 2 B4" ne
    peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/59/EWG: Entscheidung der Kommission vom 21. Dezember 1981, mit der
    festgestellt wird, daß das Gerät ,,TRACOR- Gas Chromatograph, model 560, with
    Detector, model Hall 700A and hydrogen generator, model 15 EHG 2 B4" nicht unter
    Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/59/EØF: Kommissionens beslutning af 21. december 1981 om fastslåelse
    af, at indførsel af apparatet "Tracor-gas chromatograph, model 560, with detector,
    model Hall 700 A and hydrogen generator, model 15 EHG 2B4" ikke kan ske med fritagelse
    for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/59/EOK: Απόφαση τής Επιτροπής τής 21ης Δεκεμβρίου
    1981 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «TRACOR-Gas Chromatograph, model 560, with Detector,
    model Hall 700 A and hydrogen generator, model 15 EHG 2 B4» δέν δύναται
    νά πραγματοποιηθεί ατελώς ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/59/CEE: Decisione della Commissione, del 21 dicembre 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "Tracor gas chromatograph, model
    560, with detector, model Hall 700 A and hydrogen generator, model 15 EHG 2 B4"
    non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/59/EEG: Beschikking van de Commissie van 21 december 1981 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,TRACOR-Gas Chromatograph, model 560, with
    Detector, model Hall 700A and hydrogen generator, model 15 EHG 2B4" niet met vrijstelling
    van de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
