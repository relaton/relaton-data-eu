id: EURegulation14451993
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1445/93 of 11 June 1993 determining the
    operative events applicable to products in the fruit and vegetables sector, to
    processed fruit and vegetable products and partly to live plants and floricultural
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1445/93 de la Commission, du 11 juin 1993, fixant
    les faits générateurs applicables dans le secteur des fruits et légumes, dans
    le secteur des produits transformés à base de fruits et légumes et, partiellement,
    dans le secteur des plantes vivantes et des produits de la floriculture
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1445/93 der Kommission vom 11. Juni 1993 zur Festlegung
    der maßgeblichen Tatbestände im Sektor Obst und Gemüse, im Sektor Verarbeitungserzeugnisse
    aus Obst und Gemüse sowie - teilweise - im Sektor lebende Pflanzen und Waren
    des Blumenhandels
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1445/93 af 11. juni 1993 om fastsættelse
    af de udløsende begivenheder i sektorerne frugt og grønsager og produkter forarbejdet
    på basis af frugt og grønsager, samt i en del af sektoren, levende planter og
    blomsterdyrkningens produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1445/93 της Επιτροπής
    της 11ης Ιουνίου 1993 για τον καθορισμό των γενεσιουργών
    αιτιών που ισχύουν στον τομέα των οπωροκηπευτικών,
    στον τομέα των μεταποιημένων προϊόντων με
    βάση τα οπωροκηπευτικά και, ειδικότερα, στον
    τομέα των ζωντανών φυτών και των προϊόντων
    της ανθοκομίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1445/93, annettu 11 päivänä kesäkuuta 1993,
    hedelmä- ja vihannesalalla, hedelmä- ja vihannesjalostealalla sekä osittain
    elävien kasvien ja kukkaviljelytuotteiden alalla sovellettavista määräytymisperusteista
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1445/93 della Commissione, dell'11 giugno 1993, che
    determina i fatti generatori nel settore degli ortofrutticoli, nel settore dei
    prodotti trasformati a base di ortofrutticoli e, in parte, nel settore delle piante
    vive e dei prodotti della floricoltura
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1445/93 van de Commissie van 11 juni 1993 tot vaststelling
    van de ontstaansfeiten voor de sector groenten en fruit, de sector op basis van
    groenten en fruit verwerkte produkten en, gedeeltelijk, de sector levende planten
    en produkten van de bloementeelt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1445/93 da Comissão, de 11 de Junho de 1993, que
    fixa os factos geradores aplicáveis no sector das frutas e produtos hortícolas,
    no sector dos produtos transformados à base de frutas e produtos hortícolas
    e, parcialmente, no sector das plantas vivas e dos produtos da floricultura
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1445/93 de la Comisión, de 11 de junio de 1993, por
    el que se establecen los hechos generadores aplicables en el sector de las frutas
    y hortalizas, en el sector de los productos transformados a base de frutas y hortalizas
    y, parcialmente, en el sector de las plantas vivas y de los productos de la floricultura
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1445/93 av den 11 juni 1993 om fastställande
    av de avgörande händelserna för produkter inom frukt- och grönsakssektorn,
    för bearbetade frukter och grönsaker och för vissa levande växter och snittblommor
  type: main
