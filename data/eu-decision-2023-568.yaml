title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/568 of 9 March 2023 on the position to be taken
    on behalf of the Union in the 228th session of the Council of the International
    Civil Aviation Organization (ICAO) as regards the adoption of Amendment 93 to
    Annex 10 – Aeronautical Telecommunications, Volume I – Radio Navigation Aids
    of the Convention on International Civil Aviation and of the amendment to the
    Technical instructions for the safe transport of dangerous goods by air to permit
    active tracking devices powered by small lithium batteries in checked baggage
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/568 du Conseil du 9 mars 2023 relative à la position
    à prendre au nom de l’Union lors de la 228e session du Conseil de l’Organisation
    de l’aviation civile internationale (OACI) en ce qui concerne l’adoption de
    l’amendement 93 à l’annexe 10 — Télécommunications aéronautiques, volume
    I — Aides radio à la navigation, de la convention relative à l’aviation
    civile internationale et l’adoption de l’amendement aux instructions techniques
    pour la sécurité du transport aérien des marchandises dangereuses afin d’autoriser
    le transport, dans les bagages enregistrés, de dispositifs de localisation actifs
    alimentés par de petites batteries au lithium
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/568 des Rates vom 9. März 2023 über den im Namen
    der Union auf der 228. Tagung des Rates der Internationalen Zivilluftfahrt-Organisation
    (ICAO) zu vertretenden Standpunkt in Bezug auf die Annahme der Änderung 93 zu
    Anhang 10, „Aeronautical Telecommunications“ (Flugfernmeldeverkehr), Band
    I, „Radio Navigation Aids“ (Funknavigationshilfen), des Abkommens über die
    internationale Zivilluftfahrt und der Änderung der Technischen Anweisungen für
    die sichere Beförderung gefährlicher Güter im Luftverkehr im Hinblick auf die
    Erlaubnis, eingeschaltete Ortungsgeräte, die mit kleinen Lithiumbatterien betrieben
    werden, in aufgegebenem Gepäck mitzuführen
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/568 на Съвета от 9 март 2023 година
    относно позицията, която да бъде заета от името
    на Съюза на 228-ата сесия на Съвета на Международната
    организация за гражданско въздухоплаване
    (ИКАО) във връзка с приемането на изменение
    93 на приложение 10 – Аеронавигационни телекомуникации,
    том I – Радионавигационни средства към Конвенцията
    за международното гражданско въздухоплаване
    и на изменението на техническите инструкции
    за безопасен въздушен превоз на опасни товари,
    за да се позволи използването в регистрирания
    багаж на устройства за активно проследяване,
    захранвани от малки литиеви батерии
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/568 ze dne 9. března 2023 o postoji, který
