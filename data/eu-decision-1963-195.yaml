title:
- language: fr
  script: Latn
  content: Décision de la Commission portant nouvelle modification de sa décision
    du 9 octobre 1962, autorisant la perception de taxes compensatoires sur les importations,
    dans la République française, de chocolat, de confiseries et préparations comportant
    du cacao ou du chocolat, sans liqueur alcoolique, en provenance des autres États
    membres
  type: main
- language: de
  script: Latn
  content: '63/195/EWG: Entscheidung der Kommission über eine neue Änderung ihrer
    Entscheidung vom 9. Oktober 1962 über die Erhebung von Ausgleichsabgaben auf
    Einfuhren von Schokolade, Schokoladewaren und von kakaohaltigen Zuckerwaren, nicht
    alkoholhaltig, sowie von kakaohaltigen. oder schokoladehaltigen Zubereitungen,
    aus den anderen Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '63/195/CEE: Decisione della Commissione relativa ad una nuova modifica
    della propria decisione del 9 ottobre 1962, che autorizza la riscossione di tasse
    di compensazione sulle importazioni in Francia di cioccolata, di dolciumi e di
    preparazioni contenenti cacao o cioccolata, senza alcolici, in provenienza dagli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/195/EEG: Beschikking van de Commissie tot wijziging van haar beschikking
    van 9 oktober 1962, houdende machtiging tot het leggen van compenserende heffingen
    op de invoer in de Franse Republiek van chocolade, en van suikerwerk en voedingsmiddelen
    met cacao of met chocolade, zonder likeur, uit de andere Lid-Staten'
  type: main
