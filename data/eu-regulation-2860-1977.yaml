title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2860/77 of 19 December 1977 increasing the
    volume of the Community tariff quota opened for the period 1 July 1977 to 30 June
    1978 by Regulation (EEC) No 1331/77 for heifers and cows, not intended for slaughter,
    of certain mountain breeds falling within subheading ex 01.02 A II b) of the Common
    Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2860/77 du Conseil, du 19 décembre 1977, portant
    augmentation du volume du contingent tarifaire communautaire ouvert, pour la période
    du 1er juillet 1977 au 30 juin 1978, par le règlement (CEE) n° 1331/77, pour
    des génisses et vaches, autres que celles destinées à la boucherie, de certaines
    races de montagne, relevant de la sous-position EX 01.02 A II b) du tarif douanier
    commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2860/77 des Rates vom 19. Dezember 1977 zur Erhöhung
    des für die Zeit vom 1. Juli 1977 bis zum 30. Juni 1978 mit Verordnung (EWG)
    Nr. 1331/77 eröffneten Gemeinschaftszollkontingents für Färsen und Kühe bestimmter
    Höhenrassen, nicht zum Schlachten, der Tarifstelle ex 01.02 A II b) des Gemeinsamen
    Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2860/77 af 19. december 1977 om udvidelse
    af det toldkontingent, der ved forordning (EØF) nr. 1331/77 er åbnet for kvier
    og køer af visse bjergracer, undtagen for kvier og køer bestemt for slagtning,
    henhørende under pos. ex 01.02 A II b) i den fælles toldtarif, for perioden
    1. juli 1977 til 30. juni 1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2860/77 del Consiglio, del 19 dicembre 1977, recante
    aumento del volume del contingente tariffario comunitario aperto, per il periodo
    dal 1 luglio 1977 al 30 giugno 1978, dal regolamento (CEE) n. 1331/77, per giovenche
    e vacche, diverse da quelle destinate alla macellazione, di alcune razze di montagna
    della sottovoce ex 01.02 A II b) della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2860/77 van de Raad van 19 december 1977 houdende
    verhoging van het communautair tariefcontingent dat voor het tijdvak van 1 juli
    1977 tot en met 30 juni 1978 is geopend bij Verordening (EEG) nr. 1331/77, voor
    vaarzen en koeien, niet bestemd voor de slacht, van bepaalde bergrassen, van onderverdeling
    ex 01.02 A II b) van het gemeenschappelijk douanetarief
  type: main
