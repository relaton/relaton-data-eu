title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1454/73 of the Commission of 30 May 1973 re-establishing
    Common Customs Tariff duties on wrought plates, sheets and strip, of aluminium,
    falling within heading No 76.03, originating in Yugoslavia to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1454/73 de la Commission, du 30 mai 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux tôles, planches, feuilles et bandes en aluminium, de la position tarifaire
    76.03, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1454/73 der Kommission vom 30. Mai 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Bleche, Platten, Tafeln und Bänder,
    aus Aluminium, mit einer Dicke von mehr als 0,20 mm, der Tarifnummer 76.03, mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG)Nr. 2762/72 des Rates
    vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1454/73 af 30. maj 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for plader og bånd, af aluminium under
    position 76.03 som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1454/73 della Commissione, del 30 maggio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    lamiere, lastre, fogli e nastri, di alluminio, di spessore superiore a 0,20 mm
    della voce doganale n. 76.03, originari della Iugoslavia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) 2762/72 del Consiglio, del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1454/73 van de Commissie van 30 mei 1973 houdende
    wederinvoering van heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op platen, bladen en strippen, van aluminium, met een dikte van
    meer dan 0,20 mm, van post 76.03, van oorsprong uit Joegoslavië, ten behoeve
    waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december 1972 algemene
    tariefpreferenties werden geopend
  type: main
