---
id: EUDecision20221497
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1497 of 8 September 2022 determining
    whether a product containing ‘Capsicum oleoresin expeller pressed’ is a biocidal
    product, pursuant to Article 3(3) of Regulation (EU) No 528/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1497 de la Commission du 8 septembre
    2022 déterminant, en vertu de l’article 3, paragraphe 3, du règlement (UE)
    no 528/2012 du Parlement européen et du Conseil, si un produit contenant de l’«oléorésine
    de Capsicum extraite par pression» est un produit biocide
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1497 der Kommission vom 8. September
    2022 zur Feststellung, ob es sich bei einem „expellergepresstes Capsicum-Oleoresin“
    enthaltenden Produkt um ein Biozidprodukt gemäß Artikel 3 Absatz 3 der Verordnung
    (EU) Nr. 528/2012 des Europäischen Parlaments und des Rates handelt
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1497 на Комисията
    от 8 септември 2022 година за определяне дали
    продукт, съдържащ пресован експелер от масла-смоли,
    извлечени от растения от рода Capsicum, е биоцид
    в съответствие с член 3, параграф 3 от Регламент
    (ЕС) № 528/2012 на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1497 ze dne 8. září 2022,
    kterým se stanoví, zda se přípravek obsahující „lisované expelery oleoresinu
    z paprik (Capsicum)“ považuje za biocidní přípravek podle čl. 3 odst. 3
    nařízení Evropského parlamentu a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1497 af 8. september
    2022 om fastlæggelse af, hvorvidt et produkt indeholdende »expellerpresset oleoresin
    af Capsicum« er et biocidholdigt produkt i henhold til artikel 3, stk. 3, i Europa-Parlamentets
    og Rådets forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1497 της Επιτροπής
    της 8ης Σεπτεμβρίου 2022 που καθορίζει κατά πόσον
    ένα προϊόν που περιέχει «ελαιορητίνη Capsicum
    από έκθλιψη σε πιεστήριο βιδωτού τύπου» είναι
    βιοκτόνο, σύμφωνα με το άρθρο 3 παράγραφος 3
    του κανονισμού (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1497, 8. september 2022, millega määratakse
    vastavalt Euroopa Parlamendi ja nõukogu määruse (EL) nr 528/2012 artikli 3
    lõikele 3 kindlaks, kas Capsicum’i pressitud õlivaiku sisaldav toode on biotsiid
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1497, annettu 8 päivänä
    syyskuuta 2022, sen määrittämisestä, onko paprikauutetta (oleoresin capsicum)
    sisältävä tuote biosidivalmiste, Euroopan parlamentin ja neuvoston asetuksen
    (EU) N:o 528/2012 3 artiklan 3 kohdan mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1497 ón gCoimisiún an 8 Meán Fómhair
    2022 lena gcinntear an táirge bithicídeach é táirge ina bhfuil “Capsicum
    oleoresin expeller pressed”, de bhun Airteagal 3(3) de Rialachán (AE) Uimh.
    528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1497 оd 8. rujna 2022. o utvrđivanju
    je li proizvod koji sadržava „Capsicum oleorezinu dobivenu strojnim prešanjem”
    biocidni proizvod na temelju članka 3. stavka 3. Uredbe (EU) br. 528/2012 Europskog
    parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1497 végrehajtási határozata (2022. szeptember
    8.) az 528/2012/EU európai parlamenti és tanácsi rendelet 3. cikkének (3)
    bekezdése alapján egy „expellerrel préselt capsicum oleorezint” tartalmazó
    termék biocid termékként való lehetséges besorolásának meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1497 della Commissione dell'8 settembre
    2022 che stabilisce se un prodotto contenente «estratto di oleoresina di Capsicum
    pressato» sia un biocida a norma dell’articolo 3, paragrafo 3, del regolamento
    (UE) n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1497 (2022. gada 8. septembris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulas (ES) Nr. 528/2012 3.
    panta 3. punktu nosaka, vai “Capsicum ģints augu augļu izspaidu oleosveķus”
    saturošs līdzeklis ir biocīds
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1497 2022 m. rugsėjo 8 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamento (ES) Nr. 528/2012 3 straipsnio
    3 dalį nustatoma, ar produktas, kurio sudėtyje yra presu išspausto paprikų
    dervingojo aliejaus, yra biocidinis produktas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1497 tat-8
    ta’ Settembru 2022 li tiddetermina, skont l-Artikolu 3(3) tar-Regolament (UE)
    Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill, jekk prodott li fih “l-oleoreżina
    tal-Capsicum ippressata b-espellent” huwiex prodott bijoċidali
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1497 van de Commissie van 8 september 2022
    tot bepaling of een product dat “door persing verkregen Capsicum-oleohars”
    bevat een biocide is, overeenkomstig artikel 3, lid 3, van Verordening (EU) nr.
    528/2012 van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1497 z dnia 8 września 2022 r. w
    sprawie określenia, czy produkt zawierający „wytłok z oleożywicy Capsicum”
    jest produktem biobójczym, na podstawie art. 3 ust. 3 rozporządzenia Parlamentu
    Europejskiego i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1497 da Comissão de 8 de setembro de
    2022 que determina se um produto contendo «oleorresina de Capsicum extraída
    por pressão» é um produto biocida nos termos do artigo 3.o, n.o 3, do Regulamento
    (UE) n.o 528/2012 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1497 a Comisiei din 8 septembrie
    2022 de stabilire, în temeiul articolului 3 alineatul (3) din Regulamentul (UE)
    nr. 528/2012 al Parlamentului European și al Consiliului, a faptului dacă un
    produs care conține „oleorășină de Capsicum presată” este un produs biocid
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1497 z 8. septembra 2022, ktorým
    sa podľa článku 3 ods. 3 nariadenia Európskeho parlamentu a Rady (EÚ) č.
    528/2012 určuje, či výrobok obsahujúci lisovaný výlisok olejoživice z paprík
    rodu Capsicum je biocídnym výrobkom
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1497 z dne 8. septembra 2022 o določitvi,
    ali je proizvod, ki vsebuje „Oleoresin iz paprik rodu Capsicum, pridobljen s
    polžasto stiskalnico“, biocidni proizvod, v skladu s členom 3(3) Uredbe (EU)
    št. 528/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1497 de la Comisión de 8 de septiembre
    de 2022 por la que se determina si un producto que contiene «oleorresina de Capsicum
    prensada por expulsor» es un biocida, de conformidad con el artículo 3, apartado
    3, del Reglamento (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1497 av den 8 september 2022
    om fastställande av huruvida en produkt som innehåller expellerpressat extrakt
    av Capsicum är en biocidprodukt i enlighet med artikel 3.3 i Europaparlamentets
    och rådets förordning (EU) nr 528/2012
  type: main
