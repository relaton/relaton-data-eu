  content: KOMMISSIONENS FÖRORDNING (EG) nr 199/98 av den 26 januari 1998 om fastställande
    av i vilken utsträckning ansökningar om importlicenser får godkännas som inlämnas
    i januari 1998 för vissa produkter inom sektorn för mjölk och mjölkprodukter
    inom ramen för ordningarna i Europaavtalen mellan gemenskapen och Ungern, Tjeckien,
