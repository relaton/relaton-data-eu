    e la Repubblica slovena
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 199/98 VAN DE COMMISSIE van 26 januari 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector melk en zuivelproducten, die in januari 1998
    worden ingediend op grond van de regelingen waarin is voorzien bij de Europa-overeenkomsten
    tussen, enerzijds, de Gemeenschap en, anderzijds, de Republiek Hongarije, de Tsjechische
    Republiek, de Slowaakse Republiek en Roemenië, van de regeling waarin is voorzien
    bij de overeenkomsten betreffende vrijhandel en met handel verband houdende zaken
    tussen de Gemeenschap en de Baltische staten, en van de regeling waarin is voorzien
    bij de Interim-overeenkomst tussen de Gemeenschap en Slovenië
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 199/98 DA COMISSÃO de 26 de Janeiro de 1998 que determina
    a medida em que podem ser aceites os pedidos de certificados de importação introduzidos
    em Janeiro de 1998 para determinados produtos do sector de leite e dos produtos
    lácteos no âmbito dos regimes previstos nos acordos europeus entre a Comunidade
    e a República da Hungria, a República Checa, a República Eslovaca e a Roménia,
    do regime previsto nos acordos sobre comércio livre entre a Comunidade e os países
    bálticos e do regime previsto no acordo provisório entre a Comunidade e a Eslovénia
  type: main
- language: es
