  content: REGLAMENTO (CE) N° 199/98 DE LA COMISIÓN de 26 de enero de 1998 por el
    que se determina en qué medida podrán aceptarse las solicitudes de certificados
    de importación presentadas en enero de 1998 relativas a determinados productos
    del sector de la leche y de los productos lácteos en el ámbito de los regímenes
    previstos en los Acuerdos europeos entre la Comunidad y la República de Hungría,
    la República Checa, la República Eslovaca y Rumania, del régimen previsto en
    los Acuerdos de libre comercio entre la Comunidad y los Países Bálticos y del
    régimen previsto en el Acuerdo interino entre la Comunidad y Eslovenia
  type: main
