title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 199/98 of 26 January 1998 determining the
    extent to which applications for import licences submitted in January 1998 for
    certain products in the milk and milk products sector under the schemes provided
    for in the Europe Agreements between the Community and the Republic of Hungary,
    the Czech Republic, the Slovak Republic and Romania, in the Agreements on free
    trade between the Community and the Baltic States and in the Interim Agreement
    between the Community and the Republic of Slovenia may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 199/98 DE LA COMMISSION du 26 janvier 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 1998 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre des régimes prévus par les accords européens entre la
    Communauté et la République de Hongrie, la République tchèque, la République
    slovaque et la Roumanie, du régime prévu par les accords sur la libéralisation
    des échanges entre la Communauté et les pays baltes et du régime prévu par
    l'accord intérimaire entre la Communauté et la Slovénie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 199/98 DER KOMMISSION vom 26. Januar 1998 über den
    Umfang, in dem den Anträgen auf Einfuhrlizenzen für bestimmte Milch- und Milcherzeugnisse
    stattgegeben werden kann, die im Januar 1998 im Rahmen der Regelungen gemäß
    den Europa-Abkommen zwischen der Gemeinschaft und der Republik Ungarn, der Tschechischen
    Republik, der Slowakischen Republik und Rumänien, der Regelung gemäß dem Freihandelsabkommen
    zwischen der Gemeinschaft und den Baltischen Staaten und der Regelung gemäß
    dem Interimsabkommen zwischen der Gemeinschaft und Slowenien eingereicht wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 199/98 af 26. januar 1998 om fastsættelse
    af, i hvilket omfang de ansøgninger, der i januar 1998 er indgivet om importlicens
    for visse produkter i sektoren for mælk og mejeriprodukter i henhold til ordningerne
    i Europaaftalerne mellem Fællesskabet og Republikken Ungarn, Den Tjekkiske Republik,
    Den Slovakiske Republik og Rumænien, ordningen i aftalerne om liberalisering
    af samhandelen mellem Fællesskabet og De Baltiske Lande og ordningen i interimsaftalen
    mellem Fællesskabet og Slovenien, kan accepteres
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 199/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 26ης Ιανουαρίου 1998 για τον προσδιορισμό
    του μέτρου κατά το οποίο μπορούν να γίνονται
    δεκτές οι αιτήσεις πιστοποιητικών εισαγωγής
    που υπεβλήθησαν τον Ιανουάριο του 1998 για ορισμένα
    προϊόντα στον τομέα του γάλακτος και των γαλακτοκομικών
