  content: Commission Regulation (EC) No 2918/95 of 18 December 1995 laying down detailed
    rules for the application of Council Regulation (EC) No 2337/95 establishing a
    system of compensation for the additional costs incurred in the marketing of certain
    fishery products from the Azores, Madeira, the Canary Islands and the French department
    of Guiana as a result of their very remote location
  type: main
- language: fr
  script: Latn
