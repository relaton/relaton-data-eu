    em produtos biocidas do tipo 18, em conformidade com o Regulamento (UE) n.o 528/2012
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/952 a Comisiei din 22 mai 2025
