    af produkttype 18, jf. Europa-Parlamentets og Rådets forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2025/952 της Επιτροπής,
