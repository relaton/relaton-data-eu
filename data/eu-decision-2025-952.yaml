    patvirtinimo, kad S-metopreną galima naudoti 18-o tipo biocidiniams produktams
    gaminti, galiojimo pabaigos data
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/952 tat-22
