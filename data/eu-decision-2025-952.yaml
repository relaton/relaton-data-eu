    għall-użu fil-prodotti bijoċidali tat-tip ta’ prodott 18 f’konformità
    mar-Regolament (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2025/952 van de Commissie van 22 mei 2025 tot verlenging
