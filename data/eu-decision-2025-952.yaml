    aegumise kuupäeva vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) nr
    528/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2025/952, annettu 22 päivänä
    toukokuuta 2025, s-metopreenin käyttöä valmisteryhmään 18 kuuluvissa biosidivalmisteissa
    koskevan hyväksymisen voimassaolon päättymispäivän lykkäämisestä Euroopan
    parlamentin ja neuvoston asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2025/952 ón gCoimisiún an 22 Bealtaine
    2025 lena gcuirtear ar atráth dáta éaga an fhormheasa maidir le S-meitipréin
    lena húsáid i dtáirgí bithicídeacha de chineál táirge 18 i gcomhréir le
    Rialachán (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2025/952 оd 22. svibnja 2025. o odgodi
