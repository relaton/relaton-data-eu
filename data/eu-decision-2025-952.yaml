    reportant la date d’expiration de l’approbation du (S)-méthoprène en vue
    de son utilisation dans les produits biocides relevant du type de produits 18,
    conformément au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/952 der Kommission vom 22. Mai 2025 zur
    Verschiebung des Ablaufdatums der Genehmigung für S-Methopren zur Verwendung
    in Biozidprodukten der Produktart 18 gemäß der Verordnung (EU) Nr. 528/2012
    des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
