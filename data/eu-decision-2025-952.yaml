    v biocidních přípravcích typu 18 v souladu s nařízením Evropského parlamentu
    a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/952 af 22. maj 2025 om
