    do grupy produktowej 18 zgodnie z rozporządzeniem Parlamentu Europejskiego i
    Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/952 da Comissão, de 22 de maio de 2025,
