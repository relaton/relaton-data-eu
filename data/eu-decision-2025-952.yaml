title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/952 of 22 May 2025 postponing
    the expiry date of the approval of S-methoprene for use in biocidal products of
    product-type 18 in accordance with Regulation (EU) No 528/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
