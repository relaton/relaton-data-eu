    papirja s poreklom iz Republike Koreje v zvezi s skupino Hansol in spremembi preostale
    dajatve
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2023/593 de la Comisión de 16 de marzo de
