title:
- language: en
  script: Latn
  content: '80/1001/EEC: Commission Decision of 8 October 1980 authorizing the French
    Republic to apply protective measures to certain live sheep and sheepmeat originating
    in third countries (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1001/CEE: Décision de la Commission, du 8 octobre 1980, autorisant
    la France à appliquer des mesures de protection à certains animaux vivants de
    l''espèce ovine et à certaines viandes ovines originaires des pays tiers (Le
    texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1001/EWG: Entscheidung der Kommission vom 8. Oktober 1980 zur Ermächtigung
    der Französischen Republik, Schutzmaßnahmen hinsichtlich bestimmter Arten lebender
    Schafe und von Schaffleisch mit Ursprung in Drittländern zu ergreifen (Nur der
    französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1001/EØF: Kommissionens beslutning af 8. oktober 1980 om bemyndigelse
    til Den franske Republik til at anvende beskyttelsesforanstaltninger over for
    indførsler af får, levende, og af fårekød, med oprindelse i tredjelande (Kun
    den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1001/CEE: Decisione della Commissione, dell''8 ottobre 1980, che autorizza
    la Repubblica francese ad applicare misure di protezione a taluni animali vivi
    della specie ovina e a talune carni ovine, originari dei paesi terzi (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1001/EEG: Beschikking van de Commissie van 8 oktober 1980 waarbij Frankrijk
    wordt gemachtigd beschermende maatregelen te nemen bij de invoer van levende schapen
    en van schapevlees van oorsprong uit derde landen (Slechts de tekst in de Franse
    taal is authentiek)'
