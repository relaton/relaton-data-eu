title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/272 of 16 February 2017 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Implementing Regulation (EU) No 1331/2011 on imports of certain
    seamless pipes and tubes of stainless steel originating in the People's Republic
    of China by imports consigned from India, whether declared as originating in India
    or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/272 de la Commission du 16 février 2017
    portant ouverture d'une enquête sur le contournement possible des mesures antidumping
    instituées par le règlement d'exécution (UE) n° 1331/2011 du Conseil sur les
    importations de certains tubes et tuyaux sans soudure en acier inoxydable originaires
    de la République populaire de Chine par des importations expédiées de l'Inde,
    qu'ils aient ou non été déclarés originaires de ce pays, et soumettant ces
    importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/272 der Kommission vom 16. Februar 2017
