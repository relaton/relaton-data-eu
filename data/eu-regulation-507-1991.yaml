  content: Commission Regulation (EEC) No 507/91 of 28 February 1991 for the 1990/91
    wine year the percentages of table wine production to be delivered for compulsory
    distillation as provided for in Article 39 of Council Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 507/91 DE LA COMMISSION du 28 février 1991 fixant
    pour la campagne 1990/1991 les pourcentages de la production de vin de table à
    livrer à la distillation obligatoire visée à l'' article 39 du règlement (CEE)
    no 822/87 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 507/91 DER KOMMISSION vom 28. Februar 1991 zur Festsetzung
    des zur obligatorischen Destillation gemäß Artikel 39 der Verordnung (EWG) Nr.
    822/87 des Rates zu liefernden Prozentsatzes der Tafelweinerzeugung für das Wirtschaftsjahr
    1990/91 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 507/91 af 28. februar 1991 om fastsættelse
    for produktionsåret 1990/91 af, hvor stor en procentdel af produktionen af bordvin,
    der skal leveres til obligatorisk destillation efter artikel 39 i Rådets forordning
    (EØF) nr. 822/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 507/91 της Επιτροπής
    της 28ης Φεβρουαρίου 1991 για τον καθορισμό, για
    την περίοδο 1990/91, των ποσοστών της παραγωγής
    επιτραπέζιου οίνου που παραδίδονται στην υποχρεωτική
    απόσταξη που αναφέρεται στο άρθρο 39 του κανονισμού
    (ΕΟΚ) αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 507/91 DELLA COMMISSIONE del 28 febbraio 1991 che
    fissa, per la campagna 1990/1991, le percentuali della produzione di vini da tavola
    da consegnare alla distillazione obbligatoria di cui all'' articolo 39 del regolamento
    (CEE) n. 822/87 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 507/91 VAN DE COMMISSIE van 28 februari 1991 tot
    vaststelling, voor het wijnoogstjaar 1990/1991, van de percentages van de tafelwijnproduktie
    die moeten worden geleverd voor de in artikel 39 van Verordening (EEG) nr. 822/87
    van de Raad bedoelde verplichte distillatie #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 507/91 DA COMISSÃO de 28 de Fevereiro de 1991 que
    fixa, para a campanha de 1990/1991, as percentagens de produção de vinho de
    mesa a entregar para a destilação obrigatória referida no artigo 39o do Regulamento
    (CEE) no 822/87 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 507/91 DE LA COMISIÓN de 28 de febrero de 1991 por
    el que se fijan para la campaña de 1990/91 los porcentajes de producción de
    vino de mesa destinados a la destilación obligatoria contemplada en el artículo
    39 del Reglamento (CEE) no 822/87 del Consejo #'
