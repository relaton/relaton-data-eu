  script: Latn
  content: 'Durchführungsverordnung (EU) Nr. 840/2012 der Kommission vom 18. September
    2012 zur Zulassung von 6-Phytase (EC 3.1.3.26) aus Schizosaccharomyces pombe (ATCC
    5233) als Futtermittelzusatzstoff für alle Mastvogelarten mit Ausnahme von Masthühnern,
    Masttruthühnern und Mastenten sowie für alle Legevogelarten außer Legehennen
    (Zulassungsinhaber: Danisco Animal Nutrition)'
