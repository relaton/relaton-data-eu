    Schizosaccharomyces pombe (ATCC 5233) come additivo per mangimi destinati a tutte
    le specie avicole da ingrasso diverse dai polli da ingrasso, dai tacchini da ingrasso
    e dalle anatre da ingrasso e a tutte le specie avicole ovaiole diverse dalle galline
    ovaiole (titolare dell’autorizzazione Danisco Animal Nutrition)
