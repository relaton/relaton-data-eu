    pombe (ATCC 5233), kā barības piedevu visu sugu gaļas putniem, izņemot gaļas
    cāļus, gaļas tītarus un gaļas pīles, un visu sugu dējējputniem, izņemot
    dējējvistas (atļaujas turētājs Danisco Animal Nutrition )
  type: main
