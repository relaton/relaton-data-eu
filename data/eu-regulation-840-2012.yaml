title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 840/2012 of 18 September 2012
    concerning the authorisation of 6-phytase (EC 3.1.3.26) produced by Schizosaccharomyces
    pombe (ATCC 5233) as a feed additive for all avian species for fattening other
    than chickens for fattening, turkeys for fattening and ducks for fattening and
    all avian species for laying other than laying hens (holder of authorisation Danisco
    Animal Nutrition)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n ° 840/2012 de la Commission du 18 septembre
    2012 concernant l’autorisation de la 6-phytase (EC 3.1.3.26) produite par Schizosaccharomyces
    pombe (ATCC 5233) en tant qu’additif dans l’alimentation de toutes les espèces
    aviaires d’engraissement autres que les poulets d’engraissement, les dindons
    d’engraissement et les canards d’engraissement et de toutes les espèces aviaires
    destinées à la ponte autres que les poules pondeuses (titulaire de l’autorisation:
    Danisco Animal Nutrition)'
  type: main
