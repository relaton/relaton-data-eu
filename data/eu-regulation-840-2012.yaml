    a brojlercsirkéktől, brojlerpulykáktól és brojlerkacsáktól eltérő valamennyi
    hízó madárfaj, valamint a tojótyúkoktól eltérő valamennyi tojó madárfaj
    takarmány-adalékanyagaként történő engedélyezéséről (az engedély jogosultja:
    Danisco Animal Nutrition)'
  type: main
