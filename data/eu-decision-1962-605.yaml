id: EUDecision1962605
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission relative au prélèvement à percevoir sur les
    marchandises obtenues dans les conditions visées à l'article 3 de la décision
    du 28 juin 1960 et à l'article premier de la décision du 5 décembre 1960, et
    notamment à la fixation, pour la période du 1er juillet 1962 au 30 juin 1963,
    du taux de ce prélèvement
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über den anteiligen Zoll, der auf Waren zu
    erheben ist, die unter den Voraussetzungen des Artikels 3 der Entscheidung vom
    28. Juni 1960 und des Artikels 1 der Entscheidung vom 5. Dezember 1960 hergestellt
    wurden, und insbesondere über die Festsetzung des Satzes dieses anteiligen Zolls
    für die Zeit vom 1. Juli 1962 bis zum 30. Juni 1963
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa al prelievo da percepire sulle merci
    ottenute alle condizioni previste dall'articolo 3 della decisione del 28 giugno
    1960 e dall'articolo 1 della decisione del 5 dicembre 1960, ed in particolare
    alla determinazione dell'aliquota di tale prelievo per il periodo 1 luglio 1962
    - 30 giugno 1963
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie inzake de heffing waaraan zijn onderworpen
    de goederen verkregen onder de in artikel 3 van de beschikking van 28 juni 1960
    en in artikel 1 van de beschikking van 5 december 1960 genoemde voorwaarden, en
    met name de vaststelling, voor de periode van 1 juli 1962 tot en met 30 juni 1963,
    van de hoogte van die heffing
  type: main
