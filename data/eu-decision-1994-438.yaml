title:
- language: en
  script: Latn
  content: '94/438/EC: Commission Decision of 7 June 1994 laying down the criteria
    for classifying third countries and parts thereof with regard to avian influenza
    and Newcastle disease in relation to imports of fresh poultrymeat and amending
    Decision 93/342/EEC'
  type: main
- language: fr
  script: Latn
  content: '94/438/CE: Décision de la Commission, du 7 juin 1994, établissant les
    critères à retenir en vue de la qualification des pays tiers ou des parties
    de pays au regard de l''influenza aviaire et de la maladie de Newcastle en ce
    qui concerne les importations de viandes fraîches de volaille et modifiant la
    décision 93/342/CEE'
  type: main
- language: de
  script: Latn
