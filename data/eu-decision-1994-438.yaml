    pomoru drobiu w związku z przywozem świeżego mięsa drobiowego oraz zmieniająca
    decyzję 93/342/EWG
  type: main
- language: pt
  script: Latn
  content: '94/438/CE: Decisão da Comissão, de 7 de Junho de 1994, que estabelece
