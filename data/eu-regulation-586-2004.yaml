title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 586/2004 of 29 March 2004 determining the
    extent to which applications lodged in March 2004 for import licences for certain
    poultrymeat sector products pursuant to Regulation (EC) No 2497/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 586/2004 de la Commission du 29 mars 2004 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mars 2004 pour certains produits du secteur de la viande de volaille dans le
    cadre du règlement (CE) n° 2497/96 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 586/2004 der Kommission vom 29. März 2004 über die
    Festsetzung des Umfangs, in dem die im März 2004 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Geflügelfleisch entsprechend der Verordnung
    (EG) Nr. 2497/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 586/2004 af 29. marts 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i marts
    2004 om importlicenser for visse produkter fra fjerkrækødssektoren i forbindelse
    med forordning (EF) nr. 2497/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 586/2004 της Επιτροπής,
    της 29ης Μαρτίου 2004, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν το Μάρτιο του 2004 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    του κρέατος πουλερικών στα πλαίσια του κανονισμού
    (ΕΚ) αριθ. 2497/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 586/2004, annettu 29 päivänä maaliskuuta 2004,
    määrättyyn järjestelmään liittyvien maaliskuussa 2004 jätettyjen tiettyjä
    siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten hyväksyttävyydestä
    asetuksen (EY) N:o 2497/96 mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 586/2004 della Commissione, del 29 marzo 2004, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di marzo 2004 per taluni prodotti del settore delle uova e
    del pollame nel quadro del regolamento (CE) n. 2497/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 586/2004 van de Commissie van 29 maart 2004 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector slachtpluimvee, die in maart 2004 worden
    ingediend op grond van de Verordeningen (EG) nr. 2497/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 586/2004 da Comissão, de 29 de Março de 2004, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de aves de capoeira apresentados em
    Março de 2004 ao abrigo do Regulamento (CE) n.° 2497/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 586/2004 de la Comisión, de 29 de marzo de 2004, por
