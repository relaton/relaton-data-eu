title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/185 of 27 January 2023 initiating
    a ‘new exporter’ review of Implementing Regulation (EU) 2021/607 imposing
    a definitive anti-dumping duty on imports of citric acid originating in the People’s
    Republic of China for one Chinese exporting producer, repealing the duty with
    regard to imports from that exporting producer and making these imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/185 de la Commission du 27 janvier
    2023 portant ouverture d’un réexamen au titre de «nouvel exportateur» du
    règlement d’exécution (UE) 2021/607 instituant un droit antidumping définitif
    sur les importations d’acide citrique originaire de la République populaire
    de Chine pour un producteur-exportateur chinois, abrogeant le droit en ce qui
    concerne les importations provenant de ce producteur-exportateur et soumettant
    ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/185 der Kommission vom 27. Januar 2023
    zur Einleitung einer Neuausführerüberprüfung der Durchführungsverordnung (EU)
    2021/607 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren
    von Zitronensäure mit Ursprung in der Volksrepublik China für einen chinesischen
    ausführenden Hersteller, zur Außerkraftsetzung des Zolls auf die von diesem
    ausführenden Hersteller stammenden Einfuhren und zur zollamtlichen Erfassung
    dieser Einfuhren
