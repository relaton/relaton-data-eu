  content: Rialachán Cur Chun Feidhme (AE) 2023/185 ón gCoimisiún an 27 Eanáir
    2023 lena dtionscnaítear athbhreithniú “onnmhaireora nua” i ndáil le Rialachán
    Cur Chun Feidhme (AE) 2021/607 ón gCoimisiún lena bhforchuirtear dleacht frithdhumpála
    chinntitheach ar allmhairí aigéid chitrigh de thionscnamh Dhaon-Phoblacht na
