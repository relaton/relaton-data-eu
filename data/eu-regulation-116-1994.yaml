title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 116/94 of 24 January 1994 amending Regulation
    (EEC) No 1961/93 increasing to 1 100 000 tonnes the quantity of maize held by
    the French intervention agency for which a standing invitation to tender for export
    has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 116/94 de la Commission, du 24 janvier 1994, modifiant
    le règlement (CEE) n 1961/93 et portant à 1 100 000 tonnes l'adjudication permanente
    pour l'exportation de maïs détenue par l'organisme d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 116/94 der Kommission vom 24. Januar 1994 zur Änderung
    der Verordnung (EWG) Nr. 1961/93 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr von im Besitz der französischen Interventionsstelle befindlichem Mais
    auf 1 100 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 116/94 af 24. januar 1994 om ændring
    af forordning (EØF) nr. 1961/93 og om forhøjelse til 1 100 000 tons af den løbende
    licitation med henblik på eksport af majs som er i det franske interventionsorgans
    besiddelse
  type: main
- language: el
  script: Grek
