title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 689/2002 of 22 April 2002 amending, for the
    fifth time, Council Regulation (EC) No 1705/98 concerning the interruption of
    certain economic relations with Angola in order to induce the "União Nacional
    para a Independência Total de Angola" (UNITA) to fulfil its obligations in the
    peace process, and repealing Regulation (EC) No 2229/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 689/2002 de la Commission du 22 avril 2002 modifiant,
    pour la cinquième fois, le règlement (CE) n° 1705/98 du Conseil concernant
    l'interruption de certaines relations économiques avec l'Angola afin d'inciter
    l'União Nacional para a Independência Total de Angola (UNITA) à remplir ses
    obligations dans le processus de paix, et abrogeant le règlement (CE) n° 2229/97
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 689/2002 der Kommission vom 22. April 2002 zur fünften
    Änderung der Verordnung (EG) Nr. 1705/98 des Rates betreffend die Aussetzung
    bestimmter wirtschaftlicher Beziehungen zu Angola zur Veranlassung der "União
    Nacional para a Independência Total de Angola" (UNITA) zur Erfüllung ihrer Verpflichtungen
    im Rahmen des Friedensprozesses und zur Aufhebung der Verordnung (EG) Nr. 2229/97
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 689/2002 af 22. april 2002 om femte ændring
    af Rådets forordning (EF) nr. 1705/98 om afbrydelse af visse økonomiske forbindelser
    med Angola med henblik på at anspore "União Nacional para a Independência Total
    de Angola" (UNITA) til at indfri sine forpligtelser som led i fredsprocessen og
    om ophævelse af forordning (EF) nr. 2229/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 689/2002 της Επιτροπής,
    της 22ας Απριλίου 2002, για την τροποποίηση, για
    πέμπτη φορά, του κανονισμού (ΕΚ) αριθ. 1705/98 του
    Συμβουλίου όσον αφορά τη διακοπή ορισμένων
    οικονομικών σχέσεων με την Αγκόλα, προκειμένου
    να παρακινηθεί η "União Nacional para a Independencia Total de
    Angola" (UNITA) να εκπληρώσει τις υποχρεώσεις της
    κατά την ειρηνευτική διαδικασία και για την
    κατάργηση του κανονισμού (ΕΚ) αριθ. 2229/97
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 689/2002, annettu 22 päivänä huhtikuuta 2002,
    tiettyjen taloussuhteiden keskeyttämisestä Angolaan "União Nacional para a
    Independência Total de Angola'n" (UNITA) taivuttamiseksi täyttämään velvollisuutensa
    rauhanprosessissa ja asetuksen (EY) N:o 2229/97 kumoamisesta annetun neuvoston
    asetuksen (EY) N:o 1705/98 muuttamisesta viidenteen kertaan
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 689/2002 della Commissione, del 22 aprile 2002, che
    modifica, per la quinta volta, il regolamento (CE) n. 1705/98 del Consiglio relativo
    all'interruzione di alcune relazioni economiche con l'Angola per indurre l'"Unione
    nazionale per l'indipendenza totale dell'Angola" (UNITA) a rispettare gli obblighi
    assunti nell'ambito del processo di pace e che abroga il regolamento (CE) n. 2229/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 689/2002 van de Commissie van 22 april 2002 houdende
    vĳfde wĳziging van Verordening (EG) nr. 1705/98 van de Raad inzake de onderbreking
    van bepaalde economische betrekkingen met Angola, teneinde de União Nacional
    para a Independência Total de Angola (UNITA) ertoe te bewegen zich aan zĳn verplichtingen
    krachtens het vredesproces te houden, en tot intrekking van Verordening (EG) nr.
    2229/97
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 689/2002 da Comissão, de 22 de Abril de 2002, que
    altera, pela quinta vez, o Regulamento (CE) n.° 1705/98 do Conselho relativo
    à interrupção de certas relações económicas com Angola para induzir a União
    Nacional para a Independência Total de Angola (UNITA) a cumprir as suas obrigações
    no processo de paz, e que revoga o Regulamento (CE) n.° 2229/97
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 689/2002 de la Comisión, de 22 de abril de 2002, por
    el que se modifica, por quinta vez, el Reglamento (CE) n° 1705/98 del Consejo
    relativo a la interrupción de determinadas relaciones económicas con Angola
    a fin de inducir a la União Nacional para a Independência Total de Angola (UNITA)
    a cumplir sus obligaciones en el proceso de paz, y por el que se deroga el Reglamento
    (CE) n° 2229/97
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 689/2002 av den 22 april 2002 om ändring
    för femte gången av rådets förordning (EG) nr 1705/98 om avbrytande av vissa
    ekonomiska förbindelser med Angola för att få "União Nacional para a Independência
    Total de Angola" (UNITA) att uppfylla sina skyldigheter i fredsprocessen samt
    om upphävande av förordning (EG) nr 2229/97
