title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1520/73 of the Commission of 7 June 1973 re-establishing
    Common Customs Tariff duties on women' s, girls' and infants' outer garments,
    not of cotton, falling within heading No ex 61.02, originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2764/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1520/73 de la Commission, du 7 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour femmes, fillettes et jeunes enfants, autres que
    de coton, de la position tarifaire ex 61.02, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2764/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1520/73 der Kommission vom 7. Juni 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberkleidung
    für Frauen, Mädchen und Kleinkinder, andere als aus Baumwolle, der Tarifnummer
    ex 61.02, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2764/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1520/73 af 7. juni 1973 om genindførelse
    af told ifølge den fælles toldtarif for yderbeklædningsgenstande til kvinder,
    piger og småbørn, ikke af bomuld under position 61.02 som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1520/73 della Commissione, del 7 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni per donna, per ragazza e per bambini in tessuti non di cotone
    della voce doganale n. 61.02 originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2764/72 del Consiglio,
    del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1520/73 van de Commissie van 7 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op damesbovenkleding, meisjesbovenkleding en kinderbovenkleding,
    van andere weefsels dan van katoen, van tariefpost ex 61.02, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 2764/72 van
    de Raad van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
