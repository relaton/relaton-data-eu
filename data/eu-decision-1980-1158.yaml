title:
- language: en
  script: Latn
  content: '80/1158/EEC: Commission Decision of 28 November 1980 authorizing the United
    Kingdom not to apply Community treatment to fresh bananas originating in certain
    third countries (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1158/CEE: Décision de la Commission, du 28 novembre 1980, autorisant
    le Royaume-Uni à exclure du traitement communautaire les bananes fraîches originaires
    de certains pays tiers (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1158/EWG: Entscheidung der Kommission vom 28. November 1980, mit der
    das Vereinigte Königreich ermächtigt wird, frische Bananen mit Ursprung in bestimmten
    Drittländern von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1158/EØF: Kommissionens beslutning af 28. november 1980 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage bananer, friske,
    med oprindelse i visse tredjelande (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/1158/ΕΟΚ : Απόφαση της Επιτροπής, της 28ης
