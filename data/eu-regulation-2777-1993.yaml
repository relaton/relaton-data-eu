  content: COMMISSION REGULATION (EEC) No 2777/93 of 8 October 1993 on the rate of
    interest to be used for calculating the costs of financing intervention measures
    comprising buying in, storage and disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2777/93 de la Commission du 8 octobre 1993 fixant
    les taux d'intérêt à appliquer pour le calcul des frais de financement des
    interventions consistant en achat, stockage et écoulements
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2777/93 DER KOMMISSION vom 8. Oktober 1993 zur Festsetzung
    des bei der Berechnung der Finanzierungskosten für Interventionen in Form von
    Ankauf, Lagerung und Absatz anzuwendenden Zinssatzes
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2777/93 af 8. oktober 1993 om fastsættelse
    af den rentesats, der skal anvendes ved beregningen af finansieringsomkostninger
    i forbindelse med interventioner i form af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2777/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 8ης Οκτωβρίου 1993 για τον καθορισμό των επιτοκίων
    που θα εφαρμοστούν για τον υπολογισμό των δαπανών
    χρηματοδοτήσεως των παρεμβάσεων που συνίστανται
    σε αγορά, αποθεματοποίηση και διάθεση
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2777/93 DELLA COMMISSIONE dell' 8 ottobre 1993 che
    stabilisce i tassi d' interesse da applicare per il calcolo delle spese di finanziamento
    degli interventi comportanti acquisto, magazzinaggio e smercio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2777/93 VAN DE COMMISSIE van 8 oktober 1993 tot vaststelling
    van de bij de berekening van de financieringskosten van de interventies in de
    vorm van aankoop, opslag en afzet toe te passen rentevoeten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2777/93 DA COMISSÃO de 8 de Outubro de 1993 que
    fixa as taxas de juro a aplicar no cálculo das despesas de financiamento das
    intervenções que consistem na compra, armazenagem e escoamentos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 2777/93 DE LA COMISIÓN de 8 de octubre de 1993 por
    el que se fijan los tipos de interés que habrán de aplicarse para calcular los
    gastos de financiación de las intervenciones consistentes en operaciones de compra,
    almacenamiento y salida
  type: main
