    las normas de aplicación de la Decisión 2007/435/CE del Consejo por la que se
    establece el Fondo Europeo para la Integración de Nacionales de Terceros Países
    para el período 2007 a 2013 como parte del Programa general Solidaridad y gestión
    de los flujos migratorios, por lo que se refiere a los sistemas de los Estados
