title:
- language: en
  script: Latn
  content: '2010/173/: Commission Decision of 22 March 2010 amending Decision 2008/457/EC
    laying down rules for the implementation of Council Decision 2007/435/EC establishing
    the European Fund for the Integration of third-country nationals for the period
    2007 to 2013 as part of the General programme Solidarity and Management of Migration
    Flows as regards Member States management and control systems, the rules for administrative
    and financial management and the eligibility of expenditure on projects co-financed
    by the Fund (notified under document C(2010) 1713)'
  type: main
- language: fr
  script: Latn
  content: '2010/173/: Décision de la Commission du 22 mars 2010 modifiant la décision
    2008/457/CE fixant les modalités de mise en œuvre de la décision 2007/435/CE
    du Conseil portant création du Fonds européen d’intégration des ressortissants
    de pays tiers pour la période 2007-2013 dans le cadre du programme général
    Solidarité et gestion des flux migratoires en ce qui concerne les systèmes de
    gestion et de contrôle des États membres, les règles de gestion administrative
    et financière et l’éligibilité des dépenses pour les projets cofinancés
    par le Fonds [notifiée sous le numéro C(2010) 1713]'
  type: main
- language: de
  script: Latn
  content: '2010/173/: Beschluss der Kommission vom 22. März 2010 zur Änderung der
    Entscheidung 2008/457/EG mit Durchführungsbestimmungen zur Entscheidung 2007/435/EG
    des Rates zur Einrichtung des Europäischen Fonds für die Integration von Drittstaatsangehörigen
    für den Zeitraum 2007 bis 2013 innerhalb des Generellen Programms Solidarität
    und Steuerung der Migrationsströme in Bezug auf die Verwaltungs- und Kontrollsysteme
    der Mitgliedstaaten, die Vorschriften für die Verwaltung und finanzielle Abwicklung
    aus dem Fonds kofinanzierter Projekte und die Förderfähigkeit der Ausgaben im
    Rahmen solcher Projekte (Bekannt gegeben unter Aktenzeichen K(2010) 1713)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/173/ЕС: Решение на Комисията от 22 март
    2010 година за изменение на Решение 2008/457/ЕО за
    определяне на правилата за изпълнение на Решение
    2007/435/ЕО на Съвета, с което се създава Европейски
    фонд за интеграция на гражданите на трети страни
    за периода 2007—2013 г. като част от Общата програма
    Солидарност и управление на миграционните
    потоци относно системите за управление и контрол
    на държавите-членки, правилата за административно
    и финансово управление и допустимостта на
    разходите по проекти, съфинансирани от фонда
    (нотифицирано под номер C(2010) 1713)'
  type: main
- language: cs
  script: Latn
  content: '2010/173/: Rozhodnutí Komise ze dne 22. března 2010 , kterým se mění
    rozhodnutí 2008/457/ES, kterým se stanoví prováděcí pravidla k rozhodnutí
    Rady 2007/435/ES o zřízení Evropského fondu pro integraci státních příslušníků
    třetích zemí na období 2007 až 2013 jako součásti obecného programu Solidarita
    a řízení migračních toků, pokud jde o řídicí a kontrolní systémy členských
    států, dále pravidla pro správní a finanční řízení a způsobilost výdajů
    na projekty spolufinancované tímto fondem (oznámeno pod číslem K(2010) 1713)'
  type: main
- language: da
  script: Latn
  content: '2010/173/: Kommissionens afgørelse af 22. marts 2010 om ændring af beslutning
