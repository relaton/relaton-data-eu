    kansalaisten kotouttamista varten osana yhteisvastuuta ja maahanmuuttovirtojen
    hallintaa koskevaa yleisohjelmaa tehdyn neuvoston päätöksen 2007/435/EY soveltamissäännöistä
    jäsenvaltioiden hallinnointi- ja valvontajärjestelmien, rahastosta myönnetyn
