    om oprettelse af Den Europæiske Fond for Integration af Tredjelandsstatsborgere
    for perioden 2007-2013 som en del af det generelle program om solidaritet og forvaltning
    af migrationsstrømme, hvad angår medlemsstaternes forvaltnings- og kontrolsystemer,
    reglerne for administrativ og finansiel forvaltning og støtteberettigelsen for
    udgifter til projekter, der samfinansieres af fonden (meddelt under nummer K(2010)
    1713)'
  type: main
