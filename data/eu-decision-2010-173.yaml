  script: Latn
  content: '2010/173/EU: Odluka Komisije od 22. ožujka 2010. o izmjeni Odluke 2008/457/EZ
    o utvrđivanju pravila za provedbu Odluke Vijeća 2007/453/EZ o uspostavljanju
    Europskog fonda za integraciju državljana trećih zemalja za razdoblje od 2007.
    do 2013. kao dio općeg programa „Solidarnost i upravljanje migracijskim tokovima”
    u pogledu sustavâ upravljanja i nadzora država članica, pravila za upravno
    i financijsko upravljanje te prihvatljivost izdataka za projekte koje sufinancira
    Fond (priopćena pod brojem dokumenta C(2010) 1713)'
  type: main
- language: hu
  script: Latn
  content: '2010/173/: A Bizottság határozata ( 2010. március 22. ) a Szolidaritás
    és a migrációs áramlások igazgatása általános program keretében a 2007–2013-as
    időszakra a harmadik országok állampolgárainak beilleszkedését segítő
    európai alap létrehozásáról szóló 2007/435/EK tanácsi határozatnak a
    tagállamok igazgatási és ellenőrzési rendszerei, az igazgatási és pénzügyi
    irányításra vonatkozó szabályok, valamint az alap által társfinanszírozott
    projektek kiadásainak támogathatósága tekintetében történő végrehajtására
    vonatkozó szabályok megállapításáról szóló 2008/457/EK határozat módosításáról
    (az értesítés a C(2010) 1713. számú dokumentummal történt)'
  type: main
