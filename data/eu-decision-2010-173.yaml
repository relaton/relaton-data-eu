    sklada za vključevanje državljanov tretjih držav za obdobje 2007–2013 v okviru
    splošnega programa Solidarnost in upravljanje migracijskih tokov glede sistemov
    upravljanja in nadzora držav članic, pravil za upravno in finančno upravljanje
    ter upravičenosti izdatkov za projekte, ki jih sofinancira Sklad (notificirano
    pod dokumentarno številko C(2010) 1713)'
