    Rady 2007/435/ES, ktorým sa zriaďuje Európsky fond pre integráciu štátnych
    príslušníkov tretích krajín na obdobie rokov 2007 až 2013 ako súčasť
    všeobecného programu Solidarita a riadenie migračných tokov, pokiaľ ide o
    riadiace a kontrolné systémy členských štátov, pravidlá administratívneho
    a finančného riadenia a oprávnenosť výdavkov na projekty spolufinancované
    týmto fondom [oznámené pod číslom K(2010) 1713]'
  type: main
