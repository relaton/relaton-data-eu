title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1964/78 of 11 August 1978 re-establishing
    the levying of customs duties on basketwork, etc., falling within heading No 46.03
    and originating in Yugoslavia and the Philippines, to which the preferential tariff
    arrangements set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1964/78 de la Commission, du 11 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    de vannerie, etc., de la position tarifaire 46.03, originaires de Yougoslavie
    et des Philippines, bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1964/78 der Kommission vom 11. August 1978 zur Wiedereinführung
    des Zollsatzes für Korbmacherwaren usw. der Tarifnummer 46.03 mit Ursprung in
    Jugoslawien und in den Philippinen, denen die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1964/78 af 11. august 1978 om genindførelse
    af opkrævning af toldafgifter for kurvemagerarbejder etc. under position 46.03,
    som har oprindelse i Jugoslavien og Filippinerne, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1964/78 della Commissione, dell'11 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori da panieraio,
    ecc., della voce 46.03 della tariffa doganale comune, originari della Iugoslavia
    e delle Filippine beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1964/78 van de Commissie van 11 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op mandenmakerswerk,
    enz., van post 46.03, van oorsprong uit Joegoslavië en de Filippijnen, ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
