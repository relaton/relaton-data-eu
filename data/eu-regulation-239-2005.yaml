  type: main
- language: hu
  script: Latn
  content: A Bizottság 239/2005/EK rendelete (2005. február 11.) a közös agrárpolitika
    keretébe tartozó közvetlen támogatási rendszerek közös szabályainak megállapításáról
    és a mezőgazdasági termelők részére meghatározott támogatási rendszerek
    létrehozásáról szóló, 2003. szeptember 29-i 1782/2003/EK tanácsi rendelet
    által előírt kölcsönös megfeleltetés, moduláció, valamint integrált
    igazgatási és ellenőrzési rendszer végrehajtására vonatkozó részletes
    szabályok megállapításáról szóló 796/2004/EK bizottsági rendelet módosításáról
    és helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 239/2005 della Commissione, dell’11 febbraio 2005,
    che modifica e rettifica il regolamento (CE) n. 796/2004 recante modalità di
    applicazione della condizionalità, della modulazione e del sistema integrato
    di gestione e di controllo di cui al regolamento (CE) n. 1782/2003 del Consiglio
    che stabilisce norme comuni relative ai regimi di sostegno diretto nell’ambito
    della politica agricola comune e istituisce taluni regimi di sostegno a favore
    degli agricoltori
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 239/2005 (2005. gada 11. februāris), ar kuru
    groza un labo Regulu (EK) Nr. 796/2004, ar ko paredz sīki izstrādātus noteikumus,
    lai ieviestu savstarpēju atbilstību, modulāciju un integrēto administrēšanas
    un kontroles sistēmu, kura paredzēta Padomes Regulā (EK) Nr. 1782/2003, ar
    ko ievieš kopīgus tiešā atbalsta shēmu noteikumus saskaņā ar kopējo lauksaimniecības
    politiku un izveido dažas atbalsta shēmas lauksaimniekiem
  type: main
- language: lt
  script: Latn
  content: 2005 m. vasario 11 d. Komisijos reglamentas (EB) Nr. 239/2005, iš dalies
    keičiantis ir taisantis Reglamentą (EB) Nr. 796/2004, nustatantį išsamias
    kompleksinio paramos susiejimo, moduliavimo ir integruotos administravimo ir kontrolės
    sistemos, numatytų Tarybos reglamente (EB) Nr. 1782/2003, nustatančiame bendrąsias
    tiesioginės paramos schemų pagal bendrąją žemės ūkio politiką taisykles
    ir nustatančiame tam tikras paramos schemas ūkininkams, įgyvendinimo taisykles
  type: main
