    aplicare a eco-condiționalității, modulării și a sistemului integrat de gestionare
    și control, prevăzute de Regulamentul (CE) nr. 1782/2003 al Consiliului din
    29 septembrie 2003 de stabilire a normelor comune pentru schemele de sprijin direct
    în cadrul politicii agricole comune și de stabilire a anumitor scheme de sprijin
    pentru agricultori
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 239/2005 z 11. februára 2005, ktorým sa mení,
