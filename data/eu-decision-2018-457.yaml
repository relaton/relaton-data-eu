  script: Latn
  content: Council Implementing Decision (EU) 2018/457 of 13 March 2018 authorising
    the Republic of Latvia to introduce a special measure derogating from Article
    193 of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
