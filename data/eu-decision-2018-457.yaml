    à l'article 193 de la directive 2006/112/CE relative au système commun de taxe
    sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/457 des Rates vom 13. März 2018 zur
