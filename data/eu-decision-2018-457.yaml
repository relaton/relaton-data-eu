    derogare de la articolul 193 din Directiva 2006/112/CE privind sistemul comun
    al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2018/457 z 13. marca 2018, ktorým
