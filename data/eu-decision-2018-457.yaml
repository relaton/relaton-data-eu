    od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/457 do Conselho, de 13 de março de 2018,
    que autoriza a República da Letónia a instituir uma medida especial em derrogação
    ao artigo 193.° da Diretiva 2006/112/CE do Conselho relativa ao sistema comum
    do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/457 a Consiliului din 13 martie
