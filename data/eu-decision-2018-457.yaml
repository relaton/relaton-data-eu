    od článku 193 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2018/457 z dne 13. marca 2018 o dovoljenju Republiki
