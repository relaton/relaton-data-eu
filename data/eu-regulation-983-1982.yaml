title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 983/82 of 27 April 1982 determining to what
    extent applications for import licences lodged during the second quarter of 1982
    for high-quality fresh, chilled or frozen beef and veal can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 983/82 de la Commission, du 27 avril 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées pendant le deuxième trimestre de 1982 pour les viandes bovines de
    haute qualité, fraîches, réfrigérées ou congelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 983/82 der Kommission vom 27. April 1982 zur Bestimmung
    des Maßstabs für die Genehmigung der während des zweiten Vierteljahres 1982
    eingereichten Anträge auf Einfuhrlizenzen für frisches, gekühltes oder gefrorenes
    Qualitätsrindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 983/82 af 27. april 1982 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indgivet i andet kvartal
    af 1982 for oksekød af høj kvalitet, fersk, kølet eller frosset, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 983/82 της Επιτροπής
    της 27ης Απριλίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    έχουν υποβληθεί κατά το δεύτερο τρίμηνο του
    1982, για βόειο κρέας υψηλής ποιότητος, νωπό,
    διατηρημένο με απλή ψύξη η κατεψυγμένο
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 983/82 della Commissione, del 27 aprile 1982, che
    determina in quale misura possono essere accolte le domande di titoli d'importazione
    presentate durante il secondo trimestre 1982 per le carni bovine di qualità pregiata,
    fresche, refrigerate o congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 983/82 van de Commissie van 27 april 1982 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de certificaataanvragen die gedurende
    het tweede kwartaal van 1982 zijn ingediend voor de invoer van vers, gekoeld of
    bevroren kwaliteitsrundvlees
