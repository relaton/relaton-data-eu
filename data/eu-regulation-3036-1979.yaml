title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3036/79 of 21 December 1979 amending for
    the second time Regulation (EEC) No 1535/77 determining the conditions under which
    certain goods are eligible upon importation for a favourable tariff arrangement
    by reason of their end use
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3036/79 de la Commission, du 21 décembre 1979, portant
    deuxième modification du règlement (CEE) n° 1535/77 déterminant les conditions
    auxquelles est subordonnée l'admission de certaines marchandises au bénéfice
    d'un régime tarifaire favorable à l'importation en raison de leur destination
    particulière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3036/79 der Kommission vom 21. Dezember 1979 zur zweiten
