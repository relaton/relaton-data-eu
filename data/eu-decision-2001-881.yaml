  type: main
- language: fi
  script: Latn
  content: '2001/881/EY: Komission päätös, tehty 7 päivänä joulukuuta 2001,
    kolmansista maista tulevien eläinten ja eläintuotteiden eläinlääkärintarkastuksia
    varten hyväksyttyjen rajatarkastusasemien luettelosta ja komission asiantuntijoiden
    tekemiä tarkastuksia koskevien yksityiskohtaisten sääntöjen saattamisesta
    ajan tasalle (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla
    K(2001) 3941)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2001. december 7.) a harmadik országból behozott
    állatok és állati termékek állat-egészségügyi ellenőrzésére jóváhagyott
    állat-egészségügyi határállomások jegyzékének összeállításáról,
    valamint a Bizottság szakértői által végzendő ellenőrzésekre vonatkozó
    részletes szabályok naprakésszé tételéről (az értesítés a C(2001) 3941.
    számú dokumentummal történt) (Csak az angol nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: '2001/881/CE: Decisione della Commissione, del 7 dicembre 2001, che stabilisce
    l''elenco dei posti d''ispezione frontalieri riconosciuti ai fini dei controlli
    veterinari sui prodotti e sugli animali provenienti dai paesi terzi e che aggiorna
    le modalità relative ai controlli che devono essere effettuati dagli esperti
    della Commissione (Testo rilevante ai fini del SEE) [notificata con il numero
    C(2001) 3941]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 7. decembris), ar ko izstrādā to robežkontroles
    punktu sarakstu, kas ir apstiprināti veterinārajai kontrolei attiecībā uz
    dzīvniekiem un dzīvnieku izcelsmes produktiem no trešām valstīm, un atjaunina
    sīki izstrādātos noteikumus attiecībā uz pārbaudēm, kas jāveic Komisijas
    ekspertiem (izziņots ar dokumenta numuru C (2001) 3941) (Autentisks tikai teksts
    angļu valodā)
  type: main
- language: lt
  script: Latn
  content: 2001 m. birželio 7 d. Komisijos sprendimas, nustatantis kontrolės postų,
    patvirtintų atlikti gyvūnų ir gyvūninės kilmės produktų iš trečiųjų
    šalių veterinarinius patikrinimus, sąrašą ir atnaujinantis išsamias patikrinimų,
    kuriuos atliks Komisijos ekspertai, taisykles (pranešta dokumentu C(2001) 3941)
    (Tekstas tik anglų kalba yra autentiškas)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-7 ta’ Diċembru 2001 li tagħmel lista’
    ta’ postijiet ta’ ispezzjoni fuq il-fruntiera miftiehma għal verifiki veterinarji
    fuq annimali u prodotti mill-annimali minn pajjiżi terzi u li taġġorna r-regoli
    dettaljati dwar il-verifiki li jridu jsiru mill-esperti tal-Kummissjoni (notifikata
    taħt dokument numru K(2001) 3941) (It-test Ingliż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: '2001/881/EG: Beschikking van de Commissie van 7 december 2001 tot vaststelling
    van een lĳst van grensinspectieposten die zĳn erkend voor de veterinaire controles
    van dieren en dierlĳke producten uit derde landen, en tot bĳwerking van de uitvoeringsbepalingen
    inzake de door deskundigen van de Commissie te verrichten controles (Voor de EER
    relevante tekst) (kennisgeving geschied onder nummer C(2001) 3941)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 7 grudnia 2001 r. ustalającą wykaz punktów kontroli
    granicznej zatwierdzonych do celów przeprowadzania kontroli weterynaryjnych zwierząt
    i produktów odzwierzęcych sprowadzanych z państw trzecich oraz uaktualniająca
    szczegółowe przepisy dotyczące kontroli przeprowadzanych przez ekspertów Komisji
    (notyfikowana jako dokument nr C(2001) 3941) (Jedynie tekst angielski jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: '2001/881/CE: Decisão da Comissão, de 7 de Dezembro de 2001, que estabelece
    uma lista dos postos de inspecção fronteiriços aprovados para a realização
    dos controlos veterinários de animais vivos e produtos animais provenientes de
    países terceiros e que actualiza as regras pormenorizadas relativas aos controlos
    efectuados por peritos da Comissão (Texto relevante para efeitos do EEE) [notificada
    com o número C(2001) 3941]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 7 decembrie 2001 de stabilire a listei punctelor de
    control la frontieră desemnate pentru controalele veterinare ale animalelor și
    produselor animale din țări terțe și de actualizare a normelor privind controalele
    care trebuie efectuate de către specialiștii Comisiei [notificată cu numărul
    C(2001) 3941] (Numai textul în limba engleză este autentic)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 7. decembra 2001, ktorým sa vyhotovuje zoznam hraničných
    inšpekčných staníc odsúhlasených pre veterinárne kontroly zvierat a živočíšnych
    produktov z tretích krajín a ktorým sa aktualizujú podrobné pravidlá týkajúce
    sa kontrol, ktoré majú vykonávať odborníci Komisie (oznámené pod číslom
    dokumentu C(2001) 3941) (Len anglický text je pôvodný)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 7. decembra 2001 o sestavi seznama mejnih kontrolnih
    točk, dogovorjenih za veterinarske preglede živali in živalskih proizvodov
    iz tretjih držav, in o posodabljanju podrobnih pravil v zvezi s pregledi, ki
    jih bodo izvajali strokovnjaki Komisije (notificirano pod dokumentarno številko
    K(2001) 3941) (Verodostojno je samo angleško besedilo)
  type: main
- language: es
  script: Latn
  content: '2001/881/CE: Decisión de la Comisión, de 7 de diciembre de 2001, por
    la que se establece una lista de los puestos de inspección fronterizos que están
    autorizados para el control veterinario de los animales y productos animales procedentes
    de terceros países y por la que se actualizan las disposiciones de aplicación
    de los controles que deben efectuar los expertos de la Comisión (Texto pertinente
    a efectos del EEE) [notificada con el número C(2001) 3941]'
  type: main
- language: sv
  script: Latn
  content: '2001/881/EG: Kommissionens beslut av den 7 december 2001 om upprättande
    av en förteckning över gränskontrollstationer som godkänts för veterinärkontroller
    av djur och animalieprodukter från tredje land och om uppdatering av de närmare
    bestämmelserna för kontroller som skall utföras av experter från kommissionen
