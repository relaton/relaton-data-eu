  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 7. detsember 2001, millega koostatakse kolmandatest riikidest
    pärit loomade ja loomsete toodete veterinaarkontrolliks heakskiidetud piiripunktide
    loetelu ja ajakohastatakse komisjoni ekspertide korraldatavate kontrollide üksikasjalikke
