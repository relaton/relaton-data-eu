title:
- language: en
  script: Latn
  content: '2001/881/EC: Commission Decision of 7 December 2001 drawing up a list
    of border inspection posts agreed for veterinary checks on animals and animal
    products from third countries and updating the detailed rules concerning the checks
    to be carried out by the experts of the Commission (Text with EEA relevance) (notified
    under document number C(2001) 3941)'
  type: main
- language: fr
  script: Latn
  content: '2001/881/CE: Décision de la Commission du 7 décembre 2001 établissant
    une liste de postes d''inspection frontaliers agréés pour les contrôles vétérinaires
    sur les animaux vivants et les produits animaux en provenance des pays tiers et
    actualisant les modalités des contrôles que doivent effectuer les experts de
    la Commission (Texte présentant de l''intérêt pour l''EEE) [notifiée sous
    le numéro C(2001) 3941]'
  type: main
- language: de
  script: Latn
  content: '2001/881/EG: Entscheidung der Kommission vom 7. Dezember 2001 zur Festlegung
    eines Verzeichnisses der für die Veterinärkontrollen von aus Drittländern eingeführten
    Tieren und tierischen Erzeugnissen zugelassenen Grenzkontrollstellen und zur Aktualisierung
    der Bestimmungen für die von den Sachverständigen der Kommission durchzuführenden
    Kontrollen (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen
    K(2001) 3941)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 7 декември 2001 година
    относно определяне на списък на граничните
    инспекционни пунктове, одобрени да извършват
    ветеринарни проверки на животни и животински
    продукти с произход от трети страни и относно
    актуализиране на подробните правила за контрола,
    който трябва да бъде упражняван от експертите
    на Комисията (нотифицирано под номер C(2001) 3941)
    (само английският текст е автентичен)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 7. prosince 2001, kterým se stanoví seznam
    stanovišť hraniční kontroly schválených pro veterinární kontroly zvířat
    a živočišných produktů ze třetích zemí a aktualizují prováděcí pravidla
    pro kontroly, jež mají provádět znalci Komise (oznámeno pod číslem K(2001)
    3941) (Pouze anglické znění je závazné)
  type: main
- language: da
  script: Latn
  content: '2001/881/EF: Kommissionens beslutning af 7. december 2001 om en liste
    over grænsekontrolsteder, der er godkendt til at føre veterinærkontrol med
    dyr og animalske produkter fra tredjelande, og om opdatering af de nærmere bestemmelser
    om den kontrol, som skal gennemføres af Kommissionens eksperter (EØS-relevant
    tekst) (meddelt under nummer K(2001) 3941)'
  type: main
- language: el
  script: Grek
  content: '2001/881/ΕΚ: Απόφαση της Επιτροπής, της 7ης
    Δεκεμβρίου 2001, για την κατάρτιση καταλόγου
    μεθοριακών σταθμών επιθεώρησης που είναι εγκεκριμένοι
    για τη διενέργεια κτηνιατρικών ελέγχων σε
    ζώα και ζωικά προϊόντα από τρίτες χώρες και
    για την ενημέρωση των λεπτομερών κανόνων που
    αφορούν τους ελέγχους οι οποίοι πρέπει να διενεργούνται
