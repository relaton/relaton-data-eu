title:
- language: en
  script: Latn
  content: Commission Regulation ( EEC ) No 26/92 of 6 January 1992 derogating for
    the 1991/92 wine year from Regulation ( EEC ) No 2721/88 in regard to the date
    of submission for approval of contracts for preventive distillation and amending
    Regulation ( EEC ) No 2287/91 introducing preventive distillation as provided
    for in Article 38 of Council Regulation ( EEC ) No 822/87 for the 1991/92 wine
    year
  type: main
- language: fr
  script: Latn
  content: Règlement ( CEE ) n° 26/92 de la Commission, du 6 janvier 1992, portant
    dérogation pour la campagne 1991/1992 au règlement ( CEE ) n° 2721/88 en ce
    qui concerne la date de présentation pour agrément des contrats de distillation
    préventive et modifiant le règlement ( CEE ) n° 2287/91 ouvrant la distillation
    préventive visée à l' article 38 du règlement ( CEE ) n° 822/87 du Conseil
    pour la campagne 1991/1992
  type: main
- language: de
  script: Latn
  content: Verordnung ( EWG ) Nr. 26/92 der Kommission vom 6. Januar 1992 zur Abweichung
    von der Verordnung ( EWG ) Nr. 2721/88 hinsichtlich der Annahmefrist für die
    Genehmigung der Verträge über die vorbeugende Destillation im Wirtschaftsjahr
    1991/92 und zur Änderung der Verordnung ( EWG ) Nr. 2287/91 zur Eröffnung der
    vorbeugenden Destillation gemäß Artikel 38 der Verordnung ( EWG ) Nr. 822/87
    des Rates für das Wirtschaftsjahr 1991/92
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning ( EØF ) nr. 26/92 af 6. januar 1992 om undtagelse
    for produktionsåret 1991/92 fra forordning ( EØF ) nr. 2721/88 for så vidt
    angår sidste frist for indgivelse af kontrakter om forebyggende destillation
    til godkendelse og om ændring af forordning ( EØF ) nr 2287/91 om åbning af
    forebyggende destillation som omhandlet i artikel 38 i Rådets forordning ( EØF
    ) nr. 822/87 for produktionsåret 1991/92
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 26/92 της Επιτροπής
    της 6ης Ιανουαρίου 1992 για παρέκκλιση για την
    περίοδο 1991/92 από τον κανονισμό ( ΕΟΚ ) αριθ. 2721/88
    όσον αφορά την ημερομηνία υποβολής για έγκριση
    των συμβάσεων της προληπτικής απόσταξης και
    για τροποποίηση του κανονισμού ( ΕΟΚ ) αριθ.
    2287/91 για την έναρξη της προληπτικής απόσταξης
    που προβλέπεται στο άρθρο 38 του κανονισμού
    ( ΕΟΚ ) αριθ. 822/87 του Συμβουλίου για την περίοδο
    εμπορίας 1991/92
  type: main
- language: it
  script: Latn
  content: Regolamento ( CEE ) n. 26/92 della Commissione, del 6 gennaio 1992, che
    deroga, per la campagna 1991/1992, al regolamento ( CEE ) n. 2721/88 per quanto
    riguarda la data di presentazione per l' approvazione di contratti di distillazione
    preventiva e che modifica il regolamento ( CEE ) n. 2287/91 che prevede l' apertura,
    per la campagna 1991/1992, della distillazione preventiva di cui all' articolo
    38 del regolamento ( CEE ) n. 822/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 26/92 van de Commissie van 6 januari 1992 houdende
    afwijking, voor het wijnoogstjaar 1991/1992, van Verordening ( EEG ) nr. 2721/88
    betreffende de termijn waarin preventieve distillatiecontracten ter goedkeuring
    voorgelegd moeten worden en tot wijziging van Verordening ( EEG ) nr. 2287/91
    tot opening van de in artikel 38 van Verordening ( EEG ) nr. 822/87 van de Raad
    bedoelde preventieve distillatie voor het wijnoogstjaar 1991/1992
  type: main
- language: pt
  script: Latn
  content: Regulamento ( CEE ) n° 26/92 da Comissão, de 6 de Janeiro de 1992, que
    derroga, relativamente à campanha de 1991/1992, o Regulamento ( CEE ) n° 2721/88,
    no que diz respeito à data de apresentação para aprovação dos contratos de
    destilação preventiva e altera o Regulamento ( CEE ) n° 2287/91, que abre a
    destilação preventiva referida no artigo 38° do Regulamento ( CEE ) n° 822/87
    do Conselho para a campanha de 1991/1992
  type: main
- language: es
  script: Latn
  content: Reglamento ( CEE ) n° 26/92 de la Comisión, de 6 de enero de 1992, que
    establece casos de excepción durante la campaña 1991/92 al Reglamento ( CEE
    ) n° 2721/88 en lo referente a la fecha de presentación para su autorización
    de los contratos de destilación preventiva y que modifica el Reglamento ( CEE
    ) n° 2287/91 por el que se abre la destilación preventiva contemplada en el
    artículo 38 del Reglamento ( CEE ) n° 822/87 del Consejo por lo que se refiere
    a la campaña 1991/92
