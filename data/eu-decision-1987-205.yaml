title:
- language: en
  script: Latn
  content: '87/205/EEC: Commission Decision of 11 March 1987 amending Decision 86/414/EEC
    as regards the list of establishments in Argentina approved for the purpose of
    importing meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '87/205/CEE: Décision de la Commission du 11 mars 1987 modifiant la décision
    86/414/CEE en ce qui concerne la liste des établissements d'' Argentine agréés
    pour l'' importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: '87/205/EWG: Entscheidung der Kommission vom 11. März 1987 zur Änderung
    der Entscheidung 86/414/EWG in bezug auf die Liste der Betriebe in Argentinien,
    aus denen die Einfuhr von Fleischerzeugnissen in die Gemeinschaft zugelassen ist'
  type: main
- language: da
  script: Latn
  content: '87/205/EØF: Kommissionens beslutning af 11. marts 1987 om ændring af
    beslutning 86/414/EØF for så vidt angår listen over de virksomheder i Argentina,
    der er godkendt til indførsel af kødprodukter til Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '87/205/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
