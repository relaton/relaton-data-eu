    a base di carne nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '87/205/EEG: Beschikking van de Commissie van 11 maart 1987 tot wijziging
    van Beschikking 86/414/EEG met betrekking tot de lijst van inrichtingen in Argentinië
    die erkend zijn voor de invoer van vleesprodukten in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '87/205/CEE: Decisão da Comissão de 11 de Março de 1987 que altera a
