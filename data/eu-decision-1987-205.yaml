  type: main
- language: es
  script: Latn
  content: '87/205/CEE: Decisión de la Comisión de 11 de marzo de 1987 por la que
    se modifica la Decision 86/414/CEE en lo que se refiere a la lista de los establecimientos
    de Argentina autorizados para la importación de productos a base de carne en
    la Comunidad'
