    с Регламент (ЕС) 2024/573 на Европейския парламент
    и на Съвета, на минимални изисквания за сертификатите
    на физически лица и на условия за взаимното
    признаване на такива сертификати по отношение
    на възстановяването от оборудване на разтворители
    на базата на флуорсъдържащи парникови газове
    и за отмяна на Регламент (ЕО) № 306/2008 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/623 ze dne 28. března 2025,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) 2024/573 stanoví
    minimální požadavky na certifikáty fyzických osob a podmínky pro vzájemné
    uznávání těchto certifikátů, pokud jde o znovuzískávání rozpouštědel
    na bázi fluorovaných skleníkových plynů ze zařízení, a kterým se zrušuje
    nařízení Komise (ES) č. 306/2008
  type: main
