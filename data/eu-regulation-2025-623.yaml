    különféle berendezésekből való visszanyerése tekintetében a természetes
    személyek bizonyítványaira vonatkozó minimumkövetelményeknek és az ilyen
    bizonyítványok kölcsönös elismerésére vonatkozó feltételeknek az (EU)
    2024/573 európai parlamenti és tanácsi rendelet szerinti megállapításáról,
    valamint a 306/2008/EK bizottsági rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/623 della Commissione, del 28 marzo
    2025, che stabilisce, in conformità al regolamento (UE) 2024/573 del Parlamento
    europeo e del Consiglio, i requisiti minimi per i certificati per le persone fisiche
    e le condizioni per il riconoscimento reciproco di tali certificati per quanto
    riguarda il recupero di solventi a base di gas fluorurati a effetto serra dalle
    apparecchiature e che abroga il regolamento (CE) n. 306/2008 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/623 (2025. gada 28. marts), ar
    ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (ES) 2024/573 nosaka minimālās
    prasības fizisku personu sertifikātiem un šādu sertifikātu savstarpējas
    atzīšanas nosacījumus attiecībā uz šķīdinātāju uz fluorēto siltumnīcefekta
    gāzu bāzes atgūšanu no aprīkojuma un ar ko atceļ Komisijas Regulu (EK) Nr.
    306/2008
  type: main
- language: lt
  script: Latn
  content: 2025 m. kovo 28 d. Komisijos įgyvendinimo reglamentas (ES) 2025/623, kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (ES) 2024/573 nustatomi su tirpiklių,
    kurių pagrindą sudaro fluorintos šiltnamio efektą sukeliančios dujos, surinkimu
    iš įrangos susiję fizinių asmenų sertifikatų minimalieji reikalavimai ir
    tokių sertifikatų tarpusavio pripažinimo sąlygos ir panaikinamas Komisijos
    reglamentas (EB) Nr. 306/2008
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/623 tat-28
    ta’ Marzu 2025 li jistabbilixxi, skont ir-Regolament (UE) 2024/573 tal-Parlament
    Ewropew u tal-Kunsill, ir-rekwiżiti minimi għaċ-ċertifikati ta’ persuni
    fiżiċi u l-kundizzjonijiet għar-rikonoxximent reċiproku ta’ tali ċertifikati
    fir-rigward tal-irkupru tas-solventi b’bażi ta’ gassijiet fluworurati b’effett
    ta’ serra mit-tagħmir u li jħassar ir-Regolament tal-Kummissjoni (KE) Nru
    306/2008
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/623 van de Commissie van 28 maart 2025
    tot vaststelling, overeenkomstig Verordening (EU) 2024/573 van het Europees Parlement
    en de Raad, van minimumvoorschriften voor certificaten van natuurlijke personen
    en de voorwaarden voor de wederzijdse erkenning van dergelijke certificaten op
    het gebied van de terugwinning van oplosmiddelen op basis van gefluoreerde broeikasgassen
    uit apparatuur, en tot intrekking van Verordening (EG) nr. 306/2008 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/623 z dnia 28 marca 2025 r.
    ustanawiające, na podstawie rozporządzenia Parlamentu Europejskiego i Rady (UE)
    2024/573, minimalne wymogi dotyczące certyfikatów dla osób fizycznych oraz
    warunki wzajemnego uznawania takich certyfikatów w odniesieniu do odzysku rozpuszczalników
    na bazie fluorowanych gazów cieplarnianych z urządzeń oraz uchylające rozporządzenie
    Komisji (WE) nr 306/2008
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/623 da Comissão, de 28 de março de
    2025, que estabelece, nos termos do Regulamento (UE) 2024/573 do Parlamento Europeu
    e do Conselho, os requisitos mínimos relativos aos certificados de pessoas singulares
    e as condições para o reconhecimento mútuo desses certificados no respeitante
    à recuperação de solventes à base de gases fluorados com efeito de estufa
    de equipamentos que os contêm e que revoga o Regulamento (CE) n.o 306/2008 da
    Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/623 al Comisiei din 28 martie
    2025 de stabilire, în temeiul Regulamentului (UE) 2024/573 al Parlamentului European
    și al Consiliului, a cerințelor minime pentru certificatele persoanelor fizice
    și a condițiilor pentru recunoașterea reciprocă a acestor certificate în
    ceea ce privește recuperarea solvenților pe bază de gaze fluorurate cu efect
    de seră din echipamente și de abrogare a Regulamentului (CE) nr. 306/2008 al
    Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/623 z 28. marca 2025, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (EÚ) 2024/573 stanovujú minimálne
    požiadavky na osvedčenia fyzických osôb a podmienky vzájomného uznávania
    takýchto osvedčení, pokiaľ ide o zhodnocovanie rozpúšťadiel na báze fluórovaných
    skleníkových plynov zo zariadení, a ktorým sa zrušuje nariadenie Komisie
    (ES) č. 306/2008
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/623 z dne 28. marca 2025 o določitvi
    minimalnih zahtev za spričevala za fizične osebe in pogojev za vzajemno priznavanje
    takih spričeval glede zajemanja topil na osnovi fluoriranih toplogrednih plinov
    iz opreme na podlagi Uredbe (EU) 2024/573 Evropskega parlamenta in Sveta ter o
    razveljavitvi Uredbe Komisije (ES) št. 306/2008
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/623 de la Comisión, de 28 de marzo
    de 2025, por el que se establecen, de conformidad con el Reglamento (UE) 2024/573
    del Parlamento Europeo y del Consejo, los requisitos mínimos de los certificados
    de las personas físicas y las condiciones para el reconocimiento mutuo de dichos
    certificados en lo que respecta a la recuperación de disolventes a base de gases
    fluorados de efecto invernadero de los aparatos y se deroga el Reglamento (CE)
    n.o 306/2008 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/623 av den 28 mars 2025
    om fastställande, i enlighet med Europaparlamentets och rådets förordning (EU)
    2024/573, av minimikrav för certifikat för fysiska personer och villkoren för
    ömsesidigt erkännande av sådana certifikat vad gäller återvinning av lösningsmedel
    med fluorerade växthusgaser från utrustning samt om upphävande av kommissionens
    förordning (EG) nr 306/2008
