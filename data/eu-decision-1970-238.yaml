title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 mars 1970, autorisant la République
    italienne à exclure du traitement communautaire les roulements de tous genres,
    de la position 84.62 du Tarif douanier commun, originaires de Roumanie ou d'URSS
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/238/EWG: Entscheidung der Kommission vom 10. März 1970, mit der die
    Italienische Republik ermächtigt wird, die aus Rumänien und der UdSSR stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen Wälzlager
    aller Art der Tarifnummer 84.62 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/238/CEE: Decisione della Commissione, del 10 marzo 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i cuscinetti a
    rotolamento di ogni specie, della voce 84.62 della tariffa doganale comune, originari
    della Romania e dell''URSS e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/238/EEG: Beschikking van de Commissie van 10 maart 1970 waarbij de
    Italiaanse Republiek wordt gemachtigd kogellagers van post 84.62 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en de USSR en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
