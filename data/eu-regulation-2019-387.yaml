    sp. (ATCC PTA-9695) als neuartiges Lebensmittel sowie der Änderung der Bezeichnung
    und der spezifischen Kennzeichnungsvorschrift für Öl aus Schizochytrium sp.
    (ATCC PTA-9695) gemäß der Verordnung (EU) 2015/2283 des Europäischen Parlaments
