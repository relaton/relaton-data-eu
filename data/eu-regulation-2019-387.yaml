    Schizochytrium sp. (ATCC PTA-9695) oil under Regulation (EU) 2015/2283 of the
    European Parliament and of the Council, and amending Commission Implementing Regulation
    (EU) 2017/2470
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/387 de la Commission du 11 mars 2019
    autorisant une extension de l'utilisation de l'huile extraite de Schizochytrium
    sp. (ATCC PTA-9695) en tant que nouvel aliment ainsi que la modification de la
    dénomination et de l'exigence d'étiquetage spécifique de l'huile extraite de
    Schizochytrium sp. (ATCC PTA-9695) en application du règlement (UE) 2015/2283
