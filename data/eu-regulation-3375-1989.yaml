    Zitrusfrüchte sowie Tafeläpfel und -birnen bezüglich der Liste der großfrüchtigen
    Sorten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3375/89 af 9. november 1989 om ændring
