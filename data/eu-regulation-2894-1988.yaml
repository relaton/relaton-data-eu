  content: Commission Regulation (EEC) No 2894/88 of 20 September 1988 re-establishing
    the levying of customs duties on swimwear, products of category 72 (order No 40.0720),
    originating in Brazil, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3783/87 apply
  type: main
