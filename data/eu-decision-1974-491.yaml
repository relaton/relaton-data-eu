  content: '74/491/EEC: Commission Decision of 17 September 1974 exempting the Kingdom
    of Denmark from applying to certain species the Council Directive of 30 June 1969
    on the marketing of seed of oil and fibre plants (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '74/491/CEE: Décision de la Commission, du 17 septembre 1974, dispensant
