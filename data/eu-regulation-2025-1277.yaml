    certaines mesures restrictives spécifiques à l’encontre de certaines personnes
    et entités liées aux organisations EIIL (Daech) et Al-Qaida
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1277 der Kommission vom 24. Juni 2025
