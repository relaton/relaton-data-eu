title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1277 of 24 June 2025 amending
    for the 348th time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the ISIL (Da’esh) and Al-Qaida organisations
  type: main
- language: fr
  script: Latn
