id: EUDecision1975580
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 September 1975 authorizing the Kingdom of the
    Netherlands to approve for marketing for a period expiring on 31 December 1976,
    plants of Quercus pendunculata Ehrh. and Quercus borealis Michx., which do not
    comply with the requirements of the Council Directive on the marketing of forest
    reproductive material
  type: main
- language: fr
  script: Latn
  content: '75/580/CEE: Décision de la Commission, du 11 septembre 1975, autorisant
    le Royaume des Pays-Bas à admettre, pour une période qui expire le 31 décembre
    1976, la commercialisation des plants de Quercus Pedunculata Ehrh. et de Quercus
    Borealis Michx ne répondant pas aux exigences de la directive du Conseil concernant
    la commercialisation des matériels forestiers de reproduction'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. September 1975 zur Ermächtigung des
    Königreichs der Niederlande, für einen Zeitraum, der am 31. Dezember 1976 abläuft,
    Pflanzgut von Quercus pedunculata Ehrh. und von Quercus borealis Michx. zum gewerbsmäßigen
    Verkehr zuzulassen, das den Anforderungen der Richtlinie des Rates über den Verkehr
    mit forstlichem Vermehrungsgut nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 11. september 1975 om bemyndigelse af kongeriget
    Nederlandene til for en periode, der udløber den 31. december 1976, at tillade
    handel med plantemateriale af Quercus peduncalata Ehrh. og Quercul borealis Michx,
    der ikke opfylder kravene i Rådets direktiv om handel med forstligt formeringsmateriale
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 settembre 1975, che autorizza il Regno
    dei Paesi Bassi ad ammettere alla commercializzazione per un periodo che scade
    il 31 dicembre 1976 materiali di moltiplicazione di Quercus peduncolata Ehrh.
    e di Quercus borealis Michx. che non soddisfano alle condizioni della direttiva
    del Consiglio relativa alla commercializzazione dei materiali forestali di moltiplicazione
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 september 1975 houdende machtiging
    van het Koninkrijk der Nederlanden voor een periode eindigend op 31 december 1976,
    plantmateriaal van Quercus pedunculata Ehrh. en Quercus borealis Michx dat niet
    voldoet aan de eisen van de richtlijn van de Raad betreffende het in de handel
    brengen van bosbouwkundig teeltmateriaal, tot de handel toe te laten
  type: main
