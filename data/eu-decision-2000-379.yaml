    hydrobromofluorocarbons and methyl bromide for the period 1 January to 31 December
    2000 and in addition, allocating placing on the market quotas for hydrochlorofluorocarbons
    for the period 1 January to 31 December 2000 (notified under document number C(1999)
    4434) (Text with EEA relevance) (Only the Spanish, German, Danish, Greek, English,
    French, Italian, Dutch, Portuguese and Swedish texts are authentic)'
  type: main
