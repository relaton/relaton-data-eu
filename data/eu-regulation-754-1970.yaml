    au régime de primes à l'abattage de vaches et de primes à la non-commercialisation
    du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 754/70 der Kommission vom 24. April 1970 zur Änderung
