title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2910/93 of 20 October 1993 re-establishing
    the levying of customs duties on products of category 112 (order No 40.1120),
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2910/93 de la Commission du 20 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 112 (numéro d'ordre 40.1120) originaires de Chine, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2910/93 DER KOMMISSION vom 20. Oktober 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 112 (laufende Nummer 40.1120) mit
    Ursprung in China, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2910/93 af 20. oktober 1993 om genindførelse
    af opkrævning af told for varer under kategori 112 (løbenummer 40.1120), som
    har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
