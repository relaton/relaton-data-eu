title:
- language: en
  script: Latn
  content: Regulation (EEC) No 725/71 of the Council of 30 March 1971 extending to
    other imports the Annex to Regulation (EEC) No 109/70 establishing common rules
    for imports from state-trading countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 725/71 du Conseil, du 30 mars 1971, étendant à d'
    autres importations l' annexe du règlement (CEE) n° 109/70 portant établissement
    d' un régime commun applicable aux importations de pays à commerce d' État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 725/71 des Rates vom 30. März 1971 zur Ausdehnung
    des Anhangs der Verordnung (EWG) Nr. 109/70 zur Festlegung einer gemeinsamen Regelung
    für die Einfuhr aus Staatshandelsländern auf weitere Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning nr. 725/71/EØF af 30. marts 1971 om udvidelse med yderligere
    varer af bilaget til forordning nr. 109/70/EØF om fastlæggelse af en fælles
    ordning af indførslen fra statshandelslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 725/71 del Consiglio, del 30 marzo 1971, che estende
    ad altre importazioni l' allegato del regolamento (CEE) n. 109/70 che istituisce
    un regime comune applicabile alle importazioni dai paesi a commercio di Stato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 725/71 van de Raad van 30 maart 1971 inzake de uitbreiding
    met nieuwe produkten van de bijlage van Verordening (EEG) nr. 109/70 houdende
    totstandbrenging van een gemeenschappelijke regeling voor de invoer uit landen
    met staatshandel
  type: main
