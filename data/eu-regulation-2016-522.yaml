    kolmansien maiden tiettyihin julkisiin elimiin ja keskuspankkeihin sovellettavan
    poikkeuksen, markkinoiden manipuloinnin indikaattorien, tietojen julkistamisen
    raja-arvojen, lykkäämistä koskevat ilmoitukset vastaanottavan toimivaltaisen
    viranomaisen, suljettuina ajanjaksoina sallitun kaupankäynnin sekä johtohenkilöiden
    ilmoitettavien liiketoimien tyyppien osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/522 оd 17. prosinca 2015. o dopuni
    Uredbe (EU) br. 596/2014 Europskog parlamenta i Vijeća u pogledu izuzeća za
    određena javna tijela i središnje banke trećih zemalja, pokazatelja manipuliranja
    tržištem, pragova za objavljivanje, nadležnog tijela za obavijesti o odgodama,
    odobrenja trgovanja tijekom razdoblja zabrane trgovanja i vrste transakcija rukovoditelja
    o kojima se mora obavješćivati
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/522 felhatalmazáson alapuló rendelete (2015. december
    17.) az 596/2014/EU európai parlamenti és tanácsi rendeletnek a harmadik országok
    egyes állami szervei és központi bankjai részére biztosított mentesség,
    a piaci manipuláció jelei, a közzétételi küszöbértékek, a késleltetésekkel
    kapcsolatos értesítések tekintetében illetékes hatóság, a tilalmi időszak
    alatti kereskedésre vonatkozó engedélyek és a vezető tisztségviselők értesítési
    kötelezettséggel járó ügyleteinek típusai tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2016/522 della Commissione, del 17 dicembre 2015,
    che integra il regolamento (UE) n. 596/2014 del Parlamento europeo e del Consiglio
    per quanto riguarda l'esenzione di taluni organismi pubblici e delle banche centrali
    di paesi terzi, gli indicatori di manipolazioni del mercato, le soglie di comunicazione,
    l'autorità competente per le notifiche dei ritardi, il permesso di negoziare
    durante periodi di chiusura e i tipi di operazioni effettuate da persone che esercitano
    funzioni di amministrazione, di controllo o di direzione soggette a notifica
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2016/522 (2015. gada 17. decembris),
