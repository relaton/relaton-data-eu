- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2016/522 of 17 December 2015 supplementing
    Regulation (EU) No 596/2014 of the European Parliament and of the Council as regards
    an exemption for certain third countries public bodies and central banks, the
    indicators of market manipulation, the disclosure thresholds, the competent authority
    for notifications of delays, the permission for trading during closed periods
    and types of notifiable managers' transactions
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/522 de la Commission du 17 décembre 2015
    complétant le règlement (UE) n° 596/2014 du Parlement européen et du Conseil
    en ce qui concerne la dérogation de certains organismes publics et banques centrales
    de pays tiers, les indicateurs de manipulations de marché, les seuils de publication
    d'informations, l'autorité compétente pour les notifications de reports, l'autorisation
    de négociation pendant les périodes d'arrêt et les types de transactions à
    notifier par les dirigeants
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2016/522 der Kommission vom 17. Dezember 2015
    zur Ergänzung der Verordnung (EU) Nr. 596/2014 des Europäischen Parlaments und
    des Rates im Hinblick auf eine Ausnahme für bestimmte öffentliche Stellen und
    Zentralbanken von Drittstaaten, die Indikatoren für Marktmanipulation, die Schwellenwerte
    für die Offenlegung, die zuständige Behörde, der ein Aufschub zu melden ist,
    die Erlaubnis zum Handel während eines geschlossenen Zeitraums und die Arten
    meldepflichtiger Eigengeschäfte von Führungskräften
  type: main
