  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2016/522 ze dne 17. prosince
    2015, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    596/2014, pokud jde o výjimku pro některé veřejné orgány a centrální banky
    třetích zemí, ukazatele manipulace s trhem, prahové hodnoty pro zveřejnění,
    příslušný orgán pro oznamování odložení zveřejnění, povolování obchodů
