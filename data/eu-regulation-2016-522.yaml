    oznamovací povinnosti
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2016/522 af 17. december 2015
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 596/2014
    for så vidt angår en undtagelse for visse offentlige organer og centralbanker
    i tredjelande, indikatorerne for markedsmanipulation, tærsklerne for offentliggørelse
    af viden, den kompetente myndighed for underretninger om udsættelse, tilladelse
