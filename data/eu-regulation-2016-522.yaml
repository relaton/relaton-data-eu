    uz atbrīvojuma piemērošanu noteiktām trešo valstu publiskām struktūrām
    un centrālajām bankām, tirgus manipulāciju rādītājiem, robežvērtībām,
    kuras saistītas ar informācijas atklāšanu, kompetento iestādi, kam paziņo
    par atlikšanu, atļauju veikt tirdzniecību slēgtos periodos un pārvaldītāju
    veikto darījumu veidiem, par kuriem ir jāziņo
  type: main
- language: lt
  script: Latn
  content: 2015 m. gruodžio 17 d. Komisijos deleguotasis reglamentas (ES) 2016/522,
    kuriuo papildomos Europos Parlamento ir Tarybos reglamento (ES) Nr. 596/2014 nuostatos
    dėl tam tikroms trečiųjų šalių valstybės institucijoms ir centriniams bankams
    taikomos išimties, manipuliavimo rinka požymių, ribų, nuo kurių informacija
    turi būti atskleidžiama, kompetentingos institucijos, kuriai pranešama apie
    informacijos atskleidimo atidėjimą, leidimo prekiauti draudimo laikotarpiais
    ir vadovų sandorių, apie kuriuos reikia pranešti, rūšių
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2016/522 tas-17 ta' Diċembru 2015
    li jissupplimenta r-Regolament (UE) Nru 596/2014 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta' eżenzjoni għal ċerti korpi pubbliċi ta' pajjiżi terzi u l-banek
    ċentrali, l-indikaturi ta' manipulazzjoni tas-suq, il-limiti ta' divulgazzjoni,
    l-awtorità kompetenti għan-notifiki ta' ttardjar, il-permess għal negozjar
    matul perjodi magħluqa u t-tipi ta' tranżazzjonijiet tal-amministraturi notifikabbli
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2016/522 van de Commissie van 17 december
    2015 tot aanvulling van Verordening (EU) nr. 596/2014 van het Europees Parlement
    en de Raad met betrekking tot een vrijstelling voor bepaalde publieke organen
    en centrale banken in derde landen, de indicatoren van marktmanipulatie, de openbaarmakingsdrempels,
    de bevoegde autoriteit voor kennisgevingen van uitstel, de toestemming voor handel
    tijdens afgesloten perioden en typen aan te melden transacties van leidinggevenden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2016/522 z dnia 17 grudnia 2015
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 596/2014
    w kwestiach dotyczących wyłączenia niektórych organów publicznych i banków
    centralnych państw trzecich, okoliczności wskazujących na manipulację na rynku,
    progów powodujących powstanie obowiązku podania informacji do wiadomości publicznej,
    właściwych organów do celów powiadomień o opóźnieniach, zgody na obrót
    w okresach zamkniętych oraz rodzajów transakcji wykonywanych przez osoby pełniące
    obowiązki zarządcze podlegających obowiązkowi powiadomienia
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2016/522 da Comissão, de 17 de dezembro de 2015,
    que complementa o Regulamento (UE) n.° 596/2014 do Parlamento Europeu e do Conselho
    no que diz respeito a uma isenção para determinados organismos públicos e bancos
    centrais de países terceiros, aos indicadores de manipulação de mercado, aos
    limiares em matéria de divulgação, à autoridade competente para efeitos de
    notificação de diferimentos, à autorização de negociação durante períodos
    de negociação limitada e aos tipos de operações de dirigentes sujeitas a notificação
    obrigatória
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2016/522 al Comisiei din 17 decembrie 2015 de
    completare a Regulamentului (UE) nr. 596/2014 al Parlamentului European și al
    Consiliului în ceea ce privește o derogare aplicabilă anumitor organisme publice
    și băncilor centrale din țări terțe, indicatorii de manipulare a pieței,
    pragurile de publicare, autoritatea competentă pentru notificările amânărilor,
    permisiunea de tranzacționare în perioadele închise și tipurile de tranzacții
    efectuate de personalul de conducere care trebuie notificate
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2016/522 zo 17. decembra 2015, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 596/2014, pokiaľ
    ide o výnimku pre určité verejné orgány a centrálne banky tretích krajín,
    ukazovatele manipulácie s trhom, prahové hodnoty pre zverejňovanie informácií,
    príslušný orgán pre oznámenia o odkladoch, povolenie na obchodovanie počas
    zakázaného obdobia a typy povinne oznamovaných transakcií manažérov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/522 z dne 17. decembra 2015 o dopolnitvi
    Uredbe (EU) št. 596/2014 Evropskega parlamenta in Sveta v zvezi z izvzetjem nekaterih
    javnih organov in centralnih bank tretjih držav, kazalniki tržne manipulacije,
    pragovi za razkritje, pristojnim organom za obveščanje o odložitvah, dovoljenjem
    za trgovanje v zaprtem obdobju in vrstami poslov vodilnih delavcev, o katerih
    je treba poročati
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2016/522 de la Comisión, de 17 de diciembre de
    2015, por el que se completa el Reglamento (UE) n.° 596/2014 del Parlamento Europeo
    y del Consejo en lo que respecta a la exención relativa a determinados bancos
    centrales y organismos públicos de terceros países, los indicadores de manipulación
    de mercado, los umbrales de divulgación, la autoridad competente para las notificaciones
    de retrasos, la autorización de negociación durante períodos limitados y los
    tipos de operaciones de notificación obligatoria realizadas por los directivos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2016/522 av den 17 december 2015
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 596/2014
    vad gäller undantag för vissa tredjeländers offentliga myndigheter och centralbanker,
    indikatorer på marknadsmanipulation, tröskelvärden för offentliggörande,
    den behöriga myndigheten för anmälningar av uppskjutna offentliggöranden,
    tillstånd att handla under stängda perioder och typer av anmälningspliktiga
    transaktioner för personer i ledande ställning
