title:
- language: en
  script: Latn
  content: '2009/853/EC: Commission Decision of 26 November 2009 authorising France
    to conclude an agreement with Saint-Pierre-et-Miquelon, Mayotte, New Caledonia,
    French Polynesia and Wallis and Futuna respectively for transfers of funds between
    France and each of these territories to be treated as transfers of funds within
    France, pursuant to Regulation (EC) No 1781/2006 of the European Parliament and
    of the Council (notified under document C(2009) 9254)'
  type: main
- language: fr
  script: Latn
  content: '2009/853/CE: Décision de la Commission du 26 novembre 2009 autorisant
    la France à conclure un accord avec Saint-Pierre-et-Miquelon, Mayotte, la Nouvelle-Calédonie,
    la Polynésie française et Wallis-et-Futuna pour que les virements de fonds effectués
    entre la France et chacun de ces territoires soient traités comme des virements
    de fonds à l’intérieur de la France, conformément au règlement (CE) n o
    1781/2006 du Parlement européen et du Conseil [notifiée sous le numéro C(2009)
    9254]'
  type: main
- language: de
  script: Latn
  content: '2009/853/EG: Entscheidung der Kommission vom 26. November 2009 zur Ermächtigung
    Frankreichs, gemäß der Verordnung (EG) Nr. 1781/2006 des Europäischen Parlaments
    und des Rates eine Vereinbarung mit St. Pierre und Miquelon, Mayotte, Neukaledonien,
    Französisch-Polynesien beziehungsweise Wallis und Futuna zu schließen, damit
    Geldtransfers zwischen Frankreich und diesen Gebieten wie Geldtransfers innerhalb
    Frankreichs behandelt werden können (Bekannt gegeben unter Aktenzeichen K(2009)
    9254)'
  type: main
