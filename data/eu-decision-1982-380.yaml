title:
- language: en
  script: Latn
  content: '82/380/EEC: Commission Decision of 19 May 1982 establishing that the apparatus
    described as ''ATL - Echo/Doppler Duplex Diagnostic Ultrasound System, model Mark
    V'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/380/CEE: Décision de la Commission, du 19 mai 1982, constatant que
    l''importation de l''appareil dénommé "ATL - Echo/Doppler Duplex Diagnostic
    Ultrasound System, model Mark V" ne peut être faite en franchise des droits du
    tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/380/EWG: Entscheidung der Kommission vom 19. Mai 1982, mit der festgestellt
    wird, daß das Gerät ,,A.T.L.- Echo/Doppler Duplex Diagnostic Ultrasound System,
    model Mark V" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/380/EØF: Kommissionens beslutning af 19. maj 1982 om fastslåelse
    af, at indførsel af apparatet "ATL - Echo/Doppler Duplex Diagnostic Ultrasound
    System, model Mark V" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
