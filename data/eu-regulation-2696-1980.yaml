    de Internationale Koffieovereenkomst van 1976, wanneer quota van kracht zijn,
    van toepassing wordt in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2696/80 da Comissão, de 22 de Outubro de 1980, que
