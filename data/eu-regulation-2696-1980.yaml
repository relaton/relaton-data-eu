title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2696/80 of 22 October 1980 fixing the date
    on which the system of certificates of origin provided for under the International
    Coffee Agreement 1976 when quotas are in effect, shall become applicable in the
    Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº2696/80 de la Commission, du 22 octobre 1980, fixant
    la date de mise en application au sein de la Communauté du système de certificats
    d' origine prévu dans le cadre de l' accord international de 1976 sur le café
    lorsque les contingents sont en vigueur
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2696/80 der Kommission vom 22. Oktober 1980 zur Festsetzung
    des Zeitpunkts, von dem an das System von Ursprungserzeugnissen des Internationalen
    Kaffee-Übereinkommens von 1976 in Quotenzeiten in der Gemeinschaft anwendbar
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2696/80 af 22. oktober 1980 om fastsættelse
    af den dato, hvor ordningen med oprindelsescertifikater i henhold til Den internationale
    Kaffeoverenskomst af 1976, når kvoter er i kraft, finder anvendelse i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2696/80 της Επιτροπής
    της 22ας Οκτωβρίου 1980 περί καθορισμού της ημερομηνίας
    θέσεως σε εφαρμογή στην Κοινότητα του συστήματος
    πιστοποιητικών καταγωγής που προβλέπεται
    στο πλαίσιο της Διεθνούς Συμφωνίας του 1976 για
    τον καφέ, στην περίπτωση που ισχύουν οι ποσοστώσεις
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 2696/80, annettu 22 päivänä lokakuuta 1980,
    vuoden 1976 kansainvälisen kahvisopimuksen alkuperätodistusjärjestelmän täytäntöönpanopäivästä
    yhteisössä kiintiöiden voimassa ollessa
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2696/80 della Commissione, del 22 ottobre 1980, che
    fissa la data di applicazione in seno alla Comunità del sistema dei certificati
    di origine previsto nel quadro dell' accordo internazionale del 1976 sul caffè,
    quando i contingenti sono in vigore
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2696/80 van de Commissie van 22 oktober 1980 houdende
