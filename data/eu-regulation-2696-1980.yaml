    previsto no âmbito do Acordo Internacional sobre o Café de 1976 quando os contingentes
    estão em vigor
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº2696/80 de la Comisión, de 22 de octubre de 1980,
