title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2602/77 of 25 November 1977 re-establishing
    the levying of customs duties on fabric and other articles of asbestos falling
    within subheadings 68.13 B II and III, originating in Yugoslavia to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3021/76
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2602/77 de la Commission, du 25 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux tissus et
    autres ouvrages en amiante, des sous-positions tarifaires 68.13 B II et III, originaires
    de la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2602/77 der Kommission vom 25. November 1977 zur Wiedereinführung
    des Zollsatzes für Gewebe und andere Waren aus Asbest der Tarifstellen 68.13
    B II und III, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr.
    3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2602/77 af 25. november 1977 om genindførelse
    af opkrævning af toldafgifter for vævet stof og andre varer af asbest, under
    underposition 68.13 B II og III, som har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2602/77 della Commissione, del 25 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti ed altri lavori
    di amianto della sottovoce doganale 68.13 B II e III originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2602/77 van de Commissie van 25 november 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    en andere werken van asbest, van post 68.13 B II en III, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
