  script: Latn
  content: Regolamento delegato (UE) 2018/1641 della Commissione, del 13 luglio 2018,
    che integra il regolamento (UE) 2016/1011 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano ulteriormente
    le informazioni che gli amministratori di indici di riferimento critici o significativi
    devono fornire sulla metodologia utilizzata per determinare l'indice di riferimento,
    sul riesame interno, sull'approvazione della metodologia e sulle procedure per
    apportare modifiche rilevanti alla metodologia
  type: main
