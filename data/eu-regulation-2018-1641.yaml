    ide o regulačné technické predpisy, ktorými sa bližšie určujú informácie,
    ktoré majú poskytnúť správcovia kritických alebo významných referenčných
    hodnôt a ktoré sa týkajú metodiky používanej na určenie referenčnej hodnoty,
