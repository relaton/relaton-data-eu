    for så vidt angår reguleringsmæssige tekniske standarder til nærmere fastlæggelse
    af, hvilke oplysninger administratorer af kritiske eller væsentlige benchmarks
    skal give om den metodologi, der anvendes til fastlæggelse af benchmarket, den
    interne gennemgang og godkendelse af metodologien samt om procedurerne for væsentlige
    ændringer i metodologien
