title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2018/1641 of 13 July 2018 supplementing
    Regulation (EU) 2016/1011 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying further the information to be provided
    by administrators of critical or significant benchmarks on the methodology used
    to determine the benchmark, the internal review and approval of the methodology
    and on the procedures for making material changes in the methodology
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/1641 de la Commission du 13 juillet 2018
    complétant le règlement (UE) 2016/1011 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les informations que doivent
    fournir les administrateurs d'indices de référence d'importance critique ou
    d'importance significative sur la méthodologie utilisée pour déterminer ces
    indices, sur l'examen interne et l'approbation de cette méthodologie et sur les
    procédures qu'ils appliquent pour apporter à celle-ci des modifications importantes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/1641 der Kommission vom 13. Juli 2018 zur
    Ergänzung der Verordnung (EU) 2016/1011 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur näheren Ausführung der Informationen,
    die Administratoren kritischer oder signifikanter Referenzwerte über die Methodik
    zur Bestimmung des Referenzwerts, die interne Überprüfung und Genehmigung der
    Methodik und die Verfahren bei wesentlichen Änderungen der Methodik zur Verfügung
    stellen müssen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2018/1641 на Комисията
    от 13 юли 2018 година за допълнение на Регламент
    (ЕС) 2016/1011 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за допълнително конкретизиране на информацията,
    която администраторите на критични или значими
    бенчмаркове предоставят относно използваната
    методика за определяне на бенчмарка, вътрешния
    преглед и одобряване на методиката и относно
    процедурите за извършване на съществени промени
    в методиката
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2018/1641 ze dne 13. července
    2018, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2016/1011,
    pokud jde o regulační technické normy, které blíže stanoví další informace,
    jež musí poskytovat administrátoři referenčních hodnot s kritickým nebo
    značným významem a které se týkají metodiky používané k určení referenční
    hodnoty, vnitřního přezkumu a schvalování metodiky a postupů provádění
    podstatných změn metodiky
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2018/1641 af 13. juli 2018 om
