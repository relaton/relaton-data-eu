title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 745/93 of 17 March 1993 amending Regulation
    (EEC) No 3651/90 laying down general rules for applying the supplementary trade
    mechanism to movement of fresh fruit and vegetables between Portugal and the other
    Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 745/93 du Conseil, du 17 mars 1993, modifiant le règlement
    (CEE) n° 3651/90 déterminant les règles générales d' application du mécanisme
    complémentaire aux échanges de fruits et légumes frais entre le Portugal et
    les autres Etats membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 745/93 des Rates vom 17. März 1993 zur Änderung
    der Verordnung (EWG) Nr. 3651/90 zur Festlegung der Grundregeln für die Anwendung
    des ergänzenden Mechanismus im Handel mit frischem Obst und Gemüse zwischen
    Portugal und den übrigen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 745/93 af 17. marts 1993 om ændring af forordning
    (EØF) nr. 3651/90 om fastsættelse af generelle regler for anvendelsen af den
    supplerende mekanisme for samhandelen med friske frugter og grønsager mellem
    Portugal og de øvrige medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 745/93 του Συμβουλίου
    της 17ης Μαρτίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3651/90 για τον καθορισμό
    των γενικών κανόνων εφαρμογής του συμπληρωματικού
    μηχανισμού στις συναλλαγές νωπών οπωροκηπευτικών
    μεταξύ της Πορτογαλίας και των άλλων κρατών
    μελών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 745/93, annettu 17 päivänä maaliskuuta 1993,
    tuoreiden hedelmien ja vihannesten Portugalin ja muiden jäsenvaltioiden välisen
    kaupan täydentävän järjestelmän soveltamista koskevista yleisistä säännöistä
    annetun asetuksen (ETY) N:o 3651/90 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 745/93 del Consiglio, del 17 marzo 1993, recante modifica
    del regolamento (CEE) n. 3651/90 che stabilisce le norme generali d' applicazione
    del meccanismo complementare applicabile agli scambi di ortofrutticoli freschi
    tra il Portogallo e gli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 745/93 van de Raad van 17 maart 1993 houdende wijziging
    van Verordening (EEG) nr. 3651/90 tot vaststelling van de algemene voorschriften
    voor de toepassing van de aanvullende regeling voor het handelsverkeer van verse
    groenten en fruit tussen Portugal en de andere Lid-Staten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 745/93 do Conselho, de 17 de Março de 1993, que
    altera o Regulamento (CEE) n° 3651/90 que determina as regras gerais de aplicação
    do mecanismo complementar aplicável às trocas comerciais de frutas e produtos
    hortícolas frescos entre Portugal e os outros Estados-membros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 745/93 del Consejo, de 17 de marzo de 1993, que modifica
    el Reglamento (CEE) n° 3651/90 por el que se establecen las normas generales
    de aplicación del mecanismo complementario aplicable a los intercambios de frutas
    y hortalizas frescas entre Portugal y los demás Estados miembros
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 745/93 av den 17 mars 1993 om ändring av
