  content: Commission Regulation (EEC) No 470/88 of 19 February 1988 fixing, for the
    period 1 January to 31 December 1988, the maximum quantity of certain products
    of the oils and fats sector to be released for consumption and imported into Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 470/88 de la Commission du 19 février 1988 fixant
    pour la période allant du 1er janvier au 31 décembre 1988 la quantité maximale
    de certains produits du secteur des matières grasses à mettre à la consommation
    et à importer en Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 470/88 der Kommission vom 19. Februar 1988 zur Festsetzung
    der Höchstmengen bestimmter Erzeugnisse des Fettsektors, die in Spanien zum freien
    Verkehr abzufertigen und in dieses Land einzuführen sind, für den Zeitraum vom
    1. Januar bis zum 31. Dezember 1988
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 470/88 af 19. februar 1988 om fastsættelse
    for perioden 1. januar til 31. december 1988 af den største mængde af visse
    produkter inden for fedtstofsektoren, der kan overgå til frit forbrug i og importeres
    til Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 470/88 της Επιτροπής
    της 19ης Φεβρουαρίου 1988 που καθορίζει, για την
    περίοδο από την 1η Ιανουαρίου έως τις 31 Δεκεμβρίου
    1988, τη μέγιστη ποσότητα ορισμένων προϊόντων
    του τομέα των λιπαρών ουσιών που διατίθενται
    στην κατανάλωση και εισάγονται στην Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 470/88 della Commissione del 19 febbraio 1988 che
    fissa, per il periodo 1° gennaio - 31 dicembre 1988, la quantità massima di
    taluni prodotti del settore dei grassi da mettere in consumo e da importare in
    Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 470/88 van de Commissie van 19 februari 1988 tot
    vaststelling, voor het tijdvak van 1 januari tot en met 31 december 1988, van
    de maximumhoeveelheid van bepaalde in Spanje in consumptie te brengen of in te
    voeren produkten van de sector oliën en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 470/88 da Comissão de 19 de Fevereiro de 1988 que
