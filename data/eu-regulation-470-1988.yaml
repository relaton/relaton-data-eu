    a quantidade máxima de determinados produtos do sector das matérias gordas a
    introduzir no consumo e a importar em Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 470/88 de la Comisión de 19 de febrero de 1988 que
