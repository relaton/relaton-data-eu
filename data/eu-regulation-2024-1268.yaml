  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1268 of 6 May 2024 extending
    the definitive countervailing duties imposed by Implementing Regulation (EU) 2022/433
    on imports of stainless steel cold-rolled flat products originating in Indonesia
    to imports of stainless steel cold-rolled flat products consigned from Taiwan,
    Türkiye and Vietnam, whether declared as originating in Taiwan, Türkiye and
    Vietnam or not
