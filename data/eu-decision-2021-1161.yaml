    2017/1212, (EU) 2017/2449, (EU) 2019/2085 en (EU) 2019/2086 wat betreft de vergunninghouder
    en zijn vertegenwoordiger in de Unie voor het in de handel brengen van producten
    die geheel of gedeeltelijk bestaan uit of zijn geproduceerd met bepaalde genetisch
    gemodificeerde organismen (Kennisgeving geschied onder nummer C(2021) 5148) (Slechts
