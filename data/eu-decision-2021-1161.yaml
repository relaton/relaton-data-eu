    que altera a Decisão 2011/891/UE e as Decisões de Execução (UE) 2017/1211,
    (UE) 2017/1212, (UE) 2017/2449, (UE) 2019/2085 e (UE) 2019/2086 no que diz respeito
    ao detentor da autorização e ao seu representante na União para a colocação
    no mercado de produtos que contenham, sejam constituídos por ou sejam produzidos
    a partir de certos organismos geneticamente modificados [notificada com o número
    C(2021) 5148] (Texto relevante para efeitos do EEE) (Apenas faz fé o texto na
