    2017/2449, (EU) 2019/2085 in (EU) 2019/2086 glede imetnika odobritve za dajanje
    na trg proizvodov, ki vsebujejo nekatere gensko spremenjene organizme, so iz njih
    sestavljeni ali proizvedeni, in njegovega zastopnika v Uniji (notificirano pod
    dokumentarno številko C(2021) 5148) (Besedilo v nizozemskem jeziku je edino verodostojno)
  type: main
