    decyzję 2011/891/UE i decyzje wykonawcze (UE) 2017/1211, (UE) 2017/1212, (UE)
    2017/2449, (UE) 2019/2085 i (UE) 2019/2086 w odniesieniu do posiadacza zezwolenia
    na wprowadzanie do obrotu produktów zawierających niektóre organizmy zmodyfikowane
    genetycznie, składających się z nich lub z nich wyprodukowanych oraz do jego
