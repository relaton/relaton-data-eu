    (UE) 2017/1211, (UE) 2017/1212, (UE) 2017/2449, (UE) 2019/2085 y (UE) 2019/2086
    en lo que respecta al titular de la autorización y su representante en la Unión
    para la comercialización de productos que contengan o estén compuestos por determinados
    organismos modificados genéticamente, o se hayan producido a partir de ellos
    [notificada con el número C(2021) 5148] (El texto en lengua neerlandesa es el
