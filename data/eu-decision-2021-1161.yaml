title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1161 of 13 July 2021 amending
    Decision 2011/891/EU and Implementing Decisions (EU) 2017/1211, (EU) 2017/1212,
    (EU) 2017/2449, (EU) 2019/2085 and (EU) 2019/2086 as regards the authorisation
    holder and its representative in the Union for the placing on the market of products
    containing, consisting of, or produced from certain genetically modified organisms
    (notified under document C(2021) 5148) (Text with EEA relevance) (Only the Dutch
    text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1161 de la Commission du 13 juillet
    2021 modifiant la décision 2011/891/UE et les décisions d’exécution (UE)
    2017/1211, (UE) 2017/1212, (UE) 2017/2449, (UE) 2019/2085 et (UE) 2019/2086 en
    ce qui concerne le titulaire de l’autorisation et son représentant dans l’Union
    pour la mise sur le marché de produits contenant certains organismes génétiquement
    modifiés, consistant en ces organismes ou produits à partir de ceux-ci [notifiée
    sous le numéro C(2021) 5148] (Le texte en langue néerlandaise est le seul faisant
    foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1161 der Kommission vom 13. Juli 2021
    zur Änderung des Beschlusses 2011/891/EU und der Durchführungsbeschlüsse (EU)
    2017/1211, (EU) 2017/1212, (EU) 2017/2449, (EU) 2019/2085 und (EU) 2019/2086 hinsichtlich
    des Inhabers der Zulassungen für das Inverkehrbringen von Erzeugnissen, die bestimmte
    genetisch veränderte Organismen enthalten, aus ihnen bestehen oder aus ihnen
    hergestellt werden, und seines Vertreters in der Union (Bekannt gegeben unter
    Aktenzeichen C(2021) 5148) (Nur der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/1161 на Комисията
    от 13 юли 2021 година за изменение на Решение 2011/891/ЕС
    и решения за изпълнение (ЕС) 2017/1211, (ЕС) 2017/1212,
    (ЕС) 2017/2449, (ЕС) 2019/2085 и (ЕС) 2019/2086 по отношение
    на титуляря на разрешението и неговия представител
    в Съюза за пускането на пазара на продукти,
    съдържащи, състоящи се или произведени от определени
    генетично модифицирани организми (нотифицирано
    под номер С(2021) 5148) (само текстът на нидерландски
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1161 ze dne 13. července 2021,
    kterým se mění rozhodnutí 2011/891/EU a prováděcí rozhodnutí (EU) 2017/1211,
    (EU) 2017/1212, (EU) 2017/2449, (EU) 2019/2085 a (EU) 2019/2086, pokud jde o držitele
    povolení a jeho zástupce v Unii pro uvádění produktů, které obsahují určité
    geneticky modifikované organismy, sestávají z nich nebo jsou z nich vyrobeny,
    na trh (oznámeno pod číslem C(2021) 5148) (Text s významem pro EHP) (Pouze
    nizozemské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/1161 af 13. juli 2021
    om ændring af afgørelse 2011/891/EU og gennemførelsesafgørelse (EU) 2017/1211,
    (EU) 2017/1212, (EU) 2017/2449, (EU) 2019/2085 og (EU) 2019/2086 for så vidt
    angår indehaveren og dennes repræsentant i Unionen af tilladelsen til markedsføring
    af produkter, der indeholder, består af eller er fremstillet af visse genetisk
    modificerede organismer (meddelt under nummer C(2021) 5148) (Kun den nederlandske
    udgave er autentisk)
  type: main
- language: el
