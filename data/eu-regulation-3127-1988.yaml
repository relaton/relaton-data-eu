title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3127/88 of 11 October 1988 amending Regulation
    (EEC) No 2723/88 implementing additional measures applicable to holders of long-term
    storage contracts for table wine for the 1987/88 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3127/88 de la Commission du 11 octobre 1988 modifiant
    le règlement (CEE) n° 2723/88 mettant en oeuvre les mesures complémentaires
    réservées aux détenteurs de contrats de stockage à long terme des vins de
    table au titre de la campagne 1987/1988
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3127/88 DER KOMMISSION vom 11. Oktober 1988 zur Änderung
    der Verordnung (EWG) Nr. 2723/88 zur Anwendung der Inhabern langfristiger Lagerverträge
    für Tafelwein vorbehaltenen ergänzenden Maßnahmen für das Wirtschaftsjahr
    1987/88 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3127/88 af 11. oktober 1988 om ændring
    af forordning (EØF) nr. 2723/88 om gennemførelse af de supplerende foranstaltninger,
    der er forbeholdt indehavere af langfristede oplagringskontrakter for bordvin
    for produktionsåret 1987/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3127/88 της Επιτροπής
    της 11ης Οκτωβρίου 1988 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2723/88 για την εφαρμογή των συμπληρωματικών
    μέτρων που επιφυλάσσονται στους κατόχους συμβάσεων
    μακροχρονίου αποθεματοποιήσεως επιτραπεζίων
    οίνων για την περίοδο 1987/88
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3127/88 DELLA COMMISSIONE dell'' 11 ottobre 1988
    che modifica il regolamento (CEE) n. 2723/88 relativo all'' attuazione delle misure
    complementari riservate ai titolari di contratti di magazzinaggio a lungo termine
    dei vini da tavola per la campagna 1987/1988 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3127/88 VAN DE COMMISSIE van 11 oktober 1988 tot
    wijziging van Verordening (EEG) nr. 2723/88 houdende uitvoering van de aanvullende
    maatregelen ten behoeve van degenen die voor het wijnoogstjaar 1987/1988 langlopende
    opslagcontracten voor tafelwijn hebben gesloten #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3127/88 da Comissão de 11 de Outubro de 1988 que
    altera o Regulamento (CEE) n.° 2723/88 que estabelece a aplicação das medidas
    complementares reservadas aos titulares de contratos de armazenagem a longo prazo
    de vinhos de mesa, relativos à campanha de 1987/1988
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3127/88 DE LA COMISIÓN de 11 de octubre de 1988 por
    el que se modifica el Reglamento (CEE) no 2723/88, por el que se ponen en práctica
    las medidas complementarias reservadas a los poseedores de contratos de almacenamiento
    a largo plazo de los vinos de mesa para la campaña 1987/88 #'
  type: main
