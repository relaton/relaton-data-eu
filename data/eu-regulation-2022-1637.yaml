    űrlap meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1637 della Commissione del 5 luglio
    2022 recante modalità di applicazione della direttiva (UE) 2020/262 del Consiglio
    per quanto riguarda l’uso di documenti nell’ambito della circolazione di prodotti
    sottoposti ad accisa in sospensione dall’accisa e della circolazione di prodotti
    sottoposti ad accisa dopo l’immissione in consumo e che stabilisce il formulario
    da utilizzare per il certificato di esenzione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1637 (2022. gada 5. jūlijs),
