    angår anvendelse af dokumenter i forbindelse med punktafgiftspligtige varers
    bevægelser under en afgiftssuspensionsordning og ved punktafgiftspligtige varers
    bevægelser efter overgang til forbrug og om den formular, der skal anvendes til
    fritagelsesattesten
  type: main
- language: el
  script: Grek
