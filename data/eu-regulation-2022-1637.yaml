title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1637 of 5 July 2022 laying
    down the rules for the application of Council Directive (EU) 2020/262 as regards
    the use of documents in the context of movement of excise goods under a duty suspension
    arrangement and of movement of excise goods after release for consumption, and
    establishing the form to be used for the exemption certificate
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1637 de la Commission du 5 juillet
    2022 portant modalités d’application de la directive (UE) 2020/262 du Conseil
    en ce qui concerne l’utilisation de documents dans le cadre des mouvements de
    produits soumis à accise sous un régime de suspension de droits et des mouvements
    de produits soumis à accise après la mise à la consommation, et établissant
    le formulaire à utiliser pour le certificat d’exonération
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1637 der Kommission vom 5. Juli 2022
    mit Durchführungsbestimmungen zur Richtlinie (EU) 2020/262 des Rates hinsichtlich
    der Verwendung von Dokumenten im Zusammenhang mit der Beförderung verbrauchsteuerpflichtiger
    Waren in einem Verfahren der Steueraussetzung und der Beförderung verbrauchsteuerpflichtiger
    Waren nach der Überführung in den steuerrechtlich freien Verkehr und zur Festlegung
    des für die Freistellungsbescheinigung zu verwendenden Formulars
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1637 на Комисията
    от 5 юли 2022 година за определяне на правилата
    за прилагане на Директива (ЕС) 2020/262 на Съвета
    по отношение на използването на документи
    в контекста на движението на акцизни стоки
    под режим отложено плащане на акциз и на движението
    на акцизни стоки след освобождаване за потребление
    и за установяване на формуляра, който да се
    използва за удостоверението за освобождаване
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1637 ze dne 5. července 2022,
    kterým se stanoví prováděcí pravidla ke směrnici Rady (EU) 2020/262, pokud
    jde o používání dokladů v souvislosti s dopravou zboží podléhajícího
    spotřební dani v režimu s podmíněným osvobozením od daně a s dopravou
    zboží podléhajícího spotřební dani po propuštění ke spotřebě, a stanoví
    formulář, který se má použít pro osvědčení o osvobození od daně
  type: main
- language: da
  script: Latn
