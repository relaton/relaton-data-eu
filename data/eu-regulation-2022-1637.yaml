  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1637 z dnia 5 lipca 2022 r.
    ustanawiające zasady stosowania dyrektywy Rady (UE) 2020/262 w odniesieniu do
    stosowania dokumentów w kontekście przemieszczania wyrobów akcyzowych w procedurze
