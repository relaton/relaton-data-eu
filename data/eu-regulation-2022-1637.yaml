    gabenant akcizais apmokestinamas prekes, kurioms taikomas akcizų mokėjimo laikino
    atidėjimo režimas, ir gabenant išleistas vartoti akcizais apmokestinamas prekes,
    taikymo taisyklės ir atleidimo sertifikatui parengti naudotina forma
  type: main
- language: mt
  script: Latn
