    no que respeita à utilização de documentos no contexto da circulação de produtos
    sujeitos a impostos especiais de consumo em regime de suspensão do imposto e
    da circulação de produtos sujeitos a impostos especiais de consumo após a introdução
    no consumo, e que estabelece o formulário a utilizar para o certificado de isenção
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1637 al Comisiei din 5 iulie
    2022 de stabilire a normelor de aplicare a Directivei (UE) 2020/262 a Consiliului
    în ceea ce privește utilizarea documentelor în contextul deplasării produselor
    accizabile în regim suspensiv de accize și al deplasării produselor accizabile
    după eliberarea pentru consum, precum și a formularului care trebuie utilizat
    pentru certificatul de scutire
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1637 z 5. júla 2022, ktorým
    sa stanovujú pravidlá uplatňovania smernice Rady (EÚ) 2020/262, pokiaľ ide
    o používanie dokumentov v súvislosti s prepravou tovaru podliehajúceho spotrebnej
    dani v režime pozastavenia dane a s prepravou tovaru podliehajúceho spotrebnej
    dani po jeho uvedení do daňového voľného obehu, a ktorým sa stanovuje formulár,
    ktorý sa má používať pre osvedčenie o oslobodení od spotrebnej dane
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1637 z dne 5. julija 2022 o določitvi
    pravil za uporabo Direktive Sveta (EU) 2020/262 v zvezi z uporabo dokumentov v
    okviru gibanja trošarinskega blaga pod režimom odloga plačila trošarine in
    gibanja trošarinskega blaga po sprostitvi v porabo ter o določitvi obrazca,
    ki se uporabi za potrdilo o oprostitvi
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1637 de la Comisión de 5 de julio de
    2022 por el que se establecen las disposiciones de aplicación de la Directiva
    (UE) 2020/262 del Consejo en lo que respecta a la utilización de documentos en
    el contexto de la circulación de productos sujetos a impuestos especiales en
    régimen suspensivo y de la circulación de productos sujetos a impuestos especiales
    tras el despacho a consumo, y se establece el modelo de certificado de exención
    que debe utilizarse
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1637 av den 5 juli 2022
    om fastställande av tillämpningsföreskrifter för rådets direktiv (EU) 2020/262
    vad gäller användning av dokument i samband med flyttning av punktskattepliktiga
    varor under ett uppskovsförfarande och flyttning av punktskattepliktiga varor
    efter frisläppande för konsumtion, samt om fastställande av det formulär som
    ska användas för intyget om undantag
