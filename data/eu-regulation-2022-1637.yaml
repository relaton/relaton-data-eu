    uz dokumentu izmantošanu saistībā ar akcīzes preču pārvietošanu atliktās
    nodokļa maksāšanas režīmā un akcīzes preču pārvietošanu pēc nodošanas
    patēriņam, kā arī nosaka atbrīvojuma sertifikāta veidlapu
  type: main
- language: lt
  script: Latn
