  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1637 van de Commissie van 5 juli 2022
    tot vaststelling van de regels voor de toepassing van Richtlijn (EU) 2020/262
    van de Raad wat betreft het gebruik van documenten voor de overbrenging van accijnsgoederen
    onder een accijnsschorsingsregeling en de overbrenging van accijnsgoederen na
