title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 128/70 de la Commission, du 21 janvier 1970, fixant
    les taux des restitutions applicables, à compter du 1er février 1970, aux oeufs
    et jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 128/70 der Kommission vom 21. Januar 1970 zur Festsetzung
    der ab 1. Februar 1970 geltenden Erstattungssätze bei der Ausfuhr von Eiern und
    Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 128/70 della Commissione, del 21 gennaio 1970, che
    fissa i tassi delle restituzioni applicabili a decorrere dal 1 febbraio 1970 alle
    uova e ai tuorli d'uovo esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 128/70 van de Commissie van 21 januari 1970 houdende
    vaststelling van de restituties die met ingang van 1 februari 1970 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
  type: main
