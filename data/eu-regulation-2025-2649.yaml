    paramos sąlygų sistemos, tiesioginių išmokų formos intervencinių priemonių
    rūšių, intervencinių priemonių tam tikruose sektoriuose ir kaimo plėtros
    srityje rūšių ir metinių veiklos rezultatų ataskaitų, taip pat Reglamento
