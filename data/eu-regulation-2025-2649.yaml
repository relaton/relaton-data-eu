title:
- language: en
  script: Latn
  content: Regulation (EU) 2025/2649 of the European Parliament and of the Council
    of 19 December 2025 amending Regulation (EU) 2021/2115 as regards the conditionality
    system, types of intervention in the form of direct payment, types of intervention
    in certain sectors and rural development and annual performance reports and Regulation
    (EU) 2021/2116 as regards suspensions of payments, annual performance clearance
    and controls and penalties
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2025/2649 du Parlement européen et du Conseil du 19 décembre
    2025 modifiant le règlement (UE) 2021/2115 en ce qui concerne le système de
    conditionnalité, les types d’intervention sous la forme de paiements directs,
    les types d’intervention dans certains secteurs et dans le cadre du développement
    rural et les rapports annuels de performance, ainsi que le règlement (UE) 2021/2116
    en ce qui concerne la suspension des paiements, l’apurement annuel des performances,
    et les contrôles et les sanctions
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2025/2649 des Europäischen Parlaments und des Rates vom
