    Konditionalitätssystem, Interventionskategorien in Form von Direktzahlungen,
    Interventionskategorien in bestimmten Sektoren und zur Entwicklung des ländlichen
    Raums und jährliche Leistungsberichte sowie zur Änderung der Verordnung (EU)
    2021/2116 in Bezug auf Aussetzungen von Zahlungen, den jährlichen Leistungsabschluss
    sowie Kontrollen und Sanktionen
  type: main
- language: bg
  script: Cyrl
