title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 888/2003 of 22 May 2003 fixing the quantities
    which may be transferred to another group of varieties in Germany, Spain and Portugal
    under the guarantee threshold for the 2003 harvest in the raw tobacco sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 888/2003 de la Commission du 22 mai 2003 fixant les
    quantités de tabac brut pouvant être transférées vers un autre groupe de variétés
    dans le cadre du seuil de garantie pour la récolte 2003 en Allemagne, en Espagne
    et au Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 888/2003 der Kommission vom 22. Mai 2003 zur Festsetzung
    der Mengen Rohtabak, die im Rahmen der Garantieschwelle für die Ernte 2003 in
    Deutschland, Spanien und Portugal auf eine andere Sortengruppe übertragen werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 888/2003 af 22. maj 2003 om fastsættelse
    af de mængder råtobak, der kan overføres til en anden sortsgruppe i forbindelse
    med garantitærsklen for 2003-høsten i Tyskland, Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 888/2003 της Επιτροπής,
    της 22ας Μαΐου 2003, για τον καθορισμό των ποσοτήτων
    ακατέργαστου καπνού που μπορούν να μεταφερθούν
    προς άλλη ομάδα ποικιλιών στο πλαίσιο του κατωφλίου
    εγγύησης για τη συγκομιδή του 2003 στη Γερμανία,
    την Ισπανία και την Πορτογαλία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 888/2003, annettu 22 päivänä toukokuuta 2003,
    takuukynnyksen mukaisesti toiseen lajikeryhmään siirrettävissä olevista raakatupakkamääristä
    satovuoden 2003 osalta Saksassa, Espanjassa ja Portugalissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 888/2003 della Commissione, del 22 maggio 2003, che
    stabilisce i quantitativi di tabacco greggio che possono essere trasferiti ad
    un altro gruppo di varietà nel quadro del limite di garanzia per il raccolto
    2003 in Germania, in Spagna e in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 888/2003 van de Commissie van 22 mei 2003 tot vaststelling
    van de hoeveelheden ruwe tabak die in Duitsland, Spanje en Portugal in het kader
    van de garantiedrempels voor de oogst 2003 naar een andere soortengroep mogen
    worden overgedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 888/2003 da Comissão, de 22 de Maio de 2003, que
    fixa as quantidades de tabaco em rama que podem ser transferidas para outro grupo
    de variedades no quadro do limiar de garantia, em relação à colheita de 2003,
    na Alemanha, em Espanha e em Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 888/2003 de la Comisión, de 22 de mayo de 2003, por
    el que se fijan las cantidades de tabaco crudo que podrán transferirse a otro
    grupo de variedades, en el marco del umbral de garantía, para la cosecha de 2003
    en Alemania, España y Portugal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 888/2003 av den 22 maj 2003 om fastställande
    av de kvantiteter råtobak som får överföras till en annan sortgrupp inom ramen
    för garantitröskeln för skörden 2003 i Tyskland, Spanien och Portugal
  type: main
