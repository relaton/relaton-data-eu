    der Maul- und Klauenseuche in einigen französischen Departements zu treffenden
    Interventionsmaßnahmen für Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 900/79 af 4. maj 1979 om forlængelse
