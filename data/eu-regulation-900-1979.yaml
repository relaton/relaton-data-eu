  content: Commission Regulation (EEC) No 900/79 of 4 May 1979 extending Regulation
    (EEC) No 701/79 on the intervention measures to be taken in the beef and veal
    sector following outbreaks of foot-and-mouth disease in certain French departments
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 900/79 de la Commission, du 4 mai 1979, prorogeant
