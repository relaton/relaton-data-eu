    dans le secteur de la viande bovine suite à l' apparition de fièvre aphteuse
    dans certains départements français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 900/79 der Kommission vom 4. Mai 1979 zur Verlängerung
