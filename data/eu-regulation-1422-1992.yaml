  script: Latn
  content: Commission Regulation (EEC) No 1422/92 of 27 May 1992 reducing the basic
    price and buying-in price for peaches and nectarines for the 1992/93 marketing
    year following the overrun of the intervention threshold for 1991/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1422/92 de la Commission du 27 mai 1992 diminuant
    les prix de base et d'achat des pêches et des nectarines pour la campagne 1992/1993,
    par suite du dépassement du seuil d'intervention fixé pour la campagne 1991/1992
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1422/92 DER KOMMISSION vom 27. Mai 1992 zur Senkung
    der Grund- und Ankaufspreise für Pfirsiche und Nektarinen für das Wirtschaftsjahr
    1992/93 wegen Überschreitung der für das Wirtschaftsjahr 1991/92 festgesetzten
    Interventionsschwelle #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1422/92 af 27. maj 1992 om nedsættelse
    af basis- og opkøbspriserne for ferskner og nektariner for produktionsåret 1992/93
    som følge af overskridelsen af den for produktionsåret 1991/92 fastsatte interventionstærskel
    #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1422/92 της Επιτροπής
    της 27ης Μαΐου 1992 για τη μείωση των τιμών βάσης
    και αγοράς των ροδακίνων και των νεκταρινιών,
    κατά την περίοδο εμπορίας 1992/93, λόγω της υπέρβασης
    του κατωτάτου ορίου παρέμβασης που είχε ορισθεί
    για την περίοδο εμπορίας 1991/92
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1422/92 DELLA COMMISSIONE del 27 maggio 1992 recante
    diminuzione dei prezzi di base e dei prezzi d'' acquisto delle pesche e delle
    nettarine per la campagna 1992/1993, in seguito al superamento del limite d''
    intervento fissato per la campagna 1991/1992 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1422/92 VAN DE COMMISSIE van 27 mei 1992 tot verlaging
    van de basisprijzen en de aankoopprijzen voor perziken en nectarines voor het
    verkoopseizoen 1992/1993 in verband met de overschrijding van de voor het verkoopseizoen
    1991/1992 vastgestelde interventiedrempel #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1422/92 DA COMISSÃO de 27 de Maio de 1992 que diminui
    os preços de base e de compra dos pêssegos e das nectarinas para a campanha
    de 1992/1993 na sequência da superação do limiar de intervenção fixado para
    a campanha de 1991/1992 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1422/92 DE LA COMISIÓN de 27 de mayo de 1992 por
    el que se disminuyen los precios de base y de compra de los melocotones y nectarinas
    durante la campaña 1992/93 por haberse sobrepasado los umbrales de intervención
    fijados para la de 1991/92 #'
