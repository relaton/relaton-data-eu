title:
- language: en
  script: Latn
  content: '89/534/EEC: Council Decision of 24 May 1989 authorizing the United Kingdom
    to apply, in respect of certain supplies to unregistered resellers, a measure
    derogating from Article 11 A (1) (a) of the Sixth Directive 77/388/EEC on the
    harmonization of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '89/534/CEE: Décision du Conseil, du 24 mai 1989, autorisant le Royaume-Uni
    à appliquer à l''égard de certaines livraisons effectuées à des revendeurs
    non assujettis une mesure dérogatoire à l''article 11 point A. 1. a) de la sixième
    directive 77/388/CEE en matière d''harmonisation des législations des États
    membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '89/534/EWG: Entscheidung des Rates vom 24. Mai 1989 zur Ermächtigung
    des Vereinigten Königreichs zur Anwendung einer Sondermaßnahme bezüglich bestimmter
    Lieferungen an nichtsteuerpflichtige Wiederverkäufer in Abweichung von Artikel
    11 Teil A Absatz 1 Buchstabe a) der Sechsten Richtlinie 77/388/EWG zur Harmonisierung
    der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern'
  type: main
- language: da
  script: Latn
  content: '89/534/EØF: Rådets beslutning af 24. maj 1989 om bemyndigelse til Det
    Forenede Kongerige til på visse leverancer til ikke-afgiftspligtige handlende
    at anvende en foranstaltning, der fraviger artikel 11, litra A, nr. 1, litra a),
    i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes lovgivning
    om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '89/534/ΕΟΚ: Απόφαση του Συμβουλίου της 24ης
    Μαΐου 1989 με την οποία επιτρέπεται στο Ηνωμένο
    Βασίλειο να εφαρμόσει, ως προς ορισμένες παραδόσεις
    σε μικροπωλητές που δεν υπόκεινται σε φόρο,
    ένα μέτρο παρέκκλισης από το άρθρο 11 σημείο
    Α.1.α) της έκτης οδηγίας 77/388/ΕΟΚ περί της εναρμόνισης
    των νομοθεσιών των κρατών μελών των σχετικών
    με τους φόρους κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '89/534/CEE: Decisione del Consiglio, del 24 maggio 1989, che autorizza
    il Regno Unito ad applicare a talune cessioni effettuate a rivenditori che non
    siano soggetti passivi una misura di deroga all''articolo 11, punto A. 1. a) della
    sesta direttiva 77/388/CEE in materia di armonizzazione delle legislazioni degli
    Stati membri relative alle imposte sulla cifra d''affari'
  type: main
- language: nl
  script: Latn
  content: '89/534/EEG: Beschikking van de Raad van 24 mei 1989 waarbij het Verenigd
    Koninkrijk wordt gemachtigd om ten aanzien van bepaalde leveranties aan niet-
    belastingplichtige wederverkopers een maatregel toe te passen die afwijkt van
    artikel 11, punt A. 1, onder a), van de Zesde Richtlijn 77/388/EEG betreffende
    de harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '89/534/CEE: Decisão do Conselho, de 24 de Maio de 1989, que autoriza
    o Reino Unido a aplicar a certas entregas efectuadas a revendedores não sujeitos
    a imposto uma medida derrogatória do ponto A. 1. a) do artigo 11º da sexta Directiva
    77/388/CEE, relativa à harmonização das legislações dos Estados-membros respeitantes
    aos impostos sobre o volume de negócios'
  type: main
- language: es
  script: Latn
  content: '89/534/CEE: Decisión del Consejo, de 24 de mayo de 1989, por la que se
    autoriza al Reino Unido a que aplique, en relación con determinadas entregas
    efectuadas a revendedores que no son sujetos pasivos, una excepción al artículo
    11, punto A.1.a) de la Directiva 77/388/CEE en materia de armonización de las
    legislaciones de los Estados miembros relativas a los impuestos sobre el volumen
    de negocios'
  type: main
