  script: Latn
  content: Commission Implementing Regulation (EU) 2018/555 of 9 April 2018 concerning
    a coordinated multiannual control programme of the Union for 2019, 2020 and 2021
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
