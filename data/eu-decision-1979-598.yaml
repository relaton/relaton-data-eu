title:
- language: en
  script: Latn
  content: '79/598/EEC: Commission Decision of 31 May 1979 authorizing Ireland not
    to apply Community treatment to woven table linen, toilet and kitchen linen, other
    than of cotton terry fabric, falling within subheading ex 62.02 B of the Common
    Customs Tariff (NIMEXE codes 62.02-41, 43, 47, 65, 73, 77) (category 39), originating
    in Brazil and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/598/CEE: Décision de la Commission, du 31 mai 1979, autorisant l''Irlande
    à exclure du traitement communautaire le linge de table, linge de toilette, d''office
    ou de cuisine, tissé, autre que de coton bouclé du genre éponge, de la sous-position
    ex 62.02 B du tarif douanier commun (codes Nimexe: 62.02-41; 43; 47; 65; 73; 77)
    (catégorie 39), originaire du Brésil et mis en libre pratique dans les autres
    Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/598/EWG: Entscheidung der Kommission vom 31. Mai 1979, mit der Irland
    ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Tischwäsche, Wäsche zur Körperpflege und andere
    Haushaltswäsche, aus Geweben, andere als Wäsche aus Frottiergeweben, der Tarifstelle
    ex 62.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 62.02-41; 43; 47; 65;
    73; 77), Kategorie 39, von der Gemeinschaftsbehandlung auszuschließen (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/598/EØF: Kommissionens beslutning af 31. maj 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage dækketøj, håndklæder,
    vaskeklude, viskestykker og lignende køkkentekstiler, vævede, ikke af frotterstof,
    som henhører under pos. ex 62.02 B i den fælles toldtarif (NIMEXE-nummer 62.02-41,
    43, 47, 65, 73, 77; kategori 39), har oprindelse i Brasilien og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/598/CEE: Decisione della Commissione, del 31 maggio 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario biancheria da tavola, da toletta,
    da servizio o da cucine, tessuta, diversa da quella di cotone riccio di tipo spugna
    della sottovoce ex 62.02 B della tariffa doganale comune (codice Nimexe 62.02-41,
    43, 47, 65, 73, 77) categoria 39, originaria del Brasile e messa in libera pratica
    negli altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/598/EEG: Beschikking van de Commissie van 31 mei 1979 waarbij Ierland
    wordt gemachtigd tafellinnen, huishoudlinnen, ander dan van katoenen bad- of frotteerstof,
    van post ex 62.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 62.02-41,
    43, 47, 65, 73, 77) (categorie 39), van oorsprong uit Brazilië en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
