title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1142/87 of 24 April 1987 determining the
    extent to which applications lodged in April 1987 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1142/87 de la Commission, du 24 avril 1987, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importations déposées au mois d'avril 1987 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1142/87 der Kommission vom 24. April 1987 über den
    Umfang, in dem den im Monat April 1987 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1142/87 af 24. april 1987 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i april måned 1987 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1142/87 της Επιτροπής
    της 24ης Απριλίου 1987 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν του Απρίλιο του 1987 για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1142/87 della Commissione, del 24 aprile 1987, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1987 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1142/87 van de Commissie van 24 april 1987 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand april
    1987 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1142/87 da Comissão, de 24 de Abril de 1987, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação entregues no mês de Abril de 1987 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1142/87 de la Comisión, de 24 de abril de 1987, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de abril de 1987 para las carnes
    de vacuno congeladas destinadas a la transformación
  type: main
