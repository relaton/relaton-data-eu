id: EURegulation18981978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1898/78 of 2 August 1978 re-establishing
    the levying of customs duties on knives with cutting blades, excluding blades
    therefor and falling within heading No ex 82.09, originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1898/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    à lame tranchante ou dentelée, à l'exclusion de leurs lames, de la position
    EX 82.09 du tarif douanier commun, originaires des pays en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1898/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für Messer, mit schneidender oder gezahnter Klinge, ausgenommen
    Klingen dafür, der Tarifnummer ex 82.09 mit Ursprung in Entwicklungsländer,
    denen die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1898/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for knive, med skærende eller savtakket æg, undtagen
    tilhørende knivblade, under position ex 82.09, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1898/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante
    o dentata, escluse le loro lame, della voce doganale ex 82.09, originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1898/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten voor messen met snijdend lemmet,
    ook indien getand, met uitzondering van de lemmeten daarvoor, van post ex 82.09,
    van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad tariefpreferenties werden geopend
  type: main
