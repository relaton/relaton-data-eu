id: EURegulation29891990
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2989/90 of 16 October 1990 fixing the export
    refunds for products processed from fruit and vegetables as provided for in Article
    12 of Council Regulation (EEC) No 426/86 and amending Regulation (EEC) No 3846/87
    establishing an agricultural product nomenclature for export refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2989/90 de la Commission, du 16 octobre 1990, fixant,
    dans le secteur des produits transformés à base de fruits et légumes les restitutions
    à l'exportation prévues à l'article 12 du règlement (CEE) n° 426/86 du Conseil
    et modifiant le règlement (CEE) n° 3846/87, établissant la nomenclature des
    produits agricoles pour les restitutions à l'exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2989/90 der Kommission vom 16. Oktober 1990 zur Festsetzung
    der in Artikel 12 der Verordnung (EWG) Nr. 426/86 des Rates vorgesehenen Ausfuhrerstattungen
    für Verarbeitungserzeugnisse aus Obst und Gemüse und zur Änderung der Verordnung
    (EWG) Nr. 3846/87 zur Erstellung einer Nomenklatur der landwirtschaftlichen Erzeugnisse
    für Ausfuhrerstattungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2989/90 af 16. oktober 1990 om fastsættelse
    af de i artikel 12 i Rådets forordning (EØF) nr. 426/86 omhandlede eksportrestitutioner
    for produkter forarbejdet på basis af frugt og grønsager og om ændring af forordning
    (EØF) nr. 3846/87 om nomenklaturen over eksportrestitutioner for landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2989/90 της Επιτροπής
    της 16ης Οκτωβρίου 1990 για τον καθορισμό των
    επιστροφών κατά την εξαγωγή μεταποιημένων
    προϊόντων με βάση τα οπωροκηπευτικά, όπως προβλέπεται
    στο άρθρο 12 του κανονισμού (ΕΟΚ) αριθ. 426/86 του
    Συμβουλίου και για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3846/87, για τον καθορισμό της ονοματολογίας
    των γεωργικών προϊόντων για τις επιστροφές
    κατά την εξαγωγή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2989/90 della Commissione, del 16 ottobre 1990, che
    fissa, nel settore dei prodotti trasformati a base di ortofrutticoli, le restituzioni
    all'esportazione previste dell'articolo 12 del regolamento (CEE) n. 426/86 del
    Consiglio e modifica il regolamento (CEE) n. 3846/87 che stabilisce la nomenclatura
    dei prodotti agricoli per le restituzioni all'esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2989/90 van de Commissie van 16 oktober 1990 tot
    vaststelling van de in artikel 12 van Verordening (EEG) nr. 426/86 van de Raad
    bedoelde restituties bij de uitvoer in de sector van op basis van groenten en
    fruit verwerkte produkten en tot wijziging van Verordening (EEG) nr. 3846/87 tot
    vaststelling van de landbouwproduktennomenclatuur voor de uitvoerrestituties
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2989/90 da Comissão, de 16 de Outubro de 1990, que
    fixa as restituições à exportação de produtos transformados à base de frutas
    e produtos hortícolas previstas no artigo 12º do Regulamento (CEE) nº 426/86
    do Conselho e altera o Regulamento (CEE) nº 3846/87 que estabelece a nomenclatura
    dos produtos agrícolas para as restituições à exportação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2989/90 de la Comisión, de 16 de octubre de 1990,
    por el que se fijan las restituciones a la exportación para los productos transformados
    a base de frutas y hortalizas con arreglo a lo dispuesto en el artículo 12 del
    Reglamento (CEE) nº 426/86 del Consejo, y que modifica el Reglamento (CEE) nº
    3846/87 por el que se establece la nomenclatura de los productos agrarios para
    las restituciones a la exportación
  type: main
