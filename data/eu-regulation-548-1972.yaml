    temporaire des marges de fluctuations des monnaies des États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 548/72 der Kommission vom 16. März 1972 zur Änderung
    der Ausgleichsbeträge, die in der Landwirtschaft im Anschluß an die vorübergehende
    Erweiterung der Bandbreiten der Währungen der Mitgliedstaaten festgesetzt wurden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 548/72 della Commissione, del 16 marzo 1972, che modifica
    gli importi di compensazione fissati per il settore agricolo in seguito all'ampliamento
    temporaneo dei margini di fluttuazione delle monete degli Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 548/72 van de Commissie van 16 maart 1972 houdende
    wijziging van de compenserende bedragen welke naar aanleiding van de tijdelijke
    verruiming van de fluctuatiemarges van de valuta's van de Lid-Staten werden vastgesteld
    in de landbouwsector
