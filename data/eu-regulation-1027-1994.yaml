title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1027/94 of 2 May 1994 laying down to what
    extent applications for issue of export licences submitted during April 1994 for
    beef and veal products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1027/94 de la Commission, du 2 mai 1994, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'avril 1994 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1027/94 der Kommission vom 2. Mai 1994 über das Ausmaß,
    in dem den im April 1994 eingereichten Anträgen auf Ausfuhrlizenzen für Erzeugnisse
    des Rindfleischsektors, denen bei der Einfuhr in ein Drittland eine besondere
    Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1027/94 af 2. maj 1994 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i april
    1994 for oksekødsprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1027/94 της Επιτροπής
    της 2ας Μαΐου 1994 περί καθορισμού σε ποιό βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Απρίλιο 1994 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1027/94 della Commissione, del 2 maggio 1994, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di aprile 1994 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in un paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1027/94 van de Commissie van 2 mei 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in april 1994 ingediende aanvragen
    om uitvoercertificaten voor produkten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1027/94 da Comissão, de 2 de Maio de 1994, que determina
    em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Abril de 1994 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1027/94 de la Comisión, de 2 de mayo de 1994, por el
    que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentados en el mes de abril de 1994, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en un país tercero
  type: main
