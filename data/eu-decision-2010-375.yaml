title:
- language: en
  script: Latn
  content: '2010/375/: Commission Decision of 18 June 2010 on the allocation of quantities
    of controlled substances other than hydrochlorofluorocarbons allowed for essential
    or critical laboratory and analytical uses in the Union in 2010 under Regulation
    (EC) No 1005/2009 of the European Parliament and of the Council on substances
    that deplete the ozone layer (notified under document C(2010) 3850)'
  type: main
- language: fr
  script: Latn
  content: '2010/375/: Décision de la Commission du 18 juin 2010 concernant la répartition
    des quantités de substances réglementées autres que des hydrochlorofluorocarbones
    qui sont autorisées pour des utilisations essentielles ou critiques en laboratoire
    et à des fins d’analyse dans l’Union en 2010, en application du règlement
    (CE) n ° 1005/2009 du Parlement européen et du Conseil relatif à des substances
    qui appauvrissent la couche d’ozone [notifiée sous le numéro C(2010) 3850]'
  type: main
