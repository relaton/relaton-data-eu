title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 399/96 of 4 March 1996 extending the suspension
    of the definitive anti-dumping duties imposed on imports of certain types of electronic
    microcircuits known as DRAMs (dynamic random access memories) originating in Japan
    and in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 399/96 du Conseil, du 4 mars 1996, prorogeant la suspension
    des droits antidumping définitifs institués sur les importations de certains
    types de microcircuits électroniques, dits «DRAM» (dynamic random access memories
    - mémoires dynamiques à accès aléatoire) originaires du Japon et de République
    de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 399/96 des Rates vom 4. März 1996 zur Verlängerung
    der Aussetzung der endgültigen Antidumpingzölle auf die Einfuhren bestimmter
    elektronischer Mikroschaltungen, sogenannter DRAMs (dynamische Schreib-Lesespeicher),
    mit Ursprung in Japan und der Republik Korea
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 399/96 af 4. marts 1996 om forlængelse af
    gyldighedsperioden for suspensionen af den endelige antidumpingtold på importen
    af visse typer mikrokredsløb, såkaldte DRAMs (Dynamic Random Access Memories)
    med oprindelse i Japan og Republikken Korea
  type: main
- language: el
  script: Grek
