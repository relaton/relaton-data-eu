    τυχαίας προσπέλασης), καταγωγής Ιαπωνίας και
    Δημοκρατίας της Κορέας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 399/96, annettu 4 päivänä maaliskuuta 1996,
    tietyntyyppisten Japanista ja Korean tasavallasta peräisin olevien elektronisten
    mikropiirien, niin sanottujen DRAMien (dynamic random access memories) tuonnissa
    käyttöön otettujen lopullisten polkumyyntitullien väliaikaisen soveltamatta
    jättämisen jatkamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 399/96 del Consiglio, del 4 marzo 1996, che estende
    la sospensione dei dazi antidumping definitivi imposti sulle importazioni di alcuni
    tipi di microcircuiti elettronici detti DRAM (dynamic random access memories -
    memorie dinamiche ad eccesso casuale) originari del Giappone e della Repubblica
    di Corea
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 399/96 van de Raad van 4 maart 1996 tot verdere opschorting
    van de definitieve anti- dumpingrechten die zijn ingesteld op de invoer van bepaalde
    soorten elektronische microschakelingen bekend als DRAM's (dynamic random access
    memories) van oorsprong uit Japan en de Republiek Korea
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 399/96 do Conselho, de 4 de Março de 1996, que prorroga
