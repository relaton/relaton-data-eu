id: EURegulation9011980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 901/80 of 11 April 1980 re-establishing
    the levying of customs duties on textile fabrics impregnated, coated, covered
    or laminated with preparations of cellulose derivatives or of other artificial
    plastic materials, products of category 100 (code 1000), originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 901/80 de la Commission, du 11 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux tissus imprégnés,
    enduits ou recouverts de dérivés de la cellulose ou d' autres matières plastiques
    artificielles et tissus stratifiés avec ces mêmes matières, de la catégorie
    de produits n° 100 (code 1000), originaires de Corée du Sud bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 901/80 der Kommission vom 11. April 1980 über die
    Wiedereinführung des Zollsatzes für Gewebe, mit Zellulosederivaten oder anderen
    Kunststoffen getränkt, bestrichen oder überzogen oder mit Lagen aus diesen Stoffen
    versehen, der Warenkategorie Nr. 100 (Kennziffer 1000) mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 901/80 af 11. april 1980 om genindførelse
    af opkrævning af toldafgifter for tekstilstoffer, imprægneret, overtrukket eller
    lamineret med cellulosederivater eller anden plast, under kategori 100 (kode 1000),
    som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 901/80 della Commissione, dell' 11 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti impregnati,
    spalmati o ricoperti di derivati della cellulosa o di altre materie plastiche
    artificiali e tessuti stratificati di queste stesse materie, della categoria di
    prodotti n. 100 (codice 1000), originari della Corea del Sud, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 901/80 van de Commissie van 11 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels,
    geïmpregneerd met, voorzien van een deklaag van of bekleed met cellulosederivaten
    of andere kunstmatige plastische stoffen, alsmede weefsels met inlagen van deze
    stoffen, van de categorie van produkten nr. 100 (codenummer 1000), van oorsprong
    uit Zuid-Korea waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 2894/79 van de Raad
  type: main
