id: EUDecision1972175
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 avril 1972, autorisant la République
    française à exclure du traitement communautaire certains vêtements et articles
    confectionnés en matières textiles autres que le coton, des positions Ex 60.05,
    Ex 61.01, Ex 61.02, Ex 61.03 et Ex 62.03 du Tarif douanier commun, originaires
    de Corée du Sud et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/175/EWG: Entscheidung der Kommission vom 10. April 1972, mit der die
    Französische Republik ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche bestimmte Bekleidung und konfektionierte
    Waren aus anderen Textilien als Baumwolle der Tarifnummern ex 60.05, ex 61.01,
    ex 61.02, ex 61.03 und ex 62.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/175/CEE: Decisione della Commissione, del 10 aprile 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario taluni indumenti
    e manufatti confezionati di materie tessili diverse dal cotone delle voci nn.
    ex 60.05, ex 61.01, ex 61.02, ex 61.03 e ex 62.03 della tariffa doganale comune,
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/175/EEG: Beschikking van de Commissie van 10 april 1972 waarbij de
    Franse Republiek wordt gemachtigd bepaalde kleding en geconfectioneerde artikelen
    van textielstoffen andere dan katoen, van posten ex. 60.05, ex 61.01, ex 61.02,
    ex 61.03 en ex 62.03 van het gemeenschappelijk douanetarief, van oorsprong uit
    Zuid- Korea en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten'
  type: main
