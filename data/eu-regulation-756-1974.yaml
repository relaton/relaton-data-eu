title:
- language: en
  script: Latn
  content: Regulation (EEC) No 756/74 of the Commission of 1 April 1974 amending Regulation
    (EEC) No 2865/73 drawing up a list of agencies and laboratories which are empowered
    to issue the document accompanying wines for direct human consumption imported
    from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 756/74 de la Commission, du 1er avril 1974, modifiant
    le règlement (CEE) n° 2865/73 établissant les listes des organismes et des
    laboratoires habilités à établir le document accompagnant les vins importés
    des pays tiers destinés à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 756/74 der Kommission vom 1. April 1974 zur Änderung
    der Verordnung (EWG) Nr. 2865/73 zur Aufstellung der Verzeichnisse der Stellen
    und Laboratorien, die zur Ausstellung des Dokuments befugt sind, das aus Drittländern
    eingeführten und zum unmittelbaren menschlichen Verbrauch bestimmten Wein begleiten
    muß
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 756/74 af 1. april 1974 om ændring
    af forordning (EØF) nr. 2865/73 om oprettelse af lister over de organer og laboratorier
    som er berettigede til at udstede den attest, der skal ledsage vin, der fra tredjelande
    er indført til direkte menneskeligt forbrug
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 756/74 della Commissione, del 1° aprile 1974, recante
    modifica del regolamento (CEE) n. 2865/73 che stabilisce gli elenchi degli organismi
    e dei laboratori abilitati ad emettere il documento che accompagna i vini importati
    in provenienza dai paesi terzi e destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 756/74 van de Commissie van 1 april 1974 tot wijziging
    van Verordening (EEG) nr. 2865/73 houdende vaststelling van de lijsten der instanties
    en laboratoria die bevoegd zijn om het document op te stellen dat uit derde landen
    ingevoerde wijn bestemd voor rechtstreekse menselijke consumptie vergezelt
  type: main
