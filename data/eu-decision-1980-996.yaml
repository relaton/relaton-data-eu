title:
- language: en
  script: Latn
  content: '80/996/EEC: Commission Decision of 6 October 1980 authorizing Ireland
    not to apply Community treatment to woven table linen, toilet and kitchen linen,
    other than of cotton terry fabric, originating in India (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/996/CEE: Décision de la Commission, du 6 octobre 1980, autorisant
    l''Irlande à exclure du traitement communautaire le linge de table, de toilette,
    d''office ou de cuisine, tissé, autre que de coton bouclé du genre éponge,
    originaire de l''Inde (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/996/EWG: Entscheidung der Kommission vom 6. Oktober 1980 zur Ermächtigung
    Irlands, aus Indien stammende Tischwäsche, Wäsche zur Körperpflege und andere
    Haushaltswäsche, aus Geweben, andere als Wäsche aus Frottiergeweben aus Baumwolle
    von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/996/EØF: Kommissionens beslutning af 6. oktober 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage dækketøj, håndklæder,
    vaskeklude, viskestykker og lignende køkkentekstiler, vævede, ikke af frotterstof,
    med oprindelse i Indien (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/996/CEE: Decisione della Commissione, del 6 ottobre 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario la biancheria da tavola, da
    toletta, da servizio o da cucina, tessuta, diversa da quella di cotone riccio
    di tipo spugna, originaria dell''India (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/996/EEG: Beschikking van de Commissie van 6 oktober 1980 houdende machtiging
    van Ierland om tafellinnen, huishoudlinnen, ander dan van katoenen bad- of frotteerstof,
    van oorsprong uit India, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
