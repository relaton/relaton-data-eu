title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 19/82 of 6 January 1982 laying down detailed
    rules for applying Regulation (EEC) No 2641/80 with regard to imports of sheepmeat
    and goatmeat products originating in certain non-member countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 19/82 de la Commission, du 6 janvier 1982, portant
    modalités d' application du règlement (CEE) n° 2641/80 en ce qui concerne les
    importations de produits du secteur des viandes ovine et caprine originaires de
    certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 19/82 der Kommission vom 6. Januar 1982 mit Durchführungsbestimmungen
    zur Verordnung (EWG) Nr. 2641/80 hinsichtlich der Einfuhren von Erzeugnissen des
    Schaf- und Ziegenfleischsektors mit Ursprung in bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 19/82 af 6. januar 1982 om gennemførelsesbestemmelser
    til forordning (EØF) nr. 2641/80 for så vidt angår indførsel af fåre- og
    gedekød med oprindelse i visse tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 19/82 τής Επιτροπής τής
    6ης Ιανουαρίου 1982 περί τών λεπτομερειών εφαρμογής
    τού κανονισμού (EOK) αριθ. 2641/80 όσον αφορά τίς
    εισαγωγές προϊόντων τού τομέα τού προβείου
    καί αιγείου κρέατος καταγωγής ορισμένων τρίτων
    χωρών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 19/82, annettu 6 päivänä tammikuuta 1982,
    asetuksen (ETY) N:o 2641/80 soveltamista koskevista yksityiskohtaisista säännöistä
    tietyistä kolmansista maista peräisin olevien lampaan- ja vuohenliha-alan tuotteiden
    tuonnin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 19/82 della Commissione, del 6 gennaio 1982, che stabilisce
    le modalità di applicazione del regolamento (CEE) n. 2641/80 per quanto riguarda
    le importazioni di prodotti del settore delle carni ovine e caprine originari
    di taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 19/82 van de Commissie van 6 januari 1982 houdende
    uitvoeringsbepalingen van Verordening (EEG) nr. 2641/80 met betrekking tot de
    invoer van produkten uit de sector schape- en geitevlees van oorsprong uit bepaalde
    derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 19/82 da Comissão, de 6 de Janeiro de 1982, que
    estabelece as modalidades de aplicação do Regulamento (CEE) n.° 2641/80 no
    que se refere às importações de produtos do sector das carnes de ovino e caprino
    originários de certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 19/82 de la Comisión, de 6 de enero de 1982, por
    el que se establecen las modalidades de aplicación del Reglamento (CEE) n° 2641/80
    en lo que se refiere a las importaciones de productos del sector de las carnes
    de ovino y caprino, originarias de determinados terceros países
  type: main
- language: sv
  script: Latn
