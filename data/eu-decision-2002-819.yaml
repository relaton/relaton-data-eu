  script: Latn
  content: '2002/819/EC: Commission Decision of 18 October 2002 amending Decision
    98/569/EC laying down special conditions governing imports of live bivalve molluscs,
    echinoderms, tunicates and marine gastropods originating in Tunisia, and Decision
    98/570/EC laying down special conditions governing imports of fishery and aquaculture
    products originating in Tunisia (Text with EEA relevance) (notified under document
    number C(2002) 3906)'
  type: main
- language: fr
  script: Latn
