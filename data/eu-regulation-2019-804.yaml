title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/804 of 17 May 2019 concerning
    the renewal of the authorisation of organic form of selenium produced by Saccharomyces
    cerevisiae CNCM I-3060 and of selenomethionine produced by Saccharomyces cerevisiae
    NCYC R397 as feed additives for all animal species and repealing Regulations (EC)
    No 1750/2006 and (EC) No 634/2007
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/804 de la Commission du 17 mai 2019 concernant
    le renouvellement de l'autorisation de la forme organique du sélénium produite
    par Saccharomyces cerevisiae CNCM I-3060 et de la sélénométhionine produite
    par Saccharomyces cerevisiae NCYC R397 en tant qu'additifs pour l'alimentation
    de toutes les espèces animales et abrogeant les règlements (CE) n° 1750/2006
    et (CE) n° 634/2007
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/804 der Kommission vom 17. Mai 2019
    in Bezug auf die Erneuerung der Zulassung von Selen in organischer Form aus Saccharomyces
    cerevisiae CNCM I-3060 und von Selenomethionin aus Saccharomyces cerevisiae NCYC
    R397 als Zusatzstoffe in Futtermitteln für alle Tierarten und zur Aufhebung der
    Verordnungen (EG) Nr. 1750/2006 und (EG) Nr. 634/2007
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/804 на Комисията
    от 17 май 2019 година за подновяване на разрешението
    за употреба на органичната форма на селен,
    получена от Saccharomyces cerevisiae CNCM I-3060, и на селенометионин,
    получен от Saccharomyces cerevisiae NCYC R397, като фуражни
    добавки за всички видове животни и за отмяна
    на регламенти (ЕО) № 1750/2006 и (ЕО) № 634/2007
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/804 ze dne 17. května 2019 o
    obnovení povolení organické formy selenu ze Saccharomyces cerevisiae CNCM I-3060
    a selenomethioninu ze Saccharomyces cerevisiae NCYC R397 jako doplňkových látek
    pro všechny druhy zvířat a o zrušení nařízení (ES) č. 1750/2006 a (ES)
    č. 634/2007
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/804 af 17. maj 2019 om
    fornyelse af godkendelsen af organisk form for selen fremstillet af Saccharomyces
    cerevisiae CNCM I-3060 og af selenomethionin fremstillet af Saccharomyces cerevisiae
    NCYC R397 som fodertilsætningsstoffer til alle dyrearter og om ophævelse af
    forordning (EF) nr. 1750/2006 og (EF) nr. 634/2007
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/804 της Επιτροπής,
    της 17ης Μαΐου 2019, για την ανανέωση της έγκρισης
    της οργανικής μορφής του σεληνίου που παράγεται
    από Saccharomyces cerevisiae CNCM I-3060 και της σεληνομεθειονίνης
    που παράγεται από Saccharomyces cerevisiae NCYC R397 ως πρόσθετων
    υλών ζωοτροφών για όλα τα ζωικά είδη, και για
    την κατάργηση των κανονισμών (ΕΚ) αριθ. 1750/2006
