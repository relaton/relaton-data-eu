    przez Saccharomyces cerevisiae CNCM I-3060 i selenometioniny wytwarzanej przez
    Saccharomyces cerevisiae NCYC R397 jako dodatków paszowych dla wszystkich gatunków
    zwierząt oraz uchylające rozporządzenia (WE) nr 1750/2006 i (WE) nr 634/2007
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/804 da Comissão, de 17 de maio de
