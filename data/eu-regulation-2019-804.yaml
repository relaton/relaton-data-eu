    CNCM I-3060, in za selenometionin, ki ga proizvajajo Saccharomyces cerevisiae
    NCYC R397, kot krmna dodatka za vse živalske vrste ter o razveljavitvi uredb
    (ES) št. 1750/2006 in (ES) št. 634/2007
  type: main
