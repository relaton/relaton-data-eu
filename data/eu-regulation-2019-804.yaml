    prodotta permezz tas-Saccharomyces cerevisiae CNCM I-3060 u tas-selenometijonina
    prodotta permezz tas-Saccharomyces cerevisiae NCYC R397 bħala addittivi tal-għalf
    għall-ispeċijiet kollha tal-annimali u li jħassar ir-Regolamenti (KE) Nru 1750/2006
    u (KE) Nru 634/2007
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/804 van de Commissie van 17 mei 2019 betreffende
