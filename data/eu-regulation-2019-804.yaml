    ja Saccharomyces cerevisiae NCYC R397 abil saadud selenometioniini kõikide loomaliikide
    sööda lisandina ning millega tunnistatakse kehtetuks määrused (EÜ) nr 1750/2006
    ja (EÜ) nr 634/2007
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/804, annettu 17 päivänä
    toukokuuta 2019, Saccharomyces cerevisiae CNCM I-3060:n tuottaman orgaanisen seleenin
    ja Saccharomyces cerevisiae NCYC R397:n tuottaman selenometioniinin hyväksymisen
    uusimisesta kaikkien eläinlajien rehun lisäaineina ja asetusten (EY) N:o 1750/2006
    ja (EY) N:o 634/2007 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/804 оd 17. svibnja 2019. o produljenju
