    por Saccharomyces cerevisiae NCYC R397 como aditivos em alimentos para animais
    de todas as espécies e que revoga os Regulamentos (CE) n.° 1750/2006 e (CE)
    n.° 634/2007
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/804 al Comisiei din 17 mai
    2019 privind reînnoirea autorizației pentru forma organică de seleniu produsă
    de Saccharomyces cerevisiae CNCM I-3060 și pentru selenometionina produsă de
    Saccharomyces cerevisiae NCYC R397 ca aditivi furajeri pentru hrana tuturor speciilor
    de animale și de abrogare a Regulamentelor (CE) nr. 1750/2006 și (CE) nr. 634/2007
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/804 zo 17. mája 2019 o obnovení
    povolenia selénu v organickej forme produkovaného mikroorganizmom Saccharomyces
    cerevisiae CNCM I-3060 a selenometionínu produkovaného mikroorganizmom Saccharomyces
    cerevisiae NCYC R397 ako kŕmnych doplnkových látok pre všetky druhy zvierat
    a o zrušení nariadení (ES) č. 1750/2006 a (ES) č. 634/2007
  type: main
