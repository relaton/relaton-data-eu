    i selenometionina dobivenog od Saccharomyces cerevisiae NCYC R397 kao dodataka
    hrani za sve životinjske vrste i stavljanju izvan snage uredaba (EZ) br. 1750/2006
    i (EZ) br. 634/2007
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/804 végrehajtási rendelete (2019. május 17.)
    a Saccharomyces cerevisiae CNCM I-3060 által előállított szerves szelén és
    a Saccharomyces cerevisiae NCYC R397 által előállított szeleno-metionin valamennyi
    állatfaj takarmány-adalékanyagaként való engedélyezésének megújításáról,
    valamint az 1750/2006/EK és a 634/2007/EK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/804 della Commissione, del 17 maggio
    2019, relativo al rinnovo dell'autorizzazione della forma organica di selenio
    prodotto da Saccharomyces cerevisiae CNCM I-3060 e della selenometionina prodotta
    da Saccharomyces cerevisiae NCYC R397 come additivi per mangimi destinati a tutte
    le specie animali e recante abrogazione dei regolamenti (CE) n. 1750/2006 e (CE)
    n. 634/2007
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/804 (2019. gada 17. maijs), ar
    ko atjauno atļauju organisko selēnu, kas iegūts no Saccharomyces cerevisiae
    CNCM I-3060, un selēnmetionīnu, kas iegūts no Saccharomyces cerevisiae NCYC
    R397, izmantot par barības piedevām visu sugu dzīvniekiem un ar ko atceļ Regulas
    (EK) Nr. 1750/2006 un (EK) Nr. 634/2007
  type: main
- language: lt
  script: Latn
  content: 2019 m. gegužės 17 d. Komisijos įgyvendinimo reglamentas (ES) 2019/804
    dėl leidimo naudoti organinę seleno formą, gaunamą iš Saccharomyces cerevisiae
    CNCM I-3060, ir selenometioniną, gaunamą iš Saccharomyces cerevisiae NCYC R397,
    kaip visų rūšių gyvūnų pašarų priedus pratęsimo, kuriuo panaikinami reglamentai
    (EB) Nr. 1750/2006 ir (EB) Nr. 634/2007
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/804 tas-17 ta'
