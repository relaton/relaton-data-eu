    door Saccharomyces cerevisiae CNCM I-3060, en van selenomethionine, geproduceerd
    door Saccharomyces cerevisiae NCYC R397, als toevoegingsmiddelen voor diervoeding
    voor alle diersoorten en tot intrekking van de Verordeningen (EG) nr. 1750/2006
    en (EG) nr. 634/2007
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/804 z dnia 17 maja 2019 r.
