title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3665/91 of 16 December 1991 derogating from
    Regulation (EEC) No 2789/91 fixing the number of young male bovine animals which
    may be imported on special terms in the fourth quarter of 1991 and derogating
    from Regulation (EEC) No 2377/80 in respect of that quarter as regards the allocation
    of the quantities available
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3665/91 DE LA COMMISSION du 16 décembre 1991 portant
    dérogation au règlement (CEE) no 2789/91 relatif à la fixation de la quantité
    de jeunes bovins mâles pouvant être importés à des conditions spéciales pour
    le quatrième trimestre de 1991 et portant dérogation pour ce trimestre, au règlement
    (CEE) no 2377/80 en ce qui concerne l'' attribution des quantités disponibles
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3665/91 DER KOMMISSION vom 16. Dezember 1991 zur
    Abweichung von der Verordnung (EWG) Nr. 2789/91 zur Festsetzung der Anzahl männlicher
    Jungrinder, die im vierten Vierteljahr 1991 unter Sonderbedingungen eingeführt
    werden können, und zur Abweichung von der Verordnung (EWG) Nr. 2377/80 hinsichtlich
    der Zuteilung der verfügbaren Mengen in diesem Vierteljahr #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3665/91 af 16. december 1991 om undtagelse
    fra forordning (EØF) nr. 2789/91 om fastsættelse af den mængde ungtyre, der
    kan indføres på særlige betingelser i fjerde kvartal af 1991, og om undtagelse
    for dette kvartal fra forordning (EØF) nr. 2377/80 for så vidt angår tildelingen
    af disponible mængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3665/91 της Επιτροπής
    της 16ης Δεκεμβρίου 1991 για παρέκκλιση από τον
    κανονισμό ( ΕΟΚ ) αριθ. 2789/91 για τον καθορισμό
    των ποσοτήτων των νεαρών αρρένων βοοειδών
    που είναι δυνατόν να εισαχθούν με ειδικούς
    όρους κατά το τέταρτο τρίμηνο του 1991 και για
    παρέκκλιση, κατά το τρίμηνο αυτό, από τον κανονισμό
    ( ΕΟΚ ) αριθ. 2377/80 όσον αφορά την απόδοση των
    διαθέσιμων ποσοτήτων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3665/91 DELLA COMMISSIONE del 16 dicembre 1991 recante
    deroga al regolamento (CEE) n. 2789/91 che fissa il numero di giovani bovini maschi
    che possono essere importati a condizioni speciali nel quarto trimestre del 1991
    e recante deroga, per tale trimestre, al regolamento (CEE) n. 2377/80 per quanto
    riguarda l'' attribuzione dei quantitativi disponibili #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3665/91 VAN DE COMMISSIE van 16 december 1991 houdende
    afwijking van Verordening (EEG) nr. 2789/91 tot vaststelling van het aantal jonge
    mannelijke runderen dat in het vierde kwartaal van 1991 onder bijzondere voorwaarden
    mag worden ingevoerd, en houdende afwijking, voor dat kwartaal, van Verordening
    (EEG) nr. 2377/80 ten aanzien van de toewijzing van de beschikbare aantallen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3665/91 DA COMISSÃO de 16 de Dezembro de 1991 que
    estabelece uma derrogação ao Regulamento (CEE) no 2789/91 relativo à fixação
    da quantidade de vitelos machos que podem ser importados em condições especiais
    durante o quarto trimestre de 1991 e que prevê uma derrogação, no que diz respeito
    ao referido trimestre, ao Regulamento (CEE) no 2377/80, quanto à atribuição
    das quantidades disponíveis #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3665/91 DE LA COMISIÓN de 16 de diciembre de 1991
    por el que se establece una excepción al Reglamento (CEE) no 2789/91 por el que
    se fija la cantidad de machos jóvenes de la especie bovina que podrán importarse
    en condiciones especiales durante el cuarto trimestre de 1991 y por el que se
    establece una excepción, para este trimestre, al Reglamento (CEE) no 2377/80
    en lo relativo a la atribución de las cantidades disponibles #'
  type: main
