title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1797/88 of 27 June 1988 fixing for the 1988/89
    marketing year the components intended to ensure protection of the processing
    industry in the cereals and rice sector in trade between Spain and the Community
    of Ten
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1797/88 de la Commission du 27 juin 1988 déterminant
    pour la campagne 1988/1989 les éléments destinés à assurer, dans le secteur
    des céréales et du riz, la protection de l' industrie de transformation applicable
    aux échanges entre l' Espagne et la Communauté à Dix
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1797/88 der Kommission vom 27. Juni 1988 zur Festsetzung
    der im Wirtschaftsjahr 1988/89 geltenden Bestandteile zum Schutz der Verarbeitungsindustrie
    im Getreide- und Reissektor beim Handel zwischen Spanien und der Zehnergemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1797/88 af 27. juni 1988 om fastsættelse
    af de elementer for produktionsåret 1988/89, der anvendes i forbindelse med samhandelen
    mellem Spanien og De Ti, og som i korn- og rissektoren skal beskytte forarbejdningsindustrien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1797/88 της Επιτροπής
    της 27ης Ιουνίου 1988 που καθορίζει, για την περίοδο
    εμπορίας 1988/89, τα στοιχεία που προορίζονται
    να εξασφαλίσουν στον τομέα των σιτηρών και
    του ρυζιού την εφαρμοζόμενη στις συναλλαγές
    μεταξύ της Ισπανίας και της Κοινότητας των
    Δέκα προστασία της βιομηχανίας μεταποίησης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1797/88 della Commissione del 27 giugno 1988 che stabilisce
    per la campagna 1988/1989 gli elementi destinati a garantire, nel settore dei
    cereali e del riso, la protezione dell' industria di trasformazione applicabile
    negli scambi tra la Spagna e la Comunità a dieci
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1797/88 van de Commissie van 27 juni 1988 tot vaststelling
    van de voor het verkoopseizoen 1988/1989 geldende elementen ter bescherming van
    de verwerkende industrie in de sector granen en rijst in het handelsverkeer tussen
    Spanje en de Gemeenschap van de Tien
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1797/88 da Comissão de 27 de Junho de 1988 que
    determina, para a campanha de 1988/1989, os elementos destinados a assegurar,
    no sector dos cereais e do arroz, a protecção da indústria transformadora aplicável
    às trocas comerciais entre a Espanha e a Comunidade dos Dez
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1797/88 de la Comisión de 27 de junio de 1988 por
    el que se determinan los elementos destinados a asegurar la protección de la
    industria de transformación aplicable a los intercambios entre España y la Comunidad
    de los Diez, en el sector de los cereales y del arroz para la campaña 1988/89
