    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/549/CEE: Décision de la Commission, du 27 juillet 1982, constatant
    que l'' importation de l'' appareil dénommé "Nicolet - Data Acquisition System,
    model MED-80" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
