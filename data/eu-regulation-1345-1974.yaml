id: EURegulation13451974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1345/74 of the Commission of 30 May 1974 re-establishing
    the levying of customs duties on outer garments and clothing accessories, of cotton,
    falling within subheading Nos 60.05 A ex II and ex B, originating in India, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3503/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1345/74, de la Commission, du 30 mai 1974, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessus et accessoires du vêtement, de coton, des sous-positions tarifaires
    60.05 A EX II et EX B, originaires de l'Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1345/74 der Kommission vom 30. Mai 1974 über die
    Wiedereinführung des Zollsatzes für Oberkleidung, Bekleidungszubehör, aus Baumwolle,
    der Tarifstellen 60.05 A ex II und ex B, mit Ursprung in Indien, dem die in der
    Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1345/74 af 30. maj 1974 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande og tilbehør til
    beklædningsgenstande, af bomuld, under underpositionerne 60.05 A ex II og ex
    B, som har oprindelse i Indien, og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1345/74 della Commissione, del 30 maggio 1974, che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti esterni
    ed accessori di abbigliamento, di cotone delle sottovoci doganali n. 60/05 A ex
    II e ex B, originari dell'India beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1345/74 van de Commissie van 30 mei 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bovenkleding
    en kledingtoebehoren, van katoen, van onderverdelingen 60.05 A ex II en ex B,
    van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december 1973
  type: main
