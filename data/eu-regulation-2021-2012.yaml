    на временното мито, наложено върху вноса на
    студеновалцовани плоски продукти от неръждаема
    стомана с произход от Индия и Индонезия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/2012 ze dne 17. listopadu 2021,
    kterým se ukládá konečné antidumpingové clo a s konečnou platností se
    vybírá prozatímní clo uložené na dovoz plochých za studena válcovaných
    výrobků z korozivzdorné oceli pocházejících z Indie a Indonésie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/2012 af 17. november
    2021 om indførelse af en endelig antidumpingtold og endelig opkrævning af den
    midlertidige told på importen af koldvalsede flade produkter af rustfrit stål
    med oprindelse i Inden og Indonesien
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/2012 της Επιτροπής
