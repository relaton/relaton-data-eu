    go cinntitheach an dleacht shealadach a forchuireadh ar allmhairí de tháirgí
    cruach dosmálta cothroma fuar-rollta de thionscnamh na hIndia agus na hIndinéise
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/2012 оd 17. studenoga 2021. o uvođenju
