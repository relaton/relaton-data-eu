    impordi suhtes kehtestatud ajutine tollimaks
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/2012, annettu 17 päivänä
    marraskuuta 2021, lopullisen polkumyyntitullin käyttöönotosta Intiasta ja Indonesiasta
    peräisin olevien ruostumattomasta teräksestä valmistettujen kylmävalssattujen
    levyvalmisteiden tuonnissa ja kyseisessä tuonnissa käyttöön otetun väliaikaisen
    tullin lopullisesta kantamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/2012 ón gCoimisiún an 17 Samhain
