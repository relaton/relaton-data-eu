title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/2012 of 17 November 2021 imposing
    a definitive anti-dumping duty and definitively collecting the provisional duty
    imposed on imports of stainless steel cold-rolled flat products originating in
    India and Indonesia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/2012 de la Commission du 17 novembre
    2021 instituant un droit antidumping définitif et portant perception définitive
    du droit provisoire institué sur les importations de produits plats laminés
    à froid en aciers inoxydables originaires de l’Inde et d’Indonésie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/2012 der Kommission vom 17. November
    2021 zur Einführung eines endgültigen Antidumpingzolls und zur endgültigen
    Vereinnahmung des vorläufigen Zolls auf die Einfuhren von kaltgewalzten Flacherzeugnissen
    aus nicht rostendem Stahl mit Ursprung in Indien und Indonesien
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/2012 на Комисията
