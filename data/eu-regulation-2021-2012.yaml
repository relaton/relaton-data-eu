  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/2012 della Commissione del 17 novembre
    2021 che istituisce un dazio antidumping definitivo e riscuote definitivamente
    il dazio provvisorio istituito sulle importazioni di prodotti piatti di acciaio
    inossidabile laminati a freddo originari dell’India e dell’Indonesia
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/2012 (2021. gada 17. novembris),
    ar kuru nosaka galīgo antidempinga maksājumu un galīgi iekasē pagaidu maksājumu,
    kas noteikts Indijas un Indonēzijas izcelsmes plakanu nerūsējošā tērauda
    auksto velmējumu importam
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/2012 2021 m. lapkričio 17
    d. kuriuo importuojamiems Indijos ir Indonezijos kilmės plokštiems šaltai valcuotiems
    nerūdijančiojo plieno produktams nustatomas galutinis antidempingo muitas ir
    galutinai surenkamas laikinasis muitas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/2012 tas-17
    ta’ Novembru 2021 li jimponi dazju anti-dumping definittiv u li jiġbor b’mod
    definittiv id-dazju anti-dumping provviżorju impost fuq l-importazzjonijiet ta’
    prodotti tal-azzar inossidabbli llaminati ċatti fil-kiesaħ li joriġinaw mill-Indja
    u mill-Indoneżja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/2012 van de Commissie van 17 november
    2021 tot instelling van een definitief antidumpingrecht en tot definitieve inning
    van het voorlopige recht op koudgewalste platte producten van roestvrij staal
    van oorsprong uit India en Indonesië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/2012 z dnia 17 listopada 2021
    r. nakładające ostateczne cło antydumpingowe i stanowiące o ostatecznym pobraniu
    cła tymczasowego nałożonego na przywóz płaskich wyrobów ze stali nierdzewnej
    walcowanych na zimno pochodzących z Indii i Indonezji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/2012 da Comissão de 17 de novembro
    de 2021 que institui um direito anti-dumping definitivo e estabelece a cobrança
    definitiva do direito provisório instituído sobre as importações de produtos
    planos de aço inoxidável laminados a frio originários da Índia e da Indonésia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/2012 al Comisiei din 17 noiembrie
    2021 de instituire a unei taxe antidumping definitive și de percepere definitivă
    a taxei provizorii instituite asupra importurilor de produse plate din oțeluri
    inoxidabile laminate la rece originare din India și Indonezia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/2012 zo 17. novembra 2021, ktorým
    sa ukladá konečné antidumpingové clo a s konečnou platnosťou vyberá predbežné
    clo uložené na dovoz plochých výrobkov z nehrdzavejúcej ocele valcovaných
    za studena s pôvodom v Indii a Indonézii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/2012 z dne 17. novembra 2021 o uvedbi
    dokončne protidampinške dajatve in dokončnem pobiranju začasne dajatve na
    uvoz hladno valjanih ploščatih izdelkov iz nerjavnega jekla s poreklom iz Indije
    in Indonezije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/2012 de la Comisión de 17 de noviembre
    de 2021 por el que se establece un derecho antidumping definitivo y se percibe
    definitivamente el derecho provisional establecido sobre las importaciones de
    productos planos de acero inoxidable laminados en frío originarios de la India
    e Indonesia
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/2012 av den 17 november
    2021 om införande av en slutgiltig antidumpningstull och slutgiltigt uttag av
    den provisoriska tull som införts på import av kallvalsade platta produkter
    av rostfritt stål med ursprung i Indien och Indonesien
