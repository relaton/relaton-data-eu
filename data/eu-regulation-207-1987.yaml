    degli importi compensativi e la trasferibilità dei titoli rilasciati nell'ambito
    della gara per il prelievo all'importazione di granturco e di sorgo provenienti
    dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 207/87 van de Commissie van 23 januari 1987 tot wijziging
