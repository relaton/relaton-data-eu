title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 207/87 of 23 January 1987 amending Regulation
    (EEC) No 3140/86 as regards the advance fixing of compensatory amounts and the
    transferability of licences issued under the invitation to tender for the levy
    on imports of maize and sorghum from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 207/87 de la Commission, du 23 janvier 1987, modifiant
