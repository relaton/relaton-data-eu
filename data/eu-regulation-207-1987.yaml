    und der Übertragbarkeit der erteilten Lizenzen im Rahmen der Ausschreibung der
    Abschöpfung bei der Einfuhr von Mais und Sorghum aus Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 207/87 af 23. januar 1987 om ændring
    af forordning (EØF) nr. 3140/86 for så vidt angår forudfastsættelsen af de
    monetære udligningsbeløb og muligheden for at overdrage licenser udstedt i forbindelse
    med licitationen over importafgiften for majs og sorghum fra tredjelande
  type: main
- language: el
  script: Grek
