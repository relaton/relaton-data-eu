title:
- language: en
  script: Latn
  content: '85/630/EEC: Commission Decision of 17 December 1985 changing the import
    arrangements established by Council Regulation (EEC) No 3420/83 and applied in
    the Benelux countries in Denmark, in the Federal Republic of Germany, in Greece,
    in Ireland, in Italy and in the United Kingdom in respect of Romania regarding
    various industrial products (Only the French, Danish, German, Italian, Dutch,
    English, Greek and Irish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/630/CEE: Décision de la Commission du 17 décembre 1985 modifiant
    le régime d''importation prévu par le règlement (CEE) n° 3420/83 du Conseil
    et appliqué au Benelux, au Danemark, en République fédérale d''Allemagne,
    en Grèce, en Irlande, en Italie et au Royaume-Uni à l''égard de la Roumanie
    en ce qui concerne divers produits industriels (Les textes en langues française,
    danoise, allemande, italienne, néerlandaise, anglaise, grecque et irlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '85/630/EWG: Entscheidung der Kommission vom 17. Dezember 1985 zur Änderung
    der durch Verordnung (EWG) Nr. 3420/83 des Rates festgelegten und in den Beneluxländern,
    in Dänemark, der Bundesrepublik Deutschland, Griechenland, in Irland, in Italien
    und dem Vereinigten Königreich gegenüber Rumänien für einige gewerbliche Waren
    angewandten Einfuhrregelung (Nur der französische, dänische, deutsche, italienische,
    niederländische, englische, griechische und irischer Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/630/EØF: Kommissionens beslutning af 17. december 1985 om ændring
    af den importordning, der er fastsat ved Rådets forordning (EØF) nr. 3420/83,
    og som anvendes i Beneluxlandene, kongeriget Danmark, Forbundsrepublikken Tyskland,
    Grækenland, Irland, Italien og Det forenede Kongerige over for Rumænien for
    så vidt angår forskellige industrivarer (Kun den franske, danske, tyske, italienske,
    nederlandske, engelske, graeske, irsk og udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '85/630/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Δεκεμβρίου 1985 για την τροποποίηση του καθεστώτος
    εισαγωγής που προβλέπεται από τον κανονισμό
    (ΕΟΚ) αριθ. 3420/83 του Συμβουλίου και εφαρμόζεται
    στα κράτη της Μπενελούξ, στη Δανία, στην Ομοσπονδιακή
    Δημοκρατία της Γερμανίας, στην Ελλάδα, στην
    Ιρλανδία, στην Ιταλία και στο Ηνωμένο Βασίλειο,
    έναντι της Ρουμανίας, όσον αφορά διάφορα βιομηχανικά
    προϊόντα (Τα κείμενα στην γαλλική, δανική, γερμανική,
    ιταλική, ολλανδική, αγγλική, ελληνική και Ιρλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '85/630/CEE: Decisione della Commissione del 17 dicembre 1985 che modifica
    il regime d''importazione, istituito con regolamento (CEE) n. 3420/83 del Consiglio,
    applicato nel Benelux, in Danimarca, nella Repubblica federale di Germania, in
    Grecia, in Irlanda, in Italia e nel Regno Unito nei confronti della Romania per
    quanto concerne diversi prodotti industriali (Il testi in lingua francese, danese,
