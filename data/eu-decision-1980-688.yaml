title:
- language: en
  script: Latn
  content: '80/688/EEC: Commission Decision of 26 June 1980 authorizing Ireland not
    to apply Community treatment to pyjamas, knitted or crocheted, falling within
    subheading 60.04 B ex IV of the Common Customs Tariff (category 24), originating
    in Brazil and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/688/CEE: Décision de la Commission, du 26 juin 1980, autorisant l''Irlande
    à exclure du traitement communautaire les pyjamas de bonneterie, de la sous-
    position 60.04 B ex IV du tarif douanier commun (catégorie 24), originaires du
    Brésil et mis en libre pratique dans les autres Etats membres (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/688/EWG: Entscheidung der Kommission vom 26. Juni 1980, mit der Irland
    ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Schlafanzüge aus Gewirken der Tarifstelle 60.04
    B ex IV des Gemeinsamen Zolltarifs (Kategorie 24) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/688/EØF: Kommissionens beslutning af 26. juni 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage pyjamas af trikotage, som
    henhører under pos. 60.04 B ex IV i den fælles toldtarif (kategori 24), har
    oprindelse i Brasilien og frit kan omsættes i de øvrige medlemsstater (Kun den
    engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/688/CEE: Decisione della Commissione, del 26 giugno 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i pigiami a maglia della sottovoce
    60.04 B ex IV della tariffa doganale comune, categoria 24, originari del Brasile
    e messi in libera pratica negli altri Stati membri (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/688/EEG: Beschikking van de Commissie van 26 juni 1980 waarbij Ierland
    wordt gemachtigd pyjama''s van brei- of haakwerk, van post 60.04 B ex IV van het
    gemeenschappelijk douanetarief (categorie 24), van oorsprong uit Brazilië en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
