    yksityiskohtaisista säännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 377/93 della Commissione, del 12 febbraio 1993, che
    stabilisce le modalità d'applicazione relative allo smercio degli alcoli ottenuti
    dalle distillazioni di cui agli articoli 35, 36 e 39 del regolamento (CEE) n.
    822/87 del Consiglio e detenuti dagli organismi d'intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 377/93 van de Commissie van 12 februari 1993 tot
    vaststelling van de uitvoeringsbepalingen voor de afzet van alcohol die is verkregen
    bij distillatie als bedoeld in de artikelen 35, 36 en 39 van Verordening (EEG)
    nr. 822/87 van de Raad en die in het bezit is van de interventiebureaus
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 377/93 da Comissão, de 12 de Fevereiro de 1993,
    que estabelece as regras de execução relativas ao escoamento do álcoois provenientes
