title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 377/93 of 12 February 1993 laying down detailed
    rules for the disposal of alcohol obtained from the distillation operations referred
    to in Articles 35, 36 and 39 of Regulation (EEC) No 822/87 and held by intervention
    agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 377/93 de la Commission, du 12 février 1993, établissant
    les modalités d'application relatives à l'écoulement des alcools obtenus au
    titre des distillations visées aux articles 35, 36 et 39 du règlement (CEE)
    n° 822/87 du Conseil et détenus par les organismes d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 377/93 der Kommission vom 12. Februar 1993 mit Durchführungsbestimmungen
    für den Absatz von Alkohol aus der Destillation nach den Artikeln 35, 36 und
    39 der Verordnung (EWG) Nr. 822/87 des Rates aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 377/93 af 12. februar 1993 om gennemførelsesbestemmelser
    for afsætning af alkohol, der er fremstillet i henhold til de i artikel 35, 36
    og 39 i Rådets forordning (EØF) nr. 822/87 omhandlede destillationer, og som
    interventionsorganerne ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 377/93 της Επιτροπής
    της 12ης Φεβρουαρίου 1993 για τη θέσπιση των λεπτομερειών
    εφαρμογής σχετικά με τη διάθεση των αλκοολών
    που λαμβάνονται από τις αποστάξεις που αναφέρονται
    στα άρθρα 35, 36 και 39 του κανονισμού (ΕΟΚ) αριθ.
    822/87 του Συμβουλίου και ευρίσκονται στην κατοχή
    των οργανισμών παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 377/93, annettu 12 päivänä helmikuuta 1993,
