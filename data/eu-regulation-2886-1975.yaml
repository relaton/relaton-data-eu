title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2886/75 of the Council of 29 October 1975 opening,
    allocating and providing for the administration of a Community tariff quota for
    newsprint, falling within subheading 48.01 A of the Common Customs Tariff (1976),
    and extending temporarily this quota to include certain other types of paper
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2886/75 du Conseil, du 29 octobre 1975, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de papier
    journal de la sous-position 48.01 A du tarif douanier commun (année 1976) et
    étendant temporairement le bénéfice de ce même contingent à certains autres
    papiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2886/75 des Rates vom 29. Oktober 1975 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Zeitungsdruckpapier
    der Tarifstelle 48.01 A des Gemeinsamen Zolltarifs (1976) und zur vorübergehenden
    Ausdehnung dieses Kontingents auf bestimmte andere Papiere
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2886/75 af 29. oktober 1975 om åbning, fordeling
    og forvaltning af et fællesskabstoldkontingent for avispapir, henhørende under
    pos. 48.01 A i den fælles toldtarif (1976) og om midlertidig udvidelse af dette
    toldkontingent til også at omfatte visse andre former for papir
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2886/75 del Consiglio, del 29 ottobre 1975, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di carta da giornale della sottovoce 48.01 A della tariffa
    doganale comune (anno 1976) e relativo all'estensione temporanea del beneficio
    dello stesso contingente a talune altre carte
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2886/75 van de Raad van 29 oktober 1975 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor courantenpapier van onderverdeling 48.01 A van het gemeenschappelijk douanetarief
    (1976) en betreffende de tijdelijke uitbreiding van hetzelfde contingent tot bepaalde
    andere papiersoorten
  type: main
