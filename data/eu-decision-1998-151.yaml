title:
- language: en
  script: Latn
  content: '98/151/EC: Commission Decision of 10 February 1998 approving the monitoring
    plan for the detection of residues or substances in live animals and animal products
    presented by France (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/151/CE: Décision de la Commission du 10 février 1998 approuvant le
    plan de surveillance pour la recherche des résidus ou substances dans les animaux
    vivants et leurs produits, présenté par la France (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '98/151/EG: Entscheidung der Kommission vom 10. Februar 1998 zur Genehmigung
    des von Frankreich vorgelegten Überwachungsplans für die Ermittlung von Rückständen
    und Stoffen in lebenden Tieren und tierischen Erzeugnissen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/151/EF: Kommissionens beslutning af 10. februar 1998 om godkendelse
    af den af Frankrig forelagte overvågningsplan til undersøgelse for restkoncentrationer
    og stoffer i levende dyr og produkter heraf (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
