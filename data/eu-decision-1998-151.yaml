    για την ανίχνευση καταλοίπων ή ουσιών στα ζώντα
    ζώα και στα προϊόντα τους που υποβλήθηκε από
    τη Γαλλία (Το κείμενο στη γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '98/151/EY: Komission päätös, tehty 10 päivänä helmikuuta 1998, Ranskan
