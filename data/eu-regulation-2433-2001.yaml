title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2433/2001 of 6 December 2001 amending Regulation
    (EEC) No 2658/87 as regards suspension on an autonomous basis of the common customs
    tariff duties on certain industrial products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2433/2001 du Conseil du 6 décembre 2001 modifiant
    le règlement (CEE) n° 2658/87 en suspendant, à titre autonome, les droits du
    tarif douanier commun sur certains produits industriels
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2433/2001 des Rates vom 6. Dezember 2001 zur Änderung
    der Verordnung (EWG) Nr. 2658/87 hinsichtlich der autonomen Aussetzung der Zollsätze
    des Gemeinsamen Zolltarifs für bestimmte gewerbliche Waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2433/2001 af 6. december 2001 om ændring af
    forordning (EØF) nr. 2658/87 for så vidt angår suspension på et autonomt grundlag
    af toldstaterne i den fælles toldtarif for visse industriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2433/2001 του Συμβουλίου,
    της 6ης Δεκεμβρίου 2001, ο οποίος τροποποιεί τον
    κανονισμό (ΕΟΚ) αριθ. 2658/87 αναστέλλοντας, αυτόνομα,
    τους δασμούς του κοινού δασμολογίου για ορισμένα
    βιομηχανικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2433/2001, annettu 6 päivänä joulukuuta 2001,
    asetuksen (ETY) N:o 2658/87 muuttamisesta suspendoimalla yksipuolisesti yhteisen
    tullitariffin tullit tiettyjen teollisuustuotteiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2433/2001 del Consiglio, del 6 dicembre 2001, che modifica
    il regolamento (CEE) n. 2658/87 sospendendo, a titolo autonomo, i dazi della tariffa
    doganale comune per taluni prodotti industriali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2433/2001 van de Raad van 6 december 2001 tot wĳziging
    van Verordening (EEG) nr. 2658/87 en tot schorsing, op autonome basis, van de
    rechten van het gemeenschappelĳk douanetarief op bepaalde industrieproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2433/2001 do Conselho, de 6 de Dezembro de 2001,
    que altera o Regulamento (CEE) n.° 2658/87 mediante a suspensão, numa base autónoma,
    dos direitos da Pauta Aduaneira Comum para determinados produtos industriais
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2433/2001 del Consejo, de 6 de diciembre de 2001, por
    el que se modifica el Reglamento (CEE) n° 2658/87 suspendiendo, con carácter
    autónomo, los derechos del arancel aduanero común para determinados productos
    industriales
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2433/2001 av den 6 december 2001 om ändring
    av förordning (EEG) nr 2658/87 när det gäller upphävande på autonoma grundval
    av tullsatserna i Gemensamma tulltaxan för vissa industriprodukter
  type: main
