    31 December 1999 to the importation into the Community of goods covered by Council
    Regulation (EC) No 3448/93 under Agreements with Estonia, Latvia and Lithuania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1407/1999 de la Commission, du 29 juin 1999, déterminant
