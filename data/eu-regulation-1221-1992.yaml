title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1221/92 of 12 May 1992 re-establishing the
    levying of customs duties on products falling within CN code ex 4203, originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1221/92 de la Commission du 12 mai 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC ex
    4203 originaires de l'Inde bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1221/92 DER KOMMISSION vom 12. Mai 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes ex 4203 mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1221/92 af 12. maj 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode ex 4203 og med oprindelse
    i Indien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1221/92 της Επιτροπής
