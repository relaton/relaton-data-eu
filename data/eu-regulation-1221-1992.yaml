    τελωνειακών δασμών για τα προϊόντα του κωδικού
    ΣΟ ex 4203, καταγωγής Ινδίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1221/92 DELLA COMMISSIONE del 12 maggio 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC ex 4203, originari dell'' India beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1221/92 VAN DE COMMISSIE van 12 mei 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
