    dubbele controle zonder kwantitatieve beperkingen voor de uitvoer van bepaalde
    onder het EG-Verdrag en het EGKS-Verdrag vallende staalproducten uit de Republiek
    Kazachstan naar de Europese Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '1999/865/CE: Decisão do Conselho, de 29 de Novembro de 1999, relativa
