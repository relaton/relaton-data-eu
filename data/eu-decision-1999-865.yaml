  type: main
- language: fi
  script: Latn
  content: '1999/865/EY: Neuvoston päätös, tehty 29 päivänä marraskuuta 1999,
    Euroopan yhteisön ja Kazakstanin tasavallan hallituksen kirjeenvaihtona tehdyn
    sopimuksen tekemisestä, jolla perustetaan kaksinkertaisen tarkkailun järjestelmä
    ilman määrällisiä rajoituksia Euroopan yhteisön ja Euroopan hiili- ja teräsyhteisön
    perustamissopimusten soveltamisalaan kuuluvien tiettyjen terästuotteiden viennille
    Kazakstanin tasavallasta Euroopan yhteisöön'
  type: main
- language: it
  script: Latn
  content: '1999/865/CE: Decisione del Consiglio, del 29 novembre 1999, relativa alla
