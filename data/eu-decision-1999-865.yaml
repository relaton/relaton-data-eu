title:
- language: en
  script: Latn
  content: '1999/865/EC: Council Decision of 29 November 1999 concerning the conclusion
    of an Agreement in the form of an Exchange of Letters between the European Community
    and the Government of the Republic of Kazakhstan establishing a double-checking
    system without quantitative limits in respect of the export of certain steel products
    covered by the EC and ECSC Treaties from the Republic of Kazakhstan to the European
    Community'
  type: main
- language: fr
  script: Latn
  content: '1999/865/CE: Décision du Conseil, du 29 novembre 1999, relative à la
    conclusion d''un accord sous forme d''échange de lettres entre la Communauté
    européenne et le gouvernement de la République du Kazakhstan instituant un système
    de double contrôle sans limite quantitative à l''exportation de certains produits
    sidérurgiques couverts par les traités CECA et CE de la République du Kazakhstan
    dans la Communauté européenne'
  type: main
- language: de
  script: Latn
  content: '1999/865/EG: Beschluß des Rates vom 29. November 1999 über den Abschluß
