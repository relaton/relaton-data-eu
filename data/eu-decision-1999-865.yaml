    und der Regierung der Republik Kasachstan über die Einführung eines Systems
    der doppelten Kontrolle ohne mengenmäßige Beschränkungen für die Ausfuhr bestimmter
    unter den EG-Vertrag und den EGKS-Vertrag fallender Eisen- und Stahlerzeugnisse
    aus der Republik Kasachstan in die Europäische Gemeinschaft'
  type: main
- language: da
  script: Latn
  content: '1999/865/EF: Rådets afgørelse af 29. november 1999 om indgåelse af
