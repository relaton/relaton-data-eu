  content: '92/267/EEC: Commission Decision of 21 February 1992 on the establishment
    of overall quantities of food aid for 1992 and a list of products to be supplied
    as food aid'
  type: main
- language: fr
  script: Latn
  content: '92/267/CEE: Décision de la Commission du 21 février 1992 relative à
    la fixation des quantités globales d''aide alimentaire au titre du programme
    1992 et à l''établissement de la liste des produits à fournir à titre d''aide
    alimentaire'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 21. Februar 1992 zur Festlegung der Gesamtmengen
    der Nahrungsmittelhilfe im Rahmen des Programms für 1992 und zur Erstellung des
    Verzeichnisses der als Nahrungsmittelhilfe zu liefernden Erzeugnisse (92/267/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 21. februar 1992 om fastsættelse af de samlede
    mængder fødevarehjælp i henhold til 1992-programmet og af listen over produkter,
    der kan leveres som fødevarehjælp (92/267/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/267/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
