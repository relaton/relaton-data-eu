    συνολικών ποσοτήτων επισιτιστικής βοήθειας
    στο πλαίσιο του προγράμματος 1992 και την κατάρτιση
    του καταλόγου των προϊόντων που χορηγούνται
    ως επισιτιστική βοήθεια'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 21 febbraio 1992 che determina i quantitativi
