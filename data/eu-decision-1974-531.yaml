title:
- language: en
  script: Latn
  content: '74/531/EEC: Commission Decision of 16 October 1974 authorizing the Kingdom
    of the Netherlands to adopt more stringent provisions concerning the presence
    of ''Avena fatua'' in cereal seed (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '74/531/CEE: Décision de la Commission, du 16 octobre 1974, autorisant
    le Royaume des Pays-Bas à prendre des dispositions plus strictes en ce qui concerne
    la présence d''Avena fatua dans les semences de céréales (Le texte en langue
    néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '74/531/EWG: Entscheidung der Kommission vom 16. Oktober 1974 zur Ermächtigung
    des Königreichs der Niederlande, bezüglich des Vorhandenseins von Avena fatua
    in Getreidesaatgut strengere Vorschriften zu erlassen (Nur der niederländische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '74/531/EØF: Kommissionens Beslutning af 16. oktober 1974 om bemyndigelse
    for kongeriget Nederlandene til at træffe strengere bestemmelser, for så vidt
    angår indholdet af Avena fatua i sædekorn (Kun den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '74/531/ΕΟΚ: Απόφαση της Επιτροπής, της 16ης
    Οκτωβρίου 1974, με την οποία επιτρέπεται στο
    Βασίλειο των Κάτω Χωρών να λάβει πιο αυστηρά
    μέτρα όσον αφορά την παρουσία Avena fatua στους
    σπόρους δημητριακών (Το κείμενο στην ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '74/531/CEE: Decisione della Commissione, del 16 ottobre 1974, che autorizza
    il Regno dei Paesi Bassi ad adottare disposizioni più restrittive per quanto
    riguarda la presenza di Avena fatua nelle sementi di cereali (Il testo in lingua
    olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '74/531/EEG: Beschikking van de Commissie van 16 oktober 1974 houdende
