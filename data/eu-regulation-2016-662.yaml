title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/662 of 1 April 2016 concerning
    a coordinated multiannual control programme of the Union for 2017, 2018 and 2019
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/662 de la Commission du 1er avril 2016
    concernant un programme de contrôle, pluriannuel et coordonné, de l'Union pour
    2017, 2018 et 2019, destiné à garantir le respect des teneurs maximales en résidus
    de pesticides dans et sur les denrées alimentaires d'origine végétale et animale
    et à évaluer l'exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/662 der Kommission vom 1. April 2016
    über ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2017, 2018
    und 2019 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/662 на Комисията
    от 1 април 2016 година относно координирана многогодишна
    контролна програма на Съюза за 2017, 2018 и 2019 г.
    за гарантиране на спазването на максимално
    допустимите граници на остатъчни вещества
    от пестициди във и върху храни от животински
    и растителен произход и за оценка на експозицията
    на потребителите на тези пестицидни остатъци
  type: main
- language: cs
  script: Latn
