    víceletém kontrolním programu Unie pro roky 2017, 2018 a 2019 s cílem zajistit
    dodržování maximálních limitů reziduí pesticidů v potravinách rostlinného
    a živočišného původu a na jejich povrchu a vyhodnotit expozici spotřebitelů
    těmto reziduím pesticidů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/662 af 1. april 2016
