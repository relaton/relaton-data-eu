  content: Council Regulation (EEC) No 2069/81 of 20 July 1981 fixing, for the 1981/82
    marketing year, the production aid for tinned pineapple and the minimum price
    to be paid to pineapple producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2069/81 du Conseil, du 20 juillet 1981, fixant, pour
    la campagne 1981/1982, le montant de l' aide à la production pour les conserves
    d' ananas ainsi que le prix minimal à payer aux producteurs d' ananas
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2069/81 des Rates vom 20. Juli zur Festsetzung der
    Beihilfe für die Erzeugung von Ananaskonserven und des den Ananaserzeugern zu
    zahlenden Mindestpreises für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2069/81 af 20. juli 1981 om fastsættelse
    for produktionsåret 1981/82 af producentstøtten til ananaskonserves samt den
    minimumspris, der skal betales til ananasproducenterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2069/81 τού Συμβουλίου
