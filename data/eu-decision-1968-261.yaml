id: EUDecision1968261
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision du Conseil du 18 juin 1968, portant suspension totale ou partielle
    des droits du Tarif douanier commun applicables à certains produits destinés
    à être incorporés dans la construction d'avions ou à être utilisés à des
    fins d'entretien ou de réparation sur des avions ou des hélicoptères d'un poids
    à vide de 2.000 kg exclus à 15.000 kg inclus
  type: main
- language: de
  script: Latn
  content: '68/261/EWG: Entscheidung des Rates vom 18. Juni 1968 über die vollständige
    oder teilweise Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für bestimmte
    Waren, die zum Bau von Flugzeugen (ausgenommen Hubschrauber) oder zur Instandhaltung
    oder Instandsetzung von Flugzeugen einschließlich Hubschraubern mit einem Leergewicht
    von mehr als 2 000 kg bis 15 000 kg bestimmt sind'
  type: main
- language: it
  script: Latn
  content: '68/261/CEE: Decisione del Consiglio, del 18 giugno 1968, relativa alla
    sospensione totale o parziale dei dazi della tariffa doganale comune applicabili
    ad alcuni prodotti destinati ad essere incorporati nella costruzione di aerei
    o ad essere utilizzati per la manutenzione o riparazione di aerei o di elicotteri
    del peso a vuoto di 2.000 kg esclusi a 15.000 kg inclusi'
  type: main
- language: nl
  script: Latn
  content: '68/261/EEG: Beschikking van de Raad van 18 juni 1968 houdende volledige
    of gedeeltelijke schorsing van de rechten van het gemeenschappelijk douanetarief
    voor sommige produkten, bestemd om te worden gebruikt voor de bouw van vliegtuigen
    of voor het onderhoud of de reparatie van vliegtuigen of hefschroefvliegtuigen
    met een leeggewicht van meer dan 2.000 kilogram doch niet meer dan 15.000 kilogram'
  type: main
