  content: Council Decision (EU) 2025/2418 of 27 October 2025 on the position to be
    taken on behalf of the European Union within the Specialised Committee on Road
    Transport established by the Trade and Cooperation Agreement between the European
    Union and the European Atomic Energy Community, of the one part, and the United
    Kingdom of Great Britain and Northern Ireland, of the other part, on the amount
