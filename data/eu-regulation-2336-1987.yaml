  content: Commission Regulation (EEC) No 2336/87 of 30 July 1987 re-establishing
    the levying of customs duties on urea containing more than 45 % by weight of nitrogen
    on the dry anhydrous product falling within subheading 31.02 B, originating in
    Venezuela, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2336/87 de la Commission du 30 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables à l' urée
    d' une teneur en azote supérieure à 45 % en poids du produit anhydré à l'
    état sec de la sous-position 31.02 B du tarif douanier commun originaires du
    Venezuela, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
