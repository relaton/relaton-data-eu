    der Tarifstelle 31.02 B des Gemeinsamen Zolltarifs mit Ursprung in Venezuela,
    dem die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2336/87 af 30. juli 1987 om genindførelse
