  content: Décision de la Commission, du 6 décembre 1972, constatant que les conditions
    prévues pour la mobilisation du froment tendre destiné à une action nationale
    d'aide alimentaire sont remplies
  type: main
- language: de
  script: Latn
  content: '72/437/EWG: Entscheidung der Kommission vom 6. Dezember 1972 zur Feststellung,
    daß die Voraussetzungen für die Bereitstellung von Weichweizen für eine nationale
    Nahrungsmittelhilfsaktion erfüllt sind'
  type: main
- language: it
  script: Latn
  content: '72/437/CEE: Decisione della Commissione, del 6 dicembre 1972, che constata
    che le condizioni previste per la mobilitazione di frumento tenero destinato ad
    un''azione nazionale per gli aiuti alimentari sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '72/437/EEG: Beschikking van de Commissie van 6 december 1972 houdende
    de constatering dat aan de voor het beschikbaar stellen van zachte tarwe voor
    een nationale actie voor voedselhulp gestelde voorwaarden is voldaan'
