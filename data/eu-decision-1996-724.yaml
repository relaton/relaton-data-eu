title:
- language: en
  script: Latn
  content: '96/724/EC: Commission Decision of 29 November 1996 amending Decision 93/467/EEC
    authorizing Member States to provide for derogations from certain provisions of
    Council Directive 77/93/EEC, in respect of oak (Quercus L.) logs with bark attached,
    originating in Canada or the United States of America'
  type: main
- language: fr
  script: Latn
  content: '96/724/CE: Décision de la Commission du 29 novembre 1996 modifiant la
    décision 93/467/CEE autorisant les États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    les grumes de chêne (Quercus L.) avec écorce originaires du Canada ou des États-Unis
    d''Amérique'
  type: main
- language: de
  script: Latn
  content: '96/724/EG: Entscheidung Der Kommission vom 29. November 1996 zur Änderung
    der Entscheidung 93/467/EWG zur Ermächtigung der Mitgliedstaaten, für Eichenstämme
    (Quercus L.) mit Rinde mit Ursprung in Kanada oder den Vereinigten Staaten von
    Amerika Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates
    vorzusehen'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. listopadu 1996, kterým se mění rozhodnutí
    Komise 93/467/EHS, kterým se členské státy opravňují ke stanovení odchylek
    od některých ustanovení směrnice Rady 77/93/EHS ohledně dubové (Quercus
    L.) kulatiny s kůrou pocházející z Kanady a ze Spojených států amerických
  type: main
- language: da
  script: Latn
  content: '96/724/EF: Kommissionens Beslutning af 29. november 1996 om ændring af
    beslutning 93/467/EØF om bemyndigelse af medlemsstaterne til at indrømme undtagelser
    fra visse bestemmelser i Rådets direktiv 77/93/EØF for uafbarkede kævler af
    egetræ (Quercus L.) med oprindelse i Canada eller USA'
  type: main
- language: el
  script: Grek
  content: '96/724/ΕΚ: Απόφαση της Επιτροπής της 29ης Νοεμβρίου
    1996 για τροποποίηση της απόφασης 93/467/ΕΟΚ που
    επιτρέπει στα κράτη μέλη να παρεκκλίνουν από
    ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ του
    Συμβουλίου όσον αφορά τους μη αποφλοιωμένους
    κορμούς βελανιδιάς (Quercus L.) καταγωγής Καναδά
    ή Ηνωμένων Πολιτειών Αμερικής'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. november 1996, millega muudetakse otsust 93/467/EMÜ,
    millega lubatakse liikmesriikidel Kanadast või Ameerika Ühendriikidest pärit
    koorimata tammepalkide (Quercus L.) osas ette näha erandeid nõukogu direktiivi
    77/93/EMÜ teatavatest sätetest
  type: main
- language: fi
  script: Latn
  content: '96/724/EY: Komission päätös, tehty 29 päivänä marraskuuta 1996,
    jäsenvaltioiden oikeuttamisesta säätämään poikkeuksia tiettyihin Kanadasta
    tai Amerikan yhdysvalloista peräisin olevia kuorellisia tammitukkeja (Quercus
    L.) koskeviin neuvoston direktiivin 77/93/ETY säännöksiin tehdyn päätöksen
    93/467/ETY muuttamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1996. november 29.) a Kanadából vagy az Amerikai
    Egyesült Államokból származó, fakéreggel borított tölgyfa (Quercus L.)
    rönkre vonatkozóan a 77/93/EGK tanácsi irányelv egyes rendelkezéseitől való
    eltérésnek a tagállamok számára történő engedélyezéséről szóló 93/467/EGK
    határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '96/724/CE: Decisione della Commissione del 29 novembre 1996 recante modifica
    della decisione 93/467/CEE che autorizza gli Stati membri a prevedere deroghe
    a determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto
    riguarda i tronchi di quercia (Quercus L.) con corteccia originari del Canada
    o degli Stati Uniti d''America'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1996. gada 29. novembris), ar kuru groza Lēmumu 93/467/EEK,
    ar ko dalībvalstīm atļauts noteikt atkāpes no dažiem Padomes Direktīvas
    77/93/EEK noteikumiem attiecībā uz ozolu (Quercus L.) apaļkokiem ar mizu, kuru
    izcelsmes valsts ir Kanāda vai Amerikas Savienotās Valstis
  type: main
- language: lt
  script: Latn
  content: 1996 m. lapkričio 29 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    93/467/EEB, kai kurioms valstybėms narėms leidžiantį laikinai nukrypti nuo
    kai kurių Tarybos direktyvos 77/93/EEB nuostatų dėl ąžuolo (Quercus L.) rąstų
    su žieve iš Kanados arba Jungtinių Amerikos Valstijų
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta’ Novembru 1996 li temenda d-Deċiżjoni
    93/467/KEE li tawtorizza lill-Istati Membri sabiex jipprovdu derogi minn ċerti
    dispożizzjonijiet tad-Direttiva tal-Kunsill 77/93/KEE, rigward iz-zkuk tas-siġar
    tal-ballut (Quercus L.) bil-qoxra mwaħħla magħhom, li joriġinaw fil-Kanada
    jew fl-Istati Uniti ta’ l-Amerika
  type: main
- language: nl
  script: Latn
  content: '96/724/EG: Beschikking van de Commissie van 29 november 1996 houdende
    wijziging van Beschikking 93/467/EEG tot machtiging van de Lid-Staten om voor
    stammen van eikehout (Quercus L.) met bast, van oorsprong uit Canada en de Verenigde
    Staten van Amerika, afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG
    van de Raad toe te staan'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 listopada 1996 r. zmieniająca decyzję 93/467/EWG
    upoważniającą Państwa Członkowskie do ustanowienia odstępstw od niektórych
    przepisów dyrektywy Rady 77/93/EWG w odniesieniu do kłód dębowych (Quercus
    L.) z korą, pochodzących z Kanady lub Stanów Zjednoczonych Ameryki
  type: main
- language: pt
  script: Latn
  content: '96/724/CE: Decisão da Comissão de 29 de Novembro de 1996 que altera
    a Decisão 93/467/CEE, que autoriza os Estados-membros a prever derrogações
    a certas normas da Directiva 77/93/CEE do Conselho relativamente aos toros de
    carvalho (Quercus L.) com casca, originários do Canadá ou dos Estados Unidos
    da América'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. novembra 1996, ktorým sa mení a dopĺňa rozhodnutie
    93/467/EHS, oprávňujúce členské štáty poskytovať výnimky z určitých
    ustanovení smernice Rady 77/93/EHS, pokiaľ ide o dubovú (Quercus L.) guľatinu
    s kôrou pochádzajúcu z Kanady alebo Spojených štátov amerických
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. novembra 1996 o spremembi Odločbe 93/467/EGS
    o pooblastilih državam članicam, da določijo odstopanja od nekaterih določb
    Direktive Sveta 77/93/EGS v zvezi s hrastovimi (Quercus L.) hlodi z lubjem, s
    poreklom iz Kanade ali Združenih držav Amerike
  type: main
- language: es
  script: Latn
  content: '96/724/CE: Decisión de la Comisión de 29 de noviembre de 1996 que modifica
    la Decisión 93/467/CEE por la que se autoriza a los Estados miembros para establecer
    excepciones a ciertas disposiciones de la Directiva 77/93/CEE del Consejo en lo
    que respecta a los troncos de roble (Quercus L.) con corteza originarios de Canadá
    o de Estados Unidos de América'
  type: main
- language: sv
  script: Latn
  content: '96/724/EG: Kommissionens beslut av den 29 november 1996 om ändring av
    beslut 93/467/EEG om bemyndigande för medlemsstaterna att göra undantag från
    vissa bestämmelser i rådets direktiv 77/93/EEG för obarkade stockar av ek (Quercus
    L.) med ursprung i Kanada och USA'
