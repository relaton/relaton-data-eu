- language: en
  script: Latn
  content: Regulation (EEC) No 2939/75 of the Commission of 7 November 1975 adjusting,
    from 10 November 1975, the rate of the refunds applicable for certain products
    of the cereals and rice sectors, exported in the form of goods not covered by
    Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2939/75 de la Commission, du 7 novembre 1975, modifiant,
    à compter du 10 novembre 1975, les taux des restitutions applicables à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2939/75 der Kommission vom 7. November 1975 zur Äderung,
    ab 10. November 1975, der bei der Ausfuhr bestimmter Getreide- und Reiserzeunisse
    in Form von nicht unter Anhang II des Vertrages fallenden Waren geltenden Erstattungssätze
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2939/75 af 7. november 1975 om ændring
    fra den 10. november 1975 af de restitutionssatser, der skal anvendes for visse
    produkter fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes
    af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2939/75 della Commissione, del 7 novembre 1975, che
    modifica, a decorrere dal 10 novembre 1975, i tassi delle restituzioni applicabili
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2939/75 van de Commissie van 7 november 1975 houdende
    wijziging, met ingang van 10 november 1975, van de restituties die worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
