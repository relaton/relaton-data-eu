    relative rispettivamente alla commercializzazione delle sementi di piante foraggere,
    di cereali e di piante oleaginose e da fibra, nonché le direttive 78/386/CEE
    e 78/388/CEE
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva (1981. gada 16. februāris), ar ko groza pielikumus
    Padomes Direktīvām 66/401/EEK, 66/402/EEK un 69/208/EEK attiecīgi par lopbarības
    augu sēklu, graudaugu sēklu un eļļas augu un šķiedraugu sēklu tirdzniecību
    un Direktīvas 78/386/EEK un 78/388/EEK
  type: main
- language: lt
