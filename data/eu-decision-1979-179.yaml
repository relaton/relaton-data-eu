type: standard
title:
- language: en
  script: Latn
  content: '79/179/EEC: Commission Decision of 23 January 1979 authorizing Ireland
    not to apply Community treatment to blouses and shirt-blouses, knitted or crocheted
    (not elastic or rubberized) or woven, for women, girls and infants, falling within
    subheading ex 60.05 A II or ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    60.05-22, 23, 24, 25; 61.02-78, 82, 84), originating in India and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/179/CEE: Décision de la Commission, du 23 janvier 1979, autorisant
    l''Irlande à exclure du traitement communautaire les chemisiers, blouses-chemisiers
    et blouses, de bonneterie (non élastique ni caoutchoutée) ou tissés, pour femmes,
    fillettes et jeunes enfants, des sous-positions ex 60.05 A II et ex 61.02 B du
    tarif douanier commun (codes Nimexe 60.05-22, 23, 24, 25; 61.02-78, 82, 84), originaires
    de l''Inde et mis en libre pratique dans les autres Etats membres (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/179/EWG: Entscheidung der Kommission vom 23. Januar 1979, mit der Irland
    ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken (weder gummielastisch
    noch kautschutiert) oder Geweben, für Frauen, Mädchen und Kleinkinder, der Tarifstellen
    ex 60.05 A II und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-22;
    23; 24; 25; 61.02-78; 82; 84) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/179/EØF: Kommissionens beslutning af 23. januar 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage bluser, herunder skjortebluser
    af trikotage (ikke elastisk eller gummeret) eller vævede stoffer, til kvinder,
    piger og småbørn, som henhører under pos. 60.05 A II og ex 61.02 B i den fælles
    toldtarif (NIMEXE-nummer 60.05-22, 23, 24, 25; 61.02-78, 82, 84), har oprindelse
    i Indien og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/179/CEE: Decisione della Commissione, del 23 gennaio 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicette, le camicette-bluse
    e bluse, a maglia (non elastica né gommata), o tessute, per donna, per ragazza
    e per bambini, delle sottovoci ex 60.05 A II e ex 61.02 B della tariffa doganale
    comune (codice Nimexe: 60.05-22, 23, 24, 25; 61.02-78, 82, 84), originarie dell''India
    e messe in libera pratica negli altri Stati membri (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/179/EEG: Beschikking van de Commissie van 23 januari 1979 waarbij Ierland
    wordt gemachtigd blouses, hemdblouses, van brei- of haakwerk (niet elastisch,
    niet gegummeerd) of geweven, voor dames, meisjes en kinderen, van de posten ex
    60.05 A II en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 60.05-22,
    23, 24, 25 - 61.02-78, 82, 84), van oorsprong uit India en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
