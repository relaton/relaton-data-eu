    на Обединеното кралство Великобритания и Северна
    Ирландия и на някои от териториите, зависими
    от Британската корона, в списъка на третите
    държави, от които е разрешено въвеждането в
    Съюза на ембриони от едър рогат добитък (нотифицирано
    под номер C(2019) 2833)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/602 ze dne 11. dubna 2019, kterým
    se mění příloha I rozhodnutí 2006/168/ES, pokud jde o zahrnutí Spojeného
    království Velké Británie a Severního Irska a určitých jeho závislých
    území do seznamu třetích zemí, ze kterých je povolen vstup embryí skotu
    na území Evropské unie (oznámeno pod číslem C(2019) 2833)
  type: main
- language: da
  script: Latn
