    af Det Forenede Kongerige Storbritannien og Nordirland og visse af dets kronbesiddelser
    på listen over tredjelande, som er godkendt med hensyn til indførsel i Den Europæiske
    Union af kvægembryoner (meddelt under nummer C(2019) 2833)
  type: main
- language: el
  script: Grek
