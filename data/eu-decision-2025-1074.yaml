title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/1074 of 2 June 2025 not approving
    ethylene oxide as an existing active substance for use in biocidal products of
    product-type 2 in accordance with Regulation (EU) No 528/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/1074 de la Commission du 2 juin 2025
    refusant l’approbation de l’oxyde d’éthylène en tant que substance active
    destinée à être utilisée dans des produits biocides relevant du type de produits
    2 conformément au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/1074 der Kommission vom 2. Juni 2025
    zur Nichtgenehmigung von Ethylenoxid als alten Wirkstoff zur Verwendung in Biozidprodukten
    der Produktart 2 gemäß der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments
    und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/1074 на Комисията
