id: EUDecision1977789
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 November 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's shirts of mixed synthetic textile fibres falling
    within heading No ex 61.03 of the Common Customs Tariff, originating in Malaysia
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/789/CEE: Décision de la Commission, du 22 novembre 1977, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises pour hommes de fibres textiles
    synthétiques mélangées, de la position Ex 61.03 du Tarif douanier commun, originaires
    de Malaysia et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. November 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Malaysia stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Männeroberhemden aus gemischten synthetischen Spinnstoffen der Tarifnummer
    ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: '789/EØF: * Kommissionens Beslutning af 22. november 1977 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage skjorter til mænd (herunder sports-
    og arbejdsskjorter) af blandede syntetiske fibre, som henhører under pos. ex
    61.03 i den fælles toldtarif, har oprindelse i Malaysia og frit kan omsættes
    i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 novembre 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie da uomo, di fibre tessili sintetiche miste,
    della voce ex 61.03 della tariffa doganale comune, originarie della Malaisia e
    messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 november 1977 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden
    gemachtigd herenoverhemden van gemengde synthetische textielvezels van post ex
    61.03 van het gemeenschappelijk douanetarief, van oorsprong uit Maleisië en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
