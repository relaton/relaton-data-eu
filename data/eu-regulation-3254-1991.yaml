title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3254/91 of 4 November 1991 prohibiting the
    use of leghold traps in the Community and the introduction into the Community
    of pelts and manufactured goods of certain wild animal species originating in
    countries which catch them by means of leghold traps or trapping methods which
    do not meet international humane trapping standards
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3254/91 du Conseil, du 4 novembre 1991, interdisant
    l'utilisation du piège à mâchoires dans la Communauté et l'introduction dans
    la Communauté de fourrures et de produits manufacturés de certaines espèces
    animales sauvages originaires de pays qui utilisent pour leur capture le piège
    à mâchoires ou des méthodes non conformes aux normes internationales de piégeage
    sans cruauté
  type: main
