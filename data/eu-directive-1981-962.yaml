title:
- language: en
  script: Latn
  content: Council Directive 81/962/EEC of 24 November 1981 amending for the third
    time Directive 70/357/EEC on the approximation of the laws of the Member States
    concerning the antioxidants authorized for use in foodstuffs intended for human
    consumption
  type: main
- language: fr
  script: Latn
  content: Directive 81/962/CEE du Conseil, du 24 novembre 1981, portant troisième
    modification de la directive 70/357/CEE relative au rapprochement des législations
    des États membres concernant les substances ayant des effets antioxygènes et
    pouvant être employées dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 81/962/EWG des Rates vom 24. November 1981 zur dritten Änderung
    der Richtlinie 70/357/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für Stoffe mit antioxidierender Wirkung, die in Lebensmitteln verwendet werden
    dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 81/962/EØF af 24. november 1981 om tredje ændring af
    direktiv 70/357/EØF om indbyrdes tilnærmelse af medlemsstaternes lovgivning
    om antioxidanter, som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 81/962/EOK του Συμβουλίου της 24ης Νοεμβρίου
    1981 περί τρίτης τροποποιήσεως της οδηγίας 70/357/EOK
    περί προσεγγίσεως των νομοθεσιών των κρατών
    μελών σχετικά με τις ουσίες που έχουν αντιοξειδωτικά
    αποτελέσματα και επιτρέπεται να χρησιμοποιούνται
    στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 81/962/ETY, annettu 24 päivänä marraskuuta 1981,
    elintarvikkeissa sallittuja hapettumisenestoaineita koskevan jäsenvaltioiden
    lainsäädännön lähentämisestä annetun direktiivin 70/357/ETY muuttamisesta
    kolmannen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 81/962/CEE del Consiglio, del 24 novembre 1981, recante terza
    modifica della direttiva 70/357/CEE relativa al ravvicinamento delle legislazioni
    degli Stati Membri concernenti le sostanze che hanno effetti antiossidanti che
    possono essere impiegate nei prodotti destinati all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 81/962/EEG van de Raad van 24 november 1981 houdende derde wijziging
    van Richtlijn 70/357/EEG betreffende de onderlinge aanpassing van de wettelijke
    voorschriften der Lid-Staten inzake oxydatie tegengaande stoffen waarvan het gebruik
    in levensmiddelen is toegestaan
  type: main
- language: pt
  script: Latn
  content: Directiva 81/962/CEE do Conselho, de 24 de Novembro de 1981, que altera
    pela terceira vez a Directiva 70/357/CEE relativa à aproximação das legislações
    dos Estados-Membros respeitantes às substâncias antioxidantes que podem ser
    utilizadas nos géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 81/962/CEE del Consejo, de 24 de noviembre de 1981, sobre la
    tercera modificación de la Directiva 70/357/CEE relativa a la aproximación de
    las legislaciones de los Estados Miembros referentes a las sustancias con efecto
    antioxidante que pueden ser empleadas en los productos destinados a la alimentación
    humana
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 81/962/EEG av den 24 november 1981 med tredje ändringen
    av direktiv 70/357/EEG om tillnärmning av medlemsstaternas lagstiftning om antioxidationsmedel
    som får användas i livsmedel
