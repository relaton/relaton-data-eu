  script: Latn
  content: Council Regulation (EEC) No 1945/93 of 30 June 1993 amending Regulation
    (EEC) No 1408/71 on the application of social security schemes to employed persons,
    to self- employed persons and to members of their families moving within the Community,
    Regulation (EEC) No 574/72 laying down the procedure for implementing Regulation
    (EEC) No 1408/71 and Regulation (EEC) No 1247/92 amending Regulation (EEC) No
    1408/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1945/93 du Conseil du 30 juin 1993 modifiant le règlement
    (CEE) n° 1408/71 relatif à l'application des régimes de sécurité sociale
    aux travailleurs salariés, aux travailleurs non salariés et aux membres de leur
    famille qui se déplacent à l'intérieur de la Communauté, le règlement (CEE)
    n° 574/72 fixant les modalités d'application du règlement (CEE) n° 1408/71,
    et le règlement (CEE) n° 1247/92 modifiant le règlement (CEE) n° 1408/71
  type: main
