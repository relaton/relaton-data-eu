    und Schmuckgegenstände der Tarifnummer 69.13 mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
