  content: Commission Regulation (EEC) No 3424/87 of 16 November 1987 re-establishing
    the levying of customs duties on statuettes and other ornaments, articles of personal
    adornment and articles of furniture falling within heading No 69.13 of the Common
    Customs Tariff, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3424/87 de la Commission du 16 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux statuettes,
    objets de fantaisie, d' ameublement, d' ornementation ou de parure de la position
    69.13 du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
