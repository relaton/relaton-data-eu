title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2037/77 of 13 September 1977 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02, originating in Malaysia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2037/77 de la Commission, du 13 septembre 1977, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastique ni caoutchoutée, de la position tarifaire 60.02,
    originaires de Malaysia, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2037/77 der Kommission vom 13. September 1977 über
    die Wiedereinführung des Zollsatzes für Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer 60.02, mit Ursprung in Malaysia, dem die in
    der Verordnung (EWG) Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2037/77 af 13. september 1977 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, ikke
    elastisk eller gummeret, under position 60.02, som har oprindelse i Malaysia og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2037/77 della Commissione, del 13 settembre 1977,
    che ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia
    non elastica né gommata, della voce doganale 60.02, originari della Malaisia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3022/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2037/77 van de Commissie van 13 september 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of van nietgegummeerd brei-
    of haakwerk, van post 60.02, van oorsprong uit Maleisië, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3022/76 van de
    Raad
  type: main
