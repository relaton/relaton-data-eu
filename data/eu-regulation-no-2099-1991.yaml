title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2099/91 of 15 July 1991 determining for
    the Member States, for the 1991 marketing year, the estimated loss of income and
    the estimated level of the premium payable per ewe and per female goat and fixing
    the first advance payment for this premium and of the specific aid for sheep and
    goat farming in certain less-favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2099/91 DE LA COMMISSION du 15 juillet 1991 déterminant,
    pour les États membres et pour la campagne 1991, la perte estimée de revenu,
    le montant estimé de la prime payable par brebis et par chèvre, ainsi que fixant
    le montant du premier acompte de cette prise ainsi que celui de l'' aide spécifique
    à l'' élevage ovin et caprin dans certaines zones défavorisées de la Communauté
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2099/91 DER KOMMISSION vom 15. Juli 1991 zur Bestimmung
    des je Mitgliedstaat und für das Wirtschaftsjahr 1991 zu gewährenden Einkommensausfalls
    und der je Mutterschaf und Ziege zu gewährenden Prämie, des ersten Vorschusses
    auf diese Prämie sowie der Sonderbeihilfe für die Schaf- und Ziegenhaltung in
    bestimmten benachteiligten Gebieten der Gemeinschaft #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2099/91 af 15. juli 1991 om fastsættelse
    for medlemsstaterne for produktionsåret 1991 af det anslåede indtægtstab, det
    anslåede præmiebeløb, der skal betales pr. moderfår og moderged, det første
    forskud på dette præmiebeløb samt det første forskud på den særlige støtte
    til fåre- og gedeopdræt i visser ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2099/91 της Επιτροπής
    της 15ης Ιουλίου 1991 περί προσδιορισμού για τα
    κράτη μέλη και για την περίοδο εμπορίας 1991,
    της εκτιμώμενης απώλειας εισοδήματος, του
    εκτιμώμενου ποσού της πριμοδότησης που καταβάλλεται
    ανά προβατίνα και ανά αίγα καθώς και του ποσού
    της πρώτης προκαταβολής της πριμοδότησης αυτής
    και του ποσού της ειδικής ενίσχυσης στην εκτροφή
    αιγοπροβάτων σε ορισμένες μειονεκτικές ζώνες
    της Κοινότητας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2099/91 DELLA COMMISSIONE del 15 luglio 1991 che
    determina, per gli Stati membri e per la campagna 1991, la perdita stimata di
    reddito, l'' importo stimato del premio pagabile per pecora e per capra, l'' ammontare
    del primo acconto del premio nonché quello dell'' aiuto specifico per l'' allevamento
    ovocaprino in alcune zone svantaggiate della Comunità #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2099/91 VAN DE COMMISSIE van 15 juli 1991 tot vaststelling,
    voor de Lid-Staten en voor het verkoopseizoen 1991, van het geraamde inkomensverlies
    en van het geraamde premiebedrag per ooi en per vrouwelijke geit alsmede van het
    eerste voorschot op deze premie en op het bedrag van de bijzondere steun voor
    de schapen- en geitenhouderij in bepaalde probleemgebieden van de Gemeenschap
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2099/91 DA COMISSÃO de 15 de Julho de 1991 que determina,
