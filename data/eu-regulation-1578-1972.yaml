    για τον καθορισμό των τιμών αναγωγής και για
    τον προσδιορισμό τιμών προσφοράς «ελεύθερο
    στα σύνορα» του υβριδίου αραβοσίτου που προορίζεται
    προς σπορά
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1578/72, annettu 20 päivänä heinäkuuta 1972,
