    unter der Hoheitsgewalt oder Gerichtsbarkeit Spaniens fangen dürfen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1418/86 af 6. maj 1986 om fastsættelse af
