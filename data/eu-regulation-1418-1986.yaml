  content: Council Regulation (EEC) No 1418/86 of 6 May 1986 fixing the number of
    vessels flying the flag of Portugal authorized to fish for albacore tuna in waters
    under the sovereignty or jurisdiction of Spain
  type: main
- language: fr
  script: Latn
