title:
- language: en
  script: Latn
  content: '80/1247/EEC: Commission Decision of 18 December 1980 authorizing the Kingdom
    of Belgium and the Grand Duchy of Luxembourg not to apply Community treatment
    to tomatoes originating in Spain (including the Canary Islands) (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1247/CEE: Décision de la Commission, du 18 décembre 1980, autorisant
    le Royaume de Belgique et le Grand- Duché de Luxembourg à exclure du traitement
    communautaire les tomates originaires d''Espagne (y compris les îles Canaries)
    et mises en libre pratique dans les autres États membres (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1247/EWG: Entscheidung des Königreichs Belgien und des Großherzogtums
    Luxemburg, aus Spanien (einschließlich Kanarische Inseln) stammende Tomaten von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1247/EØF: Kommissionens beslutning af 18. december 1980 om bemyndigelse
    af kongeriget Belgien og storhertugdømmet Luxembourg til fra fællesskabsbehandling
    at undtage tomater med oprindelse i Spanien (herunder De kanariske Øer) (Kun
    den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/1247/CEE: Decisione della Commissione, del 18 dicembre 1980, che autorizza
    il Regno del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento
    comunitario i pomodori originari della Spagna (comprese le isole Canarie) e messi
    in libera pratica negli altri Stati membri (Il testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1247/EEG: Beschikking van de Commissie van 18 december 1980 waarbij
    het Koninkrijk België en het Groothertogdom Luxemburg worden gemachtigd tomaten
    van oorsprong uit Spanje (de Kanarische eilanden inbegrepen) en in de overige
    Lid-Staten in het vrije verkeer gebracht van de communautaire behandeling uit
    te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
