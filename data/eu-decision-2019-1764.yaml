id: EUDecision20191764
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Decision (EU) 2019/1764 of 14 March 2019 supplementing
    Regulation (EU) No 305/2011 of the European Parliament and of the Council with
    regard to the applicable systems to assess and verify constancy of performance
    of balustrade kits and railing kits intended to be used in construction works
    solely to prevent falls and not submitted to vertical loads from the structure
  type: main
- language: fr
  script: Latn
  content: Décision Déléguée (UE) 2019/1764 de la Commission du 14 mars 2019 complétant
    le règlement (UE) no 305/2011 du Parlement européen et du Conseil en ce qui
    concerne les systèmes applicables pour l’évaluation et la vérification de
    la constance des performances des kits de balustrades et des kits de garde-corps
    destinés à être utilisés dans le cadre d’ouvrages de construction uniquement
    pour prévenir les chutes et qui ne sont pas soumis aux charges verticales de
    la structure
  type: main
- language: de
  script: Latn
  content: Delegierter Beschluss (EU) 2019/1764 der Kommission vom 14. März 2019
    zur Ergänzung der Verordnung (EU) Nr. 305/2011 des Europäischen Parlaments und
    des Rates durch anwendbare Systeme zur Bewertung und Überprüfung der Leistungsbeständigkeit
    von Brüstungs- und Geländerbausätzen, die ausschließlich zur Vermeidung von
    Abstürzen auf Baustellen bestimmt sind und keine strukturbedingten Vertikallasten
    tragen
  type: main
- language: bg
  script: Cyrl
  content: Делегирано решение (ЕС) 2019/1764 на Комисията
    от 14 март 2019 година за допълнение на Регламент
    (ЕС) № 305/2011 на Европейския парламент и на Съвета
    по отношение на приложимите системи за оценяване
    и проверка на постоянството на експлоатационните
    показатели на комплектите перила и комплектите
    парапети, предназначени да се използват в строителството
    единствено с цел предотвратяване на падания,
    като при това не са подложени на вертикално
    натоварване от конструкцията
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise v Přenesené Pravomoci (EU) 2019/1764 ze dne 14. března
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    305/2011, pokud jde o použitelné systémy posuzování a ověřování stálosti
    vlastností sestav pro balustrády a sestav pro zábradlí, které jsou zamýšleny
    pro použití ve stavbách výhradně k zabránění pádům a nejsou vertikálně
    zatíženy konstrukcí
  type: main
- language: da
  script: Latn
  content: Kommissionens Delegerede Afgørelse (EU) 2019/1764 af 14. marts 2019 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 305/2011
    for så vidt angår de gældende systemer til vurdering og kontrol af konstansen
    af ydeevnen af gelænder- og rækværkssystemer, der udelukkende er tilsigtet
    anvendt i forbindelse med bygværker for at forhindre fald, og som ikke er udsat
    for lodret belastning fra strukturen
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση απόφαση (ΕΕ) 2019/1764 της
    Επιτροπής της 14ης Μαρτίου 2019 για τη συμπλήρωση
    του κανονισμού (ΕΕ) αριθ. 305/2011 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου σχετικά με
    τα εφαρμοστέα συστήματα για την αξιολόγηση
    και την επαλήθευση της σταθερότητας της επίδοσης
    των κιτ κιγκλιδωμάτων και περιφράξεων που
    προορίζονται να χρησιμοποιηθούν σε δομικές
    κατασκευές με αποκλειστικό σκοπό την πρόληψη
    των πτώσεων και δεν υποβάλλονται σε κατακόρυφα
    φορτία από τη δομή
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud otsus (EL) 2019/1764, 14. märts 2019, millega täiendatakse
    Euroopa Parlamendi ja nõukogu määrust (EL) nr 305/2011 nende toimivuse püsivuse
    hindamise ja kontrollimise süsteemide osas, mida kohaldatakse selliste ainult
    kukkumise vältimiseks mõeldud piirde- ja reelingukomplektide suhtes, millele
    ei lange ehitise vertikaalsuunalist koormust
  type: main
- language: fi
  script: Latn
  content: Komission Delegoitu Päätös (EU) 2019/1764, annettu 14 päivänä maaliskuuta
    2019, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 305/2011 täydentämisestä
    niiden sovellettavien järjestelmien osalta, joilla arvioidaan ja tarkistetaan
    sellaisten rakennuskohteessa yksinomaan putoamisen estämiseen tarkoitettujen
    kaide- ja käsijohdesarjojen suoritustason pysyvyys, joihin ei kohdistu pystysuoraa
    kuormitusta rakenteesta
  type: main
- language: hr
  script: Latn
  content: Delegirana odluka Komisije (EU) 2019/1764 оd 14. ožujka 2019. o dopuni
    Uredbe (EU) br. 305/2011 Europskog parlamenta i Vijeća u pogledu primjenjivih
    sustava ocjenjivanja i provjere stalnosti svojstava opreme za balustrade i ograde
    namijenjene za uporabu u građevinama isključivo radi sprečavanja padova te
    koje ne nose vertikalno opterećenje građevinske strukture
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1764 Felhatalmazáson Alapuló Határozata (2019.
    március 14.) a 305/2011/EU európai parlamenti és tanácsi rendeletnek az építményeknél
    kizárólag a lezuhanás megakadályozására használt, függőleges szerkezeti
    terhelésnek nem kitett mellvéd- és korlátszerkezetek teljesítménye állandóságának
    értékelésére és ellenőrzésére alkalmazandó rendszerek tekintetében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Decisione Delegata (UE) 2019/1764 della Commissione del 14 marzo 2019 che
    integra il regolamento (UE) n. 305/2011 del Parlamento europeo e del Consiglio
    per quanto riguarda i sistemi applicabili per la valutazione e la verifica della
    costanza della prestazione dei kit per parapetti e dei kit per ringhiere destinati
    a essere utilizzati nelle opere di costruzione al solo scopo di evitare cadute
    e non soggetti a carichi verticali della struttura
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētais Lēmums (ES) 2019/1764 (2019. gada 14. marts), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 305/2011 papildina attiecībā
    uz piemērojamajām sistēmām, kas novērtē un pārbauda tādu balustrāžu
    komplektu un margu komplektu ekspluatācijas īpašību noturību, kurus būvdarbos
    paredzēts izmantot tikai pasargāšanai no kritieniem un kuri nav pakļauti vertikālām
    konstrukcijas radītām slodzēm
  type: main
- language: lt
  script: Latn
  content: Komisijos Deleguotasis Sprendimas (ES) 2019/1764 2019 m. kovo 14 d. kuriuo
    dėl baliustradų ir turėklų komplektams, skirtiems naudoti tik statybose tik
    apsaugai nuo kritimo ir neveikiamiems struktūros vertikalios apkrovos, taikytinų
    eksploatacinių savybių pastovumo vertinimo ir tikrinimo sistemų papildomas
    Europos Parlamento ir Tarybos reglamentas (ES) Nr. 305/2011
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni Delegata tal-Kummissjoni (UE) 2019/1764 tal-14 ta’ Marzu
    2019 li tissupplimenta r-Regolament (UE) Nru 305/2011 tal-Parlament Ewropew u
    tal-Kunsill fir-rigward tas-sistemi applikabbli għall-valutazzjoni u għall-verifika
    tal-kostanza tal-prestazzjoni tal-kittijiet ta’ balavostri u tal-kittijiet ta’
    ringieli balavostri maħsuba biex jintużaw f’xogħlijiet tal-bini unikament
    biex jipprevjenu l-waqgħat u mhux sottomessi għal tagħbijiet vertikali mill-istruttura
  type: main
- language: nl
  script: Latn
  content: Gedelegeerd Besluit (EU) 2019/1764 van de Commissie van 14 maart 2019 tot
    aanvulling van Verordening (EU) nr. 305/2011 van het Europees Parlement en de
    Raad met betrekking tot de toepasselijke systemen voor de beoordeling en verificatie
    van de prestatiebestendigheid van balustradekits en relingkits die bedoeld zijn
    om bij bouwwerken uitsluitend te worden gebruikt om vallen te voorkomen, en die
    geen verticale belasting ondergaan vanwege de constructie
  type: main
- language: pl
  script: Latn
  content: Decyzja Delegowana Komisji (UE) 2019/1764 z dnia 14 marca 2019 r. uzupełniająca
    rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 305/2011 w odniesieniu
    do mających zastosowanie systemów oceny i weryfikacji stałości właściwości
    użytkowych zestawów balustrad i zestawów barierek przeznaczonych do stosowania
    w obiektach budowlanych wyłącznie w celu zapobiegania upadkom i niepoddawanych
    obciążeniom pionowym przez konstrukcję
  type: main
- language: pt
  script: Latn
  content: Decisão Delegada (UE) 2019/1764 da Comissão de 14 de março de 2019 que
    completa o Regulamento (UE) n.o 305/2011 do Parlamento Europeu e do Conselho no
    que diz respeito aos sistemas aplicáveis para avaliar e verificar a regularidade
    do desempenho das guardas e parapeitos que são utilizados no setor da construção
    exclusivamente para evitar quedas e não estão sujeitos a cargas verticais da
    estrutura
  type: main
- language: ro
  script: Latn
  content: Decizia Delegată (UE) 2019/1764 a Comisiei din 14 martie 2019 de completare
    a Regulamentului (UE) nr. 305/2011 al Parlamentului European și al Consiliului
    în ceea ce privește sistemele aplicabile pentru evaluarea și verificarea constanței
    performanței balustradelor și a sistemelor de împrejmuire destinate utilizării
    în lucrările de construcții exclusiv pentru prevenirea căderilor și care
    nu sunt supuse la sarcini verticale din structură
  type: main
- language: sk
  script: Latn
  content: Delegované rozhodnutie Komisie (EÚ) 2019/1764 zo 14. marca 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 305/2011, pokiaľ
    ide o uplatniteľné systémy posudzovania a overovania nemennosti parametrov
    balustrádových zostáv a zábradľových zostáv, ktoré sú určené na použitie
    v stavbách výlučne na účely zabránenia pádu a na ktoré nepôsobí zvislé
    zaťaženie vyvolané konštrukciou
  type: main
- language: sl
  script: Latn
  content: Delegirani sklep Komisije (EU) 2019/1764 z dne 14. marca 2019 o dopolnitvi
    Uredbe (EU) št. 305/2011 Evropskega parlamenta in Sveta v zvezi z veljavnimi
    sistemi za ocenjevanje in preverjanje nespremenljivosti lastnosti sklopov za balustrade
    in ograje, namenjenih samo za preprečevanje padcev z gradbenih objektov, ne pa
    za vertikalno obremenitev konstrukcije
  type: main
- language: es
  script: Latn
  content: Decisión Delegada (UE) 2019/1764 de la Comisión de 14 de marzo de 2019
    por el que se complementa el Reglamento (UE) n.o 305/2011 del Parlamento Europeo
    y del Consejo en lo que respecta a los sistemas aplicables para evaluar y verificar
    la constancia de las prestaciones de los kits de barandillas y los kits de pasamanos
    destinados al uso en obras de construcción únicamente para evitar caídas y
    no sometidos a cargas verticales estructurales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade beslut (EU) 2019/1764 av den 14 mars 2019 om komplettering
    av Europaparlamentets och rådets förordning (EU) nr 305/2011 vad gäller tillämpliga
    system för bedömning och fortlöpande kontroll av prestanda för balustradsatser
    och räcksatser som är avsedda för konstruktionsändamål uteslutande för att
    förhindra fall och som inte utsätts för vertikal belastning från konstruktionen
  type: main
