title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2908/93 of 20 October 1993 re-establishing
    the levying of customs duties on products of categories 97 and 114 (order Nos
    40.0970 and 40.1140), originating in Brazil, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2908/93 de la Commission du 20 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 97 et 114 (numéros d'ordre 40.0970 et 40.1140) originaires du
    Brésil, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2908/93 DER KOMMISSION vom 20. Oktober 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorien 97 und 114 (laufende Nummern 40.0970
    und 40.1140) mit Ursprung in Brasilien, für die die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2908/93 af 20. oktober 1993 om genindførelse
    af opkrævning af told for varer under kategori 97 og 114 (løbenummer 40.0970
    og 40.1140), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
