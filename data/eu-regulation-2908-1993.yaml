    van de categorieën 97 en 114 (volgnummers 40.0970 en 40.1140), van oorsprong
    uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3832/90 van de Raad
  type: main
