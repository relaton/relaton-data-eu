    operācijās
  type: main
- language: lt
  script: Latn
  content: 2012 m. kovo 23 d. Tarybos sprendimas 2012/344/BUSP dėl Europos Sąjungos
    ir Albanijos Respublikos susitarimo, kuriuo nustatomos Albanijos Respublikos dalyvavimo
    Europos Sąjungos krizių valdymo operacijose bendrosios sąlygos, pasirašymo
    ir sudarymo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2012/344/PESK tat- 23 ta’ Marzu 2012 dwar l-iffirmar
    u l-konklużjoni tal-Ftehim bejn l-Unjoni Ewropea u r-Repubblika tal-Albanija
    li jistabbilixxi qafas għall-parteċipazzjoni tar-Repubblika tal-Albanija f’operazzjonijiet
    tal-Unjoni Ewropea għall-immaniġġar ta’ kriżijiet
  type: main
- language: nl
  script: Latn
  content: Besluit 2012/344/GBVB van de Raad van 23 maart 2012 betreffende de ondertekening
    en sluiting van de Overeenkomst tussen de Europese Unie en de Republiek Albanië
    tot vaststelling van een kader voor de deelname van de Republiek Albanië aan
    crisisbeheersingsoperaties van de Europese Unie
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2012/344/WPZiB z dnia 23 marca 2012 r. w sprawie podpisania
    i zawarcia Umowy między Unią Europejską a Republiką Albanii ustanawiającej
    ogólne zasady udziału Republiki Albanii w prowadzonych przez Unię Europejską
    operacjach zarządzania kryzysowego
  type: main
- language: pt
  script: Latn
  content: Decisão 2012/344/PESC do Conselho, de 23 de março de 2012 , relativa
    à assinatura e celebração do Acordo entre a União Europeia e a República
    da Albânia qu estabelece um quadro para a participação da República da Albânia
    em operações da União Europeia no domínio da gestão de crises
  type: main
- language: ro
  script: Latn
  content: Decizia 2012/344/PESC a Consiliului din 23 martie 2012 privind semnarea
    și încheierea Acordului între Uniunea Europeană și Republica Albania de instituire
    a cadrului de participare a Republicii Albania la operațiile Uniunii Europene
    de gestionare a crizelor
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2012/344/SZBP z 23. marca 2012 o podpise a uzavretí Dohody
    medzi Európskou úniou a Albánskou republikou, ktorou sa zakladá rámec pre
    účasť Albánskej republiky na operáciách krízového riadenia Európskej
    únie
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2012/344/SZVP z dne 23. marca 2012 o podpisu in sklenitvi Sporazuma
