title:
- language: en
  script: Latn
  content: Council Decision 2012/344/CFSP of 23 March 2012 on the signing and conclusion
    of the Agreement between the European Union and the Republic of Albania establishing
    a framework for the participation of the Republic of Albania in European Union
    crisis management operations
  type: main
- language: fr
  script: Latn
  content: Décision 2012/344/PESC du Conseil du 23 mars 2012 relative à la signature
    et la conclusion de l’accord entre l’Union européenne et la République d’Albanie
    établissant un cadre pour la participation de la République d’Albanie aux
    opérations de gestion de crises menées par l’Union européenne
  type: main
- language: de
  script: Latn
  content: Beschluss 2012/344/GASP des Rates vom 23. März 2012 über die Unterzeichnung
    und den Abschluss des Abkommens zwischen der Europäischen Union und der Republik
    Albanien über die Schaffung eines Rahmens für die Beteiligung der Republik Albanien
    an Krisenbewältigungsoperationen der Europäischen Union
  type: main
- language: bg
  script: Cyrl
  content: Решение 2012/344/ОВППС на Съвета от 23 март 2012
