    между Европейския съюз и Република Албания
    за създаване на рамка за участието на Република
    Албания в операциите на Европейския съюз за
    управление на кризи
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2012/344/SZBP ze dne 23. března 2012 o podpisu a uzavření
    Dohody mezi Evropskou unií a Albánskou republikou o rámci pro účast Albánské
    republiky na operacích Evropské unie pro řešení krizí
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2012/344/FUSP af 23. marts 2012 om undertegnelse og
    indgåelse af aftalen mellem Den Europæiske Union og Republikken Albanien om
    rammerne for Republikken Albaniens deltagelse i Den Europæiske Unions krisestyringsoperationer
  type: main
- language: el
  script: Grek
  content: Απόφαση 2012/344/ΚΕΠΠΑ του Συμβουλίου, της
    23ης Μαρτίου 2012 , για την υπογραφή και τη σύναψη
    της συμφωνίας μεταξύ της Ευρωπαϊκής Ένωσης
    και της Δημοκρατίας της Αλβανίας σχετικά με
    τη θέσπιση πλαισίου για τη συμμετοχή της Δημοκρατίας
    της Αλβανίας σε επιχειρήσεις διαχείρισης κρίσεων
    της Ευρωπαϊκής Ένωσης
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2012/344/ÜVJP, 23. märts 2012 , Euroopa Liidu ja Albaania
    Vabariigi vahelise lepingu (millega kehtestatakse raamistik Albaania Vabariigi
    osalemiseks Euroopa Liidu kriisiohjamisoperatsioonides) allkirjastamise ja sõlmimise
    kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2012/344/YUTP, annettu 23 päivänä maaliskuuta 2012
    , puitteiden luomista Albanian tasavallan osallistumiselle Euroopan unionin kriisinhallintaoperaatioihin
    koskevan Euroopan unionin ja Albanian tasavallan välisen sopimuksen allekirjoittamisesta
    ja tekemisestä
  type: main
- language: hr
  script: Latn
