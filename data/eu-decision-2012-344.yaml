    Republike Albanije u operacijama Europske unije za upravljanje krizama
  type: main
- language: hu
  script: Latn
  content: A Tanács 2012/344/KKBP határozata ( 2012. március 23. ) az Európai
    Unió és az Albán Köztársaság között az Albán Köztársaságnak az Európai
    Unió válságkezelési műveleteiben való részvétele kereteinek meghatározásáról
    szóló megállapodás aláírásáról és megkötéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2012/344/PESC del Consiglio, del 23 marzo 2012 , relativa alla
    firma e alla conclusione dell’accordo tra l’Unione europea e la Repubblica
    d’Albania che istituisce un quadro per la partecipazione della Repubblica d’Albania
    alle operazioni dell’Unione europea di gestione delle crisi
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2012/344/KĀDP ( 2012. gada 23. marts ) par to, lai parakstītu
