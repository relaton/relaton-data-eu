title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 décembre 1964, relative à la fixation
    des moyennes arithmétiques des prélèvements agricoles envers les pays tiers
    servant de base pour le calcul du prélèvement compensateur institué en vertu
    de l'article 10 du Traité
  type: main
- language: de
  script: Latn
  content: '65/10/EWG: Entscheidung der Kommission vom 21. Dezember 1964 über die
    Festsetzung der mittleren Abschöpfungen gegenüber dritten Ländern, die der
    Berechnung des gemäß Artikel 10 des Vertrages eingeführten anteiligen Zolls
    zugrunde zu legen sind'
  type: main
- language: it
  script: Latn
  content: '65/10/CEE: Decisione della Commissione, del 21 dicembre 1964, relativa
    alla fissazione delle medie aritmetiche dei prelievi agricoli nei confronti dei
    paesi terzi da servire di base per il calcolo del prelievo compensativo istituito
    a norma dell''articolo 10 del Trattato'
  type: main
- language: nl
  script: Latn
  content: '65/10/EEG: Beschikking van de Commissie van 21 december 1964 betreffende
    de vaststelling van de rekenkundige gemiddelden van de landbouwheffingen ten opzichte
    van derde landen, welke gemiddelden aan de berekening van de ingevolge artikel
    10 van het Verdrag ingestelde compenserende heffing ten grondslag worden gelegd'
  type: main
