---
id: EURegulation2023850
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EU) 2023/850 of the European Parliament and of the Council
    of 19 April 2023 amending Regulation (EU) 2018/1806 listing the third countries
    whose nationals must be in possession of visas when crossing the external borders
    and those whose nationals are exempt from that requirement (Kosovo (This designation
    is without prejudice to positions on status, and is in line with UNSCR 1244/1999
    and the ICJ Opinion on the Kosovo declaration of independence.))
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2023/850 du Parlement européen et du Conseil du 19 avril
    2023 modifiant le règlement (UE) 2018/1806 fixant la liste des pays tiers dont
    les ressortissants sont soumis à l’obligation de visa pour franchir les frontières
    extérieures des États membres et la liste de ceux dont les ressortissants sont
    exemptés de cette obligation (Kosovo (Cette désignation est sans préjudice
    des positions sur le statut et est conforme à la résolution 1244 (1999) du Conseil
    de sécurité des Nations unies ainsi qu’à l’avis de la Cour internationale
    de justice sur la déclaration d’indépendance du Kosovo.))
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2023/850 des Europäischen Parlaments und des Rates vom
    19. April 2023 zur Änderung der Verordnung (EU) 2018/1806 zur Aufstellung der
    Liste der Drittländer, deren Staatsangehörige beim Überschreiten der Außengrenzen
    im Besitz eines Visums sein müssen, sowie der Liste der Drittländer, deren Staatsangehörige
    von dieser Visumpflicht befreit sind (Kosovo (Diese Bezeichnung berührt nicht
    die Standpunkte zum Status und steht im Einklang mit der Resolution 1244/1999
    des VN-Sicherheitsrates und dem Gutachten des Internationalen Gerichtshofs zur
    Unabhängigkeitserklärung des Kosovos.))
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2023/850 на Европейския парламент
    и на Съвета от 19 април 2023 година за изменение
    на Регламент (ЕС) 2018/1806 за определяне на третите
    страни, чиито граждани трябва да притежават
    виза, когато преминават външните граници, както
    и тези, чиито граждани са освободени от това
    изискване (Косово (Това название не засяга
    позициите по отношение на статута и е съобразено
    с Резолюция 1244/1999 на Съвета за сигурност на
    Организацията на обединените нации и становището
    на Международния съд относно обявяването на
    независимост от страна на Косово.))
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2023/850 ze dne 19. dubna
    2023, kterým se mění nařízení (EU) 2018/1806, kterým se stanoví seznam
    třetích zemí, jejichž státní příslušníci musí mít při překračování
    vnějších hranic vízum, jakož i seznam třetích zemí, jejichž státní
    příslušníci jsou od této povinnosti osvobozeni (Kosovo (Tímto označením
    nejsou dotčeny postoje k otázce statusu a označení je v souladu s rezolucí
    Rady bezpečnosti OSN 1244/1999 a se stanoviskem Mezinárodního soudního dvora
    k vyhlášení nezávislosti Kosova.))
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2023/850 af 19. april 2023
    om ændring af forordning (EU) 2018/1806 om fastlæggelse af listen over de tredjelande,
    hvis statsborgere skal være i besiddelse af visum ved passage af de ydre grænser,
    og listen over de tredjelande, hvis statsborgere er fritaget for dette krav (Kosovo
    (Denne betegnelse indebærer ingen stillingtagen til Kosovos status, og den er
    i overensstemmelse med UNSCR 1244/1999 og ICJ's udtalelse om Kosovos uafhængighedserklæring.))
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2023/850 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 19ης Απριλίου 2023 για
    την τροποποίηση του κανονισμού (ΕΕ) 2018/1806 περί
    του καταλόγου τρίτων χωρών οι υπήκοοι των οποίων
    υπόκεινται στην υποχρέωση θεώρησης για τη
    διέλευση των εξωτερικών συνόρων των κρατών
    μελών, και του καταλόγου των τρίτων χωρών οι
    υπήκοοι των οποίων απαλλάσσονται από την υποχρέωση
    αυτή (Κόσοβο (Η ονομασία αυτή χρησιμοποιείται
    με επιφύλαξη των θέσεων ως προς το καθεστώς
    και συνάδει με την ΑΣΑΗΕ 1244/1999 και τη γνώμη
    του Διεθνούς Δικαστηρίου σχετικά με τη διακήρυξη
    της ανεξαρτησίας του Κοσόβου.))
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2023/850, 19. aprill 2023,
    millega muudetakse määrust (EL) 2018/1806, milles loetletakse kolmandad riigid,
    kelle kodanikel peab välispiiride ületamisel olema viisa, ja need kolmandad
    riigid, kelle kodanikud on sellest nõudest vabastatud (Kosovo (Kõnealune nimetus
    ei piira seisukohti staatuse suhtes ning on kooskõlas ÜRO Julgeolekunõukogu
    resolutsiooniga 1244/1999 ja Rahvusvahelise Kohtu arvamusega Kosovo iseseisvusdeklaratsiooni
    kohta.))
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2023/850, annettu 19 päivänä
    huhtikuuta 2023, luettelon vahvistamisesta kolmansista maista, joiden kansalaisilla
    on oltava viisumi ulkorajoja ylittäessään, ja niistä kolmansista maista, joiden
    kansalaisia tämä vaatimus ei koske, annetun asetuksen (EU) 2018/1806 muuttamisesta
    (Kosovo (Tämä nimitys ei vaikuta asemaa koskeviin kantoihin, ja se on YK:n turvallisuusneuvoston
    päätöslauselman 1244/1999 ja Kansainvälisen tuomioistuimen Kosovon itsenäisyysjulistuksesta
    antaman lausunnon mukainen.))
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2023/850 ó Pharlaimint na hEorpa agus ón gComhairle an
    19 Aibreán 2023 lena leasaítear Rialachán (AE) 2018/1806 lena liostaítear
    na tríú tíortha a mbeidh ar a náisiúnaigh víosaí a bheith ina seilbh acu
    ar thrasnú teorainneacha seachtracha dóibh agus lena liostaítear na tríú
    tíortha a mbeidh a náisiúnaigh díolmhaithe ón gceanglas sin (an Chosaiv (Tá
    an t-ainmniú seo gan dochar do sheasaimh maidir le stádas, agus tá sé i gcomhréir
    le UNSCR 1244/1999 agus le Tuairim CBI maidir le dearbhú neamhspleáchais na
    Cosaive.))
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2023/850 Europskog parlamenta i Vijeća od 19. travnja 2023.
    o izmjeni Uredbe (EU) 2018/1806 o popisu trećih zemalja čiji državljani moraju
    imati vizu pri prelasku vanjskih granica i zemalja čiji su državljani izuzeti
    od tog zahtjeva (Kosovo (Ovim se nazivom ne dovode u pitanje stajališta o statusu
    te je on u skladu s RVSUN-om 1244/1999 i mišljenjem Međunarodnog suda o proglašenju
    neovisnosti Kosova.))
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2023/850 rendelete (2023. április
    19.) a külső határok átlépésekor vízumkötelezettség alá eső, illetve
    az e kötelezettség alól mentes harmadik országbeli állampolgárok országainak
    felsorolásáról szóló (EU) 2018/1806 rendelet módosításáról (Koszovó
    (Ez a megnevezés nem érinti a jogállással kapcsolatos álláspontokat, továbbá
    összhangban van az 1244/1999 sz. ENSZ BT-határozattal és a Nemzetközi Bíróságnak
    a koszovói függetlenségi nyilatkozatról szóló véleményével.))
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2023/850 del Parlamento europeo e del Consiglio del 19
    aprile 2023 che modifica il regolamento (UE) 2018/1806, che adotta l’elenco
    dei paesi terzi i cui cittadini devono essere in possesso del visto all’atto
    dell’attraversamento delle frontiere esterne e l’elenco dei paesi terzi i
    cui cittadini sono esenti da tale obbligo (Kosovo (Tale designazione non pregiudica
    le posizioni riguardo allo status ed è in linea con la risoluzione 1244/1999
    dell’UNSC e con il parere della CIG sulla dichiarazione di indipendenza del
    Kosovo.))
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2023/850 (2023. gada 19. aprīlis),
    ar kuru groza Regulu (ES) 2018/1806, ar ko izveido to trešo valstu sarakstu,
    kuru valstspiederīgajiem, šķērsojot dalībvalstu ārējās robežas, ir jābūt
    vīzām, kā arī to trešo valstu sarakstu, uz kuru valstspiederīgajiem minētā
    prasība neattiecas (Kosova (Šis nosaukums neskar nostājas par statusu un atbilst
    ANO DP Rezolūcijai 1244/1999 un Starptautiskās Tiesas atzinumam par Kosovas
    neatkarības deklarāciju.))
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2023/850 2023 m. balandžio
    19 d. kuriuo iš dalies keičiamas Reglamentas (ES) 2018/1806, nustatantis trečiųjų
    šalių, kurių piliečiai, kirsdami išorės sienas, privalo turėti vizas, ir
    trečiųjų šalių, kurių piliečiams toks reikalavimas netaikomas, sąrašus
    (Kosovas (Šis pavadinimas nekeičia pozicijų dėl statuso ir atitinka JT ST
    rezoliuciją 1244/1999 bei Tarptautinio Teisingumo Teismo nuomonę dėl Kosovo
    nepriklausomybės deklaracijos.))
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2023/850 tal-Parlament Ewropew u tal-Kunsill tad-19 ta’
    April 2023 li jemenda r-Regolament (UE) 2018/1806 li jelenka l-pajjiżi terzi
    li ċ-ċittadini tagħhom għandhom ikollhom viża fil-pussess tagħhom meta jaqsmu
    l-fruntieri esterni u dawk li ċ-ċittadini tagħhom huma eżenti minn dik il-ħtieġa
    (Il-Kosovo (Dan l-isem huwa mingħajr preġudizzju għall-pożizzjonijiet dwar
    l-istatus, u huwa konformi mal-UNSCR 1244/1999 u l-Opinjoni tal-QIĠ dwar id-dikjarazzjoni
    tal-indipendenza tal-Kosovo.))
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2023/850 van het Europees Parlement en de Raad van 19
    april 2023 tot wijziging van Verordening (EU) 2018/1806 tot vaststelling van de
    lijst van derde landen waarvan de onderdanen bij overschrijding van de buitengrenzen
    in het bezit moeten zijn van een visum en de lijst van derde landen waarvan de
    onderdanen van die plicht zijn vrijgesteld (Kosovo (Deze verwijzing laat de standpunten
    over de status van Kosovo onverlet, en is in overeenstemming met Resolutie 1244
    (1999) van de VN-Veiligheidsraad en het advies van het Internationaal Gerechtshof
    over de onafhankelijkheidsverklaring van Kosovo.))
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2023/850 z dnia 19
    kwietnia 2023 r. w sprawie zmiany rozporządzenia (UE) 2018/1806 wymieniającego
    państwa trzecie, których obywatele muszą posiadać wizy podczas przekraczania
    granic zewnętrznych, oraz te, których obywatele są zwolnieni z tego wymogu
    (Kosowo (Użycie tej nazwy nie wpływa na stanowiska w sprawie statusu Kosowa
    i jest zgodne z rezolucją Rady Bezpieczeństwa ONZ nr 1244/1999 oraz z opinią
    Międzynarodowego Trybunału Sprawiedliwości w sprawie Deklaracji niepodległości
    Kosowa.))
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2023/850 do Parlamento Europeu e do Conselho de 19 de
    abril de 2023 que altera o Regulamento (UE) 2018/1806 que fixa a lista dos países
    terceiros cujos nacionais estão sujeitos à obrigação de visto para transpor
    as fronteiras externas e a lista dos países terceiros cujos nacionais estão
    isentos dessa obrigação (Kosovo (Esta designação não prejudica as posições
    relativas ao estatuto e está conforme com a Resolução 1244/1999 do CSNU e com
    o parecer do TIJ sobre a declaração de independência do Kosovo.))
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2023/850 al Parlamentului European și al Consiliului
    din 19 aprilie 2023 de modificare a Regulamentului (UE) 2018/1806 de stabilire
    a listei țărilor terțe ai căror resortisanți trebuie să dețină viză pentru
    trecerea frontierelor externe și a listei țărilor terțe ai căror resortisanți
    sunt exonerați de această obligație (Kosovo (Această denumire nu aduce atingere
    pozițiilor privind statutul și este conformă cu RCSONU 1244/1999, precum și
    cu Avizul CIJ privind Declarația de independență a Kosovo.))
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2023/850 z 19. apríla 2023,
    ktorým sa mení nariadenie (EÚ) 2018/1806 uvádzajúce zoznam tretích krajín,
    ktorých štátni príslušníci musia mať víza pri prekračovaní vonkajších
    hraníc členských štátov, a krajín, ktorých štátni príslušníci sú
    oslobodení od tejto povinnosti (Kosovo (Týmto označením nie sú dotknuté
    pozície k štatútu a označenie je v súlade s rezolúciou BR OSN č. 1244/1999
    a so stanoviskom Medzinárodného súdneho dvora k vyhláseniu nezávislosti Kosova.))
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2023/850 Evropskega parlamenta in Sveta z dne 19. aprila 2023
    o spremembi Uredbe (EU) 2018/1806 o seznamu tretjih držav, katerih državljani
    morajo pri prehodu zunanjih meja imeti vizume, in držav, katerih državljani
    so izvzeti iz te obveznosti (Kosovo (To poimenovanje ne posega v stališča o
    statusu ter je v skladu z RVSZN 1244/1999 in mnenjem Meddržavnega sodišča o
    razglasitvi neodvisnosti Kosova.))
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2023/850 del Parlamento Europeo y del Consejo de 19 de
    abril de 2023 por el que se modifica el Reglamento (UE) 2018/1806 por el que se
    establecen la lista de terceros países cuyos nacionales están sometidos a la
    obligación de visado para cruzar las fronteras exteriores y la lista de terceros
    países cuyos nacionales están exentos de esa obligación (Kosovo (La denominación
    «Kosovo» se entiende sin perjuicio de las posiciones sobre su estatuto y está
    en consonancia con la Resolución 1244/1999 del Consejo de Seguridad de las Naciones
    Unidas y con la opinión de la Corte Internacional de Justicia sobre la declaración
    de independencia de Kosovo.))
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2023/850 av den 19 april
    2023 om ändring av förordning (EU) 2018/1806 om fastställande av förteckningen
    över tredjeländer vars medborgare är skyldiga att inneha visering när de passerar
    de yttre gränserna och av förteckningen över de tredjeländer vars medborgare
    är undantagna från detta krav (Kosovo (Denna beteckning påverkar inte ståndpunkter
    om Kosovos status och är i överensstämmelse med FN:s säkerhetsråds resolution
    1244/1999 och med Internationella domstolens utlåtande om Kosovos självständighetsförklaring.))
