title:
- language: en
  script: Latn
  content: '2005/569/: Commission Decision of 18 July 2005 adjusting the weightings
    applicable from 1 August, 1 September, 1 October, 1 November and 1 December 2004
    and from 1 January 2005 to the remuneration of officials, temporary staff and
    contract staff of the European Communities serving in third countries and of certain
    officials remaining in post in the 10 new Member States for a maximum period of
    15 months after accession (Article 33(4) of the Treaty on the accession of the
    10 new Member States)'
  type: main
- language: fr
  script: Latn
  content: '2005/569/: Décision de la Commission du 18 juillet 2005 portant adaptation
    des coefficients correcteurs applicables à partir des 1er août, 1er septembre,
    1er octobre, 1er novembre et 1er décembre 2004, et du 1er janvier 2005, aux rémunérations
    des fonctionnaires, agents temporaires et agents contractuels des Communautés
    européennes affectés dans les pays tiers ainsi qu’à une partie des fonctionnaires
    restant en poste dans les dix nouveaux États membres pendant une période maximale
    de quinze mois suivant l’adhésion (article 33, paragraphe 4, du traité d’adhésion
    des dix nouveaux États membres)'
  type: main
- language: de
  script: Latn
  content: '2005/569/: Beschluss der Kommission vom 18. Juli 2005 zur Anpassung der
    Berichtigungskoeffizienten, die mit Wirkung vom 1. August 2004, 1. September 2004,
    1. Oktober 2004, 1. November 2004, 1. Dezember 2004 und 1. Januar 2005 auf die
    Dienstbezüge der Beamten, der Zeit- und Vertragsbediensteten der Europäischen
    Gemeinschaften in Drittländern sowie eines Teils der Beamten, die in den zehn
    neuen Mitgliedstaaten für einen Zeitraum von höchstens fünfzehn Monaten nach
    Beitritt auf ihrem Dienstposten verbleiben, anwendbar sind (Artikel 33 Absatz
    4 des Beitrittsvertrags der zehn neuen Mitgliedstaaten)'
  type: main
- language: cs
  script: Latn
  content: '2005/569/: Rozhodnutí Komise ze dne 18. července 2005, kterým se upravují
    opravné koeficienty použitelné od 1. srpna 2004, 1. září 2004, 1. října
    2004, 1. listopadu 2004, 1. prosince 2004 a 1. ledna 2005 na odměny úředníků,
    smluvních a dočasných zaměstnanců Evropských společenství vykonávajících
    služební povinnosti ve třetích zemích a na odměny části úředníků setrvávajících
    na pracovním místě v deseti nových členských státech po dobu nejvýše
    patnácti měsíců od přistoupení (ustanovení čl. 33 odst. 4 smlouvy o přistoupení
    deseti nových členských států)'
  type: main
- language: da
  script: Latn
  content: '2005/569/: Kommissionens afgørelse af 18. juli 2005 om tilpasning af
    de justeringskoefficienter, der finder anvendelse fra den 1. august 2004, 1. september
