    2004 ja 1 päivästä tammikuuta 2005 alkaen sovellettavien korjauskertoimien
    mukauttamisesta (kymmenen uuden jäsenvaltion liittymissopimuksen 33 artiklan
    4 kohta)'
  type: main
- language: hu
  script: Latn
  content: '2005/569/: A Bizottság határozata (2005. július 18.) a 2004. augusztus
