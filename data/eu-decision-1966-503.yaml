title:
- language: fr
  script: Latn
  content: Décision 66/503/CEE de la Commission, du 29 juillet 1966, portant nouvelle
    modification de sa décision du 18 mai 1966 autorisant la perception de taxes
    compensatoires à l'importation dans le Royaume de Belgique, le Grand-Duché de
    Luxembourg et le Royaume des Pays-Bas, de pâte à fondant en provenance de République
    fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: '66/503/EWG: Entscheidung der Kommission vom 29. Juli 1966 zur erneuten
    Änderung ihrer Entscheidung vom 18. Mai 1966 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Fondantmasse aus der Bundesrepublik Deutschland in das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande'
  type: main
- language: it
  script: Latn
  content: '66/503/CEE: Decisione della Commissione, del 29 luglio 1966, che modifica
    nuovamente la decisione del 18 maggio 1966 che autorizza la riscossione di tasse
    di compensazione all''importazione nel Regno del Belgio, nel Granducato del Lussemburgo
    e nel Regno dei Paesi Bassi, di pasta per fondente in provenienza dalla Repubblica
    federale di Germania'
  type: main
- language: nl
  script: Latn
  content: '66/503/EEG: Beschikking van de Commissie van 29 juli 1966 tot nieuwe wijziging
    van haar beschikking van 18 mei 1966 houdende machtiging tot het leggen van compenserende
    heffingen op de invoer in het Koninkrijk België, het Groothertogdom Luxemburg
    en het Koninkrijk der Nederlanden van fondantmassa uit de Bondsrepubliek Duitsland'
