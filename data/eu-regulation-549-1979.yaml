title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 549/79 of 22 March 1979 re-establishing
    the levying of customs duties on woven fabrics of silk, of noil or other waste
    silk, falling within heading No 50.09 and originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 549/79 de la Commission, du 22 mars 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie, de bourre de soie (schappe) ou de déchets de bourre de soie (bourette)
    de la position 50.09 du tarif douanier commun, originaires de l' Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 549/79 der Kommission vom 22. März 1979 über die
    Wiedereinführung des Zollsatzes für Gewebe aus Seide, Schappeseide oder Bourretteseide
    der Tarifnummer 50.09, mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 549/79 af 22. marts 1979 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke (herunder schappesilke
    og bourettesilke under position 50.09 som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 549/79 della Commissione, del 22 marzo 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di seta, di borra di seta
    (schappe) o di cascami di borra di seta (roccadino o pettenuzzo di seta) della
    voce 50.09, originari dell' India beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 549/79 van de Commissie van 22 maart 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van zijde, van vlokzijde of van bourrette, van post 50.09, van oorsprong uit India
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3157/78 van de Raad
  type: main
