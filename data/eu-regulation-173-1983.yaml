  content: Council Regulation (EEC) No 173/83 of 25 January 1983 amending Regulation
    (EEC) No 370/82 concerning the management and control of certain catch quotas
    for 1982 for vessels flying the flag of a Member State and fishing in the Regulatory
    Area defined in the NAFO Convention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 173/83 du Conseil du 25 janvier 1983 modifiant le règlement
    (CEE) no 370/82 concernant la gestion et le contrôle de certains quotas de capture
    alloués pour 1982 aux navires battant pavillon d' un des États membres et pêchant
    dans la zone de réglementation définie par la convention NAFO
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 173/83 des Rates vom 25. Januar 1983 zur Änderung
    der Verordnung (EWG) Nr. 370/82 zur Bewirtschaftung und Kontrolle bestimmter Fangquoten
    für 1982 für Fischereifahrzeuge unter der Flagge eines Mitgliedstaats, die im
    Regelungsbereich des NAFO-Übereinkommens fischen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 173/83 af 25. januar 1983 om ændring af
    forordning (EØF) nr. 370/82 om forvaltning af og kontrol med visse fangstkvoter
    for 1982 for fartøjer, som fører en medlemsstats flag, og som udøver fiskeri
    i det regulerede område, der er defineret i NAFO-konventionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 173/83 του Συμβουλίου
    της 25ης Ιανουαρίου 1983 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 370/82 περί διαχειρίσεως
    και ελέγχου ορισμένων ποσοστώσεων αλιείας
    που χορηγούνται, για το έτος 1982, στα σκάφη που
    φέρουν σημαία ενός των Κρατών μελών και αλιεύουν
    στη ζώνη διακανονισμού που καθορίζεται στη
