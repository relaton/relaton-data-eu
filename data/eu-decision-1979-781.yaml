title:
- language: en
  script: Latn
  content: '79/781/EEC: Commission Decision of 30 August 1979 authorizing the French
    Republic not to apply Community treatment to under garments, knitted or crocheted,
    not elastic or rubberized; women''s, girls''and infants''(other than babies'')
    knitted or crocheted pyjamas and night dresses, of cotton or synthetic fibres,
    falling within heading No ex 60.04 of the Common Customs Tariff (NIMEXE codes
    60.04-51, 53, 81, 83) (category 25), originating in Yugoslavia and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/781/CEE: Décision de la Commission, du 30 août 1979, autorisant la
    République française à exclure du traitement communautaire les sous-vêtements
    de bonneterie non élastique ni caoutchoutée : pyjamas et chemises de nuit, de
    bonneterie, de coton ou de fibres textiles synthétiques pour femmes, fillettes
    et jeunes enfants (autres que bébés), de la position ex 60.04 du tarif douanier
    commun (codes Nimexe : 60.04-51, 53, 81, 83) (catégorie 25), originaires de Yougoslavie
    et mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/781/EWG: Entscheidung der Kommission vom 30. August 1979, mit der die
    Französische Republik ermächtigt wird, aus Jugoslawien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Unterkleidung aus Gewirken,
    weder gummielastisch noch kautschutiert: Schlafanzüge und Nachthemden aus Gewirken,
    aus Baumwolle oder aus synthetischen Spinnstoffen, für Frauen, Mädchen und Kleinkinder
    (ausgenommen Säuglinge), der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 60.04-51 ; 53 ; 81 ; 83), Kategorie 25, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/781/EØF: Kommissionens beslutning af 30. august 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage underbeklædningsgenstande
    af trikotage, ikke elastik eller gummeret : pyjamas og natskjorter af trikotage,
    bomuld eller kemofibre til kvinder, piger og småbørn (undtagen spædbørn),
    som henhører under pos. 60.04 i den fælles toldtarif (NIMEXE-nummer 60.04-51,
    53, 81, 83 ; kategori 25), har oprindelse i Jugoslavien og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/781/CEE: Decisione della Commissione, del 30 agosto 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario sottovesti a maglia
    non elastica né gommata [pigiami e camicie da notte a maglia, di cotone o di
    fibre tessili sintetiche, per donna, per ragazza e per bambini, diversi dai bambini
    piccoli (bébés)], della voce ex 60.04 della tariffa doganale comune (codici
    Nimexe: 60.04-51, 53, 81, 83), categoria 25, originarie della Iugoslavia e messe
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/781/EEG: Beschikking van de Commissie van 30 augustus 1979 waarbij
    de Franse Republiek wordt gemachtigd onderkleding van niet-elastisch of van niet-gegummeerd
    brei- of haakwerk: pyjama''s en nachthemden voor dames, meisjes en kinderen (andere
    dan die voor baby''s), van brei- of haakwerk, van katoen of van synthetische vezels,
    van post ex 60.04 van het gemeenschappelijk douanetarief (NIMEXE-code 60.04-51,
    53, 81, 83) (categorie 25), van oorsprong uit Joegoslavië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
