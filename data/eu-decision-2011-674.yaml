  type: main
- language: fr
  script: Latn
  content: Décision d’exécution de la Commission du 12 octobre 2011 modifiant
    la décision 2004/558/CE en ce qui concerne le statut d’indemne de rhinotrachéite
    infectieuse bovine de certaines régions administratives d’Allemagne [notifiée
    sous le numéro C(2011) 7165]
