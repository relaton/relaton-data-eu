  content: Règlement (CEE) n° 1234/70 du Conseil, du 29 juin 1970, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de 20.000
    têtes de génisses et vaches, autres que celles destinées à la boucherie, de
    certaines races de montagne, de la position EX 01.02 à II b) 2 du tarif douanier
    commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1234/70 des Rates vom 29. Juni 1970 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für 20 000 Stück
    Färsen und Kühe bestimmter Höhenrassen, nicht zum Schlachten, der Tarifstelle
    ex 01.02 A II b) 2 des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1234/70 del Consiglio, del 29 giugno 1970, relativo
    all'apertura, alla ripartizione e alle modalità di gestione del contingente tariffario
    comunitario di 20.000 capi di giovenche e vacche, diverse da quelle destinate
    alla macellazione, di alcune razze di montagna, della voce ex 01.02 A II b) 2
    della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1234/70 van de Raad van 29 juni 1970 betreffende
