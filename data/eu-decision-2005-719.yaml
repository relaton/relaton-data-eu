title:
- language: en
  script: Latn
  content: Council Decision 2005/719/JHA of 12 October 2005 fixing the date of application
    of certain provisions of Decision 2005/211/JHA concerning the introduction of
    some new functions for the Schengen Information System, including in the fight
    against terrorism
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil 2005/719/JAI du 12 octobre 2005 fixant la date d’application
    de certaines dispositions de la décision 2005/211/JAI concernant l’attribution
    de certaines fonctions nouvelles au système d’information Schengen, y compris
    dans le cadre de la lutte contre le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss 2005/719/JI des Rates vom 12. Oktober 2005 zur Festlegung des
    Beginns der Anwendung einiger Bestimmungen des Beschlusses 2005/211/JI über die
    Einführung neuer Funktionen für das Schengener Informationssystem, auch für
    die Terrorismusbekämpfung
  type: main
- language: bg
  script: Cyrl
  content: Решение 2005/719/ПВР на Съвета от 12 октомври
    2005 година за определяне на дата за прилагане
    на някои разпоредби на Решение 2005/211/ПВР за
    въвеждане на нови функции в Шенгенската информационна
    система, включително с оглед борбата срещу
    тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2005/719/SVV ze dne 12. října 2005, kterým se stanoví
    den použitelnosti některých ustanovení rozhodnutí 2005/211/SVV o zavedení
    některých nových funkcí v Schengenském informačním systému, včetně boje
    proti terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2005/719/RIA af 12. oktober 2005 om fastsættelse af
    datoen for anvendelse af visse bestemmelser i afgørelse 2005/211/RIA om indførelse
    af nye funktioner i Schengen-informationssystemet, bl.a. med henblik på terrorismebekæmpelse
  type: main
- language: el
  script: Grek
  content: Απόφαση 2005/719/ΔΕΥ του Συμβουλίου, της 12ης
    Οκτωβρίου 2005, που ορίζει την ημερομηνία εφαρμογής
    ορισμένων διατάξεων της απόφασης 2005/211/ΔΕΥ,
    για την εισαγωγή ορισμένων νέων λειτουργιών
    του συστήματος πληροφοριών Σένγκεν, συμπεριλαμβανομένης
    της καταπολέμησης της τρομοκρατίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2005/719/JSK, 12. oktoober 2005, millega määratakse kindlaks
    otsuse 2005/211/JSK (Schengeni infosüsteemi jaoks mõnede uute, sealhulgas terrorismivastast
    võitlust käsitlevate toimingute sisseseadmise kohta) teatavate sätete kohaldamise
    kuupäev
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2005/719/YOS, tehty 12 päivänä lokakuuta 2005, Schengenin
    tietojärjestelmän eräiden uusien toimintojen käyttöönottamisesta, myös
    terrorismin torjunnassa, tehdyn päätöksen 2005/211/YOS tiettyjen säännösten
    soveltamispäivän vahvistamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2005/719/IB határozata (2005. október 12.) a terrorizmus elleni
    küzdelem keretében a Schengeni Információs Rendszer egyes új funkcióinak
    bevezetéséről szóló 2005/211/IB tanácsi határozat egyes rendelkezései
    alkalmazási időpontjának meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2005/719/GAI del Consiglio, del 12 ottobre 2005, che stabilisce
    la data di applicazione di talune disposizioni della decisione 2005/211/GAI relativa
    all’introduzione di alcune nuove funzioni del Sistema d’informazione Schengen,
    anche nel quadro della lotta contro il terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2005/719/TI (2005. gada 12. oktobris), ar ko nosaka datumu
    dažu noteikumu piemērošanai, kas paredzēti Lēmumā 2005/211/TI par dažu
    jaunu funkciju ieviešanu Šengenas Informācijas sistēmā, tostarp attiecībā
    uz terorisma apkarošanu
  type: main
- language: lt
  script: Latn
  content: 2005 m. spalio 12 d. Tarybos sprendimas 2005/719/TVR, nustatantis Sprendimo
    2005/211/TVR dėl Šengeno informacinės sistemos kai kurių naujų funkcijų
    nustatymo, įskaitant kovos su terorizmu srityje, tam tikrų nuostatų taikymo
    datą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2005/719/ĠAI tat- 12 ta' Ottubru 2005 li tiffissa
    d-data ta' applikazzjoni ta' ċerti dispożizzjonijiet tad-Deċiżjoni 2005/211/ĠAI
    dwar l-introduzzjoni ta' xi funzjonijiet ġodda għas-Sistema ta’ Informazzjoni
    ta’ Schengen, inklużi fil-ġlieda kontra t-terroriżmu
  type: main
- language: nl
  script: Latn
  content: Besluit 2005/719/JBZ van de Raad van 12 oktober 2005 tot vaststelling van
    de datum voor de toepassing van sommige bepalingen van Besluit 2005/211/JBZ betreffende
    de invoering van enkele nieuwe functies in het Schengeninformatiesysteem, inclusief
    bij de bestrijding van terrorisme
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2005/719/WSiSW z dnia 12 października 2005 r. ustalająca
    datę rozpoczęcia stosowania niektórych przepisów decyzji 2005/211/WSiSW dotyczącej
    wprowadzenia kilku nowych funkcji do Systemu Informacyjnego Schengen, w tym związanych
    z walką z terroryzmem
  type: main
- language: pt
  script: Latn
  content: Decisão do Conselho 2005/719/JAI, de 12 de Outubro de 2005, que fixa a
    data de aplicação de determinadas disposições da Decisão 2005/211/JAI relativa
    à introdução de novas funções no Sistema de Informação de Schengen, incluindo
    a luta contra o terrorismo
  type: main
- language: ro
  script: Latn
  content: Decizia 2005/719/JAI a Consiliului din 12 octombrie 2005 de fixare a datei
    de aplicare a anumitor dispoziții ale Deciziei 2005/211/JAI a Consiliului din
    24 februarie 2005 privind introducerea unor noi funcții ale Sistemului de informații
    Schengen, inclusiv în combaterea terorismului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2005/719/SVV z 12. októbra 2005, ktorým sa stanovuje
    dátum uplatňovania určitých ustanovení rozhodnutia 2005/211/SVV o zavedení
    niektorých nových funkcií pre Schengenský informačný systém vrátane boja
    proti terorizmu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2005/719/PNZ z dne 12. oktobra 2005 o določitvi datuma uporabe
    nekaterih določb Sklepa 2005/211/PNZ o uvedbi nekaterih novih funkcij za schengenski
    informacijski sistem, vključno v zvezi z bojem proti terorizmu
  type: main
- language: es
  script: Latn
  content: Decisión 2005/719/JAI del Consejo, de 12 de octubre de 2005, por la que
    se fija la fecha de aplicación de determinadas disposiciones de la Decisión
    2005/211/JAI relativa a la introducción de nuevas funciones para el Sistema de
    Información de Schengen, inclusive en materia de lucha contra el terrorismo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2005/719/RIF av den 12 oktober 2005 om fastställande av
    datum för tillämpningen av vissa bestämmelser i beslut 2005/211/RIF om införande
    av ett antal nya funktioner för Schengens informationssystem, bland annat i kampen
    mot terrorism
