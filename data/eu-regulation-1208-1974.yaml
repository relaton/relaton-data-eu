type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1208/74 of the Commission of 14 May 1974 re-establishing
    the levying of the customs duties on other parts and accessories of articles falling
    within heading No 87.09, 87.10 or 87.11 of subheading No 87.12 B of the Common
    Customs Tariff, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1208/74 de la Commission, du 14 mai 1974, portant
    rétablissement de la perception des droits de douane applicables aux autres parties,
    pièces détachées et accessoires des véhicules repris aux n° 87.09 à 87.11
    inclus, de la sous-position tarifaire 87.12 B, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1208/74 der Kommission vom 14. Mai 1974 zur Wiedereinführung
    des Zollsatzes für Teile und Zubehör für Fahrzeuge der Tarifnummern 87.09 bis
    87.11, der Tarifstelle 87.12 B, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1208/74 af 14. maj 1974 om genindførelse
    af opkrævning af toldafgifter for dele og tilbehør til køretøjer, henhørende
    under pos. 87.09, 87.10 og 87.11, underposition 87.12 B, som har oprindelse i
    Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1208/74 della Commissione, del 14 maggio 1974, che
    ripristina la riscossione dei dazi doganali applicabili a parti, pezzi staccati
    ed accessori dei veicoli compresi nelle voci dal n. 87.09 al n. 87.11 incluso
    della sottovoce doganale n. 87.12 B originari della Iugoslavia, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1208/74 van de Commissie van 14 mei 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op delen, onderdelen
    en toebehoren van de voertuigen bedoeld bij de posten 87.09 tot en met 87.11,
    van onderverdeling 87.12 B, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
