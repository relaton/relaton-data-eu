    (EG) Nr. 58/2003 vorgesehene Prüfung der Rechtmäßigkeit von einem Dritten Schaden
    zufügenden Handlungen von Exekutivagenturen infolge einer diesbezüglichen Beschwerde
    bei der Kommission durch eine unmittelbar oder individuell betroffene Person
  type: main
