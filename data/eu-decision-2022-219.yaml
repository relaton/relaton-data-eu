title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/219 of 11 February 2022 establishing
    rules of procedure for the review, pursuant to Article 22(1) of Council Regulation
    (EC) No 58/2003, of the legality of acts of executive agencies which injure a
    third party and have been referred to the Commission by any person directly or
    individually concerned
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/219 de la Commission du 11 février
    2022 établissant les règles de procédure relatives au contrôle, conformément
    à l’article 22, paragraphe 1, du règlement (CE) no 58/2003 du Conseil, de
    la légalité des actes des agences exécutives faisant grief à un tiers et déférés
    à la Commission par toute personne directement et individuellement concernée
  type: main
- language: de
  script: Latn
