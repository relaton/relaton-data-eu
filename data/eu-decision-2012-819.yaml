title:
- language: en
  script: Latn
  content: '2012/819/EU, Euratom: Commission Implementing Decision of 19 December
    2012 repealing Decision 90/182/Euratom, EEC authorising the United Kingdom not
    to take into account certain categories of transactions and to use certain approximate
    estimates for the calculation of the VAT own resources base (notified under document
    C(2012) 9556)'
  type: main
- language: fr
  script: Latn
  content: '2012/819/UE, Euratom: Décision d’exécution de la Commission du 19
    décembre 2012 abrogeant la décision 90/182/Euratom, CEE autorisant le Royaume-Uni
    à ne pas tenir compte de certaines catégories d’opérations ou à utiliser
    certaines estimations approximatives pour le calcul de la base des ressources
    propres provenant de la taxe sur la valeur ajoutée [notifiée sous le numéro
    C(2012) 9556]'
  type: main
