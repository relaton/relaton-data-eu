title:
- language: en
  script: Latn
  content: '88/367/EEC: Seventh Commission Decision of 18 May 1988 relating to the
    application of Council Directive 72/166/EEC on the approximation of the laws of
    the Member States relating to insurance against civil liability in respect of
    the use of motor vehicles, and to the enforcement of the obligation to insure
    against such liability'
  type: main
- language: fr
  script: Latn
  content: '88/367/CEE: Septième Décision de la Commission du 18 mai 1988 relative
    à l'' application de la directive 72/166/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives à l'' assurance de la responsabilité
    civile résultant de la circulation de véhicules automoteurs, et au contrôle
    de l'' obligation d'' assurer cette responsabilité'
  type: main
- language: de
  script: Latn
  content: '88/367/EWG: Siebte Entscheidung der Kommission vom 18. Mai 1988 zur Durchführung
    der Richtlinie 72/166/EWG des Rates betreffend die Angleichung der Rechtsvorschriften
    der Mitgliedstaaten bezüglich der Kraftfahrzeug-Haftpflichtversicherung und der
    Kontrolle der entsprechenden Versicherungspflicht'
  type: main
- language: da
  script: Latn
  content: '88/367/EØF: Kommissionens syvende Beslutning af 18. maj 1988 om anvendelse
