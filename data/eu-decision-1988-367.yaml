    lovgivning om ansvarsforsikring for motorkøretøjer og kontrollen med forsikringspligtens
    overholdelse'
  type: main
- language: el
  script: Grek
  content: '88/367/ΕΟΚ: Έβδομη Απόφαση της Επιτροπής της
