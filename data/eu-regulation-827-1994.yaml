title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 827/94 of 13 April 1994 amending Commission
    Regulation (EC) No 343/94 opening compulsory distillation as provided for in Article
    39 of Council Regulation (EEC) No 822/87 and derogating for the 1993/94 wine year
    from certain detailed rules for the application thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 827/94 de la Commission du 13 avril 1994 modifiant
    le règlement (CE) n° 343/94 ouvrant la distillation obligatoire prévue à l'article
    39 du règlement (CEE) n° 822/87 du Conseil et dérogeant à certaines modalités
    d'application y afférentes pour la campagne 1993/1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 827/94 DER KOMMISSION vom 13. April 1994 zur Änderung
    der Verordnung (EG) Nr. 343/94 der Kommission zur Eröffnung der obligatorischen
    Destillation gemäß Artikel 39 der Verordnung (EWG) Nr. 822/87 des Rates und
    zur Abweichung von diesbezüglichen Durchführungsbestimmungen für das Wirtschaftsjahr
    1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 827/94 af 13. april 1994 om ændring
    af forordning (EF) nr. 343/94 om iværksættelse af obligatorisk destillation
    som omhandlet i artikel 39 i Rådets forordning (EØF) nr. 822/87 og om undtagelse
    fra visse bestemmelser om destillationens gennemførelse for produktionsåret
    1993/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 827/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 13ης Απριλίου 1994 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 343/94 σχετικά με την έναρξη
    της ισχύος της υποχρεωτικής απόσταξης που
    προβλέπεται στο άρθρο 39 του κανονισμού (ΕΟΚ)
    αριθ. 822/87 του Συμβουλίου και με την παρέκκλιση
    από ορισμένες σχετικές λεπτομέρειες εφαρμογής
    για την περίοδο εμπορίας 1993/94
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 827/94 DELLA COMMISSIONE del 13 aprile 1994 che modifica
    il regolamento (CE) n. 343/94 recante apertura della distillazione obbligatoria
    di cui all' articolo 39 del regolamento (CEE) n. 822/87 del Consiglio e recante
    deroga ad alcune modalità d' applicazione ad essa relative per la campagna 1993/1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 827/94 VAN DE COMMISSIE van 13 april 1994 houdende
    wijziging van Verordening (EG) nr. 343/94 tot instelling van de in artikel 39
    van Verordening (EEG) nr. 822/87 van de Raad bedoelde verplichte distillatie en
    houdende afwijking van uitvoeringsbepalingen ter zake voor het wijnoogstjaar 1993/1994
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 827/94 DA COMISSÃO de 13 de Abril de 1994 que altera
    o Regulamento (CE) nº 343/94 que abre a destilação obrigatória referida no
    artigo 39º do Regulamento (CEE) nº 822/87 do Conselho e derroga determinadas
    regras de execução a ela relativas para a campanha de 1993/1994
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 827/94 DE LA COMISIÓN de 13 de abril de 1994 por el
    que se modifica el Reglamento (CE) nº 343/94 por el que se decide iniciar la
    destilación obligatoria contemplada en el artículo 39 del Reglamento (CEE) nº
    822/87 del Consejo y se establecen casos de excepción a algunas de las normas
    de aplicación correspondientes durante la campaña 1993/94
  type: main
