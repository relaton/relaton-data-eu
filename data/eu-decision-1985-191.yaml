title:
- language: en
  script: Latn
  content: '85/191/EEC: Commission Decision of 18 March 1985 on the sixth amendment
    of Decision 82/467/EEC authorizing a number of Member States to sell butter at
    a reduced price in the form of concentrated butter (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/191/CEE: Décision de la Commission du 18 mars 1985 portant sixième
    modification de la décision 82/467/CEE autorisant plusieurs États membres à
    vendre du beurre à prix réduit sous forme de beurre concentré (Le texte en
    langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '85/191/EWG: Entscheidung der Kommission vom 18. März 1985 zur sechsten
    Änderung der Entscheidung 82/467/EWG zur Ermächtigung mehrerer Mitgliedstaaten
    zum Verkauf von Butter zu herabgesetzten Preisen in Form von Butterreinfett (Nur
    der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/191/EØF: Kommissionens beslutning af 18. marts 1985 om 6. ændring
    af beslutning 82/467/EØF om bemyndigelse af medlemsstater til at sælge smør
    til nedsat pris i form af koncentreret smør (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/191/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Μαρτίου 1985 περί έκτης τροποποίησης της απόφασης
    82/467/ΕΟΚ που επιτρέπει σε ορισμένα κράτη μέλη
    να πωλούν το βούτυρο υπό μορφή συμπυκνωμένου
    βουτύρου σε μειωμένη τιμή (Το κείμενο στη γερμανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/191/CEE: Decisione della Commissione del 18 marzo 1985 recante sesta
    modifica della decisione 82/467/CEE, che autorizza alcuni stati membri a vendere
    burro a prezzo ridotto sotto forma di burro concentrato (Il testo in lingua tedesca
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/191/EEG: Beschikking van de Commissie van 18 maart 1985 houdende zesde
