    a vender manteiga a preço reduzido sob a forma de manteiga concentrada (Apenas
    faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '85/191/CEE: Decisión de la Comisión, de 18 de marzo de 1985, por la
