title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1804/85 of 28 June 1985 re-establishing
    the levying of customs duties on choline chloride falling within subheading 29.24
    ex B, originating in Romania, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1804/85 de la Commission du 28 juin 1985 portant rétablissement
    de la perception des droits de douane applicables au chlorure de choline, de la
    sous-position 29.24 ex B du tarif douanier commun, originaire de Roumanie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1804/85 der Kommission vom 28. Juni 1985 zur Wiedereinführung
