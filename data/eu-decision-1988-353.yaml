title:
- language: en
  script: Latn
  content: '88/353/EEC: Commission Decision of 22 June 1988 accepting an undertaking
    given in connection with the anti-dumping investigation concerning imports of
    oxalic acid originating in Taiwan or South Korea and terminating the investigation
    with regard to the exporter concerned'
  type: main
- language: fr
  script: Latn
  content: '88/353/CEE: Décision de la Commission du 22 juin 1988 portant acceptation
    d'' un engagement souscrit dans le cadre de l'' enquête antidumping concernant
    les importations d'' acide oxalique originaire de T'' ai-wan et de la Corée du
    Sud et portant clôture de l'' enquête à l'' égard de l'' exportateur concerné'
  type: main
- language: de
  script: Latn
  content: '88/353/EWG: Beschluß der Kommission vom 22. Juni 1988 zur Annahme einer
    Verpflichtung im Rahmen des Antidumpingverfahrens betreffend die Einfuhren von
    Oxalsäure mit Ursprung in Taiwan und Südkorea und zur Einstellung des Verfahrens
    gegenüber dem betreffenden Ausführer'
  type: main
- language: da
  script: Latn
  content: '88/353/EØF: Kommissionens afgørelse af 22. juni 1988 om godtagelse af
    tilsagn i forbindelse med antidumpingundersøgelsen vedrørende importen af oxalsyre
    med oprindelse i Taiwan og Sydkorea og om afslutning af undersøgelsen for så
    vidt angår den pågældende eksportør'
  type: main
- language: el
  script: Grek
  content: '88/353/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Ιουνίου 1988 για την αποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν στο πλαίσιο της έρευνας αντιντάμπινγκ
    όσον αφορά τις εισαγωγές οξαλικού οξέος καταγωγής
    Ταϊβάν και Νότιας Κορέας και για την περάτωση
    της έρευνας όσον αφορά έναν εξαγωγέα'
  type: main
- language: it
  script: Latn
  content: '88/353/CEE: Decisione della Commissione del 22 giugno 1988 recante accettazione
    di un impegno assunto nell'' ambito di un'' inchiesta antidumping sulle importazioni
    di acido ossalico originario di Taiwan e della Corea del Sud e recante chiusura
    dell'' inchiesta nei confronti dell'' esportatore interessato'
  type: main
- language: nl
  script: Latn
  content: '88/353/EEG: Besluit van de Commissie van 22 juni 1988 houdende aanvaarding
    van een verbintenis in het kader van het anti-dumpingonderzoek betreffende de
    invoer van oxaalzuur van oorsprong uit Taiwan en Zuid-Korea en houdende beëindiging
    van het onderzoek ten aanzien van de betrokken exporteur'
  type: main
- language: pt
  script: Latn
  content: '88/353/CEE: Decisão da Comissão de 22 de Junho de 1988 que aceita um
    compromisso oferecido no âmbito do inquérito antidumping relativo às importações
    de ácido oxálico originário de Taiwan e da Coreia do Sul e que encerra o inquérito
    relativo ao exportador em questão'
  type: main
- language: es
  script: Latn
  content: '88/353/CEE: Decisión de la Comisión de 22 de junio de 1988 por la que
    se acepta un compromiso ofrecido en el marco de la investigación antidumping
    relativa a las importaciones de ácido oxálico originario de Taiwán y Corea
    del Sur y por la que se da por concluida la investigación respecto del exportador
    interesado'
