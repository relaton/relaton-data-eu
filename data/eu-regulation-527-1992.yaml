title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 527/92 of 25 February 1992 amending Regulation
    (EEC) No 1873/84 authorizing the offer or disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 527/92 du Conseil du 25 février 1992 modifiant le
    règlement (CEE) n° 1873/84 autorisant l'offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d'avoir fait l'objet de
    pratiques oenologiques non prévues par le règlement (CEE) n° 822/87
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 527/92 DES RATES vom 25. Februar 1992 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 822/87 nicht vorgesehenen önologischen Verfahren waren #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 527/92 af 25. februar 1992 om ændring af
    forordning (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til direkte
    konsum af visse indførte vine, som eventuelt har været underkastet andre ønologiske
    fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 527/92 του Συμβουλίου
    της 25ης Φεβρουαρίου 1992 για την τροποποίηση
    του κανονισμού ( ΕΟΚ ) αριθ. 1873/84 που επιτρέπει
    την προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων δυναμένων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    ( ΕΟΚ ) αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 527/92 DEL CONSIGLIO del 25 febbraio 1992 recante
    modifica del regolamento (CEE) n. 1873/84 che autorizza l'' offerta e la consegna
    per il consumo umano diretto di taluni vini importati che possono essere stati
    sottoposti a pratiche enologiche non previste dal regolamento (CEE) n. 822/87
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 527/92 VAN DE RAAD van 25 februari 1992 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 822/87 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 527/92 DO CONSELHO de 25 de Fevereiro de 1992 que
    altera o Regulamento (CEE) no 1873/84, que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptíveis de terem
    sido objecto de práticas enológicas não previstas no Regulamento (CEE) no 822/87
    #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 527/92 DEL CONSEJO de 25 de febrero de 1992 que modifica
    el Reglamento (CEE) no 1873/84 por el que se autoriza la oferta y la entrega al
    consumo humano directo de determinados vinos importados que pueden haber sido
    sometidos a prácticas enológicas no previstas en el Reglamento (CEE) no 822/87
    #'
