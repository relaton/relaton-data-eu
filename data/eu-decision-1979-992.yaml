title:
- language: en
  script: Latn
  content: '79/992/EEC: Commission Decision of 8 November 1979 authorizing Ireland
    not to apply Community treatment to outer garments and clothing accessories: jerseys,
    pullovers, slip-overs, waistcoats, twinsets, cardigans, bed-jackets and jumpers,
    knitted or crocheted, not elastic or rubberized, of wool, of cotton or of man-made
    textile fibres, falling within subheadings ex 60.05 A of the Common Customs Tariff
    (NIMEXE codes 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) (category 5), originating
    in Taiwan and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/992/CEE: Décision de la Commission, du 8 novembre 1979, autorisant
    l''Irlande à exclure du traitement communautaire les vêtements de dessus et
    accessoires du vêtement: chandails, "pullovers" (avec ou sans manches), "twinsets",
    gilets et vestes de bonneterie non élastique ni caoutchoutée, de laine, de coton
    ou de fibres textiles synthétiques ou artificielles de la sous- position ex 60.05
    A du tarif douanier commun (codes Nimexe: 60.05-01, 27, 28, 29, 30, 33, 36, 37,
    38) (catégorie 5), originaires de T''ai-wan et mis en libre pratique dans les
    autres Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/992/EWG: Entscheidung der Kommission vom 8. November 1979, mit der
    Irland ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberkleidung und Bekleidungszubehör : Pullover,
    Slipover, Twinsets, Westen und Strickjacken, aus Gewirken, aus Wolle, Baumwolle,
    synthetischen oder künstlichen Spinnstoffen (weder gummielastisch noch kautschutiert),
    der Tarifstelle ex 60.05 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-01,
    27, 28, 29, 30, 33, 36, 37, 38) (Kategorie 5) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/992/EØF: Kommissionens beslutning af 8. november 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage yderbeklædningsgenstande
    og tilbehør til beklædningsgenstande : sweatere, pullovere, cardigansæt, veste
    og trøjer af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 60.05 A i den fælles toldtarif (NIMEXE-nummer 60.05-01, 27, 28,
    29, 30, 33, 36, 37, 38 ; kategori 5), har oprindelse i Taiwan og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/992/CEE: Decisione della Commissione, dell''8 novembre 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario indumenti esterni ed accessori
    di abbigliamento: maglie, pullover, slip-over, twinset, giubbotti, giacche e bluse,
    a maglia non elastica né gommata, di lana, di cotone o di fibre sintetiche od
    artificiali della sottovoce ex 60.05 A della tariffa doganale comune (codici Nimexe:
    60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), categoria 5, originari di Taiwan e
    messi in libera pratica negli altri Stati membri (Il testo in lingua inglese è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/992/EEG: Beschikking van de Commissie van 8 november 1979 waarbij Ierland
    wordt gemachtigd bovenkleding en kledingtoebehoren: truien, jumpers, pullovers
    en slipovers, twinsets, vesten en jasjes van niet-elastisch of van niet-gegummeerd
    brei- of haakwerk, van wol, van katoen of van synthetische of van kunstmatige
    textielvezels, van post ex 60.05 A van het gemeenschappelijk douanetarief (NIMEXE-code
    60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) (categorie 5), van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
