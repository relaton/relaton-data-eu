id: EUDecision1978530
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 2 June 1978 authorizing Ireland not to apply Community
    treatment to jerseys, pullovers, slip-overs, twinsets, cardigans, bed-jackets
    and jumpers, knitted or crocheted, not elastic or rubberized, of wool, of cotton
    or of man-made textile fibres, falling within subheading ex 60.05 A (NIMEXE codes
    60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) of the Common Customs Tariff, originating
    in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/530/CEE: Décision de la Commission, du 2 juin 1978, autorisant l''Irlande
    à exclure du traitement communautaire les chandails, "pullovers", "slip-overs",
    "twinsets", gilets et vestes de bonneterie non élastique ni caoutchoutée, de
    laine, de coton, de fibres textiles synthétiques ou artificielles, de la sous-position
    Ex 60.05 A du Tarif douanier commun (codes Nimexe : 60.05- 01, 27, 28, 29, 30,
    33, 36, 37, 38), originaires de Hong-Kong et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. Juni 1978, mit der Irland ermächtigt
    wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Pullover, Slipover, Twinsets, Westen und dergleichen, aus Gewirken
    aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen (weder gummielastisch
    noch kautschutiert) der Tarifnummer ex 60.05 A des Gemeinsamen Zolltarifs (NIMEXE-Kenziffern
    60.05-01; 27; 28; 29; 30; 33; 36; 37; 38) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 2. juni 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere, cardigansæt,
    veste og trøjer, af trikotage, ikke elastisk eller gummeret, af uld, bomuld elle
    syntetiske eller regenererede fibre, som henhører under pos. 60.05 A (NIMEXE-kode
    60.05-01, 27, 28, 29, 30, 33, 36, 37, 38) i den fælles toldtarif, har oprindelse
    i Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 giugno 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario maglie, pullover, slip-over, twinset,
    giubbotti, giacche e bluse a maglia non elastica né gommata, di lana, di cotone
    o di fibre sintetiche o artificiali della voce ex 60.05 A della tariffa doganale
    comune (codice Nimexe 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), originari di
    Hong Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 juni 1978 waarbij Ierland wordt gemachtigd
    truien, jumpers, pull-overs en slip-overs, twinsets, vesten en jasjes van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van wol, van katoen of van synthetische
    of van kunstmatige textielvezels, van post ex 60.05 A van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), van oorsprong
    uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten
  type: main
