    FUER SCHIFFE UNTER DER FLAGGE EINES MITGLIEDSTAATS, MIT AUSNAHME SPANIENS UND
    PORTUGALS, IN DEN GEWAESSERN UNTER DER HOHEITSGEWALT ODER GERICHTSBARKEIT SPANIENS
    ( 1991 )
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3937/90 af 20. december 1990 om fastsættelse
    for 1991 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører en medlemsstats flag, bortset
    fra spansk og portugisisk flag, i de farvande, der henhører under Spaniens højhedsområde
    eller jurisdiktion
  type: main
