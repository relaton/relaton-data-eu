title:
- language: en
  script: Latn
  content: '92/57/EEC: Commission Decision of 27 January 1992 adopting the 1992 plan
    allocating to the Member States resources to be charged to the 1992 budget year
    for the supply of food from intervention stocks to designated organizations for
    distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '92/57/CEE: Décision de la Commission, du 27 janvier 1992, adoptant le
    plan de 1992 portant attribution aux Etats membres de ressources imputables à
    l'' exercice 1992 pour la fourniture de denrées alimentaires provenant des stocks
    d'' intervention à des organisations désignées pour les distribuer aux personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '92/57/EWG: Entscheidung der Kommission vom 27. Januar 1992 zur Annahme
    des Plans für 1992 über die Bewilligung von Mitteln, die den Mitgliedstaaten
    für die Lieferung von Nahrungsmitteln aus Interventionsbeständen an bestimmte
    Einrichtungen zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und
    im Haushaltsjahr 1992 zu verbuchen sind'
  type: main
- language: da
  script: Latn
  content: '92/57/EØF: Kommissionens beslutning af 27. januar 1992 om vedtagelse
    af 1992-planen for tildeling til medlemsstaterne af midler, der skal afholdes
    over 1992-budget, og som skal dække udgifterne til levering af levnedsmidler
    fra interventionslagre til de udpegede organisationer med henblik på uddeling
    til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '92/57/ΕΟΚ: Απόφαση της Επιτροπής της 27ης Ιανουαρίου
    1992 για την έγκριση του προγράμματος 1992 για
    την κατανομή στα κράτη μέλη των πόρων που θα
    καταλογισθούν στο έτος προϋπολογισμού 1992 για
    τη χορήγηση τροφίμων που προέρχονται από τα
    αποθέματα παρέμβασης σε οργανισμούς που έχουν
    ορισθεί για τη διανομή τους στους απόρους της
    Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '92/57/CEE: Decisione della Commissione, del 27 gennaio 1992, che approva
    per il 1992 il piano di ripartizione agli Stati membri delle risorse da imputare
    all'' esercizio finanziario 1992 per la fornitura a determinati organismi di derrate
    alimentari provenienti dalle scorte di intervento e destinate ad essere distribuite
    agli indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '92/57/EEG: Beschikking van de Commissie van 27 januari 1992 tot vaststelling
    van het jaarplan voor 1992 voor de toewijzing aan de Lid-Staten van voor het begrotingsjaar
    1992 te boeken financiële middelen voor de levering van voedsel uit interventievoorraden
    aan organisaties die zijn aangewezen voor de verstrekking ervan aan de meest behoeftigen
    in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '92/57/CEE: Decisão da Comissão, de 27 de Janeiro de 1992, que adopta
    o plano para 1992 que atribui aos Estados-membros recursos a incluir no exercício
    orçamental de 1992 para o fornecimento de géneros alimentícios provenientes
    das existências de intervenção a determinadas organizações para distribuição
    às pessoas mais necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '92/57/CEE: Decisión de la Comisión, de 27 de enero de 1992, por la que
    se adopta el plan para 1992 que establece la asignación a los Estados miembros
    de recursos imputables al ejercicio presupuestario de 1992 para el suministro
    de alimentos procedentes de existencias entre las personas más necesitadas de
    la Comunidad'
  type: main
