id: EURegulation30831976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3083/76 of 16 December 1976 re-establishing
    the levying of the customs duties on petroleum oils and oils obtained from bituminous
    minerals, other than crude; etc. ... light oils for other purposes, falling within
    subheading 27.10 A III, originating in Bahrain to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 apply
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CEE) n° 3083/76 de la Commission, du 16 décembre 1976, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole ou de minéraux bitumineux (autres que les huiles brutes), etc.: huiles
    destinées à d''autres usages, de la sous-position tarifaire 27.10 A III, originaires
    de Bahrein, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3010/75 du Conseil'
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3083/76 der Kommission vom 16. Dezember 1976 zur Wiedereinführung
    des Zollsatzes für Erdöl und Öl aus bituminösen Mineralien, ausgenommen rohe
    Öle, usw., Leichtöle, zu anderer Verwendung, der Tarifstelle 27.10 A III, mit
    Ursprung in Bahrain, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3083/76 af 16. december 1976 om genindførelse
    af opkrævning af toldafgifter for olier udvundet af jordolier eller rå olier
    hidrørende fra bituminøse mineraler etc., lette olier til anden anvendelse under
    underposition 27.10 A III, som har oprindelse i Bahrein og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3083/76 della Commissione, del 16 dicembre 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio o
    di minerali bituminosi (diversi dagli oli greggi), ecc., oli leggeri destinati
    ad altri usi, della sottovoce doganale 27.10 A III, originari del Bahrein, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3083/76 van de Commissie van 16 december 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op aardoliën
    en oliën uit bitumineuze mineralen, andere dan ruwe; enz., lichte oliën, bestemd
    voor ander gebruik, van post 27.10 A III, van oorsprong uit Bahrein ten behoeve
    waarvan bij Verordening (EEG) nr. 3010/75 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
