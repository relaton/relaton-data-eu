type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 982/78 of 16 May 1978 re-establishing the
    levying of customs duties on waste of man-made fibres, not carded, combed or otherwise
    prepared for spinning falling within heading No 56.03, originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 982/78 de la Commission, du 16 mai 1978, portant rétablissement
    de la perception des droits de douane applicables aux déchets de fibres textiles
    synthétiques et artificielles, de la position tarifaire 56.03, originaires de
    la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 982/78 der Kommission vom 16. Mai 1978 zur Wiedereinführung
    des Zollsatzes für Abfälle von synthetischen oder künstlichen Spinnstoffen
    der Tarifnummer 56.03, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 982/78 af 16. maj 1978 om genindførelse
    af opkrævning af toldafgifter for affald af kemofibre, ikke kartet, kæmmet eller
    på anden måde beredt til spinding, under position 56.03, som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 982/78 della Commissione, del 16 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai cascami di fibre tessili
    sintetiche ed artificiali della voce doganale 56.03 originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2706/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 982/78 van de Commissie van 16 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op afval van
    synthetische of van kunstmatige vezels, van post 56.03, van oorsprong uit Joegoslavië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2706/77 van de Raad
  type: main
