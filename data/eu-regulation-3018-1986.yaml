    por los exportadores de Bulgaria, de Polonia, de la República Democrática Alemana,
    de Rumanía y de Checoslovaquia en el marco del procedimiento antidumping relativo
    a las importaciones de motores eléctricos polifásicos normalizados con una potencia
    superior a 0,75 kW hasta 75 kW inclusive, originarios de dichos países
  type: main
