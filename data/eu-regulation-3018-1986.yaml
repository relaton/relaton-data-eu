title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3018/86 of 30 September 1986 repealing the
    Regulation accepting the undertakings given respectively by exporters in Bulgaria,
    Czechoslovakia, the German Democratic Republic, Poland and Romania in connection
    with the anti-dumping procedure concerning imports of standardized multi-phase
    electric motors having an output of more than 0,75 kW but not more than 75 kW
    originating in these countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3018/86 du Conseil du 30 septembre 1986 abrogeant
    le règlement qui porte acceptation des engagements souscrits respectivement par
    les exportateurs de Bulgarie, de Pologne, de la République démocratique allemande,
    de Roumanie et de Tchécoslovaquie dans le cadre de la procédure antidumping
    concernant les importations de moteurs électriques polyphasés normalisés d'
    une puissance de plus de 0,75 à 75 kilowatts inclus originaires de ces pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3018/86 des Rates vom 30. September 1986 zur Aufhebung
    der Verordnung zur Annahme der von den Ausführern in Bulgarien, Polen, der Deutschen
    Demokratischen Republik, Rumänien und der Tschechoslowakei eingegangenen Verpflichtungen
    im Rahmen des Antidumpingverfahrens betreffend Einfuhren von standardisierten
    Mehrphasen-Wechselstrommotoren mit einer Leistung von mehr als 0,75 bis 75 kW
    mit Ursprung in diesen Ländern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3018/86 af 30. september 1986 om ophævelse
    af den forordning, hvorved Rådet har godtaget de tilsagn, der er afgivet af eksportørerne
    i Bulgarien, Polen, Den tyske demokratiske Republik, Rumænien og Tjekkoslovakiet
    i forbindelse med antidumpingproceduren vedrørende importen af standardiserede
    elektriske motorer, flerfasede, med effekt på over 0,75 kW, men højst 75 kW,
    med oprindelse i nævnte lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3018/86 του Συμβουλίου
    της 30ής Σεπτεμβρίου 1986 για την κατάργηση του
    κανονισμού περί αποδοχής των υποχρεώσεων που
    ανέλαβαν οι εξαγωγείς της Βουλγαρίας, Πολωνίας,
    Λαϊκής Δημοκρατίας της Γερμανίας, Ρουμανίας
    και Τσεχοσλοβακίας στα πλαίσια της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές των
    τυποποιημένων πολυφασικών ηλεκτρικών κινητήρων
    ισχύος μεγαλύτερης από 0,75 kW έως και 75 kW, καταγωγής
    των χωρών αυτών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3018/86 del Consiglio del 30 settembre 1986 relativo
    all' abrogazione del regolamento che accetta gli impegni assunti rispettivamente
    dagli esportatori della Bulgaria, della Cecoslovacchia, della Polonia, della Repubblica
    democratica tedesca e della Romania nel quadro della procedura antidumping concernente
    le importazioni di motori elettrici polifase normalizzati di potenza superiore
    a 0,75 kW ed inferiore o pari a 75 kW, originari di detti paesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3018/86 van de Raad van 30 september 1986 houdende
    intrekking van de verordening die aanvaarding behelst van de verbintenissen aangegaan
    onderscheidenlijk door de exporteurs van Bulgarije, de Duitse Democratische Republiek,
    Polen, Roemenië en Tsjechoslowakije, in het kader van de anti-dumpingprocedure
    betreffende de invoer van gestandaardiseerde meerfasige elektromotoren met een
    vermogen van meer dan 0,75 kW tot en met 75 kW, van oorsprong uit deze landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3018/86 do Conselho de 30 de Setembro de 1986 que
    revoga o regulamento relativo à aceitação de compromissos subscritos respectivamente
    pelos exportadores da Bulgária, da Polónia, da República Democrática Alemã,
    da Roménia e da Checoslováquia no âmbito do processo "anti-dumping" relativo
    às importações de motores eléctricos polifásicos normalizados com uma potência
    de mais de 0,75 e até 75 quilowatts, inclusive, originários desses países
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3018/86 del Consejo de 30 de septiembre de 1986 que
