title:
- language: en
  script: Latn
  content: '91/28/EEC: Commission Decision of 19 December 1990 authorizing certain
    Member States to provide for exceptions from certain provisions of Directive 77/93/EEC
    in respect of potatoes for human consumption originating in Turkey (only the German,
    French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/28/CEE: Décision de la Commission du 19 décembre 1990 autorisant
    certains États membres à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour les pommes de terre de consommation
    originaires de Turquie (Les textes en langues allemande, française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 19. Dezember 1990 zur Ermächtigung bestimmter
    Mitgliedstaaten, für Speisekartoffeln mit Ursprung in der Türkei Ausnahmen von
    einigen Vorschriften der Richtlinie 77/93/EWG zuzulassen (Nur der deutsche, der
    französische und der niederländische Text sind verbindlich) (91/28/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 19. december 1990 om bemyndigelse af visse
    medlemsstater til at fastsætte undtagelser fra visse bestemmelser i Rådets direktiv
    77/93/EØF for spisekartofler med oprindelse i Tyrkiet (Kun de tyske, franske
    og nederlandske udgaver er autentiske) (91/28/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/28/ΕΟΚ: Απόφαση της Επιτροπής της 19ης Δεκεμβρίου
    1990 που επιτρέπει σε ορισμένα κράτη μέλη να
    προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ όσον αφορά τις πατάτες για
    ανθρώπινη κατανάλωση καταγωγής Τουρκίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 19 dicembre 1990 che autorizza taluni
    Stati membri a stabilire deroghe, per le patate da consumo originarie della Turchia,
    ad alcune disposizioni della direttiva 77/93/CEE del Consiglio (I testi in lingua
    francese, neerlandese e tedesca sono i soli facenti fede) (91/28/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 19 december 1990 houdende machtiging
    van bepaalde Lid-Staten, om voor consumptieaardappelen van oorsprong uit Turkije,
    afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te
    staan (Slechts de teksten in de Duitse, de Franse en de Nederlandse taal zijn
    authentiek) (91/28/EEG) #'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 19 de Dezembro de 1990 que autoriza determinados
    Estados-membros a estabelecer derrogações a determinadas normas da Directiva
    77/93/CEE em relação à batata de consumo originária da Turquia (Apenas fazem
    fé os textos nas línguas alemã, francesa e neerlandesa) (91/28/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 19 de diciembre de 1990 por la que se autoriza
    a algunos Estados miembros para establecer excepciones a determinadas disposiciones
    de la Directiva 77/93/CEE con respecto a las patatas destinadas al consumo humano
    originarias de Turquía (Los textos en lengua alemana, francesa y neerlandesa
    son los únicos auténticos) (91/28/CEE) #'
