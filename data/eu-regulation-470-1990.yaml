title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 470/90 of 23 February 1990 amending Regulation
    (EEC) No 2316/89 as regards the minimum import price and the countervailing charges
    to be levied where the minimum import price applicable to dried grapes is not
    met
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 470/90 de la Commission du 23 février 1990 modifiant
    le règlement (CEE) n° 2316/89 en ce qui concerne le prix minimal à l'importation
    et les taxes compensatoires à percevoir dans les cas où le prix minimal à l'importation,
    applicable aux raisins secs, n'est pas respecté
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 470/90 DER KOMMISSION vom 23. Februar 1990 zur Aenderung
    der Verordnung (EWG) Nr. 2316/89 hinsichtlich des Mindesteinfuhrpreises fuer getrocknete
    Weintrauben und der bei seiner Unterschreitung zu erhebenden Ausgleichsabgabe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 470/90 af 23. februar 1990 om ændring
    af forordning (EØF) nr. 2316/89 for så vidt angår minimumsimportprisen og de
    udligningsafgifter, der skal opkræves, hvis minimumsimportprisen for tørrede
    druer ikke overholdes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 470/90 της Επιτροπής
    της 23ης Φεβρουαρίου 1990 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αιθ. 2316/89 όσον αφορά την
    ελάχιστη τιμή κατά την εισαγωγή και τις εξισωτικές
    εισφορές που εισπράττονται στην περίπτωση
    κατά την οποία δεν τηρείται η ελάχιστη τιμή
    κατά την εξαγωγή που εφαρμόζεται στις σταφίδες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 470/90 DELLA COMMISSIONE del 23 febbraio 1990 che
    modifica il regolamento (CEE) n. 2316/89 in ordine al prezzo minimo all'importazione
    per le uve secche, nonché alla tassa di compensazione applicabile qualora tale
    prezzo non sia rispettato
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 470/90 VAN DE COMMISSIE van 23 februari 1990 tot
    wijziging van Verordening (EEG) nr. 2316/89 ten aanzien van de minimumprijs bij
    invoer van krenten en rozijnen en van de compenserende heffing bij niet-inachtneming
    van deze prijs
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 470/90 DA COMISSAO de 23 de Fevereiro de 1990 que
    altera o Regulamento (CEE) n* 2316/89 no que diz respeito ao preço minimo à
    importaçao e ao direito de compensaçao a cobrar caso o preço minimo à importaçao,
    aplicavel às uvas secas, nao seja respeitado
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 470/90 DE LA COMISION de 23 de febrero de 1990 que
    modifica el Reglamento (CEE) no 2316/89 por el que se fija el precio minimo a
    la importacion, asi como el gravamen compensatorio que debe percibirse en aquellos
    casos en que el precio minimo a la importacion aplicable a las pasas no haya sido
    respetado
