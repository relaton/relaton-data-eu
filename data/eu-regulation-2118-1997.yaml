title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2118/97 of 28 October 1997 determining the
    extent to which applications lodged in October 1997 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2118/97 DE LA COMMISSION du 28 octobre 1997 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1997 pour certains produits du secteur des oeufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2118/97 DER KOMMISSION vom 28. Oktober 1997 über die
    Festsetzung des Umfangs, in dem die im Oktober 1997 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2118/97 af 28. oktober 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1997 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2118/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
