    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontilupahakemusten hyväksyttävyydestä
    asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96 mukaisesti
  type: main
- language: it
  script: Latn
