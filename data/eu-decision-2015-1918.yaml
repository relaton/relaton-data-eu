    gemäß der Verordnung (EG) Nr. 882/2004 des Europäischen Parlaments und des
    Rates über amtliche Kontrollen zur Überprüfung der Einhaltung des Lebensmittel-
    und Futtermittelrechts sowie der Bestimmungen über Tiergesundheit und Tierschutz
