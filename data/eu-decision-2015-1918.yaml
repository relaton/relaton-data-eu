title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/1918 of 22 October 2015 establishing
    the Administrative Assistance and Cooperation system (‘AAC system’) pursuant
    to Regulation (EC) No 882/2004 of the European Parliament and of the Council on
    official controls performed to ensure the verification of compliance with feed
    and food law, animal health and animal welfare rules (notified under document
    C(2015) 7132)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/1918 de la Commission du 22 octobre 2015
    établissant le système d'assistance et de coopération administratives (ci-après
    «système AAC») en application du règlement (CE) n° 882/2004 du Parlement
    européen et du Conseil relatif aux contrôles officiels effectués pour s'assurer
    de la conformité avec la législation sur les aliments pour animaux et les denrées
    alimentaires et avec les dispositions relatives à la santé animale et au bien-être
    des animaux [notifiée sous le numéro C(2015) 7132]
  type: main
