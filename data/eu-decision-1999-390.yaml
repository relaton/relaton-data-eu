title:
- language: en
  script: Latn
  content: '1999/390/EC: Commission Decision of 11 June 1999 on protective measures
    with regards to contamination by dioxins of certain products of animal origin
    intended for human or animal consumption and amending Decision 1999/363/EC and
    Decision 1999/389/EC (notified under document number C(1999) 1672)'
  type: main
- language: fr
  script: Latn
  content: '1999/390/CE: Décision de la Commission, du 11 juin 1999, concernant des
    mesures de protection contre la contamination par les dioxines de certains produits
    d''origine animale destinés à la consommation humaine ou animale et modifiant
    la décision n° 1999/363/CE et la décision 1999/389/CE [notifiée sous le numéro
    C(1999) 1672]'
  type: main
- language: de
  script: Latn
