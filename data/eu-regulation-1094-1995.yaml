title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1094/95 of 15 May 1995 amending Regulation
    (EEC) No 210/69 on communications between Member States and the Commission with
    regard to milk and milk products and Regulation (EEC) No 2729/81 laying down special
    rules implementing the system of import and export licences and the advance fixing
    of refunds in respect of milk and milk products with regard to certain transitional
    measures relating to the implementation of the Uruguay Round Agreement on Agriculture
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1094/95 de la Commission du 15 mai 1995 modifiant le
    règlement (CEE) n° 210/69 relatif aux communications entre les États membres
    et la Commission dans le secteur du lait et des produits laitiers et le règlement
    (CEE) n° 2729/81 portant modalités d'application du régime des certificats
    d'importation et d'exportation et au régime de fixation à l'avance des restitutions
    dans le secteur du lait et des produits laitiers en ce qui concerne certaines
    mesures transitoires relatives à la mise en oeuvre de l'accord agricole du cycle
    d'Uruguay
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1094/95 DER KOMMISSION vom 15. Mai 1995 zur Änderung
    der Verordnung (EWG) Nr. 210/69 über die gegenseitigen Mitteilungen der Mitgliedstaaten
    und der Kommission im Sektor Milch und Milcherzeugnisse und der Verordnung (EWG)
    Nr. 2729/81 über besondere Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen
    sowie für die Vorausfestsetzung der Erstattungen für Milch und Milcherzeugnisse
    hinsichtlich bestimmter Übergangsmaßnahmen zur Anwendung des im Rahmen der Uruguay-Runde
    über die Landwirtschaft getroffenen Übereinkommens
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1094/95 af 15. maj 1995 om ændring af
    forordning (EØF) nr. 210/69 om medlemsstaternes og Kommissionens gensidige meddelelser
    inden for sektoren for mælk og mejeriprodukter, og om ændring af forordning
    (EØF) nr. 2729/81 om de særlige gennemførelsesbestemmelser for ordningen med
    import- og eksportlicenser og ordningen med forudfastsættelse af restitutioner
    for mælk og mejeriprodukter, for så vidt angår overgangsbestemmelser for gennemførelsen
    af landbrugsaftalen i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1094/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 15ης Μαΐου 1995 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 210/69 περί των ανακοινώσεων μεταξύ
    των κρατών μελών και της Επιτροπής στον τομέα
    του γάλακτος και γαλακτοκομικών προϊόντων
    και του κανονισμού (ΕΟΚ) αριθ. 2729/81 περί λεπτομερειών
    εφαρμογής του καθεστώτος των πιστοποιητικών
    εισαγωγής και εξαγωγής και του καθεστώτος
    προκαθορισμού των επιστροφών στον τομέα του
    γάλακτος και γαλακτοκομικών προϊόντων όσον
    αφορά ορισμένα μεταβατικά μέτρα σχετικά με
    την εφαρμογή της γεωργικής συμφωνίας του Γύρου
    της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1094/95, annettu 15 päivänä toukokuuta 1995,
    maito- ja maitotuotealaa koskevista jäsenvaltioiden ja komission välisistä
    tiedonannoista annetun asetuksen (ETY) N:o 210/69 sekä maito- ja maitotuotealan
    tuonti- ja vientitodistusten järjestelmän ja tukien ennakkovahvistusjärjestelmän
    soveltamista koskevista erityisistä yksityiskohtaisista säännöistä annetun
    asetuksen (ETY) N:o 2729/81 muuttamisesta tiettyjen Uruguayn kierroksen maataloussopimuksen
    täytäntöönpanoon liittyvien siirtymätoimenpiteiden osalta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1094/95 DELLA COMMISSIONE del 15 maggio 1995 che modifica
    il regolamento (CEE) n. 210/69 relativo alle comunicazioni tra gli Stati membri
    e la Commissione nel settore del latte e dei prodotti lattiero-caseari e il regolamento
    (CEE) n. 2729/81 che stabilisce modalità particolari di applicazione del regime
    dei titoli di importazione e di esportazione e del regime di fissazione anticipata
    delle restituzioni nel settore del latte e dei prodotti lattiero-caseari, per
    quanto riguarda alcune misure transitorie relative all' attuazione dell' accordo
    agricolo concluso nel quadro dell' Uruguay Round
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1094/95 VAN DE COMMISSIE van 15 mei 1995 tot wijziging,
    met betrekking tot bepaalde overgangsmaatregelen inzake de tenuitvoerlegging van
    de landbouwovereenkomst in het kader van de Uruguay-Ronde, van Verordening (EEG)
    nr. 210/69 betreffende de wederzijdse mededeling van gegevens door de Lid-Staten
    en de Commissie in de sector melk en zuivelprodukten en Verordening (EEG) nr.
    2729/81 houdende bijzondere uitvoeringsbepalingen inzake de invoer- en uitvoercertificaten
    en inzake de vaststelling vooraf van de restituties in de sector melk en zuivelprodukten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1094/95 DA COMISSÃO de 15 de Maio de 1995 que altera
    o Regulamento (CEE) nº 210/69 relativo às comunicações entre os Estados-membros
    e a Comissão no sector do leite e dos produtos lácteos e o Regulamento (CEE)
    nº 2729/81 relativo às modalidades especiais de aplicação do regime de certificados
    de importação e de exportação e do regime de fixação prévia das restituições
    no sector do leite e dos produtos lácteos, no que se refere a certas medidas
    transitórias relativas à execução do Acordo agrícola do « Uruguay Round
    »
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1094/95 DE LA COMISIÓN de 15 de mayo de 1995 por el
    que se modifica el Reglamento (CEE) nº 210/69 relativo a las comunicaciones entre
    los Estados miembros y la Comisión en el sector de la leche y de los productos
    lácteos, y el Reglamento (CEE) nº 2729/81 por el que se establecen modalidades
    particulares de aplicación del régimen de los certificados de importación y
    de exportación y del régimen de determinación por anticipado de las restituciones
    en el sector de la leche y de los productos lácteos, por lo que respecta a determinadas
    medidas transitorias relativas a la aplicación del Acuerdo de agricultura de
    la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1094/95 av den 15 maj 1995 om ändring
    av förordning (EEG) nr 210/69 om meddelanden mellan medlemsstaterna och kommissionen
    med avseende på mjölk och mjölkprodukter och av förordning (EEG) nr 2729/81
    om särskilda tillämpningsföreskrifter för systemet med import- och exportlicenser
    och förutfastställelse av exportbidrag för mjölk och mjölkprodukter i fråga
    om vissa övergångsåtgärder för genomförandet av Uruguayrundans jordbruksavtal
  type: main
