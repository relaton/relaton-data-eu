title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3220/83 of 15 November 1983 amending Regulation
    (EEC) No 198/83 on fishing activities in waters under the sovereignty or jurisdiction
    of the Member States, adopted provisionally pending the fixing of TACs and quotas
    for 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3220/83 du Conseil du 15 novembre 1983 modifiant le
    règlement (CEE) no 198/83 relatif aux activités de pêche dans les eaux relevant
    de la souveraineté ou de la juridiction des États membres, et pris à titre
    provisoire dans l' attente de la fixation des totaux admissibles des captures
    et quotas pour l' année 1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3220/83 des Rates vom 15. November 1983 zur Änderung
    der Verordnung (EWG) Nr. 198/83 über die Fischerei in den der Hoheitsgewalt oder
    Gerichtsbarkeit der Mitgliedstaaten unterstehenden Gewässern mit vorläufiger
    Geltungsdauer bis zur Festlegung der zulässigen Gesamtfangmengen und der Quoten
    für 1983
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3220/83 af 15. november 1983 om ændring
    af forordning (EØF) nr. 198/83 om fiskeri i de farvande, der hører under medlemsstaternes
    højhedsområde eller jurisdiktion, truffet som midlertidig ordning, indtil TAC
    og kvoterne for 1983 er fastsat
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3220/83 του Συμβουλίου
    της 15ης Νοεμβρίου 1983 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 198/83 σχετικά με τις αλιευτικές δραστηριότητες
    στα ύδατα που υπάγονται στην κυριαρχία ή τη
    δικαιοδοσία των κρατών μελών, ο οποίος εκδίδεται
    προσωρινά αναμένοντας τον καθορισμό των TAC
    και των ποσοστώσεων για το έτος 1983
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3220/83 del Consiglio del 15 novembre 1983 che modifica
    il regolamento (CEE) n. 198/83 relativo alle attività di pesca esercitate nelle
    acque soggette alla sovranità o alla giurisdizione degli Stati membri e adottato
    a titolo provvisorio in attesa della fissazione dei TAC e dei contingenti per
    l' anno 1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3220/83 van de Raad van 15 november 1983 tot wijziging
    van Verordening (EEG) nr. 198/83 betreffende een tijdelijke regeling voor de visserijactiviteiten
    in de onder de soevereiniteit of de jurisdictie van de Lid-Staten vallende wateren,
    in afwachting van de vaststelling van de TAC' s en quota voor 1983
