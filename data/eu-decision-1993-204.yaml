title:
- language: en
  script: Latn
  content: '93/204/EEC: Council Decision of 5 April 1993 authorizing the United Kingdom
    to apply a measure derogating from Articles 5 (8) and 21 (1) (a) of the Sixth
    Council Directive 77/388/EEC on the harmonization of the laws of the Member States
    relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '93/204/CEE: Décision du Conseil, du 5 avril 1993, autorisant le Royaume-
    Uni à appliquer une mesure dérogatoire à l'' article 5 paragraphe 8 et à l''
    article 21 paragraphe 1 point a) de la sixieme directive 77/388/CEE en matière
    d'' harmonisation des législations des Etats membres relatives aux taxes sur
    le chiffre d'' affaires'
  type: main
- language: de
  script: Latn
  content: '93/204/EWG: Entscheidung des Rates vom 5. April 1993 zur Ermächtigung
    des Vereinigten Königreichs zur Anwendung einer abweichenden Maßnahme von Artikel
    5 Absatz 8 und Artikel 21 Absatz 1 Buchstabe a) der Sechsten Richtlinie 77/388/EWG
    zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern'
  type: main
- language: da
  script: Latn
  content: '93/204/EØF: Rådets beslutning af 5. april 1993 om bemyndigelse af Det
    Forenede Kongerige til at anvende en foranstaltning, der fraviger bestemmelserne
    i artikel 5, stk. 8, og artikel 21, stk. 1, litra a), i sjette direktiv (77/388/EØF)
    om harmonisering af medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 5ης Απριλίου
    1993 που επιτρέπει στο Ηνωμένο Βασίλειο να εφαρμόσει
    μέτρο κατά παρέκκλιση του άρθρου 5 παράγραφος
    8 και του άρθρου 21 παράγραφος 1 στοιχείο α) της
    έκτης οδηγίας 77/388/ΕΟΚ για την εναρμόνιση των
    νομοθεσιών των κρατών μελών με τους φόρους
    κύκλου εργασιών
  type: main
- language: it
  script: Latn
  content: '93/204/CEE: Decisione del Consiglio, del 5 aprile 1993, che autorizza
    il Regno Unito ad applicare una misura di deroga all'' articolo 5, paragrafo 8
    e all'' articolo 21, paragrafo 1, lettera a) della sesta direttiva 77/388/CEE
    in materia di armonizzazione delle legislazioni degli Stati membri relative alle
    imposte sulla cifra d'' affari'
  type: main
- language: nl
  script: Latn
  content: '93/204/EEG: Beschikking van de Raad van 5 april 1993 waarbij het Verenigd
    Koninkrijk wordt gemachtigd een maatregel toe te passen die afwijkt van artikel
    5, lid 8, en van artikel 21, lid 1, onder a), van de Zesde Richtlijn (77/388/EEG)
    betreffende de harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '93/204/CEE: Decisão do Conselho, de 5 de Abril de 1993, que autoriza
    o Reino Unido a aplicar uma medida derrogatória ao n° 8 do artigo 5° e ao n°
    1, alínea a), do artigo 21° da Sexta Directiva 77/388/CEE, relativa à harmonização
    das legislações dos Estados-membros respeitantes aos impostos sobre o volume
    de negócios'
  type: main
- language: es
  script: Latn
  content: '93/204/CEE: Decisión del Consejo, de 5 de abril de 1993, por la que se
    autoriza al Reino Unido a aplicar una excepción al apartado 8 del artículo 5
    y a la letra a) del apartado 1 del artículo 21 de la sexta Directiva (77/388/CEE)
    del Consejo en materia de armonización de las legislaciones de los Estados miembros
    relativas a los impuestos sobre el volumen de negocios'
  type: main
