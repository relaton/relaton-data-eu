type: standard
title:
- language: en
  script: Latn
  content: '2010/391/: Commission Decision of 8 July 2010 amending the Annexes to
    Decision 93/52/EEC as regards the recognition of Lithuania and the region of Molise
    in Italy as officially free of brucellosis ( B. melitensis ) and amending the
    Annexes to Decision 2003/467/EC as regards the declaration of certain administrative
    regions of Italy as officially free of bovine tuberculosis, bovine brucellosis
    and enzootic-bovine-leukosis (notified under document C(2010) 4592)'
  type: main
- language: fr
  script: Latn
  content: '2010/391/: Décision de la Commission du 8 juillet 2010 modifiant les
    annexes de la décision 93/52/CEE en ce qui concerne la reconnaissance de la Lituanie
    et de la région de Molise (Italie) en tant qu’État membre et région officiellement
    indemnes de brucellose ( B. melitensis ), et modifiant les annexes de la décision
    2003/467/CE en ce qui concerne certaines régions administratives d’Italie officiellement
    déclarées indemnes de tuberculose bovine, de brucellose bovine et de leucose
    bovine enzootique [notifiée sous le numéro C(2010) 4592]'
  type: main
- language: de
  script: Latn
  content: '2010/391/: Beschluss der Kommission vom 8. Juli 2010 zur Änderung der
    Anhänge der Entscheidung 93/52/EWG hinsichtlich der Anerkennung Litauens und
    der italienischen Region Molise als amtlich frei von Brucellose ( B. melitensis
    ) sowie zur Änderung der Anhänge der Entscheidung 2003/467/EG hinsichtlich der
    Anerkennung bestimmter italienischer Verwaltungsregionen als amtlich frei von
    Rindertuberkulose, Rinderbrucellose und enzootischer Rinderleukose (Bekannt gegeben
    unter Aktenzeichen K(2010) 4592)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/391/ЕС: Решение на Комисията от 8 юли 2010
    година за изменение на приложенията към Решение
    93/52/ЕИО по отношение на признаването на Литва
    и регион Molise в Италия като официално свободни
    от бруцелоза ( B. melitensis ) и за изменение на приложенията
    към Решение 2003/467/ЕО по отношение на обявяването
    на някои административни региони в Италия
    за официално свободни от туберкулоза по говедата,
    бруцелоза по говедата и ензоотична левкоза
    по говедата (нотифицирано под номер C(2010) 4592)'
  type: main
- language: cs
  script: Latn
  content: '2010/391/: Rozhodnutí Komise ze dne 8. července 2010 , kterým se mění
    přílohy rozhodnutí 93/52/EHS, pokud jde o uznání Litvy a oblasti Molise v
    Itálii za úředně prosté brucelózy ( B. melitensis ), a kterým se mění
    přílohy rozhodnutí 2003/467/ES, pokud jde o prohlášení některých správních
    oblastí Itálie za úředně prosté tuberkulózy skotu, brucelózy skotu a enzootické
    leukózy skotu (oznámeno pod číslem K(2010) 4592)'
  type: main
- language: da
  script: Latn
  content: '2010/391/: Kommissionens afgørelse af 8. juli 2010 om ændring af bilagene
    til beslutning 93/52/EØF for så vidt angår anerkendelse af Litauen og regionen
    Molise i Italien som officielt frie for brucellose ( B. melitensis ) og om ændring
    af bilagene til beslutning 2003/467/EF for så vidt angår erklæringen om, at
    visse administrative regioner i Italien er officielt frie for kvægtuberkulose,
    kvægbrucellose og enzootisk kvægleukose (meddelt under nummer K(2010) 4592)'
  type: main
- language: el
  script: Grek
  content: '2010/391/: Απόφαση της Επιτροπής, της 8ης Ιουλίου
    2010 , για την τροποποίηση των παραρτημάτων της
    απόφασης 93/52/ΕΟΚ όσον αφορά την αναγνώριση
    της Λιθουανίας και της περιφέρειας Molise της
    Ιταλίας ως επίσημα απαλλαγμένων από τη βρουκέλλωση
    ( Br. melitensis ) και για την τροποποίηση των παραρτημάτων
    της απόφασης 2003/467/ΕΚ όσον αφορά την κήρυξη
    ορισμένων διοικητικών περιφερειών της Ιταλίας
    ως επίσημα απαλλαγμένων από τη φυματίωση, τη
    βρουκέλλωση και την ενζωοτική λεύκωση των
    βοοειδών [κοινοποιηθείσα υπό τον αριθμό Ε(2010)
    4592]'
  type: main
- language: et
  script: Latn
  content: '2010/391/: Komisjoni otsus, 8. juuli 2010 , millega muudetakse otsuse
    93/52/EMÜ lisasid seoses Leedu ja Itaalia Molise maakonna ametlikult brutselloosivabaks
    ( B. melitensis ) tunnistamisega ning otsuse 2003/467/EÜ lisasid seoses teatavate
    Itaalia halduspiirkondade ametlikult veiste tuberkuloosi, veiste brutselloosi
    ja veiste ensootilise leukoosi vabaks tunnistamisega (teatavaks tehtud numbri
    K(2010) 4592 all)'
  type: main
- language: fi
  script: Latn
  content: '2010/391/: Komission päätös, annettu 8 päivänä heinäkuuta 2010
    , päätöksen 93/52/ETY liitteiden muuttamisesta siltä osin kuin kyse on Liettuan
    ja Italiassa olevan Molisen alueen tunnustamisesta virallisesti vapaiksi luomistaudista
    ( B. melitensis ) sekä päätöksen 2003/467/EY liitteiden muuttamisesta siltä
    osin kuin kyse on tiettyjen Italian hallintoalueiden julistamisesta virallisesti
    vapaiksi nautojen tuberkuloosista, nautojen luomistaudista ja naudan tarttuvasta
    leukoosista (tiedoksiannettu numerolla K(2010) 4592)'
  type: main
- language: hr
  script: Latn
  content: '2010/391/EU: Odluka Komisije od 8. srpnja 2010. o izmjeni priloga Odluci
    93/52/EEZ u pogledu priznavanja Litve i regije Molise u Italiji kao službeno
    slobodnih od bruceloze ( B. melitensis ) i o izmjeni priloga Odluci 2003/467/EZ
    u pogledu proglašavanja određenih administrativnih regija Italije kao službeno
    slobodnih od tuberkuloze goveda, bruceloze goveda i enzootske leukoze goveda (priopćena
    pod brojem dokumenta C(2010) 4592)'
  type: main
- language: hu
  script: Latn
  content: '2010/391/: A Bizottság határozata ( 2010. július 8. ) Litvánia és
    az olaszországi Molise régió hivatalos brucellózistól (B. melitensis) mentessé
    nyilvánítása tekintetében a 93/52/EGK határozat mellékleteinek módosításáról,
    valamint Olaszország egyes közigazgatási régiói számára a szarvasmarhák
    tuberkulózisától, brucellózisától és enzootikus leukózisától mentes
    státus hivatalos megállapítása tekintetében a 2003/467/EK határozat mellékleteinek
    módosításáról (az értesítés a C(2010) 4592. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2010/391/: Decisione della Commissione, dell’ 8 luglio 2010 , recante
    modifica degli allegati della decisione 93/52/CEE per quanto riguarda il riconoscimento
    della qualifica di ufficialmente indenne da brucellosi ( B. melitensis ) alla
    Lituania e alla Regione italiana Molise e recante modifica degli allegati della
    decisione 2003/467/CE per quanto riguarda il riconoscimento della qualifica di
    ufficialmente indenni da tubercolosi bovina, brucellosi bovina e leucosi bovina
    enzootica di alcune regioni amministrative italiane [notificata con il numero
    C(2010) 4592]'
  type: main
- language: lv
  script: Latn
  content: '2010/391/: Komisijas Lēmums ( 2010. gada 8. jūlijs ), ar ko groza Lēmuma
    93/52/EEK pielikumus attiecībā uz Lietuvas, kā arī Molizes reģiona Itālijā
    atzīšanu par oficiāli brīvu no brucelozes ( B. melitensis ) un ar ko groza
    Lēmuma 2003/467/EK pielikumus attiecībā uz noteiktu Itālijas administratīvo
    reģionu atzīšanu par oficiāli brīviem no govju tuberkulozes, liellopu brucelozes
    un govju enzootiskās leikozes (izziņots ar dokumenta numuru C(2010) 4592)'
  type: main
- language: lt
  script: Latn
  content: '2010/391/: 2010 m. liepos 8 d. Komisijos sprendimas, kuriuo dėl pripažinimo,
    kad Lietuvoje ir Italijos Molizės regione oficialiai nenustatyta bruceliozės
    ( B. melitensis ), iš dalies keičiami Sprendimo 93/52/EEB priedai ir kuriuo
    dėl paskelbimo, kad tam tikruose Italijos administraciniuose regionuose oficialiai
    nenustatyta galvijų tuberkuliozės, bruceliozės ir enzootinės galvijų leukozės,
    iš dalies keičiami Sprendimo 2003/467/EB priedai (pranešta dokumentu Nr. C(2010)
    4592)'
  type: main
- language: mt
  script: Latn
  content: '2010/391/: Deċiżjoni tal-Kummissjoni tat- 8 ta’ Lulju 2010 li temenda
    l-Annessi tad-Deċiżjoni 93/52/KEE fir-rigward tar-rikonoxximent tal-Litwanja
    u r-reġjun tal-Molise fl-Italja bħala uffiċjalment ħielsa mill-bruċellosi
    ( B. melitensis ) u li temenda l-Annessi tad-Deċiżjoni 2003/467/KE fir-rigward
    tad-dikjarazzjoni ta’ ċerti reġjuni amministrattivi tal-Italja bħala uffiċjalment
    ħielsa mit-tuberkolosi bovina, mill-bruċellosi bovina u l-lewkosi bovina enzootika
    (notifikata bid-dokument numru C(2010) 4592)'
  type: main
- language: nl
  script: Latn
  content: '2010/391/: Besluit van de Commissie van 8 juli 2010 tot wijziging van
    de bijlagen bij Beschikking 93/52/EG wat betreft de erkenning dat Litouwen en
    de regio Molise in Italië officieel vrij zijn van brucellose ( B. melitensis
    ) en tot wijziging van de bijlagen bij Beschikking 2003/467/EG wat betreft de
    verklaring dat bepaalde administratieve regio’s in Italië officieel vrij zijn
    van rundertuberculose, runderbrucellose en enzoötische boviene leukose (Kennisgeving
    geschied onder nummer C(2010) 4592)'
  type: main
- language: pl
  script: Latn
  content: '2010/391/: Decyzja Komisji z dnia 8 lipca 2010 r. zmieniająca załączniki
    do decyzji 93/52/EWG w odniesieniu do uznania Litwy i regionu Molise we Włoszech
    za oficjalnie wolne od brucelozy ( B. melitensis ) oraz zmieniająca załączniki
    do decyzji 2003/467/WE w odniesieniu do uznania niektórych regionów administracyjnych
    Włoch za oficjalnie wolne od gruźlicy bydła, brucelozy bydła i enzootycznej
    białaczki bydła (notyfikowana jako dokument nr C(2010) 4592)'
  type: main
- language: pt
  script: Latn
  content: '2010/391/: Decisão da Comissão, de 8 de Julho de 2010 , que altera os
    anexos da Decisão 93/52/CEE, no que se refere ao reconhecimento da Lituânia
    e da região de Molise em Itália como oficialmente indemnes de brucelose ( B.
    melitensis ), e que altera os anexos da Decisão 2003/467/CE, no que se refere
    à declaração de determinadas regiões administrativas de Itália como oficialmente
    indemnes de tuberculose bovina, de brucelose bovina e de leucose bovina enzoótica
    [notificada com o número C(2010) 4592]'
  type: main
- language: ro
  script: Latn
  content: '2010/391/: Decizia Comisiei din 8 iulie 2010 de modificare a anexelor
    la Decizia 93/52/CEE în ceea ce privește recunoașterea Lituaniei și a regiunii
    Molise din Italia drept oficial indemne de bruceloză ( B. melitensis ) și de
    modificare a anexelor la Decizia 2003/467/CE în ceea ce privește declarația
    potrivit căreia anumite regiuni administrative din Italia sunt oficial indemne
    de tuberculoză bovină, bruceloză bovină și leucoză enzootică bovină [notificată
    cu numărul C(2010) 4592]'
  type: main
- language: sk
  script: Latn
  content: '2010/391/: Rozhodnutie Komisie z 8. júla 2010 , ktorým sa menia a dopĺňajú
    prílohy k rozhodnutiu 93/52/EHS, pokiaľ ide o úradné uznanie Litvy a regiónu
    Molise v Taliansku za oblasti bez výskytu brucelózy ( B. melitensis ), a ktorým
    sa menia a dopĺňajú prílohy k rozhodnutiu 2003/467/ES, pokiaľ ide o úradné
    vyhlásenie určitých správnych regiónov Talianska za oblasti bez výskytu
    tuberkulózy hovädzieho dobytka, brucelózy hovädzieho dobytka a enzootickej
    leukózy hovädzieho dobytka [oznámené pod číslom K(2010) 4592]'
  type: main
- language: sl
  script: Latn
  content: '2010/391/: Sklep Komisije z dne 8. julija 2010 o spremembi prilog k Odločbi
    93/52/EGS glede priznanja Litve in dežele Molise v Italiji kot uradno prostih
    bruceloze ( B. melitensis ) ter spremembi prilog k Odločbi 2003/467/ES glede
    priznanja nekaterih upravnih regij Italije kot uradno prostih goveje tuberkuloze,
    goveje bruceloze in enzootske goveje levkoze (notificirano pod dokumentarno številko
    C(2010) 4592)'
  type: main
- language: es
  script: Latn
  content: '2010/391/: Decisión de la Comisión, de 8 de julio de 2010 , por la que
    se modifican los anexos de la Decisión 93/52/CEE en lo que respecta al reconocimiento
    de Lituania y la región italiana de Molise como oficialmente indemnes de brucelosis
    (Brucella melitensis) , así como los anexos de la Decisión 2003/467/CE en lo
    que respecta a la declaración de determinadas regiones administrativas de Italia
    como oficialmente indemnes de tuberculosis bovina, brucelosis bovina y leucosis
    bovina enzoótica [notificada con el número C(2010) 4592]'
  type: main
- language: sv
  script: Latn
  content: '2010/391/: Kommissionens beslut av den 8 juli 2010 om ändring av bilagorna
    till beslut 93/52/EEG vad gäller erkännandet av att Litauen och regionen Molise
    i Italien är officiellt fria från brucellos ( B. melitensis ) och om ändring
    av bilagorna till beslut 2003/467/EG vad gäller fastställandet av att vissa
    administrativa regioner i Italien är officiellt fria från bovin tuberkulos,
    bovin brucellos och enzootisk bovin leukos [delgivet med nr K(2010) 4592]'
