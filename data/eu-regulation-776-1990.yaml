title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 776/90 of 29 March 1990 laying down certain
    additional rules for the application of the supplementary trade mechanism to fruit
    and vegetables as regards tomatoes, lettuce, broad-leaf endives, carrots, artichokes,
    table grapes, melons and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 776/90 de la Commission du 29 mars 1990 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges dans le secteur des fruits et légumes en ce qui concerne les tomates,
    les laitues, les chicorées scaroles, les carottes, les artichauts, les raisins
    de table, les melons et les fraises
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 776/90 DER KOMMISSION vom 29. Maerz 1990 zur Festsetzung
    zusaetzlicher Bestimmungen zur Anwendung des ergaenzenden Handelsmechanismus im
    Sektor Obst und Gemuese hinsichtlich Tomaten, Salat, Endivie Eskariol, Karotten,
    Artischocken, Tafeltrauben, Melonen und Erdbeeren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 776/90 af 29. marts 1990 om fastsættelse
    af visse yderligere gennemførelsesbestemmelser for den supplerende mekanisme
    for samhandel i sektoren for frugt og grønsager, for så vidt angår tomater,
    salat, bredbladet endivie, gulerødder, artiskokker, spisedruer, meloner og jordbær
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 776/90 της Επιτροπής
    της 29ης Μαρτίου 1990 περί καθορισμού ορισμένων
    προσθέτων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών όσον αφορά
    τις τομάτες, τα μαρούλια, τις σκαρόλες, τα καρότα,
    τις αγκινάρες, τα επιτραπέζια σταφύλια, τα
    πεπόνια και τις φράουλες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 776/90 DELLA COMMISSIONE del 29 marzo 1990 recante
    fissazione di modalità complementari di applicazione del meccanismo complementare
    applicabile agli scambi nel settore degli ortofrutticoli per quanto riguarda i
    pomodori, le lattughe, le cicorie scarole, le carote, i carciofi, le uve da tavola,
    i meloni e le fragole
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 776/90 VAN DE COMMISSIE van 29 maart 1990 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer in de sector groenten en fruit, ten aanzien van tomaten, sla,
    andijvie, wortelen, artisjokken, tafeldruiven, meloenen en aardbeien
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 776/90 DA COMISSAO de 29 de Março de 1990 que fixa
    determinadas regras complementares para execuçao do mecanismo complementar aplicavel
    às trocas comerciais no sector dos frutos e produtos horticolas, no que se refere
    aos tomates, alfaces, chicorias escarolas, cenouras, alcachofras, uvas de mesa,
    meloes e morangos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 776/90 DE LA COMISION de 29 de marzo de 1990 por el
    que se establecen determinadas disposiciones adicionales de aplicacion del mecanismo
    complementario aplicable a los intercambios en el sector de las frutas y hortalizas
    en lo que respecta a los tomates, las lechugas, las escarolas de hoja lisa, las
    zanahorias, las alcachofas, las uvas de mesa, los melones y las fresas
