    von im Besitz der französischen Interventionsstelle befindlichem Brotweichweizen
    auf 2 650 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1794/1999 af 13. august 1999 om ændring
