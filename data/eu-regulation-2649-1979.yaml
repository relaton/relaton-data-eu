  content: Commission Regulation (EEC) No 2649/79 of 29 November 1979 amending Regulations
    (EEC) No 683/77 and (EEC) No 571/78 to extend the system for advance fixing of
    export refunds to cover pure-bred breeding animals of the bovine species
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2649/79 de la Commission, du 29 novembre 1979, modifiant
    les règlements (CEE) n° 683/77 et (CEE) n° 571/78 en vue d' étendre le bénéfice
    du régime de la fixation à l' avance des restitutions à l' exportation aux
    animaux de l' espèce bovine reproducteurs de race pure
  type: main
- language: de
  script: Latn
