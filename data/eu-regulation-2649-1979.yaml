    Regelung über die Vorausfestsetzung der Ausfuhrerstattungen auf reinrassige Zuchtrinder
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2649/79 af 29. november 1979 om ændring
