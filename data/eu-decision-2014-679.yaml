title:
- language: en
  script: Latn
  content: '2014/679/EU: Commission Implementing Decision of 25 September 2014 amending
    Implementing Decision 2012/270/EU as regards its period of application and as
    regards the movement to packing facilities of potato tubers originating in areas
    demarcated in order to prevent the spread within the Union of Epitrix cucumeris
    (Harris), Epitrix similaris (Gentner), Epitrix subcrinita (Lec.) and Epitrix tuberis
    (Gentner) (notified under document C(2014) 6731)'
  type: main
- language: fr
  script: Latn
  content: '2014/679/UE: Décision d''exécution de la Commission du 25 septembre
    2014 modifiant la décision d''exécution 2012/270/UE en ce qui concerne sa durée
    d''application et le déplacement vers les installations de conditionnement des
    tubercules de pommes de terre originaires de zones délimitées afin de prévenir
    la propagation dans l''Union d'' Epitrix cucumeris (Harris), d'' Epitrix similaris
    (Gentner), d'' Epitrix subcrinita (Lec.) et d'' Epitrix tuberis (Gentner) [notifiée
    sous le numéro C(2014) 6731]'
  type: main
- language: de
  script: Latn
  content: '2014/679/EU: Durchführungsbeschluss der Kommission vom 25. September
