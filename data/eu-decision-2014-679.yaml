    Gebieten zu Verpackungsanlagen zwecks Verhütung der Ausbreitung von Epitrix cucumeris
    (Harris), Epitrix similaris (Gentner), Epitrix subcrinita (Lec.) und Epitrix tuberis
    (Gentner) innerhalb der Union (Bekanntgegeben unter Aktenzeichen C(2014) 6731)'
