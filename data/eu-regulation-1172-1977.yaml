title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1172/77 of 1 June 1977 extending the application
    of Regulation (EEC) No 194/77 laying down certain measures for the conservation
    and management of fishery resources applicable to vessels flying the flag of Poland,
    the GDR or the USSR
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1172/77 du Conseil, du 1er juin 1977, prorogeant l'application
    du règlement (CEE) n° 194/77 fixant certaines mesures intérimaires de conservation
    et de gestion des ressources de pêche applicables aux navires battant pavillon
    de la Pologne, de la République démocratique allemande et de l'Union des républiques
    socialistes soviétiques
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1172/77 des Rates vom 1. Juni 1977 zur Verlängerung
    der Geltungsdauer der Verordnung (EWG) Nr. 194/77 zur Festlegung bestimmter Übergangsmaßnahmen
    zur Erhaltung und Bewirtschaftung der Fischereiressourcen gegenüber Schiffen,
    die die Flagge Polens, der DDR und der UdSSR führen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1172/77 af 1. juni 1977 om forlængelse af
    anvendelsen af forordning (EØF) nr. 194/77 om de midlertidige foranstaltninger
    til bevarelse og regulering af fiskeressourcerne, som skal finde anvendelse på
    fartøjer, der fører Polens, DDR's og USSR's flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1172/77 del Consiglio, del 1 giugno 1977, che proroga
    l'applicazione del regolamento (CEE) n. 194/77 che fissa alcune misure interinali
    di conservazione e di gestione delle risorse ittiche applicabili alle navi battenti
    bandiera della Polonia, della RDT e dell'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1172/77 van de Raad van 1 juni 1977 houdende verlenging
    van de toepassing van Verordening (EEG) nr. 194/77 tot vaststelling van bepaalde
    overgangsmaatregelen voor de instandhouding en het beheer van de visbestanden,
    die van toepassing zijn op vaartuigen die de vlag van Polen, van de DDR en van
    de USSR voeren
  type: main
