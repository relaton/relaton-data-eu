title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 353/79 of 5 February 1979 laying down the conditions
    for coupage and wine making in the free zones on Community territory for wine
    products originating in third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 353/79 du Conseil, du 5 février 1979, établissant
    les conditions de coupage et de vinification dans les zones franches sur le territoire
    géographique de la Communauté pour les produits du secteur du vin qui sont originaires
    des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 353/79 des Rates vom 5. Februar 1979 zur Festlegung
    der Bedingungen für den Verschnitt und die Verarbeitung von Erzeugnissen des
    Weinsektors mit Ursprung in Drittländern in den Freizonen im Gebiet der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 353/79 af 5. februar 1979 om fastsættelse
    af betingelserne for sammenstikning og fremstilling af vin i frizonerne på Fællesskabets
    geografiske område for produkter inden for vinsektoren med oprindelse i tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 353/79 τού Συμβουλίου
    τής 5ης Φεβρουαρίου 1979 περί θεσπίσεως τών όρων
    αναμίξεως καί οινοποιήσεως εντός τών ελευθέρων
    ζωνών στό έδαφος τής Κοινότητος γιά τά προϊόντα
    τού οινικού τομέα καταγωγής τρίτων χωρών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 353/79 del Consiglio, del 5 febbraio 1979, che stabilisce
    le condizioni di taglio e di vinificazione applicabili nelle zone franche del
    territorio geografico della Comunità ai prodotti nel settore vinicolo originari
    dei paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 353/79 van de Raad van 5 februari 1979 tot vaststelling
    van de voorwaarden voor het versnijden en tot wijn verwerken in de vrije zones
    op het geografische grondgebied van de Gemeenschap van produkten uit de wijnbouwsector,
    van oorsprong uit derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 353/79 do Conselho, de 5 de Fevereiro de 1979, que
    estabelece as condições de lotação e vinificação nas zonas francas do território
    geográfico da Comunidade para os produtos do sector do vinho originários de
    países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 353/79 del Consejo, de 5 de febrero de 1979, por el
