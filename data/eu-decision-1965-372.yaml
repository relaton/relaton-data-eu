title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 6 juillet 1965, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à différer
    le relèvement des droits de leur tarif douanier vers ceux du Tarif douanier commun
    en ce qui concerne les tabacs fabriqués
  type: main
- language: de
  script: Latn
  content: '65/372/EWG: Entscheidung der Kommission vom 6. Juli 1965, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die Angleichung (Erhöhung) der Zollsätze ihres Zolltarifs
    an diejenigen des Gemeinsamen Zolltarifs für verarbeiteten Tabak der Tarifstellen
    24.02 A, B, C und D aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '65/372/CEE: Decisione della Commissione, del 6 luglio 1965, con cui si
    autorizza il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi
    Bassi a differire l''aumento dei dazi previsti nella loro tariffa doganale verso
    quelli della tariffa doganale comune, per quanto concerne i tabacchi lavorati
    di cui alle sottoposizioni tariffarie 24.02 A. B. C e D'
  type: main
- language: nl
  script: Latn
  content: '65/372/EEG: Beschikking van de Commissie van 6 juli 1965 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der
    Nederlanden de aanpassing van de rechten van hun douanetarief aan die van het
    gemeenschappelijk douanetarief uit te stellen voor tabaksfabrikaten van de tariefonderverdelingen
    24.02 A, B, C en D'
  type: main
