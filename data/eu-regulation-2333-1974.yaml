title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2333/74 of the Council of 12 September 1974 laying
    down general rules for the supply of milk fats to the Office of the United Nations
    High Commissioner for Refugees as food aid for distribution to displaced persons
    in Cyprus
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2333/74 du Conseil, du 12 septembre 1974, établissant
    les règles générales relatives à la fourniture de matières grasses du lait
    au Haut Commissariat des Nations unies pour les réfugiés, au titre de l' aide
    alimentaire destinée aux populations déplacées de Chypre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2333/74 des Rates vom 12. September 1974 zur Festlegung
    allgemeiner Regeln für die Lieferung von Milchfett an das Amt des Hohen Kommissars
    der Vereinten Nationen für Flüchtlinge als Nahrungsmittelhilfe für die geflüchteten
    Bevölkerungsgruppen auf Zypern
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2333/74 af 12. september 1974 om fastsættelse
    af almindelige regler vedrørende levering af mælkefedt som fødevarehjælp til
    De forenede Nationers Højkommissariat for flygtninge til de tvangsforflyttede
    befolkningsgrupper på Cypern
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2333/74 del Consiglio, del 12 settembre 1974, che
    stabilisce le norme generali relative alla fornitura di materie grasse del latte
    all' Alto Commissariato delle Nazioni Unite per i rifugiati a titolo di aiuto
    alimentare destinato ai profughi di Cipro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2333/74 van de Raad van 12 september 1974 tot vaststelling
    van de algemene voorschriften betreffende de levering van melkvet als voedselhulp
    aan het Hoge Commissariaat van de Verenigde Naties voor Vluchtelingen, ten behoeve
    van de vluchtelingen op Cyprus.
