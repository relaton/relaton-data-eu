title:
- language: en
  script: Latn
  content: Council Decision 2012/686/CFSP of 6 November 2012 amending Decision 2012/333/CFSP
    updating the list of persons, groups and entities subject to Articles 2, 3 and
    4 of Common Position 2001/931/CFSP on the application of specific measures to
    combat terrorism
  type: main
- language: fr
  script: Latn
  content: Décision 2012/686/PESC du Conseil du 6 novembre 2012 modifiant la décision
    2012/333/PESC portant mise à jour de la liste des personnes, groupes et entités
    auxquels s’appliquent les articles 2, 3 et 4 de la position commune 2001/931/PESC
    relative à l’application de mesures spécifiques en vue de lutter contre le
    terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss 2012/686/GASP des Rates vom 6. November 2012 zur Änderung des
    Beschlusses 2012/333/GASP zur Aktualisierung der Liste der Personen, Vereinigungen
    und Körperschaften, auf die die Artikel 2, 3 und 4 des Gemeinsamen Standpunkts
    2001/931/GASP über die Anwendung besonderer Maßnahmen zur Bekämpfung des Terrorismus
    Anwendung finden
  type: main
- language: bg
  script: Cyrl
