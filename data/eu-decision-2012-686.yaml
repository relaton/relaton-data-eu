    ajan tasalle, joihin sovelletaan erityistoimenpiteiden toteuttamisesta terrorismin
    torjumiseksi hyväksytyn yhteisen kannan 2001/931/YUTP 2, 3 ja 4 artiklaa, koskevan
    päätöksen 2012/333/YUTP muuttamisesta
  type: main
- language: hu
  script: Latn
