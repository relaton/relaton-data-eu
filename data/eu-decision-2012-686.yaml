    na něž se vztahují články 2, 3 a 4 společného postoje 2001/931/SZBP o uplatnění
    zvláštních opatření k boji proti terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2012/686/FUSP af 6. november 2012 om ændring af afgørelse
