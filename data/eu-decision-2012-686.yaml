    loetelu, kelle suhtes kohaldatakse ühise seisukoha 2001/931/ÜVJP (terrorismivastaste
    erimeetmete rakendamise kohta) artikleid 2, 3 ja 4
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2012/686/YUTP, annettu 6 päivänä marraskuuta 2012
