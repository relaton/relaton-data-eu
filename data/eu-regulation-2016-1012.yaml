    animalelor de reproducție de rasă pură, a porcilor de reproducție hibrizi
    și a materialului germinativ provenit de la acestea, comerțului cu acestea și
    introducerii lor în Uniune și de modificare a Regulamentului (UE) nr. 652/2014
    și a Directivelor 89/608/CEE și 90/425/CEE ale Consiliului, precum și de abrogare
    a anumitor acte în sectorul ameliorării animalelor („Regulamentul privind
    ameliorarea animalelor”)
