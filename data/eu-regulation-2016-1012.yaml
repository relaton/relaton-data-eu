    Unión belüli tenyésztésének, kereskedelmének és az Unióba történő beléptetésének
    tenyésztéstechnikai és származástani feltételeiről, a 652/2014/EU rendelet,
    a 89/608/EGK és a 90/425/EGK tanácsi rendelet módosításáról, valamint az
    állattenyésztés tárgyában hozott egyes jogi aktusok módosításáról és
    hatályon kívül helyezéséről („Állattenyésztési rendelet”)
  type: main
