    živali („Uredba o reji živali“)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2016/1012 del Parlamento Europeo y del Consejo, de 8 de
    junio de 2016, relativo a las condiciones zootécnicas y genealógicas para la
    cría, el comercio y la entrada en la Unión de animales reproductores de raza
    pura, porcinos reproductores híbridos y su material reproductivo, y por el que
