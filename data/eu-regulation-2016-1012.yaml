  script: Latn
  content: Regulation (EU) 2016/1012 of the European Parliament and of the Council
    of 8 June 2016 on zootechnical and genealogical conditions for the breeding, trade
    in and entry into the Union of purebred breeding animals, hybrid breeding pigs
    and the germinal products thereof and amending Regulation (EU) No 652/2014, Council
    Directives 89/608/EEC and 90/425/EEC and repealing certain acts in the area of
    animal breeding (‘Animal Breeding Regulation’)
  type: main
- language: fr
