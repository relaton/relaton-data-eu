    2016 relatif aux conditions zootechniques et généalogiques applicables à l'élevage,
    aux échanges et à l'entrée dans l'Union de reproducteurs de race pure, de reproducteurs
    porcins hybrides et de leurs produits germinaux et modifiant le règlement (UE)
    n° 652/2014 et les directives du Conseil 89/608/CEE et 90/425/CEE, et abrogeant
    certains actes dans le domaine de l'élevage d'animaux («règlement relatif à
    l'élevage d'animaux»)
