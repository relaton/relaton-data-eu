  content: Commission Regulation (EEC) No 493/93 of 3 March 1993 ending the charges
    against the tariff ceilings opened for 1992 in the framework of generalized tariff
    preferences by Council Regulation (EEC) No 3832/90 in respect of certain textile
    products originating in China, India, Brazil, Thailand, Singapore, Pakistan, Indonesia
    and Mexico
  type: main
