title:
- language: en
  script: Latn
  content: '2002/308/EC: Commission Decision of 22 April 2002 establishing lists of
    approved zones and approved farms with regard to one or more of the fish diseases
    viral haemorrhagic septicaemia (VHS) and infectious haematopoietic necrosis (IHN)
    (Text with EEA relevance) (notified under document number C(2002) 1500)'
  type: main
- language: fr
  script: Latn
  content: '2002/308/CE: Décision de la Commission du 22 avril 2002 établissant
    les listes des zones et des exploitations piscicoles agréées au regard de la
    septicémie hémorragique virale (SHV) ou de la nécrose hématopoïétique infectieuse
    (NHI), ou de ces deux maladies (Texte présentant de l''intérêt pour l''EEE)
    [notifiée sous le numéro C(2002) 1500]'
  type: main
- language: de
  script: Latn
  content: '2002/308/EG: Entscheidung der Kommission vom 22. April 2002 zur Festlegung
    der Verzeichnisse der hinsichtlich der Viralen Hämorrhagischen Septikämie (VHS)
    und/oder der Infektiösen Hämatopoetischen Nekrose (IHN) zugelassenen Gebiete
    und Fischzuchtbetriebe (Text von Bedeutung für den EWR) (Bekannt gegeben unter
    Aktenzeichen K(2002) 1500)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 22 април 2002 година
    за определяне на списъци на одобрените зони
    и одобрените рибни стопанства по отношение
    на вирусната хеморагична септицемия (ВХС) или
    инфекциозната хематопоетична некроза (ИХН)
    или и на двете болести (нотифицирано под номер
    С (2002) 1500)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 22. dubna 2002 o seznamech schválených oblastí
    a schválených rybích hospodářství, pokud jde o virovou hemoragickou septikémii
    (VHS) a infekční nekrózu krvetvorné tkáně (IHN) nebo o obě tyto nákazy
    (oznámeno pod číslem K(2002) 1500)
  type: main
- language: da
  script: Latn
  content: '2002/308/EF: Kommissionens beslutning af 22. april 2002 om lister over
    zoner og akvakulturbrug, der er godkendt med hensyn til egtvedsyge (VHS) og/eller
    infektiøs hæmatopoietisk nekrose (IHN) (EØS-relevant tekst) (meddelt under
    nummer K(2002) 1500)'
  type: main
- language: el
  script: Grek
  content: '2002/308/ΕΚ: Απόφαση της Επιτροπής, της 22ας
    Απριλίου 2002, για την κατάρτιση καταλόγων εγκεκριμένων
    ζωνών και εγκεκριμένων ιχθυοτροφικών εκμεταλλεύσεων
    ως προς μία ή περισσότερες από τις νόσους της
    ιογενούς αιμορραγικής σηψαιμίας (ΙΑΣ) και της
    λοιμώδους αιματοποιητικής νέκρωσης (ΛΑΝ) οι
    οποίες προσβάλλουν τα ψάρια (Κείμενο που παρουσιάζει
    ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα υπό
    τον αριθμό Ε(2002) 1500]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 22. aprill 2002, millega kehtestatakse kalahaiguste viirusliku
    hemorraagilise septitseemia (VHS) ja/või nakkusliku vereloomenekroosi (IHN) suhtes
    heakskiidetud vööndite ja kalakasvanduste loetelud (teatavaks tehtud numbri
    K(2002) 1500 all)
  type: main
- language: fi
  script: Latn
  content: '2002/308/EY: Komission päätös, tehty 22 päivänä huhtikuuta 2002,
    tarttuvan vertamuodostavan kudoksen kuolion (IHN) ja/tai virusperäisen verenvuotoseptikemian
    (VHS) osalta hyväksyttyjen vyöhykkeiden ja kalanviljelylaitosten luetteloista
    (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla K(2002) 1500)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2002. április 22.) a pisztrángok vírusos vérfertőzése
    (VHS) és a pisztrángfélék fertőző vérképzőszervi elhalása (IHN) nevű
    halbetegségek közül egy vagy több tekintetében mentes övezetek és engedélyezett
    gazdaságok jegyzékének létrehozásáról (az értesítés a C(2002) 1500.
    számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2002/308/CE: Decisione della Commissione, del 22 aprile 2002, recante
    gli elenchi delle zone e delle aziende di allevamento ittico riconosciute per
    quanto concerne la setticemia emorragica virale (VHS) e la necrosi ematopoietica
    infettiva (IHN) (Testo rilevante ai fini del SEE) [notificata con il numero C(2002)
    1500]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2002. gada 22. aprīlis), ar ko izveido apstiprināto
    zonu un apstiprināto saimniecību sarakstu attiecībā uz vīrusu hemorāģisko
    septicēmiju (VHS) vai infekciozo hematopoētisko nekrozi (IHN), vai abām šīm
    slimībām (izziņots ar dokumenta numuru C(2002) 1500)
  type: main
- language: lt
  script: Latn
  content: 2002 m. balandžio 22 d. Komisijos sprendimas, nustatantis patvirtintų
    zonų ir patvirtintų ūkių, atsižvelgiant į vienos ar kelių žuvų ligų
    – virusinės hemoraginės septicemijos (VHS) arba infekcinės hemotopoetinės
    nekrozės (IHN) – paplitimą, sąrašus (pranešta dokumentu Nr. C(2002) 1500)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-22 ta' April 2002 li tistabbilixxi l-listi
    ta' żoni u postijiet ta' tkabbir rigward waħda jew aktar mill-mard tal-ħut
    viral haemorrhagic septicaemia (VHS) u infectious haematopoietic necrosis (IHN)
    (notifikata taħt in-numru tad-Dokument K(2002) 1500)
  type: main
- language: nl
  script: Latn
  content: '2002/308/EG: Beschikking van de Commissie van 22 april 2002 tot vaststelling
    van de lĳsten van erkende gebieden en erkende viskwekerĳen ten aanzien van virale
    hemorragische septikemie (VHS), van infectieuze hematopoïetische necrose (IHN)
    of van beide visziekten (Voor de EER relevante tekst) (kennisgeving geschied onder
    nummer C(2002) 1500)'
  type: main
- language: pl
  script: Latn
  content: 'Decyzja Komisji z dnia 22 kwietnia 2002 r. ustanawiająca wykaz zatwierdzonych
    stref i zatwierdzonych hodowli w zakresie jednej lub więcej chorób ryb: wirusowej
    posocznicy krwotocznej (VHS) i zakaźnej martwicy układu krwiotwórczego (IHN)
    (notyfikowana jako dokument nr C(2002) 1500)'
  type: main
- language: pt
  script: Latn
  content: '2002/308/CE: Decisão da Comissão, de 22 de Abril de 2002, que estabelece
    as listas das zonas aprovadas e das explorações aprovadas no que diz respeito
    a uma ou mais doenças dos peixes, nomeadamente a septicemia hemorrágica viral
    (SHV) e a necrose hematopoética infecciosa (NHI) (Texto relevante para efeitos
    do EEE) [notificada com o número C(2002) 1500]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 22 aprilie 2002 de stabilire a listelor cu zonele
    și fermele piscicole autorizate în ceea ce privește septicemia hemoragică
    virală (SHV) sau necroza hematopoietică infecțioasă (NHI) sau ambele boli
    [notificată cu numărul C(2002) 1500]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 22. apríla 2002, ktorým sa ustanovujú zoznamy
    schválených zón a schválených fariem, pokiaľ ide o ochorenie rýb na vírusovú
    hemoragickú septikémiu (VHS) a infekčnú hematopoetickú nekrózu (IHN) alebo
    pokiaľ ide o obidve tieto ochorenia (oznámené pod číslom dokumentu C(2002)
    1500)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 22. aprila 2002 s seznami con in ribogojnic, odobrenih
    glede ene ali več bolezni rib – virusna hemoragična septikemija (VHS) in nalezljiva
    hematopoetska nekroza (IHN) (notificirano pod dokumentno številko K(2002) 1500)
  type: main
- language: es
  script: Latn
  content: '2002/308/CE: Decisión de la Comisión, de 22 de abril de 2002, por la
    que se establecen listas de zonas y piscifactorías autorizadas en relación con
    la septicemia hemorrágica viral (SHV) y la necrosis hematopoyética infecciosa
    (NHI) (Texto pertinente a efectos del EEE) [notificada con el número C(2002)
    1500]'
  type: main
- language: sv
  script: Latn
  content: '2002/308/EG: Kommissionens beslut av den 22 april 2002 om upprättande
    av förteckningar över godkända zoner och godkända anläggningar med avseende
    på någon av eller båda fisksjukdomarna viral hemorragisk septikemi (VHS) och
    infektiös hematopoietisk nekros (IHN) (Text av betydelse för EES) [delgivet
    med nr K(2002) 1500]'
