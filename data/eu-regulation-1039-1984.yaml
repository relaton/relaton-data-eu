title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1039/84 of 10 April 1984 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and the Republic of Tunisia fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Tunisia, for the period 1 November 1983 to 31 October 1984
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1039/84 du Conseil du 10 avril 1984 concernant la conclusion
    de l' accord sous forme d' échange de lettres entre la Communauté économique
    européenne et la République tunisienne, fixant, pour la période du 1er novembre
    1983 au 31 octobre 1984, le montant additionnel à déduire du prélèvement applicable
    à l' importation dans la Communauté d' huile d' olive non traitée originaire
    de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1039/84 des Rates vom 10. April 1984 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Tunesischen Republik zur Festsetzung des vom 1. November 1983 bis 31.
    Oktober 1984 geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft
    von nicht behandeltem Olivenöl mit Ursprung in Tunesien von der Abschöpfung
    abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1039/84 af 10. april 1984 om indgåelse af
    aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Den tunesiske Republik vedrørende fastsættelse for perioden fra den 1. november
    1983 til den 31. oktober 1984 af det tillægsbeløb, som skal fratrækkes den
    afgift, der anvendes ved indførsel til Fællesskabet af ikke behandlet olivenolie
    med oprindelse i Tunesien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1039/84 του Συμβουλίου
    της 10ης Απριλίου 1984 περί συνάψεως συμφωνίας
    υπό μορφή ανταλλαγής επιστολών μεταξύ της
    Ευρωπαϊκής Οικονομικής Κοινότητας και της
    Δημοκρατίας της Τυνησίας περί καθορισμού,
    για την περίοδο από 1ης Νοεμβρίου 1983 μέχρι 31ης
    Οκτωβρίου 1984, του πρόσθετου ποσού που πρέπει
    να αφαιρεθεί από την εισφορά που εφαρμόζεται
    κατά την εισαγωγή στην Κοινότητα μη επεξεργασμένου
    ελαιολάδου καταγωγής Τυνησίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1039/84 del Consiglio del 10 aprile 1984 relativo
    alla conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e la Repubblica tunisina, che fissa, per il periodo 1o novembre
    1983 - 31 ottobre 1984, l' importo aggiuntivo da detrarre dal prelievo applicabile
    all' importazione nella Comunità di olio d' oliva non trattato originario della
    Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1039/84 van de Raad van 10 april 1984 betreffende
    de sluiting van de Overeenkomst in de vorm van een briefwisseling tussen de Europese
    Economische Gemeenschap en de Republiek Tunesië tot vaststelling, voor het tijdvak
    van 1 november 1983 tot en met 31 oktober 1984, van het aanvullend bedrag dat
    in mindering moet worden gebracht op de heffing die bij invoer in de Gemeenschap
    van toepassing is op niet behandelde olijfolie van oorsprong uit Tunesië
