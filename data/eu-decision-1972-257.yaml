title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 26 juin 1972, autorisant la République
    française à exclure du traitement communautaire les préparations et conserves
    de baies sylvestres et de pulpe de fruits rouges, des positions 08.10 A et Ex
    B et 20.05 Ex C du Tarif douanier commun, originaires de Pologne et mises en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/257/EWG: Entscheidung der Kommission vom 26. Juni 1972, mit der die
    Französische Republik ermächtigt wird, aus Polen stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Zubereitungen und Konserven von
    Waldbeeren und Fruchtfleisch von roten Früchten der Tarifnummern 08.10 A und
    ex B und 20.05 ex C des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/257/CEE: Decisione della Commissione, del 26 giugno 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le preparazioni
    e conserve di bacche silvestri e di polpa di frutti rossi delle voci nn. 08.10
    A e ex B e 20.05 ex C della tariffa doganale comune, originari della Polonia e
    messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/257/EEG: Beschikking van de Commissie van 26 juni 1972 waarbij de Franse
    Republiek wordt gemachtigd bereidingen en conserven van bosbessen en pulp van
    klein fruit van posten 08.10 A en ex B en 20.05 ex C van het gemeenschappelijk
    douanetarief, van oorsprong uit Polen en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
