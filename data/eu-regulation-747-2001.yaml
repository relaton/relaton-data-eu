title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 747/2001 of 9 April 2001 providing for the management
    of Community tariff quotas and of reference quantities for products eligible for
    preferences by virtue of agreements with certain Mediterranean countries and repealing
    Regulations (EC) No 1981/94 and (EC) No 934/95
  type: main
- language: fr
  script: Latn
