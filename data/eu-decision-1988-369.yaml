title:
- language: en
  script: Latn
  content: '88/369/EEC: Ninth Commission Decision of 18 May 1988 relating to the application
    of Council Directive 72/166/EEC on the approximation of the laws of the Member
    States relating to insurance against civil liability in respect of the use of
    motor vehicles, and to the enforcement of the obligation to insure against such
    liability (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/369/CEE: Neuvième Décision de la Commission du 18 mai 1988 relative
    à l''application de la directive 72/166/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives à l''assurance de la responsabilité
    civile résultant de la circulation de véhicules automoteurs, et au contrôle
    de l''obligation d''assurer cette responsabilité (Le texte en langue grecque
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/369/EWG: Neunte Entscheidung der Kommission vom 18. Mai 1988 zur Durchführung
    der Richtlinie 72/166/EWG des Rates betreffend die Angleichung der Rechtsvorschriften
    der Mitgliedstaaten bezüglich der Kraftfahrzeughaftpflichtversicherung und der
    Kontrolle der entsprechenden Versicherungspflicht (Nur der griechische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/369/EØF: Kommissionens niende beslutning af 18. maj 1988 om anvendelse
    af Rådets direktiv 72/166/EØF om indbyrdes tilnærmelse af medlemsstaternes
    lovgivning om ansvarsforsikring for motorkøretøjer og kontrollen med forsikringspligtens
    overholdelse (Kun den graeske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/369/ΕΟΚ: Ένατη Απόφαση της Επιτροπής της
    18ης Μαΐου 1988 σχετικά με την εφαρμογή της οδηγίας
    72/166/ΕΟΚ του Συμβουλίου περί εναρμονίσεως των
    νομοθεσιών των κρατών μελών των σχετικών με
    την ασφάλιση της αστικής ευθύνης που προκύπτει
    από την κυκλοφορία αυτοκινήτων οχημάτων και
    με τον έλεγχο της υποχρέωσης προς ασφάλιση
    της ευθύνης αυτής (Το κείμενο στην ελληνική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/369/CEE: Nona Decisione della Commissione del 18 maggio 1988 relativa
    all''applicazione della direttiva 72/166/CEE del Consiglio concernente il ravvicinamento
    delle legislazioni degli Stati membri in materia di assicurazione della responsabilità
    civile risultante dalla circolazione di autoveicoli e di controllo dell''obbligo
    di assicurare tale responsabilità (Il testo in lingua greca è il solo facente
    fede) (Il testo in lingua greca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/369/EEG: Negende Beschikking van de Commissie van 18 mei 1988 tot toepassing
    van Richtlijn 72/166/EEG van de Raad inzake de onderlinge aanpassing van de wetgevingen
    der Lid-Staten betreffende de verzekering tegen de wettelijke aansprakelijkheid
    waartoe de deelneming aan het verkeer van motorrijtuigen aanleiding kan geven
    en de controle op de verzekering tegen deze aansprakelijkheid (Slechts de tekst
    in de Griekse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/369/CEE: Nona Decisão da Comissão de 18 de Maio de 1988 que diz respeito
