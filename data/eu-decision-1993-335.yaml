    to foot-and-mouth disease'
  type: main
- language: fr
  script: Latn
  content: '93/335/CEE: Décision de la Commission du 28 mai 1993 modifiant la décision
    93/242/CEE concernant l''importation dans la Communauté de certains animaux vivants
    et de leurs produits originaires de certains pays d''Europe, en cas de fièvre
    aphteuse'
  type: main
- language: de
  script: Latn
  content: '93/335/EWG: ENTSCHEIDUNG DER KOMMISSION vom 28. Mai 1993 zu Änderung
