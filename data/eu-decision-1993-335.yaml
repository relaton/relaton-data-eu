    Erzeugnisse aus bestimmten europäischen Ländern in die Gemeinschaft im Zusammenhang
    mit der Maul- und Klauenseuche'
  type: main
- language: da
  script: Latn
  content: '93/335/EØF: KOMMISSIONENS BESLUTNING af 28. maj 1993 om ændring af beslutning
