    directive 88/272/CEE modifiant certaines annexes de la directive 77/93/CEE du
    Conseil concernant les mesures de protection contre l'introduction dans les États
    membres d'organismes nuisibles aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
