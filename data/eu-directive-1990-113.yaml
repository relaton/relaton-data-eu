    ueber Massnahmen zum Schutz gegen das Verbringen von Schadorganismen der Pflanzen
    oder Pflanzenerzeugnisse in die Mitgliedstaaten (90/113/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS DIREKTIV af 19. februar 1990 om aendring af direktiv 88/272/EOEF
