    (ЕС) 2017/625 на Европейския парламент и на Съвета
    по отношение на правилата за извършване на
    специален официален контрол на някои категории
    животни и стоки, по отношение на мерките, които
    да се предприемат след извършването на този
    контрол, и по отношение на някои категории
    животни и стоки, освободени от официален контрол
    на граничните контролни пунктове
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2019/2126 ze dne 10. října
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/625,
    pokud jde o pravidla pro zvláštní úřední kontroly u některých kategorií
    zvířat a zboží, opatření, která mají být přijata po provedení těchto
    kontrol, a některé kategorie zvířat a zboží osvobozené od úředních kontrol
    na stanovištích hraniční kontroly
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2019/2126 af 10. oktober 2019
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2017/625
    for så vidt angår regler for særlig offentlig kontrol af visse kategorier af
    dyr og varer, foranstaltninger, der skal træffes efter gennemførelsen af sådan
    kontrol, og visse kategorier af dyr og varer, der er undtaget fra offentlig kontrol
    på grænsekontrolsteder
  type: main
- language: el
  script: Grek
