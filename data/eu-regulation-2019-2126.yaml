    i robe izuzetima od službenih kontrola na graničnim kontrolnim postajama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/2126 felhatalmazáson alapuló rendelete (2019.
    október 10.) az (EU) 2017/625 európai parlamenti és tanácsi rendeletnek bizonyos
    állat- és árukategóriák egyedi hatósági ellenőrzéseire, az ilyen ellenőrzések
    elvégzését követően meghozandó intézkedésekre és a határállomásokon
    végzett hatósági ellenőrzések alól mentesített bizonyos állat- és árukategóriákra
    vonatkozó szabályok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2019/2126 della Commissione del 10 ottobre 2019
    che integra il regolamento (UE) 2017/625 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme per i controlli ufficiali specifici per alcune categorie
    di animali e merci, le misure da adottare in seguito all’esecuzione di tali
    controlli e alcune categorie di animali e di merci esenti dai controlli ufficiali
    ai posti di controllo frontalieri
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2019/2126 (2019. gada 10. oktobris),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) 2017/625 papildina attiecībā
    uz noteikumiem par konkrētām oficiālajām kontrolēm, ko veic noteiktu kategoriju
    dzīvniekiem un precēm, par pasākumiem, kas jāveic pēc šādām kontrolēm,
    un par noteiktu kategoriju dzīvniekiem un precēm, ko atbrīvo no oficiālajām
    kontrolēm robežkontroles punktos
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2019/2126 2019 m. spalio 10 d.
