title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/2126 of 10 October 2019 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council as regards
    rules for specific official controls for certain categories of animals and goods,
    measures to be taken following the performance of such controls and certain categories
    of animals and goods exempted from official controls at border control posts
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/2126 de la Commission du 10 octobre 2019
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil en
    ce qui concerne les règles applicables aux contrôles officiels spécifiques
    pour certaines catégories d’animaux et de biens, les mesures à prendre à
    la suite de ces contrôles et certaines catégories d’animaux et de biens exemptées
    des contrôles officiels aux postes de contrôle frontaliers
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/2126 der Kommission vom 10. Oktober 2019
    zur Ergänzung der Verordnung (EU) 2017/625 des Europäischen Parlaments und des
    Rates hinsichtlich Vorschriften für besondere amtliche Kontrollen bei bestimmten
    Kategorien von Tieren und Waren, Maßnahmen, die nach der Durchführung dieser
    Kontrollen zu ergreifen sind, und bestimmte Kategorien von Tieren und Waren, die
    von amtlichen Kontrollen an Grenzkontrollstellen ausgenommen sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2019/2126 на Комисията
