    kuriomis reglamentuojama tam tikrų kategorijų gyvūnų ir prekių konkreti oficialioji
    kontrolė ir priemonės, kurių turi būti imamasi atlikus tokią kontrolę, taip
    pat nuostatomis dėl tam tikrų kategorijų gyvūnų ir prekių, kuriems netaikoma
    oficialioji kontrolė pasienio kontrolės postuose
  type: main
- language: mt
  script: Latn
  content: Regolament delegat tal-Kummissjoni (UE) 2019/2126 tal-10 ta’ Ottubru
    2019 li jissupplimenta r-Regolament (UE) 2017/625 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ regoli għal kontrolli uffiċjali speċifiċi għal ċerti kategoriji
    ta’ annimali u oġġetti, miżuri li għandhom jittieħdu wara t-twettiq ta’
    tali kontrolli, u ċerti kategoriji ta’ annimali u oġġetti eżentati minn
    kontrolli uffiċjali fil-postijiet ta’ kontroll fuq il-fruntiera
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2019/2126 van de Commissie van 10 oktober
    2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en
    de Raad wat betreft regels voor specifieke officiële controles van bepaalde categorieën
    dieren en goederen, maatregelen die na de uitvoering van die controles moeten
    worden genomen, en bepaalde categorieën dieren en goederen die vrijgesteld zijn
    van officiële controles aan grenscontroleposten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2019/2126 z dnia 10 października
    2019 r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/625
    w odniesieniu do przepisów dotyczących określonych kontroli urzędowych odnoszących
    się do niektórych kategorii zwierząt i towarów, środków stosowanych po przeprowadzeniu
    tych kontroli oraz niektórych kategorii zwierząt i towarów zwolnionych z kontroli
    urzędowych w punktach kontroli granicznej
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2019/2126 da Comissão de 10 de outubro de 2019
    que completa o Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho no
    que diz respeito a regras sobre controlos oficiais específicos de determinadas
    categorias de animais e mercadorias, a medidas a tomar após a realização desses
    controlos e a determinadas categorias de animais e mercadorias isentas de controlos
    oficiais nos postos de controlo fronteiriços
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2019/2126 al Comisiei din 10 octombrie 2019 de
    completare a Regulamentului (UE) 2017/625 al Parlamentului European și al Consiliului
    în ceea ce privește normele referitoare la controalele oficiale specifice vizând
    anumite categorii de animale și de mărfuri, măsurile care trebuie luate în
    urma efectuării acestor controale și anumite categorii de animale și de mărfuri
    exceptate de la efectuarea controalelor oficiale la posturile de inspecție la
    frontieră
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2019/2126 z 10. októbra 2019, ktorým
    sa dopĺňa nariadenie (EÚ) 2017/625 Európskeho parlamentu a Rady, pokiaľ ide
    o pravidlá pre špecifické úradné kontroly v prípade určitých kategórií
    zvierat a tovaru, opatrenia, ktoré sa majú prijať po vykonaní takýchto kontrol,
    a o určité kategórie zvierat a tovaru oslobodené od úradných kontrol na
    hraničných kontrolných staniciach
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/2126 z dne 10. oktobra 2019 o dopolnitvi
    Uredbe (EU) 2017/625 Evropskega parlamenta in Sveta glede pravil za posebni nadzor
    za nekatere kategorije živali in blaga, ukrepov, ki se sprejmejo po izvedbi takšnega
    nadzora, in nekaterih kategorij živali in blaga, ki so izvzete iz uradnega nadzora
    na mejnih kontrolnih točkah
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2019/2126 de la Comisión de 10 de octubre de
    2019 por el que se completa el Reglamento (UE) 2017/625 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas relativas a los controles oficiales
    específicos de determinadas categorías de animales y mercancías, a las medidas
    que deben adoptarse tras la realización de esos controles y a determinadas categorías
    de animales y mercancías exentas de controles oficiales en los puestos de control
    fronterizos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2019/2126 av den 10 oktober 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
    gäller bestämmelser om särskild offentlig kontroll av vissa kategorier av djur
    och varor, om åtgärder som ska vidtas efter att sådan kontroll har utförts
    samt om vissa kategorier av djur och varor som är undantagna från offentlig
    kontroll vid gränskontrollstationer
