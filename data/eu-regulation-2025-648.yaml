    osin kuin on kyse neuvoston direktiiviin 2011/16/EU, sellaisena kuin se on muutettuna
    neuvoston direktiivillä (EU) 2021/514, liittyvässä pakollisessa automaattisessa
    tietojenvaihdossa käytettävistä vakiomuotoisista lomakkeista ja tiedonsiirtoformaateista
    sekä jäsenvaltioiden neuvoston direktiivin 2011/16/EU, sellaisena kuin se on
    muutettuna neuvoston direktiivillä (EU) 2021/514, arvioimiseksi toimittamien
    tilastotietojen luettelosta
  type: main
