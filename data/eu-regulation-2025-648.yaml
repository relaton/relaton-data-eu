title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/648 of 2 April 2025 on amending
    Implementing Regulation (EU) 2015/2378 as regards the standard forms and computerised
    formats to be used for the mandatory automatic exchange of information in relation
    to the Council Directive 2011/16/EU as amended by Council Directive (EU) 2021/514
    and the list of statistical data to be provided by Member States for the purposes
    of evaluating Council Directive 2011/16/EU as amended by Council Directive (EU)
    2021/514
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/648 de la Commission du 2 avril 2025
    modifiant le règlement d’exécution (UE) 2015/2378 en ce qui concerne les formulaires
    types et les formats informatisés à utiliser pour l’échange automatique et
    obligatoire d’informations en relation avec la directive 2011/16/UE du Conseil
    telle que modifiée par la directive (UE) 2021/514 du Conseil et la liste des
    données statistiques à fournir par les États membres aux fins de l’évaluation
    de la directive 2011/16/UE du Conseil telle que modifiée par la directive (UE)
    2021/514 du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/648 der Kommission vom 2. April 2025
    zur Änderung der Durchführungsverordnung (EU) 2015/2378 bezüglich der Standardformblätter
    und elektronischen Formate, die im Zusammenhang mit der Richtlinie 2011/16/EU
    des Rates in der durch die Richtlinie (EU) 2021/514 des Rates geänderten Fassung
    zu verwenden sind, sowie der Liste der statistischen Angaben, die die Mitgliedstaaten
    zur Bewertung der Richtlinie 2011/16/EU des Rates in der durch die Richtlinie
    (EU) 2021/514 des Rates geänderten Fassung zu übermitteln haben
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/648 на Комисията
