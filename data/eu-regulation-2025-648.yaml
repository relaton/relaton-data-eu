    Rady (EU) 2021/514
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/648 af 2. april 2025
    om ændring af gennemførelsesforordning (EU) 2015/2378 for så vidt angår de
    standardformularer og elektroniske formater, der anvendes til obligatorisk automatisk
    udveksling af oplysninger i forbindelse med Rådets direktiv 2011/16/EU som ændret
    ved Rådets direktiv (EU) 2021/514, og listen over statistiske oplysninger, som
