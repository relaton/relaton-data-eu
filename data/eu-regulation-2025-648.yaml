    за изпълнение (ЕС) 2015/2378 по отношение на стандартните
    формуляри и компютризираните формати, които
    да се използват за задължителния автоматичен
    обмен на информация, предвиден в Директива
    2011/16/ЕС на Съвета, изменена с Директива (ЕС)
    2021/514 на Съвета, и по отношение на списъка на
    статистическите данни, които държавите членки
    трябва да предоставят за целите на оценяването
    на Директива 2011/16/ЕС на Съвета, изменена с Директива
    (ЕС) 2021/514 на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/648 ze dne 2. dubna 2025 o změně
    prováděcího nařízení (EU) 2015/2378, pokud jde o standardní formuláře
    a elektronické formáty, které se mají používat pro automatickou výměnu
    informací v souvislosti se směrnicí Rady 2011/16/EU ve znění směrnice Rady
    (EU) 2021/514, a seznam statistických údajů, které mají členské státy
