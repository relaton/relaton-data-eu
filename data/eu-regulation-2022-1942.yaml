  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1942 на Комисията
    от 13 октомври 2022 година за изменение на Регламент
    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от вида Jasminum polyanthum Franchet
    с произход от Уганда, за изменение на Регламент
    за изпълнение (ЕС) 2020/1213 по отношение на фитосанитарните
    мерки за въвеждането на посочените растения
