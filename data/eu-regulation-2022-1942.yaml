  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1942 της Επιτροπής
    της 13ης Οκτωβρίου 2022 για την τροποποίηση του
    εκτελεστικού κανονισμού (ΕΕ) 2018/2019 όσον αφορά
