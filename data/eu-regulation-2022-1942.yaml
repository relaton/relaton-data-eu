    κανονισμού (ΕΕ) 2020/1213 όσον αφορά τα φυτοϋγειονομικά
    μέτρα για την είσοδο ορισμένων φυτών για φύτευση
    Jasminum polyanthum Franchet, καταγωγής Ισραήλ, στο έδαφος
    της Ένωσης
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1942, 13. oktoober 2022, millega muudetakse
    rakendusmäärust (EL) 2018/2019 Ugandast pärit, liiki Jasminum polyanthum Franchet
    kuuluvate teatavate istutamiseks ettenähtud taimede osas, muudetakse rakendusmäärust
    (EL) 2020/1213 seoses fütosanitaarmeetmetega, mis kehtivad kõnealuste istutamiseks
    ettenähtud taimede sissetoomisel liidu territooriumile, ning parandatakse rakendusmäärust
    (EL) 2020/1213 seoses Iisraelist pärit, liiki Jasminum polyanthum Franchet kuuluvate
    teatavate istutamiseks ettenähtud taimede puhul kehtivate fütosanitaarmeetmetega
    taimede sissetoomisel liidu territooriumile
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1942, annettu 13 päivänä
    lokakuuta 2022, täytäntöönpanoasetuksen (EU) 2018/2019 muuttamisesta Ugandasta
    peräisin olevien Jasminum polyanthum Franchet -lajin istutettaviksi tarkoitettujen
    kasvien osalta, täytäntöönpanoasetuksen (EU) 2020/1213 muuttamisesta siltä
    osin kuin on kyse kyseisten istutettaviksi tarkoitettujen kasvien tuomista unioniin
    koskevista kasvinsuojelutoimenpiteistä ja täytäntöönpanoasetuksen (EU) 2020/1213
    oikaisemisesta siltä osin kuin on kyse tiettyjen Israelista peräisin olevien
    Jasminum polyanthum Franchet -lajin istutettaviksi tarkoitettujen kasvien tuomista
    unioniin koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1942 ón gCoimisiún an 13 Deireadh
    Fómhair 2022 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid
    a bhaineann le plandaí Jasminum polyanthum Franchet áirithe le haghaidh plandú
    de thionscnamh Uganda, lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1213
    a mhéid a bhaineann leis na bearta fíteashláintíochta i ndáil leis na plandaí
    sin le haghaidh plandú a thabhairt isteach i gcríoch an Aontais agus lena gceartaítear
    Rialachán Cur Chun Feidhme (AE) 2020/1213 a mhéid a bhaineann leis na bearta
    fíteashláintíochta i ndáil le plandaí áirithe Jasminum polyanthum Franchet
    le haghaidh plandú de thionscnamh Iosrael a thabhairt isteach i gcríoch an Aontais
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1942 оd 13. listopada 2022. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrste Jasminum
    polyanthum Franchet podrijetlom iz Ugande, o izmjeni Provedbene uredbe (EU) 2020/1213
    u pogledu fitosanitarnih mjera za unos tog bilja za sadnju na područje Unije
    i o ispravku Provedbene uredbe (EU) 2020/1213 u pogledu fitosanitarnih mjera za
    unos određenog bilja za sadnju vrste Jasminum polyanthum Franchet podrijetlom
    iz Izraela na područje Unije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1942 végrehajtási rendelete (2022. október 13.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Jasminum polyanthum Franchet egyes,
    Ugandából származó, ültetésre szánt növényei tekintetében történő
    módosításáról, az (EU) 2020/1213 végrehajtási rendeletnek az említett,
    ültetésre szánt növényeknek az Unió területére történő behozatalára
    vonatkozó növényegészségügyi intézkedések tekintetében történő módosításáról,
    valamint az (EU) 2020/1213 végrehajtási rendeletnek a Jasminum polyanthum Franchet
    Izraelből származó, ültetésre szánt egyes növényeinek az Unió területére
    történő behozatalára vonatkozó növényegészségügyi intézkedések tekintetében
    történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1942 della Commissione del 13 ottobre
    2022 che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Jasminum polyanthum Franchet originarie dell’Uganda,
    modifica il regolamento di esecuzione (UE) 2020/1213 per quanto riguarda le misure
    fitosanitarie per l’introduzione nel territorio dell’Unione di tali piante
    da impianto e rettifica il regolamento di esecuzione (UE) 2020/1213 per quanto
    riguarda le misure fitosanitarie per l’introduzione nel territorio dell’Unione
    di alcune piante da impianto di Jasminum polyanthum Franchet originarie di Israele
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1942 (2022. gada 13. oktobris),
    ar ko attiecībā uz noteiktiem stādāmiem Jasminum polyanthum Franchet sugas
    augiem, kuru izcelsme ir Ugandā, groza Īstenošanas regulu (ES) 2018/2019, ar
    ko attiecībā uz fitosanitārajiem pasākumiem, kurus piemēro šādu stādāmo
    augu ievešanai Savienības teritorijā, groza Īstenošanas regulu (ES) 2020/1213
    un ar ko attiecībā uz fitosanitārajiem pasākumiem, kurus piemēro noteiktu
    stādāmo Jasminum polyanthum Franchet sugas augu, kuru izcelsme ir Izraēlā,
    ievešanai Savienības teritorijā, labo Īstenošanas regulu (ES) 2020/1213
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1942 2022 m. spalio 13 d.
    kuriuo dėl tam tikrų Ugandos kilmės sodinti skirtų Jasminum polyanthum Franchet
    augalų iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2018/2019, dėl fitosanitarinių
    priemonių, taikomų tiems į Sąjungos teritoriją įvežamiems sodinti skirtiems
    augalams, iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2020/1213 ir dėl
    fitosanitarinių priemonių, taikomų tam tikriems į Sąjungos teritoriją įvežamiems
    Izraelio kilmės sodinti skirtiems Jasminum polyanthum Franchet augalams, ištaisomas
    Įgyvendinimo reglamentas (ES) 2020/1213
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1942 tat-13
    ta’ Ottubru 2022 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2018/2019
    fir-rigward ta’ ċerti pjanti għat-tħawwil ta’ Jasminum polyanthum Franchet
    li joriġinaw mill-Uganda, li jemenda r-Regolament ta’ Implimentazzjoni (UE)
    2020/1213 fir-rigward tal-miżuri fitosanitarji għall-introduzzjoni ta’ dawk
    il-pjanti għat-tħawwil fit-territorju tal-Unjoni u li jikkoreġi r-Regolament
    ta’ Implimentazzjoni (UE) 2020/1213 fir-rigward tal-miżuri fitosanitarji għall-introduzzjoni
    ta’ ċerti pjanti għat-tħawwil ta’ Jasminum polyanthum Franchet li joriġinaw
    fl-Iżrael, fit-territorju tal-Unjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1942 van de Commissie van 13 oktober 2022
    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde voor
    opplant bestemde planten van de soort Jasminum polyanthum Franchet van oorsprong
    uit Uganda, tot wijziging van Uitvoeringsverordening (EU) 2020/1213 betreffende
    de fytosanitaire maatregelen voor het binnenbrengen van die voor opplant bestemde
    planten op het grondgebied van de Unie en tot rectificatie van Uitvoeringsverordening
    (EU) 2020/1213 betreffende de fytosanitaire maatregelen voor het binnenbrengen
    van bepaalde voor opplant bestemde planten van de soort Jasminum polyanthum Franchet
    van oorsprong uit Israël op het grondgebied van de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1942 z dnia 13 października
    2022 r. zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do
    niektórych roślin przeznaczonych do sadzenia gatunku Jasminum polyanthum Franchet
    pochodzących z Ugandy, zmieniające rozporządzenie wykonawcze (UE) 2020/1213
    w odniesieniu do środków fitosanitarnych do celów wprowadzania na terytorium
    Unii tych roślin przeznaczonych do sadzenia oraz w sprawie sprostowania rozporządzenia
    wykonawczego (UE) 2020/1213 dotyczącego środków fitosanitarnych stosowanych
    do celów wprowadzania na terytorium Unii niektórych roślin przeznaczonych do
    sadzenia gatunku Jasminum polyanthum Franchet pochodzących z Izraela
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1942 da Comissão de 13 de outubro
    de 2022 que altera o Regulamento de Execução (UE) 2018/2019 no que se refere
    a determinados vegetais para plantação de Jasminum polyanthum Franchet originários
    do Uganda, que altera o Regulamento de Execução (UE) 2020/1213 no que se refere
    às medidas fitossanitárias para a introdução desses vegetais para plantação
    no território da União e que retifica o Regulamento de Execução (UE) 2020/1213
    no que se refere às medidas fitossanitárias para a introdução de determinados
    vegetais para plantação de Jasminum polyanthum Franchet originários de Israel
    no território da União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1942 al Comisiei din 13 octombrie
    2022 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării din specia Jasminum polyanthum
    Franchet originare din Uganda, de modificare a Regulamentului de punere în aplicare
    (UE) 2020/1213 în ceea ce privește măsurile fitosanitare pentru introducerea
    acestor plante destinate plantării pe teritoriul Uniunii și de rectificare a
    Regulamentului de punere în aplicare (UE) 2020/1213 în ceea ce privește măsurile
    fitosanitare pentru introducerea pe teritoriul Uniunii a anumitor plante destinate
    plantării de Jasminum polyanthum Franchet originare din Israel
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1942 z 13. októbra 2022, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    na výsadbu druhu Jasminum polyanthum Franchet pochádzajúce z Ugandy, mení
    vykonávacie nariadenie (EÚ) 2020/1213, pokiaľ ide o rastlinolekárske opatrenia
    v súvislosti so vstupom uvedených rastlín na výsadbu na územie Únie, a opravuje
    vykonávacie nariadenie (EÚ) 2020/1213, pokiaľ ide o rastlinolekárske opatrenia
    v súvislosti so vstupom určitých rastlín na výsadbu druhu Jasminum polyanthum
    Franchet pochádzajúcich z Izraela na územie Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1942 z dne 13. oktobra 2022 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Jasminum polyanthum
    Franchet s poreklom iz Ugande, spremembi Izvedbene uredbe (EU) 2020/1213 glede
    fitosanitarnih ukrepov za vnos navedenih rastlin za saditev na ozemlje Unije in
    popravku Izvedbene uredbe (EU) 2020/1213 glede fitosanitarnih ukrepov za vnos
    nekaterih rastlin za saditev Jasminum polyanthum Franchet s poreklom iz Izraela
    na ozemlje Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1942 de la Comisión de 13 de octubre
    de 2022 por el que se modifica el Reglamento de Ejecución (UE) 2018/2019 en lo
    que respecta a determinados vegetales para plantación de Jasminum polyanthum
    Franchet originarios de Uganda, por el que se modifica el Reglamento de Ejecución
    (UE) 2020/1213 en lo que respecta a las medidas fitosanitarias relativas a la
    introducción de esos vegetales para plantación en el territorio de la Unión
    y por el que se corrige el Reglamento de Ejecución (UE) 2020/1213 en lo que respecta
    a las medidas fitosanitarias relativas a la introducción de determinados vegetales
    para plantación de Jasminum polyanthum Franchet originarios de Israel en el territorio
    de la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1942 av den 13 oktober
    2022 om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa
    växter för plantering av Jasminum polyanthum Franchet med ursprung i Uganda,
    om ändring av genomförandeförordning (EU) 2020/1213 vad gäller växtskyddsåtgärder
    för införsel av dessa växter för plantering till unionens territorium samt
    om rättelse av genomförandeförordning (EU) 2020/1213 vad gäller växtskyddsåtgärder
    för införsel av vissa växter för plantering av Jasminum polyanthum Franchet
    med ursprung i Israel till unionens territorium
