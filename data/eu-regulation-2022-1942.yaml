    на фитосанитарните мерки за въвеждането на
    някои растения за засаждане от вида Jasminum polyanthum
    Franchet с произход от Израел на територията на
    Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1942 ze dne 13. října 2022,
    kterým se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé
    rostliny k pěstování druhu Jasminum polyanthum Franchet pocházející z Ugandy,
    mění se prováděcí nařízení (EU) 2020/1213, pokud jde o fytosanitární
    opatření pro dovoz uvedených rostlin k pěstování na území Unie, a opravuje
    se prováděcí nařízení (EU) 2020/1213, pokud jde o fytosanitární opatření
    pro dovoz některých rostlin k pěstování druhu Jasminum polyanthum Franchet
    pocházejících z Izraele na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1942 af 13. oktober 2022
    om ændring af gennemførelsesforordning (EU) 2018/2019 for så vidt angår visse
    planter til plantning af Jasminum polyanthum Franchet med oprindelse i Uganda,
    om ændring af gennemførelsesforordning (EU) 2020/1213 for så vidt angår plantesundhedsmæssige
    foranstaltninger for indførsel af disse planter til plantning i Unionens område
