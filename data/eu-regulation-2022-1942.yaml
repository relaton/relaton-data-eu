title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1942 of 13 October 2022 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Jasminum polyanthum Franchet originating in Uganda, amending Implementing Regulation
    (EU) 2020/1213 as regards the phytosanitary measures for the introduction of those
    plants for planting into the Union territory and correcting Implementing Regulation
    (EU) 2020/1213 as regards the phytosanitary measures for the introduction of certain
    plants for planting of Jasminum polyanthum Franchet originating in Israel, into
    the Union territory
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1942 de la Commission du 13 octobre
    2022 modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne
    certains végétaux destinés à la plantation appartenant à l’espèce Jasminum
    polyanthum Franchet et originaires d’Ouganda, modifiant le règlement d’exécution
    (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires préalables à l’introduction
    sur le territoire de l’Union de ces végétaux destinés à la plantation et
    rectifiant le règlement d’exécution (UE) 2020/1213 en ce qui concerne les
    mesures phytosanitaires préalables à l’introduction sur le territoire de l’Union
    de certains végétaux destinés à la plantation appartenant à l’espèce Jasminum
    polyanthum Franchet et originaires d’Israël
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1942 der Kommission vom 13. Oktober
    2022 zur Änderung der Durchführungsverordnung (EU) 2018/2019 in Bezug auf bestimmte
    zum Anpflanzen bestimmte Pflanzen der Art Jasminum polyanthum Franchet mit Ursprung
    in Uganda, zur Änderung der Durchführungsverordnung (EU) 2020/1213 in Bezug
    auf Pflanzenschutzmaßnahmen für das Einführen dieser zum Anpflanzen bestimmten
    Pflanzen in das Gebiet der Union und zur Berichtigung der Durchführungsverordnung
    (EU) 2020/1213 in Bezug auf Pflanzenschutzmaßnahmen für das Einführen bestimmter
    zum Anpflanzen bestimmter Pflanzen der Art Jasminum polyanthum Franchet mit Ursprung
    in Israel in das Gebiet der Union
  type: main
