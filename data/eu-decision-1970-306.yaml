title:
- language: en
  script: Latn
  content: '70/306/EEC: Commission Decision of 3 June 1970 authorizing the Kingdom
    of Belgium to approve for marketing seed of Pseudotsuga menziesii (Mirb.) Franco.
    and Picea sitchensis Trautv. and May., satisfying less stringent requirements
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/306/CEE: Décision de la Commission, du 3 juin 1970, autorisant le
    Royaume de Belgique à admettre à la commercialisation des semences de Pseudotsuga
    menziesii (Mirb.) Franco. et de Picea sitchensis Trautv. et Mey., soumises à
    des exigences réduites (Les textes en langues française et néerlandaise sont
    les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '70/306/EWG: Entscheidung der Kommission vom 3. Juni 1970, mit der das
    Königreich Belgien ermächtigt wird, Saatgut von Pseudotsuga menziesii (Mirb.)
    Franco. und von Picea sitchensis Trautv. und Mey. mit minderen Anforderungen zum
    gewerbsmäßigen Verkehr zuzulassen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '70/306/EØF: Kommissionens beslutning af 3. juni 1970 om bemyndigelse
    af kongeriget Belgien til at tillade handel med frø af Pseudotsuga menziesii
    (Mirb.) Franco. og af Picea sitchensis Trautv. og Mey., der opfylder mindre strenge
    krav (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '70/306/CEE: Decisione della Commissione, del 3 giugno 1970, che autorizza
    il Regno del Belgio ad ammettere alla commercializzazione le sementi di Pseudotsuga
    menziesii (Mirb.) Franco. e di Picea sitchensis Trautv. e Mey., sottoposte a requisiti
    ridotti (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '70/306/EEG: Beschikking van de Commissie van 3 juni 1970 houdende machtiging
    van het Koninkrijk België om zaden van Pseudotsuga menziesii (Mirb.) Franco.
    en Picea sitchensis Trautv. en Mey., waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
