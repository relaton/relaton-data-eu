title:
- language: fr
  script: Latn
  content: Décision 66/33/CEE de la Commission, du 21 décembre 1965, relative au
    recours de la République fédérale d'Allemagne à l'article 115 alinéa 1 du
    Traité pour exclure du traitement communautaire les "oxydes d'antimoine" de la
    position Ex 28.28 M du Tarif douanier commun, originaires de pays tiers et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/33/EWG: Entscheidung der Kommission vom 21. Dezember 1965 betreffend
    den Antrag der Bundesrepublik Deutschland nach Artikel 115 Absatz (1) des Vertrages,
    um aus dritten Ländern stammende Antimonoxyde der Tarifnummer ex 28.28 M des
    Gemeinsamen Zolltarifs, die sich in den anderen Mitgliedstaaten im freien Verkehr
    befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/33/CEE: Decisione della Commissione, del 21 dicembre 1965, relativa
    al ricorso della Repubblica federale di Germania all''articolo 115, primo comma,
    del Trattato, per escludere dal trattamento comunitario gli ossidi di antimonio
    della voce ex 28.28 M della tariffa doganale comune originari di paesi terzi e
    immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/33/EEG: Beschikking van de Commissie van 21 december 1965 betreffende
    het verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea van het Verdrag antimoonoxyden van post ex 28.28 M van het gemeenschappelijk
    douanetarief, die van oorsprong zijn uit derde landen en in de andere Lid-Staten
    in het vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
