title:
- language: en
  script: Latn
  content: '84/517/EEC: Council Decision of 23 October 1984 authorizing the French
    Republic to apply in respect of automatic gaming machines a measure derogating
    from Article 18 of the Sixth Directive (77/388/EEC) on the harmonization of the
    laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '84/517/CEE: Décision du Conseil du 23 octobre 1984 autorisant la République
    française à appliquer dans le secteur des jeux automatiques une mesure dérogatoire
    à l'' article 18 de la sixième directive (77/388/CEE) en matière d'' harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d'' affaires'
  type: main
- language: de
  script: Latn
  content: '84/517/EWG: Entscheidung des Rates vom 23. Oktober 1984 zur Ermächtigung
    der Französischen Republik, bei Spielautomaten eine von Artikel 18 der Sechsten
    Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten
    über die Umsatzsteuern abweichende Maßnahme anzuwenden'
  type: main
- language: da
  script: Latn
  content: '84/517/EØF: Rådets beslutning af 23. oktober 1984 om bemyndigelse af
    Den franske Republik til i spilleautomatbranchen at anvende en bestemmelse, der
    fraviger artikel 18 i sjette direktiv (77/388/EØF) om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '84/517/ΕΟΚ: Απόφαση του Συμβουλίου της 23ης
    Οκτωβρίου 1984 για την εξουσιοδότηση της Γαλλικής
    Δημοκρατίας να εφαρμόσει, στον τομέα των αυτόματων
    παιχνιδιών, ένα μέτρο παρέκκλισης από το άρθρο
    18 της έκτης οδηγίας (77/388/ΕΟΚ) περί εναρμονίσεως
    των νομοθεσιών των κρατών μελών των σχετικών
    με τους φόρους κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '84/517/CEE: Decisione del Consiglio del 23 ottobre 1984 che autorizza
    la Repubblica francese ad applicare nel settore dei giochi automatici una misura
    di deroga all'' articolo 18 della sesta direttiva 77/388/CEE in materia di armonizzazione
    delle legislazioni degli Stati membri relative alle imposte sulla cifra d'' affari'
  type: main
- language: nl
  script: Latn
  content: '84/517/EEG: Beschikking van de Raad van 23 oktober 1984 waarbij de Franse
    Republiek wordt gemachtigd voor speelautomaten een maatregel toe te passen die
    afwijkt van artikel 18 van de Zesde Richtlijn 77/388/EEG betreffende de harmonisatie
    van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: es
  script: Latn
  content: '84/517/CEE: Decisión del Consejo de 23 de octubre de 1984 por la que
    se autoriza a la República Francesa a aplicar en el sector de los juegos automáticos
    una excepción al artículo 18 de la sexta Directiva (77/388/CEE) en materia de
    armonización de las legislaciones de los Estados miembros relativas a los impuestos
    sobre el volumen de negocios'
