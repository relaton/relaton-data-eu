title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2493/83 of 2 September 1983 re-establishing
    the levying of customs duties on gloves, including mittens and mitts, falling
    within subheading 42.03 B I and originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2493/83 de la Commission du 2 septembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles, de la sous-position 42.03 B I du tarif douanier commun, originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2493/83 der Kommission vom 2. September 1983 zur Wiedereinführung
    der Erhebung der Zölle für Handschuhe, einschließlich Fausthandschuhe der Tarifstelle
    42.03 B I, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3377/82
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2493/83 af 2. september 1983 om genindførelse
    af opkrævning af told for handsker (herunder vanter), såvel syede som kun tilskårne,
    henhørende under pos. 42.03 B I og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2493/83 της Επιτροπής
    της 2ας Σεπτεμβρίου 1983 περί αποκαταστάσεως
    της εφαρμογής των δασμών για χειρόκτια, συμπεριλαμβανομένων
    και των αδακτύλων τοιούτων των εχόντων υποδοχήν
    μόνον διά τον αντίχειρα, της διακρίσεως 42.03
    Β Ι του Κοινού Δασμολογίου, καταγωγής Ινδίας,
    δικαιούχου των προβλεπομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2493/83 della Commissione del 2 settembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, comprese le
    muffole, della sottovoce 42.03 B I della tariffa doganale comune, originari dell'
    India, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2493/83 van de Commissie van 2 september 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op handschoenen
    en wanten van postonderverdeling 42.03 B I, van oorsprong uit India, waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
