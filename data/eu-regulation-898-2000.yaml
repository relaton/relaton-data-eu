title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 898/2000 of 28 April 2000 determining the
    extent to which applications lodged in April 2000 for import licences for certain
    poultrymeat products under the regime provided for in Council Regulation (EC)
    No 774/94 opening and providing for the administration of certain Community tariff
    quotas for poultrymeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 898/2000 de la Commission, du 28 avril 2000, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 2000 pour certains produits à base de viande de volaille peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande de volaille et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 898/2000 der Kommission vom 28. April 2000 über die
    Festsetzung des Umfangs, in dem die im April 2000 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Geflügelfleischerzeugnisse entsprechend der Regelung der Verordnung
    (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher Zollkontingente
    für Geflügelfleisch und andere landwirtschaftliche Erzeugnisse genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 898/2000 af 28. april 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    2000 om importlicenser for visse fjerkræprodukter, som kun accepteres i forbindelse
    med den ordning, der er fastsat i Rådets forordning (EF) nr. 774/94 om åbning
    og forvaltning af en række EF-toldkontingenter for fjerkrækød og andre landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 898/2000 της Επιτροπής,
    της 28ης Απριλίου 2000, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές αιτήσεις
    που υποβλήθηκαν τον Απρίλιο του 2000 για πιστοποιητικά
    εισαγωγής ορισμένων προϊόντων με βάση το κρέας
    πουλερικών βάσει του καθεστώτος που προβλέπεται
    από τον κανονισμό (ΕΚ) αριθ. 774/94 του Συμβουλίου
    για το άνοιγμα και τον τρόπο διαχείρισης ορισμένων
    κοινοτικών δασμολογικών ποσοστώσεων για το
    κρέας πουλερικών και για ορισμένα άλλα γεωργικά
    προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 898/2000, annettu 28 päivänä huhtikuuta 2000,
    huhtikuussa 2000 jätettyjen tiettyjä siipikarjanlihasta peräisin olevia tuotteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä tiettyjen siipikarjanlihaa
    ja tiettyjä muita maataloustuotteita koskevien yhteisön tariffikiintiöiden
    avaamisesta ja hallinnasta annetussa neuvoston asetuksessa (EY) N:o 774/94 säädetyn
    järjestelmän mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 898/2000 della Commissione, del 28 aprile 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 2000 per taluni prodotti del settore del pollame
    nel quadro del regime previsto dal regolamento (CE) n. 774/94 del Consiglio recante
    apertura e modalità di gestione di alcuni contingenti tariffari comunitari di
    pollame e di taluni altri prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 898/2000 van de Commissie van 28 april 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector slachtpluimvee, die in april 2000 worden
    ingediend op grond van de regeling waarin is voorzien bij Verordening (EG) nr.
    774/94 van de Raad houdende opening en vaststelling van de wijze van beheer van
    communautaire tariefcontingenten voor slachtpluimvee en bepaalde andere landbouwproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 898/2000 da Comissão, de 28 de Abril de 2000, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de aves de capoeira apresentados em
    Abril de 2000 ao abrigo do regime previsto no Regulamento (CE) n.° 774/94 do
    Conselho relativo à abertura e modo de gestão de determinados contingentes pautais
    comunitários de carne de aves de capoeira e outros produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 898/2000 de la Comisión, de 28 de abril de 2000, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de la carne de aves de corral
    presentadas en el mes de abril de 2000 al amparo del régimen previsto en el Reglamento
    (CE) n° 774/94 del Consejo relativo a la apertura y modo de gestión de determinados
    contingentes arancelarios comunitarios de carne de aves de corral y determinados
    productos agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 898/2000 av den 28 april 2000 om fastställande
    av i vilken utsträckning de ansökningar kan godtas som lämnades in i april
    2000 om importlicens för vissa basprodukter av fjäderfäkött enligt det förfarande
