    τρίτων χωρών στην Κοινότητα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2622/93 DELLA COMMISSIONE del 23 settembre 1993 che
    proroga il regolamento (CEE) n. 695/93 recante misure di salvaguardia applicabili
    all' immissione in libera pratica dei prodotti della pesca sbarcati nella Comunità
    da pescherecci di paesi terzi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2622/93 VAN DE COMMISSIE van 23 september 1993 houdende
