  content: '2012/701/EU: Commission Implementing Decision of 13 November 2012 amending
    Decision 2008/185/EC as regards the inclusion of Ireland, Northern Ireland and
    the province of Bolzano in Italy in the list of Member States or regions thereof
    free of Aujeszky’s disease (notified under document C(2012) 7976)'
  type: main
- language: fr
  script: Latn
