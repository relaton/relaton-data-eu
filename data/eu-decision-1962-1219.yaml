---
id: EUDecision19621219
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: "/* Decision nominating the organization representing procedures and workers called upon to draw up lists of candidates from which the members of the Consultative Committee and the persons who will participate in the Committee's proceedings under special arrangements will be appointed */"
  type: main
- language: fr
  script: Latn
  content: Décision portant désignation des organisations représentatives de producteurs
    et de travailleurs appelées à établir les listes de candidats sur lesquelles
    seront nommés les membres du Comité consultatif et les personnes qui participeront,
    sur la base d'un statut particulier, aux travaux de ce comité
  type: main
- language: de
  script: Latn
  content: Entscheidung - Bestimmung der maßgebenden Erzeuger- und Arbeitnehmerorganisationen,
    denen es obliegt, die Kandidatenlisten aufzustellen, auf Grund deren die Mitglieder
    des Beratenden Ausschusses und die Personen zu ernennen sind, die gemäß einem
    besonderen Statut an den Arbeiten dieses Ausschusses teilnehmen
  type: main
- language: da
  script: Latn
  content: Afgørelse om udpegelse af de producent- og arbejdstagerorganisationer,
    der skal udarbejde lister over kandidater, blandt hvilke der skal vælges medlemmer
    af Det Rådgivende Udvalg samt personer, som på grundlag af en særlig status
    skal deltage i dette udvalgs arbejde
  type: main
- language: el
  script: Grek
  content: Απόφαση περί ορισμού των αντιπροσωπευτικών
    οργανώσεων παραγωγών και εργαζομένων που καλούνται
    να καταρτίσουν τους πίνακες υποψηφίων βάσει
    των οποίων θα ορισθούν τα μέλη της συμβουλευτικής
    επιτροπής και τα πρόσωπα που θα συμμετάσχουν,
    βάσει ειδικού καθεστώτος, στις εργασίες της
    επιτροπής αυτής
  type: main
- language: fi
  script: Latn
  content: Päätös tuottajien ja työntekijöiden etujärjestöjen nimeämisestä
    sellaisten ehdokasluettelojen laatimiseksi, joiden perusteella nimetään neuvoa-antavan
    komitean jäsenet sekä komitean työskentelyyn erityisen asemansa perusteella
    osallistuvat henkilöt
  type: main
- language: it
  script: Latn
  content: Decisione relativa alla designazione delle organizzazioni rappresentative
    dei produttori e dei lavoratori, chiamate a disporre le liste dei candidati tra
    cui saranno nominati i membri del comitato consultivo e le persone che parteciperanno,
    in base ad uno status particolare, ai lavori del comitato
  type: main
- language: nl
  script: Latn
  content: Besluit houdende aanwijzing van de representatieve organisaties van producenten
    en werknemers die geroepen zijn de lijsten van kandidaten op te stellen waaruit
    de leden van het Raadgevend Comité zullen worden benoemd alsmede de personen
    die op grond van een bijzonder statuut zullen deelnemen aan de werkzaamheden van
    dit Comité
  type: main
- language: es
  script: Latn
  content: Decisión por la que se designan las organizaciones representativas de
    productores y de trabajadores que deben establecer las listas de candidatos de
    las que serán nombrados los miembros del Comité consultivo y las personas que,
    sobre la base de un estatuto particular, participarán en los trabajos de dicho
    Comité
  type: main
- language: sv
  script: Latn
  content: Beslut om utseende av de representativa tillverkar- och arbetstagarorganisationer
    som skall göra upp de kandidatlistor från vilka skall utses medlemmar i den
    rådgivande kommittén och personer som med särskild status skall delta i den
    kommitténs arbete
  type: main
