    Direktive Vijeća 2002/56/EZ u pogledu datuma utvrđenog člankom 21. stavkom
    3. do kojeg su države članice ovlaštene produžiti valjanost odluka o jednakovrijednosti
    sjemenskog krumpira iz trećih zemalja (priopćeno pod brojem dokumenta C(2024)
    3)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/202 végrehajtási határozata (2024. január 8.)
    a 2002/56/EK tanácsi irányelvnek a harmadik országokból származó vetőburgonya
    egyenértékűségére vonatkozó határozatok időbeli hatályának kiterjesztésére
    a tagállamok számára a 21. cikk (3) bekezdésében megállapított határidő
    tekintetében történő módosításáról (az értesítés a C(2024) 3. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/202 della Commissione, dell’8 gennaio
    2024, che modifica la direttiva 2002/56/CE del Consiglio per quanto riguarda la
    data fissata nell’articolo 21, paragrafo 3, fino alla quale gli Stati membri
    sono autorizzati a prorogare il periodo di validità delle decisioni sull’equivalenza
    dei tuberi-seme di patate provenienti da paesi terzi [notificata con il numero
    C(2024)3]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/202 (2024. gada 8. janvāris),
    ar ko Padomes Direktīvu 2002/56/EK groza attiecībā uz 21. panta 3. punktā
    noteikto datumu, līdz kuram dalībvalstis ir pilnvarotas pagarināt spēkā esamības
    termiņu lēmumiem par trešo valstu izcelsmes sēklas kartupeļu līdzvērtību
    (izziņots ar dokumenta numuru C(2024) 3)
  type: main
- language: lt
  script: Latn
  content: 2024 m. sausio 8 d. Komisijos įgyvendinimo sprendimas (ES) 2024/202, kuriuo
    dėl 21 straipsnio 3 dalyje nurodytos datos, iki kurios valstybėms narėms leidžiama
    pratęsti sprendimų dėl trečiosiose šalyse išaugintų sėklinių bulvių
    lygiavertiškumo galiojimą, iš dalies keičiama Tarybos direktyva 2002/56/EB
    (pranešta dokumentu Nr. C(2024) 3)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/202 tat-8
