    ändring av rådets direktiv 2002/56/EG vad gäller det datum som anges i artikel
    21.3 fram till vilket medlemsstaterna tillåts utsträcka giltigheten för beslut
    om likvärdighet för utsädespotatis från tredjeländer [delgivet med nr C(2024)3]
