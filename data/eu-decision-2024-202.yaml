    от 8 януари 2024 година за изменение на Директива
    2002/56/ЕО на Съвета по отношение на датата, посочена
    в член 21, параграф 3, до която държавите членки
    имат правото да продължават валидността на
    решенията относно равностойността на посадъчен
    материал от картофи от трети държави (нотифицирано
    под номер С(2024) 3)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/202 ze dne 8. ledna 2024, kterým
    se mění směrnice Rady 2002/56/ES, pokud jde o datum stanovené v čl. 21 odst.
    3, do kterého jsou členské státy zmocněny prodloužit dobu platnosti rozhodnutí
    o rovnocennosti sadby brambor ze třetích zemí (oznámeno pod číslem C(2024)3)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/202 af 8. januar 2024
    om ændring af Rådets direktiv 2002/56/EF for så vidt angår datoen i artikel
    21, stk. 3, indtil hvilken medlemsstaterne har bemyndigelse til at forlænge gyldigheden
    af beslutninger om ligestilling af læggekartofler fra tredjelande (meddelt under
    nummer C(2024) 3)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/202 της Επιτροπής,
