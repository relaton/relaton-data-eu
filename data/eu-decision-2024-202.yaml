    stabbilita fl-Artikolu 21(3) sa meta l-Istati Membri huma awtorizzati jestendu
    l-validità tad-deċiżjonijiet dwar l-ekwivalenza tal-patata taż-żrigħ mill-pajjiżi
    terzi (notifikata bid-dokument C(2024) 3)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2024/202 van de Commissie van 8 januari 2024 tot
