    3, vermelde datum tot wanneer de lidstaten de geldigheidsduur van besluiten betreffende
    de gelijkwaardigheid van pootaardappelen uit derde landen mogen verlengen (Kennisgeving
    geschied onder nummer C(2024) 3)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2024/202 z dnia 8 stycznia 2024 r. zmieniająca
    dyrektywę Rady 2002/56/WE w odniesieniu do terminu wyznaczonego w art. 21 ust.
    3, przed upływem którego państwa członkowskie są upoważnione do przedłużenia
    okresu ważności decyzji w sprawie równoważności sadzeniaków pochodzących
    z państw trzecich (notyfikowana jako dokument nr C(2024) 3)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2024/202 da Comissão, de 8 de janeiro de 2024,
    que altera a Diretiva 2002/56/CE do Conselho no que respeita à data estabelecida
    no artigo 21.o, n.o 3, até à qual os Estados-Membros são autorizados a prorrogar
    a eficácia das decisões relativas à equivalência de batatas de semente provenientes
    de países terceiros [notificada com o número C(2024)3]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/202 a Comisiei din 8 ianuarie
    2024 de modificare a Directivei 2002/56/CE a Consiliului în ceea ce privește
    data prevăzută la articolul 21 alineatul (3) până la care statele membre sunt
    autorizate să prelungească perioada de valabilitate a deciziilor referitoare
    la echivalența cartofilor de sămânță proveniți din țări terțe [notificată
    cu numărul C(2024) 3]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2024/202 z 8. januára 2024, ktorým
    sa mení smernica Rady 2002/56/ES, pokiaľ ide o dátum stanovený v článku
    21 ods. 3, do ktorého majú členské štáty povolenie predlžovať platnosť
    rozhodnutí týkajúcich sa rovnocennosti sadiva zemiakov z tretích krajín [oznámené
    pod číslom C(2024)3]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2024/202 z dne 8. januarja 2024 o spremembi
    Direktive Sveta 2002/56/ES glede datuma, določenega v členu 21(3), do katerega
    se državam članicam dovoli podaljšanje veljavnosti odločitev v zvezi z enakovrednostjo
    semenskega krompirja iz tretjih držav (notificirano pod dokumentarno številko
    C(2024) 3)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2024/202 de la Comisión, de 8 de enero de
    2024, por la que se modifica la Directiva 2002/56/CE del Consejo en lo que concierne
    a la fecha establecida en su artículo 21, apartado 3, hasta la cual se autoriza
    a los Estados miembros a prorrogar la validez de las decisiones relativas a la
    equivalencia de las patatas de siembra procedentes de terceros países [notificada
    con el número C(2024) 3]
  type: main
