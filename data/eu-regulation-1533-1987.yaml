title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1533/87 of 2 June 1987 re-establishing the
    levying of customs duties on other woven fabrics of cotton, unbleached or bleached,
    products of category ex 2 (code 40.0023), originating in Indonesia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3925/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1533/87 de la Commission du 2 juin 1987 portant rétablissement
    de la perception des droits de douane applicables aux autres tissus de coton écrus
    ou blanchis, de la catégorie de produits n° ex 2 (code 40.0023), originaires
    de l' Indonésie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1533/87 der Kommission vom 2. Juni 1987 zur Wiedereinführung
    des Zollsatzes für andere Gewebe aus Baumwolle, roh oder gebleicht, der Warenkategorie
    Nr. ex 2 (Kennziffer 40.0023) mit Ursprung in Indonesien, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1533/87 af 2. juni 1987 om genindførelse
    af opkrævning af toldafgifter for andre vævede stoffer af bomuld, ublegede og
    blegede, under varekategori nr. ex 2 (kode 40.0023), som har oprindelse i Indonesien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1533/87 της Επιτροπής
    της 2ας Ιουνίου 1987 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για έτερα υφάσματα
    βαμβακερά, αλεύκαστα ή λευκασμένα της κατηγορίας
    προϊόντων αριθ. ex 2 (κωδικός 40.0023), καταγωγής
    Ινδονησίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3925/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1533/87 della Commissione del 2 giugno 1987 che ripristina
    la riscossione dei dazi doganali applicabili agli altri tessuti di cotone greggi
    o imbianchiti della categoria di prodotti ex 2 (codice 40.0023), originari dell'
    Indonesia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1533/87 van de Commissie van 2 juni 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere weefsels
    van katoen, ongebleekt of gebleekt, van de categorie van produkten nr. ex 2 (codenummer
    40.0023), van oorsprong uit Indonesië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1533/87 da Comissão de 2 de Junho de 1987 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis a outros tecidos de algodão crus
    ou branqueados, da categoria de produtos n.° ex 2 (código 40.0023), originários
    da Indonésia, beneficiária das preferências pautais previstas no Regulamento
    (CEE) n.° 3925/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1533/87 de la Comisión de 2 de junio de 1987 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a otros
    tejidos de algodón, crudos o blanqueados de la categoría de productos ex 2 (código
    40.0023) originarios de Indonesia, beneficiaria de las preferencias arancelarias
    previstas por el Reglamento (CEE) n° 3925/86 del Consejo
