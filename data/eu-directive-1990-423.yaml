id: EUDirective1990423
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 90/423/EEC of 26 June 1990 amending Directive 85/511/EEC
    introducing Community measures for the control of foot-and-mouth disease, Directive
    64/432/EEC on animal health problems affecting intra- Community trade in bovine
    animals and swine and Directive 72/462/EEC on health and veterinary inspection
    problems upon importation of bovine animals and swine and fresh meat or meat products
    from third countries
  type: main
- language: fr
  script: Latn
  content: Directive 90/423/CEE du Conseil, du 26 juin 1990, modifiant la directive
    85/511/CEE établissant des mesures communautaires de lutte contre la fièvre
    aphteuse, la directive 64/432/CEE relative à des problèmes de police sanitaire
    en matière d'échanges intracommunautaires d'animaux des espèces bovine et porcine
    et la directive 72/462/CEE concernant des problèmes sanitaires et de police sanitaire
    lors de l'importation d'animaux des espèces bovine et porcine, de viandes fraîches
    ou de produits à base de viande en provenance de pays tiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/423/EWG des Rates vom 26. Juni 1990 zur Änderung der Richtlinie
    85/511/EWG zur Einführung von Maßnahmen der Gemeinschaft zur Bekämpfung der
    Maul- und Klauenseuche, der Richtlinie 64/432/EWG zur Regelung viehseuchenrechtlicher
    Fragen beim innergemeinschaftlichen Handelsverkehr mit Rindern und Schweinen und
    der Richtlinie 72/462/EWG zur Regelung viehseuchenrechtlicher und gesundheitlicher
    Fragen bei der Einfuhr von Rindern und Schweinen, von frischem Fleisch oder von
    Fleischerzeugnissen aus Drittländern
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 26 юни 1990 година за
    изменение на Директива 85/511/ЕИО относно въвеждане
    на мерки на Общността за борба с болестта шап,
    Директива 64/432/ЕИО относно проблеми, свързани
    със здравето на животните, които засягат търговията
    в Общността с говеда и свине, и Директива 72/462/ЕИО
    относно санитарните и ветеринарно-медицинските
    проблеми при внос на животни от рода на едрия
    рогат добитък и свине, както и на прясно месо
    или месни продукти от трети страни
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 26. června 1990, kterou se mění směrnice 85/511/EHS,
    kterou se zavádějí opatření Společenství pro tlumení kulhavky a slintavky,
    směrnice 64/432/EHS o veterinárních otázkách obchodu se skotem a prasaty
    uvnitř Společenství a směrnice 72/462/EHS o veterinárních a hygienických
    otázkách dovozu skotu, prasat a čerstvého masa nebo masných výrobků ze
    třetích zemí (90/423/EHS)
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 90/423/EØF af 26. juni 1990 om ændring af direktiv 85/511/EØF
    om fællesskabsforanstaltninger til bekæmpelse af mund- og klovesyge, direktiv
    64/432/EØF om veterinærpolitimæssige problemer ved handel inden for Fællesskabet
    med kvæg og svin og direktiv 72/462/EØF om sundhedsmæssige og veterinærpolitimæssige
    problemer i forbindelse med indførsel af kvæg og svin samt fersk kød og kødprodukter
    fra tredjelande
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/423/ΕΟΚ του Συμβουλίου της 26ης Ιουνίου
    1990 για την τροποποίηση της οδηγίας 85/511/ΕΟΚ
    σχετικά με τη θέσπιση κοινοτικών μέτρων καταπολέμησης
    του αφθώδους πυρετού, της οδηγίας 64/432/ΕΟΚ περί
    προβλημάτων υγειονομικού ελέγχου στον τομέα
    των ενδοκοινοτικών συναλλαγών βοοειδών και
    χοιροειδών και της οδηγίας 72/462/ΕΟΚ περί των
    υγειονομικών προβλημάτων και των υγειονομικών
    μέτρων κατά τις εισαγωγές ζώων του βοείου και
    χοιρείου είδους, νωπών κρεάτων και προϊόντων
    με βάση το κρέας προέλευσης τρίτων χωρών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 90/423/EÜ 26. juuni 1990, millega muudetakse direktiivi
    85/511/EMÜ, millega kehtestatakse ühenduse meetmed suu- ja sõrataudi tõrjeks,
    direktiivi 64/432/EMÜ ühendusesisest veiste ja sigadega kauplemist mõjutavate
    loomatervishoiu probleemide kohta ning direktiivi 72/462/EMÜ tervishoiu ja veterinaarinspektsiooni
    probleemide kohta veiste, sigade, värske liha ja lihatoodete impordil kolmandatest
    riikidest
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 90/423/ETY, annettu 26 päivänä kesäkuuta 1990,
    yhteisön toimenpiteistä suu- ja sorkkataudin torjumiseksi annetun direktiivin
    85/511/ETY, eläinten terveyteen liittyvistä ongelmista yhteisön sisäisessä
    nautaeläinten ja sikojen kaupassa annetun direktiivin 64/432/ETY sekä terveyttä
    ja eläinten terveyttä koskevista ongelmista nautaeläinten ja sikojen sekä
    tuoreen lihan tai lihatuotteiden tuonnissa kolmansista maista annetun direktiivin
    72/462/ETY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: '90/423/EEZ: Direktiva Vijeća od 26. lipnja 1990. o izmjeni Direktive
    85/511/EEZ o uvođenju mjera Zajednice za kontrolu bolesti slinavke i šapa, Direktive
    64/432/EEZ o zdravstvenim problemima životinja koji utječu na trgovinu govedima
    i svinjama unutar Zajednice i Direktive 72/462/EEZ o problemima u vezi sa zdravstvenim
    i veterinarskim pregledima pri uvozu goveda, svinja te svježeg mesa iz trećih
    zemalja'
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1990. június 26.) a ragadós száj- és körömfájás
    elleni védekezésre irányuló közösségi intézkedések bevezetéséről szóló
    85/511/EGK irányelv, a szarvasmarhafélék és sertések Közösségen belüli
    kereskedelmét befolyásoló állat-egészségügyi problémákról szóló 64/432/EGK
    irányelv, valamint a szarvasmarhafélék, a sertés, továbbá a friss hús vagy
    a húsipari termékek harmadik országokból történő behozatala kapcsán felmerülő
    egészségügyi, valamint állatorvosi vizsgálattal kapcsolatos problémákról
    szóló 72/462/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 90/423/CEE del Consiglio, del 26 giugno 1990, recante modifica
    della direttiva 85/511/CEE che stabilisce misure comunitarie di lotta contro l'afta
    epizootica, della direttiva 64/432/CEE relativa a problemi di polizia sanitaria
    in materia di scambi intracomunitari di animali delle specie bovina e suina e
    della direttiva 72/462/CEE relativa a problemi sanitari e di polizia sanitaria
    all'importazione di animali della specie bovina e suina e di carni fresche o di
    prodotti a base di carne in provenienza dai paesi terzi
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1990. gada 26. jūnijs), ar kuru izdara grozījumus
    Direktīvā 85/511/EEK, ar ko ievieš Kopienas pasākumus mutes un nagu sērgas
    pārbaudei, Direktīvā 64/432/EEK par dzīvnieku veselības problēmām, kas
    ietekmē liellopu un cūku tirdzniecību Kopienā un Direktīvā 72/462/EEK par
    veselības un veterinārās pārbaudes problēmām, ievedot liellopus, cūkas
    un svaigu gaļu no trešām valstīm
  type: main
- language: lt
  script: Latn
  content: 1990 m. birželio 26 d. Tarybos Direktyva iš dalies keičianti Direktyvą
    85/511/EEB dėl Bendrijos snukio ir nagų ligos kontrolės priemonių įdiegimo,
    Direktyvą 64/432/EEB dėl gyvūnų sveikatos problemų, turinčių įtakos Bendrijos
    vidaus prekybai galvijais ir kiaulėmis, ir Direktyvą 72/462/EEB dėl sveikatos
    ir veterinarinio patikrinimo problemų importuojant galvijus, kiaules ir šviežią
    mėsą arba mėsos produktus iš trečiųjų šalių
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tas-26 ta’ Ġunju 1990 li temenda d-Direttiva
    85/511/KEE li tintroduċi miżuri Komunitarji għall-kontroll tal-marda ta’
    l-ilsien u tad-dwiefer, id-Direttiva 64/432/KEE dwar il-problemi tas-saħħa ta’
    l-annimali li jaffetwaw kummerċ intra-Komunitarju f’annimali bovini u suwini
    u d-Direttiva 72/462/KEE dwar problemi ta’ spezzjoni tas-saħħa u veterinarji
    ma’ l-importazzjoni ta’ annimali bovini u suwini u laħam frisk jew prodotti
    tal-laħam minn pajjiżi terzi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/423/EEG van de Raad van 26 juni 1990 tot wijziging van Richtlijn
    85/511/EEG tot vaststelling van gemeenschappelijke maatregelen ter bestrijding
    van mond- en klauwzeer, Richtlijn 64/432/EEG inzake veterinairrechtelijke vraagstukken
    op het gebied van het intracommunautaire handelsverkeer in runderen en varkens
    en Richtlijn 72/462/EEG inzake gezondheidsvraagstukken en veterinairrechtelijke
    vraagstukken bij de invoer van runderen en varkens en van vers vlees en vleesprodukten
    uit derde landen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 26 czerwca 1990 r. zmieniająca dyrektywę 85/511/EWG
    wprowadzającą wspólnotowe środki zwalczania pryszczycy, dyrektywę 64/432/EWG
    w sprawie problemów zdrowotnych zwierząt wpływających na handel wewnątrzwspólnotowy
    bydłem i trzodą chlewną oraz dyrektywę 72/462/EWG w sprawie problemów zdrowotnych
    i inspekcji weterynaryjnej przed przywozem z państw trzecich bydła, trzody chlewnej
    i świeżego mięsa
  type: main
- language: pt
  script: Latn
  content: Directiva 90/423/CEE do Conselho, de 26 de Junho de 1990, que altera a
    Directiva 85/511/CEE, que estabelece medidas comunitárias de luta contra a febre
    aftosa, a Directiva 64/432/CEE, relativa a problemas de fiscalização sanitária
    em matéria de comércio intracomunitário de animais das espécies bovina e suína,
    e a Directiva 72/462/CEE, relativa a problemas sanitários e de polícia sanitária
    na importação de animais das espécies bovina e suína, de carnes frescas ou
    de produtos a base de carne provenientes de países terceiros
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 26 iunie 1990 de modificare a Directivei 85/511/CEE
    de stabilire a măsurilor comunitare de combatere a febrei aftoase, a Directivei
    64/432/CEE privind problemele de inspecție veterinară care afectează schimburile
    intracomunitare cu bovine și porcine și a Directivei 72/462/CEE privind problemele
    de sănătate și inspecție veterinară care apar cu ocazia importurilor de animale
    din speciile bovină și porcină, respectiv de carne proaspătă provenind din
    țări terțe
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 26. júna 1990, ktorou sa menia a dopĺňajú smernica
    85/511/EHS o zavedení opatrení spoločenstva na boj proti slintačke a krívačke,
    smernica 64/432/EHS o veterinárnych problémoch pri obchodovaní s hovädzím
    a bravčovým dobytkom vnútri spoločenstva a smernica 72/462/EHS o problémoch
    zdravotných a veterinárnych prehliadok pri dovozoch hovädzieho dobytka, ošípaných,
    čerstvého mäsa a mäsových výrobkov z tretích krajín
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 26. junija 1990 o spremembi Direktive 85/511/EGS
    o uvedbi ukrepov Skupnosti za obvladovanje slinavke in parkljevke, Direktive 64/432/EGS
    o problemih v zvezi z zdravstvenim varstvom živali, ki vplivajo na trgovino z
    govedom in prašiči med državami članicami Evropske skupnosti, in Direktive
    72/462/EGS o problemih glede zdravstvenih in veterinarskih pregledov ob uvozu
    goveda in prašičev ter svežega mesa iz tretjih držav
  type: main
- language: es
  script: Latn
  content: Directiva 90/423/CEE del Consejo, de 26 de junio de 1990, por la que se
    modifican la Directiva 85/511/CEE por la que se establecen medidas comunitarias
    de lucha contra la fiebre aftosa, la Directiva 64/432/CEE relativa a problemas
    de policía sanitaria en materia de intercambios intracomunitarios de animales
    de las especies bovina y porcina y la Directiva 72/462/CEE relativa a problemas
    sanitarios y de policía sanitaria en las importaciones de animales de las especies
    bovina y porcina, de carnes frescas o de productos a base de carne procedentes
    de terceros países
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 90/423/EEG av den 26 juni 1990 om ändring av direktiv
    85/511/EEG om införande av gemenskapsåtgärder för bekämpning av mul- och
    klövsjuka, direktiv 64/432/EEG om djurhälsoproblem som påverkar handeln med
    nötkreatur och svin inom gemenskapen samt direktiv 72/462/EEG om hälsoproblem
    och problem som rör veterinärbesiktning vid import från tredje land av nötkreatur,
    svin och färskt kött eller köttvaror
  type: main
