    jäsenvaltion alueella keskeytymättä kahden vuoden ajan palkattuina maataloustyöntekijöinä
    työskennelleiden muiden jäsenvaltioiden kansalaisten osalta
  type: main
- language: it
  script: Latn
  content: Direttiva 63/261/CEE del Consiglio del 2 aprile 1963 che fissa le modalità
    per l'attuazione nel settore agricolo della libertà di stabilimento nel territorio
    di uno Stato membro dei cittadini degli altri paesi della Comunità che abbiano
    lavorato come salariati agricoli in detto Stato membro per due anni consecutivi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 63/261/EEG van de Raad van 2 april 1963 tot vaststelling van
    de wijze waarop de vrijheid van vestiging in de landbouw op het grondgebied van
    een Lid- Staat wordt verwezenlijkt voor onderdanen van de andere landen van de
    Gemeenschap, die gedurende twee jaar zonder onderbreking als werknemers in de
    landbouw in deze Lid-Staat werkzaam zijn geweest
  type: main
- language: pt
  script: Latn
