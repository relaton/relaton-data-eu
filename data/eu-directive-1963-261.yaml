title:
- language: en
  script: Latn
  content: Council Directive 63/261/EEC of 2 April 1963 laying down detailed provisions
    for the attainment of freedom of establishment in agriculture in the territory
    of a Member State in respect of nationals of other countries of the Community
    who have been employed as paid agricultural workers in that Member State for a
    continuous period of two years
  type: main
- language: fr
  script: Latn
  content: Directive 63/261/CEE du Conseil, du 2 avril 1963, fixant les modalités
    de réalisation de la liberté d'établissement dans l'agriculture sur le territoire
    d'un État membre des ressortissants des autres pays de la Communauté ayant travaillé
    en qualité de salariés agricoles dans cet État membre pendant deux années
    sans interruption
  type: main
- language: de
  script: Latn
  content: Richtlinie 63/261/EWG des Rates vom 2. April 1963 über die Einzelheiten
    für die Verwirklichung der Niederlassungsfreiheit in der Landwirtschaft im Hoheitsgebiet
    eines Mitgliedstaats für Angehörige der anderen Länder der Gemeinschaft, die
    als landwirtschaftliche Arbeitnehmer zwei Jahre lang ohne Unterbrechung in diesem
    Mitgliedstaat gearbeitet haben
  type: main
- language: da
  script: Latn
  content: Rådets 63/261/EØF direktiv af 2. april 1963 om de nærmere regler for
    gennemførelse af etableringsfrihed inden for landbruget på en medlemsstats område
    for statsborgere fra Fællesskabets øvrige lande, der har arbejdet i to år uden
    afbrydelse som arbejdstagere inden for landbruget i denne medlemsstat
  type: main
