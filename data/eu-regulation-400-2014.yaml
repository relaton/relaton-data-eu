title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 400/2014 of 22 April 2014 concerning
    a coordinated multiannual control programme of the Union for 2015, 2016 and 2017
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 400/2014 de la Commission du 22 avril
    2014 concernant un programme de contrôle, pluriannuel et coordonné, de l'Union
    pour 2015, 2016 et 2017, destiné à garantir le respect des teneurs maximales
    en résidus de pesticides dans et sur les denrées alimentaires d'origine végétale
    et animale et à évaluer l'exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 400/2014 der Kommission vom 22. April
    2014 über ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2015,
    2016 und 2017 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 400/2014 на Комисията
    от 22 април 2014 година относно координирана многогодишна
    контролна програма на Съюза за 2015, 2016 и 2017 г.
    за гарантиране спазването на максимално допустимите
    граници на остатъчни вещества от пестициди
    във и върху храни от животински и растителен
    произход и за оценка на потребителската експозиция
    на тези остатъчни вещества
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 400/2014 ze dne 22. dubna 2014
    o koordinovaném víceletém kontrolním programu Unie pro roky 2015, 2016 a 2017
    s cílem zajistit dodržování maximálních limitů reziduí pesticidů v potravinách
    rostlinného a živočišného původu a na jejich povrchu a vyhodnotit expozici
    spotřebitelů těmto reziduím pesticidů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 400/2014 af 22. april
    2014 om et samordnet flerårigt EU-kontrolprogram for 2015, 2016 og 2017 med det
    formål at sikre overholdelse af maksimalgrænseværdierne for pesticidrester
    i og på vegetabilske og animalske fødevarer og at vurdere forbrugernes eksponering
    for disse rester
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 400/2014
    της Επιτροπής, της 22ας Απριλίου 2014 , για ένα
    συντονισμένο πολυετές πρόγραμμα ελέγχου της
    Ένωσης για τα έτη 2015, 2016 και 2017 ώστε να εξασφαλιστεί
    συμμόρφωση με τα ανώτατα όρια καταλοίπων φυτοφαρμάκων
    και να εκτιμηθεί η έκθεση του καταναλωτή στα
