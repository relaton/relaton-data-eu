    vastavus pestitsiidijääkide piirnormidele ja hinnata tarbijate kokkupuudet taimses
    ja loomses toidus või selle pinnal esinevate pestitsiidijääkidega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 400/2014, annettu 22 päivänä
    huhtikuuta 2014 , unionin yhteensovitetusta monivuotisesta valvontaohjelmasta
    vuosiksi 2015, 2016 ja 2017 kasvi- ja eläinperäisissä elintarvikkeissa ja niiden
    pinnalla olevien torjunta-ainejäämien enimmäismäärien noudattamisen varmistamiseksi
    ja kuluttajien kyseisille torjunta-ainejäämille altistumisen arvioimiseksi
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 400/2014 оd 22. travnja 2014. o koordiniranom
    višegodišnjem programu kontrole Unije za 2015., 2016. i 2017. kako bi se osigurala
    sukladnost s maksimalnim razinama ostataka pesticida i ocijenila izloženost potrošača
    ostacima pesticida u i na hrani biljnog i životinjskog podrijetla
  type: main
- language: hu
  script: Latn
  content: A Bizottság 400/2014/EU végrehajtási rendelete ( 2014. április 22.
    ) a 2015., 2016. és 2017. évre vonatkozó, a növényi és állati eredetű
    élelmiszerekben, illetve azok felületén található növényvédőszer-maradékok
    határértékeinek való megfelelés biztosítására, valamint a fogyasztók
    ilyen növényvédőszer-maradékokból eredő expozíciójának értékelésére
    irányuló, többéves összehangolt uniós ellenőrzési programról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 400/2014 della Commissione, del 22 aprile
    2014 , relativo a un programma coordinato di controllo pluriennale dell'Unione
    per il 2015, il 2016 e il 2017, destinato a garantire il rispetto dei livelli
    massimi di residui di antiparassitari e a valutare l'esposizione dei consumatori
    ai residui di antiparassitari nei e sui prodotti alimentari di origine vegetale
    e animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 400/2014 ( 2014. gada 22. aprīlis
    ) par saskaņotu Savienības daudzgadu kontroles programmu 2015., 2016. un 2017.
    gadam, lai nodrošinātu atbilstību maksimāli pieļaujamajiem pesticīdu atlieku
    līmeņiem augu un dzīvnieku izcelsmes pārtikā un uz tās un novērtētu šo
    atlieku iedarbību uz patērētājiem
  type: main
- language: lt
  script: Latn
  content: 2014 m. balandžio 22 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 400/2014
    dėl 2015, 2016 ir 2017 m. suderintos daugiametės Sąjungos kontrolės programos,
    skirtos užtikrinti, kad nebūtų viršijama didžiausia leidžiamoji pesticidų
    liekanų koncentracija augaliniuose ir gyvūniniuose maisto produktuose bei ant
    jų, ir pesticidų liekanų poveikiui vartotojams įvertinti
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) Nru 400/2014 tat-
    22 ta' April 2014 dwar programm multiannwali tal-Unjoni kkoordinat u ta' kontroll
    għall-2015, l-2016 u l-2017 biex tiġi żgurata konformità mal-livelli massimi
    ta' residwi ta' pestiċidi fi u fuq ikel li joriġina mill-pjanti u mill-annimali
    u biex jivvaluta l-esponiment tal-konsumatur għalihom
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 400/2014 van de Commissie van 22 april
    2014 inzake een in 2015, 2016 en 2017 uit te voeren gecoördineerd meerjarig controleprogramma
    van de Unie tot naleving van de maximumgehalten aan bestrijdingsmiddelenresiduen
    en ter beoordeling van de blootstelling van de consument aan bestrijdingsmiddelenresiduen
    in en op levensmiddelen van plantaardige en dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 400/2014 z dnia 22 kwietnia
    2014 r. dotyczące wieloletniego skoordynowanego unijnego programu kontroli na
    lata 2015, 2016 i 2017, mającego na celu zapewnienie zgodności z najwyższymi
    dopuszczalnymi poziomami pozostałości pestycydów w żywności pochodzenia roślinnego
    i zwierzęcego oraz na jej powierzchni, a także mającego na celu ocenę narażenia
    konsumenta na te pozostałości
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. °400/2014 da Comissão, de 22 de abril
    de 2014 , relativo a um programa de controlo coordenado plurianual da União para
    2015, 2016 e 2017, destinado a garantir o respeito dos limites máximos de resíduos
    de pesticidas no interior e à superfície dos alimentos de origem vegetal e animal
    e a avaliar a exposição dos consumidores a estes resíduos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 400/2014 al Comisiei din 22
    aprilie 2014 privind un program de control multianual și coordonat al Uniunii
    pentru 2015, 2016 și 2017 de asigurare a respectării limitelor maxime de reziduuri
    de pesticide și de evaluare a expunerii consumatorilor la reziduurile de pesticide
    din și de pe alimentele de origine vegetală și animală
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 400/2014 z 22. apríla 2014 o
    koordinovanom viacročnom kontrolnom programe Únie na roky 2015, 2016 a 2017
    s cieľom zabezpečiť dodržiavanie maximálnych hladín rezíduí pesticídov
    a posúdiť vystavenie spotrebiteľov rezíduám pesticídov v potravinách rastlinného
    a živočíšneho pôvodu a na nich
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 400/2014 z dne 22. aprila 2014 o usklajenem
    večletnem programu nadzora Unije za leta 2015, 2016 in 2017 za zagotavljanje
    skladnosti z mejnimi vrednostmi ostankov pesticidov v živilih rastlinskega in
    živalskega izvora in na njih ter oceno izpostavljenosti potrošnikov ostankom
    teh pesticidov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n °400/2014 de la Comisión, de 22 de abril
    de 2014 , relativo a un programa plurianual coordinado de control de la Unión
    para 2015, 2016 y 2017 destinado a garantizar el respeto de los límites máximos
    de residuos de plaguicidas en los alimentos de origen vegetal y animal y a evaluar
    el grado de exposición de los consumidores a estos residuos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 400/2014 av den 22 april
    2014 om ett samordnat flerårigt kontrollprogram för unionen för 2015, 2016
    och 2017 för att säkerställa att gränsvärdena för bekämpningsmedelsrester
    följs och för att bedöma konsumenternas exponering för bekämpningsmedelsrester
    i och på livsmedel av vegetabiliskt och animaliskt ursprung
