    FG72 × A5547-127, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 o geneticky modifikovaných potravinách
    a krmivech (oznámeno pod číslem C(2017) 9043)
  type: main
