    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 om genetisk modificerede
    fødevarer og foderstoffer (meddelt under nummer C(2017) 9043)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/2451 της Επιτροπής,
