    abból álló vagy abból előállított termékek forgalomba hozatalának a géntechnológiával
    módosított élelmiszerekről és takarmányokról szóló 1829/2003/EK európai
    parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2017) 9043. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/2451 della Commissione, del 21 dicembre
