    costituiti od ottenuti a partire da soia geneticamente modificata FG72 × A5547-127
    a norma del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    relativo agli alimenti e ai mangimi geneticamente modificati [notificata con il
    numero C(2017) 9043]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/2451 (2017. gada 21. decembris),
