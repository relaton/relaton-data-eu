title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/2451 of 21 December 2017 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified soybean FG72 × A5547-127, pursuant to Regulation (EC) No
    1829/2003 of the European Parliament and of the Council on genetically modified
    food and feed (notified under document C(2017) 9043)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/2451 de la Commission du 21 décembre
    2017 autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié FG72 × A5547-127, consistant en ce soja ou produits à partir de celui-ci,
    en application du règlement (CE) n° 1829/2003 du Parlement européen et du Conseil
    concernant les denrées alimentaires et les aliments pour animaux génétiquement
    modifiés [notifiée sous le numéro C(2017) 9043]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/2451 der Kommission vom 21. Dezember
    2017 über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderte Sojabohnen der Sorte FG72 × A5547-127 enthalten, aus ihnen bestehen
    oder aus ihnen hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des
    Europäischen Parlaments und des Rates über genetisch veränderte Lebensmittel
    und Futtermittel (Bekannt gegeben unter Aktenzeichen C(2017) 9043)
  type: main
- language: bg
  script: Cyrl
