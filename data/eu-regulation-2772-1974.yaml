id: EURegulation27721974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2772/74 of the Commission of 30 October 1974 re-establishing
    the levying of customs duties on waste of man-made fibres, falling within heading
    No 56.03, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3505/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2772/74 de la Commission, du 30 octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux déchets
    de fibres textiles synthétiques et artificielles, de la position tarifaire 56.03,
    originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3505/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2772/74 der Kommission vom 30. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Abfälle von synthetischen und künstlichen Spinnstoffen,
    der Tarifnummer 56.03, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3505/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2772/74 af 30. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for affald af kemofibre under position 56.03, som
    har oprindelse i Jugoslavien og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3505/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2772/74 della Commissione, del 30 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai cascami di fibre tessili
    sintetiche ed artificiali della voce doganale n. 56.03 originari della Jugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3505/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2772/74 van de Commissie van 30 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op afval van
    synthetische of van kunstmatige vezels, van post 56.03, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3505/73 van de Raad van 18 december
    1973 tariefpreferenties werden geopend
  type: main
