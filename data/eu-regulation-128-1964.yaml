title:
- language: fr
  script: Latn
  content: Règlement n° 128/64/CEE de la Commission, du 29 septembre 1964, fixant
    la qualité minimale à laquelle le blé tendre ou le seigle doivent répondre
    pour être considérés comme propres à la consommation humaine
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 128/64/EWG der Kommission vom 29. September 1964 zur Bestimmung
    der Mindestqualität, von der an Weichweizen oder Roggen als für die menschliche
    Ernährung geeignet angesehen wird
  type: main
- language: it
  script: Latn
  content: Regolamento n. 128/64/CEE della Commissione, del 29 settembre 1964, che
    fissa la qualità minima, cui devono corrispondere il grano tenero o la segala
    per essere considerati come adatti al consumo umano
  type: main
- language: nl
  script: Latn
  content: Verordening no. 128/64/EEG van de Commissie van 29 september 1964 houdende
    vaststelling van de minimumkwaliteit waaraan zachte tarwe of rogge moeten voldoen
    om geschikt geacht te worden voor menselijke consumptie
  type: main
