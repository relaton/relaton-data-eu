    DDA (DDACarbonate) lena húsáid i dtáirgí bithicídeacha de chineál táirge
    8 i gcomhréir le Rialachán (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus
    ón gComhairle
  type: main
- language: hr
  script: Latn
