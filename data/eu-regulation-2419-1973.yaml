title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2419/73 of the Commission of 3 September 1973 re-establishing
    Common Customs Tariff duties on building board falling within heading No 48.09,
    originating in developing countries to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2419/73 de la Commission, du 3 septembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux plaques pour construction, de la position tarifaire 48.09, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2419/73 der Kommission vom 3. September 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Bauplatten aus Papierhalbstoff
    der Tarifnummer 48.09 mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2419/73 af 3. september 1973 om genindførelse
    af told ifølge den fælles toldtarif for byggeplader under position 48.09, som
    har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2419/73 della Commissione, del 3 settembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    lastre per costruzioni della voce doganale n. 48.09 originarie dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2419/73 van de Commissie van 3 september 1973 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor platen voor constructiedoeleinden, van post 48.09, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 tariefpreferenties werden geopend
  type: main
