- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1937/87 of 3 July 1987 re-establishing the
    levying of customs duties on woven breeches, shorts and trousers, products of
    category 6 (code 40.0060) originating in Argentina to which the preferential tariff
    arrangements of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1937/87 de la Commission du 3 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux culottes,
    shorts et pantalons, de la catégorie de produits n° 6 (code 40.0060), originaires
    d' Argentine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1937/87 der Kommission vom 3. Juli 1987 zur Wiedereinführung
