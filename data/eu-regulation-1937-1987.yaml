    40.0060) mit Ursprung in Argentinien, dem die in der Verordnung (EWG) Nr. 3925/86
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1937/87 af 3. juli 1987 om genindførelse
