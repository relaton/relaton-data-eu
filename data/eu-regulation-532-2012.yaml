    landen of delen daarvan met betrekking tot hoogpathogene aviaire influenza
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 532/2012 z dnia 21 czerwca 2012
    r. zmieniające załącznik II do decyzji 2007/777/WE i załącznik I do rozporządzenia
    (WE) nr 798/2008 w odniesieniu do pozycji dotyczących Izraela w wykazach państw
    trzecich lub ich części w związku z wysoce zjadliwą grypą ptaków
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 532/2012 da Comissão, de 21 de junho
