title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 532/2012 of 21 June 2012 amending
    Annex II to Decision 2007/777/EC and Annex I to Regulation (EC) No 798/2008 as
    regards entries for Israel in the lists of third countries or parts thereof with
    respect to highly pathogenic avian influenza
  type: main
- language: fr
