    (CE) n. ° 798/2008 no atinente às entradas respeitantes a Israel nas listas
    de países terceiros ou partes de países terceiros relativamente à gripe aviária
    de alta patogenicidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 532/2012 al Comisiei din 21
    iunie 2012 de modificare a anexei II la Decizia 2007/777/CE și a anexei I la
    Regulamentul (CE) nr. 798/2008 în ceea ce privește rubricile referitoare la
    Israel din listele cu țările terțe sau părți ale acestora, cu privire la
    gripa aviară înalt patogenă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 532/2012 z 21. júna 2012 , ktorým
