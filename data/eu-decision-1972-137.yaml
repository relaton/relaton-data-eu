title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 février 1972, autorisant la République
    française à exclure du traitement communautaire les champignons cultivés, surgelés,
    déshydratés, préparés ou conserves sans vinaigre ou acide acétique, des positions
    07.02 Ex B, 07.04 Ex B et 20.02 Ex A du Tarif douanier commun, originaires de
    Taiwan et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/137/EWG: Entscheidung der Kommission vom 22. Februar 1972, mit der
    die Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Champignons, gefroren, getrocknet,
    zubereitet oder haltbar gemacht, ohne Essig, der Tarifnummern 07.02 ex B. 07.04
    ex B und 20.02 ex A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/137/CEE: Decisione della Commissione, del 22 febbraio 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i funghi coltivati,
    surgelati, disidratati, preparati o conservati senza aceto o acido acetico delle
    voci nn. 07.02 ex B, 07.04 ex B e 20.02 ex A della tariffa doganale comune, originari
    di Taiwan e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/137/EEG: Beschikking van de Commissie van 22 februari 1972 waarbij
    de Franse Republiek wordt gemachtigd gekweekte paddestoelen, ingevroren, gedroogd,
    geprepareerd of houdbaar gemaakt zonder azijn of azijnzuur van de posten 07.02
    ex B. 07.04 ex B en 20.02 ex A van het gemeenschappelijk douanetarief, van oorsprong
    uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
