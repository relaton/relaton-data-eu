id: EUDecision198432
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '84/32/EEC: Commission Decision of 6 January 1984 establishing that the
    apparatus described as ''MTS - Servo Hydraulic Wavemaker System consisting of:
    Waveboard Assembly, Waveboard Steel Reaction Frame, Wiper Seal Liner Subsystem,
    Waveboard Bearing Assemblies, Seal System, Static Actuators with Hydraulic Cushion,
    Dynamic Actuators, Analog Control System, Hydraulic Distribution System, Drain
    Water System'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/32/CEE: Décision de la Commission du 6 janvier 1984 constatant que
    l''importation de l''appareil dénommé "MTS - Servo Hydraulic Wavemaker System
    consisting of: Waveboard Assembly, Waveboard Steel Reaction Frame, Wiper Seal
    Liner Subsystem, Waveboard Bearing Assemblies, Seal System, Static Actuators with
    Hydraulic Cushion, Dynamic Actuators, Analog Control System, Hydraulic Distribution
    System, Drain Water System" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '84/32/EWG: Entscheidung der Kommission vom 6. Januar 1984, mit der festgestellt
    wird, daß das Gerät ,,M.T.S. - Servo Hydraulic Wavemaker System, consisting
    of: Waveboard Assembly, Waveboard Steel Reaction Frame, Wiper Seal Liner Subsystem,
    Waveboard Bearing Assemblies, Seal System, Static Actuators with hydraulic Cushion,
    Dynamic Actuators, Analog Control System, Hydraulic Distribution System, Drain
    Water System" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '84/32/EØF: Kommissionens beslutning af 6. januar 1984 om fastslåelse
    af, at indførsel af apparatet "M.T.S. - Servo hydraulic wavemaker system consisting
    of: waveboard assembly, waveboard steel reaction frame, wiper seal liner subsystem,
    waveboard bearing assemblies, seal system, static actuators with hydraulic cushion,
    dynamic actuators, analog control system, hydraulic distribution system, drain
    water system" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '84/32/ΕΟΚ: Απόφαση της Επιτροπής της 6ης Ιανουαρίου
    1984 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «MTS — Servo Hydraulic Wavemaker System consisting
    of: Waveboard Assembly, Waveboard Steel Reaction Frame, Wiper Seal Liner Subsystem,
    Waveboard Bearing Assemblies, Seal System, Static Actuators with Hydraulic Cushion,
    Dynamic Actuators, Analog Control System, Hydraulic Distribution System, Drain
    Water System» δύναται να πραγματοποιηθεί ατελώς
    ως προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '84/32/CEE: Decisione della Commissione del 6 gennaio 1984 che stabilisce
    che l''importazione dell''apparecchio denominato "MTS - Servo Hydraulic Wavemaker
    System consisting of: Waveboard Assembly, Waveboard Steel Reaction Frame, Wiper
    Seal Liner Subsystem, Waveboard Bearing Assemblies, Seal System, Static Actuators
    with Hydraulic Cushion, Dynamic Actuators, Analog Control System, Hydraulic Distribution
    System, Drain Water System" può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '84/32/EEG: Beschikking van de Commissie van 6 januari 1984 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,M.T.S. - Servo hydraulic wavemaker system
    consisting of: waveboard assembly, waveboard steel reaction frame, wiper seal
    liner subsystem, waveboard bearing assemblies, seal system, static actuators with
    hydraulic cushion, dynamic actuators, analog control system, hydraulic distribution
    system, drain water system" met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
