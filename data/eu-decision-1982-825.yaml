  content: '82/825/EEC: Commission Decision of 23 November 1982 amending Decision
    82/351/EEC recognizing certain parts of the territory of the Federal Republic
    of Germany as being officially swine fever freer (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/825/CEE: Décision de la Commission, du 23 novembre 1982, modifiant
    la décision 82/351/CEE reconnaissant certaines parties du territoire de la République
    fédérale d''Allemagne comme étant officiellement indemnes de peste porcine
    (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
