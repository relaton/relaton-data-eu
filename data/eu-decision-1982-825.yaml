    der Entscheidung 82/351/EWG, durch die bestimmte Teile des Hoheitsgebiets der
    Bundesrepublik Deutschland amtlich als schweinepestfrei anerkannt werden (Nur
    der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/825/EØF: Kommissionens beslutning af 23. november 1982 til ændring
