title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1952/89 of 30 June 1989 fixing for the 1989/90
    marketing year the minimum price to be paid to producers for Williams and Rocha
    pears and the amount of production aid for such pears in syrup and/or in natural
    fruit juice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1952/89 de la Commission du 30 juin 1989 fixant, pour
    la campagne 1989/1990, le prix minimal à payer aux producteurs pour les poires
    Williams et Rocha ainsi que le montant de l'aide à la production pour ces poires
    au sirop et/ou au jus naturel de fruit
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1952/89 DER KOMMISSION vom 30. Juni 1989 zur Festsetzung
    des den Erzeugern von Williams- und Rocha-Birnen zu zahlenden Mindestpreises sowie
    der Produktionsbeihilfe für diese Birnen in Sirup und/oder natürlichem Fruchtsaft
    im Wirtschaftsjahr 1989/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1952/89 af 30. juni 1989 om fastsættelse
    af den minimumspris, der skal betales producenten for Williams- og Rocha-pærer,
    samt producentstøtten for disse pærer i sukkeropløsning og/eller i naturlig
    frugtsaft i produktionsåret 1989/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1952/89 της Επιτροπής
    της 30ής ιουνίου 1989 που καθορίζει, για την περίοδο
    εμπορίας 1989/90 την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τα αχλάδια Williams και Rocha
    και το ποσό της ενίσχυσης στην παραγωγή γι'
    αυτά τα αχλάδια σε σιρόπι ή/και σε φυσικό χυμό
    φρούτου
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1952/89 DELLA COMMISSIONE del 30 giugno 1989 che
    fissa, per la campagna di commercializzazione 1989/1990, il prezzo minimo da pagare
    ai produttori di pere Williams e Rocha e l'' importo dell'' aiuto alla produzione
    di tali pere sciroppate e/o conservate al succo naturale di frutta #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1952/89 VAN DE COMMISSIE van 30 juni 1989 tot vaststelling,
