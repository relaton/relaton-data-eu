    te betalen minimumprijs, alsmede van het bedrag van de steun bij de produktie
    van deze peren op siroop en/of op natuurlijk vruchtesap #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1952/89 DA COMISSÃO de 30 de Junho de 1989 que
