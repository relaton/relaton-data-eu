    aos produtores para as peras Williams e o montante da ajuda à produção para
    as peras Williams e Rocha em calda e/ou em sumo natural de frutas #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1952/89 DE LA COMISIÓN de 30 de junio de 1989 por
