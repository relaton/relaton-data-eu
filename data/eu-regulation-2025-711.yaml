    a curcanilor pentru îngrășat, autorizarea unui preparat de endo-1,4-beta-xilanază
    produsă de Trichoderma reesei MUCL 49755 și de endo-1,3(4)-beta-glucanază produsă
    de Trichoderma reesei MUCL 49754 ca aditiv pentru hrana purceilor de lapte (titularul
    autorizației: Aveve BV) și de abrogare a Regulamentelor de punere în aplicare
    (UE) nr. 1088/2011, (UE) nr. 989/2012 și (UE) nr. 1040/2013'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2025/711 z 10. apríla 2025 o obnovení
    povolenia prípravku s obsahom endo-1,4-beta-xylanázy produkovanej mikroorganizmom
    Trichoderma reesei MUCL 49755 a endo-1,3(4)-beta-glukanázy produkovanej mikroorganizmom
    Trichoderma reesei MUCL 49754 ako kŕmnej doplnkovej látky pre odstavené prasiatka,
    nosnice, menej významné druhy hydiny na znášku a vo výkrme, ošípané všetkých
    druhov čeľade Suidae vo výkrme a morky vo výkrme, o povolení prípravku s
    obsahom endo-1,4-beta-xylanázy produkovanej mikroorganizmom Trichoderma reesei
    MUCL 49755 a endo-1,3(4)-beta-glukanázy produkovanej mikroorganizmom Trichoderma
    reesei MUCL 49754 ako kŕmnej doplnkovej látky pre ciciaky (držiteľ povolenia:
    Aveve BV) a o zrušení vykonávacích nariadení (EÚ) č. 1088/2011, (EÚ) č.
    989/2012 a (EÚ) č. 1040/2013'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2025/711 z dne 10. aprila 2025 o podaljšanju
    dovoljenja za pripravek iz endo-1,4-beta-ksilanaze, proizvedene s Trichoderma
    reesei MUCL 49755, in endo-1,3(4)-beta-glukanaze, proizvedene s Trichoderma reesei
    MUCL 49754, kot krmni dodatek za odstavljene pujske, kokoši nesnice, manj pomembne
    vrste perutnine za nesnice in za pitanje, prašiče za pitanje vseh vrst Suidae
    in purane za pitanje, dovoljenja za pripravek iz endo-1,4-beta-ksilanaze, proizvedene
    s Trichoderma reesei MUCL 49755, in endo-1,3(4)-beta-glukanaze, proizvedene s
    Trichoderma reesei MUCL 49754, kot krmni dodatek za sesne pujske (imetnik dovoljenja:
    AVEVE BV) ter razveljavitvi izvedbenih uredb (EU) št. 1088/2011, (EU) št. 989/2012
    in (EU) št. 1040/2013'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2025/711 de la Comisión, de 10 de abril
    de 2025, relativo a la renovación de la autorización de un preparado de endo-1,4-beta-xilanasa
    producida con Trichoderma reesei MUCL 49755 y endo-1,3(4)-beta-glucanasa producida
    con Trichoderma reesei MUCL 49754 como aditivo para piensos destinado a lechones
    destetados, gallinas ponedoras, especies menores de aves de corral ponedoras y
    de engorde, cerdos de engorde de todas las especies de suidos y pavos de engorde,
    a la autorización de un preparado de endo-1,4-beta-xilanasa producida con Trichoderma
    reesei MUCL 49755 y endo-1,3(4)-beta-glucanasa producida con Trichoderma reesei
    MUCL 49754 como aditivo para piensos destinado a lechones lactantes (titular de
    la autorización: AVEVE BV) y por el que se derogan los Reglamentos de Ejecución
    (UE) n.o 1088/2011, (UE) n.o 989/2012 y (UE) n.o 1040/2013'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2025/711 av den 10 april 2025
    om förlängning av godkännandet av ett preparat av endo-1,4-beta-xylanas framställt
    med Trichoderma reesei MUCL 49755 och endo-1,3(4)-beta-glukanas framställt med
    Trichoderma reesei MUCL 49754 som fodertillsats för avvanda smågrisar, värphöns,
    mindre vanligt förekommande fjäderfäarter avsedda för värpning och slakt,
    slaktsvin av alla arter av Suidae och slaktkalkoner och om godkännande av ett
    preparat av endo-1,4-beta-xylanas framställt med Trichoderma reesei MUCL 49755
    och endo-1,3(4)-beta-glukanas framställt med Trichoderma reesei MUCL 49754 som
    fodertillsats för diande smågrisar (innehavare av godkännandet: AVEVE BV) samt
    om upphävande av genomförandeförordningarna (EU) nr 1088/2011, (EU) nr 989/2012
    och (EU) nr 1040/2013'
  type: main
