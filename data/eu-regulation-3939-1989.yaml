title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3939/89 of 18 December 1989 laying down for
    1990 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non- member countries in the
    200 nautical mile zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3939/89 du Conseil du 18 décembre 1989 fixant, pour
    1990, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de certains pays tiers dans la zone de
    200 milles située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3939/89 DES RATES vom 18. Dezember 1989 ueber Massnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestaende in der 200-Meilen-Zone vor
    der Kueste des franzoesischen Departements Guyana gegenueber Schiffen unter der
    Flagge bestimmter Drittlaender (1990)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3939/89 af 18. december 1989 om fastsættelse
    af en række foranstaltninger for 1990 til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3939/89 του Συμβουλίου
    της 18ης Δεκεμβρίου 1989 για τον καθορισμό, για
    το 1990, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    εντός της ζώνης 200 μιλίων η οποία ευρίσκεται
    στα ανοικτά των ακτών του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3939/89 DEL CONSIGLIO del 18 dicembre 1989 che stabilisce,
    per il 1990, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3939/89 VAN DE RAAD van 18 december 1989 houdende
    maatregelen voor 1990 voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3939/89 DO CONSELHO de 18 de Dezembro de 1989 que
    fixa, para 1990, certas medidas de conservaçao e de gestao dos recursos da pesca
    aplicaveis aos navios que arvoram pavilhao de certos paises terceiros na zona
    de 200 milhas situada ao largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3939/89 DEL CONSEJO de 18 de diciembre de 1989 por
    el que se establecen, para 1990, determinadas medidas de conservacion y gestion
    de los recursos pesqueros aplicables a los buques que enarbolen pabellon de determinados
    terceros paises en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
  type: main
