    no respeitante à fixação de teores máximos de resíduos dos pesticidas formotião,
    dimetoato e oxidemetão-metilo à superfície e no interior dos cereais, dos géneros
    alimentícios de origem animal e de determinados produtos de origem vegetal, incluindo
    frutas e produtos hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/71/CE a Comisiei din 19 august 2002 de modificare a anexelor
    la Directivele 76/895/CEE, 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului
    în ceea ce privește stabilirea conținuturilor maxime de reziduuri de pesticide
    (formotion, dimetoat și oxidemeton-metil) din și de pe cereale, alimente de
    origine animală și anumite produse de origine vegetală, inclusiv fructe și
    legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2002/71/ES z 19. augusta 2002, ktorou sa menia a dopĺňajú
    prílohy smerníc Rady 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení
    maximálnych limitov rezíduí pesticídov (formotión, dimetoát a oxydemeton-metyl)
    v a na obilninách, potravinách živočíšneho pôvodu a určitých produktoch
    rastlinného pôvodu vrátane ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/71/ES z dne 19. avgusta 2002 o spremembah prilog
    k direktivam Sveta 76/895/EGS, 86/362/EGS, 86/363/EGS in 90/642/EGS glede določanja
    najvišjih dovoljenih vrednosti ostankov pesticidov (formotion, dimetoat in oksidemeton-metil)
    v in na žitih, živilih živalskega izvora in nekaterih proizvodih rastlinskega
    izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/71/CE de la Comisión, de 19 de agosto de 2002, por la que
    se modifican los anexos de las Directivas del Consejo 76/895/CEE, 86/362/CEE,
    86/363/CEE y 90/642/CEE en lo relativo a la fijación de los límites máximos
    de residuos de plaguicidas (formotión, dimetoato y oxidemetón-metilo) sobre
    y en los cereales, en los productos alimenticios de origen animal y en determinados
    productos de origen vegetal, incluidas las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/71/EG av den 19 augusti 2002 om ändring av
