  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2002/71/EÜ, 19. august 2002, millega muudetakse lisasid
    nõukogu direktiivides 76/895/EMÜ, 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ teraviljas,
    loomses toidus ja teatavates taimsetes toiduainetes, kaasa arvatud puu- ja köögiviljas,
    sisalduvate ja nende pinnal esinevate pestitsiidide (formotioon, dimetoaad ja
    metüüloksüdemeteoon) jääkide piirnormide kehtestamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2002/71/EY, annettu 19 päivänä elokuuta 2002, neuvoston
    direktiivien 76/895/ETY, 86/362/ETY, 86/363/ETY ja 90/642/ETY liitteiden muuttamisesta
    viljoissa ja niiden pinnassa, eläinkunnasta peräisin olevissa elintarvikkeissa
    ja niiden pinnassa sekä tietyissä kasvikunnasta peräisin olevissa tuotteissa,
    mukaan luettuina hedelmät ja vihannekset, ja niiden pinnassa olevien torjunta-ainejäämien
    (formotioni, dimetoaatti ja oksidemetoni-metyyli) enimmäismäärien vahvistamisen
    osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/71/EK irányelve (2002. augusztus 19.) a gabonafélékben,
    az állati eredetű élelmiszerekben, illetőleg az egyes növényi eredetű termékekben
    – többek között a gyümölcsökben és zöldségekben –, illetve azok felületén
    található (formotion, dimetoát és oxidemeton-metil) peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározására tekintettel a 76/895/EGK,
    86/362/EGK, 86/363/EGK, illetőleg 90/642/EGK tanácsi irányelv mellékleteinek
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2002/71/CE della Commissione, del 19 agosto 2002, recante modifica
    degli allegati delle direttive 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE
    del Consiglio per quanto concerne la fissazione delle quantità massime di residui
    di antiparassitari (formotion, dimetoato e ossidemeton-metile) sui e nei cereali,
    sui e nei prodotti alimentari di origine animale e su e in alcuni prodotti di
    origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2002/71/EK (2002. gada 19. augusts), ar kuru groza
    pielikumus Padomes Direktīvās 76/895/EEK, 86/362/EEK, 86/363/EEK un 90/642/EEK
    par pesticīdu atliekvielvielu (formotiona, dimetoāta un oksidemetonmetila) maksimāli
    pieļaujamo daudzumu noteikšanu labībā un uz tās, dzīvnieku izcelsmes pārtikas
    produktos un uz tiem, un dažos augu izcelsmes produktos, tajā skaitā augļos
    un dārzeņos, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. rugpjūčio 19 d. Komisijos direktyva 2002/71/EB, iš dalies keičianti
    Tarybos direktyvų 76/895/EEB, 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl didžiausių
    pesticidų likučių (formotiono, dimetoato ir metiloksidemetono) koncentracijų
    atitinkamai grūduose, gyvūninės kilmės maisto produktuose ir tam tikruose
    augalinės kilmės produktuose ir ant jų, įskaitant vaisius ir daržoves, nustatymo
    priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/71/KE tad-19 ta’ Awissu 2002 li temenda
