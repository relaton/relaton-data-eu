    76/895/ΕΟΚ, 86/362/ΕΟΚ, 86/363/ΕΟΚ και 90/642/ΕΟΚ του Συμβουλίου
    όσον αφορά τον καθορισμό των ανώτατων ορίων
    υπολειμμάτων φυτοφαρμάκων (formothion, dimethoate και
    oxydemeton-methyl) πάνω και μέσα στα σιτηρά, στα τρόφιμα
    ζωικής προέλευσης και σε ορισμένα προϊόντα
    φυτικής προέλευσης, συμπεριλαμβανομένων των
