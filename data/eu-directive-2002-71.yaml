title:
- language: en
  script: Latn
  content: Commission Directive 2002/71/EC of 19 August 2002 amending the Annexes
    to Council Directives 76/895/EEC, 86/362/EEC, 86/363/EEC and 90/642/EEC as regards
    the fixing of maximum levels for pesticide residues (formothion, dimethoate and
    oxydemeton-methyl) in and on cereals, foodstuffs of animal origin and certain
    products of plant origin, including fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2002/71/CE de la Commission du 19 août 2002 modifiant les annexes
    des directives 76/895/CEE, 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil en
    ce qui concerne la fixation de teneurs maximales pour les résidus de pesticides
    (formothion, diméthoate et oxydéméton-méthyl) sur et dans les céréales,
    les denrées alimentaires d'origine animale et certains produits d'origine végétale,
    y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/71/EG der Kommission vom 19. August 2002 zur Änderung
    der Anhänge der Richtlinien 76/895/EWG, 86/362/EWG, 86/363/EWG und 90/642/EWG
    des Rates hinsichtlich der Festsetzung von Höchstgehalten an Rückständen von
    Schädlingsbekämpfungsmitteln (Formothion, Dimethoat und Oxydemeton-methyl) auf
    und in Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/71/EИО на Комисията от 19 август
    2002 година за изменение на приложенията към
    Директиви 76/895/EИО, 86/362/EEC, 86/363/E и 90/642/EИО на Съвета
    за определяне на максимални количества на
    остатъци от пестициди (формотион, диметоат
    и оксидеметон-метил) във и върху зърнени култури,
    храни от животински произход и някои продукти
    от растителен произход, включително плодове
    и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/71/ES ze dne 19. srpna 2002, kterou se mění přílohy
    směrnic Rady 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS, pokud jde o stanovení
    maximálních limitů reziduí pesticidů (formothionu, dimethoátu a oxydemetonmethylu)
    v obilovinách, v potravinách živočišného původu a v některých produktech
    rostlinného původu, včetně ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2002/71/EF af 19. august 2002 om ændring af bilagene
    til Rådets direktiv 76/895/EØF, 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester (formothion, dimethoat
    og oxydemeton-methyl) i og på korn, levnedsmidler af animalsk oprindelse og visse
    produkter af vegetabilsk oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2002/71/ΕΚ της Επιτροπής, της 19ης Αυγούστου
