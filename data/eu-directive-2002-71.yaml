  content: Richtlĳn 2002/71/EG van de Commissie van 19 augustus 2002 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 76/895/EEG, 86/362/EEG, 86/363/EEG en 90/642/EEG
    van de Raad betreffende de vaststelling van maximumgehalten aan residuen van bestrĳdingsmiddelen
    (formothion, dimethoaat en oxydemeton-methyl) in en op granen, levensmiddelen
    van dierlĳke oorsprong en bepaalde producten van plantaardige oorsprong, met
    inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2002/71/WE z dnia 19 sierpnia 2002 r. zmieniająca załączniki
    do dyrektyw Rady 76/895/EWG, 86/362/EWG, 86/363/EWG i 90/642/EWG w zakresie ustalania
    najwyższych dopuszczalnych poziomów pozostałości pestycydów (formotionu,
    dimetoatu i oksydemetonu metylowego) w zbożach, środkach spożywczych pochodzenia
    zwierzęcego i niektórych produktach pochodzenia roślinnego, w tym owocach i
    warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/71/CE da Comissão, de 19 de Agosto de 2002, que altera
