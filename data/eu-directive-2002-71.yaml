    rigward l-iffissar tal-livelli massimi tal-fdalijiet ta’ pestiċidi (formothion,
    dimethoate u oxydemeton-methyl) fi u fuq ċereali, prodotti ta' l-ikel ta’ oriġini
    ta' l-annimali u ċerti prodotti ta’ oriġini veġetali, inklużi frott u ħxejjex
  type: main
