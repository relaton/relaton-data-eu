    πόρων που εφαρμόζονται στα σκάφη υπό νορβηγική
    σημαία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 4195/88 DEL CONSIGLIO del 21 dicembre 1988 che stabilisce,
