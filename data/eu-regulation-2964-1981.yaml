title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2964/81 of 15 October 1981 laying down detailed
    rules for the application of the additional measures applicable to holders of
    long-term storage contracts for table wine for the 1980/81 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2964/81 de la Commission, du 15 octobre 1981, établissant
    les modalités d' application des mesures complémentaires réservées aux détenteurs
    de contrats de stockage à long terme des vins de table pour la campagne 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2964/81 der Kommission vom 15. Oktober 1981 zur Festlegung
    der Durchführungsbestimmungen für die Inhabern langfristiger Lagerverträge
    für Tafelweine vorbehaltenen ergänzenden Maßnahmen für das Wirtschaftsjahr
    1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2964/81 af 15. oktober 1981 om gennemførelsesbestemmelser
    for de supplerende foranstaltninger, der er forbeholdt indehavere af langfristede
    oplagringskontrakter for bordvin for produktionsåret 1980/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2964/81 τής Επιτροπής
    τής 15ης Οκτωβρίου 1981 περί καθορισμού τών λεπτομερειών
    εφαρμογής τών συμπληρωματικών μέτρων τά οποία
    επιφυλάσσονται στούς έχοντες υπογράψει συμβάσεις
    μακροπρόθεσμης αποθεματοποιήσεως επιτραπέζιων
    οίνων γιά τήν περίοδο εμπορίας 1980/81
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2964/81 della Commissione, del 15 ottobre 1981, che
    stabilisce le modalità di applicazione delle misure complementari riservate ai
    titolari di contratti di magazzinaggio a lungo termine dei vini da tavola per
    la campagna 1980/1981
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2964/81 van de Commissie van 15 oktober 1981 tot
    vaststelling van de bepalingen ter uitvoering van de aanvullende maatregelen ten
    behoeve van degenen die voor het wijnoogstjaar 1980/1981 langlopende opslagcontracten
    voor tafelwijn hebben gesloten
  type: main
