  script: Latn
  content: Commission Delegated Regulation (EU) 2022/247 of 14 December 2021 amending
    Regulation (EU) 2018/956 of the European Parliament and of the Council as regards
    the data on new heavy-duty vehicles to be monitored and reported by Member States
    and by manufacturers and the reporting procedure
  type: main
- language: fr
