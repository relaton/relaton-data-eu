    inden for zoner, der ikke er godkendt med hensyn til infektiøs hæmatopoietisk
    nekrose og egtvedsyge, og om ophævelse af beslutning 98/359/EF og 2000/310/EF
    (EØS-relevant tekst) (meddelt under nummer K(2001) 1895)'
  type: main
- language: el
  script: Grek
