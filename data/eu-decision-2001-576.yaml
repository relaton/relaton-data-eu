title:
- language: en
  script: Latn
  content: '2001/576/EC: Commission Decision of 13 July 2001 approving the programmes
    submitted by Italy for obtaining the status of approved zones and of farms in
    non-approved zones with regard to infectious haematopoietic necrosis and viral
    haemorrhagic septicaemia and repealing Commission Decisions 98/359/EC and 2000/310/EC
    (Text with EEA relevance) (notified under document number C(2001) 1895)'
  type: main
- language: fr
  script: Latn
  content: '2001/576/CE: Décision de la Commission du 13 juillet 2001 portant approbation
    des programmes présentés par l''Italie en vue d''obtenir le statut de zone agréée
    et d''exploitation agréée située dans une zone non agréée en ce qui concerne
    la nécrose hématopoïétique infectieuse et la septicémie hémorragique virale
    et portant abrogation des décisions 98/359/CE et 2000/310/CE (Texte présentant
    de l''intérêt pour l''EEE) [notifiée sous le numéro C(2001) 1895]'
  type: main
- language: de
  script: Latn
  content: '2001/576/EG: Entscheidung der Kommission vom 13. Juli 2001 zur Genehmigung
    der von Italien vorgelegten Programme zur Erlangung des Status zugelassener Gebiete
    und zugelassener Betriebe in nicht zugelassenen Gebieten hinsichtlich der infektiösen
    hämatopoetischen Nekrose und der viralen hämorrhagischen Septikämie sowie zur
    Aufhebung der Entscheidungen 98/359/EG und 2000/310/EG (Text von Bedeutung für
    den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 1895)'
  type: main
- language: da
  script: Latn
  content: '2001/576/EF: Kommissionens beslutning af 13. juli 2001 om godkendelse
