title:
- language: en
  script: Latn
  content: Council Decision (EU) 2018/1486 of 28 September 2018 on the position to
    be taken on behalf of the European Union within the Customs Sub-Committee established
    by the Association Agreement between the European Union and its Member States,
    of the one part, and Ukraine, of the other part, as regards the replacement of
    Protocol I to that Agreement, concerning the definition of the concept of ‘originating
    products’ and methods of administrative cooperation, by a new protocol which
    refers to the Regional Convention on pan-Euro-Mediterranean preferential rules
    of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2018/1486 du Conseil du 28 septembre 2018 relative à la
    position à prendre au nom de l'Union européenne au sein du sous-comité douanier
    institué par l'accord d'association entre l'Union européenne et ses États membres,
    d'une part, et l'Ukraine, d'autre part, à l'égard du remplacement du protocole
    I de cet accord, concernant la définition de la notion de «produits originaires»
    et les méthodes de coopération administrative, par un nouveau protocole qui
    fait référence à la convention régionale sur les règles d'origine préférentielles
    paneuro-méditerranéennes
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2018/1486 des Rates vom 28. September 2018 über den Standpunkt,
    der im Namen der Europäischen Union im Zoll-Unterausschuss, der gemäß dem Assoziierungsabkommen
    zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits und der
    Ukraine andererseits eingesetzt wurde, hinsichtlich der Ersetzung des Protokolls
    Nr. I dieses Abkommens über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung
    in“ oder „Ursprungserzeugnisse“ und über die Methoden der Zusammenarbeit
    der Verwaltungen durch ein neues Protokoll, das hinsichtlich der Ursprungsregeln
    auf das Regionale Übereinkommen über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    Bezug nimmt, zu vertreten ist
  type: main
