title:
- language: en
  script: Latn
  content: '80/41/EEC: Commission Decision of 30 November 1979 on the granting by
    the Guidance Section of the EAGGF to the French Republic of a payment on account
    in respect of expenditure incurred during 1978 on aids for the less- favoured
    farming areas (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/41/CEE: Décision de la Commission, du 30 novembre 1979, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République française d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les aides en faveur des zones agricoles
    défavorisées (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/41/EWG: Entscheidung der Kommission vom 30. November 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 in benachteiligten landwirtschaftlichen Gebieten gewährten Hilfen an die
    Französische Republik (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/41/EØF: Kommissionens beslutning af 30. november 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til Den franske Republik af et acontobeløb
