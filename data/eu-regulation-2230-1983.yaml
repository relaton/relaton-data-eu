title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2230/83 of 3 August 1983 re-establishing
    the levying of customs duties on lithium oxide and lithium hydroxide, falling
    within subheading 28.28 B and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2230/83 de la Commission du 3 août 1983 portant rétablissement
    de la perception des droits de douane applicables à l' oxyde de lithium et hydroxyde
    de lithium, de la sous-position 28.28 B du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2230/83 der Kommission vom 3. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Lithiumoxid und Lithiumhydroxid der Tarifstelle 28.28
    B, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2230/83 af 3. august 1983 om genindførelse
    af opkrævning af told for lithiumoxid og lithiumhydroxid, henhørende under pos.
    28.28 B og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2230/83 της Επιτροπής
