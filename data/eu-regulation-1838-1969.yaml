title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1838/69 of the Council of 16 September 1969 laying
    down general rules for granting export refunds on the various added sugars in
    products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1838/69 du Conseil, du 16 septembre 1969, établissant,
    pour le secteur des produits transformés à base de fruits et légumes, les règles
    générales relatives à l' octroi des restitutions à l' exportation au titre
    des sucres divers d' addition
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1838/69 des Rates vom 16. September 1969 zur Festlegung
    der allgemeinen Regeln für die Gewährung von Ausfuhrerstattungen für die Verarbeitungserzeugnissen
    aus Obst und Gemüse zugesetzten Zuckerarten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1838/69 af 16. september 1969 om fastlæggelse
    af almindelige regler om ydelse af eksportrestitutioner for så vidt angår de
    til forarbejdede produkter af frugt og grønsager tilsatte sukkerarter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1838/69 del Consiglio, del 16 settembre 1969, che
    stabilisce per il settore dei prodotti trasformati a base di ortofrutticoli le
    norme generali relative alla concessione delle restituzioni all' esportazione
    per gli zuccheri diversi addizionati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1838/69 van de Raad van 16 september 1969 houdende
    vaststelling, in de sector van op basis van groenten en fruit verwerkte produkten,
    van de algemene voorschriften inzake de restitutie bij de uitvoer voor de verschillende
    soorten toegevoegde suiker
  type: main
