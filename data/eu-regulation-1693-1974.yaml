title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1693/74 of the Commission of 25 June 1974 determining
    the amounts of the variable components and compensatory amounts, and the additional
    duties applicable, during the third quarter of 1974 to the goods covered by Regulation
    (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1693/74 de la Commission du 25 juin 1974, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant le troisième trimestre de l'année
    1974, aux marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1693/74 der Kommission vom 25. Juni 1974 zur Festsetzung
    der Höhe der im dritten Vierteljahr 1974 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge, Ausgleichsbeträge
    und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1693/74 af 25. juni 1974 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    varer henhørende under forordning (EØF) nr. 1059/69 i tredje kvartal 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1693/74 della Commissione, del 25 giugno 1974, che
    determina gli importi degli elementi mobili e degli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per il terzo trimestre 1974,
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1693/74 van de Commissie van 25 juni 1974 tot vaststelling
    van de gedurende het derde kwartaal van 1974 bij invoer van onder Verordening
    (EEG) nr. 1059/69 vallende goederen toe te passen variabele elementen, compenserende
    bedragen "toetreding" alsmede aanvullende invoerrechten
