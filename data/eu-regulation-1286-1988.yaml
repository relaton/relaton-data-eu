title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1286/88 of 10 May 1988 re-establishing the
    levying of customs duties on men' s or boys' suits and ensembles, other than knitted
    or crocheted, products of category 16 (order No 40.0160; trousers, bib overalls,
    breeches and shorts, knitted or crocheted, products of category 28 (order No 40.0280),
    originating in Thailand, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1286/88 de la Commission du 10 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux costumes, complets et ensembles,
    autres que de bonneterie pour hommes et garçonnets de la catégorie de produits
    n° 16 (n° d' ordre 40.0160), et aux pantalons, salopettes, culottes et shorts
    en bonneterie, de la catégorie de produits n° 28 (n° d' ordre 40.0280), originaires
    de Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1286/88 der Kommission vom 10. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Anzüge und Kombinationen, andere als aus Gewirken, für Männer
    und Knaben, der Warenkategorie Nr. 16 (lfd. Nr. 40.0160) sowie lange Hosen (einschließlich
    Kniebundhosen und ähnliche Hosen), Latzhosen und kurze Hosen, aus Gewirken, der
    Warenkategorie Nr. 28 (lfd. Nr. 40.0280) mit Ursprung in Thailand, dem die in
    der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1286/88 af 10. maj 1988 om genindførelse
    af opkrævning af toldafgifter for jakkesæt, ikke af trikotage, til mænd og
    drenge under varekategori nr. 16 (løbenummer 40.0160) benklæder, overalls, shorts
    og andre korte benklæder af trikotage og under varekategori nr. 28 (løbenummer
    40.0280), som har oprindelse i Thailand og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1286/88 της Επιτροπής
    της 10ης Μαΐου 1988 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για κοστούμια και σύνολα
    εκτός από τα πλεκτά για άντρες και αγόρια προϊόντα
    της κατηγορίας 16 (αύξων αριθμός 40.0160), παντελόνια,
    ποδιές, κιλότες, πλεκτά, προϊόντα της κατηγορίας
    28, (αύξων αριθμός 40.0280), καταγωγής Ταϊλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3783/87 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1286/88 della Commissione del 10 maggio 1988 che ripristina
    la riscossione dei dazi doganali applicabili ai vestiti, completi e insiemi, esclusi
    quelli a maglia, per uomo e per ragazzo, della categoria di prodotti n. 16 (numero
    d' ordine 40.0160), ai pantaloni, calzoncini e short a maglia, della categoria
    di prodotti n. 28 (numero d' ordine 40.0280), originari della Tailandia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1286/88 van de Commissie van 10 mei 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties, andere dan van brei- of haakwerk, voor heren en jongens, van de
    categorie van produkten nr. 16 (volgnummer 40.0160) en lange broeken, korte broeken
    en shorts, van brei- of haakwerk, van de categorie van produkten nr. 28 (volgnummer
    40.0280), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3783/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1286/88 da Comissão de 10 de Maio de 1988 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis ao fatos completos e conjuntos,
    excluindo os de malha, para homens e rapazes, da categoria de produtos n.° 16
    (n.° de ordem 40.0160), às calças, fatos-macacos, calções e shorts, em malha,
    da categoria de produtos n.° 28 (n.° de ordem 40.0280), originários da Tailândia,
    beneficiária das preferências pautais previstas no Regulamento (CEE) n.° 3783/87
    do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1286/88 de la Comisión de 10 de mayo de 1988 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los trajes completos y conjuntos, que no sean de punto, para hombres y niños,
    de la categoría n° 16 (número de orden 40.0160), y a los pantalones, pantalones
    de peto y "shorts", de punto, de la categoría n° 28 (número de orden 40.0280),
    originarios de Tailandia, beneficiaria de las preferencias arancelarias previstas
    por el Reglamento (CEE) n° 3783/87 del Consejo
