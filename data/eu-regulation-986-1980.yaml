id: EURegulation9861980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 986/80 of 22 April 1980 re-etablishing the
    levying of customs duties on fabrics and other articles of asbestos, falling within
    subheadings 68.13 B II and III and originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 986/80 de la Commission, du 22 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux tissus et
    aux autres ouvrages en amiante des sous-positions 68.13 B II, III du tarif douanier
    commun, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 986/80 der Kommission vom 22. April 1980 zur Wiedereinführung
    des Zollsatzes für Gewebe und andere Waren aus Asbest der Tarifstellen 68.13
    B II und III, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 986/80 af 22. april 1980 om genindførelse
    af opkrævning af toldafgifter for vævet stof og andre varer af asbest, under
    pos. 68.13 B II og III, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 986/80 della Commissione, del 22 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti ed altri lavori
    di amianto, delle sottovoci 68.13 B II e III della tariffa doganale comune, originari
    della Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 986/80 van de Commissie van 22 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    en andere werken van asbest, van de posten 68.13 B II en III, van oorsprong uit
    Zuid-Korea ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
