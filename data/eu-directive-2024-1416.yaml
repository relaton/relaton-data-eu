    félvezető chipeken közvetlenül elhelyezett hullámhossz-átalakító (downshifting)
    kvantumpontokban lévő kadmium mentesítése tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2024/1416 della Commissione, del 13 marzo 2024,
    che modifica la direttiva 2011/65/UE del Parlamento europeo e del Consiglio per
    quanto riguarda un’esenzione relativa al cadmio nei punti quantici per il downshift
    direttamente depositati su chip semiconduttori LED
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2024/1416 (2024. gada 13. marts)
