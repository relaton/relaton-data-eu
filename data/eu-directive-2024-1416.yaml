    uz atbrīvojumu kadmijam lejuppārbīdi izraisošos kvantu punktos, kas novietoti
    tieši uz LED pusvadītāju mikroshēmām
  type: main
- language: lt
  script: Latn
  content: 2024 m. kovo 13 d. Komisijos deleguotoji direktyva (ES) 2024/1416, kuria
