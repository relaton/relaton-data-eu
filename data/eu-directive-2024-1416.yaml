    jde o výjimku pro kadmium v kvantových obrazových bodech pro konverzi vlnové
    délky přímo uložených na polovodičové čipy LED
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2024/1416 af 13. marts 2024 om ændring
    af Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse
    for cadmium i kvanteøer, der kan downshifte, som anbringes direkte på LED-halvlederchips
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2024/1416 της
    Επιτροπής, της 13ης Μαρτίου 2024, για την τροποποίηση
    της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
