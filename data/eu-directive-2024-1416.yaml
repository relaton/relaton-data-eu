    kvantiniuose taškuose, tiesiogiai dedamuose ant LED puslaidininkių lustų, iš
    dalies keičiama Europos Parlamento ir Tarybos direktyva 2011/65/ES
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2024/1416 tat-13 ta’ Marzu 2024
    li temenda d-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-kadmju f’punti kwantistiċi għal bidla fil-frekwenza
    tad-dawl li jgħaddi minnhom iddepożitat direttament fuq ċipep semikondutturi
    LED
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2024/1416 van de Commissie van 13 maart 2024
    tot wijziging van Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat
    betreft een vrijstelling voor cadmium in rechtstreeks op ledchips geplaatste halfgeleider-nanokristal-kwantumpunten
    om de lichtgolflengte om te zetten (downshifting)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2024/1416 z dnia 13 marca 2024 r. zmieniająca
    dyrektywę Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    dla kadmu w konwertujących w dół kropkach kwantowych umieszczonych bezpośrednio
    na chipach półprzewodnikowych LED
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2024/1416 da Comissão, de 13 de março de 2024,
    que altera a Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção relativa ao uso de cádmio nos pontos quânticos para conversão
    descendente depositados diretamente sobre os circuitos integrados semicondutores
    LED
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2024/1416 a Comisiei din 13 martie 2024 de modificare
    a Directivei 2011/65/UE a Parlamentului European și a Consiliului în ceea ce
    privește o derogare pentru cadmiul din punctele cuantice pentru conversia de
    lungime de undă (downshifting) depuse direct pe cipurile semiconductoare din
    leduri
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2024/1416 z 13. marca 2024, ktorou sa
    mení smernica Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    platnú pre kadmium v kvantových bodoch s konverziou vlnových dĺžok (downshifting)
    uložených priamo na polovodičových čipoch LED
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2024/1416 z dne 13. marca 2024 o spremembi
    Direktive 2011/65/EU Evropskega parlamenta in Sveta glede izjeme za kadmij v kvantnih
    pikah za pretvorbo navzdol, nanesenih neposredno na čipe LED
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2024/1416 de la Comisión, de 13 de marzo de 2024,
    por la que se modifica la Directiva 2011/65/UE del Parlamento Europeo y del Consejo
    en lo que respecta a una exención para el uso de cadmio en puntos cuánticos
    para reducir la frecuencia fotónica depositados directamente en chips semiconductores
    de led
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2024/1416 av den 13 mars 2024 om
