    2011/65/ЕС на Европейския парламент и на Съвета
    по отношение на освобождаване за кадмий в понижаващи
    честотата квантови точки, поставени директно
    върху светодиодни полупроводникови интегрални
    схеми
  type: main
- language: cs
  script: Latn
