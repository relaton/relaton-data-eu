  script: Latn
  content: Commission Delegated Directive (EU) 2024/1416 of 13 March 2024 amending
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for cadmium in downshifting quantum dots directly deposited on LED
    semiconductor chips
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2024/1416 de la Commission du 13 mars 2024 modifiant
    la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative au cadmium dans les boîtes quantiques pour conversion
    de longueur d’onde (downshifting) déposées directement sur les puces semi-conductrices
    de DEL
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2024/1416 der Kommission vom 13. März 2024
    zur Änderung der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates
    im Hinblick auf eine Ausnahme für Cadmium in direkt auf LED-Halbleiterchips angebrachten
    Quantenpunkten zur Wellenlängenwandlung
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2024/1416 на Комисията
