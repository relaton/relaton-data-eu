    osin kuin on kyse kadmiumin käyttöä suoraan led-puolijohdesirujen päälle
    asetettavissa valon taajuutta alentavissa kvanttipisteissä koskevasta poikkeuksesta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2024/1416 ón gCoimisiún an 13 Márta 2024 lena
