    a bhaineann le díolúine le haghaidh caidmiam i bponcanna candamacha íslitheacha
    a shil-leagtar go díreach ar shliseanna leathsheoltóra LED
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2024/1416 оd 13. ožujka 2024. o izmjeni
    Direktive 2011/65/EU Europskog parlamenta i Vijeća u pogledu izuzeća za kadmij
    u kvantnim točkama za promjenu valnih duljina koji se izravno nanosi na LED poluvodičke
    čipove
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1416 felhatalmazáson alapuló irányelve (2024.
