    du code NC 8521 originaires de Singapour, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 963/93 der Kommission vom 22. April 1993 zur Wiedereinführung
