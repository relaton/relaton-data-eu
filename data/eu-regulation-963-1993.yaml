title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 963/93 of 22 April 1993 re- establishing
    the levying of the customs duties on products falling within CN code 8521, originating
    in Singapore, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 963/93 de la Commission, du 22 avril 1993, portant
