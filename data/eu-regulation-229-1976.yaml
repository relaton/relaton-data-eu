    bestimmte Aschen und Rückstände von Kupfer sowie für bestimmte Bearbeitungsabfälle
    und bestimmten Schrott aus Kupfer und Aluminium
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 229/76 af 2. februar 1976 om fordeling
