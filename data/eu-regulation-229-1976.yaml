    à l'exportation pour certains résidus et cendres de cuivre ainsi que pour certains
    déchets et débris de cuivre et d'aluminium
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 229/76 der Kommission vom 2. Februar 1976 zur Aufteilung
