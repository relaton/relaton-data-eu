title:
- language: fr
  script: Latn
  content: Règlement n 162/64/CEE de la Commission, du 29 octobre 1964, limitant
    jusqu'au 31 mars 1965 le montant maximum de la restitution applicable aux exportations
    vers les États membres de certains produits transformés à base de céréales
    et de riz
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 162/64/EWG der Kommission vom 29. Oktober 1964 zur Beschränkung
    bis zum 31. März 1965 des Höchstbetrags der Erstattung bei der Ausfuhr bestimmter
    Getreide- und Reisverarbeitungserzeugnisse nach den Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 162/64/CEE della Commissione, del 29 ottobre 1964, che limita
    fino al 31 marzo 1965 l'ammontare massimo della restituzione applicabile alle
    esportazioni verso gli Stati membri di certi prodotti trasformati a base di cereali
    e di riso
  type: main
- language: nl
  script: Latn
  content: Verordening no. 162/64/EEG van de Commissie van 29 oktober 1964 waarbij
    het maximumbedrag van de restitutie van toepassing bij uitvoer naar de Lid-Staten
    van bepaalde op basis van granen en rijst verwerkte produkten, wordt beperkt tot
    en met 31 maart 1965
  type: main
