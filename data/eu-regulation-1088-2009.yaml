title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1088/2009 of 12 November 2009 concerning
    the authorisation of a new use of an enzyme preparation of 6-phytase produced
    by Aspergillus oryzae (DSM 17594) as a feed additive for weaned piglets, pigs
    for fattening, poultry for fattening and poultry for laying (holder of authorisation
    DSM Nutritional Products Ltd., represented by DSM Nutritional Products Sp. Z.o.o.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CE) n o 1088/2009 de la Commission du 12 novembre 2009 concernant
    l’autorisation d’un nouvel usage de la préparation enzymatique de 6-phytase
    produite par Aspergillus oryzae (DSM 17594) comme additif alimentaire pour les
    porcelets sevrés, les porcs d’engraissement, les volailles d’engraissement
    et les volailles de ponte (titulaire de l’autorisation: DSM Nutritional Products
    Ltd, representé par DSM Nutritional Products Sp. Z.o.o.)'
  type: main
- language: de
  script: Latn
  content: 'Verordnung (EG) Nr. 1088/2009 der Kommission vom 12. November 2009 zur
