title:
- language: fr
  script: Latn
  content: Décision 67/34/CEE de la Commission, du 21 décembre 1966, autorisant
    la République fédérale d'Allemagne à différer le relèvement du droit de
    son tarif national vers celui du Tarif douanier commun, en ce qui concerne l'aluminium
    brut, de la position Ex 76.01 A, importé sous certaines conditions, dans le cadre
    d'un contingent tarifaire de 21.000 tonnes
  type: main
- language: de
  script: Latn
  content: '67/34/EWG: Entscheidung der Kommission vom 21. Dezember 1966, mit der
    die Bundesrepublik Deutschland ermächtigt wird, die Angleichung des Zollsatzes
    ihres nationalen Zolltarifs an den des Gemeinsamen Zolltarifs für Rohaluminium
    der Tarifnummer ex 76.01 A, das unter bestimmten Voraussetzungen im Rahmen eines
    Zollkontingents von 21 000 Tonnen eingeführt wird, aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '67/34/CEE: Decisione della Commissione, del 21 dicembre 1966, che autorizza
    la Repubblica federale di Germania a differire l''aumento del dazio della sua
    tariffa nazionale verso quello della tariffa doganale comune per quanto riguarda
    l''alluminio greggio della voce ex 76.01 A, importato a condizioni particolari
    nel quadro del contingente tariffario di 21.000 tonnellate'
  type: main
- language: nl
  script: Latn
  content: '67/34/EEG: Beschikking van de Commissie van 21 december 1966 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd de verhoging van het recht van zijn
    nationale douanetarief naar het peil van het gemeenschappelijk douanetarief uit
    te stellen voor ruw aluminium van post ex 76.01 A, ingevoerd onder bepaalde voorwaarden
    in het kader van een tariefcontingent ter grootte van 21.000 ton'
  type: main
