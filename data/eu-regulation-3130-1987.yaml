    Kunstleder, der Tarifstellen 42.03 A, B II, B III und C des Gemeinsamen Zolltarifs
    mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3924/86 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
