title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3130/87 of 20 October 1987 re-establishing
    the levying of customs duties on articles of apparel and clothing accessories,
    of leather or of composition leather falling within subheadings 42.03 A, B II,
    B III and C of the Common Customs Tariff, originating in Pakistan, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3924/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3130/87 de la Commission du 20 octobre 1987 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement en cuir naturel, artificiel ou reconstitué, des sous-positions
    42.03 A, 42.03 B II, 42.03 B III et 42.03 C du tarif douanier commun, originaires
    du Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
