  content: Commission Regulation (EEC) No 3634/83 of 22 December 1983 amending Regulation
    (EEC) No 1124/77 redefining the destination zones for export refunds or levies
    and for export licences for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3634/83 de la Commission du 22 décembre 1983 modifiant
    le règlement (CEE) no 1124/77 portant délimitation des zones de destination
    pour les restitutions ou les prélèvements à l' exportation et certains certificats
    d' exportation dans les secteurs des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3634/83 der Kommission vom 22. Dezember 1983 zur Änderung
    der Verordnung (EWG) Nr. 1124/77 zur Neuaufteilung der Bestimmungszonen für die
    Erstattungen oder Abschöpfungen bei der Ausfuhr und für bestimmte Ausfuhrlizenzen
    für Getreide und Reis
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3634/83 af 22. december 1983 om ændring
    af forordning (EØF) nr. 1124/77 om ny afgrænsning af destinationszonerne for
    eksportrestitutioner og -afgifter og for visse eksportlicenser i forbindelse med
    korn og ris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3634/83 της Επιτροπής
    της 22ας Δεκεμβρίου 1983 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 1124/77 περί νέας οριοθετήσεως των ζωνών
    προορισμού για τις επιστροφές ή τις εισφορές
    κατά την εξαγωγή και ορισμένα πιστοποιητικά
    εξαγωγής στον τομέα των σιτηρών και της ορύζης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3634/83 della Commissione del 22 dicembre 1983 che
    modifica il regolamento (CEE) n. 1124/77, recante nuova delimitazione delle zone
    di destinazione per le restituzioni o i prelievi all' esportazione e per determinati
    titoli d' esportazione nei settori dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3634/83 van de Commissie van 22 december 1983 tot
    wijziging van Verordening (EEG) nr. 1124/77 houdende een nieuwe afbakening van
    de zones van bestemming voor de restituties of de heffingen bij uitvoer en voor
    bepaalde uitvoercertificaten in de sectoren granen en rijst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3634/83 da Comissão, de 22 de Dezembro de 1983,
    que altera o Regulamento (CEE) n.° 1124/77 que estabelece a delimitação das
    zonas de destino para as restituições ou direitos niveladores à exportação
    e certos certificados de exportação nos sectores dos cereais e do arroz
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3634/83 de la Comisión, de 22 de diciembre de 1983,
    por el que se modifica el Reglamento (CEE) n° 1124/77 sobre delimitación de
    las zonas de destino para las restituciones o las exacciones reguladoras a la
    exportación y determinados certificados de exportación en los sectores de los
    cereales y del arroz
  type: main
