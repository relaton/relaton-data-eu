type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1851 of 11 October 2017 amending
    Annex II(E) to Decision 92/260/EEC as regards the requirements for African horse
    sickness of registered horses temporarily admitted from Algeria, Kuwait, Morocco,
    Oman, Qatar, Tunisia and Turkey, and amending Annex I to Decision 2004/211/EC
    as regards the entry for the United Arab Emirates in the list of third countries
    and parts thereof from which imports into the Union of live equidae and semen,
    ova and embryos of the equine species are authorised (notified under document
    C(2017) 6775)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1851 de la Commission du 11 octobre 2017
    modifiant l'annexe II, point E, de la décision 92/260/CEE en ce qui concerne
    les exigences relatives à la peste équine pour les chevaux enregistrés qui
    sont admis à titre temporaire en provenance de l'Algérie, du Koweït, du Maroc,
    d'Oman, du Qatar, de la Tunisie et de la Turquie, et modifiant l'annexe I de la
    décision 2004/211/CE en ce qui concerne l'inscription des Émirats arabes unis
    sur la liste des pays tiers et des parties de ces pays en provenance desquels
    les importations vers l'Union européenne d'équidés vivants et de sperme, d'ovules
    et d'embryons de l'espèce équine sont autorisées [notifiée sous le numéro
    C(2017) 6775]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1851 der Kommission vom 11. Oktober 2017
    zur Änderung von Anhang II Buchstabe E der Entscheidung 92/260/EWG im Hinblick
    auf die Bestimmungen über die Afrikanische Pferdepest bei zeitweilig aus Algerien,
    Kuwait, Marokko, Oman, Katar, Tunesien und der Türkei zugelassenen registrierten
    Pferden und zur Änderung von Anhang I der Entscheidung 2004/211/EG im Hinblick
    auf den Eintrag für die Vereinigten Arabischen Emirate in der Liste von Drittländern
    und Teilen von Drittländern, aus denen die Einfuhr von lebenden Equiden sowie
    von Equidensperma, -eizellen und -embryonen in die Union zugelassen ist (Bekannt
    gegeben unter Aktenzeichen C(2017) 6775)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/1851 на Комисията
    от 11 октомври 2017 година за изменение на приложение
    II (Д) към Решение 92/260/ЕИО по отношение на изискванията
    за африканска чума по конете за регистрирани
    коне, временно допускани от Алжир, Кувейт, Мароко,
    Оман, Катар, Тунис и Турция, и за изменение на
    приложение I към Решение 2004/211/ЕО по отношение
    на вписването на Обединените арабски емирства
    в списъка на трети държави и части от тях, от
    които е разрешен вносът в Съюза на живи еднокопитни
    и сперма, яйцеклетки и ембриони от еднокопитни
    животни (нотифицирано под номер С(2017) 6775)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/1851 ze dne 11. října 2017
    o změně přílohy II oddílu E rozhodnutí 92/260/EHS, pokud jde o požadavky
    ohledně moru koní u evidovaných koní dočasně dovezených z Alžírska, Kuvajtu,
    Maroka, Ománu, Kataru, Tuniska a Turecka, a o změně přílohy I rozhodnutí
    2004/211/ES, pokud jde o položku pro Spojené arabské emiráty v seznamu třetích
    zemí a jejich částí, ze kterých je povolen dovoz živých koňovitých a
    spermatu, vajíček a embryí druhů koňovitých do Unie (oznámeno pod číslem
    C(2017) 6775)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/1851 af 11. oktober 2017
    om ændring af del E i bilag II til beslutning 92/260/EØF for så vidt angår
    kravene vedrørende afrikansk hestepest for registrerede heste, der midlertidigt
    indføres fra Algeriet, Kuwait, Marokko, Oman, Qatar, Tunesien og Tyrkiet, og
    om ændring af bilag I til beslutning 2004/211/EF for så vidt angår oplysningerne
    vedrørende De Forenede Arabiske Emirater i listen over tredjelande og dele af
    tredjelande, hvorfra det er tilladt at importere levende dyr af hestefamilien
    samt sæd, æg og embryoner fra dyr af hestefamilien til Unionen (meddelt under
    nummer C(2017) 6775)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/1851 της Επιτροπής,
