    του παραρτήματος II μέρος E της απόφασης 92/260/ΕΟΚ
    όσον αφορά τις απαιτήσεις για την πανώλη των
    ίππων για τους εγγεγραμμένους ίππους από την
    Αλγερία, το Κουβέιτ, το Μαρόκο, το Ομάν, το Κατάρ,
    την Τυνησία και την Τουρκία, οι οποίοι γίνονται
    προσωρινά αποδεκτοί, και σχετικά με την τροποποίηση
    του παραρτήματος I της απόφασης 2004/211/ΕΚ όσον
    αφορά την καταχώριση των Ενωμένων Αραβικών
    Εμιράτων στον κατάλογο των τρίτων χωρών και
    των περιοχών τους από τις οποίες επιτρέπονται
    οι εισαγωγές στην Ένωση ζώντων ιπποειδών και
    σπέρματος, ωαρίων και εμβρύων ιπποειδών [κοινοποιηθείσα
    υπό τον αριθμό C(2017) 6775]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/1851, 11. oktoober 2017, millega muudetakse
    otsuse 92/260/EMÜ II lisa E osa seoses hobuste Aafrika katku käsitlevate nõuetega,
    mis kehtivad ajutiselt Alžeeriast, Kuveidist, Marokost, Omaanist, Katarist, Tuneesiast
    ja Türgist imporditud registreeritud hobuste suhtes, ning otsuse 2004/211/EÜ
    I lisa seoses Araabia Ühendemiraatide lisamisega kolmandate riikide ja nende
    osade loetellu, millest liikmesriigid lubavad importida elushobuslasi ning hobuslaste
    spermat, munarakke ja embrüoid (teatavaks tehtud numbri C(2017) 6775 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/1851, annettu 11 päivänä
    lokakuuta 2017, päätöksen 92/260/ETY liitteessä II olevan E kohdan muuttamisesta
    siltä osin kuin on kyse rekisteröityihin hevosiin, joiden tuonti on tilapäisesti
    sallittu Algeriasta, Kuwaitista, Marokosta, Omanista, Qatarista, Tunisiasta ja
    Turkista, sovellettavista afrikkalaista hevosruttoa koskevista vaatimuksista sekä
    päätöksen 2004/211/EY liitteen I muuttamisesta siltä osin kuin on kyse Yhdistyneitä
    arabiemiirikuntia koskevasta kohdasta niiden kolmansien maiden ja kolmansien maiden
    osien luettelossa, joista elävien hevoseläinten ja hevoseläinten siemennesteen,
    munasolujen ja alkioiden tuonti on sallittu (tiedoksiannettu numerolla C(2017)
    6775)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/1851 оd 11. listopada 2017. o izmjeni
    dijela E Priloga II. Odluci 92/260/EEZ u pogledu zahtjevâ za konjsku kugu registriranih
    konja koji su privremeno ušli iz Alžira, Katara, Kuvajta, Maroka, Omana, Tunisa
    i Turske te o izmjeni Priloga I. Odluci 2004/211/EZ u pogledu unosa za Ujedinjene
    Arapske Emirate na popisu trećih zemalja i njihovih dijelova iz kojih je odobren
    uvoz u Uniju živih kopitara i sjemena, jajnih stanica i zametaka kopitara (priopćeno
    pod brojem dokumenta C(2017) 6775)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1851 végrehajtási határozata (2017. október
    11.) a 92/260/EGK határozat II. E. mellékletének az Algériából, Katarból,
    Kuvaitból, Marokkóból, Ománból, Tunéziából és Törökországból ideiglenesen
    behozott törzskönyvezett lovak esetében az afrikai lópestisre vonatkozó követelmények
    tekintetében, valamint a 2004/211/EK határozat I. mellékletében az élő lófélék,
    továbbá a lófélék spermájának, petesejtjeinek és embrióinak az Unióba
    való behozatalára feljogosított harmadik országok és azok részei jegyzékének
    az Egyesült Arab Emírségekre vonatkozó bejegyzés tekintetében való módosításáról
    (az értesítés a C(2017) 6775. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/1851 della Commissione, dell'11 ottobre
    2017, che modifica l'allegato II, parte E, della decisione 92/260/CEE per quanto
    riguarda i requisiti per la peste equina di cavalli registrati temporaneamente
    ammessi dall'Algeria, dal Kuwait, dal Marocco, dall'Oman, dal Qatar, dalla Tunisia
    e dalla Turchia, e che modifica l'allegato I della decisione 2004/211/CE per quanto
    riguarda la voce relativa agli Emirati arabi uniti nell'elenco dei paesi terzi
    e delle parti di paesi terzi da cui sono autorizzate le importazioni nell'Unione
    di equidi vivi nonché di sperma, ovuli ed embrioni della specie equina [notificata
    con il numero C(2017) 6775]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/1851 (2017. gada 11. oktobris),
    ar ko Lēmuma 92/260/EEK II pielikuma E daļā groza prasības saistībā ar Āfrikas
    zirgu mēri reģistrētu zirgu pagaidu ievešanai no Alžīrijas, Kuveitas, Marokas,
    Omānas, Kataras, Tunisijas un Turcijas un ar ko attiecībā uz Apvienoto Arābu
    Emirātu iekļaušanu to trešo valstu un to teritoriju sarakstā, no kurām atļauts
    ievest Savienībā dzīvus zirgu dzimtas dzīvniekus, to spermu, olšūnas un
    embrijus, groza Lēmuma 2004/211/EK I pielikumu (izziņots ar dokumenta numuru
    C(2017) 6775)
  type: main
- language: lt
  script: Latn
  content: 2017 m. spalio 11 d. Komisijos įgyvendinimo sprendimas (ES) 2017/1851,
    kuriuo dėl reikalavimų dėl laikinai iš Alžyro, Kuveito, Maroko, Omano, Kataro,
    Tuniso ir Turkijos priimtų registruotų arklių afrikinės arklių ligos iš
    dalies keičiama Sprendimo 92/260/EEB II priedo E dalis ir dėl Jungtinių Arabų
    Emyratų įrašo trečiųjų šalių ir jų dalių, iš kurių leidžiama į Sąjungą
    importuoti gyvus arklinių šeimos gyvūnus ir arklinių rūšių spermą, kiaušialąstes
    bei embrionus, sąraše iš dalies keičiamas Sprendimo 2004/211/EB I priedas
    (pranešta dokumentu Nr. C(2017) 6775)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' implimentazzjoni tal-Kummissjoni (UE) 2017/1851 tal-11
    ta' Ottubru 2017 li temenda l-Anness II(E) tad-Deċiżjoni 92/260/KEE fir-rigward
    tar-rekwiżiti għal marda Afrikana taż-żwiemel ta' żwiemel irreġistrati li
    jitħallew jidħlu temporanjament mill-Alġerija, mill-Kuwajt, mill-Marokk, mill-Oman,
    mill-Qatar, mit-Tuneżija u mit-Turkija, u li temenda l-Anness I tad-Deċiżjoni
    2004/211/KE fir-rigward tal-annotazzjoni tal-Emirati Għarab Magħquda fil-lista
    ta' pajjiżi terzi u partijiet minnhom minn fejn l-importazzjonijiet fl-Unjoni
    ta' ekwidi ħajjin u ta' semen, ova u embrijuni tal-ispeċi ekwina huma awtorizzati
    (notifikata bid-dokument C(2017) 6775)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/1851 van de Commissie van 11 oktober 2017
    tot wijziging van bijlage II, deel E, bij Besluit 92/260/EEG wat betreft de eisen
    voor paardenpest van tijdelijk toegelaten geregistreerde paarden uit Algerije,
    Koeweit, Marokko, Oman, Qatar, Tunesië en Turkije, en tot wijziging van bijlage
    I bij Besluit 2004/211/EG wat betreft de vermelding voor de Verenigde Arabische
    Emiraten in de lijst van derde landen en delen daarvan waaruit de invoer in de
    Unie van levende paardachtigen en sperma, eicellen en embryo's van paarden is
    toegestaan (Kennisgeving geschied onder nummer C(2017) 6775)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/1851 z dnia 11 października 2017
    r. zmieniająca lit. E w załączniku II do decyzji 92/260/EWG w odniesieniu do
    wymagań dotyczących afrykańskiego pomoru koni w przypadku odprawy czasowej
    rejestrowanych koni z Algierii, Kuwejtu, Maroka, Omanu, Kataru, Tunezji i Turcji,
    oraz zmieniająca załącznik I do decyzji 2004/211/WE w odniesieniu do wpisu
    dotyczącego Zjednoczonych Emiratów Arabskich w wykazie państw trzecich oraz
    części ich terytoriów, z których dozwolony jest przywóz do Unii żywych zwierząt
    z rodziny koniowatych oraz nasienia, komórek jajowych i zarodków koni (notyfikowana
    jako dokument nr C(2017) 6775)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/1851 da Comissão, de 11 de outubro de
    2017, que altera o anexo II (E) da Decisão 92/260/CEE no que diz respeito aos
    requisitos relativos à peste equina para a admissão temporária de cavalos registados
    provenientes da Argélia, Koweit, Marrocos, Omã, Catar, Tunísia e Turquia, e
    que altera o anexo I da Decisão 2004/211/CE no que se refere à entrada respeitante
    aos Emirados Árabes Unidos na lista de países terceiros e partes dos seus territórios
    a partir dos quais são autorizadas as importações na União de equídeos vivos
    e sémen, óvulos e embriões de equídeos [notificada com o número C(2017) 6775]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/1851 a Comisiei din 11 octombrie
    2017 de modificare a anexei II(E) la Decizia 92/260/CEE în ceea ce privește
    cerințele pentru pesta cabalină africană pentru caii înregistrați admiși
    temporar din Algeria, Kuweit, Maroc, Oman, Qatar, Tunisia și Turcia și de modificare
    a anexei I la Decizia 2004/211/CE în ceea ce privește rubrica referitoare la
    Emiratele Arabe Unite din lista țărilor terțe și a părților acestora din
    care sunt autorizate importurile în Uniune de ecvidee vii și de material seminal,
    de ovule și de embrioni de ecvidee [notificată cu numărul C(2017) 6775]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/1851 z 11. októbra 2017, ktorým
    sa mení príloha II časť E k rozhodnutiu 92/260/EHS, pokiaľ ide o požiadavky
    na africký mor koní v prípade registrovaných koní s dočasným povolením
    vstupu z Alžírska, Kuvajtu, Maroka, Ománu, Kataru, Tuniska a Turecka, a ktorým
    sa mení príloha I k rozhodnutiu 2004/211/ES, pokiaľ ide o položku týkajúcu
    sa Spojených arabských emirátov v zozname tretích krajín a ich častí, z
    ktorých je povolený dovoz živých zvierat čeľade koňovité a ich spermy,
    vajíčok a embryí do Únie [oznámené pod číslom C(2017) 6775]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/1851 z dne 11. oktobra 2017 o spremembi
    Priloge II(E) k Odločbi 92/260/EGS glede zahtev za afriško bolezen konj registriranih
    konjev, začasno sprejetih iz Alžirije, Kuvajta, Maroka, Omana, Katarja, Tunizije
    in Turčije, ter o spremembi Priloge I k Odločbi 2004/211/ES glede vključitve
    Združenih arabskih emiratov na seznam tretjih držav in njihovih delov, iz katerih
    je dovoljen uvoz živih enoprstih kopitarjev in njihovega semena, jajčnih celic
    in zarodkov v Unijo (notificirano pod dokumentarno številko C(2017) 6775)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/1851 de la Comisión, de 11 de octubre
    de 2017, por la que se modifica el anexo II, letra E, de la Decisión 92/260/CEE
    en lo que respecta a los requisitos relativos a la peste equina para los caballos
    registrados admitidos temporalmente procedentes de Argelia, Kuwait, Marruecos,
    Omán, Qatar, Túnez y Turquía, y por la que se modifica el anexo I de la Decisión
    2004/211/CE en lo que respecta a la entrada correspondiente a los Emiratos Árabes
    Unidos en la lista de terceros países y partes de ellos a partir de los cuales
    están autorizadas las importaciones en la Unión de équidos vivos y de esperma,
    óvulos y embriones de la especie equina [notificada con el número C(2017) 6775]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/1851 av den 11 oktober 2017
    om ändring av bilaga II.E till beslut 92/260/EEG vad gäller de krav som rör
    afrikansk hästpest hos registrerade hästar som tillfälligt förs in från Algeriet,
    Kuwait, Marocko, Oman, Qatar, Tunisien och Turkiet, och om ändring av bilaga
    I till beslut 2004/211/EG vad gäller posten för Förenade Arabemiraten i förteckningen
    över tredjeländer och delar av tredjeländer från vilka import till unionen
    av levande hästdjur och av sperma, ägg och embryon från hästdjur tillåts
    [delgivet med nr C(2017) 6775]
