title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) 2311/80 of 3 September 1980 laying down detailed
    rules implementing the system of aid for the use of concentrated grape must for
    the manufacture in the United Kingdom and Ireland of certain products and fixing
    the amounts of aid for the 1980/81 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2311/80 de la Commission, du 3 septembre 1980, portant
    modalités d' application du régime d' aide à l' utilisation de moûts de raisins
    concentrés en vue de la fabrication de certains produits, au Royaume-Uni et en
    Irlande, et fixant les montants de l' aide pour la campagne viticole 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2311/80 der Kommission vom 3. September 1980 über
    Durchführungsbestimmungen zu der Beihilferegelung für die Verwendung von konzentriertem
    Traubenmost zur Herstellung bestimmter Erzeugnisse im Vereinigten Königreich
    und in Irland sowie zur Festsetzung eines Beihilfebetrags für das Weinwirtschaftsjahr
    1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2311/80 af 3. september 1980 om støtte
    til anvendelse af druemost og koncentreret druemost til fremstilling i Det forenede
    Kongerige og i Irland af visse produkter, der henhører under pos. 22.07 i den
    fælles toldtarif, og om gennemførelsesbestemmelser til støtteordningen for
    vinproduktionsåret 1980/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2311/80 τής Επιτροπής
    τής 3ης Σεπτεμβρίου 1980 περί λεπτομερειών εφαρμογής
    τού καθεστώτος ενισχύσεων στή χρησιμοποίηση
    συμπυκνωμένου γλεύκους σταφυλής γιά τήν παρασκευή
    ορισμένων προϊόντων στό Ηνωμένο Βασίλειο καί
    τήν Ιρλανδία καί περί καθορισμού τού ποσού
    ενισχύσεως γιά τήν αμπελουργική περίοδο 1980/81
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2311/80 della Commissione, del 3 settembre 1980, che
