    ke zvláštnímu režimu dodávek produktů z obilovin do francouzských zámořských
    departementů a předběžný odhad dodávek
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 467/92 af 27. februar 1992 om ændring
