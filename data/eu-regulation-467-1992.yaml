    opatrení pre zásobovanie francúzskych zámorských departementov (FZD) a stanovenie
    predbežnej bilancie dodávok
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 467/92 z dne 27. februarja 1992 o spremembi
