  content: Commission Regulation (EEC) No 467/92 of 27 February 1992 amending Regulation
    (EEC) No 388/92 on detailed rules for the application of the specific arrangements
    for the supply of cereals to the French overseas departments (FOD) and establishing
    the forecast supply balance
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 467/92 de la Commission, du 27 février 1992, modifiant
