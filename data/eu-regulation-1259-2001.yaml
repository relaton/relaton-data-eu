title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1259/2001 of 26 June 2001 determining the
    extent to which applications lodged in June 2001 for import rights in respect
    of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1259/2001 de la Commission du 26 juin 2001 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de juin 2001 pour les viandes bovines congelées destinées
    à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1259/2001 der Kommission vom 26. Juni 2001 über den
    Umfang, in dem den im Monat Juni 2001 eingereichten Anträgen auf Einfuhrrechte
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1259/2001 af 26. juni 2001 om fastsættelse
    af, i hvilken udstrækning anmodninger om importrettigheder, indgivet i juni 2001
    for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1259/2001 της Επιτροπής,
    της 26ης Ιουνίου 2001, ο οποίος καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιώματος εισαγωγής που κατατέθηκαν τον
    Ιούνιο του 2001 για τα κατεψυγμένα βόεια κρέατα
    που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1259/2001, annettu 26 päivänä kesäkuuta 2001,
    kesäkuussa 2001 jätetyistä, jalostettavaksi tarkoitettua jäädytettyä naudanlihaa
    koskevista tuontioikeushakemuksista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1259/2001 della Commissione, del 26 giugno 2001, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto di
    importazione presentate nel mese di giugno 2001 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1259/2001 van de Commissie van 26 juni 2001 waarbĳ
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in juni 2001 ingediende
    aanvragen om invoerrechten voor bevroren rundvlees, bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1259/2001 da Comissão, de 26 de Junho de 2001, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Junho de 2001 para carne de bovino congelada destinada à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1259/2001 de la Comisión, de 26 de junio de 2001,
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    derechos de importación presentadas hasta el mes de junio de 2001 para las carnes
    de vacuno congeladas destinadas a la transformación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1259/2001 av den 26 juni 2001 om i vilken
    utsträckning ansökningar om importavgifter som lämnats in under juni 2001 för
    fruset nötkött för bearbetning kan godkännas
  type: main
