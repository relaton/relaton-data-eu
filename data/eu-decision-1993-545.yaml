    taluni quantitativi di zucchero greggio a prelievo ridotto in conto del periodo
    dal 1° luglio 1993 al 28 febbraio 1994 (Il testo in lingua portoghese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/545/EEG: BESCHIKKING VAN DE COMMISSIE van 25 oktober 1993 tot wijziging
