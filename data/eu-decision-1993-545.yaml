    råsukker under anvendelse af nedsat afgift fra tredjelande for perioden 1. juli
    1993 til 28. februar 1994 (Kun den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/545/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 25ης
