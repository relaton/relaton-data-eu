- language: en
  script: Latn
  content: '93/545/EEC: Commission Decision of 25 October 1993 amending Decision 93/378/EEC
    authorizing Portugal to import from third countries at a reduced levy certain
    quantities of raw sugar during the period 1 July 1993 to 28 February 1994 (Only
    the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/545/CEE: Décision de la Commission du 25 octobre 1993 modifiant la
    décision 93/378/CEE autorisant le Portugal à importer des pays tiers à prélèvement
    réduit certaines quantités de sucre brut au titre de la période du 1er juillet
    1993 au 28 février 1994 (Le texte en langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/545/EWG: ENTSCHEIDUNG DER KOMMISSION vom 25. Oktober 1993 zur Änderung
