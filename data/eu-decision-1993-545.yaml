    1. Juli 1993 bis 28. Februar 1994 bestimmte Rohzuckermengen mit verminderter Abschöpfung
    aus Drittländern einzuführen (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/545/EØF: KOMMISSIONENS BESLUTNING af 25. oktober 1993 om ændring
