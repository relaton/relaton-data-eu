    nach der Bundesrepublik Deutschland erhobenen inländischen Abgaben und zur Änderung
    der Verordnung Nr. 158/64/EWG
  type: main
- language: it
  script: Latn
  content: Regolamento n. 59/65/CEE della Commissione, del 29 aprile 1965, che modifica
