title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2530/83 of 8 September 1983 re-establishing
    the levying of customs duties on handkerchiefs, products of categories 19 and
    89 (code 0190), originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2530/83 de la Commission du 8 septembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, des catégories 19 et 89 (code 0190), originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2530/83 der Kommission vom 8. September 1983 über
    die Wiedereinführung des Zollsatzes für Taschentücher und Ziertaschentücher
    der Warenkategorien Nrn. 19 und 89 (Kennziffer 0190), mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2530/83 af 8. september 1983 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder under varekategori nr. 19
    og 89 (kode 0190) som har oprindelse i Pakistan og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2530/83 της Επιτροπής
    της 8ης Σεπτεμβρίου 1983 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ρινόμακτρα
    και μανδηλάκια θυλακίου, προϊόντων των κατηγοριών
    19 και 89 (κωδικός αριθμός 0190), καταγωγής Πακιστάν,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2530/83 della Commissione dell' 8 settembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino delle categorie dei prodotti nn. 19 e 89 (codice 0190), originari
    del Pakistan, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2530/83 van de Commissie van 8 september 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakdoeken
    van de categorieën van produkten nr. 19 en nr. 89 (codenummer 0190), van oorsprong
    uit Pakistan, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3378/82 van de Raad
  type: main
