    (ЕО) № 606/2009 по отношение на някои енологични
    практики и приложимите ограничения, а също
    и на Регламент (ЕО) № 436/2009 по отношение на вписването
    на тези практики в документите, придружаващи
    превоза на лозаро-винарски продукти, и регистрите,
    които е необходимо да се водят в лозаро-винарския
    сектор
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 144/2013 ze dne 19. února 2013
    , kterým se mění nařízení (ES) č. 606/2009, pokud jde o některé enologické
    postupy a omezení, která se na ně použijí, jakož i nařízení (ES) č.
    436/2009, pokud jde o zanesení těchto postupů do průvodních dokladů pro
    přepravu vinařských produktů a evidenčních knih vedených v odvětví vína
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 144/2013 af 19. februar
    2013 om ændring af forordning (EF) nr. 606/2009 hvad angår visse ønologiske
    fremgangsmåder og restriktioner i forbindelse hermed og om ændring af forordning
    (EF) nr. 436/2009 hvad angår angivelse af disse fremgangsmåder i dokumenter,
    der ledsager vinprodukter ved transport, og ind- og udgangsbøger i vinsektoren
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 144/2013
