title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 144/2013 of 19 February 2013
    amending Regulation (EC) No 606/2009 as regards certain oenological practices
    and the applicable restrictions and Regulation (EC) No 436/2009 as regards the
    registering of these practices in the documents accompanying consignments of wine
    products and the wine sector registers to be kept
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 144/2013 de la Commission du 19 février
    2013 modifiant le règlement (CE) n ° 606/2009 en ce qui concerne certaines pratiques
    œnologiques et les restrictions qui s’y appliquent, ainsi que le règlement
    (CE) n ° 436/2009 en ce qui concerne l’inscription de ces pratiques dans les
    documents accompagnant le transport des produits vitivinicoles et les registres
    à tenir dans le secteur vitivinicole
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 144/2013 der Kommission vom 19. Februar
    2013 zur Änderung der Verordnung (EG) Nr. 606/2009 in Bezug auf bestimmte önologische
    Verfahren und die diesbezüglichen Einschränkungen sowie zur Änderung der Verordnung
    (EG) Nr. 436/2009 in Bezug auf die Eintragung dieser Verfahren in die Begleitdokumente
    für die Beförderung von Weinbauerzeugnissen und auf die Ein- und Ausgangsbücher
    im Weinsektor
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 144/2013 на Комисията
