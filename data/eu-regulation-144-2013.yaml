  script: Latn
  content: Provedbena uredba Komisije (EU) br. 144/2013 od 19. veljače 2013. o izmjeni
    Uredbe (EZ) br. 606/2009 u pogledu određenih enoloških postupaka i primjenjivih
    ograničenja Uredbe (EZ) br. 436/2009 u pogledu upisa tih postupaka u dokumente
    koji prate pošiljke proizvoda od vina i evidencije koje se vode u sektoru vina
  type: main
- language: hu
  script: Latn
  content: A Bizottság 144/2013/EU végrehajtási rendelete ( 2013. február 19.
    ) a 606/2009/EK rendeletnek egyes borászati eljárások és az azokhoz kapcsolódó
    korlátozások tekintetében, valamint a 436/2009/EK rendeletnek az ezen eljárásoknak
    a borászati termékek fuvarozásához szükséges kísérőokmányokba és a
    borágazatban vezetendő nyilvántartásokba való bejegyzése tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 144/2013 della Commissione, del 19 febbraio
    2013 , che modifica il regolamento (CE) n. 606/2009 per quanto riguarda alcune
    pratiche enologiche e le relative restrizioni, e il regolamento (CE) n. 436/2009
    per quanto riguarda l’iscrizione di tali pratiche nei documenti che scortano
    il trasporto dei prodotti vitivinicoli e la tenuta dei registri nel settore vitivinicolo
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 144/2013 ( 2013. gada 19. februāris
    ), ar ko groza Regulu (EK) Nr. 606/2009 attiecībā uz dažām vīndarības metodēm
    un tām piemērojamajiem ierobežojumiem un Regulu (EK) Nr. 436/2009 attiecībā
    uz šo metožu ierakstīšanu vīna produktu pārvadājumu pavaddokumentos un
    vīna nozarē veicamo uzskaites reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2013 m. vasario 19 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 144/2013,
    kuriuo iš dalies keičiamos Reglamento (EB) Nr. 606/2009 nuostatos, susijusios
    su vynininkystės metodais ir jiems taikomais apribojimais ir iš dalies keičiamos
    Reglamento (EB) Nr. 436/2009 nuostatos, susijusios su tokių metodų įrašymu
    į vyno produktų lydraščius ir vyno sektoriuje privalomus pildyti žurnalus
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 144/2013 tad-
    19 ta’ Frar 2013 li jemenda r-Regolament (KE) Nru 606/2009 f’dak li għandu
    x’jaqsam ma’ ċerti prattiki enoloġiċi u r-restrizzjonijiet fuqhom, kif
    ukoll ir-Regolament (KE) Nru 436/2009 f’dak li għandu x’jaqsam mar-reġistrazzjoni
    ta’ dawn il-prattiki fid-dokumenti li jakkumpanjaw il-ġarr tal-prodotti tal-vinji
    tal-inbid u f’dak li għandu x’jaqsam mar-reġistri li għandhom jinżammu
    fis-settur tal-vinji tal-inbid
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 144/2013 van de Commissie van 19 februari
    2013 tot wijziging van Verordening (EG) nr. 606/2009, wat betreft bepaalde oenologische
    procedés en de daarvoor geldende beperkingen, en tot wijziging van Verordening
    (EG) nr. 436/2009, wat betreft de vermelding van deze procedés in de begeleidende
    documenten voor het vervoer van wijnbouwproducten en de in de wijnsector bij te
    houden registers
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 144/2013 z dnia 19 lutego 2013
    r. zmieniające rozporządzenie (WE) nr 606/2009 w odniesieniu do niektórych
    praktyk enologicznych i stosowanych wobec nich ograniczeń, jak również rozporządzenie
    (WE) nr 436/2009 w odniesieniu do wpisywania tych praktyk do dokumentów towarzyszących
    przewozowi produktów sektora wina oraz rejestrów, które należy prowadzić
    w sektorze wina
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 144/2013 da Comissão, de 19 de fevereiro
    de 2013 , que altera o Regulamento (CE) n. ° 606/2009, no que respeita a determinadas
    práticas enológicas e às restrições que lhes são aplicáveis, bem como o
    Regulamento (CE) n. ° 436/2009, no que respeita à inscrição dessas práticas
    nos documentos que acompanham o transporte dos produtos vitivinícolas e aos registos
    a manter no setor vitivinícola
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 144/2013 al Comisiei din 19
    februarie 2013 de modificare a Regulamentului (CE) nr. 606/2009 în ceea ce privește
    anumite practici oenologice și restricțiile care se aplică acestora, precum
    și de modificare a Regulamentului (CE) nr. 436/2009 în ceea ce privește înscrierea
    acestor practici în documentele de însoțire a transporturilor de produse vitivinicole
    și registrele care trebuie păstrate în sectorul vitivinicol
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 144/2013 z 19. februára 2013
    , ktorým sa mení a dopĺňa nariadenie (ES) č. 606/2009, pokiaľ ide o určité
    enologické postupy a obmedzenia, ktoré sa na ne uplatňujú, ako aj nariadenie
    (ES) č. 436/2009, pokiaľ ide o zaznamenávanie týchto postupov do sprievodných
    dokumentov k preprave vinárskych výrobkov a do evidencie, ktorú treba viesť
    v sektore vinohradníctva a vinárstva
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 144/2013 z dne 19. februarja 2013 o
    spremembi Uredbe (ES) št. 606/2009 glede nekaterih enoloških postopkov in z
    njimi povezanih omejitev ter Uredbe (ES) št. 436/2009 glede vpisa navedenih postopkov
    v dokumente, ki spremljajo prevoz vinskih proizvodov, in evidence, ki se vodijo
    v vinskem sektorju
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 144/2013 de la Comisión, de 19 de febrero
    de 2013 , que modifica el Reglamento (CE) n ° 606/2009 en lo que respecta a determinadas
    prácticas enológicas y a las restricciones aplicables, así como el Reglamento
    (CE) n ° 436/2009 en lo que respecta a la indicación de estas prácticas en
    los documentos que acompañan al transporte de productos vitivinícolas y a los
    registros que se han de llevar en el sector vitivinícola
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 144/2013 av den 19 februari
    2013 om ändring av förordning (EG) nr 606/2009 vad gäller vissa oenologiska
    metoder och restriktioner samt av förordning (EG) nr 436/2009 vad gäller anteckning
    om dessa metoder i följedokumenten vid transport av produkter och i de register
    som ska föras inom vinsektorn
