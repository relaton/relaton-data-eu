- language: en
  script: Latn
  content: Regulation (EEC) No 2464/75 of the Commission of 25 September 1975 determining
    the amounts of the variable components, compensatory amounts and additional duties
    applicable during the fourth quarter of 1975 on the importation of goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2464/75 de la Commission, du 25 septembre 1975, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant le quatrième trimestre de l'année
    1975, à l'importation des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2464/75 der Kommission vom 25. September 1975 zur
    Festsetzung der Höhe der im vierten Vierteljahr 1975 bei der Einfuhr der unter
    die Verordnung (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge,
    Ausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2464/75 af 25. september 1975 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    indførsel af varer henhørende under forordning (EØF) nr. 1059/69 i fjerde kvartal
    1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2464/75 della Commissione, del 25 settembre 1975,
    che determina gli importi degli elementi mobili e gli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per il quarto trimestre 1975,
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2464/75 van de Commissie van 25 september 1975 tot
    vaststelling van het beloop der gedurende het vierde kwartaal van 1975 bij invoer
    van onder Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele
    elementen, compenserende bedragen en aanvullende invoerrechten
