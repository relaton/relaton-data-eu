id: EUDecision197974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/74/EEC: Commission Decision of 21 December 1978 repealing Decision
    68/397/EEC authorizing the Benelux countries to apply the first paragraph of Article
    115 of the Treaty so as to exclude from Community treatment certain paving, hearth
    and wall tiles originating in Japan and in free circulation in the other Member
    States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/74/CEE: Décision de la Commission, du 21 décembre 1978, portant abrogation
    de la décision 68/397/CEE relative au recours des pays du Benelux à l''article
    115 premier alinéa du traité pour exclure du traitement communautaire certains
    carreaux de pavement ou de revêtement originaires du Japon et mis en libre pratique
    dans les autres Etats membres (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/74/EWG: Entscheidung der Kommission vom 21. Dezember 1978 zur Aufhebung
    der Entscheidung 68/397/EWG betreffend die Inanspruchnahme von Artikel 115 Absatz
    1 des Vertrages durch die Benelux-Länder, um bestimmte Boden- und Wandplatten
    mit Ursprung in Japan, die sich in den anderen Mitgliedstaaten im freien Verkehr
    befinden, von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/74/EØF: Kommissionens beslutning af 21. december 1978 om ophævelse
    af beslutning 68/397/EØF om Benelux- landenes anvendelse af traktatens artikel
    115, stk. 1, med henblik på fra fællesskabsbehandling at undtage visse sten
    og fliser til brolægning, gulvbelægning eller beklædning af vægge, kaminer
    o. lign., som har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/74/CEE: Decisione della Commissione, del 21 dicembre 1978, che abroga
    la decisione 68/397/CEE relativa al ricorso da parte dei paesi del Benelux all''articolo
    115, primo comma, del trattato per escludere dal trattamento comunitario talune
    piastrelle da pavimentazione e da rivestimento originarie del Giappone e immesse
    in libera pratica negli altri Stati membri (I testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/74/EEG: Beschikking van de Commissie van 21 december 1978 houdende
    intrekking van Beschikking 68/397/EEG betreffende het verzoek van de Benelux-landen
    om op grond van artikel 115, eerste alinea, van het Verdrag, sommige vloer- en
    wandtegels, van oorsprong uit Japan en in de andere Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
