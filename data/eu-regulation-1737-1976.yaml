title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1737/76 of 19 July 1976 re-establishing
    the levying of customs duties on tubes and pipes and blanks therefor, of copper,
    falling within heading No 74.07, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1737/76 de la Commission,du 19 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux et barres creuses, en cuivre, de la position tarifaire 74.07, originaires
    de la Yougoslavie bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1737/76 der Kommission vom 19. Juli 1976 zur Wiedereinführung
    des Zollsatzes für Rohre und Hohlstangen, aus Kupfer, der Tarifnummer 74.07,
    mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1737/76 af 19. juli 1976 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger, af kobber,
    under position 74.07, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1737/76 della Commissione, del 19 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai tubi e barre forate,
    di rame, della voce doganale n. 74.07 originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1737/76 van de Commissie van 19 juli 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op buizen en
    pijpen en holle staven, van koper,van post 74.07, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
