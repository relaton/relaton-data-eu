title:
- language: en
  script: Latn
  content: Commission Decision of 7 February 1978 authorizing the French Republic
    not to apply Community treatment to garments, falling within heading No 61.01,
    61.02 or 61.03 of the Common Customs Tariff, originating in Poland and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: 78/219/CEE Décision de la Commission, du 7 février 1978, autorisant la
    République française à exclure du traitement communautaire les vêtements des
    positions 61.01, 61.02 et 61.03 du Tarif douanier commun, originaires de Pologne
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. Februar 1978, mit der die Französische
    Republik ermächtigt wird, aus Polen stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung der Tarifnummern 61.01, 61.02 und 61.03
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 7. februar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande, som
    henhører under pos. 61.01, 61.02 og 61.03 i den fælles toldtarif, har oprindelse
    i Polen og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 7 febbraio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti di cui alle voci
    61.01, 61.02 e 61.03 della tariffa doganale comune, originari della Polonia e
    messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 februari 1978 waarbij de Franse Republiek
    wordt gemachtigd kleding van de posten 61.01, 61.02 en 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Polen en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
