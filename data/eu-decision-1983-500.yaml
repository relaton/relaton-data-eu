title:
- language: en
  script: Latn
  content: '83/500/EEC: Commission Decision of 29 September 1983 establishing that
    the apparatus described as ''SPEX - Czerny-Turner Spectrograph-Spectrometer, model
    1802, with accessories'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/500/CEE: Décision de la Commission du 29 septembre 1983 constatant
    que l''importation de l''appareil dénommé "SPEX - Czerny-Turner Spectrograph
    - Spectrometer, model 1802, with accessories" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/500/EWG: Entscheidung der Kommission vom 29. September 1983, mit der
    festgestellt wird, daß das Gerät ,,SPEX - Czerny - Turner Spectrograph - Spectrometer,
    model 1802 with accessories" nicht unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/500/EØF: Kommissionens beslutning af 29. september 1983 om fastslåelse
    af, at indførsel af apparatet "Spex- Czerny-Turner Spectrograph - Spectrometer,
    model 1802, with accessories" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
