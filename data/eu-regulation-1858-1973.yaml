title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1858/73 of the Commission of 6 June 1973 adjusting
    the compensatory amounts and variable components applicable during the second
    quarter of 1973 on importation of goods covered by Regulation (EEC) No 1059/69
    and containing milk or milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1858/73 de la Commission, du 6 juin 1973, portant rectification
    des montants compensatoires et des éléments mobiles applicables, pendant le
    deuxième trimestre de l'année 1973, à l'importation de marchandises relevant
    du règlement (CEE) n 1059/69, contenant du lait ou des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1858/73 der Kommission vom 6. Juni 1973 zur Berichtigung
    der Ausgleichsbeträge und beweglichen Teilbeträge für das zweite Vierteljahr
    1973 bei der Einfuhr von Waren, die Milch oder Milcherzeugnisse enthalten und
    unter die Verordnung (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1858/73 af 6. juni 1973 om berigtigelse
    af de udligningsbeløb og variable elementer, som i andet kvartal af 1973 skal
    anvendes ved indførsel af varer, henhørende under forordning (EØF) nr. 1059/69
    og indeholdende mælk eller mejeriprodukter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1858/73 della Commissione, del 6 giugno 1973, per
    la rettifica degli importi compensativi e degli elementi mobili applicabili durante
    il secondo trimestre dell'anno 1973, all'importazione delle merci cui si applica
    il regolamento (CEE) n. 1059/69, contenenti latte o prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1858/73 van de Commissie van 6 juni 1973 houdende
    verbetering van de variabele elementen en compenserende bedragen, toepasselijk
    gedurende het tweede kwartaal van 1973 bij invoer van onder Verordning (EEG) nr.
    1059/69 vallende goederen welke melk of melkprodukten bevatten
  type: main
