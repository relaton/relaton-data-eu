title:
- language: en
  script: Latn
  content: '2000/759/EC: Commission Decision of 1 December 2000 repealing Decision
    1999/253/EC on protective measures with regard to certain fishery products from
    or originating in Kenya and Tanzania and amending the health certification for
    fishery products originating or proceeding from Kenya (notified under document
    number C(2000) 3653)'
  type: main
- language: fr
  script: Latn
  content: '2000/759/CE: Décision de la Commission du 1er décembre 2000 abrogeant
    la décision 1999/253/CE relative à certaines mesures de protection à l''égard
    de certains produits de la pêche originaires ou en provenance du Kenya et de
    Tanzanie et modifiant le certificat sanitaire pour les produits de la pêche originaires
    ou provenant du Kenya [notifiée sous le numéro C(2000) 3653]'
  type: main
- language: de
  script: Latn
