title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2784/82 of 19 October 1982 re-establishing
    the levying of customs duties applicable to gelatin and gelatin derivatives falling
    within subheading 35.03 ex B and originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2784/82 de la Commission, du 19 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés de la sous-position 35.03 ex B du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseill
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2784/82 der Kommission vom 19. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für Gelatine und ihre Derivate der Tarifstelle 35.03
    ex B, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2784/82 af 19. oktober 1982 om genindførelse
    af opkrævning af told for gelatine og derivater deraf henhørende under pos.
    35.03 ex B og med oprindelse i Brasilien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81r
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2784/82 τής Επιτροπής
    τής 19ς Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τίς ζελατίνες καί
    τά παράγωγα αυτών, τής διακρίσεως 35. 03 ex B τού
    Κοινού Δασμολογίου, καταγωγής Βραζιλίας, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2784/82 della Commissione, del 19 ottobre 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e loro derivati,
    della sottovoce 35.03 ex B della tariffa doganale comune, originari del Brasile
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2784/82 van de Commissie van 19 oktober 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan van postonderverdeling 35.03 ex B, van oorsprong uit Brazilië,
    waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleende
  type: main
