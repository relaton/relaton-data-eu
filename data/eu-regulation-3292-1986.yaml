title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3292/86 of 29 October 1986 amending the
    Annex to Commission Regulation (EEC) No 2303/86 fixing, for the 1986/87 marketing
    year, the accession compensatory amounts applicable to rice and the coefficients
    to be used for the calculation of the amounts applicable to certain processed
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3292/86 de la Commission du 29 octobre 1986 modifiant
    l' annexe du règlement (CEE) n° 2303/86 fixant les montants compensatoires "adhésion"
    applicables dans le secteur du riz jusqu' à la fin de la campagne 1986/1987,
    ainsi que les coefficients à retenir pour le calcul des montants applicables
    à certains produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3292/86 der Kommission vom 29. Oktober 1986 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 2303/86 zur Festsetzung der im Wirtschaftsjahr
    1986/87 geltenden Beitrittsausgleichsbeträge für Reis sowie der Koeffizienten
    für die Berechnung der auf bestimmte Verarbeitungserzeugnisse anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3292/86 af 29. oktober 1986 om ændring
    af bilag i Kommissionens forordning (EØF) nr. 2303/86 om fastsættelse af tiltrædelsesudligningsbeløbene
    for ris for høståret 1986/87 samt af de koefficienter, der skal lægges til
    grund ved beregning af beløbene for visse forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3292/86 της Επιτροπής
    της 29ης Οκτωβρίου 1986 που τροποποιεί το παράρτημα
    του κανονισμού (ΕΟΚ) αριθ. 2303/86 για τον καθορισμό
    των εξισωτικών ποσών προσχώρησης που εφαρμόζονται
    στον τομέα του ρυζιού για την περίοδο 1986/87 καθώς
    και των συντελεστών που λαμβάνονται υπόψη
    για τον υπολογισμό των ποσών που εφαρμόζονται
    σε ορισμένα μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3292/86 della Commissione del 29 ottobre 1986 che
    modifica l' allegato del regolamento (CEE) n. 2303/86 che fissa gli importi compensativi
    adesione applicabili nel settore del riso per la campagna 1986/1987, nonché i
    coefficienti da prendere in considerazione per il calcolo degli importi applicabili
    a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3292/86 van de Commissie van 29 oktober 1986 tot
    wijziging van de bijlage van Verordening (EEG) nr. 2303/86 tot vaststelling voor
    het verkoopseizoen 1986/1987 van de compenserende bedragen toetreding voor de
    sector rijst, alsmede van de coëfficiënten voor de berekening van de bedragen
    die gelden voor sommige verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3292/86 da Comissão de 29 de Outubro de 1986 que
    altera o anexo do Regulamento (CEE) n.° 2303/86, que fixa os montantes compensatórios
    de adesão aplicáveis no sector do arroz para a campanha de 1986/1987, bem como
    os coeficientes a utilizar para o cálculo dos montantes aplicáveis a determinados
    produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3292/86 de la Comisión de 29 de octubre de 1986 por
    el que se modifica el Anexo del Reglamento (CEE) n° 2303/86 por el que se fijan
    los montantes compensatorios de adhesión aplicables en el sector del arroz para
    la campaña 1986/87, así como los coeficientes que deberán utilizarse para el
    cálculo de los importes aplicables a determinados productos transformados
  type: main
