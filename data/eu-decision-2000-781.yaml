title:
- language: en
  script: Latn
  content: '2000/781/EC: Commission Decision of 28 November 2000 amending Decision
    2000/293/EC on financial aid from the Community for the operation of certain Community
    reference laboratories in the field of animal health and live animals in relation
    to rabies (notified under document number C(2000) 3583) (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '2000/781/CE: Décision de la Commission du 28 novembre 2000 modifiant
    la décision 2000/293/CE concernant l''aide financière de la Communauté au fonctionnement
    de certains laboratoires communautaires de référence dans les domaines de la
    santé animale et des animaux vivants en ce qui concerne la rage [notifiée sous
    le numéro C(2000) 3583] (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
