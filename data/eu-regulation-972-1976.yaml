id: EURegulation9721976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 972/76 of 28 April 1976 re-establishing
    the levying of customs duties on other sheep and lambskin leather, falling within
    subheading 41.03 B II, originating in India to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 972/76 de la Commission, du 28 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d'ovins, préparées, non dénommées, de la sous-position tarifaire 41.03 B II,
    originaires de l'Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 972/76 der Kommission vom 28. April 1976 zur Wiedereinführung
    des Zollsatzes für bestimmtes Schaf- und Lammleder der Tarifstelle 41.03 B II
    mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 972/76 af 28. april 1976 om genindførelse
    af opkrævning af toldafgifter for, i andre tilfælde, læder af fåre- og lammeskind,
    andre varer, under underposition 41.03 B II, som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3010/75
    af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 972/76 della Commissione, del 28 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine,
    preparate, non nominate, della sottovoce doganale n. 41.03 B II originarie dell'India,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75
    del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 972/76 van de Commissie van 28 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op ander schapeleder,
    alsmede voorgelooide huiden en vellen, van schapen, overige, van onderverdeling
    41.03 B II, van oorsprong uit India, ten behoeve waarvan bij Verordening (EEG)
    nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties werden
    geopend
  type: main
