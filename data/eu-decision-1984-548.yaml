id: EUDecision1984548
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '84/548/EEC: Commission Decision of 7 November 1984 amending for the second
    time Decision 81/10/EEC determining the regions from which Greece may not consign
    to other Member States any bovine animal or swine, or any fresh meat from bovine
    animals, swine, sheep or goats, and repealing Decision 84/374/EEC concerning protective
    measures against foot-and-mouth disease in Greece'
  type: main
- language: fr
  script: Latn
  content: '84/548/CEE: Décision de la Commission du 7 novembre 1984 portant deuxième
    modification de la décision 81/10/CEE établissant les régions à partir desquelles
    la Grèce n'' expédie vers les autres États membres aucun animal des espèces
    bovine et porcine ni de viandes fraîches des espèces bovine, porcine, ovine
    et caprine et abrogeant la décision 84/374/CEE relative à certaines mesures
    de protection contre la fièvre aphteuse en Grèce'
  type: main
- language: de
  script: Latn
  content: '84/548/EWG: Entscheidung der Kommission vom 7. November 1984 zur zweiten
    Änderung der Entscheidung 81/10/EWG zur Festlegung der Gebiete, aus denen Griechenland
    weder Tiere der Gattungen Rind und Schwein noch frisches Fleisch von Rindern,
    Schweinen, Schafen und Ziegen in die übrigen Mitgliedstaaten versendet, und zur
    Aufhebung der Entscheidung 84/374/EWG über bestimmte Schutzmaßnahmen gegen die
    Maul- und Klauenseuche in Griechenland'
  type: main
- language: da
  script: Latn
  content: '84/548/EØF: Kommissionens beslutning af 7. november 1984 om anden ændring
    af beslutning 81/10/EØF om fastsættelse af de områder, hvorfra Grækenland
    undlader at sende kvæg og svin samt fersk okse-, svine-, fåre- eller gedekød
    til de øvrige medlemsstater og om ophævelse af beslutning 84/374/EØF om visse
    beskyttelsesforanstaltninger mod mund- og klovesyge i Grækenland'
  type: main
- language: el
  script: Grek
  content: '84/548/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Νοεμβρίου
    1984 για δεύτερη τροποποίηση της απόφασης 81/10/ΕΟΚ
    περί καθορισμού των περιφερειών από τις οποίες
    η Ελληνική Δημοκρατία δεν αποστέλλει προς
    τα υπόλοιπα κράτη μέλη κανένα βοοειδές και
    χοιροειδές, ούτε νωπά κρέατα βοοειδών, χοιροειδών,
    προβατοειδών και αιγοειδών και για κατάργηση
    της απόφασης 84/374/ΕΟΚ σχετικά με ορισμένα μέτρα
    προστασίας κατά του αφθώδους πυρετού στην
    Ελλάδα'
  type: main
- language: it
  script: Latn
  content: '84/548/CEE: Decisione della Commissione del 7 novembre 1984 recante seconda
    modifica della decisione 81/10/CEE, che stabilisce le regioni da cui la Grecia
    non spedisce, verso gli altri Stati membri, alcun animale delle specie bovina
    e suina, né carni fresche delle specie bovina, suina, ovina e caprina, e recante
    abrogazione della decisione 84/374/CEE, concernente certe misure di protezione
    contro l'' afta epizootica in Grecia'
  type: main
- language: nl
  script: Latn
  content: '84/548/EEG: Beschikking van de Commissie van 7 november 1984 houdende
    tweede wijziging van Beschikking 81/10/EEG tot vaststelling van de gebieden waaruit
    Griekenland geen runderen en varkens en geen vers vlees van runderen, varkens,
    geiten en schapen naar de andere Lid-Staten zendt, alsmede houdende intrekking
    van Beschikking 84/374/EEG betreffende bepaalde beschermingsmaatregelen tegen
    mond- en klauwzeer in Griekenland'
  type: main
