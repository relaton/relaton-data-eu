title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 741/79 of 11 April 1979 re-establishing
    the levying of customs duties on urea, falling within subheading 31.02 B and originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 741/79 de la Commission, du 11 avril 1979, portant
    rétablissement de la perception des droits de douane applicables à l' urée,
    de la sous-position 31.02 B du tarif douanier commun, originaire des pays en voie
    de développement, bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 741/79 der Kommission vom 11. April 1979 zur Wiedereinführung
    des Zollsatzes für Harnstoff der Tarifstelle 31.02 B, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 741/79 af 11. april 1979 om genindførelse
    af opkrævning af toldafgifter for urinstof, under underposition 31.02 B som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 741/79 della Commissione, dell' 11 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili all' urea della sottovoce
    31.02 B della tariffa doganale comune, originaria dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 741/79 van de Commissie van 11 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor ureum, van post 31.02
    B, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad tariefpreferenties werden geopend
  type: main
