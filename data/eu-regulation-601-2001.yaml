title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 601/2001 of 28 March 2001 fixing the guarantee
    threshold quantities which may be transferred to another group of varieties for
    the 2001 harvest in the raw tobacco sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 601/2001 de la Commission du 28 mars 2001 fixant les
    quantités de seuil de garantie autorisées à être transférées vers un autre
    groupe de variétés pour la récolte 2001 dans le secteur du tabac brut
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 601/2001 der Kommission vom 28. März 2001 zur Festsetzung
    der Garantieschwellenmengen im Rohtabaksektor, die für die Ernte 2001 auf eine
    andere Sortengruppe übertragen werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 601/2001 af 28. marts 2001 om fastsættelse
    af de garantitærskelmængder, som det i sektoren for råtobak for 2001-høsten
    er tilladt at overføre til en anden sortsgruppe
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 601/2001 της Επιτροπής,
    της 28ης Μαρτίου 2001, για τον καθορισμό των ποσοτήτων
    κατωφλίου εγγύησης που επιτρέπονται να μεταφερθούν
    προς άλλη ομάδα ποικιλιών για τη συγκομιδή
    του 2001 στον τομέα του ακατέργαστου καπνού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 601/2001, annettu 28 päivänä maaliskuuta 2001,
    toiseen lajikeryhmään siirrettävistä takuukynnysten määristä raakatupakka-alalla
    satovuoden 2001 osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 601/2001 della Commissione, del 28 marzo 2001, che
    stabilisce i quantitativi del limite di garanzia autorizzati a essere trasferiti
    a un altro gruppo di varietà per il raccolto 2001 nel settore del tabacco greggio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 601/2001 van de Commissie van 28 maart 2001 tot vaststelling,
    voor het oogstjaar 2001, van de garantiedrempelhoeveelheden die in de sector ruwe
    tabak naar een andere soortengroep mogen worden overgedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 601/2001 da Comissão, de 28 de Março de 2001, que
    fixa as quantidades de limiar de garantia que beneficiam de autorização de transferência
    para outro grupo de variedades, na colheita de 2001, no sector do tabaco em rama
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 601/2001 de la Comisión, de 28 de marzo de 2001, por
    el que se fijan las cantidades del umbral de garantía que podrán transferirse
    a otro grupo de variedades a efectos de la cosecha de 2001 en el sector del tabaco
    crudo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 601/2001 av den 28 mars 2001 om fastställande
    av de garantitröskelkvantiteter som för skörden 2001 får överföras till
    en annan sortgrupp inom sektorn för råtobak
  type: main
