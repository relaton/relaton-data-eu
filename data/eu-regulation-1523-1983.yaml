title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1523/83 of 10 June 1983 re-establishing
    the levying of customs duties on articles of apparel, gloves and other clothing
    accessories falling within subheadings 42.03 A, B II, III, C and originating in
    India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1523/83 de la Commission du 10 juin 1983 portant rétablissement
    de la perception des droits de douane applicables aux vêtements, gants et autres
    accessoires du vêtement, des sous-positions 42.03 A, B II, III, C du tarif douanier
    commun, originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1523/83 der Kommission vom 10. Juni 1983 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung, Handschuhe und anderes Bekleidungszubehör
    der Tarifstellen 42.03 A, B II, B III und C, mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1523/83 af 10. juni 1983 om genindførelse
    af opkrævning af told for beklædningsgenstande, handsker og tilbehør til beklædningsgenstande,
    henhørende under position 42.03 A, B II, B III og C i den fælles toldtarif og
    med oprindelse i Indien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1523/83 της Επιτροπής
    της 10ης Ιουνίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ενδύματα, χειρόκτια
    και έτερα συμπληρώματα της ενδύσεως των διακρίσεων
    42.03 Α, Β ΙΙ, Β ΙΙΙ και Γ του Κοινού Δασμολογίου,
    καταγωγής Ινδίας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1523/83 della Commissione del 10 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili a oggetti di vestiario, guanti e
    altri accessori per oggetti di vestiario delle sottovoci 42.03 A, B II-III, C
    della tariffa doganale comune, originari dell' India, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1523/83 van de Commissie van 10 juni 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding, handschoenen
    en ander kledingtoebehoren, van de postonderverdelingen 42.03 A, B II, B III,
    C, van oorsprong uit India, waarvoor de in Verordening (EEG) nr. 3377/82 van de
    Raad vermelde tariefpreferenties zijn verleend
  type: main
