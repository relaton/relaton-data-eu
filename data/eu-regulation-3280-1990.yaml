  script: Latn
  content: Commission Regulation (EEC) No 3280/90 of 13 November 1990 re-establishing
    the levying of customs duties applicable to products falling within CN code 3503
    00 10 originating in Pakistan, to which the preferential arrangements of Council
    Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3280/90 de la Commission du 13 novembre 1990 portant
