---
id: EUDecision1977638
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 August 1977 authorizing the Federal Republic
    of Germany not to apply Community treatment to woven fabrics of regenerated textile
    fibres, containing 85 % or more by weight of regenerated textile fibres, unbleached
    or bleached, falling within subheading ex 56.07 B of Common Customs Tariff, originating
    in the People's Republic of China and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '77/638/CEE: Décision de la Commission, du 11 août 1977, autorisant la
    République fédérale d''Allemagne à exclure du traitement communautaire les
    tissus de fibres textiles artificielles, contenant au moins 85 % en poids de fibres
    textiles artificielles, écrus ou blanchis, de la position Ex 56.07 B du Tarif
    douanier commun, originaires de la République populaire de Chine et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. August 1977, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Volksrepublik China stammende und in den
    anderen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen
    Spinnfasern, mit einem Anteil an künstlichen Spinnfasern von 85 Gewichtshundertteilen
    und mehr, roh oder gebleicht, der Tarifnummer ex 56.07 B des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 11. august 1977 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage vævet stof af regenerede fibre,
    ubleget eller bleget, med indhold af regenerede fibre på 85 vægtprocent og derover,
    som henhører under pos. ex 56.07 B i den fælles toldtarif, har oprindelse i
    Den kinesiske Folkerepublik og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 agosto 1977, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario i tessuti di fibre
    tessili artificiali, contenenti almeno 1'85 % in peso di fibre grezze o imbianchite,
    della voce ex 56.07 B della tariffa doganale comune, originari della Repubblica
    popolare cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 augustus 1977 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd weefsels van kunstmatige vezels, bevattende ten minste
    85 gewichtspercenten kunstmatige vezels, ongebleekt of gebleekt, van post ex 56.07
    B van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
