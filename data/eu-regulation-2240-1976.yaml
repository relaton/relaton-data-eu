title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2240/76 of 15 September 1976 extending the
    period of validity of the arrangements for exceptional intervention measures in
    the beef and veal sector in certain regions of the Community most affected by
    the drought, and extending those measures to Denmark
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2240/76 de la Commission, du 15 septembre 1976, prorogeant
    le régime des mesures exceptionnelles d'intervention dans le secteur de la viande
    bovine à prendre dans certaines régions de la Communauté les plus touchées
    par la sécheresse et comportant extension de ces mesures au Danemark
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2240/76 der Kommission vom 15. September 1976 zur
    Fortschreibung der außergewöhnlichen Interventionsmaßnahmen auf dem Rindfleischsektor
    für einige, durch die Trockenheit am stärksten betroffene Gebiete der Gemeinschaft,
    und zur Ausdehnung dieser Maßnahmen auf Dänemark
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2240/76 af 15. september 1976 om forlængelsen
    af ordningen om de særlige interventionsforanstaltninger, der skal træffes inden
    for oksekødsektoren i de hårdest tørkeramte områder i Fællesskabet, og om
    udvidelse af disse foranstaltninger til også at omfatte Danmark
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2240/76 della Commissione, del 15 settembre 1976,
    che proroga il regime di misure eccezionali d'intervento da applicare nel settore
    delle carni bovine in alcune regioni della Comunità maggiormente colpite dalla
    siccità e che estende tali misure alla Danimarca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2240/76 van de Commissie van 15 september 1976 tot
    verlenging van de geldigheidsduur van de uitzonderlijke interventiemaatregelen
    in de rundvleessector, die worden genomen in de door de droogte het meest getroffen
    gebieden van de Gemeenschap en houdende uitbreiding van deze maatregelen tot Denemarken
  type: main
