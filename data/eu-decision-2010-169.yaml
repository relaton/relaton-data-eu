title:
- language: en
  script: Latn
  content: '2010/169/: Commission Decision of 19 March 2010 concerning the non-inclusion
    of 2,4,4’-trichloro-2’-hydroxydiphenyl ether in the Union list of additives
    which may be used in the manufacture of plastic materials and articles intended
    to come into contact with foodstuffs under Directive 2002/72/EC (notified under
    document C(2010) 1613)'
  type: main
- language: fr
  script: Latn
  content: '2010/169/: Décision de la Commission du 19 mars 2010 relative à la non-inscription
    du 2,4,4’-trichloro-2’-hydroxy diphényl éther sur la liste UE des additifs
    pouvant, conformément à la directive 2002/72/CE, entrer dans la fabrication
    des matériaux et objets en matière plastique destinés à entrer en contact
    avec les denrées alimentaires [notifiée sous le numéro C(2010) 1613]'
  type: main
- language: de
  script: Latn
  content: '2010/169/: Beschluss der Kommission vom 19. März 2010 über die Nichtaufnahme
    von 2,4,4’-Trichloro-2’-hydroxydiphenylether in das in der Richtlinie 2002/72/EG
    enthaltene Unionsverzeichnis von Additiven, die bei der Herstellung von Materialien
    und Gegenständen aus Kunststoff, die dazu bestimmt sind, mit Lebensmitteln in
    Berührung zu kommen, verwendet werden dürfen (Bekannt gegeben unter Aktenzeichen
    K(2010) 1613)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/169/ЕС: Решение на Комисията от 19 март
    2010 година относно невключването на 2,4,4’-трихлоро-2’-хидроксидифенилов
    етер в списъка на Съюза на добавките, които
    могат да бъдат използвани за производството
    на материали и предмети от пластмаси, предназначени
    за контакт с храни съгласно Директива 2002/72/ЕО
    (нотифицирано под номер C(2010) 1613)'
  type: main
- language: cs
  script: Latn
