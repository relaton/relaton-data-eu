    z plastů určených pro styk s potravinami, podle směrnice 2002/72/ES (oznámeno
    pod číslem K(2010) 1613)'
  type: main
- language: da
  script: Latn
  content: '2010/169/: Kommissionens afgørelse af 19. marts 2010 om afvisning af
    at optage 2,4,4’-trichlor-2’-hydroxydiphenylether på EU-listen over additiver,
    der kan anvendes ved fremstilling af plastmaterialer og -genstande bestemt til
    kontakt med fødevarer, jf. direktiv 2002/72/EF (meddelt under nummer K(2010)
    1613)'
  type: main
