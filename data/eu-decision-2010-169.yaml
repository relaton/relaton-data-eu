    műanyag tárgyak előállításához felhasználható adalékanyagoknak – a
    2002/72/EK irányelvben foglalt – uniós listájára történő fel nem vételéről
    (az értesítés a C(2010) 1613. számú dokumentummal történt)'
  type: main
