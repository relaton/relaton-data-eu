title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 945/80 of 14 April 1980 re-establishing
    the levying of customs duties on carpets, carpeting, rugs, mats and matting, products
    of category 142 (code 1420), originating in Mexico, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 945/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux tapis de
    poils grossiers, de la catégorie 142 (code 1420), originaires du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 945/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für Teppiche aus groben Tierhaaren der Warenkategorie
    Nr. 142 (Kennziffer 1420), mit Ursprung in Mexiko, dem die in der Verordnung (EWG)
    Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 945/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for gulvtæpper af grove dyrehår, under varekategori
    nr. 142 (kode 1420), som har oprindelse i Mexico og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 945/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di peli grossolani,
    della categoria di prodotti n. 142 (codice 1420), originari del Messico beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 945/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapijten
    van grof haar van de categorie van produkten nr. 142 (codenummer 1420), van oorsprong
    uit Mexico waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2894/79 van de Raad
  type: main
