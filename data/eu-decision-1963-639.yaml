title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 novembre 1963, autorisant le Royaume
    de Belgique et le Grand-Duché de Luxembourg à différer le rapprochement des
    droits de leurs tarifs nationaux vers ceux du Tarif douanier commun en ce qui
    concerne certains poissons
  type: main
- language: de
  script: Latn
  content: '63/639/EWG: Entscheidung der Kommission vom 19. November 1963, mit der
    das Königreich Belgien und das Großherzogtum Luxemburg ermächtigt werden, für
    einige Fischarten die Angleichung ihrer Tarife an den Gemeinsamen Zolltarif aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '63/639/CEE: Decisione della Commissione del 19 novembre 1963 con cui si
    autorizza il Regno del Belgio e il Granducato del Lussemburgo a differire il ravvicinamento
    dei dazi delle tariffe nazionali a quelli della tariffa doganale comune per quanto
    concerne alcuni pesci'
  type: main
- language: nl
  script: Latn
  content: '63/639/EEG: Beschikking van de Commissie van 19 november 1963 houdende
    machtiging van het Koninkrijk België en het Groothertogdom Luxemburg, de aanpassing
    van de rechten van hun nationale douanetarieven aan die van het gemeenschappelijk
    douanetarief voor sommige vissoorten uit te stellen'
  type: main
