  script: Latn
  content: Decisión de Ejecución (UE) 2023/2915 del Consejo, de 11 de diciembre
    de 2023, sobre la determinación, de conformidad con el artículo 8, apartado
    10, párrafo segundo, del Acuerdo entre la Unión Europea e Islandia y Noruega
    sobre la aplicación de determinadas disposiciones de la Decisión 2008/615/JAI
    del Consejo sobre la profundización de la cooperación transfronteriza, en particular
    en materia de lucha contra el terrorismo y la delincuencia transfronteriza, y
    de la Decisión 2008/616/JAI del Consejo relativa a la ejecución de la Decisión
    2008/615/JAI sobre la profundización de la cooperación transfronteriza, en particular
    en materia de lucha contra el terrorismo y la delincuencia transfronteriza, y
    de su anexo, de la fecha a partir de la cual los Estados miembros podrán comunicar
    a Noruega datos personales relativos a datos de ADN, datos dactiloscópicos y
    datos de matriculación de vehículos
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2023/2915 av den 11 december 2023 om fastställandet,
    enligt artikel 8.10 andra stycket i avtalet mellan Europeiska unionen och Island
    och Norge om tillämpningen av vissa bestämmelser i rådets beslut 2008/615/RIF
    om ett fördjupat gränsöverskridande samarbete, särskilt för bekämpning av
    terrorism och gränsöverskridande brottslighet och rådets beslut 2008/616/RIF
    om genomförande av beslut 2008/615/RIF om ett fördjupat gränsöverskridande
    samarbete, särskilt för bekämpning av terrorism och gränsöverskridande brottslighet,
    och bilagan till detta, av det datum från och med vilket personuppgifter med
    anknytning till DNA-uppgifter, fingeravtrycksuppgifter och uppgifter ur fordonsregister
    får översändas av medlemsstaterna till Norge
  type: main
