title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2073/76 of 20 August 1976 concerning the
    issue of an invitation to tender for the supply to the Office of the United Nations
    High Commissioner for Refugees for the benefit of the people of Vietnam for use
    as food aid of vitaminized skimmed-milk powder to be purchased on the Community
    market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2073/76 de la Commission, du 20 août 1976, relatif
    à l'adjudication pour la fourniture, au titre de l'aide alimentaire, de lait
    écrémé en poudre vitaminé acheté sur le marché de la Communauté et destiné
    au Haut-Commissariat des Nations Unies pour les réfugiés en faveur des populations
    du Vietnam
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2073/76 der Kommission vom 20. August 1976 über die
    Ausschreibung einer Lieferung von auf dem Markt der Gemeinschaft gekauftem Magermilchpulver
    mit zugesetzten Vitaminen an das Hohe Kommissariat der Vereinten Nationen für
    Flüchtlinge im Rahmen der Nahrungsmittelhilfe zugunsten der Bevölkerung von
    Vietnam
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2073/76 af 20. august 1976 om licitation
    med henblik på levering af vitaminiseret skummetmælkspulver, der er opkøbt
    på Fællesskabets marked og bestemt til De forenede Nationers Højkommissariat
    for Flygtninge som fødevarehjælp til fordel for befolkningen i Vietnam
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2073/76 della Commissione, del 20 agosto 1976, che
    indice una gara per la fornitura, a titolo di aiuto alimentare, di latte scremato
    in polvere vitaminizzato acquistato sul mercato della Comunità e destinato all'Alto
    Commissariato delle Nazioni Unite per i profughi a favore delle popolazioni del
    Vietnam
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2073/76 van de Commissie van 20 augustus 1976 met
    betrekking tot de openbare inschrijving voor de levering van gevitamineerd magere-melkpoeder,
    gekocht op de markt van de Gemeenschap en bestemd voor het Bureau van de Hoge
    Commissaris van de Verenigde Naties voor vluchtelingen ten behoeve van de bevolking
    van Vietnam
  type: main
