title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2077 of 27 October 2022 designating
    the European Union reference centre responsible for the scientific and technical
    contribution to the establishment and harmonisation of the methods for the preservation
    of endangered breeds, and the preservation of the genetic diversity existing within
    those breeds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2077 de la Commission du 27 octobre
    2022 désignant le centre de référence de l’Union européenne chargé de contribuer
    sur le plan scientifique et technique à l’établissement et à l’harmonisation
    des méthodes de préservation des races menacées et de la diversité génétique
    au sein de ces races
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2077 der Kommission vom 27. Oktober
