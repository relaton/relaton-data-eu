title:
- language: en
  script: Latn
  content: Commission Decision of 3 November 1977 on the reimbursement by the Guidance
    Section of the EAGGF to the Kingdom of Belgium of expenditure incurred during
    1976 on annuities relating to measures to encourage the cessation of farming and
    the reallocation of utilized agricultural area for the purpose of structural improvement
  type: main
- language: fr
  script: Latn
  content: '77/691/CEE: Décision de la Commission, du 3 novembre 1977, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique, des dépenses effectuées, pendant
    l''année 1976, pour les indemnités relatives à l''encouragement de la cessation
    de l''activité agricole et à l''affectation de la superficie agricole utilisée
    à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. November 1977 über die Rückvergütung
    der im Jahr 1976 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abeilung Ausrichtung, an das Königreich
    Belgien
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. november 1977 om refusion gennem EUGFL,
    udviklingssektionen, til kongeriget Belgien af de udgifter, som er afholdt i løbet
    af året 1976 til godtgørelser vedrørende støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 novembre 1977, relativa al rimborso
    da parte del FEAOG, sezione orientamento, al Regno del Belgio delle spese effettuate
    durante il 1976 per le indennità concernenti l'incoraggiamento alla cessazione
    dell'attività agricola e alla destinazione della superficie agricola utilizzata
    a scopi di miglioramento delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 november 1977 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van de gedurende
    het jaar 1976 gedane uitgaven voor de uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van aanwending van cultuurgrond
    tot verbetering van de structuur
