title:
- language: en
  script: Latn
  content: '94/590/EC: Commission Decision of 12 April 1994 concerning the grant of
    assistance from the cohesion financial instrument to the set of stages of projects
    in Greece: sewerage and biological treatment in Skydra, sewerage and biological
    treatment in Krya Vrisi, sewerage and biological treatment in Palio Kavalas, waste
    water treatment plants in greater Volos, waste water treatment plants in Trikala
    Nos CF: 93/09/61/015 - 2/93/09/61/017 - 2/93/09/61/042 (Only the Greek text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/590/CE: Décision de la Commission, du 12 avril 1994, relative à l''octroi
    d''un concours de l''instrument financier de cohésion pour une série de phases
    de projets concernant les réseaux d''égouts et les stations d''épuration biologique
    de Skdra, de Krya Vryssi, de Palio Kavala, ainsi que les stations d''épuration
    du Grand Volos et de Trikala, en Grèce n° FC: 93/09/61/015 - 2/93/09/61/017
    - 2/93/09/61/042 (Le texte en langue grecque est le seul faisant foi)'
