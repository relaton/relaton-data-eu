  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2864/2000, annettu 27 päivänä joulukuuta 2000,
    eräistä yhteisön tariffikiintiöinä annettavista, tiettyjä Bulgariasta, Tšekistä,
    Slovakiasta ja Romaniasta peräisin olevia maataloustuotteita koskevista myönnytyksistä
    annettujen asetusten (EY) N:o 2290/2000, (EY) N:o 2433/2000, (EY) N:o 2434/2000
    ja (EY) N:o 2435/2000 soveltamista koskevista yksityiskohtaisista säännöistä
    vilja-alan tuotteiden osalta ja asetuksen (EY) N:o 1218/96 muuttamisesta annetun
    asetuksen (EY) N:o 2809/2000 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2864/2000 della Commissione, del 27 dicembre 2000,
    che modifica il regolamento (CE) n. 2809/2000 che stabilisce le modalità di applicazione,
    per i prodotti del settore cerealicolo, dei regolamenti (CE) n. 2290/2000, (CE)
    n. 2433/2000, (CE) n. 2434/2000 e (CE) n. 2435/2000, che stabiliscono talune concessioni
    sotto forma di contingenti tariffari comunitari per taluni prodotti agricoli provenienti,
    rispettivamente, dalla Repubblica di Bulgaria, dalla Repubblica ceca, dalla Repubblica
    slovacca e dalla Romania e che modifica il regolamento (CE) n. 1218/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2864/2000 van de Commissie van 27 december 2000 tot
    wijziging van Verordening (EG) nr. 2809/2000 houdende toepassingsbepalingen wat
    de producten van de graansector betreft, van de Verordeningen (EG) nr. 2290/2000,
    (EG) nr. 2433/2000, (EG) nr. 2434/2000 en (EG) nr. 2435/2000 waarbij bepaalde
    concessies in de vorm van communautaire tariefcontingenten voor bepaalde landbouwproducten
    van oorsprong uit respectievelijk Bulgarije, de Tsjechische Republiek, de Slowaakse
    Republiek en Roemenië zijn vastgesteld, en houdende wijziging van Verordening
    (EG) nr. 1218/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2864/2000 da Comissão, de 27 de Dezembro de 2000,
    que altera o Regulamento (CE) n.o 2809/2000 que estabelece as normas de execução,
    para os produtos do sector dos cereais, dos Regulamentos (CE) n.o 2290/2000, (CE)
    n.o 2433/2000, (CE) n.o 2434/2000 e (CE) n.o 2435/2000 que estabelecem determinadas
    concessões sob a forma de contingentes pautais comunitários para certos produtos
    agrícolas provenientes, respectivamente, da República da Bulgária, da República
    Checa, da República Eslovaca e da Roménia, e que altera o Regulamento (CE) n.o
    1218/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2864/2000 de la Comisión, de 27 de diciembre de 2000,
    que modifica el Reglamento (CE) nº 2809/2000 por el que se establecen disposiciones
    de aplicación, en relación con los productos del sector de los cereales, de
    los Reglamentos (CE) nº 2290/2000, (CE) nº 2433/2000, (CE) nº 2434/2000 y (CE)
    nº 2435/2000, por los que se establecen determinadas concesiones en forma de
    contingentes arancelarios comunitarios para determinados productos agrícolas
    procedentes, respectivamente, de la República de Bulgaria, de la República Checa,
    de la República Eslovaca y de Rumania, y por el que se modifica el Reglamento
    (CE) nº 1218/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2864/2000 av den 27 december 2000 om
    ändring av förordning (EG) nr 2809/2000 om tillämpningsbestämmelser för produkter
    inom spannmålssektorn för förordningarna (EG) nr 2290/2000, (EG) nr 2433/2000,
    (EG) nr 2434/2000 och (EG) nr 2435/2000, om vissa medgivanden i form av gemenskapstullkvoter
    för vissa jordbruksprodukter med ursprung i Bulgarien, Tjeckiska republiken,
    Slovakiska republiken och Rumänien och om ändring av förordning (EG) nr 1218/96
