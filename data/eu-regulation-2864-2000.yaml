title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2864/2000 of 27 December 2000 amending Regulation
    (EC) No 2809/2000 laying down detailed rules for the application, for cereals
    sector products, of Regulations (EC) No 2290/2000, (EC) No 2433/2000, (EC) No
    2434/2000 and (EC) No 2435/2000 establishing certain concessions in the form of
    Community tariff quotas for certain agricultural products originating in the Republic
    of Bulgaria, the Czech Republic, the Slovak Republic and Romania respectively
    and amending Regulation (EC) No 1218/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2864/2000 de la Commission du 27 décembre 2000 modifiant
    le règlement (CE) nº 2809/2000 portant modalités d'application, pour les produits
    du secteur des céréales, des règlements (CE) nº 2290/2000, (CE) nº 2433/2000,
    (CE) nº 2434/2000 et (CE) nº 2435/2000 établissant certaines concessions sous
    forme de contingents tarifaires communautaires pour certains produits agricoles
    en provenance respectivement de la République de Bulgarie, la République tchèque,
    la République slovaque et la Roumanie et modifiant le règlement (CE) nº 1218/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2864/2000 der Kommission vom 27. Dezember 2000 zur
    Änderung der Verordnung (EG) Nr. 2809/2000 mit Durchführungsbestimmungen für
    die Erzeugnisse des Getreidesektors zu den Verordnungen (EG) Nr. 2290/2000, (EG)
    Nr. 2433/2000, (EG) Nr. 2434/2000 und (EG) Nr. 2435/2000 hinsichtlich der Zugeständnisse
    in Form von gemeinschaftlichen Zollkontingenten für bestimmte landwirtschaftliche
    Erzeugnisse mit Ursprung in der Republik Bulgarien, der Tschechischen Republik,
    der Slowakischen Republik und in Rumänien sowie zur Änderung der Verordnung
    (EG) Nr. 1218/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2864/2000 af 27. december 2000 om ændring
    af forordning (EF) nr. 2809/2000 om gennemførelsesbestemmelser, for så vidt
    angår kornprodukter, til forordning (EF) nr. 2290/2000, (EF) nr. 2433/2000, (EF)
    nr. 2434/2000 og (EF) nr. 2435/2000 om visse indrømmelser i form af EF-toldkontingenter
    for visse landbrugsprodukter indført fra henholdsvis Republikken Bulgarien, Den
    Tjekkiske Republik, Den Slovakiske Republik og Rumænien og om ændring af forordning
    (EF) nr. 1218/96
  type: main
