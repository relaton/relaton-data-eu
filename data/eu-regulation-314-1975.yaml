  content: Regulation (EEC) No 314/75 of the Commission of 7 February 1975 on a standing
    invitation to tender to determine subsidies on the importation of white and raw
    sugar without authorization to export subsequently free of levy a corresponding
    quantity
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 314/75 de la Commission, du 7 février 1975, concernant
    une adjudication permanente pour la détermination de subventions à l'importation
    de sucre blanc et brut sans autorisation d'exporter ultérieurement en franchise
    du prélèvement une quantité correspondante
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 314/75 der Kommission vom 7. Februar 1975 betreffend
    eine Dauerausschreibung für die Bestimmung der Subventionen bei der Einfuhr von
    Weiß- und Rohzucker ohne Ermächtigung, später eine entsprechende Menge abschöpfungsfrei
    auszuführen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 314/75 af 7. februar 1975 om en løbende
    licitation med henblik på fastlæggelse af tilskud, som skal ydes ved indførsel
    af hvidt sukker og råsukker uden bemyndigelse til senere afgiftsfrit at udføre
    en tilsvarende mængde
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 314/75 della Commissione, del 7 febbraio 1975, relativo
    ad una gara permanente per la determinazione di sovvenzioni all'importazione di
    zucchero bianco e greggio senza autorizzazione di esportare successivamente in
    esenzione dal prelievo un quantitativo corrispondente
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 314/75 van de Commissie van 7 februari 1975 inzake
    een permanente inschrijving voor de vaststelling van invoersubsidies voor witte
    en ruwe suiker zonder machtiging om later een overeenkomstige hoeveelheid met
    vrijstelling van heffing uit te voeren
