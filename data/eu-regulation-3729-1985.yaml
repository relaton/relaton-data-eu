title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3729/85 of 20 December 1985 laying down for
    1986 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non-member countries in the 200-nautical-mile
    zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3729/85 du Conseil du 20 décembre 1985 fixant pour
    1986 certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de certains pays tiers dans la zone de
    200 milles située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3729/85 des Rates vom 20. Dezember 1985 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1986)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3729/85 af 20. december 1985 om fastsættelse
    af en række foranstaltninger for 1986 til bevarelse og forvaltning af fiskerressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3729/85 του Συμβουλίου
    της 20ής Δεκεμβρίου 1985 για τον καθορισμό, για
    το 1986, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων, τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    εντός της ζώνης 200 μιλίων η οποία ευρίσκεται
    στα ανοικτά των ακτών του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3729/85 del Consiglio del 20 dicembre 1985 che stabilisce,
    per il 1986, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese delle Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3729/85 van de Raad van 20 december 1985 houdende
    maatregelen voor 1986 voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3729/85 do Conselho, de 20 de Dezembro de 1985,
    que fixa, para 1986, certas medidas de conservação e de gestão dos recursos
    da pesca aplicáveis aos navios que arvoram pavilhão de certos países terceiros
    na zona de 200 milhas situada ao largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3729/85 del Consejo, de 20 de diciembre de 1985, por
    el que se establecen, para 1986, determinadas medidas de conservación y gestión
    de los recursos pesqueros aplicables a los buques que enarbolen pabellón de determinados
    terceros países en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
  type: main
