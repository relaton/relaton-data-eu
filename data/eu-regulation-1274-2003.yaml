    su alcuni tipi di cavi di ferro o di acciaio originari della Repubblica ceca,
    della Russia, della Tailandia e della Turchia e accetta gli impegni offerti da
    alcuni esportatori della Repubblica ceca e della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1274/2003 van de Commissie van 11 juni 2003 tot wĳziging
