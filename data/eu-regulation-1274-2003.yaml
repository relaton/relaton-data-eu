    (ΕΚ) αριθ. 230/2001 της Επιτροπής για επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    τύπων συρματόσχοινων και καλωδίων από σίδηρο
