    på importen af tovværk og kabler af jern og stål med oprindelse i Den Tjekkiske
    Republik, Rusland, Thailand og Tyrkiet og om godtagelse af tilsagn fra visse eksportører
    i Den Tjekkiske Republik og Tyrkiet
  type: main
- language: el
  script: Grek
