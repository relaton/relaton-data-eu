    tai teräsköysien ja -kaapeleiden tuontia koskevan väliaikaisen polkumyyntitullin
    käyttöönotosta annetun asetuksen N:o 230/2001 muuttamisesta ja tiettyjen tšekkiläisten
    ja turkkilaisten viejien tarjoamien sitoumusten hyväksymisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1274/2003 della Commissione, dell'11 giugno 2003, che
