title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1274/2003 of 11 June 2003 amending Regulation
    (EC) No 230/2001 imposing a provisional anti-dumping duty on certain iron or steel
    ropes and cables originating in the Czech Republic, Russia, Thailand and Turkey
    and accepting undertakings offered by certain exporters in the Czech Republic
    and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1274/2003 de la Commission du 11 juin 2003 modifiant
    le règlement (CE) n° 230/2001 instituant un droit antidumping provisoire sur
    les importations de certains câbles en fer ou en acier originaires de la République
    tchèque, de Russie, de Thaïlande et de Turquie et portant acceptation des engagements
    offerts par certains exportateurs tchèques et turcs
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1274/2003 der Kommission vom 11. Juni 2003 zur Änderung
    der Verordnung (EG) Nr. 230/2001 der Kommission zur Einführung eines vorläufigen
    Antidumpingzolls auf die Einfuhren bestimmter Kabel und Seile aus Eisen oder Stahl
    mit Ursprung in der Tschechischen Republik, Russland, Thailand und der Türkei
    und zur Annahme von Verpflichtungsangeboten bestimmter Ausführer in der Tschechischen
    Republik und der Türkei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1274/2003 af 11. juni 2003 om ændring
