title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3048/81 of 19 October 1981 determining the
    amounts of the variable components, accession compensatory amounts and additional
    duties applicable from 1 November 1981 to 31 January 1982 on the importation into
    the Community of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3048/81 de la Commission, du 19 octobre 1981, déterminant
    les montants des éléments mobiles et les montants compensatoires "adhésion",
    ainsi que les droits additionnels applicables pendant la période du 1er novembre
    1981 au 31 janvier 1982 inclus à l' importation dans la Communauté des marchandises
    relevant du règlement (CEE) n° 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3048/81 der Kommission vom 19. Oktober 1981 zur Festsetzung
    der Höhe der vom 1. November 1981 bis einschließlich 31. Januar 1982 bei der
    Einfuhr der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    geltenden beweglichen Teilbeträge, Beitrittsausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3048/81 af 19. oktober 1981 om fastsættelse
    af størrelsen af de variable elementer, tiltrædelsesudligningsbeløb og tillægstold
    for indførsel i Fællesskabet af varer henhørende under forordning (EØF) nr.
    3033/80 for perioden fra den 1. november 1981 til den 31. januar 1982
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3048/81 τής Επιτροπής
    τής 19ης Οκτωβρίου 1981 περί καθορισμού τών ποσών
    τών κινητών στοιχείων καί τών εξισωτικών ποσών
    προσχωρήσεως, καθώς καί τών πρόσθετων δασμών
    πού εφαρμόζονται κατά τήν περίοδο από 1ης Νοεμβρίου
    1981 μέχρι καί 31ης Ιανουαρίου 1982 κατά τήν εισαγωγή
    στήν Κοινότητα εμπορευμάτων πού υπάγονται
    στόν κανονισμό (EOK) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3048/81 della Commissione, del 19 ottobre 1981, che
    determina gli importi degli elementi mobili e gli importi compensativi adesione,
    nonché i dazi addizionali applicabili all' importazione nella Comunità, per
    il periodo dal 1° novembre 1981 al 31 gennaio 1982, delle merci cui si applica
    il regolamento (CEE) n. 3033/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3048/81 van de Commissie van 19 oktober 1981 tot
    vaststelling van het beloop der van 1 november 1981 tot en met 31 januari 1982
    bij invoer in de Gemeenschap van onder Verordening (EEG) nr. 3033/80 vallende
    goederen toe te passen variabele elementen, compenserende bedragen ,,toetreding'
    ' en aanvullende invoerrechten
  type: main
