title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1818/92 of 2 July 1992 fixing the representative
    market rates to be applied for certain amounts in the context of the common agricultural
    policy and, in particular, for the calculation of the monetary compensatory amounts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1818/92 de la Commission, du 2 juillet 1992, fixant
    les taux représentatifs du marché à appliquer pour certains montants dans le
    cadre de la politique agricole commune, et notamment pour le calcul des montants
    compensatoires monétaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1818/92 der Kommission vom 2. Juli 1992 zur Festsetzung
    der repräsentativen Marktkurse, die für bestimmte Beträge im Rahmen der gemeinsamen
    Agrarpolitik, insbesondere für die Berechnung der Währungsausgleichsbeträge,
    angewendet werden müssen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1818/92 af 2. juli 1992 om fastsættelse
    af de repræsentative markedskurser, der skal anvendes for visse beløb i forbindelse
    med den fælles landbrugspolitik, navnlig ved beregning af de monetære udligningsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1818/92 της Επιτροπής
    της 2ας Ιουλίου 1992 για τον καθορισμό των αντιπροσωπευτικών
    ισοτιμιών της αγοράς που θα εφαρμοστούν σε
    ορισμένα ποσά στα πλαίσια της κοινής γεωργικής
    πολιτικής και κυρίως για τον υπολογισμό των
    νομισματικών εξισωτικών ποσών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1818/92 della Commissione, del 2 luglio 1992, che
    fissa i tassi rappresentativi del mercato da applicare a taluni importi nel quadro
    della politica agricola comune, in particolare per il calcolo degli importi compensativi
    monetari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1818/92 van de Commissie van 2 juli 1992 tot vaststelling
    van de representatieve marktkoersen die moeten worden toegepast voor bepaalde
    bedragen in het kader van het gemeenschappelijk landbouwbeleid, en met name voor
    de berekening van de monetaire compenserende bedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1818/92 da Comissão, de 2 de Julho de 1992, que
