title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2890/79 of 20 December 1979 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2890/79 de la Commission, du 20 décembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes à incandescence pour l' éclairage de la sous-position 85.20 A du tarif
    douanier commun, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2890/79 der Kommission vom 20. Dezember 1979 zur Wiedereinführung
    des Zollsatzes für Glühlampen für elektrische Beleuchtung der Tarifstelle 85.20
    A, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2890/79 af 20. december 1979 om genindførelse
    af opkrævning af toldafgifter for glødelamper til belysning, henhørende under
    pos. 85.20 A i den fælles toldtarif, som har oprindelse i udviklingslande og
    omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr.
    3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2890/79 della Commissione, del 20 dicembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle lampade e tubi a
    incandescenza per l' illuminazione, della sottovoce 85.20 A della tariffa doganale
    comune, originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2890/79 van de Commissie van 20 december 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor gloeilampen en gloeibuizen,
    voor verlichtingsdoeleinden, van post 85.20 A, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties
    werden geopend
  type: main
