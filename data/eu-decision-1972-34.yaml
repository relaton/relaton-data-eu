title:
- language: en
  script: Latn
  content: Commission Decision of 15 December 1971 on the abolition, pursuant to Article
    93 (2) of the EEC Treaty, of Belgian aid to undertakings in difficulty
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 15 décembre 1971, supprimant, aux termes
    de l'article 93 paragraphe 2 du Traité CEE, les aides belges accordées en faveur
    des entreprises en difficulté
  type: main
- language: de
  script: Latn
  content: '72/34/EWG: Entscheidung der Kommission vom 15. Dezember 1971, mit der
    die belgischen Beihilfen an sich in Schwierigkeiten befindliche Unternehmen gemäß
    Artikel 93 Absatz 2 des EWG-Vertrags abgeschafft werden'
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 15. december 1971 som ifølge artikel 93, stk.
    2, i EØF-traktaten afskaffer den belgiske støtte til virksomheder, som er i
    vanskeligheder
  type: main
- language: it
  script: Latn
  content: '72/34/CEE: Decisione della Commissione, del 15 dicembre 1971, che abolisce,
    ai sensi dell''articolo 93, paragrafo 2, del trattato CEE, gli aiuti concessi
    in Belgio alle imprese in difficoltà'
  type: main
- language: nl
  script: Latn
  content: '72/34/EEG: Beschikking van de Commissie van 15 december 1971 tot opheffing
    krachtens artikel 93, lid 2, van het EEG-Verdrag, van de steunmaatregelen die
    in België worden verleend, aan ondernemingen die in moeilijkheden verkeren'
  type: main
