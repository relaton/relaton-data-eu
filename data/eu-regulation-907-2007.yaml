title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 907/2007 of 23 July 2007 repealing the anti-dumping
    duty on imports of urea originating in Russia, following an expiry review pursuant
    to Article 11(2) of Regulation (EC) No 384/96, and terminating the partial interim
    reviews pursuant to Article 11(3) of such imports originating in Russia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 907/2007 du Conseil du 23 juillet 2007 abrogeant le
    droit antidumping sur les importations d’urée originaire de Russie, à la suite
    d’un réexamen des mesures parvenant à expiration au titre de l’article 11,
    paragraphe 2, du règlement (CE) n° 384/96 du Conseil, et clôturant les réexamens
    intermédiaires partiels de ces importations originaires de Russie au titre de
    l’article 11, paragraphe 3
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 907/2007 des Rates vom 23. Juli 2007 zur Aufhebung
    des Antidumpingzolls auf Einfuhren von Harnstoff mit Ursprung in Russland nach
    einer Überprüfung gemäß Artikel 11 Absatz 2 der Verordnung (EG) Nr. 384/96
    sowie zur Einstellung der diese Einfuhren mit Ursprung in Russland betreffenden
    teilweisen Interimsüberprüfungen gemäß Artikel 11 Absatz 3
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 907/2007 на Съвета от 23 юли
    2007 година за отмяна на антидъмпинговото мито
    върху вноса на карбамид с произход от Русия,
    след преразглеждане с оглед изтичане срока
    на действие на мерките съгласно член 11, параграф
    2 от Регламент (ЕО) № 384/96, и за прекратяване
    на частичните междинни преразглеждания съгласно
    член 11, параграф 3 на такъв внос с произход от
    Русия
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 907/2007 ze dne 23. července 2007 , kterým
    se na základě přezkumu před pozbytím platnosti podle čl. 11 odst. 2 nařízení
    (ES) č. 384/96 zrušuje antidumpingové clo z dovozu močoviny pocházející
    z Ruska a ukončují částečné prozatímní přezkumy dovozu močoviny pocházející
    z Ruska podle čl. 11 odst. 3
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 907/2007 af 23. juli 2007 om ophævelse af
    antidumpingtolden på importen af urinstof med oprindelse i Rusland efter en udløbsundersøgelse
    i henhold til artikel 11, stk. 2, i forordning (EF) nr. 384/96 og om afslutning
    af de delvise interimsundersøgelser vedrørende sådan import med oprindelse
    i Rusland i henhold til artikel 11, stk. 3
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 907/2007 του Συμβουλίου,
    της 23ης Ιουλίου 2007 , για την κατάργηση του δασμού
    αντιντάμπινγκ στις εισαγωγές ουρίας, καταγωγής
    Ρωσίας, μετά την επανεξέταση ενόψει της λήξης
    ισχύος των μέτρων σύμφωνα με το άρθρο 11 παράγραφος
    2 του κανονισμού (ΕΚ) αριθ. 384/96, καθώς και για
    τον τερματισμό των μερικών ενδιάμεσων επανεξετάσεων
    σύμφωνα με το άρθρο 11 παράγραφος 3, όσον αφορά
    τις εν λόγω εισαγωγές καταγωγής Ρωσίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 907/2007, 23. juuli 2007 , millega tunnistatakse
    kehtetuks Venemaalt pärit uurea impordi suhtes kehtiv dumpinguvastane tollimaks
    pärast määruse (EÜ) nr 384/96 artikli 11 lõike 2 kohast aegumise läbivaatamist
    ja lõpetatakse sellise Venemaalt pärit impordi artikli 11 lõike 3 kohane osaline
    vahepealne läbivaatamine
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 907/2007, annettu 23 päivänä heinäkuuta 2007
    , Venäjältä peräisin olevan virtsa-aineen (urea) tuontiin sovellettavan polkumyyntitullin
    kumoamisesta asetuksen (EY) N:o 384/96 11 artiklan 2 kohdan mukaisen toimenpiteiden
    voimassaolon päättymistä koskevan tarkastelun perusteella sekä kyseistä Venäjältä
    peräisin olevaa tuontia koskevan, saman asetuksen 11 artiklan 3 kohdan mukaisen
    osittaisen välivaiheen tarkastelun päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 907/2007/EK rendelete ( 2007. július 23. ) az Oroszországból
    származó karbamid behozatalára kivetett dömpingellenes vámnak a 384/96/EK
    tanácsi rendelet 11. cikkének (2) bekezdése szerinti lejárati felülvizsgálatot
    követően történő hatályon kívül helyezéséről és az Oroszországból
    származó ilyen behozatalok 11. cikk (3) bekezdése szerinti részleges időközi
    felülvizsgálatainak megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 907/2007 del Consiglio, del 23 luglio 2007 , che abroga
    il dazio antidumping sulle importazioni di urea originarie della Russia sulla
    base di un riesame in previsione della scadenza, a norma dell’articolo 11, paragrafo
    2, del regolamento (CE) n. 384/96, e che conclude il riesame intermedio parziale,
    a norma dell’articolo 11, paragrafo 3, di tali importazioni originarie della
    Russia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 907/2007 ( 2007. gada 23. jūlijs ), ar ko pēc
    termiņa beigu pārskatīšanas atbilstīgi Regulas (EK) Nr. 384/96 11. panta
    2. punktam atceļ antidempinga maksājumu par Krievijas izcelsmes urīnvielas
    importu un attiecībā uz šo Krievijas izcelsmes ražojumu importu izbeidz daļējas
    starpposma pārskatīšanas atbilstīgi 11. panta 3. punktam
  type: main
- language: lt
  script: Latn
  content: 2007 m. liepos 23 d. Tarybos reglamentas (EB) Nr. 907/2007, panaikinantis
    po priemonių galiojimo termino peržiūros pagal Reglamento (EB) Nr. 384/96 11
    straipsnio 2 dalį antidempingo muitą, nustatytą importuojamam Rusijos kilmės
    karbamidui, ir nutraukiantis tokio Rusijos kilmės importo dalines tarpines peržiūras
    pagal 11 straipsnio 3 dalį
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 907/2007 tat- 23 ta’ Lulju 2007 li jneħħi
    d-dazju antidumping fuq importazzjonijiet ta’ urea li joriġinaw mir-Russja,
    wara reviżjoni ta’ l-iskadenza skond l-Artikolu 11(2) tar-Regolament (KE) Nru
    384/96, u li jtemm ir-reviżjoni interim parzjali skond l-Artikolu 11(3) ta’
    dawn l-importazzjonijiet li joriġinaw mir-Russja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 907/2007 van de Raad van 23 juli 2007 tot intrekking
    van het antidumpingrecht op ureum van oorsprong uit Rusland naar aanleiding van
    een nieuw onderzoek overeenkomstig artikel 11, lid 2, van Verordening (EG) nr.
    384/96 van de Raad bij het vervallen van die maatregel en tot beëindiging van
    de gedeeltelijke tussentijdse nieuwe onderzoeken overeenkomstig artikel 11, lid
    3, inzake de invoer van dat product van oorsprong uit Rusland
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 907/2007 z dnia 23 lipca 2007 r. uchylające
    cło antydumpingowe nałożone na przywóz mocznika pochodzącego z Rosji w następstwie
    przeglądu wygaśnięcia zgodnie z art. 11 ust. 2 rozporządzenia (WE) nr 384/96
    oraz kończące częściowe przeglądy okresowe zgodnie z art. 11 ust. 3 dotyczące
    tego przywozu pochodzącego z Rosji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 907/2007 do Conselho, de 23 de Julho de 2007 , que
    revoga o direito anti-dumping sobre as importações de ureia originária da Rússia,
    na sequência de um reexame da caducidade, nos termos do n.° 2 do artigo 11.°
    do Regulamento (CE) n.° 384/96, e que encerra o reexame intercalar parcial, nos
    termos do n.° 3 do artigo 11.° dessas importações originárias da Rússia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 907/2007 al Consiliului din 23 iulie 2007 de abrogare
    a taxei antidumping la importurile de uree originară din Rusia, ca urmare a unei
    reexaminări a măsurilor care urmează să expire, în conformitate cu articolul
    11 alineatul (2) din Regulamentul (CE) nr. 384/96 și de încheiere a reexaminării
    intermediare parțiale privind asemenea importuri originare din Rusia, în conformitate
    cu articolul 11 alineatul (3)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 907/2007 z 23. júla 2007 , ktorým sa po preskúmaní
    pred uplynutím platnosti podľa článku 11 ods. 2 nariadenia (ES) č. 384/96
    zrušuje antidumpingové clo na dovoz močoviny s pôvodom v Rusku a ukončujú
    čiastočné predbežné preskúmania podľa článku 11 ods. 3 takéhoto dovozu
    s pôvodom v Rusku
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 907/2007 z dne 23. julija 2007 o razveljavitvi protidampinške
    dajatve na uvoz sečnine s poreklom iz Rusije po pregledu zaradi izteka ukrepov
    v skladu s členom 11(2) Uredbe (ES) št. 384/96 in o zaključku delnih vmesnih
    pregledov v zvezi z uvozom s poreklom iz Rusije v skladu s členom 11(3)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 907/2007 del Consejo, de 23 de julio de 2007 , por
    el que se deroga el derecho antidumping sobre las importaciones de urea originaria
    de Rusia, tras una reconsideración por expiración de conformidad con el artículo
    11, apartado 2, del Reglamento (CE) n° 384/96, y se dan por concluidas las reconsideraciones
    provisionales parciales de tales importaciones procedentes de Rusia, de conformidad
    con el artículo 11, apartado 3
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 907/2007 av den 23 juli 2007 om upphävande
    av antidumpningstullen på import av karbamid med ursprung i Ryssland, efter en
    översyn vid giltighetstidens utgång enligt artikel 11.2 i förordning (EG) nr
    384/96 och om avslutande av den partiella interimsöversynen enligt artikel 11.3
    av sådan import med ursprung i Ryssland
