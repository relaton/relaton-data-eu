title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1663/72 de la Commission, du 1er août 1972, modifiant
    le règlement (CEE) n 979/72 en ce qui concerne les montants compensatoires applicables,
    à la suite des événements monétaires, pour certains produits laitiers ainsi
    que pour certaines marchandises obtenues à partir de ces produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1663/72 der Kommission vom 1. August 1972 zur Änderung
    der Verordnung (EWG) Nr. 979/72 hinsichtlich der Ausgleichsabgaben, die im AnschluD
    an die Währungsereignisse für bestimmte Milcherzeugnisse und aus diesen gewonnene
    Waren anzuwenden sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1663/72 della Commissione, del 1 agosto 1972, che
    modifica il regolamento (CEE) n. 979/72 per quanto concerne gli importi di compensazione
    applicabili, per taluni prodotti lattiero-caseari e per alcune merci ottenute
    da tali prodotti, in seguito agli avvenimenti monetari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1663/72 van de Commissie van 1 augustus 1972 houdende
    wijziging van Verordening (EEG) nr. 979/72 betreffende de compenserende bedragen
    die ten gevolge van de monetaire toestand van toepassing zijn op enkele zuivelprodukten
    alsmede op enkele goederen welke zijn verkregen door verwerking van deze produkten
  type: main
