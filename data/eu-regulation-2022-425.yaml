id: EURegulation2022425
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/425 of 14 March 2022 amending
    Implementing Regulation (EU) 2019/947 as regards postponing the transition dates
    for the use of certain unmanned aircraft systems in the ‘open’ category and
    the date of application for standard scenarios for operations executed in or beyond
    the visual line of sight
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/425 de la Commission du 14 mars 2022
    modifiant le règlement d’exécution (UE) 2019/947 en ce qui concerne le report
    des dates de transition pour l’utilisation de certains systèmes d’aéronefs
    sans équipage à bord relevant de la catégorie «ouverte» et de la date d’application
    des scénarios standard pour les exploitations effectuées en vue directe ou hors
    vue
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/425 der Kommission vom 14. März 2022
    zur Änderung der Durchführungsverordnung (EU) 2019/947 in Bezug auf die Verschiebung
    der Übergangsfristen für die Nutzung bestimmter unbemannter Luftfahrzeugsysteme
    in der „offenen“ Kategorie und des Geltungsbeginns für Standardszenarien
    für den Betrieb in direkter Sicht oder außerhalb direkter Sicht
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/425 на Комисията
    от 14 март 2022 година за изменение на Регламент
    за изпълнение (ЕС) 2019/947 по отношение на отлагането
    на преходните дати за използването на определени
    безпилотни летателни системи в „неограничената“
    категория и датата на прилагане за основни
    сценарии за операции, изпълнявани във или извън
    обсега на видимост
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/425 ze dne 14. března 2022,
    kterým se mění prováděcí nařízení (EU) 2019/947, pokud jde o odložení
    přechodných lhůt pro používání některých bezpilotních systémů v „otevřené“
    kategorii a data použitelnosti standardních scénářů provozu ve vizuálním
    dohledu nebo mimo vizuální dohled
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/425 af 14. marts 2022
    om ændring af gennemførelsesforordning (EU) 2019/947 for så vidt angår udskydelse
    af udløbet af overgangsperioderne for anvendelsen af visse ubemandede luftfartøjssystemer
    i den »åbne« kategori og anvendelsesdatoen for standardscenarierne for operationer
    inden for eller uden for droneførerens synsvidde
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/425 της Επιτροπής
    της 14ης Μαρτίου 2022 για την τροποποίηση του
    εκτελεστικού κανονισμού (ΕΕ) 2019/947 όσον αφορά
    τη μετάθεση των μεταβατικών ημερομηνιών για
    τη χρήση ορισμένων συστημάτων μη επανδρωμένων
    αεροσκαφών στην «ανοικτή» κατηγορία και της
    ημερομηνίας εφαρμογής τυποποιημένων σεναρίων
    για πτητικές λειτουργίες που εκτελούνται εντός
    ή πέραν της οπτικής επαφής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/425, 14. märts 2022, millega muudetakse
    rakendusmäärust (EL) 2019/947 seoses teatavate avatud kategooria mehitamata
    õhusõidukite süsteemide kasutamise üleminekukuupäevade ja visuaalse otsenähtavuse
    piires või väljaspool visuaalse otsenähtavuse piire toimuva käitamise standardstsenaariumide
    kohaldamise alguskuupäeva edasilükkamisega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/425, annettu 14 päivänä
    maaliskuuta 2022, täytäntöönpanoasetuksen (EU) 2019/947 muuttamisesta siltä
    osin kuin on kyse tiettyjen miehittämättömien ilma-alusjärjestelmien käyttöä
    kategoriassa ”avoin” koskevan siirtymäkauden pidentämisestä sekä suorassa
    näköyhteydessä tai suoran näköyhteyden ulkopuolella harjoitettavaa toimintaa
    koskevien vakioskenaarioiden soveltamispäivän lykkäämisestä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/425 ón gCoimisiún an 14 Márta
    2022 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2019/947 a mhéid a bhaineann
    leis na dátaí aistrithe le haghaidh úsáid córais áirithe aerárthaí gan
    foireann sa chatagóir “oscailte” agus an dáta cur i bhfeidhm le haghaidh
    cásanna caighdeánacha maidir le hoibríochtaí a dhéantar laistigh d’amharclíne
    súl nó lasmuigh di a chur ar athló
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/425 оd 14. ožujka 2022. o izmjeni
    Provedbene uredbe (EU) 2019/947 u pogledu odgode prijelaznih datuma za upotrebu
    određenih sustava bespilotnih zrakoplova u „otvorenoj kategoriji” te datuma
    početka primjene standardnih scenarija za operacije pri kojima se održava ili
    ne održava vizualni kontakt sa zrakoplovom
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/425 végrehajtási rendelete (2022. március 14.)
    az (EU) 2019/947 végrehajtási rendeletnek a „nyílt” kategóriába tartozó
    egyes pilóta nélküli légijármű-rendszerek használatára vonatkozó átmeneti
    időpontoknak, valamint a látótávolságon belül vagy azon kívül végzett
    műveletekre vonatkozó standard forgatókönyvek alkalmazása kezdőnapjának
    elhalasztása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/425 della Commissione del 14 marzo
    2022 che modifica il regolamento di esecuzione (UE) 2019/947 per quanto riguarda
    la proroga dei periodi transitori per l’uso di determinati sistemi di aeromobili
    senza equipaggio nella categoria «aperta» e della data di applicazione per gli
    scenari standard per le operazioni eseguite entro e oltre la distanza di visibilità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/425 (2022. gada 14. marts), ar
    ko Īstenošanas regulu (ES) 2019/947 groza attiecībā uz pārejas datumu atlikšanu
    dažu bezpilota gaisa kuģu sistēmu izmantošanai “atvērto” operāciju kategorijā
    un attiecībā uz ekspluatācijas, ko veic tiešredzamības robežās vai ārpus
    tām, standarta scenāriju piemērošanas datuma atlikšanu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/425 2022 m. kovo 14 d. kuriuo
    dėl tam tikrų bepiločių orlaivių sistemų naudojimo atvirosios kategorijos
    skrydžiams vykdyti pereinamųjų laikotarpių pabaigos datų nukėlimo ir standartinių
    scenarijų, susijusių su tiesiogiai matomais ir tiesiogiai nematomais skrydžiais,
    taikymo datos atidėjimo iš dalies keičiamas Įgyvendinimo reglamentas (ES)
    2019/947
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/425 tal-14
    ta’ Marzu 2022 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2019/947
    fir-rigward tal-posponiment tad-dati ta’ tranżizzjoni għall-użu ta’ ċerti
    sistemi tal-ajru mingħajr bdot abbord fil-kategorija “miftuħa” u tad-data
    ta’ applikazzjoni għal xenarji standard għal operazzjonijiet eżegwiti fi
    jew lil hinn mil-linja viżwali tal-vista
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/425 van de Commissie van 14 maart 2022
    tot wijziging van Uitvoeringsverordening (EU) 2019/947 wat betreft het uitstellen
    van de overgangsdata voor het gebruik van bepaalde onbemande luchtvaartuigsystemen
    in de categorie “open” en de toepassingsdatum voor standaardscenario’s voor
    vluchtuitvoeringen binnen of buiten zicht
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/425 z dnia 14 marca 2022 r.
    zmieniające rozporządzenie wykonawcze (UE) 2019/947 w odniesieniu do odroczenia
    dat przejściowych dotyczących stosowania niektórych systemów bezzałogowych
    statków powietrznych w kategorii „otwartej” oraz daty rozpoczęcia stosowania
    scenariuszy standardowych w odniesieniu do operacji wykonywanych w zasięgu widoczności
    wzrokowej lub poza zasięgiem widoczności wzrokowej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/425 da Comissão de 14 de março de
    2022 que altera o Regulamento de Execução (UE) 2019/947 no que diz respeito
    ao adiamento das datas de transição para a utilização de determinados sistemas
    de aeronaves não tripuladas na categoria «aberta» e da data de aplicação
    no que se refere a cenários de referência em operações executadas na linha
    de vista ou para além dela
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/425 al Comisiei din 14 martie
    2022 de modificare a Regulamentului de punere în aplicare (UE) 2019/947 în ceea
    ce privește amânarea datelor de tranziție pentru utilizarea anumitor sisteme
    de aeronave fără pilot la bord în categoria „deschise” și a datei de aplicare
    pentru scenariile standard pentru operațiuni executate în raza vizuală sau
    în afara razei vizuale
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/425 zo 14. marca 2022, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2019/947, pokiaľ ide o odloženie prechodných
    lehôt súvisiacich s používaním určitých bezpilotných leteckých systémov
    v „otvorenej“ kategórii a dátumu uplatňovania štandardných scenárov
    na prevádzku s priamym vizuálnym kontaktom alebo bez neho
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/425 z dne 14. marca 2022 o spremembi
    Izvedbene uredbe (EU) 2019/947 v zvezi z odlogom datumov prehodnega obdobja za
    uporabo nekaterih sistemov brezpilotnih zrakoplovov v „odprti“ kategoriji
    in datuma začetka uporabe standardnih scenarijev za operacije, izvedene v vidnem
    polju ali zunaj njega
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/425 de la Comisión de 14 de marzo de
    2022 que modifica el Reglamento de Ejecución (UE) 2019/947 por lo que respecta
    al aplazamiento de las fechas de transición para la utilización de determinados
    sistemas de aeronaves no tripuladas en la categoría «abierta», así como la
    fecha de aplicación de los escenarios estándar para las operaciones ejecutadas
    dentro o más allá del alcance visual
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/425 av den 14 mars 2022
    om ändring av genomförandeförordning (EU) 2019/947 vad gäller senareläggning
    av övergångsdatumen för användning av vissa obemannade luftfartygssystem i
    den ”öppna” kategorin och tillämpningsdatumen för standardscenarier för
    drift som utförs inom eller utom synhåll
  type: main
