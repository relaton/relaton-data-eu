title:
- language: fr
  script: Latn
  content: '70/133/CEE: Décision de la Commission, du 22 janvier 1970, portant prorogation
    des décisions des 10 juin 1966 et 29 juin 1967, autorisant la République italienne
    à exclure du traitement communautaire, respectivement, les huiles essentielles,
    non déterpenées, d''oranges, position Ex 33.01 A Ex I du Tarif douanier commun,
    originaires des États-Unis, et le bichromate de sodium, position Ex 28.47 B II
    du Tarif douanier commun, originaire de certains pays de l''Est et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '70/133/EWG: Entscheidung der Kommission vom 22. Januar 1970 zur Verlängerung
    der Entscheidungen vom 10. Juni 1966 und vom 29. Juni 1967, mit denen die Italienische
    Republik ermächtigt wurde, "nicht terpenfrei gemachte ätherische Öle von Orangen"
    der Tarifnummer ex 33.01 A ex I des Gemeinsamen Zolltarifs mit Ursprung in den
    USA beziehungsweise Natriumbichromat der Tarifnummer ex 28.47 B II des Gemeinsamen
    Zolltarifs mit Ursprung in bestimmten Ostblockländern, die sich in den übrigen
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/133/CEE: Decisione della Commissione, del 22 gennaio 1970, che proroga
    le decisioni del 10 giugno 1966 e 29 giugno 1967 con cui si autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli oli essenziali non deterpenati
    di arancio della voce 33.01 A ex I, originari degli Stati Uniti, ed il bicromato
    di sodio, voce ex 28.47 B II della tariffa doganale comune, originario di taluni
    paesi dell''Est, immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/133/EEG: Beschikking van de Commissie van 22 januari 1970 houdende
    verlenging van de beschikkingen van 10 juni 1966 en 29 juni 1967, waarbij de Italiaanse
    Republiek wordt gemachtigd respectievelijk etherische oliën, waaruit de terpenen
    niet zijn afgesplitst, van sinaasappelen, van post ex 33.01 A ex I van het gemeenschappelijk
    douanetarief, van oorsprong uit de Verenigde Staten, en natriumbichromaat van
    post ex 28.47 B II van het gemeenschappelijk douanetarief, van oorsprong uit bepaalde
    oostelijke landen, die in de andere Lid-Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
