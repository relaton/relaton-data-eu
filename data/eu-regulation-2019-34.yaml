title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/34 of 17 October 2018 laying
    down rules for the application of Regulation (EU) No 1308/2013 of the European
    Parliament and of the Council as regards applications for protection of designations
    of origin, geographical indications and traditional terms in the wine sector,
    the objection procedure, amendments to product specifications, the register of
    protected names, cancellation of protection and use of symbols, and of Regulation
    (EU) No 1306/2013 of the European Parliament and of the Council as regards an
    appropriate system of checks
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/34 de la Commission du 17 octobre 2018
    portant modalités d'application du règlement (UE) n° 1308/2013 du Parlement
    européen et du Conseil en ce qui concerne les demandes de protection des appellations
    d'origine, des indications géographiques et des mentions traditionnelles dans
    le secteur vitivinicole, la procédure d'opposition, les modifications du cahier
    des charges, le registre des dénominations protégées, l'annulation de la protection
    et l'utilisation des symboles, et du règlement (UE) n° 1306/2013 du Parlement
    européen et du Conseil en ce qui concerne un système de contrôle approprié
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/34 der Kommission vom 17. Oktober 2018
