    Parlaments und des Rates in Bezug auf Anträge auf Schutz von Ursprungsbezeichnungen,
    geografischen Angaben und traditionellen Begriffen im Weinsektor, das Einspruchsverfahren,
    Änderungen der Produktspezifikationen, das Register der geschützten Bezeichnungen,
    die Löschung des Schutzes und die Verwendung von Zeichen sowie zur Verordnung
    (EU) Nr. 1306/2013 des Europäischen Parlaments und des Rates in Bezug auf ein
    geeignetes Kontrollsystem
