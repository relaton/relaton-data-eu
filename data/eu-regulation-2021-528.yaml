    exemption in connection with a takeover by means of an exchange offer, a merger
    or a division
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/528 de la Commission du 16 décembre 2020
    complétant le règlement (UE) 2017/1129 du Parlement européen et du Conseil
    en ce qui concerne les informations à inclure au minimum dans le document à
    publier afin de bénéficier d’une exemption à l’obligation de publier un
    prospectus dans le cadre d’une offre publique d’acquisition par voie d’offre
    publique d’échange, d’une fusion ou d’une scission
  type: main
- language: de
  script: Latn
