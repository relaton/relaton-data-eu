title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 673/92 of 18 March 1992 re-establishing
    the levying of customs duties on products of category 159 (order No 42.1590),
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 673/92 de la Commission du 18 mars 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    159 (numéro d'ordre 42.1590) originaires de Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 673/92 DER KOMMISSION vom 18. März 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie Nr. 159 (laufende Nummer 42.1590)
    mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 673/92 af 18. marts 1992 om genindførelse
    af opkrævning af told for varer under kategori 159 (løbenummer 42.1590), som
    har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 673/92 της Επιτροπής
    της 18ης Μαρτίου 1992 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα κατηγορίας
    159 ( αύξων αριθ. 42.1590 ), καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 673/92 DELLA COMMISSIONE del 18 marzo 1992 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria n. 159
    (numero d'' ordine 42.1590), originari della Cina beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 673/92 VAN DE COMMISSIE van 18 maart 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 159 (volgnummer 42.1590), van oorsprong uit China, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 673/92 DA COMISSÃO de 18 de Março de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 159
    (número de ordem 42.1590), originários da China, beneficiários das preferências
    pautais previstas no Regulamento (CEE) no 3832/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 673/92 DE LA COMISIÓN de 18 de marzo de 1992 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los productos de la categoría no 159 (número de orden 42.1590), originarios
    de China, beneficiarios de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3832/90 del Consejo #'
