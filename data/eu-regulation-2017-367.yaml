title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/367 of 1 March 2017 imposing
    a definitive anti-dumping duty on imports of crystalline silicon photovoltaic
    modules and key components (i.e. cells) originating in or consigned from the People's
    Republic of China following an expiry review pursuant to Article 11(2) of Regulation
    (EU) 2016/1036 of the European Parliament and of the Council and terminating the
    partial interim review investigation pursuant to Article 11(3) of Regulation (EU)
    2016/1036
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/367 de la Commission du 1er mars 2017
    instituant un droit antidumping définitif sur les importations de modules photovoltaïques
    en silicium cristallin et leurs composants essentiels (cellules) originaires ou
    en provenance de la République populaire de Chine à l'issue d'un réexamen au
    titre de l'expiration des mesures effectué en vertu de l'article 11, paragraphe
    2, du règlement (UE) 2016/1036 du Parlement européen et du Conseil et clôturant
    l'enquête de réexamen intermédiaire partiel effectué en vertu de l'article
    11, paragraphe 3, du règlement (UE) 2016/1036
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/367 der Kommission vom 1. März 2017
