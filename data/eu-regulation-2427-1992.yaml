title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2427/92 of 18 August 1992 re-establishing
    the levying of customs duties on products of category 35 (order No 40.0350), originating
    in Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2427/92 de la Commission, du 18 août 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 35 (numéro d' ordre 40.0350) originaires de Malaysia, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2427/92 der Kommission vom 18. August 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 35 (laufende Nummer 40.0350) mit Ursprung
    in Malaysia, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2427/92 af 18. august 1992 om genindførelse
