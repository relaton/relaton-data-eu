title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3586/92 of 11 December 1992 laying down
    transitional provisions concerning the movement within the Community of goods
    sent from one Member State for temporary use in one or more other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3586/92 de la Commission, du 11 décembre 1992, portant
    dispositions transitoires en matière de circulation intracommunautaire de marchandises
    expédiées d' un Etat membre en vue d' une utilisation temporaire dans un ou
    plusieurs autres Etats membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3586/92 der Kommission vom 11. Dezember 1992 mit Übergangsbestimmungen
    zum Verfahren des innergemeinschaftlichen Verkehrs mit Waren, die zum vorübergehenden
    Gebrauch aus einem Mitgliedstaat in einen oder mehrere andere Mitgliedstaaten
    versandt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3586/92 af 11. december 1992 om overgangsbestemmelser
    for bevægelser inden for Fællesskabet af varer, der ekspederes fra en medlemsstat
    med henblik på varernes midlertidige anvendelse i en eller flere andre medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3586/92 της Επιτροπής
    της 11ης Δεκεμβρίου 1992 περί των μεταβατικών
    διατάξεων στον τομέα της ενδοκοινοτικής κυκλοφορίας
    εμπορευμάτων που αποστέλλονται από ένα κράτος
    μέλος για να χρησιμοποιηθούν προσωρινά σε
    ένα ή περισσότερα άλλα κράτη μέλη
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 3586/92, annettu 11 päivänä joulukuuta 1992,
    jäsenvaltiosta yhdessä tai useammassa muussa jäsenvaltiossa väliaikaisesti
    käytettäviksi lähetettyjen tavaroiden yhteisön sisäistä liikkumista koskevista
    siirtymäsäännöksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3586/92 della Commissione, dell' 11 dicembre 1992,
    recante disposizioni transitorie in materia di circolazione intracomunitaria di
    merci spedite da uno Stato membro per essere temporaneamente utilizzate in uno
    o più altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3586/92 van de Commissie van 11 december 1992 houdende
    overgangsbepalingen inzake het intracommunautaire verkeer van goederen die uit
    een Lid-Staat worden verzonden om tijdelijk te worden gebruikt in een of meer
    andere Lid-Staten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3586/92 da Comissão, de 11 de Dezembro de 1992,
    que estabelece disposições transitárias em matéria de circulação intracomunitária
    de mercadorias expedidas em um Estado-membro com vista a uma utilização temporária
    num ou em vários outros Estados-membros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3586/92 de la Comisión, de 11 de diciembre de 1992,
