    de mercancías expedidas en un Estado miembro para su utilización temporal en
    uno o varios de los demás Estados miembros
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 3586/92 av den 11 december 1992 om övergångsbestämmelser
