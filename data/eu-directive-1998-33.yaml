  script: Latn
  content: Directive 98/33/EC of the European Parliament and of the Council of 22
    June 1998 amending Article 12 of Council Directive 77/780/EEC on the taking up
    and pursuit of the business of credit institutions, Articles 2, 5, 6, 7, 8 of
    and Annexes II and III to Council Directive 89/647/EEC on a solvency ratio for
    credit institutions and Article 2 of and Annex II to Council Directive 93/6/EEC
    on the capital adequacy of investment firms and credit institutions
  type: main
