  content: COMMISSION REGULATION (EC) No 2977/95 of 21 December 1995 determining the
    extent to which applications lodged in December 1995 for licences for certain
    eggs and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2977/95 DE LA COMMISSION du 21 décembre 1995 déterminant
