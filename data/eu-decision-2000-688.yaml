    Investeringsbank til også at omfatte lån til projekter i Kroatien'
  type: main
- language: el
  script: Grek
  content: '2000/688/ΕΚ: Απόφαση του Συμβουλίου, της 7ης
    Νοεμβρίου 2000, για την τροποποίηση της απόφασης
    2000/24/ΕΚ με σκοπό την επέκταση της εγγύησης της
    Κοινότητας στην Ευρωπαϊκή Τράπεζα Επενδύσεων
    ώστε να καλυφθούν δάνεια που χορηγούνται για
    σχέδια στην Κροατία'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 7. november 2000, millega muudetakse otsust 2000/24/EÜ,
    et laiendada ühenduse garantiid, mis anti Euroopa Investeerimispangale Horvaatia
    projektidega seotud laenude katteks
  type: main
- language: fi
  script: Latn
  content: '2000/688/EY: Neuvoston päätös, tehty 7 päivänä marraskuuta 2000,
    päätöksen 2000/24/EY muuttamisesta Euroopan investointipankille myönnetyn
    yhteisön takuun laajentamisesta kattamaan hankkeisiin Kroatiassa myönnettävät
    lainat'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (2000. november 7.) a 2000/24/EK határozatnak a
    horvátországi projektekre nyújtott hitelek fedezetére az Európai Beruházási
    Banknak nyújtott közösségi garanciát kiterjesztő módosításáról
  type: main
- language: it
  script: Latn
  content: '2000/688/CE: Decisione del Consiglio, del 7 novembre 2000, recante modificazione
    della decisione 2000/24/CE allo scopo di estendere la garanzia concessa dalla
    Comunità alla Banca europea per gli investimenti, includendovi i prestiti per
    progetti da realizzare in Croazia'
  type: main
- language: lv
  script: Latn
  content: Padomes lēmums (2000. gada 7. novembris), ar ko groza Lēmumu 2000/24/EK,
