title:
- language: en
  script: Latn
  content: '2000/688/EC: Council Decision of 7 November 2000 amending Decision 2000/24/EC
    so as to extend the Community guarantee granted to the European Investment Bank
    to cover loans for projects in Croatia'
  type: main
- language: fr
  script: Latn
  content: '2000/688/CE: Décision du Conseil du 7 novembre 2000 modifiant la décision
    2000/24/CE afin d''étendre la garantie communautaire accordée à la Banque européenne
    d''investissement pour couvrir les prêts en faveur de projets en Croatie'
  type: main
- language: de
  script: Latn
  content: '2000/688/EG: Beschluss des Rates vom 7. November 2000 zur Änderung des
    Beschlusses 2000/24/EG im Hinblick auf die Ausdehnung der Garantieleistung der
    Gemeinschaft für etwaige Verluste der Europäischen Investitionsbank auf Darlehen
    für Vorhaben in Kroatien'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 7. listopadu 2000, kterým se mění rozhodnutí
    2000/24/ES tak, aby se záruka Společenství poskytnutá Evropské investiční
    bance vztahovala na úvěrové projekty v Chorvatsku
  type: main
- language: da
  script: Latn
  content: '2000/688/EF: Rådets afgørelse af 7. november 2000 om ændring af afgørelse
