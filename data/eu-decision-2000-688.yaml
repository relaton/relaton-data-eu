    uz aizdevumiem projektiem Horvātijā
  type: main
- language: lt
  script: Latn
  content: 2000 m. lapkričio 7 d. Tarybos sprendimas, iš dalies keičiantis Sprendimą
    2000/24/EB, kad būtų galima išplėsti Europos investicijų bankui suteiktos
