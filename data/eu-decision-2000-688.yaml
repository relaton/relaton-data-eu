    dla pokrycia pożyczek na projekty w Chorwacji
  type: main
- language: pt
  script: Latn
  content: '2000/688/CE: Decisão do Conselho, de 7 de Novembro de 2000, que altera
    a Decisão 2000/24/CE por forma a estender a empréstimos destinados a projectos
    na Croácia a garantia comunitária concedida ao Banco Europeu de Investimento'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady zo 7. novembra 2000, ktoré mení a dopĺňa rozhodnutie
