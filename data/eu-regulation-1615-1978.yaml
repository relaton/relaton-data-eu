  content: Commission Regulation (EEC) No 1615/78 of 11 July 1978 amending the Annex
    to Regulation (EEC) No 368/77 as regards the denaturing of skimmed-milk powder
    for use in feed for pigs and poultry
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1615/78 de la Commission, du 11 juillet 1978, modifiant
