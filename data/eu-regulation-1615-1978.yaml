    du lait écrémé en poudre destiné à l' alimentation des porcs et des volailles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1615/78 der Kommission vom 11. Juli 1978 zur Änderung
    des Anhangs zur Verordnung (EWG) Nr. 368/77 hinsichtlich der Denaturierungsmethoden
    für zur Verfütterung an Schweine und Geflügel bestimmtes Magermilchpulver
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1615/78 af 11. juli 1978 om ændring
    af bilaget til forordning (EØF) nr. 368/77 vedrørende denatureringsmetoder for
    skummetmælkspulver bestemt til svine- og fjerkræfoder
  type: main
- language: el
  script: Grek
