    Beträge, die auf die das Gebiet 5 verlassenden Erzeugnisse zu erheben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2482/84 af 29. august 1984 om fastsættelse
