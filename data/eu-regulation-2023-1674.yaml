    za pripravu pića koji sadržavaju kakao, određenih prehrambenih proizvoda dobivenih
    od žitarica ili proizvoda od žitarica, određenih prehrambenih proizvoda dobivenih
    od riže i drugih žitarica, određenih čipseva te određenih umaka i začinskih
