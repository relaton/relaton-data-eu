    sisällyttämiseksi rajatarkastusasemilla suoritettavasta virallisesta valvonnasta
    vapautettujen yhdistelmätuotteiden luetteloon sekä delegoidun asetuksen (EU)
    2019/2122 liitteiden I ja III muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/1674 ón gCoimisiún an 19 Meitheamh 2023
    lena leasaítear Rialachán Tarmligthe (AE) 2021/630 a mhéid a bhaineann le leatháin
    agus ullmhóidí áirithe chun deochanna ina bhfuil cócó, bianna ullmhaithe
    áirithe a fhaightear ó ghránaigh nó ó tháirgí gránach, bianna ullmhaithe
