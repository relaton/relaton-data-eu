    контрол на граничните контролни пунктове,
    и за изменение на приложения I и III към Делегиран
    регламент (ЕС) 2019/2122
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/1674 ze dne 19. června
    2023, kterým se mění nařízení v přenesené pravomoci (EU) 2021/630, pokud
    jde o zařazení některých pomazánek a přípravků na výrobu nápojů obsahujících
    kakao, některých výrobků z obilovin, některých výrobků z rýže a jiných
    obilovin, některých chipsů a lupínků a některých omáček a koření na
    seznam směsných produktů osvobozených od úředních kontrol na stanovištích
    hraniční kontroly, a kterým se mění přílohy I a III nařízení v přenesené
    pravomoci (EU) 2019/2122
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/1674 af 19. juni 2023 om
    ændring af delegeret forordning (EU) 2021/630 for så vidt angår medtagelse
    af visse smørbare produkter og præparater til fremstilling af drikkevarer med
    indhold af kakao, visse tilberedte fødevarer fremstillet af korn eller kornprodukter,
    visse tilberedte fødevarer fremstillet af ris og andre kornarter, visse chips
    samt visse saucer og smagspræparater på listen over sammensatte produkter, der
    er undtaget fra offentlig kontrol på grænsekontrolstederne, og om ændring af
    bilag I og III til delegeret forordning (EU) 2019/2122
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2023/1674
