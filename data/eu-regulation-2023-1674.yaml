  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/1674, 19. juuni 2023, millega
    muudetakse delegeeritud määrust (EL) 2021/630 seoses teatavate kakaod sisaldavate
    võiete ja jookide valmistamiseks kasutatavate valmististe, teatavate teraviljast
    või teraviljatoodetest valmistatud toiduainete, teatavate riisist ja muudest
    teraviljadest valmistatud toiduainete, teatavate laastude ja krõpsude ning teatavate
    kastmete ja kastmelisandite lisamisega piiripunktis tehtavast ametlikust kontrollist
