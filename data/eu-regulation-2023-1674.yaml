  script: Latn
  content: Regolamento delegato (UE) 2023/1674 della Commissione del 19 giugno 2023
    che modifica il regolamento delegato (UE) 2021/630 per quanto riguarda l’inclusione
    di determinate paste da spalmare e preparazioni per bevande contenenti cacao,
    di determinati prodotti a base di cereali, di determinate preparazioni alimentari
    a base di riso e di altri cereali, di determinate chips e determinati snack croccanti
    e di determinate salse e determinati condimenti nell’elenco dei prodotti composti
    esenti da controlli ufficiali ai posti di controllo frontalieri e che modifica
    gli allegati I e III del regolamento delegato (UE) 2019/2122
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/1674 (2023. gada 19. jūnijs), ar
    ko attiecībā uz noteiktu ziežamu pastu un dzērienu pagatavošanai paredzētu
    izstrādājumu ar kakao piedevu, noteiktu no graudaugiem iegūtu gatavu produktu
    vai graudaugu produktu, noteiktu no rīsiem un citiem graudaugiem iegūtu gatavu
    pārtikas produktu, noteiktu čipšu un kraukšķu un noteiktu mērču un garšvielu
    iekļaušanu to kombinēto produktu sarakstā, kuri ir atbrīvoti no oficiālajām
    kontrolēm robežkontroles punktos, groza Deleģēto regulu (ES) 2021/630 un Deleģētās
    regulas (ES) 2019/2122 I un III pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/1674 2023 m. birželio 19
