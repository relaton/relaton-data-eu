title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1674 of 19 June 2023 amending
    Delegated Regulation (EU) 2021/630 as regards the inclusion of certain spreads
    and preparations for making beverages containing cocoa, certain prepared foods
    obtained from cereals or cereal products, certain prepared foods obtained from
    rice and other cereals, certain chips and crisps, and certain sauces and condiments
    in the list of composite products exempted from official controls at border control
    posts and amending Annexes I and III to Delegated Regulation (EU) 2019/2122
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1674 de la Commission du 19 juin 2023 modifiant
    le règlement délégué (UE) 2021/630 en ce qui concerne l’inscription de certaines
    pâtes à tartiner contenant du cacao, de certaines préparations contenant du
    cacao utilisées dans la fabrication de boissons, de certaines préparations alimentaires
    obtenues à partir de céréales ou de produits à base de céréales, de certaines
    préparations alimentaires obtenues à partir de riz et d’autres céréales,
    de certaines frites et chips et de certaines sauces et condiments sur la liste
    des produits composés exemptés des contrôles officiels aux postes de contrôle
    frontaliers, et modifiant les annexes I et III du règlement délégué (UE) 2019/2122
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1674 der Kommission vom 19. Juni 2023 zur
    Änderung der Delegierten Verordnung (EU) 2021/630 hinsichtlich der Aufnahme bestimmter
    kakaohaltiger Brotaufstriche und kakaohaltiger Zubereitungen zum Herstellen von
    Getränken, bestimmter aus Getreide gewonnener Lebensmittel oder Getreideerzeugnisse,
    bestimmter aus Reis oder anderem Getreide gewonnener Lebensmittel, bestimmter
    Chips sowie bestimmter Soßen und Würzmittel in die Liste der zusammengesetzten
    Erzeugnisse, die von amtlichen Kontrollen an Grenzkontrollstellen ausgenommen
    sind, und zur Änderung der Anhänge I und III der Delegierten Verordnung (EU)
    2019/2122
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/1674 на Комисията
    от 19 юни 2023 година за изменение на Делегиран
    регламент (ЕС) 2021/630 по отношение на включването
    на определени пасти за мазане и препарати за
    приготвяне на напитки, съдържащи какао, някои
    готови храни, получени от житни растения или
    зърнени продукти, някои готови храни, получени
