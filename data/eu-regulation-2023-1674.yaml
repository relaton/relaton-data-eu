    postuose, sąrašą, iš dalies keičiamas Deleguotasis reglamentas (ES) 2021/630,
    ir kuriuo iš dalies keičiami Deleguotojo reglamento (ES) 2019/2122 I ir III
    priedai
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/1674 tad-19 ta’ Ġunju 2023
    li jemenda r-Regolament Delegat (UE) 2021/630 fir-rigward tal-inklużjoni ta’
    ċerti spreads li jiddelku u preparati biex isiru xarbiet li fihom il-kawkaw,
    ċertu ikel ippreparat miksub miċ-ċereali jew mill-prodotti taċ-ċereali, ċertu
    ikel ippreparat miksub mir-ross u minn ċereali oħra, ċerti ċipps u krisps,
    u ċerti zlazi u kondimenti fil-lista tal-prodotti komposti eżentati mill-kontrolli
    uffiċjali fil-postijiet ta’ kontroll fuq il-fruntiera u li jemenda l-Annessi
    I u III tar-Regolament Delegat (UE) 2019/2122
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/1674 van de Commissie van 19 juni 2023
    tot wijziging van Gedelegeerde Verordening (EU) 2021/630 wat betreft het opnemen,
    in de lijst van samengestelde producten die zijn vrijgesteld van officiële controles
    aan grenscontroleposten, van bepaalde boterhampasta’s en bereidingen voor dranken
    die cacao bevatten, bepaalde uit granen of graanproducten verkregen bereide levensmiddelen,
    bepaalde uit rijst en andere granen verkregen bereide levensmiddelen, bepaalde
    schijfjes en chips, en bepaalde sauzen en kruiderijen, en tot wijziging van de
    bijlagen I en III bij Gedelegeerde Verordening (EU) 2019/2122
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/1674 z dnia 19 czerwca 2023
    r. zmieniające rozporządzenie delegowane (UE) 2021/630 w odniesieniu do włączenia
    do wykazu produktów złożonych zwolnionych z kontroli urzędowych w punktach
    kontroli granicznej niektórych wyrobów do smarowania i przetworów do sporządzania
    napojów zawierających kakao, niektórych przetworów spożywczych otrzymanych
    ze zbóż lub produktów zbożowych, niektórych przetworów spożywczych otrzymanych
    z ryżu i innych zbóż, niektórych czipsów i chrupek oraz niektórych sosów
    i przypraw oraz zmieniające załączniki I i III do rozporządzenia delegowanego
    (UE) 2019/2122
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/1674 da Comissão de 19 de junho de 2023
    que altera o Regulamento Delegado (UE) 2021/630 no que diz respeito à inclusão
    de determinadas pastas para barrar e preparações para fazer bebidas que contenham
    cacau, determinados alimentos preparados obtidos a partir de cereais ou produtos
    à base de cereais, determinados alimentos preparados obtidos a partir de arroz
    e outros cereais, determinados chips e crisps e determinados molhos e condimentos
    na lista de produtos compostos isentos de controlos oficiais nos postos de controlo
    fronteiriços, e que altera os anexos I e III do Regulamento Delegado (UE) 2019/2122
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/1674 al Comisiei din 19 iunie 2023 de modificare
    a Regulamentului delegat (UE) 2021/630 în ceea ce privește includerea anumitor
    produse tartinabile care conțin cacao și preparate care conțin cacao utilizate
    pentru prepararea băuturilor, a anumitor alimente preparate obținute din cereale
    sau produse pe bază de cereale, a anumitor alimente preparate obținute din orez
    și din alte cereale, a anumitor chipsuri și a anumitor sosuri și condimente
    în lista produselor compuse exceptate de la controalele oficiale la posturile
    de control la frontieră și de modificare a anexelor I și III la Regulamentul
    delegat (UE) 2019/2122
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/1674 z 19. júna 2023, ktorým
    sa mení delegované nariadenie (EÚ) 2021/630, pokiaľ ide o zahrnutie určitých
    nátierok a prípravkov na výrobu nápojov obsahujúcich kakao, určitých pripravených
    potravín získaných z obilnín alebo obilných výrobkov, určitých pripravených
    potravín získaných z ryže a iných obilnín, určitých lupienkov a čipsov
    a určitých omáčok a ochucovadiel do zoznamu zmiešaných výrobkov oslobodených
    od úradných kontrol na hraničných kontrolných staniciach, a ktorým sa menia
    prílohy I a III k delegovanému nariadeniu (EÚ) 2019/2122
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1674 z dne 19. junija 2023 o spremembi
    Delegirane uredbe (EU) 2021/630 glede vključitve nekaterih namazov in pripravkov
    za pijače, ki vsebujejo kakav, nekaterih pripravljenih živil, pridobljenih iz
    žit ali žitnih proizvodov, nekaterih pripravljenih živil, pridobljenih iz riža
    in drugih žit, nekaterih čipsov ter nekaterih omak in začimb na seznam sestavljenih
    proizvodov, izvzetih iz uradnega nadzora na mejnih kontrolnih točkah, ter spremembi
    prilog I in III k Delegirani uredbi (EU) 2019/2122
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/1674 de la Comisión de 19 de junio de 2023
    por el que se modifica el Reglamento Delegado (UE) 2021/630 en lo que respecta
    a la inclusión de determinadas pastas para untar y preparaciones para bebidas
    que contengan cacao, determinados productos a base de cereales, determinados productos
    a base de arroz y otros cereales, determinadas chips y otros productos de aperitivo
    crujientes, y determinadas salsas y condimentos en la lista de productos compuestos
    exentos de controles oficiales en los puestos de control fronterizos, y por el
    que se modifican los anexos I y III del Reglamento Delegado (UE) 2019/2122
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/1674 av den 19 juni 2023
    om ändring av delegerad förordning (EU) 2021/630 vad gäller införande av vissa
    smörgåspålägg innehållande kakao och kakaoberedningar för framställning
    av drycker, vissa livsmedelsberedningar framställda av spannmål eller spannmålsprodukter,
    vissa livsmedelsberedningar framställda av ris och andra spannmål, vissa chips
    samt vissa såser och smaksättare i förteckningen över sammansatta produkter
    som är undantagna från offentlig kontroll vid gränskontrollstationer och om
    ändring av bilagorna I och III till delegerad förordning (EU) 2019/2122
