  script: Latn
  content: Komission delegoitu asetus (EU) 2023/1674, annettu 19 päivänä kesäkuuta
    2023, delegoidun asetuksen (EU) 2021/630 muuttamisesta siltä osin kuin on kyse
    tiettyjen kaakaota sisältävien levitteiden ja juomien valmistukseen tarkoitettujen
    kaakaota sisältävien valmisteiden, tiettyjen viljasta tai viljatuotteista saatujen
    elintarvikevalmisteiden, tiettyjen riisistä ja muista viljoista saatujen elintarvikevalmisteiden,
