    kontrolnim postajama te o izmjeni priloga I. i III. Delegiranoj uredbi (EU) 2019/2122
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1674 felhatalmazáson alapuló rendelete (2023.
