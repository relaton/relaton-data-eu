    yra kakavos, gamybos preparatų, tam tikrų iš grūdų ar grūdų produktų paruoštų
    maisto produktų, tam tikrų iš ryžių ir kitų grūdų paruoštų maisto produktų,
    tam tikrų keptų bulvių traškučių, tam tikrų padažų ir prieskonių įtraukimo
