    και διακοσμητικά πτηνά (κάτοχος της άδειας
    BASF SE)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 1068/2011, 21. oktoober 2011 , loa andmise
    kohta Aspergillus niger ’ist (CBS 109.713) saadud endo-1,4-β-ksülanaasi ensüümivalmistise
    ja Aspergillus niger ’ist (DSM 18404) saadud endo-1,4-β-glükanaasi kasutamiseks
    munakanade, aretuskalkunite, muude vähem tähtsate linnuliikide (välja arvatud
    nuumpartide) ja dekoratiivlindude söödalisandina (loa omanik BASF SE)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 1068/2011, annettu 21 päivänä
    lokakuuta 2011 , Aspergillus nigerin (CBS 109.713) tuottamaa endo-1,4-beeta-ksylanaasia
    ja Aspergillus nigerin (DSM 18404) tuottamaa endo-1,4-beeta-glukanaasia sisältävän
    entsyymivalmisteen hyväksymisestä kananuorikoiden, siitoskalkkunoiden, siitoseläimiksi
    kasvatettavien kalkkunoiden, muiden pienten lintulajien (paitsi liha-ankkojen)
    ja koristetarkoituksissa pidettävien lintujen rehun lisäaineena (hyväksynnän
    haltija BASF SE)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1068/2011 od 21. listopada 2011. o
    odobrenju enzimskog pripravka endo-1,4-beta-ksilanaze dobivenog od Aspergillus
    niger (CBS 109.713) i endo-1,4-beta-glukanaze dobivenog od Aspergillus niger (DSM
    18404) kao dodatka hrani za životinje za pilenke uzgajane za nešenje, pure za
    rasplod, pure uzgajane za rasplod, ostale manje značajne ptičje vrste (osim
    tovnih pataka) i ukrasne ptice (nositelj odobrenja BASF SE)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság 1068/2011/EU végrehajtási rendelete ( 2011. október 21.
    ) az Aspergillus niger (CBS 109.713) által termelt endo-1,4-béta-xilanázt és
    az Aspergillus niger (DSM 18404) által termelt endo-1,4-béta-glükanázt tartalmazó
    enzimkészítmény tojójércék, tenyészpulykák, tenyésztés céljából nevelt
    pulykák, más kisebb madárfajok (kivéve hízókacsák) esetében takarmányadalékként
    való felhasználásának engedélyezéséről (az engedély jogosultja: BASF
    SE)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1068/2011 della Commissione, del 21 ottobre
    2011 , riguardante l’autorizzazione di un preparato enzimatico di endo-1,4-beta-xilanasi
    prodotta da Aspergillus niger (CBS 109.713) e di endo-1,4-beta-glucanasi prodotta
    da Aspergillus niger (DSM 18404) come additivo per mangimi destinati a galline
    ovaiole, tacchini da riproduzione, tacchini allevati per la riproduzione, altre
    specie avicole minori (escluse le anatre da ingrasso) e uccelli ornamentali (titolare
    dell’autorizzazione BASF SE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1068/2011 ( 2011. gada 21. oktobris
    ) par atļauju izmantot no Aspergillus niger (CBS 109.713) iegūtas endo-1,4-beta-ksilanāzes
    un no Aspergillus niger (DSM 18404) iegūtas endo-1,4-beta-glikanāzes fermentu
    preparātu kā barības piedevu dējējvistu cāļiem, vaislas tītariem, vaislai
    audzētiem tītariem, citu retāk audzētu sugu mājputniem (izņemot gaļas pīlēm)
    un dekoratīvajiem putniem (atļaujas turētājs BASF SE )
  type: main
- language: lt
  script: Latn
  content: 2011 m. spalio 21 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1068/2011
    dėl leidimo endo-1,4-beta-ksilanazės, gaunamos iš Aspergillus niger (CBS 109
    713), ir endo-1,4-beta-gliukanazės, gaunamos iš Aspergillus niger (DSM 18404),
    fermentinį preparatą naudoti kaip viščiukams, iš kurių auginamos dedeklės,
    veisliniams kalakutams, veislei auginamiems kalakutams, kitiems retesnių rūšių
    paukščiams (išskyrus mėsines antis) ir dekoratyviniams paukščiams skirtą
    pašarų priedą (leidimo turėtojas BASF SE)
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 1068/2011 tal-
    21 ta’ Ottubru 2011 dwar l-awtorizzazzjoni ta’ preparazzjoni enżimatika ta’
    endo-1,4-beta-ksilanażi prodotta minn Aspergillus niger (CBS 109.713) u endo-1,4-beta-glukanażi
    prodotta minn Aspergillus niger (DSM 18404) bħala addittiv fl-għalf għal tiġieġ
    mrobbija għall-bajd, dundjani għal skopijiet ta’ tgħammir, dundjani mrobbija
    għat-tgħammir, speċijiet minuri ta’ tjur oħrajn (għajr il-papri għas-simna)
    u għasafar ornamentali (detentur tal-awtorizzazzjoni BASF SE)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1068/2011 van de Commissie van 21 oktober
    2011 tot verlening van een vergunning voor een enzympreparaat van endo-1,4-bèta-xylanase,
    geproduceerd door Aspergillus niger (CBS 109.713), en endo-1,4-bèta-glucanase,
    geproduceerd door Aspergillus niger (DSM 18404), als toevoegingsmiddel voor diervoeding
    voor opfokleghennen, fokkalkoenen, opfokkalkoenen, andere kleine vogelsoorten
    (met uitzondering van mesteenden) en siervogels (vergunninghouder BASF SE)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) nr 1068/2011 z dnia 21 października
    2011 r. dotyczące zezwolenia na stosowanie preparatu enzymatycznego endo-1,4-beta-ksylanazy
    wytwarzanej przez Aspergillus niger (CBS 109 713) i endo-1,4-beta-glukanazy wytwarzanej
    przez Aspergillus niger (DSM 18404), jako dodatku paszowego dla kurcząt odchowywanych
    na nioski, indyków do celów hodowlanych, indyków odchowywanych do celów hodowlanych,
    innych podrzędnych gatunków ptaków (innych niż kaczki rzeźne) oraz ptaków
    ozdobnych (posiadacz zezwolenia: BASF SE)'
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. o 1068/2011 da Comissão, de 21 de Outubro
    de 2011 , relativo à autorização de uma preparação enzimática de endo-1,4-beta-xilanase
    produzida por Aspergillus niger (CBS 109 713) e endo-1,4-beta-glucanase produzida
    por Aspergillus niger (DSM 18404) como aditivo em alimentos para frangas para
    postura, perus reprodutores, perus criados para reprodução, outras espécies
    aviárias menores (excepto patos de engorda) e aves ornamentais (detentor da autorização
    BASF SE)
  type: main
