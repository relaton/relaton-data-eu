    produsă de Aspergillus niger (CBS 109 713) și de endo-1,4-beta-glucanază produsă
    de Aspergillus niger (DSM 18404) ca aditiv furajer pentru puicuțele pentru ouat,
    curcanii pentru reproducție, curcanii crescuți pentru reproducție, alte specii
    aviare minore (altele decât rațele pentru îngrășat) și păsările ornamentale
    (titularul autorizației BASF SE)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1068/2011 z 21. októbra 2011
    o povolení enzymatického prípravku z endo-1,4-beta-xylanázy produkovanej hubou
    Aspergillus niger (CBS 109.713) a endo-1,4-beta-glukanázy produkovanej hubou
    Aspergillus niger (DSM 18404) ako kŕmnej doplnkovej látky pre kurčatá chované
    na znášku, plemenné morky, morky chované na plemeno, iné menej významné
    druhy vtákov (okrem kačíc na výkrm) a okrasné vtáky (držiteľ povolenia
    spoločnosť BASF SE)
  type: main
