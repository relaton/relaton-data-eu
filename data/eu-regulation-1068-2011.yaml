---
id: EURegulation10682011
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1068/2011 of 21 October 2011
    concerning the authorisation of an enzyme preparation of endo-1,4-beta-xylanase
    produced by Aspergillus niger (CBS 109.713) and endo-1,4-beta-glucanase produced
    by Aspergillus niger (DSM 18404) as a feed additive for chickens reared for laying,
    turkeys for breeding purposes, turkeys reared for breeding, other minor avian
    species (other than ducks for fattening) and ornamental birds (holder of authorisation
    BASF SE)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n o 1068/2011 de la Commission du 21 octobre
    2011 concernant l’autorisation d’une préparation enzymatique à base d’endo-1,4-bêta-xylanase
    produite par Aspergillus niger (CBS 109 713) et d’endo-1,4-bêta-glucanase produite
    par Aspergillus niger (DSM 18404) en tant qu’additif alimentaire pour les poulettes
    élevées pour la ponte, les dindons reproducteurs, les dindons élevés pour
    la reproduction, d’autres espèces aviaires mineures (autres que les canards
    d’engraissement) et les oiseaux d’ornement (titulaire de l’autorisation:
    BASF SE)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1068/2011 der Kommission vom 21. Oktober
    2011 zur Zulassung einer Enzymzubereitung aus Endo-1,4-beta-Xylanase, gewonnen
    aus Aspergillus niger (CBS 109.713), und Endo-1,4-beta-Glucanase, gewonnen aus
    Aspergillus niger (DSM 18404), als Futtermittelzusatzstoff für Junghennen, Zuchttruthühner,
    Jungtruthühner, sonstige Vogelarten von geringerer wirtschaftlicher Bedeutung
    (außer Mastenten) und Ziervögel (Zulassungsinhaber BASF SE)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1068/2011 на
    Комисията от 21 октомври 2011 година за разрешаване
    на ензимния препарат от ендо-1,4-бета-ксиланаза,
    получена от Aspergillus niger (CBS 109 713), и ендо-1,4-бета-глюканаза,
    получена от Aspergillus niger (DSM 18404), като фуражна добавка
    за пилета, отглеждани за кокошки носачки, пуйки
    за разплод, пуйки, отглеждани за разплод, други
    дребни видове птици (с изключение на патици
    за угояване) и декоративни птици (притежател
    на разрешителното BASF SE)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1068/2011 ze dne 21. října 2011
    o povolení přípravku enzymů endo-1,4-beta-xylanázy z Aspergillus niger (CBS
    109 713) a endo-1,4-beta-glukanázy z Aspergillus niger (DSM 18404) jako doplňkové
    látky pro odchov kuřat a kuřic krůty pro účely plemenitby, odchov krůt,
    další menšinové druhy ptactva (kromě výkrmu kachen) a okrasné ptactvo (držitel
    povolení BASF SE)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1068/2011 af 21. oktober
    2011 om godkendelse af et enzympræparat af endo-1,4-beta-xylanase produceret
    af Aspergillus niger (CBS 109.713) og endo-1,4-beta-glucanase produceret af Aspergillus
    niger (DSM 18404) som tilsætningsstof til foder til hønniker, avlskalkuner,
    kalkuner opdrættet til avl, andre mindre udbredte fuglearter (undtagen slagteænder)
    og prydfugle (indehaver af godkendelsen er BASF SE)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 1068/2011
    της Επιτροπής, της 21ης Οκτωβρίου 2011 , σχετικά
    με την έγκριση παρασκευάσματος ενζύμου ενδο-1,4-β-ξυλανάσης
    που παράγεται από Aspergillus niger (CBS 109.713) και ενδο-1,4-β-γλυκανάσης
    που παράγεται από Aspergillus niger (DSM 18404) ως πρόσθετης
    ύλης ζωοτροφών για κοτόπουλα ωοπαραγωγής,
    γαλοπούλες για αναπαραγωγικούς σκοπούς, γαλοπούλες
    που εκτρέφονται για αναπαραγωγή, άλλα μικρά
