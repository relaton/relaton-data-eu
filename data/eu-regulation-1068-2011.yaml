    producida por Aspergillus niger (CBS 109.713) y endo-1,4-beta-glucanasa producida
    por Aspergillus niger (DSM 18404) como aditivo en piensos para pollitas para puesta,
    pavos destinados a la reproducción, pavos criados para reproducción, otras especies
    menores de aves (excepto patos de engorde) y aves ornamentales (titular de la
