  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1068/2011 z dne 21. oktobra 2011 o
    izdaji dovoljenja za encimski pripravek endo-1,4-beta-ksilanaze, ki jo proizvaja
    Aspergillus niger (CBS 109.713), in endo-1,4-beta-glukanaze, ki jo proizvaja Aspergillus
    niger (DSM 18404), kot krmni dodatek za rejene nesnice, purane za vzrejo, purane,
    ki se redijo za vzrejo, druge manjše aviarne vrste (razen rac za pitanje) in
    okrasne ptice (imetnik dovoljenja BASF SE)
  type: main
