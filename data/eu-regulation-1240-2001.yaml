id: EURegulation12402001
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1240/2001 of 25 June 2001 initiating a "new
    exporter" review of Council Regulation (EC) No 2604/2000 imposing a definitive
    anti-dumping duty on imports of certain polyethylene terephthalate originating,
    inter alia, in India, repealing the duty with regard to imports from one exporting
    producer and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1240/2001 de la Commission du 25 juin 2001 portant
    ouverture d'un réexamen au titre de nouvel exportateur du règlement (CE) n°
    2604/2000 du Conseil instituant un droit antidumping définitif sur les importations
    de certains types de polyéthylène téréphtalate originaires, entre autres,
    de l'Inde, abrogeant le droit applicable aux importations d'un producteur-exportateur
    et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1240/2001 der Kommission vom 25. Juni 2001 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 2604/2000 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von bestimmtem Polyethylenterephthalat
    mit Ursprung unter anderem in Indien, zur Aufhebung des Zolls auf die Einfuhren
    eines ausführenden Herstellers und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1240/2001 af 25. juni 2001 om indledning
    af en fornyet undersøgelse vedrørende en ny eksportør af Rådets forordning
    (EF) nr. 2604/2000 om indførelse af en endelig antidumpingtold på importen af
    visse typer polyethylenterephthalat med oprindelse i bl.a. Indien, om ophævelse
    af tolden for så vidt angår importen fra en eksporterende producent og om at
    gøre denne import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1240/2001 της Επιτροπής,
    της 25ης Ιουνίου 2001, για την έναρξη διαδικασίας
    επανεξέτασης, όσον αφορά ένα "νέο εξαγωγέα",
    του κανονισμού (ΕΚ) αριθ. 2604/2000 του Συμβουλίου,
    για την επιβολή οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές ορισμένων τύπων τερεφθαλικού
    πολυαιθυλενίου καταγωγής, μεταξύ άλλων, Ινδίας,
    για την κατάργηση του δασμού όσον αφορά τις
    εισαγωγές ενός παραγωγού-εξαγωγέα και την
    υπαγωγή των εισαγωγών αυτών σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1240/2001, annettu 25 päivänä kesäkuuta 2001,
    lopullisen polkumyyntitullin käyttöönotosta muun muassa Intiasta peräisin
    olevan tietynlaisen polyeteenitereftalaatin tuonnissa annettuun neuvoston asetukseen
    (EY) N:o 2604/2000 liittyvän uutta viejää koskevan tarkastelun vireillepanosta,
    yhden vientiä harjoittavan tuottajan tuontiin sovellettavan tullin kumoamisesta
    ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1240/2001 della Commissione, del 25 giugno 2001, che
    avvia un riesame relativo ai "nuovi esportatori" del regolamento (CE) n. 2604/2000
    del Consiglio, che istituisce un dazio antidumping definitivo sulle importazioni
    di alcuni tipi di polietilentereftalato originarie, tra l'altro, dell'India, che
    abroga il dazio in vigore nei confronti delle importazioni provenienti da un produttore
    esportatore e stabilisce che tali importazioni sono soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1240/2001 van de Commissie van 25 juni 2001 tot inleiding
    van een procedure, ten behoeve van een nieuwe exporteur, voor de herziening van
    Verordening (EG) nr. 2604/2000 van de Raad tot instelling van een definitief antidumpingrecht
    op polyethyleentereftalaat uit, onder meer, India, tot intrekking van het recht
    ten aanzien van een producent/exporteur en tot registratie van de invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1240/2001 da Comissão, de 25 de Junho de 2001, relativo
    ao início de um reexame, respeitante a um "novo exportador", do Regulamento (CE)
    n.° 2604/2000 do Conselho, que institui direitos anti-dumping definitivos sobre
    as importações de determinados poli(tereftalatos de etileno) originários, nomeadamente
    da Índia, que revoga o direito em vigor no que respeita às importações de
    um exportador neste país e que sujeita estas importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1240/2001 de la Comisión, de 25 de junio de 2001,
    por el que se inicia un procedimiento de reconsideración para "un nuevo exportador"
    del Reglamento (CEE) n° 2604/2000 del Consejo por el que se establece un derecho
    antidumping definitivo sobre las importaciones de determinado politereftalato
    de etileno originarias, entre otros países, de la India, por el que se deroga
    el derecho aplicable a las importaciones de un productor exportador y por el que
    se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1240/2001 av den 25 juni 2001 om inledande
    av en översyn avseende en ny exportör av rådets förordning (EG) nr 2604/2000
    beträffande införande av en slutgiltig antidumpningstull på import av visst
    slags polyetentereftalat med ursprung i bland annat Indien, om upphävande av
    tullen på import från en exporterande tillverkare och om registrering av denna
    import
  type: main
