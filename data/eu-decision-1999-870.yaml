    de contratos en relación con la instalación y el funcionamiento de la infraestructura
    de comunicación para el entorno de Schengen, «SISNET», y a gestionar dichos
    contratos'
  type: main
- language: sv
  script: Latn
  content: '1999/870/EG: Rådets beslut av den 17 december 1999 om bemyndigande för
    Europeiska unionens råds ställföreträdande generalsekreterare att företräda
    vissa medlemsstater i syfte att ingå avtal om installation och drift av kommunikationsinfrastrukturen
    i Schengensammanhang, "Sisnet", samt att förvalta dessa avtal'
