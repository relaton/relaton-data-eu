title:
- language: en
  script: Latn
  content: '1999/870/EC: Council Decision of 17 December 1999 authorising the Deputy
    Secretary-General of the Council of the European Union to act as representative
    of certain Member States for the purpose of concluding contracts relating to the
    installation and the functioning of the communication infrastructure for the Schengen
    environment, ''SISNET'', and to manage such contracts'
  type: main
- language: fr
  script: Latn
  content: '1999/870/CE: Décision du Conseil, du 17 décembre 1999, autorisant le
    Secrétaire général adjoint du Conseil de l''Union européenne à agir en tant
    que représentant de certains États membres aux fins de la conclusion de contrats
    concernant l''installation et le fonctionnement de l''infrastructure de communication
    pour l''environnement Schengen, dénommée «SISNET», et de la gestion de ces
    contrats'
  type: main
- language: de
  script: Latn
  content: '1999/870/EG: Beschluß des Rates vom 17. Dezember 1999 zur Ermächtigung
    des Stellvertretenden Generalsekretärs des Rates der Europäischen Union, beim
    Abschluß von Verträgen über die Einrichtung und den Betrieb der Kommunikationsinfrastruktur
    für den Schengen-Rahmen ("SISNET") als Vertreter bestimmter Mitgliedstaaten zu
    handeln und solche Verträge zu verwalten'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 17 декември 1999 година
    за упълномощаване на заместник генералния
    секретар на Съвета на Европейския съюз да действа
    като представител на някои държави-членки
    при сключването и управлението на договори,
    които са свързани с въвеждането и функционирането
    на комуникационната инфраструктура за Шенгенското
    пространство, наречена SISNET
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 17. prosince 1999 o zmocnění náměstka generálního
    tajemníka Rady Evropské unie k zastupování některých členských států
    při uzavírání smluv týkajících se zřízení a fungování komunikační
    infrastruktury pro schengenské prostředí SISNET a ke správě těchto smluv
  type: main
- language: da
  script: Latn
  content: '1999/870/EF: Rådets afgørelse af 17. december 1999 om bemyndigelse af
    vicegeneralsekretæren for Rådet for Den Europæiske Union til at handle som
    repræsentant for visse medlemsstater med henblik på at indgå kontrakter om
    oprettelse og drift af kommunikationsinfrastrukturen i Schengen-sammenhæng, "SISNet",
    samt til at forvalte sådanne kontrakter'
  type: main
- language: el
  script: Grek
  content: '1999/870/ΕΚ: Απόφαση του Συμβουλίου, της 17ης
    Δεκεμβρίου 1999, με την οποία εξουσιοδοτείται
    ο αναπληρωτής Γενικός Γραμματέας του Συμβουλίου
    της Ευρωπαϊκής Ένωσης να ενεργεί ως εκπρόσωπος
    ορισμένων κρατών μελών προς τον σκοπό σύναψης
    και διαχείρισης συμβάσεων που αφορούν την
    εγκατάσταση και τη λειτουργία του δικτύου
    επικοινωνιών «SISNET» για το περιβάλλον Σένγκεν'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 17. detsember 1999, millega volitatakse Euroopa Liidu Nõukogu
    asepeasekretäri tegutsema teatavate liikmesriikide esindajana lepingute sõlmimise
    eesmärgil, milles käsitletakse Schengeni keskkonna sideinfrastruktuuri SISNET
    paigaldamist ja toimimist, ning selliste lepingute haldamise eesmärgil
  type: main
- language: fi
  script: Latn
  content: '1999/870/EY: Neuvoston päätös, tehty 17 päivänä joulukuuta 1999,
    Euroopan unionin neuvoston pääsihteerin valtuuttamisesta toimimaan tiettyjen
    jäsenvaltioiden edustajana Schengen-ympäristön tietoliikenneinfrastruktuurin,
    SISNETin, perustamista ja toimintaa koskevien sopimusten tekemisessä sekä hallinnoimaan
    kyseisiä sopimuksia'
  type: main
- language: hr
  script: Latn
  content: '1999/870/EZ: Odluka Vijeća od 17. prosinca 1999. o ovlašćivanju zamjenika
    glavnog tajnika Vijeća Europske unije da djeluje kao predstavnik određenih država
    članica u svrhu sklapanja ugovora koji se odnose na postavljanje i primjenu komunikacijske
    infrastrukture za schengensko okružje, „SISNET” , i da upravlja takvim ugovorima'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (1999. december 17.) az Európai Unió Tanácsa főtitkárhelyettesének
    az egyes tagállamok képviseletében való eljárásáról a schengeni környezet
    kommunikációs infrastruktúrájának (SISNET) telepítésére és működtetésére
    vonatkozó szerződések kötése céljából, valamint az e szerződések kezelésére
    történő felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: '1999/870/CE: Decisione del Consiglio, del 17 dicembre 1999, che autorizza
    il Segretario generale aggiunto del Consiglio dell''Unione europea ad agire in
    qualità di rappresentante di taluni Stati membri al fine di stipulare contratti
    relativi all''installazione e al funzionamento dell''infrastruttura di comunicazione
    nel contesto di Schengen, denominata «SISNET", nonché a gestire tali contratti'
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (1999. gada 17. decembris), ar ko Eiropas Savienības Padomes
    ģenerālsekretāra vietnieku pilnvaro rīkoties kā noteiktu dalībvalstu pārstāvim
    tādu līgumu slēgšanas nolūkos, kuri attiecas uz komunikācijas infrastruktūras
    Šengenas vidē SISNET ierīkošanu un darbību, un šādu līgumu vadību
  type: main
- language: lt
  script: Latn
  content: 1999 m. gruodžio 17 d. Tarybos Sprendimas įgaliojantis Europos Sąjungos
    Tarybos Generalinio sekretoriaus pavaduotoją veikti kaip tam tikrų valstybių
    narių atstovą sudarant sutartis, susijusias su Šengeno aplinkai skirtos ryšių
    infrastruktūros Sisnet įrengimu ir veikimu, ir administruoti šias sutartis
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tas-17 ta' Diċembru 1999 li tawtorizza lid-Deputat
    Segretarju-Ġenerali tal-Kunsill ta' l-Unjoni Ewropea li jaġixxi bħala r-rapreżentant
    ta' ċerti Stati Membri għall-iskop li jikkonkludi kuntratti li jirrigwardaw
    l-istallazzjoni u l-funzjonar ta' l-infrastruttura tal-komunikazzjoni fl-ambjent
    Schengen, SISNET, u li jamministra dawn il-kuntratti
  type: main
- language: nl
  script: Latn
  content: '1999/870/EG: Besluit van de Raad van 17 december 1999 houdende machtiging
    van de plaatsvervangend secretaris-generaal van de Raad van de Europese Unie om
    op te treden als vertegenwoordiger van bepaalde lidstaten bij de sluiting van
    contracten met betrekking tot de installatie en de werking van de communicatie-infrastructuur
    voor de Schengenomgeving, "SISNET", alsmede om die contracten te beheren'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 17 grudnia 1999 r. upoważniająca zastępcę sekretarza
    generalnego Rady Unii Europejskiej do występowania w roli przedstawiciela niektórych
    Państw Członkowskich w celu zawierania umów odnoszących się do instalowania
    i działania infrastruktury komunikacyjnej dla środowiska Schengen, SISNET oraz
    realizacji takich umów
  type: main
- language: pt
  script: Latn
  content: '1999/870/CE: Decisão do Conselho, de 17 de Dezembro de 1999, que autoriza
    o secretário-geral adjunto do Conselho da União Europeia a actuar como representante
    de determinados Estados-Membros para fins de celebração de contratos relativos
    à instalação e ao funcionamento da infra-estrutura de comunicação para o
    ambiente de Schengen, Sisnet, e a gerir esses contratos'
  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului din 17 decembrie 1999 privind autorizarea secretarului
    general adjunct al Consiliului Uniunii Europene să acționeze ca reprezentant
    al unor state membre în scopul de a încheia contracte legate de instalarea și
    funcționarea infrastructurii comunicațiilor pentru spațiul Schengen, SISNET,
    și de a gestiona astfel de contracte
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady zo 17. decembra 1999, ktorým sa zástupca generálneho
    tajomníka Rady Európskej únie splnomocňuje na zastupovanie niektorých členských
    štátov pri uzatváraní zmlúv týkajúcich sa zriadenia a fungovania komunikačnej
    infraštruktúry SISNET pre schengenskú oblasť a na správu týchto zmlúv
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta z dne 17. decembra 1999 o pooblastitvi namestnika generalnega
    sekretarja Sveta Evropske unije, da deluje kot predstavnik nekaterih držav članic
    pri sklepanju pogodb, ki se nanašajo na vzpostavitev in delovanje komunikacijske
    infrastrukture SISNET za schengensko območje, in da upravlja s temi pogodbami
  type: main
- language: es
  script: Latn
  content: '1999/870/CE: Decisión del Consejo, de 17 de diciembre de 1999, por la
