id: EUDecision1978579
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 June 1978 authorizing the Italian Republic not
    to apply Community treatment to essential oils, not terpeneless; orange oil, falling
    within subheading 33.01 ex A (NIMEXE code 33.01-12) of the Common Customs Tariff,
    originating in Brazil and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/579/CEE: Décision de la Commission, du 29 juin 1978, autorisant la
    République italienne à exclure du traitement communautaire les huiles essentielles
    non déterpenées d''agrumes : essence d''orange, de la sous- position 33.01 Ex
    A du Tarif douanier commun (codes Nimexe : 33.01-12), originaires du Brésil et
    mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 29. Juni 1978, mit der die Italienische
    Republik ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche ätherische Öle, nicht terpenfrei gemacht: Süß-
    und Bitterorangenöl der Tarifnummer 33.01 ex A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffer
    33.01-12) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 29. juni 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage flygtige vegetabilske olier,
    ikke terpenfri: appelsin- og pomeransskalolie, som henhører under pos. 33.01
    ex A (NIMEXE-kode 33.01-12) i den fælles toldtarif, har oprindelse i Brasilien
    og frit kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 29 giugno 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli oli essenziali non deterpenati
    di agrumi: essenza di arancio della sottovoce 33.01 ex A della tariffa doganale
    comune (codice Nimexe: 33.01-12), originari del Brasile e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 29 juni 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd etherische oliën, waaruit de terpenen niet zijn afgesplitst:
    sinaasappelolie, van post 33.01 ex A van het gemeenschappelijk douanetarief (NIMEXE-code
    33.01-12), van oorsprong uit Brazilië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
