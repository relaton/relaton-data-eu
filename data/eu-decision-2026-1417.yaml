    álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedélynek az 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti
    megújításáról (az értesítés a C(2026) 4404. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/1417 della Commissione, del 29 giugno
