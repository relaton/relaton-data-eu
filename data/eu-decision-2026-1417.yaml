    contenenti, costituiti o derivati da granturco geneticamente modificato NK603
    × T25 conformemente al regolamento (CE) n. 1829/2003 del Parlamento europeo e
    del Consiglio [notificata con il numero C(2026) 4404]
  type: main
- language: lv
  script: Latn
