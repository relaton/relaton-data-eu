title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1417 of 29 June 2026 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified maize NK603 × T25 pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2026) 4404)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1417 de la Commission du 29 juin 2026
