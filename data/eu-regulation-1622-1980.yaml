  content: Commission Regulation (EEC) No 1622/80 of 26 June 1980 extending Regulation
    (EEC) No 301/80 as regards the issue in the beef and veal sector of export licences
    with advance fixing of refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1622/80 de la Commission, du 26 juin 1980, prorogeant
    le règlement (CEE) n° 301/80 en ce qui concerne la délivrance des certificats
    d' exportation comportant une fixation à l' avance des restitutions dans le secteur
    de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1622/80 der Kommisson vom 26. Juni 1980 zur Verlängerung
    der Verordnung (EWG) Nr. 301/80 hinsichtlich der Ausstellung der Ausfuhrlizenzen
    mit Vorausfestsetzung der Erstattung auf dem Rindfleischsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1622/80 af 26. juni 1980 om forlængelse
    af anvendelsesperioden for forordning (EØF) nr. 301/80 for så vidt angår udstedelse
    af eksportlicenser med forudfastsættelse af restitutionerne for oksekød
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1622/80 della Commissione, del 26 giugno 1980, che
    proroga il regolamento (CEE) n. 301/80 per quanto concerne il rilascio dei titoli
    di esportazione implicanti la fissazione anticipata delle restituzioni nel settore
    delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1622/80 van de Commissie van 26 juni 1980 tot verlenging
