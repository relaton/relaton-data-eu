title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 109/2013 of 29 January 2013 amending Regulation
    (EC) No 748/2009 on the list of aircraft operators that performed an aviation
    activity listed in Annex I to Directive 2003/87/EC of the European Parliament
    and of the Council on or after 1 January 2006 specifying the administering Member
    State for each aircraft operator also taking into consideration the expansion
    of the Union emission trading scheme to EEA-EFTA countries
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 109/2013 de la Commission du 29 janvier 2013 modifiant
