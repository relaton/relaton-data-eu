title:
- language: en
  script: Latn
  content: Commission Decision of 7 June 1973 authorizing the Federal Republic of
    Germany, the Italian Republic and the French Republic to apply protective measures
    in trade within the Community in wines falling within Common Customs Tariff heading
    No 22.05 C coming from Greece
  type: main
- language: fr
  script: Latn
  content: Décision 73/197/CEE de la Commission, du 7 juin 1973, autorisant la République
    fédérale d'Allemagne, la République italienne et la République française
    à appliquer des mesures de protection concernant les échanges intracommunautaires
    de vins, de la position 22.05 C du Tarif douanier commun, provenant de Grèce
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. Juni 1973, mit der die Bundesrepublik
    Deutschland, die Italienische und die Französische Republik ermächtigt werden,
    Schutzmaßnahmen betreffend den innergemeinschaftlichen Handel von Weinen der
    Tarifnummer 22.05 C des Gemeinsamen Zolltarifs mit Herkunft aus Griechenland anzuwenden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 7. juli 1973 hvorved forbundsrepublikken Tyskland,
    Den italienske Republik og Den franske Republik bemyndiges til at anvende beskyttelsesforanstaltninger
    vedrørende handelen inden for Fællesskabet med vine under pos. 22.05 C i den
    fælles toldtarif indført fra Grækenland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 7 giugno 1973, che autorizza la Repubblica
    federale di Germania, la Repubblica italiana e la Repubblica francese ad applicare
    delle misure di protezione negli scambi intracomunitari di vini, della voce 22.05
    C della tariffa doganale comune, provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 juni 1973 tot machtiging van de Duitse
    Bondsrepubliek, de Italiaanse Republiek en de Franse Republiek om beschermende
    maatregelen te treffen bij het intracommunautaire handelsverkeer van wijn, van
    post 22.05 C van het gemeenschappelijk douanetarief, van herkomst uit Griekenland
  type: main
