    proti některým osobám, subjektům a orgánům, které ohrožují mír, bezpečnost
    nebo stabilitu v Republice Guinea-Bissau
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse 2012/516/FUSP af 24. september 2012 om
