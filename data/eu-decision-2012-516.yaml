title:
- language: en
  script: Latn
  content: Council Implementing Decision 2012/516/CFSP of 24 September 2012 implementing
    Decision 2012/285/CFSP concerning restrictive measures directed against certain
    persons, entities and bodies threatening the peace, security or stability of the
    Republic of Guinea-Bissau
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution 2012/516/PESC du Conseil du 24 septembre 2012 mettant
    en œuvre la décision 2012/285/PESC concernant des mesures restrictives à l'encontre
    de certaines personnes, entités et organismes menaçant la paix, la sécurité
    ou la stabilité de la République de Guinée-Bissau
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss 2012/516/GASP des Rates vom 24. September 2012
    zur Durchführung des Beschlusses 2012/285/GASP über restriktive Maßnahmen gegen
    bestimmte den Frieden, die Sicherheit und die Stabilität in der Republik Guinea-Bissau
    gefährdende Personen, Organisationen und Einrichtungen
  type: main
- language: bg
