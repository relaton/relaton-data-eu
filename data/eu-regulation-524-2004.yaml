  type: main
- language: hu
  script: Latn
  content: A Bizottság 524/2004/EK rendelete (2004. március 19.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK rendelet harmincegyedik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 524/2004 della Commissione, del 19 marzo 2004, recante
    trentunesima modifica del regolamento (CE) n. 881/2002 del Consiglio che impone
    specifiche misure restrittive nei confronti di determinate persone ed entità
    associate a Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento
    (CE) n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 524/2004 (2004. gada 19. marts), ar kuru trīsdesmit
