    augalų apsaugos produktų pateikimo į rinką patvirtinama nedidelės rizikos
    veiklioji medžiaga Bacillus amyloliquefaciens (padermė IT-45) ir iš dalies
    keičiamas Komisijos įgyvendinimo reglamentas (ES) Nr. 540/2011
  type: main
- language: mt
  script: Latn
