    se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009 o
    uvádění přípravků na ochranu rostlin na trh schvaluje účinná látka představující
    nízké riziko Bacillus amyloliquefaciens kmen IT-45 a mění prováděcí nařízení
    Komise (EU) č. 540/2011
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/159 af 4. februar 2022
    om godkendelse af lavrisikoaktivstoffet Bacillus amyloliquefaciens stamme IT-45,
    jf. Europa-Parlamentets og Rådets forordning (EF) nr. 1107/2009 om markedsføring
    af plantebeskyttelsesmidler, og om ændring af Kommissionens gennemførelsesforordning
    (EU) nr. 540/2011
  type: main
- language: el
  script: Grek
