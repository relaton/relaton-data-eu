    ουσίας χαμηλού κινδύνου Bacillus amyloliquefaciens στέλεχος
    IT-45, σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1107/2009
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
