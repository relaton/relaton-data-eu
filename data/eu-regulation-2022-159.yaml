    (EZ) br. 1107/2009 Europskog parlamenta i Vijeća o stavljanju na tržište sredstava
    za zaštitu bilja te o izmjeni Provedbene uredbe Komisije (EU) br. 540/2011
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/159 végrehajtási rendelete (2022. február 4.)
    a Bacillus amyloliquefaciens IT-45 törzs kis kockázatú hatóanyagnak a növényvédő
    szerek forgalomba hozataláról szóló 1107/2009/EK európai parlamenti és tanácsi
    rendelet szerinti jóváhagyásáról, valamint az 540/2011/EU bizottsági végrehajtási
    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/159 della Commissione del 4 febbraio
    2022 che approva la sostanza attiva a basso rischio Bacillus amyloliquefaciens
    ceppo IT-45, in conformità al regolamento (CE) n. 1107/2009 del Parlamento europeo
    e del Consiglio relativo all'immissione sul mercato dei prodotti fitosanitari,
    e che modifica il regolamento di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/159 (2022. gada 4. februāris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009 par
    augu aizsardzības līdzekļu laišanu tirgū apstiprina zema riska darbīgo vielu
    Bacillus amyloliquefaciens (celms IT-45) un groza Komisijas Īstenošanas regulas
    (ES) Nr. 540/2011 pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/159 2022 m. vasario 4 d.
