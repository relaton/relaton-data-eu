title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/159 of 4 February 2022 approving
    the low-risk active substance Bacillus amyloliquefaciens strain IT-45 in accordance
    with Regulation (EC) No 1107/2009 of the European Parliament and of the Council
    concerning the placing of plant protection products on the market, and amending
    Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/159 de la Commission du 4 février
    2022 portant approbation de la substance active à faible risque Bacillus amyloliquefaciens
    souche IT-45 conformément au règlement (CE) no 1107/2009 du Parlement européen
    et du Conseil concernant la mise sur le marché des produits phytopharmaceutiques
    et modifiant le règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/159 der Kommission vom 4. Februar 2022
