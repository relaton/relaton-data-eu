    от 4 февруари 2022 година за одобряване на активното
    вещество с нисък риск Bacillus amyloliquefaciens — щам
    IT-45, в съответствие с Регламент (ЕО) № 1107/2009
    на Европейския парламент и на Съвета относно
    пускането на пазара на продукти за растителна
