    Euroopa Parlamendi ja nõukogu määrusega (EÜ) nr 1107/2009 taimekaitsevahendite
    turulelaskmise kohta ning muudetakse komisjoni rakendusmäärust (EL) nr 540/2011
  type: main
- language: fi
