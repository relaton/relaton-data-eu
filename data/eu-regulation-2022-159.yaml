    Stamm IT-45 gemäß der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments
    und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln und zur Änderung
    der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
  type: main
