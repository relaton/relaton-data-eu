    douanier commun de l'' appareil scientifique dénommé "Quanta-Ray, DCR Laboratory
    Laser System" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/291/EWG: Entscheidung der Kommission vom 18. Februar 1980, mit der
    festgestellt wird, daß die Voraussetzungen für die Befreiung von den Zöllen
    des Gemeinsamen Zolltarifs für das wissenschaftliche Gerät ,,Quanta-Ray-DCR
    Laboratory Laser System'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/291/EØF: Kommissionens beslutning af 18. februar 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Quanta-Ray, DCR Laboratory Laser System" ikke er
    opfyldt'
