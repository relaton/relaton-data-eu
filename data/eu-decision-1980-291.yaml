  content: '80/291/EEC: Commission Decision of 18 February 1980 establishing that
    the conditions required for the admission free of Common Customs Tariff duties
    of the scientific apparatus described as ''Quanta-Ray, DCR Laboratory Laser System''
    , are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/291/CEE: Décision de la Commission, du 18 février 1980, constatant
