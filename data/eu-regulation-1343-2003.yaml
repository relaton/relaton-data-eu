    al azúcar de los códigos NC 1701 y 1702 importado de Serbia y Montenegro, los
    acuerdos previstos en el Reglamento (CE) n° 2007/2000 del Consejo por el que
    se introducen medidas comerciales excepcionales para los países y territorios
    participantes o vinculados al proceso de estabilización y asociación de la Unión
    Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1343/2003 av den 23 juli 2003 om tillfälligt
