    maade ja territooriumide suhtes
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1343/2003, annettu 23 päivänä heinäkuuta
    2003, poikkeuksellisten kaupan toimenpiteiden käyttöönotosta Euroopan unionin
    vakautus- ja assosiaatioprosessiin osallistuville tai siihen yhteydessä oleville
    maille ja alueille annetussa neuvoston asetuksessa (EY) N:o 2007/2000 säädettyjen,
    CN-koodeihin 1701 ja 1702 luokiteltavaa Serbia ja Montenegrosta tuotavaa sokeria
    koskevien menettelyjen keskeyttämisestä vielä kuudeksi kuukaudeksi
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1343/2003/EK rendelete (2003. július 23.) az Európai Unió
    stabilizációs és társulási folyamatában részt vevő vagy ahhoz kapcsolódó
    országokra és területekre kivételes kereskedelmi intézkedések bevezetéséről
    szóló 2007/2000/EK tanácsi rendelettel előírt rendelkezéseknek a Szerbia
    és Montenegróból behozott, az 1701 és az 1702 KN-kód alá tartozó cukor
    tekintetében egy további hat hónapos időszakra történő felfüggesztéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1343/2003 della Commissione, del 23 luglio 2003, che
    sospende per un ulteriore periodo di tre mesi, per quanto riguarda lo zucchero
    classificato ai codici NC 1701 e 1702 importato dalla Serbia e Montenegro, i regimi
    stabiliti nel regolamento (CE) n. 2007/2000 del Consiglio recante misure commerciali
    eccezionali applicabili ai paesi e territori che partecipano o sono legati al
    processo di stabilizzazione e di associazione dell'Unione europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1343/2003 (2003. gada 23. jūlijs), ar ko attiecībā
    uz cukuru ar KN kodu 1701 un 1702, kuru ieved no Serbijas un Melnkalnes, vēl
    uz sešiem mēnešiem atliek tās sistēmas piemērošanu, kas izstrādāta Padomes
    Regulā (EK) Nr. 2007/2000, ar kuru ievieš ārkārtas tirdzniecības pasākumus
    attiecībā uz valstīm un teritorijām, kas piedalās Eiropas Savienības Stabilizācijas
    un asociācijas procesā vai ir ar to saistītas
  type: main
- language: lt
  script: Latn
  content: 2003 m. liepos 23 d. Komisijos reglamentas (EB) Nr. 1343/2003, papildomam
    šešių mėnesių laikotarpiui sustabdantis susitarimus, numatytus Tarybos reglamente
    (EB) Nr. 2007/2000 dėl išimtinių prekybos priemonių įvedimo šalims ir teritorijoms,
    dalyvaujančioms Europos Sąjungos stabilizacijos ir asociacijos procese ar su
    juo susijusioms, dėl iš Serbijos ir Juodkalnijos importuojamo cukraus, kurio
    KN kodai yra 1701 ir 1702
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1343/2003 tat-23 ta' Lulju 2003
    li jissosponedi għal perijodu addizzjonali ta' sitt xhur, fir-rigward taz-zokkor
    tal-kodiċi NM 1701 u 1702 importat mis-Serbja u l-Montenegro, l-arranġamenti
    li hemm provvediment dwarhom fir-Regolament tal-Kunsill (KE) Nru 2007/2000 li
    jintroduċi miżuri eċċezzjonali fil-kummerċ għall-pajjiżi u territorji li
    jipparteċipaw fi jew li kienu marbuta mal-proċess ta' l-Istabbilizzazzjoni u
    l-Assoċċjazzjoni ta' l-Unjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1343/2003 van de Commissie van 23 juli 2003 houdende
    schorsing voor een aanvullende periode van zes maanden, met betrekking tot uit
    Servië en Montenegro ingevoerde suiker van GN-codes 1701 en 1702, van de regelingen
    ingesteld bĳ Verordening (EG) nr. 2007/2000 van de Raad tot vaststelling van
    uitzonderlĳke handelsmaatregelen ten behoeve van de landen en gebieden die deelnemen
    aan of verbonden zĳn met het stabilisatie- en associatieproces van de Europese
    Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1343/2003 z dnia 23 lipca 2003 r. zawieszające
    na dodatkowy okres sześciu miesięcy, w odniesieniu do cukru o kodach CN 1701
    i 1702 przywożonego z Serbii i Czarnogóry, uzgodnienia przewidziane w rozporządzeniu
    Rady (WE) nr 2007/2000 wprowadzającym nadzwyczajne środki handlowe dla krajów
    i terytoriów uczestniczących lub powiązanych z procesem stabilizacji i stowarzyszania
    Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1343/2003 da Comissão, de 23 de Julho de 2003, que
    suspende, por um período adicional de seis meses, no que se refere ao açúcar
    dos códigos NC 1701 e 1702 importado da Sérvia e Montenegro, o regime previsto
    no Regulamento (CE) n.° 2007/2000 do Conselho que adopta medidas comerciais excepcionais
    em favor dos países e territórios que participam ou estão ligados ao processo
    de estabilização e associação da União Europeia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1343/2003 z 23. júla 2003, ktorým sa pozastavuje
    dodatočné obdobie šiestich mesiacov s ohľadom na KN kódy 1701 a 1702 pre
    cukor dovezený zo Srbska a Čiernej hory na opatrenia ustanovené nariadením
    Rady (ES) č. 2007/2000 obsahujúce výnimočné opatrenia pre krajiny a územia
    zúčastňujúce sa alebo napojené na stabilizačný a asociačný proces Európskej
    únie
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1343/2003 z dne 23. julija 2003 o opustitvi režima
    iz Uredbe Sveta (ES) št. 2007/2000 o uvedbi izjemnih trgovinskih ukrepov za države
    in ozemlja, ki sodelujejo v stabilizacijsko-pridružitvenem procesu Evropske unije
    ali so z njim povezane, za sladkor z oznako KN 1701 in 1702, ki se uvaža iz Srbije
    in Črne gore, za dodatno dobo šestih mesecev
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1343/2003 de la Comisión, de 23 de julio de 2003,
