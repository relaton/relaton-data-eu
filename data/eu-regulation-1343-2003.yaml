title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1343/2003 of 23 July 2003 suspending for
    an additional period of six months, with regard to sugar of CN codes 1701 and
    1702 imported from Serbia and Montenegro, the arrangements provided for in Council
    Regulation (EC) No 2007/2000 introducing exceptional trade measures for countries
    and territories participating in or linked to the European Union's Stabilisation
    and Association process
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1343/2003 de la Commission du 23 juillet 2003 suspendant,
    pour une durée supplémentaire de six mois, en ce qui concerne le sucre des codes
    NC 1701 et 1702 importé de Serbie-et-Monténégro, le régime défini dans le
    règlement (CE) n° 2007/2000 du Conseil introduisant des mesures commerciales
    exceptionnelles en faveur des pays et territoires participant et liés au processus
    de stabilisation et d'association mis en œuvre par l'Union européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1343/2003 der Kommission vom 23. Juli 2003 zur Aussetzung
    der für aus Serbien und Montenegro eingeführten Zucker der KN-Positionen 1701
    und 1702 geltenden Präferenzregelung der Verordnung (EG) Nr. 2007/2000 des Rates
    zur Einführung besonderer Handelsmaßnahmen für die am Stabilisierungs- und
    Assoziierungsprozess der Europäischen Union teilnehmenden oder damit verbundenen
    Länder und Gebiete um weitere sechs Monate
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1343/2003 ze dne 23. července 2003, kterým
    se pozastavuje na další období šesti měsíců, pokud jde o cukr kódů KN
    1701 a 1702 dovezený ze Srbska a Černé hory, režim stanovený v nařízení
    Rady (ES) č. 2007/2000, kterým se zavádějí mimořádná obchodní opatření
    pro země a území účastnící se procesu stabilizace a přidružení zavedeného
    Evropskou unií či s tímto procesem spjaté
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1343/2003 af 23. juli 2003 om suspension
    i yderligere seks måneder af ordningerne i Rådets forordning (EF) nr. 2007/2000
    om exceptionelle handelsforanstaltninger for lande og territorier, der deltager
    i eller er knyttet til Den Europæiske Unions stabiliserings- og associeringsproces,
    hvad angår sukker henhørende under KN-koderne 1701 og 1702, der importeres fra
    Serbien og Montenegro
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1343/2003 της Επιτροπής,
    της 23ης Ιουλίου 2003, για την περαιτέρω αναστολή
    για περίοδο έξι μηνών, όσον αφορά τη ζάχαρη
    που υπάγεται στους κωδικούς ΣΟ 1701 και 1702 και
    εισάγεται από τη Σερβία και Μαυροβούνιο, των
    διακανονισμών που προβλέπει ο κανονισμός (ΕΚ)
