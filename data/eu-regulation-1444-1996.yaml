    modalità di gestione di contingenti tariffari comunitari consolidati al GATT
    per taluni prodotti agricoli, industriali e della pesca e che definisce le modalità
    di rettifica e di adattamento dei suddetti contingenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1444/96 van de Commissie van 24 juli 1996 tot wijziging
