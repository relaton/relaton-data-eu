    σχετικά με το άνοιγμα και τον τρόπο διαχείρισης
    των παγιωμένων στη Γενική Συμφωνία Δασμών
    και Εμπορίου (GATT) κοινοτικών δασμολογικών ποσοστώσεων
    για ορισμένα γεωργικά, βιομηχανικά και αλιευτικά
    προϊόντα και σχετικά με τον καθορισμό της μεθόδου
    τροποποίησης ή προσαρμογής των εν λόγω ποσοστώσεων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1444/96, annettu 24 päivänä heinäkuuta 1996,
