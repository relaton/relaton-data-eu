title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1444/96 of 24 July 1996 amending Annex I
    to Council Regulation (EC) No 1808/95 opening and providing for the administration
    of Community tariff quotas bound in GATT for certain agricultural, industrial
    and fisheries products and establishing the detailed provisions for adapting these
    quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1444/96 de la Commission du 24 juillet 1996 modifiant
    l'annexe I du règlement (CE) nº 1808/95 du Conseil portant ouverture et mode
    de gestion de contingents tarifaires communautaires consolidés au GATT pour certains
    produits agricoles, industriels et de la pêche, et définissant les modalités
    d'amendement ou d'adaptation desdits contingents
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1444/96 der Kommission vom 24. Juli 1996 zur Änderung
    des Anhangs I der Verordnung (EG) Nr. 1808/95 des Rates zur Eröffnung und Verwaltung
    von im GATT gebundenen Gemeinschaftszollkontingenten für einige landwirtschaftliche
    und gewerbliche Erzeugnisse sowie Fischereierzeugnisse und zur Einführung eines
    Verfahrens zur Änderung oder Anpassung dieser Zollkontingente
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1444/96 af 24. juli 1996 om ændring
