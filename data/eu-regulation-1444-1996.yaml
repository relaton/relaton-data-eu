    maatalous-, teollisuus- ja kalataloustuotteiden osalta sekä mainittujen kiintiöiden
    muuttamista tai mukauttamista koskevista säännöistä annetun neuvoston asetuksen
    (EY) N:o 1808/95 liitteen I muuttamisesta
  type: main
- language: it
  script: Latn
