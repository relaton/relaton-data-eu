    u t-terroriżmu
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/1011 van de Raad van 15 mei 2023 tot machtiging tot het
    openen van onderhandelingen met de Verenigde Mexicaanse Staten over een overeenkomst
    tussen de Europese Unie en de Verenigde Mexicaanse Staten op het gebied van de
    uitwisseling van persoonsgegevens tussen het Agentschap van de Europese Unie voor
    samenwerking op het gebied van rechtshandhaving (Europol) en de Mexicaanse autoriteiten
    die bevoegd zijn voor de bestrijding van zware criminaliteit en terrorisme
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/1011 z dnia 15 maja 2023 r. w sprawie upoważnienia
    do podjęcia negocjacji z Meksykańskimi Stanami Zjednoczonymi dotyczących umowy
    między Unią Europejską a Meksykańskimi Stanami Zjednoczonymi w sprawie wymiany
    danych osobowych między Agencją Unii Europejskiej ds. Współpracy Organów
    Ścigania (Europol) i organami meksykańskimi właściwymi do zwalczania poważnej
    przestępczości i terroryzmu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2023/1011 do Conselho de 15 de maio de 2023 que autoriza
    a abertura de negociações com os Estados Unidos Mexicanos tendo em vista a celebração
    de um acordo entre a União Europeia e os Estados Unidos Mexicanos sobre o intercâmbio
    de dados pessoais entre a Agência da União Europeia para a Cooperação Policial
    (Europol) e as autoridades mexicanas competentes em matéria de luta contra a
    criminalidade grave e o terrorismo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/1011 a Consiliului din 15 mai 2023 de autorizare a începerii
    negocierilor cu Statele Unite Mexicane în vederea unui acord între Uniunea Europeană
    și Statele Unite Mexicane privind schimbul de date cu caracter personal între
    Agenția Uniunii Europene pentru Cooperare în Materie de Aplicare a Legii (Europol)
    și autoritățile mexicane cu competențe în materie de combatere a criminalității
    grave și a terorismului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/1011 z 15. mája 2023 o poverení začať rokovania
    so Spojenými štátmi mexickými o dohode medzi Európskou úniou a Spojenými
    štátmi mexickými o výmene osobných údajov medzi Agentúrou Európskej únie
    pre spoluprácu v oblasti presadzovania práva (Europol) a orgánmi Mexika príslušnými
    pre boj proti závažnej trestnej činnosti a terorizmu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/1011 z dne 15. maja 2023 o pooblastilu za začetek
    pogajanj z Združenimi mehiškimi državami o sporazumu med Evropsko unijo in
    Združenimi mehiškimi državami o izmenjavi osebnih podatkov med Agencijo Evropske
    unije za sodelovanje na področju preprečevanja, odkrivanja in preiskovanja kaznivih
    dejanj (Europol) in mehiškimi organi, pristojnimi za boj proti hudim kaznivim
    dejanjem in terorizmu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2023/1011 del Consejo de 15 de mayo de 2023 por la que se
    autoriza la apertura de negociaciones con los Estados Unidos Mexicanos para la
    celebración de un Acuerdo entre la Unión Europea y los Estados Unidos Mexicanos
    sobre el intercambio de datos de carácter personal entre la Agencia de la Unión
    Europea para la Cooperación Policial (Europol) y las autoridades mexicanas competentes
    en materia de lucha contra la delincuencia grave y el terrorismo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/1011 av den 15 maj 2023 om bemyndigande att inleda
