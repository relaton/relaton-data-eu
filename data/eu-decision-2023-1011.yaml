    agus sceimhlitheoireacht a chomhrac
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2023/1011 od 15. svibnja 2023. o odobravanju otvaranja
    pregovora sa Sjedinjenim Meksičkim Državama o sporazumu između Europske unije
    i Sjedinjenih Meksičkih Država o razmjeni osobnih podataka između Agencije
    Europske unije za suradnju tijela za izvršavanje zakonodavstva (Europol) i meksičkih
    tijela nadležnih za borbu protiv teških kaznenih djela i terorizma
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2023/1011 határozata (2023. május 15.) az Európai Unió
    és a Mexikói Egyesült Államok közötti, a személyes adatoknak a Bűnüldözési
    Együttműködés Európai Uniós Ügynöksége (Europol), valamint a súlyos
    bűncselekmények és a terrorizmus elleni küzdelem terén illetékes mexikói
    hatóságok közötti cseréjéről szóló megállapodásra irányuló, a Mexikói
    Egyesült Államokkal folytatandó tárgyalások megkezdésére való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/1011 del Consiglio del 15 maggio 2023 che autorizza
    l’avvio di negoziati con gli Stati Uniti messicani per un accordo tra l’Unione
    europea e gli Stati Uniti messicani sullo scambio di dati personali tra l’Agenzia
    dell’Unione europea per la cooperazione nell’attività di contrasto (Europol)
    e le autorità messicane competenti per la lotta contro le forme gravi di criminalità
    e il terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2023/1011 (2023. gada 15. maijs), ar ko pilnvaro sākt
    sarunas ar Meksikas Savienotajām Valstīm par nolīgumu starp Eiropas Savienību
    un Meksikas Savienotajām Valstīm par personas datu apmaiņu starp Eiropas Savienības
    Aģentūru tiesībaizsardzības sadarbībai (Eiropolu) un Meksikas iestādēm,
    kuru kompetencē ir smago noziegumu un terorisma apkarošana
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2023/1011 2023 m. gegužės 15 d. kuriuo suteikiami
    įgaliojimai pradėti derybas su Meksikos Jungtinėmis Valstijomis dėl Europos
    Sąjungos ir Meksikos Jungtinių Valstijų susitarimo dėl Europos Sąjungos teisėsaugos
    bendradarbiavimo agentūros (Europolo) ir Meksikos kompetentingų kovos su sunkiais
    nusikaltimais ir terorizmu institucijų keitimosi asmens duomenimis
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2023/1011 tal-15 ta’ Mejju 2023 li tawtorizza
    l-ftuħ ta’ negozjati mal-Istati Uniti tal-Messiku għal ftehim bejn l-Unjoni
    Ewropea u l-Istati Uniti tal-Messiku dwar l-iskambju ta’ data personali bejn
    l-Aġenzija tal-Unjoni Ewropea għall-Kooperazzjoni fl-Infurzar tal-Liġi (Europol)
