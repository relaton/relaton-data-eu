    vaihtoa koskevan Euroopan unionin ja Meksikon yhdysvaltojen välisen sopimuksen
    tekemiseksi
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2023/1011 ón gComhairle an 15 Bealtaine 2023 lena n-údaraítear
