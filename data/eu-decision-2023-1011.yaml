title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/1011 of 15 May 2023 authorising the opening
    of negotiations with the United Mexican States for an agreement between the European
    Union and the United Mexican States on the exchange of personal data between the
    European Union Agency for Law Enforcement Cooperation (Europol) and the Mexican
    authorities competent for fighting serious crime and terrorism
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/1011 du Conseil du 15 mai 2023 autorisant l’ouverture
    de négociations avec les États-Unis mexicains en vue d’un accord entre l’Union
    européenne et les États-Unis mexicains sur l’échange de données à caractère
    personnel entre l’Agence de l’Union européenne pour la coopération des services
    répressifs (Europol) et les autorités mexicaines compétentes pour lutter contre
    les formes graves de criminalité et le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/1011 des Rates vom 15. Mai 2023 über die Ermächtigung
    zur Aufnahme von Verhandlungen mit den Vereinigten Mexikanischen Staaten über
    ein Abkommen zwischen der Europäischen Union und den Vereinigten Mexikanischen
    Staaten über den Austausch personenbezogener Daten zwischen der Agentur der Europäischen
    Union für die Zusammenarbeit auf dem Gebiet der Strafverfolgung (Europol) und
    den für die Bekämpfung von schwerer Kriminalität und Terrorismus zuständigen
    mexikanischen Behörden
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/1011 на Съвета от 15 май 2023 година
    за разрешаване на започването на преговори
    с Мексиканските съединени щати по споразумение
    между Европейския съюз и Мексиканските съединени
    щати за обмен на лични данни между Агенцията
    на Европейския съюз за сътрудничество в областта
    на правоприлагането (Европол) и мексиканските
    органи, компетентни в областта на борбата с
    тежките престъпления и тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/1011 ze dne 15. května 2023 o zmocnění k
    zahájení jednání se Spojenými státy mexickými o dohodě mezi Evropskou
    unií a Spojenými státy mexickými o výměně osobních údajů mezi Agenturou
    Evropské unie pro spolupráci v oblasti prosazování práva (Europol) a mexickými
    orgány příslušnými pro boj proti závažné trestné činnosti a terorismu
  type: main
- language: da
  script: Latn
