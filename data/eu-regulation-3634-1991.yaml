    ποσοτήτων τυριών, καταγωγής και προελεύσεως
    Ελβετίας που μπορούν να εισαχθούν στην Ισπανία
    κατά το 1992
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3634/91 DELLA COMMISSIONE del 13 dicembre 1991 che
