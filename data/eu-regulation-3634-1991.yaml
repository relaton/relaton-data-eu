  content: Commission Regulation (EEC) No 3634/91 of 13 December 1991 setting for
    1992 the quantities of cheese originating in and coming from Switzerland that
    may be imported into Spain
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3634/91 DE LA COMMISSION du 13 décembre 1991 fixant
    les quantités de fromages d'' origine et en provenance de Suisse qui peuvent
    être importées en Espagne pour l'' année 1992 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3634/91 DER KOMMISSION vom 13. Dezember 1991 zur
    Festsetzung der Mengen an Käse mit Ursprung in und Herkunft aus der Schweiz,
    die für 1992 nach Spanien eingeführt werden können #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3634/91 af 13. december 1991 om fastsættelse
    af, hvor store mængder ost med oprindelse i og fra Schweiz, der kan importeres
    til Spanien i 1992
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3634/91 της Επιτροπής
