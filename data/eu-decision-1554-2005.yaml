    kapcsolódó cselekvési program létrehozásáról szóló 2001/51/EK tanácsi
    határozat és a nemek közötti egyenlőség területén európai szinten tevékenykedő
    szervezetek támogatását célzó közösségi cselekvési program létrehozásáról
    szóló 848/2004/EK határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione n. 1554/2005/CE del Parlamento europeo e del Consiglio, del 7
    settembre 2005, che modifica la decisione 2001/51/CE del Consiglio relativa al
    programma concernente la strategia comunitaria in materia di parità tra donne
    e uomini e la decisione n. 848/2004/CE che istituisce un programma d'azione comunitario
    per la promozione delle organizzazioni attive a livello europeo nel settore della
    parità tra donne e uomini
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Lēmums Nr. 1554/2005/EK (2005. gada 7. septembris),
    ar kuru groza Padomes Lēmumu 2001/51/EK, ar ko izveido Programmu, kura attiecas
    uz Kopienas pamatstratēģiju dzimumu līdztiesības jomā, un Eiropas Parlamenta
    un Padomes Lēmumu Nr. 848/2004/EK, ar ko izveido Kopienas rīcības programmu,
    lai atbalstītu organizācijas, kas Eiropas līmenī darbojas vīriešu un sieviešu
    līdztiesības jomā
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugsėjo 7 d. Europos Parlamento ir Tarybos sprendimas Nr. 1554/2005/EB,
    iš dalies keičiantis Tarybos sprendimą 2001/51/EB, patvirtinantį programą,
    susijusią su Bendrijos pagrindų strategija dėl lyčių lygybės, bei Sprendimą
    Nr. 848/2004/EB, nustatantį Bendrijos veiksmų programą skatinti vyrų ir moterų
    lygybės srityje Europos lygmeniu aktyvioms organizacijoms
  type: main
- language: mt
  script: Latn
