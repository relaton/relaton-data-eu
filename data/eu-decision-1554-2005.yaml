    bejn l-irġiel u n-nisa
  type: main
- language: nl
  script: Latn
  content: Beschikking nr. 1554/2005/EG van het Europees Parlement en de Raad van
    7 september 2005 tot wijziging van Beschikking 2001/51/EG van de Raad betreffende
    het programma in verband met de communautaire strategie inzake de gelijkheid van
    mannen en vrouwen en Besluit nr. 848/2004/EG tot vaststelling van een communautair
    actieprogramma ter bevordering van organisaties die op Europees niveau op het
    gebied van de gelijkheid van mannen en vrouwen actief zijn
  type: main
- language: pl
  script: Latn
  content: Decyzja nr 1554/2005/WE Parlamentu Europejskiego i Rady z dnia 7 września
    2005 r. zmieniająca decyzję Rady 2001/51/WE ustanawiającą program odnoszący
    się do wspólnotowej strategii ramowej w sprawie równości płci oraz decyzję
