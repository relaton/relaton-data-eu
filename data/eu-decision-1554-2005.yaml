    toimivien eurooppalaisten järjestöjen toiminnan edistämiseksi tehdyn päätöksen
    N:o 848/2004/EY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 1554/2005/EK határozata (2005. szeptember
