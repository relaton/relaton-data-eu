    mężczyznami i kobietami
  type: main
- language: pt
  script: Latn
  content: Decisão n.° 1554/2005/CE do Parlamento Europeu e do Conselho, de 7 de
    Setembro de 2005, que altera a Decisão 2001/51/CE do Conselho que estabelece
    um programa de acção comunitária relativo à estratégia comunitária para
    a igualdade entre homens e mulheres e a Decisão n.° 848/2004/CE, que estabelece
    um programa de acção comunitária para a promoção das organizações que operam
    ao nível europeu no domínio da igualdade entre homens e mulheres
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady č. 1554/2005/ES zo 7. septembra
    2005, ktorým sa mení a dopĺňa rozhodnutie Rady 2001/51/ES o akčnom programe
    Spoločenstva týkajúcom sa stratégie Spoločenstva v oblasti rovnosti žien
    a mužov a rozhodnutie č. 848/2004/ES ustanovujúce akčný plán Spoločenstva
    na podporu organizácií pôsobiacich na európskej úrovni v oblasti rovnosti
    medzi mužmi a ženami
  type: main
- language: sl
  script: Latn
  content: Odločba Evropskega parlamenta in Sveta št. 1554/2005/ES z dne 7. septembra
    2005 o spremembi Odločbe Sveta 2001/51/ES o določitvi programa v zvezi z okvirno
    strategijo Skupnosti za enakost spolov in Sklepa št. 848/2004/ES o akcijskem
    programu Skupnosti za spodbujanje organizacij, ki so dejavne na evropski ravni
    na področju enakosti moških in žensk
  type: main
- language: es
  script: Latn
  content: Decisión n° 1554/2005/CE del Parlamento Europeo y del Consejo, de 7 de
    septiembre de 2005, que modifica la Decisión 2001/51/CE del Consejo, por la que
    se establece un programa de acción comunitario sobre la estrategia comunitaria
    en materia de igualdad entre mujeres y hombres, y la Decisión n° 848/2004/CE,
    por la que se establece un programa de acción comunitario para la promoción
    de las organizaciones que trabajan a escala europea en el ámbito de la igualdad
    entre hombres y mujeres
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 1554/2005/EG av den 7 september
