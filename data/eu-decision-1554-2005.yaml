title:
- language: en
  script: Latn
  content: Decision No 1554/2005/EC of the European Parliament and of the Council
    of 7 September 2005 amending Council Decision 2001/51/EC establishing a programme
    relating to the Community framework strategy on gender equality and Decision No
    848/2004/EC establishing a Community action programme to promote organisations
    active at European level in the field of equality between men and women
  type: main
- language: fr
  script: Latn
  content: Décision n° 1554/2005/CE du Parlement européen et du Conseil du 7 septembre
    2005 modifiant la décision 2001/51/CE du Conseil établissant un programme d'action
    communautaire concernant la stratégie communautaire en matière d'égalité entre
    les femmes et les hommes et la décision n° 848/2004/CE établissant un programme
    d'action communautaire pour la promotion des organisations actives au niveau européen
    dans le domaine de l'égalité entre les femmes et les hommes
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 1554/2005/EG des Europäischen Parlaments und des Rates
    vom 7. September 2005 zur Änderung der Entscheidung 2001/51/EG des Rates über
    ein Aktionsprogramm der Gemeinschaft betreffend die Gemeinschaftsstrategie für
    die Gleichstellung von Frauen und Männern sowie des Beschlusses Nr. 848/2004/EG
    über ein Aktionsprogramm der Gemeinschaft zur Förderung von Organisationen,
    die auf europäischer Ebene für die Gleichstellung von Männern und Frauen tätig
    sind
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady č. 1554/2005/ES ze dne 7. září
    2005, kterým se mění rozhodnutí Rady 2001/51/ES, kterým se zavádí akční
    program týkající se strategie Společenství pro rovnost žen a mužů, a rozhodnutí
    č. 848/2004/ES, kterým se zavádí akční program Společenství na podporu
    organizací působících na evropské úrovni v oblasti rovnosti žen a mužů
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets beslutning nr. 1554/2005/EF af 7. september
    2005 om ændring af Rådets beslutning 2001/51/EF om et EF-handlingsprogram vedrørende
    fællesskabsstrategien for ligestilling mellem mænd og kvinder og af afgørelse
    nr. 848/2004/EF om fastlæggelse af et EF-handlingsprogram med henblik på at
    fremme organisationer, der er aktive på europæisk plan hvad angår ligestilling
    mellem mænd og kvinder
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 1554/2005/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 7ης Σεπτεμβρίου 2005,
    για την τροποποίηση της απόφασης 2001/51/ΕΚ του
    Συμβουλίου για τη θέσπιση προγράμματος κοινής
    δράσης σχετικά με την κοινοτική στρατηγική
    για την ισότητα μεταξύ γυναικών και ανδρών,
    καθώς και της απόφασης αριθ. 848/2004/ΕΚ για τη
    θέσπιση προγράμματος κοινοτικής δράσης για
    την προώθηση οργανώσεων που δραστηριοποιούνται
    σε ευρωπαϊκό επίπεδο στον τομέα της ισότητας
    μεταξύ ανδρών και γυναικών
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu otsus nr 1554/2005/EÜ, 7. september 2005,
    millega muudetakse nõukogu otsust 2001/51/EÜ, millega kehtestatakse meeste ja
    naiste võrdõiguslikkust käsitleva ühenduse raamstrateegiaga seotud tegevusprogramm,
