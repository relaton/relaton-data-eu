    edendamiseks
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 1554/2005/EY, tehty 7 päivänä
    syyskuuta 2005, naisten ja miesten tasa-arvoon liittyvää yhteisön strategiaa
    koskevan toimintaohjelman perustamisesta tehdyn neuvoston päätöksen 2001/51/EY
