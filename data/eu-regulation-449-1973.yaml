    applicable in consequence of monetary developments to trade in agricultural products
    with the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 449/73 de la Commission, du 6 février 1973, modifiant
    le règlement (CEE) n° 1013/71 en ce qui concerne le calcul des montants compensatoires
    applicables, à la suite des événements monétaires, dans les échanges de produits
    agricoles avec les nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 449/73 der Kommission vom 6. Februar 1973 zur Änderung
    der Verordnung (EWG) Nr. 1013/71 hinsichtlich der Berechnung der Ausgleichsbeträge,
    die infolge der Währungsereignisse im Handel mit landwirtschaftlichen Erzeugnissen
    auf die neuen Mitgliedstaaten anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 449/73 af 6. februar 1973 om ændring
