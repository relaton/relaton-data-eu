    importi compensativi applicabili, in seguito agli avvenimenti monetari, negli
    scambi di prodotti agricoli con i nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 449/73 van de Commissie van 6 februari 1973 tot wijziging
