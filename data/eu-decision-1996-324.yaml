  script: Latn
  content: '96/324/EC: Commission Decision of 20 December 1995 refusing the United
    Kingdom''s application for protective measures with regard to pharmaceutical products
    coming from Spain (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/324/CE: Décision de la Commission, du 20 décembre 1995, refusant
