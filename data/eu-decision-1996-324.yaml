    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/324/EF: Kommissionens beslutning af 20. december 1995 om afslag på
    Det Forenede Kongeriges anmodning om anvendelse af beskyttelsesforanstaltninger
    med hensyn til medicinalvarer fra Spanien (Kun den engelske udgave er autentisk)'
  type: main
