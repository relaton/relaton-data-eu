title:
- language: fr
  script: Latn
  content: Décision de la Commission portant prorogation et modifications de sa décision
    du 9 octobre 1962 autorisant la perception de taxes compensatoires sur les importations
    en France de chocolat, de confiseries et préparations comportant du cacao ou
    du chocolat, sans liqueur alcoolique, en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '63/103/EWG: Entscheidung der Kommission über die Verlängerung und Änderung
    ihrer Entscheidung vom 9. Oktober 1962 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Schokolade, Schokolade- und kakaohaltigen Zuckerwaren oder Zubereitungen,
    nicht alkoholhaltig, aus den anderen Mitgliedstaaten nach Frankreich'
  type: main
- language: it
  script: Latn
  content: '63/103/CEE: Decisione della Commissione che proroga e modifica la propria
    decisione del 9 ottobre 1962 che autorizza la riscossione di tasse di compensazione
    sulle importazioni in Francia di cioccolata, di confetture al cacao o alla cioccolata,
    non contenenti sostanze alcoliche, e di preparazioni contenenti cacao o cioccolata,
    in provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/103/EEG: Beschikking van de Commissie houdende verlenging en wijziging
    van haar beschikking van 9 oktober 1962, waarbij machtiging werd verleend tot
    het leggen van compenserende heffingen op de invoer in Frankrijk van chocolade,
    van suikerwerk met cacao of met chocolade, zonder likeur, en van voedingsmiddelen
    welke cacao of chocolade bevatten, uit de andere Lid-Staten'
  type: main
