id: EUDecision1978378
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 March 1978 authorizing the French Republic not
    to apply Community treatment to men's and boys' woven overcoats, raincoats, cloaks
    and capes excepting coats of impregnated, coated, covered or laminated woven fabric
    falling within heading No 59.08, 59.11 or 59.12, falling within heading No ex
    61.01 of the Common Customs Tariff, originating in South Korea and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/378/CEE: Décision de la Commission, du 9 mars 1978, autorisant la
    République française à exclure du traitement communautaire les pardessus, imperméables
    et autres manteaux y compris les capes, tissés, pour hommes et garçonnets, autres
    que les manteaux de tissus imprégnés, enduits ou recouverts des positions 59.08,
    59.11 ou 59.12 du Tarif douanier commun, de la position Ex 61.01 du Tarif douanier
    commun, originaires de la Corée du Sud et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. März 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Mäntel und Umhänge aus Geweben für Männer und
    Knaben, andere als Mäntel aus getränkten, bestrichenen oder überzogenen Geweben
    der Tarifnummern 59.08, 59.11 oder 59.12, der Tarifnummer ex 61.01 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 9. marts 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage yderbeklædningsgenstande til
    mænd og drenge: frakker af tekstilstoffer, imprægnerede eller overtrukne, henhørende
    under pos. 59.08, 59.11 eller 59.12, som henhører under pos. ex 61.01 i den fælles
    toldtarif, har oprindelse i Sydkorea, og frit kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 marzo 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli
    e simili tessuti, per uomo e per ragazzo, diversi dai soprabiti di tessuti impregnati,
    spalmati o ricoperti, delle voci 59.08, 59.11 o 59.12 della tariffa doganale comune,
    della voce ex 61.01 della tariffa doganale comune, originari della Corea del Sud
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 maart 1978 waarbij de Franse Republiek
    wordt gemachtigd overjassen, regenjassen en ander jassen, capes voor heren en
    jongens, andere dan overjassen van geïmpregneerde, van een deklaag voorzien of
    beklede weefsels van post nr. 59.08, 59.11 of 59.12 van post ex 61.01 van het
    gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
