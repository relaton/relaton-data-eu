title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3482/73 of the Commission of 27 December 1973 completing
    Regulation (EEC) No 1463/73 as regards the measures to be taken in respect of
    the abandonment of the application by a Member State of Article 2 (a) of Regulation
    (EEC) No 974/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3482/73 de la Commission, du 27 décembre 1973, complétant
    le règlement (CEE) n° 1463/73 en ce qui concerne les mesures à prendre en cas
    de renonciation par un État membre à l'application des dispositions de l'article
    2 bis du règlement (CEE) n° 974/
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3482/73 der Kommission vom 27. Dezember 1973 zur Ergänzung
    der Verordnung (EWG) Nr. 1463/73 hinsichtlich der zu treffenden Maßnahmen, falls
    ein Mitgliedstaat auf die Anwendung von Artikel 2a der Verordnung (EWG) Nr. 974/71
    verzichtet
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3482/73 af 27. december 1973 om tillæg
    til forordning (EØF) nr. 1463/73 for så vidt angår de foranstaltninger, som
    skal træffes, såfremt en medlemstat afstår fra at anvende bestemmelserne i
    artikel 2a i forordning (EØF) nr. 974/71
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3482/73 della Commissione, del 27 dicembre 1973, che
    completa il regolamento (CEE) n. 1463/73 per quanto riguarda le misure da prendere
    in caso di rinuncia da parte di uno Stato membro all'applicazione delle disposizioni
    dell'articolo 2 bis del regolamento (CEE) n. 974/71
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3482/73 van de Commissie van 27 december 1973 houdende
    aanvulling van Verordening (EEG) nr. 1463/73 ten aanzien van de maatregelen die
    moeten worden getroffen, indien een Lid-Staat afziet van de toepassing van artikel
    2 bis van Verordening (EEG) nr. 974/71
  type: main
