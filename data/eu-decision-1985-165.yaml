title:
- language: en
  script: Latn
  content: '85/165/EEC: Commission Decision of 8 February 1985 amending Decision 83/96/EEC
    authorizing Ireland and the United Kingdom temporarily to take additional measures
    to protect themselves against the introduction of Dendroctonus micans (Only the
    English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/165/CEE: Décision de la Commission du 8 février 1985 modifiant la
    décision 83/96/CEE autorisant l''Irlande et le Royaume-Uni à prendre à titre
    temporaire des dispositions complémentaires en vue de se préserver contre l''introduction
    du Dendroctonus micans (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/165/EWG: Entscheidung der Kommission vom 8. Februar 1985 zur Änderung
    der Entscheidung 83/96/EWG zur Ermächtigung Irlands und des Vereinigten Königreichs,
    zum Schutz gegen die Einschleppung von Dendroctonus micans vorübergehend ergänzende
    Maßnahmen zu treffen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/165/EØF: Kommissionens beslutning af 8. februar 1985 om ændring af
    beslutning 83/96/EØF om bemyndigelse af Irland og Det forenede Kongerige til
    midlertidigt at træffe supplerende foranstaltninger til beskyttelse mod indslæbning
    af Dendroctonus micans (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/165/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Φεβρουαρίου
    1985 για τροποποίηση της απόφασης 83/96/ΕΟΚ που
    παρέχει προσωρινά την άδεια στην Ιρλανδία
    και το Ηνωμένο Βασίλειο να λάβουν πρόσθετα
    μέτρα για να προστατευθούν από την εισαγωγή
    του Dendroctonus micans (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/165/CEE: Decisione della Commissione dell''8 febbraio 1985 recante
    modifica della decisione 83/96/CEE che autorizza l''Irlanda e il Regno Unito ad
    adottare a titolo provvisorio disposizioni complementari per premunirsi contro
    l''introduzione di Dendroctonus micans (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/165/EEG: Beschikking van de Commissie van 8 februari 1985 houdende
    wijziging van Beschikking 83/96/EEG tot machtiging van Ierland en van het Verenigd
    Koninkrijk om tijdelijk aanvullende maatregelen te nemen ten einde het binnenbrengen
    op hun grondgebied van Dendroctonus micans te voorkomen (Slechts de tekst in de
    Engelse taal is authentiek)'
  type: main
