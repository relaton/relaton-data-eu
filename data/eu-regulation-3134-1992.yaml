    nella sua composizione al 31 dicembre 1985 per quanto riguarda i pomodori, le
    lattughe, le cicorie scarole, le carote, i carciofi, le uve da tavola e i meloni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3134/92 van de Commissie van 29 oktober 1992 tot
