  content: Commission Regulation (EEC) No 3134/92 of 29 October 1992 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to fruit and vegetable trade between Spain and the Community as constituted
    at 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives, carrots,
    artichokes, table grapes, and melons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3134/92 de la Commission, du 29 octobre 1992, fixant
    certaines modalités additionnelles pour l' application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l' Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les laitues, les chicorées scaroles, les carottes, les artichauts, les
    raisins de table et les melons
  type: main
- language: de
  script: Latn
