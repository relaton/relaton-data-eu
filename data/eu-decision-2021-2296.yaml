    Tunisina aos certificados emitidos em conformidade com o Regulamento (UE) 2021/953
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/2296 a Comisiei din 21 decembrie
    2021 de stabilire, în scopul de a facilita exercitarea dreptului la liberă circulație
    pe teritoriul Uniunii, a echivalenței certificatelor privind COVID-19 eliberate
    de Republica Tunisia cu certificatele eliberate în conformitate cu Regulamentul
    (UE) 2021/953 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/2296 z 21. decembra 2021, ktorým
