    met de overeenkomstig Verordening (EU) 2021/953 van het Europees Parlement en
    de Raad afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/2296 z dnia 21 grudnia 2021 r. ustanawiająca
    równoważność, w celu ułatwienia korzystania z prawa do swobodnego przemieszczania
    się w Unii, zaświadczeń COVID-19 wydawanych przez Republikę Tunezyjską z
    zaświadczeniami wydawanymi zgodnie z rozporządzeniem Parlamentu Europejskiego
    i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/2296 da Comissão de 21 de dezembro de
