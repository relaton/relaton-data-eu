    rovnocennost certifikátů týkajících se onemocnění COVID-19 vydaných Tuniskou
    republikou a certifikátů vydaných v souladu s nařízením Evropského parlamentu
    a Rady (EU) 2021/953
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/2296 af 21. december
