title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/2296 of 21 December 2021 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by the Republic of Tunisia to the certificates
    issued in accordance with Regulation (EU) 2021/953 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/2296 de la Commission du 21 décembre
    2021 établissant l’équivalence, aux fins de faciliter l’exercice du droit
    à la libre circulation au sein de l’Union, des certificats COVID-19 délivrés
    par la République tunisienne avec les certificats délivrés conformément au
    règlement (UE) 2021/953 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/2296 der Kommission vom 21. Dezember
