title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 août 1968, autorisant l'Allemagne à
    différer le relèvement de ses droits de douane nationaux vers ceux du tarif
    douanier en ce qui concerne certains vins algériens
  type: main
- language: de
  script: Latn
  content: '68/333/EWG: Entscheidung der Kommission vom 12. August 1968, durch die
    die Bundesrepublik Deutschland ermächtigt wird, die Erhöhung der Sätze ihres
    Zolltarifs für bestimmte algerische Weine auf die Sätze des Gemeinsamen Zolltarifs
    aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '68/333/CEE: Decisione della Commissione, del 12 agosto 1968, che autorizza
    la Repubblica federale di Germania a rinviare l''aumento dei dazi doganali nazionali
    per adeguarli a quelli della tariffa doganale comune per taluni vini algerini'
  type: main
- language: nl
  script: Latn
  content: '68/333/EEG: Beschikking van de Commissie van 12 augustus 1968 waarbij
    de Bondsrepubliek Duitsland gemachtigd wordt de verhoging van de rechten van haar
    douanetarief tot die van het gemeenschappelijk douanetarief voor bepaalde Algerijnse
    wijnen uit te stellen'
  type: main
