title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2326/74 of the Commission of 11 September 1974 re-establishing
    the levying of customs duties on handkerchiefs, of cotton fabric, falling within
    heading No ex 61.05, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3503/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2326/74 de la Commission, du 11 septembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, en tissus de coton, de la position tarifaire EX 61.05, originaires
    de pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2326/74 der Kommission vom 11. September 1974 über
    die Wiedereinführung des Zollsatzes für Taschentücher, aus Baumwolle, der Tarifnummer
    ex 61.05, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3503/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2326/74 af 11. september 1974 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, varer af bomuld under position
    ex 61.05, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2326/74 della Commissione, dell'11 settembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino, in tessuti di cotone, della voce doganale n. ex 61.05, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3503/73 del Consiglio del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2326/74 van de Commissie van 11 september 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zakdoeken,
    van weefsels van katoen, van tariefpost ex 61.05, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
