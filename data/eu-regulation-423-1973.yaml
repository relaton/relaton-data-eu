title:
- language: en
  script: Latn
  content: Regulation (EEC) No 423/73 of the Council of 5 February 1973 opening, allocating
    and providing for the administration of a Community tariff quota for dried figs
    falling within subheading ex 08.03 B of the Common Customs Tariff, originating
    in Spain and imported in immediate packings of a net capacity of 15 kg or less
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 423/73 du Conseil, du 5 février 1973, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de figues
    sèches, présentées en emballages immédiats d'un contenu net inférieur ou
    égal à 15 kilogrammes, de la sous-position EX 08.03 B du tarif douanier commun,
    originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 423/73 des Rates vom 5. Februar 1973 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Feigen,
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 kg oder
    weniger, der Tarifstelle ex 08.03 B des Gemeinsamen Zolltarifs, mit Ursprung in
    Spanien
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 423/73 af 5. februar 1973 om åbning, fordeling
    og forvaltning af fællesskabstoldkontingentet for tørrede figner, i pakninger
    af nettovægt 15 kg og derunder, henhørende under position ex 08.03 B i den fælles
    toldtarif, med oprindelse i Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 423/73 del Consiglio, del 5 febbraio 1973, relativa
    all'apertura, alla suddivisione e alle modalità di gestione del contingente tariffario
    comunitario di fichi secchi, presentati in imballaggi immediati di contenuto netto
    di 15 kg o meno, della sottovoce ex 08.03 B della tariffa doganale comune, originari
    della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 423/73 van de Raad van 5 februari 1973 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor gedroogde vijgen, in verpakkingen met een netto-inhoud per onmiddellijke
    verpakking van 15 kilogram of minder, van onderverdeling ex 08.03 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Spanje
