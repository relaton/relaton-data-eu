title:
- language: en
  script: Latn
  content: '89/32/EEC: Commission Decision of 21 December 1988 approving derogations
    provided for by Greece, Italy and Portugal from certain provisions of Council
    Directive 77/93/EEC in respect of seed potatoes originating in Canada (only the
    Greek, Italian and Portuguese texts are authentic) (89/32/EEC)'
  type: main
- language: fr
  script: Latn
  content: '89/32/CEE: Décision de la Commission du 21 décembre 1988 approuvant
    des dérogations prévues par la Grèce, l''Italie et le Portugal à certaines
    dispositions de la directive 77/93/CEE en ce qui concerne les plants de pommes
    de terre originaires du Canada (Les textes en langues grecque, italienne et portugaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 21. Dezember 1988 zur Genehmigung der
    von Griechenland, Italien und Portugal für Pflanzkartoffeln mit Ursprung in Kanada
    vorgesehenen Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des
    Rates (Nur der griechische, der italienische und der portugiesische Text sind
    verbindlich) (89/32/EWG) (89/32/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 21. december 1988 om godkendelse af de af
    Grækenland, Italien og Portugal fastsatte undtagelser fra visse bestemmelser
    i Rådets direktiv 77/93/EØF for så vidt angår læggekartofler med oprindelse
    i Canada (Kun de græske, italienske og portugisiske udgaver er autentiske) (89/32/EØF)
    (89/32/EØF) #'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 21ης Δεκεμβρίου
    1988 για την έγκριση παρεκκλίσεων που προβλέπονται
    από την Ελλάδα, την Ιταλία και την Πορτογαλία
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά τους σπόρους γεωμήλων
    προς φύτευση καταγωγής Καναδά
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 21 dicembre 1988 che approva le deroghe,
    previste dalla Grecia, dall'' Italia e dal Portogallo, a talune disposizioni della
    direttiva 77/93/CEE del Consiglio per quanto riguarda i tuberi-seme di patate
    originari del Canada (I testi in lingua italiana, greca e portoghese sono i soli
    facenti fede) (89/32/CEE) (89/32/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 21 december 1988 tot goedkeuring van
    de door Griekenland, Italië en Portugal vastgestelde afwijkingen van sommige
    bepalingen van Richtlijn 77/93/EEG van de Raad ten aanzien van pootaardappelen
    van oorsprong uit Canada (Slechts de teksten in de Griekse, de Italiaanse en de
    Portugese taal zijn authentiek) (89/32/EEG) (89/32/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 21 de Dezembro de 1988 que aprova derrogações
    estabelecidas pela Grécia, pela Itália e por Portugal de determinadas normas
