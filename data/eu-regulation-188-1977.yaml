    nr. 2055/75 om fastsættelse af de koefficienter, der skal anvendes på disse
    mindstepriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 188/77 della Commissione, del 28 gennaio 1977, che
    reca talune modalità d' applicazione del regime dei prezzi minimi per i concentrati
    di pomodoro e modifica il regolamento (CEE) n. 2055/75 che fissa i coefficienti
    da applicare a questi prezzi minimi
  type: main
- language: nl
  script: Latn
