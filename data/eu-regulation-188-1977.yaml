  content: Commission Regulation (EEC) No 188/77 of 28 January 1977 laying down certain
    rules for the application of the system of minimum prices for tomato concentrates
    and amending Regulation (EEC) No 2055/75 fixing the coefficients to be applied
    to those minimum prices
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 188/77 de la Commission, du 28 janvier 1977, portant
    certaines modalités d' application du régime des prix minimaux pour les concentrés
    de tomates et modifiant le règlement (CEE) n° 2055/75 fixant les coefficients
    à appliquer à ces prix minimaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 188/77 der Kommission vom 28. Januar 1977 über einige
    Durchführungsbestimmungen des Mindestpreissystems für Tomatenmark und zur Änderung
    der Verordnung (EWG) Nr. 2055/75 zur Festsetzung der Koeffizienten, die auf diese
    Mindestpreise anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 188/77 af 28. januar 1977 om gennemførelsesbestemmelser
