    voor rijst en tot vaststelling van een overgangsregeling voor de invoer van Basmati-rijst
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1549/2004 z dnia 30 sierpnia 2004 r. wprowadzające
    odstępstwo od rozporządzenia Rady (WE) nr 1785/2003 dotyczące systemu przywozu
    ryżu i ustanawiające szczegółowe przejściowe zasady mające zastosowanie
    do przywozu ryżu Basmati
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1549/2004 da Comissão, de 30 de Agosto de 2004,
    que derroga ao Regulamento (CE) n.° 1785/2003 do Conselho no que diz respeito
    ao regime de importação do arroz e que fixa regras específicas de transição
    aplicáveis à importação de arroz Basmati
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1549/2004 z 30. augusta 2004, ktoré sa odlišuje
    od nariadenia Rady (ES) č. 1785/2003 týkajúceho sa dovozného režimu pre ryžu,
    a ktoré stanovuje špecifické prechodné pravidlá uplatniteľné na dovoz ryže
    Basmati
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1549/2004 z dne 30. avgusta 2004 o odstopanju
    od Uredbe Sveta (ES) št. 1785/2003 v delu, ki se nanaša na uvozni režim za
    riž, in o določitvi posebnih prehodnih pravil za uvoz riža basmati
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1549/2004 de la Comisión, de 30 de agosto de 2004,
