title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1549/2004 of 30 August 2004 derogating from
    Council Regulation (EC) No 1785/2003 as regards the arrangements for importing
    rice and laying down separate transitional rules for imports of basmati rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1549/2004 de la Commission du 30 août 2004 dérogeant
    au règlement (CE) n° 1785/2003 du Conseil en ce qui concerne le régime d’importation
    du riz et fixant des règles spécifiques transitoires applicables à l'importation
    du riz Basmati
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1549/2004 der Kommission vom 30. August 2004 zur Abweichung
    von der Verordnung (EG) Nr. 1785/2003 des Rates hinsichtlich der Einfuhrregelung
    für Reis und zur Festlegung besonderer Übergangsbestimmungen für die Einfuhr
    von Basmati-Reis
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1549/2004 ze dne 30. srpna 2004, kterým se
    stanoví odchylka od nařízení Rady (ES) č. 1785/2003, pokud jde o dovozní
    režim pro rýži, a kterým se stanoví zvláštní přechodná pravidla pro
    dovoz rýže Basmati
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1549/2004 af 30. august 2004 om fravigelse
    af Rådets forordning (EF) nr. 1785/2003 for så vidt angår importordningen for
    ris og om fastsættelse af særlige overgangsbestemmelser for importen af Basmati-ris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1549/2004 της Επιτροπής,
    της 30ής Αυγούστου 2004, για παρέκκλιση από τον
    κανονισμό (ΕΚ) αριθ. 1785/2003 του Συμβουλίου σχετικά
    με το καθεστώς εισαγωγής ρυζιού και για καθορισμό
    ειδικών μεταβατικών κανόνων που έχουν εφαρμογή
    κατά τις εισαγωγές ρυζιού Basmati
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1549/2004, 30. august 2004, millega sätestatakse
