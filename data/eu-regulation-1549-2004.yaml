    määratakse kindlaks basmati riisi impordi suhtes kohaldatavad üleminekuperioodi
    erieeskirjad
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1549/2004, annettu 30 päivänä elokuuta 2004,
    neuvoston asetuksesta (EY) N:o 1785/2003 poikkeamisesta riisin tuontijärjestelmän
    osalta ja Basmati-riisin tuontiin sovellettavien erityisten siirtymäkauden sääntöjen
    vahvistamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1549/2004/EK rendelete (2004. augusztus 30.) a rizs behozatali
    rendszere tekintetében az 1785/2003/EK tanácsi rendelettől való eltérésről
    és a basmati rizs behozatalára alkalmazandó átmeneti egyedi szabályok megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1549/2004 della Commissione, del 30 agosto 2004, che
    deroga al regolamento (CE) n. 1785/2003 del Consiglio in ordine al regime di importazione
    del riso e che fissa specifiche regole transitorie applicabili alle importazioni
    di riso Basmati
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1549/2004 (2004. gada 30. augusts), ar ko paredz
