    en lo relativo al régimen de importación del arroz y se fijan normas específicas
    transitorias aplicables a la importación de arroz Basmati
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1549/2004 av den 30 augusti 2004 om undantag
