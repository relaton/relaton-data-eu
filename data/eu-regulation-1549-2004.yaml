    režīmu un nosaka īpašus pagaidu noteikumus basmati rīsu importēšanai
  type: main
- language: lt
  script: Latn
  content: 2004 m. rugpjūčio 30 d. Komisijos reglamentas (EB) Nr. 1549/2004, nukrypstantis
    nuo Tarybos reglamento (EB) Nr. 1785/2003 dėl ryžių importo tvarkos ir nustatantis
