title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1940/97 of 3 October 1997 laying down detailed
    rules for a tariff quota for cows and heifers of specified mountain breeds originating
    in various third countries, other than for slaughter, in the period 1 July 1997
    to 30 June 1998 and amending Regulation (EC) No 2514/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1940/97 de la Commission du 3 octobre 1997 établissant
    pour la période du 1er juillet 1997 au 30 juin 1998 les modalités d'application
    pour un contingent tarifaire de vaches et génisses, autres que celles destinées
    à la boucherie, de certaines races de montagne originaires de certains pays tiers
    et modifiant le règlement (CE) nº 2514/96
  type: main
- language: de
  script: Latn
