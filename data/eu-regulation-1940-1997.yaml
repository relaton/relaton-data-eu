    für nicht zum Schlachten bestimmte Kühe und Färsen bestimmter Höhenrassen
    mit Ursprung in bestimmten Drittländern sowie zur Änderung der Verordnung (EG)
    Nr. 2514/96
  type: main
- language: da
  script: Latn
