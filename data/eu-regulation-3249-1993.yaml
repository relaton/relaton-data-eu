title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3249/93 of 25 November 1993 re-establishing
    the levying of customs duties on products falling within CN code 7013, originating
    in Mexico, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3249/93 de la Commission du 25 novembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 7013, originaires du Mexique, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3249/93 DER KOMMISSION vom 25. November 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 7013 mit Ursprung in Mexiko,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3249/93 af 25. november 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 7013 og med oprindelse
    i Mexico, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3249/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Νοεμβρίου 1993 περί της αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 7013, καταγωγής Μεξικού, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3249/93 DELLA COMMISSIONE del 25 novembre 1993 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    della nomenclatura combinata 7013 originari del Messico beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3249/93 VAN DE COMMISSIE van 25 november 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 7013, van oorsprong uit Mexico, waarvoor de in Verordening (EEG) nr.
    3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3249/93 DA COMISSÃO de 25 de Novembro de 1993 que
