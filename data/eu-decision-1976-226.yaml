  content: Decisione della Commissione, del 6 febbraio 1976, che autorizza la Repubblica
    francese ad applicare delle misure di protezione negli scambi intracomunitari
    di vini, della voce 22.05 C della tariffa doganale comune, provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 februari 1976 tot machtiging van de
