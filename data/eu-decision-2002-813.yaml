  script: Latn
  content: '2002/813/EC: Council Decision of 3 October 2002 establishing, pursuant
    to Directive 2001/18/EC of the European Parliament and of the Council, the summary
    notification information format for notifications concerning the deliberate release
    into the environment of genetically modified organisms for purposes other than
    for placing on the market'
  type: main
- language: fr
