title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1970, portant octroi du concours
    du FSE au bénéfice de la République italienne pour des dépenses relatives
    à des opérations de réinstallation effectuées par le "Ministero dell'interno",
    le "Ministero del lavoro e della previdenza sociale" et "l'Opera nazionale per
    gli invalidi di guerra (ONIG)"
  type: main
- language: de
  script: Latn
  content: '70/478/EWG: Entscheidung der Kommission vom 30. September 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Republik
    Italien zu Aufwendungen für vom "Ministero dell''interno", vom "Ministero del
    lavoro e della previdenza sociale" und von der "Opera nazionale per gli invalidi
    di guerra (ONIG)" durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '70/478/CEE: Decisione della Commissione, del 30 settembre 1970, relativa
    alla concessione di un contributo del Fondo sociale europeo a favore della Repubblica
    italiana per spese concernenti operazioni di nuova sistemazione effettuate dal
    «Ministero dell''interno», dal «Ministero del lavoro e della previdenza sociale»
    e dall''«Opera nazionale per gli invalidi di guerra (ONIG)»'
  type: main
- language: nl
  script: Latn
  content: '70/478/EEG: Beschikking van de Commissie van 30 september 1970 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door het "Ministero dell''interno", het "Ministero del lavoro e della previdenza
    sociale" en het "Opera nazionale per gli invalidi di guerra (O.N.I.G.)" gemaakte
    verplaatsingskosten'
