    peaux de bovins préparés de la sous-position 41.02 ex C du tarif douanier commun,
    originaires du Pakistan et d' Argentine, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3385/87 der Kommission vom 11. November 1987 zur Wiedereinführung
