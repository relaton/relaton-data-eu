  script: Latn
  content: Commission Regulation (EEC) No 3385/87 of 11 November 1987 re-establishing
    the levying of customs duties on bovine cattle leather and equine leather falling
    within subheading 41.02 ex C of the Common Customs Tariff, originating in Pakistan
    and Argentina, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3385/87 de la Commission du 11 novembre 1987 portant
