  script: Latn
  content: Commission Delegated Regulation (EU) 2023/2175 of 7 July 2023 on supplementing
    Regulation (EU) 2017/2402 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying in greater detail the risk retention
    requirements for originators, sponsors, original lenders, and servicers
  type: main
- language: fr
  script: Latn
