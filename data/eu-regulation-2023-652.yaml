    на пазара на печени пукани зърна от семената
    на Euryale ferox Salisb. (махана) като традиционна храна
    от трета държава съгласно Регламент (ЕС) 2015/2283
    на Европейския парламент и на Съвета и за изменение
    на Регламент за изпълнение (ЕС) 2017/2470 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2023/652 ze dne 20. března 2023,
