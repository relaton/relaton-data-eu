    ferox Salisb. (makhana) som en traditionel fødevare fra et tredjeland i henhold
    til Europa-Parlamentets og Rådets forordning (EU) 2015/2283 og om ændring af
    Kommissionens gennemførelsesforordning (EU) 2017/2470
  type: main
- language: el
  script: Grek
