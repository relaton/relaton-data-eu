title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/652 of 20 March 2023 authorising
    the placing on the market of roasted and popped kernels from the seeds of Euryale
    ferox Salisb. (makhana) as a traditional food from a third country under Regulation
    (EU) 2015/2283 of the European Parliament and of the Council and amending Commission
    Implementing Regulation (EU) 2017/2470
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/652 de la Commission du 20 mars 2023
    autorisant la mise sur le marché de graines grillées et soufflées d’Euryale
    ferox Salisb. (makhana) en tant qu’aliment traditionnel en provenance d’un
    pays tiers au titre du règlement (UE) 2015/2283 du Parlement européen et du
    Conseil, et modifiant le règlement d’exécution (UE) 2017/2470 de la Commission
  type: main
- language: de
  script: Latn
