    zur Genehmigung des Inverkehrbringens von gerösteten und gepufften Kernen der
    Samen von Euryale ferox Salisb. (Makhana) als traditionelles Lebensmittel aus
    einem Drittland gemäß der Verordnung (EU) 2015/2283 des Europäischen Parlaments
    und des Rates und zur Änderung der Durchführungsverordnung (EU) 2017/2470 der
    Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2023/652 на Комисията
