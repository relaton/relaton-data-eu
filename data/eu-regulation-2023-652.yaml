    de las semillas de Euryale ferox Salisb. (makhana) como alimento tradicional de
    un tercer país con arreglo al Reglamento (UE) 2015/2283 del Parlamento Europeo
    y del Consejo y se modifica el Reglamento de Ejecución (UE) 2017/2470 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2023/652 av den 20 mars 2023
    om godkännande för utsläppande på marknaden av rostade och poppade kärnor
    från frön av Euryale ferox Salisb. (makhana) som ett traditionellt livsmedel
