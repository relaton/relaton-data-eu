    miż-żrieragħ tal-Euryale ferox Salisb. (makhana) bħala ikel tradizzjonali
    minn pajjiż terz skont ir-Regolament (UE) 2015/2283 tal-Parlament Ewropew u tal-Kunsill
    u li jemenda r-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2017/2470
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2023/652 van de Commissie van 20 maart 2023
    tot toelating van het in de handel brengen van geroosterde en gepofte pitten van
    de zaden van Euryale ferox Salisb. (makhana) als traditioneel levensmiddel uit
    een derde land uit hoofde van Verordening (EU) 2015/2283 van het Europees Parlement
    en de Raad en tot wijziging van Uitvoeringsverordening (EU) 2017/2470 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2023/652 z dnia 20 marca 2023 r.
