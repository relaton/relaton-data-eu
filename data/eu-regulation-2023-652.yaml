    Euryale ferox Salisb. (makhana) jako tradycyjnej żywności z państwa trzeciego
    zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2015/2283 oraz
    zmieniające rozporządzenie wykonawcze Komisji (UE) 2017/2470
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2023/652 da Comissão de 20 de março de
    2023 que autoriza a colocação no mercado de grãos torrados e tufados de Euryale
    ferox Salisb. (makhana) como alimento tradicional de um país terceiro ao abrigo
    do Regulamento (UE) 2015/2283 do Parlamento Europeu e do Conselho e que altera
    o Regulamento de Execução (UE) 2017/2470 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2023/652 al Comisiei din 20 martie
    2023 de autorizare a introducerii pe piață a miezului prăjit și expandat provenit
    de la semințe de Euryale ferox Salisb. (makhana) ca aliment tradițional provenit
    dintr-o țară terță, în temeiul Regulamentului (UE) 2015/2283 al Parlamentului
    European și al Consiliului, și de modificare a Regulamentului de punere în
    aplicare (UE) 2017/2470 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2023/652 z 20. marca 2023, ktorým
    sa povoľuje umiestnenie pražených a pufovaných jadier zo semien leknovky hrozivej
    [Euryale ferox Salisb. (makhana)] na trh ako tradičnej potraviny z tretej krajiny
    podľa nariadenia Európskeho parlamentu a Rady (EÚ) 2015/2283 a ktorým sa mení
    vykonávacie nariadenie Komisie (EÚ) 2017/2470
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2023/652 z dne 20. marca 2023 o odobritvi
    dajanja na trg praženih in ekspandiranih zrn iz semen Euryale ferox Salisb. (makana)
    kot tradicionalnega živila iz tretje države v skladu z Uredbo (EU) 2015/2283
