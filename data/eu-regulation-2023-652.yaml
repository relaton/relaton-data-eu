    Salisb. (makhana) a chur ar an margadh mar bhia traidisiúnta ó thríú tír
    faoi Rialachán (AE) 2015/2283 ó Pharlaimint na hEorpa agus ón gComhairle agus
    lena leasaítear Rialachán Cur Chun Feidhme (AE) 2017/2470 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2023/652 оd 20. ožujka 2023. o odobravanju
    stavljanja na tržište prženih i ekspandiranih jezgri iz sjemenki biljke Euryale
    ferox Salisb. („makhana”) kao tradicionalne hrane iz treće zemlje, u skladu
    s Uredbom (EU) 2015/2283 Europskog parlamenta i Vijeća i o izmjeni Provedbene
    uredbe Komisije (EU) 2017/2470
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/652 végrehajtási rendelete (2023. március 20.)
    az Euryale ferox Salisb. magjából nyert, pörkölt és pattogatott magbél (makhana)
    (EU) 2015/2283 európai parlamenti és tanácsi rendelet szerinti, harmadik országból
    származó hagyományos élelmiszerként történő forgalomba hozatalának engedélyezéséről
    és az (EU) 2017/2470 bizottsági végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/652 della Commissione del 20 marzo
    2023 che autorizza l’immissione sul mercato delle mandorle dei semi di Euryale
    ferox Salisb. (makhana) tostate e soffiate quale alimento tradizionale da un paese
    terzo a norma del regolamento (UE) 2015/2283 del Parlamento europeo e del Consiglio
    e modifica il regolamento di esecuzione (UE) 2017/2470 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2023/652 (2023. gada 20. marts), ar
    ko atļauj laist tirgū grauzdētus un uzpūstus Euryale ferox Salisb. (makhanas)
    sēklu kodolus kā tradicionālu pārtiku no trešās valsts saskaņā ar Eiropas
    Parlamenta un Padomes Regulu (ES) 2015/2283 un groza Komisijas Īstenošanas regulu
    (ES) 2017/2470
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2023/652 2023 m. kovo 20 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (ES) 2015/2283 leidžiama pateikti
    rinkai skrudintus ir spragintus dygiųjų eurialių (Euryale ferox Salisb.) sėklų
    branduolius kaip trečiosios šalies tradicinį maisto produktą ir iš dalies
    keičiamas Komisijos įgyvendinimo reglamentas (ES) 2017/2470
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/652 tal-20
