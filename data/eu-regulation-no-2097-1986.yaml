title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2097/86 of 3 July 1986 re-establishing the
    levying of customs duties on articles of apparel and clothing accessories, falling
    within subheading 39.07 B V ex d), originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2097/86 de la Commission du 3 juillet 1986 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement, de la sous-position 39.07 B V ex d) du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2097/86 der Kommission vom 3. Juli 1986 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör der Tarifstelle
    39.07 B V ex d) des Gemeinsamen Zolltarifs mit Ursprung in Hongkong, dem die in
    der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2097/86 af 3. juli 1986 om genindførelse
    af opkrævning af told for beklædningsgenstande og tilbehør dertil, henhørende
    under pos. 39.07 B V ex d) i den fælles toldtarif og med oprindelse i Hongkong,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2097/86 της Επιτροπής
    της 3ης Ιουλίου 1986 για την αποκατάσταση της
