title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/309 of 24 February 2022 amending
    Implementing Decision (EU) 2019/583 to take into account certain eco-innovation
    CO2 savings for the calculation of the average specific CO2 emissions of Daimler
    AG and the Daimler AG pool (notified under document C(2022) 965) (Only the Czech,
    German, English, French, Irish, Italian, Hungarian, Dutch and Swedish texts are
    authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/309 de la Commission du 24 février
    2022 modifiant la décision d’exécution (UE) 2019/583 afin de tenir compte
    de certaines réductions d’émissions de CO2 obtenues au moyen d’éco-innovations
    aux fins du calcul des émissions spécifiques moyennes de CO2 de Daimler AG et
    du groupement Daimler AG [notifiée sous le numéro C(2022) 965] (Les versions
    en langues tchèque, allemande, anglaise, française, irlandaise, italienne, hongroise,
    néerlandaise et suédoise sont les seules faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/309 der Kommission vom 24. Februar 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2019/583 zur Berücksichtigung
    bestimmter CO2-Einsparungen aus Ökoinnovationen bei der Berechnung der durchschnittlichen
    spezifischen CO2-Emissionen der Daimler AG und der Emissionsgemeinschaft Daimler
    AG (Bekannt gegeben unter Aktenzeichen C(2022) 965) (Nur der tschechische, deutsche,
    englische, französische, irische, italienische, ungarische, niederländische
    und schwedische Text sind verbindlich)
  type: main
- language: bg
