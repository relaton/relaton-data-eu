title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1579/82 of 14 June 1982 opening, allocating
    and providing for the administration of a Community tariff quota for 5*000 head
    of bulls, cows and heifers, other than those intended for slaughter, of certain
    Alpine breeds, falling within subheading ex 01.02 A II of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1579/82 du Conseil, du 14 juin 1982, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de 5*000
    têtes de taureaux, vaches et génisses, autres que ceux destinés à la boucherie,
    de certaines races alpines, de la sous-position ex 01.02 A II du tarif douanier
    commun
  type: main
- language: de
  script: Latn
