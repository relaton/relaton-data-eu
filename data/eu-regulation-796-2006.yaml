    būdu iki 2006 m. rugpjūčio 31 d.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 796/2006 van de Commissie van 29 mei 2006 tot schorsing
    van de aankoop van boter tegen 90 % van de interventieprijs en tot opening van
    de aankoop bij inschrijving voor de periode tot en met 31 augustus 2006
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 796/2006 z dnia 29 maja 2006 r. zawieszające
