    através de concurso para o período com termo em 31 de Agosto de 2006
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 796/2006 z 29. mája 2006 , ktorým sa pozastavuje
    nákup masla za 90 % intervenčnej ceny a otvára nákup prostredníctvom verejnej
    súťaže na obdobie, ktoré sa skončí 31. augusta 2006
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 796/2006 z dne 29. maja 2006 o prekinitvi odkupa
    masla po ceni v višini 90 % intervencijske cene in odprtju javnega razpisa za
    zbiranje predlogov za odkup masla za obdobje do 31. avgusta 2006
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 796/2006 de la Comisión, de 29 de mayo de 2006 , por
