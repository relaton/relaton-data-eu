  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 796/2006 της Επιτροπής,
    της 29ης Μαΐου 2006 , σχετικά με την αναστολή των
    αγορών βουτύρου στο 90 % της τιμής παρέμβασης
    και για το άνοιγμα των αγορών βουτύρου με διαγωνισμό
    για την περίοδο που λήγει στις 31 Αυγούστου
    2006
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 796/2006, 29. mai 2006 , millega peatatakse
    või kokkuost 90 %ga sekkumishinnast ja avatakse kokkuost pakkumismenetluse teel
    ajavahemikuks kuni 31. augustini 2006
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 796/2006, annettu 29 päivänä toukokuuta 2006
    , voin ostojen keskeyttämisestä 90 prosenttia interventiohinnasta olevaan hintaan
