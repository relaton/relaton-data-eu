title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1330/73 of the Council of 15 May 1973 amending Regulation
    (EEC) No 185/73 laying down general rules for the system of compensatory amounts
    applicable, by virtue of the various forms of added sugar, to products processed
    from fruits and vegetables following the Accession of new Member States to the
    Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1330/73 du Conseil, du 15 mai 1973, modifiant le règlement
    (CEE) n° 185/73 déterminant les règles générales du régime des montants
    compensatoires applicables, au titre des sucres divers d'addition, dans le secteur
    des produits transformés à base de fruits et légumes à la suite de l'adhésion
    de nouveaux États membres à la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1330/73 des Rates vom 15. Mai 1973 zur Änderung der
    Verordnung (EWG) Nr. 185/73 über die Grundregeln für die Anwendung von Ausgleichsbeträgen
    für zugesetzte Zuckerarten bei Verarbeitungserzeugnissen aus Obst und Gemüse
    als Folge des Beitritts der neuen Mitgliedstaaten zur Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1330/73 af 15. maj 1973 om ændring af forordning
    (EØF) nr. 185/73 om fastlæggelse af de almindelige regler for udligningsbeløbsordningen,
    som for forskellige tilsatte sukkerarter finder anvendelse på produkter, forarbejdet
    på basis af frugt og grønsager, som følge af de nye medlemsstaters tiltrædelse
    af Fællesskabet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1330/73 del Consiglio, del 15 maggio 1973, che modifica
    il regolamento (CEE) n. 185/73 che determina le norme generali del regime degli
    importi compensativi applicabili, per gli zuccheri diversi addizionati, nel settore
    dei prodotti trasformati a base di ortofrutticoli in seguito all'adesione di nuovi
    Stati membri alla Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1330/73 van de Raad van 15 mei 1973 tot wijziging
    van Verordening (EEG) nr. 185/73 tot vaststelling van de algemene regels van het
    stelsel van de compenserende bedragen die voor de verschillende soorten toegevoegde
    suiker in de sector op basis van groenten en fruit verwerkte produkten van toepassing
    zijn ingevolge de toetreding van nieuwe Lid-Staten tot de Gemeenschap
  type: main
