id: EUDecision2007423
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2007/423/CFSP of 18 June 2007 implementing Common Position
    2004/293/CFSP renewing measures in support of the effective implementation of
    the mandate of the International Criminal Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
  content: Décision 2007/423/PESC du Conseil du 18 juin 2007 mettant en œuvre la
    position commune 2004/293/PESC concernant le renouvellement des mesures définies
    à l'appui d'une mise en œuvre effective du mandat du Tribunal pénal international
    pour l'ex-Yougoslavie (TPIY)
  type: main
- language: de
  script: Latn
  content: Beschluss 2007/423/GASP des Rates vom 18. Juni 2007 zur Durchführung des
    Gemeinsamen Standpunkts 2004/293/GASP zur Verlängerung von Maßnahmen zur Unterstützung
    der wirksamen Ausführung des Mandats des Internationalen Strafgerichtshofs für
    das ehemalige Jugoslawien (ICTY)
  type: main
- language: bg
  script: Cyrl
  content: Решение 2007/423/ОВППС на Съвета от 18 юни 2007
    година за изпълнение на Обща позиция 2004/293/ОВППС
    за възобновяване на мерките в подкрепа на ефективното
    въвеждане на мандата на Международния трибунал
    за престъпления в бивша Югославия (МТПБЮ)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2007/423/SZBP ze dne 18. června 2007 , kterým se provádí
    společný postoj 2004/293/SZBP, kterým se obnovují opatření na podporu účinného
    provádění mandátu Mezinárodního trestního tribunálu pro bývalou Jugoslávii
    (ICTY)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2007/423/FUSP af 18. juni 2007 om gennemførelse af
    fælles holdning 2004/293/FUSP om forlængelse af foranstaltningerne til støtte
    for den effektive gennemførelse af mandatet til Den Internationale Krigsforbryderdomstol
    vedrørende Det Tidligere Jugoslavien (ICTY)
  type: main
- language: el
  script: Grek
  content: Απόφαση 2007/423/ΚΕΠΠΑ του Συμβουλίου, της
    18ης Ιουνίου 2007 , για την εφαρμογή της κοινής
    θέσης 2004/293/ΚΕΠΠΑ για την ανανέωση των μέτρων
    προς υποστήριξη της αποτελεσματικής εφαρμογής
    της εντολής του Διεθνούς Ποινικού Δικαστηρίου
    για την πρώην Γιουγκοσλαβία (ICTY)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2007/423/ÜVJP, 18. juuni 2007 , millega rakendatakse ühist
    seisukohta 2004/293/ÜVJP, millega pikendatakse endise Jugoslaavia asjade rahvusvahelise
    kriminaalkohtu (EJRK) volituste tõhusat rakendamist toetavate meetmete kehtivusaega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2007/423/YUTP, tehty 18 päivänä kesäkuuta 2007
    , entisen Jugoslavian alueen kansainvälisen rikostuomioistuimen toimeksiannon
    tehokasta täytäntöönpanoa tukevien toimenpiteiden uusimisesta hyväksytyn
    neuvoston yhteisen kannan 2004/293/YUTP täytäntöönpanosta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2007/423/KKBP határozata ( 2007. június 18. ) a volt Jugoszláviában
    elkövetett háborús bűncselekményeket vizsgáló Nemzetközi Törvényszék
    (ICTY) megbízatása hatékony végrehajtásának támogatására meghatározott
    intézkedések megújításáról szóló 2004/293/KKBP közös álláspont végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2007/423/PESC del Consiglio, del 18 giugno 2007 , che attua la
    posizione comune 2004/293/PESC che proroga le misure a sostegno dell'effettiva
    attuazione del mandato del tribunale penale internazionale per la ex Jugoslavia
    (ICTY)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2007/423/KĀDP ( 2007. gada 18. jūnijs ), ar ko īsteno
    Kopējo nostāju 2004/239/KĀDP, ar kuru atjauno pasākumus, lai atbalstītu sekmīgu
    Starptautiskā Kara noziegumu tribunāla bijušajai Dienvidslāvijai ( ICTY )
    mandāta īstenošanu
  type: main
- language: lt
  script: Latn
  content: 2007 m. birželio 18 d. Tarybos sprendimas 2007/423/BUSP, įgyvendinantis
    Bendrąją poziciją 2004/293/BUSP, atnaujinančią priemones, remiančias veiksmingą
    Tarptautinio baudžiamojo tribunolo Buvusiajai Jugoslavijai (ICTY) mandato įgyvendinimą
  type: main
- language: mt
  script: Latn
  content: Decizjoni tal-Kunsill 2007/423/PESK tat- 18 ta’ Ġunju 2007 li timplimenta
    l-Pożizzjoni Komuni 2004/293/PESK li ġġedded il-miżuri b’appoġġ għall-implimentazzjoni
    effettiva tal-mandat tat-Tribunal Kriminali Internazzjonali ta’ dik li qabel
    kienet il-Jugoslavja (ICTY)
  type: main
- language: nl
  script: Latn
  content: Besluit 2007/423/GBVB van de Raad van 18 juni 2007 tot uitvoering van Gemeenschappelijk
    Standpunt 2004/293/GBVB tot verlenging van de maatregelen ter ondersteuning van
    de daadwerkelijke uitvoering van het mandaat van het Internationaal Oorlogstribunaal
    voor het voormalige Joegoslavië (ICTY)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2007/423/WPZiB z dnia 18 czerwca 2007 r. wprowadzająca w
    życie wspólne stanowisko 2004/293/WPZiB odnawiające środki wspierające skuteczne
    wykonanie mandatu Międzynarodowego Trybunału Karnego dla byłej Jugosławii
    (MTKJ)
  type: main
- language: pt
  script: Latn
  content: Decisão 2007/423/PESC do Conselho, de 18 de Junho de 2007 , que dá execução
    à Posição Comum 2004/293/PESC que renova as medidas de apoio ao exercício
    efectivo do mandato do Tribunal Penal Internacional para a antiga Jugoslávia
    (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Decizia 2007/423/PESC a Consiliului din 18 iunie 2007 de punere în aplicare
    a Poziției comune 2004/293/PESC de reînnoire a măsurilor stabilite în sprijinul
    punerii în aplicare efective a mandatului Tribunalului Penal Internațional pentru
    fosta Iugoslavie (TPII)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2007/423/SZBP z 18. júna 2007 , ktorým sa vykonáva
    spoločná pozícia 2004/293/SZBP, ktorou sa obnovujú opatrenia na podporu účinného
    vykonávania mandátu Medzinárodného trestného tribunálu pre bývalú Juhosláviu
    (ICTY)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2007/423/SZVP z dne 18. junija 2007 o izvajanju Skupnega stališča
    2004/293/SZVP o obnovitvi ukrepov v podporo učinkovitemu izvajanju pooblastil
    Mednarodnega kazenskega sodišča za nekdanjo Jugoslavijo (MKSJ)
  type: main
- language: es
  script: Latn
  content: Decisión 2007/423/PESC del Consejo, de 18 de junio de 2007 , por la que
    se aplica la Posición Común 2004/293/PESC por la que se renuevan las medidas
    en apoyo de la aplicación efectiva del mandato del Tribunal Penal Internacional
    para la ex Yugoslavia (TPIY)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2007/423/GUSP av den 18 juni 2007 om genomförande av gemensam
    ståndpunkt 2004/293/GUSP om förnyande av åtgärder till stöd för ett effektivt
    genomförande av Internationella tribunalen för f.d. Jugoslaviens (Icty) uppgift
  type: main
