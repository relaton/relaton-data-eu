  content: Commission Regulation (EEC) No 2909/76 of 30 November 1976 on the invitation
    to tender for the supply to UNICEF, for Vietnam, for use as food aid, of vitaminized
    skimmed-milk powder to be purchased on the Community market
  type: main
- language: fr
  script: Latn
