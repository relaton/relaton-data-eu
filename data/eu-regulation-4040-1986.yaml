title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 4040/86 of 22 December 1986 laying down for
    1987 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non-member countries in the 200-nautical-mile
    zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4040/86 du Conseil du 22 décembre 1986 fixant pour
    1987 certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de certains pays tiers dans la zone de
    200 milles située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4040/86 des Rates vom 22. Dezember 1986 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1987)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4040/86 af 22. december 1986 om fastsættelse
    af en række foranstaltninger for 1987 til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4040/86 του Συμβουλίου
    της 22ας Δεκεμβρίου 1986 για τον καθορισμό, για
    το 1987, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων, τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    εντός της ζώνης 200 μιλίων η οποία ευρίσκεται
    στα ανοικτά του γαλλικού διαμερίσματος της
    Γουιάνας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4040/86 del Consiglio del 22 dicembre 1986 che stabilisce,
    per il 1987, talune misure di conservazione e di gestione delle risorse da applicare
    alle navi battenti bandiera di taluni paesi terzi nella zona di 200 miglia situata
    al largo delle coste del dipartimento francese delle Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4040/86 van de Raad van 22 december 1986 houdende
    maatregelen voor 1987 voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4040/86 do Conselho de 22 de Dezembro de 1986 que
    fixa, para 1987, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de certos países terceiros
    na zona de 200 milhas situada ao largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 4040/86 del Consejo de 22 de diciembre de 1986 por
    el que se establecen, para 1987, determinadas medidas de conservación y gestión
    de los recursos pesqueros aplicables a los buques que enarbolen pabellón de determinados
    terceros países en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
