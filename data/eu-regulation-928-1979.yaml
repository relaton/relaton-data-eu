  content: Council Regulation (EEC) No 928/79 of 8 May 1979 increasing the volume
    of the Community tariff quota, opened for the year 1979, for ferro-chromium containing
    not less than 4% by weight of carbon and falling within subheading ex 73.02 E
    I of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 928/79 du Conseil, du 8 mai 1979, portant augmentation
    du contingent tarifaire communautaire ouvert pour l' année 1979 pour le ferrochrome
    contenant en poids 4 % ou plus de carbone de la sous-position ex 73.02 E I du
    tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 928/79 des Rates vom 8. Mai 1979 zur Aufstockung des
