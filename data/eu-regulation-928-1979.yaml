    einem Gehalt an Kohlenstoff von 4 Gewichtshundertteilen oder mehr der Tarifstelle
    ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 928/79 af 8. maj 1979 om forhøjelse af det
