  content: Règlement (CEE) n 1247/69 de la Commission, du 27 juin 1969, fixant les
    taux des restitutions applicables, à compter du 1er juillet 1969, au sucre et
    à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1247/69 der Kommission vom 27. Juni 1969 zur Festsetzung
    der ab 1. Juli 1969 geltenden Erstattungssätze für Zucker und Melasse, die in
    Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1247/69 della Commissione, del 27 giugno 1969, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 luglio 1969, allo
    zucchero ed al melasso esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1247/69 van de Commissie van 27 juni 1969 houdende
    vaststelling van de restituties die met ingang van 1 juli 1969 worden toegepast
    voor suiker en melasse, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
