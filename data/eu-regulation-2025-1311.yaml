    the materiality of extensions of, and changes to, the use of alternative internal
    models, and changes to the subset of the modellable risk factors
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1311 de la Commission du 3 juillet 2025
    complétant le règlement (UE) no 575/2013 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les conditions d’évaluation
    du caractère significatif des extensions et modifications apportées à l’utilisation
    de modèles internes alternatifs et des modifications apportées au sous-ensemble
    de facteurs de risque modélisables
  type: main
