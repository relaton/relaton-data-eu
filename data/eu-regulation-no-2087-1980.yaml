type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2087/80 of 4 August 1980 re-establishing
    the levying of customs duties on travelling rugs and blankets, of wool, of cotton
    or of man-made textile fibres, products of category 66 (code 0660), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2087/80 de la Commission, du 4 août 1980, portant
    rétablissement de la perception des droits de douane applicables aux couvertures
    de laine, de coton ou de fibres textiles synthétiques ou artificielles, de la
    catégorie n° 66 (code 0660), originaires de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2087/80 der Kommission vom 4. August 1980 über die
    Wiedereinführung des Zollsatzes für Decken, aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen, der Warenkategorie Nr. 66 (Kennziffer 0660), mit
    Ursprung in China, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2087/80 af 4. august 1980 om genindførelse
    af opkrævning af toldafgifter for plaider og lignende tæpper af uld, bomuld
    og kemofibre, under kategori 66 (kode 0660), som har oprindelse i Kina og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2087/80 della Commissione, del 4 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle coperte di lana,
    di cotone o di fibre tessili sintetiche o artificiali, della categoria di prodotti
    n. 66 (codice 0660), originarie della Cina, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2087/80 van de Commissie van 4 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dekens van
    wol, van katoen of van synthetische of van kunstmatige textielvezels, van de categorie
    van produkten nr. 66 (codenummer 0660), van oorsprong uit China waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
