title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 597/76 of 16 March 1976 re-establishing
    the levying of the customs duties on medium petroleum oils, for other purposes
    falling within subheading 27.10 B III originating in Libya to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 597/76 de la Commission, du 16 mars 1976, portant
    rétablissement de la réception des droits de douane applicables aux huiles de
    pétrole moyennes, destinées à d'autres usages, de la sous-position tarifaire
    27.10 B III, originaires de la Libye, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 597/76 der Kommission vom 16. März 1976 zur Wiedereinführung
    des Zollsatzes für mittelschwere Öle, zu anderer Verwendung, der Tarifstelle
    27.10 B III, mit Ursprung in Libyen, dem die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 597/76 af 16. marts 1976 om genindførelse
    af opkrævning af toldafgifter for middelsvære olier, udvundet af jordolie, til
    anden anvendelse under underposition 27.10 B m, som har oprindelse i Libyen og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 597/76 della Commissione, del 16 marzo 1976, che ripristina
    la riscossione dei dazi doganali applicabili agli oli di petrolio o di minerali
    bituminosi, destinati ad altri usi, della sottovoce doganale n. 27.10 B III originari
    della Libia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 597/76 van de Commissie van 16 maart 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op halfzware
    oliën, bestemd voor ander gebruik, van onderverdeling 27.10 B III, van oorsprong
    uit Libië, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad
    van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
