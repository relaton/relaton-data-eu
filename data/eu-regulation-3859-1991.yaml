title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3859/91 of 23 December 1991 amending Regulations
    (EEC) No 3420/83, (EEC) No 288/82 and (EEC) No 1765/82 in order to liberalize
    or suspend quantitative restrictions in respect of Albania, extending the suspension
    of certain quantitative restrictions in respect of countries of Eastern and Central
    Europe and laying down the import arrangements applicable to products originating
    in the Baltic States
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3859/91 DU CONSEIL du 23 décembre 1991 portant, par
    modification des règlements (CEE) no 3420/83, (CEE) no 288/82 et (CEE) no 1765/82,
    libération ou suspension de restrictions quantitatives à l'' égard de l'' Albanie,
    prorogation de la suspension de certaines restrictions quantitatives à l'' égard
    de pays d'' Europe centrale et orientale et définition du régime commercial
    à l'' importation applicable aux produits originaires des États baltes #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3859/91 DES RATES vom 23. Dezember 1991 zur Aufhebung
    bzw. Aussetzung der mengenmäßigen Beschränkungen gegenüber Albanien, zur Verlängerung
    der Aussetzung bestimmter mengenmäßiger Beschränkungen gegenüber den Ländern
    Mittel- und Osteuropas, zur Festlegung der Einfuhrregelung für Waren mit Ursprung
    in den baltischen Staaten durch entsprechende Änderung der Verordnungen (EWG)
    Nr. 3420/83, (EWG) Nr. 288/82 und (EWG) Nr. 1765/82 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3859/91 af 23. december 1991 om ændring
    af forordning (EØF) nr. 3420/83, 288/82 og 1765/82 med henblik på liberalisering
    eller suspension af de kvantitative restriktioner over for Albanien, forlængelse
    af suspensionen af visse kvantitative restriktioner over for landene i Central-
    og Østeuropa samt fastsættelse af handelsordningen ved indførsel af varer med
    oprindelse i de baltiske stater
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3859/91 του Συμβουλίου
    της 23ης Δεκεμβρίου 1991 για την τροποποίηση των
    κανονισμών ( ΕΟΚ ) αριθ. 3420/83, ( ΕΟΚ ) αριθ. 288/82
    και ( ΕΟΚ ) αριθ. 1765/82, με σκοπό την ελευθέρωση
    ή την αναστολή ποσοτικών περιορισμών έναντι
    της Αλβανίας, την παράταση της αναστολής ορισμένων
    ποσοτικών περιορισμών έναντι των χωρών της
    Κεντρικής και Ανατολικής Ευρώπης και τον καθορισμό
    του εμπορικού καθεστώτος εισαγωγών που εφαρμόζεται
    στα προϊόντα καταγωγής των Βαλτικών κρατών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3859/91 DEL CONSIGLIO del 23 dicembre 1991 recante,
    mediante modifica dei regolamenti (CEE) n. 3420/83, (CEE) n. 288/82 e (CEE) n.
    1765/82, liberalizzazione o sospensione di restrizioni quantitative nei confronti
    dell'' Albania, proroga della sospensione di alcune restrizioni quantitative nei
    confronti di paesi dell'' Europa centrale e orientale e definizione del regime
    commerciale all'' importazione applicabile ai prodotti originari delle Repubbliche
    baltiche #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3859/91 VAN DE RAAD van 23 december 1991 houdende,
    door wijziging van de Verordeningen (EEG) nr. 3420/83, (EEG) nr. 288/82 en (EEG)
    nr. 1765/82, afschaffing of schorsing van de kwantitatieve beperkingen ten aanzien
    van Albanië, verlenging van de schorsing van bepaalde kwantitatieve beperkingen
    ten aanzien van landen van Midden- en Oost-Europa en vaststelling van de handelsregeling
    bij invoer, van toepassing op de produkten van oorsprong uit de Baltische landen
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3859/91 DO CONSELHO de 23 de Dezembro de 1991 que,
    através da alteração dos Regulamentos (CEE) no 3420/83, (CEE) no 288/82 e (CEE)
    no 1765/82, suprime ou suspende as restrições quantitativas no que se refere
    à Albânia, prorroga a suspensão de certas restrições quantitativas no que
    se refere aos países da Europa Central e Oriental e define o regime comercial
    da importação aplicável aos produtos originários dos Estados bálticos #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3859/91 DEL CONSEJO de 23 de diciembre de 1991 por
    el que, mediante modificación de los Reglamentos (CEE) nos 3420/83, 288/82 y
    1765/82, se liberan o se suspenden las restricciones cuantitativas con respecto
    a Albania; se prorroga la suspensión de determinadas restricciones cuantitativas
    con respecto a los países de Europa central y oriental y se define el régimen
    comercial para la importación aplicable a los productos originarios de los Estados
    bálticos #'
  type: main
