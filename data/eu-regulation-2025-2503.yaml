    ina mbéaróga agus a thógtar le haghaidh pórúcháin agus speicis mhucúla
    seachas cránacha de gach speiceas Suidae (sealbhóir an údaraithe: Huvepharma
    EOOD)'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2025/2503 оd 11. prosinca 2025. o odobrenju
