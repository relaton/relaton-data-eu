    EOOD)'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2025/2503, 11. detsember 2025, milles
    käsitletakse loa andmist Trichoderma citrinoviride DSM 33578 abil toodetud endo-1,4-β-ksülanaasi,
    endo-1,4-β-glükanaasi ja ksüloglükaanispetsiifilise endo-β-1,4-glükanaasi
    preparaadi kasutamiseks muude kodulindude kui nuumlindude ning munalindudeks ja
    aretuslindudeks kasvatatavate noorlindude ning muude sigade kui kõikide sigalaste
    liikide emiste söödalisandina (loa hoidja: Huvepharma EOOD)'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2025/2503, annettu 11 päivänä
    joulukuuta 2025, Trichoderma citrinoviride DSM 33578 -mikro-organismin avulla
    tuotettua endo-1,4-beeta-ksylanaasia, endo-1,4-beeta-glukanaasia ja ksyloglukaanille
    spesifistä endo-beeta-1,4-glukanaasia sisältävän valmisteen hyväksymisestä
    siipikarjan, lukuun ottamatta lihasiipikarjaa ja munantuotantoa varten tai siitoseläimiksi
    kasvatettavaa siipikarjaa, sekä sikaeläinten, lukuun ottamatta kaikkien heimoon
    Suidae kuuluvien lajien emakkoja, rehun lisäaineena (hyväksynnän haltija: Huvepharma
    EOOD)'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2025/2503 ón gCoimisiún an 11 Nollaig
