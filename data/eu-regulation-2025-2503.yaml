    endo-1,4-béta-glükanázt és xiloglükán-specifikus endo-béta-1,4-glükanázt
    tartalmazó készítménynek a hízóbaromfitól és a tojástermelés és tenyésztés
    céljából nevelt baromfitól eltérő baromfik, valamint a disznófélék (Suidae)
    valamennyi fajához tartozó kocáktól eltérő sertésfélék takarmány-adalékanyagaként
    történő engedélyezéséről (az engedély jogosultja: Huvepharma EOOD)'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2025/2503 della Commissione, dell’11
    dicembre 2025, relativo all’autorizzazione di un preparato di endo-1,4-beta-xilanasi,
    endo-1,4-beta-glucanasi ed endo-1,4-beta-glucanasi specifica per xiloglucano prodotte
    con Trichoderma citrinoviride DSM 33578 come additivo per mangimi destinati a
