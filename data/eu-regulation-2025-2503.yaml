    specifične za ksiloglukan dobivenih od Trichoderma citrinoviride DSM 33578 kao
    dodatka hrani za životinje za perad osim peradi za tov, peradi uzgajane za nesenje
    i za rasplod i svinje osim krmača svih vrsta iz porodice Suidae (nositelj odobrenja:
    Huvepharma EOOD)'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2025/2503 végrehajtási rendelete (2025. december 11.)
