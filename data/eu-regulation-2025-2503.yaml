title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/2503 of 11 December 2025
    concerning the authorisation of a preparation of endo-1,4-beta-xylanase, endo-1,4-beta-glucanase
    and xyloglucan-specific-endo-beta-1,4-glucanase produced with Trichoderma citrinoviride
    DSM 33578 as a feed additive for poultry other than poultry for fattening, poultry
    reared for laying and reared for breeding and porcine species other than sows
    of all Suidae species (holder of authorisation: Huvepharma EOOD)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/2503 de la Commission du 11 décembre
    2025 concernant l’autorisation d’une préparation d’endo-1,4-bêta-xylanase,
    d’endo-1,4-bêta-glucanase et d’endo-bêta-1,4-glucanase xyloglucane-spécifique
    produites avec Trichoderma citrinoviride DSM 33578 en tant qu’additif pour l’alimentation
    des volailles, excepté les volailles d’engraissement et les volailles élevées
    pour la ponte et élevées pour la reproduction, et des espèces porcines, excepté
    les truies de toutes les espèces de suidés (titulaire de l’autorisation: Huvepharma
    EOOD)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/2503 der Kommission vom 11. Dezember
    2025 zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase, Endo-1,4-beta-Glucanase
    und xyloglucanspezifischer Endo-beta-1,4-Glucanase, hergestellt mit Trichoderma
    citrinoviride DSM 33578, als Zusatzstoff in Futtermitteln für Geflügel ausgenommen
    Mastgeflügel, Jungtiere aller Geflügelarten für Lege- oder Zuchtzwecke und
    Schweine ausgenommen Sauen aller Suidae-Arten (Zulassungsinhaber: Huvepharma EOOD)'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2025/2503 на Комисията
    от 11 декември 2025 година за разрешаване на употребата
    на препарат от ендо-1,4-бета-ксиланаза, ендо-1,4-бета-глюканаза
    и ксилоглюкан-специфична ендо-бета-1,4-глюканаза,
    получени с Trichoderma citrinoviride DSM 33578, като фуражна
    добавка за домашни птици, различни от домашни
    птици за угояване, домашни птици, отглеждани
    за носачки и отглеждани за разплод, и видове
    свине, различни от свине майки от всички видове
    от семейство Suidae (притежател на разрешението:
    Хювефарма ЕООД)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2025/2503 ze dne 11. prosince 2025
    o povolení přípravku z endo-1,4-beta-xylanázy, endo-1,4-beta-glukanázy a
    xyloglukan-specifické endo-beta-1,4-glukanázy z Trichoderma citrinoviride DSM
    33578 jako doplňkové látky pro drůbež jinou než výkrm drůbeže, odchov
    drůbeže a druhy prasat jiné než prasnice všech druhů prasatovitých (Suidae)
    (držitel povolení: Huvepharma EOOD)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2025/2503 af 11. december
