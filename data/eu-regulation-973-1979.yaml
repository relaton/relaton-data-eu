title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 973/79 of 16 May 1979 re-establishing the
    levying of customs duties on dioctyl phthalates, falling within subheading 29.15
    C ex III and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 973/79 de la Commission, du 16 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux orthophtalates de dioctyle,
    de la sous-position 29.15 C ex III du tarif douanier commun, originaires des pays
    en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 973/79 der Kommission vom 16. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Dioctylphthalate der Tarifstelle 29.15 C ex III, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 973/79 af 16. maj 1979 om genindførelse
    af opkrævning af toldafgifter for dioctylphthalater, henhørende under pos. 29.15
    C ex III i den fælles toldtarif, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 973/79 della Commissione, del 16 maggio 1979, che
    ripristina la riscossione dei dazi doganali applicabili agli ortoftalati di diottile,
    della sottovoce 29.15 C ex III della tariffa doganale comune, originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 973/79 van de Commissie van 16 mei 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor dioctylorthoftalaten,
    van post 29.15 C ex III, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties werden
    geopend
  type: main
