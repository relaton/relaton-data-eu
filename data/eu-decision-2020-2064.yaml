    genom Europa–Medelhavsavtalet om upprättande av en associering mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och Arabrepubliken Egypten,
    å andra sidan, vad gäller ändring av det avtalet genom ersättande av protokoll
    4 om definition av begreppet ”ursprungsprodukter” och om metoder för administrativt
