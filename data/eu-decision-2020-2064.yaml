    na eni strani in Arabsko republiko Egipt na drugi strani, glede spremembe navedenega
    sporazuma z nadomestitvijo Protokola 4 k navedenemu sporazumu o opredelitvi pojma
    „izdelki s poreklom“ in načinih upravnega sodelovanja
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2020/2064 del Consejo de 7 de diciembre de 2020 relativa
    a la posición que debe adoptarse en nombre de la Unión Europea en el seno del
    Consejo de Asociación instituido en virtud del Acuerdo Euromediterráneo por
    el que se establece una Asociación entre las Comunidades Europeas y sus Estados
    miembros, por una parte, y la República Árabe de Egipto, por otra, con respecto
    a la modificación de dicho Acuerdo mediante la sustitución de su Protocolo n.o
    4 relativo a la definición del concepto de «productos originarios» y a los
