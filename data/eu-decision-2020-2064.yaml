title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/2064 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the Association Council established
    by the Euro-Mediterranean Agreement establishing an association between the European
    Communities and their Member States, of the one part, and the Arab Republic of
    Egypt, of the other part, as regards the amendment of that Agreement by replacing
    Protocol 4 thereto concerning the definition of the concept of ‘originating
    products’ and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/2064 du Conseil du 7 décembre 2020 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    les Communautés européennes et leurs États membres, d’une part, et la République
    arabe d’Égypte, d’autre part, en ce qui concerne la modification dudit accord
    par le remplacement de son protocole no 4 relatif à la définition de la notion
    de «produits originaires» et aux méthodes de coopération administrative
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/2064 des Rates vom 7. Dezember 2020 über den Standpunkt,
