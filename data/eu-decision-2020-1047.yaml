    výrobky pozostávajúce z dusíka získaného in situ (Iba portugalské znenie
    je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/1047 z dne 15. julija 2020 o dovolitvi
