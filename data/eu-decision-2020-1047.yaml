title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1047 of 15 July 2020 allowing
    Portugal to authorise biocidal products consisting of in situ generated nitrogen
    for the protection of cultural heritage (Only the Portuguese text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1047 de la Commission du 15 juillet
    2020 permettant au Portugal d’autoriser les produits biocides constitués d’azote
    généré in situ pour la protection du patrimoine culturel (Le texte en langue
    portugaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1047 der Kommission vom 15. Juli 2020
    über die Ermächtigung Portugals, zum Schutz des kulturellen Erbes Biozidprodukte
    mit in situ hergestelltem Stickstoff zuzulassen (Nur der portugiesische Text ist
    verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/1047 на Комисията
    от 15 юли 2020 година за предоставяне на възможност
    на Португалия да разреши употребата на биоциди,
    съставени от генериран на място азот, за опазването
    на културното наследство (само текстът на португалски
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/1047 ze dne 15. července 2020,
    kterým se Portugalsku v zájmu ochrany kulturního dědictví umožňuje povolit
    biocidní přípravky sestávající z dusíku připravovaného na místě (Pouze
    portugalské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/1047 af 15. juli 2020
    om tilladelse til, at Portugal godkender biocidholdige produkter, der består
    af in situ-genereret nitrogen, til beskyttelse af kulturarv (Kun den portugisiske
    udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/1047 της Επιτροπής
    της 15ης Ιουλίου 2020 με την οποία επιτρέπεται
    στην Πορτογαλία να χορηγήσει άδεια σε βιοκτόνα
    που αποτελούνται από επιτόπου παραχθέν άζωτο
    για την προστασία της πολιτιστικής κληρονομιάς
    (Το κείμενο στην πορτογαλική γλώσσα είναι το
    μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/1047, 15. juuli 2020, millega võimaldatakse
    Portugalil anda luba kasutada kultuuripärandi kaitseks kohapeal toodetud lämmastikku
    sisaldavaid biotsiide (ainult portugalikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/1047, annettu 15 päivänä
    heinäkuuta 2020, paikalla tuotetusta typestä koostuvia biosidivalmisteita koskevan
