id: EURegulation1022013
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 102/2013 of 4 February 2013
    amending Regulation (EU) No 206/2010 as regards the entry for the United States
    in the list of third countries, territories or parts thereof authorised for the
    introduction of live ungulates into the Union, the model veterinary certificate
    ‘POR-X’ and the protocols for testing for vesicular stomatitis
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 102/2013 de la Commission du 4 février
    2013 modifiant le règlement (UE) n ° 206/2010 de la Commission en ce qui concerne
    la ligne relative aux États-Unis sur la liste des pays tiers, territoires ou
    parties de pays tiers ou territoires en provenance desquels l’introduction dans
    l’Union européenne d’ongulés vivants est autorisée, le modèle de certificat
    vétérinaire «POR-X» et les protocoles applicables au dépistage de la stomatite
    vésiculeuse
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 102/2013 der Kommission vom 4. Februar
    2013 zur Änderung der Verordnung (EU) Nr. 206/2010 hinsichtlich des Eintrags
    zu den Vereinigten Staaten in der Liste der Drittländer, Gebiete und Teile davon,
    aus denen das Verbringen lebender Huftiere in die Europäische Union zulässig
    ist, hinsichtlich der Musterveterinärbescheinigung „POR-X“ und hinsichtlich
    der Testprotokolle für vesikuläre Stomatitis
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 102/2013 на Комисията
    от 4 февруари 2013 година за изменение на Регламент
    (ЕС) № 206/2010 по отношение на вписването за Съединените
    щати в списъка на третите страни, територии
    и части от тях, от които е разрешено въвеждането
    на живи копитни животни в Съюза, образеца на
    ветеринарен сертификат „POR-X“ и протоколите
    за извършване на изследвания за везикулозен
    стоматит
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 102/2013 ze dne 4. února 2013
    , kterým se mění nařízení (EU) č. 206/2010, pokud jde o položku týkající
    se Spojených států v seznamu třetích zemí, území nebo jejich částí,
    z nichž je povolen vstup živých kopytníků na území Evropské unie, veterinární
    osvědčení podle vzoru „POR-X“ a protokoly pro vyšetřovací metody na
    vezikulární stomatitidu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 102/2013 af 4. februar
    2013 om ændring af forordning (EU) nr. 206/2010 for så vidt angår oplysningerne
    vedrørende USA på listen over tredjelande, tredjelandsområder og dele heraf,
    som er godkendt med hensyn til indførsel af levende hovdyr til Unionen, standardveterinærcertifikatet
    »POR-X« og testprotokollerne for vesikulær stomatitis
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 102/2013
    της Επιτροπής, της 4ης Φεβρουαρίου 2013 , για την
    τροποποίηση του κανονισμού (ΕΕ) αριθ. 206/2010 όσον
    αφορά την καταχώριση των Ηνωμένων Πολιτειών
    στον κατάλογο τρίτων χωρών, περιοχών ή τμημάτων
    τους από τα οποία επιτρέπεται η εισαγωγή ζώντων
    οπληφόρων στην Ένωση, το υπόδειγμα κτηνιατρικού
    πιστοποιητικού «POR-X» και τα πρωτόκολλα για
    τις δοκιμές φυσαλιδώδους στοματίτιδας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 102/2013, 4. veebruar 2013 , millega
    muudetakse määrust (EL) nr 206/2010 seoses Ameerika Ühendriike käsitleva kandega
    nende kolmandate riikide, territooriumide või nende osade loetelus, kust on lubatud
    Euroopa Liitu tuua elusaid kabiloomi, ning muudetakse veterinaarsertifikaadi „POR-X”
    näidist ja vesikulaarse stomatiidi kontrolliprotokolle
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 102/2013, annettu 4 päivänä
    helmikuuta 2013 , asetuksen (EU) N:o 206/2010 muuttamisesta siltä osin kuin on
    kyse Yhdysvaltoja koskevasta merkinnästä sellaisten kolmansien maiden ja alueiden
    tai niiden osien luettelossa, joista on sallittua tuoda unionin alueelle eläviä
    sorkka- ja kavioeläimiä, eläinlääkärintodistuksesta POR-X ja vesicular stomatitis
    -taudin testausmenettelyistä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 102/2013 od 4. veljače 2013. o izmjeni
    Uredbe (EU) br. 206/2010 s obzirom na unos za Sjedinjene Države na popisu trećih
    zemalja, državnih područja ili njihovih dijelova odobrenih za uvoz živih papkara
    u Uniju, obrazac veterinarskog certifikata „POR-X” te protokole za testiranje
    na vezikularni stomatitis
  type: main
- language: hu
  script: Latn
  content: A Bizottság 102/2013/EU végrehajtási rendelete ( 2013. február 4. )
    a 206/2010/EU rendeletnek az Egyesült Államoknak az élő patás állatok az
    Unióba való behozatalára engedéllyel rendelkező harmadik országok, e harmadik
    országok területei vagy területeinek részei jegyzékébe történő felvétele,
    a „POR-X” állat-egészségügyi bizonyítványminta és a hólyagos szájgyulladás
    vizsgálati módszerei tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 102/2013 della Commissione, del 4 febbraio
    2013 , recante modifica del regolamento (UE) n. 206/2010 per quanto riguarda la
    voce relativa agli Stati Uniti nell’elenco di paesi terzi, territori o loro
    parti autorizzati a introdurre ungulati vivi nell’Unione, il modello di certificato
    veterinario «POR-X» e i protocolli per le prove della stomatite vescicolosa
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 102/2013 ( 2013. gada 4. februāris
    ), ar ko groza Regulu (ES) Nr. 206/2010 attiecībā uz ierakstu par Amerikas Savienotajām
    Valstīm to trešo valstu, to teritoriju vai daļu sarakstā, no kurām Savienībā
    atļauts ievest dzīvus nagaiņus, attiecībā uz veterinārā sertifikāta “POR-X”
    paraugu un pārbaudes procedūru protokoliem vezikulārā stomatīta noteikšanai
  type: main
- language: lt
  script: Latn
  content: 2013 m. vasario 4 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 102/2013,
    kuriuo dėl Jungtinių Valstijų įrašo trečiųjų šalių, teritorijų arba
    jų dalių, iš kurių į Sąjungą leidžiama įvežti gyvus kanopinius, sąraše,
    dėl veterinarijos sertifikato pavyzdžio POR-X ir vezikulinio stomatito tyrimų
    protokolų iš dalies keičiamas Reglamentas (ES) Nr. 206/2010
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 102/2013 tal-
    4 ta’ Frar 2013 li jemenda r-Regolament (UE) Nru 206/2010 fir-rigward tal-annotazzjoni
    għall-Istati Uniti fil-lista ta’ pajjiżi terzi, territorji jew partijiet minnhom
    awtorizzati għall-introduzzjoni ta’ annimali ungulati ħajjin fl-Unjoni, il-mudell
    taċ-ċertifikat veterinarju “POR-X” u l-protokolli għall-ittestjar għall-istomatite
    vesikulari
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 102/2013 van de Commissie van 4 februari
    2013 tot wijziging van Verordening (EU) nr. 206/2010 wat betreft de vermelding
    van de Verenigde Staten in de lijst van derde landen en gebieden, of delen daarvan,
    waaruit levende hoefdieren in de Europese Unie mogen worden binnengebracht, het
    model van het veterinaire certificaat „POR-X” en de protocollen voor het testen
    op vesiculaire stomatitis
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 102/2013 z dnia 4 lutego 2013
    r. zmieniające rozporządzenie (UE) nr 206/2010 w odniesieniu do wpisu dotyczącego
    Stanów Zjednoczonych w wykazie krajów trzecich, ich terytoriów lub części,
    upoważnionych do wprowadzania do Unii Europejskiej żywych zwierząt kopytnych,
    świadectwa weterynaryjnego „POR-X” oraz protokołów badań w odniesieniu
    do pęcherzykowego zapalenia jamy ustnej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 102/2013 da Comissão, de 4 de fevereiro
    de 2013 , que altera o Regulamento (UE) n. ° 206/2010 no que diz respeito à
    entrada relativa aos Estados Unidos na lista de países terceiros, territórios
    ou partes destes autorizados para a introdução de ungulados vivos na União,
    o modelo de certificado veterinário «POR-X» e os protocolos relativos aos testes
    de deteção da estomatite vesiculosa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 102/2013 al Comisiei din 4
    februarie 2013 de modificare a Regulamentului (UE) nr. 206/2010 în ceea ce privește
    rubrica privind Statele Unite ale Americii în lista de țări terțe, teritorii
    sau părți ale acestora autorizate să introducă ungulate vii în Uniune, modelul
    de certificat sanitar-veterinar „POR-X” și protocoalele de testare pentru
    depistarea stomatitei veziculoase
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 102/2013 zo 4. februára 2013
    , ktorým sa mení a dopĺňa nariadenie (EÚ) č. 206/2010, pokiaľ ide o zaradenie
    Spojených štátov do zoznamu tretích krajín, území alebo ich častí, z
    ktorých sa povoľuje vstup živých kopytníkov do Únie, vzor veterinárneho
    osvedčenia „POR-X“ a protokoly na testovanie vezikulárnej stomatitídy
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 102/2013 z dne 4. februarja 2013 o
    spremembi Uredbe (EU) št. 206/2010 glede vnosa za Združene države na seznam
    tretjih držav, njihovih ozemelj ali delov, iz katerih se odobri vnos živih kopitarjev
    v Unijo, glede vzorca veterinarskega spričevala „POR-X“ in protokolov testiranja
    za prisotnost vezikularnega stomatitisa
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 102/2013 de la Comisión, de 4 de febrero
    de 2013 , que modifica el Reglamento (UE) n ° 206/2010 en lo relativo a la entrada
    correspondiente a los Estados Unidos en la lista de terceros países, territorios
    o bien partes de terceros países o territorios autorizados a introducir en la
    Unión ungulados vivos, el modelo de certificado veterinario «POR-X» y los protocolos
    para la realización de pruebas de la estomatitis vesicular
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 102/2013 av den 4 februari
    2013 om ändring av förordning (EU) nr 206/2010 vad gäller posten för Förenta
    staterna i förteckningen över tredjeländer, områden eller delar därav från
    vilka det är tillåtet att föra in levande hov- och klövdjur till unionen,
    förlagan till veterinärintyg ”POR-X” och protokollen för testning för
    vesikulär stomatit
