  content: Commission Regulation (EEC) No 2650/79 of 29 November 1979 amending Regulations
    (EEC) No 2226/78 and (EEC) No 1352/79 as regards the products of the beef and
    veal sector which may be brought into intervention in the Federal Republic of
    Germany and their coefficients
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2650/79 de la Commission, du 29 novembre 1979, modifiant
    les règlements (CEE) n° 2226/78 et (CEE) n° 1352/79 en ce qui concerne les
    produits pouvant faire l'objet d'achats à l'intervention en République fédérale
    d'Allemagne, ainsi que leurs coefficients dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2650/79 der Kommission vom 29. November 1979 zur Änderung
    der Verordnungen (EWG) Nr. 2226/78 und (EWG) Nr. 1352/79 hinsichtlich der Erzeugnisse
    des Rindfleischsektors, die Gegenstand von Interventionskäufen in der Bundesrepublik
    Deutschland sein können, sowie ihrer Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2650/79 af 29. november 1979 om ændring
    af forordning (EØF) nr. 2226/78 og forordning (EØF) nr. 1352/79 for så vidt
    angår de produkter, der kan opkøbes ved intervention i Forbundsrepublikken Tyskland,
    samt koefficienterne for disse i oksekødsektoren
  type: main
- language: el
  script: Grek
