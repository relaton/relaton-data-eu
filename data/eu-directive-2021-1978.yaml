---
id: EUDirective20211978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2021/1978 of 11 August 2021 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of bis(2-ethylhexyl) phthalate (DEHP), butyl benzyl phthalate
    (BBP), dibutyl phthalate (DBP) and diisobutyl phthalate (DIBP) in spare parts
    recovered from and used for the repair or refurbishment of medical devices
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2021/1978 de la Commission du 11 août 2021
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    IV de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative à l’utilisation du phtalate de bis(2-éthylhexyle) (DEHP),
    du phtalate de benzylbutyle (BBP), du phtalate de dibutyle (DBP) et du phtalate
    de diisobutyle (DIBP) dans des pièces détachées récupérées sur des dispositifs
    médicaux et utilisées pour la réparation ou la remise à neuf de ces dispositifs
    médicaux
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2021/1978 der Kommission vom 11. August 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Diethylhexylphthalat
    (DEHP), Benzylbutylphthalat (BBP), Dibutylphthalat (DBP) und Diisobutylphthalat
    (DIBP) in aus medizinischen Geräten ausgebauten und für die Reparatur und Wiederinstandsetzung
    medizinischer Geräte verwendeten Ersatzteilen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2021/1978 на Комисията
    от 11 август 2021 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение IV към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаване
    от ограничението за употребата на бис(2-етилхексилов)
    фталат (DEHP), бензилбутилов фталат (BBP), дибутилов
    фталат (DBP) и диизобутилов фталат (DIBP) в резервни
    части, възстановени от и използвани за ремонт
    или обновяване на медицински изделия
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2021/1978 ze dne 11. srpna
    2021, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití bis(2-ethylhexyl)-ftalátu (DEHP), butylbenzylftalátu
    (BBP), dibutylftalátu (DBP) a diisobutylftalátu (DIBP) v náhradních dílech
    získaných ze zdravotnických prostředků a používaných k jejich opravě
    či renovaci
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2021/1978 af 11. august 2021 om
    tilpasning til den videnskabelige og tekniske udvikling af bilag IV til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for brugen af
    di(2-ethylhexyl)phthalat (DEHP), butylbenzylphthalat (BBP), dibutylphthalat (DBP)
    og diisobutylphthalat (DIBP) i reservedele genvundet fra og anvendt til reparation
    eller fornyelse af medicinsk udstyr
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2021/1978 της
    Επιτροπής της 11ης Αυγούστου 2021 για την τροποποίηση,
    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση του φθαλικού δις(2-αιθυλεξυλίου) (DEHP),
    του φθαλικού βενζυλίου βουτυλίου (BBP), του φθαλικού
    διβουτυλίου (DBP) και του φθαλικού διισοβουτυλίου
    (DIBP) σε ανταλλακτικά που ανακτώνται από ιατροτεχνολογικά
    προϊόντα και χρησιμοποιούνται για την επισκευή
    ή την ανακαίνιση αυτών
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2021/1978, 11. august 2021, millega
    muudetakse teaduse ja tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi
    ja nõukogu direktiivi 2011/65/EL IV lisa seoses erandiga, mis hõlmab bis(2-etüülheksüül)ftalaadi
    (DEHP), butüülbensüülftalaadi (BBP), dibutüülftalaadi (DBP) ja diisobutüülftalaadi
    (DIBP) kasutamist varuosades, mis on kogutud meditsiiniseadmetest ja mida kasutatakse
    meditsiiniseadmete remondiks või taastamiseks
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2021/1978, annettu 11 päivänä elokuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    poikkeuksen myöntämisestä bis(2-etyyliheksyyli)ftalaatin (DEHP), butyylibentsyyliftalaatin
    (BBP), dibutyyliftalaatin (DBP) ja di-isobutyyliftalaatin (DIBP) käytölle lääkinnällisistä
    laitteista talteen otetuissa ja lääkinnällisten laitteiden korjaamiseen tai
    kunnostamiseen käytettävissä varaosissa
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2021/1978 ón gCoimisiún an 11 Lúnasa 2021 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn teicniúil agus eolaíoch,
    Iarscríbhinn IV a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine i leith úsáid bios(2-eitilheicsil)taláite
    (DEHP), taláite beinsile búitile (BBP), taláite débhúitile (DBP) agus taláite
    dé-iseabúitile (DIBP) i bpáirteanna spártha a aisghabhtar ó fheistí leighis
    agus a úsáidtear chun feistí leighis a dheisiú nó a athchóiriú
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/1978 оd 11. kolovoza 2021. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu di(2-etilheksil)
    ftalata (DEHP), benzil butil ftalata (BBP), dibutil ftalata (DBP) i diizobutil
    ftalata (DIBP) u rezervnim dijelovima koji su oporabljeni iz medicinskih proizvoda
    i upotrebljavaju se za njihov popravak ili obnovu
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1978 felhatalmazáson alapuló irányelve (2021.
    augusztus 11.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítása céljából,
    a bisz(2-etilhexil)-ftalát (DEHP), a benzil-butil-ftalát (BBP), a dibutil-ftalát
    (DBP) és a diizobutil-ftalát (DIBP) orvostechnikai eszközökből származó
    és az ilyen eszközök javítására vagy felújítására felhasználandó cserealkatrészekben
    való használatára vonatkozó mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2021/1978 della Commissione dell'11 agosto 2021
    che modifica, adattandolo al progresso scientifico e tecnico, l'allegato IV della
    direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l'esenzione relativa all'uso di bis(2-etilesil) ftalato (DEHP), butil benzil ftalato
    (BBP), dibutil ftalato (DBP) e diisobutil ftalato (DIBP) nei pezzi di ricambio
    recuperati da e utilizzati per la riparazione o il rinnovo di dispositivi medici
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2021/1978 (2021. gada 11. augusts),
    ar ko attiecībā uz atbrīvojumu, kurš atļautu bis(2-etilheksil)ftalātu (DEHP),
    butilbenzilftalātu (BBP), dibutilftalātu (DBP) un diizobutilftalātu (DIBP)
    izmantot rezerves daļās, kas atgūtas no medicīniskām ierīcēm un izmantotas
    to remontam vai pārjaunošanai, groza Eiropas Parlamenta un Padomes Direktīvas
    2011/65/ES IV pielikumu, to pielāgojot zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2021/1978 2021 m. rugpjūčio 11 d.
    kuria, derinant prie mokslo ir technikos pažangos, dėl išimties, kuria bis(2-etilheksil)ftalatą,
    butilbenzilftalatą (BBP), dibutilftalatą (DBP) ir diizobutilftalatą (DIBP)
    leidžiama naudoti iš medicinos priemonių regeneruotose ir medicinos priemonėms
    remontuoti arba atnaujinti skirtose atsarginėse dalyse, iš dalies keičiamas
    Europos Parlamento ir Tarybos direktyvos 2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2021/1978 tal-11 ta’ Awwissu
    2021 li temenda, għall-finijiet ta’ adattament għall-progress xjentifiku u
    tekniku, l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-eżenzjoni għall-użu tal-ftalat tal-bis(2-etileżil) (DEHP),
    butilbenżilftalat (BBP), id-dibutilftalat (DBP) u d-diisobutilftalat (DIBP) fi
    spare parts irkuprati minn u użati għat-tiswija jew għar-rinnovazzjoni ta’
    apparat mediku
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2021/1978 van de Commissie van 11 augustus
    2021 tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van bis(2-ethylhexyl)ftalaat
    (DEHP), butylbenzylftalaat (BBP), dibutylftalaat (DBP) en diisobutylftalaat (DIBP)
    in reserveonderdelen die zijn herwonnen uit en worden gebruikt voor de reparatie
    of de vernieuwing van medische hulpmiddelen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2021/1978 z dnia 11 sierpnia 2021 r.
    zmieniająca, w celu dostosowania do postępu naukowo-technicznego, załącznik
    IV do dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    dotyczącego stosowania ftalanu di-2-etyloheksylu (DEHP), ftalanu benzylu-butylu
    (BBP), ftalanu dibutylu (DBP) i ftalanu diizobutylu (DIBP) w częściach zamiennych
    odzyskanych z wyrobów medycznych i wykorzystywanych do naprawy lub regeneracji
    takich wyrobów
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2021/1978 da Comissão de 11 de agosto de 2021 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante a
    uma isenção relativa à utilização de ftalato de bis(2-etil-hexilo) (DEHP),
    ftalato de benzilo e butilo (BBP), ftalato de dibutilo (DBP) e ftalato de di-isobutilo
    (DIBP) em peças sobresselentes recuperadas de dispositivos médicos e utilizadas
    para a reparação ou renovação desses dispositivos
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2021/1978 a Comisiei din 11 august 2021 de modificare,
    în scopul adaptării la progresele științifice și tehnice, a anexei IV la
    Directiva 2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește
    o derogare pentru utilizarea ftalatului de bis(2-etilhexil) (DEHP), a ftalatului
    de butil benzil (BBP), a ftalatului de dibutil (DBP) și a ftalatului de diizobutil
    (DIBP) în piesele de schimb recuperate din și utilizate pentru repararea sau
    recondiționarea dispozitivelor medicale
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2021/1978 z 11. augusta 2021, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    IV k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    z používania bis(2-etylhexyl)-ftalátu (DEHP), benzyl-butyl-ftalátu (BBP),
    dibutyl-ftalátu (DBP) a diizobutyl-ftalátu (DIBP) v náhradných dieloch získaných
    zo zdravotníckych pomôcok a používaných na ich opravu alebo modernizáciu
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/1978 z dne 11. avgusta 2021 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo bis(2-etilheksil) ftalata (DEHP), benzil butil ftalata (BBP), dibutil
    ftalata (DBP) in diizobutil ftalata (DIBP) v rezervnih delih, pridobljenih iz
    medicinskih pripomočkov in uporabljenih za popravilo ali obnovo medicinskih pripomočkov
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2021/1978 de la Comisión de 11 de agosto de 2021
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo, por
    lo que respecta a una exención relativa al uso del ftalato de bis(2-etilhexilo)
    (DEHP), del ftalato de bencilo y butilo (BBP), del ftalato de dibutilo (DBP) y
    del ftalato de diisobutilo (DIBP) en piezas de repuesto recuperadas de productos
    sanitarios y utilizadas para la reparación o reacondicionamiento de tales productos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2021/1978 av den 11 augusti 2021
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga IV till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av bis(2-etylhexyl)ftalat (DEHP), butylbensylftalat
    (BBP), dibutylftalat (DBP) och diisobutylftalat (DIBP) i reservdelar som återvunnits
    från och används för reparation eller renovering av medicintekniska produkter
  type: main
