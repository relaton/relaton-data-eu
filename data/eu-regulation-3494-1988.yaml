    of monetary compensatory amounts, (EEC) No 548/86 laying down detailed rules for
    the application of accession compensatory amounts and (EEC) No 3665/87 laying
    down common detailed rules for the application of the system of export refunds
    on agricultural products
  type: main
- language: fr
  script: Latn
