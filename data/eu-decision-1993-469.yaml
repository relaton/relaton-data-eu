    92/461/EEC, 92/462/EEC and 92/463/EEC, concerning animal health conditions and
    veterinary certificates for the import of domestic animals of the bovine and porcine
    species from Hungary, Poland, Czechoslovakia, Bulgaria, Norway, Romania, Switzerland,
    Sweden, Finland and Iceland'
