title:
- language: en
  script: Latn
  content: Council Regulation (EC, Euratom) No 257/2005 of 4 February 2005 laying
    down the weightings applicable from 1 July 2004 to the remuneration of officials,
    contract staff and temporary staff of the European Communities serving in third
    countries and of certain officials remaining in post in the 10 new Member States
    for a maximum period of 15 months after accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CE, Euratom) n° 257/2005 du Conseil du 4 février 2005 portant
    fixation des coefficients correcteurs applicables à partir du 1er juillet 2004
    aux rémunérations des fonctionnaires, agents contractuels et agents temporaires
    des Communautés européennes affectés dans les pays tiers, ainsi qu’à une
    partie des fonctionnaires restant en poste dans les dix nouveaux États membres
    pendant une période maximale de quinze mois suivant l’adhésion
  type: main
