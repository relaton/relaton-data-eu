title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2367/82 of 30 August 1982 re-establishing
    the levying of customs duties on mattress supports ; articles of bedding or similar,
    falling within heading No 94.04 and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2367/82 de la Commission, du 30 août 1982, portant
    rétablissement de la perception des droits de douane applicables aux sommiers,
    articles de literie et similaires de la position 94.04 du tarif douanier commun,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3601/81 du Conseilr
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2367/82 der Kommission vom 30. August 1982 zur Wiedereinführung
    der Erhebung der Zölle für Sprungrahmen, Bettausstattungen und ähnliche Waren
    der Tarifnummer 94.04, mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2367/82 af 30. august 1982 om genindførelse
    af opkrævning af told for sengebunde; sengeudstyr o. lign., henhørende under
    pos. 94.04 og med oprindelse i Kina, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2367/82 τής Επιτροπής
    τής 30ής Αυγούστου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά υπόβαθρα στρωμάτων
    (σομιέδες), είδη κλινοστρωμνής καί τά παρόμοια,
    τής κλάσεως 94. 04 τού Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου τών προβλεπομένων από τόν
    κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2367/82 della Commissione, del 30 agosto 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai sommier, oggetti letterecci
    e simili, della voce 94.04 della tariffa doganale comune, originari della Cina
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2367/82 van de Commissie van 30 augustus 1982 houdende
