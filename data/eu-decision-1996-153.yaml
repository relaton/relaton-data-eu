title:
- language: en
  script: Latn
  content: '96/153/EC: Commission Decision of 9 February 1996 authorizing Member States
    temporarily to take additional measures against the dissemination of Thrips palmi
    Karny as regards the Netherlands'
  type: main
- language: fr
  script: Latn
  content: '96/153/CE: Décision de la Commission, du 9 février 1996, autorisant
    les États membres à prendre provisoirement des mesures supplémentaires en vue
    de se protéger contre la propagation de Thrips palmi Karny en provenance des
    Pays-Bas'
  type: main
- language: de
  script: Latn
  content: '96/153/EG: Entscheidung der Kommission vom 9. Februar 1996 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend zusätzliche Maßnahmen gegen die Verbreitung
    von Thrips palmi Karny hinsichtlich der Niederlande zu treffen'
  type: main
- language: da
  script: Latn
  content: '96/153/EF: Kommissionens beslutning af 9. februar 1996 om bemyndigelse
    af medlemsstaterne til midlertidigt at træffe supplerende foranstaltninger mod
    spredning af Thrips palmi Karny, for så vidt angår Nederlandene'
  type: main
- language: el
  script: Grek
  content: '96/153/ΕΚ: Απόφαση της Επιτροπής, της 9ης Φεβρουαρίου
    1996, η οποία επιτρέπει προσωρινά στα κράτη μέλη
    να λάβουν πρόσθετα μέτρα κατά της εξάπλωσης
    της Thrips palmi Karny όσον αφορά το Βασίλειο των Κάτω
    Χωρών'
  type: main
- language: fi
  script: Latn
  content: '96/153/EY: Komission päätös, tehty 9 päivänä helmikuuta 1996, luvan
    antamisesta jäsenvaltioille toteuttaa väliaikaisesti lisätoimenpiteitä Thrips
    palmi Karny -kasvintuhoojan leviämisen estämiseksi Alankomaiden kuningaskunnan
    osalta'
  type: main
- language: it
  script: Latn
  content: '96/153/CE: Decisione della Commissione, del 9 febbraio 1996, che autorizza
    gli Stati membri ad adottare, a titolo provvisorio, misure supplementari contro
    la propagazione del Thrips palmi Karny relativamente ai Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '96/153/EG: Beschikking van de Commissie van 9 februari 1996 tot machtiging
    van de Lid-Staten om ten aanzien van Nederland tijdelijk aanvullende maatregelen
    te nemen tegen de verspreiding van Thrips palmi Karny'
  type: main
- language: pt
  script: Latn
  content: '96/153/CE: Decisão da Comissão, de 9 de Fevereiro de 1996, que autoriza
    os Estados-membros a adoptar temporariamente medidas adicionais contra a propagação
    de Thrips palmi Karny no que diz respeito aos Países Baixos'
  type: main
- language: es
  script: Latn
  content: '96/153/CE: Decisión de la Comisión, de 9 de febrero de 1996, por la
    que se autoriza temporalmente a los Estados miembros para adoptar, en lo que respecta
    a los Países Bajos, medidas adicionales contra la propagación de Thrips palmi
    Karny'
  type: main
- language: sv
  script: Latn
  content: '96/153/EG: Kommissionens beslut av den 9 februari 1996 om tillfälligt
    tillstånd för medlemsstaterna att vidta tilläggsåtgärder för att förhindra
    spridning av Thrips palmi Karny beträffande Nederländerna'
  type: main
