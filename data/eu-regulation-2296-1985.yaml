title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2296/85 of 9 August 1985 re-establishing
    the levying of customs duties on chromium oxides and hydroxides falling within
    heading No 28.21 and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2296/85 de la Commission du 9 août 1985 portant rétablissement
    de la perception des droits de douane applicables aux oxydes et hydroxydes de
    chrome, de la position 28.21 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2296/85 der Kommission vom 9. August 1985 zur Wiedereinführung
    der Erhebung der Zölle für Chromoxide und -hydroxide der Tarifnummer 28.21 mit
    Ursprung in China, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2296/85 af 9. august 1985 om genindførelse
    af opkrævning af told for oxider og hydroxider af chrom, henhørende under pos.
    28.21 og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2296/85 της Επιτροπής
    της 9ης Αυγούστου 1985 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για οξείδια και υδροξείδια
    του χρωμίου της δασμολογικής κλάσης 28.21, καταγωγής
    Κίνας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2296/85 della Commissione del 9 agosto 1985 che ripristina
    la riscossione dei dazi doganali applicabili agli ossidi e idrossidi di cromo
    della voce 28.21 della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2296/85 van de Commissie van 9 augustus 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op chroomoxyden
    en chroomhydroxyden van tariefpost 28.21, van oorsprong uit China, waarvoor de
    in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties zijn
    verleend
