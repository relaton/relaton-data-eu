    zur Ermittlung des Einfuhrpreises für bestimmte Fischereierzeugnisse zugrunde
    gelegten repräsentativen Märkte und Häfen der neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2464/72 af 24. november 1972 om ændring
