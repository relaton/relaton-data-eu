title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 439/95 of 28 February 1995 amending and derogating
    from Regulation (EEC) No 1442/93 laying down detailed rules for the application
    of the arrangements for importing bananas into the Community in respect of import
    licence requests for the second quarter of 1995
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 439/95 de la Commission, du 28 février 1995, modifiant
    le règlement (CEE) n° 1442/93 portant modalités d'application du régime d'importation
    de bananes dans la Communauté et dérogeant audit règlement en ce qui concerne
    les demandes de certificat pour le deuxième trimestre de 1995
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 439/95 der Kommission vom 28. Februar 1995 zur Änderung
    und Abweichung von der Verordnung (EWG) Nr. 1442/93 mit Durchführungsbestimmungen
    zu der Einfuhrregelung für Bananen hinsichtlich der Anträge auf Erteilung von
    Lizenzen für das zweite Vierteljahr 1995
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 439/95 af 28. februar 1995 om ændring
    og fravigelse af forordning (EØF) nr. 1442/93 om gennemførelsesbestemmelser
    for EF's importordning for bananer, for så vidt angår ansøgninger om licenser
    for andet kvartal 1995
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 439/95 της Επιτροπής
    της 28ης Φεβρουαρίου 1995 για τροποποίηση και
    παρέκκλιση από τον κανονισμό (ΕΟΚ) αριθ. 1442/93
    περί λεπτομερών κανόνων εφαρμογής του καθεστώτος
    εισαγωγής μπανανών στην Κοινότητα όσον αφορά
    τα πιστοποιητικά εισαγωγής για το δεύτερο
    τρίμηνο του 1995
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 439/95, annettu 28 päivänä helmikuuta 1995,
    banaanien yhteisöön tuontimenettelyn soveltamista koskevista yksityiskohtaisista
    säännöistä annetun asetuksen (ETY) N:o 1442/93 muuttamisesta ja mainitusta
    asetuksesta poikkeamisesta vuoden 1995 toiseksi vuosineljännekseksi jätettäviä
    tuontilisenssihakemuksia varten
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 439/95 della Commissione, del 28 febbraio 1995, recante
    deroga e modifica al regolamento (CEE) n. 1442/93 recante modalità di applicazione
    del regime d'importazione delle banane nella Comunità per quanto riguarda le
    domande di certificati per il secondo trimestre del 1995
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 439/95 van de Commissie van 28 februari 1995 houdende
    wijziging en afwijking van Verordening (EEG) nr. 1442/93 houdende bepalingen ter
    toepassing van de regeling voor de invoer van bananen in de Gemeenschap voor wat
    de invoercertificaataanvragen voor het tweede kwartaal van 1995 betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 439/95 da Comissão, de 28 de Fevereiro de 1995, que
    altera e estabelece uma derrogação ao Regulamento (CEE) nº 1442/93 que estabelece
    normas de execução do regime de importação de bananas na Comunidade, no que
    se refere aos pedidos de certificados para o segundo trimestre de 1995
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 439/95 de la Comisión, de 28 de febrero de 1995, por
