title:
- language: en
  script: Latn
  content: Commission Decision of 8 September 1976 authorizing the French Republic
    not to apply Community treatment to natural honey falling within heading No 04.06
    of the Common Customs Tariff, originating in Romania and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/838/CEE: Décision de la Commission, du 8 septembre 1976, autorisant
    la République française à exclure du traitement communautaire le miel naturel
    de la position 04.06 du Tarif douanier commun, originaire de Roumanie et mis en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. September 1976, mit der die Französische
    Republik ermächtigt wird, aus Rumänien stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen natürlichen Honig der Tarifnummer 04.06 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 8. september 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage naturlig honning, som henhører
    under pos. 04.06 i den fælles toldtarif, hår oprindelse i Rumænien og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 settembre 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario il miele naturale della voce
    04.06 della tariffa doganale comune, originario della Romania e messo in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 september 1976 waarbij de Franse Republiek
    wordt gemachtigd natuurhonig, van post 04.06 van het gemeenschappelijk douanetarief,
    van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
