  script: Latn
  content: Commission Regulation (EC) No 798/2008 of 8 August 2008 laying down a list
    of third countries, territories, zones or compartments from which poultry and
    poultry products may be imported into and transit through the Community and the
    veterinary certification requirements
  type: main
- language: fr
  script: Latn
