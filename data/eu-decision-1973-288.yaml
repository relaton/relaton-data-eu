type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 August 1973 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's cotton shirts falling within heading No ex 61.03
    of the Common Customs Tariff which originate in Hungary and are put into free
    circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: Décision 73/288/CEE de la Commission, du 17 août 1973, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire certaines catégories de chemises de coton
    pour hommes de la position Ex 61.03 du Tarif douanier commun, originaires de Hongrie
    et mises en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. August 1973, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Ungarn stammende und in der Bundesrepublik Deutschland im freien Verkehr
    befindliche bestimmte Kategorien von Baumwollhemden für Männer der Tarifnummer
    ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. august 1973 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til at udelukke
    visse kategorier af bomuldsherreskjorter, henhørende under position ex 61.03
    i den fælles toldtarif, som har oprindelse i Ungarn og er sat i fri omsætning
    i forbundsrepublikken Tyskland, fra fælleskabsbehandling
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 agosto 1973, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi a escludere
    dal trattamento comunitario talune categorie di camicie di cotone per uomo della
    voce ex 61.03 della tariffa doganale comune, originarie dell'Ungheria e messe
    in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 augustus 1973 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd herenoverhemden van katoen van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hongarije en in de Bondsrepubliek Duitsland in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
