title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3947/88 of 11 December 1988 fixing, for 1989,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of a Member State, other than Spain and Portugal, in
    waters falling under the sovereignty or within the jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3947/88 du Conseil du 11 décembre 1988 fixant, pour
    1989, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon d'un État membre, à l'exception de
    l'Espagne et du Portugal, dans les eaux relevant de la souveraineté ou de la
    juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3947/88 DES RATES vom 11. Dezember 1988 zur Festlegung
