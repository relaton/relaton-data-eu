  content: Commission Regulation (EEC) No 2125/81 of 17 July 1981 determining the
    amounts of the variable components, accession compensatory amounts and additional
    duties applicable from I August to 31 October 1981 on the importation into the
    Community of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2125/81 de la Commission, du 17 juillet 1981, déterminant
    les montants des éléments mobiles et les montants compensatoires «adhésion»,
    ainsi que les droits additionnels applicables pendant la période du 1er août
    au 31 octobre 1981 à l'importation dans la Communauté des marchandises relevant
    du règlement (CEE) n° 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2125/81 der Kommission vom 17. Juli 1981 zur Festsetzung
    der Höhe der vom 1. August bis einschließlich 31. Oktober 1981 bei der Einfuhr
    der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    geltenden beweglichen Teilbeträge, Beitrittsausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2125/81 af 17. juli 1981 om fastsættelse
    af størrelsen af de variable elementer, tiltrædelsesudligningsbeløb og tillægstold
    for indførsel i Fællesskabet af varer henhørende under forordning (EØF) nr.
    3033/80 for perioden fra den 1. august til den 31. oktober 1981
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2125/81 της Επιτροπής
