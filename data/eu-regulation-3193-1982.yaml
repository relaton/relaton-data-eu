id: EURegulation31931982
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3193/82 of 29 November 1982 laying down
    to what extent applications for issue of export licences submitted during November
    1982 for beef and veal products which may benefit from special import treatment
    in a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3193/82 de la Commission, du 29 novembre 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d' exportation déposées au mois de novembre 1982 pour les produits du secteur
    de la viande bovine bénéficiant d' un traitement spécial à l' importation
    dans un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3193/82 der Kommission vom 29. November 1982 über
    das Ausmaß, in dem den im November 1982 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3193/82 af 29. november 1982 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i november
    1982 for oksekødprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3193/82 τής Επιτροπής
    τής 29ης Νοεμβρίου 1982 περί καθορισμού μέχρι
    ποιό βαθμό μπορεί νά δοθεί συνέχεια στίς αιτήσεις
    γιά τήν έκδοση πιστοποιητικών εξαγωγής πού
    υποβλήθηκαν τό Νοέμβριο τού 1982 γιά τά προϊόντα
    τού τομέα τού βοείου κρέατος πού μπορούν νά
    τύχουν ειδικής μεταχειρίσεως κατά τήν εισαγωγή
    σέ τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3193/82 della Commissione, del 29 novembre 1982, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di novembre 1982 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all' importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3193/82 van de Commissie van 29 november 1982 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in november 1982
    ingediende aanvragen om uitvoercertificaten voor produkten van de sector rundvlees
    waarvoor een bijzondere behandeling geldt bij invoer in een derde land
  type: main
