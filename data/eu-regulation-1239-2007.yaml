  script: Latn
  content: Commission Regulation (EC) No 1239/2007 of 23 October 2007 amending for
    the 87th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1239/2007 de la Commission du 23 octobre 2007 modifiant
    pour la quatre-vingt-septième fois le règlement (CE) n° 881/2002 du Conseil
    instituant certaines mesures restrictives spécifiques à l'encontre de certaines
    personnes et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux
    Taliban, et abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
