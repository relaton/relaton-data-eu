    kockázatokra tekintettel a Citrus sinensis Pers. Izraelből származó gyümölcsének
    az Unióba történő behozatalára vonatkozó egyenértékű követelmények
    alkalmazási határideje tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1080 della Commissione, del 2 giugno
    2025, che modifica il regolamento di esecuzione (UE) 2022/1659 della Commissione
    per quanto riguarda il termine di applicazione delle prescrizioni equivalenti
    per l’introduzione nell’Unione di frutti di Citrus sinensis Pers. originari
    di Israele in considerazione dei rischi posti da Thaumatotibia leucotreta
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1080 (2025. gada 2. jūnijs),
    ar ko attiecībā uz laika ierobežojumu līdzvērtīgu prasību piemērošanai
    attiecībā uz Izraēlas izcelsmes Citrus sinensis Pers. augļu ievešanu Savienībā,
