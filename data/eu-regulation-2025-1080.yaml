    omezení použitelnosti rovnocenných požadavků na dovoz plodů Citrus sinensis
    Pers. pocházejících z Izraele do Unie s ohledem na rizika, která představuje
    Thaumatotibia leucotreta
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/1080 af 2. juni 2025
