    obmedzenie uplatňovania rovnocenných požiadaviek na uvedenie plodov Citrus
    sinensis Pers. pochádzajúcich z Izraela do Únie vzhľadom na riziká, ktoré
    predstavuje škodca Thaumatotibia leucotreta
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1080 z dne 2. junija 2025 o spremembi
    Izvedbene uredbe (EU) 2022/1659 glede časovne omejitve uporabe enakovrednih zahtev
    za vnos plodov Citrus sinensis Pers. s poreklom iz Izraela v Unijo zaradi tveganja,
    povezanega s škodljivim organizmom Thaumatotibia leucotreta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1080 de la Comisión, de 2 de junio
