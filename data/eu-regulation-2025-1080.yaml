title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1080 of 2 June 2025 amending
    Implementing Regulation (EU) 2022/1659 as regards the time limit of the application
    of equivalent requirements for the introduction into the Union of fruits of Citrus
    sinensis Pers., originating from Israel in view of the risks posed by Thaumatotibia
    leucotreta
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1080 de la Commission du 2 juin 2025
    modifiant le règlement d’exécution (UE) 2022/1659 en ce qui concerne le délai
    d’application des exigences équivalentes pour l’introduction dans l’Union
    de fruits de Citrus sinensis Pers. en provenance d’Israël au vu des risques
    présentés par Thaumatotibia leucotreta
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1080 der Kommission vom 2. Juni 2025
    zur Änderung der Durchführungsverordnung (EU) 2022/1659 im Hinblick auf die
    Frist für die Anwendung gleichwertiger Anforderungen an das Einführen von Früchten
    von Citrus sinensis Pers. mit Ursprung in Israel in die Union angesichts der Risiken
    aufgrund von Thaumatotibia leucotreta
  type: main
- language: bg
  script: Cyrl
