    termenul pentru aplicarea cerințelor echivalente pentru introducerea în Uniune
    a fructelor de Citrus sinensis Pers., originare din Israel, având în vedere
    riscurile prezentate de Thaumatotibia leucotreta
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1080 z 2. júna 2025, ktorým
