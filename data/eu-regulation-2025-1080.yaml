    zahtjeva koji se odnose na unošenje u Uniju plodova Citrus sinensis Pers. podrijetlom
    iz Izraela s obzirom na rizike koje predstavlja organizam Thaumatotibia leucotreta
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1080 végrehajtási rendelete (2025. június 2.)
