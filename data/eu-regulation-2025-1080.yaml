    aos prazos da aplicação dos requisitos equivalentes para a introdução na União
    de frutos de Citrus sinensis Pers. originários de Israel, tendo em conta os riscos
    colocados pela Thaumatotibia leucotreta
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1080 al Comisiei din 2 iunie
