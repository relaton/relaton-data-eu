title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1816/95 of 26 July 1995 laying down certain
    provisions for the implementation of Council Regulation (EC) No 3036/94 establishing
    economic outward processing arrangements applicable to certain textile and clothing
    products reimported into the Community after working or processing in certain
    third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1816/95 de la Commission, du 26 juillet 1995, fixant
    certaines dispositions d'application du règlement (CE) n° 3036/94 du Conseil
    instituant un régime de perfectionnement passif économique applicable à certains
    produits textiles et d'habillement réimportés dans la Communauté après ouvraison
    ou transformation dans certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1816/95 der Kommission vom 26. Juli 1995 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 3036/94 des Rates zur Schaffung eines wirtschaftlichen
    passiven Veredelungsverkehrs für bestimmte Textil- und Bekleidungserzeugnisse,
    die nach Be- oder Verarbeitung in gewissen Drittländern wieder in die Gemeinschaft
    eingeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1816/95 af 26. juli 1995 om fastsættelse
    af visse gennemførelsesbestemmelser for Rådets forordning (EF) nr. 3036/94 om
    indførelse af en procedure for økonomisk passiv forædling for visse tekstilvarer
    og beklædningsgenstande, der genindføres til Fællesskabet efter bearbejdning
    i visse tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1816/95 της Επιτροπής
    της 26ης Ιουλίου 1995 που καθορίζει μερικές διατάξεις
    εφαρμογής του κανονισμού (ΕΚ) αριθ. 3036/94 του
    Συμβουλίου για τη θέσπιση οικονομικού καθεστώτος
    παθητικής τελειοποίησης που εφαρμόζεται σε
    ορισμένα κλωστοϋφαντουργικά προϊόντα και
    ενδύματα που επανεισάγονται στην Κοινότητα
    μετά από κατεργασία ή μεταποίηση σε ορισμένες
    τρίτες χώρες
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1816/95, annettu 26 päivänä heinäkuuta 1995,
    yhteisöön jälleentuotujen tietyissä kolmansissa maissa käsiteltävinä tai
    jalostettavina olleisiin tiettyihin tekstiili- ja vaatetuotteisiin sovellettavien
    taloudellisesti vaikuttavaa ulkoista jalostusmenettelyä koskevien menettelyjen
    järjestämisestä annetun neuvoston asetuksen (EY) N:o 3036/94 tiettyjen määräysten
    soveltamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1816/95 della Commissione, del 26 luglio 1995, che
    fissa alcune disposizioni d'applicazione del regolamento (CE) n. 3036/94 del Consiglio
    che istituisce un regime economico di perfezionamento passivo applicabile ad alcuni
    prodotti tessili e d'abbigliamento reimportati nella Comunità dopo aver subito
    lavorazioni e trasformazioni in taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1816/95 van de Commissie van 26 juli 1995 ter vaststelling
    van bepaalde uitvoeringsbepalingen van Verordening (EG) nr. 3036/94 van de Raad
    houdende instelling van een regeling voor economische passieve veredeling die
    van toepassing is op bepaalde textielprodukten en kledingartikelen die worden
    wederingevoerd in de Gemeenschap na bewerking of verwerking in bepaalde derde
    landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1816/95 da Comissão, de 26 de Julho de 1995, que
    fixa determinadas disposições de aplicação do Regulamento (CE) nº 3036/94
    do Conselho, que institui um regime de aperfeiçoamento económico passivo aplicável
    a certos produtos têxteis e de vestuário reimportados na Comunidade após fabrico
    ou transformação em certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1816/95 de la Comisión, de 26 de julio de 1995, por
    el que se fijan determinadas disposiciones de aplicación del Reglamento (CE)
    nº 3036/94 del Consejo, por el que se establece un régimen de perfeccionamiento
    pasivo económico aplicable a determinados productos textiles y de confección
    reimportados en la Comunidad tras su elaboración o transformación en determinados
    terceros países
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1816/95 av den 26 juli 1995 som anger
    genomförandebestämmelser för rådets förordning (EG) nr 3036/94 som reglerar
    ordningar för ekonomisk passiv förädling tillämpliga på vissa textil- och
    konfektionsvaror som återinförs till gemenskapen efter bearbetning eller förädling
    i vissa tredje länder
  type: main
