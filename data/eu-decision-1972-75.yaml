title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1971, portant octroi du concours
    du FSE au bénéfice du Royaume des Pays-Bas pour des dépenses relatives à des
    opérations de rééducation professionnelle et de réinstallation effectuées
    par le "Ministerie van sociale zaken"
  type: main
- language: de
  script: Latn
  content: '72/75/EWG: Entscheidung der Kommission vom 23. Dezember 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an das Königreich
    der Niederlande zu Aufwendungen für vom "Ministerie van Sociale Zaken en Volksgezondheid"
    durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/75/CEE: Decisione della Commissione, del 23 dicembre 1971, che concede
    un contributo del Fondo sociale europeo al Regno dei Paesi Bassi per spese concernenti
    operazioni di riqualificazione e di nuova sistemazione effettuate dal « Ministerie
    van Sociale Zaken»'
  type: main
- language: nl
  script: Latn
  content: '72/75/EEG: Beschikking van de Commissie van 23 december 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van het
    Koninkrijk der Nederlanden voor door het Ministerie van Sociale Zaken gemaakte
    herscholings- en verplaatsingskosten'
  type: main
