title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3089/89 of 13 October 1989 re-establishing
    the levying of customs duties on men's or boys'underpants and briefs, women's
    or girls'knickers and briefs, knitted or crocheted, of wool, cotton or of man-made
    fibres, products of category 13 (order No 40.0130), originating in Thailand, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3089/89 de la Commission du 13 octobre 1989 portant
    rétablissement de la perception des droits de douane applicables aux slips et
    caleçons pour hommes ou garçonnets, slips et culottes pour femmes ou fillettes,
    en bonneterie, de laine, de coton ou de fibres synthétiques ou artificielles
    de la catégorie de produits n° 13 (numéro d'ordre 40.0130), originaires de
    Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3089/89 DER KOMMISSION vom 13. Oktober 1989 zur Wiedereinführung
    des Zollsatzes für Slips und andere Unterhosen für Männer und Knaben, Slips
    und andere Unterhosen für Frauen und Mädchen, aus Gewirken, Wolle, Baumwolle
    oder synthetischen oder künstlichen Spinnstoffen der Warenkategorie Nr. 13 (lfd.
    Nr. 40.0130) mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 4259/88
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3089/89 af 13. oktober 1989 om genindførelse
    af opkrævning af toldafgifter for trusser og andre underbenklæder til mænd
    og drenge, trusser og andre underbenklæder til kvinder og piger, af trikotage,
    af uld, bomuld eller syntetiske eller regenererede fibre, under varekategori nr.
    13 (løbenummer 40.0130), som har oprindelse i Thailand og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
