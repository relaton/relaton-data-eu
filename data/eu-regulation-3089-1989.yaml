  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3089/89 DELLA COMMISSIONE del 13 ottobre 1989 che
    ripristina la riscossione dei dazi doganali applicabili alle mutande, mutandine
