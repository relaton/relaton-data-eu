    understanding reached on the accession of the Republic of Korea to the common
    understanding on the principles of international cooperation on research and development
    activities in the domain of intelligent manufacturing systems between the European
    Community and the United States of America, Japan, Australia, Canada, Norway and
    Switzerland'
  type: main
