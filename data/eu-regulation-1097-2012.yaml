---
id: EURegulation10972012
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1097/2012 of 23 November 2012
    amending Regulation (EU) No 142/2011 implementing Regulation (EC) No 1069/2009
    of the European Parliament and of the Council laying down health rules as regards
    animal by-products and derived products not intended for human consumption and
    implementing Council Directive 97/78/EC as regards certain samples and items exempt
    from veterinary checks at the border under that Directive as regards dispatch
    of animal by-products and derived products between Member States
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n o 1097/2012 de la Commission du 23 novembre
    2012 modifiant, pour ce qui concerne les expéditions de sous-produits animaux
    et de produits dérivés entre les États membres, le règlement (UE) n o 142/2011
    portant application du règlement (CE) n o 1069/2009 du Parlement européen et
    du Conseil établissant des règles sanitaires applicables aux sous-produits animaux
    et produits dérivés non destinés à la consommation humaine et portant application
    de la directive 97/78/CE du Conseil en ce qui concerne certains échantillons
    et articles exemptés des contrôles vétérinaires effectués aux frontières
    en vertu de cette directive
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1097/2012 der Kommission vom 23. November
    2012 zur Änderung der Verordnung (EU) Nr. 142/2011 zur Durchführung der Verordnung
    (EG) Nr. 1069/2009 des Europäischen Parlaments und des Rates mit Hygienevorschriften
    für nicht für den menschlichen Verzehr bestimmte tierische Nebenprodukte sowie
    zur Durchführung der Richtlinie 97/78/EG des Rates hinsichtlich bestimmter gemäß
    der genannten Richtlinie von Veterinärkontrollen an der Grenze befreiter Proben
    und Waren in Bezug auf den Versand tierischer Nebenprodukte und von Folgeprodukten
    zwischen den Mitgliedstaaten
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1097/2012 на
    Комисията от 23 ноември 2012 година за изменение
    на Регламент (ЕС) № 142/2011 на Комисията за прилагане
    на Регламент (ЕО) № 1069/2009 на Европейския парламент
    и на Съвета за установяване на здравни правила
    относно странични животински продукти и производни
    продукти, непредназначени за консумация от
    човека, и за прилагане на Директива 97/78/ЕО на
    Съвета по отношение на някои проби и артикули,
    освободени от ветеринарни проверки на границата
    съгласно посочената директива, и по отношение
    на изпращането на странични животински продукти
    и производни продукти
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1097/2012 ze dne 23. listopadu
    2012 , kterým se mění, pokud jde o odesílání vedlejších produktů živočišného
    původu a získaných produktů mezi členskými státy, nařízení (EU) č.
    142/2011, kterým se provádí nařízení Evropského parlamentu a Rady (ES)
    č. 1069/2009 o hygienických pravidlech pro vedlejší produkty živočišného
    původu a získané produkty, které nejsou určeny k lidské spotřebě, a provádí
    směrnice Rady 97/78/ES, pokud jde o určité vzorky a předměty osvobozené
    od veterinárních kontrol na hranici podle uvedené směrnice
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1097/2012 af 23. november
    2012 om ændring af forordning (EU) nr. 142/2011 om gennemførelse af Europa-Parlamentets
    og Rådets forordning (EF) nr. 1069/2009 om sundhedsbestemmelser for animalske
    biprodukter og afledte produkter, som ikke er bestemt til konsum, og om gennemførelse
    af Rådets direktiv 97/78/EF for så vidt angår visse prøver og genstande, der
    er fritaget for veterinærkontrol ved grænsen som omhandlet i samme direktiv,
    hvad angår afsendelse af animalske biprodukter og afledte produkter mellem medlemsstaterne
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 1097/2012
    της Επιτροπής, της 23ης Νοεμβρίου 2012 , σχετικά
    με την τροποποίηση του κανονισμού (ΕΕ) αριθ.
    142/2011 για την εφαρμογή του κανονισμού (ΕΚ) αριθ.
    1069/2009 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    περί υγειονομικών κανόνων για ζωικά υποπροϊόντα
    και παράγωγα προϊόντα που δεν προορίζονται
    για κατανάλωση από τον άνθρωπο και για την
    εφαρμογή της οδηγίας 97/78/ΕΚ του Συμβουλίου
    όσον αφορά ορισμένα δείγματα και τεμάχια που
    εξαιρούνται από κτηνιατρικούς ελέγχους στα
    σύνορα οι οποίοι αναφέρονται στην εν λόγω οδηγία
    όσον αφορά την αποστολή ζωικών υποπροϊόντων
    και παράγωγων προϊόντων μεταξύ των κρατών
    μελών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 1097/2012, 23. november 2012 , millega
    muudetakse komisjoni määrust (EL) nr 142/2011 (millega rakendatakse Euroopa
    Parlamendi ja nõukogu määrust (EÜ) nr 1069/2009, milles sätestatakse muuks
    otstarbeks kui inimtoiduks ettenähtud loomsete kõrvalsaaduste ja nendest saadud
    toodete tervise-eeskirjad, ja nõukogu direktiivi 97/78/EÜ seoses teatavate selle
    direktiivi alusel piiril toimuvast veterinaarkontrollist vabastatud proovide ja
    näidistega) selles osas, mis käsitleb loomsete kõrvalsaaduste ja nendest saadud
    toodete lähetamist ühest liikmesriigist teise
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 1097/2012, annettu 23 päivänä
    marraskuuta 2012 , muiden kuin ihmisravinnoksi tarkoitettujen eläimistä saatavien
    sivutuotteiden ja niistä johdettujen tuotteiden terveyssäännöistä sekä asetuksen
    (EY) N:o 1774/2002 kumoamisesta annetun Euroopan parlamentin ja neuvoston asetuksen
    (EY) N:o 1069/2009 täytäntöönpanosta sekä neuvoston direktiivin 97/78/EY
    täytäntöönpanosta tiettyjen näytteiden ja tuotteiden osalta, jotka vapautetaan
    kyseisen direktiivin mukaisista eläinlääkärintarkastuksista rajatarkastusasemilla,
    annetun asetuksen (EU) N:o 142/2011 muuttamisesta siltä osin kuin on kyse eläimistä
    saatavien sivutuotteiden ja niistä johdettujen tuotteiden lähettämisestä jäsenvaltioiden
    välillä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1097/2012 od 23. studenoga 2012. o
    izmjeni Uredbe (EU) br. 142/2011 o provedbi Uredbe (EZ) br. 1069/2009 Europskog
    parlamenta i Vijeća o utvrđivanju zdravstvenih pravila za nusproizvode životinjskog
    podrijetla i od njih dobivene proizvode koji nisu namijenjeni prehrani ljudi i
    o provedbi Direktive Vijeća 97/78/EZ u pogledu određenih uzoraka i predmeta
    koji su oslobođeni veterinarskih pregleda na granici na temelju te Direktive,
    u pogledu isporuke nusproizvoda životinjskog podrijetla i od njih dobivenih proizvoda
    između država članica
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1097/2012/EU végrehajtási rendelete ( 2012. november 23.
    ) a nem emberi fogyasztásra szánt állati melléktermékekre és a belőlük
    származó termékekre vonatkozó egészségügyi szabályok megállapításáról
    szóló 1069/2009/EK európai parlamenti és tanácsi rendelet végrehajtásáról,
    valamint a 97/78/EK tanácsi irányelvnek az egyes minták és tételek határon
    történő állat-egészségügyi ellenőrzése alóli, az irányelv szerinti
    mentesítése tekintetében történő végrehajtásáról szóló 142/2011/EU
    rendeletnek az állati melléktermékek és az azokból származó termékek tagállamok
    közötti szállítása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1097/2012 della Commissione, del 23 novembre
    2012 , che modifica il regolamento (UE) n. 142/2011 recante disposizioni di applicazione
    del regolamento (CE) n. 1069/2009 del Parlamento europeo e del Consiglio recante
    norme sanitarie relative ai sottoprodotti di origine animale e ai prodotti derivati
    non destinati al consumo umano, e della direttiva 97/78/CE del Consiglio per quanto
    riguarda taluni campioni e articoli non sottoposti a controlli veterinari alla
    frontiera per quanto riguarda la spedizione tra Stati membri di sottoprodotti
    di origine animale e prodotti derivati
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1097/2012 ( 2012. gada 23. novembris
    ), ar ko attiecībā uz dzīvnieku izcelsmes blakusproduktu un atvasināto produktu
    nosūtīšanu starp dalībvalstīm groza Regulu (ES) Nr. 142/2011, ar kuru īsteno
    Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1069/2009, ar ko nosaka veselības
    aizsardzības noteikumus attiecībā uz dzīvnieku izcelsmes blakusproduktiem
    un atvasinātajiem produktiem, kuri nav paredzēti cilvēku patēriņam, un īsteno
    Padomes Direktīvu 97/78/EK attiecībā uz dažiem paraugiem un precēm, kam uz
    robežas neveic veterinārās pārbaudes atbilstīgi minētajai direktīvai
  type: main
- language: lt
  script: Latn
  content: 2012 m. lapkričio 23 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1097/2012,
    kuriuo dėl tam tikrų šalutinių gyvūninių produktų ir jų gaminių siuntimo
    iš vienos valstybės narės į kitą iš dalies keičiamas Reglamentas (ES) Nr.
    142/2011, kuriuo įgyvendinami Europos Parlamento ir Tarybos reglamentas (EB)
    Nr. 1069/2009, kuriuo nustatomos žmonėms vartoti neskirtų šalutinių gyvūninių
    produktų ir jų gaminių sveikumo taisyklės, ir Tarybos direktyva 97/78/EB dėl
    tam tikrų mėginių ir priemonių, kuriems netaikomi veterinariniai tikrinimai
    pasienyje pagal tą direktyvą
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 1097/2012 tat-
    23 ta’ Novembru 2012 li jemenda r-Regolament (UE) Nru 142/2011 li jimplimenta
    r-Regolament (KE) Nru 1069/2009 tal-Parlament Ewropew u tal-Kunsill li jistabbilixxi
    regoli tas-saħħa li jirrigwardaw prodotti sekondarji tal-annimali jew derivati
    minnhom mhux maħsuba għall-konsum mill-bniedem u li jimplimenta d-Direttiva
    tal-Kunsill 97/78/KE dwar ċerti kampjuni u oġġetti eżentati minn eżamijiet
    veterinarji fuq il-fruntiera skont dik id-Direttiva fir-rigward għad-dispaċċ
    ta’prodotti sekondarji tal-annimali u prodotti derivati bejn l-Istati Membri
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1097/2012 van de Commissie van 23 november
    2012 tot wijziging van Verordening (EU) nr. 142/2011 tot uitvoering van Verordening
    (EG) nr. 1069/2009 van het Europees Parlement en de Raad tot vaststelling van
    gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke
    bijproducten en afgeleide producten en tot uitvoering van Richtlijn 97/78/EG van
    de Raad wat betreft bepaalde monsters en producten die vrijgesteld zijn van veterinaire
    controles aan de grens krachtens die richtlijn, wat betreft de verzending van
    dierlijke bijproducten en afgeleide producten tussen lidstaten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 1097/2012 z dnia 23 listopada
    2012 r. zmieniające rozporządzenie (UE) nr 142/2011 w sprawie wykonania rozporządzenia
    Parlamentu Europejskiego i Rady (WE) nr 1069/2009 określającego przepisy sanitarne
    dotyczące produktów ubocznych pochodzenia zwierzęcego, nieprzeznaczonych do
    spożycia przez ludzi, oraz w sprawie wykonania dyrektywy Rady 97/78/WE w odniesieniu
    do niektórych próbek i przedmiotów zwolnionych z kontroli weterynaryjnych na
    granicach w myśl tej dyrektywy w odniesieniu do wysyłania produktów ubocznych
    pochodzenia zwierzęcego i produktów pochodnych pomiędzy państwami członkowskimi
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. o 1097/2012 da Comissão, de 23 de novembro
    de 2012 , que altera o Regulamento (UE) n. o 142/2011 que aplica o Regulamento
    (CE) n. o 1069/2009 do Parlamento Europeu e do Conselho que define regras sanitárias
    relativas a subprodutos animais e produtos derivados não destinados ao consumo
    humano e que aplica a Diretiva 97/78/CE do Conselho no que se refere a certas
    amostras e certos artigos isentos de controlos veterinários nas fronteiras ao
    abrigo da referida diretiva, no que diz respeito à expedição de subprodutos
    animais e produtos derivados entre Estados-Membros
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1097/2012 al Comisiei din
    23 noiembrie 2012 de modificare a Regulamentului (UE) nr. 142/2011 de punere în
    aplicare a Regulamentului (CE) nr. 1069/2009 al Parlamentului European și al
    Consiliului de stabilire a unor norme sanitare privind subprodusele de origine
    animală și produsele derivate care nu sunt destinate consumului uman și de
    punere în aplicare a Directivei 97/78/CE a Consiliului în ceea ce privește
    anumite probe și produse care sunt scutite de la controalele sanitar-veterinare
    la frontieră în conformitate cu directiva menționată în ceea ce privește
    expedierea subproduselor de origine animală și a produselor derivate între
    statele membre
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1097/2012 z 23. novembra 2012
    , ktorým sa v prípade odosielania vedľajších živočíšnych produktov a
    odvodených produktov medzi členskými štátmi mení a dopĺňa nariadenie Komisie
    (EÚ) č. 142/2011, ktorým sa vykonáva nariadenie Európskeho parlamentu a Rady
    (ES) č. 1069/2009, ktorým sa ustanovujú zdravotné predpisy týkajúce sa vedľajších
    živočíšnych produktov a odvodených produktov neurčených na ľudskú spotrebu
    a ktorým sa vykonáva smernica Rady 97/78/ES, pokiaľ ide o určité vzorky a
    predmety vyňaté z povinnosti veterinárnych kontrol na hraniciach podľa danej
    smernice
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1097/2012 z dne 23. novembra 2012 o
    spremembi Uredbe (EU) št. 142/2011 o izvajanju Uredbe (ES) št. 1069/2009 Evropskega
    parlamenta in Sveta o določitvi zdravstvenih pravil za živalske stranske proizvode
    in pridobljene proizvode, ki niso namenjeni prehrani ljudi, ter o izvajanju Direktive
    Sveta 97/78/ES glede nekaterih vzorcev in predmetov, ki so izvzeti iz veterinarskih
    pregledov na meji v skladu z navedeno direktivo, v zvezi z odpremo živalskih
    stranskih proizvodov in pridobljenih proizvodov med državami članicami
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n o 1097/2012 de la Comisión, de 23 de noviembre
    de 2012 , que modifica el Reglamento (UE) n o 142/2011, por el que se establecen
    las disposiciones de aplicación del Reglamento (CE) n o 1069/2009 del Parlamento
    Europeo y del Consejo, por el que se establecen las normas sanitarias aplicables
    a los subproductos animales y los productos derivados no destinados al consumo
    humano, y la Directiva 97/78/CE del Consejo en cuanto a determinadas muestras
    y unidades exentas de los controles veterinarios en la frontera en virtud de la
    misma, en lo que se refiere al envío de subproductos animales y productos derivados
    entre Estados miembros
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1097/2012 av den 23 november
    2012 om ändring av förordning (EU) nr 142/2011 om genomförande av Europaparlamentets
    och rådets förordning (EG) nr 1069/2009 om hälsobestämmelser för animaliska
    biprodukter och därav framställda produkter som inte är avsedda att användas
    som livsmedel och om genomförande av rådets direktiv 97/78/EG vad gäller vissa
    prover och produkter som enligt det direktivet är undantagna från veterinärkontroller
    vid gränsen vad gäller sändning av animaliska biprodukter och därav framställda
    produkter mellan medlemsstater
  type: main
