    (CE) nr. 517/94 al Consiliului privind regimul comun aplicabil importurilor de
    produse textile originare din anumite țări terțe care nu sunt reglementate
    de acorduri, protocoale sau alte înțelegeri bilaterale sau de alte regimuri
    comunitare specifice de import și de modificare a unor dispoziții din regulamentul
    menționat
  type: main
