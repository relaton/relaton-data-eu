title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3168/94 of 21 December 1994 establishing
    in the field of application of Council Regulation (EC) No 517/94 on common rules
    for imports of textile products from third countries not covered by bilateral
    agreements, protocols or other arrangements or by other specific Community import
    rules a Community import licence and amending certain provisions of the Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3168/94 de la Commission, du 21 décembre 1994, établissant
    une licence d'importation communautaire dans le cadre du règlement (CE) n 517/94
    du Conseil relatif au régime commun applicable aux importations de produits textiles
    en provenance de certains pays tiers non couverts par des accords, protocoles
    ou autres arrangements bilatéraux, ou par d'autres régimes communautaires spécifiques
    d'importation, et modifiant certaines dispositions dudit règlement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3168/94 der Kommission vom 21. Dezember 1994 zur Einführung
    einer Einfuhrgenehmigung im Geltungsbereich der Verordnung (EG) Nr. 517/94 des
    Rates über die gemeinsame Regelung der Einfuhren von Textilwaren aus bestimmten
    Drittländern, die nicht unter bilaterale Abkommen, Protokolle, andere Vereinbarungen
    oder eine spezifische gemeinschaftliche Einfuhrregelung fallen, und zur Änderung
    dieser Verordnung
  type: main
