    zřízeném Dohodou o obchodu a spolupráci mezi Evropskou unií a Evropským
    společenstvím pro atomovou energii na jedné straně a Spojeným královstvím
    Velké Británie a Severního Irska na straně druhé, pokud jde o přijetí doporučení
    týkajícího se vypracování technických postupů pro efektivní využívání
    elektrických propojovacích vedení
  type: main
