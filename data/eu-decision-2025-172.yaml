    Dohodou o obchode a spolupráci medzi Európskou úniou a Európskym spoločenstvom
    pre atómovú energiu na jednej strane a Spojeným kráľovstvom Veľkej Británie
    a Severného Írska na strane druhej, pokiaľ ide o prijatie odporúčania týkajúceho
