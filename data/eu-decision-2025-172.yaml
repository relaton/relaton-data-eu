title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/172 of 17 December 2024 on the position to be
    taken on behalf of the European Union within the Specialised Committee on Energy
    established by the Trade and Cooperation Agreement between the European Union
    and the European Atomic Energy Community, of the one part, and the United Kingdom
    of Great Britain and Northern Ireland, of the other part, as regards the adoption
    of a recommendation concerning the preparation of technical procedures for the
    efficient use of electricity interconnectors
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/172 du Conseil du 17 décembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du comité spécialisé
    chargé de l’énergie institué par l’accord de commerce et de coopération
    entre l’Union européenne et la Communauté européenne de l’énergie atomique,
    d’une part, et le Royaume-Uni de Grande-Bretagne et d’Irlande du Nord, d’autre
    part, en ce qui concerne l’adoption d’une recommandation concernant l’élaboration
    de procédures techniques pour l’utilisation efficace des interconnexions électriques
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/172 des Rates vom 17. Dezember 2024 über den Standpunkt,
    der im Namen der Europäischen Union im Sonderausschuss für Energie, der mit
    dem Abkommen über Handel und Zusammenarbeit zwischen der Europäischen Union
    und der Europäischen Atomgemeinschaft einerseits und dem Vereinigten Königreich
    Großbritannien und Nordirland andererseits eingesetzt wurde, hinsichtlich der
    Annahme einer Empfehlung zur Ausarbeitung technischer Verfahren für die effiziente
    Nutzung von Stromverbindungsleitungen zu vertreten ist
  type: main
- language: bg
  script: Cyrl
