  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/172 z dne 17. Decembra 2024 o stališču, ki se v
    imenu Evropske unije zastopa v Specializiranem odboru za energijo, ustanovljenem
    s Sporazumom o trgovini in sodelovanju med Evropsko unijo in Evropsko skupnostjo
    za atomsko energijo na eni strani ter Združenim kraljestvom Velika Britanija
    in Severna Irska na drugi strani, v zvezi s sprejetjem priporočila o pripravi
    tehničnih postopkov za učinkovito uporabo povezovalnih daljnovodov za električno
    energijo
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2025/172 del Consejo, de 17 de diciembre de 2024, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Comité
    Especializado en Energía establecido por el Acuerdo de Comercio y Cooperación
    entre la Unión Europea y la Comunidad Europea de la Energía Atómica, por una
    parte, y el Reino Unido de Gran Bretaña e Irlanda del Norte, por otra, en lo
    que respecta a la adopción de una recomendación sobre la elaboración de procedimientos
    técnicos para el uso eficiente de los interconectores de electricidad
  type: main
