  content: Rådets beslut (EU) 2025/172 av den 17 december 2024 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i den specialiserade kommitté för
    energi som inrättats genom avtalet om handel och samarbete mellan Europeiska
    unionen och Europeiska atomenergigemenskapen, å ena sidan, och Förenade konungariket
    Storbritannien och Nordirland, å andra sidan, vad gäller antagandet av en rekommendation
    avseende utarbetandet av tekniska förfaranden för en effektiv användning av
    elsammanlänkningar
