    specializat privind energia constituit în temeiul Acordului comercial și de
    cooperare dintre Uniunea Europeană și Comunitatea Europeană a Energiei Atomice,
    pe de o parte, și Regatul Unit al Marii Britanii și Irlandei de Nord, pe de
    altă parte, în ceea ce privește adoptarea unei recomandări privind pregătirea
    unor proceduri tehnice pentru utilizarea eficientă a liniilor de interconexiune
    de energie electrică
  type: main
