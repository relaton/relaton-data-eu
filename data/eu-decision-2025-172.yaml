    ds. Energii ustanowionego na mocy Umowy o handlu i współpracy między Unią
    Europejską i Europejską Wspólnotą Energii Atomowej, z jednej strony, a Zjednoczonym
    Królestwem Wielkiej Brytanii i Irlandii Północnej, z drugiej strony, w odniesieniu
