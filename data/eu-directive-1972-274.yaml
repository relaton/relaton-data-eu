    semences de plantes fourragères, des semences de céréales, des plants de pommes
    de terre, la directive du 30 juin 1969 concernant la commercialisation des semences
    de plantes oléagineuses et à fibres, et les directives du 29 septembre 1970,
    concernant respectivement la commercialisation des semences de légumes et le
    catalogue commun des variétés des espèces de plantes agricoles
  type: main
