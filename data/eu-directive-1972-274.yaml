  content: Council Directive 72/274/EEC of 20 July 1972 amending the Directives of
    14 June 1966 on the marketing of beet seed, fodder plant seed, cereal seed, seed
    potatoes, the Directive of 30 June 1969 on the marketing of seed of oil and fibre
    plants and the Directives of 29 September 1970 on the marketing of vegetable seed
    and on the common catalogue of varieties of agricultural species
  type: main
