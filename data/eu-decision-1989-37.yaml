  script: Latn
  content: '89/37/EEC: Commission Decision of 29 December 1988 extending for Greece
    the period during which seed of certain varieties of cotton and soya bean may
    be subject to marketing restrictions relating to the variety (only the Greek text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/37/CEE: Décision de la Commission du 29 décembre 1988 prolongeant,
    en ce qui concerne la Grèce, le délai pendant lequel les semences de certaines
    variétés de coton et de soja peuvent être soumises à des restrictions de commercialisation
    quant à la variété (Le texte en langue grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
