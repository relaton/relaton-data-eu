title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3474/89 of 20 November 1989 fixing the maximum
    quantity of sunflower oil to be released for consumption in Spain and exported
    from that Member State in the 1989/90 marketing year and amending Regulation (EEC)
    No 1183/86 laying down detailed rules for the system for controlling the prices
    and the quantities of certain products in the oils and fats sector released for
    consumption in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3474/89 de la Commission du 20 novembre 1989 fixant,
    pour la campagne de commercialisation 1989/1990, la quantité maximale d'huile
    de tournesol à mettre à la consommation en Espagne et à exporter à partir
    de cet État membre, et modifiant le règlement (CEE) n° 1183/86 arrêtant les
    modalités du régime de contrôle des prix et des quantités mises à la consommation
    en Espagne de certains produits du secteur des matières grasses
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3474/89 DER KOMMISSION vom 20. November 1989 zur
    Festsetzung der in Spanien zum freien Verkehr abzufertigenden und aus diesem Mitgliedstaat
    auszuführenden Höchstmenge Sonnenblumenöl für das Wirtschaftsjahr 1989/90
    und zur Änderung der Verordnung (EWG) Nr. 1183/86 mit Durchführungsbestimmungen
    für das System der Kontrolle der Preise der in Spanien zum freien Verkehr abgefertigten
    Mengen bei bestimmten Erzeugnissen des Fettsektors #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3474/89 af 20. november 1989 om fastsættelse
    for produktionsåret 1989/90 af den maksimale mængde solsikkeolie, der kan overgå
    til frit forbrug i Spanien eller udføres fra denne medlemsstat, og om ændring
    af forordning (EØF) nr. 1183/86 om gennemførelsesbestemmelserne for kontrolordningen
    vedrørende de mængder af visse produkter inden for fedtstofsektoren, der overgår
    til frit forbrug i Spanien, og priserne på disse
  type: main
- language: el
  script: Grek
  content: 'ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 3474/89 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 20ής Νοεμβρίου 1989 για τον καθορισμό για
    την περίοδο εμπορίας 1989/90 της μέγιστης ποσότητας
    ηλιανθελαίου που θα διατεθεί στην κατανάλωση
    στην Ισπανία και θα εξαχθεί από αυτό το κράτος
    μέλος και για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1183/86 για τη θέσπιση των λεπτομερειών
    του καθεστώτος του ελέγχου των τιμών και των
    ποσοτήτων που τίθενται στην κατανάλωση στην
    Ισπανία ορισμένων προϊόντων του τομέα των
    λιπαρών ουσιών #'
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3474/89 DELLA COMMISSIONE del 20 novembre 1989 che
    fissa, per la campagna di commercializzazione 1989/1990, il quantitativo massimo
    di olio di girasole da immettere in consumo in Spagna e da esportare da tale Stato
    membro e che modifica il regolamento (CEE) n. 1183/86 che stabilisce le modalità
    di applicazione del regime di controllo dei prezzi e dei quantitativi di taluni
    prodotti nel settore dei grassi immessi in consumo in Spagna #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3474/89 VAN DE COMMISSIE van 20 november 1989 tot
    vaststelling, voor het verkoopseizoen 1989/1990, van de maximale, in Spanje in
    consumptie te brengen en aldaar uit te voeren hoeveelheid zonnebloemolie en tot
    wijziging van Verordening (EEG) nr. 1183/86 tot vaststelling van de uitvoeringsbepalingen
    van de controleregeling met betrekking tot de prijzen en hoeveelheden van bepaalde
    in Spanje in consumptie gebrachte produkten van de sector oliën en vetten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3474/89 DA COMISSÃO de 20 de Novembro de 1989 que
    fixa, para a campanha de comercialização de 1989/1990, a quantidade máxima
    de óleo de girassol a introduzir no consumo em Espanha e a exportar a partir
    deste Estado-membro e altera o Regulamento (CEE) nº 1183/86 que adopta as modalidades
    do regime do controlo dos preços e das quantidades introduzidas no consumo em
    Espanha de determinados produtos do sector das matérias gordas #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3474/89 DE LA COMISIÓN de 20 de noviembre de 1989
    por el que se fija para la campaña de comercialización de 1989/90 la cantidad
    máxima de aceite de girasol que podrá despacharse al consumo en España y exportarse
    desde dicho Estado miembro y por el que se modifica el Reglamento (CEE) no 1183/86
    por el que se establecen las modalidades del régimen de control de los precios
    y de las cantidades despachadas al consumo en España de determinados productos
    del sector de las materias grasas #'
