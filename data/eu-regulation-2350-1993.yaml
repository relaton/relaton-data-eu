  script: Latn
  content: COMMISSION REGULATION (EEC) No 2350/93 of 24 August 1993 re-establishing
    the levying of customs duties on products falling within CN code 3923 21 00, originating
    in Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2350/93 de la Commission du 24 août 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 3923 21 00, originaires de Malaysia, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2350/93 DER KOMMISSION vom 24. August 1993 zur Wiedereinführung
