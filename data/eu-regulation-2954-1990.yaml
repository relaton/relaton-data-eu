  content: Commission Regulation (EEC) No 2954/90 of 12 October 1990 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Argentina must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2954/90 de la Commission, du 12 octobre 1990, fixant
