    aux sons et remoulages originaires d'Argentine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2954/90 der Kommission vom 12. Oktober 1990 zur Festsetzung
    des Betrages, um den der veränderliche Bestandteil der auf Kleie und andere Rückstände
    mit Ursprung in Argentinien anwendbaren Abschöpfung zu verringern ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2954/90 af 12. oktober 1990 om fastsættelse
    af det beløb, hvormed det variable element af importafgiften for klid med oprindelse
    i Argentina skal nedsættes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2954/90 της Επιτροπής
