title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 décembre 1970, portant octroi du concours
    du Fonds social européen au bénéfice du Royaume de Belgique pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    l'Office national de l'emploi (ONEM)
  type: main
- language: de
  script: Latn
  content: '71/59/EWG: Entscheidung der Kommission vom 16. Dezember 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an das Königreich
    Belgien zu Aufwendungen für vom "Office National de l''Emploi (ONEM)" durchgeführte
    Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '71/59/CEE: Decisione della Commissione, del 16 dicembre 1970, che concede
    un contributo del Fondo sociale europeo al Regno del Belgio per spese concernenti
    operazioni di riqualificazione effettuate dall''«Office national de l''emploi»
    (ONEM)'
  type: main
- language: nl
  script: Latn
  content: '71/59/EEG: Beschikking van de Commissie van 16 december 1970 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van het
    Koninkrijk België voor door de Rijksdienst voor Arbeidsvoorziening (R.V.A.) gemaakte
    herscholingskosten'
