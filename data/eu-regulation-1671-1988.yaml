    underkjoler osv., ikke af trikotage (kategori 18, løbenummer 41.0180), som har
    oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3783/87
  type: main
