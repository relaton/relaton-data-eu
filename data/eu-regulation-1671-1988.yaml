    n. 18 (numero d' ordine 40.0180) originari del Brasile beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1671/88 van de Commissie van 14 juni 1988 houdende
