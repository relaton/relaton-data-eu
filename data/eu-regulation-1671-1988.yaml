title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1671/88 of 14 June 1988 re-establishing
    the levying of customs duties on singlets, slips, pyjamas, dressing gowns, petticoats,
    etc. other than knitted or crocheted products of category 18 (order No 40.0180),
    originating in Brazil to which the preferential tariff arrangements Council Regulation
    (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1671/88 de la Commission du 14 juin 1988 portant rétablissement
    de la perception des droits de douane applicables aux gilets de corps, slips,
    pyjamas, robes de chambre, combinaisons, etc., autres qu' en bonneterie, de la
    catégorie 18 (numéro d' ordre 40.0180), originaires du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1671/88 der Kommission vom 14. Juni 1988 zur Wiedereinführung
    des Zollsatzes für Unterhemden, Slips, Schlafanzüge, Hausmäntel, Unterkleider
    usw., andere als aus Gewirken, der Warenkategorie Nr. 18 (lfd. Nr. 40.0180) mit
    Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1671/88 af 14. juni 1988 om genindførelse
