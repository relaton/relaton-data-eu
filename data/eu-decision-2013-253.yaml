title:
- language: en
  script: Latn
  content: '2013/253/EU: Commission Implementing Decision of 29 May 2013 amending
    Decision 2006/473/EC as regards the recognition of certain third countries and
    certain areas of third countries as being free from Xanthomonas campestris (all
    strains pathogenic to Citrus), Cercospora angolensis Carv. et Mendes and Guignardia
    citricarpa Kiely (all strains pathogenic to Citrus) (notified under document C(2013)
    3057)'
  type: main
- language: fr
  script: Latn
  content: '2013/253/UE: Décision d’exécution de la Commission du 29 mai 2013
    modifiant la décision 2006/473/CE en ce qui concerne la reconnaissance de certains
    pays tiers et de certaines régions de pays tiers comme indemnes de Xanthomonas
    campestris (toutes les souches pathogènes aux Citrus), Cercospora angolensis
    Carv. & Mendes ou Guignardia citricarpa Kiely (toutes les souches pathogènes
    aux Citrus) [notifiée sous le numéro C(2013) 3057]'
  type: main
