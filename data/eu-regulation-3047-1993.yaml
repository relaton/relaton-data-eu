    του κωδικού ΣΟ ex 8528, καταγωγής Ινδονησίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3047/93 DELLA COMMISSIONE del 3 novembre 1993 che ripristina
