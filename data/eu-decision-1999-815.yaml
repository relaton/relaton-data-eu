---
id: EUDecision1999815
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/815/EC: Commission Decision of 7 December 1999 adopting measures
    prohibiting the placing on the market of toys and childcare articles intended
    to be placed in the mouth by children under three years of age made of soft PVC
    containing one or more of the substances di-iso-nonyl phthalate (DINP), di(2-ethylhexyl)
    phthalate (DEHP), dibutyl phthalate (DBP), di-iso-decyl phthalate (DIDP), di-n-octyl
    phthalate (DNOP), and butylbenzyl phthalate (BBP) (notified under document number
    C(1999) 4436)'
  type: main
- language: fr
  script: Latn
  content: '1999/815/CE: Décision de la Commission, du 7 décembre 1999, adoptant
    des mesures qui interdisent la mise sur le marché de jouets et d''articles de
    puériculture destinés à être mis en bouche par des enfants de moins de trois
    ans, fabriqués en PVC souple contenant une ou plusieurs des substances di-iso-nonyl
    phtalate (DINP), di(2-éthylhexyl) phtalate (DEHP), dibutyl phtalate (DBP), di-iso-décyl
    phtalate (DIDP), di-n-octyl phtalate (DNOP) et butylbenzyl phtalate (BBP) [notifiée
    sous le numéro C(1999) 4436]'
  type: main
- language: de
  script: Latn
  content: '1999/815/EG: Entscheidung der Kommission vom 7. Dezember 1999 über Maßnahmen
    zur Untersagung des Inverkehrbringens von Spielzeug- und Babyartikeln, die dazu
    bestimmt sind, von Kindern unter drei Jahren in den Mund genommen zu werden, und
    aus Weich-PVC bestehen, das einen oder mehrere der Stoffe Diisononylphthalat (DINP);
    Di-(2-ethylhexyl)phthalat (DEHP), Dibutylphthalat (DBP), Diisodecylphthalat (DIDP),
    Di-n-octylphthalat (DNOP) oder Benzylbutylphthalat (BBP) enthält (Bekanntgegeben
    unter Aktenzeichen K(1999) 4436)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 7. prosince 1999, kterým se přijímají opatření,
    jimiž se zakazuje uvádět na trh hračky a předměty pro péči o děti určené
    pro vkládání do úst dětmi do tří let a vyrobené z měkčeného PVC obsahujícího
    jednu nebo více látek diisononyl-ftalát (DINP), di(2-ethylhexyl)-ftalát (DEHP),
    dibutyl-ftalát (DBP), diisodecyl-ftalát (DIDP), di-n-oktyl-ftalát (DNOP) a
    butyl-benzyl-ftalát (BBP) (oznámeno pod číslem K(1999) 4436)
  type: main
- language: da
  script: Latn
  content: '1999/815/EF: Kommissionens beslutning af 7. december 1999 om forbud mod
    markedsføring af legetøj og småbørnsartikler, der er beregnet til at blive
    puttet i munden af børn under tre år, og som er fremstillet af blød pvc indeholdende
    et eller flere af stofferne diisononylphthalat (DINP), di(2-ethylhexyl)phthalat
    (DEHP), dibutylphthalat (DBP), diisodecylphthalat (DIDP), di-n-octylphthalat (DNOP)
    og butylbenzylphthalat (BBP) (meddelt under nummer K(1999) 4436)'
  type: main
- language: el
  script: Grek
  content: '1999/815/ΕΚ: Απόφαση της Επιτροπής, της 7ης
    Δεκεμβρίου 1999, περί έγκρισης μέτρων που απαγορεύουν
    τη διάθεση στην αγορά παιχνιδιών και προϊόντων
    παιδικής φροντίδας κατασκευασμένων από μαλακό
    PVC που περιέχουν μία ή περισσότερες από τις
    ουσίες φθαλικό δι-ισο-εννεϋλεστέρα (DINP), φθαλικό
    δι(2-αιθυλεξυλ)εστέρα (DEHP), φθαλικό διβουτυλεστέρα
    (DBP), φθαλικό δι-ισο-δεκυλεστέρα (DIDP), φθαλικό
    δι-n-οκτυλεστέρα (DNOP), και φθαλικό βουτυλβενζυλεστέρα
    (BBP) τα οποία κατά τη χρήση μπαίνουν στο στόμα
    παιδιών ηλικίας μικρότερης από τριών ετών
    [κοινοποιηθείσα υπό τον αριθμό Ε(1999) 4436]'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni otsus, 7. detsember 1999, millega kehtestatakse meetmed, mis
    keelavad selliste mänguasjade ja imikutarvete turuleviimise, mis on ette nähtud
    suhu panemiseks alla kolmeaastastele lastele ja mis on valmistatud pehmest PVCst,
    mis sisaldab üht või mitut järgmistest ainetest: diisononüülftalaat (DINP),
    di(2-etüülheksüül)ftalaat (DEHP), dibutüülftalaat (DBP), diisodetsüülftalaat
    (DIDP), di-n-oktüülftalaat (DNOP) ja butüülbensüülftalaat (BBP) (avaldatud
    numbri K(1999) 4436 all)'
  type: main
- language: fi
  script: Latn
  content: '1999/815/EY: Komission päätös, tehty 7 päivänä joulukuuta 1999,
    toimenpiteistä, joilla kielletään yhtä tai useampaa seuraavista aineista:
    di-isononyyliftalaattia (DINP), di(2-etyyliheksyyli)ftalaattia (DEHP), dibutyyliftalaattia
    (DBP), di-isodekyyliftalaattia (DIDP), di-n-oktyyliftalaattia (DNOP) ja butyylibentsyyliftalaattia
    (BBP) sisältävien, pehmeästä PVC:stä valmistettujen, alle kolmivuotiaiden
    lasten suuhun pantavaksi tarkoitettujen lelujen ja lastentarvikkeiden markkinoille
    saattaminen (tiedoksiannettu numerolla K(1999) 4436)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1999. december 7.) a diizononil-ftalát (DINP),
    di-(2-etilhexil)-ftalát (DEHP), dibutil-ftalát (DBP), diizodecil-ftalát (DIDP),
    di-n-oktil-ftalát (DNOP) és benzil-butil-ftalát (BBP) vegyületek közül egyet
    vagy többet tartalmazó, lágy PVC-ből készült játékok és gyermekápolási
    cikkek, melyeket arra szántak, hogy a háromévesnél fiatalabb gyermekek azokat
    szájba vegyék, forgalomba hozatalát megtiltó intézkedések elfogadásáról
    (Az értesítés a C(1999) 4436. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '1999/815/CE: Decisione della Commissione, del 7 dicembre 1999, che adotta
    provvedimenti che vietano l''immissione sul mercato di giocattoli e articoli di
    puericultura destinati ad essere messi in bocca da bambini d''età inferiore a
    tre anni e fabbricati in PVC morbido contenenti una o più sostanze quali ftalato
    di diisononile (DINP), ftalato di bis(2-etilesile) (DEHP), ftalato di dibutile
    (DBP), ftalato di dipentile (DIDP), ftalato di diottile (DNOP), ftalato di butilbenzile
    (BBP) [notificata con il numero C(1999) 4436]'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Lēmums (1999. gada 7. decembris) par pasākumu pieņemšanu,
    aizliedzot laist tirgū tādas rotaļlietas un tādus bērnu aprūpes priekšmetus
    no plastificēta PVH, ko var bāzt mutē bērni līdz triju gadu vecumam un kas
    satur vienu vai vairākas šādas vielas: diizononilftalātu (DINP), di(2-ethilheksil)ftalātu
    (DEHP), dibutilftalātu (DBP), diizodecilftalātu (DIDP), di-n-oktilftalātu (DNOP)
    un butilbenzilftalātu (BBP) (izziņots ar dokumenta Nr. C(1999) 4436)'
  type: main
- language: lt
  script: Latn
  content: '1999 m. gruodžio 7 d. Komisijos sprendimas patvirtinantis priemones,
    kuriomis draudžiama teikti į rinką žaislus ir vaikų priežiūros prekes,
    kurie yra skirti tam, kad jaunesnio kaip trejų metų amžiaus vaikai juos dėtų
    į burną, pagamintus iš minkštojo PVC, kuriame yra vienos ar daugiau tokių
    medžiagų: diizononilftalato (DINP), di(2-etilheksil)ftalato (DEHP), dibutilftalato
    (DBP), diizodecilftalato (DIDP), di-n-oktilftalato (DNOP) ir butilbenzilftalato
    (BBP) (pranešta dokumentu Nr. C(1999) 4436)'
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-7 ta' Diċembru 1999 li tadotta miżuri
    li jipprojbixxu t-tqegħid fis-suq ta' ġugarelli u oġġetti tal-kura tat-tfal
    intiżi li jitqiegħdu fil-ħalq mit-tfal ta' l-età ta' taħt it-tliet snin,
    magħmulha minn PVC artab li jkun fihom waħda jew aktar mis-sustanzi di-iso-nonyl
    phthalate (DINP), di(2-ethylhexyl) phthalate (DEHP), dibutyl phthalate (DBP),
    di-iso-decyl phthalate (DIDP), di-n-octyl phthalate (DNOP), u butylbenzyl phthalate
    (BBP) (innotifikata permezz tad-dokument C(1999) 4436)
  type: main
- language: nl
  script: Latn
  content: '1999/815/EG: Beschikking van de Commissie van 7 december 1999 tot goedkeuring
    van maatregelen houdende verbod op het op de markt brengen van speelgoed- en kinderverzorgingsartikelen
    die bestemd zijn om door kinderen jonger dan drie jaar in de mond te worden gestopt
    en vervaardigd zijn van zacht PVC dat een of meer van de stoffen diisononylftalaat
    (DINP), diethylhexylftalaat (DEHP), dibutylftalaat (DBP), diisodecylftalaat (DIDP),
    di-n-octylftalaat (DNOP) en butylbenzylftalaat (BBP) bevat (Kennisgeving geschied
    onder nummer C(1999) 4436)'
  type: main
- language: pl
  script: Latn
  content: 'Decyzja Komisji z dnia 7 grudnia 1999 r. przyjmująca środki zakazujące
    wprowadzania do obrotu zabawek i artykułów pielęgnacyjnych dla dzieci przeznaczonych
    do brania do ust przez dzieci do lat trzech, wytworzonych z miękkiego PVC zawierającego
    przynajmniej jedną z następujących substancji: ftalan di-izononylu (DINP),
    ftalan di(2-etyloheksylu) (DEHP), ftalan dibutylu (DBP), ftalan di-izodecylu (DIDP),
    ftalan di–n-oktylu (DNOP) i ftalan butylobenzylu (BBP) (notyfikowana jako dokument
    nr C(1999) 4436)'
  type: main
- language: pt
  script: Latn
  content: '1999/815/CE: Decisão da Comissão, de 7 de Dezembro de 1999, que adopta
    medidas de proibição da colocação no mercado de brinquedos e artigos de puericultura
    destinados a ser introduzidos na boca por crianças com menos de três anos de
    idade, fabricados em PVC maleável que contenha uma ou mais das substâncias ftalato
    de di-isononilo (DINP), ftalato de 2-etilhexilo (DEHP), ftalato de dibutilo (DBP),
    ftalato de di-isodecilo (DIDP), ftalato de di-n-octilo (DNOP) e ftalato de benzilo
    e butilo (BBP) [notificada com o número C(1999) 4436]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie komisie zo 7. decembra 1999, ktorým sa prijímajú opatrenia
    na zákaz umiestnenia hračiek a výrobkov určených na starostlivosť o dieťa,
    ktoré môžu deti mladšie ako 3 roky vkladať do úst, vyrobených z mäkkého
    PVC, ktoré obsahuje jednu alebo viaceré z látok di-izo-nonylftalát (DINP),
    di(2-etylhexyl)ftalát (DEHP), dibutylftalát (DBP), di-izo-decylftalát (DIDP),
    di-n-oktylftalát (DNOP) a butylbenzylftalát (BBP) na trh (oznámené pod číslom
    dokumentu C(1999) 4436)
  type: main
- language: sl
  script: Latn
  content: 'Odločba Komisije z dne 7. decembra 1999 o ukrepih, ki prepovedujejo dajanje
    na trg igrače in predmete za nego otrok, namenjene za to, da jih dajejo v usta
    otroci, mlajši od treh let, in izdelane iz mehkega PVC, vsebujočega eno ali
    več naslednjih snovi: diizononil ftalat (DINP), di (2-etilheksil) ftalat (DEHP),
    dibutil ftalat (DBP), diizodecil ftalat (DIDP), di-n-oktil ftalat (DNOP) in butilbenzil
    ftalat (BBP) (notificirana pod dokumentarno številko K(1999) 4436)'
  type: main
- language: es
  script: Latn
  content: '1999/815/CE: Decisión de la Comisión, de 7 de diciembre de 1999, por
    la que se adoptan medidas relativas a la prohibición de la comercialización
    de determinados juguetes y artículos de puericultura destinados a ser introducidos
    en la boca por niños menores de tres años y fabricados con PVC blando que contenga
    las sustancias diisononilftalato (DINP), di(2-etilhexil)ftalato (DEHP), dibutilftalato
    (DBP), diisodecilftalato (DIDP), din-octilftalato (DNOP), y butilbencilftalato
    (BBP) [notificada con el número C(1999) 4436]'
  type: main
- language: sv
  script: Latn
  content: '1999/815/EG: Kommissionens beslut av den 7 december 1999 om antagande
    av åtgärder för att förbjuda utsläppandet på marknaden av leksaker och barnvårdsartiklar
    som är avsedda att stoppas i munnen av barn under tre års ålder, tillverkade
    i mjuk PVC-plast som innehåller ett eller fler av ämnena diisononylftalat (DINP),
    dietylhexylftalat (DEHP), dibutylftalat (DBP), diisodecylftalat (DIDP), di-n-oktylftalat
    (DNOP) och butylbensylftalat (BBP) [delgivet med nr K(1999) 4436]'
