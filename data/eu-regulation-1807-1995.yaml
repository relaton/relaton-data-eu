  content: COMMISSION REGULATION (EC) No 1807/95 of 25 July 1995 determining the extent
    to which applications lodged in July 1995 for import licences for certain egg
    sector products pursuant to Regulation (EC) No 1474/95 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1807/95 DE LA COMMISSION du 25 juillet 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1995 pour certains produits du secteur des oeufs dans le cadre du règlement
    (CE) n° 1474/95 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1807/95 DER KOMMISSION vom 25. Juli 1995 über die
