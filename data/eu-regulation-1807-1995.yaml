    1995 om importlicenser for visse ægprodukter i forbindelse med forordning (EF)
    nr. 1474/95
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1807/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
