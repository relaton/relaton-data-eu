title:
- language: en
  script: Latn
  content: Commission Decision of 28 January 1974 authorizing the Republic of Italy
    to permit until 30 September 1974 the marketing of certified seeds of tall fescue
    and fodder plant peas belonging to varieties the seeds of which cannot be marketed
    on its territory
  type: main
- language: fr
  script: Latn
  content: Décision 74/163/CEE de la Commission, du 28 janvier 1974, autorisant la
    République italienne à admettre, pour une période expirant le 30 septembre
    1974, la commercialisation de semences certifiées de fétuque élevée et de
    pois fourragers appartenant à des variétés dont les semences ne sont pas commercialisables
    sur son territoire
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Januar 1974 zur Ermächtigung der Italienischen
    Republik, für einen Zeitraum, der am 30. September 1974 abläuft, zertifiziertes
    Saatgut von Rohrschwingel und Futtererbsen von Sorten zum Verkehr zuzulassen,
    deren Saatgut in ihrem Gebiet nicht verkehrsfähig ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. januar 1974 om bemyndigelse af Den italienske
    Republik til, i perioden indtil den 30. september 1974, at bringe certificeret
    frø af strand-svingel og foderærter i handelen, hvis frø ellers ikke må bringes
    i handelen på dens område
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 gennaio 1974, che autorizza la Repubblica
    italiana, per un periodo che scade il 30 settembre 1974, la commercializzazione
    di sementi certificate di festuca arundinacea e di pisello da foraggio appartenenti
    a varietà le cui sementi non possono essere commercializzate sul suo territorio
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 januari 1974 waarbij de Italiaanse
    Republiek wordt gemachtigd om, voor een tijdvak dat met 30 september 1974 eindigt,
    gecertificeerd zaaizaad van rietzwenkgras en van voedererwten van rassen waarvan
    het zaad niet in de handel mag worden gebracht op haar grondgebied, tot de handel
    toe te laten
  type: main
