title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2884/84 of 12 October 1984 re-establishing
    the levying of customs duties on dioctyl phthalates, falling within subheading
    29.15 C ex III and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2884/84 de la Commission du 12 octobre 1984 portant
    rétablissement de la perception des droits de douane applicables aux orthophtalates
    de dioctyle, de la sous-position 29.15 C ex III du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2884/84 der Kommission vom 12. Oktober 1984 zur Wiedereinführung
    der Erhebung der Zölle für Dioctylphtalate der Tarifstelle 29.15 C ex III mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2884/84 af 12. oktober 1984 om genindførelse
    af opkrævning af told for dioctylphtalater henhørende under pos. 29.15 C ex
    III og med oprindelse i Rumænien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2884/84 της Επιτροπής
    της 12ης Οκτωβρίου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για τα ορθοφθαλικά άλατα
    του διοκτυλίου, της διακρίσεως 29.15 Γ ex ΙΙΙ του
    Κοινού Δασμολογίου, καταγωγής Ρουμανίας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2884/84 della Commissione del 12 ottobre 1984 che
    ripristina la riscossione dei dazi doganali applicabili agli ortoftalati di diottile,
    della sottovoce 29.15 C ex III della tariffa doganale comune, originari della
    Romania beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2884/84 van de Commissie van 12 oktober 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioctylorthoftalaten
    van postonderverdeling 29.15 C ex III, van oorsprong uit Roemenië, waarvoor de
    in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn
    verleend
