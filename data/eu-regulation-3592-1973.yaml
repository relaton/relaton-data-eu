    di uve secche, della sottovoce 08.04 B I della tariffa doganale comune, presentate
    in imballaggi immediati di contenuto netto di 15 kg o meno (anno 1974)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3592/73 van de Raad van 28 december 1973 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor rozijnen en krenten van onderverdeling 08.04 B I van het gemeenschappelijk
    douanetarief, in verpakkingen met een netto-inhoud per onmiddellijke verpakking
    van 15 kilogram of minder (1974)
