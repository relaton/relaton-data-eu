  content: Regulation (EEC) No 3592/73 of the Council of 28 December 1973 on the opening,
    allocation and administration of a Community tariff quota for dried grapes falling
    within subheading No 08.04 B I of the Common Customs Tariff (1974), in immediate
    containers of a net capacity of 15 kg or less
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3592/73 du Conseil, du 28 décembre 1973, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de raisins secs, de la sous-position 08.04 B I du tarif douanier commun, présentés
    en emballages immédiats d'un contenu net inférieur ou égal à 15 kilogrammes
    (année 1974)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3592/73 des Rates vom 28. Dezember 1973 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Weintrauben,
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 kg oder
    weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs (1974)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3592/73 af 28. december 1973 om åbning,
