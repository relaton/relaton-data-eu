  script: Latn
  content: '88/557/EEC: Commission Decision of 12 October 1988 authorizing Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '88/557/CEE: Décision de la Commission du 12 octobre 1988 autorisant les
    États membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction ne répondant pas aux exigences de la directive 66/404/CEE du
    Conseil'
  type: main
- language: de
  script: Latn
  content: '88/557/EWG: Entscheidung der Kommission vom 12. Oktober 1988 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '88/557/EØF: Kommissionens beslutning af 12. oktober 1988 om bemyndigelse
