id: EUDecision1986563
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '86/563/EEC: Commission Decision of 12 November 1986 amending Decision
    81/675/EEC establishing that particular sealing systems are ''non-reusable systems''
    within the meaning of, inter-alia, Council Directives 66/401/EEC and 69/208/EEC'
  type: main
- language: fr
  script: Latn
  content: '86/563/CEE: Décision de la Commission du 12 novembre 1986 modifiant la
    décision 81/675/CEE constatant que certains systèmes de fermeture sont des "systèmes
    de fermeture non réutilisables" aux termes, notamment, des directives 66/401/CEE
    et 69/208/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '86/563/EWG: Entscheidung der Kommission vom 12. November 1986 zur Änderung
    der Entscheidung 81/675/EWG zur Feststellung, daß bestimmte Verschlußsysteme
    nicht wiederverwendbare Verschlußsysteme u. a. im Sinne der Richtlinien 66/401/EWG
    und 69/208/EWG des Rates sind'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 12 ноември 1986 година
    за изменение на Решение 81/675/ЕИО за установяване,
    че някои системи за запечатване са „системи
    за еднократно запечатване“ по смисъла на Директиви
    66/401/ЕИО и 69/208/ЕИО на Съвета
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 12. listopadu 1986, kterým se mění rozhodnutí
    81/675/EHS, kterým se některé uzavírací systémy určují jako „uzavírací
    systémy na jedno použití“, mimo jiné ve smyslu směrnic Rady 66/401/EHS
    a 69/208/EHS
  type: main
- language: da
  script: Latn
  content: '86/563/EØF: Kommissionens beslutning af 12. november 1986 om ændring
    af beslutning 81/675/EØF vedrørende konstatering af, at visse lukkeanordninger
    er "engangslukkeanordninger" som bl.a. omhandlet i Rådets direktiv 66/401/EØF
    og 69/208/EØF'
  type: main
- language: el
  script: Grek
  content: '86/563/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Νοεμβρίου 1986 που τροποποιεί την απόφαση 81/675/ΕΟΚ
    η οποία διαπιστώνει ότι ορισμένα συστήματα
    σφραγίσεως είναι «συστήματα σφραγίσεως που
    καταστρέφονται και δεν δύνανται να επανατοποθετηθούν»
    κατά την έννοια, ιδίως, των οδηγιών 66/401/ΕΟΚ
    και 69/208/ΕΟΚ του Συμβουλίου'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus 12. november 1986, millega muudetakse otsust 81/675/EMÜ
    teatud sulgemissüsteemide lugemise kohta ühekordselt kasutatavateks muu hulgas
    nõukogu direktiivide 66/401/EMÜ ja 69/208/EMÜ tähenduses
  type: main
- language: fi
  script: Latn
  content: '86/563/ETY: Komission päätös, tehty 12 päivänä marraskuuta 1986,
    tiettyjen suljinjärjestelmien vahvistamisesta neuvoston direktiiveissä 66/401/ETY
    ja 69/208/ETY tarkoitetuiksi kertakäyttöisiksi suljinjärjestelmiksi tehdyn
    päätöksen 81/675/ETY muuttamisesta'
  type: main
- language: hr
  script: Latn
  content: '86/563/EEZ: Odluka Komisije od 12. studenoga 1986. o izmjeni Odluke 81/675/EEZ
    o utvrđivanju da su određeni sustavi za plombiranje „sustavi koji se ne mogu
    ponovno upotrebljavati” u smislu, između ostalog, direktiva Vijeća 66/401/EEZ
    i 69/208/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1986. november 12.) a bizonyos zárolási rendszereknek
    a többek között a 66/401/EGK és a 69/208/EGK tanácsi irányelv értelmében
    „egyszer használatos rendszerekként” való minősítéséről szóló 81/675/EGK
    határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '86/563/CEE: Decisione della Commissione del 12 novembre 1986 che modifica
    la decisione 81/675/CEE che constata che alcuni sistemi di chiusura sono "sistemi
    di chiusura non riutilizzabili" ai sensi, fra l''altro, delle direttive 66/401/CEE
    e 69/208/CEE del Consiglio'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1986. gada 12. novembris), ar kuru groza Lēmumu 81/675/EEK,
    ar ko nosaka, ka īpašas noslēgšanas sistēmas ir “vienreizējas lietošanas
    sistēmas”, inter alia, Padomes Direktīvu 66/401/EEK un 69/208/EEK nozīmē
  type: main
- language: lt
  script: Latn
  content: 1986 m. lapkričio 12 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    81/675/EEB, nustatantį, jog tam tikros uždarymo sistemos yra „vienkartinės
    sistemos“, kaip apibrėžta, inter alia, Tarybos direktyvose 66/401/EEB ir 69/208/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-12 ta’ Novembru 1986 li temenda d-Deċiżjoni
    81/675/KEE li tistabilixxi li ċerti sistemi ta’ siġillar huma “sistemi li
    ma jistgħux jerġgħu jintużaw” skond it-tifsira ta’, fost oħrajn, id-Direttivi
    tal-Kunsill 66/401/KEE u 69/208/KEE
  type: main
- language: nl
  script: Latn
  content: '86/563/EEG: Beschikking van de Commissie van 12 november 1986 tot wijziging
    van Beschikking 81/675/EEG houdende vaststelling dat bepaalde sluitingssystemen
    zijn ,,sluitingssystemen die niet opnieuw kunnen worden gebruikt" in de zin van
    onder meer de Richtlijnen 66/401/EEG en 69/208/EEG van de Raad'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 12 listopada 1986 r. zmieniająca decyzję 81/675/EWG
    ustanawiającą, że poszczególne systemy plombowania są „systemami jednorazowego
    użytku” w rozumieniu, między innymi, dyrektyw Rady 66/401/EWG i 69/208/EWG
  type: main
- language: pt
  script: Latn
  content: '86/563/CEE: Decisão da Comissão de 12 de Novembro de 1986 que altera
    a Decisão 81/675/CEE que verifica que certos sistemas de fecho são "sistemas
    de fecho não-recuperáveis" nos termos, nomeadamente, das Directivas 66/401/CEE
    e 69/208/CEE do Conselho'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 12 noiembrie 1986 de modificare a Deciziei 81/675/CEE
    de constatare a faptului că anumite sisteme de închidere sunt „sisteme de
    închidere de unică folosință” în înțelesul, inter alia, al Directivelor
    66/401/CEE și 69/208/CEE ale Consiliului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 12. decembra 1986, ktoré mení a dopĺňa rozhodnutie
    81/675/EHS, ktoré stanovuje, že určité spôsoby uzavierania sú „spôsoby
    na jedno použitie“ v zmysle, inter alia, smerníc Rady 66/401/EHS a 69/208/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 12. novembra 1986 o spremembi Odločbe 81/675/EGS
    o določitvi, da so določeni sistemi zapiranja „sistemi za enkratno uporabo“
    med drugim v smislu direktiv Sveta 66/401/EGS in 69/208/EGS
  type: main
- language: es
  script: Latn
  content: '86/563/CEE: Decisión de la Comisión de 12 de noviembre de 1986 que modifica
    la Decisión 81/675/CEE por la que se declara que determinados sistemas de cierre
    son "sistemas de cierre no reutilizables" de conformidad, en particular, con las
    Directivas 66/401/CEE y 69/208/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '86/563/EEG: Kommissionens beslut av den 12 november 1986 om ändring av
    beslut 81/675/EEG om fastställande av att vissa förslutningssystem är icke
    återanvändbara, i den mening som avses i bland annat direktiven 66/401/EEG och
    69/208/EEG m.fl.'
