    certain textile products originating in Tunisia or Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2876/90 de la Commission du 4 octobre 1990 prorogeant
    le règlement (CEE) n° 2985/89 instaurant une surveillance communautaire a posteriori
    des importations de certains produits textiles originaires de Tunisie et du Maroc
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2876/90 DER KOMMISSION vom 4. Oktober 1990 zur Verlaengerung
    der Verordnung (EWG) Nr. 2985/89 zur Einfuehrung einer nachtraeglichen gemeinschaftlichen
    Ueberwachung der Einfuhren bestimmter Textilwaren mit Ursprung in Tunesien und
    Marokko
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2876/90 af 4. oktober 1990 om forlængelse
