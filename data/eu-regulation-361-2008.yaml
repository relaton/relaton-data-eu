title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 361/2008 of 14 April 2008 amending Regulation
    (EC) No 1234/2007 establishing a common organisation of agricultural markets and
    on specific provisions for certain agricultural products (Single CMO Regulation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 361/2008 du Conseil du 14 avril 2008 modifiant le règlement
    (CE) n° 1234/2007 portant organisation commune des marchés dans le secteur agricole
    et dispositions spécifiques en ce qui concerne certains produits de ce secteur
    ( règlement OCM unique )
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 361/2008 des Rates vom 14. April 2008 zur Änderung
    der Verordnung (EG) Nr. 1234/2007 über eine gemeinsame Organisation der Agrarmärkte
    und mit Sondervorschriften für bestimmte landwirtschaftliche Erzeugnisse ( Verordnung
    über die einheitliche GMO )
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 361/2008 на Съвета от 14 април
    2008 година за изменение на Регламент (ЕО) № 1234/2007
    за установяване на обща организация на селскостопанските
    пазари и относно специфични разпоредби за
    някои земеделски продукти ( Общ регламент за
    ООП )
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 361/2008 ze dne 14. dubna 2008 , kterým se mění
    nařízení (ES) č. 1234/2007, kterým se stanoví společná organizace zemědělských
    trhů a zvláštní ustanovení pro některé zemědělské produkty (jednotné
    nařízení o společné organizaci trhů)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 361/2008 af 14. april 2008 om ændring af forordning
    (EF) nr. 1234/2007 om en fælles markedsordning for landbrugsprodukter og om særlige
    bestemmelser for visse landbrugsprodukter (fusionsmarkedsordningen)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 361/2008 του Συμβουλίου,
    της 14ης Απριλίου 2008 , περί τροποποίησης του
    κανονισμού (ΕΚ) αριθ. 1234/2007 για τη θέσπιση κοινής
    οργάνωσης των γεωργικών αγορών και ειδικών
    διατάξεων για ορισμένα γεωργικά προϊόντα (
    ενιαίος κανονισμός ΚΟΑ )
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 361/2008, 14. aprill 2008 , millega muudetakse
    määrust (EÜ) nr 1234/2007, millega kehtestatakse põllumajandusturgude ühine
    korraldus ning mis käsitleb teatavate põllumajandustoodete erisätteid (ühise
    turukorralduse ühtne määrus)
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 361/2008, annettu 14 päivänä huhtikuuta 2008
    , maatalouden yhteisestä markkinajärjestelystä ja tiettyjä maataloustuotteita
    koskevista erityissäännöksistä annetun asetuksen (EY) N:o 1234/2007 (yhteisiä
    markkinajärjestelyjä koskeva asetus) muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 361/2008 od 14. travnja 2008. o izmjeni Uredbe
    (EZ) br. 1234/2007 o uspostavi zajedničke organizacije poljoprivrednih tržišta
    i o posebnim odredbama za određene poljoprivredne proizvode (Uredba o jedinstvenom
    ZOT-u)
  type: main
- language: hu
  script: Latn
  content: A Tanács 361/2008/EK rendelete ( 2008. április 14. ) a mezőgazdasági
    piacok közös szervezésének létrehozásáról, valamint egyes mezőgazdasági
    termékekre vonatkozó egyedi rendelkezésekről szóló 1234/2007/EK rendelet
    (az egységes közös piacszervezésről szóló rendelet) módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 361/2008 del Consiglio, del 14 aprile 2008 , che modifica
    il regolamento (CE) n. 1234/2007 recante organizzazione comune dei mercati agricoli
    e disposizioni specifiche per taluni prodotti agricoli ( regolamento unico OCM
    )
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 361/2008 ( 2008. gada 14. aprīlis ), ar kuru groza
    Regulu (EK) Nr. 1234/2007, ar ko izveido lauksaimniecības tirgu kopīgu organizāciju
    un paredz īpašus noteikumus dažiem lauksaimniecības produktiem (Vienotā TKO
    regula)
  type: main
- language: lt
  script: Latn
  content: 2008 m. balandžio 14 d. Tarybos reglamentas (EB) Nr. 361/2008, iš dalies
    keičiantis Reglamentą (EB) Nr. 1234/2007, nustatantį bendrą žemės ūkio
    rinkų organizavimą ir konkrečias tam tikriems žemės ūkio produktams taikomas
    nuostatas (Bendras bendro žemės ūkio rinkų organizavimo reglamentas)
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 361/2008 ta' l- 14 ta' April 2008 li jemenda
    r-Regolament (KE) Nru 1234/2007 li jistabbilixxi organizzazzjoni komuni ta' swieq
    agrikoli u dwar dispożizzjonijiet speċifiċi għal ċerti prodotti agrikoli
    ( Ir-Regolament Waħdieni dwar l-OKS )
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 361/2008 van de Raad van 14 april 2008 tot wijziging
    van Verordening (EG) nr. 1234/2007 houdende een gemeenschappelijke ordening van
    de landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten
    ( integrale-GMO-verordening )
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 361/2008 z dnia 14 kwietnia 2008 r. zmieniające
    rozporządzenie (WE) nr 1234/2007 ustanawiające wspólną organizację rynków
    rolnych oraz przepisy szczegółowe dotyczące niektórych produktów rolnych
    (rozporządzenie o jednolitej wspólnej organizacji rynku)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 361/2008 do Conselho, de 14 de Abril de 2008 , que
    altera o Regulamento (CE) n.° 1234/2007 que estabelece uma organização comum
    dos mercados agrícolas e disposições específicas para certos produtos agrícolas
    (Regulamento OCM única )
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 361/2008 al Consiliului din 14 aprilie 2008 de modificare
    a Regulamentului (CE) nr. 1234/2007 de instituire a unei organizări comune a
    piețelor agricole și privind dispoziții specifice referitoare la anumite produse
    agricole (Regulamentul unic OCP)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 361/2008 zo 14. apríla 2008 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1234/2007 o vytvorení spoločnej organizácie
    poľnohospodárskych trhov a o osobitných ustanoveniach pre určité poľnohospodárske
    výrobky (nariadenie o jednotnej spoločnej organizácii trhov)
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 361/2008 z dne 14. aprila 2008 o spremembi Uredbe
    Sveta (ES) št. 1234/2007 o vzpostavitvi skupne ureditve kmetijskih trgov in o
    posebnih določbah za nekatere kmetijske proizvode (Uredba o enotni SUT)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 361/2008 del Consejo, de 14 de abril de 2008 , que
    modifica el Reglamento (CE) n° 1234/2007, por el que se crea una organización
    común de mercados agrícolas y se establecen disposiciones específicas para
    determinados productos agrícolas ( Reglamento único para las OCM )
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 361/2008 av den 14 april 2008 om ändring av
    förordning (EG) nr 1234/2007 om upprättande av en gemensam organisation av jordbruksmarknaderna
    och om särskilda bestämmelser för vissa jordbruksprodukter ( förordningen
    om en samlad marknadsordning )
  type: main
