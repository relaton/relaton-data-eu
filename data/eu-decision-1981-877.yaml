title:
- language: en
  script: Latn
  content: '81/877/EEC: Commission Decision of 8 October 1981 establishing that the
    apparatus described as ''CME square wave electromagnetic flowmeter, model 501,
    with blood flow probes, model EP 1101, 5S, model EP 1102 S and model EP 1102 R''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/877/CEE: Décision de la Commission, du 8 octobre 1981, constatant
    que l''importation de l''appareil dénommé "CME square wave electromagnetic flowmeter,
    model 501, with blood flow probes, model EP 1101, 5 S, model EP 1102 S and model
    EP 1102 R" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/877/EWG: Entscheidung der Kommission vom 8. Oktober 1981, mit der festgestellt
    wird, daß das Gerät ,,CME- Square Wave Electromagnetic Flowmeter, model 501,
    with blood flow probes, model EP 1101, 5 S, model EP 1102 S and model EP 1102
    R" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '81/877/EØF: Kommissionens beslutning af 8. oktober 1981 om fastslåelse
    af, at indførsel af apparatet "CME-Square Wave Electromagnetic Flowmeter, model
    501, with blood flow probes, model EP 1101, 5S, model EP 1102 S and model EP 1102
    R" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/877/EOK: Απόφαση τής Επιτροπής τής 8ης Οκτωβρίου
    1981 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «CME-Square wave electromagnetic flowmeter, model
    501, with blood flow probes, model EP 1101, 5S, model EP 1102 S and model EP 1102
    P» δέν δύναται νά πραγματοποιηθεί ατελώς ως
    πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/877/CEE: Decisione della Commissione, dell''8 ottobre 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "CME square wave electromagnetic
    flowmeter, model 501, with blood flow probes, model EP 1101, 5 S, model EP 1102
    S and model EP 1102 R" non può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/877/EEG: Beschikking van de Commissie van 8 oktober 1981 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,CME-Square Wave Electromagnetic Flowmeter,
    model 501, with blood flow probes, model EP 1101,5S, model EP 1102 S and model
    EP 1102 R" niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
