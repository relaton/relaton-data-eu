    în ceea ce privește cererile de licențe de import, punerea în liberă circulație
    și dovada rafinării produselor din sectorul zahărului de la codul NC 1701 în
    cadrul acordurilor preferențiale, pentru anii de comercializare 2015-2016 și
    2016-2017 și de modificare a Regulamentelor (CE) nr. 376/2008 și (CE) nr. 891/2009
    ale Comisiei
  type: main
