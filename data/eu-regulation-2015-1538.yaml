  script: Latn
  content: Commission Delegated Regulation (EU) 2015/1538 of 23 June 2015 supplementing
    Regulation (EU) No 1308/2013 of the European Parliament and of the Council with
    regard to import licence applications, release for free circulation and proof
    of refining of sugar products of CN code 1701 under preferential agreements, for
    the marketing years 2015/16 and 2016/17 and amending Commission Regulations (EC)
    No 376/2008 and (EC) No 891/2009
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2015/1538 de la Commission du 23 juin 2015 complétant
    le règlement (UE) n° 1308/2013 du Parlement européen et du Conseil en ce qui
    concerne les demandes de certificat d'importation, la mise en libre pratique et
    la preuve de raffinage des produits du secteur du sucre relevant du code NC 1701
    dans le cadre d'accords préférentiels, pour les campagnes de commercialisation
    2015/2016 et 2016/2017, et modifiant les règlements de la Commission (CE) n°
    376/2008 et (CE) n° 891/2009
  type: main
- language: de
  script: Latn
