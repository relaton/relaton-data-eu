title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 784/79 of 19 April 1979 re-establishing
    the levying of customs duties on sacks and bags, of a kind used for the packing
    of goods, falling within subheadings 62.03 B I a), ex b) and ex II and originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 784/79 de la Commission, du 19 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux sacs et
    sachets d' emballage, des sous-positions tarifaires 62.03 B I a), ex b), ex II,
    originaires des pays et territoires en voie de développement bénéficiaires
    de préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 784/79 der Kommission vom 19. April 1979 zur Wiedereinführung
    des Zollsatzes für Säcke und Beutel zu Verpackungszwecken der Tarifstellen 62.03
    B I a), ex b) und ex II, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 784/79 af 19. april 1979 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage under underposition
    62.03 B I a), ex b) og ex II, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 784/79 della Commissione, del 19 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai sacchi e sacchetti
    da imballaggio delle sottovoci doganali 62.03 B I a), ex b) e ex II, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 784/79 van de Commissie van 19 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakken voor
    verpakkingsdoeleinden, van post 62.03 B I a), ex b), ex II, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3157/78 van
    de Raad tariefpreferenties werden geopend
  type: main
