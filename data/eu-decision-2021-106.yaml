title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/106 of 28 January 2021 concerning
    the extension of the action taken by the French Ministry for the Ecological Transition
    permitting the making available on the market and use of disinfection products
    containing propan-2-ol in accordance with Article 55(1) of Regulation (EU) No
    528/2012 of the European Parliament and of the Council (notified under document
    C(2021) 380) (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/106 de la Commission du 28 janvier 2021
    concernant la prorogation de la mesure du ministère français de la transition
    écologique autorisant la mise à disposition sur le marché et l’utilisation
    de produits de désinfection contenant du propan-2-ol conformément à l’article
    55, paragraphe 1, du règlement (UE) no 528/2012 du Parlement européen et du
    Conseil [notifiée sous le numéro C(2021) 380] (Le texte en langue française
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/106 der Kommission vom 28. Januar 2021
    über die Verlängerung der vom französischen Ministerium für den ökologischen
    Wandel ergriffenen Maßnahme zur Gestattung der Bereitstellung auf dem Markt und
    der Verwendung von Propan-2-ol enthaltenden Desinfektionsmitteln gemäß Artikel
    55 Absatz 1 der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments und
    des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 380) (Nur der französische
    Text ist verbindlich)
  type: main
- language: bg
