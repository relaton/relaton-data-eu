    на екологичния преход на Франция, с цел да се
    разреши предоставянето на пазара и употребата
    на продукти за дезинфекция, съдържащи пропан-2-ол,
    в съответствие с член 55, параграф 1 от Регламент
    (ЕС) № 528/2012 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2021) 380) (само текстът
    на френски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/106, ze dne 28. ledna 2021 o
    prodloužení platnosti opatření přijatého francouzským Ministerstvem pro
    ekologickou transformaci, kterým se v souladu s čl. 55 odst. 1 nařízení Evropského
    parlamentu a Rady (EU) č. 528/2012 povoluje dodávání dezinfekčních přípravků
