title:
- language: en
  script: Latn
  content: '92/467/EEC: Commission Decision of 2 September 1992 amending Decision
    90/613/EEC approving derogations provided for by Italy from certain provisions
    of Council Directive 77/93/EEC in respect of seed potatoes originating in Poland
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/467/CEE: Décision de la Commission, du 2 septembre 1992, modifiant
    la décision 90/613/CEE approuvant les dérogations prévues par l''Italie à
    certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    les plants de pommes de terre originaires de la Pologne (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/467/EWG: Entscheidung der Kommission vom 2. September 1992 zur Änderung
    der Entscheidung 90/613/EWG zur Genehmigung der von Italien für Pflanzkartoffeln
    mit Ursprung in Polen vorgesehenen Ausnahmen von bestimmten Vorschriften der Richtlinie
    77/93/EWG des Rates (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/467/EØF: Kommissionens beslutning af 2. september 1992 om ændring
    af beslutning 90/613/EØF om godkendelse af de af Italien fastsatte undtagelser
    fra visse bestemmelser i Rådets direktiv 77/93/EØF for så vidt angår laeggekartofler
    med oprindelse i Polen (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/467/ΕΟΚ: Απόφαση της Επιτροπής της 2ας Σεπτεμβρίου
    1992 για την τροποποίηση της απόφασης 90/613/ΕΟΚ
    για την έγκριση παρεκκλίσεων που προβλέπονται
    από την Ιταλία ως προς ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου όσον αφορά
    τους σπόρους γεωμήλων προς φύτευση, καταγωγής
    Πολωνίας (Το κείμενο στην ιταλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '92/467/CEE: Decisione della Commissione, del 2 settembre 1992, recante
    modifica alla decisione 90/613/CEE che approva le deroghe, previste dall''Italia,
    a talune disposizioni della direttiva 77/93/CEE per quanto riguarda i tuberi-seme
    di patata originari della Polonia (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '92/467/EEG: Beschikking van de Commissie van 2 september 1992 tot wijziging
    van Beschikking 90/613/EEG tot goedkeuring van de door Italië vastgestelde afwijkingen
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad ten aanzien van pootaardappelen
    van oorsprong uit Polen (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/467/CEE: Decisão da Comissão, de 2 de Setembro de 1992, que altera
    a Decisão 90/613/CEE que aprova as derrogações, previstas pela Itália, a determinadas
    normas da Directiva 77/93/CEE do Conselho em relação à batata de semente originária
    da Polónia (Apenas faz fé o texto em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '92/467/CEE: Decisión de la Comisión, de 2 de septiembre de 1992, que
