    della categoria di prodotti n. 111 (numero d'ordine 40.1110), originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 4259/88
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3952/89 VAN DE COMMISSIE van 27 december 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kampeerartikelen
    van de categorie van produkten nr. 111 (volgnummer 40.1110), van oorsprong uit
    Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 4259/88 van de Raad
  type: main
