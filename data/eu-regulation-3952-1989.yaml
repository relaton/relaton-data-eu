title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3952/89 of 27 December 1989 re-establishing
    the levying of customs duties on camping goods, products of category 111 (order
    No 40.1110), originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3952/89 de la Commission du 27 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux articles
    de campement de la catégorie de produits n° 111 (numéro d'ordre 40.1110), originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3952/89 DER KOMMISSION vom 27. Dezember 1989 ueber
    die Wiedereinfuehrung des Zollsatzes fuer Zeltlagerausruestungen der Warenkategorie
    Nr. 111 (lfd. Nr. 40.1110) mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3952/89 af 27. december 1989 om genindførelse
    af opkrævning af toldafgifter for lejrudstyr under varekategori 111 (løbenummer
    40.1110), som har oprindelse i Brasilien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3952/89 της Επιτροπής
