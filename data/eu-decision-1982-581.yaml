  content: '82/581/EEC: Commission Decision of 6 August 1982 establishing that the
    apparatus described as ''Nicolet - Fourier Transform Infrared System, model 7199''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/581/CEE: Décision de la Commission, du 6 août 1982, constatant que
    l''importation de l''appareil dénommé "Nicolet - Fourier Transform Infrared
    System, model 7199" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/581/EWG: Entscheidung der Kommission vom 6. August 1982, mit der festgestellt
    wird, daß das Gerät ,,Nicolet-Fourier Transform Infrared System, model 7199"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/581/EØF: Kommissionens beslutning af 6. august 1982 om fastslåelse
    af, at indførsel af apparatet "Nicolet- Fourier Transform Infrared System, model
    7199" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
