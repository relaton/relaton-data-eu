- language: en
  script: Latn
  content: '80/1019/EEC: Commission Decision of 15 October 1980 authorizing the Italian
    Republic not to apply Community treatment to cross-country lorries originating
    in Japan (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1019/CEE: Décision de la Commission, du 15 octobre 1980, autorisant
    la République italienne à exclure du traitement communautaire les camions "tout
    terrain" originaires du Japon (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/1019/EWG: Entscheidung der Kommission vom 15. Oktober 1980 zur Ermächtigung
    der Italienischen Republik, aus Japan stammende Gelände-Lastkraftwagen von der
    Gemeinschaftsbehandlung auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1019/EØF: Kommissionens beslutning af 15. oktober 1980 om bemyndigelse
