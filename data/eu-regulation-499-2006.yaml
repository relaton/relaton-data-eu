    (EG) Nr. 769/2002 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren von Kumarin mit Ursprung in der Volksrepublik China durch die Einfuhren
    von aus Indonesien und Malaysia versandtem Kumarin, ob als Ursprungserzeugnis
    Indonesiens und Malaysias angemeldet oder nicht, und zur zollamtlichen Erfassung
    der letztgenannten Einfuhren
  type: main
