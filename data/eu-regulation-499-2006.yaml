title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 499/2006 of 28 March 2006 on initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 769/2002 on imports of coumarin originating in the
    People's Republic of China by imports of coumarin consigned from Indonesia and
    Malaysia, whether declared as originating in Indonesia and Malaysia or not, and
    making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 499/2006 de la Commission du 28 mars 2006 portant ouverture
    d'une enquête sur un éventuel contournement des mesures antidumping instituées
    par le règlement (CE) n o 769/2002 du Conseil sur les importations de coumarine
    originaire de la République populaire de Chine par des importations de coumarine
    expédiée de l'Indonésie et de la Malaisie, qu'elle ait ou non été déclarée
    originaire de ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 499/2006 der Kommission vom 28. März 2006 zur Einleitung
