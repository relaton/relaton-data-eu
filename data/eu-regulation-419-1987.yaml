  content: Commission Regulation (EEC) No 419/87 of 11 February 1987 amending Regulation
    (EEC) No 2382/86 as regards the countervailing charges to be imposed where the
    minimum import price for dried grapes is not observed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 419/87 de la Commission du 11 février 1987 modifiant
    le règlement (CEE) n° 2382/86 en ce qui concerne les taxes compensatoires à
    percevoir dans les cas où le prix minimal à l' importation, applicable aux raisins
    secs, n' est pas respecté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 419/87 der Kommission vom 11. Februar 1987 zur Änderung
    der Verordnung (EWG) Nr. 2382/86 zur Festsetzung des Mindesteinfuhrpreises für
    getrocknete Weintrauben und der im Falle der Nichteinhaltung dieses Preises zu
    erhebenden Ausgleichsabgabe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 419/87 af 11. februar 1987 om ændring
    af forordning (EØF) nr. 2382/86 for så vidt angår den udligningsafgift, der
    skal opkræves, hvis minimumsimportprisen for tørrede druer ikke overholdes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 419/87 της Επιτροπής
