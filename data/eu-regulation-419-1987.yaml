    (ΕΟΚ) αριθ. 2382/86 όσον αφορά τις εξισωτικές εισφορές
    που επιβάλλονται στις σταφίδες όταν δεν τηρείται
    η ελάχιστη τιμή εισαγωγής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 419/87 della Commissione dell' 11 febbraio 1987 che
    modifica il regolamento (CEE) n. 2382/86 per quanto concerne la tassa di compensazione
    applicabile qualora il prezzo minimo all' importazione per le uve secche non sia
    rispettato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 419/87 van de Commissie van 11 februari 1987 tot
    wijziging van Verordening (EEG) nr. 2382/86 ten aanzien van de compenserende heffingen
    bij niet-inachtneming van de minimumprijs bij invoer van krenten en rozijnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 419/87 da Comissão de 11 de Fevereiro de 1987 que
