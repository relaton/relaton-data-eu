title:
- language: en
  script: Latn
  content: '92/494/EEC: Commission Decision of 12 October 1992 accepting an undertaking
    in connection with the anti-dumping proceeding concerning imports on certain types
    of electronic microcircuits known as DRAMs (dynamic random access memories) originating
    in Japan, and terminating the investigation with regard to the producer in question'
  type: main
- language: fr
  script: Latn
  content: '92/494/CEE: Décision de la Commission, du 12 octobre 1992, portant acceptation
    d'' un engagement offert dans le cadre de la procédure antidumping concernant
    les importations de certains types de microstructures électroniques, dites "DRAM"
    (dynamic random access memories), originaires du Japon, et portant clôture de
    l'' enquête en ce qui concerne le producteur en cause'
  type: main
- language: de
  script: Latn
  content: '92/494/EWG: Beschluß der Kommission vom 12. Oktober 1992 über die Annahme
    einer Verpflichtung im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    bestimmter elektronischer Mikroschaltungen, sogenannter DRAMs (dynamische Schreib-
    Lesespeicher), mit Ursprung in Japan und über die Einstellung des Verfahrens
    gegenüber dem betreffenden Hersteller'
  type: main
- language: da
  script: Latn
  content: '92/494/EØF: Kommissionens afgørelse af 12. oktober 1992 om godtagelse
    af et tilsagn i forbindelse med antidumpingproceduren vedrørende importen af
    visse typer elektroniske mikrokredsløb, såkaldte DRAMs (Dynamic Random Access
    Memories) med oprindelse i Japan og om afslutning af undersøgelsen for den pågældende
    producents vedkommende'
  type: main
- language: el
  script: Grek
  content: '92/494/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Οκτωβρίου 1992 περί αποδοχής ανάληψης υποχρέωσης
    σχετικά με τη διαδικασία αντιντάμπινγκ όσον
    αφορά τις εισαγωγές ορισμένων τύπων ηλεκτρονικών
    μικροκυκλωμάτων γνωστών ως DRAM (δυναμικές μνήμες
    τυχαίας προσπέλασης), καταγωγής Ιαπωνίας και
    περί περατώσεως της έρευνας όσον αφορά τον
    ενδιαφερόμενο παραγωγό'
  type: main
- language: it
  script: Latn
  content: '92/494/CEE: Decisione della Commissione, del 12 ottobre 1992, relativa
    all'' accettazione di un impegno offerto da un produttore nell'' ambito del procedimento
    antidumping concernente le importazioni di alcuni tipi di microcircuiti elettronici
    detti "DRAM" (memorie dinamiche ad accesso casuale), originari del Giappone e
    alla chiusura dell'' inchiesta nei confronti di tale produttore'
  type: main
- language: nl
  script: Latn
  content: '92/494/EEG: Besluit van de Commissie van 12 oktober 1992 tot aanvaarding
    van een verbintenis in verband met de anti-dumpingprocedure betreffende de invoer
    van bepaalde soorten elektronische microschakelingen, bekend als DRAM'' s (Dynamic
    Random Access Memories), van oorsprong uit Japan, en tot beëindiging van het
    onderzoek met betrekking tot de betrokken producent'
  type: main
- language: pt
  script: Latn
  content: '92/494/CEE: Decisão da Comissão, de 12 de Outubro de 1992, que aceita
    um compromisso no âmbito do processo anti-dumping relativo às importações
    de determinados tipos de microcircuitos electrónicos conhecidos por DRAM (memórias
    dinâmicas de acesso directo) originárias do Japão, e que encerra o inquérito
    relativamente ao produtor em questão'
  type: main
- language: es
  script: Latn
  content: '92/494/CEE: Decisión de la Comisión, de 12 de octubre de 1992, por la
    que se acepta un compromiso en relación con el procedimiento antidumping relativo
    a las importaciones de determinados tipos de microcircuitos electrónicos conocidos
    como DRAMS (memorias dinámicas de acceso aleatorio) originarios de Japón, y
    por la que se da por concluida la investigación respecto al fabricante en cuestión'
