title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1854/73 of the Commission of 9 July 1973 re-establishing
    Common Customs Tariff duties on men' s and boys' under garments, including collars,
    shirt fronts and cuffs of cotton falling within heading No ex 61.03, originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2764/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1854/73 de la Commission, du 9 juillet 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessous (linge de corps) pour hommes et garçonnets, y compris
    les cols, faux-cols, plastrons et manchettes, de coton, de la position tarifaire
    ex 61.03, originaires de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2764/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1854/73 der Kommission vom 9. Juli 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Unterkleidung
    (Leibswäsche) für Männer und Knaben, auch Kragen, Vorhemden und Manschetten,
    aus Baumwolle, der Tarifnummer ex 61.03, mit Ursprung in Indien, dem die in der
    Verordnung (EWG) Nr. 2764/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1854/73 af 9. juli 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for underbeklædningsgenstande til mænd
    og drenge (herunder flipper, skjortebryster og manchetter), af bomuld under position
    ex 61.03, som har oprindelse i Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1854/73 della Commissione, del 9 luglio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili a
    sottovesti (biancheria da dosso) per uomo e per ragazzo, compresi i colli, colletti,
    sparati e polsini, di cotone, della voce doganale n. ex 61.03 originari dell'
    India, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2764/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1854/73 van de Commissie van 9 juli 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op herenonderkleding en jongensonderkleding, kragen, boorden, fronten
    en manchetten daaronder begrepen, van katoen, van post ex 61.03, van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2764/72 van de Raad van 19 december 1972
  type: main
