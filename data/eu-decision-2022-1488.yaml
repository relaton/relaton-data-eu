---
id: EUDecision20221488
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1488 of 7 September 2022 postponing
    the expiry date of the approval of K-HDO for use in biocidal products of product-type
    8 in accordance with Regulation (EU) No 528/2012 of the European Parliament and
    of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1488 de la Commission du 7 septembre
    2022 reportant la date d’expiration de l’approbation du K-HDO en vue de son
    utilisation dans les produits biocides relevant du type de produits 8, conformément
    au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1488 der Kommission vom 7. September
    2022 zur Verschiebung des Ablaufdatums der Genehmigung von K-HDO zur Verwendung
    in Biozidprodukten der Produktart 8 gemäß der Verordnung (EU) Nr. 528/2012 des
    Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2022/1488 на Комисията
    от 7 септември 2022 година за отлагане на датата
    на изтичане на срока на одобрението на K-HDO за
    употреба в биоциди от продуктов тип 8 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1488 ze dne 7. září 2022,
    kterým se odkládá datum skončení platnosti schválení K-HDO pro použití
    v biocidních přípravcích typu 8 v souladu s nařízením Evropského parlamentu
    a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1488 af 7. september
    2022 om forlængelse af godkendelsen af K-HDO til anvendelse i biocidholdige produkter
    af produkttype 8, jf. Europa-Parlamentets og Rådets forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1488 της Επιτροπής
    της 7ης Σεπτεμβρίου 2022 για τη μετάθεση της ημερομηνίας
    λήξης της έγκρισης του K-HDO για χρήση σε βιοκτόνα
    του τύπου προϊόντων 8 σύμφωνα με τον κανονισμό
    (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1488, 7. september 2022, millega lükatakse
    edasi tooteliiki 8 kuuluvates biotsiidides tsükloheksüülhüdroksüdiaseen-1-oksiidi
    kaaliumisoola (K-HDO) kasutamise heakskiidu aegumiskuupäeva vastavalt Euroopa
    Parlamendi ja nõukogu määrusele (EL) nr 528/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1488, annettu 7 päivänä
    syyskuuta 2022, K-HDO:n käyttöä valmisteryhmään 8 kuuluvissa biosidivalmisteissa
    koskevan hyväksymisen voimassaolon päättymispäivän lykkäämisestä Euroopan
    parlamentin ja neuvoston asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1488 ón gCoimisiún an 7 Meán Fómhair
    2022 lena gcuirtear ar atráth dáta éaga an fhormheasa maidir le K-HDO lena
    úsáid i dtáirgí bithicídeacha de chineál táirge 8 i gcomhréir le Rialachán
    (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1488 оd 7. rujna 2022. o odgodi isteka
    odobrenja proizvoda K-HDO za uporabu u biocidnim proizvodima vrste 8 u skladu
    s Uredbom (EU) br. 528/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1488 végrehajtási határozata (2022. szeptember
    7.) a K-HDO 8. terméktípusba tartozó biocid termékekben történő felhasználására
    vonatkozó jóváhagyás érvényességi idejének az 528/2012/EU európai parlamenti
    és tanácsi rendelettel összhangban történő meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1488 della Commissione del 7 settembre
    2022 che posticipa la data di scadenza dell'approvazione del K-HDO ai fini del
    suo uso nei biocidi del tipo di prodotto 8 in conformità al regolamento (UE)
    n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1488 (2022. gada 7. septembris),
    ar ko uz vēlāku laiku pārceļ datumu, līdz kuram lietošanai 8. produkta veida
    biocīdos saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 528/2012
    ir apstiprināts K-HDO
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1488 2022 m. rugsėjo 7 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 528/2012 nukeliama
    patvirtinimo, kad K-HDO galima naudoti 8-o tipo biocidiniams produktams gaminti,
    galiojimo pabaigos data
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1488 tas-7
    ta’ Settembru 2022 li tipposponi d-data tal-iskadenza tal-approvazzjoni tal-K-HDO
    għall-użu fil-prodotti bijoċidali tat-tip ta’ prodott 8 f’konformità mar-Regolament
    (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1488 van de Commissie van 7 september 2022
    tot verlenging van de termijn voor het verstrijken van de goedkeuring van K-HDO
    voor gebruik in biociden van productsoort 8 overeenkomstig Verordening (EU) nr.
    528/2012 van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1488 z dnia 7 września 2022 r. przedłużająca
    ważność zatwierdzenia K-HDO do stosowania w produktach biobójczych należących
    do grupy produktowej 8 zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady
    (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1488 da Comissão de 7 de setembro de
    2022 que prorroga a validade da aprovação do K-HDO para utilização em produtos
    biocidas do tipo 8, em conformidade com o Regulamento (UE) n.o 528/2012 do Parlamento
    Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1488 a Comisiei din 7 septembrie
    2022 de amânare a datei expirării aprobării substanței K-HDO pentru a fi utilizată
    în produse biocide aparținând tipului de produs 8 în conformitate cu Regulamentul
    (UE) nr. 528/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1488 zo 7. septembra 2022,
    ktorým sa v súlade s nariadením Európskeho parlamentu a Rady (EÚ) č. 528/2012
    odkladá dátum skončenia platnosti schválenia K-HDO na použitie v biocídnych
    výrobkoch typu 8
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1488 z dne 7. septembra 2022 o odložitvi
    datuma izteka odobritve K-HDO za uporabo v biocidnih proizvodih vrste proizvodov
    8 v skladu z Uredbo (EU) št. 528/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1488 de la Comisión de 7 de septiembre
    de 2022 por la que se retrasa la fecha de expiración de la aprobación del K-HDO
    para su uso en biocidas del tipo de producto 8, de conformidad con el Reglamento
    (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1488 av den 7 september 2022
    om senareläggande av det datum då godkännandet av K-HDO för användning i
    biocidprodukter i produkttyp 8 löper ut i enlighet med Europaparlamentets och
    rådets förordning (EU) nr 528/2012
  type: main
