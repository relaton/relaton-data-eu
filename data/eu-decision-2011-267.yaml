title:
- language: en
  script: Latn
  content: '2011/267/EU: Commission Implementing Decision of 3 May 2011 amending Decision
    2004/211/EC as regards the entry for South Africa in the list of third countries
    and parts thereof from which the introduction into the European Union of live
    equidae and semen, ova and embryos of the equine species are authorised (notified
    under document C(2011) 2959)'
  type: main
- language: fr
  script: Latn
  content: '2011/267/UE: Décision d’exécution de la Commission du 3 mai 2011 modifiant
    la décision 2004/211/CE en ce qui concerne la mention relative à l’Afrique
    du Sud figurant dans la liste des pays tiers et des parties de ce pays en provenance
    duquel l’introduction dans l’Union européenne d’équidés vivants et de
    sperme, d’ovules et d’embryons de l’espèce équine est autorisée [notifiée
    sous le numéro C(2011) 2959]'
  type: main
- language: de
  script: Latn
