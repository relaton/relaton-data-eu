    70 (Kennziffer 40.0700) mit Ursprung in Sri Lanka, dem die in der Verordnung (EWG)
    Nr. 3600/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3785/86 af 10. december 1986 om genindførelse
    af opkrævning af toldafgifter for strømpebenklæder, under varekategori nr.
    70 (kode 40.0700), som har oprindelse i Sri Lanka og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3600/85
  type: main
- language: el
  script: Grek
