  content: Commission Regulation (EEC) No 3785/86 of 10 December 1986 re-establishing
    the levying of customs duties on panty-hose (tights), products of category 70
    (code 40.0700), originating in Sri Lanka, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3785/86 de la Commission du 10 décembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux bas-culottes,
    communément appelés collants, de la catégorie de produits n° 70 (code 40.0700),
    originaires de Sri Lanka, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
