title:
- language: en
  script: Latn
  content: Commission Directive 2007/19/EC of 30 March 2007 amending Directive 2002/72/EC
    relating to plastic materials and articles intended to come into contact with
    food and Council Directive 85/572/EEC laying down the list of simulants to be
    used for testing migration of constituents of plastic materials and articles intended
    to come into contact with foodstuffs
  type: main
- language: fr
  script: Latn
  content: Directive 2007/19/CE de la Commission du 30 mars 2007 portant modification
    de la directive 2002/72/CE concernant les matériaux et objets en matière plastique
    destinés à entrer en contact avec les denrées alimentaires et de la directive
    85/572/CEE du Conseil fixant la liste des simulants à utiliser pour vérifier
    la migration des constituants des matériaux et objets en matière plastique destinés
    à entrer en contact avec les denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 2007/19/EG der Kommission vom 30. März 2007 zur Änderung der
    Richtlinie 2002/72/EG über Materialien und Gegenstände aus Kunststoff, die dazu
    bestimmt sind, mit Lebensmitteln in Berührung zu kommen, und der Richtlinie 85/572/EWG
    des Rates über die Liste der Simulanzlösemittel für die Migrationsuntersuchungen
    von Materialien und Gegenständen aus Kunststoff, die dazu bestimmt sind, mit
    Lebensmitteln in Berührung zu kommen
  type: main
- language: bg
  script: Cyrl
  content: Директива 2007/19/EO на Комисията от 30 март
    2007 година за изменение на Директива 2002/72/ЕО
    относно материали и предмети от пластмаси,
    предназначени за контакт с храни, и на Директива
    85/572/ЕИО на Съвета за определяне на списък на
    симуланти, които да бъдат използвани за изпитване
    на миграцията на съставките на пластмасовите
    материали и предмети, предназначени за контакт
    с храни
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2007/19/ES ze dne 30. března 2007 , kterou se mění
    směrnice 2002/72/ES o materiálech a předmětech z plastů určených pro styk
    s potravinami a směrnice Rady 85/572/EHS, kterou se stanoví seznam simulantů
    pro použití při zkoušení migrace složek materiálů a předmětů z plastů
    určených pro styk s potravinami
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2007/19/EF af 30. marts 2007 om ændring af direktiv
    2002/72/EF om plastmaterialer og -genstande bestemt til at komme i berøring med
    levnedsmidler og af Rådets direktiv 85/572/EØF om fastsættelse af listen over
    simulatorer, der skal anvendes ved kontrol med migration af bestanddele fra plastmaterialer
    og -genstande, der er bestemt til at komme i berøring med levnedsmidler
  type: main
- language: el
  script: Grek
