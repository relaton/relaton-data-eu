    de stabilire a listei de simulanți utilizați pentru testarea migrării constituenților
    materialelor și obiectelor din material plastic care vin în contact cu produsele
    alimentare
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2007/19/ES z 30. marca 2007 , ktorou sa mení a dopĺňa
