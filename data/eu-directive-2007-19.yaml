    2007 , για την τροποποίηση της οδηγίας 2002/72/ΕΚ
    σχετικά με τα πλαστικά υλικά και αντικείμενα
    που προορίζονται να έρθουν σε επαφή με τρόφιμα
    και της οδηγίας 85/572/ΕΟΚ του Συμβουλίου για
