    jiġu f’kuntatt ma’ oġġetti ta’ l-ikel u d-Direttiva tal-Kunsill 85/572/KEE
    li tistabbilixxi l-lista tas-simulanti sabiex jintużaw għat-testijiet tal-migrazzjoni
    tal-kostitwenti tal-materjali u l-oġġetti tal-plastik maħsuba biex jidħlu
    f’kuntatt ma’ l-oġġetti ta’ l-ikel
  type: main
