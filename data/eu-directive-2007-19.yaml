  script: Latn
  content: Direktiva Komisije 2007/19/EZ od 2. travnja 2007. o izmjeni Direktive 2002/72/EZ
    o plastičnim materijalima i predmetima koji dolaze u dodir s hranom i Direktive
    Vijeća 85/572/EEZ o utvrđivanju popisa modelnih otopina za ispitivanje migracije
    sastojaka plastičnih materijala i predmeta koji dolaze u dodir s hranom
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2007/19/EK irányelve ( 2007. március 30. ) az élelmiszerekkel
    rendeltetésszerűen érintkezésbe kerülő műanyagokról és műanyag tárgyakról
    szóló 2002/72/EK irányelv és az élelmiszerekkel rendeltetésszerűen érintkezésbe
    kerülő műanyagok és műanyag tárgyak komponensei kioldódásának vizsgálatához
    alkalmazndó élelmiszer-utánzó modellanyagok listájának megállapításáról
    szóló 85/572/EGK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2007/19/CE della Commissione, del 30 marzo 2007 , che modifica
    la direttiva 2002/72/CE relativa ai materiali e agli oggetti di materia plastica
    destinati a venire a contatto con i prodotti alimentari e la direttiva 85/572/CEE
    del Consiglio che fissa l'elenco dei simulanti da impiegare per la verifica della
    migrazione dei costituenti dei materiali e degli oggetti di materia plastica destinati
    a venire a contatto con i prodotti alimentari
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2007/19/EK ( 2007. gada 30. marts ), ar ko groza Direktīvu
    2002/72/EK, kas attiecas uz plastmasas materiāliem un izstrādājumiem, kuri
    paredzēti saskarei ar pārtikas produktiem, un Padomes Direktīvu 85/572/EEK,
    ar ko nosaka sarakstu, kur uzskaitīti aizstājēji, kas izmantojami, lai pārbaudītu
    tādu plastmasas materiālu un izstrādājumu sastāvdaļu migrāciju, kas paredzēti
    saskarei ar pārtikas produktiem
  type: main
- language: lt
  script: Latn
  content: 2007 m. kovo 30 d. Komisijos direktyva 2007/19/EB, iš dalies keičianti
    Direktyvą 2002/72/EB dėl plastikinių medžiagų ir gaminių, galinčių liestis
    su maisto produktais, ir Tarybos direktyvą 85/572/EEB, sudarančią modelinių
    tirpalų, naudojamų sudedamųjų dalių išsiskyrimui iš plastikinių medžiagų
    ir gaminių, galinčių liestis su maisto produktais, tirti, sąrašą
  type: main
- language: mt
  script: Latn
