    40.0270 und 40.0720) mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3089/92 af 27. oktober 1992 om genindførelse
