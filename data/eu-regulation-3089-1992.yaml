  content: Commission Regulation (EEC) No 3089/92 of 27 October 1992 re- establishing
    the levying of customs duties on products of categories No 19, 27 and 72 (order
    Nos 40.0190, 40.0270 and 40.0720), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3089/92 de la Commission, du 27 octobre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 19, 27 et 72 (numéros d' ordre 40.0190, 40.0270 et 40.0720) originaires
    d' Inde, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
