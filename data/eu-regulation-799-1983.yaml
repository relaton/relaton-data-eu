  content: Commission Regulation (EEC) No 799/83 of 29 March 1983 amending Annexes
    5 and 8 to Council Regulation (EEC) No 574/72 laying down the procedure for implementing
    Regulation (EEC) No 1408/71 on the application of social security schemes to employed
    persons, to self-employed persons and to their families moving within the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 799/83 de la Commission du 29 mars 1983 modifiant les
    annexes 5 et 8 du règlement (CEE) no 574/72 du Conseil fixant les modalités
    d' application du règlement (CEE) no 1408/71 relatif à l' application des régimes
    de sécurité sociale aux travailleurs salariés, aux travailleurs non salariés
    et aux membres de leur famille qui se déplacent à l' intérieur de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 799/83 der Kommission vom 29. März 1983 zur Änderung
    der Anhänge 5 und 8 der Verordnung (EWG) Nr. 574/72 des Rates über die Durchführung
    der Verordnung (EWG) Nr. 1408/71 zur Anwendung der Systeme der sozialen Sicherheit
    auf Arbeitnehmer und Selbständige sowie deren Familienangehörige, die innerhalb
    der Gemeinschaft zu- und abwandern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 799/83 af 29. marts 1983 om ændring
