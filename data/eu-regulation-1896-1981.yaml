- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1896/81 of 9 July 1981 re-establishing the
    levying of customs duties on melamine, falling within subheading 29.35 ex Q and
    originating in Kuwait, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1896/81 de la Commission, du 9 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position 29.35 ex Q du tarif douanier commun, originaire de Koweit,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3322/80 du Conseil
  type: main
- language: de
  script: Latn
