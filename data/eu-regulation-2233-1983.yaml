title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2233/83 of 3 August 1983 re-establishing
    the levying of customs duties on dodecylbenzene, falling within subheading 38.19
    ex E and originating in Argentina, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2233/83 de la Commission du 3 août 1983 portant rétablissement
    de la perception des droits de douane applicables au dodécylbenzène, de la sous-position
    38.19 ex E du tarif douanier commun, originaire d' Argentine, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2233/83 der Kommission vom 3. August 1983 zur Wiedereinführung
