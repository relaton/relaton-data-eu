    que determina as regras de exportação de manteiga de intervenção com fins
    sociais para países em vias de desenvolvimento
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3089/87 de la Comisión de 15 de octubre de 1987 por
