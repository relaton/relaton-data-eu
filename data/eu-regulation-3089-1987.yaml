    der Ausfuhr von Butter aus Beständen der Interventionsstelle zu Wohlfahrtszwecken
    nach Entwicklungsländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3089/87 af 15. oktober 1987 om ændring
    af visse frister, der er anført i forordning (EØF) nr. 2262/87 om fastsættelse
    af de nærmere regler for udførsel til udviklingslande af interventionssmør
    til sociale formål
  type: main
- language: el
  script: Grek
