  content: Commission Regulation (EEC) No 3089/87 of 15 October 1987 altering certain
    time limits given in Regulation (EEC) No 2262/87 laying down rules applying to
    the export of intervention butter for social use in developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3089/87 de la Commission du 15 octobre 1987 modifiant
