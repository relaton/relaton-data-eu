    χώρες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3089/87 della Commissione del 15 ottobre 1987 che
    modifica alcune scadenze figuranti nel regolamento (CEE) n. 2262/87 che determina
    le modalità di esportazione di burro d' intervento a destinazione sociale nei
    paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3089/87 van de Commissie van 15 oktober 1987 houdende
