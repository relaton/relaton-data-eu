title:
- language: en
  script: Latn
  content: '79/221/EEC: Commission Decision of 7 February 1979 authorizing the French
    Republic not to apply Community treatment to woven fabrics of synthetic fibres,
    discontinuous, unbleached or bleached, falling within subheading ex 56.07 A of
    the Common Customs Tariff (NIMEXE codes 56.07-01, 04, 05, 07, 08, 11, 13, 14,
    16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) (category 3), originating
    in Romania and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/221/CEE: Décision de la Commission, du 7 février 1979, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles synthétiques discontinues, écrus ou blanchis, de la sous-position
    ex 56.07 A du tarif douanier commun (codes Nimexe: 56.07-01, 04, 05, 07, 08, 11,
    13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) catégorie 3, originaires
    de Roumanie et mis en libre pratique dans les autres Etats membres (Le texte en
    langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/221/EWG: Entscheidung der Kommission vom 7. Februar 1979, mit der die
    Französische Republik ermächtigt wird, aus Rumänien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern,
    roh oder gebleicht, der Tarifstelle ex 56.07 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern:
    56.07-01; 04; 05; 07; 08; 11; 13; 14; 16; 17; 18; 21; 23; 24; 26; 27; 28; 32;
    33; 34; 36) (Kategorie 3) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/221/EØF: Kommissionens beslutning af 7. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af korte kemofibre, syntetiske ublegede og blegede, som henhører under pos. ex
    56.07 A i den fælles toldtarif (NIMEXE- nummer 56.07-01, 04, 05, 07, 08, 11,
    13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) kategori 3, har oprindelse
    i Rumænien og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/221/CEE: Decisione della Commissione, del 7 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di fibre
    tessili sintetiche in fiocco, greggi o imbianchiti, della sottovoce ex 56.07 A
    della tariffa doganale comune (codice Nimexe: 56.07-01; 04; 05; 07; 08; 11; 13;
    14; 16; 17; 18; 21; 23; 24; 26; 27; 28; 32; 33; 34; 36) (categoria 3), originari
    della Romania e messi in libera pratica negli altri Stati membri (Il testo in
    lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/221/EEG: Beschikking van de Commissie van 7 februari 1979 waarbij de
    Franse Republiek wordt gemachtigd weefsels van synthetische stapelvezels, ongebleekt
    of gebleekt, van post ex 56.07 A van het gemeenschappelijk douanetarief (NIMEXE-code
    56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32,
    33, 34, 36) (categorie 3), van oorsprong uit Roemenië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
