id: EUDecision1976313
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 December 1975 authorizing the Italian Republic
    not to apply Community treatment to men's, women's and infants' jerseys falling
    within heading No ex 60.05 of the Common Customs Tariff, originating in Taiwan
    and in free circulation in France
  type: main
- language: fr
  script: Latn
  content: '76/313/CEE: Décision de la Commission, du 17 décembre 1975, autorisant
    la République italienne à exclure du traitement communautaire les chandails
    pour hommes, femmes et jeunes enfants, de la position Ex 60.05 du Tarif douanier
    commun, originaires de Taiwan et mis en libre pratique en France'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. Dezember 1975, mit der die Italienische
    Republik ermächtigt wird, aus Taiwan stammende und in Frankreich im freien Verkehr
    befindliche Pullover für Männer, Frauen und Kinder, der Tarifnummer ex 60.05
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. december 1975 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage sweatere til mænd, kvinder
    og småbørn, som henhører under pos. 60.05 i den fælles toldtarif, har oprindelse
    i Taiwan, og frit kan omsættes i Frankrig
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 dicembre 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le maglie per uomo, donna e
    bambini della voce ex 60.05 della tariffa doganale comune, originari di Taiwan
    e messi in libera pratica in Francia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 december 1975 waarbij de Italiaanse
    Republiek wordt gemachtigd truien voor heren, dames en kinderen van post ex 60.05
    van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan die in Frankrijk
    in het vrije verkeer worden gebracht van de communautaire behandeling uit te sluiten
  type: main
