title:
- language: en
  script: Latn
  content: '97/362/EC: Commission Decision of 21 May 1997 recognizing in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of carfentrazone-ethyl, fosthiazate and fluthiamide in
    Annex I to Council Directive 91/414/EEC concerning the placing of plant protection
    products on the market'
  type: main
- language: fr
  script: Latn
  content: '97/362/CE: Décision de la Commission du 21 mai 1997 reconnaissant en
    principe la conformité des dossiers transmis pour examen détaillé en vue de
    l''inscription du carfentrazone-éthyl, du fosthiasate et du fluthiamide dans
    l''annexe I de la directive 91/414/CEE du Conseil concernant la mise sur le marché
    des produits phytopharmaceutiques'
  type: main
- language: de
  script: Latn
