  content: Règlement (CEE) n° 1017/69 du Conseil, du 28 mai 1969, portant une nouvelle
    prorogation, pour l'année 1968, du délai prévu par l'article 20 paragraphe
    1 du règlement n 17/64/CEE relatif aux conditions du concours du Fonds européen
    d'orientation et de garantie agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1017/69 des Rates vom 28. Mai 1969 über eine weitere
    Verlängerung der in Artikel 20 Absatz 1 der Verordnung Nr. 17/64/EWG über die
    Bedingungen für die Beteiligung des Europäischen Ausrichtungs- und Garantiefonds
    für die Landwirtschaft vorgesehenen Frist für das Jahr 1968
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1017/69 del Consiglio, del 28 maggio 1969, che proroga
    ulteriormente per il 1968 il termine previsto dall'articolo 20, paragrafo 1, del
    regolamento n. 17/64/CEE, relativo alle condizioni di concorso del Fondo europeo
    agricolo di orientamento e di garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1017/69 van de Raad van 28 mei 1969 houdende verdere
