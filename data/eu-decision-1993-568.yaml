    16 Ιουνίου 1993 έως τις 15 Ιουνίου 1995'
  type: main
- language: it
  script: Latn
  content: '93/568/CEE: DECISIONE DEL CONSIGLIO del 29 ottobre 1993 concernente la
    conclusione dell'' accordo in forma di scambio di lettere relativo all'' applicazione
    provvisoria del protocollo che fissa le possibilità di pesca e la compensazione
    finanziaria previste nell'' accordo tra la Comunità economica europea ed il governo
