    af de fiskerimuligheder og den finansielle godtgørelse, der er omhandlet i aftalen
    mellem Det Europæiske Økonomiske Fællesskab og regeringen for Republikken Guinea-Bissau
    om fiskeri ud for Guinea-Bissaus kyst, for perioden 16. juni 1993 til 15. juni
    1995'
  type: main
- language: el
  script: Grek
  content: '93/568/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 29ης
    Οκτωβρίου 1993 σχετικά με τη σύναψη συμφωνίας
    υπό μορφή ανταλλαγής επιστολών για την προσωρινή
    εφαρμογή του πρωτοκόλλου για τον καθορισμό
    των δυνατοτήτων αλιείας και της χρηματικής
    αντιστάθμισης που προβλέπονται στη συμφωνία
