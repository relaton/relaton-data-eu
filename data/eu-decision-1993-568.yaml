title:
- language: en
  script: Latn
  content: '93/568/EEC: Council Decision of 29 October 1993 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol establishing for the period 16 June 1993 to 15 June 1995 the fishing
    rights and financial compensation provided for in the Agreement between the European
    Economic Community and the Government of the Republic of Guinea-Bissau on fishing
    off the coast of Guinea-Bissau'
  type: main
- language: fr
  script: Latn
  content: '93/568/CEE: Décision du Conseil du 29 octobre 1993 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée-Bissau concernant la pêche au large de la Guinée-Bissau,
    pour la période allant du 16 juin 1993 au 15 juin 1995'
  type: main
- language: de
  script: Latn
  content: '93/568/EWG: BESCHLUSS DES RATES vom 29. Oktober 1993 über den Abschluß
    des Abkommens in Form eines Briefwechsels über die vorläufige Anwendung des
    Protokolls zur Festsetzung der Fangmöglichkeiten und des finanziellen Ausgleichs
    nach dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Republik Guinea-Bissau über die Fischerei vor der Küste Guinea-Bissaus für
    die Zeit vom 16. Juni 1993 bis 15. Juni 1995'
  type: main
- language: da
  script: Latn
  content: '93/568/EØF: RÅDETS AFGØRELSE af 29. oktober 1993 om indgåelse af aftalen
