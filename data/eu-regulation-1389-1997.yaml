  content: COMMISSION REGULATION (EC) No 1389/97 of 18 July 1997 determining the extent
    to which applications lodged in July 1997 for import licences for certain milk
    and milk products covered by the arrangements provided for in the Interim Agreement
    concluded by the Community with the Republic of Slovenia can be accepted
  type: main
- language: fr
  script: Latn
