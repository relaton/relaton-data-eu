id: EUDecision1968355
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1968, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les "carpes fraîches,
    réfrigérées ou congelées", de la position Ex 03.01 A II B) du Tarif douanier
    commun, originaires de Yougoslavie et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. September 1968, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus Jugoslawien stammende und in den anderen Mitgliedstaaten
    in den freien Verkehr gebrachte Karpfen, frisch, gekühlt oder gefroren, der Tarifnummer
    ex 03.01 A II b) des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 settembre 1968, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario le carpe fresche,
    refrigerate e congelate, della voce ex 03.01 A II b) della tariffa doganale comune,
    originarie della Iugoslavia ed immesse in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 september 1968 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd karpers, vers, gekoeld of bevroren, van tariefpost
    ex 03.01 A II b) van het gemeenschappelijk douanetarief, die van oorsprong zijn
    uit Joegoslavië en in de andere Lid-Staten in het vrije verkeer zijn gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
