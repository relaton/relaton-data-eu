title:
- language: en
  script: Latn
  content: '83/497/EEC: Commission Decision of 22 September 1983 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain under garments,
    originating in Peru, which have been put into free circulation in the Community
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/497/CEE: Décision de la Commission du 22 septembre 1983 autorisant
    la République française à procéder à une surveillance intracommunautaire
    des importations de certains sous-vêtements originaires du Pérou et mis en libre
    pratique dans la Communauté (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '83/497/EWG: Entscheidung der Kommission vom 22. September 1983 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren bestimmter aus Peru stammender und in der Gemeinschaft im freien
    Verkehr befindlicher Unterkleidung (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/497/EØF: Kommissionens beslutning af 22. september 1983 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførslen
    af visse underbeklædningsgenstande, der har oprindelse i Peru og er overgået
    til fri omsætning i Fællesskabet (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/497/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Σεπτεμβρίου 1983 για τη χορήγηση αδείας στη Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων εσωρούχων, καταγωγής
    Περού, που τίθενται σε ελεύθερη κυκλοφορία
    στην Κοινότητα (Το κείμενο στην γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/497/CEE: Decisione della Commissione del 22 settembre 1983 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di talune sottovesti originarie del Perù e messe in libera pratica nella Comunità
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/497/EEG: Beschikking van de Commissie van 22 september 1983 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van bepaalde onderkleding van oorsprong uit Peru die
    in de Gemeenschap in het vrije verkeer is gebracht (Slechts de tekst in de Franse
    taal is authentiek)'
