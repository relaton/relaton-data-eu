  type: main
- language: de
  script: Latn
  content: '64/689/EWG: Entscheidung der Kommission vom 6. November 1964 über die
    Erhebung einer Ausgleichsabgabe auf Einfuhren von Brot und ähnlichen Erzeugnissen
    aus dem Königreich der Niederlande in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '64/689/CEE: Decisione della Commissione, del 6 novembre 1964, che autorizza
    la riscossione di una tassa compensativa all''importazione, nella Repubblica federale
    di Germania, di pane e prodotti analoghi provenienti dal Regno dei Paesi Bassi'
  type: main
