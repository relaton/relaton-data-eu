title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 736/2001 of 11 April 2001 determining to
    what extent applications lodged in April 2001 for the right to import young male
    bovine animals for fattening can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 736/2001 de la Commission du 11 avril 2001 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2001 pour les jeunes bovins mâles destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 736/2001 der Kommission vom 11. April 2001 zur Bestimmung
    des Umfangs, in welchem den im April 2001 gestellten Anträgen auf Einfuhrrechte
    für zur Mast bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 736/2001 af 11. april 2001 om fastsættelse
    af nedsættelsesprocentsatsen for de ansøgninger om importrettigheder, der i
    april 2001 er indgivet for ungtyre til opfedning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 736/2001 της Επιτροπής,
    της 11ης Απριλίου 2001, για καθορισμό του βαθμού
    στον οποίο μπορούν να γίνουν δεκτές οι αιτήσεις
    για δικαιώματα εισαγωγής, οι οποίες υπεβλήθησαν
    τον Απρίλιο του 2001 για τα νεαρά αρσενικά βοοειδή
    που προορίζονται γα πάχυνση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 736/2001, annettu 11 päivänä huhtikuuta 2001,
    lihotettaviksi tarkoitettujen nuorten urospuolisten nautojen tuonnista huhtikuussa
    2001 jätettyjen tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 736/2001 della Commissione, dell'11 aprile 2001, che
    stabilisce in quale misura possono essere accolte le domande di diritti d'importazione
    presentate nel mese di aprile 2001 per giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 736/2001 van de Commissie van 11 april 2001 tot vaststelling
    van de aantallen dieren waarvoor gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer die in april 2001 zĳn ingediend voor de invoer van jonge mannelĳke
    mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 736/2001 da Comissão, de 11 de Abril de 2001, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Abril de 2001 para os bovinos machos jovens para engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 736/2001 de la Comisión, de 11 de abril de 2001, por
    el que se determina la medida en que pueden atenderse las solicitudes de derechos
    de importación de bovinos machos jóvenes destinados al engorde presentadas en
    el mes de marzo de 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 736/2001 av den 11 april 2001 om i vilken
