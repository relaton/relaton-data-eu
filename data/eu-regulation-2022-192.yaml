    (UE) no 1151/2014 de la Commission concernant les informations à notifier lors
    de l’exercice du droit d’établissement et de la libre prestation de services
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/192 der Kommission vom 20. Oktober 2021
