id: EURegulation2022671
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/671 of 4 February 2022 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council as regards
    specific rules on official controls performed by the competent authorities on
    animals, products of animal origin and germinal products, follow-up action to
    be taken by the competent authority in case of non-compliance with identification
    and registration rules for bovine, ovine and caprine animals or of non-compliance
    during transit through the Union of certain bovine animals, and repealing Commission
    Regulation (EC) No 494/98
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/671 de la Commission du 4 février 2022
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil en
    ce qui concerne les règles spécifiques applicables aux contrôles officiels
    effectués par les autorités compétentes sur les animaux, les produits d’origine
    animale et les produits germinaux, les mesures de suivi à prendre par l’autorité
    compétente en cas de non-respect des règles d’identification et d’enregistrement
    des bovins, des ovins et des caprins ou de manquement au cours du transit de certains
    bovins par l’Union, et abrogeant le règlement (CE) no 494/98 de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/671 der Kommission vom 4. Februar 2022
    zur Ergänzung der Verordnung (EU) 2017/625 des Europäischen Parlaments und des
    Rates hinsichtlich besonderer Bestimmungen für amtliche Kontrollen, die von den
    zuständigen Behörden bei Tieren, Erzeugnissen tierischen Ursprungs und Zuchtmaterial
    durchgeführt werden, für von der zuständigen Behörde zu ergreifende Folgemaßnahmen
    bei Verstößen gegen die Identifizierungs- und Registrierungsvorschriften für
    Rinder, Schafe und Ziegen oder bei Verstößen bei der Durchfuhr bestimmter Rinder
    durch die Union und zur Aufhebung der Verordnung (EG) Nr. 494/98 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/671 на Комисията
    от 4 февруари 2022 година за допълнение на Регламент
    (ЕС) 2017/625 на Европейския парламент и на Съвета
    по отношение на специалните правила за официалния
    контрол, извършван от компетентните органи,
    на животни, продукти от животински произход
    и зародишни продукти, по отношение на последващите
    действия, които компетентният орган трябва
    да предприеме в случай на несъответствие с
    правилата за идентификация и регистрация на
    говеда, овце и кози или на несъответствие по
    време на транзит през Съюза на някои говеда,
    и за отмяна на Регламент (ЕО) № 494/98 на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/671 ze dne 4. února
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/625,
    pokud jde o zvláštní pravidla pro úřední kontroly prováděné příslušnými
    orgány u zvířat, produktů živočišného původu a zárodečných produktů,
    následná opatření, která má příslušný orgán přijmout v případě
    nesouladu s pravidly týkajícími se identifikace a evidence skotu, ovcí a koz
    nebo v případě nesplnění požadavků během tranzitu určitého skotu přes
    území Unie, a kterým se zrušuje nařízení Komise (ES) č. 494/98
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/671 af 4. februar 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2017/625
    for så vidt angår særlige regler om offentlig kontrol, som kompetente myndigheder
    gennemfører af dyr, animalske produkter og avlsmateriale, opfølgende foranstaltninger
    truffet af de kompetente myndigheder i tilfælde af manglende overholdelse af
    identifikations- og registreringsreglerne for kvæg, får og geder eller manglende
    overholdelse under transit gennem Unionen af visse typer kvæg, og om ophævelse
    af Kommissionens forordning (EF) nr. 494/98
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/671
    της Επιτροπής της 4ης Φεβρουαρίου 2022 για τη
    συμπλήρωση του κανονισμού (ΕΕ) 2017/625 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    ειδικούς κανόνες για τους επίσημους ελέγχους
    που διενεργούνται από τις αρμόδιες αρχές στα
    ζώα, τα προϊόντα ζωικής προέλευσης και το ζωικό
    αναπαραγωγικό υλικό, τα μέτρα παρακολούθησης
    που πρέπει να λαμβάνονται από την αρμόδια αρχή
    σε περίπτωση μη συμμόρφωσης με τους κανόνες
    ταυτοποίησης και καταχώρισης για τα βοοειδή,
    τα αιγοειδή και τα προβατοειδή ή μη συμμόρφωσης
    ορισμένων βοοειδών κατά τη διαμετακόμιση μέσω
    της Ένωσης, και για την κατάργηση του κανονισμού
    (ΕΚ) αριθ. 494/98 της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/671, 4. veebruar 2022, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2017/625 seoses pädevate
    asutuste poolt loomade, loomsete saaduste ja loomse paljundusmaterjali suhtes
    tehtava ametliku kontrolli erieeskirjadega ja pädeva asutuse poolt veiste, lammaste
    ja kitsede identifitseerimis- ja registreerimiseeskirjade rikkumise või läbi
    liidu toimuva transiidi ajal teatavate veiste nõuetele mittevastavuse korral
    võetavate järelmeetmetega ning millega tunnistatakse kehtetuks komisjoni määrus
    (EÜ) nr 494/98
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/671, annettu 4 päivänä helmikuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) 2017/625 täydentämisestä
    siltä osin kuin on kyse toimivaltaisten viranomaisten eläinten, eläinperäisten
    tuotteiden ja sukusolujen ja alkioiden osalta suorittamaa virallista valvontaa
    koskevista erityissäännöistä, jatkotoimista, joita toimivaltaisen viranomaisen
    on toteutettava, jos säännösten noudattamatta jättämistä ilmenee nauta-,
    lammas- ja vuohieläinten tunnistamista ja rekisteröintiä koskevien sääntöjen
    osalta tai tiettyjen nautaeläinten unionin kautta kuljetuksen aikana, sekä komission
    asetuksen (EY) N:o 494/98 kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/671 ón gCoimisiún an 4 Feabhra 2022 lena
    bhforlíontar Rialachán (AE) 2017/625 ó Pharlaimint na hEorpa agus ón gComhairle
    a mhéid a bhaineann le rialacha sonracha maidir le rialuithe oifigiúla arna
    ndéanamh ag na húdaráis inniúla ar ainmhithe, táirgí de bhunadh ainmhíoch
    agus táirgí geirmeacha, maidir le gníomhaíocht leantach atá le déanamh ag
    an údarás inniúil i gcás neamhchomhlíonadh na rialacha maidir le bó-ainmhithe,
    ainmhithe den chineál caorach agus ainmhithe den chineál gabhair a shainaithint
    agus a chlárú nó i gcás neamhchomhlíontachta le linn idirthuras bó-ainmhithe
    áirithe tríd an Aontas, agus lena n-aisghairtear Rialachán (CE) Uimh. 494/98
    ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/671 оd 4. veljače 2022. o dopuni
    Uredbe (EU) 2017/625 Europskog parlamenta i Vijeća u pogledu posebnih pravila
    o službenim kontrolama životinja, proizvodâ životinjskog podrijetla i zametnih
    proizvoda koje provode nadležna tijela, o naknadnim mjerama koje nadležna tijela
    trebaju poduzeti u slučajevima neusklađenosti s pravilima o označivanju i registraciji
    goveda, ovaca i koza ili u slučaju neusklađenosti tijekom provoza određenih
    goveda kroz Uniju te o stavljanju izvan snage Uredbe Komisije (EZ) br. 494/98
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/671 felhatalmazáson alapuló rendelete (2022. február
    4.) az (EU) 2017/625 európai parlamenti és tanácsi rendeletnek az illetékes
    hatóságok által az állatokon, állati eredetű termékeken és szaporítóanyagokon
    végzett hatósági ellenőrzésekre, a szarvasmarha-, juh- és kecskefélékre
    vonatkozó azonosítási és nyilvántartásba vételi szabályoknak való meg
    nem felelés vagy a bizonyos szarvasmarhafélék Unión keresztül történő
    átszállítása során előforduló meg nem felelés esetén az illetékes hatóság
    által meghozandó nyomonkövetési intézkedésekre vonatkozó különös szabályok
    tekintetében történő kiegészítéséről, valamint a 494/98/EK bizottsági
    rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/671 della Commissione del 4 febbraio 2022
    che integra il regolamento (UE) 2017/625 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme specifiche sui controlli ufficiali effettuati dalle
    autorità competenti su animali, prodotti di origine animale e materiale germinale,
    le azioni di follow-up che devono essere intraprese dall’autorità competente
    in caso di non conformità alle norme in materia di identificazione e registrazione
    di bovini, ovini e caprini o di non conformità durante il transito di determinati
    bovini nell’Unione, e che abroga il regolamento (CE) n. 494/98 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/671 (2022. gada 4. februāris),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) 2017/625 papildina attiecībā
    uz īpašiem noteikumiem par oficiālajām kontrolēm, ko kompetentās iestādes
    veic attiecībā uz dzīvniekiem, dzīvnieku izcelsmes produktiem un reproduktīvajiem
    produktiem, par turpmākām darbībām, kas kompetentajai iestādei jāveic gadījumos,
    kur nav ievēroti liellopu, aitu un kazu identifikācijas un reģistrācijas noteikumi
    vai noteikti liellopi caur Savienību tranzītā tiek vesti neatbilstīgi, un
    ar ko atceļ Komisijas Regulu (EK) Nr. 494/98
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/671 2022 m. vasario 4 d. kuriuo
    Europos Parlamento ir Tarybos reglamentas (ES) 2017/625 papildomas konkrečiomis
    kompetentingų institucijų vykdomos gyvūnų, gyvūninių produktų ir genetinės
    medžiagos produktų oficialios kontrolės taisyklėmis ir nuostatomis dėl tolesnių
    veiksmų, kurių kompetentinga institucija turi imtis nustačius, kad nesilaikoma
    galvijų, avių ir ožkų identifikavimo ir registravimo taisyklių arba nesilaikoma
    reikalavimų vežant per Sąjungą tranzitu tam tikrus galvijus, ir kuriuo panaikinamas
    Komisijos reglamentas (EB) Nr. 494/98
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/671 tal-4 ta’ Frar 2022
    li jissupplimenta r-Regolament (UE) 2017/625 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ regoli speċifiċi dwar kontrolli uffiċjali mwettqa mill-awtoritajiet
    kompetenti fuq annimali, prodotti li joriġinaw mill-annimali u prodotti ġerminali,
    kif ukoll dwar azzjonijiet ta’ segwitu li għandhom jittieħdu mill-awtorità
    kompetenti f’każ ta’ nonkonformità mar-regoli ta’ identifikazzjoni u reġistrazzjoni
    għall-annimali bovini, ovini u kaprini jew f’każ ta’ nonkonformità matul
    it-tranżitu mill-Unjoni ta’ ċerti annimali bovini, u li jħassar ir-Regolament
    tal-Kummissjoni (KE) Nru 494/98
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/671 van de Commissie van 4 februari
    2022 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en
    de Raad wat betreft specifieke regels inzake door de bevoegde autoriteiten verrichte
    officiële controles van dieren, producten van dierlijke oorsprong en levende
    producten, door de bevoegde autoriteit te ondernemen follow-upacties in geval
    van niet-naleving van de identificatie- en registratieregels voor runderen, schapen
    en geiten of van niet-naleving tijdens de doorvoer door de Unie van bepaalde runderen,
    en tot intrekking van Verordening (EG) nr. 494/98 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/671 z dnia 4 lutego 2022 r.
    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/625
    w odniesieniu do przepisów szczególnych dotyczących kontroli urzędowych przeprowadzanych
    przez właściwe organy w odniesieniu do zwierząt, produktów pochodzenia zwierzęcego
    i materiału biologicznego, działań następczych, które ma podjąć właściwy
    organ w przypadku niezgodności z przepisami dotyczącymi identyfikacji i rejestracji
    bydła, owiec i kóz lub niezgodności podczas tranzytu przez terytorium Unii
    niektórych sztuk bydła, oraz uchylające rozporządzenie Komisji (WE) nr 494/98
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/671 da Comissão de 4 de fevereiro de 2022
    que complementa o Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho
    no que diz respeito às regras específicas aplicáveis aos controlos oficiais
    realizados pelas autoridades competentes a animais, produtos de origem animal
    e produtos germinais, bem como às medidas de acompanhamento a tomar pela autoridade
    competente em caso de incumprimento das regras de identificação e registo de
    bovinos, ovinos e caprinos ou de incumprimento durante o trânsito na União de
    determinados bovinos, e que revoga o Regulamento (CE) n.o 494/98 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/671 al Comisiei din 4 februarie 2022 de
    completare a Regulamentului (UE) 2017/625 al Parlamentului European și al Consiliului
    în ceea ce privește normele specifice privind controalele oficiale efectuate
    de autoritățile competente asupra animalelor, a produselor de origine animală
    și a materialelor germinative, măsurile de monitorizare care trebuie luate de
    autoritatea competentă în caz de neconformitate cu normele de identificare și
    înregistrare a bovinelor, ovinelor și caprinelor sau în caz de neconformitate
    în timpul tranzitului pe teritoriul Uniunii al anumitor bovine și de abrogare
    al Regulamentului (CE) nr. 494/98 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/671 zo 4. februára 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2017/625, pokiaľ ide
    o špecifické pravidlá pre úradné kontroly zvierat, produktov živočíšneho
    pôvodu a zárodočných produktov vykonávaných príslušnými orgánmi, následné
    opatrenia, ktoré má prijať príslušný orgán v prípade nedodržania pravidiel
    týkajúcich sa identifikácie a registrácie hovädzieho dobytka, oviec a kôz
    alebo nedodržania pravidiel počas tranzitu určitého hovädzieho dobytka cez
    Úniu, a ktorým sa zrušuje nariadenie Komisie (ES) č. 494/98
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/671 z dne 4. februarja 2022 o dopolnitvi
    Uredbe (EU) 2017/625 Evropskega parlamenta in Sveta glede posebnih pravil o uradnem
    nadzoru, ki ga pristojni organi izvajajo za živali, proizvode živalskega izvora
    in zarodni material, nadaljnjih ukrepih, ki jih pristojni organ sprejme v primeru
    neskladnosti s pravili za identifikacijo in registracijo goveda, ovc in koz ali
    neskladnosti med tranzitom nekaterega goveda skozi Unijo, ter o razveljavitvi
    Uredbe Komisije (ES) št. 494/98
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/671 de la Comisión de 4 de febrero de 2022
    por el que se completa el Reglamento (UE) 2017/625 del Parlamento Europeo y del
    Consejo en lo referente a las normas específicas sobre los controles oficiales
    de animales, productos de origen animal y productos reproductivos realizados por
    las autoridades competentes, así como las medidas de seguimiento que deben adoptar
    las autoridades competentes en caso de incumplimiento de las normas de identificación
    y registro de bovinos, ovinos y caprinos o de incumplimiento durante el tránsito
    por la Unión de determinados bovinos, y por el que se deroga el Reglamento (CE)
    n.o 494/98 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/671 av den 4 februari 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
    gäller särskilda bestämmelser om behöriga myndigheters offentliga kontroll
    av djur, produkter av animaliskt ursprung och avelsmaterial och om uppföljningsåtgärder
    som de behöriga myndigheterna ska vidta vid bristande efterlevnad av bestämmelserna
    för identifiering och registrering av nötkreatur, får och getter eller vid
    bristande efterlevnad under transitering av vissa nötkreatur genom unionen samt
    om upphävande av kommissionens förordning (EG) nr 494/98
  type: main
