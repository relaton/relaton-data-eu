id: EURegulation15051974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1505/74 of the Commission of 17 June 1974 re-establishing
    the levying of customs duties on women's, girls' and infants' under garments,
    other than of cotton, falling within CCT subheading ex 61.04, originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3505/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1505/74 de la Commission, du 17 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous, autres que de coton, de la position tarifaire EX 61.04, originaires
    des pays en voie de développement, bénéficiaires de préférences tarifaires
    prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1505/74 der Kommission vom 17. Juni 1974 zur Wiedereinführung
    des Zollsatzes für Unterkleidung (Leibwäsche) für Frauen, Mädchen und Kleinkinder,
    andere als aus Baumwolle, der Tarifstelle ex 61.04, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3505/73 des Rates vom 18. Dezember 1973
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1505/74 af 17. juni 1974 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til kvinder, piger
    og småbørn, undtagen varer af bomuld under position ex 61.04, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3505/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1505/74 della Commissione, del 17 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti (biancheria
    da dosso) per donna, per ragazza e per bambini, escluse quelle di cotone, della
    voce doganale n. ex 61.04, originarie dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3505/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1505/74 van de Commissie van 17 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op damesonderkleding,
    meisjesonderkleding en kinderonderkleding, andere dan van katoen, van onderverdeling
    ex 61.04, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3505/73 van de Raad van 18 december 1973 tariefpreferenties werden geopend
  type: main
