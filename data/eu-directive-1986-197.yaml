    περί προσέγγισης των νομοθεσιών των κρατών
    μελών σχετικά με την επισήμανση και την παρουσίαση
    των τροφίμων που προορίζονται για τον τελικό
    καταναλωτή καθώς επίσης και τη διαφήμισή τους
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 86/197/ETY, annettu 26 päivänä toukokuuta 1986,
    kuluttajalle myytäväksi tarkoitettujen elintarvikkeiden merkintöjä, esillepanoa
    ja mainontaa koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun
    direktiivin 79/112/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 86/197/CEE del Consiglio del 26 maggio 1986 che modifica la direttiva
