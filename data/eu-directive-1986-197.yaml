    l'etichettatura e la presentazione dei prodotti alimentari destinati al consumatore
    finale, nonché la relativa pubblicità
  type: main
- language: nl
  script: Latn
  content: Richtlijn 86/197/EEG van de Raad van 26 mei 1986 houdende wijziging van
    Richtlijn 79/112/EEG betreffende de onderlinge aanpassing van de wetgevingen der
    Lid- Staten inzake etikettering en presentatie van levensmiddelen bestemd voor
    de eindverbruiker alsmede inzake de daarvoor gemaakte reclame
  type: main
- language: pt
  script: Latn
  content: Directiva 86/197/CEE do Conselho de 26 de Maio de 1986 que altera a Directiva
    79/112/CEE relativa à harmonização das legislações dos Estados-Membros relativas
    à rotulagem e à apresentação dos géneros alimentícios destinados ao consumidor
    final bem como à publicidade feita a seu respeito
  type: main
- language: es
