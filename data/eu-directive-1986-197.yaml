  script: Latn
  content: Council Directive 86/197/EEC of 26 May 1986 amending Directive 79/112/EEC
    on the approximation of the laws of the Member States relating to the labelling,
    presentation and advertising of foodstuffs for sale to the ultimate consumer
  type: main
- language: fr
  script: Latn
  content: Directive 86/197/CEE du Conseil du 26 mai 1986 modifiant la directive 79/112/CEE
    relative au rapprochement des législations des États membres concernant l'étiquetage
    et la présentation des denrées alimentaires destinées au consommateur final
    ainsi que la publicité faite à leur égard
  type: main
- language: de
  script: Latn
  content: Richtlinie 86/197/EWG des Rates vom 26. Mai 1986 zur Änderung der Richtlinie
    79/112/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über die
    Etikettierung und Aufmachung von für den Endverbraucher bestimmten Lebensmitteln
    sowie die Werbung hierfür
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 86/197/EØF af 26. maj 1986 om ændring af direktiv 79/112/EØF
    om tilnærmelse af medlemsstaternes lovgivning om mærkning af og præsentationsmåder
    for levnedsmidler bestemt til den endelige forbruger samt om reklame for sådanne
    levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 86/197/ΕΟΚ του Συμβουλίου της 26ης Μαΐου
