title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/737 of 4 May 2021 concerning
    the extension of the action taken by the Austrian Federal Ministry for Climate
    Action, Environment, Energy, Mobility, Innovation and Technology permitting the
    making available on the market and use of the biocidal product Biobor JF in accordance
    with Article 55(1) of Regulation (EU) No 528/2012 of the European Parliament and
    of the Council (notified under document C(2021) 3015) (Only the German text is
    authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/737 de la Commission du 4 mai 2021 concernant
    la prorogation de la mesure prise par le ministère fédéral autrichien de l’action
    pour le climat, de l’environnement, de l’énergie, de la mobilité, de l’innovation
    et de la technologie autorisant la mise à disposition sur le marché et l’utilisation
