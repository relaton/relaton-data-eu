    of accredited verifiers, for the withdrawal of accreditation and for mutual recognition
    and peer evaluation of accreditation bodies
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/2551 de la Commission du 20 novembre 2025
    complétant le règlement (UE) 2023/956 du Parlement européen et du Conseil en
    précisant les conditions applicables à l’octroi de l’accréditation aux
    vérificateurs, au contrôle et à la supervision des vérificateurs accrédités,
    au retrait de l’accréditation ainsi qu’à la reconnaissance mutuelle et à
    l’évaluation par les pairs des organismes d’accréditation
  type: main
