title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1252/89 of 3 May 1989 fixing, for the 1989
    harvest, the norm and intervention prices and the premiums granted to purchasers
    of leaf tobacco, the derived intervention prices for baled tobacco, the reference
    qualities, the production areas and the guaranteed maximum quantities and amending
    Regulations (EEC) No 1577/86, (EEC) No 1975/87 and (EEC) No 2268/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1252/89 du Conseil du 3 mai 1989 fixant, pour la récolte
    1989, les prix d'objectif, les prix d'intervention et les primes accordées aux
    acheteurs de tabac en feuilles, les prix d'intervention dérivés du tabac emballé,
    les qualités de référence, les zones de production ainsi que les quantités
    maximales garanties, et modifiant les règlements (CEE) n° 1577/86, (CEE) n°
    1975/87 et (CEE) n 2268/88
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1252/89 DES RATES vom 3. Mai 1989 zur Festsetzung
    der Zielpreise, der Interventionspreise und der Käufern von Tabakblättern gewährten
    Prämien sowie der abgeleiteten Interventionspreise für Tabakballen, der Bezugsqualitäten,
    der Anbaugebiete sowie der Höchstgarantiemengen für die Ernte 1989 und zur Änderung
    der Verordnungen (EWG) Nr. 1577/86, (EWG) Nr. 1975/87 und (EWG) Nr. 2268/88 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1252/89 af 3. maj 1989 om fastsættelse for
