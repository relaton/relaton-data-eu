    i blade, afledte interventionspriser for tobak i baller, referencekvaliteter og
    produktionsområder samt de maksimale garantimængder og om ændring af forordning
    (EØF) nr. 1577/86, (EØF) nr. 1975/87 og (EØF) nr. 2268/88
  type: main
- language: el
  script: Grek
