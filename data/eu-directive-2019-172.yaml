title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2019/172 of 16 November 2018 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for lead in solders to complete a viable electrical connection between
    semiconductor die and carrier within integrated circuit flip chip packages
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2019/172 de la Commission du 16 novembre 2018
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l'annexe
    III de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption relative au plomb dans les soudures visant à réaliser
    une connexion électrique durable entre la puce et le substrat du semi-conducteur
    dans les boîtiers de circuits intégrés à puce retournée
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2019/172 der Kommission vom 16. November 2018
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für Blei in Loten zum Herstellen einer
    stabilen elektrischen Verbindung zwischen dem Halbleiterchip und dem Schaltungsträger
    in integrierten Flip-Chip-Baugruppen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2019/172 на Комисията
    от 16 ноември 2018 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение III към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаване
    от ограничението за употребата на олово в припои
    за създаване на надеждна електрическа връзка
    между полупроводниковия кристал и кристалоносителя
    в корпусите на интегрални схеми от типа „flip
    chip“ (с обърнат монтаж на кристала в корпуса)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2019/172 ze dne 16. listopadu
    2018, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití olova v pájkách pro sestavení stabilního elektrického
    spojení mezi polovodičovým čipem a nosičem v pouzdrech integrovaných obvodů
    využívajících technologii „Flip Chip“
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2019/172 af 16. november 2018 om
    tilpasning til den videnskabelige og tekniske udvikling af bilag III til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for bly i loddemateriale
    til etablering af elektrisk forbindelse mellem halvlederskive og bæresubstrat
    i integrerede kredsløbspakker med flip chip
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία (EE) 2019/172 της Επιτροπής,
    της 16ης Νοεμβρίου 2018, για την τροποποίηση, προς
    τον σκοπό της προσαρμογής στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος III της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά την εξαίρεση
    για τη χρήση μολύβδου σε συγκολλητικά υλικά
    για την ολοκλήρωση ανθεκτικής ηλεκτρικής σύνδεσης
    μεταξύ πλακιδίων και φορέων ημιαγωγού σε περιβλήματα
    αντεστραμμένων ολοκληρωμένων κυκλωμάτων (flip
    chip)
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2019/172, 16. november 2018, millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL III lisa seoses erandiga, milles käsitletakse pliid sellise
    joodise koostises, millega luuakse stabiilne elektriühendus pooljuhtkiibi ja
    aluse vahel pöördkiibiga kiibipakettides
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2019/172, annettu 16 päivänä marraskuuta
    2018, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen III muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen toimivan sähköliitoksen
    puolijohdepalan ja alustan välillä integroitujen piirien kääntösiru- eli
    flip chip -tekniikassa mahdollistavissa juotoksissa käytettävää lyijyä koskevan
    poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2019/172 оd 16. studenoga 2018. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga III. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za olovo u lemovima za kompletiranje
    održivog električnog kontakta između poluvodičke pločice i nosača u integriranom
    krugu „flip chip” sklopova
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/172 felhatalmazáson alapuló irányelve (2018.
    november 16.) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a tokozott flip chip integrált áramkörökben a félvezető chip és a hordozó
    között működőképes elektromos kapcsolatot megvalósító forrasztóanyagban
    lévő ólomra megadott mentesség tekintetében, a tudományos és a műszaki
    fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2019/172 della Commissione, del 16 novembre 2018,
    che modifica, adeguandolo al progresso scientifico e tecnico, l'allegato III della
    direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l'esenzione relativa all'uso del piombo nelle saldature destinate alla realizzazione
    di una connessione elettrica valida tra la matrice del semiconduttore e il carrier
    all'interno dei circuiti integrati secondo la configurazione «Flip chip»
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2019/172 (2018. gada 16. novembris),
    ar ko, pielāgojot zinātnes un tehnikas attīstībai, Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu groza attiecībā uz atbrīvojumu par svinu
    lodmetālos, ko izmanto stabilu elektrisko savienojumu izveidei starp pusvadītāja
    kristālu un nesēju apvērsto integrālshēmu (flip-chip) pakotnēs
  type: main
- language: lt
  script: Latn
  content: 2018 m. lapkričio 16 d. Komisijos deleguotoji direktyva (ES) 2019/172,
    kuria, derinant prie mokslo ir technikos pažangos, iš dalies keičiamos Europos
    Parlamento ir Tarybos direktyvos 2011/65/ES III priedo nuostatos dėl išimties,
    kuria šviną leidžiama naudoti lydmetaliuose, skirtuose lusto ir padėklo kontaktams
    elektriškai sujungti apverstojo lusto integrinių grandynų korpusuose
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2019/172 tas-16 ta' Novembru 2018
    li temenda, għall-finijiet ta' adattament għall-progress xjentifiku u tekniku,
    l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta' eżenzjoni għaċ-ċomb fl-istann li jikkompleta konnessjoni elettrika vijabbli
    bejn id-damma tas-semikonduttur u l-qafas fi ħdan ċirkwit integrat ta' pakketti
    flip chip
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2019/172 van de Commissie van 16 november 2018
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad betreffende een vrijstelling voor lood in soldeer voor de totstandbrenging
    van een haalbare elektrische verbinding tussen een halfgeleider-die en een drager
    in „flip chip”-behuizingen voor geïntegreerde schakelingen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2019/172 z dnia 16 listopada 2018 r.
    zmieniająca, w celu dostosowania do postępu naukowo-technicznego, załącznik
    III do dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    w przypadku zastosowania ołowiu w stopach lutowniczych służących do zakończenia
    trwałego połączenia elektrycznego pomiędzy urządzeniem półprzewodnikowym
    a nośnikiem w ramach obwodów scalonych typu flip-chip
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2019/172 da Comissão, de 16 de novembro de 2018,
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no que respeita
    a uma isenção aplicável ao chumbo em soldas destinadas a estabelecer uma ligação
    elétrica viável entre a pastilha do semicondutor e o substrato, no interior
    dos invólucros de circuitos integrados do tipo Flip Chip
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2019/172 a Comisiei din 16 noiembrie 2018 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru plumbul din aliajele de lipit pentru realizarea unei conexiuni
    electrice viabile între purtător și substratul semiconductorului în carcasele
    de circuite integrate de tip „flip chip”
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2019/172 zo 16. novembra 2018, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    pre olovo v spájkach na zostavenie stabilného elektrického spojenia medzi polovodičovým
    čipom a nosičom v rámci súprav integrovaného obvodu Flip Chip
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2019/172 z dne 16. novembra 2018 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za svinec v spajkah za dokončanje stabilnih električnih povezav med polprevodniškim
    čipom in nosilcem v integriranih paketih mikroelektronskih stikalnih vezij („flip
    chip“) zaradi prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2019/172 de la Comisión, de 16 de noviembre de
    2018, por la que se modifica, para adaptarlo al progreso científico y técnico,
    el anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo en
    cuanto a una exención relativa al plomo en pastas de soldadura diseñadas para
    crear una conexión eléctrica viable entre el cubo de semiconductor y el portador
    en cápsulas de circuito integrado flip-chip
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2019/172 av den 16 november 2018
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för bly i lödpunkter för elektrisk koppling mellan halvledarskiva
    och substrat i flip-chip-stackar av integrerade kretsar
  type: main
