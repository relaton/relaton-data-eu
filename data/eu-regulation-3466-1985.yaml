    τελωνειακών δασμών για την μεθενομίνη (DCI) (εξαμεθυλενοτετραμίνη)
    της διακρίσεως 29.26 Β ΙΙ α) του κοινού δασμολογίου,
    καταγωγής Ρουμανίας, δικαιούχου των προβλεπομένων
