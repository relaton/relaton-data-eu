  content: Commission Regulation (EEC) No 3466/85 of 9 December 1985 re-establishing
    the levying of the customs duties applicable to methenamine (INN) (hexamethylenetetramine)
    falling within subheading 29.26 B II a), originating in Romania, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3562/84
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3466/85 de la Commission du 9 décembre 1985 portant
    rétablissement de la perception des droits de douane applicables au méthénamine
    (DCI) (hexaméthylènetétramine), de la sous-position 29.26 B II a) du tarif
    douanier commun, originaire de Roumanie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3466/85 der Kommission vom 9. Dezember 1985 zur Wiedereinführung
    der Erhebung der Zölle für Methenamin (Hexamethylentetramin) der Tarifstelle
    29.26 B II a) des Gemeinsamen Zolltarifs mit Ursprung in Rumänien, dem die in
    der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3466/85 af 9. december 1985 om genindførelse
    af opkrævning af told for methenamin (INN) (hexamethylentetramin), henhørende
    under pos. 29.26 B II a) og med oprindelse i Rumænien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
