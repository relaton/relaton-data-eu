title:
- language: en
  script: Latn
  content: '81/800/EEC: Commission Decision of 22 September 1981 establishing that
    the apparatus described as ''ETEC- Autoscan scanning electron microscope'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/800/CEE: Décision de la Commission, du 22 septembre 1981, constatant
    que l''importation de l''appareil dénommé "ETEC-Autoscan scanning electron microscope"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/800/EWG: Entscheidung der Kommission vom 22. September 1981, mit der
    festgestellt wird, daß das Gerät ,,ETEC-Autoscan Scanning Electron Microscope"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '81/800/EØF: Kommissionens beslutning af 22. september 1981 om fastslåelse
    af, at indførsel af apparatet "ETEC- Autoscan Scanning Electron Microscope" ikke
    kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/800/EOK: Απόφαση τής Επιτροπής τής 22ας Σεπτεμβρίου
    1981 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονοσασία «ETEC-Autoscan Scanning Electron Microscope» δέν
    δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/800/CEE: Decisione della Commissione, del 22 settembre 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "ETEC-Autoscan scanning electron
    microscope" non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/800/EEG: Beschikking van de Commissie van 22 september 1981 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,ETEC-Autoscan Scanning Electron Microscope"
    niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag
    worden ingevoerd'
  type: main
