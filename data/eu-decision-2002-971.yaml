    prodotti dal trasporto via mare di sostanze pericolose e nocive del 1996 (convenzione
    HNS)'
  type: main
- language: lv
  script: Latn
  content: Padomes lēmums (2002. gada 18. novembris), ar ko dalībvalstīm Kopienas
