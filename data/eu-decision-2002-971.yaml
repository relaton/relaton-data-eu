    kansainvälinen yleissopimus vastuusta ja vahingonkorvauksesta vaarallisten ja
    haitallisten aineiden merikuljetusten yhteydessä (HNS-yleissopimus) tai liittymään
    siihen yhteisön puolesta'
  type: main
- language: hr
  script: Latn
  content: '2002/971/EZ: Odluka Vijeća od 18. studenoga 2002. o ovlašćivanju država
