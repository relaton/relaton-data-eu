title:
- language: en
  script: Latn
  content: '2002/971/EC: Council Decision of 18 November 2002 authorising the Member
    States, in the interest of the Community, to ratify or accede to the International
    Convention on Liability and Compensation for Damage in Connection with the Carriage
    of Hazardous and Noxious Substances by Sea, 1996 (the HNS Convention)'
  type: main
- language: fr
  script: Latn
  content: '2002/971/CE: Décision du Conseil du 18 novembre 2002 autorisant les États
    membres à ratifier, dans l''intérêt de la Communauté européenne, la convention
    internationale de 1996 sur la responsabilité et l''indemnisation pour les dommages
    liés au transport par mer de substances nocives et potentiellement dangereuses
    (convention HNS), ou à y adhérer'
  type: main
- language: de
  script: Latn
  content: '2002/971/EG: Beschluss des Rates vom 18. November 2002 zur Ermächtigung
    der Mitgliedstaaten, im Interesse der Gemeinschaft das Internationale Übereinkommen
    über Haftung und Entschädigung für Schäden bei der Beförderung schädlicher
    und gefährlicher Stoffe auf See von 1996 (HNS-Übereinkommen) zu ratifizieren
    oder diesem beizutreten'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 18 ноември 2002 година
    за упълномощаване на държавите-членки, в интерес
    на Общността, да ратифицират или да се присъединят
    към Международната конвенция за отговорността
    и обезщетенията за вреди при превоза на опасни
    и вредни вещества по море от 1996 г. (Конвенция
    HNS)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 18. listopadu 2002, kterým se členské státy
    zmocňují, aby v zájmu Společenství ratifikovaly Mezinárodní úmluvu o odpovědnosti
    a náhradě za škodu v souvislosti s přepravou nebezpečných a škodlivých
    látek po moři z roku 1996 nebo aby k této úmluvě přistoupily (Úmluva HNS)
  type: main
- language: da
  script: Latn
