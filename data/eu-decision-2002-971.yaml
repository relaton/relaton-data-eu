    atlīdzināšanu saistībā ar bīstamu un kaitīgu vielu jūras pārvadājumiem
    (HNS konvencija) ratificēt vai pievienoties tai
  type: main
- language: lt
  script: Latn
  content: 2002 m. lapkričio 18 d. Tarybos sprendimas leidžiantis valstybėms narėms
