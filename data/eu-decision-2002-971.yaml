    ir kompensacijos už žalą, susijusią su pavojingų ir kenksmingų medžiagų
    vežimu jūra (HNS konvencija) arba prie jos prisijungti
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tat-18 ta’ Novembru 2002 li tawtorizza lill-Istati
