title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 358/2002 of 26 February 2002 imposing a provisional
    anti-dumping duty on imports of certain tube and pipe fittings, of iron or steel
    originating in the Czech Republic, Malaysia, Russia, the Republic of Korea and
    Slovakia and accepting an undertaking offered by an exporting producer in Slovakia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 358/2002 de la Commission du 26 février 2002 instituant
    un droit antidumping provisoire sur les importations de certains accessoires de
    tuyauterie, en fer ou en acier, originaires de la République tchèque, de Malaisie,
    de Russie, de la République de Corée et de Slovaquie et portant acceptation
    de l'engagement offert par un producteur-exportateur en Slovaquie
  type: main
- language: de
  script: Latn
