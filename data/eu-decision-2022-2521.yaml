title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2521 of 20 December 2022 correcting
    the Romanian language version of Council Directive 2003/96/EC restructuring the
    Community framework for the taxation of energy products and electricity
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2521 de la Commission du 20 décembre
    2022 corrigeant la version en langue roumaine de la directive 2003/96/CE du Conseil
    restructurant le cadre communautaire de taxation des produits énergétiques et
    de l’électricité
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2521 der Kommission vom 20. Dezember
    2022 zur Änderung der rumänischen Sprachfassung der Richtlinie 2003/96/EG des
    Rates zur Restrukturierung der gemeinschaftlichen Rahmenvorschriften zur Besteuerung
    von Energieerzeugnissen und elektrischem Strom
  type: main
- language: bg
