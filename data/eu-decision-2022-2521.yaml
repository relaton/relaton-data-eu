    Kopienas noteikumus par nodokļu uzlikšanu energoproduktiem un elektroenerģijai
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2521 2022 m. gruodžio 20
