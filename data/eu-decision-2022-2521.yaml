    tal-Kunsill 2003/96/KE li tirriforma l-istruttura tal-Komunità dwar tassazzjoni
    fuq prodotti ta’ enerġija u elettriku
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2521 van de Commissie van 20 december 2022
    tot rectificatie van de Roemeense taalversie van Richtlijn 2003/96/EG tot herstructurering
    van de communautaire regeling voor de belasting van energieproducten en elektriciteit
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2521 z dnia 20 grudnia 2022 r. w sprawie
    sprostowania rumuńskiej wersji językowej dyrektywy Rady 2003/96/WE w sprawie
    restrukturyzacji wspólnotowych przepisów ramowych dotyczących opodatkowania
    produktów energetycznych i energii elektrycznej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2521 da Comissão de 20 de dezembro de
    2022 que retifica a versão em língua romena da Diretiva 2003/96/CE do Conselho
    que reestrutura o quadro comunitário de tributação dos produtos energéticos
    e da eletricidade
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2521 a Comisiei din 20 decembrie
    2022 de rectificare a versiunii în limba română a Directivei 2003/96/CE a Consiliului
    privind restructurarea cadrului comunitar de impozitare a produselor energetice
    și a electricității
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/2521 z 20. decembra 2022, ktorým
    sa opravuje rumunské znenie smernice Rady 2003/96/ES o reštrukturalizácii právneho
    rámca Spoločenstva pre zdaňovanie energetických výrobkov a elektriny
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/2521 z dne 20. decembra 2022 o popravku
