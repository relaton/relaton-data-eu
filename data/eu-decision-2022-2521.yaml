    elektrienergia maksustamise ühenduse raamistik) rumeeniakeelset versiooni
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/2521, annettu 20 päivänä
    joulukuuta 2022, energiatuotteiden ja sähkön verotusta koskevan yhteisön kehyksen
    uudistamisesta annetun neuvoston direktiivin 2003/96/EY romaniankielisen toisinnon
    oikaisemisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2521 ón gCoimisiún an 20 Nollaig
    2022 lena gceartaítear an leagan Rómáinise de Threoir 2003/96/CE ón gComhairle
    lena ndéantar athstruchtúrú ar chreat an Chomhphobail le haghaidh cáin a ghearradh
    ar tháirgí fuinnimh agus ar leictreachas
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/2521 оd 20. prosinca 2022. o ispravku
