    kterým se opravuje rumunské znění směrnice Rady 2003/96/ES, kterou se mění
    struktura rámcových předpisů Společenství o zdanění energetických produktů
    a elektřiny
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2521 af 20. december
    2022 om berigtigelse af den rumænske udgave af Rådets direktiv 2003/96/EF om
    omstrukturering af EF-bestemmelserne for beskatning af energiprodukter og elektricitet
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/2521 της Επιτροπής
    της 20ής Δεκεμβρίου 2022 για τη διόρθωση της ρουμανικής
    γλωσσικής έκδοσης της οδηγίας 2003/96/ΕΚ του Συμβουλίου
    σχετικά με την αναδιάρθρωση του κοινοτικού
    πλαισίου φορολογίας των ενεργειακών προϊόντων
    και της ηλεκτρικής ενέργειας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/2521, 20. detsember 2022, millega parandatakse
