    provided for in Decision 76/568/EEC on the association of the overseas countries
    and territories with the European Economic Community'
  type: main
- language: fr
  script: Latn
  content: '78/634/CEE: Décision du Conseil, du 18 juillet 1978, relative à l''
    application provisoire aux îles Salomon, après leur accession à l'' indépendance,
    du régime prévu par la décision 76/568/CEE relative à l'' association des
    pays et territoires d'' outre-mer à la Communauté économique européenne'
  type: main
- language: de
  script: Latn
  content: '78/634/EWG: Beschluß des Rates vom 18. Juli 1978 über die vorläufige
    Anwendung der in dem Beschluß 76/568/EWG über die Assoziation der überseeischen
    Länder und Gebiete mit der Europäischen Wirtschaftsgemeinschaft vorgesehenen
    Regelung auf die Salomon-Inseln nach ihrer Unabhängigkeit'
  type: main
- language: da
  script: Latn
  content: '78/634/EØF: Rådets afgørelse af 18. juli 1978 om foreløbig anvendelse
