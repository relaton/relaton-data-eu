  content: Commission Regulation (EC) No 3121/94 of 19 December 1994 re-establishing
    the levying of customs duties on certain textile products originating in Pakistan,
    Iran, India and China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3121/94 de la Commission du 19 décembre 1994 portant
