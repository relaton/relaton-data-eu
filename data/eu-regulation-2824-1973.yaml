title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2824/73 of the Commission of 17 October 1973 re-establishing
    Common Customs Tariff duties on hydraulic cements, falling within heading No 25.23,
    originating in Yugoslavia, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2824/73 de la Commission, du 17 octobre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux ciments hydrauliques, de la position tarifaire 25.23, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2824/73 der Kommission vom 17. Oktober 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Zement, der Tarifnummer 25.23,
    mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2762/72 des Rates
    vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2824/73 af 17. oktober 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for hydraulisk cement, under position
    25.23, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2824/73 della Commissione, del 17 ottobre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    cementi idraulici della voce doganale 25.23 originari della Iugoslavia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio,
    del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2824/73 van de Commissie van 17 oktober 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op hydraulische cement van post 25.23, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 algemene tariefpreferenties werden geopend
  type: main
