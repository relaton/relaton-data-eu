    Nr. 2721/88, (EG) Nr. 1294/96 und (EWG) Nr. 2046/89 zur Erleichterung des Übergangs
    von der Regelung für das Wirtschaftsjahr 1999/2000 auf die Regelung für das
    Wirtschaftsjahr 2000/2001 im Weinsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 838/2000 af 26. april 2000 om ændring
