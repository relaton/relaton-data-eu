title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 838/2000 of 26 April 2000 amending Regulations
    (EEC) No 2640/88, (EEC) No 2641/88, (EEC) No 3105/88, (EEC) No 2721/88, (EC) No
    1294/96 and (EEC) No 2046/89 to facilitate transition from the arrangements for
    the 1999/2000 wine year to those for the 2000/2001 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 838/2000 de la Commission, du 26 avril 2000, modifiant
    les règlements (CEE) nº 2640/88, (CEE) nº 2641/88, (CEE) nº 3105/88, (CEE)
    nº 2721/88, (CE) nº 1294/96 et (CEE) nº 2046/89 afin de faciliter la transition
    entre les dispositions prévues pour la campagne 1999/2000 et la campagne 2000/2001
    dans le secteur vitivinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 838/2000 der Kommission vom 26. April 2000 zur Änderung
