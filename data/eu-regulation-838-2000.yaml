    nr. 2721/88, (EF) nr. 1294/96 og (EØF) nr. 2046/89 for at lette overgangen mellem
    bestemmelserne for produktionsåret 1999/2000 og produktionsåret 2000/2001 i
    vinsektoren
  type: main
- language: el
  script: Grek
