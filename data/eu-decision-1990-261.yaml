title:
- language: en
  script: Latn
  content: '90/261/EEC: Commission Decision of 8 June 1990 amending Decision 89/469/EEC
    concerning certain protection measures relating to bovine spongiform encephalopathy
    (BSE) in the United Kingdom and Decision 90/200/EEC concerning additional requirements
    for some tissues and organs with respect to bovine spongiform encephalopathy'
  type: main
- language: fr
  script: Latn
  content: '90/261/CEE: Décision de la Commission du 8 juin 1990 portant modification
    de la décision 89/469/CEE relative à certaines mesures de protection contre
    l''encéphalopathie spongiforme bovine au Royaume-Uni et de la décision 90/200/CEE
    établissant des exigences supplémentaires pour certains tissus et organes en
    ce qui concerne l''encéphalopathie spongiforme bovine'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 8. Juni 1990 zur Aenderung der Entscheidung
    89/489/EWG zum Erlass von Massnahmen zum Schutz gegen spongiforme Rinderenzephalopathie
    im Vereinigten Koenigreich und der Entscheidung 90/200/EWG ueber zusaetzliche
    Anforderungen an gewisse Gewebe und Organe im Hinblick auf spongiforme Rinderenzephalopathie
    (90/261/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 8. juni 1990 om aendring af beslutning 89/499/EOEF
    om visse beskyttelsesforanstaltninger mod spongioes encephalopati hos kvaeg i
    Det Forenede Kongerige og beslutning 90/200/EOEF om tillaegskrav til visse vaev
    og organer med hensyn til bovin spongiform encephalopati (BSE) (90/261/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/261/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Ιουνίου
    1990 που τροποποιεί την απόφαση 89/469/ΕΟΚ για τη
    λήψη ορισμένων προστατευτικών μέτρων κατά
    της σπογγώδους εγκεφαλοπάθειας των βοοειδών
    στο Ηνωμένο Βασίλειο και την απόφαση 90/200/ΕΟΚ
    που αφορά πρόσθετες απαιτήσεις για ορισμένους
    ιστούς και όργανα σχετικά με τη σπογγώδη εγκεφαλοπάθεια
    των βοοειδών ( ΣΕΒ )'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE dell'8 giugno 1990 decisione 89/469/CEE recante
    misure di protezione contro l'encefalopatia spongiforme bovina nel Regno Unito
    e la decisione 90/200/CEE che stabilisce requisiti supplementari per taluni tessuti
    ed organi in relazione all'enecfalopatia spongiforme bovina (BSE) (90/261/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 8 juni 1990 tot wijziging van Beschikking
    89/469/EEG betreffende bepaalde beschermende maatregelen ten aanzien van bovine
    spongiforme encefalopathie (BSE) in het Verenigd Koninkrijk en Beschikking 90/200/EEG
    tot vaststelling van aanvullende eisen voor bepaalde weefsels en organen ten aanzien
    van bovine spongiforme encefalopathie (BSE) (90/261/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 8 de Junho de 1990 que altera a Decisao 89/469/CEE,
    relativa a determinadas medidas de protecçao contra a encefalopatia espongiforme
    bovina no Reino Unido, e a Decisao 90/200/CEE, relativa a exigências suplementares
    para determinados tecidos e orgaos no que diz respeito à encefalopatia espongiforme
    bovina (EEB) (90/261/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 8 de junio de 1990 por la que se modifica la
    Decision 89/469/CEE por la que se establecen determinadas medidas de proteccion
    contra la encefalopatia espongiforme bovino en el Reino Unido y la Decision 90/200/CEE
    por la que se establecen requisitos suplementarios para determinados tejidos y
    organos en relacion con la encefalopatia espongiforme bovina (EEC) (90/261/CEE)
  type: main
