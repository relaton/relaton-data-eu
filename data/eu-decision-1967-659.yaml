title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 octobre 1967, relative à la fixation
    des moyennes arithmétiques des prélèvements agricoles envers les pays tiers
    servant de base pour le calcul du prélèvement compensateur institué en vertu
    de l'article 10 du Traité
  type: main
- language: de
  script: Latn
  content: '67/659/EWG: Entscheidung der Kommission vom 13. Oktober 1967 über die
    Festsetzung der mittleren Abschöpfungen gegenüber dritten Ländern, die der
    Berechnung des gemäß Artikel 10 des Vertrages eingeführten anteiligen Zolls
    zugrunde zu legen sind'
  type: main
- language: it
  script: Latn
  content: '67/659/CEE: Decisione della Commissione, del 13 ottobre 1967, relativa
    alla fissazione delle medie aritmetiche dei prelievi agricoli nei confronti dei
    paesi terzi, da servire di base per il calcolo del prelievo compensativo istituito
    in virtù dell''articolo 10 del Trattato'
  type: main
- language: nl
  script: Latn
  content: '67/659/EEG: Beschikking van de Commissie van 13 oktober 1967 betreffende
    de vaststelling van de rekenkundige gemiddelden van de landbouwheffingen, ten
    opzichte van derde landen, welke gemiddelden aan de berekening van de ingevolge
    artikel 10 van het Verdrag ingestelde compenserende heffing ten grondslag worden
    gelegd'
  type: main
