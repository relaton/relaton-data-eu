---
id: EUDecision1973206
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 July 1973 authorizing the Italian Republic not
    to apply Community treatment to radio-receivers, whether or not combined with
    a sound recorder or reproducer, and parts, and to cathode-ray tubes for television
    sets falling within heading No 85.15 A III and C and 85.21 A III of the Common
    Customs Tariff, originating in Japan and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: Décision 73/206/CEE de la Commission, du 18 juillet 1973, autorisant la
    République italienne à exclure du traitement communautaire les appareils récepteurs
    de radio, même combinés avec un appareil d'enregistrement et de reproduction
    du son, et leurs pièces détachées, et les tubes cathodiques pour récepteurs
    de télévision, des positions 85.15 A III et C et 85.21 A III du Tarif douanier
    commun, originaires du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Juli 1973, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Empfangsgeräte für Rundfunk, auch mit Tonaufnahme-
    und Tonwiedergabegeräten kombiniert, und Teile, auch Kathodenstrahlröhren für
    Fernsehempfänger der Tarifnummern 85.15 A III und C und 85.21 A III des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. juli 1973 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage radio-modtagere, også kombineret
    med lydoptagere eller lydgengivere, og dele og katodestrålerør (billedrør)
    til fjernsynsmodtagere, som henhører under position 85.15 A III og C og 85.21
    A III i den fælles toldtarif, har oprindelse i Japan og overgår til fri omsætning
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 luglio 1973, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli apparecchi radioriceventi
    anche combinati con un apparecchio di registrazione o di produzione del suono,
    e parti staccate, e i tubi catodici per televisori, delle voci n. 85.15 A III
    e C e 85.21 A III della tariffa doganale comune, originari del Giappone e messi
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 juli 1973 waarbij de Italiaanse Republiek
    wordt gemachtigd ontvangtoestellen voor de radio-omroep, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid, en van kathodestraalbuizen
    voor ontvangtoestellen voor televisie, van posten 85.15 A III en C en 85.21 A
    III van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
