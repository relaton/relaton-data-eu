title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/680 of 27 April 2022 amending
    the information in the Annex to Implementing Regulation (EU) 2020/178 by including
    United Kingdom (Northern Ireland) as an origin for which a phytosanitary certificate
    is not required for the introduction into the Union of plants, fruits, vegetables,
    flowers or seeds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/680 de la Commission du 27 avril 2022
    modifiant les informations figurant à l’annexe du règlement d’exécution
    (UE) 2020/178 en incluant le Royaume-Uni (Irlande du Nord) en tant qu’origine
    pour laquelle un certificat phytosanitaire n’est pas exigé pour l’introduction
    dans l’Union de végétaux, de fruits, de légumes, de fleurs ou de semences
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/680 der Kommission vom 27. April 2022
    zur Änderung der Angaben im Anhang der Durchführungsverordnung (EU) 2020/178
    durch Aufnahme des Vereinigten Königreichs (Nordirland) als Ursprungsland, für
    das für das Verbringen von Pflanzen, Obst, Gemüse, Blumen oder Samen in die
    Union kein Pflanzengesundheitszeugnis erforderlich ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/680 на Комисията
    от 27 април 2022 година за изменение на информацията
    в приложението към Регламент за изпълнение
    (ЕС) 2020/178 чрез включване на Обединеното кралство
    (Северна Ирландия) като произход на растения,
    плодове, зеленчуци, цветя или семена, за чието
    въвеждане в Съюза не се изисква фитосанитарен
    сертификат
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/680 ze dne 27. dubna 2022 o změně
    informací v příloze prováděcího nařízení (EU) 2020/178, kterou se zařazuje
    Spojené království (Severní Irsko) mezi země, z nichž je povoleno dovážet
    do Unie rostliny, ovoce, zeleninu, květiny nebo semena bez rostlinolékařského
    osvědčení
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/680 af 27. april 2022
