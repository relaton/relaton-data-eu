    ved at medtage Det Forenede Kongerige (Nordirland) som en oprindelse, for hvilken
    der ikke kræves et plantesundhedscertifikat ved indførsel til Unionen af planter,
    frugter, grøntsager, blomster eller frø
  type: main
- language: el
  script: Grek
