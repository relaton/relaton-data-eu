    certifikata
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/680 végrehajtási rendelete (2022. április 27.)
    az (EU) 2020/178 végrehajtási rendelet mellékletében szereplő információknak
    az Egyesült Királyság (Észak-Írország) – mint a növények, gyümölcsök,
    zöldségek, virágok vagy vetőmagok Unióba való, növényegészségügyi bizonyítvány
    nélküli behozatalára jogosult származási ország – felvétele tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/680 della Commissione del 27 aprile
    2022 che modifica le informazioni di cui all’allegato del regolamento di esecuzione
    (UE) 2020/178 includendo il Regno Unito (Irlanda del Nord) quale origine per cui
    non è richiesto un certificato fitosanitario per l’introduzione nell’Unione
    di piante, frutti, ortaggi, fiori o sementi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/680 (2022. gada 27. aprīlis),
    ar ko Īstenošanas regulas (ES) 2020/178 pielikumā norādīto informāciju groza,
    iekļaujot Apvienoto Karalisti (Ziemeļīrija) kā izcelsmes vietu, attiecībā
    uz kuru nav vajadzīgs fitosanitārais sertifikāts, lai Savienībā ievestu augus,
    augļus, dārzeņus, ziedus vai sēklas
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/680 2022 m. balandžio 27
    d. kuriuo iš dalies keičiama Įgyvendinimo reglamento (ES) 2020/178 priede pateikta
    informacija įtraukiant Jungtinę Karalystę (Šiaurės Airiją) kaip kilmės
    šalį, kurios išduoto fitosanitarinio sertifikato, kad į Sąjungos teritoriją
    būtų galima įvežti augalus, vaisius, daržoves, gėles ar sėklas, pateikti
    neprivaloma
  type: main
