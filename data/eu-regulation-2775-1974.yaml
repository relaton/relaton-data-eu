id: EURegulation27751974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2775/74 of the Commission of 30 October 1974 re-establishing
    the levying of the customs duties on electrical capacitors, fixed or variable,
    falling within heading No 85.18, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2775/74 de la Commission, du 30 octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques, fixés variables ou ajustables, de la position tarifaire 85.18,
    originaires de Yougoslavie bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2775/74 der Kommission vom 30. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für elektrische Festkondensatoren, Drehkondensatoren und andere
    einstellbare Kondensatoren, der Tarifnummer 85.18, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2775/74 af 30. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable
    under position 85.18, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2775/74 della Commissione, del 30 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili della voce doganale n. 85.18 originari della Jugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2775/74 van de Commissie van 30 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op elektrische
    condensatoren (vaste condensatoren, draaicondensatoren en regelbare of instelbare
    condensatoren) van post 85.18, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
