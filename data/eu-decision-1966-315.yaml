title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 avril 1966, portant prorogation de la
    décision du 14 avril 1965, autorisant la République italienne à exclure du
    traitement communautaire les piles électriques du Japon et mises en libre pratique
    dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '66/315/EWG: Entscheidung der Kommission vom 29. April 1966 zur Verlängerung
    der Entscheidung vom 14. April 1965, mit der die Italienische Republik ermächtigt
    wurde, Primärelemente und Primärbatterien japanischen Ursprungs, die sich in
    den anderen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/315/CEE: Decisione della Commissione, del 29 aprile 1966, relativa
    alla proroga di validità della decisione del 14 aprile 1965 che autorizza la
    Repubblica italiana ad escludere dal trattamento comunitario le pile elettriche,
    originarie del Giappone e messe in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/315/EEG: Beschikking van de Commissie van 29 april 1966 houdende verlenging
    van de beschikking van 14 april 1965, waarbij de Italiaanse Republiek wordt gemachtigd
    elektrische elementen en elektrische batterijen, die van oorsprong zijn uit Japan
    en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
