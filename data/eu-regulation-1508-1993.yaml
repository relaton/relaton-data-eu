  content: COMMISSION REGULATION (EEC) No 1508/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of categories 5, 26 and 59 (order Nos
    40.0050, 40.0260 and 40.0590), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1508/93 de la Commission du 18 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    5, 26 et 59 (numéros d'ordre 40.0050, 40.0260 et 40.0590) originaires d'Inde,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3832/90 du Conseil
  type: main
