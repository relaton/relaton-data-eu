title:
- language: fr
  script: Latn
  content: Décision 64/676/CEE de la Commission, du 10 novembre 1964, autorisant
    la perception de taxes compensatoires à l'importation, dans la République fédérale
    d'Allemagne, de dextrines fabriquées à partir de la fécule de pommes de terre
    ainsi que de fécules de pommes de terre solubles ou torréfiées, en provenance
    de certains États membres
  type: main
- language: de
  script: Latn
  content: '64/676/EWG: Entscheidung der Kommission vom 10. November 1964 über die
    Erhebung von Ausgleichsabgaben auf Einfuhren von Dextrin auf der Grundlage von
    Kartoffelstärke und löslicher oder gerösteter Kartoffelstärke aus einigen
    Mitgliedstaaten in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '64/676/CEE: Decisione della Commissione, del 10 novembre 1964, che autorizza
    la riscossione di tasse di compensazione all''importazione, nella Repubblica federale
    di Germania, di destrine a base di fecola di patate, nonché fecole di patate
    solubili o terrefatte provenienti da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/676/EEG: Beschikking van de Commissie van 10 november 1964 houdende
    machtiging tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van dextrine vervaardigd uit aardappelzetmeel, alsmede oplosbaar of
    geroost aardappelzetmeel, uit bepaalde Lid-Staten'
  type: main
