    den in den französischen überseeischen Departements erzeugten Rohrrohzucker
    für das Zuckerwirtschaftsjahr 1976/1977
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1490/76 af 22. juni 1976 om fastsættelse
