title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 15 décembre 1967, fixant le montant d'un
    acompte à valoir sur le concours du FEOGA aux dépenses du Royaume de Belgique,
    remboursables au titre de la section garantie pour la période de comptabilisation
    1965/1966
  type: main
- language: de
  script: Latn
  content: '68/25/EWG: Entscheidung der Kommission vom 15. Dezember 1967 zur Festsetzung
    des Betrages einer Abschlagszahlung auf die Beteiligung des EAGFL an den für
    eine Rückvergütung durch die Abteilung Garantie für den Verbuchungszeitraum
    1956/1966 in Betracht kommenden Ausgaben des Königreichs Belgien'
  type: main
- language: it
  script: Latn
  content: '68/25/CEE: Decisione della Commissione, del 15 dicembre 1967, che fissa
    un acconto sul contributo del FEAOG alle spese del Regno del Belgio, rimborsabili
    dalla sezione garanzia per il periodo di contabilizzazione 1965/1966'
  type: main
- language: nl
  script: Latn
  content: '68/25/EEG: Beschikking van de Commissie van 15 december 1967 tot vaststelling
    van een voorschot op de uitkeringen van het EOGFL in verband met de uitgaven van
    het Koninkrijk België welke in het kader van de afdeling Garantie voor de berekeningsperiode
    1965/1966 voor vergoeding in aanmerking komen'
  type: main
