title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 908/95 of 25 April 1995 determining the extent
    to which applications lodged in April 1995 for import licences for fresh, chilled
    or frozen beef and transformed products under the import arrangements provided
    for in the European Agreements between the Community and the Republic of Poland,
    the Republic of Hungary, the Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 908/95 DE LA COMMISSION du 25 avril 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de licences d'importation
    introduites en avril 1995 pour les viandes bovines fraîches, réfrigérées ou
    congelées et les produits transformés dans le cadre des régimes d'importation
    prévus par les accords européens entre la Communauté et la république de Pologne,
    la république de Hongrie, la République tchèque et la République slovaque
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 908/95 DER KOMMISSION vom 25. April 1995 zur Festsetzung
    des Umfangs, in dem die im April 1995 für frisches, gekühltes oder gefrorenes
    Rindfleisch und Verarbeitungserzeugnisse gestellten Einfuhrlizenzanträge gemäß
    den Europäischen Abkommen zwischen der Gemeinschaft und der Republik Polen, der
    Republik Ungarn, der Tschechischen Republik und der Slowakischen Republik genehmigt
    werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 908/95 af 25. april 1995 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i april 1995 om
    importlicenser for fersk, kølet og frosset oksekød samt forarbejdede produkter
    i forbindelse med de importordninger, der er fastsat i Europaaftalerne mellem
    Fællesskabet og Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik
    og Den Slovakiske Republik
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 908/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Απριλίου 1995 για καθορισμό του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις αδειών εισαγωγής που υποβλήθηκαν
    τον Απρίλιο 1995 για τα νωπά, διατηρημένα με απλή
    ψύξη ή κατεψυγμένα βόεια κρέατα και τα μεταποιημένα
    προϊόντα στα πλαίσια των καθεστώτων εισαγωγής
