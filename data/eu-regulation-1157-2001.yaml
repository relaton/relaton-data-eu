    i kontroli dla niektórych wspólnotowych systemów pomocy
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1157/2001 da Comissão, de 13 de Junho de 2001, que
    altera o Regulamento (CE) n.° 2316/1999 que estabelece normas de execução do
    Regulamento (CE) n.° 1251/1999 do Conselho que institui um sistema de apoio aos
    produtores de determinadas culturas arvenses e que estabelece uma derrogação
    do Regulamento (CEE) n.° 3887/92 que estabelece as normas de execução do sistema
    integrado de gestão e de controlo relativo a determinados regimes de ajudas comunitárias
  type: main
