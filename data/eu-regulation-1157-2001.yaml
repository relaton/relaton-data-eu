  script: Latn
  content: Commission Regulation (EC) No 1157/2001 of 13 June 2001 amending Regulation
    (EC) No 2316/1999 laying down detailed rules for the application of Council Regulation
    (EC) No 1251/1999 establishing a support system for producers of certain arable
    crops and derogating from Regulation (EEC) No 3887/92 laying down detailed rules
    for applying the integrated administration and control system for certain Community
    aid schemes
  type: main
- language: fr
  script: Latn
