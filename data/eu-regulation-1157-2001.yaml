  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1157/2001 della Commissione, del 13 giugno 2001, che
    modifica il regolamento (CE) n. 2316/1999 recante modalità di applicazione del
    regolamento (CE) n. 1251/1999 del Consiglio che istituisce un regime di sostegno
    a favore dei coltivatori di taluni seminativi, e che deroga al regolamento (CEE)
    n. 3887/92 recante modalità di applicazione del sistema integrato di gestione
    e di controllo relativo a taluni regimi di aiuti comunitari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1157/2001 (2001. gada 13. jūnijs), ar ko groza
    Regulu (EK) Nr. 2316/1999, ar kuru paredz sīki izstrādātus noteikumus, lai
    piemērotu Padomes Regulu (EK) Nr. 1251/1999, ar ko izveido atbalsta sistēmu
    konkrētu laukaugu ražotājiem, un ar kuru atkāpjas no Regulas (EEK) Nr. 3887/92,
    ar ko paredz sīki izstrādātus noteikumus integrētās administrācijas un kontroles
    sistēmas piemērošanai attiecībā uz konkrētām Kopienas atbalsta shēmām
  type: main
- language: lt
  script: Latn
  content: 2001 m. birželio 13 d. Komisijos reglamentas (EB) Nr. 1157/2001, iš dalies
    keičiantis Reglamentą (EB) Nr. 2316/1999, nustatantį Tarybos reglamento (EB)
    Nr. 1251/1999, dėl tam tikrų lauko kultūrų augintojų paramos sistemos sukūrimo
    išsamias taikymo taisykles, ir leidžiantį nukrypti nuo Reglamento (EEB) Nr.
