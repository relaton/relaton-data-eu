    le règlement (CE) n° 2316/1999 portant modalités d'application du règlement
    (CE) n° 1251/1999 du Conseil instituant un régime de soutien aux producteurs
    de certaines cultures arables et dérogeant au règlement (CEE) n° 3887/92 portant
    modalités d'application du système intégré de gestion et de contrôle relatif
    à certains régimes d'aides communautaires
