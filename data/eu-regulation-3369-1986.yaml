    di cuoio naturale della sottovoce 64.02 A della tariffa doganale comune, originari
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3369/86 van de Commissie van 3 november 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    bovendeel van leder van postonderverdeling 64.02 A van het gemeenschappelijk douanetarief,
    van oorsprong uit India, waarvoor de in Verordening (EEG) nr. 3599/85 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3369/86 da Comissão de 3 de Novembro de 1986 que
