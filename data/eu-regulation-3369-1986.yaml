title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3369/86 of 3 November 1986 re-establishing
    the levying of customs duties on footwear with uppers of leather, falling within
    subheading 64.02 A, originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3369/86 de la Commission du 3 novembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    à dessus en cuir naturel de la sous-position 64.02 A du tarif douanier commun,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3369/86 der Kommission vom 3. November 1986 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Oberteil aus Leder der Tarifstelle 64.02
    A des Gemeinsamen Zolltarifs mit Ursprung in Indien, dem die in der Verordnung
    (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3369/86 af 3. november 1986 om genindførelse
    af opkrævning af told for varer med overdel af læder henhørende under pos.
    64.02 A i den fælles toldtarif og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3369/86 της Επιτροπής
