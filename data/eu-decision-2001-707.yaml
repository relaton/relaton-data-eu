title:
- language: en
  script: Latn
  content: '2001/707/EC: Commission Decision of 21 August 2001 amending Decision 1999/71/EC
    accepting undertakings offered in connection with the anti-dumping proceeding
    concerning imports of hardboard originating in Bulgaria, Estonia, Latvia, Lithuania
    and Poland and terminating the proceeding without measures in respect of such
    imports originating in Brazil (notified under document number C(2001) 2576)'
  type: main
- language: fr
  script: Latn
  content: '2001/707/CE: Décision de la Commission du 21 août 2001 modifiant la
    décision 1999/71/CE portant acceptation des engagements offerts dans le cadre
    de la procédure antidumping concernant les importations de panneaux durs originaires
    de Bulgarie, d''Estonie, de Lettonie, de Lituanie et de Pologne et clôturant
    la procédure sans institution de mesures pour les importations en provenance
    du Brésil [notifiée sous le numéro C(2001) 2576]'
  type: main
- language: de
  script: Latn
  content: '2001/707/EG: Beschluss der Kommission vom 21. August 2001 zur Änderung
    des Beschlusses 1999/71/EG zur Annahme der Verpflichtungsangebote im Zusammenhang
    mit dem Antidumpingverfahren betreffend die Einfuhren von Hartplatten mit Ursprung
    in Bulgarien, Estland, Lettland, Litauen und Polen und zur Einstellung des Verfahrens
    gegenüber derartigen Einfuhren mit Ursprung in Brasilien ohne die Einführung
    von Maßnahmen (Bekannt gegeben unter Aktenzeichen K(2001) 2576)'
  type: main
- language: da
  script: Latn
  content: '2001/707/EF: Kommissionens afgørelse af 21. august 2001 om ændring af
    afgørelse 1999/71/EF om godtagelse af tilsagn i forbindelse med antidumpingproceduren
    vedrørende importen af fiberplader (hardboard) med oprindelse i Bulgarien, Estland,
    Letland, Litauen og Polen og om afslutning af proceduren uden indførelse af foranstaltninger
    med hensyn til import af den pågældende vare med oprindelse i Brasilien (meddelt
    under nummer K(2001) 2576)'
  type: main
- language: el
  script: Grek
  content: '2001/707/ΕΚ: Απόφαση της Επιτροπής, της 21ης
    Αυγούστου 2001, για την τροποποίηση της απόφασης
    1999/71/ΕΚ για την αποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν σε σχέση με τη διαδικασία αντιντάμπινγκ
    όσον αφορά τις εισαγωγές πεπιεσμένων ινοσανίδων
    καταγωγής Βουλγαρίας, Εσθονίας, Λετονίας, Λιθουανίας
    και Πολωνίας και για την περάτωση της διαδικασίας
    χωρίς τη λήψη μέτρων όσον αφορά τις εν λόγω
    εισαγωγές καταγωγής Βραζιλίας [κοινοποιηθείσα
    υπό τον αριθμό Ε(2001) 2576]'
  type: main
- language: fi
  script: Latn
  content: '2001/707/EY: Komission päätös, tehty 21 päivänä elokuuta 2001, Bulgariasta,
    Latviasta, Liettuasta, Puolasta ja Virosta peräisin olevan kovalevyn tuontia
    koskevan polkumyynnin vastaisen menettelyn yhteydessä esitettyjen sitoumusten
    hyväksymisestä ja menettelyn päättämisestä ilman toimenpiteitä Brasiliasta
    peräisin olevan tuonnin osalta tehdyn päätöksen 1999/71/EY muuttamisesta (tiedoksiannettu
    numerolla K(2001) 2576)'
  type: main
- language: it
  script: Latn
  content: '2001/707/CE: Decisione della Commissione, del 21 agosto 2001, recante
    modifica della decisione 1999/71/CE che accetta gli impegni offerti in relazione
    al procedimento antidumping concernente le importazioni di pannelli duri (hardboard)
    originari di Bulgaria, Estonia, Lettonia, Lituania e Polonia e che chiude il procedimento
    senza adottare misure rispetto a tali importazioni originarie del Brasile [notificata
    con il numero C(2001) 2576]'
  type: main
- language: nl
  script: Latn
  content: '2001/707/EG: Besluit van de Commissie van 21 augustus 2001 houdende wĳziging
    van Besluit 1999/71/EG tot aanvaarding van verbintenissen die zĳn aangeboden
    in verband met de antidumpingprocedure met betrekking tot de invoer van hardboard
    van oorsprong uit Bulgarĳe, Estland, Letland, Litouwen en Polen en tot beëindiging
    van de procedure zonder maatregelen ten aanzien van dergelĳke invoer van oorsprong
    uit Brazilië (kennisgeving geschied onder nummer C(2001) 2576)'
  type: main
- language: pt
  script: Latn
  content: '2001/707/CE: Decisão da Comissão, de 21 de Agosto de 2001, que altera
    a Decisão 1999/71/CE, que aceita os compromissos oferecidos em relação ao processo
    anti-dumping relativo às importações de painéis de fibras de madeira (painéis
    duros) originários da Bulgária, da Estónia, da Letónia, da Lituânia e da
    Polónia e que encerra o processo sem a adopção de medidas relativamente a tais
    importações originárias do Brasil [notificada com o número C(2001) 2576]'
  type: main
- language: es
  script: Latn
  content: '2001/707/CE: Decisión de la Comisión, de 21 de agosto de 2001, que modifica
    la Decisión 1999/71/CE por la que se aceptan los compromisos ofrecidos en relación
    con el procedimiento antidumping relativo a las importaciones de tableros duros
    originarios de Bulgaria, Estonia, Letonia, Lituania y Polonia y por la que se
    concluye el procedimiento sin la adopción de medidas con respecto a dichas importaciones
    originarias de Brasil [notificada con el número C(2001) 2576]'
  type: main
- language: sv
  script: Latn
  content: '2001/707/EG: Kommissionens beslut av den 21 augusti 2001 om ändring av
    beslut 1999/71/EG om godtagande av åtaganden i samband med antidumpningsförfarandet
    beträffande import av hårda fiberskivor (hardboard) med ursprung i Bulgarien,
    Estland, Lettland, Litauen och Polen och om avslutande av förfarandet utan åtgärder
    beträffande sådan import med ursprung i Brasilien [delgivet med nr K(2001) 2576]'
