    der Erstattung für dieses Erzeugnis und zur Änderung der Verordnung (EWG) Nr.
    210/69
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1305/80 af 29. maj 1980 om 13. ændring
