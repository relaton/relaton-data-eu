title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2258/80 of 27 August 1980 re-establishing
    the levying of customs duties on mattress supports, articles of bedding or similar
    furnishing, etc., falling within heading No 94.04 and originating in China, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2258/80 de la Commission, du 27 août 1980, portant
    rétablissement de la perception des droits de douane applicables aux sommiers,
    articles de literie et similaires, etc., de la position 94.04 du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2258/80 der Kommission vom 27. August 1980 zur Wiedereinführung
    des Zollsatzes für Sprungrahmen; Bettausstattungen und ähnliche Waren, usw.,
    der Tarifnummer 94.04, mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2258/80 af 27. august 1980 om genindførelse
    af opkrævning af toldafgifter for sengebunde, sengeudstyr o. lign., under pos.
    94.04, som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2258/80 della Commissione, del 27 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai sommier, oggetti letterecci
    e simili, ecc., della voce 94.04 della tariffa doganale comune, originari della
    Cina, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2258/80 van de Commissie van 27 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op springbakken,
    spiraalmatrassen en dergelijke, enz. van post 94.04, van oorsprong uit China ten
    behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
