    hinsichtlich bestimmter nicht unter Anhang II des Vertrages fallender landwirtschaftlicher
    Verarbeitungserzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2844/80 af 3. november 1980 om ændring
