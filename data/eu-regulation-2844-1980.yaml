title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2844/80 of 3 November 1980 amending, as
    regards certain processed agricultural products not covered by Annex II to the
    Treaty, Regulation (EEC) No 1380/75 laying down detailed rules for the application
    of monetary compensatory amounts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2844/80 de la Commission, du 3 novembre 1980, modifiant,
    en ce qui concerne certains produits agricoles transformés ne relevant pas de
    l' annexe II du traité, le règlement (CEE) n° 1380/75 portant modalités d'
    application des montants compensatoires monétaires
  type: main
- language: de
  script: Latn
