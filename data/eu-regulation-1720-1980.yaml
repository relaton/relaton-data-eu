title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1720/80 of 30 June 1980 laying down for 1980
    certain measures for the conservation and management of common fishery resources
    off the west Greenland coast applicable to vessels flying the flag of Canada or
    under charter to companies registered in Canada
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1720/80 du Conseil, du 30 juin 1980, fixant, pour
    l' année 1980, certaines mesures de conservation et de gestion des ressources
    de pêche communes existant au large de la côte occidentale du Groenland, applicables
    aux navires battant pavillon du Canada ou affrétés par des compagnies enregistrées
    au Canada
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1720/80 des Rates vom 30. Juni 1980 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der gemeinsamen Fischbestände
    vor der westgrönlandischen Küste für das Jahr 1980 gegenüber Schiffen, die
    die Flagge Kanadas führen oder von in Kanada registrierten Gesellschaften gemietet
    wurden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1720/80 af 30. juni 1980 om fastsættelse
    for 1980 af visse foranstaltninger til bevarelse og forvaltning af fælles fiskeressourcer
    ud for Grønlands vestkyst, som skal finde anvendelse på far1050tøjer, der fører
    canadisk flag, eller som er chartret af selskaber registreret i Canada
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1720/80 del Consiglio, del 30 giugno 1980, che dispone
    alcune misure per il 1980 in materia di conservazione e di gestione delle risorse
    di pesca comuni al largo della costa occidentale della Groenlandia, da applicare
    alle navi battenti bandiera canadese o noleggiate da società registrate in Canada
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1720/80 van de Raad van 30 juni 1980 tot vaststelling
    van bepaalde maatregelen voor de instandhouding en het beheer van de gemeenschappelijke
    visbestanden voor de kust van West-Groenland, die in 1980 van toepassing zijn
    op vaartuigen die de vlag van Canada voeren of die zijn gecharterd door in Canada
    geregistreerde rederijen
  type: main
