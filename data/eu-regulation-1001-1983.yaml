title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1001/83 of 27 April 1983 amending Regulation
    (EEC) No 546/83 laying down provisions for distillation of table wine pursuant
    to Article 15 (2) of Regulation (EEC) No 337/79 and reducing the quantities of
    table wine covered by declarations and contracts concluded
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1001/83 de la Commission du 27 avril 1983 modifiant
    le règlement (CEE) no 546/83 établissant les dispositions relatives à une distillation
    de vin de table en vertu de l' article 15 paragraphe 2 du règlement (CEE) no
    337/79 et portant réduction des quantités de vin de table figurant dans les
    déclarations et contrats souscrits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1001/83 der Kommission vom 27. April 1983 zur Änderung
    der Verordnung (EWG) Nr. 546/83 mit den Bestimmungen für die Destillation von
    Tafelwein gemäß Artikel 15 Absatz 2 der Verordnung (EWG) Nr. 337/79 und zur
    Verringerung der Tafelweinmengen, die in den unterzeichneten Verträgen und Erklärungen
    angegeben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1001/83 af 27. april 1983 om ændring
    af forordning (EØF) nr. 546/83 om bestemmelserne vedrørende destillation af
    bordvin i henhold til artikel 15, stk. 2, i forordning (EØF) nr. 337/79, og om
    nedsættelse af de mængder bordvin, der fremgår af erklæringer og kontrakter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1001/83 της Επιτροπής
    της 27ης Απριλίου 1983 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 546/83 περί καθορισμού των διατάξεων
    σχετικά με την απόσταξη επιτραπέζιου οίνου
    δυνάμει του άρθρου 15 παράγραφος 2 του κανονισμού
    (ΕΟΚ) αριθ. 337/79 και μειώνει τις ποσότητες επιτραπέζιου
    οίνου που αναγράφονται στις δηλώσεις και στα
    συμφωνητικά που έχουν υπογραφεί
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1001/83 della Commissione del 27 aprile 1983 che modifica
    il regolamento (CEE) n. 546/83, che stabilisce le norme relative ad una distillazione
    di vino da tavola a norma dell' articolo 15, paragrafo 2, del regolamento (CEE)
    n. 337/79 e relativo alla riduzione dei quantitativi di vini da tavola che figurano
    nei contratti e nelle dichiarazioni sottoscritti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1001/83 van de Commissie van 27 april 1983 tot wijziging
    van Verordening (EEG) nr. 546/83 tot vaststelling van de bepalingen inzake distillatie
    van tafelwijn op grond van artikel 15, lid 2, van Verordening (EEG) nr. 337/79
    en tot verlaging van de hoeveelheden tafelwijn die zijn vermeld in de verklaringen
    en de contracten
  type: main
