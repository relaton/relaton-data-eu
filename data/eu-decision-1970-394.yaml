title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 juillet 1970, autorisant la République
    italienne à exclure du traitement communautaire les pellicules sensibilisées
    non impressionnées, de la position 37.02 du Tarif douanier commun originaires
    du Japon et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/394/EWG: Entscheidung der Kommission vom 24. Juli 1970, mit der die
    Italienische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen lichtempfindlichen Filme in Rollen
    oder Streifen, auch gelocht, nicht belichtet, der Position 37.02 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/394/CEE: Decisione della Commissione, del 24 luglio 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le pellicole sensibilizzate
    non impressionate, della voce 37.02 della tariffa doganale comune, originarie
    del Giappone e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/394/EEG: Beschikking van de Commissie van 24 juli 1970 waarbij de Italiaanse
    Republiek wordt gemachtigd films, lichtgevoelig, onbelicht, ook indien geperforeerd,
    op rollen of in stroken van post 37.02 van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
