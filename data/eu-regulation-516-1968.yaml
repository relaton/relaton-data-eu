  content: Règlement (CEE) n 516/68 du Conseil, du 29 avril 1968, complétant le
    règlement n 44/67/CEE en ce qui concerne la restitution à accorder pour des
    produits du secteur du sucre, exportés sous la forme de produits de l'industrie
    chimique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 516/68 des Rates vom 29. April 1968 zur Ergänzung
    der Verordnung Nr. 44/67/EWG hinsichtlich der Erstattungen für Erzeugnisse des
    Zuckersektors, die in Form von Erzeugnissen der chemischen Industrie ausgeführt
    werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 516/68 del Consiglio, del 29 aprile 1968, che completa
    il regolamento n. 44/67/CEE per quanto riguarda la restituzione da concedere per
    prodotti del settore dello zucchero esportati sotto forma di taluni prodotti dell'industria
    chimica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 516/68 van de Raad van 29 april 1968 houdende aanvulling
    van Verordening nr. 44/67/EEG ten aanzien van de restitutie voor produkten van
    de suikersector die in de vorm van produkten van de chemische industrie worden
    uitgevoerd
