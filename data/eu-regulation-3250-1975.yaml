title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3250/75 of the Commission of 12 December 1975 amending
    Regulation (EEC) No 1992/75 fixing, for the 1975/76 marketing year, in respect
    of trade within the Community the components designed to protect the rice and
    cereals processing industries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3250/75 de la Commission, du 12 décembre 1975, modifiant
    le règlement (CEE) n° 1992/75 fixant, en ce qui concerne les échanges intracommunautaires,
    pour la campagne de commercialisation 1975/1976, les éléments destinés à assurer,
    dans le secteur des céréales et du riz, la protection de l'industrie de transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3250/75 der Kommission vom 12. Dezember 1975 zur Änderung
    der Verordnung (EWG) Nr. 1992/75 zur Festsetzung des Bestandteils zum Schutz der
    Verarbeitungsindustrie auf dem Getreide- und Reissektor im Hinblick auf den innergemeinschaftlichen
    Handel für das Wirtschaftsjahr 1975/1976
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3250/75 af 12. december 1975 om ændring
    af forordning (EØF) nr. 1992/75 om fastsættelse for produktionsåret 1975/1976
    - for handelen inden for Fællesskabet - af de elementer, der for korn og ris
    har til formål at sikre beskyttelsen af forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3250/75 della Commissione, del 12 dicembre 1975, che
    modifica il regolamento (CEE) n. 1992/75 che fissa, per quanto riguarda gli scambi
    intracomunitari nella campagna di commercializzazione 1975/1976, gli elementi
    destinati ad assicurare la protezione dell'industria di trasformazione nel settore
    dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3250/75 van de Commissie van 12 december 1975 tot
    wijziging van Verordening (EEG) nr. 1992/75 tot vaststelling van de elementen
    die dienen om in het verkoopseizoen 1975/1976 in het intracommunautaire handelsverkeer
    in de sector granen en rijst de bescherming van de verwerkende industrie te verzekeren
  type: main
