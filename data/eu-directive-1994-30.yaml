    de pesticide din și de pe anumite produse de origine vegetală, inclusiv fructe
    și legume, precum și de stabilire a unei liste de conținuturi maxime
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 94/30/ES z 23. júna 1994, ktorou sa mení a dopĺňa príloha
