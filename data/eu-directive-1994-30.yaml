    de pesticides sur ou dans certains produits d'origine végétale, y compris les
    fruits et légumes, et prévoyant l'établissement d'une liste de teneurs maximales
  type: main
- language: de
  script: Latn
  content: Richtlinie 94/30/EG des Rates vom 23. Juni 1994 zur Änderung des Anhangs
    II der Richtlinie 90/642/EWG über die Festsetzung von Höchstgehalten an Rückständen
    von Schädlingsbekämpfungsmitteln auf und in bestimmten Erzeugnissen pflanzlichen
    Ursprungs, einschließlich Obst und Gemüse, sowie zur Erstellung einer Liste
    von Höchstgehalten
  type: main
- language: bg
