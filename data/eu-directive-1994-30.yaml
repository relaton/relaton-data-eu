    pozostałości pestycydów w niektórych produktach pochodzenia roślinnego, w
    tym owocach i warzywach, oraz na ich powierzchni, i przewidująca ustanowienie
    wykazu najwyższych dopuszczalnych poziomów
  type: main
- language: pt
  script: Latn
