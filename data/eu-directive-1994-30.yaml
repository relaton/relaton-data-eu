  script: Latn
  content: Council Directive 94/30/EC of 23 June 1994 amending Annex II to Directive
    90/642/EEC relating to the fixing of maximum levels for pesticide residues in
    and on certain products of plant origin, including fruit and vegetables and providing
    for the establishment of a list of maximum levels
  type: main
- language: fr
  script: Latn
