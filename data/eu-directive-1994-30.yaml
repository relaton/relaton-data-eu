    pesticídov v a na určitých produktoch rastlinného pôvodu vrátane ovocia
    a zeleniny a ktorou sa nariaďuje vytvorenie zoznamu maximálnych limitov
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 94/30/ES z dne 23. junija 1994 o spremembi Priloge II k
