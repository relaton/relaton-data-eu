title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2692/80 of 21 October 1980 amending for
    the second time Regulation (EEC) No 217/79 laying down detailed rules for direct
    cooperation between the bodies designated to verify compliance with provisions
    in the wine sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2692/80 de la Commission, du 21 octobre 1980, portant
    deuxième modification du règlement (CEE) n° 217/79 portant modalités d' application
    pour la collaboration directe des instances chargées du contrôle du respect
    des dispositions dans le domaine viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2692/80 der Kommission vom 21. Oktober 1980 zur zweiten
    Änderung der Verordnung (EWG) Nr. 217/79 über Durchführungsbestimmungen für
    die unmittelbare Zusammenarbeit der mit der Überwachung der Einhaltung der Vorschriften
    auf dem Weinsektor beauftragten Stellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2692/80 af 21. oktober 1980 om anden
    ændring af forordning (EØF) nr. 217/79 om gennemførelsesbestemmelser for det
    direkte samarbejde mellem de instanser, det er pålagt at føre kontrol med overholdelsen
    af bestemmelserne inden for vinsektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2692/80 τής Επιτροπής
