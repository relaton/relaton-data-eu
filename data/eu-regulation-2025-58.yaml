    neuer oder runderneuerter Luftreifen aus Kautschuk mit einer Tragfähigkeitskennzahl
    von mehr als 121 mit Ursprung in der Volksrepublik China im Anschluss an eine
    Auslaufüberprüfung nach Artikel 11 Absatz 2 der Verordnung (EU) 2016/1036 des
    Europäischen Parlaments und des Rates
