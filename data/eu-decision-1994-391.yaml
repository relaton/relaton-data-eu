    dohoda o obchodu a obchodních záležitostech mezi Evropským hospodářským
    společenstvím a Evropským společenstvím uhlí a oceli na jedné straně a
    Bulharskou republikou na straně druhé a Evropská dohoda zakládající přidružení
    mezi Evropskými společenstvími a jejich členskými státy na jedné straně
    a Bulharskou republikou na straně druhé, obě ve znění dodatkového protokolu
    podepsaného dne 21. prosince 1993
  type: main
