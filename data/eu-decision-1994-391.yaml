    über Handel und Handelsfragen zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Europäischen Gemeinschaft für Kohle und Stahl einerseits und der Republik
    Bulgarien andererseits und zur Änderung des Europaabkommens zur Gründung einer
    Assoziation zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten
    einerseits und der Republik Bulgarien andererseits, in der jeweils durch das am
    21. Dezember 1993 unterzeichnete Zusatzprotokoll geänderten Fassung'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 27. června 1994, o schválení výměny dopisů
