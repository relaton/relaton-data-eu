title:
- language: en
  script: Latn
  content: '94/391/EC: Council Decision of 27 June 1994 approving the Exchange of
    Letters between the European Community and the Republic of Bulgaria amending the
    Interim Agreement on trade and trade-related matters between the European Economic
    Community and the European Coal and Steel Community, of the one part, and the
    Republic of Bulgaria, of the other part, and the Europe Agreement establishing
    an association between the European Communities and their Member States, of the
    one part, and the Republic of Bulgaria, of the other part, both as amended by
    the Additional Protocol signed on 21 December 1993'
  type: main
- language: fr
  script: Latn
  content: '94/391/CE: Décision du Conseil du 27 juin 1994 approuvant l''échange
    de lettres entre la Communauté européenne et la Bulgarie modifiant l''accord
    intérimaire pour le commerce et les mesures d''accompagnement entre la Communauté
    économique européenne et la Communauté européenne du charbon et de l''acier,
    d''une part, et la République de Bulgarie, d''autre part, et l''accord européen
    établissant une association entre les Communautés européennes et leurs États
    membres, d''une part, et la République de Bulgarie, d''autre part, dans leur
    version modifiée par le protocole additionnel signé le 21 décembre 1993'
  type: main
- language: de
  script: Latn
  content: '94/391/EG: BESCHLUSS DES RATES vom 27. Juni 1994 zur Genehmigung des Briefwechsels
