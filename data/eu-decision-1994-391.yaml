    yhteisön ja Bulgarian välisen kirjeenvaihdon hyväksymisestä'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (1994. június 27.) az Európai Közösség és a
    Bolgár Köztársaság között az 1993. december 21-én aláírt kiegészítő
    jegyzőkönyv által módosított, egyrészről az Európai Gazdasági Közösség
    és az Európai Szén- és Acélközösség, másrészről a Bolgár Köztársaság
    között létrejött, a kereskedelemről és a kereskedelemmel kapcsolatos ügyekről
    szóló ideiglenes megállapodás, valamint az ugyanazon jegyzőkönyv által
    módosított, egyrészről az Európai Közösségek és azok tagállamai, másrészről
    a Bolgár Köztársaság között társulás létesítéséről szóló Európa-megállapodás
    módosításáról szóló levélváltás jóváhagyásáról
  type: main
