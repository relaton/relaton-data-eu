  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tas-27 ta' Ġunju 1994 li tapprova bdil ta'
    ittri bejn il-Komunità u r-Repubblika tal-Bulgarija li temenda l-Ftehim Interim
    fuq il-kummerċ u affarijiet relatati mal-kummerċ bejn il-Komunità Ekonomika
    Ewropea u l-Komunità Ewropea tal-Faħam u l-Azzar, min-naħa l-waħda, u r-Repubblika
    tal-Bulgarija, min-naħa l-oħra, u l-Ftehim Ewropew li jistabbilixxi assoċjazzjoni
    bejn il-Komunitajiet Ewropej u l-Istati Membri tagħhom, min-naħa l-waħda, u
    r-Repubblika tal-Bulgarija, min-naħa l-oħra, it-tnejn kif emendati mill-Protokoll
    Addizzjonali ffirmat fil-21 ta' Diċembru 1993
  type: main
- language: nl
  script: Latn
  content: '94/391/EG: Besluit van de Raad van 27 juni 1994 tot goedkeuring van de
    briefwisseling tussen de Europese Gemeenschap en de Republiek Bulgarije tot wijziging
    van de Interimovereenkomst betreffende de handel en aanverwante zaken tussen de
    Europese Economische Gemeenschap en de Europese Gemeenschap voor Kolen en Staal,
    enerzijds, en de Republiek Bulgarije, anderzijds, en de Europa-Overeenkomst waarbij
    een associatie tot stand wordt gebracht tussen de Europese Gemeenschappen en haar
    Lid-Staten, enerzijds, en de Republiek Bulgarije, anderzijds, beide zoals gewijzigd
    bij het Aanvullend Protocol dat op 21 december 1993 werd ondertekend'
  type: main
- language: pl
  script: Latn
