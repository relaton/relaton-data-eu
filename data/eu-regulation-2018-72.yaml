title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2018/72 of 4 October 2017 supplementing
    Regulation (EU) 2015/751 of the European Parliament and of the Council on interchange
    fees for card-based payment transactions with regard to regulatory technical standards
    establishing the requirements to be complied with by payment card schemes and
    processing entities to ensure the application of independence requirements in
    terms of accounting, organisation and decision-making process
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/72 de la Commission du 4 octobre 2017 complétant
    le règlement (UE) 2015/751 du Parlement européen et du Conseil relatif aux commissions
    d'interchange pour les opérations de paiement liées à une carte par des normes
    techniques de réglementation fixant les exigences que doivent respecter les schémas
    de cartes de paiement et les entités de traitement afin de garantir leur indépendance
    sur le plan comptable, organisationnel et décisionnel
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/72 der Kommission vom 4. Oktober 2017 zur
    Ergänzung der Verordnung (EU) 2015/751 des Europäischen Parlaments und des Rates
    über Interbankenentgelte für kartengebundene Zahlungsvorgänge durch technische
    Regulierungsstandards zur Festlegung der von Kartenzahlverfahren und abwickelnden
    Stellen zu erfüllenden Anforderungen zur Gewährleistung der Anwendung von Anforderungen
    in Bezug auf ihre Unabhängigkeit hinsichtlich Rechnungslegung, Organisation und
    Entscheidungsverfahren
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2018/72 на Комисията
