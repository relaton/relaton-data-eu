    (ЕС) 2015/751 на Европейския парламент и на Съвета
    относно обменните такси за платежни операции,
    свързани с карти, във връзка с регулаторните
    технически стандарти за определяне на изискванията,
    които трябва да се спазват от платежните картови
    схеми и обработващите субекти, за да се осигури
    прилагането на изискванията за независимост
    по отношение на счетоводството, организацията
    и процеса на вземане на решения
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2018/72 ze dne 4. října
    2017, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2015/751
    o mezibankovních poplatcích za karetní platební transakce, pokud jde o regulační
    technické normy stanovující požadavky, jež musí splňovat schémata platebních
    karet a zpracovatelé, aby se zajistilo uplatňování požadavků na nezávislost
    z hlediska účetnictví, organizace a rozhodovacích procesů
  type: main
