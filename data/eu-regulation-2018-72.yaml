    poplatkoch za platobné transakcie viazané na kartu, pokiaľ ide o regulačné
    technické predpisy, ktorými sa stanovia požiadavky, ktoré majú kartové schémy
    a spracovateľské subjekty dodržiavať, aby sa zabezpečilo uplatňovanie požiadaviek
    na nezávislosť z hľadiska účtovníctva, organizácie a rozhodovacieho procesu
  type: main
