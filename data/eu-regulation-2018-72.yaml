    w sprawie opłat interchange w odniesieniu do transakcji płatniczych realizowanych
    w oparciu o kartę w odniesieniu do regulacyjnych standardów technicznych ustanawiających
    wymogi, które muszą spełniać systemy kart płatniczych i podmioty obsługujące
    transakcje w celu zapewnienia stosowania wymogów niezależności pod względem
    rachunkowości, organizacji i procedury podejmowania decyzji
  type: main
