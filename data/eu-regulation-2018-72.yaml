    comisioanele interbancare pentru tranzacțiile de plată cu cardul cu privire
    la standardele tehnice de reglementare prin care se stabilesc cerințele care
    trebuie respectate de schemele de plată cu cardul și de entitățile de prelucrare
    pentru a asigura aplicarea cerințelor de independență în ceea ce privește
    contabilitatea, organizarea și procesul de luare a deciziilor
  type: main
