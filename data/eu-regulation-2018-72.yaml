  script: Latn
  content: Regolamento delegato (UE) 2018/72 della Commissione, del 4 ottobre 2017,
    che integra il regolamento (UE) 2015/751 del Parlamento europeo e del Consiglio
    relativo alle commissioni interbancarie sulle operazioni di pagamento basate su
    carta per quanto riguarda le norme tecniche di regolamentazione che stabiliscono
