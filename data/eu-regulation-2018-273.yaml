    regards the relevant checks and penalties, amending Commission Regulations (EC)
    No 555/2008, (EC) No 606/2009 and (EC) No 607/2009 and repealing Commission Regulation
    (EC) No 436/2009 and Commission Delegated Regulation (EU) 2015/560
  type: main
