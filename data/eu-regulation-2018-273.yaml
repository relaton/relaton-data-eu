  content: Commission Delegated Regulation (EU) 2018/273 of 11 December 2017 supplementing
    Regulation (EU) No 1308/2013 of the European Parliament and of the Council as
    regards the scheme of authorisations for vine plantings, the vineyard register,
    accompanying documents and certification, the inward and outward register, compulsory
    declarations, notifications and publication of notified information, and supplementing
