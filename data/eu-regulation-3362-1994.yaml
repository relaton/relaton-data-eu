title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3362/94 of 20 December 1994 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches for 1995 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3362/94 du Conseil, du 20 décembre 1994, fixant, pour
    certains stocks et groupes de stocks de poissons, les totaux admissibles des captures
    pour 1995 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3362/94 des Rates vom 20. Dezember 1994 zur Festlegung
    der zulässigen Gesamtfangmengen und entsprechenden Fangbedingungen für bestimmte
    Fischbestände oder- bestandsgruppen für 1995
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3362/94 af 20. december 1994 om fastsættelse
    for 1995 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3362/94 του Συμβουλίου
    της 20ής Δεκεμβρίου 1994 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπομένων αλιευμάτων
    (TAC) για το 1995, καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3362/94, annettu 20 päivänä joulukuuta 1994,
    tiettyjen kalakantojen ja kalakantaryhmien osalta vuodeksi 1995 vahvistettavista
    suurimmista sallituista saaliista ja niiden tietyistä pyyntiedellytyksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3362/94 del Consiglio, del 20 dicembre 1994, che stabilisce,
    per alcuni stock o gruppi di stock ittici, il totale ammissibile di catture (TAC)
    per il 1995 e talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3362/94 van de Raad van 20 december 1994 inzake de
    vaststelling van de voor 1995 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden, alsmede de bij de visserij in het kader
    van de totaal toegestane vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3362/94 do Conselho, de 20 de Dezembro de 1994, que
    fixa os totais admissíveis de capturas para 1995 e certas condições em que
    podem ser pescadas determinadas unidades populacionais ou grupos de unidades populacionais
    de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3362/94 del Consejo, de 20 de diciembre de 1994, por
    el que se fijan los totales admisibles de capturas de determinadas poblaciones
    y grupos de poblaciones de peces para 1995 y determinadas condiciones en las que
    pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 3362/94 av den 20 december 1994 om tillåten
    totalfångst för år 1995 för vissa fiskbestånd och grupper av fiskbestånd
    och om vissa villkor för hur fiske får bedrivas efter dem
  type: main
