    παρεμβάσεις στην περιφέρεια της Νότιας Σουηδίας,
    συμπεριλαμβανομένων των νότιων διαμερισμάτων
    της επαρχίας Östergötland, των ανατολικών διαμερισμάτων
    της επαρχίας Jönköping, των βόρειων διαμερισμάτων
