title:
- language: en
  script: Latn
  content: '2002/699/EC: Commission Decision of 20 December 2000 approving the single
    programming document for Community structural assistance in the Södra region,
    which covers the southern part of Östergötland County, the eastern part of Jönköping
    County, the northern part of Kalmar County and Öland municipalities in the same
    county, the eastern part of Kronoberg County and the majority of Blekinge County
    under Objective 2 in Sweden (notified under document number C(2000) 3523)'
  type: main
- language: fr
  script: Latn
  content: '2002/699/CE: Décision de la Commission, du 20 décembre 2000, portant
    approbation du document unique de programmation pour les interventions structurelles
    communautaires dans la région Södra (Suède méridionale) comprenant la partie
    sud du département d''Östergötland, la partie est du département de Jönköping,
    la partie nord du département de Kalmar et les communes de Öland dudit département,
    la partie est du département de Kronoberg, ainsi que la majeure partie du département
    de Blekinge, et relevant de l''objectif n° 2 en Suède [notifiée sous le numéro
    C(2000) 3523]'
  type: main
- language: de
  script: Latn
  content: '2002/699/EG: Entscheidung der Kommission vom 20. Dezember 2000 zur Genehmigung
    des einheitlichen Programmplanungsdokuments für die Strukturinterventionen der
    Gemeinschaft in der in Schweden unter das Ziel 2 fallenden Region Södra, bestehend
    aus dem südlichen Teil des Verwaltungsbezirks Östergötland, dem östlichen
    Teil des Verwaltungsbezirks Jönköping, dem nördlichen Teil und den Öland-Gemeinden
    des Verwaltungsbezirks Kalmar, dem östlichen Teil des Verwaltungsbezirks Kronoberg
    sowie dem Großteil des Verwaltungsbezirks Blekinge (Bekannt gegeben unter Aktenzeichen
    K(2000) 3523)'
  type: main
- language: da
  script: Latn
  content: '2002/699/EF: Kommissionens beslutning af 20. december 2000 om godkendelse
    af enhedsprogrammeringsdokumentet for EF-strukturinterventioner i Södra region,
    som omfatter den sydlige del af Östergötlands län, den østlige del af Jönköpings
    län, den nordlige del af Kalmar län og Ölandskommunerne i samme län, den østlige
    del af Kronobergs län og størstedelen af Blekinge län, og som er omfattet af
    mål 2 i Sverige (meddelt under nummer K(2000) 3523)'
  type: main
- language: el
