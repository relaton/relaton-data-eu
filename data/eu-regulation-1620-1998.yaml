title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1620/98 of 24 July 1998 determining the extent
    to which applications for import licences submitted in July 1998 for certain products
    in the milk and milk products sector under the schemes provided for in the Europe
    Agreements between the Community and the Republic of Hungary, the Republic of
    Poland, the Czech Republic, the Slovak Republic, Bulgaria and Romania, in the
    Agreements on free trade between the Community and the Baltic States and in the
    Interim Agreement between the Community and the Republic of Slovenia may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1620/98 de la Commission du 24 juillet 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1998 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre des régimes prévus par les accords européens entre la
    Communauté et la République de Hongrie, la République de Pologne, la République
    tchèque, la République slovaque, la Bulgarie et la Roumanie, du régime prévu
    par les accords sur la libéralisation des échanges entre la Communauté et les
    pays baltes et du régime prévu par l'accord intérimaire entre la Communauté
    et la Slovénie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1620/98 der Kommission vom 24. Juli 1998 über den
    Umfang, in dem den Anträgen auf Einfuhrlizenzen für bestimmte Milch- und Milcherzeugnisse
    stattgegeben werden kann, die im Juli 1998 im Rahmen der Regelungen gemäß den
    Europa-Abkommen zwischen der Gemeinschaft und der Republik Ungarn, der Republik
    Polen, der Tschechischen Republik, der Slowakischen Republik, Bulgarien und Rumänien,
    der Regelung gemäß dem Freihandelsabkommen zwischen der Gemeinschaft und den
    Baltischen Staaten und der Regelung gemäß dem Interimsabkommen zwischen der
    Gemeinschaft und Slowenien eingereicht wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1620/98 af 24. juli 1998 om fastsættelse
    af, i hvilket omfang de ansøgninger, der i juli 1998 er indgivet om importlicens
    for visse produkter i sektoren for mælk og mejeriprodukter i henhold til ordningerne
    i Europaaftalerne mellem Fællesskabet og Republikken Ungarn, Republikken Polen,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien,
    ordningen i aftalerne om liberalisering af samhandelen mellem Fællesskabet og
    De Baltiske Lande og ordningen i interimsaftalen mellem Fællesskabet og Slovenien,
    kan accepteres
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1620/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Ιουλίου 1998 για τον προσδιορισμό του
    μέτρου κατά το οποίο μπορούν να γίνονται δεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υπεβλήθησαν
    τον Ιούλιο του 1998 για ορισμένα προϊόντα στον
    τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων στο πλαίσιο των καθεστώτων που προβλέπονται
    από τις ευρωπαϊκές συμφωνίες μεταξύ της Κοινότητας
    και της Δημοκρατίας της Ουγγαρίας, της Δημοκρατίας
    της Πολωνίας, της Τσεχικής Δημοκρατίας, της
    Σλοβακικής Δημοκρατίας, της Βουλγαρίας και
    της Ρουμανίας, του καθεστώτος που προβλέπεται
    από τις συμφωνίες ελευθέρωσης των συναλλαγών
    μεταξύ της Κοινότητας και των βαλτικών χωρών
    και του καθεστώτος που προβλέπεται από την
    προσωρινή συμφωνία μεταξύ της Κοινότητας και
    της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1620/98, annettu 24 päivänä heinäkuuta 1998,
    yhteisön sekä Unkarin tasavallan, Puolan tasavallan, Tsekin tasavallan, Slovakian
    tasavallan, Bulgarian ja Romanian välisissä Eurooppa-sopimuksissa, yhteisön
    sekä Baltian maiden välisissä vapaakauppaa koskevissa sopimuksissa ja yhteisön
    sekä Slovenian tasavallan välisessä väliaikaisessa sopimuksessa määrätyn
    järjestelmän mukaisesti tietyistä maito- ja maitotuotealan tuotteista vuoden
    1998 heinäkuussa jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1620/98 della Commissione del 24 luglio 1998 che stabilisce
    la misura in cui possono essere accettate le domande di titoli d'importazione
    presentate nel luglio 1998 per taluni prodotti del settore del latte e del settore
    lattiero-caseario nel quadro dei regimi previsti dagli accordi europei tra la
    Comunità e la Repubblica d'Ungheria, la Repubblica di Polonia, la Repubblica
    ceca, la Repubblica slovacca, la Bulgaria e la Romania, del regime previsto dagli
    accordi sul libero scambio tra la Comunità e i paesi baltici e del regime previsto
    dall'accordo interinale tra la Comunità e la Repubblica slovena
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1620/98 van de Commissie van 24 juli 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector melk en zuivelproducten, die in juli 1998
    worden ingediend op grond van de regelingen waarin is voorzien bij de Europa-overeenkomsten
    tussen, enerzijds, de Gemeenschap en, anderzijds, de Republiek Hongarije, de Republiek
    Polen, de Tsjechische Republiek, de Slowaakse Republiek, Bulgarije en Roemenië,
    van de regeling waarin is voorzien bij de overeenkomsten betreffende vrijhandel
    en met handel verband houdende zaken tussen de Gemeenschap en de Baltische staten,
    en van de regeling waarin is voorzien bij de Interim-overeenkomst tussen de Gemeenschap
    en Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1620/98 da Comissão de 24 de Julho de 1998 que determina
    a medida em que podem ser aceites os pedidos de certificados de importação introduzidos
    em Julho de 1998 para determinados produtos do sector de leite e dos produtos
    lácteos no âmbito dos regimes previstos nos acordos europeus entre a Comunidade
    e a República da Hungria, a República da Polónia, a República Checa, a República
    Eslovaca, a Bulgária e a Roménia, do regime previsto nos acordos sobre comércio
    livre entre a Comunidade e os países bálticos e do regime previsto no acordo
    provisório entre a Comunidade e a Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1620/98 de la Comisión de 24 de julio de 1998 por
    el que se determina en qué medida podrán aceptarse las solicitudes de certificados
    de importación presentadas en julio de 1998 relativas a determinados productos
    del sector de la leche y de los productos lácteos en el ámbito de los regímenes
    previstos en los Acuerdos europeos entre la Comunidad y la República de Hungría,
    la República de Polonia, la República Checa, la República Eslovaca, Bulgaria
    y Rumania, del régimen previsto en los Acuerdos de libre comercio entre la Comunidad
    y los Países Bálticos y del régimen previsto en el Acuerdo interino entre la
    Comunidad y Eslovenia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1620/98 av den 24 juli 1998 om fastställande
    av i vilken utsträckning ansökningar om importlicenser får godkännas som inlämnas
    i juli 1998 för vissa produkter inom sektorn för mjölk och mjölkprodukter
    inom ramen för ordningarna i Europaavtalen mellan gemenskapen och Ungern, Polen,
    Tjeckien, Slovakien, Bulgarien och Rumänien, ordningen i frihandelsavtalen mellan
    gemenskapen och de baltiska länderna samt ordningen i interimsavtalen mellan
    gemenskapen och Slovenien
