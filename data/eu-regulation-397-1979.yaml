    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 397/79 van de Raad van 28 februari 1979 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden, van toepassing op op de Faeröer geregistreerde vaartuigen
