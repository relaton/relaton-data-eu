title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 397/79 of 28 February 1979 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 397/79 du Conseil, du 28 février 1979, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 397/79 des Rates vom 28. Februar 1979 zur Festlegung
    bestimmter Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    für die auf den Färöern registrierten Schiffe
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 397/79 af 28. februar 1979 om fastsættelse
    af visse midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 397/79 del Consiglio, del 28 febbraio 1979, che dispone
