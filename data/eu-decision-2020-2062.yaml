    und der Republik Albanien andererseits eingesetzten Stabilitäts- und Assoziationsrat
    zur Änderung des genannten Abkommens durch die Ersetzung des Protokolls Nr. 4
    über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung in“ oder „Ursprungserzeugnisse“
    und über die Methoden der Zusammenarbeit der Verwaltungen zu vertreten ist
  type: main
