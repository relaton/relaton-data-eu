    (ΕΟΚ) αριθ. 1609/88 όσον αφορά την ημερομηνία εισόδου
    σε απόθεμα βουτύρου που πωλείται βάσει του
    κανονισμού (ΕΟΚ) αριθ. 3143/85
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1561/89 DELLA COMMISSIONE del 5 giugno 1989 che modifica
