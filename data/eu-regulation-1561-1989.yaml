  content: Commission Regulation (EEC) No 1561/89 of 5 June 1989 amending Regulation
    (EEC) No 1609/88 as regards the latest time of entry into storage for butter sold
    under Regulation (EEC) No 3143/85
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1561/89 de la Commission du 5 juin 1989 modifiant
    le règlement (CEE) n° 1609/88 en ce qui concerne la date limite d'entrée en
    stock du beurre vendu au titre du règlement (CEE) n° 3143/85
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1561/89 DER KOMMISSION vom 5. Juni 1989 zur Änderung
    der Verordnung (EWG) Nr. 1609/88 zur Bestimmung des letzten Termins für die Einlagerung
    der gemäß der Verordnung (EWG) Nr. 3143/85 verkauften Butter #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1561/89 af 5. juni 1989 om ændring
    af forordning (EØF) nr. 1609/88 for så vidt angår fristen for indlagring af
    smør, der sælges i henhold til forordning (EØF) nr. 3143/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1561/89 της Επιτροπής
