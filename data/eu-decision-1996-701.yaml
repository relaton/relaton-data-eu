    die vom Europäischen Ausrichtungs- und Garantiefonds für die Landwirtschaft
    (EAGFL), Abteilung Garantie, im Haushaltsjahr 1992 und auch teilweise im Haushaltsjahr
    1993 finanzierten Ausgaben (Nur der spanische, deutsche, griechische und italienische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/701/EF: Kommissionens Beslutning af 20. november 1996 om ændring af
