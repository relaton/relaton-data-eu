title:
- language: en
  script: Latn
  content: '96/701/EC: Commission Decision of 20 November 1996 amending Decision 93/311/EC
    on the clearance of the accounts presented by the Member States in respect of
    the expenditure for 1992 of the Guarantee Section of the European Agricultural
    Guidance and Guarantee Fund (EAGGF) and in respect of certain expenditure for
    1993 (Only the Spanish, German, Greek and Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/701/CE: Décision de la Commission du 20 novembre 1996 modifiant la
    décision 96/311/CE relative à l''apurement des comptes des États membres au
    titre des dépenses financées par le Fonds européen d''orientation et de garantie
    agricole (FEOGA), section «garantie», pour l''exercice financier 1992 ainsi
    que de certaines dépenses pour l''exercice 1993 (Les textes en langues espagnole,
    allemande, grecque et italienne sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/701/EG: Entscheidung der Kommission vom 20. November 1996 zur Änderung
