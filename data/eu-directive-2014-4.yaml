    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb li jippermetti konnessjonijiet ermetiċi bejn l-aluminju
    u l-azzar fl-intensifikaturi tal-immaġnijiet tar-raġġi X
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/4/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood als toepassing voor vacuümdichte verbindingen tussen
    aluminium en staal in röntgenbeeldversterkers
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/4/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu umożliwiającego próżnioszczelne połączenie aluminium i stali we
    wzmacniaczach obrazu RTG
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/4/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para chumbo em ligações estanques ao vácuo entre alumínio e aço nos intensificadores
    de imagens de raios X
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/4/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul care permite etanșarea racordurilor dintre aluminiu și oțel în amplificatoarele
    de imagine pentru imagini radiologice
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/4/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre používanie olova na
    vytvorenie vákuovo tesných spojov medzi hliníkom a oceľou v zosilňovačoch
    röntgenového obrazu
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/4/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjem pri
    uporabi svinca za omogočanje vakuumskih povezav med aluminijem in jeklom v ojačevalnikih
    rentgenskih slik zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/4/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en conexiones estancas a prueba de vacío entre el aluminio y el
    acero en intensificadores de imagen de rayos X
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/4/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för ”bly som möjliggör
    vakuumtäta anslutningar mellan aluminium och stål i bildförstärkare för röntgenbilder”
