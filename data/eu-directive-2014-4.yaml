    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    за осигуряване на вакуумно плътни свързвания
    между алуминий и стомана в усилвателите на
    рентгенови изображения
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/4/EU ze dne 18. října 2013
    , kterou se pro účely přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    použití olova umožňujícího vakuově těsné spoje hliníku a oceli v rentgenových
    zesilovačích obrazu
  type: main
