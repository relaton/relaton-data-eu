    a röntgen-képerősítőkben lévő alumínium és acél alkatrészek légzáró
    csatlakoztatásához használt ólom mentesítése tekintetében, a műszaki fejlődéshez
    történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/4/UE della Commissione, del 18 ottobre 2013 , che
    modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione relativa
    al piombo come saldante ermetico tra l’alluminio e l’acciaio in amplificatori
    di immagini radiografiche
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/4/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam, lai veidotu
    hermētiskus savienojumus starp alumīniju un tēraudu rentgena attēlu pastiprinātājos
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/4/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    šviną naudoti rentgeno vaizdo stiprintuvų vakuuminių aliuminio ir plieno jungčių
    sandarumui užtikrinti
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/4/UE tat- 18 ta’ Ottubru
