title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/4/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, the Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    enabling vacuum tight connections between aluminium and steel in X-ray image intensifiers
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/4/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb permettant des raccords étanches entre l’aluminium et l’acier
    dans les amplificateurs de luminance des images radiologiques
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/4/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei zur Herstellung vakuumdichter Verbindungen zwischen Aluminium
    und Stahl in Röntgenbildverstärkern
  type: main
- language: bg
  script: Cyrl
