    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε τον Ιανουάριο του 1995 για άδειες
    εισαγωγείς αυγών και κρέατος πουλερικών βάσει
    του καθεστώτος που προβλέπεται από τις συμφωνίες,
