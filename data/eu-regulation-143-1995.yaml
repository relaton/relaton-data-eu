  content: COMMISSION REGULATION (EC) No 143/95 of 27 January 1995 determining the
    extent to which applications lodged in January 1995 licences for certain eggs
    and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 143/95 DE LA COMMISSION du 27 janvier 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1995 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus par la Communauté
    avec la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 143/95 DER KOMMISSION vom 27. Januar 1995 über die
