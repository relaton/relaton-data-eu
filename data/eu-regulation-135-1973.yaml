  content: Regulation (EEC) No 135/73 of the Council of 15 January 1973 laying down
    general rules for determining, in the fishery sector, the landing areas situated
    at a considerable distance from the main centres of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 135/73 du Conseil, du 15 janvier 1973, établissant
    les règles générales relatives à la détermination, dans le secteur de la
    pêche, des zones de débarquement très éloignées des principaux centres de
    consommation de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 135/73 des Rates vom 15. Januar 1973 zur Festlegung
    der allgemeinen Vorschriften für die Bestimmung der Anlandegebiete der Fischwirtschaft,
    die von den wichtigsten Verbrauchszentren der Gemeinschaft sehr weit entfernt
    liegen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 135/73 af 15. januar 1973 om indførelse
