title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2941/92 of 9 October 1992 amending Regulation
    (EEC) No 2296/92 laying down certain rules of application for the use of land
    set aside for the provision of materials for the manufacture within the Community
    of products not primarily intended for human or animal consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2941/92 de la Commission, du 9 octobre 1992, modifiant
    le règlement (CEE) n° 2296/92 portant modalités d' application relatives à
    l' utilisation des terres mises en jachère pour la production de matières servant
    à la fabrication dans la Communauté de produits destinés à des fins principales
    autres que la consommation humaine ou animale
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2941/92 der Kommission vom 9. Oktober 1992 zur Änderung
    der Verordnung (EWG) Nr. 2296/92 mit Durchführungsbestimmungen für die Nutzung
    stillgelegter Flächen zur Erzeugung von Rohstoffen, die in der Gemeinschaft zu
    nicht in erster Linie für Lebensmittel- oder Futtermittelzwecke bestimmten Erzeugnissen
    verarbeitet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2941/92 af 9. oktober 1992 om ændring
    af forordning (EØF) nr. 2296/92 om gennemførelsesbestemmelser for anvendelse
    af udtagne arealer med henblik på tilvejebringelse af materialer til fremstilling
    i Fællesskabet af produkter, som ikke primært er bestemt til konsum eller foderbrug
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2941/92 της Επιτροπής
    της 9ης Οκτωβρίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2296/92 που θεσπίζει ορισμένους
    κανόνες εφαρμογής για τη χρησιμοποίηση της
    γης, η οποία ευρίσκεται υπό το καθεστώς προσωρινής
    παύσης στην παραγωγή υλών για την παρασκευή,
    εντός της Κοινότητας, προϊόντων που δεν προορίζονται
    κυρίως για τη διατροφή του ανθρώπου ή των ζώων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2941/92 della Commissione, del 9 ottobre 1992, recante
    modifica del regolamento (CEE) n. 2296/92 che stabilisce talune modalità di applicazione
    per l' utilizzazione di superfici ritirate dalla produzione al fine di ottenere
    materiali per la fabbricazione, nella Comunità, di prodotti non destinati in
    primo luogo al consumo umano o animale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2941/92 van de Commissie van 9 oktober 1992 tot wijziging
    van Verordening (EEG) nr. 2296/92 houdende vaststelling van uitvoeringsbepalingen
    betreffende het gebruik van uit produktie genomen grond voor de produktie van
    grondstoffen voor de vervaardiging, in de Gemeenschap, van niet specifiek voor
    voeding of vervoedering bestemde produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2941/92 da Comissão, de 9 de Outubro de 1992, que
    altera o Regulamento (CEE) n° 2296/92, que estabelece certas regras de execução
    para a utilização de terras retiradas para a produção de matérias destinadas
    ao fabrico, na Comunidade, de produtos não destinados primariamente ao consumo
    humano ou animal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2941/92 de la Comisión, de 9 de octubre de 1992,
    por el que se modifica el Reglamento (CEE) n° 2296/92 por el que se establecen
    ciertas disposiciones de aplicación para la utilización de las tierras retiradas
    de la producción en las que se obtengan materias para la elaboración en la Comunidad
    de productos no destinados principalmente al consumo humano o animal
  type: main
