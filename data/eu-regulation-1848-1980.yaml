id: EURegulation18481980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1848/80 of 11 July 1980 re-establishing
    the levying of customs duties on umbrellas and sunshades (including walking-stick
    umbrellas, umbrella tents, and garden and similar umbrellas), falling within heading
    No 66.01 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1848/80 de la Commission, du 11 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, y compris les parapluies-cannes et les parasols-tentes
    et similaires, de la position 66.01 du tarif douanier commun, originaires de Singapour,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1848/80 der Kommission vom 11. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme, einschließlich Stockschirme,
    Schirmzelte und dergleichen, der Tarifnummer 66.01, mit Ursprung in Singapur,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1848/80 af 11. juli 1980 om genindførelse
    af toldafgifter for paraplyer og parasoller (herunder stokkeparaplyer, paraplytelte,
    haveparasoller o.lign.), under pos. 66.01, som har oprindelse i Singapore, og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1848/80 della Commissione, dell' 11 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia
    e da sole), compresi gli ombrelli-bastone, i parasole-tende, gli ombrelloni e
    simili, della voce 66.01 della tariffa doganale comune, originari di Singapore,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1848/80 van de Commissie van 11 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op paraplu'
    s en parasols, alsmede wandelstokparaplu' s, tuinparasols, parasoltenten en dergelijke,
    van post 66.01, van oorsprong uit Singapore, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
