    prosiąt ssących oraz w sprawie uchylenia rozporządzeń (WE) nr 243/2007, (WE)
    nr 1142/2007, (WE) nr 165/2008, (WE) nr 505/2008 i (UE) nr 327/2010 (posiadacz
    zezwolenia BASF SE)
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2020/172 da Comissão de 6 de fevereiro
    de 2020 relativo à renovação da autorização de 3-fitase produzida por Aspergillus
    niger (CBS 101.672) como aditivo em alimentos para leitões (desmamados), suínos
    de engorda, porcas, frangos de engorda, perus de engorda, galinhas poedeiras,
