id: EURegulation2020172
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/172 of 6 February 2020 concerning
    the renewal of the authorisation of 3-phytase produced by Aspergillus niger (CBS
    101.672) as a feed additive for piglets (weaned), pigs for fattening, sows, chickens
    for fattening, turkeys for fattening, laying hens, ducks and all other minor avian
    species, ornamental birds and the new authorisation for chickens reared for laying
    or for breeding purposes, turkeys reared for breeding or breeding hens and suckling
    piglets and repealing Regulations (EC) No 243/2007, (EC) No 1142/2007, (EC) No
    165/2008, (EC) No 505/2008 and (EU) No 327/2010 (holder of authorisation BASF
    SE)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2020/172 de la commission du 6 février
    2020 concernant le renouvellement de l’autorisation de la 3-phytase produite
    par Aspergillus niger (CBS 101.672) en tant qu’additif pour l’alimentation
    animale pour les porcelets (sevrés), les porcs d’engraissement, les truies,
    les poulets d’engraissement, les dindes d’engraissement, les poules pondeuses,
    les canards et toutes les autres espèces aviaires mineures et les oiseaux d’ornement,
    ainsi que l’octroi d’une nouvelle autorisation pour les poulets élevés pour
    la ponte ou la reproduction, les dindes élevées pour la reproduction, les poules
    reproductrices et les porcelets non sevrés, et abrogeant les règlements (CE)
    no 243/2007, (CE) no 1142/2007, (CE) no 165/2008, (CE) no 505/2008 et (UE) no
    327/2010 de la Commission (titulaire de l’autorisation: BASF SE)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2020/172 der Kommission vom 6. Februar 2020
    zur Verlängerung der Zulassung von 3-Phytase aus Aspergillus niger (CBS 101.672)
    als Futtermittelzusatzstoff für Ferkel (entwöhnt), Mastschweine, Sauen, Masthühner,
    Masttruthühner, Legehennen, Enten sowie alle anderen Vogelarten von geringerer
    wirtschaftlicher Bedeutung und Ziervögel sowie zur Neuzulassung für Junghennen
    oder Junghühner für die Zucht, Jungtruthühner für die Zucht oder Zuchthennen
    und Saugferkel sowie zur Aufhebung der Verordnungen (EG) Nr. 243/2007, (EG) Nr.
    1142/2007, (EG) Nr. 165/2008, (EG) Nr. 505/2008 und (EU) Nr. 327/2010 (Zulassungsinhaber:
    BASF SE)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за Изпълнение (ЕС) 2020/172 на Комисията
    от 6 февруари 2020 година за подновяване на разрешението
    за употреба на 3-фитаза, получена от Aspergillus niger
    (CBS 101.672), като фуражна добавка за прасенца (отбити),
    прасета за угояване, свине майки, пилета за
    угояване, пуйки за угояване, кокошки носачки,
    патици и всички други птичи видове с по-малко
    стопанско значение и декоративни птици, за
    ново разрешение за употреба за пилета, отглеждани
    за кокошки носачки или за разплод, пуйки, отглеждани
    за разплод, или кокошки за разплод и прасенца
    сукалчета, и за отмяна на регламенти (ЕО) №
    243/2007, (ЕО) № 1142/2007, (ЕО) № 165/2008, (ЕО) № 505/2008 и (ЕС)
    № 327/2010 (притежател на разрешението BASF SE)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/172 ze dne 6. února 2020 o obnovení
    povolení 3-fytázy z Aspergillus niger (CBS 101.672) jako doplňkové látky
    pro odstavená selata, výkrm prasat, prasnice, výkrm kuřat, výkrm krůt, nosnice,
    kachny a všechny ostatní menšinové druhy ptactva a okrasné ptactvo, o novém
    povolení pro odchov kuřat a kuřice, odchov krůt a nosnic a sající selata
    a o zrušení nařízení (ES) č. 243/2007, (ES) č. 1142/2007, (ES) č. 165/2008,
    (ES) č. 505/2008 a (EU) č. 327/2010 (držitel povolení BASF SE)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/172 af 6. februar 2020
    om fornyelse af godkendelsen af 3-fytase produceret af Aspergillus niger (CBS
    101.672) som tilsætningsstof til foder til smågrise (fravænnede), slagtesvin,
    søer, slagtekyllinger, slagtekalkuner, æglæggende høner, ænder og alle andre
    mindre udbredte fuglearter, prydfugle og den nye godkendelse til kyllinger opdrættet
    til æglægning eller avl, kalkuner opdrættet til avl eller avlshøner og pattegrise
    og om ophævelse af forordning (EF) nr. 243/2007, (EF) nr. 1142/2007, (EF) nr.
    165/2008, (EF) nr. 505/2008 og (EU) nr. 327/2010 (indehaver af godkendelsen er
    BASF SE)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2020/172 της Επιτροπής
    της 6ης Φεβρουαρίου 2020 για την ανανέωση της
    άδειας για τη χρήση της 3-φυτάσης που παράγεται
    από τον μύκητα Aspergillus niger (CBS 101.672) ως πρόσθετης
    ύλης ζωοτροφών για χοιρίδια (απογαλακτισμένα),
    χοίρους προς πάχυνση, χοιρομητέρες, κοτόπουλα
    προς πάχυνση, γαλοπούλες προς πάχυνση, όρνιθες
    ωοπαραγωγής, πάπιες και όλα τα άλλα δευτερεύοντα
    είδη πτηνών, διακοσμητικά πτηνά και τη χορήγηση
    νέας άδειας για κοτόπουλα εκτρεφόμενα για
    ωοπαραγωγή ή αναπαραγωγή, γαλοπούλες εκτρεφόμενες
    για αναπαραγωγή ή όρνιθες αναπαραγωγής και
    θηλάζοντα χοιρίδια και για την κατάργηση των
    κανονισμών (ΕΚ) αριθ. 243/2007, (ΕΚ) αριθ. 1142/2007, (ΕΚ)
    αριθ. 165/2008, (ΕΚ) αριθ. 505/2008 και (ΕΕ) αριθ. 327/2010
    (κάτοχος της άδειας: BASF SE)'
  type: main
- language: et
  script: Latn
  content: Komisjoni Rakendusmäärus (EL) 2020/172, 6. veebruar 2020, millega pikendatakse
    luba kasutada Aspergillus niger’i (CBS 101.672) abil toodetud 3-fütaasi võõrutatud
    põrsaste, nuumsigade, emiste, broilerkanade, broilerkalkunite, munakanade, partide
    ja kõigi muude väiksemate linnuliikide ja ilulindude söödalisandina ning antakse
    luba uueks kasutusviisiks munemiseks või aretuseks kasvatatavate kanade, aretuseks
    kasvatatavate kalkunite või aretuskanade ja piimapõrsaste söödalisandina ning
    tunnistatakse kehtetuks määrused (EÜ) nr 243/2007, (EÜ) nr 1142/2007, (EÜ)
    nr 165/2008, (EÜ) nr 505/2008 ja (EL) nr 327/2010 (loa hoidja BASF SE)
  type: main
- language: fi
  script: Latn
  content: Komission Täytäntöönpanoasetus (EU) 2020/172, annettu 6 päivänä
    helmikuuta 2020, Aspergillus niger -organismin (CBS 101.672) tuottaman 3-fytaasin
    hyväksynnän uusimisesta porsaiden (vieroitettujen), lihasikojen, emakkojen,
    broilerien, lihakalkkunoiden, munivien kanojen, ankkojen ja kaikkien muiden toissijaisten
    siipikarjalajien ja koristetarkoituksiin käytettävien lintujen rehun lisäaineena
    ja uudesta hyväksynnästä kananuorikoiden tai siitoseläimiksi kasvatettavien
    kanojen, siitoseläimiksi kasvatettavien kalkkunoiden tai kalkkunaemojen ja imevien
    porsaiden rehun lisäaineena sekä asetusten (EY) N:o 243/2007, (EY) N:o 1142/2007,
    (EY) N:o 165/2008, (EY) N:o 505/2008 ja (EU) N:o 327/2010 kumoamisesta (hyväksynnän
    haltija BASF SE)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/172 оd 6. veljače 2020. o produljenju
    odobrenja 3-fitaze proizvedene od Aspergillus niger (CBS 101.672) kao dodatka
    hrani za prasad (odbijenu), svinje za tov, krmače, piliće za tov, pure za tov,
    kokoši nesilice, patke i sve ostale manje značajne vrste ptica, ukrasne ptice
    i o novom odobrenju za piliće uzgajane za nesenje ili za rasplod, pure uzgajane
    za rasplod ili kokoši za rasplod i prasad te o stavljanju izvan snage uredaba
    (EZ) br. 243/2007, (EZ) br. 1142/2007, (EZ) br. 165/2008, (EZ) br. 505/2008 i
    (EU) br. 327/2010 (nositelj odobrenja BASF SE)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2020/172 Végrehajtási rendelete (2020. február 6.)
    az Aspergillus niger (CBS 101.672) által termelt 3-fitáz elválasztott malacok,
    hízósertések, kocák, brojlercsirkék, hízópulykák, tojótyúkok, kacsák,
    valamennyi kisebb madárfaj és díszmadarak takarmány-adalékanyagaként való
    engedélyezésének megújításáról, a tojójércék, tenyészcsirkék, tenyészpulykák,
    tenyésztyúkok és szopós malacok esetében való új felhasználás engedélyezéséről,
    valamint a 243/2007/EK, az 1142/2007/EK, a 165/2008/EK, az 505/2008/EK és a 327/2010/EU
    rendelet hatályon kívül helyezéséről (az engedély jogosultja: BASF SE)'
  type: main
- language: it
  script: Latn
  content: Regolamento di Esecuzione (UE) 2020/172 della Commissione del 6 febbraio
    2020 relativo al rinnovo dell’autorizzazione della 3-fitasi prodotta da Aspergillus
    niger (CBS 101.672) come additivo per mangimi destinati a suinetti (svezzati),
    suini da ingrasso, scrofe, polli da ingrasso, tacchini da ingrasso, galline ovaiole,
    anatre e tutte le altre specie avicole minori e uccelli ornamentali nonché alla
    nuova autorizzazione per pollastre allevate per la produzione di uova o per la
    riproduzione, tacchini allevati per la riproduzione o galline da riproduzione
    e suinetti lattanti e che abroga i regolamenti (CE) n. 243/2007, (CE) n. 1142/2007,
    (CE) n. 165/2008, n. 505/2008 e (UE) n. 327/2010 (titolare dell’autorizzazione
    BASF SE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/172 (2020. gada 6. februāris),
    ar ko atjauno atļauju lietot no Aspergillus niger (CBS 101.672) iegūtu 3-fitāzi
    par (atšķirtu) sivēnu, nobarojamo cūku, sivēnmāšu, gaļas cāļu, gaļas
    tītaru, dējējvistu, pīļu, visu citu mazāk izplatītu sugu putnu un dekoratīvo
    putnu barības piedevu, atļauj šīs piedevas jaunu lietojumu dējējvistu cāļiem
    un vaislas cāļiem, vaislas tītariem un vaislas vistām un zīdāmajiem sivēniem
    un atceļ Regulas (EK) Nr. 243/2007, (EK) Nr. 1142/2007, (EK) Nr. 165/2008, (EK)
    Nr. 505/2008 un (ES) Nr. 327/2010 (atļaujas turētājs BASF SE)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/172 2020 m. vasario 6 d.
    dėl leidimo naudoti 3-fitazę, gautą iš Aspergillus niger (CBS 101.672), kaip
    (nujunkytų) paršelių, penimų kiaulių, paršavedžių, mėsinių viščiukų,
    mėsinių kalakutų, vištų dedeklių, ančių ir visų kitų retesnių rūšių
    paukščių, dekoratyvinių paukščių pašarų priedą atnaujinimo ir naujo
    leidimo ją naudoti kaip dedeklinių ir veislinių vištaičių, veislinių kalakutų,
    veislinių vištų ir žindomų paršelių pašarų priedą, kuriuo panaikinami
    reglamentai (EB) Nr. 243/2007, (EB) Nr. 1142/2007, (EB) Nr. 165/2008, (EB) Nr.
    505/2008 ir (ES) Nr. 327/2010 (leidimo turėtoja – bendrovė BASF SE)
  type: main
- language: mt
  script: Latn
