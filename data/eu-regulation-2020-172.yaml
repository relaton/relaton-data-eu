  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/172 van de Commissie van 6 februari 2020
    betreffende de verlenging van de vergunning voor 3-fytase geproduceerd door Aspergillus
    niger (CBS 101.672) als toevoegingsmiddel voor diervoeding voor biggen (gespeend),
    mestvarkens, zeugen, mestkippen, mestkalkoenen, legkippen, eenden en alle andere
    kleinere vogelsoorten, siervogels en de nieuwe vergunning voor kippen gehouden
    voor legdoeleinden of voor fokdoeleinden, kalkoenen gehouden voor fokdoeleinden
    of fokhennen en speenvarkens en tot intrekking van de Verordeningen (EG) nr. 243/2007,
    (EG) nr. 1142/2007, (EG) nr. 165/2008, (EG) nr. 505/2008 en (EU) nr. 327/2010
    (vergunninghouder BASF SE)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/172 z dnia 6 lutego 2020 r.
    w sprawie odnowienia zezwolenia na stosowanie 3-fitazy wytwarzanej przez Aspergillus
    niger (CBS 101.672) jako dodatku paszowego dla prosiąt (odsadzonych od maciory),
    tuczników, loch, kurcząt rzeźnych, indyków rzeźnych, kur niosek, kaczek i
