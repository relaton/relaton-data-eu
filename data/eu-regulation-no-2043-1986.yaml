    και της ορύζης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2043/86 della Commissione del 30 giugno 1986 che modifica
    il regolamento (CEE) n. 2042/75 del Consiglio che stabilisce le modalità particolari
    di applicazione del regime dei titoli di importazione e di esportazione nel settore
    dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2043/86 van de Commissie van 30 juni 1986 tot wijziging
