    1991/92, samt af den koefficient, der skal benyttes ved beregningen af beløbene
    for forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1826/91 της Επιτροπής
