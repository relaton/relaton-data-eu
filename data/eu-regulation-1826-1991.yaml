  content: Commission Regulation (EEC) No 1826/91 of 27 June 1991 laying down the
    accession compensatory amounts applicable to Portugal in the cereals sector for
    the 1991/92 marketing year and the coefficient to be used for calculating the
    amounts applicable to processed products
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1826/91 DE LA COMMISSION du 27 juin 1991 fixant les
    montants compensatoires « adhésion » applicables au Portugal dans le secteur
    des céréales pour la campagne 1991/1992 ainsi que le coefficient à retenir
    pour le calcul des montants applicables aux produits transformés #'
  type: main
- language: de
  script: Latn
