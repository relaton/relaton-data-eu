schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2420/71 de la Commission, du 10 novembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux linges de lit, de table de toilette, d'office ou de cuisine, rideaux, vitrage
    et autres articles d'ameublement en tissus de coton, de la position tarifaire
    ex 62.02, originaires de l'Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n 1311/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2420/71 der Kommission vom 10. November 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Bettwäsche,
    Tischwäsche, Wäsche zur Körperpflege und andere Haushaltswäsche, Vorhänge,
    Gardinen und andere Gegenstände zur Innenausstattung, aus Baumwolle, der Tarifnummer
    ex 62.02 mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 1311/71 des
    Rates vom 21. Juni 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2420/71 della Commissione, del 10 novembre 1971, relativo
    al ripristino della riscossione dei dazi della tariffa doganale comune applicabili
    alla biancheria da letto, da tavola, da toletta, da servizio o da cucina, tende,
    tendine ed altri manufatti per l'arredamento, in tessuti di cotone della voce
    doganale n. ex 62.02, originari dell'India, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 1311/71 del Consiglio, del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2420/71 van de Commissie van 10 november 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op tafel-, bedde- en huishoudlinnen; gordijnen, vitrages en andere
    artikelen, voor stoffering, van weefsels van katoen van post ex 62.02 van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden, als bepaald bij Verordening
    (EEG) nr. 1311/71 van de Raad van 21 juni 1971
  type: main
