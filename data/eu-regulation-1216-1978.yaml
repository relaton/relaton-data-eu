title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1216/78 of 6 June 1978 re-establishing the
    levying of customs duties on wood, planed, tongued, grooved, etc., falling within
    heading No 44.13, originating in Brazil to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1216/78 de la Commission, du 6 juin 1978, portant
    rétablissement de la perception des droits de douane applicables aux bois rabotés,
    rainés, bouvetés, languetés, etc., de la position tarifaire 44.13, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1216/78 der Kommission vom 6. Juni 1978 zur Wiedereinführung
    des Zollsatzes für Holz (einschließlich Stäbe ...), gehobelt usw., der Tarifnummer
    44.13, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1216/78 af 6. juni 1978 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, etc., under
    position 44.13, som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1216/78 della Commissione, del 6 giugno 1978, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, ecc., della voce doganale 44.13, originario del
    Brasile, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1216/78 van de Commissie van 6 juni 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op hout (nietineengezette
    plankjes ...), geschaafd, enz., van post 44.13, van oorsprong uit Brazilië, ten
    behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
