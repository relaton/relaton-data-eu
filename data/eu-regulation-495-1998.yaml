id: EURegulation4951998
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 495/98 of 23 February 1998 imposing a definitive
    anti-dumping duty on imports of ferro-silico-manganese originating in the People's
    Republic of China, amending Regulation (EC) No 2413/95 in respect of anti-dumping
    measures concerning imports of ferro-silico-manganese originating in Ukraine and
    terminating the proceeding in respect of imports of ferro-silico-manganese originating
    in Brazil, South Africa and Russia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 495/98 du Conseil du 23 février 1998 instituant un
    droit antidumping définitif sur les importations de ferrosilicomanganèse originaire
    de la République populaire de Chine, modifiant le règlement (CE) n° 2413/95
    concernant les mesures antidumping instituées sur les importations de ferrosilicomanganèse
    originaire d'Ukraine et clôturant la procédure concernant les importations de
    ferrosilicomanganèse originaire du Brésil, d'Afrique du Sud et de Russie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 495/98 des Rates vom 23. Februar 1998 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Ferrosiliciummangan
    mit Ursprung in der Volksrepublik China, zur Änderung der Verordnung (EG) Nr.
    2413/95 hinsichtlich der Antidumpingmaßnahmen betreffend die Einfuhren von Ferrosiliciummangan
    mit Ursprung in der Ukraine und zur Einstellung des Verfahrens gegenüber den
    Einfuhren von Ferrosiliciummangan mit Ursprung in Brasilien, Südafrika und Rußland
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 495/98 af 23. februar 1998 om indførelse af
    en endelig antidumpingtold på importen af ferrosiliciummangan med oprindelse
    i Folkerepublikken Kina, og om ændring af forordning (EF) nr. 2413/95 for så
    vidt angår antidumpingforanstaltninger vedrørende importen af ferrosiliciummangan
    med oprindelse i Ukraine og om afslutning af proceduren for så vidt angår importen
    af ferrosiliciummangan med oprindelse i Brasilien, Sydafrika og Rusland
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 495/98 του Συμβουλίου
    της 23ης Φεβρουαρίου 1998 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές σιδηροπυριτίου-μαγγανίου,
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, για
    την τροποποίηση του κανονισμού (ΕΚ) αριθ. 2413/95
    όσον αφορά τα μέτρα αντιντάμπινγκ που έχουν
    επιβληθεί στις εισαγωγές σιδηροπυριτίου-μαγγανίου,
    καταγωγής Ουκρανίας, και για την περάτωση της
    διαδικασίας όσον αφορά τις εισαγωγές σιδηροπυριτίου-μαγγανίου,
    καταγωγής Βραζιλίας, Νότιας Αφρικής και Ρωσίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 495/98, annettu 23 päivänä helmikuuta 1998,
    lopullisen polkumyyntitullin käyttöönotosta Kiinan kansantasavallasta peräisin
    olevan ferropiimangaanin tuonnissa sekä asetuksen (EY) N:o 2413/95 muuttamisesta
    Ukrainasta peräisin olevan ferropiimangaanin tuontia koskevien polkumyyntitoimenpiteiden
    ja Brasiliasta, Etelä-Afrikasta ja Venäjältä peräisin olevan ferropiimangaanin
    tuontia koskevan menettelyn päättämisen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 495/98 del Consiglio del 23 febbraio 1998 che istituisce
    un dazio antidumping definitivo sulle importazioni di ferro-silico-manganese originario
    della Repubblica popolare cinese, modifica il regolamento (CE) n. 2413/95 per
    quanto riguarda le misure antidumping istituite sulle importazioni di ferro-silico-manganese
    originario dell'Ucraina, e chiude il procedimento riguardante le importazioni
    di ferro- silico-manganese originario del Brasile, del Sudafrica e della Russia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 495/98 van de Raad van 23 februari 1998 tot instelling
    van een definitief antidumpingrecht op de invoer van ferrosilicomangaan van oorsprong
    uit de Volksrepubliek China, tot wijziging van Verordening (EG) nr. 2413/95 ten
    aanzien van de antidumpingmaatregelen voor de invoer van ferrosilicomangaan van
    oorsprong uit Oekraïne en tot beëindiging van de procedure met betrekking tot
    de invoer van ferrosilicomangaan van oorsprong uit Brazilië, Zuid-Afrika en Rusland
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 495/98 do Conselho de 23 de Fevereiro de 1998 que
    institui um direito anti-dumping definitivo sobre as importações de ferro-silíco-manganês
    originário da República Popular da China, que altera o Regulamento (CE) nº
    2413/95 no que se refere às medidas anti-dumping instituídas sobre as importações
    de ferro- silício-manganês originário da Ucrânia e que encerra o processo
    relativo às importações de ferro-silício- manganês originário do Brasil,
    da África do Sul e da Rússia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 495/98 del Consejo de 23 de febrero de 1998 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    ferrosiliciomanganeso originarias de la República Popular de China y por el que
    se modifica el Reglamento (CE) n° 2413/95 por lo que se refiere a las medidas
    antidumping relativas a las importaciones de ferrosiliciomanganeso originarias
    de Ucrania y por el que se concluye el procedimiento por lo que se refiere a las
    importaciones de ferrosiliciomanganeso originarias de Brasil, de Sudáfrica y
    de Rusia
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 495/98 av den 23 februari 1998 om införande
    av en slutgiltig antidumpningstull på import av ferrokiselmangan med ursprung
    i Folkrepubliken Kina, som ändrar förordning (EG) nr 2413/95 såvitt avser antidumpningsåtgärder
    avseende import av ferrokiselmangan med ursprung i Ukraina och avslutar förfarandet
    avseende import av ferrokiselmangan med ursprung i Brasilien, Ryssland och Sydafrika
