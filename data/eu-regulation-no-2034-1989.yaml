title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2034/89 of 6 July 1989 re-establishing the
    levying of customs duties on household linen of all kinds, knitted or crocheted,
    products of category 67 (order No 40.0670), garments other than knitted or crocheted,
    products of category 78 (order No 40.0780), sacks and bags, of a kind used for
    the packing of goods, products of category 93 (order No 40.0930) originating in
    Pakistan to which the preferential tariff arrangements of Council Regulation (EEC)
    No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2034/89 de la Commission du 6 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables au linge de
    tous types en bonneterie de la catégorie 67 (numéro d'ordre 40.0670), aux vêtements
    autres qu'en bonneterie de la catégorie 78 (numéro d'ordre 40.0780) et aux sacs
    et sachets d'emballage de la catégorie 93 (numéro d'ordre 40.0930), originaires
    du Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2034/89 DER KOMMISSION vom 6. Juli 1989 zur Wiedereinführung
    des Zollsatzes für Wäsche aller Art, aus Gewirken, der Warenkategorie Nr. 67
    (lfd. Nr. 40.0670), Bekleidung, andere als aus Gewirken, der Warenkategorie Nr.
    78 (lfd. Nr. 40.0780), und Säcke und Beutel zu Verpackungszwecken der Warenkategorie
    Nr. 93 (lfd. Nr. 40.0930), mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2034/89 af 6. juli 1989 om genindførelse
    af opkrævning af toldafgifter for al slags linned af trikotage, under varekategori
    nr. 67 (løbenummer 40.0670), beklædningsgenstande, ikke af trikotage, under
    varekategori nr. 78 (løbenummer 40.0780) og sække og poser til emballage, under
    varekategori nr. 93 (løbenummer 40.0930), som har oprindelse i Pakistan og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2034/89 της Επιτροπής
