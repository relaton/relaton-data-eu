  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2034/89 DELLA COMMISSIONE del 6 luglio 1989 che ripristina
    la riscossione dei dazi doganali alle tende, tendine, tende avvolgibili, mantovane,
    bordi da letto e altri manufatti per l'' arredamento a maglia, della categoria
    di prodotti n. 67 (numero d'' ordine 40.0670), agli indumenti diversi da quelli
    a maglia, della categoria di prodotti n. 78 (numero d'' ordine 40.0780), ai sacchi
    e sacchetti da imballaggio della categoria di prodotti n. 93 (numero d'' ordine
    40.0930), originari del Pakistan, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 4259/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2034/89 VAN DE COMMISSIE van 6 juli 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van alle soorten, van brei- of haakwerk, van de categorie van produkten nr. 67
    (volgnummer 40.0670), kleding, andere dan van brei- of haakwerk, van de categorie
    van produkten nr. 78 (volgnummer 40.0780) en zakken voor verpakkingsdoeleinden
    van de categorie van produkten nr. 93 (volgnummer 40.0930), van oorsprong uit
    Pakistan, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 4259/88 van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2034/89 DA COMISSÃO de 6 de Julho de 1989 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis à roupa de todos os tipos, em
    malha, da categoria 67 (nº de ordem 40.0670), ao vestuário exterior, com excepção
    do de malha, da categoria 78 (nº de ordem 40.0780), e aos sacos e similares de
    embalagem, da categoria 93 (nº de ordem 40.0930), originários do Paquistão,
    beneficiário das preferências pautais previstas no Regulamento (CEE) nº 4259/88
    do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2034/89 DE LA COMISIÓN de 6 de julio de 1989 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a la ropa de punto de todo tipo, de la categoría de productos no 67 (número
    de orden 40.0670) las prendas que no sean de punto, de la categoría de productos
    no 78 (número de orden 40.0780), de la categoría de productos no 93 (número
    de orden 40.0930) originarios del Pakistán beneficiario de las preferencias arancelarias
    previstas cor el Reglamento (CEE) no 4259/88 del Consejo #'
