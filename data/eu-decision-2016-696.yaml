    oblasti třetích zemí uznávají za prosté Xanthomonas campestris (všech kmenů
    patogenních pro Citrus) a Guignardia citricarpa Kiely (všech kmenů patogenních
    pro Citrus) (oznámeno pod číslem C(2016) 2614)
  type: main
