title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/696 of 4 May 2016 amending Decision
    2006/473/EC recognising certain third countries and certain areas of third countries
    as being free from Xanthomonas campestris (all strains pathogenic to Citrus) and
    Guignardia citricarpa Kiely (all strains pathogenic to Citrus) (notified under
    document C(2016) 2614)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/696 de la Commission du 4 mai 2016 modifiant
    la décision 2006/473/CE reconnaissant certains pays tiers et certaines régions
    de pays tiers comme indemnes de Xanthomonas campestris (toutes les souches pathogènes
    aux Citrus) et de Guignardia citricarpa Kiely (toutes les souches pathogènes
    aux Citrus) [notifiée sous le numéro C(2016) 2614]
  type: main
- language: de
  script: Latn
