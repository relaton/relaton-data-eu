    kuriose trečiosiose šalyse ir kai kuriose trečiųjų šalių teritorijose nėra
    Xanthomonas campestris (visi štamai pavojingi citrusiniams) ir Guignardia citricarpa
    Kiely (visi štamai pavojingi citrusiniams) (pranešta dokumentu Nr. C(2016) 2614)
  type: main
