    Gebiete von Drittländern als frei von Xanthomonas campestris (für Citrus pathogene
    Stämme) und Guignardia citricarpa Kiely (für Citrus pathogene Stämme) (Bekanntgegeben
    unter Aktenzeichen C(2016) 2614)
  type: main
- language: bg
