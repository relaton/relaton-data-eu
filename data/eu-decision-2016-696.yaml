    campestristől (annak a citrusfélékre patogén minden törzsétől) és Guignardia
    citricarpa Kielytől (annak a citrusfélékre patogén minden törzsétől) mentesként
    történő elismeréséről szóló 2006/473/EK bizottsági határozat módosításáról
    (az értesítés a C(2016) 2614. számú dokumentummal történt)
  type: main
- language: it
