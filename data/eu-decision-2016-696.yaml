    che modifica la decisione 2006/473/CE che riconosce taluni paesi terzi e talune
    regioni di paesi terzi come indenni da Xanthomonas campestris (tutti i ceppi patogeni
    nei confronti di Citrus) e Guignardia citricarpa Kiely (tutti i ceppi patogeni
    nei confronti di Citrus) [notificata con il numero C(2016) 2614]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/696 (2016. gada 4. maijs), ar
    kuru groza Lēmumu 2006/473/EK, ar ko dažas trešās valstis un dažas trešo
    valstu teritorijas atzīst par tādām, kurās nav sastopams Xanthomonas campestris
    (visi celmi, kas ir patogēni Citrus ģints augiem) un Guignardia citricarpa Kiely
    (visi celmi, kas ir patogēni Citrus ģints augiem) (izziņots ar dokumenta numuru
    C(2016) 2614)
  type: main
- language: lt
