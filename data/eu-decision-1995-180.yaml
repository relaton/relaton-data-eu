    esterno massimo inferiore a 30 mm, originari della Tailandia'
  type: main
- language: nl
  script: Latn
  content: '95/180/EG: Besluit van de Commissie van 2 mei 1995 tot aanvaarding van
    een gewijzigde verbintenis door de Koninklijke Thaise Regering aangeboden in verband
