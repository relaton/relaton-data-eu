    της Ταϊλάνδης στο πλαίσιο της διαδικασίας
    επιβολής αντισταθμιστικού δασμού στις εισαγωγές
    ένσφαιρων τριβέων με μέγιστη εξωτερική διάμετρο
    30 mm, καταγωγής Ταϊλάνδης'
  type: main
- language: fi
  script: Latn
  content: '95/180/EY: Komission päätös, tehty 2 päivänä toukokuuta 1995, Thaimaasta
