title:
- language: en
  script: Latn
  content: '95/180/EC: Commission Decision of 2 May 1995 accepting a modified undertaking
    offered by the Royal Thai Government in connection with the countervailing duty
    proceeding concerning imports of ball bearings with a greatest external diameter
    not exceeding 30 mm originating in Thailand'
  type: main
- language: fr
  script: Latn
  content: '95/180/CE: Décision de la Commission, du 2 mai 1995, portant acceptation
    de l''engagement modifié offert par le gouvernement thaïlandais dans le cadre
    de la procédure antisubventions concernant les importations de roulements à
    billes dont le plus grand diamètre extérieur n''excède pas 30 millimètres,
    originaires de Thaïlande'
  type: main
- language: de
  script: Latn
  content: '95/180/EG: Beschluß der Kommission vom 2. Mai 1995 zur Annahme einer
    Änderung der Verpflichtung der Königlichen Thai-Regierung im Zusammenhang mit
    dem Antisubventionsverfahren betreffend die Einfuhren von Kugellagern mit einem
    größten äußeren Durchmesser von 30 mm oder weniger mit Ursprung in Thailand'
  type: main
- language: da
  script: Latn
  content: '95/180/EF: Kommissionens afgørelse af 2. maj 1995 om godtagelse af det
    ændrede tilsagn, der er afgivet af den thailandske regering i forbindelse med
    antisubsidieproceduren vedrørende importen af kuglelejer med største udvendige
    diameter på ikke over 30 mm med oprindelse i Thailand'
  type: main
- language: el
  script: Grek
  content: '95/180/ΕΚ: Απόφαση της Επιτροπής της 2ας Μαΐου
