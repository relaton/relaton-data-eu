title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2405/86 of 30 July 1986 amending Regulation
    (EEC) No 2035/86 fixing for the marketing year 1986/87 the compensatory amounts
    applicable to processed tomato products and laying down special detailed rules
    for their application
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2405/86 de la Commission du 30 juillet 1986 modifiant
    le règlement (CEE) n° 2035/86 fixant, pour la campagne de commercialisation
    1986/1987, les montants compensatoires applicables aux produits transformés à
    base de tomates et établissant des modalités particulières pour leur application
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2405/86 der Kommission vom 30. Juli 1986 zur Änderung
