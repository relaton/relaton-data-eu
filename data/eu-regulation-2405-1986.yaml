    aus Tomaten für das Wirtschaftsjahr 1986/87 und zur Festlegung besonderer Bestimmungen
    für ihre Anwendung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2405/86 af 30. juli 1986 om ændring
    af forordning (EØF) nr. 2035/86 om fastsættelse af udligningsbeløbene for produkter
    forarbejdet på basis af tomater for produktionsåret 1986/87 og de særlige gennemførelsesbestemmelser
    herfor
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2405/86 της Επιτροπής
    της 30ής Ιουλίου 1986 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2035/86 που καθορίζει, για
    την περίοδο εμπορίας 1986/87, τα νομισματικά εξισωτικά
    ποσά που εφαρμόζονται για τα μεταποιημένα
    προϊόντα με βάση τις τομάτες και θεσπίζει ειδικούς
    λεπτομερείς κανόνες για την εφαρμογή τους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2405/86 della Commissione del 30 luglio 1986 che modifica
    il regolamento (CEE) n. 2035/86 che fissa, per la campagna di commercializzazione
    1986/1987, gli importi compensativi applicabili ai prodotti transformati a base
    di pomodori e stabilisce le relative modalità particolari di applicazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2405/86 van de Commissie van 30 juli 1986 houdende
    wijziging van Verordening (EEG) nr. 2035/86 tot vaststelling voor het verkoopseizoen
    1986/1987 van de compenserende bedragen voor verwerkte produkten op basis van
    tomaten en van bijzondere bepalingen voor de toepassing ervan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2405/86 da Comissão de 30 de Julho de 1986 que
