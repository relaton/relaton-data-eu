    de 1986/1987, os montantes compensatórios aplicáveis aos produtos transformados
    à base de tomate e que estabelece regras especiais para a sua aplicação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2405/86 de la Comisión de 30 de julio de 1986 por
