title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3919/92 of 20 December 1992 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches (TACs) for
    1993 and certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3919/92 du Conseil, du 20 décembre 1992, fixant,
    pour certains stocks et groupes de stocks de poissons, les totaux admissibles
    des captures (TAC), pour 1993, et certaines conditions dans lesquelles ils peuvent
    être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3919/92 des Rates vom 20. Dezember 1992 zur Festlegung
    der zulässigen Gesamtfangmengen (TAC) und entsprechender Fangbedingungen für
    bestimmte Fischbestände oder Bestandsgruppen für 1993
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3919/92 af 20. december 1992 om fastsættelse
    for 1993 af de samlede tilladte fangstmængder (TAC) for visse fiskebestande og
    grupper af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3919/92 του Συμβουλίου
    της 20ής Δεκεμβρίου 1992 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, του συνόλου επιτρεπομένων αλιευμάτων
    (TAC) για το 1993, καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3919/92 del Consiglio, del 20 dicembre 1992, che stabilisce,
    per alcune popolazioni o gruppi di popolazioni ittiche, il totale ammissibile
    di catture (TAC) per il 1993 e talune condizioni cui è soggetta la pesca di detto
    totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3919/92 van de Raad van 20 december 1992 inzake de
    vaststelling van de voor 1993 geldende totaal toegestane vangsten (TAC' s) voor
    bepaalde visbestanden of groepen visbestanden, alsmede de bij de visserij in het
    kader van de totaal toegestane vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3919/92 do Conselho, de 20 de Dezembro de 1992, que
    fixa, relativamente a determinadas unidades populacionais ou grupos de unidades
    populacionais de peixes, os totais admissíveis de capturas (TAC) para 1993 e
    certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3919/92 del Consejo, de 20 de diciembre de 1992, por
    el que se fijan, para determinadas poblaciones y grupos de poblaciones de peces,
    los totales admisibles de capturas (TAC) para 1993 y determinadas condiciones
    en las que pueden pescarse
  type: main
