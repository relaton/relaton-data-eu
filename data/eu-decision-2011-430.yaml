title:
- language: en
  script: Latn
  content: Council Decision 2011/430/CFSP of 18 July 2011 updating the list of persons,
    groups and entities subject to Articles 2, 3 and 4 of Common Position 2001/931/CFSP
    on the application of specific measures to combat terrorism
  type: main
- language: fr
  script: Latn
  content: Décision 2011/430/PESC du Conseil du 18 juillet 2011 portant mise à jour
    de la liste des personnes, groupes et entités auxquels s’appliquent les articles
    2, 3 et 4 de la position commune 2001/931/PESC relative à l’application de
    mesures spécifiques en vue de lutter contre le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss 2011/430/GASP des Rates vom 18. Juli 2011 zur Aktualisierung
    der Liste der Personen, Vereinigungen und Körperschaften, auf die die Artikel
    2, 3 und 4 des Gemeinsamen Standpunkts 2001/931/GASP über die Anwendung besonderer
    Maßnahmen zur Bekämpfung des Terrorismus Anwendung finden
  type: main
- language: bg
  script: Cyrl
  content: Решение 2011/430/ОВППС на Съвета от 18 юли 2011
    година за актуализиране на списъка на лицата,
    групите и образуванията, по отношение на които
    се прилагат членове 2, 3 и 4 от Обща позиция 2001/931/ОВППС
    за прилагането на специални мерки за борба
    с тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2011/430/SZBP ze dne 18. července 2011 , kterým se aktualizuje
    seznam osob, skupin a subjektů, na něž se vztahují články 2, 3 a 4 společného
    postoje 2001/931/SZBP o uplatnění zvláštních opatření k boji proti terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2011/430/FUSP af 18. juli 2011 om ajourføring af listen
    over personer, grupper og enheder, som er omfattet af artikel 2, 3 og 4 i fælles
    holdning 2001/931/FUSP om anvendelse af specifikke foranstaltninger til bekæmpelse
    af terrorisme
  type: main
- language: el
  script: Grek
  content: Απόφαση 2011/430/ΚΕΠΠΑ του Συμβουλίου, της
    18ης Ιουλίου 2011 , σχετικά με την ενημέρωση του
    καταλόγου προσώπων, ομάδων και οντοτήτων που
    υπάγονται στα άρθρα 2, 3 και 4 της κοινής θέσης
    2001/931/ΚΕΠΠΑ, για την εφαρμογή ειδικών μέτρων
    για την καταπολέμηση της τρομοκρατίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2011/430/ÜVJP, 18. juuli 2011 , millega ajakohastatakse
    loetelu isikutest, rühmitustest ja üksustest, kelle suhtes kohaldatakse ühise
    seisukoha 2001/931/ÜVJP (terrorismivastaste erimeetmete rakendamise kohta) artikleid
    2, 3 ja 4
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2011/430/YUTP, annettu 18 päivänä heinäkuuta 2011
    , niitä henkilöitä, ryhmiä ja yhteisöjä koskevan luettelon saattamisesta
    ajan tasalle, joihin sovelletaan erityistoimenpiteiden toteuttamisesta terrorismin
    torjumiseksi hyväksytyn yhteisen kannan 2001/931/YUTP 2, 3 ja 4 artiklaa
  type: main
- language: hu
  script: Latn
  content: A Tanács 2011/430/KKBP határozata ( 2011. július 18. ) a terrorizmus
    leküzdésére vonatkozó különös intézkedések alkalmazásáról szóló
    2001/931/KKBP közös álláspont 2., 3. és 4. cikkének hatálya alá tartozó
    személyek, csoportok és szervezetek listájának naprakésszé tételéről
  type: main
- language: it
  script: Latn
  content: Decisione 2011/430/PESC del Consiglio, del 18 luglio 2011 , che aggiorna
    l’elenco delle persone, dei gruppi e delle entità a cui si applicano gli articoli
    2, 3 e 4 della posizione comune 2001/931/PESC relativa all’applicazione di misure
    specifiche per la lotta al terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2011/430/KĀDP ( 2011. gada 18. jūlijs ), ar ko atjaunina
