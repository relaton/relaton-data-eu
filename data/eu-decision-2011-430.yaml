    par konkrētu pasākumu īstenošanu cīņā pret terorismu 2., 3. un 4. pantu
  type: main
- language: lt
  script: Latn
  content: 2011 m. liepos 18 d. Tarybos sprendimas 2011/430/BUSP, kuriuo atnaujinamas
