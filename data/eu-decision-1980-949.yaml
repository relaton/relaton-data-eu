title:
- language: en
  script: Latn
  content: '80/949/EEC: Commission Decision of 25 September 1980 authorizing the United
    Kingdom to take interim protective measures with regard to fresh bananas originating
    in certain third countries (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/949/CEE: Décision de la Commission, du 25 septembre 1980, autorisant
    le Royaume-Uni à prendre des mesures conservatoires à l''égard des bananes
    fraîches originaires de certains pays tiers (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/949/EWG: Entscheidung der Kommission vom 25. September 1980, mit der
    das Vereinigte Königreich ermächtigt wird, vorläufige Schutzmaßnahmen hinsichtlich
    von Bananen, frisch, aus bestimmten Drittländern zu ergreifen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/949/EØF: Kommissionens beslutning af 25. september 1980 om bemyndigelse
    af Det forenede Kongerige til at indføre beskyttelsesforanstaltninger vedrørende
    eksport af bananer, friske med oprindelse i visse tredjelande (Kun den engelske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/949/CEE: Decisione della Commissione, del 25 settembre 1980, che autorizza
    il Regno Unito a prendere delle misure cautelari nei confronti delle banane fresche
    originarie di taluni paesi terzi (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/949/EEG: Beschikking van de Commissie van 25 september 1980 waarbij
    het Verenigd Koninkrijk ertoe wordt gemachtigd beschermende maatregelen te nemen
    ten aanzien van verse bananen van oorsprong uit bepaalde derde landen (Slechts
    de tekst in de Engelse taal is authentiek)'
