    en ce qui concerne la modification de l’annexe X (Services en général), de
    l’annexe XI (Communications électroniques, services audiovisuels et société
    de l’information) et du protocole 37 (comportant la liste prévue à l’article
    101) de l’accord EEE (Règlement sur la gouvernance des données)
  type: main
