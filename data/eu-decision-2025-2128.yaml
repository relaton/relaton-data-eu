title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/2128 of 13 October 2025 on the position to be
    adopted, on behalf of the European Union, within the EEA Joint Committee concerning
    the amendment to Annex X (Services in general), Annex XI (Electronic communication,
    audiovisual services and information society) and Protocol 37 (containing the
    list provided for in Article 101) to the EEA Agreement (Data Governance Act)
  type: main
- language: fr
  script: Latn
