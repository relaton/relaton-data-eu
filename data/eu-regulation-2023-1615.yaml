  content: Kommissionens delegerade förordning (EU) 2023/1615 av den 3 maj 2023 om
    komplettering av Europaparlamentets och rådets förordning (EU) 2021/23 vad gäller
    tekniska tillsynsstandarder som anger på vilka villkor ersättning, motsvarigheten
    i kontanter till sådan ersättning eller eventuella intäkter som ska betalas
    i enlighet med artikel 63.1 i den förordningen ska överföras till kunder och
    indirekta kunder och på vilka villkor överföringen ska anses vara proportionell
