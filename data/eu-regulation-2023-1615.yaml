  script: Latn
  content: Regolamento delegato (UE) 2023/1615 della Commissione del 3 maggio 2023
    che integra il regolamento (UE) 2021/23 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che precisano in quali
    condizioni è necessario il trasferimento della compensazione, dell’equivalente
    in contante di tale compensazione o dei proventi dovuti a norma dell’articolo
    63, paragrafo 1, di tale regolamento ai clienti e ai clienti indiretti nonché
    le condizioni alle quali detto trasferimento debba essere considerato proporzionato
  type: main
