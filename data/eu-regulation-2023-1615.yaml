    que respeita às normas técnicas de regulamentação que especificam as condições
    em que a indemnização, o equivalente em numerário dessa indemnização ou quaisquer
    receitas devidas nos termos do artigo 63.o, n.o 1, do referido regulamento devem
    ser repercutidos nos clientes e clientes indiretos e as condições em que a repercussão
    deve ser considerada proporcionada
  type: main
