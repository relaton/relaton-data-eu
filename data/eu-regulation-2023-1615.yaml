title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1615 of 3 May 2023 supplementing
    Regulation (EU) 2021/23 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the conditions under which compensation,
    cash equivalent of such compensation or any proceeds that are due pursuant to
    Article 63(1) of that Regulation are to be passed on to clients and indirect clients
    and the conditions under which passing on is to be considered proportionate
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1615 de la Commission du 3 mai 2023 complétant
    le règlement (UE) 2021/23 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les conditions dans lesquelles l’indemnisation,
    l’équivalent en espèces de cette indemnisation ou tout produit dus en vertu
    de l’article 63, paragraphe 1, dudit règlement doivent être répercutés sur
    les clients et les clients indirects et les conditions dans lesquelles la répercussion
    est réputée proportionnée
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1615 der Kommission vom 3. Mai 2023 zur
    Ergänzung der Verordnung (EU) 2021/23 des Europäischen Parlaments und des Rates
    durch technische Regulierungsstandards zur Festlegung der Bedingungen, unter denen
    die Weitergabe der Entschädigung, des Barmitteläquivalents dieser Entschädigung
    oder der nach Artikel 63 Absatz 1 der Verordnung fälligen Erlöse an Kunden und
    indirekte Kunden erforderlich ist, sowie der Bedingungen, unter denen diese Weitergabe
    als verhältnismäßig anzusehen ist
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/1615 на Комисията
    от 3 май 2023 година за допълнение на Регламент
    (ЕС) 2021/23 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на условията, при които компенсация,
    паричен еквивалент на компенсация или всякакви
    постъпления, дължими по смисъла на член 63, параграф
    1 от посочения регламент, трябва да се прехвърлят
    на клиенти и непреки клиенти, както и условията,
    при които прехвърлянето се счита за пропорционално
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/1615 ze dne 3. května
    2023, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2021/23,
    pokud jde o regulační technické normy upřesňující podmínky, za nichž
    se náhrada, peněžní ekvivalent této náhrady nebo jakékoli výnosy splatné
    podle čl. 63 odst. 1 uvedeného nařízení přenesou na klienty a nepřímé
    klienty, a podmínky, za nichž je toto přenesení považováno za přiměřené
  type: main
