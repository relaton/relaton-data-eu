  content: Règlement (CEE) n° 1642/71 du Conseil, du 26 juillet 1971, portant suspension
    partielle du droit autonome du tarif douanier commun sur les oranges douces, fraîches,
    de la sous-position EX 08.02 A I a), pour la période du 1er juin au 30 septembre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1642/71 des Rates vom 26. Juli 1971 zur teilweisen
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Süßorangen,
    frisch, der Tarifstelle ex 08.02 A I a) für die Zeit vom 1. Juni bis 30. September
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1642/71 del Consiglio, del 26 luglio 1971, che sospende
