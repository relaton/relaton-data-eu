  content: Commission Regulation (EEC) No 2039/91 of 11 July 1991 fixing for the 1991/92
    marketing year the minimum price to be paid to producers for unprocessed dried
    figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2039/91 DE LA COMMISSION du 11 juillet 1991 fixant,
    pour la campagne 1991/1992, le prix minimal à payer aux producteurs pour les
    figues sèches non transformées ainsi que le montant de l'' aide à la production
    pour les figues sèches #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2039/91 DER KOMMISSION vom 11. Juli 1991 zur Festsetzung
    des den Erzeugern unverarbeiteter getrockneter Feigen zu zahlenden Mindestpreises
    sowie der Produktionsbeihilfe für getrocknete Feigen im Wirtschaftsjahr 1991/92
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2039/91 af 11. juli 1991 om fastsættelse
    af den minimumspris, der skal betales producenten for uforarbejdede tørrede figner
    i produktionsåret 1991/92
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2039/91 της Επιτροπής
    της 11ης Ιουλίου 1991 σχετικά με τον καθορισμό,
    για την περίοδο εμπορίας 1991/92, της ελάχιστης
    τιμής που καταβάλλεται στους παραγωγούς για
    τα μη μεταποιημένα ξηρά σύκα και του ποσού
    της ενίσχυσης στην παραγωγή για τα ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2039/91 DELLA COMMISSIONE dell'' 11 luglio 1991 che
    fissa, per la campagna di commercializzazione 1991/1992, il prezzo minimo da pagare
    ai produttori di fichi secchi non trasformati e l'' importo dell'' aiuto alla
    produzione per i fichi secchi #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2039/91 VAN DE COMMISSIE van 11 juli 1991 tot vaststelling,
    voor het verkoopseizoen 1991/1992, van de voor niet verwerkte gedroogde vijgen
    aan de telers te betalen minimumprijs, alsmede van het bedrag van de produktiesteun
    voor gedroogde vijgen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2039/91 DA COMISSÃO de 11 de Julho de 1991 que fixa,
