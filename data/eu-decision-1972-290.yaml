    Croix-Rouge relatif à la fourniture de lait écrémé en poudre à titre d'aide
    alimentaire
  type: main
- language: de
  script: Latn
  content: '72/290/EWG: Beschluß des Rates vom 10. Juli 1972 über den Abschluß
    des Abkommens in Form eines Briefwechsels zur Verlängerung der Frist für die
    Durchführung des Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Internationalen Komitee vom Roten Kreuz über die Lieferung von Magermilchpulver
    im Rahmen der Nahrungsmittelhilfe'
  type: main
- language: it
  script: Latn
  content: '72/290/CEE: Decisione del Consiglio, del 10 luglio 1972, recante conclusione
    dell''Accordo, sotto forma di scambio di lettere, che proroga il termine dell''esecuzione
    dell''Accordo tra la Comunità economica europea e il CICR, relativo alla fornitura
    di latte scremato in polvere, a titolo di aiuto alimentare'
  type: main
- language: nl
  script: Latn
