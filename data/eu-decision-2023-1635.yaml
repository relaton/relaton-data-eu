title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/1635 of 14 August 2023 amending
    Implementing Decision (EU) 2022/74 setting out the list of Interreg programmes
    and indicating the global amount of the total support from the European Regional
    Development Fund and from each external financing instrument of the Union for
    each programme and the list of the amounts transferred between strands under the
    European territorial cooperation goal for the period 2021 to 2027 (notified under
    document C(2023) 5459)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/1635 de la Commission du 14 août 2023
    modifiant la décision d’exécution (UE) 2022/74 établissant la liste des programmes
    Interreg et indiquant le montant total du soutien apporté par le Fonds européen
    de développement régional et par chaque instrument de financement extérieur
    de l’Union pour chaque programme, ainsi que la liste des montants transférés
    entre les volets au titre de l’objectif «Coopération territoriale européenne»
    pour la période 2021-2027 [notifiée sous le numéro C(2023) 5459]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/1635 der Kommission vom 14. August 2023
    zur Änderung des Durchführungsbeschlusses (EU) 2022/74 zur Festlegung der Liste
    der Interreg-Programme unter Angabe des Gesamtbetrags der gesamten Unterstützung
    aus dem Europäischen Fonds für regionale Entwicklung und jedem Finanzierungsinstrument
    für das auswärtige Handeln der Union für jedes Programm sowie der Liste der
    zwischen den Aktionsbereichen im Rahmen des Ziels „Europäische territoriale
    Zusammenarbeit“ für den Zeitraum 2021 bis 2027 übertragenen Beträge (Bekannt
    gegeben unter Aktenzeichen C(2023) 5459)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/1635 на Комисията
    от 14 август 2023 година за изменение на Решение
    за изпълнение (ЕС) 2022/74 за определяне на списъка
    на програмите по Interreg и посочване на общия
    размер на общaтa подкрепа от Европейския фонд
    за регионално развитие и от всеки инструмент
    на Съюза за външно финансиране за всяка програма,
    както и списъка на сумите, прехвърлени между
    направленията по цел „Европейско териториално
    сътрудничество“ за периода 2021—2027 година (нотифицирано
    под номер C(2023) 5459)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/1635 ze dne 14. srpna 2023, kterým
    se mění prováděcí rozhodnutí (EU) 2022/74, kterým se stanoví seznam programů
    Interreg a v němž se uvádí souhrnná výše celkové podpory z Evropského
    fondu pro regionální rozvoj a z každého nástroje Unie pro financování vnější
    činnosti pro každý program a seznam částek převedených mezi složkami v
    rámci cíle Evropská územní spolupráce na období 2021–2027 (oznámeno
    pod číslem C(2023) 5459)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/1635 af 14. august 2023
    om ændring af gennemførelsesafgørelse (EU) 2022/74 om fastlæggelse af listen
    over Interregprogramområder og angivelse af det samlede støttebeløb fra Den
    Europæiske Fond for Regionaludvikling og fra hvert af Unionens eksterne finansieringsinstrumenter
