    zneska skupne podpore iz Evropskega sklada za regionalni razvoj in vsakega od
    instrumentov Unije za zunanje financiranje za vsak program ter določitvi seznama
    zneskov, ki se prenesejo med sklopi v okviru cilja „evropsko teritorialno sodelovanje“
    za obdobje 2021–2027 (notificirano pod dokumentarno številko C(2023) 5459)
