    rakendusotsust (EL) 2022/74, milles sätestatakse Interregi programmide loetelu
    ning esitatakse Euroopa Regionaalarengu Fondist ja igast liidu välistegevuse
    rahastusest iga programmi jaoks antava toetuse kogusumma ning Euroopa territoriaalse
    koostöö eesmärgi raames tegevussuundade vahel ümberpaigutatud summade loetelu
    aastateks 2021–2027 (teatavaks tehtud numbri C(2023) 5459 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/1635, annettu 14 päivänä
    elokuuta 2023, Interreg-ohjelmien ja Euroopan aluekehitysrahastosta ja kustakin
    unionin ulkoisesta rahoitusvälineestä kullekin ohjelmalle myönnettävän tuen
    kokonaismäärän luettelon ja Euroopan alueellinen yhteistyö -tavoitteen nojalla
    osa-alueiden välillä kaudella 2021–2027 siirrettävien määrien luettelon
    vahvistamisesta annetun täytäntöönpanopäätöksen (EU) 2022/74 muuttamisesta
    (tiedoksiannettu numerolla C(2023) 5459)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/1635 ón gCoimisiún an 14 Lúnasa
    2023 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2022/74 lena leagtar amach
    an liosta chláir Interreg agus lena léirítear méid foriomlán na tacaíochta
    iomláine ó Chiste Forbraíochta Réigiúnaí na hEorpa agus ó gach ionstraim
    maoinithe sheachtraigh den Aontas le haghaidh gach cláir agus liosta na méideanna
    a aistreofar idir sraitheanna faoi sprioc an chomhair chríochaigh Eorpaigh don
    tréimhse 2021 go 2027 (a tugadh fógra faoi le doiciméad C (2023) 5459)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/1635 оd 14. kolovoza 2023. o izmjeni
    Provedbene odluke (EU) 2022/74 o utvrđivanju popisa programa Interrega i naznačivanju
    ukupnog iznosa cjelokupne potpore iz Europskog fonda za regionalni razvoj te iz
    svakog instrumenta Unije za financiranje vanjskog djelovanja za svaki program
    te popisa iznosa prenesenih između sastavnica u okviru cilja „Europska teritorijalna
    suradnja” za razdoblje 2021. – 2027. (priopćeno pod brojem dokumenta C(2023)
    5459)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1635 végrehajtási határozata (2023. augusztus
    14.) az Interreg programok jegyzékének megállapításáról és az egyes programok
    tekintetében az Európai Regionális Fejlesztési Alapból és az Unió egyes
    külső finanszírozási eszközeiből származó teljes támogatás globális
    összegének feltüntetéséről, valamint az európai területi együttműködési
    célkitűzés ágai között a 2021 és 2027 közötti időszakban átcsoportosított
    összegek jegyzékének megállapításáról szóló (EU) 2022/74 végrehajtási
    határozat módosításáról (az értesítés a C(2023) 5459. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/1635 della Commissione del 14 agosto
    2023 recante modifica della decisione di esecuzione (UE) 2022/74 che stabilisce
    l’elenco dei programmi Interreg e indica l’importo totale dell’intero sostegno
    del Fondo europeo di sviluppo regionale e di ciascuno strumento di finanziamento
    esterno dell’Unione per ciascun programma e l’elenco degli importi trasferiti
    tra le componenti dell’obiettivo «Cooperazione territoriale europea» per il
    periodo 2021-2027 [notificata con il numero C(2023) 5459]
  type: main
- language: lv
