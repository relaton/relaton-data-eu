title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 176/1999 of 26 January 1999 determining the
    extent to which applications for import licences submitted in January 1999 for
    certain products in the milk and milk products sector under the schemes provided
    for in the Europe Agreements between the Community and the Republic of Hungary,
    the Republic of Poland, the Czech Republic, the Slovak Republic, Bulgaria and
    Romania, in the Agreements on free trade between the Community and the Baltic
    States and in the Interim Agreement between the Community and the Republic of
    Slovenia may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 176/1999 de la Commission du 26 janvier 1999 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 1999 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre des régimes prévus par les accords européens entre la
    Communauté et la République de Hongrie, la République de Pologne, la République
    tchèque, la République slovaque, la Bulgarie et la Roumanie, du régime prévu
    par les accords sur la libéralisation des échanges entre la Communauté et les
    pays baltes et du régime prévu par l'accord intérimaire entre la Communauté
    et la Slovénie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 176/1999 der Kommission vom 26. Januar 1999 über den
    Umfang, in dem den Anträgen auf Einfuhrlizenzen für bestimmte Milch- und Milcherzeugnisse
    stattgegeben werden kann, die im Januar 1999 im Rahmen der Regelungen gemäß
    den Europa-Abkommen zwischen der Gemeinschaft und der Republik Ungarn, der Republik
    Polen, der Tschechischen Republik, der Slowakischen Republik, Bulgarien und Rumänien,
    der Regelung gemäß dem Freihandelsabkommen zwischen der Gemeinschaft und den
    Baltischen Staaten und der Regelung gemäß dem Interimsabkommen zwischen der
    Gemeinschaft und Slowenien eingereicht wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 176/1999 af 26. januar 1999 om fastsættelse
    af, i hvilket omfang de ansøgninger, der i januar 1999 er indgivet om importlicens
    for visse produkter i sektoren for mælk og mejeriprodukter i henhold til ordningerne
    i Europaaftalerne mellem Fællesskabet og Republikken Ungarn, Republikken Polen,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien,
    ordningen i aftalerne om liberalisering af samhandelen mellem Fællesskabet og
    De Baltiske Lande og ordningen i interimsaftalen mellem Fællesskabet og Slovenien,
    kan accepteres
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 176/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 26ης Ιανουαρίου 1999 για τον προσδιορισμό
    του μέτρου κατά το οποίο μπορούν να γίνονται
    δεκτές οι αιτήσεις πιστοποιητικών εισαγωγής
    που υπεβλήθησαν τον Ιανουάριο του 1999 για ορισμένα
    προϊόντα στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων στο πλαίσιο των καθεστώτων που προβλέπονται
    από τις ευρωπαϊκές συμφωνίες μεταξύ της Κοινότητας
    και της Δημοκρατίας της Ουγγαρίας, της Δημοκρατίας
    της Πολωνίας, της Τσεχικής Δημοκρατίας, της
    Σλοβακικής Δημοκρατίας, της Βουλγαρίας και
    της Ρουμανίας, του καθεστώτος που προβλέπεται
    από τις συμφωνίες ελευθέρωσης των συναλλαγών
    μεταξύ της Κοινότητας και των βαλτικών χωρών
    και του καθεστώτος που προβλέπεται από την
    προσωρινή συμφωνία μεταξύ της Κοινότητας και
    της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 176/1999, annettu 26 päivänä tammikuuta 1999,
    yhteisön sekä Unkarin tasavallan, Puolan tasavallan, Tsekin tasavallan, Slovakian
    tasavallan, Bulgarian ja Romanian välisissä Eurooppa-sopimuksissa, yhteisön
    sekä Baltian maiden välisissä vapaakauppaa koskevissa sopimuksissa ja yhteisön
    sekä Slovenian tasavallan välisessä väliaikaisessa sopimuksessa määrätyn
    järjestelmän mukaisesti tietyistä maito- ja maitotuotealan tuotteista vuoden
    1999 tammikuussa jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 176/1999 della Commissione del 26 gennaio 1999 che
    stabilisce la misura in cui possono essere accettate le domande di titoli d'importazione
    presentate nel gennaio 1999 per taluni prodotti del settore del latte e del settore
    lattiero-caseario nel quadro dei regimi previsti dagli accordi europei tra la
    Comunità e la Repubblica d'Ungheria, la Repubblica di Polonia, la Repubblica
    ceca, la Repubblica slovacca, la Bulgaria e la Romania, del regime previsto dagli
    accordi sul libero scambio tra la Comunità e i paesi baltici e del regime previsto
    dall'accordo interinale tra la Comunità e la Repubblica slovena
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 176/1999 van de Commissie van 26 januari 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector melk en zuivelproducten,
    die in januari 1999 worden ingediend op grond van de regelingen waarin is voorzien
    bij de Europa-overeenkomsten tussen, enerzijds, de Gemeenschap en, anderzijds,
    de Republiek Hongarije, de Republiek Polen, de Tsjechische Republiek, de Slowaakse
    Republiek, Bulgarije en Roemenië, van de regeling waarin is voorzien bij de overeenkomsten
    betreffende vrijhandel en met handel verband houdende zaken tussen de Gemeenschap
    en de Baltische staten, en van de regeling waarin is voorzien bij de Interim-overeenkomst
    tussen de Gemeenschap en Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 176/1999 da Comissão de 26 de Janeiro de 1999 que
    determina a medida em que podem ser aceites os pedidos de certificados de importação
    introduzidos em Janeiro de 1999 para determinados produtos do sector de leite
    e dos produtos lácteos no âmbito dos regimes previstos nos acordos europeus
    entre a Comunidade e a República da Hungria, a República da Polónia, a República
    Checa, a República Eslovaca, a Bulgária e a Roménia, do regime previsto nos
    acordos sobre comércio livre entre a Comunidade e os países bálticos e do regime
    previsto no acordo provisório entre a Comunidade e a Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 176/1999 de la Comisión de 26 de enero de 1999 por
    el que se determina en qué medida podrán aceptarse las solicitudes de certificados
    de importación presentadas en enero de 1999 relativas a determinados productos
    del sector de la leche y de los productos lácteos en el ámbito de los regímenes
    previstos en los Acuerdos europeos entre la Comunidad y la República de Hungría,
    la República de Polonia, la República Checa, la República Eslovaca, Bulgaria
    y Rumania, del régimen previsto en los Acuerdos de libre comercio entre la Comunidad
    y los Países Bálticos y del régimen previsto en el Acuerdo interino entre la
    Comunidad y Eslovenia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 176/1999 av den 26 januari 1999 om fastställande
    av i vilken utsträckning ansökningar om importlicenser får godkännas som inlämnas
    i januari 1999 för vissa produkter inom sektorn för mjölk och mjölkprodukter
    inom ramen för ordningarna i Europaavtalen mellan gemenskapen och Ungern, Polen,
    Tjeckien, Slovakien, Bulgarien och Rumänien, ordningen i frihandelsavtalen mellan
    gemenskapen och de baltiska länderna samt ordningen i interimsavtalen mellan
    gemenskapen och Slovenien
