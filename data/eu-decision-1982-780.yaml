title:
- language: en
  script: Latn
  content: '82/780/EEC: Commission Decision of 4 November 1982 establishing that the
    apparatus described as ''Jasco - Spectropolarimeter, model J-500C'' may not be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/780/CEE: Décision de la Commission, du 4 novembre 1982, constatant
    que l''importation de l''appareil dénommé "Jasco - Spectropolarimeter, model
    J-500 C" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/780/EWG: Entscheidung der Kommission vom 4. November 1982, mit der
    festgestellt wird, daß das Gerät ,,JASCO - Spectropolarimeter, model J-500 C"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/780/EØF: Kommissionens beslutning af 4. november 1982 om fastslåelse
    af, at indførsel af apparatet "Jasco - Spectropolarimeter, model J-500 C" ikke
    kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/780/EOK: Απόφαση τής Επιτροπής τής 4ης Νοεμβρίου
