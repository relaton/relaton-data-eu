    model J-500C" non può avvenire in franchigia dai dazi della tariffa doganale
    comune'
  type: main
- language: nl
  script: Latn
  content: '82/780/EEG: Beschikking van de Commissie van 4 november 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Jasco-Spectropolarimeter, model J-500 C"
