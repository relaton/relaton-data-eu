  script: Latn
  content: Commission Regulation (EEC) No 3246/91 of 7 November 1991 authorizing the
    United Kingdom to discontinue granting the variable slaughter premium for sheep
    in Great Britain and derogating from Regulation (EEC) No 1633/84 laying down detailed
    rules for applying the variable slaughter premium for sheep
  type: main
- language: fr
  script: Latn
