title:
- language: en
  script: Latn
  content: '92/120/EEC: Commission Decision of 4 February 1992 amending Decision 90/52/EEC
    authorizing Member States temporarily to take additional measures as regards Denmark
    against the dissemination of Corynebacterium sepedonicum'
  type: main
- language: fr
  script: Latn
  content: '92/120/CEE: Décision de la Commission du 4 février 1992 modifiant la
    décision 90/52/CEE autorisant les États membres à prendre provisoirement des
    mesures supplémentaires en vue de se protéger contre la propagation du Corynebacterium
    sepedonicum en provenance du Danemark'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 4. Februar 1992 zur Änderung der Entscheidung
    90/52/EWG zur Ermächtigung bestimmter Mitgliedstaaten, vorübergehend zusätzliche
    Maßnahmen gegen die Verbreitung von Corynebacterium sepedonicum gegenüber Dänemark
    zu treffen (92/120/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 4. februar 1992 om ændring af beslutning
    90/52/EØF om bemyndigelse af medlemsstaterne til midlertidigt at træffe supplerende
    foranstaltninger til beskyttelse mod spredning af Corynebacterium sepedonicum
    for så vidt angår Danmark (92/120/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/120/ΕΟΚ : Απόφαση της Επιτροπής της 4ης
    Φεβρουαρίου 1992 περί τροποποιήσεως της απόφασης
    90/52/ΕΟΚ που επιτρέπει προσωρινά τα κράτη μέλη
    να λάβουν συμπληρωματικά μέτρα έναντι της
    Δανίας κατά της εξάπλωσης του Corynebacterium sepedonicum'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 4 febbraio 1992 recante modifica della
    decisione 90/52/CEE che autorizza gli Stati membri ad adottare, a titolo provvisorio,
    misure supplementari per cautelarsi contro la propagazione del Corynebacterium
    sepedonicum relativamente alla Danimarca (92/120/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 4 februari 1992 tot wijziging van Beschikking
    90/52/EEG houdende machtiging van de Lid-Staten om ten aanzien van Denemarken
    tijdelijk aanvullende maatregelen te nemen ten einde zich te beschermen tegen
    de verspreiding van Corynebacterium sepedonicum (92/120/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 4 de Fevereiro de 1992 que altera a Decisão
    90/52/CEE, que autoriza determinados Estados-membros a adoptar, temporariamente,
    medidas adicionais em relação à Dinamarca para se protegerem contra a introdução
    do Corynebacterium sepedonicum (92/120/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 4 de febrero de 1992 que modifca la Decisión
    90/52/CEE por la que se autoriza a los Estados miembros a adoptar provisionalmente
    medidas complementarias para protegerse de la introducción del Cornybacterium
    sepedonicum procedente de Dinamarca (92/120/CEE) #'
