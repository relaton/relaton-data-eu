type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1838/76 of 28 July 1976 re-establishing
    the levying of customs duties on building board of wood pulp or of vegetable fibre,
    etc., falling within heading No 48.09, originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1838/76 de la Commission, du 28 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux plaques
    pour constructions, en pâte à papier, en bois défibrés, etc., de la position
    tarifaire 48.09, originaires du Brésil bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1838/76 der Kommission vom 28. Juli 1976 zur Wiedereinführung
    des Zollsatzes für Bauplatten aus Papierhalbstoff, aus Fasern von Holz usw.,
    der Tarifnummer 48.09, mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1838/76 af 28. juli 1976 om genindførelse
    af opkrævning af toldafgifter for byggeplader af papirmasse, træfibre etc. under
    position 48.09, som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1838/76 della Commissione, del 28 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle lastre per costruzioni,
    di pasta di carta, di legno sfibrato, ecc., della voce doganale 48.09 originarie
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1838/76 van de Commissie van 28 juli 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op platen voor
    constructiedoeleinden, van papierstof, van houtvezels enz., van post 48.09, van
    oorsprong uit Brazilië, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75
    van de Raad van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
