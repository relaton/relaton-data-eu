    ενδιαφέρον για τον ΕΟΧ και τη συμφωνία ΕΕ/Ελβετίας.)'
  type: main
- language: fi
  script: Latn
  content: '2003/751/EY: Päätös N:o 189, tehty 18 päivänä kesäkuuta 2003, neuvoston
    asetusten (ETY) N:o 1408/71 ja (ETY) N:o 574/72 soveltamiseksi tarvittavien lomakkeiden
    korvaamisesta eurooppalaisella sairaanhoidonkortilla hoidon saamiseksi oleskeltaessa
    tilapäisesti muussa jäsenvaltiossa kuin toimivaltaisessa valtiossa tai asuinvaltiossa
    (ETA:n kannalta ja EU:n ja Sveitsin sopimuksen kannalta merkityksellinen teksti.)'
  type: main
- language: it
  script: Latn
  content: '2003/751/CE: Decisione n. 189, del 18 giugno 2003, volta a sostituire
    la tessera europea d''assicurazione malattia ai moduli necessari all''applicazione
    dei regolamenti (CEE) n. 1408/71 e (CEE) n. 574/72 del Consiglio per quanto riguarda
    l''accesso alle cure durante un soggiorno temporaneo in uno Stato membro diverso
