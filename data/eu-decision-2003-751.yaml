type: standard
title:
- language: en
  script: Latn
  content: '2003/751/EC: Decision No 189 of 18 June 2003 aimed at introducing a European
    health insurance card to replace the forms necessary for the application of Council
    Regulations (EEC) No 1408/71 and (EEC) No 574/72 as regards access to health care
    during a temporary stay in a Member State other than the competent State or the
    State of residence (Text with relevance for the EEA and for the EU/Switzerland
    Agreement.)'
  type: main
- language: fr
  script: Latn
  content: '2003/751/CE: Décision n° 189 du 18 juin 2003 visant à remplacer par
    la carte européenne d''assurance maladie les formulaires nécessaires à l''application
    des règlements du Conseil (CEE) n° 1408/71 et (CEE) n° 574/72 en ce qui concerne
    l''accès aux soins pendant un séjour temporaire dans un État membre autre que
    l''État compétent ou de résidence (Texte présentant de l''intérêt pour l''EEE
    et pour l''accord EU/Suisse.)'
  type: main
- language: de
  script: Latn
  content: '2003/751/EG: Beschluss Nr. 189 vom 18. Juni 2003 zur Ersetzung der zur
    Durchführung der Verordnungen (EWG) Nr. 1408/71 und (EWG) Nr. 574/72 des Rates
    erforderlichen Vordrucke für den Zugang zu Sachleistungen bei einem vorübergehenden
    Aufenthalt in einem anderen Mitgliedstaat als dem zuständigen Staat oder Wohnstaat
    durch die europäische Krankenversicherungskarte (Text von Bedeutung für den
    EWR und für das Abkommen EU/Schweiz.)'
  type: main
- language: da
  script: Latn
  content: '2003/751/EF: Afgørelse nr. 189 af 18. juni 2003 om udskiftning af de
    blanketter, der skal benyttes ved anvendelsen af Rådets forordning (EØF) nr.
    1408/71 og (EØF) nr. 574/72 i forbindelse med tilkendelse af sygehjælp under
    et midlertidigt ophold i en anden medlemsstat end den kompetente stat eller bopælsstaten,
    med et europæisk sygesikringskort (Teksten er relevant for EØS og for EF/CH-aftalen.)'
  type: main
- language: el
  script: Grek
  content: '2003/751/ΕΚ: Απόφαση αριθ. 189, της 18ης Ιουνίου
    2003, για την εισαγωγή μιάς ευρωπαϊκής κάρτας
    ασφάλισης ασθένειας προς αντικατάσταση των
    αναγκαίων εντύπων για την εφαρμογή των κανονισμών
    του Συμβουλίου (ΕΟΚ) αριθ. 1408/71 και (ΕΟΚ) αριθ.
    574/72, σχετικά με την πρόσβαση στην υγειονομική
