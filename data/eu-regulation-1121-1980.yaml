id: EURegulation11211980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1121/80 of 6 May 1980 re-establishing the
    levying of customs duties on bonded fibre fabrics, similar bonded yarn fabrics,
    and articles of such fabrics, other than clothing and clothing accessories, products
    of category 96 (code 0960), originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1121/80 de la Commission, du 6 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux "tissus non tissés" et
    articles en "tissus non tissés", autres que les vêtements et accessoires du
    vêtement, de la catégorie de produits n° 96 (code 0960), originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1121/80 der Kommission vom 6. Mai 1980 über die Wiedereinführung
    des Zollsatzes für Vliesstoffe und Waren daraus, andere als Kleidung und Bekleidungszubehör,
    der Warenkategorie Nr. 96 (Kennziffer 0960), mit Ursprung in Jugoslawien, dem
    die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1121/80 af 6. maj 1980 om genindførelse
    af opkrævning af toldafgifter for fiberdug samt varer deraf, bortset fra beklædningsgenstande
    og tilbehør til beklædningsgenstande, varekategori 96 (kode 0960), som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1121/80 della Commissione, del 6 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle stoffe non tessute
    e manufatti di stoffe non tessute, esclusi gli indumenti e gli accessori di abbigliamento,
    della categoria di prodotti n. 96 (codice 0960), originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1121/80 van de Commissie van 6 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op gebonden
    textielvlies, alsmede artikelen daarvan, andere dan kleding en toebehoren, van
    de categorie van produkten nr. 96 (codenummer 0960), van oorsprong uit Joegoslavië
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
