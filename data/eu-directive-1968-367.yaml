title:
- language: en
  script: Latn
  content: 'Council Directive 68/367/EEC of 15 October 1968 concerning the attainment
    of freedom of establishment and freedom to provide services in respect of activities
    of self-employed persons in the personal services sector (ISIC ex Major Group
    85): 1. Restaurants, cafes, taverns and other drinking and eating places (ISIC
    Group 852), 2. Hotels, rooming houses, camps and other lodging places (ISIC Group
    853)'
  type: main
- language: fr
  script: Latn
  content: 'Directive 68/367/CEE du Conseil, du 15 octobre 1968, concernant la réalisation
    de la liberté d''établissement et de la libre prestation des services pour les
    activités non salariées relevant des services personnels (ex classe 85 CITI):
    1. restaurants et débits de boissons (groupe 852 CITI), 2. hôtels meublés et
    établissements analogues, terrains de camping (groupe 853 CITI)'
  type: main
- language: de
  script: Latn
  content: 'Richtlinie 68/367/EWG des Rates vom 15. Oktober 1968 über die Verwirklichung
    der Niederlassungsfreiheit und des freien Dienstleistungsverkehrs für die selbständigen
    Tätigkeiten der persönlichen Dienste (aus CITI- Hauptgruppe 85): 1. Restaurations-
    und Schankgewerbe (CITI-Gruppe 852) 2. Beherbergungsgewerbe und Zeltplatzbetriebe
    (CITI-Gruppe 853)'
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 68/367/EØF af 15. oktober 1968 om gennemførelsen af
