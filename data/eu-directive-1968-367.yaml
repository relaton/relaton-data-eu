    inden for de personlige tjenesteydelser (ex CITI-hovedgruppe 85):1. Restaurations-
    og udskænkningsvirksomhed (CITI- gruppe 852) 2. Hotel- og udskænkningsvirksomhed
    (CITI- gruppe 853)
  type: main
- language: el
