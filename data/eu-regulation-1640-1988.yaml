  content: Commission Regulation (EEC) No 1640/88 of 13 June 1988 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export, amending Regulation (EEC) No 569/88 and repealing
    Regulation (EEC) No 1252/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1640/88 de la Commission du 13 juin 1988 relatif à
