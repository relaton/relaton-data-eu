    (EWG) Nr. 569/88 und zur Aufhebung der Verordnung (EWG) Nr. 1252/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1640/88 af 13. juni 1988 om salg efter
