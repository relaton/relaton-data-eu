title:
- language: en
  script: Latn
  content: '88/36/EEC: Commission Decision of 10 December 1987 authorizing certain
    Member States temporarily to take additional measures as regards Denmark to protect
    themselves against the introduction of Corynebacterium sepedonicum (Only the French,
    English and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/36/CEE: Décision de la Commission du 10 décembre 1987 autorisant
    certains États membres à prendre provisoirement des mesures supplémentaires
    vis-à-vis du Danemark en vue de se protéger contre l''introduction de Corynebacterium
    sepedonicum (Les textes en langues française, anglaise et néerlandaise sont
    les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/36/EWG: Entscheidung der Kommission vom 10. Dezember 1987 zur Ermächtigung
    bestimmter Mitgliedstaaten, zum Schutz gegen die Einschleppung von Corynebacterium
    sepedonicum vorübergehend ergänzende Maßnahmen gegenüber Dänemark zu treffen
    (Nur der französische, englische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/36/EØF: Kommissionens beslutning af 10. december 1987 om bemyndigelse
    af visse medlemsstater til at træffe midlertidige supplerende foranstaltninger
    til beskyttelse mod indslæbning af Corynebacterium sepedonicum for så vidt angår
    Danmark (Kun den franske, engelske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '88/36/ΕΟΚ: Απόφαση της Επιτροπής της 10ης Δεκεμβρίου
    1987 που επιτρέπει σε ορισμένα κράτη μέλη να
    λάβουν, προσωρινά, συμπληρωματικά μέτρα, όσον
    αφορά την Δανία, για να προστατευθούν από την
    εισχώρηση στην επικράτειά τους του Corynebacterium
    sepedonicum (Τα κείμενα στην γαλλική, αγγλική και
    ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '88/36/CEE: Decisione della Commissione del 10 dicembre 1987 che autorizza
    alcuni Stati membri ad adottare nei confronti della Danimarca, a titolo provvisorio,
    misure supplementari per cautelarsi contro l''introduzione nel proprio territorio
    di Corynebacterium sepedonicum (Il testi in lingua francese, inglese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '88/36/EEG: Beschikking van de Commissie van 10 december 1987 tot tijdelijke
    machtiging van bepaalde Lid-Staten om ten aanzien van Denemarken aanvullende maatregelen
    te nemen ten einde zich tegen het binnenbrengen van Corynebacterium sepedonicum
    te beschermen (Slechts de teksten in de Franse, Engelse en de Nederlandse taal
    zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/36/CEE: Decisão da Comissão de 10 de Dezembro de 1987 que permite
    determinados Estados-membros tomarem, temporariamente, medidas adicionais no que
    respeita à Dinamarca contra a introdução de Corynebacterium sepedonicum (Apenas
    fazem fé os textos nas línguas francesa, inglesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '88/36/CEE: Decisión de la Comisión de 10 de diciembre de 1987 por la
    que se autoriza a determinados Estados miembros a adoptar provisionalmente medidas
    complementarias para protegerse de la introducción del Corynebacterium sepedonicum
    en relación con Dinamarca (Los textos en lenguas francesa, inglesa y neerlandesa
    son los únicos auténticos)'
  type: main
