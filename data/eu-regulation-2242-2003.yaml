title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2242/2003 of 19 December 2003 determining
    the extent to which applications lodged in December 2003 for import licences for
    certain poultrymeat products under the regime provided for in Council Regulation
    (EC) No 774/94 opening and providing for the administration of certain Community
    tariff quotas for poultrymeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2242/2003 de la Commission du 19 décembre 2003 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en décembre 2003 pour certains produits à base de viande de volaille peuvent
    être acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94
    du Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande de volaille et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2242/2003 der Kommission vom 19. Dezember 2003 über
    die Festsetzung des Umfangs, in dem die im Dezember 2003 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Geflügelfleischerzeugnisse entsprechend der Regelung
    der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher
    Zollkontingente für Geflügelfleisch und andere landwirtschaftliche Erzeugnisse
    genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2242/2003 af 19. december 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i december
    2003 om importlicenser for visse fjerkræprodukter, som kun accepteres i forbindelse
    med den ordning, der er fastsat i Rådets forordning (EF) nr. 774/94 om åbning
    og forvaltning af en række EF-toldkontingenter for fjerkrækød og andre landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2242/2003 της Επιτροπής,
    της 19ης Δεκεμβρίου 2003, για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    αιτήσεις που υποβλήθηκαν τον Δεκέμβριο του
    2003 για πιστοποιητικά εισαγωγής ορισμένων προϊόντων
    με βάση το κρέας πουλερικών βάσει του καθεστώτος
    που προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
    774/94 του Συμβουλίου για το άνοιγμα και τον τρόπο
    διαχείρισης ορισμένων κοινοτικών δασμολογικών
    ποσοστώσεων για το κρέας πουλερικών και για
    ορισμένα άλλα γεωργικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2242/2003, annettu 19 päivänä joulukuuta 2003,
    joulukuussa 2003 jätettyjen tiettyjä siipikarjanlihasta peräisin olevia tuotteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä tiettyjen siipikarjanlihaa
    ja tiettyjä muita maataloustuotteita koskevien yhteisön tariffikiintiöiden
    avaamisesta ja hallinnasta annetussa neuvoston asetuksessa (EY) N:o 774/94 säädetyn
    järjestelmän mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2242/2003 della Commissione, del 19 dicembre 2003,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di dicembre 2003 per taluni prodotti del settore
    del pollame nel quadro del regime previsto dal regolamento (CE) n. 774/94 del
    Consiglio recante apertura e modalità di gestione di alcuni contingenti tariffari
    comunitari di pollame e di taluni altri prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2242/2003 van de Commissie van 19 december 2003 tot
