    pautais comunitários de carne de aves de capoeira e outros produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2242/2003 de la Comisión, de 19 de diciembre de 2003,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de aves
    de corral presentadas en el mes de diciembre de 2003 al amparo del régimen previsto
    en el Reglamento (CE) n° 774/94 del Consejo relativo a la apertura y modo de
