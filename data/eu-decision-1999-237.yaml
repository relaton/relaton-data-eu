title:
- language: en
  script: Latn
  content: '1999/237/EC: Commission Decision of 18 March 1999 recognising in principle
    the completeness of the dossier submitted for detailed examination in view of
    the possible inclusion of CGA 277 476 (oxasulfuron) in Annex I to Council Directive
    91/414/EEC concerning the placing of plant-protection products on the market (notified
    under document number C(1999) 632)'
  type: main
- language: fr
  script: Latn
  content: '1999/237/CE: Décision de la Commission du 18 mars 1999 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''éventuelle inscription du CGA 277 476 (oxasulfuron) dans l''annexe I de
    la directive 91/414/CEE du Conseil concernant la mise sur le marché des produits
    phytopharmaceutiques [notifiée sous le numéro C(1999) 632]'
  type: main
