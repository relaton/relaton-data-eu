  content: Commission Regulation (EEC) No 1552/90 of 8 June 1990 determining the reduced
    ecu values of milk sector prices and amounts consequent on the monetary realignment
    of 5 January 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1552/90 de la Commission du 8 juin 1990 déterminant
    les prix et montants fixés en écus dans le secteur du lait et des produits laitiers,
    et réduits en conséquence du réalignement monétaire du 5 janvier 1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1552/90 DER KOMMISSION vom 8. Juni 1990 zur Bestimmung
    der infolge der Waehrungsneufestsetzung vom 5. Januar 1990 verringerten, in Ecu
    festgesetzten Preise und Betraege im Sektor Milch und Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1552/90 af 8. juni 1990 om bestemmelse
    af de priser og beløb, der fastsættes i ECU for mælk og mejeriprodukter, og
    som nedsættes som følge af den monetære justering den 5. januar 1990
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1552/90 της Επιτροπής
    της 8ης Ιουνίου 1990 περί καθορισμού των τιμών
    και των ποσών που καθορίζονται σε Ecu στον τομέα
    του γάλακτος και των γαλακτοκομικών προϊόντων,
    και τα οποία μειώνονται συνεπεία της επανευθυγράμμισης
    των νομισμάτων της 5ης Ιανουαρίου 1990
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1552/90 DELLA COMMISSIONE dell'8 giugno 1990 che stabilisce
    i prezzi e gli importi fissati in ecu nel settore del latte e dei prodotti lattiero-caseari
    e ridotti in seguito al riallineamento monetario del 5 gennaio 1990
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1552/90 VAN DE COMMISSIE van 8 juni 1990 inzake de
    in ecu vastgestelde prijzen en bedragen in de sector melk en zuivelprodukten die
    worden verlaagd als gevolg van de monetaire herschikking van 5 januari 1990
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1552/90 DA COMISSAO de 8 de Junho de 1990 que determina
    os preços e montantes fixados em ecus no sector do leite e dos produtos lacteos,
    reduzidos em consequência do realinhamento monetario de 5 de Janeiro de 1990
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1552/90 DE LA COMISION de 8 de junio de 1990 por el
    que se determinan los precios y los importes fijados en ecus en el sector de la
    leche y de los productos lacteos, y reducidos como consecuencia del reajuste monetario
    de 5 de enero de 1990
  type: main
