title:
- language: en
  script: Latn
  content: '84/61/EEC: Commission Decision of 25 January 1984 authorizing certain
    Member States to renew intra- Community surveillance of certain textile products
    originating in the People''s Republic of China (Only the French, Dutch, German,
    Greek, English and Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/61/CEE: Décision de la Commission du 25 janvier 1984 autorisant certains
    États membres à renouveler la surveillance intracommunautaire relative à certains
    produits textiles originaires de la République populaire de Chine (Les textes
    en langues française, néerlandaise, allemande, grecque, anglaise et italienne
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '84/61/EWG: Entscheidung der Kommission vom 25. Januar 1984 zur Ermächtigung
    einiger Mitgliedstaaten, die innergemeinschaftlichen Überwachungsmaßnahmen für
    bestimmte Textilwaren mit Ursprung in der Volksrepublik China zu verlängern (Nur
    der französische, niederländische, deutsche, griechische, englische und italienische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/61/EØF: Kommissionens beslutning af 25. januar 1984 om bemyndigelse
    af visse medlemsstater til at forny tilsynet inden for Fællesskabet med visse
    tekstilvarer med oprindelse i Den kinesiske Folkerepublik (Kun den franske, nederlandske,
    tyske, graeske, engelske og italienske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '84/61/ΕΟΚ: Απόφαση της Επιτροπής της 25ης Ιανουαρίου
    1984 περί χορηγήσεως αδείας σε ορισμένα κράτη
    μέλη να προβούν σε ενδοκοινοτική επιτήρηση
    ορισμένων κλωστοϋφαντουργικών προϊόντων καταγωγής
    Λαϊκής Δημοκρατίας της Κίνας (Τα κείμενα στην
    γαλλική, ολλανδική, γερμανική, ελληνική, αγγλική
    και ιταλική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '84/61/CEE: Decisione della Commissione del 25 gennaio 1984 che autorizza
    alcuni Stati membri a rinnovare la sorveglianza intracomunitaria sulle importazioni
    di taluni prodotti tessili originari della Repubblica popolare cinese (Il testi
    in lingua francese, olandese, tedesca, greca, inglese e italiana sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '84/61/EEG: Beschikking van de Commissie van 25 januari 1984 houdende machtiging
    van bepaalde Lid-Staten om het intracommunautair toezicht ten aanzien van bepaalde
    textielprodukten van oorsprong uit de Volksrepubliek China te verlengen (Slechts
    de teksten in de Franse, Nederlandse, Duitse, Griekse, Engelse en de Italiaanse
    taal zijn authentiek)'
  type: main
