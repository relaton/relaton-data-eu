id: EUDecision1976240
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 January 1976 authorizing the Italian Republic
    not to apply Community treatment to transistorized radio-receivers, falling within
    subheading ex 85.15 A m of the Common Customs Tariff, originating in Japan and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/240/CEE: Décision de la Commission, du 27 janvier 1976, autorisant
    la République italienne à exclure du traitement communautaire les appareils
    récepteurs de radio (à transistors), de la sous-position Ex 85.15 A III du Tarif
    douanier commun, originaires du Japon et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. Januar 1976, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Transistorempfangsgeräte für Rundfunk der Tarifstelle
    ex 85.15 A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 27. januar 1976 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage radio-modtagere (med transistorer),
    som henhører under pos. ex 85.15 A III i den fælles toldtarif, har oprindelse
    i Japan og overgår til fri omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 27 gennaio 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli apparecchi riceventi per
    radio (a transistori) della voce n. ex 85.15 A III della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 januari 1976 waarbij de Italiaanse
    Republiek wordt gemachtigd ontvangtoestellen voor de radio-omroep (met transistoren),
    van post ex 85.15 A III van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
