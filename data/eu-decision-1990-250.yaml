title:
- language: en
  script: Latn
  content: '90/250/ECSC: Commission Decision of 22 May 1990 derogating from High Authority
    recommendation No 1-64 on tariff protection in order to enable the generalized
    tariff preferences to be applied to certain iron and steel products originating
    in the developing countries (144th derogation)'
  type: main
- language: fr
  script: Latn
  content: '90/250/CECA: Décision de la Commission du 22 mai 1990 portant dérogation
    à la recommandation n° 1-64 de la Haute-Autorité sur la protection tarifaire
    afin de permettre l''application des préférences tarifaires généralisées
    à certains produits sidérurgiques originaires des pays en voie de développement
    (cent quarante-quatrième dérogation)'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 22. Mai 1990 betreffend Ausnahmen von der
    Empfehlung Nr. 1/64 der Hohen Behoerde ueber den Aussenschutz im Hinblick auf
    die Anwendung der allgemeinen Zollpraeferenzen auf bestimmte Stahlerzeugnisse
    mit Ursprung in Entwicklungslaendern (144. Ausnahmeentscheidung) (90/250/EGKS)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 22. maj 1990 om undtagelse fra Den Hoeje Myndigheds
    henstilling nr. 1/64 vedroerende toldbeskyttelse med henblik paa at muliggoere
    anvendelse af de generelle toldpraeferencer paa visse jern- og staalprodukter
    med oprindelse i udviklingslandene (144. undtagelse) (90/250/EKSF)
  type: main
- language: el
  script: Grek
  content: '90/250/ΕΚΑΧ: Απόφαση της Επιτροπής της 22ας
    Μαΐου 1990 για την παρέκκλιση από τη σύσταση
    αριθ. 1/64 της Ανωτάτης Αρχής όσον αφορά τη δασμολογική
    προστασία, προκειμένου να επιτραπεί η εφαρμογή
    των γενικευμένων δασμολογικών προτιμήσεων
    σε ορισμένα προϊόντα της βιομηχανίας σιδήρου
    και χάλυβα που κατάγονται από αναπτυσσόμενες
    χώρες ( 144η παρέκκλιση )'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 22 maggio 1990 recante deroga alla raccomandazione
    n. 1-64 dell'Alta Autorità relativa alla protezione tariffaria al fine di consentire
    l'applicazione delle preferenze tariffarie generalizzate a taluni prodotti siderurgici
    originari dei paesi in via di sviluppo (144a deroga) (90/250/CECA)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 22 mei 1990 tot afwijking van Aanbeveling
    nr. 1-64 van de Hoge Autoriteit betreffende de tariefbescherming, ten einde voor
    bepaalde ijzer- en staalprodukten van oorsprong uit ontwikkelingslanden de toepassing
    van algemene tariefpreferenties mogelijk te maken (144e Uitzonderingsbeschikking)
    (90/250/EGKS)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 22 de Maio de 1990 que derroga a Recomendaçao n*
    1-64 da Alta Autoridade relativa à protecçao pautal, a fim de permitir a aplicaçao
    das preferências pautais generalizadas a certos produtos siderurgicos originarios
    dos paises en vias de desenvolvimento (144* derrogaçao) (90/250/CECA)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 22 de mayo de 1990 por la que se establece una
    excepcion a la Recomendacion no 1/64 de la Alta Autoridad relativa a la proteccion
    arancelaria para permitir la aplicacion de preferencias arancelarias generalizadas
    a determinados productos siderurgicos originarios de paises en vias de desarrollo
    (excepcion no 144) (90/250/CECA)
