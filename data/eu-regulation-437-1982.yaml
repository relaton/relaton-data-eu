title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 437/82 of 25 February 1982 determining the
    extent to which applications lodged during the month of February 1982 for the
    issue of import licences in respect of frozen beef intended for processing may
    be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 437/82 de la Commission, du 25 février 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées pendant le mois de février 1982 pour les viandes bovines
    congelées destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 437/82 der Kommission vom 25. Februar 1982 über den
    Umfang, in dem im Monat Februar 1982 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 437/82 af 25. februar 1982 om fastsættelse
    af i hvilken udstrækning anmodningen om udstedelse af importlicens, indgivet
    i februar måned 1982 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 437/82 της Επιτροπής
    της 25ης Φεβρουαρίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, πού
    υποβλήθηκαν κατά τη διάρκεια του μηνός Φεβρουαρίου
    1982, για τα κατεψυγμένα βόεια κρέατα πού προορίζονται
    για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 437/82 della Commissione, del 25 febbraio 1982, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1982 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 437/82 van de Commissie van 25 februari 1982 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand februari
    1982 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
