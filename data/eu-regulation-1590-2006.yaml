title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1590/2006 of 24 October 2006 determining
    the extent to which the applications for import licences lodged from 16 to 18
    October 2006 for butter originating in New Zealand under the import tariff quota
    managed according to Regulation (EC) No 1452/2006 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1590/2006 de la Commission du 24 octobre 2006 déterminant
    la mesure dans laquelle les demandes de certificats d'importation déposées du
    16 au 18 octobre 2006 pour le beurre originaire de Nouvelle-Zélande dans le cadre
    du contingent tarifaire d'importation géré conformément au règlement (CE)
    n o 1452/2006 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1590/2006 der Kommission vom 24. Oktober 2006 über
    die Festsetzung des Umfangs, in dem die zwischen dem 16. und 18. Oktober 2006
    gestellten Anträge auf Einfuhrlizenzen für Butter mit Ursprung in Neuseeland
    im Rahmen des gemäß der Verordnung (EG) Nr. 1452/2006 verwalteten Einfuhrzollkontingents
    genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1590/2006 ze dne 24. října 2006 , kterým
    se stanoví rozsah, v němž lze schválit žádosti o dovozní licence podané
    od 16. do 18. října 2006 pro máslo pocházející z Nového Zélandu v rámci
    dovozní celní kvóty spravované podle nařízení (ES) č. 1452/2006
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1590/2006 af 24. oktober 2006 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indleveret fra den 16. - 18.
    oktober 2006 for smør med oprindelse i New Zealand under det importtoldkontingent,
    der forvaltes efter forordning (EF) nr. 1452/2006, kan godkendes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1590/2006 της Επιτροπής,
    της 24ης Οκτωβρίου 2006 , για τον καθορισμό του
    ορίου εντός του οποίου δύναται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβάλλονται
    από τις 16 έως τις 18 Οκτωβρίου 2006 για το βούτυρο
    καταγωγής Νέας Ζηλανδίας στο πλαίσιο της ετήσιας
    δασμολογικής ποσόστωσης η οποία διέπεται από
    τον κανονισμό (ΕΚ) αριθ. 1452/2006
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1590/2006, 24. oktoober 2006 , millega määratakse
    kindlaks, millises ulatuses saab heaks kiita määruse (EÜ) nr 1452/2006 alusel
    hallatava imporditariifikvoodi põhjal 16. – 18. oktoobrini 2006 esitatud litsentsitaotlusi
    Uus-Meremaa või importimiseks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1590/2006, annettu 24 päivänä lokakuuta 2006
    , asetuksen (EY) N:o 1452/2006 mukaisesti hallinnoitavassa tuontitariffikiintiössä
    16 päivän lokakuuta ja 18 päivän lokakuuta 2006 välisenä aikana jätettyjen
    Uudesta-Seelannista peräisin olevaa voita koskevien tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1590/2006/EK rendelete ( 2006. október 24. ) az 1452/2006/EK
    rendelettel összhangban kezelt vámkontingens keretében behozott, Új-Zélandból
    származó vajra vonatkozó, 2006. október 16 – 18-ig benyújtott behozatali
    engedély iránti kérelmek elfogadása mértékének meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1590/2006 della Commissione, del 24 ottobre 2006 ,
    recante fissazione dei limiti entro i quali possono essere accettate le domande
    di titoli di importazione presentate dal 16 al 18 ottobre 2006 per il burro neozelandese
    nell'ambito del contingente tariffario di importazione gestito a norma del regolamento
    (CE) n. 1452/2006
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1590/2006 ( 2006. gada 24. oktobris ), ar ko
    nosaka, kādā mērā var pieņemt importa licenču pieteikumus, kas iesniegti
    no 2006. gada 16. oktobra līdz 18. oktobrim par Jaunzēlandes izcelsmes sviestu
    atbilstīgi importa tarifu kvotai, ko pārvalda saskaņā ar Regulu (EK) Nr. 1452/2006
  type: main
- language: lt
  script: Latn
  content: 2006 m. spalio 24 d. Komisijos reglamentas (EB) Nr. 1590/2006, nustatantis
    2006 m. spalio 16 – 18 d. pagal Reglamento (EB) Nr. 1452/2006 administruojamą
    importo tarifinę kvotą pateiktų paraiškų importo licencijoms gauti sviestui,
    kurio kilmės šalis yra Naujoji Zelandija, priėmimo apimtis
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1590/2006 van de Commissie van 24 oktober 2006 tot
    vaststelling van de mate waarin de in de periode van 16 tot en met 18 oktober
    2006 ingediende aanvragen voor certificaten voor de invoer van boter van oorsprong
    uit Nieuw-Zeeland in het kader van het overeenkomstig Verordening (EG) nr. 1452/2006
    beheerde invoertariefcontingent kunnen worden ingewilligd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1590/2006 z dnia 24 października 2006
    r. określające zakres, w jakim mogą zostać przyjmowane wnioski o pozwolenie
    na przywóz masła pochodzącego z Nowej Zelandii składane od dnia 16 do 18 października
    2006 r. w ramach kontyngentu taryfowego zarządzanego zgodnie z rozporządzeniem
    (WE) nr 1452/2006
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1590/2006 da Comissão, de 24 de Outubro de 2006
    , que determina em que medida podem ser aceites os pedidos de certificado de importação
    apresentados de 16 a 18 de Outubro de 2006 para a manteiga originária da Nova
    Zelândia no âmbito do contingente pautal de importação gerido ao abrigo do
    Regulamento (CE) n. o 1452/2006
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1590/2006 z 24. októbra 2006 , ktorým sa
    vymedzuje rozsah možného prijímania žiadostí o dovozné licencie predložených
    v období od 16. do 18. októbra 2006 , ktoré sa vzťahujú na maslo s pôvodom
    na Novom Zélande v rámci dovoznej colnej kvóty spravovanej v súlade s nariadením
    (ES) č. 1452/2006
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1590/2006 z dne 24. oktobra 2006 o določitvi
    obsega, v katerem se lahko sprejmejo zahtevki za izdajo uvoznih dovoljenj, vloženi
    med 16. in 18. oktobrom 2006 za maslo s poreklom iz Nove Zelandije v okviru uvozne
    tarifne kvote, ki se upravlja v skladu z Uredbo (ES) št. 1452/2006
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1590/2006 de la Comisión, de 24 de octubre de 2006
    , por el que se determina en qué medida se podrán aceptar las solicitudes de
    certificados de importación de mantequilla originaria de Nueva Zelanda presentadas
    entre el 16 y el 18 de octubre de 2006 al amparo del contingente arancelario de
    importación gestionado de conformidad con el Reglamento (CE) n o 1452/2006
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1590/2006 av den 24 oktober 2006 om fastställande
