title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 53/89 of 11 January 1989 suspending the
    preferential customs duties and re- introducing the common customs tariff duty
    on imports of large-flowered roses originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 53/89 de la Commission du 11 janvier 1989 suspendant
    le droit de douane préférentiel et réinstaurant le droit du tarif douanier
    commun à l'importation de roses à grande fleur originaires du Maroc
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 53/89 DER KOMMISSION vom 11. Januar 1989 zur Aussetzung
    des bei der Einfuhr von großblütigen Rosen mit Ursprung in Marokko zu erhebenden
    Präferenzzolls und Wiedereinführung des Zolls des Gemeinsamen Zolltarifs #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 53/89 af 11. januar 1989 om suspension
    af præferencetolden og genindførelse af tolden ifølge Den Fælles Toldtarif
    ved indførsel af storblomstrede roser med oprindelse i Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ9 αριθ. 53/89 της Επιτροπής
    της 11ης Ιανουαρίου 1989 για αναστολή του προτιμησιακού
    δασμού και επαναφορά του κοινού δασμολογίου
    κατά την εισαγωγή τριαντάφυλλων με μεγάλο
    άνθος, καταγωγής Μαρόκου
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 53/89 DELLA COMMISSIONE dell'' 11 gennaio 1989 che
    sospende il dazio doganale preferenziale e ripristina il dazio della tariffa doganale
    comune all'' importazione di rose a fiore grande originarie del Marocco #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 53/89 VAN DE COMMISSIE van 11 januari 1989 tot schorsing
    van het preferentiële douanerecht en tot wederinvoering van het recht van het
    gemeenschappelijk douanetarief bij invoer van grootbloemige rozen van oorsprong
    uit Marokko #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 53/89 DA COMISSÃO de 11 de Janeiro de 1989 que
    suspende o direito aduaneiro preferencial e reinstaura o direito da Pauta Aduaneira
    Comum na importação de rosas de flor grande originárias de Marrocos #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 53/89 DE LA COMISION de 11 de enero de 1989 por el
    que se suspende el derecho de aduana preferencial y se restablece el derecho del
    arancel aduanero comun a la importacion de rosas de flor grande originarias de
    Marruecos
