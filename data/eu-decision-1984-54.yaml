title:
- language: en
  script: Latn
  content: '84/54/EEC: Commission Decision of 20 January 1984 repealing Decision 81/265/EEC
    on the duty-free importation of goods intended to be distributed or made available
    free of charge to victims of the earthquake which occurred in February 1981 in
    the Hellenic Republic (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/54/CEE: Décision de la Commission du 20 janvier 1984 abrogeant la
    décision 81/265/CEE de la Commission relative à l''admission en franchise des
    droits à l''importation de marchandises destinées à être distribuées ou mises
    à la disposition gratuitement des victimes du tremblement de terre survenu en
    Grèce en février 1981 (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/54/EWG: Entscheidung der Kommission vom 20. Januar 1984 zur Aufhebung
    der Entscheidung 81/265/EWG über die Befreiung von Eingangsabgaben für bestimmte
    Waren, die an die von dem im Februar 1981 in Griechenland aufgetretenen Erdbeben
    betroffenen Opfer unentgeltlich verteilt oder ihnen unentgeltlich zur Verfügung
    gestellt werden sollen (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/54/EØF: Kommissionens beslutning af 20. januar 1984 om ophævelse
    af beslutning 81/265/EØF om fritagelse for told ved indførsel af varer, der
    er bestemt til gratis udlevering til eller gratis bliver stillet til rådighed
    for ofrene for jordskælvene i februar 1981 i Den hellenske Republik (Kun den
    graeske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/54/ΕΟΚ: Απόφαση της Επιτροπής της 20ής Ιανουαρίου
    1984 που καταργεί την απόφαση 81/265/ΕΟΚ της Επιτροπής
    περί της εισαγωγής, με ατέλεια δασμών, των εμπορευμάτων
    τα οποία προορίζονται να διανεμηθούν ή να διατεθούν
    δωρεάν στα θύματα του σεισμού που έπληξε την
    Ελλάδα τον Φεβρουάριο του 1981 (Το κείμενο στην
    ελληνική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/54/CEE: Decisione della Commissione del 20 gennaio 1984 che abroga
    la decisione 81/265/CEE della Commissione relativa all''ammissione in franchigia
    dai diritti all''importazione di merci destinate ad essere distribuite o messe
    gratuitamente a disposizione delle vittime del terremoto avvenuto nella Repubblica
    ellenica nel febbraio 1981 (Il testo in lingua greca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/54/EEG: Beschikking van de Commissie van 20 januari 1984 tot intrekking
    van Beschikking 81/265/EEG betreffende de invoer met vrijstelling van rechten
    bij invoer van goederen bestemd om gratis te worden verstrekt of ter beschikking
    gesteld aan de slachtoffers van de in februari 1981 voorgevallen aardbeving in
    de Helleense Republiek (Slechts de tekst in de Griekse taal is authentiek)'
  type: main
