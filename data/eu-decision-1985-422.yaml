    zugunsten der Viehhaltung in Italien, die mit der Verordnung (EWG) Nr. 2969/83,
    zuletzt geändert durch die Verordnung (EWG) Nr. 1713/85, eingeführt wurde (Nur
    der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/422/EØF: Kommissionens beslutning af 1. august 1985 om godkendelse
