title:
- language: en
  script: Latn
  content: '85/422/EEC: Commission Decision of 1 August 1985 approving an updating
    of the programme for a special emergency measure to assist stock farming in Italy,
    established by Council Regulation (EEC) No 2969/83, as last amended by Council
    Regulation (EEC) No 1713/85 (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/422/CEE: Décision de la Commission du 1er août 1985 portant approbation
    de la mise à jour du programe relatif à une action exceptionnelle d''urgence
    en faveur de l''élevage en Italie, instituée par le règlement (CEE) n 2969/83,
    modifié en dernier lieu par le règlement (CEE) n° 1713/85 (Le texte en langue
    italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
