    e agli Emirati arabi uniti negli elenchi di paesi terzi, territori o loro zone
    da cui è autorizzato l’ingresso nell’Unione di partite di carni fresche di
    ungulati e di determinati prodotti lattiero-caseari di camelidi
  type: main
