  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2026/491 της Επιτροπής,
    της 4ης Μαρτίου 2026, για την τροποποίηση του
    παραρτήματος IV του εκτελεστικού κανονισμού
    (ΕΕ) 2021/404 όσον αφορά τις καταχωρίσεις για την
    Αργεντινή και την Ταϊλάνδη στον κατάλογο τρίτων
    χωρών ή εδαφών ή ζωνών αυτών από τις οποίες
