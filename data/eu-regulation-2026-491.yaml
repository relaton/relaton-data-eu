  type: main
- language: lt
  script: Latn
  content: 2026 m. kovo 4 d. Komisijos įgyvendinimo reglamentas (ES) 2026/491, kuriuo
    dėl Argentinai ir Tailandui skirtų įrašų trečiųjų šalių, teritorijų
    arba jų zonų, iš kurių leidžiama į Sąjungą įvežti tam tikrų kategorijų
    arklinių šeimos gyvūnų siuntas, sąraše iš dalies keičiamas Įgyvendinimo
