  script: Latn
  content: Uitvoeringsverordening (EU) 2026/491 van de Commissie van 4 maart 2026
    tot wijziging van bijlage IV bij Uitvoeringsverordening (EU) 2021/404 wat betreft
    de gegevens voor Argentinië en Thailand in de lijst van derde landen of gebieden
    of zones daarvan waaruit de binnenkomst in de Unie van zendingen van bepaalde
    categorieën paardachtigen is toegestaan, en tot rectificatie van de bijlagen
    XIII en XVIII bij die verordening wat betreft de gegevens voor Paraguay en de
    Verenigde Arabische Emiraten in de lijsten van derde landen of gebieden of zones
    daarvan waaruit de binnenkomst in de Unie van zendingen vers vlees van hoefdieren
    en bepaalde zuivelproducten van kameelachtigen is toegestaan
  type: main
