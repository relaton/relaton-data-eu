  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2026/491, 4. märts 2026, millega muudetakse
    rakendusmääruse (EL) 2021/404 IV lisa Argentinat ja Taid käsitlevate kannete
    osas selliste kolmandate riikide või territooriumide või nende tsoonide loetelus,
    millest on lubatud liitu tuua teatavatesse kategooriatesse kuuluvate hobuslaste
    saadetisi, ning parandatakse kõnealuse määruse XIII ja XVIII lisa Paraguayd
    ja Araabia Ühendemiraate käsitlevate kannete osas selliste kolmandate riikide
    või territooriumide või nende tsoonide loeteludes, millest on lubatud liitu
    tuua kabiloomade värske liha ja teatavate kaamellastelt saadud piimatoodete saadetisi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2026/491, annettu 4 päivänä
    maaliskuuta 2026, täytäntöönpanoasetuksen (EU) 2021/404 liitteen IV muuttamisesta
    siltä osin kuin on kyse Argentiinaa ja Thaimaata koskevista kohdista niiden kolmansien
    maiden, alueiden tai niiden vyöhykkeiden luettelossa, joista tiettyihin luokkiin
    kuuluvien hevoseläinten lähetysten saapuminen unioniin on sallittua, ja sen
    liitteiden XIII ja XVIII oikaisemisesta siltä osin kuin on kyse Paraguayta ja
    Yhdistyneitä arabiemiirikuntia koskevista kohdista niiden kolmansien maiden,
    alueiden tai niiden vyöhykkeiden luetteloissa, joista sorkka- ja kavioeläinten
    tuoreen lihan ja kamelieläimistä peräisin olevien tiettyjen maitotuotteiden
    lähetysten saapuminen unioniin on sallittua
  type: main
