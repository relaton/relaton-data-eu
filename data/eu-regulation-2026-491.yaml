    2021/404 a mhéid a bhaineann leis na hiontrálacha a bhaineann leis an Airgintín
    agus an Téalainn ar an liosta de thríú tíortha nó críocha, nó criosanna
    díobh, óna n-údaraítear coinsíneachtaí de chatagóirí áirithe eachainmhithe
    a theacht isteach san Aontas, agus lena gceartaítear Iarscríbhinní XIII agus
    XVIII a ghabhann leis a mhéid a bhaineann leis na hiontrálacha a bhaineann le
    Paragua agus le hAontas na nÉimíríochtaí Arabacha ar na liostaí de thríú
    tíortha nó críocha, nó criosanna díobh, óna n-údaraítear coinsíneachtaí
