  content: Regulamento de Execução (UE) 2026/491 da Comissão, de 4 de março de
    2026, que altera o anexo IV do Regulamento de Execução (UE) 2021/404 no que
    se refere às entradas relativas à Argentina e à Tailândia na lista de países
    terceiros ou territórios, ou respetivas zonas, autorizados para a entrada na
