  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2026/491 z dnia 4 marca 2026 r.
    w sprawie zmiany załącznika IV do rozporządzenia wykonawczego (UE) 2021/404
    w odniesieniu do pozycji dotyczących Argentyny i Tajlandii w wykazie państw
    trzecich, terytoriów lub ich stref, z których dozwolone jest wprowadzanie do
    Unii przesyłek niektórych kategorii zwierząt koniowatych, oraz w sprawie sprostowania
    załączników XIII i XVIII do tego rozporządzenia w odniesieniu do pozycji dotyczących
    Paragwaju i Zjednoczonych Emiratów Arabskich w wykazach państw trzecich, terytoriów
    lub ich stref, z których dozwolone jest wprowadzanie do Unii przesyłek świeżego
    mięsa zwierząt kopytnych i niektórych produktów mlecznych pozyskanych od zwierząt
