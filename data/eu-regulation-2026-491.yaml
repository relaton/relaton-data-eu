  content: A Bizottság (EU) 2026/491 végrehajtási rendelete (2026. március 4.)
    az (EU) 2021/404 végrehajtási rendelet IV. mellékletének a lófélék bizonyos
    kategóriáit tartalmazó szállítmányok Unióba történő beléptetése tekintetében
    engedélyezett harmadik országok, területek vagy azok körzeteinek jegyzékében
    az Argentínára és Thaiföldre vonatkozóan szereplő bejegyzések tekintetében
    való módosításáról, valamint az említett rendelet XIII. és XVIII. mellékletének
    a patások friss húsa és a teveféléktől származó bizonyos tejtermékek
    szállítmányainak az Unióba történő beléptetése tekintetében engedélyezett
    harmadik országok, területek vagy azok körzeteinek jegyzékében a Paraguayra
    és az Egyesült Arab Emírségekre vonatkozóan szereplő bejegyzések tekintetében
    való helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2026/491 della Commissione, del 4 marzo
    2026, che modifica l’allegato IV del regolamento di esecuzione (UE) 2021/404
    per quanto riguarda le voci relative all’Argentina e alla Thailandia nell’elenco
    di paesi terzi o territori o loro zone da cui è autorizzato l’ingresso nell’Unione
