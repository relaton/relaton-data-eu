title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/491 of 4 March 2026 amending
    Annex IV to Implementing Regulation (EU) 2021/404 as regards the entries for Argentina
    and Thailand in the list of third countries or territories, or zones thereof,
    authorised for the entry into the Union of consignments of certain categories
    of equine animals, and correcting Annexes XIII and XVIII thereto as regards the
    entries for Paraguay and the United Arab Emirates in the lists of third countries
    or territories, or zones thereof, authorised for the entry into the Union of consignments
    of fresh meat of ungulates and of certain dairy products of camelid animals
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/491 de la Commission du 4 mars 2026
    modifiant l’annexe IV du règlement d’exécution (UE) 2021/404 en ce qui concerne
    les inscriptions relatives à l’Argentine et à la Thaïlande dans la liste
    des pays tiers et territoires, ou des zones de pays tiers ou territoire, en provenance
    desquels l’entrée dans l’Union d’envois de certaines catégories d’équidés
    est autorisée, et rectifiant ses annexes XIII et XVIII en ce qui concerne les
    inscriptions relatives au Paraguay et aux Émirats arabes unis dans les listes
    des pays tiers et territoires, ou des zones de pays tiers ou territoire, en provenance
    desquels l’entrée dans l’Union d’envois de viandes fraîches d’ongulés
    et de certains produits laitiers de camélidés est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/491 der Kommission vom 4. März 2026
    zur Änderung von Anhang IV der Durchführungsverordnung (EU) 2021/404 hinsichtlich
    der Einträge für Argentinien und Thailand in der Liste der Drittländer, Gebiete
    oder Zonen derselben, aus denen der Eingang von Sendungen bestimmter Kategorien
    von Equiden in die Union zulässig ist, und zur Berichtigung der Anhänge XIII
    und XVIII hinsichtlich der Einträge für Paraguay und die Vereinigten Arabischen
    Emirate in den Listen der Drittländer, Gebiete oder Zonen derselben, aus denen
    der Eingang von Sendungen von frischem Fleisch von Huftieren und von bestimmten
    Milcherzeugnissen von Camelidae in die Union zulässig ist
