    anexos XIII e XVIII do mesmo regulamento no que se refere às entradas relativas
    ao Paraguai e aos Emirados Árabes Unidos nas listas de países terceiros ou territórios,
    ou respetivas zonas, autorizados para a entrada na União de remessas de carne
    fresca de ungulados e de determinados produtos lácteos de camelídeos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2026/491 al Comisiei din 4 martie
    2026 de modificare a anexei IV la Regulamentul de punere în aplicare (UE) 2021/404
    în ceea ce privește rubricile referitoare la Argentina și Thailanda din lista
    cu țările terțe, teritoriile sau zonele din acestea autorizate pentru introducerea
    în Uniune a transporturilor de anumite categorii de ecvidee și de rectificare
    a anexelor XIII și XVIII la respectivul regulament în ceea ce privește rubricile
    referitoare la Paraguay și Emiratele Arabe Unite din listele cu țările terțe,
    teritoriile sau zonele din acestea autorizate pentru introducerea în Uniune a
    transporturilor de carne proaspătă de ungulate și de anumite produse lactate
    provenite de la camelide
  type: main
