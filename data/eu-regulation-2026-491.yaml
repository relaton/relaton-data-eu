  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2026/491 av den 4 mars 2026
    om ändring av bilaga IV till genomförandeförordning (EU) 2021/404 vad gäller
    posterna för Argentina och Thailand i förteckningen över tredjeländer, territorier
    eller zoner däri från vilka sändningar av vissa kategorier av hästdjur får
    föras in till unionen, och om rättelse av bilagorna XIII och XVIII till den
    genomförandeförordningen vad gäller posterna för Paraguay och Förenade Arabemiraten
    i förteckningarna över tredjeländer, territorier eller zoner däri från vilka
    sändningar av färskt kött från hov- och klövdjur och vissa mjölkprodukter
    från kameldjur får föras in till unionen
