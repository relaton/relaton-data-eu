  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2026/491 zo 4. marca 2026, ktorým
    sa mení príloha IV k vykonávaciemu nariadeniu (EÚ) 2021/404, pokiaľ ide o
    zápisy týkajúce sa Argentíny a Thajska v zozname tretích krajín alebo území
    alebo ich pásiem, z ktorých je povolený vstup zásielok určitých kategórií
    koňovitých do Únie, a ktorým sa opravujú prílohy XIII a XVIII k uvedenému
    nariadeniu, pokiaľ ide o zápisy týkajúce sa Paraguaja a Spojených arabských
    emirátov v zoznamoch tretích krajín, území alebo ich pásiem, z ktorých
    je povolený vstup zásielok čerstvého mäsa z kopytníkov a určitých mliečnych
    výrobkov z ťavovitých do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2026/491 z dne 4. marca 2026 o spremembi
    Priloge IV k Izvedbeni uredbi (EU) 2021/404 glede vnosov za Argentino in Tajsko
    na seznamu tretjih držav ali ozemelj ali njihovih območij, s katerih je dovoljen
    vstop pošiljk določenih kategorij enoprstih kopitarjev v Unijo, in o popravku
    prilog XIII in XVIII k navedeni uredbi glede vnosov za Paragvaj in Združene arabske
    emirate na seznamih tretjih držav ali ozemelj ali njihovih območij, s katerih
    je dovoljen vstop pošiljk svežega mesa kopitarjev in določenih mlečnih proizvodov
    kamel v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2026/491 de la Comisión, de 4 de marzo de
    2026, por el que se modifica el anexo IV del Reglamento de Ejecución (UE) 2021/404
    en lo que respecta a las entradas correspondientes a Argentina y Tailandia en
    la lista de terceros países o territorios, o zonas de estos, desde los que se
    autoriza la entrada en la Unión de partidas de determinadas categorías de equinos,
    y se corrigen sus anexos XIII y XVIII en lo que respecta a las entradas correspondientes
    a Paraguay y a los Emiratos Árabes Unidos en las listas de terceros países o
    territorios, o zonas de estos, desde los que se autoriza la entrada en la Unión
    de partidas de carne fresca de ungulados y de determinados productos lácteos
    de camélidos
  type: main
