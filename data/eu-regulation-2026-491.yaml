  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/491 af 4. marts 2026
    om ændring af bilag IV til gennemførelsesforordning (EU) 2021/404 for så vidt
    angår oplysningerne om Argentina og Thailand i listen over tredjelande eller
    territorier eller zoner deri, hvorfra det er tilladt at indføre sendinger af
    visse kategorier af dyr af hestefamilien til Unionen, og om berigtigelse af bilag
    XIII og XVIII til samme for så vidt angår oplysningerne vedrørende Paraguay
    og De Forenede Arabiske Emirater i listerne over tredjelande eller territorier
    eller zoner deri, hvorfra det er tilladt at indføre sendinger af fersk kød af
    hovdyr og af visse mejeriprodukter af dyr af kamelfamilien til Unionen
  type: main
