title:
- language: en
  script: Latn
  content: Commission Decision of 13 December 1991 on the establishment of the Community
    support framework for Community structural assistance on the improvement of the
    conditions under which agricultural and forestry products are processed and marketed
    in France (with the exception of Corsica and the overseas departments) (Only the
    French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 décembre 1991, concernant l'établissement
    du cadre communautaire d'appui pour les interventions structurelles communautaires
    relatives à l'amélioration des conditions de transformation et de commercialisation
    des produits agricoles et sylvicoles en France (à l'exception de la Corse et
    des départements d'outre-mer) (Le texte en langue française est le seul faisant
    foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Dezember 1991 zur Aufstellung eines
    gemeinschaftlichen Förderkonzepts für gemeinschaftliche Strukturinterventionen
    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen landwirtschaftlicher
    Erzeugnisse in Frankreich (ohne Korsika und die überseeischen Departements) (Nur
    der französische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. december 1991 om fastlæggelse af fællesskabsstøtterammen
    for EF's strukturinterventioner i Frankrig (undtagen Korsika og De Oversøiske
    Departementer) til forbedring af vilkårene for forarbejdning og afsætning af
    skovbrugs- og landbrugsprodukter (Kun den franske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 13ης Δεκεμβρίου
    1991 σχετικά με την κατάρτιση του κοινοτικού
    πλαισίου στήριξης για παροχή κοινοτικής διαρθρωτικής
    βοήθειας στη Γαλλία (εξαιρούνται η Κορσική
    και τα υπερπόντια διαμερίσματα) για τη βελτίωση
    των συνθηκών μεταποίησης και εμπορίας των
    γεωργικών προϊόντων και δασοκομικών προϊόντων
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 dicembre 1991, riguardante la definizione
    del Quadro comunitario di sostegno per gli interventi strutturali della Comunità
    in ordine al miglioramento delle condizioni di trasformazione e di commercializzazione
    dei prodotti agricoli e della silvicoltura in Francia (esclusi la Corsica e i
    dipartimenti d'Oltremare) (Il testo in lingua francese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 december 1991 tot vaststelling van
    het communautaire bestek voor structurele bijstandsverlening van de Gemeenschap
    voor de verbetering van de verwerking en de afzet van land- en bosbouwprodukten
    in Frankrijk (met uitzondering van Corsica en de Franse overzeese departementen)
    (Slechts de tekst in de Franse taal is authentiek)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 13 de Dezembro de 1991, que estabelece um quadro
    comunitário de apoio para as intervenções estruturais comunitárias destinadas
    à melhoria das condições de transformação e comercialização dos produtos
    agrícolas e silvícolas em França (excluindo a Córsega e os departamentos ultramarinos)
    (Apenas faz fé o texto em língua francesa)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 13 de diciembre de 1991, por la que se establece
    el marco comunitario de apoyo para la ayuda estructural comunitaria a Francia
    (con excepción de Córcega y los departamentos de Ultramar) para la mejora de
    las condiciones de transformación y comercialización de los productos agrarios
    (El texto en lengua francesa es el único auténtico)
