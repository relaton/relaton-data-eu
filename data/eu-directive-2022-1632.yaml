title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/1632 of 12 May 2022 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of lead in certain magnetic resonance imaging devices
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/1632 de la Commission du 12 mai 2022 modifiant,
    aux fins de son adaptation au progrès scientifique et technique, l’annexe IV
    de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative à l’utilisation du plomb dans certains dispositifs d’imagerie
    par résonnance magnétique
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/1632 der Kommission vom 12. Mai 2022 zur
    Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für Blei in bestimmten Magnetresonanztomografen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/1632 на Комисията
    от 12 май 2022 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение IV към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаване
    от ограничението за употребата на олово в някои
    устройства за магнитно-резонансна томография
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2022/1632 ze dne 12. května
    2022, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití olova v některých zařízeních pro snímkování
    pomocí magnetické rezonance
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2022/1632 af 12. maj 2022 om ændring,
    med henblik på tilpasning til den videnskabelige og tekniske udvikling, af bilag
    IV til Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår
    en undtagelse for anvendelse af bly i visse MRI-apparater
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2022/1632 της
    Επιτροπής της 12ης Μαΐου 2022 για την τροποποίηση,
    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση μολύβδου σε ορισμένες συσκευές απεικόνισης
    μαγνητικού συντονισμού
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2022/1632, 12. mai 2022, millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, milles käsitletakse plii kasutamist
    teatavates magnetresonantstomograafia seadmetes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2022/1632, annettu 12 päivänä toukokuuta
    2022, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen tietyissä magneettikuvauslaitteissa
    käytettävää lyijyä koskevan poikkeuksen osalta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/1632 ón gCoimisiún an 12 Bealtaine 2022 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn teicniúil agus eolaíoch,
    Iarscríbhinn IV a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine i leith úsáid luaidhe i bhfeistí
    íomháithe athshondais mhaighnéadaigh áirithe
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/1632 оd 12. svibnja 2022. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu olova u određenim
    uređajima za magnetsku rezonanciju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1632 felhatalmazáson alapuló irányelve (2022.
    május 12.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítás céljából,
    az ólom egyes mágneses rezonanciás képalkotó eszközökben való használatára
    vonatkozó mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2022/1632 della Commissione del 12 maggio 2022
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato IV
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso di piombo in determinati dispositivi diagnostici
    per la risonanza magnetica per immagini
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2022/1632 (2022. gada 12. maijs),
    ar ko attiecībā uz atbrīvojumu, kurš atļauj svinu izmantot noteiktās magnētiskās
    rezonanses attēldiagnostikas ierīcēs, groza Eiropas Parlamenta un Padomes Direktīvas
    2011/65/ES IV pielikumu, to pielāgojot zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2022/1632 2022 m. gegužės 12 d.
    kuria, derinant prie mokslo ir technikos pažangos, dėl išimties, kuria šviną
    leidžiama naudoti tam tikruose magnetinio rezonanso tomografijos aparatuose,
    iš dalies keičiamas Europos Parlamento ir Tarybos direktyvos 2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/1632 tat-12 ta’ Mejju 2022
    li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu taċ-ċomb u l-komposti tiegħu f’ċerti apparati
    tal-immaġni bir-riżonanza manjetika
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/1632 van de Commissie van 12 mei 2022
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van lood in bepaalde
    apparaten voor magnetischeresonantiebeeldvorming
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/1632 z dnia 12 maja 2022 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik IV do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    stosowania ołowiu w niektórych urządzeniach do obrazowania rezonansem magnetycznym
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/1632 da Comissão de 12 de maio de 2022 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante a
    uma isenção relativa à utilização de chumbo em determinados dispositivos
    de imagiologia por ressonância magnética
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/1632 a Comisiei din 12 mai 2022 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei IV la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea plumbului în anumite dispozitive de imagistică prin
    rezonanță magnetică
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/1632 z 12. mája 2022, ktorou sa
    na účely prispôsobenia vedeckému a technickému pokroku mení príloha IV
    k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku týkajúcu
    sa používania olova v určitých prístrojoch na snímanie pomocou magnetickej
    rezonancie
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/1632 z dne 12. maja 2022 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo svinca v nekaterih napravah za slikanje z magnetno resonanco zaradi
    prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/1632 de la Comisión de 12 de mayo de 2022
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo con respecto
    a una exención relativa al uso de plomo en determinados dispositivos de imagen
    por resonancia magnética
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2022/1632 av den 12 maj 2022 om
    ändring, för anpassning till den vetenskapliga och tekniska utvecklingen, av
    bilaga IV till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av bly i vissa produkter för magnetisk resonanstomografi
  type: main
