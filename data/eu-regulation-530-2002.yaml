    de carne de suíno e outros produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 530/2002 de la Comisión, de 22 de marzo de 2002, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de la carne de porcino presentadas
    en marzo de 2002 al amparo del régimen previsto en el Reglamento (CE) n° 774/94
    del Consejo relativo a la apertura y modo de gestión de determinados contingentes
    arancelarios comunitarios de carne de porcino y determinados productos agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 530/2002 av den 22 mars 2002 om den utsträckning
