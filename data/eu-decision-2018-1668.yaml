title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1668 of 6 November 2018 amending
    Annex I to Decision 2006/766/EC as regards the entry for the United States of
    America in the list of third countries and territories from which imports of live,
    chilled, frozen or processed bivalve molluscs, echinoderms, tunicates and marine
    gastropods for human consumption are permitted (notified under document C(2018)
    7207)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1668 de la Commission du 6 novembre 2018
    modifiant l'annexe I de la décision 2006/766/CE en ce qui concerne l'entrée
    relative aux États-Unis d'Amérique dans la liste des pays tiers et territoires
    en provenance desquels l'importation de mollusques bivalves, d'échinodermes,
    de tuniciers et de gastéropodes marins destinés à l'alimentation humaine, qu'ils
    soient vivants, réfrigérés, congelés ou transformés, est autorisée [notifiée
    sous le numéro C(2018) 7207]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1668 der Kommission vom 6. November 2018
    zur Änderung des Anhangs I der Entscheidung 2006/766/EG in Bezug auf den Eintrag
    für die Vereinigten Staaten von Amerika in der Liste der Drittländer und Gebiete,
    aus denen die Einfuhr von lebenden, gekühlten, tiefgefrorenen oder verarbeiteten
    Muscheln, Stachelhäutern, Manteltieren und Meeresschnecken zum menschlichen Verzehr
    zulässig ist (Bekannt gegeben unter Aktenzeichen C(2018) 7207)
  type: main
- language: bg
  script: Cyrl
