    за Съединените американски щати в списъка
    с трети страни и територии, от които е разрешен
    вносът на живи, охладени, замразени или преработени
    двучерупчести мекотели, бодлокожи, ципести
    и морски коремоноги, предназначени за консумация
    от човека (нотифицирано под номер С(2018) 7207)
  type: main
- language: cs
  script: Latn
