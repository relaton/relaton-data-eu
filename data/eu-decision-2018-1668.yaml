    se Spojených států amerických v seznamu třetích zemí a území, ze kterých
    je povolen dovoz živých, chlazených, zmrazených nebo zpracovaných mlžů,
    ostnokožců, pláštěnců a mořských plžů určených k lidské spotřebě
    (oznámeno pod číslem C(2018) 7207)
  type: main
