title:
- language: en
  script: Latn
  content: '79/925/EEC: Commission Decision of 19 October 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Federal Republic of Germany of expenditure
    incurred during 1977 on annuities relating to measures to encourage the cessation
    of farming and the reallocation of utilized agricultural area for the purpose
    of structural improvement (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/925/CEE: Décision de la Commission, du 19 octobre 1979, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République fédérale d''Allemagne, des dépenses
    effectuées pendant l''année 1977 pour les indemnités relatives à l''encouragement
    à la cessation de l''activité agricole et à l''affectation de la superficie
    agricole utilisée à des fins d''amélioration des structures (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/925/EWG: Entscheidung der Kommission vom 19. Oktober 1979 über die
    Rückvergütung der im Jahr 1977 zur Förderung der Einstellung der landwirtschaftlichen
    Erwerbstätigkeit und der Verwendung der landwirtschaftlich genutzten Flächen
    für Zwecke der Strukturverbesserung getätigten Ausgaben durch den EAGFL, Abteilung
    Ausrichtung, an die Bundesrepublik Deutschland (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/925/EØF: Kommissionens beslutning af 19. oktober 1979 om refusion
    gennem EUGFL, udviklingssektionen, til Forbundsrepublikken Tyskland af de udgifter,
    som er afholdt i løbet af året 1977 til godtgørelser vedrørende støtte til
    ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal til
    strukturforbedringsformål (Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/925/CEE: Decisione della Commissione, del 19 ottobre 1979, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica federale
    di Germania delle spese effettuate durante il 1977 per le indennità concernenti
    l''incoraggiamento alla cessazione dell''attività agricola e alla destinazione
    della superficie agricola utilizzata a scopi di miglioramento delle strutture
    (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/925/EEG: Beschikking van de Commissie van 19 oktober 1979 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland
    van de gedurende het jaar 1977 gedane uitgaven voor de uitkeringen met betrekking
    tot de bevordering van de bedrijfsbeëindiging in de landbouw en van de aanwending
    van cultuurgrond tot verbetering van de structuur (Slechts de tekst in de Duitse
    taal is authentiek)'
