title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 44/83 of 7 January 1983 fixing the prices
    to be used for calculating the value of agricultural products in intervention
    storage on 31 December 1982 to be carried forward to the 1983 financial year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 44/83 de la Commission du 7 janvier 1983 fixant les
    prix à retenir pour le calcul de la valeur des produits agricoles, en stock d'
    intervention au 31 décembre 1982, à reporter à l' exercice 1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 44/83 der Kommission vom 7. Januar 1983 zur Festsetzung
    der Preise, die für die Berechnung des Wertes der am 31. Dezember 1982 bei der
    Intervention eingelagerten und auf das Haushaltsjahr 1983 zu übertragenden Agrarerzeugnisse
    zu berücksichtigen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 44/83 af 7. januar 1983 om fastsættelse
    af de priser, der skal anvendes ved beregning af værdien af landbrugsprodukter,
    som interventionsorganerne ligger inde med pr. 31. december 1982, og som skal
    overføres til regnskabsåret 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 44/83 της Επιτροπής
    της 7ης Ιανουαρίου 1983 περί καθορισμού των τιμών
    που πρέπει να ληφθούν υπόψη για τον υπολογισμό
    της αξίας των υφισταμένων αποθεμάτων παρεμβάσεως
    γεωργικών προϊόντων την 31η Δεκεμβρίου 1982 που
    πρέπει να μεταφερθούν στη χρήση 1983
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 44/83 della Commissione del 7 gennaio 1983 che fissa
    i prezzi da prendere in considerazione per calcolare il valore dei prodotti agricoli
    giacenti all' intervento al 31 dicembre 1982 da riportare all' esercizio 1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 44/83 van de Commissie van 7 januari 1983 tot vaststelling
    van de prijzen die in aanmerking moeten worden genomen voor de berekening van
    de waarde van de landbouwprodukten, op 31 december 1982 in voorraad bij de interventiebureaus,
    die moeten worden overgeboekt naar het begrotingsjaar 1983
  type: main
