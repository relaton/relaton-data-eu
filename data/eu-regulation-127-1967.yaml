title:
- language: fr
  script: Latn
  content: Règlement n° 127/67/CEE du Conseil du 13 juin 1967, arrêtant les dispositions
    particulières applicables aux marchandises relevant du règlement n° 160/66/CEE
    et qui sont importées des États africains et malgache associés ou des pays
    et territoires d'outre-mer dans les États membres
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 127/67/EWG des Rates vom 13. Juni 1967 zur Festlegung der
    besonderen Vorschriften für die unter die Verordnung Nr. 160/66/EWG fallenden
    Waren, die aus den assoziierten afrikanischen Staaten und Madagaskar oder aus
    den überseeischen Ländern und Gebieten in die Mitgliedstaaten eingeführt werden
  type: main
- language: it
  script: Latn
  content: Regolamento n. 127/67/CEE del Consiglio, del 13 giugno 1967, relativo all'adozione
    delle disposizioni particolari applicabili alle merci che formano oggetto del
    regolamento n. 160/66/CEE e che sono importate dagli Stati africani e malgascio
    associati o dai paesi e territori d'oltremare negli Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 127/67/EEG van de Raad van 13 juni 1967 houdende vaststelling
    van de bijzondere voorschriften betreffende de onder Verordening Nr. 160/66/EEG
    vallende produkten die uit de geassocieerde Afrikaanse staten en Madagaskar of
    de landen en gebieden overzee in de Lid- Staten worden ingevoerd
  type: main
