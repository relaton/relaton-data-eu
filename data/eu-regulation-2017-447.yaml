  script: Latn
  content: Commission Implementing Regulation (EU) 2017/447 of 14 March 2017 concerning
    the authorisation of the preparation of Bacillus subtilis (DSM 5750) and Bacillus
    licheniformis (DSM 5749) as a feed additive for sows, weaned piglets, pigs for
    fattening, calves for rearing and turkeys for fattening and amending Regulations
