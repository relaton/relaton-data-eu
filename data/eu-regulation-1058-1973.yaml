title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1058/73 of the Commission of 18 April 1973 authorizing
    Ireland to suspend in part the customs duties on fillets of fish, uncooked, breaded
    and frozen falling within tariff subheading ex 16.04 G of the Common Customs Tariff
    imported from other Member States of the European Economic Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1058/73 de la Commission, du 18 avril 1973, autorisant
    l'Irlande à suspendre partiellement le droit de douane applicable aux filets
    de poissons crus, panés et congelés, de la sous-position EX 16.04 G du tarif
    douanier commun, importés en provenance des autres États membres de la Communauté
    économique européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1058/73 der Kommission vom 18. April 1973 zur Ermächtigung
    Irlands zur teilweisen Aussetzung der Zölle für Fischfilet, roh, paniert und
    gefroren, der Tarifstelle ex 16.04 G des Gemeinsamen Zolltarifs bei der Einfuhr
    aus den anderen Mitgliedstaaten der Europäischen Wirtschaftsgemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1058/73 af 18. april 1973 om bemyndigelse
    af Irland til delvis at suspendere tolden på fiskefileter, rå, panerede og frosne,
    under position ex 16.04 G i den fælles toldtarif, som importeres fra andre medlemsstater
    af Det europæiske økonomiske Fællesskab
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1058/73 della Commissione, del 18 aprile 1973, che
    autorizza l'Irlanda a sospendere parzialmente il dazio doganale applicabile ai
    filetti di pesci crudi, impanati e congelati della sottovoce ex 16.04 G della
    tariffa doganale comune importati in provenienza dagli altri Stati membri della
    Comunità economica europea
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1058/73 van de Commissie van 18 april 1973 waarbij
    Ierland gemachtigd wordt het douanerecht op uit andere Lid-Staten van de Europese
    Economische Gemeenschap ingevoerde rauwe, gepaneerde en bevroren visfilets, van
    onderverdeling ex 16.04 G van het gemeenschappelijke douanetarief gedeeltelijk
    te schorsen
  type: main
