title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 89/69 du Conseil, du 16 janvier 1969, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de 34.000
    tonnes de morues entières, décapitées ou tronçonnées, simplement salées
    ou en saumure, ou séchées, de la position 03.02 à I b) du tarif douanier commun
    (année 1969)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 89/69 des Rates vom 16. Januar 1969 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents in Höhe von 34 000
    Tonnen für Kabeljau, ganz, ohne Kopf oder zerteilt, nur gesalzen, in Salzlake
    oder getrocknet, der Tarifnummer 03.02 A I b) des Gemeinsamen Zolltarifs (1969)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 89/69 del Consiglio, del 16 gennaio 1969, relativo
    all'apertura, alla ripartizione e alle modalità di gestione del contingente tariffario
    comunitario di 34.000 tonnellate di merluzzi interi, decapitati o in pezzi, semplicemente
    salati o in salamoia, o secchi, della voce 03.02 A I b) della tariffa doganale
    comune (anno 1969)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 89/69 van de Raad van 16 januari 1969 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    van 34.000 ton kabeljauw, ook indien ontdaan van kop of in moten gesneden, enkel
    gezouten, gepekeld of gedroogd, van post 03.02 A I b) van het gemeenschappelijk
    douanetarief (1969)
