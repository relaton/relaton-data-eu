    konkrētiem lauksaimniecības produktiem, groza Direktīvu 72/462/EEK un atceļ
    Regulu (EEK) Nr. 525/77 un Regulu (EEK) Nr. 3763/91 (Poseidom)
  type: main
- language: lt
  script: Latn
  content: 2001 m. birželio 28 d. Tarybos reglamentas (EB) Nr. 1452/2001, įvedantis
    specialias priemones tam tikriems Prancūzijos užjūrio departamentų žemės
    ūkio produktams ir iš dalies keičiantis Direktyvą 72/462/EEB bei panaikinantis
    Reglamentus (EEB) Nr. 525/77 ir (EEB) Nr. 3763/91 (Poseidom)
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1452/2001 tat-28 ta' Ġunju 2001 li
    jintroduċi miżuri speċifiċi għal ċerti prodotti ta' l-agrikultura għad-dipartimenti
    barranin Franċiżi, li jemenda d-Direttiva 72/462/KEE u jħassar ir-Regolamenti
    (KEE) Nru 525/77 u (KEE) Nru 3763/91 (Poseidom)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1452/2001 van de Raad van 28 juni 2001 houdende specifieke
    maatregelen voor bepaalde landbouwproducten ten behoeve van de Franse overzeese
    departementen, houdende wijziging van Richtlijn 72/462/EEG en houdende intrekking
    van de Verordeningen (EEG) nr. 525/77 en (EEG) nr. 3763/91 (Poseidom)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1452/2001 z dnia 28 czerwca 2001 r. wprowadzające
    szczególne środki dla niektórych produktów rolnych z francuskich departamentów
    zamorskich, zmieniające dyrektywę 72/462/EWG i uchylające rozporządzenia (EWG)
    nr 525/77 i (EWG) nr 3763/91 (Poseidom)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1452/2001 do Conselho, de 28 de Junho de 2001, que
    estabelece medidas específicas relativas a determinados produtos agrícolas a
    favor dos departamentos franceses ultramarinos, que altera a Directiva 72/462/CEE
    e revoga os Regulamentos (CEE) n.° 525/77 e (CEE) n.° 3763/91 (Poseidom)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1452/2001 al Consiliului din 28 iunie 2001 de introducere
    a unor măsuri specifice pentru anumite produse agricole din departamentele franceze
    de peste mări, de modificare a Directivei 72/462/CEE și de abrogare a Regulamentelor
    (CEE) nr. 525/77 și (CEE) nr. 3763/91 (Poseidom)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1452/2001 z 28. júna 2001, ktorým sa zavádzajú
    špecifické opatrenia pre niektoré poľnohospodárske výrobky pre francúzske
    zámorské departementy, mení a dopĺňa smernica 72/462/EHS a zrušujú nariadenia
    (EHS) č. 525/77 a (EHS) č. 3763/91 (Poseidom)
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1452/2001 z dne 28. junija 2001 o uvedbi posebnih
    ukrepov za nekatere kmetijske proizvode za francoske prekomorske departmaje, spremembi
    Direktive 72/462/EGS in razveljavitvi uredb (EGS) št. 525/77 in (EGS) št. 3763/91
    (Poseidom)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1452/2001 del Consejo, de 28 de junio de 2001, por
    el que se aprueban medidas específicas en favor de los departamentos franceses
    de ultramar en relación con determinados productos agrícolas, por el que se
    modifica la Directiva 72/462/CEE y por el que se derogan los Reglamentos (CEE)
    n° 525/77 y (CEE) n° 3763/91 (Poseidom)
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1452/2001 av den 28 juni 2001 om specifika
    åtgärder för vissa jordbruksprodukter till förmån för de franska utomeuropeiska
    departementen, ändring av direktiv 72/462/EEG samt upphävande av förordning
    (EEG) nr 525/77 och förordning (EEG) nr 3763/91 (Poseidom)
  type: main
