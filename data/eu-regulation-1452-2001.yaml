    ja -toodetega, millega muudetakse direktiivi 72/462/EMÜ ja millega tunnistatakse
    kehtetuks määrused (EMÜ) nr 525/77 ja (EMÜ) nr 3763/91 (Poseidom)
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1452/2001, annettu 28 päivänä kesäkuuta 2001,
    tiettyjä maataloustuotteita koskevista erityistoimenpiteistä Ranskan merentakaisten
    departementtien hyväksi, direktiivin 72/462/ETY muuttamisesta ja asetusten (ETY)
    N:o 525/77 ja (ETY) N:o 3763/91 (Poseidom) kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1452/2001/EK rendelete (2001. június 28.) egyes mezőgazdasági
    termékek tekintetében Franciaország tengerentúli megyéinek javára egyedi
    intézkedések bevezetéséről és a 72/462/EGK irányelv módosításáról,
    valamint az 525/77/EGK és 3763/91/EGK (Poseidom) rendeletek hatályon kívül
    helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1452/2001 del Consiglio, del 28 giugno 2001, recante
    misure specifiche a favore dei dipartimenti francesi d'oltremare per taluni prodotti
    agricoli, che modifica la direttiva 72/462/CEE e che abroga i regolamenti (CEE)
    n. 525/77 e (CEE) n. 3763/91 (Poseidom)
  type: main
