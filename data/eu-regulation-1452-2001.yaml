    se některých zemědělských produktů, kterým se mění směrnice 72/462/EHS
    a zrušuje nařízení (EHS) č. 525/77 a (EHS) č. 3763/91 (Poseidom)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1452/2001 af 28. juni 2001 om særlige foranstaltninger
    for visse landbrugsprodukter til fordel for de franske oversøiske departementer
    og om ændring af direktiv 72/462/EØF og om ophævelse af forordning (EØF) nr.
    525/77 og nr. 3763/91 (Poseidom)
  type: main
- language: el
  script: Grek
