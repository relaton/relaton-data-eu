title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1452/2001 of 28 June 2001 introducing specific
    measures for certain agricultural products for the French overseas departments,
    amending Directive 72/462/EEC and repealing Regulations (EEC) No 525/77 and (EEC)
    No 3763/91 (Poseidom)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1452/2001 du Conseil du 28 juin 2001 portant mesures
    spécifiques concernant certains produits agricoles en faveur des départements
    français d'outre-mer, modifiant la directive 72/462/CEE et abrogeant les règlements
    (CEE) n° 525/77 et (CEE) n° 3763/91 (Poseidom)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1452/2001 des Rates vom 28. Juni 2001 zur Einführung
    von Sondermaßnahmen für bestimmte landwirtschaftliche Erzeugnisse zugunsten
    der französischen überseeischen Departements, zur Änderung der Richtlinie 72/462/EWG
    sowie zur Aufhebung der Verordnungen (EWG) Nr. 525/77 und (EWG) Nr. 3763/91 (Poseidom)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1452/2001 на Съвета от 28 юни
