title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2319/83 of 12 August 1983 re-establishing
    the levying of customs duties on mounted piezo-electric crystals, falling within
    subheading 85.21 C and originating in Malaysia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2319/83 de la Commission du 12 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux cristaux piézo-électriques
    montés, de la sous-position 85.21 C du tarif douanier commun, originaires de
    la Malaysia, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2319/83 der Kommission vom 12. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für gefaßte oder montierte piezoelektrische Kristalle
    der Tarifstelle 85.21 C, mit Ursprung in Malaysia, dem die in der Verordnung (EWG)
    Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2319/83 af 12. august 1983 om genindførelse
    af opkrævning af told for monterede piezoelektriske krystaller, henhørende under
    pos. 85.21 C og med oprindelse i Malaysia, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2319/83 της Επιτροπής
    της 12ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τα κρύσταλλα πιεζοηλεκτρικά
    συναρμολογημένα της διακρίσεως 85.21 Γ του Κοινού
    Δασμολογίου, καταγωγής Μαλαισίας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2319/83 della Commissione del 12 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai cristalli piezoelettrici montati,
    della sottovoce 85.21 C della tariffa doganale comune, originari della Malaysia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2319/83 van de Commissie van 12 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gemonteerde
    piëzo-elektrische kristallen van postonderverdeling 85.21 C, van oorsprong uit
    Maleisië, waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
