id: EUDecision1978120
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 November 1977 concerning the application made
    by the United Kingdom under Article 115 of the Treaty for authorization to apply
    protective measures in respect of men's suits of synthetic textile fibres, falling
    within heading No ex 61.01 of the Common Customs Tariff, originating in Poland
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/120/CEE: Décision de la Commission, du 29 novembre 1977, relative
    au recours à l''article 115 du Traité de Rome introduit par le Royaume-Uni visant
    à l''application de mesures de protection pour les costumes pour hommes de fibres
    textiles synthétiques, de la position Ex 61.01 du Tarif douanier commun, originaires
    de Pologne et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. November 1977, mit der das Vereinigte
    Königreich ermächtigt wird, aus Polen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Anzüge aus synthetischen Spinnstoffen der Tarifnummer
    ex 61.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 29. november 1977 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage jakkesæt af syntetiske fibre,
    som henhører under pos. ex 61.01 i den fælles toldtarif, har oprindelse i Polen
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 novembre 1977, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario completi per uomo di fibre tessili
    sintetiche della voce ex 61.01 della tariffa doganale comune originari della Polonia
    e immessi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 november 1977 waarbij het Verenigd
    Koninkrijk wordt gemachtigd kostuums van synthetische textielvezels, van post
    ex 61.01 van het gemeenschappelijk douanetarief, van oorsprong uit Polen en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
