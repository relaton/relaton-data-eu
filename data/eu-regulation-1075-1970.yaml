  content: Règlement (CEE) n° 1075/70 du Conseil, du 8 juin 1970, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de 46.000
    tonnes de harengs frais, réfrigérés ou congelés, entiers, décapités ou tronçonnés,
    de la sous-position 03.01 B I a) 2 aa) du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1075/70 des Rates vom 8. Juni 1970 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents von 46 000 Tonnen Heringen,
    frisch, gekühlt oder gefroren, ganz, ohne Kopf oder zerteilt, der Tarifstelle
    03.01 B I a) 2 aa) des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
