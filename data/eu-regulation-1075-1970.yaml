    comunitario di 46.000 tonnellate di aringhe fresche, refrigerate o congelate,
    intere, decapitate o in pezzi, della sottovoce 03.01 B I a) 2 aa) della tariffa
    doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1075/70 van de Raad van 8 juni 1970 betreffende de
