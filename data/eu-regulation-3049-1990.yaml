title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3049/90 of 22 October 1990 amending Regulation
    (EEC) No 2112/90 imposing a definitive anti-dumping duty on imports of certain
    types of electronic microcircuits known as DRAMS (Dynamic Random Access Memories)
    Originating In Japan And Collecting Definitively The Provisional Duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3049/90 du Conseil, du 22 octobre 1990, modifiant
    le règlement (CEE) n° 2112/90 instituant un droit antidumping définitif sur
    les importations de certains types de microstructures électroniques, dites "DRAM"
    (dynamic random access memories), originaires du Japon et portant perception définitive
    du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3049/90 des Rates vom 22. Oktober 1990 zur Änderung
    der Verordnung (EWG) Nr. 2112/90 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter elektronischer Mikroschaltungen, sogenannter DRAMS
    (Dynamische Schreib-/Lesespeicher), mit Ursprung in Japan, und zur Endgültigen
    Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3049/90 af 22. oktober 1990 om ændring af
    forordning (EØF) nr. 2112/90 om indførelse af en endelig antidumpingtold på
    importen af visse typer elektroniske mikrokredsløb, såkaldte DRAM's (Dynamic
    Random Access Memories), med oprindelse i Japan og om endelig opkrævning af den
    midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3049/90 του Συμβουλίου
    της 22ας Οκτωβρίου 1990 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2112/90 περί επιβολής οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    τύπων ηλεκτρονικών κυκλωμάτων γνωστών ως DRAM
    (δυναμικές μνήμες τυχαίας προσπέλασης), καταγωγής
    Ιαπωνίας και την οριστική είσπραξη του προσωρινού
    δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3049/90, annettu 22 päivänä lokakuuta 1990,
    lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen Japanista peräisin
    olevien elektronisten mikropiirien, niin sanottujen DRAMien (dynamic random access
    memories), tuonnissa ja väliaikaisen tullin lopullisesta kantamisesta annetun
    asetuksen (ETY) N:o 2112/90 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3049/90 del Consiglio, del 22 ottobre 1990, relativo
    alla modifica del regolamento (CEE) n. 2112/90 che istituisce un dazio antidumping
    definitivo sulle importazioni di alcuni tipi di microcircuiti elettronici, detti
    DRAM (Memorie Dinamiche ad Accesso Casuale), originari del Giappone e relativo
    alla riscossione definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3049/90 van de Raad van 22 oktober 1990 tot wijziging
    van Verordening (EEG) nr. 2112/90 tot instelling van een definitief antidumpingrecht
    op de invoer van bepaalde soorten elektronische microschakelingen, bekend als
    DRAM's (Dynamic Random Access Memories), van oorsprong uit Japan, en tot definitieve
    inning van het voorlopig recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3049/90 do Conselho, de 22 de Outubro de 1990, que
    altera o Regulamento (CEE) nº 2112/90, que institui um direito anti-dumping definitivo
    sobre as importações de certos tipos de microcircuitos electrónicos, conhecidos
    por DRAM (memórias dinâmicas de acesso directo), originarias do Japão e que
    estabelece a cobrança definitiva do direito provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3049/90 del Consejo, de 22 de octubre de 1990, que
    modifica el Reglamento (CEE) n° 2112/90 por el que se establece un derecho antidumping
    definitivo sobre las importaciones de determinados tipos de microcircuitos electrónicos
    denominados DRAM (memorias dinámicas de acceso aleatorio) originarios de Japón
    y se recauda definitivamente el derecho provisional
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3049/90 av den 22 oktober 1990 om ändring
    av förordning (EEG) nr 2112/90 om införande av en slutgiltig antidumpningstull
    på import av elektroniska mikrokretsar av DRAM-typ (dynamiska direktminnen) med
    ursprung i Japan samt om slutgiltigt uttag av den preliminära tullen
  type: main
