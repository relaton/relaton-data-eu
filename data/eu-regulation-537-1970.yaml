id: EURegulation5371970
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 537/70 of the Commission of 23 March 1970 authorising
    Member States to take measures derogating from certain requirements of the quality
    standards applicable to exports to third countries of flowering bulbs, corms and
    tubers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 537/70 de la Commission, du 23 mars 1970, autorisant
    les États membres à prendre des mesures dérogatoires à certains critères
    des normes de qualité applicables aux exportations vers les pays tiers des bulbes,
    oignons et tubercules à fleurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 537/70 der Kommission vom 23. März 1970, mit der
    die Mitgliedstaaten ermächtigt werden, bei der Ausfuhr von Blumenbulben, -zwiebeln
    und -knollen nach dritten Ländern abweichende Maßnahmen in bezug auf gewisse
    Kriterien der Qualitätsnormen zu treffen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 537/70 на Комисията от 23
    март 1970 година относно разрешаване на държавите-членки
    да предприемат мерки за дерогация от някои
    изисквания на стандартите за качество, приложими
    към износа за трети страни на клубено-луковици,
    луковици и клубени на цъфтящи растения
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 537/70 ze dne 23. března 1970, kterým se
    členské státy opravňují k přijetí opatření odchylujících se od určitých
    požadavků norem jakosti týkajících se vývozu květinových cibulí a hlíz
    do třetích zemí
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 537/70 af 23. marts 1970 ved hvilken
    medlemsstaterne bemyndiges til for udførsel af blomsterløg og -knolde til tredjelande
    at træffe foranstaltninger, der afviger fra visse af kvalitetsnormernes kriterier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 537/70 της Επιτροπής
    της 23ης Μαρτίου 1970 περί εξουσιοδοτήσεως των
    κρατών μελών να λαμβάνουν μέτρα παρεκκλίσεως
    για ορισμένα κριτήρια κανόνων ποιότητας που
    εφαρμόζονται κατά τις εξαγωγές, προς τις τρίτες
    χώρες, βολβών, κρομμύων και κονδύλων που προορίζονται
    για την παραγωγή ανθέων
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 537/70, 23. märts 1970, millega lubatakse
    liikmesriikidel võtta meetmeid, millega kehtestatakse erandeid teatavatest kvaliteedistandardi
    nõuetest, mida kohaldatakse lillesibulate, juuremugulate ja varremugulate väljaveol
    kolmandatesse riikidesse
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 537/70, annettu 23 päivänä maaliskuuta 1970,
    tietyistä kolmansiin maihin vietäviin kukkasipuleihin ja -mukuloihin sovellettavista
    laatuvaatimusperusteista poikkeavien toimenpiteiden sallimisesta jäsenvaltioille
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 537/70 od 23. ožujka 1970. o ovlašćivanju
    država članica za poduzimanje mjera kojima se odstupa od određenih zahtjeva
    standarda kakvoće koji se primjenjuju na izvoz lukovica cvijeća, gomolja i podanaka
    cvijeća u treće zemlje
  type: main
- language: hu
  script: Latn
  content: A Bizottság 537/70/EGK rendelete (1970. március 23.) a tagállamok számára
    a virághagymák, sarjhagymák és gumók harmadik országokba irányuló kivitelére
    alkalmazandó minőségi előírások egyes követelményeitől eltérő intézkedések
    meghozatalának engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 537/70 della Commissione, del 23 marzo 1970, che autorizza
    gli Stati membri ad adottare misure di deroga a taluni criteri delle norme di
    qualità applicabili alle esportazioni verso i paesi terzi dei bulbi, tuberi e
    rizomi da fiore
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 537/70 (1970. gada 23. marts), ar ko dalībvalstīm
    atļauj veikt pasākumus, kas ierobežo dažas kvalitātes standartu prasības,
    kuras piemērojamas puķu sīpolu, sakneņu un gumu eksportam uz trešajām valstīm
  type: main
- language: lt
  script: Latn
  content: 1970 m. kovo 23 d. Komisijos reglamentas (EEB) Nr. 537/70, leidžiantis
    valstybėms narėms imtis priemonių nukrypstant nuo kokybės standartų, taikomų
    skirtų pražydinti svogūnėlių, gumbasvogūnių ir gumbavaisių eksportui į
    trečiąsias šalis, tam tikrų reikalavimų
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummisjoni (KEE) Nru 537/70 tat-23 ta’ Marzu 1970 li
    jawtorizza lill-Istati Membri li jieħdu miżuri li jidderogaw minn ċerti ħtiġiet
    dwar l-istandards tal-kwalità applikabbli fir-rigward ta’ l-esportazzjoni lejn
    pajjiżi terzi ta’ basal tal-fjuri, għeruq u tuberi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 537/70 van de Commissie van 23 maart 1970 houdende
    machtiging van de Lid-Staten tot het treffen van maatregelen die afwijken van
    bepaalde criteria van de kwaliteitsnormen bij uitvoer naar derde landen van bloembollen
    en bloemknollen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 537/70 z dnia 23 marca 1970 r. upoważniające
    Państwa Członkowskie do podjęcia środków uchylających niektóre wymagania
    dotyczące kryteriów norm jakości mających zastosowanie w wywozie do państw
    trzecich bulw kwiatowych, cebulek i bulw
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 537/70 da Comissão, de 23 de Março de 1970, que
    autoriza os Estados-membros a tomar medidas derrogatórias de certos critérios
    das normas de qualidade aplicáveis às exportações para países terceiros de
    bolbos, cebolas e tubérculos para flores
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 537/70 al Comisiei din 23 martie 1970 privind autorizarea
    statelor membre să ia măsuri derogatorii de la unele criterii ale standardelor
    de calitate aplicabile exporturilor către țări terțe de bulbi, cepe și tuberculi
    de flori
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 537/70 z 23. marca 1970, oprávňujúce členské
    štáty na prijatie opatrení odchyľujúcich sa od určitých požiadaviek noriem
    kvality uplatňovaných na vývoz kvetinových cibúľ, kormov a hľúz do tretích
    krajín
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 537/70 z dne 23. marca 1970 o dovolitvi državam
    članicam, da sprejmejo ukrepe, ki odstopajo od nekaterih zahtev standardov kakovosti,
    za izvoz cvetočih čebulic ter stebelnih in koreninskih gomoljev v tretje države
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 537/70 de la Comisión, de 23 de marzo de 1970, por
    el que se autoriza a los Estados miembros a adoptar medidas que constituyan excepción
    de determinados criterios de las normas de calidad aplicables a las exportaciones
    a terceros países de bulbos, cebollas y tubérculos de flores
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 537/70 av den 23 mars 1970 om bemyndigande
    för medlemsstaterna att för export till tredje land av blomsterlökar och blomsterproducerande
    stam- och rotknölar medge undantag från vissa av kraven beträffande kvalitetsnormerna
  type: main
