    di importazioni di carni bovine di qualità pregiata, fresche, refrigerate o congelate,
    dei codici 0201 e 0202, nonché dei prodotti dei codici 0206 10 95 e 0206 29 91
    della nomenclatura combinata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1023/88 van de Raad van 18 april 1988 houdende opening,
    voor 1988, van een autonoom en uitzonderlijk tariefcontingent voor de invoer van
    vers, gekoeld of bevroren rundvlees van hoge kwaliteit van de codes 0201 en 0202
    alsmede produkten van de codes 0206 10 95 en 0206 29 91 van de gecombineerde nomenclatuur
  type: main
