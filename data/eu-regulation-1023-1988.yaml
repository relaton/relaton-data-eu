title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1023/88 of 18 April 1988 opening for 1988,
    as an autonomous measure, a special import tariff quota for high quality, fresh,
    chilled or frozen beef and veal falling within CN codes 0201 and 0202 and for
    products falling within CN codes 0206 10 95 and 0206 29 91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1023/88 du Conseil du 18 avril 1988 portant ouverture,
    pour l' année 1988 et à titre autonome, d' un contingent tarifaire exceptionnel
    d' importation de viandes bovines de haute qualité, fraîches, réfrigérées
    ou congelées, relevant des codes NC 0201 et 0202, ainsi que des produits relevant
    des codes NC 0206 10 95 et 0206 29 91
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1023/88 des Rates vom 18. April 1988 zur Eröffnung
    eines außerordentlichen autonomen Zollkontingents für die Einfuhr von frischem,
    gekühltem oder gefrorenem hochwertigem Rindfleisch der Positionen 0201 und 0202
    sowie von Erzeugnissen der Unterpositionen 0206 10 95 und 0206 29 91 der Kombinierten
    Nomenklatur (1988)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1023/88 af 18. april 1988 om autonom åbning
    for 1988 af et særligt toldkontinget for indførsel af oksekød af høj kvalitet,
    fersk, kølet eller frosset, henhørende under KN-kode 0201 og 0202, samt af varer
    henhørende under KN-kode 0206 10 95 og 0206 29 91
  type: main
- language: el
  script: Grek
