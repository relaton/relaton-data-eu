  script: Latn
  content: Règlement (CEE) n° 3019/77 de la Commission, du 30 décembre 1977, soumettant
    à un régime commun d'autorisation et de limitation quantitative les importations,
    dans la Communauté, de produits textiles originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3019/77 der Kommission vom 30. Dezember 1977, mit
