title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2309/79 of 19 October 1979 re-establishing
    the levying of customs duties on other sewing machines and other sewing machine
    heads, falling within subheading 84.41 A II and originating in South Korea, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2309/79 de la Commission, du 19 octobre 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres machines
    à coudre et autres têtes pour machines à coudre, de la sous-position 84.41
    A II du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2309/79 der Kommission vom 19. Oktober 1979 zur Wiedereinführung
    des Zollsatzes für andere Nähmaschinen und andere Nähmaschinenköpfe der Tarifstelle
    84.41 A II, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2309/79 af 19. oktober 1979 om genindførelse
    af opkrævning af toldafgifter for andre symaskiner og symaskinehoveder, henhørende
    under pos. 84.41 A II i den fælles toldtarif, som har oprindelse i Sydkorea og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2309/79 della Commissione, del 19 ottobre 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle altre macchine per
    cucire e altre teste di macchine per cucire, della sottovoce 84.41 A II della
    tariffa doganale comune, originarie della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2309/79 van de Commissie van 19 oktober 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere naaimachines
    en andere koppen van naaimachines, van post 84.41 A II, van oorsprong uit Zuid-Korea
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
