title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 640/82 of 19 March 1982 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or china, falling within heading
    No 69.11 and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 640/82 de la Commission, du 19 mars 1982, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine, de la position 69.11
    du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 640/82 der Kommission vom 19. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Geschirr, Haushalts- und Toilettengegenstände, aus
    Porzellan, der Tarifnummer 69.11, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 640/82 af 19. marts 1982 om genindførelse
    af opkrævning af told for bordservice samt husholdnings- og toiletartikler, af
    porcelæn henhørende under pos. 69.11 og med oprindelse i Sydkorea som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 640/82 τής Επιτροπής τής
    19ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τά επιτραπέζια σκεύη καί είδη
    οικιακής χρήσεως ή ευπρεπισμού, εκ πορσελάνης
    τής κλάσεως 69. 11 τού Κοινού Δασμολογίου, καταγωγής
    Νοτίου Κορέας, δικαιούχων τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 640/82 della Commissione, del 19 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili al vasellame e agli oggetti di uso
    domestico o da toletta, di porcellana, della voce 69.11 della tariffa doganale
    comune, originari della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 640/82 van de Commissie van 19 maart 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vaatwerk, huishoudelijke
    artikelen, en toiletartikelen, van porselein van tariefpost 69.11, van oorsprong
    uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
