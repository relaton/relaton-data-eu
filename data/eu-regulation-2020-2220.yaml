  script: Latn
  content: Regulation (EU) 2020/2220 of the European Parliament and of the Council
    of 23 December 2020 laying down certain transitional provisions for support from
    the European Agricultural Fund for Rural Development (EAFRD) and from the European
    Agricultural Guarantee Fund (EAGF) in the years 2021 and 2022 and amending Regulations
    (EU) No 1305/2013, (EU) No 1306/2013 and (EU) No 1307/2013 as regards resources
    and application in the years 2021 and 2022 and Regulation (EU) No 1308/2013 as
    regards resources and the distribution of such support in respect of the years
    2021 and 2022
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2020/2220 du Parlement europeen et du Conseil du 23 décembre
    2020 établissant des dispositions transitoires relatives au soutien du Fonds
    européen agricole pour le développement rural (Feader) et du Fonds européen
    agricole de garantie (FEAGA) en 2021 et 2022, et modifiant les règlements (UE)
    no 1305/2013, (UE) no 1306/2013 et (UE) no 1307/2013 en ce qui concerne les ressources
    et leur application en 2021 et 2022 et le règlement (UE) no 1308/2013 en ce qui
    concerne les ressources et la répartition de ce soutien pour les exercices 2021
    et 2022
  type: main
