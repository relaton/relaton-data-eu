title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 725/89 of 20 March 1989 imposing a definitive
    anti-dumping duty on imports of paint, distemper, varnish and similar brushes
    originating in the people's Republic of China and definitively collecting the
    provisional anti-dumping duty on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 725/89 du Conseil du 20 mars 1989 instituant un droit
    antidumping définitif sur les importations de brosses et de pinceaux à peindre,
    à badigeonner, à vernir ou similaires originaires de la République populaire
    de Chine, et portant perception définitive du droit antidumping provisoire institué
    sur ces importations
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 725/89 DES RATES vom 20. März 1989 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter Bürsten und
    Pinsel zum Auftragen von Anstrichfarben, Lack oder dergleichen mit Ursprung in
    der Volksrepublik China und zur endgültigen Vereinnahmung des auf diese Einfuhren
    erhobenen vorläufigen Antidumpingzolls #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 725/89 af 20. marts 1989 om indførelse af
    en endelig antidumpingtold på importen af pensler og børster til maling, kalkning,
    lakering o.l. med oprindelse i Den Kinesiske Folkerepublik og om endelig opkrævning
    af den midlertidige antidumpingtold, der er pålagt denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 725/89 του Συμβουλίου
    της 20ής Μαρτίου 1989 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ψηκτρών
    και πινέλων για ζωγραφική, επίχριση και βερνίκωμα
    και παρόμοιων ψηκτρών και πινέλων, καταγωγής
    Λαϊκής Δημοκρατίας της Κίνας, και για την οριστική
    είσπραξη του προσωρινού δασμού αντιντάμπινγκ
    που επιβάλλεται στις εισαγωγές αυτές
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 725/89 DEL CONSIGLIO del 20 marzo 1989 che istituisce
    un dazio antidumping definitivo sulle importazioni di spazzole e pennelli per
    dipingere, imbiancare, verniciare e simili originarie della Repubblica popolare
    cinese e riscuote definitivamente il dazio antidumping provvisorio istituito su
    queste importazioni #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 725/89 VAN DE RAAD van 20 maart 1989 houdende instelling
    van een definitief anti-dumpingrecht op de invoer van bepaalde soorten borstels,
    kwasten en penselen voor het schilderen, verven, behangen en dergelijke, van oorsprong
    uit de Volksrepubliek China, en definitieve inning van het voorlopige anti-dumpingrecht
    dat op deze invoer is ingesteld #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 725/89 DO CONSELHO de 20 de Março de 1989 que introduz
    um direito anti-dumping definitivo sobre as importaçoes de escovas e pincéis
    para pintar, caiar, envernizar ou semelhantes originarios da Republica Popular
    da China e que determina a cobrança definitiva do direito anti-dumping provisorio
    introduzido sobre essas importaçoes
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 725/89 DEL CONSEJO de 20 de marzo de 1989 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    brochas y pinceles para pintar, enlucir, barnizar o similares originarios de la
    República Popular de China y por el que se percibe de forma definitiva el derecho
    antidumping provisional establecido sobre dichas importaciones #'
  type: main
