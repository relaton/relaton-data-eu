---
id: EURegulation1422011
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 142/2011 of 25 February 2011 implementing
    Regulation (EC) No 1069/2009 of the European Parliament and of the Council laying
    down health rules as regards animal by-products and derived products not intended
    for human consumption and implementing Council Directive 97/78/EC as regards certain
    samples and items exempt from veterinary checks at the border under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 142/2011 de la Commission du 25 février 2011 portant
    application du règlement (CE) n ° 1069/2009 du Parlement européen et du Conseil
    établissant des règles sanitaires applicables aux sous-produits animaux et produits
    dérivés non destinés à la consommation humaine et portant application de la
    directive 97/78/CE du Conseil en ce qui concerne certains échantillons et articles
    exemptés des contrôles vétérinaires effectués aux frontières en vertu de
    cette directive
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 142/2011 der Kommission vom 25. Februar 2011 zur Durchführung
    der Verordnung (EG) Nr. 1069/2009 des Europäischen Parlaments und des Rates mit
    Hygienevorschriften für nicht für den menschlichen Verzehr bestimmte tierische
    Nebenprodukte sowie zur Durchführung der Richtlinie 97/78/EG des Rates hinsichtlich
    bestimmter gemäß der genannten Richtlinie von Veterinärkontrollen an der Grenze
    befreiter Proben und Waren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 142/2011 на Комисията от 25
    февруари 2011 година за прилагане на Регламент
    (ЕО) № 1069/2009 на Европейския парламент и на Съвета
    за установяване на здравни правила относно
    странични животински продукти и производни
    продукти, непредназначени за консумация от
    човека, и за прилагане на Директива 97/78/ЕО на
    Съвета по отношение на някои проби и артикули,
    освободени от ветеринарни проверки на границата
    съгласно посочената директива
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 142/2011 ze dne 25. února 2011 , kterým se
    provádí nařízení Evropského parlamentu a Rady (ES) č. 1069/2009 o hygienických
    pravidlech pro vedlejší produkty živočišného původu a získané produkty,
    které nejsou určeny k lidské spotřebě, a provádí směrnice Rady 97/78/ES,
    pokud jde o určité vzorky a předměty osvobozené od veterinárních kontrol
    na hranici podle uvedené směrnice
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 142/2011 af 25. februar 2011 om gennemførelse
    af Europa-Parlamentets og Rådets forordning (EF) nr. 1069/2009 om sundhedsbestemmelser
    for animalske biprodukter og afledte produkter, som ikke er bestemt til konsum,
    og om gennemførelse af Rådets direktiv 97/78/EF for så vidt angår visse prøver
    og genstande, der er fritaget for veterinærkontrol ved grænsen som omhandlet
    i samme direktiv
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 142/2011 της Επιτροπής,
    της 25ης Φεβρουαρίου 2011 , για την εφαρμογή του
    κανονισμού (ΕΚ) αριθ. 1069/2009 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου περί υγειονομικών κανόνων
    για ζωικά υποπροϊόντα και παράγωγα προϊόντα
    που δεν προορίζονται για κατανάλωση από τον
    άνθρωπο και για την εφαρμογή της οδηγίας 97/78/ΕΚ
    του Συμβουλίου όσον αφορά ορισμένα δείγματα
    και τεμάχια που εξαιρούνται από κτηνιατρικούς
    ελέγχους στα σύνορα οι οποίοι αναφέρονται
    στην εν λόγω οδηγία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 142/2011, 25. veebruar 2011 , millega rakendatakse
    Euroopa Parlamendi ja nõukogu määrust (EÜ) nr 1069/2009, milles sätestatakse
    muuks otstarbeks kui inimtoiduks ettenähtud loomsete kõrvalsaaduste ja nendest
    saadud toodete tervise-eeskirjad, ja nõukogu direktiivi 97/78/EÜ seoses teatavate
    selle direktiivi alusel piiril toimuvast veterinaarkontrollist vabastatud proovide
    ja näidistega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 142/2011, annettu 25 päivänä helmikuuta 2011
    , muiden kuin ihmisravinnoksi tarkoitettujen eläimistä saatavien sivutuotteiden
    ja niistä johdettujen tuotteiden terveyssäännöistä sekä asetuksen (EY) N:o
    1774/2002 kumoamisesta annetun Euroopan parlamentin ja neuvoston asetuksen (EY)
    N:o 1069/2009 täytäntöönpanosta sekä neuvoston direktiivin 97/78/EY täytäntöönpanosta
    tiettyjen näytteiden ja tuotteiden osalta, jotka vapautetaan kyseisen direktiivin
    mukaisista eläinlääkärintarkastuksista rajatarkastusasemilla
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 142/2011 od 25. veljače 2011. o provedbi Uredbe
    (EZ) br. 1069/2009 Europskog parlamenta i Vijeća o utvrđivanju zdravstvenih
    pravila za nusproizvode životinjskog podrijetla i od njih dobivene proizvode
    koji nisu namijenjeni prehrani ljudi i o provedbi Direktive Vijeća 97/78/EZ u
    pogledu određenih uzoraka i predmeta koji su oslobođeni veterinarskih pregleda
    na granici na temelju te Direktive
  type: main
- language: hu
  script: Latn
  content: A Bizottság 142/2011/EU rendelete ( 2011. február 25. ) a nem emberi
    fogyasztásra szánt állati melléktermékekre és a belőlük származó termékekre
    vonatkozó egészségügyi szabályok megállapításáról szóló 1069/2009/EK
    európai parlamenti és tanácsi rendelet végrehajtásáról, valamint a 97/78/EK
    tanácsi irányelvnek az egyes minták és tételek határon történő állat-egészségügyi
    ellenőrzése alóli, az irányelv szerinti mentesítése tekintetében történő
    végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 142/2011 della Commissione, del 25 febbraio 2011 ,
    recante disposizioni di applicazione del regolamento (CE) n. 1069/2009 del Parlamento
    europeo e del Consiglio recante norme sanitarie relative ai sottoprodotti di origine
    animale e ai prodotti derivati non destinati al consumo umano, e della direttiva
    97/78/CE del Consiglio per quanto riguarda taluni campioni e articoli non sottoposti
    a controlli veterinari alla frontiera
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 142/2011 ( 2011. gada 25. februāris ), ar kuru
    īsteno Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1069/2009, ar ko nosaka
    veselības aizsardzības noteikumus attiecībā uz dzīvnieku izcelsmes blakusproduktiem
    un atvasinātajiem produktiem, kuri nav paredzēti cilvēku patēriņam, un īsteno
    Padomes Direktīvu 97/78/EK attiecībā uz dažiem paraugiem un precēm, kam uz
    robežas neveic veterinārās pārbaudes atbilstīgi minētajai direktīvai
  type: main
- language: lt
  script: Latn
  content: 2011 m. vasario 25 d. Komisijos reglamentas (ES) Nr. 142/2011, kuriuo įgyvendinami
    Europos Parlamento ir Tarybos reglamentas (EB) Nr. 1069/2009, kuriuo nustatomos
    žmonėms vartoti neskirtų šalutinių gyvūninių produktų ir jų gaminių
    sveikumo taisyklės, ir Tarybos direktyva 97/78/EB dėl tam tikrų mėginių ir
    priemonių, kuriems netaikomi veterinariniai tikrinimai pasienyje pagal tą direktyvą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 142/2011 tal- 25 ta’ Frar 2011 li
    jimplimenta r-Regolament (KE) Nru 1069/2009 tal-Parlament Ewropew u tal-Kunsill
    li jistabbilixxi regoli tas-saħħa li jirrigwardaw prodotti sekondarji tal-annimali
    jew derivati minnhom mhux maħsuba għall-konsum mill-bniedem u li jimplimenta
    d-Direttiva tal-Kunsill 97/78/KE li tistabbilixxi l-prinċipji li jirregolaw l-organizzazzjoni
    tal-verifiki veterinarji fuq prodotti li jidħlu fil-Komunità minn pajjiżi terzi
    skont dik id-Direttiva
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 142/2011 van de Commissie van 25 februari 2011 tot
    uitvoering van Verordening (EG) nr. 1069/2009 van het Europees Parlement en de
    Raad tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke
    consumptie bestemde dierlijke bijproducten en afgeleide producten en tot uitvoering
    van Richtlijn 97/78/EG van de Raad wat betreft bepaalde monsters en producten
    die vrijgesteld zijn van veterinaire controles aan de grens krachtens die richtlijn
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 142/2011 z dnia 25 lutego 2011 r. w sprawie
    wykonania rozporządzenia Parlamentu Europejskiego i Rady (WE) nr 1069/2009 określającego
    przepisy sanitarne dotyczące produktów ubocznych pochodzenia zwierzęcego, nieprzeznaczonych
    do spożycia przez ludzi, oraz w sprawie wykonania dyrektywy Rady 97/78/WE w odniesieniu
    do niektórych próbek i przedmiotów zwolnionych z kontroli weterynaryjnych na
    granicach w myśl tej dyrektywy
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 142/2011 da Comissão, de 25 de Fevereiro de 2011
    , que aplica o Regulamento (CE) n. ° 1069/2009 do Parlamento Europeu e do Conselho
    que define regras sanitárias relativas a subprodutos animais e produtos derivados
    não destinados ao consumo humano e que aplica a Directiva 97/78/CE do Conselho
    no que se refere a certas amostras e certos artigos isentos de controlos veterinários
    nas fronteiras ao abrigo da referida directiva
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 142/2011 al Comisiei din 25 februarie 2011 de punere
    în aplicare a Regulamentului (CE) nr. 1069/2009 al Parlamentului European și
    al Consiliului de stabilire a unor norme sanitare privind subprodusele de origine
    animală și produsele derivate care nu sunt destinate consumului uman și de
    punere în aplicare a Directivei 97/78/CE a Consiliului în ceea ce privește
    anumite probe și produse care sunt scutite de la controalele sanitar-veterinare
    la frontieră în conformitate cu directiva menționată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 142/2011 z 25. februára 2011 , ktorým sa
    vykonáva nariadenie Európskeho parlamentu a Rady (ES) č. 1069/2009, ktorým
    sa ustanovujú zdravotné predpisy týkajúce sa vedľajších živočíšnych
    produktov a odvodených produktov neurčených na ľudskú spotrebu, a ktorým
    sa vykonáva smernica Rady 97/78/ES, pokiaľ ide o určité vzorky a predmety
    vyňaté spod povinnosti veterinárnych kontrol na hraniciach podľa danej smernice
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 142/2011 z dne 25. februarja 2011 o izvajanju
    Uredbe (ES) št. 1069/2009 Evropskega parlamenta in Sveta o določitvi zdravstvenih
    pravil za živalske stranske proizvode in pridobljene proizvode, ki niso namenjeni
    prehrani ljudi, ter o izvajanju Direktive Sveta 97/78/ES glede nekaterih vzorcev
    in predmetov, ki so izvzeti iz veterinarskih pregledov na meji v skladu z navedeno
    direktivo
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 142/2011 de la Comisión, de 25 de febrero de 2011
    , por el que se establecen las disposiciones de aplicación del Reglamento (CE)
    n ° 1069/2009 del Parlamento Europeo y del Consejo por el que se establecen las
    normas sanitarias aplicables a los subproductos animales y los productos derivados
    no destinados al consumo humano, y la Directiva 97/78/CE del Consejo en cuanto
    a determinadas muestras y unidades exentas de los controles veterinarios en la
    frontera en virtud de la misma
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 142/2011 av den 25 februari 2011 om genomförande
    av Europaparlamentets och rådet förordning (EG) nr 1069/2009 om hälsobestämmelser
    för animaliska biprodukter och därav framställda produkter som inte är avsedda
    att användas som livsmedel och om genomförande av rådets direktiv 97/78/EG
    vad gäller vissa prover och produkter som enligt det direktivet är undantagna
    från veterinärkontroller vid gränsen
  type: main
