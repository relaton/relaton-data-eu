title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 545/80 of 3 March 1980 re-establishing the
    levying of customs duties on electric accumulators, lead-acid accumulators, falling
    within subheading 85.04 A and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 545/80 de la Commission, du 3 mars 1980, portant rétablissement
    de la perception des droits de douane applicables aux accumulateurs électriques,
    au plomb, de la sous-position 85.04 A du tarif douanier commun, originaires de
    Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 545/80 der Kommission vom 3. März 1980 zur Wiedereinführung
    des Zollsatzes für elektrische Akkumulatoren, aus Blei, der Tarifstelle 85.04
    A, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2789/79 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 545/80 af 3. marts 1980 om genindførelse
    af opkrævning af toldafgifter for elektriske akkumulatorer, blyakkumulatorer,
    under pos. 85.04 A, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 545/80 della Commissione, del 3 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili agli accumulatori elettrici, al piombo,
    della sottovoce 85.04 A della tariffa doganale comune, originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 545/80 van de Commissie van 3 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elektrische
    accumulatoren met loden platen, van post 85.04 A, van oorsprong uit Joegoslavïe
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
