title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1670/91 of 14 June 1991 derogating, for
    the 1991/92 marketing year, from Regulation (EEC) No 3322/89 determining the operative
    events applicable in the fruit and vegetables sector as regards the processing
    of lemons and intervention measures for cauliflowers, apricots, peaches, nectarines,
    lemons and tomatoes and from Regulation (EEC) No 1562/85 as regards the processing
    of lemons
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1670/91 DE LA COMMISSION du 14 juin 1991 portant dérogation,
    pour la campagne 1991/1992, au règlement (CEE) no 3322/89 fixant les faits générateurs
    applicables dans le secteur des fruits et légumes, en ce qui concerne la transformation
    des citrons et les opérations d'' intervention pour les choux-fleurs, les abricots,
    les pêches, les nectarines, les citrons et les tomates, ainsi qu'' au règlement
    (CEE) no 1562/85 pour ce qui concerne la transformation des citrons #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1670/91 DER KOMMISSION vom 14. Juni 1991 zur Abweichung
    im Wirtschaftsjahr 1991/92 von der Verordnung (EWG) Nr. 3322/89 zur Festlegung
    der anspruchsbegründenden Tatbestände im Sektor Obst und Gemüse hinsichtlich
    der Verarbeitung von Zitronen und der Interventionsmaßnahmen für Blumenkohl,
    Aprikosen, Pfirsiche, Nektarinen, Zitronen und Tomaten sowie von der Verordnung
    (EWG) Nr. 1562/85 hinsichtlich der Verarbeitung von Zitronen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1670/91 af 14. juni 1991 om undtagelse
    for produktionsåret 1991/92 fra forordning (EØF) nr. 3322/89 om fastsættelse
    af de udløsende begivenheder i sektoren for frugt og grønsager for så vidt
    angår forarbejdning af citroner og intervention for blomkål, abrikoser, ferskner,
    nektariner, citroner og tomater, samt fra forordning (EØF) nr. 1562/85 for så
    vidt angår forarbejdning af citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1670/91 της Επιτροπής
    της 14ης Ιουνίου 1991 για παρέκκλιση, για την περίοδο
    1991/92 από τον κανονισμό (ΕΟΚ) αριθ. 3322/89 περί καθορισμού
    των γενεσιουργών αιτίων που εφαρμόζονται στον
    τομέα των οπωροκηπευτικών, όσον αφορά τη μεταποίηση
    των λεμονιών και τις παρεμβάσεις για τα κουνουπίδια,
    τα βερίκοκα, τα ροδάκινα, τα νεκταρίνια, τα
    λεμόνια και τις τομάτες, καθώς και από τον κανονισμό
    (ΕΟΚ) αριθ. 1562/85 όσον αφορά τη μεταποίηση των
    λεμονιών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1670/91 DELLA COMMISSIONE del 14 giugno 1991 recante
    deroga, per la campagna 1991/1992, al regolamento (CEE) n. 3322/89 che stabilisce
    i fatti generatori applicabili nel settore degli ortofrutticoli per quanto riguarda
    la trasformazione dei limoni e le operazioni d'' intervento per i cavolfiori,
    le albicocche, le pesche, le nettarine, i limoni e i pomodori, nonché al regolamento
    (CEE) n. 1562/85 per quanto riguarda la trasformazione dei limoni #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1670/91 VAN DE COMMISSIE van 14 juni 1991 houdende
    afwijking, voor het verkoopseizoen 1991/1992, van Verordening (EEG) nr. 3322/89
    tot vaststelling van de ontstaansfeiten in de sector groenten en fruit ten aanzien
    van de verwerking van citroenen en de interventiemaatregelen voor bloemkool, abrikozen,
    perziken, nectarines, citroenen en tomaten, alsmede van Verordening (EEG) nr.
    1562/85 ten aanzien van de verwerking van citroenen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1670/91 DA COMISSÃO de 14 de Junho de 1991 que estabelece
    uma derrogação, para a campanha de 1991/1992, do Regulamento (CEE) no 3322/89,
    que fixa os factos geradores aplicáveis no sector das frutas e produtos hortícolas
    no que diz respeito à transformação dos limões, e as operações de intervenção
    para as couves-flores, os damascos, os pêssegos, as nectarinas, os limões e
    os tomates, bem como do Regulamento (CEE) no 1562/85 no que diz respeito à transformação
    dos limões #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1670/91 DE LA COMISIÓN de 14 de junio de 1991 por
    el que se establece la inaplicación, durante la campaña 1991/92, del Reglamento
    (CEE) no 3322/89 por el que se fijan los hechos generadores aplicables en el sector
    de las frutas y hortalizas, en lo relativo a la transformación de limones y a
    las operaciones de intervención de coliflores, albaricoques, melocotones, nectarinas,
    limones y tomates, así como del Reglamento (CEE) no 1562/85 por lo que respecta
    a la transformación de los limones #'
