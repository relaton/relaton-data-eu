title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1187/85 of 7 May 1985 re-establishing the
    levying of customs duties on wadding and articles of wadding; textile flock and
    dust and mill neps, products of category 94 (code 40.0940), originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1187/85 de la Commission du 7 mai 1985 portant rétablissement
    de la perception des droits de douane applicables aux ouates et articles en ouate;
    tontisses, noeuds et noppes (boutons) de matières textiles, de la catégorie
    94 (code 40.0940), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1187/85 der Kommission vom 7. Mai 1985 über die Wiedereinführung
    des Zollsatzes für Watte und Waren daraus, Scherstaub, Knoten und Noppen, aus
    Spinnstoffen, der Warenkategorie Nr. 94 (Kennziffer 40.0940) mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1187/85 af 7. maj 1985 om genindførelse
    af opkrævning af toldafgifter for vat og varer deraf, flok, støv og nopper af
    tekstilmaterialer, under varekategori nr. 94 (kode 40.0940) som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1187/85 της Επιτροπής
    της 7ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για βάτες και είδη από βάτα,
    χνούδι από την επεξεργασία των υφασμάτων, κόμπους
    και σφαιρίδια από υφαντικές ίνες, προϊόντα
    της κατηγορίας 94 (κωδικός αριθμός 40.0940), καταγωγής
    Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1187/85 della Commissione del 7 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili a ovatte e manufatti di ovatta; borre
    di cimatura, nodi o groppetti (bottoni) di materie tessili, della categoria di
    prodotti n. 94 (codice 40.0940) originari della Corea del Sud beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1187/85 van de Commissie van 7 mei 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op watten en
    artikelen van watten, scheerhaar (tontisse) en noppen, van textielstof, van de
    categorie van produkten nr. 94 (codenummer 40.0940), van oorsprong uit Zuid-Korea
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3563/84 van de Raad
