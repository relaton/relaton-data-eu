id: EUDecision197653
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 November 1975 authorizing the United Kingdom
    not to apply Community treatment to jackets, suits, jeans, shorts and similar
    articles, falling within heading No ex 61.01 of the Common Customs Tariff, originating
    in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: 76/53/CEE Décision de la Commission du 20 novembre 1975 autorisant le
    Royaume-Uni à exclure du traitement communautaire les importations de vestes,
    costumes, jeans, shorts et articles similaires, de la position Ex 61.01 du Tarif
    douanier commun, originaires de Hong-Kong et mis en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. November 1975, mit der das Vereinigte
    Königreich ermächtigt wird, aus Hongkong stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Jacken, Anzüge, Jeans, Shorts und ähnliche Waren
    der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. november 1975 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabstoldbehandling at undtage jakkesæt, jakker, blazere,
    jeans, shorts o. lign. varer, som henhører under pos. ex 61.01 i den fælles
    toldtarif, har oprindelse i Hong-Kong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 novembre 1975, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario le importazioni di giacche, vestiti,
    jeans, calzoncini corti e articoli simili della voce ex 61.01 della tariffa doganale
    comune, originari di Hong-Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 november 1975 waarbij het Verenigd
    Koninkrijk wordt gemachtigd vesten, kostuums, jeans, korte broeken en dergelijke
    artikelen van post ex 61.01 van het gemeenschappelijk douanetarief, van oorsprong
    uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten
  type: main
