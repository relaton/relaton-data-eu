  content: Commission Regulation (EEC) No 2375/83 of 22 August 1983 authorizing the
    conclusion of short-term private storage contracts for grape must, concentrated
    grape must and rectified concentrated grape must
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2375/83 de la Commission du 22 août 1983 ouvrant la
