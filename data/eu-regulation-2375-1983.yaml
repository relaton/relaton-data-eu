    moûts de raisins, les moûts de raisins concentrés et les moûts de raisins
    concentrés rectifiés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2375/83 der Kommission vom 22. August 1983 über die
    Möglichkeit des Abschlusses kurzfristiger Verträge zur privaten Lagerhaltung
    von Traubenmost, konzentriertem Traubenmost und rektifiziertem Traubenmostkonzentrat
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2375/83 af 22. august 1983 om indgåelse
