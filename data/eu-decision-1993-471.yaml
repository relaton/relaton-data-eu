  script: Latn
  content: '93/471/EEC: Commission Decision of 27 July 1993 on the establishment of
    a supplement to the addendum to the Community support framework for Community
    structural assitance in Portugal on the improvement of the conditions under which
    agricultural and forestry products are processed and marketed (Only the Portuguese
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/471/CEE: Décision de la Commission du 27 juillet 1993 établissant
