title:
- language: fr
  script: Latn
  content: Règlement n° 99/65/CEE de la Commission, du 7 juillet 1965, fixant les
    modalités d'application de l'article 11 paragraphe 2 du règlement n° 23 du
    Conseil portant établissement graduel d'une organisation commune des marchés
    dans le secteur des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 99/65/EWG der Kommission vom 7. Juli 1965 betreffend die
    Festlegung von Durchführungsbestimmungen für Artikel 11 Absatz (2) der Verordnung
    Nr. 23 des Rates über die schrittweise Errichtung einer gemeinsamen Marktorganisation
    für Obst und Gemüse
  type: main
- language: it
  script: Latn
  content: Regolamento n. 99/65/CEE della Commissione, del 7 luglio 1965, che fissa
    le modalità di applicazione dell'articolo 11, paragrafo 2, del regolamento n.
    23 del Consiglio relativo alla graduale attuazione di un'organizzazione comune
    dei mercati nel settore degli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 99/65/EEG van de Commissie van 7 juli 1965 inzake de wijze
    van toepassing van artikel 11, lid 2, van Verordening Nr. 23 van de Raad, houdende
    de geleidelijke totstandbrenging van een gemeenschappelijke ordening der markten
    in de sector groenten en fruit
  type: main
