id: EURegulation6791994
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 679/94 of 25 March 1994 determining to what
    extent licence applications submitted during March 1994 for live bovine animals
    weighing between 160 and 300 kg as part of an import quota provided for under
    European agreements concluded between the Community and the Republic of Poland,
    the Republic of Hungary and the Czech and Slovak Federal Republic (CSFR) may be
    accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 679/94 de la Commission, du 25 mars 1994, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en mars 1994 pour les animaux vivants de l'espèce bovine d'un poids
    de 160 à 300 kilogrammes dans le cadre d'un quota d'importation prévu par les
    accords européens conclus par la Communauté avec la république de Pologne,
    la république de Hongrie et la République fédérative tchèque et slovaque
    (RFTS)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 679/94 der Kommission vom 25. März 1994 zur Festsetzung
    des Umfangs, in dem die im März 1993 für die Einfuhr lebender, 160 bis 300 kg
    schwerer Rinder gemäß den Europa-Abkommen zwischen der Gemeinschaft und der
    Republik Polen, der Republik Ungarn und der Tschechischen und Slowakischen Föderativen
    Republik beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 679/94 af 25. marts 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i marts 1994 om
    importlicenser for levende kvæg af en vægt på 160 til 300 kg i forbindelse
    med et importkontingent, der er fastsat i Europaaftalerne mellem Fællesskabet
    og Republikken Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative
    Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 679/94 της Επιτροπής
    της 25ης Μαρτίου 1994 για τον καθορισμό του βαθμού
    στον οποίο είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Μάρτιο 1994 για ζωντανά ζώα του
    βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας ποσόστωσης εισαγωγής η οποία
    προβλέπεται από τις ευρωπαϊκές συμφωνίες που
    έχουν συναφθεί μεταξύ, αφενός, της Κοινότητας
    και, αφετέρου, της Δημοκρατίας της Πολωνίας,
    της Δημοκρατίας της Ουγγαρίας και της Τσεχικής
    και Σλοβακικής Ομοσπονδιακής Δημοκρατίας
    (ΤΣΟΔ)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 679/94 della Commissione, del 25 marzo 1994, che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel mese di marzo 1994 per gli animali vivi della specie bovina, dai 160 ai 300
    chilogrammi, nel quadro del contingente di importazione previsto dagli accordi
    europei conclusi dalla Comunità con la Repubblica di Polonia, la Repubblica d'Ungheria
    e la Repubblica federativa ceca e slovacca (RFCS)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 679/94 van de Commissie van 25 maart 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor levende runderen met een gewicht van 160 tot 300 kg, die in maart 1994 zijn
    ingediend op grond van de invoerregeling die is vastgesteld in de door de Gemeenschap
    met de Republiek Polen, de Republiek Hongarije en de Tsjechische en Slowaakse
    Federatieve Republiek (TSFR) gesloten Europa-overeenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 679/94 da Comissão, de 25 de Março de 1994, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina com peso compreendido entre 160 e 300 quilogramas,
    apresentados em Março de 1994 ao abrigo de uma quota de importação prevista
    nos acordos europeus concluídos pela Comunidade com a República da Polónia,
    a República da Hungria e a República Federativa Checa e Eslovaca (RFCE)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 679/94 de la Comisión, de 25 de marzo de 1994, por el
    que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de animales vivos de la especie bovina con un peso entre 160 y
    300 kilogramos, presentadas en marzo de 1994, dentro de la cuota de importación
    establecida en los Acuerdos europeos celebrados entre la Comunidad y la República
    de Polonia, la República de Hungría y la República Federativa Checa y Eslovaca
    (RFCE)
  type: main
