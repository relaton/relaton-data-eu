title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1393/2001 of 9 July 2001 derogating from
    Regulation (EC) No 2316/1999 laying down detailed rules for the application of
    Council Regulation (EC) No 1251/1999 establishing a support system for producers
    of certain arable crops as regards set-aside in certain areas of France
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1393/2001 de la Commission du 9 juillet 2001 dérogeant,
    pour certaines régions de France, au règlement (CE) n° 2316/1999 portant modalités
    d'application du règlement (CE) n° 1251/1999 du Conseil instituant un régime
    de soutien aux producteurs de certaines cultures arables en ce qui concerne le
    gel de terres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1393/2001 der Kommission vom 9. Juli 2001 zur Abweichung
    von der Verordnung (EG) Nr. 2316/1999 mit Durchführungsbestimmungen zur Verordnung
    (EG) Nr. 1251/1999 des Rates zur Einführung einer Stützungsregelung für Erzeuger
    bestimmter landwirtschaftlicher Kulturpflanzen hinsichtlich der Flächenstilllegung
    in bestimmten Gebieten Frankreichs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1393/2001 af 9. juli 2001 om fravigelse
    for visse franske regioner af forordning (EF) nr. 2316/1999 om gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 1251/1999 om indførelse af en støtteordning
    for producenter af visse markafgrøder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1393/2001 της Επιτροπής,
    της 9ης Ιουλίου 2001, που παρεκκλίνει, για ορισμένες
    περιοχές της Γαλλίας, από τον κανονισμό (ΕΚ)
    αριθ. 2316/1999 σχετικά με τις λεπτομέρειες εφαρμογής
    του κανονισμού (ΕΚ) αριθ. 1251/1999 του Συμβουλίου
    για τη θέσπιση καθεστώτος στήριξης των παραγωγών
    ορισμένων αροτραίων καλλιεργειών, όσον αφορά
    την παύση καλλιέργειας της γης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1393/2001, annettu 9 päivänä heinäkuuta 2001,
    tukijärjestelmästä tiettyjen peltokasvien viljelijöille annetun neuvoston
    asetuksen (EY) N:o 1251/1999 soveltamista koskevista yksityiskohtaisista säännöistä
    annetusta asetuksesta (EY) N:o 2316/1999 poikkeamisesta tietyillä Ranskan alueilla
    kesannoinnin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1393/2001 della Commissione, del 9 luglio 2001, che
    deroga, per talune regioni della Francia, al regolamento (CE) n. 2316/1999 recante
    modalità di applicazione del regolamento (CE) n. 1251/1999 del Consiglio che
    istituisce un regime di sostegno a favore dei coltivatori di taluni seminativi,
    relativamente al ritiro dei seminativi dalla produzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1393/2001 van de Commissie van 9 juli 2001 waarbĳ,
    voor sommige regio's in Frankrĳk, van Verordening (EG) nr. 2316/1999 houdende
    uitvoeringsbepalingen van Verordening (EG) nr. 1251/1999 van de Raad tot instelling
    van een steunregeling voor producenten van bepaalde akkerbouwgewassen wordt afgeweken
    ten aanzien van de braaklegging
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1393/2001 da Comissão, de 9 de Julho de 2001, que
    estabelece uma derrogação, no que diz respeito à retirada das terras da produção
    em certas regiões de França, do Regulamento (CE) n.° 2316/1999 que estabelece
    normas de execução do Regulamento (CE) n.° 1251/1999 do Conselho que institui
    um sistema de apoio aos produtores de determinadas culturas arvenses
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1393/2001 de la Comisión, de 9 de julio de 2001, por
    el que se autorizan, en lo que concierne a determinadas regiones de Francia, excepciones
    a lo dispuesto en el Reglamento (CE) n° 2316/1999 que establece las disposiciones
    de aplicación del Reglamento (CE) n° 1251/1999 del Consejo por el que se establece
    un régimen de apoyo a los productores de determinados cultivos herbáceos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1393/2001 av den 9 juli 2001 om undantag
    för vissa regioner i Frankrike från förordning (EG) nr 2316/1999 om tillämpningsföreskrifter
    till rådets förordning (EG) nr 1251/1999 om upprättande av ett stödsystem
    för producenter av vissa jordbruksgrödor när det gäller arealuttag
  type: main
