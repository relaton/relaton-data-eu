  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3291/94 del Consiglio, del 19 dicembre 1994, che fissa,
    per il 1995, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera di uno Stato membro, esclusi la Spagna
    e il Portogallo, nelle acque soggette alle sovranità o alla giurisdizione del
    Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3291/94 van de Raad van 19 december 1994 tot vaststelling,
    voor 1995, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag voeren van een
    Lid-Staat, met uitzondering van Spanje en Portugal, in de wateren die onder de
    soevereiniteit of de jurisdictie van Portugal vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3291/94 do Conselho, de 19 de Dezembro de 1994, que
