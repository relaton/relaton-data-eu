title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3291/94 of 19 December 1994 fixing, for 1995,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of a Member State, other than Spain and Portugal, in
    waters falling under the sovereignty or within the jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3291/94 du Conseil, du 19 décembre 1994, fixant, pour
    1995, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon d' un État membre, à l' exception de
    l' Espagne et du Portugal, dans les eaux relevant de la souveraineté ou de la
    juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3291/94 des Rates vom 19. Dezember 1994 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter der Flagge eines Mitgliedstaats, mit Ausnahme Spaniens und
    Portugals, in den Gewässern unter der Hoheitsgewalt oder Gerichtsbarkeit Portugals
    (1995)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3291/94 af 19. december 1994 om fastsættelse
    for 1995 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører en medlemsstats flag, bortset
    fra spansk og portugisisk flag, i de farvande, der henhører under Portugals højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
