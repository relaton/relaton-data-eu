    con excepción de España y de Portugal, en aguas sometidas a la soberanía o
    a la jurisdicción de Portugal
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 3291/94 av den 19 december 1994 om fastställande
