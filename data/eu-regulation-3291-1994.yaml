    της 19ης Δεκεμβρίου 1994 για τον καθορισμό, για
    το 1995, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με σημαία ενός κράτους μέλους, εκτός
    της Ισπανίας και της Πορτογαλίας, στα ύδατα
    που υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3291/94, annettu 19 päivänä joulukuuta 1994,
