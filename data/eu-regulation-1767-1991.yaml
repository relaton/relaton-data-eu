  content: Commission Regulation (EEC) No 1767/91 of 14 June 1991 amending Commission
    Regulation (EEC) No 3814/90 laying down the level of the accession compensatory
    amounts for milk and milk products in trade between Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1767/91 DE LA COMMISSION du 14 juin 1991 modifiant
    le règlement (CEE) no 3814/90 arrêtant dans le secteur du lait et des produits
    laitiers le niveau des montants compensatoires « adhésion » dans les échanges
    entre l'' Espagne et le Portugal #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1767/91 DER KOMMISSION vom 14. Juni 1991 zur Änderung
    der Verordnung (EWG) Nr. 3814/90 zur Festsetzung der Beitrittsausgleichsbeträge
    für Milch und Milcherzeugnisse im Handel zwischen Spanien und Portugal #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1767/91 af 14. juni 1991 om ændring
    af forordning (EØF) nr. 3814/90 om fastsættelse af tiltrædelsesudligningsbeløbene
    for mælk og mejeriprodukter i samhandelen mellem Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1767/91 της Επιτροπής
    της 14ης Ιουνίου 1991 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 3814/90 που καθορίζει στον τομέα του
    γάλακτος και των γαλακτοκομικών προϊόντων
    το ύψος των εξισωτικών ποσών προσχώρησης στις
    εμπορικές συναλλαγές μεταξύ της Ισπανίας και
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1767/91 DELLA COMMISSIONE del 14 giugno 1991 recante
    modifica del regolamento (CEE) n. 3814/90 che fissa, nel settore del latte e dei
    prodotti lattiero-caseari, il livello degli importi compensativi adesione applicabili
    negli scambi tra la Spagna e il Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1767/91 VAN DE COMMISSIE van 14 juni 1991 tot wijziging
    van Verordening (EEG) nr. 3814/90 tot vaststelling van het niveau van de in het
    handelsverkeer tussen Spanje en Portugal toe te passen compenserende bedragen
    toetreding in de sector melk en zuivelprodukten #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1767/91 DA COMISSAO, DE 14 DE JUNHO DE 1991, QUE
    ALTERA O REGULAMENTO ( CEE ) NO 3814/90 QUE ADOPTA, NO SECTOR DO LEITE E PRODUTOS
    LACTEOS, O NIVEL DOS MONTANTES COMPENSATORIOS DE ADESAO APLICAVEIS NAS TROCAS
    COMERCIAIS ENTRE ESPANHA E PORTUGAL
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1767/91 DE LA COMISIÓN de 14 de junio de 1991 por
    el que se modifica el Reglamento (CEE) no 3814/90 por el que se adopta el nivel
    de los montantes compensatorios de adhesión en los intercambios entre España
    y Portugal aplicables a partir del 1 de enero de 1991 en el sector de la leche
    y de los productos lácteos #'
