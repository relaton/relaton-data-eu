title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 64/98 of 19 December 1997 laying down for 1998
    certain measures for the conservation and management of fishery resources applicable
    in vessels flying the flag of certain non- member countries in the 200-nautical-mile
    zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 64/98 du Conseil du 19 décembre 1997 fixant, pour
    l'année 1998, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon de certains pays tiers dans
    la zone de 200 milles située au large des côtes du département français de
    la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 64/98 des Rates vom 19. Dezember 1997 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1998)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 64/98 af 19. december 1997 om fastsættelse
    for 1998 af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    gældende for fartøjer der fører visse tredjelandes flag i 200- sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 64/98 του Συμβουλίου
    της 19ης Δεκεμβρίου 1997 για τον καθορισμό, για
    το 1998, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων, για σκάφη υπό σημαία
    ορισμένων χωρών μη μελών εντός της ζώνης 200
    μιλίων στα ανοικτά του γαλλικού διαμερίσματος
    της Γουϊάνας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 64/98, annettu 19 joulukuuta 1997, tietyistä
    kolmansien maiden lipun alla purjehtiviin aluksiin 200 meripeninkulman kalastusvyöhykkeellä,
    joka sijaitsee Ranskan Guayanan departementin rannikon edustalla, sovellettavista
    kalavarojen säilyttämis- ja hoitotoimenpiteistä vuodeksi 1998
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 64/98 del Consiglio del 19 dicembre 1997 che stabilisce,
    per il 1998, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 64/98 van de Raad van 19 december 1997 houdende maatregelen,
    voor 1998, voor de instandhouding en het beheer van de visbestanden die, ten aanzien
    van vaartuigen die de vlag van bepaalde derde landen voeren, in de 200-mijlszone
    voor de kust van het Franse departement Guyana van toepassing zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 64/98 do Conselho de 19 de Dezembro de 1997 que estabelece,
    para 1998, determinadas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de certos países terceiros,
    na zona de 200 milhas marítimas situada ao largo do departamento francês da
    Guiana
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 64/98 del Consejo de 19 de diciembre de 1997 por el
