title:
- language: en
  script: Latn
  content: '82/700/EEC: Commission Decision of 1 October 1982 amending Decision 82/467/EEC
    authorizing a number of Member States to sell butter at a reduced price in the
    form of concentrated butter (Only the French, German and English texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/700/CEE: Décision de la Commission, du 1er octobre 1982, portant modification
    de la décision 82/467/CEE autorisant plusieurs Etats membres à vendre du beurre
    à prix réduit sous forme de beurre concentré (Les textes en langues française,
    allemande et anglaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/700/EWG: Entscheidung der Kommission vom 1. Oktober 1982 zur Änderung
    der Entscheidung 82/467/EWG zur Ermächtigung mehrerer Mitgliedstaaten zum Verkauf
    von Butter zu herabgesetzten Preisen in Form von Butterreinfett (Nur der französische,
    deutsche und englische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/700/EØF: Kommissionens beslutning af 1. oktober 1982 om ændring af
    beslutning 82/467/EØF om bemyndigelse af medlemsstater til at sælge smør til
    nedsat pris i form af koncentreret smør (Kun den franske, tyske og engelske udgave
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/700/EOK: Απόφαση τής Επιτροπής τής 1ης Οκτωβρίου
    1982 περί τροποποιήσεως τής αποφάσεως 82/467/EOK
    πού επιτρέπει σέ ορισμένα Κράτη μέλη νά πωλούν
    τό βούτυρο υπό μορφή συμπυκνωμένου βουτύρου
    σέ μειωμένη τιμή (Τα κείμενα στην γαλλική, γερμανική,
    και αγγλική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/700/CEE: Decisione della Commissione, del 1 ottobre 1982, recante modifica
    della decisione 82/467/CEE, che autorizza alcuni Stati membri a vendere burro
    a prezzo ridotto sotto forma di burro concentrato (I testi in lingua francese,
    tedesca e inglese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '82/700/EEG: Beschikking van de Commissie van 1 oktober 1982 houdende wijziging
    van Beschikking 82/467/EEG tot machtiging van verschillende Lid-Staten om boter
    tegen verlaagde prijs in de vorm van boterconcentraat te verkopen (Slechts de
    teksten in de Franse, Duitse en de Engelse taal zijn authentiek)'
