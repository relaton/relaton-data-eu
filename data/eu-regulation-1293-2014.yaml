    métalliques destinés à l'application d'enduits intérieurs relevant de la norme
    harmonisée EN 13658-1, des lattis et cornières métalliques destinés à l'application
    d'enduits extérieurs relevant de la norme harmonisée EN 13658-2, ainsi que des
    cornières et profilés métalliques relevant de la norme harmonisée EN 14353,
    en ce qui concerne leurs caractéristiques de réaction au feu
  type: main
