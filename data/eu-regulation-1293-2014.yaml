  script: Latn
  content: Commission Delegated Regulation (EU) No 1293/2014 of 17 July 2014 on the
    conditions for classification, without testing, of metal lath and beads for internal
    plastering covered by the harmonised standard EN 13658-1, metal lath and beads
    for external rendering covered by the harmonised standard EN 13658-2 and metal
    beads and feature profiles covered by the harmonised standard EN 14353, with regard
    to their reaction to fire
  type: main
- language: fr
  script: Latn
