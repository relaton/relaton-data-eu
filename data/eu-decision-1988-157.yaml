title:
- language: en
  script: Latn
  content: '88/157/EEC: 88/157/EEC: Commission Decision of 25 January 1988 amending
    for the second time Decision 82/351/EEC recognizing certain parts of the territory
    of the Federal Republic of Germany as being officially swine fever free (Only
    the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/157/CEE: Décision de la Commission du 25 janvier 1988 modifiant pour
    la deuxième fois la décision 82/351/CEE reconnaissant certaines parties du territoire
    de la République fédérale d''Allemagne comme officiellement indemnes de peste
    porcine (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/157/EWG: Entscheidung der Kommission vom 25. Januar 1988 zur zweiten
    Änderung der Entscheidung 82/351/EWG, durch die bestimmte Teile des Hoheitsgebiets
    der Bundesrepublik Deutschland amtlich als schweinepestfrei anerkannt werden (Nur
    der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/157/EØF: Kommissionens beslutning af 25. januar 1988 om anden ændring
    af beslutning 82/351/EØF om godkendelse af visse dele af Forbundsrepublikken
    Tysklands område som værende officielt fri for svinepest (Kun den tyske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/157/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Ιανουαρίου 1988 που τροποποιεί για δεύτερη φορά
    την απόφαση 82/351/ΕΟΚ σχετικά με την αναγνώριση
    ορισμένων τμημάτων του εδάφους της Ομοσπονδιακής
    Δημοκρατίας της Γερμανίας ως επίσημα απαλλαγμένων
    από την πανώλη των χοίρων'
  type: main
- language: it
  script: Latn
  content: '88/157/CEE: Decisione della Commissione del 25 gennaio 1988 recante seconda
    modifica della decisione 82/351/CEE, con la quale talune parti del territorio
    della repubblica federale di Germania vengono riconosciute come ufficialmente
    indenni da peste suina (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/157/EEG: Beschikking van de Commissie van 25 januari 1988 houdende
