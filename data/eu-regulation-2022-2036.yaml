- language: en
  script: Latn
  content: Regulation (EU) 2022/2036 of the European Parliament and of the Council
    of 19 October 2022 amending Regulation (EU) No 575/2013 and Directive 2014/59/EU
    as regards the prudential treatment of global systemically important institutions
    with a multiple-point-of-entry resolution strategy and methods for the indirect
    subscription of instruments eligible for meeting the minimum requirement for own
    funds and eligible liabilities
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/2036 du Parlement européen et du Conseil du 19 octobre
    2022 modifiant le règlement (UE) no 575/2013 et la directive 2014/59/UE en ce
    qui concerne le traitement prudentiel des établissements d’importance systémique
    mondiale selon une stratégie de résolution à points d’entrée multiples et
    des méthodes pour la souscription indirecte d’instruments éligibles pour l’exigence
    minimale de fonds propres et d’engagements éligibles
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/2036 des Europäischen Parlaments und des Rates vom
    19. Oktober 2022 zur Änderung der Verordnung (EU) Nr. 575/2013 und der Richtlinie
    2014/59/EU im Hinblick auf die aufsichtliche Behandlung global systemrelevanter
    Institute mit einer multiplen Abwicklungsstrategie und auf Methoden für die indirekte
    Zeichnung von Instrumenten, die zur Erfüllung der Mindestanforderung an Eigenmittel
    und berücksichtigungsfähige Verbindlichkeiten berücksichtigungsfähig sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2022/2036 на Европейския парламент
    и на Съвета от 19 октомври 2022 година за изменение
    на Регламент (ЕС) № 575/2013 и Директива 2014/59/ЕС
    по отношение на пруденциалното третиране на
    глобални системно значими институции, които
    са обект на стратегия за преструктуриране
    с множество входни точки, и методи за непряко
    записване на инструменти, приемливи за покриване
    на минималното изискване за собствен капитал
    и приемливи задължения
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2022/2036 ze dne 19. října
    2022, kterým se mění nařízení (EU) č. 575/2013 a směrnice 2014/59/EU,
    pokud jde o obezřetnostní přístup ke globálním systémově významným institucím
    se strategií řešení krize ve více subjektech a metody nepřímého upisování
    nástrojů způsobilých pro splnění minimálního požadavku na kapitál a
    způsobilé závazky
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2022/2036 af 19. oktober
    2022 om ændring af forordning (EU) nr. 575/2013 og direktiv 2014/59/EU for så
    vidt angår den tilsynsmæssige behandling af globale systemisk vigtige institutter
    med en multiple-point-of-entry-afviklingsstrategi og metoder til indirekte tegning
    af instrumenter, der er nedskrivningsrelevante med henblik på at opfylde minimumskravet
    til kapitalgrundlag og nedskrivningsrelevante passiver
  type: main
- language: el
  script: Grek
