    siltä osin kuin on kyse usean kriisinratkaisuviranomaisen malliin perustuvan
    kriisinratkaisustrategian piiriin kuuluvien maailmanlaajuisten järjestelmän
    kannalta merkittävien laitosten vakavaraisuuskohtelusta ja omia varoja ja hyväksyttäviä
    velkoja koskevan vähimmäisvaatimuksen kattamiseen hyväksyttävien instrumenttien
    välilliseen merkitsemiseen käytettävistä menetelmistä
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2022/2036 ó Pharlaimint na hEorpa agus ón gComhairle
    an 19 Deireadh Fómhair 2022 lena leasaítear Rialachán (AE) Uimh. 575/2013 agus
    Treoir 2014/59/AE a mhéid a bhaineann le láimhseáil stuamachta institiúidí
    a bhfuil tábhacht shistéamach dhomhanda leo agus a bhfuil straitéis réitigh
    ilphointí iontrála acu mar aon le modhanna le haghaidh ionstraimí a shuibscríobh
    go hindíreach atá incháilithe chun an t-íoscheanglas maidir le cistí dílse
    agus dliteanais incháilithe a chomhlíonadh
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2022/2036 Europskog parlamenta i Vijeća od 19. listopada 2022.
    o izmjeni Uredbe (EU) br. 575/2013 i Direktive 2014/59/EU u pogledu bonitetnog
    tretmana globalnih sistemski važnih institucija sa strategijom sanacije s višestrukim
    točkama pristupanja i metoda za neizravni upis instrumenata prihvatljivih za
    ispunjenje minimalnog zahtjeva za regulatorni kapital i prihvatljive obveze
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2022/2036 rendelete (2022. október
    19.) az 575/2013/EU rendeletnek és a 2014/59/EU irányelvnek a több pontból
    kiinduló szanálási stratégiával rendelkező globálisan rendszerszinten jelentős
    intézmények prudenciális kezelése, valamint a szavatolótőkére és a leírható,
    illetve átalakítható kötelezettségekre vonatkozó minimumkövetelménynek
    való megfelelés szempontjából figyelembe vehető instrumentumok közvetett
    jegyzésére vonatkozó módszerek tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/2036 del Parlamento europeo e del Consiglio del 19
    ottobre 2022 che modifica il regolamento (UE) n. 575/2013 e la direttiva 2014/59/UE
    per quanto riguarda il trattamento prudenziale degli enti di importanza sistemica
    a livello mondiale con strategia di risoluzione a punto di avvio multiplo e metodi
    di sottoscrizione indiretta degli strumenti ammissibili per il soddisfacimento
    del requisito minimo di fondi propri e passività ammissibili
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2022/2036 (2022. gada 19. oktobris),
    ar ko groza Regulu (ES) Nr. 575/2013 un Direktīvu 2014/59/ES attiecībā uz prudenciālo
    režīmu globālām sistēmiski nozīmīgām iestādēm ar noregulējuma stratēģiju
    ar vairākām noregulējuma iestādēm un metodēm attiecībā uz netiešu parakstīšanos
    uz instrumentiem, kas ir atbilstīgi, lai izpildītu minimuma prasību pašu kapitālam
    un atbilstīgajām saistībām
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2022/2036 2022 m. spalio
    19 d. kuriuo iš dalies keičiamas Reglamentas (ES) Nr. 575/2013 ir Direktyva
    2014/59/ES, kiek tai susiję su prudencine tvarka, taikoma pasaulinės sisteminės
    svarbos įstaigoms, kurios laikosi vienalaikio grupės dalies pertvarkymo strategijos,
    ir minimaliam nuosavų lėšų ir tinkamų įsipareigojimų reikalavimui vykdyti
    tinkamų priemonių netiesioginio pasirašymo metodų
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2022/2036 tal-Parlament Ewropew u tal-Kunsill tad-19 ta’
    Ottubru 2022 li jemenda r-Regolament (UE) Nru 575/2013 u d-Direttiva 2014/59/UE
    fir-rigward tat-trattament prudenzjali ta’ istituzzjonijiet globali sistemikament
    importanti bi strateġija ta’ riżoluzzjoni b’punti multipli ta’ dħul u
    metodi għas-sottoskrizzjoni indiretta ta’ strumenti eliġibbli biex jissodisfaw
    ir-rekwiżit minimu għal fondi proprji u obbligazzjonijiet eliġibbli
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2022/2036 van het Europees Parlement en de Raad van 19
    oktober 2022 tot wijziging van Verordening (EU) nr. 575/2013 en Richtlijn 2014/59/EU
    wat betreft de prudentiële behandeling van mondiaal systeemrelevante instellingen
    met een multiple-point-of-entry-afwikkelingsstrategie en methoden voor de indirecte
    plaatsing van instrumenten die in aanmerking komen voor de naleving van het minimumvereiste
    voor eigen vermogen en in aanmerking komende passiva
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2022/2036 z dnia 19
    października 2022 r. w sprawie zmiany rozporządzenia (UE) nr 575/2013 i dyrektywy
    2014/59/UE w odniesieniu do traktowania ostrożnościowego instytucji globalnych
    o znaczeniu systemowym, które realizują strategię restrukturyzacji i uporządkowanej
    likwidacji wielu punktów kontaktowych oraz w odniesieniu do metod pośredniej
    subskrypcji instrumentów kwalifikujących się do spełnienia minimalnego wymogu
    w zakresie funduszy własnych i zobowiązań kwalifikowalnych
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2022/2036 do Parlamento Europeu e do Conselho de 19 de
    outubro de 2022 que altera o Regulamento (UE) n.o 575/2013 e a Diretiva 2014/59/UE
    no que diz respeito ao tratamento prudencial de instituições de importância
    sistémica global com uma estratégia de resolução de ponto de entrada múltiplo
    e a métodos para a subscrição indireta de instrumentos elegíveis para cumprimento
    do requisito mínimo de fundos próprios e passivos elegíveis
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2022/2036 al Parlamentului European și al Consiliului
    din 19 octombrie 2022 de modificare a Regulamentului (UE) nr. 575/2013 și a Directivei
    2014/59/UE în ceea ce privește tratamentul prudențial al instituțiilor de
    importanță sistemică globală, cu o strategie de rezoluție cu mai multe puncte
    de intrare, și metode pentru subscrierea indirectă de instrumente eligibile
    în vederea îndeplinirii cerinței minime de fonduri proprii și datorii eligibile
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2022/2036 z 19. októbra
    2022, ktorým sa mení nariadenie (EÚ) č. 575/2013 a smernica 2014/59/EÚ, pokiaľ
    ide o prudenciálne zaobchádzanie s globálnymi systémovo významnými inštitúciami
    so stratégiou riešenia krízových situácií vo viacerých okamihoch a metódy
    nepriameho upisovania nástrojov oprávnených na splnenie minimálnej požiadavky
    na vlastné zdroje a oprávnené záväzky
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2022/2036 Evropskega parlamenta in Sveta z dne 19. oktobra
    2022 o spremembi Uredbe (EU) št. 575/2013 in Direktive 2014/59/EU v zvezi z bonitetno
    obravnavo globalnih sistemsko pomembnih institucij s strategijo reševanja z več
    vstopnimi točkami in metodami za posredni vpis instrumentov, primernih za izpolnjevanje
    minimalne zahteve glede kapitala in kvalificiranih obveznosti
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2022/2036 del Parlamento Europeo y del Consejo de 19 de
    octubre de 2022 por el que se modifican el Reglamento (UE) n.o 575/2013 y la Directiva
    2014/59/UE en lo que respecta al tratamiento prudencial de entidades de importancia
    sistémica mundial con una estrategia de resolución basada en una activación
    múltiple y métodos para la suscripción indirecta de instrumentos admisibles
    de cara a cumplir el requisito mínimo de fondos propios y pasivos admisibles
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2022/2036 av den 19 oktober
    2022 om ändring av förordning (EU) nr 575/2013 och direktiv 2014/59/EU vad gäller
    tillsynsbehandlingen av globala systemviktiga institut med en resolutionsstrategi
    med flera ingångspunkter och metoder för den indirekta teckningen av instrument
    som är kvalificerade för att uppfylla minimikravet för kapitalbas och kvalificerade
    skulder
  type: main
