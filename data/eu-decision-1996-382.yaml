title:
- language: en
  script: Latn
  content: '96/382/EC: Council Decision of 10 June 1996 on the conclusion of the Agreement
    in the form of an Exchange of Letters concerning the provisional application of
    the Protocol establishing, for the period from 1 January 1996 to 31 December 1997,
    the fishing rights and financial compensation provided for in the Agreement between
    the European Economic Community and the Government of the Republic of Guinea on
    fishing off the Guinean coast'
  type: main
- language: fr
  script: Latn
  content: '96/382/CE: Décision du Conseil du 10 juin 1996 concernant la conclusion
