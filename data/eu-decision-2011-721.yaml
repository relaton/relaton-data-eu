    koskevan poikkeuksen myöntämisestä vesien suojelemisesta maataloudesta peräisin
    olevien nitraattien aiheuttamalta pilaantumiselta annetun neuvoston direktiivin
    91/676/ETY mukaisesti (tiedoksiannettu numerolla K(2011) 7770)
  type: main
- language: hu
  script: Latn
  content: A Bizottság végrehajtási határozata ( 2011. november 3. ) az Olaszország
