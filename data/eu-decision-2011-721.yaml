title:
- language: en
  script: Latn
  content: Commission Implementing Decision of 3 November 2011 on granting a derogation
    requested by Italy with regard to the Regions of Emilia Romagna, Lombardia, Piemonte
    and Veneto pursuant to Council Directive 91/676/EEC concerning the protection
    of waters against pollution caused by nitrates from agricultural sources (notified
    under document C(2011) 7770)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution de la Commission du 3 novembre 2011 accordant
    à l’Italie une dérogation demandée, pour les régions d’Émilie-Romagne,
    de Lombardie, du Piémont et de Vénétie, en application de la directive 91/676/CEE
    du Conseil concernant la protection des eaux contre la pollution par les nitrates
    à partir de sources agricoles [notifiée sous le numéro C(2011) 7770]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss der Kommission vom 3. November 2011 zur Genehmigung
    eines Antrags Italiens auf eine Ausnahmeregelung betreffend die Regionen Emilia-Romagna,
    Lombardei, Piemont und Venetien gemäß der Richtlinie 91/676/EWG des Rates zum
    Schutz der Gewässer vor Verunreinigung durch Nitrate aus landwirtschaftlichen
    Quellen (Bekannt gegeben unter Aktenzeichen K(2011) 7770)
  type: main
- language: bg
  script: Cyrl
