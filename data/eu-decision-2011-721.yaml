    de bescherming van water tegen verontreiniging door nitraten uit agrarische bronnen
    (Kennisgeving geschied onder nummer C(2011) 7770)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji z dnia 3 listopada 2011 r. przyznająca Włochom
