    kért eltérésnek a vizek mezőgazdasági eredetű nitrátszennyezéssel szembeni
    védelméről szóló 91/676/EGK tanácsi irányelv alapján való engedélyezéséről
    (az értesítés a C(2011) 7770. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione della Commissione, del 3 novembre 2011 , che concede
    una deroga richiesta dall’Italia con riguardo alle regioni Emilia-Romagna, Lombardia,
    Piemonte e Veneto a norma della direttiva 91/676/CEE del Consiglio relativa alla
    protezione delle acque dall’inquinamento provocato dai nitrati provenienti da
    fonti agricole [notificata con il numero C(2011) 7770]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums ( 2011. gada 3. novembris ) par to, lai
    Itālijai attiecībā uz Emīlijas Romanjas, Lombardijas, Pjemontas un Veneto
    reģionu piešķirtu atkāpi, ko tā pieprasījusi atbilstīgi Padomes Direktīvai
    91/676/EEK attiecībā uz ūdeņu aizsardzību pret piesārņojumu, ko rada lauksaimnieciskas
    izcelsmes nitrāti (izziņots ar dokumenta numuru C(2011) 7770)
  type: main
- language: lt
  script: Latn
  content: 2011 m. lapkričio 3 d. Komisijos įgyvendinimo sprendimas, kuriuo pagal
