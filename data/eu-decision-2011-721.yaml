    žemės ūkio šaltinių Italijai suteikiamas jos prašomas leidimas Emilijos-Romanijos,
    Lombardijos, Pjemonto ir Veneto regionuose taikyti leidžiančią nukrypti nuostatą
    (pranešta dokumentu Nr. C(2011) 7770)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tat- 3 ta’ Novembru
