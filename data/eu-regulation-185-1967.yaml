- language: fr
  script: Latn
  content: Règlement no 185/67/CEE de la Commission, du 28 juin 1967, déterminant
    les montants des éléments mobiles applicables pendant le troisième trimestre
    de l'année 1967 à l'importation dans les États membres des marchandises auxquelles
    s'applique le règlement n 160/66/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 185/67/EWG der Kommission vom 28. Juni 1967 zur Festsetzung
    der Höhe der im dritten Trimester 1967 bei der Einfuhr der unter die Verordnung
    Nr. 160/66/EWG des Rates fallenden Waren in die Mitgliedstaaten anwendbaren beweglichen
    Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento n. 185/67/CEE della Commissione, del 28 giugno 1967, che determina
