  script: Latn
  content: Verordnung (EWG) Nr. 587/79 des Rates vom 26. März 1979 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für Schiffe
    unter norwegischer Flagge für 1979
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 587/79 af 26. marts 1979 om fastsættelse
