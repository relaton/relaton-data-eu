    en précisant davantage les détails des informations statistiques à fournir
    par les autorités fiscales et douanières, et modifiant ses annexes V et VI
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1704 der Kommission vom 14. Juli 2021 zur
