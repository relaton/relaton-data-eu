    tím, že se blíže určují podrobnosti ohledně statistických informací,
    které mají poskytovat správci daně a celní orgány, a kterým se mění přílohy
    V a VI uvedeného nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1704 af 14. juli 2021 om
