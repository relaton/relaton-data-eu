    estatísticas a fornecer pelas autoridades fiscais e aduaneiras e que altera os
    seus anexos V e VI
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1704 al Comisiei din 14 iulie 2021 de completare
