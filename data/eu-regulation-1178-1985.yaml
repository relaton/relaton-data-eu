title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1178/85 of 6 May 1985 re-establishing the
    levying of customs duties on artificial flowers, foliage or fruit and parts thereof,
    falling within heading No 67.02, originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1178/85 de la Commission du 6 mai 1985 portant rétablissement
    de la perception des droits de douane applicables aux fleurs, feuillages et fruits
    artificiels et leurs parties, de la position 67.02 du tarif douanier commun, originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1178/85 der Kommission vom 6. Mai 1985 zur Wiedereinführung
    der Erhebung der Zölle für künstliches Blattwerk, künstliche Blumen und Früchte
    sowie Teile davon der Tarifnummer 67.02 mit Ursprung in Hongkong, dem die in der
    Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1178/85 af 6. maj 1985 om genindførelse
    af opkrævning af told for kunstige blomster, blade og frugter samt dele deraf
    henhørende under pos. 67.02 og med oprindelse i Hongkong, som præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1178/85 της Επιτροπής
    της 6ης Μαΐου 1985 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για τα άνθη, φυλλώματα και
    καρπούς, τεχνητά, και τα μέρη τούτων, της κλάσεως
    67.02 του Κοινού Δασμολογίου, καταγωγής Χονγκ
    Κονγκ, δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1178/85 della Commissione del 6 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili ai fiori, foglie e frutti artificiali
    e loro parti della voce 67.02 della tariffa doganale comune, originari di Hong
    Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n.
    3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1178/85 van de Commissie van 6 mei 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kunstbloemen,
    kunstloofwerk en kunstvruchten, alsmede delen daarvan, van tariefpost 67.02, van
    oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
