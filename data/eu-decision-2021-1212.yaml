    e il tracciamento dei contatti delle persone esposte identificate nel contesto
    della compilazione dei moduli di localizzazione dei passeggeri
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/1212 (2021. gada 22. jūlijs),
