    űrlapok kitöltése nyomán azonosított, fertőzésnek kitett személyek kontaktkövetése
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1212 della Commissione del 22 luglio
    2021 che modifica la decisione di esecuzione (UE) 2017/253 per quanto riguarda
