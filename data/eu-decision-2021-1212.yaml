    fir-rigward ta’ twissijiet skattati minn theddid transkonfinali serju għas-saħħa
    u għat-traċċar tal-kuntatti ta’ persuni esposti identifikati fil-kuntest
    tal-mili tal-Formoli tal-Lokalizzazzjoni tal-Passiġġieri
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/1212 van de Commissie van 22 juli 2021 tot
    wijziging van Uitvoeringsbesluit (EU) 2017/253 wat betreft alarmmeldingen als
    gevolg van ernstige grensoverschrijdende bedreigingen van de gezondheid en voor
    de opsporing van contacten van blootgestelde personen die zijn geïdentificeerd
    met behulp van traceringsformulieren voor passagiers
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/1212 z dnia 22 lipca 2021 r. zmieniająca
    decyzję wykonawczą (UE) 2017/253 w odniesieniu do ostrzeżeń uruchamianych
    w związku z poważnymi transgranicznymi zagrożeniami zdrowia oraz na potrzeby
    ustalania kontaktów zakaźnych osób narażonych zidentyfikowanych na podstawie
    kart lokalizacji pasażera
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1212 da Comissão de 22 de julho de 2021
    que altera a Decisão de Execução (UE) 2017/253 no que diz respeito aos alertas
    desencadeados por ameaças sanitárias transfronteiriças graves e ao rastreio
    dos contactos de pessoas expostas identificadas no contexto do preenchimento de
    formulários de localização de passageiros
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1212 a Comisiei din 22 iulie 2021
    de modificare a Deciziei de punere în aplicare (UE) 2017/253 în ceea ce privește
    alertele declanșate de amenințări transfrontaliere grave pentru sănătate
    și în vederea depistării contacților persoanelor expuse identificate în contextul
    completării formularelor de localizare a pasagerilor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1212 z 22. júla 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2017/253, pokiaľ ide o varovania vydávané
    v dôsledku závažných cezhraničných ohrození zdravia a vyhľadávanie kontaktov
    vystavených osôb identifikovaných v súvislosti s vyplňovaním formulárov
    na vyhľadanie cestujúceho
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1212 z dne 22. julija 2021 o spremembi
