    za zdravje in za sledenje stikom z izpostavljenimi osebami, identificiranimi prek
    izpolnitve obrazcev za lokalizacijo potnikov
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/1212 de la Comisión de 22 de julio de
    2021 por la que se modifica la Decisión de Ejecución (UE) 2017/253 en lo que
    respecta a las alertas activadas por amenazas transfronterizas graves para la
    salud y al rastreo de contactos de las personas expuestas detectadas en el contexto
    de la cumplimentación de formularios de localización de pasajeros
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/1212 av den 22 juli 2021 om
    ändring av genomförandebeslut (EU) 2017/253 vad gäller varningar som utlösts
    av allvarliga gränsöverskridande hot mot människors hälsa och för kontaktspårning
