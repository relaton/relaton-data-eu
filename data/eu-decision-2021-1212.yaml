title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1212 of 22 July 2021 amending
    Implementing Decision (EU) 2017/253 as regards alerts triggered by serious cross-border
    threats to health and for the contact tracing of exposed persons identified in
    the context of the completion of Passenger Locator Forms
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1212 de la Commission du 22 juillet
    2021 modifiant la décision d’exécution (UE) 2017/253 en ce qui concerne les
    alertes déclenchées par des menaces transfrontières graves pour la santé et
    la recherche des contacts de personnes exposées identifiées dans le cadre du
    remplissage de formulaires de localisation des passagers
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1212 der Kommission vom 22. Juli 2021
    zur Änderung des Durchführungsbeschlusses (EU) 2017/253 in Bezug auf durch schwerwiegende
    grenzüberschreitende Gesundheitsgefahren ausgelöste Warnmeldungen und zur Kontaktnachverfolgung
    im Zusammenhang mit dem Ausfüllen von Reiseformularen ermittelter exponierter
    Personen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2021/1212 на Комисията
    от 22 юли 2021 година за изменение на Решение за
    изпълнение (ЕС) 2017/253 по отношение на сигнали,
    задействани във връзка със сериозни трансгранични
    заплахи за здравето, и за проследяване на контактите
    на изложените на риск лица, идентифицирани
    при попълване на формуляри за локализиране
    на пътници
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1212 ze dne 22. července 2021,
    kterým se mění prováděcí rozhodnutí (EU) 2017/253, pokud jde o varovná
    hlášení v souvislosti s vážnými přeshraničními zdravotními hrozbami
    a trasování kontaktů osob vystavených nákaze zjištěných v souvislosti
    s vyplňováním formulářů pro trasování cestujících
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/1212 af 22. juli 2021
