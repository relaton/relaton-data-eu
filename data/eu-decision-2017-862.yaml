---
id: EUDecision2017862
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/862 of 17 May 2017 laying down
    the animal health and veterinary certification conditions for the re-entry of
    registered horses for competition after temporary export to Turkmenistan, amending
    Annex I to Decision 93/195/EEC as regards the entry for Turkmenistan and amending
    Annex I to Decision 2004/211/EC as regards the entry for Turkmenistan in the list
    of third countries and parts thereof from which imports into the Union of live
    equidae and semen, ova and embryos of the equine species are authorised (notified
    under document C(2017) 3207)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/862 de la Commission du 17 mai 2017 établissant
    les conditions sanitaires et la certification sanitaire requises pour la réadmission
    de chevaux enregistrés en vue de la compétition après leur exportation temporaire
    au Turkménistan, modifiant l'annexe I de la décision 93/195/CEE en ce qui concerne
    l'inscription du Turkménistan et modifiant l'annexe I de la décision 2004/211/CE
    en ce qui concerne l'entrée relative au Turkménistan dans la liste des pays
    tiers et des parties de ces pays en provenance desquels les importations dans
    l'Union européenne d'équidés vivants et de sperme, d'ovules et d'embryons de
    l'espèce équine sont autorisées [notifiée sous le numéro C(2017) 3207]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/862 der Kommission vom 17. Mai 2017 mit
    den Bedingungen für die Tiergesundheit und die Veterinärbescheinigungen für
    die Wiedereinfuhr von registrierten Turnierpferden nach vorübergehender Ausfuhr
    nach Turkmenistan, zur Änderung von Anhang I der Entscheidung 93/195/EWG hinsichtlich
    des Eintrags für Turkmenistan und zur Änderung von Anhang I der Entscheidung
    2004/211/EG hinsichtlich des Eintrags für Turkmenistan in der Liste von Drittländern
    und Teilen von Drittländern, aus denen die Einfuhr von lebenden Equiden sowie
    von Equidensperma, -eizellen und -embryonen in die Union zugelassen ist (Bekannt
    gegeben unter Aktenzeichen C(2017) 3207)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/862 на Комисията
    от 17 май 2017 година за определяне на ветеринарно-санитарните
    условия и условията за ветеринарно сертифициране
    при повторното въвеждане на регистрирани коне
    за спортни състезания след временен износ
    в Туркменистан, за изменение на приложение
    I към Решение 93/195/ЕИО по отношение на вписването
    за Туркменистан и за изменение на приложение
    I към Решение 2004/211/ЕО по отношение на вписването
    за Туркменистан в списъка на трети държави
    и части от тях, от които е разрешен вносът в
    Съюза на живи еднокопитни и сперма, яйцеклетки
    и ембриони от еднокопитни животни (нотифицирано
    под номер С(2017) 3207)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/862 ze dne 17. května 2017,
    kterým se stanoví veterinární podmínky a veterinární osvědčení pro zpětný
    dovoz evidovaných koní určených pro soutěže po jejich dočasném vývozu
    do Turkmenistánu, kterým se mění příloha I rozhodnutí 93/195/EHS, pokud
    jde o položku pro Turkmenistán, a kterým se mění příloha I rozhodnutí
    2004/211/ES, pokud jde o položku pro Turkmenistán na seznamu třetích zemí
    a jejich částí, ze kterých je povolen dovoz živých koňovitých a spermatu,
    vajíček a embryí druhů koňovitých do Unie (oznámeno pod číslem C(2017)
    3207)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/862 af 17. maj 2017 om
    fastlæggelse af dyresundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved genindførsel af heste, der er registreret med henblik på konkurrencer, efter
    midlertidig udførsel til Turkmenistan, om ændring af bilag I til beslutning
    93/195/EØF for så vidt angår oplysninger om Turkmenistan og om ændring af
    bilag I til beslutning 2004/211/EF for så vidt angår oplysninger om Turkmenistan
    i listen over tredjelande og dele deraf, hvorfra import til Unionen af levende
    dyr af hestefamilien samt sæd, æg og embryoner fra dyr af hestefamilien tillades
    (meddelt under nummer C(2017) 3207)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/862 της Επιτροπής,
    της 17ης Μαΐου 2017, για τους υγειονομικούς όρους
    και την υγειονομική πιστοποίηση που απαιτούνται
    για την επανείσοδο εγγεγραμμένων ίππων προοριζόμενων
    για διαγωνισμούς ύστερα από προσωρινή εξαγωγή
    στο Τουρκμενιστάν, για την τροποποίηση του
    παραρτήματος I της απόφασης 93/195/ΕΟΚ ως προς
    την καταχώριση του Τουρκμενιστάν και για την
    τροποποίηση του παραρτήματος I της απόφασης
    2004/211/ΕΚ ως προς την καταχώριση του Τουρκμενιστάν
    στον κατάλογο των τρίτων χωρών και των περιοχών
    τους από τις οποίες εγκρίνονται εισαγωγές
    ζώντων ιπποειδών και σπέρματος, ωαρίων και
    εμβρύων ιπποειδών στην Ένωση [κοινοποιηθείσα
    υπό τον αριθμό C(2017) 3207]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/862, 17. mai 2017, millega kehtestatakse
    nõuded loomatervishoiu ja veterinaarsertifikaatide kohta registreeritud hobuste
    taassisenemiseks pärast võistlustest tulenevat ajutist eksporti Türkmenistani,
    millega muudetakse otsuse 93/195/EMÜ I lisa seoses Türkmenistani käsitleva
    kandega ning otsuse 2004/211/EÜ I lisa seoses Türkmenistani käsitleva kandega
    selliste kolmandate riikide ja nende osade loetelus, millest on lubatud importida
    liitu elushobuslasi ning hobuslaste spermat, munarakke ja embrüoid (teatavaks
    tehtud numbri C(2017) 3207 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/862, annettu 17 päivänä
    toukokuuta 2017, eläinten terveyttä ja eläinlääkärintodistuksia koskevista
    vaatimuksista rekisteröityjen hevosten takaisintuonnissa kilpailuja varten tapahtuneen
    tilapäisen Turkmenistaniin viennin jälkeen, päätöksen 93/195/ETY liitteen
    I muuttamisesta Turkmenistania koskevan kohdan osalta ja päätöksen 2004/211/EY
    liitteen I muuttamisesta Turkmenistania koskevan kohdan osalta niiden kolmansien
    maiden ja kolmansien maiden osien luettelossa, joista elävien hevoseläinten
    ja hevoseläinten siemennesteen, munasolujen ja alkioiden tuonti unioniin on sallittua
    (tiedoksiannettu numerolla C(2017) 3207)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/862 оd 17. svibnja 2017. o utvrđivanju
    uvjeta u pogledu zdravlja životinja i veterinarskog certificiranja za ponovni
    ulazak registriranih konja za natjecanja nakon privremenog izvoza u Turkmenistan,
    o izmjeni Priloga I. Odluci 93/195/EEZ u pogledu unosa za Turkmenistan i o izmjeni
    Priloga I. Odluci 2004/211/EZ u pogledu unosa za Turkmenistan na popisu trećih
    zemalja i njihovih dijelova iz kojih je dopušten uvoz u Uniju živih kopitara
    i sjemena, jajnih stanica i zametaka kopitara (priopćeno pod brojem dokumenta
    C(2017) 3207)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/862 végrehajtási határozata (2017. május 17.)
    a versenyre szánt törzskönyvezett lovak Türkmenisztánba történő ideiglenes
    kivitele utáni újrabehozatalára vonatkozó állategészségügyi feltételek
    és állategészségügyi bizonyítványokra vonatkozó feltételek megállapításáról,
    a 93/195/EGK határozat I. melléklete Türkmenisztánra vonatkozó bejegyzésének
    módosításáról, valamint a 2004/211/EK határozat I. mellékletének az élő
    lófélék, valamint a lófélék spermájának, petesejtjeinek és embrióinak
    az Unióba történő behozatalára feljogosított harmadik országok és azok
    részei jegyzékében a Türkmenisztánra vonatkozó bejegyzés módosításáról
    (az értesítés a C(2017) 3207. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/862 della Commissione, del 17 maggio
    2017, che stabilisce le condizioni di polizia sanitaria e di certificazione veterinaria
    cui è subordinata la reintroduzione di cavalli registrati per competizioni dopo
    un'esportazione temporanea in Turkmenistan, che modifica l'allegato I della decisione
    93/195/CEE per quanto concerne la voce relativa al Turkmenistan e l'allegato I
    della decisione 2004/211/CE per quanto concerne la voce relativa al Turkmenistan
    nell'elenco dei paesi terzi e delle parti di paesi terzi da cui sono autorizzate
    le importazioni nell'Unione di equidi vivi nonché di sperma, ovuli ed embrioni
    della specie equina [notificata con il numero C(2017) 3207]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/862 (2017. gada 17. maijs), ar
    ko nosaka dzīvnieku veselības un veterinārās sertifikācijas nosacījumus
    sacensībām paredzētu reģistrētu zirgu atpakaļievešanai pēc pagaidu izvešanas
    uz Turkmenistānu, Lēmuma 93/195/EEK I pielikumu groza attiecībā uz ierakstu
    par Turkmenistānu un Lēmuma 2004/211/EK I pielikumu groza attiecībā uz ierakstu
    par Turkmenistānu to trešo valstu un to daļu sarakstā, no kurām Savienībā
    atļauts importēt dzīvus zirgu dzimtas dzīvniekus un to spermu, olšūnas un
    embrijus (izziņots ar dokumenta numuru C(2017) 3207)
  type: main
- language: lt
  script: Latn
  content: 2017 m. gegužės 17 d. Komisijos įgyvendinimo sprendimas (ES) 2017/862,
    kuriuo nustatomi gyvūnų sveikatos reikalavimai ir veterinarinio sertifikavimo
    sąlygos, taikytini pakartotinai įvežant registruotus arklius varžyboms po
    jų laikino eksporto į Turkmėnistaną, dėl Turkmėnistano įrašo iš dalies
    keičiamas Sprendimo 93/195/EEB I priedas ir dėl Turkmėnistano įrašo trečiųjų
    šalių ir jų teritorijų, iš kurių į Sąjungą leidžiama importuoti gyvus
    arklinių šeimos gyvūnus ir arklių rūšių spermą, kiaušialąstes ir embrionus,
    sąraše iš dalies keičiamas Sprendimo 2004/211/EB I priedas (pranešta dokumentu
    Nr. C(2017) 3207)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/862 tas-17 ta'
    Mejju 2017 li tistabbilixxi l-kundizzjonijiet għas-saħħa tal-annimali u ċ-ċertifikazzjoni
    veterinarja għad-dħul mill-ġdid ta' żwiemel reġistrati għall-kompetizzjoni
    wara esportazzjoni temporanja lejn it-Turkmenistan, li temenda l-Anness I tad-Deċiżjoni
    93/195/KEE fir-rigward tal-entrata tat-Turkmenistan u li temenda l-Anness I tad-Deċiżjoni
    2004/211/KE fir-rigward tal-entrata tat-Turkmenistan fil-lista ta' pajjiżi terzi
    u partijiet minnhom minn fejn huma awtorizzati l-importazzjonijiet fl-Unjoni ta'
    ekwidi ħajjin u ta' semen, ova u embrijuni tal-ispeċi ekwina (notifikata bid-dokument
    C(2017) 3207)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/862 van de Commissie van 17 mei 2017 tot vastlegging
    van de veterinairrechtelijke voorschriften en veterinaire certificeringvoorwaarden
    voor het opnieuw binnenbrengen van voor wedstrijden geregistreerde paarden na
    tijdelijke uitvoer naar Turkmenistan, tot wijziging van bijlage I bij Beschikking
    93/195/EEG wat betreft de vermelding voor Turkmenistan en tot wijziging van bijlage
    I bij Beschikking 2004/211/EG wat betreft de vermelding voor Turkmenistan in de
    lijst van derde landen en delen daarvan waaruit levende paardachtigen en sperma,
    eicellen en embryo's van paarden in de Unie mogen worden ingevoerd (Kennisgeving
    geschied onder nummer C(2017) 3207)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/862 z dnia 17 maja 2017 r. ustanawiająca
    warunki dotyczące zdrowia zwierząt i świadectw weterynaryjnych przy powrotnym
    wwozie zarejestrowanych koni biorących udział w zawodach po wywozie czasowym
    do Turkmenistanu, zmieniająca załącznik I do decyzji 93/195/EWG w odniesieniu
    do wpisu dotyczącego Turkmenistanu i zmieniająca załącznik I do decyzji 2004/211/WE
    w odniesieniu do wpisu dotyczącego Turkmenistanu w wykazie państw trzecich oraz
    części ich terytoriów, z których dozwolony jest przywóz do Unii żywych zwierząt
    z rodziny koniowatych oraz nasienia, komórek jajowych i zarodków koni (notyfikowana
    jako dokument nr C(2017) 3207)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/862 da Comissão, de 17 de maio de 2017,
    que estabelece as condições sanitárias e de certificação veterinária para
    a reentrada de cavalos registados para concursos após exportação temporária
    para o Turquemenistão, que altera o anexo I da Decisão 93/195/CEE no que diz
    respeito à entrada relativa ao Turquemenistão e que altera o anexo I da Decisão
    2004/211/CE no que diz respeito à entrada relativa ao Turquemenistão na lista
    de países terceiros e partes de países terceiros a partir dos quais são autorizadas
    as importações para a União de equídeos vivos e de sémen, óvulos e embriões
    de equídeos [notificada com o número C(2017) 3207]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/862 a Comisiei din 17 mai 2017
    de stabilire a condițiilor de sănătate animală și de certificare veterinară
    pentru reintroducerea cailor înregistrați pentru competiții după exportul
    temporar în Turkmenistan, de modificare a anexei I la Decizia 93/195/CEE în
    ceea ce privește rubrica referitoare la Turkmenistan și de modificare a anexei
    I la Decizia 2004/211/CE în ceea ce privește rubrica referitoare la Turkmenistan
    din lista țărilor terțe și a regiunilor acestora din care sunt autorizate
    importurile în Uniune de ecvidee vii și de material seminal, de ovule și de
    embrioni din specia ecvină [notificată cu numărul C(2017) 3207]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/862 zo 17. mája 2017, ktorým
    sa stanovujú požiadavky na zdravie zvierat a podmienky veterinárnej certifikácie
    pri opätovnom vstupe registrovaných koní určených na súťaže po dočasnom
    vývoze do Turkménska a ktorým sa mení príloha I k rozhodnutiu 93/195/EHS,
    pokiaľ ide o zápis týkajúci sa Turkménska, a príloha I k rozhodnutiu 2004/211/ES,
    pokiaľ ide o zápis týkajúci sa Turkménska v zozname tretích krajín a častí
    ich územia, z ktorých je povolený dovoz živých zvierat koňovitých a ich
    spermy, oocytov a embryí do Únie [oznámené pod číslom C(2017) 3207]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/862 z dne 17. maja 2017 o določitvi
    pogojev v zvezi z zdravstvenim varstvom živali in izdajanjem veterinarskih spričeval
    za ponovni vstop registriranih konjev za tekmovanja po začasnem izvozu v Turkmenistan,
    o spremembi Priloge I k Odločbi 93/195/EGS glede vnosa za Turkmenistan in spremembi
    Priloge I k Odločbi 2004/211/ES glede vnosa za Turkmenistan na seznamu tretjih
    držav in njihovih delov, iz katerih je dovoljen uvoz živih enoprstih kopitarjev
    ter njihovega semena, jajčnih celic in zarodkov v Unijo (notificirano pod dokumentarno
    številko C(2017) 3207)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/862 de la Comisión, de 17 de mayo de
    2017, que establece las condiciones zoosanitarias y de certificación veterinaria
    necesarias para la reintroducción de caballos registrados para participar en
    concursos hípicos después de su exportación temporal a Turkmenistán, modifica
    el anexo I de la Decisión 93/195/CEE en lo relativo a la entrada correspondiente
    a Turkmenistán y modifica el anexo I de la Decisión 2004/211/CE en lo relativo
    a la entrada correspondiente a Turkmenistán en la lista de terceros países y
    partes de los mismos desde los que se autorizan importaciones a la Unión de équidos
    vivos y su esperma, sus óvulos y sus embriones [notificada con el número C(2017)
    3207]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/862 av den 17 maj 2017 om djurhälsovillkor
    och villkor för utfärdande av veterinärintyg för återinförsel av hästar
    som registrerats för tävlingar efter tillfällig export till Turkmenistan, om
    ändring av bilaga I till beslut 93/195/EEG vad gäller uppgifterna om Turkmenistan
    och om ändring av bilaga I till beslut 2004/211/EG vad gäller uppgifterna om
    Turkmenistan i förteckningen över tredjeländer och delar av tredjeländer från
    vilka import till unionen av levande hästdjur och sperma, ägg och embryon från
    hästdjur är tillåten [delgivet med nr C(2017) 3207]
  type: main
