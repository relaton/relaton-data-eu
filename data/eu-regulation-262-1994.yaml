    quotas and ceilings for certain agricultural and industrial products and establishing
    a reduced variable component for certain processed agricultural products originating
    in Hungary, Poland and the territory of the former Czech and Slovak Federal Republic
    (CSFR)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 262/94 du Conseil du 24 janvier 1994 modifiant le règlement
