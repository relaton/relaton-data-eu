title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 963/76 of 27 April 1976 re-establishing
    the levying of customs duties on methylamine and di- and trimethylamine, and their
    salts, falling within subheading 29.22 A I, originating in Romania to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3010/75
    of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 963/76 de la Commission, du 27 avril 1976, portant
    rétablissement de la perception des droits de douane applicables à la mono-,
    di- et triméthylamine, et leurs sels, de la sous-position tarifaire 29.22 A I,
    originaires de la Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 963/76 der Kommission vom 27. April 1976 zur Wiedereinführung
    des Zollsatzes für Mono-, Di- und Trimethylamin und ihre Salze, der Tarifstelle
    29.22 A I, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 963/76 af 27. april 1976 om genindførelse
    af opkrævning af toldafgifter for mono- di- og trimethylamin samt salte deraf,
    under underposition 29.22 A I, som har oprindelse i Rumænien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17.
    november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 963/76 della Commissione, del 27 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili alla mono-, di- e trimetilammina,
    e loro sali, della sottovoce doganale n. 29.22 A I originari della Romania beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 963/76 van de Commissie van 27 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op monomethylamine,
    dimethylamine en trimethylamine, alsmede zouten daarvan, van onderverdeling 29.22
    A I, van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening (EEG) nr.
    3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
