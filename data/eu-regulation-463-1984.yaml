title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 463/84 of 22 February 1984 re-establishing
    the levying of customs duties on certain babies' knitted outer garments, products
    of category 71 (code 0710), originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 463/84 de la Commission du 22 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    vêtements de dessus de bonneterie pour bébés, de la catégorie 71 (code 0710),
    originaires de Thaïlande, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 463/84 der Kommission vom 22. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Oberkleidung für Säuglinge,
    gewirkt, der Warenkategorie Nr. 71 (Kennziffer 0710), mit Ursprung in Thailand,
    dem die in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 463/84 af 22. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte yderbeklædningsgenstande af trikotage,
    til spædbørn under varekategori nr. 71 (kode 0710), som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 463/84 της Επιτροπής
    της 22ας Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    εξωτερικά ενδύματα, πλεκτά, για βρέφη, προϊόντα
    της κατηγορίας 71 (κωδικός 0710), καταγωγής Ταϋλάνδης,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 463/84 della Commissione del 22 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti esterni,
    a maglia, per bambini, della categoria di prodotti n. 71 (codice 0710), originari
    della Tailandia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 463/84 van de Commissie van 22 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    bovenkleding van brei- of haakwerk, voor baby' s, van de categorie van produkten
    nr. 71 (codenummer 0710), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
