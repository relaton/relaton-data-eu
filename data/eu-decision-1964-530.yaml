title:
- language: fr
  script: Latn
  content: Décision 64/530/CEE du Conseil du 22 septembre 1964, portant prorogation
    de l'autorisation donnée le 16 juillet 1964, à la République italienne de suspendre
    à l'égard des pays tiers ses droits applicables aux animaux vivants de l'espèce
    bovine, des espèces domestiques, autres, d'un poids unitaire n'excédant par
    340 kilogrammes, de la position 01.02 A II
  type: main
- language: de
  script: Latn
  content: '64/530/EWG: Entscheidung des Rates vom 22. September 1964 zur Verlängerung
    der der Italienischen Republik am 16. Juli 1964 erteilten Ermächtigung, die Zollsätze
    auf Rinder, lebend, Hausrinder, andere, mit einem Stückgewicht von höchstens
    340 Kilogramm, der Tarifnummer ex 01.02 A II, gegenüber Drittländern auszusetzen'
  type: main
- language: it
  script: Latn
  content: '64/530/CEE: Decisione del Consiglio, del 22 settembre 1964, che proroga
    l''autorizzazione, concessa alla Repubblica italiana il 16 luglio 1964, a sospendere,
    nei confronti dei paesi terzi, i dazi applicabili agli animali vivi della specie
    bovina, delle specie domestiche, altri, del peso unitario non superiore a 340
    kg, della voce ex 01.02 A II'
  type: main
- language: nl
  script: Latn
  content: '64/530/EEG: Beschikking van de Raad van 22 september 1964 tot verlenging
    van de op 16 juli 1964 aan de Italiaanse Republiek verleende machtiging om haar
    rechten op levende runderen, huisdieren, andere, die per stuk niet meer wegen
    dan 340 kilogram, van post ex 01.02 A II, ten aanzien van derde landen te schorsen'
  type: main
