  script: Latn
  content: Commission Regulation (EEC) No 2088/76 of 24 August 1976 amending for the
    eighth time Regulation (EEC) No 2042/75 on special detailed rules for the application
    of the system of import and export licences for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2088/76 de la Commission, du 24 août 1976, portant
    huitième modification du règlement (CEE) n° 2042/75 relatif aux modalités
    particulières d' application du régime des certificats d' importation et d'
    exportation dans le secteur des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2088/76 der Kommission vom 24. August 1976 zur achten
    Änderung der Verordnung (EWG) Nr. 2042/75 über besondere Durchführungsvorschriften
    für Einfuhr- und Ausfuhrlizenzen für Getreide und Reis
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2088/76 af 24. august 1976 om ottende
    ændring af forordning (EØF) nr. 2042/75 om de særlige gennemførelsesbestemmelser
    for ordningen med import- og eksportlicenser for korn og ris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2088/76 της Επιτροπής
