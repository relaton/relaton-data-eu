    του κανονισμού (ΕΟΚ) αριθ. 2042/75 «περί των ειδικών
    τρόπων εφαρμογής του καθεστώτος των πιστοποιητικών
    εισαγωγής και εξαγωγής στον τομέα των σιτηρών
    και του ρυζιού»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2088/76 della Commissione, del 24 agosto 1976, recante
    ottava modifica del regolamento (CEE) n. 2042/75 che stabilisce le modalità particolari
    di applicazione del regime dei titoli d' importazione e di esportazione nel settore
    dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2088/76 van de Commissie van 24 augustus 1976 houdende
    achtste wijziging van Verordening (EEG) nr. 2042/75 houdende bijzondere uitvoeringsbepalingen
    inzake het stelsel van invoer- en uitvoercertificaten in de sector granen en rijst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2088/76 da Comissão, de 24 de Agosto de 1976, que
    estabelece a oitava alteração ao Regulamento (CEE) n.° 2042/75 relativo às
    regras especiais de execução do regime dos certificados de importação e de
    exportação no sector dos cereais e do arroz
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2088/76 de la Comisión, de 24 de agosto de 1976,
    sobre la octava modificación del Reglamento (CEE) n° 2042/75 relativo a las
    modalidades particulares de aplicación del régimen de los certificados de importación
    y de exportación en el sector de los cereales y del arroz
