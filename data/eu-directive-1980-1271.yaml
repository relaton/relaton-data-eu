  content: Council Directive 80/1271/EEC of 22 December 1980 providing for the adaptation,
    consequent upon the accession of the Hellenic Republic to the European Communities,
    of Council Directive 73/173/EEC on the approximation of Member States' laws, regulations
    and administrative provisions relating to the classification, packaging and labelling
    of dangerous preparations (solvents)
  type: main
- language: fr
