    visā teritorijā vai tās daļā atļauj paredzēt pret noteiktām slimībām
    vērstus stingrākus pasākumus, nekā paredzēts Padomes Direktīvas 66/403/EEK
    I un II pielikumā
  type: main
- language: lt
  script: Latn
  content: 1996 m. gegužės 3 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    93/231/EEB, leidžiantį, prekiaujant sėklinėmis bulvėmis tam tikrų valstybių
    narių visoje arba dalyje teritorijos, taikyti griežtesnes nei nurodyta Tarybos
    direktyvos 66/403/EEB I ir II prieduose priemones nuo tam tikrų ligų
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni 96/332/KE tat-3 ta’ Mejju 1996 li temenda
    d-Deċiżjoni 93/231/KEE, li tawtorizza, rigward is-suq ta’ patata taż-żerriegha
    fit-territorju kollu jew parti minnu f’ċerti Stati Membri, miżuri aktar rigorużi
    kontra ċertu mard msemmi fl-Annessi I u II mad-Direttiva tal-Kunsill 66/403/KEE
  type: main
- language: nl
  script: Latn
  content: '96/332/EG: Beschikking van de Commissie van 3 mei 1996 houdende wijziging
    van Beschikking 93/231/EEG tot machtiging van sommige Lid-Staten om, wat de handel
    in pootaardappelen betreft, voor hun gehele grondgebied of een gedeelte daarvan
    ten aanzien van bepaalde ziekten strengere maatregelen toe te passen dan op grond
    van de bijlagen I en II bij Richtlijn 66/403/EEG is vereist'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 3 maja 1996 r. zmieniająca decyzję 93/231/EWG
    upoważniającą w zakresie obrotu sadzeniakami ziemniaków na całym lub części
    terytorium niektórych Państw Członkowskich do podjęcia bardziej rygorystycznych
    środków przeciwko niektórym chorobom niż przewidziane w załącznikach I i
    II do dyrektywy Rady 66/403/EWG
  type: main
- language: pt
  script: Latn
  content: '96/332/CE: Decisão da Comissão, de 3 de Maio de 1996, que altera a Decisão
    93/231/CEE, que autoriza medidas mais restritivas do que as previstas nos anexos
    I e II da Directiva 66/403/CEE do Conselho, a adoptar relativamente a certas doenças,
    no que se refere à comercialização de batatas de semente em todo o território
    de determinados Estados-membros ou em partes destes'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 3. mája 1996, ktorým sa mení rozhodnutie 93/231/EHS,
    ktoré pri uvádzaní na trh sadby zemiakov povoľuje na celom alebo na časti
    územia niektorých členských štátov prísnejšie opatrenia proti niektorým
    nákazám, než sú stanovené v prílohách I a II smernice Rady 66/403/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 3. maja 1996 o spremembi Odločbe 93/231/EGS, s
    katero se nekaterim državam članicam dovoli, da za trženje semenskega krompirja
    na njihovem celotnem ozemlju ali le na delu njihovega ozemlja uporabljajo strožja
    merila glede nekaterih bolezni, kot so določena v prilogah I in II k Direktivi
    Sveta 66/403/EGS
  type: main
- language: es
  script: Latn
  content: '96/332/CE: Decisión de la Comisión, de 3 de mayo de 1996, que modifica
    la Decisión 93/231/CEE por la que se autoriza la adopción, contra determinadas
    enfermedades, de medidas más estrictas que las previstas en los Anexos I y II
    de la Directiva 66/403/CEE del Consejo respecto de la comercialización de patatas
    de siembra en todo el territorio de determinados Estados miembros o en una parte
    del mismo'
  type: main
- language: sv
  script: Latn
  content: '96/332/EG: Kommissionens beslut av den 3 maj 1996 om ändring av beslut
    93/231/EEG om bemyndigande att det, för saluföring av utsädespotatis i vissa
    medlemsstaters samlade territorium eller delar därav, tillämpas strängare åtgärder
    mot vissa sjukdomar än de som fastställs i bilagorna I och II till rådets direktiv
    66/403/EEG'
  type: main
