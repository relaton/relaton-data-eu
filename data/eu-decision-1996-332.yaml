title:
- language: en
  script: Latn
  content: '96/332/EC: Commission Decision of 3 May 1996 amending Decision 93/231/EEC,
    authorizing, in respect of the marketing of seed potatoes in all or part of the
    territory of certain Member States, more stringent measures against certain diseases
    than are provided for in Annexes I and II to Council Directive 66/403/EEC'
  type: main
- language: fr
  script: Latn
  content: '96/332/CE: Décision de la Commission, du 3 mai 1996, modifiant la décision
    93/231/CEE autorisant, en ce qui concerne la commercialisation des plants de pommes
    de terre dans tout ou partie du territoire de certains États membres, l''adoption,
    contre certaines maladies, de mesures plus strictes que celles qui sont prévues
    aux annexes I et II de la directive 66/403/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '96/332/EG: Entscheidung der Kommission vom 3. Mai 1996 zur Änderung der
    Entscheidung 93/231/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für den
    Verkehr mit Pflanzkartoffeln auf ihrem gesamten oder auf Teilen ihres Hoheitsgebiets
    strengere als die in den Anlagen I und II der Richtlinie 66/403/EWG des Rates
    vorgesehenen Maßnahmen gegen bestimmte Krankheitserreger anzuwenden'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 3. května 1996, kterým se mění rozhodnutí
    93/231/EHS, kterým se při uvádění sadby brambor na trh na celém území
    některých členských států nebo na jeho části povoluje používat přísnější
    opatření proti některým chorobám, než která jsou stanovena v přílohách
    I a II směrnice Rady 66/403/EHS
  type: main
- language: da
  script: Latn
  content: '96/332/EF: Kommissionens beslutning af 3. maj 1996 om ændring af beslutning
    93/231/EØF om tilladelse til, at der for handelen med læggekartofler på visse
    medlemsstaters samlede område eller dele deraf gennemføres strengere foranstaltninger
    mod bestemte sygdomme end fastsat i bilag I og II til Rådets direktiv 66/403/EØF'
  type: main
- language: el
  script: Grek
