  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 3. mai 1996, millega muudetakse otsust 93/231/EMÜ, lubades
    seemnekartuli turustamise suhtes teatavate liikmesriikide kogu territooriumil
    või osal sellest kehtestada teatavate haiguste vastu rangemaid meetmeid, kui
    on sätestatud nõukogu direktiivi 66/403/EMÜ I ja II lisas
  type: main
- language: fi
  script: Latn
  content: '96/332/EY: Komission päätös, tehty 3 päivänä toukokuuta 1996, luvasta
