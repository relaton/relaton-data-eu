    meghatározott betegségek ellen a Tanács 66/403/EGK irányelve I. és II. melléklete
    által előírtnál szigorúbb intézkedések engedélyezéséről szóló 93/231/EGK
    határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '96/332/CE: Decisione della Commissione, del 3 maggio 1996, recante modifica
