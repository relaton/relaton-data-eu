    koko alueella tai osalla siitä neuvoston direktiivin 66/403/ETY liitteissä I
    ja II määrättyjä toimenpiteitä ankarampia toimenpiteitä tiettyjä tauteja
    vastaan tehdyn päätöksen 93/231/ETY muuttamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság 96/332/EK határozata (1996. május 3.) a vetőburgonya egyes
