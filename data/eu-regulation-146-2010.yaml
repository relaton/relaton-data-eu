  content: A Bizottság 146/2010/EU rendelete ( 2010. február 23. ) a 73/2009/EK
    tanácsi rendeletnek a kölcsönös megfeleltetés, a moduláció és az integrált
    igazgatási és ellenőrzési rendszer tekintetében, az említett rendeletben
    létrehozott, mezőgazdasági termelők részére meghatározott közvetlen támogatási
    rendszerek keretében történő végrehajtására vonatkozó részletes szabályok
    megállapításáról, valamint az 1234/2007/EK tanácsi rendeletnek a kölcsönös
    megfeleltetés tekintetében, a borágazatban meghatározott támogatási rendszer
    keretében történő végrehajtására vonatkozó részletes szabályok megállapításáról
    szóló 1122/2009/EK rendelet módosításáról
  type: main
