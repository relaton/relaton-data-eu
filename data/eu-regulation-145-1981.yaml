title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 145/81 of 19 January 1981 fixing the prices
    to be used for calculating the value of agricultural products in intervention
    storage on 31 December 1980 to be carried forward to the 1981 financial year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 145/81 de la Commission, du 19 janvier 1981, fixant
    les prix à retenir pour le calcul de la valeur des produits agricoles en stock
    d' intervention au 31 décembre 1980 et à reporter à l' exercice 1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 145/81 der Kommission vom 19. Januar 1981 zur Festsetzung
    der Preise, die für die Berechnung des Wertes der am 31. Dezember 1980 bei der
    Intervention eingelagerten und auf das Haushaltsjahr 1981 zu übertragenden Agrarerzeugnisse
    zu berücksichtigen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 145/81 af 19. januar 1981 om fastsættelse
    af de priser, der skal anvendes ved beregning af værdien af landbrugsprodukter,
    som interventionsorganerne ligger inde med pr. 31. december 1980, og som skal
    overføres til regnskabsåret 1981
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 145/81 τής Επιτροπής
    τής 19ης Ιανουαρίου 1981 περί καθορισμού τών τιμών
    πού πρέπει νά ληφθούν υπόψη γιά τόν υπολογισμό
    τής αξίας τών υφιστάμενων αποθεμάτων παρεμβάσεως
    γεωργικών προϊόντων τήν 31η Δεκεμβρίου 1980 καί
    πού πρέπει νά μεταφερθούν στή χρήση 1981
  type: main
- language: it
  script: Latn
  content: regolamento (CEE) n. 145/81 della Commissione, del 19 gennaio 1981, che
    fissa i prezzi da prendere in considerazione per calcolare il valore dei prodotti
    agricoli giacenti all' intervento al 31 dicembre 1980 e da riportare all' esercizio
    1981
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 145/81 van de Commissie van 19 januari 1981 tot vaststelling
    van de prijzen die in aanmerking moeten worden genomen voor de berekening van
    de waarde van de landbouwprodukten die op 31 december 1980 bij de interventiebureaus
    in voorraad zijn en moeten worden overgeboekt naar het begrotingsjaar 1981
  type: main
