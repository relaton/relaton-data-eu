title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 390/97 of 20 December 1996 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches for 1997 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 390/97 du Conseil du 20 décembre 1996 fixant, pour
    certains stocks et groupes de stocks de poissons, les totaux admissibles des captures
    pour 1997 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 390/97 des Rates vom 20. Dezember 1996 zur Festlegung
    der zulässigen Gesamtfangmengen und entsprechender Fangbedingungen für bestimmte
    Fischbestände oder -bestandsgruppen (1997)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 390/97 af 20. december 1996 om fastsættelse
    for 1997 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 390/97 του Συμβουλίου
