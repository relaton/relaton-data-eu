    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπομένων αλιευμάτων
    (TAC) για το 1997 καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 390/97, annettu 20 päivänä joulukuuta 1996,
    eräiden kalakantojen ja kalakantaryhmien osalta vuodeksi 1997 vahvistettavista
    suurimmista sallituista saaliista ja niiden pyyntiä koskevista tietyistä edellytyksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 390/97 del Consiglio del 20 dicembre 1996 che stabilisce,
    per alcuni stock o gruppi di stock ittici, il totale ammissibile di catture (TAC)
    per il 1997 e talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 390/97 van de Raad van 20 december 1996 inzake de
    vaststelling van de voor 1997 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden, alsmede bepaalde bij de visserij in acht
    te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 390/97 do Conselho de 20 de Dezembro de 1996 que fixa
    os totais admissíveis de capturas para 1997 e certas condições em que podem
    ser pescadas determinadas unidades populacionais ou grupos de unidades populacionais
    de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 390/97 del Consejo de 20 diciembre de 1996 por el que
    se fijan los totales admisibles de capturas (TAC) de determinadas poblaciones
    y grupos de poblaciones de peces para 1997 y determinadas condiciones en que pueden
    pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 390/97 av den 20 december 1996 om fastställande,
