title:
- language: en
  script: Latn
  content: '2003/836/EC: Council Decision of 27 November 2003 on the repeal of the
    Financial Regulation governing the budgetary aspects of the management by the
    Secretary-General of the Council, of contracts concluded in his name, on behalf
    of certain Member States, relating to the installation and the functioning of
    the "Help Desk Server" of the Management Unit and of the Sirene Network Phase
    II'
  type: main
- language: fr
  script: Latn
  content: '2003/836/CE: Décision du Conseil du 27 novembre 2003 abrogeant le règlement
    financier régissant les aspects budgétaires de la gestion par le secrétaire
    général du Conseil des contrats conclus par celui-ci, en tant que représentant
    de certains États membres, concernant l''installation et le fonctionnement du
    helpdesk de l''unité de gestion et du réseau Sirene phase II'
  type: main
- language: de
  script: Latn
  content: '2003/836/EG: Beschluss des Rates vom 27. November 2003 zur Aufhebung der
    Finanzregelung für die Haushaltsaspekte der vom Generalsekretär des Rates zu
    verwaltenden Verträge über die Einrichtung und den Betrieb des "Helpdesk Server"
    der Managementeinheit und der Phase II des Sirene-Netzes, die in seinem Namen
    als Vertreter bestimmter Mitgliedstaaten geschlossen worden sind'
  type: main
- language: da
  script: Latn
  content: '2003/836/EF: Rådets afgørelse af 27. november 2003 om ophævelse af
