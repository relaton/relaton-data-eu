    κανονισμού που διέπει τα δημοσιονομικά θέματα
    της διαχείρισης, από τον γενικό γραμματέα του
    Συμβουλίου, των συμβάσεων που συνάπτονται
    στο όνομά του, ως εκπρόσωπου ορισμένων κρατών
    μελών, όσον αφορά την εγκατάσταση και τη λειτουργία
    του "Help Desk Server" της μονάδας διαχείρισης και
    του σχετικού δικτύου Sirene, φάση II'
  type: main
