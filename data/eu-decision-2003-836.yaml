    pääsihteerin hallinnoimien, hänen joidenkin jäsenvaltioiden puolesta tekemiensä
    hallintoyksikön help desk -palvelimen ja Sirene-verkon toisen vaiheen perustamista
    ja toimintaa koskevien sopimusten osalta'
  type: main
- language: it
  script: Latn
  content: '2003/836/CE: Decisione del Consiglio, del 27 novembre 2003, che abroga
