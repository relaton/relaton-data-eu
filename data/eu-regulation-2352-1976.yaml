title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2352/76 of 28 September 1976 establishing
    the standard average values for the determination of the value for customs purposes
    for citrus fruits and apples and pears to be applied during the periods at the
    beginning of the 1976/77 importing season
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2352/76 de la Commission, du 28 septembre 1976, fixant
    des valeurs moyennes forfaitaires applicables pour la détermination de la valeur
    en douane des agrumes et des pommes et poires pendant les périodes de début
    de campagne d'importation 1976/1977
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2352/76 der Kommission vom 28. September 1976 über
    die Festsetzung von Mittelwerten für die Ermittlung des Zollwerts für einige
    Zitrusfrüchte und Äpfel und Birnen während der Zeiträume zu Beginn der Einfuhrsaison
    1976/1977
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2352/76 af 28. september 1976 om fastsættelse
    af de middelværdier til ansættelsen af toldværdien af citrusfrugter, æbler
    og pærer, der skal anvendes i begyndelsesperioderne af indførselssæsonen 1976/1977
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2352/76 della Commissione, del 28 settembre 1976,
    che fissa i valori medi forfettari applicabili per la determinazione del valore
    in dogana degli agrumi e delle mele e delle pere durante i periodi iniziali della
    campagna d'importazione 1976/1977
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2352/76 van de Commissie van 28 september 1976 houdende
    vaststelling van de forfaitaire waarden voor de bepaling van de douanewaarde van
    citrusvruchten en appels en peren gedurende de tijdvakken aan het begin van de
    invoercampagne 1976/1977
