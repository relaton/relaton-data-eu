title:
- language: en
  script: Latn
  content: '2013/113/EU: Commission Implementing Decision of 1 March 2013 extending
    the validity of Decision 2006/502/EC requiring Member States to take measures
    to ensure that only lighters which are child-resistant are placed on the market
    and to prohibit the placing on the market of novelty lighters (notified under
    document C(2013) 1089)'
  type: main
- language: fr
  script: Latn
  content: '2013/113/UE: Décision d’exécution de la Commission du 1 er mars 2013
    prorogeant la validité de la décision 2006/502/CE exigeant des États membres
    qu’ils prennent des mesures destinées à faire en sorte que seuls les briquets
    présentant des caractéristiques de sécurité enfants soient mis sur le marché
    et à interdire la mise sur le marché de briquets fantaisie [notifiée sous le
    numéro C(2013) 1089]'
  type: main
- language: de
  script: Latn
  content: '2013/113/EU: Durchführungsbeschluss der Kommission vom 1. März 2013
    zur Verlängerung der Geltungsdauer der Entscheidung 2006/502/EG zur Verpflichtung
    der Mitgliedstaaten, Maßnahmen zu treffen, damit nur kindergesicherte Feuerzeuge
    in Verkehr gebracht werden und das Inverkehrbringen von Feuerzeugen mit Unterhaltungseffekten
    untersagt wird (Bekanntgegeben unter Aktenzeichen C(2013) 1089)'
  type: main
- language: bg
  script: Cyrl
  content: '2013/113/ЕС: Решение за изпълнение на Комисията
    от 1 март 2013 година за продължаване на валидността
    на Решение 2006/502/ЕО относно изискването към
    държавите членки да приемат мерки, за да гарантират,
    че на пазара се пускат единствено запалки,
    които са обезопасени спрямо деца, и да забранят
    пускането на пазара на запалки с нестандартен
    дизайн (нотифицирано под номер C(2013) 1089)'
  type: main
- language: cs
  script: Latn
