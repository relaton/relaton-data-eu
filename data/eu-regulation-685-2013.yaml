    veiksmingai kontroliuoja, į teritorijas, kurių Kipro Respublikos Vyriausybė
    veiksmingai nekontroliuoja, ir vėl grąžinamos į tas teritorijas, iš dalies
    keičiamas Reglamentas (EB) Nr. 866/2004 dėl režimo pagal Stojimo akto 10 protokolo
    2 straipsnį
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (UE) Nru 685/2013 tal- 15 ta’ Lulju 2013 li jemenda
    r-Regolament (KE) Nru 866/2004 dwar reġim skont l-Artikolu 2 tal-Protokoll 10
    għall-Att ta’ Adeżjoni rigward oġġetti li jinħarġu miż-żoni li huma
    taħt kontroll effettiv tal-Gvern tar-Repubblika ta’ Ċipru u jittieħdu lura
    f’dawk iż-żoni wara li jkunu għaddew minn żoni li m’humiex taħt il-kontroll
    effettiv tal-Gvern tar-Repubblika ta’ Ċipru
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 685/2013 van de Raad van 15 juli 2013 tot wijziging
    van Verordening (EG) nr. 866/2004 inzake een regeling op grond van artikel 2 van
    Protocol nr. 10 van de Toetredingsakte, met betrekking tot goederen die worden
    gebracht buiten de gebieden waarover de regering van de Republiek Cyprus feitelijk
    het gezag uitoefent, en die opnieuw in deze gebieden worden binnengebracht, na
    te zijn vervoerd via de gebieden waarover de regering van de Republiek Cyprus
    niet feitelijk het gezag uitoefent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (UE) nr 685/2013 z dnia 15 lipca 2013 r. zmieniające
    rozporządzenie (WE) nr 866/2004 w sprawie systemu na podstawie art. 2 Protokołu
    10 do Aktu przystąpienia w odniesieniu do towarów, które są wyprowadzane z
    obszarów, na których rząd Republiki Cypryjskiej sprawuje efektywną kontrolę,
    oraz ponownie wprowadzane na te obszary po przewiezieniu ich przez obszary, na
    których rząd Republiki Cypryjskiej nie sprawuje efektywnej kontroli
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 685/2013 do Conselho, de 15 de julho de 2013 , que
    altera o Regulamento (CE) n. ° 866/2004 relativo a um regime de acordo com o
    artigo 2. °do Protocolo n. ° 10 ao Ato de Adesão, no que diz respeito às mercadorias
    que saem das zonas sob o controlo efetivo do Governo da República de Chipre e
    nelas são reintroduzidas depois de passarem através de zonas onde o Governo
    da República de Chipre não exerce um controlo efetivo
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 685/2013 al Consiliului din 15 iulie 2013 de modificare
    a Regulamentului (CE) nr. 866/2004 privind regimul stabilit în temeiul dispozițiilor
    articolului 2 din Protocolul nr. 10 la Actul de aderare în ceea ce privește
    mărfurile care sunt scoase din zonele aflate sub controlul efectiv al Guvernului
    Republicii Cipru și reintroduse în zonele respective după trecerea prin zonele
    care nu se află sub controlul efectiv al Guvernului Republicii Cipru
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EÚ) č. 685/2013 z 15. júla 2013 , ktorým sa mení
    nariadenie (ES) č. 866/2004 o režime podľa článku 2 protokolu 10 Aktu o pristúpení,
    pokiaľ ide o tovar, ktorý sa odváža z oblastí pod skutočnou kontrolou vlády
    Cyperskej republiky a naspäť sa do týchto oblastí priváža potom, ako prešiel
    cez oblasti, ktoré nie sú pod skutočnou kontrolou vlády Cyperskej republiky
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EU) št. 685/2013 z dne 15. julija 2013 o spremembi Uredbe
    (ES) št. 866/2004 o režimu na podlagi člena 2 Protokola št. 10 k Aktu o pristopu
    glede blaga, ki izstopa iz območij, ki so pod dejanskim nadzorom Vlade Republike
    Ciper, in v njih ponovno vstopa, potem ko je prečkalo območja, ki niso pod dejanskim
    nadzorom Vlade Republike Ciper
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 685/2013 del Consejo, de 15 de julio de 2013 , por
    el que se modifica el Reglamento (CE) n ° 866/2004 sobre un régimen conforme
    al artículo 2 del Protocolo n ° 10 del Acta de Adhesión, en lo que respecta
    a las mercancías que son sacadas de las zonas que están bajo el control efectivo
    del Gobierno de la República de Chipre y son devueltas a estas después de atravesar
    las zonas que no están bajo el control efectivo del Gobierno de la República
    de Chipre
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EU) nr 685/2013 av den 15 juli 2013 om ändring av
    förordning (EG) nr 866/2004 om en ordning enligt artikel 2 i protokoll nr 10
    till anslutningsakten vad gäller varor som förs ut från de områden där Republiken
    Cyperns regering utövar den faktiska kontrollen och förs tillbaka in på dessa
    områden efter att ha passerat genom områden där Republiken Cyperns regering
    inte utövar den faktiska kontrollen
