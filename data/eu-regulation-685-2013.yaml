    относно режим съгласно член 2 от Протокол №
    10 към Акта за присъединяване от 2003 г. относно
    стоки, които се извеждат от зоните, в които
    правителството на Република Кипър осъществява
    ефективен контрол, и се въвеждат обратно в
    тези зони след преминаване през зоните, в които
    правителството на Република Кипър не осъществява
    ефективен контрол
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EU) č. 685/2013 ze dne 15. července 2013 , kterým
