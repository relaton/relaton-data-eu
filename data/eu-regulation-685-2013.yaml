    u kojima Vlada Republike Cipra ne izvršava stvarnu kontrolu
  type: main
- language: hu
  script: Latn
  content: A Tanács 685/2013/EU rendelete ( 2013. július 15. ) a Ciprusi Köztársaság
    kormányának tényleges ellenőrzése alatt álló területekről kivitt és
    a Ciprusi Köztársaság kormányának tényleges ellenőrzésén kívül eső
    területeken való áthaladást követően visszavitt áruk tekintetében a csatlakozási
