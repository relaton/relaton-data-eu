  script: Latn
  content: Uredba Vijeća (EU) br. 685/2013 od 15. srpnja 2013. o izmjeni Uredbe (EZ)
    br. 866/2004 o režimu prema članku 2. Protokola br. 10 uz Akt o pristupanju
    u pogledu robe koja se iznosi iz područja u kojima Vlada Republike Cipra izvršava
