title:
- language: en
  script: Latn
  content: Council Regulation (EU) No 685/2013 of 15 July 2013 amending Regulation
    (EC) No 866/2004 on a regime under Article 2 of Protocol 10 to the Act of Accession
    as regards goods which are taken out of the areas under the effective control
    of the Government of the Republic of Cyprus and taken back into those areas after
    passing through the areas not under the effective control of the Government of
    the Republic of Cyprus
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 685/2013 du Conseil du 15 juillet 2013 modifiant le
    règlement (CE) n ° 866/2004 concernant un régime en application de l’article
    2 du protocole n ° 10 de l’acte d’adhésion relatif aux marchandises qui
    sont sorties des zones placées sous le contrôle effectif du gouvernement de
    la République de Chypre, puis réintroduites dans ces zones après être passées
    par les zones qui ne sont pas placées sous un tel contrôle
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 685/2013 des Rates vom 15. Juli 2013 zur Änderung
    der Verordnung (EG) Nr. 866/2004 über eine Regelung nach Artikel 2 des Protokolls
    Nr. 10 zur Beitrittsakte in Bezug auf Waren, die aus den Landesteilen unter der
    tatsächlichen Kontrolle der Regierung der Republik Zypern verbracht und nach
    der Durchfuhr durch die Landesteile, in denen die Regierung der Republik Zypern
    keine tatsächliche Kontrolle ausübt, wieder in jene Landesteile zurückverbracht
    werden
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 685/2013 на Съвета от 15 юли
