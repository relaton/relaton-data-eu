    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 685/2013 del Consiglio, del 15 luglio 2013 , recante
    modifica del regolamento (CE) n. 866/2004 relativo ad un regime ai sensi dell’articolo
    2 del protocollo n. 10 dell’atto di adesione riguardante le merci che escono
    dalle zone sotto il controllo effettivo del governo della Repubblica di Cipro
    e che rientrano in tali zone dopo aver attraversato le zone non soggette al controllo
    effettivo del governo della Repubblica di Cipro
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (ES) Nr. 685/2013 ( 2013. gada 15. jūlijs ), ar ko groza
    Regulu (EK) Nr. 866/2004 par režīmu saskaņā ar Pievienošanās akta 10. protokola
    2. pantu attiecībā uz precēm, kas izvestas no rajoniem, kuros Kipras Republikas
    valdībai ir faktiskā kontrole, un ievestas minētajos rajonos atpakaļ caur
    rajoniem, kuros Kipras Republikas valdībai nav faktiskās kontroles
  type: main
- language: lt
  script: Latn
  content: 2013 m. liepos 15 d. Tarybos reglamentas (ES) Nr. 685/2013, kuriuo dėl
