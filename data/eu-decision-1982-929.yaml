title:
- language: en
  script: Latn
  content: '82/929/EEC: Commission Decision of 20 December 1982 establishing that
    the apparatus described as ''Tektronix - Waveform Viewing Transient Digitizer
    System, model WP 2010'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/929/CEE: Décision de la Commission, du 20 décembre 1982, constatant
    que l''importation de l''appareil dénommé "Tektronix - waveform viewing transient
    digitizer system, model WP 2010" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/929/EWG: Entscheidung der Kommission vom 20. Dezember 1982, mit der
    festgestellt wird, daß das Gerät ,,Tektronix - Waveform Viewing Transient Digitizer
    System, model WP 2010" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/929/EØF: Kommissionens beslutning af 20. december 1982 om fastslåelse
    af, at indførsel af apparatet "Tektronix - Waveform Viewing Transient Digitizer
    System, model WP 2010" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/929/EOK: Απόφαση τής Επιτροπής τής 20ής Δεκεμβρίου
