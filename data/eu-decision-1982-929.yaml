    Transient Digitizer System, model WP 2010" può avvenire in franchigia dai dazi
    della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/929/EEG: Beschikking van de Commissie van 20 december 1982 waarbij
