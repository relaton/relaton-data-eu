    μέ τήν ονομασία «Tektronix — Waveform Viewing Transient Digitizer
    System, model WP 210» δύναται νά πραγματοποιηθεί ατελώς,
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/929/CEE: Decisione della Commissione, del 20 dicembre 1982, che stabilisce
