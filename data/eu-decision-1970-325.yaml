type: standard
title:
- language: en
  script: Latn
  content: '70/325/EEC: Decision of the Commission of 18 June 1970 on the model for
    the standard form of report whereby Member States are to forward to the Commission
    the information required for drawing up the general report which the Commission
    must present annually to the Council on the implementation by Member States of
    the Council Regulation on the harmonisation of certain social legislation relating
    to road transport (Article 17 (1) and (2) of Regulation (EEC) No 543/69)'
  type: main
- language: fr
  script: Latn
  content: '70/325/CEE: Décision de la Commission, du 18 juin 1970, relative au modèle
    de compte rendu type sur la base duquel les États membres adresseront à la Commission
    les informations nécessaires en vue de l'' établissement du rapport global que
    celle-ci doit adresser annuellement au Conseil concernant l'' application, par
    les États membres, du règlement du Conseil relatif à l'' harmonisation de certaines
    dispositions en matière sociale dans le domaine des transports par route (article
    17 paragraphes 1 et 2 du règlement (CEE) nº543/69)'
  type: main
- language: de
  script: Latn
  content: '70/325/EWG: Entscheidung der Kommission vom 18. Juni 1970 über das Muster
    eines Berichtes, an Hand dessen die Mitgliedstaaten der Kommission die erforderlichen
    Angaben zur Erstellung eines Gesamtberichts übermitteln werden, den die Kommission
    jährlich dem Rat zwecks Anwendung durch die Mitgliedstaaten der Verordnung des
    Rates über die Harmonisierung bestimmter Sozialvorschriften im Straßenverkehr
    vorlegen muß (Artikel 17 Absätze 1 und 2 der Verordnung (EWG) Nr. 543/69)'
  type: main
- language: da
  script: Latn
  content: '70/325/EØF: Kommissionens beslutning af 18. juni 1970 om modellen til
    en standardredegørelse, på grundlag af hvilken medlemsstaterne til Kommissionen
    fremsender de nødvendige oplysninger med henblik på udarbejdelsen af en samlet
    beretning, som Kommissionen årligt skal fremsende til Rådet vedrørende medlemsstaternes
    gennemførelse af Rådets forordning om harmonisering af visse bestemmelser på
    det sociale område inden for landevejstransport (forordning (EØF) nr. 543/69,
    artikel 17, stk. 1 og 2)'
  type: main
- language: el
  script: Grek
  content: '70/325/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Ιουνίου 1970 περί του σχεδίου του υποδείγματος
    των πρακτικών, βάσει του οποίου τα κράτη μέλη
    θα αποστέλλουν στην Επιτροπή τις αναγκαίες
    πληροφορίες για τη σύνταξη της γενικής εκθέσεως,
    την οποία η Επιτροπή οφείλει να υποβάλλει ετησίως
    στο Συμβούλιο σχετικά με την εφαρμογή από τα
    κράτη μέλη του κανονισμού του Συμβουλίου «περί
    εναρμονίσεως ορισμένων διατάξεων κοινωνικού
    περιεχομένου στον τομέα των οδικών μεταφορών
    (άρθρο 17 παράγραφοι 1 και 2 του κανονισμού αριθ.
    543/69/ΕΟΚ)»'
  type: main
- language: fi
  script: Latn
  content: '70/325/ETY: Komission päätös, tehty 18 päivänä kesäkuuta 1970,
    vakiolomakkeen mallista, jolla jäsenvaltiot ilmoittavat komissiolle tiedot, jotka
