  script: Latn
  content: Commission Implementing Decision of 28 July 2011 exempting exploration
    for oil and gas and exploitation of oil in Denmark, excluding Greenland and the
    Faroe Islands, from the application of Directive 2004/17/EC of the European Parliament
    and of the Council coordinating the procurement procedures of entities operating
    in the water, energy, transport and postal services sectors (notified under document
    C(2011) 5312)
  type: main
- language: fr
