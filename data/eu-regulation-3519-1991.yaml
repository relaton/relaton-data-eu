title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3519/91 of 4 December 1991 repealing Regulation
    (EEC) No 2158/89 determining, for tobacco from the 1988 harvest, the quantity
    actually produced and the prices and premiums payable under the system of maximum
    guaranteed quantities
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3519/91 DE LA COMMISSION du 4 décembre 1991 abrogeant
    le règlement (CEE) no 2158/89 établissant pour le tabac de la récolte 1988,
    la production effective ainsi que les prix et les primes à payer en application
    du régime des quantités maximales garanties #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3519/91 DER KOMMISSION vom 4. Dezember 1991 zur Aufhebung
    der Verordnung (EWG) Nr. 2158/89 zur Feststellung der tatsächlichen Erzeugung
    und zur Festsetzung der in Anwendung der Regelung der Höchstgarantiemengen zu
    zahlenden Preise und Prämien für Tabak der Ernte 1988 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3519/91 af 4. december 1991 om ophævelse
    af forordning (EØF) nr. 2158/89 om fastsættelse af den faktiske produktion af
    samt de priser og præmier, der i henhold til ordningen med maksimale garantimængder
    skal betales for tobak fra 1988-høsten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3519/91 της Επιτροπής
    της 4ης Δεκεμβρίου 1991 για την κατάργηση του
    κανονισμού (ΕΟΚ) αριθ. 2158/89 για τον καθορισμό,
    για τον καπνό της συγκομιδής 1988, της πραγματικής
    παραγωγής καθώς και των τιμών και των πριμοδοτήσεων
    που θα πληρωθούν σε εφαρμογή του καθεστώτος
    των μέγιστων εγγυημένων ποσοτήτων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3519/91 DELLA COMMISSIONE del 4 dicembre 1991 che
    abroga il regolamento (CEE) n. 2158/89 che stabilisce, per il tabacco del raccolto
    1988, la produzione effettiva, nonché i prezzi e i premi da pagare in applicazione
    del regime dei quantitativi massimi garantiti #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3519/91 VAN DE COMMISSIE van 4 december 1991 houdende
    intrekking van Verordening (EEG) nr. 2158/89 tot bepaling van de werkelijke produktie
    voor tabakssoorten van de oogst 1988 en tot vaststelling van de geldende prijzen
    en premies in het kader van de regeling inzake gegarandeerde maximumhoeveelheden
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3519/91 DA COMISSÃO de 4 de Dezembro de 1991 que
    revoga o Regulamento (CEE) no 2158/89, que estabelece a produção efectiva, os
    preços e os prémios a pagar para o tabaco da colheita de 1988, em execução
    do regime de quantidades máximas garantidas #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3519/91 DE LA COMISIÓN de 4 de diciembre de 1991
