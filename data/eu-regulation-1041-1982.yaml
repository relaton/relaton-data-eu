    έτος 1982, ορισμένων μέτρων διατηρήσεως καί διαχειρίσεως
    τών αλιευτικών πόρων πού εφαρμόζονται σέ σκάφη
    υπό ισπανική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1041/82 del Consiglio, del 29 aprile 1982, che dispone,
