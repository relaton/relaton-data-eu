title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1041/82 of 29 April 1982 laying down for 1982
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1041/82 du Conseil, du 29 avril 1982, fixant, pour
    1982, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de l' Espagnep
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1041/82 des Rates vom 29. April 1982 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter spanischer Flagge für 1982
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1041/82 af 29. april 1982 om fastsættelse
    for 1982 af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører spansk flag2
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1041/82 τού Συμβουλίου
