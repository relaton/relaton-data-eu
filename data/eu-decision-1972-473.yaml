title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 20 décembre 1972, autorisant la République
    italienne à exclure du traitement communautaire les véhicules automobiles pour
    le transport des personnes, de la position 87.02 A du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/473/EWG: Entscheidung der Kommission vom 20. Dezember 1972, mit der
    die Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Kraftwagen zum Befördern von Personen
    der Tarifnummer 87.02 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/473/CEE: Decisione della Commissione, del 20 dicembre 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i veicoli per
    il trasporto di persone della voce n. 87.02 A della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/473/EEG: Beschikking van de Commissie van 20 december 1972 waarbij
    de Italiaanse Republiek wordt gemachtigd automobielen voor personenverkeer van
    post 87.02 A van het gemeenschappelijk douanetarief, van oorsprong uit Japan en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
