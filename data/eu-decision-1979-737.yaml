title:
- language: en
  script: Latn
  content: '79/737/EEC: Commission Decision of 2 August 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Federal Republic of Germany of expenditure
    incurred during 1977 on aids relating to the provision of socio- economic guidance
    for and the acquisition of occupational skills by persons engaged in agriculture
    (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/737/CEE: Décision de la Commission, du 2 août 1979, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    à la République fédérale d''Allemagne, des dépenses effectuées pendant l''année
    1977 pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/737/EWG: Entscheidung der Kommission vom 2. August 1979 über die Rückvergütung
    der im Jahr 1977 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben durch den EAGFL,
    Abteilung Ausrichtung, an die Bundesrepublik Deutschland (Nur der deutsche Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/737/EØF: Kommissionens beslutning af 2. august 1979 om refusion gennem
    EUGFL, udviklingssektionen, til Forbundsrepublikken Tyskland af de udgifter, som
    er afholdt i løbet af året 1977 til støtte vedrørende social og erhvervsmæssig
    vejledning og faglige kvalifikationer hos de personer, som arbejder i landbruget
    (Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/737/CEE: Decisione della Commissione, del 2 agosto 1979, relativa al
    rimborso da parte del FEAOG, sezione orientamento, alla Repubblica federale di
    Germania delle spese effettuate durante il 1977 per gli aiuti concernenti l''informazione
    socio-economica e la qualificazione professionale delle persone che lavorano nell''agricoltura
    (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/737/EEG: Beschikking van de Commissie van 2 augustus 1979 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland
    van de gedurende het jaar 1977 gedane uitgaven voor steun met betrekking tot de
    sociaal-economische voorlichting en de scholing van personen die in de landbouw
