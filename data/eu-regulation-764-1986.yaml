    Tonwiedergabegeräte, für das Fernsehen, der Tarifstelle 92.11 B des Gemeinsamen
    Zolltarifs mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3599/85
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 764/86 af 14. marts 1986 om genindførelse
