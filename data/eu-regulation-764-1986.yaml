title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 764/86 of 14 March 1986 re-establishing
    the levying of customs duties on television image and sound recorders or reproducers,
    falling within subheading 92.11 B, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 764/86 de la Commission du 14 mars 1986 portant rétablissement
    de la perception des droits de douane applicables aux appareils d' enregistrement
    ou de reproduction des images et du son en télévision, de la sous-position 92.11
    B du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 764/86 der Kommission vom 14. März 1986 zur Wiedereinführung
