    für die Entwicklung des ländlichen Raums (ELER) getätigter Ausgaben von der
    Finanzierung durch die Europäische Union (Bekannt gegeben unter Aktenzeichen
    C(2022) 830) (Nur der bulgarische, deutsche, französische, griechische, italienische,
    litauische, polnische, portugiesische, schwedische, slowakische und spanische
