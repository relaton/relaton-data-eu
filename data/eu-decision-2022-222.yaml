title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/222 of 16 February 2022 excluding
    from European Union financing certain expenditure incurred by the Member States
    under the European Agricultural Guarantee Fund (EAGF) and under the European Agricultural
    Fund for Rural Development (EAFRD) (notified under document C(2022) 830) (Only
    the Bulgarian, French, German, Greek, Italian, Lithuanian, Polish, Portuguese,
    Slovak, Spanish and Swedish texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/222 de la Commission du 16 février
    2022 écartant du financement de l’Union européenne certaines dépenses effectuées
    par les États membres au titre du Fonds européen agricole de garantie (FEAGA)
    et du Fonds européen agricole pour le développement rural (Feader) [notifiée
    sous le numéro C(2022) 830] (Les textes en langues allemande, bulgare, espagnole,
    française, grecque, italienne, lituanienne, polonaise, portugaise, slovaque et
    suédoise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
