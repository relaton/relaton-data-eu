title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2414/2000 of 30 October 2000 determining
    the extent to which applications lodged in October 2000 for import licences for
    certain poultrymeat sector products pursuant to Regulation (EC) No 509/97 can
    be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2414/2000 de la Commission du 30 octobre 2000 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 2000 pour certains produits du secteur de la viande de volaille dans
    le cadre du règlement (CE) n° 509/97 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2414/2000 der Kommission vom 30. Oktober 2000 über
    die Festsetzung des Umfangs, in dem die im Oktober 2000 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Produkte des Sektors Geflügelfleisch entsprechend
    der Verordnung (EG) Nr. 509/97 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2414/2000 af 30. oktober 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    2000 om importlicenser for visse produkter fra fjerkrækødssektoren i forbindelse
    med forordning (EF) nr. 509/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2414/2000 της Επιτροπής,
    της 30ής Οκτωβρίου 2000, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Οκτώβριο 2000 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    του κρέατος πουλερικών στα πλαίσια του κανονισμού
    (ΕΚ) αριθ. 509/97
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2414/2000, annettu 30 päivänä lokakuuta 2000,
    määrättyyn järjestelmään liittyvien lokakuussa 2000 jätettyjen tiettyjä
    siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten hyväksyttävyydestä
    asetuksen (EY) N:o 509/97 mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2414/2000 della Commissione, del 30 ottobre 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 2000 per taluni prodotti del settore del pollame
    nel quadro del regolamento (CE) n. 509/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2414/2000 van de Commissie van 30 oktober 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector slachtpluimvee, die in
    oktober 2000 worden ingediend op grond van Verordening (EG) nr. 509/97
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2414/2000 da Comissão, de 30 de Outubro de 2000,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de aves de capoeira apresentados em
    Outubro de 2000 ao abrigo do Regulamento (CE) n.° 509/97
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2414/2000 de la Comisión, de 30 de octubre de 2000,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de aves
    de corral presentadas en el mes de octubre de 2000 al amparo del Reglamento (CE)
    n° 509/97
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2414/2000 av den 30 oktober 2000 om fastställande
    av i vilken utsträckning de ansökningar om importlicens för vissa köttprodukter
    från fjäderfäsektorn som ges in under oktober 2000 inom ramen för förordning
    (EG) nr 509/97 kan godtas
  type: main
