    têxteis dos capítulos 51 e 53 a 62 da pauta aduaneira comum, importados na Comunidade,
    bem como às condições em que esta prova pode ser aceite
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1681/81 del Consejo, de 11 de junio de 1981, por el
    que se modifica el Reglamento (CEE) n° 616/78 relativo a las justificaciones
    de origen de ciertos productos textiles de los capítulos 51 y 53 a 62 del arancel
    aduanero común, importados en la Comunidad, así como las condiciones en las
    que pueden ser aceptadas estas justificaciones
  type: main
- language: sv
