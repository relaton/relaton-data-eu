title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1681/81 of 11 June 1981 amending Regulation
    (EEC) No 616/78 on proof of origin for certain textile products falling within
    Chapter 51 or Chapters 53 to 62 of the Common Customs Tariff and imported into
    the Community, and on the conditions for the acceptance of such proof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1681/81 du Conseil, du 11 juin 1981, modifiant le
    règlement (CEE) n° 616/78 relatif aux justifications de l' origine de certains
    produits textiles des chapitres 51 et 53 à 62 du tarif douanier commun, importés
    dans la Communauté, ainsi qu' aux conditions selon lesquelles ces justifications
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1681/81 des Rates vom 11. Juni 1981 zur Änderung
    der Verordnung (EWG) Nr. 616/78 über die Ursprungsnachweise für bestimmte Textilwaren
    der Kapitel 51 und 53 bis 62 des Gemeinsamen Zolltarifs bei der Einfuhr in die
    Gemeinschaft sowie über die Voraussetzungen, unter denen diese Nachweise anerkannt
    werden können
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1681/81 af 11. juni 1981 om ændring af forordning
    (EØF) nr. 616/78 om dokumentation for oprindelsen af visse tekstilvarer henhørende
    under kapitel 51 og 53 til 62 i den fælles toldtarif, som indføres til Fællesskabet,
    og om betingelserne for, at denne dokumentation kan anerkendes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1681/81 τού Συμβουλίου
