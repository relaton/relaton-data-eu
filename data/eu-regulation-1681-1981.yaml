    (ΕΟΚ) αριθ. 616/78 «περί δικαιολογητικών καταγωγής
    ορισμένων υφαντουργικών προϊόντων τών Κεφαλαίων
    51 καί 53 έως 62 τού Κοινού Δασμολογίου εισαγομένων
    στήν Κοινότητα, καθώς καί περί τών προϋποθέσεων
    κατά τίς οποίες τά δικαιολογητικά αυτά δύνανται
    νά γίνουν αποδεκτά»
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1681/81, annettu 11 päivänä kesäkuuta 1981,
    tiettyjen yhteisöön tuotavien yhteisen tullitariffin 51 ja 53-62 ryhmään kuuluvien
    tekstiilituotteiden alkuperäselvityksistä ja kyseisten selvitysten hyväksymisedellytyksistä
    annetun asetuksen (ETY) N:o 616/78 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1681/81 del Consiglio, dell' 11 giugno 1981, che modifica
    il regolamento (CEE) n. 616/78 relativo agli attestati d' origine di taluni prodotti
    tessili dei capitoli 51 e da 53 a 62 della tariffa doganale comune, importati
    nella Comunità, nonché alle condizioni cui è subordinata l' accettazione degli
    attestati medesimi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1681/81 van de Raad van 11 juni 1981 houdende wijziging
    van Verordening (EEG) nr. 616/78 betreffende de bewijsstukken inzake de oorsprong
    van bepaalde in de Gemeenschap ingevoerde textielprodukten van de hoofdstukken
    51 en 53 tot en met 62 van het gemeenschappelijk douanetarief en betreffende de
    voorwaarden waaronder die bewijsstukken kunnen worden aanvaard
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 1681/81 do Conselho, de 11 de Junho de 1981, que
