    restablece un derecho antidumping definitivo y se percibe definitivamente el derecho
    provisional establecido sobre las importaciones de determinado calzado con parte
    superior de cuero originario de la República Popular China y fabricado por Brosmann
    Footwear (HK) Ltd, Seasonable Footwear (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou)
    Ltd, Risen Footwear (HK) Co. Ltd y Zhejiang Aokang Shoes Co. Ltd'
  type: main
