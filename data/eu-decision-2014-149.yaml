    Ltd, Seasonable Footwear (Zhongshan/Csungsan) Ltd, Lung Pao Footwear (Guangzhou/Kuangcsou)
    Ltd, Risen Footwear (HK/Hongkong) Co Ltd és Zhejiang Aokang Shoes Co. Ltd által
    gyártott egyes bőr felsőrésszel rendelkező lábbelik behozatalára vonatkozó
    végleges dömpingellenes vám ismételt kivetéséről, valamint a kivetett ideiglenes
    vám végleges beszedéséről szóló végrehajtási rendeletre irányuló javaslat
    elutasításáról'
  type: main
