title:
- language: en
  script: Latn
  content: '2014/149/EU: Council Implementing Decision of 18 March 2014 rejecting
    the proposal for an Implementing Regulation reimposing a definitive anti-dumping
    duty and collecting definitely the provisional duty imposed on imports of certain
    footwear with uppers of leather originating in the People’s Republic of China
    and produced by Brosmann Footwear (HK) Ltd, Seasonable Footwear (Zhongshan) Ltd,
    Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK) Co. Ltd and Zhejiang Aokang
    Shoes Co. Ltd'
  type: main
- language: fr
  script: Latn
  content: '2014/149/UE: Décision d’exécution du Conseil du 18 mars 2014 rejetant
    la proposition de règlement d’exécution réinstituant un droit antidumping
    définitif et portant perception définitive du droit provisoire institué sur
    les importations de certaines chaussures à dessus en cuir originaires de la République
    populaire de Chine et produites par Brosmann Footwear (HK) Ltd, Seasonable Footwear
    (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK) Co. Ltd
    et Zhejiang Aokang Shoes Co. Ltd'
  type: main
- language: de
  script: Latn
  content: '2014/149/EU: Durchführungsbeschluss des Rates vom 18. März 2014 zur
    Ablehnung des Vorschlags für eine Durchführungsverordnung des Rates zur Wiedereinführung
    eines endgültigen Antidumpingzolls und zur endgültigen Vereinnahmung des vorläufigen
    Zolls auf die Einfuhren bestimmter Schuhe mit Oberteil aus Leder mit Ursprung
    in der Volksrepublik China, die von Brosmann Footwear (HK) Ltd, Seasonable Footwear
    (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK) Co Ltd
    und Zhejiang Aokang Shoes Co. Ltd hergestellt werden'
  type: main
- language: bg
  script: Cyrl
  content: '2014/149/ЕС: Решение за изпълнение на Съвета
    от 18 март 2014 година за отхвърляне на предложението
    за регламент за изпълнение за повторно налагане
    на окончателно антидъмпингово мито и окончателно
    събиране на временното мито, наложено върху
    вноса на някои обувки с горна част от кожа с
    произход от Китайската народна република и
    произведени от Brosmann Footwear (HK) Ltd, Seasonable Footwear (Zhongshan)
    Ltd, Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK) Co Ltd и Zhejiang
    Aokang Shoes Co. Ltd'
  type: main
