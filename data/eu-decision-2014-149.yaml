  content: '2014/149/EU: Rådets genomförandebeslut av den 18 mars 2014 om avvisande
    av förslaget till genomförandeförordning om återinförande av en slutgiltig
    antidumpningstull på import av vissa skodon med överdelar av läder med ursprung
    i Folkrepubliken Kina och som tillverkas av Brosmann Footwear (HK) Ltd, Seasonable
    Footwear (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK)
    Co. Ltd och Zhejiang Aokang Shoes Co. Ltd och om slutgiltigt uttag av den preliminära
    antidumpningstull som införts på sådan import'
