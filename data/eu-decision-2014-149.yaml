  content: '2014/149/EU: Uitvoeringsbesluit van de Raad van 18 maart 2014 tot verwerping
    van het voorstel voor een uitvoeringsverordening betreffende het opnieuw instellen
    van een definitief antidumpingrecht en tot definitieve inning van het voorlopige
    recht op schoeisel met bovendeel van leder van oorsprong uit de Volksrepubliek
    China en vervaardigd door Brosmann Footwear (HK) Ltd, Seasonable Footwear (Zhongshan)
    Ltd, Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK) Co. Ltd en Zhejiang
    Aokang Shoes Co. Ltd'
  type: main
- language: pl
  script: Latn
