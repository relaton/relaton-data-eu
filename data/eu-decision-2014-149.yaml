    cło antydumpingowe oraz stanowiącego o ostatecznym pobraniu cła tymczasowego
    nałożonego na przywóz niektórych rodzajów obuwia ze skórzanymi cholewkami
    pochodzących z Chińskiej Republiki Ludowej i wyprodukowanych przez Brosmann
    Footwear (HK) Ltd, Seasonable Footwear (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou)
    Ltd, Risen Footwear (HK) Co Ltd i Zhejiang Aokang Shoes Co. Ltd'
  type: main
- language: pt
  script: Latn
  content: '2014/149/UE: Decisão de Execução do Conselho, de 18 de março de 2014
    , que rejeita a proposta de regulamento de execução do Conselho que reinstitui
    um direito anti-dumping definitivo e estabelece a cobrança definitiva do direito
    provisório instituído sobre as importações de determinado tipo de calçado
    com a parte superior de couro natural originário da República Popular da China
    e produzido pelas empresas Brosmann Footwear (HK) Ltd, Seasonable Footwear (Zhongshan)
    Ltd, Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK) Co Ltd e Zhejiang
    Aokang Shoes Co. Ltd'
  type: main
- language: ro
  script: Latn
  content: '2014/149/UE: Decizia de punere în aplicare a Consiliului din 18 martie
    2014 de respingere a propunerii de Regulament de punere în aplicare de reinstituire
    a unei taxe antidumping definitive și de percepere definitivă a taxei provizorii
    instituite asupra importurilor de anumite tipuri de încălțăminte cu fețe
    din piele originare din Republica Populară Chineză și produse de Brosmann Footwear
    (HK) Ltd, Seasonable Footwear (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou) Ltd,
    Risen Footwear (HK) Co Ltd și Zhejiang Aokang Shoes Co. Ltd'
  type: main
- language: sk
  script: Latn
  content: '2014/149/EÚ: Vykonávacie rozhodnutie Rady z 18. marca 2014 , ktorým
