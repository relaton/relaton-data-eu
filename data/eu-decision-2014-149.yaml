    izvedbene uredbe o ponovni uvedbi dokončne protidampinške dajatve in dokončnem
    pobiranju začasne dajatve na uvoz določene obutve z zgornjim delom iz usnja
    s poreklom iz Ljudske republike Kitajske, ki jo proizvajajo podjetja Brosmann
    Footwear (HK) Ltd, Seasonable Footwear (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou)
    Ltd, Risen Footwear (HK) Co Ltd in Zhejiang Aokang Shoes Co. Ltd'
