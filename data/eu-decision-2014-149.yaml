  script: Latn
  content: '2014/149/UE: Decisione di esecuzione del Consiglio, del 18 marzo 2014
    , che respinge la proposta di regolamento di esecuzione che reistituisce un dazio
    antidumping definitivo e dispone la riscossione definitiva del dazio provvisorio
    istituito sulle importazioni di alcuni tipi di calzature con tomaie di cuoio originarie
    della Repubblica popolare cinese e fabbricate da Brosmann Footwear (HK) Ltd, Seasonable
    Footwear (Zhongshan) Ltd, Lung Pao Footwear (Guangzhou) Ltd, Risen Footwear (HK)
    Co Ltd e Zhejiang Aokang Shoes Co. Ltd'
  type: main
- language: lv
  script: Latn
  content: '2014/149/ES: Padomes Īstenošanas lēmums ( 2014. gada 18. marts ), ar
    ko noraida priekšlikumu Īstenošanas regulai, ar kuru atkārtoti nosaka galīgo
    antidempinga maksājumu un galīgi iekasē pagaidu maksājumu, ko piemēro tādu
    konkrētu Ķīnas Tautas Republikas izcelsmes apavu importam, kuriem ir ādas
    virsa un kurus ražo Brosmann Footwear (HK) Ltd , Seasonable Footwear (Zhongshan)
    Ltd , Lung Pao Footwear (Guangzhou) Ltd , Risen Footwear (HK) Co Ltd un Zhejiang
    Aokang Shoes Co. Ltd'
  type: main
