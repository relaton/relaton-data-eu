    nustatomas galutinis antidempingo muitas ir galutinai surenkamas laikinasis muitas,
    nustatytas importuojamai tam tikrai Kinijos Liaudies Respublikos kilmės avalynei
    su batviršiais iš odos, kurią pagamino bendrovės Brosmann Footwear (HK) Ltd
