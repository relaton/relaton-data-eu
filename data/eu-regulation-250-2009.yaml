  script: Latn
  content: Commission Regulation (EC) No 250/2009 of 11 March 2009 implementing Regulation
    (EC) No 295/2008 of the European Parliament and of the Council as regards the
    definitions of characteristics, the technical format for the transmission of data,
    the double reporting requirements for NACE Rev.1.1 and NACE Rev.2 and derogations
    to be granted for structural business statistics
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 250/2009 de la Commission du 11 mars 2009 portant application
    du règlement (CE) n o 295/2008 du Parlement européen et du Conseil en ce qui
    concerne les définitions des caractéristiques, le format technique de transmission
    des données, les exigences en matière de double déclaration selon la NACE Rév.
    1.1 et la NACE Rév. 2 et les dérogations à accorder pour les statistiques structurelles
    sur les entreprises
  type: main
- language: de
  script: Latn
