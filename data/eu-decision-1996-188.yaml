title:
- language: en
  script: Latn
  content: '96/188/EC: Commission Decision of 20 February 1996 modifying for the second
    time Decision No 95/33/EC approving parts of the Finnish programme for the implementation
    of Articles 138 to 140 of the Act concerning the conditions of accession of the
    Republic of Austria, the Republic of Finland and the Kingdom of Sweden (Only the
    Finnish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/188/CE: Décision de la Commission, du 20 février 1996, portant seconde
    modification de la décision 95/33/CE approuvant certains volets du programme
    finlandais d''application des articles 138 à 140 de l''acte concernant les conditions
    d''adhésion de la République d''Autriche, de la République de Finlande et du
    Royaume de Suède (Le texte en langue finnoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/188/EG: Entscheidung der Kommission vom 20. Februar 1996 zur zweiten
    Änderung der Entscheidung 95/33/EG zur Genehmigung von Teilen des finnischen
    Programms zur Anwendung der Artikel 138 bis 140 der Akte über die Bedingungen
    für den Beitritt Österreichs, Finnlands und Schwedens (Nur der finnische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/188/EF: Kommissionens beslutning af 20. februar 1996 om ænden ændring
    af beslutning 95/33/EF om godkendelse af dele af det finske program for gennemførelse
    af artikel 138, 139 og 140 i akten vedrørende vilkårene for Republikken Østrigs,
    Republikken Finlands og Kongeriget Sveriges tiltrædelse (Kun den finske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/188/ΕΚ: Απόφαση της Επιτροπής, της 20ής Φεβρουαρίου
    1996, περί τροποποιήσεως για δεύτερη φορά της
    απόφασης 95/33/ΕΚ για την έγκριση ορισμένων τμημάτων
    του φινλανδικού προγράμματος για την υλοποίηση
    των άρθρων 138 έως 140 της πράξης περί των όρων
    προσχωρήσεως της Δημοκρατίας της Αυστρίας,
    της Δημοκρατίας της Φινλανδίας και του Βασιλείου
    της Σουηδίας (Το κείμενο στη φινλανδική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/188/EY: Komission päätös, tehty 20 päivänä helmikuuta 1996, Suomen
    ohjelman osien hyväksymisestä asiakirjan Itävallan tasavallan, Suomen tasavallan
    ja Ruotsin kuningaskunnan liittymisehdoista 138-140 artiklan täytäntöönpanemiseksi
    tehdyn päätöksen 95/33/EY muuttamisesta toisen kerran (Ainoastaan suomenkielinen
    teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/188/CE: Decisione della Commissione, del 20 febbraio 1996, che modifica
    per la seconda volta la decisione 95/33/CE recante approvazione parziale del programma
    finlandese di attuazione degli articoli 138, 139 e 140 dell''atto relativo alle
    condizioni di adesione dell''Austria, della Finlandia e della Svezia (Il testo
    in lingua finlandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/188/EG: Beschikking van de Commissie van 20 februari 1996 houdende
