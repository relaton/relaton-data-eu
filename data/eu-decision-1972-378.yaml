title:
- language: en
  script: Latn
  content: '72/378/EEC: Council Decision of 6 November 1972 authorizing the Italian
    Government to extend certain time-limits laid down in Articles 6 and 9 of Regulation
    (EEC) No 1191/69 on action by Member States concerning the obligations inherent
    in the concept of a public service in transport by rail, road and inland waterway'
  type: main
- language: fr
  script: Latn
  content: '72/378/CEE: Décision du Conseil, du 6 novembre 1972, autorisant le gouvernement
    italien à proroger certains délais prévus par les articles 6 et 9 du règlement
    (CEE) n° 1191/69 relatif à l'' action des États membres en matière d'' obligations
    inhérentes à la notion de service public dans le domaine des transports par
    chemin de fer, par route et par voie navigable'
  type: main
- language: de
  script: Latn
  content: '72/378/EWG: Entscheidung des Rates vom 6. November 1972 zur Ermächtigung
    der italienischen Regierung zur Verlängerung einiger Fristen gemäß den Artikeln
    6 und 9 der Verordnung (EWG) Nr. 1191/69 über das Vorgehen der Mitgliedstaaten
    bei mit dem Begriff des öffentlichen Dienstes verbundenen Verpflichtungen auf
    dem Gebiet des Eisen- bahn-, Straßen- und Binnenschiffsverkehrs'
  type: main
- language: da
  script: Latn
  content: '72/378/EØF: Rådets beslutning af 6. november 1972 om adgang for den
    italienske regering til at forlænge visse frister fastsat i artiklerne 6 og 9,
    i forordning (EØF) nr. 1191/69 om medlemsstaternes fremgangsmåde med hensyn
    til de med begrebet offentlig tjeneste forbundne forpligtelser inden for sektoren
    for transporter med jernbane, ad landeveje og sejlbare vandveje'
  type: main
- language: it
  script: Latn
  content: '72/378/CEE: Decisione del Consiglio, del 6 novembre 1972, che autorizza
    il governo italiano a prorogare taluni termini di cui agli articoli 6 e 9 del
    regolamento (CEE) n. 1191/69 relativo all'' azione degli Stati membri in materia
    di obblighi inerenti alla nozione di servizio pubblico nel settore dei trasporti
    per ferrovia, su strada e per via navigabile'
  type: main
- language: nl
  script: Latn
  content: '72/378/EEG: Beschikking van de Raad van 6 november 1972 waarbij de Italiaanse
    Regering wordt gemachtigd tot verlenging van bepaalde termijnen die zijn vastgesteld
    in de artikelen 6 en 9 van Verordening (EEG) nr. 1191/69 betreffende het optreden
    van de Lid-Staten ten aanzien van met het begrip openbare dienst verbonden verplichtingen
    op het gebied van het vervoer per spoor, over de weg en over de binnenwateren'
  type: main
