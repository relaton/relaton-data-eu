  content: Council Regulation (EEC) No 2057/86 of 25 June 1986 amending for the third
    time Regulation (EEC) No 3721/85 fixing, for certain fish stocks and groups of
    fish stocks, the total allowable catches for 1986 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2057/86 du Conseil du 25 juin 1986 portant troisième
    modification du règlement (CEE) n° 3721/85 fixant, pour certains stocks ou groupes
    de stocks de poissons, les totaux admissibles de captures pour 1986 et certaines
    conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
