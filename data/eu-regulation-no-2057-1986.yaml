    und bestimmter Fangbedingungen hinsichtlich der zulässigen Gesamtfangmengen für
    bestimmte Fischbestände oder Bestandsgruppen für 1986
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2057/86 af 25. juni 1986 om tredje ændring
    af forordning (EØF) nr. 3721/85 om fastsættelse for 1986 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande i Fællesskabets
    fiskerizone samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
