  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2057/86 del Consiglio del 25 giugno 1986 recante terza
    modifica del regolamento (CEE) n. 3721/85 che fissa, per alcune popolazioni e
    gruppi di popolazioni ittiche, il totale delle catture ammissibile per il 1986
    ed alcune condizioni cui è soggetta la pesca del totale delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2057/86 van de Raad van 25 juni 1986 houdende derde
    wijziging van Verordening (EEG) nr. 3721/85 inzake de vaststelling van de voor
    1986 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2057/86 do Conselho de 25 de Junho de 1986 que altera
