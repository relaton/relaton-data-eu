id: EUDecision1980166
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/166/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to tableware and other articles of a
    kind commonly used for domestic or toilet purposes, of porcelain or china (including
    biscuit porcelain and parian) and of other kinds of pottery, falling within heading
    Nos 69.11 and 69.12 of the Common Customs Tariff, originating in Japan and in
    free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/166/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    la République française à exclure du traitement communautaire la vaisselle
    et les articles de ménage ou de toilette en porcelaine et en autres matières
    céramiques, des positions 69.11 et 69.12 du tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres Etats membres (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/166/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliches Geschirr, Haushalts- und Toilettengegenstände,
    aus Porzellan und anderen keramischen Stoffen, der Tarifnummern 69.11 und 69.12
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/166/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage bordservice
    samt husholdnings- og toiletartikler, af porcelæn og af andet keramisk materiale,
    som henhører under pos. 69.11 og 69.12 i den fælles toldtarif, har oprindelse
    i Japan og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/166/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario vasellame e oggetti
    di uso domestico o da toletta, di porcellana e di altre materie ceramiche, delle
    voci nn. 69.11 e 69.12 della tariffa doganale comune, originari del Giappone e
    messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/166/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van porselein en van andere keramische stoffen, van de posten 69.11 en 69.12 van
    het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
