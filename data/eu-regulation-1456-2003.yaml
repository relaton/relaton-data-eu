    niektóre szczególne środki ograniczające skierowane przeciwko niektórym osobom
    i podmiotom związanym z Osamą bin Ladenem, siecią Al-Kaida i Talibami i uchylające
    rozporządzenie Rady (WE) nr 467/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1456/2003 da Comissão, de 14 de Agosto de 2003,
    que altera pela vigésima primeira vez o Regulamento (CE) n.° 881/2002 que institui
    certas medidas restritivas específicas contra determinadas pessoas e entidades
    associadas a Osama Bin Laden, à rede Al-Qaida e aos Talibã, e que revoga o Regulamento
    (CE) n.° 467/2001 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1456/2003 al Comisiei din 14 august 2003 de efectuare
    a celei de-a douăzeci și una modificări a Regulamentului (CE) nr. 881/2002
    al Consiliului de instituire a unor măsuri restrictive specifice împotriva anumitor
    persoane și entități care au legătură cu Osama ben Laden, cu rețeaua Al-Qaida
    și cu talibanii și de abrogare a Regulamentului (CE) nr. 467/2001 al Consiliului
  type: main
