    određenih osoba i subjekata povezanih s Osamom bin Ladenom, mrežom Al-Qaidom
    i talibanima te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1456/2003/EK rendelete (2003. augusztus 14.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet huszonegyedik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1456/2003 della Commissione, del 14 agosto 2003, recante
    ventunesima modifica del regolamento (CE) n. 881/2002 che impone specifiche misure
    restrittive nei confronti di determinate persone ed entità associate a Osama
    bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE) n. 467/2001
    del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1456/2003 (2003. gada 14. augusts), ar kuru divdesmit
    pirmo reizi groza Padomes Regulu (EK) Nr. 881/2002, ar ko nosaka konkrētus, īpašus,
    ierobežojošus, pret noteiktām personām un organizācijām, kuras saistītas
    ar Osamu Bin Ladenu, organizācijas Al-Qaida tīklu un Taliban, vērstus pasākumus
    un ar ko atceļ Padomes Regulu (EK) Nr. 467/2001
  type: main
- language: lt
  script: Latn
