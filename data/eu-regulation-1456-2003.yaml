    ċerti miżuri li jirrestrinġu kontra persuni u entitajiet assoċjati ma' Usama
    bin Laden, in-network ta' l-Al-Qaida u t-Taliban, u li jħassar ir-Regolament
    tal-Kunsill (KE) Numru 467/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1456/2003 van de Commissie van 14 augustus 2003 tot
