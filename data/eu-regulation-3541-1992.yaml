title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3541/92 of 7 December 1992 prohibiting the
    satisfying of Iraqi claims with regard to contracts and transactions, the performance
    of which was affected by United Nations Security Council Resolution 661 (1990)
    and related resolutions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3541/92 du Conseil, du 7 décembre 1992, interdisant
    de faire droit aux demandes irakiennes relatives aux contrats et opérations dont
    l'exécution a été affectée par la résolution 661 (1990) du Conseil de sécurité
    des Nations unies et par les résolutions connexes
  type: main
- language: de
  script: Latn
