  content: Commission Regulation (EU) 2015/400 of 25 February 2015 amending Annexes
    II, III and V to Regulation (EC) No 396/2005 of the European Parliament and of
    the Council as regards maximum residue levels for bone oil, carbon monoxide, cyprodinil,
    dodemorph, iprodione, metaldehyde, metazachlor, paraffin oil (CAS 64742-54-7),
    petroleum oils (CAS 92062-35-6) and propargite in or on certain products
  type: main
