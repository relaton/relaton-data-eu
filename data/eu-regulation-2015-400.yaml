    les annexes II, III et V du règlement (CE) n ° 396/2005 du Parlement européen
    et du Conseil en ce qui concerne les limites maximales applicables aux résidus
    d'huile d'os, de monoxyde de carbone, de cyprodinil, de dodémorphe, d'iprodione,
    de métaldéhyde, de métazachlore, d'huile de paraffine (CAS 64742-54-7), d'huiles
    de pétrole (CAS 92062-35-6) et de propargite présents dans ou sur certains produits
  type: main
