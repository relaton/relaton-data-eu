  content: '81/460/EEC: Commission Decision of 10 June 1981 establishing that the
    apparatus described as ''Gilford photoacoustic spectrometer, model R-1500'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/460/CEE: Décision de la Commission, du 10 juin 1981, constatant que
    l''importation de l''appareil dénommé "Gilford-Photoacoustic Spectrometer, model
    R-1500" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
