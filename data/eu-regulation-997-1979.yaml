title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 997/79 of 21 May 1979 re-establishing the
    levying of customs duties on melamine, falling within subheading 29.35 ex Q and
    originating in Yugoslavia, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 997/79 de la Commission, du 21 mai 1979, portant rétablissement
    de la perception des droits de douane applicables à la mélanine, de la sous-position
    tarifaire 29.35 ex Q, originaire de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 997/79 der Kommission vom 21. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Melamin der Tarifstelle 29.35 ex Q, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordninq (EØF) nr. 997/79 af 21. maj 1979 om genindførelse
    af opkrævning af toldafgifter for melamin, henhørende under pos. 29.35 ex Q
    i den fælles toldtarif, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 997/79 della Commissione, del 21 maggio 1979, che
    ripristina la riscossione dei dazi doganali applicabili alla melammina, della
    sottovoce 29.35 ex Q della tariffa doganale comune, originaria della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 997/79 van de Commissie van 21 mei 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op melamine,
    van post 29.35 ex Q, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
