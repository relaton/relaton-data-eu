  script: Latn
  content: Regolamento di esecuzione (UE) n. 771/2014 della Commissione, del 14 luglio
    2014, recante disposizioni a norma del regolamento (UE) n. 508/2014 del Parlamento
    europeo e del Consiglio relativo al Fondo europeo per gli affari marittimi e la
    pesca per quanto riguarda il modello per i programmi operativi, la struttura dei
