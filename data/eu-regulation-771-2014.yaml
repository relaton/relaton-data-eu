    saturu un par minimālajām prasībām, kuras attiecina uz novērtēšanas plānu,
    kas iesniedzams Eiropas Jūrlietu un zivsaimniecības fonda darbības satvarā
  type: main
- language: lt
  script: Latn
  content: 2014 m. liepos 14 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 771/2014,
