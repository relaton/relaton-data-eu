    sklada za pomorstvo in ribištvo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) no 771/2014 de la Comisión, de 14 de julio
    de 2014, por el que se establecen, de conformidad con el Reglamento (UE) no 508/2014
    del Parlamento Europeo y del Consejo, relativo al Fondo Europeo Marítimo y de
