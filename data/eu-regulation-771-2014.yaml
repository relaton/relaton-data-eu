  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 771/2014 van de Commissie van 14 juli 2014
    tot vaststelling van voorschriften overeenkomstig Verordening (EU) nr. 508/2014
    van het Europees Parlement en de Raad inzake het Europees Fonds voor maritieme
    zaken en visserij betreffende het model voor operationele programma's, de structuur
    van de plannen voor de compensatie van de extra kosten van de marktdeelnemers
    voor het vissen, het kweken, de verwerking en de afzet van bepaalde visserij-
    en aquacultuurproducten van de ultraperifere gebieden, het model voor de indiening
    van financiële gegevens, de inhoud van de ex-ante-evaluatieverslagen en de minimumeisen
    voor het in het kader van het Europees Fonds voor maritieme zaken en visserij
    in te dienen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 771/2014 z dnia 14 lipca 2014
    r. ustanawiające zasady, zgodnie z rozporządzeniem Parlamentu Europejskiego
    i Rady (UE) nr 508/2014 w sprawie Europejskiego Funduszu Morskiego i Rybackiego,
    w odniesieniu do modelu dla programów operacyjnych, struktury planów wyrównania
    dodatkowych kosztów ponoszonych przez podmioty gospodarcze zajmujące się połowami,
    hodowlą, przetwarzaniem i wprowadzaniem do obrotu niektórych produktów rybołówstwa
    i akwakultury z regionów najbardziej oddalonych, wzoru przekazywania danych finansowych,
    treści sprawozdań z oceny ex ante oraz minimalnych wymogów dotyczących planu
    oceny, jakie należy przedłożyć w ramach Europejskiego Funduszu Morskiego i
    Rybackiego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n.o 771/2014 da Comissão, de 14 de julho
    de 2014, que estabelece, em conformidade com o Regulamento (UE) n.o 508/2014 do
    Parlamento Europeu e do Conselho relativo ao Fundo Europeu dos Assuntos Marítimos
    e das Pescas, regras relativas ao modelo para programas operacionais, à estrutura
    dos planos de compensação dos custos suplementares suportados pelos operadores
    nas atividades de pesca, cultura, transformação e comercialização de certos
    produtos da pesca e da aquicultura das regiões ultraperiféricas, ao modelo para
    a transmissão de dados financeiros, ao conteúdo dos relatórios de avaliação
    ex ante e aos requisitos mínimos para o plano de avaliação a apresentar no
    âmbito do Fundo Europeu dos Assuntos Marítimos e das Pescas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 771/2014 al Comisiei din 14
    iulie 2014 de stabilire a unor norme în conformitate cu Regulamentul (UE) nr.
    508/2014 al Parlamentului European și al Consiliului privind Fondul european
    pentru pescuit și afaceri maritime în ceea ce privește modelul pentru programele
    operaționale, structura planurilor pentru acordarea de compensații pentru costurile
    suplimentare suportate de operatorii implicați în pescuit, în acvacultură,
    în prelucrarea și în comercializarea anumitor produse obținute din pescuit
    și din acvacultură din regiunile ultraperiferice, modelul de transmitere a datelor
    financiare, conținutul rapoartelor de evaluare ex ante, precum și cerințele
    minime privind planul de evaluare care urmează să fie prezentat în conformitate
    cu Fondul european pentru pescuit și afaceri maritime
  type: main
