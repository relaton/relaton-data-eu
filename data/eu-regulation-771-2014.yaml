title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 771/2014 of 14 July 2014 laying
    down rules pursuant to Regulation (EU) No 508/2014 of the European Parliament
    and of the Council on the European Maritime and Fisheries Fund with regard to
    the model for operational programmes, the structure of the plans for the compensation
    of additional costs incurred by operators in the fishing, farming, processing
    and marketing of certain fishery and aquaculture products from the outermost regions,
    the model for the transmission of financial data, the content of the ex ante evaluation
    reports and the minimum requirements for the evaluation plan to be submitted under
    the European Maritime and Fisheries Fund
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) no 771/2014 de la Commission du 14 juillet
    2014 fixant, en application du règlement (UE) no 508/2014 du Parlement européen
    et du Conseil relatif au Fonds européen pour les affaires maritimes et la pêche,
    les règles concernant le modèle destiné aux programmes opérationnels, la structure
    des plans de compensation des surcoûts que subissent les opérateurs lors de
    la pêche, de l'élevage, de la transformation et de l'écoulement de certains
    produits de la pêche et de l'aquaculture provenant des régions ultrapériphériques,
    le modèle à utiliser pour la transmission des données financières, le contenu
    des rapports d'évaluation ex ante et les exigences minimales applicables au plan
    d'évaluation à présenter dans le cadre du Fonds européen pour les affaires
    maritimes et la pêche
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 771/2014 der Kommission vom 14. Juli
    2014 zur Festlegung von Vorschriften gemäß der Verordnung (EU) Nr. 508/2014
    des Europäischen Parlaments und des Rates über den Europäischen Meeres- und
    Fischereifonds im Hinblick auf das Muster für operationelle Programme, auf den
    Aufbau der Ausgleichspläne für Mehrkosten, die Marktteilnehmern bei Fischfang,
