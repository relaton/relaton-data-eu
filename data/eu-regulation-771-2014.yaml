    vynaložených provozovateli v odvětví rybolovu, chovu, zpracování a uvádění
    na trh v případě určitých produktů rybolovu a akvakultury z nejvzdálenějších
    regionů, vzor pro předávání finančních údajů, obsah zpráv o předběžném
    hodnocení a minimální požadavky na plán hodnocení, předkládané v rámci
    Evropského námořního a rybářského fondu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 771/2014 af 14. juli 2014
    om fastlæggelse i henhold til Europa-Parlamentets og Rådets forordning (EU)
