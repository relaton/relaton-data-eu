    ktorý sa má predložiť v rámci Európskeho námorného a rybárskeho fondu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 771/2014 z dne 14. julija 2014 o pravilih
    v skladu z Uredbo (EU) št. 508/2014 Evropskega parlamenta in Sveta o Evropskem
