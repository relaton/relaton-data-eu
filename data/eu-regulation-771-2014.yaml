    aus Gebieten in äußerster Randlage entstehen, auf das Muster für die Übermittlung
    von Finanzdaten, auf den Inhalt der Ex-ante-Bewertungsberichte und auf die Mindestanforderungen
    für den im Rahmen des Europäischen Meeres- und Fischereifonds vorzulegenden
    Bewertungsplan
  type: main
- language: bg
  script: Cyrl
