id: EURegulation14121975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1412/75 of the Commission of 30 May 1975 re-establishing
    the levying of the customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, not optically worked or of optical glass, falling
    within subheading 70.14 A II, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1412/75 de la Commission, du 30 mai 1975, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, de la sous-position tarifaire
    70.14 A II, originaire de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1412/75 der Kommission vom 30. Mai 1975 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, für Signalvorrichtungen oder
    zu optischen Zwecken, nicht aus optischem Glas, nicht optisch bearbeitet, der
    Tarifstelle 70.14 A II, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1412/75 af 30. maj 1975 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, refleksglas, optiske
    artikler af glas, hverken optisk bearbejdet eller af optisk glas, under underposition
    70.14 A II, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1412/75 della Commissione, del 30 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, della sottovoce doganale 70.14 A II, originarie
    della Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1412/75 van de Commissie van 30 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas; optische elementen van gewoon glas,
    niet optisch bewerkt, van onderverdeling 70.14 A II, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
  type: main
