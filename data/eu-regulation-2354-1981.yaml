title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2354/81 of 14 August 1981 re-establishing
    the levying of customs duties on choline chloride, falling within subheading 29.24
    ex B and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2354/81 de la Commission, du 14 août 1981, portant
    rétablissement de la perception des droits de douane applicables au chlorure
    de choline, de la sous-position 29.24 ex B du tarif douanier commun, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2354/81 der Kommission vom 14. August 1981 zur Wiedereinführung
    der Erhebung der Zölle für Cholinchlorid der Tarifstelle 29.24 ex B mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2354/81 af 14. august 1981 om genindførelse
    af opkrævning af told for cholinchlorid henhørende under pos. 29.24 ex B og
    med oprindelse i Rumænien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2354/81 τής Επιτροπής
    τής 14ης Αυγούστου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τό χλωρίδιο τής χολίνης
    τής δασμολογικής διακρίσεως 29. 24 ex B καταγωγής
    Pουμανίας δικαιούχου τών προβλεπομένων από
    τόν κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2354/81 della Commissione, del 14 agosto 1981, che
    ripristina la riscossione dei dazi doganali applicabili al cloruro di colina,
    della sottovoce 29.24 ex B della tariffa doganale comune, originario della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2354/81 van de Commissie van 14 augustus 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op cholinechloride
    van postonderverdeling 29.24 ex B van oorsprong uit Roemenië, waarvoor de in
    Verordening (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn verleend
