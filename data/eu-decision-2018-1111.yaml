---
id: EUDecision20181111
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1111 of 3 August 2018 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified maize MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3
    × MON-ØØ6Ø3-6) and genetically modified maize combining two of the events
    MON 87427, MON 89034 and NK603, and repealing Decision 2010/420/EU (notified under
    document C(2018) 5014)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1111 de la Commission du 3 août 2018
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6),
    consistant en ce maïs ou produits à partir de celui-ci, et du maïs génétiquement
    modifié combinant deux des événements MON 87427, MON 89034 et NK603, et abrogeant
    la décision 2010/420/UE [notifiée sous le numéro C(2018) 5014]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1111 der Kommission vom 3. August 2018
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 ×
    MON-ØØ6Ø3-6) enthalten, aus ihm bestehen oder aus ihm gewonnen werden, und
    von genetisch veränderten Maissorten, in denen zwei der Sorten MON 87427, MON
    89034 und NK603 kombiniert werden, und zur Aufhebung des Beschlusses 2010/420/EU
    (Bekannt gegeben unter Aktenzeichen C(2018) 5014)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/1111 на Комисията
    от 3 август 2018 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3
    × MON-ØØ6Ø3-6), и на генетично модифицирана царевица,
    комбинираща двете събития MON 87427, MON 89034 и NK603,
    и за отмяна на Решение 2010/420/ЕС (нотифицирано
    под номер С(2018) 5014)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/1111 ze dne 3. srpna 2018 o povolení
    uvádění produktů, které obsahují geneticky modifikovanou kukuřici MON 87427
    × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6) a geneticky
    modifikovanou kukuřici kombinující dvě z událostí MON 87427, MON 89034 a
    NK603, sestávají z nich nebo jsou z nich vyrobeny, na trh a o zrušení rozhodnutí
    2010/420/EU (oznámeno pod číslem C(2018) 5014)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/1111 af 3. august 2018
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret MON 87427 × MON 89034 × NK603-majs (MON-87427-7
    × MON-89Ø34-3 × MON-ØØ6Ø3-6) og genetisk modificeret majs, der kombinerer
    to af begivenhederne MON 87427, MON 89034 og NK603, og om ophævelse af afgørelse
    2010/420/EU (meddelt under nummer C(2018) 5014)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/1111 της Επιτροπής,
    της 3ης Αυγούστου 2018, για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6)
    και γενετικώς τροποποιημένο αραβόσιτο που
    συνδυάζει δύο από τα συμβάντα MON 87427, MON 89034 και
    NK603, και για την κατάργηση της απόφασης 2010/420/ΕΕ
    [κοινοποιηθείσα υπό τον αριθμό C(2018) 5014]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/1111, 3. august 2018, millega lubatakse
    lasta turule geneetiliselt muundatud maisi MON 87427 × MON 89034 × NK603 (MON-87427-7
    × MON-89Ø34-3 × MON-ØØ6Ø3-6) sisaldavaid, sellest koosnevaid või sellest
    toodetud tooteid ja geneetiliselt muundatud maisi, milles on kombineeritud kaks
    MON 87427, MON 89034 ja NK603 transformatsioonidest, ning millega tunnistatakse
    kehtetuks otsus 2010/420/EL (teatavaks tehtud numbri C(2018) 5014 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/1111, annettu 3 päivänä
    elokuuta 2018, muuntogeenistä maissia MON 87427 × MON 89034 × NK603 (MON-87427-7
    × MON-89Ø34-3 × MON-ØØ6Ø3-6) sisältävien, siitä koostuvien tai siitä
    valmistettujen tuotteiden sekä muunnostapahtumista MON 87427, MON 89034 ja NK603
    kahden yhdistelmänä saadun muuntogeenisen maissin markkinoille saattamisen sallimisesta
    ja päätöksen 2010/420/EU kumoamisesta (tiedoksiannettu numerolla C(2018) 5014)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/1111 оd 3. kolovoza 2018. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6), ili
    se sastoje ili su proizvedeni od njega, i genetski modificirani kukuruz u kojem
    se kombiniraju dvije od promjena MON 87427, MON 89034 i NK603, i o stavljanju
    izvan snage Odluke 2010/420/EU (priopćeno pod brojem dokumenta C(2018) 5014)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/1111 végrehajtási határozata (2018. augusztus
    3.) a géntechnológiával módosított MON 87427 × MON 89034 × NK603 (MON-87427-7
    × MON-89Ø34-3 × MON-ØØ6Ø3-6) kukoricát és a géntechnológiával módosított,
    az MON 87427, MON 89034 és NK603 fajtájú kukoricák közül kettőt ötvöző
    kukoricát tartalmazó, abból álló vagy abból előállított termékek forgalomba
    hozatalának engedélyezéséről, valamint a 2010/420/EU határozat hatályon
    kívül helyezéséről (az értesítés a C(2018) 5014. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/1111 della Commissione, del 3 agosto
    2018, che autorizza l'immissione in commercio di prodotti contenenti, costituiti
    o derivati dal granturco geneticamente modificato MON 87427 × MON 89034 × NK603
    (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6) e dal granturco geneticamente
    modificato che combina due degli eventi MON 87427, MON 89034 e NK603, e che abroga
    la decisione 2010/420/UE [notificata con il numero C(2018) 5014]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/1111 (2018. gada 3. augusts),
    ar ko atļauj laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu
    MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6)
    un ģenētiski modificētu kukurūzu, kurā kombinēti divi no gadījumiem MON
    87427, MON 89034 un NK603, no tās sastāv vai ir no tās ražoti, un atceļ Lēmumu
    2010/420/ES (izziņots ar dokumenta numuru C(2018) 5014)
  type: main
- language: lt
  script: Latn
  content: 2018 m. rugpjūčio 3 d. Komisijos įgyvendinimo sprendimas (ES) 2018/1111,
    kuriuo leidžiama pateikti rinkai produktus, kurių sudėtyje yra genetiškai
    modifikuotų MON 87427 × MON-89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6)
    kukurūzų ar genetiškai modifikuotų kukurūzų, sudarytų iš dviejų iš MON
    87427, MON 89034 ir NK603 genetinių modifikacijų derinių, kurie iš šių kukurūzų
    sudaryti ar pagaminti, ir panaikinamas Sprendimas 2010/420/ES (pranešta dokumentu
    Nr. C(2018) 5014)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/1111 tat-3 ta'
    Awwissu 2018 li tawtorizza t-tqegħid fis-suq ta' prodotti li jkun fihom il-qamħirrum
    ġenetikament modifikat MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3
    × MON-ØØ6Ø3-6), ikunu jikkonsistu minnu jew li jkunu magħmulin minnu, u l-qamħirrum
    ġenetikament modifikat li jgħaqqad tnejn mill-avvenimenti MON 87427, MON 89034
    u NK603, u li tħassar id-Deċiżjoni 2010/420/UE (notifikata bid-dokument C(2018)
    5014)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/1111 van de Commissie van 3 augustus 2018
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6)
    en genetisch gemodificeerde maisrassen die twee van de transformatiestappen MON
    87427, MON 89034 en NK603 combineren, en tot intrekking van Besluit 2010/420/EU
    (Kennisgeving geschied onder nummer C(2018) 5014)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/1111 z dnia 3 sierpnia 2018 r. zezwalająca
    na wprowadzenie do obrotu produktów zawierających zmodyfikowaną genetycznie
    kukurydzę MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6)
    i rodzaje zmodyfikowanej genetycznie kukurydzy łączące dwie spośród modyfikacji
    MON 87427, MON 89034 i NK603 oraz produktów składających się z wymienionych
    rodzajów zmodyfikowanej genetycznie kukurydzy lub z niej wyprodukowanych oraz
    uchylająca decyzję 2010/420/UE (notyfikowana jako dokument nr C(2018) 5014)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/1111 da Comissão, de 3 de agosto de 2018,
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por, ou produzidos a partir de milho geneticamente modificado MON 87427 × MON
    89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6) e de milho geneticamente
    modificado que combina dois dos eventos MON 87427, MON 89034 e NK603, e que revoga
    a Decisão 2010/420/UE [notificada com o número C(2018) 5014]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/1111 a Comisiei din 3 august 2018
    de autorizare a introducerii pe piață a produselor care conțin, constau în
    sau sunt fabricate din porumb modificat genetic MON 87427 × MON 89034 × NK603
    (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6) și din porumbul modificat genetic
    obținut din combinarea a două dintre evenimentele MON 87427, MON 89034 și NK603
    și de abrogare a Deciziei 2010/420/UE [notificată cu numărul C(2018) 5014]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/1111 z 3. augusta 2018, ktorým
    sa povoľuje umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu MON 87427 × MON 89034 × NK603 (MON-89Ø34-3 × MON-ØØ6Ø3-6 × MON-87427-7)
    a geneticky modifikovanú kukuricu obsahujúcu kombináciu dvoch z genetických
    modifikácií MON 87427, MON 89034 a NK603, sú z nich zložené alebo vyrobené,
    a ktorým sa zrušuje rozhodnutie 2010/420/EÚ [oznámené pod číslom C(2018)
    5014]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/1111 z dne 3. avgusta 2018 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON 87427 ×
    MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6) in gensko spremenjeno
    koruzo, v kateri sta združena dva od transformacijskih dogodkov MON 87427, MON
    89034 in NK603, so iz njiju sestavljeni ali proizvedeni, ter razveljavitvi Sklepa
    2010/420/EU (notificirano pod dokumentarno številko C(2018) 5014)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/1111 de la Comisión, de 3 de agosto
    de 2018, por la que se autoriza la comercialización de productos que contengan,
    se compongan o se hayan producido a partir de maíz modificado genéticamente
    MON 87427 × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6)
    y de maíz modificado genéticamente que combine dos de los eventos MON 87427,
    MON 89034 y NK 603, y por la que se deroga la Decisión 2010/420/UE [notificada
    con el número C(2018) 5014]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/1111 av den 3 augusti 2018
    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av den genetiskt modifierade majsen MON 87427
    × MON 89034 × NK603 (MON-87427-7 × MON-89Ø34-3 × MON-ØØ6Ø3-6) och av genetiskt
    modifierad majs som kombinerar två av händelserna MON 87427, MON 89034 och NK603,
    och om upphävande av beslut 2010/420/EU [delgivet med nr C(2018) 5014]
