  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 937/2012, 12. oktoober 2012 , millega
    muudetakse määruseid (EÜ) nr 1122/2009 ja (EL) nr 65/2011 seoses meetodiga,
    millega määratakse kindlaks kohaldatav intressimäär alusetult makstud summadele,
    mida nõutakse tagasi toetusesaajatelt, kes on saanud toetust nõukogu määruse
    (EÜ) nr 73/2009 kohaselt põllumajandustootjate suhtes kohaldatavate otsetoetuskavade
    alusel või kes on saanud nõukogu määruse (EÜ) nr 1698/2005 kohaselt maaelu
    arengu toetust või nõukogu määruse (EÜ) nr 1234/2007 kohaselt veinisektori
    toetust
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 937/2012, annettu 12 päivänä
    lokakuuta 2012 , asetusten (EY) N:o 1122/2009 ja (EU) N:o 65/2011 muuttamisesta
    sellaisiin aiheettomasti maksettuihin, neuvoston asetuksen (EY) N:o 73/2009 mukaisten
    suorien tukien järjestelmien mukaista tukea, neuvoston asetuksen (EY) N:o 1698/2005
    mukaista maaseudun kehittämistukea tai neuvoston asetuksen (EY) N:o 1234/2007
    mukaista viinialan tukea saaneilta viljelijöiltä takaisin perittäviin tukiin
    sovellettavan koron määrittämismenetelmän osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 937/2012 od 12. listopada 2012. o izmjeni
    uredaba (EZ) br. 1122/2009 i (EU) br. 65/2011 vezano uz način utvrđivanja kamata
    koje se primjenjuju na nedospjela plaćanja koja će se nadoknaditi od korisnika
    programa izravne potpore za poljoprivrednike na temelju Uredbe Vijeća (EZ) br.
    73/2009, potpora ruralnom razvoju na temelju Uredbe Vijeća (EZ) br. 1698/2005
    i potpora sektoru vina na temelju Uredbe Vijeća (EZ) br. 1234/2007
  type: main
- language: hu
  script: Latn
  content: A Bizottság 937/2012/EU végrehajtási rendelete ( 2012. október 12.
    ) az 1122/2009/EK rendeletnek és a 65/2011/EU rendeletnek a 73/2009/EK tanácsi
    rendelet alapján a mezőgazdasági termelők számára nyújtott közvetlen támogatások
    kedvezményezettjei által, az 1698/2005/EK tanácsi rendelet alapján nyújtott
    vidékfejlesztési támogatások kedvezményezettjei által, és az 1234/2007/EK
    tanácsi rendelet alapján a borágazatban meghatározott támogatások kedvezményezettjei
    által visszatérítendő jogosulatlan kifizetésekkel kapcsolatban felszámítandó
    kamatok megállapítására irányuló eljárás tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 937/2012 della Commissione, del 12 ottobre
    2012 , che modifica i regolamenti (CE) n. 1122/2009 e (UE) n. 65/2011 per quanto
    riguarda il metodo per la determinazione degli interessi da applicare agli importi
    indebitamente erogati da recuperare presso i beneficiari dei regimi di sostegno
    diretto agli agricoltori di cui al regolamento (CE) n. 73/2009 del Consiglio,
    del sostegno allo sviluppo rurale di cui al regolamento (CE) n. 1698/2005 del
    Consiglio e del sostegno al settore vitivinicolo di cui al regolamento (CE) n.
    1234/2007 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 937/2012 ( 2012. gada 12. oktobris
    ), ar ko groza Regulu (EK) Nr. 1122/2009 un Regulu (ES) Nr. 65/2011 attiecībā
    uz metodi, ar kuru nosaka procentu likmes, kas piemērojamas nepamatotiem maksājumiem,
    kuri atgūstami no saņēmējiem, kas saņēmuši maksājumus saskaņā ar tiešā
    atbalsta shēmām lauksaimniekiem atbilstoši Padomes Regulai (EK) Nr. 73/2009,
    atbalstu lauku attīstībai atbilstoši Padomes Regulai (EK) Nr. 1698/2005 un
    atbalstu vīna nozarei atbilstoši Padomes Regulai (EK) Nr. 1234/2007
  type: main
- language: lt
  script: Latn
  content: 2012 m. spalio 12 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 937/2012,
    kuriuo iš dalies keičiamos reglamentų (EB) Nr. 1122/2009 ir (ES) Nr. 65/2011
    nuostatos dėl metodo, kuriuo apskaičiuojama palūkanų norma, taikytina nepagrįstai
    išmokėtoms sumoms, išieškotinoms iš paramos pagal tiesioginės paramos schemas
    ūkininkams pagal Tarybos reglamentą (EB) Nr. 73/2009, paramos kaimo plėtrai
    pagal Tarybos reglamentą (EB) Nr. 1698/2005 ir paramos vyno sektoriui pagal Tarybos
    reglamentą (EB) Nr. 1234/2007 gavėjų
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 937/2012 tat-
    12 ta’ Ottubru 2012 li jemenda r-Regolamenti (KE) Nru 1122/2009 u (UE) Nru 65/2011
    fir-rigward tal-metodu li jiddetermina l-imgħax applikabbli fuq pagamenti mhux
    dovuti minn benefiċjarji tal-iskemi ta’ appoġġ dirett għal bdiewa skont
    ir-Regolament tal-Kunsill (KE) Nru 73/2009, ta’ appoġġ għall-iżvilupp rurali
    skont ir-Regolament tal-Kunsill (KE) Nru 1698/2005 u ta’ appoġġ għas-settur
    tal-inbid skont ir-Regolament tal-Kunsill (KE) Nru 1234/2007
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 937/2012 van de Commissie van 12 oktober
    2012 tot wijziging van de Verordeningen (EG) nr. 1122/2009 en (EU) nr. 65/2011
    wat betreft de methode voor het berekenen van het rentetarief dat moet worden
    toegepast op onverschuldigde betalingen die moeten worden teruggevorderd van begunstigden
    van de regelingen inzake rechtstreekse steunverlening aan landbouwers krachtens
    Verordening (EG) nr. 73/2009 van de Raad, van steun voor plattelandsontwikkeling
    krachtens Verordening (EG) nr. 1698/2005 van de Raad en van steun voor de wijnsector
    krachtens Verordening (EG) nr. 1234/2007 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 937/2012 z dnia 12 października
    2012 r. zmieniające rozporządzenia (WE) nr 1122/2009 oraz (UE) nr 65/2011 w
    odniesieniu do metody naliczania odpowiednich odsetek od nienależnych płatności
    do odzyskania od beneficjentów systemów wsparcia bezpośredniego dla rolników
    ustanowionych rozporządzeniem Rady (WE) nr 73/2009, wsparcia rozwoju obszarów
    wiejskich ustanowionego rozporządzeniem Rady nr 1698/2005 oraz wsparcia sektora
    wina ustanowionego rozporządzeniem Rady (WE) nr 1234/2007
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 937/2012 da Comissão, de 12 de outubro
    de 2012 , que altera os Regulamentos (CE) n. ° 1122/2009 e (UE) n. ° 65/2011
    no que diz respeito ao método de determinação dos juros aplicáveis aos pagamentos
    indevidos a recuperar dos beneficiários dos regimes de apoio direto aos agricultores
    nos termos do Regulamento (CE) n. ° 73/2009 do Conselho, do apoio ao desenvolvimento
    rural nos termos do Regulamento (CE) n. ° 1698/2005 do Conselho e do apoio ao
    setor vitivinícola nos termos do Regulamento (CE) n. ° 1234/2007 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 937/2012 al Comisiei din 12
    octombrie 2012 de modificare a Regulamentelor (CE) nr. 1122/2009 și (UE) nr.
    65/2011 în ceea ce privește metoda de determinare a dobânzilor aplicabile la
    plățile necuvenite care trebuie recuperate de la beneficiarii sistemelor de
    ajutor direct pentru agricultori prevăzute de Regulamentul (CE) nr. 73/2009 al
    Consiliului, ai sprijinului pentru dezvoltare rurală prevăzut de Regulamentul
    (CE) nr. 1698/2005 al Consiliului și ai sprijinului pentru sectorul vitivinicol
    prevăzut de Regulamentul (CE) nr. 1234/2007 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 937/2012 z 12. októbra 2012
    , ktorým sa menia a dopĺňajú nariadenia Komisie (ES) č. 1122/2009 a (EÚ)
    č. 65/2011, pokiaľ ide o metódu určovania uplatniteľnej úrokovej sadzby
    na neoprávnené platby, ktoré sa majú spätne vymôcť od príjemcov režimov
    priamej podpory pre poľnohospodárov podľa nariadenia Rady (ES) č. 73/2009,
    podpory na rozvoj vidieka podľa nariadenia Rady (ES) č. 1698/2005 a podpory
    pre sektor vinohradníctva a vinárstva podľa nariadenia Rady (ES) č. 1234/2007
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 937/2012 z dne 12. oktobra 2012 o spremembi
    uredb (ES) št. 1122/2009 in (EU) št. 65/2011 glede načina za določanje uporabljene
    obrestne mere za neupravičena plačila, ki se izterjajo od upravičencev sheme
    neposrednih podpor za kmete iz Uredbe Sveta (ES) št. 73/2009, podpore za razvoj
    podeželja iz Uredbe Sveta (ES) št. 1698/2005 in podpore za vinski sektor iz
    Uredbe Sveta (ES) št. 1234/2007
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 937/2012 de la Comisión, de 12 de octubre
    de 2012 , que modifica los Reglamentos (CE) n ° 1122/2009 y (UE) n ° 65/2011
    en lo que atañe al método para la determinación del interés aplicable a los
    pagos indebidos que deben recuperarse de los beneficiarios de los regímenes de
    ayuda directa a los agricultores en virtud del Reglamento (CE) n ° 73/2009 del
    Consejo, de la ayuda al desarrollo rural en virtud del Reglamento (CE) n ° 1698/2005
    del Consejo y de la ayuda al sector vitivinícola en virtud del Reglamento (CE)
    n ° 1234/2007 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 937/2012 av den 12 oktober
    2012 om ändring av förordningarna (EG) nr 1122/2009 och (EU) nr 65/2011 vad
    gäller metoden för att fastställa tillämplig ränta på felaktiga utbetalningar
    som ska återkrävas från mottagare av stöd inom ramen för systemen för direktstöd
    till jordbrukare enligt rådets förordning (EG) nr 73/2009, mottagare av stöd
    för landsbygdsutveckling enligt rådets förordning (EG) nr 1698/2005 och mottagare
    av stöd till vinsektorn enligt rådets förordning (EG) nr 1234/2007
