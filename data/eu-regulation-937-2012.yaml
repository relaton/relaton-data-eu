title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 937/2012 of 12 October 2012
    amending Regulations (EC) No 1122/2009 and (EU) No 65/2011 as regards the method
    for determining applicable interest on undue payments to be recovered from beneficiaries
    of the direct support schemes for farmers under Council Regulation (EC) No 73/2009,
    of support for rural development under Council Regulation (EC) No 1698/2005 and
    of support for the wine sector under Council Regulation (EC) No 1234/2007
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 937/2012 de la Commission du 12 octobre
    2012 modifiant le règlement (CE) n ° 1122/2009 et le règlement (UE) n ° 65/2011
    en ce qui concerne la méthode de calcul des intérêts applicables aux paiements
    indus à recouvrer auprès des bénéficiaires des régimes de soutien direct
    en faveur des agriculteurs au titre du règlement (CE) n ° 73/2009 du Conseil,
    de soutien au développement rural au titre du règlement (CE) n ° 1698/2005
    du Conseil et de soutien au secteur du vin au titre du règlement (CE) n ° 1234/2007
    du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 937/2012 der Kommission vom 12. Oktober
    2012 zur Änderung der Verordnungen (EG) Nr. 1122/2009 und (EU) Nr. 65/2011 hinsichtlich
    des Verfahrens für die Festsetzung der fälligen Zinsen auf zu Unrecht geleistete
    Zahlungen, die von Begünstigten der Direktzahlungen an Betriebsinhaber gemäß
    der Verordnung (EG) Nr. 73/2009 des Rates, der Förderung der Entwicklung des
    ländlichen Raums gemäß der Verordnung (EG) Nr. 1698/2005 des Rates und der
    Förderung des Weinsektors gemäß der Verordnung (EG) Nr. 1234/2007 des Rates
    wieder einzuziehen sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 937/2012 на Комисията
    от 12 октомври 2012 година за изменение на Регламент
    (ЕО) № 1122/2009 и Регламент (ЕС) № 65/2011 по отношение
    на метода за определяне на приложимите лихви
    по недължими плащания, подлежащи на възстановяване
    от бенефициери на схемите за директно подпомагане
    на земеделските стопани съгласно Регламент
    (ЕО) № 73/2009 на Съвета, на подпомагането за развитие
    на селските райони съгласно Регламент (ЕО)
    № 1698/2005 на Съвета и на подпомагането за лозаро-винарския
    сектор съгласно Регламент (ЕО) № 1234/2007 на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 937/2012 ze dne 12. října 2012
    , kterým se mění nařízení (ES) č. 1122/2009 a (EU) č. 65/2011, pokud jde
    o metodu určování použitelné úrokové sazby na neoprávněně vyplacené
    částky, které mají být získány zpět od příjemců režimů přímých
    podpor pro zemědělce podle nařízení Rady (ES) č. 73/2009, podpory pro rozvoj
    venkova podle nařízení Rady (ES) č. 1698/2005 a podpory pro odvětví vína
    podle nařízení Rady (ES) č. 1234/2007
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 937/2012 af 12. oktober
    2012 om ændring af forordning (EF) nr. 1122/2009 og (EU) nr. 65/2011 for så
    vidt angår metoden til fastsættelse af gældende renter for uretmæssigt udbetalte
    beløb, der skal opkræves hos modtagere af støtte inden for rammerne af ordningerne
    for direkte støtte til landbrugere omhandlet i Rådets forordning (EF) nr. 73/2009,
    af støtte til udvikling af landdistrikterne omhandlet i Rådets forordning (EF)
    nr. 1698/2005 og af støtte i vinsektoren omhandlet i Rådets forordning (EF)
    nr. 1234/2007
  type: main
