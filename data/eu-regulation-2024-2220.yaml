id: EURegulation20242220
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/2220 of 26 July 2024 supplementing
    Regulation (EU) 2019/2144 of the European Parliament and of the Council by laying
    down detailed rules concerning the specific test procedures and technical requirements
    for the type-approval of heavy-duty motor vehicles with regard to their event
    data recorder and for the type-approval of those systems as separate technical
    units and amending Annex II to that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/2220 de la Commission du 26 juillet 2024
    complétant le règlement (UE) 2019/2144 du Parlement européen et du Conseil
    en établissant des règles détaillées relatives aux procédures d’essai et
    aux prescriptions techniques spécifiques pour la réception par type des véhicules
    à moteur lourds en ce qui concerne leur enregistreur de données de route et
    pour la réception par type de ces systèmes en tant qu’entités techniques
    distinctes et modifiant l’annexe II dudit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/2220 der Kommission vom 26. Juli 2024 zur
    Ergänzung der Verordnung (EU) 2019/2144 des Europäischen Parlaments und des
    Rates durch Festlegung detaillierter Vorschriften für die spezifischen Prüfverfahren
    und technischen Anforderungen für die Typgenehmigung schwerer Nutzfahrzeuge hinsichtlich
    ihrer Ereignisdatenspeicher und für die Typgenehmigung von Ereignisdatenspeichern
    als selbstständige technische Einheiten sowie zur Änderung von Anhang II der
    genannten Verordnung
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/2220 на Комисията
    от 26 юли 2024 година за допълнение на Регламент
    (ЕС) 2019/2144 на Европейския парламент и на Съвета
    чрез определяне на подробни правила относно
    специфичните процедури за изпитване и техническите
    изисквания за одобряване на типа на тежкотоварни
    моторни превозни средства по отношение на
    техните устройства за записване на данни от
    инциденти и за одобряване на типа на тези системи
    като отделни технически възли и за изменение
    на приложение II към посочения регламент
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/2220 ze dne 26. července
    2024, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2019/2144
    stanovením podrobných pravidel týkajících se zvláštních zkušebních postupů
    a technických požadavků pro schvalování typu těžkých nákladních motorových
    vozidel z hlediska jejich zapisovače údajů o události a pro schvalování
    typu těchto systémů jako samostatných technických celků a kterým se mění
    příloha II uvedeného nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/2220 af 26. juli 2024 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2019/2144
    med nærmere regler vedrørende de specifikke prøvningsprocedurer og tekniske
    krav til typegodkendelse af tunge motorkøretøjer for så vidt angår kollisionsdatarekorderen
    samt til typegodkendelse af sådanne systemer som separate tekniske enheder og
    om ændring af bilag II til nævnte forordning
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2024/2220
    της Επιτροπής, της 26ης Ιουλίου 2024, για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2019/2144 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, με τον καθορισμό λεπτομερών
    κανόνων σχετικά με τις συγκεκριμένες διαδικασίες
    δοκιμής και τεχνικές απαιτήσεις για την έγκριση
