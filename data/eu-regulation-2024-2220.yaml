    του παραρτήματος II του εν λόγω κανονισμού
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2024/2220, 26. juuli 2024, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2019/2144 üksikasjalike
    eeskirjadega katsemenetluste ja tehniliste nõuete kohta raskeveokite tüübikinnituseks
    seoses sündmuste salvestitega ja sündmuste salvestite kui eraldi seadmestike
    tüübikinnituseks ning muudetakse kõnealuse määruse II lisa
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2024/2220, annettu 26 päivänä heinäkuuta
    2024, Euroopan parlamentin ja neuvoston asetuksen (EU) 2019/2144 täydentämisestä
    vahvistamalla tyyppihyväksyttäessä raskaita moottoriajoneuvoja onnettomuustietotallentimien
    osalta ja tyyppihyväksyttäessä näitä järjestelmiä erillisinä teknisinä
    yksiköinä sovellettavia erityisiä testausmenettelyjä ja teknisiä vaatimuksia
    koskevat yksityiskohtaiset säännöt sekä kyseisen asetuksen liitteen II muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2024/2220 ón gCoimisiún an 26 Iúil 2024 lena
    bhforlíontar Rialachán (AE) 2019/2144 ó Pharlaimint na hEorpa agus ón gComhairle
    trí rialacha mionsonraithe a leagan síos maidir leis na nósanna imeachta sonracha
    tástála agus na ceanglais shonracha theicniúla i ndáil le cineálcheadú mótarfheithiclí
    tromshaothair i dtaca lena dtaifeadán sonraí teagmhais agus i ndáil le cineálcheadú
    na gcóras sin mar aonaid theicniúla ar leithligh agus lena leasaítear Iarscríbhinn
    II a ghabhann leis an Rialachán sin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/2220 оd 26. srpnja 2024. o dopuni
    Uredbe (EU) 2019/2144 Europskog parlamenta i Vijeća utvrđivanjem detaljnih pravila
    u pogledu posebnih ispitnih postupaka i tehničkih zahtjeva za homologaciju tipa
    teških motornih vozila s obzirom na njihove uređaje za snimanje podataka o događaju
    i za homologaciju tipa tih sustava kao zasebnih tehničkih jedinica te o izmjeni
    Priloga II. toj uredbi
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2220 felhatalmazáson alapuló rendelete (2024.
    július 26.) az (EU) 2019/2144 európai parlamenti és tanácsi rendeletnek a
    nehézgépjárműveknek az eseményadat-rögzítőik tekintetében történő
    típusjóváhagyására, valamint e rendszerek önálló műszaki egységként
    történő típusjóváhagyására szolgáló egyedi vizsgálati eljárásokra
    és műszaki követelményekre vonatkozó részletes szabályok megállapítása
    tekintetében történő kiegészítéséről, valamint az említett rendelet
    II. mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/2220 della Commissione, del 26 luglio 2024,
    che integra il regolamento (UE) 2019/2144 del Parlamento europeo e del Consiglio
    stabilendo norme dettagliate sulle procedure di prova e i requisiti tecnici specifici
    per l’omologazione dei veicoli pesanti a motore relativamente ai registratori
    di dati di evento e per l’omologazione di tali sistemi come entità tecniche,
    e che ne modifica l’allegato II
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2024/2220 (2024. gada 26. jūlijs), ar
    ko papildina Eiropas Parlamenta un Padomes Regulu (ES) 2019/2144, nosakot detalizētus
    noteikumus par specifiskām testa procedūrām un tehniskajām prasībām lielas
    noslodzes mehānisko transportlīdzekļu tipa apstiprināšanai attiecībā uz
    to notikumu datu reģistratoru un šo sistēmu kā atsevišķu tehnisko vienību
    tipa apstiprināšanu, un ar ko groza minētās regulas II pielikumu
  type: main
- language: lt
  script: Latn
  content: 2024 m. liepos 26 d. Komisijos deleguotasis reglamentas (ES) 2024/2220,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2019/2144 papildomas nustatant
    išsamias taisykles dėl sunkiųjų transporto priemonių tipo patvirtinimo pagal
    jų eismo įvykių duomenų savirašius ir tų sistemų, kaip atskirų techninių
    mazgų, tipo patvirtinimo specialiųjų bandymo procedūrų ir techninių reikalavimų,
    ir iš dalies keičiamas to reglamento II priedas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2024/2220 tas-26 ta’ Lulju 2024
    li jissupplimenta r-Regolament (UE) 2019/2144 tal-Parlament Ewropew u tal-Kunsill
    billi jistabbilixxi regoli dettaljati dwar il-proċeduri speċifiċi tal-ittestjar
    u r-rekwiżiti tekniċi għall-approvazzjoni tat-tip ta’ vetturi heavy-duty
    bil-mutur fir-rigward tar-reġistratur tagħhom tad-data f’każ ta’ avveniment
    u għall-approvazzjoni tat-tip ta’ dawk is-sistemi bħala unitajiet tekniċi
    separati, u li jemenda l-Anness II ta’ dak ir-Regolament
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2024/2220 van de Commissie van 26 juli 2024
    tot aanvulling van Verordening (EU) 2019/2144 van het Europees Parlement en de
    Raad met uitvoeringsbepalingen voor de specifieke testprocedures en technische
    voorschriften voor de typegoedkeuring van zware motorvoertuigen wat de gegevensrecorder
    voor incidenten betreft en voor de typegoedkeuring van die systemen als technische
    eenheden en tot wijziging van bijlage II bij die verordening
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2024/2220 z dnia 26 lipca 2024
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2019/2144
    poprzez określenie szczegółowych przepisów dotyczących konkretnych procedur
    badań i wymogów technicznych w zakresie homologacji typu pojazdów ciężkich
    w odniesieniu do rejestratorów danych na temat zdarzeń i homologacji typu tych
    układów jako oddzielnych zespołów technicznych oraz zmieniające załącznik
    II do tego rozporządzenia
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/2220 da Comissão, de 26 de julho de 2024,
    que completa o Regulamento (UE) 2019/2144 do Parlamento Europeu e do Conselho,
    estabelecendo normas pormenorizadas relativas aos procedimentos de ensaio e aos
    requisitos técnicos específicos para a homologação de veículos pesados no
    que diz respeito aos seus aparelhos de registo de eventos e para a homologação
    desses sistemas enquanto unidades técnicas autónomas, e que altera o anexo II
    desse regulamento
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/2220 al Comisiei din 26 iulie 2024 de completare
    a Regulamentului (UE) 2019/2144 al Parlamentului European și al Consiliului prin
    stabilirea unor norme detaliate privind procedurile specifice de încercare și
    cerințele tehnice pentru omologarea de tip a autovehiculelor grele în ceea ce
    privește dispozitivul de înregistrare a datelor privind evenimentele și pentru
    omologarea de tip a acestor sisteme ca unități tehnice separate și de modificare
    a anexei II la regulamentul menționat
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/2220 z 26. júla 2024, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2019/2144 stanovením
    podrobných pravidiel týkajúcich sa osobitných skúšobných postupov a technických
    požiadaviek na typové schvaľovanie ťažkých motorových vozidiel vzhľadom
    na ich zariadenie na záznam údajov o udalostiach a na typové schvaľovanie
    týchto systémov ako samostatných technických jednotiek a ktorým sa mení
    príloha II k uvedenému nariadeniu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/2220 z dne 26. julija 2024 o dopolnitvi
    Uredbe (EU) 2019/2144 Evropskega parlamenta in Sveta z določitvijo podrobnih
    pravil v zvezi s posebnimi preizkuševalnimi postopki in tehničnimi zahtevami
    za homologacijo težkih gospodarskih motornih vozil glede njihovih zapisovalnikov
    podatkov o dogodku in za homologacijo teh sistemov kot samostojnih tehničnih
    enot ter o spremembi Priloge II k navedeni uredbi
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/2220 de la Comisión, de 26 de julio de 2024,
    por el que se completa el Reglamento (UE) 2019/2144 del Parlamento Europeo y del
    Consejo mediante el establecimiento de normas pormenorizadas sobre los procedimientos
    de ensayo y los requisitos técnicos específicos para la homologación de tipo
    de los vehículos pesados en lo que respecta a su registrador de datos de incidencias
    y para la homologación de tipo de tales sistemas como unidades técnicas independientes,
    y por el que se modifica el anexo II de dicho Reglamento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/2220 av den 26 juli 2024
    om komplettering av Europaparlamentets och rådets förordning (EU) 2019/2144
    genom fastställande av närmare bestämmelser om särskilda provningsförfaranden
    och tekniska krav för typgodkännande av tunga motorfordon med avseende på registreringsapparater
    för händelsedata och för typgodkännande av dessa apparater som separata tekniska
    enheter samt om ändring av bilaga II till den förordningen
  type: main
