    μετά την καθιέρωση της συνδυασμένης ονοματολογίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1309/92 della Commissione, del 21 maggio 1992, recante
    modifica del regolamento (CEE) n. 1009/86 che fissa le norme generali applicabili
    alle restituzioni alla produzione nel settore dei cereali e del riso, in seguito
    all' introduzione della nomenclatura combinata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1309/92 van de Commissie van 21 mei 1992 houdende
    wijziging, naar aanleiding van de invoering van de gecombineerde nomenclatuur,
    van Verordening (EEG) nr. 1009/86 van de Raad tot vaststelling van de algemene
    voorschriften inzake de restituties bij de produktie in de sectoren granen en
    rijst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 1309/92 da Comissão, de 21 de Maio de 1992, que
    altera o Regulamento (CEE) n° 1009/86 do Conselho, que estabelece as regras gerais
    aplicáveis às restituições à produção no sector dos cereais e do arroz,
    no seguimento da introdução da Nomenclatura Combinada
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1309/92 de la Comisión, de 21 de mayo de 1992, que
    modifica el Reglamento (CEE) n° 1009/86 del Consejo por el que se establecen
    las normas generales aplicables a las restituciones a la producción en el sector
    de los cereales y del arroz como consecuencia de la introducción de la nomenclatura
    combinada
  type: main
