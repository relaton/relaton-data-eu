  content: Commission Regulation (EEC) No 1309/92 of 21 May 1992 amending Regulation
    (EEC) No 1009/86 establishing general rules applying to production refunds in
    the cereals and rice sector on account of the introduction of the combined nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1309/92 de la Commission, du 21 mai 1992, modifiant
    le règlement (CEE) n° 1009/86 de la Commission concernant les règles générales
    applicables aux restitutions à la production dans les secteurs des céréales
    et du riz suite à l' introduction de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1309/92 der Kommission vom 21. Mai 1992 zur Änderung
    der Verordnung (EWG) Nr. 1009/86 des Rates zur Festlegung der Grundregeln für
    die Produktionserstattungen für Getreide und Reis infolge der Einführung der
    Kombinierten Nomenklatur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1309/92 af 21. maj 1992 om ændring
    af forordning (EØF) nr. 1009/86 om almindelige regler for produktionsrestitutioner
    i korn- og rissektoren som følge af indførelsen af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1309/92 της Επιτροπής
