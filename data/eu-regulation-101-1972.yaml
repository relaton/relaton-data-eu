  content: Regulation (EEC) No 101/72 of the Commission of 14 January 1972 on Community
    transit documents issued for goods which on exportation to third countries are
    eligible for a refund under the common agricultural policy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 101/72 de la Commission, du 14 janvier 1972, relatif
    aux documents du transit communautaire établis pour des marchandises susceptibles
    de bénéficier d' une restitution à l' exportation vers les pays tiers, octroyée
    dans le cadre de la politique agricole commune
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 101/72 der Kommission vom 14. Januar 1972 über gemeinschaftliche
    Versandpapiere für Waren, für die eine Erstattung bei der Ausfuhr in dritte
    Länder im Rahmen der gemeinsamen Agrarpolitik gewährt werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 101/72 af 14. januar 1972 om fællesskabsforsendelsesdokumenterne
