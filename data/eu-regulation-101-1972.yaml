    for rammerne af den fælles landbrugspolitik
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 101/72 della Commissione, del 14 gennaio 1972, relativo
    ai documenti di transito comunitario riguardanti merci suscettibili di beneficiare
    di una restituzione all' esportazione verso i paesi terzi concesse nell' ambito
    della politica agricola comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 101/72 van de Commissie van 14 januari 1972 betreffende
