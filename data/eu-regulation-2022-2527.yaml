    abrogeant le règlement délégué (UE) no 807/2014 complétant le règlement
    (UE) no 1305/2013 du Parlement européen et du Conseil relatif au soutien au développement
    rural par le Fonds européen agricole pour le développement rural (Feader) et
    introduisant des dispositions transitoires
  type: main
- language: de
  script: Latn
