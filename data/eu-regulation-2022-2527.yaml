  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2527 of 17 October 2022 repealing
    Delegated Regulation (EU) No 807/2014 supplementing Regulation (EU) No 1305/2013
    of the European Parliament and of the Council on support for rural development
    by the European Agricultural Fund for Rural Development (EAFRD) and introducing
    transitional provisions
  type: main
- language: fr
  script: Latn
