    disposizioni del regolamento (UE) n. 1305/2013 del Parlamento europeo e del Consiglio
    sul sostegno allo sviluppo rurale da parte del Fondo europeo agricolo per lo sviluppo
    rurale (FEASR) e che introduce disposizioni transitorie
  type: main
- language: lv
