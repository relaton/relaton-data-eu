    pentru dezvoltare rurală acordat din Fondul european agricol pentru dezvoltare
    rurală (FEADR) și de introducere a unor dispoziții tranzitorii
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2527 zo 17. októbra 2022, ktorým
