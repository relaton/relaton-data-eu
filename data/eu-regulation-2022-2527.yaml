    vidékfejlesztési támogatásról szóló 1305/2013/EU európai parlamenti és
    tanácsi rendelet kiegészítéséről, valamint átmeneti rendelkezések bevezetéséről
    szóló 807/2014/EU felhatalmazáson alapuló rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2527 della Commissione del 17 ottobre 2022
