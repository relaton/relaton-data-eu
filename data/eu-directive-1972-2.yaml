title:
- language: en
  script: Latn
  content: Council Directive 72/2/EEC of 20 December 1971 making a seventh amendment
    to the Directive on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 72/2/CEE du Conseil, du 20 décembre 1971, portant septième
    modification de la directive relative au rapprochement des législations des États
    membres concernant les agents conservateurs pouvant être employés dans les denrées
    alimentaires destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 72/2/EWG des Rates vom 20. Dezember 1971 zur siebten Änderung
    der Richtlinie zur Angleichung der Rechtsvorschriften der Mitgliedstaaten für
    konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 72/2/EØF af 20. december 1971 om den syvende ændring
    af direktivet om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 72/2/ΕΟΚ του Συμβουλίου της 20ής Δεκεμβρίου
    1971 περί εβδόμης τροποποιήσεως της οδηγίας
    «περί προσεγγίσεως των νομοθεσιών των Κρατών
    μελών σχετικά με το συντηρητικά που επιτρέπεται
    να χρησιμοποιούνται στα τρόφιμα»
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 72/2/ETY, annettu 20 päivänä joulukuuta 1971, elintarvikkeissa
    sallittuja säilöntäaineita koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun direktiivin muuttamisesta seitsemännen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 72/2/CEE del Consiglio, del 20 dicembre 1971, recante settima
    modifica della direttiva relativa al ravvicinamento delle legislazioni degli Stati
    Membri sui conservativi che possono essere impiegati nelle derrate destinate all'alimentazione
    umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 72/2/EEG van de Raad van 20 december 1971 houdende zevende wijziging
    van de Richtlijn betreffende de aanpassing van de wetgevingen van de Lid-Staten
    inzake conserveermiddelen die mogen worden gebruikt in voor menselijke voeding
    bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 72/2/CEE do Conselho, de 20 de Dezembro de 1971, que altera pela
    sétima vez a Directiva relativa à aproximação das legislações das Estados-Membros
    respeitantes aos conservantes que podem ser utilizadas nos géneros destinadas
    à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 72/2/CEE del Consejo, de 20 de diciembre de 1971, que modifica
    por séptima vez la Directiva relativa a la aproximación de las legislaciones
    de los Estados Miembros sobre los agentes conservadores que pueden utilizarse
    en los productos destinados al consumo humano
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 72/2/EEG av den 20 december 1971 om ändring för sjunde
    gången av direktivet om tillnärmning av medlemsstaternas lagstiftning om konserveringsmedel
    som är godkända för användning i livsmedel
  type: main
