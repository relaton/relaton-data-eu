title:
- language: fr
  script: Latn
  content: 68/185/CEE Décision de la Commission, du 27 mars 1968, autorisant la République
    française à modifier, au cours de la campagne laitière 1967/1968, le montant
    de la prime de dénaturation accordée au lait en poudre destiné à l'alimentation
    du bétail
  type: main
- language: de
  script: Latn
  content: '68/185/EWG: Entscheidung der Kommission vom 27. März 1968 zur Ermächtigung
    der Französischen Republik, den Betrag der Denaturierungsprämie für zu Futterzwecken
    bestimmtes Milchpulver während des Milchwirtschaftsjahres 1967/1968 zu ändern'
  type: main
- language: it
  script: Latn
  content: '68/185/CEE: Decisione della Commissione, del 27 marzo 1968, che autorizza
    la Repubblica francese a modificare, nel corso della campagna lattiera 1967/1968,
    l''importo del premio di denaturazione accordato al latte in polvere destinato
    all''alimentazione del bestiame'
  type: main
- language: nl
  script: Latn
  content: '68/185/EEG: Beschikking van de Commissie van 27 maart 1968 waarbij de
    Franse Republiek wordt gemachtigd in de loop van het melkprijsjaar 1967/1968 het
    bedrag van de denaturatiepremie te wijzigen dat wordt verleend op melkpoeder bestemd
    voor veevoederdoeleinden'
