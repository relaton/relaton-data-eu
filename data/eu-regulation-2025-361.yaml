    hinsichtlich der Einträge für Bosnien und Herzegowina, das Vereinigte Königreich
    und die Vereinigten Staaten in den Listen der Drittländer, Gebiete und Zonen,
    aus denen der Eingang in die Union von Sendungen von Geflügel und Zuchtmaterial
    von Geflügel, von frischem Fleisch von Geflügel und Federwild sowie von Fleischerzeugnissen
    von Geflügel zulässig ist
  type: main
