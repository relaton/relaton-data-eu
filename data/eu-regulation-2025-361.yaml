    ide o zápisy týkajúce sa Bosny a Hercegoviny, Spojeného kráľovstva a Spojených
    štátov amerických v zoznamoch tretích krajín, území alebo ich pásiem,
    z ktorých sa povoľuje vstup zásielok hydiny, zárodočných produktov hydiny,
