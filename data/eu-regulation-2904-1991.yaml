title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2904/91 of 27 September 1991 imposing a
    provisional anti­dumping duty on imports of certain polyester yarns (man­made
    staple fibres) originating in Taiwan, Indonesia, India, the People's Republic
    of China and Turkey and terminating the anti­dumping proceeding in respect of
    imports of these yarns originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2904/91 de la Commission, du 27 septembre 1991, instituant
    un droit antidumping provisoire sur les importations de certains fils de polyesters
    (fibres synthétiques ou artificielles discontinues) originaires de T'ai­wan,
    d'Indonésie, d'Inde, de la République populaire de Chine et de Turquie et clôturant
    la procédure antidumping en ce qui concerne les importations de ces mêmes fils
    originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung ( EWG ) Nr. 2904/91 der Kommission vom 27. September 1991 zur
    Einführung eines vorläufigen Antidumpingzolls auf die Einfuhren bestimmter Polyestergarne
    ( Spinnfasern ) mit Ursprung in Taiwan, Indonesien, Indien, der Volksrepublik
    China und der Türkei und zur Einstellung des Antidumpingverfahrens gegenüber
    den Einfuhren dieser Garne mit Ursprung in der Republik Korea
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning ( EØF ) nr. 2904/91 af 27. september 1991 om
    indførelse af en midlertidig antidumpingtold på importen af visse garner af
    polyester ( korte kemofibre ) med oprindelse i Taiwan, Indonesien, Indien, Den
    Kinesiske Folkerepublik og Tyrkiet og om afslutning af antidumpingundersøgelsen
    vedrørende importen af sådanne garner med oprindelse i Republikken Korea
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 2904/91 της Επιτροπής
    της 27ης Σεπτεμβρίου 1991 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    νημάτων από πολυεστέρα ( συνθετικές μη συνεχείς
    ίνες ), καταγωγής Ταϊβάν, Ινδονησίας, Ινδίας,
    Λαϊκής Δημοκρατίας της Κίνας και Τουρκίας,
    και την περάτωση της διαδικασίας αντιντάμπινγκ
    σχετικά με τις εισαγωγές των εν λόγω νημάτων
    καταγωγής Δημοκρατίας της Κορέας
  type: main
- language: it
  script: Latn
  content: Regolamento ( CEE ) n. 2904/91 della Commissione, del 27 settembre 1991,
    che istituisce un dazio antidumping provvisorio sulle importazioni di alcuni tipi
    di filati di poliesteri ( fibre artificiali in fiocco ) originari di Taiwan, dell'
    Indonesia dell' India, della Repubblica popolare cinese e della Turchia e che
    chiude il procedimento antidumping relativo alle importazioni di tali filati originari
    della Repubblica di Corea
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2904/91 van de Commissie van 27 september 1991
    tot instelling van een voorlopig anti­dumpingrecht op de invoer van bepaalde
    garens van polyester ( kunstmatige stapelvezels ) van oorsprong uit Taiwan, Indonesië,
    India, de Volksrepubliek China en Turkije en tot beëindiging van de anti­dumpingprocedure
    met betrekking tot de invoer van deze garens van oorsprong uit de Republiek Korea
  type: main
- language: pt
  script: Latn
  content: Regulamento ( CEE ) n° 2904/91 da Comissão, de 27 de Setembro de 1991,
    que cria um direito anti­dumping provisório sobre as importações de certos
    fios de poliéster ( fibras sintéticas ou artificiais descontínuas ) originários
    de Taiwan, da Indonésia, da India, da República Popular da China e da Turquia
    e que encerra o processo anti­dumping relativo às importações destes fios
    originários da República da Coreia
  type: main
- language: es
  script: Latn
  content: Reglamento ( CEE ) n° 2904/91 de la Comisión, de 27 de septiembre de
    1991, por el que se establece un derecho anidumping provisional sobre las importaciones
    de determinados hilados de poliéster ( fibras sintéticas discontinuas ) originarios
    de Taiwán, Indonesia, India, la República Popular de China y Turquía y por
    el que se concluye el procedimiento antidumping relativo a las importaciones de
    dichos hilados originarios de la República de Corea
