title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2710/74 of the Commission of 25 October 1974 re-establishing
    the levying of the customs duties on anhydrous sodium carbonates, falling within
    subheading 28.42 A ex II, originating in Romania, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December 1973
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2710/74 de la Commission, du 25 octobre 1974, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de sodium anhydre, de la sous-position tarifaire 28.42 A EX II originaire de Roumanie,
    bénéficiaire de préférences tarifaires prévues par le règlement (CEE) n°
    3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2710/74 der Kommission vom 25. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für wasserfreies Natriumkarbonat der Tarifstelle 28.42 A ex II
    mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2710/74 af 25. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for vandfri natriumcarbonat, underposition 28.42
    A ex II, som har oprindelse i Rumænien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2710/74 della Commissione, del 25 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili al carbonato di sodio
    anidro della sottovoce doganale 28.42 A ex II originario della Romania beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2710/74 van de Commissie van 25 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op anhydrisch
    natriumcarbonaat van onderverdeling 28.42 A ex II, van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
