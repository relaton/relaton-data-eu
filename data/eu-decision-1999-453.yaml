  script: Latn
  content: '1999/453/EC: Commission Decision of 18 June 1999 amending Decisions 96/579/EC
    and 97/808/EC on the procedure for attesting the conformity of construction products
    pursuant to Article 20(2) of Council Directive 89/106/EEC as regards circulation
    fixtures and floorings respectively (notified under document number C(1999) 1484)'
