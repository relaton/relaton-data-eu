id: EURegulation20151105
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1105 of 8 July 2015 concerning
    the authorisation of a preparation of Bifidobacterium animalis ssp. animalis DSM
    16284, Lactobacillus salivarius ssp. salivarius DSM 16351 and Enterococcus faecium
    DSM 21913 as a feed additive for chickens reared for laying and minor poultry
    species other than laying, the authorisation of that feed additive for use in
    water for drinking for chickens for fattening and amending Regulation (EU) No
    544/2013 as regards the maximum content of that feed additive in complete feedingstuff
    and its compatibility with coccidiostats (holder of the authorisation Biomin GmbH)
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/1105 de la Commission du 8 juillet 2015
    concernant l'autorisation d'une préparation de Bifidobacterium animalis ssp.
    animalis DSM 16284, de Lactobacillus salivarius ssp. salivarius DSM 16351 et d'Enterococcus
    faecium DSM 21913 en tant qu'additif dans l'alimentation des poulettes destinées
    à la ponte et des espèces aviaires mineures autres que celles destinées à
    la ponte, ainsi que l'autorisation de cet additif en vue d'une nouvelle utilisation
    dans l'eau d'abreuvement des poulets d'engraissement, et modifiant le règlement
    d'exécution (UE) n° 544/2013 en ce qui concerne la teneur maximale de cet additif
    dans l'aliment complet pour animaux et sa compatibilité avec les coccidiostatiques
    (titulaire de l'autorisation Biomin GmbH)
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2015/1105 der Kommission vom 8. Juli 2015
    zur Zulassung einer Zubereitung aus Bifidobacterium animalis ssp. animalis DSM
    16284, Lactobacillus salivarius ssp. salivarius DSM 16351 und Enterococcus faecium
    DSM 21913 als Zusatzstoff in Futtermitteln für Junghennen sowie Geflügelarten
    von geringerer wirtschaftlicher Bedeutung außer Legegeflügel, zur Zulassung
    dieses Zusatzstoffes zur Verwendung über Tränkwasser für Masthühner und zur
    Änderung der Durchführungsverordnung (EU) Nr. 544/2013 im Hinblick auf den Höchstgehalt
    an diesem Zusatzstoff in Alleinfuttermitteln sowie auf seine Kompatibilität mit
    Kokzidiostatika (Zulassungsinhaber: Biomin GmbH)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/1105 на Комисията
    от 8 юли 2015 година за разрешаване на употребата
    на препарат от Bifidobacterium animalis ssp. animalis DSM 16284, Lactobacillus
    salivarius ssp. salivarius DSM 16351 и Enterococcus faecium DSM 21913 като
    фуражна добавка за пилета, отглеждани за кокошки
    носачки, и за видове домашни птици с по-малко
    стопанско значение, различни от носачки, за
    разрешаване на употребата на посочената фуражна
    добавка във вода за пиене за пилета за угояване
    и за изменение на Регламент (ЕС) № 544/2013 по отношение
    на максималното съдържание на посочената фуражна
    добавка в пълноценни фуражи и нейната съвместимост
    с кокцидиостатици (притежател на разрешението
    Biomin GmbH)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/1105 ze dne 8. července 2015
    o povolení přípravku z Bifidobacterium animalis ssp. animalis DSM 16284, Lactobacillus
    salivarius ssp. salivarius DSM 16351 a Enterococcus faecium DSM 21913 jako doplňkové
    látky pro odchov kuřat a kuřice a pro menšinové druhy drůbeže kromě nosnic,
    o povolení uvedené doplňkové látky pro použití ve vodě k napájení při
    výkrmu kuřat a o změně prováděcího nařízení (EU) č. 544/2013, pokud
    jde o maximální obsah uvedené doplňkové látky v kompletním krmivu a jeho
    slučitelnost s kokcidiostatiky (držitel povolení Biomin GmbH)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/1105 af 8. juli 2015
    om godkendelse af et præparat af Bifidobacterium animalis ssp. animalis DSM 16284,
    Lactobacillus salivarius ssp. salivarius DSM 16351 og Enterococcus faecium DSM
    21913 som fodertilsætningsstof til hønniker og mindre udbredte fjerkræarter
    bortset fra æglæggende fugle heraf, om godkendelse af tilsætningsstoffet til
    anvendelse i drikkevand til slagtekyllinger og om ændring af forordning (EU)
    nr. 544/2013 for så vidt angår maksimumsindholdet af tilsætningsstoffet i fuldfoder
    og dets kompatibilitet med coccidiostatika (indehaveren af godkendelsen er Biomin
    GmbH)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2015/1105 της Επιτροπής,
    της 8ης Ιουλίου 2015, σχετικά με τη χορήγηση άδειας
    για τη χρήση παρασκευάσματος Bifidobacterium animalis
    ssp. animalis DSM 16284, Lactobacillus salivarius ssp. salivarius DSM 16351 και
    Enterococcus faecium DSM 21913 ως πρόσθετης ύλης ζωοτροφών
    για κοτόπουλα εκτρεφόμενα για ωοπαραγωγή και
    μικρά είδη πουλερικών εκτός από ωοτόκα πτηνά,
    τη χορήγηση άδειας για τη χρήση της εν λόγω
    πρόσθετης ύλης σε πόσιμο νερό για κοτόπουλα
    προς πάχυνση και την τροποποίηση του εκτελεστικού
    κανονισμού (ΕΕ) αριθ. 544/2013 όσον αφορά τη μέγιστη
    περιεκτικότητα της εν λόγω πρόσθετης ύλης
    ζωοτροφών στην πλήρη ζωοτροφή καθώς και τη
    συμβατότητά της με τα κοκκιδιοστατικά (κάτοχος
    της άδειας Biomin GmbH)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2015/1105, 8. juuli 2015, milles käsitletakse
    loa andmist Bifidobacterium animalis ssp. animalis DSM 16284'st, Lactobacillus
    salivarius ssp. salivarius DSM 16351'st ja Enterococcus faecium DSM 21913'st saadud
    valmistise kasutamiseks munakanade ning vähem tähtsate kodulinnuliikide (v.a
    munalinnud) toidulisandina, loa andmist kõnealuse söödalisandi kasutamiseks
    broilerkanade joogivees, ning millega muudetakse määrust (EL) nr 544/2013 seoses
    kõnealuse toidulisandi maksimaalse sisaldusega täissöödas ja kokkusobivusega
    koktsidiostaatikumidega (loa hoidja Biomin GmbH)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/1105, annettu 8 päivänä
    heinäkuuta 2015, Bifidobacterium animalis ssp. animalis DSM 16284:stä, Lactobacillus
    salivarius ssp. salivarius DSM 16351:stä ja Enterococcus faecium DSM 21913:sta
    tehdyn valmisteen hyväksymisestä kananuorikoiden ja muuta kuin munantuotantoa
    varten pidettävien toissijaisten siipikarjalajien rehun lisäaineena, kyseisen
    rehun lisäaineen hyväksymisestä käytettäväksi broilerien juomavedessä sekä
    asetuksen (EU) N:o 544/2013 muuttamisesta siltä osin kuin on kyse kyseisen rehun
    lisäaineen enimmäispitoisuudesta täysrehussa ja sen yhteensopivuudesta kokkidiostaattien
    kanssa (hyväksynnän haltija Biomin GmbH)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/1105 оd 8. srpnja 2015. o izdavanju
    odobrenja za pripravak od Bifidobacterium animalis ssp. animalis DSM 16284, Lactobacillus
    salivarius ssp. salivarius DSM 16351 i Enterococcus faecium DSM 21913 kao dodatka
    hrani za piliće uzgajane za nesenje i manje značajne vrste peradi osim za nesenje,
    odobrenja tog dodatka hrani za životinje za uporabu u vodi za piće za piliće
    za tov i izmjeni Uredbe (EU) br. 544/2013 u pogledu najveće dopuštene količine
    tog dodatka hrani za životinje u potpunoj krmnoj smjesi i njegove kompatibilnosti
    s kokcidiostaticima (nositelj odobrenja Biomin GmbH)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2015/1105 végrehajtási rendelete (2015. július 8.)
    a Bifidobacterium animalis ssp. animalis DSM 16284-et, Lactobacillus salivarius
    ssp. salivarius DSM 16351-et és Enterococcus faecium DSM 21913-at tartalmazó
    készítmény tojójércéknek és a tojóbaromfiktól eltérő kisebb baromfifajoknak
    szánt takarmány-adalékanyagként történő engedélyezéséről, e takarmány-adalékanyag
    brojlercsirkék ivóvízében való használata céljából történő engedélyezéséről,
    valamint az 544/2013/EU rendeletnek e takarmány-adalékanyag teljes értékű
    takarmányban engedélyezett maximális tartalma és kokcidiosztatikumokkal való
    kompatibilitása tekintetében történő módosításáról (az engedély jogosultja:
    Biomin GmbH)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/1105 della Commissione, dell'8 luglio
    2015, relativo all'autorizzazione di un preparato di Bifidobacterium animalis
    ssp. animalis DSM 16284, Lactobacillus salivarius ssp. salivarius DSM 16351 ed
    Enterococcus faecium DSM 21913 come additivo per mangimi destinati a galline ovaiole
    e specie avicole minori non destinate alla produzione di uova, e relativo all'autorizzazione
    di tale additivo per mangimi da impiegare nell'acqua da abbeveramento per polli
    da ingrasso e che modifica il regolamento di esecuzione (UE) n. 544/2013 per quanto
    riguarda il tenore massimo di tale additivo nell'alimento per animali completo
    e la sua compatibilità con i coccidiostatici (titolare dell'autorizzazione Biomin
    GmbH)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/1105 (2015. gada 8. jūlijs),
    ar kuru Bifidobacterium animalis ssp. animalis DSM 16284, Lactobacillus salivarius
    ssp. salivarius DSM 16351 un Enterococcus faecium DSM 21913 preparātu atļauj
    lietot kā barības piedevu pirmdējējām jaunvistiņām un mazāk izplatītu
    sugu mājputniem, kas nav dējējmājputni, minēto barības piedevu atļauj lietot
    dzeramajā ūdenī gaļas cāļiem un attiecībā uz maksimālo minētās barības
    piedevas saturu kompleksajā barībā un tā saderību ar kokcidiostatiem groza
    Regulu (ES) Nr. 544/2013 (atļaujas turētājs Biomin GmbH)
  type: main
- language: lt
  script: Latn
  content: 2015 m. liepos 8 d. Komisijos įgyvendinimo reglamentas (ES) 2015/1105
    dėl leidimo naudoti bakterijų Bifidobacterium animalis ssp. animalis DSM 16284,
    Lactobacillus salivarius ssp. salivarius DSM 16351 ir Enterococcus faecium DSM
    21913 preparatą kaip dedeklinių vištaičių ir kitų retesnių rūšių naminių
    paukščių, išskyrus dedeklinius paukščius, pašaro priedą, dėl leidimo
    tą pašaro priedą naudoti vandenyje mėsiniams viščiukams girdyti, kuriuo
    dėl didžiausio leidžiamo to pašaro priedo kiekio visaverčiame pašare ir
    jo suderinamumo su kokcidiostatais iš dalies keičiamas Reglamentas (ES) Nr.
    544/2013 (leidimo turėtojas „Biomin GmbH“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/1105 tat-8 ta'
    Lulju 2015 li jikkonċerna l-awtorizzazzjoni tal-preparat tal-Bifidobacterium
    animalis ssp. animalis DSM 16284, Lactobacillus salivarius ssp. salivarius DSM
    16351 u tal-Enterococcus faecium DSM 21913 bħala addittiv tal-għalf għat-tiġieġ
    tal-bajd u għal speċijiet minuri ta' tjur għajr dawk tal-bajd, l-awtorizzazzjoni
    ta' dak l-addittiv tal-għalf għall-użu fl-ilma tax-xorb għat-tiġieġ għat-tismin
    u li jemenda r-Regolament ta' Implimentazzjoni (UE) Nru 544/2013 fir-rigward tal-kontenut
    massimu ta' dak l-addittiv tal-għalf fl-għalf sħiħ u l-kumpatibbiltà tiegħu
    mal-koċċidjostati (id-detentur tal-awtorizzazzjoni Biomin GmbH)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/1105 van de Commissie van 8 juli 2015
    tot verlening van een vergunning voor een preparaat van Bifidobacterium animalis
    ssp. animalis DSM 16284, Lactobacillus salivarius ssp. salivarius DSM 16351 en
    Enterococcus faecium DSM 21913 als toevoegingsmiddel voor diervoeding voor opfokleghennen
    en voor minder gangbare pluimveesoorten met uitzondering van legvogels, tot verlening
    van een vergunning voor dat preparaat voor gebruik in drinkwater voor mestkippen
    en tot wijziging van Uitvoeringsverordening (EU) nr. 544/2013 van de Commissie
    wat het maximumgehalte van dat toevoegingsmiddel in volledig diervoeder betreft
    en de verenigbaarheid van dat toevoegingsmiddel met coccidiostatica (vergunninghouder
    Biomin GmbH)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/1105 z dnia 8 lipca 2015 r.
    dotyczące zezwolenia na stosowanie preparatu Bifidobacterium animalis ssp. animalis
    DSM 16284, Lactobacillus salivarius ssp. salivarius DSM 16351 i Enterococcus faecium
    DSM 21913 jako dodatku paszowego dla kurcząt odchowywanych na kury nioski i podrzędnych
    gatunków drobiu z wyjątkiem niosek oraz zezwolenia na stosowanie tego dodatku
    paszowego w wodzie do pojenia kurcząt rzeźnych, a także zmieniające rozporządzenie
    wykonawcze (UE) nr 544/2013 w odniesieniu do maksymalnej zawartości tego dodatku
    paszowego w mieszankach paszowych pełnoporcjowych oraz jego kompatybilności
    z kokcydiostatykami (posiadacz zezwolenia Biomin GmbH)
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2015/1105 da Comissão, de 8 de julho de
    2015, relativa à autorização de uma preparação de Bifidobacterium animalis
    ssp. animalis DSM 16284, Lactobacillus salivarius ssp. salivarius DSM 16351 e
    Enterococcus faecium DSM 21913 como aditivo em alimentos para frangas para postura
    e espécies menores de aves de capoeira à exceção das aves poedeiras, à autorização
    desse aditivo em alimentos para animais a utilizar na água de abeberamento para
    frangos de engorda e que altera o Regulamento (UE) n.° 544/2013 no que diz respeito
    ao teor máximo desse aditivo em alimentos completos para animais e à sua compatibilidade
    com coccidiostáticos (detentor da autorização: Biomin GmbH)'
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/1105 al Comisiei din 8 iulie
    2015 privind autorizarea preparatului de Bifidobacterium animalis ssp. animalis
    DSM 16284, Lactobacillus salivarius ssp. salivarius DSM 16351 și Enterococcus
    faecium DSM 21913 ca aditiv furajer pentru puicuțe pentru ouat și alte specii
    minore de păsări de curte decât cele pentru ouat, privind autorizarea acestui
    aditiv furajer în vederea utilizării în apa de băut pentru pui pentru îngrășare
    și de modificare a Regulamentului de punere în aplicare (UE) nr. 544/2013 în
    ceea ce privește conținutul maxim al acestui aditiv furajer în furaje complete
    și compatibilitatea sa cu coccidiostaticele (titularul autorizației Biomin GmbH)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/1105 z 8. júla 2015 o povolení
    prípravku Bifidobacterium animalis ssp. animalis DSM 16284, Lactobacillus salivarius
    ssp. salivarius DSM 16351 a Enterococcus faecium DSM 21913 ako kŕmnej doplnkovej
    látky pre kurčatá chované na znášku a menej významné druhy hydiny iné
    ako na znášku, o povolení uvedenej kŕmnej doplnkovej látky na používanie
    v pitnej vode pre kurčatá vo výkrme a o zmene vykonávacieho nariadenia (EÚ)
    č. 544/2013, pokiaľ ide o maximálny obsah uvedenej kŕmnej doplnkovej látky
    v kompletnom krmive a jeho zlučiteľnosť s kokcidiostatikami (držiteľ povolenia
    Biomin GmbH)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/1105 z dne 8. julija 2015 o izdaji
    dovoljenja za pripravek iz Bifidobacterium animalis ssp. animalis DSM 16284, Lactobacillus
    salivarius ssp. salivarius DSM 16351 in Enterococcus faecium DSM 21913 kot krmni
    dodatek za piščance za nesnice in manjše vrste perutnine, razen nesnic, o izdaji
    dovoljenja za uporabo navedenega krmnega dodatka v vodi, ki jo pijejo piščanci
    za pitanje, ter o spremembi Izvedbene uredbe (EU) št. 544/2013, kar se tiče
    najvišje vsebnosti navedenega krmnega dodatka v popolni krmni mešanici in njegove
    združljivosti s kokcidiostatiki (imetnik dovoljenja Biomin GmbH)
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2015/1105 de la Comisión, de 8 de julio
    de 2015, relativo a la autorización de un preparado de Bifidobacterium animalis
    ssp. animalis DSM 16284, Lactobacillus salivarius ssp. salivarius DSM 16351 y
    Enterococcus faecium DSM 21913 como aditivo en la alimentación de pollitas para
    puesta y especies menores de aves de corral que no sean aves ponedoras, a la autorización
    de dicho aditivo para su uso en el agua de beber de los pollos de engorde, y por
    el que se modifica el Reglamento (UE) n° 544/2013 en lo relativo al contenido
    máximo de dicho aditivo en el pienso completo y su compatibilidad con los coccidiostáticos
    (titular de la autorización: Biomin GmbH)'
  type: main
