  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/1105 av den 8 juli 2015
    om godkännande av ett preparat av Bifidobacterium animalis ssp. animalis DSM
    16284, Lactobacillus salivarius ssp. salivarius DSM 16351 och Enterococcus faecium
    DSM 21913 som fodertillsats för kycklingar som föds upp till värphöns och
    för mindre fjäderfäarter utom värpfåglar, om godkännande av den fodertillsatsen
    för användning i dricksvatten för slaktkycklingar och om ändring av genomförandeförordning
