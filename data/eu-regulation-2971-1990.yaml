  content: Commission Regulation (EEC) No 2971/90 of 11 October 1990 re-establishing
    the levying of customs duties applicable to products of category 21 (order No
    40.0210) originating in India, to which preferential tariff arrangements of Council
    Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2971/90 de la Commission, du 11 octobre 1990, portant
