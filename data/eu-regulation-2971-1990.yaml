    ( LFD. NR. 40.0210 ) MIT URSPRUNG IN INDIEN, DEM DIE IN DER VERORDNUNG ( EWG )
    NR. 3897/89 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN GEWAEHRT WERDEN
  type: main
