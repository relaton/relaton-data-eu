title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2087/89 of 12 July 1989 fixing the accession
    compensatory amounts applicable to rice for the 1989/90 marketing year and the
    coefficients to be used to calculate the amounts applicable to certain processed
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2087/89 de la Commission, du 12 juillet 1989, fixant
    les montants compensatoires «adhésion» applicables dans le secteur du riz pour
    la campagne 1989/1990 ainsi que les coefficients à retenir pour le calcul des
    montants applicables à certains produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2087/89 der Kommission vom 12. Juli 1989 zur Festsetzung
    der im Wirtschaftsjahr 1989/90 geltenden Beitrittsausgleichsbeträge für Reis
    sowie der Koeffizienten für die Berechnung der auf bestimmte Verarbeitungserzeugnisse
    anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2087/89 af 12. juli 1989 om fastsættelse
    af tiltrædelsesudligningsbeløbene for ris for høståret 1989/90 og af de koefficienter,
    der skal lægges til grund ved beregning af beløbene for visse forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2087/89 της Επιτροπής
    της 12ης Ιουλίου 1989 για τον καθορισμό των εξισωτικών
    ποσών προσχώρησης που εφαρμόζονται στον τομέα
    του ρυζιού για την περίοδο 1989/90 καθώς και των
    συντελεστών που λαμβάνονται υπόψη για τον
    υπολογισμό των ποσών που εφαρμόζονται σε ορισμένα
    μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2087/89 della Commissione, del 12 luglio 1989, che
    fissa gli importi compensativi adesione applicabili nel settore del riso per la
    campagna 1989/1990, nonché i coefficienti da prendere in considerazione per il
    calcolo degli importi applicabili a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2087/89 van de Commissie van 12 juli 1989 tot vaststelling
    voor het verkoopseizoen 1989/1990 van de compenserende bedragen toetreding voor
    de sector rijst, alsmede van de coëfficiënten voor de berekening van de bedragen
    die gelden voor sommige verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2087/89 da Comissão, de 12 de Julho de 1989, que
    fixa os montantes compensatórios de adesão aplicáveis no sector do arroz para
    a campanha de 1989/1990, bem como os coeficientes a utilizar para o cálculo dos
    montantes aplicáveis a determinados produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2087/89 de la Comisión, de 12 de julio de 1989, por
    el que se fijan los montantes compensatorios de adhesión aplicables en el sector
    del arroz para la campaña de 1989/90, así como los coeficientes que deberán
    utilizarse para el cálculo de los importes aplicables a determinados productos
    transformados
  type: main
