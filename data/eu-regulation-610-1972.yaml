title:
- language: en
  script: Latn
  content: Regulation (EEC) No 610/72 of the Council of 23 March 1972 on the application
    of the provisions adopted within the framework of the Association established
    between the European Economic Community and Greece relating to the movement of
    goods in the manufacture of which are used products which come from third countries
    and are not in free circulation either in the Community or in Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 610/72 du Conseil, du 23 mars 1972, relatif à l'application
    des dispositions adoptées dans le cadre de l'association entre la Communauté
    économique européenne et la Grèce concernant la circulation des marchandises
    dans la fabrication desquelles sont entrés des produits en provenance de pays
    tiers ne se trouvant en libre pratique ni dans la Communauté ni en Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 610/72 des Rates vom 23. März 1972 über die Anwendung
    von im Rahmen der Assoziation zwischen der Europäischen Wirtschaftsgemeinschaft
    und Griechenland erlassenen Vorschriften betreffend den Verkehr von Waren, die
    unter Verwendung von Waren aus dritten Ländern hergestellt sind, welche sich
    weder in der Gemeinschaft noch in Griechenland im freien Verkehr befanden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 610/72 af 23. marts 1972 om anvendelse af
    de bestemmelser, der er vedtaget inden for rammerne af associeringen mellem Det
    europæiske økonomiske Fællesskab og Grækenland vedrørende bevægelighed af
    varer, til hvis fremstilling der er medgået varer med oprindelse i tredjelande,
    som hverken er frigivet i Fællesskabet eller i Grækenland
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 610/72 del Consiglio, del 23 marzo 1972, relativo
    all'applicazione delle disposizioni adottate nel quadro dell'associazione fra
    la Comunità economica europea e la Grecia riguardo alla circolazione delle merci
    nella cui fabbricazione sono entrati prodotti provenienti da paesi terzi e non
    immessi in libera pratica né nella Comunità né in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 610/72 van de Raad van 23 maart 1972 betreffende
    de toepassing van de in het kader van de Associatie tussen de Europese Economische
    Gemeenschap en Griekenland vastgestelde bepalingen betreffen de het verkeer van
    goederen waarin produkten uit derde landen zijn verwerkt, die zich noch in de
    Gemeenschap noch in Griekenland in het vrije verkeer bevinden
  type: main
