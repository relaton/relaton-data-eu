id: EUDecision1980466
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/466/EEC: Commission Decision of 14 April 1980 authorizing Ireland not
    to apply Community treatment to jerseys, pullovers, slip-overs, waistcoats, twinsets,
    cardigans, bed-jackets and jumpers, falling within subheading ex 60.05 A II of
    the Common Customs Tariff (category 5), originating in Malaysia and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/466/CEE: Décision de la Commission, du 14 avril 1980, autorisant l''Irlande
    à exclure du traitement communautaire les chandails, "pullovers", "twinsets",
    gilets et vestes, de la sous-position ex 60.05 A II du tarif douanier commun (catégorie
    5), originaires de Malaysia et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/466/EWG: Entscheidung der Kommission vom 14. April 1980, mit der Irland
    ermächtigt wird, aus Malaysia stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen und Strickjacken
    der Tarifstelle ex 60.05 A II des Gemeinsamen Zolltarifs (Kategorie 5) von der
    Gemeinschaftsbehandlung auszuschießen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/466/EØF: Kommissionens beslutning af 14. april 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere,
    cardigans, cardigansæt, jumpere, trøjer og veste, som henhører under pos. ex
    60.05 A II i den fælles toldtarif (kategori 5), har oprindelse i Malaysia og
    frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/466/CEE: Decisione della Commissione, del 14 aprile 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario maglie, pullover, con o senza
    maniche, slip-over, twinset, giubbetti e giacche, della sottovoce ex 60.05 A II
    della tariffa doganale comune (categoria 5), originari della Malaysia e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/466/EEG: Beschikking van de Commissie van 14 april 1980 waarbij Ierland
    wordt gemachtigd truien, jumpers, pullovers, slipovers, twinsets, vesten en jasjes,
    van post ex 60.05 A II van het gemeenschappelijk douanetarief (categorie 5), van
    oorsprong uit Maleisië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
