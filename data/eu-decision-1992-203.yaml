    zu eröffnenden Einfuhrkontingente für 1991 zur Berücksichtigung der Auflösung
    der UdSSR (92/203/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS BESLUTNING af 31. marts 1992 om ændring af beslutning 91/667/EØF
