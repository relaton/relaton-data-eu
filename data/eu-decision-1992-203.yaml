    countries in 1991 in order to take account of the dissolution of the Soviet Union'
  type: main
- language: fr
  script: Latn
  content: '92/203/CEE: Décision du Conseil du 31 mars 1992 modifiant la décision
    91/667/CEE relative aux contingents d''importation à ouvrir par les États membres
    à l''égard des pays à commerce d''État en 1991 pour tenir compte de la dissolution
    de l''Union soviétique'
  type: main
- language: de
