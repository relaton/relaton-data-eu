title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/942 of 10 June 2021 laying down
    rules for the application of Council Directive 2006/112/EC as regards the establishment
    of the list of third countries with which the Union has concluded an agreement
    on mutual assistance similar in scope to Council Directive 2010/24/EU and Council
    Regulation (EU) No 904/2010
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/942 de la Commission du 10 juin 2021
    portant modalités d’application de la directive 2006/112/CE du Conseil en ce
    qui concerne l’établissement de la liste des pays tiers avec lesquels l’Union
    a conclu un accord en matière d’assistance mutuelle ayant une portée similaire
    à la directive 2010/24/UE du Conseil et au règlement (UE) no 904/2010 du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/942 der Kommission vom 10. Juni 2021
    mit Durchführungsbestimmungen zur Richtlinie 2006/112/EG des Rates hinsichtlich
    der Erstellung der Liste der Drittländer, mit denen die Union ein Abkommen über
    gegenseitige Amtshilfe geschlossen hat, dessen Anwendungsbereich der Richtlinie
    2010/24/EU des Rates und der Verordnung (EU) Nr. 904/2010 des Rates ähnelt
  type: main
