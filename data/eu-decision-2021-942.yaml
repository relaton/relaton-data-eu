    jde o stanovení seznamu třetích zemí, s nimiž Unie uzavřela dohodu o vzájemné
    pomoci s podobnou oblastí působnosti jako směrnice Rady 2010/24/EU a nařízení
    Rady (EU) č. 904/2010
  type: main
