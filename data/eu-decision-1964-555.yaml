title:
- language: fr
  script: Latn
  content: Décision 64/555/CEE de la Commission, du 21 septembre 1964, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/555/EWG: Entscheidung der Kommission vom 21. September 1964 über den
    Antrag der Französischen Republik nach Artikel 115 Absatz (1) des Vertrages auf
    Ausschluß bestimmter Erzeugnisse aus dritten Ländern, die sich in den anderen
    Mitgliedstaaten im freien Verkehr befinden, aus der Gemeinschaftsbehandlung'
  type: main
- language: it
  script: Latn
  content: '64/555/CEE: Decisione della Commissione, del 21 settembre 1964, relativa
    al ricorso presentato dalla Repubblica francese ai sensi dell''articolo 115, comma
    I, del Trattato, per escludere dal trattamento comunitario taluni prodotti originari
    di paesi terzi e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/555/EEG: Beschikking van de Commissie van 21 september 1964 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 155, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer worden gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
