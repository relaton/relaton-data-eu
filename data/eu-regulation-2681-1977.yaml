    Satzes für die Bestimmung der im Rahmen der obligatorischen Destillation zu liefernden
    Alkoholmenge im Wirtschaftsjahr 1976/77
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2681/77 af 5. december 1977 om anden
