  content: Commission Regulation No 94/66/EEC of 5 may 1966 modifying Commission Regulation
    7/64/EEC of 29 January 1964, establishing the list of communes in frontier areas
    on either side of borders common to France and other adjacent Member States and
    decided on in order to implement article 3 of Council Regulation No 3/64/EEC of
    18 December 1963 enforcing the Annexes of Council Regulation 36/63/EEC on social
    security of frontier workers
  type: main
- language: fr
  script: Latn
  content: Règlement n° 94/66/CEE de la Commission, du 5 mai 1966, portant modification
    du règlement n° 7/64/CEE de la Commission, du 29 janvier 1964, fixant la liste
    des communes des zones frontalières établies de part et d'autre de la frontière
    commune à la France et aux autres États membres limitrophes, arrêté en application
    de l'article 3 du règlement n° 3/64/CEE du Conseil, du 18 décembre 1963, portant
    établissement des annexes du règlement n° 36/63/CEE du Conseil concernant la
    sécurité sociale des travailleurs frontaliers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG NR. 94/66/EWG DER KOMMISSION VOM 5. MAI 1966 ZUR AENDERUNG DER
    VERORDNUNG NR. 7/64/EWG DER KOMMISSION VOM 29. JANUAR 1964 ZUR FESTLEGUNG DER
    LISTE DER GEMEINDEN INNERHALB DER BEIDERSEITS DER GEMEINSAMEN GRENZE ZWISCHEN
    FRANKREICH UND DEN ANGRENZENDEN MITGLIEDSTAATEN FESTGELEGTEN GRENZZONEN, ERLASSEN
    GEMAESS ARTIKEL 3 DER VERORDNUNG NR. 3/64/EWG DES RATES VOM 18. DEZEMBER 1963
    ZUR FESTLEGUNG DER ANHAENGE DER VERORDNUNG NR. 36/63/EWG DES RATES UEBER DIE SOZIALE
    SICHERHEIT DER GRENZGAENGER
  type: main
- language: el
  script: Grek
  content: Κανονισμός αριθ. 94/66/ΕΟΚ της Επιτροπής,
    της 5ης Μαΐου 1966, περί τροποποίησης του κανονισμού
    αριθ. 7/64/ΕΟΚ της Επιτροπής της 29ης Ιανουαρίου
    1964, περί καθορισμού ενός καταλόγου με τις Κοινότητες
    των παραμεθορίων περιοχών από τις δύο πλευρές
    των κοινών συνόρων της Γαλλίας και των άλλων
    κρατών μελών που την περιβάλλουν, ο οποίος
    καθορίστηκε εις εφαρμογήν του άρθρου 3 του
    κανονισμού αριθ. 3/64/ΕΟΚ του Συμβουλίου της
    18ης Δεκεμβρίου 1963, περί καθορισμού των παραρτημάτων
    του κανονισμού αριθ. 36/63/ΕΟΚ του Συμβουλίου
    όσον αφορά την κοινοτική ασφάλιση των εργαζομένων
    σε παραμεθόριες περιοχές
  type: main
- language: it
  script: Latn
  content: Regolamento n. 94/66/CEE della Commissione, del 5 maggio 1966, che modifica
    il regolamento n. 7/64/CEE della Commissione, del 29 gennaio 1964, che stabilisce
    l' elenco dei comuni delle zone frontaliere situate da una parte e dall' altra
    della frontiera comune alla Francia e agli Stati membri limitrofi, adottato in
    applicazione dell' articolo 3 del regolamento n. 3/64/CEE del Consiglio, del 18
    dicembre 1963, che stabilisce gli allegati al regolamento n. 36/63/CEE del Consiglio
    relativo alla sicurezza sociale dei lavoratori frontalieri
  type: main
- language: nl
  script: Latn
