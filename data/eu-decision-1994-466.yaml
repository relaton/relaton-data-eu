    eläinten terveyttä ja kansanterveyttä koskevista vaatimuksista sellaisten tuotteiden
    yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa, joita eivät koske direktiivin
    89/662/ETY ja, taudinaiheuttajien osalta, direktiivin 90/425/ETY liitteessä A
    olevassa I luvussa mainittujen erityisten yhteisön säädösten kyseiset vaatimukset,
    annetun neuvoston direktiivin 92/118/ETY liitteessä I olevan 13 luvun muuttamisesta'
  type: main
- language: hr
  script: Latn
  content: '94/466/EZ: Odluka Komisije od 13. srpnja 1994. o izmjeni Priloga I. poglavlja
    13. Direktive Vijeća 92/118/EEZ o utvrđivanju zahtjeva za zdravlje životinja
    i zahtjeva za javno zdravlje kojima se uređuje trgovina i uvoz u Zajednicu proizvoda
    koji ne podliježu navedenim zahtjevima utvrđenim u posebnim pravilima Zajednice
    iz Priloga A dijela I. Direktive 89/662/EEZ te, s obzirom na patogene tvari, iz
    Direktive 90/425/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1994. július 13.) a 89/662/EGK irányelv, illetve
    a kórokozók tekintetében a 90/425/EGK irányelv A. mellékletének I. pontjában
    felsorolt külön közösségi szabályokban megállapított állat-egészségügyi
    és közegészségügyi követelmények hatálya alá nem tartozó termékek Közösségen
    belüli kereskedelmére és a Közösségbe történő behozatalára irányadó
    állat-egészségügyi és közegészségügyi követelmények megállapításáról
    szóló, 1992. december 17-i 92/118/EGK tanácsi irányelv I. melléklete 13.
    fejezetének módosításáról
  type: main
- language: it
  script: Latn
  content: '94/466/CE: Decisione della Commissione del 13 luglio 1994 recante modifica
    dell''allegato I, capitolo 13 della direttiva 92/118/CEE del Consiglio che stabilisce
    le condizioni sanitarie e di polizia sanitaria per gli scambi e le importazioni
    nella Comunità di prodotti non soggetti, per quanto riguarda tali condizioni,
    alle normative Comunitàrie specifiche di cui all''allegato A, capitolo I della
    direttiva 89/662/CEE e, per quanto riguarda i patogeni, alla direttiva 90/425/CEE'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1994. gada 13. jūlijs), ar ko groza I pielikuma 13.
    nodaļu Padomes Direktīvā 92/118/EEK, ar ko nosaka dzīvnieku veselības un
    sabiedrības veselības aizsardzības prasības, kas reglamentē to produktu tirdzniecību
    un importu Kopienā, kuri nav pakļauti minētajām prasībām, kas noteiktas
    īpašos Kopienas noteikumos, kuri minēti Direktīvas 89/662/EEK A pielikuma
    I daļā, un attiecībā uz patogēniem — Direktīvā 90/425/EEK
  type: main
- language: lt
  script: Latn
  content: 1994 m. liepos 13 d. Komisijos sprendimas iš dalies keičiantis Tarybos
    direktyvos 92/118/EEB, nustatančios gyvūnų sveikatos ir visuomenės sveikatos
    reikalavimus, reglamentuojančius produktų, kuriems netaikomi reikalavimai, nustatyti
    specialiose Bendrijos taisyklėse, nurodytose Direktyvos 89/662/EEB A priedo I
    dalyje, ir, ligų sukėlėjų atžvilgiu, Direktyvoje 90/425/EEB, prekybą Bendrijoje
    ir jų importą į Bendriją, I priedo 13 skyrių
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-13 ta' Lulju 1994 li temenda l-Anness
    I(13) tad-Direttiva tal-Kunsill 92/118/KEE li tistabbilixxi l-ħtiġiet għas-saħħa
    ta' l-annimali u s-saħħa pubblika li jirregolaw il-kummerċ fi u l-importazzjonijiet
    fil-Komunità ta' prodotti mhux suġġetti għall-imsemmija ħtiġiet stabbiliti
    f'regoli speċifiċi tal-Komunità u li hemm referenza dwarhom fl-Anness A (I)
    tad-Direttiva 89/662/KEE u, fir-rigward ta' patoġeni, tad-Direttiva 90/425/KEE
  type: main
- language: nl
  script: Latn
  content: '94/466/EG: Beschikking van de Commissie van 13 juli 1994 tot wijziging
    van bijlage I, hoofdstuk 13, van Richtlijn 92/118/EEG van de Raad tot vaststelling
    van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer
    en de invoer in de Gemeenschap van produkten waarvoor ten aanzien van deze voorschriften
    geen specifieke communautaire regelgeving geldt als bedoeld in bijlage A, hoofdstuk
    I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 13 lipca 1994 r. zmieniająca rozdział 13 załącznika
    I do dyrektywy Rady 92/118/EWG ustanawiającej warunki zdrowotne zwierząt i zdrowia
    publicznego regulujące handel i przywóz do Wspólnoty produktów nieobjętych
    wyżej wymienionymi warunkami ustanowionymi w szczególnych zasadach wspólnotowych
    określonych w załączniku A (I) do dyrektywy 89/662/EWG oraz, w odniesieniu
    do czynników chorobotwórczych, do dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: '94/466/CE: Decisão da Comissão de 13 de Julho de 1994 que altera o capítulo
    13 do anexo I da Directiva 92/118/CEE do Conselho, que define as condições sanitárias
    e de polícia sanitária que regem o comércio e as importações na Comunidade
    de produtos não sujeitos, no que respeita às referidas condições, às regulamentações
    comunitárias específicas referidas no capítulo I do anexo A da Directiva 89/662/CEE
    e, no que respeita aos agentes patogénicos, da Directiva 90/425/CEE'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 13 iulie 1994 de modificare a anexei I capitolul 13
    la Directiva 92/118/CEE a Consiliului de stabilire a condițiilor de sănătate
    publică și animală care reglementează schimburile și importurile în Comunitate
    de produse care nu intră sub incidența condițiilor menționate, stabilite de
    normele comunitare speciale prevăzute de anexa A capitolul I din Directiva 89/662/CEE
    și, în ceea ce privește agenții patogeni, din Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 13. júla 1994, ktorým sa mení a dopĺňa príloha
    I (13) k smernici Rady 92/118/EHS stanovujúcej požiadavky kladené na zdravie
    zvierat a na zdravie ľudí, ktorými sa riadi obchod s produktmi a dovoz do spoločenstva
    produktov, ktoré nie sú predmetom daných požiadaviek stanovených v osobitných
    pravidlách spoločenstva uvedených v prílohe A (I) smernice 89/662/EHS a, pokiaľ
    ide o patogény, smernice 90/425/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 13. julija 1994 o spremembi Priloge I (13) k Direktivi
    Sveta 92/118/EGS o določitvi zahtev glede zdravstvenega varstva živali in javnozdravstvenega
    varstva, ki urejajo trgovino in uvoz v Skupnost za tiste proizvode, za katere
    ne veljajo navedene zahteve, določene v posebnih pravilih Skupnosti iz Priloge
    A(I) k Direktivi 89/662/EGS, glede povzročiteljev bolezni pa k Direktivi 90/425/EGS
  type: main
- language: es
  script: Latn
  content: '94/466/CE: Decisión de la Comisión de 13 de julio de 1994 por la que
    se modifica el capítulo 13 del Anexo I de la Directiva 92/118/CEE del Consejo,
    por la que se establecen las condiciones de policía sanitaria y sanitarias aplicables
    a los intercambios y a las importaciones en la Comunidad de productos no sometidos,
    con respecto a estas condiciones, a las normativas comunitarias específicas a
    que se refiere el capítulo I del Anexo A de la Directiva 89/662/CEE y, por lo
    que se refiere a los patógenos, de la Directiva 90/425/CEE'
  type: main
- language: sv
  script: Latn
  content: '94/466/EG: Kommissionens beslut av den 13 juli 1994 om ändring av kapitel
    13 i bilaga I till rådets direktiv 92/118/EEG om djurhälso- och hygienkrav för
    handel inom gemenskapen med produkter, som inte omfattas av sådana krav i de
    särskilda gemenskapsbestämmelser som avses i bilaga A. I till direktiv 89/662/EEG
    och, i fråga om patogener, i direktiv 90/425/EEG'
