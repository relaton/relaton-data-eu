title:
- language: en
  script: Latn
  content: '94/466/EC: Commission Decision of 13 July 1994 amending Annex I (13) to
    Council Directive 92/118/EEC laying down animal health and public health requirements
    governing trade in and imports into the Community of products not subject to the
    said requirements laid down in specific Community rules referred to in Annex A
    (I) to Directive 89/662/EEC and, as regards pathogens, to Directive 90/425/EEC'
  type: main
- language: fr
  script: Latn
  content: '94/466/CE: Décision de la Commission du 13 juillet 1994 modifiant l''annexe
    I chapitre 13 de la directive 92/118/CEE du Conseil définissant les conditions
    de police sanitaire ainsi que les conditions sanitaires régissant les échanges
    et les importations dans la Communauté de produits non soumis, en ce qui concerne
    lesdites conditions, aux réglementations communautaires spécifiques visées
    à l''annexe A chapitre Ier de la directive 89/662/CEE et, en ce qui concerne
    les pathogènes, de la directive 90/425/CEE'
  type: main
- language: de
  script: Latn
  content: '94/466/EG: Entscheidung der Kommission vom 13. Juli 1994 zur Änderung
    des Anhangs I Kapitel 13 der Richtlinie 92/118/EWG des Rates über die tierseuchenrechtlichen
    und gesundheitlichen Bedingungen für den Handel mit Erzeugnissen tierischen Ursprungs
    in der Gemeinschaft sowie für ihre Einfuhr in die Gemeinschaft, soweit sie diesbezüglich
    nicht den spezifischen Gemeinschaftsregelungen nach Anhang A Kapitel I der Richtlinie
    89/662/EWG und - in Bezug auf Krankheitserreger - der Richtlinie 90/425/EWG unterliegen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 13 юли 1994 година
    относно изменение на приложение I, глава 13 на
    Директива 92/118/ЕИО на Съвета за определяне на
    ветеринарно-санитарните и здравните изисквания
    относно търговията и вноса в Общността на продукти,
    които не са подчинени, по отношение на посочените
    изисквания, на специалните правила на Общността,
    посочени в глава I, приложение А към Директива
    89/662/ЕИО и, по отношение на патогените, на Директива
    90/425/ЕИО
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 13. července 1994, kterým se mění kapitola
    13 přílohy I směrnice Rady 92/118/EHS o veterinárních a hygienických předpisech
    pro obchod s produkty živočišného původu ve Společenství a jejich dovoz
    do Společenství, pokud se na ně nevztahují zvláštní předpisy Společenství
    uvedené v kapitole I přílohy A směrnice 89/662/EHS, a pokud jde o patogenní
    původce, směrnice 90/425/EHS
  type: main
- language: da
  script: Latn
  content: '94/466/EF: Kommissionens beslutning af 13. juli 1994 om ændring af kapitel
    13 i bilag i til Rådets direktiv 92/118/EØF om dyresundhedsmæssige og sundhedsmæssige
    betingelser for samhandel med og indførsel til Fællesskabet af produkter, der
    for så vidt angår disse betingelser ikke er underlagt specifikke fællesskabsbestemmelser,
    som omhandlet i bilag A, kapitel i, i direktiv 89/662/EØF, og for så vidt angår
    patogener, i direktiv 90/425/EØF'
  type: main
- language: el
  script: Grek
