    e seus reboques e dos sistemas, componentes e unidades técnicas destinados a
    esses veículos, no que se refere à sua segurança geral e à proteção dos
    ocupantes dos veículos e dos utentes da estrada vulneráveis, que altera o Regulamento
    (UE) 2018/858 do Parlamento Europeu e do Conselho e revoga os Regulamentos (CE)
    n.o 78/2009, (CE) n.o 79/2009 e (CE) n.o 661/2009 do Parlamento Europeu e do Conselho
    e os Regulamentos (CE) n.o 631/2009, (UE) n.o 406/2010, (UE) n.o 672/2010, (UE)
