  script: Latn
  content: Regulamentul (UE) 2019/2144 al Parlamentului European și al Consiliului
    din 27 noiembrie 2019 privind cerințele pentru omologarea de tip a autovehiculelor
    și remorcilor acestora, precum și a sistemelor, componentelor și unităților
    tehnice separate destinate unor astfel de vehicule, în ceea ce privește siguranța
    generală a acestora și protecția ocupanților vehiculului și a utilizatorilor
    vulnerabili ai drumurilor, de modificare a Regulamentului (UE) 2018/858 al Parlamentului
    European și al Consiliului și de abrogare a Regulamentelor (CE) nr. 78/2009,
    (CE) nr. 79/2009 și (CE) nr. 661/2009 ale Parlamentului European și ale Consiliului
