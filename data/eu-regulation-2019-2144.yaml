  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2019/2144 z 27. novembra
    2019 o požiadavkách na typové schvaľovanie motorových vozidiel a ich prípojných
    vozidiel a systémov, komponentov a samostatných technických jednotiek určených
    pre tieto vozidlá, pokiaľ ide o ich všeobecnú bezpečnosť a ochranu cestujúcich
