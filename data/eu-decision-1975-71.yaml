---
id: EUDecision197571
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 January 1975 authorizing the Federal Republic
    of Germany not to apply Community treatment to preparations and preserves of beans
    in pod, falling within subheading 20.02 ex G of the Common Customs Tariff, originating
    in the People's Republic of China, and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '75/71/CEE: Décision de la Commission, du 20 janvier 1975, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    les préparations et conserves de haricots verts de la sous-position 20.02 Ex
    G du Tarif douanier commun, originaires de la République populaire de Chine et
    mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Januar 1975, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Volksrepublik China stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Konserven und Zubereitungen
    von grünen Bohnen der Tarifnummer 20.02 ex G des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. januar 1975 om bemyndigelse af forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage grønne bønner, tilberedt
    eller konserveret, som henhører under position 20.02 ex G i den fælles toldtarif,
    har oprindelse i folkerepublikken Kina og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 gennaio 1975, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario le preparazioni
    e conserve di fagiolini della voce 20.02 ex G della tariffa doganale comune, originari
    della Repubblica popolare cinese e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 januari 1975 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd bereidingen en conserven van sla-, spek-, pronk- en
    snijbonen, van post 20.02 ex G van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
