title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1074/83 of 3 May 1983 re-establishing the
    levying of customs duties on gelatin and gelatin derivatives, falling within subheading
    35.03 ex B and originating in Colombia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1074/83 de la Commission du 3 mai 1983 portant rétablissement
    de la perception des droits de douane applicables aux gélatines et leurs dérivés,
    de la sous-position 35.03 ex B du tarif douanier commun, originaires de la Colombie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1074/83 der Kommission vom 3. Mai 1983 zur Wiedereinführung
    der Erhebung der Zölle für Gelatine und ihre Derivate der Tarifstelle 35.03
    ex B, mit Ursprung in Kolumbien, dem die in der Verordnung (EWG) Nr. 3377/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1074/83 af 3. maj 1983 om genindførelse
    af opkrævning af told for gelatine og derivater deraf, henhørende under pos.
    35.03 ex B og med oprindelse i Colombia, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1074/83 της Επιτροπής
    της 3ης Μαΐου 1983 περί αποκαταστάσεως της εφαρμογής
    των δασμών για τις ζελατίνες και τα παράγωγα
    αυτών της διακρίσεως 35.03 ex Β του Κοινού Δασμολογίου,
    καταγωγής Κολομβίας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1074/83 della Commissione del 3 maggio 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle gelatine e loro derivati, della
    sottovoce 35.03 ex B della tariffa doganale comune, originarie della Colombia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1074/83 van de Commissie van 3 mei 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan van postonderverdeling 35.03 ex B, van oorsprong uit Colombia
    waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
