id: EURegulation27371977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2737/77 of 9 December 1977 amending Regulation
    (EEC) No 537/70 authorizing Member States to take measures derogating from certain
    requirements of the quality standards applicable to exports to third countries
    of flowering bulbs, corms and tubers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2737/77 de la Commission, du 9 décembre 1977, modifiant
    le règlement (CEE) n° 537/70 autorisant les États membres à prendre des mesures
    dérogatoires à certains critères des normes de qualité applicables aux exportations
    vers les pays tiers des bulbes, oignons et tubercules à fleurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2737/77 der Kommission vom 9. Dezember 1977 zur Änderung
    der Verordnung (EWG) Nr. 537/70, mit der die Mitgliedstaaten ermächtigt werden,
    bei der Ausfuhr von Blumenbulben, -zwiebeln und -knollen nach dritten Ländern
    abweichende Maßnahmen in bezug auf gewisse Kriterien der Qualitätsnormen zu
    treffen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2737/77 af 9. december 1977 om ændring
    af forordning (EØF) nr. 537/70 ved hvilken medlemsstaterne bemyndiges til for
    udførsel af blomsterløg og -knolde til tredjelande at træffe foranstaltninger,
    der afviger fra visse af kvalitetsnormernes kriterier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2737/77 της Επιτροπής
    της 9ης Δεκεμβρίου 1977 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 537/70 «περί εξουσιοδοτήσεως
    των κρατών μελών να λάβουν μέτρα παρεκκλίσεως
    από ορισμένα κριτήρια των κανόνων ποιότητος
    που εφαρμόζονται στις εξαγωγές προς τις τρίτες
    χώρες βολβών, κρομμύων και κονδύλων για παραγωγή
    ανθέων»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2737/77 della Commissione, del 9 dicembre 1977, recante
    modifica del regolamento (CEE) n. 537/70, che autorizza gli Stati membri ad adottare
    misure di deroga a taluni criteri delle norme di qualità applicabili alle esportazioni
    verso i paesi terzi dei bulbi, tuberi e rizomi da fiore
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2737/77 van de Commissie van 9 december 1977 tot
    wijziging van Verordening (EEG) nr. 537/70 houdende machtiging van de Lid-Staten
    tot het treffen van maatregelen die afwijken van bepaalde criteria van de kwaliteitsnormen
    bij uitvoer naar de derde landen van bloembollen en bloemknollen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2737/77 da Comissão, de 9 de Dezembro de 1977,
    que altera o Regulamento (CEE) n.° 537/70 que autoriza os Estados-membros a tomar
    medidas derrogatórias de certos critérios das normas de qualidade aplicáveis
    às exportações para países terceiros de bolbos, cebolas e tubérculos com
    flores
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2737/77 de la Comisión, de 9 de diciembre de 1977,
    por el que se modifica el Reglamento (CEE) n° 537/70 por el que se autoriza a
    los Estados miembros a adoptar medidas que constituyan excepción a determinados
    criterios de la normas de calidad aplicables a las exportaciones a terceros países
    de bulbos, cebollas y tubérculos de flores
  type: main
