title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2021/512 of 22 March 2021 authorising
    the United Kingdom to apply, in respect of Northern Ireland, a special measure
    derogating from Articles 16 and 168 of Directive 2006/112/EC on the common system
    of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/512 du Conseil du 22 mars 2021 autorisant
    le Royaume-Uni à appliquer, en ce qui concerne l’Irlande du Nord, une mesure
    particulière dérogatoire aux articles 16 et 168 de la directive 2006/112/CE
    relative au système commun de taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/512 des Rates vom 22. März 2021 zur
    Ermächtigung des Vereinigten Königreichs, in Bezug auf Nordirland eine von den
    Artikeln 16 und 168 der Richtlinie 2006/112/EG des Rates über das gemeinsame
    Mehrwertsteuersystem abweichende Sonderregelung anzuwenden
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/512 на Съвета
    от 22 март 2021 година за предоставяне на разрешение
    на Обединеното кралство да прилага по отношение
    на Северна Ирландия специална мярка за дерогация
    от членове 16 и 168 от Директива 2006/112/ЕО относно
    общата система на данъка върху добавената
    стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2021/512 ze dne 22. března 2021, kterým
    se Spojenému království povoluje používat ve vztahu k Severnímu Irsku zvláštní
    opatření odchylující se od článků 16 a 168 směrnice 2006/112/ES o společném
    systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2021/512 af 22. marts 2021 om at
    give Det Forenede Kongerige tilladelse til for så vidt angår Nordirland at anvende
    en særlig foranstaltning, der fraviger artikel 16 og 168 i direktiv 2006/112/EF
    om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/512 του Συμβουλίου
    της 22ας Μαρτίου 2021 με την οποία επιτρέπεται
    στο Ηνωμένο Βασίλειο να εφαρμόσει, όσον αφορά
    τη Βόρεια Ιρλανδία, ειδικό μέτρο παρέκκλισης
    από τα άρθρα 16 και 168 της οδηγίας 2006/112/ΕΚ σχετικά
    με το κοινό σύστημα φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2021/512, 22. märts 2021, millega lubatakse
    Ühendkuningriigil seoses Põhja-Iirimaaga kohaldada erimeedet, millega tehakse
    erand direktiivi 2006/112/EÜ (mis käsitleb ühist käibemaksusüsteemi) artiklitest
    16 ja 168
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2021/512, annettu 22 päivänä
    maaliskuuta 2021, luvan antamisesta Yhdistyneelle kuningaskunnalle soveltaa Pohjois-Irlannin
    osalta yhteisestä arvonlisäverojärjestelmästä annetun direktiivin 2006/112/EY
    16 ja 168 artiklasta poikkeavaa erityistoimenpidettä
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2021/512 od 22. ožujka 2021. kojom se Ujedinjenoj
    Kraljevini odobrava primjena, u vezi sa Sjevernom Irskom, posebne mjere odstupanja
    od članaka 16. i 168. Direktive 2006/112/EZ o zajedničkom sustavu poreza na
    dodanu vrijednost
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/512 végrehajtási határozata (2021. március 22.)
    az Egyesült Királyságnak a közös hozzáadottértékadó-rendszerről szóló
    2006/112/EK irányelv 16. cikkétől és 168 cikkétől eltérő intézkedés
    Észak-Írország tekintetében való alkalmazására történő felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/512 del Consiglio del 22 marzo 2021 che
    autorizza il Regno Unito ad applicare nei confronti dell’Irlanda del Nord una
    misura speciale di deroga agli articoli 16 e 168 della direttiva 2006/112/CE,
    relativa al sistema comune d’imposta sul valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2021/512 (2021. gada 22. marts), ar
    ko Apvienotajai Karalistei attiecībā uz Ziemeļīriju atļauj piemērot īpašu
    pasākumu, atkāpjoties no 16. un 168. panta Direktīvā 2006/112/EK par kopējo
    pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2021/512 2021 m. kovo 22 d. kuriuo
    Jungtinei Karalystei, kiek tai susiję su Šiaurės Airija, leidžiama taikyti
    specialią priemonę, kuria nukrypstama nuo Direktyvos 2006/112/EB dėl pridėtinės
    vertės mokesčio bendros sistemos 16 ir 168 straipsnių
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2021/512 tat-22 ta’
    Marzu 2021 li tawtorizza lir-Renju Unit japplika, fir-rigward tal-Irlanda ta’
    Fuq, miżura speċjali li tidderoga mill-Artikoli 16 u 168 tad-Direttiva tal-Kunsill
    2006/112/KE dwar is-sistema komuni ta’ taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/512 van de Raad van 22 maart 2021 waarbij
    het Verenigd Koninkrijk wordt gemachtigd een bijzondere maatregel toe te passen
    met betrekking tot Noord-Ierland die afwijkt van de artikelen 16 en 168 van Richtlijn
    2006/112/EG betreffende het gemeenschappelijke stelsel van belasting over de toegevoegde
    waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2021/512 z dnia 22 marca 2021 r. w sprawie
    upoważnienia Zjednoczonego Królestwa do stosowania, w odniesieniu do Irlandii
    Północnej, szczególnego środka stanowiącego odstępstwo od art. 16 i 168
    dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/512 do Conselho de 22 de março de 2021
    que autoriza o Reino Unido a aplicar, no que respeita à Irlanda do Norte, uma
    medida especial em derrogação dos artigos 16.o e 168.o da Diretiva 2006/112/CE
    relativa ao sistema comum do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/512 a Consiliului din 22 martie
    2021 prin care Regatul Unit este autorizat să aplice, în ceea ce privește Irlanda
    de Nord, o măsură specială de derogare de la articolele 16 și 168 din Directiva
    2006/112/CE privind sistemul comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2021/512 z 22. marca 2021, ktorým
    sa Spojenému kráľovstvu, pokiaľ ide o Severné Írsko, povoľuje uplatňovať
    osobitné opatrenie odchyľujúce sa od článkov 16 a 168 smernice 2006/112/ES
    o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2021/512 z dne 22. marca 2021 o dovoljenju Združenemu
    kraljestvu, da v zvezi s Severno Irsko uporablja posebni ukrep, ki odstopa od
    členov 16 in 168 Direktive 2006/112/ES o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/512 del Consejo de 22 de marzo de 2021
    por la que se autoriza al Reino Unido a aplicar, con respecto a Irlanda del Norte,
    una medida especial de excepción a lo dispuesto en los artículos 16 y 168 de
    la Directiva 2006/112/CE relativa al sistema común del impuesto sobre el valor
    añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2021/512 av den 22 mars 2021 om bemyndigande
    för Förenade kungariket att tillämpa, med avseende på Nordirland, en särskild
    åtgärd som avviker från artiklarna 16 och 168 i direktiv 2006/112/EG om ett
    gemensamt system för mervärdesskatt
