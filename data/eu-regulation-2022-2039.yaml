title:
- language: en
  script: Latn
  content: Regulation (EU) 2022/2039 of the European Parliament and of the Council
    of 19 October 2022 amending Regulations (EU) No 1303/2013 and (EU) 2021/1060 as
    regards additional flexibility to address the consequences of the military aggression
    of the Russian Federation FAST (Flexible Assistance for Territories) – CARE
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/2039 du Parlement européen et du Conseil du 19 octobre
    2022 modifiant le règlement (UE) no 1303/2013 et le règlement (UE) 2021/1060
    en ce qui concerne une flexibilité supplémentaire pour faire face aux conséquences
    de l’agression militaire menée par la Fédération de Russie FAST (Assistance
    flexible aux territoires) — CARE
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/2039 des Europäischen Parlaments und des Rates vom
    19. Oktober 2022 zur Änderung der Verordnungen (EU) Nr. 1303/2013 und (EU) 2021/1060
    im Hinblick auf zusätzliche Flexibilität zur Bewältigung der Folgen des militärischen
    Angriffs durch die Russische Föderation FAST — CARE (Flexible Assistance for
    Territories — Flexible Unterstützung für Gebiete)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2022/2039 на Европейския парламент
    и на Съвета от 19 октомври 2022 година за изменение
    на регламенти (ЕС) № 1303/2013 и (ЕС) 2021/1060 по отношение
    на допълнителната гъвкавост за справяне с
    последиците от военната агресия от страна
    на Руската федерация FAST (Гъвкава помощ за териториите)
    — CARE
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2022/2039 ze dne 19. října
    2022, kterým se mění nařízení (EU) č. 1303/2013 a (EU) 2021/1060, pokud
    jde o dodatečnou flexibilitu pro řešení důsledků vojenské agrese Ruské
    federace FAST (flexibilní pomoc územím) – CARE
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2022/2039 af 19. oktober
    2022 om ændring af forordning (EU) nr. 1303/2013 og (EU) 2021/1060 for så vidt
    angår yderligere fleksibilitet til håndtering af konsekvenserne af Den Russiske
    Føderations militære aggression FAST (fleksibel bistand til områder) — CARE
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2022/2039 του Ευρωπαϊκού Κοινοβουλίου
