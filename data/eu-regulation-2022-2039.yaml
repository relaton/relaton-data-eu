    paindlikkusega Venemaa Föderatsiooni sõjalise agressiooni tagajärgedega tegelemiseks
    FAST (paindlik abi territooriumidele) – CARE
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2022/2039, annettu 19 päivänä
    lokakuuta 2022, asetusten (EU) N:o 1303/2013 ja (EU) 2021/1060 muuttamisesta siltä
    osin kuin on kyse lisäjoustosta, jolla puututaan Venäjän federaation sotilaallisen
    hyökkäyksen seurauksiin – joustavaa apua alueille koskevat FAST-CARE-toimenpiteet
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2022/2039 ó Pharlaimint na hEorpa agus ón gComhairle
