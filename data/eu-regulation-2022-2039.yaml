    την τροποποίηση των κανονισμών (ΕΕ) αριθ. 1303/2013
    και (ΕΕ) 2021/1060 σχετικά με πρόσθετη ευελιξία
    για την αντιμετώπιση των συνεπειών της στρατιωτικής
