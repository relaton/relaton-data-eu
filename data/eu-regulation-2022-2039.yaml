    za obravnavanje posledic vojaške agresije Ruske federacije FAST (prožna pomoč
    za ozemlja) – CARE
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2022/2039 del Parlamento Europeo y del Consejo de 19 de
    octubre de 2022 que modifica los Reglamentos (UE) n.o 1303/2013 y (UE) 2021/1060
    por lo que respecta a una mayor flexibilidad para hacer frente a las consecuencias
    de la agresión militar por parte de la Federación de Rusia - Asistencia Flexible
    para los Territorios (FAST-CARE)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2022/2039 av den 19 oktober
    2022 om ändring av förordningarna (EU) nr 1303/2013 och (EU) 2021/1060 vad gäller
    ytterligare flexibilitet för att hantera konsekvenserna av Ryska federationens
    militära angrepp Fast (flexibelt stöd till territorier) – Care
