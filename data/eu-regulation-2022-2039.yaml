    agus (AE) 2021/1060 a mhéid a bhaineann le solúbthacht bhreise chun aghaidh
    a thabhairt ar iarmhairtí fhogha míleata Chónaidhm na Rúise FAST (Cúnamh
    Solúbtha do Chríocha) – CARE
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2022/2039 Europskog parlamenta i Vijeća od 19. listopada 2022.
    o izmjeni uredaba (EU) br. 1303/2013 i (EU) 2021/1060 u pogledu dodatne fleksibilnosti
    radi odgovora na posljedice vojne agresije Ruske Federacije FAST (Flexible Assistance
    for Territories – fleksibilna pomoć područjima) – CARE
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2022/2039 rendelete (2022. október
    19.) az 1303/2013/EU és az (EU) 2021/1060 rendeletnek az Oroszországi Föderáció
    által elkövetett katonai agresszió következményeinek kezelését célzó
    további rugalmasság tekintetében történő módosításáról FAST (a területeknek
    nyújtott rugalmas támogatás) - CARE
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/2039 del Parlamento europeo e del Consiglio del 19
    ottobre 2022 recante modifica dei regolamenti (UE) n. 1303/2013 e (UE) 2021/1060
    per quanto concerne la flessibilità addizionale per affrontare le conseguenze
    dell’aggressione militare da parte della Federazione russa FAST (assistenza
    flessibile ai territori) — CARE
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2022/2039 (2022. gada 19. oktobris),
    ar ko groza Regulas (ES) Nr. 1303/2013 un (ES) 2021/1060 attiecībā uz papildu
    elastību nolūkā novērst Krievijas Federācijas militārās agresijas sekas
    FAST (elastīga palīdzība teritorijām) – CARE
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2022/2039 2022 m. spalio
    19 d. kuriuo dėl papildomo lankstumo Rusijos Federacijos karinės agresijos padariniams
    šalinti iš dalies keičiami reglamentai (ES) Nr. 1303/2013 ir (ES) 2021/1060
    FAST (lanksti pagalba teritorijoms) – CARE
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2022/2039 tal-Parlament Ewropew u tal-Kunsill tad-19 ta’
