    ta’ aktar flessibbiltà biex jiġu indirizzati l-konsegwenzi tal-aggressjoni
    militari tal-Federazzjoni Russa FAST (Assistenza Flessibbli għat-Territorji)
    — CARE
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2022/2039 van het Europees Parlement en de Raad van 19
    oktober 2022 tot wijziging van Verordeningen (EU) nr. 1303/2013 en (EU) 2021/1060
    met het oog op extra flexibiliteit om de gevolgen van de militaire agressie van
    de Russische Federatie op te vangen FAST (Flexible Assistance for Territories)
    — CARE
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2022/2039 z dnia 19
    października 2022 r. w sprawie zmiany rozporządzeń (UE) nr 1303/2013 i (UE)
    2021/1060 w odniesieniu do dodatkowej elastyczności w celu przeciwdziałania
    skutkom agresji zbrojnej Federacji Rosyjskiej FAST (Flexible Assistance for Territories
    – elastyczna pomoc dla terytoriów) – CARE
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2022/2039 do Parlamento Europeu e do Conselho de 19 de
    outubro de 2022 que altera os Regulamentos (UE) n.o 1303/2013 e (UE) 2021/1060
    no que respeita a uma maior flexibilidade para fazer face às consequências da
    agressão militar da Federação da Rússia FAST (assistência flexível aos territórios)
    — CARE
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2022/2039 al Parlamentului European și al Consiliului
    din 19 octombrie 2022 de modificare a Regulamentelor (UE) nr. 1303/2013 și (UE)
    2021/1060 în ceea ce privește o flexibilitate suplimentară FAST (Asistență
    flexibilă pentru teritorii) – CARE pentru a aborda consecințele agresiunii
    militare a Federației Ruse
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2022/2039 z 19. októbra
    2022, ktorým sa menia nariadenia (EÚ) č. 1303/2013 a (EÚ) 2021/1060, pokiaľ
    ide o dodatočnú flexibilitu na riešenie dôsledkov vojenskej agresie Ruskej
    federácie FAST (Flexibilná pomoc územiam) – CARE
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2022/2039 Evropskega parlamenta in Sveta z dne 19. oktobra
