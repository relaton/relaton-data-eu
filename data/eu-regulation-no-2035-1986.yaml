title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2035/86 of 30 June 1986 fixing for the marketing
    year 1986/87 the compensatory amounts applicable to processed tomato products
    and laying down special detailed rules for their application
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2035/86 de la Commission du 30 juin 1986 fixant, pour
    la campagne de commercialisation 1986/1987, les montants compensatoires applicables
    aux produits transformés à base de tomates, et établissant des modalités particulières
    pour leur application
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2035/86 der Kommission vom 30. Juni 1986 zur Festsetzung
    der Ausgleichsbeträge für Verarbeitungserzeugnisse aus Tomaten für das Wirtschaftsjahr
    1986/87 und zur Festlegung besonderer Bestimmungen für ihre Anwendung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2035/86 af 30. juni 1986 om fastsættelse
    af udligningsbeløbene for produkter forarbejdet på basis af tomater for produktionsåret
    1986/87 og de særlige gennemførelsesbestemmelser herfor
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2035/86 της Επιτροπής
    της 30ής Ιουνίου 1986 που καθορίζει, για την περίοδο
    εμπορίας 1986/87, τα νομισματικά εξισωτικά ποσά
    που εφαρμόζονται για τα μεταποιημένα προϊόντα
    με βάση τις τομάτες και θεσπίζει ειδικούς λεπτομερείς
    κανόνες για την εφαρμογή τους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2035/86 della Commissione del 30 giugno 1986 che fissa,
    per la campagna di commercializzazione 1986/1987, gli importi compensativi applicabili
    ai prodotti trasformati a base di pomodori e stabilisce le relative modalità
    particolari di applicazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2035/86 van de Commissie van 30 juni 1986 tot vaststelling
    voor het verkoopseizoen 1986/1987 van de compenserende bedragen voor verwerkte
    produkten op basis van tomaten en van bijzondere bepalingen voor de toepassing
    ervan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2035/86 da Comissão de 30 de Junho de 1986 que
    fixa, para a campanha de comercialização de 1986/1987, os montantes compensatórios
    aplicáveis aos produtos transformados à base de tomate e que estabelece regras
    especiais para a sua aplicação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2035/86 de la Comisión de 30 de junio de 1986 por
    el que se fijan los montantes compensatorios aplicables a los productos transformados
    a base de tomate y por el que se establecen modalidades especiales para su aplicación
    para la campaña de comercialización 1986/87
  type: main
