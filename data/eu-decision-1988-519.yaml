- language: en
  script: Latn
  content: '88/519/EEC: Commission Decision of 17 October 1988 accepting undertakings
    and terminating the investigation under Article 13 (10) of Regulation (EEC) No
    2423/88 concerning certain plain paper photocopiers assembled in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/519/CEE: Décision de la Commission du 17 octobre 1988 portant acceptation
    d''engagements et clôture de l''enquête effectuée en application de l''article
    13 paragraphe 10 du règlement (CEE) n° 2423/88 concernant certains photocopieurs
    à papier ordinaire assemblés dans la Communauté'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 17. Oktober 1988 ueber die Annahme von Verpflichtungen
    und die Einstellung der Untersuchung nach Artikel 13 Absatz 10 der Verordnung
    (EWG) Nr. 2423/88 betreffend bestimmte in der Gemeinschaft montierte Normalpapierkopierer
    (88/519/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 17. oktober 1988 om godtagelse af tilsagn og
    om afslutning af undersoegelsen i henhold til artikel 13, stk. 10, i forordning
    (EOEF) nr. 2423/88 vedroerende visse PPC-fotokopieringsmaskiner, som samles i
    Faellesskabet (88/519/EOEF)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 17ης Οκτωβρίου
