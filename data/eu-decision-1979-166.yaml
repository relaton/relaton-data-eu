title:
- language: en
  script: Latn
  content: '79/166/EEC: Commission Decision of 22 December 1978 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1976 on aids relating to the provision of socio-economic guidance for and
    the acquisition of occupational skills by persons engaged in agriculture (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/166/CEE: Décision de la Commission, du 22 décembre 1978, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume-Uni des dépenses effectuées pendant
    l''année 1976 pour les aides relatives à l''information socio-économique et
    à la qualification professionnelle des personnes travaillant dans l''agriculture
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/166/EWG: Entscheidung der Kommission vom 22. Dezember 1978 über die
    Rückvergütung der im Jahr 1976 für die sozio-ökonomische Information und die
    berufliche Qualifikation der in der Landwirtschaft tätigen Personen geleisteten
    Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das Vereinigte Königreich
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/166/EØF: Kommissionens beslutning af 22. december 1978 om refusion
    gennem EUGFL, udviklingssektionen, til Det forenede Kongerige af de udgifter,
    som er afholdt i løbet af året 1976 til støtte vedrørende social og erhvervsmæssig
    vejledning og faglige kvalifikationer hos de personer, som arbejder i landbruget
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/166/CEE: Decisione della Commissione, del 22 dicembre 1978, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno Unito delle spese
    effettuate durante il 1976 per gli aiuti concernenti l''informazione socio-economica
    e la qualificazione professionale delle persone che lavorano nell''agricoltura
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/166/EEG: Beschikking van de Commissie van 22 december 1978 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Verenigd Koninkrijk van
    de gedurende het jaar 1976 gedane uitgaven voor steun met betrekking tot de sociaal-economische
