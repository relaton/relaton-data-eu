title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1290 of 2 July 2025 laying
    down rules for the application of Regulation (EU) 2024/1157 of the European Parliament
    and of the Council as regards the requirements necessary for the interoperability
    between the central system for the electronic submission and exchange of information
    and documents related to shipments of waste and other systems or software, as
    well as other technical and organisational requirements necessary for the practical
    implementation of such electronic submission and exchange of information and documents
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1290 de la Commission du 2 juillet
    2025 portant modalités d’application du règlement (UE) 2024/1157 du Parlement
    européen et du Conseil en ce qui concerne les exigences nécessaires à l’interopérabilité
    entre le système centralisé de présentation et d’échange par voie électronique
    d’informations et de documents relatifs aux transferts de déchets et d’autres
    systèmes ou logiciels, ainsi que les autres exigences techniques et organisationnelles
    nécessaires à la mise en œuvre pratique de cette présentation et de cet échange
    par voie électronique d’informations et de documents
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1290 der Kommission vom 2. Juli 2025
    mit Durchführungsbestimmungen zur Verordnung (EU) 2024/1157 des Europäischen
    Parlaments und des Rates in Bezug auf die erforderlichen Anforderungen an die
    Interoperabilität zwischen dem zentralen System für die elektronische Übermittlung
    und den elektronischen Austausch von Informationen und Dokumenten im Zusammenhang
    mit Verbringungen von Abfällen und anderen Systemen oder anderer Software sowie
    auf sonstige technische und organisatorische Anforderungen, die für die praktische
    Umsetzung dieser elektronischen Übermittlung und dieses elektronischen Austauschs
    von Informationen und Dokumenten erforderlich sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1290 на Комисията
    от 2 юли 2025 година за определяне на правила
    за прилагането на Регламент (ЕС) 2024/1157 на Европейския
    парламент и на Съвета по отношение на изискванията,
    необходими за оперативната съвместимост между
    централната система за електронно подаване
    и обмен на информация и документи, свързани
    с превози на отпадъци, и други системи или софтуер,
    както и по отношение на други технически и
    организационни изисквания, необходими за практическото
    осъществяване на това електронно подаване
    и обмен на информация и документи
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1290 ze dne 2. července 2025,
    kterým se stanoví prováděcí pravidla k nařízení Evropského parlamentu
    a Rady (EU) 2024/1157, pokud jde o požadavky na interoperabilitu mezi centrálním
    systémem pro elektronické předkládání a výměnu informací a dokumentů
    týkajících se přepravy odpadů a jinými systémy nebo softwarem, jakož i
    další technické a organizační požadavky na praktické provádění tohoto
    elektronického předkládání a výměny informací a dokumentů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/1290 af 2. juli 2025
    om regler for anvendelsen af Europa-Parlamentets og Rådets forordning (EU) 2024/1157
    for så vidt angår de krav, der er nødvendige af hensyn til interoperabiliteten
    mellem det centrale system for elektronisk indgivelse og udveksling af oplysninger
    og dokumenter vedrørende overførsel af affald og andre systemer eller softwareapplikationer,
    samt andre tekniske og organisatoriske krav, som er nødvendige for den praktiske
    gennemførelse af en sådan elektronisk indgivelse og udveksling af oplysninger
    og dokumenter
  type: main
