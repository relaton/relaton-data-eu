    (EÚ) 2024/1157, pokiaľ ide o požiadavky potrebné na interoperabilitu medzi
    centrálnym systémom na elektronické predkladanie a výmenu informácií a dokumentov
    týkajúcich sa prepravy odpadu a inými systémami alebo softvérom, ako aj ďalšie
    technické a organizačné požiadavky potrebné na praktické vykonávanie takéhoto
    elektronického predkladania a výmeny informácií a dokumentov
  type: main
