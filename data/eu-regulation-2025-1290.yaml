    pravil za uporabo Uredbe (EU) 2024/1157 Evropskega parlamenta in Sveta glede zahtev,
    potrebnih za interoperabilnost med osrednjim sistemom za elektronsko predložitev
    in izmenjavo informacij in dokumentov v zvezi s pošiljkami odpadkov ter drugimi
    sistemi ali programsko opremo, ter glede drugih tehničnih in organizacijskih
    zahtev, potrebnih za praktično izvajanje take elektronske predložitve in izmenjave
    informacij in dokumentov
  type: main
