    de 2025, por el que se establecen disposiciones de aplicación del Reglamento
    (UE) 2024/1157 del Parlamento Europeo y del Consejo en lo que respecta a los requisitos
    necesarios para la interoperabilidad entre el sistema central para la presentación
    y el intercambio electrónicos de información y documentos relacionados con los
    traslados de residuos y otros sistemas o programas informáticos, así como otros
    requisitos técnicos y organizativos necesarios para la aplicación práctica
    de dicha presentación e intercambio electrónicos de información y documentos
  type: main
