    om tillämpningsföreskrifter för Europaparlamentets och rådets förordning
    (EU) 2024/1157 vad gäller nödvändiga krav för interoperabilitet mellan det
    centrala systemet för elektroniskt inlämnande och utbyte av information och
    dokument som rör transporter av avfall, och andra system eller annan programvara,
    samt andra tekniska och organisatoriska krav som är nödvändiga för det praktiska
    genomförandet av sådant elektroniskt inlämnande och utbyte av information och
