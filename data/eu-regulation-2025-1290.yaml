    szolgáló központi rendszer és egyéb rendszerek vagy szoftverek közötti
    átjárhatósághoz szükséges követelmények, valamint az információk és
    dokumentumok elektronikus benyújtásának és cseréjének gyakorlati végrehajtásához
    szükséges egyéb technikai és szervezeti követelmények tekintetében történő
    alkalmazására vonatkozó szabályok megállapításáról
  type: main
