title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1511/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of categories 24 and 39 (order Nos 40.0240
    and 40.0390), originating in Indonesia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1511/93 de la Commission du 18 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    24 et 39 (numéros d'ordre 40.0240 et 40.0390) originaires d'Indonésie, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1511/93 DER KOMMISSION vom 18. Juni 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorien 24 und 39 (laufende Nummern 40.0240
    und 40.0390) mit Ursprung in Indonesien, für die die in der Verordnung (EWG)
    Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1511/93 af 18. juni 1993 om genindførelse
    af opkrævning af told for varer under kategori 24 og 39 (løbenummer 40.0240
    og 40.0390), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1511/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
