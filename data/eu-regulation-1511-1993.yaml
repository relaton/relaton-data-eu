    τελωνειακών δασμών για τα προϊόντα των κατηγοριών
    24 και 39 (αύξοντες αριθμοί 40.0240 και 40.0390), καταγωγής
    Ινδονησίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
