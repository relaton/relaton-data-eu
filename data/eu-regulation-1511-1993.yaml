    39 (numeri d' ordine 40.0240 e 40.0390) originari dell' Indonesia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1511/93 VAN DE COMMISSIE van 18 juni 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de categorieën 24 en 39 (volgnummers 40.0240 en 40.0390), van oorsprong uit
    Indonesië, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3832/90 van de Raad
  type: main
- language: pt
  script: Latn
