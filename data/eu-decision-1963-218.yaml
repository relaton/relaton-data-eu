title:
- language: fr
  script: Latn
  content: Décision de la Commission modifiant l'annexe de la décision de la Commission
    en date du 15 octobre 1962 autorisant la République française à fixer les points
    de passage en frontière ou en douane ouverts aux importations de fruits et légumes
    en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '63/218/EWG: Entscheidung der Kommission zur Änderung des Anhangs der
    Entscheidung der Kommission vom 15. Oktober 1962, mit der die Französische Republik
    ermächtigt wird, die offenen Grenz- oder Zollübergangsstellen für die Einfuhr
    von Obst und Gemüse aus den Mitgliedstaaten zu bestimmen'
  type: main
- language: it
  script: Latn
  content: '63/218/CEE: Decisione della Commissione che modifica l''allegato della
    decisione della Commissione del 15 ottobre 1962 che autorizza la Repubblica francese
    a stabilire i punti di passaggio di confine o di dogana aperti alle importazioni
    di ortofrutticoli in provenienza dagli Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/218/EEG: Beschikking van de Commissie tot wijziging van de beschikking
    van de Commissie van 15 oktober 1962 houdende machtiging van de Franse Republiek
    om de punten van grensovergang of douaneposten die geopend zijn voor de invoer
    van groenten en fruit afkomstig uit de andere Lid-Staten vast te stellen'
  type: main
