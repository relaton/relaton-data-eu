title:
- language: en
  script: Latn
  content: '1999/328/EC: Commission Decision of 7 May 1999 derogating, for the 1998/1999
    marketing year, from certain provisions of Regulation (EEC) No 1201/89 as regards
    aid applications and applications for supervised storage of unginned cotton originating
    in certain Greek prefectures (notified under document number C(1999) 1179) (only
    the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/328/CE: Décision de la Commission du 7 mai 1999 dérogeant, pour
    la campagne 1998/1999, à certaines dispositions du règlement (CEE) n° 1201/89
    en ce qui concerne les demandes d''aide et les demandes de mise sous contrôle
    du coton non égrené provenant de certains nomes de la Grèce [notifiée sous
    le numéro C(1999) 1179] (Le texte en langue grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '1999/328/EG: Entscheidung der Kommission vom 7. Mai 1999 zur Abweichung
    von der Verordnung (EWG) Nr. 1201/89 hinsichtlich der Beantragung der Beihilfe
    und der Unterkontrollstellung für die aus mehreren Nomi in Griechenland stammende
    nicht entkörnte Baumwolle im Wirtschaftsjahr 1998/99 (Bekanntgegeben unter Aktenzeichen
    K(1999) 1179)'
  type: main
- language: da
  script: Latn
  content: '1999/328/EF: Kommissionens beslutning af 7. maj 1999 om undtagelse for
    produktionsåret 1998/1999 fra visse bestemmelser i forordning (EØF) nr. 1201/89
    for så vidt angår støtteansøgninger og anmodninger om undergivelse under kontrol
    af ikke-egreneret bomuld fra visse nomi i Grækenland (meddelt under nummer K(1999)
    1179)'
  type: main
- language: el
  script: Grek
