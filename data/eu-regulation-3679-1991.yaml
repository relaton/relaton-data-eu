    prodotti lattiero-caseari, il livello degli importi compensativi adesione negli
    scambi tra la Spagna e il Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3679/91 VAN DE COMMISSIE van 17 december 1991 tot
