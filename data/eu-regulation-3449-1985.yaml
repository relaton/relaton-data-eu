title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3449/85 of 6 December 1985 re-establishing
    the levying of customs duties applicable to polyethylene falling within subheading
    39.02 C I, originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3449/85 de la Commission du 6 décembre 1985 portant
    rétablissement de la perception des droits de douane applicables au polyéthylène,
    de la sous-position 39.02 C I du tarif douanier commun, originaire du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3449/85 der Kommission vom 6. Dezember 1985 zur Wiedereinführung
    der Erhebung der Zölle für Polyäthylen der Tarifstelle 39.02 C I des gemeinsamen
    Zolltarifs mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3562/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3449/85 af 6. december 1985 om genindførelse
    af opkrævning af told for polyethylen, henhørende under pos. 39.02 C I og med
    oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3449/85 της Επιτροπής
    της 6ης Δεκεμβρίου 1985 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για το πολυαιθυλένιο της
    διακρίσεως 39.02 Γ Ι του κοινού δασμολογίου, καταγωγής
    Βραζιλίας, δικαιούχου των προβλεπομένων από
    τον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3449/85 della Commissione del 6 dicembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili al polietilene, della
    sottovoce 39.02 C I della tariffa doganale comune, originario del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3449/85 van de Commissie van 6 december 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op polyethyleen
    van postonderverdeling 39.02 C I van het gemeenschappelijk douanetarief, van oorsprong
    uit Brazilië, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde
    tariefpreferenties zijn verleend
