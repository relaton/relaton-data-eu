title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1155/2005 of 18 July 2005 amending and correcting
    Regulation (EC) No 1419/2004 on the continuation of the application of the Multi-annual
    Financing Agreements and the Annual Financing Agreements concluded between the
    European Commission, representing the European Community, on the one hand and
    the Czech Republic, Estonia, Hungary, Latvia, Lithuania, Poland, Slovakia and
    Slovenia on the other, and providing for certain derogations from the Multi-annual
    Financing Agreements and from Council Regulation (EC) No 1266/1999 and Regulation
    (EC) No 2222/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1155/2005 de la Commission du 18 juillet 2005 modifiant
    et corrigeant le règlement (CE) n° 1419/2004 relatif à la continuité de l'application
    des conventions de financement pluriannuelles et des conventions de financement
    annuelles conclues entre, d'une part, la Commission européenne, agissant au nom
    de la Communauté européenne, et, d'autre part, l'Estonie, la Hongrie, la Lettonie,
    la Lituanie, la Pologne, la République tchèque, la Slovaquie et la Slovénie,
    et introduisant certaines dérogations aux conventions de financement pluriannuelles
    ainsi qu'aux règlements (CE) n° 1266/1999 du Conseil et (CE) n° 2222/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1155/2005 der Kommission vom 18. Juli 2005 zur Änderung
    und Berichtigung der Verordnung (EG) Nr. 1419/2004 über die weitere Anwendung
    der von der Europäischen Kommission für die Europäische Gemeinschaft einerseits
    und der Tschechischen Republik, Estland, Ungarn, Lettland, Litauen, Polen, der
    Slowakei und Slowenien andererseits geschlossenen mehrjährigen Finanzierungsvereinbarungen
    und jährlichen Finanzierungsvereinbarungen sowie mit Abweichungen von den mehrjährigen
    Finanzierungsvereinbarungen und den Verordnungen (EG) Nr. 1266/1999 des Rates
    und (EG) Nr. 2222/2000
  type: main
