  script: Latn
  content: Komisjoni määrus (EÜ) nr 1155/2005, 18. juuli 2005, millega muudetakse
    ja parandatakse määrust (EÜ) nr 1419/2004 Euroopa Ühendust esindava Euroopa
    Komisjoni ja Tšehhi Vabariigi, Eesti, Ungari, Läti, Leedu, Poola, Slovakkia
    ja Sloveenia vahelise lõppenud mitmeaastaste rahastamislepingute ja aastaste
    rahastamislepingute taotluse pikendamise kohta ning võttes arvesse mitmeaastastest
    rahastamislepingutest ja nõukogu määrusest (EÜ) nr 1266/1999 ja määrusest
    (EÜ) nr 2222/2000 tulenevaid teatud mööndusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1155/2005, annettu 18 päivänä heinäkuuta
    2005, Euroopan yhteisöä edustavan Euroopan komission sekä Tšekin, Viron, Unkarin,
    Latvian, Liettuan, Puolan, Slovakian ja Slovenian välisten monivuotisten ja vuotuisten
    rahoitussopimusten soveltamisen jatkamisesta sekä eräistä poikkeuksista monivuotisiin
    rahoitussopimuksiin ja neuvoston asetukseen (EY) N:o 1266/1999 ja asetukseen (EY)
    N:o 2222/2000 annetun asetuksen (EY) N:o 1419/2004 muuttamisesta ja oikaisemisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1155/2005/EK rendelete (2005. július 18.) az egyrészről
    az Európai Közösséget képviselő Európai Bizottság, másrészről a Cseh
    Köztársaság, Észtország, Magyarország, Lettország, Litvánia, Lengyelország,
    Szlovákia és Szlovénia között megkötött többéves finanszírozási megállapodások
    és éves finanszírozási megállapodások alkalmazásának érvényben tartásáról
    és a többéves finanszírozási megállapodásoktól és az 1266/1999/EK tanácsi
    rendelettől és a 2222/2000/EK rendelettől való bizonyos eltérések engedélyezéséről
    szóló 1419/2004/EK rendelet módosításáról és helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1155/2005 della Commissione, del 18 luglio 2005, che
    modifica e rettifica il regolamento (CE) n. 1419/2004 relativo al proseguimento
    dell’applicazione delle convenzioni di finanziamento pluriennali e annuali concluse
    tra la Commissione europea a nome della Comunità europea, da un lato, e la Repubblica
    ceca, l’Estonia, la Lettonia, la Lituania, l’Ungheria, la Polonia, la Slovenia
    e la Slovacchia, dall’altro, e recante deroghe alle convenzioni di finanziamento
    pluriennali e ai regolamenti (CE) n. 1266/1999 del Consiglio e (CE) n. 2222/2000
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1155/2005 (2005. gada 18. jūlijs), ar kuru groza
    un labo Komisijas Regulu (EK) Nr. 1419/2004 par to daudzgadu finansēšanas līgumu
    un gada finansēšanas līgumu piemērošanas turpināšanu, kas noslēgti starp
    Eiropas Komisiju, kura pārstāv Eiropas Kopienu, no vienas puses, un Čehiju,
    Igauniju, Latviju, Lietuvu, Poliju, Slovākiju, Slovēniju un Ungāriju, no otras
    puses, un par konkrētām atkāpēm no daudzgadu finansēšanas līgumiem un Padomes
    Regulām (EK) Nr. 1266/1999 un (EK) Nr. 2222/2000
  type: main
- language: lt
  script: Latn
  content: 2005 m. liepos 18 d. Komisijos reglamentas (EB) Nr. 1155/2005, iš dalies
    keičiantis ir pataisantis Reglamentą (EB) Nr. 1419/2004 dėl daugiamečių finansavimo
    sutarčių ir metinių finansavimo sutarčių, kurias Europos bendrijai atstovaujanti
    Europos Komisija sudarė su Čekijos Respublika, Estija, Vengrija, Latvija, Lietuva,
    Lenkija, Slovakija bei Slovėnija, tolesnio taikymo ir numatantį tam tikras nuo
    daugiamečių finansavimo sutarčių ir Tarybos reglamentų (EB) Nr. 1266/1999
    ir (EB) Nr. 2222/2000 nukrypti leidžiančias nuostatas
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1155/2005 van de Commissie van 18 juli 2005 tot wijziging
    en correctie van Verordening (EG) nr. 1419/2004 inzake de verdere toepassing van
    de meerjarenovereenkomsten voor de financiering en de jaarlijkse financieringsovereenkomsten
    die zijn gesloten tussen de Commissie, die de Europese Gemeenschap vertegenwoordigde,
    enerzijds, en Estland, Hongarije, Letland, Litouwen, Polen, Slovenië, Slowakije
    en Tsjechië, anderzijds, en houdende enige afwijkingen van de meerjarenovereenkomsten
    voor de financiering en van Verordening (EG) nr. 1266/1999 van de Raad en Verordening
    (EG) nr. 2222/2000
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1155/2005 z dnia 18 lipca 2005 r. zmieniające
    i poprawiające rozporządzenie Komisji (WE) nr 1419/2004 w sprawie kontynuacji
    stosowania Wieloletnich Umów Finansowych i Rocznych Umów Finansowych zawartych
    pomiędzy Komisją Europejską reprezentującą Wspólnotę Europejską, z jednej
    strony, a Republiką Czeską, Estonią, Litwą, Łotwą, Polską, Słowacją,
    Słowenią i Węgrami, z drugiej strony, ustanawiające określone odstępstwa
