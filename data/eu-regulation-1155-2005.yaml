    oraz rozporządzenia (WE) nr 2222/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1155/2005 da Comissão, de 18 de Julho de 2005, que
    altera e corrige o Regulamento (CE) n.° 1419/2004 relativo à manutenção da
    aplicabilidade dos acordos de financiamento plurianuais e dos acordos de financiamento
    anuais concluídos entre a Comissão Europeia, em representação da Comunidade
    Europeia, por um lado, e a República Checa, a Estónia, a Letónia, a Lituânia,
    a Hungria, a Polónia, a Eslovénia e a Eslováquia, por outro, e que estabelece
    determinadas derrogações aos acordos de financiamento plurianuais e aos Regulamentos
    (CE) n.° 1266/1999 do Conselho e (CE) n.° 2222/2000
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1155/2005 al Comisiei din 18 iulie 2005 de modificare
    și de corectare a Regulamentului (CE) nr. 1419/2004 privind continuitatea aplicării
    acordurilor de finanțare multianuale și a acordurilor de finanțare anuale încheiate
    între, pe de o parte, Comisia Europeană, acționând în numele Comunității
    Europene și, pe de altă parte, Republica Cehă, Estonia, Letonia, Lituania,
    Polonia, Slovacia, Slovenia și Ungaria și de introducere a unor derogări de
    la acordurile de finanțare multianuale și de la Regulamentul (CE) nr. 1266/1999
    al Consiliului și Regulamentul (CE) nr. 2222/2000
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1155/2005 z 18. júla 2005, ktorým sa mení,
    dopĺňa a opravuje nariadenie (ES) č. 1419/2004 o pokračovaní uplatňovania
    viacročných finančných dohôd a ročných finančných dohôd uzatvorených
    medzi Európskou komisiou zastupujúcou Európske spoločenstvo na jednej strane
    a Českou republikou, Estónskom, Maďarskom, Lotyšskom, Litvou, Poľskom, Slovenskom
    a Slovinskom na druhej strane a ktorým sa stanovujú určité výnimky z viacročných
    finančných dohôd a z nariadenia Rady (ES) č. 1266/1999 a nariadenia (ES) č.
    2222/2000
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1155/2005 z dne 18. julija 2005 o spremembi in
    popravku Uredbe (ES) št. 1419/2004 o nadaljevanju uporabe Večletnih sporazumov
    o financiranju in Letnih sporazumov o financiranju, sklenjenih med Evropsko komisijo,
    ki predstavlja Evropsko skupnost, na eni strani in Češko republiko, Estonijo,
    Madžarsko, Latvijo, Litvo, Poljsko, Slovaško in Slovenijo na drugi strani, ter
    o predvidevanju določenih odstopanj od Večletnih sporazumov o financiranju in
    od uredb Sveta (ES) št. 1266/1999 ter (ES) št. 2222/2000
  type: main
