  script: Latn
  content: Reglamento (CE) n° 1155/2005 de la Comisión, de 18 de julio de 2005,
    por el que se modifica y corrige el Reglamento (CE) n° 1419/2004 sobre la prosecución
    de la aplicación de los acuerdos de financiación plurianuales y de los acuerdos
    de financiación anuales celebrados entre la Comisión Europea, en representación
    de la Comunidad Europea, por una parte, y la República Checa, Estonia, Hungría,
    Letonia, Lituania, Polonia, Eslovaquia y Eslovenia, por otra, y por el que se
    establecen algunas excepciones a los acuerdos de financiación plurianuales y
    a los Reglamentos (CE) n° 1266/1999 del Consejo y (CE) n° 2222/2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1155/2005 av den 18 juli 2005 om ändring
    och rättelse av kommissionens förordning (EG) nr 1419/2004 om fortsatt tillämpning
    av de fleråriga finansieringsavtalen och de årliga finansieringsavtalen som
    slutits mellan Europeiska kommissionen på Europeiska gemenskapens vägnar å
    den ena sidan och Tjeckien, Estland, Ungern, Lettland, Litauen, Polen, Slovakien
