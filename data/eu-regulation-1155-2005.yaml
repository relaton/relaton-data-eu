    финансови споразумения и от Регламент (ЕО)
    № 1266/1999 на Съвета и от Регламент (ЕО) № 2222/2000
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1155/2005 ze dne 18. července 2005, kterým
    se mění a opravuje nařízení (ES) č. 1419/2004 o trvání účinnosti víceletých
    dohod o financování a jednoletých dohod o financování uzavřených mezi Evropskou
    komisí zastupující Evropské společenství na jedné straně a Českou republikou,
    Estonskem, Maďarskem, Lotyšskem, Litvou, Polskem, Slovenskem a Slovinskem na
    straně druhé a o částečném zrušení víceletých dohod o financování
    a nařízení Rady (ES) č. 1266/1999 a (ES) č. 2222/2000
  type: main
