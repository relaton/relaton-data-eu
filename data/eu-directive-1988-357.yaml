title:
- language: en
  script: Latn
  content: Second Council Directive 88/357/EEC of 22 June 1988 on the coordination
    of laws, regulations and administrative provisions relating to direct insurance
    other than life assurance and laying down provisions to facilitate the effective
    exercise of freedom to provide services and amending Directive 73/239/EEC
  type: main
- language: fr
  script: Latn
  content: Deuxième directive 88/357/CEE du Conseil du 22 juin 1988 portant coordination
    des dispositions législatives, réglementaires et administratives concernant
    l'assurance directe autre que l'assurance sur la vie, fixant les dispositions
    destinées à faciliter l'exercice effectif de la libre prestation de services
    et modifiant la directive 73/239/CEE
  type: main
- language: de
  script: Latn
  content: Zweite Richtlinie 88/357/EWG des Rates vom 22. Juni 1988 zur Koordinierung
    der Rechts- und Verwaltungsvorschriften für die Direktversicherung (mit Ausnahme
    der Lebensversicherung) und zur Erleichterung der tatsächlichen Ausübung des
    freien Dienstleistungsverkehrs sowie zur Änderung der Richtlinie 73/239/EWG
  type: main
- language: bg
  script: Cyrl
  content: Втора директива на Съвета от 22 юни 1988 година
    относно координирането на законовите, подзаконовите
    и административните разпоредби, отнасящи се
    до прякото застраховане, различно от животозастраховането,
    и за формулиране на разпоредби за улесняване
    на ефективното упражняване на свободата на
    предоставяне на услуги, и за изменение на Директива
    73/239/EИО
  type: main
- language: cs
  script: Latn
  content: Druhá Směrnice Rady ze dne 22. června 1988 o koordinaci právních a
    správních předpisů týkajících se přímého pojištění jiného než životního,
    kterou se stanoví opatření k usnadnění účinného výkonu volného pohybu
    služeb a kterou se mění směrnice 73/239/EHS
  type: main
- language: da
  script: Latn
  content: Rådets andet direktiv 88/357/EØF af 22. juni 1988 om samordning af love
    og administrative bestemmelser vedrørende direkte forsikringsvirksomhed bortset
    fra livsforsikring, om fastsættelse af bestemmelser, der kan lette den faktiske
    gennemførelse af den frie udveksling af tjenesteydelser, og om ændring af direktiv
    73/239/EØF
  type: main
- language: el
  script: Grek
  content: Δεύτερη οδηγία 88/357/ΕΟΚ του Συμβουλίου της
    22ας Ιουνίου 1988 για το συντονισμό των νομοθετικών,
    κανονιστικών και διοικητικών διατάξεων σχετικά
    με την πρωτασφάλιση, εκτός της ασφάλειας ζωής,
    και τη θέσπιση των διατάξεων που σκοπό έχουν
    να διευκολύνουν την πραγματική άσκηση της
    ελεύθερης παροχής υπηρεσιών καθώς και για
    την τροποποίηση της οδηγίας 73/239/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Teine Nõukogu Direktiiv, 22. juuni 1988, otsekindlustustegevusega, välja
    arvatud elukindlustustegevusega seotud õigusnormide kooskõlastamise kohta, millega
    nähakse ette sätted teenuste osutamise vabaduse tegeliku kasutamise hõlbustamiseks
    ja muudetakse direktiivi 73/239/EMÜ
  type: main
- language: fi
  script: Latn
  content: Toinen neuvoston direktiivi 88/357/ETY, annettu 22 päivänä heinäkuuta
    1988, muuta ensivakuutusta kuin henkivakuutusta koskevien lakien, asetusten ja
    hallinnollisten määräysten yhteensovittamisesta, säännöksistä, joilla helpotetaan
    palvelujen tarjoamisen vapauden tehokasta käyttämistä, sekä direktiivin 73/239/ETY
    muuttamisesta
  type: main
- language: hr
  script: Latn
  content: '88/357/EEZ: Druga direktiva Vijeća od 22. lipnja 1988. o usklađivanju
    zakona i drugih propisa u odnosu na izravno osiguranje osim životnog osiguranja,
    koja propisuje odredbe kako bi se olakšalo učinkovito ostvarivanje slobode pružanja
    usluga i izmjeni Direktive 73/239/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Tanács Második irányelve (1988. június 22.) az életbiztosítás
    körén kívül eső közvetlen biztosításokra vonatkozó törvényi, rendeleti
    és közigazgatási rendelkezések összehangolásáról és a szolgáltatásnyújtás
    szabadságának tényleges gyakorlását elősegítő rendelkezések megállapításáról,
    valamint a 73/239/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Seconda direttiva 88/357/CEE del Consiglio del 22 giugno 1988 recante coordinamento
    delle disposizioni legislative, regolamentari ed amministrative riguardanti l'assicurazione
    diretta diversa dell'assicurazione sulla vita, e alla fissazione delle disposizioni
    volte ad agevolare l'esercizio effettivo della libera prestazione di servizi e
    che modifica la direttiva 73/239/CEE
  type: main
- language: lv
  script: Latn
  content: Padomes Otrā Direktīva 88/357/EEK (1988. gada 22. jūnijs) par normatīvo
    un administratīvo aktu koordināciju attiecībā uz tiešo apdrošināšanu,
    kas nav dzīvības apdrošināšana, par noteikumiem pakalpojumu sniegšanas brīvības
    efektīvākai izmantošanai un par grozījumiem Direktīvā 73/239/EEK
  type: main
- language: lt
  script: Latn
  content: 1988 m. birželio 22 d. Antroji Tarybos Direktyva dėl įstatymų ir kitų
    teisės aktų, susijusių su tiesioginiu draudimu, išskyrus gyvybės draudimą,
    derinimo, apibrėžianti nuostatas, padedančias veiksmingai naudotis laisve teikti
    paslaugas, ir iš dalies keičianti Direktyvą 73/239/EEB
  type: main
- language: mt
  script: Latn
  content: It-Tieni Direttiva Tal-Kunsill tat-22 ta’ Ġunju 1988 dwar il-koordinazzjoni
    ta’ liġijiet, regolamenti u dispożizzjonijiet amministrattivi li għandhom
    x’jaqsmu ma’assigurazzjoni diretta ta’ xort oħra minn assigurazzjoni tal-ħajja
    u li jistipulaw id-dispożizzjonijiet li jiffaċilitaw l-eżerċizzju effettiv
    tal-libertà li jiġu pprovduti servizzi u li temenda d-Direttiva 73/239/KEE
  type: main
- language: nl
  script: Latn
  content: Tweede Richtlijn 88/357/EEG van de Raad van 22 juni 1988 tot coördinatie
    van de wettelijke en bestuursrechtelijke bepalingen betreffende het directe verzekeringsbedrijf,
    met uitzondering van de levensverzekeringsbranche, tot vaststelling van bepalingen
    ter bevordering van de daadwerkelijke uitoefening van het vrij verrichten van
    diensten en houdende wijziging van Richtlijn 73/239/EEG
  type: main
- language: pl
  script: Latn
  content: Druga Dyrektywa Rady z dnia 22 czerwca 1988 r. w sprawie koordynacji przepisów
    ustawowych, wykonawczych i administracyjnych odnoszących się do ubezpieczeń
    bezpośrednich innych niż ubezpieczenia na życie i ustanowienia przepisów ułatwiających
    skuteczne korzystanie ze swobody świadczenia usług oraz zmieniająca dyrektywę
    73/239/EWG
  type: main
- language: pt
  script: Latn
  content: Segunda Directiva 88/357/CEE do Conselho de 22 de Junho de 1988 relativa
    à coordenação das disposições legislativas, regulamentares e administrativas
    respeitantes ao seguro directo não vida, que fixa disposições destinadas a
    facilitar o exercício da livre prestação de serviços e que altera a Directiva
    73/329/CEE
  type: main
- language: ro
  script: Latn
  content: A doua Directivă a Consiliului din 22 iunie 1988 de coordonare a actelor
    cu putere de lege și a actelor administrative privind asigurarea generală directă,
    de stabilire a dispozițiilor destinate să faciliteze exercitarea efectivă a
    libertății de a presta servicii și de modificare a Directivei 73/239/CEE
  type: main
- language: sk
  script: Latn
  content: Druhá Smernica Rady z 22. júna 1988 o koordinácii zákonov, iných právnych
    predpisov a správnych opatrení, týkajúcich sa priameho poistenia s výnimkou
    životného poistenia, na uľahčenie účinného vykonávania slobody poskytovať
    služby a o zmene a doplnení smernice 73/239/EHS
  type: main
- language: sl
  script: Latn
  content: Druga Direktiva Sveta z dne 22. junija 1988 o usklajevanju zakonov in drugih
    predpisov o neposrednem zavarovanju razen življenjskega zavarovanja, ki opredeljuje
    določbe za učinkovito uresničevanje svobode opravljanja storitev in o spremembah
    Direktive 73/239/EGS
  type: main
- language: es
  script: Latn
  content: Segunda Directiva 88/357/CEE del Consejo de 22 de junio de 1988 sobre coordinación
    de las disposiciones legales, reglamentarias y administrativas relativas al seguro
    directo, distinto del seguro de vida, por la que se establecen las disposiciones
    destinadas a facilitar el ejercicio efectivo de la libre prestación de servicios
    y por la que se modifica la Directiva 73/239/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets andra direktiv 88/357/EEG av den 22 juni 1988 om samordning av
    lagar och andra författningar som avser annan direkt försäkring än livförsäkring,
    och med bestämmelser avsedda att göra det lättare att effektivt utöva friheten
    att tillhandahålla tjänster samt om ändring av direktiv 73/239/EEG
  type: main
