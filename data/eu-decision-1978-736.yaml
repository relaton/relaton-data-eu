type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 August 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to track suits of knitted or crocheted fabric, not elastic
    or rubberized, of wool, of cotton or of man-made textile fibres, falling within
    subheading ex 60.05 A II (NIMEXE codes 60.05-16, 17, 19) of the Common Customs
    Tariff, originating in Czechoslovakia and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/736/CEE: Décision de la Commission, du 16 août 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les survêtements de sport ("trainings")
    de bonneterie non élastique ni caoutchoutée, de laine, de coton, ou de fibres
    textiles synthétiques ou artificielles de la sous-position Ex 60.05 A II du Tarif
    douanier commun (codes Nimexe : 60.05-16; 17; 19), originaires de Tchécoslovaquie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. August 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Trainingsanzüge aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen, der Tarifstelle ex 60.05 A II des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.05-16; 17; 19) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 16. august 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage træningsdragter af trikotage, ikke elastisk eller gummeret, som henhører
    under pos. ex 60.05 A II (NIMEXE-kode 60.05-16, 17, 19) i den fælles toldtarif,
    har oprindelse i Tjekkoslovakiet og frit kan omsættes i andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 agosto 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario tute sportive a maglia non elastica né gommata, di
    lana, di cotone o di fibre tessili sintetiche o artificiali, della voce ex 60.05
    A II della tariffa doganale comune (codice Nimexe 60.05-16, 17, 19), originarie
    della Cecoslovacchia e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 augustus 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd trainingpakken van niet-elastisch of van niet-gegummeerd brei- of haakwerk,
    van wol, van katoen, of van synthetische of kunstmatige textielvezels, van post
    ex 60.05 A II van het gemeenschappelijk douanetarief (NIMEXE-code 60.05-16, 17,
    19), van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
