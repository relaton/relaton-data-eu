title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1545/2001 of 27 July 2001 fixing the maximum
    buying-in price and the quantities of beef to be bought in under the 272nd partial
    invitation to tender as a general intervention measure pursuant to Regulations
    (EEC) No 1627/89 and (EC) No 1136/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1545/2001 de la Commission du 27 juillet 2001 fixant
    le prix maximal d'achat et les quantités de viande bovine achetées à l'intervention
    pour la 272e adjudication partielle effectuée dans le cadre des mesures générales
    d'intervention conformément aux règlements (CEE) n° 1627/89 et (CE) n° 1136/2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1545/2001 der Kommission vom 27. Juli 2001 zur Festsetzung
    der Höchstpreise und -mengen für den Ankauf von Rindfleisch zur Intervention
    im Rahmen der 272. Teilausschreibung der allgemeinen Interventionsmaßnahmen gemäß
    den Verordnungen (EWG) Nr. 1627/89 und (EG) Nr. 1136/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1545/2001 af 27. juli 2001 om fastsættelse
    af maksimumsopkøbsprisen og de oksekødsmængder, der opkøbes ved intervention
    som følge af den 272. dellicitation i forbindelse med de generelle interventionsforanstaltninger,
    der foretages i henhold til forordning (EØF) nr. 1627/89 og (EF) nr. 1136/2001
  type: main
- language: el
  script: Grek
