    της 27ης Ιουλίου 2001, για καθορισμό της ανώτατης
    τιμής αγοράς και των ποσοτήτων βοείου κρέατος
    που αγοράζονται στην παρέμβαση με το 272ο μερικό
    διαγωνισμό που πραγματοποιείται στο πλαίσιο
    των γενικών μέτρων παρεμβάσεως σύμφωνα με
    τους κανονισμούς (ΕΟΚ) αριθ. 1627/89 και (ΕΚ) αριθ.
    1136/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1545/2001, annettu 27 päivänä heinäkuuta
    2001, asetuksissa (ETY) N:o 1627/89 ja (EY) N:o 1136/2001 säädettyjen yleisten
    interventiotoimenpiteiden mukaisesti toteutetussa 272. osittaisessa tarjouskilpailussa
    interventioon ostetun naudanlihan enimmäisostohinnan ja määrien vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1545/2001 della Commissione, del 27 luglio 2001, che
    fissa il prezzo massimo di acquisto e i quantitativi di carni bovine acquistati
    all'intervento per la 272a gara parziale effettuata nel quadro delle misure generali
    d'intervento conformemente al regolamento (CEE) n. 1627/89 e (CE) n. 1136/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1545/2001 van de Commissie van 27 juli 2001 tot vaststelling
    van de maximumaankoopprĳs en de bĳ interventie aan te kopen hoeveelheden rundvlees
    voor de 272e deelinschrĳving in het kader van de algemene interventiemaatregelen
    overeenkomstig de Verordeningen (EEG) nr. 1627/89 en (EG) nr. 1136/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1545/2001 da Comissão, de 27 de Julho de 2001, que
