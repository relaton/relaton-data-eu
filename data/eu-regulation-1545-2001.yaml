    em intervenção para o 272.° concurso parcial efectuado no âmbito das medidas
    gerais de intervenção, em conformidade com o Regulamento (CEE) n.° 1627/89
    e (CE) n.° 1136/2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1545/2001 de la Comisión, de 27 de julio de 2001,
