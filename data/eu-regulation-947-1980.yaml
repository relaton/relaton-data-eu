id: EURegulation9471980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 947/80 of 14 April 1980 re-establishing
    the levying of customs duties on floor cloths, dish cloths, dusters and the like,
    other than knitted or crocheted, products of category 113 (code 1130), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 947/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux torchons,
    serpillières, lavettes et chamoisettes, autres qu' en bonneterie, de la catégorie
    113 (code 1130), originaires de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 947/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für Scheuertücher, Wischtücher, Spültücher
    und Staubtücher, andere als aus Gewirken, der Warenkategorie Nr. 113 (Kennziffer
    1130), mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 2894/79 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 947/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for gulvklude, karklude, støveklude og pudseklude,
    ikke af trikotage, under varekategori nr. 113 (kode 1130), som har oprindelse
    i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 947/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai torcioni, strofinacci,
    anche scamosciati, esclusi quelli a maglia, della categoria di prodotti n. 113
    (codice 1130), originari dell' India beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 947/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dweilen,
    vaatdoeken, stofdoeken en poetsdoeken, andere dan die van brei- of haakwerk, van
    de categorie van produkten nr. 113 (codenummer 1130), van oorsprong uit India
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
