title:
- language: en
  script: Latn
  content: Commission Directive 2002/66/EC of 16 July 2002 amending the Annexes to
    Council Directives 76/895/EEC, 86/362/EEC, 86/363/EEC and 90/642/EEC as regards
    the fixing of maximum levels for pesticide residues in and on fruit and vegetables,
    cereals, foodstuffs of animal origin and certain products of plant origin, including
    fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2002/66/CE de la Commission du 16 juillet 2002 modifiant les
    annexes des directives 76/895/CEE, 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil,
    en ce qui concerne la fixation de teneurs maximales pour les résidus de pesticides,
    respectivement sur et dans les fruits et légumes, les céréales, les denrées
    alimentaires d'origine animale et certains produits d'origine végétale, y compris
    les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/66/EG der Kommission vom 16. Juli 2002 zur Änderung der
    Anhänge der Richtlinien 76/895/EWG, 86/362/EWG, 86/363/EWG und 90/642/EWG des
    Rates hinsichtlich der Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    in und auf Obst und Gemüse, Getreide, Lebensmitteln tierischen Ursprungs und
    bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/66/EО на Комисията от 16 юли 2002
    година за изменение на приложенията към Директиви
    76/895/EИО, 86/362/EИО, 86/363/EИО и 90/642/EИО на Съвета за
    определянето на максимални количества на остатъци
    от пестициди във и върху плодове и зеленчуци,
    зърнени култури, храни от животински произход
    и някои продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/66/ES ze dne 16. července 2002, kterou se mění
    přílohy směrnic Rady 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS, pokud
    jde o stanovení maximálních limitů reziduí pesticidů v ovoci a zelenině,
    v obilovinách, v potravinách živočišného původu a v některých produktech
    rostlinného původu, včetně ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2002/66/EF af 16. juli 2002 om ændring af bilagene
    til Rådets direktiv 76/895/EØF, 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester i og på frugt og grøntsager,
    korn, levnedsmidler af animalsk oprindelse og visse produkter af vegetabilsk oprindelse,
    herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
