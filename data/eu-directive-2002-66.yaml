    του Συμβουλίου όσον αφορά, αντίστοιχα, τον
    καθορισμό των ανωτάτων ορίων υπολειμμάτων
    φυτοφαρμάκων μέσα και πάνω στα οπωροκηπευτικά,
    τα δημητριακά, τα τρόφιμα ζωικής προέλευσης
