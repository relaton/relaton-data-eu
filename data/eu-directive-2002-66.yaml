    περιλαμβανομένων των οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2002/66/EÜ, 16. juuli 2002, millega muudetakse lisasid
    nõukogu direktiivides76/895/EMÜ, 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ, vastavalt
    puu- ja köögiviljas, teraviljas, loomses toidus ja teatavates taimset päritolu
    saadustes, sealhulgas puu- ja köögiviljas sisalduvate ja nende pinnal esinevate
    pestitsiidide jääkide piirnormide kehtestamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2002/66/EY, annettu 16 päivänä heinäkuuta 2002,
    hedelmien ja vihannesten torjunta-ainejäämien enimmäismäärien vahvistamisesta
    annetun neuvoston direktiivin 76/895/ETY, viljojen torjunta-ainejäämien enimmäismääristä
    annetun neuvoston direktiivin 86/362/ETY, eläinkunnasta peräisin olevissa elintarvikkeissa
    ja niiden pinnassa olevien torjunta-ainejäämien enimmäismäärien vahvistamisesta
    annetun neuvoston direktiivin 86/363/ETY sekä torjunta-ainejäämien enimmäismäärien
    vahvistamisesta tietyille kasvikunnasta peräisin oleville tuotteille, mukaan
    lukien hedelmät ja vihannekset, annetun neuvoston direktiivin 90/642/ETY liitteiden
    muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2002/66/EK irányelve (2002. július 16.) a gyümölcsökben
    és zöldségekben, a gabonafélékben, az állati eredetű élelmiszerekben,
    illetőleg az egyes növényi eredetű termékekben – többek között a gyümölcsökben
    és zöldségekben –, illetve azok felületén található peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározására tekintettel a 76/895/EGK,
    86/362/EGK, 86/363/EGK, illetőleg 90/642/EGK tanácsi irányelv mellékleteinek
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2002/66/CE della Commissione, del 16 luglio 2002, recante modifica
    degli allegati delle direttive 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE
    del Consiglio, che fissano le quantità massime di residui di antiparassitari
    rispettivamente sugli e negli ortofrutticoli, sui e nei cereali, sui e nei prodotti
    alimentari di origine animale e su e in alcuni prodotti di origine vegetale, compresi
    gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2002/66/EK (2002. gada 16. jūlijs), ar kuru groza
    pielikumus Padomes Direktīvās 76/895/EEK, 86/362/EEK, 86/363/EEK un 90/642/EEK
    attiecīgi par pesticīdu atlieku maksimālo līmeņu noteikšanu augļos un dārzeņos
    un uz tiem, labībā un uz tās, dzīvnieku izcelsmes produktos un uz tiem, kā
    arī dažos augu izcelsmes produktos, tajā skaitā augļos un dārzeņos, un
    uz tiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. liepos 16 d. Komisijos direktyva 2002/66/EB, iš dalies keičianti
    Tarybos direktyvų 76/895/EEB, 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl pesticidų
    likučių didžiausių koncentracijų atitinkamai vaisiuose ir daržovėse, grūduose,
    gyvūninės kilmės maisto produktuose ir tam tikruose augalinės kilmės produktuose
    ir ant jų, įskaitant vaisius ir daržoves, nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/66/KE tas-16 ta’ Lulju ta’ l-2002
    li temenda d-Direttivi tal-Kunsill 76/895/KEE, 86/362/KEE, 86/363/KEE u 90/642/KEE
    f'dak li jirrigwarda l-iffissar ta’ livelli massimi għar-residwi ta’ perstiċidi
    ġewwa u fuq il-frott u l-ħaxix, iċ-ċereali, l-oġġetti ta' l-ikel ta’ oriġini
    mill-annimali u ċerti prodotti li joriġinaw mill-pjanti, inklużi frott u ħxejjex
    rispettivamentTest b’relevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/66/EG van de Commissie van 16 juli 2002 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 76/895/EEG, 86/362/EEG, 86/363/EEG en 90/642/EEG
    van de Raad betreffende de vaststelling van maximumgehalten aan residuen van bestrĳdingsmiddelen
    in en op respectievelĳk groenten en fruit, granen, levensmiddelen van dierlĳke
    oorsprong en bepaalde producten van plantaardige oorsprong, met inbegrip van groenten
    en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2002/66/WE z dnia 16 lipca 2002 r. zmieniająca załączniki
    do dyrektyw Rady 76/895/EWG, 86/362/EWG, 86/363/EWG i 90/642/EWG w odniesieniu
    do ustalania najwyższych dopuszczalnych poziomów pozostałości pestycydów
    w owocach i warzywach, zbożach, środkach spożywczych pochodzenia zwierzęcego
    i niektórych produktach pochodzenia roślinnego, w tym odpowiednio owocach i
    warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/66/CE da Comissão, de 16 de Julho de 2002, que altera os
    anexos das Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE do Conselho
    no respeitante à fixação de teores máximos de resíduos de pesticidas à superfície
    e no interior das frutas e produtos hortícolas, dos cereais, dos géneros alimentícios
    de origem animal e de determinados produtos de origem vegetal, incluindo frutas
    e produtos hortícolas, respectivamente
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/66/CE a Comisiei din 16 iulie 2002 de modificare a anexelor
    la Directivele 76/895/CEE, 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului
    în ceea ce privește stabilirea conținuturilor maxime de reziduuri de pesticide
    din și de pe fructe și legume, cereale, alimente de origine animală și respectiv
    anumite produse de origine vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2002/66/ES zo 16. júla 2002, ktorou sa menia a dopĺňajú
    smernice 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálnych
    hladín rezíduí pesticídov v a na ovocí a zelenine, obilninách, potravinách
    živočíšneho pôvodu a určitých produktoch rastlinného pôvodu, vrátane
    ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/66/ES z dne 16. julija 2002 o spremembi prilog
    k direktivam Sveta 76/895/EGS, 86/362/EGS, 86/363/EGS in 90/642/EGS glede določanja
    najvišjih dovoljenih vrednosti ostankov pesticidov v in na sadju in zelenjavi,
    žitih, živilih živalskega izvora in nekaterih proizvodih rastlinskega izvora,
    vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/66/CE de la Comisión, de 16 de julio de 2002, por la que
    se modifican los anexos de las Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE y
    90/642/CEE del Consejo, en lo relativo a la fijación de los límites máximos
    de residuos de plaguicidas en frutas y hortalizas, cereales, productos alimenticios
    de origen animal y determinados productos de origen vegetal, incluidas las frutas
    y hortalizas, respectivamente
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/66/EG av den 16 juli 2002 om ändring av bilagorna
    till rådets direktiv 76/895/EEG, 86/362/EEG, 86/363/EEG och 90/642/EEG beträffande
    fastställande av gränsvärden för bekämpningsmedelsrester i och på frukt
    och grönsaker, spannmål, livsmedel av animaliskt ursprung och vissa produkter
    av vegetabiliskt ursprung inklusive frukt och grönsaker
