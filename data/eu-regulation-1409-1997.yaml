  content: COMMISSION REGULATION (EC) No 1409/97 of 22 July 1997 determining the extent
    to which the applications for import licences submitted in July 1997 for certain
    dairy products under certain tariff quotas opened by Regulation (EC) No 1600/95
    can be accepted
  type: main
- language: fr
  script: Latn
