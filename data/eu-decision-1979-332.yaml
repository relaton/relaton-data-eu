id: EUDecision1979332
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/332/EEC: Commission Decision of 14 March 1979 authorizing Ireland not
    to apply Community treatment to brassières, woven, knitted or crocheted, falling
    within heading No ex 61.09 of the Common Customs Tariff (NIMEXE code 61.09-50)
    (category 31), originating in the Philippines and in free circulation in the other
    Member Sates (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/332/CEE: Décision de la Commission, du 14 mars 1979, autorisant l''Irlande
    à exclure du traitement communautaire les soutiens-gorge et bustiers, tissés
    ou de bonneterie de la position ex 61.09 du tarif douanier commun (code Nimexe:
    61.09-50) catégorie 31, originaires des Philippines et mis en libre pratique
    dans les autres Etats membres (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/332/EWG: Entscheidung der Kommission vom 14. März 1979, mit der Irland
    ermächtigt wird, aus den Philippinen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Büstenhalter, aus Geweben oder aus Gewirken, der
    Tarifnummer ex 61.09 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffer 61.09-50) (Kategorie
    31) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/332/EØF: Kommissionens beslutning af 14. marts 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage brystholdere, vævede eller
    af trikotage, som henhører under pos. ex 61.09 i den fælles toldtarif (NIMEXE-nummer
    61.09-50; kategori 31), har oprindelse i Filippinerne og frit kan omsættes i
    de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/332/CEE: Decisione della Commissione, del 14 marzo 1979, che autorizza
    l''Irlanda ad escludere del trattamento comunitario i reggiseno e i bustini, tessuti
    o a maglia, della voce ex 61.09 della tariffa doganale comune (codice Nimexe:
    61.09-50), categoria 31, originari delle Filippine e messi in libera pratica negli
    altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/332/EEG: Beschikking van de Commissie van 14 maart 1979 waarbij Ierland
    wordt gemachtigd bustehouders, geweven, van brei- of haakwerk, van post ex 61.09
    van het gemeenschappelijk douanetarief (NIMEXE-code 61.09- 50) (categorie 31),
    van oorsprong uit de Filippijnen en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)'
  type: main
