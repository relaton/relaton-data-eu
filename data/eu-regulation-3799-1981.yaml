title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3799/81 of 15 December 1981 amending Regulation
    (EEC) No 3449/80 by way of extending the lists of products originating in Romania
    in respect of which quantitative restrictions on import into the Community have
    been eliminated
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3799/81 du Conseil, du 15 décembre 1981, modifiant
    le règlement (CEE) n° 3449/80 en vue de l' élargissement des listes des produits
    originaires de Roumanie dont les restrictions quantitatives à l' importation
    dans la Communauté sont éliminées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3799/81 des Rates vom 15. Dezember 1981 zur Änderung
    der Verordnung (EWG) Nr. 3449/80 zwecks Erweiterung der Listen der Waren mit Ursprung
    in Rumänien, für die die zweckmäßigen Beschränkungen bei der Einfuhr in die
    Gemeinschaft aufgehoben sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3799/81 af 15. december 1981 om ændring
    af forordning (EØF) nr. 3449/80 med henblik på udvidelse af listerne over produkter
    hidrørende fra Rumænien, for hvis vedkommende de kvantitative restriktioner
    er ophævet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3799/81 τού Συμβουλίου
    τής 15ης Δεκεμβρίου 1981 περί τροποποιήσεως τού
    κανονισμού (EOK) αριθ. 3449/80 λόγω τής διευρύνσεως
    τών πινάκων τών προϊόντων καταγωγής Ρουμανίας,
    γιά τά οποία καταργούνται οι ποσοτικοί περιορισμοί
    κατά τήν εισαγωγή στήν Κοινότητα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3799/81 del Consiglio, del 15 dicembre 1981, che modifica
    il regolamento (CEE) n. 3449/80 ampliando gli elenchi dei prodotti originari della
    Romania le cui restrizioni quantitative all' importazione nella Comunità sono
    eliminate
  type: main
- language: nl
  script: Latn
