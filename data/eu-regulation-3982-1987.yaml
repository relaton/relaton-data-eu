title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3982/87 of 15 December 1987 laying down for
    1988 certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of certain non-member countries in the 200-nautical-mile
    zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3982/87 du Conseil du 15 décembre 1987 fixant, pour
    l' année 1988, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon de certains pays tiers dans
    la zone de 200 milles située au large des côtes du département français de
    la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3982/87 des Rates vom 15. Dezember 1987 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1988)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3982/87 af 15. december 1987 om fastsættelse
    af en række foranstaltninger for 1988 til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3982/87 του Συμβουλίου
    της 15ης Δεκεμβρίου 1987 για τον καθορισμό, για
    το 1988, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων, τα οποία εφαρμόζονται
    στα σκάφη με σημαία ορισμένων τρίτων χωρών
    εντός της ζώνης 200 μιλίων η οποία ευρίσκεται
    στα ανοικτά των ακτών του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3982/87 del Consiglio del 15 dicembre 1987 che stabilisce,
    per il 1988, talune misure di conservazione e di gestione delle risorse da applicare
    alle navi battenti bandiera di taluni paesi terzi nella zona di 200 miglia situata
    al largo delle coste del dipartimento francese delle Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3982/87 van de Raad van 15 december 1987 houdende
    maatregelen, voor 1988, voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3982/87 do Conselho de 15 de Dezembro de 1987 que
    fixa, para 1988, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de certos países terceiros
    na zona de 200 milhas situada ao largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3982/87 del Consejo de 15 de diciembre de 1987 por
    el que se establecen, para 1988, determinadas medidas de conservación y gestión
    de los recursos pesqueros aplicables a los buques que enarbolen pabellón de determinados
    terceros países en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
