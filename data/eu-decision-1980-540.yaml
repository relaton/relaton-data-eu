    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben durch den EAGFL,
    Abteilung Ausrichtung, an das Vereinigte Königreich (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/540/EØF: Kommissionens beslutning af 19. maj 1980 om refusion gennem
