title:
- language: en
  script: Latn
  content: '80/540/EEC: Commission Decision of 19 May 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1978 on aids relating to the provision of socio-economic guidance for and
    the acquisition of occupational skills by persons engaged in agriculture (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/540/CEE: Décision de la Commission, du 19 mai 1980, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    au Royaume-Uni, des dépenses effectuées pendant l''année 1978 pour les aides
    relatives à l''information socio-économique et à la qualification professionnelle
    des personnes travaillant dans l''agriculture (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
