  script: Latn
  content: Council Decision 2026/442 of 17 February 2026 on the signing of the Agreement
    between the European Union and the Kingdom of Norway laying down the rules for
    participation of the Kingdom of Norway in the GOVSATCOM component of the Union
    Space Programme and in the Union Secure Connectivity Programme, and for access
    to GOVSATCOM services and to the governmental services of the Union Secure Connectivity
    Programme
  type: main
- language: fr
  script: Latn
