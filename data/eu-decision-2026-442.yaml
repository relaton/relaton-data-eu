    GOVSATCOM komponensében és az uniós biztonságos konnektivitási programban
    való részvételére, valamint a GOVSATCOM-szolgáltatásokhoz és az uniós
    biztonságos konnektivitási program kormányzati szolgáltatásaihoz való hozzáférésre
