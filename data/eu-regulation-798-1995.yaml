    (EEG) nr. 2255/92, (EEG) nr. 2312/92 en (EEG) nr. 1148/93 houdende uitvoeringsbepalingen
    van de specifieke regeling voor de voorziening van de Canarische eilanden, de
    Azoren, Madeira en de Franse overzeese departementen met produkten van de sector
    rundvlees, wat betreft het bedrag van de steun
  type: main
