    nº 2255/92, (CEE) nº 2312/92 e (CEE) nº 1148/93, que estabelecem as normas
    de execução do regime específico de abastecimento das ilhas Canárias, dos
    Açores, da Madeira e dos departamentos franceses ultramarinos em produtos do
    sector da carne de bovino, no que respeita ao montante das ajudas
  type: main
