    nr. 2255/92, (EØF) nr. 2312/92 og (EØF) nr. 1148/93 om gennemførelsesbestemmelser
    for den særlige ordning for forsyning af De Kanariske Øer, Azorerne, Madeira
    og de oversøiske franske departementer med oksekød, for så vidt angår støttebeløbene
  type: main
- language: el
  script: Grek
