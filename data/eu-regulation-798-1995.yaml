    2312/92 y 1148/93 por los que se establecen las disposiciones de aplicación del
    régimen de abastecimiento específico de productos del sector de la carne de
    vacuno a las islas Canarias, las Azores, Madeira y los departamentos franceses
    de Ultramar, en lo referente al importe de las ayudas
  type: main
