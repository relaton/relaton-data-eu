title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 798/95 of 7 April 1995 amending Regulations
    (EEC) No 1912/92, (EEC) No 1913/92, (EEC) No 2254/92, (EEC) No 2255/92, (EEC)
    No 2312/92 and (EEC) No 1148/93 laying down detailed implementing rules for the
    specific measures for supplying the Canary Islands, the Azores, Madeira and the
    French overseas departments with products from the beef and veal sector as regards
    the amount of the aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 798/95 de la Commission du 7 avril 1995 modifiant les
    règlements (CEE) n° 1912/92, (CEE) n 1913/92, (CEE) n° 2254/92, (CEE) n 2255/92,
    (CEE) n 2312/92 et (CEE) n° 1148/93 portant modalités d'application du régime
    spécifique pour l'approvisionnement en produits du secteur de la viande bovine,
    des îles Canaries, des Açores, de Madère et des départements français d'outre-mer
    en ce qui concerne le montant des aides
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 798/95 DER KOMMISSION vom 7. April 1995 zur Änderung
    der Verordnungen (EWG) Nr. 1912/92, (EWG) Nr. 1913/92, (EWG) Nr. 2254/92, (EWG)
    Nr. 2255/92, (EWG) Nr. 2312/92 und (EWG) Nr. 1148/93 hinsichtlich der Durchführungsbestimmungen
    für die Sondermaßnahmen zur Versorgung der Kanarischen Inseln, der Azoren, Madeiras
    und der französischen überseeischen Departements mit bestimmten landwirtschaftlichen
    Erzeugnissen und der zu gewährenden Beihilfen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 798/95 af 7. april 1995 om ændring af
