---
id: EUDecision2017252
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/252 of 9 February 2017 amending
    Annex II to Decision 93/52/EEC as regards the recognition of the Autonomous Community
    of Extremadura as officially brucellosis-free (B. Melitensis) and amending the
    Annexes to Decision 2003/467/EC as regards the declaration of certain regions
    of Spain as officially tuberculosis-free and officially brucellosis-free in relation
    to bovine herds and of Jersey as officially enzootic-bovine-leucosis-free (notified
    under document C(2017) 691)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/252 de la Commission du 9 février 2017
    modifiant l'annexe II de la décision 93/52/CEE en ce qui concerne la reconnaissance
    de la communauté autonome d'Estrémadure comme officiellement indemne de brucellose
    (Br. melitensis) et modifiant les annexes de la décision 2003/467/CE en ce qui
    concerne la déclaration de certaines régions d'Espagne comme officiellement
    indemnes de tuberculose et de brucellose pour ce qui est des troupeaux bovins,
    ainsi que de Jersey comme officiellement indemne de leucose bovine enzootique
    [notifiée sous le numéro C(2017) 691]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/252 der Kommission vom 9. Februar 2017
    zur Änderung des Anhangs II der Entscheidung 93/52/EWG hinsichtlich der Anerkennung
    der Autonomen Gemeinschaft Extremadura als amtlich frei von Brucellose (B. melitensis)
    und zur Änderung der Anhänge der Entscheidung 2003/467/EG hinsichtlich der Anerkennung
    bestimmter Regionen Spaniens als amtlich tuberkulose- und brucellosefrei in Bezug
    auf Rinderbestände und der Anerkennung Jerseys als amtlich rinderleukosefrei
    (Bekannt gegeben unter Aktenzeichen C(2017) 691)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/252 на Комисията
    от 9 февруари 2017 година за изменение на приложение
    II към Решение 93/52/ЕИО по отношение на признаването
    на автономна област Extremadura за официално свободна
    от бруцелоза (B. Melitensis) и за изменение на приложенията
    към Решение 2003/467/ЕО с оглед обявяването на
    определени региони от Испания за официално
    свободни от туберкулоза по говедата и официално
    свободни от бруцелоза по отношение на стадата
    едър рогат добитък и на остров Джърси за официално
    свободен от ензоотична левкоза по говедата
    (нотифицирано под номер С(2017) 691)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/252 ze dne 9. února 2017, kterým
    se mění příloha II rozhodnutí 93/52/EHS, pokud jde o uznání autonomní
    oblasti Extremadura za úředně prostou brucelózy (B. melitensis), a kterým
    se mění přílohy rozhodnutí 2003/467/ES, pokud jde o prohlášení určitých
    oblastí Španělska za úředně prosté tuberkulózy a za úředně prosté
    brucelózy v souvislosti se stády skotu a pokud jde o prohlášení Jersey za
    úředně prosté enzootické leukózy skotu (oznámeno pod číslem C(2017) 691)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/252 af 9. februar 2017
    om ændring af bilag II til beslutning 93/52/EØF for så vidt angår anerkendelse
    af den selvstyrende region Extremadura som officielt brucellosefri (B. Melitensis)
    og om ændring af bilagene til beslutning 2003/467/EF for så vidt angår erklæringen
    om, at visse regioner i Spanien er officielt tuberkulosefrie og officielt brucellosefrie
    med hensyn til kvægbesætninger, og at Jersey er officielt fri for enzootisk
    kvægleukose (meddelt under nummer C(2017) 691)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/252 της Επιτροπής,
    της 9ης Φεβρουαρίου 2017, για την τροποποίηση
    του παραρτήματος II της απόφασης 93/52/ΕΟΚ όσον
    αφορά την αναγνώριση της αυτόνομης κοινότητας
    της Εστρεμαδούρα ως επισήμως απαλλαγμένης
    από τη βρουκέλλωση (B. melitensis) και για την τροποποίηση
    των παραρτημάτων της απόφασης 2003/467/ΕΚ όσον
    αφορά την κήρυξη ορισμένων περιοχών της Ισπανίας
    ως επισήμως απαλλαγμένων από τη φυματίωση
    και τη βρουκέλλωση όσον αφορά τις αγέλες βοοειδών
    και του Τζέρζι ως επισήμως απαλλαγμένου από
    την ενζωοτική λεύκωση των βοοειδών [κοινοποιηθείσα
    υπό τον αριθμό C(2017) 691]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/252, 9. veebruar 2017, millega muudetakse
    otsuse 93/52/EMÜ II lisa seoses Extremadura autonoomse piirkonna ametlikult brutselloosist
    (B. melitensis) vabaks tunnistamisega ning otsuse 2003/467/EÜ lisasid seoses
    Hispaania teatavate piirkondade veisekarjade ametlikult tuberkuloosi- ja brutselloosivabaks
    tunnistamisega ning seoses Jersey ametlikult veiste ensootilisest leukoosist vabaks
    tunnistamisega (teatavaks tehtud numbri C(2017) 691 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/252, annettu 9 päivänä
    helmikuuta 2017, päätöksen 93/52/ETY liitteen II muuttamisesta siltä osin
    kuin kyse on Extremaduran itsehallintoalueen tunnustamisesta virallisesti vapaaksi
    luomistaudista (B. Melitensis) sekä päätöksen 2003/467/EY liitteiden muuttamisesta
    siltä osin kuin kyse on tiettyjen Espanjan alueiden julistamisesta virallisesti
    vapaiksi tuberkuloosista ja luomistaudista ja Jerseyn julistamisesta virallisesti
    vapaaksi naudan tarttuvasta leukoosista (tiedoksiannettu numerolla C(2017) 691)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/252 оd 9. veljače 2017. o izmjeni
    Priloga II. Odluci 93/52/EEZ u pogledu priznavanja Autonomne zajednice Extremadure
    kao službeno slobodne od bruceloze (B. Melitensis) te o izmjeni prilogâ Odluci
    2003/467/EZ u pogledu proglašavanja određenih regija Španjolske službeno slobodnima
    od tuberkuloze i bruceloze u pogledu stada goveda i proglašavanju Jerseyja slobodnim
    od enzootske leukoze goveda (priopćeno pod brojem dokumenta C(2017) 691)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/252 végrehajtási határozata (2017. február 9.)
    Extremadura autonóm közösség hivatalosan brucellózistól (B. melitensis)
    mentesnek nyilvánítása tekintetében a 93/52/EGK határozat II. mellékletének
    módosításáról, valamint Spanyolország egyes régióinak a szarvasmarha-állományok
    vonatkozásában hivatalosan tuberkolózistól mentesnek és hivatalosan brucellózistól
    mentesnek és Jersey hivatalosan enzootikus szarvasmarha-leukosistól mentesnek
    nyilvánítása tekintetében a 2003/467/EK határozat mellékleteinek módosításáról
    (az értesítés a C(2017) 691. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/252 della Commissione, del 9 febbraio
    2017, che modifica l'allegato II della decisione 93/52/CEE per quanto riguarda
    il riconoscimento della Comunità autonoma di Estremadura come ufficialmente indenne
    da brucellosi (B. Melitensis) e che modifica gli allegati della decisione 2003/467/CE
    per quanto riguarda il riconoscimento della qualifica di ufficialmente indenni
    da tubercolosi e da brucellosi di alcune regioni della Spagna per quanto riguarda
    gli allevamenti bovini e di ufficialmente indenne da leucosi bovina enzootica
    dell'Isola di Jersey [notificata con il numero C(2017) 691]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/252 (2017. gada 9. februāris),
    ar ko groza Lēmuma 93/52/EEK II pielikumu attiecībā uz Estremaduras autonomā
    apgabala atzīšanu par oficiāli brīvu no brucelozes (B. melitensis) un Lēmuma
    2003/467/EK pielikumus attiecībā uz dažu Spānijas reģionu atzīšanu par
    oficiāli brīviem no tuberkulozes un no brucelozes un Džērsijas atzīšanu
    par oficiāli brīvu no govju enzootiskās leikozes (izziņots ar dokumenta numuru
    C(2017) 691)
  type: main
- language: lt
  script: Latn
  content: 2017 m. vasario 9 d. Komisijos įgyvendinimo sprendimas (ES) 2017/252,
    kuriuo dėl pripažinimo, kad Estremadūros autonominėje srityje oficialiai nenustatyta
    bruceliozės (B. Melitensis), iš dalies keičiamas Sprendimo 93/52/EEB II priedas
    ir kuriuo dėl paskelbimo, kad tam tikruose Ispanijos regionuose oficialiai nenustatyta
    tuberkuliozės bei bruceliozės galvijų bandose ir Džersyje oficialiai nenustatyta
    enzootinės galvijų leukozės, iš dalies keičiami Sprendimo 2003/467/EB priedai
    (pranešta dokumentu Nr. C(2017) 691)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/252 tad-9 ta'
    Frar 2017 li temenda l-Anness II tad-Deċiżjoni 93/52/KEE fir-rigward tar-rikonoxximent
    tal-Komunità Awtonoma ta' Extremadura bħala uffiċjalment ħielsa mill-bruċellożi
    (B. melitensis) u li temenda l-Annessi tad-Deċiżjoni 2003/467/KE fir-rigward
    tal-kwalifika ta' uffiċjalment ħielsa mit-tuberkulożi u mill-bruċellożi ta'
    ċerti reġjuni fi Spanja fir-rigward tal-merħliet bovini u tal-kwalifika ta'
    uffiċjalment ħielsa mil-lewkożi enzootika bovina ta' Jersey (notifikata bid-dokument
    C(2017) 691)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/252 van de Commissie van 9 februari 2017 tot
    wijziging van bijlage II bij Beschikking 93/52/EEG wat betreft de erkenning dat
    de autonome gemeenschap Extremadura officieel vrij is van brucellose (B. melitensis)
    en tot wijziging van de bijlagen bij Beschikking 2003/467/EG wat betreft de verklaring
    dat bepaalde delen van Spanje officieel vrij zijn van tuberculose en brucellose
    ten aanzien van de rundveebeslagen en dat Jersey officieel vrij is van enzoötische
    boviene leukose (Kennisgeving geschied onder nummer C(2017) 691)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/252 z dnia 9 lutego 2017 r. zmieniająca
    załącznik II do decyzji 93/52/EWG w odniesieniu do uznania Wspólnoty Autonomicznej
    Estremadury za oficjalnie wolną od brucelozy (B. Melitensis) i zmieniająca załączniki
    do decyzji 2003/467/WE w odniesieniu do uznania niektórych regionów Hiszpanii
    za oficjalnie wolne od gruźlicy i oficjalnie wolne od brucelozy w odniesieniu
    do stad bydła oraz uznania Jersey za region oficjalnie wolny od enzootycznej
    białaczki bydła (notyfikowana jako dokument nr C(2017) 691)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/252 da Comissão, de 9 de fevereiro de
    2017, que altera o anexo II da Decisão 93/52/CEE no que diz respeito ao reconhecimento
    da Comunidade Autónoma da Estremadura como oficialmente indemne de brucelose
    (B. melitensis) e que altera os anexos da Decisão 2003/467/CE no que diz respeito
    à declaração de certas regiões de Espanha como oficialmente indemnes de tuberculose
    e de brucelose, no respeitante aos efetivos de bovinos, e de Jersey como oficialmente
    indemne de leucose bovina enzoótica [notificada com o número C(2017) 691]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/252 a Comisiei din 9 februarie
    2017 de modificare a anexei II la Decizia 93/52/CEE cu privire la recunoașterea
    comunității autonome Extremadura ca oficial indemnă de bruceloză (B. melitensis)
    și de modificare a anexelor la Decizia 2003/467/CE cu privire la declararea anumitor
    regiuni din Spania ca oficial indemne de tuberculoză și de bruceloză în ceea
    ce privește efectivele de bovine și a insulei Jersey ca oficial indemnă de
    leucoză enzootică bovină [notificată cu numărul C(2017) 691]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/252 z 9. februára 2017, ktorým
    sa mení príloha II k rozhodnutiu 93/52/EHS, pokiaľ ide o uznanie autonómnej
    oblasti Estremadura ako oblasti úradne bez výskytu brucelózy (B. Melitensis),
    a ktorým sa menia prílohy k rozhodnutiu 2003/467/ES, pokiaľ ide o vyhlásenie
    určitých regiónov Španielska za regióny úradne bez výskytu tuberkulózy
    a brucelózy, pokiaľ ide o stáda hovädzieho dobytka, a uznanie Jersey za región
    úradne bez výskytu enzootickej bovinnej leukózy [oznámené pod číslom C(2017)
    691]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/252 z dne 9. februarja 2017 o spremembi
    Priloge II k Odločbi 93/52/EGS glede priznanja avtonomne skupnosti Extremadura
    kot uradno proste bruceloze (B. melitensis) ter spremembi prilog k Odločbi 2003/467/ES
    glede priznanja nekaterih regij Španije kot uradno prostih tuberkuloze in uradno
    prostih bruceloze glede čred goveda ter Jerseyja kot uradno prostega enzootske
    goveje levkoze (notificirano pod dokumentarno številko C(2017) 691)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/252 de la Comisión, de 9 de febrero
    de 2017, por la que se modifica el anexo II de la Decisión 93/52/CEE en lo que
    respecta al reconocimiento de la Comunidad Autónoma de Extremadura como oficialmente
    indemne de brucelosis (Brucella melitensis) y por la que se modifican los anexos
    de la Decisión 2003/467/CE en lo relativo a la declaración de determinadas regiones
    de España como oficialmente indemnes de tuberculosis y de brucelosis en relación
    con la ganadería bovina y de Jersey como oficialmente indemne de la leucosis
    bovina enzoótica [notificada con el número C(2017) 691]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/252 av den 9 februari 2017
    om ändring av bilaga II till beslut 93/52/EEG vad gäller erkännandet av att
    den autonoma regionen Extremadura är officiellt fri från brucellos (B. Melitensis)
    och om ändring av bilagorna till beslut 2003/467/EG vad gäller fastställandet
    av att vissa regioner i Spanien är officiellt fria från tuberkulos och brucellos
    när det gäller nötkreatursbesättningar och att vissa regioner i Jersey är
    officiellt fria från enzootisk bovin leukos [delgivet med nr C(2017) 691]
