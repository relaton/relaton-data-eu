  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/168 della Commissione, del 5 febbraio
    2016, che modifica gli allegati della decisione 2003/467/CE che stabilisce la
    qualifica di ufficialmente indenni da tubercolosi, brucellosi e leucosi bovina
    enzootica di alcuni Stati membri e regioni di Stati membri per quanto riguarda
    gli allevamenti bovini [notificata con il numero C(2016) 602]
  type: main
- language: lv
  script: Latn
