  script: Latn
  content: Commission Implementing Decision (EU) 2016/168 of 5 February 2016 amending
    the Annexes to Decision 2003/467/EC establishing the official tuberculosis, brucellosis
    and enzootic-bovine-leukosis-free status of certain Member States and regions
    of Member States as regards bovine herds (notified under document C(2016) 602)
  type: main
- language: fr
  script: Latn
