  script: Latn
  content: '79/210/EEC: Commission Decision of 2 February 1979 denying the appellation
    of ''scientific character'' to an apparatus described as ''Revco freezer, type
    ULT 1785'', including a thermometer, a liquid nitrogen expansion valve and various
    attachments'
  type: main
- language: fr
  script: Latn
  content: '79/210/CEE: Décision de la Commission, du 2 février 1979, déniant le
