    hinsichtlich der Ausnahme für eine Verwendung von Blei als Verunreinigung in
    RIG-Faraday-Rotatoren, die in faseroptischen Kommunikationssystemen verwendet
    werden, zwecks Anpassung an den technischen Fortschritt (Bekannt gegeben unter
    Aktenzeichen K(2009) 4165)'
  type: main
