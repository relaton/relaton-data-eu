title:
- language: en
  script: Latn
  content: '2009/428/EC: Commission Decision of 4 June 2009 amending, for the purposes
    of adapting to technical progress, the Annex to Directive 2002/95/EC of the European
    Parliament and of the Council as regards the exemption for an application of lead
    as impurity in RIG Faraday rotators used for fibre optic communication systems
    (notified under document number C(2009) 4165)'
  type: main
- language: fr
  script: Latn
  content: '2009/428/CE: Décision de la Commission du 4 juin 2009 modifiant, aux
    fins de son adaptation au progrès technique, l’annexe de la directive 2002/95/CE
    du Parlement européen et du Conseil en ce qui concerne l’exemption relative
    à une utilisation du plomb en tant qu’impureté dans les rotateurs de Faraday
    utilisant des grenats de terre rare fer-(RIG), employés pour les systèmes de
    communication par fibre optique [notifiée sous le numéro C(2009) 4165]'
  type: main
- language: de
  script: Latn
  content: '2009/428/EG: Entscheidung der Kommission vom 4. Juni 2009 zur Änderung
