  content: '81/157/EEC: Commission Decision of 19 February 1981 authorizing the French
    Republic not to apply Community treatment to cotton yarn, not put up for retail
    sale, originating in Pakistan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/157/CEE: Décision de la Commission, du 19 février 1981, autorisant
    la République française à exclure du traitement communautaire les fils de coton
    non conditionnés pour la vente au détail originaires du Pakistan (Le texte en
    langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
