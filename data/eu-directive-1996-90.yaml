  script: Latn
  content: Dyrektywa Rady 96/90/WE z dnia 17 grudnia 1996 r. zmieniająca dyrektywę
    92/118/EWG ustanawiającą warunki zdrowotne zwierząt i zdrowia publicznego regulujące
    handel i przywóz do Wspólnoty produktów nieobjętych wyżej wymienionymi warunkami
    ustanowionymi w szczególnych zasadach wspólnotowych określonych w załączniku
    A pkt I do dyrektywy 89/662/EWG oraz w zakresie czynników chorobotwórczych do
    dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 96/90/CE do Conselho de 17 de Dezembro de 1996 que altera a Directiva
    92/118/CEE, que define as condições sanitárias e de polícia sanitária que
    regem o comércio e as importações na Comunidade de produtos não sujeitos,
    no que respeita às referidas condições, às regulamentações comunitárias
    específicas referidas no capítulo I do anexo A da Directiva 89/662/CEE e, no
    que respeita aos agentes patogénicos, da Directiva 90/425/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva 96/90/CE a Consiliului din 17 decembrie 1996 de modificare a
    Directivei 92/118/CEE de stabilire a condițiilor de sănătate publică și animală
    care reglementează schimburile și importurile în Comunitate de produse care
    nu intră sub incidența condițiilor menționate, stabilite de normele comunitare
    speciale prevăzute de anexa A punctul la Directiva 89/662/CEE și, în ceea ce
    privește agenții patogeni, în Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 96/90/ES zo 17. decembra 1996, ktorou sa mení a dopĺňa
    smernica 92/118/EHS, ktorou sa stanovujú veterinárne a zdravotné požiadavky
    na obchodovanie s výrobkami, na ktoré sa nevzťahujú takéto požiadavky, ustanovené
    v osobitných pravidlách spoločenstva uvedených v prílohe A kapitola I smernice
    89/662/EHS a, pokiaľ ide o patogény, smernice 90/425/EHS, a na ich dovoz do
    spoločenstva
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/90/ES z dne 17. decembra 1996 o spremembah Direktive
    92/118/EGS o zahtevah zdravstvenega varstva živali in javnozdravstvenega varstva,
    ki urejajo trgovino in uvoz v Skupnost za proizvode, ki niso predmet navedenih
    zahtev, določenih v posebnih pravilih Skupnosti iz Priloge A(I) Direktive 89/662/EGS,
    glede povzročiteljev bolezni pa v Direktivi 90/425/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 96/90/CE del Consejo de 17 de diciembre de 1996 que modifica
    la Directiva 92/118/CEE por la que se establecen las condiciones de policía sanitaria
    y sanitarias aplicables a los intercambios y a las importaciones en la Comunidad
    de productos no sometidos, con respecto a estas condiciones, a las normativas
    comunitarias específicas a que se refiere el capítulo I del Anexo A de la Directiva
    89/662/CEE y, por lo que se refiere a los patógenos, de la Directiva 90/425/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/90/EG av den 17 december 1996 om ändring av direktiv
    92/118/EEG om djurhälso- och hygienkrav för handel inom gemenskapen med produkter,
    som inte omfattas av sådana krav i de särskilda gemenskapsbestämmelser som
    avses i bilaga A.I till direktiv 89/662/EEG och, i fråga om patogener, i direktiv
    90/425/EEG, samt för import till gemenskapen av sådana produkter
