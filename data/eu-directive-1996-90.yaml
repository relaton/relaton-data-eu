    direktiivin 92/118/ETY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 96/90/EZ od 17. prosinca 1996. o izmjeni Direktive Vijeća
    92/118/EEZ o utvrđivanju zahtjeva za zdravlje životinja i zahtjeva za javno
    zdravlje kojima se uređuje trgovina i uvoz u Zajednicu proizvoda koji ne podliježu
    navedenim zahtjevima utvrđenima u posebnim pravilima Zajednice iz Priloga A dijela
    I. Direktive 89/662/EEZ te, s obzirom na patogene tvari, iz Direktive 90/425/EEZ
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/90/EK irányelve (1996. december 17.) a 89/662/EGK irányelv,
    illetve a kórokozók tekintetében a 90/425/EGK irányelv A. mellékletének
    I. pontjában felsorolt külön közösségi szabályokban megállapított állat-egészségügyi
    és közegészségügyi követelmények hatálya alá nem tartozó termékek Közösségen
    belüli kereskedelmére és a Közösségbe történő behozatalára irányadó
    állat-egészségügyi és közegészségügyi követelmények megállapításáról
    szóló, 92/118/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 96/90/CE del Consiglio del 17 dicembre 1996 che modifica la direttiva
    92/118/CEE che stabilisce le condizioni sanitarie e di polizia sanitaria per gli
    scambi e le importazioni nella Comunità di prodotti non soggetti, per quanto
    riguarda tali condizioni, alle normative comunitarie specifiche di cui all'allegato
    A, capitolo I della direttiva 89/662/CEE e, per quanto riguarda i patogeni, alla
    direttiva 90/425/CEE
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/90/EK (1996. gada 17. decembris), ar ko groza Direktīvu
    92/118/EEK, ar kuru nosaka dzīvnieku veselības un sabiedrības veselības aizsardzības
    prasības, kas reglamentē to produktu tirdzniecību un importu Kopienā, kuri
    nav pakļauti minētajām prasībām, kas noteiktas īpašos Kopienas noteikumos,
    kuri minēti Direktīvas 89/662/EEK A pielikuma I daļā un attiecībā uz patogēniem
    – Direktīvā 90/425/EEK
  type: main
- language: lt
  script: Latn
  content: 1996 m. gruodžio 17 d. Tarybos direktyva 96/90/EB, iš dalies keičianti
