    за определяне на ветеринарно-санитарните и
    здравните изисквания относно търговията и
    вноса в Общността на продукти, които не са подчинени,
    по отношение на посочените изисквания, на специалните
    правила на Общността, посочени в глава I от
    приложение А към Директива 89/662/ЕИО и, по отношение
    на патогените, на Директива 90/425/ЕИО
  type: main
- language: cs
  script: Latn
