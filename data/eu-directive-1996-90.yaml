title:
- language: en
  script: Latn
  content: Council Directive 96/90/EC of 17 December 1996 amending Directive 92/118/EEC
    laying down animal health and public health requirements governing trade in and
    imports into the Community of products not subject to the said requirements laid
    down in specific Community rules referred to in Annex A (I) to Directive 89/662/EEC
    and, as regards pathogens, to Directive 90/425/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 96/90/CE du Conseil du 17 décembre 1996 modifiant la directive
    92/118/CEE définissant les conditions de police sanitaire ainsi que les conditions
    sanitaires régissant les échanges et les importations dans la Communauté de
    produits non soumis, en ce qui concerne lesdites conditions, aux réglementations
    communautaires spécifiques visées à l'annexe A chapitre I de la directive 89/662/CEE
    et, en ce qui concerne les pathogènes, de la directive 90/425/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/90/EG des Rates vom 17. Dezember 1996 zur Änderung der Richtlinie
    92/118/EWG über die tierseuchenrechtlichen und gesundheitlichen Bedingungen für
    den Handel mit Erzeugnissen tierischen Ursprungs in der Gemeinschaft sowie für
    ihre Einfuhr in die Gemeinschaft, soweit sie diesbezüglich nicht den spezifischen
    Gemeinschaftsregelungen nach Anhang A Kapitel I der Richtlinie 89/662/EWG und
    - in bezug auf Krankheitserreger - der Richtlinie 90/425/EWG unterliegen
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/90/ЕО на Съвета от 17 декември
