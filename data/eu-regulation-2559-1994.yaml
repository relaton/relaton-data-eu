title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2559/94 of 20 October 1994 re-establishing
    the levying of customs duties on certain industrial products originating in Indonesia
    and Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2559/94 de la Commission du 20 octobre 1994 portant
    rétablissement de la perception des droits de douane applicables à certains
    produits industriels originaires d'Indonésie et de Malaysia, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2559/94 DER KOMMISSION vom 20. Oktober 1994 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte gewerbliche Waren mit Ursprung in Indonesien
    und Malaysia, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2559/94 af 20. oktober 1994 om genindførelse
