title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 836/76 of 6 April 1976 derogating from Regulation
    (EEC) No 2750/75 in respect of mobilization procedures for cereals and rice to
    be supplied to the Office of the United Nations High Commissioner for Refugees
    as food aid for the sections of the population affected by the events in Cyprus
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 336/76 du Conseil du 6 avril 1976 portant dérogation
    au règlement (CEE) n° 2750/75 en ce qui concerne la procédure de mobilisation
    des céréales et du riz destinés au Haut-Commissariat des Nations unies pour
    les réfugiés, à titre d'aide alimentaire en faveur des populations affectées
    par les événements de Chypre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 836/76 des Rates vom 6. April 1976 zur Abweichung
    vor der Verordnung (EWG) Nr. 2750/75 hinsichtlich des Verfahrens zur Bereitstellung
    von Getreide und Reis an das Amt des Hohen Flüchtlingskommmissars der Vereinten
    Nationen als Nahrungsmittelhilfe für die von den Ereignissen in Zypern betroffenen
    Bevölkerungsteile
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 836/76 af 6. april 1976 om afvigelse fra
    forordning (EØF) nr. 2750/75, for så vidt angår fremgangsmåden for tilvejebringelse
    af korn og ris til De forenede Nationers Højkommissariat for Flygtninge, som
    fødevarehjælp til fordel for de befolkningsgrupper, der er berørt af begivenhederne
    på Cypern
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 336/76 του Συμβουλίου
    της 6ης Απριλίου 1976 περί παρεκκλίσεως από τον
    κανονισμό (ΕΟΚ) αριθ. 2750/75 όσον αφορά τη διαδικασία
    συγκεντρώσεως δημητριακών και ορύζης στην
    Ύπατη Αρμοστεία των Ηνωμένων Εθνών για τους
    πρόσφυγες, ως επισιτιστική βοήθεια υπέρ των
    πληθυσμών που επλήγησαν από τα γεγονότα της
    Κύπρου
  type: main
