title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1911/80 of 16 July 1980 re-establishing
    the levying of customs duties on potassium hydroxide (caustic potash) in aqueous
    solution, falling within subheading 28.17 ex B and originating in Romania, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1911/80 de la Commission, du 16 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables à l' hydroxyde
    de potassium (potasse caustique) en solution aquese, de la sous-position 28.17
    ex B du tarif douanier commun, originaire de Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1911/80 der Kommission vom 16. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Kaliumhydroxid (Ätzkali), in wäßriger Lösung, der Tarifstelle
    28.17 ex B, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1911/80 af 16. juli 1980 om genindførelse
    af opkrævning af toldafgifter for kaliumhydroxid (kaustisk kali), i vandig opløsning,
    under position 28.17 ex B, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1911/80 della Commissione, del 16 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' idrossido di potassio
    (potassa caustica) in soluzione acquosa della sottovoce 28.17 ex B della tariffa
    doganale comune, originario della Romania, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1911/80 van de Commissie van 16 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kaliumhydroxyde
    (bijtende potas), in waterige oplossing, van post 28.17 ex B, van oorsprong uit
    Roemenië ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
