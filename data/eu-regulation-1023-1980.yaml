title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1023/80 of 25 April 1980 on the sale at
    a price fixed in advance of boned beef and veal held by the Irish intervention
    agency and intended for export, and amending Regulation (EEC) No 1687/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1023/80 de la Commission, du 25 avril 1980, relatif
    à la vente à prix fixé forfaitairement à l' avance de certaines viandes bovines
    désossées détenues par l' organisme d' intervention irlandais et destinées
    à être exportées, modifiant le règlement (CEE) n° 1687/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1023/80 der Kommission vom 25. April 1980 über den
    Verkauf von zur Ausfuhr bestimmten entbeintem Rindfleisch aus Beständen der irischen
    Interventionsstelle zu pauschal im voraus festgesetzten Preisen und zur Änderung
    der Verordnung (EWG) Nr. 1687/76
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1023/80 af 25. april 1980 om salg til
    forudfastsat pris med henblik på udførsel af visse former for udbenet oksekød
    fra det irske interventionsorgan, om ændring af forordning (EØF) nr. 1687/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1023/80 della Commissione, del 25 aprile 1980, relativo
    alla vendita, a prezzo fissato forfettariamente in anticipo, di talune carni bovine
    disossate detenute dall' organismo d' intervento irlandese e destinate ad essere
    esportate, recante modifica del regolamento (CEE) n. 1687/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1023/80 van de Commissie van 25 april 1980 betreffende
    de verkoop, tegen vooraf vastgestelde prijs, van bepaald voor uitvoer bestemd
    en door het Ierse interventiebureau opgeslagen rundvlees zonder been en houdende
    wijziging van Verordening (EEG) nr. 1687/76
  type: main
