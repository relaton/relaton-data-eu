  content: Commission Regulation (EEC) No 926/87 of 30 March 1987 re-establishing
    the levying of the customs duties applicable to halogenated, sulphonated, nitrated
    and nitrosated derivates of toluidines falling under subheading 29.22 D ex III
    of the Common Customs Tariff originating in South Korea benefiting from the tariff
    preferences provided for by Council Regulation (EEC) No 3924/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 926/87 de la Commission du 30 mars 1987 portant rétablissement
