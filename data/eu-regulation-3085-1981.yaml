title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3085/81 of 27 October 1981 fixing for the 1981/82
    marketing year the representative market price and the threshold price for olive
    oil and the percentages of the consumption aid to be retained in accordance with
    Article 11 (5) and (6) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3085/81 du Conseil, du 27 octobre 1981, fixant, pour
    la campagne de commercialisation 1981/1982, le prix représentatif de marché
    et le prix de seuil de l' huile d' olive, ainsi que les pourcentages du montant
    de l' aide à la consommation à retenir conformément à l' article 11 paragraphes
    5 et 6 du règlement n° 136/66/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3085/81 des Rates vom 27. Oktober 1981 zur Festsetzung
    des repräsentativen Marktpreises und des Schwellenpreises für Olivenöl sowie
    der gemäß Artikel 11 Absätze 5 und 6 der Verordnung Nr. 136/66/EWG vom Betrag
    der Verbrauchsbeihilfe einzubehaltenden Prozentsätze für das Wirtschaftsjahr
    1981/82
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3085/81 af 27. oktober 1981 om fastsættelse
    for produktionsåret 1981/82 af den repræsentative markedspris og tærskelprisen
    for olivenolie, samt af de procentdele af forbrugerstøtten, der skal tilbageholdes
    i henhold til artikel 11, stk. 5 og 6, i forordning nr. 136/66/EØF
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3085/81 τού Συμβουλίου
    τής 27ης Οκτωβρίου 1981 περί καθορισμού τής αντιπροσωπευτικής
    τιμής αγοράς καί τής τιμής κατωφλίου τού ελαιολάδου
    γιά τήν περίοδο εμπορίας 1981/82 καθώς καί τών
    ποσοστών τού ποσού τής ενισχύσεως στήν κατανάλωση
    πού πρέπει νά λαμβάνονται υπόψη σύμφωνα μέ
    τό άρθρο 11 παράγραφοι 5 καί 6 τού κανονισμού
    αριθ. 136/66/EOK
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3085/81 del Consiglio, del 27 ottobre 1981, che fissa,
    per la campagna di commercializzazione 1981/1982, il prezzo rappresentativo di
    mercato e il prezzo d' entrata dell' olio d' oliva, nonché le percentuali dell'
    importo dell' aiuto al consumo da adottare in conformità dell' articolo 11, paragrafi
    5 e 6, del regolamento n. 136/66/CEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3085/81 van de Raad van 27 oktober 1981 houdende
    vaststelling voor het verkoopseizoen 1981/1982 van de representatieve marktprijs
    en de drempelprijs voor olijfolie en van de overeenkomstig artikel 11, lid 5 en
    lid 6, van Verordening nr. 136/66/EEG in te houden percentages van het bedrag
    van de consumptiesteun
