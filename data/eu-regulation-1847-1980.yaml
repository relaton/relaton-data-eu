title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1847/80 of 11 July 1980 re-establishing
    the levying of customs duties on wood (including blocks, strips and friezes for
    parquet or wood block flooring, not assembled), planed, tongued, grooved, rebated,
    chamfered, V-jointed, centre V-jointed, beaded, centre-beaded or the like, but
    not further manufactured, falling within heading No 44.13 and originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1847/80 de la Commission, du 11 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux bois (y
    compris les lames ou frises pour parquets, non assemblées) rabotés, rainés,
    bouvetés, languetés, feuillurés, chanfreinés ou similaires, de la position
    44.13 du tarif douanier commun, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1847/80 der Kommission vom 11. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Holz (einschließlich Stäbe oder Friese für Parkett, nicht
    zusammengesetzt), gehobelt, genutet, gefedert, gekehlt, gefalzt, abgeschrägt
    oder in ähnlicher Weise bearbeitet, der Tarifnummer 44.13, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1847/80 af 11. juli 1980 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, affaset eller
    på lignende måde bearbejdet (herunder ikke-sammensatte parketstaver), under
    pos. 44.13 som har oprindelse i udvik1818lingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forord1829ning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1847/80 della Commissione, dell' 11 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, con incastri semplici, con limbelli, con smussature
    o similmente lavorato, comprese le liste e le tavolette (parchetti) per pavimenti,
    non riunite, della voce 44.13 della tariffa doganale comune, originario dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolament0
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1847/80 van de Commissie van 11 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor hout (niet-ineengezette
    plankjes voor parketvloeren daaronder begrepen), geschaafd, geploegd of van sponningen
    voorzien, afgeschuind of op dergelijke wijze bewerkt, van post 44.13, van oorsprong
    uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad tariefpreferenties werden geopend
  type: main
