title:
- language: en
  script: Latn
  content: '80/167/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to certain setts, flags and paving,
    hearth and wall tiles, falling within subheadings 69.07 ex A and B ex II and 69.08
    ex A and B ex II of the Common Customs Tariff, originating in South Korea, Japan
    and Thailand and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/167/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    la République française à exclure du traitement communautaire certains carreaux,
    pavés, dalles de pavement ou de revêtement, des sous-positions 69.07 ex A et
    B ex II et 69.08 ex A et B ex II, originaires de la Corée du Sud, du Japon et
    de la Thaïlande et mis en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/167/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Südkorea, Japan und Thailand stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Fliesen, gebrannte
    Pflastersteine, Boden- und Wandplatten der Tarifstellen 69.07 ex A und B ex II
    und 69.08 ex A und B ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/167/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage uglaserede og
    glaserede sten og fliser til brolægning, gulvbelægning eller beklædning af
    vægge, kaminer og lignende, som henhører under pos. 69.07 ex A og B ex II og
    69.08 ex A og B ex II i den fælles toldtarif, har oprindelse i Sydkorea, Japan
    og Thailand og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/167/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario piastrelle, blocchetti
    e lastre da pavimentazione o da rivestimento, delle sottovoci 69.07 ex A e B ex
    II e 69.08 ex A e B ex II della tariffa doganale comune, originari della Corea
    del Sud, del Giappone e della Tailandia e messi in libera pratica negli altri
    Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/167/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd plavuizen, vloer- en wandtegels van de posten
    69.07 ex A en B ex II; 69.08 ex A en B ex II van het gemeenschappelijk douanetarief,
    van oorsprong uit Zuid- Korea, Japan en Thailand en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
