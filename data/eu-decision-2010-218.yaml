    tifqigħa tal-influwenza tat-tjur b’patoġeniċità għolja ħafna tas-subtip
    H5N1 fit-tjur tal-irziezet fir-Rumanija (notifikata bid-dokument numru C(2010)
    2348)'
  type: main
- language: nl
  script: Latn
  content: '2010/218/: Besluit van de Commissie van 16 april 2010 tot wijziging van
    Beschikking 2006/415/EG wat betreft bepaalde beschermende maatregelen in verband
    met een uitbraak van hoogpathogene aviaire influenza van het subtype H5N1 bij
    pluimvee in Roemenië (Kennisgeving geschied onder nummer C(2010) 2348)'
  type: main
- language: pl
  script: Latn
  content: '2010/218/: Decyzja Komisji z dnia 16 kwietnia 2010 r. zmieniająca decyzję
    2006/415/WE w odniesieniu do niektórych środków ochronnych w związku z wystąpieniem
    ogniska wysoce zjadliwej grypy ptaków podtypu H5N1 u drobiu w Rumunii (notyfikowana
    jako dokument nr C(2010) 2348)'
  type: main
- language: pt
  script: Latn
  content: '2010/218/: Decisão da Comissão, de 16 de Abril de 2010 , que altera
    a Decisão 2006/415/CE no que se refere a determinadas medidas de protecção
    respeitantes a um surto de gripe aviária de alta patogenicidade do subtipo H5N1
    em aves de capoeira na Roménia [notificada com o número C(2010) 2348]'
  type: main
- language: ro
  script: Latn
  content: '2010/218/: Decizia Comisiei din 16 aprilie 2010 de modificare a Deciziei
    2006/415/CE privind anumite măsuri de protecție referitoare la apariția unui
    focar de gripă aviară cu virus de subtip H5N1 înalt patogen la păsările domestice
    din România [notificată cu numărul C(2010) 2348]'
  type: main
- language: sk
  script: Latn
  content: '2010/218/: Rozhodnutie Komisie zo 16. apríla 2010 , ktorým sa mení
