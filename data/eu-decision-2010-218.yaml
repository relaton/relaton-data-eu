title:
- language: en
  script: Latn
  content: '2010/218/: Commission Decision of 16 April 2010 amending Decision 2006/415/EC
    as regards certain protection measures in relation to an outbreak of highly pathogenic
    avian influenza of the subtype H5N1 in poultry in Romania (notified under document
    C(2010) 2348)'
  type: main
- language: fr
  script: Latn
  content: '2010/218/: Décision de la Commission du 16 avril 2010 modifiant la décision
    2006/415/CE concernant certaines mesures de protection relatives à un foyer d’influenza
    aviaire hautement pathogène du sous-type H5N1 chez des volailles en Roumanie
    [notifiée sous le numéro C(2010) 2348]'
  type: main
- language: de
  script: Latn
  content: '2010/218/: Beschluss der Kommission vom 16. April 2010 zur Änderung der
    Entscheidung 2006/415/EG im Hinblick auf Maßnahmen zum Schutz gegen einen Ausbruch
    der hoch pathogenen Aviären Influenza des Subtyps H5N1 bei Geflügel in Rumänien
    (Bekannt gegeben unter Aktenzeichen K(2010) 2348)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/218/ЕС: Решение на Комисията от 16 април
    2010 година за изменение на Решение 2006/415/ЕО във
    връзка с някои защитни мерки по отношение на
    огнище на високопатогенна инфлуенца по птиците
    от подтип H5N1 при домашни птици в Румъния (нотифицирано
    под номер C(2010) 2348)'
  type: main
- language: cs
  script: Latn
  content: '2010/218/: Rozhodnutí Komise ze dne 16. dubna 2010 , kterým se mění
    rozhodnutí 2006/415/ES, pokud jde o některá ochranná opatření týkající
    se ohniska vysoce patogenní influenzy ptáků podtypu H5N1 u drůbeže v Rumunsku
    (oznámeno pod číslem K(2010) 2348)'
  type: main
- language: da
  script: Latn
  content: '2010/218/: Kommissionens afgørelse af 16. april 2010 om ændring af beslutning
    2006/415/EF for så vidt angår visse beskyttelsesforanstaltninger over for et
    udbrud af højpatogen aviær influenza af subtype H5N1 hos fjerkræ i Rumænien
    (meddelt under nummer K(2010) 2348)'
  type: main
- language: el
  script: Grek
  content: '2010/218/: Απόφαση της Επιτροπής, της 16ης Απριλίου
    2010 , για τροποποίηση της απόφασης 2006/415/ΕΚ για
    τη λήψη ορισμένων μέτρων προστασίας λόγω της
    εμφάνισης κρουσμάτων γρίπης των πτηνών υψηλής
    παθογονικότητας του υποτύπου H5N1 σε πουλερικά
    στη Ρουμανία [κοινοποιηθείσα υπό τον αριθμό
    Ε(2010) 2348]'
  type: main
- language: et
  script: Latn
  content: '2010/218/: Komisjoni otsus, 16. aprill 2010 , millega muudetakse otsust
    2006/415/EÜ, milles käsitletakse teatavaid kaitsemeetmeid seoses alatüüpi
    H5N1 kuuluva kõrge patogeensusega linnugripi puhanguga Rumeenias (teatavaks tehtud
    numbri K(2010) 2348 all)'
  type: main
- language: fi
  script: Latn
  content: '2010/218/: Komission päätös, annettu 16 päivänä huhtikuuta 2010
    , päätöksen 2006/415/EY muuttamisesta siltä osin kuin on kyse korkeapatogeenisen
    lintuinfluenssan H5N1-alatyypin taudinpurkaukseen Romanian siipikarjassa liittyvistä
    tietyistä suojatoimenpiteistä (tiedoksiannettu numerolla K(2010) 2348)'
  type: main
- language: hr
  script: Latn
  content: '2010/218/EU: Odluka Komisije od 16. travnja 2010. o izmjeni Odluke 2006/415/EZ
    u pogledu određenih mjera zaštite u vezi s izbijanjem visoko patogene influence
    ptica podtipa H5N1 kod peradi u Rumunjskoj (priopćena pod brojem dokumenta C(2010)
    2348)'
  type: main
- language: hu
  script: Latn
  content: '2010/218/: A Bizottság határozata ( 2010. április 16.) a baromfiknál
    előforduló, H5N1 altípusú magas patogenitású madárinfluenza kitörése
    elleni egyes védekezési intézkedésekről szóló 2006/415/EK határozatnak
    Románia tekintetében történő módosításáról (az értesítés a C(2010)
    2348. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2010/218/: Decisione della Commissione, del 16 aprile 2010 , che modifica
    la decisione 2006/415/CE per quanto riguarda alcune misure di protezione a seguito
