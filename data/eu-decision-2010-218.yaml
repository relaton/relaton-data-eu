    v súvislosti s výskytom ohniska vysokopatogénnej vtáčej chrípky podtypu
    H5N1 u hydiny v Rumunsku [oznámené pod číslom K(2010) 2348]'
  type: main
- language: sl
  script: Latn
  content: '2010/218/: Sklep Komisije z dne 16. aprila 2010 o spremembi Odločbe 2006/415/ES
