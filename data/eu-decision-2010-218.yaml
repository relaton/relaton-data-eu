    H5N1 nel pollame in Romania [notificata con il numero C(2010) 2348]'
  type: main
- language: lv
  script: Latn
  content: '2010/218/: Komisijas Lēmums ( 2010. gada 16. aprīlis), ar ko groza Lēmumu
    2006/415/EK par dažiem aizsardzības pasākumiem saistībā ar augsti patogēnas
    H5N1 apakštipa putnu gripas uzliesmojumu mājputniem Rumānijā (izziņots ar
    dokumenta numuru C(2010) 2348)'
  type: main
- language: lt
  script: Latn
  content: '2010/218/: 2010 m. balandžio 16 d. Komisijos sprendimas, kuriuo iš dalies
    keičiamas Sprendimas 2006/415/EB dėl tam tikrų apsaugos priemonių, susijusių
    su labai patogeniško paukščių gripo, kurį naminiams paukščiams Rumunijoje
    sukėlė H5N1 potipio gripo virusas, protrūkiu (pranešta dokumentu Nr. C(2010)
    2348)'
  type: main
- language: mt
  script: Latn
  content: '2010/218/: Deċiżjoni tal-Kummissjoni tas- 16 ta’ April 2010 li temenda
