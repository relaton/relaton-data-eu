  content: Commission Regulation (EEC) No 1380/85 of 23 May 1985 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community and repealing Regulation (EEC) No 690/85
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1380/85 de la Commission, du 23 mai 1985, relatif à
