    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant le règlement (CEE) n 690/85
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1380/85 der Kommission vom 23. Mai 1985 über den
    Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der Gemeinschaft
    bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur Aufhebung der
    Verordnung (EWG) Nr. 690/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1380/85 af 23. maj 1985 om salg til
    forudfastsatte priser af visse former for oksekød fra interventionslagrene med
    henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 690/85
  type: main
