---
id: EURegulation28602000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2860/2000 of 27 December 2000 amending Regulation
    (EC) No 2316/1999 laying down detailed rules for the application of Council Regulation
    (EC) No 1251/1999 establishing a support system for producers of certain arable
    crops, to include flax and hemp grown for fibre, specifying the rules on set-aside
    areas and amending the base areas for Greece and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2860/2000 de la Commission du 27 décembre 2000 modifiant
    le règlement (CE) nº 2316/1999 portant modalités d'application du règlement
    (CE) nº 1251/1999 du Conseil instituant un régime de soutien aux producteurs
    de certaines cultures arables pour y inclure le lin et le chanvre destinés à
    la production de fibres, préciser les règles concernant les superficies gelées
    et modifier les superficies de base pour la Grèce et le Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2860/2000 der Kommission vom 27. Dezember 2000 zur
    Änderung der Verordnung (EG) Nr. 2316/1999 mit Durchführungsbestimmungen zur
    Verordnung (EG) Nr. 1251/1999 des Rates zur Einführung einer Stützungsregelung
    für Erzeuger bestimmter landwirtschaftlicher Kulturpflanzen zur Einbeziehung
    von Faserflachs und -hanf, zur Festlegung der Vorschriften für Stilllegungsflächen
    sowie zur Änderung der Grundflächen für Griechenland und Portugal
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2860/2000 ze dne 27. prosince 2000, kterým
    se mění nařízení (ES) č. 2316/1999, kterým se stanoví prováděcí pravidla
    k nařízení Rady (ES) č. 1251/1999 o režimu podpor pro producenty některých
    plodin na orné půdě tak, aby se vztahovalo na len a konopí pěstované na
    vlákno, byla určena pravidla pro plochy vyňaté z produkce a pozměněny základní
    plochy pro Řecko a Portugalsko
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2860/2000 af 27. december 2000 om ændring
    af forordning (EF) nr. 2316/1999 om gennemførelsesbestemmelser til Rådets forordning
    (EF) nr. 1251/1999 om indførelse af en støtteordning for producenter af visse
    markafgrøder for at medtage hør og hamp bestemt til fiberproduktion, præcisere
    reglerne om udtagne arealer og ændre basisarealerne for Grækenland og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2860/2000 της Επιτροπής,
    της 27ης Δεκεμβρίου 2000, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2316/1999 σχετικά με τις λεπτομέρειες
    εφαρμογής του κανονισμού (ΕΚ) αριθ. 1251/1999 του
    Συμβουλίου για τη θέσπιση καθεστώτος στήριξης
    των παραγωγών ορισμένων αροτραίων καλλιεργειών,
    ώστε να ενταχθούν σ' αυτό το λίνο και η κάνναβη
    με προορισμό την παραγωγή ινών, να διευκρινιστούν
    οι κανόνες όσον αφορά τις εκτάσεις που έχουν
    τεθεί υπό καθεστώς παύσης καλλιέργειας και
    να τροποποιηθούν οι βασικές εκτάσεις για την
    Ελλάδα και την Πορτογαλία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2860/2000, 27. detsember 2000, millega muudetakse
    määrust (EÜ) nr 2316/1999, milles sätestatakse teatavate põllukultuuride
    tootjate toetussüsteemi kehtestava nõukogu määruse (EÜ) nr 1251/1999 üksikasjalikud
    rakenduseeskirjad kiu tootmiseks kasvatatava lina ja kanepi hõlmamiseks, täpsustatakse
    tootmisest kõrvaldatud maa-alasid käsitlevaid eeskirju ning muudetakse Kreeka
    ja Portugali baaskülvipindu
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2860/2000, annettu 27 päivänä joulukuuta 2000,
    tukijärjestelmästä tiettyjen peltokasvien viljelijöille annetun neuvoston
    asetuksen (EY) N:o 1251/1999 soveltamista koskevista yksityiskohtaisista säännöistä
    annetun asetuksen (EY) N:o 2316/1999 muuttamisesta kuiduntuotantoon tarkoitetun
    pellavan ja hampun siihen sisällyttämiseksi, kesannoituja aloja koskevien sääntöjen
    täsmentämiseksi sekä Kreikan ja Portugalin perusalojen muuttamiseksi
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2860/2000/EK rendelete (2000. december 27.) a rostlennek és
    a rostkendernek a rendszerbe történő felvétele, a területpihentetésre vonatkozó
    szabályok, valamint Görögország és Portugália bázisterületeinek módosítása
    miatt az egyes szántóföldi növények termelői számára támogatási rendszer
    létrehozásáról szóló 1251/1999/EK tanácsi rendelet végrehajtására vonatkozó
    részletes szabályok meghatározásáról szóló 2316/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2860/2000 della Commissione, del 27 dicembre 2000,
    che modifica il regolamento (CE) n. 2316/1999 della Commissione, recante modalità
    di applicazione del regolamento (CE) n. 1251/1999 del Consiglio, che istituisce
    un regime di sostegno a favore dei coltivatori di taluni seminativi, al fine di
    includervi il lino e la canapa destinati alla produzione di fibre, precisare le
    disposizioni concernenti le superfici ritirate dalla produzione e modificare le
    superfici di base per la Grecia e il Portogallo
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2860/2000 (2000. gada 27. decembris), ar kuru
    groza Regulu (EK) Nr. 2316/1999, ar ko nosaka sīki izstrādātus piemērošanas
    noteikumus Padomes Regulai (EK) Nr. 1251/1999, ar kuru izveido atbalsta sistēmu
    noteiktu laukaugu audzētājiem, lai grozījumus attiecinātu uz šķiedras liniem
    un šķiedras kaņepēm, precizējot noteikumus attiecībā uz atmatā atstātajām
    platībām un grozot pamatplatības Grieķijai un Portugālei
  type: main
- language: lt
  script: Latn
  content: 2000 m. gruodžio 27 d. Komisijos reglamentas (EB) Nr. 2860/2000, iš dalies
    keičiantis Reglamentą (EB) Nr. 2316/1999, nustatantį išsamias Tarybos reglamento
    (EB) Nr. 1251/1999 dėl tam tikrų lauko kultūrų augintojų paramos sistemos
    sukūrimo taikymo taisykles, įtraukiantis į jo taikymo sritį pluoštinių linų
    ir kanapių pasėlius bei nustatantis taisykles dėl atskirtų plotų, ir iš
    dalies keičiantis Graikijos ir Portugalijos bazinius plotus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2860/2000 tas-27 ta’ Diċembru
    2000 li jemenda r-Regolament (KE) Nru 2316/1999 li jistabbilixxi regoli dettaljati
    għall-applikazzjoni tar-Regolament tal-Kunsill (KE) Nru 1251/1999 li jistabbilixxi
    sistema ta’ għajnuna għall-produtturi ta’ ċerti uċuħ tar-raba' tal-bagħli,
    sabiex jinkludu kittien u qanneb imkabbra għall-fibra, li jispeċifika r-regoli
    dwar iż-żoni mwarrba għall-mistrieħ u li jemenda ż-żoni bażi għall-Greċja
    u l-Portugall
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2860/2000 van de Commissie van 27 december 2000 tot
    wijziging van Verordening (EG) nr. 2316/1999 houdende uitvoeringsbepalingen van
    Verordening (EG) nr. 1251/1999 van de Raad tot instelling van een steunregeling
    voor producenten van bepaalde akkerbouwgewassen, met het oog op opname van vezelvlas
    en -hennep, verduidelijking van de voorschriften inzake braakgelegd areaal en
    wijziging van de basisarealen voor Griekenland en Portugal
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2860/2000 z dnia 27 grudnia 2000 r. zmieniające
    rozporządzenie (WE) nr 2316/1999 ustanawiające szczegółowe zasady stosowania
    rozporządzenia Rady (WE) nr 1251/1999 ustanawiającego system wsparcia dla producentów
    niektórych roślin uprawnych w celu włączenia do nich lnu i konopi przeznaczonych
    do wytwarzania włókien, określenia przepisów dotyczących gruntów odłogowanych
    i zmiany powierzchni podstawowych dla Grecji i Portugalii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2860/2000 da Comissão, de 27 de Dezembro de 2000,
    que altera o Regulamento (CE) n.o 2316/1999 que estabelece normas de execução
    do Regulamento (CE) n.o 1251/1999 do Conselho que institui um sistema de apoio
    aos produtores de determinadas culturas arvenses, a fim de nele incluir o linho
    e o cânhamo destinados à produção de fibras, especificar as normas relativas
    às superfícies retiradas da produção e alterar as superfícies de base no
    que diz respeito à Grécia e a Portugal
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2860/2000 z 27. decembra 2000, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2316/1999 stanovujúce podrobné pravidlá uplatňovania
    nariadenia Rady (ES) č. 1251/1999 zakladajúceho systém podpory pre pestovateľov
    určitých plodín na ornej pôde s cieľom zahrnúť ľan a konope pestované
    na vlákno, špecifikujúceho pravidlá o plochách vyňatých z obrábania, a
    ktorým sa menia a dopĺňajú základné plochy pre Grécko a Portugalsko
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2860/2000 z dne 27. decembra 2000 o spremembi
    Uredbe (ES) št. 2316/1999 o določitvi podrobnih pravil za uporabo Uredbe Sveta
    (ES) št. 1251/1999 o uvedbi sistema podpor za pridelovalce določenih poljščin,
    zaradi vključitve lana in konoplje, ki se gojita za vlakna, ter določitvi pravil
    za površine v prahi in spremembi osnovnih površin za Grčijo in Portugalsko
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2860/2000 de la Comisión, de 27 de diciembre de 2000,
    por el que se modifica el Reglamento (CE) nº 2316/1999 que establece las disposiciones
    de aplicación del Reglamento (CE) nº 1251/1999 del Consejo por el que se establece
    un régimen de apoyo a los productores de determinados cultivos herbáceos, para
    incluir el lino y el cáñamo destinados a la producción de fibras, precisar
    las normas relativas a las superficies retiradas y modificar las superficies básicas
    de Grecia y Portugal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2860/2000 av den 27 december 2000 om
    ändring av förordning (EG) nr 2316/1999 om tillämpningsföreskrifter till rådets
    förordning (EG) nr 1251/1999 om upprättande av ett stödsystem för producenter
    av vissa jordbruksgrödor för att däri inbegripa lin och hampa som odlas för
    fiberproduktion, fastställa regler för arealuttag samt ändra basarealerna för
    Grekland och Portugal
  type: main
