title:
- language: en
  script: Latn
  content: '78/967/EEC: Commission Decision of 14 November 1978 on the reimbursement
    by the Guidance Section of the EAGGF to the Federal Republic of Germany of expenditure
    incurred during 1975 on aids and premiums relating to the modernization of farms
    including those in the less-favoured farming areas'
  type: main
- language: fr
  script: Latn
  content: '78/967/CEE: Décision de la Commission, du 14 novembre 1978, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", à la République fédérale d''Allemagne des dépenses
    effectuées pendant l''année 1975 pour les aides et primes relatives à la modernisation
    des exploitations agricoles, y compris dans les zones agricoles défavorisées'
  type: main
- language: de
  script: Latn
  content: '78/967/EWG: Entscheidung der Kommission vom 14. November 1978 über die
    Rückvergütung durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1975 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an die Bundesrepublik Deutschland'
  type: main
- language: da
  script: Latn
  content: '78/967/EØF: Kommissionens beslutning af 14. november 1978 om refusion
    gennem EUGFL, udviklingssektionen, til Forbundsrepublikken Tyskland af udgifter,
    som er afholdt i løbet af året 1975 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter, også i ugunstigt stillede områder'
  type: main
- language: it
  script: Latn
  content: '78/967/CEE: Decisione della Commissione, del 14 novembre 1978, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica federale
    di Germania delle spese effettuate durante il 1975 per gli aiuti ed i premi relativi
    all'' ammodernamento delle aziende agricole, comprese quelle nelle zone agricole
    svantaggiate'
  type: main
- language: nl
  script: Latn
  content: '78/967/EEG: Beschikking van de Commissie van 14 november 1978 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland
    voor de in 1975 verrichte uitgaven voor steun en premies met betrekking tot de
    modernisering van landbouwbedrijven waaronder mede begrepen die in probleemgebieden
    in de landbouw'
  type: main
