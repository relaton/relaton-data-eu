    vnímavých k virové hemoragické septikémii a odstranění položky týkající
    se epizootického vředového syndromu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesdirektiv 2012/31/EU af 25. oktober 2012 om
