    lista de espécies de peixes sensíveis à septicemia hemorrágica viral e à
    supressão da entrada relativa à síndrome ulcerativa epizoótica
  type: main
- language: ro
  script: Latn
  content: Directiva de punere în aplicare 2012/31/UE a Comisiei din 25 octombrie
