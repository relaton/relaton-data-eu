title:
- language: en
  script: Latn
  content: Commission Implementing Directive 2012/31/EU of 25 October 2012 amending
    Annex IV to Council Directive 2006/88/EC as regards the list of fish species susceptible
    to Viral haemorrhagic septicaemia and the deletion of the entry for Epizootic
    ulcerative syndrome
  type: main
- language: fr
  script: Latn
  content: Directive d’exécution 2012/31/UE de la Commission du 25 octobre 2012
    modifiant l’annexe IV de la directive 2006/88/CE en ce qui concerne la liste
    des espèces de poissons sensibles à la septicémie hémorragique virale et la
    suppression de l’inscription du syndrome ulcéreux épizootique
  type: main
- language: de
  script: Latn
  content: Durchführungsrichtlinie 2012/31/EU der Kommission vom 25. Oktober 2012
    zur Änderung des Anhangs IV der Richtlinie 2006/88/EG des Rates in Bezug auf
    die Liste der Fischarten, die für virale hämorrhagische Septikämie empfänglich
    sind, und zur Streichung des Eintrags bezüglich des epizootisches ulzerativen
    Syndroms
  type: main
- language: bg
  script: Cyrl
  content: Директива за изпълнение 2012/31/ЕС на Комисията
