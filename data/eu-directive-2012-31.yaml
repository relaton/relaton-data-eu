    на списъка на видове риба, възприемчиви към
    вирусна хеморагична септицемия, и заличаването
    на вписването за епизоотичен синдром (Epizootic
    ulcerative syndrome)
  type: main
- language: cs
  script: Latn
  content: Prováděcí směrnice Komise 2012/31/EU ze dne 25. října 2012 , kterou
