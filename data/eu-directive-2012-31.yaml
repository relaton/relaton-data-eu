    osin kuin on kyse virusperäiselle verenvuotoseptikemialle alttiiden kalalajien
    luettelosta ja epitsoottista ulseratiivista syndroomaa koskevan kohdan poistamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena direktiva Komisije 2012/31/EU od 25. listopada 2012. o izmjeni
