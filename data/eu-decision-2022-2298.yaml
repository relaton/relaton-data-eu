title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2298 of 23 November 2022 postponing
    the expiry date of the approval of propiconazole for use in biocidal products
    of product-type 8 in accordance with Regulation (EU) No 528/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2298 de la Commission du 23 novembre
    2022 reportant la date d’expiration de l’approbation du propiconazole en vue
    de son utilisation dans les produits biocides relevant du type de produits 8,
    conformément au règlement (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2298 der Kommission vom 23. November
    2022 zur Verschiebung des Ablaufdatums der Genehmigung von Propiconazol zur Verwendung
    in Biozidprodukten der Produktart 8 gemäß der Verordnung (EU) Nr. 528/2012 des
    Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/2298 на Комисията
    от 23 ноември 2022 година за отлагане на датата
    на изтичане на срока на одобрението на пропиконазол
    за употреба в биоциди от продуктов тип 8 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/2298 ze dne 23. listopadu 2022,
    kterým se odkládá datum skončení platnosti schválení propikonazolu pro
    použití v biocidních přípravcích typu 8 v souladu s nařízením Evropského
    parlamentu a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2298 af 23. november
    2022 om forlængelse af godkendelsen af propiconazol til anvendelse i biocidholdige
    produkter af produkttype 8, jf. Europa-Parlamentets og Rådets forordning (EU)
    nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/2298 της Επιτροπής
    της 23ης Νοεμβρίου 2022 για τη μετάθεση της ημερομηνίας
    λήξης της έγκρισης της προπικοναζόλης (propiconazole)
    για χρήση σε βιοκτόνα του τύπου προϊόντων 8
    σύμφωνα με τον κανονισμό (ΕΕ) αριθ. 528/2012 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/2298, 23. november 2022, millega lükatakse
    edasi tooteliiki 8 kuuluvates biotsiidides propikonasooli kasutamise heakskiidu
    aegumiskuupäeva vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) nr
    528/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/2298, annettu 23 päivänä
    marraskuuta 2022, propikonatsolin käyttöä valmisteryhmään 8 kuuluvissa biosidivalmisteissa
    koskevan hyväksymisen voimassaolon päättymispäivän lykkäämisestä Euroopan
    parlamentin ja neuvoston asetuksen (EU) N:o 528/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2298 ón gCoimisiún an 23 Samhain
    2022 lena gcuirtear ar atráth dáta éaga an fhormheasa maidir le própaconasól
    lena úsáid i dtáirgí bithicídeacha de chineál táirge 8 i gcomhréir le
    Rialachán (AE) Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/2298 оd 23. studenoga 2022. o odgodi
    isteka odobrenja propikonazola za uporabu u biocidnim proizvodima vrste 8 u skladu
    s Uredbom (EU) br. 528/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2298 végrehajtási határozata (2022. november
    23.) a propikonazol 8. terméktípusba tartozó biocid termékekben történő
    felhasználására vonatkozó jóváhagyás érvényességi idejének az 528/2012/EU
    európai parlamenti és tanácsi rendelettel összhangban történő meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2298 della Commissione del 23 novembre
    2022 che posticipa la data di scadenza dell’approvazione del propiconazolo ai
    fini del suo uso nei biocidi del tipo di prodotto 8 conformemente al regolamento
    (UE) n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/2298 (2022. gada 23. novembris),
    ar ko uz vēlāku laiku pārceļ datumu, līdz kuram lietošanai 8. produkta veida
    biocīdos saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 528/2012
    ir apstiprināts propikonazols
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2298 2022 m. lapkričio 23
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 528/2012 nukeliama
    patvirtinimo, kad propikonazolą galima naudoti 8-o tipo biocidiniams produktams
    gaminti, galiojimo pabaigos data
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2298 tat-23
    ta’ Novembru 2022 li tipposponi l-iskadenza tal-approvazzjoni tal-propikonażol
    għall-użu fil-prodotti bijoċidali tat-tip ta’ prodott 8 f’konformità mar-Regolament
    (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2298 van de Commissie van 23 november 2022
    tot verlenging van de termijn voor het verstrijken van de goedkeuring van propiconazool
    voor gebruik in biociden van productsoort 8 overeenkomstig Verordening (EU) nr.
    528/2012 van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2298 z dnia 23 listopada 2022 r. przedłużająca
    ważność zatwierdzenia propikonazolu do stosowania w produktach biobójczych
    należących do grupy produktowej 8 zgodnie z rozporządzeniem Parlamentu Europejskiego
    i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2298 da Comissão de 23 de novembro de
    2022 que prorroga a validade da aprovação do propiconazol para utilização
    em produtos biocidas do tipo 8 em conformidade com o Regulamento (UE) n.o 528/2012
    do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2298 a Comisiei din 23 noiembrie
    2022 de amânare a datei de expirare a aprobării substanței propiconazol pentru
    a fi utilizată în produse biocide aparținând tipului de produs 8 în conformitate
    cu Regulamentul (UE) nr. 528/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/2298 z 23. novembra 2022, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (EÚ) č. 528/2012 odkladá
    dátum skončenia platnosti schválenia propikonazolu na použitie v biocídnych
    výrobkoch typu 8
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/2298 z dne 23. novembra 2022 o odložitvi
    datuma izteka odobritve propikonazola za uporabo v biocidnih proizvodih vrste
    proizvodov 8 v skladu z Uredbo (EU) št. 528/2012 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/2298 de la Comisión de 23 de noviembre
    de 2022 por la que se retrasa la fecha de expiración de la aprobación del propiconazol
    para su uso en biocidas del tipo de producto 8, de conformidad con el Reglamento
    (UE) n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/2298 av den 23 november 2022
    om senareläggande av det datum då godkännandet av propikonazol för användning
    i biocidprodukter i produkttyp 8 löper ut i enlighet med Europaparlamentets och
    rådets förordning (EU) nr 528/2012
