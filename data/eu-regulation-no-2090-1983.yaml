title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2090/83 of 25 July 1983 amending for the
    third time Regulation (EEC) No 546/83 laying down provisions for distillation
    of table wine pursuant to Article 15 (2) of Regulation (EEC) No 337/79 and altering
    the reduction in the quantities of table wine covered by declarations and contracts
    concluded
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2090/83 de la Commission du 25 juillet 1983 portant
    troisième modification du règlement (CEE) no 546/83 établissant les dispositions
    relatives à une distillation de vin de table en vertu de l' article 15 paragraphe
    2 du règlement (CEE) no 337/79 et modifiant la réduction des quantités de vin
    de table figurant dans les déclarations et contrats souscrits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2090/83 der Kommission vom 25. Juli 1983 zur dritten
    Änderung der Verordnung (EWG) Nr. 546/83 mit den Bestimmungen für die Destillation
    von Tafelwein gemäß Artikel 15 Absatz 2 der Verordnung (EWG) Nr. 337/79 und
    zur Änderung der Verringerung der Mengen Tafelwein, die in den unterzeichneten
    Erklärungen und Verträgen aufgeführt sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2090/83 af 25. juli 1983 om tredje
    ændring af forordning (EØF) nr. 546/83 om bestemmelserne vedrørende destillation
    af bordvin i henhold til artikel 15, stk. 2, i forordning (EØF) nr. 337/79 og
    om ændring af nedsættelsen af de mængder bordvin, der er anført i erklæringerne
    og kontrakterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2090/83 της Επιτροπής
    της 25ης Ιουλίου 1983 για την τρίτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 546/83 περί καθορισμού
    των διατάξεων σχετικά με την απόσταξη επιτραπέζιου
    οίνου δυνάμει του άρθρου 15 παράγραφος 2 του
    κανονισμού (ΕΟΚ) αριθ. 337/79 και για τροποποίηση
    της μείωσης των ποσοτήτων επιτραπέζιου οίνου
    που περιλαμβάνουν οι δηλώσεις και τα συμφωνητικά
    που έχουν συναφθεί
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2090/83 della Commissione del 25 luglio 1983 recante
    terza modifica del regolamento (CEE) n. 546/83, che stabilisce le norme relative
    a una distillazione di vino da tavola a norma dell' articolo 15, paragrafo 2,
    del regolamento (CEE) n. 337/79 e modifica la riduzione dei quantitativi di vino
    da tavola che figurano nelle dichiarazioni e nei contratti sottoscritti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2090/83 van de Commissie van 25 juli 1983 houdende
    derde wijziging van Verordening (EEG) nr. 546/83 tot vaststelling van de bepalingen
    inzake distillatie van tafelwijn op grond van artikel 15, lid 2, van Verordening
    (EEG) nr. 337/79 en tot wijziging van de verlaging die moet worden toegepast op
    de hoeveelheden van tafelwijn vermeld in de verklaringen en de gesloten contracten
  type: main
