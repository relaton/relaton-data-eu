title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1653/1999 of 27 July 1999 specifying the
    extent to which applications lodged in July 1999 for import rights in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1653/1999 de la Commission, du 27 juillet 1999, déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de juillet 1999 pour les jeunes bovins mâles destinés à
    l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1653/1999 der Kommission vom 27. Juli 1999 über das
    Ausmaß, in dem den im Juli 1999 eingereichten Anträgen auf Einfuhrrechte für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1653/1999 af 27. juli 1999 om fastsættelse
    af, i hvilket omfang ansøgninger om importrettigheder, som er indsendt i juli
    1999 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1653/1999 της Επιτροπής,
    της 27ης Ιουλίου 1999, για καθορισμό σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    δικαίωμα εισαγωγής που υποβλήθηκαν τον Ιούλιο
    1999 για τα νεαρά άρρενα βοοειδή που προορίζονται
    για πάχυνση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1653/1999, annettu 27 päivänä heinäkuuta
    1999, nuorten urospuolisten lihotukseen tarkoitettujen nautojen heinäkuussa 1999
    esitettyjen tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1653/1999 della Commissione, del 27 luglio 1999, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto d'importazione
    presentate nel mese di luglio 1999 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1653/1999 van de Commissie van 27 juli 1999 tot bepaling
    van de mate waarin de in juli 1999 ingediende aanvragen om een invoerrecht voor
    jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1653/1999 da Comissão, de 27 de Julho de 1999, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados no mês de Julho de 1999 para os bovinos machos jovens destinados
    à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1653/1999 de la Comisión, de 27 de julio de 1999,
    que determina en qué medida podrá darse curso a las solicitudes de derechos
    de importación presentadas en el mes de julio de 1999 para los machos jóvenes
    de la especie bovina destinados al engorde
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1653/1999 av den 27 juli 1999 om i vilken
