title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1198/2003 of 3 July 2003 specifying the extent
    to which applications lodged in June 2003 for import rights in respect of young
    male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1198/2003 de la Commission du 3 juillet 2003 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de juin 2003 pour les jeunes bovins mâles destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1198/2003 der Kommission vom 3. Juli 2003 über das
    Ausmaß, in dem den im Juni 2003 eingereichten Anträgen auf Einfuhrrechte für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1198/2003 af 3. juli 2003 om fastsættelse
    af, i hvilket omfang ansøgninger om importrettigheder, som er indsendt i juni
    2003 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1198/2003 της Επιτροπής,
    της 3ης Ιουλίου 2003, για καθορισμό σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    δικαίωμα εισαγωγής που υποβλήθηκαν τον Ιούνιο
    2003 για τα νεαρά άρρενα βοοειδή που προορίζονται
    για πάχυνση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1198/2003, annettu 3 päivänä heinäkuuta 2003,
    nuorten urospuolisten lihotukseen tarkoitettujen nautojen kesäkuussa 2003 esitettyjen
    tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1198/2003 della Commissione, del 3 luglio 2003, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto d'importazione
    presentate nel mese di giugno 2003 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1198/2003 van de Commissie van 3 juli 2003 tot bepaling
    van de mate waarin de in juni 2003 ingediende aanvragen om een invoerrecht voor
    jonge mannelĳke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1198/2003 da Comissão, de 3 de Julho de 2003, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados no mês de Junho de 2003 para os bovinos machos jovens destinados
    à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1198/2003 de la Comisión, de 3 de julio de 2003, que
    determina en qué medida podrá darse curso a las solicitudes de derechos de importación
    presentadas en el mes de junio de 2003 para los bovinos machos jóvenes destinados
    al engorde
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1198/2003 av den 3 juli 2003 om i vilken
