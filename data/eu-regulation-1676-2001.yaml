title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1676/2001 of 13 August 2001 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duty imposed on
    imports of polyethylene terephthalate film originating in India and the Republic
    of Korea
  type: main
- language: fr
  script: Latn
