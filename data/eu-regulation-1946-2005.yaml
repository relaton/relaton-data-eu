    в полза на страни и територии, участващи или
    свързани с процеса на стабилизиране и асоцииране,
    осъществяван от Европейския съюз
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1946/2005 ze dne 14. listopadu 2005 , kterým
