title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1946/2005 of 14 November 2005 amending Regulation
    (EC) No 2007/2000 introducing exceptional trade measures for countries and territories
    participating in or linked to the European Union’s Stabilisation and Association
    process
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1946/2005 du Conseil du 14 novembre 2005 modifiant
    le règlement (CE) n o 2007/2000 introduisant des mesures commerciales exceptionnelles
    en faveur des pays et des territoires participants ou liés au processus de stabilisation
    et d’association mis en œuvre par l’Union européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1946/2005 des Rates vom 14. November 2005 zur Änderung
    der Verordnung (EG) Nr. 2007/2000 zur Einführung besonderer Handelsmaßnahmen
    für die am Stabilisierungs- und Assoziierungsprozess der Europäischen Union
    teilnehmenden oder damit verbundenen Länder und Gebiete
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1946/2005 на Съвета от 14 ноември
