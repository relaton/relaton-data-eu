    em favor dos países e territórios que participam ou estão ligados ao processo
    de estabilização e associação da União Europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1946/2005 al Consiliului din 14 noiembrie 2005 de
    modificare a Regulamentului (CE) nr. 2007/2000 privind introducerea de măsuri
    comerciale excepționale în favoarea țărilor și teritoriilor participante
    sau legate de procesul de stabilizare și asociere pus în aplicare de către
    Uniunea Europeană
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1946/2005 zo 14. novembra 2005 , ktorým sa mení
