    obchodní opatření pro země a území účastnící se procesu stabilizace
    a přidružení zavedeného Evropskou unií či s tímto procesem spjaté
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1946/2005 af 14. november 2005 om ændring
    af forordning (EF) nr. 2007/2000 om exceptionelle handelsforanstaltninger for
