    ειδικού φόρου κατανάλωσης επί της βενζίνης
    που διανέμεται από πρατήρια καυσίμων τα οποία
    τηρούν ορισμένα πρότυπα εξοπλισμού και εκμετάλλευσης,
    σύμφωνα με τη διαδικασία που προβλέπεται στο
    άρθρο 8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '2001/710/EY: Neuvoston päätös, tehty 27 päivänä syyskuuta 2001,
    luvan antamisesta Tanskalle soveltaa eriytettyä valmisteverokantaa sellaisen
    polttoaineen osalta, jonka jakelu tapahtuu laite- ja toimintastandardit täyttävillä
    huoltoasemilla direktiivin 92/81/ETY 8 artiklan 4 kohdassa säädettyä menettelyä
    noudattaen'
  type: main
- language: it
  script: Latn
  content: '2001/710/CE: Decisione del Consiglio, del 27 settembre 2001, che autorizza
    la Danimarca ad applicare aliquote d''accisa differenziate alla benzina venduta
    dalle stazioni di servizio che rispettano certe norme di equipaggiamento e di
    gestione secondo la procedura di cui all''articolo 8, paragrafo 4, della direttiva
    92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '2001/710/EG: Beschikking van de Raad van 27 september 2001 waarbĳ Denemarken
    wordt gemachtigd om overeenkomstig de procedure van artikel 8, lid 4, van Richtlĳn
    92/81/EEG een gedifferentieerde accĳns te heffen op benzine die wordt verkocht
