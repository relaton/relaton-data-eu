title:
- language: en
  script: Latn
  content: '2001/710/EC: Council Decision of 27 September 2001 authorising Denmark,
    in accordance with the procedure provided for in Article 8(4) of Directive 92/81/EEC,
    to apply a differentiated rate of excise duty to petrol distributed by petrol
    stations meeting certain standards of equipment and operation'
  type: main
- language: fr
  script: Latn
  content: '2001/710/CE: Décision du Conseil du 27 septembre 2001 autorisant le Danemark
    à appliquer un taux différencié de droits d''accise en faveur de l''essence
    distribuée par des stations-service respectant certaines normes d''équipement
    et d''exploitation, conformément à la procédure prévue par l''article 8, paragraphe
    4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '2001/710/EG: Entscheidung des Rates vom 27. September 2001 zur Ermächtigung
    Dänemarks, die Verbrauchsteuer auf Benzin zu staffeln, das von Tankstellen abgegeben
    wird, die bestimmte Ausrüstungs- und Betriebsnormen erfüllen — Verfahren gemäß
    Artikel 8 Absatz 4 der Richtlinie 92/81/EWG'
  type: main
- language: da
  script: Latn
  content: '2001/710/EF: Rådets beslutning af 27. september 2001 om bemyndigelse
    af Danmark til at anvende en differentieret afgift for benzin ved salg fra tankstationer,
    der opfylder visse regler for indretning og drift, i overensstemmelse med proceduren
    i artikel 8, stk. 4, i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '2001/710/ΕΚ: Απόφαση του Συμβουλίου, της 27ης
