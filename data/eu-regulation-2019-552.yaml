    annexes II et III du règlement (CE) n° 396/2005 du Parlement européen et du
    Conseil en ce qui concerne les limites maximales applicables aux résidus d'azoxystrobine,
    de bicyclopyrone, de chlorméquat, de cyprodinil, de difénoconazole, de fenpropimorphe,
    de fenpyroximate, de fluopyrame, de fosétyl, d'isoprothiolane, d'isopyrazam,
    d'oxamyl, de prothioconazole, de spinétoram, de trifloxystrobine et de triflumézopyrim
