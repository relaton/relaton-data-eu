- language: en
  script: Latn
  content: Commission Regulation (EU) 2019/552 of 4 April 2019 amending Annexes II
    and III to Regulation (EC) No 396/2005 of the European Parliament and of the Council
    as regards maximum residue levels for azoxystrobin, bicyclopyrone, chlormequat,
    cyprodinil, difenoconazole, fenpropimorph, fenpyroximate, fluopyram, fosetyl,
    isoprothiolane, isopyrazam, oxamyl, prothioconazole, spinetoram, trifloxystrobin
    and triflumezopyrim in or on certain products
  type: main
