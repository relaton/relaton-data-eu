    της 15ης Σεπτεμβρίου 1986 για την καθιέρωση μιας
    «a posteriori» επιτήρησης ορισμένων γεωργικών προϊόντων
    καταγωγής ΗΠΑ που τίθενται σε κατανάλωση στην
    Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2845/86 della Commissione del 15 settembre 1986 che
    istituisce un controllo "a posteriori" su taluni prodotti agricoli originari degli
    Stati Uniti d' America immessi in consumo in Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2845/86 van de Commissie van 15 september 1986 tot
    instelling van toezicht ,,a posteriori" op bepaalde landbouwprodukten van oorsprong
    uit de Verenigde Staten van Amerika die in Spanje tot verbruik worden ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2845/86 da Comissão de 15 de Setembro de 1986 que
    instaura uma vigilância "a posteriori" de determinados produtos agrícolas originários
    dos Estados Unidos da América que são introduzidos no consumo em Espanha
  type: main
- language: es
