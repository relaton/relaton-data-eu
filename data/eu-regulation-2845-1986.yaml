title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2845/86 of 15 September 1986 introducing
    'a posteriori' monitoring for certain agricultural products originating in the
    United States of America and released for consumption in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2845/86 de la Commission du 15 septembre 1986 instaurant
    une surveillance a posteriori de certains produits agricoles originaires des États-Unis
    d' Amérique qui sont mis à la consommation en Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2845/86 der Kommission vom 15. September 1986 über
    die Einführung einer nachträglichen Überwachung für einige landwirtschaftliche
    Erzeugnisse mit Ursprung in den Vereinigten Staaten von Amerika, welche in Spanien
    in den zoll- und steuerrechtlich freien Verkehr überführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2845/86 af 15. september 1986 om et
    efterfølgende tilsyn med visse landbrugsprodukter, som har oprindelse i Amerikas
    Forenede Stater og overgår til frit forbrug i Spanien
  type: main
- language: el
  script: Grek
