title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3960/89 of 20 December 1989 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1990
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3960/89 de la Commission du 20 décembre 1989 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1990 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3960/89 DER KOMMISSION vom 20. Dezember 1989 zur Festsetzung
    des Pauschalwerts fuer das Fischwirtschaftsjahr 1990 fuer die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3960/89 af 20. december 1989 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1990
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3960/89 της Επιτροπής
    της 20ής Δεκεμβρίου 1989 περί καθορισμού της κατ'
    αποκοπήν αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1990
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3960/89 DELLA COMMISSIONE del 20 dicembre 1989 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1990
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3960/89 VAN DE COMMISSIE van 20 december 1989 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1990 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3960/89 DA COMISSAO de 20 de Dezembro de 1989 que
    fixa, para efeitos do calculo da compensaçao financeira e do adiantamento que
    lhe diz respeito, o valor forfetario dos produtos retirados do mercado durante
    a campanha de pesca de 1990
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3960/89 DE LA COMISION de 20 de diciembre de 1989 por
    el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campana pesquera de 1990, que ha de utilizarse en el calculo
    de la compensacion financiera y del anticipo relacionado con ésta
  type: main
