title:
- language: en
  script: Latn
  content: '78/966/EEC: Commission Decision of 13 November 1978 authorizing the United
    Kingdom not to apply Community treatment to handkerchiefs (excluding embroidered
    handkerchiefs) of woven cotton, man-made fibres or flax, falling within heading
    No ex 61.05 of the Common Customs Tariff, originating in Czechoslovakia and in
    free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/966/CEE: Décision de la Commission, du 13 novembre 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les mouchoirs (à l'' exclusion
    des mouchoirs brodés) en coton tissé, en fibres textiles artificielles et synthétiques,
    et lin de la position ex 61.05 du tarif douanier commun, originaires de Tchécoslovaquie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/966/EWG: Entscheidung der Kommission vom 13. November 1978, mit der
    das Vereinigte Königreich ermáchtigt wird, aus der Tschechoslowakei stammende
    und in den úbrigen Mitgliedstaaten im freien Verkehr befindliche Taschentúcher
    (mit Ausnahme von bestickten) aus gewebter Baumwolle, Kunstfasern oder Leinen,
    der Tarifnummer ex 61.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/966/EØF: Kommissionens beslutning af 13. november 1978 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage lommetørklæder
    (bortset fra broderede lommetørklæder), af vævet bomuld, syntetiske fibre eller
    linned, som henhører under pos. ex 61.05 i den fælles toldtarif, har oprindelse
    i Tjekkoslovakiet og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/966/CEE: Decisione della Commissione, del 13 novembre 1978, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i fazzoletti (ad eccezione
    di quelli ricamati) di cotone, di fibre tessili artificiali e sintetiche e di
    lino, della voce ex 61.05 della tariffa doganale comune, originari della Cecoslovacchia
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/966/EEG: Beschikking van de Commissie van 13 november 1978 waarbij
    het Verenigd Koninkrijk wordt gemachtigd zakdoeken (met uitzondering van geborduurde
    zakdoeken) in geweven katoen, van synthetische of kunstmatige textielvezels, van
    post ex 61.05 van het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
