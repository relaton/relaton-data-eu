    und 40.0260) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1873/92 af 6. juli 1992 om genindførelse
